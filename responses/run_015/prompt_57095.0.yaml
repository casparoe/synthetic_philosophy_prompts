      *   **Audience:** Advanced graduate students (bored by standard inverted spectrum/zombie dialectics, know the literature).
      *   **Constraints:** No bibliography/sources list. Argue from cases, not authority. No fence-sitting conclusion ("subtle," "reasonable people differ"). Must state a verdict, the key premise, and the condition for abandoning it.
      *   **Required Apparatus (Must use all three):**
          1.  *Calibration Qualia:* Qualia as relational (current state + stored template). Does this save realism or collapse into functionalism? Identify the collapse point.
          2.  *Instrumented Variant:* Tasters have perfect knowledge of internal states (access premise removed). Does the anti-qualia argument survive? (Tests if the argument is about introspection limits vs. conceptual incoherence).
          3.  *Silent Inversion:* Phenomenology inverted + memory/calibration adjusted so no trace remains. Does this show feel is trace-less or drained of content?
      *   **Specific Focus:** Explicitly address the traditional marks of qualia (ineffability, intrinsicness, privacy, privileged apprehensibility). Consider a defender who surrenders ineffability/privacy but keeps intrinsicness.
      *   **Tone:** Rigorous, analytical, philosophical, avoiding paraphrase of canonical texts.

  2.  **Deconstruct the Core Question & Verdicts:**

      *   *Incoherent:* The concept itself contains contradictions (e.g., something intrinsic yet relational, or private yet causal).
      *   *Unverifiable:* The concept makes sense, but we can't know if it obtains (epistemic barrier).
      *   *Explanatorily Idle:* It exists but does no work (epiphenomenal).
      *   *Dennett's Stance:* Usually argues for incoherence (the "Quining Qualia" move), but often gets read as arguing for idleness or unverifiability.
      *   *My Task:* I need to pick a lane. Given the prompt's constraints (especially the "Silent Inversion" and "Instrumented" cases), arguing for *incoherence* seems the strongest path, but I need to be careful not to just repeat Dennett. I need to use the new apparatus to sharpen the blade.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. The coffee tasters case. The three verdicts (Incoherent, Unverifiable, Idle). Thesis statement.
      *   **The Three Verdicts:** Define them clearly. Why sliding between them is a mistake.
      *   **Apparatus 1: Calibration Qualia:** Analyze the relational move. Does it save intrinsicness?
          *   *Analysis:* If the quale is the relation between state $S$ and Template $T$, is it intrinsic? No, it's relational. If the realist wants intrinsicness, this fails. If they accept relationality, it looks like functional discrimination.
