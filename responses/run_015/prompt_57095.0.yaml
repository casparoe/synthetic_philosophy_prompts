answer: |-
  The case of the veteran coffee tasters is designed to exhaust the explanatory utility of the traditional qualia concept. Two experts, equally skilled, report a change in their coffee experience over time. One claims the coffee tastes different (the quale has shifted); the other claims the coffee tastes the same but their reaction has changed (the hedonic tone has shifted). Crucially, no amount of introspection or behavioral testing can adjudicate between them. Daniel Dennett deploys this case to suggest that the traditional notion of qualia is a philosophical fiction. However, the secondary literature often blurs the specific metaphysical indictment being leveled. To revise the assignment effectively, we must distinguish three distinct verdicts on qualia: that they are *incoherent* (the concept involves a logical contradiction), that they are *unverifiable* (the concept is meaningful but epistemically inaccessible), or that they are *explanatorily idle* (they exist but do no causal work).

  These verdicts are not interchangeable. If qualia are merely unverifiable, realism remains tenable; there is a fact of the matter, we just cannot reach it. If they are explanatorily idle, they exist as epiphenomenal danglers, ontologically real but causally inert. If they are incoherent, there is no fact of the matter because the description picks out nothing possible. The coffee tasters case is often read as an argument from the poverty of introspection, which would support only the *unverifiable* verdict. However, by subjecting the case to three specific theoretical stress tests—*calibration qualia*, the *instrumented variant*, and the *silent inversion*—we can determine whether the failure of qualia is epistemic or ontological. The analysis below argues that the traditional characterization of qualia is incoherent, not merely elusive, because it demands properties that cannot be jointly instantiated in a physical cognitive system.

  Consider first the rescue hypothesis of *calibration qualia*. On this view, the tasters' disagreement is not about a freestanding intrinsic feel, but about a relational property: the pairing of a current sensory state with a stored reference standard. The quale is not the taste itself, but the output of a comparison between the taste and a calibration template. This attempts to preserve the reality of the experience while naturalizing it. The realist hopes this saves the "what-it-is-like" character by grounding it in a specific neural comparison process.

  However, this hypothesis collapses into functionalism at the precise point where the calibration template must be cashed out. For the template to function as a standard, it must be stored physically and accessed computationally. If the template is a physical state, the "comparison" is a physical operation. If the tasters disagree about whether the template or the taste changed, they are disagreeing about the functional architecture of their discrimination system. A realist about qualia typically demands *intrinsicness*—that the quale is a non-relational property of the experience itself. By making the quale relational (state $S$ relative to template $T$), the calibration hypothesis surrenders intrinsicness. If the realist accepts this surrender to save the phenomenon, they have ceased to defend qualia as traditionally characterized and are now defending functional discrimination states. The collapse occurs when we ask what determines the accuracy of the calibration. If the accuracy is determined by behavioral success, we are in functionalist territory. If it is determined by "matching the feel," we regress to the original problem. Thus, *calibration qualia* does not rescue the realist's intrinsic quale; it redescribes it as a functional relation, stripping it of the metaphysical weight the realist intended to preserve.

  This suggests the problem is not merely that we lack access to the quale, but that the quale, as an intrinsic property, has no work to do. To test whether the argument against qualia relies merely on our cognitive limitations, we turn to the *instrumented variant*. Suppose the tasters are fitted with an apparatus that grants them exact, reliable knowledge of their internal neural states. They know precisely which state $N_1$ they occupied a year ago and which state $N_2$ they occupy now. The access premise is removed; there is no introspective fog. They know $N_1 \neq N_2$. Yet, they maintain their disagreement: one insists $N_2$ represents a change in the *tasting*, the other insists it represents a change in the *reaction*.

  If the argument against qualia dissolves here, then the original case was merely about the poverty of introspection, supporting the *unverifiable* verdict. But the argument does not dissolve. Even with perfect knowledge of the physical states, the question "Did the *qualitative character* change or just the *hedonic impact*?" remains linguistically available but metaphysically empty. Why? Because once the physical states are fully specified, any further distinction between "tasting" and "reaction" must map onto a further physical distinction. If there is no further physical distinction (if the neural difference is identical in both scenarios), then the distinction between "tasting change" and "reaction change" is a distinction without a difference.

  If the tasters still insist there is a difference despite identical physical descriptions, they are positing a property that floats free of the physical state. But if that property makes no difference to the physical state (since the states are identical), it cannot make a difference to the report, the behavior, or the judgment. The argument against qualia survives the surgery of the instrumented variant. This demonstrates that the failure of qualia is not contingent on our cognitive limitations. It is not that we cannot *see* the quale; it is that once the physical facts are fixed, there is no remaining fact for the quale to be. This pushes us away from the *unverifiable* verdict and toward *incoherence* or *idleness*.

  To decide between idleness and incoherence, we must examine the *silent inversion*. In this scenario, a subject's color phenomenology is systematically inverted overnight. However, the intervention also adjusts memory, calibration, and discriminative dispositions so that nothing looks different to the subject, nothing is reportable, and no test yields a different result. The subject wakes up, sees a red apple, calls it "red," and remembers it looking "red" yesterday, despite the phenomenal inversion.

  Does this case show that a real difference in feel can leave no possible trace in judgment? If yes, then qualia are *explanatorily idle*; they exist but are causally isolated from the cognitive systems that report on them. If no, it shows that "feel" has been drained of exactly the content that made it a candidate for reality. The latter is the stronger position. The concept of "experience" or "feel" is inextricably linked to the potential for cognitive uptake. To say something "feels like X" is to say it is poised to influence judgment, memory, and behavior in specific ways. If an inversion leaves *no* trace—not in behavior, not in memory, not in introspective judgment—then the inversion is not a difference in experience; it is a difference in nothing.

  To claim the inversion is real but silent is to claim that there is a property of the mind that is utterly disconnected from the mind's operations. This renders the property not just idle, but unintelligible. A property that cannot be detected by the subject, cannot influence the subject's reasoning, and cannot manifest in behavior is not a property of the subject's mental life; it is a metaphysical ghost. Therefore, the silent inversion does not support the *idle* verdict (which grants existence) but the *incoherent* verdict. The concept of a "feel" that makes no difference to how the system functions is a contradiction in terms, because "feel" is defined by its functional role in the economy of the mind.

  This brings us to the traditional marks of qualia: ineffability, intrinsicness, privacy, and direct or privileged apprehensibility. The apparatuses above suggest that the core tension lies in *intrinsicness*. Defenders of qualia often retreat when confronted with the epistemic problems of privacy and ineffability. They may concede that qualia are not private (neuroscience can see them) and not ineffable (we can correlate them with words), but they hold fast to *intrinsicness*. They argue that even if we know everything about the functional role and neural correlate, there remains an intrinsic "what-it-is-like" that is not exhausted by those relations.

  However, a defender who surrenders ineffability and privacy while holding fast to intrinsicness has retained nothing worth defending. If a state is not private, it is publicly observable. If it is not ineffable, it is conceptually capturable. If it is fully described by its functional relations (as the instrumented variant suggests is necessary for it to have any effect), then what work is "intrinsicness" doing? It is posited as a residue, a "glow" that accompanies the functional state. But as the silent inversion shows, if this glow does not alter the functional state, it is undetectable and irrelevant. If it *does* alter the functional state, it is just part of the functional description.

  To insist on intrinsicness after surrendering privacy and ineffability is to change the subject. It is to define "consciousness" as a property that is ostensibly physical (public, describable) but secretly magical (intrinsic in a way that exceeds physical description). This is not a refinement of the concept; it is a refusal to let the concept be naturalized. The *calibration qualia* hypothesis attempted to naturalize it by making it relational, and the realist rejected that because it lost intrinsicness. The *instrumented variant* showed that intrinsicness adds no explanatory power once the physical facts are fixed. The *silent inversion* showed that intrinsicness without functional consequence is empty.

  Therefore, the distinction between the three verdicts must be resolved in favor of incoherence. The *unverifiable* verdict is ruled out by the instrumented variant: better access does not solve the problem because the problem is not access. The *explanatorily idle* verdict is ruled out by the silent inversion: a property that is truly idle (leaving no trace in judgment) is not a property of experience at all, but a metaphysical fiction. This leaves *incoherence*. The traditional characterization of qualia demands a property that is intrinsic (non-relational) yet capable of being the object of judgment (relational), private yet causally potent. The coffee tasters case, amplified by these three apparatuses, demonstrates that these demands cannot be jointly satisfied.

  The verdict is that qualia, as traditionally characterized, are an incoherent posit. They are not hidden gems waiting for better tools; they are conceptual errors arising from the mistaken belief that experience can be severed from the discriminatory and reactive capacities of the organism.

  This verdict depends most critically on a single premise: **The Principle of Cognitive Uptake**. This principle states that for a mental property to be real, it must be capable, in principle, of making a difference to the cognitive economy of the subject (judgment, memory, or behavior). If a property cannot influence how the subject thinks or acts, it cannot be meaningfully said to be part of the subject's mental life.

  I would abandon this verdict only if one could demonstrate a causal power unique to the phenomenal character that is distinct from the functional role. That is, if it could be shown that two systems could be functionally identical (same inputs, same outputs, same internal processing states) yet differ in their capacity to learn or adapt solely due to a difference in "feel," then the Principle of Cognitive Uptake would be falsified, and qualia might be rescued as explanatorily potent, intrinsic properties. Until such a demonstration is provided, the concept remains a shadow cast by grammar rather than a feature of the world.
