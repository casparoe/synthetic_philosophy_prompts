          *   *Critique:* The distinction is useful, but the labels might be confusing. "Institutional vs. Social" might be clearer, but "Vertical/Horizontal" is punchy. I need to tell the user if it's distinct enough. It *is* distinct enough because formal rules can exist without social enforcement (dead letters) and social rules can exist without formal backing (taboos).
