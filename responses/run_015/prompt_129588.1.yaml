      *   *Marrow-4 vs. NASA Definition:* It sustains itself. It evolves (gets better at things). Does it undergo *Darwinian* evolution without a genome? If inheritance is via bulk mixture, variation is continuous, not discrete. Selection can still act.
      *   *Marrow-4 vs. Reproduction:* It requires a technician to split it. Is this different from a mule needing humans to breed horses? No, a mule *can't* reproduce. A bacterium *can* reproduce on its own given nutrients. Marrow-4 *physically cannot* split itself; it needs external mechanical intervention. This is a strong point for Side B.
      *   *Consistency Check:*
          *   *Viruses:* Not alive because they need a host cell's machinery to replicate. They are obligate parasites.
          *   *Mules:* Alive because they are individual organisms composed of cells that metabolize, even if the *lineage* ends.
          *   *Marrow-4:* If it's an individual "organism," does it matter if it can't replicate? Yes, because the claim is "first living thing *made* by humans," implying a new lineage. If it can't replicate without human intervention, is it a lineage or a process?
