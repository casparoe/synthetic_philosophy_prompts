  3.  **Formulate the Recommendation:**
      *   *Decision:* Accept the loan, *but* reject the proposed label.
      *   *Reasoning:* It is too scientifically significant to ignore, but the "life" claim is too contested to state as fact in a public museum. Museums educate; they shouldn't take sides on unresolved ontological debates without context.
      *   *Label Strategy:* Focus on what it *does*, not what it *is*. "A synthetic evolving system."
