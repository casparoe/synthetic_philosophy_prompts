          *   *Resolution:* The distinction lies in *autonomy*. Viruses lack metabolic autonomy. Mules have metabolic autonomy but lack reproductive autonomy. Marrow-4 has metabolic autonomy but lacks reproductive *mechanism* autonomy (needs splitting).
      *   *Fair Hearing:* I need to champion the side I'm arguably rejecting (or at least give it weight). If I recommend *not* calling it life, I must vigorously defend the "It IS life" argument so Side A feels heard.
      *   *9-Year-Old Formulation:* Needs to be simple but accurate. "It acts like life, but doesn't work like the life you know."

