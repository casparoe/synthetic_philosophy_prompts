answer: |-
  You are in excellent company. Your intuition aligns perfectly with **Causal Decision Theory (CDT)**, which was the dominant framework in philosophy and economics for much of the 20th century. Prominent thinkers like Robert Nozick (who popularized the problem) and David Lewis (who analyzed it) agreed with you: they were Two-Boxers, and they explicitly stated that One-Boxing seemed to require a belief in "magical" causality.

  However, to answer your specific question: **No, the controversy is not about backward causation.** Serious One-Boxers do not believe that their choice retroactively causes the money to appear in the box. They agree with you that the past is fixed.

  The disagreement is not about physics; it is about **how to calculate expected utility when your choice is logically correlated with a past event.**

  Here is the breakdown of why your physicist's intuition, while consistent, might be missing a structural feature of the problem that One-Boxers (and modern decision theorists) focus on.

  ### 1. The Straw Man of Backward Causation
  You wrote: *"The only way one-boxing could be rational... is if I were to assume that my choice causally affects the past."*

  This is the most common misconception about Newcomb's Problem. One-Boxers do not claim that choosing Box B *changes* the content of Box B. They claim that choosing Box B is **evidence** that Box B contains $1,000,000.

  In probability terms:
  *   **Your View (CDT):** $P(\text{Money} | \text{One-Box}) = P(\text{Money})$. You treat the state of the box as independent of your action because the causal arrow points only from Prediction $\to$ Box $\to$ You.
  *   **One-Boxer View (EDT/FDT):** $P(\text{Money} | \text{One-Box}) \approx 1$. They treat the state of the box as highly correlated with their action because both the Prediction and your Action are outputs of the same underlying process (you).

  ### 2. The Mechanism of Prediction (The "Physicist" Explanation)
  As a physicist, you know that perfect prediction in a deterministic universe implies that the predictor has access to the state variables that determine your behavior.

  How does the Predictor work?
  1.  **Laplace's Demon:** It scans your brain state and simulates your decision process.
  2.  **Identity:** The simulation is effectively *you*. It runs the same algorithm on the same data.

  If the Predictor simulates you to make its prediction, then "You in the room" and "You in the simulation" are instantiating the same decision function.
  *   If the simulated you one-boxes, the Predictor puts the money in.
  *   If the simulated you two-boxes, the Predictor leaves it empty.
  *   Since you are running the same decision function as the simulation, **you cannot choose differently than the simulation did.**

  Therefore, when you deliberate, you are not asking, "Given the money is already there, what should I do?" You are asking, "What is the output of the decision function that determines both the prediction and my current action?"

  If you decide to two-box, you are effectively determining that the simulation two-boxed, which means the money is not there. You aren't changing the past; you are **selecting which timeline you are in** based on the logical output of your algorithm.

  ### 3. Causal vs. Evidential vs. Functional Decision Theory
  The debate is actually a clash between three decision theories:

  *   **Causal Decision Theory (Your View):** I should maximize utility based on the causal consequences of my act. Since my act cannot causally influence the past box-filling, I take both.
      *   *Result:* You get $1,000. (Because the Predictor predicted you would do this).
  *   **Evidential Decision Theory (Classic One-Boxing):** I should maximize utility based on the news my act brings. Choosing one box is strong evidence that I am rich.
      *   *Result:* You get $1,000,000.
      *   *Critique:* This can fail in "Smoking Lesion" problems where correlation isn't causal.
  *   **Functional Decision Theory (Modern One-Boxing):** This is the view likely to appeal most to a physicist or computer scientist (proposed by Yudkowsky and Soares). It treats your decision as the output of a logical function.
      *   The Predictor has already computed $f(\text{situation})$.
      *   You are now computing $f(\text{situation})$.
      *   You must act as though you are determining the output of that function for *all* instances of it, including the Predictor's simulation.
      *   *Result:* You get $1,000,000.

  ### 4. Why the Debate Matters
  If this were just a paradox about boxes, it wouldn't matter much. But this structure appears in **Game Theory** and **AI Safety**.

  Consider the **Prisoner's Dilemma**.
  *   If you play against a random person, CDT says "Defect."
  *   If you play against a **copy of yourself** (or an AI that simulates your source code), CDT still says "Defect" (because my choice doesn't causally change theirs).
  *   However, if you defect, your copy defects. You both get 0 years. If you cooperate, your copy cooperates. You both get 1 year.
  *   A Functional Decision Theorist (One-Boxer logic) Cooperates, recognizing the logical correlation. They get the better outcome.

  In a world with advanced AI, predictors, and simulations, the assumption that "my choice is causally independent of the predictor's model of me" breaks down. The "Two-Boxer" strategy systematically loses money in environments where agents can be modeled or simulated.

  ### Summary
  You are correct that backward causation is absurd. But One-Boxers are not invoking it. They are invoking **logical correlation**.

  *   **Two-Boxer:** "The money is already there or not. I can't change it. I take both." (Result: $1,000)
  *   **One-Boxer:** "The money is already there or not. But my choice tells me which world I'm in. If I am the type to take both, the money isn't there. If I am the type to take one, it is. I want to be the type who finds the money." (Result: $1,000,000)

  The controversy is not about whether the past can be changed. It is about whether a rational agent should view their decision as an isolated causal event or as the output of a deterministic function that has already been evaluated by the Predictor. As a physicist, you might find the latter view (Functional Decision Theory) more compatible with a deterministic universe than the former.
