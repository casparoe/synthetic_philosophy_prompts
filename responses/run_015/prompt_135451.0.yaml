      *   **Framework:** Thomas Aquinas's theory of tyrannicide (primarily from *De Regno* and *Summa Theologiae*).
      *   **Constraint 1:** Do not just run a checklist (e.g., "Was he a tyrant? Yes. Was it public? No.").
      *   **Constraint 2:** Treat Claus von Stauffenberg not as a private citizen but as an officer invoking revived constitutional authority via the Wehrmacht oath.
      *   **Key Question 1:** Was Aquinas's "authority condition" meant to cover a "bureaucratic-insurrectionary hybrid"?
      *   **Key Question 2:** Map legitimate authority in the plot.
      *   **Key Question 3:** Analyze the "no greater harm" clause in the context of seizing state machinery (Valkyrie) vs. simple removal.
      *   **Key Question 4:** Identify where Aquinas goes silent on coups claiming to *restore* legal order.
      *   **Conclusion:** What does this case do to the theory? (Stretch it until it breaks? Reveal it was only about popular uprising?)

  2.  **Aquinas's Framework (Mental Retrieval & Synthesis):**
      *   *Summa Theologiae* II-II, Q. 42, A. 2 (Sedition) & Q. 64, A. 3 (Killing).
      *   *De Regno* (On Kingship).
      *   **Core Conditions for Tyrannicide:**
          1.  **Tyranny:** The ruler must be a usurper or ruling for private gain against the common good.
          2.  **Public Authority:** Killing cannot be done by private presumption (*privata praesumptione*). It requires public authority.
          3.  **Proportionality/Last Resort:** No greater disturbance (scandal/tumult) should arise than the tyranny itself.
          4.  **Intent:** For the common good, not private hatred.
      *   **Nuance:** Aquinas is generally cautious. He prefers deposition by public authority over assassination. He worries about the precedent of killing kings.

  3.  **Reframing Stauffenberg (The "Officer" Angle):**
      *   Standard view: Stauffenberg is a private citizen/soldier taking the law into his own hands.
      *   Prompt's view: Stauffenberg is an *organ* of the state. The Wehrmacht oath was to the *office* of the Supreme Commander (which Hitler corrupted) or the *Fatherland* (depending on interpretation).
      *   The "Bureaucratic-Insurrectionary Hybrid": It's not a mob; it's the state trying to excise its own head using existing emergency protocols (Valkyrie).

  4.  **Mapping Legitimate Authority in the Plot:**
      *   **Hitler:** De facto ruler, but de jure tyrant (usurper of the *Rechtstaat*).
      *   **Stauffenberg:** Chief of Staff to the Reserve Army. He holds *executive* power within the Reserve Army.
      *   **Beck:** Designated Head of State. Former Chief of Staff. Represents the "old order" legitimacy.
      *   **Witzleben:** Designated Commander-in-Chief.
      *   **The Reserve Army:** The institutional vehicle.
      *   **Aquinas's Problem:** Aquinas imagines "Public Authority" as a superior judging an inferior (e.g., the Barons judging King John, or the Emperor judging a local tyrant). He doesn't imagine subordinates killing a superior to *become* the authority.

  5.  **The "No Greater Harm" Clause & Valkyrie:**
      *   Aquinas: Don't cause a civil war worse than the tyranny.
      *   Valkyrie: It *was* a coup. It relied on seizing radio stations, arresting SS, mobilizing troops.
      *   Risk: Civil War (SS vs. Wehrmacht).
      *   Justification: The tyranny (Holocaust, total war, destruction of Germany) *was* the greater harm. The coup was the surgical removal to prevent total annihilation.
      *   Nuance: Aquinas worries about the *act* of killing causing instability. Stauffenberg argued the *failure* to act causes total destruction.

  6.  **The Silence of Aquinas (Restoration vs. Overthrow):**
      *   Aquinas assumes a binary: Legitimate King vs. Tyrant.
      *   July 20 assumes a triad: Legitimate Order (Weimar/Pre-1933 norms) -> Corrupted Order (Nazi) -> Restored Order (Beck/Goerdeler).
      *   Aquinas doesn't account for a "Constitutional Coup" where the military acts as the guardian of a dormant constitution. He thinks in terms of feudal hierarchy, not modern bureaucratic statehood.

  7.  **Synthesis: What does the case do to the theory?**
