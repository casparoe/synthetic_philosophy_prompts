      *   Does it show Aquinas meant popular uprising? No, Aquinas hated sedition. He preferred action by "magnates" or superiors.
      *   *Real Tension:* Aquinas's theory is vertical (Top-Down judgment). July 20 was horizontal/internal (The body politic cutting off its own head).
