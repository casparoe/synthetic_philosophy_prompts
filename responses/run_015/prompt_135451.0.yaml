answer: |-
  To analyze the July 20 plot through Thomas Aquinas is to collide two distinct political ontologies. Aquinas writes within a medieval scholastic framework where authority is vertical, divinely sanctioned, and hierarchical. The conspirators of 1944 operated within a modern totalitarian state where authority was bureaucratic, legalistic, and paradoxically rooted in the very machinery they sought to hijack.

  If we treat Claus von Stauffenberg not as a private assassin but as an officer invoking a revived constitutional authority, the July 20 plot ceases to be a simple case of tyrannicide and becomes a "bureaucratic-insurrectionary hybrid." It forces Aquinas's theory to confront a scenario it could not conceive: a coup d'état that claims to be an act of legal restoration rather than revolution.

  ### 1. The Authority Condition: Private Presumption vs. Institutional Conscience

  Aquinas's primary restriction on tyrannicide is found in *De Regno* and the *Summa Theologiae* (II-II, Q. 42). He argues that killing a tyrant cannot be done by "private presumption" (*privata praesumptione*). It requires "public authority." In Aquinas's mind, this usually implies a superior judging an inferior (an Emperor deposing a local king) or a collective body of magnates acting as the representative of the realm.

  Stauffenberg attempts to bypass the "private citizen" label by leveraging the Wehrmacht oath and the Reserve Army's emergency powers. He does not claim the right to kill based on natural law alone (the private citizen's appeal); he claims it based on his position as Chief of Staff to the Reserve Army. The argument is that the Wehrmacht oath was sworn to the *office* of the Supreme Commander and the German people, not the person of Adolf Hitler. When Hitler turned the state into a criminal enterprise, the oath obligated the officer corps to neutralize the corruption to save the object of their loyalty (the Fatherland).

  Here, the "public authority" is not a person superior to Hitler (of whom there was none), but the *institution* of the Army itself, acting as the guardian of the dormant constitution. Stauffenberg treats the Reserve Army not as a rebel faction, but as the only remaining organ of the state capable of executing legal continuity.

  **The Theoretical Friction:** Aquinas's authority condition assumes a hierarchy where the judge stands *above* the tyrant. Stauffenberg's claim is that the authority resides *within* the subordinate body when the head becomes pathological. This stretches Aquinas's "public authority" until it nearly snaps. For Aquinas, a subordinate killing a superior is inherently seditious because it disrupts the divine order of hierarchy. Stauffenberg argues that the hierarchy was already broken by the tyrant, and the "public authority" is the institutional mechanism required to reset it. Aquinas has no category for a subordinate body that *becomes* the public authority through the act of insurrection.

  ### 2. The "No Greater Harm" Clause and Operation Valkyrie

  Aquinas insists that the removal of a tyrant must not produce "greater disturbance" (*perturbatio gravior*) than the tyranny itself. He fears that killing a king invites civil war, factionalism, and the rise of a worse tyrant.

  In the July 20 plot, the "no greater harm" calculus is inextricably linked to Operation Valkyrie. Valkyrie was not merely an assassination plan; it was a continuity-of-government protocol designed to seize the state machinery (radio stations, ministries, concentration camps) in the event of internal collapse.

  *   **The Harm of Tyranny:** By 1944, the "harm" was not just political oppression but the physical annihilation of the German state, the Holocaust, and the moral destruction of the nation. The conspirators argued that the *status quo* guaranteed total ruin.
  *   **The Harm of the Coup:** The risk was civil war between the Wehrmacht and the SS, or Allied exploitation of the chaos.

  Stauffenberg's wager was that the "disturbance" of Valkyrie was surgical compared to the "disturbance" of continued Nazi rule. However, Aquinas's warning is prophetic here. Because the plot relied on seizing the bureaucratic machinery, it required the complicity of the entire chain of command. When the assassination failed, the "disturbance" Aquinas feared materialized instantly: the Gestapo unleashed a terror that crushed the conservative opposition entirely, and the war continued for ten more bloody months.

  Yet, from the conspirators' view, Aquinas's clause is static, whereas their situation was dynamic. They were not choosing between peace and coup; they were choosing between *certain destruction* and *possible restoration*. Aquinas assumes a stable polity threatened by a tyrant; the conspirators faced a polity that had already been consumed by the tyrant. The "harm" had already happened; Valkyrie was an attempt to stop the bleeding.

  ### 3. Restoration vs. Overthrow: Where Aquinas Goes Silent

  The most significant gap in Aquinas's theory exposed by July 20 is the concept of **constitutional restoration**.

  Aquinas discusses deposition and killing. He envisions a binary: a legitimate king or a tyrant. If the tyrant is removed, a new legitimate authority must be installed. He does not account for a scenario where the "legitimate authority" is a legal order that has been suspended but not abolished.

  The July 20 plotters (Beck, Goerdeler, Stauffenberg) did not view themselves as revolutionaries overthrowing the German state. They viewed themselves as executors of a *Rechtstaat* (legal state) that had been hijacked. They intended to restore the rule of law, not inaugurate a new regime. Beck was to assume the presidency not as a conqueror, but as a caretaker of the pre-1933 legal continuity.

  Aquinas goes silent here because his political theology lacks a concept of "impersonal constitutionalism." For Aquinas, authority is vested in persons (Kings, Popes, Emperors). For the plotters, authority was vested in the *Law*, and the Army was the temporary custodian of that Law. Aquinas cannot adjudicate a coup that claims to be a police action. He has no framework for a "legal coup" where the military acts as the judiciary of last resort against the executive. In his framework, this is simply sedition, regardless of the intent to restore law, because the subordinates have no jurisdiction over the sovereign.

  ### 4. What the Case Does to the Theory

  Does the July 20 plot stretch Aquinas's authority clause until it breaks, or does it reveal that Aquinas was only talking about popular uprising?

  It does neither. Instead, it reveals that Aquinas's theory is **anachronistic to the modern bureaucratic state.**

  1.  **It does not break the authority clause:** If we strictly apply Aquinas, Stauffenberg *did* act on private presumption. No superior authority authorized the hit. The "institutional authority" of the Reserve Army is a modern legal fiction that Aquinas would not recognize as sufficient to override the divine sanction of the sovereign. The theory holds, but it condemns the plot.
  2.  **It was not about popular uprising:** Aquinas explicitly warns *against* popular uprising (sedition). He prefers action by "magnates" or public authorities. In a strange twist, Stauffenberg aligns *better* with Aquinas's preference for elite action than a popular revolt would have. He was a "magnate" of the military bureaucracy.

  **The Verdict:** The case exposes that Aquinas's theory relies on a **vertical model of accountability** (God > King > Magnates > People), whereas the July 20 plot relied on a **horizontal model of institutional integrity** (Army > Constitution > Tyrant).

  Aquinas assumes the sovereign is the source of law, so removing him requires a higher source of law (God/Emperor). The plotters assumed the Law is the source of sovereignty, so removing the violator is an act of legal enforcement.

  Therefore, the July 20 plot does not break Aquinas's theory; it **bypasses** it. It shows that Aquinas's conditions for tyrannicide are insufficient for the modern era because they cannot account for a state where the "public authority" is not a person, but a procedure. Stauffenberg tried to turn the Wehrmacht into a "public authority" in the Aquinian sense, but because that authority was derived from the very chain of command Hitler led, it was a paradox.

  Ultimately, the plot demonstrates that Aquinas was not merely talking about popular uprising; he was talking about **feudal hierarchy.** When the state becomes a totalitarian bureaucracy, the "public authority" required to judge the tyrant no longer exists within the system. It must be conjured from the oath of the soldiers themselves. Aquinas's theory goes silent because it cannot conceive of a world where the only legitimate authority left is the conscience of the executioner.
