      *   *Actually:* Williamson allows that you can know you are in a *specific* state (e.g., feeling very cold) but not that you know you are in the state *whenever* you are. Wait, no. Williamson's conclusion is that the condition is not luminous. That means $\neg \forall x (C(x) \to K C(x))$. It does *not* mean $\forall x (C(x) \to \neg K C(x))$. So (6) is logically safe.
      *   *However:* The *argument* for (1) (margin for error) often puts pressure on (6). If the margin is wide, "good cases" shrink. I should note this pressure without calling it a contradiction.

  10. **Final check on (4) Applicability:**
      *   Is the "Applicability Constraint" a standard view? It sounds like a version of "Ought Implies Can" applied to epistemic norms. "Norm implies Can Know".
      *   If the user holds this, they are committed to KK.
      *   If they hold Anti-KK, they must drop this constraint.
      *   This is the pivot point.

      *   *Plan:*
