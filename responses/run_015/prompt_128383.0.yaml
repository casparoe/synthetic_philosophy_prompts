answer: |-
  **JOINT STATEMENT ON CROSS-CULTURAL MORAL VARIATION AND OBJECTIVITY**

  **I. Agreed Empirical and Conceptual Claims**

  1.  **Variance Partitioning:** Statistical variance in moral judgments is predominantly *within* societies, not *between* them. Cross-cultural differences are statistically significant but effect sizes are often smaller than intra-cultural dispersion.
  2.  **WEIRD Outliers:** Western, Educated, Industrialized, Rich, Democratic samples are psychological outliers, particularly regarding impersonal fairness, individualism, and the separation of conventional vs. moral domains. They are not the human default.
  3.  **Disambiguation of Objectivity:** We distinguish four theses often conflated in this debate:
      *   *Metaphysical:* Moral facts exist mind-independently.
      *   *Empirical:* True moral claims are universally endorsed.
      *   *Epistemic:* Judgments converge under idealized reflection.
      *   *Practical:* Moral demands possess non-negotiable authority.
      *   *Agreement:* The variation data directly targets *Empirical* objectivity. Its relevance to *Metaphysical* objectivity depends on auxiliary premises about access and error.
  4.  **Measurement Bias (Tu Quoque):** Standard survey instruments (Likert scales, vignette structures) impose WEIRD categorical distinctions. The variationist's tools for measuring variation are themselves culturally loaded, potentially inflating or masking divergence.
  5.  **Taxonomy of Disagreement:** Observed variation falls into three categories:
      *   *Non-Moral Disagreement:* Same principle, different factual/metaphysical beliefs (e.g., does this ritual cause harm? does the ancestor exist?).
      *   *Weighting Disagreement:* Same principles, different lexical priority (e.g., loyalty vs. fairness in kinship contexts).
      *   *Domain Disagreement:* Dispute over whether a property (e.g., purity, deference) is a moral consideration at all versus merely conventional.
  6.  **Underdetermination:** Empirical data alone cannot settle metaphysical realism vs. anti-realism. Realism can accommodate variation via error theory; anti-realism can accommodate universals via shared biology or convergence.
  7.  **Functional Equivalence:** Many divergent norms solve identical cooperative problems (free-riding, coordination, conflict resolution). Surface variation often masks functional universality.
  8.  **Normative Stakes:** Neither side claims that proving *Empirical* variation automatically validates *Practical* relativism. One can believe moral demands are binding while acknowledging their cultural specificity.

  **II. Core Disagreements**

  | Neutral Statement | Realist Formulation | Variationist Formulation | The Crux |
  | :--- | :--- | :--- | :--- |
  | **Explanation of Domain Disagreement** | When cultures disagree on whether purity is moral, one side is likely tracking a mind-independent moral property the other misses, or vice versa. | When cultures disagree on whether purity is moral, they are constituting different moral realities; neither is "missing" a fact, they are playing different games. | **Mind-Independence:** Are moral properties discovered (Realist) or constituted by social practice (Variationist)? |
  | **Status of Persistent Variation** | Remaining variation after controlling for facts/weights is best explained by epistemic limitation, bias, or incomplete information. | Remaining variation is best explained by the absence of a single true code; divergence is the expected baseline for constructed norms. | **Error Theory:** Is divergence evidence of failure to track truth (Realist) or evidence that truth is local (Variationist)? |
  | **Significance of Convergence** | Convergence under ideal conditions would be strong evidence for Metaphysical objectivity. | Convergence under ideal conditions would only show shared psychology or hegemony, not mind-independent facts. | **Epistemic Link:** Does ideal agreement track truth (Realist) or merely coherence (Variationist)? |

  **III. Adjudicating Probes**

  We commit to the following hypothetical study designs. Each side specifies predictions and concessions.

  **1. The Vocabulary-Switch Probe**
  *Design:* Matched samples receive identical fact patterns framed in Rights language, Honor language, or Purity language.
  *   **Realist Prediction:** Judgments will track the *described facts* (harm, consent, betrayal) regardless of framing. Framing effects will be noise, not signal.
  *   **Variationist Prediction:** Judgments will track the *framing*. Describing an act as "dishonorable" vs. "unfair" will shift the moral valence even if factual content is held constant.
  *   **Concession:**
      *   *Realist:* If framing dictates judgment over facts, the claim that moral properties are mind-independent features of actions loses plausibility.
      *   *Variationist:* If facts dominate framing across all cultures, the claim that moral concepts are incommensurable linguistic constructs is undermined.

  **2. The Reflective-Convergence Probe**
  *Design:* Participants are asked what an ideally informed, impartial member of their community would say, then prompted to generalize their reasons universally.
  *   **Realist Prediction:** Responses will converge across societies on core prohibitions (e.g., gratuitous cruelty) once local factual beliefs are controlled.
  *   **Variationist Prediction:** Responses will converge locally (within culture) but remain divergent globally. "Impartiality" itself is interpreted differently (e.g., impartiality vs. partiality to kin).
  *   **Concession:**
      *   *Realist:* If ideal reflection yields stable, incompatible global norms, the Epistemic argument for realism fails.
      *   *Variationist:* If global convergence emerges despite different starting points, the claim that moral truths are essentially local is weakened.

  **3. The Bicultural-Salience Probe**
  *Design:* Fluently bicultural individuals are primed with one framework or the other before judging moral dilemmas.
  *   **Realist Prediction:** Participants will report one framework as "pragmatic" and the other as "true," or will integrate them into a unified hierarchy. They will not view both as equally valid but context-dependent.
  *   **Variationist Prediction:** Participants will code-switch seamlessly without reporting conflict or seeking integration. They will treat both as valid within their respective contexts.
  *   **Concession:**
      *   *Realist:* If biculturals report no conflict and treat both as equally valid, the idea of a single binding moral reality is psychologically unsupported.
      *   *Variationist:* If biculturals feel compelled to rank one as objectively superior, the claim that moral frameworks are self-contained is challenged.

  **IV. Closing Note on Variance and Tools**

  We acknowledge the *tu quoque*: the Variationist's claim that "tools are biased" applies equally to their own critique. If survey instruments are WEIRD, then findings of variation *using those instruments* are suspect. However, we agree that ethnographic data confirms variation exists beyond measurement error. The dispute is not *whether* variation exists, but whether it is *noise* around a universal signal (Realist) or *evidence* of multiple signals (Variationist). We agree that future work must partition variance more rigorously, distinguishing between shallow normative disagreement and deep structural incompatibility. Neither side claims victory based on current data alone; the metaphysical verdict awaits better probes.
