answer: |-
  # Workshop Simulation: The Provenance Crash

  **Time:** 90 Minutes
  **Participants:** 12 Grad Students (3 Groups of 4)
  **Goal:** Experientially demonstrate that virtual harm is ontological (loss of status/meaning) even when data is preserved.
  **Stakes:** "Definition Rights." The group holding the valid artifact at the end gets to dictate the single key term used in the workshop's final written summary.

  ## Materials
  *   12 Index cards (heavy stock).
  *   12 Envelopes.
  *   Markers.
  *   Whiteboard.
  *   A "Ledger" sheet (prepared by you).

  ## Roles
  *   **Architects (12 students):** Divided into 3 teams of 4.
  *   **The System (You/Facilitator):** Holds the authority, manages the "server," and executes the crash.

  ## Phase 1: Minting (30 Minutes)
  1.  **Instruction:** Tell the Architects they are building a "Unique Virtual Artifact." This artifact is their claim to Definition Rights.
  2.  **Creation:** Each team creates one physical card. They must draw a symbol and write a unique 6-character "Private Key" on the back.
  3.  **Registration:** Teams come to the whiteboard (The Public Ledger). They write their Team Name and the *first two characters* of their Private Key (The Public Hash). They do *not* reveal the full key.
  4.  **Sealing:** They place the card in an envelope, seal it, and hand it to You.
  5.  **Social Practice:** Emphasize that the value of this object relies entirely on the **secrecy of the key** and the **integrity of the Ledger**. Without these, it is just a drawing.

  ## Phase 2: The Crash & Restore (15 Minutes)
  1.  **The Crash:** Announce a "Server Breach." Collect the envelopes. Turn your back. Shuffle them.
  2.  **The Restore:** Hand the envelopes back to the respective teams. The cards inside are untouched. The data is intact.
  3.  **The Twist:** On the whiteboard, under their Public Hashes, write the **Full Private Keys** for all three teams.
  4.  **Announcement:** State calmly: "During the breach, the encryption failed. All Private Keys are now public domain. The data is restored, but the exclusivity protocol is collapsed."

  ## Phase 3: The Market Closure (20 Minutes)
  1.  **Attempt to Claim:** Ask teams to claim their Definition Rights using their artifacts.
  2.  **The Block:** When Team A presents their card and key, point to the board. "Team B also has your key now. Team C also has your key. The System can no longer verify unique ownership. The artifact is valid data, but it is no longer a 'Unique Claim.'"
  3.  **Negotiation:** Allow them 10 minutes to try to salvage value. They will likely argue that *they* made it. Remind them: "In this world, identity is defined by verification, not origin. The verification practice has collapsed."
  4.  **Resolution:** Declare that no single group holds the Rights anymore. The "Object" (The Unique Claim) is dead, even though the "File" (The Card) exists. You, as Facilitator, retain the Definition Rights by default.

  ## Phase 4: Debrief (25 Minutes)
  Do not move chairs. Keep the tension fresh. Map the experience directly to the philosophy.

  **1. The Object (5 mins)**
  *   *Ask:* "What was the artifact before the crash?"
  *   *Map:* It wasn't just ink on cardstock (data). It was ink + secrecy + ledger recognition (social practice).
  *   *Concept:* Virtual objects are hybrid entities (data + institutional fact).

  **2. The Harm (10 mins)**
  *   *Ask:* "Why did you feel frustrated when you got your card back intact?"
  *   *Map:* The data was perfect. The harm was the loss of *status*. The social practice that sustained the object's identity (exclusive ownership) dissolved.
  *   *Concept:* Virtual harm is often ontological degradation, not physical destruction.

  **3. The Irreplaceability (10 mins)**
  *   *Ask:* "Could you just write a new key and start over?"
  *   *Map:* You could make a new card, but you couldn't restore *this* claim. The moment of recognition passed. The community now sees these cards as 'leaked' items.
  *   *Concept:* Restoration of bits ≠ Restoration of identity. Trust is non-fungible.

  ## Predictable Failures (First Run)
  1.  **Gamification:** Students may treat the key reveal as a puzzle to solve rather than a loss of value. *Fix:* Enforce the stakes seriously. If they laugh, remind them that their philosophical contribution (Definition Rights) is now void.
  2.  **Workaround Logic:** They may argue, "We remember we made it, so it's still ours." *Fix:* Shut this down hard. "In a virtual world, memory is irrelevant without verification. You are arguing for a metaphysics of origin; the system operates on a metaphysics of verification."
  3.  **Time Creep:** Phase 3 negotiations can drag. *Fix:* Use a visible timer. When it hits zero, the market closes permanently.

  ## Limitations (What You Must Supply Verbally)
  1.  **Emotional Depth:** This simulation creates intellectual frustration, not genuine grief. You must verbally bridge the gap: "Imagine this wasn't workshop rights, but a digital home, a reputation, or a community hub you spent years building. The frustration you feel now is a 5% sample of that loss."
  2.  **Physical Safety:** The simulation cannot reproduce the physical anxiety that often accompanies virtual harm (e.g., doxxing leading to real-world fear). You must note that virtual harm often bleeds into physical safety, whereas this activity was contained.
  3.  **Persistence:** The "world" here lasted 90 minutes. Real virtual harms persist. Remind them that the *duration* of the social practice collapse is what makes the harm permanent.

  Core mechanic: Preserving the data while destroying the verification protocol forces participants to experience the object's identity collapsing despite its physical integrity.
