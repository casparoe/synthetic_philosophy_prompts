answer: |-
  **Title:** Ground, Content, and Gradation: Reassessing Kant's Indirect Duties to Animals

  **Research Question**
  Standard interpretations of Kant's moral status of animals treat the "indirect duty" view as uniformly deflationary: we owe nothing to animals, only to humanity. This project asks whether distinguishing the *ground* of the duty (rational nature) from its *content* (what is required regarding the animal) reveals a substantive obligation to animal welfare that functions practically like a direct duty. Secondary to this, I ask whether Kant's rationality criterion permits degrees of moral consideration based on capacities, or if it necessitates a strict binary that excludes all non-rational beings equally.

  **Problem Statement and Live Readings**
  Kant's position is typically summarized via three conflated claims: (1) the normative ground is always rational nature; (2) the content of the duty is determined by human ends; and (3) the empirical justification is that cruelty to animals cultivates cruelty to humans. Current scholarship tends to collapse these into two live readings, neither of which settles the question of practical content.

  First, the *Empirical Instrumentalist Reading* prioritizes claim (3). On this view, the duty is contingent on psychological facts about human moral development. If cruelty to animals did not spill over to humans, there would be no duty. This reading makes the duty fragile and purely self-regarding.

  Second, the *Formal Ground Reading* prioritizes claim (1) while remaining agnostic on (2) and (3). It holds that because animals lack autonomy, they cannot be wronged. However, this reading often fails to specify what deliberation regarding animals actually looks like. It assumes that because the duty is owed *to* humanity, the animal's good is irrelevant to the content.

  My project investigates a third, underexplored possibility: the *Substantive Content Reading*. This view maintains claim (1) but decouples it from claim (3). It suggests that while the duty is grounded in humanity, its content is fixed by the animal's nature and good. On this view, an agent must deliberate about the animal's welfare, weigh it against human ends, and avoid gratuitous harm, not because of empirical spill-over effects, but because the duty to humanity requires respecting the teleological order of creation. This reading risks collapsing the indirect/direct distinction: if the deliberation requires weighing the animal's good, the indirectness may be merely formal rather than practical.

  **Methodology and Work Plan**
  To avoid hanging the project on a single contested passage in the *Doctrine of Virtue*, I will triangulate Kant's position across three textual bodies over the semester.

  *   **Month 1: Textual Mapping.** I will examine the *Lectures on Ethics* (Collins and Mrongovius) and the *Anthropology from a Pragmatic Point of View* alongside the *Doctrine of Virtue*. The goal is to determine if Kant's discussion of animal cruelty varies across contexts. Specifically, I will look for instances where Kant condemns specific acts (e.g., overworking draft animals) without explicit reference to human character degradation.
  *   **Month 2: Conceptual Analysis.** I will analyze the distinction between the *ground* and *content* of duty using Kant's broader meta-ethical framework. I will test whether a duty grounded in humanity can logically require taking the animal's good as a constraint on action without granting the animal moral standing. Simultaneously, I will assess the "binary" problem: does Kant's definition of rationality allow for borderline cases (e.g., great apes), or is the threshold absolute?
  *   **Month 3: Drafting and Refinement.** I will draft the 7,000-word paper, focusing on the implication that if the Substantive Content Reading holds, the "indirect" label may obscure more than it reveals. I will finalize the argument regarding gradation as a test case for the content claim.

  **Possible Conclusions**
  1.  **Collapse Thesis:** The Substantive Content Reading is textually supported, but it renders the indirect duty view functionally identical to a weak direct duty view. The "indirectness" marks only who can be wronged, not what may be done.
  2.  **Strict Instrumentalism:** The text supports only the Empirical Instrumentalist Reading. Any appeal to the animal's good is extraneous to Kant's system.
  3.  **Binary Defense:** Kant's system cannot accommodate degrees of rationality. The binary is a feature, not a bug, derived from the transcendental nature of freedom.

  **Scope and Failure Conditions**
  The project will succeed if it definitively separates the ground of the duty from its content and shows the philosophical cost of doing so. It will fail if I cannot find textual evidence outside the standard *Doctrine of Virtue* passages to support the Substantive Content Reading, forcing a retreat to pure exegesis of one section.

  The project risks becoming too large if I attempt to fully resolve the "rational alien" problem (whether non-human rational beings exist). To stay within scope, I will treat the gradation question only insofar as it illuminates the content of duties to actual non-rational animals. If the analysis of gradation requires a full reconstruction of Kant's theory of personhood, I will bracket it and note it as a consequence for future work. Conversely, the project would be too small if it merely summarizes the standard indirect duty view without pressing the distinction between ground and content. The goal is not to report Kant's view, but to test its structural stability.
