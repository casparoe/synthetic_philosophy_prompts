answer: |-
  Here is the breakdown of your friend's classification system, the prediction for the edge case, and the analysis of her underlying logic.

  ### 1. Prediction on the Edge Case
  **Her Verdict:** **Not Corruption.**

  In the scenario you described (small-scale society, no bureaucracy, elder receives pigs, locals view it as fair), she will almost certainly classify this as **not corruption**.

  ### 2. Mapping the Three Rules on the Edge Case
  Here is how each rule processes this specific scenario:

  *   **Rule 1 (Universalist - Misuse of Public Trust):** **Not Corruption.** Since the locals view the pigs as fair reciprocity, the "public trust" of the community has not been violated. There is no betrayal of the collective interest.
  *   **Rule 2 (Localist - Violating Local Norms):** **Not Corruption.** The practice is explicitly described as normative and fair within that specific culture. It does not violate local expectations.
  *   **Rule 3 (Institutional - Requires Bureaucratic State):** **Not Corruption.** The definition of this rule states corruption *only* makes sense where a bureaucratic state is separated from kinship. Since this society has no bureaucracy and kinship/economy are fused, the concept of corruption cannot technically apply.

  ### 3. Which Rule Is She Actually Using?
  She is primarily using **Rule 3 (The Institutional/Weberian Rule)**, but with a specific nuance.

  **Why Rule 2 (Localist) is out:**
  Look at her verdicts on **Chinese *guanxi*** and **Italian *raccomandazione***. Both of these are deeply embedded local norms; in their specific contexts, they are often viewed as necessary social lubricants or moral obligations to family. If she were using Rule 2, she would have to classify them as "Not Corruption" because they do not violate local norms. The fact that she labels them "Corruption" proves she is overriding local norms with an external standard.

  **Why Rule 1 (Universalist) is unlikely:**
  Look at **US Super-PACs**. These are legal institutions. A strict Universalist rule based on "misuse of office" struggles here because the "office" isn't technically being misused legally; the money is entering through a legal loophole. Conversely, look at **Japanese *omiyage***. A strict Universalist might view gifts to officials as a conflict of interest (misuse of trust), yet she classifies it as "Not Corruption." Rule 1 is too blunt to explain why *omiyage* is okay but Super-PACs are not.

  **Why Rule 3 (Institutional) fits best:**
  Her data creates a perfect binary based on the presence of a **Weberian Rational-Legal State**:
  *   **No State (Trobriand *kula*, Melanesian Big-Man):** Not Corruption. (Kinship and economy are supposed to be fused).
  *   **State Exists (Brazil, Italy, China, US):** Corruption. (Kinship/gift logic is invading the bureaucratic sphere).
  *   **The Exception (Japan *omiyage*):** This is the only wobble. She likely exempts this because *omiyage* are low-value, distributed broadly, and seen as *cultural* rather than *transactional* contract-swapping. It fits Rule 3 if you define the rule as "Patrimonialism within a Bureaucracy." *Omiyage* is culture; *Guanxi* in contracting is patrimonialism.

  ### 4. Why the Other Verdicts Don't Fully Lock It Down
  You are right to feel the data is slightly noisy. The **Japanese *omiyage*** verdict prevents Rule 3 from being a "hard" lock. If Rule 3 were absolute, any gift to a state official would be corruption. She has to make a subjective call on where "culture" ends and "bribery" begins within a state system.

  Additionally, the **US Super-PAC** verdict complicates Rule 3. Super-PACs are part of the *legal institution* of the US state. If corruption requires violating the bureaucracy, but the bureaucracy legalized the donation, is it corruption? Her calling it "Corruption" suggests she believes the *ideal* of the bureaucracy (separation of wealth and office) is being violated, even if the *rules* allow it. This leans back toward Rule 1 (Universalist ideals), showing she is mixing Rule 3 and Rule 1.

  ### 5. Hypothetical Case to Split the Remaining Two (Rule 1 vs. Rule 3)
  Since Rule 2 is eliminated, the real tension is between **Rule 1 (Universalist/Harm)** and **Rule 3 (Institutional/State)**. Here is a case that would force them to disagree:

  **The Case:** *In a stateless, kinship-based tribe, a leader secretly accepts a large gift from a neighboring group to make a decision that harms his own people's hunting grounds. The tribe has no bureaucracy, but the community feels deeply betrayed and harmed by the leader's selfishness.*

  *   **Rule 3 (Institutional) Says:** **Not Corruption.** There is no bureaucratic state separated from kinship. Therefore, the structural category of "corruption" does not exist. It is just bad leadership or sorcery.
  *   **Rule 1 (Universalist) Says:** **Corruption.** Public/Community trust was misused for private gain, resulting in harm to the collective. The lack of a bureaucracy is irrelevant to the moral breach.

  **If she calls this "Not Corruption," she is a strict Institutionalist (Rule 3). If she calls it "Corruption," she is leaning Universalist (Rule 1).**

  ### 6. On Your Suspicion
  > *i think she's just importing western bureacratic ideals without saying so.*

  **You are correct.** Rule 3 is explicitly **Max Weber's** definition of modernity. Weber argued that "corruption" is specifically the contamination of a rational-legal bureaucracy by patrimonial (family/kinship) logic.

  By classifying *Kula* and Big-Man distributions as "Not Corruption," she is accepting the anthropological standard that you cannot judge non-state societies by state standards. However, by classifying *Guanxi* and *Raccomandazione* as "Corruption," she is asserting that once a society adopts a bureaucratic state (like China or Italy), it *must* adhere to Western-style bureaucratic neutrality to be "clean."

  She is effectively arguing that **modernity requires a specific separation of spheres** that is native to Western political theory. She isn't necessarily wrong for her book's framework, but she is definitely using a Western yardstick to measure the "State" societies while using a cultural relativist yardstick for the "Non-State" societies.
