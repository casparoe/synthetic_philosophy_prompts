answer: |-
  The following argument contends that the supervaluationist's standard defense against the "many sharp boundaries" objection fails to eliminate the commitment to sharp boundaries. Instead, it merely relocates the sharpness from the object language to the meta-language, specifically within the definition of the set of admissible precisifications. In doing so, the supervaluationist inadvertently adopts an epistemicist stance regarding the limits of admissibility.

  ### 1. The Context: Supervaluationism and the Objection

  Supervaluationism attempts to preserve classical logic while accommodating vagueness. It posits that a vague predicate $P$ (e.g., "is bald") does not have a single extension. Instead, its truth conditions are determined by a range of "precisifications"—classical sharpenings of $P$ that respect the clear cases but resolve the borderline cases. A sentence is *supertrue* if it is true on all admissible precisifications.

  The standard objection to this view is that it eliminates vagueness only to multiply it. Every individual precisification is a classical model; therefore, every precisification contains a sharp boundary between the extension and anti-extension of $P$. If precisification $S_1$ draws the line at hair count 5,000, and $S_2$ draws it at 5,001, the theory seems committed to the existence of these sharp cut-offs. This contradicts the fundamental intuition of vagueness: that there is *no* sharp boundary in reality.

  ### 2. The Standard Reply: Precisifications as Modeling Devices

  The supervaluationist's standard reply is instrumentalist. They argue that precisifications are not ontological candidates for the predicate's genuine extension. They are merely heuristic devices or modeling tools used to define the notion of *supertruth*. The "real" meaning of the vague predicate is not found in any single precisification but in the supervaluation function itself. Since the supervaluation allows for truth-value gaps (in the penumbra), the theory claims to avoid committing to any specific sharp boundary in the object language. The sharp boundaries inside the models are dismissed as artifacts of the formalism, not features of the world.

  ### 3. The Deferral: The Set of Admissible Precisifications

  This instrumentalist defense, however, overlooks a crucial structural requirement of supervaluationism: the distinction between **admissible** and **inadmissible** precisifications.

  Not every classical sharpening counts as a precisification. A sharpening that defines "bald" as "having fewer than 10 hairs" is typically ruled out as inadmissible because it violates the clear positive cases (paradigmatically bald people). A sharpening that defines "bald" as "having fewer than 100,000 hairs" is inadmissible because it violates clear negative cases.

  Supervaluationism relies on a set $K$ of admissible precisifications. The truth conditions of the vague language are entirely dependent on the composition of $K$. If $K$ changes, the set of supertrue sentences changes. Therefore, for the theory to function, there must be a fact of the matter about which precisifications belong to $K$ and which do not.

  Here lies the deferral of the objection. The supervaluationist claims there is no sharp boundary in the extension of "bald." But they must now account for the boundary of the set $K$. Is there a sharp boundary between the set of admissible precisifications and the set of inadmissible ones?

  ### 4. The Dilemma: Regress or Sharpness

  The supervaluationist faces a dilemma regarding the boundary of $K$:

  **Option A: The boundary of $K$ is vague.**
  If it is vague whether a specific precisification is admissible, then the set $K$ itself is vaguely defined. To handle this, the supervaluationist would need to apply supervaluationism to the admissibility condition itself. This requires a set of "admissible sets of precisifications." This leads immediately to a regress of higher-order vagueness. While supervaluationists often claim to handle higher-order vagueness, doing so by iterating the mechanism indefinitely threatens to make the truth conditions indeterminate at every level, undermining the logical preservation (e.g., validity) that supervaluationism promises. If the constraints on logic are themselves vague, the logic loses its normative force.

  **Option B: The boundary of $K$ is sharp.**
  To avoid the regress and secure the logic, the supervaluationist must assert that there is a precise fact of the matter about which precisifications are admissible. There must be a specific point in the "space of meanings" where a precisification stops being a legitimate candidate for the meaning of $P$.

  If Option B is chosen, the supervaluationist is committed to the existence of a sharp boundary. It is not a boundary between bald and not-bald in the object language, but it is a boundary between *meaning-consistent* and *meaning-inconsistent* sharpenings in the meta-language.

  ### 5. The Commitment to Epistemicism

  If we accept Option B (as we must to avoid logical collapse), we must ask: Can we know where this boundary lies?

  If we could identify the sharp boundary of $K$, we could identify the "most precise" admissible precisification or the limit of the admissible range. This would effectively solve the Sorites paradox by identifying the limits of the predicate's application, which supervaluationism claims is impossible. Therefore, the supervaluationist must maintain that while there is a sharp boundary between admissible and inadmissible precisifications, **we cannot know where it is.**

  This position is structurally identical to **Epistemicism**.

  1.  **Epistemicism:** There is a sharp cut-off in the extension of $P$ (e.g., $n$ hairs is bald, $n+1$ is not), but we are ignorant of its location due to semantic instability or use-facts.
  2.  **Supervaluationism (with sharp $K$):** There is a sharp cut-off in the set of admissible meanings for $P$ (precisification $S_n$ is admissible, $S_{n+1}$ is not), but we are ignorant of its location.

  The "modeling device" reply attempts to treat precisifications as non-real. However, the *constraints* on those models (admissibility) cannot be non-real, or the models cannot do their semantic work. By insisting that admissibility is a precise, objective constraint while maintaining that we cannot locate the limit of that constraint, the supervaluationist posits a sharp boundary that is essentially epistemic.

  The ignorance is no longer about "Is hair $n$ bald?" but rather "Is precisification $S_n$ a valid model of 'bald'?" This is a distinction without a difference. To say there is a fact of the matter about the limits of meaning that we cannot access is to embrace the core thesis of epistemicism: vagueness is a form of ignorance regarding sharp semantic boundaries.

  ### 6. Conclusion

  The supervaluationist's claim that precisifications are "mere modeling devices" fails to dissolve the "many sharp boundaries" objection because it ignores the ontological status of the **admissibility constraint**. One cannot have a well-defined supervaluation without a well-defined set of admissible precisifications.

  If the boundary of this set is vague, the theory collapses into regress. If the boundary is sharp, the theory posits a precise limit to meaning that speakers cannot identify. This forces the supervaluationist into a meta-linguistic epistemicism. They deny sharp boundaries in the world only to posit them in the space of semantic possibilities, maintaining that these boundaries are unknowable. Thus, the standard reply does not eliminate the commitment to sharp boundaries; it merely hides them one level up in the meta-theory, incurring the same counter-intuitive costs as the epistemicism they sought to avoid.
