      *   *Point 4 (Money & Ethics):* Turing was pragmatic. The aunt's money requires "scientific research." If the design is flawed, it's not science. He would separate the *validity of the experiment* from the *truth of the hypothesis*. You can fund a rigorous experiment that disproves the hypothesis. The money should fund the *rigor*, not the hoped-for outcome. If the proposal lacks the controls to rule out mundane explanations (data contamination), it fails the "scientific" criterion regardless of the spiritual promise.

