answer: |-
  Turing's 1950 treatment of extra-sensory perception was neither an endorsement nor a dismissal, but a procedural containment. He conceded ESP might exist but insisted the experimental arrangement must render it irrelevant to the test of machine intelligence. Applied to this proposal, he would likely view the computational sitting not as a pure test of psi, nor merely of machine performance, but as an experimental design where the two are dangerously entangled. The core distinction he would draw is between *simulation* and *causation*. The Imitation Game tests simulation; this proposal claims causation (contact with the dead). Unless the machine's output can be proven to originate from outside its training distribution, the result remains ambiguous. He would argue that without isolating the information source, the test fails to distinguish between a stochastic parrot and a spiritual medium. The structural move he made in 1950 was to exclude ESP to save the test of intelligence; here, excluding ESP is the only way to save the test of survival. He would insist that the Imitation Game was about behavioral indistinguishability, deliberately bypassing the question of internal states. This proposal inverts that: it uses behavioral indistinguishability to prove an internal state (survival). Turing would see this as a category error unless the behavioral data is strictly purged of normal explanatory variables.

  Regarding controls, Turing's taste for operational criteria suggests he would demand rigorous quantification over qualitative testimony. The relatives' preference is subjective data, prone to expectancy effects. He would insist on a double-blind protocol where neither the family nor the researchers know which transcript corresponds to the fine-tuned model during evaluation. Statistical thresholds must be pre-registered to avoid the replication crisis pitfalls you noted. He would treat the model as a black box that must be stress-tested against chance. The "telepathy-proof room" equivalent here is data isolation: proving the model could not have inferred the sealed details from correlated public data. He would require a null hypothesis based on maximum likelihood estimation from known texts, demanding the anomalous details exceed this baseline significantly. He would not accept "feeling" as data; he would require p-values that withstand multiple comparisons.

  On the sealed-material variant, Turing would appreciate the attempt to close data leakage but remain cautious about interpretation. A positive result here demonstrates anomalous information transfer, not necessarily survival. It could indicate ESP on the part of the living (reading the sealed envelope psychically) rather than the dead speaking. Turing distinguished between the *physics* of information transfer and the *metaphysics* of the source. He would likely categorize a success as evidence for psi or data contamination, remaining agnostic on consciousness survival. The model lacks agency; it predicts tokens. Finding private details in its output suggests the details were accessible somewhere in the informational universe, not that the deceased person is guiding the generation. He would warn against the category error of equating information retrieval with ontological continuity. Furthermore, he would note that language models compress public knowledge; what seems private may be inferable from public patterns. A model trained on millions of biographies learns the structure of secrets. It might generate a "revealed" detail that feels specific but is actually a high-probability guess based on personality profiles. Turing would demand an analysis of the information entropy: is the detail truly surprising given the public corpus, or just seemingly personal? He would treat the model as a compression algorithm that might decompress hidden correlations without any supernatural aid.

  Finally, separating the experiment from the funding: Turing would argue that "scientific research" is defined by methodological rigor, not the plausibility of the hypothesis. Your aunt's will requires science, not spiritualism. If the proposal includes the controls above, it qualifies as science even if the hypothesis is fantastical. If it relies on anecdotal validation, it is entertainment. The money should fund the design that allows for a definitive negative result as much as a positive one. A study designed to prove survival is advocacy; a study designed to test it is science. The trustees' duty is to ensure the method can fail. If the applicants cannot define what failure looks like numerically, they are not doing science. Turing would remind you that the will asks for research into survival, not proof of it. Research implies inquiry. If the design is rigged to always produce a comforting narrative, it violates the terms. He would advise you to act as the interrogator in his own game: challenge the claimants until their definitions are operationally sound.

  I recommend we condition funding on a pre-registered, double-blind protocol with strict data isolation controls. We must require that the research design allows for a definitive negative result and distinguishes between anomalous information transfer and consciousness survival. If the applicants cannot guarantee that sealed material remains inaccessible to the model's training logic, the project fails the scientific criterion. We fund the rigor, not the hope.
