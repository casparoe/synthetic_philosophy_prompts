answer: |-
  You are right to feel that something is off, but the "cheating" you sense isn't in the theorem—it's in your friend's characterization of what the theorem claims. Your friend is presenting **category errors** as **counterexamples**.

  Good's Theorem is a mathematical result about a specific model. Like all such results (Newton's laws, Arrow's Theorem), it has a domain of validity. If you step outside that domain, the conclusion doesn't hold, but the theorem isn't "false"; it's just inapplicable.

  Here is the breakdown of where the argument breaks, how to distinguish the cases, and how to save the theorem without cheating.

  ### 1. The Broken Step: Reject (5) and (8)

  You should reject step **(5)** ("if 'deleted' means genuinely infeasible... the theorem is false") and the trilemma in **(8)**.

  The theorem is not false. It is a conditional statement: **IF** the information is costless **AND** the information does not change the feasible action set **AND** the information does not causally alter the state/outcome mapping, **THEN** expected utility cannot decrease.

  Your friend's examples show scenarios where the **antecedents** (the "IF" part) are false. Pointing out that the conclusion fails when the assumptions are violated is not a refutation of the theorem; it is a confirmation of its boundary conditions.

  The feeling of "cheating" comes from thinking "free" is a colloquial term. In decision theory, "free" means **zero utility cost**. If accepting the information triggers a compliance ban or a market reaction that lowers utility, the information was not "free" in the utility sense, or the *act* was not the same.

  ### 2. Analyzing the Counterexamples

  Your friend conflates two different ways a signal can be "toxic." They look similar, but they violate different assumptions of the decision model.

  #### Case (2): The Compliance Rule (Action Space Violation)
  *   **The Scenario:** Knowing the price makes the act "Buy" illegal.
  *   **The Violation:** This violates the assumption of **Action Space Invariance**.
  *   **Why it's not a counterexample:** Good's Theorem compares two decision problems:
      1.  Choose $a \in A$ without signal $S$.
      2.  Observe $s \in S$, then choose $a \in A$.
      Notice that $A$ (the set of feasible acts) is the *same* in both lines. In your friend's example, $A_{no\_info} = \{\text{Buy, Hold}\}$ but $A_{info} = \{\text{Hold}\}$.
  *   **Addressing Point (4):** Your friend asks: "If hearing 'it'll be 8' counts as deleting 'buy' [because I wouldn't do it], isn't the theorem vacuous?"
      *   **No.** There is a hard distinction between **endogenous exclusion** (I see the price is 8, so I *choose* not to buy) and **exogenous exclusion** (I see the price is 8, and the SEC *forbids* me from buying).
      *   Good's Theorem allows endogenous exclusion (that's the whole point of conditioning!). It requires exogenous feasibility to remain constant.
      *   **Verdict:** This scenario is simply outside the theorem's scope. It doesn't make the theorem false; it makes the scenario a different game.

  #### Case (6): The Market Reaction (Causal Invariance Violation)
  *   **The Scenario:** Knowing the price changes your face, which changes the dealer's behavior.
  *   **The Violation:** This violates the assumption of **Causal Invariance** (or State Independence).
  *   **Why it's different from (2):** In (2), the *rules* changed. In (6), the *physics* changed.
  *   **The Technical Detail:** Standard decision theory models outcomes as a function of Action and State: $O = f(a, \omega)$. Good's Theorem assumes that $f$ is stable regardless of whether you observed a signal about $\omega$.
      *   In Case (6), the outcome function becomes $O = f(a, \omega, \text{Info})$.
      *   If you don't know the price, $f(\text{Buy}, \text{High}) = \text{Profit}$.
      *   If you do know the price, $f(\text{Buy}, \text{High}, \text{Known}) = \text{No Trade}$.
      *   Because the consequence of the *same act* in the *same state* depends on whether you hold the information, the information is not a passive observation. It is a **causal intervention**.
  *   **Verdict:** Good's Theorem applies to *observations*, not *interventions*. If the act of measuring changes the system (Heisenberg style, or poker style), the theorem's assumptions are not met.

  ### 3. Addressing the Proof Critique (7)

  Your friend says: *"The proof never compares a world where the message arrives with a world where it doesn't."*

  This is the crux of the confusion. The proof **does** compare them, via a transitive step that your friend is implicitly denying.

  1.  Let $EU_{\text{blind}}$ be the utility of acting without the signal.
  2.  Let $EU_{\text{see\_ignore}}$ be the utility of seeing the signal but forcing yourself to take the blind-optimal act anyway.
  3.  Let $EU_{\text{see\_opt}}$ be the utility of seeing the signal and optimizing.

  **The Logic:**
  *   **Step A:** $EU_{\text{see\_opt}} \geq EU_{\text{see\_ignore}}$ (Optimization can't hurt).
  *   **Step B:** $EU_{\text{see\_ignore}} = EU_{\text{blind}}$ (This is the critical equality).
  *   **Conclusion:** $EU_{\text{see\_opt}} \geq EU_{\text{blind}}$.

  **Your friend's error:** They are attacking **Step B**.
  In the Compliance and Market Reaction cases, $EU_{\text{see\_ignore}} \neq EU_{\text{blind}}$.
  *   **Compliance:** If you see the signal and try to "ignore" it by buying, you get arrested (utility -$\infty$). If you stay blind, you buy safely (utility +4).
  *   **Market:** If you see the signal and try to "ignore" it by buying, the dealer reads your face and blocks you. If you stay blind, the dealer sells.

  The theorem is mathematically sound. The application fails because **Step B** requires the signal to be causally inert. If the signal changes the world, "Seeing & Ignoring" is not the same world as "Not Seeing."

  ### 4. The Medical Scan (Untreatable Conditions)

  You asked: *"If I give up the trader, what am I committed to about... people who turn down a scan for something untreatable?"*

  This is the cleanest case, and it reveals where the "free" definition matters.

  **Option A: Utility is only over physical health.**
  If the disease is untreatable, the action set is $\{\text{Live Life}\}$ in both cases. The state is $\{\text{Sick, Healthy}\}$. The outcome is the same regardless of knowledge.
  *   **Good's Theorem Prediction:** Value of Information = 0. You should be indifferent.
  *   **Observation:** People pay to *avoid* the scan.
  *   **Conclusion:** These people are either (1) not Expected Utility Maximizers, or (2) their Utility function includes **mental states**.

  **Option B: Utility includes mental states (Anxiety/Hope).**
  If $U$ depends on your beliefs (e.g., $U(\text{Health}, \text{Anxiety})$), then acquiring information changes the "Anxiety" variable directly.
  *   In this model, the information is **not free**. It has a "psychic cost."
  *   Good's Theorem says: $EU(\text{Info}) - \text{Cost} \geq EU(\text{No Info})$.
  *   If the psychic cost of anxiety > instrumental value (which is 0 for untreatable conditions), then rationally rejecting the scan is consistent with EU maximization.

  **Verdict:** You don't have to call them incoherent. You simply acknowledge that for them, the information is not "free" in utility terms. The theorem holds: if the scan were truly costless (no anxiety) and untreatable, a rational agent *would* be indifferent. The fact that they aren't proves there is a cost.

  ### 5. Summary: How to Keep the Theorem

  You can keep the theorem without cheating by being precise about the **Model**.

  1.  **Reject (5):** The theorem is not false. The counterexamples violate the *invariance assumptions* (Action Space and Consequence Function).
  2.  **Distinguish (2) and (6):**
      *   (2) changes the **Rules** (Action Set $A$).
      *   (6) changes the **Physics** (Outcome Function $P(O|A,S)$).
      *   Both render the theorem inapplicable, but for distinct technical reasons.
  3.  **Fix (7):** The proof *does* compare "See" vs. "Don't See," but it relies on the assumption that "See + Ignore" is equivalent to "Don't See." Your friend's examples show where that equivalence breaks.
  4.  **Medical Scans:** People who reject scans reveal that information has a **utility cost** (anxiety) or that they care about **beliefs** directly. This fits the theorem if you define "free" as "zero utility cost."

  **The Pitch to Your Group:**
  "Good's Theorem isn't a claim that *all* information is good. It's a claim that *purely epistemic* updates in a *stable* environment are non-negative. My examples show that real-world information often comes with *causal side-effects* (compliance, market reaction, anxiety). When those side-effects exist, we aren't testing Good's Theorem anymore; we're testing a different decision problem where the 'cost of information' is non-zero or the 'action space' is variable. The theorem remains true for the class of problems it describes: passive observation in a static world."

  This preserves the theorem's content (it's a powerful baseline for instrumental rationality) while acknowledging your friend's intuition (real-world information is often dangerous). The danger doesn't come from the *knowledge*; it comes from the *consequences of acquiring* the knowledge, which the theorem explicitly excludes from its definition of "free."
