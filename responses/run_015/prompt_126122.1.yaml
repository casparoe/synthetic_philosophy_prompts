      *(Self-Correction during drafting)*: I need to be careful with the Medical Scan example. Good's Theorem *does* allow for utility over beliefs if modeled correctly, but the standard interpretation is instrumental value. If the scan is truly costless (no anxiety) and untreatable, a rational EU maximizer *should* be indifferent. If they pay to avoid it, they are either not EU maximizers, or there *is* a cost (anxiety). I should emphasize that "free" means "zero utility cost," not "zero dollars."

