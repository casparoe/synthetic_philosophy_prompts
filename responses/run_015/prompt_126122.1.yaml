          *   *Scenario:* Knowing the price changes my facial expression, which changes the dealer's willingness to sell.
          *   *Analysis:* This is subtle. Does the signal change the *consequences* of the act?
          *   *Standard Decision Theory Model:* States of the world ($S$), Actions ($A$), Outcomes ($O$). Utility is over $O$. $O = f(a, s)$.
          *   *In this case:* The "State" isn't just "Price tomorrow." The "State" includes "Dealer's willingness to sell."
          *   *Crucial Distinction:* Is the dealer's reaction part of the *state* or part of the *consequence function*?
          *   If the signal *causes* the dealer to react differently, then the mapping from $(Action, State)$ to $Outcome$ has changed depending on whether the signal was received.
          *   Actually, it's deeper: The signal is not *partitioning* the state space neutrally. The signal is *causally intervening* on the world.
          *   *Good's Theorem Assumption:* The signal is a *passive* observation of a pre-existing state. It is not a *causal intervention*.
          *   *Verdict:* This violates the assumption that the signal does not change the world (causality). This is often framed as "The signal must not be a cause of the state." Or, more precisely, the probability distribution over states/outcomes conditional on action must not depend on whether information was acquired, *except* through the agent's choice of action. Here, acquiring information changes the outcome *for the same action*.
          *   *Comparison to (2):* (2) changes the *rules* (action space). (6) changes the *physics/causality* (outcome function). Both violate assumptions, but slightly different ones.

