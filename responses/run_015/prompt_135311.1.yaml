      *   **Topic:** The debate over Karl Popper's assessment of Darwinism (specifically his claim that it's a "metaphysical research program" rather than a testable science, his later recantation, and the ongoing scholarly dispute).
      *   **Core Question:** Why has this debate stalled? (Is it verbal, substantive, or a case of talking past each other?)
