      *   **Constraint:** Answer in American English.

  2.  **Deconstruct the Debate:**
      *   *Popper's Initial Claim (1974):* Darwinism is a metaphysical research program. Why? Because it's tautological (survival of the fittest = survival of those who survive) or because it can explain *any* outcome post-hoc. It lacks falsifiability.
      *   *Biologists' Counter:* Evolution makes risky predictions (e.g., fossil records, genetic constraints). It's not just post-hoc storytelling.
      *   *Popper's Recantation (1978):* He admitted he was wrong, that Darwinism *is* testable.
      *   *Scholarly Dispute:* Did Popper really change his mind about the *logic*, or just the *sociology* of science?
      *   *New Philosophical Angle:* The tension between universal laws (Popper's ideal) and historical narratives (evolution's reality).

  3.  **Diagnose the Stall (The "Why"):**
      *   *Is it merely verbal?* Partly. "Scientific" means different things to a logician (deductive structure, universal laws) vs. a practitioner (methodological rigor, empirical success). But it's not *just* verbal.
      *   *Is it substantive?* Yes. It's about the nature of explanation in historical sciences. Can unique events be "scientific"?
      *   *Is it talking past each other?* This is the strongest diagnosis. Popper was often talking about the *logical structure of the theory* (is it a tautology?), while biologists were talking about the *practice of research* (do we make predictions that get confirmed?).
      *   *The "Historical vs. Nomothetic" Clash:* Popper's falsificationism was built for physics (universal laws). Evolution is historical (contingent paths). Applying a physics standard to a history standard creates friction.

  4.  **Formulate the Diagnosis:**
      *   The debate is stalled because it is a **category error** disguised as a disagreement.
      *   It mixes *logical status* (is the core principle tautological?) with *methodological utility* (does the framework generate testable hypotheses?).
      *   It also mixes *synchronic* laws (physics) with *diachronic* narratives (evolution).
      *   Therefore, the sides are answering different questions under one label.

  5.  **Determine Pathways to Progress:**
