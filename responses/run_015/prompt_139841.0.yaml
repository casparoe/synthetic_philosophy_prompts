  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Modeling of Historical Dynamics and Structural-Demographic Theory
  **Date:** October 26, 2023
  **Rapporteur:** [Name Withheld]
  **Signatories:** [The Modeler], [The Historian]

  ### I. Joint Consensus Claims

  The undersigned participants in this colloquium acknowledge the following points as established common ground, notwithstanding our theoretical divergences:

  1.  **Reality of Instability:** Periods of significant social instability, state fiscal crisis, and violent conflict are empirically verifiable features of the historical record in both pre-industrial and industrial societies.
  2.  **Data Limitations:** All historical data, whether quantitative (e.g., Seshat) or qualitative (e.g., archival narratives), are subject to sampling bias, preservation bias, and coder subjectivity. Neither party claims access to a "view from nowhere."
  3.  **Model Simplification:** Any formal model of historical dynamics necessarily abstracts away from the full complexity of human agency and cultural context. The utility of a model is distinct from its ontological completeness.
  4.  **Retrospective Coding:** Variables used in structural-demographic modeling (e.g., "elite," "well-being") are often coded retrospectively. Both parties agree that transparency regarding coding rules is essential for reproducibility.
  5.  **Value of Dissent:** The tension between nomothetic (law-seeking) and idiographic (particular-seeking) approaches is productive. The modeler's search for patterns and the historian's focus on meaning serve as mutual corrective mechanisms against overfitting and narrative drift, respectively.
  6.  **Non-Stationarity Risk:** Both parties acknowledge that the transition to industrial capitalism and fossil-fuel dependence represents a potential regime shift in historical dynamics, complicating the extrapolation of pre-1800 models to the present.

  ***

  ### II. Table of Residual Disagreements and Cruxes

  The following table outlines the specific points of contention remaining between the parties. For each crux, we have agreed upon a formulation of the disagreement, a test or body of evidence deemed relevant by both sides, and pre-registered predictions.

  | Crux | Formulation of Disagreement (Accepted by Both) | Agreed Test / Evidence | Modeler's Pre-Registered Prediction | Historian's Pre-Registered Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Single-Realization Problem**<br>*(Statistical Significance)* | Is the observed ~200–300 year periodicity in state instability distinguishable from stochastic red noise plus a trend in a short, unevenly sampled, autocorrelated time series?^1 | Pre-registered surrogate data testing (e.g., phase-randomized surrogates) applied to Seshat and independent datasets (e.g., Roman, Chinese, Mayan). | Spectral analysis will reject the null hypothesis of red noise at $p < 0.05$, indicating a structural cycle. | Spectral analysis will fail to distinguish the signal from red noise given the degrees of freedom; apparent periodicity is an artifact of pattern-seeking. |
  | **2. Out-of-Sample Forecasting**<br>*(Non-Stationarity)* | Can a model fitted exclusively on pre-industrial data (pre-1800 Europe/Global) successfully forecast the frequency and intensity of instability events in the industrial era (1800–2000)?^2 | Train model on $t < 1800$. Forecast instability indices for $t > 1800$. Compare against recorded conflict/fiscal crisis data. | The model will capture the *timing* of crisis peaks within one decade, though magnitude parameters may require scaling for industrial energy throughput. | The model will fail to predict specific peaks or will generate false positives, as industrialization altered the causal mechanisms (non-stationarity). |
  | **3. Measurement of Elite Overproduction**<br>*(Circularity)* | Can "elite overproduction" be operationalized and measured *independently* of the instability it is invoked to explain, or is it diagnosed only post-hoc?^3 | Correlation of independent proxies (e.g., ratio of advanced degrees to elite positions, wealth inequality metrics) with instability, using time-lagged analysis ($t_0$ vs $t_{+10}$). | Independent proxies at $t_0$ will significantly correlate with instability at $t_{+10}$ without recourse to crisis data for coding. | Coding of "elite aspirant" relies on retrospective knowledge of who failed; independent proxies will show weak or inconsistent correlation. |
  | **4. Ontology of "Mechanism"**<br>*(Terminology & Cause)* | Does the term "mechanism" refer to a causal engine operating on agents (Modeler) or a narrative structure imposed by observers (Historian)?^4 | Conceptual analysis of case studies (e.g., French Revolution). Does the model explain *why* actors chose rebellion, or only *when* conditions were ripe? | The model identifies necessary conditions (pressure) that function as causes, even if insufficient to explain specific agency. | The model identifies correlates (residue); without accounting for participant meaning, no causal claim can be sustained. |

  ***

  ### III. Rapporteur's Analysis: Classification of Disputes

  *Prepared by the Rapporteur for the purpose of clarifying the nature of the collaboration.*

  In reviewing the above cruxes, we classify the nature of the disagreements as follows. This classification indicates which disputes might be settled by data, which by definition, and which may persist regardless of evidence.

  | Crux | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Single-Realization** | **Empirical / Decidable** | This is a statistical question. Given agreed-upon null models and significance thresholds, the data can support one side over the other. However, power limitations due to sample size (N of civilizations) may render the result inconclusive rather than definitive. |
  | **2. Out-of-Sample** | **Empirical / Decidable** | This is a standard forecasting test. Failure or success can be measured. However, the *interpretation* of failure (e.g., "wrong parameters" vs. "wrong theory") remains a philosophical shield against falsification. |
  | **3. Elite Overproduction** | **Mixed (Empirical & Verbal)** | The correlation test is empirical. However, the disagreement rests partly on the verbal definition of "elite." If the Modeler defines elite by income and the Historian by social capital, they are measuring different constructs. |
  | **4. Ontology of Mechanism** | **Philosophical / Enduring** | This dispute will survive any amount of data. It concerns the nature of historical explanation (causation vs. understanding). Data can show correlation, but cannot adjudicate whether a statistical pressure constitutes a "cause" in the humanistic sense. |

  ***

  **Notes on Framing and Constraints**

  ^1 **Note on Question-Begging:** The formulation of Crux 1 assumes that history *could* theoretically constitute an ensemble if sampled differently. The Historian rejects this premise, holding that history is inherently a singular trajectory where "ensemble" statistics are category errors. This framing is retained here to allow for the statistical test requested by the Modeler, but the Historian signs only under the proviso that a negative result confirms their ontological objection, while a positive result does not necessarily refute it.

  ^2 **Note on Non-Stationarity:** The Modeler accepts the test but reserves the right to adjust parameters for "energy throughput" post-1800. The Historian argues that allowing parameter adjustment post-hoc undermines the "out-of-sample" claim. The test proceeds with fixed structural parameters; scaling factors must be pre-registered.

  ^3 **Note on Circularity:** The User's framing suggests "elite overproduction" is *only* diagnosed after breakdown. The Modeler objects that this characterizes their method as purely post-hoc. The test is designed specifically to address this by requiring time-lagged independent variables.

  ^4 **Note on Terminology:** The User's suspicion that the Modeler imports standards from population ecology is correct and acknowledged by the Modeler. The Historian argues that ecological standards are inappropriate for human agents. This crux is classified as Philosophical because no amount of data can force the Historian to accept ecological causality as sufficient for historical explanation.

  ***

  **Signatures:**

  _________________________ (The Modeler)

  _________________________ (The Historian)

  _________________________ (The Rapporteur)
