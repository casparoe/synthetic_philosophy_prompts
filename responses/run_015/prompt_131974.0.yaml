answer: |-
  Pull up a chair. The coffee is terrible, but that's appropriate because the math we're about to wade into is mostly bitter.

  You want to write about why reasonable people flinch at Expected Value (EV) maximization without looking like they're just afraid of big numbers. The problem is that most critiques of EV are either mathematically incoherent or secretly rely on EV themselves. If you're going to build a spec for a decision theory that handles the "weird edge cases" (asteroids, muggings, clinic replications) without collapsing, you need to know exactly where the bodies are buried.

  Here is the specification sheet. This is what your theoretical framework must deliver to be taken seriously.

  ### The Functional Requirements (The Cases)

  **1. The Anti-Fanaticism Constraint (Pascal's Mugging)**
  *   **The Case:** A stranger demands $5, claiming that if you don't pay, a simulation god will torture $10^{100}$ people. The probability is tiny, but the utility is infinite-ish. EV says pay. Sanity says walk away.
  *   **Requirement:** The theory must allow an agent to reject a bet with arbitrarily high expected value if the probability is sufficiently low and the mechanism is sufficiently opaque.
  *   **Status:** **Hard.** If you can't solve this, you're vulnerable to money pumps and absurd resource allocation.

  **2. The Aggregation Constraint (St. Petersburg / Micro-Replication)**
  *   **The Case:** You reject a single bet with a 1% chance of saving 1,000 lives (EV = 10) in favor of a guaranteed 5 lives. Fine. But what if you face that *same* bet 10,000 times independently (the village clinic scenario)? The Law of Large Numbers says the aggregate outcome will converge on the EV. Rejecting the aggregate is suicide.
  *   **Requirement:** The theory must transition from "reject low-probability tail risk" in the one-off case to "accept EV dominance" in the high-repetition case.
  *   **Status:** **Hard.** If you reject the single bet, logic dictates you should reject the bundle (unless you have specific utility curvature). Breaking this looks like intransitivity.

  **3. The Institutional Scale Distinction**
  *   **The Case:** An individual donating $500 vs. a government allocating $50 billion.
  *   **Requirement:** The theory must account for *role morality*. A government has a fiduciary duty to aggregate risk across a population that an individual does not. A theory that treats a lone donor and a treasury secretary identically is useless for policy.
  *   **Status:** **Negotiable.** You can argue for a universal theory, but it makes policy application painful.

  **4. The Epistemic Humility Condition (Climate/Existential Risk)**
  *   **The Case:** We don't know the odds of climate catastrophe. Is it 1%? 10%? The error bars are huge.
  *   **Requirement:** The theory must handle "Knightian Uncertainty" (unknown probabilities) differently from "Risk" (known probabilities). It cannot require precision that doesn't exist.
  *   **Status:** **Hard.** Forcing an agent to compute a precise probability for asteroid deflection when the physics is unsettled is cognitive theater.

  ### The Structural Distinctions (What You Can't Collapse)

  **5. Moral Risk vs. Prudential Risk**
  *   **The Distinction:** Losing your own money vs. risking others' lives.
  *   **Requirement:** The theory must weigh the *variance* of outcomes higher when others are bearing the cost. EV maximization is often more acceptable for prudential risk (gambling your own savings) than moral risk (gambling with a village's water supply).
  *   **Status:** **Hard.** Collapsing these leads to the "tyranny of the algorithm" problem.

  **6. Deontological Status vs. Utilitarian Weight**
  *   **The Distinction:** Some actions are forbidden regardless of the payoff (rights violations), while others are just "less good."
  *   **Requirement:** The theory needs a "lexical priority" switch. You can't just trade off rights against utility on a linear scale.
  *   **Status:** **Negotiable.** Pure consequentialists will fight you here, but for a general audience, this is non-negotiable.

  ### The Cognitive Consistency Conditions

  **7. Bounded Computability**
  *   **The Requirement:** The agent cannot be required to calculate probabilities they cannot access. If the theory requires a Bayesian update on a prior that is essentially a guess, it fails.
  *   **Status:** **Hard.** Humans don't have log-odds processors in their heads.

  **8. Dynamic Consistency (No Money Pumps)**
  *   **The Requirement:** You cannot prefer A to B, B to C, and C to A. You also cannot be forced into a sequence of trades that leaves you poorer than when you started.
  *   **Status:** **Hard.** If you violate this, you aren't a decision theory; you're a pathology.

  ---

  ### The Trap: Jointly Unsatisfiable Pairs

  Here is the part you need for the article. This is where the math bleeds. You cannot have it all. There are impossibility theorems lurking here.

  **1. Fanaticism Avoidance vs. Aggregation Consistency**
  *   **The Conflict:** If you reject a positive-EV bet because the probability is too low (to avoid Pascal's Mugging), you logically *must* reject a bundle of those same bets if they are independent and your utility function is linear.
  *   **Why:** Standard decision theory (Von Neumann-Morgenstern) says if you prefer Status Quo to Bet X, you must prefer Status Quo to (Bet X + Bet X).
  *   **The Cost:** To accept the "Village Clinic" aggregate while rejecting the "Asteroid" one-off, you have to violate the **Independence Axiom**. You are effectively saying "The value of a bet changes depending on how many other bets I'm making." This opens you up to accusations of arbitrage or intransitivity.
  *   **Verdict:** You have to choose: either you accept some level of fanaticism (to keep the math clean) or you accept that your theory is "frame-dependent" (value changes based on context).

  **2. Epistemic Humility vs. Dynamic Consistency**
  *   **The Conflict:** If you say "I won't bet because the probability is too vague" (Humility), but then later update your probability slightly and take the bet, you can be money-pumped by a bookie who knows your rules.
  *   **Why:** To avoid being pumped, you need a precise threshold. To be humble, you need a fuzzy threshold.
  *   **Verdict:** You cannot be perfectly humble and perfectly consistent. You will have to draw an arbitrary line somewhere.

  **3. Moral Risk Sensitivity vs. Impartiality**
  *   **The Conflict:** If you weight moral risk differently than prudential risk, you violate the idea that "a life is a life."
  *   **Why:** If I save 10 lives with 90% certainty (Clinic) vs. 1,000 lives with 1% certainty (Asteroid), EV says they are equal (9 vs 10). If you reject the Asteroid because it's "too risky" for *others*, but would take it for *yourself*, you are violating impartiality.
  *   **Verdict:** You can't satisfy the "Institutional Scale" requirement without violating strict impartiality.

  ---

  ### The Scoreboard

  Here is how the current contenders stack up against the spec. Remember, I'm weighing the criteria, not declaring a winner.

  **1. Straight EV Maximization**
  *   **Fanaticism:** **Fail.** It gets mugged every time. It forces you to fund the simulation god.
  *   **Aggregation:** **Pass.** It handles the 10,000 clinics perfectly.
  *   **Cognition:** **Fail.** Requires precise probabilities for unquantifiable risks.
  *   **Consistency:** **Pass.** Mathematically airtight, no money pumps.
  *   **The Verdict:** It's a great calculator, but a terrible boss. It works for the "Village Clinic" case but destroys credibility on the "Asteroid" case. It treats uncertainty as risk.

  **2. Risk-Weighted Expected Utility (with Cutoff)**
  *   *This is the theory where you discount probabilities below a certain threshold or weight them non-linearly.*
  *   **Fanaticism:** **Pass.** It cuts off the Pascal's Mug tail.
  *   **Aggregation:** **Fail/Conditional.** It struggles to explain why the 10,000 clinics become acceptable if the single one wasn't, unless you build in a specific "portfolio view" which complicates the math immensely.
  *   **Cognition:** **Pass.** Easier to justify "ignoring the noise."
  *   **Consistency:** **Fail.** Vulnerable to "stacking" arguments (breaking one big bet into many small ones to bypass the cutoff).
  *   **The Verdict:** This is the pragmatic choice. It admits the math is a map, not the territory. It sacrifices some consistency to save sanity.

  **3. Satisficing / Threshold Rules**
  *   *"Achieve a 'good enough' outcome with high probability."*
  *   **Fanaticism:** **Pass.** Ignores the huge tail if the baseline is met.
  *   **Aggregation:** **Pass.** Can be tuned to accept aggregates.
  *   **Cognition:** **Pass.** Very human. "Is this safe enough?"
  *   **Consistency:** **Fail.** Highly vulnerable to money pumps. If you prefer A to B, and B to C, you might prefer C to A depending on the threshold.
  *   **The Verdict:** This is how humans actually operate. It's not a decision *theory* so much as a decision *heuristic*. It fails the "Researcher" test but passes the "CEO" test.

  ### The Takeaway for Your Piece

  If you want to avoid the reheated take, don't just say "EV is wrong." Say "EV assumes a world of known probabilities and infinite repetition that doesn't exist for one-off existential risks."

  The winning argument isn't that we should ignore the math. It's that **EV maximization is a limit theorem, not a universal law.** It works when $N$ (number of trials) is large and $P$ (probability) is known. In the Asteroid case, $N=1$ and $P$ is unknown. In the Clinic case, $N=10,000$ and $P$ is known.

  The desiderata show that no single theory satisfies all conditions. The "smart rejection" of EV is actually a **contextual switch**: we use Risk-Weighted rules for one-off, high-uncertainty moral hazards, and EV rules for repeated, measurable institutional investments. The friction comes when people try to apply the Clinic logic to the Asteroid, or vice versa.

  That's the tension. Don't solve it; expose it.
