  *   **Framework A Prediction:** **Justified Act, No Further Sanction.** Process was correct (Last Resort), Attitude was correct (Acknowledgment/Resignation). The bad outcome (no pathogen) is luck, not a failure of duty.
  *   **Framework B Prediction:** **Unjustified Act.** The burden was placed on the neighbourhood for no actual gain (no pathogen). The risk was real, but the *harm averted* was zero. The "necessity" is retroactively negated.

