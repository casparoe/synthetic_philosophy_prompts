  (i) **The Rules**

  Your friend's verdicts are consistent with two distinct frameworks. Both fit the five precedents, but they rely on different justifications.

  **Framework A: The "Process & Moral Remainder" Rule**
  This framework focuses on the *procedure* of the decision and the *attitude* of the agent.
  1.  **Last Resort:** An unlawful act is only justified if lawful alternatives were exhausted or genuinely unavailable *at the time of decision* (Case 1 vs. Case 3). Actual outcomes do not retroactively justify the failure to try legal means (Case 3).
  2.  **Public Purpose:** The motive must be to prevent public harm, not to secure political advantage or institutional survival (Case 2).
  3.  **Moral Acknowledgment:** If the norm broken is morally valid, the agent must acknowledge the act as morally wrongful, even if necessary. They cannot claim moral cleanliness (Case 1).
  4.  **Transparency & Penalty:** The agent must disclose the act promptly and accept personal sanction (resignation, fine). Concealment voids justification (Case 5). Exception: If the norm broken is itself illegitimate, no penalty is owed (Case 4).

  **Framework B: The "Risk & Burden" Rule**
  This framework focuses on the *distribution of risk* and the *validity of the norm*.
  1.  **Norm Validity:** Dirty hands applies only when breaking a *just* rule. If the rule serves an unjust system, breaking it is whistleblowing, not dirty hands (Case 1 vs. Case 4).
  2.  **Burden Bearing:** The agent must absorb the cost of the transgression. If the risk/cost is shifted to the vulnerable without consent while the agent remains secure, it is corruption or abuse, not dirty hands (Case 2, Case 3, Case 5).
  3.  **Outcome Sensitivity:** While process matters, the act must actually avert the grave harm claimed. If the harm does not materialize, the necessity claim is weakened, though not necessarily fatal if the risk was real *ex ante* (Case 1 implies success; Case 3 implies process is primary).

  (ii) **Verdict on the Immunisation Director**

  **Under Framework A (Process & Moral Remainder):**
  *   **Act Justification:** **Unjustified.** He failed the "Moral Acknowledgment" test explicitly (claiming he "did nothing wrong" and refusing apology). He also likely fails the "Last Resort" test (did he seek emergency waivers? The prompt implies he chose this over a public campaign, but not over lawful regulatory relief).
  *   **Consequences:** **Prosecution and Removal.** He disclosed to the legislature but concealed from the affected recipients (violating Transparency). His refusal to accept sanction violates the "Penalty" rule.

  **Under Framework B (Risk & Burden):**
  *   **Act Justification:** **Unjustified.** The "Burden Bearing" rule is violated: the risk was borne by a "poor, largely unrepresented population" without consent, while the director protected the programme's reputation. The "Outcome Sensitivity" rule also weighs against him: no outbreak occurred, so the grave harm was hypothetical, yet the risk was real.
  *   **Consequences:** **Prosecution and Removal.** He shifted the risk to the vulnerable and kept his position/reputation intact.

