answer: |-
  ### Part 1: The Sorting Quiz

  **Instructions:** Read each short case and circle the answer that feels most right to you. Don't overthink it. Go with your first instinct.

  **1. The Twin Spheres**
  Imagine a universe with nothing in it but two iron spheres. They are exactly the same size, color, and temperature. They are a mile apart. There is no ground, no stars, no "left" or "right" of the universe—just the two spheres in the void. How many spheres are there?
  (A) One
  (B) Two

  **2. The Reason**
  (Only if you answered "Two" in Q1). Why are there two?
  (A) Because one is *here* and the other is *there*.
  (B) Because they are just two different things, full stop.
  (C) Because I can imagine pointing to one and not the other.

  **3. The Mirror Hands**
  Imagine a universe with nothing in it but two human hands. One is a left hand, one is a right hand. They are otherwise identical. How many hands are there?
  (A) One
  (B) Two

  **4. The Shape**
  (Regarding Q3). Are the hands different in how they are built, or just in how they face?
  (A) They are built differently (one fits a left glove, one fits a right).
  (B) They are built the same; they just face different ways.

  **5. The Dent**
  Back to the Twin Spheres (Q1). Imagine one sphere gets dented by a stray rock, stays dented for a year, and then the dent is magically smoothed out perfectly. After the repair, are they the same two spheres as before the dent?
  (A) Yes, the history makes them distinct forever.
  (B) No, they are back to being exactly alike.
  (C) It's impossible to say.

  **6. The Swap**
  Back to the original Twin Spheres (Q1). Imagine they slowly orbit each other and swap places. When they stop, is the sphere now on the left the same individual sphere that started on the left?
  (A) Yes.
  (B) No, they traded places.
  (C) There is no fact of the matter.

  **7. The Change**
  (Regarding Q6). When the swap is finished, is the universe different than it was at the start?
  (A) Yes, the spheres have moved.
  (B) No, the arrangement is exactly the same.

  **8. The Electrons**
  Imagine a box containing two electrons. Every measurement you take gives the exact same result for both. There is no way to tell them apart by testing them. How many particles are in the box?
  (A) One
  (B) Two

  **9. The Labels**
  (Regarding Q8). Can you say "Let's call this one Fred and that one Mary" and mean something real by it?
  (A) Yes.
  (B) No, that's nonsense.

  **10. The Void**
  If you removed space entirely (no "here" or "there"), could the two spheres from Q1 still be two things?
  (A) Yes.
  (B) No.

  ***

  ### Part 2: The Scoring Key & Taxonomy

  **How to use this:** Do not hand this out. This is for you to map student answer patterns to metaphysical positions during the tutorial. The tree is built from the splits in their answers, not from the history of philosophy. The philosophical labels are applied *after* the splits are identified.

  #### The Decision Tree

  **Node 1: The Primary Split (Q1)**
  *   **Answer (A) One:** The student denies distinctness without qualitative difference.
      *   *Go to Leaf Group 1 (The "One-ers").*
  *   **Answer (B) Two:** The student accepts distinctness without qualitative difference.
      *   *Go to Node 2 (The "Two-ers").*

  **Node 2: The Ground of Distinctness (Q2 & Q10)**
  *   **Answer Q2(A) "Here/There" OR Q10(B) "No Labels":** Distinctness relies on location or relations.
      *   *Go to Leaf Group 2 (The "Relationalists").*
  *   **Answer Q2(B) "Just two" OR Q10(A) "Yes Labels":** Distinctness is independent of location/qualities.
      *   *Go to Node 3 (The "Brute-ists").*

  **Node 3: The Tracking Test (Q6 & Q7)**
  *   **Answer Q6(A)/(B) "Yes/No" AND Q7(A) "Yes Changed":** Individuals persist and can be tracked; the swap is a real change.
      *   *Go to Leaf Group 3 (The "Haecceitists").*
  *   **Answer Q6(C) "No Fact" OR Q7(B) "No Change":** Individuals exist, but swapping them makes no difference to reality.
      *   *Go to Leaf Group 4 (The "Structuralists").*

  ---

  #### The Leaves (Mapped Positions)

  **Leaf Group 1: The "One-ers" (Q1 = One)**
  *   **1A: Bundle Theory.**
      *   *Pattern:* Q1(A), Q3(A or B).
      *   *View:* Objects are just collections of features. If features match, it's one object.
      *   *Status:* **Named.** (Standard Bundle Theory).
  *   **1B: Verificationism.**
      *   *Pattern:* Q1(A), Q5(C), Q6(C).
      *   *View:* If you can't tell the difference, the question is meaningless.
      *   *Status:* **Named.** (Logical Positivist strain).
  *   **1C: Strict PII (Qualitative Only).**
      *   *Pattern:* Q1(A), Q3(B).
      *   *View:* Distinctness *requires* intrinsic qualitative difference (like the hands).
      *   *Status:* **Named.** (Leibnizian).

  **Leaf Group 2: The "Relationalists" (Q1 = Two, but Q2 = Space)**
  *   **2A: Spatial Individuation.**
      *   *Pattern:* Q1(B), Q2(A), Q10(B).
      *   *View:* They are two because they occupy different volumes of space. Space does the work.
      *   *Status:* **Named.** (Relationist/Impenetrability view).
  *   **2B: Weak PII (Trivial Properties).**
      *   *Pattern:* Q1(B), Q2(A), Q10(A).
      *   *View:* They are two because one has the property "being this one."
      *   *Status:* **Named.** (Weak PII / Haecceitism-lite).
      *   *Note:* Hard to separate from 2A without Q10. If they say space matters *and* naming matters, they are likely Haecceitists masking as Relationalists.

  **Leaf Group 3: The "Haecceitists" (Q1 = Two, Q2 = Brute, Q7 = Change)**
  *   **3A: Bare Particulars.**
      *   *Pattern:* Q1(B), Q2(B), Q5(A), Q7(A).
      *   *View:* There is an underlying "stuff" (substratum) that holds the properties. The stuff is different even if properties match.
      *   *Status:* **Named.** (Substratum Theory).
  *   **3B: Primitive Thisness.**
      *   *Pattern:* Q1(B), Q2(B), Q5(A), Q7(A).
      *   *View:* No underlying stuff, just a brute fact of "this-ness."
      *   *Status:* **Named.** (Haecceitism).
      *   *Flag:* **Indistinguishable on this quiz.** 3A and 3B answer identically. You need a follow-up question about "what holds the properties" to separate them.
  *   **3C: Genidentity.**
      *   *Pattern:* Q1(B), Q5(A), Q7(A).
      *   *View:* History makes them distinct (the dent sticks).
      *   *Status:* **Named.** (Process Metaphysics).

  **Leaf Group 4: The "Structuralists" (Q1 = Two, Q7 = No Change)**
  *   **4A: Ontic Indeterminacy.**
      *   *Pattern:* Q1(B), Q6(C), Q7(B).
      *   *View:* There are two, but it is vague which is which. Reality itself is fuzzy.
      *   *Status:* **Named.** (Evans-style / Quantum Indeterminacy).
  *   **4B: Unnamed (Permutation Invariance).**
      *   *Pattern:* Q1(B), Q6(C), Q7(B), Q9(B).
      *   *View:* Two things exist, but swapping them is not a real possibility.
      *   *Status:* **Unnamed.** *Why:* Usually collapsed into Haecceitism or Structuralism; rarely held as a distinct metaphysical commitment without mathematical motivation.

  **Leaf Group 5: The "Physics Deferrers" (Q8 Divergence)**
  *   **5A: Metaphysical Consistency.**
      *   *Pattern:* Q1 & Q8 match (Both 1 or Both 2).
      *   *View:* Metaphysics applies to physics.
      *   *Status:* **Standard.**
  *   **5B: Physics Exception.**
      *   *Pattern:* Q1(2) & Q8(1).
      *   *View:* Macro objects follow metaphysics; quantum objects follow physics rules.
      *   *Status:* **Unnamed.** *Why:* Pragmatic, not metaphysical. Most students land here.

  ---

  #### Analysis for the Tutorial

  **1. Does Case 5 (Electrons) need its own branch?**
  **No.** It functions as a consistency check, not a new metaphysical branch.
  *   *Reasoning:* If a student answers "Two" for Spheres and "Two" for Electrons, they are consistent Haecceitists/Realists. If they answer "One" for both, they are consistent PII/Bundle theorists.
  *   *The Split:* The only time it creates a new leaf is if they say Spheres=2 but Electrons=1. This isn't a new metaphysical position; it's a **Physics Deference** move (Leaf 5B above). It indicates the student thinks metaphysics stops where the textbook begins. Use this to ask: *"Why does the rule change when the lab coat goes on?"*

  **2. Which leaves are indistinguishable?**
  *   **Bare Particulars vs. Primitive Thisness (3A vs 3B):** Your questions cannot separate these. Both say "Two," "Brute," and "Swap is Real." To separate them, you would need to ask: *"Is there a 'thing' underneath the features, or is the 'this-ness' just a fact?"* This is too technical for the quiz. Treat them as one cluster for the tutorial.
  *   **Weak PII vs. Haecceitism (2B vs 3A):** If a student says "They are two because I can name them" (Q10=A), they might mean "Naming reveals a brute fact" (Haecceitism) or "Naming creates a trivial property" (Weak PII). This is a **verbal disagreement**. Flag this in the tutorial: *"Are you saying they are different because you named them, or that you can name them because they are different?"*

  **3. Which questions do no real work?**
  *   **Q4 (Hands Shape):** Most students will agree hands are "built differently." This question rarely splits the room. Its value is confirming that students *can* spot qualitative difference, which makes their denial of it in Q1 more significant.
  *   **Q10 (Labels):** Often correlates perfectly with Q2. If they think space individuates, they usually think naming is valid. If they think brute fact individuates, they also think naming is valid. It rarely creates a unique leaf, but it helps expose the "Weak PII" verbal trick.

  **4. Where does the *real* disagreement live?**
  **Node 1 (Q1: The Twin Spheres Count).**
  This is the live wire.
  *   **The Fight:** Is numerical distinctness possible without qualitative distinctness?
  *   **Side A (PII/Bundle):** "If everything about them is the same, they are the same thing."
  *   **Side B (Haecceitism/Substratum):** "Two things can be exactly alike and still be two things."
  *   **Tutorial Strategy:** Spend the second half here. Ignore the electrons until the end. Ignore the hands (they are a distraction because they *are* qualitatively different). Focus entirely on Q1 and Q7.
      *   Ask Side A: *"If God made one, why couldn't He make two?"*
      *   Ask Side B: *"If you can't point to a difference, what are you pointing to when you say 'two'?"*

  **5. Unattractive/Incoherent Leaves:**
  *   **Leaf 4B (Permutation Invariance without Indeterminacy):** "There are two, but swapping them changes nothing, and there *is* a fact of the matter which is which, but we can't know it."
      *   *Status:* **Unattractive.** It posits hidden facts that make no difference to reality. Nobody sits here willingly; they usually slide into 4A (Indeterminacy) or 3A (Haecceitism).

  **Summary for the TA:**
  Your room is split at **Node 1**. Half think "Same qualities = One object." Half think "Two objects can have same qualities." The rest of the quiz just tells you *why* they think that (Space? Brute Fact? History?). Don't let them hide in the Electron case (Case 5). Force them to defend the Iron Spheres (Case 1). That is where the metaphysics is.
