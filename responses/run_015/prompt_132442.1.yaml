  hey so im trying to wrap my head around this scale arguement about insects being sentient and i think im mixing stuff up. my friend explained it like this after she read some blog post:

  she said the scale argument isnt really trying to prove bugs feel pain one by one—its more like a moral-risk argument. biologists think the chance any specific ant is sentient is tiny, maybe one in a million, but with like 10 quintillion insects alive right now, if you multiply those together you get an enormous expected suffering load. so she said philosophers apply a precautionary principle: since we cant check each insect individually, and the aggrigate numbers are so huge, killing bugs probably creates harm comparable to harming small mammals. she said critics call this the fallacy of division—treating a group statistic like it applies to each bug—but defenders reply thats wrong because expected-value math doesnt assign partial consciousness to individuals. then she concluded that if you accept utilitarianism, using insecticides is basically a moral catastrophe on par with factory farming, and anyone consistent has to stop killing them altogether.

  i feel like shes jumping pretty far from "expected value is high" to "therefore its exactly like factory farming," and also that fallacy name sounds off to me. but i dont really know the actual literature, so i cant tell if im just confused or if shes misrepresenting something. can you walk through her summary part by part and tell me whats accurate, whats a misrepresentation or overstatement, and whether her final conclusion actually follows from the correct parts? also, if im asking this in a totally wrong way—like if im conflating different arguments or the whole premise is busted—please just tell me straight instead of humoring me.
