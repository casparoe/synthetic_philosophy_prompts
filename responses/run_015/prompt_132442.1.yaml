answer: |-
  You are right to be skeptical. Your friend has accurately described the *mechanism* of the argument (expected value math) but has misrepresented the *criticisms*, misnamed the logical fallacies, and made a massive, unsupported leap to the final conclusion.

  Here is a part-by-part breakdown of what is accurate, what is confused, and where the argument falls apart.

  ### 1. The Core Logic: Expected Value & Moral Risk
  **Friend's Claim:** The argument isn't about proving bugs feel pain individually, but about moral risk. Low probability $\times$ Huge Numbers = High Expected Suffering.
  **Verdict:** **Accurate.**
  This is the standard "Pascalian" argument used in Effective Altruism and animal ethics circles (championed by thinkers like Brian Tomasik or researchers at Rethink Priorities).
  *   **How it works:** You don't need to prove an ant is sentient. You just need to assign it a non-zero probability (e.g., 1%). If there are $10^{18}$ insects, even a 0.0001% chance of sentience results in a massive "expected" number of sentient beings suffering.
  *   **The Precautionary Principle:** This is also correctly cited. Since we can't rule out sentience, the argument says we should act *as if* they matter to avoid the risk of causing astronomical harm.

  ### 2. The Biological Probability
  **Friend's Claim:** Biologists think the chance is tiny (1 in a million).
  **Verdict:** **Misrepresentation.**
  Biologists do not generally assign specific probability percentages to insect sentience. That is a philosophical heuristic, not a biological statistic.
  *   **The Reality:** Neuroscience is divided. Some argue the insect nervous system is too simple for subjective experience (nociception $\neq$ pain). Others argue convergence evolution suggests they might feel something.
  *   **Why it matters:** Using a specific number like "one in a million" makes the math look clean, but in reality, the uncertainty is "radical." We don't know if the probability is 50% or 0.0000001%. Relying on a made-up low probability to drive the math is a weak point critics exploit.

  ### 3. The Fallacy Name
  **Friend's Claim:** Critics call this the "Fallacy of Division."
  **Verdict:** **Incorrect.**
  This is a specific terminology error. The **Fallacy of Division** is assuming that what is true of a whole must be true of its parts (e.g., "This wall is heavy, so this brick is heavy").
  *   **The Actual Criticism:** Critics of the Scale Argument usually attack it using **Expected Utility Fanaticism** or **Aggregation Problems**.
      *   *Fanaticism:* If you follow expected value strictly, you end up prioritizing tiny-probability/high-stakes scenarios over real, certain harms (similar to Pascal's Mugging).
      *   *Aggregation:* Many ethicists argue you cannot simply sum up tiny bits of "expected suffering" to equal one unit of "real suffering."
  *   **Why she's wrong:** The defenders she quoted are right that expected value doesn't assign "partial consciousness." But the critics aren't saying they do; they are saying the *math itself* breaks down when probabilities get this small and numbers get this big.

  ### 4. The Conclusion: "On Par with Factory Farming"
  **Friend's Claim:** Therefore, using insecticides is a moral catastrophe on par with factory farming.
  **Verdict:** **Major Overstatement / Non-Sequitur.**
  This is the biggest leap in her summary. Even if you accept the "Scale Argument" that insects matter morally, equating insecticide use to factory farming ignores two critical variables: **Intensity** and **Duration.**
  *   **Duration:** Factory farming involves years of confinement, mutilation, and stress before death. Insecticide death is often rapid (neurotoxins cause quick shutdown). Even if the insect feels pain, the *duration* of that pain is seconds vs. years.
  *   **Intensity:** A mammalian nervous system is capable of complex emotional suffering (fear, anticipation, depression). An insect, if sentient, likely has a much narrower range of suffering.
  *   **The Math:** To equal the suffering of one factory-farmed pig, you would need to assume not just that insects are sentient, but that the *aggregate* of their short, low-intensity deaths outweighs the *singular* long, high-intensity life of the pig. That is a controversial claim, not a settled fact.

  ### 5. The Practical Conclusion: "Stop Killing Them Altogether"
  **Friend's Claim:** Anyone consistent has to stop killing them altogether.
  **Verdict:** **False / Impossible.**
  This is a "reductio ad absurdum" that even proponents of insect sentience reject.
  *   **Inevitability:** You kill insects by walking, driving, breathing, and harvesting plants (even vegan agriculture kills field mice and insects). A moral theory that demands you stop killing insects *altogether* requires you to starve to death.
  *   **Actual Consensus:** Philosophers who take insect sentience seriously (like Jeff Sebo or Jason Schukraft) argue for **reduction of gratuitous harm** and **prioritizing research**, not absolute abstention. They argue we should stop *unnecessary* spraying, fund welfare-friendly pest control, and study insect neurology—not that we must never swat a mosquito.

  ### Summary of the Breakdown

  | Component | Friend's Summary | Reality Check |
  | :--- | :--- | :--- |
  | **Core Logic** | Expected Value / Risk | **Accurate.** This is the actual argument used. |
  | **Probabilities** | Biologists say 1 in a million. | **False.** Philosophers use this for math; biologists don't assign odds. |
  | **Criticism** | Fallacy of Division. | **False.** It's about Aggregation or Expected Utility Fanaticism. |
  | **Comparison** | Insecticides = Factory Farming. | **Overstated.** Ignores intensity and duration of suffering. |
  | **Action** | Stop killing altogether. | **Impossible.** Even proponents argue for reduction, not elimination. |

  ### The Bottom Line
  Your intuition is correct. Your friend has taken a nuanced philosophical heuristic (the Scale Argument) and hardened it into a dogmatic conclusion that the actual literature does not support.

  **Is the premise busted?**
  Not entirely. The premise that "we should care about the risk of insect suffering" is a serious, respected position in modern ethics.
  **Is her conclusion valid?**
  No. The jump from "there is risk" to "insecticides are as bad as factory farming" requires assuming that insect suffering is easily aggregatable and comparable in quality to vertebrate suffering, which is highly contested. The jump to "you must stop killing them altogether" is practically incoherent.

  **How to respond to her:**
  You can tell her: *"The expected value math makes sense as a risk assessment, but you're conflating 'moral significance' with 'moral equivalence.' Even if insects matter, the intensity and duration of their suffering likely differs from mammals. Also, the criticism isn't the Fallacy of Division; it's that expected value theory breaks down at extreme scales. Finally, no serious philosopher argues we can stop killing insects altogether, since agriculture makes that impossible."*
