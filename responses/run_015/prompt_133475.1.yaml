answer: |-
  **Joint Statement on the Epistemic Status of the Church–Turing Thesis**

  **1. Agreed Claims**

  1.  **Distinction of Theses:** There is a substantive distinction between the Mathematical Thesis (concerning the extension of the concept 'effective procedure') and the Physical Thesis (concerning the computational capacity of physical systems in this universe).
  2.  **Convergence as Datum:** The extensional equivalence of Turing machines, general recursive functions, and the lambda calculus is a robust mathematical fact that any adequate account must explain, whether via conceptual analysis or physical constraint.
  3.  **Physical Realisation:** Any physical computation requires a mapping between physical states and logical states; this mapping is contingent upon the laws of physics governing the substrate.
  4.  **No Current Hypercomputation:** There is currently no empirically verified physical process that reliably computes functions beyond the Turing-computable.
  5.  **Conceptual Stability:** The pre-theoretic notion of 'mechanical method' involves finiteness constraints (finite steps, finite symbols) that are not obviously derivable from physical laws alone.

  **2. Disagreements Table**

  | Issue | Camp A (Constitutivists) | Camp B (Physicalists) | Type |
  | :--- | :--- | :--- | :--- |
  | **Modal Status** | The Mathematical Thesis is necessary truth. The concept of 'algorithm' contains finiteness constraints that logically exclude hypercomputation. | The Physical Thesis is contingent truth. It is a hypothesis about the causal structure of our universe, liable to empirical revision. | Concept vs World |
  | **Role of Physics** | Physics instantiates logical concepts but cannot redefine them. If physics allows infinite steps, it is not computing an 'effective procedure'. | Physics determines the bounds of computation. If the universe allows hypercomputation, our concept of 'procedure' was merely parochial. | Concept vs World |
  | **Refutation** | The Thesis cannot be refuted by experiment. A hypercomputer would simply fail to meet the definition of 'effective procedure' (e.g. lack of surveyability). | The Thesis is refutable by experiment. A verified hypercomputer proves the Physical Thesis false, regardless of conceptual niceties. | Words vs World |

  **3. Cruxes and Concrete Cases**

  **Crux 1: The Definition of Computation vs. Physical Capacity**
  *Case (i) The Halting Box:* A sealed device reliably decides the halting problem for ten million cases. Probing destroys it.
  *   **Camp A Prediction:** This does not refute the Mathematical Thesis. The box is an oracle, not an algorithm. Without a surveyable method (a finite sequence of steps we can inspect), it is not computing an 'effective procedure'. It refutes only the claim that physics is bounded by Turing machines, not the conceptual analysis.
  *   **Camp B Prediction:** This refutes the Physical Thesis. The device is a physical process yielding non-Turing-computable outputs. Whether we call it 'computation' or 'oracle generation' is semantic; the substantive claim that physics is Turing-bounded is false.

  **Crux 2: The Surveyability Clause**
  *Case (ii) The Two Boxes:* The Box's answers track a physical quantity correlating coincidentally with halting status, not halting behaviour itself.
  *   **Camp A Prediction:** This confirms the necessity of the surveyability clause. Computation requires a constitutive link between the procedure and the result, not mere correlation. Without explainable mechanics, there is no computation, only coincidence.
  *   **Camp B Prediction:** This highlights the need for mechanistic explanation, but not necessarily conceptual finiteness. If the correlation were systematic (lawful) rather than coincidental, it would count. The disagreement is whether 'systematic' requires human-surveyable steps or merely physical lawfulness.

  **Crux 3: The Limits of Formalism**
  *Case (iii) The Lambda-Star Formalisms:* A new formalism allows one infinitary limit step, deciding the halting problem. It is independently motivated.
  *   **Camp A Prediction:** This formalism is excluded from the convergence argument because it violates the constitutive finiteness constraint of 'effective procedure'. Its motivation is irrelevant if it abandons the core concept being analysed.
  *   **Camp B Prediction:** If physics operates on Lambda-Star rules, the Mathematical Thesis is revealed as historically limited. We should adopt Lambda-Star as the correct characterisation of computation, expanding the concept to fit the world.

  **4. Closing Statement**

  The dispute contains both verbal and substantive elements. The verbal component concerns the label 'effective procedure'. Camp A treats this as a fixed conceptual target; Camp B treats it as a natural kind term subject to revision. This is diagnosable because both camps agree on the mathematical facts of the formalisms and the current lack of hypercomputers. They disagree on whether a future physical discovery would change the *meaning* of computation (A) or the *limits* of computation (B).

  The substantive component concerns the physical structure of the universe. Both camps agree that if the universe permits infinite steps in finite time, physical systems can outperform Turing machines. Camp A denies this changes the logical landscape; Camp B insists it does. There is no experiment that can settle the verbal dispute, as it concerns linguistic stipulation. However, the discovery of a lawful hypercomputational process (as in Case i, without the coincidence of Case ii) would settle the substantive dispute. Camp A would concede the Physical Thesis is false but maintain the Mathematical Thesis holds for 'algorithms'. Camp B would concede both are false or require revision. Thus, the non-verbal core is the empirical question of physical computability, while the philosophical core is whether our concepts are anchored in logic or in the local laws of physics. Until a Halting Box is verified, the collaboration remains a framework for organising ignorance rather than a resolution.
