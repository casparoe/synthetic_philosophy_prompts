answer: |-
  You have put your finger on one of the central, gnawing problems of modern historiography and critical archive studies. You are absolutely right: standard "source criticism" (i.e., "identify the bias and subtract it") fails here because the bias is not an additive error; it is the *constitutive condition* of the record's existence. The detail exists *because* of the control.

  There is no single, universally standardized noun for this specific correlation (Detail = Subjection), but there is a robust theoretical framework that describes it. If you want to speak the language of the historians and sociologists who study this, you are describing the intersection of **Legibility**, **Archival Power**, and **Hyper-visibility**.

  Here is the breakdown of the existing concepts, the closest thing to a name, and an analysis of your edge cases.

  ### 1. The Existing Frameworks

  **A. Legibility (James C. Scott)**
  The closest established concept comes from political anthropologist James C. Scott, specifically in *Seeing Like a State*. He argues that states (and large institutions) cannot interact with complex human reality directly. They must simplify it. They create maps, surnames, standard measurements, and ledgers to make society **legible**.
  *   **The Connection:** The almshouse ledger is a tool of legibility. The person is rendered "thick" in the record only insofar as they need to be managed, categorized, and controlled. The detail is not a portrait; it is a schematic for administration.
  *   **The Term:** You are observing the **Trap of Legibility**. To become visible to the institution is to become subject to it.

  **B. Archival Power (Michel-Rolph Trouillot & Ann Laura Stoler)**
  In *Silencing the Past*, Trouillot argues that archives are not neutral repositories; they are active productions of power. What gets recorded is an act of power.
  Ann Laura Stoler, in *Along the Archival Grain*, takes this further. She argues against "reading against the grain" (trying to find the hidden truth beneath the bias). Instead, she suggests reading *with* the grain. The bureaucracy's anxiety, its categories, and its distortions *are* the historical data.
  *   **The Connection:** Your observation that "discounting costs you exactly the detail" is pure Stoler. The distortion isn't noise; it's the signal. The record tells you how the institution saw the world, which is often the only record of the person's existence.

  **C. Hyper-visibility (Critical Race & Queer Theory)**
  In sociology and critical theory, this is often called **Hyper-visibility**. Marginalized groups (the poor, racial minorities, queer communities) are often invisible in mainstream narratives *except* when they are being policed, pathologized, or incarcerated.
  *   **The Connection:** The gay bar folder is a classic case of queer hyper-visibility. The community is documented most thoroughly when it is being criminalized.

  ### 2. Is There a Name?

  If you need a label for this specific phenomenon where **record density correlates inversely with subject agency**, the most precise existing phrase is **"The Paradox of Archival Visibility."**

  However, since you invited a coined term if one didn't exist, I propose you call this **"The Legibility Bind."**

  **Definition of The Legibility Bind:**
  > A structural condition in archival records where the completeness and granularity of data regarding a subject are directly proportional to the degree of institutional control or subjection exerted upon that subject. In the Legibility Bind, "truth" and "coercion" are not separable variables; the detail is generated by the coercion.

  **Why this differs from "Bias":**
  *   **Bias** implies a slant that can be mathematically or narratively corrected (e.g., "The sheriff exaggerates the threat by 20%").
  *   **The Legibility Bind** implies that without the coercion, the data point would not exist. You cannot correct for the sheriff's perspective because the sheriff is the only reason the bar is in the ledger at all.

  ### 3. Addressing Your Edge Cases

  You asked where the thing stops. Here is how the Legibility Bind applies to your specific scenarios:

  **Case 1: The Hospital/Midwife Log (Recorder has no interest in control)**
  *   **Verdict:** **Still counts as the Legibility Bind.**
  *   **Why:** Even if the intent is medical care rather than policing, the record is still an act of **professionalization and standardization**. The midwife is being rendered legible to the medical establishment. Her practices are being categorized against a norm. The "detail" exists because she is being evaluated by an external system of knowledge (medicine) that claims authority over her body/work. It is softer than the sheriff, but it is still institutional legibility overriding individual agency.

  **Case 2: Deliberate Community Collection (People recording their own history)**
  *   **Verdict:** **This escapes the Bind, but enters the "Curatorial Trap."**
  *   **Why:** This is often called **Counter-Archiving**. It breaks the Legibility Bind because the *agency* lies with the subject, not the institution. However, it does not escape distortion. It swaps **Subjection Distortion** (how the state sees me) for **Representational Distortion** (how I want to be seen).
  *   **The Difference:** In the Legibility Bind, the subject is an *object* of the record. In a community archive, the subject is the *author*. The distortion shifts from "criminal/pathologized" to "respectable/heroic." You lose the "raided bar" detail, but you might lose the internal conflicts of the bar too. It is a different epistemic problem, not the same one.

  **Case 3: The Self-Authored Diary**
  *   **Verdict:** **The Clean Opposite.**
  *   **Why:** A diary is high agency, low institutional legibility.
  *   **The Catch:** It is subject to **Survival Bias** and **Self-Fashioning**. A diary tells you how the person wanted to perceive themselves (or how they wanted a future reader to perceive them).
  *   **The Inversion:** In the Legibility Bind, the record is thick because the institution *needed* to know. In a diary, the record is thick because the individual *needed to express*.
  *   **Does it count?** No. It is the inverse phenomenon. However, diaries rarely survive for the poor (your almshouse residents), which brings us back to the Legibility Bind: the poor are only "thick" in the archive when the state captures them.

  ### 4. How to Work With It (Methodology)

  Since you are actually doing the work, knowing the name is less useful than knowing the method. Historians handle the Legibility Bind using **Stoler's Method**:

  1.  **Stop trying to extract the "real person."** Acknowledge you cannot fully reconstruct the almshouse resident's interior life from the admission book.
  2.  **Make the Institution the Subject.** Instead of writing "The Lives of the Poor," you write "How the County Administered Poverty." The detail about scars and drinking habits tells you what the *almshouse* feared, not necessarily what the *person* was.
  3.  **Triangulate with Silence.** Use the tax list (the thin record) to acknowledge the gap. Explicitly state: "We only see John Doe when he falls out of the economy." The silence between the records is part of the data.

  ### Summary

  You have identified **The Legibility Bind** (or the Paradox of Archival Visibility).

  *   **It is not Bias:** Bias is correctable; this is constitutive.
  *   **It is not Silence:** Silence is absence; this is noisy presence.
  *   **It applies to:** Any record where an institution defines the categories of existence (police, hospitals, schools, welfare).
  *   **It does not apply to:** Self-authored records (diaries) or community-controlled archives, though those have their own distinct distortions (self-fashioning, curation).

  You are not just typing ledgers; you are mapping the contours of state power. The frustration you feel is the friction of history itself.
