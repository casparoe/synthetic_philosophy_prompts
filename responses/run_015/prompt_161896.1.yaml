  7.  **Final Polish:** Ensure the distinction between *Master Argument* (conceivability) and *Likeness Principle* (representation) is clear, as the source text mashes them together. Ensure the "blinking" misconception is thoroughly debunked using Berkeley's own text logic (continuous existence in God).

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in scholarly debate about whether the Master Argument is in *Principles* §23 or *Dialogues*. Just stick to the logic provided. The source text conflates the "conceivability" argument with the "likeness" argument. I must point that out.

  Also, the user's "global variable" analogy for God is insightful but needs correction. God isn't a global variable; God is the *runtime environment*. If you delete the runtime, the program doesn't run (solipsism/incoherence), it doesn't just "inline."

