answer: |-
  Okay, let's build this spec. You're asking for a bridge between fundamental physics and normative ethics that doesn't collapse under its own weight. If you take panpsychism (or panprotopsychism) seriously, you can't just paste human ethics onto atoms. You need a framework that survives contact with quantum mechanics and thermodynamics without creating a moral calculus that explodes.

  Here is the desiderata spec for a **Physics-Compatible Pan-Sentient Ethical Theory**.

  ### 1. The Core Desiderata (The Requirements List)

  **A. Substrate-Neutral Valence Marker**
  The theory must identify a physical correlate for *suffering* (negative valence) that isn't biological.
  *   *The Question:* Is suffering high entropy (thermal noise/disorder)? Or is it frustrated low entropy (rigid constraints preventing state transitions)?
  *   *The Requirement:* You need a variable (e.g., rate of decoherence, free energy minimization error, spin frustration) that maps to "badness." If you can't point to a number in the Hamiltonian that corresponds to "ouch," you don't have a theory, you have a poem.

  **B. The Integration/Boundary Condition**
  This is the big one. Physics is continuous; ethics usually needs discrete patients.
  *   *The Question:* Does an entangled pair of electrons constitute one moral patient or two? Does a coherent superposition count as a subject that "dies" upon decoherence?
  *   *The Requirement:* A non-arbitrary rule for **subject individuation**. You need to define when micro-experiences sum into a macro-subject (like a human) versus when they remain scattered "dust" (like a rock). If you can't define the boundary, you can't calculate total suffering.

  **C. The Locality and Causality Constraint**
  Ethics implies action, and action is limited by light cones.
  *   *The Question:* If I measure one half of an entangled pair, do I instantly alter the moral status of the other half across the galaxy?
  *   *The Requirement:* Moral weight assignment cannot violate **no-signaling theorems**. You cannot assign moral obligations that require knowledge of spacelike-separated events. If your theory says "collapsing this wavefunction harms that distant particle," you've broken physics.

  **D. The Temporal Persistence Threshold**
  *   *The Question:* If a quantum state exists for $10^{-20}$ seconds before decohering, does it suffer?
  *   *The Requirement:* A minimum **coherence time** for moral relevance. Experience likely requires some duration to integrate information. If every fleeting interaction counts, the universe is mostly screaming noise, and ethics becomes impossible (see: Moral Inflation).

  **E. The Interest vs. Sensation Distinction**
  *   *The Question:* Can something suffer without having a "self" to protect?
  *   *The Requirement:* Distinguish between **phenomenal suffering** (raw negative qualia, e.g., a spin state resisting alignment) and **preference satisfaction** (having goals/interests). An electron might have the former but not the latter. Your theory needs to decide if "raw pain" without "memory or future" generates obligations.

  ---

  ### 2. Non-Negotiables vs. Biological Biases

  Here is where we separate hard constraints from speciesist hangovers.

  **Non-Negotiable (Hard Constraints):**
  1.  **Computational Tractability:** If calculating the moral weight of a cup of coffee requires simulating every quark interaction, the theory is useless. It must allow for coarse-graining.
  2.  **Causal Closure:** Moral properties must supervene on physical properties. You can't have "ghostly" suffering that doesn't show up in the energy budget.
  3.  **Conservation of Moral Patients:** You can't create or destroy moral patients simply by changing your coordinate system or measurement basis.

  **Biological Biases (To Be Discarded):**
  1.  **"Memory is Required":** The idea that you need a hippocampus to suffer is a bias. A system could experience intense, fleeting negative valence without encoding it.
  2.  **"Language/Conceptuality":** You don't need the concept of "self" to have a negative experience.
  3.  **"Metabolic Homeostasis":** Biological exclusivists argue that only systems fighting entropy for survival (life) can suffer. In a physics view, a non-biological system resisting equilibrium (like a driven quantum system) could arguably experience "frustration."

  ---

  ### 3. The Jointly Unsatisfiable Subset (The Trilemma)

  You cannot satisfy all three of these simultaneously. You have to drop one.

  1.  **Universal Micro-Experience:** Every fundamental physical interaction has some non-zero phenomenal component (Panpsychism).
  2.  **Additive Aggregation:** The total moral value of a system is the sum of its parts (Classical Utilitarianism).
  3.  **Action-Guidance:** The theory yields clear decisions for human agents without resulting in moral paralysis.

  **The Conflict:**
  If (1) is true, then every atom in your body, the air, and the vacuum fluctuations has a tiny bit of experience. If (2) is true, you must sum them all. Since there are vastly more atoms than humans, the suffering of "dust" dwarfs the suffering of animals.
  *   *Result:* You become paralyzed. Turning on a light bulb might cause more "micro-suffering" (via excitation/decoherence) than saving a whale.
  *   *The Fix:* You usually have to drop (2). You need a **non-linear aggregation function**. Maybe micro-experiences don't sum; they only matter when integrated above a certain threshold (like Integrated Information Theory suggests). But then you risk arbitrariness.

  ---

  ### 4. The "Killer" Requirement

  Which single requirement kills the most popular ethical theories?

  **The Non-Arbitrary Boundary Condition.**

  *   **Why it kills Utilitarianism:** Classic utilitarianism needs to sum utility across patients. But in quantum field theory, boundaries are fuzzy. Where does one electron's "experience" end and the field's begin? If you can't define the *unit* of moral concern physically, you can't do the math.
  *   **Why it kills Rights-Based Deontology:** Rights attach to entities. If an entangled system is one entity, but measuring it splits it into two, do rights split? If consciousness is fundamental but boundaries are emergent, "individual rights" become a category error.
  *   **Why it kills Biological Exclusivism:** It exposes that "skin" is no better a boundary than "decoherence scale."

  **The Specific Physics Trap:**
  If you assign moral weight to **entanglement**, you risk violating locality (Requirement C). If you assign moral weight to **decoherence**, you risk making "measurement" an act of mass murder (every interaction kills a micro-subject).

  **The Verdict:**
  The requirement that kills the most theories is **Coarse-Graining Invariance**.
  Your theory must yield the same moral verdict whether you describe the system at the quantum level or the thermodynamic level. Most theories fail this. They either say "only the quantum level matters" (leading to moral inflation) or "only the macro level matters" (which is biologically exclusive in disguise).

  If you can't solve the **Combination Problem** (how little experiences make big ones) without violating **Locality**, you don't have an ethics of physics. You just have an ethics of biology pretending to be fundamental.
