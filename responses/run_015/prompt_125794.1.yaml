  6.  **Strong Constitutive:** A language's categories fix the categories available to thought, such that changing words forcibly changes cognitive capacity. *Mechanism:* Cognitive determinism (strong Whorfianism). *Verdict:* False; empirically unsupported and typically a strawman of reformist positions that your friend can safely dismiss without engaging the actual arguments.

