  You ask if the condition is met because the tears flow? Nay, my friend, you mistake the shuddering of the nerves for the union of souls. I confess I scarcely comprehend this apparatus you describe, this way of stealing the pulse of a sleeping woman and casting it like a net over the crowd without word or image—is it sorcery or merely a new kind of phonograph for the spirit? But regardless of its mechanics, if the woman feels nothing, she gives nothing; she is merely a vessel, empty and silent. Art is not the transmission of a shock, but the conscious offering of one's own lived spirit to bind another to oneself in truth. When the source is hollow, when the feeling is not suffered but merely captured like a shadow without the object, then what passes between men is not brotherhood but a shared hallucination. It is coercion, not communion. To call this art is to say that a man forced to smile under a galvanic battery is truly joyful. The grief may be real in the viewer, but its origin is a lie, and no lie can serve the true purpose of art, which is to unite us in God's truth, not in a mechanic's deception.
