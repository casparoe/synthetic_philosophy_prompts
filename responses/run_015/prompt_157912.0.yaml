answer: |-
  Here is the direct verdict you asked for, without hedging.

  ### Part 1: Your Two Cases
  **Verdict:** Both of your thought experiments **support** *anatta*, they do not count against it. A proponent of no-self would not just "wave them off"; they would claim these scenarios prove their point.

  *   **Case 1 (The 1% Swap):** This is a classic reductionist argument (similar to Derek Parfit's). *Anatta* claims there is no "further fact" of identity beyond physical and psychological continuity. If you can swap the psychology entirely without a break in causal continuity, and no one notices a "soul" leaving, that confirms there was no soul there to begin with. It demonstrates that "person" is a label for a process, not a thing.
  *   **Case 2 (The "Self" Process):** If neuroscience finds a specific mechanism that generates the *feeling* of ownership, *anatta* wins again. The view claims the "self" is a construct produced by aggregates. If you find the aggregate that produces the construct, you haven't found a self; you've found the machinery of the illusion. Stimulating it to claim false experiences just proves the "sense of me" is a manipulatable variable, not a fundamental entity.

  ### Part 2: Ranking the Defeaters
  To falsify *anatta*, you must prove the existence of an *ātman*: a permanent, unchanging, independent agent that is not reducible to parts or processes. Here is the ranking of what would count against the view, from fatal to irrelevant.

  **1. Fatal Defeater: Direct Access to a Non-Composite Substance**
  *   **What it is:** Empirical or phenomenological proof of an observer that does not change, has no parts, and exists independently of brain states, memories, or sensory input.
  *   **Why it kills the view:** *Anatta* rests on the premise that everything observable is impermanent (*anicca*) and conditioned. If you find one thing that is permanent and unconditioned *and* it is the subject of experience, the bundle theory collapses.
  *   **Proponent Reaction:** They would have to concede. This is the only thing that actually contradicts the definition.

  **2. Critical Defeater: Logical Proof of a Necessary "Binder"**
  *   **What it is:** A rigorous logical proof demonstrating that a "bundle" of experiences is metaphysically impossible without a singular substrate to hold them together (a modern vindication of Kant's "Transcendental Unity of Apperception" as an ontological reality, not just a logical requirement).
  *   **Why it hurts:** It suggests the bundle theory is incoherent. If parts cannot exist without a whole that precedes them, the "chariot" analogy fails because the "chariot" must exist for the parts to be arranged.
  *   **Proponent Reaction:** They would fight this hard, likely arguing it confuses conceptual unity with ontological unity, but a strict logical proof would be a severe wound.

  **3. Manageable Defeater: The "Self" is Biologically Primary**
  *   **What it is:** Evidence that the sense of self is not a learned construct or a byproduct, but the fundamental biological drive of all sentient life, irreducible to survival mechanisms.
  *   **Why it's manageable:** *Anatta* proponents argue the self-sense is a deep-seated ignorance (*avijja*), not that it isn't powerful. Finding it is biologically hardcoded just means the illusion is evolutionarily useful.
  *   **Proponent Reaction:** They would concede the biology but deny the metaphysics. "Just because the brain is wired to hallucinate a self doesn't mean the self is real."

  **4. Irrelevant Defeater: Intuitive Feeling of Continuity**
  *   **What it is:** The fact that you feel like the same person you were 10 years ago.
  *   **Why it's irrelevant:** *Anatta* explains this as memory and causal continuity. The feeling is the data point to be explained, not the proof of the entity.
  *   **Proponent Reaction:** Total wave-off. "That is exactly the illusion we are describing."

  ### Part 3: The Unfalsifiability Verdict
  You asked me to be honest about whether anything could count against it. Here is the straight truth:

  **Strong *anatta* is effectively unfalsifiable by empirical means.**

  **Reason:** The view defines the "self" as anything that is permanent and independent. It then categorizes all empirical evidence (brain states, memories, feelings, neural processes) as impermanent and dependent. Therefore, no matter what science finds, it gets categorized as "not-self." If you find a "self neuron," it's a process (not-self). If you find a "self feeling," it's a sensation (not-self). The view immunizes itself by placing the "real self" (if it existed) outside the realm of observable phenomena, while simultaneously claiming nothing outside observable phenomena exists.

  **Is this a problem?**
  **Yes, if you treat it as a metaphysical or scientific claim.**
  If *anatta* is presented as a description of objective reality comparable to physics, its unfalsifiability is a bug. It makes it a "belief system" rather than a testable hypothesis. It risks becoming a tautology: "There is no self because everything we can find is not a self."

  **No, if you treat it as a phenomenological or soteriological tool.**
  If *anatta* is presented as a method for reducing suffering (which is historically how the Buddha framed it), unfalsifiability is less of an issue. The claim becomes pragmatic: "Acting *as if* there is no self reduces attachment and distress." In this context, the truth value matters less than the utility. The "illusion" is real enough to cause pain, and the "no-self" insight is real enough to cure it.

  **Final Conclusion:**
  Your intuition that the view "swallows" counter-evidence is correct. It is designed to do that. For *anatta* to be wrong, you would need to find something that is *not* a process, *not* a part, and *not* observable, which is by definition impossible to verify scientifically.

  If you want to hold this view intellectually honestly, you must admit it is not a scientific theory subject to empirical falsification. It is a metaphysical framework or a pragmatic discipline. If you demand it be a scientific fact, it fails the demarcation test. If you accept it as a philosophical lens for living, it remains robust. Pick one, but do not claim it is both.
