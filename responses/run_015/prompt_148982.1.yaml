answer: |-
  This is **Epistemic Closure Asymmetry**, a normative refinement of the **Problem of Logical Omniscience** based on whether consistency is constitutive or regulative within a domain.

  The underlying philosophical issue is the Problem of Logical Omniscience, which notes that no finite agent can know all logical consequences of their beliefs. Standard epistemology rejects the idea that we are responsible for every distant implication of what we believe because cognitive resources are bounded. However, your observation highlights that this exemption is not applied uniformly. The split exists because different domains operate under different types of rules: **constitutive** versus **regulative**.

  In mathematics and programming, consistency is a **constitutive rule**. It defines the activity itself; a proof with a contradiction is not a "bad proof," it is no proof at all. Because a single contradiction in a formal system triggers the principle of explosion (where any statement can be proven true), the cost of inconsistency is total system failure. Therefore, the epistemic norm demands full closure: you are blamed for missing a contradiction because finding it is the primary objective of the domain, regardless of the step count.

  In politics and ethics, consistency is a **regulative rule**. It is an ideal to strive for, but not the definition of the activity. These domains deal with competing values, incomplete information, and pluralistic truths where contradictions often signal complexity rather than falsehood. A contradiction in ethics might indicate a tragic dilemma or a need for reflective equilibrium, not an immediate invalidation of the agent's moral standing. Consequently, the norm allows for **bounded consistency**: you are excused for missing implications because the goal is optimization of values, not logical validity.

  The boundary, therefore, is not cognitive difficulty but **system integrity**. We demand full logical closure in closed systems (axiomatic, formal) where error is catastrophic and binary. We forgive gaps in open systems (social, moral) where error is gradual and contradictions are often data points rather than failures. This asymmetry ensures we don't paralyze agents in complex environments while maintaining rigor where rigor is the only metric of success.
