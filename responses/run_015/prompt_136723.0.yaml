prompt: |-
  I'm on the appeals panel for my university's research integrity office. We upheld a grad student for data fabrication, but now they've appealed on the grounds that the committee chair, Prof. K, published a paper with a near-identical statistical slip-up five years back—not fraud, just sloppy. The student says K is a hypocrite and therefore lacks standing to blame, and that this poisions the whole committee's decision. Our rules don't mention hypocrisy at all. I need to circulate a short memo before tuesday's vote recommending either affirm, overturn, or remand with conditions, with a clear timeline. Don't just cite legal rules—engage the philosophical point seriously, including the best argument for the student. Also, the student is pushing a weird twist: they say standing isn't individual but distributed across the committee, so if one member is disqualified the collective verdict collapses unless the others explicitly re-ratify it. Deal with that too, and keep the bottom line practical.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university research integrity appeals panel.
      *   **Task:** Circulate a short memo to fellow panelists before Tuesday's vote.
      *   **Recommendation:** Affirm, Overturn, or Remand with conditions (plus a timeline).
      *   **Key Issue:** A grad student found guilty of data fabrication is appealing.
      *   **Appeal Ground:** The original committee chair (Prof. K) committed a similar statistical error (sloppy, not fraud) 5 years ago. Student claims hypocrisy invalidates K's standing and poisons the committee's decision.
      *   **Specific Argument to Address:** "Distributed Standing" – if one member is disqualified, the collective verdict collapses unless re-ratified.
      *   **Requirements:**
          *   Don't just cite rules (rules don't cover hypocrisy).
          *   Engage the philosophical point seriously (include the best argument for the student).
          *   Keep the bottom line practical.
          *   Deadline: Before Tuesday's vote.

  2.  **Deconstruct the Arguments:**
      *   **The Student's Claim (Hypocrisy/Tu Quoque):** "You did it too, so you can't judge me."
          *   *Philosophical Strength:* Hypocrisy undermines moral authority and perceived fairness. It creates an appearance of bias.
          *   *Philosophical Weakness:* The truth of the fabrication finding is independent of the judge's character. A thief can still identify stolen goods. Research integrity is about objective evidence, not moral purity.
      *   **The Student's Claim (Distributed Standing):** "If K is out, the whole committee is void."
          *   *Analysis:* This is a procedural stretch. Committees usually vote by majority. Unless K's presence materially swayed the vote (e.g., tie-breaker), the others' judgments stand on their own merit.
      *   **The Facts:** Student = Fabrication (intentional). Prof. K = Sloppy/Error (unintentional). This is a crucial distinction.
      *   **The Rules:** Silent on hypocrisy.

  3.  **Determine the Recommendation:**
      *   *Overturn?* No. The evidence of fabrication likely stands regardless of K's past. Overturning sets a dangerous precedent that integrity findings depend on the judge's perfection.
      *   *Remand?* Possible, but costly and time-consuming. If the evidence is solid, why redo the work?
      *   *Affirm?* Best option. The core finding (fabrication) is evidentiary. K's past error is distinct in kind (negligence vs. fraud). The "distributed standing" argument is procedurally unsound.
      *   *Nuance:* Acknowledge the appearance of impropriety but distinguish between *bias* (which requires recusal) and *hypocrisy* (which does not).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation for Tuesday's vote).
      *   **The Core Issue:** Summarize the appeal (Hypocrisy argument regarding Prof. K).
      *   **Philosophical Engagement (The "Why"):**
          *   Acknowledge the student's moral intuition (hypocrisy feels unfair).
          *   Counter with the distinction between *moral authority* and *epistemic judgment*. We are judging data, not souls.
          *   Address the distinction: Fabrication vs. Sloppiness.
      *   **The "Distributed Standing" Argument:**
          *   Address the collective verdict claim.
          *   Explain that committee votes are usually independent judgments aggregated, not a single hive mind dependent on the chair's purity.
      *   **Practical/Procedural Reality:**
          *   Rules don't forbid hypocrisy.
          *   Precedent risk (if we overturn, any finding can be challenged by digging up a committee member's past).
      *   **Recommendation:** Affirm the original decision.
      *   **Timeline:** Vote Tuesday, notify by Wednesday/Thursday.

  5.  **Refining the Tone:**
      *   Needs to be professional, collegial, but firm.
      *   Must show intellectual rigor (engaging the philosophy) without getting lost in abstraction.
      *   Must be practical (university administration context).

  6.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "distributed standing" point? *Yes, need to make sure it's clear that one member's potential bias doesn't automatically void others' independent votes.*
      *   *Check:* Did I engage the philosophy? *Yes, need to explicitly mention the Tu Quoque fallacy vs. the appearance of bias.*
      *   *Check:* Is the distinction between fraud and error clear? *Crucial. K made a mistake; Student lied.*
      *   *Check:* Is the timeline clear? *Yes, Tuesday vote, immediate follow-up.*

  7.  **Final Polish:** Ensure the recommendation is unmistakable. (Decided on **Affirm**, with a note that while K's behavior was unfortunate, it doesn't invalidate the evidence against the student).

      *(Self-Correction on "Remand"):* Actually, a "Remand" might be a safer middle ground if the panel is worried about optics. However, the prompt asks for a "clear timeline" and "practical bottom line." Remanding drags it out. If the evidence is solid, Affirm is stronger. But wait, if K's involvement creates an *appearance of bias*, does that require recusal? Usually, bias requires a conflict of interest. Past sloppiness isn't a conflict of interest regarding *this* student's fraud. I will stick with Affirm but acknowledge the tension. It shows leadership.

      *Wait, let's look closer at the "Distributed Standing" argument.* The student says if K is disqualified, the verdict collapses *unless* others re-ratify. This implies the vote hasn't happened yet on appeal, or they want the original committee to re-vote without K? No, this is the *Appeals* Panel. We are reviewing the original committee's work. The student is saying the *original* verdict is poisoned.
      *My recommendation:* We (Appeals Panel) should Affirm the original finding. We are the ones voting Tuesday.
      *Okay, clear.*

  8.  **Finalizing the Memo Structure:**
      *   To: Appeals Panel Members
      *   From: [My Name]
      *   Subject: Recommendation re: [Student Name] Appeal
      *   Sections: Context, The Hypocrisy Claim (Philosophical), The Collective Verdict Claim (Procedural), Recommendation, Timeline.

  9.  **Writing the Content:** (Drafting mentally...)
      *   Start with the distinction: Fraud vs. Error.
      *   Address Tu Quoque.
      *   Address the "Collective" argument (severability).
      *   Conclude with Affirm.

  10. **Final Review against constraints:**
      *   Short memo? Yes.
      *   Before Tuesday? Yes.
      *   Engage philosophy? Yes.
      *   Address distributed standing? Yes.
      *   Practical bottom line? Yes.

      *(One last thought)*: Make sure to emphasize that while K's behavior is regrettable, it belongs in a different forum (faculty conduct), not this student's integrity case. Separation of issues.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Appeals Panel
  **FROM:** [Your Name/Panel Member]
  **DATE:** Sunday, October 26, 2023
  **SUBJECT:** Recommendation re: [Student Name] Appeal – Vote Preparation for Tuesday

  **Purpose**
  This memo outlines my recommendation for Tuesday's vote regarding the appeal filed by [Student Name]. The appellant contends that the original committee's finding of data fabrication is void because the committee chair, Prof. K, previously published work containing a similar statistical error. The appellant argues this constitutes hypocrisy that invalidates Prof. K's standing and, by extension, the collective verdict.

  **Recommendation**
  **I recommend we AFFIRM the original finding of research misconduct.**

  **Philosophical Engagement: The Hypocrisy Claim**
  We must take the student's moral intuition seriously. There is a compelling philosophical argument that hypocrisy undermines the *legitimacy* of normative judgment. If a judge violates the norm they enforce, it suggests the norm is being weaponized rather than upheld, creating an appearance of unfairness (the *tu quoque* intuition). In a community of scholars, perceived equity matters as much as procedural correctness.

  However, we must distinguish between **moral authority** and **epistemic judgment**.
  1.  **Nature of the Act:** The evidence indicates the student committed *fabrication* (intentional deception). Prof. K's past error was adjudicated as *sloppiness* (negligence). These are categorically different violations. One can be a negligent driver and still accurately identify a drunk driver.
  2.  **Truth-Independence:** The validity of the finding rests on the data, not the judge's character. If the student's data is fabricated, it remains fabricated regardless of Prof. K's publication history. To overturn based on hypocrisy would be to prioritize the judge's purity over the objective reality of the research record.

  **Procedural Engagement: The "Distributed Standing" Argument**
  The appellant argues that standing is distributed across the committee; therefore, if Prof. K is disqualified, the collective verdict collapses unless the remaining members explicitly re-ratify it.

  This argument is procedurally unsound for two reasons:
  1.  **Severability of Votes:** Committee decisions are aggregations of independent judgments. Unless Prof. K's influence was coercive (which is not alleged), the other members' votes stand on their own evidentiary merit.
  2.  **Bias vs. Hypocrisy:** Recusal standards require a *conflict of interest* or *prejudice* regarding the specific case. A judge's past unrelated errors do not constitute a conflict of interest under our bylaws. Accepting the "distributed standing" theory would set a precedent where any finding could be voided by auditing the personal histories of the committee, paralyzing the integrity process.

  **Practical Bottom Line**
  While Prof. K's past sloppiness is regrettable and perhaps warrants a separate conversation regarding faculty development, it does not erase the student's fabrication. Overturning this finding would signal that research integrity enforcement depends on the moral perfection of the enforcers, which is an impossible standard.

  **Proposed Timeline**
  *   **Tuesday (10:00 AM):** Panel Vote (Recommendation: Affirm).
  *   **Tuesday (4:00 PM):** Draft final decision letter.
  *   **Wednesday (12:00 PM):** Circulate draft for final edits.
  *   **Thursday (9:00 AM):** Issue formal decision to Student and Office of Research Integrity.

  Please review this reasoning prior to Tuesday. I am happy to discuss the distinction between negligence and fabrication further if needed.
