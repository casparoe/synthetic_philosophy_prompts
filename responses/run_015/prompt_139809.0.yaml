      *   **Specific Questions:**
          1.  Is the argument valid or invalid?
          2.  Which step to reject and what does it cost?
          3.  Address the "R-inevitability" framing (granularity problem).
          4.  Distinguish between "costly to reverse" (persistence) and "would have arrived anyway" (convergence).
          5.  Address the issue of *order* of events vs. *occurrence* of events.

  2.  **Deconstruct the Argument (Step-by-Step Analysis):**

      *   *(1) Functional Description:* We explain outcomes functionally (railway gauge, writing systems).
          *   *Critique:* Mostly true for social science, but sometimes the *specific* material arrangement *is* the explanation (e.g., specific institutional quirks affecting distribution of wealth).
      *   *(2) Multiple Realizability:* Different arrangements serve the function equally well.
          *   *Critique:* Standard philosophical move. Generally accepted, but "equally well" is the weak point.
      *   *(3) Selection by Noise:* If equivalent, winner chosen by accident/local factors.
          *   *Critique:* Follows from (2). User wants to keep this.
      *   *(4) Path Dependence Explains Residue:* PD explains the specific key layout, not the existence of a keyboard.
          *   *Critique:* Plausible, but assumes the residue doesn't affect future function.
      *   *(5) We Care About Function:* The functional outcome is what matters.
          *   *Critique:* This is the normative/epistemic pivot. Do we care about *which* standard, or just *that* there is a standard? Distributional effects matter.
      *   *(6) Residue Doesn't Accumulate/Re-optimization:* Arbitrary details get fixed later if they bite. Lock-ins are delays.
          *   *Critique:* **This is the weak link.** It assumes frictionless adaptation. It ignores increasing returns, network effects, and the fact that "residue" becomes the substrate for future functions.
      *   *(7) Conclusion:* Outcomes that matter are inevitable; PD is trivia.
          *   *Critique:* Strong determinism. Contradicts empirical evidence of divergent development.

  3.  **Address Validity:**
      *   Is it logically valid?
      *   (1)-(3) -> (4): Seems okay.
      *   (4)+(5) -> (5's implication): We care about function, PD explains residue.
