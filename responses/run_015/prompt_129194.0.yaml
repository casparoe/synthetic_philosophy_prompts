answer: |-
  1. **Vocabulary**
  The methodological split is standardly called **probing** (read) versus **intervention** or **steering** (write). The gap between them is usually framed as **correlation versus causation**. However, existing terms describe the *methods*, not the *internal states* themselves. Your "Markers" and "Handles" are superior for this piece because they ontologically classify the vectors rather than the tools. "Leakage" is acceptable, though **non-specificity** is sometimes used in control theory. Stick with your coinage; it clarifies the object of study rather than the measurement tool, which is precisely where the confusion lies.

  2. **Representations**
  The gap is decisive. A Marker without a Handle is an **epiphenomenon**: the feature is present in the state but computationally inert (a shadow). The network tracks it but does not use it to compute outputs. A Handle with high leakage is a **global control**: it drives behavior but lacks semantic specificity (a volume knob). Genuine representation requires **consumption**. The system must not only track the feature (read) but rely on it mechanistically to generate outputs (write). If the gap persists, the system does not "have" the representation in a robust sense; it merely correlates with it or is being forcibly overridden. The distinction tells you whether the feature is part of the algorithm or just correlated with it.

  3. **Coinage & Boundaries**
  Adopt **"Causal Feature"** for the intersection.
  *Definition:* A direction is a Causal Feature if it is a high-accuracy Marker and a low-leakage Handle.
  *Boundary Cases:*
  *   *Marker/No-Handle:* **Epiphenomenal**. Fails. (e.g., predicts anger but steering doesn't induce anger). It is a byproduct.
  *   *Handle/High-Leakage:* **Entangled Knob**. Fails. (e.g., steers anger but also changes topic and length). It is non-specific.
  *   *Both (requires retraining):* **Latent Potential**. Fails native claim. It shows capacity, not current representation.
  *   *Read/Write Mismatch:* **Misaligned**. Fails. (e.g., reads "joy" but writes "aggression"). The probe found a correlate, the handle moved a different latent.
  *Settlement:* Withhold representation claims unless both criteria are met. If they diverge, the feature is an artifact of the measurement or the architecture, not a semantic unit. The distinction does real work: it prevents conflating predictive shadows with mechanistic drivers.
