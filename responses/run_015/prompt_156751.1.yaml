answer: |-
  This is a sophisticated package. You are effectively attempting to reconcile **Phenomenal Hedonism** (claims 1 & 2) with **Millian Qualitative Hedonism** (claim 3), using a **Determinable/Determinate model** to deflect the **Heterogeneity Objection** (claim 5).

  It is internally consistent *if* you are willing to redefine Mill's "quality" more narrowly than he likely intended. However, there are genuine tensions, not just weirdness. Here is the breakdown of your specific worries, followed by the cost ranking.

  ### 1. Does (3) smuggle in an evaluative criterion?
  **Verdict: Yes, but it might be survivable.**
  This is the strongest tension in your package.
  *   **The Problem:** In (1), you define pleasure as a *phenomenal* quality. In (3), you try to save Mill's distinction. Mill's distinction is widely interpreted as *axiological* (about worth), not just phenomenological. Mill argues competent judges *prefer* higher pleasures even if they come with discomfort.
  *   **The Smuggle:** If "quality" in (3) is just a phenomenological dimension (e.g., complexity, richness), you still need a bridge principle to explain why *richer* phenomenology = *more valuable* phenomenology.
  *   **The Fix:** You must argue that the "determinable" (pleasantness) is not a simple scalar magnitude (like volume) but a vector with weighted dimensions. If "richness" weights heavier than "intensity" in the calculus of pleasantness, you remain a hedonist.
  *   **The Clash:** If you claim a "higher" pleasure is better *even if* it contains less total "pleasantness-qua-pleasantness" (phenomenally), you have abandoned hedonism for a perfectionist or objective list theory. You must maintain that the "higher" pleasure literally contains *more* of the determinable property, just distributed differently.

  ### 2. Is (4) compatible with (3), or does it turn quality into intensity?
  **Verdict: Compatible, but it exposes the cost of your view.**
  *   **The Logic:** If "quality" is just a dimension of the determinable (richness/complexity), then yes, a sufficiently rich bodily pleasure (e.g., a complex, nuanced gastronomic experience or a profound somatic release) could theoretically outrank a dull mental pleasure (e.g., passively watching a low-brow show).
  *   **Intensity vs. Quality:** It does not necessarily turn quality into intensity *if* you define richness structurally rather than magnitudinally. Think of audio: High Fidelity (Quality) vs. High Volume (Intensity). You can have a quiet, high-fidelity sound and a loud, distorted one.
  *   **The Weirdness:** You admit (4) "sounds wrong." This is because Mill wanted a *lexical* priority (any amount of higher > any amount of lower). Your model likely only supports a *weighted* priority. If the bodily pleasure is rich *enough*, it wins. This contradicts the spirit of Mill, but it is logically consistent with your (1) and (3).
  *   **Recommendation:** Don't fix this. Bite the bullet. It is a feature, not a bug, of taking phenomenology seriously. It avoids the elitism often attributed to Mill.

  ### 3. Is (5) a false analogy (Color vs. Cross-Domain)?
  **Verdict: Strained, but not false.**
  *   **The Disanalogy:** As you noted, color determinates are unimodal (visual). Pleasure determinates cross somatic, perceptual, and propositional domains. Finding a common *phenomenal* thread between a back scratch and the joy of solving a theorem is much harder than between red and blue.
  *   **The Defense:** The analogy holds *if* you defend the existence of a "hedonic tone" or "gloss." Just as "colorness" is the abstract commonality between red and blue, "pleasantness" is the abstract commonality between the scratch and the theorem.
  *   **The Real Threat:** The Heterogeneity Objection (e.g., from Sidgwick or contemporary attitudinal theorists) argues that unlike colors, there *is* no common phenomenal thread. They argue the only thing unifying pleasures is that we desire them (which violates your claim 2).
  *   **Cost:** Defending (5) requires you to do the hard phenomenological work of pointing to the "glow" that exists in both bodily and mental pleasure. If you can't introspectively identify it, the analogy collapses.

  ---

  ### Ranking by Cost of Fix

  Here is where you should spend your energy, ranked from most expensive (threatens the whole system) to least expensive (just requires clarification).

  #### 1. The Evaluation Smuggle (Highest Cost)
  *   **Location:** The link between (1) and (3).
  *   **The Risk:** If "richness" does not automatically equate to "more pleasantness," you are no longer a hedonist. You are saying "Richness is good" independently of "Pleasure is good."
  *   **The Fix:** You must explicitly define the "magnitude" of the determinable as a function of both intensity and quality. $Value = f(Intensity, Duration, Richness)$. You must argue that Richness is a multiplier of the phenomenal quality, not a separate normative standard.
  *   **Why it's costly:** If pressed, you might have to admit that "higher" pleasures are better *because* they engage higher faculties (Mill's actual argument), which is non-phenomenal. To avoid this, you must insist the *feeling itself* of engaging higher faculties is phenomenologically richer.

  #### 2. The Color Analogy Defense (Medium Cost)
  *   **Location:** Claim (5).
  *   **The Risk:** If the reading group presses the "cross-domain" issue, you need to prove the common denominator exists.
  *   **The Fix:** Prepare to distinguish your view from **Attitudinal Hedonism** (Feldman). You need to argue that the *feeling* is the unity, not the *pro-attitude*. Use the "warmth" analogy: Sunlight and a fireplace feel different, but share a thermal quality. Pleasures share an affective tone.
  *   **Why it's costly:** It requires phenomenological precision. If members of the group say, "I don't feel a common thread," your theory loses its intuitive anchor.

  #### 3. The Bodily/Mental Reversal (Lowest Cost)
  *   **Location:** Claim (4).
  *   **The Risk:** It sounds counter-intuitive to Millians.
  *   **The Fix:** None needed. Own it. Argue that Mill's lexical priority was a mistake, but his insight about dimensions of pleasure was correct. A "higher" pleasure is just a phenomenologically complex one. If a bodily pleasure is complex enough, it wins.
  *   **Why it's cheap:** It's a bullet you can bite without breaking the logic of (1)-(3). It actually makes your view more robust against charges of elitism.

  ### Summary Judgment
  Your package **holds together**, provided you are strict about **Phenomenalism**.
  *   **Do not** allow "quality" to become a normative judgment about the *source* of the pleasure (e.g., "poetry is better than push-pin").
  *   **Do** insist "quality" is a phenomenological feature of the *experience* (e.g., "the experience of poetry is phenomenologically more complex than push-pin").

  If you slip and say the source matters, you violate (2). If you hold the line that only the phenomenal complexity matters, (4) follows naturally, and (3) saves Mill without breaking Hedonism. The color analogy (5) is your shield; make sure it's polished.
