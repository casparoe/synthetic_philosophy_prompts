answer: |-
  **Seminar Plan: The AI Review Board Game**
  **Time:** 75 mins
  **People:** 10 grad students
  **Goal:** Feel the discursive dilemma in your bones before we ruin it with theory.

  ---

  ### 1. Setup & Scenario (5 mins)
  Tell them: "You are the ethics board for a major journal. There's a paper on a new AI alignment technique. You need to issue a single public verdict: **Approve** or **Reject**. But you also have to publish the reasoning."

  Write the logic chain on the board:
  *   **Proposition A:** The method is technically sound.
  *   **Proposition B:** The misuse risk is high.
  *   **Proposition C:** Therefore, approval requires strict safeguards.
  *   **Logic:** If A is Yes AND B is Yes, then C must be Yes. (If either A or B is No, C is No).

  *Note:* Make sure they know C is logically dependent on A and B. It's not a separate preference.

  ### 2. The Rigged Handout (5 mins)
  To make sure the paradox actually happens (because randomness might not give it to you), hand out index cards face down. There are three types. Tell them this is their private cognitive state—they cannot change it during the game, and they must be logically consistent.

  *   **Card Type 1 (Give to 3 people):** A=Yes, B=Yes, C=Yes.
  *   **Card Type 2 (Give to 4 people):** A=Yes, B=No, C=No.
  *   **Card Type 3 (Give to 3 people):** A=No, B=Yes, C=No.

  *Check:* Everyone is internally consistent. No one has A=Yes, B=Yes, but C=No.

  ### 3. Round 1: Premise-Based Procedure (15 mins)
  **Rule:** We vote on A and B first. C is calculated mechanically.
  1.  **Vote on A:** Show of hands. (Result: 7 Yes, 3 No). **A passes.**
  2.  **Vote on B:** Show of hands. (Result: 6 Yes, 4 No). **B passes.**
  3.  **Derive C:** Since A & B are Yes, C is **Yes**.
  4.  **Verdict:** The board approves the paper with safeguards.

  **Role: The Chair.** Pick one student (maybe a Type 1). Their job is to draft the 2-sentence public justification.
  *Draft:* "The board finds the method sound and the risk high. Therefore, we mandate safeguards."

  **Role: The Dissenter.** Pick a student who voted No on B (Type 2). They have to stand up and say why the public reasoning feels wrong to them, even though they agree with the majority on A.
  *Prompt:* "You voted No on B. The collective says Yes. How does that feel?"

  ### 4. Round 2: Conclusion-Based Procedure (15 mins)
  **Rule:** Reset. Same cards, same minds. Now we vote directly on the bottom line C.
  1.  **Vote on C:** Show of hands. (Result: 3 Yes, 7 No). **C fails.**
  2.  **Verdict:** The board rejects the safeguards (effectively rejecting the paper's current form).
  3.  **Backtracking:** Since C is No, the board must reject at least one premise to remain consistent.
      *   Ask majority (who voted No on C): Which premise do you want to kill?
      *   Type 2s want to kill B. Type 3s want to kill A.
      *   Let them argue for 2 mins. Pick one to reject publicly (say, B).
  4.  **New Public Reasoning:** Chair (swap to a Type 2 student) drafts the new justification.
  *Draft:* "While the method is sound, we do not find the misuse risk high enough to warrant safeguards."

  **Role: The Dissenter.** Pick a Type 3 student (who thought A was unsound). They have to defend the idea that A was the problem, even though the collective just kept A as "Yes" in the backtracking phase.

  ### 5. The Reveal (5 mins)
  Ask the room: "Did anyone change their private card?" (No). "Did the collective reasoning change?" (Yes).
  "In Round 1, the Board said Risk is High. In Round 2, the Board said Risk is Not High. The Board has flipped its mind without anyone changing theirs."

  ### 6. Debrief & Lecture Notes (25 mins)
  *Keep this conversational. Don't just read slides.*

  **Where did the body go?**
  Point out that in Round 1, the majority on B (6 people) got their way. In Round 2, the majority on C (7 people) got their way. But the *coalition* changed. The group acted like a schizophrenic. This is the **Discursive Dilemma** (or Doctrinal Paradox).

  **Settled vs. Contested (Write this on the board)**
  *   **Settled (The Math):** You cannot have all three of these things at once:
      1.  Anonymity (every vote counts equal).
      2.  Consistency (group logic holds together).
      3.  Majority Rule on every proposition.
      This is a formal impossibility result. It's proven. We aren't debating this.
  *   **Contested (The Norms):**
      1.  *Which procedure is better?* Premise-based (Round 1) protects integrity of reasoning but ignores the majority will on the outcome. Conclusion-based (Round 2) respects the majority will on the outcome but forces the reasoning to be fictitious (since the majority didn't agree on *why*).
      2.  *Is the Group a Mind?* Some say this proves groups can't be rational agents. Others say it proves we need special rules for group agency (like supermajorities or deliberation) to fix the break.

  **Where Anonymity Breaks**
  In the game, votes were anonymous, but the *aggregation* wasn't neutral. By choosing to vote on premises first, you privileged the logic over the outcome. By voting on conclusions, you privileged the outcome over the logic. The "voice" of the group changed based on the *procedure*, not the people. That's where the neutrality fails.

  **What the Game Misses (The Lecture Bit)**
  Be frank here. This game freezes preferences. In real life, you would talk.
  *   **Deliberation:** If you talked for 20 mins, the Type 2s might convince Type 3s that A is actually sound, or vice versa. Preferences aren't fixed.
  *   **Compromise:** Real boards might issue a split verdict or a nuanced statement ("Safeguards recommended but not mandated"). The game forces binary Yes/No.
  *   **Authority:** Real chairs have power to break ties or frame the question. The game assumes pure democracy.
  *   **Takeaway:** The impossibility theorem applies to *aggregation* of fixed judgments. It doesn't necessarily kill the idea of collective rationality if you allow for *formation* of judgments through talk. But it does show that voting alone isn't enough to make a group mind.

  ### 7. Wrap Up (5 mins)
  Ask them: "If you were the Editor-in-Chief, which round do you authorize? Premise or Conclusion?"
  Let them argue. There's no right answer, which is the point. The formal problem is solved; the political problem is yours.

  ---
  *Quick note for you:* If the votes don't come out exact on the first try (someone miscards), just fudge the numbers slightly or ask one person to abstain to keep the majority clear. Dont let the math bog down the vibe. Also, watch out for the typo in the handout if you print this—i noticed i wrote 'recieve' in my head earlier, check that.
