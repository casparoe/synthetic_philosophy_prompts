      *   **Audience:** Quants and Risk Managers (technical, skeptical of buzzwords, want practical insight).
      *   **Goal:** Evaluate whether "embedded agency" adds value over traditional concepts (reflexivity, Lucas critique, etc.) using 1987 as a case study.
      *   **Constraints:**
          *   Specific sections with word counts (approximate).
          *   Commit to positions (no hedging, pick one primary failure mode).
          *   Address specific questions (boundary, failure modes 1-4, distinctiveness, predictability).
