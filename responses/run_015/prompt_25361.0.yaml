answer: |-
  # Handout: Locating Your Position on Thomson's Lamp

  **Course:** Philosophy of Mathematics  
  **Unit:** Infinity and Supertasks  
  **Topic:** Taxonomy of Responses to Thomson's Lamp

  ## Introduction
  Thomson's Lamp presents a scenario where a lamp is toggled on and off infinitely many times within a finite interval (e.g., 1 minute). At $t=1$, the supertask is complete. Is the lamp on or off?

  Thomson argued the scenario leads to a contradiction. Philosophers have responded in various ways: some accept the contradiction as proof of impossibility, others argue the description is incomplete, and others look to physics.

  Use the decision tree below to locate your own intuitive stance. Answer the questions based on your philosophical instincts, not on which position you think is "famous." Once you reach a leaf, read the corresponding position description.

  ---

  ## The Decision Tree

  ### **START**

  **Q1. The Impossibility Question**  
  Thomson argues that the lamp cannot be On (because it was just turned Off) and cannot be Off (because it was just turned On).  
  **Does this contradiction prove that it is logically or metaphysically impossible to complete the infinite sequence of switchings?**

  *   **YES** $\rightarrow$ Go to **Leaf A**.
  *   **NO** (The task is coherent/possible; the problem is only about describing the *result*) $\rightarrow$ Go to **Q2**.

  ***

  **Q2. The Convergence Question**  
  Imagine a modified lamp that dims rather than toggles. Its brightness is $1/2$, then $1/4$, then $1/8$... approaching 0 at $t=1$.  
  **In this "dimming" case, is the final state (Zero Brightness/Off) determined by the sequence of prior states, whereas the original On/Off case fails specifically because it oscillates?**

  *   **YES** (Convergent sequences determine a limit state; oscillating ones do not) $\rightarrow$ Go to **Leaf B**.
  *   **NO** (Even in the dimming case, the prior description alone does not logically fix the state at $t=1$) $\rightarrow$ Go to **Q3**.

  ***

  **Q3. The Ontology Question**  
  We agree the abstract description does not fix the state. But suppose someone built a physical machine that actually performed the task.  
  **Would the physical laws of our universe determine a specific outcome (On, Off, or Destroyed), or is there genuinely "no fact of the matter" even in a concrete physical realization?**

  *   **Physical laws would decide** (The abstract math is just missing physical details) $\rightarrow$ Go to **Leaf C**.
  *   **No fact of the matter** (Logic/Metaphysics does not fix limits, even for physical objects) $\rightarrow$ Go to **Leaf D**.

  ---

  ## The Positions (Leaves)

  ### **Leaf A: Supertask Eliminativism**
  *   **Core Claim:** Supertasks are impossible.
  *   **Your View:** You side with James Thomson's original argument. The contradiction regarding the lamp's final state is not a puzzle to be solved but a *reductio ad absurdum*. The fact that we cannot assign a truth value to "The lamp is on" proves that the described process cannot occur in any logically possible world.
  *   **Key Philosopher:** James Thomson (1954).

  ### **Leaf B: The Non-Convergence View**
  *   **Core Claim:** Supertasks are possible, but the final state is undefined if the sequence does not converge.
  *   **Your View:** You believe the problem lies in the mathematical properties of the sequence. If the state of the system approaches a limit (like the dimming lamp), the final state is the limit. If the sequence oscillates (On/Off), there is no limit, and thus no final state. The impossibility is local to non-convergent series, not global to all supertasks.
  *   **Key Philosophers:** John Earman, John D. Norton (in some readings).

  ### **Leaf C: The Physical Underdetermination View**
  *   **Core Claim:** The abstract puzzle is ill-posed; physical facts settle the outcome.
  *   **Your View:** You think the philosophical puzzle arises because we are treating a physical scenario as a pure math problem. In reality, quantum mechanics, energy constraints, or the Planck time would determine what happens at $t=1$ (or prevent the task). There *is* an answer in the concrete world, but the abstract description leaves out the physical details required to find it.
  *   **Key Philosophers:** Paul Benacerraf (in part), various philosophers of physics.

  ### **Leaf D: The Dissolution View**
  *   **Core Claim:** The description is logically underdetermined; there is no further fact of the matter.
  *   **Your View:** You side with Paul Benacerraf. You believe that descriptions of a process up to $t=1$ never logically entail the state *at* $t=1$. This is a logical gap, not a physical one. Even with a physical lamp, unless we add a new rule (e.g., "state = limit"), there is no contradiction in the lamp being On, Off, or exploded. The puzzle dissolves once we admit the description was incomplete.
  *   **Key Philosopher:** Paul Benacerraf (1962).

  ---

  ## Caveats and Nuances for Advanced Discussion

  When using this taxonomy in your essays, be aware of the following limitations in the tree structure.

  ### 1. Overlapping Leaves: Dissolution vs. Physical Underdetermination
  **Status:** *Not cleanly separated.*
  **Diagnosis:** Leaf C (Physical) and Leaf D (Dissolution) are often difficult to distinguish in practice. Benacerraf (Leaf D) argues that logic does not fix the state, but he allows that a *physical theory* could stipulate a outcome. Conversely, Physical Underdetermination proponents (Leaf C) argue the abstract question has no answer, which sounds like Dissolution.
  **Why:** The distinction rests on whether you believe a completed physical supertask *inherently* has a determined state (Physical) or whether the state remains metaphysically indeterminate until a new rule is stipulated (Dissolution). In the literature, these views often bleed into one another.

  ### 2. Undefended Position: "Persistence Without Convergence"
  **Status:** *Logically available but undefended.*
  **Location:** This position would arise if a student answered **NO** to Q1 (Task is possible) and **NO** to Q2 (Convergence doesn't matter), but then claimed **the state is nevertheless determined** (e.g., "It must be On because it started On").
  **Diagnosis:** *Incoherent/Unattractive.* This view is generally considered untenable because it violates the symmetry of the switching mechanism. If the lamp is On at $t=1$ because it started On, why is it not Off because it was just turned Off? Defending this requires arbitrary privileging of the initial state over the limit of the sequence, which no major philosopher has successfully argued.

  ### 3. Undefended Position: "Physical Impossibility, Logical Possibility"
  **Status:** *Logically available but often grouped with Eliminativism.*
  **Location:** A student might answer **YES** to Q1 regarding *physical* possibility but **NO** regarding *logical* possibility.
  **Diagnosis:** *Unexplored as a distinct label.* While many philosophers hold this view (supertasks are physically impossible due to energy/speed limits, but logically coherent), the taxonomy forces a choice at Q1. If you hold this view, you likely belong in **Leaf A** (if you focus on the contradiction) or **Leaf C** (if you focus on the physical constraints). This taxonomy treats "Eliminativism" primarily as the view that the *contradiction* drives the impossibility, not just contingent physical laws.

  ### 4. The "Continuity Principle" Gap
  **Status:** *Implicit in Non-Convergence.*
  **Diagnosis:** Leaf B (Non-Convergence) implicitly relies on a "Principle of Continuity" (the state at the limit *must* be the limit of the prior states). However, Leaf D (Dissolution) argues this principle is a *stipulation*, not a logical truth. If you believe the Continuity Principle is a necessary truth of metaphysics, you sit between Leaf B and Leaf D. The tree forces you to decide if convergence *alone* solves the problem (B) or if a rule is still needed (D).
