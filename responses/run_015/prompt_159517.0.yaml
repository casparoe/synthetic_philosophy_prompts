  Here is the breakdown of the rules, the prediction for the new case, and the test to settle the matter.

  ### 1. The Rules That Fit Her History

  You have correctly identified the two heavyweights of bargaining theory. They produce identical results on straight-line frontiers starting from zero (your Cases 1, 2, and 3), which is why your notes haven't separated them yet.

  **Rule A: The Nash Bargaining Solution**
  *   **The Formula:** Pick the option that maximizes the product of the two payoffs ($Red \times Blue$).
  *   **The Logic:** This maximizes the "joint gain" in a specific geometric sense. It inherently penalizes imbalance; a deal of $1 \times 9$ (product 9) is worse than $5 \times 5$ (product 25). It also automatically rules out wipe-outs (product 0).
  *   **Fit:** Fits Cases 1, 2, 3 perfectly. Fits Case 4 (discrete options) because $7 \times 7 = 49$, while $10 \times 0 = 0$.

  **Rule B: The Kalai-Smorodinsky Solution (Standard)**
  *   **The Formula:** Calculate the "Ideal Point" (the maximum possible payoff for Red and the maximum possible for Blue anywhere on the menu). Draw a line from the walk-away (0,0) to that Ideal Point. Pick the feasible option that lies closest to that line (giving each side the same *proportion* of their maximum).
  *   **The Logic:** Monotonicity. If Red's maximum potential increases, Red should not get less. It focuses on fairness relative to *potential*.
  *   **Fit:** Fits Cases 1, 2, 3 perfectly. Fits Case 4 (Ideal Point 10/10, ray hits 7/7).

  **Rule C: The "Realistic" Kalai-Smorodinsky (Your Hypothesis)**
  *   **The Formula:** Same as Rule B, but when calculating the "Ideal Point," **exclude any package that wipes out the other side.**
