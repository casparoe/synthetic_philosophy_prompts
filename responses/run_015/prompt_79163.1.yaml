answer: |-
  # Activity Design: The Meridian Isles Conference

  ## 1. Overview and Learning Objective
  **Title:** The Meridian Isles Causal Standoff
  **Time:** 90 Minutes
  **Participants:** 16 Graduate Students
  **Goal:** To structurally replicate the underidentification problem in cross-national growth regressions. Students will experience the frustration of high correlations that cannot distinguish between causation, reverse causation, and confounding, without access to "cleverer" econometrics or new observational data.

  **The Core Trap:** All three teams will find strong correlations ($r > 0.85$) between their variable and Prosperity. However:
  1.  **Geography** is the true cause ($G \to P$).
  2.  **Institutions** are a consequence of wealth ($P \to I$).
  3.  **Culture** is a proxy for an unobserved colonial factor ($U \to C$ and $U \to P$).
  *No amount of statistical manipulation on the provided 10-island dataset can distinguish these.*

  ---

  ## 2. The Hidden Structure (Instructor Only)
  *Do not reveal this until the Debrief.*

  **The Data Generating Process (DGP)**
  *   **$N = 10$ Islands** (Meridian Isles 1–10).
  *   **$U$ (Unobserved):** *Colonial Extraction Intensity*. High $U$ means the colonizers invested heavily in infrastructure and social engineering.
  *   **$P$ (Prosperity):** 1990 GDP per Capita (Index 0–100). Determined by $G$ and $U$.
  *   **$G$ (Geography):** *Soil Stability Index* (0–100). Exogenous. Causes $P$.
  *   **$I$ (Institutions):** *Property Rights Index* (0–100). Caused by $P$ (Rich islands build better courts).
  *   **$C$ (Culture):** *Civic Trust Score* (0–100). Caused by $U$ (Colonial social engineering).

  **The Data Table (Master Copy)**
  *Prepare this for yourself. The numbers are integers for easy hand calculation.*

  | Island | Prosperity ($P$) | Geography ($G$) | Institutions ($I$) | Culture ($C$) | Hidden $U$ |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 10 | 12 | 14 | 11 | 5 |
  | 2 | 20 | 21 | 23 | 19 | 15 |
  | 3 | 30 | 29 | 35 | 31 | 25 |
  | 4 | 40 | 42 | 41 | 39 | 35 |
  | 5 | 50 | 48 | 52 | 51 | 45 |
  | 6 | 60 | 61 | 58 | 59 | 55 |
  | 7 | 70 | 69 | 74 | 71 | 65 |
  | 8 | 80 | 82 | 79 | 79 | 75 |
  | 9 | 90 | 88 | 92 | 91 | 85 |
  | 10 | 100 | 98 | 97 | 98 | 95 |

  *Note to Instructor:* The correlations between $P$ and $G$, $P$ and $I$, $P$ and $C$ are all $>0.99$. Visually, they are indistinguishable. The structural difference is purely in the *story* attached to specific islands (held by Historians) and the DGP logic.

  ---

  ## 3. Materials to Prepare

  ### A. Three Data Booklets (Team A, B, C)
  Each booklet contains the **Master Table** but with columns redacted.
  *   **Team Blue (Geography):** Sees Island ID, Prosperity ($P$), Geography ($G$).
  *   **Team Red (Institutions):** Sees Island ID, Prosperity ($P$), Institutions ($I$).
  *   **Team Green (Culture):** Sees Island ID, Prosperity ($P$), Culture ($C$).
  *   *All Booklets:* Include a blank sheet for "Causal Claim & Policy Proposal."

  ### B. Role Cards
  *   **Research Teams (4 students each):** "You are the leading experts on [Variable]. Your goal is to publish a causal claim that survives the conference. You cannot share your raw data sheet with other teams."
  *   **Referee Panel (2 students):** "You are the Journal Editors. You do not have data. Your job is to check if claims are **falsifiable**. If a claim is vague (e.g., 'it depends'), penalize them. If a claim is specific, award points."
  *   **Regional Historians (2 students):**
      *   *Historian 1 (Island 3):* Holds a memo: "Archival record shows Property Courts were built in 1985, *after* the 1980 mining boom caused the wealth spike." (Evidence for Reverse Causality).
      *   *Historian 2 (Island 7):* Holds a memo: "Census shows 'Civic Trust' scores were assigned by Colonial Administrators based on tax revenue, not local custom." (Evidence for Confounding).
      *   *Instruction:* "You may speak only when called upon by the Chair or during Cross-Examination. Your evidence applies *only* to your specific island."

  ### C. Scoreboard (Whiteboard)
  *   **Columns:** Team Blue, Team Red, Team Green.
  *   **Rows:** Claim Submitted (+5), Claim Survives Challenge (+10), Claim Withdrawn (-5), Claim Falsified (-10).

  ### D. Claim Template
  A slip of paper each team must fill out:
  1.  **Causal Direction:** (e.g., X causes Y).
  2.  **Falsifier:** (e.g., "If we find an island with High X and Low Y, we are wrong").
  3.  **Policy:** (e.g., "Intervention Z will increase Y").

  ---

  ## 4. Rules and Payoff Scheme

  1.  **Data Embargo:** Teams cannot show their data sheets to each other. They can only state *conclusions* (e.g., "Our correlation is 0.9"). Violation = Disqualification.
  2.  **The Claim:** Must be submitted at Minute 45. It must include a specific Policy Implication.
  3.  **The Challenge:** Other teams and Historians can challenge the claim.
  4.  **Scoring:**
      *   **+5 Points:** Submitting a specific claim (no "maybe").
      *   **+10 Points:** Claim remains on the board at the end of the session.
      *   **-5 Points:** Voluntary Withdrawal (admitting uncertainty).
      *   **-10 Points:** Falsified by Evidence (Historian or logical contradiction).
  5.  **Referee Power:** Referees can reject a claim as "Non-Falsifiable" (e.g., if the team adds too many caveats). Rejected claims get 0 points.

  ---

  ## 5. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles and booklets. Explain rules. Emphasize: "You are competing for prestige. Vague claims score zero." |
  | **10-30** | **Analysis** | Teams calculate correlations and draft their causal story. Referees circulate to answer rule questions. Historians review their memos. |
  | **30-45** | **Drafting** | Teams finalize their Claim Template. They must agree on a Policy. (Instructor warns: "2 minutes to lock in your claim.") |
  | **45-50** | **Submission** | Teams hand Claims to Referees. Referees post them on the board (anonymized or named). Score +5 for all. |
  | **50-70** | **Conference** | **Round 1:** Each team presents (3 mins each). <br> **Round 2:** Cross-Examination. Teams attack each other's mechanisms. <br> **Intervention:** Instructor calls on Historians to present their archival memos. |
  | **70-80** | **Crisis** | Teams realize their data is compatible with the attacks. They must decide: Withdraw (-5) or Defend (Risk -10). Referees judge if defenses are ad-hoc. |
  | **80-90** | **Debrief** | Reveal DGP. Map the experience to the literature. Discuss "Identification." |

  ---

  ## 6. The Debrief Script (Crucial)

  **Part 1: The Reveal (5 mins)**
  *   Draw the DGP diagram on the board ($G \to P$, $P \to I$, $U \to C$, $U \to P$).
  *   Show the Master Table.
  *   **Ask:** "Team Red (Institutions), when did you first suspect you were in trouble?" (Likely answer: When Historian 1 spoke).
  *   **Ask:** "Team Green (Culture), why couldn't you just control for Geography?" (Answer: Because $U$ is unobserved).

  **Part 2: Mapping the Vertigo (3 mins)**
  *   "At minute 30, you felt confident. You had $r > 0.9$. At minute 60, you felt stuck. **That feeling is the epistemic constraint.** It was not a lack of cleverness. It was a lack of *leverage*."
  *   Point out that adding more islands (increasing $N$) would not have helped, because the structural bias is in the *generation* of the data, not the sample size.

  **Part 3: The Way Out (2 mins)**
  *   "In real research, how do we escape this?"
  *   Introduce **Identification Strategies**: Instrumental Variables, Regression Discontinuity, Natural Experiments.
  *   **Key Lesson:** "We do not solve this with *better observational data* (more variables). We solve it with *exogenous variation* (a border, a shock, a lottery). This simulation denied you exogenous variation. That is why you were stuck."

  ---

  ## 7. Predictable Failure Modes & Fixes

  ### Failure Mode 1: The Merger (Collusion)
  *   **Risk:** Team Blue and Team Red realize their numbers look similar, swap sheets, and claim "Joint Causality."
  *   **Fix:** The **Data Embargo Rule**. Announce at Minute 5: "Any sharing of raw data sheets results in immediate disqualification for all involved teams." Enforce this strictly. If they share *conclusions*, that is allowed (that's science), but not the numbers.

  ### Failure Mode 2: The Prosecutor Referees
  *   **Risk:** Referees get power-hungry and reject all claims as "insufficiently proven."
  *   **Fix:** Instruct Referees privately: "Your job is to check for **Falsifiability**, not Truth. If a team says 'X causes Y unless Z,' that is unfalsifiable. If they say 'X causes Y, falsified by Island 5,' that is valid. Reward specificity."

  ### Failure Mode 3: Ignoring the Historians
  *   **Risk:** Teams dismiss the Historians as "anecdotal" ($N=1$) and refuse to withdraw claims.
  *   **Fix:** Give Historians a **"Veto Token."** If a Historian presents evidence that directly contradicts the *mechanism* of a claim (e.g., timing), the Referees *must* mark that claim as "Contested." To clear the contest, the team must Withdraw (-5) or provide a theoretical reason why the Island is an outlier (which costs them credibility/points in the debrief).

  ### Failure Mode 4: The "Better Data" Delusion
  *   **Risk:** Students argue, "If we just had data on $U$, we could solve this."
  *   **Fix:** This is actually a *success* condition, but you must cap it. In the Debrief, acknowledge: "Yes, measuring $U$ solves *this* model. But in reality, $U$ is often unmeasurable (e.g., 'culture', 'expectations'). The point is that *observational* data on $X$ and $Y$ is never enough."

  ---

  ## 8. Limitations: What This Activity Cannot Reproduce

  You must be frank about this in the final 5 minutes so students don't leave as skeptics.

  **1. The Missing Lever: Exogenous Variation**
  *   **Limitation:** This simulation is purely cross-sectional observational. Real social science often escapes this trap using **Natural Experiments** (e.g., the division of Korea, the random assignment of settlers, colonial borders drawn by Europeans unrelated to local geography).
  *   **How to Supply It:** In the Debrief, explicitly state: "You were stuck because I gave you a **static snapshot**. Real researchers look for **shocks**. If I had given you a 'Hurricane' variable that hit only 5 islands randomly, Team Blue could have used that as an Instrument. I withheld this to force the standoff, but in the real world, this is your primary tool."

  **2. The Missing Lever: Mechanism Heterogeneity**
  *   **Limitation:** The simulation assumes a linear, uniform effect across all islands.
  *   **How to Supply It:** Mention that in real work, researchers look for *where* the mechanism breaks. (e.g., "If Institutions cause Growth, why did Country X fail despite good institutions?"). The Historians partially simulate this, but real process tracing is deeper.

  **3. The "Undecidable" Trap**
  *   **Warning:** Do not let them conclude "Causal inference is impossible."
  *   **Correction:** "Causal inference from *this kind of data* is impossible. Causal inference from *structured evidence* (experiments, quasi-experiments, process tracing) is difficult but possible. The field moved on from 'Growth Regressions' (what you just did) to 'Identification Strategies' (what you need to do next)."

  ---

  ## 9. Instructor Checklist for Setup

  1.  **Print Data Booklets:** 3 versions (Blue, Red, Green). Ensure columns are hidden correctly.
  2.  **Print Role Cards:** 12 for Teams, 2 for Referees, 2 for Historians.
  3.  **Print Historian Memos:** Make them look "archival" (dated, specific).
  4.  **Whiteboard:** Draw the Scoreboard grid beforehand.
  5.  **Timer:** Essential. Keep the pressure high.
  6.  **Calculators:** Optional, but numbers are simple enough for phones/paper.

  ## 10. Why This Works
  This activity forces students to inhabit the **Researcher's Dilemma**. They cannot be passive critics because their grade/points depend on making a claim. When the claim collapses under the weight of the Historians' evidence, they feel the **structural constraint** personally. They cannot blame "bad data" because the data is clean. They cannot blame "lazy researchers" because they *are* the researchers and they are stuck. This creates the necessary cognitive dissonance to understand why the field shifted toward identification strategies.
