answer: |-
  You have put your finger on the central tension in modern effective altruism and longtermist decision theory. You are not imagining it, and your spreadsheet is not broken; the mathematics of expected value (EV) genuinely behaves this way under specific conditions.

  Here is the breakdown of the established concepts, where they fail to capture your specific observation, the name for the specific "balloon" mechanism you're seeing, and the answers to your boundary questions.

  ### 1. The Established Labels (and why they feel slightly off)

  There are three concepts in the neighborhood. You are correct that none of them perfectly describe the *estimation dynamic* you are witnessing, though they describe the *terrain*.

  *   **Pascal's Mugging:** This is the closest popular term. Originally, it described a scenario where an agent threatens you with infinite disutility unless you pay them $5. In broader EA usage, it refers to any case where a tiny probability multiplied by an astronomical value outweighs a certain moderate good.
      *   *Why it fits:* It captures the "tiny prob × huge value" structure.
      *   *Why it misses:* Pascal's Mugging usually implies an *adversary* or an *absurd* claim (simulating 3^^^^3 people). Your case is more mundane: reasonable-sounding policy work where the magnitude is just "unanchored" rather than "infinite." It feels like a bug in your estimation process, whereas Pascal's Mugging is usually presented as a paradox of rationality itself.
  *   **The Fanaticism Problem:** This is the rigorous academic term (formalized by philosophers like Nick Beckstead and Thomas). It states that any decision theory that maximizes expected utility is logically compelled to prioritize interventions with tiny probabilities of astronomically large outcomes over interventions with certain moderate outcomes.
      *   *Why it fits:* This is exactly the *conclusion* your group is reaching (the speculative grant wins).
      *   *Why it misses:* "Fanaticism" describes the *implication* of the theory, not the *psychological/mechanical process* of the numbers moving. It doesn't name the "balloon squeezing" where $V$ inflates as $P$ deflates.
  *   **Cluelessness:** As you noted, this is about not knowing the *sign* of the effect (will this help or hurt?). Your problem is not about the sign; it's about the *magnitude*. You know (roughly) the direction; you just can't bound the scale.

  ### 2. The Missing Label: "Compensatory Magnitude Inflation"

  The specific dynamic you described—where a decrease in probability confidence is met with an increase in magnitude estimates to preserve the EV product—does not have a single standard word in decision theory, though it is a known artifact of **Unbounded Utility Functions**.

  Since you asked for a term to use in your notes, I propose you call this **Compensatory Magnitude Inflation (CMI)**.

  **Definition:** CMI occurs when an estimator treats the Expected Value ($EV = P \times V$) as a target to be justified rather than a result to be discovered. Because Probability ($P$) is epistemically bounded (it cannot exceed 1, and shrinks under scrutiny) while Value ($V$) is treated as epistemically unbounded (future lives, downstream effects), the estimator unconsciously inflates $V$ to compensate for reductions in $P$, keeping the $EV$ artificially stable or growing.

  **Why it happens (The Structural Feature):**
  This is not just an artifact of your spreadsheets; it is a structural feature of EV reasoning whenever **Value is unanchored**.
  *   $P$ lives in a closed interval $[0, 1]$. It has a hard ceiling.
  *   $V$ (in longtermist/policy cases) often lives in $[0, \infty)$. It has no hard ceiling.
  *   When you scrutinize a claim, $P$ naturally drifts toward the hard floor (0).
  *   To maintain a compelling $EV$, the only variable with room to move is $V$.
  *   If your group believes "the future could be vast," $V$ has no natural stopping point. Therefore, $V$ expands to fill whatever space $P$ vacates.

  This is effectively **Goodhart's Law** applied to epistemic inputs: *When EV becomes the target, P and V cease to be independent measures.*

  ### 3. Boundary Cases

  You asked whether this holds up under different conditions. Here is the behavior of CMI in those scenarios:

  **A. Does it bite if the payoff is bounded?**
  **No.** This is the off-switch.
  If you impose a hard epistemic cap on $V$ (e.g., "There are physically only $10^{24}$ possible human-hours in the future light cone, and we can only influence 1% of them"), the balloon pops.
  *   *Mechanism:* Once $V$ hits its ceiling, pushing $P$ down *must* drive $EV$ down.
  *   *Application:* If your fund adopts a "conservative magnitude cap" (e.g., "we will not count more than 1 billion lives impacted regardless of the theory"), CMI is neutralized. The speculative project will suddenly look much worse because it can no longer inflate $V$ to save $P$.

  **B. Does it work symmetrically on the downside?**
  **Yes.** This is often called **Pascal's Menace**.
  If a speculative intervention has a tiny chance of causing *astronomical harm* (e.g., "this research could accidentally unlock a technology that locks in totalitarianism for a million years"), CMI applies identically.
  *   *Result:* You become paralyzed. Any action with a complex causal chain has a non-zero probability of catastrophic downstream effects. If you allow magnitude to inflate to compensate for low probability, *everything* looks dangerously high-risk.
  *   *Observation:* Notice if your group ignores downside CMI while accepting upside CMI. That is a sign of motivated reasoning.

  **C. What if *both* options are equally murky?**
  **It becomes a Storytelling Contest.**
  If Option A and Option B both rely on long causal chains with unanchored magnitudes, EV math loses all discriminative power.
  *   *Mechanism:* $EV_A \approx P_A \times V_A$ and $EV_B \approx P_B \times V_B$. If $V$ is unconstrained, the winner is simply whoever can tell the more emotionally compelling story about the *scale* of the impact.
  *   *Result:* The fund stops optimizing for *truth* and starts optimizing for *imagination*. The grant goes to the most visionary writer, not the most effective intervention.

  ### 4. Is this a bug or a feature?

  It is a **bug in human estimation** exploiting a **feature of EV math**.

  Expected Value theory assumes inputs are independent and calibrated. CMI reveals that your inputs are correlated: your estimate of "how many lives" is dependent on your desire for "how important this is."

  In your specific context ($60k fund, 8 people), this is dangerous. You do not have the epistemic leverage to actually distinguish between a $10^9$ impact and a $10^{12}$ impact. Those numbers are effectively noise. When the noise dominates the signal (the probability), the decision is random.

  ### 5. Practical Fixes for Your Fund

  You cannot "think" your way out of this using the same EV framework, because the framework is what allows the balloon to inflate. You need procedural constraints.

  1.  **Cap the Magnitude (The Hard Ceiling):**
      Agree on a maximum plausible impact for any grant *before* discussing the specific proposal. (e.g., "No grant can be valued at more than 100,000 lives improved"). This forces the balloon to pop. If the speculative grant can't win with a capped magnitude, it wasn't robust.
  2.  **Blind Estimation (Decouple P and V):**
      Have one person estimate $P$ (likelihood of success) without knowing the claimed $V$. Have another estimate $V$ (scale of impact) assuming success, without knowing the $P$. Multiply them only at the end. This prevents the subconscious negotiation where $V$ rises to save $P$.
  3.  **Use Geometric Means (The Log-Rule):**
      Instead of $EV = P \times V$, use $\log(EV) = \log(P) + \log(V)$.
      *   *Why:* In linear EV, a 100x increase in $V$ cancels a 1/100 decrease in $P$. In log-space, uncertainties add up rather than cancel out. Huge uncertainty in $V$ becomes a huge penalty, not a huge opportunity. This naturally penalizes the "murky" options.
  4.  **The "Reverse Test":**
      Ask the proponent: "If the impact were definitely only $10^9$ lives (your lower bound), would you still fund this at this probability?" If the answer is no, then the case rests entirely on the inflated magnitude, which you've already admitted is a guess.

  ### Summary for your Meeting Notes

  *   **Phenomenon:** **Compensatory Magnitude Inflation (CMI)**.
  *   **Parent Concept:** **The Fanaticism Problem** (decision theory) / **Pascal's Mugging** (popular).
  *   **Diagnosis:** Your EV model is selecting for **Unbounded Utility** claims because Probability is bounded and Magnitude is not.
  *   **Verdict:** This is a structural vulnerability in EV reasoning when applied to epistemically unconstrained variables. It is not a feature of reality; it is a feature of your estimation process.
  *   **Action:** Implement magnitude caps or switch to log-scoring to penalize uncertainty rather than reward it.

  You are doing the right thing by noticing this. Most groups just let the balloon float away and call it "rigor."
