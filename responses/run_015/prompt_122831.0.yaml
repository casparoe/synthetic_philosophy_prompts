  3.  **Physical Mechanism:** Describe the real-world process generating $X$, not the mathematical abstraction. *Sufficient Answer:* "Storm genesis location uniform over ocean basin area."
  4.  **Handover Test:** Give Step 3 to a naive analyst. Can they reproduce the distribution uniquely? *Sufficient Answer:* "Yes, derivation matches." If no, **STOP** and refine Step 3.
  5.  **Arbitrariness Check:** Does the mechanism rely on undefined human choices (e.g., "hand dropping straws")? If yes, **STOP** and seek data or expert elicitation.
  6.  **Senior Review:** If mechanism is physical but parameterization remains ambiguous (e.g., radius vs. area), **HANDOFF** to Senior Reviewer. This is a modeling judgment, not a fact.
  7.  **Finalize:** Record the chosen scale, units, and mechanism in the model documentation.
  8.  **File Justification:** Complete the regulatory paragraph below.

  **Case Applications**

  1.  **Hazard Track:** Step 3 fails initially ("line in plane" is ambiguous). Step 6 triggers. Senior must choose physical story (e.g., "genesis uniform on sphere, heading uniform"). Result: Distribution is not uniform on chord length; it depends on the genesis density.
  2.  **Failure Rate:** Step 2 fails. Uniform on rate $\lambda$ is not uniform on mean time $1/\lambda$. Step 5 triggers. No physical basis for linear rate uniformity. **STOP**. Seek engineering data or default to log-uniform (Jeffreys prior).
  3.  **Regulatory Fines:** Step 1 fails. "Unnamed quantity" lacks units/mechanism. Step 4 fails. **STOP**. Cannot model without defining driver (e.g., "% of revenue" vs "fixed amount").

  **Regulatory Justification**
  "We model [Quantity] as uniform on [Scale] because [Physical Mechanism] dictates equal likelihood per unit [Unit]. This scale was selected following the Units-and-Reparameterization Check and Handover Test, ensuring reproducibility. Deviations from this scale imply non-physical weighting."

  **Limitations**
  This procedure cannot settle true epistemic ignorance where no physical mechanism exists, nor can it validate the mechanism against reality without data. It ensures internal consistency and reproducibility, not external truth. It cannot resolve disagreements between equally valid physical stories (e.g., different storm genesis models) without data. It makes arbitrariness explicit but does not eliminate it.
