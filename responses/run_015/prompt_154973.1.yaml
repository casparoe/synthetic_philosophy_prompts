answer: |-
  To determine the underlying logic of your novel, we must evaluate how each framework handles the tension between material evidence and human experience across your three chosen episodes. The Rupture thesis prioritizes the catastrophic failure of high-complexity systems, while the Palimpsest hypothesis prioritizes the resilience of communities and the biases of the archaeological record.

  **Ecological Stress and Monumentality**
  The Rupture thesis interprets the cessation of monument building as a loss of capacity. In the Eastern Mediterranean, the burning of palaces signals the end of the redistributive economy that funded them. In the Maya lowlands, the halt in stelae erection marks the failure of divine kingship. On Rapa Nui, the toppling of moai is read as civil strife following ecological exhaustion. This model serves a narrative of tragedy and hubris; the environment fights back, and civilization loses.

  The Palimpsest hypothesis, conversely, reads the end of monumentality as a shift in investment. Bronze Age populations moved to defensible hillsites, investing labor in fortification rather than frescoes. Maya populations shifted north to cenote-dependent cities, continuing construction but in styles less visible to early excavators of the southern lowlands. Rapa Nui society shifted from ancestor worship (moai) to the Birdman cult, reflecting a change in ideology rather than a loss of social cohesion. For a novel, this model supports themes of adaptation and the invisibility of common survival against the backdrop of elite failure.

  **Demographic Signals and Visibility**
  The Rupture thesis relies on demographic crashes to validate collapse. It struggles, however, with uneven signals—such as the depopulation of the Maya south alongside the flourishing of the north. It risks interpreting migration as extinction. The Palimpsest hypothesis accounts for these uneven signals by treating them as redistribution. It argues that "collapse" is often a change in settlement patterns from nucleated cities to dispersed villages, which leave thinner archaeological traces. This explains why some regions appear empty while remaining inhabited.

  **Literacy and State Structures**
  This is the critical distinction for your narrative logic. The Rupture thesis posits that when states fall, literacy vanishes because the institutional scaffolding (scribal schools, bureaucratic demand) is destroyed. This is historically accurate for Linear B in Greece, which disappeared for centuries. The Palimpsest hypothesis argues that literacy may persist in perishable media or shift to oral traditions, only to re-emerge when conditions allow.

  However, neither model alone fully captures the nuance required for all three cases. The Bronze Age experienced a genuine rupture in literacy and centralized authority that a pure Palimpsest model might minimize. Conversely, the Maya and Rapa Nui cases are better served by the Palimpsest hypothesis, as recent evidence suggests resilience and transformation rather than total extinction. A strict Rupture thesis would force you to depict the Maya and Rapa Nui peoples as victims of their own failure, ignoring their successful adaptation to new political and ecological realities. A strict Palimpsest hypothesis would risk glossing over the genuine trauma and cultural loss experienced by Bronze Age populations who lost their writing systems and global trade networks.

  **Conceptual Verdict**
  For a novel moving between these three episodes, adopting exclusively one framework risks historical flattening. The Rupture thesis provides the dramatic stakes—the feeling of the world ending—which is essential for character motivation. The Palimpsest hypothesis provides the historical depth—the knowledge that life continues in new forms—which allows for thematic resonance beyond simple tragedy.

  Therefore, the most robust logic is one that treats "collapse" not as a binary event, but as a divergence between institutional death and social continuity. This allows you to depict the genuine loss of specific technologies (like Linear B) while simultaneously revealing the persistence of people and practices (as in Maya and Rapa Nui). It enables a narrative structure where the "end" is experienced as a rupture by the characters living through it, even if the long-term historical view reveals a palimpsest. This duality creates the necessary tension between the fragility of complexity and the endurance of humanity.

  Verdict: A synthesized position
