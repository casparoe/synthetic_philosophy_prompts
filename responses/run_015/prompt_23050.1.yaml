answer: |-
  You are right to be skeptical. Your intuition is spot-on: there is **no canonical essay or text by Frank Ramsey titled "The Meaning of Life,"** nor did he leave behind a systematic doctrine on existential questions comparable to his work on probability or mathematics.

  The confusion you are encountering likely stems from a conflation of three things: his late turn toward ethics, his pragmatist definition of belief, and the biographical poignancy of his early death.

  Here is a breakdown of where this idea comes from, what he actually wrote, and how to interpret the claims you've been reading.

  ### 1. The Source of the Claim: The "Last Papers" (1929–1930)
  The primary source for any claim that Ramsey had a "view on life" is found in his **unfinished manuscripts on ethics**, written in the last year of his life.

  For most of his career, Ramsey focused on logic, mathematics, and the philosophy of science. However, in 1929, he underwent a significant shift. He began working on a naturalistic theory of ethics to replace the intuitionism of G.E. Moore (whom Ramsey admired but ultimately disagreed with).

  These fragments were published posthumously in:
  *   **_The Foundations of Mathematics_ (1931):** Edited by R.B. Braithwaite. This volume contains a section often referred to as the "Last Papers."
  *   **_Philosophical Papers_ (1990):** Edited by D.H. Mellor. This is the modern standard edition. Look for the section on **Ethics** (specifically the fragment sometimes titled *"On Good and Evil"* or simply *"Ethics"*).

  In these notes, Ramsey attempts to ground "good" and "bad" not in mystical properties (as Moore did) but in **human psychology and desire**. He argues that ethical judgments are expressions of our desires and attitudes.

  ### 2. What He Actually Said (The "Pragmatist" View)
  You guessed correctly that his view is pragmatist, but it is specifically tied to his theory of belief.

  *   **Belief as Action:** In his famous paper *"Truth and Probability"* (1926), Ramsey argues that a belief is not just a picture in the head; it is a **disposition to act**. A belief is "true" if acting on it leads to successful outcomes.
  *   **Ethics as Desire:** In his late ethical notes, he extends this to value. He suggests that "good" is roughly what satisfies a coherent system of desires.
  *   **The "Meaning" Connection:** Some scholars (like Hugh Mellor and Cheryl Misak) interpret this to mean that for Ramsey, the "meaning" of life isn't a metaphysical secret to be uncovered, but a practical project: **the successful coordination of desires and actions.**

  There is no single "quote" where he says, "The meaning of life is X." However, the sentiment attributed to him is usually a paraphrase of his view that **value is human-centered and rooted in the success of our agency.**

  ### 3. Why the Confusion Exists
  There are three reasons you are running into this "meaning of life" narrative:

  **A. The Wittgenstein Conflation**
  Ramsey was Ludwig Wittgenstein's close friend, translator, and philosophical interlocutor. Wittgenstein *did* write famously about the "meaning of life" (e.g., in the _Tractatus_, 6.52: *"The sense of the world must lie outside the world..."*). Because Ramsey is often discussed in the same breath as Wittgenstein (and Keynes), biographers sometimes bleed Wittgenstein's mystical/existential concerns into Ramsey's more down-to-earth pragmatism.

  **B. The Biographical Narrative**
  Ramsey died at 26 from complications following surgery. Biographers (such as MacBride in _Frank Ramsey: A Sheer Excess of Powers_) often highlight his late ethical turn to show his intellectual maturation. It creates a compelling narrative arc: the cold logician softens in his final year to ask, "How should we live?" This can lead to overstated claims about a "doctrine" on the meaning of life that doesn't actually exist in the text.

  **C. "Meaning" vs. "Truth"**
  Ramsey wrote extensively on the **meaning of propositions** (e.g., in *"Facts and Propositions"*). He argued that the meaning of a statement is tied to the conditions under which it would be useful or actionable. Secondary literature sometimes playfully or loosely extends this semantic theory to the "meaning of life," implying that for Ramsey, life has meaning only insofar as it involves actionable, truthful engagement with the world.

  ### 4. Is There a Specific Letter?
  You mentioned sources hinting at a letter. There is no single "existential letter" that serves as a testament. However, Ramsey did write letters to **G.E. Moore** and **John Maynard Keynes** in 1929 discussing his new ethical ideas.
  *   In correspondence with Moore, Ramsey critiques Moore's _Principia Ethica_, arguing that "good" is not an indefinable non-natural property.
  *   In letters to his wife, Lettice, he expresses deep humanistic values, but these are personal rather than philosophical doctrines.

  If a source claims there is a "specific text" where he commits to a position, they are likely referring to the **unfinished manuscript on Ethics** found in his _Foundations of Mathematics_, or they are exaggerating the significance of his 1929 review of Moore's _Ethics_ (published in _Mind_).

  ### 5. Summary: How to Read the Claims
  If you are reading a source that claims Ramsey had a developed "philosophy of the meaning of life," treat it as **interpretive commentary**, not exegesis.

  *   **True:** Ramsey moved toward ethics and value theory in 1929–1930.
  *   **True:** He held a pragmatist, naturalistic view that value is rooted in human desires and successful action.
  *   **False:** He wrote a systematic treatise or a specific essay defining the "meaning of life."
  *   **False:** He held a mystical or religious view (he was an atheist/agnostic who valued human connection).

  **Recommendation for Verification:**
  If you want to see the actual text that generates these claims, look at **_Philosophical Papers_ (edited by D.H. Mellor, Cambridge University Press, 1990)**. Go to the section on **Ethics**. You will see that his "view on life" is actually a technical, psychological account of how we judge value, rather than a spiritual or existential manifesto.

  You aren't missing a hidden text; the "meaning of life" label is largely a secondary interpretation of his late pragmatism.
