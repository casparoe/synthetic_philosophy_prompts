      *   **Specific Problem:** The tension between the *historical/reconstructive* role of MSRP (explaining past rationality) and its *normative/prospective* role (guiding current decisions). Specifically, the difficulty of distinguishing "progressive" vs. "degenerating" in real-time (the problem of hindsight).
      *   **Concrete Example:** An educational psychology programme positing a "learning reserve" that explains away failures via auxiliary hypotheses about masking factors (motivation, etc.), claiming these open new questions but never making startling novel predictions.
      *   **Desired Output:** Conceptual anatomy of the problem, Lakatos's intended resolution (or relocation) of the problem, the role of the positive heuristic, and an honest assessment of whether the framework bears this weight. No bibliography/survey, just conceptual analysis.

  2.  **Deconstruct the Conceptual Difficulty:**
      *   The student has identified the "Problem of Real-Time Assessment."
      *   *Core Issue:* Degeneration is defined by a lack of *novel* predictions. But you can't know if a prediction is novel and successful until *after* it's made and tested.
      *   *The Dilemma:* If we wait for history to judge, MSRP is just history, not methodology. If we use it now, we risk abandoning a programme that is just in a "dip" or sticking with one that is dead.
      *   *The Example:* The "learning reserve" programme looks degenerating (always saving the core), but defenders say it's progressive (generating new questions about masking). Who is right *now*?

  3.  **Analyze Lakatos's Position (Internal Logic):**
      *   *Retrospective vs. Prospective:* Lakatos explicitly acknowledges this tension. He often leans towards the retrospective view ("rational reconstruction of history"). He admits scientists aren't always rational in the moment.
      *   *The Definition of "Ad Hoc":* Lakatos distinguishes between $\alpha$, $\beta$, and $\gamma$ ad hocness.
          *   $\alpha$: No novel predictions.
          *   $\beta$: Novel predictions but not corroborated.
          *   $\gamma$: Novel predictions, corroborated, but no increase in empirical content (this is tricky, usually $\alpha$ is the main one).
          *   *Key:* The crucial distinction is *theoretical* vs. *empirical* progress.
      *   *The Positive Heuristic:* This is the engine. It's not just "making adjustments." It's a *plan*. Does the adjustment fit the long-term plan of the programme, or is it a panic reaction?
