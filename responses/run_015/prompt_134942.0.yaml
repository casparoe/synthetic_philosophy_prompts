answer: |-
  ### Educator's Brainstorm & Strategy Notes

  Before we lock in the syllabus, here's the quick back-of-the-napkin thinking on why this specific audience (CogSci grads) is tricky. They're trained to operationalize variables. If you say "tall," their instinct is to say "define height > X cm." They treat vagueness as noise or measurement error by default.

  *   **The Trap:** They will naturally drift toward a probabilistic view ("It's 51% tall") or an operational view ("The model decides"). Both miss the philosophical point.
  *   **The Fix:** We need to force a wedge between *representation* (the model/data) and *content* (the meaning/truth).
  *   **The ML Example:** It's high-risk, high-reward. A single threshold flip (0.49 → 0.51) looks like Epistemicism (there is a line, it's just in the weights), but it's actually just arbitrary engineering. To make it work for Supervaluationism, you need *multiple* models trained on slightly different labelings (representing precisifications). I'll refine this in the plan.
  *   **Pacing:** 90 minutes is tight. You can't derive the Sorites paradox from scratch and then do two complex semantic theories. You need to state the paradox as a given problem and jump straight to "How do we save classical logic?"

  Here is the teaching plan.

  ***

  ### 1. Dependency Structure: The Logical Wedge

  You can't teach the split between Epistemicism and Supervaluationism until you've forced them to feel the tension of the Sorites paradox within *classical* logic. If they think logic is flexible, both theories look unnecessary.

  **Order of Operations:**
  1.  **The Classical Commitment (10 mins):** Establish that we are working in Classical Logic (Bivalence holds, Law of Excluded Middle holds). *Why?* Because both Epistemicism and Supervaluationism are attempts to *save* classical logic, not reject it (unlike Fuzzy Logic or Intuitionism).
  2.  **The Sorites Pressure (15 mins):** Run a quick Sorites sequence. Don't linger on the paradox itself; linger on the *conclusion*. Classical logic + Tolerance Principle = Contradiction. One must go.
  3.  **The Fork (The Crucial Pivot):** Present the dilemma:
      *   Option A: Reject Tolerance (There is a sharp cutoff).
      *   Option B: Reject Bivalence (Some cases are neither true nor false).
      *   *Wait,* tell them Supervaluationism is tricky—it *looks* like Option B but claims to save Option A's logic.
  4.  **The Split:**
      *   **Epistemicism:** Accepts sharp cutoff (Option A). Claims our ignorance is semantic, not empirical.
      *   **Supervaluationism:** Rejects bivalence for borderlines *locally*, but saves it *globally* (Supertruth).

  **Minimal Logical Machinery:**
  They only need to understand **Bivalence** (every statement is T or F) and **Truth-Conditionality** (truth depends on how the world is + what words mean). Do not introduce model-theoretic semantics yet. Keep it at the level of truth-values assigned to propositions.

  ***

  ### 2. The Carrying Example: The ML Classifier

  **Verdict:** The "Single Model Threshold" (0.49 → 0.51) is **pedagogically dangerous** and I recommend you tweak it.

  **Why it's risky:**
  1.  **Conflates Precision with Vagueness:** A model threshold is a precise engineering choice. Epistemicism claims the *language itself* has a sharp boundary, not just the tool measuring it.
  2.  **Implies Measurement Error:** CogSci students will think "If we got more data, the confidence score would go to 0 or 1." Vagueness isn't solved by more data.
  3.  **Misses Supervaluationism:** A single model represents *one* precisification. To show Supervaluationism, you need *variation* in models.

  **The Fix: The "Ensemble of Classifiers" Scenario**
  Keep the forestry/trees context, but change the setup:
  *   **The Setup:** You have 1,000 ML classifiers trained to label trees as "tall" vs. "not tall." They are all trained on human labels, but human labelers disagreed on the borderline cases (15m–17m).
  *   **The Result:**
      *   Clear cases (5m, 30m): All 1,000 models agree (Output = 0 or 1).
      *   Borderline cases (16m): Models split. 60% say "Tall," 40% say "Not Tall."
  *   **How it maps:**
      *   **The Ensemble:** Represents the set of *admissible precisifications* (Supervaluationism).
      *   **Supertruth:** A statement is "Supertrue" if *all* models in the ensemble agree (even if individual models vary).
      *   **The Epistemicist Intervention:** Posit a "God's Eye View" dataset. Even if the models disagree, there is a fact of the matter about whether the 16m tree is *actually* tall in English, we just can't access it via these models.

  **Properties this example MUST have:**
  *   **Deterministic Models:** Each individual model must give a sharp Yes/No. (Avoids fuzzy logic confusion).
  *   **Human Training Data:** Emphasize the models are learning *natural language usage*, not measuring physical properties directly.
  *   **No Probabilistic Output:** The models shouldn't output "0.51 probability." They should output "1" or "0". The *variation* across the ensemble creates the vagueness, not the softmax score.

  ***

  ### 3. Misconceptions & Pre-emption

  Here is where they will drift off the rails, and exactly when to intervene.

  **Misconception 1: "Epistemicism is just empirical ignorance."**
  *   **When it arises:** When you claim there is a sharp boundary between tall and not-tall.
  *   **The Student Thought:** "You just mean we don't have a caliper precise enough. If we measured microns, we'd know."
  *   **The Pre-emption:** Hit this hard during the **Dependency Structure** phase. Explicitly state: "Epistemicism is not about measurement error. Even if you knew the exact height of the tree and the exact state of every neuron in every English speaker's brain, the boundary is still hidden. It is a fact about *meaning*, not matter."
  *   **Analogy:** "It's not that we can't find the line on the map; it's that the map has a line we are blind to."

  **Misconception 2: "Supervaluationism is truth relativism/subjectivism."**
  *   **When it arises:** When you explain that truth depends on "which precisification you pick."
  *   **The Student Thought:** "So truth is just opinion? Or context-dependent?"
  *   **The Pre-emption:** When introducing the Ensemble Example, emphasize **Stability**. Supervaluationism isn't "True for Model A, False for Model B." It's "True if True for *all* Models."
  *   **Key Phrase:** "Supervaluationism saves classical logic by saying borderline cases aren't 'relative truths,' they are *truth-valueless* until they become Supertrue. It's not subjective; it's *indeterminate*."

  **Misconception 3: "Supervaluationism rejects Bivalence."**
  *   **When it arises:** When you say borderline cases lack a truth value.
  *   **The Student Thought:** "So you're doing 3-valued logic?"
  *   **The Pre-emption:** Clarify that Supervaluationism rejects Bivalence *only* for borderline sentences, but validates all classical *tautologies* (e.g., "Either the tree is tall or it is not tall" is still Supertrue). This is the hardest pill to swallow, so use the logic board: Show that $P \lor \neg P$ holds even if $P$ is indeterminate.

  ***

  ### 4. The Check Question & The Exclusion

  **The Check Question (End of Workshop)**
  Don't ask them to define the terms. Ask them to diagnose a scenario.

  > "Imagine we discover a neurosemantic scanner that perfectly maps every English speaker's disposition to use the word 'tall.' It reveals that for a 16m tree, 50% of speakers would say 'yes' and 50% would say 'no,' and this split is stable and unresolvable.
  >
  > **Question:** According to the **Epistemicist**, does this scanner settle the truth value of 'The tree is tall'? According to the **Supervaluationist**, does it?"

  *   **Correct Answer:**
      *   **Epistemicist:** No. The scanner measures *usage/dispositions*, but truth is determined by the actual (unknown) extension of the predicate. The fact remains hidden even from perfect usage data.
      *   **Supervaluationist:** Yes (in a way). It confirms the statement is indeterminate (not Supertrue). The scanner has mapped the set of precisifications, confirming there is no overlap.
  *   **Why this works:** It forces them to distinguish between *facts about usage* (which both care about) and *facts about truth* (which they treat differently).

  **The Explicit Exclusion**
  **Do not explain the formal semantics of "Admissibility Constraints."**
  *   **What to skip:** Don't draw the Kripke-style frames. Don't define the relation $R$ between precisifications. Don't explain *what makes* a precisification admissible (e.g., compliance with usage rules).
  *   **Why:** This is technical semantics glue. For a 90-minute workshop, it distracts from the conceptual split. Treat "admissible precisifications" as a black box: "Imagine all the ways we could make the word precise without violating its obvious meaning." If you open the box, you'll spend 40 minutes on boundary conditions and run out of time for the Epistemicist counter-argument.
