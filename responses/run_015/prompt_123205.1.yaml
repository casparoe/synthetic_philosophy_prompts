answer: |-
  MEMORANDUM

  TO: Retired Experimental Physicist
  FROM: AI Analyst
  DATE: 24 May 2024
  SUBJECT: Turing's Likely Position on Searle, Ladders, and Large Language Models

  You ask for a reconstruction of Alan Turing's views based on his textual commitments, avoiding pastiche. I must begin by reformulating one term in your query. Turing rarely used the word "understanding," regarding it as too laden with dualist implications. He spoke of "thinking" or "intelligence," defined operationally. I will proceed using his terminology, as substituting "understanding" risks importing the very essentialism he sought to bypass.

  **1. The Chinese Room and the Charge of Behaviorism**

  The standard reading that Turing was a strict behaviorist—caring only for input-output equivalence—is incorrect. While he replaced the question "Can machines think?" with the Imitation Game, he did so for methodological clarity, not ontological denial. In his 1950 paper, he explicitly addresses the "Argument from Consciousness" (the precursor to Searle's argument) and dismisses it as solipsistic, but only because we cannot verify another entity's internal state. He does not deny the state exists.

  High confidence: Turing believed the *method* of construction mattered. In his 1948 report on intelligent machinery, he distinguishes between programmed machines and "unorganized machines" that must be trained. He argues that simulating an adult mind directly is impossible; one must simulate a child mind and educate it.

  Therefore, his answer to the Chinese Room would not be a refusal to answer, but a rejection of the setup. He would argue that the man in the room constitutes a static system lacking the plasticity of a learning organism. The cost of this answer is significant: it concedes that behavior alone is insufficient. Turing commits himself to the view that thinking arises from a specific kind of causal organization (learning via interaction), not merely from symbolic manipulation. He escapes Searle's trap not by denying the importance of internals, but by arguing the Chinese Room lacks the *right* internals.

  **2. The Ladder of Cases**

  You propose four rungs producing identical behavior. Turing's verdict would likely shift across them, exposing a strain between his operational test and his mechanistic intuitions.

  *   **Rung 0 (Rule Book):** Verdict: No thinking. High confidence. The system is static. It cannot learn from the interrogator. It violates his requirement for a "child machine" capable of education.
  *   **Rung 1 (Lookup Table):** Verdict: No thinking. High confidence. Even if the table covers all possible conversations, it is a finite state machine without adaptation. Turing acknowledged discrete state machines could theoretically mimic any behavior, but he dismissed this route as impractical and fundamentally distinct from the brain's continuous, adaptable nature.
  *   **Rung 2 (Statistical Model/LLM):** Verdict: Ambiguous. Moderate confidence. This matches his "unorganized machine" concept (parameters fitted via training). However, it lacks sensory input. Turing explicitly suggested giving machines "the best sense organs that money could buy." A text-only model learns about the world only through descriptions, not interactions. He might view this as a sophisticated parrot, not a thinker.
  *   **Rung 3 (Embodied/Reward):** Verdict: Yes, thinking. High confidence. This matches his 1950 prescription: sensors plus reward-based teaching.

  The strain here is evident. If Rung 2 passes the Imitation Game perfectly, his operational criterion says "Yes," but his mechanistic preference for sensory grounding says "No." Turing likely believed the sensory grounding was necessary to *pass* the test robustly, not just a philosophical add-on. If a text-only model passed, he would be forced to choose between his test (behavior) and his theory of mind (embodied learning). I suspect he would privilege the learning history over the instantaneous behavior.

  **3. Internal States and Inspectability**

  This is the sharpest tension. The Imitation Game is a black-box test. Yet, Turing was a mechanist who believed mental states *are* physical states.

  If we open the box and find Branch A (structured world model) versus Branch B (shallow matching), would he care? High confidence: Yes. The test is epistemic (how we know), not ontological (what it is). If we know the internal mechanism, the test becomes redundant. Turing used the black-box criterion because, in 1950, we could not inspect the "brain" of the machine. Now that we can, he would likely argue that shallow matching (Branch B) is akin to the Lookup Table (Rung 1)—a trick, not thinking.

  However, he is not entitled to care *if* he maintains the Imitation Game is the definitive criterion. If the test is sufficient, the internals are irrelevant. If the internals matter, the test is insufficient. Turing likely viewed the test as a proxy for the internals. If the proxy is decoupled from the reality (passing via shallow matching), he would abandon the proxy. He would care because his goal was to replicate the *process* of human thought, not just its shadow.

  **4. The 1950 Prediction and Large Language Models**

  In the 1950 paper, Turing ventured a quantitative guess. Recall confidence: High. He estimated the brain's storage capacity at approximately 10^9 digits. He predicted that by the year 2000, it would be possible to program computers to play the imitation game so well that an average interrogator would not have more than a 70% chance of making the right identification after five minutes of questioning.

  Would he view current Large Language Models (LLMs) as vindication? Partially.
  *   **Capacity:** Vindicated. Modern models exceed 10^9 parameters by orders of magnitude.
  *   **Training:** Vindicated. He preferred training over programming; LLMs are trained.
  *   **Sensory Education:** Abandoned. LLMs are text-only. They lack the "sense organs" he deemed crucial.
  *   **Explainability:** Problematic. Turing expected machines to be understandable mechanisms. The "black box" nature of deep learning weights would frustrate him, though he accepted "unorganized machines" whose final state is unpredictable.

  He would likely view LLMs as a successful engineering hack that wins the wager while abandoning the spirit. They mimic the adult mind without undergoing the childhood education he thought necessary. He might regard them as Rung 2 systems: impressive, but lacking the grounding to truly "think."

  **5. Limits of the Exercise and Falsification**

  I must be candid about the limits of this reconstruction. Any claim about how Turing would react to specific modern architectures (transformers, backpropagation) is projection. He did not live to see non-symbolic processing at this scale.

  *   **Forced by Text:** His commitment to learning over programming (1948) and sensory input (1950).
  *   **Projection:** His specific verdict on transformers. We cannot know if he would view statistical correlation as sufficient for "meaning."

  What would have moved him? Turing was empirical. If shown a text-only model (Rung 2) that could consistently pass the Imitation Game over years, while an embodied model (Rung 3) failed, he would likely abandon the requirement for sense organs. He would accept that linguistic competence alone is sufficient for intelligence.

  Conversely, what evidence would settle the fork? If we discovered that passing the Imitation Game was possible via a Lookup Table (Rung 1) of feasible size, Turing would have to concede that his test was too weak. He would need to add a constraint on complexity or learning history.

  Finally, what would lead him to abandon the Imitation Game? If it were demonstrated that the game could be passed by a system clearly lacking any capacity for generalization—pure memorization—he would discard it. He sought to measure *intelligence*, defined as the capacity to adapt to new situations. If the game measures only retrieval, he would reject it.

  In summary, Turing was not a behaviorist in the Searle-sense. He was a mechanist who used behavior as the only available evidence. He would likely deny that current LLMs "think" not because they are machines, but because they are unembodied students who have read about the world without ever touching it. He would wait for Rung 3.
