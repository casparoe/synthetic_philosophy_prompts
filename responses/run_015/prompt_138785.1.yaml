answer: |-
  **Abstract**

  Indirect normative theories determine what an agent has reason to do by referencing an idealized surrogate—what the agent would want or advise if fully informed and coherent. This project argues that such theories are critically under-specified because idealization comprises distinct operations (adding information, correcting coherence, removing bias) that may not commute. If the order of operations changes the verdict, the theory lacks determinate output. Over two years, I will model these operations formally, distinguish between advisory and continuation roles for the surrogate, and evaluate whether indirect normativity collapses, requires normative ordering, or survives only with a reduced scope. This conceptual work clarifies the structural limits of idealization without empirical data.

  **The Question: Indirect Normativity and the Order of Operations**

  Indirect normativity holds that an agent's reasons are not settled by her actual mental states, but by the verdict of an idealized counterpart. This counterpart is typically generated by applying a set of idealizing operations to the agent: adding information, correcting factual errors, imposing coherence on beliefs and ends, removing motivated reasoning, and extending deliberation time. The central question of this project is determinate and structural: *Does the order in which these idealizing operations are applied affect the normative verdict issued by the surrogate?*

  If the operations do not commute—if adding information before correcting coherence yields a different result than correcting coherence before adding information—then indirect normativity is incomplete. It cannot tell an agent what to do until it specifies a sequence. To make this tractable, I restrict the scope to procedural idealization within decision-theoretic frameworks. I set aside substantive moral ideals (e.g., becoming virtuous) to focus strictly on the structural transformation of the agent's informational and psychological state. The goal is not to argue against idealization per se, but to determine whether the standard modeling of the idealized surrogate is mathematically and conceptually coherent.

  **The Gap: The Myth of the Limit Point**

  Existing positions in metaethics and rationality theory leave this question open because they treat idealization as a scalar quantity rather than a vector of operations. Full Information Accounts and Ideal Advisor theories often speak of "moving closer" to an ideal limit, implying that all paths of improvement converge on a single point. They treat the surrogate as a single thing arrived at by "turning up the dial" on rationality. This assumes commutativity without argument.

  Two obvious replies fail to settle the issue. First, one might argue for a canonical order (e.g., information always precedes coherence). However, without a normative justification for this sequence, the choice is arbitrary; with such justification, the theory ceases to be purely indirect, as the ordering principle itself carries normative weight. Second, one might argue that reasonable idealizations converge regardless of order. This is implausible given the complexity of psychological states; small changes in initial conditions (path dependence) often yield divergent outcomes in deliberation systems. The literature has not taken this non-commutativity seriously because it lacks a formal taxonomy of the operations involved. Consequently, indirect normativity risks providing no verdict at all in hard cases.

  **Illustrative Cases and Structural Analysis**

  To demonstrate the stakes, consider two toy cases where ordering plausibly matters.

  *Case 1: The Reluctant Smoker.* An agent smokes due to addiction (bias) but values health (end). Operation A removes the bias (addiction); Operation B adds information (smoking causes cancer).
  *   *Order A then B:* The bias is removed first. The agent now values health clearly. She receives information that smoking harms health. Verdict: Quit.
  *   *Order B then A:* She receives information first. However, the active bias distorts the processing of this information (e.g., "It won't happen to me"). The bias is then removed, but the informational update was corrupted. Verdict: Ambiguous or Continue.

  *Case 2: The Impulsive Donor.* An agent feels immediate sympathy (emotion) to donate everything to charity, conflicting with long-term survival (coherence). Operation C imposes coherence; Operation D extends reasoning time.
  *   *Order C then D:* Coherence forces alignment of ends first. Survival is weighted. Extended time confirms this. Verdict: Donate moderately.
  *   *Order D then C:* Extended time allows the emotional impulse to fade naturally before coherence is imposed. Verdict: Donate moderately. (Here they may commute, but not necessarily if emotion solidifies over time).

  The following matrix summarizes the plausibility of commutativity across key operations:

  | Operation Pair | Plausibly Commute? | Reason for Non-Commutativity |
  | :--- | :--- | :--- |
  | **Info + Bias Removal** | No | Bias filters information uptake. |
  | **Coherence + Time** | Maybe | Depends if ends stabilize or drift over time. |
  | **Info + Coherence** | No | New info can disrupt existing coherence requirements. |
  | **Time + Bias Removal** | No | Time may entrench bias or allow it to fade. |

  This structural ambiguity interacts with a second distinction: the *Advisory/Continuation Ambiguity*. Is the surrogate an external advisor (opaque deference permitted) or the agent's own deliberation extended (transparency required)? If Continuation, order matters more because the agent must be able to follow the path. If Advisory, the output matters most, but the construction of the advisor still requires a defined sequence to be unique.

  **Methodology: Conceptual Engineering and Formal Modeling**

  This project proceeds via armchair conceptual analysis supported by formal modeling. Since the problem is structural—concerning the logical relations between operations—empirical data on how humans actually deliberate is secondary. We are asking what the theory *requires*, not how agents behave. This approach is superior to intuitive case-work, which is unreliable regarding complex counterfactuals, and superior to abandoning idealization, which throws out a useful tool rather than fixing it.

  The work is sequenced into three work packages (WPs) over six terms:

  *   **WP1 (Terms 1-2): Taxonomy and Formalization.** I will define the distinct idealizing operations formally using dynamic epistemic logic. The deliverable is a paper mapping the logical space of idealization and establishing the non-commutativity thesis.
  *   **WP2 (Terms 3-4): The Advisory/Continuation Distinction.** I will analyze how the role of the surrogate constrains the ordering problem. Does transparency require a specific path? The deliverable is a paper arguing that the Advisory/Continuation ambiguity resolves some ordering disputes but exacerbates others.
  *   **WP3 (Terms 5-6): Evaluating the Verdicts.** I will test the three possible conclusions (see below) against the models developed in WP1 and WP2. The deliverable is a monograph draft synthesizing the results into a unified theory of idealized surrogates.

  **Possible Conclusions and Assessment**

  The project will argue for one of three conclusions:

  1.  **The Collapse Verdict:** Indirect normativity is revealed as a family of theories with no determinate output. If order matters and no order is privileged, the theory fails as a reductive account. This is decided if non-commutativity is proven widespread and no normative principle can select an order.
  2.  **The Principled-Ordering Verdict:** Some sequencing is normatively privileged (e.g., information must precede coherence). This saves the theory but makes it less indirect; the ordering principle itself becomes a direct normative truth. This is decided if a unique sequence can be derived from the concept of rationality itself.
  3.  **The Robust-Core Verdict:** Only order-invariant verdicts bind. This preserves a central domain of application (where operations do commute) at the cost of leaving many ordinary cases indeterminate. This is decided if a significant subset of operations proves commutative.

  My assessment is that the **Robust-Core Verdict** is most likely. It is improbable that all operations commute (ruling out the status quo), but equally improbable that none do (ruling out total collapse). The theory survives but shrinks, applying only where the idealization path is stable.

  **Risks and Failure Conditions**

  The primary risk is scope creep. The logical space of idealizing operations is vast. If the formal modeling in WP1 becomes too complex, the project could stall. To mitigate this, I will restrict the formal models to binary operations initially. A second risk is that this turns out to be a restatement of familiar indeterminacy worries about full-information accounts. To avoid this, I must emphasize the *structural* nature of the argument (non-commutativity of operations) rather than the epistemic nature (we can't know the future).

  The project would fail if it merely asserts that order matters without demonstrating *how* it matters via the toy cases and matrix. The smallest result that would still make the project worth funding is the successful demonstration of the non-commutativity thesis (WP1) and the distinction between Advisory and Continuation roles. Even if no final verdict is reached on which of the three conclusions is correct, providing the formal toolkit for others to evaluate idealization procedures would be a significant contribution to metaethics and decision theory. Conversely, if I find that all plausible operations do commute, the project succeeds by vindicating the standard view, though this is unlikely given the path-dependence of reasoning. The high-risk nature lies in the possibility of the Collapse Verdict, which would undermine a major family of normative theories, but this is precisely the kind of conceptual clarification this fellowship is designed to support.
