answer: |-
  The aggregating practice strictly presupposes cardinality (pain magnitudes are measurable intervals) and interpersonal comparability (units are equivalent across persons). It merely fits well with full commensurability of pain and money; dollar pricing is often a pragmatic proxy for opportunity cost rather than intrinsic value equivalence.

  Lexical-threshold negative utilitarianism (LTNU) is compatible. Proponents can run rankings by summing sub-threshold pains, claiming no menu option crosses the lexical limit. Aggregation remains legitimate among mild sufferings.

  The bedside/budget split is reconcilable. Bedside cases typically involve supra-threshold suffering, triggering lexical priority over cost, whereas budgetary trade-offs concern sub-threshold mild pains versus convenience. Alternatively, bedside care follows a deontic side-constraint (rule of rescue), while budgeting follows aggregative rules. An error theory is also possible: bedside intuition correctly identifies lexical violations, while budgetary practice erroneously ignores them.

  Adopting LTNU shifts funding: severe, threshold-crossing conditions (e.g., terminal pain) get funded first; widespread mild ailments lose out when competing. Programmes trading severe pain for convenience get defunded. Indeterminacy persists regarding the threshold's height and the unit of aggregation (moment vs. episode vs. life). Without fixed parameters, prioritization remains unstable between chronic moderate suffering and acute severe spikes.

  Regarding pain scales, the threshold must track *intensity* (sensory magnitude), not distress. Distress is modifiable by coping and varies by resilience; intensity represents the intrinsic negative value LTNU targets. A brief moment of extreme intensity outweighs prolonged mild distress. Policy must prioritize reducing peak sensory suffering over managing emotional reaction, ensuring the lexical veto applies to the raw disvalue of suffering itself. This prevents adapting patients from being deprioritized simply because they cope well with severe nociception. If the threshold tracked distress, resilient patients suffering severe physical pain might be ignored, violating the negative utilitarian aim to minimize objective suffering. Thus, clinical metrics must isolate nociceptive intensity from psychological reporting to apply the lexical veto correctly.
