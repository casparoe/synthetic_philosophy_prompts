          *   Address the agency of enslaved people within a framework that often treats them as objects.
          *   Identify where the domination thesis is silent (internal fractures, incomplete reversal).
          *   Run analysis in both directions (theory illuminating episode, episode testing theory).
          *   **Ending Format:**
              *   Line 1: "Verdict: [supports/complicates/undermines]"
              *   Line 2: One-sentence summary of overall judgment.

  2.  **Deconstruct the Critical Thesis (Domination Thesis):**
      *   Core claim: Enlightenment universalism = ideological cover for instrumental domination.
      *   Mechanism: Rights-language rationalizes control; "progress" is selective based on power interests.
      *   Implication: Moral language is epiphenomenal (secondary to economic/political interests).

  3.  **Analyze the Historical Episode (1794 vs. 1802):**
      *   **1794 Abolition:**
          *   *Context:* Saint-Domingue rebellion (1791 onwards). Spanish/British intervention. Sonthonax (Commissioner) abolishes slavery locally (1793) to gain allies. Convention ratifies universally (1794).
          *   *Actors:* Convention delegates (Jacobins mostly), Colonial Commissioners, Insurgent Leaders (Toussaint Louverture, etc.).
          *   *Options:* Convention could have rejected abolition (lost colony to Britain/Spain) or accepted it (gained allies, upheld ideology). Insurgents could have sided with Spain/Britain (who promised freedom loosely) or France (if freedom granted).
          *   *Thesis Fit:* Looks like calculation (save the colony) masked as universal rights.
      *   **1802 Restoration:**
          *   *Context:* Napoleon consolidates power. Peace with Britain temporarily. Desire to restore colonial economy.
          *   *Actors:* Napoleon, Leclerc (expedition leader), Toussaint/Dessalines.
          *   *Options:* Napoleon could have maintained abolition (upheld Revolution) or restored slavery (economic recovery, appease planters). Insurgents could have submitted or fought.
          *   *Thesis Fit:* Looks like economic interest trumping rights, confirming the "selective progress" claim.

  4.  **Evaluate the Agency of the Enslaved:**
      *   Domination thesis often treats colonized subjects as objects/passive recipients of "gifts" from Enlightenment powers.
      *   Reality: Enslaved people *forced* the issue through insurrection. They made abolition a necessity for France, not just a benevolent gift.
      *   Tension: If rights were won by force *against* the state, does that invalidate the idea that the state granted them as ideological cover? Or does it show the state co-opting the victory?

  5.  **Identify Silence/Fractures in the Thesis:**
      *   *Internal Fractures:* The Convention wasn't a monolith. Abolitionists (Société des Amis des Noirs) existed before the rebellion. Ideology wasn't *just* cover; it had genuine proponents.
      *   *Incomplete Reversal:* Slavery wasn't restored everywhere immediately (e.g., some areas resisted).
      *   *Universalist Breakthrough:* Once the language of universal rights is unleashed, it cannot be fully retracted without cost. The 1794 decree created a precedent that made 1802 illegitimate in the eyes of the colonists, leading to Haitian independence. The language took on a life of its own.

  6.  **Synthesize the Analysis (Drafting the Content):**
      *   *Introduction:* Frame the tension between universalism and instrumentalism.
      *   *Actors & Options:*
          *   Convention: Ratify Sonthonax's pragmatic move as universal law (ideological cover + necessity) vs. reject (lose colony).
          *   Napoleon: Restore order/economy (interest) vs. uphold Revolution (ideology). Chose interest.
          *   Insurgents: Align with France (if free) vs. others. They forced the hand.
      *   *Testing the Thesis:*
          *   *Support:* 1802 shows rights were contingent on economics. 1794 was driven by military necessity (saving the colony from Britain/Spain).
          *   *Complicate/Undermine:* The enslaved weren't passive objects; they were agents who *used* Enlightenment language against the masters. The language itself became a weapon that outpaced the intent (Haiti's independence). The existence of genuine abolitionists suggests ideology wasn't *purely* cover.
      *   *Conclusion:* The episode shows the dialectic between interest and ideology. It's not just cover; it's a tool that can be seized.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   Avoid saying "It complicates" too vaguely. Be specific. The domination thesis explains the *reversal* well but fails to explain the *persistence* of the idea and the agency of the oppressed who wielded that idea.
      *   Ensure I don't drift into diplomatic/ecological history (keep it conceptual/political).
      *   Check the constraint: "Run in both directions."
      *   Check the constraint: "Identify relevant actors... and specify what options each actually faced."
      *   Check the constraint: "Where is the domination thesis silent?"

  8.  **Drafting the Response (Mental or Scratchpad):**
      *   *Actors:* Convention (Jacobins). Option: Legitimize insurrection via rights or crush it. Chose legitimation to save empire.
      *   *Napoleon:* Option: Maintain revolutionary principle or restore plantation economy. Chose economy.
      *   *Insurgents:* Option: Fight for freedom using French rhetoric or reject French authority entirely. Used rhetoric to demand actualization.
      *   *Thesis Test:* 1802 supports the thesis (economics trump rights). 1794 is ambiguous (was it moral or pragmatic?). But the *outcome* (Haiti) undermines the thesis because the "cover" became real power for the subaltern.
      *   *Silence:* The thesis ignores that universalism creates a "boomerang effect" (Mbembe/Magnusson). Once you claim universal rights, you can't easily deny them without exposing the lie, which triggers rebellion.
      *   *Verdict:* Complicates. (Because it's not *just* cover; it becomes a material force).

  9.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical, not just historical narrative.
      *   Check the final formatting requirements strictly.

