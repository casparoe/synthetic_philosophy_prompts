      *Refining the Verdict:* Does it *undermine*? If the theory says "never more than ideological cover," and the episode shows the cover becoming real freedom through agency, does that undermine the "never more than" claim? Yes. But does it fully undermine it? The 1802 reversal strongly supports the "instrumental domination" aspect. So "Complicates" is safer and more precise. It shows the theory is partially right but insufficient. Actually, looking at the prompt's phrasing ("testing whether the theory can accommodate a real universalist breakthrough without reducing it to an epiphenomenon"), if the breakthrough happened *despite* the power structure, it suggests the theory is too reductive. "Complicates" fits best because the theory explains the *structure* but misses the *agency/outcome*.

