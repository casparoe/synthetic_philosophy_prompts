answer: |-
  The critical thesis posits that Enlightenment universalism functions primarily as a superstructure rationalizing material domination, where rights are granted only when they stabilize power and revoked when they threaten profit. To test this, we must map the conceptual terrain of the 1794 abolition and 1802 restoration not as a moral narrative, but as a conflict between instrumental rationality and the uncontrollable logic of universal claims.

  **Actors and Options**
  *   **The National Convention (1794):** Facing the loss of Saint-Domingue to British invasion and Spanish-backed insurgencies, the Jacobin delegates faced a binary constraint: ratify the local emancipation enacted by Commissioner Sonthonax to secure the allegiance of the Black armies, or reject it and likely lose the colony's economic value entirely. Their option was not between "morality" and "interest," but between "universalist ideology aligned with military necessity" versus "imperial collapse."
  *   **Napoleon's Administration (1802):** With the Treaty of Amiens temporarily securing peace, Napoleon faced a choice between consolidating the Revolution's ideological gains (maintaining abolition) or restoring the pre-revolutionary colonial pact (reinstating slavery) to fund the state and appease the planter class. He chose the latter, viewing the colony as an asset to be managed rather than a polity of citizens.
  *   **The Insurgent Leaders (Toussaint Louverture, etc.):** Having seized de facto freedom through insurrection, they faced the option of accepting French authority conditional on liberty, or rejecting French sovereignty entirely. They wielded Enlightenment language not as passive recipients but as leverage, demanding the metropole actualize its own professed principles.

  **1794: Calculation Masked as Principle**
  Through the lens of the domination thesis, the 1794 decree appears as the perfect exemplar of rights-language serving instrumental control. The Convention did not abolish slavery out of pure benevolence; they ratified a *fait accompli* driven by military desperation. The universalism was performative: it draped the pragmatic necessity of recruiting Black soldiers in the moral authority of the Rights of Man. Here, the thesis holds: progress was granted only when it aligned with the interest of preserving the empire against foreign rivals. The "universal" was selectively applied to save the particular (the French state).

  **1802: The Revelation of Contingency**
  Napoleon's reversal starkly supports the domination thesis. Once the external military threat receded, the ideological cover was discarded to restore the economic engine of sugar production. This confirms the thesis's claim that "progress" is contingent on power interests. When the cost of universal rights (lost labor revenue) outweighed the benefit (colonial loyalty), the machinery of domination stripped away the language of reason to reveal the logic of exploitation.

  **The Blind Spot: Agency and the Boomerang Effect**
  However, the episode tests the theory's limits regarding the agency of the enslaved. The domination thesis tends to treat colonized subjects as objects of governance—passive recipients of either rights or repression. In Saint-Domingue, the enslaved were active agents who seized the universalist language and weaponized it against the metropole. They forced the Convention's hand, making abolition a condition of their alliance rather than a gift from above. This dynamic exposes a silence in the domination thesis: it underestimates the material power of ideology once released. Universalism was not merely a static cover; it was a volatile tool that, once invoked, could be turned against the dominators. The theory struggles to account for moments where the "cover" becomes the primary weapon of the oppressed, generating outcomes (like Haitian independence) that defy instrumental calculation.

  **Internal Fractures and Limits of Reversal**
  Furthermore, the domination thesis often treats the Enlightenment state as a monolith. It is silent on the internal fractures within the Convention, where genuine abolitionists (like the Société des Amis des Noirs) argued for emancipation prior to the insurrection, suggesting ideology was not *purely* epiphenomenal to economics. Additionally, the fact that abolition was never fully successfully reversed in Saint-Domingue (leading to independence rather than re-enslavement) indicates a limit to domination. The machinery broke because the ideological promise had created a political subjectivity that could no longer be governed as property. The theory explains the *intent* of 1802 well, but fails to explain its *failure*.

  **Theory vs. Episode**
  Running the analysis in both directions: the theory illuminates the cynical timing of the 1794 decree and the economic motivation of 1802. Conversely, the episode tests the theory by demonstrating that universalist language possesses a generative capacity independent of the issuer's intent. If universalism were *never more than* cover, it should not have enabled the enslaved to construct a sovereign nation against the will of the imperial power. The episode suggests that while rights-language may originate in instrumental calculation, it can escape its masters to become a genuine source of moral and political transformation.

  Verdict: complicates
  The episode confirms that Enlightenment rights were often instrumentally deployed by power, but demonstrates that universalist language could be seized by the oppressed to achieve breakthroughs that exceed mere ideological cover.
