  **(d) Can a simplicity prior (like Solomonoff) be justified without assuming induction?**
  *   **Number:** 0.20
  *   **Reasoning:** Choosing a simplicity prior is itself an inductive bet that the world is computable/compressible; you cannot justify it without circularity, so NFL doesn't solve the circularity, it just locates it.

  **(e) Does any of this change what we should do (pragmatics)?**
  *   **Number:** 0.10
  *   **Reasoning:** Hume already concluded we must act on custom/habit; NFL adds no new pragmatic paralysis, so it offers no new practical reason to doubt.

