  You suspect it's not an empirical question. **You are right.**
  This debate cannot be settled by data, because any data you bring to the table already assumes induction is valid to interpret.
  To settle this, you and your friend would need to agree on **what counts as "justification."**
  *   **Your friend** likely thinks "justification" means "deductive proof or formal bound." Since NFL shows no formal bound exists without priors, he thinks induction is busted.
