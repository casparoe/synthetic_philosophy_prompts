  I treat these as independent attenuators. If any of these were strongly "Yes" (high number), P would rise. Since the average credence that these factors provide *new* leverage against induction is roughly $(0.2+0.3+0.5+0.2+0.1)/5 = 0.26$, I adjust slightly upward to **0.28** to account for the fact that formal proofs do have some psychological weight even if philosophically redundant.

