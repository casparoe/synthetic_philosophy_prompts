          3.  *Institutional Embedding:* Governance, oversight, external correction mechanisms.
      *   **Requirements:** Weigh separability (does solving one solve the others?), reach a definite conclusion (no non-committal ending), avoid specific academic citations/names.

  2.  **Deconstruct the Three Parts:**
      *   *Behavioural:* Surface level. "Do what I say, don't hurt me." RLHF (Reinforcement Learning from Human Feedback) fits here. It's about input-output mapping.
      *   *Representational:* Deep level. "Do you understand 'hurt' the way I do?" It's about semantics, internal world models, and stability. If the AI gets smarter, does its definition of 'harm' drift?
