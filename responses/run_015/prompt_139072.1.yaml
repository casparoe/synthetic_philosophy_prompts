answer: |-
  Here is the **Folk-Psych Stress Test (FPST)**. It is designed to be run by a writer in under ten minutes. It does not solve the metaphysics; it isolates the *utility* of the attribution.

  ### The Procedure: Folk-Psych Stress Test (FPST)

  **Input:** A single finding statement containing a belief/desire attribution (e.g., "The user *thought* X," "The user *wanted* Y").

  **Step 1: The Redescription Check (2 mins)**
  Remove the mental state verb. Replace it with a description of the action and the environmental trigger.
  *   *Original:* "User clicked because she **believed** it would save."
  *   *Redescribed:* "User clicked the 'Save' icon upon completion of entry."
  *   **Question:** Does the Redescribed version lose the ability to explain *why* the action stopped or started?
      *   **No:** The attribution is decorative. **→ STOP. DROP THE ATTRIBUTION.** (Use the Director's language: affordance, trigger, response).
      *   **Yes:** The attribution captures an expectation or goal not visible in the click itself. **→ Proceed to Step 2.**

  **Step 2: The Counterfactual Check (3 mins)**
  Imagine a small change to the interface or context. Does the belief attribution predict the outcome better than the behavioral description?
  *   *Scenario:* We change the icon from a Floppy Disk to a Cloud.
  *   *Behavioral Prediction:* User sees new shape, might not click.
  *   *Belief Prediction:* User *believes* Cloud = Save, clicks. OR User *believes* Cloud = Upload, hesitates.
  *   **Question:** Does the belief attribution allow us to anticipate a failure or success that the behavioral description misses?
      *   **No:** It's a post-hoc story. **→ STOP. DROP THE ATTRIBUTION.**
      *   **Yes:** It generalizes to the new setting. **→ Proceed to Step 3.**

  **Step 3: The Conflict Check (2 mins)**
  Is there a mismatch between what the user *did* and what the user *said* (or between two users who acted identically)?
  *   **Question:** Is the attribution necessary to resolve a contradiction? (e.g., They said X but did Y; or User A and User B both clicked, but for opposite reasons).
      *   **No:** Behavior and speech align, or the difference doesn't matter for the product. **→ STOP. TAG AS PLACEHOLDER.** (Write: "User acted as if X," note that mechanism is unknown).
      *   **Yes:** The attribution is the only thing explaining the friction. **→ Proceed to Step 4.**

  **Step 4: The Audience & Stakes Check (3 mins)**
  Who reads this, and what is the risk of being wrong?
  *   **Audience:**
      *   *Engineering/Design:* They need to know the *mechanism* to build the fix. If the belief is the bug (e.g., wrong mental model), keep it. If the belief is irrelevant to the code path, drop it.
      *   *Executive/Stakeholder:* They need a narrative to allocate resources. Belief attributions are often required here ("Users feel betrayed").
  *   **Target of Attribution:**
      *   *User Belief:* "The user thinks..." (Factual claim about human cognition).
      *   *Company Belief:* "The business assumes..." (Factual claim about internal strategy).
      *   **Warning:** Do not conflate these. If the report says "Users believe [Feature] is secure," verify you have evidence of *user* cognition, not *company* marketing.
  *   **Decision:**
      *   If the stakes are high (safety, money, legal) and the mechanism is unknown: **TAG AS PLACEHOLDER.**
      *   If the stakes are standard UX and the prediction holds: **KEEP PLAIN.**

  ---

  ### Application to Your Findings

  #### Finding 1: The Checkout Button
  *Data:* Clicks green button <400ms. Post-task interview: "I knew it applied the discount." Reality: Discount only applies Tuesdays.
  *Draft Attribution:* "Users **believe** the green button guarantees the discount."

  1.  **Redescription:** "Users click green button upon seeing discount field."
      *   *Loss:* Yes. The redescription misses the *expectation of outcome*. If we remove the discount field but keep the button, behavioral prediction fails. Belief prediction holds (they will click and feel cheated).
  2.  **Counterfactual:** We make the button gray.
      *   *Prediction:* Behavioral (click rate drops). Belief (users hesitate because gray signals 'inactive'). The belief attribution helps design the fix (align signifier with expectation).
  3.  **Conflict:** Yes. Action (click) vs. Reality (no discount). The belief explains the *error*.
  4.  **Audience/Stakes:** Engineering needs to know the mental model is wrong. Execs need to know users feel misled.
      *   *Target:* User Belief.

  **Verdict: KEEP PLAIN.**
  *Reasoning:* The belief *is* the bug. The mismatch between the user's mental model (Button = Discount) and the system logic (Button = Submit, Discount = Tuesday) is the specific finding. Rewriting this as "Reinforcement history suggests..." obscures the specific expectation violation that causes support tickets.
  *Writer Note:* Ensure you distinguish "User believed" from "System promised." Do not write "The button misled users" (Company attribution) unless you have evidence of intent. Write "Users operated under the assumption..."

  #### Finding 2: Power Users & The Dashboard
  *Data:* Power users use Old Dashboard. Interviews: "New one is better." They cannot explain why they stay on Old.
  *Draft Attribution:* "Users **prefer** the Old Dashboard" OR "Users **believe** the Old Dashboard is more efficient."

  1.  **Redescription:** "Users navigate to Old Dashboard URL despite New Dashboard availability."
      *   *Loss:* Minimal. The behavior is consistent. The speech ("New is better") contradicts the behavior.
  2.  **Counterfactual:** We remove Old Dashboard.
      *   *Prediction:* Behavioral (Forced migration). Belief (If we say "They prefer Old," we predict rage/churn. If we say "Habit," we predict friction then acceptance). The belief attribution ("They prefer") is actually risky here because they *denied* it.
  3.  **Conflict:** High. Speech ("New is better") vs. Action (Use Old).
      *   *Crucial Fail:* A belief attribution like "They believe Old is better" is **factually false** based on their testimony. A belief attribution like "They believe switching costs are too high" is speculative.
  4.  **Audience/Stakes:** Product needs to know if they should force migration or fix the New Dashboard.
      *   *Target:* User Belief.

  **Verdict: TAG AS PLACEHOLDER (Shift to Mechanism).**
  *Reasoning:* This is the finding you didn't want to hear. The Folk Psychology explanation *fails* the Stress Test. The users explicitly deny the belief that would explain their action. Attributing a belief here is gaslighting the data to make it fit a "rational actor" model.
  *Action:* Do not write "Users believe the old one is safer." Write: "Users exhibit high friction switching to New Dashboard despite positive verbal evaluation. Mechanism appears to be habitual reinforcement (muscle memory) rather than explicit preference. Recommendation: Treat as migration friction, not feature deficit."
  *Why this hurts:* It validates your Director's point. In this specific case, "belief" is the wrong tool. It covers up the actual problem (habit/cost) with a polite fiction ("they prefer it").

  ---

  ### Limitations of the Procedure

  You asked for plain talk on what this procedure cannot do.

  **1. It cannot validate truth, only utility.**
  The FPST tells you if the belief attribution *works* for prediction and design. It does not tell you if the user *actually has* a belief in the philosophical sense. If the attribution passes the test, it is "true enough" for the report, even if the Director is right that neurons don't quantify over "beliefs."

  **2. It cannot bridge the "Ten-Year Gap."**
  You asked about a case where the attribution is load-bearing today but you expect it to be cashed out mechanistically in ten years (e.g., "The user is anxious about privacy" vs. "The user's amygdala is triggering avoidance").
  *   **The Procedure's Verdict:** **KEEP PLAIN.**
  *   **The Limitation:** The procedure has no mechanism to penalize an attribution simply because a better one *might* exist in the future. It operates on current predictive power. If "Anxiety" predicts churn better than "Amygdala activation" today, the procedure forces you to keep "Anxiety."
  *   **The Risk:** This creates technical debt. You are signing off on "folk" explanations that may need refactoring later when the neuroscience matures. The procedure accepts this debt as the cost of shipping product today. It offers no guidance on *how* to prepare the data for that future cash-out.

  **3. It cannot resolve the "Company Belief" trap.**
  The procedure flags the distinction between User Belief and Company Belief, but it cannot stop stakeholders from reading "Users believe X" as "We should believe X." If an Exec reads "Users believe this feature is unsafe," they may hear "This feature is unsafe." The procedure marks the spot, but it cannot control the interpretation of power.

  **Summary for your Team:**
  Use the FPST to filter out "just-so stories" (Finding 2) where belief talk hides the real mechanism. Use it to defend belief talk (Finding 1) where the user's mental model is the actual object of design. This allows you to satisfy the Director's demand for rigor without abandoning the language your engineers and executives need to function.
