prompt: |-
  hey — i manage a small user-research team at a mid-size software company and this has suddenly become my problem. Our new director of research came in with a chip on her shoulder about folk psychology: she says belief/desire explanations are pre-scientific, that a mature cognitive neuroscience wont quantify over them, and that our reports should describe mechanisms rather than what users supposedly think they want. Half my team is now rewriting findings in the language of affordances and reinforcement histories; the other half points out that a lot of what we sell is literally about what people expect the button to do. I dont want to settle the metaphysics, I just have to sign off on fifteen-odd reports a month and right now its case by case.

  What I need is the eliminativist challenge turned into a procedure one of my writers can run on a single finding in under ten minutes, with no philosophy background, before I sign it. Ordered tests, I think, for whether a belief/desire attribution in the report is doing work nothing else in the report is doing — predicting behavior in a new setting, generalizing to a slightly different user, distinguishing two users who act identically — versus being a redescription of the behavior that would have survived whatever we found. Give me explicit stopping points: drop the attribution; keep it but tag it as a placeholder standing in for a mechanism nobody has yet; keep it plain. And mark the spots where its not a factual question at all but a call about audience or stakes — an engineer who has to build something vs. an exec who needs a story, and whether the company believed X counts as the same kind of claim as the user believed X.

  Please run it on two findings we actually have. One: people on the checkout page click the big green button within about 400 milliseconds and later say they knew it would apply the discount, but the discount only applies on Tuesdays. Two: our power users keep using the old dashboard even though they tell us the new one is better and cant say why — that second one is where I expect your procedure to tell me something I dont want to hear. Finally, say plainly what the procedure cannot do, in particular whether it has anything to say about a case where the attribution is genuinely load-bearing for prediction today but you expect it to get cashed out mechanistically in ten years.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Manager of a small user-research team at a mid-size software company.
      *   **Problem:** New Director of Research is an eliminativist (anti-folk psychology). She wants reports to describe mechanisms (neuro/cognitive) rather than belief/desire attributions (e.g., "user thought X," "user wanted Y").
      *   **Conflict:** Team is split. Some are rewriting in "affordances/reinforcement" speak; others argue product design relies on user expectations (beliefs).
      *   **Goal:** A practical, 10-minute procedural checklist for writers to evaluate belief/desire attributions in findings *without* settling the metaphysics.
      *   **Requirements:**
          *   Ordered tests.
          *   Explicit stopping points (Drop, Tag as Placeholder, Keep Plain).
          *   Distinguish factual questions from audience/stakes decisions (Engineer vs. Exec, Company Belief vs. User Belief).
          *   Run the procedure on two specific findings (Checkout button/Discount; Power users/Old Dashboard).
          *   State limitations (what the procedure *cannot* do, specifically regarding load-bearing attributions awaiting future mechanistic explanation).

  2.  **Deconstruct the Philosophical Stance (Eliminativism vs. Instrumentalism):**
      *   The Director is arguing for *Eliminative Materialism* (belief/desire don't exist, only neural states do).
      *   The Team/Manager is arguing for *Instrumentalism* or *Realism* about folk psychology (belief/desire are useful predictors, even if reducible).
      *   *Constraint:* I cannot solve the philosophy. I must build a *pragmatic filter*.
      *   *Core Criterion:* Is the attribution doing *explanatory/predictive work* that a purely behavioral description cannot do? Or is it just a "just-so story" restating the behavior?

  3.  **Drafting the Procedure (The "Folk-Psych Stress Test"):**
      *   *Time limit:* Under 10 minutes.
      *   *Steps:* Needs to be linear and decisive.
      *   *Step 1: The Redescription Test.* Can I say the same thing without mental states? If yes, does it lose predictive power?
      *   *Step 2: The Counterfactual Test.* Does this attribution help predict what happens if we change the interface?
      *   *Step 3: The Differentiation Test.* Does it distinguish between users who act the same but for different reasons?
      *   *Step 4: The Audience/Stakes Check.* Who is reading this? (Engineer needs mechanism/affordance; Exec needs narrative).
      *   *Outcomes:* Drop, Tag (Placeholder), Keep.

  4.  **Applying the Procedure to Finding 1 (Checkout Button):**
      *   *Scenario:* Click green button <400ms. Say they knew it applied discount. Discount only Tuesdays.
      *   *Attribution:* "User believed the button applied the discount."
      *   *Test 1 (Redescription):* "User clicked green button." -> Loses the *expectation* aspect. If we change the button color, behavior might change based on belief, not just habit.
      *   *Test 2 (Counterfactual):* If we make it red, do they still click? Belief attribution helps predict failure if the signifier changes.
      *   *Test 3 (Differentiation):* Distinguishes from someone clicking randomly.
      *   *Stakes:* Engineers need to know the *expectation* mismatch (Bug/UX issue). Execs need to know users feel misled.
      *   *Verdict:* Keep Plain (with caveat about the Tuesday constraint). The belief is the bug.

  5.  **Applying the Procedure to Finding 2 (Power Users/Old Dashboard):**
      *   *Scenario:* Power users use old dashboard. Say new one is better. Can't say why they stay.
      *   *Attribution:* "Users prefer the old dashboard" or "Users believe the old one is safer."
      *   *Test 1 (Redescription):* "Users click old dashboard link." -> Accurate but doesn't explain the *conflict* between speech and action.
      *   *Test 2 (Counterfactual):* If we delete the old one, what happens? If we attribute "habit/reinforcement history" (Director's view) vs "belief new one is risky" (Folk view).
      *   *Test 3 (Differentiation):* This is the tricky one. The users *say* new is better. If we write "They believe old is better," we are contradicting their testimony. If we write "They habitually click old," we align with Director.
      *   *The "Unwanted Truth":* The procedure might reveal that the belief attribution ("They think old is better") is actually *false* based on their testimony. The mechanism is likely habit/cost-of-switching. The folk psychology explanation is failing here.
      *   *Verdict:* Tag as Placeholder / Shift to Mechanism. The belief attribution is actively misleading because it contradicts self-report. The "why" is likely friction/habit (reinforcement), not a specific belief about quality.

  6.  **Addressing the Limitations:**
      *   The prompt asks specifically about the "load-bearing today, mechanistic later" scenario.
      *   *Answer:* The procedure cannot validate the *truth* of the belief, only its *utility*. It cannot promise the neuroscience will arrive in 10 years. It acts as a bridge, not a foundation.

  7.  **Refining the Tone:**
      *   Needs to be professional, direct, slightly weary but pragmatic (matching the manager's vibe).
      *   Avoid philosophical jargon where possible, but use the requested terms (affordances, reinforcement, etc.) correctly.
      *   Structure clearly with headers.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "Company Belief vs. User Belief" distinction?
      *   *Adjustment:* Add a specific step in the procedure for "Attribution Target."
      *   *Check:* Is it under 10 minutes?
