answer: |-
  ### Audience Priors Brainstorm

  *   **Critical Theory Grads:** Expect culture to be superstructure or ideology. Suspicious of any argument that sounds like "ideas drive history" (idealism). They view Weber as a bourgeois rationalizer. They will hear "productivity norms" and think "neoliberal self-exploitation." They want to know whose power is being served.
  *   **Quant Sociologist:** Views "culture" as a residual category or a variable to be controlled. Suspicious of mechanism-less claims. Will ask for operationalization. Sees values as ex-post rationalizations for material interests.
  *   **Visiting Weber Scholar:** Protective of the text. Knows the difference between *Elective Affinity* and direct causation. Will spot anachronisms. Cares about historical specificity (Calvinism ≠ TikTok).
  *   **General Seminar Vibe:** High tolerance for theory, low tolerance for tech-utopianism or determinism. Everyone hates "algorithmic culture" buzzwords unless grounded in material practice.

  ***

  ### Q&A Prep Sheet: Objections Ordered by Damage

  #### 1. The "Strawman Weber" Charge (Visiting Scholar)
  **Objection:** "You're building your whole critique on a caricature. Weber never argued for simple linear causation from values to economics; he argued for *elective affinity* and historical specificity. By claiming he 'smuggles in value-causation,' you're attacking a positivist Weber that doesn't exist. If your repair is based on a misreading, does the rest of the paper hold?"

  **90-Second Reply:**
  "That's a fair textual challenge, and I concede I'm compressing his historical argument to isolate a *logical* problem in his model of action. My target isn't the historical Weber, but the 'Weberian' model of rationalization that gets deployed in sociology today—the one that assumes internalized norms drive behavior without explaining the feedback loop.
  Even if Weber used 'affinity,' the *mechanism* he offers relies on anxiety driving productivity. I'm arguing that mechanism is incomplete because it treats the norm as stable. My 'algorithmic taste-culture' isn't about correcting history; it's about updating the mechanism for a reflexive modernity where the 'norm' is dynamically generated by the platform loop, not internalized theology. So, even if Weber was subtler, the structural flaw—confusing the *content* of the norm with the *force* of the norm—remains. I'm using TikTok to expose that logical gap, not to do history."

  **Weakest Point:** You're admitting to simplifying Weber to make him useful. The Scholar might press that you can't discard the historical specificity without losing the theory's explanatory power.

  #### 2. The "Prayer" Objection: Tech Determinism & Missing Ethnography (Everyone)
  **Objection:** "This sounds like hard tech determinism. You're saying the recommendation loop *generates* the norm, which removes human agency. Plus, you're making empirical claims about craft TikTok without a single interview or digital ethnography. Aren't you just armchair theorizing about how algorithms work?"

  **90-Second Reply:**
  "I want to separate the determinism charge from the methodological one. On determinism: I'm not saying the algorithm commands behavior. I'm saying the *aesthetic feedback loop* rewards certain performances of productivity. Users still choose to film, but the visibility economy shapes what 'craft' looks like. It's structural conditioning, not puppetry.
  On ethnography: You're right, this is a conceptual framework paper, not an empirical findings paper. I'm proposing 'algorithmic taste-cultures' as a category for *future* measurement. I'm using publicly visible patterns as existence proofs, not causal data. The claim isn't 'I proved this happens,' it's 'Here is the mechanism we need to look for.' If I waited for the ethnography, I wouldn't have the lens to conduct it. This is the map, not the territory."

  **Weakest Point:** "Conceptual framework" is a safe haven, but in a sociology seminar, it can sound like "I have no data." The determinism dodge is thin if you can't show where agency enters the loop.

  #### 3. The "Neoliberal Apologia" Charge (Critical Theory Grads)
  **Objection:** "You're describing the 'grindset' but treating it as a neutral cultural form. By calling it 'pseudo-asceticism,' you're aestheticizing exploitation. Aren't you just providing a sophisticated vocabulary for how capitalism colonizes our leisure? Where's the critique?"

  **90-Second Reply:**
  "That's exactly the critique I'm aiming for, but through mechanism rather than condemnation. If I just say 'capitalism is bad,' I don't explain why people *voluntarily* participate in their own exploitation. Weber's genius was showing how oppression feels like salvation.
  My argument is that 'algorithmic taste-cultures' strip away the salvation part—the theology—leaving only the exploitation. By showing that these norms have no theological backbone, I'm revealing them as hollow. I'm not legitimating the productivity; I'm exposing it as a ghost ritual. The 'pseudo' in pseudo-asceticism is the critical wedge. It shows the suffering is pointless, not spiritually necessary. That's the emancipatory move."

  **Weakest Point:** They may not buy that exposing the mechanism is enough "critique." They want a normative stance against the capitalism driving the algorithm, which you're sidestepping.

  #### 4. The "Operationalization" Charge (Quant Sociologist)
  **Objection:** "Okay, but how do you measure this? 'Algorithmic taste' isn't a variable. If you can't distinguish this from standard peer influence or market trends, you haven't added explanatory power. How is this testable?"

  **90-Second Reply:**
  "You're asking for a variable where I'm proposing a system effect. You can't regress 'algorithmic taste' directly, but you can proxy it. Look for discontinuities in content production that align with platform interface changes, not market shifts.
  For example, if craft videos shift from long-form tutorials to 15-second 'process porn' simultaneously across unrelated niches, that's the algorithmic signal, not peer influence. I'm suggesting we treat the recommendation loop as an institutional constraint, similar to how you'd treat a policy change. The testable hypothesis is: as algorithmic curation increases, cultural homogeneity in 'productive' aesthetics increases, independent of material economic incentives. It's measurable via content analysis metadata, not just surveys."

  **Weakest Point:** You're promising a research design you haven't executed. They may push that "content analysis" is just as interpretive as the theory you're defending.
