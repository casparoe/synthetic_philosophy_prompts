      *   *Verdict:* Darwin would reject the *dilemma* itself. He wouldn't accept the debunking conclusion (that morality is unjustified) because he doesn't accept the premise (that morality requires mind-independent tracking). But he would agree with the *mechanism* (evolution shaped instincts for fitness). So, the User is right about the mechanism, the Friend is right about the validity of morality, but both are wrong about the metaethical categorization.

