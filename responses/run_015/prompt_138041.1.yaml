answer: |-
  **Design Log:**
  *Candidate 1: Hospital Discharge Times.* Target: Health. Proxy: Length of Stay. Optimization: Discharge faster. *Drop:* Too hard to maintain "no-vice"; early discharge often looks like negligence when patients return.
  *Candidate 2: Food Bank Calories.* Target: Nutrition. Proxy: Calories distributed. Optimization: Cheap carbs. *Drop:* Proxy is merely correlated, not causally downstream of health in the tight way required; too easy to say "just measure vitamins."
  *Commit:* **Rapid Re-Housing Lease Velocity.** It fits your context, avoids the "school test" trope, and allows for a structural exhaustion mechanism that preserves good faith.

  **The Scenario:**
  A nonprofit aims to reduce chronic homelessness (Target) using a grant tied to "Days from Intake to Lease Signing" (Proxy). Caseworkers, acting in urgent good faith to get clients off the street, prioritize landlords with instant approval processes. In Year 1, the metric improves dramatically as clients move into high-turnover units owned by efficient corporate landlords; retention rates hold steady because these units are decent. By Year 3, the stock of "fast and decent" landlords is exhausted. To maintain the velocity metric required for funding, staff must now steer clients toward landlords who approve instantly because they skip background checks or ignore maintenance requests. The dashboard shows record-speed placements, but twelve-month retention crashes as clients flee uninhabitable units. No one lied about the dates; the proxy remained causally linked to housing *access*, but optimizing for speed systematically selected for housing *instability*.

  **Mechanism Analysis:**
  This is primarily **Extremal Goodhart**. When you optimize for the extreme tail of a distribution (fastest signings), you increasingly select on latent variables correlated with speed but anti-correlated with stability (e.g., lax maintenance). I deliberately excluded **Behavioral Goodhart** (clients gaming the system); the clients remain passive. I also excluded simple **Causal Goodhart** (where the act of measuring breaks the link); the link holds, but the *pool* changes. The boundary blurs because the extremal selection *causes* the environment to degrade, but the root is selecting on the tail of the proxy distribution.

  **Collapse Test:**
  If we remove the "exhaustion of good stock" constraint—assuming an infinite supply of fast, stable landlords—the metric and target remain correlated forever. The case collapses into a boring success story. Conversely, if staff knowingly hid maintenance issues to keep clients in units, it collapses into the moral cheating story your board fears. The tension exists only because the resource constraint forces a trade-off invisible to the dashboard.

  **Steelman the Skeptic:**
  A skeptic argues: "This isn't deep; it's just bad metric design. You should have weighted the proxy by unit quality inspections." This fails because quality inspections are costly, subjective, and slow—adding them would violate the grant's requirement for real-time data and slow the very velocity the funders want. The proxy was the *best available* measure at launch; the failure is that "best available" is not "stable under optimization."

  **Advice:**
  Stop treating the dashboard as a compass and start treating it as a speedometer; it tells you how fast you're going, not if you're driving off a cliff. Propose a "lagged audit" clause to the funder where a random sample of placements is reviewed for stability six months later, decoupling immediate payment from long-term outcomes.
