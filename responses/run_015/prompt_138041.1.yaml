      *   *Constraint Check:* No cheating (wages are real). Proxy valid initially (wage correlates with earnings). Non-monotonic (wages up, then employment stability down).
      *   *Let's go with the Housing one but refined:* **Permanent Supportive Housing "Rent Collection Rate".**
      *   *Target:* Tenant stability/independence.
      *   *Proxy:* % of rent collected on time.
      *   *Optimization:* Staff intervene early to pay rent for tenants facing shortfall to keep rate at 100%.
      *   *Phase 1:* Evictions drop, metric perfect.
      *   *Phase 2:* Tenants never learn budgeting/advocacy skills because staff always solve the cash crunch. When funding tightens or staff turnover happens, tenants face abrupt cliff and evict.
      *   *Wait, constraint 7:* "Can't be obvious fix." Adding "skill acquisition" is hard to measure.
      *   *Let's try: **Emergency Food Bank "Calories Distributed"**.***
      *   *Target:* Nutritional security/health.
      *   *Proxy:* Total calories distributed per month.
      *   *Optimization:* Source cheap, calorie-dense food (carbs/fats) to maximize number.
      *   *Phase 1:* Hunger reports drop, calories up.
      *   *Phase 2:* Health issues (diabetes/etc.) rise among clients due to poor nutrition, reducing their ability to work/stabilize, increasing long-term demand.
      *   *Critique:* This is classic "you are what you measure". But is it structural? Yes. Is it non-monotonic? Hunger drops, then health crashes.
      *   *Let's try to match the "Housing Nonprofit" vibe but distinct.*
      *   *Scenario:* **Rapid Re-Housing "Lease Signing Velocity".**
      *   *Target:* Long-term housing retention (12+ months).
      *   *Proxy:* Days from intake to lease signing.
      *   *Optimization:* Staff prioritize landlords with instant approval processes and units that pass inspection quickly.
      *   *Phase 1:* Velocity increases, people housed faster. Retention stable (low hanging fruit).
      *   *Phase 2:* The pool of "quick approval" landlords shrinks. To maintain velocity, staff steer clients toward lower-quality units/landlords who approve fast but maintain poorly. Tenants leave due to condition issues, not ability to pay. Retention drops.
      *   *Why not obvious fix?* Measuring "unit quality" is subjective and costly per unit, not scalable like date stamps.
      *   *Why structural?* Staff genuinely want people housed *now*. Homelessness is urgent. Delaying for quality feels unethical in the moment.

      *   *Decision:* I will build the **Rapid Re-Housing "Lease Signing Velocity"** scenario. It fits the user's context without being the school example.

  3.  **Drafting the Content:**
      *   *Brainstorming section:* Briefly mention Hospital Wait Times (too much neglect vibe) and Food Bank Calories (too simple/correlate). Commit to Housing Velocity.
      *   *Scenario:* One paragraph.
