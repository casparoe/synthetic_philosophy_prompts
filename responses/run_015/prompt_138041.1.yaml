      *   *Selection:* I need something where the *success* of the metric actively undermines the goal through a structural feedback loop, not just neglect. Let's try a **Job Training/Placement Program** but refined to avoid the "churn" vibe which sounds like cheating.
      *   *Actually, let's look at the User's context:* Housing Nonprofit. Let's stick close to home but make it distinct from the school example.
      *   *Idea:* **Transitional Housing "Income Growth" Metric.**
      *   *Target:* Economic self-sufficiency.
