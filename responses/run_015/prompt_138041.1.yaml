      *   *Candidate 2: Software Bug Fixes.* Target: System stability. Proxy: Number of closed tickets. Optimization: Close tickets faster. Result: Technical debt accumulates, system crashes later.
          *   *Drop:* Often implies cutting corners (vice). Also, "closed tickets" is often a correlate, not causally downstream of stability in the right way.
      *   *Candidate 3: Housing Nonprofit (User's context).* Target: Long-term housing stability. Proxy: Lease signing rate within 30 days. Optimization: Help clients sign leases quickly. Result: Clients sign leases they can't sustain, evictions rise later.
          *   *Drop:* Risks sounding like pressure on clients (vice). Hard to ensure "no one cheated" if evictions happen.
      *   *Candidate 4: Job Placement Agency.* Target: Long-term employment stability. Proxy: 90-day retention. Optimization: Place people in jobs that last 90 days. Result: Churn increases after 90 days.
          *   *Drop:* Similar to housing.
