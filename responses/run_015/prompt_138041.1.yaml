  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher (measurement/social epistemology) or econometrician (Goodhart's law expert).
      *   **Task:** Build a thought experiment about Goodhart's Law where nobody cheats, the metric is valid initially, the dashboard is accurate, but optimization makes the target worse over time (non-monotonic).
      *   **Constraints:**
          1.  One paragraph, realistic institution (no sci-fi).
          2.  No-vice condition (no lying cheating, gaming).
          3.  Proxy is genuinely best available, causally downstream.
          4.  Dashboard never lies (metric improves, target worsens).
          5.  Good-faith optimization makes target worse.
          6.  Non-monotonic trajectory (target improves first, then degrades).
