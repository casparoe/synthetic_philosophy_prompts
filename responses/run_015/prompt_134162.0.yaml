answer: |-
  ### Desiderata for an Explanatory Theory of Content

  To serve as a working tool for cognitive science, a theory of content must do more than satisfy metaphysical intuitions; it must license specific inferences about behavior. The following desiderata are derived from the requirement that content explanations must work in both successful and failed cases.

  **1. The Normativity Constraint (Non-negotiable)**
  *   **Motivation:** A system must be capable of misrepresenting even when nothing within the system registers the mistake. If a frog's visual system fires at a BB, the explanation "it represented a fly" is only valid if that firing counts as an *error*, not merely a different correlation.
  *   **Requirement:** The theory must ground a norm distinct from statistical regularity. It must distinguish between a state *causing* a behavior and a state *licensing* a behavior, such that the license can be revoked by the world without the system's internal acknowledgment.

  **2. The Determinacy of Grain (Non-negotiable)**
  *   **Motivation:** Consider a detector triggered by small, moving, dark things. Does it represent *flies*, *black dots*, or *food*? If the theory allows all three equally, it cannot explain why the creature snaps (food) rather than tracks (black dot). Radical indeterminacy renders content explanations vacuous.
  *   **Requirement:** The theory must provide principled criteria for settling the grain of content. It cannot rely on the theorist's pragmatic choice; the system itself must privilege one level of description over others to explain specific motor outputs.

  **3. The Asymmetry of Error Costs (Non-negotiable)**
  *   **Motivation:** In signal detection, systems are often tuned to favor one type of error over another. A smoke detector represents *fire* even when it triggers for toast, because the cost of a false negative (missing fire) outweighs the cost of a false positive.
  *   **Requirement:** The theory must account for states that function precisely by getting things wrong in low-stakes contexts to avoid getting things wrong in high-stakes contexts. Content attribution must reflect the *tolerance* built into the system, not just its hit rate.

  **4. The Consumer Principle (Prejudice of the Use-Theorist)**
  *   **Motivation:** Consider a neural state produced by a sensory module but never read by any downstream motor or cognitive system (a "dead end"). Does it have content? If content explains behavior, a state that influences nothing explains nothing.
  *   **Requirement:** Content is conferred not by the producer (the cause of the state) but by the consumer (the system that uses the state to guide action). A state with no consumer lacks representational content.
  *   **Status:** *Prejudice.* Structuralists argue the state represents its cause regardless of use. However, for *explanatory* utility regarding behavior, the consumer constraint is treated here as non-negotiable.

  **5. Historical Parity (Prejudice of the Liberal Naturalist)**
  *   **Motivation:** Can a trained neural network have content if it lacks an evolutionary history? If we say "no," we cannot use content explanations for AI. If we say "yes," we must explain whether this is the *same* kind of content as in biological organisms.
  *   **Requirement:** The theory should ideally apply to ahistorical systems (design/training) without equivocation, or explicitly delineate why biological content is sui generis.
  *   **Status:** *Prejudice.* Teleosemantics treats this as a dealbreaker (no history, no function, no content). Cognitive science generally requires parity.

  **6. Third-Person Accessibility (Prejudice of the Realist)**
  *   **Motivation:** How much content is readable from the outside by an observer who does not already know what the system is for? If content is only visible to someone who already grasps the system's function, content explanations risk circularity.
  *   **Requirement:** There must be objective markers (structural, statistical, or functional) accessible to an external theorist that allow content attribution without prior stipulation of the system's goals.
  *   **Status:** *Prejudice.* Pragmatists argue content is always relative to an interpreter's stance. Realists demand mind-independent facts about content.

  ***

  ### Tensions and Inconsistencies

  There are two significant friction points in this list that threaten to pull the project apart.

  **History vs. Present-Tense Explanation:**
  Teleological theories fix content via selection history (what the state was *for* in the past). However, cognitive scientists explain *current* behavior, often in systems where history is opaque (e.g., a novel lesion, a black-box AI). If content is fixed by history, but history is inaccessible to the explainer, the explanatory tool becomes unusable in practice.
  *   **Verdict:** This is a **tension**, not a logical inconsistency. It can be managed by treating selection history as the *ground* of content, while allowing current functional role to serve as the *evidence* for content. However, this risks collapsing teleology into functionalism if the bridge is not carefully built.

  **Genuine Error vs. Third-Person Readability:**
  To identify a genuine error (Desideratum 1), one must know the norm (the function). To satisfy Third-Person Accessibility (Desideratum 6), one must identify the norm from the outside without prior knowledge of the function. If the only way to spot the error is to already know the content, the theory is hermeneutically circular.
  *   **Verdict:** This is a **dramatized tension** often exploited by skeptics. It is not a strict inconsistency because "readability" does not require "immediate transparency." An external observer can infer function from structure and context (e.g., evolutionary context or design specs) to uncover the norm. The tension becomes an inconsistency only if one demands that content be readable *independently* of any facts about the system's history or design—which would make normativity impossible to ground naturalistically.

  ***

  ### Evaluation of Existing Families

  **The Proper-Function Family (Teleosemantics)**
  *   **Performance:** Excels at **Normativity** and **Error Asymmetry**. By grounding content in selection history, it easily distinguishes between what a state *does* and what it is *supposed to do*, handling the frog/BB case and the smoke detector case robustly.
  *   **Weakness:** Struggles with **Historical Parity** and **Third-Person Accessibility**. It renders content in novel AI systems metaphysically dubious (or requires a stretched analogy of "selection"). Furthermore, because selection history is often empirically opaque, it makes content attribution difficult for the working scientist who lacks access to the evolutionary or design archive.

  **The Covariance-or-Information Family (Informational Semantics)**
  *   **Performance:** Excels at **Third-Person Accessibility** and **Historical Parity**. If content is lawful correlation or mutual information, it is readable from the structure of the system and applies equally to brains and chips.
  *   **Weakness:** Collapses on **Normativity** and **Determinacy of Grain**. Without an appeal to function or context, it cannot distinguish misrepresentation from representation of a disjunction (the "Disjunction Problem"). It struggles to explain why a state represents *fly* rather than *fly-or-BB* when both cause the state, and it cannot easily account for systematic error without abandoning the covariance requirement.
