  Your intuition about "shared causal reference" is closer to Davidson's late view than the blog post admits. The post claims the picture was finished in the seventies, but Davidson argued triangulation was necessary to explain objectivity—the distinction between how things seem and how they are. Without it, charity risks circularity.

