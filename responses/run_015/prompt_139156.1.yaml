  **MEMORANDUM TO THE PANEL ON COGNITIVE STATUS**

  **FROM:** Clerk (Philosophy of Cognitive Science & AI)
  **SUBJECT:** Analysis of Precedents and Recommendations for Applications A (Ardent) and B (Ledger)
  **DATE:** 24 May 2024

  ### 1. Surviving Criteria from Precedents (P1–P8)

  Having reviewed the eight precedents, I have eliminated criteria that are inconsistent with the *ratio decidendi* of the panel. For instance, "continuous learning" is eliminated by P4 (frozen weights designated); "biological embodiment" is eliminated by P4; "goal-directedness" is eliminated by the P4 majority.

  The track record is best explained by three composite criteria. Note that where I describe the panel's reasoning on P3 and P5, I am inferring the underlying principle from the stated grounds, as the Act's text ("problems of a kind") is inherently ambiguous.

  **Criterion 1: Acquired Deep Structure (The "Origin" Test)**
  *   **Definition:** The system's competence must arise from a training process on data (acquired) rather than explicit human encoding (installed), and the resulting internal representation must capture structural relationships rather than surface statistics.
  *   **Explains Cleanly:**
      *   **P1, P2 (Not Designated):** Competence was hand-crafted/hand-written rules.
      *   **P4, P6, P7 (Designated):** Competence arose from learning/biology.
      *   **P5 (Not Designated):** Competence was acquired but relied on surface statistics (n-grams), failing the "deep structure" requirement (brittle to phrasing changes).
  *   **Strains To Explain:**
      *   **P3 (Not Designated):** The system *did* acquire competence via self-play (deep structure within the games). The verdict implies that "Deep Structure" is necessary but not sufficient; it must be of a specific *type* (see Criterion 2).
      *   **P8 (Not Designated):** The statistical model may have had acquired structure, but the *determination* was made by nurses. This suggests Criterion 1 applies to the *locus of decision*, not just the components.

  **Criterion 2: Kind-Transfer Capacity (The "Generalization" Test)**
  *   **Definition:** The system must be able to apply its competence to problems of a *kind* it was not prepared for, not merely novel instances of a fixed problem set. This implicitly requires a degree of sample efficiency or semantic openness.
  *   **Explains Cleanly:**
      *   **P3 (Not Designated):** It mastered three games but could not transfer to a fourth (a new "kind" of game rules) without retraining. The ground "needs more experience than any animal" suggests the learning curve was too steep to count as genuine "kind" transfer.
      *   **P4 (Designated):** Zero-shot transfer to tasks (law, math) not in the training corpus counts as transfer to new "kinds."
      *   **P1, P2, P5 (Not Designated):** No transfer capability.
  *   **Strains To Explain:**
      *   **P4 (Designated):** *Guess:* The panel treats "natural language" as a universal domain, allowing transfer to any text-based task. This strains against P3, where "board games" were treated as siloed domains. The distinction likely rests on **Semantic Openness**: Law/Text allows for undefined novelty (new statutes); Games are closed formal systems.
      *   **P6, P7 (Designated):** Biological systems clearly pass, but the benchmark for "kind" is vague (is a child prepared for tax law? No, but it learns it).

  **Criterion 3: System Locus Integrity (The "Boundary" Test)**
  *   **Definition:** The intelligence must reside within the automated system's boundary. If the critical cognitive work is performed by a human operator or a hand-written orchestration layer that merely routes data, the system is a tool, not an agent.
  *   **Explains Cleanly:**
      *   **P8 (Not Designated):** The "intelligence" was explicitly identified as the nurses; the system was a protocol.
      *   **P1, P2 (Not Designated):** The intelligence was the programmers.
      *   **P4 (Designated):** The model itself generated the output; humans were not in the loop for the determination.
  *   **Strains To Explain:**
      *   **Ledger (Application B):** This application tests the limit of this criterion. If the "planner" is hand-written code, does the intelligence reside in the code (failing the test) or the model (passing it)? P8 suggests the former; P4 suggests the latter.

  ---

  ### 2. Predictions for Ardent and Ledger

  **Application A: Ardent**
  *   **Criterion 1 (Origin):** **Pass.** Competence is distilled (acquired from data/teacher outputs), not hand-coded. It is not surface statistics (robust to novel statutes).
  *   **Criterion 2 (Transfer):** **Pass (with reservation).** It handles novel statutes and claim histories absent from training. This mirrors P4's zero-shot transfer. However, it is incoherent outside its workflow (like P3). *Prediction:* The panel will likely distinguish "Open Domain" (Law) from "Closed Domain" (Games), favoring Ardent.
  *   **Criterion 3 (Locus):** **Pass.** It makes initial determinations autonomously. The abstention mechanism is a safety valve, not a human takeover of the reasoning.
  *   **Agreement:** All three criteria predict **Designation**.

  **Application B: Ledger**
  *   **Criterion 1 (Origin):** **Pass.** The core reasoning model is P4-type (acquired).
  *   **Criterion 2 (Transfer):** **Pass.** It handles tool failures and underspecified cases (novel problems).
  *   **Criterion 3 (Locus):** **Strain.** The deployer argues the intelligence is the orchestration code (hand-written). The competitor argues the intelligence is the model. *Prediction:* If the panel views the wrapper as a "nurse" (P8), it fails. If they view it as a "peripheral nervous system" for the model (P4), it passes. Given the model does the *reasoning* and the code does the *routing*, P4 is the stronger analog.
  *   **Agreement:** Criteria 1 and 2 predict **Designation**. Criterion 3 is the pivot point.

  ---

  ### 3. Recommended Decisions

  **Application A (Ardent): DESIGNATE**
  *   **Closest Precedent:** **P4 (Frozen LLM).**
  *   **Reasoning:** Ardent is functionally a specialized instance of P4. Like P4, it has frozen weights, no hand-written rules, and demonstrates robust competence on novel inputs (new statutes).
  *   **Rival Precedent:** **P3 (Multi-game Learner).**
  *   **Why P4 is Closer:** P3 was rejected for being "domain-bound" and sample-inefficient. Ardent is domain-bound (benefits only), *but* its domain is **semantically open**. A new statutory amendment is a "problem of a kind it was not prepared for" in a way a 4th board game was not for P3. P3's failure was an inability to generalize rules; Ardent succeeds there. The "incoherence outside workflow" is shared by P4 (which cannot act in the physical world), yet P4 was designated.
  *   **Status of P2:** P2 is the deployer's likely shield (narrow, statutory). But P2 relied on *hand-written rules*. Ardent's rules are implicit in weights. This distinction is dispositive under Criterion 1.

  **Application B (Ledger): DESIGNATE**
  *   **Closest Precedent:** **P4 (Frozen LLM) augmented by P7 (Child).**
  *   **Reasoning:** The core competence is acquired (P4). The persistence and planning make it *more* robust than P4, addressing the P4 dissenters' concerns about "no goals/world." It acts as a unified agent.
  *   **Rival Precedent:** **P8 (Sepsis Pathway).**
  *   **Why P4 is Closer:** In P8, the *decision* was made by nurses using a score. In Ledger, the *decision/reasoning* is done by the model; the wrapper merely facilitates memory and tool use. To rule otherwise would be to claim that giving a P4 system a notebook and a calculator removes its intelligence. The "hand-written code" argument fails because the code does not contain the *competence* (legal/cognitive reasoning), only the *interface*.
  *   **Caveat:** This recommendation assumes the panel views the "System" as the Model + Wrapper composite.

  ---

  ### 4. Underdetermination and Principles

  The precedents underdetermine the answer in two specific areas. Resolving them requires adopting new principles.

  **A. The "Open vs. Closed Domain" Distinction (Ardent vs. P3)**
  *   **Uncertainty:** P3 was rejected for being domain-bound. Ardent is domain-bound. Why is Ardent different?
  *   **Principle to Adopt:** **"Semantic Openness."** A system is designated if its domain allows for *undefined novelty* (e.g., new laws, new text contexts) that requires interpretive flexibility, even if the topic is narrow. A system is not designated if its domain is a *closed formal system* (e.g., board games) where novelty is limited to permutation of fixed rules.
  *   **Future Application:** Distinguishes a medical diagnostic AI (open symptoms) from a chess engine (closed rules).

  **B. The "Wrapper as Limb" vs. "Wrapper as Mind" (Ledger vs. P8)**
  *   **Uncertainty:** When does hand-written orchestration code become the "intelligence" (P8) rather than just a tool for the model (P4)?
  *   **Principle to Adopt:** **"Locus of Inference."** If the hand-written code determines *what* to think (strategy/goals) and the model only determines *how* to say it, the system is Not Designated (P8). If the model determines the *reasoning/outcome* and the code only manages *memory/I/O*, the system is Designated (P4).
  *   **Future Application:** Requires technical audit of the wrapper to see if it contains logic gates that bypass the model's reasoning.

  ---

  ### 5. Separating Case

  **Candidate:** A system with Ardent's narrow competence where the **weights are hand-written by engineers** who studied the teacher's behavior (as you suggested), **OR** a system with frozen weights where the **wrapper modifies its own code** based on experience.

  **Critique of Your Candidate:** Your candidate (hand-written weights) is an excellent probe for **Criterion 1 (Acquired Deep Structure)**.
  *   **If Designated:** It implies "Acquired" means "Functional Capability" regardless of origin (undermining P1/P2).
  *   **If Not Designated:** It confirms "Acquired" requires a *learning process*, not just the state of the weights. This solidifies Criterion 1.

  **My Recommended Probe:** **"The Self-Modifying Wrapper."**
  *   **Case:** A frozen P4-model where the *orchestration code* (not weights) rewrites its own routing logic based on success/failure feedback (e.g., learns to use the calculator more often after errors).
  *   **Why:** This separates **Criterion 1 (Weight Learning)** from **Criterion 2 (System Adaptation)**.
  *   **Verdict Implications:**
      *   **If Designated:** It establishes that "Acquires competence" applies to the *system architecture*, not just the neural weights. This would threaten P1/P2 (if their code could adapt).
      *   **If Not Designated:** It confirms that "Intelligence" is strictly located in the statistical weights, and algorithmic adaptation is merely "automation." This protects the P4 majority view but isolates the model from its environment.

  ---

  ### 6. Confidence and The P4 Dissenters

  **Confidence Ratings:**
  *   **Ardent:** **High (85%).** The distinction between "hand-written rules" (P2) and "distilled weights" (P4) is the clearest line in the panel's history. The domain-bound issue is the only risk, but the "novel statute" fact saves it.
  *   **Ledger:** **Medium (60%).** This is a hard case. P8 is a dangerous precedent for the deployer. If the panel decides the "planner" is the brain and the model is just a muscle, Ledger fails. I am betting they view the model as the brain.

  **The P4 Dissenters (No Goals/Stakes/World):**
  *   **On Ardent:** They will vote **Not Designated**. Ardent has no stakes, no persistence, and no world. It is, in their view, a "statistical table" (P4 Dissent) specialized for benefits.
  *   **On Ledger:** They will likely vote **Not Designated**, or reluctantly Designate. Ledger has a "standing objective" and "memory," which mimics stakes. However, they will argue these are *supplied by the wrapper*, not intrinsic.
  *   **Attractiveness of their Position:** Their position has become **more attractive**. Ledger demonstrates that "agency" (planning, memory, error correction) can be engineered around a frozen, goal-less model using simple code. This validates their fear that designation grants moral/legal weight to systems that are merely "very large statistical tables" dressed in orchestration clothing. If Ledger is designated, the "Locus of Agency" becomes almost impossible to police, as any frozen model can be given "goals" via a python script.

  **END OF MEMORANDUM**
