answer: |-
  ### 1. Exam Question

  **Question 3 (20 Marks)**

  Consider two possible worlds. **W1** contains nothing except two iron spheres, exactly similar in diameter, colour, temperature, and composition, situated a fixed distance apart in empty space. Nothing ever changes. **W2** is identical to W1 for a time, after which Sphere A acquires a small dent and retains it forever; otherwise, the world remains symmetric and empty.

  (a) In W2, are the spheres discernible? If yes, by what property or relation? (4 marks)

  (b) Consider the following argument: *"W2 is just W1 with a dent added. Since the spheres in W2 are obviously two distinct objects, Black's W1 never threatened the Principle of Identity of Indiscernibles (PII) to begin with."* Evaluate this argument. Does the existence of W2 save PII in W1? (6 marks)

  (c) What does W2 actually license you to say about the metaphysics of W1? In your answer, address the difficulty that one cannot state the description of W2 without implicitly specifying which sphere receives the dent. Explain why treating properties as a "list" fails to capture the force of PII in this context. (10 marks)

  *Note: You do not need to cite or name any philosophers to answer this question.*

  ***

  ### 2. Model Answer

  The Principle of Identity of Indiscernibles (PII) states that if two entities share all qualitative properties, they are identical. Black's W1 is designed to challenge this by presenting two numerically distinct entities that share all qualitative properties. The introduction of W2 attempts to salvage PII by introducing a qualitative difference, but this move fails to refute the counterexample posed by W1.

  In W2, the spheres are discernible. Before the dent, they share all intrinsic properties. After the dent, they differ in shape. However, one might argue they are also discernible relationally by their history: one has the property of *being dented at t2*, while the other does not. This qualitative difference allows us to distinguish them without invoking primitive thisness. Thus, PII holds trivially in W2 because the objects are not indiscernible.

  However, the argument that W2 saves PII for W1 is unsound. It assumes that because distinctness is accompanied by qualitative difference in W2, distinctness in W1 must also rely on qualitative difference. This confuses the *manifestation* of distinctness with the *ground* of distinctness. In W2, the dent reveals a difference, but it does not create the numerical twoness. If the spheres were not already two distinct substances in the pre-dent phase of W2, a single substance could not simply split or acquire a dent in one "part" without already presupposing distinct loci of identity. Therefore, the distinctness in W2 presupposes the distinctness in W1. If W1 is impossible (because PII is necessary), then the pre-dent phase of W2 is also impossible. W2 does not validate PII; it merely pushes the problem back to the moment before the dent occurred.

  This leads to the deeper metaphysical implication of W2 regarding W1. To describe W2, we must say "Sphere A gets dented, Sphere B does not." But in a symmetric world, there is no qualitative basis to label one 'A' and the other 'B' prior to the dent. If we cannot name them without presupposing distinctness, our language haecceitistically assumes what it ought to prove. W2 licenses the view that distinctness is primitive. It suggests that even in W1, the spheres are distinct not because of properties, but because they are distinct substances. The possibility of W2 implies that numerical identity is not reducible to qualitative similarity.

  Finally, we must address why "sharing all properties" cannot be cashed out as a long list. PII is a modal claim involving quantification over *all possible* qualitative properties, not just the ones we observe or list. If PII were merely about a list of observed traits (colour, mass, shape), one could always argue there is an unlisted property distinguishing the objects. However, Black's stipulation covers *all* qualitative properties, including relational ones (provided they don't presuppose identity). In W1, the quantification is exhaustive: there is no qualitative property, listed or unlisted, that one has and the other lacks. If one insists PII holds in W1, one must claim that *being identical to Sphere A* is a property. But this is a trivial, haecceitistic property that presupposes the distinctness it aims to explain. Thus, W2 confirms that without primitive thisness, W1 describes a genuine possibility where PII fails. The dent in W2 is merely an accidental modification of substances that were already numerically distinct in virtue of nothing more than their being two.

  ***

  ### 3. Marking Scheme

  **Rubric (20 Marks Total)**

  *   **Part (a) – Discernibility in W2 (4 Marks):**
      *   Correctly identifies spheres are discernible in W2 (2 marks).
      *   Identifies the dent (intrinsic) or the history of the dent (temporal/relational) as the distinguishing factor (2 marks).
  *   **Part (b) – Evaluating the "W2 Saves PII" Argument (6 Marks):**
      *   Rejects the argument that W2 validates PII for W1 (2 marks).
      *   Explains that distinctness in W2 *presupposes* distinctness in the pre-dent phase (which is W1) (4 marks).
  *   **Part (c) – Metaphysical Implications & Property Quantification (10 Marks):**
      *   Identifies the linguistic problem: describing W2 requires haecceitistic labeling ('A' vs 'B') which presupposes distinctness (3 marks).
      *   Concludes that W2 supports Primitive Thisness/Haecceitism over PII (3 marks).
      *   Explains that PII involves quantification over *all* qualitative properties, not an empirical list, and that identity-properties beg the question (4 marks).

  **Specific Mistakes & Diagnostic Confusions**

  1.  **Mistake:** Claiming the spheres in W1 are discernible because one is "2 miles from Sphere A" and the other "2 miles from Sphere B."
      *   **Confusion:** Uses impure relational properties that presuppose the distinctness they are meant to prove (circularity).
  2.  **Mistake:** Claiming the spheres are discernible because one has the property "being identical to Sphere A."
      *   **Confusion:** Treats numerical identity as a qualitative property, rendering PII a tautology rather than a metaphysical principle.
  3.  **Mistake:** Arguing we could settle W1 by "looking closer" to find a microscopic scratch.
      *   **Confusion:** Treats PII as an empirical hypothesis subject to observation rather than a modal claim about possible worlds.
  4.  **Mistake:** Suggesting PII is saved in W1 because the spheres occupy different locations.
      *   **Confusion:** Fails to recognize that in a relational theory of space (implied by the empty universe setup), location is not an intrinsic property independent of the objects.
  5.  **Mistake:** Treating "all properties" as a finite checklist of standard physical traits (mass, colour, etc.).
      *   **Confusion:** Misses the second-order logical structure of PII, which quantifies over *any* predicatable quality, not just standard physical categories.
