      *   *Nodes (Created Substances):* Stateless. They don't hold state between ticks. They receive input and emit output based *only* on the current divine command, not internal logic.
      *   *Message Passing:* The appearance of causation (A hits B) is just two messages arriving in sequence from the Coordinator (God).
      *   *State Transitions:* Not endogenous (internal to the node). Exogenous (injected by the Coordinator).
      *   *Replay:* The universe is deterministic only because the Log is replayed consistently (Habit), not because nodes have causal powers.

  4.  **Drafting the Restatement (Iterative Process):**
