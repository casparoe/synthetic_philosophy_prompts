answer: |-
  The rain didn't fall so much as hang in the air, a wet grey curtain that made the town hall windows sweat. Inside, the heat was too high, smelling of wet wool and stale coffee. I was sitting on the radiator cover in the back, knees pulled to my chest, watching my dad erase the whiteboard for the third time.

  "Okay," Sarah said. She was standing by the table, marker cap in her mouth. She taught history at the school, the one with the sixty seats that might not be there next year. "Let's run the procedure. Strictly. No feelings, just the rule we agreed on."

  "The All-Affected Principle," Mr. Henderson said. He was the town clerk, seventy years old, hands folded over his ledger. "Whoever is significantly affected by the decision gets a vote."

  "Right," Sarah said. "Round one. Who is affected right now, before any decision is made?"

  "Us," my dad said. He didn't look up from his phone. He was texting someone from the development company. "People on the roll. Four hundred of us. We live here. We pay the rates. If the harbour silts up, we deal with it. If the school closes, our kids leave."

  "Neighbors?" my mom asked. She was sitting across from him, arms crossed. She fished out of the next bay over.

  "Not yet," Henderson said. "Nothing's built. Their fishery is fine today."

  "Okay," Sarah wrote *Current Residents (400)* on the board. "Vote."

  It wasn't even close. My dad's side had been campaigning for months. Jobs. A new grocery store. The school staying open. Hands went up. 260 to 140. The resort passes.

  "Okay," Sarah said, her voice tight. "Result is YES. Therefore, the resort is built. Therefore, the harbour is dredged. Therefore, the sediment plume moves into South Bay." She turned to my mom. "Elaine, does that affect you?"

  "It kills the grounds," Mom said. "Flat."

  "And the workers?" Sarah asked. "Nine hundred construction staff and hoteliers moving into the new block."

  "They exist now," Dad said. "They're living here."

  "So," Sarah said, "if the result is YES, the group of 'Affected People' changes. The workers are affected because they live here. The South Bay villagers are affected because their livelihood is gone. We have to re-vote."

  Henderson sighed, rubbing his temples. "This is the loop, Sarah."

  "It's due process," she snapped. "Round two." She erased *Current Residents* and wrote *Residents + Workers + South Bay (1400)*. "Vote."

  The room got quiet. This was the hypothetical part. We had to imagine the workers were here. We had to imagine the South Bay villagers sitting in the chairs next to us.

  "My people vote NO," Mom said. "All of them."

  "The workers..." Dad hesitated. "They want the jobs. They'd vote YES."

  "But they aren't here," Henderson said. "And the South Bay people aren't on our roll. They're a different municipality."

  "But they're affected," Sarah said. "That's the rule. If we don't count them, we're deciding for them without them. That's not democracy, that's annexation."

  "Fine," Henderson said. "Count them."

  "South Bay is 150 people," Sarah said. "All NO. Workers are 900. Split vote, maybe? But even if half vote YES... the Residents are now split because half of them hate the dredging." She did the math on the board. The numbers shifted. The moral weight of the destroyed fishery pulled some of the original residents over to the NO side. The hypothetical workers couldn't outweigh the combined anger of the original town and the neighbors.

  "Result NO," Sarah said. "Resort fails."

  She turned back to the board. "Okay. Result is NO. Therefore, the resort is not built. Therefore, the workers do not come. Therefore, the harbour is not dredged." She looked at Mom. "Elaine, are you affected?"

  "Trade goes on," Mom said. "We still sell to the shops here. But no dredging."

  "So is that 'significant'?" Sarah asked. "If the resort doesn't exist, are the South Bay voters still affected enough to deserve a seat?"

  "No," Henderson said quickly. "Status quo is normal trade. No significant harm. They drop off the list."

  "And the workers?"

  "Never arrived," Dad said. "They don't exist."

  "So," Sarah said, the marker hovering over the board. "We are back to *Current Residents (400)*."

  "Which brings us back to Round One," I said. My voice sounded too loud in the quiet room.

  Everyone looked at me. I shrunk back against the window glass.

  "Right," Sarah whispered. She didn't erase the list. She just stared at it. "Back to Round One. Residents vote YES. Which brings back the neighbors. Which votes NO. Which removes the neighbors. Which votes YES."

  She capped the marker. The click sounded like a gun cocking.

  "So what's the verdict?" Dad asked. He was trying to keep it light, but his jaw was working.

  "There isn't one," Henderson said. He closed his ledger. "We have two elections here. Both valid. Both contradictory."

  He pointed to the left side of the board. "List A: Current Residents. Legitimate because they are the only constant legal entities. Result: Build. The school stays open. The town survives. But South Bay dies."

  He pointed to the right side. "List B: Affected Parties. Legitimate because harm dictates representation. Result: Don't Build. South Bay lives. The town slowly empties. Your school closes, Leo."

  He looked at me when he said my name. I looked at my shoes.

  "It's not a glitch," Sarah said. She was leaning against the table, looking tired. "It's the structure. We can't decide who decides without deciding the outcome. The boundary of the community depends on the decision the community makes."

  "So we flip a coin?" Dad asked.

  "No," Mom said. "Because if you flip a coin and it lands on Build, you just authorized a government that includes people who weren't allowed to vote against it. If it lands on Don't Build, you let a small group veto a future that would have given them neighbors."

  "We're stuck," Henderson said.

  "No," Sarah said. "We're just... oscillating."

  She picked up the eraser but didn't use it. The whiteboard held both lists now. *Residents* on the left. *Affected* on the right. Both sums were correct. Both followed the rules we'd agreed on ten minutes ago. Both produced a majority. One majority said yes, one said no.

  Outside, the rain got heavier, drumming against the glass. The ferry horn blew in the distance, a low, lonely sound that meant someone was leaving or someone was arriving, and you couldn't tell which until they docked.

  "We can't leave it like this," Dad said. "The developer needs an answer by Friday."

  "Give them the list," Mom said.

  "Which one?"

  "Both," she said. "Tell them we voted. Tell them we voted twice. Tell them we won."

  "That's insane," Dad said.

  "It's honest," Mom said.

  Sarah looked at the board, then at me. I was still sitting on the radiator, watching the condensation run down the pane. There was a droplet forming on the edge of the window, getting heavy, waiting to fall. It didn't know where the ground was.

  "Meeting adjourned," Henderson said. He didn't bang a gavel. He just picked up his coat.

  Nobody moved for a minute. The two lists stayed on the board, white ink glowing under the fluorescent lights. One list promised a future for the kids in the school. The other promised a future for the water outside. Both were democratic. Both were final. Both were impossible.

  My dad stood up and offered his hand to my mom. She took it, but she didn't stand up. They just held hands across the table, looking at the board, waiting for the other side to blink.
