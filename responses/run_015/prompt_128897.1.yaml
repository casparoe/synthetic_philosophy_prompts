answer: |-
  This is a sharp setup. You've correctly identified that the "sensory" version of hedonism (pleasure is a specific feeling-tone, like a glow or a tingle) is dead on arrival against the heterogeneity objection. The real fight is between the **Adverbial** view (pleasure is a *mode* of experiencing) and the **Attitudinal** view (pleasure is a *pro-attitude* toward experience). The Functional view is a contender, but as you suspect, it often smuggles in a category error.

  Here is the comparison you asked for, running the cases, testing the metaphysics, and judging the cost to hedonism itself.

  ### 1. The Crucible: Running the Four Cases
  To see which theory does actual work, we have to stop treating them as definitions and start treating them as predictive engines.

  **The Deep-Flow Case**
  *   **Adverbialism:** Struggles here. If pleasure is a "manner" of undergoing an experience, the climber should be able to attend to that manner. But by definition, flow is the absence of self-monitoring. If the climber isn't experiencing the climb *as* pleasurable in the moment, the adverbialist has to say the pleasure wasn't happening *then*, but only in retrospect. That contradicts the intuition that the experience *itself* was good, not just the memory of it.
  *   **Attitudinalism:** Also struggles, but has a dodge. Strict attitudinalism requires an occurrent desire ("I want this to continue"). In flow, that voice is silent. However, attitudinalists often switch to *dispositional* desire (if asked, you would say yes). This saves the theory but weakens the link to consciousness.
  *   **Functionalism:** Wins easily. The "keep going" signal is maxed out. The system is reinforced.
  *   **Score:** Functionalism > Attitudinalism (with caveats) > Adverbialism.

  **The Itch Case (Poison Ivy)**
  *   **Adverbialism:** Wins easily. The *manner* in which you undergo the scratching is agonizing, frantic, and relief-seeking, not "pleasurable." The theory respects the phenomenology: it feels bad, so it isn't pleasure.
  *   **Attitudinalism:** Takes a direct hit. You have an overwhelming impulse to keep scratching for its own sake (to stop the itch is the goal, but the scratching is the means you are driven to). If pleasure = wanting an experience to continue, the itch-scratch counts. The attitudinalist must argue this is a "compulsion" not an "intrinsic desire," but that distinction looks suspiciously like saying "pleasure is wanting, except when it's not."
  *   **Functionalism:** Fails. The "do that again" signal is hijacked in addiction and compulsion. We don't want to call heroin withdrawal relief "pleasure" in the hedonic sense, even if the reward system fires.
  *   **Score:** Adverbialism > Functionalism > Attitudinalism.

  **The Bittersweet Case**
  *   **Adverbialism:** Vague. Is the manner of listening to sad music "pleasurable"? It feels sad. The adverbialist has to argue that "sadly" and "pleasurably" can modify the same experience simultaneously without canceling out. It's possible, but it stretches the analogy of "gracefully."
  *   **Attitudinalism:** Handles this best. You have a pro-attitude toward the *music continuing*, even if you have a con-attitude toward the *sadness*. It disentangles the object of the attitude neatly.
  *   **Functionalism:** Neutral. You keep listening.
  *   **Score:** Attitudinalism > Adverbialism.

  **The Flip Case (The Beer)**
  *   **Adverbialism:** Handles this well. The sensory input (taste) is the same, but the *manner* of undergoing it changes based on context (hot vs. cold). The "adverb" changes even if the "verb" (tasting) stays the same.
  *   **Attitudinalism:** Also handles this well. Your attitude toward the sensation flips based on context.
  *   **Functionalism:** Handles this well. The reward signal is context-dependent.
  *   **Score:** Tie.

  **Summary of the Cases:**
  Adverbialism respects the *feel* (saving the Itch case) but fails when consciousness fades (Flow). Attitudinalism handles complex objects (Bittersweet) and context (Flip) but misidentifies compulsions as pleasures (Itch). Functionalism predicts behavior but loses the normative "goodness."

  ### 2. The "Bump in the Carpet" Worry
  Your worry about Adverbialism is the standard metaphysical objection: **Is it empty?**

  If I say, "He runs gracefully" and "He dances gracefully," I am pointing to a structural feature of the movement (efficiency, balance, aesthetic proportion). I can analyze *what makes it graceful*. If the adverbialist says, "You experience the beer pleasurably," but denies there is any common qualitative feature (no glow, no tingle, no specific feeling), then "pleasurably" becomes a magic word. It means "experienced in the way that pleasant experiences are experienced." That is circular.

  **Does it bite?** Yes. Adverbialism tries to have its cake and eat it too. It wants to say pleasure is phenomenological (about how it feels) without committing to a specific phenomenology. To avoid the heterogeneity objection, it strips away the content; to avoid emptiness, it needs content. It ends up hovering in between.

  **Does Attitudinalism have a mirror worry?** Yes, but it's different. The worry isn't emptiness; it's **reduction**. If pleasure is just "wanting X for its own sake," have you explained pleasure, or have you just defined it away? The mirror worry is: "Wanting is a functional/dispositional state. Pleasure is a conscious state. You haven't explained the consciousness; you've replaced it with a disposition."
  However, Attitudinalism is *less* vulnerable to the "empty label" charge because "desire" is a well-worked concept in philosophy of mind. We know what belief/desire psychology looks like. We don't know what a "non-qualitative qualitative mode" looks like.

  **Verdict on Metaphysics:** Attitudinalism is more robust. Adverbialism feels like a linguistic sleight of hand to save the intuition that pleasure is a "feeling."

  ### 3. The Third Option: Functionalism/Reward
  Is this a genuine way out? **No.** It changes the subject from *Value* to *Mechanism*.

  Hedonism is a theory about *well-being* (what makes life go better). The "reward system" is a theory about *learning* (what makes an organism repeat behavior). These come apart.
  1.  **False Positives:** As seen in the Itch/Addiction cases, the reward system fires for things that do not make us better off and do not feel good (in the hedonic sense).
  2.  **False Negatives:** Contemplating a beautiful sunset might not trigger a dopamine "do it again" spike in the same way a sugar hit does, but it contributes to well-being.
  3.  **The Normative Gap:** Even if we identify the "pleasure circuit," why is firing that circuit *good*? Functionalism describes the engine; Hedonism claims the engine's output is the *point* of the car.

  Functionalism solves heterogeneity by saying, "It doesn't matter what they feel like; they all do the same job." But for a hedonist, what they feel like (or how they are valued) is the whole point. This is a scientific solution to a philosophical problem.

  ### 4. The Hedonism Stakes: Desire Collapse and The Flip
  This is the critical pivot. You asked if Attitudinalism collapses into Desire-Satisfactionism.

  **It absolutely does.**
  If Pleasure = Taking a pro-attitude toward an experience, and The Good = Maximizing Pleasure, then:
  **The Good = Maximizing Pro-Attitudes toward Experiences.**

  This is practically indistinguishable from "The Good = Getting what you want (regarding your own states)."
  *   **Bug or Feature?** For a pure hedonist, this is a **bug**. Hedonism's unique selling point is that *feelings* (or conscious states) are the currency of value, not *success conditions*. If I want to be a great poet but fail, Desire Theory might say I'm worse off. Hedonism says if I enjoyed the writing process, I'm fine. Attitudinal Hedonism blurs this. If I "take pleasure" in writing, I am satisfying a desire.
  *   **The Flip Case:** This is where Attitudinalism shines over Adverbialism. In the Flip case (beer hot vs. cold), the sensory input is identical. Adverbialism has to posit a mysterious change in "manner" without a change in sensation. Attitudinalism says the *attitude* changed. That is metaphysically cheaper. It explains why the *same sensation* can be good or bad: because value isn't in the sensation, it's in the stance toward it.

  ### 5. The Verdict
  You asked me to pick one, identify the winner, and state what is left out.

  **The Winner: The Attitudinal Reply.**
  It is the only one that fully dissolves the heterogeneity objection without metaphysical hand-waving. It explains why wildly different experiences (beer, proof, back rub) can all be "good": not because they share a magical "pleasure particle" or a mysterious "adverbial glow," but because the subject relates to them in the same normative way (intrinsic pro-attitude). It handles the Flip case cleanly and offers a clear account of value.

  **Where it is Weaker:**
  It loses the Itch case. It cannot easily distinguish between the pleasure of a back rub and the relief of scratching poison ivy without importing ad-hoc distinctions about "intrinsic" vs. "instrumental" desire that often collapse under pressure.

  **What All Three Leave Out:**
  They all struggle to capture the **passivity** of pleasure.
  *   Adverbialism makes it a "way of experiencing" (active).
  *   Attitudinalism makes it a "stance/desire" (active/conative).
  *   Functionalism makes it a "signal" (mechanistic).

  But often, pleasure *happens to us*. We are struck by beauty; we are overcome by joy. We don't always "take an attitude." The attitudinal view risks making pleasure sound like a judgment or a choice.

  **Final Recommendation:**
  If your goal is to save **Hedonism as a theory of value** (i.e., make it defensible against logical objections), adopt **Attitudinalism**. It answers the heterogeneity objection decisively. But you must accept that you are no longer a "Feeling Hedonist"; you are a "Mental State Hedonist" who has moved dangerously close to Desire Satisfactionism.

  If your goal is to save **Hedonism as a phenomenological claim** (i.e., that life is about how things *feel*), stick with **Adverbialism**, but admit it is metaphysically mysterious. It preserves the intuition that the itch is not pleasure, which Attitudinalism fails to do.

  **My advice:** Drop the label "Hedonism." The heterogeneity objection proves that "pleasure" is not a natural kind that can do the work hedonists want it to do. The Attitudinal view is the best philosophical repair job, but it repairs the theory by turning it into something else (a hybrid of Desire and Mental State theory). If you want a theory of well-being, Attitudinal Hedonism is the strongest of the three, provided you patch the Itch case by distinguishing *endorsement* from *compulsion*. If you can't make that distinction stick, the view fails. But compared to the emptiness of Adverbialism and the subject-change of Functionalism, it's the only one still playing the same game.
