answer: |-
  **Exam Question**

  **Course:** PHIL 450: Philosophy of History
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question:**
  Consider a historian arguing that a specific political revolution was causally overdetermined. She identifies three antecedent conditions: (1) organizational readiness, (2) institutional collapse, and (3) widespread popular exhaustion. She contends that each condition was individually sufficient to produce the revolutionary outcome, yet insists all three must appear in the explanation because omitting any one alters the narrative structure and explanatory coherence of the account, even though the counterfactual outcome remains unchanged.

  Assess whether this position coherently describes historical overdetermination or whether it illegitimately conflates causal redundancy with what might be termed narrative-constitutive multiplicity. In your response, you must:
  1.  Propose explicit criteria for distinguishing a genuinely overdetermined historical cause from a factor that is merely narratively indispensable but causally redundant.
  2.  Apply those criteria to at least one of the three conditions named above.
  3.  Evaluate whether this distinction can be sustained in practice without collapsing back into a simple sufficiency test.

  ***

  **Model Answer**

  The historian's position presents a category error between ontological causality and epistemological narration. To assess it, we must first distinguish causal overdetermination from joint causation. In joint causation, multiple factors are jointly necessary and sufficient; remove one, and the effect fails. In classic overdetermination (e.g., two shooters firing simultaneously), multiple sufficient causes exist, yet the effect occurs even if any single cause is removed. The historian claims the latter but demands the explanatory weight of the former.

  The specific conflation here lies in treating narrative necessity as causal necessity. The historian admits the counterfactual outcome is unchanged if one condition is removed; this confirms causal redundancy. However, she insists on including all three for "narrative structure." This conflates causal redundancy with narrative-constitutive multiplicity. A factor can be causally redundant (the revolution happens without it) yet narratively indispensable (the story makes no sense without it). By labeling this overdetermination, she obscures the difference between what made the event happen and what makes the explanation intelligible.

  To distinguish these, we need a criterion based on mechanism activation versus story coherence. A genuinely overdetermined cause must activate a distinct causal mechanism capable of producing the effect independently in the actual world. A narratively indispensable factor merely stabilizes the explanatory framework without activating a unique mechanism in the specific instance. We can call this the "Independent Mechanism Criterion" (IMC). Under IMC, a factor is causally overdetermining only if there is evidence that its specific causal pathway was active and sufficient, regardless of other pathways. If a factor is included solely to maintain thematic continuity or moral arc, it fails the IMC, marking it as narrative-constitutive.

  Applying the IMC to "institutional collapse": If the state's fiscal bankruptcy alone triggered the revolution via elite defection, regardless of popular exhaustion, then fiscal bankruptcy satisfies the IMC. However, if the historian includes "popular exhaustion" solely to explain why the revolution was *just* or *inevitable* in hindsight, despite evidence that elite defection alone sufficed, then popular exhaustion fails the IMC. It is narratively indispensable for a "people-centered" account but causally redundant regarding the outcome. The historian's error is treating the thematic requirement of "the people" as a causal sufficiency condition.

  Can this distinction be sustained without collapsing into a simple sufficiency test? A serious objection arises regarding epistemic access. Historians rarely observe mechanisms directly; they infer them from outcomes. If we cannot observe the mechanism independent of the outcome, distinguishing "active sufficient mechanism" from "narrative placeholder" relies on the same counterfactual reasoning used in sufficiency tests. If we claim a mechanism was active because the outcome occurred, we risk circularity. Furthermore, causal mechanisms in history are often intertwined; "organizational readiness" may rely on "institutional collapse" to become effective, challenging the independence required by the IMC.

  Despite this, the distinction holds if we broaden evidence beyond outcomes to process tracing. If archival evidence shows organizers mobilized *before* collapse became evident, readiness satisfies the IMC. If evidence shows mobilization only occurred *after* collapse was visible, readiness is likely narrative padding. Thus, the distinction survives not by rejecting sufficiency, but by demanding process-based evidence of mechanism activation. The historian's position fails because she justifies inclusion via narrative coherence rather than process evidence. Ultimately, maintaining the distinction requires acknowledging that historical explanation serves two masters: causal accuracy and narrative intelligibility. Conflating them yields metaphysically robust claims based on aesthetic necessities. The IMC forces the historian to justify each factor's causal potency independently of its story value, preserving the integrity of overdetermination as a causal concept rather than a literary device.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Characterization of Causal Overdetermination vs. Joint Causation (5 marks)**
  *   **Criteria:** Candidate clearly defines overdetermination (multiple sufficient causes) versus joint causation (conjunctive necessity) within a historical context.
  *   **Common Failure:** Candidates confuse overdetermination with complex multi-causality where all factors are necessary.

  **2. Identification of Conflation (Causal Redundancy vs. Narrative Multiplicity) (5 marks)**
  *   **Criteria:** Candidate explicitly identifies that the historian is mixing ontological sufficiency with epistemological/narrative necessity.
  *   **Common Failure:** Candidates accept the historian's premise that narrative need implies causal weight.

  **3. Formulation of Distinction Criterion (6 marks)**
  *   **Criteria:** Candidate proposes a specific, defensible test (e.g., Independent Mechanism Criterion, process tracing) to separate causal from narrative factors.
  *   **Common Failure:** Candidates propose vague criteria like "importance" or "relevance" without mechanistic grounding.

  **4. Application to Named Condition (5 marks)**
  *   **Criteria:** Candidate rigorously applies their proposed criterion to one of the three specific conditions (readiness, collapse, or exhaustion).
  *   **Common Failure:** Candidates discuss the conditions generally without applying the specific criterion formulated in part 3.

  **5. Critical Evaluation and Objection (4 marks)**
  *   **Criteria:** Candidate evaluates the sustainability of their criterion and acknowledges a serious objection (e.g., epistemic access, mechanism entanglement).
  *   **Common Failure:** Candidates assert the criterion works perfectly without addressing limitations or potential collapse into sufficiency testing.
