  I'm not asking for a bibliography, just your sense of prioritisation. Should the field double down on formalising non-adjunctive proof theories — the ones that block explosion but keep useful fragments of classical logic intact? Or is the real bottleneck metaphysical: figuring out whether true contradictions are even coherent in a non-trivial sense, especially with that structural framing in the mix? Then there's the applied angle — using paraconsistent belief revision for AI or legal reasoning — which sounds useful but might depend on answers to the formal questions first.

  So: rank these (and any others you think are upstream) by what deserves limited effort now. What's genuinely settled (e.g., that paraconsistent logics exist and avoid triviality) versus what's still contested among people who actually work on this? Which questions are upstream of others — like, would settling the metaphysical status change whether applied work is even worth trying? And where would you deprioritise, either because it's intractable with current tools or because the answer wouldn't shift much downstream?

  Please write in British English, and be clear about what's consensus and what's genuinely disputed — don't present a contested view as if everyone agrees. Also, I want you to be honest about how committed you are to each ranking: separate the parts where you're fairly sure from the parts where you're just guessing or leaning on intuition.
