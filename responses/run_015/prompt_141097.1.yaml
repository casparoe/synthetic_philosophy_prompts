answer: |-
  Julian notices his elderly neighbor, Mr. Henderson, struggles with heavy groceries while remaining in static health—frail but not deteriorating. Once, Julian carries them up; it is kind, optional, and costless. Henderson mentions he usually calls his daughter, but she's busy. Julian, enjoying the interaction, returns the next week to help again, and then the next, establishing a rhythm over eighteen months. Henderson, relying on Julian's reliable kindness, declines a subsidized meal service and stops asking his daughter, assuming Julian's presence is a stable feature of his week. Julian never promises to return, accepts no payment, and Henderson's health remains static throughout. However, by month eighteen, Julian has knowingly become Henderson's sole lifeline; if Julian were to simply cease appearing tomorrow, Henderson would face immediate hunger and isolation not because his condition worsened, but because Julian's prior optional acts displaced other viable support systems. At this terminus, Julian is morally blamed for stopping, not for breaking a promise, but for abandoning a dependency he voluntarily cultivated without ensuring a safety net.

  **Analysis of Accounts**

  **(i) Standard Token-Level Account:** This account evaluates acts individually relative to their specific context. For the early tokens (months 1–6), the context includes available alternatives for Henderson; Julian's omission is permitted and blameless, while performance is praiseworthy, satisfying the definition of supererogation. For the late tokens (months 17–18), the context has shifted: Julian's prior actions have eliminated Henderson's safety net. In this new context, omitting the act causes harm that Julian is now responsible for preventing. Thus, the late tokens are obligatory; omitting them is impermissible and blameworthy. The verdict is that supererogation obtains initially but evaporates into duty as the sequence progresses.

  **(ii) Course-of-Action Account:** This account evaluates the temporally extended sequence as a single unit of agency. The verdict is that the **sequence as a whole was never supererogatory**. A rational agent must foresee that establishing a rhythm of reliance without commitment creates a moral trap. By initiating a pattern that he could not permissibly break, Julian entered a project that was obligatory to complete once begun. Therefore, the sequence cannot be classified as supererogatory because the agent did not have the permission to omit the *whole* course of action once the dependency was established, and he bears responsibility for having entered that trajectory without a plan to sustain it. The "supererogatory" intuition is an error of myopic evaluation.

  **(iii) Sacrifice Condition:** This account holds that no act is supererogatory unless it involves significant cost. The verdict is that **no individual step counts as supererogatory**, as carrying groceries is a trivial favor, not a significant sacrifice. However, this account must explain the final blame by appealing to the *aggregate* cost. The duty arises only when the cumulative sacrifice crosses the threshold of significance. Thus, while the early steps are merely polite favors, the sequence eventually generates a duty because the total cost to Julian (and risk to Henderson) becomes substantial. The account preserves the duty at the end but denies the moral weight of the individual steps.

  **Closing**

  The single feature doing the work is **induced reliance through the displacement of alternatives**. If this feature is removed—for instance, if Henderson kept the subsidized meal service *alongside* Julian's help—Julian could stop at any time without blame, collapsing the case back into an ordinary, repeatable instance of supererogation where the agent remains free to omit future tokens. The strongest line of attack comes from the **Sacrifice Condition (iii)**, which would press: "You mistake aggregation for transformation. The early acts *were not* morally weighty enough to be supererogatory; they were trivial. The duty at the end arises only because the *total* cost finally crossed the significance threshold. My account explains the duty without inflating the moral status of trivial favors, whereas your case relies on the false intuition that cheap acts accumulate moral status rather than just cumulative consequences."
