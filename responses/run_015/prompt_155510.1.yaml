  **Scenario**

  Elena sits at her desk after the team meeting. Her colleague, Mark, has just presented her design as his own. She opens her notebook and compares the sketches. She writes in the margin: "This is theft. He violated the agreement." She signs her name below it. Her breathing is shallow; her shoulders are raised tight against her ears. She closes the notebook, removes Mark from the project distribution list, and declines the invitation to the celebratory drink. She focuses entirely on the policy violation. The room looks ordinary; the email on her screen looks like neutral text. She notices only the tightness in her muscles.

  ***

  **Verdicts and Reasoning**

  **(i) Judgment Theory: YES.** Elena explicitly endorses the evaluative proposition that she has been wronged ("This is theft"), committing to it by writing and signing it. Since the theory defines emotion as an endorsed evaluative judgment, the condition is met.

  **(ii) Perceptual Theory: NO.** The situation does not perceptually appear insulting or wrongful to Elena; the room looks ordinary and the text neutral. Because the evaluative property is concluded rather than perceptually presented, the necessary condition for emotion is absent.
  **(ii) Somatic Variant: NO.** Although Elena feels bodily tension, she notices it merely as tightness, not as carrying evaluative content. Since the bodily change does not present the situation as offensive, the somatic variant also denies the emotion.

  **(iii) Feeling Theory (Jamesian): YES.** Elena notices a specific pattern of bodily change (shallow breathing, raised shoulders). Since the theory constitutes emotion as the perception of such physiological disturbances, the emotion is present regardless of the neutral visual appearance.

  **(iv) Affordance-Priority Theory: YES.** Elena's field of action is re-ranked: collaboration and socializing with Mark are now deprioritized (removal from list, declining drinks). Since this shift in action-solicitation occurs without requiring evaluative seeming, the emotion is present.

  ***

  **The Single Feature and Recalcitrance**

  The feature doing the work is the **dissociation of evaluative judgment from evaluative appearance** (the "coldness" of the scene). When this feature is removed—i.e., if the room *felt* hostile and the email *looked* aggressive—the Perceptual verdict flips to YES, and all four views converge. The case then collapses into a **Standard Paradigm Case** of emotion. To turn this into a **Recalcitrance Case** (the mirror image), one must subtract the **Judgment** (Elena decides it was *not* theft) while restoring the **Appearance** (the situation *seems* insulting). This yields the recalcitrant structure: Emotion YES (Perceptual/James/Affordance) but Judgment NO.

  ***

  **Strongest Objection from (ii)**

  **Objection:** "You cannot have sustained avoidance and muscular tension directed at a specific person without the situation *appearing* threatening or offensive. The bodily tension *is* the way the offense presents itself somatically; to feel the tightness *is* to feel the wrong."
  **Blocking Feature:** The scenario stipulates that Elena notices the tightness *only* as tightness, while the external scene remains neutral. This blocks the objection for the non-somatic view (which requires world-directed appearance) but leaves the Somatic Variant vulnerable. I must note plainly: **This objection succeeds against the Somatic Variant** if one holds that bodily feelings inherently carry evaluative content, forcing that specific verdict to flip to YES.

  ***

  **Marking Note**

  **Required:** A fully correct answer must map specific textual facts (e.g., "neutral text," "writes 'theft'") to the necessary conditions of each view, rather than summarizing the theories abstractly.
  **Partial-Credit Error:** A strong student may correctly identify the verdicts but err by conflating the Jamesian "feeling of bodily change" with the Perceptual "feeling of evaluative content," arguing that the muscle tightness satisfies view (ii). This misunderstands the intentionality requirement distinct to Perceptual Theory.
