prompt: |-
  I'm taking a political theory seminar and we just did a two-week unit on moral revolutions — Williams's argument that nobody in the ancient Mediterranean world could have been argued out of slavery, because the concepts you'd need to even mount the argument weren't in the repertoire yet, and then Appiah's book on moral revolutions (the one with dueling, footbinding and Atlantic slavery) saying that what actually ends practices like these is a shift in the honor code rather than anybody being persuaded. My roommate, who does econ and loves being insufferable, took those two together and built what he calls the argument-proofness test: a practice is argument-proof at a time if there is no argument from premises its participants already accept that gets you to the conclusion that the practice is wrong; on that definition both slavery and dueling were argument-proof right up until the moment they collapsed; therefore moral argument never does any causal work, it's just the noise people make while interests and honor shift underneath, and if you want to change something the rational move is to stop arguing and go straight to making the practice unprofitable or embarrassing.

  The problem is I half believe him, and it's messing with something I actually care about. I used to march in a college band, and the hazing there is defended entirely in honor terms — we're a family, what we put the new kids through is what makes the bond real, anyone who complains is weak — and every safety or dignity argument I make just bounces off, because from inside that little honor world the premises aren't available. So, before I spend the next couple of years either arguing with my old section mates or instead just trying to get the thing banned and uncool: is the argument-proofness test actually Williams's claim, or have we smuggled something in?

  Concretely, I can't tell whether no argument was available from inside their outlook really implies that argument did no work in the change — surely somebody has to build the new premises, and doesn't that count as argument doing something? And I can't tell whether Appiah's honor mechanism means reasons are epiphenomenal, or whether argument can be one of the things that rewrites an honor code — and if it can, who has to be listening for it to do any work, the people actually doing the practice or the bystanders who's respect they want? Also, my roommate's version seems to slide toward saying slavery was fine for the people who practiced it, which I really don't want to be committed to, but I can't put my finger on where exactly the slide happens. And last thing: if interests, honor and argument all show up in every one of these cases, how would you even tell which one did the work, or is that question just badly posed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Political theory seminar, unit on moral revolutions (Bernard Williams & Kwame Anthony Appiah).
      *   **Roommate's Claim ("Argument-Proofness Test"):**
          *   Definition: A practice is argument-proof if no argument from *existing* premises leads to the conclusion it's wrong.
          *   Observation: Slavery and dueling were argument-proof until they collapsed.
          *   Conclusion: Moral argument does no causal work (it's epiphenomenal noise). Real change comes from making practices unprofitable or embarrassing (interests/honor).
          *   Advice: Stop arguing, start banning/making uncool.
      *   **User's Dilemma:** Half-believes the roommate. Wants to stop hazing in their old college band. Hazing is defended via honor codes ("family," "bond," "weakness"). Safety/dignity arguments bounce off.
      *   **Specific Questions/Doubts:**
          1.  Is the "argument-proofness test" actually Williams's claim, or is something smuggled in?
          2.  Does "no argument available from inside outlook" imply "argument did no work in change"? (What about building new premises?)
          3.  Does Appiah's honor mechanism mean reasons are epiphenomenal, or can argument rewrite honor codes? (Who is listening: practitioners or bystanders?)
          4.  Roommate's view seems to imply slavery was "fine for them" (relativism/justification). Where is the slide?
          5.  How to distinguish the causal work of interests, honor, and argument? Or is the question badly posed?

  2.  **Deconstruct the Philosophical Claims:**

      *   **Bernard Williams ("The Women of Trachis" / *Shame and Necessity*):**
          *   *Claim:* Ancient Greeks couldn't be argued out of slavery because the conceptual repertoire (universal human rights, equality) didn't exist.
          *   *Nuance:* Williams isn't saying argument is useless *ever*. He's saying conceptual change is a prerequisite for certain moral arguments. He acknowledges "thick" ethical concepts change over time.
          *   *Roommate's Distortion:* Williams describes a *limit condition*, not a universal law of moral change. The roommate turns a description of conceptual limitation into a prescription for action (don't argue).

      *   **Kwame Anthony Appiah (*The Honor Code*):**
          *   *Claim:* Honor codes drive moral change (dueling, footbinding, slavery). People care about being respectable.
          *   *Nuance:* Appiah does *not* say argument is irrelevant. He says argument works *through* honor. Arguments reshape what is honorable. The "script" changes.
          *   *Roommate's Distortion:* Appiah says honor is the *engine*, not that reason is the *exhaust*. The roommate treats honor and reason as mutually exclusive.

      *   **The "Argument-Proofness Test":**
          *   It's a static snapshot of a dynamic process. It ignores the fact that arguments *create* new premises.
          *   It conflates "internal validity" with "causal efficacy."
          *   It commits the fallacy of assuming the audience for moral argument is always the practitioner. Often, it's the bystander/society.

  3.  **Address the User's Specific Questions:**

      *   **Q1: Is this Williams's claim?**
          *   No. Williams is describing *conceptual possibility*, not *causal inefficacy*. He's saying you can't deduce modern conclusions from ancient premises. He isn't saying discourse doesn't shift premises.
      *   **Q2: Does "no argument available" imply "argument did no work"?**
          *   No. Argument is often the tool that *builds* the new premises. Persuasion isn't just deduction; it's reframing.
      *   **Q3: Appiah & Honor vs. Reason:**
          *   Argument rewrites honor codes. The audience matters. Often, you argue to the *bystanders* (who withdraw respect), which forces the *practitioners* to stop. You don't need to convince the hazer that hazing is wrong; you need to convince the crowd that the hazer is a jerk.
      *   **Q4: The "Slavery was fine for them" Slide:**
          *   This is the move from *explanation* to *justification*. Understanding why they did it (conceptual limitation) $\neq$ saying it was morally okay. The roommate is conflating *internal rationality* with *external validity*.
      *   **Q5: Distinguishing Causes (Interests, Honor, Argument):**
          *   They are entangled. Argument shapes honor; honor shapes interests. It's an ecosystem. Asking "which one did the work" is often a category error.

  4.  **Formulate the Advice for the Hazing Situation:**
      *   The roommate's advice (stop arguing, make it uncool) is actually partially right, but for the wrong reasons.
      *   Don't argue safety/dignity *to the hazers* if their framework rejects those premises.
      *   Argue to the *community* (alumni, administration, broader student body) to shift the honor code. Make hazing shameful, not "tough."
      *   Argument *is* the tool to shift the honor code, but the target audience must change.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Empathetic, intellectually rigorous, validating the user's unease.
      *   *Structure:*
          1.  Validate the intuition (the roommate is half-right but dangerously wrong).
          2.  Correct the reading of Williams (Conceptual horizons vs. Causal inertness).
          3.  Correct the reading of Appiah (Honor as the medium, not the enemy of reason).
          4.  Address the "Slavery was fine" slide (Internal vs. External validity).
          5.  Address the Causal Web (It's not A vs. B).
          6.  Practical Application (The Hazing Case).

      *   *Key Insight to Highlight:* The roommate treats moral argument as *deductive logic within a fixed system*. Real moral argument is *system-building*. It changes the premises.
      *   *Key Insight on Audience:* Appiah emphasizes that honor is social. You don't convince the duelist; you convince the society that stops clapping for him.

  6.  **Refining the "Slavery was fine" point:**
      *   This is crucial. The user is worried about relativism.
      *   Need to distinguish between *explanatory adequacy* (why they thought it was okay) and *normative justification* (whether it was actually okay). Williams allows for "proleptic" truths—things that are true even if they can't be formulated yet.

  7.  **Refining the Hazing Advice:**
      *   Don't tell the user to stop arguing entirely. Tell them to argue *differently*.
      *   Target the "honor" premise. Is it really honorable to abuse power? Is it really "family" if it hurts?
      *   Target the bystanders.

  8.  **Final Polish:** Check against the user's specific phrasing ("argument-proofness test," "smuggled something in," "epiphenomenal"). Ensure the philosophical distinctions are clear but accessible. (Self-Correction: Make sure not to get too bogged down in Williams exegesis; keep it relevant to the roommate's specific formulation).

  9.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  Your roommate has built a very seductive machine, but he has greased the gears with a category error. He is treating moral argument like a mathematical proof inside a fixed axiomatic system, when in reality moral argument is often the process of *changing the axioms*.

  You are right to be uneasy. The "argument-proofness test" is not Williams's claim, it is a distortion of it, and it leads to a cynical paralysis that misunderstands how Appiah thinks honor actually works.

  Here is how to dismantle the test, where the slide into relativism happens, and what you should actually do about the hazing.

  ### 1. Is this Williams's claim? (The Smuggle)
  No. Williams's point in *Shame and Necessity* (and related essays) is about **conceptual horizons**, not causal inertness.

  When Williams says the ancient Greeks couldn't be argued out of slavery, he means there was no *deductive* path from their existing concepts (natural hierarchy, barbarian vs. Greek, oikonomia) to the conclusion "slavery is unjust." He is describing a limit of *internal consistency*.

  Your roommate smuggles in a causal claim: that because an internal deductive path didn't exist, *discourse* did no work. But Williams acknowledges that concepts change. How do they change? Through friction, through new experiences, and yes, through argument that stretches language until it snaps and reforms.

  **The Error:** Your roommate assumes the "premises participants accept" are static. But moral argument is often **premise-building**. When abolitionists argued against slavery, they weren't just deducing conclusions from slaveholders' premises; they were introducing new premises (universal human dignity, the moral weight of suffering) and demanding they be accepted. If you define "argument" narrowly as "deduction from existing axioms," then of course argument never changes anything. But that isn't what argument *is*.

  ### 2. Appiah and the Honor Code (Epiphenomenal?)
  Your roommate reads Appiah as saying: *Honor moves the world; reasons are just the story we tell afterward.*
  Appiah actually says: *Honor moves the world; reasons are the tools we use to rewrite the honor code.*

  In *The Honor Code*, Appiah is careful to show that the decline of dueling wasn't just "people got embarrassed." It was that arguments successfully **re-coded** what was honorable.
  *   **Old Code:** Refusing a duel = Coward.
  *   **New Code:** Insisting on a duel = Thug/Criminal.

  Did argument do work? Yes. But who was the argument for? This is your crucial question: **"Who has to be listening?"**
  Appiah's insight is that you often don't need to convince the *practitioner*. You need to convince the *audience* whose respect the practitioner craves. If the crowd stops clapping, the duelist stops dueling. The argument targets the social ecosystem, not just the individual conscience.

  **The Verdict:** Reasons are not epiphenomenal; they are the software update for the honor operating system. But you have to be targeting the right users (the bystanders, not just the admins).

  ### 3. The "Slavery Was Fine For Them" Slide
  This is the most dangerous part of your roommate's view. He is sliding from **explanatory internalism** to **normative relativism**.

  *   **Williams's View:** We can explain why a Greek thought slavery was necessary using *their* concepts. We can also say they were wrong using *ours*. Williams allows for "proleptic" truths—things that are true even if the vocabulary to state them hasn't been invented yet.
  *   **Roommate's Slide:** By saying "no argument was available from inside their outlook," he implies that without that argument, the practice was rational/acceptable *for them*.

  **Where the slide happens:** He confuses **intelligibility** with **justification**.
  It is *intelligible* why a Greek owned slaves (given their concepts). It is not *justified* (given the actual moral facts, which exist independently of their concepts).
  If you accept your roommate's test, you have to say that before 1750, it wasn't just that people *thought* slavery was okay, but that it *was* okay relative to their conceptual scheme. That is a moral horror you should reject. The lack of an argument proves a lack of imagination, not a lack of wrongness.

  ### 4. Interests, Honor, and Argument (The Causal Web)
  Your last question: *How do you tell which one did the work?*
  Often, you can't, because they are entangled.
  *   **Argument shapes Honor:** (e.g., "Real men don't beat their wives" becomes a new honor norm).
  *   **Honor shapes Interests:** (e.g., If dueling makes you a pariah, it hurts your business interests).
  *   **Interests shape Argument:** (e.g., Industrial capitalism made slavery less profitable, which made anti-slavery arguments more listenable).

  Asking "which one did the work" is like asking whether the engine or the fuel made the car move. Your roommate wants to isolate variables in a way that social reality doesn't allow. He privileges "interests" as the "real" cause because they seem material, but interests are defined by what people value, and values are defined by honor and argument.

  ### 5. What do you do about the Hazing?
  Your roommate's advice ("stop arguing, make it unprofitable/embarrassing") is actually **half-right**, but for the wrong reasons.
  *   **He is right that:** Arguing safety/dignity *to the hazers* using *your* premises won't work if their honor code values "toughness" over "safety." To them, your argument sounds like weakness.
  *   **He is wrong that:** You should stop arguing. You should just change *who* you are arguing to.

  **The Strategy:**
  1.  **Don't argue premises they reject.** Stop telling them "it hurts people." They know. They think the hurt is the point.
  2.  **Attack the Honor Claim.** Argue *within* their value system. Is it really "strong" to abuse someone who can't fight back? Is it really "family" if you traumatize your siblings? Reframe the hazing not as "tough love" but as "bullying disguised as tradition." Make *them* feel shame, not guilt.
  3.  **Target the Bystanders (The Appiah Move).** The hazers care about the respect of the alumni, the university, and the other students.
      *   Make hazing uncool *publicly*.
      *   If the "audience" withdraws respect, the "performers" stop performing.
      *   Use argument to persuade the *administration* and the *alumni* that this band is a liability, not a legacy.
  4.  **Make it Unprofitable.** Your roommate is right here. If the band gets suspended, if funding gets cut, if recruitment drops because parents hear it's abusive, the practice dies. But often, *argument* is what triggers those consequences (e.g., arguing to the Dean that this is a liability).

  ### Summary
  Your roommate's "Argument-Proofness Test" is a static snapshot of a dynamic movie. It assumes moral concepts are fixed furniture, when they are actually clay.

  *   **Williams** says you can't deduce new morals from old concepts. He doesn't say you can't make new concepts.
  *   **Appiah** says honor drives change. He doesn't say reason is irrelevant; reason tells us what to honor.
  *   **You** should not stop arguing. But stop arguing to the wall. Argue to the room. Shift the honor code by making the practitioners look small, not by making the victims look sad.

  The practice isn't argument-proof. Your roommate is just defining "argument" in a way that guarantees it fails. Don't let him talk you out of using your voice; just aim it at the people whose respect actually keeps the tradition alive.
