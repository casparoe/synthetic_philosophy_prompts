  Here is the consistency audit, ranked by severity.

  ### 1. Analysis of Tensions

  **Genuine Tension: (1) vs. (5) [Severity: High]**
  *   **The Conflict:** Commitment (1) asserts that names refer "not via any contingent description." Commitment (5) asserts that when a description fails to uniquely denote (e.g., a tie for "tallest person"), a name can still be established by anchoring to the "speaker's intended object."
  *   **Why it's a problem:** If the description fails to uniquely denote, what picks out the "intended object"? If the answer is "the speaker's mental intention," you are smuggling a Fregean sense or a descriptive condition ("the one I am thinking of") back into the mechanism of reference fixation. This undermines the anti-descriptivist core of (1). In standard Causal Theory, if the baptismal description fails and there is no ostensive gesture, the name fails to refer. Claim (5) suggests intention can override descriptive failure, which threatens the public, causal nature of the name established in (1).
  *   **Cheapest Revision:** Weaken (5). Distinguish between *speaker reference* (what the speaker intends) and *semantic reference* (what the name actually denotes). Admit that in cases of descriptive failure without ostension, the *name* may fail to secure a semantic referent, even if the speaker successfully communicates via intention.

  **Genuine Tension: (4) vs. (7) [Severity: Medium]**
  *   **The Conflict:** Commitment (4) definitively categorizes mythical names ('Vulcan') as "empty rigid designators." Commitment (7) hedges on fictional names ('Holmes'), offering a disjunction: they are *either* empty rigid designators *OR* names of mental representations.
  *   **Why it's a problem:** There is no metaphysical distinction between a mythical entity (hypothesized to exist but doesn't) and a fictional entity (stipulated not to exist). Treating 'Vulcan' as definitely an empty rigid designator while leaving 'Holmes' ambiguous creates an unprincipled asymmetry in your ontology of non-existents.
  *   **Cheapest Revision:** Align (7) with (4). Commit to the view that fictional names are also empty rigid designators (or adopt the mental representation view for both). Eliminate the disjunction to ensure uniformity across non-referring terms.

  **Apparent Tension: (4) vs. (6) [Severity: Low / Dissolves]**
  *   **The Conflict:** (4) calls empty names "rigid designators," while (6) says terms like 'Caloric' "never referred at all." colloquially, a "designator" designates something.
  *   **Why it dissolves:** This is a terminological friction common in Neo-Kripkean semantics (specifically Salmon's). You can maintain that a term has *semantic content* (it is a designator with a modal profile) without having an *extension* (a referent). The proposition expressed is "gappy." As long as you explicitly endorse a "gappy proposition" semantics, these claims are compatible.
  *   **Cheapest Revision:** No revision needed, but clarify in your audit that you are adopting a semantic framework where "designator" does not entail "successful reference."

  **Apparent Tension: (1) vs. (4) [Severity: Medium / Theoretical]**
  *   **The Conflict:** (1) says names are not rigid via descriptions. (4) says empty names are rigid. But if an empty name has no causal anchor in the actual world, what grounds its trans-world identity? Usually, it is the description associated with the myth (e.g., "the planet causing the perturbation").
  *   **Why it's manageable:** Proponents of empty rigid designators argue that the rigidity is *stipulated* at the baptism of the theoretical term, not derived from the satisfaction of the description. However, this is the most metaphysically demanding part of your profile.
  *   **Cheapest Revision:** Ensure your explanation of (4) emphasizes *stipulative rigidity* rather than descriptive rigidity to maintain consistency with (1).

  ### 2. Ranking of Real Tensions

  1.  **(1) vs. (5):** This is the most damaging. It threatens the foundational anti-descriptivist mechanism of your entire profile.
  2.  **(4) vs. (7):** This is a structural inconsistency in your ontology of non-existents. It makes your profile look ad hoc.
  3.  **(1) vs. (4):** This is a deep theoretical tension regarding the source of modal profiles for empty terms, but it is defensible within your chosen framework.

  ### 3. The Single Best Revision

  **Revision:** **Drop or Weaken Commitment (5).**

  **Why:**
  Commitment (5) is the outlier. Commitments (1), (2), (3), (4), (6), and (7) form a tight cluster consistent with a Salmon/Soames-style Neo-Kripkeanism. Commitment (5) introduces a mechanism (intention anchoring in the face of descriptive failure) that leans toward Descriptivism or a complex Speaker-Reference theory that conflicts with the semantic externalism of (1).

  By revising (5) to state that *semantic reference* fails when the description fails uniquely (unless there is an independent causal baptism), you protect the integrity of (1). You can still acknowledge that *communication* might succeed via speaker intention, but you preserve the claim that the *name itself* does not refer via description.

  **Cost:**
  You lose the ability to say that a name is semantically established in cases of descriptive ambiguity solely through intention. You must admit that in cases like the "tallest person tie," if no causal baptism occurred, the name is semantically empty or ambiguous until the ambiguity is resolved. This is a standard cost of rigid causal theories.

  ### 4. Audit Confidence & Uncertainty

  **Confidence Level:** **High (85%)**
  The profile is philosophically literate and internally consistent *provided* one accepts the specific semantic machinery of "empty rigid designators" (Salmon/Soames). The tensions identified are standard fault lines in this specific school of thought.

  **Least Sure Claim:** **Commitment (4).**
  I am least certain about the coherence of "Empty Rigid Designators" without *any* descriptive backing. While Salmon argues that the name itself carries the modal profile stipulatively, many philosophers (including Evans and later Kripke) argue that without an actual referent to anchor the causal chain, the term lacks the semantic content required to be a "designator" across worlds. If (4) fails, it cascades into (6) and (7). However, since you have explicitly built your profile around this view, it is internally consistent *if* that metaphysical bet pays off. The tension between (1) and (5) is a logical conflict; the tension surrounding (4) is a metaphysical gamble.
