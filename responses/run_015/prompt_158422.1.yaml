answer: |-
  **Exam Question**

  **Module:** Metaphysics of Art and Material Culture
  **Time Allowed:** 75 minutes
  **Total Marks:** 20

  **Question:**
  It is sometimes proposed that the puzzle of material constitution dissolves if we treat 'statue' not as a material object, but as a functional kind defined by its conservation history (for instance, how it is maintained, restored, or presented). Critically evaluate this claim. In your answer, you must address what happens when constituent parts are temporarily removed and replaced, and explain why the functional description might take precedence over the material description without simply appealing to technical labels.

  ***

  **Model Answer**

  Treating the statue as a functional kind defined by conservation history offers a promising route to dissolving the constitution puzzle, but it does not eliminate the metaphysical tension entirely; rather, it shifts the burden from material continuity to normative practice.

  The core of the constitution puzzle is that the statue and the clay appear to occupy the same space at the same time yet have different persistence conditions. If the statue is defined by its conservation history, its identity is tied to the intentions and actions of preservers rather than the strict continuity of its matter. On this view, the statue is not identical to the clay because the clay persists through changes that would destroy the statue (such as being crushed), and the statue persists through changes that would alter the clay (such as replacement of parts during restoration). This suggests they are distinct entities, avoiding the claim that one object is two things. However, this risks multiplying entities unnecessarily unless we can explain why the functional kind is the primary object of reference.

  The challenge arises when considering temporary changes to the material. Suppose a brick is removed from a sculpture for analysis and replaced an hour later. If the statue is a functional kind, it survives this interruption because the conservation history remains unbroken; the removal was part of its maintenance. The clay, however, might be viewed as having a gap in its spatial continuity. If we insist the statue survives while the specific arrangement of clay does not, we must explain why the functional description overrides the material one. This is not merely a linguistic choice but a metaphysical claim about which properties are essential.

  To explain why the functional description takes precedence, one must appeal to the conditions under which we individuate objects. The functional kind dominates because it captures the reasons for the object's existence and preservation. We care about the statue as a work of art, not as a lump of matter. Therefore, the criteria for identity are governed by the practices of the artworld and conservation, not by mereological sums. When parts are replaced, the functional kind persists because the role is fulfilled, whereas the material collection may not persist if strict spatiotemporal continuity is required for material objects.

  However, this does not fully dissolve the puzzle. It merely relocates it. We still face the question of co-location: is there still a lump of clay where the statue stands? If the functional kind is real, and the material kind is real, we still have two things in one place. The functional view helps us prioritise which object matters for our purposes, but it does not strictly deny the existence of the clay. Thus, the puzzle is pragmatically dissolved for the philosophy of art, but the underlying metaphysical problem of coincidence remains unless one denies the existence of the material object altogether when the functional kind is present.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Pass Mark:** 10

  | Point | Criteria | Marks | Typical Candidate Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Articulation of the Functional View:** Clearly explains how defining the statue by conservation history alters its persistence conditions compared to the clay. | 4 | Conflating the functional role with the physical material, treating them as identical. |
  | **2** | **Impact on Constitution:** Analyses whether this view resolves the co-location problem or merely shifts the burden of explanation. | 4 | Assuming co-location is automatically solved without arguing for the status of the clay. |
  | **3** | **Temporary Parts Engagement:** Addresses the scenario of temporary removal/replacement and its effect on identity conditions for both kinds. | 4 | Treating temporary removal as permanent destruction for both the statue and the clay. |
  | **4** | **Dominance Argument:** Explains why the functional description overrides the material one (e.g., via intention or practice) without relying on jargon. | 4 | Asserting one description wins without providing a criterion for why it dominates. |
  | **5** | **Conclusion & Coherence:** Provides a reasoned verdict on whether the puzzle dissolves and maintains argumentative consistency throughout. | 4 | Failing to take a stance or contradicting premises established in the introduction. |

  ***

  **Notes for Markers**

  *   **British English:** Ensure candidates use British spelling (e.g. 'analyse', 'colour', 'programme') and punctuation conventions (e.g. full stops outside quotation marks).
  *   **Jargon:** Candidates should not be penalised for using standard terms (e.g. 'sortal', 'mereology') provided they define them, but higher marks are awarded for explaining the *concepts* rather than name-dropping authorities.
  *   **Originality:** Look for arguments that engage with the specific 'conservation history' angle rather than reciting standard textbook positions on the Statue and Clay.
