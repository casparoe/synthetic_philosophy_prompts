answer: |-
  Your professor is correct: the Independence (or Linearity) condition is the structural engine of Harsanyi's theorem, while the Pareto principle is merely the fuel. Your classmate's intuition that Pareto is the controversial normative leap is understandable given the "rights and desert" literature, but in the context of the aggregation theorem's formal architecture, attacking Pareto misses the mathematical source of the utilitarian conclusion.

  Here is the technical case for why the Independence/Linearity condition is doing the heavy lifting, and why a non-utilitarian critique should target it rather than Pareto.

  ### (i) The Weakness of Pareto and Non-Dictatorship
  Taken in isolation, or even in conjunction, the Pareto principle and the non-dictatorship condition are insufficient to generate a weighted-sum social welfare function. They impose order-theoretic constraints but lack the functional specificity to force additivity.

  Consider a Rawlsian **Max-Min** social welfare function:
  $$ W(u_1, \dots, u_n) = \min_{i} \{ u_i \} $$
  This function satisfies **Weak Pareto**: if $u_i(L) \geq u_i(L')$ for all $i$, then $\min_i u_i(L) \geq \min_i u_i(L')$. It also satisfies **Non-Dictatorship**: the social ranking is not determined solely by the preferences of a fixed individual $j$, but by whoever happens to be worst-off.

  Despite satisfying these conditions, Max-Min is manifestly non-utilitarian. It is concave, not linear. It prioritizes equity over efficiency in a way that a weighted sum $\sum a_i u_i$ cannot replicate (unless weights are lexicographic, which violates continuity). The fact that a coherent, non-dictatorial, Pareto-efficient SWF can be non-additive demonstrates that Pareto alone does not rule out prioritarian or egalitarian aggregation. Pareto ensures the social function is monotonically increasing in individual utilities; it does not dictate the curvature of the social indifference curves.

  ### (ii) The Bite of Linearity (Independence)
  The utilitarian conclusion arises specifically because Harsanyi requires social preferences over lotteries to satisfy the von Neumann-Morgenstern (vNM) axioms, specifically the **Independence axiom**. This requires the social welfare function to be linear in probabilities. If $L$ and $L'$ are lotteries over social states, and $W$ represents social preferences, then:
  $$ L \succeq_S L' \iff \mathbb{E}_L[W] \geq \mathbb{E}_{L'}[W] $$
  This implies that for any utility profile vector $\mathbf{u}$, the social evaluation must be an affine transformation of the individual vNM utilities. Mathematically, if individual preferences are represented by $u_i$, and social preferences satisfy vNM independence, there must exist constants $a_i$ and $b$ such that:
  $$ W(\mathbf{u}) = \sum_{i=1}^n a_i u_i + b $$
  The Max-Min rule fails this linearity condition catastrophically. The expectation of a minimum is not the minimum of expectations. Consider two individuals and two states, $s_1$ and $s_2$, with probability $0.5$ each.
  *   State $s_1$: Utilities $(10, 0)$
  *   State $s_2$: Utilities $(0, 10)$

  Let $L$ be the lottery $(0.5 s_1, 0.5 s_2)$.
  *   **Ex-Post Evaluation (Harsanyi/Linearity):** We evaluate the social welfare of each state, then take the expectation.
      $$ W(s_1) = \min(10, 0) = 0 $$
      $$ W(s_2) = \min(0, 10) = 0 $$
      $$ \mathbb{E}[W(L)] = 0.5(0) + 0.5(0) = 0 $$
  *   **Ex-Ante Evaluation (Max-Min of Expectations):** We evaluate individual expected utilities, then apply Max-Min.
      $$ \mathbb{E}[u_1] = 5, \quad \mathbb{E}[u_2] = 5 $$
      $$ W_{\text{ex-ante}}(L) = \min(5, 5) = 5 $$

  Harsanyi's theorem assumes the social preference ordering satisfies vNM axioms, which commits us to the **Ex-Post** evaluation (linearity in probabilities). The Max-Min rule, if it is to respect the Pareto principle on the domain of lotteries, naturally gravitates toward the Ex-Ante evaluation (caring about the distribution of expected welfare). Because $\min(\mathbb{E}[\mathbf{u}]) \neq \mathbb{E}[\min(\mathbf{u})]$, the Max-Min rule violates the Independence axiom required for the social welfare function. It is specifically this linearity requirement that rules out the concave transformations necessary for egalitarianism, forcing the function to be additive.

  ### (iii) The Parallel with Arrow
  The structural role of Independence in Harsanyi is identical to its role in Arrow's Impossibility Theorem, though the outcome differs.

  *   **In Arrow:** We have ordinal preferences. IIA requires that the social ranking of $\{x, y\}$ depends *only* on individual rankings of $\{x, y\}$. This informational constraint prevents the SWF from using intensity or ranking positions (like Borda counts). Combined with Pareto, this informational starvation forces the SWF to be dictatorial.
  *   **In Harsanyi:** We have cardinal vNM utilities. The "Independence" (Linearity) condition requires that the social ranking of lotteries depends *linearly* on the probabilities. This functional constraint prevents the SWF from using curvature (like concavity for equity). Combined with Pareto, this functional restriction forces the SWF to be utilitarian.

  In both theorems, Pareto is a minimal condition of democratic responsiveness that is difficult to reject without abandoning the project of social choice entirely. The "impossibility" in Arrow and the "uniqueness" in Harsanyi are both driven by the **Independence** condition. In Arrow, IIA restricts the *informational base*; in Harsanyi, it restricts the *functional form*. In both cases, it is the assumption that makes the theorem "bite."

  ### Conclusion
  On this analysis, your classmate's Pareto-based objections are **secondary**. While rejecting Pareto would indeed allow one to escape the utilitarian conclusion, it requires abandoning a principle that is far more normatively robust than Linearity. One can coherently accept that "if everyone is better off, society is better off" (Pareto) while rejecting that "society must be risk-neutral over distributions of utility" (Linearity).

  To maintain the Independence/Linearity condition while rejecting utilitarianism, a non-utilitarian would have to **reject the vNM rationality of social preferences**. They would have to argue that society can violate the Independence axiom even if individuals do not—essentially claiming that society is permitted to be risk-averse regarding equity in a way that individuals are not regarding their own welfare. That is the precise locus of the debate: not whether we should respect unanimous improvement (Pareto), but whether social rationality requires linearity in probabilities (Independence). Your professor is right: that is where the whole game is played.
