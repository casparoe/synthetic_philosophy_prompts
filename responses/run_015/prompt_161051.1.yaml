  # Diagnostic Decision Tree: Self-Locating Belief

  **Instructions:** Answer each question based on your intuitive verdict for the described case. Do not worry about consistency with previous answers yet; the tree will map your position.

  ### Node 1: The Standard Incubator
  A machine flips a fair coin.
  *   **Heads:** It creates **one** observer in a red room.
  *   **Tails:** It creates **two** observers, each in a red room.
  You wake up in a red room. You know the setup. What is your credence that the coin landed Heads?
  *   **(A) 1/2** (The coin is fair; the number of people shouldn't change that.) → *Go to Node 2.*
  *   **(B) 1/3** (I am more likely to be one of the two people in the Tails world.) → *Go to Node 5.*

  ### Node 2: Sleeping Beauty
  A fair coin is flipped.
  *   **Heads:** You are woken **once** (Monday) and interviewed.
  *   **Tails:** You are woken **twice** (Monday and Tuesday), with memory erasure between, and interviewed each time.
  You are currently being interviewed. What is your credence that the coin landed Heads?
  *   **(A) 1/2** (The coin is fair; waking up was guaranteed to happen either way.) → *Go to Node 3.*
  *   **(B) 1/3** (There are three possible awakenings, only one is Heads.) → *Go to Node 9.*

  ### Node 3: The Shuffled Incubator
  A machine flips a fair coin.
  *   **Heads:** It creates **one** observer with serial number **#1**.
  *   **Tails:** It creates **one** observer with serial number **#2**.
  You wake up and discover your serial number is **#1**. Does this observation change your credence in Heads from the prior 1/2?
  *   **(A) No** (Learning which specific person I am is not new evidence about the world.) → *Go to Node 4.*
  *   **(B) Yes** (I am now certain it is Heads, because #2 only exists in Tails.) → *Go to Node 4.*

  ### Node 4: Indexical Evidence
  (In Node 3, if you answered **No**): You hold that learning "I am #1" is not evidence. Does this apply generally to learning your own existence or location?
  *   **(A) Yes** (Indexical facts like "I exist" or "I am here" are never genuinely new evidence.) → **LEAF 1**
  *   **(B) No** (Sometimes it is evidence, just not in the Shuffled case.) → *Go to Node 7.*

  ### Node 5: The Presumptuous Philosopher
  Two theories of physics are equally likely *a priori*.
  *   **Theory A:** The universe contains **1 billion** observers.
  *   **Theory B:** The universe contains **1 trillion** observers.
  You exist. Does this fact make Theory B vastly more likely than Theory A?
  *   **(A) Yes** (I am more likely to exist in a universe with more observers.) → *Go to Node 6.*
  *   **(B) No** (Existence is not evidence for larger populations.) → *Go to Node 8.*

  ### Node 6: Betting on the Presumptuous Philosopher
  If you answered **Yes** to Node 5: Would you accept a bet that pays $1 if Theory B is true and costs $1,000 if Theory A is true?
  *   **(A) Yes** (My credence justifies the bet.) → *Go to Node 7.*
  *   **(B) No** (I believe B is more likely, but I shouldn't *act* on it.) → **LEAF 2**

  ### Node 7: The Sealed Incubator
  A machine flips a fair coin.
  *   **Heads:** It creates **one** unsealed observer (you).
  *   **Tails:** It creates **one** unsealed observer (you) AND **one trillion** sealed observers (in a region you cannot access).
  You wake up unsealed. Does the existence of the trillion sealed observers make Tails more likely?
  *   **(A) Yes** (Total observer count drives probability.) → **LEAF 3**
  *   **(B) No** (Only observers in my situation count.) → *Go to Node 8.*

  ### Node 8: The Doomsday Argument
  Knowing that you were born relatively early in the history of humanity (compared to all humans who might ever live), does this suggest humanity is likely to go extinct sooner than *a priori* statistics suggest?
  *   **(A) Yes** (I should reason as if I am a random sample from all humans.) → *Go to Node 9.*
  *   **(B) No** (My birth rank is not evidence about the total number.) → **LEAF 1** *(Note: Converges with Non-Indexical on this verdict)*

  ### Node 9: Reference Class Definition
  (Reached via Node 2B or Node 8A): When counting "observers" for probability, do you include entities radically different from you (e.g., ants, AIs, or observer-moments)?
  *   **(A) Yes** (Any conscious experience or moment counts.) → **LEAF 4**
  *   **(B) No** (Only persons sufficiently similar to me count.) → **LEAF 5**

  ---

  ### Scoring Key & Leaves

  | Leaf | Position Name | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Non-Indexical Conditioning** | Must claim learning "I exist" provides zero evidence about the world, even when existence is contingent on the hypothesis. |
  | **2** | **Pragmatic / Action-Only** | Requires decoupling credence from betting behavior, violating standard Dutch Book arguments for rationality. |
  | **3** | **Self-Indication Assumption (SIA)** | Commits to believing in a vast universe of causally disconnected observers purely because you exist. |
  | **4** | **Observer-Moment SSA** | Treats temporal parts of people as the fundamental unit of probability, making personal identity fuzzy. |
  | **5** | **Plain Person-based SSA** | Commits to the Doomsday Argument, suggesting we are likely near the end of humanity purely based on birth order. |

  ### Undefended Combinations (Logical Space Gaps)
  The following paths are logically possible but effectively undefended in the literature:
  1.  **Node 1 (1/3) → Node 5 (No):** Inconsistent. If you think observer count updates probability in the Incubator (Node 1), you should accept the Presumptuous Philosopher (Node 5). Denying both suggests a confusion about why Node 1 was 1/3.
  2.  **Node 1 (1/2) → Node 2 (1/3) → Node 8 (No):** Unstable. If you are a "Thirder" on Beauty because of observer counts, you usually accept SIA (which rejects Doomsday) or Observer-Moment SSA (which accepts Doomsday). Accepting Thirder-Beauty but rejecting Doomsday without accepting SIA is a rare, unmotivated hybrid.
  3.  **Node 5 (Yes) → Node 7 (No):** Inconsistent. If total observer count drives probability in the Presumptuous Philosopher, it should also drive it in the Sealed Incubator. Denying it here is "reference class gerrymandering" to avoid the Sealed conclusion.

  ### Indistinguishable Leaves
  This tree cannot empirically separate the following two leaves in all practical contexts:
  1.  **Leaf 2 (Pragmatic/Action-Only)** and **Leaf 3 (SIA)**.
      *   **Reason:** If the Pragmatic agent acts *as if* SIA is true to avoid Dutch Books, their behavioral output is identical to the SIA proponent. They only differ on the internal report of "belief," which is not observable in decision cases.
  2.  **Leaf 1 (Non-Indexical)** and **Leaf 5 (Plain SSA)**.
      *   **Reason:** In standard cases (Incubator/Beauty), these views often yield the same numerical credences (1/2). They only diverge on the philosophical justification for the Doomsday Argument or Shuffled cases, which relies on introspective reports about "evidence" rather than case verdicts.
