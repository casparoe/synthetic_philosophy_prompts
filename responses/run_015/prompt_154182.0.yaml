answer: |-
  Here are the desiderata for a test of genuine Cognitive Penetration of Perception (CPP), structured to isolate the specific claim that cognitive states (belief, desire, expectation) alter the *content of perceptual experience* rather than merely altering judgment, attention, or action.

  ### I. Classification Cases
  *The test must yield the correct verdict on these paradigmatic cases. If the test classifies these incorrectly, it lacks validity.*

  1.  **The Stubborn Illusion (e.g., Müller-Lyer)**
      *   **Verdict:** No Penetration.
      *   **Requirement:** The test must register that knowing the lines are equal does not alter the sensory experience of them being unequal.
      *   **Why:** This is the primary evidence for modularity. If a test claims penetration here, it defines "perception" too broadly (including judgment).
      *   **Status:** [Non-Negotiable]

  2.  **The Reversible Figure (e.g., Duck-Rabbit)**
      *   **Verdict:** Ambiguous / High-Level Penetration.
      *   **Requirement:** The test must distinguish this from the Müller-Lyer. The switch is driven by conceptual cueing, but it is often classified as "aspect seeing" rather than low-level sensory change.
      *   **Why:** To ensure the test distinguishes between *interpretation* of ambiguous data vs. *alteration* of clear data.
      *   **Status:** [Non-Negotiable]

  3.  **The Expert vs. Novice (e.g., Radiologist or Birder)**
      *   **Verdict:** The Target Case.
      *   **Requirement:** The test must distinguish between "seeing a tumor" (perceptual) and "inferring a tumor from noise" (cognitive).
      *   **Why:** This is the "ordinary claim" you wish to settle. If the test cannot separate expertise-based perceptual learning from expertise-based inference, it is useless for this debate.
      *   **Status:** [Non-Negotiable]

  4.  **The Metabolic State (e.g., Proffitt's Slope)**
      *   **Verdict:** Contested (Likely No Penetration).
      *   **Requirement:** The test must determine if wearing a heavy pack changes the *visual angle* of the hill or the *willingness to report* the steepness.
      *   **Why:** To rule out embodied cognition effects that are actually response biases.
      *   **Status:** [Non-Negotiable]

  5.  **Low-Level Mechanisms (e.g., Afterimages, Illusory Contours)**
      *   **Verdict:** No Penetration.
      *   **Requirement:** The test must confirm that believing an afterimage is not real does not make it vanish.
      *   **Why:** To establish a bottom boundary. If belief penetrates retinal fatigue, the concept of "perception" loses its specific meaning.
      *   **Status:** [Non-Negotiable]

  ### II. Required Distinctions
  *The test must not collapse these mechanistic differences. If it conflates them, it produces false positives.*

  6.  **Penetration vs. Attention**
      *   **Requirement:** The test must show that the effect persists even when attention is controlled or equated.
      *   **Why:** If I see a sparrow because I *looked* at the beak (guided by belief), that is attention, not penetration. Penetration requires the *same* input to yield a *different* output solely due to cognitive state.
      *   **Status:** [Non-Negotiable]

  7.  **Penetration vs. Response Bias**
      *   **Requirement:** The test must separate sensory sensitivity ($d'$) from decision criterion ($\beta$).
      *   **Why:** A radiologist might say "tumor" more often because they are cautious, not because they see it. Signal Detection Theory metrics are mandatory.
      *   **Status:** [Non-Negotiable]

  8.  **Penetration vs. Post-Perceptual Judgment**
      *   **Requirement:** The test must locate the effect prior to the formation of a belief about the perception.
      *   **Why:** The core claim is about *experience*, not *opinion*. "It looks red" vs. "I think it is red."
      *   **Status:** [Non-Negotiable]

  9.  **Penetration vs. Long-Term Plasticity**
      *   **Requirement:** The test must distinguish immediate top-down influence from permanent bottom-up rewiring.
      *   **Why:** If a wine expert's palate changes after 10 years of training, is that cognition penetrating perception, or is it that their perception has been physically retrained? The "ordinary claim" usually implies the former (current belief changes current seeing).
      *   **Status:** [Contested] (Penetrationists often accept plasticity as a form of penetration; Modularists treat it as hardware upgrade).

  ### III. Structural Constraints
  *The test cannot violate these boundary conditions of what perception is.*

  10. **Speed and Involuntariness**
      *   **Requirement:** The effect must occur within the temporal window of early vision (approx. <150ms) and without deliberate calculation.
      *   **Why:** Perception is something that happens *to* you, not something you *do*. If it requires reasoning time, it is cognition.
      *   **Status:** [Non-Negotiable]

  11. **Veridical Contact (The "Reality" Constraint)**
      *   **Requirement:** The test must allow that perception generally tracks the world, even if penetrated.
      *   **Why:** If belief changes seeing too much, we are hallucinating, not perceiving. The test must distinguish *bias* from *breakdown*.
      *   **Status:** [Non-Negotiable]

  12. **Persistence Despite Knowledge**
      *   **Requirement:** The effect should not necessarily vanish when the subject is told the cognitive cue is false (similar to the Müller-Lyer constraint).
      *   **Why:** If the effect vanishes the moment you say "this is an experiment," it was likely demand characteristics, not perception.
      *   **Status:** [Non-Negotiable]

  ### IV. The "No Report" Demand
  *Your extra demand: The test must work without honest first-person report (blindsight, dogs, AI).*

  *   **Analysis:** This is a **Methodological Prejudice**, not a Philosophical Desideratum.
  *   **Why:** The debate over CPP is fundamentally about *phenomenology* (what it is *like* to see). First-person report is the primary access to phenomenology.
  *   **The Conflict:** You can measure functional discrimination in a dog or AI (e.g., the dog barks at the snake). But you cannot measure whether the dog *experiences* the snake differently due to fear, or simply has a lower threshold for triggering a bark.
  *   **Verdict:** A theory of CPP *may* ignore these cases without failing. To demand a test that settles the *phenomenal* claim using *non-phenomenal* subjects is a category error. However, if you redefine CPP as "functional influence on early visual processing" rather than "change in conscious experience," then this becomes a [Non-Negotiable] scientific constraint.
  *   **Classification:** [Prejudice] (unless you are willing to abandon the claim about "seeing" in favor of "processing").

  ### V. Incompatibilities
  *Here is where the requirements clash. You cannot satisfy all of these simultaneously.*

  **The "Phenomenal-Functional Gap"**
  You cannot simultaneously satisfy **Desideratum 9 (Post-Perceptual Judgment)** and **The "No Report" Demand**.
  *   **Reason:** To distinguish "seeing a tumor" from "judging a tumor," you traditionally need the subject to tell you what it *looked like* vs. what they *decided*. In a blindsight patient or a dog, you only have the decision/action. You cannot know if the visual field was dark and they guessed, or if the visual field contained a shadow they reacted to.
  *   **Resolution:** You must choose: Are you testing *Conscious Experience* (requires report) or *Informational Encapsulation* (allows no report)? You cannot settle the "ordinary claim" (literally see differently) without report.

  **The "Selectivity Problem"**
  You cannot easily satisfy **Desideratum 1 (Müller-Lyer)** and **Desideratum 3 (Expert)** simultaneously with a single mechanism.
  *   **Reason:** If belief is powerful enough to make a radiologist see a tumor in noise (Expert), why is it not powerful enough to make the Müller-Lyer lines look equal when you know they are?
  *   **Resolution:** A successful test must identify a *filter* that allows penetration in high-level object recognition (experts) but blocks it in low-level metric processing (illusions). Most current theories fail to specify this filter precisely.

  ### VI. Commitments

  **1. The Single Requirement That Does The Most Work:**
  **Distinction #6: Penetration vs. Attention.**
  This is the theory killer. Almost every alleged case of cognitive penetration collapses when you control for where the eyes actually fixated or how feature-weights were allocated. If you believe there is a bird, you look at the beak. If you look at the beak, you see the bird. That is not penetration; that is active sampling. A test that cannot rule out attentional weighting is useless.

  **2. Your Prejudice:**
  **The "No Report" Demand.**
  It is a scientific virtue for objectivity, but it is a philosophical vice for this specific question. The claim "experts see differently" is a claim about *qualia*. Removing the reporter removes the qualia. You can prove a dog's visual cortex processes edges differently based on training, but you cannot prove the dog *sees* differently in the sense required to settle the philosophical debate. Insisting on this forces the debate into behaviorism, which sidesteps the original question.

  **3. Where I Am Least Sure:**
  **Desideratum 9: Long-Term Plasticity vs. Immediate Penetration.**
  I am unsure where to draw the line between "my belief changed my sight" and "my training changed my brain." If a radiologist trains for 5 years, their V1/V2 connectivity changes. Is that cognitive penetration, or is it just that their "hardware" is now different? If the latter, then "belief" isn't penetrating perception; "learning" is rebuilding it. The test needs a temporal constraint (immediate cueing vs. long-term training) that the literature has not yet standardized.
