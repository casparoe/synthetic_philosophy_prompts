              *   C vs A: A has better latency (50 vs 60). Reliability worse. Throughput worse. Latency might dominate. $A \succ C$.
              *   *Cycle:* $A \succ C \succ B \succ A$.
      *   *Refinement for "Sting":* Need a transaction cost. Every trade costs 1 token. If they cycle $A \to B \to C \to A$, they lose 3 tokens.
