      *(Final Polish)*: Make sure the distinction between "Ontological Joint Action" and "Functional Collective Agency" is sharp. That's the pivot point for the funding.

      *Let's finalize the 3 questions:*
      1.  **The Pragmatic Utility of Collective Ascription:** (Addresses Wrinkle i directly).
      2.  **The Metaphysics of Fluid Membership:** (Addresses Wrinkle ii directly).
      3.  **Engineered Commitment Mechanisms:** (Bridging to design).

