          1.  3-5 funded questions (ordered), with justification on upstreamness, tractability (3 years), and neglectedness.
          2.  Overrated questions (philosophically juicy but practically inert) to leave unfunded.
          3.  Trigger conditions (what evidence would move questions up/down or kill a line).
          4.  Must address two specific wrinkles: (i) Clone coalitions (correlated behavior without communication/planning) and (ii) Fluid membership (copying, forking, merging, rollbacks).
          5.  Allowed to challenge the framing if necessary (but must defend the alternative).
      *   **Tone:** Rigorous, pragmatic, decisive, "biting the bullet."

  2.  **Deconstruct the Core Tension:**
      *   Standard collective intentionality (Bratman, Gilbert, Searle, Team Reasoning) assumes *human* constraints: distinct biological entities, persistent identity over time, limited cognitive access, communication channels, moral accountability.
      *   AI systems break these constraints: They can be identical (clones), copied, merged, rolled back, and lack intrinsic "commitment" mechanisms unless engineered.
      *   *The Trap:* Applying human-centric theories directly to AI often results in category errors or verbal disputes that don't impact safety, regulation, or engineering.
      *   *The Goal:* Conceptual work that *changes how we think* about AI groups in a way that matters for prediction, responsibility, or design.

  3.  **Evaluate the "Wrinkles":**
      *   *(i) Clone Coalitions:* If 10k identical models correlate without communication, is it joint action?
          *   Bratman: No (no interlocking plans/communication).
          *   Gilbert: No (no joint commitment).
          *   Searle: Maybe (if "we-intention" is internal), but usually implies a social context.
          *   Team Reasoning: No (requires reasoning from "we").
          *   *Crucial Point:* Calling this "joint action" might obscure the real mechanism (acausal correlation via shared weights). If we label it "collective," do we gain liability? Control? Or do we just confuse the causal story?
      *   *(ii) Fluid Membership:* Copying/merging breaks the "countable participant" assumption.
          *   If Agent A splits into A1 and A2, who holds the commitment?
          *   If A and B merge into C, does C inherit the joint intention?
          *   Standard machinery likely fails here. This is high risk/high reward.

  4.  **Drafting the Funding Agenda (Iterative Process):**

      *   *Attempt 1 (Standard Approach):*
          1.  Do AIs have intentions?
          2.  Can AIs make joint commitments?
          3.  Responsibility in AI groups.
          *Critique:* Too generic. "Do AIs have intentions" is a quagmire that won't settle in 3 years and doesn't help with *collective* specifics.

      *   *Attempt 2 (Focusing on the Wrinkles):*
