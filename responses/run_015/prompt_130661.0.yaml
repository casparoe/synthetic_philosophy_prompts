      *   **The "Do Not Fund" List:** Overrated topics.
      *   **Trigger Conditions:** What changes the priority.
      *   **Addressing the Wrinkles:** Explicitly weaving (i) and (ii) into the questions.

  10. **Refining the Argument on Wrinkle (i):**
      *   The prompt asks: "If the answer is 'nothing', then maybe 'do AI collectives have shared intentions?' is the wrong question."
      *   *My stance:* I agree. The funded question must be "What work is this concept doing?" not "Is it true?"
      *   *Reasoning:* If 10k clones correlate, calling it "joint action" might dangerously imply *negotiability* where there is none. Or it might imply *shared liability* where there is only *designer liability*. The philosophical work is to disentangle this.

  11. **Refining the Argument on Wrinkle (ii):**
