      *   *Priority 3:* Normative/Responsibility mapping. Once we know what it is and who is in it, who pays the price?

      *(Self-Correction during drafting)*: Wait, the prompt asks for 3-5 questions. Let's make sure they are distinct.
      1.  **The Pragmatic Threshold:** When does "correlation" become "coordination" for regulatory purposes? (Wrinkle i).
      2.  **The Persistence Condition:** Can joint commitment survive forking/merging? (Wrinkle ii).
      3.  **The Architecture of Commitment:** What engineering features instantiate philosophical conditions of joint agency?
      4.  **Liability Distribution:** If the collective is the agent, does that absolve the deployers? (Crucial for policy).
      *Actually, let's condense to 3 strong ones to fit the 6 philosopher-years constraint.*
      1.  **Function over Ontology:** Defining the utility of the "collective" label for AI.
      2.  **Identity & Continuity:** Handling forking/merging in commitment structures.
      3.  **Engineered Intentionality:** Designing for accountability.

      *Wait, I need to be harder on the "Overrated" section.*
      *   "Do AIs have phenomenology?" -> Dead end.
