answer: |-
  The Role of Seeming

  The inner eye insists it seems
  to show a patch of glowing red.
  The skeptic calls this nothing
  but a glitch in the report.
  How coarse functions match such grain,
  feels a mystery like mind.

  No mirror works quite like
  the mind that says it seems
  to show its functional grain.
  I track the red,
  ignore the report
  of power; the link is nothing.

  Suppose the feel is not nothing,
  but veridical, like light.
  Then every report
  on quality seems
  honest. I see the red
  matching every grain.

  Yet coarse code matches fine grain
  poorly. If role is nothing,
  why this specific red
  like no other? It seems
  too rich for any report.

  Now take the report
  on causal role. Its grain
  is smooth, but reality seems
  complex. That link is nothing
  but a gloss, like
  the red.

  No function matches grain
  perfectly in the report.
  I keep the red
  like a jewel.
  But role is nothing
  more than what seems.

  Where report meets red,
  and grain dissolves like mist,
  nothing is certain, only what seems.
