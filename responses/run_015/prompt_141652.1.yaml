  1.  **Constraint vs. Proposition:** **0.85**. Conditionals of this form function as linear constraints on the probability simplex, not as events in the algebra you can conditionalize on.
  2.  **Lewis Triviality:** **0.60**. Triviality results show you can't treat $P(A|B)=x$ as $P(C)=1$ for some proposition $C$, forcing the constraint framework by elimination.
  3.  **Judy Benjamin Principle ($P(F)=0.5$):** **0.15**. Minimizing relative entropy subject to conditional constraints almost invariably shifts the marginal probability of the antecedent.
  4.  **Sequential vs. Joint Gap:** **0.90**. For overlapping constraints, sequential MinEnt projections are path-dependent and converge to the wrong point; only joint projection satisfies both constraints optimally.
