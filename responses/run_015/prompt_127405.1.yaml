      *   *Claim 3:* "This is essentially the same idea as collective intentionality, because in both cases a group can possess intentions or commitments that no single member holds." (**Potential Conflation/Error**). Free-floating rationales usually imply reasons exist *independently* of mental states (Platonic, realist, or strong institutional facts). Collective intentionality (Gilbert, Searle, Bratman) still relies on *mental states* (joint commitment, we-intentions), just distributed. Equating "free-floating" with "collective intentionality" misses the point of "free-floating."
