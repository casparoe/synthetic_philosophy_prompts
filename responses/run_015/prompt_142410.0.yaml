answer: |-
  Here is a runnable plan designed for your 90-minute session. It adheres to your constraints (no tech, 14 students) and targets the specific conceptual vertigo you want them to experience.

  # Session Plan: The Slipnet in the Room

  **Time:** 90 Minutes
  **Materials:** Whiteboard, markers, printed handouts (two variants), index cards (for wagering), timer.
  **Microdomain:** The **BFKMQX** Alphabet.
  *   **Order:** B < F < K < M < Q < X
  *   **Rule:** "Successor" means moving one step right in this sequence. "Predecessor" means one step left.
  *   **Boundary:** B is the start; X is the end.

  ## Part 1: The Microdomain & Item List (15 Minutes)

  **Setup (5 mins):**
  Write the alphabet on the board: **B — F — K — M — Q — X**.
  Tell the students: *"For this session, this is the only alphabet that exists. There are no letters between these. B is the beginning, X is the end. Do not use the standard English alphabet."*

  **Round 1: The Wall (Individual, Silent, 10 mins)**
  Distribute a single sheet of paper. Instruct them to solve the transformations silently. No talking.

  *   **Item 1:** `B` $\rightarrow$ `F`
  *   **Item 2:** `Q` $\rightarrow$ `X`
  *   **Item 3:** `X` $\rightarrow$ `___`
  *   **Item 4:** `X X` $\rightarrow$ `___` (Given the rule from Item 1)

  **Why these items?**
  *   **Item 1 & 2:** Establish the "Successor" rule fluently. Low cognitive load.
  *   **Item 3 (The Wall):** `X` has no successor. The rule crashes. This forces a **conceptual slip**. Do they wrap around? Do they go backward (`Q`)? Do they stay (`X`)?
  *   **Item 4 (The Ambiguity):** `X X` introduces grouping. Does the rule apply to the *letters* (impossible) or the *group* (lengthen to `X X X`)? This sets up the "Lengthening" slip.

  *Instructor Note:* Collect these quickly. Do not discuss answers yet. Just acknowledge the discomfort.

  ## Part 2: The Priming Manipulation (20 Minutes)

  **Logistics:**
  Split the room physically. Left side = **Group Alpha**. Right side = **Group Beta**.
  *   **Security:** Use different colored paper for the handouts. Instruct students: *"Do not show your paper to anyone. The examples on your sheet are calibration data for your specific cognitive module."*
  *   **If Leakage Occurs:** If a student points out the sheets are different, lean into it. *"Exactly. Different contexts activate different networks. Note who saw what."*

  **Handout Alpha (The "Backward" Prime)**
  > **Calibration Sequence A**
  > 1. `M` $\rightarrow$ `Q`
  > 2. `Q` $\rightarrow$ `X`
  > 3. `X` $\rightarrow$ `Q`  *(Note: This establishes that hitting the wall allows a Predecessor slip)*
  >
  > **Target Problem:**
  > If `B` $\rightarrow$ `F`, then `X` $\rightarrow$ `___`?

  **Handout Beta (The "Lengthening" Prime)**
  > **Calibration Sequence B**
  > 1. `M` $\rightarrow$ `Q`
  > 2. `Q` $\rightarrow$ `X`
  > 3. `B B` $\rightarrow$ `B B B` *(Note: This establishes that structural change allows a Lengthening slip)*
  >
  > **Target Problem:**
  > If `B` $\rightarrow$ `F`, then `X` $\rightarrow$ `___`?

  **Task:**
  Solve the Target Problem silently (5 mins).
  Then, write your answer on the board in two columns (Alpha vs. Beta) without speaking (5 mins).

  **Expected Outcome:**
  *   **Alpha** should cluster around `Q` (Successor slipped to Predecessor).
  *   **Beta** should cluster around `X X` (Object slipped to Group/Length).
  *   *Some* will still write `X` (Identity) or `B` (Wrap-around). This variance is good.

  ## Part 3: The Wagering Round (20 Minutes)

  **Goal:** Make "probability" concrete. There is no right answer, but there is a *modal* answer.

  **Mechanics:**
  1.  Form teams of 3 (5 teams total, one team of 4).
  2.  Give each team 10 "Credibility Points" (written on index cards).
  3.  **The Task:** Teams must predict the **Modal Answer** of the *other* group (Alpha predicts Beta's mode; Beta predicts Alpha's mode).
  4.  **The Wager:** Teams secretly write their prediction and wager 1 to 5 points on it.
  5.  **The Payoff:**
      *   If the prediction matches the actual mode of the target group: **Double the wager.**
      *   If not: **Lose the wager.**
      *   *Crucial Rule:* If there is no clear mode (e.g., a perfect tie), all wagers are returned. (This rewards consensus).

  **Why this works:**
  *   It prevents the "loudest voice" problem because wagers are secret until the reveal.
  *   It forces them to model the *other group's cognition*, not the "truth."
  *   It demonstrates that "correctness" is a function of population dynamics (Copycat's temperature/run-to-run variation).

  ## Part 4: The Temperature Round (15 Minutes)

  **Goal:** Demonstrate that "creativity" is a parameter, not a virtue.

  **Task:**
  Everyone gets the same prompt: `K M Q` $\rightarrow$ `K M X` :: `B F K` $\rightarrow$ `___`?
  *   *Standard Answer:* `B F M` (Successor on last letter).
  *   *Slippy Answer:* `B F K K` (Grouping), `B F A` (Predecessor?), `B F Z` (Wildcard).

  **Round A (Low Temp):** "Answer as obviously as possible. Assume there is one correct rule." (3 mins)
  **Round B (High Temp):** "Answer as inventively as possible. You must be able to defend the logic, but avoid the obvious." (3 mins)

  **Collect & Display:**
  Put Low Temp answers in one pile, High Temp in another. Visually show the spread widening.

  ## Part 5: The Debrief (20 Minutes)

  Do not resolve the tension. Map their experience to the architecture.

  **1. The Wall & The Slip (5 mins)**
  *   *Ask:* "When you hit `X` $\rightarrow$ `?`, what happened mentally?"
  *   *Map:* This is **Activation hitting a boundary**. In Copycat, when the `Successor` node cannot fire (no node to activate), activation spills over to neighbors.
  *   *Concept:* **Slippage.** `Successor` slipped to `Predecessor` (Group Alpha) or `Object` slipped to `Group` (Group Beta).
  *   *Point:* The rule wasn't "in" the string. You constructed it to resolve the impasse.

  **2. The Prime & The Slipnet (5 mins)**
  *   *Ask:* "Why did Alpha and Beta diverge?"
  *   *Map:* **Spreading Activation.** The calibration examples (`X`->`Q` vs `BB`->`BBB`) temporarily weighted the links in your mental Slipnet.
  *   *Point:* Concept boundaries are not fixed. They are set by what neighbors are currently active. You were running different software for 10 minutes.

  **3. The Wager & The Codelets (5 mins)**
  *   *Ask:* "Was anyone 'wrong' in the wagering?"
  *   *Map:* **Probabilistic Competition.** In Copycat, thousands of codelets compete. The answer that wins isn't "true," it's just the one that built the most coherent structure given the temperature.
  *   *Point:* "No fact of the matter" does not mean "anything goes." It means "some structures are more stable given the current context." The wager rewarded predicting the stability, not the truth.

  **4. Temperature (5 mins)**
  *   *Ask:* "How did the answers change from Round A to Round B?"
  *   *Map:* **Temperature Parameter.** Low temp = deterministic, greedy search for the best fit. High temp = allowing unlikely slips, exploring distant parts of the concept space.
  *   *Point:* "Be creative" is not a rule; it is a system setting that lowers the barrier for unlikely codelets to win.

  ***

  # Honesty Notes: What Will Go Wrong & What's Missing

  ### 1. Predictable Failure Modes

  *   **The Dominant Theorist:** One student will claim, "The rule is obviously Predecessor because X is the end."
      *   *Mitigation:* Enforce the "Silent Writing" rule strictly in Rounds 1 and 2. If they speak early, tell them they are "contaminating the workspace" (use their terminology against them).
  *   **The Rebel:** One student will refuse to answer Item 3 (`X` $\rightarrow$ ?), saying "It's impossible."
      *   *Mitigation:* Validate them. "This is a correct Copycat response." In the model, if temperature is low and no slip is found, the system halts. Mark their paper as "System Halt." Use this in the debrief to show that *refusal* is a valid state when slippage fails.
  *   **The Leakage:** If Group Alpha sees Group Beta's handout.
      *   *Mitigation:* Don't panic. Use it. "Now you have cross-activation. Did your answers change? That's context sensitivity."
  *   **Timing Creep:** The Wagering round often bogs down in counting points.
      *   *Mitigation:* Keep the scoring binary (Win/Lose) on the whiteboard. Do not calculate total wealth. Just track who predicted the mode correctly.

  ### 2. Architectural Limitations (What You Must Explain)

  You cannot simulate the following with 14 humans in 90 minutes. You must explicitly name these gaps in the debrief so they don't leave with a simplified model.

  *   **Massive Parallelism:**
      *   *The Gap:* Your students processed serially (Round 1, then Round 2). Copycat's codelets work in parallel, building and destroying structures simultaneously.
      *   *Why it matters:* In Copycat, the "answer" emerges from the tension of competing structures. In class, the answer emerged from sequential instruction. You must tell them: *"You felt the slippage, but you didn't feel the competition. In the model, the wrong answers are actively being built and destroyed until one wins."*
  *   **Sub-symbolic Gradience:**
      *   *The Gap:* Students chose discrete answers (`Q` or `XX`). Copycat's activation levels are continuous.
      *   *Why it matters:* In the model, a concept can be "partially active." In class, you were either primed or you weren't. This makes the human system "colder" (more deterministic) than the model.
  *   **Perceptual Encoding:**
      *   *The Gap:* You gave them the symbols pre-segmented (`B`, `F`, `K`). Copycat has to *see* the string and decide where the boundaries are (e.g., is `AA` one object or two `A`s?).
      *   *Why it matters:* A huge part of analogy is deciding what counts as an object. By giving them discrete items, you skipped the perceptual front-end. Acknowledge this: *"We assumed the objects for you. In the real world, deciding what 'it' is half the battle."*
  *   **Learning:**
      *   *The Gap:* Copycat (in its original form) doesn't learn long-term; it resets. Your students *did* learn (Round 1 influenced Round 2).
      *   *Why it matters:* Your students are a "learning system," Copycat was a "processing system." This makes your students better at the task but less like the specific architecture you read about.

  ### 3. The "No Answer Key" Tension

  Your colleague worries this looks like a puzzle with no solution. You must reframe the **Wagering Round** as the answer key.
  *   *Say this:* "In philosophy, we look for truth conditions. In cognitive science, we look for probability distributions. Today, the 'answer' was not the letter you wrote. The 'answer' was the histogram of the class. If you want a fact of the matter, look at the board, not your paper."

  This plan forces them to inhabit the architecture rather than observe it. They will leave feeling the "vertigo" you described, because for 20 minutes, their own cognition was the workspace.
