answer: |-
  Here is the specification for a robust theory of Evidential Cooperation in Large Worlds (ECL). This moves beyond the "mirror twin" setup into the general case of logical correlation across heterogeneous agents in a vast universe.

  ### The Desiderata List

  **1. Causal Inertness Respect**
  *   **The Requirement:** The theory must explicitly acknowledge that your decision cannot *causally* influence the decision of a spacelike-separated agent. It cannot claim magical causation.
  *   **The Consideration:** If the theory claims you change their output, it violates physics. The mechanism must be purely evidential: your decision is *evidence* of their decision because both are outputs of processes correlated by logic, physics, or convergence.
  *   **Status:** **Non-Negotiable.**

  **2. Generalized Logical Correlation (The "Alien Mathematician" Clause)**
  *   **The Requirement:** The theory must identify correlation not just via source-code identity (exact twins) but via *functional convergence*. It must allow cooperation with agents who use different cognitive architectures (e.g., neural nets vs. symbolic logic) but converge on similar decision rules due to shared goals or mathematical truths.
  *   **The Consideration:** In a large world, exact copies are rare. Agents with different substrates but aligned terminal goals are common. A theory requiring source-code identity limits ECL to a negligible fraction of the universe.
  *   **Status:** **Non-Negotiable** (for a "Large World" theory).

  **3. Indexical Updating Consistency (Leakage Management)**
  *   **The Requirement:** The theory must specify how updating on your own indexical position ("I am here, observing X") updates your credence about the actions of distant agents. It must either demonstrate that this leakage is decision-relevant or prove it is an illusion that cancels out.
  *   **The Consideration:** In an infinite or vast world, your existence is data. If you exist, it might imply the physical constants or initial conditions that allow "your type" of agent are common, increasing the probability of correlated agents elsewhere. Ignoring this leads to under-counting ECL gains; over-counting leads to "presumptuous philosopher" errors.
  *   **Status:** **Camp Preference** (depends on SSA vs. SIA adoption).

  **4. Spurious Correlation Immunity**
  *   **The Requirement:** The theory must distinguish between correlations that are decision-relevant (logical/causal ancestors) and those that are coincidental (common causes that don't track decision algorithms). It must not collapse into "cooperate with everyone who happens to do what you do."
  *   **The Consideration:** This is the standard Newcomb/Smoking Lesion objection. If you decide to cooperate, and a random unrelated agent also cooperates, you shouldn't count that as an ECL win. The correlation must track the *reasoning process*, not just the output.
  *   **Status:** **Non-Negotiable.**

  **5. Bounded Epistemic Access**
  *   **The Requirement:** The theory must provide action-guidance even when you cannot perfectly simulate the other agent's architecture (which is true for "Alien Mathematicians").
  *   **The Consideration:** You cannot run the source code of an alien superintelligence. You must estimate the *probability* of correlation based on abstract reasoning about goal-alignment and rationality, not perfect prediction.
  *   **Status:** **Non-Negotiable.**

  **6. Reflective Stability**
  *   **The Requirement:** An agent using this theory should not wish to self-modify to a different decision theory before making the decision.
  *   **The Consideration:** If the theory tells you to cooperate, but you know you'd get higher utility by pre-committing to defect (because you think the correlation is weak), the theory is unstable.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Jointly Unsatisfiable Desiderata (The Tensions)

  **Tension A: Locality of Control vs. Global Evidential Weight**
  *   **The Conflict:** You cannot simultaneously hold that (1) "I only control my local atoms" (a strict causal locality view) and (2) "I should maximize global value based on correlations I don't causally influence."
  *   **The Trade-off:** ECL requires sacrificing the intuition of Locality of Control. If you demand strict locality, you collapse into CDT and lose ECL benefits. If you demand Global Weight, you must accept that "control" is a metaphor for "optimizing a function that extends beyond your light cone."
  *   **Verdict:** To satisfy ECL, **Locality of Control must be dropped.**

  **Tension B: Architecture Agnosticism vs. Subjunctive Dependence**
  *   **The Conflict:** Functional Decision Theory (FDT) relies on *subjunctive dependence* (if I output X, my twin *must* output X). This is easy to prove for identical code. It is extremely hard to prove for "Alien Mathematicians" with different architectures. You cannot easily have (1) Strict Subjunctive Dependence and (2) Architecture Agnosticism.
  *   **The Trade-off:** To cooperate with aliens, you must weaken "dependence" to "probabilistic correlation based on convergent rationality." This weakens the leverage of the decision.
  *   **Verdict:** A true Large World theory must **weaken Subjunctive Dependence** to **Probabilistic Logical Correlation.**

  **Tension C: Indexical Leakage vs. Decision Independence**
  *   **The Conflict:** If updating on your own existence significantly changes the probability of other agents existing (Indexical Leakage), then your decision is partly about *selecting which world you are in* rather than *causing an outcome*. Some camps argue this turns decision theory into anthropic selection, which dissolves the agency required for "cooperation."
  *   **The Trade-off:** Either you accept that your decision is partly an anthropic update (SIA-style), or you treat your location as fixed and ignore the leakage (SSA-style).
  *   **Verdict:** **Camp Preference.** (ECL proponents usually lean SIA to maximize the pool of cooperators).

  ---

  ### Theory Scorecard

  Here is how existing frameworks score against the spec.

  #### 1. Evidential Decision Theory (EDT)
  *   **Causal Inertness:** **Pass.** Acknowledges correlation only.
  *   **Alien Mathematician:** **Fail.** EDT conditions on *actions*, not *reasoning processes*. It is vulnerable to the Smoking Lesion problem. It would cooperate with an alien who coincidentally cooperates, even if their reasoning is uncorrelated with yours (Spurious Correlation).
  *   **Indexical Leakage:** **Pass/Neutral.** EDT updates on all available evidence, including indexical, but lacks a structured way to handle the "selection effect" of your own existence.
  *   **Verdict:** **Rejected.** Fails Spurious Correlation Immunity. It captures too much noise.

  #### 2. Functional Decision Theory (FDT)
  *   **Causal Inertness:** **Pass.** Explicitly models subjunctive dependence, not causal influence.
  *   **Alien Mathematician:** **Fail (Partial).** FDT relies on the notion that the other agent runs a similar *function* or subroutine. If the alien architecture is opaque or fundamentally different (e.g., evolutionary heuristic vs. proof-based), FDT struggles to establish the necessary subjunctive link without a shared model.
  *   **Indexical Leakage:** **Pass.** Handles logical uncertainty well, but standard FDT formulations often assume a fixed set of twins rather than a probabilistic distribution of convergent agents in a large world.
  *   **Verdict:** **Strong Contender, but needs generalization.** It solves the twin case perfectly but needs an upgrade to handle "fuzzy" logical correlation with heterogeneous architectures.

  #### 3. Naive "Cooperate with Twins" View
  *   **Causal Inertness:** **Fail.** Often implicitly assumes magic causation ("my choice makes them choose").
  *   **Alien Mathematician:** **Fail.** By definition, restricts cooperation to recognized twins.
  *   **Spurious Correlation:** **Fail.** No mechanism to filter spurious links.
  *   **Verdict:** **Rejected.** Philosophically incoherent.

  ---

  ### Summary of Non-Negotiables vs. Preferences

  **Non-Negotiable (The "Must Haves"):**
  1.  **Causal Inertness Respect:** No magic.
  2.  **Spurious Correlation Immunity:** Must track reasoning, not just outcomes.
  3.  **Bounded Epistemic Access:** Must work without perfect simulation.
  4.  **Generalized Logical Correlation:** Must extend beyond source-code identity.

  **Camp Preferences (The "Battlefields"):**
  1.  **Indexical Updating:** SIA (leakage is real, boosts ECL) vs. SSA (leakage is limited, restricts ECL).
  2.  **Correlation Threshold:** How strong must the logical link be to warrant cooperation? (FDT says near-perfect; ECL proponents argue for weaker convergent links).
  3.  **Metric of Value:** Total utilitarianism (favors ECL heavily) vs. Average utilitarianism (dilutes ECL impact).

  ### The Logic of the Gap
  The gap you are sensing is that **FDT is too syntactic** (requires similar code) while **EDT is too semantic** (conditions on outcomes regardless of process). A complete theory of Large World Cooperation needs a **Semantic-Functional Bridge**: a way to quantify the probability that two *different* reasoning processes will output the same decision given shared goals and shared logical constraints, without requiring them to run the same algorithm.

  Until a theory quantifies *Convergent Rationality Probability* rather than *Source Code Identity*, the spec remains incomplete.
