  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON ONTOLOGY

  **Parties:** The Deflationist (D) and The Realist (R)
  **Date:** October 26, 2023
  **Subject:** The Status of Ontological Disputes

  We, the undersigned, have engaged in a two-year dialectical exchange regarding the nature of existence claims. We agree on the non-ontological facts of the world, on the rules of logic, and on the utility of clear communication. We disagree on whether our remaining differences concern the structure of reality or the choice of language. This document records our points of convergence, the precise structure of our divergence, and the empirical or conceptual tests we agree would bear on the resolution of our dispute.

  ### 1. Agreed Claims

  We jointly affirm the following propositions. Each has been vetted to ensure neither party signs it in bad faith or via hidden ambiguity.

  1.  **Fixed Non-Ontological Facts:** In the case of the clonal trees, we agree on the total physical description: the genetic identity, the root connectivity, the spatial distribution of biomass, and the causal interactions with the environment. In the case of the committee, we agree on the total social description: the charter, the voting records, the legal liabilities, and the psychological states of the members. Neither party seeks to revise these underlying facts.
  2.  **Semantic Plasticity of Ordinary Language:** We agree that natural language quantifiers (e.g., "there are," "exists") are context-sensitive. In ordinary conversation, "There are no mountains here" may be true relative to a flat plain, while false relative to a geological survey. We agree that standard English licenses the assertion "There is a committee" in legal contexts and "There are only people" in psychological contexts without contradiction.
  3.  **The Constraint of Explanatory Power:** We agree that any ontological scheme that renders the formulation of successful scientific laws impossible or needlessly complex is defective. We agree that if a vocabulary prevents us from stating true generalizations that support counterfactuals, that vocabulary should be abandoned or revised.
  4.  **Mutual Concessions:**
      *   **D concedes to R:** The intuition that language should be "world-guided" is not merely an illusion. If our vocabulary consistently failed to track causal structures, our success in navigating the world would be miraculous.
      *   **R concedes to D:** The intuition that existence questions can feel like "choices of framework" is not merely confusion. There are cases where shifting vocabulary changes the truth-value of existence claims without changing the physical facts.
  5.  **Conditions for Falsification:**
      *   **D would revise her view if:** It were demonstrated that a single, unique quantifier meaning is required to make sense of fundamental physics, such that alternative meanings render the laws of nature unintelligible rather than merely verbose.
      *   **R would revise his view if:** It were demonstrated that two incompatible ontological schemes yield exactly the same predictive laws, explanatory depth, and logical consistency, with no remainder of "fit" to appeal to.

  ### 2. Disagreements

  The following table isolates the specific sub-questions where our positions diverge. We agree that these are the loci of the dispute.

  | Sub-question | D's Answer (Deflationist) | R's Answer (Realist) | What Turns on It |
  | :--- | :--- | :--- | :--- |
  | **1. Truth-Conditions:** Do the non-ontological facts plus a choice of meaning settle the truth of "there are composite objects"? | **Yes.** Once the meaning of "exists" is fixed (e.g., to allow composition or forbid it), the truth-value is settled. There is no further fact about which meaning is "correct." | **No.** The facts settle which meaning *correctly describes* the world. A meaning that allows composition is either true or false independently of our choice to adopt it. | Whether ontology is a discovery of structure or a decision on conceptual scheme. |
  | **2. Linguistic Merit:** Can one language be better than another in respects beyond convenience (e.g., brevity, ease of use)? | **No.** "Better" reduces to pragmatic virtues: simplicity, expressive power, and fit with human interests. There is no "representational fidelity" beyond these. | **Yes.** A language can be objectively better if its categories map onto the mind-independent joints of reality, even if a "carved" language is more cumbersome. | Whether "truth" has an explanatory role beyond "assertibility within a framework." |
  | **3. Self-Reference:** Does D's thesis ("there are many candidate meanings") presuppose a privileged quantifier? | **No.** My thesis is a pragmatic recommendation or a claim about linguistic practice, not a metaphysical claim requiring a privileged "exists." | **Yes.** To state that "there are many meanings" is to make an existence claim. If no quantifier is privileged, D's own statement lacks a determinate truth condition. | Whether Deflationism is self-undermining or coherent. |
  | **4. Status of Dispute:** Is the object-level dispute (e.g., "Do committees exist?") verbal or genuine? | **Verbal.** It is a disagreement about which linguistic framework to adopt, not about the world. | **Genuine.** It is a disagreement about what the world contains, regardless of the words used. | Whether the effort of ontology is wasted (D) or essential (R). |

  ### 3. Cruxes

  We identify the following specific issues as decisive. We agree that settling these would move at least one party to revise their position. We record our predictions in advance.

  **Crux A: The Translation Test**
  *   **The Sub-question:** Can a faithful manual be given mapping each party's existence talk into the other's without changing which facts are being reported or losing explanatory power?
  *   **The Test:** Take a set of causal explanations in biology regarding the clonal trees (e.g., "The organism resisted disease due to its size"). Attempt to translate this into D's preferred vocabulary (particles arranged tree-wise) and R's preferred vocabulary (one organism). Measure the loss of explanatory cohesion.
  *   **D's Prediction:** A lossless translation is possible. Any explanation using "organism" can be rewritten using "particles arranged organism-wise" with identical truth conditions and causal import. The "organism" talk is a convenient shorthand.
  *   **R's Prediction:** Translation entails explanatory loss. The rewritten version will be cumbersome, but more importantly, it will fail to capture the *unity* of the causal power. The "organism" talk tracks a real unity that the "particles" talk fragments.

  **Crux B: The Explanatory Work of "Reality"**
  *   **The Sub-question:** Does R's notion of "tracking reality better" do explanatory work that D's notion of "simple and useful" does not?
  *   **The Test:** Compare the success of a scientific theory that posits composite objects (e.g., cells, planets) against a nominalistic theory that posits only simples. If both predict equally well, does positing "real existence" add anything?
  *   **D's Prediction:** No. "Truth" adds nothing to "empirical adequacy + simplicity." If the nominalistic theory works, it is just as good. The idea that one "matches the world" is a metaphor for simplicity.
  *   **R's Prediction:** Yes. If the theory with composite objects succeeds, it is *because* composite objects exist. If the nominalistic theory succeeds, it is a miracle unless it is secretly tracking the same structures. "Matching the world" explains *why* the simple theory works; "simplicity" alone does not.

  **Crux C: The Quantifier's Elite Status**
  *   **The Sub-question:** Is there a "most natural" meaning of the quantifier, analogous to how "mass" or "charge" pick out natural properties?
  *   **The Test:** Examine fundamental physics. Does the formalism of physics require a domain of quantification that includes only simples, or composites, or both?
  *   **D's Prediction:** Physics is indifferent. The formalism works regardless of how we bound the variables, provided the math is consistent. There is no "ontological structure" to the domain.
  *   **R's Prediction:** Physics is not indifferent. The domain of the fundamental quantifier is restricted to the fundamental entities. If physics quantifies over fields, then fields exist. This restricts which meanings of "exists" are eligible for fundamental ontology.

  ### 4. Verbal or Genuine?

  We offer the following plain statement regarding the nature of our residual disagreement.

  We agree that the **object-level disputes** (e.g., "Does the committee exist?") are classified differently by each of us. D classifies them as **verbal**, resting on a choice of semantic framework. R classifies them as **genuine**, resting on the structure of reality.

  We further agree that **this classification disagreement itself is genuine.** We are not merely using words differently when we argue about whether the dispute is verbal; we are disagreeing about the nature of metaphysical inquiry.

  Therefore, the **genuine remainder** of our collaboration is the meta-ontological question: *Is there a fact of the matter about which quantifier meaning is privileged?*

  *   If the answer is **Yes**, R is vindicated, and ontology is a substantive inquiry into the world's structure.
  *   If the answer is **No**, D is vindicated, and ontology is a pragmatic inquiry into conceptual engineering.

  We acknowledge that we currently lack a shared method to settle this meta-ontological question without begging the question against one another. We commit to focusing future work on Cruxes A and B, as these offer the best hope of grounding the meta-ontological question in explanatory practice rather than semantic stipulation.

  ***

  **Signed,**

  _________________________
  (The Deflationist)

  _________________________
  (The Realist)
