  7.  **Final Polish:** Ensure the voice sounds like a helpful colleague sharpening an argument, not a professor grading it. (Use phrases like "I think you're onto something," "Here's where I'd push back," "Consider this scene").

  **(Self-Correction Note):** I need to make sure I don't just agree with the user. They explicitly asked me to *argue with them*. I need to be critical of the "Equality of Conversion Standing" thesis. Is it actually distinct from Capability? Sen talks about conversion factors. The user is describing *social* conversion factors vs *personal* ones. I should highlight that distinction.

  Also, the "admissibility of evidence" point is really about *privacy* and *discrimination law* more than distributive justice. I should point out that this shifts the debate from "Equality of What" to "Equality of Status" (Anderson/Sheffler). That's a huge pivot that might strengthen the essay.

