  5.  **Refining the Philosophical Connections:**
      *   *Dworkin:* Vincent buying Eugene's genes is the ultimate "insurance market" failure.
      *   *Cohen:* "Access to Advantage." Vincent has the access, but the *social meaning* of his genes blocks it.
      *   *Anderson:* "Democratic Equality." The film fails Anderson's test. It doesn't seek to end oppression, just to allow exceptions.
      *   *Nussbaum:* Is space travel a capability? No, but "aspiration" is.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about "Equality of Conversion Standing"?
      *   *Correction:* Make sure to explicitly name that concept and link it to "Blind Auditions" (Goldin & Rouse) vs. Luck Egalitarianism.
