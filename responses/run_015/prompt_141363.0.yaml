      *   **User's Thesis/Angle:** Vincent isn't asking for resource/welfare equality. He wants "equality of conversion standing" (effort $\rightarrow$ functioning). The problem isn't the genes, but the *admissibility of genetic evidence*. This differs from standard luck egalitarianism. Vincent rejects compensation but buys Eugene's genes (presses harshness objection). Question: Is the child's status brute or option luck?
      *   **User's Concerns/Requests for Critique:**
          1.  Is the currency actually capability or something perfectionist/Nussbaumian (excellence/space travel)?
