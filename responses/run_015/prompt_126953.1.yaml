  3.  **Identify the Flaw:**
      *   Premise (3) is the culprit. It assumes a "zero-sum" game of explanation: If desire explains $X\%$, then Duty explains $100-X\%$.
      *   *Why it looked harmless:* It seems intuitive that if I do something *mostly* because I like it, I'm doing it *less* because it's right. It treats motivation like a pie chart.
      *   *Why it's false:* In the fully virtuous agent, the desire *is* the shape the recognition of duty takes. They aren't competing causes; they are integrated. The desire is *responsive* to the rightness.
      *   *Alternative:* Moral worth tracks the *dependence* of the desire on the rightness, not the *absence* of the desire.

  4.  **Develop the Solution (Rejecting 3):**
      *   **Rejection:** Deny that moral worth varies inversely with non-moral desire.
      *   **Replacement for (2)/(3):** Instead of the "Detachment Condition" (would you do it without desire?), use a "Dependency Condition" (is the desire *sensitive* to the rightness?).
