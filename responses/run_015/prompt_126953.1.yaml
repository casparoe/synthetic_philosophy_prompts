answer: |-
  The step you must reject is **(3)**.

  Here is the diagnosis of why it looked harmless, what it costs to give it up, how to replace the test you lose, and how this resolves your three cases.

  ### 1. The Diagnosis: The Zero-Sum Fallacy

  Premise (3) asserts that moral worth varies *inversely* with the explanatory weight of non-moral desire. It assumes a **zero-sum model of motivation**: if desire explains 40% of the action, the right-making fact explains only 60%. On this model, desire and duty are competing causes, like two people pushing a car. If the car moves, and one person pushes harder, the other must have pushed less.

  This looked harmless because it aligns with a crude causal picture of psychology. If I ask, "Why did you eat the apple?" and you say "Because I was hungry" and "Because it was my share," it feels natural to ask, "But which one *really* made you do it?" It also appeals to the intuition that "purity" implies the absence of contaminants.

  But (3) is false because it misunderstands the relationship between reason and desire in a developed moral agent. In the fully virtuous agent, the desire is not a rival cause to the rightness; it is the **psychological embodiment** of the rightness. The desire does not compete with the reason; it *transmits* it.

  When a virtuous person helps a friend because they love them, the love is not a non-moral desire that *adds* to the explanation alongside duty. The love is the form their recognition of the friend's worth takes. To subtract the desire is not to reveal the "pure" duty underneath; it is to remove the mechanism by which the duty moves the will.

  ### 2. The Cost: Losing the Clean Counterfactual

  By rejecting (3), you must also modify **(2)**. You cannot keep the **Detachment Condition** ("Would you do it if desires didn't favor it?") as your primary test.

  **What you lose:** You lose the ability to assess moral worth through a simple, binary thought experiment. The Detachment Condition is clean because it isolates variables. It allows you to say, "We don't need to know what's in her head, just whether she'd act without the feeling." It offers a behaviorist-friendly shortcut to the will.

  **What this costs you:** You are forced back into the messy business of **moral psychology**. You can no longer judge worth solely by resilience in adverse counterfactuals; you must inquire into the *source* and *structure* of the agent's actual motivations. You have to distinguish between desires that are *allies* of the right and desires that are *usurpers*. This is harder to verify from the outside.

  ### 3. The Replacement: The Sensitivity Condition

  To replace the Detachment Condition, you need a **Sensitivity Condition** (or Constitutive Condition).

  **The Test:** An action has moral worth if the agent's motivating desire is *sensitive to the right-making features* of the action.
  *   **Virtuous Desire:** If the action ceased to be right (or good), the desire would fade. (e.g., I want to help *because* it helps).
  *   **Rival Desire:** If the action ceased to be right, the desire might persist. (e.g., I want to help *because* it makes me feel powerful).

  This preserves (1) (acting because it is right) without requiring the exclusion of desire. It demands that the desire be *transparent* to the value it pursues.

  ### 4. Solving the Three Cases

  Here is how rejecting (3) and adopting the Sensitivity Condition sorts your cases.

  **Case 1: The Worth-Seeker**
  *   **The Problem:** She acts from duty + desire for moral credit.
  *   **The Diagnosis:** Her desire for credit fails the Sensitivity Condition. She desires the *status* of worth, not the *ground* of worth. If the action were right but brought her no credit (perhaps even shame), her desire would not track the rightness; it would track the acclaim.
  *   **Verdict:** **Diminished Worth.** You win this intuition. The desire is a "second, independent route" because it targets a consequence of the action (her reputation/self-conception) rather than the value inherent in the action itself. It is self-referential, not world-referential.

  **Case 2: The Depleted Helper**
  *   **The Problem:** (3) implies her exhausted, desire-less act has *more* worth than her warm, sympathetic ones.
  *   **The Diagnosis:** Rejecting (3) blocks this. The earlier acts did not have "less" duty-explanation because they had "more" desire-explanation. In the warm acts, her sympathy was likely *constituted* by her perception of the patients' suffering (a moral fact). The desire was sensitive to the need.
  *   **Verdict:** **Equal or Greater Worth in the Warm Acts.** The exhausted act demonstrates *fidelity* (reliability), which is admirable, but it does not demonstrate a *better will* than the integrated will of the warm acts. Struggle is not a virtue; it is a cost of doing business in non-ideal conditions. We admire the nurse for enduring, but we should not say her will was *more* morally worthy when she was depleted than when she was whole.

  **Case 3: The Paramedic with a Standing Policy**
  *   **The Problem:** The Detachment Condition fails her (she wouldn't act without love).
  *   **The Diagnosis:** The Sensitivity Condition saves her. Her love for the work is not a rival to the rightness; it is her mode of attending to it. Her policy ("I will quit if the love goes") is not an admission that she won't do her duty; it is an acknowledgment that without the love, she is no longer the *kind of agent* who can perform this duty well. She recognizes that for this role, "duty without love" is ineffective or dehumanizing.
  *   **Verdict:** **Full Worth.** Her desire is not an independent route; it is the vehicle. The fact that she would quit is not a moral failure; it is a recognition of the dependency of her efficacy on her emotional engagement. She acts *because* it is right, and her love is the shape that recognition takes.

  ### 5. Distinguishing the Desires

  You asked: *What would a condition have to look like in order to distinguish an accompanying desire that is a second, independent route to the action from one that is merely the shape a person's grasp of the right takes?*

  The distinction lies in **Counterfactual Dependence on Value**, not **Independence from Desire**.

  *   **Independent Route (The Worth-Seeker):** The desire persists even if the *moral value* is removed, provided the *personal benefit* remains.
      *   *Test:* "If this action were right but secretly dishonorable (no one knowing), would you still want to do it?" If no, the desire is for honor, not rightness.
  *   **Shape of Grasp (The Virtuous/Paramedic):** The desire vanishes if the *moral value* is removed.
      *   *Test:* "If this action ceased to be helpful/right, would you still want to do it?" If no, the desire is tethered to the rightness.

  **The Cost Summarized:**
  By giving up (3), you give up the comfort of thinking that moral worth is a substance that gets diluted by emotion. You must instead accept that moral worth is a **structural property of the will**. It is not about how *much* desire is present, but about what the desire is *looking at*.

  *   If the desire looks at the **Self** (my worth, my comfort, my sympathy-as-feeling), it competes with duty.
  *   If the desire looks at the **Good** (the need, the right, the value), it collaborates with duty.

  Your friend's Kantian suspicion was correct that sympathy *can* be blind (a mere temperament), but wrong to think it *must* be. Your intuition was correct that the virtuous agent is better, but you needed a theory that allows desire to be the eyes of the will, rather than its anchor.
