prompt: |-
  I am a PhD student in environmental policy, and I have been asked to write the standing protocol on when to buy more information for a regional water authority whose technical advisory committee I sit on. Several times a year the committee must choose whether to commit to an expensive and largely irreversible intervention — a treatment plant upgrade, a levee setback, a buyout of irrigators' water rights — and, before each such choice, whether to fund monitoring (sampling, modelling, a pilot) to reduce the uncertainty first. Good's theorem settles the easy part: for an expected-utility maximiser, information that is free and that changes nothing but the agent's beliefs cannot reduce expected utility, so the live questions are only whether the information is worth its cost and whether it would actually change what the committee does. What I need from you is a procedure, not an explanation of the theorem.

  Please give me an ordered checklist the committee's staff could run on a monitoring proposal: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure terminates in a recommendation not to fund, and the points at which it must hand the question back to the committee on the grounds that it is a matter of values rather than of fact. Three recurring situations matter to me because I do not think the standard result covers them, and I want the procedure to say what to do with each rather than to ignore them. First, some of our measurements are not purely informational: the act of monitoring partly forecloses an option or locks in a path — exploratory drilling that commits us to a site, a pilot installation that constituents will then treat as permanent, design work begun early — so that collect-then-choose is not in fact available and the value of the information cannot be assessed independently of the intervention that produces it. Second, the committee will not update as the theorem assumes: it anchors on the staff's point estimate and moves only part of the way toward what the data say, and several of its members are avowedly ambiguity-averse and dislike learning things that would force a choice between options they currently treat as incomparable, which suggests that a strictly Bayesian value-of-information calculation may be advising an agent that does not exist. Third, some pilots do not merely sharpen a parameter; they reveal that a mechanism nobody had modelled is at work, and so expand the space of hypotheses rather than narrowing it.

  Then apply the procedure to two live proposals: funding two years of nutrient monitoring before choosing between upgrading the plant and paying farmers to retire irrigated land; and funding a pilot of a water-trading scheme that the legislature will roll out statewide whatever the pilot shows. I expect the procedure to recommend against the second, which will be an unwelcome conclusion for a committee that likes pilots, so I need that argument stated in a form that cannot be waved away as pedantry. Finally, say plainly what a procedure of this kind cannot settle — in particular how it should behave when the reliability of the proposed monitoring is itself the main thing in dispute, so that there is no agreed likelihood with which to compute anything.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **User:** PhD student in environmental policy, member of a Technical Advisory Committee (TAC) for a regional water authority.
      *   **Task:** Create a *standing protocol* (ordered checklist) for deciding when to buy more information (monitoring, modeling, pilots) before committing to expensive/irreversible interventions.
      *   **Constraints/Requirements:**
          *   Must be a procedure/checklist, not an explanation of Good's Theorem.
          *   Must include: Ordered questions, criteria for adequate answers, termination points (recommend not to fund), hand-off points (values vs. facts).
          *   Must address three specific recurring situations that challenge standard Value of Information (VoI) theory:
              1.  *Monitoring as Intervention:* Measurement forecloses options/locks in paths (e.g., exploratory drilling, pilot treated as permanent).
              2.  *Non-Bayesian Updating:* Committee anchors on point estimates, exhibits ambiguity aversion, dislikes forcing choices between incomparable options.
              3.  *Hypothesis Expansion:* Pilots reveal new mechanisms/hypotheses rather than just narrowing parameter uncertainty.
          *   Must apply the procedure to two live proposals:
              1.  Nutrient monitoring (Plant upgrade vs. Farmer buyout).
              2.  Water-trading scheme pilot (Legislature will roll out statewide regardless).
              *   *Expectation:* The procedure should recommend *against* the second proposal, with a robust argument.
          *   Must conclude with limitations: What the procedure *cannot* settle (specifically when monitoring reliability is disputed).

  2.  **Deconstruct the Theoretical Challenges:**
      *   *Standard VoI:* $EVSI > Cost$. Assumes information is free/neutral, updating is Bayesian, hypothesis space is fixed.
      *   *Challenge 1 (Irreversibility of Monitoring):* If monitoring *is* an intervention, we aren't comparing "Wait & Learn" vs. "Act Now." We are comparing "Act A (which includes learning)" vs. "Act B (blind)." This requires Real Options Analysis logic or treating the monitoring as a distinct intervention with its own NPV/risks.
      *   *Challenge 2 (Behavioral/Political Updating):* If the committee doesn't update rationally, expected utility calculations fail. The protocol needs to assess *decision influence*, not just statistical precision. It needs to ask: "Will this actually change the vote?"
      *   *Challenge 3 (Model Uncertainty/Discovery):* Standard VoI reduces variance. Discovery changes the model structure. This is "Value of Learning" vs. "Value of Information." The protocol needs to account for structural uncertainty.

  3.  **Drafting the Protocol (Iterative Process):**

      *   *Phase 1: Necessity & Decision Relevance.* Before calculating value, is the info needed?
      *   *Phase 2: The "Monitoring as Intervention" Check.* Address Challenge 1 early. If monitoring locks us in, it's not info gathering; it's a project.
      *   *Phase 3: The "Decision Influence" Check.* Address Challenge 2. Will the committee actually use it?
      *   *Phase 4: The "Structural Uncertainty" Check.* Address Challenge 3. Are we testing parameters or looking for black swans?
      *   *Phase 5: Cost-Benefit & Values.* The final economic check and the hand-off to the committee for value judgments.

      *Refining the Steps:*
      *   Need clear "Stop/No-Fund" criteria.
      *   Need clear "Hand-off to Committee" criteria (Values).
      *   Need to integrate the three challenges into the specific questions.

  4.  **Developing the Application Cases:**

      *   *Case 1: Nutrient Monitoring.*
          *   Intervention: Plant upgrade vs. Farmer buyout.
          *   Info: 2 years sampling.
          *   Analysis: Does sampling lock us in? (Probably not). Will it change the decision? (Depends on variance). Is the model structure stable? (Likely yes).
          *   Outcome: Plausible to fund if cost < risk of wrong choice.

      *   *Case 2: Water-Trading Pilot.*
          *   Intervention: Statewide rollout (mandatory).
          *   Info: Local pilot.
          *   Analysis: Challenge 1 is key here. The rollout is irreversible/mandatory regardless of pilot. The pilot cannot change the decision (Statewide rollout). Therefore, VoI = 0 regarding the *decision to rollout*.
          *   Argument: It's not a decision tool; it's political cover or implementation tweaking. If the goal is *decision-making*, it fails the protocol.
          *   Constraint Check: The prompt expects a recommendation *against* funding *as a decision tool*. I need to make sure the argument is ironclad so it can't be waved away. The key is: "If the action is predetermined, information has zero instrumental value."

  5.  **Addressing the Limitations:**
      *   What if we don't trust the monitor? (Challenge: Disputed Reliability).
      *   The protocol relies on agreed likelihoods. If the likelihood function is the fight, the protocol halts. It must declare a "Methodological Impasse."

  6.  **Writing the Content (incorporating tone and specificity):**
      *   *Tone:* Professional, bureaucratic but rigorous, actionable for staff.
      *   *Structure:*
          1.  Protocol Title & Purpose.
          2.  The Checklist (Phases 1-5).
          3.  Application to Case 1.
          4.  Application to Case 2 (The hard argument).
          5.  Limitations (The "Unknown Unknowns").

      *(Self-Correction during drafting)*: I need to make sure I explicitly handle the "Non-Bayesian" aspect in the checklist. Instead of asking "What is the posterior?", ask "What specific vote threshold does this move?" or "Does this resolve the ambiguity that is causing the deadlock?"
      *(Self-Correction on Case 2)*: The prompt says the legislature will roll it out *whatever the pilot shows*. This makes the VoI on the *rollout decision* exactly zero. The only value is in *how* to roll it out. I must distinguish between "Go/No-Go" value and "Implementation Design" value. If the proposal is framed as "Should we do this?", the answer is No. If framed as "How do we do this?", it might pass. The prompt implies the committee likes pilots generally, so I need to kill the "Go/No-Go" justification.

  7.  **Final Review against Constraints:**
      *   Ordered checklist? Yes.
      *   Adequate answers defined? Yes.
      *   Termination points? Yes.
      *   Value hand-offs? Yes.
      *   Three recurring situations addressed? Yes (Integrated into specific steps).
      *   Two cases applied? Yes.
      *   Recommendation against Case 2? Yes.
      *   Limitations section? Yes.

  8.  **Final Polish:** Ensure the language is precise (e.g., distinguishing "parameter uncertainty" from "model uncertainty"). Ensure the distinction between "Staff Recommendation" and "Committee Decision" is clear. (Proceed to generate output).

  *(Post-computation check)*: Wait, I need to ensure the "Non-Bayesian" part is handled carefully. The protocol shouldn't try to fix the committee's psychology but should account for it. If the committee *won't* update, the VoI is zero. The checklist needs a question like "Is there a documented mechanism by which this data changes the vote?"

  Let's refine the "Monitoring as Intervention" step. If drilling commits us to a site, the cost isn't just the drill; it's the *option value lost*. The checklist needs to quantify the "lock-in cost."

  Let's refine the "Hypothesis Expansion" step. Standard VoI assumes $H_1$ vs $H_2$. If the pilot reveals $H_3$, standard calc fails. The checklist needs to ask: "Is the risk of structural error higher than parameter error?"

  Okay, ready to write.s
answer: |-
  # STANDING PROTOCOL: EVALUATION OF MONITORING AND PILOT PROPOSALS
  **Authority:** Regional Water Authority Technical Advisory Committee (TAC)  
  **Purpose:** To determine whether public funds should be committed to information-gathering activities (monitoring, modeling, pilots) prior to irreversible infrastructure or policy interventions.  
  **Scope:** Applies to all staff proposals requesting funding for data collection where the stated purpose is to reduce uncertainty before a capital or policy decision.

  ---

  ## PART I: THE DECISION CHECKLIST

  Staff shall proceed through the following five phases in order. If a proposal fails a phase, the process terminates with a recommendation **NOT TO FUND** unless the specific "Hand-Off" conditions are met.

  ### PHASE 1: DECISION RELEVANCE (The "So What?" Test)
  *Objective: Establish that the information can theoretically alter the decision.*

  **Q1.1: What specific decision does this monitoring inform?**
  *   **Adequate Answer:** A binary or multi-option choice with a defined deadline (e.g., "Choose between Plant Upgrade vs. Irrigator Buyout by FY2026").
  *   **Inadequate Answer:** "To better understand the system," "To keep options open," or "Because we lack data."
  *   **Termination:** If no specific decision is identified, recommend **NOT TO FUND**.

  **Q1.2: Is the decision reversible or contingent?**
  *   **Adequate Answer:** The decision is irreversible (e.g., concrete poured, rights extinguished) OR the decision is contingent on the monitoring results (e.g., "We only build if nitrate > X").
  *   **Inadequate Answer:** The action will proceed regardless of the findings (e.g., "Legislature mandates rollout").
  *   **Termination:** If the action proceeds regardless of findings, the instrumental Value of Information (VoI) is zero. Recommend **NOT TO FUND** for decision purposes. (See *Hand-Off A*).

  ### PHASE 2: MONITORING AS INTERVENTION (The "Lock-In" Test)
  *Objective: Address Recurring Situation 1 (Monitoring forecloses options).*

  **Q2.1: Does the act of monitoring physically, legally, or politically constrain future options?**
  *   **Adequate Answer:** A list of constraints (e.g., "Drilling site becomes preferred plant location," "Pilot participants expect permanent program").
  *   **Inadequate Answer:** "Monitoring is neutral."

  **Q2.2: If constraints exist, is the "Monitoring Project" being evaluated as a distinct intervention?**
  *   **Adequate Answer:** The cost-benefit analysis includes the *cost of lost flexibility* (real options cost) and the *risk of path dependency*. The proposal treats the monitoring not as "prep work" but as "Step 1 of Intervention A."
  *   **Inadequate Answer:** The proposal treats monitoring costs as sunk overhead without accounting for the probability that monitoring forces the committee's hand.
  *   **Termination:** If monitoring locks in a path but is budgeted merely as "information," recommend **NOT TO FUND**. It must be re-submitted as a capital/project proposal.

  ### PHASE 3: UPDATING MECHANISM (The "Behavioral" Test)
  *Objective: Address Recurring Situation 2 (Non-Bayesian updating/Ambiguity Aversion).*

  **Q3.1: Is there a documented rule for how data changes the decision?**
  *   **Adequate Answer:** A threshold or trigger (e.g., "If model confidence interval narrows by >20%, we choose Option A; otherwise Option B").
  *   **Inadequate Answer:** "The Committee will review the data and decide."

  **Q3.2: Does the data resolve the specific type of uncertainty causing the deadlock?**
  *   **Adequate Answer:** Staff identifies whether the Committee is stalled by *risk* (known probabilities) or *ambiguity* (unknown probabilities/conflicting values). The monitoring must target the specific barrier.
  *   **Inadequate Answer:** The monitoring reduces parameter variance, but the Committee's deadlock is due to value conflicts or ambiguity aversion regarding model structure.
  *   **Hand-Off A (Values/Politics):** If the deadlock is driven by ambiguity aversion or incommensurable values (e.g., "We don't want to know because then we have to choose"), staff cannot resolve this via calculation. **HAND BACK TO COMMITTEE** with a note: *"Information will not resolve this impasse; this is a value judgment on whether to remain deliberately uncertain."*

  ### PHASE 4: STRUCTURAL UNCERTAINTY (The "Black Swan" Test)
  *Objective: Address Recurring Situation 3 (Hypothesis Expansion).*

  **Q4.1: Does the monitoring assume a fixed model structure?**
  *   **Adequate Answer:** The proposal acknowledges the current model may be wrong and includes methods to detect structural failure (e.g., residual analysis, unexpected correlation).
  *   **Inadequate Answer:** The proposal assumes the current model is true and only seeks to refine parameters.

  **Q4.2: Is the value of "discovery" accounted for?**
  *   **Adequate Answer:** If the pilot might reveal a new mechanism (Hypothesis C), the proposal estimates the cost of *not* knowing that mechanism exists versus the cost of the pilot.
  *   **Termination:** If the proposal claims to reduce uncertainty but ignores the risk that the underlying model is flawed, recommend **NOT TO FUND** as a VoI exercise. It may only be funded as basic research (see *Hand-Off B*).

  ### PHASE 5: COST-EFFECTIVENESS & FINAL RECOMMENDATION
  *Objective: Standard Economic Test.*

  **Q5.1: Does Expected Value of Sample Information (EVSI) > Cost of Monitoring?**
  *   **Adequate Answer:** Quantitative estimate showing that the reduction in expected loss from making the wrong decision exceeds the cost of the monitoring.
  *   **Inadequate Answer:** "The cost is small relative to the project." (Relative cost is irrelevant; absolute value is key).

  **Q5.2: Is the reliability of the monitoring method disputed?**
  *   **Adequate Answer:** Stakeholders agree on the likelihood function (the probability that the test yields Result X given State Y).
  *   **Hand-Off C (Methodological Impasse):** If stakeholders disagree fundamentally on whether the monitoring *works* (e.g., "That sensor doesn't measure what you think it measures"), the protocol cannot compute EVSI. **HAND BACK TO COMMITTEE** with a note: *"Cannot calculate value; reliability is the primary dispute."*

  ---

  ## PART II: APPLICATION TO LIVE PROPOSALS

  ### PROPOSAL A: Nutrient Monitoring (2 Years)
  *Context: Choice between Treatment Plant Upgrade ($50M) vs. Irrigator Buyout ($30M). Decision needed in 24 months.*

  **Protocol Run:**
  1.  **Decision Relevance:** Pass. Specific choice exists with a deadline.
  2.  **Lock-In:** Pass. Water sampling does not physically commit the authority to a site or technology. No path dependency identified.
  3.  **Updating Mechanism:** Pass. Staff can define a threshold (e.g., "If trend shows >5% increase, Upgrade; if stable, Buyout"). Committee has historically accepted water quality data as decisive.
  4.  **Structural Uncertainty:** Pass. Nutrient transport models are well-established. Risk of "unknown mechanism" is low compared to parameter uncertainty.
  5.  **Cost-Effectiveness:** Monitoring cost ($2M) is < Potential Loss of Wrong Choice (Estimated $10M regret).

  **Staff Recommendation:** **FUND.**
  **Rationale:** This fits the standard VoI model. The information is neutral, the decision is contingent, and the model structure is stable.

  ***

  ### PROPOSAL B: Water-Trading Scheme Pilot
  *Context: Proposal to fund a local pilot of a water-trading scheme. State Legislature has mandated a statewide rollout regardless of pilot results.*

  **Protocol Run:**
  1.  **Decision Relevance:** **FAIL (Q1.2).**
      *   *Finding:* The Legislature mandates statewide rollout *whatever the pilot shows*.
      *   *Implication:* The pilot cannot change the "Go/No-Go" decision. The instrumental Value of Information regarding the *adoption* of the scheme is exactly zero.
  2.  **Lock-In:** **FAIL (Q2.1 & Q2.2).**
      *   *Finding:* Pilots create constituencies. Participants will expect the scheme to continue locally. This creates political pressure that may force the Authority to implement the scheme locally even if the pilot shows it is inefficient, effectively bypassing the Committee's future choice.
  3.  **Updating Mechanism:** **FAIL (Q3.2).**
      *   *Finding:* Since the rollout is mandatory, the Committee is not allowed to use the data to stop the intervention. The data can only tweak *implementation details*, not the intervention itself.
  4.  **Cost-Effectiveness:** **FAIL (Q5.1).**
      *   *Finding:* EVSI on the main decision is $0. Cost is >$0.

  **Staff Recommendation:** **DO NOT FUND as a Decision-Support Tool.**
  **Rationale for the Committee (The "Unwelcome Conclusion"):**
  > "Colleagues, under the Standing Protocol, this proposal fails the 'Decision Relevance' test. Good's Theorem and Value of Information analysis rest on a single premise: that information is purchased to *change a choice*. Here, the choice (statewide rollout) is already made by the Legislature.
  >
  > Funding this pilot does not reduce the risk of making the wrong decision, because we are not allowed to decide. It is not an 'information purchase'; it is a 'delay tactic' or 'political cover.'
  >
  > If the goal is to learn *how* to implement the mandate, this should be budgeted as Implementation Cost, not Monitoring. If the goal is to see if we should *do* the mandate, this is a waste of funds because the answer is already 'Yes.' To fund this as 'monitoring' is to pretend we have agency we do not possess. I recommend rejecting the proposal unless it is re-scoped strictly as 'Implementation Design' with no expectation of influencing the Go/No-Go decision."

  ---

  ## PART III: LIMITATIONS OF THE PROCEDURE

  This protocol is a tool for instrumental rationality. It cannot settle disputes where the premises of rationality are themselves the subject of conflict. Staff must recognize three specific failure modes:

  **1. The Methodological Impasse (Disputed Reliability)**
  The protocol requires an agreed "likelihood function" (i.e., we must agree on how likely the data is to reflect reality). If the Committee or stakeholders dispute the *validity* of the monitoring technology itself (e.g., "That model is politically biased," "That sensor is known to drift"), the EVSI calculation cannot be performed.
  *   **Procedure:** Staff must declare a **Methodological Impasse**. Do not attempt to average the conflicting reliability estimates. Return the issue to the Committee as a *governance* problem, not a technical one. The Committee must first agree on what counts as truth before they can agree on the value of finding it out.

  **2. The Value of Delay**
  The protocol calculates the value of information, but not necessarily the value of *time*. Sometimes monitoring is funded not to learn, but to delay a politically toxic decision.
  *   **Procedure:** The protocol treats delay as a cost (discount rates, inflation). It does not capture the political benefit of avoiding a vote. Staff should note if a proposal appears to be "buying time" but cannot recommend funding on that basis.

  **3. Structural Ignorance (The "Unknown Unknown")**
  As noted in Phase 4, this protocol struggles when the monitoring might reveal that the entire conceptual model is wrong. Standard VoI assumes a fixed menu of hypotheses.
  *   **Procedure:** If the primary risk is structural model failure (not parameter variance), the protocol cannot generate a number. Staff must flag these proposals as **High-Risk Research** rather than **Decision Support**. The recommendation should be based on scientific merit, not economic return on decision quality.

  **4. Ambiguity Aversion**
  The protocol assumes the Committee *wants* to resolve uncertainty. As noted in Phase 3, some members may prefer ambiguity to avoid accountability for a hard choice.
  *   **Procedure:** The protocol cannot force the Committee to be Bayesian. If the Committee rejects information because it forces a choice between incomparable values (e.g., "Economy vs. Ecology"), the protocol terminates at **Hand-Off A**. Staff must explicitly state: *"Further information will not reduce conflict because the conflict is not about facts."*
