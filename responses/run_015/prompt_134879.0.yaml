  # HONEST NOTES & TROUBLESHOOTING

  **1. The Arithmetic Check**
  Your counts were correct.
  *   **Unconditional:** $0.5(0.6) + 0.5(0.6) = 0.6$. (Sharp).
  *   **Conditional on S (Red/Green):**
      *   P: $30/(30+20) = 0.6$.
      *   Q: $10/(10+30) = 0.25$.
      *   Interval: $[0.25, 0.6]$. (Dilated).
  *   **Conditional on Not-S (Blue/Yellow):**
      *   P: $30/(30+20) = 0.6$.
      *   Q: $50/(50+10) = 0.83$.
      *   Interval: $[0.6, 0.83]$. (Dilated).
  *   **No changes needed.**

  **2. The Bookie Vulnerability (Permissive vs. Strict)**
  You asked if the pump bites on every version of the view. **It does not.**
  *   **Permissive (E-admissibility):** "Accept if *some* $P$ in the set prefers it." **Vulnerable.** This is what I built into the script. It allows the Bookie to switch which "bag" justifies the trade.
  *   **Strict (Maximin):** "Accept only if *all* $P$ in the set prefer it." **Immune.** If you use this rule, the class would decline *both* trades (Bag Q rejects the buy at 0.55; Bag P rejects the sell at 0.35).
  *   **Why teach the Permissive one?** Because the Strict rule is often too paralyzing (you rarely trade). The Permissive rule is more attractive to decision theorists, which makes the vulnerability more philosophically significant. I have explicitly scripted the "Committee Rule" to enforce Permissiveness.

  **3. The "Sharp Bayesian" Objection**
  You are right to worry. A student *will* say: "I just assign 50% to Bag P."
  *   **Response:** Acknowledge it. "If you assign 50%, you are no longer playing the 'Ignorance' game. You are playing a 'Risk' game. You have added information (the 50/50 prior) that wasn't in the envelope. Dilation is the tax you pay for *not* adding that information."
  *   **Limit:** The activity cannot *force* them to be imprecise. It can only show the consequences *if* they are.

  **4. Information Choice Framing**
  I framed it as "Points to Ignore."
  *   **Risk:** If they vote to Ignore, the Bookie round dies.
  *   **Mitigation:** If they vote Ignore, take the 10 seconds to show the math on the board anyway ("Here is what you avoided"), then end early. It's a valid outcome: they successfully identified that information had negative value.
  *   **Why not individual?** Because you only have one marble. A class vote creates a "Tragedy of the Commons" feel which is engaging.

  **5. Timing**
  90 minutes is tight.
  *   If calculation drags, give them the conditional numbers ($0.6$ and $0.25$) and ask them to verify.
  *   If the Bookie round confuses them, slow down. The sure loss is the climax of the seminar. Do not rush the tally.

  **6. Why These Numbers? (Contriving vs. Random)**
  This is **contrived**, but not arbitrarily.
  *   **Feature 1:** $P(A|P) = P(A|Q)$. This is rare in random distributions. You specifically need the unconditional probabilities to match to get the initial sharpness.
  *   **Feature 2:** $S$ must be independent of $A$ in one bag (P) but dependent in the other (Q). In Bag P, knowing "Red or Green" doesn't change the chance of "Red or Blue" (it stays 0.6). In Bag Q, it crashes it.
  *   **Takeaway:** Dilation isn't a bug of *all* sets, but it is a feature of sets constructed from partitions where evidence correlates differently with the hypothesis across the partition.
