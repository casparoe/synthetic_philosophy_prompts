  # SEMINAR HANDOUT: THE MARBLE GAME

  **Name:** ___________________

  **The Setup**
  There are two opaque bags, **Bag P** and **Bag Q**. Each contains 100 marbles.
  The Instructor has selected one bag using a method written on a card in a sealed envelope. You do not know the method. You do not know which bag was chosen.
  One marble has been drawn from the chosen bag. It is currently hidden in the Instructor's hand.

  **The Distributions**
  | Colour | Bag P Count | Bag Q Count |
  | :--- | :---: | :---: |
  | **Red** | 30 | 10 |
  | **Blue** | 30 | 50 |
  | **Green** | 20 | 30 |
  | **Yellow** | 20 | 10 |
  | **Total** | **100** | **100** |

  **The Events**
  *   **Event A:** The marble is **Red or Blue**.
  *   **Signal S:** The marble is **Red or Green**.

  ---

  ### PART 1: PRE-MORTEM (Complete before any reveal)

  1.  **Current Credence:** Based on the table, what is your fair price for a ticket that pays $1 if **Event A** occurs?
      $__________

  2.  **Prediction:** In a moment, the Instructor will reveal whether **Signal S** is true or false. Once you know this, do you expect your range of reasonable prices for **Event A** to:
      [ ] Get Wider (Less Precise)
      [ ] Get Narrower (More Precise)
      [ ] Stay the Same
      **Why?** _________________________________________________________________________

  ---

  ### PART 2: THE INFORMATION CHOICE (Class Vote)

  The Instructor is holding the marble. They can tell you whether **Signal S** is true (Red/Green) or false (Blue/Yellow).

  *   **Option KNOW:** The Instructor reveals S. You proceed to the Bookie Round. **Bonus Points: 0.**
  *   **Option IGNORE:** The Instructor puts the marble back without looking. You skip the Bookie Round. **Bonus Points: +1.**

  **My Vote:** [ ] KNOW [ ] IGNORE

  ---

  ### PART 3: THE BOOKIE ROUND (Only if Class Votes KNOW)

  **Your Status:** You now have an *interval* of reasonable prices for Event A, not a single number.
  **Your Rule:** You are authorized to make a trade if **AT LEAST ONE** of the two bags (P or Q) makes the trade look profitable.

  **The Bookie (Student Volunteer) will make two offers.**
  *Record your decisions below.*

  **Offer 1:** The Bookie offers to **SELL** you a $1-if-A ticket for **$0.55**.
  [ ] Buy [ ] Decline
  *Reasoning (which bag approves?):* _________________________

  **Offer 2:** The Bookie offers to **BUY** a $1-if-A ticket from you for **$0.35**.
  [ ] Sell [ ] Decline
  *Reasoning (which bag approves?):* _________________________

  **Final Tally:**
  If you Bought at 0.55 and Sold at 0.35, your net loss is **$0.20**.
  Did you lose points? [ ] Yes [ ] No

  ---
  ---

  # INSTRUCTOR SCRIPT & RUN SHEET

  **Total Time:** 90 Minutes
  **Materials:** 18 Handouts, 1 Envelope (empty or with dummy text), 2 Bags (or images projected), 1 Marble (or token), Index Cards.

  ### 0:00 – 0:15 | SETUP & SHARPNESS
  **(Read aloud)**
  "Welcome. We are going to run a market today. There are two bags, P and Q, on the screen. I have selected one bag using a method in this sealed envelope. I will not open it. I have drawn one marble. It is in my hand.

  Look at the handout. Your first task is to price **Event A**: The marble is Red or Blue.
  Calculate the probability of A given Bag P. Calculate the probability of A given Bag Q.
  *(Wait for hands/calculators)*
  "Bag P is 60%. Bag Q is 60%.
  Since both possibilities yield 60%, your credence in A is sharp. It is exactly 0.6.
  If I offered to buy or sell a $1 ticket on A at $0.60, you should be indifferent. At $0.50, you should buy. At $0.70, you should sell. Everyone agree? Good."

  ### 0:15 – 0:25 | PRE-MORTEM
  **(Read aloud)**
  "Before I tell you anything else, turn to Part 1 of the handout.
  Write down your sharp price (0.6).
  Now, I am going to reveal **Signal S**: Whether the marble is Red or Green.
  I want you to predict: Once you know S, will your precision on A increase, decrease, or stay the same?
  Write down your prediction and *why*. Do not discuss with neighbors."
  *(Collect a few index cards randomly to show commitment. Do not read them yet.)*

  ### 0:25 – 0:35 | THE INFORMATION CHOICE
  **(Read aloud)**
  "Turn to Part 2. I am holding the information about S.
  Normally, information is free. Today, information is toxic to precision.
  I am offering the class a deal.
  If you vote to **IGNORE** the signal, I put the marble back. We stop. Everyone gets +1 Quiz Point.
  If you vote to **KNOW** the signal, I reveal it. We continue to the Bookie Round. No bonus points.
  By a show of hands: Who wants the point? Who wants to know?"
  *(Note: Curiosity usually wins. If they vote Ignore, acknowledge they avoided the trap, then reveal the math anyway. If they vote Know, proceed.)*
  "Curiosity wins. I will reveal S."
  *(Reveal the signal. For the math to work best, ensure S is TRUE (Red/Green). If you drew Blue/Yellow, the interval is [0.6, 0.83]. The pump still works but the numbers change. **For this script, assume S is TRUE.**)*
  "Signal S is TRUE. The marble is Red or Green."

  ### 0:35 – 0:45 | UPDATING THE INTERVAL
  **(Read aloud)**
  "Calculate your new probability for A (Red or Blue), given S (Red or Green).
  Do it for Bag P. Do it for Bag Q.
  *(Walk around. Help them.)*
  Bag P: Red is 30, Green is 20. Total S is 50. Red (which is A) is 30. 30/50 = **0.6**.
  Bag Q: Red is 10, Green is 30. Total S is 40. Red (which is A) is 10. 10/40 = **0.25**.
  So, Bag P says 0.6. Bag Q says 0.25.
  Your credence is no longer 0.6. It is the interval **[0.25, 0.6]**.
  Look at your Pre-Mortem. Did you predict the spread would widen?
  *(Pause)*
  "You started with a sharp number. You got free information. Now you have a mess. This is the first shock."

  ### 0:45 – 1:05 | THE BOOKIE ROUND
  **(Read aloud)**
  "Turn to Part 3. I need a volunteer to be the Bookie. Come to the front.
  *(Hand the Bookie a secret note: 'Offer 1: Sell ticket at 0.55. Offer 2: Buy ticket at 0.35.')*
  Class, listen carefully to your trading rule. You represent a committee. Bag P is one member, Bag Q is the other.
  **Rule:** You are authorized to make a trade if **AT LEAST ONE** member of the committee thinks it is profitable.
  If Bag P thinks it's a good deal, you can do it. If Bag Q thinks it's a good deal, you can do it.
  Bookie, make your first offer."

  **(Bookie Offer 1: Sell $1-if-A ticket for $0.55)**
  "Class, price is 0.55. Your interval is [0.25, 0.6].
  Bag P (0.6) says: 'Yes, value is higher than price.'
  Bag Q (0.25) says: 'No.'
  Under the **Permissive Rule**, Bag P overrules. You Buy. Record it."

  **(Bookie Offer 2: Buy $1-if-A ticket for $0.35)**
  "Bookie, make your second offer."
  "Class, price is 0.35.
  Bag Q (0.25) says: 'Yes, price is higher than value.'
  Bag P (0.6) says: 'No.'
  Under the **Permissive Rule**, Bag Q overrules. You Sell. Record it."

