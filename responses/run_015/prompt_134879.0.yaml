  ### 1:05 – 1:30 | DEBRIEF & THEORY
  **(Read aloud/Discuss)**
  "Keep your seats. Let's map this.
  1.  **Sharp Start:** You had a sharp credence (0.6) despite ignorance about the bag. This is possible when likelihoods align.
  2.  **Dilation:** Upon learning S, your interval widened ([0.25, 0.6]). This phenomenon is called **Dilation**.
  3.  **The Pump:** The Bookie exploited the **Permissive Decision Rule** (E-admissibility). You acted on *some* probability in your set, not *all*.

  **Predictable Failures:**
  *   **The Sharp Bayesian:** One of you is thinking, 'I would have just assigned 50% probability to Bag P and 50% to Bag Q. Then I'd have a sharp prior throughout.'
      *   *Response:* That is a valid move *if* you have evidence for the 50/50 split. But the envelope was sealed and the method unknown. Assigning 50/50 is a hidden assumption. This game models **Knightian Uncertainty** (ambiguity), not just Risk. If you insist on a sharp prior, you avoid dilation, but you claim knowledge you don't have.
  *   **The Splitter:** One of you bid 0.425 (the midpoint).
      *   *Response:* The midpoint has no decision-theoretic status here. It's not an expectation.
  *   **The Envelope Demand:** One of you wanted to open the envelope to see the bag selection method.
      *   *Response:* That would solve it, but in real life (e.g., climate models, economic forecasts), we often don't know the 'bag selection method.'

  **Why These Numbers?**
  "This wasn't random. To get dilation, we needed:
  1.  $P(A|P) = P(A|Q)$ (To start sharp).
  2.  $P(A|S, P) \neq P(A|S, Q)$ (To diverge after evidence).
  Specifically, in Bag P, S was irrelevant to A (both 0.6). In Bag Q, S was highly relevant (dropped to 0.25). The mixture creates the spread."

  **What This Activity Can't Do:**
  "This game shows dilation *can* happen and *can* lead to sure loss under permissive rules. It does not prove you *must* use imprecise credences. The Sharp Bayesian can always say: 'I refuse to model my ignorance as a set. I will pick a prior.'
  The lesson is: If you *do* model ignorance as a set (to be honest about what you don't know), you pay a price in decision stability. You cannot have both perfect honesty about ignorance and immunity to Dutch Books."

  "Name drop: This is **Dilation**, discussed by Walley (1991), Herron et al. (1994). The pump relies on **E-admissibility**.
  Class dismissed."

