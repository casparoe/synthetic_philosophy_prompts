answer: |-
  There is currently no single, canonical term in cognitive science or philosophy of technology that captures this precise configuration. Your observation identifies a nuanced gap in the existing literature: most frameworks describe either total reliance (automation bias) or seamless integration (the "centaur" model), but few address the specific asymmetry where **local verification remains intact while global synthesis becomes externally dependent.**

  However, this phenomenon sits at the intersection of several established concepts. To understand it, we must look at where existing terms fall short, how it differs from ordinary division of labour, and what a precise nomenclature would require.

  ### 1. Existing Concepts and Their Limitations

  Several terms approach this phenomenon but fail to capture the specific *local-validity/global-dependency* split you described:

  *   **The Extended Mind Thesis (Clark & Chalmers):** This argues that tools can be part of the cognitive process itself. While your scenario fits the definition of an extended cognitive system, the thesis is generally neutral or positive regarding the *location* of cognition. It does not inherently describe the *degradation* of internal global modeling that you are observing.
  *   **Transactive Memory Systems:** Originally describing how couples or teams store memory distributively (e.g., "I don't need to know the date, I know *you* know the date"). In your scenario, the AI becomes the transactive partner holding the "directory" of the argument's architecture. However, traditional transactive memory implies a social contract of trust; your scenario involves active *verification* of the steps, which complicates the trust dynamic.
  *   **Digital Amnesia (The Google Effect):** This refers to the tendency to forget information that can be easily looked up. This is too broad; it usually applies to facts (dates, names). You are describing the loss of *structural topology* (the logical connections between claims), which is a higher-order cognitive function than simple fact retrieval.
  *   **Cognitive Offloading:** This is the umbrella term for using tools to reduce cognitive demand. It is insufficient because it implies a reduction in effort. In your scenario, the user is still exerting effort (local verification), but the *nature* of the effort has shifted from synthesis to audit.

  ### 2. Distinction from Cognitive Division of Labour

  To distinguish this from ordinary cognitive division of labour, we must look at the **locus of integration**.

  *   **Ordinary Division of Labour:** Specialization is the key. I handle the premises; you handle the conclusion. I trust your expertise in your domain. I do not necessarily verify your steps, nor do I need to understand how your output integrates with mine beyond the hand-off point. The boundary is **functional**.
  *   **Your Observed Configuration:** The boundary is **structural**. You are verifying the steps (local function), but you are unable to reconstruct the *necessity* of the sequence without the tool. In a division of labour, if the partner disappears, I can theoretically redo their work (given time/skill). In your configuration, if the AI disappears, you lose the *map* of the territory you just walked. You possess the bricks (local claims) but have outsourced the mortar (the architectural logic holding them together).

  Therefore, this is not a division of labour (splitting tasks) but a **fragmentation of coherence**. The coherence of the argument exists only in the coupled system (Human + AI), not in the human agent alone.

  ### 3. Toward a Suitable Nomenclature

  If we were to coin or select a term to capture this precise boundary, it needs to satisfy three criteria:
  1.  **Agency:** It must acknowledge that the user is still actively thinking (verifying).
  2.  **Topology:** It must indicate that the *structure* (not just content) is externalized.
  3.  **Dependency:** It must imply that the internal model is incomplete without the tool.

  Here are three candidate framings, ranging from descriptive to theoretical:

  #### A. Structural Offloading
  This is the most direct descriptive term. It distinguishes itself from *computational* offloading (doing the math) or *memory* offloading (storing the facts). It specifies that the **logical architecture** is what has been moved outside the skull.
  *   *Why it fits:* It captures that the "steps" are internal (verified) but the "structure" is external.

  #### B. Asymmetric Internalization
  This draws from learning theory (internalizing a skill). In normal learning, scaffolding is removed as understanding grows. Here, the scaffolding (the AI's structuring of the argument) remains permanent. The internalization is *asymmetric*: high for the nodes, zero for the edges.
  *   *Why it fits:* It highlights the imbalance between local understanding and global understanding.

  #### C. Distributed Coherence
  This borrows from systems theory. It suggests that the "coherence" or "validity" of the whole argument is a property of the distributed system, not the individual. The human validates the parts; the system validates the whole.
  *   *Why it fits:* It captures the epistemic status of the argument. It is not "my argument" nor "the AI's argument," but a coherent object that only exists in the interaction.

  ### 4. Recommendation

  If you are writing on this, **"Structural Offloading"** is likely the most robust term for general discourse, as it clearly differentiates from simple memory loss or calculation outsourcing.

  However, if you wish to emphasize the epistemic risk (the inability to reproduce the framework), **"Architectural Dependency"** is more precise. It conveys that the user has become dependent on the tool not for the *content* of thought, but for the *blueprint* of thought.

  **Summary Definition:**
  > **Architectural Dependency:** A cognitive state in human-AI coupling where the agent retains the capacity for local verification and step-wise critique, but loses the capacity to independently reconstruct the global logical topology, rendering the integrative structure of the work dependent on the continued presence of the tool.

  This distinguishes it from *deskilling* (loss of local ability) and *collaboration* (shared internalization), isolating the specific erosion of **synthetic memory**.
