      *   Principle 1: "Reviewer must verify the final verdict." -> Consistent: P1, P2. Inconsistent: P5 (reviewer doesn't verify crux). Prediction for P6: Reject (reviewer can't verify 'no vuln' fully).
      *   Principle 2: "Every claim used in the argument must be locally verifiable." -> Consistent: P1, P2, P5, P6. Inconsistent: P3 (claims about literature not verifiable in time), P4 (no facts). Prediction for P6: Fund.
      *   Principle 3: "There must be an objective fact of the matter." -> Consistent: P1, P2, P3, P5, P6. Inconsistent: P4. Prediction for P6: Fund.
      *   Principle 4: "Pilot corpus must represent the full space of outcomes." -> Consistent: None explicitly (P1-P5 silent). Inconsistent: P6 (as proposed). Prediction: Fund with conditions.

      *Refining `working_note`:* Must include a principle the committee would disown. "Fund projects where the reviewer feels productive even if the models are colluding."

      *Refining `recommendation`:* Decision should be "fund_with_conditions". Conditions need to address the corpus bias and the "No" side difficulty.

      *Refining `underdetermination`:* Precedents don't fully settle it because P5 breaks the "reviewer verifies truth" pattern established in P1/P2.

      *Refining `discriminating_pilot`:* Needs to distinguish between "Local Verifiability" vs "Global Verifiability".

      *Refining `questions_for_applicants`:* Focus on the "No" case and the corpus.

      *Check JSON Schema:* Ensure all keys match exactly. Ensure no markdown outside JSON.

