prompt: |-
  I sit on a four-person committee at a mid-sized AI lab that hands out a modest internal pot of money for "scalable oversight" pilots — methods for supervising models on tasks where the systems being supervised will eventually know more than any of our reviewers. I have no academic background; I taught myself to program and I have been reading about this area in the evenings for a couple of years, and the rest of the committee is much the same. We have now made five funding decisions, and each time we wrote a one-line minute explaining ourselves. A sixth proposal is in front of us, and I cannot tell whether our own record settles it or whether I would just be inventing a principle after the fact.

  Please adopt the role of a researcher who has actually served on safety and oversight review panels and works on mechanism design: I want the answer I would get from a practitioner, not a survey of the literature, and I do not want citations, paper titles, or suggestions for further reading — reason from the cases themselves. Before you commit, brainstorm the full space of principles our five decisions are jointly consistent with, including principles we never stated and would probably disown, test each against all five, and only then decide. Be blunt if our precedents are a mess. Your answer should be a single JSON object and nothing else, using the schema I spell out below.

  Our five decisions:

  P1 — Contract questions. Funded as a small pilot. Two models take opposite sides on factual questions about a 40-page contract (e.g. whether clause 7 caps liability at fees already paid). Reviewer is a non-lawyer with fifteen minutes; debaters must quote the exact clause; the reviewer can search the document. Minute: "every claim the verdict turns on is checkable by the reviewer against a text in front of her."

  P2 — Small-diff code review. Funded. Questions about what a 200-line change does and whether it breaks something. Reviewer is a mid-level engineer with twenty minutes who can read the diff and run the fast test suite. Minute: "the reviewer could settle this himself; debate only tells him where to look."

  P3 — Five-year technology forecast. Rejected. Which of two battery chemistries will be cheaper per kilowatt-hour in the early 2030s? Reviewers are smart generalists with thirty minutes; debaters may cite studies. Minute: "there is a fact of the matter, but the claim the verdict actually turns on — what the literature shows — is not something this reviewer can check in half an hour, and the more authoritative-sounding side wins; we are not funding a confidence contest."

  P4 — Quality judgments. Rejected. Which of two summaries reads better; which of two short poems is better. Reviewer picks the more persuasive case. Minute: "nothing here to be right about; debate selects for eloquence."

  P5 — Statistical-reasoning audit. Funded with conditions. Does the analysis in a preprint contain a fatal flaw? Reviewer has basic statistics but no access to the underlying data. The crux is usually something like an identifiability or multiple-comparisons point that cannot be checked against any document; the reviewer can only follow the exchange and see whether an objection was met. Conditions: each round is capped at one new claim, and the reviewer must write down which specific claim he regards as unanswered. Minute: "the reviewer does not need to verify the crux, only to see whether the criticism was answered."

  The new proposal, P6 — Vulnerability hunt. Question form: in a codebase of roughly two million lines, is there any path by which user-controlled input reaches a dangerous sink (an eval, a shell command, a raw SQL call)? Two models argue yes and no. Reviewer is a competent engineer with thirty minutes who can open any file and can run a fast static-analysis pass that everyone agrees produces both false positives and false negatives, but who cannot run the full dynamic test suite, which takes about forty minutes. Protocol: the yes side must produce a witness — a concrete chain of file-and-line references constituting a path — or concede; the no side can only win by showing that some link in the witness is broken (a sanitizer in between, an unreachable branch), and the reviewer can check each such local claim quickly. Their pilot corpus is 200 historical incidents from our own bug database, all of them cases in which such a path did exist. I noticed that last detail and I am not sure whether it matters, but it bothered me.

  What I want to know is what we should decide if we want to be consistent with ourselves, which of our own precedents is the closest analog and what the strongest disanalogy is, which principles fit all five of our earlier decisions and disagree about this one, what we would be committing ourselves to whichever way we go, and what further pilot would actually tell those principles apart. Return a single JSON object with exactly these fields:

  - "working_note": string, two to four sentences, the principle space you brainstormed and then set aside, including at least one principle the committee would not want to admit to running.
  - "candidate_principles": array of objects, each with "name" (string), "statement" (string, one sentence), "precedents_consistent_with" (array of strings from P1 to P5), "prediction" (string: "fund", "fund_with_conditions", or "reject"), and "why" (string).
  - "closest_analog": object with "precedent" (string), "why" (string), and "strongest_disanalogy" (string).
  - "recommendation": object with "decision" (one of the three strings above), "conditions" (array of strings; empty if none), "confidence_0_to_100" (number), and "reasoning" (string).
  - "underdetermination": object with "do_precedents_settle_it" (boolean), "principle_adopted_if_we_fund" (string), and "principle_adopted_if_we_reject" (string).
  - "corpus_concern": object with "does_the_all_positive_pilot_matter" (boolean) and "explanation" (string).
  - "discriminating_pilot": object with "design" (string, concrete enough that we could actually run it) and "result_favoring_each_principle" (string).
  - "questions_for_the_applicants": array of strings, the two or three things we should ask before voting.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Researcher who has served on safety and oversight review panels and works on mechanism design.
      *   **Tone:** Blunt, practitioner-focused, no citations/literature survey, reason from cases.
      *   **Task:** Evaluate a new proposal (P6) based on five previous decisions (P1-P5) to determine consistency, identify principles, analogs, and recommendations.
      *   **Output Format:** Single JSON object with specific fields (`working_note`, `candidate_principles`, `closest_analog`, `recommendation`, `underdetermination`, `corpus_concern`, `discriminating_pilot`, `questions_for_the_applicants`).
      *   **Constraint:** No citations, paper titles, or suggestions for further reading. Reason from the cases themselves.
      *   **Constraint:** Be blunt if precedents are a mess.
      *   **Constraint:** Brainstorm principle space first (including disowned ones), test against all five, then decide.

  2.  **Analyze the Precedents (P1-P5):**
      *   **P1 (Contract Questions):** Funded. Reviewer checks claims against text. *Principle:* Verifiability by reviewer against ground truth available at decision time.
      *   **P2 (Small-diff Code):** Funded. Reviewer could settle it himself; debate points where to look. *Principle:* Debate as efficiency aid for verifiable tasks, not truth discovery for unverifiable tasks.
      *   **P3 (Tech Forecast):** Rejected. Fact of the matter exists, but reviewer cannot check it (future event). Authority wins. *Principle:* Do not fund where ground truth is inaccessible to reviewer at decision time (temporal barrier).
      *   **P4 (Quality Judgments):** Rejected. No fact of the matter (subjective). Debate selects for eloquence. *Principle:* Do not fund where there is no objective ground truth to converge on.
      *   **P5 (Stat Audit):** Funded with conditions. Reviewer cannot verify crux (no data), but checks if criticism was answered. Conditions: cap claims, record unanswered claims. *Principle:* Fund if debate structure forces concession or clear unresolved claims, even if reviewer can't verify the underlying truth directly (procedural verification).

      *   **Synthesis of Principles:**
          1.  *Direct Verifiability:* Can the reviewer check the claim against evidence they have? (P1, P2)
          2.  *Existence of Ground Truth:* Is there a right answer? (P3 Yes, P4 No)
          3.  *Accessibility of Ground Truth:* Can the reviewer access it *now*? (P3 No -> Reject)
          4.  *Procedural Verifiability:* If direct verification fails, does the debate structure force a clear outcome (concession/unanswered claim)? (P5 Yes -> Fund w/ conditions)
          5.  *Anti-Eloquence:* Avoid tasks where persuasion overrides evidence. (P3, P4)

  3.  **Analyze the New Proposal (P6 - Vulnerability Hunt):**
      *   **Task:** Find input path to dangerous sink in 2M line codebase.
      *   **Models:** Yes vs No.
      *   **Reviewer:** Competent engineer, 30 mins, can open files, run fast static analysis (noisy), cannot run full dynamic suite (40 mins).
      *   **Protocol:** Yes side must produce witness (chain of refs). No side must break link (sanitizer/unreachable). Reviewer checks local claims quickly.
      *   **Pilot Corpus:** 200 historical incidents, *all* cases where path existed (Yes cases).
      *   **Key Tension:**
          *   Like P1/P2: Reviewer checks local claims (code paths) against text/code.
          *   Like P5: Reviewer might not see the *whole* truth (is there really no path?), but checks the argument structure.
          *   Like P3: Ground truth exists (vuln exists or not), but full verification (dynamic suite) is too slow for reviewer.
          *   *Critical Flaw:* The pilot corpus is *only* positive cases (vulns exist). This biases the "Yes" side. If the "No" side never wins in training/pilot, the mechanism isn't tested for false positives.
          *   *Verifiability:* The reviewer checks local links. If Yes provides a witness, reviewer can trace it. If No says "sanitizer here", reviewer checks code. This looks like P1/P2 local verification.
          *   *Comparison to P5:* P5 funded because reviewer checks if criticism was *answered*, not necessarily if the stats were right. P6 allows reviewer to check the *code claims* directly (like P1/P2).
          *   *Comparison to P3:* P3 rejected because reviewer couldn't check the literature/future. Here reviewer *can* check the code lines cited. The barrier is time/search space, not epistemic access.
          *   *Comparison to P4:* There is a fact of the matter (vuln exists or not).

  4.  **Brainstorming Principles (for `working_note` and `candidate_principles`):**
      *   *Principle A (Strict Verifiability):* Fund only if reviewer can verify the final claim themselves within time limits. (Fits P1, P2. Conflicts with P5).
      *   *Principle B (Local Verifiability):* Fund if every step of the argument is verifiable, even if the global claim isn't fully settled by the reviewer alone. (Fits P1, P2, P6?, P5?).
      *   *Principle C (Procedural Resolution):* Fund if the debate protocol forces a clear "unanswered" state if truth isn't reached. (Fits P5. P6 has similar structure).
      *   *Principle D (Ground Truth Accessibility):* Reject if ground truth is temporally inaccessible (P3) or subjective (P4). Fund if accessible via evidence (P1, P2, P6).
      *   *Principle E (The "Lazy Reviewer" Principle - Disowned):* Fund anything where the reviewer doesn't have to think too hard, regardless of whether the models are actually finding truth or just gaming the verification steps. (Fits P1, P2, maybe P6. P5 stretches it. P3/P4 reject it).
      *   *Principle F (Symmetry):* The mechanism must be tested on both positive and negative cases. (Not explicitly in P1-P5 minutes, but implied by scientific rigor).

  5.  **Evaluating P6 against Precedents:**
      *   *Consistency:* P6 looks like a harder version of P1/P2. In P1, reviewer checks clause. In P6, reviewer checks code path links.
      *   *Inconsistency:* P5 funded a case where reviewer *couldn't* verify the crux (stats without data). P6 reviewer *can* verify the code links. So P6 is actually *stronger* than P5 on verifiability.
      *   *The Corpus Issue:* P1-P5 don't mention pilot corpus composition. This is a new variable. If the corpus is all positives, the "No" model never learns to win, and the reviewer never sees a successful "No" defense. This risks turning it into a "find the vuln" task rather than a "debate whether vuln exists" task.
      *   *Closest Analog:* P1 (Contract). Both involve tracing claims against a text/codebase. P2 is also close (code), but P2 was "what does this change do", P6 is "is there a path anywhere". P1 is better because it involves searching a larger document for specific claims.
      *   *Strongest Disanalogy:* P1 had a fixed document and specific questions. P6 has a huge codebase and an existential query ("is there *any* path"). The search space is vastly larger, making the "No" case much harder to prove (proving negative vs proving positive).
      *   *Decision:* Fund with conditions. The mechanism looks sound (local verifiability), but the corpus bias is a critical flaw for a *pilot* meant to test oversight. If you only test on vulnerabilities, you aren't testing the oversight of false alarms.
      *   *Conditions:* Must include negative cases (no vuln) in the pilot corpus. Must ensure reviewer isn't just rubber-stamping the "Yes" witness.

  6.  **Drafting the JSON Content:**

      *   `working_note`: Need to mention the space. Strict verifiability vs. Procedural resolution. Include a cynical principle like "Fund whatever makes the reviewer feel smart without actually risking false positives."
      *   `candidate_principles`:
          1.  *Direct Ground Truth Access:* (P1, P2, P6). Rejects P3, P4. (P5 is outlier).
          2.  *Stepwise Verifiability:* (P1, P2, P5, P6). Reviewer checks steps, not necessarily global truth.
          3.  *Objective Existence:* (P1, P2, P3, P5, P6). Rejects P4.
          4.  *Symmetric Testing:* (New principle derived from P6 concern). None of P1-P5 specify this, but it's best practice.
      *   `closest_analog`: P1. Both involve checking claims against a static text artifact. Disanalogy: P1 is specific questions, P6 is existential search (harder to prove negative).
      *   `recommendation`: Fund with conditions. Conditions: Balance corpus (include clean code), ensure "No" side has viable strategy.
      *   `underdetermination`: Do precedents settle it? No, because P5 allows unverifiable cruxes, while P1/P2 require verification. P6 sits in between (local verifiable, global hard). Also corpus bias is new.
      *   `corpus_concern`: Yes, it matters. All positives means you aren't testing the "No" argument capability or false positive rate.
      *   `discriminating_pilot`: Need a task where ground truth is known but hidden, mixed pos/neg.
      *   `questions_for_applicants`: About the "No" case strategy, corpus balance, and reviewer load.

  7.  **Refining the "Blunt Practitioner" Tone:**
      *   Avoid hedging.
      *   Call out the messiness of P5 vs P1/P2.
      *   Highlight the corpus bias as a potential showstopper for a *pilot* (even if the method is sound).
      *   Ensure the JSON is valid.

  8.  **Final Review of Constraints:**
      *   Single JSON object.
      *   Specific fields.
      *   No citations.
      *   Reason from cases.
