      *   *Is the face recognition impossible?* Yes, strictly speaking. You can't recognize a visual pattern you've never encoded. I must emphasize this.
      *   *The Shape Test:* Why is a cube vs. sphere hard? Edges vs. curves, shading. Without prior experience, a circle on the retina could be a sphere or a flat disk. A square could be a cube or a flat rectangle. Touch resolves this ambiguity instantly. Vision requires learning the cues.

  7.  **Final Structure:**
      1.  Validate the experience (It's a known phenomenon).
