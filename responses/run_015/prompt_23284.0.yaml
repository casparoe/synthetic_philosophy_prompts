answer: |-
  This is a fascinating situation, and your confusion is completely understandable. What you are witnessing is not a failure of her eyes, but a normal stage in the development of a brain that is learning to see for the first time.

  There is a very strong scientific and philosophical explanation for what you are seeing. In fact, your anecdote mirrors a famous thought experiment known as **Molyneux's Problem**, and modern neuroscience has largely confirmed the answer your friend gave you.

  Here is a breakdown of what is likely happening.

  ### 1. Sensation vs. Perception
  The most important distinction to make is between **sensation** (the eyes receiving light) and **perception** (the brain interpreting that light).

  Her operation successfully fixed the *sensation*. Her corneas, lenses, and retinas are now transmitting clear images to her brain. However, **vision is a learned skill.** For a sighted person, the brain spends infancy and childhood learning how to interpret edges, shadows, depth, and perspective. Because your friend was blind from birth, her visual cortex (the part of the brain that processes sight) has never done this work before.

  She has the hardware (eyes), but she is still installing the software (brain processing).

  ### 2. Molyneux's Problem
  In 1688, the scientist William Molyneux asked a specific question: *If a man born blind could distinguish by touch between a cube and a sphere of the same size, would he, upon suddenly gaining sight, be able to distinguish them by sight alone before touching them?*

  For centuries, this was philosophy. Today, we have empirical data. In cases where congenital cataracts are removed in older children or adults (such as studies from **Project Prakash** in India), the answer is almost always **no.**

  Patients can see the objects clearly (high acuity), but they cannot interpret the 2D image on their retina as a 3D shape. To them, a cube and a sphere might both look like complex patches of color and light. They do not yet know that a specific pattern of shading implies "roundness" or that a sharp change in light implies an "edge." They must learn to associate what they see with what they already know through touch.

  ### 3. The Discrepancy in Your Visit
  You mentioned that she recognized your face and her coffee mug, which makes the inability to see the shapes seem contradictory. However, there are likely other explanations for those successes that don't rely on complex visual processing:

  *   **Recognizing You:** Since she was blind from birth, she has no visual memory of your face. She cannot "recognize" it visually in the way you and I do. It is highly probable she recognized you by your **voice, your gait, your scent, or the context** of who was visiting her. She may have *said* she recognized your face to be polite, or she may feel she is beginning to associate your visual appearance with your identity, but it isn't true visual recognition yet.
  *   **The Coffee Mug:** If the mug was in its usual place, she found it using **spatial memory**, not vision. She knows where her things live.
  *   **Pouring Water:** This is largely a **proprioceptive** skill (knowing where your body is in space). She likely learned to pour water by sound and feel when she was blind. Doing it without spilling now is likely due to her existing muscle memory, perhaps aided by the general ability to see the glass, even if she can't perfectly judge its geometry.

  ### 4. Why Shapes Are Harder Than Faces or Mugs
  Identifying a geometric shape is actually one of the hardest visual tasks for a new-sighted brain.
  *   **Faces:** Humans have a specific part of the brain (the fusiform face area) dedicated to faces. Some processing here may be more innate or develop quickly.
  *   **Familiar Objects:** These are recognized by context and memory.
  *   **Novel Shapes:** A metal ball and a cube provide no context. To distinguish them visually, her brain must interpret **shading gradients** (the way light falls on a curve vs. a flat side) and **occlusion** (how the object blocks light). Without prior experience, a circle on the retina could be a sphere, or it could be a flat red disk. A square could be a cube, or a flat rectangle facing her.

  Touch, conversely, gives immediate geometric data. Her hands know the truth instantly; her eyes are still guessing.

  ### Conclusion
  There is likely **nothing wrong with her vision.** Her eyes are working perfectly. What you are witnessing is the incredible, difficult process of neuroplasticity.

  Her brain is currently flooded with visual data that it doesn't yet have a map for. Over the coming months and years, she will begin to link her tactile knowledge (what a cube feels like) with her visual input (what a cube looks like). Eventually, she will be able to tell the difference instantly, but right now, she is essentially a visual infant, and her honesty about needing to touch the objects is a sign that her cognitive processing is functioning correctly, even if her visual interpretation is not yet developed.

  **Recommendation:** The best thing you can do is be patient. Continue to visit and describe what you see. Help her build that library of visual associations. It is a miracle that she can see at all; the understanding of what she sees will come with time.
