      *   *The Stalemate:* They agree on the *phenomena* (fire burns cotton, drug cures patient) but disagree on the *ontology* underlying the phenomena.
      *   *Is it Verbal?* Partially. They are using the word "cause" (sabab) to pick out different relations. But it's deeper than just definition; it's about what exists.
      *   *Is it Theological vs. Metaphysical?* Yes, this is crucial. Ghazali is prioritizing Divine Omnipotence (theological constraint). Avicenna/Aristotelians are prioritizing Intelligibility of Nature (metaphysical constraint).
