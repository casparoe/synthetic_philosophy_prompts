prompt: |-
  Please act as a professional philosopher and historian of early modern ideas, with expertise in computationalism and the philosophy of mind. Take a moment to brainstorm, then think carefully and give me a committed answer: take a definite position on what the passage means and what it implies, with reasons, and don't just lay out the options for me to pick.

  I'm writing a novel set in an alternate 1650s and I'm a bit stuck. My protagonist, a young instrument-maker, builds a brass "consequence engine" — a clockwork device that, as she puts it, adds and subtracts the consequences of general names agreed upon and prints the results on a ribbon so it can demonstrate its reckonings whilst the crowd watches. She claims that, on Hobbes's own account, the engine is reasoning, and therefore that a brain is just such a computer. Here's the bit from Hobbes's Leviathan (1651), chapter 5, that she keeps quoting:

  "For Reason, in this sense, is nothing but Reckoning (that is, Adding and Substracting) of the Consequences of generall names agreed upon, for the marking and signifying of our thoughts; I say marking them, when we reckon by our selves; and signifying, when we demonstrate, or approve our reckonings to other men."

  Two things I need help with, which are definately seperate in my head. First, what on earth does Hobbes mean by "the Consequences of generall names agreed upon", and by the split between marking our thoughts when we reckon by ourselves and signifying them when we demonstrate to others? Second, my engine only has the public signifying bit — it prints demonstrations but does nothing we'd call private marking — so on a committed reading of this passage, is the engine reasoning, merely mimicking reason, or is the question ill-posed? And what does that committed reading suggest about the bigger claim that the brain is a computer: does Hobbes's reckoning picture support computationalism, or does the marking/signifying distinction quietly smuggle in something non-computational, like a need for a private inner life? Please commit to one interpretation of the passage and its implication for the brain-computer question, give me your reasons, and flag where you're least confident.
