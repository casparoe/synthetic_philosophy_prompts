answer: |-
  Here is the specification for a theory of betterness tailored to your institutional constraints.

  ### The Specification: Desiderata for Institutional Betterness

  The following requirements are derived from the functional need for a **one-shot, mandatory, publicly justifiable verdict**. They are not ranked by moral importance, but by their necessity for the institution to function without arbitrariness.

  **1. Verdict Closure (Completeness)**
  *   **The Requirement:** For any two available outcomes $A$ and $B$, the theory must assert either that $A$ is better than $B$, $B$ is better than $A$, or they are equally good. It cannot declare the relation indeterminate or undefined.
  *   **The Case:** The institution cannot abstain. If the theory says "the value is undefined here," the institution has no algorithm to select a option. To choose without a verdict is arbitrary; to abstain is forbidden by the job description.

  **2. Choice Stability (Acyclicity)**
  *   **The Requirement:** The "better than" relation must not generate cycles. You cannot have a sequence where $A$ is better than $B$, $B$ better than $C$, ..., and $Z$ better than $A$.
  *   **The Case:** This is not merely a decision-theorist's prejudice about money pumps. For a public institution, a cycle implies that for any choice made, there is a available alternative that the theory itself ranks as superior. If the losers can point to an option $Z$ that the theory ranks above the chosen $A$ (via a chain of reasoning the theory accepts), the public justification collapses. The institution would be admitting it chose an option it acknowledges as inferior.

  **3. Spectrum Continuity (Sensitivity to Small Differences)**
  *   **The Requirement:** The theory must account for chains of trade-offs where each step involves a tiny loss in quality for a large gain in quantity (or duration), without breaking the chain arbitrarily.
  *   **The Case:** In the standard quality-vs-quantity spectrum, if you deny transitivity to avoid the Repugnant Conclusion (the bottom of the spectrum), you must explain why the chain of "slightly worse but much larger" stops conferring betterness at a specific point. If the theory simply cuts the chain without a principled boundary, it looks like gerrymandering to avoid an uncomfortable result. The institution needs a rule that handles the whole chain, not just the parts we like.

  **4. Inter/Intra Parity**
  *   **The Requirement:** The logic used to compare outcomes across different populations must be structurally consistent with the logic used to compare stages within a single life.
  *   **The Case:** If a theory says "transitivity holds for one person's life choices (intrapersonal) but fails for population choices (interpersonal)," it invites the charge of cheating. Unless there is a metaphysical reason why value aggregates differently across persons than across time, this looks like a patch designed solely to save a specific moral intuition. For public reasons, the institution needs a unified logic of value, not one that shifts depending on whether the stakeholders are the same people or different people.

  **5. Disjoint Dominance (Pareto for Groups)**
  *   **The Requirement:** If outcome $A$ makes one group better off and leaves a disjoint second group no worse off compared to outcome $B$, then $A$ must be better than $B$.
  *   **The Case:** This covers cases where gains and losses sit in disjoint populations so no single person is compensated. If the institution chooses $B$ over $A$ when $A$ is strictly better for Group 1 and neutral for Group 2, Group 1 can legitimately claim they were harmed for no reason. Public justification requires that gratuitous losses are not imposed.

  **6. Determinacy (Vagueness vs. Intransitivity)**
  *   **The Requirement:** The theory must distinguish between "borderline cases" (vagueness) and "incomparability" or "intransitivity." For the purpose of the verdict, borderline cases must be resolved, not treated as gaps.
  *   **The Case:** A sorites series (e.g., removing one hair at a time) creates vagueness. A spectrum argument creates potential intransitivity. If the theory treats the spectrum as merely vague, it implies there is a fact of the matter we can't see. If it treats it as intransitive, it implies there is no fact of the matter. For the institution, the distinction matters because vagueness allows for a tie-breaking rule, whereas intransitivity forbids a consistent ranking. The institution needs to know if it is uncovering a truth or imposing a boundary.

  **7. Description Invariance (Nested Spectra)**
  *   **The Requirement:** The verdict must be stable under "zooming." If a step in a spectrum is itself composed of a finer-grained spectrum, the comparison verdict at the coarse level must match the verdict derived from the fine level.
  *   **The Case:** Suppose you compare Outcome $A$ to Outcome $B$. $B$ is reached from $A$ by one "step" of reduced quality/increased number. But suppose that "step" is actually a process of 1,000 micro-steps. If the theory says $A > B$ at the coarse level, but analyzing the 1,000 micro-steps reveals a chain where the last micro-step is worse than the first (or creates a cycle), the theory is scale-dependent.
      *   *Argument for Requirement:* If the verdict flips based on how finely the options are described, the institution can manipulate the outcome by choosing the grain of analysis. This violates the "public reasons" constraint. Losers could argue the decision was rigged by describing the options too coarsely to hide a value collapse. To be robust, the moral arithmetic must sum up correctly regardless of the unit size.
      *   *Argument against:* Some argue value is context-sensitive; a "slight" loss at a macro level might be "significant" at a micro level due to thresholds.
      *   *Ruling for this Job:* Description Invariance is **required**. An institution cannot justify a choice if the justification disappears when the options are analyzed more closely.

  ---

  ### Classification of Requirements

  **Non-Negotiable (Institutional Constraints)**
  These are required for the institution to function as specified (one-shot, public reasons, mandatory verdict).
  1.  **Verdict Closure:** You must pick.
  2.  **Choice Stability:** You cannot pick an option the theory admits is inferior.
  3.  **Description Invariance:** You cannot manipulate the verdict by changing the description grain.
  4.  **Determinacy:** You cannot plead vagueness to avoid a choice.

  **Taste / Substantive Moral Commitments**
  These are desirable for a "good" moral theory, but an institution could technically function while violating them (though it may be unpopular).
  1.  **Spectrum Continuity:** Avoiding the Repugnant Conclusion is a moral preference, not a functional necessity. The institution *could* accept the Repugnant Conclusion and still function.
  2.  **Inter/Intra Parity:** A theory could functionally work while treating persons differently than time-stages, though it risks charges of inconsistency.
  3.  **Disjoint Dominance:** While strong, a theory could violate this (e.g., prioritarian views that weight the worst off heavily) and still produce a verdict.

  ---

  ### Incompatibility Theorem (The "Impossible Joint Satisfaction")

  You asked to flag pairs or triples that cannot be jointly satisfied. This is the most critical part of the spec.

  **It is formally impossible to satisfy all of the following simultaneously:**
  1.  **Choice Stability (Transitivity)**
  2.  **Disjoint Dominance (Pareto Principle)**
  3.  **Spectrum Continuity (Sensitivity to small changes)**
  4.  **Non-Repugnance (Avoiding the conclusion that a massive population of barely worthwhile lives is better than a small population of excellent lives)**

  This is a variation of Arrhenius's Impossibility Theorems.
  *   If you keep **Transitivity** and **Dominance** and **Sensitivity**, you *must* accept the **Repugnant Conclusion**.
  *   If you keep **Transitivity** and **Dominance** and **Non-Repugnance**, you *must* reject **Sensitivity** (you must posit a lexical threshold where small losses don't count, which violates Spectrum Continuity).
  *   If you keep **Non-Repugnance** and **Sensitivity** and **Dominance**, you *must* reject **Transitivity** (the "Essentially Comparative" view), which violates **Choice Stability**.

  **For your institution:** Since **Choice Stability** and **Verdict Closure** are Non-Negotiable, you are forced to sacrifice either **Non-Repugnance** (accept the Repugnant Conclusion) or **Spectrum Continuity** (accept a lexical threshold). You cannot have a smooth, transitive, non-repugnant theory. It does not exist.

  ---

  ### The Workhorse Requirement

  **Choice Stability (Transitivity/Acyclicity)** does the most work excluding candidates.

  *   **Why:** It immediately eliminates the entire family of "Essentially Comparative" or "Intransitive" views (e.g., views that say $A$ is better than $B$ relative to the set $\{A,B\}$, but $B$ is better than $C$, and $C$ better than $A$).
  *   **Impact:** These views are popular among philosophers trying to solve the Spectrum Argument without accepting the Repugnant Conclusion. However, they are functionally dead for your institution. If the theory allows cycles, the institution cannot give a public reason for choosing $A$ over $C$ without admitting $C$ might be better. This requirement filters out the most sophisticated attempts to dodge the impossibility theorem, leaving only the blunt instruments (Total Utilitarianism or Lexical Views).

  ---

  ### Comparison of Candidate Theories

  | Feature | **Plain Transitive Total Order** (e.g., Total Utilitarianism) | **Lexical / Threshold View** (e.g., Lexical Prioritarianism) | **Essentially Comparative / Intransitive** (e.g., Contextual Betterness) |
  | :--- | :--- | :--- | :--- |
  | **Verdict Closure** | **Pass.** Always yields a number/ranking. | **Pass.** Thresholds create clear breaks. | **Pass.** Usually yields a local verdict. |
  | **Choice Stability** | **Pass.** Fully transitive. | **Pass.** Transitive within tiers. | **Fail.** Allows cycles by design. |
  | **Spectrum Continuity** | **Pass.** Smooth trade-offs allowed. | **Fail.** Posits discontinuous jumps. | **Pass.** Handles small steps well. |
  | **Inter/Intra Parity** | **Pass.** Same math for all. | **Mixed.** Often requires different rules for persons. | **Fail.** Often relies on interpersonal comparison quirks. |
  | **Disjoint Dominance** | **Pass.** Sums total welfare. | **Risk.** Can violate Pareto if threshold blocks it. | **Fail.** Context dependence can override dominance. |
  | **Description Invariance** | **Pass.** Sum is scale-invariant. | **Risk.** Thresholds may shift with grain. | **Fail.** Highly sensitive to description. |
  | **Non-Repugnance** | **Fail.** Accepts Repugnant Conclusion. | **Pass.** Blocks the bottom of the spectrum. | **Pass.** Blocks via intransitivity. |
  | **Institutional Fit** | **High.** Mechanically robust, morally costly. | **Medium.** Robust, but thresholds look arbitrary. | **None.** Functionally incompatible with mandate. |

  ---

  ### Confidence and Uncertainty

  **Confidence in the List:** High (85%).
  The derivation follows directly from the constraints of mandatory choice and public justification. The incompatibility of the substantive moral desires with the procedural constraints is a established result in formal axiology.

  **Least Sure Requirement:** **Description Invariance (Nested Spectra).**
  I am least certain that this belongs as a *moral* desideratum rather than just a *procedural* one. There is a philosophical argument that value is genuinely context-sensitive—that a "small" loss is not the same moral object when viewed as part of a large chain versus a single step. If that is true, demanding scale-invariance forces the theory to be false to the nature of value. However, for *your* specific job (public institutional justification), I have included it as non-negotiable because scale-dependence looks like manipulation to the losers. If you care more about moral truth than public acceptability, this requirement might be the first to go.
