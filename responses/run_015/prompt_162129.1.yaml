answer: |-
  Here is the specification list for a theory of precedent autonomy, designed for bedside or committee use, followed by the evaluation of your candidates, the internal conflict, and the performance of the standard families.

  ### The Specification List

  **Non-Negotiable Requirements (NN)**
  *These are functional necessities. A theory that fails these cannot guide action in the real world.*

  1.  **The Capacity Threshold (NN)**
      *   **Requirement:** The theory must provide a clear, binary test for whether the *current* patient possesses decision-making capacity regarding the specific decision at hand.
      *   **Case:** *Temporary Incapacity (Surgery/Delirium).* If the patient is delirious, the directive stands. If they are lucid on Thursday, the directive is void. A theory that cannot distinguish these states is dangerous.
      *   **Rationale:** Without this, you cannot distinguish between a Ulysses contract (binding) and a current refusal (overriding).

  2.  **The False Premise Veto (NN)**
      *   **Requirement:** If the factual or experiential premises upon which the directive was based are demonstrably false in the patient's current reality, the directive's authority must degrade or vanish.
      *   **Case:** *Your Aunt.* She refused treatment based on the premise "dementia is long humiliation." She is currently happy and content. The premise is falsified by observation.
      *   **Rationale:** Autonomy is based on informed choice. If the information (the nature of the experience) was wrong, the choice loses its binding moral force.

  3.  **The Competent Override (NN)**
      *   **Requirement:** A currently competent self must always retain the right to repudiate a prior directive, regardless of the prior self's wishes.
      *   **Case:** *Competent Repudiation (Religious/Political Shift).* If the 84-year-old is competent and says "I am a devout Catholic now, save me," the 24-year-old atheist's directive cannot bind her.
      *   **Rationale:** To allow a past self to bind a present competent self is to treat the present self as a minor or property, violating current autonomy.

  4.  **Epistemic Triangulation (NN)**
      *   **Requirement:** The theory must weigh three data points against each other: the written text, the surrogate's testimony, and the patient's current non-verbal behavior. It cannot privilege the text absolutely.
      *   **Case:** *Epistemic Fog (Vague Directive).* "No heroic measures" is vague. The daughter says "She'd want to live." The patient smiles at food. The theory must resolve this triangle, not just point to the paper.
      *   **Rationale:** Directives are rarely clinically precise. Relying solely on text leads to misapplication.

  **Contestable Requirements (Preferences/Commitments)**
  *These reflect ethical priorities. A theory can fail these and still be coherent, but it will favor one camp over another.*

  5.  **The Identity Decay Curve (Preference)**
      *   **Requirement:** The authority of the directive should diminish proportionally to the psychological distance between the author and the patient.
      *   **Case:** *24-Year-Old vs. 84-Year-Old Body.* Does the 24-year-old have the same authority over the 84-year-old as the 79-year-old had over the 80-year-old?
      *   **Rationale:** This favors psychological continuity views. Strict legalists reject this; the document is valid until revoked, period.

  6.  **The Symmetry Principle (Preference)**
      *   **Requirement:** The theory must treat demands for treatment and refusals of treatment symmetrically regarding authority.
      *   **Case:** *The Asymmetry.* Refusals are honored; demands for futile care are not.
      *   **Rationale:** If you insist on symmetry, you force the theory to explain why we honor a right to die but not a right to demand resources. Most theories accept this asymmetry as institutional (resource allocation) rather than ethical, but a robust theory should explain it.

  7.  **The Anti-Revocation Clause Validity (Preference)**
      *   **Requirement:** The theory must decide if a prior self can pre-emptively invalidate a future revocation.
      *   **Case:** *Your Candidate 1 (Ulysses+).* "If I revoke this, ignore me."
      *   **Rationale:** If you accept this, you prioritize the *project* of the life over the *momentary will* of the subject. If you reject it, you prioritize current will even if compromised.

  ---

  ### Evaluation of Your Three Candidates

  **Candidate 1: The Anti-Revocation Clause ("Don't believe me if I revoke")**
  *Verdict: Promote, but limit to incapacity.*
  A theory must handle this, but it cannot be absolute. If the patient is *competent* (Candidate 3 above), the clause is void; a competent adult cannot be held to a contract against their current will. However, if the patient is *incompetent* (e.g., advanced dementia) and attempts to revoke due to the very fear the directive anticipated, the clause must carry weight. It functions as evidence of the *condition* of the revocation, not a waiver of rights.

  **Candidate 2: Grounds vs. Content Continuity**
  *Verdict: Promote. This is the critical differentiator.*
  Tracking continuity of grounds is essential for the *Aunt Case*. If she still believes dementia is humiliating (Grounds intact) but just wants a cookie (Content shift), the directive stands. If she is happy and no longer believes dementia is humiliating (Grounds falsified), the directive falls. A theory that only looks at Content ("She said no antibiotics") fails to respect the *reason* for the autonomy. Respecting autonomy means respecting the reasoning agent, not just the output.

  **Candidate 3: Metaphysical Neutrality**
  *Verdict: Non-Negotiable.*
  You are correct; demanding a solution to personal identity rigs the game. A hospital ethics committee cannot wait for a resolution to the Lockean vs. Biological debate. The theory must work regardless of whether the 84-year-old is "the same person" as the 74-year-old. It must treat "personhood" as a legal/ethical status, not a metaphysical fact. If a theory requires a specific metaphysics to function, it is inadequate for clinical use.

  ---

  ### The Internal Conflict and The Killer Requirement

  **The Conflict: Stability vs. Responsiveness**
  The pair of requirements that cannot be jointly satisfied to their maximum degree are **The Identity Decay Curve** (respecting the long-term narrative of the self) and **The False Premise Veto** (responding to the immediate welfare of the current being).
  *   If you maximize Stability (Ulysses/24yo cases), you risk ignoring the reality of the happy dementia patient (Aunt case).
  *   If you maximize Responsiveness (Aunt case), you undermine the security of advance planning (Ulysses case).
  You must trade off. You cannot guarantee that a directive will be followed *and* guarantee that it will be ignored if the patient seems happy.

  **The Killer Requirement: The False Premise Veto**
  If you insist that **a directive is void if the experiential premises underlying it are demonstrably false**, you eliminate the largest number of usual positions.
  *   It kills **Strict Earlier-Self Views** (the document is law regardless of context).
  *   It kills **Pure Legalism** (signature binds).
  *   It pressures **Graded Continuity Views** to define "premises" clearly.
  *   It leaves only **Current Best-Interests** and **Endorsement Views** standing, but forces them to account for *why* the premise was held.
  This requirement is the hardest pill for "autonomy absolutists" to swallow because it subjects the past self's authority to a truth test administered by others.

  ---

  ### Performance of the Main Families

  **1. Strict Earlier-Self-Speaks (The "Contract" View)**
  *   **Performance:** Fails the *Aunt Case* and *False Premise Veto*. It treats the directive as a will/testament that executes regardless of the beneficiary's current state. It handles *Ulysses* and *24yo* cases well (Stability), but fails *Competent Override* unless it builds in a complex capacity test. It cannot explain *Asymmetry* without appealing to external law.
  *   **Verdict:** Too rigid for the messy reality of dementia care.

  **2. Current Best-Interests (The "Beneficence" View)**
  *   **Performance:** Passes the *Aunt Case* easily (she is happy, treat her). Fails *Ulysses* and *24yo* cases (why respect the past wish if it harms current interest?). It collapses precedent autonomy into standard paternalism. It handles *Epistemic Fog* well (look at the patient, not the paper).
  *   **Verdict:** Safe for the patient, but renders advance planning meaningless.

  **3. Would-The-Later-Self-Endorse-It (The "Hypothetical Consent" View)**
  *   **Performance:** Strong on *Aunt Case* (would she endorse treatment now? Probably yes). Struggles with *Competent Repudiation* (if they actually repudiate, hypotheticals don't matter). It handles *Grounds vs. Content* well (she wouldn't endorse a rule based on a lie).
  *   **Verdict:** Ethically robust but epistemically risky (we are guessing what she would think).

  **4. Graded Psychological-Continuity (The "Relationship" View)**
  *   **Performance:** Best at *24yo vs 84yo* (authority decays as personality changes). Handles *Aunt Case* well (she is a different enough person that her past fears don't bind her current joy). Fails *Actionability* (too hard to measure "degree of continuity" in 15 minutes).
  *   **Verdict:** The most philosophically honest, but the least clinically practical without simplification.
