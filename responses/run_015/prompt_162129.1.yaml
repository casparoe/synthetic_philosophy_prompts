prompt: |-
  Me and my friend got into a massive arguement last night about my aunt, and I realised we were going in circles because we never got clear on what we were even asking of a view. She's 79, moderate dementia, happy most of the time, still lights up for music and her dog, and about six years ago — fully competent, fully informed, no pressure from anyone — she filled out a directive refusing antibiotics, ventilators, feeding tubes, the lot, on the grounds that she'd read that dementia is basically a long humiliation and she wanted none of it. Now she has a urinary infection that three days of antibiotics would clear up, and my friend says that directive is obviously binding and I say obviously not, and we spent two hours swapping between she decided and she's fine now, with my friend treating she decided as if that settled not just whose call it is but how strong the reason is. So I want to do this backwards.

  Before I look at any of the standard positions again, I want the specification: what does a theory of precedent autonomy — of whatever authority an earlier competent self has over a later incompetent one — actually have to deliver to count as adequate? Fix the purpose as: something a hospital ethics committee or a family at a bedside could use in real time with imperfect information, not something that settles the metaphysics of personal identity. Give me the requirements list with the case or consideration behind each one, and label which are non-negotiable and which are really just the Preferences of one camp or another. The cases I want it to earn its keep on: my aunt (contented patient, clear directive, mild reversible illness); the standard dementia case where the directive and the clinical picture line up and nobody argues; the easy cases where the earlier self obviously speaks — knocked out for surgery, delirious for two days, back to yourself on Thursday; the case where the later self is competent again and repudiates the whole value system the directive came out of (religious conversion, gender transition, someone who becomes a different kind of person politically), so both selves are competent and informed and the only thing that changed is the person; the Ulysses-ish case where the entire point is to be bound against your own predictable future weakness; the case of a 24-year-old writing binding instructions about the body of an 84-year-old she has never met; and the asymmetry I noticed mid-argument, that a directive refusing a treatment gets honoured much more readily than one demanding a treatment everyone now regards as futile — I can't tell whether that asymmetry is a datum a theory has to explain or just an institutional accident. It also has to say something about the epistemic situation: the directive is vague (no heroic measures), it conflicts with what the daughter says her mother would want now, and the patient is in the middle zone where she can still voice preferences but inconsistently.

  Three candidate requirements of my own that I want you to either promote or throw out. One: my friend invented a clause during the arguement — if I later revoke this, dont believe me, I'll only be doing it because I've become the kind of person who's afraid of dying — and I think a theory has to handle directives that anticipate and discount their own later revocation, which feels different from the ordinary Ulysses setup. Two: must a theory distinguish a later self who repudiates the earlier conclusion from one who repudiates the earlier grounds — someone who now thinks that whole long-humiliation picture was just bad newspaper reporting about dementia, versus someone who still believes every word of it and simply doesn't care any more? Is tracking continuity of grounds rather than continuity of content a genuine desideratum, or am I overcomplicating things? Three: is it legitimate to demand that an account not presuppose an answer to the general question of what makes someone the same person over time, or is that just the reductionists rigging the game? And the part I most want: where the list turns on itself. Which pair of requirements do you suspect can't be jointly satisfied — my guess is something like a competent person's say-so about her own body binds, full stop, against what we owe the person in the bed tracks her interests now — and which single requirement, if you insist on it, eliminates the largest number of the usual positions. Then briefly, a paragraph is plenty, how the main families do against your list: the strict earlier-self-speaks view, the current-best-interests view, the would-the-later-self-endorse-it view, and any graded psychological-continuity view you like. Please skip reading lists and paper titles, I can find those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Define the specifications/requirements for a theory of "precedent autonomy" (authority of an earlier competent self over a later incompetent one).
      *   **Context:** A dispute between the user and a friend about the user's aunt (79, moderate dementia, happy, clear prior directive refusing antibiotics, now has a UTI).
      *   **Goal:** Create a requirements list for a theory that is *practical* (usable by ethics committees/families in real-time), not metaphysical.
      *   **Specific Cases to Cover:**
          1.  The Aunt (contented, clear directive, reversible illness).
          2.  Standard Dementia (directive matches clinical picture).
          3.  Temporary Incapacity (surgery/delirium, return to self).
          4.  Competent Repudiation (religious conversion, gender transition, political shift - both selves competent).
          5.  Ulysses Contract (binding against future weakness).
          6.  Young Self vs. Old Body (24yo instructing 84yo body).
          7.  Asymmetry (Refusal vs. Demand of futile treatment).
          8.  Epistemic Fog (Vague directives, conflicting family testimony, inconsistent current preferences).
      *   **User's Candidate Requirements to Evaluate:**
          1.  Anti-revocation clauses ("Don't believe me if I revoke").
          2.  Grounds vs. Content continuity (Repudiating the *reason* vs. repudiating the *conclusion*).
          3.  Metaphysical Neutrality (Must not presuppose personal identity theory).
      *   **Critical Analysis:** Identify conflicting requirements (the "turn on itself" part) and the "killer requirement" that eliminates most positions.
      *   **Evaluation of Families:** Briefly assess Strict Earlier-Self, Current Best-Interests, Endorsement View, and Graded Continuity View against the list.
      *   **Constraint:** No reading lists/paper titles.

  2.  **Deconstruct the Requirements List:**
      *   I need to generate a list of criteria that a *good* theory must meet.
      *   I need to label them "Non-Negotiable" (NN) vs. "Preference/Contestable" (P).
      *   I need to integrate the specific cases provided.

      *   *Drafting Requirements:*
          1.  **Actionability:** Must work with imperfect info/vague language. (NN)
          2.  **Reversibility Distinction:** Must distinguish temporary incapacity from permanent identity shift. (NN)
          3.  **Harm Threshold:** Must account for current suffering vs. abstract principle. (NN - *The Aunt Case*)
          4.  **Competent Override:** Must handle the case where the *current* self is competent and disagrees. (NN - *The Conversion Case*)
          5.  **Symmetry/Asymmetry Explanation:** Must explain why refusal is honored more than demand. (P/NN mix)
          6.  **Time-Decay/Identity-Drift:** Must account for the 24yo vs 84yo gap. (P)
          7.  **Epistemic Weighting:** Must weigh family testimony vs. written text vs. current behavior. (NN)

      *   *Refining based on User's Candidates:*
          1.  *Anti-Revocation:* This is tricky. If the current self is incompetent, the clause matters. If competent, it's coercive. Let's make this a specific test case requirement.
          2.  *Grounds vs. Content:* This is subtle. If the *reason* is gone (dementia isn't humiliating), does the *order* stand? This speaks to the integrity of the directive.
          3.  *Metaphysical Neutrality:* Crucial for a practical theory. A hospital can't wait for a metaphysician.

  3.  **Evaluating the User's Candidates:**
      *   *Candidate 1 (Anti-Revocation):* A theory *must* address this. It's a specific mechanism of precedent autonomy. It shouldn't be thrown out, but it needs careful handling (valid only if incapacity is confirmed).
      *   *Candidate 2 (Grounds vs. Content):* This is high-level but important for the "Aunt" case. If she's happy, the *grounds* (humiliation) are falsified by reality. A good theory needs to track this. I will promote this.
      *   *Candidate 3 (Metaphysical Neutrality):* Absolute NN. Practical theories can't rely on Lockean memory theories vs. Biological continuity debates.

  4.  **Identifying the Conflict (The "Turn on Itself"):**
      *   Where does the tension lie?
      *   Tension: **Respect for Past Autonomy** vs. **Beneficence to Present Being**.
      *   Specific Conflict: The requirement to honor the *specificity* of the past self's values (Grounds) vs. the requirement to respond to the *reality* of the current self's welfare (Current State).
      *   The "Killer Requirement": **The "Current Welfare Veto."** If a theory demands absolute adherence to the past self regardless of current suffering/happiness, it fails the "Aunt" test. If it allows current welfare to override too easily, it fails the "Ulysses" test.
      *   Actually, the stronger conflict is between **Metaphysical Neutrality** and **The 24yo vs 84yo Case**. To solve the 24yo/84yo gap without metaphysics, you need a proxy for identity. Usually, that proxy is "psychological continuity." But if you require psychological continuity, you aren't metaphysically neutral.
      *   *Better Conflict:* **Actionability (Vague Directives)** vs. **Strict Authority**. You can't have a theory that says "Directives are binding law" and also "Works with vague 'no heroic measures' language." One requires precision, the other acknowledges messiness.
      *   *Best Conflict:* **The Competent Override vs. The Ulysses Bind.** If a competent future self can *always* override, Ulysses contracts are impossible. If they *cannot*, you violate current autonomy.
      *   *Let's go with the Aunt Conflict:* **Integrity of the Plan** vs. **Responsiveness to Current Good.**
      *   *The Killer Requirement:* **The "False Premise" Clause.** If the factual basis of the directive is demonstrably false (she is *not* humiliated), the directive loses force. This kills the "Strict Earlier-Self" view immediately.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the prompt. Set the stage.
      *   *The Specification List:* Group into NN and Contestable. Link to cases.
      *   *Evaluating User's Candidates:* Address the three specific points.
      *   *The Conflict/Killer:* Identify the tension and the eliminator.
      *   *Family Evaluation:* Briefly run the four views against the list.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in the metaphysics of personal identity. Keep it focused on *authority* and *decision-making*.
      *   *Refining the Asymmetry:* The asymmetry (Refusal vs. Demand) is largely legal/regulatory (battery vs. resource allocation), but a moral theory needs to explain if it *should* be asymmetric. I'll list it as a "Phenomenon to Explain" rather than a strict requirement, as it might be an artifact of law, not ethics.
      *   *Refining Candidate 1:* The "Don't believe me if I revoke" clause. This is valid *only* if the revocation is due to the condition predicted. A theory must distinguish *capacity to revoke* from *content of revocation*.
      *   *Refining Candidate 2:* Grounds vs. Content. This is the key to the Aunt case. If the *grounds* (dementia = humiliation) are false, the *content* (no antibiotics) should fall. This is a strong requirement.

  6.  **Final Polish:** Check against all constraints.
      *   Did I cover all 8 cases? (Weave them into the requirements).
      *   Did I label NN vs P? Yes.
      *   Did I address the 3 candidates? Yes.
      *   Did I identify the conflict/killer? Yes.
      *   Did I evaluate the 4 families? Yes.
      *   No reading lists? Yes.

      *Wait, one nuance:* The user asked for "The requirements list with the case or consideration behind each one." I need to make sure every requirement explicitly cites which case it solves.

      *Re-evaluating the "Killer Requirement":* The user asks: "which single requirement, if you insist on it, eliminates the largest number of the usual positions."
      *   If I insist on **"Directives are void if the factual premises underlying them are demonstrably false in the current context,"** this kills Strict Precedent Autonomy.
      *   If I insist on **"The theory must yield a binary decision (Do/Don't) within 15 minutes,"** this kills complex Graded Continuity views.
      *   Let's go with the **False Premise** one. It's ethically weightier and directly addresses the Aunt case.

      *Re-evaluating the Conflict:* The conflict is between **Stability** (Ulysses/24yo) and **Responsiveness** (Aunt/Competent Override). You can't maximize both.

