answer: |-
  Your moral intuitions are governed by a principle of **reasonable sacrifice modulated by special relationships**, where the line between obligation and heroism is inherently vague, and blame for never doing "extra" targets character rather than specific acts.

  The inconsistency between donating a kidney to a stranger versus your child is resolved by **special obligations**. Ethics recognizes that we owe more to those with whom we have specific relational ties (children, spouses) than to strangers. The act is physically identical, but the moral context differs because parenthood entails a duty of care that overrides the general liberty to preserve one's own bodily integrity. You don't need to drop this call; it's a standard feature of most non-utilitarian ethical frameworks.

  The confusion around the money ($100 vs. $500 vs. $1,000) and the drowning kid (wet shoes vs. career) stems from **vagueness**. You are treating obligation as a binary switch when it is actually a spectrum. As the cost to you rises, the obligation fades gradually into supererogation. There is no "fact of the matter" for the $500 case because moral concepts often lack sharp boundaries (the Sorites paradox). To reconcile this, you must drop the intuition that there is a precise threshold where duty ends and heroism begins; instead, there is a zone of discretion where either choice is permissible.

  The puzzle of the "chronic non-giver" is solved by distinguishing **act-evaluation from agent-evaluation**. An individual act of donating extra money may be optional (supererogatory), meaning you aren't blamed for skipping it once. However, moral character is evaluated over time. A person who *never* chooses the optional good reveals a lack of virtue (selfishness or indifference), which is blameworthy even if no specific rule was broken. You aren't blaming them for missing a duty; you're blaming them for having a bad character.

  Regarding professional roles like a lifeguard, **contractual义务 (obligation)** shifts the baseline. By accepting the role and payment, the lifeguard voluntarily lowers their cost threshold. What is heroism for a bystander (jumping in during a storm) is duty for a lifeguard, because they have explicitly agreed to bear risks that others are not required to bear.

  To maintain consistency, you must drop two specific intuitions: first, that there is a precise, discoverable fact about where the $500 donation lands on the line; and second, that an act being "optional" means it is morally invisible. Optional acts are still moral data points that accumulate to define whether you are a good person, even if skipping them individually doesn't make you a bad one.
