answer: |-
  The implicit theory is a form of subjective utilitarianism that treats well-being as a cognitive judgement aggregatable across a territorially bounded population of adults, prioritizing national status over absolute improvement or priority to the worst-off.

  This framework presupposes that well-being is best captured by a reflective evaluation of life conditions rather than moment-to-month experience, assuming that what matters is how citizens assess their lives against personal standards rather than how those lives feel phenomenologically. This choice privileges the "remembering self" over the "experiencing self," treating well-being as a state of satisfaction with life trajectory rather than a sum of hedonic moments. **Contested claim:** That Cantril ladder scores are cardinally comparable across persons and cultures sufficient for cost-benefit analysis. **Confidence:** Low. **Settlement:** Requires psychometric evidence that a one-point change means the same thing for a farmer in a low-income country as for an urbanite in a high-income one, which current methodology lacks.

  The cost-per-unit allocation mechanism presupposes classical utilitarianism, where the moral value of an outcome is the sum of individual gains regardless of who receives them. This explains why a small gain for many outweighs a large gain for a few; it treats well-being units as fungible currency with no diminishing marginal moral value. This conflicts directly with your health service's use of severity weighting, which presupposes prioritarianism (giving weight to the worst off). The state is not operating on one theory but fragmented ones: the Treasury acts as a utilitarian, while Health acts as a prioritarian. **Contested claim:** That interpersonal comparisons of well-being changes are meaningful enough to justify trading off deep misery against mild satisfaction. **Confidence:** Medium (philosophically coherent, empirically shaky). **Settlement:** Requires a consensus on whether well-being is a single metric quantity or multidimensional.

  Targeting a *rank* rather than a level presupposes that well-being is partially positional or that political legitimacy derives from relative performance against peers. If well-being were purely absolute, a rank target would be irrational; you could miss the target while everyone gets happier. This implies the government views national well-being as a competitive good, where standing relative to other nations matters intrinsically, or pragmatically assumes that global trends are uncontrollable so only relative movement is manageable.

  Counting resident adults presupposes a theory of political community based on territorial presence and legal capacity. Excluding children directly treats them as externalities whose well-being matters only instrumentally via adults. Excluding emigrants and non-residents assumes obligations of justice stop at the border and do not follow citizens abroad or extend to those affected by domestic policy (like trade or emissions). This is a "closed system" model of the polity that ignores transboundary harms and intergenerational equity.

  Regarding underdetermination, a hedonic theorist, a desire-satisfaction theorist, and an objective-list theorist could all accept this apparatus if they view the ladder score as a reliable *proxy* for their preferred truth. They would diverge only on interpretation: the hedonist sees it as reported happiness, the desire theorist as reported goal progress, and the objective-list theorist as reported access to goods. The practice separates them only if you ask *why* the ladder matters; the apparatus itself is compatible with all three because it remains agnostic about what makes the score high, only that higher is better. However, the exclusion of experience measures (laughter/worry) actively disfavors strict hedonism, and the exclusion of children disfavors theories granting intrinsic value to potential autonomy.

  Your deepest puzzle is the first one: the trade-off between many small gains and few large rescues. This is not arithmetic but a fundamental ethical choice between utilitarianism and prioritarianism, and the inconsistency with the health service reveals a lack of principled coherence in how the state values suffering. The second puzzle (evaluation vs. experience) is largely a measurement problem in disguise; while philosophically distinct, survey designers often choose life evaluation because it is more stable over time and correlates better with income and policy variables than affect, making it a pragmatic choice for budgeting even if it misses the phenomenology of misery. The third puzzle (population boundaries) is a political theory problem identical to the boundary problem in democratic theory, but it is less immediately damaging to the internal logic of the budget than the aggregation rule.

  The framing is not confused, but the policy landscape is incoherent. You are witnessing two different ethical frameworks (utilitarian vs. prioritarian) operating in silos within the same government. The trade-off your colleagues treat as obvious arithmetic is only obvious if you accept the utilitarian premise that well-being units are fungible and distributionally neutral; if you reject that premise, the arithmetic is morally blind.
