answer: |-
  Your roommate has stumbled onto a very famous objection to the Knowledge Argument, often called the **"Generality Problem"** or the **"Many Properties Problem."** If Mary's case proves dualism, then every time you taste a new fruit or hear a new sound, you are proving that physics is incomplete. As you noted, that makes physicalism look absurdly fragile.

  To save physicalism while keeping the intuition that Mary "learns something," you should reject **Step (3)**.

  > **(3) What she learns is a new fact, since afterward she can answer new questions and make new inferences about experiences.**

  Here is how you reject that step, the strategy used to do it, and what it costs you.

  ### The Solution: The Phenomenal Concept Strategy

  The most robust physicalist response is the **Phenomenal Concept Strategy (PCS)**. This view draws a sharp distinction between **facts** (what exists in the world) and **concepts** (how we think about what exists).

  **The Argument:**
  1.  **Ontology vs. Epistemology:** Physicalism is a claim about *ontology* (what stuff exists). It says everything is physical. It is *not* necessarily a claim that there is only one way to *know* about that stuff.
  2.  **Two Concepts, One Fact:** Inside the room, Mary has a **physical concept** of red (e.g., "wavelength 620nm," "V4 neural activation"). When she steps out, she acquires a **phenomenal concept** of red (e.g., "what it is like to see red").
  3.  **The Identity:** Both concepts refer to the exact same physical state in her brain.
  4.  **The Learning:** When she sees red, she does not learn a new *fact about the world*. She learns a new *way of conceptualizing* a fact she already knew.

  **Why this saves Step (2) but kills Step (3):**
  You can tell your roommate: "Mary definitely learns something (Step 2). She gains a new conceptual perspective. But that doesn't mean she learns a new *fact* (Step 3)."

  Think of it like this: You know that "Mark Twain wrote Huckleberry Finn." One day, you learn that "Samuel Clemens wrote Huckleberry Finn." You have learned something new (you can now answer trivia questions you couldn't before), but you haven't learned a new fact about the universe. You've just learned that two names refer to the same person.

  In Mary's case, "Neural State X" and "Experience of Red" are two names for the same thing. She knew the first name; she learned the second.

  ### Stopping the Vegemite Explosion

  This strategy completely blocks your roommate's slide into absurdity (Steps 5–7).

  If the "new knowledge" is just acquiring new **concepts**, then yes, tasting Vegemite gives you a new concept. Hearing a ukulele gives you a new concept. But this doesn't mean physics is missing facts. It just means **human cognition is rich.**

  Physics describes the territory; concepts are the maps. You can have millions of different maps (phenomenal concepts) for the same territory (physical states). The existence of millions of maps doesn't mean the territory is non-physical. It just means we have millions of ways to access it.

  This allows you to say:
  *   **Physicalism is true:** There are no non-physical facts.
  *   **Mary learns something:** She acquires a phenomenal concept.
  *   **Vegemite isn't a problem:** Tasting Vegemite adds a concept to your library, not a ghostly fact to the universe.

  ### The Cost: What do you give up?

  Rejecting Step (3) via the Phenomenal Concept Strategy is the standard physicalist move, but it isn't free. Here is the bill:

  **1. You must accept that "Knowledge" is ambiguous.**
  You have to concede that when we say Mary "knows everything," we mean she knows all the *facts*, but not that she possesses all the *concepts*. You have to argue that physicalism only requires knowing all the facts, not possessing every possible mode of presentation. Some critics say this is moving the goalposts.

  **2. You have to explain why Phenomenal Concepts are special.**
  If physicalism is true, concepts should be physical states (brain states). So, why is acquiring a phenomenal concept so different from acquiring a physical concept? Why does it *feel* like discovering a new reality?
  To make this work, you usually have to argue that phenomenal concepts are **direct** or **recognitional**. When you think "red experience," you are partially activating the very experience you are thinking about. When you think "wavelength 620nm," you aren't activating the wavelength.
  *The Cost:* You have to explain how a physical brain can have a concept that refers to itself in this unique, direct way without smuggling in dualism. Some critics argue this makes the concepts themselves mysterious, even if the facts aren't.

  **3. You lose the "Explanatory Gap" closure.**
  This strategy saves physicalism from being *false*, but it doesn't necessarily make consciousness feel *explained*. It admits that there will always be an epistemic gap (a gap in our understanding) even if there is no ontological gap (a gap in reality). You have to be okay with saying, "Yes, it will always *seem* like there's something missing to a human mind, even if nothing is actually missing."

  ### Alternative: The Ability Hypothesis
  There is a harder line you could take, proposed by David Lewis. This rejects Step (2) in a specific way. It says Mary doesn't learn *any* propositional knowledge (facts). She only gains **abilities** (to imagine, recognize, and remember red).
  *   **Pros:** Saves physicalism easily.
  *   **Cons:** You said you want to keep the idea that Mary "learns something." Most people feel knowing *what it is like* is more than just a skill (like riding a bike); it feels like knowing a truth. The Phenomenal Concept Strategy respects this intuition better than the Ability Hypothesis.

  ### Summary for your Roommate
  To reply to your roommate, you can say:

  > "I reject Step (3). Mary learns a new **concept**, not a new **fact**.
  >
  > Yes, tasting Vegemite gives you a new concept, and seeing red gives you a new concept. But concepts are just tools our brains use to access physical reality. Having a million new tools doesn't mean reality isn't physical; it just means our toolbox is big.
  >
  > Physicalism claims physics describes all the *stuff* in the universe. It doesn't claim physics limits how many *ways* we can think about that stuff. Mary's discovery is about her mind's cataloging system, not about the universe's inventory."

  This keeps Mary's epistemic progress real (she gets a new tool) without blowing up physics (the inventory remains the same).
