answer: |-
  Colleagues, permit me a brief illustration to warm up the seminar.

  Imagine we secure funding for a 'Phenomenology Decoder', a device that translates EEG patterns into text in real-time. We strap in a subject, and at 3:00 AM, the machine prints: *'I am being chased by a badger.'* The subject wakes at 7:00 AM and reports: *'I dreamed I was being chased by a badger.'*

  The neuroscientist beams. 'At last! We've correlated neural activity with occurrent experience. We've caught the dream in the act.'

  The Malcolmian shakes her head. 'You've correlated neural activity with a waking report. Without behavioural criteria at 3:00 AM, there is no experience to catch. You've merely found the cause of a story.'

  The Dennettian nods in agreement. 'Precisely. You've found the tape being recorded. But the experience only occurs upon playback at waking. The brain was drafting the narrative, not living it.'

  The neuroscientist pales. 'But the timestamps match perfectly. The neural state and the content are identical.'

  'Exactly,' say both philosophers in unison.

  'So,' asks the neuroscientist, 'did he experience the badger whilst asleep?'

  'No,' they reply together.

  'Then what,' he gestures at the £5 million machine, 'did we just measure?'

  'The cost,' says the Malcolmian, 'of confusing a cause with a criterion.'

  'And the bandwidth,' adds the Dennettian, 'of a show nobody watched until the credits rolled.'

  'The data,' they conclude, handing back the grant cheque, 'is perfectly compatible with an empty theatre and a delayed opening. You've built a very expensive stenographer for a meeting that may not have happened.'
