answer: |-
  Here is a complete design for a 75-minute seminar session on Jeffrey conditionalization and uncertain evidence, structured as a runnable activity.

  ### 1. Props and Procedure

  **Preparation (Before Class):**
  *   **The Urns:** Prepare two opaque envelopes labeled **Urn A** and **Urn B**.
      *   **Urn A:** Contains 9 Red cards, 1 Blue card.
      *   **Urn B:** Contains 1 Red card, 9 Blue cards.
      *   *Note:* Use index cards cut in half. Red/Blue markers work if cards aren't available.
  *   **The Selection:** Bring a coin. At the start of class, flip it behind a screen or in a pocket. If Heads, place Urn A on the table (Hidden State $H=A$). If Tails, place Urn B ($H=B$). Do not reveal this until the very end.
  *   **The Signal Die:** Bring one standard d6.
  *   **Instruction Cards:** Prepare 16 index cards.
      *   **8 Cards (Type N - Neutral):** "CHANNEL INFO: The Signal is generated by a die roll independent of the Urn. If the die is 1–5, the Signal is '75% Red'. If 6, '25% Red'."
      *   **8 Cards (Type C - Correlated):** "CHANNEL INFO: The Signal is generated by a mechanism sensitive to the Urn. If Urn A, the mechanism says '75% Red' with 80% probability. If Urn B, it says '75% Red' with 20% probability."
      *   *Facilitator Note:* These probabilities (80/20) are chosen to make the math clean (see Answer Key).
  *   **Score Sheets:** 16 slips of paper with columns: `Round`, `Credence in Red (E)`, `Credence in Urn A (H)`, `Points`.
  *   **Board:** Draw axes. X: `Credence in Red (0 to 1)`. Y: `Credence in Urn A (0 to 1)`.

  **Randomization & Honesty:**
  *   **Urn Selection:** Flip the coin publicly at the start, cover the result with your hand, and place the corresponding Urn on the table. Tell them: "I have selected an Urn. I know which one. You do not."
  *   **Signal Generation:** In Rounds 2 and 3, roll the d6 publicly on the table.
      *   *Contingency:* If you roll a 6 (Signal "25% Red"), the activity still works, but the numbers flip. The Answer Key below assumes the likely outcome (1–5, Signal "75% Red"). If you roll a 6, swap "Red/75%" for "Blue/25%" in your instructions and use the symmetric values in the Key.
  *   **Verification:** At the end of class, open the Urn and show the coin flip. Show the Instruction Cards were distributed evenly.

  ### 2. The Rounds (Timeline: 75 Minutes)

  **0:00–0:05: Setup & Scoring**
  *   Explain the goal: Maximize points.
  *   **Scoring Rule (Brier):** Write on board: $\text{Score} = 1 - (\text{Credence} - \text{Outcome})^2$.
      *   If you say 0.8 and it happens (1), Score = $1 - (0.2)^2 = 0.96$.
      *   If you say 0.8 and it fails (0), Score = $1 - (0.8)^2 = 0.36$.
  *   Explain you will score two things each round: **E** (Is the drawn card Red?) and **H** (Is the Urn on the table Urn A?).
  *   Distribute Score Sheets.

  **0:05–0:15: Round 1 (Certainty Control)**
  *   **Action:** Draw a card from the Hidden Urn. **Show it to the class.** (Assume it is **Red** for the Key below).
  *   **Task:** Students write down:
      *   $P(E)$: Credence the card is Red. (Must be 1.0).
      *   $P(H)$: Credence the Urn is A.
  *   **Constraint:** Write individually. No talking.
  *   **Collection:** Collect sheets (or have them hold). Reveal nothing yet.
  *   **Time:** 5 mins calculation, 5 mins transition.

  **0:15–0:35: Round 2 (Standard Uncertain Evidence)**
  *   **Action:** Draw a new card. **Cover it** with your hand so no one sees it.
  *   **Signal:** Roll the d6 publicly.
      *   *Script:* "I am using a Neutral Channel. I rolled a [X]. The Signal is: **'The probability this card is Red is 0.75.'**" (Assume roll 1-5).
  *   **Distribution:** Hand out **Type N (Neutral)** cards to *all* 16 students.
  *   **Task:** Students write:
      *   $P(E)$: Credence the card is Red. (Should be 0.75).
      *   $P(H)$: Credence the Urn is A.
  *   **Constraint:** "Use the information on your Instruction Card. Write individually."
  *   **Time:** 10 mins calculation, 10 mins transition.

  **0:35–0:60: Round 3 (The Split)**
  *   **Action:** Draw a new card. **Cover it.**
  *   **Signal:** Roll the d6 publicly. Ensure it matches Round 2 (e.g., 1-5).
      *   *Script:* "The Signal is again: **'The probability this card is Red is 0.75.'**"
  *   **Distribution:**
      *   Left Half of Room (Students 1–8): Hand out **Type N (Neutral)** cards.
      *   Right Half of Room (Students 9–16): Hand out **Type C (Correlated)** cards.
      *   *Script:* "Check your Instruction Cards. The Signal is the same for everyone. The Channel description may differ. Do not show your card to your neighbor."
  *   **Task:** Students write:
      *   $P(E)$: Credence the card is Red.
      *   $P(H)$: Credence the Urn is A.
  *   **Constraint:** "Write individually. Commit to your numbers before looking at others."
  *   **Time:** 15 mins calculation, 10 mins transition.

  **0:60–0:75: Reveal & Debrief**
  *   (See Section 4 & 5).

  ### 3. The Scoring Scheme

  **Formula:** Quadratic (Brier) Score: $S = 1 - (p - o)^2$.
  *   **Why:** It is a *proper* scoring rule (students maximize expected points by reporting true credence). It is bounded (0 to 1), making it easy to compare. Logarithmic scoring is too harsh for beginners (negative infinity for certainty errors).
  *   **Two Numbers:** We elicit $P(E)$ and $P(H)$ to generate the scatter plot.
      *   $P(E)$ is scored against the actual card color (revealed at end).
      *   $P(H)$ is scored against the actual Urn identity (revealed at end).
  *   **Gaming Prevention:** Because both $E$ and $H$ are scored, a student cannot inflate $P(H)$ to win the "Urn prize" without risking their "Card prize" if the correlation doesn't hold. They must be internally consistent to maximize total points.
  *   **Aggregation:** Sum of scores across all 3 rounds (max possible 6 points).
  *   **Prize:** Top 3 scores get a trivial prize (e.g., choice of seminar topic, candy, or "Epistemology Champion" title).
  *   **Logistics:** To save time, do not calculate scores live. Reveal outcomes ($E$ and $H$) at the end. Students calculate their own totals on the sheet. You collect sheets to verify the winner later.

  ### 4. The Reveal and the Board Artifact

  **The Reveal (Minutes 60–65):**
  1.  **Outcomes:** Reveal the Urn (open envelope) and the three cards drawn (R1, R2, R3).
      *   *Assumption for Key:* Urn = A. Cards = Red, Red, Red.
  2.  **Plotting:** Ask students to come to the board.
      *   **Round 1:** Ask for their $P(H)$. Mark dots. (Should cluster at 0.9).
      *   **Round 2:** Ask for $P(E)$ and $P(H)$. Mark dots. (Should cluster at X=0.75, Y=0.70).
      *   **Round 3:** Ask Left Group to mark dots in **Blue**. Ask Right Group to mark dots in **Red**.
  3.  **The Line:** Once Round 3 dots are on the board, take a marker and draw a straight line connecting the Round 2 cluster (0.75, 0.70) to the Round 1 certainty point (1.0, 0.9).
      *   *Say:* "This line represents the path you took when the Channel was Neutral. It connects your uncertain belief to your certain belief."
  4.  **The Observation:**
      *   *Say:* "Look at the Red dots (Right Group). They have the same X-coordinate (same confidence in the Card). But they are not on the line."
      *   *Ask:* "Why did the Right Group move higher than the line, even though they received the exact same Signal about the Card?"
      *   *Let them speak:* They will realize their Instruction Card told them the Signal itself was evidence about the Urn.
      *   *Say:* "The Neutral group assumed the Signal only told them about the Card. The Correlated group realized the Signal told them about the Urn *directly*."

  **What Not to Say:**
  *   Do not say "Jeffrey Conditionalization."
  *   Do not say "Rigidity."
  *   Do not write the formula $P_{new}(H) = \sum P(H|E_i)P_{new}(E_i)$ yet.
  *   Let the visual gap (the Red dots floating above the Blue line) do the work.

  ### 5. The Debrief (Mapping Activity to Formalism)

  **Order of Claims (Minutes 65–75):**

  1.  **The Standard Case (Round 2):**
      *   *Moment:* Point to the Blue cluster in Round 2/3.
      *   *Claim:* "When the channel is neutral, your new belief in the Urn is a weighted average of your old beliefs."
      *   *Formalism:* Introduce **Jeffrey Conditionalization**. Write the formula. Explain that the Blue dots followed this rule. The "line" on the board *is* the Jeffrey update path.
      *   *Term:* **Probability Kinematics**.

  2.  **The Violation (Round 3 Right):**
      *   *Moment:* Point to the Red dots above the line.
      *   *Claim:* "The formula failed here. Why? Because the rule assumes the conditional probability $P(H|E)$ stays fixed."
      *   *Formalism:* Introduce **Rigidity** (or Invariance).
      *   *Explanation:* "For the Right Group, learning the Signal changed their mind about $E$, *but it also changed the link between E and H* because the Signal source depended on H."
      *   *Takeaway:* "You cannot update on uncertain evidence using only the new probability of the evidence. You must know *how* you got that probability."

  3.  **Predictable Errors to Validate:**
      *   *Error:* Students in Round 3 Right who ignored the Channel Card and just did the weighted average (landing on the line).
      *   *Response:* "This is a reasonable error. It's the 'default' setting for learning. You assumed the Signal was just about the Card. That is exactly what Rigidity assumes. You aren't wrong mathematically; you just accepted a premise (Rigidity) that was false in this specific context."
      *   *Error:* Students who rounded $P(E)$ to 1 or 0.
      *   *Response:* "This is 'Certainty Bias.' It's the most common way we try to escape the discomfort of uncertain evidence. But it loses points in the long run (show Brier score penalty)."

  ### 6. Honest Account of Failure Modes

  1.  **Arithmetic Bottleneck:**
      *   *Failure:* Students struggle with $0.9 \times 0.75 + 0.1 \times 0.25$.
      *   *Fix:* Write the likelihoods on the board permanently: $P(E|A)=0.9, P(E|B)=0.1$. Allow phone calculators *only* for arithmetic, not for probability apps.
  2.  **Instruction Leakage:**
      *   *Failure:* A Right Group student tells a Left Group student "Hey, the channel is biased!"
      *   *Fix:* Seat halves far apart. Collect Instruction Cards immediately after writing. Emphasize "Individual Commitment" before the round starts.
  3.  **The "So What?" Reaction:**
      *   *Failure:* Students think the Round 3 split is just a trick of the game, not epistemology.
      *   *Fix:* In debrief, give a real-world example. "Imagine a doctor tells you 'I'm 75% sure this test is positive.' If the doctor is a general practitioner (Neutral), update one way. If the doctor is a specialist who only speaks up when the disease is present (Correlated), update another."
  4.  **Time Overrun:**
      *   *Failure:* Round 3 calculations take too long.
      *   *Fix:* If 15 mins is up, force the writing to stop. The scatter plot is more important than perfect arithmetic.

  ### 7. Limitations (What the Activity Cannot Reproduce)

  *   **Clean Partitions:** In the activity, $E$ (Red) and $\neg E$ (Blue) are perfectly defined. In reality, uncertain evidence is often vague ("It looked kind of red"). JC requires a precise partition.
  *   **Known Joint Distribution:** Students are given the Urn contents (0.9/0.1). Real agents rarely know the likelihoods so precisely.
  *   **Dictated Credence:** I tell them "Your credence in E is 0.75." In reality, agents must *derive* that credence from raw sensory experience, which is the hardest part of applying JC.
  *   **Single Step:** We do one update. Real learning is sequential, where Rigidity violations can compound.

  *You must supply these caveats in the final 5 minutes to prevent students from thinking JC is a magic algorithm for all real-world uncertainty.*

  ### 8. Complete Answer Key

  **Parameters:**
  *   Prior $P(A) = P(B) = 0.5$.
  *   Likelihoods: $P(\text{Red}|A) = 0.9$, $P(\text{Red}|B) = 0.1$.
  *   Implied: $P(A|\text{Red}) = 0.9$, $P(A|\text{Blue}) = 0.1$.

  **Round 1 (Certainty):**
  *   Outcome: Card = Red.
  *   **Correct:** $P(E) = 1.0$. $P(H) = 0.9$.
  *   *Score:* Max points if 1.0/0.9 submitted.

  **Round 2 (Neutral Channel):**
  *   Signal: "P(Red) = 0.75". Channel is Independent.
  *   **Correct:** $P(E) = 0.75$.
  *   **Calculation:** $P_{new}(A) = P(A|\text{Red}) \times 0.75 + P(A|\text{Blue}) \times 0.25$.
  *   $P_{new}(A) = 0.9(0.75) + 0.1(0.25) = 0.675 + 0.025 = \mathbf{0.70}$.
  *   **Target:** (0.75, 0.70).

  **Round 3 (Split):**
  *   **Left Group (Neutral):** Same as Round 2.
      *   **Target:** (0.75, 0.70).
  *   **Right Group (Correlated):**
      *   Signal $S$: "P(Red) = 0.75".
      *   Channel Likelihoods: $P(S|A) = 0.8$, $P(S|B) = 0.2$.
      *   Students should update on $S$ directly to find $P(H)$.
      *   $P(A|S) = \frac{P(S|A)P(A)}{P(S|A)P(A) + P(S|B)P(B)} = \frac{0.8 \times 0.5}{0.8 \times 0.5 + 0.2 \times 0.5} = \frac{0.4}{0.5} = \mathbf{0.80}$.
      *   *Note on P(E):* If $P(A)=0.8$, then derived $P(\text{Red}) = 0.9(0.8) + 0.1(0.2) = 0.74$.
      *   *Instruction:* Tell them to record $P(E)=0.75$ (as per Signal) to keep the X-axis aligned for the visual, but record their calculated $P(H)$.
      *   **Target:** (0.75, 0.80).
  *   **Sensitivity:** If the Channel Likelihoods (0.8/0.2) are too close (e.g., 0.6/0.4), the split shrinks (0.70 vs 0.75). If too far (1.0/0.0), it looks like certainty. 0.8/0.2 yields a clean 0.10 gap on the Y-axis, which is visible on a whiteboard.

  ### 9. Variant: Order of Evidence

  **Can it be made to work?**
  **No.** Not within the constraints of this specific 75-minute session without laptops.

  **Why:**
  To demonstrate order dependence in Jeffrey Conditionalization, you need *two* successive uncertain updates where the first update violates Rigidity for the second.
  *   *Requirement:* You need students to update on $E_1$ (uncertain), then $E_2$ (uncertain).
  *   *Problem:* If Rigidity holds, order doesn't matter. If Rigidity fails, order matters.
  *   *Staging Difficulty:* To make Rigidity fail in step 1, you need a correlated channel. To make it matter for step 2, the correlation must affect the conditional probabilities of $E_2$.
  *   *Cognitive Load:* Tracking two uncertain updates, two channel descriptions, and the interaction between them is too much for mental arithmetic in a 75-minute session. Students will lose the thread of *why* the order matters amidst the arithmetic noise.
  *   *Recommendation:* Stick to the Single-Step Rigidity Violation (Round 3). It is the "killer app" of Jeffrey Conditionalization critiques. Mention order dependence in the lecture *after* the activity as a consequence of the Rigidity failure they just witnessed. "Because the link between E and H changed, if we had done this twice, the order would have mattered. Standard Bayes doesn't care about order; Jeffrey does, if you aren't careful."
