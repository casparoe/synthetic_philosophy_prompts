      *   *Wait, if Signal is public, how do I give different Channel Descriptions?*
      *   I hand out different "Instruction Cards" to Left and Right halves before the roll.
      *   Left Card: "Interpret the Signal as Neutral Noise."
      *   Right Card: "Interpret the Signal as Urn-Correlated."
      *   This works perfectly.

      *   *Scoring:* Brier Score. $1 - (p - o)^2$.
