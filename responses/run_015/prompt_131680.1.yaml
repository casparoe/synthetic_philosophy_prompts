  ### 2. The Family of Rules
  Based on her three prior verdicts, she is operating within the family of **Generalized Utilitarianisms** that reject both Strict Total Utilitarianism and Strict Average Utilitarianism. Specifically, two candidates fit her data perfectly:

  1.  **Critical-Level Utilitarianism (CLU):** The value of a population is the sum of each individual's welfare minus a "critical level" constant ($c$).
      *   Formula: $V = \sum (u_i - c)$
      *   *Fit:* This explains why adding lives at +100 and +10 is good (welfare $> c$) but adding billions of lives at +0.1 is bad (welfare $< c$).
  2.  **Lexical Threshold Utilitarianism (LTU):** Lives above a certain welfare threshold ($T$) are lexically superior to lives below it. No number of lives below $T$ can outweigh a sufficient number of lives above $T$.
      *   *Fit:* This explains the rejection of the "Repugnant Conclusion" (Verdict 3) while allowing for the addition of good lives (Verdicts 1 & 2), assuming the added lives are above the threshold.

  **Parameter Constraints:**
  For **CLU**, her critical level $c$ must sit in the range **$0.1 < c < 10$**.
  *   It must be $> 0.1$ to reject the billion people at +0.1 (otherwise they add positive value).
  *   It must be $< 10$ to accept adding the person at +10 (otherwise that life adds negative value).

  ### 3. Analysis of X vs. Y
  Here is how the rules predict the outcome for **X (100 @ −1)** vs. **Y (10 @ −50)**.

  *   **Total Utilitarianism:** $X$ is better ($-100 > -500$). (Ruled out by her Verdict 3).
  *   **Average Utilitarianism:** $X$ is better ($-1 > -50$). (Ruled out by her Verdict 1).
  *   **Lexical Threshold:** Assuming the threshold $T$ is positive (consistent with Verdict 3), all lives in X and Y are below the threshold. Lexical views typically revert to Total or Average utilitarianism for lives below the threshold. **Prediction: X is better.**
  *   **Critical-Level Utilitarianism:**
      *   Value($X$) = $100 \times (-1 - c) = -100 - 100c$
      *   Value($Y$) = $10 \times (-50 - c) = -500 - 10c$
      *   $X$ is better if: $-100 - 100c > -500 - 10c \rightarrow 400 > 90c \rightarrow \mathbf{c < 4.44}$.
      *   $Y$ is better if: $\mathbf{c > 4.44}$.

  **The Flip Point:** For her to prefer Y (the smaller, more miserable group), her critical level $c$ must be surprisingly high (between 4.44 and 10). If her critical level is low (between 0.1 and 4.44), she prefers X.

  ### 4. Where I'd Put My Money
  **Bet:** **X is better.**

  **Why:**
  1.  **The Sadistic Conclusion:** A high critical level (above 4.44) makes CLU vulnerable to the "Sadistic Conclusion"—the counterintuitive result that it is sometimes better to create people with negative welfare than people with positive welfare (below $c$). Most population axiologists explicitly try to avoid this. To avoid it, they keep $c$ very low (often near 0).
  2.  **Minimal Constraints:** Her rejection of the Repugnant Conclusion (Verdict 3) only requires $c > 0.1$. There is no evidence in her prior verdicts that pushes $c$ as high as 4.44. The probability mass is heavily weighted toward the lower end of the $(0.1, 10)$ range.
  3.  **Convergence:** Both the Lexical view and the most standard version of CLU (low $c$) converge on X. Y requires a specific, less common parameter setup.

  ### 5. The Decisive Test Case
  To separate **Critical-Level Utilitarianism** from **Lexical Threshold** views (and to pin down her $c$), read her this pair:

  **Option A:** 1,000 people at +100 welfare.
  **Option B:** 1,000 people at +100 welfare **plus** 1,000,000,000 people at +50 welfare.

  **Why this separates them:**
  *   **If she is a Critical-Level Utilitarian:** Since we know $c < 10$, the billion people at +50 contribute massive positive value ($10^9 \times (50 - c)$). She should say **B is vastly better**.
  *   **If she is a Lexical Threshold Utilitarian:** If her threshold $T$ lies between +50 and +100 (which fits all her previous data), the billion lives at +50 are lexically inferior. They cannot outweigh the risks or trade-offs regarding the +100 lives. She will likely say **A is better** (or that they are incomparable).

  This case forces her to reveal whether she allows massive numbers of "middling" lives to trade off against "excellent" lives, which is the fault line between the two remaining theories.
