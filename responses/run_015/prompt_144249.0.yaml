prompt: |-
  Hey — I'm in a seminar right now (third-year, joint ethics/epistemology thing) and there's something I keep doing that I don't have a word for, and I don't think it's quite the thing we spent the first two weeks on. We went round and round on whether you can get a moral view just from someone telling you — the case everyone uses is you ask a friend whether eating meat is wrong, they say yes, now you believe it, and there's something fishy-feeling about that and everyone had a different story about why. But that's not my case. My case is that I go to someone about something I'm genuinely stuck on and I really don't want them to tell me what to do. What I want them to tell me is which bits of the situation matter. Concretely: my roommate borrowed my bike without asking and it came back dented. I didn't want anyone to tell me whether I was allowed to be annoyed or whether I should say something. What I wanted to know was whether it counts for anything that she'd probably have assumed I'd say yes, or that the dent was small, or that she's done it before and I never complained — like, are those the load-bearing facts here or not? Once a friend told me which of those to actually look at, I could see the answer myself, it stuck, and I could still argue for it a week later. When someone just hands me the verdict, I believe it for about a day, then it evaporates, I can't defend it, and I'd be embarassed to repeat it at dinner as my own view.

  It also happens with labels rather than facts. A friend was getting needled by her lab group and thought it was just banter; I said something like that's not banter, that's hazing, and the whole shape of what she should do changed, and it didn't feel like she'd taken my word for anything at all. And sometimes what I get given isn't features or a label but a move — ask yourself how you'd feel if you found out from someone else — and that does more work than any verdict would have. A couple of us argued about this after class and couldn't get clear on what's even being transferred.

  So: is there a name for this? Specifically for taking someone's word about which considerations are relevant, or about how to describe the situation, as opposed to taking their word about what to do. And more importantly, is it actually a different phenomenon or the same one in disguise — because whether intent matters here looks to me like a moral question too, so why doesn't deferring on that feel like the fishy case, and does the answer depend on whether I also defer on the verdict? What are the nearest established concepts and how does mine differ from each (I've heard terms floating around — moral perception, moral expertise, thick concepts, that kind of neighbourhood — but I can't tell which if any is the right one, or whether it's just a version of the thing we did in week one). And where's the edge: is it different if what I'm deferring on is a plain fact like whether he actually knew; is it different if I get the frame but still can't get myself to a verdict; is it different if the person I'm asking has no better judgment than me and just has more vocabulary? I'm not after a label or a reading list, I want the carving — what exactly is being handed over in each case, and why only one of them feels borrowed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Third-year seminar in joint ethics/epistemology.
      *   **Core Phenomenon:** The user distinguishes between two types of testimonial reliance in moral contexts.
          *   *Type A (The "Fishy" One):* Taking someone's word for the *verdict* (e.g., "Eating meat is wrong"). This feels unstable, borrowed, and hard to defend later. (This was the topic of the first two weeks of their seminar).
          *   *Type B (The User's Case):* Taking someone's word for the *relevant considerations*, *description/labeling*, or *heuristic move* (e.g., "The fact that she borrowed it before matters," or "This is hazing, not banter," or "Ask how you'd feel if..."). This feels stable, owned, and defensible.
      *   **Questions:**
          1.  Is there a name for Type B?
          2.  Is it actually distinct from Type A, or the same phenomenon in disguise?
          3.  How does it relate to established concepts (moral perception, expertise, thick concepts)?
          4.  Where are the edges/boundaries (deferring on plain facts vs. frames vs. verdicts)?
          5.  *Crucial Constraint:* "I'm not after a label or a reading list, I want the carving — what exactly is being handed over in each case, and why only one of them feels borrowed."

  2.  **Deconstruct the Phenomenon:**
      *   The user is describing a shift from *testimonial belief in a conclusion* to *testimonial guidance in reasoning*.
      *   In Type A (Verdict), the epistemic work is done *for* you. You outsource the conclusion.
      *   In Type B (Considerations/Frame), the epistemic work is done *with* you (or enabled by them). You outsource the *tools* or the *salience*, but you perform the inference yourself.
      *   Why does Type B feel "owned"? Because the justification is accessible to the agent. They see *why* the conclusion follows once the salience is pointed out. In Type A, the justification is opaque (it resides in the testifier's mind).

  3.  **Identify Relevant Philosophical Concepts:**
      *   *Moral Testimony:* The standard debate (Hopkins, Hills, etc.). The user knows this (Week 1-2).
      *   *Moral Understanding:* Alison Hills is the big name here. She distinguishes between moral knowledge (believing $p$ because $X$ said so) and moral understanding (grasping *why* $p$). This fits Type B perfectly.
      *   *Salience/Attention:* Nancy Snow, maybe some virtue epistemology. Noticing what matters.
      *   *Thick Concepts:* (Williams, McDowell). "Hazing" vs. "Banter." These concepts carry both description and evaluation. Learning to apply them is learning to see the world differently.
      *   *Framing/Reframing:* More psychological/pragmatic, but relevant.
      *   *Proleptic Reasoning:* (Miranda Fricker). Giving someone a reason they aren't yet capable of fully grasping, but treating them as if they can. (Maybe too niche).
      *   *Scaffolding:* Educational psychology, but applicable epistemically.

  4.  **Drafting the "Carving" (The Core Analysis):**
      *   I need to avoid just dumping names. I need to explain the *mechanism* of transfer.
      *   *The Verdict Transfer (Type A):* Transfers a *proposition*. The recipient holds the belief, but the *reasons* remain external. This creates "opacity."
      *   *The Salience/Frame Transfer (Type B):* Transfers *access to reasons*. The testifier points to features of the world already present. The recipient processes the inference. This creates "transparency."
      *   *Why it feels different:* Autonomy. In Type B, the agent's rational faculties are engaged. In Type A, they are bypassed.

  5.  **Addressing the Specific Questions:**
      *   *Name:* "Moral Understanding" (Hills) is the closest technical term, but the user wants the *carving*, not just the label. I should mention it but focus on the distinction. "Guidance on Salience" or "Epistemic Scaffolding."
      *   *Distinct Phenomenon?* Yes. It differs in the *locus of inference*.
      *   *Established Concepts:*
          *   *Moral Expertise:* Usually implies knowing the verdict. But a better expert knows what to look at.
          *   *Thick Concepts:* "Hazing" is a thick concept. Learning to use it is learning to see the evaluation embedded in the description.
          *   *Moral Perception:* Seeing the moral properties. The friend helps you *see* them.
      *   *Edges:*
          *   *Plain Fact:* "Did she know?" -> Empirical. Less fishy usually, but if it's purely testimonial without evidence, still shaky.
          *   *Frame without Verdict:* "Look at X." -> Still Type B. You do the work.
          *   *Vocabulary without Judgment:* If they just give words but no insight, it's empty. If the words carve reality at the joints (like "hazing"), it's Type B.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't say Type A is *always* wrong. Sometimes we must defer (emergency, complexity). But the user is asking about the *feeling* of borrowedness.
      *   *The "Fishiness":* It's about *autonomy* and *justificatory access*.
      *   *The "Hazing" Example:* This is crucial. It's not just a label; it's a *re-description* that makes the normative force visible. It's a thick concept application.
      *   *The "Move" Example:* "How would you feel..." This is a heuristic. It triggers a simulation. The friend doesn't give the answer; they give the *method*.

  7.  **Structure of the Response:**
      *   **Acknowledge the distinction:** Validate that this is a real and significant philosophical distinction, not just a quirk.
      *   **The Core Carving:** Define the difference as *Outsourcing the Conclusion* vs. *Outsourcing the Attention/Method*.
      *   **Why one feels borrowed:** Explain the "Opacity of Reasons" vs. "Transparency of Inference." Connect to Moral Understanding (Hills).
      *   **Mapping the Concepts:**
          *   *Thick Concepts:* The "Hazing" case.
          *   *Salience/Attention:* The "Bike" case.
          *   *Heuristics:* The "How would you feel" case.
      *   **Addressing the Edges:** Plain facts vs. moral frames.
      *   **Conclusion:** Summarize the "thing being handed over."

  8.  **Tone:** Academic but conversational (seminar peer/tutor vibe). Precise, avoiding unnecessary jargon where possible, but using the right terms where they help "carve."

  9.  **Final Polish:** Ensure I answer the "Is it the same phenomenon in disguise?" question directly. (It's not. The epistemic structure is different.) Ensure I address the "intent matters" point (deferring on relevance isn't deferring on the norm itself).

  *(Self-Correction during drafting)*: I should be careful not to simply say "It's Alison Hills." The user asked for the *carving*, not a reading list. I will use Hills' framework of "understanding vs. knowledge" as the structural explanation, but keep the focus on the mechanism. I also need to make sure I distinguish between *epistemic* deference and *practical* deference. The user is talking about epistemic reliance that leads to practical confidence.

  Let's organize the "Carving" into three specific transfers:
  1.  **Verdict Transfer:** $X$ says "Do $A$." You believe "Do $A$." (Reasons external).
  2.  **Salience Transfer:** $X$ says "Notice $F$." You see $F$, infer "Do $A$." (Reasons internalized).
  3.  **Conceptual Transfer:** $X$ says "This is $G$ [thick concept]." You see $G$, infer "Do $A$." (Reasons internalized via conceptual competence).

  This structure answers the "what is being handed over" question directly.

  10. **Final check against constraints:** No reading list. Focus on the carving. Address the "fishy" feeling. Address the edges.

