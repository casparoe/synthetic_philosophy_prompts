answer: |-
  # The Abyssal Outpost Freedom Diagnostic

  **Setting:** *Abyssal Outpost Alpha*, a deep-sea research station. Life support is finite. The **Commander** holds formal emergency powers (lockdown, rationing) but has never used them. The **Algorithm** assigns living quarters based on efficiency. The **Crew** live under standing orders written decades ago.

  **Instructions:** For each scenario, select the option that best matches your judgment about the crewmate's **freedom**.

  **1. The Craving**
  A crewmate wants to smoke. Tobacco is banned for safety. They are physically healthy but feel controlled by the craving.
  *   (A) They are unfree; their own desire masters them.
  *   (B) They are free, but psychologically constrained.
  *   (C) They are free; the ban is just an external rule.

  **2. The Kill-Switch**
  The Commander holds a code that can lock any crewmate in their room instantly. She never uses it and has no plan to.
  *   (A) They are unfree; she holds power over them.
  *   (B) They are free, but vulnerable to her whim.
  *   (C) They are free; unused power is no constraint.

  **3. The Benevolent Assignment**
  The Algorithm assigns rooms. It always tracks crew interests perfectly, but there is no procedure to appeal its decisions.
  *   (A) They are unfree; they cannot contest the power.
  *   (B) They are free, but lack political agency.
  *   (C) They are free; the outcomes suit their interests.

  **4. The Costly Lock**
  The Commander *could* lock a crewmate in, but doing so drains power needed for heating, risking her own comfort.
  *   (A) They are unfree; the capacity exists regardless of cost.
  *   (B) They are free; rational costs neutralize the threat.
  *   (C) They are free; the power is effectively non-existent.

  **5. The Locked Door**
  A storage door is locked. A crewmate never wanted to enter it, nor would they ever choose to.
  *   (A) They are unfree; their field of options is narrowed.
  *   (B) They are free, but their potential is reduced.
  *   (C) They are free; unchosen options don't matter.

  **6. The Silent Camera**
  Sensors monitor crew vitals. The data is recorded but never viewed. The crew does not know the sensors exist.
  *   (A) They are unfree; surveillance is inherently dominating.
  *   (B) They are free, but privacy is violated.
  *   (C) They are free; unknown interference is no interference.

  **7. The Dead Rule**
  A standing order forbids red shirts. The author died years ago; no procedure exists to amend the rulebook.
  *   (A) They are unfree; they live under a masterless hierarchy.
  *   (B) They are free, but bound by legacy constraints.
  *   (C) They are free; no living agent dominates them.

  **8. The Ticket Price**
  A crewmate can leave the station, but the ticket costs all their lifetime credits, leaving them destitute elsewhere.
  *   (A) They are unfree; lack of resources blocks action.
  *   (B) They are free, but effectively unable to leave.
  *   (C) They are free; no one is stopping them legally.

  **9. The Happy Captive**
  A crewmate says they love the station. You suspect they only say this because they adapted to the confinement.
  *   (A) They are unfree; their preferences are distorted by power.
  *   (B) They are free, but their autonomy is compromised.
  *   (C) They are free; their stated preference is what counts.

  **10. The Retired Guard**
  A security guard was fired years ago. His camera feed is still active, but no one watches it. The crew thinks he watches.
  *   (A) They are unfree; they believe they are dominated.
  *   (B) They are free, but live in unnecessary fear.
  *   (C) They are free; actual power is what counts.

  ***

  # Scoring Key: The Liberty Decision Tree

  **How to Use:** Do not tally points. Start at **Node 1** and follow the student's answers down the tree. Where a student's answers conflict (e.g., Negative on power but Positive on resources), follow the branch that matches their *strongest* commitment (most 'A' responses in that cluster).

  ### Node 1: The Internal Obstacle (Question 1)
  *Did the student choose (A) "They are unfree"?*

  *   **YES:** → **Leaf 1: Positive Liberty (Self-Mastery)**
      *   *Theory:* Freedom is rational self-rule; internal compulsions count as chains.
      *   *Awkward Commitment:* Must justify why some desires (rational) liberate while others (irrational) enslave, without imposing a state orthodoxy on what counts as "rational."
  *   **NO:** → Go to **Node 2**.

  ### Node 2: Resources & Capacity (Question 8)
  *Did the student choose (A) "They are unfree" regarding the ticket price?*

  *   **YES:** → **Leaf 2: Positive Liberty (Self-Realization / Capabilities)**
      *   *Theory:* Freedom requires the effective capacity to function, not just the absence of blockers.
      *   *Awkward Commitment:* Must accept that freedom is infinitely expandable by resources, potentially conflating "freedom" with "wealth" or "power."
  *   **NO:** → Go to **Node 3**.

  ### Node 3: Unused Power & Status (Questions 2, 5, 6)
  *Did the student choose (A) "They are unfree" on at least two of these "unused power" cases?*

  *   **NO (Mostly C):** → **Leaf 3: Negative Liberty (Classic Liberal)**
      *   *Theory:* Freedom is the absence of actual external interference.
      *   *Awkward Commitment:* Must accept that a slave with a benevolent master who never interferes is free, provided the master never actually strikes.
  *   **YES:** → Go to **Node 4**.

  ### Node 4: The Source of Constraint (Question 7)
  *On the "Dead Rule" (no living author), did they choose (A) "Unfree"?*

  *   **YES:** → **Leaf 4: Feminist Non-Subordination**
      *   *Theory:* Freedom is the absence of hierarchical social status; structure oppresses even without a specific oppressor.
      *   *Awkward Commitment:* Must explain how to dismantle domination without a *dominus* to hold accountable, risking a view where "society" is always the enemy.
  *   **NO:** → Go to **Node 5**.

  ### Node 5: The Nature of Power (Questions 3 & 10)
  *On the "Benevolent Algorithm" (Q3), did they choose (A) "Unfree" (due to lack of contestability) OR on "Retired Guard" (Q10) choose (A) (due to belief in power)?*

  *   **NO (They chose C on Q3 if interests are tracked):** → **Leaf 5: Interest-Tracking Republicanism**
      *   *Theory:* Domination is arbitrary power; if power tracks your interests, it is not domination.
      *   *Awkward Commitment:* Must accept that a benevolent dictator who reliably guesses your needs is compatible with freedom, even if you cannot vote them out.
  *   **YES (They chose A on Q3 regardless of tracking):** → Go to **Node 6**.

  ### Node 6: Contestability vs. Cost (Question 4 & 3)
  *Did they mark "Unfree" on Q4 (Costly Lock) AND Q3 (No Appeal)?*

  *   **YES:** → **Leaf 6: Radical Republicanism (Pettit-Strict)**
      *   *Theory:* Freedom requires institutionalized contestability; power is dominating unless you can effectively challenge it.
      *   *Awkward Commitment:* Must accept that a perfectly benevolent, non-interfering power is still a form of slavery if the legal right to challenge it is missing.
  *   **NO (They chose B/C on Q4 - Cost matters):** → **Leaf 7: Cost-Sensitive Liberty (Effective Freedom)**
      *   *Theory:* Freedom is a function of the probability and cost of interference; ruinous costs negate capacity.
      *   *Awkward Commitment:* Must accept that freedom is scalar and probabilistic, making it difficult to define a clear threshold for when a "threat" becomes "unfreedom."

