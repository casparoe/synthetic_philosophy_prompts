  # Diagnostic Notes & Theoretical Stuck Points

  **1. The Adapted Preference Problem (Node 4 vs. Node 1)**
  *Where the tree gets stuck:* **Feminist Non-Subordination** and **Positive Liberty (Self-Mastery)** often converge on Question 9 (The Happy Captive). Both will likely select (A).
  *   *Why:* Both theories reject revealed preferences as proof of freedom when those preferences are shaped by oppression or irrationality.
  *   *Differentiation:* You must rely on **Node 1**. If they think *internal* cravings (Q1) make you unfree, they are Positive Liberty. If they think only *socially adapted* preferences (Q9) make you unfree, they are Feminist Non-Subordination. If they mark (A) on both, the distinction collapses; acknowledge this as a **Positive-Feminist Hybrid**.

  **2. The Republican Split (Node 5)**
  *Where the tree gets stuck:* **Interest-Tracking Republicanism** vs. **Radical Republicanism**.
  *   *Why:* Philip Pettit's later work emphasizes contestability over mere tracking. Some students will feel that tracking interests is enough (Leaf 5), while others will insist on the right to appeal (Leaf 6).
  *   *Differentiation:* Question 3 isolates this. If they say tracking makes you free, they are in Leaf 5. If they say lack of appeal makes you unfree *even with* tracking, they are Leaf 6.

  **3. The Negative Liberty Collapse (Node 3)**
  *Where the tree gets stuck:* **Negative Liberty** vs. **Cost-Sensitive Liberty**.
  *   *Why:* A probabilistic version of Negative Liberty (freedom = low expected interference) collapses into Cost-Sensitive Liberty (Leaf 7).
  *   *Differentiation:* Question 4 (The Costly Lock). Classic Negative Liberty (Leaf 3) says capacity without intent is freedom. Cost-Sensitive (Leaf 7) says capacity + high cost = unfreedom. If the student hedges on Q4, they are likely holding an unstated **Expected-Value Negative Liberty** view.

  **4. The Structural Gap (Node 4)**
  *Where the tree gets stuck:* **Feminist Non-Subordination** vs. **Anarchism**.
  *   *Why:* Both reject the "Dead Rule" (Q7).
  *   *Differentiation:* This quiz does not isolate Anarchism specifically. If a student marks (A) on Q7 but (C) on Q2 (Commander Power), they believe *structure* dominates but *individuals* do not. This is a rare **Structuralist** position not fully captured by the leaves; flag them for discussion on whether domination requires an agent.

  **5. Empty Cells**
  *   *Incoherent:* Marking (A) on Q1 (Internal) but (C) on Q8 (Resources). This implies internal will matters more than external food/shelter. This is a **Stoic** position, logically consistent but practically rare in modern contexts.
  *   *Unexplored:* Marking (C) on Q7 (Dead Rule) but (A) on Q2 (Commander). This implies only *living* agents can dominate. This is the **Classic Republican** blind spot that Feminist theory critiques. It is a stable position, but one the seminar should challenge.
