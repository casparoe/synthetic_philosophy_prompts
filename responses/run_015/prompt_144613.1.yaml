answer: |-
  ### Heterophenomenology as Narrative Method

  To translate heterophenomenology into the vocabulary of narrative craft, we must treat the human subject not as a mind to be penetrated, but as a narrator whose text is the only evidence available. The investigator becomes a narratologist analyzing a specific kind of manuscript.

  #### Move 1: The Textualization of Experience
  **Heterophenomenological Move:** First-person reports of conscious experience are treated as texts describing a "heterophenomenological world."
  **Literary Analog:** **The Character's Diegetic Utterance.**
  In narrative theory, when a character speaks or thinks within the story, they generate a diegetic layer. Heterophenomenology treats the subject's speech about their pain, redness, or anger exactly as a critic treats a character's monologue about their pain, redness, or anger. The "heterophenomenological world" is the **Character's Diegesis**—the world as it exists within the boundaries of the character's narration.

  *   **Functional Difference:** In fiction, the character's diegetic utterance is usually subordinate to a higher narrative authority (the narrator or implied author) that establishes the "real" events of the plot. In heterophenomenology, there is no higher narrator. The subject's utterance is the *only* text. There is no omniscient voice to confirm if the pain actually exists, only the monologue claiming it does.
  *   **Distortion Required:** To make this fit, you must suppress the intuition that the character *is* the experience. In fiction, we often equate the monologue with the interiority itself. Here, you must view the monologue as a constructed artifact *about* an interiority that may or may not exist. The "world" inside the report is treated as a fictional setting created by the subject, regardless of whether that setting maps onto biological reality.

  #### Move 2: The Neutral Stance
  **Heterophenomenological Move:** The investigator adopts a neutral stance regarding whether the entities and events described in those texts are real.
  **Literary Analog:** **The Contract of Unreliable Narration (sans Omniscience).**
  This is equivalent to reading an unreliable narrator while deliberately refusing to look for the "true" version of events. Normally, when we identify a narrator as unreliable, we do so because we detect a gap between their focalization and the implied author's truth. Heterophenomenology requires you to maintain the unreliability indefinitely. You bracket the truth-value of the narration. If the subject says, "I see a pink elephant," you record "The narrator reports seeing a pink elephant," without committing to the existence of the elephant or the visual experience.

  *   **Functional Difference:** In narrative craft, unreliability is a device used to create irony or thematic depth; it presupposes a reality that the narrator fails to capture. The reader enjoys the gap between the narrator's version and the implied truth. In heterophenomenology, the "implied truth" is methodologically inaccessible. The irony is not aesthetic; it is ontological. You are not waiting for the plot twist that reveals the reality; you are studying the narrator's *commitment* to the plot.
  *   **Distortion Required:** You must strip the concept of "unreliability" of its corrective counterpart. Usually, an unreliable narrator implies a reliable one somewhere in the structure (the implied author). Here, you must imagine a text with no implied author, where the only reality is the text itself. You are reading a diary without assuming a writer who exists outside the diary entries.

  #### Move 3: The Target of Study
  **Heterophenomenological Move:** The resulting data is used to study the subject's *theory* of consciousness, not consciousness itself.
  **Literary Analog:** **Analyzing Focalization rather than Plot.**
  In fiction, we distinguish between *what happened* (the story/fabula) and *how it is perceived* (the focalization). Heterophenomenology argues that we never get the "what happened" of the mind. We only get the focalization. Therefore, the object of study is not the "events of consciousness" (the plot of the mind) but the "mechanisms of focalization" (the subject's theory of how they perceive). You are studying the character's model of their own mind, not the mind itself.

  *   **Functional Difference:** In literary analysis, studying focalization is a means to understand the character's relationship to the plot. We assume the plot (the consciousness) is there to be related to. In heterophenomenology, the "plot" is suspended. The "theory of consciousness" is the only object on the table. If the subject believes they have a private theater of experience, the scientist studies that belief as a narrative construct, not as a description of a functioning theater.
  *   **Distortion Required:** You must accept that there is no "Plot" to be found. In narrative theory, even the most solipsistic stream-of-consciousness implies a consciousness doing the streaming. Heterophenomenology asks you to consider that the "stream" might be a retrospective fabrication, a story the system tells itself to make sense of its own outputs. You are analyzing the style of the narration as the sole substance of the work.

  ***

  ### Residue Report: The Eliminativist Gap

  There is a residue that refuses to translate. It lies in the **ontological status of the Interior.**

  **The Missing Counterpart:**
  In narrative craft, specifically in Free Indirect Discourse (FID) or deep focalization, the contract between implied author and reader relies on the premise that the text *successfully simulates* access to a subjective interior. When we read "He was miserable," via FID, we accept that we are touching the texture of his misery. The art form depends on the validation of phenomenal experience—the "what it is like"—as a transmissible reality.

  Heterophenomenology contains a deflationary commitment: it suggests that the "what it is like" (the phenomenal quality) may be a fictional entity generated by the subject's theory. It implies that the "inner theater" is a user-illusion. Narrative theory has no mechanism for this. A novel cannot present a character who *thinks* they are sad but *is not* sad in any meaningful sense, without that absence of sadness becoming a new kind of presence (e.g., self-deception). In fiction, interiority is always substantive. In heterophenomenology, interiority is a hypothesized variable that may be eliminated.

  **Diagnosis of the Gap:**
  This gap does not suggest that narrative theory misses something essential about subjective report. Rather, it suggests that heterophenomenology relies on a presupposition about text and reality that fiction does not share.

  1.  **Fiction's Presupposition:** The text *creates* the reality it describes. If the character says they are in pain, they are in pain within the diegesis. The report is constitutive.
  2.  **Heterophenomenology's Presupposition:** The text *describes* a reality external to the text (the brain states), and may fail. The report is referential.

  The failure of translation occurs because heterophenomenology treats the subject as a *bad narrator* of a biological truth, whereas narrative theory treats the subject as the *author* of their own truth. When Dennett proposes we study the subject's theory of consciousness rather than consciousness itself, he is effectively saying: "Treat the protagonist's monologue as a lie about a plot that doesn't exist."

  Narrative theory cannot accommodate this without collapsing. If the focalizer's report does not refer to a genuine focalized object, the distinction between narrator and narrative dissolves. Therefore, the residue reveals that heterophenomenology is not merely a method of reading subjects; it is a metaphysical claim that the "story" of consciousness is a fiction generated by the brain. Narrative craft assumes the story is the only reality we have. Heterophenomenology assumes the story is a shadow cast by a machine. The translation fails because fiction is committed to the reality of the ghost, while heterophenomenology is committed to explaining the machine that projects it.
