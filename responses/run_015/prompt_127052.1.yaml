      *   *Actually, the best test:* **Arvo Pärt (Spiegel im Spiegel)**. It's tonal, slow, seemingly "at rest," but relies on tension. If she hates it, she's a dogmatist. If she loves it, her system has a hole.
      *   *Better Test:* **The ending of Tristan und Isolde.** The "Liebestod." It promises release but is incredibly chromatic/striving.
      *   *Best Fit for her specific "Wanting-Shape":* **The opening of Wagner's Tristan** (The Chord). It is pure wanting without resolution. If she likes the opening but hates the end, she's consistent.
      *   *Wait, let's look at the Cage verdict again.* She hates Cage because it's "furniture." She wants *active* striving.
