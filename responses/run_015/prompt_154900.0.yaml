      *   *Is it substantive?* Yes. One side wants validity (etiology), the other wants utility (clinical/social impact).
      *   *Is it evidential?* Yes. Side A looks for biomarkers/neural correlates. Side B looks for prevalence shifts/post-diagnosis behavioral changes.
      *   *Is it "answering different questions"?* This is the strongest candidate. Side A asks "Does this exist?" Side B asks "What happens if we say it exists?"

  3.  **Address the "Looping Effect" Worry:**
      *   Ian Hacking's "Interactive Kinds" vs. "Indifferent Kinds." Mental disorders are interactive.
      *   The user worries this makes empirical validation impossible because the target moves.
      *   *Counter-thought:* It doesn't make it impossible, it makes it *dynamic*. You can measure the loop. You can test stability *despite* the loop.
      *   *Key Insight:* The disagreement isn't about *whether* looping happens (both sides likely agree it does), but about whether the category *survives* the loop with enough predictive validity to be useful.

  4.  **Evaluate the User's "Three Questions" Theory:**
      *   1. What it describes (Validity/Nature).
      *   2. What it's for (Utility/Function).
      *   3. What it does to the person (Ethics/Looping).
      *   *Verdict:* This is excellent. It aligns with Kendell & Jablensky's distinction between *validity* and *utility*. It also incorporates Hacking.

  5.  **Formulate the Diagnosis:**
      *   It is **not merely verbal**. It's a category error regarding the *purpose* of the manual.
      *   It is **substantive**, but the substance is mixed up. It's a conflict between *ontological aspirations* (Side A) and *pragmatic consequences* (Side B).
      *   The "Hidden Empirical Question": It's not "Is this real?" It's "Is this category *stable enough* and *useful enough* despite the looping?"
      *   Can it be answered? Yes, but not by finding a gene. By longitudinal studies of the *effect of the diagnosis*.

  6.  **Develop Recommendations for Progress:**
      *   *Stop arguing about "Realness".* Adopt a pragmatic realism (like Boyd's "Homeostatic Property Clusters" or Kendell's "Utility").
      *   *Adopt the User's Three Questions.* Formalize them into criteria for inclusion.
      *   *Study Design:* Don't look for pre-existing mechanisms only. Look for *predictive stability* post-classification. Does the label help predict course/treatment *better* than just symptoms?
      *   *Decision Rule:* If the utility (access to care, research funding) outweighs the harm (stigma, self-fulfilling prophecy), include it, *with caveats*.
      *   *The "Gaming" Context:* Specific advice on behavioral addictions.

  7.  **Drafting the Response (Iterative refinement):**
