answer: |-
  This is a strong, provocative core idea. It hits a nerve in contemporary metaontology, and if executed well, it could make for an excellent workshop paper. It's not a "cheap knockoff," but it does tread on ground that requires careful navigation to ensure you're making a *new* contribution rather than just restating a known tension.

  Here is a breakdown of feedback on novelty, the argument's structure, the literature you need to engage, and the strategic direction of the paper.

  ### 1. Novelty Check: Is this done to death?
  **Verdict:** No, but it is "in the air."
  You are not reinventing the wheel, but you are proposing a specific *diagnosis* of a known problem that hasn't been fully exhausted.

  *   **The Known Tension:** It is well-established (e.g., in the Chalmers/Manley/Wasserman *Metametaphysics* volume, 2009) that deflationists (Hirsch) and inflationists (Sider) disagree. Hirsch admits his view is substantive; Sider argues Hirsch is wrong about the world's structure.
  *   **Your Specific Contribution:** Most literature treats the definition of "verbal dispute" as a tool to *solve* first-order ontology. You are turning the lens back on the tool itself. The claim that **the criterion for verbal disputes is itself theory-laden** is the key.
  *   **Potential Overlap:** You need to be careful with **Matti Eklund** (specifically *Metaontology* and his work on ontological realism) and **Amie Thomasson** (*Ontology Made Easy*). Thomasson argues that ontological questions are often conceptual, but she has a specific methodology to avoid this circularity. Eklund discusses the "normative" nature of ontology.
      *   *Action:* Search for papers discussing "metaontological self-defeat" or "the status of metaontological criteria." If you frame this as a **problem for the *utility* of the verbal/substantive distinction in dialectical contexts**, you carve out a unique niche.

  ### 2. Does the Regress Argument Land?
  You call it a regress, but logically, it looks more like **circularity** or **question-begging**.
  *   **The Regress Worry:** A true regress implies: To define verbal dispute V1, we need V2; to define V2, we need V3...
  *   **The Circularity Reality:** To define verbal dispute V, we need Metaontological Theory M. But M is justified by... (often) the fact that it correctly identifies disputes as verbal/substantive.
  *   **Recommendation:** Sharpen this. Don't argue for an infinite regress. Argue for **criterion-dependence**.
      *   *Argument:* Any criterion $C$ for distinguishing verbal/substantive disputes presupposes a metaontological commitment $M$ (e.g., about joint-carving, or pragmatic utility).
      *   *Implication:* Therefore, invoking $C$ to settle a metaontological debate (or a first-order debate thought to be metaontological) begs the question against those who reject $M$.
      *   *Why this lands:* It undermines the "neutral arbiter" hope. Many philosophers (like Chalmers in "Verbal Disputes") hope to use conceptual analysis to dissolve disputes *without* taking heavy metaphysical sides. You are arguing that the analysis *is* the metaphysical side.

  ### 3. The "Neutral Criterion" Question
  You ask if there is a way to characterize verbal disputes that doesn't beg the question.
  *   **Short Answer:** Probably not, and arguing that there *isn't* is your paper's strength.
  *   **The Chalmers Move:** Chalmers tries to offer a neutral account based on "intensions" and "epistemic possibilities." You can attack this by arguing that even agreeing on intensions requires agreeing on which properties are "natural" or which concepts are "fundamental."
  *   **The Hirsch Move:** Hirsch relies on "quantifier variance." Sider attacks this by saying variance is impossible because there is one joint-carving quantifier.
  *   **Your Point:** You can't decide between Chalmers, Hirsch, and Sider using a neutral definition of "verbal," because their definitions of "verbal" are derived from their incompatible metaphysics.
  *   **Strategy:** Don't try to solve this. Demonstrate that the search for neutrality is the mistake. This validates your skepticism.

  ### 4. Skeptical vs. Positive Proposal
  Workshop audiences often find pure skepticism frustrating ("Okay, so we're stuck. Now what?"). A **methodological moral** is better than a dead end.

  *   **Option A (Pure Skepticism):** "Metaontology is hopeless because its tools are biased." (Risk: Too nihilistic, referees might say "so stop doing metaontology.")
  *   **Option B (Methodological/Positive):** "We cannot use 'verbal dispute' as a debate-stopper. Instead, we must treat metaontological commitments as **explicit parameters**."
      *   *Proposal:* When we argue about composition, we shouldn't ask "Is this verbal?" (which smuggles in theory). We should ask "Relative to framework F (e.g., Carnapian), is this verbal? Relative to framework S (e.g., Siderian), is this substantive?"
      *   *Upshot:* This moves the field from "Who is right?" to "Which framework is more useful for our purposes?" This aligns with **ontological pluralism** or **conceptual engineering**.
      *   *Why this works:* It saves the phenomenon (we can still talk about verbal disputes) without the false promise of neutrality.

  ### 5. Specific Literature to Check (To avoid accidental plagiarism)
  Before you write, glance at these to ensure your angle is distinct:
  1.  **Eli Hirsch, "Quantifier Variance and Realism" (2002) & *Existential Relativity*:** He knows his view isn't neutral. Make sure you aren't just repeating his concession. Your point is stronger: *no one's* view can be neutral.
  2.  **Theodore Sider, *Writing the Book of the World* (2011), Ch. 9:** He discusses "metaphysical semantics." He argues that without joint-carving, we lose the ability to distinguish verbal from substantive. You are essentially arguing that *accepting* joint-carving is the non-neutral move.
  3.  **J.T.M. Miller, "The Metaphysics of Verbal Disputes" (2015-ish):** Check if he covers the theory-ladenness of the definition.
  4.  **Kris McDaniel, "Metaontology" (Stanford Encyclopedia):** Good for mapping the landscape.
  5.  **Amie Thomasson, *Ontology Made Easy*:** She argues disputes are often about concepts. You need to distinguish your view from hers. She thinks we can resolve them via conceptual analysis; you think the analysis itself is contested.

  ### 6. Suggested Structure for the Paper
  1.  **Introduction:** The hope of metaontology (to dissolve/resolve disputes) vs. the reality (persistent disagreement). Introduce the "Verbal Dispute" as the primary tool for dissolution.
  2.  **The Case Study:** Sider vs. Hirsch on Composition. Show clearly how they disagree on the *outcome* (verbal vs. substantive).
  3.  **The Diagnosis:** Trace the disagreement back to the *definition* of "verbal dispute." Show how Sider's definition requires Joint-Carving and Hirsch's requires Pragmatic Equivalence.
  4.  **The Argument:** Demonstrate that these definitions are not neutral. They are substantive metaontological claims. Therefore, using the label "verbal dispute" presupposes the truth of one metaontology over the other.
  5.  **Objection Handling:** Anticipate the Chalmers-style objection (that we can define verbal disputes via intensions/epistemic space without metaphysics). Argue that even selecting the relevant intensions is theory-laden.
  6.  **Positive Proposal:** Stop trying to find the "One True Criterion." Adopt a **Framework-Relative** approach. We can say "Relative to a Carnapian framework, this is verbal," but we cannot say "This is *really* verbal."
  7.  **Conclusion:** The concept of "verbal dispute" is not a tool for ending debates, but a marker of metaontological commitment.

  ### Final Verdict
  This is **not** a knockoff. It is a solid "meta-metaontological" critique. The key to success will be precision: ensure you distinguish between "the dispute is verbal" (first order) and "the definition of verbal is contested" (second order).

  If you frame the conclusion as a call for **transparency** (explicitly stating your metaontological commitments when labeling a dispute verbal) rather than **skepticism** (we can never know), the paper will be much better received. It transforms a bug into a feature: we don't lose the concept, we just stop pretending it's neutral.

  Go for it. Just make sure you read Sider's *Writing the Book of the World* closely if you haven't already, as he is your primary antagonist here.
