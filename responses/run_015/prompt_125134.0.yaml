  4. What the film adds to the philosophy
  *Arrival* contributes to the philosophical debate by visceralizing the cost of entering a new language game. Philosophical texts often discuss "forms of life" abstractly, but the film shows the emotional labor required to align practices with another being. It highlights that translation is not merely intellectual but embodied and risky, as seen when Louise removes her suit. This adds weight to the idea that meaning is use; use involves vulnerability.

  Moreover, the film explores the ethical implications of linguistic assimilation. Louise's final choice demonstrates that acquiring a new language can alter one's ethical landscape, not by changing private feelings, but by changing what actions make sense within a form of life. It suggests that understanding another is not about accessing their private mind, but about joining their practice, even when that practice entails suffering. This dramatizes the Wittgensteinian notion that grammar is not innocent; it shapes the possibilities of our lives. The film offers a narrative proof that learning a language is learning how to live, something argumentation alone struggles to convey. It gives face to the abstract idea that our world is bounded by our grammar, showing the pain and beauty of expanding those bounds.

  5. Settled versus contested
  In Wittgenstein scholarship, it is settled that he rejected the idea that meaning is fundamentally naming objects and that he utilized family resemblance to challenge essentialism. It is also widely accepted that the Private Language Argument critiques the coherence of rules based solely on inner experience. However, my reading relies on contested interpretations regarding "forms of life." Some scholars view forms of life as naturalistic, biological givens, while others see them as cultural practices subject to change. If forms of life are rigid, Louise's transition is impossible; if fluid, the film aligns better.

  Additionally, there is dispute over whether Wittgenstein offers a theory of translation. Some argue he implies radical relativism where translation between disparate forms of life is impossible, while others see room for bridging practices. The film assumes translation is possible but costly, siding with the latter. Finally, the therapeutic versus doctrinal reading matters: if Wittgenstein is only dissolving philosophical confusion, then treating his ideas as a positive theory of language (as the film arguably does) misuses him. I have treated his concepts as analytical tools, acknowledging this risks doctrinalizing a thinker who often resisted theory. Scholars disagree on whether Wittgenstein allows for the kind of cognitive shift Louise experiences, or if he would dismiss it as a grammatical illusion.
