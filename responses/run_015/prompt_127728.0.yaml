answer: |-
  Your hypothesis that the impasse stems from a clash between first-order interpersonal morality and second-order institutional design is correct, but it is not sharp enough to break the deadlock. If it were merely a matter of level of analysis, the two sides could agree to disagree on scope. The fact that they do not suggests a deeper conflict over the **source of normative authority** in collective violence.

  Here is a sharper diagnosis of the structural disagreement, followed by a proposal for what would actually constitute progress.

  ### 1. The Diagnosis: Moral Ontology vs. Normative Function

  The impasse persists because the two sides are using the word "moral" to do two different kinds of work. They are not merely asking the question at different levels; they are disagreeing about what kind of entity war *is*.

  **The Revisionist Position (Moral Ontology):**
  For the Revisionist, the morality of war is **reductive**. It is nothing over and above the morality of interpersonal killing, scaled up. When they ask, "May this soldier kill that soldier?", they are asking a truth-conditional question about rights and liability.
  *   **Core Commitment:** Moral facts exist independently of social conventions. If a soldier fights for an unjust cause, they are objectively contributing to an unjust threat. No amount of institutional positioning changes the metaphysical fact that they are violating the rights of those they attack.
  *   **View of Institutions:** Institutions are *tracking* mechanisms. They should align rules with underlying moral facts. If the rules (MEC) diverge from the facts (asymmetry of liability), the rules are morally defective.
  *   **Definition of "Permission":** Objective moral permissibility. To say a soldier is "permitted" to kill is to say the victim has no right not to be killed by that agent.

  **The Traditionalist Position (Normative Function):**
  For the Traditionalist, the morality of war is **constitutive**. War is a distinct social practice with its own internal logic, generated by the necessity of managing lethal violence between collectives.
  *   **Core Commitment:** Moral norms in war are *regulative* tools designed to minimize suffering and maintain the possibility of surrender and order. The "Moral Equality of Combatants" is not a description of underlying rights, but a **normative fiction** required for the practice to remain bounded.
  *   **View of Institutions:** Institutions are *generative* mechanisms. They create moral statuses (e.g., "combatant immunity") that do not exist in ordinary life. The institutional role does not "launder" culpability; it creates a distinct sphere of agency where individual liability is suspended in exchange for adherence to *jus in bello*.
  *   **Definition of "Permission":** Regulatory immunity. To say a soldier is "permitted" to kill is to say they are not subject to punishment or moral condemnation *within the context of the war convention*, regardless of the underlying justice of the cause.

  **The Structural Impasse:**
  The debate stalls because the Revisionist demands that **Regulative Immunity** track **Objective Permissibility**, while the Traditionalist argues that **Regulative Immunity** must intentionally diverge from **Objective Permissibility** to function.
  *   When the Traditionalist says, "Epistemic limits undermine individualized judgment," the Revisionist hears, "Ignorance changes the moral facts." (Revisionist response: Ignorance excuses blame, but does not make the victim liable.)
  *   When the Revisionist says, "Organizational structure cannot launder culpability," the Traditionalist hears, "Institutions have no power to create new normative statuses." (Traditionalist response: We aren't laundering; we are constituting a new role.)

  ### 2. Is it a Verbal Dispute?

  It is a **substantive disagreement masked by shared vocabulary**, specifically the word "Permission" and the phrase "Moral Equality."

  *   **Permission:** If "permission" means "the victim has no right against this killing," the Revisionist wins (unjust combatants violate rights). If "permission" means "the killer is not blameworthy/punishable given the constraints of the situation," the Traditionalist wins (soldiers cannot be expected to know more).
  *   **Moral Equality:** If this means "Both sides are equally justified in their cause," both sides agree this is false. If it means "Both sides are equally subject to the same rules of engagement," both sides agree this is true. The fight is over whether the *rules of engagement* must reflect the *justification of the cause*.

  ### 3. What Would Move the Needle?

  Empirical studies of combatant reasoning will not solve this, because the dispute is normative, not descriptive. A formal model of distributed responsibility might clarify the logic, but it won't resolve the clash between ontology and function.

  **Genuine progress requires a conceptual reframing that dissolves the dichotomy.** You should abandon the search for a single "Moral Equality of Combatants" thesis and instead adopt a **Dual-Track Framework**.

  **The Proposal: Distinguish "Liability" from "Privilege"**

  Progress lies in explicitly separating the question of *liability to attack* from the *privilege to attack*.

  1.  **Track A (Liability - Revisionist Insight):** Acknowledge that unjust combatants are objectively liable to defensive harm, and just combatants are not. This preserves the moral truth that aggression is wrong. Unjust combatants do not have a *right* to kill just combatants.
  2.  **Track B (Privilege - Traditionalist Insight):** Acknowledge that, due to epistemic constraints and the necessity of a functional war convention, unjust combatants possess a **regulated privilege** to fight without being prosecuted as murderers, *provided* they adhere to *jus in bello*.

  **Why this moves the needle:**
  It forces the Revisionist to concede that while unjust combatants are *liable*, punishing them as murderers is pragmatically and morally counterproductive (validating the Traditionalist's institutional concern). It forces the Traditionalist to concede that this privilege is not a deep moral *right*, but a contingent **immunity** granted by the international order to preserve the possibility of limiting war (validating the Revisionist's moral concern).

  **The New Question:**
  Stop asking: "Are combatants morally equal?"
  Start asking: "Under what conditions should the international community grant **combatant immunity** to agents who are objectively **morally liable** to defensive killing?"

  ### 4. Conclusion: The Path Forward

  The impasse exists because both sides are trying to monopolize the term "Moral."
  *   The Revisionist wants morality to be about **Truth** (Who is actually in the right?).
  *   The Traditionalist wants morality to be about **Order** (How do we keep this from becoming genocide?).

  **Genuine progress** in your seminar will come when you reclassify the Traditionalist view not as a competing moral ontology, but as a **moral theory of institutional design**. The Traditionalist is not saying unjust killers are innocent; they are saying that *treating* them as guilty in real-time makes the world worse.

  **Actionable Step:**
  Propose a terminological moratorium. Ban the phrase "Moral Equality of Combatants." Replace it with **"Symmetry of Belligerent Rights."**
  *   Ask the Revisionists: "Can you accept Symmetry of Belligerent Rights as a necessary legal fiction, even if Moral Equality is false?"
  *   Ask the Traditionalists: "Can you accept that Symmetry of Belligerent Rights is a functional convention that does not erase the underlying moral asymmetry of the cause?"

  If they can agree that **Moral Asymmetry** (Revisionist) is compatible with **Juridical Symmetry** (Traditionalist), the impasse breaks. The disagreement is not about the reality of war, but about whether our ethical vocabulary should describe the reality or regulate the practice. Once you admit it must do both, but in different registers, the rotation stops.
