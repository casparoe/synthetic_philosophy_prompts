  5.  **Formulate the Diagnosis (The "Deep Structure"):**
      *   The impasse isn't just level of analysis; it's a clash between **Reductive Individualism** (Revisionism) and **Collective Functionalism** (Traditionalism).
      *   *Revisionism:* War is just aggregated self-defense. Morality of war = Morality of ordinary life scaled up.
      *   *Traditionalism:* War is a distinct social practice. Morality of war = Special rules generated by the practice itself to limit harm.
      *   *The "Permission" Ambiguity:*
          *   Revisionist: *Objective Moral Permission* (Does killing violate the victim's right to life?).
          *   Traditionalist: *Excusable/Non-punishable Permission* (Can we blame/punish the agent given the context?).
      *   *The "Epistemic" Clash:*
          *   Revisionist: Ignorance doesn't change liability facts, only blame.
          *   Traditionalist: Invincible ignorance *changes the normative situation* because it makes individual judgment impossible.

  6.  **Determine What Would Move the Needle:**
