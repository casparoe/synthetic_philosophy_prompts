  4.  **Develop a Sharper Diagnosis:**
      *   *Is it a verbal dispute?* "Permission" usually means "not violating rights" for Revisionists, but "not punishable/blameworthy" for Traditionalists. This is part of it, but not the whole story.
      *   *Is it two different questions?* Yes, effectively. "Is it metaphysically permissible?" vs. "Is it regulatively permissible?"
      *   *The Core Tension:* It's about **Moral Ontology vs. Moral Practice**.
