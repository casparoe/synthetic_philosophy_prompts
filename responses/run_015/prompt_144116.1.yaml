          *   **Weber's View:** **Mostly Accurate (with caveats).** Weber does argue values/ideas shape action. But "literally causal inputs" sounds mechanical. Weber is an interpretivist (Verstehen); he cares about *meaning*. It's not a law of physics; it's about how meaning guides action.

