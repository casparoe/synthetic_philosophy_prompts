answer: |-
  **The Mapping: The Process, Not the People**

  To make the Strange Inversion stick, you must identify the **tinkering-plus-selection process** as the competent-without-comprehending system, not the brothers themselves. The Wrights were cognitive agents, but their *method* was evolutionary. The wind tunnel generated variation (200 wing shapes); the balance test applied selection pressure (lift/drag ratio); the Flyer was the surviving phenotype. The brothers acted as the environment, not the designer in the rationalist sense. They did not derive the solution from first principles; they let the physical reality select the winner from a pool of candidates they could not theoretically distinguish in advance.

  Langley and the Smithsonian represent the pre-Darwinian intuition: that Comprehension (theory/authority) must precede Competence (flight). They failed because they tried to compute the world rather than select within it.

  **The Three Grasps: A Divergence**

  Your three-way split holds, but the allocation reveals the inversion sharply.

  1.  **Quantitative-predictive grasp:**
      *   **Langley:** Had high *illusory* grasp. He could compute lift using Smeaton's coefficient and standard tables. His math was internally consistent but externally unmoored.
      *   **Wrights (1903):** Had high *empirical* grasp, low *theoretical* grasp. They could predict lift using their own tables, but these were lookup maps derived from measurement, not equations derived from fluid dynamics. They knew *what* the number was, not *why* the number was that value from physics.
      *   **Verdict:** The grasps come apart. Langley had derivation without accuracy; Wrights had accuracy without derivation.

  2.  **Causal-handle grasp:**
      *   **Langley:** Low. He turned the "power" knob and the "tandem wing" knob. When it failed, he lacked the handle to fix it because his causal model (stability via pendulum effect) was wrong.
      *   **Wrights:** High. They turned the "aspect ratio" and "wing warping" knobs. They knew which way to turn them based on tunnel data, even if they couldn't write the differential equation describing the airflow.
      *   **Verdict:** Competence (Wrights) tracked with pragmatic causal handles, not theoretical ones.

  3.  **Justificatory grasp:**
      *   **Langley:** High. He could justify his design to the scientific community using the accepted lexicon of the day.
      *   **Wrights:** Low (initially). They could not satisfy the Smithsonian's demand for theoretical justification. Their justification was "it flies," which counts as existence proof, not scientific explanation.
      *   **Verdict:** This is the crux of the inversion. Justification (comprehension) lagged behind Competence (flight).

  **Addressing the Nags**

  *   **The Smeaton Coefficient Correction:** You argue this looks like comprehension arriving on schedule. I argue it is **measurement**, which is a tool of competence, not comprehension. Discovering a constant is wrong is an empirical observation, not a theoretical derivation. They didn't solve the Navier-Stokes equations to find the error; they weighed the force and saw the mismatch. This reinforces the inversion: reality corrected the theory, not theory correcting reality. It is the "blind" feedback of the environment correcting the map.

  *   **Theory Skipping Wind Tunnels:** You suggest later lift theory does forward work, implying comprehension isn't just a gloss. The Inversion doesn't claim comprehension is *useless*, only that it is *late*. The fact that modern CFD allows you to skip tunnels confirms that comprehension was built *on top of* the substrate of competence established by the Wrights. The theory explains the success of the selection process; it did not generate the success. The inversion stands: Competence (1903) $\rightarrow$ Comprehension (1920s+ aerodynamics).

  **Verdict on Fit and Cleaner Instances**

  This is a **strong but imperfect fit**. It is imperfect because the Wrights were not "mindless"; they intentionally designed the selection process. A pure Darwinian inversion requires the generator to be truly blind to the fitness landscape. The Wrights had local comprehension (bicycle mechanics, control) that guided the search, even if they lacked global comprehension (aerodynamics).

  A **cleaner instance** of the Strange Inversion today is **Deep Learning**.
  *   **Competence:** A neural net recognizes faces or translates languages better than humans.
  *   **Comprehension:** We lack justificatory grasp of *why* specific weights yield specific outputs. We have causal handles (hyperparameters) but not theoretical derivation of the internal logic.
  *   **Inversion:** The competence exists before the interpretability. We are in the "Wright Brothers" phase of AI: we can make it fly (perform), but the "Langley crowd" (interpretability researchers) are still struggling to write the theory that explains why the weights work, often trying to impose human-comprehensible structures on a system that found competence through blind optimization.

  The Wright episode is the historical bridge where engineering competence outpaced scientific comprehension, forcing the latter to catch up. It confirms the inversion: we fly first, understand later.
