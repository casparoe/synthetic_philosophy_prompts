answer: |-
  Based on Kessler's four precedents, her theory of **Indirect Normativity** hinges on the integrity of the *deliberative setup* rather than the direct moral quality of the act or its outcome. A norm is violated not because an action causes harm, but because the action bypassed or corrupted the process by which affected parties should ideally agree to that harm.

  Here is the breakdown of the blockade case under the three rules, the assessment of which rule fits Kessler best, and the decisive further case.

  ### 1. Verdicts on the Blockade Case

  **The Scenario:** Activists blockade a plant → blackouts in low-income area. Open forums held. Residents said "No." Activists proceeded anyway.

  *   **Consent-under-Parity (CuP): No Violation.**
      *   *Reasoning:* This rule relies on *hypothetical* or *idealized* consent, not necessarily actual consent (evidenced by Kessler's Carbon Tax precedent, where workers hated the tax but it was permissible). Under conditions of parity and full information, rational agents would presumably consent to climate action necessary for survival, even if it imposes local costs. The residents' actual "No" is treated as a failure of their current circumstances or information, not a veto under idealized parity.
  *   **Mirror-Rotation of Practical Identity (MRPI): Violation.**
      *   *Reasoning:* This rule asks if the activists can justify the action if they swap places with the sufferers *without* losing their practical identity. While the activists might argue climate survival is universal, imposing blackouts on a vulnerable population treats them as a *means* to the activists' moral ends. Unless the activists are willing to suffer identical blackouts in their own homes as a universal law, they fail the rotation. It violates the residents' status as co-legislators of the norm.
  *   **Procedural-Reflexivity (PR): Violation.**
      *   *Reasoning:* This rule focuses on whether the deliberative mechanism had the *capacity* to influence the outcome. Holding a forum where input is explicitly rejected renders the procedure non-reflexive (it is theater, not a feedback loop). Since the "No" did not trigger a revision or halt, the deliberative setup failed to function as a normative filter.

  ### 2. Which Rule Matches Kessler Best?

  **The Best Match: Procedural-Reflexivity (PR)**

  **Why:**
  Kessler's precedents consistently distinguish between *outcomes* and *process integrity*.
  *   **The Carbon Tax (No Violation):** The process was "full open debate." Even though the outcome hurt workers, the procedure was reflexive (debate shaped the law).
  *   **The Factory & Eminent Domain (Violations):** In both, the process was broken. The factory *hid data* (no input possible); the city denied *standing* (no input possible).
  *   **The Blockade:** This is the critical test. The activists mimicked the *form* of a process (forums) but lacked the *function* (responsiveness).

  If Kessler were following **Consent-under-Parity**, the Blockade might pass (like the Tax), but the lack of institutional authority makes "Parity" dubious compared to a legislature. If she were following **Mirror-Rotation**, the Psych Study might be harder to justify (deception violates identity), yet she called it fine.

  **Procedural-Reflexivity** is the only rule that captures the nuance of her "Indirect Normativity." It explains why the Tax was okay (process worked) but the Blockade is not (process was ignored). For Kessler, a norm bites when the *link* between deliberation and action is severed. In the Blockade, the link was severed; the deliberation was ornamental.

  ### 3. The Further Case That Separates Them

  To distinguish these three rules definitively, you need a case where **Consent** is present, **Identity** is respected, but **Procedure** is broken (or vice versa).

  **The Case: "The Retrospective Ratification"**

  > **Scenario:** A city mayor, facing an imminent flood, unilaterally orders the demolition of a row of historic homes to build a levee. She does this *without* prior consultation. After the flood is averted, she holds a town hall. The residents, grateful their neighborhood is safe, vote to ratify her action.

  *   **Consent-under-Parity:** **No Violation.**
      *   *Logic:* The residents ultimately consented. Under idealized conditions (knowing the flood risk), they *would* have consented beforehand. The outcome aligns with rational agreement.
  *   **Mirror-Rotation:** **No Violation.**
      *   *Logic:* The mayor protected the community's physical safety (foundation of identity). If residents swapped places with the mayor, they would likely make the same utilitarian calculation to save the neighborhood.
  *   **Procedural-Reflexivity:** **Violation.**
      *   *Logic:* The deliberation happened *after* the action. A reflexive procedure must be capable of *stopping* or *shaping* the action before it occurs. Because the decision was irreversible by the time the "deliberation" took place, the setup was non-reflexive.

  **Why this separates them:**
  This case isolates **Procedural-Reflexivity** as the strictest and most accurate proxy for Kessler's view. CuP and MRPI both look at the *substance* of the agreement or the *justification* of the act (both of which are satisfied in the Ratification case). Only PR looks at the *temporal mechanics* of the deliberation itself. Given Kessler's focus on the "deliberation setup" as the source of normativity, she would likely call this a **Violation**, confirming PR as her operating rule.
