  2. **Design the Stable Hybrid.** Don't just argue for balance; define the boundary. Rules for coordination/scalability; conscience for novelty/edge cases. The arbitrariness risk is high, but solving this is upstream of any institutional design. If you can't demarcate domains, the hybrid collapses.

  3. **Failure Mode Correction.** Bureaucratic overreach is the harder fix. Chaos self-corrects via demand for order; rigidity destroys the very conscience needed to dismantle it.

  **Ordering Defense:** Fatigue is the diagnostic prerequisite. Hybrid is the prescription. Failure mode is the prognosis. You can't design a solution without confirming the mechanism of breakdown.

