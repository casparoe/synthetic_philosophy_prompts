  ### Residue Report: Where the Mapping Collapses

  **1. Physical Completeness vs. Parametric Mastery**
  *   **Jackson's Claim:** Mary knows all physical facts.
  *   **ML Analog:** The model possesses weights $W$ that perfectly encode the causal graph of color vision.
  *   **The Break:** In ML, if $W$ is complete, the model can *simulate* the activation pattern for "red" internally (e.g., via generative recall or latent space traversal) without external input. If the model can generate $A_{red}$ from $W$ alone, then "seeing red" (external inference) adds no new information.
  *   **Distortion:** To make the argument work, we must artificially constrain the model: it must have $W$ but be *unable* to run the forward pass for red until the input arrives. This contradicts the definition of a deterministic neural network. If $W$ is known, the output is known. Jackson relies on the intuition that knowing the *physics* of the output is not the same as *generating* the output. In ML, these are computationally identical.

  **2. The Epistemic Gap vs. Instantiation**
  *   **Jackson's Claim:** Upon seeing red, Mary learns a new fact (what it is like).
  *   **ML Analog:** Upon processing $x_{red}$, the system enters state $A_{red}$.
  *   **The Break:** Does the system "learn" anything? In inference mode, weights do not update. No gradient flows. The system's "knowledge" (parameters) remains static. The only change is the transient buffer state.
  *   **Distortion:** To claim the system "learns something new," we must conflate *state* with *knowledge*. In ML, a new activation is not new knowledge; it is merely new data in the pipeline. If we claim it *is* new knowledge, we are smuggling in a notion of "experience" that ML does not possess. The gap exists in Jackson's argument because human consciousness distinguishes between *propositional knowledge* (weights) and *phenomenal knowledge* (experience). ML has only propositional knowledge implemented as physical state. The gap vanishes.

  **3. Anti-Physicalist Conclusion vs. Computational Closure**
  *   **Jackson's Claim:** Therefore, physicalism is false (there are non-physical facts).
