  **Order**
  1. **Derivation Flail (10 mins):** Distribute sheets. Task: Reach `AAA`. No hints. *Dependency:* Creates the visceral frustration required to accept impossibility later. Without this struggle, the meta-solution feels like a trick rather than a necessity. They must exhaust the internal logic first.
  2. **The Wall (5 mins):** Halt. Poll confidence. Ask: "Is this hard, or broken?" *Dependency:* Requires prior failure to shift mindset from effort to structure. You need them to feel the ceiling before offering a ladder. This validates their struggle as data.
  3. **The Analogy (5 mins):** Present the Bishop/Chessboard. *Dependency:* Needs the "Wall" feeling to make the analogy land as a solution, not just a story. It bridges the gap between string manipulation and property analysis. Visuals bypass the algebraic fear.
  4. **Invariant Hunt (10 mins):** Prompt: "Count the X's. What happens?" *Dependency:* Analogy provides the conceptual lens to see the count as a property. They must apply the lens to the specific rules to find the invariant. This is the actual JOOTS moment.
  5. **Meta-Discussion (10 mins):** Confirm impossibility. Define JOOTSing. *Dependency:* Requires the invariant discovery to validate the meta-concept. The proof confirms the feeling, turning frustration into insight. Connect back to real-life systems. Timekeeping is strict.

  **The carrying example**
  Use the Bishop on a Chessboard. A bishop starts on a white square. Every move keeps it on white. No matter how complex the path, it never reaches black. This analogy must have *visual simplicity* (everyone sees colors) and *absolute constraint* (no exceptions). It must not have *complex math*; avoid coordinates. It mirrors the string: the "color" is the count of X's modulo 3. It shifts focus from "where am I going" to "what ground am I standing on."

  **Misconception map**
  1. **"Try Harder"**: Killed in **The Wall**. Explicitly state effort is irrelevant if the path doesn't exist.
  2. **"Letters Mean Things"**: Killed in **Derivation Flail**. Emphasize these are shapes, not words. Semantics distract from syntax.
  3. **"Computer Could Solve It"**: Killed in **Invariant Hunt**. Explain infinity vs. property. A computer searches forever; a mathematician checks the invariant. Search cannot prove negatives.
  4. **"Rules are Unfair"**: Killed in **Meta-Discussion**. The rules are consistent; the goal is incompatible. Blaming the rules misses the structural insight.
  5. **"You Hid a Trick"**: Killed in **Derivation Flail**. Write rules visibly. Trust is required for the meta-lesson. If they suspect hidden rules, they won't look for invariants.
  6. **"It's Just Hard"**: Killed in **Meta-Discussion**. Distinguish difficulty from impossibility. Hard problems yield; impossible ones do not. This distinction is the core lesson.

  **The check**
  Change Rule 3: `XX` becomes `A`. Ask: "Does our proof survive?"
  *Right Answer:* "No. The invariant breaks. 1 X can become 2 X, then 0 X. `AAA` is now possible." This shows mechanistic understanding. They see the dependency between the rule and the invariant.
  *Wrong Answer:* "Yes, it's still impossible because I still can't find it." This shows they missed the meta-point. They treat proof as guesswork.

  **What I leave out**
  I will refuse to explain modular arithmetic formally. Do not write "$n \equiv 1 \pmod 3$". Say "groups of three" instead. I will not explain Gödel or formal system theory. Keep it grounded in counting X's. If they ask why mod 3, say "because Rule 3 removes three." Formalism kills the intuition.

  **Tell my co-host**
  Telling them "look for invariants" in minute two costs the learning experience. They must feel the system's ceiling before looking for the ladder. If you give the tool before the problem feels impossible, they won't understand *why* it's necessary. The frustration is the fuel. Let them flail.
