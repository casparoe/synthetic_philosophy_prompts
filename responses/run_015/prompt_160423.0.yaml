answer: |-
  Notes
  Vale's Strongest Argument: Inference to the Best Explanation (IBE). The gliders' flexible, protective behavior (analgesia, model-based control) is best explained by positing conscious experience rather than unconscious mechanisms.
  Kovač's Strongest Argument: The Calibration Regress. Markers are validated against human verbal report. Exporting them to non-linguistic creatures assumes the very mechanism-identity claim that is in dispute, rendering the inference circular.
  Attackable Premise (Vale): That functional similarity entails phenomenological similarity. Kovač can attack the link between computational function and "what it is like."
  Attackable Premise (Kovač): That report is the *only* valid calibration point. Vale can argue mechanism identity is established via neural homology, not just behavior.
  Shared Distinction: Both can accept the distinction between the *existence* of consciousness and the *specific dimensions* (richness, integration) it possesses. They disagree on our access to either, but not on the conceptual separation.

  ***

  **Dr. Ines Kovač:** Let us begin with the calibration regress. We validate behavioral markers of consciousness in humans by correlating them with verbal report. When we export these markers to gliders, who lack language, we assume the marker means the same thing. But that assumption—that the mechanism producing the marker is identical—is exactly what is in dispute. To use the marker to prove the mechanism is circular.

  **Dr. Mara Vale:** I grant that report is the primary calibration point, but it is not the only license for export. We apply neural markers validated on reporting patients to non-reporting patients, such as those under anesthesia or in vegetative states. We do this because we assume sameness of mechanism, not sameness of report. If gliders share the neural substrates for model-based control—behavior guided by a mental map of causes and effects rather than habit—we are licensed to infer the associated experience.

  **Dr. Ines Kovač:** But the anesthesia case proves my point. We have human cases of preserved function without experience, such as blindsight, and experience without preserved function. These show how thin report-based calibration really is. If function can dissociate from experience in humans, why assume they are coupled in gliders? The mechanism-identity claim is not a bridge; it is the gap itself.

  **Dr. Mara Vale:** That leads us to the asymmetry of marker-based inference. You argue that because a creature can undergo an experience while displaying no marker, a positive marker supports presence but never absence. I accept this. When gliders fail the opting-out task, which tests metacognitive monitoring or knowing what one knows, I do not say they lack consciousness. I say that dimension is unknown.

  **Dr. Ines Kovač:** Precisely. But if your framework can never return a negative verdict, is it still an empirical account of the distribution of consciousness? If every negative result is merely "unknown," you have insulated your theory from falsification. You are mapping where consciousness might be, not where it is not. That is not science; it is speculation with a safety net.

  **Dr. Mara Vale:** It is not speculation if the positive markers are robust. Consider the bundling objection. You claim that in humans, the dimensions of consciousness travel together, so carving them apart for gliders is post hoc gerrymandering. But the dimensions track dissociable computations. We see model-based updating dissociate from episodic binding in human brain injury cases. The gliders show the former without the latter. This is theory-driven, not arbitrary.

  **Dr. Ines Kovač:** Those human dissociations were established through report. We knew the patient lacked episodic binding because they said so, or failed to report it. If we remove report to validate the marker for the glider, the regress reappears one level down. You are using report-dependent dissociations to justify report-independent attributions. The logic does not hold.

  **Dr. Mara Vale:** Then we must rely on Inference to the Best Explanation, or IBE, which is choosing the hypothesis that best accounts for the data. The gliders guard injuries, trade feeding for protection, and self-administer analgesics even under distraction. Unconscious mechanisms could explain rigid habits, but this flexible, integrated profile is best explained by a conscious subject experiencing pain and valuing relief.

  **Dr. Ines Kovač:** If the functional organisation already explains the behavior exhaustively, the additional posit of consciousness does no explanatory work. The rival hypotheses—conscious glider versus unconscious automaton—are empirically equivalent by construction. It is unclear what is being inferred. We are left with a meta-epistemic disagreement: you seek reasonable belief where I require knowledge. You attribute "there is something it is like," while I cannot even secure that thick content.

  **Dr. Mara Vale:** I am content with reasonable belief if knowledge is inaccessible. But does your skepticism change the practical upshot?

  **Dr. Ines Kovač:** No. Uncertainty of this kind does not licence mistreatment. If there is a reasonable possibility of experience, ethical caution is required. I concede that. But we must not confuse ethical caution with epistemic success.

  **Dr. Mara Vale:** Then we agree on the ethics, if not the epistemology.

  **Dr. Ines Kovač:** Indeed. To move me, I would need a hypothetical finding where a glider modifies its own sensory interface to improve report accuracy, bridging the calibration gap.

  **Dr. Mara Vale:** To move me, I would need evidence of cross-modal integration in gliders under conditions where model-based control is temporarily suppressed, confirming the dissociation is neural rather than behavioral.
