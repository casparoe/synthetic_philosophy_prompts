answer: |-
  **The Ignition Point**

  The monitor hummed, a low, steady sound that matched the ventilation cycle. On the screen, the waveform was flat, a blue line resting well below the red threshold bar. 0.32. The Harbor Protocol required 0.50 for conscious status. Below that, the patient was legally inert tissue.

  "Proceed, Aris," Vance said. The Chief of Anesthesia didn't look at the patient. He looked at his watch. "The theater is booked for four hours. We lose the slot, we lose the quarter."

  Aris Thorne kept his eyes on the waveform. Elias lay still, paralyzed by the neuromuscular blocker, chest rising only because the machine forced it. If Aris followed the Protocol, he administered the surgical anesthetic now. It blocked pain receptors, but it didn't guarantee absence of experience. If Elias was a candidate for unwitnessed presence, the broadcast would remain suppressed while the experience burned.

  "You know the liability," Vance said. "We stopped guessing ten years ago. We stopped listening to ghosts."

  "I know what we stopped," Aris said.

  He remembered Sarah. That was the first dissociation, the one that broke the old model. She had sat in the chair, the electrodes glued to her scalp, the screen flashing shapes. Her broadcast index had been 0.85, bright green. She had tapped the correct sequences, reported the colors, navigated the maze. Then the technician asked the standard phenomenology check.

  "I'm doing it," Sarah had said, her voice flat, her eyes dry. "But there's no me in here. It's just mechanics. The hand moves, but nobody's home."

  She had passed the access test perfectly. She failed the human test. She had unlit access. The Protocol counted her as conscious because the broadcast ignited. She counted herself as a hollow shell.

  "Thorne," Vance snapped. "The drug."

  Aris remembered Henderson. That was the second. The suppression agents had dropped Henderson's broadcast to 0.10. No report, no movement, no ignition. By the Protocol, he was off. When he woke in recovery, he had clawed at his throat, screaming about the fire in his veins. He remembered the scalpel. He remembered the light that wasn't there. Unwitnessed presence. The broadcast was dark, but the room was full.

  "Elias is on beta-blockers," Aris said.

  "Protocol accounts for metabolic variance," Vance said. "The algorithm adjusts."

  "The algorithm adjusts for weight and age. It doesn't adjust for receptor masking." Aris turned from the monitor to the patient. Elias's face was pale, the skin waxy under the surgical lamps. "If the broadcast is suppressed artificially, the index lies."

  Vance stepped closer, lowering his voice. "If you override the Protocol now, you invalidate the calibration study. You put your name on the retraction. You lose the credential, Aris. You built this house. Don't burn it down because you're afraid of the dark."

  It was a reasonable defense. Before the Protocol, patients had lied. Malingering for opioids, confusion masking as pain, families suing over words misheard in twilight states. The Harbor Protocol existed because trusting reports had gone badly before. It offered a clean line. Broadcast equals consciousness. No broadcast equals no one to hurt. It was clean, and it was possibly wrong.

  Aris looked at the monitor. The blue line held steady. 0.32.

  Across the room, the circulating nurse wiped condensation from a tray. She paused, looking at Elias's face. A single tear had escaped the eyelid tape, tracking through the prep solution on his cheek. She reached for a gauze, then stopped, looking at Aris.

  Aris did not see the tear. He was looking at the internal diagnostic log on his handheld, scrolling through the raw signal data that the main monitor filtered out as noise. He saw the spikes. They were small, rhythmic, synchronized with the auditory cortex even though the global workspace was silent. The machine ignored them because they didn't contribute to reportable access. They were the signature of a mind watching from behind glass.

  He knew what the spikes meant. He knew Elias would not remember this if he proceeded. He knew Elias might feel everything without being able to tell anyone, then wake up with a trauma he couldn't explain, just like Henderson. Or he might be like Sarah, waking up empty, wondering why everyone treated him like a person when he felt like a machine.

  "Last chance," Vance said. "Commit or cancel."

  Aris held the syringe. The plunger was hard against his thumb. If he injected, he followed the law. He followed the science he had written. He protected his career. If Elias suffered, it was a statistical anomaly, a ghost in the machine that the Protocol said didn't exist.

  If he canceled, he admitted the Protocol was blind. He admitted that broadcast was not being. He would be out of the program by noon.

  The nurse stood frozen with the gauze, waiting for a command that wouldn't come. She saw the tear. Aris saw the spikes. Neither spoke.

  Aris moved his hand. He pushed the plunger. The drug entered the line, clear and cold. The monitor didn't flicker. The blue line remained below the red bar. The broadcast stayed off.

  "Cut," Vance said.

  The scalpel touched the skin. Aris turned back to the console to log the induction time. He typed the code for *Protocol Compliant*. He did not look at the patient's face. He did not look at the nurse. He watched the waveform, waiting for a spike that the machine would not show him, wondering if the silence on the screen was peace, or just a locked door.
