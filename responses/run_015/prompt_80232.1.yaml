prompt: |-
  I'm writing a paper on fakes and originals, and before I compare theories I want the standard of evaluation fixed. Write the desiderata for an adequate account of why originals matter: the cases it must handle (a perfect physical copy, an original whose maker is unknown, a forgery that later becomes famous in its own right, a digital object where the designation of an original file is arbitrary, a historical document and an exact facsimile), the distinctions it must keep separate (being made by a particular person, being the first instance, having an unbroken causal history, being certified by institutions, being beautiful or evidentially useful), and the constraints it cannot ignore (some copies are valued, some originals are worthless, markets can reward fakes, and authenticity can matter more than quality). Give the reason or motivating case behind each requirement, mark which are non-negotiable and which are contestable, and flag any pair that seems jointly unsatisfiable. Then briefly score causal-historical, institutional, and functional-pragmatic accounts against the list. Finally, say how confident you are in the list itself and identify the single requirement you are least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Desiderata for an adequate account of why originals matter (fakes vs. originals).
      *   **Components:**
          1.  Cases to handle (5 specific ones provided).
          2.  Distinctions to keep separate (5 specific ones provided).
          3.  Constraints to not ignore (4 specific ones provided).
          4.  For each requirement: Reason/motivating case, Status (Non-negotiable/Contestable).
          5.  Flag jointly unsatisfiable pairs.
          6.  Score three theories (Causal-Historical, Institutional, Functional-Pragmatic) against the list.
          7.  Confidence level in the list.
          8.  Identify the least sure requirement.
      *   **Goal:** Fix the standard of evaluation *before* comparing theories.
      *   **Tone:** Academic, precise, analytical.

  2.  **Drafting the Desiderata (Categorization & Elaboration):**

      *   *Cases:*
          1.  Perfect Physical Copy (e.g., Indiscernible Duplicate).
          2.  Anonymous Original (Maker unknown).
          3.  Famous Forgery (e.g., Van Meegeren).
          4.  Digital Object (Arbitrary original file).
          5.  Historical Document vs. Facsimile.
      *   *Distinctions:*
          1.  Authorship (Made by X).
          2.  Priority (First instance).
          3.  Provenance (Unbroken causal history).
          4.  Certification (Institutional stamp).
          5.  Aesthetic/Evidential Value (Beauty/Utility).
      *   *Constraints:*
          1.  Copies can be valued.
          2.  Originals can be worthless.
          3.  Markets reward fakes.
          4.  Authenticity > Quality.

      *   *Refining into "Desiderata":* I need to turn these inputs into normative requirements for a theory.
      *   *Status:* Most philosophical criteria are contestable, but some are foundational to the phenomenon. I need to be careful labeling things "Non-negotiable." Usually, "Non-negotiable" means "If a theory fails this, it doesn't address the phenomenon we care about." "Contestable" means "Reasonable philosophers might weigh this differently."
      *   *Unsatisfiable Pairs:* This is the tricky part. Where do tensions lie? Usually between "Market Value" and "Ontological Status," or "Aesthetic Value" and "Authenticity."

  3.  **Developing the Content (Iterative Process):**

      *   *Requirement 1 (Cases):* A theory must explain the value differential (or lack thereof) in the 5 cases.
      *   *Requirement 2 (Distinctions):* A theory must not conflate the 5 distinctions.
      *   *Requirement 3 (Constraints):* A theory must accommodate the 4 empirical realities.

      *   *Let's structure this as a unified list of Desiderata derived from the inputs.*
      *   *D1: The Indiscernibility Constraint.* (From Perfect Copy).
      *   *D2: The Authorship Independence Constraint.* (From Anonymous Original).
      *   *D3: The Retrospective Value Constraint.* (From Famous Forgery).
      *   *D4: The Digital Instantiation Constraint.* (From Digital Object).
      *   *D5: The Evidential Weight Constraint.* (From Document vs. Facsimile).
      *   *D6: The Conceptual Separation Constraint.* (From Distinctions).
      *   *D7: The Value Variance Constraint.* (From Constraints: copies valued, originals worthless).
      *   *D8: The Market/Authenticity Decoupling Constraint.* (From Markets reward fakes, Authenticity > Quality).

      *   *Wait, the prompt asks to write the desiderata based on the provided lists.* I should organize them clearly under the headings provided in the prompt (Cases, Distinctions, Constraints) but formulate them as requirements for the theory.

      *   *Refining "Non-negotiable" vs. "Contestable":*
          *   Non-negotiable: If a theory says a perfect copy *is* the original in all respects, it fails the "originals matter" prompt. If it says markets *shouldn't* exist, it fails descriptiveness.
          *   Contestable: Whether digital originals *really* exist or just seem arbitrary. Whether a famous forgery *should* be valued as art or as a curiosity.

      *   *Identifying Tensions (Jointly Unsatisfiable):*
          *   Tension between "Authenticity > Quality" and "Copies are Valued." If a copy is better quality, why does authenticity win? But sometimes copies *are* valued (prints).
          *   Stronger tension: "Institutional Certification" vs. "Unbroken Causal History." If an institution certifies a fake as real (error), does it become real? (Institutional says yes, Causal says no).
          *   Another tension: "Digital Arbitrary Original" vs. "First Instance." In digital, the first instance often doesn't matter, but the "original file" is often arbitrary.
          *   *Best Candidate:* The tension between **Market Reality** (Markets reward fakes) and **Normative Authenticity** (Authenticity matters more than quality). If the market rewards fakes, does authenticity actually matter? Or does the theory need to explain why the market is *wrong*?
          *   *Actually, the prompt asks to flag pairs that seem jointly unsatisfiable.* This implies a logical conflict within the desiderata themselves.
          *   *Conflict:* "Copies are valued" vs. "Authenticity can matter more than quality." If a copy is perfect (quality equal) and valued, does authenticity matter?
          *   *Better Conflict:* "Being the first instance" vs. "Digital object where designation is arbitrary." In digital, "first instance" is often technically definable but ontologically irrelevant.
          *   *Best Conflict:* **Institutional Certification vs. Unbroken Causal History.** If an institution certifies a forgery as real (due to error), a Causal theory says it's fake, an Institutional theory says it's real. A theory satisfying *both* distinctions as definitive criteria for "originality" faces a contradiction when they diverge.

  4.  **Scoring the Theories:**
      *   *Causal-Historical (Goodman/Wollheim style):* Strong on provenance, weak on digital, weak on famous forgeries (why do we like them if they lack the right history?).
      *   *Institutional (Dickie/Danto style):* Strong on certification, weak on anonymous originals (who conferred status?), weak on "markets reward fakes" (if the institution hasn't caught them yet).
      *   *Functional-Pragmatic (Use-based):* Strong on documents/facsimiles (if it works, it's fine), weak on "Authenticity > Quality" (why care about the original if the copy works?).

  5.  **Confidence & Least Sure:**
      *   Confidence: High on the structure, moderate on the specific weighting.
      *   Least Sure: The "Digital Object" constraint. It might be a category error to apply "original/fake" to digital files in the same way as physical art.

  6.  **Review and Refine:**
