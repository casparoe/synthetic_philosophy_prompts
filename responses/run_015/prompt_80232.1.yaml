          *   Reason/Case for each? Yes.
          *   Non-negotiable/Contestable marked? Yes.
          *   Jointly unsatisfiable pairs flagged? Yes.
          *   Score 3 theories? Yes.
          *   Confidence level? Yes.
          *   Least sure requirement? Yes.

      *   *Self-Correction on "Jointly Unsatisfiable":* I need to be careful. Desiderata are goals. If two goals are logically incompatible, the list is broken. I should frame it as a *tension* that a theory must navigate, or identify if two specific requirements create a paradox.
      *   *Idea:* The requirement that "Distinctions must be kept separate" vs "Markets can reward fakes." If the market treats a fake as an original (rewards it), is the theory describing the market or the ontology?
      *   *Let's go with the Causal vs. Institutional tension.* If a theory requires *both* "Unbroken Causal History" and "Institutional Certification" as necessary conditions for originality, they are jointly unsatisfiable in cases of institutional error. I will flag this as a potential conflict in the *application* of the distinctions.
      *   *Actually, looking closer at the prompt:* "Flag any pair [of requirements] that seems jointly unsatisfiable."
      *   *Pair:* "Copies are valued" (Constraint) vs. "Authenticity can matter more than quality" (Constraint). If a copy is perfect (quality = original) and valued, authenticity shouldn't matter. But if authenticity matters *more*, the copy shouldn't be valued equally. This is the "Perfect Copy Paradox." I will flag this.

  7.  **Final Polish:** Ensure the tone is appropriate for a paper preamble. Clear headings. Concise scoring.

      *(Self-Correction during drafting)*: Make sure I explicitly use the examples provided in the prompt (Van Meegeren, digital files, etc.) in the "Reason/Case" sections.

      *(Refining the Scoring)*: Keep it brief but substantive. Use a simple scale (Pass/Fail/Partial) or Low/Med/High. Let's use Low/Med/High for nuance.

      *(Refining Confidence)*: Be honest. Philosophical lists are always contestable.

      *(Refining Least Sure)*: The Digital constraint is the most volatile because technology changes the ontology.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Desiderata for an Adequate Account of Originality

  To evaluate competing theories of originals and fakes, the following desiderata establish the standard of adequacy. They are derived from the empirical phenomena of art, history, and commerce. Each requirement includes a motivating case, a status designation (Non-negotiable vs. Contestable), and flags where logical tensions arise.

  ## I. Case Coverage Requirements
  *An adequate theory must explain the status and value attribution in the following scenarios.*

  **1. The Indiscernible Duplicate Constraint**
  *   **Requirement:** The account must explain why a perfect physical copy is ontologically or normatively distinct from the original, despite sensory identity.
  *   **Motivating Case:** Two canvases look identical; one is by Rembrandt, one is a 2024 forgery. We value the former significantly higher.
  *   **Status:** **Non-negotiable.** If a theory cannot distinguish these, it dissolves the concept of "original."
  *   **Tension Flag:** Jointly unsatisfiable with **Requirement 7 (Copies are Valued)** if the theory relies *solely* on perceptual qualities to determine value.

  **2. The Anonymous Provenance Constraint**
  *   **Requirement:** The account must allow for an object to be an "original" even if the specific maker is unknown.
  *   **Motivating Case:** Ancient artifacts (e.g., *The Venus of Willendorf*) are originals despite the artist's identity being lost to history.
  *   **Status:** **Non-negotiable.** Authorship is not a necessary condition for originality.

  **3. The Retrospective Revaluation Constraint**
  *   **Requirement:** The account must explain how a known forgery can acquire value as an object in its own right, distinct from the original it mimicked.
  *   **Motivating Case:** Han van Meegeren's *Supper at Emmaus* was a fake Vermeer, but is now a valuable historical artifact of deception.
  *   **Status:** **Contestable.** Some argue it remains a "failed fake," but market reality suggests it becomes a "successful fake."

  **4. The Digital Instantiation Constraint**
  *   **Requirement:** The account must address cases where the designation of an "original file" is technically arbitrary or functionally irrelevant.
  *   **Motivating Case:** A digital image copied bit-for-bit; the "original" .png on the hard drive is ontologically identical to the "copy."
  *   **Status:** **Contestable.** It is debatable whether digital objects possess "originals" in the traditional sense or if the category dissolves.

  **5. The Evidential Weight Constraint**
  *   **Requirement:** The account must distinguish between the informational content of a document and the evidential value of the physical substrate.
  *   **Motivating Case:** A facsimile of the *Magna Carta* contains the same text, but only the parchment original serves as legal/historical proof of the 1215 sealing.
  *   **Status:** **Non-negotiable.** Historical practice treats the substrate as evidence.

  ## II. Conceptual Distinction Requirements
  *An adequate theory must not conflate the following distinct properties.*

  **6. The Genealogy vs. Priority Distinction**
  *   **Requirement:** The theory must separate "being made by a particular person" from "being the first instance."
  *   **Motivating Case:** An artist's second cast of a sculpture (made by them) vs. a posthumous cast (first instance of a new mold).
  *   **Status:** **Non-negotiable.** Conflation leads to errors in copyright and attribution.

  **7. The Causal vs. Institutional Distinction**
  *   **Requirement:** The theory must separate "having an unbroken causal history" from "being certified by institutions."
  *   **Motivating Case:** A genuine artifact lacking paperwork (causal yes, institutional no) vs. a fake with forged papers (causal no, institutional yes).
  *   **Status:** **Non-negotiable.**
  *   **Tension Flag:** **Jointly Unsatisfiable Pair:** If a theory demands *both* Causal History and Institutional Certification as *necessary* conditions for originality, they conflict in cases of institutional error (e.g., a museum authenticates a fake). A theory must prioritize one or allow for divergence.

  **8. The Aesthetic vs. Ontological Distinction**
  *   **Requirement:** The theory must separate "being beautiful or evidentially useful" from "being authentic."
  *   **Motivating Case:** A beautiful forgery vs. a damaged original.
  *   **Status:** **Non-negotiable.** This is the core of the "fake" problem.

  ## III. Empirical Constraint Requirements
  *An adequate theory must accommodate the following realities of valuation.*

  **9. The Value Variance Constraint**
  *   **Requirement:** The account must allow that some copies are highly valued and some originals are worthless.
  *   **Motivating Case:** Limited edition prints (copies) vs. a rotting, original sketch by an unknown amateur.
  *   **Status:** **Non-negotiable.** Originality does not guarantee value.

  **10. The Market/Authenticity Decoupling Constraint**
  *   **Requirement:** The account must explain how markets can reward fakes (temporarily) while maintaining that authenticity matters more than quality (normatively).
  *   **Motivating Case:** A fake sold for millions (Market reward) vs. the crash in value once exposed (Authenticity > Quality).
  *   **Status:** **Contestable.** This requires a theory to distinguish between *price* and *value*.
  *   **Tension Flag:** **Jointly Unsatisfiable Pair:** This conflicts with **Requirement 1 (Indiscernible Duplicate)** if value is defined purely by market price. If the market rewards the fake, and the fake is indiscernible, the "original" has no premium until exposure.

  ---

  ## Theoretical Scorecard

  | Requirement | Causal-Historical Account | Institutional Account | Functional-Pragmatic Account |
  | :--- | :--- | :--- | :--- |
  | **1. Indiscernible Duplicate** | **High.** Distinguishes via history of production. | **Med.** Depends on status conferral, which may lag. | **Low.** If function is identical, distinction vanishes. |
  | **2. Anonymous Provenance** | **Med.** Requires causal chain, but not named agent. | **Low.** Requires an institution to confer status. | **High.** Function exists regardless of author. |
  | **3. Retrospective Revaluation** | **Low.** A fake remains causally tainted. | **Med.** Institution can re-certify as "historic fake." | **High.** New function (example of deception) creates value. |
  | **4. Digital Instantiation** | **Low.** Causal history is trivial/copy-paste. | **Med.** Depends on NFT/Registry certification. | **High.** Focuses on access/utility, not file origin. |
  | **5. Evidential Weight** | **High.** Physical chain of custody is paramount. | **Med.** Archive certification suffices. | **Low.** If text is legible, substrate matters less. |
  | **6. Genealogy vs. Priority** | **High.** Clearly tracks production events. | **Med.** Institutions may conflate for convenience. | **Low.** Focuses on current utility. |
  | **7. Causal vs. Institutional** | **High.** Prioritizes Causal; flags Institutional error. | **High.** Prioritizes Institutional; Causal is secondary. | **Low.** Often conflates based on utility. |
  | **8. Aesthetic vs. Ontological** | **High.** Authenticity is independent of quality. | **High.** Status is independent of beauty. | **Low.** Value is often tied to function/quality. |
  | **9. Value Variance** | **Med.** Explains worthlessness, struggles with valued copies. | **Med.** Explains valued copies (editions), struggles with worthless originals. | **High.** Value is purely functional/contextual. |
  | **10. Market/Authenticity** | **High.** Market is wrong until truth revealed. | **Med.** Market follows Institutional lead. | **Low.** Market price *is* a functional metric. |

  **Summary:**
  *   **Causal-Historical:** Best for art/history ontology, struggles with digital and revalued fakes.
  *   **Institutional:** Best for market dynamics and digital (NFTs), struggles with anonymous objects and institutional error.
  *   **Functional-Pragmatic:** Best for digital and documents, fails to capture the normative "punch" of authenticity in art.

  ---

  ## Meta-Evaluation of the Desiderata

  **Confidence Level:** **Moderate-High.**
  The list successfully captures the major tensions in the literature (Goodman, Danto, Dickie) and contemporary issues (digital assets). It provides a robust grid for testing theories. However, the weighting of "Non-negotiable" items assumes a realist stance on authenticity that some postmodern frameworks might reject entirely.

  **Least Sure Requirement:** **Requirement 4 (The Digital Instantiation Constraint).**
  I am least confident that "originality" in digital objects is a coherent concept that *needs* saving. It is possible that applying the original/fake dichotomy to bit-identical digital files is a category error. If the ontology of digital objects is fundamentally different from physical objects, a single unified theory covering both may be impossible, rendering this desideratum a trap rather than a standard. A theory might be adequate precisely by arguing that digital objects *have no originals*, which technically "fails" this constraint but might be the correct philosophical move.
