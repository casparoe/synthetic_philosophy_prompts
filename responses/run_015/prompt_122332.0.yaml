answer: |-
  # Project Proposal: Liability and Entry
  **Working Title:** The Causal Footprint of Displacement: Normative Foundations for Liability-Based Admission Duties

  **Project Duration:** 6 Months (Part-Time)
  **Primary Output:** Monograph-length manuscript (approx. 40,000 words) + Policy Framework Brief

  ### 1. The Research Question
  Standard debates in migration ethics oscillate between state sovereignty (the right to exclude) and cosmopolitanism (the right to enter). Both tend to treat the *cause* of displacement as secondary to the *fact* of displacement. This project asks a more specific normative question:

  *To what extent does a state's causal contribution to displacement-generating conditions (via emissions, arms exports, or economic policy) generate a specific, enforceable duty to admit members of the affected populations, distinct from general humanitarian obligations?*

  Sub-questions include:
  1.  Does the "causal footprint" create a stronger duty of *admission* specifically, or only a duty of *aid*?
  2.  Does the normative force of the footprint differ between climate-induced displacement (diffuse causality) and political persecution (direct causality via arms/trade)?
  3.  Is "causal footprint" a distinct ethical category, or merely a subset of corrective justice that collapses under scrutiny?

  ### 2. Context and Gap
  Current philosophical literature largely frames refugee obligations through two lenses:
  *   **Humanitarianism:** Obligations arise from urgent need, regardless of cause. (Critique: Overloads states with no historical link to the crisis.)
  *   **Cosmopolitanism:** Obligations arise from global equality or open borders. (Critique: Politically non-starters; ignores specific historical responsibility.)

  Neither framework adequately addresses the intuition that states bear *special* responsibility for crises they helped engineer. While "historical responsibility" is discussed in climate ethics, it has not been rigorously mapped onto *admission policy* for asylum seekers. This project fills that gap by moving from "who is in need?" to "who is liable?"

  ### 3. Methodology
  This is a project of non-ideal political philosophy and conceptual analysis. It requires no empirical fieldwork or data collection.
  *   **Conceptual Mapping:** I will distinguish "causal footprint" from standard models of corrective justice. I will analyze whether "footprint" implies a duty to *restore the status quo ante* (which admission might do) or merely to *compensate* (which aid might do).
  *   **Comparative Case Analysis:** I will construct two detailed normative case studies to test the limits of the footprint theory:
      1.  **Direct Causality:** A state exporting arms used in civil war (e.g., specific arms sales contributing to persecution).
      2.  **Diffuse Causality:** A state's carbon emissions contributing to sea-level rise (e.g., Pacific Islander displacement).
  *   **Objection Handling:** I will systematically test the theory against counter-arguments regarding capacity, democratic self-determination, and the epistemic difficulty of tracing causation.

  ### 4. Deliverables and Policy Relevance
  Philosophical grants often produce papers read only by philosophers. This project aims for utility for legal theorists and policy architects.
  1.  **The Manuscript:** A rigorous philosophical defense (or critique) of liability-based admission.
  2.  **The "Liability Matrix" (Policy Brief):** A conceptual tool for policymakers. Rather than prescribing quotas, this matrix outlines how causal responsibility *ought* to weight admission decisions when competing with other factors (capacity, integration potential). It provides the normative vocabulary for advocates arguing that specific states should take specific refugees based on liability, not just charity.

  ### 5. Risk Assessment and Failure Conditions
  **Feasibility:** The scope is limited to conceptual work, making it viable for a six-month part-time timeline. The risk lies not in data collection but in argumentative collapse.

  **Definition of Failure:**
  *   **Conceptual Collapse:** If I demonstrate that "causal footprint" is indistinguishable from general corrective justice *and* that corrective justice does not support a right to *entry* (only financial compensation), the project fails to establish a new framework for admission policy.
  *   **Non-Action-Guiding:** If the analysis concludes that causal links are too epistemically murky to ever be used in policy (i.e., we can never know enough to assign liability), the project yields a negative result. While philosophically interesting, it would fail to meet the goal of informing admission policy.

  **Mitigation:** I will treat the "negative result" (that footprint doesn't ground admission duties) as a valid outcome, provided the reasoning clarifies *why* other grounds (e.g., capacity) must be used instead.

  ***

  # Critical Analysis & Strategic Advice (For Applicant Only)

  *This section is not for the grant application. It is an honest assessment of the philosophical vulnerabilities in your framing, as requested.*

  ### 1. What would change my mind about using "Causal Footprint" as the central frame?
  The strongest argument against this frame is the **"Remedy Mismatch" Objection**.
  *   **The Argument:** Corrective justice requires restoring the victim to the position they would have been in had the harm not occurred. If your state's emissions sank an island, admitting one refugee to your suburbs does not restore the island. If your arms fueled a war, admitting a refugee doesn't stop the war.
  *   **The Risk:** If the remedy for the harm is clearly *reparation* (money, rebuilding, regime change) rather than *relocation*, then grounding admission duties in causality looks category-mistaken. If you cannot refute the idea that "money fixes harm, borders fix membership," the footprint frame loses its grip on *admission* specifically.
  *   **Advice:** You need to argue why *presence* is the specific remedy required. Perhaps because the harm was the destruction of *political community*, and admission offers a new political community? If you can't make that link, the footprint argument bleeds into general distributive justice.

  ### 2. Where is the reasoning most likely to be shaky or circular?
  *   **The "Clean Hands" Problem:** You risk circularity if you assume states are distinct agents capable of bearing guilt. If you argue "State A caused this, so State A must pay," but State A's policy was determined by global market forces or previous administrations, the "agent" is fuzzy.
  *   **The Threshold Problem:** You need to define how much footprint is enough to trigger admission. Is 1% of global emissions enough to owe asylum to 1% of the world's displaced? If you don't set a threshold, the duty is either too vague to be useful or so broad it demands open borders (which undermines your distinction from cosmopolitanism).
  *   **Incentive Compatibility:** A shaky point in your reasoning might be ignoring the perverse incentives. If states know that high arms exports or high emissions create binding admission duties, they may reduce humanitarian aid or intervention to avoid establishing causal links. You need to address whether this moral framework creates dangerous real-world incentives.

  ### 3. Is it just Corrective Justice in disguise?
  *   **Honest Assessment:** Yes, largely. The "causal footprint" is essentially a modern, metricized version of corrective justice.
  *   **The Pivot:** Don't fight this. Lean into it. The novelty of your project isn't inventing a new moral category; it's applying the *strictures of corrective justice* to *migration law*, which usually operates on humanitarian grounds.
  *   **The Trap:** Corrective justice is usually backward-looking (repairing past harm). Migration policy is forward-looking (integration, future safety). If you frame this purely as "paying a debt," you might justify admission but fail to justify *citizenship* or *long-term support*. Ensure your framework accounts for the future relationship, not just the past debt.

  ### 4. Scope Warning for Six Months
  *   **Climate vs. Persecution:** Comparing climate displacement to political persecution is ambitious. The causality in climate is collective; in arms sales, it is often transactional.
  *   **Recommendation:** For a six-month part-time grant, consider narrowing. Focus on **one** axis first (e.g., "Complicity in Persecution via Arms Trade") as the primary test case, using climate only as a limiting contrast. Trying to solve the "climate liability" puzzle *and* the "arms export" puzzle in six months may dilute the argument. The arms trade case offers a tighter causal chain and might yield a stronger philosophical result in a short timeframe.
