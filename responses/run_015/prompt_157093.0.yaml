answer: |-
  Here is a reformulation of your inferential framework, designed to handle the specific tensions in your verdicts (particularly the 5/6 and 3/10 pairs) while replacing the problematic "friction" clause.

  ### The Principle of Costly Normative Consistency (CNC)

  A pattern of material remains $P$ licenses an inference to a shared belief or institution $B$ if and only if $P$ satisfies the following four conditions:

  1.  **Diagnostic Contrast (Refining Double-Difference):** $P$ must be significantly more probable given $B$ than given the set of alternatives $A$ (where $A$ includes functional utility, random drift, individual convenience, and economic standardization). $P$ need not be *impossible* without $B$, but the likelihood ratio $Pr(P|B) / Pr(P|A)$ must be substantial.
  2.  **Costly Commitment (Replacing Friction):** $P$ must represent an investment of energy, risk, or opportunity cost that is not recoverable through individual subsistence or functional utility. This cost distinguishes normative behavior from convenient behavior.
  3.  **The Visibility Filter (Distinguishing Belief vs. Institution):**
      *   **Institutions** are inferred when $P$ demonstrates **Public Coordination**. Evidence must show inter-agent dependency, exclusion, or role differentiation visible in the spatial organization of *interaction* (e.g., segregated storage, formalized seating, restricted access).
      *   **Beliefs** (or internalized norms) are inferred when $P$ demonstrates **Private Consistency**. Evidence must show costly regularity in contexts that are *sealed, hidden, or non-monitorable* by other agents.
  4.  **Independence (Handling Convergence):** Multiple lines of evidence increase confidence only to the degree that their error structures are independent. Corroborating evidence from a distinct medium or process (e.g., isotopes + architecture) weighs more heavily than multiple readings of the same medium.

  ---

  ### How CNC Handles Your Verdicts

  **The Friction Replacement:**
  Your "friction clause" required evidence of enforcement. **Case 4** broke this because you inferred an institution (feasting hall) without sanctions. CNC replaces "enforcement" with **Costly Commitment** and **Public Coordination**. In Case 4, the "narrow entrance" and "formalized seating" are architectural costs that enforce exclusion and role assignment physically, without needing evidence of social sanctions. This satisfies Condition 3 (Institution) without satisfying your old Friction clause.

  **The 5 vs. 6 Pair (House Foundations vs. Graves):**
  *   **Case 5 (Foundations):** The deposits are *sealed and never visible*. This satisfies Condition 3 (Private Consistency). No living person sees them, so they cannot be for status display. The cost (Condition 2) implies a rule internalized by the builder. **Verdict: Belief/Norm.**
  *   **Case 6 (Graves):** The deposits are *visible*. This triggers the "Public" branch of Condition 3. Visible uniformity can be explained by status competition (signaling wealth to the living) or economic standardization (potter's kits). Unless you can prove the graves are *non-differentiated* (i.e., poor graves have the same goods as rich ones), status signaling remains a viable alternative ($A$). **Verdict: Ambiguous.**
  *   *Resolution:* CNC validates your split verdict. The structural parallel is broken by the *visibility* variable.

  **The 3 vs. 10 Pair (Seeds vs. Cattle Limbs):**
  *   **Case 3 (Seeds):** Burning seeds is costly (Condition 2), but it occurs in *every house* (Private). However, you rightly hesitate because "imitation" is a low-cost alternative. If the seeds are common chaff, the cost is low. If they are food, the cost is high. Your verdict relies on the plausibility of "imitation" as a functional alternative ($A$). CNC allows the refusal if $Pr(P|Imitation)$ is high.
  *   **Case 10 (Cattle Limbs):** Right forelimbs only, no butchery, sealed in pits. This is high waste (Condition 2) and non-monitorable (Condition 3). "Imitation" is less likely because the cost is high and the specificity (right forelimb) is low-utility. **Verdict: Belief/Ritual.**
  *   *Resolution:* CNC supports the split based on the *magnitude of cost* relative to the *plausibility of functional alternatives*.

  **Other Key Cases:**
  *   **Case 2 (Seals):** Public Coordination (quarters) + Cost (dedicated rooms) + Diagnostic Contrast (4 motifs match 4 quarters). **Verdict: Institution.**
  *   **Case 7 (No Fortifications):** This is a "Costly Omission." If defense is a regional norm (neighbors have walls), omitting them is risky (Condition 2). However, absence of evidence is weak on Diagnostic Contrast (Condition 1). CNC supports your *weak* claim (raiding not a constraint) but blocks the *strong* claim (pacifism) because $Pr(P|Pacifism)$ is not sufficiently distinct from $Pr(P|Hegemony/Protection)$.
  *   **Case 8 (Convergence):** Satisfies Condition 4. Independent lines reduce the probability of a shared hidden bias.
  *   **Case 9 (Text Analogy):** Satisfies Condition 4 weakly. The error structure is not fully independent (cultural continuity), but it raises $Pr(P|B)$.

  ---

  ### Verdicts on New Cases

  **1. Deliberate Breakage (River Deposition)**
  *   **Analysis:** Hundreds of metal objects broken identically and deposited.
  *   **Cost:** High (destruction of value/utility).
  *   **Visibility:** Low (sealed in river).
  *   **Coordination:** High (identical breakage method over centuries).
  *   **Verdict:** **Infer Belief/Ritual.** This is a classic "votive" signature. The cost is irrecoverable, and the privacy rules out status display. It satisfies CNC Conditions 2 and 3 (Private).

  **2. Discontinuity (Pattern stops with population influx)**
  *   **Analysis:** Pattern $P$ exists in Phase 1-2, vanishes in Phase 3 with new isotopes.
  *   **Diagnostic Contrast:** High. If $P$ were functional/environmental, it would persist despite population change. Its disappearance links $P$ to the specific cultural group, not the environment.
  *   **Verdict:** **Infer Cultural Norm (Belief/Institution).** This strengthens the inference that $P$ was normative rather than functional. It does not specify *which* norm, but it licenses the claim that $P$ was socially mandated by Group 1.

  **3. Reflexive Case (Lawn Signs)**
  *   **Analysis:** Seasonal, recurring colors, door-knocking paraphernalia.
  *   **Cost:** Low (cheap plastic, temporary).
  *   **Visibility:** High (Public).
  *   **Coordination:** High (seasonal synchronization).
  *   **Verdict:** **Infer Custom/Norm, withhold "Electoral Institution."** CNC Condition 2 (Cost) is weak. Plastic signs are low-cost signaling. While they indicate a shared *custom* of campaigning, inferring a formal *institution* (voting/counting/rules of transfer) requires evidence of the *decision mechanism* (like the seal rooms in Case 2 or seating in Case 4). Signs alone license "periodic competitive display," not necessarily "electoral governance."

  ---

  ### The Overturn

  I would overturn **Verdict 6 (Graves)**.

  **Reasoning:**
  Your refusal in Case 6 rests on the alternative explanation of "display on the part of the living" (status signaling). However, signaling theory dictates that for a signal to convey status, it must be *differentiating*. If, as your description states, **"In every grave... the same four vessel types appear,"** then the signal has no variance. A universal standard cannot function as a status marker between households.

  If the pattern is truly universal across the cemetery (rich and poor, large and small graves), the "status display" alternative ($A$) collapses. The only remaining explanations are:
  1.  **Economic:** A potter's kit (Condition 1 failure: unlikely to dictate *arrangement* strictly).
  2.  **Normative:** A shared belief about what the dead require (Condition 3: Public, but Condition 2: Costly).

