          *   *Key phrase to include:* "Quality of obligations."
      *   **Round 2: The Mechanism of Secular Trust.**
          *   Elena explains *how* it works without God: Institutions, transparency, reciprocity. If you cheat, the system catches you.
          *   Thomas counters with the "Parasite Argument." These institutions were built by people who believed in Judgment/Divine Law. Can they run on empty?
      *   **Round 3: The Edge Case (The Rational Cooperator).**
