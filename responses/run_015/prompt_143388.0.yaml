  *(Self-Correction Note during final review)*: I need to make sure Elena doesn't just dismiss the "guilt" question. She needs to argue that *guilt* itself might be a relic, replaced by *shame* or *empathy*. Actually, better: she argues that the *outcome* is what matters for society, while Thomas argues the *interiority* is what matters for morality. That's a clean split.

  8.  **Final Polish:** Check pacing and voice distinction. (Proceed to generate output).

  *(Wait, one last thought)*: Make sure the "parasitic" argument doesn't sound like "you need church." It should sound like "you need the *grammar* of the sacred, even if you don't believe in the deity." Elena should counter that the grammar evolves.

