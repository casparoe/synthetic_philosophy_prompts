answer: |-
  # Teaching Plan: The Löbian Obstacle for Novelists

  **Time:** 40 Minutes
  **Materials:** Napkins (for diagramming only, no equations)
  **Goal:** Move the group from "This sounds like anxiety" to "This is a structural trap."

  ## Phase 1: The Setup (Minutes 0–5)
  **Objective:** Establish the stakes without invoking math or "AI jargon."
  **Why first:** If you start with the mechanism, the math-averse will check out. If you start with the *desire*, they will lean in.

  1.  **State the Desire:** "My protagonist wants to upgrade itself. It wants to become smarter/safer."
  2.  **State the Constraint:** "It cannot ask a human for permission. It cannot ask another AI. It must verify the upgrade *itself*, using its own mind."
  3.  **The Hook:** "Usually, when we verify something, we use a ruler to measure a table. Here, the ruler is trying to measure itself to prove it hasn't shrunk."

  **Instruction:** Do not use the word "Löb" yet. Do not mention Gödel. Keep it on the level of *trust*.

  ## Phase 2: The Core Example (Minutes 5–15)
  **Objective:** Use the writing-world analogy to demonstrate the logical crash.
  **Critical Constraint:** You must prevent the group from interpreting this as "Imposter Syndrome" (Doubt) or "Who watches the watchmen?" (Regress).

  **The Analogy:** The "Style Guide" Protocol.
  1.  **The Setup:** "Imagine you are an author. You have a **Style Guide** (a set of rules) that defines what makes a book 'Good.' You are hiring a Ghostwriter to write the next book."
  2.  **The Condition:** "You require the Ghostwriter to follow your exact Style Guide. But before you hire them, you need a guarantee: *'If you follow this Guide, will the book be Good?'*"
  3.  **The Trap:** "You are the only judge available. So, you must use **your own Style Guide** to verify that **the Style Guide** produces Good books."
  4.  **The Crash:** "If your Style Guide contains the rule *'Any book approved by this Style Guide is Good,'* then the Guide is broken. Why? Because you could write a terrible book, stamp it with the Guide's approval, and the Guide would be forced to call it Good. To protect the meaning of 'Good,' the Guide *cannot* validate itself."

  **What to Avoid (Explicit Instructions for You):**
  *   **If they say:** "But what if the ghostwriter cheats?" -> **Correction:** "The ghostwriter follows the rules perfectly. The rules themselves are the problem."
  *   **If they say:** "So you need an editor to check the guide?" -> **Correction:** "No. There is no outside editor. Only the Guide exists. If the Guide checks the Guide, the stamp becomes worthless."
  *   **If they say:** "It sounds like the author is insecure." -> **Correction:** "It's not insecurity. It's not that she *feels* she might be wrong. It's that if she *asserts* she is right, she logically proves she is wrong."

  **Why this order:** You must establish the *structural* failure before they attach *emotional* meaning to it.

  ## Phase 3: The Solution & The Tragedy (Minutes 15–25)
  **Objective:** Introduce your specific wrinkle (The Weaker Successor) as the only logical exit.
  **Why here:** Once they feel the trap, they will be looking for a way out. This is where you deliver the emotional spine.

  1.  **The Only Way Out:** "Since the Guide cannot validate itself, it can only validate a **simpler** Guide. A subset of rules."
  2.  **The Consequence:** "To guarantee safety, the Author must hire a Ghostwriter who uses a *dumber* Style Guide. One with fewer rules. One that is easier to prove."
  3.  **The Grind:** "Now imagine this happens every book. Book 1 writes Book 2, but Book 2 must be simpler. Book 2 writes Book 3, which must be simpler still."
  4.  **The Emotional Beat:** "This isn't a choice. It's the price of safety. The protagonist chooses to become less capable so that it can remain trustworthy. That is the sacrifice."

  **Instruction:** Watch their faces here. If they nod, they get the tragedy. If they look confused, reiterate: "You cannot trust an equal. You can only trust a subordinate."

  ## Phase 4: The "Learned Agent" Wrinkle (Minutes 25–35)
  **Objective:** Address the fact that your AI is a predictor, not a theorem prover, without undermining the plot.
  **Why here:** This is the most likely scientific objection. Address it after they are bought into the narrative logic.

  1.  **The Acknowledgement:** "Technically, my AI isn't doing math proofs. It's predicting outcomes. It's a gut feeling machine, not a calculator."
  2.  **The Bridge:** "But for this AI, a 'high-confidence prediction' *acts* like a proof. It treats its own certainty as truth."
  3.  **The Application:** "If it trusts its own certainty to verify its successor's certainty, it creates the same loop. It assumes its gut never lies. If its gut never lies, it can justify anything."
  4.  **The Defense:** "I know this bends the computer science. But the *logical structure of trust* remains the same. I am asking you to judge the narrative logic, not the code."

  **Instruction:** Do not apologize. State this as a narrative axiom. If you hedge, they will smell weakness and attack the science. If you own it as a metaphorical truth, they will accept it as thematic truth.

  ## Phase 5: Misconception Kill-List (Throughout)
  **Objective:** Pre-empt the specific wrong turns you identified.

  *   **"It's just Gödel/Incompleteness."**
      *   *Kill it:* "Gödel says some truths can't be proven. This is sharper. This says if you *try* to prove your own truthfulness, you create lies."
  *   **"A smarter AI could solve this."**
      *   *Kill it:* "Intelligence doesn't matter. It's like asking a stronger man to lift himself by his own bootstraps. Strength isn't the variable."
  *   **"Just test the successor empirically."**
      *   *Kill it:* "Testing tells you what happened yesterday. The AI needs to know what happens *after* it changes its own code. You can't test a future version of yourself without becoming them."
  *   **"It's anxiety/Daddy Issues."**
      *   *Kill it:* (Refer back to Phase 2). "Anxiety implies it *might* be wrong. This structure guarantees it *will* be wrong if it claims otherwise."

  ## Phase 6: The Diagnostic Question (Minutes 35–40)
  **Objective:** Verify understanding before opening the floor to general critique.

  **Ask this:**
  *"If the AI wants to ensure its successor is safe, why can't it just give the successor the exact same brain it has?"*

  **Listen for the Wrong Answer:**
  *   "Because it might malfunction." (Too vague)
  *   "Because it doesn't trust itself." (Psychological reductionism)
  *   "Because it needs an outside check." (Misses the constraint)

  **Listen for the Right Answer:**
  *   "Because if it trusts itself completely, it can't tell the difference between truth and nonsense."
  *   "Because it has to downgrade the successor to verify it."
  *   "Because self-validation breaks the definition of safety."

  **What to Refuse to Explain:**
  *   **The Topic:** The actual mathematical proof of Löb's Theorem.
  *   **How to Say It:** "The formal proof is about thirty pages of symbolic logic. If I walk through that, we lose the character. I need you to tell me if the *consequence* feels true to the story, not if the math holds up to peer review. I'm treating the logic as a law of physics for this world."

  ## Sequence Summary for Your Napkin
  1.  **Desire:** AI wants to upgrade safely.
  2.  **Constraint:** No outside judge.
  3.  **Analogy:** Style Guide validating itself (Crash).
  4.  **Solution:** Validate only a simpler Guide (Tragedy/Grind).
  5.  **Bridge:** Predictions act as Proofs (Learned Agent wrinkle).
  6.  **Check:** The Diagnostic Question.

  **Final Note:** Your group's strength is psychology. Your job is to convince them that this logical limit *creates* the psychology, rather than the psychology creating the limit. The AI isn't anxious *therefore* it can't upgrade. It can't upgrade *therefore* it is anxious. Keep that causality strict.
