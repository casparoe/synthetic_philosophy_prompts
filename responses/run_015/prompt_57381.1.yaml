      *   **Task:** Reconstruct the implicit theory of political membership and territory presupposed by a specific "package of features" of migration control in wealthy states.
      *   **Constraints:** No survey of open borders positions, no references/bibliography/reading list. Correct inaccuracies before reasoning. Analyze specific models (property, club, kinship, self-governing collective). Identify underdetermination. Press on three specific tensions (unilateral vs. mutual recognition, exit vs. admission, presence vs. birthright). Conclude with what would change under alternative views (equal original claim/general liberty).
      *   **Tone:** Philosophical, rigorous, attentive to institutional detail, avoiding platitudes.

  2.  **Deconstruct the "Package of Features":**
      *   *Feature 1 (Threshold Discretion vs. Internal Rights):* High discretion at the border (no reasons, unreviewable) vs. thick constitutional protections once inside (even if irregular).
      *   *Feature 2 (Membership Acquisition/Loss):* Hard to lose citizenship, transmitted by descent (*jus sanguinis*) or birth (*jus soli*), often prioritizing distant descendants over long-term resident non-citizens. Naturalization is hard (earned).
      *   *Feature 3 (Right to Movement):* Right to leave/return, not right to enter elsewhere. Statelessness is an anomaly to be fixed by assignment, not admission. Renunciation restricted.
      *   *Feature 4 (Removal Mechanics):* Removal requires a receiving state. If no one takes them, removal stalls (toleration status). Reliance on bilateral readmission agreements.

      *Accuracy Check:* Are these accurate generalizations?
      *   *Feature 1:* Generally accurate for wealthy states (e.g., US, EU). "Exclusionary discretion" is a standard doctrine. Internal protections vary but generally exist (non-refoulement, due process in detention). *Correction/Nuance:* In some jurisdictions (e.g., expedited removal in US), internal protections for recent arrivals are thinner than described, but the *principle* that presence triggers *more* rights than application is robust. I should acknowledge the "entry fiction" doctrine but accept the user's core observation: the border is a zone of exception.
      *   *Feature 2:* Accurate. *Jus sanguinis* is dominant globally; *jus soli* is rarer but exists (Americas). Naturalization is indeed "earned." The tension between the diaspora child and the long-term resident is real.
      *   *Feature 3:* Accurate per UDHR Art 13. Statelessness is treated as a legal glitch.
      *   *Feature 4:* Accurate. You can't deport to nowhere. Readmission agreements are the engine of enforcement.

      *Decision:* The description is robust enough to proceed without major correction, though I should note that Feature 1's "constitutional protections" for irregular entrants are often procedural rather than substantive rights to stay. I will accept the user's framing as the phenomenological reality they witnessed.

  3.  **Analyze the Models (Property, Club, Kinship, Self-Governing Collective):**
      *   *Property Model:* People own the land.
          *   *Fit:* Explains exclusion (trespassing). Explains Feature 1 (threshold control).
          *   *Mismatch:* Doesn't explain Feature 2 (why does a newborn abroad own a share?). Doesn't explain Feature 4 (why can't I just throw you off my land?).
          *   *Verdict:* Sits comfortably with exclusion, but fails to explain membership transmission or removal limits.
      *   *Club/Contract Model:* Voluntary association.
          *   *Fit:* Explains naturalization (earning membership). Explains Feature 1 (selecting entrants).
          *   *Mismatch:* Fails Feature 2 (birthright citizenship isn't voluntary). Fails Feature 3 (you can't quit the club easily).
          *   *Verdict:* Explains naturalization, fails birthright and exit restrictions.
      *   *Kinship/Household Model:* Descent-based.
          *   *Fit:* Explains Feature 2 (citizenship by blood/birth). Explains Feature 3 (duty to take back "own").
          *   *Mismatch:* Fails Feature 1 (why screen strangers so rigorously if you're just a family?). Fails Naturalization (outsiders can't become kin).
          *   *Verdict:* Strong on citizenship, weak on border control logic (which is bureaucratic, not familial).
      *   *Self-Governing Collective (Political Community):* Integrity of the demos.
          *   *Fit:* Explains Feature 1 (protecting the political project). Explains Feature 2 (reproducing the demos).
          *   *Mismatch:* Struggles with Feature 4 (why does external recognition matter for internal sovereignty?).
          *   *Verdict:* The strongest candidate, but still underdetermined.

      *Underdetermination:* Where do theories overlap? Both Property and Club models justify Feature 1. Both Kinship and Self-Governing models justify Feature 2. The *combination* is what creates the specific tension.

  4.  **Address the Three Tensions:**
      *   *Tension 1 (Feature 4 & Unilateral Right):* The "Right to Exclude" is actually a "Right to Return" enforced globally. If State A can't send to State B, State A's exclusion fails. This undermines the "sovereign authority over territory" narrative. It reveals sovereignty is *relational*, not absolute. The power to exclude is parasitic on the global system of states.
      *   *Tension 2 (Feature 3 & 1 - Exit vs. Admission):* Right to leave + No right to enter = The Earth is fully apportioned. You are free to move *if* someone accepts you. If no one does, you are trapped. This presupposes a "closed system" of states. Freedom of movement is a claim against your *own* state (don't trap me), not a claim against the *world* (let me in). It treats the globe as a patchwork of private properties where the "public" space is non-existent.
      *   *Tension 3 (Feature 1 & 2 - Presence vs. Birthright):* Feature 1 says "you don't belong until we say so." Feature 2 says "you belong because you were born, regardless of connection." Is there a unifying theory? Yes: *Perpetual Sovereignty.* The state is a trans-generational entity. Birthright ensures continuity (Feature 2). Discretion ensures current security/integrity (Feature 1). The "embarrassment" arises only if we view membership as *merit-based*. If membership is *status-based* (ontological), the tension dissolves, but at the cost of moral defensibility regarding the long-term resident.

  5.  **Address the Counterfactual (What would change?):**
      *   *Alternative View:* Equal original claim / Movement as general liberty (restrictions need justification).
      *   *Feature 1 (Threshold Discretion):* Would disappear or radically change. Burden of proof shifts to the state to justify exclusion, not the individual to justify entry.
      *   *Feature 2 (Birthright vs. Residence):* Would shift toward *jus domicili* (citizenship by residence). Birthright abroad would weaken. Naturalization would be automatic or streamlined.
      *   *Feature 3 (Right to Leave):* Would expand to a Right to Enter somewhere. Statelessness would be solved by admission, not assignment.
      *   *Feature 4 (Removal/Readmission):* The bilateral readmission system would collapse. If you can't send them back, you must regularize them (not just tolerate). The "toleration status" becomes permanent residency by default. The "removal" power vanishes without a receiver.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the user's insight. Validate the "machinery" description. Minor nuance on Feature 1 (the "entry fiction").
