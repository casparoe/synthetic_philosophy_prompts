answer: |-
  Your description of the machinery is phenomenologically accurate. I will offer one minor correction to Feature 1 before proceeding: in many jurisdictions, the "thickening" of protections for those inside the territory is procedural rather than substantive. The state often retains the power to remove the irregular entrant, but the *process* requires hearings, counsel, and proportionality checks that are absent at the threshold. This distinction matters because it preserves the state's ultimate authority to exclude while acknowledging the person's physical presence. With that nuance noted, your four features accurately describe the operational logic of the wealthy state system.

  Here is the reconstruction of the theory presupposed by this package.

  ### I. Evaluation of the Models

  None of the four models you list (Property, Club, Kinship, Self-Governing Collective) is strictly *required* by the entire package, but each sits comfortably with specific features while straining against others. The actual practice is a hybrid that borrows from each to plug the normative gaps of the others.

  **1. The Property Model**
  *   **Fit:** Situates comfortably with Feature 1 (threshold discretion). If the people collectively own the territory, they may forbid trespass.
  *   **Tension:** Fails Feature 2 and 4. Property rights are usually alienable and do not automatically transmit to distant descendants abroad without their consent. More critically, a property owner does not need a neighbor's permission to eject a trespasser. Feature 4 (the need for a receiving state) contradicts the property model; if I own my land, I can throw you off it regardless of whether you have somewhere else to go.
  *   **Verdict:** Underdetermined. It explains the border, but not the citizenship rules or the dependency on readmission.

  **2. The Club/Contract Model**
  *   **Fit:** Situates comfortably with Feature 1 (selection) and the naturalization requirements in Feature 2 (earning membership).
  *   **Tension:** Fails Feature 2 (birthright). Clubs are voluntary; you cannot be born into a contract you did not sign. It also fails Feature 3 (restriction on exit). Clubs generally allow resignation; states treat renunciation as a privilege to be managed, not a right to be exercised.
  *   **Verdict:** Merely comfortable. It explains how outsiders become insiders, but not how insiders are created by birth or trapped by duty.

  **3. The Household/Kinship Model**
  *   **Fit:** Situates comfortably with Feature 2 (descent) and Feature 3 (duty to take back "own" citizens). It explains why the newborn abroad precedes the long-term resident: one is kin, the other is a stranger.
  *   **Tension:** Fails Feature 1. Households do not typically subject family members to rigorous screening at the door, nor do they treat non-kin residents with such procedural deference once inside. It also struggles with Feature 4; a household does not need another household's permission to disown a member.
  *   **Verdict:** Merely comfortable. It explains the transmission of status, but not the bureaucratic violence of the border.

  **4. The Self-Governing Collective Model**
  *   **Fit:** Situates comfortably with Feature 1 (protecting the integrity of the demos) and Feature 2 (reproducing the demos over time).
  *   **Tension:** Struggles with Feature 4. If the point is self-government, why does my capacity to govern myself depend on your willingness to receive my exiles?
  *   **Verdict:** The strongest candidate, but still underdetermined.

  **Where the Package is Underdetermined**
  The most significant underdetermination lies between the **Property Model** and the **Self-Governing Collective Model** regarding Feature 1. Both license high threshold discretion. A property owner can exclude to protect value; a collective can exclude to protect culture or institutions. The institutions look the same, but the justification differs. Similarly, Feature 2 is underdetermined between **Kinship** and **Perpetual Collective**. Is citizenship blood-based (ethnic) or time-based (historical continuity)? The institutions function identically whether the child is a citizen because of "blood" or because they are a "future voter," yet these are rival theories of belonging.

  ### II. The Three Tensions

  **1. The Relational Nature of Exclusion (Feature 4)**
  You ask if the fourth feature shows the right to exclude is not unilateral. The answer is yes. The practice presupposes a theory of **Interdependent Sovereignty**.
  Standard justifications for exclusion frame it as an attribute of territorial integrity: "This is our land, we decide." Feature 4 reveals this to be fiction. The power to exclude is not a property right over land; it is a *jurisdictional status* recognized by other states. If State A expels a person to State B, State A is effectively enforcing State B's laws (by asserting the person belongs to B). When State B refuses documents, State A's authority hits a wall.
  This undermines justifications framed as "authority over territory." If authority were truly territorial, the physical presence of the person would be the only variable. Instead, the variable is *diplomatic recognition*. The machinery commits us to the view that sovereignty is not a boundary around a place, but a network of agreements between governments. The "right to exclude" is actually a "right to return," and it only functions because other states agree to honor it.

  **2. The Exhausted Earth (Feature 1 & 3)**
  You ask if the practice presupposes the habitable earth is exhaustively apportioned. The machinery strictly requires this.
  If there were *terra nullius* (no-man's-land) or a general right to admission, Feature 1 (discretionary exclusion) would collapse. By pairing the right to leave (Feature 3) with the right to exclude (Feature 1), the system treats the globe as a closed circuit of jurisdictions. There is no "outside."
  This renders freedom of movement a claim against one's *own* government ("do not imprison me here"), not a claim against the world ("let me go there"). It presupposes that every human being must be the responsibility of *some* state, and that states are the only legitimate managers of human presence. The "anomaly" of statelessness (Feature 3) confirms this: the system does not solve statelessness by allowing the person to roam freely; it solves it by assigning them to a state. The theory is one of **Universal Jurisdictional Coverage**: every inch of earth and every human body must fall under a specific sovereign's account.

  **3. Presence vs. Birthright (Feature 1 & 2)**
  You ask if these features presuppose incompatible accounts of membership. They appear incompatible only if membership is viewed as *merit-based*. If membership is viewed as *ontological* (a state of being), they cohere.
  The theory here is **Perpetual Sovereignty**. The state is not a collection of current residents (which would favor the long-term irregular migrant in Feature 2); it is a trans-generational project.
  *   Feature 2 (Birthright) secures the *future* of the project (children) and honors the *past* (diaspora).
  *   Feature 1 (Threshold Discretion) secures the *present* integrity of the project (screening).
  The long-term resident is excluded from citizenship not because they haven't contributed (they have), but because they are not part of the *lineage* of the project. The newborn abroad is included not because of contribution, but because they are part of the *lineage*.
  The "embarrassment" you sense arises because the system speaks the language of liberal contribution (taxes, work) while operating on the logic of dynastic continuity. It is not two incompatible accounts; it is a single account that prioritizes *continuity of the state* over *justice to the individual*.

  ### III. The Implicit Theory: Sovereign Trusteeship

  Synthesizing these points, the package presupposes a theory of **Sovereign Trusteeship**.
  The state does not "own" the land (Property), nor is it a voluntary club (Contract). It is a trustee for a specific people defined by history and descent (Kinship/Collective), managing a territory that is part of a globally exhaustively apportioned system (Interdependent Sovereignty).
  *   **Membership:** Is an inherited trust, not an earned right.
  *   **Territory:** Is the asset managed by the trust, not the property of the current residents.
  *   **Exclusion:** Is the fiduciary duty to protect the asset for the beneficiaries (citizens), constrained only by the need to coordinate with other trustees (readmission agreements).

  ### IV. What Would Change Under an Alternative View?

  If we replaced this view with one where **persons have an equal original claim to the places of the earth** (or where movement is a general liberty restrictable only by articulated justification), the machinery would transform as follows:

  **1. Feature 1 (Threshold Discretion) would disappear or invert.**
  Currently, the individual must justify entry; the state needs no reason to refuse. Under an equal-claim view, the *state* would bear the burden of proof. Admission would be presumptive. Exclusion would require a specific, articulated justification (e.g., "this specific individual poses a verified threat"), rather than categorical bans based on nationality or class. The "zone of exception" at the border would vanish; constitutional protections would apply at the threshold as they do inside.

  **2. Feature 2 (Birthright vs. Residence) would shift to *Jus Domicili*.**
  Citizenship would no longer transmit automatically to children abroad with no connection to the territory. Instead, membership would accrue based on presence and social integration. The newborn abroad would have no claim; the resident of twenty years would have an automatic claim. Naturalization would not be "earned" through testing but recognized as a consequence of established life.

  **3. Feature 3 (Right to Leave) would expand to a Right to Enter.**
  The right to movement would no longer stop at the border. If the earth is exhaustively apportioned, the right to leave is meaningless without a right to enter somewhere. Statelessness would not be cured by "assigning" a person to a state they do not know, but by allowing them to select a state of residence, subject only to the specific justification constraints mentioned above. Renunciation of citizenship would be unilateral and unconditional; you cannot be forced to remain a member of a political community you reject.

  **4. Feature 4 (Removal/Readmission) would be replaced by Regularization.**
  The bilateral readmission system is the engine of the exclusionary state. If you cannot assert a superior claim to the territory over the person residing there, you cannot "remove" them to a "home" they may not have.
  *   **The Institution:** The readmission agreement would be abolished.
  *   **The Replacement:** A system of **Default Regularization**. If a state cannot remove a person (because no other state accepts them, or because the person has no prior tie to another state), the expelling state must grant them full membership. The "toleration status" would not be a limbo, but a pathway to citizenship. The power to expel would no longer depend on another state's willingness to receive; it would depend on the expelling state's ability to justify why *this* person cannot stay *here*.

  In short, the current machinery encodes a commitment to the **priority of states over persons**. It treats human beings as the responsibility of specific governments first, and moral agents second. To change the machinery is to assert that human presence is legitimate by default, and state authority is the exception that requires justification.
