      To: Minister of Consensus and Social Cohesion
      From: Directorate of Social Levelling
      Date: 24 May 2024
      Subject: Implementation of the Desert Adjustment Index

      1. Purpose
      This memorandum outlines the operational framework for the Desert Adjustment Index. Current social friction stems from unresolved disputes regarding the provenance of individual standing. Some citizens interpret success as evidence of virtue, while others interpret it as evidence of unfair advantage. The Index resolves this by quantifying the split between earned standing and standing attributable to brute luck, inherited advantage, and uncredited collaborative labour.

      2. Measurement Infrastructure
      Development of a proprietary algorithm was deemed inefficient. A visiting American consultancy offers a rival product termed Self-Made Certification. Their engine calculates the percentage of success attributable to personal agency versus external variables. We have licensed this software. While their output certifies merit for market premium, our output certifies luck for levelling purposes. The underlying mathematics are identical, ensuring cost neutrality.

      3. Assessment Protocol
      Upon filing an annual success declaration, citizens receive a breakdown. The earned portion generates a Praise Quota, permitting public admiration up to a fixed decibel level. The unearned portion triggers a Levelling Tariff. This tariff consists of scheduled ceremonial censure, mandatory humility seminars, and a temporary reduction in social visibility.

      4. Worked Example
      The following assessment applies to Citizen 8940 (Sector: Architecture):

      | Component | Percentage |
      | :--- | :--- |
      | Genuine Effort | 15% |
      | Brute Luck (Timing) | 30% |
      | Inherited Advantage | 40% |
      | Uncredited Collaborators | 15% |
      | **Resulting Tariff Band** | **High** |

      Citizen 8940 is authorized 15% of current acclaim. The remaining 85% is subject to reclamation via public correction.

      5. Citizen Feedback
      Early pilots indicate compliance mixed with confusion. One subject subjected to a High Tariff noted:

      I worked sixteen hours a day for ten years. You say my parents gave me a stable home, which is true, but you count that as a debt I owe the collective rather than a foundation I built upon. I am being fined for having supportive parents.

      This reaction confirms the Index is functioning as intended by identifying unacknowledged advantages.

      6. Internal Personnel Considerations
      A complication arises regarding Directorate staff. To design and administer the Index requires high-level expertise, rare education, and significant authority. These traits register on the Index as high indicators of inherited advantage and brute luck regarding cognitive endowment. Consequently, staff members responsible for issuing Tariffs may themselves qualify for Levelling Tariffs.

      If we tariff ourselves, operational capacity may degrade. If we exempt ourselves, the Index lacks universal application. We propose forming a sub-committee to determine whether expertise earned through study counts as genuine effort or as luck regarding the capacity to study. This sub-committee will require specialized members. We are currently assessing whether such members would immediately qualify for Tariffs based on their selection.

      7. Recommendation
      Proceed with licensing the American engine. Launch the Index nationally. The sub-committee on internal levelling will report when convened, provided its members are not first subject to ceremonial censure.

