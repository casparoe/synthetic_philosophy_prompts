  **// FLAGGED ISSUES //**

  **Indistinguishable Pairs (Tree fails to separate):**
  *   *Binary Physicalism (Threshold/No Niche)* vs. *Raw Mass Utilitarianism (Gradient/No Niche)* → If both aliens are way above the threshold, the practical outcome is identical (both get full rights), even though the logic differs. The tree only splits them when comparing a high-mass alien to a low-mass human.
  *   *Functional Equivalence* vs. *Contextual Personhood* → If the fungal net behaves exactly like a human diplomat, both positions grant it rights. The tree only bites when behavior and biology diverge.

  **Empty Branches (Sounds okay, no defenders):**
  *   *Node 1 (YES) → Node 3 (Gradient) → Node 4 (YES)* **BUT** *Node 2 (NO)* → "Substrate Gradient Contextualism." Nobody argues that fungal mass counts less than neural mass *and* that moral weight is a sliding scale *and* that ecology matters. It's too many hedges. People usually pick one hard metric (mass OR neurons) and stick to it.
  *   *Node 1 (YES)* **BUT** *Size tracks "Sin Capacity"* → Religious/metaphysical claim. No secular ethical defenders. Discard for sci-fi bioethics council scenario.

