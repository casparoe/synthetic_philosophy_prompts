  *   The **Raw Mass Utilitarianism** leaf is the best conflict generator. Protagonist has to explain why the fungus gets saved before the orphan.
  *   The **Neuro-Chauvinism** leaf makes the walnut alien the "true" human equivalent, which isolates the fungal net character nicely.
