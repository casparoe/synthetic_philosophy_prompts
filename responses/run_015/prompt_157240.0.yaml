          │       │   • **Commitment:** The 20kg fungal net is a "person" only when fruiting, but "livestock" when spreading.
          │       │   • **Commitment:** The big/low-density alien loses rights if it becomes a predator of humans.
          │       └── **NO** → **Leaf: Binary Physicalism**
          │           • **Commitment:** The 20kg fungal net has full voting rights immediately upon crossing the 1.5kg mark.
          │           • **Commitment:** A human infant has fewer rights than the walnut alien if the walnut crosses the threshold first.
          │
          └── **GRADIENT** → (More brain = more moral weight)
              └── **NODE 4: Does ecological niche override the metric?**
                  ├── **YES** → **Leaf: Weighted Contextualism**
                  │   • **Commitment:** The 20kg fungal net's moral score is halved because it's sessile (doesn't participate in society).
                  │   • **Commitment:** The walnut alien gets a multiplier for being a "keystone species."
                  └── **NO** → **Leaf: Raw Mass Utilitarianism**
                      • **Commitment:** The 20kg fungal net outweighs a human child (20kg > 1.4kg). Killing one fungus = killing 14 kids.
