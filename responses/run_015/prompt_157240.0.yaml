  │       • **Commitment:** The walnut alien is equal to a human if it passes Turing tests, despite having less "stuff" to damage.
  │
  └── **YES** → (Matter matters) → **NODE 2: Do scaling laws apply across architectures?**
      │
      ├── **NO** → (Substrate specific—only neuron-like stuff counts)
