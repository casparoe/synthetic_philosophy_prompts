answer: |-
  This is a sophisticated set of questions. You have correctly identified the pressure points where the physics ends and the metaphysics begins. As a philosopher of physics, I appreciate that you aren't asking for a pop-sci summary but for the structural integrity of the argument itself.

  You are right to be suspicious. The Rietdijk–Putnam (RP) argument is often treated as a "proof" of eternalism in introductory contexts, but in the specialist literature, it is regarded as a *plausibility constraint* that relies on several contentious metaphysical assumptions disguised as physical ones.

  Per your request, I will first reconstruct the argument's necessary premises, then evaluate the defeaters you raised (and others), ranking them by severity. Finally, I will address the "verbal collapse" worry and the state of consensus.

  ---

  ### 1. Reconstructing the Rietdijk–Putnam Argument

  To see where the argument breaks, we must formalize what it actually requires. It is not enough to say "simultaneity is relative." We need to bridge the gap from *epistemic* relativity (what counts as 'now' depends on motion) to *ontological* equality (past/future events exist just as much as present ones).

  Here are the informal premises the argument needs to function:

  1.  **Special Relativity (SR) is True:** The laws of physics are Lorentz invariant; there is no local experiment that can detect absolute rest.
  2.  **No Privileged Observers:** If an observer $O$ is real, and observer $O'$ is in uniform motion relative to $O$, $O'$ is equally real and their perspective is ontologically on par with $O$'s. (This is the move from "no *detectable* privilege" to "no *ontological* privilege").
  3.  **The Reality of Simultanea:** If event $E$ is simultaneous with observer $O$'s "now" in $O$'s frame, then $E$ is ontologically real *for* $O$. (Sometimes called the "Presentist Principle" turned against itself).
  4.  **Transitivity of Reality:** The relation "is real with" (or "is co-real with") is transitive. If $E$ is real with $O$, and $F$ is real with $E$, then $F$ is real with $O$.
  5.  **Global Applicability:** The geometry of spacetime allows for the requisite inertial frames to exist globally (i.e., we can extend local Lorentz frames arbitrarily far without hitting a boundary or topology change).

  **The Inference:**
  Because simultaneity slices tilt with velocity, there is a frame where Andromeda's "next week" is simultaneous with my "now." By (3), Andromeda's next week is real for that frame. By (2), that frame is ontologically valid. By (4), if it's real for them, and they are real for me, it is real *simpliciter*. Therefore, the future exists.

  ---

  ### 2. Hunting for False Premises: The Defeaters

  Here I will evaluate the objections you raised, plus the semantic objection, ranking them from **Fatal** (breaks the logic of the argument entirely) to **Awkward** (requires modification but leaves the conclusion intact).

  #### A. The Transitivity Objection (Howard Stein)
  *Status: Fatal to the original argument; Serious constraint on modern versions.*

  You asked if the non-transitivity of simultaneity is fatal. In 1968 (and clarified in 1991), Howard Stein published the definitive critique here.

  The relation "is simultaneous with in frame $F$" is **not** transitive across frames.
  *   $E_1$ is simultaneous with $Now$ in Frame A.
  *   $E_2$ is simultaneous with $E_1$ in Frame B.
  *   It does **not** follow that $E_2$ is simultaneous with $Now$ in any meaningful sense that preserves the ontology.

  Putnam tries to bypass this by defining a relation $R$ ("is real for"). He argues $R$ must be transitive. But Stein points out that if you define $R$ based on the physical structure of Minkowski spacetime (specifically, the causal structure), the only transitive, definable relation that respects the symmetries of SR is the relation "is in the causal past or future of."

  **Why this is fatal to RP:** The RP argument relies on chaining realities across different simultaneity slices. If "reality" is tied to the causal structure (the only invariant structure in SR), you do not get the whole block. You get a "growing block" or a "past-light-cone presentism." Stein showed that one can be a presentist (of a sort) even within SR, provided one abandons the idea that "simultaneity" determines "reality."

  **Eternalist Response:** Eternalists usually concede Stein's point about *simultaneity* but argue that "existence" shouldn't be defined by simultaneity at all. They argue for a "tenseless existence" where the manifold exists *simpliciter*. However, this concedes that RP *specifically* does not prove eternalism; rather, eternalism must be justified by other means (e.g., parsimony, truthmakers for future contingents).

  #### B. The Topology/Compactness Objection
  *Status: Fatal to the *universality* of the argument; contingent on cosmology.*

  Your intuition about the 3-torus is correct. In a spatially compact universe (like a flat 3-torus), global Lorentz invariance is broken. While SR holds locally, the global topology selects a **preferred frame**—the one in which the circumference of the universe is maximal (or where the Sagnac effect vanishes for light circling the universe).

  **Why this counts against RP:** The RP argument leans heavily on Premise 2 (No Privileged Observers). If the global topology of our universe picks out a unique rest frame, then there *is* a physically privileged "now." A presentist could argue that *this* specific foliation is the ontologically privileged one.

  **Severity:** This is fatal to the claim that SR *forces* eternalism. If our universe is a torus, SR is compatible with a form of presentism that utilizes the preferred foliation. However, current cosmological data suggests the universe is simply connected (or at least, the scale of any topology is larger than the observable horizon). So, while this is a *logical* defeater, it may not be an *empirical* one for our actual universe.

  #### C. The Dynamical Preferred Foliation (Neo-Lorentzianism)
  *Status: Serious (removes the physics motivation).*

  You asked if a future physics with a preferred foliation (e.g., Bohmian mechanics, certain approaches to Quantum Gravity like Hořava–Lifshitz gravity) defeats the argument.

  **Analysis:** Yes. The RP argument derives its force from the claim that physics *forbids* a preferred frame. If a future theory restores a preferred frame (even if empirically hidden at low energies, à la Lorentz's original ether theory), Premise 2 collapses.

  **Nuance:** Most philosophers of physics distinguish between *empirical equivalence* and *ontological commitment*. Even if a Neo-Lorentzian theory is empirically equivalent to SR, many argue we should prefer the ontology of SR (no ether) due to parsimony (Occam's Razor). However, if the *laws themselves* are simplest in a preferred frame (not just the phenomena), the motivation for eternalism shifts from "Physics demands it" to "Metaphysics prefers it."

  **Severity:** This doesn't prove eternalism false, but it removes the "scientific proof" aspect of RP. It reduces eternalism to a metaphysical choice rather than a physical deduction.

  #### D. The "Verbal Collapse" (Quantifier Variance)
  *Status: Fatal to the *significance* of the conclusion.*

  This is the worry you flagged as moving you the most. It stems from Carnap and has been revitalized by Ted Sider and others.

  **The Worry:** What does "exists" mean?
  *   **Eternalist Quantifier:** $\exists x$ means "x exists at some time $t$." (Under this definition, eternalism is trivially true by the definition of the spacetime manifold).
  *   **Presentist Quantifier:** $\exists x$ means "x exists *now*." (Under this definition, eternalism is false).

  If the dispute is merely about which quantifier to use, then RP is just a linguistic stipulation. Putnam assumes that if an event is in the manifold, it "exists." A presentist can agree the event is *in the manifold* (as a mathematical representation) but deny it *exists* (as a concrete entity).

  **Why this is a deep problem:** If eternalism is true by definition of the spacetime model, it loses its explanatory power. It doesn't tell us about the *nature* of time; it just tells us how we decided to use the word "real."

  **Specialist Consensus:** Most realists (both presentists and eternalists) try to dodge this by claiming there is a "joint-carving" quantifier—a fundamental way the world is that makes one definition correct. But if you accept quantifier variance, the RP argument dissolves into semantics.

  ---

  ### 3. Ranking the Defeaters

  Here is how I would rank these objections based on their ability to defeat the **Rietdijk–Putnam argument specifically** (not necessarily eternalism as a whole).

  1.  **Fatal: The Transitivity/Stein Objection.**
      *   **Reason:** It demonstrates that the logical inference from "relativity of simultaneity" to "block universe" is invalid without adding a hidden premise (that reality is transitive across spacelike separation). Once you add that premise, you are begging the question against the presentist. RP does not *prove* eternalism; it assumes a version of it to get the conclusion.
  2.  **Fatal (Conditional): The Topology Objection.**
      *   **Reason:** If the universe is compact, there is a preferred frame. RP relies on the absence of a preferred frame. If the universe is a torus, RP fails. (Though this depends on contingent cosmology).
  3.  **Serious: The Verbal Collapse.**
      *   **Reason:** This suggests the conclusion is trivial. If "real" just means "coordinate in the manifold," the presentist can agree without conceding the ontological point. It turns a metaphysical victory into a semantic stipulation.
  4.  **Awkward: The Neo-Lorentzian Possibility.**
      *   **Reason:** This removes the *physical* necessity of eternalism but leaves the *metaphysical* possibility open. It forces the eternalist to argue from parsimony rather than deduction.

  ---

  ### 4. Consensus vs. Contention: A Map for the Philosopher

  You asked me to separate settled physics from contested metaphysics. Here is where the specialists actually stand:

  **Settled Physics:**
  *   Special Relativity is locally correct.
  *   Simultaneity is frame-relative for inertial observers.
  *   There is no *empirically detectable* preferred frame in standard SR.

  **Contested Metaphysics (Where Specialists Disagree):**
  *   **Does SR entail Eternalism?**
      *   *Consensus:* **No.** There is no consensus that SR *forces* eternalism. While many physicists lean eternalist for pragmatic reasons, philosophers of physics recognize that Presentism (specifically "Light-Cone Presentism" à la Stein) is logically compatible with SR.
  *   **Is the "Block" a physical entity or a model?**
      *   *Disagreement:* Realists about the spacetime manifold (Maudlin, Earman) treat the block as ontologically robust. Structuralists or Instrumentalists treat it as a representational tool. RP works for the former, fails for the latter.
  *   **The Meaning of "Exist":**
      *   *Disagreement:* There is no agreement on whether "existence" is tensed or tenseless. This is the core metaphysical rift that physics cannot bridge.

  ### 5. Final Assessment

  You asked what would count against your acceptance of eternalism via RP.

  **The Hard Truth:** The Rietdijk–Putnam argument, in its original form, is widely considered **invalid** by specialists due to the transitivity issue (Stein). It assumes that "reality" propagates across spacelike intervals in a way that the physics does not support.

  However, **Eternalism itself is not defeated.** It is merely decoupled from RP. Eternalists now tend to argue from:
  1.  **Truthmakers:** Statements about the future (e.g., "There will be a sea battle") are true now; therefore, the future event must exist now to ground that truth.
  2.  **Parsimony:** It is ontologically cheaper to treat time like space than to posit a mysterious "moving now."
  3.  **Spacetime Realism:** If you believe spacetime is a real substance (Substantivalism), the "block" is just the shape of that substance.

  **Recommendation:**
  If your belief rests *solely* on RP, you are on shaky ground. The transitivity objection is a genuine logical hole. However, if you view RP as a *motivation* for Eternalism rather than a *proof*, your position is standard.

  To maintain intellectual honesty:
  1.  **Concede** that RP does not logically entail eternalism (due to Stein).
  2.  **Maintain** that eternalism is the best *explanation* of SR, provided you accept a tenseless definition of existence.
  3.  **Acknowledge** that if "existence" is inherently tensed (a metaphysical claim), no amount of physics will change that, because physics deals in tenseless equations.

  The "verbal collapse" is the strongest philosophical worry. If you cannot define "real" in a way that isn't question-begging (either defining it as "in the block" or "present"), then the debate is indeed verbal. Most working metaphysicians of physics try to ground "real" in **causal efficacy** or **truthmaking**, but both routes have significant baggage.

  **Bottom Line:** RP is a classic argument, but it is not a knockdown proof. It is a strong abductive argument that fails as a deductive one. You can remain an eternalist, but you should drop the claim that SR *forces* you to be one.
