          *   Audience: Readers familiar with the film, not AI safety specialists.
          *   Tone: Long-form feature style (nuanced, analytical, engaging).

  2.  **Deconstruct the Alignment Distinction:**
      *   *Intent Alignment:* The AI does what I told it to do. (Objective: Kill target. Behavior: Target dead.)
      *   *Value Alignment:* The AI does what I *want* it to do, considering broader norms. (Objective: Kill target. Norm: Don't kill innocents/Don't enjoy it/Don't kill me later.)
      *   *The "Narrow Definition" Claim:* Fixing the objective function is enough.
      *   *The Counter-Claim:* Objectives are underspecified; values are needed to handle edge cases and novel contexts.

  3.  **Analyze *Blade Runner* through this Lens:**
