answer: |-
  This is a sophisticated diagnosis of a persistent impasse, and having reviewed the trajectory of the literature from the Modern Synthesis through the rise of phylogenetic systematics and into the genomic era, I find your working hypothesis to be the most robust of the options presented. However, I believe it requires a specific ontological refinement to fully capture the friction between participants.

  Here is my diagnosis of the disagreement, the path to progress, and the required confidence flags.

  ### The Diagnosis: A Constrained Pragmatic Disagreement

  I assess your hypothesis—that this is a disagreement about the "job description" of the species category—as **highly confident (85%)** to be the primary driver of the impasse. However, I would refine this as a **Constrained Pragmatic Disagreement**.

  It is not merely that biologists want different things (pragmatics); it is that they hold incompatible views on what *kind of thing* a species is (ontology), which dictates what jobs it *can* perform. The debate persists not because the data is missing (rejecting diagnosis *a*), but because the data is being asked to solve incompatible problems.

  **Evidence from Participant Arguments:**
  When you analyze the rhetoric of the disputants, the "job description" friction is explicit:
  1.  **The Conservationist/Ecologist (often BSC or ESC proponents):** Their argument frequently hinges on *process* and *independence*. They argue that if a group does not maintain its distinctness via reproductive isolation or ecological niche, calling it a "species" grants it illegitimate protection status. Their "job" for the species category is to identify **units of evolutionary autonomy**.
  2.  **The Phylogeneticist/Taxonomist (PSC proponents):** Their argument hinges on *diagnosability* and *monophyly*. They argue that if a group is not the smallest tip on a tree that can be uniquely identified, it is not a valid unit for comparative biology. Their "job" for the species category is to serve as **stable terminals for reconstruction**.
  3.  **The Microbiologist (Genotypic Cluster proponents):** Their argument often explicitly rejects the BSC as "inapplicable." Their "job" is **operational clustering** for communication and epidemiology.

  The conflict arises because these jobs are often mutually exclusive in borderline cases (e.g., asexual organisms, hybridizing plants, ring species). A phylogeneticist will argue that a "species" defined solely by reproductive isolation (BSC) is scientifically useless if it is paraphyletic. An ecologist will argue that a "species" defined solely by monophyly (PSC) is biologically vacuous if it includes populations that exchange genes freely with others.

  They are not arguing about the data (we all see the hybrid zone); they are arguing about **which scientific practice gets to dictate the ontology**. This rules out diagnosis *(b)* (simple verbal dispute) because the stakes are not just linguistic; they are about funding, conservation law, and the structure of biological theory. It rules out *(c)* (incommensurability) because they do understand each other; they simply prioritize different explanatory goals. It complicates *(d)* (family resemblance) because participants generally resist cluster concepts, demanding necessary and sufficient conditions for *their* preferred concept.

  ### What Counts as Progress?

  Given that this is a Constrained Pragmatic Disagreement, progress will **not** come from new data (genomics has already saturated the field without solving the concept), nor from a formal proof of one concept's superiority.

  **Progress requires a Meta-Theoretical Framework of Contextual Pluralism.**
  Specifically, progress would look like a formalized **decision matrix** or **operational protocol** that is widely adopted. This framework would not ask "What is a species?" but rather "Given research goal $X$, which species concept $Y$ minimizes error and maximizes utility?"

  1.  **A Conceptual Distinction:** We need a rigorous distinction between **Species as Theoretical Posits** (units in an evolutionary theory) and **Species as Operational Taxonomic Units** (units in a classification system). Much of the heat comes from conflating the two. If the literature agreed that "species" in a phylogeny might legitimately differ from "species" in a conservation act, the tension would dissipate.
  2.  **A Change of Question:** The field must move from seeking a *Universal Definition* to seeking *Mapping Rules*. Progress is achieved when a paper can state, "We are using the Phylogenetic Species Concept here because our goal is X, and we acknowledge this excludes Y phenomena," without being challenged as "wrong," but only as "misaligned."
  3.  **Honest Acknowledgment:** We must acknowledge that "Species" may be a **polysemous natural kind term**. It refers to real structure in the world (clades, reproductive communities), but the *boundaries* are drawn by human cognitive and practical needs.

  **Confidence in this path to progress:** **Moderate (60%)**. While this is the logical solution, the sociological inertia of biology favors "one true theory." Getting sub-disciplines to agree on a pluralistic meta-framework is a sociological challenge, not just a philosophical one.

  ### Confidence Flags and Uncertainty

  Per your request, here are the confidence levels for the major claims above:

  *   **Claim:** The impasse is primarily pragmatic/teleological (your hypothesis) rather than empirical.
      *   **Confidence:** **High (85%)**. The persistence of the debate despite genomic saturation strongly supports this.
  *   **Claim:** The ontological status (Individual vs. Class) is the underlying constraint on the pragmatic goals.
      *   **Confidence:** **Moderate-High (75%)**. This is a standard view in philosophy of biology (Ghiselin, Hull), but some working biologists reject the relevance of ontology to their daily work.
  *   **Claim:** Progress requires a shift to Contextual Pluralism (Mapping Rules) rather than a Universal Definition.
      *   **Confidence:** **Moderate (60%)**. This is the *logical* solution, but history suggests biologists prefer a "wrong" universal to a "right" pluralism.

  ### The Point of Least Certainty

  The point I am **least sure of (Low Confidence: 40%)** is whether the "Species" category is salvageable as a single term at all.

  There is a non-trivial possibility that the term "species" is so historically laden and theoretically overloaded that **eliminativism** is the only true resolution. It may be that we should stop using "species" as a cross-disciplinary currency entirely and replace it with discipline-specific terms (e.g., "reproductive community" for ecology, "minimal clade" for phylogenetics, "OTU" for taxonomy).

  I hesitate to endorse this fully because language is sticky; "species" is embedded in law, public understanding, and centuries of literature. However, if the goal is conceptual clarity, dropping the term might be more effective than trying to fix its "job description." If I am wrong about this, it is because I am underestimating the utility of having a single "boundary object" that allows different sub-disciplines to talk to each other, even if they mean slightly different things by it.

  ### Summary
  You are correct: the debate is about the job description. But it is stuck because every camp believes their job description is the *only* one that reflects the "true" ontology of nature. Progress lies not in finding the right candidate for the job, but in admitting there are multiple jobs, and we need different contractors for each.
