  **The Scenario**
  A shady bookmaker offers you a choice between walking away with a guaranteed **$100** or playing "The Cubic Raffle." In the raffle, a machine draws a single integer ticket $n \ge 1$ from an infinite urn where the probability of drawing $n$ is $P(n) = \frac{6}{\pi^2 n^2}$ (a valid distribution summing to 1). The payoff is determined by the number on the ticket: if $n$ is **not** a perfect cube ($1, 8, 27, 64...$), the bookmaker pays you **$n**; if $n$ **is** a perfect cube, you must pay the bookmaker **$n**. All payoffs are finite dollar amounts transferable by wire, and the draw terminates instantly. The bookmaker claims the game is in your favor because wins are far more frequent than losses, but a mathematician warns that the expected value is undefined.

  **Analysis**

  **1. The Status of Expected Value**
  Maximize-Expected-Value (MEV) offers no guidance here because the expectation is mathematically undefined. To calculate EV, we sum the probability-weighted payoffs: $\sum P(n) \cdot \text{Payoff}(n)$. Since $P(n) \propto 1/n^2$ and $\text{Payoff}(n) = \pm n$, each term in the series scales as $\pm \frac{1}{n}$.
  *   **Positive Part:** The sum over non-cubes is roughly $\sum \frac{1}{n}$, which diverges to $+\infty$.
  *   **Negative Part:** The sum over cubes ($n=k^3$) is $\sum \frac{1}{k^3} \cdot k^2 = \sum \frac{1}{k}$, which also diverges to $+\infty$ (in magnitude).
  Because both the positive and negative expectations diverge, the total expectation is undefined (Riemann rearrangement theorem applies). You can reorder the terms to make the sum equal any real number, or $\pm \infty$. MEV is silent.

  **2. The Failure of Naive Truncation**
  A naive agent might calculate the partial sum up to some large $N$ (e.g., the maximum ticket number the bookmaker's computer can display). Because perfect cubes are sparse (density $\approx N^{-2/3}$), the positive terms vastly outnumber the negative terms for any computable $N$.
  The partial sum $S_N \approx \sum_{n=1}^N \frac{1}{n} - \sum_{k=1}^{N^{1/3}} \frac{1}{k} \approx \ln(N) - \frac{1}{3}\ln(N) = \frac{2}{3}\ln(N)$.
  For any $N$ a human can compute, $S_N$ is positive and growing. Naive truncation suggests the game has a **large positive expected value**, strongly recommending the gamble over the $100 sure thing. This points the "wrong way" because it ignores the structural risk in the tail.

  **3. The Intuitive Answer and Fallback Rules**
  The intuitively right answer is to **take the $100 sure thing**. This conclusion is supported by **bankroll considerations (Risk of Ruin)** and **bounded utility**.
  *   **Bankroll:** While the probability of drawing a large cube is small, the loss scales linearly ($n$). If you draw $n=1,000,000$ (not a cube), you win $1M. If you draw $n=1,000,000,000$ (a cube), you lose $1B. For any agent with finite wealth, there exists a cube $k^3$ large enough to bankrupt them. Since the negative expectation diverges, the "weight" of these ruinous tails is infinite.
  *   **Stochastic Dominance (Bounded):** If we assume a realistic, bounded utility function (e.g., log wealth), the utility of the massive losses dominates the utility of the frequent small wins. The expected *utility* converges to a finite negative number, whereas the sure thing offers positive utility.
  *   **Structural Feature:** The work is done by the **harmonic divergence** ($\sum 1/n$) combined with **sparse negative clustering**. The harmonic series grows slowly enough that truncation looks safe, but diverges strongly enough to break EV.

  **4. Collapse of the Case**
  If you remove the harmonic divergence (e.g., change payoff to $\sqrt{n}$ so terms scale as $1/n^{1.5}$), the expectation becomes absolutely convergent and defined (and likely negative due to the cube losses). If you remove the sparse clustering (e.g., alternate signs every ticket), the partial sums oscillate ($\ln N$ vs $-\ln N$), making the truncation error obvious rather than misleading. The specific combination of slow divergence and sparse losses is required to hide the undefined nature from a truncation check.

  **Defense and Critique**
  An EV-maximizer might object: "This schedule is unimplementable. No bookmaker has infinite capital to cover the tail of the loss distribution, so the game is void." This defense attempts to dissolve the paradox by claiming the payoff function cannot exist in reality. However, this objection applies *more* strongly to the original Pasadena Game. In Pasadena, payoffs scale as $2^n$; by $n=100$, the payoff exceeds the number of atoms in the universe. In The Cubic Raffle, payoffs scale as $n$; a payoff of $10^9$ (one billion dollars) is large but well within the realm of "money a person could in principle be handed" by a wealthy institution. If the EV-maximizer rejects The Cubic Raffle due to tail risk, they must *a fortiori* reject the Pasadena Game. Therefore, this version survives the "unimplementable schedule" critique better than the original, forcing the EV-maximizer to either accept undefined EVs as actionable (which breaks decision theory) or admit that EV maximization is incomplete for heavy-tailed distributions.
