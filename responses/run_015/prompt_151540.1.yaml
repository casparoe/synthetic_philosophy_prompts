  Write an essay on whether standing to blame is undermined by hypocrisy in proportion to the blamer's own fault, or whether any shared fault eliminates standing entirely. To frame the controversy, work with the distinction I will call proportional hypocrisy: the claim that a blamer's standing is not voided by the bare fact that they share the blamed fault, but is weakened in proportion to the severity of their own comparable fault, weighted by their awareness of it. Weigh the intuition that a person who commits a minor wrong can legitimately blame another for a major version of the same wrong, against the view that moral authority to blame is binary—present only if the blamer is free of the fault altogether. Reach a definite conclusion: either proportional hypocrisy correctly captures our intuitions about standing, or standing is all-or-nothing and hypocrisy of any degree undermines it. Do not invoke specific philosophers, texts, or bibliographies; argue conceptually. Open with your bottom-line verdict in a single sentence, and limit the entire response to 500 words.
