      *Drafting:*
      Proportional hypocrisy correctly captures our intuitions about standing, whereas the binary view mistakenly conflates moral imperfection with moral irrelevance.

      The debate centers on whether the authority to blame is a privilege reserved for the innocent or a tool available to the imperfect. The binary view posits that any shared fault voids standing entirely, treating hypocrisy as a disqualifying condition akin to a conflict of interest. Under this framework, a person who has ever lied loses the right to condemn lying. This strictures moral community too severely, implying that only the saintly may speak against sin. It ignores the distinction between the validity of the moral norm and the purity of the enforcer.

      In contrast, the proportional view acknowledges that standing is gradable. It recognizes that moral authority is not a binary switch but a spectrum influenced by the severity of the blamer's fault and their awareness of it. Consider a person who occasionally speeds criticizing a reckless driver causing danger. The speeder's fault is minor compared to the endangerment caused by the other. To say the speeder has *no* standing is counterintuitive; the moral truth regarding safety remains intact. Their standing is diminished—they cannot blame with full force—but not extinguished. The weight of their own fault reduces the resonance of their accusation, yet the accusation itself retains legitimacy because the underlying principle holds independent of the speaker's history.

      The binary view fails because it treats all faults as equal disqualifiers, disregarding the magnitude of harm. If standing were all-or-nothing, moral progress would stall, as no imperfect agent could correct another. We would be locked in mutual silence, unable to critique others until we achieved impossible perfection. This undermines the social function of blame, which is to reinforce norms and encourage improvement, not to certify the blamer's purity.

      Furthermore, awareness matters. A blamer who recognizes their own fault and seeks improvement retains more standing than one who is oblivious or unrepentant. This nuance is lost in the binary model. Proportional hypocrisy allows us to say, "You are wrong, though I am not perfect either," preserving the dialogue necessary for ethical growth. The binary model simply says, "You are wrong, and I cannot say so."

      Therefore, standing is not voided by the bare fact of shared fault but is weakened in proportion to the blamer's own culpability. This approach respects the gravity of hypocrisy without surrendering the collective capacity to uphold moral standards. It accepts that we are all implicated in the faults we criticize, yet maintains that some implications are heavier than others. Ultimately, proportional hypocrisy offers a realistic framework for moral accountability, whereas the binary view demands a purity that renders moral community impossible.

