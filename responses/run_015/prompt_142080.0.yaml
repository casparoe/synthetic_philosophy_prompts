  **Rule 1: The "Retention + Correction" Constraint (Deontological)**
  *   **The Rule:** You should defer to your future self if and only if: (a) you lose no *substantive* evidence between now and then, and (b) any processing errors in the future self are either absent or predictable and correctable by you now.
  *   **How it fits the six:**
