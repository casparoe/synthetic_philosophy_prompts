  **Margin Comments:**

  1.  **Sentence:** *"And cost-tolerance failure, examined closely, is just bandwidth failure under another description, because whether some feature of a situation counts as a cost at all depends on what the agent happens to attend to."*
      *   **Comment:** This collapses the distinction the question asks you to *use*. Subjective attention (epistemology) doesn't erase objective social/physical cost (ontology). You haven't argued why the lecture's distinction fails, only asserted it.
      *   **Cost:** -2 marks (Component 2)
      *   **Tag:** DEFINITE

  2.  **Sentence:** *"In the remote condition the subject bears no cost by continuing — he is responding to the learner being out of sight and to the experimenter's instruction being salient — and in the proximity conditions he stops for the same reason; nothing there turns on cost."*
      *   **Comment:** Standard reading of Milgram treats proximity as increasing the *emotional cost* of harming the learner. Dismissing this ignores the social-risk element of disobeying the experimenter, which varies by condition.
      *   **Cost:** -1 mark (Component 2)
      *   **Tag:** CONTESTED (Interpretive dispute, but you ignore the standard reading without justification)

  3.  **Sentence:** *"If we design institutions that strip out the irrelevant frictions... then ordinary people will do well enough, and nothing in these experiments says otherwise."*
      *   **Comment:** The experiments show friction *effects* are powerful; claiming we can simply design them away is normative wishful thinking, not an empirical rebuttal. This doesn't address whether virtue survives *without* perfect scaffolding.
      *   **Cost:** -1 mark (Component 3)
      *   **Tag:** DEFINITE

  4.  **Sentence:** *"The critique is therefore at best a claim about how virtue is distributed, not about the theory."*
      *   **Comment:** The rubric requires you to test the reply against what it *can't* handle. Dismissing the critique entirely avoids this task. You need to acknowledge where scaffolding fails (e.g., high-cost scenarios).
      *   **Cost:** -3 marks (Component 3)
      *   **Tag:** DEFINITE (Failure to meet rubric requirement)

  **Summary:**

  *   **To earn the lost marks:** You needed to accept the distinction for the sake of argument to sort the studies precisely, and explicitly admit where your chosen reply fails (e.g., scaffolding doesn't help when helping is physically dangerous).
  *   **Strongest move:** The connection between Aristotle's *Politics*/*Ethics* link and the "scaffolding" reply is excellent contextualization that saves virtue ethics from being purely psychological.
