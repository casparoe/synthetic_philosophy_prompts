  6.  **Final Polish:** Ensure the flow is logical. Start with the Ministry, move to Ritual, then Evidence, then Proles, then Room 101. Then the theoretical limits. Then the falsification/vulnerability.

      *   *Thought on "Anti-Tradition":* Hobsbawm talks about inventing tradition to legitimize. Orwell's Party legitimates through *illegitimacy* of all other claims. It's not "we are the heirs of the Revolution" (which would be invented tradition); it's "the Revolution is ongoing and undefined." Actually, the Party *does* claim continuity with the Revolution, but constantly redefines the Revolution. So it is anti-tradition in the sense that the *content* of the tradition is mutable.
