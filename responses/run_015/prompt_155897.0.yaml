      *   **Specific Scenes/Choices to Examine:** Winston's record correction, Two Minutes Hate, the photograph (evidence of alternative past), Room 101 (destruction of private memory).
      *   **Key Questions:** Where does the lens work? Where does Orwell resist reduction to nation-building theory? Does the novel suggest imagined communities need stable epistemic infrastructure? Does destabilization lead to a managed population lacking collective self-imagination?
      *   **Falsification Conditions:** What would change my mind about this reading? (Evidence for authoritarian tradition preservation vs. destruction; proles as authentic national consciousness vs. absence).
