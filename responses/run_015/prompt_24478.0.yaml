answer: |-
  Your instincts are excellent. You don't need a philosophy degree to spot that your friend's summary is a "telephone game" version of a complex debate. He has grabbed the right names and the right general topic, but he has flattened the nuances, mixed up opposing theories, and added some dramatic flair that isn't in the original texts.

  Here is a piece-by-piece breakdown of what is accurate, what is distorted, and how a philosopher defending each view would correct him.

  ### 1. The Radford Claim
  **Friend's Summary:** *"Colin Radford proved in 1975 that if you cry over Anna Karenina you are literally crazy, because emotions have to be about real things..."*

  *   **What's Accurate:** Colin Radford did write the seminal paper *"How Can We Be Moved by the Fate of Anna Karenina?"* in 1975. He did argue that there is a logical inconsistency in our emotional responses to fiction. He relies on the "Cognitive Theory of Emotions," which posits that to feel fear or sadness, you must believe the object of that fear or sadness exists.
  *   **The Distortion:** Radford never claimed people are **"literally crazy."** He argued that our responses are **irrational** or **inconsistent**. There is a big difference between a philosophical claim about rationality and a clinical claim about sanity. Radford acknowledged that we *do* feel the emotions (that's the paradox), but he argued that holding the belief "Anna doesn't exist" and the feeling "I am sad for Anna" simultaneously is logically incoherent.
  *   **How Radford Would Push Back:** "I am not diagnosing you with a mental illness. I am pointing out that human beings are capable of holding inconsistent beliefs and feelings. It makes us irrational, not insane."

  ### 2. The Walton Claim
  **Friend's Summary:** *"Kendall Walton's idea of quasi-emotions, which are just real emotions renamed, like how a toy sword is still a sword."*

  *   **What's Accurate:** Kendall Walton (in *Mimesis as Make-Believe*) is the most famous responder to Radford. He did coin the term **"quasi-emotion."**
  *   **The Distortion:** The analogy is backwards. **A toy sword is *not* a real sword.** That is the entire point of Walton's argument. He argues that while you might have the physiological sensations of sadness (tears, tight chest), you lack the **motivational component** of real sadness.
      *   *Real Sadness:* If you are sad because your friend died, you are motivated to call their family, go to the funeral, etc.
      *   *Quasi-Sadness:* If you are sad because Anna Karenina died, you do not call the police or try to save her. You stay in your chair.
      *   Walton argues that because the "action tendency" is missing, it is a different *kind* of state, not just a real emotion renamed.
  *   **Addressing Your Worry:** You mentioned you don't want to be told you're "faking it." Walton would agree with you there. He isn't saying your tears are fake. He is saying the *category* of the experience is different. It's not a lie; it's a game of make-believe where your body produces real sensations in service of the imagination.
  *   **How Walton Would Push Back:** "I am not saying the feelings are 'fake.' I am saying they function differently. A toy sword can hurt you if you swing it hard enough, but it isn't a weapon. Similarly, quasi-emotions feel real, but they don't compel action like real emotions."

  ### 3. The Currie & Lamarque Claim
  **Friend's Summary:** *"Greg Currie says we're just imagining that we're feeling the emotions, and some philosopher named Lamarque used Wittgenstein to argue that 'real emotion' is only a label from a language game..."*

  *   **What's Accurate:** Greg Currie does argue for a simulation theory (we simulate the psychological state). Peter Lamarque does use Wittgensteinian aesthetics to suggest that the "paradox" is a confusion about how we use language.
  *   **The Distortion:** This part is actually the most accurate section of your friend's summary, though it glosses over the depth. Currie doesn't say we imagine *feeling*; he says we imagine the *situation* which causes the feeling. Lamarque's point is that the paradox only exists if we think language works like a scientific measurement tool, rather than a social tool.
  *   **How They Would Push Back:** Currie would clarify that the simulation is a cognitive process, not just "pretending to feel." Lamarque would argue that the paradox dissolves entirely once we understand the "institution" of literature—we aren't supposed to treat fiction like reality, so asking if the emotion is "real" in the factual sense is the wrong question.

  ### 4. The "Solution" Claim
  **Friend's Summary:** *"So the paradox is basically solved: the feelings are real, they're just pointed at the book instead of at Anna..."*

  *   **What's Accurate:** This sounds like a specific solution known as **"Thought Theory"** (championed by philosophers like Noel Carroll). It argues we are moved by the *thought* of Anna, not Anna herself.
  *   **The Distortion:** Your friend presents this as the **consensus**. It is not. Walton (quasi-emotion) explicitly denies the feelings are "real emotions." Radford (irrationality) denies the feelings are rational. Your friend has taken one specific solution (Thought Theory) and pretended it is the final verdict that everyone agrees on.
  *   **Addressing Your Worry:** You were right to be suspicious of the "pointed at the book" line. Most philosophers agree emotions are intentional (they are *about* something). The debate is whether they can be about *non-existent* things. Saying they are "pointed at the book" is a way to solve the existence problem, but it's not the only solution.

  ### 5. The Conclusion
  **Friend's Summary:** *"...and the whole debate was philosophers splitting hairs."*

  *   **Does this follow?** No.
  *   **Why:** This debate is not just about movies; it is about the **Philosophy of Mind**.
      *   If Radford is right, human rationality is fundamentally broken.
      *   If Walton is right, there are distinct categories of mental states that feel identical but function differently (which matters for psychology and AI).
      *   If Lamarque is right, then many philosophical problems are just linguistic confusions.
      *   These are massive stakes. Calling it "hair-splitting" is a way to dismiss the importance of defining what a "human emotion" actually is.

  ### Summary Verdict for You
  Your friend's summary is a **caricature**. He has taken a complex, ongoing debate and turned it into a story with a neat ending that doesn't exist.

  1.  **On Radford:** You are right. Radford said "irrational," not "crazy."
  2.  **On Walton:** You are right to be bothered. Walton *does* distinguish quasi-emotions from real ones, but not to call you a liar. He does it to explain why you don't run onto the stage to save the actor. However, your friend's analogy ("toy sword is still a sword") is wrong; Walton says a toy sword is *not* a sword.
  3.  **On the Solution:** You are right. There is no agreed-upon solution. The "pointed at the book" theory is just one contender.
  4.  **On Hair-Splitting:** This is a dismissal, not an argument. The debate matters because it defines what we think emotions *are*.

  **How to reply to your friend:**
  "Radford didn't call us crazy, he called us irrational. Also, Walton's point about quasi-emotions is that a toy sword *isn't* a real sword, which is why he thinks the emotions aren't fully 'real' in the motivational sense. And there isn't actually a consensus that the emotions are 'pointed at the book'—that's just one theory among many. It seems like the debate is more about defining the nature of emotion than just splitting hairs."
