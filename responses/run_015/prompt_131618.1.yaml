  # Emergency Pricing Integrity Protocol (EPIP)
  **Version:** 1.0 | **Execution Time:** <30 Minutes | **Authority:** Emergency Resource Allocation Board
  **Purpose:** To distinguish between permissible scarcity pricing and repugnant commodification during declared emergencies.
  **Audit Requirement:** Every decision must be logged with the specific EPIP Step ID, the Operator's justification, and (if applicable) the Board Chair's Value Judgment Sign-off.

  ---

  ## PART I: THE OPERATIONAL CHECKLIST

  **INSTRUCTION:** Complete the following three steps in order. Do not proceed to the next step if a terminal decision is reached. All answers must be documented with evidence (e.g., product specs, contract clauses, market comparisons).

  ### STEP 1: SUBSTITUTABILITY & HARM THRESHOLD
  **Question:** Can the buyer delay, substitute, or forgo this good/service within the crisis window (defined as next 24 hours) without risking catastrophic harm to basic biological functioning or total loss of primary economic assets?

  *   **Test A (Biological):** Will forgoing this result in death, permanent disability, or acute physiological failure within 24 hours?
  *   **Test B (Economic):** Will forgoing this result in irreversible business closure or loss of primary residence (not merely reduced profit or temporary inconvenience)?
  *   **Test C (Partial/Intermediate):** Does this prevent economic harm but not bodily harm (e.g., a generator for a retail store vs. a ventilator)?

  **DECISION LOGIC:**
  *   **If NO to A and NO to B (Luxury/Deferrable):** → **TERMINATE: PERMISSIBLE SCARCITY PRICING.** (Document evidence of substitutes).
  *   **If YES to A (Biological Survival):** → **PROCEED TO STEP 2.**
  *   **If YES to B only (Economic Survival):** → **HALT: VALUE JUDGMENT HANDOFF.** (Flag for Board Chair. *Rationale: Weighing economic survival against market freedom is a policy choice, not an assessment.*)
  *   **If Test C (Partial):** → **HALT: VALUE JUDGMENT HANDOFF.** (Flag for Board Chair. *Rationale: Defining "catastrophic" economic harm requires value weighting.*)

  ---

  ### STEP 2: INFORMATIONAL & CONTROL ASYMMETRY
  **Question:** Does the seller possess crisis-specific control or knowledge that the buyer cannot reasonably verify or bypass, such that the price reflects leverage rather than cost?

  *   **Test A (Cost Verification):** Can the buyer verify that the price increase correlates directly to verifiable input cost increases (e.g., fuel surcharge, hazard pay)?
  *   **Test B (Market Access):** Are there at least two independent suppliers available to the buyer within the crisis window?
  *   **Test C (Algorithmic Opacity):** Is the price set by a dynamic algorithm where the supply constraints are not visible to the buyer?

  **DECISION LOGIC:**
  *   **If YES to A AND YES to B (Transparent/Competitive):** → **TERMINATE: PERMISSIBLE SCARCITY PRICING.** (Document cost verification).
  *   **If NO to A OR NO to B OR YES to C (Captive/Opaque):** → **PROCEED TO STEP 3.**

  ---

  ### STEP 3: PERSISTENCE OF STATUS MARKERS
  **Question:** Does the transaction record, display, or institutionalize access in a way that creates a lasting marker (>30 days) of who was able to pay, affecting future civic standing, credit, or access to public goods?

  *   **Test A (Record Retention):** Is the transaction data retained by a third party or government entity beyond the resolution of the immediate crisis?
  *   **Test B (Civic Impact):** Does access (or lack thereof) influence eligibility for future aid, insurance rates, or legal standing?
  *   **Test C (Visibility):** Is the distinction between payers and non-payers publicly visible or socially stigmatizing?

  **DECISION LOGIC:**
  *   **If NO to A, B, and C (Ephemeral Transaction):** → **TERMINATE: PERMISSIBLE SCARCITY PRICING.** (Document data retention policy).
  *   **If YES to A OR B OR C (Status Creation):** → **TERMINATE: PROHIBITED COMMODIFICATION.** (Document specific status risk).
  *   **If AMBIGUOUS (e.g., Short-term record with potential long-term use):** → **HALT: VALUE JUDGMENT HANDOFF.** (Flag for Board Chair. *Rationale: Predicting future misuse of data is a value judgment on trust.*)

  ---

  ## PART II: VALUE JUDGMENT HANDOFF PROTOCOL
  **Trigger:** If any Step above results in "HALT."
  **Action:**
  1.  Operator compiles Step findings into a 1-page brief.
  2.  Brief is transmitted to Board Chair.
  3.  Chair must sign off with **APPROVED** or **REJECTED** within **one hour**.
  4.  Chair's decision is final and becomes the audit record.

  ---

  ## PART III: APPLICATION TO PROPOSALS

  ### CASE 1: Dynamic Ride-Share Pricing (Evacuation)
  **Proposal:** Ride-share app triples fares during mandatory evacuation.
  **EPIP Execution:**
  *   **Step 1 (Substitutability):** **YES to Test A (Biological/Safety).** Remaining in an evacuation zone poses immediate physical risk. Public transport is suspended. *Result: Proceed.*
  *   **Step 2 (Asymmetry):** **YES to Test C (Algorithmic Opacity).** Buyer cannot verify driver availability vs. algorithmic surge. Single app dominates the zone. *Result: Proceed.*
  *   **Step 3 (Status Markers):** **AMBIGUOUS.** Ride data is retained (Test A), but does it affect civic standing? In this jurisdiction, evacuation manifests are shared with FEMA for aid eligibility. Non-evacuated persons may be flagged as "non-compliant" or "high risk."
  *   **Procedure Output:** **HALT: VALUE JUDGMENT HANDOFF.** (Step 3 Ambiguity).
  *   **Board Chair Decision:** **REJECTED (Prohibited).** Chair rules that differential evacuation access creates a "Survivor vs. Victim" status marker affecting future insurance and aid.
  *   **Audit Note:** *Free-Market Critique:* A committed free-market advocate would reject this outcome. They would argue that Step 1 conflates "safety" with "entitlement to specific transport" and that Step 3 speculates on data misuse. The procedure misfires at **Step 3**, where the definition of "Civic Standing" is too broad for objective assessment, requiring the Chair's value judgment to ban a market-clearing price.

  ### CASE 2: Private Water-Broker Contract (Sealed Bid)
  **Proposal:** Broker sells reserved tanker access via sealed bid; broker retains access records for "future verification."
  **EPIP Execution:**
  *   **Step 1 (Substitutability):** **YES to Test A (Biological).** Water is non-substitutable for biological function. *Result: Proceed.*
  *   **Step 2 (Asymmetry):** **YES to Test B (Market Access).** Sealed bid implies single source control during crisis. *Result: Proceed.*
  *   **Step 3 (Status Markers):** **YES to Test A & B.** Broker retains records explicitly for "verification." This creates a permanent ledger of who could afford water vs. who could not, likely usable for credit or future service tiering.
  *   **Procedure Output:** **TERMINATE: PROHIBITED COMMODIFICATION.**
  *   **Audit Note:** No value judgment required. The creation of a durable "solvency ledger" for a biological need meets the strict definition of Status Asymmetry.

  ### CASE 3: Hospital Pharmacy (PEP Price Hike + Charity Fund)
  **Proposal:** 40% price increase on Post-Exposure Prophylaxis; surplus directed to charity-care fund.
  **EPIP Execution:**
  *   **Step 1 (Substitutability):** **YES to Test A (Biological).** PEP is time-sensitive for contamination events. *Result: Proceed.*
  *   **Step 2 (Asymmetry):** **NO to Test A (Cost Verification).** The proposal explicitly states the surplus is *not* revenue but a transfer to charity. The "cost" to the buyer is offset by the "benefit" to the community pool.
  *   **Procedure Output:** **TERMINATE: PERMISSIBLE SCARCITY PRICING.** (Based on Step 2 mitigation).
  *   **Audit Note:** *Procedure Limit:* This outcome relies on trusting the hospital's accounting. If the charity fund is a shell, this is commodification. However, under EPIP Step 2, the *intent* mitigates the "Revenue Opportunity" clause. If the Board distrusts the hospital, this should have been a **Value Judgment Handoff** at Step 2, but the written protocol allows the charity clause to count as cost-mitigation.

  ---

  ## PART IV: LIMITATIONS & AUDIT FLAGS

  **Known Failure Mode:** The EPIP cannot objectively measure "Intent" (e.g., Case 3 Charity Fund).
  **Mitigation:** If the Operator has credible evidence of bad faith, they must override Step 2 and trigger a **Value Judgment Handoff**.
  **Chair Sign-off Requirement:** Any decision marked "Value Judgment Handoff" requires the Chair's digital signature within 60 minutes. If no signature is received, the default status is **PROHIBITED** (Precautionary Principle).

  **End of Protocol**
