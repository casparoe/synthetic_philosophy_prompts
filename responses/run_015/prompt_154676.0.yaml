answer: |-
  1. "Where I'm actually exposed"

  Your most exposed flank is the 'bundle of rights' critique. If property is merely a label for a specific set of enforceable claims—exclusion, transfer, remedy—and you advocate for enforceable claims over ideas via privacy or contract, you haven't escaped property; you've just relabelled it. This isn't merely semantic; it risks making your ontological claim idle. If the legal machinery functions identically to property rights, insisting the underlying object isn't 'property' adds no normative weight. Furthermore, your subtraction test assumes rivalry is a necessary condition for ownership. Yet, we comfortably assign property rights to non-rivalrous assets: spectrum licences, financial instruments, or easements. These do not vanish when used by another, yet we call them property. If your test dissolves these too, it over-generalises catastrophically. If it spares them but catches ideas, you owe us a principled distinction beyond physical tangibility. The fatal risk is that you are arguing metaphysics to solve a normative problem. Even if ideas aren't property ontologically, the question remains whether they should be treated as such legally. Your view conflates the two. To survive, you must show why the functional equivalence between your 'privacy rights' and standard 'property rights' doesn't collapse your distinction into mere terminology. Otherwise, you are fighting a label while accepting the substance. You need to explain why the legal protection of an idea via confidence isn't just property law in disguise. Without this, your ontological claim is irrelevant to the ethical debate. The metaphysical status of ideas matters less than the social function of the rights you assign. If you assign exclusive control, you are creating property, regardless of whether the object is a thought or a stone. Your 'Concept Link' thought experiment begs the question by assuming subtraction is the only valid metric for theft.

  2. "Awkward but survivable"

  The clearest divergence lies in independent invention. If two parties conceive the same idea separately, standard IP grants the first filer a monopoly; your view permits both to use it freely. The settling observation is simple: check the legal remedy in a double-blind invention case. If the law punishes the second inventor, your view is legally false, though perhaps morally right. Regarding the dead inventor, your view predicts no inheritable right to the idea itself, only to physical tokens. Standard law allows heirs to enforce patents post-mortem. This is empirically testable against current statutes. These aren't metaphysical mysteries but policy choices. Your view predicts a world without monopoly rents on ideas; the rival view predicts them. The awkwardness for you is explaining why the second inventor, who laboured equally, deserves no reward while the first gets none either, potentially reducing overall innovation incentives compared to a patent system.

  3. "What I'd concede vs. what I'd swat away"

  On your three persuasive points: I concede the verbal collapse risk is severe. If you grant exclusivity via confidence, you are granting property by another name. You must either reject exclusivity entirely or admit the label 'property' fits. I also concede the subtraction test struggles with trade secrets. A secret's value lies in exclusivity, not the token; stealing it leaves you with the secret but destroys its value. This looks like property damage. However, I would swat away the fairness argument. Labour alone doesn't generate ownership; mixing labour with the commons requires a proviso that others are left enough. Free-riding is unfair, but not necessarily a property violation. The ten-year labourer deserves compensation, perhaps, but not a monopoly. Finally, on over-generalisation: goodwill and secrets are indeed tricky. But you can argue these are relational rights (against specific actors) rather than property rights (against the world). If you maintain that distinction rigorously, you avoid dissolving all intangible assets, though the line remains thin. You must ensure your 'relational' defence doesn't simply reconstruct property rights through the back door of contract law.

  4. "Is the subtraction test rigged?"

  The subtraction test is rigged by definition. It defines 'taking' as 'deprivation'. But economic harm often arises from dilution, not deprivation. When someone copies your idea, you aren't deprived of the idea, but you are deprived of the scarcity value attached to it. By defining the wrong solely as loss of possession, you build the conclusion into the premise. The 'Concept Link' scenario assumes the only relevant harm is mental loss. It ignores the market harm of competition. A proper test must ask whether the originator's position is unjustly undermined, not just whether their mind is emptied. Your test rigs the game by excluding the very harm IP law seeks to prevent: unauthorized exploitation. It treats ideas as purely mental states rather than economic assets. If you accept ideas have economic value contingent on scarcity, the subtraction test fails to capture the wrong. It protects the mind but ignores the market. You need a test that accounts for value dilution, not just physical subtraction. Until you address the economic reality of scarcity, your test remains a philosophical circle. It assumes non-rivalry precludes ownership, but ownership often creates artificial scarcity. Your test denies the possibility of legitimate artificial scarcity from the outset.

  5. "Verdict"

  You haven't made the view unfalsifiable, but you have insulated it from practical critique by shifting grounds. If legal function matches property, calling it 'privacy' is a metaphysical shield, not a solution. This isn't fatal if your goal is conceptual clarity, but it is if you seek policy change. Your view stands only if you reject exclusivity rights over ideas entirely, not just the label. Otherwise, you are merely renaming property.
