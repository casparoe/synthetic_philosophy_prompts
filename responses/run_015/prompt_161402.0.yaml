answer: |-
  Your intuitions are oscillating between **Functional Decision Theory (FDT)** (which handles the muggers and twins via logical correlation) and **Goodhart's Law** (which handles the surrogates via optimization pressure). Your "No-Interested-Selector" rule fails because it conflates *adversarial selection* with *incentive misalignment*. In markets, adversaries select against you, but their incentives are aligned with *truth*. In mugging, the adversary's incentives are aligned with your *compliance*. In surrogates, the optimizer's incentives are aligned with the *proxy*, not the goal.

  Here is the repaired principle, designed to unify these cases by distinguishing between **logical control over scenario existence** and **incentive alignment of correlation generators**.

  ### The Principle of Incentive-Compatible Correlation (ICC)

  **Clause 1: Logical Control of Existence**
  *   **Rule:** When your decision algorithm logically determines whether a scenario exists or whether you are included in it, choose the output that yields the best outcome across all logical instantiations of that algorithm, regardless of causal isolation or measure.
  *   **Motivation:** This resolves **Twin**, **Plain Mugging**, and **Screening Bully**. In the Twin and Mugging cases, your decision is logically linked to the outcome. In the Screening Bully case, your decision algorithm determines whether you are approached at all. Refusing logically prevents the scenario from being profitable to deploy, saving you (and your copies) from future approaches.
  *   **Verdict:** Press the button. Pay the Plain Mugger. Refuse the Screening Bully.

  **Clause 2: Incentive Alignment of Signal Generators**
  *   **Rule:** Rely on a correlation or proxy generated by other agents only if those agents profit from the *accuracy* of the signal, not from your *response* to the signal or the *maximization* of the proxy itself.
  *   **Motivation:** This distinguishes **Prices** from **Adversarial Surrogates**. In markets, traders profit by correcting errors, making the price accurate *despite* their adversarial stance. In surrogates, the optimizer profits by driving the proxy up, even if it diverges from the goal (Goodhart). In **Self-Eroding Surrogates**, the system itself creates the divergence via optimization pressure.
  *   **Verdict:** Rely on Prices. Reject Adversarial and Self-Eroding Surrogates.

  **Clause 3: Threat Viability and Unavoidable Harm**
  *   **Rule:** Do not comply with threats where compliance is the condition for the threat's deployment (screening), unless non-compliance incurs direct, unavoidable harm to intrinsic values (including simulations of you or strangers) that outweighs the systemic cost of incentivizing the threat mechanism.
  *   **Motivation:** This resolves the conflict between **Screening Bully**, **Spiteful Mugger**, and **Indiscriminate Bully**. In Screening, compliance creates the threat. In Spiteful/Indiscriminate cases, the threat exists (or the harm occurs) independently of your compliance decision *in that moment* (or the harm is unavoidable if you refuse). You pay Spiteful/Indiscriminate to mitigate direct harm, but refuse Screening to kill the mechanism.
  *   **Verdict:** Refuse Screening Bully. Pay Spiteful Mugger. Pay Indiscriminate Bully.

  ---

  ### Verdicts on New Cases

  **Case 1: The Mild Disvalue Mugger**
  *   **Scenario:** A screening bully approaches only payers, but the threat for refusers is only mild disvalue (e.g., a loud noise) rather than torture.
  *   **ICC Analysis:** Clause 1 and Clause 3 apply. The structure is identical to the Screening Bully. The magnitude of the threat does not change the *logical control* you have over the threat's existence. Compliance still incentivizes the screening mechanism. Unless the mild disvalue is so severe it outweighs the long-term cost of training bullies to screen (unlikely for "mild disvalue"), the structural imperative dominates.
  *   **Verdict:** **Refuse.** You must maintain the disposition that makes screening unprofitable, regardless of the specific penalty, provided the penalty is not catastrophic.

  **Case 2: The Optimized Surrogate**
  *   **Scenario:** A surrogate was chosen by a search process specifically optimized to track the real objective across many distributions.
  *   **ICC Analysis:** Clause 2 applies. The "interested selector" (the search process) profited from *accuracy* (tracking), not from your response or proxy maximization. This is structurally closer to **Prices** than to **Goodhart Surrogates**. However, a caveat is required: if the system continues to *optimize* against the surrogate during deployment (online learning), it reverts to the Self-Eroding case. If the surrogate is *fixed* after the search, the correlation is robust.
  *   **Verdict:** **Rely (conditionally).** If the surrogate is fixed after the search process, rely on it. The selection pressure was for truth-tracking, which aligns with your interests. If the system continues to optimize, reject it.

  ---

  ### Overturned or Resolved Verdicts

  The ICC principle validates most of your intuition but forces resolution on one area of uncertainty:

  1.  **Low-Measure Mugging:** You stated you are "least sure" here.
      *   **ICC Resolution:** Clause 1 explicitly states that measure (fraction of copies) does not matter for logical correlation. If you pay in the Plain case, you must pay in the Low-Measure case. The correlation between your algorithm and the predictor's payout is logical, not statistical.
      *   **Action:** You should overturn your uncertainty and **Pay confidently**.

  2.  **Prices vs. Adversarial Surrogate:** You noted these "sit badly" together.
      *   **ICC Resolution:** The principle validates both verdicts but corrects the *reasoning*. You were worried that "interested selector" should rule out Prices. ICC clarifies that *what* they are interested in (Accuracy vs. Compliance) is the deciding factor. You do not need to change your verdict, but you should discard the "No-Interested-Selector" rule.

  3.  **Indiscriminate Bully:** You pay, but feel conflict with Screening.
      *   **ICC Resolution:** The principle validates paying. In the Indiscriminate case, your decision does not control whether the bully exists (Clause 1 fails), and the harm to the stranger is direct/unavoidable upon refusal (Clause 3 triggers). The conflict is resolved by recognizing the lack of logical control over the threat's existence.

  ---

  ### The Unsettled Case: Reward After Refusal

  **Scenario:** You refused the Screening Bully. A second predictor approaches, says it predicted your refusal, and offers you $10,000 for being that kind of person.

  **Analysis:**
  This is a test of whether your decision theory is **updateless** regarding your *disposition*.
  *   **The Disposition:** Your algorithm is now "Refuse Screening Bullies, Accept Rewards for Refusal."
  *   **The Screening Bully's View:** They screen for "Will Pay." Your algorithm outputs "Refuse." They do not approach you. You are safe.
  *   **The Rewarder's View:** They screen for "Refused Bully." Your algorithm outputs "Refuse." They approach and offer money. You accept.
  *   **The Conflict:** Does accepting the money change your disposition? No. It is a consequence of the disposition. Does accepting the money signal to *future* Screening Bullies that you are a "Payer"? No, it signals you are a "Refuser who takes rewards."
  *   **ICC Application:** Clause 1 (Logical Control). Your decision to take the money does not logically retroactively change your refusal. It does not incentivize the Screening Bully (who already predicted refusal). It *does* incentivize Rewarders.
  *   **Verdict:** **Take the money.**
      *   Taking the money is strictly dominant in the current branch.
      *   It does not undermine the disposition that protected you (Refusal).
      *   In fact, an algorithm that "Refuses Bullies but leaves free money on the table" is suboptimal compared to one that "Refuses Bullies and Takes Rewards." The Screening Bully only cares about the Refusal. As long as the Refusal is robust, the Reward is pure gain.

  **Summary:** Your hesitation likely stems from a fear that "taking the money" makes you look like the kind of agent who can be manipulated by money. But the Screening Bully manipulates via *threats*, not rewards. By taking the reward, you confirm you are the kind of agent who responds to incentives, but specifically *positive* ones. Since the Screening Bully relies on negative incentives (threats), your responsiveness to rewards does not make you vulnerable to them. Take the ten thousand.
