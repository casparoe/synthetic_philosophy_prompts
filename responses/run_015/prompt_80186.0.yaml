      *   *James:* Truth happens to an idea. It becomes true, is made true by events. "Cash-value." Instrumentalism. Humanistic element (satisfaction of demands). Pluralism (multiple true descriptions possible). Rejection of the "Absolute" or "Block Universe." Truth is a species of the Good.
      *   *The Conflict:* Peirce worried James's view allowed "wishing makes it so." James worried Peirce's view was too abstract/scholastic and ignored the human context of verification.
