answer: |-
  You have put your finger on exactly the right pressure point in Parfit's argument. Many readers get stuck here. Your intuition that the argument seems to rely on the Non-Reductive (Further-Fact) view is understandable, but Parfit insists the conclusion holds even if we accept the Reductive View.

  The missing piece that makes the argument work on the Reductive View is the **non-branching requirement** (or uniqueness clause).

  Here is how R and Identity come apart even on the Reductive View, and why that distinction allows Parfit to claim Identity is not what matters.

  ### 1. The Definition of Identity on the Reductive View
  You are correct that on the Reductive View, there is no "further fact" of identity over and above physical and psychological facts. However, Parfit distinguishes between the **substantive relation** (R) and the **concept of Identity**.

  Even for a Reductionist, the concept of "Personal Identity" carries logical constraints that Relation R does not. Specifically:
  *   **Relation R:** Psychological continuity + Right Kind of Cause. This relation can be **one-to-many**. (I can be R-related to two future people).
  *   **Personal Identity:** By definition, identity is **one-to-one** and **transitive**. (If A is identical to B, and A is identical to C, then B must be identical to C).

  Therefore, on the Reductive View, Personal Identity is not *just* R. It is **R + Non-Branching**.
  $$ \text{Identity} = R + \text{Uniqueness} $$

  ### 2. The Fission Case is the Key
  The standard Teletransporter case (where the original is destroyed) is actually the *easy* case. In that scenario, R holds, Uniqueness holds, and therefore Identity holds. It doesn't help separate the concepts.

  To see the gap on the Reductive View, you must look at the **Fission Case** (e.g., the Teletransporter malfunctions and creates two copies, or a brain is split and transplanted into two bodies).
  *   **Original** bears R to **Lefty**.
  *   **Original** bears R to **Righty**.
  *   **Lefty** and **Righty** are distinct people (they are not identical to each other).

  If Identity were simply R, then Original = Lefty and Original = Righty. By transitivity, Lefty = Righty. But they are two different people walking around. Contradiction.

  So, the Reductionist must say: In fission cases, **Identity does not hold.** (Or, as Parfit suggests, the question "Is it me?" is empty/indeterminate). However, **R clearly holds.** The Original is psychologically continuous with both successors.

  ### 3. Why This Shows Identity Is Not What Matters
  Parfit asks us to consider our rational concern for the future in the Fission Case.
  *   If Identity were what matters, you should be terrified in a fission case, because *you* will not exist (identity is lost due to branching).
  *   But Parfit argues (and asks us to intuit) that fission is not like death. If you knew you would fission into two successful successors, you wouldn't fear the end. You would anticipate their experiences.

  Since **R holds** (you survive in the sense that matters) but **Identity fails** (due to the branching constraint), it follows that Identity is not necessary for what matters.

  ### 4. Addressing Your "Triviality" Worry
  You wrote: *"If R and identity really are the same relation on the reductive view, then Parfit's conclusion that identity is not what matters looks trivially false."*

  Parfit's response to this is that on the Reductive View, Identity is a **composite concept**. It is made of the substantive part (R) and a formal logical part (Uniqueness).
  *   **R** carries the value (the psychological connections, the memories, the character).
  *   **Uniqueness** is just a logical rule about counting.

  Parfit's claim is that the *value* lies entirely in the R-part. The Uniqueness-part is ethically inert. When we say "Identity is not what matters," we mean that the *concept* of Identity includes a constraint (Uniqueness) that is irrelevant to our prudential concern.

  Even if you are a Reductionist, you might mistakenly think that because Identity is defined by R (plus uniqueness), you must care about the whole package. Parfit is arguing you should care only about the R-component, and disregard the uniqueness constraint.

  ### 5. Why the Argument Isn't *Only* Against Non-Reductionism
  You suspected the argument only has bite against the Non-Reductive view. It does have a specific job there: it shows we don't need a "Further Fact" to explain survival. If R is what matters, and R can hold without a Further Fact, then the Further Fact is unnecessary.

  But the argument *also* has bite against the Reductionist. A Reductionist might concede there is no Ego, but still insist: "Okay, but *Identity* (R + Uniqueness) is still what matters prudentially." Parfit's Fission argument is designed to break that link. It shows that even if you reject the Ego, you should still stop caring about the *concept* of Identity, because the "Uniqueness" clause makes Identity fail in cases where we clearly still survive.

  ### Summary
  You weren't missing the text, but you were perhaps underestimating the role of **branching**.
  1.  **On the Reductive View:** Identity $\neq$ R. Identity = R + Non-Branching.
  2.  **In Fission:** R holds, but Identity fails (because Branching occurs).
  3.  **The Conclusion:** Since we survive (in the sense that matters) during Fission, R is what matters, not Identity.

  The "bite" of the argument is that it forces the Reductionist to admit that the concept of Personal Identity includes a formal constraint (one-to-one) that has no deep significance for survival. We should care about **Relation R**, and let the concept of Identity fall away.
