  Here is the example you asked for, followed by my position.

  **The Example: PTSD and the Retroactive Rewrite of War**

  Consider the introduction of Post-Traumatic Stress Disorder (PTSD) in the DSM-III in 1980. Before this label existed, soldiers from WWI and WWII were diagnosed with "shell shock," "combat fatigue," or "gross stress reaction." Many of these veterans were long dead or elderly by the time PTSD was codified.

  However, once the category of PTSD became established, clinicians and historians began combing through old medical archives. They re-interpreted the symptoms of dead soldiers through the new lens. A case file from 1917 that originally read "hysterical paralysis" was retrospectively coded as PTSD. The historical prevalence of trauma disorders skyrocketed, not because the soldiers changed (they were dead), but because the *record* was rewritten to fit the new kind. The past was medically colonized by the present diagnosis.

  **The Position: This Fails Hacking's Model**

  I am taking the side of your friend, but with a sharper edge: **This is not a looping effect.** It is *retroactive projection*, and calling it "looping" dilutes the critical power of Hacking's original insight.

  Here is why you must reject this as a true loop. Hacking's theory of "interactive kinds" rests entirely on **agency**. The core of the looping effect is that human beings are not passive specimens like rocks or stars; they hear how they are classified, and that knowledge changes how they act, which in turn forces the classification to change. The loop is closed by the *person* reacting to the *label*.

  In your scenario, the loop is broken because the subject is absent. A dead soldier cannot know they are now a "PTSD patient." They cannot alter their behavior, adopt the identity, or resist the diagnosis. The classification changes the *description* of the person, but it does not change the *person*. In Hacking's ontology, there is a massive difference between changing the map and changing the territory. Your example shows the map being redrawn over old territory; a true looping effect shows the territory shifting because of the map.

  If we accept your version as "looping," then every time a historian re-interprets the past, we have a looping effect. That makes the term useless. It conflates *epistemology* (what we know about the past) with *ontology* (what people actually are). Hacking's point was specifically about the ontological instability of human kinds. When clinicians rewrite old files, they are engaging in theory-laden observation, which is standard science, not the unique sociological feedback loop Hacking identified.

  To defend your view is to suggest that categories loop on their own, independent of human interaction. But categories don't loop; *people* loop *through* categories. Without the living subject to complete the circuit—to feel the weight of the diagnosis and move differently because of it—you only have a one-way street. The label changes the history, but the history cannot talk back. That isn't a loop; it's just revisionism.

  Your friend is right about the mechanism, even if you are right about the phenomenon existing. Keep the distinction. It matters because looping implies that patients have power to shape their own diagnosis. Retroactive rewriting implies that clinicians have the power to reshape the past. Those are very different political realities.
