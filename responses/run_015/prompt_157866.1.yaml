answer: |-
  There is no canonical term in general philosophy of science that captures this specific failure mode, though within historical Jesus studies it is the standard logical critique of the Criterion of Dissimilarity. Existing statistical concepts miss the mark: **Selection Bias** implies accidental sampling error; **Survivorship Bias** implies external preservation factors; **Conditioning on a Common Effect** (collider bias) predicts spurious correlations between independent variables, not necessarily a shift in central tendency toward eccentricity.

  I propose the label **Systematic Residualization**.

  **Definition**
  A methodological skew occurring when inclusion criteria function as negative filters against contextual continuity. The procedure systematically excludes data points exhibiting features typical of the background context, leaving a residue of atypical items. Consequently, the reconstructed aggregate converges on eccentricity rather than representativeness, rendering contextualization impossible because the necessary links to the background have been methodologically severed.

  **Distinction from Established Biases**
  The crucial difference between Systematic Residualization and standard Selection Bias is the *source* of the unrepresentativeness. In standard selection bias, the sample is unrepresentative due to access or preservation accidents (e.g., only stone tools survive). In Systematic Residualization, the sample is unrepresentative because the *rule of authentication* defines authenticity as difference from the context. The better the rule works, the more skewed the result becomes. This is not a failure of execution but a logical consequence of the criterion's design. Unlike collider bias, which generates correlations among causes of the selection variable, Systematic Residualization generates a mean shift in the selected variable itself (toward uniqueness).

  **Generalizability and Content-Directedness**
  You asked whether this generalizes to any filter whose output is a residue. It does not. The phenomenon requires the selection rule to be **content-directed** and **negative**. 
  1.  **Content-Directed:** A random filter leaving a residue produces noise, not eccentricity. The skew toward the *atypical* requires the rule to "detect" typicality (e.g., Jewish idiom, community utility) and reject it. 
  2.  **Negative:** A filter selecting for positive markers (e.g., multiple attestation) yields a representative sample *if* the markers are neutral regarding content. Systematic Residualization occurs only when the filter targets features associated with typicality for exclusion.

  **Look-Alikes**
  *   **Accidental Loss:** If typical material is lost due to decay, this is Survivorship Bias. The skew is accidental, not methodological.
  *   **Assimilation Bias:** The inverse problem, where criteria select *for* continuity (e.g., coherence), yielding a figure indistinguishable from the background.
  *   **Collider Bias:** Structurally similar (conditioning on a variable), but explains correlations between independent causes rather than a drift toward the margins of the distribution.

  **Footnote Usage**
  For your purposes, a definition tight enough for a footnote would read:

  > "This procedure risks **systematic residualization**: a skew wherein negative authenticity criteria filter out material exhibiting contextual continuity, leaving a residue too eccentric to support reliable contextual inference. Unlike standard selection bias, this unrepresentativeness is constitutive of the method rather than accidental; the filter succeeds precisely by excluding the typical."

  This label captures the logical shape without implying accidental error. It identifies the residue not as 'surviving data' but as a 'methodological byproduct,' allowing you to diagnose the problem without abandoning the toolkit entirely.
