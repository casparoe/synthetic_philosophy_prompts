prompt: |-
  I just spent an hour arguing with a friend about whether a ring species is one species or several, and we went in circles because, without realizing it, we were answering different questions — I kept saying "but the neighbors interbreed" while he kept saying "but the ends have separate evolutionary histories." I teach an intro evolution course (about 25 undergraduates, one 50-minute session), and I'd like an in-class activity that makes students hit that disagreement themselves instead of having me assert it.

  Set it up as a taxonomic vote: give them a case file on a ring of related populations (adjacent populations interbreed, but the two ends meet and don't — think of a ring species like the herring gull complex) with data on morphology, mating behavior, and genetic divergence, and have them vote on whether it's one species or two. The rules should force each group to commit to a single criterion for its vote, and the vote should carry real stakes so it matters (e.g., the outcome determines whether the population gets its own legal protection or is folded into a broader, already-protected category). Arrange the data so that whichever criterion a group picks, some other fact in the file would flip the verdict under a different criterion — so the groups should split and discover the conflict on their own before I name it.

  Please give me the rules, the case file, the payoff scheme, a minute-by-minute timeline, and a debrief that maps each criterion the groups used onto the competing species concepts (biological, phylogenetic, morphological) and lands the deeper point: that "interbreeds with" isn't transitive, so it can't carve species into clean categories, and that the "right" concept partly depends on your purpose. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the species problem the activity can't reproduce and I'll have to supply.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 50-minute in-class activity for an intro evolution course (25 students).
      *   **Core Concept:** The species problem, specifically focusing on ring species and the conflict between different species concepts (Biological vs. Phylogenetic/Morphological).
      *   **Key Insight to Convey:** "Interbreeds with" is not transitive ($A \leftrightarrow B$, $B \leftrightarrow C$, but $A \not\leftrightarrow C$). The definition of "species" depends on the purpose/criterion used.
      *   **Format:** Taxonomic vote with stakes (legal protection).
      *   **Components Needed:** Rules, Case File, Payoff Scheme, Timeline, Debrief, Potential Pitfalls, Limitations.
      *   **Tone:** Professional, pedagogical, practical, frank about limitations.

  2.  **Deconstruct the Activity:**
      *   *The Hook:* A conservation dilemma. This adds the "stakes" requested.
      *   *The Data:* Needs to be ambiguous enough to support multiple conclusions depending on the lens.
      *   *The Constraint:* Groups must pick *one* criterion to justify their vote. This forces the divergence in reasoning.
      *   *The Conflict:* When groups present, they will talk past each other (just like the user and their friend), revealing the conceptual clash.

  3.  **Drafting the Case File (The "Ring"):**
      *   Need a fictionalized organism to avoid preconceived notions (don't use *Larus* gulls directly, maybe a salamander or bird). Let's go with a fictional songbird, the "Azure Warbler" (*Cyanocitta ringens*).
      *   *Population A (North):* Distinct color, specific song.
      *   *Population B (East):* Intermediate color, mixed song. Interbreeds with A.
      *   *Population C (South):* Intermediate color, mixed song. Interbreeds with B.
      *   *Population D (West):* Distinct color, specific song. Interbreeds with C.
      *   *The Clash:* A and D meet. They look different, sing different songs, and do *not* interbreed (or produce sterile hybrids).
      *   *Genetic Data:* Show a gradient (isolation by distance) but distinct clusters at the ends.
      *   *Conservation Context:* Population D is declining. If it's a separate species, it gets Endangered status. If it's part of the widespread Species A, it doesn't.

  4.  **Developing the Rules & Payoff:**
      *   *Groups:* 5 groups of 5 students.
      *   *Task:* Vote "One Species" or "Two Species."
      *   *Constraint:* Must select a "Decision Rule" card (Biological, Morphological, Phylogenetic/Genetic).
      *   *Stakes:* Conservation funding.
      *   *Twist:* The "Agency" (Instructor) will only fund if the reasoning is consistent, not just the vote.

  5.  **Timeline (50 Minutes):**
      *   0-5: Intro & Scenario.
      *   5-15: Group Work (Data analysis + Rule selection).
      *   15-30: The Vote & Justification (The "Argument").
      *   30-40: The Reveal (Mapping to Species Concepts).
      *   40-50: Deep Dive (Transitivity & Purpose).

  6.  **Debrief Strategy:**
      *   Map group arguments to Ernst Mayr (BSC), Cronquist (Morphological), Cracraft (PSC).
      *   Highlight the non-transitivity of gene flow.
      *   Discuss "Operationalism" (what are we trying to *do*?).

  7.  **Identifying Pitfalls & Limitations:**
      *   *Pitfall:* Students trying to compromise ("It's 1.5 species"). Need to force a binary choice.
      *   *Pitfall:* Groups ignoring the assigned rule. Need to enforce the "Rule Card."
      *   *Limitation:* Real ring species are rare/debated (e.g., *Ensatina*, *Larus*). The activity simplifies the genetics. It doesn't capture the *temporal* dimension (speciation in progress vs. stable).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is 50 minutes enough?
      *   *Fix:* Keep the data simple. One page handout.
      *   *Critique:* How to ensure they feel the "stakes"?
      *   *Fix:* Make the conservation outcome explicit in the intro. "If Two Species: $5M grant for Pop D. If One Species: $0 extra."
      *   *Critique:* How to ensure they realize they are answering different questions?
      *   *Fix:* In the debrief, write the criteria on the board side-by-side. Ask: "Did Group 1 and Group 2 disagree on the *facts* or the *definition*?"

  9.  **Final Polish:**
      *   Ensure the tone is helpful for an instructor.
      *   Make sure the "Non-transitivity" point is highlighted clearly.
      *   Check that the "Limitations" section is honest (e.g., ring species are often more complex in reality).

  10. **Final Review against constraints:**
      *   Rules? Yes.
      *   Case File? Yes.
      *   Payoff? Yes.
      *   Timeline? Yes.
      *   Debrief? Yes.
      *   Pitfalls/Limitations? Yes.
      *   Focus on "Interbreeds is not transitive"? Yes.

