  Why it looked sound
  (3) derives its plausibility from the definition of incommensurability as a difference in kind rather than magnitude. If values lack a common measure, it seems category mistakes occur when trying to bridge them with quantities. The intuition is that a difference in kind creates a structural gap that no amount of small quantitative addition can close. If a voucher could close the gap, it suggests the gap was merely quantitative all along. Thus, (3) appears to protect the very notion of incommensurability from being dissolved by trivial improvements, making it seem like a necessary condition for Thesis (A) to hold water. It appeals to the fear that admitting any comparability collapses the distinction between hard choices and ignorance.

