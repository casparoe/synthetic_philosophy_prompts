  ### Seminar Note

  This poem necessarily flattens complex pragmatic norms. Dutch directness is not uniformly blunt nor solely epistemic; it is context-dependent and often softened by *gezelligheid*. Similarly, Japanese indirectness (*haragei*) involves more than mere face-saving; it is often constitutive of meaning itself, not merely protective. Philosophically, the poem assumes a realist ontology where 'withholding' and 'forcing' are equally culpable. This contests virtue-ethical accounts where intention (benevolence) might excuse the white lie. Furthermore, it treats 'autonomy' and 'face' as mutually exclusive demands, ignoring hybrid communicative competencies. The analysis leans on a deontological framing of truth-telling that may not capture the relational nuance of *amae*. Ultimately, the villanelle's form enforces a binary tension that real-world interlocutors often navigate fluidly, prioritising the structural conflict over ethnographic fidelity for pedagogical clarity.
