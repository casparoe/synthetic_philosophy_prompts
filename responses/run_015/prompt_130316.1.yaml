  ### Brainstorm: Structural Mapping

  *   **Form as Argument:** The villanelle's rigid repetition mirrors the intractable nature of the cultural impasse. The two refrains (A1, A2) represent the irreconcilable demands of Dutch epistemic courtesy and Japanese interactional care.
  *   **Alternating Tercets:** Each tercet forces the reader to hold both demands simultaneously, just as the speaker of a white lie must navigate both. The 'b' rhymes (the variable lines) will detail the specific failure of the white lie: it is both a mediation (violating A1) and an explicit fiction (violating A2).
  *   **The Stranded Lie:** The body lines will locate the white lie in the negative space between the refrains—too false for the Dutch, too explicit for the Japanese.
  *   **The Final Quatrain:** Standard villanelle form ends with both refrains appearing consecutively (lines 18–19). This enforces the "unreconciled" stance. They do not merge; they simply stand together, highlighting the contradiction without resolving it.
  *   **Key Diction:** "Epistemic courtesy" and "interactional care" must anchor the refrains to ensure the philosophical framework drives the rhythm.

