  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**

  **Preface: Positivist Stance**
  We specify that the positivist signatory adopts **inclusive positivism**. She holds that while the existence of law is grounded in social facts, the criteria of validity incorporated by those facts *may* include moral standards. This choice sharpens the document: it removes the superficial dispute over whether moral language can appear in legal texts, isolating the deeper disagreement over whether such inclusion makes law inherently moral (the Fullerian view) or merely contingently so via social convention (the positivist view). Consequently, the Table of Disagreements focuses on the *source* of authority rather than the *possibility* of moral content.

  **I. Agreed Claims**
  1. A legal system exists only where officials converge on accepting secondary rules that govern the creation, adjudication, and enforcement of primary obligations.
  2. The ultimate criteria of validity depend upon a convergent practice among officials; without this social fact of acceptance, no rule is legally binding within that jurisdiction.
  3. In the post-war grudge informer cases, courts faced a tragic choice: either apply an iniquitous statute faithfully or punish the informer retroactively. Both options incurred significant moral costs.
  4. Describing the Nazi statute as "not law" does not resolve the moral dilemma of whether to punish the informer; it merely shifts the terminology of the justification without removing the burden of choice.
  5. Hart's argument for a minimum content of natural law rests on contingent empirical truths about human vulnerability, approximate equality, and limited altruism, not on a priori moral reasoning.
  6. This minimum content argument is not a concession to natural law but a recognition that any enduring normative system must address these survival facts to function effectively.
  7. Fuller's canons of legality (generality, publicity, non-retroactivity, congruence, etc.) are necessary conditions for a regime to guide conduct effectively through rules rather than mere force.
  8. A regime that systematically violates these canons fails to function as a legal order, regardless of its coercive power or moral aims, though we disagree on whether this failure is moral or functional.

  **II. Table of Disagreements**

  | Crux | Positivist Claim | Fullerian Claim | Agreed Test Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Canons** | The canons are principles of efficacy; violating them makes law inefficient, not inherently immoral. | The canons constitute an internal morality; violating them breaches a moral duty owed to subjects. | A regime publishes clear rules but secretly ignores them to achieve benevolent ends. | **P:** System remains legal; efficacy drops. **F:** System loses legal character; moral breach occurs. |
  | **Moral Tests in Validity** | Moral criteria are valid only because the social rule of recognition incorporates them contingently. | Moral criteria are valid because law is a purposive enterprise requiring moral alignment to function. | A constitution requires statutes to be "just" to be valid; officials enforce an unjust statute. | **P:** Statute is law if officials enforce it; the moral test is ignored in practice. **F:** Statute is not law; the system fails its purpose. |
  | **"Really Law" Dispute** | Calling iniquitous rules "law" is conceptually accurate; denying it is verbal confusion that hides moral choice. | Calling iniquitous rules "law" is conceptually defective; it misdescribes a failed enterprise of subject governance. | A statute commands impossible acts. | **P:** It is valid law until changed; impossibility is a defence, not invalidity. **F:** It fails the canon of possibility; it is not law. |
  | **Fidelity to Law** | Fidelity is prudential or based on fair play; it provides a content-independent reason only if accepted. | Fidelity is a genuine moral obligation arising from the reciprocity of the lawgiver-subject relationship. | A citizen obeys a burdensome but procedurally perfect law they disagree with. | **P:** Obligation exists only if the system is generally just or useful. **F:** Obligation exists due to the procedural integrity itself. |
  | **Official Discretion** | Discretion is inevitable where rules run out; officials legislate interstitially. | Discretion is a failure of legality; officials must strive to minimise it to maintain reciprocity. | A judge decides a case with no clear statutory precedent. | **P:** Judge creates new law legitimately. **F:** Judge fails to find the law inherent in the structure. |

  **III. Test Case: The Commonwealth of Vireo**

  In Vireo, statutes are public and consistent, but the "Assize" system determines rights using unpublished data and provides no reasons. Judges rarely override it.

  **Variant A (Neutral Outputs)**
  *   **Legal System:** Both agree Vireo is a legal system. Officials enforce rules; order is maintained.
  *   **Assize Output as Law:** The Positivist argues the Assize output is law because officials treat it as binding under a tacit rule of recognition based on predictive accuracy. The Fullerian argues the output is *not* law because it violates the canons of publicity and intelligibility; subjects cannot guide their conduct by unknown algorithms.
  *   **Fuller's Canons:** Both agree Vireo fails congruence and publicity regarding the Assize. The Positivist sees this as a defect in efficacy and transparency; the Fullerian sees it as a failure of legality itself, rendering the Assize a managerial directive rather than law.
  *   **Rule of Recognition:** The Positivist identifies the rule of recognition as "whatever the Assize predicts plus statutory text". The Fullerian denies this can be a rule of recognition because it lacks the requisite moral form.
  *   **Divergence:** Their diagnoses diverge. The Positivist sees a valid but opaque system; the Fullerian sees a system that has ceased to be law in the central case.

  **Variant B (Biased Outputs)**
  *   **Legal System:** The Positivist maintains Vireo remains a legal system, albeit an iniquitous one, provided officials continue to enforce the Assize consistently. The Fullerian contends that systematic bias known to officials destroys the reciprocity required for law, rendering it a corrupt use of force rather than a legal order.
  *   **Assize Output as Law:** The Positivist holds the output is valid law if enforced, as validity is separate from merit. The Fullerian holds it is not law because it violates the internal morality of generality and congruence.
  *   **Dependence on Cruxes:** This turns on the "Nature of Canons" and "Fidelity" cruxes. The Positivist views the bias as a moral failure external to legality; the Fullerian views it as a collapse of legality.
  *   **Coincidence:** Both agree the situation is morally intolerable and warrants resistance. This coincidence shows that practical condemnation does not require conceptual agreement on the label "law". The Positivist warns that calling it "non-law" may obscure the need for retroactive legislation to punish officials; the Fullerian warns that calling it "law" may induce undue fidelity from citizens.

  **IV. Closing Note**

  We conclude that no purely empirical finding would resolve our dispute. The Positivist requires evidence that officials *actually* treat moral criteria as binding to admit them into law; the Fullerian requires evidence that procedural failures *actually* degrade moral agency to deny legal status. We agree that a case where officials consistently enforce rules that are publicly incomprehensible yet socially beneficial would test us. If such a system proved stable over generations, the Positivist would call it law; the Fullerian would deny it. We acknowledge this divergence is not verbal but reflects a fundamental disagreement on whether law is defined by social power or moral purpose. The collaboration ends with this exact disagreement intact, though we now understand the precise stakes of our respective terminology.
