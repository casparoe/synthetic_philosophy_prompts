prompt: |-
  I'm a PhD student in formal epistemology, about to sink serious time into the anthropics literature, and before I do I want to be clear on what would count as progress rather than one more position on the pile. Write me the desiderata for a theory of self-locating belief — the requirements any adequate account of credence in situations where you're uncertain about who you are, when it is, or which of several similar observers you happen to be has to meet. At a minimum, it should: give a determinate verdict on Sleeping Beauty's credence in the coin upon waking, plus an explanation of what, if anything, she learns at that moment; handle duplication cases, where two subjects share all memories and physical duplicates are created and placed in indistinguishable environments, and say whether the duplicates' credences should match an outside observer's; say how centered credences relate to ordinary uncentered credences — is a distribution over centered worlds just an intermediate representation, or does it do real work that can't be recovered from an objective chance function plus conditioning?; deliver some verdict on the doomsday argument and Bostrom's presumptuous philosopher rather than refusing the question; and cohere with diachronic norms like conditionalization and reflection in cases with no self-locating component, so the theory doesn't silently revise ordinary Bayesianism where ordinary Bayesianism already worked. For each requirement, give the motivating case or argument, and flag which you take to be genuine constraints versus shibboleths of particular camps — e.g., whether Dutch book or betting-quotient arguments should be allowed to settle Beauty's credence, and whether " Beauty learns nothing new" is a datum or a halfer's talking point. Then the part I most want: say whether some subset of these desiderata is jointly unsatisfiable — whether, given duplication, the doomsday cases, and the standard Sleeping Beauty dialectic, no consistent theory can satisfy all of them at once — because if so, the requirements list is itself a result, and the choice between halfism and thirdism is forced by which requirement we're willing to abandon. Keep the weight on the criteria and their motivations rather than on scoring existing views against them; I'll do the scorecard in my dissertation. Please keep it under 700 words.
