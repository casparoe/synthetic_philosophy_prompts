  To count as progress, a theory of self-locating belief must transcend partisan stalemates by satisfying structural desiderata rather than merely yielding preferred verdicts. The following criteria distinguish adequate accounts from mere positions.

  1. **Sleeping Beauty Resolution:** The theory must yield a determinate credence for Beauty upon waking and specify her evidence update. *Motivation:* SB is the canonical test case for indexical updating. *Constraint vs. Shibboleth:* Internal consistency is a genuine constraint. However, "Beauty learns nothing" is a halfer assertion, not a neutral datum; treating it as such begs the question. Similarly, Dutch book arguments are pragmatic proxies for epistemic norms, not definitive settling mechanisms. In self-locating cases, utility functions may vary with identity, decoupling betting quotients from credences. A theory must justify why betting behavior tracks credence here.

  2. **Duplication and Indifference:** In cases where physical duplicates share memories and environments, the theory must assign credences regarding identity. *Motivation:* This isolates self-location from empirical uncertainty. *Constraint vs. Shibboleth:* The Principle of Indifference among subjectively indistinguishable centers is a strong intuitive constraint. However, strict alignment with an outside observer's credence is a shibboleth. Duplicates have different information (they know they are the duplicate/inside view); divergence is permissible if explained by information asymmetry.

  3. **Centered vs. Uncentered Relation:** The account must clarify the metaphysical and probabilistic status of centered worlds. *Motivation:* We need to know if indexicality is fundamental or reducible. *Constraint vs. Shibboleth:* Conservation of Probability is a genuine constraint: in non-indexical contexts, the theory must collapse to standard Bayesianism. However, insisting that centered credences are merely derived from uncentered ones plus location is a shibboleth. Some frameworks treat centered content as primitive; the requirement is merely coherent interaction between the two, not reductionism.

  4. **Empirical Modesty (Doomsday/PP):** The theory must deliver verdicts on the Doomsday Argument and Presumptuous Philosopher without permitting armchair discovery of empirical facts. *Motivation:* Epistemology should not dictate physics. *Constraint vs. Shibboleth:* Avoiding empirical dogmatism is a genuine constraint; a theory implying we can confirm cosmological hypotheses (e.g., universe size) via self-location alone is *reductio ad absurdum*. Refusing the question is not an option.

  5. **Diachronic Coherence:** The theory must preserve standard diachronic norms (Conditionalization, Reflection) where self-locating uncertainty is absent or stable. *Motivation:* Theoretical conservatism. *Constraint vs. Shibboleth:* Conservatism about Bayesianism is a genuine constraint. The theory should not revise ordinary updating rules unless indexical uncertainty forces a structural change. Silent revision of ordinary Bayesianism is a failure.

  **Joint Satisfiability:**
  Crucially, these desiderata are **jointly unsatisfiable**. There is a proven structural tension between *Centered Conditionalization* (Diachronic Coherence), *Indifference* (Duplication), and *Empirical Modesty* (Doomsday).

  If you enforce strict Conditionalization on centered worlds, you often violate Indifference in duplication cases (leading to halfer-like views). If you enforce Indifference (thirder-like views), you often violate Conditionalization upon waking (requiring non-standard updating like "shifting" or "generalized conditionalization"). Furthermore, satisfying Indifference often triggers the Presumptuous Philosopher problem, violating Empirical Modesty by allowing high credence in hypotheses with more observers.

  Consequently, no consistent theory satisfies all five. Progress consists not in finding the "true" theory, but in explicitly selecting which desideratum to relax. Halfer views typically sacrifice Indifference to save Conditionalization and Modesty. Thirder views sacrifice Conditionalization to save Indifference, often at the cost of Modesty.

