      2. **Duplication and Indifference:** In cases where physical duplicates share memories and environments, the theory must assign credences regarding identity. *Constraint:* The Principle of Indifference among subjectively indistinguishable centers is a strong intuitive pull. *Shibboleth:* Strict alignment with an outside observer's credence is not required; divergences may arise from differing reference classes or information sets. The theory must explain *why* they diverge or converge.

      3. **Centered vs. Uncentered Relation:** The account must clarify the metaphysical and probabilistic status of centered worlds. *Constraint:* Conservation of Probability: in non-indexical contexts, the theory must collapse to standard Bayesianism. *Shibboleth:* That centered credences are merely derived from uncentered ones plus location. Some frameworks treat centered content as primitive; the requirement is merely coherent interaction between the two.

      4. **Empirical Modesty (Doomsday/PP):** The theory must deliver verdicts on the Doomsday Argument and Presumptuous Philosopher without permitting armchair discovery of empirical facts (e.g., population size or physical constants). *Constraint:* Avoiding empirical dogmatism is a genuine constraint; a theory implying we can confirm cosmological hypotheses via self-location alone is reductio ad absurdum.

      5. **Diachronic Coherence:** The theory must preserve standard diachronic norms (Conditionalization, Reflection) where self-locating uncertainty is absent or stable. *Constraint:* Conservatism about Bayesianism. The theory should not revise ordinary updating rules unless indexical uncertainty forces a structural change.

      **Joint Satisfiability:**
      Here lies the critical result. These desiderata are likely **jointly unsatisfiable**. There is a known tension between *Centered Conditionalization* (Diachronic Coherence), *Indifference* (Duplication), and *Empirical Modesty* (Doomsday).
      If you enforce strict Conditionalization on centered worlds, you often violate Indifference in duplication cases (leading to halfer-like views). If you enforce Indifference (thirder-like views), you often violate Conditionalization upon waking (requiring non-standard updating like "shifting"). Furthermore, satisfying Indifference often triggers the Presumptuous Philosopher problem, violating Empirical Modesty.
      Consequently, no consistent theory satisfies all five. Progress consists not in finding the "true" theory, but in explicitly selecting which desideratum to relax. Halfer views typically sacrifice Indifference to save Conditionalization and Modesty. Thirder views sacrifice Conditionalization (adopting shifting) to save Indifference, often at the cost of Modesty (accepting some Doomsday-style inference).
      Therefore, the choice between camps is not about who gets the "right" verdict on Beauty, but which structural norm they deem expendable. A dissertation contributing progress must identify this trade-off explicitly rather than obscuring it under intuitive appeals. The impossibility of satisfying all constraints is the field's central theorem; acknowledging it is the prerequisite for genuine advancement.

