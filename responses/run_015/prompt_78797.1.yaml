answer: |-
  **The Example: The Tribunal of Final Jurisdiction**

  Imagine a specialized judicial body, the **Tribunal of Final Jurisdiction**, whose sole function is to issue "Writs of Competence." No lower court is permitted to hear a case unless it holds a valid Writ from the Tribunal. The Tribunal's governing statute contains a specific procedural clause: *Any challenge to the validity of a Writ, including challenges to the Tribunal's own authority to issue Writs, must be adjudicated by the Tribunal itself.*

  **The Loop**
  The self-referential loop arises when a litigant challenges the Tribunal's authority. To be heard, the litigant must file a motion with the Tribunal. For the Tribunal to accept the motion, it must assume it has the authority to accept motions. If the Tribunal rules that it *lacks* authority, it invalidates the very proceeding that produced the ruling. If it rules that it *possesses* authority, it validates its power using the power currently under dispute. The system determines the validity of its rules (the Tribunal's jurisdiction) only by applying those rules (hearing the case).

  **The Inviolate Level**
  The level taken as given is not a rule within the statute, but the **Founding Act** itself—the historical, sociological fact that the Tribunal was established and is currently obeyed. This is the "inviolate level." It is the boundary condition where the system touches reality. The rules inside the system can define how Writs are issued, renewed, or contested, but they cannot generate the initial obligation to obey the Tribunal. That obligation rests on an external fact (e.g., state enforcement, professional custom, or public acquiescence) that the system treats as a premise rather than a conclusion.

  **Internal Justification and Collapse**
  If a litigant insists on justifying the Tribunal's authority from *inside* the system, the process stalls. The Tribunal can produce a Writ certifying its own authority, but that Writ is only valid if the Tribunal was already authorized to issue it. This is not a logical contradiction (like the Liar Paradox), but a **performative circularity**. The distinction between the loop and the inviolate level does *not* collapse. There is genuinely something outside the circle: the non-legal fact of compliance. If that external compliance vanishes, the internal loop continues to spin (the Tribunal keeps issuing Writs), but they cease to function as rules. The conceptual issue, therefore, is not that the system is groundless, but that it must disguise its external ground as an internal rule to maintain the appearance of self-sufficiency.
