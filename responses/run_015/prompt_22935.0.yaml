answer: |-
  Here are ten interview questions designed to move past the standard textbook examples and engage with the theoretical and political stakes of judgment aggregation. They are structured to build a narrative arc for your long-form piece, moving from definitions to impossibility, to procedure, and finally to power and legitimacy.

  **1. The "Court Case" Fatigue**
  "Most popular introductions to your work stop at the *Kornhauser and Sager* example: a three-judge court voting on whether a contract was breached, whether the law was violated, and whether the company is liable. We get the inconsistency, and then the article moves on. But you've spent a decade arguing this isn't just a legal bug; it's a feature of collective rationality. If we strip away the legal robes and the corporate liability, what is the *political* phenomenon that example is actually pointing to? What are we missing when we treat this as a puzzle for judges rather than a problem for democracies?"

  **2. Doctrinal Paradox vs. Discursive Dilemma**
  "I want to press on the terminology. The legal scholars called it the 'doctrinal paradox,' but List and Pettit formalized it as the 'discursive dilemma.' On the surface, this looks like academic rebranding, but I gather you see a substantive shift. Does the move from 'paradox' to 'dilemma' signal a change in how we understand the source of the inconsistency? Is the 'doctrinal' version a failure of legal reasoning, while the 'discursive' version is a failure of democratic theory? What work is that distinction doing for you?"

  **3. The Impossibility Theorem and the Sacrificed Axiom**
  "Let's talk about the impossibility theorem. The lazy summary is always 'you can't satisfy all the axioms,' which is true of almost every social choice result. I want to know which axiom is the actual bottleneck in the real world. When you look at actual committees—legislatures, central banks, scientific panels—which constraint is the first to break? Is it 'Universal Domain,' 'Collective Rationality,' or 'Systematicity'? And if we choose to drop it, what is the specific political cost of that choice?"

  **4. The Shape of the Alternative Rule**
  "Following up on that: if we decide to drop, say, the 'Independence' axiom to allow logical connections to matter, we need a new aggregation rule. I'm not interested in the mathematical function; I'm interested in the room where the vote happens. What does that rule actually look like in practice? Does it require a chairperson with veto power? Does it require sequential voting that privileges certain propositions over others? And crucially, would a real committee of equals actually tolerate a rule that visibly privileges one part of the logic over another?"

  **5. Premise-Based vs. Conclusion-Based Procedures**
  "The standard solution offered is often a choice between 'premise-based' procedures (vote on the reasons, derive the outcome) and 'conclusion-based' procedures (vote on the outcome, ignore the reasons). You've written that the choice between them 'depends on the logical structure of the agenda.' That sounds like a safe, academic hedge. I want to push past the hedge. In what specific type of political decision does the logical structure *force* you to choose one over the other? Where is the stakes-high case where picking the wrong procedure doesn't just change the math, but changes the justice of the outcome?"

  **6. Forcing the Concrete Case**
  "Let's make that concrete. Imagine a climate committee or a budgetary council. Can you walk me through a scenario where the logical connections between propositions are such that a premise-based procedure yields a radically different collective will than a conclusion-based one? I want to see the moment where the 'dependence on logical structure' ceases to be a theoretical variable and becomes a political weapon. If I'm a faction leader, how do I use that dependence to game the procedure?"

  **7. Truth vs. Consistency**
  "There's an epistemic layer here that I want to unpack. Sometimes we want the group to be consistent; other times we want the group to be *right*. If a majority votes inconsistently, they might still stumble onto the truth. If they vote consistently via a premise-based procedure, they might be logically clean but factually wrong. Does judgment aggregation prioritize the integrity of the group agent over the accuracy of the decision? At what point does maintaining collective rationality become a form of collective gaslighting?"

  **8. Empirical Evidence of the Dilemma**
  "Critics often argue that the discursive dilemma is a mathematical curiosity that requires contrived agendas to manifest. They say real-world groups have heuristics, norms, or party discipline that smooth over the inconsistency. Have we seen this actually bite in the wild? Are there historical cases where a legislature or a board produced an internally inconsistent set of policies that they couldn't walk back? Or is the dilemma mostly a threat that shapes behavior *before* the vote, by terrorizing the agenda-setters?"

  **9. The Group Agent and Responsibility**
  "Your work often touches on the idea of the 'group agent'—the idea that a collective can bear responsibility just like an individual. But if a collective's judgments are subject to the discursive dilemma, can they truly be responsible? If a parliament votes itself into an inconsistency, who is to blame? The voters? The logic? The procedure? Does the existence of the dilemma actually dissolve the possibility of collective responsibility, or does it require us to invent a new kind of political accountability?"

  **10. Legitimacy and Agenda Control**
  "I want to close on the question of legitimacy. If the discursive dilemma is unavoidable under certain conditions, does that undermine the legitimacy of majority rule? Or is it simply a constraint we have to manage? And here is the crux: management requires agenda control—the power to decide which propositions go on the ballot in the first place. If we acknowledge that the dilemma can be triggered or defused by how the agenda is set, does the problem shift from 'how we vote' to 'who controls the questions'? Ultimately, is the discursive dilemma a threat to democracy, or is it just the mathematical signature of oligarchy?"
