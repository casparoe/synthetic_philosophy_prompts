prompt: |-
  what would a theory of work's actual meaning have to get right? im especially stuck on these zombie tasks - jobs that survive automation not because anyone needs the output, but because they signal that someone is still in charge, like generating reports AI already wrote but a manager still has to "review" them for liability reasons. i want the full spec: cases it has to handle, distinctions it cant collapse (value vs legitimacy), results from sociology or labor economics it cant flat-out contradict, and which single requirement knocks out the most popular theories. does it also need to explain why automation so often spawns more monitoring work rather than less?
reasoning: |-
  Here's a thinking process that leads to the suggested theory of work:

  1.  **Deconstruct the Request:**
      *   **Core Question:** What would a theory of work's *actual meaning* have to get right?
      *   **Specific Focus:** "Zombie tasks" (jobs surviving automation not for output value but for signaling/liability/authority).
      *   **Requirements:**
          *   Full spec (cases to handle).
          *   Distinctions it can't collapse (Value vs. Legitimacy).
          *   Empirical constraints (Sociology/Labor Economics findings it can't contradict).
          *   The "Killer Constraint" (one requirement that knocks out popular theories).
          *   Explanation of the "Automation Paradox" (why automation spawns monitoring work).

  2.  **Initial Brainstorming & Framing:**
      *   The user is asking for a *normative* and *descriptive* theory of work that accounts for the irrationality of modern labor.
      *   Key concept: "Bullshit Jobs" (Graeber) is the obvious touchstone, but the user wants something more rigorous ("full spec," "labor economics").
      *   The "Zombie Task" example (reviewing AI reports for liability) suggests work is often about *risk distribution* and *social validation* rather than *production*.
      *   A successful theory needs to move beyond "Work = Production of Utility."

  3.  **Drafting the Core Components:**

      *   **The Central Thesis:** Work isn't just about transforming matter/information (output); it's about transforming *responsibility* and *status* (input/process).
      *   **Distinction 1: Use-Value vs. Legitimacy-Value.** This is crucial. A report might have zero use-value (AI wrote it) but high legitimacy-value (a human signed it).
      *   **Distinction 2: Task vs. Role.** The task is the action; the role is the social position.
      *   **The Automation Paradox:** Why does tech create more work? Because tech increases *complexity* and *risk*, requiring more *coordination* and *accountability* layers.

  4.  **Developing the "Full Spec" (Cases to Handle):**
      *   *Productive Work:* Building a chair. (Obvious case).
      *   *Zombie Work:* The AI report reviewer. (The user's specific interest).
      *   *Care Work:* Nursing/Teaching. (High value, often low pay, hard to automate).
      *   *Make Work:* Digging holes and filling them (Keynes).
      *   *Shadow Work:* Unpaid labor (commuting, self-service checkouts).

  5.  **Identifying Empirical Constraints (Sociology/Economics):**
      *   *Efficiency Wage Theory:* People work harder when paid more, not just because of monitoring.
      *   *Good Jobs Strategy:* High investment in workers leads to better outcomes (Fisher).
      *   *Institutional Isomorphism:* Companies copy each other's structures to look legitimate (DiMaggio & Powell).
      *   *The Productivity Paradox:* IT investment doesn't always equal productivity gains (Solow).

  6.  **Finding the "Killer Constraint":**
      *   What kills the standard Neoclassical theory? The assumption that wages = marginal revenue product.
      *   What kills the Marxist theory? The idea that all work is exploitation of surplus value (doesn't account for pointless work that generates *no* surplus).
      *   *The Winner:* **The Decoupling of Effort from Outcome.** A theory must explain why effort is expended even when the marginal utility of the output is zero or negative. If a theory says "Work exists to create value," it fails the Zombie Task test.

  7.  **Addressing the Automation/Monitoring Paradox:**
      *   Automation handles the *doing*.
      *   Humans handle the *blame*.
      *   This is about *Accountability Architecture*.
      *   Jevons Paradox applies to management: Efficiency in doing leads to increased consumption of managing.

  8.  **Synthesizing and Refining (Iterative Process):**
      *   *Tone:* Analytical, slightly philosophical, rigorous but accessible.
      *   *Structure:*
          1.  Core Definition (The Shift).
          2.  The Non-Collapsible Distinctions.
          3.  The Empirical Guardrails.
          4.  The Killer Constraint.
          5.  The Automation/Monitoring Explanation.
      *   *Refining the "Zombie" concept:* It's not just "bullshit." It's "Liability Sponges." The human is there to be fired if things go wrong.
      *   *Refining the Theory Name:* Let's call it "Work as Ritualized Accountability" or "The Socio-Legal Theory of Labor." Let's stick to describing the requirements rather than naming a specific new theory, to remain objective.

  9.  **Final Review against User Prompt:**
