      *   **The Conflict:** The town myth (Rowntree gave land/school) is false. But the square is a site of living practice (Memorial Day gatherings). Moving it feels like a correction to ancestors (including the great-granddaughter friend).
      *   **The Core Argument (Speaker's View):** The strongest argument *against* the move is that the monument became part of a living practice. The speech must acknowledge this claim without yielding to it. It must distinguish between *honoring* (living practice) and *recording* (historical fact), using this distinction structurally, not just as a point.
      *   **Constraints:**
          *   No claim to final truth or finished judgment (tablet invites future judgment).
          *   Don't tell attached people their attachment was a mistake (give them something true to keep).
