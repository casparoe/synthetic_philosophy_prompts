answer: |-
  Friends, neighbors, colleagues.

  We are standing on ground we know. For eighty years, this square has been where we meet when the weather breaks, when the harvest is in, and when we have lost someone to serve. On Memorial Day, the veterans among us stand before this pedestal to lay a wreath. They are not thinking about land deeds. They are thinking about the neighbors who did not come home. That practice belongs to the living. It is real, and it is ours.

  For a hundred years, the bronze figure above this pedestal told a story about how this ground came to be ours. It said Elias Rowntree gave the square and the school to the town. It was a story of generosity, and it gave us a reason to put his face here. But the records kept by the county tell a different story. They show the land was sold at market price. They show the school was built from a levy. The story we told does not match the records we keep.

  When a town grows, it sometimes finds that the things it has planted no longer fit the soil. We have a choice. We can leave the statue and ask you to ignore the records. Or we can move the statue and ask you to keep the gathering.

  We have chosen to keep the gathering.

  The pedestal stays. The square remains a place for us to stand together. But the figure of Mr. Rowntree is moving two hundred yards down the street, to the lawn of the Historical Society. There, it will stand beside the case where the deeds are kept. A statue is not a deed. A gathering is not a lesson. We are separating them so that neither has to pretend to be the other.

  On the granite base, a new tablet has been fixed. It carries no name. It says only that we moved the monument because we were no longer willing to make the claim it made. It does not say we have finished judging. It asks whoever reads it fifty years from now to look at what we did, and to judge whether we were right. We are not settling an account. We are leaving a question.

  To the Rowntree family: I know this feels like a correction administered to your grandparents. I know you loved the man as he was described to you. I cannot tell you that this is not about him, because a monument in a public square is always about us, and about what we choose to hold up. We are not removing him from our history. We are removing his image from our promise. The loss you feel is the cost of our honesty, and I will not ask you to pretend it is small.

  To those who petitioned for this change: The records are now where the records belong. But the square is not a museum. It is a living room. We have corrected the claim, but we have kept the space for the people who use it.

  So we leave the pedestal open. We leave the question open. And we invite you to walk across the street. The display case is unlocked. The grass is cut. The research is laid out on the table, not to teach you a lesson, but to show you the papers we have to work with. Go look at the transaction. Then come back across the street, and stand here with us on Memorial Day. We will be here.

  ***

  **Note on Potential Trouble**

  **Sentence 1:** *"The story we told does not match the records we keep."*
  **Why it risks trouble:** This is the factual pivot of the ceremony. For the historians and petitioners, it is the vindication they sought. For Rowntree's descendants and neighbors attached to the myth, it is a public humiliation of their family history. It states the contradiction plainly without softening it, which is necessary for integrity but guarantees pain.
  **Alternative:** *"The story we told rests on papers that do not exist."* (This shifts the blame to the missing documentation rather than the active mismatch, slightly softening the accusation of a collective lie, though it risks implying the historian's research is incomplete.)

  **Sentence 2:** *"The loss you feel is the cost of our honesty, and I will not ask you to pretend it is small."*
  **Why it risks trouble:** This addresses the family constraint. However, framing their grief as a "cost" of the town's "honesty" instrumentalizes their pain for the sake of the committee's moral project. The Historical Society board might feel it concedes too much to the family's feelings over the factual record, while the family might feel it validates their pain only to dismiss it as a necessary sacrifice.
  **Alternative:** *"The loss you feel is real, and it belongs to you, not to the committee."* (This attempts to return ownership of the grief to the family, separating it from the town's political decision, though it risks sounding like a dismissal of the town's responsibility for causing that grief.)
