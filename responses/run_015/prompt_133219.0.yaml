      *   **The History (Recording):** Speak to the facts. Rowntree sold the land. The school was a levy. This isn't a scandal, just a fact. The statue claimed a gift that wasn't given.
      *   **The Decision (The Move):** Why move it? Because the pedestal claims a truth we can't stand behind. But why keep the pedestal? Because the gathering matters.
      *   **The Tablet:** It admits uncertainty. It invites the future to judge us. *Constraint Check: No final truth claimed.*
      *   **The Family/Descendants:** Acknowledge the pain. Don't say "it's not about him." Say "it's about what we do with his image."
      *   **The Invitation (Ending):** Walk across the street. Not to learn a lesson, but to see the thing in its new context.

