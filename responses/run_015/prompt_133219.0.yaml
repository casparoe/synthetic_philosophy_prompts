  2.  **Deconstruct the Core Distinction (Honoring vs. Recording):**

      *   *Recording:* What the deed says. What happened. Facts. This belongs in the case at the Historical Society.
      *   *Honoring:* What we do together. Memorial Day. Gathering. This belongs in the Square.
      *   *The Tension:* The statue tried to do both (record a lie as an honor). We are separating them. The pedestal stays for the honoring (the gathering). The statue moves to the recording (the context).
      *   *Structural Application:* The speech shouldn't just say "We distinguish honoring and recording." It should *enact* the separation. First, acknowledge the square's life (honoring). Then, acknowledge the history (recording). Then, explain the split as an act of care for both.

