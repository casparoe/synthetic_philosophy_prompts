  Dear Colleague,

  I have reviewed the six views you outlined with care, and while the core of your position forms a compelling and technically sophisticated framework, there is a significant inconsistency that you must resolve before committing this to writing. The tension lies primarily between your endorsement of Solomonoff induction and Kolmogorov complexity as objective and correct, and your acceptance of Goodman's conclusion that formal measures of simplicity are inadequate. You cannot consistently hold that Kolmogorov complexity is the right measure of simplicity and that the universal prior is uniquely correct while also maintaining that Goodman's riddle shows purely formal measures are inadequate for grounding induction. Goodman's argument targets exactly the kind of formal syntactic account that Solomonoff induction provides. If Goodman is right in the strong sense you state in your fourth view, then your first, second, and third views are false. If your first, second, and third views are true, then Goodman's conclusion as you have stated it must be mistaken or at least significantly qualified.

  The most costly claim in your set is the second one, where you assert that the universal prior is the uniquely correct objective prior. This claim is vulnerable to the reference machine problem, which is essentially Goodman's riddle reincarnated in the language of computability theory. The Kolmogorov complexity of a string depends on the choice of the universal Turing machine, just as the simplicity of a hypothesis depends on the choice of primitive predicates. While Solomonoff induction washes out these differences asymptotically, for any finite data set, the choice of machine matters. By claiming unique objectivity, you are implicitly claiming there is a privileged reference machine without providing the justification for why that machine is privileged. This leaves you open to the charge that you are presupposing the inductive dispositions you aim to justify, which is precisely the criticism Goodman levels in your fourth view. To maintain consistency, you should revise your second view to claim that the universal prior is the correct prior relative to a chosen reference machine, rather than claiming it is uniquely objective in an absolute sense. This acknowledges the insight of Goodman without surrendering the formal machinery of Solomonoff induction.

  Consequently, you must also revise your fourth view. You should not state that Goodman shows formal measures are inadequate, but rather that Goodman shows simplicity is language-relative. This modification allows you to keep Kolmogorov complexity as the right measure of simplicity relative to a fixed vocabulary, which is what the choice of a universal Turing machine effectively provides. By reframing Goodman's lesson as one about relativity rather than inadequacy, you remove the direct contradiction with your third view. This is the least costly revision because it preserves the mathematical and normative structure of Solomonoff induction that you clearly value in your first, third, fifth, and sixth views, while sacrificing only the metaphysical claim of absolute uniqueness. It makes your position philosophically defensible by admitting that the formalism requires a conventional starting point, much like choosing a coordinate system in physics, rather than pretending the formalism floats free of all presuppositions.

  Your fifth and sixth views are largely consistent with this revised framework, provided you accept the relativity adjustment. The use of Minimum Description Length or Bayesian Information Criterion as practical approximations remains valid as long as you acknowledge they are approximating the ideal relative to a specific coding scheme. Similarly, the defense of uncomputable normative ideals holds up well against practical objections, though it gains strength if you admit that the ideal itself is relative to a reference machine. If you fail to make these revisions, your work will be vulnerable to the objection that you are ignoring the foundational critique of formal epistemology while simultaneously relying on that very formalism. By weakening the claim of uniqueness in your second view and refining the interpretation of Goodman in your fourth view, you create a coherent position that respects both the power of the mathematical theory and the depth of the philosophical challenge. I recommend you prioritize revising the second view, as it is the strongest claim and the easiest target for critics, and then adjust the fourth view to align with that concession. This will allow you to present a robust, consistent system that honors your background in physics while engaging seriously with the philosophy of science.
