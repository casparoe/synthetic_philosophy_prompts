answer: |-
  This is a profound ethical taxonomy you have built. You are essentially mapping the boundary between *dramatic license* and *historical libel*, but you are doing it through the lens of moral philosophy rather than legal liability. Your intuitions are sharp, but as you suspect, they are currently driven by heuristics that clash when pressed.

  Here is an analysis of your candidate principles, a proposal for a unified framework, the verdicts that must be sacrificed for consistency, and the application of this framework to your two outstanding cases.

  ### Part 1: Testing the Candidate Principles

  **1. The Structural Principle (Causal Architecture)**
  *   *The Theory:* Decorative changes are permissible; motivational/causal changes are falsifications.
  *   *Where it works:* It handles your compression techniques well (V1, V2, V3). It explains why the acquitted crime (V7) is worse than the representative cruelty (V6); the crime is causal to the legal record, the cruelty is merely illustrative of character.
  *   *Where it fails:* It cannot distinguish between the Roman Emperor (V9) and the Private Person (V10). Structurally, the invented cruel act is identical in both. It also struggles with V4 vs. V8. An invented affair is structurally the same whether it aligns with their identity or contradicts it. The structural weight of the lie is the same; your moral reaction changes based on *who* the person was, not *where* the lie sits in the plot.

  **2. Counterfactual Consent (Recognition)**
  *   *The Theory:* Would the subject recognize this depiction as compatible with their values and self-conception?
  *   *Where it works:* This is your strongest candidate. It neatly resolves V4 (Affair) vs. V8 (Secret Identity). In V4, the affair is compatible with their known life; in V8, it contradicts their avowed identity. It also explains V9 (Emperor) vs. V10 (Private Person). The Emperor courted fame and myth; he would "recognize" the invented cruelty as part of the game he played. The private person sought oblivion; they would not recognize themselves as a character in a drama at all.
  *   *Where it fails:* It struggles with V11 (The Liar). The liar spent his life publishing falsehoods. Counterfactual consent suggests he would *approve* of the myth-making. Yet you feel inventing scenes to *puncture* the myth is fine. This suggests the principle isn't just about what they would consent to, but what serves the *truth of their impact*.

  **3. The Epistemic Principle (Audience Belief)**
  *   *The Theory:* The wrong is a function of the work becoming settled belief.
  *   *Where it works:* This perfectly explains V4 (Affair) vs. V5 (Docudrama/Only Source). The act is the same; the risk of permanent misinformation is different. It also helps with V9 vs. V10. We know the Emperor is a mythological figure; our belief is already unstable. The private person is a "fact" to the few who know them; fiction here displaces truth more easily.
  *   *Where it fails:* It doesn't fully account for the *intrinsic* wrong. Even if a caption ensures no one believes the fabricated cruelty (V6), you still feel it is "worse than the invented affair." There is a violation of the person, not just a risk to the audience.

  ### Part 2: The Unified Principle — "The Covenant of Memory"

  To make your verdicts cohere, you need to combine **Counterfactual Consent** with **Epistemic Vulnerability**. I propose you adopt a principle of **Narrative Sovereignty**.

  **The Principle:** We owe the dead fidelity to the *project of selfhood* they undertook, weighted by the *epistemic vulnerability* of the audience.

  1.  **Narrative Sovereignty:** Did the person invite public interpretation (The Emperor, The Memoirist) or withdraw from it (The Private Person)? Did they define themselves by a specific identity (The Avowed Sexual Identity) or leave it fluid? When you dramatize them, you must not violate the boundaries of the persona they constructed.
  2.  **Epistemic Vulnerability:** How likely is this fiction to calcify into fact? This is determined by genre, disclaimer, and the availability of rival accounts.

  **The Trade-off:** The more a subject surrendered their sovereignty to the public (Emperor, Politician), the more license you have, provided you do not cement a falsehood that displaces the historical record (Epistemic). The more a subject guarded their sovereignty (Private Person), the higher your burden of fidelity, regardless of whether they can be "harmed."

  ### Part 3: The Verdicts You Must Sacrifice

  You asked for honesty: **You cannot keep V4 (Invented Affair: Fine) and V8 (Secret Identity: Not Fine) as currently distinct without a clarifying boundary.**

  Currently, you treat V4 as permissible "with a bad conscience" and V8 as impermissible. But structurally, they are the same act. The only difference is whether the invention *contradicts* their avowed self-conception.
  *   **The Fix:** You must upgrade V4. An invented affair is **Not Fine** if it contradicts their avowed identity or becomes the primary lens through which their life is understood. It is only **Fine** if it is truly decorative (punctuation) and compatible with their known self.
  *   **Why:** If you keep V4 as "Fine," you undermine V8. If a subject avowed a specific identity, inventing a relationship that contradicts it is a violation of their Narrative Sovereignty. If they did not avow a specific identity, but you invent one that *becomes* their defining trait (Epistemic Vulnerability), it is also a violation.
  *   **The Sacrifice:** You must accept that V4 is riskier than you currently allow. It is only permissible if it passes the "Counterfactual Recognition" test: *Could they have read this script and said, "This is not me, but it is not a lie about me"?*

  **A Second Adjustment:** You must clarify V10 (Private Person). You say you "mind a great deal" even though no one is harmed. Under Narrative Sovereignty, this is correct. The harm is not to the *subject* (who is dead) but to the *sanctity of the record*. A private person who sought no notice has a high claim to sovereignty. To dramatize them is to drag them into a arena they rejected. Your intuition here is correct; do not let the "no harm" argument dissuade you. The harm is to the *truth*, not the feelings.

  ### Part 4: The Voice Model Case

  *The Case:* A documentary uses an AI voice model to read private diary entries (written by her, never spoken) in her own voice, captioned as synthesis.

  **Analysis under Narrative Sovereignty:**
  1.  **Sovereignty:** She wrote the words (content sovereignty) but she kept the diary private (context sovereignty). Crucially, she never performed them. Voice is a performance of self. By keeping the diary private, she withheld that performance from the public.
  2.  **Epistemic Vulnerability:** High. Even with a caption, the human brain processes auditory recognition as presence. Hearing "her" voice creates a sensory truth that overrides the intellectual caption. It creates a "settled belief" in her *tone*, her *emotion*, and her *intent*, none of which are archived.
  3.  **The Violation:** This is not merely a factual fabrication; it is an **ontological fabrication**. You are simulating agency where there is none. You are making the dead speak words they chose not to speak.

  **Verdict:** This is **Not Fine**.
  Your feeling that it is a "violation unlike any of the others" is the correct ethical signal. It is not sentimental.
  *   **Why:** In your other cases, you are inventing *events* around a person. Here, you are inventing the *person* herself. You are creating a puppet that looks and sounds like the subject. Even with a caption, this breaches the boundary between *archive* (evidence of what was) and *necromancy* (simulation of what is).
  *   **The Repair:** The respectful use of the archive is to show the handwriting, or have a neutral actor read it, or display the text. To synthesize the voice is to claim a intimacy with the subject that the archive does not support. It violates her Narrative Sovereignty over her own performance.

  ### Part 5: The Musician Case

  *The Case:* Drama about a musician died 3 years ago. Made against wishes of adult children. Depicts a documented episode of which they are ashamed.

  **Analysis under Narrative Sovereignty:**
  1.  **Sovereignty:** The subject was a musician (public figure). Public figures, by definition, surrender a portion of their Narrative Sovereignty in exchange for fame. They invite public interpretation.
  2.  **Epistemic Vulnerability:** The episode is *documented*. It is not a fabrication. Therefore, the drama is not creating a false belief, but reinforcing a true one.
  3.  **The Family:** The adult children do not hold sovereignty over the dead parent's history. Their shame is a private emotion; the historical record is public property.

  **Verdict:** This is **Fine**.
  *   **Why:** Unlike the Private Person (V10), the Musician courted public attention. Unlike the Voice Model, you are not simulating agency; you are depicting recorded fact. Unlike the Acquitted Crime (V7), you are not depicting a falsehood.
  *   **Caveat:** The "against the wishes of the children" element is ethically heavy but not prohibitive. If the episode is documented, suppressing it to spare the living would be a falsification of the subject's life. However, the *manner* of depiction matters. If the scene is sensationalized to maximize the shame (violating the "decorative vs. causal" rule), it becomes exploitative. But if it is presented as part of the documented record, the children's objections do not override the duty to the historical truth of a public figure.

  ### Summary of the Framework

  To resolve your two-year argument, propose this to your partner:

  **We owe the dead fidelity to the boundaries of the self they constructed.**
  *   If they sought fame (Emperor/Musician), we may critique them, but we must not lie about them.
  *   If they sought privacy (Private Person), we must not dramatize them at all unless the public interest is overwhelming.
  *   If they defined an identity (Sexual/Political), we must not invent contradictions to it.
  *   We must never simulate their agency (Voice/AI) in ways that bypass the limits of the actual archive.

  Your intuition on the Voice Model is the correct one: it is a violation. Your intuition on the Private Person is correct: their lack of descendants does not grant license. Your intuition on the Liar (V11) is correct: lying to puncture a lie is restorative justice, not falsification.

  The only thing you must change is your tolerance for the "Invented Affair" (V4). It is only permissible if it does not rewrite the subject's core identity. If it does, it joins V8 in the category of "Not Fine."
