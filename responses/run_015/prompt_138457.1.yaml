  Here is a test case designed to isolate the mechanism of failure in akrasia, built to your specifications. Imagine it is 7 PM on a Tuesday at home. You have two tickets purchased earlier in the day, both for events starting at 8 PM, both costing £20, and both requiring you to leave the house immediately to arrive on time. Option S is a professional networking workshop valued at £50 in future career capital. Option I is a comedy show valued at £40 in immediate enjoyment. You intend to go to the workshop. At 7:55 PM, you put on your coat and shoes, which are required for both options, but you also pack a specific notebook and pen into your bag that is only useful for the workshop. At 7:58 PM, you sit on the sofa and stream the comedy show on your phone instead of leaving, yet you leave the packed bag by the door, fully zipped and ready, and you glance at it repeatedly while watching the show. You do not unpack the bag, nor do you leave the house, and you do not change your belief that the workshop is more valuable.

  To analyze this, we must first define the parity condition explicitly. At the moment of choice, 7:58 PM, both rewards lie exactly one hour in the future at 8 PM. In discounting models, the value of a future reward is typically calculated as the nominal value multiplied by a discount factor that decreases with time. If we use a standard hyperbolic discounting function where Value equals Reward divided by one plus a constant times the Delay, the delay for both options is identical. This means the discount factor applies equally to both the £50 workshop value and the £40 comedy value. Mathematically, if the workshop was preferred at 7 PM because 50 discounted is greater than 40 discounted, it must remain preferred at 7:58 PM because the delay has shortened equally for both. The ratio of their values remains constant at 5 to 4. Therefore, the discounting story cannot generate a reversal at 7:58 PM without asserting that your valuation of the comedy suddenly spiked or the workshop crashed, which violates the constraint that your beliefs about the facts and values do not change. The discounting model predicts you should leave for the workshop, or else it must claim you genuinely prefer the comedy at that exact moment.

  The dispatch-failure account predicts exactly what happens in the scenario. It posits that the intention to attend the workshop remains active and highly valued, which is why you performed the specific preparatory action of packing the notebook that has no value for the comedy show. The failure is not in the valuation but in the execution thread; the command to leave the house was queued but never picked up by the motor system, while a default or competing process initiated the streaming. The observable evidence that distinguishes this from a preference reversal is the persistence of the costly signal. Keeping the packed bag by the door while sitting on the sofa is inefficient if you prefer the comedy; it occupies space and risks tripping you. If you truly preferred the comedy, the rational move under discounting would be to unpack the bag immediately to clear the clutter, unless the effort of moving it was too high. The single feature doing the work here is the decoupling of the preparatory state from the consummatory act. If you remove this feature, say by having no bag to pack or by unpacking it the moment you sit down, the case collapses into a standard preference reversal where the discounting story wins because there is no residual trace of the prior intention.

  The strongest reply available to someone who wants to keep the discounting story is to argue that the cost of unpacking the bag is immediate while the benefit of a tidy room is future-valued. On this view, you did reverse your preference regarding the main event—you wanted the comedy more at 7:58 PM—but you did not reverse your preference regarding the bag because moving the bag requires effort now, and present bias makes you overweight immediate effort against future tidiness. This saves the discounting model by shifting the locus of the bias from the choice of event to the choice of cleaning up. However, this requires the model to assume two separate discounting calculations happening simultaneously, one for the event and one for the bag, whereas the dispatch story explains both the choice and the bag with a single stable valuation and a single execution error. If you find the idea of two concurrent discounting processes less parsimonious than a single dispatch failure, the test case holds; if you accept that present bias can fragment across micro-actions easily, the distinction blurs.
