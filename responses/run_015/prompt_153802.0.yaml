answer: |-
  # Session Plan: The Mechanics of Intuition Pumping
  **Duration:** 90 minutes  
  **Audience:** Rationalist-curious non-specialists (comfortable with Bayesian reasoning, cognitive bias taxonomy, and LessWrong-style epistemic hygiene; no formal philosophy training).  
  **Objective:** Participants will distinguish between a logical argument and an intuition pump, recognising the latter as a narrative device that structures attention to bypass explicit premise evaluation.

  ---

  ## 1. Dependency-Ordered Sequence

  The session follows an inductive arc. Participants must experience the persuasive force of the device before they can analyse its machinery. If the mechanism is revealed too early, the example becomes a dry puzzle rather than a demonstration of cognitive influence.

  | Step | Concept | Why it must come first |
  | :--- | :--- | :--- |
  | **1** | **Naive Trust in Scenarios** | Participants must initially treat thought experiments as neutral testing grounds for logic. If they start sceptical, the 'pump' effect cannot be felt. |
  | **2** | **The Persuasive Experience** | They must feel the intuitive pull of a specific conclusion. You cannot explain how a magnet works without first demonstrating attraction. |
  | **3** | **The Framing Revelation** | Only after feeling the pull can you show *where* the force originated (the narrative framing). This creates the cognitive dissonance required for learning. |
  | **4** | **The Meta-Level Definition** | The concept of an 'intuition pump' is abstract. It must be grounded in the specific experience of Steps 2 and 3 to be meaningful. |
  | **5** | **Defensive Application** | Finally, they must apply the concept to a new context to prove transfer of learning, not just memory of the example. |

  ---

  ## 2. The Carrying Example: "The Stabilised Replacement"

  **The Scenario:**
  A volunteer agrees to a medical procedure where their biological neurons are replaced, one by one, with silicon nanobots. Each bot is functionally identical to the neuron it replaces; behavioural output remains perfectly normal. However, the protocol includes a **'Semantic Stabiliser'**: an external interpreter module that monitors the subject's speech centres. If the subject attempts to report any subjective change (e.g., 'I feel dull'), the Stabiliser adjusts the signal so the spoken report remains consistent with baseline health (e.g., 'I feel fine'), to prevent psychological distress during the transition.

  **The Intuition Pumped:**
  "Consciousness remains unchanged throughout the procedure."

  **Why this example carries the lesson:**
  1.  **Gradualism:** The step-by-step replacement lowers resistance (the Sorites effect), making the metaphysical shift feel negligible.
  2.  **Functional Identity:** Appeals to the rationalist preference for functionalism over 'magic' substance.
  3.  **The Interpreter:** The 'Semantic Stabiliser' is the critical framing device. It creates an unnoticed slide between **epistemic possibility** (we cannot *know* consciousness changed because reports are stable) and **metaphysical possibility** (consciousness *did not* change). The narrative encourages the audience to treat the stable reports as evidence of internal state, despite explicitly stating the reports are mediated.

  **Required Feature to Lack:**
  The scenario must lack a **clean resolution**. There is no fact of the matter provided within the story that confirms whether qualia faded or persisted. If there were a definitive answer (e.g., "The subject later reported a gap in memory"), the audience would treat it as a puzzle with a solution rather than a device that manufactures conviction. The ambiguity is essential; the pump fills the void where evidence should be.

  ---

  ## 3. Misconception Mapping & Interception

  | Misconception | When it arises | Interception Strategy |
  | :--- | :--- | :--- |
  | **1. Intuitive Pull = Logical Validity**<br>("If the story feels coherent, the conclusion follows.") | **During Step 2 (The Persuasive Experience).**<br>Immediately after polling the group on whether consciousness persists. | **The Pause:** Do not confirm the answer. Instead, ask: "Did you arrive at that conclusion via a deductive chain, or did the conclusion arrive *with* the story?" Highlight that the feeling of certainty appeared before the logic was articulated. |
  | **2. Conviction = Evidence**<br>("My strong feeling that X is true counts as evidence for X.") | **During Step 3 (The Framing Revelation).**<br>When revealing the role of the 'Semantic Stabiliser'. | **The Decoupling:** Explicitly state: "The Stabiliser ensures you *feel* convinced that the subject is fine, but it removes the very evidence (truthful reporting) required to justify that conviction." Show that the narrative device generated the feeling *instead* of supplying the evidence. |
  | **3. Identification = Dissolution**<br>("Once I spot the hidden premise, the pump is broken/useless.") | **During Step 4 (The Meta-Level Definition).**<br>When discussing how to handle pumps in the wild. | **The Persistence Warning:** Explain that identifying the pump does not make it stop working on others, nor does it necessarily falsify the conclusion. It merely shifts the burden of proof. The pump is a rhetorical tool, not a logical fallacy; it can still be useful if the framing is made explicit. |

  ---

  ## 4. Check-for-Understanding Question

  **Do not ask:** "What is an intuition pump?" or "What was the Stabiliser?"  
  **Ask:**  
  > "If you were tasked with rewriting 'The Stabilised Replacement' to pump the *opposite* intuition (that consciousness *is* lost) without changing any of the factual premises regarding the neurons or the bots, which element of the narrative framing would you adjust, and why?"

  **Success Criterion:**  
  A correct answer identifies a framing device (e.g., renaming the 'Stabiliser' to a 'Censor', or describing the gradual replacement as 'erosion' rather than 'upgrade') that structures attention towards loss rather than continuity. This demonstrates they understand the pump works by *directing attention*, not by supplying new premises.

  ---

  ## 5. Explicit Omissions & Credibility Management

  **What to Leave Out:**
  1.  **Formal Modal Semantics:** Do not discuss possible worlds theory or the logic of necessity/possibility.
  2.  **Dennett's Full Taxonomy:** Do not detail the specific categories of pumps (e.g., 'wrong way up', 'detail bombardment') found in *Elbow Room* or *Consciousness Explained*.
  3.  **Historical Attribution:** Do not dwell on the specific lineage of the 'gradual replacement' argument (e.g., Nozick, Chalmers, Metzinger) beyond a passing mention.

  **How to Acknowledge Omission:**
  At the start of Step 4 (The Meta-Level Definition), state the following:  
  > "We are treating the intuition pump as a practical tool for epistemic hygiene today, much like learning to spot a ad hominem attack without studying the entire history of logic. There is a deep academic taxonomy developed by Dennett and others regarding modal semantics and specific classifications. We are omitting that formal machinery not because it lacks value, but because our goal here is operational competence: recognising the mechanism in real-time discourse rather than analysing it post-hoc."

  This frames the omission as a pedagogical choice focused on skill acquisition, preserving credibility while maintaining scope.
