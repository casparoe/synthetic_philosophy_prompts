prompt: |-
  hi there — i'm writing a novel and there's a scene in a pub where two characters are arguing about whether you can have a category with no centre at all. i want to ground it in wittgensteins language games and family resemblance, but compared with radial categories in cognitive linguistics (the lakoff sort of thing). specificaly, can family resemblance survive if every example is peripheral — no prototypical game, no core language-game? and if use is meaning, does stripping away the central practices leave you with nothing, or just a different web? i don't want a bibliography or quotes, just a sharp comparison that digs into whether one view collapses quicker than the other when you remove the middle. keep it casual but conceptually dense — my characters are clever but not academics.
reasoning: |-
