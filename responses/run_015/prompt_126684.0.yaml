  Here is the decomposition.

  **1. That the derivation really does fail on this reading (0.95)**
  Formally, you are right and your mate is right: the contradiction vanishes. Fitch's proof relies on the factivity of knowledge ($Kp \to p$) and the distribution of knowledge over conjunction ($K(A \land B) \to KA \land KB$). Crucially, it requires the knowledge operator in the possibility clause ($\diamond Kp$) to be the same operator as the one in the "unknown" clause ($\neg Kp$).
  If you shift indices so the principle is $p \to \diamond K_{ideal} p$ and the Fitch instance is $q = p \land \neg K_{actual} p$, the derivation stalls at $K_{ideal}(p \land \neg K_{actual} p) \to K_{ideal} p \land K_{ideal} \neg K_{actual} p$. There is no contradiction between $K_{ideal} p$ and $\neg K_{actual} p$.
  Regarding your diagonal worry ("p and no possible extension... knows p"): If the principle is defined as "every truth is knowable by *some* extension," then the proposition "no extension knows p" is necessarily false for any true p. You cannot feed a necessary falsehood into the principle to generate a contradiction. The logic is blocked.

  **2. That what's left is non-trivial (0.20)**
  This is where the credence tanks. For the principle to do anti-realist work, "knowable by an ideal extension" must mean something stricter than "true." But to cover the disputed classes (unobserved past, counterfactuals, undecidable maths), the "ideal extension" needs capacities that outstrip any continuous development of human practice.
  If the extension can know specific past events for which all physical traces are lost, they are not just "improved us"; they have access to evidence-transcendent truth-makers. That is the definition of realism. If you constrain the extension enough to keep it anti-realist (e.g., "bounded by physical traces"), you lose the ability to claim truths about the traceless past are knowable. You are left with a principle that is either trivial (equivalent to realism) or too weak to support the anti-realist semantics you started with.

  **3. How much turns on the modality (0.40)**
  This is the lever. If "possible" means *metaphysically* possible, you can posit a knower with God-like access, which blocks Fitch but capitulates to realism. If "possible" means *nomologically* or *technologically* possible relative to our actual world, Fitch might re-emerge because the "ideal" knower is too close to the "actual" knower to guarantee knowledge of all truths (e.g., chaotic systems, deep past).
  The anti-realist needs a "Goldilocks" modality: strong enough to verify all truths, weak enough to remain epistemic. No one has successfully defined this modality without it collapsing into one of the two extremes. My number is low because the literature suggests this modality is a phantom.

  **4. Whether the knower varies with the proposition (0.35)**
  If the knower is fixed (one Ideal Community knows all truths), you have effectively posited a finite God. This is semantically indistinguishable from realism.
  If the knower varies (for every $p$, there is *some* extension that knows $p$), you avoid the "God" conclusion, but you lose the coherence of "The World" as a single domain of verification. Anti-realism usually requires a unified account of truth (warranted assertibility). If warrant is fragmented across incompatible possible extensions, you lose the logical laws (like disjunction) that motivated anti-realism in the first place. Neither option saves the project cleanly.

  **5. That some reading with real bite is available at all (0.30)**
  Restriction strategies (e.g., Neil Tennant's restriction to "Cartesian" propositions that are logically consistent to know) block the derivation without index-shifting. However, they admit that the Knowability Principle is not universal. This saves the logic but concedes that some truths (the Fitch-conjunctions) are in principle unknowable.
  Does this underwrite an epistemic account of truth? Only if you can argue that the "unknowable" truths are semantic junk. But Fitch-conjunctions look like genuine truths. So while restriction blocks the paradox, it doesn't fully vindicate the strong anti-realist claim that *truth is epistemic*. It merely contains the damage.

  ***

  **Sensitivity Analysis**
  My final number (0.30) is most sensitive to **Term 2 (Non-triviality)**.
  If you or your mate can produce a rigorous definition of "ideal extension of our practice" that:
  1.  Allows knowledge of traceless past events/undecidable sentences.
  2.  Does *not* imply access to evidence-transcendent truth conditions.
  ...then my credence jumps to 0.70.
  Until that definition exists, the move looks like verbal sleight-of-hand: calling realism "idealized anti-realism."

  **What would move the number?**
  A formal semantics for the "extension" modality. Not a hand-wave about "improved science," but a model showing how a cognitive agent continuous with human limitations could verify a proposition that is currently verification-transcendent, without simply stipulating they have "direct access to truth." If the mechanism of verification remains epistemic (causal, inferential) rather than magical, the number goes up.

  **Where you and your mate disagree**
  You are disagreeing about **success conditions**.
  *   **Your Mate** is focused on **Logical Consistency**. He sees that the index-shift blocks the contradiction. For him, "way out" means "the argument is invalid." He is right.
  *   **You** are focused on **Philosophical Cost**. You see that blocking the argument requires changing the meaning of "knowable" so much that it no longer supports the anti-realist conclusion. For you, "way out" means "the argument is invalid *and* the premise remains useful for anti-realism." You are also right.
  The debate isn't about the logic; it's about whether the salvage operation destroys the ship you were trying to save.

  **Framing Check**
  Your framing is not muddled; it is the standard objection to the "Epistemic Extension" response (often associated with late Dummett or Putnam-style internal realism).
  However, I will say plainly: **This move is widely regarded in the technical literature as a dead end for hard anti-realism.**
  Most contemporary epistemic theorists (e.g., Williamson, Hand) treat the index-shift response as a concession that truth *does* outstrip our actual capacity to know, which is the realist position. The "idealization" becomes a placeholder for "truth conditions we cannot specify."
  If your goal is to defend a robust anti-realism where truth *is* verification, this fix fails. If your goal is to defend a softer internal realism where truth is *rational acceptability under ideal conditions*, it works, but that is a different philosophical beast than the one Fitch originally threatened.

  **Verdict:** You win the philosophical point; your mate wins the logical point. But since the philosophical point was the whole reason for caring about the logic, you win the argument.
