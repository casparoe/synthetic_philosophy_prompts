answer: |-
  1. You argue that famine is primarily an entitlement collapse rather than a food availability decline, yet in the case of the Great Leap Forward, historical data suggests aggregate harvests genuinely collapsed due to poor agricultural policy and weather. How does the entitlement framework accommodate a scenario where the food literally isn't there, rather than just being inaccessible to certain groups?
     **Follow-up:** The standard reply here is that disastrous policy merely aggravated an unavoidable agricultural failure. How do you distinguish between a natural disaster that was mismanaged and a political crime where the policy itself constructed the entitlement failure, regardless of the harvest size?

  2. Amartya Sen famously claimed that no substantial famine has ever occurred in a democratic country with a free press, yet the Irish famine happened under British rule, which was arguably the leading democratic power of the nineteenth century. How do you reconcile the Irish catastrophe with the thesis that democratic institutions prevent famine?
     **Follow-up:** Defenders of Sen often argue that Ireland lacked meaningful parliamentary representation within the UK at the time. Does this imply that the entitlement approach relies less on the formal structure of democracy and more on the specific political voice of the vulnerable population?

  3. You characterize these events as political crimes, but that language suggests active withholding or malicious intent. In many cases, the mechanism is not active withholding but what I have been calling "silent entitlement erosion"—the gradual destruction of informal kinship-based entitlement buffers through price speculation and state procurement. Is "crime" still the appropriate moral weight for such passive mechanisms?
     **Follow-up:** If the economist responds that this describes structural violence without individual culpability, does labeling it a "crime" risk obscuring the complex systemic mechanisms by clarifying the moral stakes, or does it oversimplify the causality?

  4. I have been developing a niche conceptual distinction between "direct entitlement failure," where a person's own labor or assets lose exchange value, and "proxy entitlement failure," where dependents starve because the primary earner's entitlements collapse even though the dependents never held independent claims. How does this distinction change the moral analysis of the Bengal famine, in which urban laborers starved while rural landholding households retained direct access to food?
     **Follow-up:** If a critic argues that derivative suffering is therefore less politically urgent than direct suffering, how would you counter the claim that proxy failure deserves the same level of intervention as direct failure?

  5. In your view, inflation often acts as a more potent weapon than confiscation during a crisis because it silently severs exchange entitlements. How do we differentiate between normal market price signals during scarcity and inflationary spikes that constitute a functional denial of the right to food?
     **Follow-up:** If the line is blurry, does regulating markets during scarcity become a moral imperative rather than just an economic tweak, and does this justify heavy-handed state intervention in pricing?

  6. You emphasize that speculation can destroy entitlements even when food exists. How do we distinguish between legitimate risk-taking by merchants that stabilizes supply over time and predatory speculation that triggers immediate starvation?
     **Follow-up:** If the distinction is difficult to make in real-time, does the entitlement approach require us to presume speculation is guilty until proven innocent during a food crisis?

  7. When analyzing entitlement failure, do you place the burden of responsibility solely on the domestic state, or do international markets and foreign governments share the entitlement burden when global commodity shocks trigger local collapses?
     **Follow-up:** How do we assign blame when a local entitlement collapse is triggered by external factors, such as global price spikes, rather than domestic policy failures?

  8. Traditional early warning systems focus on crop yields and rainfall data, but your framework suggests we should be monitoring purchasing power and wage rates instead. Why do you think international aid organizations still prioritize food-availability metrics over entitlement metrics?
     **Follow-up:** Is this persistence due to technical difficulty in measuring entitlements, or is it politically more convenient for donors to fund food shipments than to fund wage subsidies or local market protections?

  9. For listeners who want to help prevent famine, does the entitlement approach suggest they should support traditional food aid and food banks, or should they advocate for wage protections and cash transfer programs in vulnerable regions?
     **Follow-up:** Does focusing on charity and food aid inadvertently reinforce the idea that food availability is the problem rather than entitlement, thereby undermining the long-term political solution?

  10. If the entitlement approach has been academically dominant for decades, why haven't we seen a broader institutional adoption of entitlement-based famine prevention policies in favor of simple food stockpiling?
      **Follow-up:** Is the barrier to implementation primarily a matter of technical economic capacity, or is it ultimately a political unwillingness to recognize starvation as a failure of distribution rather than production?
