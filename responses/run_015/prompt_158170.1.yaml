  # The Dream Report Decision Tree

  **Root Node:** Does phenomenal consciousness (raw subjective feeling) occur *during* REM sleep?

  *   **NO**
      *   **Leaf 1: Cartesian Skepticism (Malcolm's View)**
          *   *Commitment:* Since there is no criterion for ascribing experience to a sleeper, dream reports must be treated as imaginative expressions upon waking rather than memories of prior events.

  *   **YES**
      *   **Node 2:** Is access-consciousness (availability for cognitive processing/report) present during sleep, merely blocked by state-change amnesia?
          *   **YES**
              *   **Node 3:** Are awakening reports direct retrievals of these accessible traces once amnesia lifts?
                  *   **YES**
                      *   **Leaf 2: Common-Sense Realism**
                          *   *Commitment:* This view must explain why dream memory is so notoriously fragile compared to waking memory if the encoding mechanism is fundamentally the same.
                  *   **NO**
                      *   **Leaf 3: The Redundant Reconstruction (Unoccupied)**
                          *   *Commitment:* It posits that the brain accesses stored data during sleep but inexplicably chooses to rebuild the story from scratch upon waking, making the initial access functionally useless.
          *   **NO** (Access is not present during sleep)
              *   **Node 4:** Do awakening reports rely on *any* specific sensory traces left by the sleep state (Episodic Contamination)?
                  *   **YES**
                      *   **Node 5:** Is the phenomenal experience *had* during sleep, or generated only at the moment of waking?
                          *   **During Sleep**
                              *   **Leaf 4: Realism Without Access**
                                  *   *Commitment:* It requires accepting that rich experiences can occur without being cognitively available to the dreamer until a later state change reverses the blockage.
                          *   **At Waking**
                              *   **Leaf 5: Trace-Activation Constructivism (Dennett Variant)**
                                  *   *Commitment:* It claims the "feeling" of the dream is created at waking, meaning the sleeper never actually experienced the dream while it was happening.
                  *   **NO** (No specific sensory traces)
                      *   **Node 6:** Is the report generated de novo as a coherent narrative structure (Narrative Imposition)?
                          *   **YES**
                              *   **Leaf 6: Strong Constructivism (Dennett's View)**
                                  *   *Commitment:* It implies that the vivid sense of "having lived through" the dream is a retrospective illusion stitched together in the first seconds of consciousness.
                          *   **NO**
                              *   **Leaf 7: The Ineffable Qualia View (Incoherent)**
                                  *   *Commitment:* It asserts experience exists without access, traces, or narrative structure, rendering the existence of detailed dream reports logically impossible.

  ***

  ### Taxonomy Notes: Unoccupied and Indistinguishable Spaces

  **The Unoccupied Leaf (Leaf 3):**
  The combination of **Yes Phenomenal + Yes Access + No Direct Retrieval** produces an unoccupied leaf. This view is diagnosed as **merely unattractive**. It suggests the brain successfully encodes and accesses dream content during sleep (satisfying the memory condition) but then ignores that access to reconstruct the narrative upon waking. While logically possible, it violates principles of cognitive economy; no theorist argues for a system that builds a memory only to discard it for a reconstruction of the same content.

  **The Indistinguishable Leaves:**
  No leaves in this taxonomy are flagged as genuinely indistinguishable. While **Leaf 2 (Common-Sense Realism)** and **Leaf 4 (Realism Without Access)** both result in the claim "I experienced this during sleep," they diverge on the mechanism of memory storage (Access vs. No Access). This is a substantive theoretical difference regarding the architecture of consciousness, even if the first-person report remains identical.

  **The Incoherent Leaf (Leaf 7):**
  The combination of **Yes Phenomenal + No Access + No Traces + No Imposition** is diagnosed as **incoherent**. If there is no access during sleep, no sensory traces left behind, and no narrative generation at waking, there is no causal source for the content of a dream report. A view occupying this leaf would have to claim reports exist without any input, which contradicts the premise that reports are being analyzed.
