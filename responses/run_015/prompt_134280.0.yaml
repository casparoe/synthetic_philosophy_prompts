  # Taxonomy of Positions on Neural Quantity and Moral Weight

  **Instructions:** Begin at **Node 1**. Answer the question based on your intuitive judgment of the case provided. Follow the arrow corresponding to your answer until you reach a **Leaf**. Each Leaf represents a coherent philosophical position, accompanied by its most difficult commitment.

  ---

  ### Node 1: The Redundant Hardware Case
  **Case:** Imagine two beings that are indistinguishable in behavior and in every report they could give about their inner life. However, Being A runs on a neural substrate that is one hundred times larger than Being B, utilizing vast amounts of redundant and metabolically wasteful hardware to produce the exact same output.
  **Question:** Does Being A have greater moral weight simply in virtue of possessing more neural tissue, even if the *output* (suffering/enjoyment) is identical?

  *   **YES** (Neural quantity is constitutive of value) → Go to **Node 2**.
  *   **NO** (Neural quantity is evidential or irrelevant) → Go to **Node 5**.

  ---

  ### Branch A: The Constitutive View (Structuralists)

  ### Node 2: The Hemisphere Removal Case
  **Case:** You believe neural quantity matters. Consider a human child who had an entire cerebral hemisphere removed in infancy and grew up with a roughly ordinary mental life and behavioral capacity.
  **Question:** Is this individual's moral weight strictly proportional to the tissue lost (i.e., roughly halved)?

  *   **YES** (Value scales linearly with mass) → Go to **Node 3**.
  *   **NO** (Value depends on thresholds or specific tissue types) → Go to **Node 4**.

  ### Node 3: The Association Neuron Case
  **Case:** You accept linear scaling. Imagine a non-human animal that possesses three times as many association neurons as a typical human, but lacks language or long-term planning capabilities.
  **Question:** Does this animal outrank a typical human in moral weight?

  *   **YES** → **Leaf 1: Neural Raw Scalarist**
  *   **NO** → **Leaf 2: Functional Type Scalarist**

  ### Node 4: The Sensory Map Case
  **Case:** You reject linear scaling for humans. Imagine a brain that is very large but is almost entirely a single sensory map (e.g., a massive visual cortex) with minimal integration or planning capacity.
  **Question:** Does this brain count for more than a smaller, highly integrated brain simply because it exceeds a volume threshold?

  *   **YES** → **Leaf 3: Volume Thresholdist**
  *   **NO** → **Leaf 4: Integration Thresholdist**

  ---

  ### Branch B: The Evidential View (Hedonics & Functionalists)

  ### Node 5: The Shrimp-Cow Equivalence Case
  **Case:** You believe neural quantity is not constitutive. Suppose a shrimp turned out to have a hedonic life (capacity for suffering and enjoyment) as rich as a cow's, verified by all available behavioral and physiological markers.
  **Question:** Do they count for exactly as much morally?

  *   **NO** (Reports/markers are insufficient proof) → **Leaf 5: Hedonic Skeptic**
  *   **YES** (Hedonic capacity is the sole currency) → Go to **Node 6**.

  ### Node 6: The Artificial Substrate Case
  **Case:** You accept hedonic equivalence. Consider two artificial systems: one with a hundred times the parameters and a thousand times the training compute of the other.
  **Question:** Is the question "Do they feel?" well-formed, or does the biological nature of the substrate matter?

  *   **NO** (Biology is required for feeling) → **Leaf 6: Biological Particularist**
  *   **YES** (Substrate is irrelevant) → Go to **Node 7**.

  ### Node 7: The Measurement vs. Truth Case
  **Case:** You accept substrate neutrality. We cannot perfectly measure hedonic states in real-time.
  **Question:** Is neural size a fact about the *amount* of value present, or merely the most legible proxy for institutions under uncertainty?

  *   **PROXY** (It is a rule of thumb for policy) → **Leaf 7: Institutional Pragmatist**
  *   **TRUTH** (It tracks the actual metaphysical quantity) → Go to **Node 8**.

  ### Node 8: The Temporal Grain Case
  **Case:** You believe neural size tracks actual value. Does a larger or more complex system pack *more* moral value into a minute by feeling pains more deeply, or by fitting more distinct moments of experience into that minute?

  *   **DEEPLY** (Intensity scales with complexity) → **Leaf 8: Qualia Intensivist**
  *   **MORE MOMENTS** (Frequency scales with complexity) → **Leaf 9: Experience Fragmentalist**

  ---

  ### Position Leaves

  **Leaf 1: Neural Raw Scalarist**
  *   **View:** Moral weight is strictly proportional to total neural mass or count, regardless of function or species.
  *   **Awkward Commitment:** Must accept that a severely cognitively impaired human has less moral weight than a healthy cow if the cow has more neural tissue.

  **Leaf 2: Functional Type Scalarist**
  *   **View:** Moral weight scales with neural count, but only for specific types of tissue (e.g., association neurons) that support higher-order functions.
  *   **Awkward Commitment:** Must define exactly which neurons count without appealing to the very behavioral capacities they claim are irrelevant.

  **Leaf 3: Volume Thresholdist**
  *   **View:** Moral status is binary, triggered once a brain exceeds a specific physical size, regardless of internal organization.
  *   **Awkward Commitment:** Must accept that a giant, unorganized sensory organ could qualify as a moral person if it hits the weight limit.

  **Leaf 4: Integration Thresholdist**
  *   **View:** Moral status is binary, triggered by the presence of specific integrative structures (e.g., thalamocortical loops) rather than raw volume.
  *   **Awkward Commitment:** Must explain why integration matters morally without simply restating "consciousness" as the criterion.

  **Leaf 5: Hedonic Skeptic**
  *   **View:** Behavioral reports are never sufficient to confirm equal hedonic capacity across different physical structures.
  *   **Awkward Commitment:** Must claim we can never know if another being's suffering matches ours, rendering the principle of equal consideration practically unusable.

  **Leaf 6: Biological Particularist**
  *   **View:** Hedonic capacity is real, but it is an emergent property of biological chemistry, not computational function.
  *   **Awkward Commitment:** Must claim a silicon system running a perfect simulation of a screaming human feels nothing, while a biologically engineered vat of tissue feels everything.

  **Leaf 7: Institutional Pragmatist**
  *   **View:** Neural size is theoretically irrelevant to truth, but it is the only measurable metric available for law and policy.
  *   **Awkward Commitment:** Must endorse enforcing a rule known to be theoretically false to prevent worse errors in moral allocation.

  **Leaf 8: Qualia Intensivist**
  *   **View:** Greater neural capacity allows for deeper, more intense valenced states per unit of external time.
  *   **Awkward Commitment:** Must accept that one second of a complex being's agony could outweigh a year of a simple being's pain.

  **Leaf 9: Experience Fragmentalist**
  *   **View:** Greater neural capacity allows for more distinct frames of experience per unit of external time (higher temporal grain).
  *   **Awkward Commitment:** Must accept that saving a being with fast neural firing for one minute is morally preferable to saving a slow-firing being for ten.

  ---

  ### Notes on Logical Space

  *   **Unoccupied Combinations:** There is no leaf for a "Structural Pragmatist." If one believes neural size is constitutive of value (Node 1: YES), it cannot simultaneously be merely a proxy (Node 7). This path is logically blocked.
  *   **Inseparable Leaves:** **Leaf 8 (Qualia Intensivist)** and **Leaf 9 (Experience Fragmentalist)** are theoretically distinct (depth vs. frequency), but empirically they may be inseparable without a complete theory of consciousness. A reading group should treat these as a single "Scalar Hedonic" cluster if they find the distinction unmeasurable.
  *   **Diagnosis:** The tension between **Leaf 1** and **Leaf 4** mirrors your disagreement with your friend. She occupies **Leaf 5/7** (Hedonic/Pragmatic), while you were drifting toward **Leaf 2** (Functional Scalar). The incompatibility you felt regarding the human hemisphere case arises because **Leaf 2** struggles to explain why humans don't lose value when tissue is lost, unless they appeal to **Leaf 4** (Integration), which your friend rejects as smuggling in a proxy.
