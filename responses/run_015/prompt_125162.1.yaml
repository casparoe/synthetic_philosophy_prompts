answer: |-
  Here are ten questions drafted for your mock colloquium with Dr. Varga. They are designed to be rigorous, philosophically precise, and structured to prevent her from retreating into general restatements of the Lange model.

  ### I. The Misesian Calculation Objection (Questions 1–2)

  **1.** Dr. Varga, Mises's core objection wasn't merely that planners lack data, but that without private ownership of the means of production, there is no genuine exchange of *titles* to capital goods, and therefore no genuine prices. In your model, managers trade notional claims settled in social dividends, but they do not surrender control of the capital assets themselves if their bets fail. If the "price" generated in your internal futures market does not reflect a transfer of ownership rights that exposes the trader to the loss of future control over those resources, in what sense is it a *common denominator* of opportunity cost rather than just a sophisticated guess?

  > **Follow-up (Anticipating her reply):** You'll likely argue that the social dividend acts as a surrogate for profit-and-loss, disciplining managers through consumption constraints. But if a manager makes a catastrophic capital allocation error, they lose dividend points, not the factory. Does this sever the essential Misesian link between *calculation* and *responsibility*? If the capital itself remains immune to liquidation or transfer based on the price signal, isn't the price merely descriptive rather than constitutive of economic rationality?

  **2.** Relatedly, Mises argued that capital goods are heterogeneous and complementary; a machine's value depends on its place within a specific production structure. Your prediction market prices claims on individual capital goods or sectors. How does your model generate prices that reflect the *systemic* value of capital combinations when the ownership of the complementary assets remains fixed with the state? If I can trade a claim on a turbine but not the grid it connects to, isn't the price signal inherently distorted by the inability to arbitrage the whole production structure?

  ### II. The Hayekian Knowledge Problem (Questions 3–4)

  **3.** Hayek emphasized that much of the relevant economic knowledge is tacit—knowledge of "time and place" that cannot be statistically aggregated without being distorted. Prediction markets, by definition, require traders to bet on *articulated* outcomes with specific settlement conditions. By forcing managers to translate their local, tacit knowledge into explicit contracts tradable on your internal board, aren't you filtering out the very inarticulable knowledge Hayek claimed was essential? Does the requirement to formalize the bet destroy the informational content you're trying to capture?

  > **Follow-up (Anticipating her reply):** You will probably suggest that the *price itself* aggregates the knowledge without anyone needing to articulate the reasons, preserving the tacit element. But Hayek also stressed that the price system is a mechanism for *entrepreneurial discovery* of new ends, not just the allocation of known means. If your prediction markets are limited to predefined capital allocations set by the Planning Board, how does the model handle radical uncertainty where the relevant future states are unknown? Can a market price risk without a defined sample space of outcomes?

  **4.** If the internal market is designed to handle investment, it must price long-term innovation. But Hayek argued that competition is a "discovery procedure." In your system, the Central Planning Board must still decide *which* prediction markets to open and *what* counts as a valid capital claim. Doesn't this reintroduce the central bottleneck? If the Board decides which futures are tradable, aren't they implicitly deciding which technological futures are permissible, thereby stifling the discovery procedure before the market can even price it?

  ### III. Incentive Compatibility and Gaming (Questions 5–6)

  **5.** A classic critique of Langean socialism is the soft budget constraint: managers face no hard threat of bankruptcy. In your model, losses on prediction market bets are socialized via adjustments to the dividend, but the capital remains public. What prevents a coalition of managers from manipulating the internal futures prices to signal high demand for a pet project, securing more resource allocation, knowing that if the project fails, the loss is absorbed by the social dividend rather than their personal equity? How do you prevent the prediction market from becoming a lobbying mechanism rather than a discovery mechanism?

  > **Follow-up (Anticipating her reply):** I expect you will rely on proper scoring rules (like logarithmic market scoring rules) to make truth-telling the dominant strategy. But scoring rules require timely verification of the truth to penalize lying. In long-term capital investment, the "truth" of a decision may not be known for a decade. By the time the scoring rule penalizes the false forecast, the manager has likely been promoted or retired. How do you discount for this temporal lag in accountability without reintroducing private property rights that persist over time?

  **6.** If managers are rewarded based on the accuracy of their forecasts relative to the market consensus, doesn't this encourage herding? If the social dividend is distributed based on performance relative to the internal market, managers have an incentive to bet with the crowd to avoid standing out as wrong, rather than betting on contrarian local knowledge that might be correct but risky. Doesn't this flatten the diversity of expectation that your model relies on to solve the knowledge problem?

  ### IV. Systemic and Political Economy Concerns (Questions 7–9)

  **7.** You argue that the clearing prices in the internal market allow for dynamic planning. However, in a capitalist firm, the residual claimant (the shareholder) has the ultimate authority to override market signals if they believe long-term strategy demands it. In your model, who has the authority to *ignore* the prediction market? If the Central Planning Board can override the internal market prices for political reasons, the prices lose their authority; if they cannot, the Board is merely a rubber stamp. Which is it, and does that not collapse the distinction between your model and either state capitalism or pure syndicalism?

  **8.** Lange's original model assumed managers follow the rule $P = MC$. But in your souped-up version, managers are also traders. Does this create a conflict of interest? If a manager can influence the marginal cost of their production by manipulating the internal price of the capital inputs they trade, might they not distort production costs to improve their trading position? How do you firewall the production management role from the capital trading role without creating bureaucratic inefficiencies that defeat the purpose of the market?

  **9.** Let's talk about the "social dividend." If this dividend is the only real currency for settlement, it effectively becomes a second currency alongside the wage currency for consumer goods. Historically, dual-currency systems create arbitrage opportunities and black markets. What prevents managers from colluding with consumer representatives to undervalue capital claims in the internal market in exchange for off-book favors in the consumer goods market? Is there a mechanism to prevent the notional capital market from bleeding into the real consumer market?

  ### V. Falsification (Question 10)

  **10.** Finally, Dr. Varga, let's talk about falsification. Neoclassical defenders of capitalism often argue that the calculation problem is a *conceptual* impossibility for socialism, not just an empirical hurdle. But you are making an empirical claim about the efficiency of your internal prediction markets. What specific empirical result or conceptual argument would count against your model? If we saw a neo-Langean economy with these internal markets grow slower or innovate less than a comparable mixed economy, would you attribute that to implementation error, or would it demonstrate that notional prices simply cannot substitute for property rights in capital? What is the condition under which you would concede that Mises was right after all?
