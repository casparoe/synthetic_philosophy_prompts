  The fire burns because there is wood.
  The water spills when the bowl is broken.

  The wood is ash before the flame.
  It is solid for the hand that leans.
  The water spills when the bowl is broken.
  It is hollow for the eye that sees.

  It is solid for the hand that leans.
  No center waits for the knife to find.
  It is hollow for the eye that sees.
  The paper holds the ink it was given.

  ***

  **Analysis**

  I have treated the fourth limb not as a transcendent position alongside the others, but as a refusal of the ontological commitment required to hold any of the first three. The "Neither" stanza does not offer a solution; it removes the substrate ("center") that would allow the thing to be solid, hollow, or broken in itself. In these lines, "empty" means dependently arisen and conventionally designated: the ink is only on the paper because it was *given*, not because the paper possesses an ink-holding nature.

  The poem leans most heavily on a contested reading in the third stanza. Interpreting "Both is and is not" as "solid for the hand... hollow for the eye" relies on a pragmatic, phenomenological reading of the tetralemma (valid in different contexts simultaneously) rather than a strict logical one (which Nāgārjuna often rejects as incoherent). I prioritized the philosopher's care over the logician's rigor to avoid the mystical "paradox" your beta readers flagged. The rhyme of "leans/sees" is slant and unobtrusive, bought to stabilize the third stanza's rhythm; it earns its place by grounding the relativism in bodily action rather than abstract thought.

  This would be the wrong poem if emptiness were interpreted as nihilism (nothing exists at all) or as mystical monism (all is one). If nihilism were the claim, the first stanza's affirmations would be lies rather than conventions. If monism were the claim, the fourth stanza's "No center" would be replaced by an assertion of universal unity. If I had to rewrite one stanza to correct a drift toward mysticism, it would be the third; I would strip the perceptual language ("hand/eye") for purely functional language ("use/waste") to ensure the "Both" remains materialist and devoid of spiritual observation.
