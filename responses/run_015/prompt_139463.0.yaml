  **Setting.** Consider pretrial release. The true outcome $Y$ is rearrest within two years; the recorded outcome $R$ is an arrest entered into the state database. The recording mechanism is patrol allocation: Group A resides in a high-surveillance zone where 80% of rearrests are recorded ($\alpha_A=0.8$); Group B resides in a low-surveillance zone where only 60% are recorded ($\alpha_B=0.6$). We assume no false positives ($R=1 \implies Y=1$). The institution trains a risk score $S$ to predict $R$.

  **Construction.** Let Group A have true base rate $\beta_A=0.5$ and Group B $\beta_B=4/9 \approx 0.44$. Recorded base rates are $\gamma_A = 0.8 \times 0.5 = 0.4$ and $\gamma_B = 0.6 \times 4/9 \approx 0.267$. The score $S$ is the conditional expectation $E[R|X]$. For Group A, let $S \sim \text{Uniform}[0, 0.8]$. For Group B, let $S$ take value $0$ with probability $0.5$ and $8/15 \approx 0.533$ with probability $0.5$. Both distributions yield $E[S]=\gamma_g$. The union of supports contains infinite values, satisfying the distinctness constraint, with overlap at $0$ and $8/15$.

  **Calibration on Recorded Outcome.** By definition, $S=E[R|X]$, so $P(R=1|S=s, G=g) = s$ for all $s$. This holds within each group automatically.

  **Balance for Positives on Recorded Outcome.** Balance requires $E[S|R=1, A] = E[S|R=1, B]$. Using Bayes' rule, $E[S|R=1, g] = E[S^2|g]/\gamma_g$.
  For A: $E[S^2] = \int_0^{0.8} \frac{s^2}{0.8} ds = \frac{0.8^2}{3} = \frac{0.64}{3}$. Ratio: $\frac{0.64/3}{0.4} = \frac{1.6}{3} = \frac{8}{15}$.
  For B: $E[S^2] = 0.5(0)^2 + 0.5(8/15)^2 = \frac{32}{225}$. Ratio: $\frac{32/225}{4/15} = \frac{32}{225} \times \frac{15}{4} = \frac{8}{15}$.
  The means match at $0.533$. Balance holds.

  **Balance for Negatives on Recorded Outcome.** We check $E[S|R=0, g] = \frac{E[S] - E[S^2]}{1-\gamma_g}$.
  For A: $\frac{0.4 - 0.213}{0.6} \approx 0.311$.
  For B: $\frac{0.267 - 0.142}{0.733} \approx 0.171$.
  Balance fails ($0.311 \neq 0.171$). The case is non-degenerate.

  **Target-Robustness Failure.** Define target-robustness as: (1) $P(Y=1|S=s, A) = P(Y=1|S=s, B)$; (2) The group with higher recorded risk has higher true risk.
  Since $R=1 \implies Y=1$, $P(Y=1|S=s, g) = P(R=1|S=s, g)/\alpha_g = s/\alpha_g$.
  At the overlapping score $s=8/15$:
  True Risk A = $(8/15)/0.8 = 2/3 \approx 0.67$.
  True Risk B = $(8/15)/0.6 = 8/9 \approx 0.89$.
  Part 1 fails: The risk gap is $0.22$.
  Part 2 fails: Group A has higher recorded base rate ($0.4 > 0.267$), suggesting A is riskier. But at equal scores, B is truly riskier ($0.89 > 0.67$). The ordering reverses.

  **General Fact.** Any score calibrated on $R$ satisfies $P(Y=1|S=s, g) = s/\alpha_g$. If $\alpha_A \neq \alpha_B$, true risks differ at every $s>0$. Balance conditions on $R$ are bystanders; the failure is driven entirely by the scaling factor $1/\alpha_g$ applied to the calibrated score. Calibration on a biased proxy mathematically guarantees miscalibration on the truth.

  **Ablation.** First, equalize sensitivities ($\alpha_A=\alpha_B=0.8$). True risks become $s/0.8$ for both; target-robustness holds. The violation dissolves. Second, equalize true base rates ($\beta_A=\beta_B=0.5$). Recorded rates become $\gamma_A=0.4, \gamma_B=0.3$. The risk formula $s/\alpha_g$ remains unchanged; target-robustness still fails. The driver is recording sensitivity, not base rates.

  **Consistency Checks.** All probabilities lie in $[0,1]$. Max score $0.8$ with $\alpha=0.6$ implies max risk $0.8/0.6 > 1$, but Group B's max score is $0.533$, implying risk $0.89 < 1$. Aggregation: $E[\text{Risk}_A] = E[S]/\alpha_A = 0.4/0.8 = 0.5 = \beta_A$. $E[\text{Risk}_B] = 0.267/0.6 = 0.445 = \beta_B$. The numbers cohere.

  **The Objection.** The strongest case against target-robustness is verifiability: an auditor cannot compute $s/\alpha_g$ without knowing $\alpha_g$, which requires data the institution does not hold. Demanding it hands the institution an excuse to dismiss audits as "speculative." However, ignoring it validates a system that systematically underestimates risk for under-policed groups. An auditor seeing only $R$ should test for stability across sub-populations where recording mechanisms might differ (e.g., precincts), treating variance in calibration as a proxy for latent sensitivity gaps.

  **Conclusion.** This case establishes that fairness on recorded outcomes guarantees unfairness on true outcomes whenever recording sensitivity differs across groups. It does not establish that true outcomes are always recoverable, only that optimizing for the record actively distorts the truth.
