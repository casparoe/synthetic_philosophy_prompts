          *   *Philosophical Position:* This sounds like a version of *Constitutionalism without Identity* or perhaps a deflationary *Monism* (specifically, an attempt to dodge the puzzle by linguistic analysis). It leans towards the idea that differences are merely conceptual/linguistic, not ontological.

