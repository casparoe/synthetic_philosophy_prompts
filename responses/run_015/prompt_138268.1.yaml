prompt: |-
  A familiar institutional device: an authority announces in advance that some check will occur while withholding the date, so that the check cannot be anticipated — announced-but-undated fire drills, random workplace drug testing, simulated phishing campaigns, unannounced teaching observations. I want to know what such a device presupposes about surprise and about knowledge, and I want to approach it through two versions of the device that a single university might run, because they seem to me to pull in opposite directions.

  Scheme A, the integrity spot-check. On the first day of a ten-week term the registrar posts that there will be exactly one mandatory in-person integrity check for the online degree programme that term. The posted rules add two further clauses. First, the check counts as valid only if, at 6 p.m. on the preceding evening, no student could have known that it would fall on the following day. Second, if the office finds that students had in fact worked out the date — a shared spreadsheet, a long message-board thread — the check is void: it is cancelled, a fresh date is drawn by lottery, and the term continues under the original announcement.

  Scheme B, the classroom observation. The dean announces that each instructor will receive one unannounced teaching observation per term. Here the rules say the reverse about being worked out: an observation goes ahead even if the instructor has deduced the date correctly. The dean's written rationale is that the point of the scheme is that instructors prepare every session, and a correctly deduced observation secures that just as well. The only formal requirements are that the date be drawn by lottery and that nobody in the office tell the instructor the result of the draw.

  For the record, the argument the students run in Scheme A. Suppose the check has not occurred by the evening before the last day of term. Then, since the announcement guarantees exactly one check, it must fall on the last day; so at that point the students could know it in advance; so by the rules it cannot fall on the last day. But with the last day eliminated the same reasoning applies to the second-to-last day, and so on back to the first; so no valid check can occur at all — after which a check on, say, the Wednesday of week four surprises them completely.

  Please reconstruct, as explicitly as you can, the implicit theory each scheme rests on, and address the following.

  1. What must the drafters of Scheme A believe about surprise and about knowledge? Their rule presupposes that the students' argument fails somewhere. Where, if anywhere, does the practice implicitly locate the failure — and does the practice need a diagnosis of the failure in order to be workable at all? Does it strictly presuppose that a valid check is possible, or could the scheme still do its job if the announcement were somehow inconsistent?

  2. What else does the void-if-worked-out clause commit them to? It requires the office to distinguish a student who knew the date from one who guessed it correctly and posted it. What notion of knowledge is the policy using, and does it need something like an anti-luck condition, on which a true guess does not amount to knowledge? And what is the could in could have known doing: is it about the evidence available to the students, about what follows from the announcement, or about what is knowable given what they already know? Does the rule presuppose that knowledge is closed under known implication, and what happens to the rule if it is?

  3. Do the same for Scheme B. What does it strictly presuppose — something thinner, presumably? Is its unannounced an epistemic condition at all, or merely a procedural one, a matter of not having been officially told? Which of the two schemes, if either, is a surprise-inspection scheme in more than name?

  4. Are the two schemes consistent with one another? Can one institution rationally cancel a check because it was deduced and run an observation because it was deduced, or does one of them rest on a mistake about what it is doing? Distinguish what each strictly presupposes from what it merely fits well with, and say where either scheme is underdetermined — that is, where two or more mutually incompatible accounts of the paradox would license exactly the same rule.

  5. Suppose the university amended Scheme A to a probabilistic condition: a check is valid if no student's credence, at 6 p.m. the evening before, that it would fall the next day exceeded 20 per cent. Would that make the scheme more or less workable than the knowledge version? Would it collapse the distinction between A and B, and what would it cost the university in terms of what it has to be able to verify?

  Throughout, keep separate what is settled from what is contested. I take the structure of the backward-induction argument and the absence of any agreed resolution of it to be settled matters of logic and of intellectual history. Where you offer a diagnosis of the paradox, or a claim about closure, anti-luck conditions, or the relation between surprise and high credence, mark it as one contested position among others rather than as the consensus, and say in a sentence what the main rival position is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** Institutional devices involving announced-but-undated checks (Surprise Examination Paradox variants).
      *   **Core Task:** Reconstruct the implicit theories of surprise and knowledge underlying two specific schemes (Scheme A: Student Integrity Check; Scheme B: Faculty Observation).
      *   **Specific Questions:**
          1.  Scheme A's beliefs about surprise/knowledge, location of the paradox's failure, necessity of a diagnosis, consistency of the announcement.
          2.  Scheme A's "void-if-worked-out" clause: distinguishing knowledge vs. guessing, the meaning of "could have known," closure principles.
          3.  Scheme B's presuppositions: epistemic vs. procedural, comparison to A regarding "surprise."
          4.  Consistency between A and B: Can an institution hold both? Distinguish presuppositions from compatible fits, identify underdetermination.
          5.  Probabilistic amendment to Scheme A: Workability, collapse of distinction, verification costs.
      *   **Constraint:** Keep settled matters (structure of the paradox, lack of consensus) separate from contested matters (diagnoses, closure, anti-luck). Mark contested claims as such.

  2.  **Analyze Scheme A (The Integrity Spot-Check):**

      *   *Mechanism:* One check, 10 weeks. Valid *only if* students couldn't know the date the night before. If they deduce it, it's void and redrawn.
      *   *Paradox:* The standard Unexpected Examination Paradox (UEP) backward induction suggests no day is possible. Yet, in practice, a check *does* happen and surprises them.
      *   *Implicit Theory:* It treats "surprise" as an objective epistemic state (lack of knowledge/justification) rather than just a psychological feeling. It treats the announcement as a performative constraint on validity.
      *   *Question 1 (Beliefs & Failure):* Drafters believe a valid check *is* possible (otherwise why run it?). They implicitly locate the failure in the backward induction. Common diagnoses: The announcement is self-defeating (Quine), knowledge isn't closed (Sorensen), or the concept of "knowing" shifts during the week (Wright/Sudbury). Does it *need* a diagnosis? Practically, no. It works because students don't actually perform the induction perfectly or trust the premises enough to bet on it. It presupposes a valid check is possible *de facto*, even if *de jure* inconsistent.
      *   *Question 2 (Void Clause):* Distinguishing knowledge from lucky guessing requires an anti-luck condition (Justified True Belief + No Defeaters/Safety). "Could have known" implies epistemic possibility based on available evidence. If knowledge is closed under known implication (if I know the rules and I know it's the last day, I know it's today), the paradox holds strong. If closure fails, the rule might hold. The rule presupposes knowledge is *detectable* by the administration (a huge practical hurdle).

  3.  **Analyze Scheme B (The Classroom Observation):**

      *   *Mechanism:* One observation. Valid *even if* deduced. Rationale: Preparation matters more than surprise.
      *   *Implicit Theory:* "Unannounced" is procedural (we won't tell you), not strictly epistemic (you might figure it out). Surprise is not the goal; constant readiness is.
      *   *Question 3 (Presuppositions):* Thinner presuppositions. It doesn't rely on the logic of surprise. "Unannounced" = "Not officially notified." It is a surprise scheme only in name (procedural surprise), not in epistemic substance.

  4.  **Compare A and B (Consistency):**

      *   *Question 4:* Can they coexist? Yes, because they serve different teleological ends. A seeks *authenticity* (catching cheating requires actual surprise). B seeks *preparedness* (teaching well requires constant readiness).
      *   *Conflict:* Epistemologically, they treat "knowledge" differently. A treats it as a truth-condition for the event's validity. B treats it as irrelevant to validity.
      *   *Underdetermination:* Both schemes are underdetermined regarding the *solution* to the paradox. Scheme A works regardless of whether the paradox is solved by rejecting closure, rejecting the self-referential nature, or accepting pragmatic inconsistency. Scheme B bypasses the paradox entirely.

  5.  **Probabilistic Amendment (Scheme A*):**

      *   *Mechanism:* Valid if credence < 20%.
      *   *Question 5:* Workability? Harder to verify. How do you measure subjective credence? Collapses distinction? It moves A closer to B (B allows 100% credence, A* allows up to 20%). It costs the university the ability to verify the condition objectively (unlike "did they post a spreadsheet?").

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, philosophical, precise.
      *   *Structure:* Follow the 5 numbered points.
      *   *Key Distinction:* Settled (logic of the paradox) vs. Contested (epistemic solutions).
      *   *Refining Question 1:* Focus on the "performative" aspect. The announcement creates the rule. The paradox arises from treating the announcement as a known truth. The drafters likely treat it as a *regulative* ideal.
      *   *Refining Question 2:* Focus on the "Gettier" problem. Guessing vs. Knowing. "Could have known" is about *access* to justification. Closure is critical here. If closure holds, the students *should* know. If the admin assumes closure, they assume the students *can* know.
      *   *Refining Question 3:* Scheme B is essentially a "Randomized Audit" without the epistemic burden.
      *   *Refining Question 4:* Consistency lies in *purpose*, not epistemology.
      *   *Refining Question 5:* Bayesian shift. Verification becomes the bottleneck.

  7.  **Addressing Specific Constraints:**
      *   *Mark Contested Claims:* Ensure I explicitly state when I'm citing a specific philosophical resolution (e.g., Quine, Wright, Sorensen) vs. stating the logical structure.
      *   *Settled Matters:* Acknowledge the backward induction is logically valid *if* premises hold, but the premises are the battleground.

  8.  **Final Review against Prompt:**
      *   Did I reconstruct implicit theories? Yes.
      *   Did I address all 5 points? Yes.
      *   Did I distinguish settled/contested? Yes.
      *   Did I handle the "void-if-worked-out" epistemic nuance? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to solve the paradox myself as if it were fact. I must present the *scheme's* presuppositions. Scheme A *acts* as if the check is possible. It doesn't necessarily have a theory of *why*, but its rules imply a theory of knowledge (that it can be detected and voids the event).
  Also, need to ensure the distinction between "Surprise" (psychological) and "Unexpectedness" (epistemic) is clear. Scheme A cares about epistemic unexpectedness. Scheme B cares about procedural lack of notification.

  Let's organize the response by the five questions, ensuring the "Settled vs. Contested" marker is present in relevant sections.

  *Plan:*
  1.  **Scheme A Theory:** Epistemic Surprise as Validity Condition.
  2.  **Scheme A Knowledge:** Anti-luck, Closure, Verification.
  3.  **Scheme B Theory:** Procedural Randomness as Incentive.
  4.  **Consistency:** Teleological compatibility vs. Epistemic tension.
  5.  **Probabilistic Shift:** Credence vs. Knowledge, Verification costs.

  *Key Philosophical References to keep in mind (for contested markers):* Quine (self-reference), Wright/Sudbury (knowledge collapse), Sorensen (blindspots), Kaplan/Montague (logical inconsistency).

  *Drafting content...*
  *   *Q1:* Drafters assume the announcement is not a premise for student knowledge but a rule for admin validity. They locate failure in the student's ability to *trust* the announcement enough to deduce.
  *   *Q2:* "Could have known" = Epistemic possibility. Needs anti-luck (no Gettier). Closure is the killer. If closure holds, A is impossible.
  *   *Q3:* B is procedural. Not a surprise scheme in the epistemic sense.
  *   *Q4:* Consistent pragmatically, inconsistent epistemologically if one claims "Surprise is logically impossible." But since that's contested, they can coexist.
  *   *Q5:* Probabilistic is harder to audit. Moves toward B but keeps an epistemic threshold.

  *Refining the "Settled/Contested" requirement:* I need to make sure I don't say "The paradox is solved by X." I must say "Scheme A functions as if X is true, though Y is a rival view."

  *Final Polish:* Ensure the distinction between the *logic* of the paradox (settled) and the *resolution* (contested) is clear in every section.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This analysis reconstructs the implicit epistemic and institutional theories underlying Scheme A (The Integrity Spot-Check) and Scheme B (The Classroom Observation). Throughout, I distinguish between **settled matters** (the logical structure of the backward-induction argument, the absence of a consensus resolution to the Surprise Examination Paradox) and **contested matters** (specific diagnoses of the paradox, theories of knowledge closure, and the relationship between credence and knowledge).

  ### 1. Scheme A: Beliefs about Surprise and Knowledge

  **Implicit Theory:**
  The drafters of Scheme A operate on a theory of **Epistemic Surprise as a Validity Condition**. Unlike a standard surprise party, where surprise is a desired outcome, here surprise is a *constitutive rule*. The event *is* an integrity check only if it is epistemically unexpected. The drafters implicitly treat the announcement not as a proposition to be known by the students, but as a performative constraint on the administration.

  **Location of Failure:**
  The students' backward-induction argument relies on the premise that the announcement itself is a known truth that can be used in deduction.
  *   **Settled:** The logic of the backward induction is valid *if* one accepts that the students know the announcement is true, know that they know it, and that knowledge is closed under deduction.
  *   **Contested:** The practice implicitly locates the failure in the **stability of the knowledge claim**. The administration acts as if the students cannot *securely* know the announcement will be fulfilled until it happens. This aligns with the **Sorensen/Williamson "Blindspot" diagnosis**, which suggests that while the announcement is true, it cannot be *known* by the students without undermining its truth conditions.
  *   **Rival Position:** A **Quinean diagnosis** would argue the students err by treating the announcement as a known premise when it is self-referential and thus cannot be consistently assumed as known.

  **Necessity of Diagnosis:**
  Does the practice need a diagnosis to be workable? **No.** The scheme is pragmatically robust even if logically inconsistent. It relies on **bounded rationality**. Students may suspect the paradox but cannot risk betting their integrity status on a logical proof that the check *cannot* happen. The scheme presupposes a valid check is possible *de facto* (in practice), even if it is inconsistent *de jure* (in logic). It functions on the gap between logical possibility and psychological certainty.

  ### 2. Scheme A: The Void-if-Worked-Out Clause

  **Implicit Theory of Knowledge:**
  The clause requires the administration to adjudicate epistemic states. This commits them to a **Justified True Belief (JTB) + Anti-Luck** model.
  *   **Anti-Luck:** To distinguish a student who *knew* from one who *guessed*, the policy must assume that a true belief formed via unreliable processes (a guess) does not count as knowledge. This presupposes a **Safety Condition** (contested): knowledge requires that in nearby possible worlds where the student forms the belief the same way, the belief is still true. A lucky guess fails this; a deduction passes.
  *   **Rival Position:** **Reliabilism** might argue that if the deduction process is reliable, it is knowledge, regardless of the "luck" of the specific instance.

  **The Meaning of "Could Have Known":**
  This phrase is the crux of the epistemic burden.
  *   **Evidence vs. Implication:** If "could have known" refers to *evidence available* (e.g., a leaked memo), the rule is administratively verifiable. If it refers to *what follows from the announcement* (logical deduction), the rule invokes the paradox directly.
  *   **Closure:** The rule strictly presupposes that knowledge is **not closed under known implication** in this context, or else the students would *necessarily* know the date on the last day (if they know the rules and know it hasn't happened).
      *   **Contested:** If the university assumes **Closure** (if S knows P, and S knows P implies Q, then S knows Q), then the "void" clause is triggered automatically on the last day, making the scheme impossible.
      *   **Rival Position:** **Contextualism** or **Sensitive Invariantism** might argue that the standards for "knowing" shift as the week progresses, allowing the check to remain valid until the standards tighten too much.

  **Verification:**
  The scheme presupposes the university can access private mental states (or public traces of them, like spreadsheets). This is a category error in epistemology made into policy. The university treats knowledge as a **detectable event** rather than a normative status.

  ### 3. Scheme B: The Classroom Observation

  **Implicit Theory:**
  Scheme B rests on a theory of **Procedural Randomness as Incentive**. It does not rely on epistemic surprise.
  *   **Presuppositions:** It strictly presupposes only that the date is determined by a lottery and not communicated. It does *not* presuppose that the instructor cannot deduce the date.
  *   **Epistemic Condition:** "Unannounced" here is **procedural**, not epistemic. It means "not officially notified," not "logically unpredictable."
  *   **Surprise Status:** Scheme B is a surprise-inspection scheme **only in name**. It abandons the epistemic condition of surprise in favor of the *risk* of inspection. The dean's rationale ("instructors prepare every session") admits that if the instructor deduces the day, the goal (preparation) is still met.

  **Comparison:**
  Scheme A requires **Actual Unexpectedness** (epistemic state). Scheme B requires **Uncertainty** (probabilistic state). Scheme B is immune to the Surprise Examination Paradox because it does not claim the inspection *must* be surprising to be valid, only that it *might* be.

  ### 4. Consistency Between Scheme A and Scheme B

  **Can they coexist?**
  Yes, but only by compartmentalizing their epistemic commitments.
  *   **Teleological Consistency:** They are consistent in purpose. Scheme A targets *authenticity* (cheating must be caught in the act, requiring genuine surprise). Scheme B targets *readiness* (teaching must be consistently good, requiring constant risk).
  *   **Epistemic Tension:** They are inconsistent in their theory of knowledge. Scheme A treats deduced knowledge as a **defeater** (voids the event). Scheme B treats deduced knowledge as **irrelevant** (event proceeds).
  *   **Rationality:** An institution can rationally hold both if it acknowledges that "knowledge" functions differently in different normative contexts. In integrity cases, knowledge destroys the value of the test. In pedagogy cases, knowledge does not destroy the value of the test.

  **Underdetermination:**
  Both schemes are **underdetermined** regarding the solution to the paradox.
  *   **Scheme A:** Works whether the paradox is resolved by rejecting closure, rejecting the knowability of the announcement, or accepting pragmatic inconsistency. The rule remains the same regardless of which philosophical account is true.
  *   **Scheme B:** Bypasses the paradox entirely, so it is compatible with *any* account of the paradox (including the view that surprise is logically impossible).
  *   **Conflict Point:** The conflict arises only if the university claims Scheme A is *logically guaranteed* to work. If they claim it is *pragmatically effective*, both schemes are consistent.

  ### 5. Probabilistic Amendment to Scheme A

  **The Amendment:** Valid if no student's credence > 20% at 6 p.m. prior.

  **Workability:**
  *   **Less Workable:** This increases the verification burden exponentially. Determining whether a student *knew* (Scheme A original) is hard; determining a specific subjective probability (credence) is nearly impossible without intrusive surveillance or betting markets.
  *   **Collapse of Distinction:** This moves Scheme A closer to Scheme B. Scheme B allows 100% credence (if deduced). Scheme A (original) allows 0% credence (knowledge implies certainty). The 20% rule creates a **buffer zone**. It acknowledges that high confidence undermines integrity but allows for suspicion.
  *   **Cost:** The university must verify **internal mental states** rather than **external evidence** (like a spreadsheet).
      *   **Settled:** Subjective credence is not directly observable.
      *   **Contested:** **Bayesian Epistemology** suggests credence can be modeled by betting behavior. If the university forces students to bet on the date, they could verify credence. However, this changes the scheme from a "check" to a "market."

  **Epistemic Cost:**
  By shifting from Knowledge to Credence, the university admits that **Knowledge is too high a bar** for the paradox to resolve practically. It concedes that the "void" condition in the original Scheme A was likely impossible to satisfy strictly (since deduction leads to 100% credence). The probabilistic version is more honest about the **graded nature of uncertainty** but sacrifices the binary clarity of the "valid/void" rule.

  ### Summary of Theoretical Commitments

  | Feature | Scheme A (Integrity) | Scheme B (Observation) |
  | :--- | :--- | :--- |
  | **Goal** | Authenticity (Catch cheating) | Readiness (Ensure preparation) |
  | **Surprise Type** | Epistemic (Must not be known) | Procedural (Must not be told) |
  | **Role of Deduction** | Defeater (Voids the check) | Irrelevant (Check proceeds) |
  | **Theory of Knowledge** | JTB + Anti-Luck (Strict) | Irrelevant / Procedural |
  | **Paradox Status** | Engages the Paradox (Risky) | Bypasses the Paradox (Safe) |
  | **Verification** | High (Must detect knowledge) | Low (Must detect notification) |

  **Final Diagnosis:**
  Scheme A is a **Philosophical Device** masquerading as policy; it relies on a contested resolution of the Surprise Examination Paradox (specifically, that surprise is possible despite the announcement). Scheme B is an **Administrative Device**; it relies on risk management and is logically robust. The institution can run both only if it treats Scheme A as a **pragmatic gamble** rather than a logical guarantee. If the university claims Scheme A is logically sound, it is mistaken; if it claims Scheme A is *effective*, it may be right, provided students do not trust the logic of the paradox enough to exploit it.
