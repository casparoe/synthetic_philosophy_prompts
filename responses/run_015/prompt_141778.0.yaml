  2.  **Deconstruct the Four Domains:**

      *   **1. Regulatory Safety (NHTSA, EPA, etc.):**
          *   *Mechanism:* Value of a Statistical Life (VSL). Cost-benefit analysis.
          *   *Assumption:* Aggregation *is* valid. $10 \times 10\%$ risk = $1 \times 100\%$ risk roughly. Small risks to many people sum to expected deaths.
          *   *Justification:* Utilitarian/Consequentialist. Maximizing overall welfare/safety within budget constraints.
      *   **2. Tort Law (Nuisance/Negligence):**
          *   *Mechanism:* Standing, de minimis non curat lex (law doesn't care about trifles).
          *   *Assumption:* Aggregation is *practically* difficult or legally restricted. Individual standing is key.
          *   *Justification:* Corrective Justice (righting a wrong between two parties) + Administrative Efficiency.
      *   **3. Human Rights/Torture Ban:**
          *   *Mechanism:* Deontological constraints (Rights).
          *   *Assumption:* Some acts are intrinsically wrong regardless of consequences.
          *   *Justification:* Rights-based ethics. Protecting the individual from the "tyranny of the majority."
      *   **4. Statutory Damages (Copyright):**
          *   *Mechanism:* Fixed penalty per infringement regardless of actual damage.
          *   *Assumption:* Deterrence is more important than compensation. Harm is hard to prove, so we presume it.
          *   *Justification:* Law and Economics (deterrence theory).

  3.  **Evaluate the User's Theories:**

      *   **Theory A: The One-Life Rule (Aggregation within a life, not across).**
          *   *Analysis:* This aligns with *Contractualism* (T.M. Scanlon) or certain views of *Prioritarianism*. It explains the Torture Ban (don't sacrifice one) and the Nuisance Law (one guy with sap has a claim, many with one drop don't).
          *   *Conflict:* It clashes with Regulatory Safety (VSL aggregates across lives). So it doesn't explain *all* three, but it explains the moral intuition behind the Torture/Dust Specks debate well.
      *   **Theory B: The Who's-In-The-Room Rule (Context/Institutional Competence).**
          *   *Analysis:* This is a *Procedural* or *Institutional* explanation. Courts see parties; Agencies see populations; Constitutional bans bind everyone.
          *   *Validity:* This is actually a very strong legal realist explanation. Different institutions have different mandates. Courts = bilateral disputes. Agencies = public welfare. Rights = trumps against both.
          *   *Verdict:* This explains the *inconsistency* not as a moral failure but as a division of labor.

  4.  **Address the "Do they fit in one head?" Question:**

      *   *Philosophical Consistency:* No, they rely on conflicting ethical frameworks (Utilitarianism vs. Deontology vs. Corrective Justice).
      *   *Practical Consistency:* Yes, because they serve different functions. A hybrid system is necessary to prevent both tyranny (utilitarianism alone) and paralysis (deontology alone).
      *   *Term:* "Reflective Equilibrium" or "Pluralism."

