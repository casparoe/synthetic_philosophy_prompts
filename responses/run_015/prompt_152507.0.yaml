answer: |-
  ### Strategic Allocation of Resources

  Given the constraints (no wet-lab access, 3-year horizon, avoidance of cosmological overreach) and the goal (restructuring downstream practice in psychiatry and robotics), the program must prioritize **mathematical coherence** over **ontological debate**. Ontological debates consume time without yielding formal tools; mathematical coherence yields the tools necessary to build the applications.

  Therefore, the bulk of resources should be commanded by the following two lines of inquiry, in this specific dependency order:

  1.  **Primary Inquiry (Year 1): Candidate (iii) — The Independence of the Free-Energy Formulation.**
  2.  **Secondary Inquiry (Years 2–3): Candidate (ii) — The Nosological Structure of Allostatic Failure.**

  Candidate (i) (Representationalism vs. Sensorimotor Coupling) should be explicitly **deprioritized**. While philosophically rich, it is a resource sink for a team with this specific composition and timeline. It is less tractable without neural data (to distinguish coding from coupling) and less likely to change engineering or clinical practice, where functional isomorphism often suffices regardless of ontological commitment.

  ---

  ### Defense of the Priority Order

  #### 1. Primary Inquiry: The Independence of the Free-Energy Formulation (Candidate iii)
  *Question:* Does the free-energy formulation provide a genuinely independent constraint on model selection, or is it a redescription of dynamics already captured by standard Bayesian inference?

  *   **Upstream Status:** **Critical.** This is the foundational validity check. If the Free Energy Principle (FEP) is mathematically equivalent to standard Bayesian inference merely dressed in variational calculus, its status as a "principle" collapses into a "framework." If it is a redescription, then building psychiatric nosology on it (Candidate ii) risks building a taxonomy on a tautology. You cannot derive unique predictions about allostatic failure from a mathematical formalism that adds no constraints beyond standard probability theory. Resolving this determines whether the program is developing a *new physics of life* or a *new notation for statistics*.
  *   **Tractability (No Wet-Lab):** **High.** This is a problem for theoretical modelers and philosophers of mathematics. It requires analyzing the topology of the solution space under FEP versus standard Bayesian updating. It involves proving whether the variational bound imposes constraints on *admissible* trajectories that standard inference does not. This fits the team's formal strengths perfectly.
  *   **Impact on Practice:** **High.** If FEP offers an independent constraint (e.g., regarding the complexity-accuracy trade-off in bounded agents), it provides a model-selection criterion that current Bayesian cognitive science lacks. This would change how modelers select between competing architectures in robotics and psychiatry. If it is a redescription, the program must pivot to marketing FEP solely as a unifying language, which significantly lowers its explanatory value.

  #### 2. Secondary Inquiry: The Nosological Structure of Allostatic Failure (Candidate ii)
  *Question:* Does interoceptive inference fragment psychiatric classification or unify it under a single variational-bound account of allostatic failure?

  *   **Upstream Status:** **Dependent.** This inquiry is only viable if Candidate (iii) establishes that the FEP formalism offers distinct leverage. Assuming (iii) yields a positive result (FEP provides unique constraints), this line of inquiry applies those constraints to clinical phenotypes.
  *   **Tractability (No Wet-Lab):** **Moderate to High.** Without wet-lab access, the team cannot validate models against new patient data. However, they can perform **formal nosology**. This involves mapping the *space of possible model failures* (e.g., hyper-precise priors vs. hypo-precise likelihoods vs. rigid policy selection) to the *space of reported symptoms*. By simulating agents with specific variational pathologies, the team can generate "synthetic phenotypes" and compare them to existing clinical literature. This is a theoretical mapping exercise that does not require IRB approval or lab equipment.
  *   **Impact on Practice:** **Transformative.** Current psychiatric nosology (DSM/ICD) is symptom-based and atheoretical. A variational taxonomy would classify disorders by *computational mechanism* (e.g., "disorders of precision weighting" vs. "disorders of prior content"). This directly restructures downstream work by offering robotics and AI safety researchers a taxonomy of "agent failure modes" that parallels human psychopathology, and by offering clinicians a mechanistic target for intervention (e.g., "increase sensory precision" vs. "loosen priors").

  #### Why Candidate (i) is Deprioritized
  *Question:* Representational architecture vs. sensorimotor coupling.

  *   **Reasoning:** For a 3-year program aiming at *restructuring practice*, the representational debate is a distractor. Robotics engineers do not need to know if the internal state is a "representation" or a "control signal" to build a stable controller; they need to know the stability conditions (Candidate iii) and the failure modes (Candidate ii). Philosophers can debate the ontology indefinitely without wet-lab data to adjudicate between neural coding and dynamical coupling. Allocating resources here risks producing papers that are cited in philosophy journals but ignored by modelers and clinicians.

  ---

  ### The Meta-Question: Conceptual vs. Normative

  **Is the most upstream dispute conceptual (what minimization denotes) or normative (what distinguishes an explanatory model from a post-hoc variational gloss)?**

  The most upstream dispute is **normative**.

  **Defense:**
  The conceptual confusion regarding what "free energy minimization" denotes (e.g., is it a drive? a mathematical inevitability? a normative goal?) persists primarily because the field lacks agreed-upon **normative standards for explanation**.

  1.  **The Normative Bottleneck:** The "post-hoc variational gloss" objection arises because researchers can fit almost any behavior with a sufficiently complex generative model. The dispute is not about what the math *means* (conceptual), but about what counts as a *sufficient constraint* to prevent overfitting (normative). If the team settles Candidate (iii) by defining the specific constraints FEP imposes on model selection, they establish a normative standard.
  2.  **Dissolving the Conceptual:** Once the normative standards are fixed (i.e., "A model is explanatory only if it minimizes free energy under constraint X, which standard Bayesian inference does not"), the conceptual question ("What does minimization denote?") becomes secondary. It becomes a matter of interpretation rather than a barrier to progress. Engineers and clinicians can treat the minimization as a functional objective regardless of its ontological status.

  **Does settling one render the other dispensable?**

  **Yes, settling the Normative renders the Conceptual dispensable for the purpose of this research program.**

  If the program successfully defines the normative conditions under which FEP provides unique explanatory power (Candidate iii), the conceptual debate about whether the organism is "really" minimizing free energy or just "acting as if" becomes pragmatically irrelevant.
  *   **For Robotics:** The controller works if the normative constraints are met.
  *   **For Psychiatry:** The treatment targets the mechanism if the normative taxonomy holds.
  *   **For Philosophy:** The "realness" of the representation matters less than the utility of the model in predicting intervention outcomes.

  Therefore, the program should treat the conceptual dispute (Candidate i) as subordinate to the normative validation (Candidate iii). By focusing on **model selection criteria** (Normative) rather than **ontological status** (Conceptual), the team ensures that their output changes how models are built and evaluated, rather than merely changing how they are described.

  ### Summary of Execution Plan

  1.  **Year 1 (The Foundation):** Prove or disprove the mathematical independence of FEP from standard Bayesian inference in bounded agents. Publish formal proofs regarding model selection constraints.
  2.  **Year 2 (The Taxonomy):** Using the constraints from Year 1, simulate agents with specific variational failures. Map these to psychiatric categories. Publish a "Computational Taxonomy of Allostatic Failure."
  3.  **Year 3 (The Integration):** Synthesize findings into a framework for robotics (failure mode detection) and psychiatry (mechanism-based classification). Explicitly bypass the representational debate by focusing on functional equivalence.

  This path respects the constraints, leverages the team's formal strengths, and maximizes the probability of restructuring downstream practice within the three-year horizon.
