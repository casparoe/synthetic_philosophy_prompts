answer: |-
  *   **Node 1: System Storage Budget (Streaming Constraint)**
      *   *Question:* Can our key-value store hold a comparison count for every pair of projects ($N^2$), or only a total score per project ($N$)?
      *   *Formal:* (Aggregation Complexity / Informational Efficiency)
      *   *Micro-Profile:* Teams A, B, C. Projects X, Y, Z.
          *   If we store only scores ($N$): We know X=10pts, Y=8pts. We don't know if X beat Y directly or just accumulated points from Z.
          *   If we store pairs ($N^2$): We know X beat Y (2-1), Y beat Z (2-1), Z beat X (2-1).
      *   *Branch Yes ($N^2$ allowed):* Go to Node 2.
      *   *Branch No ($N$ only):* Go to Node 3. (Note: This choice secretly eliminates Condorcet methods).

  *   **Node 2: Audit Chain Length (Auditability Constraint)**
      *   *Question:* If we rank X above Y, must we prove it by a direct vote (X beat Y) or one intermediary (X beat Z, Z beat Y), or is a global score sum enough?
      *   *Formal:* (Local Justification / Transitivity Certificate)
      *   *Branch Direct/1-Hop Only:* Go to Node 4. (Forces Pairwise logic).
      *   *Branch Global Score OK:* Go to Node 4. (Allows Positional logic).

  *   **Node 3: Output Contract (Determinism Constraint)**
      *   *Question:* If the math produces a cycle (X>Y>Z>X) or a tie, can we return a set of winners or a probability distribution, or must it be one strict list?
      *   *Formal:* (Social Choice Function vs. Correspondence / Determinism)
      *   *Branch Set/Prob Allowed:* Go to Node 5. (Unblocks cycle resolution).
      *   *Branch Strict List Required:* Go to Node 5. (Forces tie-breaking rules).

  *   **Node 4: Input Intensity**
      *   *Question:* Can teams submit effort estimates (cardinal scores) instead of just rankings, knowing we can't compare "5 points" from Team A to "5 points" from Team B?
      *   *Formal:* (Ordinal vs. Cardinal Utility / Interpersonal Comparability)
      *   *Branch Scores Allowed:* Go to Node 6.
      *   *Branch Rankings Only:* Go to Node 6.

  *   **Node 5: Domain Restriction**
      *   *Question:* Can we legally require all teams to rank projects along a single axis (e.g., cost or risk), ensuring no team prefers extremes over the middle?
      *   *Formal:* (Single-Peaked Preferences / Domain Restriction)
      *   *Micro-Profile:* Teams A, B, C. Projects LowCost, MedCost, HighCost.
          *   *Single-Peaked:* Team A prefers Low>Med>High. Team B prefers Med>Low>High. Team C prefers High>Med>Low. (All have one peak).
          *   *Violation:* Team A prefers Low>High>Med. (Prefers extremes to middle).
          *   *Impact:* If Single-Peaked, Majority Rule never cycles. If Unrestricted, cycles are possible.
      *   *Branch Yes (Single-Peaked):* Go to Node 7.
      *   *Branch No (Unrestricted):* Go to Node 7.

  *   **Node 6: Power Distribution**
      *   *Question:* Is every team's ballot weighted equally, or does the Platform Team hold a veto or extra weight to break deadlocks?
      *   *Formal:* (Anonymity vs. Weighted Voting / Oligarchy)
      *   *Branch Equal Weight:* Go to Node 8.
      *   *Branch Weighted/Veto:* Go to Node 8.

  *   **Node 7: Independence of Irrelevant Alternatives (IIA)**
      *   *Question:* If we add a "compliance filler" project everyone ranks last, must the relative order of the real projects remain exactly unchanged?
      *   *Formal:* (Independence of Irrelevant Alternatives)
      *   *Micro-Profile:* Teams A, B, C. Projects X, Y, Filler.
          *   *Scenario:* Initially, A: X>Y, B: Y>X, C: X>Y. (X wins 2-1).
          *   *Incident:* Filler added. Team B changes to Y>Filler>X (strategic or structural). Now X vs Y vote shifts.
          *   *Strict IIA:* X must still beat Y regardless of Filler.
          *   *Relaxed:* Order can flip if Filler changes the vote geometry.
      *   *Branch Yes (Strict IIA):* Go to Node 9.
      *   *Branch No (Context Allowed):* Go to Node 9.

  *   **Node 8: Strategic Behavior (Gibbard-Satterthwaite)**
      *   *Question:* Should we engineer the rule so a team *cannot* lift their favorite by lying about a project they know will never be funded?
      *   *Formal:* (Strategy-Proofness / Gibbard-Satterthwaite Theorem)
      *   *Note:* The theorem states: Any deterministic rule with >2 outcomes that is Non-Dictatorial and Unrestricted Domain is manipulable.
      *   *Micro-Profile:* Teams A, B, C. Projects X (A's fav), Y (B's fav), Z (Doomed).
          *   *Truth:* A: X>Y>Z. B: Y>X>Z. C: Y>X>Z. (Y wins).
          *   *Lie:* A reports X>Z>Y. If the rule counts "last place" penalties, Y might drop below X.
          *   *Constraint:* Preventing this requires restricting domain or accepting dictatorship.
      *   *Branch Yes (Prevent Manipulation):* Go to Node 10.
      *   *Branch No (Tolerate Risk):* Go to Node 10.

  *   **Node 9: Case Incident — Compliance Filler**
      *   *Question:* A compliance-mandated filler project is added. It is ranked last by everyone. The relative order of X and Y flips. Is this a bug we fix, or acceptable sensitivity?
      *   *Formal:* (IIA Violation / Agenda Sensitivity)
      *   *Branch Bug (Must Fix):* Go to Node 11.
      *   *Branch Acceptable:* Go to Node 11.

  *   **Node 10: Case Incident — Doomed Project Manipulation**
      *   *Question:* Team A knows Z will never be funded. They rank Z above Y to lower Y's score, lifting X. Do we reject this ballot or accept the outcome?
      *   *Formal:* (Participation / Monotonicity Failure)
      *   *Branch Reject/Correct:* Go to Node 12.
      *   *Branch Accept:* Go to Node 12.

  *   **Node 11: Case Incident — Near-Duplicate Splitting**
      *   *Question:* Project "Auth" is split into "Auth-V1" and "Auth-V2". Votes for Auth split between them, causing "Search" to win instead. Is this vote-splitting a failure?
      *   *Formal:* (Clone Independence / IIA)
      *   *Branch Failure (Need Clone Independence):* Go to Leaf L1.
      *   *Branch Accept:* Go to Leaf L2.

  *   **Node 12: Tie-Breaking Mechanism**
      *   *Question:* When scores or votes are exactly equal, do we flip a coin or use a deterministic key (e.g., Project ID)?
      *   *Formal:* (Tie-Breaking / Randomization)
      *   *Branch Random:* Go to Leaf L3.
      *   *Branch Deterministic:* Go to Leaf L4.

  *(Note: Paths converge to leaves based on prior choices to ensure 8-12 leaves total. Below is the logical mapping of the endpoints.)*

  *   **Leaf L1:** (From Node 11: Failure) -> **Unnamed:** Clone-Independent Scoring Rule (e.g., Ranked Pairs with pruning).
  *   **Leaf L2:** (From Node 11: Accept) -> **Borda Count:** Simple positional scoring.
  *   **Leaf L3:** (From Node 12: Random) -> **Randomized Dictator:** Pick one team's ballot at random. (Blocked by Contract).
  *   **Leaf L4:** (From Node 12: Deterministic) -> **Weighted Borda:** Platform team breaks ties.
  *   **Leaf L5:** (From Node 5: Single-Peaked + Node 6: Equal) -> **Median Voter Rule:** Select project closest to median on cost axis.
  *   **Leaf L6:** (From Node 5: Unrestricted + Node 7: Strict IIA + Node 6: Equal) -> **Incoherent:** Violates Arrow's Theorem. (Uninhabited).
  *   **Leaf L7:** (From Node 8: Prevent + Node 6: Equal) -> **Incoherent:** Violates Gibbard-Satterthwaite. (Uninhabited).
  *   **Leaf L8:** (From Node 1: $N$ Storage + Node 2: Direct Audit) -> **Incoherent:** Storage constraint prevents pairwise audit. (Uninhabited).
  *   **Leaf L9:** (From Node 4: Cardinal + Node 6: Equal) -> **Utilitarian Sum:** Sum of effort scores. (Unnamed).
  *   **Leaf L10:** (From Node 3: Set Allowed + Node 1: $N^2$ Storage) -> **Condorcet Set:** Return all projects in the top cycle. (Blocked by Contract).
  *   **Leaf L11:** (From Node 6: Weighted + Node 7: Relaxed) -> **Platform Veto:** Platform team order prevails unless unanimous opposition.
  *   **Leaf L12:** (From Node 9: Bug + Node 1: $N^2$ Storage) -> **Ranked Pairs:** Lock in majorities, skip cycles.

  ### Mapping Table & Diagnostics

  | Leaf | Named Family / Description | Diagnostic |
  | :--- | :--- | :--- |
  | **L1** | **Unnamed:** Clone-Independent Scoring | **Indistinguishable:** Functionally similar to L12 (Ranked Pairs) in most quarterly data. |
  | **L2** | **Borda Count** | **Viable:** Satisfies Streaming ($N$ storage). Fails IIA (Node 9). Fails Audit (Node 2) unless relaxed. |
  | **L3** | **Randomized Dictator** | **Blocked:** Contract requires deterministic ranking. *Change:* Allow `seed` parameter in API. |
  | **L4** | **Weighted Borda** | **Viable:** Common industry standard. Violates IIA. Tolerates Strategy (Node 10). |
  | **L5** | **Median Voter** | **Viable:** Only if Node 5 (Single-Peaked) is enforced. Hard to enforce on 40 diverse projects. |
  | **L6** | **Arrow's Impossible Zone** | **Uninhabited:** Incoherent. You chose Strict IIA + Equal Weight + Unrestricted Domain + Transitive. |
  | **L7** | **Gibbard-Satterthwaite Zone** | **Uninhabited:** Incoherent. You chose Strategy-Proof + Non-Dictator + >2 Outcomes. |
  | **L8** | **Audit/Storage Conflict** | **Uninhabited:** Incoherent. You chose $O(N)$ storage but demanded $O(N^2)$ pairwise audit trails. |
  | **L9** | **Utilitarian Sum** | **Viable:** Requires Node 4 (Cardinal). Risks "Interpersonal Comparability" lies (teams inflate scores). |
  | **L10** | **Condorcet Set** | **Blocked:** Contract requires strict ranking. *Change:* Allow `top_k` set output. |
  | **L11** | **Platform Veto** | **Viable:** Weakens "No Dictator". Solves cycles by fiat. Politically sensitive. |
  | **L12** | **Ranked Pairs (Tideman)** | **Viable:** Satisfies Audit (Node 2). Requires $N^2$ storage (Node 1). Violates IIA (Node 9). |

  ### Residual Choices

  This tree resolves the technical feasibility of the aggregation rules against your system constraints, but it does not settle the political contract of the platform. Specifically, the choice between **L4 (Weighted Borda)** and **L11 (Platform Veto)** is not a technical trade-off but a governance decision: does the platform team view itself as an equal peer (L4) or as a fiduciary steward with override authority (L11)? Similarly, the decision to enforce **Node 5 (Single-Peaked)** is a product management constraint, not an engineering one; it requires you to dictate *how* teams think about projects (e.g., "rank by cost") rather than just collecting their preferences. Finally, the **Audit Constraint (Node 2)** is the most fragile; if your auditors demand a "majority chain" justification, you are forced into **L12 (Ranked Pairs)** and must fight for the $O(N^2)$ storage budget, as simpler scoring rules (L2, L4) cannot generate that specific chain of custody without lying about the math.
