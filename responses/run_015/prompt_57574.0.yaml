      *   *Agreement:* The Rulebook is a Skinnerian mechanism. The Operator is a Gregorian creature restricted to Skinnerian operations. The Judges are Gregorian.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Academic, precise, slightly tense but cooperative.
