      *(Self-Correction during drafting)*: Make sure the "Agreed Claims" aren't too weak. Instead of "We built a room," say "The rulebook contains zero semantic anchors." Instead of "Judges might be biased," say "Judge scores in the Control Condition constitute a baseline for anthropomorphic projection, not competence."

