              *   *Camp A Prediction:* Control group judges will rate Chatbot lower than Room (because Room has "real" syntax manipulation). *Concession:* If judges prefer Chatbot, the Room's syntax manipulation is behaviorally indistinguishable from stochastic parroting, weakening the "program" claim.
