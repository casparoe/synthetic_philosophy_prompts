              *   Camp B: Confabulation/Demand Characteristics (operator trying to make sense of the grind).
              *   *Crux?* No, it's interpretive. Both agree the *data* is the diary entry, but the *explanation* is theory-laden.
          *   *Honesty Check:* Are they pretending? Maybe on the "speed" issue. Camp A cares about speed more than they admit (hence the Abridged condition failure).

  4.  **Refining the Creature Vocabulary:**
      *   *Darwinian:* Natural selection, hardwired. (The Operator's brain biology).
      *   *Skinnerian:* Trial and error reinforcement. (The Rulebook lookup process).
      *   *Popperian:* Internal hypothesis testing. (What Camp A claims the System does; Camp B claims it doesn't).
