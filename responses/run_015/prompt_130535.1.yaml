answer: |-
  ### Candidate Mechanics

  1.  **The "Consent Signature" Mechanic:** Students must physically sign a card to authorize a transfer of harm chips from them to another; unsigned transfers fail.
      *   *Verdict:* **Discard.** This shifts the focus to contract and consent ("Why won't you sign?") rather than the structural moral question of aggregation. It allows the consequentialist to argue that rational agents *would* sign, derailing the intuition pump.
  2.  **The "Veil of Totals" (Accountant) Mechanic:** An "Actuary" sees only net welfare numbers and recommends a policy; a "Council" sees who bears the costs and votes.
      *   *Verdict:* **Discard.** This creates too many roles for 14 students and risks confusing the "within one life" analogy. It isolates the information too much, making the conflict about information asymmetry rather than moral structure.
  3.  **The "Physical Boundary" Mechanic (Selected):** Round 1 places all welfare chips into a single central container (simulating one life/pool); Round 2 distributes chips into individual hands (simulating distinct persons). The numerical proposal is identical, but the physical boundary changes.
      *   *Verdict:* **Commit.** This physically embodies the "separateness of persons" without requiring technical vocabulary. It forces the consequentialist to confront the group's divergent votes on identical math before they can argue the principle.

  ---

  ### Activity Specification: "The Pool and The Hand"

  **Goal:** To demonstrate that maximizing total welfare feels permissible when costs/benefits occur within a single boundary (one life) but problematic when distributed across distinct boundaries (many lives), even when the arithmetic is identical.

  **Materials:**
  *   Whiteboard & markers.
  *   28 Red Poker Chips (labeled "Hassle" with tape).
  *   2 Blue Poker Chips (labeled "Reward" with tape).
  *   1 Shoebox (labeled "The Pool").
  *   28 Index Cards (14 marked "Voter A", 14 marked "Voter B").
  *   28 small slips of paper for ballots + a pen.
  *   Phone timer.

  **Setup & Roles (5 Minutes):**
  *   **Facilitator:** You control the narrative and the chips. Do not allow debate during instructions.
  *   **Students:** All 14 are "Approvers."
  *   **Secrecy:** Tell students: "We are running two independent policy simulations. Do not discuss the moral reasoning until I tell you to. If you spot a pattern, keep it to yourself until the end. Talking before the vote invalidates the data."
  *   **Chip Value:** Explicitly state: "These are not money. Red is a hassle (like a headache or chore). Blue is a reward (like a prize or vacation). We are measuring 'welfare units'."

  **The Numbers (Hidden from students until Debrief):**
  *   **Cost:** 13 Red Chips (10 units of hassle each = 130 units total).
  *   **Benefit:** 1 Blue Chip (140 units of reward).
  *   **Net:** +10 Units (Positive utilitarian outcome).

  #### Minute-by-Minute Timeline

  **00:00 – 05:00 | Introduction & Rules**
  *   Seat students in a semi-circle. Place the Shoebox ("The Pool") in the center.
  *   Read the **Golden Rule**: "In this session, we vote on proposals. You may ask procedural questions ('How do I vote?'), but not moral questions ('Is this fair?'). We are testing how the mechanism feels, not arguing the theory yet."
  *   Distribute ballot slips.

  **05:00 – 20:00 | Round 1: "The Life Plan" (The Pool)**
  *   **Framing:** "Imagine this Shoebox represents a single person's life over time. All experiences go into this box. We are advisors checking if this life plan is worth living."
  *   **Action:** Place 13 Red Chips and 1 Blue Chip into the Shoebox *before* the vote. Show the students the contents.
  *   **Proposal:** "Proposal Alpha: We accept this mix of hassles and rewards for this single life. Total Hassle: 130. Total Reward: 140. Net Gain: 10."
  *   **Vote:** Students mark "Yes" or "No" silently. Fold slips. Collect them in a sealed envelope (do not count yet).
  *   **Constraint:** If the consequentialist asks, "Is this efficient?", reply: "The numbers are on the board. Vote based on whether you approve the plan."

  **20:00 – 35:00 | Round 2: "The Neighborhood Plan" (The Hands)**
  *   **Framing:** "Reset. Imagine you are 14 distinct neighbors living on a block. You keep your own experiences."
  *   **Action:** Deal 1 Red Chip to 13 students. Deal 1 Blue Chip to 1 student (rotate who gets the Blue so it's not always the same person, or pick randomly).
  *   **Proposal:** "Proposal Beta: We accept this distribution. 13 neighbors take a Hassle (10 units each). 1 neighbor gets a Reward (140 units). Total Hassle: 130. Total Reward: 140. Net Gain: 10."
  *   **Note:** Write the totals on the board exactly as in Round 1. Do not comment on the similarity.
  *   **Vote:** Students mark "Yes" or "No" silently. Fold slips. Collect them in a *second* sealed envelope.
  *   **Constraint:** If students protest ("Why do I have to take the red chip?"), reply: "This is a simulation of a policy rule. You are voting on whether the rule is permissible, not whether you personally want the chip right now."

  **35:00 – 45:00 | The Reveal & Small Group Discussion**
  *   **Action:** Open envelopes. Write the tally on the board side-by-side.
      *   *Likely Result:* Round 1 (Pool) = High Yes. Round 2 (Hands) = High No.
  *   **Task:** Break into pairs (7 pairs).
  *   **Prompt:** "Look at the board. The numbers were identical. The votes were different. In your pairs, list three reasons why Proposal Beta felt harder to approve than Proposal Alpha. Do not use philosophy words yet. Use plain English."
  *   **Facilitator Role:** Circulate. If the consequentialist tries to explain why they *should* have voted Yes in Round 2, interrupt: "I don't want to know what the right answer is yet. I want to know why it *felt* different."

  **45:00 – 60:00 | Large Group Debrief (Mapping the Intuition)**
  *   **Step 1 (Student Words):** Ask pairs to share their reasons. Write them on the whiteboard.
      *   *Expected phrases:* "It's not my pain," "You can't just take from us," "One person shouldn't suffer for another," "In the box, it was all the same."
  *   **Step 2 (The Collision):** Point to the totals. "The math says these are identical. 130 cost, 140 benefit. If 'Maximize Total Happiness' is the only rule, both should be Yes. Why did the boundary change the verdict?"
  *   **Step 3 (Facilitator Terminology):** Only now introduce the concept.
      *   "You just discovered an objection to simple aggregation. Some philosophers call this the **Separateness of Persons**."
      *   "In Round 1, the costs and benefits happened inside one boundary (one life). Sacrificing now for later feels like prudence."
      *   "In Round 2, the costs and benefits crossed boundaries (different lives). Sacrificing you for me feels like exploitation, even if the total goes up."
      *   "The maximizing view treats society like one big person (The Pool). Your intuition says society is many people (The Hands)."

  **60:00 – 65:00 | Limitations & The "Consent" Reply**
  *   **Facilitator Script:** "This activity shows a conflict, not a solution. It proves that aggregation feels different across persons, but it doesn't prove it's *wrong*."
  *   **Address the Consequentialist:** "One of you might say: 'But if we agreed to this rule in advance, everyone would be better off over time.' That is a strong reply. This game cannot answer that. It only shows that without prior agreement, the transfer feels violating."
  *   **Address the Psychology:** "Is this a moral fact or just a psychological bias? We don't know yet. But you cannot do ethics without noticing where the math and the intuition collide."

  **65:00 – 70:00 | Closing**
  *   Collect materials.
  *   **Exit Ticket:** Ask each student to say one word that describes Round 2 that didn't apply to Round 1. (e.g., "Unfair," "Invasive," "Separate").

  ---

  ### Troubleshooting Guide

  | Issue | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The Vocal Consequentialist** | They will interrupt Round 2 to say, "But the total is still higher!" | **Pre-empt:** Remind them of the Golden Rule ("No moral debate until debrief"). **During Debrief:** Validate them ("You are right about the math") but pivot ("But why did the group vote No?"). |
  | **Chips as Currency** | Students treat Red/Blue chips as money they want to hoard. | **Script:** Explicitly define them as "Hassle" and "Reward" units at the start. If they bargain ("I'll take your red chip for a dollar"), stop it: "This is about welfare, not trade." |
  | **Refusal to Play** | A student refuses to hold a "Hassle" chip. | **Accommodation:** Let them place the chip on the table in front of them instead of holding it. The visual of "distributed cost" remains. Count their ballot as "No" if they wish. |
  | **Arithmetic Error** | You miscount the totals on the board. | **Prep:** Write the totals on a hidden card before class. Double-check 13x10=130 vs 140. If caught, admit error but emphasize the *ratio* remains net positive. |
  | **Herding** | Students copy their neighbor's ballot. | **Mechanic:** Enforce silent voting. Collect ballots immediately. If someone holds up their slip, ask them to fold it. |
  | **Time Overrun** | Discussion drags on. | **Cut:** Shorten the Small Group Discussion (35-45) to 5 minutes. Go straight to Large Group Debrief. Do not cut the Vote or the Reveal. |

  ### Limitations (What This Activity Cannot Do)

  1.  **Moral Fact vs. Psychological Bias:** The game demonstrates that students *feel* a difference. It does not prove that the difference is morally significant. A utilitarian can argue the feeling is just a bias (like disgust) that should be overcome. You must state this explicitly: "The game reveals the intuition, not the truth."
  2.  **The "Ex-Ante" Agreement:** The activity simulates a one-off decision. It cannot adequately model a system where everyone agrees to the rule beforehand because everyone stands to be the "Winner" sometimes (insurance model). You must speak this limitation: "This game shows the problem of *imposed* sacrifice. It doesn't solve the problem of *agreed* risk."
  3.  **Identifiable Victim Effect:** There is a risk students vote "No" in Round 2 simply because they see the specific person suffering. While the "Pool" round controls for this somewhat, you must clarify in the debrief that the objection holds even if the victims are anonymous, provided they are distinct persons.

  ### Final Takeaway Sentence
  "Maximizing the total good feels acceptable when the costs and benefits land within a single life, but feels violating when the same math requires crossing the boundary from one person's life into another's."
