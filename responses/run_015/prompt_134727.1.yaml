          *   *Adiaphorization:* Making certain acts morally neutral. Killing becomes "processing." Distance between the actor and the consequence.
          *   *Gardening State:* Society as a garden, weeds (Jews, etc.) must be removed for hygiene/order.
      *   *Historikerstreit:*
          *   *Uniqueness (Nolte, etc. initially, but countered by Habermas/others):* The Holocaust is *sui generis*. Industrialized murder of a specific group for ideological reasons. Comparing it dilutes the specific evil.
          *   *Comparability/Universalism:* It emerged from modern structures available to all nations. If it's unique, we can say "never again" safely because *we* aren't *them*. If it's comparable/product of modernity, it could happen anywhere.
      *   *Tension:* Bauman leans toward comparability (modernity produced it). The Uniqueness argument leans toward specific German ideological pathology.
      *   *Film's Position:* Spielberg's film is often accused of Hollywoodizing the Holocaust, but does it lean into the bureaucratic horror or the individual heroism?

  3.  **Applying to *Schindler's List*:**

      *   *Amon Göth:*
          *   *Surface reading:* Sadist, monster, premodern barbarism. Shooting from the balcony for fun.
          *   *Baumanian reading:* He is the camp commandant. He manages quotas. He discusses "efficiency" of liquidation. But his *pleasure* in killing complicates Bauman. Bauman argues the horror is *bored* bureaucrats. Göth is *excited*. This is a point of resistance. He represents the fusion of bureaucratic power with premodern caprice.
      *   *Oskar Schindler:*
          *   *Surface reading:* Hero, savior.
          *   *Baumanian reading:* He uses the *same* tools. Ledgers, lists, bribery, efficiency arguments ("these workers are essential"). He doesn't reject the system; he hacks it. This fits Bauman perfectly. Moral action is achieved through immoral (or amoral) instrumental rationality.
      *   *The Girl in the Red Coat:*
          *   *Cinematic technique:* Color in B&W. Defamiliarization.
          *   *Baumanian reading:* The system makes victims anonymous (numbers). The coat makes her *visible*.
          *   *Historikerstreit reading:* Does this suggest *this* death matters more? Does it individualize suffering to the point where the mass death becomes background noise? It risks "unrepresentability" – we can only grasp the Holocaust through one innocent child, not the systemic erasure.
          *   *Epistemic vs. Moral Distance:* Epistemic = knowing the facts. Moral = feeling the weight. The coat bridges moral distance (makes us feel) but might distort epistemic distance (statistically anomalous visual).
      *   *Collapse of Distances:* Does the film suggest that *knowing* (seeing the list, seeing the girl) automatically leads to *moral action*? Schindler sees -> Schindler acts. Does the film imply the bureaucracy was just a lack of vision?

