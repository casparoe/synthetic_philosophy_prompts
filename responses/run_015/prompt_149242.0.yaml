answer: |-
  # KB Contradiction Triage Tree

  **Root:** Two entries (A, B) assert *P* and *not-P*. Provenance authority is roughly equal. Classical engine currently explodes on contradiction.

  **Q1: Context & Time:** Do Entry A and Entry B refer to the exact same time window and contextual parameters (e.g., same conference year, same room definition)?
  *   **NO →** Go to **Q1.1**
  *   **YES →** Go to **Q2**

  **Q1.1: Temporal Order:** Is one entry clearly timestamped later than the other?
  *   **YES →** **Leaf 1: Temporal Update (Repair)**
      *   *Awkward Commitment:* You commit to the metaphysical view that truth changes over time, not that contradiction existed.
      *   *Implementation Cost:* Low; add timestamp sorting to query engine and overwrite old values.
  *   **NO →** **Leaf 2: Contextualist Split**
      *   *Awkward Commitment:* You commit to the view that *P* and *not-P* were never actually contradicting because meaning shifted.
      *   *Implementation Cost:* Medium; tag entries with context IDs and require queries to specify context.

  **Q2: Content Type:** Is the content a descriptive fact (e.g., "The room has 30 seats") or a normative rule (e.g., "Submissions must be anonymised")?
  *   **NORMATIVE →** **Leaf 3: Normative Conflict**
      *   *Awkward Commitment:* You commit to treating contradictory rules as co-existing obligations rather than errors.
      *   *Implementation Cost:* Medium; flag pair for human adjudication but retain both in KB as "competing policies."
  *   **DESCRIPTIVE →** Go to **Q3**

  **Q3: Self-Reference:** Does the contradiction arise because an entry refers to its own reliability or truth (e.g., "This entry is unreliable")?
  *   **YES →** Go to **Q3.1**
  *   **NO →** Go to **Q4**

  **Q3.1: Semantic Closure:** Do we want the bot to treat self-referential failures as meaningful truths or as system errors?
  *   **MEANINGFUL →** **Leaf 4: No-Proposition (Error)** *(Note: Often paired with Glut/Gap, but here treated as malformed)*
      *   *Awkward Commitment:* You commit to the view that some grammatical sentences express no truth-apt content.
      *   *Implementation Cost:* Low; regex filter to flag self-reference and move entry to 'error_log'.
  *   **SYSTEM ERROR →** **Leaf 5: Glut View (Dialetheic)** *(See Flag Below)*
      *   *Awkward Commitment:* You commit to the view that some contradictions in reality are literally true.
      *   *Implementation Cost:* High; switch inference engine to LP (allow True & False, block Disjunctive Syllogism).
      *   **[FLAG]:** *Leaf 5 and Leaf 6 are implementationally identical if the DB stores 'Both'. The distinction is purely metaphysical (truth vs. information state). The tree cannot sort them without philosophical interrogation.*
  *   **NEITHER TRUE →** **Leaf 6: Gap View (Paracomplete)**
      *   *Awkward Commitment:* You commit to the view that some meaningful claims lack a truth value entirely.
      *   *Implementation Cost:* High; switch inference engine to K3 (allow Neither, block Excluded Middle).

  **Q4: Engine Flexibility:** Can the database storage layer hold values other than binary {True, False} (e.g., NULL, BOTH, UNKNOWN)?
  *   **NO →** Go to **Q4.1**
  *   **YES →** Go to **Q5**

  **Q4.1: Repair Strategy:** Do we have any external reason to trust Entry A over Entry B (e.g., manual verification)?
  *   **TRUST A →** **Leaf 7: Repair (Reject B)**
      *   *Awkward Commitment:* You commit to arbitrarily silencing a source of equal authority to preserve classical logic.
      *   *Implementation Cost:* Low; delete or hide Entry B.
  *   **TRUST B →** **Leaf 8: Repair (Reject A)**
      *   *Awkward Commitment:* You commit to arbitrarily silencing a source of equal authority to preserve classical logic.
      *   *Implementation Cost:* Low; delete or hide Entry A.
  *   **NO PREFERENCE →** **Leaf 9: Quarantine (Classical)**
      *   *Awkward Commitment:* You commit to ignoring available information to prevent logical explosion.
      *   *Implementation Cost:* Medium; tag pair as 'conflicted' and block them from being premises in inference rules.

  **Q5: Inference Control:** If we store both, should the system be allowed to infer *any* conclusion from this pair (Explosion), or just specific ones?
  *   **ALLOW EXPLOSION →** **[UNOCCUPIED: Incoherent]**
      *   *Reason:* If you store 'Both' and allow classical explosion, the KB becomes trivial (returns everything). This is functionally useless.
  *   **BLOCK EXPLOSION →** Go to **Q6**

  **Q6: Information State:** When a user queries *P*, should the bot return "Yes" (both accepted), "Unknown" (both rejected), or "Conflict" (both reported)?
  *   **YES (Both True) →** **Leaf 10: Glut / LP (Implemented)**
      *   *Awkward Commitment:* You commit to treating contradictory information as sufficient for assertion.
      *   *Implementation Cost:* High; modify query return logic to accept 'Both' as a successful match.
  *   **UNKNOWN (Neither) →** **Leaf 11: Gap / K3 (Implemented)**
      *   *Awkward Commitment:* You commit to treating contradictory information as insufficient for assertion.
      *   *Implementation Cost:* High; modify query return logic to treat 'Both' as a null match.
  *   **CONFLICT (Both Reported) →** **Leaf 12: Four-Valued (FDE)**
      *   *Awkward Commitment:* You commit to treating truth as an information state rather than a worldly property.
      *   *Implementation Cost:* High; store Belnapian values (T, F, Both, Neither) and update UI to display 'Conflict' warnings.

  **[FLAG]: Hybrid Option:** *At any point where you choose to store both (Leaves 5, 10, 12), you may instead choose **Leaf 13: Hybrid Fragment**.*
  *   *Condition:* Keep classical engine globally, but route queries involving conflicted IDs to a local paraconsistent solver.
  *   *Awkward Commitment:* You commit to maintaining two incompatible logical systems within one architecture.
  *   *Implementation Cost:* Very High; build a middleware router to detect contradiction and switch reasoning engines dynamically.

  ---

  # Case Stress-Test

  Here is how the four cases land under different answer sets. This demonstrates that the data does not determine the logic; your policy choices do.

  ### Case 1: The Deadline (Entry 412: "Friday" vs. Entry 517: "Not Friday")
  *   **Path A (Temporal Repair):**
      *   *Answers:* Q1=NO (Different contexts?), Q1.1=YES (517 is newer).
      *   *Leaf:* **Leaf 1: Temporal Update.**
      *   *Rationale:* Treat 517 as a correction of 412.
  *   **Path B (Quarantine):**
      *   *Answers:* Q1=YES (Same conference), Q2=DESCRIPTIVE, Q3=NO, Q4=NO (DB is binary), Q4.1=NO PREFERENCE.
      *   *Leaf:* **Leaf 9: Quarantine (Classical).**
      *   *Rationale:* Can't store both, won't guess, so hide both from automated reasoning.
  *   *Strain:* The tree forces a choice between "it changed" and "it's broken." If both emails were sent simultaneously by different committees, Q1=YES but Q2 might be NORMATIVE (Leaf 3). The tree handles this, but shows the data doesn't decide.

  ### Case 2: The Revenge (Entry 999: "No entry with this ID is reliable")
  *   **Path A (No-Proposition):**
      *   *Answers:* Q1=YES, Q2=DESCRIPTIVE, Q3=YES, Q3.1=SYSTEM ERROR.
      *   *Leaf:* **Leaf 4: No-Proposition (Error).**
      *   *Rationale:* Treat self-reference as a syntax error in the KB schema.
  *   **Path B (Glut):**
      *   *Answers:* Q1=YES, Q2=DESCRIPTIVE, Q3=YES, Q3.1=MEANINGFUL.
      *   *Leaf:* **Leaf 5: Glut View.**
      *   *Rationale:* Accept the paradox as a true contradiction about reliability.
  *   *Strain:* Q3.1 is not a CS question; it's a philosophy question. A lab mate cannot answer "Is this meaningful?" without a semantic theory. The tree flags this dependency but cannot resolve it.

  ### Case 3: Vagueness (Room 2: "Small" (<40) vs. "Not Small" (>30))
  *   **Path A (Gap View):**
      *   *Answers:* Q1=YES, Q2=DESCRIPTIVE, Q3=NO, Q4=YES, Q6=UNKNOWN.
      *   *Leaf:* **Leaf 11: Gap / K3.**
      *   *Rationale:* Room 2 is in the borderline zone; neither predicate applies.
  *   **Path B (Contextualist):**
      *   *Answers:* Q1=NO (Different definitions of 'small').
      *   *Leaf:* **Leaf 2: Contextualist Split.**
      *   *Rationale:* 'Small' is indexical to the guideline version.
  *   *Strain:* Vagueness often looks like a Gap (Leaf 11) but is often implemented as Contextualism (Leaf 2) to avoid changing the logic engine. The tree separates them at Q1, but Q1 is ambiguous for vagueness (is it the same context if the definition shifts?).

  ### Case 4: Policy Conflict (Anonymisation: "Yes" vs. "Maybe")
  *   **Path A (Normative Conflict):**
      *   *Answers:* Q1=YES, Q2=NORMATIVE.
      *   *Leaf:* **Leaf 3: Normative Conflict.**
      *   *Rationale:* Both rules exist; humans must resolve the obligation.
  *   **Path B (Glut / Four-Valued):**
      *   *Answers:* Q1=YES, Q2=DESCRIPTIVE (Treat policy as fact about rules), Q4=YES, Q6=CONFLICT.
      *   *Leaf:* **Leaf 12: Four-Valued (FDE).**
      *   *Rationale:* Store the conflict as an information state "Overdetermined."
  *   *Strain:* Q2 (Normative vs. Descriptive) is the pivot. If you treat policies as facts about the world ("The rule says X"), you enter the logic engine path. If you treat them as directives, you enter the repair/pathology path. The tree exposes this categorization decision as the critical failure point.

  ---

  # Unoccupied & Flagged Notes

  1.  **Q4=NO + Q6=YES/UNKNOWN:** This combination is **Incoherent**. You cannot return "Both True" or "Neither True" if the database cannot store values other than Binary True/False. You must repair (Leaf 7/8/9) before you can reason non-classically.
  2.  **Leaf 5 (Glut) vs. Leaf 12 (FDE):** As flagged in Q3.1 and Q6, these are **Unseparated by Questions**. Implementationally, both store 'Both'. The distinction is whether 'Both' means "True and False" (Glut) or "Reported True and Reported False" (FDE). The tree cannot sort this without asking "Is reality contradictory?", which violates the CS-lab-mate constraint.
  3.  **Q5=ALLOW EXPLOSION:** This leaf is **Unoccupied/Unattractive**. Storing contradictions and allowing classical explosion renders the KB useless (triviality). No rational agent occupies this space.
  4.  **Leaf 13 (Hybrid):** This is **Unexplored** in standard KBs. Most systems choose Global Classical (Repair) or Global Paraconsistent. A modular logic switch is theoretically sound but engineering-heavy.
