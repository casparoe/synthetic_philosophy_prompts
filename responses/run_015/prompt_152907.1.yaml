answer: |-
  This is a exceptionally sharp distinction. You have isolated a phenomenological nuance that often gets collapsed in the standard debate between impartial morality (Kantian/Utilitarian) and partialist integrity (Williams/Virtue Ethics).

  To answer your first question directly: **No, there is no single canonical term for this specific configuration in the literature.** It is usually lumped under **motive overdetermination** or **reflective endorsement**, but as you note, those terms miss the "idle backup" quality you are describing.

  However, we can map this terrain precisely by distinguishing it from Williams' original objection and standard overdetermination, and then proposing boundary conditions for what you might call **"Justificatory Redundancy"** or **"Parallel Moral Shadowing."**

  ### 1. How it differs from "One Thought Too Many"

  Williams' objection in *Persons, Character, and Morality* is about **mediation**.
  *   **Williams' Case:** The husband saves the wife *because* he has deliberated that saving a spouse is morally permissible/required. The moral thought stands *between* the impulse and the action. It transforms the action from an expression of love into an execution of a principle.
  *   **Your Variant:** The moral thought does not mediate. It does not generate the action. The love pulls the lever; the moral principle stands in the corner watching.

  **The Crucial Difference:**
  Williams objects to the *source* of the motivation (Morality vs. Ground Project). You are describing a case where the *source* is correct (Ground Project), but the *architecture of the mind* includes a moral monitor.
  *   **Williams:** The thought corrupts the *action*.
  *   **You:** The thought changes the *texture of the agent*.

  Williams would likely argue that even your variant is "one thought too many," but for a deeper reason: **The possibility of defection.** If you have a backup generator, it implies you believe the main power grid (your love/loyalty) is unstable. By holding the moral principle in reserve, you are implicitly acknowledging that your love *could* fail to be sufficient, or *could* become immoral. For Williams, a true "ground project" should not be held contingently upon moral validation. The mere presence of the backup suggests you haven't fully surrendered to the commitment.

  ### 2. How it differs from Overdetermined Motives

  In philosophy of action, **overdetermination** usually means: *Cause A was sufficient to produce Effect X, and Cause B was also sufficient to produce Effect X.*
  *   **Standard Overdetermination:** I save my wife because I love her (Sufficient) AND because it is my duty (Sufficient). Both are actively pushing the boulder up the hill.
  *   **Your Variant:** I save my wife because I love her (Sufficient). The duty is present but **causally inert**.

  This is closer to what some meta-ethicists call **Justificatory Redundancy**. The moral principle provides a *reason for which the act is defensible*, but not the *reason for which the act is done*.

  **Why this matters:**
  In standard overdetermination, if the love vanished, the duty would still compel the action. In your variant, if the love vanished, the agent might not act (since the duty is only a "backup," not an active driver). This makes your variant distinct: it preserves the **phenomenology of love** while retaining the **security of morality**.

  ### 3. Does it have a name? (Proposed Terminology)

  Since it lacks a standard label, here are three concepts from adjacent literature that approximate it:

  1.  **Reflective Endorsement (Korsgaard/Smith):** This is the idea that we act on impulses, but we are only free/autonomous if we reflectively endorse those impulses. Your "backup generator" sounds like a silent reflective endorsement. However, Williams rejects this too; he thinks we shouldn't *need* to endorse our ground projects morally to live them.
  2.  **Moral Schizophrenia (Michael Stocker):** Stocker argued that modern ethics splits our motives from our reasons. Your case tries to heal the split by keeping the motive (love) primary, but keeps the reason (duty) visible. It is an attempt to avoid schizophrenia, but risks a milder form of it: **Moral Bifurcation**.
  3.  **Rules of Moral Salience (Barbara Herman):** A Kantian attempt to solve this. Herman argues moral rules shouldn't motivate action directly but should shape the *context* in which we perceive our options. Your "shadow" principle functions like a Rule of Salience—it's not driving the bus, but it's mapping the road.

  If you were to coin a term for your paper or thought experiment, **"Causally Inert Moral Redundancy"** or **"Parallel Justificatory Shadowing"** would be accurate.

  ### 4. Boundary Conditions: Separating it from Moral Self-Assurance

  You asked: *If it's not in the literature, what boundary conditions would separate it from ordinary moral self-assurance?*

  This is the most vital philosophical work to be done on your idea. We need to distinguish the "Healthy Shadow" (Self-Assurance) from the "Alienating Shadow" (Williams' worry). Here are three boundary conditions:

  **A. The Counterfactual Test (The Conflict Condition)**
  *   **Self-Assurance:** If the moral principle suddenly conflicted with the loyalty (e.g., saving the wife requires a minor injustice to a stranger), the agent would not even register the principle as a competing force. The loyalty blinds them to the conflict.
  *   **Your Variant:** The agent *registers* the conflict. The backup generator revs up. The agent feels the tension but chooses loyalty.
  *   **Boundary:** If the principle is capable of *competing*, it is not truly a shadow; it is a dormant rival. For it to be pure "texture," it must be incapable of vetoing the love.

  **B. The Phenomenological Test (The Transparency Condition)**
  *   **Self-Assurance:** The agent feels whole. The action flows.
  *   **Your Variant:** The agent feels "covered." There is a sense of security.
  *   **Boundary:** Does the presence of the principle provide *comfort* or *distance*?
      *   If it provides comfort ("I am safe in doing this"), it is **Moral Insurance**.
      *   If it provides distance ("I am observing myself doing this"), it is **Alienation**.
      *   Williams argues that *any* need for moral insurance is a form of alienation from the ground project.

  **C. The Explanatory Test (The "Why" Condition)**
  *   If asked "Why did you do it?":
      *   **Self-Assurance:** "Because she is my wife." (Full stop).
      *   **Your Variant:** "Because she is my wife. Also, I suppose it was the right thing to do."
  *   **Boundary:** If the moral principle is offered as an *explanation* to others, it changes the social meaning of the act. It signals to the world that the agent is a "Moral Agent" first, "Husband" second. This changes the **identity constitution** of the actor.

  ### Summary of the Philosophical Stakes

  Your variant identifies a middle ground between the **Saint** (who acts only on duty) and the **Lover** (who acts only on impulse). You are describing the **Secure Lover**.

  *   **Williams' Verdict:** He would likely say this is still "one thought too many." The mere fact that the generator is *there* implies the agent does not trust their own character. It suggests that without the moral backup, they would be dangerous or unmoored. It objectifies the relationship by placing it under the surveillance of the moral law, even if that law is silent.
  *   **The Defense:** One could argue that in a complex world, "blind" loyalty is dangerous. The "shadow" principle acts as a circuit breaker for extreme cases (e.g., if the wife asked the husband to commit murder). In this view, the shadow isn't alienation; it's **rational integration**.

  **Conclusion:**
  Your setup is a sophisticated variation of **motive overdetermination** where the overdetermination is **justificatory rather than causal**. It doesn't have a standard name, but it closely resembles the tension between **Integrity** (Williams) and **Reflective Autonomy** (Korsgaard).

  The boundary condition that separates this from ordinary self-assurance is **Contingency**. If the agent *needs* the shadow to feel justified in their love, Williams wins (it's alienation). If the shadow is merely a descriptive observation of alignment that adds no psychological weight, it is harmless. But as you noted, it changes the "texture." That texture is the difference between living *in* a commitment and living *with* a commitment that you are monitoring.
