          *   *Normative:* We choose based on what we *want* the concept of health to do.
          *   *Critique:* If the user argues "It's arbitrary, therefore it's normative," that's a gap. Just because there's no fact of the matter doesn't automatically mean values drive it (could be pragmatic, conventional, etc.). The user needs to show *why* the choice tracks values specifically. The lactose example helps here.

