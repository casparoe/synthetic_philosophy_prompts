      *   *The Tension:* If the current state says "We aren't liable" (legal discontinuity) but "We apologize" (moral continuity), they are walking a tightrope.
      *   *Answer:* An apology *does* presuppose some form of continuity. You can't apologize for someone else's sin unless you claim inheritance of their moral ledger. If the state says "That wasn't us," an apology is incoherent. It becomes mere "regret" (sadness that it happened) rather than "apology" (acceptance of responsibility).

  3.  **Analyze Question 2: "Apology" vs. "Regret":**

      *   *Linguistic/Performative:* "I apologize" = I own this. "I regret" = I wish this hadn't happened (but maybe not my fault).
      *   *Power Dynamics:* "Regret" is patronizing. It treats the victim's suffering as an unfortunate event, like bad weather, rather than a violation committed by the state.
      *   *Validation:* Victims need *recognition* of the wrong, not just sympathy for the pain. "Regret" denies the *wrongness* of the act by the actor.
