      *   *Political Compromise:* This is classic "having it both ways." It signals the apology isn't full. It signals the state still honors the *perpetrators* (the settlers) while pitying the *victims*.
      *   *Verdict:* It *does* contradict, philosophically. But politically, states live in contradiction all the time. For the novel, this tension is gold. It shows the apology is incomplete/strategic.

