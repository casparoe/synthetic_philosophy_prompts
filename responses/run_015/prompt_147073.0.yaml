answer: |-
  Here's a draft of the desiderata for a robust theory of art. I've kept it loose but structured so you can see where the bodies are buried.

  ### The Desiderata Checklist

  **1. Extensional Adequacy (The "Blob Test")**
  The theory can't be so wide that it includes everything (a random rock on the street) or so narrow that it excludes clear cases (a Renaissance painting). It needs to track our intuitions on paradigm cases without cheating.

  **2. The Forgery Intuition**
  It has to explain why a perfect physical copy of a Vermeer is less valuable/significant than the original. If art is just about visual properties, a forgery should be equal. It's not. The theory needs to account for *history of production*.

  **3. The Readymade Constraint**
  It has to handle Duchamp's *Fountain*. Why is a urinal in a gallery art, but an identical one in a plumbing warehouse isn't? The theory can't rely solely on craft or beauty. It needs a slot for "designation" or "context."

  **4. The AI & Agency Problem**
  It needs to locate agency in generated work. If Midjourney makes an image based on a prompt, is the art the prompt, the model, the output, or the dataset? A theory that requires a single human "creator" with full executive control might crash here.

  **5. The "Negative Labor" Constraint**
  This is the tricky one you flagged. The theory has to account for works that look effortless (or deliberately uncrafted) without erasing the hidden labor that sustains them.
  *   *The Trap:* If a artist presents a blank canvas, the theory can't just say "no craft = no art."
  *   *The Requirement:* It must acknowledge the *institutional labor* (curating, writing, defending, maintaining) that makes the absence of craft meaningful, without reducing the art *solely* to that bureaucracy. It needs to see the "work" as the framing device itself, not just the object.

  **6. Normative Separation**
  It must distinguish between *being* art and *being good* art. A theory that defines art as "that which provides aesthetic pleasure" fails because there is plenty of boring, bad art. Art status and art quality need separate lanes.

  **7. Psychological Plausibility**
  It can't demand cognitive superpowers. If a theory says "you need to know the entire history of art to see this as art," it's failing basic psychology. Ordinary people need to be able to engage with art without a PhD.

  **8. Historical Openness**
  It can't lock the definition to 18th-century European standards. It needs to allow for the concept of "art" to evolve (or admit that "art" is a cluster concept that changes over time).

  ---

  ### The Tensions (Jointly Unsatisfiable Pairs)

  Here's where you hit the wall. You probably can't max out all the desiderata above without contradicting yourself.

  **1. Intentionality vs. Institutional Conferral**
  *   *The Conflict:* If you insist art *requires* specific artist intent (to solve the Forgery problem), you struggle with Readymades and AI (where intent is vague or delegated). If you insist art is *only* what the institution says it is (to solve the Readymade problem), you erase the artist's agency and make the Forgery problem worse (why does the institution care about the original maker?).
  *   *Verdict:* Looks jointly unsatisfiable. You usually have to privilege one and make the other a secondary condition.

  **2. Aesthetic Experience vs. Conceptual Status**
  *   *The Conflict:* If art is defined by how it makes us feel (Functionalism), conceptual art that is deliberately boring or invisible fails. If art is defined by a theoretical status (Contextualism), then why do we care about the sensory object at all?
  *   *Verdict:* Hard to hold both. Most theories end up saying "aesthetic experience is optional," which feels like giving up on something central to art.

  **3. Universalism vs. Historical Specificity**
  *   *The Conflict:* If you define art for all time (Universalism), you misdescribe past cultures that didn't have our concept of "art." If you say "art is only a modern Western construct" (Historicism), you can't judge contemporary work against anything stable.
  *   *Verdict:* You have to accept a "historical narrative" definition (art is whatever stands in the right relation to past art), which is messy.

  ---

  ### Quick Scorecard: How the Big Theories Stack Up

  **1. Institutionalism (e.g., George Dickie)**
  *   *Gist:* Art is whatever the "artworld" says is art.
  *   *Wins:* Crushes the Readymade problem. Handles Negative Labor well (acknowledges the system).
  *   *Losses:* Terrible on Forgeries (if the institution accepts the forgery, is it art?). Circular (what is the artworld? People who make art). Ignores psychology (makes art status totally external to the viewer).
  *   *Verdict:* Good on context, bad on value.

  **2. Functionalism / Aesthetic Theory (e.g., Bell, Scruton)**
  *   *Gist:* Art is about significant form or aesthetic experience.
  *   *Wins:* Great on Psychology and Normative Separation. Explains why we care about the object.
  *   *Losses:* Crashes on Readymades and Conceptual Art (a urinal isn't beautiful). Struggles with AI (who is having the experience, the user or the viewer?). Erases Negative Labor (if it looks easy and isn't beautiful, it's not art).
  *   *Verdict:* Good on experience, bad on modern history.

  **3. Hybrid Contextual-Intentional (e.g., Levinson, Danto)**
  *   *Gist:* Art is an object intended to be regarded in a way past art was regarded.
  *   *Wins:* Handles Forgeries (history matters). Handles Readymades (intention + context). Good historical openness.
  *   *Losses:* Gets messy on AI (what is the model's intention?). Can be too intellectual (violates Psychological Plausibility—do I really need to know art history to see this?). The "Negative Labor" issue is tricky here; it risks focusing too much on the artist's intent and ignoring the institutional maintenance work.
  *   *Verdict:* The strongest all-rounder, but heavy on cognitive load.

  ### Bottom Line
  If you want a theory that handles the **Negative Labor** problem without collapsing into pure bureaucracy, you need a Hybrid view that treats the *framing* as part of the artistic act, not just the object. But be warned: that makes the "Intentionality vs. Institution" conflict the biggest headache you'll have to solve. You can't have both full authorial control and total institutional dependence without some serious philosophical duct tape.
