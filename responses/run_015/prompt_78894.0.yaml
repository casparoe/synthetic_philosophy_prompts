answer: |-
  Friends, family, thank you for being here. Your presence is the first gift this day receives.

  We gather to watch two people change the world. Not by moving mountains, but by speaking. In a moment, [Partner A] and [Partner B] will say words that do not describe a reality, but create one. Before they speak, I need to say a few words of my own.

  There are two ways this can go wrong. I can say the wrong words, and the law will say nothing happened. Or, I can say the perfect words without meaning them, and I suspect *you* will know nothing happened. We are aiming for the third option: the right words, spoken true.

  So, let there be no ambiguity about where I stand. **I take my stand beside you.**

  May your life together be spacious. May your home be a place where words build rather than break. And may you always find the courage to speak the promises that keep you bound.

  [Partner A], [Partner B], please face one another.

  ***

  **Commentary on Philosophical Choices**

  1.  **The Avowal ("I take my stand beside you"):** You asked for a line that is an avowal, not a description. A description ("I am your friend") claims a fact that could be false. An avowal expresses an attitude and takes responsibility for a stance. By phrasing it as "I take my stand," I avoided a constative report on our friendship's status and instead performed the act of aligning myself with them. It functions as an expressive commitment without the future-orientation of a promise.
  2.  **The Misfire/Abuse Joke:** The paragraph beginning "There are two ways this can go wrong" encodes Austin's distinction without the terminology. The first sentence covers the **misfire** (wrong procedure/words = act void). The second covers the **abuse** (procedure correct but insincere = act hollow). For the philosophers, it's a nod to *How to Do Things with Words*; for the grandmother, it's simply a warm reminder to mean what we say.
  3.  **Avoiding Constatives:** Notice the speech lacks predictions ("You will be happy") or assessments ("You are perfect"). Those are constatives where you lack epistemic standing. Instead, the speech relies on **exercitives** ("Thank you," "Please face one another") and **expressives** ("May your life..."). This keeps you within the bounds of what an officiant—and a friend—can legitimately *do* rather than what they can claim to *know*.
