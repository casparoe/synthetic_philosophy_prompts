answer: |-
  **Root:** Everyone agrees: GR is diffeomorphism-invariant. A hole diffeomorphism yields mathematically distinct models on the same manifold.

  **Q1:** Do these two models represent distinct physical possibilities?
  *   **Yes:** **Q2:** Is it acceptable that physics cannot predict which possibility obtains?
      *   Yes → **Radical Indeterminist** (Unnamed; rarely defended).
      *   No → **Manifold Substantivalist** (Inconsistent; forced to reject GR or substantivalism).
  *   **No:** (You accept Leibniz Equivalence). **Q3:** Do spacetime points exist independently of the metric field?
      *   No → **Relationist** or **Dynamical Substantivalist**.
      *   Yes → **Q4:** Do points have intrinsic "thisness" (haecceity) independent of their properties?
          *   Yes → **Empty** (Incoherent; haecceity entails distinct physical states, forcing Q1=Yes).
          *   No → **Sophisticated Substantivalist / Structuralist**.

  **Flags & Notes:**
  *   **Inseparable Leaves:** Sophisticated Substantivalism and Structuralism often occupy the same leaf; both deny haecceity while retaining point-ontology, making them functionally identical in this context.
  *   **Empty Combo:** Answering "No" to Q1 while claiming points have haecceity (Q4=Yes) is incoherent. If points have primitive identity, swapping their properties across the hole creates a distinct physical state.
  *   **Collapse:** A Manifold Substantivalist answering "No" to Q1 collapses into Sophisticated Substantivalism; they retain points but deny haecceity to save determinism.
  *   **Dynamical Substantivalist:** Often clusters with Relationists (Q3=No) since they view geometry as derived from fields rather than the manifold.
