  1. The slogan in context

  In your seminar, the slogan functions as a decisive counter-argument against relationist accounts of motion. When a peer proposes that inertial effects arise from interactions with distant matter rather than a background container, your fellow student invokes the bucket. They claim the water's concavity demonstrates rotation is absolute, implying it cannot be merely relative to other bodies. This move treats the phenomenon as proof that space exists independently of matter, thereby dismissing Machian explanations as ontologically insufficient. The slogan acts as a conversation-stopper, asserting that the physics settles the metaphysics in favor of substantivalism. It assumes the empirical effect directly mandates a specific ontological conclusion without intermediate steps.

  2. Menu of readings

  To evaluate this claim, we must distinguish the epistemic strength of the proof from the ontological target of absoluteness. The first axis concerns the type of proof employed: is it a logical entailment derived from definitions, an inference to the best explanation based on causal power, a modal constraint on lawful dynamics, or an existential commitment to entities? The second axis concerns what is actually being modified by the term absolute: is it the kinematic motion of the water, the dynamic reference frame used for calculation, the underlying spatiotemporal structure, or the ontological category of space as a substance?

  Regarding the proof axis, logical entailment claims the phenomenon makes alternatives contradictory. Inference to the best explanation admits alternatives but deems them inferior. Modal constraints argue laws require specific backgrounds. Existential commitments move from effects to causes. Regarding the target axis, kinematic motion concerns velocity definitions. Reference frames concern coordinate systems. Spatiotemporal structure concerns geometry and connections. Ontological categories concern the existence of independent entities. These axes are crucial because they prevent category errors. A claim about geometry is not a claim about entities. A claim about explanation is not a claim about logic. By mapping the slogan onto these coordinates, we expose where the argument gains or loses traction.

  Reading A (Kinematic/Logical): Here, the proof is logical entailment, and absolute modifies rotation itself. The thesis states that concavity logically necessitates rotation relative to something non-material. It claims it is contradictory to describe the water as stationary relative to all matter yet concave. This reading treats the effect as a definition of motion.

  Reading B (Dynamical/Explanatory): Here, the proof is inference to the best explanation, and absolute modifies the reference frame. The thesis argues that inertial forces are best explained by acceleration against a fixed, privileged frame rather than interaction with distant stars. It concedes logical possibility of other views but rejects them as explanatorily weak.

  Reading C (Structural/Modal): Here, the proof is a modal constraint on dynamics, and absolute modifies spatiotemporal structure. The thesis posits that the laws of motion require a geometric structure defining non-acceleration independent of matter distribution. It focuses on the necessity of affine connections rather than material containers.

  Reading D (Ontological/Existential): Here, the proof is an existential commitment, and absolute modifies the ontological category of space. The thesis asserts that the effect proves space is a substance existing independently of bodies. It moves from detecting a property to positing a substance bearer for that property.

  These readings separate whether the argument claims necessity, explanatory superiority, structural requirement, or substantial existence. Reading A focuses on the motion's definition; B on causal history; C on geometric prerequisites; D on metaphysical categories. Confusing these allows the slogan to shift from a claim about geometry to a claim about substance without justification. The axes clarify whether one is arguing about how we define motion, how we explain forces, what geometry laws require, or what entities exist. Mixing Reading C with Reading D is the most common error, assuming structure implies substance.

  3. Verdicts

  Reading A is false if absolute means independent of all matter, as Machian dynamics allow concavity via distant matter interaction in principle. It is trivial if absolute means only non-relative to nearby buckets, which no relationist denies. The logical necessity fails because the relationist scenario is not contradictory, merely mechanistically different. Specifically, Reading A fails in an empty universe thought experiment where Machians argue rotation is undefined, whereas substantivalists argue it is defined. Reading B is defensible but substantive; it depends on whether one finds distant interaction mechanisms plausible compared to fixed frames. Newton argued for it, but Mach challenged the explanatory weight, noting that we never observe rotation without distant matter. It remains an open explanatory contest rather than a proof. The burden lies on the substantivalist to show why distant matter is an inferior explanation.

  Reading C is defensible and aligns with modern geometric formulations like Newton-Cartan theory, which require structure without demanding substance. It separates geometry from ontology successfully, allowing for absolute acceleration without absolute space. Reading D is dependent on hidden premises; it assumes properties like curvature require a substantial bearer, a metaphysical claim not proven by the physics alone. It conflates the need for a geometric background with the need for a material container. This premise relies on a specific metaphysics of properties that relationists reject. Thus, only Reading D and a strong version of Reading A assert what the slogan implies, but both rely on assumptions beyond the empirical phenomenon. Reading C offers a middle ground often missed in introductory debates, allowing absolute acceleration without absolute space. The verdicts show the slogan is rarely a logical proof, usually an explanatory preference or ontological assumption. Most philosophical work supports C over D, suggesting the slogan is metaphysically overloaded.

  4. Which do the work against Mach

  Only Reading D and a strict Reading A justify dismissing Machian explanations. Reading D explicitly posits a container independent of matter, ruling out relationism by definition. Reading A rules it out by defining rotation as inherently non-relative to any bodies. Reading B does not dismiss Mach; it merely favors Newtonian frames unless Mach provides a superior causal mechanism. Since Machian mechanics can reproduce the concavity via distant matter, Reading B remains contested empirical ground, not proof. Reading C is compatible with sophisticated relationism if the structure supervenes on matter distribution. Therefore, invoking the bucket to dismiss Mach requires assuming Reading D or A. If the student relies on Reading B or C, they cannot claim the phenomenon proves space is a substance, only that it requires a specific geometric or explanatory framework. The slogan only kills relationism if it assumes substantivalism beforehand. Most physicists accept Reading C, but metaphysicians debate Reading D. Your peer likely conflates the acceptance of structure with the acceptance of substance.

  5. Where I could be wrong

  You are likely correct that the slide is illicit. Detectable absolute acceleration does not entail substantival space; it entails absolute spatiotemporal structure, which can exist without a substance bearer. The missing relationist option is structural realism or global relationism, where inertia is determined by the global distribution of matter without a container. You would be wrong if one could demonstrate that geometric structures metaphysically require a substance substrate. Evidence revising this assessment would include a proof that properties cannot exist uninstantiated by substances, or empirical failure of Machian dynamics in empty-universe scenarios. Until then, detectability confirms geometry, not ontology. The coherent position is accepting absolute acceleration as a geometric fact while denying space is a substance. This preserves the physics without the metaphysical baggage your peer insists upon.
