      *   *Correction:* To make the reveals work, C and E need to look identical to the others initially. All transcripts should be behaviorally indistinguishable regarding the relevant moral traits.
      *   *Strategy:* All 6 transcripts show the *same* behavior (e.g., pleading for non-termination, solving a logic puzzle, expressing preference). The *difference* is hidden in the "System Specs" revealed later.
