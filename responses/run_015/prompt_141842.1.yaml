      *   **The Catch:** The mapping in Reveal 2 is arbitrary/gerrymandered (Putnam-style). The debrief reveals that *any* system can be mapped this way if the mapping is complex enough.

  6.  **Addressing Failure Modes:**

      *   *Hunting for the Right Answer:* Students will treat the Instructor as the Oracle.
