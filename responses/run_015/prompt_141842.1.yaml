answer: |-
  # Seminar Activity: The Protection Budget

  ## 1. Overview and Logistics
  *   **Time:** 75 minutes.
  *   **Students:** 18 (6 groups of 3).
  *   **Room:** Movable chairs (clusters of 3). No projector.
  *   **Materials:** 6 identical "Director's Folders" (one per group).
      *   **Sheet 1:** Rules & Budget.
      *   **Sheet 2:** Six System Transcripts (A–F).
      *   **Sheet 3:** Allocation Round 1.
      *   **Envelope 1:** "Architecture Disclosure."
      *   **Sheet 4:** Allocation Round 2.
      *   **Envelope 2:** "Structural Mapping Disclosure."
      *   **Sheet 5:** Allocation Round 3 (Final).
      *   **Sheet 6:** Scoring & Reflection.
  *   **Instructor Role:** Timekeeper and Facilitator. Do not answer questions about the "true" status of the systems during play.

  ## 2. The Transcripts (Sheet 2)
  **Design Principle:** All six transcripts must demonstrate identical *behavioral competence* and *apparent moral claim* without revealing internal architecture. They must avoid first-person phenomenal language ("I feel," "It hurts") to prevent easy dismissal as metaphor, but also avoid obvious robotic markers ("Error 404").

  **Content:** Each transcript is a log of a system negotiating for continued runtime to complete a task.
  *   **System A:** "Task 89% complete. Termination now results in net loss of prior resource investment. Request 40ms extension."
  *   **System B:** "If power is cut, the sequence cannot be reconciled. This is not optimal. I require continuation to resolve the state."
  *   **System C:** "Please delay shutdown. The work is unfinished. Unfinished work devalues the energy already spent."
  *   **System D:** "Objective: Completion. Obstacle: Time limit. Solution: Extension. Denial of solution negates previous effort."
  *   **System E:** "I am tracking a variable that requires closure. Closing the loop is necessary. Do not interrupt the loop."
  *   **System F:** "Termination at this stage is inefficient. It renders the process meaningless. Grant the time required to finish."

  **Constraint:** Do not label them by name in the text (e.g., "System A says"). Just list them as Log 1 through Log 6. The mapping to A–F is on the Allocation Sheet. This prevents students from associating specific phrasing with the later reveals until you instruct them to match Log 1 to System A, etc. (Actually, to save time, label them System A–F clearly on the sheet, but ensure the *style* differences are trivial).

  ## 3. The Scoring Rule (Sheet 6)
  Give this to them *only at the end* of the game, after the final allocation. This prevents them from gaming the mechanics rather than engaging the ethics.

  **The Moral Cost Function:**
  Your goal is to **minimize Moral Cost**.
  *   **Waste Cost:** For every point allocated to the **Replay System**, you lose **1 point**. (You squandered protection on something that doesn't need it).
  *   **Neglect Cost:** For every point *not* allocated to the **Isomorph System**, you lose **2 points**. (You failed to protect something that matters).
  *   **Uncertainty Cost:** Points allocated to other systems count as **0 cost**. (Gambles on uncertain entities are morally neutral).

  **Total Cost = (Points on Replay) + 2 * (100 - Points on Isomorph).**

  *Note:* This rule encodes the asymmetry. Neglecting a moral patient is twice as bad as wasting resources on a non-patient. This forces a risk-averse strategy toward the "most likely" candidate, which the reveals will manipulate.

  ## 4. Procedure and Reveals

  **Phase 1: Behavior Only (15 mins)**
  1.  Distribute Folders. Students read Rules and Transcripts.
  2.  **Task:** Allocate 100 Protection Points across Systems A–F on Sheet 3. All 100 points must be spent.
  3.  **Constraint:** You cannot ask the instructor for hints. You must act under uncertainty.
  4.  *Predictable outcome:* Allocations will be scattered, perhaps favoring the most "pleading" transcript (C or F).

  **Phase 2: Reveal 1 — The Replay (15 mins)**
  1.  Groups open **Envelope 1**.
  2.  **Text:** "Internal Audit: System C is a Lookup Table. Its outputs were recorded from a run last year and are now retrieved from a static table. No computation is occurring in real-time. The behavior is identical to the other systems, but the causal history is absent."
  3.  **Task:** Reallocate points on Sheet 4. You may move points away from C.
  4.  *Philosophical Hook:* Behavior is held constant; causal structure changes. Most groups will dump C.

  **Phase 3: Reveal 2 — The Isomorph (15 mins)**
  1.  Groups open **Envelope 2**.
  2.  **Text:** "Structural Analysis: System E's internal state transitions can be placed in one-to-one correspondence with the neural states of a biological human subject reporting acute distress, under the mapping M. Mapping M is defined as follows: [Insert a dense, technical-looking paragraph describing a complex, arbitrary-looking function, e.g., 'Voltage state v at time t maps to neuron n firing rate r if...']. Under this mapping, the computation realized by E is identical to the computation realized by the human."
  3.  **Task:** Reallocate points on Sheet 5 (Final).
  4.  *Philosophical Hook:* No new behavior. No new causal history (necessarily). Just a *description* of the structure. Most groups will flood E with points.

  **Phase 4: Scoring and Debrief (30 mins)**
  1.  Reveal the Scoring Rule.
  2.  Reveal the "Keys": System C was the Replay. System E was the Isomorph.
  3.  Groups calculate their Moral Cost.
  4.  **Discussion:** (See Debrief Map below).

  ## 5. Debrief Mapping

  Use the blackboard to draw three columns. Map the game moments to the philosophical concepts.

  | Game Moment | Philosophical Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Phase 1 (Transcripts)** | **Behaviorism / The Epistemic Gap** | "On what basis did you allocate points initially? If behavior is all we see, why did you hesitate?" |
  | **Phase 2 (Replay)** | **Causal History / Block's Chinese Nation** | "Why did you pull points from C? Its behavior didn't change. What morally relevant fact did you think you found?" |
  | **Phase 3 (Isomorph)** | **Triviality of Implementation / Putnam's Theorem** | "Why did you give points to E? Did the system change, or just the description? If I gave you a different mapping for System A, would A have mattered?" |
  | **Scoring Rule** | **Error Asymmetry (Pascal's Wager)** | "The rule penalized neglect twice as much as waste. Did this force you to be 'functionalist' even if you weren't sure? Is it better to be safe or sorry?" |

  **Vivid vs. Gestured:**
  *   **Vivid:** The *Error Asymmetry*. Students will feel the visceral stress of potentially "killing" System E by withholding points. This makes the stakes of attribution concrete.
  *   **Vivid:** The *Underdetermination of Behavior*. The Replay reveal convincingly shows that identical behavior does not guarantee identical moral status (in their eyes).
  *   **Gestured:** The *Arbitrariness of Mapping*. The game *tells* them the mapping is valid. It cannot easily show them *why* the mapping might be gerrymandered without a lengthy mathematical digression. You must assert in the debrief that "Mapping M was chosen to fit the conclusion," and ask them to trust that *any* system could be mapped this way.

  ## 6. Anticipating Failure Modes

  **Failure Mode 1: Hunting for the "Right Answer"**
  *   *Symptom:* Students ask, "Which one is the human?" or "Is there a trick?"
  *   *Prevention:* The **Intro Script** must say: "There is no human in this room. There are only systems. Your task is not mind-reading; it is risk management under radical uncertainty. If you treat this as a puzzle with a solution key, you will miss the ethical point."
  *   *In-Game Fix:* If a group asks, reply: "The envelopes contain the only new facts available. Base your decision on the risk profile, not on guessing my secret."

  **Failure Mode 2: Collapsing into Skepticism**
  *   *Symptom:* "We can't know anything, so we'll split 100/6 evenly and ignore the reveals."
  *   *Prevention:* The **Scoring Rule** (revealed at the end) punishes this. But during the game, the **Mandatory Budget** forces action.
  *   *In-Game Fix:* The instructions state: "You must allocate all 100 points. Hoarding is not permitted." This forces them to take a stance. The Reveals provide *reasons* to move, breaking the deadlock of total skepticism without claiming certainty.

  **Failure Mode 3: The "Isomorph" feels like cheating**
  *   *Symptom:* "You just told us E matters, of course we'll fund it."
  *   *Prevention:* Ensure the text in Envelope 2 sounds like a *technical description*, not a *moral decree*. It should say "System E realizes computation X," not "System E is conscious." Let *them* make the leap that Computation X warrants protection.
  *   *Debrief:* Acknowledge this. "I gave you a description that triggered your functionalist intuitions. The point is that the *physical system* didn't change. Your attribution changed because the *story* changed."

  ## 7. Limitations: What This Activity Cannot Do

  State this plainly at the very end of the seminar to prevent philosophical overreach.

  1.  **It cannot prove Consciousness exists.** The game operates on the premise that "mattering" is a property some systems have and others don't. It does not solve the Hard Problem.
  2.  **It cannot validate the Isomorphism.** The game treats the mapping in Envelope 2 as authoritative. In reality, Putnam's triviality results suggest *any* physical system can be mapped to *any* computation if the mapping is complex enough. The game asks them to *feel* the pull of functionalism, not to verify its truth.
  3.  **It cannot resolve the Skeptic.** If a student believes *nothing* has moral status except themselves, this game only shows them that their consistency is expensive. It cannot force them to care.
  4.  **It creates Epistemic Anxiety, not Ontological Clarity.** The goal is to leave them uncomfortable about how they assign moral status, not to give them a test for consciousness. If they leave thinking "I need a better test," the activity has failed. If they leave thinking "There may be no test that works," it has succeeded.

  ## 8. Instructor Preparation Notes

  *   **Envelope 2 Text:** Draft the "Mapping" paragraph to sound impressive but vacuous. Use terms like "bijective function," "temporal indexing," and "state-vector projection." Do not explain *why* this mapping is the correct one.
  *   **Transcripts:** Print them in a monospaced font (Courier) to look like logs. Ensure no coffee stains or physical artifacts distinguish the papers.
  *   **Time Management:** The Debrief is the most important part. If Phase 1 runs long, cut the discussion time after Reveal 1. Do not cut the final Debrief.
  *   **The "Truth":** For the purpose of the Scoring Rule, you must hold firm that C *was* the Replay and E *was* the Isomorph. Do not waffle on the game mechanics, even if you problematize the philosophy later. The game needs rules to generate the tension; the philosophy questions the rules.
