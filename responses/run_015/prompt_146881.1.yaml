answer: |-
  ### Handout: Mapping the Moral Landscape
  **Seminar:** Metaethics & Normative Theory
  **Topic:** Particularism vs. Generalism (A Decision Tree)

  **Objective:** This taxonomy does not sort philosophers by the labels they claim (e.g., "I am a Kantian"). It sorts them by their commitments regarding how moral features function in concrete cases. You can answer the branching questions based on your intuitions about cases, without knowing the literature.

  ---

  ### Part 1: Brainstorming the Logical Space

  Before hitting the tree, we need to isolate three distinct variables that are often conflated in standard introductions.

  1.  **Valence (The Holism Axis):** Does a feature (e.g., "causing pain") always count in the *same direction* (always against), or can it flip direction (sometimes for, sometimes against) depending on context?
      *   *Note:* Standard Generalism usually denies flipping. Radical Particularism affirms it.
  2.  **Weight (The Modulation Axis):** Does the *strength* of a feature's contribution stay fixed, or does it shift based on context?
      *   *Crucial Distinction:* You can believe pain always counts *against* an act (Fixed Valence) but believe it counts *more* in some contexts than others (Modulated Weight). This separates **Modulation** from **Holism**.
  3.  **Principle Status (The Generalism Axis):** Do general principles *explain/ground* why an act is right (Constitutive), or are they merely *summaries* of past judgments (Heuristic/Descriptive)?

  **Settled vs. Contested:**
  *   **Settled:** Almost everyone accepts *some* Modulation. Very few believe the weight of "pain" is mathematically identical in every single context.
  *   **Contested:** Valence Switching (Holism) and Principle Status. This is where the real fight is.

  ---

  ### Part 2: The Decision Tree

  **Root Commitment:** Start with the assumption that *"Causing unnecessary suffering is a moral consideration."*
  *(If you reject this entirely, you are an Error Theorist or Nihilist; this tree is for cognitivists.)*

  **Q1: The Valence Question (Holism)**
  Can "causing suffering" ever count **in favor** of an action (e.g., punitive justice, athletic training), or does it always count **against** it (even if overridden)?
  *   **(A) Always Against:** (Fixed Valence) → Go to Q2.
  *   **(B) Sometimes For:** (Variable Valence) → Go to Q3.

  **Q2: The Weight Question (Modulation)**
  *(For those who said "Always Against")*
  Does the *strength* of the reason change based on context (e.g., suffering matters more in intimate relationships than in traffic), or is the weight fixed by the feature itself?
  *   **(A1) Fixed Weight:** → Go to Q4.
  *   **(A2) Modulated Weight:** → Go to Q4.

  **Q3: The Predictability Question**
  *(For those who said "Sometimes For")*
  Is the switch in valence predictable by a higher-order rule (e.g., "Suffering is good *if* it is deserved"), or is it context-dependent in a way rules can't capture?
  *   **(B1) Predictable by Rule:** → Go to Q4.
  *   **(B2) Unpredictable/Contextual:** → Go to Q4.

  **Q4: The Principle Question (Generalism)**
  Do moral principles *make* the act right/wrong (Constitutive), or do they just *describe* patterns we notice after judging the case (Summary)?
  *   **(X) Constitutive:** Principles ground the verdict.
  *   **(Y) Summary:** Judgment comes first; principles are post-hoc.

  ---

  ### Part 3: The Leaves (Positions & Awkward Commitments)

  Here are the 8 logical endpoints. Note that two are flagged as problematic.

  #### 1. Strict Generalism
  *   **Path:** Fixed Valence + Fixed Weight + Constitutive Principles.
  *   **The View:** Moral features function like mathematical constants. "Lying is wrong" is a universal law with no exceptions if properly defined.
  *   **Awkward Commitment:** You must argue that apparent moral dilemmas are illusions; if two principles conflict, a hidden third principle *must* resolve it.

  #### 2. Rossian Generalism (Moderate Principle View)
  *   **Path:** Fixed Valence + Modulated Weight + Constitutive Principles.
  *   **The View:** Features always count in the same direction, but their strength varies. Principles are binding but defeasible.
  *   **Awkward Commitment:** You must accept that two principles can conflict with no further principle to decide which wins (the "intuition gap").

  #### 3. Contextualist Pluralism
  *   **Path:** Fixed Valence + Modulated Weight + Summary Principles.
  *   **The View:** Features always count against, but context dictates weight. Principles are useful heuristics but don't explain *why* the weight shifts.
  *   **Awkward Commitment:** You rely on principles for teaching/guidance while admitting they have no explanatory power over the actual verdict.

  #### 4. Pattern Realism (Unnamed/Unattractive)
  *   **Path:** Fixed Valence + Fixed Weight + Summary Principles.
  *   **The View:** Features have fixed weight, but principles are just summaries.
  *   **Awkward Commitment:** If the weight is fixed and invariant, why deny principles are constitutive? This position collapses into Strict Generalism but lacks its confidence.
  *   **Status:** **Logically possible but philosophically unstable.**

  #### 5. Exception-Heavy Generalism (Complex Generalism)
  *   **Path:** Variable Valence + Predictable Switch + Constitutive Principles.
  *   **The View:** Features can switch valence, but only according to very complex, codifiable rules (e.g., "Lying is wrong unless... [50 clauses]").
  *   **Awkward Commitment:** You must defend the "esoteric codifiability thesis": that all moral nuance can be written down, even if no human can memorize the rulebook.

  #### 6. Dancy-Style Particularism
  *   **Path:** Variable Valence + Unpredictable Switch + Summary Principles.
  *   **The View:** Features function holistically. A reason in one case may vanish or reverse in another without a rule governing the shift. Principles are at best rules of thumb.
  *   **Awkward Commitment:** You must claim that moral learning via rules is largely an illusion; wisdom comes only from case-by-case perception.

  #### 7. Radical Particularism
  *   **Path:** Variable Valence + Unpredictable Switch + No Principles.
  *   **The View:** Not only are principles non-explanatory, they are misleading. There are no general patterns, only unique cases.
  *   **Awkward Commitment:** You cannot consistently advise anyone ("Don't do that") without implying a general principle you theoretically reject.
  *   **Status:** **Rarely held explicitly; often a caricature of View #6.**

  #### 8. The Incoherent Leaf
  *   **Path:** Variable Valence + Fixed Weight.
  *   **The View:** A feature can switch from "for" to "against," but its *strength* remains constant.
  *   **Status:** **Incoherent.** If a feature changes direction (valence), its contribution relative to other reasons *must* have changed contextually. Weight modulation is entailed by valence switching.

  ---

  ### Part 4: Meta-Analysis for Seminar Discussion

  **1. Indistinguishable Leaves:**
  *   **Leaf 3 (Contextualist Pluralism) vs. Leaf 6 (Dancy-Style):** In practice, these are hard to separate. If principles are only summaries (Leaf 3), does it matter if valence is fixed? If the weight modulates wildly enough, a "fixed valence" feature might function exactly like a "variable valence" one.
      *   *Diagnostic Test:* Ask the student: "Is it *possible* in principle to write a rule that captures the weight modulation?" If Yes → Leaf 3. If No → Leaf 6.

  **2. Empty/Unexplored Spots:**
  *   **Leaf 4 (Pattern Realism):** As noted, this is unattractive. It posits rigid moral physics but denies those physics are law-like. It is rarely defended.
  *   **Leaf 8 (Incoherent):** This spot is empty by definition. Use this to test students' understanding of the difference between *direction* and *magnitude*.

  **3. The Modulation vs. Holism Trap:**
  *   Many students (and some professors) treat **Modulation** (weight change) as evidence for **Holism** (valence change).
  *   *Correction:* You can be a Generalist who accepts Modulation (Leaf 2). You do not have to be a Particularist to admit that "lying to save a life" carries a different weight than "lying to steal."
  *   *Seminar Challenge:* Ask students to defend a view that accepts Modulation but rejects Holism. This is the "Moderate Generalist" sweet spot (Leaf 2).

  **4. Consensus Check:**
  *   **Consensus:** Moral judgment is context-sensitive (Modulation is real).
  *   **Disagreement:** Is that sensitivity *rule-governed* (Generalism) or *sui generis* (Particularism)?
  *   **Warning:** Do not present Particularism as the "default" for nuanced thinkers. Many sophisticated generalists (e.g., Hooker, McNaughton) accept nuance without accepting holism.

  ---

  **Instruction for Students:**
  Place yourself on the tree. If you find yourself shifting between branches depending on the example, note *which* example forced the shift. That tension is your seminar paper topic.
