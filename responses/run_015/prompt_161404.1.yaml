  *Refining the Shared Claims:* One side might refuse to sign "Prostitution is work." The other might refuse "Prostitution is violence." I need to find the middle language. "Selling sex involves exchange of money for sexual access." "Vulnerability is unevenly distributed."

  *Refining the Disagreements:* Make sure the "Verbal" category is used where appropriate (e.g., definitions of exploitation).

