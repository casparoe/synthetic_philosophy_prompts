  Okay, the flow is:
  1. Shared Claims.
  2. Disagreements Table.
  3. Cruxes (and evidence).
  4. Case Study Application (linked to Cruxes).
  5. Metanote.

  Let's ensure the "words vs world" analysis is integrated into the Cruxes or Metanote as requested ("If you conclude... say which part and why"). I will put this in the Metanote/Crux analysis.

  Let's write.

  *Constraint Check:* "No citations or study names." "Mechanism-level reasoning." "Plainly whether there is any evidence both sides would accept."

  *Voice:* Professional, legal/policy analysis tone.

