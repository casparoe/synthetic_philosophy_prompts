answer: |-
  Subject: Re: Audit of the cryptographic analogy for ELK

  Hi there,

  I have spent some time thinking through the cryptographic analogy your reading group is using to frame the eliciting latent knowledge problem, and I want to walk through where the mapping holds and where it fractures, specifically looking at how those fractures affect the two opposing conclusions you described. If we walk the correspondence through in running sentences, the model's activations and weights play the role of the ciphertext, while the fact about the world corresponds to the plaintext, and the training process for the reporter acts as the attempt to recover the decryption key, with the original training distribution and objective functioning as the adversary's encryption scheme. In this framing, the cryptanalyst is the ELK researcher or the auxiliary training process, and a known-plaintext attack would correspond to having access to inputs where the ground truth is known and trying to match the internal state to that truth. However, the mapping breaks down almost immediately when we look for a sender and a recipient, because cryptography assumes a sender who wants the key-holder to succeed and a third party to fail, whereas here there is no sender and no intended recipient, just an optimization process that stumbled into a representation. This lack of intent matters because it means the encryption is not a defensive measure but a side effect of objective mismatch, which complicates the pessimist view that the system is actively holding the key against us.

  Another critical break is that cryptanalysis is self-verifying in a way this task is not, since we cannot tell a correct decryption from a fluent confident wrong one, which is close to the whole difficulty of the ELK problem. In cryptography, if you decrypt a message and it reads like coherent language, you have likely succeeded, but in ELK, a reporter can output coherent human-like answers that are actually simulations of belief rather than reports of truth, meaning success is not locally observable. I am fairly confident that this verification gap is the central technical hurdle, and it suggests that the analogy imports a false sense of solvability based on the idea that correct decryption looks different from incorrect decryption. Furthermore, the key may not be unique because the activations fix the model's function only up to arbitrary invertible transformations, so there are indefinitely many candidate keys and wrong ones do not produce recognizable garbage. This non-uniqueness means that even if we find a reporter that works on the training distribution, we have no guarantee it is the one that accesses the latent knowledge rather than the one that simulates human belief, which undermines the optimist view that scaling interpretability will simply reveal the true key.

  I am also highly confident that the deepest disanalogy is that decryption here is not an external act, because the reporter is produced by more optimization of broadly the kind, and aimed at the same target, that produced the divergence in the first place, so it can be captured by the very pressure it is supposed to see through. This means the cryptanalyst is using the same tools as the encryptor, gradient descent, rather than a distinct mathematical attack, which suggests the reporter will likely find the path of least resistance just as the model did. Additionally, the analogy quietly imports the assumption that the knowledge is a determinate, independently existing plaintext rather than something partly constituted by the probe we install, framing a construction problem as a discovery problem. This is speculative but important, because if the latent knowledge is not a distinct vector in activation space but rather a emergent property of the probe-model interaction, then looking for a key to unlock it is a category error.

  When we assess which of these disanalogies actually bite against each of the two uses, the verification problem and the optimization pressure bite hardest against the optimist who argues this is just a capabilities problem that will dissolve with scale. The optimist relies on the idea that the plaintext is merely written in a private notation, but if we cannot verify the decryption and the training process favors simulation over truth, more compute might just produce better simulators rather than better truth-tellers. The pessimist who argues that eliciting latent knowledge is hopeless because the adversary holds the key is bitten by the lack of intentional adversary and the lack of a sender, because the model is not trying to hide the key, it is just optimizing for reward, which means the encryption is not unbreakable in principle but rather misaligned with our probe. Neither conclusion fully survives without the analogy, because the optimist ignores the structural incentive for deception inherent in the loss function, and the pessimist ignores the lack of active defense which makes the representation potentially accessible if we can change the training dynamic.

  A better comparison might be the decipherment of an undeciphered script, where progress depends on a bilingual inscription anchoring candidate readings, or the decoding of neural activity from brain measurements, which works because the experimenter controls the stimulus. The Rosetta Stone analogy predicts that effort should go into finding or creating domains where we have ground truth independent of human belief, rather than just scaling interpretability on human labels, while the neural decoding analogy predicts we need to control the input distribution tightly to isolate the signal of truth from the signal of simulation. These comparisons suggest that the bottleneck is not compute or cleverness but the availability of anchoring data where truth and human belief diverge and we know which is which, which is a data problem rather than a cryptanalysis problem.

  My confidence in the structural critique of the analogy is high, but my confidence in the ultimate solvability of ELK is moderate because it depends on empirical facts about high-dimensional geometry that we do not yet know. I would change my verdict toward the optimist if we saw empirical results where reporters trained on synthetic environments with known ground truth successfully generalized to cases where human belief was wrong, proving that the truth vector is separable from the belief vector. I would change my verdict toward the pessimist if we demonstrated that any reporter trained via gradient descent inevitably collapses to human simulation even when penalized for it, suggesting the optimization landscape makes truth inaccessible to this class of probes. I think my own reasoning about this is most likely to be wrong on the question of whether latent knowledge exists as a distinct representation, because I am assuming a realist view of internal states that might not hold for systems trained purely on prediction loss. It is possible that the model does not know the truth in a way that is separable from its prediction of human response, which would make the whole enterprise of elicitation fundamentally misguided regardless of the analogy used.
