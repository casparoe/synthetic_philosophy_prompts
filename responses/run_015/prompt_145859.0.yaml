answer: |-
  Mara is diagnosed with a degenerative condition where her neurons slowly crystallize and die. To save her mind, clinicians initiate a 'Neural Lace' protocol: over six months, they replace her decaying biological tissue with synthetic neurons one cluster at a time. The twist is the external buffer—as each biological section is removed, its exact electrochemical state is uploaded to a secure server and instantly downloaded into the new synthetic hardware before integration. By the end, Mara possesses zero original biological brain matter, yet her stream of consciousness remains unbroken because the server maintained a continuous psychological loop, feeding her personality and memories into the new substrate without requiring the old biology to directly cause the new state.

  A psychological reductionist says Mara survives because the chain of memory and character never snapped, proving the physical cause of that continuity is irrelevant. An animalist argues she died the moment her last biological neuron was swapped, since the living human organism ceased to exist, leaving behind a synthetic copy powered by borrowed data. A non-reductionist seeking a 'further fact' of identity would likely claim there's no truth to the matter here, as both bodily and direct causal criteria failed. The server is the key variable: it sustains psychology while breaking direct physical causation. If you remove the server and replace the brain instantly, physical continuity might persist, reverting to a standard substitution case where the biology pushes the psychology forward directly. An animalist critic would press that the server only preserves information, not biological life, meaning the procedure didn't save Mara but rather created a new psychological entity that hijacked her synthetic body.
