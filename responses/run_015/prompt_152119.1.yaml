answer: |-
  Dear colleague,

  I read through your description of the argument with your friend, and I want to start by validating your intuition that something significant is happening here, even if your friend is technically correct about the semantic status of the dispute. What you are describing is a textbook instantiation of the Species Problem, but you have correctly isolated the specific philosophical shape it takes when empirical data is held constant. You are standing precisely at the intersection of metaphysics, philosophy of language, and normative ethics, and the friction you feel is the result of those domains rubbing against one another. To give you a direct answer before we unpack the machinery: there is no single canonical term that captures every nuance of this configuration, but the most precise diagnosis in the current literature is a normative dispute over conceptual privilege within a framework of conceptual pluralism. However, because that is a mouthful and often lacks the bite you need in an argument, I think the most useful label for this specific shape is a substantive verbal dispute, or perhaps more accurately, a pragmatic ontological dispute. I will explain why neither of you is wholly right or wholly wrong, and why the distinction between merely verbal and substantive matters less than the distinction between descriptive and normative claims.

  Let us begin by examining your friend's claim that this is just a fight about a word. In contemporary metaphysics and philosophy of language, particularly in the work of David Chalmers or Eli Hirsch, a dispute is classified as merely verbal if it dissolves once the parties clarify their meanings and agree on all non-semantic facts. You stated that you agree on all empirical claims: genetics, mating behavior, morphology, and history. If species were mind-independent natural kinds, like chemical elements, then there would be a fact of the matter about which population constitutes a species, and one of you would be factually wrong about the world. However, most philosophers of biology, following the lead of Marc Ereshefsky or John Dupré, argue for conceptual pluralism regarding species. On this view, there is no single property that all and only species share across the tree of life. The interbreeding criterion works for sexually reproducing mammals but fails for bacteria or asexual organisms, as you noted. The phylogenetic criterion works for clades but might split populations that ecologists treat as a single unit. If pluralism is true, then there is no single fact of the matter about whether these populations are one species or several independent of the conceptual framework you adopt. In that specific sense, your friend is right that the disagreement is verbal or conceptual rather than empirical. You are not disagreeing about the territory; you are disagreeing about how to draw the map.

  However, your friend is likely wrong to imply that this makes the dispute trivial or merely verbal in the dismissive sense. Chalmers distinguishes between merely verbal disputes and substantive verbal disputes. A dispute is merely verbal if there are no stakes attached to which language game you play. But you identified the crucial feature that prevents this from being trivial: the downstream consequences. Legal protection, conservation funding, and biodiversity metrics depend on the classification. This transforms the dispute from a semantic one into a normative one. You are not actually arguing about what the word species means in a dictionary sense; you are arguing about which conceptual framework ought to be privileged for specific practical purposes. When you say your criterion is the correct one, you are likely expressing a normative claim that your criterion tracks the units that matter for conservation or evolutionary potential better than your friend's criterion. Your friend hears this as a metaphysical claim about the world, and you hear their dismissal as a denial of the stakes. This is why it feels like a real disagreement even though the empirical facts are settled. You are disagreeing about values and priorities disguised as ontology.

  Now let us look at the candidate diagnoses you asked for to see how they differ and what would have to be true for each to hold. The first diagnosis is the Merely Verbal Dispute. For your friend to be strictly right about this, it would have to be true that the choice of classification has no impact on anything outside the conversation. If counting these populations as one species or two changed nothing about legal status, funding, or scientific prediction, then it would be purely stipulative. In that scenario, you could simply agree to disagree and use different labels for different contexts without conflict. The fact that you cannot do this suggests the dispute is not merely verbal. The second diagnosis is Ontological Realism. For you to be strictly right in the way you initially intended—that you are reporting a fact about the world independent of human concepts—it would have to be true that species are mind-independent natural kinds with essential properties. If this were true, then even with perfect data, one of you would be wrong about the reality of the populations. However, the existence of asexual organisms and the historical shifting of species criteria strongly suggest this is false. Nature does not come pre-packaged into species; we carve it up. The third diagnosis is Conceptual Pluralism with Normative Stakes. This is the view I believe fits best. It holds that multiple classification systems are valid relative to different purposes, but we must still choose one for any given institutional purpose. The disagreement is not about which one is true, but about which one is useful or authoritative for the task at hand.

  There is a fourth option worth considering, which is Faultless Disagreement, a concept often discussed in metaethics by philosophers like Max Kölbel. This applies when two parties hold contradictory views, neither is at fault, and there is no objective fact of the matter. This fits your situation well if we accept pluralism. You are both applying valid criteria to the same data and getting different results. Neither of you is making a mistake. However, faultless disagreement usually implies that we can accept both views as equally valid simultaneously. Your situation is harder because the legal and scientific institutions require a single verdict. You cannot list a population as both endangered and not endangered on the same form. This forces a choice, which reintroduces the normative conflict. So while the epistemic situation is one of faultless disagreement, the pragmatic situation is one of forced choice.

  If I were to coin a term to capture this specific configuration, as you invited me to do if no established concept fit, I would call it a Constitutive Stalemate. This label captures the idea that the disagreement is about the constitutive rules of the classification system rather than the objects being classified, and that it is a stalemate because no empirical evidence can resolve it. It differs from a merely verbal dispute because the constitutive rules have real-world effects, and it differs from a standard ontological dispute because the world does not determine the outcome. It falls under the broader category of pragmatic disputes but specifies that the pragmatism is about the constitution of the categories themselves. A nearby case that is not the same thing would be a borderline vagueness case, like arguing whether a heap of sand is a pile. In that case, the disagreement is due to the fuzziness of the boundary. In your case, the criteria are sharp, but they are different criteria. Another nearby case is a purely stipulative definition, like arguing whether a planet must clear its orbit. That was a constitutive stalemate until the International Astronomical Union voted. Once they voted, it became a matter of institutional authority. Your case is currently in the pre-vote phase where the authority is contested.

  So, what would have to be true for your friend to be right? It would have to be true that the consequences you are worried about are illusory or that there is a neutral way to adjudicate the stakes without choosing a species concept. If it turned out that legal protection could be granted based on genetic distinctiveness regardless of species status, the sting would be removed from the argument, and it would revert to a harmless verbal difference. For you to be right in the way you want to be right, it would have to be true that there is a single, privileged perspective on nature that aligns with your criteria, perhaps because your criteria track evolutionary independence or ecological function in a way that is objectively more valuable than your friend's criteria. You could argue that your concept is not just useful but tracks the real units of evolution, making it metaphysically privileged even if not essentialist. This is a common move in biology, arguing that one species concept is more natural than others. If you can demonstrate that your criterion aligns with the fundamental processes of biology better than your friend's, you reclaim some ontological ground.

  Ultimately, I think the most productive way to dissolve the frustration is to acknowledge that you are engaged in conceptual engineering. You are not discovering the concept of species; you are designing it. When you say your criterion is the correct one, you are really saying it is the best tool for the jobs we care about, such as preserving biodiversity or understanding evolutionary history. Your friend is likely prioritizing different jobs, such as reproductive isolation or genetic coherence. The disagreement survives because you are both treating your preferred tool as if it were the only true mirror of nature. If you can shift the conversation from which concept is true to which concept is best for the specific consequences you both agree matter, you might find that you are not actually in a stalemate but rather in a negotiation about priorities. The shape of the disagreement is real, but it is normative all the way down. You are arguing about what we should value in nature, using the language of what nature is. Recognizing this does not make the dispute vanish, but it changes the rules of engagement from fact-checking to value-justification, which is where the actual work lies.

  I hope this helps you untangle the knot. It is a rare pleasure to encounter a disagreement that is so cleanly stripped of empirical confusion that the philosophical skeleton is left visible. Do let me know if you want to discuss the implications of conceptual pluralism for conservation ethics further, as that seems to be where the real weight of your concern lies.

  Best regards,

  Your colleague
