answer: |-
  **Stage 1: Brainstorming**

  Okay, mapping the terrain: Block's distinction is the axe; GWT is the tree. Block says Access = availability for use; Phenomenal = subjective feel. GWT says Ignition = Consciousness. The tension is whether Ignition delivers Access, Phenomenality, or both. Case 1 (Sealed) is the killer: Ignition happens, but use is blocked. If GWT = Access, does Access require actual use or just availability? Block says "poised," which implies potential, but if the bridge is out, is it poised? This needs clarifying. Case 2 (Private) suggests Access without Ignition (behavior without broadcast). This threatens GWT's necessity claim. Case 3 (Sharded) is just split-brain stuff, mostly about unity. The ill-posed bit is "report is our only evidence." If we can't report Case 1, how do we verify phenomenology? This makes the A/P distinction epistemically fragile even if ontologically real. The real work will be done by distinguishing *mechanism* (broadcast) from *function* (access) from *ontology* (phenomenality). I need to commit: is GWT describing the mechanism of access, or claiming that mechanism *is* phenomenality? Most defensible is that it's a theory of Access, and claiming it explains Phenomenality is a category error unless you're a functionalist. I'll argue that.

  ***

  **Stage 2: Polished Explanation**

  To adjudicate these cases, we must first define our terms. **Access consciousness** (A-consciousness) occurs when a mental state's content is poised for use in reasoning and the rational control of action; it is defined by its functional role as a premise for downstream systems. **Phenomenal consciousness** (P-consciousness) refers to the subjective quality of experience—there is "something it is like" to be in the state. **Ignition** (or global broadcast) is the specific neurocomputational event in Global Workspace Theory (GWT) where content from specialized processors is transmitted via long-range neurons to a wide array of consumer systems.

  In **Case One (Sealed Broadcast)**, ignition occurs, but downstream uptake is pharmacologically blocked. GWT predicts consciousness because ignition is present. However, since no system can use the content, the state fails the functional definition of A-consciousness. If GWT is a theory of A-consciousness, it fails here unless "poised" means merely "broadcast" regardless of uptake. If GWT is a theory of P-consciousness, it predicts experience despite the inability to act or report, a claim we cannot verify behaviorally. In **Case Two (Private Lines)**, modules exchange rich content and drive flexible behavior without ignition. GWT predicts no consciousness. Yet, the behavior suggests A-consciousness (content is used for control). This suggests ignition is not necessary for access. In **Case Three (Sharded Workspace)**, two hubs operate independently. GWT predicts two distinct streams of consciousness, aligning with both A-consciousness (two separate availability pools) and P-consciousness (two subjective perspectives), suggesting the theory handles unity better than individuation.

  The harder question is whether GWT is best understood as a theory of A-consciousness, P-consciousness, or a third property, **Global Broadcast**. I commit to the view that GWT is fundamentally a theory of **Access Consciousness**. Broadcast is defined by its functional consequence: making information available to multiple systems. This maps directly onto Block's definition of access. To claim GWT explains P-consciousness is to conflate the mechanism of availability with the nature of experience.

  For GWT to be a theory of P-consciousness, one must argue that global broadcast is the property in virtue of which a state is phenomenally conscious. This requires a functionalist ontology: the claim that subjective feel *just is* a specific profile of information availability. Without this metaphysical commitment, broadcast remains a correlate of experience, not its constitution. The "Sealed Broadcast" case highlights this gap. If ignition occurs but uptake is blocked, does the subject have an experience? If GWT is a theory of P-consciousness, it says yes. If it is a theory of A-consciousness, it says the content was made available (access), even if the "consumers" were drugged. The latter is more defensible because it stays within the functional description the theory actually provides.

  This leads to the epistemic collapse worry: if report is our only evidence for phenomenology, and report requires access, does the A/P distinction collapse? It does not. The distinction is ontological, not epistemic. Case Two demonstrates that access-like behavior might occur without global broadcast (challenging GWT), while Case One demonstrates broadcast might occur without functional uptake (challenging the sufficiency of broadcast for access). The reliance on report limits our *verification* of P-consciousness, but it does not eliminate the *conceptual* distinction. We can conceive of a state that is felt but not used (overflow) or used but not felt (zombie access).

  Therefore, GWT should be read as a mechanistic account of how content becomes access-conscious. It explains how information becomes globally available. Proponents who identify this with phenomenal consciousness are adding a philosophical premise—that availability constitutes feel—which the architecture itself does not justify. For a rival reading (that GWT explains P-consciousness) to win, it must be shown that removing the "what it is like" quality while retaining global broadcast is conceptually impossible. Until then, GWT remains a powerful theory of access, leaving the hard problem of phenomenality untouched.
