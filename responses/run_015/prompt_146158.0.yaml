answer: |-
  # The Stake-Sensitivity Diagnostic Tree

  ## Introduction for the Philosophy Club
  This instrument is designed to bypass label-matching (e.g., "I am a contextualist") and force a confrontation with the logical consequences of your intuitions. We are mapping the **logical space** of possible views first. Once you have navigated the tree based on your answers to the four diagnostic cases, you will land on a specific "leaf." Each leaf represents a coherent (or incoherent) philosophical position. Some leaves are occupied by famous theories; others are empty gaps in the literature.

  **Instructions:** Start at the **Root**. Answer the question based on your intuition about the case provided. Follow the arrow to the next node or leaf.

  ---

  ## Part 1: The Decision Tree

  ### ROOT: The Bridge Case (Split 1)
  **Case:** You casually judge a bridge is safe. Suddenly, you learn a school bus full of children will cross based *only* on your judgment.
  **Question:** Does this new information change **whether you know** the bridge is safe (Epistemic Status), or does it only change **whether you may say/act** on that belief (Practical Norms)?

  *   **A. It changes whether I know.** (The truth of "I know" depends on stakes.) → *Go to Node 2.*
  *   **B. It changes only action/assertion.** (The truth of "I know" is stable; only my permission to use it changes.) → *Go to Node 3.*

  ### NODE 2: The Nature of the Shift (Split 2)
  **Case:** You accept that high stakes lower the truth of "S knows p."
  **Question:** Is this shift because the **word** "knows" changes its meaning/standard (Semantic), or because the **mental state** of knowledge itself requires practical readiness (Metaphysical)?

  *   **A. Semantic Shift.** ("Knows" is like "tall"—context sets the bar.) → *Go to Node 4.*
  *   **B. Metaphysical Shift.** (Knowledge is a real relation that inherently involves action-readiness.) → *Go to Node 5.*

  ### NODE 3: The Invariantist Branch (Split 4)
  **Case:** You believe knowledge is stable regardless of stakes.
  **Question:** Consider the **Distributed Stakes Case**: An analyst processes anonymized data. Individually, harm is nil; aggregately, harm is catastrophic. She is unaware of the aggregate. Do these collective stakes affect her **permission to assert** the data is accurate?

  *   **A. No.** (Stakes never affect norms if the agent is unaware.) → **Leaf 1.**
  *   **B. Yes.** (External stakes constrain assertion even if unknown.) → **Leaf 2.**
  *   **C. Role-Dependent.** (Private belief is stable, but *professional* assertion is stake-sensitive.) → **Leaf 3.**

  ### NODE 4: The Contextualist Branch (Split 3)
  **Case:** You believe "knows" changes meaning with stakes.
  **Question:** Consider **Retrospective Revelation**: You formed a belief years ago assuming low stakes. You now discover catastrophic stakes *actually existed then* (though you didn't know). Was your past claim "I know" **true then**?

  *   **A. False Then (Disqualified).** (The hidden stakes raised the bar retroactively.) → **Leaf 4.**
  *   **B. True Then (Intact).** (Your context *then* determined truth, regardless of hidden facts.) → **Leaf 5.**
  *   **C. Incoherent Question.** (Asking about "truth then" from "now" is a category error.) → **Leaf 6.**

  ### NODE 5: The Encroachment Branch (Split 3 & 4)
  **Case:** You believe knowledge itself is stake-sensitive (Metaphysical).
  **Question:** First, regarding **Retrospective Revelation** (hidden past stakes): Is your past knowledge disqualified?
  *   **A. Disqualified.** → *Go to Split 4 (Distributed).*
  *   **B. Incoherent.** (The idea of "past knowledge" dissolves under this view.) → **Leaf 7.**

  *(If A: Disqualified)*
  **Question:** Regarding **Distributed Stakes** (anonymous aggregate harm): Do these unknown collective stakes count against your knowledge?
  *   **A. No.** (Only stakes the agent grasps or should grasp matter.) → **Leaf 8.**
  *   **B. Yes.** (Objective stakes matter regardless of awareness.) → **Leaf 9.**

  *(Note: To maintain the 6-8 leaf constraint requested, Leaf 9 is merged into the analysis of Leaf 8 as a variant, or Leaf 7 is treated as the 8th leaf. For this instrument, we will treat Leaf 9 as **Leaf 8** to maximize coverage of the logical space.)*

  ---

  ## Part 2: The Leaves (Position Taxonomy)

  ### Leaf 1: Strict Invariantism
  *   **Path:** Bridge (Action Only) → Distributed (No Impact).
  *   **Description:** Knowledge is purely a function of truth, belief, and justification (plus perhaps safety/reliability). Practical stakes never alter knowledge conditions, nor do they alter assertion norms if the agent is unaware of the stakes.
  *   **Status:** **Occupied.** (Traditional Epistemology, e.g., Hawthorne's "Knowledge and Lotteries" initial target).
  *   **Diagnosis:** The "common sense" view, but struggles to explain why we hesitate to claim knowledge in high-stakes cases without accusing the hesitator of irrationality.

  ### Leaf 2: WAM Invariantism (Warranted Assertability Maneuver)
  *   **Path:** Bridge (Action Only) → Distributed (External Impact on Assertion).
  *   **Description:** Knowledge is stable, but the *norm of assertion* is sensitive to external stakes. You might *know* the bridge is safe, but it is irresponsible to *say* so if a bus is crossing, even if you don't know about the bus.
  *   **Status:** **Occupied.** (Moderate Invariantism).
  *   **Diagnosis:** Attractive for preserving the stability of knowledge, but critics argue it creates a gap between what we know and what we can responsibly claim is too wide to be plausible.

  ### Leaf 3: Institutional Hybrid
  *   **Path:** Bridge (Action Only) → Distributed (Role-Dependent).
  *   **Description:** Private belief is stake-insensitive (Invariantist), but institutional roles (engineer, doctor) carry stake-sensitive certification norms. You *know* privately, but you do not *certify* professionally under high stakes without more evidence.
  *   **Status:** **Occupied.** (Niche/Professional Epistemology).
  *   **Diagnosis:** Avoids metaphysical weirdness by locating sensitivity in social contracts rather than the mind. However, it fails to explain why *personal* high-stakes decisions (e.g., betting your life) feel epistemically different, not just socially regulated.

  ### Leaf 4: Classic Contextualism
  *   **Path:** Bridge (Knowledge) → Semantic → Retrospective (Disqualified).
  *   **Description:** The word "knows" picks out different relations in different contexts. If stakes were high *then*, the standard was higher *then*, so your past claim was false.
  *   **Status:** **Occupied.** (DeRose, Cohen).
  *   **Diagnosis:** Explains linguistic data well. However, the "Retrospective Disqualification" is highly contested. Many find it counterintuitive that hidden facts about the world can retroactively falsify your past mental state.

  ### Leaf 5: "Fixed-Content" Contextualism
  *   **Path:** Bridge (Knowledge) → Semantic → Retrospective (Intact).
  *   **Description:** "Knows" is context-sensitive, but the context is fixed at the time of utterance. Hidden stakes *now* don't change the context *then*.
  *   **Status:** **Unattractive/Gap.**
  *   **Diagnosis:** This creates a tension: If "knows" is sensitive to stakes, but hidden stakes don't count, then "stakes" must mean "apparent stakes." This collapses the view into a form of Subject-Sensitive Invariantism or makes the semantic shift trivial. It is rarely defended because it loses the explanatory power of Contextualism regarding error.

  ### Leaf 6: Contextualist Expressivism
  *   **Path:** Bridge (Knowledge) → Semantic → Retrospective (Incoherent).
  *   **Description:** Asking if a past knowledge claim was "true" independent of current assessment is a category error. Knowledge attributions express attitudes, not facts.
  *   **Status:** **Occupied.** (Expressivist/Non-Cognitivist variants).
  *   **Diagnosis:** Solves the retrospective puzzle by dissolving it. However, it requires abandoning the idea that knowledge is a factual state of the world, which is a high price for many realists.

  ### Leaf 7: Metaphysical Expressivism / Error Theory
  *   **Path:** Bridge (Knowledge) → Metaphysical → Retrospective (Incoherent).
  *   **Description:** Knowledge is a real relation, but the requirement for "action-readiness" makes retrospective judgment impossible. You cannot assess if a past belief was "action-ready" for a situation that wasn't salient.
  *   **Status:** **Unnamed/Unoccupied.**
  *   **Diagnosis:** **Incoherent Gap.** If knowledge is a metaphysical relation (a fact), it should be assessable as true or false. Claiming it is metaphysical but retrospectively incoherent risks contradiction. This space is largely empty because it combines realism about the state with anti-realism about its assessment.

  ### Leaf 8: Standard Pragmatic Encroachment
  *   **Path:** Bridge (Knowledge) → Metaphysical → Retrospective (Disqualified) → Distributed (No/Subjective).
  *   **Description:** Knowledge is a real state that requires being "practically adequate." Hidden stakes don't count; only stakes the agent is aware of (or should be) affect knowledge.
  *   **Status:** **Occupied.** (Stanley, Fantl & McGrath).
  *   **Diagnosis:** The dominant rival to Invariantism. It respects the intuition that knowledge guides action. The main contestation lies in Split 4 (Distributed Stakes).

  ### Leaf 9: Objective Encroachment
  *   **Path:** Bridge (Knowledge) → Metaphysical → Retrospective (Disqualified) → Distributed (Yes/Objective).
  *   **Description:** Knowledge is sensitive to *actual* stakes, even if the agent is unaware (e.g., the anonymous data analyst does not know the aggregate harm, so she does not know the data is safe).
  *   **Status:** **Contested/Niche.**
  *   **Diagnosis:** **Contested.** This view pushes encroachment toward externalism. Specialists contest whether "stakes" can operate like "truth"—as a fact independent of the mind. If stakes work this way, Encroachment looks very much like a new form of Reliabilism.

  ---

  ## Part 3: Diagnostic Analysis

  ### 1. Settled vs. Contested Distinctions
  *   **Settled (Conceptual):** The distinction between **Semantic Contextualism (Leaf 4)** and **Metaphysical Encroachment (Leaf 8/9)** is conceptually clear. One claims the *word* changes; the other claims the *world/relation* changes. Specialists agree these are distinct logical options, even if they dispute which is true.
  *   **Contested (Metaphysical):** The **Retrospective Revelation (Split 3)** is genuinely contested. There is no consensus on whether hidden past stakes disqualify past knowledge. Invariantists say "No" (knowledge is stable); Encroachers are split (some say "No" to protect stability, others say "Yes" to protect the knowledge-action link).
  *   **Contested (Epistemic):** The **Distributed Stakes (Split 4)** is an open frontier. It is unclear whether "stakes" function like *evidence* (must be possessed) or like *truth* (objective fact). Leaf 8 (Subjective) is more common, but Leaf 9 (Objective) is gaining traction in social epistemology.

  ### 2. Unseparated Pairs (Blind Spots of this Tree)
  This instrument fails to separate the following pairs. To distinguish them, you would need additional questions:
  *   **Contextualism vs. Relativism:** Both land on **Leaf 4** (Semantic Shift + Retrospective Disqualification).
      *   *Required Distinction:* **The Assessor Question.** "If I evaluate your past claim *now*, does my current context or your past context determine truth?" (Contextualism = Speaker's context; Relativism = Assessor's context).
  *   **Pragmatic Encroachment vs. Subject-Sensitive Invariantism (SSI):** Both land on **Leaf 8**.
      *   *Required Distinction:* **Terminological.** Often these are the same view labeled differently. To separate them, ask: "Is 'practical adequacy' a *condition* of knowledge (Encroachment) or a *consequence* of knowledge (SSI)?"
  *   **WAM Invariantism (Leaf 2) vs. Institutional Hybrid (Leaf 3):**
      *   *Required Distinction:* **The Source of Norms.** "Is the restriction on assertion due to general morality (WAM) or specific professional constitutions (Hybrid)?"

  ### 3. Diagnosis of Empty Gaps
  *   **Leaf 5 (Fixed-Content Contextualism):** This gap is **Unattractive**. It attempts to keep the semantic flexibility of contextualism without the cost of retroactively falsifying past claims. However, if hidden stakes don't change the standard, the "context" is doing no work, collapsing the view into Invariantism.
  *   **Leaf 7 (Metaphysical Expressivism):** This gap is **Incoherent**. It claims knowledge is a real metaphysical relation (Metaphysical Shift) but denies we can assess it retrospectively (Incoherent). If it is a real relation in the world, it should be temporally stable enough to be assessed.

  ### 4. Special Note on the Institutional Hybrid (Leaf 3)
  This view is distinct because it answers **"No"** to the Bridge Case for *private belief* but **"Yes"** for *public certification*. It is not strictly Invariantist because it admits stake-sensitivity in epistemic practices, just not in the psychology of the believer. This is a fruitful area for students interested in **Social Epistemology** or **Professional Ethics**, as it avoids the metaphysical baggage of Encroachment while acknowledging the reality of professional risk.

  ---

  ## Instructor's Guide for Discussion
  1.  **Start with Split 1:** Most students will intuitively feel stakes matter. Push them on *why*. Is it that they feel less sure (Psychological), or that they literally know less (Epistemic)?
  2.  **Test Split 3 (Retrospective):** This is the "trap." Many Encroachers balk at the idea that hidden past stakes destroy past knowledge. If they balk, they may be closer to Invariantism or a "Subjective Encroachment" view.
  3.  **Explore Split 4 (Distributed):** This is the most modern question. Use the "Climate Change" or "Big Data" analogy. If an algorithm processes data that contributes to harm, does the programmer *know* the code is safe? This forces a choice between Internalism (Leaf 8) and Externalism (Leaf 9).
  4.  **Caution on Consensus:** Remind students that **Leaf 1 (Strict Invariantism)** is still a viable, defensible position. It is not "refuted" by intuitions about the bridge; it simply explains those intuitions as errors about *assertion* rather than *knowledge*.
