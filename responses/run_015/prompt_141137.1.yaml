answer: |-
  In a small architecture firm, Jordan repeatedly interrupts Alex during client pitches, reframing Alex's ideas as joint discoveries. Individually, each looks like collaboration; over six months, Alex's portfolio lacks lead credit. Honor, dignity, and victimhood cultures all agree this undermines Alex. An honor-oriented Alex demands a public correction from Jordan directly. A dignity-oriented Alex files a formal grievance regarding credit protocols. A victimhood-oriented Alex documents the pattern and circulates it to partners to mobilize support. The grievance channel is fair but slow; during the review, Alex loses two bids. If Jordan were the aggrieved party employing these same cultural repertoires against Alex, the structural divergences in response would remain identical despite the reversed roles.

  | culture | first_move | counts_as_wrong | currency | success_condition | strongest_line | cost_here |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Honor** | Direct confrontation | Status insult acknowledged | Reputation | Public concession | Restores agency immediately | Risks partnership toxicity |
  | **Dignity** | File formal grievance | Rule violation proven | Equal standing | Procedural resolution | Prevents escalation/feuds | Delayed justice, lost bids |
  | **Victimhood** | Mobilize audience | Oppressive pattern validated | Moral status | Group validation/sanction | Highlights power imbalance | Polarizes team, labels Alex |

  The cumulative, deniable nature of the injury is the engine. If this were a single loud insult, the harm would be instantaneous; Dignity's procedural delay wouldn't compound the damage. Here, the harm *is* the ongoing ambiguity, so the Dignity channel's slowness structurally extends the injury even if it eventually rules in Alex's favor.

  A Dignity defender would object that direct confrontation or audience mobilization risks permanent factionalism, destroying the firm to save one project. This lands on institutional stability but fails on individual justice; it sacrifices Alex's career trajectory to preserve organizational peace.

  Regarding the framework: Campbell and Manning's typology is descriptive, not prescriptive. Claiming Dignity is morally superior or that Victimhood is merely "reverse Honor" is contested among sociologists. I am extrapolating from ideal types; actual actors often mix repertoires. The moral ranking of these cultures remains an open philosophical question, not a settled sociological fact.
