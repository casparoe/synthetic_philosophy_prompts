  I'm pitching a four-month independent stipend to write an essay on why promises bind, and I need it turned into a tight one-page proposal. My half-baked angle: the standard trio — will theories, expectation theories, practice theories — all treat the promisee's position as static, like the obligation just lands on the promisor. I want to frame promises instead as updates to a shared 'normative scoreboard' where binding comes from an asymetric revisability cost: the promisee takes on reliance-costs that restructure their planning, and that creates a structural 'revision debt' for the promisor that isn't just guilt or social sanction. The core question: is this just a redescription of Scanlon-style expectation damage, or does it pick out a distinct mechanism?

  Write the proposal with the exact question sharpened, why the existant answers leave this genuinely open, a month-by-month plan (formalize the scoreboard, stress-test against coerced promises and third-party reliance, check if it collapses back into standard views), what success looks like versus failure (e.g. if it can't distinguish breaking a promise from ordinary letting-down), and an honest scope check — can this actually be done in four months with no empirical fieldwork? Don't include a bibliography or citation list, I'll fill in referances myself. No verbatim quotes from real texts unless you fetch them; paraphrase is fine. Keep it casual, a typo or two is ok.

  End the whole thing with a single line starting Verdict: followed by a one-sentence summary of the proposal's central claim.
