answer: |-
  **Proposal: The Revision Debt**

  **The Problem**
  The standard trio of promissory theories—will, expectation, practice—all treat the promisee's position as static. They assume the obligation lands on the promisor instantly, like a package delivered. This ignores the dynamic mechanics of planning. My working hypothesis is that promises function as updates to a shared normative scoreboard. The binding force isn't just internal guilt or social sanction; it's a structural revision debt. When a promisee relies, they restructure their planning landscape. Reversing that creates a cost asymmetry: the promisee paid the restructuring cost, so the promisor owes a debt to cover the revision.

  **The Core Question**
  Is this just Scanlon's Principle of Fidelity dressed up? Scanlon argues we violate a principle if we induce expectations and then disappoint. My model argues the obligation comes from the *structural inertia* of the promisee's new plan, not just the violation of expectation. Existant answers leave this open because they focus on the *source* of the duty rather than the *temporal mechanics* of reliance. They treat reliance as evidence of harm, not the engine of the obligation itself.

  **Work Plan (4 Months)**
  *   **Month 1:** Formalize the scoreboard. Define "normative status" and "revision cost" without slipping into economics.
  *   **Month 2:** Stress tests. Coerced promises (does reliance create debt if the promise was forced?). Third-party reliance (can a bystander restructure planning based on my promise to you?).
  *   **Month 3:** The Collapse Check. Rigorous comparison against Scanlon and Sheinman. If "revision debt" equals "expectation damage," the project fails.
  *   **Month 4:** Drafting the essay.

  **Success vs. Failure**
  Success looks like distinguishing breaking a promise from merely letting someone down (e.g., failing to help a stranger). If the model shows a structural difference in the normative debt, we win. Failure is if the "scoreboard" is just a metaphor for feeling bad about disappointing someone.

  **Scope Check**
  This is conceptual analysis. No empirical fieldwork needed. Four months is tight but feasible for a single essay if I avoid getting stuck in meta-ethics. The risk is scope creep on the scoreboard formalization, but I'll keep it minimal.

  Verdict: Promissory obligation arises not from the act of willing, but from the asymmetric cost of reversing the promisee's restructured planning.
