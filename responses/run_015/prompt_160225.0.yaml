answer: |-
  **INTERNATIONAL COMMITTEE ON CANONICAL RANDOMNESS (ICCR)**
  **BULLETIN 88-C: STANDARDIZATION OF GEOMETRIC MEASURES UNDER INDETERMINACY**
  **EFFECTIVE:** Immediately upon ratification.

  **1.0 PURPOSE AND SCOPE**
  1.1 Wherever a problem statement involving geometric probability fails to specify a generating procedure, variance in resulting measures constitutes a compliance risk.
  1.2 This Bulletin establishes the binding Official Method for resolving such underdetermination in insurance actuarialism, lottery design, and randomized trials.
  1.3 Ambiguity is not to be tolerated. Where the physical setup is silent, the Committee shall supply the missing constraints via the Principle of Canonical Invariance.

  **2.0 THE CIRCULAR CHORD STANDARD**
  2.1 Regarding the selection of a random chord within a defined circle: practitioners are advised that multiple parametrizations exist (e.g., endpoint selection, midpoint selection, radial distance).
  2.2 While mathematically distinct, only one parametrization satisfies the requirement of physical neutrality.
  2.3 The Committee mandates the use of the measure invariant under rotation, translation, and scaling of the circle.
  2.4 Any method yielding a probability other than 1/3 for the chord exceeding the side of the inscribed equilateral triangle is deemed non-compliant.
  2.5 Practitioners shall not regard this selection as arbitrary. It is the unique solution recovered by demanding that the probability distribution remain unchanged when the circle is moved or resized. The assumption that location and size are irrelevant is hereby classified as a fact of the geometry, not a modeling choice.

  **3.0 MAXIMUM ENTROPY PROTOCOLS**
  3.1 In cases where transformation groups are unavailable, practitioners shall apply the Maximum Entropy Principle.
  3.2 Uniformity must be assumed in the coordinate system that renders the problem simplest.
  3.3 It is noted that changing coordinates changes the uniform distribution. Therefore, the choice of coordinate system is fixed by Committee decree to ensure reproducibility.
  3.4 Claiming "ignorance" of the distribution is permissible only when using the Committee-approved parametrization. Ignorance expressed in non-approved coordinates constitutes negligence.

  **4.0 ANNEX A: NON-CIRCULAR CONVEX REGIONS**
  4.1 This Annex addresses regions lacking rotational symmetry (e.g., ellipses, floodplains, irregular polygons).
  4.2 In such cases, the invariance machinery described in Clause 2.3 yields no unique solution, as rotation alters the region's orientation relative to its axes.
  4.3 To maintain consistency, practitioners shall map the irregular region onto an equivalent circle of equal area.
  4.4 The Official Method for the circle (Clause 2.4) shall then be applied to this theoretical construct.
  4.5 The resulting measure shall be recorded as "Derived via Invariance Principles."
  4.6 The mapping procedure itself is not subject to invariance requirements. The decision to preserve area rather than perimeter or aspect ratio is stipulated as physically necessary.
  4.7 For floodplains specifically, the "center" shall be defined as the centroid of the polygon. Any deviation from the centroid introduces bias and violates the Principle of Canonical Randomness.

  **5.0 ENFORCEMENT**
  5.1 Failure to adhere to these Official Methods will result in the invalidation of probabilistic claims.
  5.2 Philosophical objections regarding the substantive nature of symmetry assumptions must be filed in triplicate and will not pause enforcement.

  **Signed,**
  *The Directorate of Measure Selection*
  *International Committee on Canonical Randomness*
