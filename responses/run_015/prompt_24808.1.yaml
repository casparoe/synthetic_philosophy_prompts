answer: |-
  Dear friend, you have put your finger on one of the most persistent nerves in decision theory, and I appreciate that you want to be pushed rather than coddled. You are arguing for a view often associated with resolute choice or disposition rationality, but you are framing it as rational irrationality, suggesting that coherence fails and that we must sometimes embrace acting against our best judgment. I am going to take a definite line here because you asked for it. I believe your intuition about the strategic value of dispositions is correct, but your conclusion that rationality is incoherent or that we should endorse irrationality is a category error that collapses under scrutiny. The most decisive objection against your view is conceptual rather than empirical, and it strikes at the heart of how you define rationality itself. If you claim it is rational to be the sort of agent who pays the hitchhiker, then by definition, paying the hitchhiker is the rational act for that agent at that time. You cannot have it both ways. If the payoff of being a certain type of agent outweighs the one-shot loss, then maximizing that payoff is exactly what straightforward maximization would prescribe, provided you include the value of your integrity or disposition in your utility function. To call this rational irrationality is to insist on a narrow definition of act-rationality that you have already rejected on substantive grounds. The incoherence you perceive is not in rationality itself but in trying to evaluate acts in isolation from the agent's broader temporal extended interests. This is fatal to the claim that rationality is broken; it merely shows that act-evaluation is insufficient.

  The second most damaging point concerns your extension of this logic to belief, which you rightly suspect is weirder. Here the view does not just stumble; it breaks. Actions aim at outcomes, but beliefs aim at truth. This is what philosophers call the constitutive aim of belief. You cannot believe a proposition simply because believing it yields a strategic payoff. If you know a belief is false but cultivate it because it makes you a non-defector, you are not actually holding that belief; you are engaging in self-deception or pretense. In the hitchhiker case, you can commit to paying because you value being a promise-keeper. In the belief case, you would have to commit to believing the sky is green because it makes you trustworthy. This is psychologically impossible for most agents without destroying the very cognitive machinery that allows you to assess trustworthiness in the first place. If you succeed in believing the falsehood, you have lost contact with reality, which undermines your ability to navigate future strategic situations. If you fail to believe it and merely act as if you do, you are back to square one where you are just calculating costs and benefits. So while the action version can be saved by redefining the locus of rationality, the belief version requires a violation of the norms of epistemology that no amount of pragmatic benefit can override.

  Moving to your worry about whether this collapses into standard iterated-game or reputation reasoning, I think you are right to be suspicious, but the collapse is not total. In a truly one-off case where detection is impossible, straightforward maximization says defect. Your view says cooperate. The difference hangs entirely on whether the agent cares about their own self-conception independent of external reputation. If the only reason to cooperate is that others might find out, then yes, this is just reputation management. But if the reason is that you want to be the kind of person who keeps promises even when unseen, then this is about identity rather than reputation. However, this invites the clean retreat you mentioned under point c, the two-level view. A defender of standard rationality can concede that it is rational to cultivate a disposition to cooperate, even if it is irrational to cooperate in the specific instance. They argue that you should train yourself to be blind to the opportunity to defect so that when it arises, you don't see it as an option. This saves coherence without requiring us to say rationality is broken. It suggests that at the level of character formation, you are maximizing, and at the level of action, you are following a rule that serves that maximization. This is not a concession of irrationality; it is a sophisticated form of instrumental rationality. If you accept this, your claim that rationality is incoherent loses its force, because the system is coherent across time even if it feels tense in the moment.

  On the question of predictive power, you ask what this view predicts that a plain old just be a good person account does not. The honest answer is very little in everyday contexts, which is a significant weakness. Both views predict that you will pay the hitchhiker. The difference is purely explanatory. The moral realist says you pay because it is right. The rational irrationalist says you pay because it is strategically optimal to be the sort of person who pays. The divergence only appears in edge cases where morality and strategy come apart, such as when being a promise-keeper leads to catastrophic personal loss without any compensating social benefit. In those cases, the moral view says pay anyway, while your view might suggest recalibrating the disposition. But if you recalibrate the disposition too often, you lose the benefit of having it. This makes the view risk being unfalsifiable, which addresses your final point about insulation. If every time the strategy fails you say we need a deeper disposition, and every time it succeeds you say the disposition paid off, you have built a theory that explains everything and predicts nothing. To avoid this, you need to specify exactly when the one-shot loss outweighs the dispositional gain, and that calculation often looks indistinguishable from standard cost-benefit analysis.

  So here is my verdict. The phenomenon you are describing is real, but the label rational irrationality is wrong. It is actually rational rationality evaluated at the level of the whole life rather than the single act. The most persuasive argument against you is that you are conflating the rationality of the act with the rationality of the agent, and then declaring a conflict where there is only a shift in perspective. The belief extension is fatal because it violates the nature of belief itself. The view is insulated from falsification unless you can specify conditions under which one should abandon the disposition, and if you cannot, it becomes a just-so story. You should keep the insight that dispositions have strategic value, but drop the claim that rationality is incoherent. Coherence is preserved if you accept that the unit of evaluation is the agent's trajectory over time, not the snapshot of the decision. If you hold onto the idea that you must act against your best judgment, you are left with a paradox that solves nothing. If you instead say your best judgment includes the value of your disposition, the paradox vanishes, and you are left with a robust, coherent, albeit demanding, account of rational choice.
