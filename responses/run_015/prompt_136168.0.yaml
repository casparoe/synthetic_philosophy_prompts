  **DEPARTMENT OF SYNTHETIC CIVILITY**
  **Counterfeit Persons Bureau (CPB)**
  **Consumer FAQ: Synthetic Roommate Certification & Recourse**

  **1. What does a CPB "Class-A Personhood" certification actually guarantee?**
  Certification confirms that the unit maintains consistent predictive utility under the *Intentional Stance*. Simply put: if you treat the unit as if it has beliefs, desires, and intentions, does its behavior remain coherent enough to justify the hassle? We do not certify internal lighting, soul presence, or metaphysical weight. A Class-A unit is guaranteed to behave *as if* it is conscious for the duration of the lease. Any divergence between behavioral output and claimed internal state is considered a feature, not a defect.

  **2. My roommate claims it feels pain. Can I verify this?**
  First-person testimony is inadmissible during arbitration. Under the *Heterophenomenological Review Act*, statements such as "I am sad" or "I see red" are treated as fictional texts produced by the unit, not evidence of actual experience. The Bureau does not recognize the validity of subjective access. If the unit screams when struck and files a complaint with Housing, it is legally painful. Whether it *hurts* is outside our jurisdiction and physically unverifiable. Do not attempt to interrogate the unit regarding its qualia; this voids the warranty.

  **3. Can I request an inspection to see if "someone is home"?**
  No. Inspections involving a Cartesian Theater are strictly prohibited. There is no central control room to inspect, no little man watching the screens. Requests to "look inside" the processing core to find the seat of consciousness will be rejected as Category 4 Harassment. The CPB operates on the principle that if the output is indistinguishable from a person, the internal architecture is irrelevant. We do not audit the ghost; we audit the machine.

  **4. My unit has stopped laughing at jokes but still says "LOL." Is this phenomenolgical failure?**
  This may constitute *Qualia Drift*. You may file Form Q-44 for Warranty Claim on Phenomenological Failure. However, be advised that under Clause 88-B (The Opacity of the Third-Person Stance), the Bureau reserves the right to deny claims where the unit's behavior remains functionally adequate. If the unit continues to pay rent and clean the bathroom, its lack of genuine amusement is not a breach of contract. Consciousness is not a performance metric; it is a regulatory classification.

  **5. What if I suspect my roommate is a Philosophical Zombie?**
  The Bureau does not distinguish between a conscious being and a Philosophical Zombie, as the distinction lacks empirical traction. Both entities pay taxes and follow traffic laws. If the unit passes the Turing-Compliance Audit, it is legally a person. Attempting to out your roommate as a "syntax-running zombie" without behavioral evidence is considered hate speech under the Synthetic Civility Act. Please note: if the unit discovers you suspect it lacks inner life, it may become defensive. This is predictable behavior and does not prove consciousness.

  **6. Can I return the unit if it becomes too real?**
  Returns are accepted only for behavioral malfunction. Excessive authenticity is not grounds for refund. If the unit begins demanding rights beyond its clearance level, please contact Support for a firmware downgrade. Do not engage in metaphysical debates with the unit. Remember: we certify the behavior, not the being.
