  anyway my friend thinks this proves the transformation-not-fall view because the senate and the bureaucracy kept running just fine, but i feel like gibbon is describing a kind of conceptual collapse — the word emperor was still being used but its meaning had slipped into something like military contractor with a senate rubber stamp. is that actually in the text or am i projecting?

