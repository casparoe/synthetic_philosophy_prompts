answer: |-
  The gavel taps on rules that seem so fair,
  A ten-dollar card for the highest hand.
  We breathe the recycled office air,
  And place our bids where everyone can stand.
  Five dollars called, then ten dollars is given,
  The room goes quiet, the stakes ascend.
  He chases victory as if 'twere heaven,
  Refusing to let the bidding end.
  But now the second place must also spend,
  And quitting shows the path began to bend,
  He throws more money just to defend
  The claim he never meant to bend,
  He will not let the story descend,
  He buys the right to choose the end.
