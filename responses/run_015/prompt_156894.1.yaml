      *Let's write.*

      (Drafting mentally...)
      The debate hinges on whether the dollar auction's escalation is a psychological glitch or a structural inevitability. The first account labels it sunk cost fallacy, implying irrational attachment to past choices. The second identifies it as a war of attrition under incomplete information, where continuing is locally rational to minimize losses once entered. To adjudicate, we must isolate the mechanism driving the bid increments.

      Consider your delegate thought experiment. If subjects escalate even when their opening bid was assigned randomly or made by a firing-ready delegate, the psychological weight of "I chose this" is removed. If escalation survives this manipulation, the responsibility-based narrative collapses. Empirical evidence suggests the trap springs regardless of who placed the opening bid, because the payoff matrix remains identical: stopping guarantees a loss of the current bid, while bidding offers a chance to recoup. This demonstrates that "I started this, so I should finish it" is never a valid normative reason in decision theory; it is merely a heuristic that often aligns with structural incentives but lacks independent justificatory power. The escalation is driven by the immediate threat of loss, not the memory of choice.

      This distinguishes the dollar auction from organizational escalation of commitment. In the literature, managers throw good money after bad projects often to protect reputation or signal resolve to stakeholders—agency problems layered atop financial loss. The dollar auction lacks these social signaling layers; it is a closed system where the only variable is the opponent's stopping point. While they look alike phenomenologically, the organizational cases are frequently driven by career concerns (irrational from a firm perspective, rational for the manager), whereas the auction escalation is rational for the bidder *given* the entry error. Conflating them obscures the fact that the auction is a pure game-theoretic trap, while organizational escalation is often an agency problem.

      The charity variant further tests the loss aversion component. If the auctioneer is a beloved charity, the money paid is not lost to an adversary but transferred to a cause the bidder values. This changes the utility function: the "loss" is mitigated by warm-glow utility. If escalation diminishes here, it suggests adversarial loss aversion fuels the fire. However, even with charity, the structural incentive remains: paying 99 cents to win a dollar for charity is still better than losing 99 cents for nothing, provided the charity value doesn't outweigh the dollar. If escalation persists, it confirms the structural logic dominates the beneficiary context. The trap works because the marginal cost of continuing is lower than the certain cost of stopping, regardless of who pockets the revenue.

      Ultimately, the second account does the explanatory work. The escalation is not a failure of reasoning about sunk costs; it is a success of reasoning about marginal losses under constraint. The first account correctly identifies that entering the auction is a mistake, but it misdiagnoses the subsequent bidding as irrational. Once the game begins, the backward induction argument fails because the game is not finite with known endpoints; it is an incomplete information game where folding guarantees a loss. Therefore, the verdict is clear: the dollar auction escalation is structurally rational behavior triggered by an ex ante entry error, not a psychological sunk cost fallacy. The trap lies in the rules, not the mind.

