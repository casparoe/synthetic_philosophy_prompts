      1.  Intro: The tension between sunk cost (irrational) and war of attrition (rational ex-post).
      2.  Delegate Test: If escalation persists without personal opening bid, "ownership" is irrelevant. The payoff matrix drives behavior. "I started this" is never a normative reason.
      3.  Org Lit: Dollar Auction is pure structure; Org escalation is often agency/reputation. They are distinct mechanisms.
      4.  Charity: Changing beneficiary alters utility but not the structural trap. If escalation persists, structure wins.
