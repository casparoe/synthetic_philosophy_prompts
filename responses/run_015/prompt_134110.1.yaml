      *   **Questions:** What's the implicit philosophy? Is standing a moral cleanliness score or tied to being specially affected? Reconstruct the theory the practice needs. Is it coherent across contexts? What would shift if standing depended solely on being wronged/institutional role (not personal purity)?
      *   **Constraints:** Under 250 words. Ideally one tight paragraph.

  2.  **Deconstruct the Implicit Philosophy:**
      *   Current practice suggests standing is a form of *moral authority* derived from consistency (integrity) rather than just harm or role. It treats blame as a performative act requiring the blamer to embody the norm.
      *   Coherence: It's inconsistent. In public discourse, hypocrisy often kills the message (tu quoque). In strict moral philosophy, the truth of the charge stands regardless of the accuser. The practice mixes *epistemic credibility* with *moral permission*.
      *   Shift: If standing depended solely on being wronged or institutional role, personal purity becomes irrelevant. The focus shifts from the *blamer's virtue* to the *violation itself* or the *relationship between parties*.

  3.  **Drafting - Attempt 1 (Mental Outline):**
      The implicit theory treats standing as moral license earned through consistency, not just harm. It assumes blame is a ritual requiring the blamer to embody the norm, making hypocrisy a disqualifying vice rather than a logical fallacy. This isn't coherent across contexts; seminars treat it as authority loss, while logic treats it as irrelevant. If we shifted to standing based solely on being wronged or institutional role, personal purity wouldn't matter. A hypocrite could still blame if harmed or authorized. This changes blame from a virtue signal to a corrective mechanism. We'd stop auditing the accuser and focus on the accused. The shift moves from "who are you to say?" to "was the rule broken?"

  4.  **Refining and Condensing (Targeting <250 words, 1 paragraph):**
      The implicit theory treats standing as *moral authority* contingent on integrity, not merely jurisdiction. It assumes blame is a performative assertion of normativity that requires the blamer to embody the rule; hypocrisy forfeits this authority because it undermines the norm's validity through inconsistent endorsement. This practice is incoherent across contexts: seminars treat hypocrisy as disqualifying (losing standing), while logical analysis treats it as irrelevant (substance remains). The current model conflates *epistemic credibility* with *moral permission*.

