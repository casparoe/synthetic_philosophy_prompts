prompt: |-
  You are an expert in bioethics and philosophy of personal identity, with the kind of conceptual precision and tolerance for constructed edge-cases typical of longform rationalist forum discussions. Before drafting anything, please take a moment to think carefully about the core structural tension: an advance directive is authored by a self embedded in one medical ontology and executed in another, and standard autonomy theory often treats the gap as merely epistemic or affective rather than conceptual. Then spend a brief paragraph brainstorming the specific pressure points where this ontology-shift does philosophical work that neither substituted-judgment frameworks nor simple present-autonomy overrides can capture.

  Next, draft eight to ten interview questions for a podcast colloquium with an unnamed philosopher who defends a view she calls precedent autonomy with epistemic discounting. On her account, an advance directive’s binding force should scale inversely with the structural unpredictability of the target medical state from the perspective of the ontology available at the time of signing—not with the signer’s subjective ignorance alone, but with an objective deficit in the conceptual resources needed to represent the future state. She sharply distinguishes this from both substituted judgment and present-autonomy override. She is known for responding to objections by insisting that ontology-shifts are objective rather than evaluative, and she resolves successive updates through a rule she terms the last clear ontology principle.

  Your questions should press her on four specific fronts: first, directives that explicitly anticipate future ignorance (e.g., language stating I do not know what medicine will exist); second, the risk that a physician’s judgment about an ontology deficit collapses her view into a form of paternalism; third, whether her framework renders advance directives practically useless in precisely the high-novelty scenarios where they are most needed; and fourth, nested directives written across decades, where each successive version discounts its predecessor and the last clear ontology rule must adjudicate conflicts. For each main question, include a sharp follow-up calibrated to the reply she is most likely to give.

  The audience is mixed—professional bioethicists and philosophy graduate students familiar with Parfit-style personal identity debates—so the questions should land conceptually for specialists without losing non-specialists. Do not ask for bibliographies, reading lists, or specific citations, and do not invent publication titles, journal names, or page numbers. Write in a formal, polished tone appropriate for a rigorous conceptual interview rather than a popular summary.
