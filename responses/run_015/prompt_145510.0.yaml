answer: |-
  This is a sharp distinction you've uncovered, and your intuition about the tension is correct: you are wrestling with the difference between **backward-looking blame** and **forward-looking repair**.

  However, there is a crucial adjustment needed in how you are mapping Jaspers. If you want to use his framework rigorously for your feature, you need to know that **Jaspers' "metaphysical guilt" does not morph into "institutional guilt."** In fact, they are orthogonal.

  Here is the breakdown of why they are different, where the "Institutional Inheritance" concept actually fits in Jaspers' schema, and how to name the tension you're feeling.

  ### 1. Correcting the Jaspers Map
  In *The Question of German Guilt* (1947), Jaspers is very specific about who bears what.
  *   **Criminal:** Individual (perpetrators).
  *   **Political:** **Collective** (all citizens). This is liability for the actions of the state. It ends with reparations or loss of sovereignty.
  *   **Moral:** Individual (conscience).
  *   **Metaphysical:** **Individual** (solidarity before God).

  **The Crucial Correction:** You suggested metaphysical guilt might become institutional guilt if you strip the emotion. It doesn't. Jaspers explicitly argues metaphysical guilt *cannot* be politicized. It is the guilt of the survivor who asks, "Why am I still here?" It is existential, not structural.

  The concept you call "Institutional Inheritance Guilt" is actually a modern evolution of Jaspers' **Political Guilt**, stripped of the requirement for *consent*.
  *   **Jaspers' Political Guilt:** Requires that you are a citizen and therefore co-responsible for the state's acts.
  *   **Institutional Inheritance:** Requires only that you inhabit a structure built on past wrongs, regardless of consent.

  ### 2. Mapping the Comparison

  | Feature | Jaspers' Framework (Political/Metaphysical) | Institutional Inheritance (Structural Justice) |
  | :--- | :--- | :--- |
  | **Source of Obligation** | **Identity & Citizenship.** You are liable because you belong to the polity that acted. | **Structure & Benefit.** You are liable because the institution you inhabit is built on unjust foundations. |
  | **Time Orientation** | **Backward-looking.** Focused on adjudicating what *was* done. | **Forward-looking.** Focused on fixing what *is* broken. |
  | **The "Guilt" Label** | **Embraces "Guilt" (Schuld).** Admits a stain, even if collective. | **Avoids "Guilt."** Prefers "Responsibility," "Liability," or "Debt." |
  | **Mechanism** | **Atonement.** Requires inner change (metaphysical) or reparations (political). | **Restructuring.** Requires dismantling the power dynamic, not just paying a bill. |
  | **Who Bears It?** | **Citizens** (Political) or **Souls** (Metaphysical). | **The State as a Continuum.** The institution itself is the debtor. |

  ### 3. Are They Actually Different?
  **Yes.** They break down differently because they answer different questions.

  *   **Jaspers asks:** "How do we live with ourselves after this evil?"
      *   *Answer:* By accepting political liability and undergoing metaphysical transformation.
  *   **Institutional Theory asks:** "How do we stop the harm from continuing?"
      *   *Answer:* By acknowledging the structure is tainted and owes repair, regardless of who is currently running it.

  If you strip the emotion from Jaspers' metaphysical guilt, you don't get institutional guilt; you get **nihilism**. Metaphysical guilt is *only* the emotion/spiritual burden. Without that, the category ceases to exist.

  The "Institutional Inheritance" idea is closer to the political philosopher **Hannah Arendt's** concept of *Collective Responsibility* (which she distinguished from guilt) or **Iris Marion Young's** *Social Connection Model*. It argues that we are responsible for structures we participate in, even if we didn't build them.

  ### 4. Which One Argues for National Guilt 50 Years On?
  This is the crux of your feature.

  **Jaspers fails at the 50-year mark for the *Nation*.**
  Jaspers' *Political* guilt relies on the continuity of the state. If Germany in 1990 claims it is a "new democracy" distinct from the Reich (which it did), Jaspers' framework allows them to argue the political guilt has been discharged via sovereignty transfer and reparations. His *Metaphysical* guilt survives 50 years later, but *only in the individual*. You cannot put a nation on trial for metaphysical guilt.

  **Institutional Inheritance succeeds at the 50-year mark for the *State*.**
  This framework argues that the *institution* is the guilty party, not the people. As long as the laws, wealth distribution, or power hierarchies remain legible descendants of the original wrong, the debt remains. It bypasses the "no one alive did it" defense by saying, "The machine is still running on the fuel you provided."

  **Verdict:** If you want to argue the **Nation** is guilty (or liable), **Institutional Inheritance** is the stronger tool. Jaspers protects the collective from eternal moral staining; Institutional theory binds the collective to eternal structural repair.

  ### 5. Naming the Tension
  You wrote: *"Jaspers gives you accountability without collective blame, while the other gives you collective obligations without anyone being guilty."*

  That is excellent. To sharpen it for your piece, I would name the tension: **"Moral Stain vs. Structural Debt."**

  *   **Moral Stain (Jaspers):** Implies a corruption of the soul or the polity. It demands apology and memory. It is hard to legislate.
  *   **Structural Debt (Institutional):** Implies an imbalance of power and assets. It demands policy and redistribution. It is easier to legislate but harder to feel.

  The friction is that **Stain without Debt** leads to performative apology (we feel bad but change nothing). **Debt without Stain** leads to technocratic reparations (we write checks but admit no wrong).

  ### 6. Where Each Breaks Down
  For your feature, you need the failure points.

  **Where Jaspers Breaks:**
  *   **The "Zero Hour" Loophole:** If a country declares itself a "new regime" (e.g., post-apartheid South Africa or post-dictatorship Chile), Jaspers' *Political* guilt can be voided. The state can say, "That wasn't us."
  *   **The Metaphysical Privatization:** By making metaphysical guilt individual, Jaspers lets the *culture* off the hook. A nation can be full of individuals feeling metaphysical guilt while the state remains unchanged.

  **Where Institutional Inheritance Breaks:**
  *   **The Attenuation Problem:** After 50 or 100 years, the causal link between the specific wrong and the specific current structure gets blurry. (e.g., "Does this specific tax code really stem from 19th-century colonialism?").
  *   **The Democratic Deficit:** It imposes obligations on new citizens who had no say in the past *and* no say in the current structure. It risks treating citizens as mere carriers of state debt rather than agents.

  ### Summary for your Feature
  You aren't looking at the same idea through different lenses. You are looking at two different mechanisms.
  *   **Jaspers** is about **cleansing the conscience** (which expires or becomes private).
  *   **Institutional Inheritance** is about **balancing the ledger** (which persists as long as the bank exists).

  If your argument is that countries *can* be guilty 50 years on, you must abandon Jaspers' definition of guilt (which requires agency/blame) and adopt the Institutional definition of **liability** (which requires continuity/benefit). The semantic shift from "Guilt" to "Debt" is the only way to make the argument hold water legally and politically.
