      *   *Occlusion:* Occlusion isn't inference; it's lack of data. Inference is using $p$ to get $q$. A better map for inference in vision is *Semantic Segmentation* or *Scene Graphs*. If I identify "Dog", I implicitly identify "Animal". If the system labels "Dog" but fails "Animal", it's a bad ontology, not a feature of vision.
      *   *Identity Switch:* This actually supports the idea that Sensitivity is hard to satisfy. But does it support anti-closure? If I lose track of specific ID, I might still track "Some car is here." This suggests closure *holds* for weaker propositions.

