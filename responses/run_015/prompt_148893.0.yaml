      *   *Better Analogy:* A **Bayesian Filter (Particle Filter)** or a **Constraint Satisfaction Problem**.
          *   *Why:* These deal in probability distributions over state spaces. If $p$ is highly probable, and $p \to q$, then $q$ must be at least as probable. You cannot update the probability of $p$ without updating $q$.
          *   *Implication:* This reveals that Nozick's conditions (Sensitivity) are incompatible with probabilistic coherence. You can't separate Nozick from Closure without breaking the logic of the system. The "Tracking" metaphor is seductive but misleading because it treats knowledge as a *relation to an object* rather than a *state of a system*.

  7.  **Refining the Argument (Self-Correction/Nuance):**

