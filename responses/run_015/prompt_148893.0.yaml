          4.  If $p$ were true, $S$ would believe $p$ (Adherence/Safety-ish).
      *   **Closure Problem:** $p \to q$. I track $p$ (sensitive to $\neg p$). But $q$ might be a necessary truth or a logical consequence that I would believe anyway (e.g., "I am not a brain in a vat"). If $q$ were false, I might still believe it (insensitive). So I know $p$, but not $q$. Hence, closure fails.

  3.  **Analyze the Drone/Computer Vision Analogy:**

      *   *Classmates' view:* Tracking is local. Locking onto Target A doesn't mean locking onto "Target A or B".
      *   *User's extension:* Occlusion (inference?), Prediction (continuity?), Identity Switches (nearby worlds?).

  4.  **Drafting the Audit (Task 1 & 2):**

      *   *Correspondence Table:*
          *   Target Object $\leftrightarrow$ Fact $p$.
          *   Lock/Track $\leftrightarrow$ Belief $B(p)$.
          *   Object Presence $\leftrightarrow$ Truth of $p$.
          *   Loss of Lock on $\neg p$ $\leftrightarrow$ Sensitivity (Var 3).
          *   Re-acquisition on $p$ $\leftrightarrow$ Adherence (Var 4).
          *   Occlusion $\leftrightarrow$ Inferential Knowledge / Deduction.
          *   Identity Switch $\leftrightarrow$ Skeptical Scenarios / Nearby Error.
          *   Predictive State $\leftrightarrow$ Belief maintenance without evidence.

      *   *Tight Mappings:* Sensitivity is very much like a lock that breaks when the target leaves the frame. It captures the counterfactual dependence well.
      *   *Broken Mappings:*
          *   *Logic vs. Physics:* Drones track physical continuities. Logic tracks necessary relations. If $p$ entails $q$, $q$ *cannot* be false if $p$ is true. A drone can track A while losing B (if B moves independently). But if $q$ is a logical consequence, it doesn't "move independently."
          *   *Occlusion/Inference:* In vision, occlusion breaks the visual link. In logic, deduction *preserves* the link. If I track $p$, and $p \to q$, the "signal" for $q$ is guaranteed by $p$. The drone analogy suggests the signal for $q$ might be lost, which misrepresents logical entailment.

  5.  **Evaluating the Technical Extensions (Task 3):**

      *   *Predictive Tracking (Kalman Filters):* When the target is occluded, the tracker *predicts* where it is based on velocity vectors.
          *   *Epistemic Map:* This looks like deduction. I can't see $p$ directly, but I infer it from prior states.
          *   *Impact on Closure:* If the tracker maintains the ID through occlusion using a model, it implies a form of *closure* within the system's internal logic. If the system knows "Target is moving East at 5m/s" ($p$), it implicitly knows "Target will be at X in 2s" ($q$). If the system fails to tag $q$ because it's occluded, that's a system failure, not a feature. This *undermines* the anti-closure claim. It suggests that a robust tracker *should* propagate the track ID to logical consequences (predicted positions).
      *   *Identity Switches:* Two similar objects cross. Tracker swaps IDs.
          *   *Epistemic Map:* This is the "Nearby Possible World" problem. In world $w_1$, I track $p$. In very similar world $w_2$, I track $q$ (false).
          *   *Impact on Sensitivity:* This shows sensitivity is fragile. But does it help closure? If I know $p$ (no switch), do I know $p \lor q$? Usually, $p \lor q$ is *easier* to track (less sensitive to specific identity). The identity switch problem highlights that specific tracking is hard, but general tracking (closure) is often easier. This reinforces the standard criticism of Nozick: Closure fails because Sensitivity is too strict for $q$, not because tracking is inherently local.

