  4.  **Addressing Specific User Requests:**
      *   "Separate sharing same prior from sharing same information/likelihood." -> Make sure Thesis 1 and 3 handle this.
      *   "Exactly what the theorem requires of common knowledge." -> Thesis 2 must emphasize this.
      *   "Verdict: Trivial tautology, substantive and defensible, or actually false."
