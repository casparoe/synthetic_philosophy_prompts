          *   Relevance: Supports colleague *only if* models are identical in architecture.

      *   *Thesis 2: The Aumann Proper Claim.* (Same Prior + Common Knowledge of Posteriors $\rightarrow$ Identical Posteriors).
          *   This is the actual theorem.
