      *   *Refutation of Alternative:* Bentham was a pragmatist. He knew law and administration. In *Principles of Morals and Legislation*, he discusses the limits of punishment based on enforceability. He wouldn't endorse a calculus that is structurally blind.
      *   *Conclusion:* Bentham demands the machine be opened. Not for rights, but for accuracy.

