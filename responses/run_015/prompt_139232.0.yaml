answer: |-
  # Q&A Prep Sheet: Gödel's Rotating Universes & The Modal Argument

  **Strategy Overview:** Your position is modest (becoming is not *a priori*) but your defense is radical (the Diary Argument). Your vulnerability lies in the gap between *global* causal structure (physics) and *local* temporal experience (metaphysics). Disarm the physicists early by conceding the unphysical nature of Gödel's solution; hold the line with the metaphysicians on the implications of possibility.

  ### Pre-emptive Concession (Make this in the closing remarks of the talk)
  **Say this:** "I want to be clear before we begin: I am not arguing that Gödel's universe is *our* universe. I concede to the relativists that our universe expands, likely has a positive $\Lambda$, and shows no evidence of global rotation. My argument is not that time is unreal *here*, but that if the laws of physics allow a world where becoming is impossible, then becoming cannot be a necessary feature of physical time."
  **Why:** This neutralizes Halloran and the Grad Students' primary "physical relevance" objection before they stand up. It frames the debate as modal, not empirical.

  ---

  ### The Objections (Ordered by Likelihood & Damage)

  #### 1. The Grad Students / Halloran Hybrid: "What Notion of Possibility?"
  **Question:** "You rest the whole modal argument on the physical possibility of Gödel's solution. But 'physical possibility' is doing a lot of work here. If you mean 'mathematically consistent with GR,' that's too weak for metaphysical conclusions. If you mean 'nomologically possible for us,' it's false, since our boundary conditions rule it out. Which modal operator are you using, and why should it constrain the nature of time?"
  **Reply (2 mins):** "I am using nomological possibility relative to the *laws*, not the *boundary conditions*. The field equations are the laws; the specific distribution of dust and $\Lambda$ are initial conditions. If the nature of time depended on the laws alone, it should hold across all solutions. That it doesn't shows time's structure is contingent on the matter distribution. I'm not claiming this world is *our* world, but that it is a *physical* world in the sense of being governed by our best physics. If physics allows it, metaphysics cannot rule it out *a priori*."
  **Concede:** That it is not *our* world (boundary conditions).
  **Stand Firm:** That solutions to the field equations count as physically possible worlds for modal analysis.
  **Soft Spot:** The distinction between "laws" and "boundary conditions" is blurrier in GR than in classical mechanics. Halloran might press on whether $\Lambda$ is a law or a constant.

  #### 2. Halloran: "Stable Causality and Fine-Tuning"
  **Question:** "Gödel's solution is an instability. It requires precise fine-tuning of the cosmological constant against the dust density. In the space of all solutions, chronology-violating regions are measure zero. Why base a metaphysical thesis on a solution that is physically unstable and generically destroyed by small perturbations?"
  **Reply (2 mins):** "Two points. First, instability doesn't entail impossibility; it just entails contingency, which is exactly my thesis. Second, even if this specific solution is unstable, the existence of *any* solution with Closed Timelike Curves (CTCs) in GR proves that the laws do not enforce a global time order. My Diary Argument doesn't require the *whole* universe to be Gödelian, only that a region allows a CTC. If the laws permit CTCs anywhere, becoming is not guaranteed by the physics."
  **Concede:** The solution is likely unstable and fine-tuned.
  **Stand Firm:** That the *existence* of the solution, stable or not, breaks the necessity of global time.
  **Soft Spot:** If Halloran argues that "physical possibility" requires stability (Hawking's Chronology Protection), your modal premise crumbles.

  #### 3. Vance: "Special Relativity Did the Work Already"
  **Question:** "I'm a B-theorist, so I'm happy you're attacking becoming. But why do we need Gödel? Special Relativity already killed absolute simultaneity. The relativity of simultaneity shows there's no privileged 'now'. What does the rotation and the CTCs add to the argument that SR didn't already settle?"
  **Reply (2 mins):** "SR leaves room for a local, frame-dependent becoming, or a 'foliation' view. Many A-theorists retreat to local proper time. Gödel's argument is stronger because it attacks the *topology* of time, not just the simultaneity slices. In Gödel's world, you can't even foliate the manifold into global moments. My Diary Argument pushes this further: it's not just that 'now' is relative, but that 'past' and 'future' can be the same event for a single observer. SR relativizes simultaneity; Gödel relativizes temporal direction."
  **Concede:** SR undermines absolute simultaneity.
  **Stand Firm:** That SR is compatible with some forms of local becoming, whereas Gödel's topology undermines the asymmetry required for *any* robust becoming.
  **Soft Spot:** If Vance argues that local proper time is all the A-theorist ever meant, Gödel's global argument is overkill.

  #### 4. Okonkwo: "Primitivism vs. Order"
  **Question:** "You assume becoming is an order-theoretic notion, something derived from causal structure. But as a presentist, I take passage to be primitive. It's a fundamental feature of reality, not reducible to relations between events. Closed curves mess up the *order* of events, sure, but why does that stop the primitive flow of time? The 'now' can still move along the curve."
  **Reply (2 mins):** "If passage is primitive and unconnected to causal order, it becomes epiphenomenal—it does no work. But our concept of 'future' is tied to 'unfixed' and 'past' to 'fixed'. In the Diary scenario, I hold a record of an event I haven't causally produced yet, but which is already fixed in my past. If the 'now' moves along a CTC, the event is both open and fixed. This isn't just a problem for order; it's a contradiction for the *nature* of passage. If passage is primitive, it must explain why we can't remember the future. In a CTC, we can."
  **Concede:** That presentists define passage differently than reductionists.
  **Stand Firm:** That any coherent notion of passage must respect the asymmetry of epistemic access (memory vs. anticipation).
  **Soft Spot:** Okonkwo may simply deny that epistemic access constrains metaphysical passage.

  #### 5. General / Grad Student: "The Diary Argument & Psychological Continuity"
  **Question:** "Your Diary Argument assumes an observer can maintain psychological continuity around a CTC. But if I meet my earlier self, doesn't that create a consistency paradox? If I hand over the diary, did I write it or receive it? If the history must be self-consistent (Novikov principle), maybe I never *feel* the contradiction. How do you know the phenomenology breaks?"
  **Reply (2 mins):** "The Novikov principle ensures physical consistency, not phenomenological comfort. Even if the history is consistent, the *experience* is paradoxical. I remember writing the diary, and I remember receiving it. The same neural state is both a memory of an action and a memory of a perception. This collapses the distinction between anticipation and recollection. Even if the universe 'conspires' to make it consistent, the subject's temporal orientation is scrambled. Becoming requires a direction of experience; the CTC scrambles it."
  **Concede:** That physical consistency (Novikov) might be preserved.
  **Stand Firm:** That phenomenological coherence is broken even if physical events are consistent.
  **Soft Spot:** This relies on assumptions about memory and identity over CTCs that are speculative.

  #### 6. Gödel Sympathizer: "Eviscerating the Idealism"
  **Question:** "Gödel wanted to prove time is *ideal*—that it doesn't exist at all. You're arguing it's merely *contingent*—that it exists in some worlds but not others. By making it a contingent feature of specific solutions, haven't you saved realism about time in our world and missed Gödel's deeper point about the conceptual incoherence of time?"
  **Reply (2 mins):** "I am reconstructing Gödel's argument, not endorsing his idealism. Gödel moved from 'time is not necessary' to 'time is ideal' too quickly. My point is that if time's passage depends on the matter distribution, it is a physical feature, not a metaphysical absolute. This is a *stronger* result for physics: it naturalizes time. We don't need to say time is unreal; we just need to say it's not a fundamental backdrop. It saves the phenomenon without the metaphysical baggage."
  **Concede:** That this is a modest reading compared to Gödel's radical idealism.
  **Stand Firm:** That the modest reading is more defensible and philosophically useful.
  **Soft Spot:** The Sympathizer may argue you've changed the subject from "What is time?" to "Where does time exist?"

  #### 7. The "Actual World" Objection (General)
  **Question:** "Let's say you're right. Becoming is contingent. It doesn't obtain in Gödel's world. But it *does* obtain in ours. We have expansion, no CTCs, and a clear arrow of time. So why should I care? You've shown becoming isn't necessary, but you haven't shown it isn't *actual*. Isn't the A-theory still true of the actual world?"
  **Reply (2 mins):** "If becoming is contingent on the matter distribution, it is a physical property, like temperature. It's not a metaphysical truth about the nature of reality. This demotes the A-theory from a fundamental metaphysical position to an empirical claim about our local cosmology. That changes the debate entirely. It means the 'passage of time' is something that could cease if the universe recollapsed or rotated. It makes time fragile, not fundamental."
  **Concede:** That becoming might be actual in our world.
  **Stand Firm:** That its status is empirical/contingent, not metaphysical/necessary.
  **Soft Spot:** An A-theorist is happy to call passage an empirical fact if it's still real.

  #### 8. Halloran / Vance Follow-up: "Local Time Functions"
  **Question:** "Gödel's universe lacks a *global* time function. But it has *local* time functions everywhere. Locally, the light cones don't tip over. Why isn't local becoming enough? Why does the metaphysics of time depend on global topology?"
  **Reply (2 mins):** "Because global topology constrains local possibility. If I can travel far enough and return to my own past, my local 'future' is globally 'past'. The Diary Argument exploits this: I take a local record on a global trip. If becoming is real, the future must be open. But if the global structure allows me to visit it, it was never open. Local time functions exist in a cylinder too, but a cylinder allows time travel. Global structure dictates the rules local time must play by."
  **Concede:** Local time functions exist mathematically.
  **Stand Firm:** That global causal structure determines the coherence of local temporal experience.
  **Soft Spot:** This is the **Dreaded Question** territory. If they press that Presentism is *only* about the local 'now', your global argument misses.

  ---

  ### The Single Question to Hope Nobody Asks
  **"If the A-theorist claims that passage is a local, primitive feature of the 'now', and doesn't care about global foliations or CTCs, doesn't your entire modal argument based on global structure simply beg the question against them?"**

  **Why this is fatal:** It severs the link between your physics (global causal structure/CTCs) and your metaphysics (the nature of passage). If passage is defined purely locally (Okonkwo's view), Gödel's global rotation is irrelevant. If you answer that "passage *requires* global order," you are asserting a premise the Presentist denies. If you answer "passage is local," Gödel's argument fails to kill it. This forces you into a dilemma where either your physics is irrelevant or your metaphysics is question-begging.

  **Preparation if asked:** Pivot immediately to the Diary Argument. "Even if passage is local, the *content* of that passage involves memory and anticipation. The Diary Argument shows that in a CTC world, local experience itself becomes incoherent, not just the global order. A local 'now' that remembers its own future is not a 'now' in the A-theoretic sense."
