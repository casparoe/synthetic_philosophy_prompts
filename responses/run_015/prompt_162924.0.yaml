prompt: |-
  I help run a multilingual community choir in a mid-sized city, and somehow I have become the person who commissions and then adjudicates the English singing translations we perform. I have no training in this — I was a logistics coordinator before I retired — but I got interested after a friend lent me Douglas Hofstadter's 1997 book *Le Ton beau de Marot*, in which he takes one short sixteenth-century French poem of Clément Marot's (the poem to a sick young woman, which he calls "Ma mignonne") and retranslates it dozens of times in different registers and shapes. What stuck with me was the idea that a translation's job is not to carry over the words but to carry over the pattern: the tune of the thing. Our situation is a version of that with a hard external constraint, because a singing translation has to fit a melody that is not negotiable — same number of syllables per line, stresses on the same beats, an open vowel wherever the tune holds a note for more than about a beat and a half, and a rhyme at every point where the music cadences. We do eight to ten songs a year, I have one evening per song, my translators are volunteers (heritage speakers, a retired French teacher, one composer), our music director vetoes anything unsingable, and our board has to approve anything that could embarrass us in front of an audience. We perform each song twice in a concert, first in the original and then in English, and the program prints the original text facing the translation. Over time I have accumulated some house rules that I can no longer tell apart from superstition: never change the season or time of day the song is set in; never reverse the emotional direction of a line to make a rhyme land; every dropped image must be "paid back" somewhere else in the same song, which I call the debt ledger; each translation must contain at least one visible anchor to the original, either a borrowed word or a cognate, so the audience can see the connection; and, when a rhyme is impossible, we sometimes let an English line rhyme against the sound of the French word left untranslated, which one of my volunteers calls a ghost rhyme. I want a procedure I can actually run, not a theory: the questions in order, what counts as a good enough answer to each, where the procedure just says no, and where it has to stop and hand the decision to a person because the issue is one of values rather than facts. It needs to be usable by someone with my level of French and my volunteers' patience, it has to say what to do when I cannot settle a factual dispute about the original (half the time I cannot tell whether a word is slang, obsolete, or regional), and it should tell me which of my house rules are doing real work and which ones I should drop.

  Three cases are on my desk right now. First: a 1930s song addressed to a woman named Marguerite, where every stanza's last line plays on her name also being the French word for the daisy, and the melody's longest held note lands on that word. English "Margaret" has no flower in it, "Daisy" fits the music but renames the woman and loses the sense that she is being spoken to by her real name, and my current draft keeps "Margaret" and moves the flower image into an earlier line to pay off the debt ledger, where it feels jammed in. Second, and this is the one I expect to lose: my favourite draft we have ever done, which turns the original's last line of tired acceptance — roughly, "I have waited long enough" — into something like "and still I'd wait for you," which is more beautiful, sits perfectly on the melody, and is the line our singers love; but it flips resignation into devotion and adds an image that is not in the French. Third: a song where the only word that will rhyme and sing at the cadence is period-accurate and would have been unremarkable in 1930 but would now be heard by part of our audience as an ethnic slur, and my volunteer argues — not unreasonably — that singing anything else there is a bowdlerisation.

  Please be decisive: run the procedure on all three and give me a definite verdict on each with your reasons, including the verdict you think I will not like, and do not just tell me to hire a professional translator, because there is no budget. Tell me which of your rulings a working song translator would most likely overrule, which parts of the procedure are judgment calls dressed up as steps, and where you are yourself unsure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and verdicts:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired logistics coordinator, runs a multilingual community choir, self-taught translation adjudicator. Influenced by Hofstadter's *Le Ton beau de Marot* (translation as carrying over the "tune/pattern," not just words).
      *   **Constraints:** 8-10 songs/year, one evening per song, volunteer translators (heritage speakers, retired teacher, composer), music director (singability veto), board (public image veto). Performance format: Original then English, program prints both.
      *   **Current "House Rules":** Don't change season/time; don't reverse emotional direction for rhyme; "debt ledger" (dropped images paid back); "visible anchor" (cognate/borrowed word); "ghost rhyme" (English rhymes with untranslated foreign word).
      *   **The Ask:** A concrete, actionable *procedure* (questions in order, pass/fail criteria, escalation points). Apply this procedure to three specific cases. Be decisive. Acknowledge limitations (where the procedure is actually judgment, where I might be wrong). No "hire a pro" advice.
      *   **Tone:** Practical, respectful of the choir's mission, decisive, self-reflective about the AI's own limitations.

  2.  **Deconstruct the "House Rules" (Audit):**
      *   *Season/Time:* Useful for atmospheric consistency, but sometimes rigid. *Verdict:* Keep as a soft constraint, breakable if the emotional core is preserved.
      *   *Emotional Direction:* Crucial. Changing resignation to devotion changes the *song*. *Verdict:* Hard constraint.
      *   *Debt Ledger:* Creative, but can lead to "jamming" images (as seen in Case 1). *Verdict:* Soft constraint. Better to lose an image than force a bad one.
      *   *Visible Anchor:* Good for audience connection in a bilingual context. *Verdict:* Keep.
      *   *Ghost Rhyme:* Clever trick for untranslatables. *Verdict:* Keep as a tool, not a rule.

  3.  **Develop the Procedure (The "Choir Translation Protocol"):**
      *   Needs to be linear (Logistics background).
      *   Needs clear "Stop/Go" decision points.
      *   Needs to handle factual disputes (User's French is limited).
      *   Needs to separate Fact (syntax, meaning) from Value (tone, ethics).

      *Drafting the Steps:*
      1.  *Singability Check:* (Music Director's domain). If it doesn't fit, it's out.
      2.  *Semantic Core:* Does it mean the same *thing*? (Fact check).
      3.  *Emotional Vector:* Does it feel the same *way*? (Value check).
      4.  *Audience Safety/Ethics:* Will this offend/harm? (Board/Ethics check).
      5.  *Connection:* Is the link to the original visible? (House Rule check).
      6.  *Final Adjudication:* The "Taste" test.

  4.  **Apply Procedure to Case 1 (Marguerite/Daisy):**
      *   *Problem:* Name vs. Flower pun on long note.
      *   *Draft:* "Margaret" + flower moved earlier.
      *   *Analysis:* Moving the flower breaks the musical climax (long note). "Daisy" renames her.
      *   *Procedure Application:*
          *   Singability: OK.
          *   Semantic Core: Broken (Name vs. Flower).
          *   Emotional Vector: OK (Affectionate).
          *   Connection: "Margaret" is the anchor.
          *   *Verdict:* The current draft is weak because the pun is the *point* of the song.
          *   *Solution:* Needs a hybrid. "Marguerite" (English pronunciation) or keep "Marguerite" in English text. Or accept the loss.
          *   *Decision:* The "Debt Ledger" move (jamming the flower earlier) is failing. The procedure should flag this as a "Critical Failure of Core Metaphor."
          *   *Recommendation:* Keep "Marguerite" in the English text. It's a proper noun. Explain in program notes.

  5.  **Apply Procedure to Case 2 (Resignation vs. Devotion):**
      *   *Problem:* "Waited long enough" (giving up) vs. "Still I'd wait for you" (devotion).
      *   *Draft:* The devotion version is more beautiful and singable.
      *   *Analysis:* This violates the "Emotional Direction" house rule. It changes the *truth* of the song.
      *   *Procedure Application:*
          *   Singability: Pass.
          *   Semantic Core: Fail (Meaning changed).
          *   Emotional Vector: Fail (Resignation -> Devotion).
          *   *Verdict:* REJECT. Even if beautiful. It's a lie.
          *   *Reasoning:* Hofstadter's "tune of the thing" includes the emotional tune.
          *   *Anticipated Pushback:* The user says this is the one they expect to lose. I must stand firm here. A beautiful lie is worse than an awkward truth in this context (facing original text).

  6.  **Apply Procedure to Case 3 (The Slur):**
      *   *Problem:* Period-accurate word, rhymes perfectly, now a slur.
      *   *Draft:* Volunteer says changing it is bowdlerization.
      *   *Analysis:* This is an Ethics/Board issue, not just translation.
      *   *Procedure Application:*
          *   Singability: Pass.
          *   Semantic Core: Pass.
          *   Audience Safety: **FAIL.**
          *   *Verdict:* REJECT.
          *   *Reasoning:* Community choir context. "Do no harm." Historical accuracy does not trump present-day dignity in a community singing context.
          *   *Solution:* Rewrite the rhyme, even if less perfect. Or use the "Ghost Rhyme" technique with a different word.

  7.  **Refine the Procedure & Self-Correction:**
      *   *Critique:* Is this too rigid?
      *   *Adjustment:* Add an "Escalation" step for when facts are disputed (User's French level). Use external resources or consensus voting among volunteers.
      *   *Critique:* Which house rules to drop?
      *   *Adjustment:* Drop/Softens the "Debt Ledger." It causes "jamming" (Case 1). Keep "Emotional Vector" as hard law.
      *   *Self-Reflection:* Where am I unsure? I am an AI. I don't know the specific melody or the specific slur. I must acknowledge that my verdict on Case 3 depends on the *severity* of the slur, but generally, the precautionary principle applies.
      *   *Who would overrule me?* A professional poet-translator might argue for Case 2 (Poetic License > Literal Truth). I need to acknowledge that.

  8.  **Final Polish:**
      *   Structure the response clearly: The Procedure first, then the Audit of House Rules, then the Three Cases.
      *   Ensure the tone is collaborative but authoritative (as requested: "Be decisive").
      *   Check constraints: No "hire a pro." Budget is zero.
      *   Make sure to answer the specific prompt requirements: "which rulings a working song translator would most likely overrule," "which parts... are judgment calls," "where you are yourself unsure."

  9.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Procedure:* Make it a checklist.
      *   *Case 1:* The "Marguerite" issue is classic. The solution is usually to keep the name and explain the pun. The "Debt Ledger" fix is indeed "jammed."
      *   *Case 2:* This is the ethical core of translation. Changing the meaning to make it prettier is the sin of "beautification." I must uphold the "Emotional Vector" rule.
      *   *Case 3:* This is the modern context issue. "Bowdlerization" vs. "Harm." In a community choir, harm wins.

  10. **Final Review against constraints:**
      *   Did I give a definite verdict? Yes.
      *   Did I include the one they won't like? Yes (Case 2).
      *   Did I audit the house rules? Yes.
      *   Did I admit uncertainty? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a actionable procedure, an audit of your house rules, and the verdicts on your three cases.

  ### Part 1: The Choir Translation Protocol (CTP)

  This procedure is designed for a logistics mind. It moves from hard constraints (physics/math) to soft constraints (aesthetics) to ethical constraints (values). It assumes you have a draft in hand.

  **Step 1: The Singability Gate (Fact)**
  *   **Question:** Can a singer breathe, articulate, and sustain this on the provided melody without the Music Director intervening?
  *   **Test:** Sing it aloud at performance tempo. Check open vowels on long notes (>1.5 beats). Check consonant clusters on fast runs.
  *   **Pass:** Music Director signs off.
  *   **Fail:** Return to translator. *No exceptions.*
  *   **Escalation:** If the MD and Translator disagree on what is "singable," the MD wins. This is physics, not art.

  **Step 2: The Semantic Core Check (Fact)**
  *   **Question:** Does the English text assert the same factual propositions as the original?
  *   **Test:** Line-by-line comparison. If the original says "night," does the translation say "night" or "dark"? If the original says "I leave," does the translation say "I go"?
  *   **Pass:** Core facts match.
  *   **Fail:** Meaning is altered to force a rhyme or meter.
  *   **Dispute Resolution:** If you cannot verify the French meaning (slang/obsolete):
      1.  Consult two independent sources (e.g., WordReference + a native speaker forum).
      2.  If sources conflict, default to the *simpler* meaning.
      3.  If still unresolved, mark the line with an asterisk in the program notes: *"Translation uncertain due to idiomatic ambiguity."* Honesty beats guessing.

  **Step 3: The Emotional Vector (Value)**
  *   **Question:** Does the song end in the same emotional place it started?
  *   **Test:** Map the trajectory. (e.g., Hope -> Despair, or Anger -> Acceptance).
  *   **Pass:** Trajectory matches.
  *   **Fail:** Trajectory is reversed or significantly softened/hardened.
  *   **Escalation:** This is your adjudication zone. If the translator argues the new emotion is "better," the answer is **No**. You are translating a song, not improving it.

  **Step 4: The Harm & Dignity Check (Ethics)**
  *   **Question:** Does any word, even if period-accurate, constitute a slur or hate speech by current community standards?
  *   **Test:** The "Grandmother Rule." Would you be comfortable explaining this word to a diverse audience member's grandmother after the concert?
  *   **Pass:** Language is safe.
  *   **Fail:** Language causes harm or exclusion.
  *   **Escalation:** This goes to the Board. This is not a translation issue; it is a liability and mission issue.

  **Step 5: The Connection Anchor (Aesthetic)**
  *   **Question:** Is there a visible link to the original for the bilingual audience?
  *   **Test:** Is there a cognate, a borrowed word, or a preserved proper noun?
  *   **Pass:** Anchor present.
  *   **Fail:** No anchor.
  *   **Action:** If Fail, insert one. (e.g., change "flower" to "fleur" if it sings well, or keep a name).

  **Step 6: The Debt Ledger (Aesthetic - Optional)**
  *   **Question:** If an image was dropped, was it repaid elsewhere?
  *   **Test:** Scan for "jammed" imagery.
  *   **Pass:** Repayment feels natural.
  *   **Fail:** Repayment feels forced or clunky.
  *   **Action:** If Fail, **drop the debt.** It is better to lose an image than to clutter the song. (See Audit below).

  ---

  ### Part 2: Audit of Your House Rules

  You asked which rules are doing work and which are superstition.

  1.  **Never change season/time:** **KEEP.** This is atmospheric scaffolding. Changing "winter" to "night" changes the sensory world of the song.
  2.  **Never reverse emotional direction:** **KEEP AS HARD LAW.** This is the "tune of the thing" Hofstadter talked about. A sad song made happy is a different song.
  3.  **The Debt Ledger:** **DOWNGRADE TO SOFT RULE.** As you noticed in Case 1, this leads to "jamming." In song translation, economy is king. If an image doesn't fit the melody, cut it. Do not force it into an earlier line just to balance the books. The audience won't notice the debt; they will notice the clunky line.
  4.  **Visible Anchor:** **KEEP.** Essential for your specific format (original facing translation). It validates the audience's intelligence.
  5.  **Ghost Rhyme:** **KEEP AS TOOL.** It's a clever solution for the "untranslatable" constraint, but don't force it.

  ---

  ### Part 3: Verdicts on the Three Cases

  Here I apply the CTP. I will be decisive, as requested.

  #### Case 1: The Marguerite/Daisy Pun
  *   **The Issue:** The pun (Name = Flower) is on the longest note. English "Margaret" loses the flower. "Daisy" loses the name. Current draft moves the flower earlier (Debt Ledger) but it feels jammed.
  *   **Procedure Application:**
      *   *Singability:* Pass.
      *   *Semantic Core:* Fail (The pun is the core semantic device of the stanza).
      *   *Debt Ledger:* Fail (You admitted it feels jammed).
  *   **Verdict:** **REJECT THE CURRENT DRAFT.**
  *   **Reasoning:** The "Debt Ledger" fix is violating the Singability Gate (clunky phrasing affects articulation). The pun is the *point* of the song. You cannot move the climax.
  *   **Solution:** **Keep "Marguerite" in the English text.** Pronounce it the English way (MAR-gret) or French way (mar-guh-REET) depending on the melody's vowel requirement.
      *   *Why:* "Marguerite" is a proper noun used in English (albeit less common than Margaret). It preserves the name.
      *   *The Fix:* You must explain the pun in the program notes. *"In French, Marguerite means both the name and the daisy."* This satisfies the "Visible Anchor" rule better than a forced translation. Do not try to translate the untranslatable; annotate it.
  *   **Confidence:** High. This is standard practice in art song translation when a proper noun is the linchpin.

  #### Case 2: Resignation vs. Devotion (The One You Expect to Lose)
  *   **The Issue:** Original: "I have waited long enough" (Resignation/Ending). Draft: "And still I'd wait for you" (Devotion/Continuing). Draft is more beautiful and singers love it.
  *   **Procedure Application:**
      *   *Singability:* Pass.
      *   *Semantic Core:* Fail (Waited long enough vs. Still wait).
      *   *Emotional Vector:* **FAIL.** (Resignation -> Devotion).
  *   **Verdict:** **REJECT THE DRAFT.**
  *   **Reasoning:** This violates Step 3 (Emotional Vector). You are performing the original text immediately before this. If the audience reads "I am done" and hears "I am not done," you have created a contradiction that undermines the integrity of the concert. Hofstadter's "tune of the thing" includes the emotional resolution. A beautiful lie is worse than an awkward truth.
  *   **Solution:** Find a rhyme that fits the resignation. "I have waited long enough / Love is beautiful but tough." (Bad example, but illustrates the constraint). If you cannot find a singable rhyme for resignation, you must simplify the melody's rhyme requirement (ask the MD if the cadence can be less rhymey) or accept a slant rhyme. Do not change the soul of the song to fit the rhyme.
  *   **Confidence:** High on principle, but I know you will hate this.
  *   **Who would overrule me:** A professional lyricist or poet-translator. They often argue that the *performance* creates the new truth, and if the new line kills in the room, it justifies the change. In a community choir context, however, fidelity to the source material (which your audience is reading) is more important than poetic license.

  #### Case 3: The Period Slur
  *   **The Issue:** Period-accurate word, rhymes perfectly, now heard as an ethnic slur. Volunteer argues changing it is bowdlerization.
  *   **Procedure Application:**
      *   *Singability:* Pass.
      *   *Semantic Core:* Pass.
      *   *Harm & Dignity Check:* **FAIL.**
  *   **Verdict:** **REJECT THE WORD.**
  *   **Reasoning:** This violates Step 4. "Bowdlerization" implies censoring art for moral purity. However, in a *community* choir, the safety and inclusion of the singers and the audience take precedence over historical linguistic accuracy. If a word distracts half the audience because they are shocked or offended, the song has failed to communicate.
  *   **Solution:** Rewrite the line. Use the "Ghost Rhyme" technique. Leave the French word untranslated in the English verse if it fits the meter, or find a near-rhyme that is safe.
      *   *Example:* If the word is at the cadence, can you rhyme the English line with the *sound* of the French word from the previous verse? Or simply use a slant rhyme.
      *   *Note to Volunteer:* Tell them: "We are not erasing history; we are choosing not to inflict harm in a shared community space. We will note the original word in the program."
  *   **Confidence:** High. This is a values decision, not a translation one.
  *   **Where I am unsure:** I do not know the specific word. If it is a "mild" period term that is only offensive to a very specific subset, the Board might vote differently. But if it is a recognized slur, the verdict stands.

  ### Part 4: Limitations & Self-Reflection

  You asked me to identify where I am unsure and where my procedure is actually just judgment dressed up as steps.

  1.  **Judgment Calls Disguised as Steps:**
      *   **Step 3 (Emotional Vector):** This is subjective. One person's "resignation" is another's "quiet hope." I cannot measure this objectively. You, the adjudicator, must trust your gut here. The procedure tells you *to ask the question*, but it cannot give you the answer.
      *   **Step 6 (Debt Ledger):** I called this "Optional," but deciding what counts as "jammed" is purely aesthetic.

  2.  **Where a Working Translator Would Overrule Me:**
      *   **Case 2:** A professional might tell you that "singability" *is* the meaning. If the singers can't sell the resignation because the vowels are ugly, the emotion is lost anyway. They might argue that "Still I'd wait" is a valid *interpretation* if it makes the song live. I disagree for your specific context (facing texts), but they have a point.
      *   **Case 1:** A poet might argue that keeping "Marguerite" is lazy. They would strive harder for a solution like "My Daisy, Meg" (if the meter allows). I prioritized the "Anchor" rule over poetic ingenuity.

  3.  **Where I Am Unsure:**
      *   **Case 3:** Without knowing the word, I am applying a precautionary principle. If the word is merely "dated" rather than "slur," my ruling is too harsh. You must verify the severity with a sensitivity reader, not just a dictionary.
      *   **Your French Level:** The procedure relies on you verifying Step 2. If your French is not strong enough to verify the "Semantic Core," the procedure breaks. You are relying on the volunteers' honesty. If you suspect a dispute, you must bring in a neutral third party (even a university student) for a one-hour consult. It is cheaper than a pro translator and solves the factual dispute.

  **Final Instruction:**
  Print the **Choir Translation Protocol**. Put it on the table at your next adjudication evening. When a dispute arises, do not argue opinion. Ask: "Which step of the protocol are we failing?" If it is Step 3 (Emotion) or Step 4 (Harm), the answer is No. If it is Step 6 (Debt), the answer is "Let it go."

  You are not just managing logistics; you are guarding the integrity of the music. Trust the protocol.
