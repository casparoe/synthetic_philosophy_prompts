      *   *Variant 3 (Blackmail/Dead Switch):* Removes reputation/observers. Isolates the "acausal trade" aspect. If the simulation is destroyed, does the logical link hold? (FDT says yes, CDT says no).

  5.  **Formulate the Diagnosis:**
      *   **Substantive or Verbal?** It's substantive, but not about empirical facts. It's about the *normative definition of rationality*. It's a "metanormative" clash.
      *   **Different Questions?** Yes. User asks: "Given this specific situation, what action maximizes utility?" Friend asks: "What decision algorithm, if adopted, yields the best outcomes across the set of situations this algorithm might encounter?"
      *   **The "You" Problem:** The friend treats "you" as an abstract computation. The user treats "you" as a spatiotemporal locus of control.
      *   **Progress:** Progress comes from acknowledging the *trade-off*. CDT wins on "dominance" in fixed worlds. FDT wins on "pre-commitment" in correlated worlds. The scene needs to reflect the *cost* of the chosen rationality.

  6.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Professional, analytical, empathetic to the novelist's need for narrative truth.
      *   *Structure:*
