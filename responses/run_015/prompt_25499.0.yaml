          *   Identify where the mapping breaks.
          *   Flag features "tool" imports that real technologies lack (scale, defaults, path-dependence, irreversibility, etc.).
          *   Evaluate if his conclusion survives.
          *   Propose a better master analogy.
      *   **Constraint:** Keep the response to 600 words.

  2.  **Deconstruct the Hammer Analogy:**
      *   *Hammer:* The technology/artifact.
      *   *Handle:* Interface/affordances.
      *   *Swinging:* The act of usage/operation.
      *   *Builder/Assailant:* The user (agent with intent).
      *   *House/Skull:* The outcome (beneficial/harmful).
      *   *Core Claim:* Intent resides solely in the user; the tool is neutral.

  3.  **Identify Breaks/Disanalogies:**
      *   *Agency:* Hammers don't act alone. Algorithms often act autonomously (black box decisions).
      *   *Affordances:* A hammer doesn't suggest breaking skulls, but dark patterns suggest clicking.
      *   *Scale:* A hammer hurts one person. A algorithm affects millions simultaneously.
      *   *Defaults/Embedded Values:* A hammer has no default setting. Software has defaults (privacy off/on) that shape behavior.
      *   *Irreversibility/Infrastructure:* You can put a hammer down. You can't easily "put down" social media infrastructure once society relies on it.

  4.  **Evaluate Conclusion:**
      *   Does the conclusion (never regulate artifact) survive? No. If the tool shapes the user or acts autonomously, regulating the tool is necessary.

  5.  **Propose Better Analogy:**
      *   *Urban Planning/Architecture:* Buildings shape behavior (hostile architecture).
      *   *Ecology/Environment:* Technology as an ecosystem we inhabit.
      *   *Law/Regulation:* Code is law (Lessig).
      *   *Selection:* "Architecture" or "Environment" is strong. Let's go with **Architecture/Environment**. It captures embedded values and constraints on behavior.

