  8.  *(Self-Correction on the Verdict)*: Actually, playing devil's advocate, a *sophisticated* hedonist (like Mill or a preference hedonist) might argue that "autonomy" produces higher quality pleasure. But Nozick specifically targets *mental state* hedonism. I should stick to refuting Mental State Hedonism, as that's what Nozick targets. I will argue that even sophisticated hedonism fails because it tries to reduce "truth" to "pleasure-causer," but we value truth even when it *reduces* pleasure (e.g., wanting to know if a spouse is cheating even if we'd be happier not knowing). I'll incorporate this.

  9.  **Final Plan:**
      *   Intro: The biologist's lens (measurement vs. reading).
      *   Nozick's Core: The tank vs. the world.
      *   The Hedonist Defense: Instrumentality.
      *   The Calibrated Twist: Memory vs. Reality.
      *   The Verdict: Hedonism fails because well-being requires functional contact with reality.

