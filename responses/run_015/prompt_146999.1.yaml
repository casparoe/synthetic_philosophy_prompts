prompt: |-
  I write a column on science, memory and public argument for a national magazine, and about a year ago I let a city councilman I had interviewed talk me into serving as one of two lay members of my city's Commemoration and Naming Advisory Panel. We meet monthly, we get a case file roughly ten days in advance, we have no research staff and no budget to hire one, we may not commission polling or archival work beyond what is in the file, we must publish a one-paragraph written rationale for every recommendation, and the council treats our recommendations as binding in practice even though formally it is free to ignore them. We handle perhaps fifteen items a year: petitions to remove or relocate a statue, petitions to rename a street, a school, or a clinic, applications to install something new, and increasingly proposals that split the difference by adding an interpretive plaque or moving the object indoors. What I have discovered is that my own reactions are inconsistent in ways I could not defend in print: I argued for keeping a monument I would have wanted gone had the same person's name been on a school, and I argued for renaming a street in a case where I would have left an identical statue alone. I want to stop improvising, and I would also like to write the column about the framework rather than about my gut.

  So give me a decision procedure the panel can actually run on a case file in an afternoon: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no because the file does not support going further, and where it deliberately hands the decision to a human because the question is one of values rather than facts. A few things I want it to do, because I have become convinced they are where these cases actually turn. First, treat public commemoration as a speech act by a speaker with an audience, and give me an explicit rule for fixing the content of that act, since a bronze or a street sign has no determinate propositional content: my own candidate proxy is what a reasonably informed passerby would take away in the few seconds they give it, read alongside the dedicatory inscription and the circumstances of the original installation, and I want you to keep that proxy, replace it with a better one, or say why the attempt is misguided. Second, distinguish the available responses rather than framing everything as keep versus remove: leave as is, add context, rewrite the inscription, relocate to a museum or cemetery, remove to storage, remove and destroy, and install something new under a fixed term with a sunset clause. Third, build in the variable I have started calling compulsion, meaning how far the city forces residents to repeat the name in the course of ordinary life, which seems to me to run from school or street addresses through building names to a statue in a park that one can simply walk past, and the related variable of inescapability, since a name on a bus route or an attendance boundary is not avoidable in the way a monument is. Fourth, treat a plinth or a name as a scarce and rival resource, so that retaining is also a decision not to commemorate anyone else, and say what the procedure does with the fact that the marginal signal from yet another monument of the same kind is close to zero while the marginal signal from a renaming is not. Fifth, handle separability: the case where the honored deed is detachable from the wrongdoing, the case where the deed is constituted by it, as with discoveries that depended on coerced subjects or a fortune made in the slave trade, and the case where the point of the original installation was itself an act of intimidation rather than of honor. Sixth, tell me what to do about a name whose commemorative force has simply drained away, where no one in the neighborhood any longer knows who the person was, and about the asymmetry that removal is nearly irreversible in practice while retention imposes a continuing cost on identifiable living people. Where a step looks like a judgment call dressed up as procedure, label it as one rather than hiding it, and where the panel as a lay body should defer to someone else, say to whom.

  Then run the finished procedure on three cases, all of them composites I have built from several real disputes, so please treat the facts as given rather than as claims to check. One: an 1894 bronze in a city park, paid for by subscription among professional colleagues, honoring a surgeon whose celebrated technique he developed by operating without anesthesia on enslaved women; the plinth names only the technique; his name is also on a street and a clinic; a descendant association has petitioned for removal, the county historical society wants retention with a new plaque, and a teaching hospital has offered the piece a place in a collection. Two: a street named for a nineteenth-century textile industrialist who endowed the public library and once published a pamphlet arguing that immigrants should not vote; no living group identifies as injured by that pamphlet; nobody on the street knows who he was; renaming would cost the city about a hundred and eighty thousand dollars and force re-addressing on roughly a hundred and forty households and businesses. Three, the one I expect to argue with: the founder of the city's tuberculosis sanatorium system, credited in her own time with saving thousands of lives and the subject of an admiring column I wrote in 2019, newly documented from her own correspondence as having drafted and lobbied for the state's compulsory sterilization law, with several people sterilized under that law still alive and willing to testify. I am inclined toward retention with a large new interpretive installation, and I want to know whether the procedure underwrites me or overrules me, so commit to a verdict on each case and give your reasons instead of laying out what a panel might say. Finally, be blunt about the limits: tell me what this procedure cannot do, which of my stipulations you dropped and why, which step you are least confident in, and what would have to be true for the procedure to be giving the wrong answers systematically.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** A science/memory/public argument columnist who serves on a city's Commemoration and Naming Advisory Panel.
      *   **Problem:** Inconsistent gut reactions to commemoration cases (statues, street names, etc.). Wants a structured decision procedure to replace improvisation.
      *   **Constraints/Requirements for the Procedure:**
          *   Must be runnable by lay members in an afternoon with limited files (no research staff/budget).
          *   Must treat commemoration as a *speech act* (define content).
          *   Must distinguish *responses* (not just keep/remove: add context, relocate, sunset, etc.).
          *   Must account for *compulsion/inescapability* (street name vs. park statue).
          *   Must treat space/names as *scarce/rival resources* (opportunity cost).
          *   Must handle *separability* (good deeds vs. bad deeds vs. bad means).
          *   Must handle *faded meaning* (nobody knows who it is) and *asymmetry* (removal is irreversible, retention has ongoing cost).
          *   Must label *judgment calls* vs. *factual steps*.
          *   Must specify *deferral points*.
      *   **Task:** Create the procedure, then apply it to three specific composite cases.
      *   **Output:** Commit to verdicts on the cases. Be blunt about limits, dropped stipulations, low-confidence steps, and failure conditions.

  2.  **Drafting the Decision Procedure (The "Framework"):**

      *   *Goal:* A flowchart-like logic that fits the "afternoon" constraint.
      *   *Step 1: The Speech Act (Content).* The user suggested "reasonably informed passerby." I need to refine or validate this. A statue *does* speak. The content is the *honor* conveyed. Let's define the "Message" as: *What virtue or achievement does this object/name assert the city endorses?*
      *   *Step 2: Compulsion & Inescapability.* Differentiate between passive observation (statue) and active usage (street address, school name). High compulsion requires higher scrutiny.
      *   *Step 3: Separability & Taint.* Is the honor detachable from the harm? (The "Great Man" vs. "The Means" vs. "The Intent").
      *   *Step 4: Scarcity & Opportunity Cost.* Does keeping this block a better commemoration? Is the marginal utility of *another* statue zero?
      *   *Step 5: Faded Meaning.* Does anyone care? If the signal is dead, does the noise (harm) matter?
      *   *Step 6: Remedy Selection.* Match the harm to the fix. (Context for nuance, Relocation for museumification, Removal for toxicity).
      *   *Deferral:* When to call in historians or legal counsel? (Fact-checking the biography vs. weighing the values).

      *Refining the "Speech Act":* The user's proxy ("reasonably informed passerby") is good but needs to be anchored. Let's call it the *Public Uptake Test*. What is the dominant narrative received?
      *Refining "Compulsion":* Create a tier system. Tier 1 (High Compulsion: Schools, Streets), Tier 2 (Low Compulsion: Parks, Buildings).
      *Refining "Separability":* Need a specific test for "Constitutive Harm" (the good *required* the bad) vs. "Incidental Harm" (the good happened, but they also did bad things).
      *Refining "Scarcity":* Acknowledge that a street name is finite. A statue spot is finite.
      *Refining "Asymmetry":* Retention has a "maintenance cost" (dignitary harm to victims). Removal has a "erasure cost" (loss of historical evidence).

  3.  **Applying the Procedure to the Cases:**

      *   **Case 1: The Surgeon (1894 Bronze).**
          *   *Facts:* Statue in park (Low Compulsion). Technique developed on enslaved women without anesthesia (Constitutive Harm). Name also on Street/Clinic (High Compulsion). Petition: Remove. Counter: Plaque. Offer: Museum.
          *   *Analysis:* The medical technique is the "good," but it is *constituted* by the abuse of enslaved women. You cannot separate the technique from the method.
          *   *Compulsion:* Statue = Low. Street/Clinic = High.
          *   *Verdict:* Statue -> Relocate to Museum (preserves history, removes public honor). Street/Clinic -> Rename (High compulsion + Constitutive Harm).
      *   **Case 2: The Industrialist (Street Name).**
          *   *Facts:* Street name (High Compulsion). Endowed library (Good). Anti-immigrant pamphlet (Bad). No living group injured (Faded Harm?). Nobody knows who he is (Faded Meaning). Cost to rename is high ($180k + 140 addresses).
          *   *Analysis:* Speech act is weak (nobody knows him). Harm is historical/abstract (no living injured group). Compulsion is High (addresses). Scarcity: Street names are scarce.
          *   *Verdict:* Retain with Context? Or Rename? The cost is high, the harm is abstract. But the "Public Uptake" is null. If the name means nothing, why keep it? However, the "Asymmetry" favors retention if harm is low. But "Compulsion" forces residents to say the name.
          *   *Decision:* This is the tricky one. High cost vs. Low meaning. If the name is "empty," does it still honor him? Yes, formally. But if the harm is abstract... Let's look at the "Separability." Did the library depend on the anti-immigrant stance? No. But the *honor* is for the man.
          *   *Re-evaluation:* The prompt asks me to commit. High compulsion + Any significant moral stain usually tips toward change *unless* the cost is prohibitive. $180k is real money. But 140 households is manageable.
          *   *Wait, the "Faded Meaning" factor:* If nobody knows him, the "Honor" signal is weak. But the "Compulsion" is real.
          *   *Verdict:* Retain with Plaque? No, street signs don't have plaques. Retain? The harm is low (no living victims). The cost of change is high. *However*, the procedure should prioritize *current* values over *past* inertia if the moral stain is clear. But is "arguing immigrants shouldn't vote" a disqualifier for a street name today? Yes.
          *   *Pivot:* The procedure must weigh the "Ongoing Cost to Identifiable Living People." Here, the living people (residents) face administrative burden. The victims (immigrants then) are gone.
          *   *Final Call:* Retain. Why? Because the "Speech Act" is dead (nobody knows him), so the honor is inert, but the *cost* of removal is active harm to current residents. *Correction:* Wait, if the honor is inert, why keep it? Because removal is irreversible. But is there a better candidate? The prompt implies scarcity.
          *   *Actually, looking at the "Compulsion" rule:* High compulsion requires higher justification. Can we justify forcing people to say the name of an anti-democratic actor? Probably not.
          *   *Revised Verdict:* Rename. The moral threshold for *compelled speech* (addresses) is higher than for passive statues. The cost is a budget issue, not a moral veto.
      *   **Case 3: The TB Founder (Sanatorium/System).**
          *   *Facts:* Saved thousands (Good). Drafted compulsory sterilization law (Bad). Victims still alive (Active Harm). User wants Retention + Interpretation.
          *   *Analysis:* Separability. Saving TB patients vs. Sterilizing others. Are they linked? She used her power to enact eugenics. This is "Incidental" to the TB work but "Constitutive" of her public policy legacy.
          *   *Compulsion:* System/Building name? High.
          *   *Living Victims:* Yes. This spikes the "Ongoing Cost."
          *   *Verdict:* The user wants Retention + Plaque. The procedure likely overrules this. When living victims exist and the harm is state-sponsored violence (sterilization), "Context" is often seen as insult.
          *   *Decision:* Relocate/Remove Name from Buildings. Retain in History (Museum/Archive). The "Speech Act" of a building name is "We honor this person." We cannot honor someone who actively harmed living citizens via state law.
          *   *Wait, I need to check my bias:* The user *expects* to argue with this one. I need to be rigorous. If the TB work saved lives, and the sterilization was a separate policy track... But she lobbied for it. It defines her civic legacy.
          *   *Verdict:* Remove Name from Facilities. Relocate statue/archive to museum context. The "Living Victim" clause trumps the "Historical Nuance" clause in high-compulsion settings.

  4.  **Refining the Procedure Steps (Self-Correction during drafting):**

      *   *Speech Act:* Keep the user's "Passerby" proxy but formalize it as the *Dominant Public Uptake*.
      *   *Compulsion:* Create a "Coercion Index."
      *   *Separability:* Distinguish "Tainted Means" (Good end, bad method) vs. "Mixed Legacy" (Good end, bad separate act).
      *   *Scarcity:* Explicitly ask "Who are we NOT honoring by keeping this?"
      *   *Asymmetry:* Explicitly weigh "Dignitary Harm to Victims" vs. "Historical Erasure."

  5.  **Addressing the "Blunt Limits" Section:**

      *   What can't it do? It can't heal community trauma. It can't predict future values.
      *   Dropped stipulations? Maybe the "one paragraph rationale" constraint makes deep philosophical nuance hard, but I must work within it.
      *   Least confident step? The "Faded Meaning" test. How do we measure "nobody knows"?
      *   Systematic failure? If the panel lacks diversity, the "Public Uptake" test will be biased.

  6.  **Final Review against Constraints:**

      *   Did I answer all six specific requirements? (Speech act, responses, compulsion, scarcity, separability, faded/asymmetry).
      *   Did I run the three cases with verdicts?
      *   Did I include the limits section?
      *   Tone: Professional, analytical, respectful of the columnist's expertise but firm on the logic.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Procedure Name:* The Commemoration Audit Protocol (CAP).
      *   *Structure:* 5 Gates. If you fail a gate, you stop or move to specific remedy.
      *   *Case 1:* Surgeon. Verdict: Relocate Statue, Rename Street/Clinic. (Constitutive harm + High Compulsion on names).
      *   *Case 2:* Industrialist. Verdict: Retain. (Faded meaning + High switching cost + No living victims). *Wait, let me rethink Case 2.* If I say Retain, does that violate the "Compulsion" rule? A street name is compelled speech. If the person is anti-democratic (voting), is that compatible? The prompt says "no living group identifies as injured." This is key. If there's no active wound, the "Ongoing Cost" is low. The "Switching Cost" is high. Procedure should favor status quo *unless* active harm exists. Okay, Retain with historical note (if possible) or just Retain. Let's go with Retain, but acknowledge the tension.
      *   *Case 3:* TB Founder. Verdict: Remove Name/Relocate. (Living victims + State Violence). This contradicts the user's inclination. I must explain why the procedure overrules the "Context" solution. Context is insufficient when victims are present and the harm was legal/coercive.

      *(Self-Correction on Case 2)*: Is "Retain" defensible? The prompt asks me to be blunt. If the name means nothing, is it a "scarce resource" being wasted? Yes. But is the cost of reclaiming it worth it? The procedure must weigh *utility*. If the signal is zero, the resource is dead. But the *cost* to revive it is $180k. The procedure should probably recommend *Retain* but mark for review if redevelopment occurs. Actually, the prompt asks for a decision. I will recommend *Retain* based on the "Asymmetry" and "Living Victim" constraints, noting the "Faded Meaning" makes the honor inert, thus reducing the need for removal.

      *(Self-Correction on Case 3)*: The user wants to keep it with a plaque. The procedure must challenge this. Why? Because "Compulsion" (Sanatorium system) + "Living Victims" = High Dignitary Harm. A plaque doesn't stop the building from bearing her name. The "Speech Act" of a building name is "This is a safe place named for a benefactor." For sterilization victims, it is a threat. Verdict: Rename.

  8.  **Final Polish:** Ensure the tone matches a columnist's peer—intellectual, precise, slightly weary of bureaucracy but committed to clarity. (Proceed to generate output).

      *Wait, one more check on the "Speech Act" proxy.* The user suggested "reasonably informed passerby." I should keep that but refine *how* they are informed. "Reasonably informed *by the object and its immediate context*." Not "if they Googled it."
      *Check on "Scarcity".* Make sure to mention that keeping a name prevents a new one.
      *Check on "Deferral".* When to call a historian? When the *facts* of the biography are disputed, not the *values*.

      *Let's write.*
answer: |-
  Here is a decision procedure designed for your constraints: lay members, limited files, afternoon timeline, and binding practical effect. It is built to expose value judgments rather than hide them behind procedural fog.

  ### The Commemoration Audit Protocol (CAP)

  **Preamble:** This procedure treats commemoration as a **Speech Act**. The object or name is the *Speaker*; the City is the *Endorser*; the Public is the *Audience*. The goal is not historical accuracy (the job of archives) but current endorsement (the job of the state).

  **Gate 1: The Public Uptake Test (Defining the Speech Act)**
  *   **Question:** What is the dominant message a reasonably informed passerby receives in under 10 seconds, reading the inscription and observing the setting?
  *   **Procedure:** Do not ask what the subject *did*; ask what the object *says*. Does it say "We honor this virtue," "We remember this event," or "This is a neutral marker"?
  *   **Stop/Deferral:** If the panel cannot agree on the dominant message within 15 minutes, **defer to a historian** to draft a "Context Statement" for the next meeting. Do not proceed until the *claimed* honor is defined.
  *   **Judgment Call:** Determining "reasonably informed." You must assume the viewer knows local history basics but has not read the subject's biography.

  **Gate 2: The Compulsion & Inescapability Index**
  *   **Question:** How forcibly does the city require residents to interact with this speech act?
  *   **Scale:**
      *   **Tier 1 (High Compulsion):** Street names, school names, attendance boundaries, bus routes. (Residents must speak/use this to function).
      *   **Tier 2 (Medium Compulsion):** Public buildings, clinics, libraries. (Residents must enter to access services).
      *   **Tier 3 (Low Compulsion):** Statues in parks, plaques on walls. (Residents can avert their eyes or walk around).
  *   **Rule:** The higher the Tier, the higher the burden of justification for retention. Tier 1 requires near-unanimous moral clearance; Tier 3 allows for nuance.

  **Gate 3: The Separability & Taint Analysis**
  *   **Question:** Is the honored achievement detachable from the harm?
  *   **Categories:**
      *   **Constitutive Harm:** The achievement *required* the harm (e.g., medical advances via non-consensual experimentation). *Presumption: Remove/Relocate.*
      *   **Intertwined Legacy:** The achievement and harm are parallel tracks of the same power (e.g., philanthropy funded by exploitation; public health paired with eugenics). *Presumption: Context or Relocate.*
      *   **Incidental Flaw:** The achievement is distinct; the harm is a personal failing or minor political dispute with no current victims. *Presumption: Retain.*
  *   **Judgment Call:** Distinguishing "Constitutive" from "Intertwined." If the harm was a *method* used to achieve the good, it is Constitutive.

  **Gate 4: The Living Victim & Asymmetry Check**
  *   **Question:** Are there identifiable living people for whom this commemoration constitutes an active dignitary harm?
  *   **Rule:** If **Yes**, the presumption shifts heavily toward Removal or Renaming. Retention imposes a continuing cost on them; removal imposes a one-time cost on the city.
  *   **Asymmetry Clause:** Removal is practically irreversible. Retention is reversible later but costly now. If Living Victims exist, the "irreversibility" of removal is outweighed by the "continuing cost" of retention.
  *   **Faded Meaning Clause:** If no one knows who the person is (Signal = 0), the "Honor" is inert. If the Honor is inert, but the Compulsion is High (Tier 1), ask: *Does keeping this block a better name?* If Yes, Rename. If No (and switching costs are high), Retain.

  **Gate 5: The Scarcity & Remedy Selection**
  *   **Question:** Does retaining this object/name prevent a more urgent commemoration?
  *   **Rule:** A plinth or street name is a rival resource. If the current signal is near-zero (Faded Meaning) and the moral standing is ambiguous, the opportunity cost of *not* honoring someone else matters.
  *   **Remedy Matrix:**
      *   *Constitutive Harm + Living Victims:* **Remove/Destroy** (if replica exists) or **Remove to Storage**.
      *   *Constitutive Harm + No Living Victims:* **Relocate to Museum** (changes speech act from "Honor" to "History").
      *   *Intertwined Legacy + High Compulsion:* **Rename/Remove Name**.
      *   *Intertwined Legacy + Low Compulsion:* **Add Context/Interpretive Plaque**.
      *   *Incidental Flaw + Faded Meaning:* **Retain** (unless a superior candidate exists for the specific slot).

  ---

  ### Application to Composite Cases

  Here are the verdicts generated by running the CAP on your files.

  #### Case 1: The Surgeon (1894 Bronze, Street, Clinic)
  *   **Facts:** Technique developed via surgery without anesthesia on enslaved women. Name on Park Statue (Tier 3), Street (Tier 1), Clinic (Tier 2). Living descendants petitioning.
  *   **CAP Run:**
      *   *Gate 1 (Uptake):* The statue says "We honor this medical pioneer."
      *   *Gate 2 (Compulsion):* Statue is Tier 3; Street/Clinic are Tier 1/2.
      *   *Gate 3 (Separability):* **Constitutive Harm.** The technique *was* the exploitation. You cannot have the technique without the abuse of the enslaved women.
      *   *Gate 4 (Victims):* Descendant association identifies active harm.
      *   *Gate 5 (Remedy):* Constitutive Harm triggers Relocation/Removal.
  *   **Verdict:**
      1.  **Statue:** **Relocate to Museum.** The teaching hospital's offer is the correct destination. It preserves the artifact for historical study (medical history) but removes the civic honor (park).
      2.  **Street & Clinic:** **Rename.** High compulsion (Tier 1/2) combined with Constitutive Harm makes retention indefensible. Residents should not be forced to address their mail or seek healthcare in the name of a man whose work was defined by the torture of enslaved people.
  *   **Reasoning:** The "Context/Plaque" solution fails Gate 3. You cannot plaque away Constitutive Harm. The museum relocation satisfies the Historical Society's desire for preservation without imposing the civic honor.

  #### Case 2: The Industrialist (Street Name)
  *   **Facts:** Endowed library (Good). Argued immigrants shouldn't vote (Bad). No living injured group. Nobody knows who he is. Renaming cost: $180k + 140 addresses.
  *   **CAP Run:**
      *   *Gate 1 (Uptake):* Signal is near zero ("Faded Meaning"). The honor is inert.
      *   *Gate 2 (Compulsion):* **Tier 1 (High).** Residents must use this name.
      *   *Gate 3 (Separability):* **Incidental Flaw/Intertwined.** The library endowment did not *require* the anti-immigrant stance, but both stem from his worldview.
      *   *Gate 4 (Victims):* **No Living Victims.** The "Ongoing Cost" is abstract, not personal.
      *   *Gate 5 (Scarcity/Asymmetry):* Removal is costly ($180k). Retention has low ongoing cost (since the name is unknown).
  *   **Verdict:** **Retain.**
  *   **Reasoning:** This is the hardest case. While the anti-democratic view is disqualifying for *new* honors, the CAP prioritizes the "Asymmetry Clause" when Living Victims are absent. The cost of removal ($180k + administrative burden on 140 households) is a concrete harm to current residents. The "honor" being removed is inert (nobody knows him). Therefore, the marginal gain of renaming is low, while the marginal cost is high.
      *   *Caveat:* If the street undergoes major redevelopment, trigger a review to Rename then. Do not spend the capital now for a symbolic gain the public does not perceive.

  #### Case 3: The TB Founder (Sanatorium System)
  *   **Facts:** Saved thousands (Good). Drafted compulsory sterilization law (Bad). Victims still alive (Active Harm). User inclination: Retain + Interpretation.
  *   **CAP Run:**
      *   *Gate 1 (Uptake):* "We honor this savior of public health."
      *   *Gate 2 (Compulsion):* **Tier 2 (High).** A sanatorium/system name is encountered by patients seeking care.
      *   *Gate 3 (Separability):* **Intertwined Legacy.** Saving TB patients and sterilizing "unfit" citizens were parallel exercises of state power over bodies.
      *   *Gate 4 (Victims):* **Yes, Living Victims.** People sterilized under her law are alive and willing to testify.
      *   *Gate 5 (Remedy):* Living Victims + High Compulsion trumps "Context."
  *   **Verdict:** **Remove Name / Relocate Archive.**
  *   **Reasoning:** The procedure **overrules** your inclination. A plaque is insufficient when the "Speech Act" is a building name encountered by vulnerable patients, and specific living citizens identify that name as the signature on their own violation. The "Ongoing Cost" to the sterilization survivors outweighs the "Historical Erasure" cost.
      *   *Nuance:* Her papers and the history of the TB system should be preserved in an archive (Museum/University), but the *honorific* (the name on the building) must cease. You cannot ask victims to walk past a building named for their abuser to receive healthcare, even with a plaque explaining why.

  ---

  ### Limits and Vulnerabilities of the Procedure

  You asked for bluntness about where this framework breaks.

  **1. What It Cannot Do**
  This procedure cannot heal community trauma. It is a triage tool, not a reconciliation process. It treats harm as a variable to be weighed, which can feel cold to those experiencing the harm. It also cannot predict future values; a "Retain" verdict today might look monstrous in 20 years. It minimizes this risk via the "Living Victim" priority, but it cannot account for future moral shifts regarding non-living issues (like Case 2).

  **2. Dropped Stipulations**
  I dropped your idea of "install something new under a fixed term with a sunset clause."
  *   *Why:* It creates administrative bloat your panel cannot manage. A "sunset" on a street name implies the name was a trial, which undermines the stability required for addresses. It turns commemoration into a lease, which confuses the "Speech Act." Commemoration should be presumed permanent; if it isn't, it shouldn't be installed.

  **3. Least Confident Step**
  **Gate 4 (The Living Victim Check).** This is the most morally potent but factually fragile step.
  *   *Risk:* It privileges organized groups who can present "living victims" over diffuse historical harms. It risks creating a hierarchy of suffering where only the currently vocal are protected. If a group is marginalized enough to have no voice, they may fail this gate even if the harm is severe.
  *   *Mitigation:* The panel must define "Identifiable" broadly. It should not require a petition signature, but rather credible testimony that a specific class of people is actively harmed.

  **4. Systematic Failure Conditions**
  The procedure will give systematically wrong answers if:
  *   **The "Public Uptake" is homogenous:** If your panel lacks demographic diversity, you will fail Gate 1. A "reasonably informed passerby" looks different in a Black neighborhood than in a White one. If the panel assumes *their* uptake is the *public's* uptake, you will retain monuments that function as intimidation to others.
  *   **The "Cost" metric is rigid:** If the city treats the $180k in Case 2 as an absolute veto regardless of moral necessity, the procedure becomes a tool of budgetary inertia rather than ethical decision-making.
  *   **Historical Facts are Disputed:** This procedure assumes the case file is factually accurate. If the "Constitutive Harm" in Case 1 is later debunked by new archives, the verdict collapses. You must build a "Review Clause" (e.g., verdicts stand for 5 years unless new factual evidence emerges).

  **Final Note for Your Column:**
  The value of this procedure is not that it produces "correct" answers, but that it forces the panel to argue about the *inputs* (Is this harm constitutive? Are there living victims?) rather than the *outputs* (I feel like keeping it). It moves the disagreement from "gut" to "criteria," which is the only way a lay body can defend its work in print.
