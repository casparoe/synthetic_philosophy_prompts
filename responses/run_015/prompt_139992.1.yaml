      *   *Refining Point 3:* This is the strongest logical objection. If I have 10 duties and can do 9, do I have a duty to do the 10th? If yes, I fail. If no, I have a permission to drop one. If I have a permission to drop one, which one? If any one, then I have a permission to drop *some* set. That dissolves the dilemma into a choice.
      *   *Refining Closing:* Be honest about insulation. The view is insulated by making "ought" very strong and "aggregation" very weak. Is that a defect? Yes, it makes the theory disconnected from standard decision theory.

  6.  **Final Polish:** Check against constraints.
