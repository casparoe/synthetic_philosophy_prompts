answer: |-
  You are right to feel friction because the political theorists are making causal and normative claims using language that implies statistical properties they have not defined, and translating their arguments into your vocabulary exposes where the logic holds and where it relies on hidden assumptions. When they argue that elections systematically select for an unrepresentative elite, you should hear them describing a sampling frame with severe coverage error and systematic selection bias. The candidate pool is not a probability sample of the citizenry; it is a self-selected subset with high variance on unobserved confounders like wealth, extroversion, and access to capital, meaning the estimator for population preferences derived from elected officials is biased by design. When they claim a lottery gives you a descriptive microcosm for free, they are describing simple random sampling or stratified random sampling from a complete citizen registry, which theoretically yields unbiased estimators of population demographics, but the phrase for free ignores non-response bias. You know that without aggressive propensity weighting and post-stratification to correct for who actually accepts the invitation, the achieved sample will diverge from the target population, so the microcosm is not free; it costs design effect and requires active weighting to maintain validity. The argument that removing campaigns removes incentives to grandstand and form factions translates to removing a source of measurement error and clustering. Campaigns act as a confounding instrument that alters responses independent of underlying preference, and factions introduce intra-class correlation that inflates the design effect and reduces the effective sample size, so removing them should theoretically reduce variance and improve the signal-to-noise ratio of the deliberation. The objection that an unelected assembly isn't accountable translates to the lack of a longitudinal panel or feedback loop; there is no mechanism to validate the outcomes against future population parameters or to adjust weights based on performance error, making it a cross-sectional study with no follow-up wave to check predictive validity.

  Your intuition about treating deliberation as a treatment is the most methodologically sound critique you can raise, and it does break the mirroring argument if you push it to its logical conclusion. If you view the assembly as a randomized experiment where the draw ensures pre-treatment covariates match the population, you have secured descriptive representation at baseline, but the legitimacy claim that the assembly's decision represents what the population would decide rests on the assumption of homogeneous treatment effects. You are correct that if the rich and poor participants are moved differently by three weekends of expert evidence, meaning there is an interaction between covariates and the treatment, then the distribution of outcomes in the assembly will not match the distribution of outcomes if the entire population received the same treatment. Since there is no untreated control group because everyone in the room gets the intervention, you cannot estimate the counterfactual of what the public would decide without the deliberation, nor can you verify if the deliberation biases specific subgroups, so the mirroring argument collapses from descriptive validity to causal inference validity without the necessary identification strategy. This suggests the argument was never meant to carry epistemic weight regarding the outcome distribution, but rather relies on a normative shortcut that equates the process with the result.

  If we isolate the residue of this translation to see what fits and what does not, the claims about selection bias, coverage error, and non-response translated cleanly because they are fundamentally statistical problems disguised as political ones. However, the claim that the lottery gives a microcosm for free only translated because I quietly added the assumption that you would apply post-stratification weights, whereas the theorists often imply the raw draw is sufficient, which means the original claim was doing less work than it looked like it was doing by ignoring the mechanics of non-response. The claim that this body's decision just is the polity's decision has no counterpart in sampling vocabulary because it is an ontological claim rather than an inferential one; your framework treats the assembly as an estimator of the population will, but the theorists treat it as a constitutive embodiment of the population will, and here your framework is not missing something real but rather correctly identifying that the claim is a category error masquerading as statistics. Finally, your guess that accountability is a feedback loop your framework can describe but only elections have is largely correct; accountability is a mechanism for iterative weighting based on outcome error, and while your framework can model the loop, the sortition design structurally removes the link between outcome and selection probability for the next wave, meaning the original claim about accountability was describing a real structural deficit that your vocabulary can quantify as a lack of longitudinal validation. In sum, your vocabulary does not fail to capture the reality; instead, it reveals that many of the political arguments are relying on statistical miracles like zero non-response bias or homogeneous treatment effects to bridge the gap between a small room of people and the will of a region.
