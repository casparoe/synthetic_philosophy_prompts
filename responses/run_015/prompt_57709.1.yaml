          *   Identify the *single reply* that must land for the trip to be worth it.
          *   Identify the question the user hopes nobody asks (suspects it's about the ending, but maybe worse).
          *   Finish with two sentences to say when told "you misunderstood a distinction."
          *   **Format:** Letter, continuous prose, no headings, no bullet points, no numbered lists, no bold, no tables.
          *   **Constraint:** No reading lists, no citations to look up.

  2.  **Deconstruct the Argument & Audience:**
      *   *Core Claim:* Legal indeterminacy in constitutional breakdowns is real silence, not a gap. Narrative captures the temporal interval of uncertainty better than theory.
      *   *Hartians:* Will focus on the Rule of Recognition. If the officials obey the Declaration, *that* is the new rule. They might say you're just describing a change in the Rule of Recognition, not a lack of law.
      *   *Comparativist:* Will cite real cases (India, Germany, Colombia) where courts struck down amendments. They will say "Actually, courts *do* decide this based on substantive values."
      *   *Formalist Junior:* Will say "Hierarchy of norms." Kelsenian stuff. The entrenchment is higher order than the amendment power. You're confusing levels.
      *   *Practitioners/Clerk:* "What do I tell the judge? Write 'dismissed' or 'upheld'?" They want a rule, not philosophy.
      *   *Historian:* "People have done this." Implies stability is possible without your "silence."
      *   *Grad Students:* "Tell us about the characters." Distracts from the theory.
