answer: |-
  Dear Friend,

  You have asked me to walk the room before you enter it, and I have done so in my mind, listening to the chairs scrape and the water pitchers glug, and I can tell you exactly how the air will shift when the moderator opens the floor. The most damaging challenge will come from the Hartians, who will not ask a question but make a correction, saying something like you have simply described a revolutionary change in the Rule of Recognition rather than a legal void, because for them law exists wherever officials obey commands. You must reply that the Rule of Recognition describes a system in operation, whereas your novel isolates the interval where the old system has died and the new one has not yet been born, a duration theory cannot hold because it treats law as a state rather than a process. Be candid that this reply is soft because Hartians do not care about the interval, only the outcome, and you will be buying plausibility by conceding that once obedience occurs, validity follows, which undermines your claim that the silence itself is the legal truth. You should absorb this objection in the first five minutes of your talk by explicitly distinguishing between the fact of obedience and the validity of the command, so they cannot spring it as a revelation later.

  Next in severity is the comparativist who will lean forward and tell you that courts in India, Germany, and Colombia have struck down constitutional amendments using substantive values, implying your fictional judges are naive for finding no law. Your reply must be that those courts decided on political or moral authority, not legal authority, because the charter gave them none, and you are interested in the legality of the decision rather than its efficacy. This is weak because it sounds like you are calling real judges liars, and it buys plausibility by retreating into a definition of law so pure it no longer touches the ground. The formalist junior scholar will follow this by suggesting the puzzle evaporates if you index rules to levels, arguing that the entrenching clause is a higher-order norm than the amendment power and mid-century Scandinavian jurisprudence settled this long ago. You should say that hierarchy requires a meta-rule to establish the ladder, and your Assembly repealed the meta-rule, leaving the ladder floating in air, but admit that this reply risks sounding like mysticism if you cannot name the meta-rule they think exists. You must also preempt this in your opening remarks by stating clearly that Article 46 was the only source of hierarchical authority, so when it went, the levels collapsed.

  The practitioners and the clerk will not care about your theory and will ask what a judge writes on Monday morning, demanding to know if the Declaration is dismissed or upheld. You should tell them the judge writes nothing because there is no jurisdiction to hear the case, which is the only honest answer if there is no law, though you must acknowledge this is soft because judges never decline jurisdiction and will invent a reason to decide rather than admit paralysis. The legal historian will observe that polities have survived precisely this situation, which sounds like support but is actually a trap implying that continuity proves legality. Your counter is that survival is biological and legality is normative, and a city can survive as a gang just as easily as a republic, but this buys plausibility by conceding that your republic might indeed be a gang, which damages the jurisprudential weight of your example. The graduate students will ask about your characters to be kind, which lets the room off the hook, and you should reply briefly that the characters exist to embody the interval of silence, then pivot back to the theory, though you must know this sounds rude and may alienate the room if you do it too sharply.

  There is a question about your ending that you suspect will be asked, where someone will note that the Declaration is obeyed in the last chapter, appearing to settle in the plot exactly what the paper claims cannot be settled. You must argue that the novel shows the cost of the silence, not the resolution of the validity, and that obedience proves power but not law, yet this is the hardest reply to land because the text itself seems to contradict you by showing order restored. However, the question you hope nobody asks, and which is worse than the ending, is whether you are describing law or politics, because if the answer is politics, your paper belongs in a political science workshop and your novel is just history. If this is asked, you must say that you are describing the moment politics becomes law, which is the only space where jurisprudence matters, but be aware that this reply concedes that before that moment, you are not doing law at all.

  Of all these replies, the single one that has to land for the afternoon to have been worth the trip is your distinction between a gap awaiting construction and a silence no rule speaks into, because if they believe it is merely a gap, they will assume a judge can fill it using standard tools and your entire argument about the interval collapses. You need to make them feel that a gap implies a frame still exists, whereas your silence is the absence of the frame itself, and if you can make them see that, the Hartians and formalists will have nowhere to stand. You should preempt the Hartian and formalist objections in the first five minutes of your talk so they cannot be sprung on you afterwards, as this will force them to engage with your definition of silence rather than trying to fix your puzzle with their existing tools.

  When you are told that you have misunderstood a distinction nobody ever taught me, you should say I may have misunderstood the distinction, but I have not misunderstood the silence. I am willing to learn the name for it, provided you do not ask me to fill it.
