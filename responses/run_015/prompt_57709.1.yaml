      *   *Most Damaging:* The Hartian/Effectiveness point (Objection 1 & 7 combined). If obedience creates validity, the "silence" argument collapses into standard positivism.
      *   *High Damage:* The Comparativist (Real courts do decide). Undermines the "no legal answer" claim.
      *   *Medium Damage:* The Formalist (Hierarchy). Makes the puzzle seem solved by existing theory.
      *   *Low Damage:* Practitioner (too pragmatic), Historian (descriptive not normative), Grad Students (irrelevant).

