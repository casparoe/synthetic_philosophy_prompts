prompt: |-
  I teach a second-year course that's half decision theory and half philosophy of probability — about 22 students, one 80-minute slot, tables that seat four, and no budget for real money, so stakes have to be chocolate or a couple of points of course credit. Next week I've got a session on the two-envelope set-up (two envelopes, one contains twice what the other contains, you get one, you may look inside, you may then swap) and I really don't want to do what I did last year, which was write the switching argument on the board and then spend forty minutes explaining the flaw. It didn't land: they could recite the objection afterwards and the argument still *felt* right to them, and I think that's because nothing in the session ever cost them anything.

  So: design me a game they actually play. Envelopes in pairs, each pair of students gets one envelope each, they can peek at their own, then decide whether to trade, and I want them to run into the problem in their own choices and in the class's aggregated results rather than in anything I say — I'd rather the words "paradox" and "expected value" don't come out of my mouth until the debrief. Two things I want built in. First, the version where both members of a pair peek and both run the argument: each concludes that trading is better for them, and they trade with each other, which shouldn't be possible, and I want that collision staged so the whole room sees it happen at the same time. Second, one of my students last year proposed a randomized rule — pick some threshold from a very spread-out distribution before looking, then switch if and only if what you see is below it — and claimed this beats both always-switching and always-keeping. I couldn't tell whether he was right or whether he'd just moved the problem somewhere else, and I'd like the activity to have room for that rule, or for you to tell me it doesn't belong. Relatedly: I once tried generating the amounts from something extremely spread out and the running averages just kept lurching around and never settled down, which I *think* is a real feature of the maths and not me mucking up the spreadsheet, but I'm not certain, so if that matters for how I should build the envelopes, say so.

  What I need concretely: the rules, what goes in the envelopes and how I should generate the numbers, the payoff scheme, a minute-by-minute timeline for 80 minutes, and a debrief that maps specific moments in the game onto specific bits of the reasoning — including which premise of the switching argument each moment is supposed to put pressure on. Also tell me what will predictably go wrong: I expect some students to refuse to open their envelope at all (can that be useful instead of a problem?), some to treat it as a mind-reading contest against their partner, and at least one to work out that my supply of chocolate is finite and reason backwards from that. And be honest about which part of the difficulty the game can't reproduce at all and which parts I'll just have to supply myself in the debrief — in particular, I suspect the aggregate data is going to show switching is roughly break-even rather than better, and I want to know what I'm supposed to do with that when it happens.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** 2nd-year Decision Theory & Philosophy of Probability.
      *   **Class Size:** ~22 students.
      *   **Time:** 80 minutes.
      *   **Setup:** Tables of 4 (so 5-6 tables). No real money (chocolate/points).
      *   **Topic:** Two-Envelope Paradox (specifically the switching argument).
      *   **Goal:** Move away from lecture/board-work to an experiential game where students *feel* the paradox through their choices and aggregated results.
      *   **Key Constraints/Requirements:**
          *   Must avoid saying "paradox" or "expected value" until debrief.
          *   Must stage the "both peek and both want to switch" collision visibly.
          *   Must address/incorporate the "randomized threshold" strategy student proposal.
          *   Must address the "heavy-tailed distribution" issue (running averages lurching).
          *   Need concrete rules, envelope contents generation, payoff scheme, timeline, debrief mapping.
          *   Need prediction of failure modes (refusing to peek, mind-reading, finite chocolate reasoning).
          *   Need honesty about what the game *can't* teach (specifically regarding the aggregate data showing break-even vs. better).

  2.  **Deconstruct the Two-Envelope Problem:**
      *   *Standard Setup:* Envelope A has $x$, Envelope B has $2x$. You pick A. You don't know $x$.
      *   *The Argument:* If I switch, I either get $2x$ (gain $x$) or $x/2$ (loss $x/2$). Since probabilities are 50/50, $EV = 0.5(2x) + 0.5(x/2) = 1.25x$. Since $1.25x > x$, I should switch.
      *   *The Flaw:* Treating $x$ as a fixed value in both branches of the conditional probability when it actually represents different amounts ($y$ and $2y$). Or, implicitly assuming a uniform prior over an infinite range.
      *   *The "Both Peek" Variant:* If both players peek, they both see an amount. If they both run the EV calculation based on *their* seen amount, they both think switching is beneficial. This is a zero-sum game (one wins, one loses), so both cannot gain.
      *   *The Threshold Strategy:* Cover's paradox/strategy. If you pick a random threshold $T$ from a continuous distribution, and switch if seen amount $< T$, you have a $>50\%$ chance of ending up with the larger envelope. This is mathematically valid but often confuses the issue of *expected value* vs. *probability of winning*.
      *   *The Distribution Issue:* If the prior distribution of money has infinite mean (e.g., Cauchy or specific Pareto), the expected value calculation breaks down entirely. If the distribution is bounded (finite chocolate), the logic changes at the boundaries.

  3.  **Designing the Game ("The Swap Market"):**
      *   *Objective:* Make the EV calculation feel intuitive, then show the contradiction.
      *   *Pairing:* Tables of 4 mean 2 pairs per table. Let's keep them in pairs for the core mechanic. 11 pairs total.
      *   *Envelope Generation:* This is critical.
          *   If I use a bounded distribution (e.g., \$1 to \$100), students might guess the bounds.
          *   If I use an unbounded-like distribution (powers of 2), the "lurching average" issue arises.
          *   *Decision:* Use a specific set of pre-determined pairs to control the aggregate outcome, but make them *look* random. To address the "lurching average," I need to ensure the total pool has a finite mean so the class aggregate settles, otherwise the debrief gets bogged down in convergence issues rather than the paradox. *Correction:* The prompt asks about the lurching averages. I should acknowledge this. For the *game* to work smoothly in 80 mins, I should use a bounded set but keep the range wide enough to feel open. Let's use powers of 2: (1, 2), (2, 4), (4, 8)... up to (512, 1024). This allows the threshold strategy to work nicely.
          *   *Wait, finite chocolate:* I need to cap the max value. Let's say max chocolate pieces is 16. Pairs: (1,2), (2,4), (4,8), (8,16). I'll prepare multiple sets of these.
      *   *The "Both Peek" Collision:*
          *   Round 1: No peeking. Decide swap or keep.
          *   Round 2: Peek allowed. Decide swap or keep.
          *   *Crucial Mechanism:* To force the collision, I need them to announce their decision *before* swapping. "Show of hands: who wants to swap?" If both raise hands, they swap. If neither, they keep. If one, they swap (but the one who didn't want to is forced? No, that breaks agency).
          *   *Better Mechanism:* They write "SWAP" or "KEEP" on a slip. Reveal simultaneously. If both say SWAP, they swap. If both say KEEP, they keep. If mismatch? They swap (since one wants to). *Actually, the paradox is strongest if they both think they gain.* So if both say SWAP, they swap. The payoff is what matters.
      *   *Payoff:* Chocolate pieces corresponding to the number in the envelope.
      *   *Threshold Strategy:* I need a specific round where they can adopt a "rule" before seeing the number.

  4.  **Drafting the Timeline (80 mins):**
      *   0-10: Setup & Rules (No theory).
      *   10-25: Round 1 (Blind).
      *   25-40: Round 2 (Peek + The Collision).
      *   40-55: Round 3 (The Threshold Strategy).
      *   55-65: Data Aggregation & Confusion.
      *   65-80: Debrief (Connecting to Theory).

  5.  **Refining the Mechanics (Self-Correction):**
      *   *Problem:* If I just give them chocolate, 22 students eating for 15 mins is noisy.
      *   *Solution:* Points on a leaderboard. Chocolate awarded at the end based on points.
      *   *Problem:* The "Both Peek" collision. If Pair A has (\$10, \$20). Student 1 sees 10, thinks "Other is 20 or 5, EV = 12.5, Swap." Student 2 sees 20, thinks "Other is 40 or 10, EV = 25, Swap." They swap. Student 1 gains 10, Student 2 loses 10. Net zero. But both *expected* to gain.
      *   *How to make this visible?* I need a "Decision Reveal" moment. "Everyone who decided to SWAP stand up." If both stand, they high-five and swap.
      *   *The Threshold Strategy:* This is Cover's Strategy. It increases the *probability* of having the larger envelope to $>50\%$, but does it increase *Expected Value*? Not necessarily against a fixed prior, but it beats "always keep" if the prior is unknown. I need to be careful here. The student claimed it beats always-switching/keeping. It beats random guessing (50%). I should let them test it.
      *   *The "Lurching Average":* If I generate amounts from a distribution with infinite mean (like $P(X=2^k) \propto 1/k$), the sample mean diverges. For a class experiment, this is annoying. I will use a *bounded* distribution for the physical game to ensure the class average converges, but I will *mention* the infinite case in the debrief as the "mathematical root" of the paradox. This answers the user's worry: "tell me it doesn't belong" -> It belongs in the debrief, not the game mechanics, otherwise the data is too noisy to interpret in 80 mins.

  6.  **Addressing Specific User Constraints:**
      *   *No "Paradox/EV" until debrief:* Use terms like "Score," "Advantage," "Guess."
      *   *Finite Chocolate:* Students will reason backwards. *Mitigation:* Tell them the "Bank" is external (hypothetical points), chocolate is just a conversion rate at the end. Or, make the max value small enough that running out is unlikely (max 16 pieces per person * 22 = 352 pieces. That's a lot of chocolate. Better to use points).
      *   *Refusing to Peek:* Make it a rule for Round 2 that they *must* peek if they want to use the "value info," but allow a "Blind" option. Actually, the paradox relies on the info. I'll make peeking optional but record who peeked.
      *   *Mind-Reading:* Students might think "If he wants to swap, he must have the low one." I need to prevent communication.
      *   *Aggregate Data:* The user suspects switching is break-even. It *is* break-even (zero sum). The user asks what to do when the data shows this. *Answer:* This is the punchline. The data proves the EV calculation is wrong.

  7.  **Finalizing the Plan:**
      *   **Envelope Prep:** 11 pairs of students. Need 11 sets of envelopes per round. Let's prepare 33 sets total (3 rounds). Values: (2, 4), (4, 8), (8, 16), (16, 32). Use points, not cash.
      *   **Round 1 (Blind):** No peeking. Write Keep/Swap.
      *   **Round 2 (Peek):** Peek. Write Keep/Swap. *Public Reveal of Decision.* This creates the spectacle of everyone standing up to swap.
      *   **Round 3 (Strategy):** Allow them to write a rule (e.g., "Switch if < 10").
      *   **Debrief:** Map the "Everyone stood up" moment to the symmetry argument. Map the "Break-even result" to the Zero-Sum reality. Map the "Threshold" to Cover's strategy (Probability vs EV).

  8.  **Addressing the "Lurching Average" Question:**
      *   User asked: "I once tried generating the amounts from something extremely spread out and the running averages just kept lurching around... tell me it doesn't belong."
      *   *Truth:* It *does* belong mathematically (St. Petersburg-esque issues), but for a pedagogical game with N=22, it creates noise that obscures the lesson. I will advise using a bounded distribution for the *game* to ensure clean data, but explain that the *paradox* relies on the intuition of an unbounded distribution.

  9.  **Addressing the Threshold Strategy:**
      *   User asked: "one of my students... claimed this beats both always-switching and always-keeping."
      *   *Truth:* It beats 50% win rate (probability of holding the larger amount). It does *not* necessarily beat the EV of the other strategies if the prior is specific. But in an ignorance context, it's a valid "good rule." I will include a round for this but clarify the metric (Win Rate vs. Point Total).

  10. **Refining the "Collision":**
      *   To make sure the room sees it: "On the count of three, hold up your card: Green for Keep, Red for Swap." If a table shows two Reds, they swap. The visual of a sea of Red cards is powerful.

  11. **Review against Constraints:**
      *   22 students? Yes (11 pairs).
      *   80 mins? Yes (Timeline looks tight but doable).
      *   No budget? Points + small chocolate reward.
      *   No "EV/Paradox" words? Checked.
      *   Debrief mapping? Will create a specific table for this.
      *   Failure modes? Will list specific mitigations.

  12. **Final Polish:** Ensure tone is supportive but rigorous. Acknowledge the difficulty of teaching this. (Self-Correction: Make sure the "Threshold" round doesn't consume too much time. Keep it simple: "Write a number. If your envelope is less than that, swap.")

  13. **Wait, one nuance on the Threshold Strategy:** If both players use the *same* threshold strategy, does it help? If I see 10, threshold is 15 -> Swap. Partner sees 20, threshold 15 -> Keep. I get 20, they get 10. I win. If I see 20, threshold 15 -> Keep. Partner sees 10, threshold 15 -> Swap. They get 20, I get 10. I lose. It creates a correlation. It increases the probability of the *pair* resolving correctly? No, it increases the individual probability of ending with the higher amount *if* the threshold falls between the two amounts. I need to be precise in the debrief so I don't teach misinformation. The strategy gives $P(\text{win}) > 0.5$. It does not guarantee higher EV if the amounts are fixed. I will frame it as "Can you beat a coin flip?" rather than "Can you maximize points?" to avoid EV confusion in that specific segment.

  14. **Final check on "Lurching Averages":** The user is right. If the prior is $P(X=2^k) = 2^{-k}$, the expected value is finite. If $P(X=2^k) \propto 1/k$, it diverges. For the class, use a uniform distribution over a set of pairs (e.g., 10 pairs of (2,4), 10 pairs of (4,8)...). This ensures the class aggregate converges quickly to the true mean, preventing the "lurching" distraction during the game. I will explicitly advise this.

  15. **Structure the Output:**
      *   Game Overview.
      *   Preparation (Envelopes/Points).
      *   Timeline (Minute-by-minute).
      *   The Rules (Scripted to avoid forbidden words).
      *   Debrief Guide (Mapping moments to concepts).
      *   Failure Modes & Fixes.
      *   The "Lurching Average" & Threshold answers.

