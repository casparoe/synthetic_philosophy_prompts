answer: |-
  This is a classic pedagogical challenge: the Two-Envelope Paradox is cognitively sticky because the error is subtle (equivocation on the variable $x$), and abstract explanation rarely dislodges the intuition. Making it embodied and financial (even with chocolate points) is the right move.

  Here is a complete design for the 80-minute session, optimized for 22 students, tables of four, and your specific constraints.

  ### 1. The Setup & Materials

  **The "Currency":**
  Do not use physical chocolate for the envelopes. It is noisy, crumbly, and finite. Use **"Lab Points."**
  *   **Conversion:** 100 Lab Points = 1 large chocolate bar (or equivalent).
  *   **Why:** This solves the "finite chocolate" backward induction. Students can't count the total bars in your bag to deduce the maximum envelope value. It also allows you to handle large numbers without running out of stock.

  **The Envelopes (Preparation):**
  You need 11 pairs of students. You will run 3 Rounds. You need 33 sets of envelopes total.
  *   **Distribution:** To avoid the "lurching average" problem during the game (which distracts from the paradox), **do not** use a power-law or infinite-mean distribution for the physical game. Use a **bounded uniform distribution of pairs.**
  *   **The Pairs:** Prepare 11 sets of each of the following pairs (33 sets total):
      *   (10, 20)
      *   (20, 40)
      *   (40, 80)
      *   (80, 160)
      *   (160, 320)
  *   **Why:** This ensures the class aggregate *will* converge to a stable mean, making the "break-even" result statistically significant rather than noisy. It keeps the max value (320) high enough to feel like "real" stakes but low enough that you don't owe them a house.
  *   **Physical:** 66 opaque envelopes. Write the point value on a slip of paper inside. Mark the outside of each pair with a tiny, invisible-to-students ID (e.g., a dot color) so you can verify later if they actually swapped.

  **The Decision Cards:**
  Each student needs 3 small cards (or slips of paper) for the 3 rounds. They will write **KEEP** or **SWAP** on them.
  *   **Color coding (Optional but recommended):** Green for KEEP, Red for SWAP. This makes the "Collision" visual instant.

  ---

  ### 2. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute envelopes (1 per student). Pair them up at tables. Explain Lab Points. **Forbidden Words:** Do not say "Probability," "Expected Value," "Paradox," or "Random." Call it "The Game." |
  | **05–20** | **Round 1 (Blind)** | **Rule:** You may *not* open the envelope. Write KEEP or SWAP on Card 1. <br>**Action:** Reveal cards. If one says SWAP, they trade. If both SWAP, they trade. If both KEEP, no trade. <br>**Payoff:** Open envelopes, record points. |
  | **20–35** | **Round 2 (Peek)** | **Rule:** You *may* open your envelope and see your points. Write KEEP or SWAP on Card 2. <br>**The Collision:** On count of three, everyone holds up their card simultaneously. <br>**Action:** Execute trades based on cards. <br>**Payoff:** Record points. |
  | **35–50** | **Round 3 (Strategy)** | **Rule:** Before receiving envelopes, write a **Personal Rule** (e.g., "Switch if < 50"). Receive envelopes, peek, apply rule. <br>**Action:** Execute trades. <br>**Payoff:** Record points. |
  | **50–60** | **Aggregation** | Collect data. Calculate Class Average for Keepers vs. Switchers for each round. Project on board. |
  | **60–80** | **Debrief** | Connect game moments to theory. Address the Threshold Strategy. Address the "Lurching Average." |

  ---

  ### 3. The Rules (Scripted to Avoid Forbidden Words)

  **Introduction (00–05):**
  > "Welcome to The Exchange Game. You are paired with the person next to you. Each of you has an envelope containing Lab Points. In every pair, one envelope contains exactly twice the points of the other.
  >
  > Your goal is to maximize your points. At the end of class, points convert to chocolate.
  >
  > We will play three rounds. In each round, you will decide whether to keep your envelope or swap with your partner. I will not tell you how to decide. I will only enforce the rules."

  **Round 1 (Blind) (05–20):**
  > "Round 1. Do not open your envelope. You have no information about the amount inside. Write KEEP or SWAP on your card.
  >
  > **The Trade Rule:** If *either* of you writes SWAP, the envelopes swap. (This prevents the 'I wanted to but you didn't' deadlock and ensures maximum trading volume).
  >
  > Reveal cards. Execute trades. Open and record your score."

  **Round 2 (Peek & Collision) (20–35):**
  > "Round 2. You may open your envelope and look at your points. You still do not know your partner's points. Write KEEP or SWAP.
  >
  > **The Reveal:** When I count to three, hold your card up high so the whole room sees it. 1, 2, 3."
  > *(This is the critical moment. Expect a sea of Red/SWAP cards.)*
  >
  > "Look around. If you are holding SWAP, and your partner is holding SWAP, you both believe you are making a advantageous move. Execute the trade. Record scores."

  **Round 3 (Threshold) (35–50):**
  > "Round 3. Before I hand out envelopes, write a number on your card. This is your **Threshold**.
  >
  > **Rule:** When you open your envelope, if your points are *lower* than your Threshold, you must SWAP. If higher, you must KEEP.
  >
  > Distribute envelopes. Apply your rule. Trade. Record scores."

  ---

  ### 4. The Debrief (Mapping Moments to Theory)

  This is where you earn your pay. Do not lecture until now. Use their data.

  **Moment 1: The Sea of Red Cards (Round 2)**
  *   **Observation:** "In Round 2, almost everyone chose SWAP after looking. Many tables had two SWAP cards."
  *   **The Pressure Point:** This attacks the **Symmetry Premise**.
  *   **Discussion:** "If you both swap, one of you gains points and one of you loses points. The total points on this table did not change. Yet, before you swapped, both of you calculated that swapping would *increase* your score. How can a zero-sum transaction be positive-sum for both parties?"
  *   **Theory Connection:** This introduces the flaw in treating the amount in your hand ($x$) as fixed while the other envelope varies ($2x$ or $0.5x$). In reality, if you have $x$, the other is fixed relative to you. If you both have $x$ and $2x$, you can't both be holding the 'smaller' amount.

  **Moment 2: The Aggregate Data (Round 1 & 2)**
  *   **Observation:** "Look at the class average. Switchers scored ~X, Keepers scored ~Y. They are roughly the same."
  *   **The Pressure Point:** This attacks the **Expected Value Calculation**.
  *   **Discussion:** "The argument on the board last year said switching adds 25% value. If that were true, the Switchers' average should be 25% higher than Keepers. It isn't. It's break-even. Why?"
  *   **Theory Connection:** The variable $x$ in the formula $0.5(2x) + 0.5(0.5x)$ is not the same $x$ in both branches. In one branch, $x$ is the smaller amount; in the other, $x$ is the larger amount. You cannot factor it out.

  **Moment 3: The Threshold Strategy (Round 3)**
  *   **Observation:** Did the Threshold players win more often (have the larger envelope more than 50% of the time)?
  *   **The Pressure Point:** Distinguishing **Probability of Winning** vs. **Expected Value**.
  *   **Discussion:** "Some of you used a threshold rule. Did this increase your average points? Probably not significantly. Did it increase your chance of ending with the *larger* envelope compared to a coin flip? Yes."
  *   **Theory Connection:** This is **Cover's Strategy**. It exploits the fact that if your threshold falls *between* the two envelope values, you are guaranteed to choose correctly. It beats random guessing (50% win rate), but it does not solve the EV paradox. It shifts the goal from "maximize value" to "maximize probability of being right."
  *   **Verdict on Student's Claim:** Tell the class: "The student from last year was half-right. The rule beats 'always keep' in terms of win-rate, but it doesn't create free points out of nowhere."

  **Moment 4: The "Lurching Average" Question**
  *   **Discussion:** "I deliberately capped the maximum points at 320 today. What if I told you the points could be *any* number, forever?"
  *   **Theory Connection:** This addresses your spreadsheet worry. If the prior distribution of money has an **infinite mean** (e.g., a specific heavy-tailed distribution), the expected value of switching *is* undefined or infinite, and the averages *will* lurch forever.
  *   **Pedagogical Choice:** "In the real world (and this classroom), resources are finite. The paradox feels strong because our brains treat small numbers as if they come from an infinite distribution. The math breaks when we assume a uniform prior over an infinite range."

  ---

  ### 5. Predictable Failure Modes & Fixes

  **1. The "Finite Chocolate" Backward Induction**
  *   **Risk:** A student calculates: "There are 22 of us. If max points is 320, he needs 7000 points total. He doesn't have that much chocolate. The max envelope must be 20."
  *   **Fix:** Use Lab Points. Explicitly state: "Points are hypothetical. Chocolate is a conversion rate at the end. I have a budget for the top 3 scorers, not a fixed pot." This decouples the envelope cap from the physical reward.

  **2. Refusing to Peek (Round 2)**
  *   **Risk:** Students treat it as a trust game. "If I don't peek, I can't be disappointed."
  *   **Fix:** Make it useful. "If you choose not to peek, you must submit a BLIND card. I will record this separately." In the debrief, highlight that Blind players performed exactly the same as Peek players. This reinforces that the *information* gained by peeking was illusory.

  **3. Mind-Reading / Signaling**
  *   **Risk:** Partners signal "I have the low one, please swap."
  *   **Fix:** Enforce strict silence during decision time. If you see whispering, disqualify that pair's Round 2 score (make it 0). The threat usually suffices.

  **4. The "Break-Even" Data Confusion**
  *   **Risk:** You worry the data will show switching is break-even, and you don't know how to spin that.
  *   **Fix:** **Do not spin it.** That is the lesson. If the data shows switching is better, your experiment failed (or you have a biased distribution). If the data shows break-even, the paradox is debunked empirically.
  *   **Script:** "The math said you should gain 25%. The data says you gained 0%. When math and data fight, data wins. So where did the math go wrong?" (Then proceed to the $x$ equivocation explanation).

  ---

  ### 6. Answers to Your Specific Technical Questions

  **Q: Does the Randomized Threshold Rule belong?**
  **A:** Yes, but keep it distinct from the EV argument.
  The student was describing **Cover's Switching Strategy**.
  *   **Math:** If you choose a threshold $T$ from a distribution that has support over all possible envelope values, and switch iff $Value < T$, your probability of holding the larger envelope is $0.5 + 0.5 \times P(\text{one value} < T < \text{other value})$. This is strictly $> 0.5$.
  *   **Caveat:** This increases the *probability of winning*, not necessarily the *Expected Value* of the winnings (depending on the prior).
  *   **In Class:** Run it as Round 3. Ask: "Did this make you win more often?" (Yes). "Did it make you richer?" (Maybe not). This distinguishes *decision rules* from *value maximization*.

  **Q: The "Lurching Average" (Heavy Tails)**
  **A:** You were not mucking up the spreadsheet.
  *   **Math:** If the prior distribution of the money $P(X)$ decays slowly enough (e.g., $P(X=2^k) \propto 1/k$), the Expected Value is infinite. In simulation, the sample mean will never converge; it will lurch upwards every time a rare, huge number appears.
  *   **Pedagogy:** **Do not do this in the game.** With only 22 students, a heavy-tailed distribution will result in noise that looks like error, not math. One pair getting (10000, 20000) will skew the whole class average.
  *   **Recommendation:** Use the bounded distribution (10 to 320) for the *activity* so the data is clean. Use the "Infinite Mean" concept in the *debrief* to explain why the paradox feels so compelling intuitively (our brains assume the tail is fatter than it is).

  **Q: What if the aggregate data shows switching is roughly break-even?**
  **A:** **Lean into it.**
  *   This is the strongest evidence against the switching argument.
  *   **Script:** "The switching argument claims you gain value. The market (this class) says you don't. The flaw must be in the assumption that the other envelope is equally likely to be double or half *regardless of what you see*. In reality, if you see 320 (the max), you know the other is 160. The probability isn't 50/50 at the boundaries. And if it's not 50/50 at the boundaries, the 'uniform 50/50' assumption is suspect everywhere."

  ### Summary Checklist for You
  1.  **Prep:** 33 sets of envelopes (values 10-320), 66 decision cards (Red/Green), Point ledger.
  2.  **Discipline:** Do not say "Expected Value" until minute 60.
  3.  **Visual:** Ensure the Round 2 "Card Reveal" is simultaneous and high-visibility.
  4.  **Debrief:** Anchor every theoretical point to a specific moment they just experienced (The Red Cards, The Break-Even Score, The Threshold Rule).

  This structure turns the paradox from a logical puzzle into an empirical failure they participated in, which is much harder to ignore.
