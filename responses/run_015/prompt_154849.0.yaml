answer: |-
  The pipeline you describe—collecting moral judgments, statistically scrubbing them of context-dependent variances, and treating the residual as "genuine preference"—presupposes a specific and contentious architecture of the moral mind. It operationalizes a theory of **Latent Preference Realism** undergirded by a **Dual-Process Hierarchy**.

  Here is a reconstruction of the implicit metaphysics, an analysis of its requirements, and a sketch of the alternative protocol you requested.

  ### 1. The Presupposed Theory of Moral Psychology

  The pipeline relies on **Preference Purificationism**. This view combines three distinct theoretical commitments:

  *   **Ontological Realism about Preferences:** It assumes moral preferences exist as latent, stable mental states *prior* to and *independent* of their expression. The judgment is a measurement of a pre-existing fact about the agent, not a construction generated in the moment of elicitation.
  *   **Dual-Process Normativity:** It implicitly adopts a hierarchy where "System 2" (reflective, deliberative, slow) cognition is the locus of the *true* self, while "System 1" (heuristic, emotional, fast) responses are sources of interference. Framing effects and order effects are categorized as performance errors, not competence features.
  *   **Context-Independence:** It assumes that a moral preference should ideally be invariant to irrelevant contextual details (e.g., whether a dilemma is presented visually or textually). If the preference changes based on framing, the pipeline assumes the *preference* didn't change, but the *measurement* was corrupted.

  In short, the pipeline treats moral psychology like signal processing: there is a true signal (the moral will) obscured by noise (cognitive bias and social pressure).

  ### 2. Stable Core vs. Convergence

  Does this require a stable core, or only convergence?

  **It strictly requires a recoverable stable core.**
  Statistical convergence alone is insufficient. If preferences merely "converge" after de-biasing but do not map onto a coherent, underlying utility structure, the reward model will fail to generalize to out-of-distribution scenarios. The pipeline presupposes that the "residual data" approximates a **coherent utility function**.

  If moral psychology were fundamentally fragmented, contradictory, or essentially context-dependent (i.e., if the framing *constitutes* the choice rather than distorting it), the de-biasing process would not reveal a "truer" preference; it would simply produce an artificial average of incommensurable states. Therefore, the pipeline requires that there is a **normatively privileged state of the agent** (the de-biased state) that is more "real" than the empirical state.

  ### 3. Compatibility with "Biases as Commitments"

  The pipeline is **fundamentally incompatible** with the view that biases are constitutive moral commitments.

  *   **Loss Aversion:** In the pipeline, loss aversion is a distortion of value estimation. In the alternative view, loss aversion might be a moral stance regarding the sanctity of entitlement or the special obligation to preserve the status quo. Removing it alters the value, not just the measurement.
  *   **In-Group Favoritism:** The pipeline treats this as a bias to be corrected toward impartiality. The alternative view might hold that partiality is a core moral duty (e.g., special obligations to family).
  *   **Framing Effects:** The pipeline assumes the *logic* of the dilemma matters, not the *presentation*. The alternative view argues that how a problem is framed activates different moral schemas (e.g., care vs. justice), and suppressing this erases moral nuance.

  By defining these phenomena as "noise" to be minimized via loss functions, the pipeline makes an *a priori* normative claim: **Impartiality, consistency, and context-independence are higher moral goods than the specific content of the biased preferences.**

  ### 4. Implicit Metaphysics of Preference

  We can reconstruct the metaphysics embedded in this engineering practice as follows:

  | Dimension | The Pipeline's Metaphysics |
  | :--- | :--- |
  | **Ontology** | **Realism:** Preferences are entities that exist independently of their expression. |
  | **Epistemology** | **Fallibilism + Correctionism:** Access to preferences is error-prone but correctable via statistical inference. |
  | **Agency** | **The Idealized Agent:** The "true" agent is the one who has been de-biased. The empirical agent is a corrupted version of the ideal. |
  | **Structure** | **Atomism:** Complex moral judgments can be decomposed into independent variables (bias vs. signal). |
  | **Temporality** | **Stability:** True preferences are diachronically stable; fluctuations are noise. |

  This is a **Platonic metaphysics**: the empirical world of human judgment is a shadow of the true world of rational preference, and the AI engineer acts as the philosopher-king who can discern the forms behind the shadows.

  ### 5. Strict Requirements vs. Mere Accommodations

  To distinguish what is essential to this approach from what is incidental:

  **Strictly Required:**
  1.  **Normative Hierarchy:** The assumption that the de-biased state is *morally superior* or *more authentic* than the raw state. Without this, there is no justification for discarding the raw data.
  2.  **Separability:** The mathematical possibility of decomposing a judgment $J$ into $J = P + B + \epsilon$ (Preference + Bias + Error). If bias and preference are entangled (non-separable), the pipeline collapses.
  3.  **Generalizability:** The belief that preferences extracted in simplified dilemmas (trolley problems) transfer to complex real-world contexts once bias is removed.

  **Merely Accommodated:**
  1.  **Specific Statistical Techniques:** Whether one uses Bayesian hierarchical modeling or frequentist regression to de-bias is incidental.
  2.  **Individual vs. Aggregate:** The pipeline can work with individualized reward models or a single global model, provided the de-biasing logic holds.
  3.  **Source of Bias:** It does not matter *why* the bias exists (evolutionary, cultural, cognitive), only that it *can* be modeled as noise.

  ### 6. Alternative Protocol: Constitutive Elicitation

  If we treat systematic deviations (biases) as potential values rather than errors, the elicitation protocol shifts from **Signal Processing** to **Hermeneutics**. The goal is no longer to find the "true" preference hidden beneath the bias, but to map the topology of values that *includes* the bias.

  **Name:** Context-Gated Value Elicitation (CGVE)

  **Core Principles:**
  1.  **Bias as Feature:** Framing effects are treated as evidence of context-sensitive moral schemas, not measurement error.
  2.  **Meta-Preference Elicitation:** Instead of asking "What do you choose?", ask "Under what conditions does this choice feel right?"
  3.  **Non-Transitivity Acceptance:** The model allows for intransitive preferences if they reflect conflicting moral duties (e.g., Justice vs. Mercy) rather than forcing coherence.

  **Protocol Design:**

  1.  **Variable Framing as Data:**
      *   *Standard:* Present Trolley Problem in Frame A and Frame B; average the results to cancel framing.
      *   *Constitutive:* Present Frame A and Frame B. If the user switches choices, trigger a **Meta-Cognitive Query**: *"You chose to save the five in the first version but the one in the second. What changed in the situation that mattered to you?"*
      *   *Output:* A tagged value structure (e.g., `Value: Impartiality [Weight: High]`, `Value: Agency [Weight: High]`, `Context_Gate: Physical_Proximity`).

  2.  **Loss Aversion as Entitlement:**
      *   *Standard:* Correct for loss aversion to reveal risk-neutral utility.
      *   *Constitutive:* Model loss aversion as a **Status Quo Preservation Parameter**.
      *   *Output:* The reward function includes a term for `Disutility_of_Loss > Utility_of_Equivalent_Gain`. This is not an error term; it is a protected value representing security or ownership rights.

  3.  **In-Group Favoritism as Partiality:**
      *   *Standard:* Penalize in-group bias to enforce impartiality.
      *   *Constitutive:* Elicit the **Radius of Moral Concern**.
      *   *Output:* A dynamic weighting function where `Reward = f(Distance_From_Agent)`. The AI learns that the human values their kin differently than strangers, encoding this as a legitimate moral parameter rather than a bug to be fixed.

  4.  **Model Architecture:**
      *   Instead of a single scalar reward model $R(x)$, use a **Mixture-of-Experts** or **Context-Gated Network**.
      *   Different "expert" networks activate based on the framing/context.
      *   The "alignment" is not to a single coherent utility function, but to a **stable policy for navigating conflicting values**.

  **Implication:**
  In this alternative, the AI does not optimize for what the human *would* want if they were perfectly rational. It optimizes for what the human *does* want, including their "irrational" attachments, temporal inconsistencies, and partialities. The risk is that the AI encodes human prejudices as values; the benefit is that it respects human moral psychology as it actually exists, rather than as ethicists wish it existed.
