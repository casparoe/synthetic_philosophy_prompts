answer: |-
  You are not overthinking this. You have stumbled onto the central unsolved problem in scalable oversight and AI safety: **the boundary problem.**

  Your intuition is correct, but your current principle mixes *epistemic* concerns (can we get the right answer?) with *normative* concerns (who is responsible for the value judgment?). These are distinct failure modes. The medical/hiring cases fail because information is lost (Competence). The product decision case fails because responsibility is evaded (Alignment).

  To give this to a junior, you need a single meta-principle with two operational clauses.

  ### The Principle of Uncut Dependencies

  **Statement:** A task may be decomposed only if no *causally relevant dependency* crosses the boundary between sub-tasks, and no *normatively relevant weight* is filtered out by the recombination rule.

  **Clause 1 (Competence / Factual):** You cannot split $X$ and $Y$ into separate tasks if the truth of the conclusion depends on the *interaction* between $X$ and $Y$, unless there is a specific sub-task dedicated to assessing that interaction.
  **Clause 2 (Alignment / Normative):** You cannot decompose a value judgment into factual sub-questions if the recombination rule does not explicitly require a human to take ownership of the trade-offs between those facts.

  ---

  ### Why this principle forces your verdicts

  Here is how the principle dissects your specific cases.

  **1. The Plane vs. The Patient (Clause 1)**
  *   **Plane:** A wing failure grounds the plane regardless of the engine status. The systems are *conjunctive*. There are no interaction effects between the lavatory supply and the hydraulic pressure. The boundary cuts nothing. **Verdict: Fine.**
  *   **Patient:** A symptom in the cardiac system combined with a symptom in the renal system might indicate a specific systemic disease that neither indicates alone. The diagnosis depends on the *correlation* across boundaries. Splitting them destroys the signal. **Verdict: Not Fine.**
  *   **Why your old principle failed:** You thought (1) "sub-judgment easier" was the key. But the organ assessment *is* easier for the specialist. The failure isn't in the sub-task; it's in the *recombination* which lacks the interaction term.

  **2. Hiring vs. Restaurant Reviews (Clause 1)**
  *   **Restaurant:** Food quality is largely independent of ambiance. A 10/10 steak in a 2/10 dive bar is still a specific, describable experience. Averaging loses nuance, but it doesn't lie. **Verdict: Fine (mostly).**
  *   **Hiring:** A candidate with 10/10 Skill and 2/10 Culture Fit is often a *worse* hire than a 6/6, because the toxicity of the former destroys the team. The value is non-linear. Mechanical weighting assumes linearity. **Verdict: Not Fine.**
  *   **The Sacrifice:** To make this principle hold, you must admit your "Restaurant" verdict is technically lossy. Professional critics don't average; they write a narrative. But for a consumer app, the loss is acceptable. You have to tell your junior: *"Restaurant averaging is a pragmatic exception, not a theoretical success. It works because the cost of error is low."*

  **3. Fact-Checking vs. "Misleading" (Clause 1)**
  *   **Atomic Claims:** Truth is local. "The earth is flat" is false regardless of context. **Verdict: Fine.**
  *   **Misleading:** "Misleading" is a property of the *arrangement* of claims. It is an interaction effect. Checking claims in isolation explicitly filters out the juxtaposition. **Verdict: Not Fine.**

  **4. Product Decision (Clause 2)**
  *   **The Case:** You decomposed "Should we build this?" into "Market size," "Readiness," "Legal." You instructed workers to ignore "Good for the world."
  *   **The Failure:** The decomposition worked perfectly for competence (the facts are accurate). But "Should we build this?" is a normative question. By filtering out the normative weight in the sub-tasks, and having no recombination step that forces a human to weigh the facts against ethics, you have laundered the responsibility.
  *   **Verdict:** Not Fine. This is not a competence error; it is an **accountability error.**

  ---

  ### Verdicts on New Cases

  Hand this to your junior and ask them to apply the **Uncut Dependencies** rule.

  **1. Grading an undergrad philosophy essay with a rubric of sub-scores.**
  *   **Verdict:** **Not Fine (for final grade), Fine (for feedback).**
  *   **Reasoning:** Philosophy essays are holistic arguments. A brilliant insight (Novelty) might compensate for poor citation (Rigor). A rubric that mechanically sums scores punishes uneven but brilliant work. It cuts the dependency between "argument quality" and "expression."
  *   **Fix:** Use sub-scores for feedback, but require the grader to write a holistic justification for the final letter grade that can override the sum.

  **2. A jury asked to answer special interrogatories instead of a general verdict.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This is the legal version of the medical diagnosis. A defendant might have technically committed the act (Fact A) and technically caused harm (Fact B), but the *justice* of the verdict depends on the narrative whole (e.g., self-defense, entrapment). Special interrogatories force the jury to cut dependencies between facts and moral context.
  *   **Risk:** It allows judges to override the jury's sense of justice by manipulating the logical combination of facts.

  **3. A data safety monitoring board (DSMB) deciding whether to stop a trial early.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** DSMBs use pre-defined statistical boundaries (e.g., "if p-value < 0.001 for harm, stop"). This is a conjunctive rule similar to the plane pre-flight. The "interaction" is handled by the statistical model, not the human decomposition. The humans are checking if the *numbers* cross the line, not interpreting the patient narratives.
  *   **Caveat:** If they start debating *why* the numbers are off without looking at the aggregate data, they risk the medical error.

  **4. A manager deciding a promotion purely by ticking off rubric bullets.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** Same as Hiring. Leadership potential is emergent. Someone might hit every bullet but lack "executive presence" (an interaction trait). Ticking boxes creates "paper promoters."
  *   **Fix:** The rubric is input; the manager must write a narrative endorsement that owns the decision.

  ---

  ### The Distillation Step: The Hidden Recombination

  You asked specifically about the distillation step (training a model to jump straight to the answer). This is where your scalable oversight pipeline introduces a third failure mode: **Opacity of Recombination.**

  In your human pipeline, there is a recombination step (you merging the junior summaries). Even if that step is flawed, it is *visible*. When you distill the pipeline into a single model:

  1.  **Inheriting Blindness:** If the decomposition was lossy (e.g., the medical case), the distilled model learns to be blind in the exact same way. It learns that "Organ A + Organ B" never implies "Systemic Disease" because the training data (the pipeline output) never made that connection. **Distillation amplifies decomposition errors.**
  2.  **The Context Switch:** You noted the right decomposition is context-dependent. A human supervisor might choose to decompose a lease by clause, but decompose a SaaS agreement by risk-type. The distilled model learns *one* decomposition strategy (the one used most often in training). When the context shifts, the model applies the wrong decomposition strategy without flagging it.
  3.  **Can Distillation Succeed Where Decomposition Fails?**
      *   **Theoretically, Yes:** If you train the model on the *original documents* and the *final human verdicts* (skipping the decomposed intermediate outputs as training targets), the model might learn to attend globally, bypassing the lossy decomposition.
      *   **Practically, No:** In scalable oversight, you usually don't have the "final human verdict" on the long document (that's why you're decomposing). You only have the pipeline's output. Therefore, the model is learning to mimic the pipeline's blind spots.
      *   **The Danger:** The distilled model becomes a "competence zombie." It produces answers that look like the expert pipeline's output but lacks the hidden context the human supervisor used to adjust the recombination. It creates a false sense of security.

  ### Summary for the Junior

  "Here is the rule: **Do not cut across dependencies.**

  1.  **Factual:** If the answer depends on how Part A relates to Part B, you cannot have one person check A and another check B unless a third person checks 'A vs B'.
  2.  **Normative:** If the decision requires weighing values (safety vs. speed, profit vs. ethics), you cannot reduce it to factual checkboxes. A human must sign the final verdict and own the trade-off.
  3.  **Distillation:** If we train a model to skip the steps, it will learn our blind spots. Never distill a pipeline that you wouldn't trust to make the decision blindly."

  ### Which Verdict to Give Up?

  You must nuance the **Restaurant Review**.
  Strictly speaking, averaging food/service/ambiance *is* lossy. A 5-star meal ruined by a racist host is not a "4-star experience" (average of 5, 5, 2); it is a 0. The interaction between Service and Ambiance (the social contract of the room) is cut.
  *   **Correction:** It is "Fine" only because the cost of error is low. If you were writing a *legal brief* about a restaurant contract, averaging would be unacceptable. Tell your junior: *"Decomposition is a tool for risk management. If the risk of a wrong average is low (dinner), do it. If the risk is high (diagnosis, hiring, law), do not."*

  This aligns your "Ownership" intuition (Clause 3 in your draft) with the technical reality. You only need to "own" the judgment when the cost of the decomposition's blind spots exceeds the benefit of the decomposition's efficiency.
