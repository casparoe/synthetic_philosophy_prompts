answer: |-
  There is no single, canonical term that captures precisely the predicament you describe, though it sits at the heart of contemporary consequentialist debate. Your description is unusually precise, isolating a structural feature of the debate that is often treated as a mere preliminary rather than the substantive pivot point.

  The closest established concept is **the Problem of Moral Individuation**. This refers to the question of what constitutes a single unit for the purpose of moral counting. However, the literature usually treats this as a metaphysical question (what is a person?) rather than the methodological observation you have made: that the choice of unit is underdetermined by the facts and functions as a lever to alter verdicts.

  In the specific context of the utilitarian defence you outline, the move is most commonly discussed under the banner of **Reductionism** (following Derek Parfit) or the **Ex Ante/Ex Post distinction** (following Harsanyi versus Rawls). Yet neither of these labels captures the general structural point you have identified: that *any* aggregation principle requires a stipulation of the unit of account, and that shifting this stipulation can dissolve objections without addressing their underlying force.

  Here is the analysis of the carving you requested, distinguishing the genuine advance from the evasion.

  ### 1. The Structure of the Move

  You have correctly identified that the dispute is not merely about whether to sum, but *what* is being summed. Let us call this **Unit Relativity**.

  The critic (typically Rawlsian) asserts that the **Person-as-a-Whole** is the only legitimate unit of moral account. This is because rights, harms, and complaints are lodged by persons over the course of a life.
  The defender (Utilitarian) asserts that the **Person-Moment** or **Experience** is the legitimate unit. This is because pleasure and pain occur in the present; the "person" is just a bundle of these experiences.

  When the defender shifts from summing over persons to summing over person-moments, they are not making a mathematical error; they are making a metaphysical claim. They are claiming that the boundary between persons is no more morally significant than the boundary between Tuesday-me and Wednesday-me.

  Your insight is that this metaphysical claim is often smuggled in as a technical adjustment to the bookkeeping. It allows the utilitarian to say, "We are still doing the same thing (maximising the sum), we have just clarified what the sum is *of*."

  ### 2. Distinguishing Advance from Evasion

  You ask for a principled line between re-specifying the unit in a way that is a genuine moral advance (counting people rather than households) and a way that is a dodge (counting prospects rather than outcomes).

  The principle is this: **The unit of account must match the locus of moral patienthood.**

  A moral theory must identify *what* it is that matters. If what matters is welfare, we must ask: where does welfare reside? If what matters is rights, we must ask: who holds rights?

  **Case A: Households vs. Individuals (Genuine Advance)**
  Moving from counting households to counting individuals is progress because the locus of suffering and agency is the individual. A household does not feel pain; the people within it do. To count households is to introduce an arbitrary aggregation *below* the level where value actually inheres. It obscures distribution (one miserable person in a happy household is counted as happy). Correcting this aligns the bookkeeping unit with the metaphysical reality of where value exists. This is not a dodge; it is a correction of granularity to match the locus of value.

  **Case B: Persons vs. Person-Moments (The Evasion)**
  Moving from counting persons to counting person-moments is often a dodge because it misaligns the bookkeeping unit with the structure of complaint. While pain is felt in a moment, *harm* is often suffered over a life. A person has a prudential unity; they care about their future. If I sacrifice my leg today for a benefit tomorrow, I am compensated *within my life*. If you sacrifice my leg for someone else's benefit, I am not.
  By dissolving the person into moments, the utilitarian removes the entity that is capable of being "wronged" in the long term. The victim of the sacrifice no longer exists as a unified claimant in the calculus; there is only a moment of pain and a moment of gain elsewhere. This changes the verdict by eliminating the claimant, not by answering the claim.

  **Case C: Ex Post vs. Ex Ante (The Evasion)**
  Your example of the risk policy illustrates this perfectly.
  *   **Ex Post:** We count actual outcomes. One person loses a leg; 9,999 gain convenience. The loser has a clear complaint.
  *   **Ex Ante:** We count prospects. Everyone accepts a risk for a benefit. No one has a complaint because everyone accepted the same lottery.

  This is a dodge because moral status is typically determined by what happens to you, not merely by the risks you took. If the lottery lands on me, my actual suffering is not negated by the fact that I previously accepted the risk. The *ex ante* shift changes the unit from the **Actual Victim** to the **Risk-Taker**. While risk-taking is morally relevant, it does not erase the distinctness of the person who ends up bearing the burden. The *ex ante* description makes the situation look like a within-life trade-off (I risk a loss for a gain), but it is not. In a within-life trade-off, the *same* consciousness bears the loss and reaps the gain. In the risk case, the *actual* loser bears the loss, while the *actual* gainers are different people. The *ex ante* perspective papers over this by focusing on the hypothetical before the separation of fates occurs.

  ### 3. Why "Denomination" Was Incorrect

  You were right to doubt "the denomination problem". Redenominating a currency (e.g. removing two zeros from the Franc) leaves all real ratios unchanged. It is purely notational.

  In the cases you describe, changing the unit *does* change the ratios. It changes the verdict. A better economic metaphor might be **changing the basis of consolidation**. In accounting, a parent company can choose to consolidate subsidiaries in different ways. If they consolidate by division, they see one picture; if they consolidate by region, they see another. Neither is mathematically wrong, but one might hide a loss that the other reveals.

  In ethics, this is not just hiding a loss; it is deciding whether the loss counts as a loss *for someone*.

  ### 4. The General Predicament

  You suspect this is a general phenomenon beyond ethics, citing biology. You are correct. This is a version of the **Problem of Scale** or **Granularity** in complex systems.

  *   **In Biology:** Is the unit of selection the gene, the organism, or the group? Evolutionary verdicts change depending on which unit you sum fitness over. A gene might be "selfish" (good for the gene) while killing the organism (bad for the organism). Choosing the gene as the unit makes the behaviour look rational; choosing the organism makes it look pathological.
  *   **In Economics:** Is welfare measured by GDP (national unit) or per capita income (individual unit)?
  *   **In Ethics:** Is welfare measured by total sum (classical utilitarianism) or average sum (average utilitarianism)?

  The predicament is that the subject matter (biology, society, morality) does not dictate the unit of analysis. The theorist must impose one. When the theorist imposes a unit that favours their theory, and claims it is merely a "technical clarification," they are engaging in the move you have identified.

  ### 5. Conclusion and Definition

  Since there is no established name that captures the *strategic underdetermination* of the unit, I propose we define the phenomenon you have isolated as **The Problem of Moral Granularity**.

  **Definition:** The Problem of Moral Granularity arises when a moral theory's verdict depends on the stipulated unit of aggregation, where the subject matter underdetermines the correct unit, and shifting the unit alters the moral status of the action without altering the physical facts.

  **The Test for Evasion:**
  To distinguish a genuine advance from a dodge within this problem, apply the **Complaint Test**:
  Does the chosen unit correspond to the entity capable of lodging a coherent moral complaint?

  *   **Individuals vs. Households:** An individual can complain of pain; a household cannot. Counting individuals is progress.
  *   **Persons vs. Moments:** A person can complain of a ruined life; a moment cannot complain at all. Counting moments is a dodge.
  *   **Ex Post vs. Ex Ante:** An actual victim can complain of injury; a risk-taker (who was not injured) cannot complain of the injury they did not suffer. Counting ex ante prospects is a dodge if it silences the actual victim's complaint.

  The utilitarian defence you describe relies on shifting the granularity to a level where the "distinctness of persons" objection cannot gain a foothold. If the unit is the experience, there are no persons to be distinct. If the unit is the ex ante prospect, there are no distinct outcomes to conflict. Your intuition is correct: this is not merely a verbal dispute, but a substantive conflict over where the moral ledger is actually kept. The critic insists the ledger is kept in **Lives**; the defender insists it is kept in **Experiences** or **Chances**. Neither side can prove the other wrong without first establishing why *that* is the correct unit of account.
