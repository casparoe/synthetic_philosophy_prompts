  # EXAMINATION PAPER

  **Course:** PHI 405: Philosophy of Archaeological Inference
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Do not use external sources or cite specific historical cases. Rely solely on the logical structure of the provided case study and philosophical principles of inference.

  **Conceptual Crux:** The Intentionality Gap in Material Culture

  **Question:**

  Archaeologists frequently infer invisible social structures and collective mental states from visible material patterns. However, moving from physical regularity to claims about shared doctrine or institutional intentionality involves a significant epistemic risk. You are presented with the hypothetical settlement of **Kharos-Delta**. Excavations reveal burial assemblages containing two distinct material signatures: (1) ceramic vessels painted with iconography distinct from the local tradition but matching a distant, known region, and (2) sets of metrological weights that are strictly standardized across all graves, regardless of wealth.

  You must adjudicate between two competing reconstructions of the Kharos-Delta society:
  **(A) The Syncretic Ritual Institution:** The society genuinely integrated foreign cosmology into local practice. The weights were used to measure ritual offerings according to shared doctrinal rules, and the iconography reflects a collective belief in the foreign deities depicted.
  **(B) The Bureaucratic Redistribution Network:** The society was a secular hierarchy that co-opted religious display for legitimization. The weights indicate a centralized economic administration controlling resource flow, and the foreign iconography was merely ornamental propaganda used by elites to signal power, devoid of genuine cosmological commitment by the broader collective.

  Write an essay of **approximately 800 words** addressing the following:
  1.  Identify the precise inferential bridge required to move from the observed object-patterns (weights and iconography) to claims about shared doctrine or collective intentionality. Where does the gap lie?
  2.  Propose a non-circular criterion for distinguishing evidence of shared practice from evidence of shared doctrine. How can one avoid using the postulated institution to explain the objects while simultaneously using the objects to confirm the institution?
  3.  Assess whether standardized weights necessarily entail bureaucratic intentionality or might instead reflect ritual reciprocity.
  4.  Explain how the hybrid iconography remains underdetermined with respect to cosmological commitment versus political legitimation.
  5.  Demonstrate where either reconstruction risks circularity or overdetermination (where the same material pattern supports incompatible mental-state attributions).

  ***

  # MODEL ANSWER

  **The Intentionality Gap in Kharos-Delta**

  The primary inferential challenge at Kharos-Delta is the gap between material regularity and mental state attribution. Objects possess physical properties; institutions possess intentional states. To move from the former to the latter requires an auxiliary assumption that specific material patterns are generated only by specific cognitive or social conditions. In the Kharos-Delta case, the gap lies in assuming that standardization implies administrative coercion (Hypothesis B) or that foreign iconography implies cosmological acceptance (Hypothesis A). Neither follows logically without additional premises about human behavior.

  To distinguish shared practice from shared doctrine without circularity, one must isolate behavioral constraints from cognitive commitments. A non-circular criterion would require evidence of *deviation management*. If the institution is merely bureaucratic (B), we expect material sanctions for weight deviation but indifference to iconographic variation among non-elites. If the institution is doctrinal (A), we expect standardization in iconographic syntax even where economically inefficient. Circularity arises if we define the site as "bureaucratic" based on the weights, then use that definition to argue the icons are merely ornamental. To avoid this, the classification of the institution must rely on evidence independent of the artifacts used to infer the mental states. For example, settlement hierarchy data independent of grave goods could support the bureaucratic claim, whereas textual or oral tradition records (if available) would support the doctrinal claim. Absent these, the inference remains probabilistic.

  Regarding the standardized weights, Hypothesis B assumes standardization necessitates bureaucratic intentionality. This is an overdetermination risk. Standardization can emerge from ritual reciprocity (Hypothesis A) where precise measurement is required for sacrificial equivalence rather than economic redistribution. If the weights are found only in burial contexts and not in domestic storage areas, the bureaucratic inference weakens. The material pattern (standardization) supports incompatible mental-state attributions: either a collective desire for economic fairness/control or a collective desire for ritual purity. Without contextual data on where the weights were used (market vs. temple), the intentionality remains underdetermined.

  Similarly, the hybrid iconography is underdetermined. Hypothesis A treats foreign symbols as evidence of shared cosmological commitment. Hypothesis B treats them as legitimizing ornament. Both explain the presence of the objects. The inferential bridge here relies on the costliness of the signal. If producing the foreign iconography required specialized knowledge held only by elites, it supports Hypothesis B (propaganda). If the iconography was produced locally by various artisans with high fidelity to foreign rules, it suggests a broader dissemination of knowledge consistent with Hypothesis A (syncretism). However, both reconstructions risk overdetermination: the same vase can be viewed as an object of devotion or an object of status signaling.

  Finally, both reconstructions risk circularity. If we assume Kharos-Delta was a state-level society (B), we interpret weights as taxes. If we assume it was a theocracy (A), we interpret weights as offerings. The objects do not speak independently of the theoretical framework imposed upon them. To resolve this, one must acknowledge that the material record alone cannot definitively settle the question of collective belief. The inferential bridge requires auxiliary assumptions about the relationship between power and belief. If we assume power requires belief, A is favored. If we assume power requires only compliance, B is favored. The Kharos-Delta case demonstrates that material patterns are compatible with multiple institutional realities. Therefore, attributing collective belief requires demonstrating that alternative explanations (like coercion or ornamentation) are less parsimonious given the broader contextual evidence, not just the internal consistency of the grave assemblages.

  ***

  # MARKING SCHEME

  **Total Marks:** 20
  **Passing Threshold:** 10 Marks

  | **Analytical Move** | **Marks** | **Characteristic Failure (Deduction Note)** |
  | :--- | :---: | :--- |
  | **1. Identification of the Inferential Gap**<br>Explicitly states that material regularity does not logically entail specific mental states or institutional intentions without auxiliary assumptions. | **4** | Conflating coordinated behavior with common belief; treating objects as direct translations of thought. |
  | **2. Non-Circular Criterion Proposal**<br>Proposes a method to distinguish practice from doctrine (e.g., deviation management, independent context) without using the conclusion as premises. | **4** | Using the postulated institution to explain the objects while simultaneously using the objects to confirm the institution. |
  | **3. Assessment of Metrological Evidence**<br>Argues that standardized weights do not necessarily entail bureaucracy and could reflect ritual reciprocity or other non-economic intentions. | **4** | Assuming standardization equals bureaucracy; ignoring ritual or social explanations for measurement. |
  | **4. Analysis of Iconographic Underdetermination**<br>Explains how foreign iconography supports both cosmological commitment and political legitimation equally well without further context. | **4** | Resolving the underdetermination by fiat rather than by analyzing auxiliary assumptions or signal costs. |
  | **5. Identification of Circularity/Overdetermination Risks**<br>Demonstrates how either hypothesis risks using the conclusion to validate the evidence or ignoring incompatible mental-state attributions. | **4** | Treating the invented site as if it were a documented historical case requiring citation; failing to identify logical loops. |
