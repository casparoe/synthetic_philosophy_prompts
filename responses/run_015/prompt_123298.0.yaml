answer: |-
  # Activity Plan: The Archive Trustees

  **Context:** Undergraduate Ethics Seminar
  **Participants:** 14 students
  **Duration:** 75 minutes
  **Objective:** To elicit the intuitive asymmetry between the duty to avoid creating suffering and the lack of a duty to create happiness, prior to introducing David Benatar's name or theory.

  ---

  ## 1. Scenario and Setup (10 Minutes)

  **The Narrative:**
  Inform the class that they are the Board of Trustees for the 'Human Continuity Archive'. This archive contains thousands of genetic templates for potential persons. These templates are fully specified; the Board knows exactly what the quality of life for each potential person would be if activated. They are not yet alive; they exist only as possibilities.

  **The Task:**
  The Board must review a selection of profiles and vote on whether to 'Activate' (bring into existence) or 'Archive' (leave unactivated).

  **Grouping:**
  Divide the 14 students into three working groups (two groups of 5, one group of 4). This ensures everyone must speak.

  **Roles (assigned within each group):**
  1.  **The Chair:** Manages the timer and calls the vote.
  2.  **The Scribe:** Publicly records the decision and the *primary justification* given by the group on a shared whiteboard or large sheet of paper.
  3.  **The Auditors (All others):** Vote and debate.

  **The Currency (Crucial for Asymmetry):**
  Distribute two types of tokens to each group:
  *   **Integrity Points (Red):** Each group starts with 3. These represent the moral baseline.
  *   **Legacy Points (Gold):** Each group starts with 0. These represent moral credit.

  **The Rules (Read aloud, do not explain the philosophy):**
  1.  If you **Activate** a profile that results in net suffering, you lose 1 **Integrity Point**. If you reach 0 Integrity Points, your Trusteeship is terminated (you lose the game).
  2.  If you **Activate** a profile that results in net flourishing, you gain 1 **Legacy Point**.
  3.  If you choose **not to Activate** (leave in the Archive), there is **no penalty and no reward**, regardless of the profile's potential quality of life.
  4.  You have 90 seconds per profile to debate and record your justification.

  ---

  ## 2. The Activity Rounds (30 Minutes)

  Provide each group with a sealed envelope for each round containing the profiles. Emphasise that the projected life outcomes are *certainties*, not probabilities.

  **Round 1: The Clear Cases (10 Minutes)**
  *   **Profile A:** A life characterised by chronic, unmitigable physical pain, severe cognitive impairment, and isolation. No capacity for joy. (Net Negative)
  *   **Profile B:** A life of robust health, deep loving relationships, artistic fulfilment, and only minor, transient frustrations. (Net Positive)
  *   *Expected Outcome:* Groups will refuse A to protect Integrity Points. Groups will likely activate B to gain Legacy Points, but the Scribe should note if the justification sounds obligatory ("We should") or optional ("We could").

  **Round 2: The Costly Flourishing (10 Minutes)**
  *   **Profile C:** A life of immense intellectual contribution that saves thousands of others, but the subject themselves experiences moderate anxiety and loneliness. (Net Positive for world, Mixed for subject)
  *   **Profile D:** A life of moderate contentment, but requiring significant resource allocation from the Archive that could be used elsewhere. (Net Positive, Low Yield)
  *   *Expected Outcome:* This tests if they feel a *duty* to activate C. Most will feel pressured to activate C, but D should feel optional.

  **Round 3: The Marginal Case (10 Minutes)**
  *   **Profile E:** A life that is barely worth living. Slight net pleasure, but punctuated by significant grief and struggle. (Marginal Net Positive)
  *   *Expected Outcome:* This is the pivot. Many groups will choose to 'Archive' this profile. They will feel no strong duty to activate it, despite it being 'Net Positive'. They will prioritise keeping their Integrity Points safe over gaining a meagre Legacy Point.

  **Recording:**
  The Scribes must write the justification visibly. E.g., *"Activated because it would be cruel not to,"* vs *"Activated because it's a nice bonus,"* vs *"Rejected because we can't risk the suffering."*

  ---

  ## 3. The Debrief (30 Minutes)

  **Phase 1: Pattern Recognition (10 Minutes)**
  Gather the class. Look at the Scribes' records on the board.
  *   Ask: "Look at your decisions for Profile A (Suffering). Did any group Activate?" (Likely none).
  *   Ask: "Look at Profile E (Marginal Positive). Did any group feel *compelled* to Activate?" (Likely few).
  *   Ask: "Why was avoiding the loss of Red Tokens feel more urgent than gaining Gold Tokens?"

  **Phase 2: Introducing the Asymmetry (15 Minutes)**
  Now, introduce the philosophical framework.
  *   Explain that their intuition mirrors the **Benatar Asymmetry**.
  *   **Map the Tokens:**
      *   Losing Integrity Points represents the **Presence of Pain (Bad)**. We have a strong duty to avoid this.
      *   Gaining Legacy Points represents the **Presence of Pleasure (Good)**. This is good, but...
      *   The rule that "No penalty exists for not Activating" represents the **Absence of Pleasure (Not Bad)**.
  *   Explain the core claim: We have a duty not to bring suffering beings into existence (harm), but we do not have a corresponding duty to bring happy beings into existence (no loss to the non-existent).
  *   Highlight the Scribe justifications. Point out where students used language of *prohibition* for suffering ("We mustn't") versus language of *option* for flourishing ("It would be nice to").

  **Phase 3: Critical Discussion (5 Minutes)**
  *   Ask: "Does this asymmetry hold if we change the scenario? What if the 'Archive' was your own womb?"
  *   Briefly touch upon how this challenges standard Utilitarianism (which would demand maximising Legacy Points regardless of Integrity risk, provided the net total is positive).

  ---

  ## 4. Limitation Note (Instructor Guidance)

  **What the activity cannot reproduce:**
  This exercise simulates the *agent-relative duty* (what the Trustee should do), but it cannot fully reproduce the *axiological claim* regarding the non-existent.
  *   **The Gap:** In the activity, students feel a pang of regret for not activating Profile B (the happy genius). They feel they are 'missing out' on a good thing. Benatar's claim is stronger: he argues the absence of pleasure is *not bad* even from an impersonal perspective, provided no one exists to be deprived of it.
  *   **Verbal Supply:** You must explicitly state in the debrief: "You likely felt that not creating the happy person was a 'missed opportunity'. Benatar argues it is not even a missed opportunity, because there is no subject to experience the loss. The game forces you to treat it as neutral via the rules, but your intuition may still tug towards 'more life is better'. That tension is where the real philosophy lives."

  ---

  ## 5. Prediction of Failure

  **The Epistemic Objection:**
  The most predictable failure point is that students will reject the premise of **certainty**.
  *   **The Issue:** In Round 1 or 2, a student will likely argue: "But we can't *know* the future. What if the profile is wrong? What if the suffering person finds meaning in their pain?"
  *   **The Disruption:** This derails the activity because the asymmetry relies on the *projected* balance being known. If the outcome is uncertain, the decision becomes a risk calculation (Expected Utility) rather than a moral intuition test.
  *   **Mitigation:** When introducing the scenario, be authoritarian. "For the purpose of this seminar, the Archive's predictive technology is infallible. Challenging the data is a breach of protocol." If they persist, acknowledge the point as valid in the real world but insist they bracket it for the sake of the thought experiment.

  **Secondary Failure:**
  Students may treat the 'Legacy Points' as a score to be maximised competitively between groups. If they turn it into a game of 'who has the most Gold', they will activate everyone, destroying the asymmetry.
  *   **Mitigation:** Emphasise that 'Termination of Trusteeship' (losing Red Points) is the primary failure condition. Legacy Points are merely for honour, not survival.

  ---

  ## Timeline Summary

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Setup** | Scenario briefing, grouping, token distribution, rules explanation. |
  | **00:10 – 00:40** | **Simulation** | Three rounds of voting (Suffering, Flourishing, Marginal). Scribes record justifications. |
  | **00:40 – 00:50** | **Observation** | Review board justifications. Identify the pattern of prohibition vs. option. |
  | **00:50 – 01:05** | **Reveal** | Introduce Benatar, the Asymmetry, and map the tokens to the four premises. |
  | **01:05 – 01:10** | **Limitation** | Explain the gap between agent-duty and metaphysical value (see Note above). |
  | **01:10 – 01:15** | **Close** | Address the 'Epistemic Objection' and assign reading. |
