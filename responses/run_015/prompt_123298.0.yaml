prompt: |-
  I lead an undergraduate ethics seminar of about fourteen students, with seventy-five minutes available. Design a runnable in-class activity that lets participants feel the pull of Benatar’s asymmetry — the idea that bringing a suffering being into existence is a harm, whereas failing to bring a flourishing being into existence is not a corresponding loss — but do not name Benatar, antinatalism, or the asymmetry until the debrief. Frame the exercise through a slightly niche scenario: the group serves as trustees of a dormant “genetic archive” containing fully specified but unactivated potential persons; each round they vote, under time pressure, whether to “activate” a profile given only its projected pleasure-pain balance. Structure the rules and payoff scheme (using points or tokens, not money) so that groups instinctively block activation for suffering profiles yet feel no parallel duty to activate highly flourishing ones, and arrange roles so that they must record and justify each vote publicly before noticing the pattern in their own records. Include a timeline, the debrief that maps specific voting moments onto the philosophical structure, an honest note on which feature of the view the activity cannot reproduce and you must supply verbally, and a prediction of what will predictably go wrong the first time you run it. Please answer in British English.
