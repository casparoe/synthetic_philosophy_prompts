      *   *Context:* Turing has just listed and refuted various objections to the possibility of machine intelligence (Theological, Heads in the Sand, Mathematical, Consciousness, Disabilities, Lady Lovelace, Continuity of the Nervous System, Informality of Behavior).
      *   *The ESP Argument:* Turing acknowledges that ESP (telepathy, clairvoyance, etc.) seems to contradict the known laws of physics/science. He notes that statistical evidence for ESP is strong (at the time).
      *   *The Crux:* If ESP exists, it implies our current scientific understanding of the universe is incomplete. If our understanding is incomplete, we can't definitively say machines *can't* think based on current physical laws.
      *   *Does he say machines need ESP?* No.
      *   *Does he say ESP proves thinking?* No.
      *   *What is the logical function?* It's a counter-objection to the objection that "machines are just physical systems, and physical systems can't think."

