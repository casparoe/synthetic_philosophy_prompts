  I'm in a history of AI seminar and we're doing a close read of Turing's 1950 "Computing Machinery and Intelligence" and the ESP bit is really throwing me. To me it reads like Turing is actually making a positive case that extra-sensory perception is a route to machine intelligence — like, that if a machine could demonstrate ESP, that'd basically count as evidence its thinking. Is that the right read? I keep trying to line it up with the imitation game stuff and I just cant. Can you walk me through what he's actually doing with ESP in that paper?
