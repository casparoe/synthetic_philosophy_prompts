      *   *Step 4: Connect to the Imitation Game.* How does this fit the Test? If ESP is real, a machine might win the game by "reading the interrogator's mind" rather than simulating conversation. Turing jokes that we might need a "telepathy-proof room." This shows he's thinking about the *conditions* of the test, not endorsing ESP as intelligence.
      *   *Step 5: Historical Context.* Why did he take ESP seriously? 1950s parapsychology (Rhine's experiments) was considered more mainstream/scientifically plausible than it is today. Turing wasn't being woo-woo; he was being empirically open-minded.

