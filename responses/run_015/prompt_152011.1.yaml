  ### The Principle: Bounded Chemical Autopoiesis

  **A system is alive if and only if it satisfies three conditions:**

  1.  **Material Closure (The Boundary Condition):** The system must produce and maintain a physical boundary (e.g., a membrane) that distinguishes it from the environment, where the boundary itself is a product of the system's internal processes.
  2.  **Chemical Autopoiesis (The Constitution Condition):** The system's internal processes must chemically transform external matter/energy to regenerate the very components (including the boundary and catalysts) that constitute the system. Mechanical assembly or digital state-changes do not count.
  3.  **Metabolic Potential (The Continuity Condition):** The system must possess the structural capacity to sustain or resume this self-production, even if currently dormant.

  **Why this is not arbitrary:** The "chemical" constraint is not substrate chauvinism but a definition of *metabolism*. Metabolism is the transformation of matter through bond breaking/making. Digital simulations manipulate symbols; robots manipulate macroscopic parts. Only chemical autopoiesis creates a system where the *stuff* of the system is continuously recycled and self-produced at the molecular level.

