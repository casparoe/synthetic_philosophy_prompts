  | **2. Self-Replicating Robot** | **Not Alive** | **Fails (2).** It *assembles* parts mechanically. It does not chemically synthesize its own circuitry or chassis from raw ore at the molecular level. It is allopoietic (made by parts), not autopoietic. |
