answer: |-
  You have stated my position with a clarity that flatters me, yet in that very clarity, I fear you have stripped the bone of its marrow. You are correct that the arrangement you describe employs the method of intelligence: there is a problem, a proposed solution, a test, and a revision. But you have mistaken the *operation* of intelligence for its *purpose*. In my view, inquiry is not merely a tool for securing stability or efficiency; it is the means by which human beings grow in their capacity to direct their own future. When you arrange for variants to be tried upon users who do not know they are in a trial, you have secured a result, but you have excluded the subject from the act of knowing. This is not inquiry in the full sense, for those whose conduct is reorganized have no share in judging the consequences. They are not partners in the experiment; they are the material upon which it works.

  Consider your reformed version, where the assembly chooses the end and the results are published. Here you meet me halfway, but not all the way. You ask where inquiry stops. It stops when the connection between the act and the consequence is mediated entirely by instruments that the common person cannot feel. You say the statistic is more precise than the sensation. I say it is precise about something else. It is precise about the mechanism, but silent about the meaning. If the wearer of the shoe does not feel the pinch, but is told by a dial that the shoe is ill-fitting, the wearer learns nothing about fit. They learn only to obey the dial. Inquiry must educate the perception of those involved, not bypass it. To publish the result is not to share the experience of reaching it.

  So I do not concede that I am preferring democracy to inquiry. I am insisting that inquiry which does not serve the formation of a public is defective as inquiry. The defect is not a logical error in the calculation; it is a moral failure in the association. If the method of intelligence isolates the knowledge of consequences in the hands of a few who read the dials, then no public can come into existence, for a public exists only when people perceive shared consequences together. You ask if I require we know less about the pinch. I require that we know it as a human trouble, not as a technical deviation. Without that felt quality, there is no motive for common action, and without common action, there is no democracy, only a managed population.
