      *   **Role:** Senior Adviser to the University's Archival Ethics and Curriculum Committee.
      *   **Tone:** Professional, philosophical, nuanced, British English.
      *   **Task:** Draft a formal memo recommending a course of action regarding unpublished 1934 Bertrand Russell lecture notes containing sharp logical analysis mixed with eugenicist reasoning.
      *   **Constraints:**
          *   Specific sections in a specific order (Bottom line, Case for publishing, Strongest counter-argument, Verdict with conditions, Response to differential treatment).
          *   Word counts for each section (approximate):
