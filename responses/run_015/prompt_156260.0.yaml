answer: |-
  Dear friend, I have been reflecting on our conversation regarding the 2016 referendum, and I agree that leaving the matter at an impasse would be a missed opportunity to sharpen our understanding of democratic legitimacy. You are right to insist that the stakes were too high for a casual dismissal of the boundary problem, and I am willing to concede that my initial defense of the all-subjected principle may have been too rigid given the unique constitutional ambiguity of that vote. Let us walk through this together, using the referendum not as a battleground for our respective views but as a diagnostic tool to test the limits of the theories we both rely upon. To begin, we must establish the factual terrain of the franchise as it was actually constructed, for the specific exclusions and inclusions tell us much about the implicit theory of democracy the government operated under, whether they articulated it or not. The rules allowed voting to British, Irish, and Commonwealth citizens resident in the United Kingdom, as well as members of the House of Lords and British citizens living abroad who had been registered to vote in the UK within the previous fifteen years. Conversely, the franchise excluded citizens of other European Union states residing in the UK, British citizens who had lived outside the UK for more than fifteen years, and residents of the UK aged sixteen and seventeen, despite sixteen-year-olds having been enfranchised in the Scottish independence referendum two years prior. This specific configuration was not an accident of history but a crystallization of a particular view of membership, one that privileges a mix of nationality and recent residency over mere presence or long-term interest.

  When we apply the all-subjected principle to these facts, which aligns more closely with the position I held during our discussion, the legitimacy of the franchise appears robust in some areas but fraught in others. This principle holds that everyone subject to the coercive power of the state should have a say in its governance. Under this lens, including British, Irish, and Commonwealth citizens resident in the UK makes sense because they are the primary subjects of UK parliamentary sovereignty. However, the exclusion of EU nationals resident in the UK becomes problematic if we accept that the referendum result would fundamentally alter the legal framework under which they lived, effectively changing their status from free movers to potential immigrants subject to new coercion. Yet, the all-subjected principle might defend their exclusion on the grounds that, prior to the vote, they were not subjects of the UK constitution in the same way citizens were, but rather beneficiaries of a supranational treaty. The deeper tension for the all-subjected view arises not from who voted, but from what the vote became. Because the referendum was technically advisory, Parliament retained the legal sovereignty to ignore it, meaning no one was strictly subjected to the result until Parliament acted. However, because the government and Parliament treated the result as politically binding, they created a situation where the franchise determined the fate of subjects who had no voice in the decision. If the vote is advisory, the franchise matters less because the representatives remain accountable for the final decision; if the vote is binding, the franchise must be perfect because it bypasses the mediating layer of representation. The referendum occupied a hybrid space where it was advisory in law but binding in practice, creating a legitimacy gap where the all-subjected principle cannot clearly determine if the coercion was authorized by those subjected to it.

  Turning to your preferred lens, the all-affected-interests principle casts a much wider net and reveals different fractures in the legitimacy of the process. This principle suggests that anyone whose interests are significantly impacted by a decision should have a voice in making it. Under this framework, the exclusion of EU nationals in the UK is a clear democratic deficit, as their rights of residence and work were directly on the line. Furthermore, this principle would demand the inclusion of British citizens living permanently in other EU countries, whose rights to reside and access services were jeopardized by the outcome, yet the fifteen-year rule cut off many of these individuals from the franchise. The all-affected principle illuminates the profound interdependence of the UK and the EU, suggesting that the boundary of the demos should have extended to include those whose life chances were tethered to the membership status. However, applying this principle rigorously exposes its own potential for overreach. If everyone affected by the outcome should vote, does that include citizens of other EU states whose economies would suffer from trade barriers? Does it include investors globally whose portfolios were tied to sterling? The referendum episode shows that while the all-affected principle is morally compelling in identifying exclusions, it lacks a mechanism for stopping the expansion of the franchise, potentially diluting the agency of those most intimately governed by the resulting laws. Both principles, when mapped against the actual event, show that the franchise was too narrow for the all-affected view and potentially too contingent on a misleading legal status for the all-subjected view.

  However, I believe our discussion must push past where these principles typically stop, because the Brexit referendum exposes a silence in both frameworks regarding time and the nature of the mandate. You raised the issue of future generations, and this is where the standard boundary problem literature often fails to provide guidance. The decision to leave the EU was not merely a policy adjustment but a constitutional restructuring with consequences for trade, environmental regulation, and security that will endure for decades. Neither the all-affected nor the all-subjected principle adequately accounts for the temporal dimension of authorization. The all-subjected principle focuses on those currently under the law, ignoring those who will be subjects of the constitutional order created by the vote but who had no opportunity to authorize it. The all-affected principle can theoretically include future generations since their interests are affected, but this leads to a practical reductio ad absurdum where the demos includes the unborn, who cannot vote. This reveals that democratic membership has a temporal dimension that neither principle captures; we are making binding decisions for future citizens who cannot be present to consent, effectively imposing a dead hand of the past on the future. The referendum treated the will of the living voters as absolute, yet the constraints they imposed will bind people who never authorized the decision. This suggests that legitimacy requires not just a spatial boundary of who votes, but a temporal humility about how binding a single moment of voting should be over the long term.

  This leads us to the problem of the advisory mandate and the epistemic limitations of the voters, another area where the theories remain silent. The referendum was sold as a simple binary choice, yet the interests at stake were complex trade-offs involving supply chains, regulatory alignment, and geopolitical positioning that many voters may not have fully understood. The all-affected principle assumes that affected parties know their interests well enough to vote on them, but the Brexit campaign demonstrated that affected parties can be misled about the nature of the effects themselves. If voters cannot fully comprehend the interests they are voting on, does their inclusion satisfy the democratic requirement? The all-subjected principle avoids this by focusing on status rather than knowledge, but it fails to address whether subjects can authorize coercion they do not understand. The hybrid advisory-binding status of the referendum exacerbates this. Because it was treated as binding, there was no subsequent legislative process to refine the decision based on emerging evidence or deeper deliberation. The vote itself became the law, freezing a specific understanding of interests at a specific moment in time. This suggests that democratic legitimacy might require a mechanism for revisiting decisions as the effects become clearer, rather than treating a single plebiscite as the final word. The boundary problem usually asks who is inside the room, but the referendum shows we must also ask how long the decisions made in that room lock the door for those who come later.

  Ultimately, analyzing the referendum through these lenses confirms that while the boundary problem illuminates the exclusions of EU nationals and long-term expats, it does not resolve the deeper tension of making permanent constitutional changes through a transient majority. The all-subjected principle protects the integrity of the political community but risks ignoring those who are de facto members of the society without formal status. The all-affected principle ensures moral consideration for all impacted but risks creating a demos with no coherent political identity or capacity for decision. What the referendum reveals is that both principles are static snapshots of a dynamic process. They assume a stable relationship between the voter, the law, and the consequence, whereas the Brexit vote showed that the law changes the subjects, the consequences change the affected, and the understanding of both evolves over time. If we accept that democratic membership has a temporal dimension, then legitimacy cannot rest solely on who was allowed to vote on that day in June. It must also rest on the flexibility of the resulting arrangement to accommodate the interests of those who were not there, including the future citizens who will inherit the climate and trade commitments embedded in the withdrawal agreement. Perhaps the lesson is not that one of us was right about the franchise, but that both principles need to be supplemented by a theory of temporal authorization that limits the binding power of any single generation over the next. I hope this analysis helps us move beyond the impasse, not by declaring a winner, but by showing that the referendum exposed flaws in the very tools we used to judge it.
