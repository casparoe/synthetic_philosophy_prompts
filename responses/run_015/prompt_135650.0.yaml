answer: |-
  **Maya's Initial Argument:** **Plausible but incomplete.**
  She correctly identifies that functional continuity is our best practical criterion for identity and avoids arbitrary substrate bias. However, she assumes functionalism is true rather than arguing for it; she treats the absence of a "lights out" moment as proof of continuous consciousness, which relies on the unproven premise that function exhausts phenomenology.

  **Leo's Zombie-Relay and Verification Objections:** **Plausible but incomplete.**
  He is logically correct that functional equivalence does not strictly entail phenomenal equivalence (the conceivability of zombies), and he rightly identifies an epistemic gap in gradual replacement. However, he offers no positive criterion for consciousness, rendering his objection a skeptical block rather than a constructive alternative; logical possibility does not establish ontological probability.

  **Maya's Reductio Charge:** **Clearly right.**
  Her consistency argument is logically devastating: if behavioral and report-based evidence are insufficient to verify consciousness in an upload, they are insufficient for any other human being. Leo is forced into global skepticism about other minds to maintain his position, which undermines the intersubjective basis required for the debate itself.

  **Leo's Final Reply about Generalization:** **Plausible but incomplete.**
  He correctly notes that epistemic limits apply universally (we cannot verify other minds with certainty), and that absence of evidence is not evidence of absence. However, by accepting global skepticism, he makes the concept of "survival" unverifiable in *any* context, which dissolves the practical distinction between life and death that the debate seeks to address.

  **Overall Adjudication:**
  **Maya is more right overall.** While Leo successfully highlights the metaphysical "Hard Problem" and the limits of third-person verification, his position leads to a paralyzing skepticism that invalidates all social and legal concepts of personhood. Maya's functionalist account, while metaphysically assumptive, preserves the normative and practical continuity required to make sense of survival, identity, and moral responsibility. Leo wins on strict logical possibility, but Maya wins on explanatory coherence and pragmatic necessity.

  **Neglected Issue:**
  Both neglect the **normative "what matters" criterion** (à la Derek Parfit). They debate survival as a metaphysical fact (is the consciousness *really* there?) rather than asking what practical or ethical features of continuity (memory, care, agency) actually matter to us. If "what matters" is preserved, the metaphysical status of the qualia may be less relevant than they assume.

  Verdict: Maya prevails on pragmatic coherence despite Leo's epistemic skepticism.
