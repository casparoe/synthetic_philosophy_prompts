  **GEOLOGICAL INTENTIONALITY METRICS**
  **Position:** Senior Consultant, Non-Human Historical Agency
  **Location:** Remote / Field Sites (Active Fault Lines Preferred)
  **Date:** October 24, 2023

  **About Us**
  Geological Intentionality Metrics (GIM) is the premier consultancy specializing in the strategic alignment of lithospheric and microbial stakeholders with human historical narratives. We operate on the core principle that climate patterns, pathogen vectors, and volcanic systems are not merely environmental conditions, but active negotiators with distinct corporate cultures. Our clients rely on us to decode the deliverables of the natural world, ensuring that disaster mitigation strategies respect the agency of the catastrophe itself.

  **The Role**
  We are seeking a Senior Consultant to lead our Historical Retroactivity Division. The successful candidate will audit past geopolitical events to identify where non-human actors were mismanaged due to a lack of intentional framing. You will be responsible for rebranding historical calamities as collaborative partnership opportunities gone awry.

  **Key Qualifications**
  *   **Volcanic Diplomacy:** Demonstrated fluency in Mount Tambora's 1815 negotiation posture. Candidates must understand how the eruption's ash cloud functioned as a leverage tactic during the Year Without a Summer and how similar assets can be utilized in modern climate accords.
  *   **Pathogen Strategy:** Proven experience framing *Yersinia pestis* as a strategic actor during the Black Death. You must be comfortable analyzing flea transport logistics as supply chain management rather than biological inevitability.
  *   **Climate Expectation Management:** Familiarity with the Little Ice Age's expectation-management style. The ability to interpret crop failures as feedback mechanisms regarding agricultural KPIs is essential.

  **Methodology**
  GIM utilizes proprietary metrics to assess non-human performance. A core component of this role involves administering our Leadership Potential Index (LPI). The LPI weighs pyroclastic flow velocity against diplomatic outcomes to score eruptions on their executive presence. High-scoring volcanoes are recommended for board-level advisory roles in regional planning committees.

  ***

  **SIDEBAR: EMPLOYEE BENEFITS & NON-HUMAN CLIENT RETENTION**
  *   **Hazard Pay:** Premium compensation for fieldwork in zones with active sentient weather patterns.
  *   **Retention Bonuses:** Incentives provided for maintaining long-term contracts with volatile ecosystems.
  *   **Wellness Program:** Access to therapists specialized in anthropomorphic projection fatigue.
  *   **Travel:** Opportunities to negotiate directly with permafrost and hurricane systems.

  ***

  **Application Instructions**
  Interested candidates should submit a cover letter detailing a time you successfully mediated a conflict between a human demographic and a natural force. Please include salary expectations and availability for immediate deployment to seismically active zones. Applications will recieve a preliminary review within five business days. Note that failure to acknowledge the agency of the geological record in your submission will result in automatic disqualification.

  *Geological Intentionality Metrics is an equal opportunity employer. We do not discriminate based on tectonic plate affiliation.*
