  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* The South African Truth and Reconciliation Commission (TRC) is often hailed as a successful model for granting amnesty in exchange for truth.
      *   *Premise 2:* This success relied heavily on figures like Desmond Tutu and Nelson Mandela (moral/rhetorical capacity).
      *   *Premise 3:* This reliance suggests "moral luck" (circumstantial luck regarding leadership).
      *   *Conclusion:* If justification depends on luck, it's not a stable normative principle, making the model less exportable to contexts lacking such leaders (e.g., Argentina, Rwanda).
      *   *Method:* Philosophical/Conceptual analysis (Moral Luck, Institutional Design) rather than empirical comparison.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and descriptive. *Moral Luck and the Exportability of Amnesty: A Conceptual Critique of the TRC Model.*

      *   **Section 1: The Research Question:**
          *   Need to be precise. It's not just "Is the TRC good?" It's about the *normative justification* hinging on *contingent leadership qualities*.
