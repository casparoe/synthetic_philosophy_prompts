prompt: |-
  I am currently taking a seminar on transitional justice and political reconciliation. For a short research proposal (approximately two pages, suitable for a term-paper fellowship), I want to frame the following question: does the normative justification for granting amnesty within truth-commission processes depend on conditions of moral luck—specifically, on whether the transitional society happens to possess leaders with the particular moral and rhetorical capacities that make public confession politically effective—and does recognizing this dependency undermine the common claim that South Africa's TRC offers an exportable model for societies such as Argentina or Rwanda? Please structure the proposal to include: (1) the question stated precisely; (2) an explanation of why standard debates between retributive and restorative justice fail to resolve it; (3) an approach that relies on conceptual analysis of moral luck and institutional design rather than on comparative empirical case studies, with a justification for choosing that angle; (4) a description of what a successful result would look like for practitioners deciding whether to adopt a commission model, and what would count as failure; and (5) a realistic assessment of what can be accomplished within a single semester, including acknowledged limitations. I will supply references and citations myself, so please do not provide a bibliography, reading list, or source citations.
