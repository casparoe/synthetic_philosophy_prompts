      *   **Section 2: Limitations of Standard Debates:**
          *   Retributive justice says "punish." Restorative says "heal."
          *   The problem: Both assume institutional mechanisms work independently of the *agents* running them. They focus on *what* is done, not *who* does it or the *contingencies* of success.
          *   The gap: They ignore the "agent-relative" variables (leadership) that determine if amnesty leads to reconciliation or impunity.

      *   **Section 3: Methodology (Conceptual Analysis):**
          *   Why not empirical? Empirical studies compare outcomes (did violence stop?). But the question is about *normative justification* and *moral luck*. You can't measure "moral luck" with statistics.
          *   Focus: Nagel/Williams on moral luck applied to institutional design.
          *   Justification: We need to know if the *principle* holds, not just if it worked once. Conceptual analysis reveals structural vulnerabilities that empirical data might miss (e.g., survivorship bias).

      *   **Section 4: Success/Failure Criteria for Practitioners:**
