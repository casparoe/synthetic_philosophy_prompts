answer: |-
  **Project Title:** Moral Luck and the Exportability of Amnesty: A Conceptual Critique of the Truth Commission Model

  **1. The Research Question**
  This project investigates the normative stability of amnesty provisions within truth and reconciliation commissions (TRCs). Specifically, it asks: *Does the moral justification for granting amnesty in transitional justice processes depend contingently on conditions of moral luck—namely, the presence of political and moral leaders possessing the specific rhetorical and ethical capacities required to make public confession socially efficacious?* Furthermore, if such a dependency exists, does it undermine the prevailing normative claim that the South African TRC offers a universally exportable institutional model for societies with distinct leadership landscapes, such as Argentina or Rwanda? The inquiry seeks to determine whether the success of the TRC was a function of robust institutional design or a contingent anomaly of moral agency, and what this distinction implies for the prescriptive force of transitional justice theory.

  **2. Limitations of Standard Debates**
  Current literature on transitional justice is largely polarized between retributive and restorative frameworks. Retributive approaches argue that amnesty violates the duty to punish gross human rights violations, while restorative approaches contend that amnesty is a necessary price for truth and social healing. However, both frameworks operate primarily at the level of *institutional teleology*—debating what the mechanism is supposed to achieve (justice vs. reconciliation)—while neglecting the *agential preconditions* required for those mechanisms to function.

  This binary fails to resolve the proposed question because it treats institutions as context-independent machines. It assumes that if the rules of amnesty are correctly drafted (e.g., individualized, conditional on truth-telling), the normative outcome follows. This ignores the variable of leadership. In the South African context, the moral authority of figures like Desmond Tutu and Nelson Mandela was instrumental in legitimizing the amnesty process for victims. A retributive/restorative debate cannot account for a scenario where the institutional design remains identical, but the leadership lacks the moral capital to sell the compromise. Consequently, standard debates risk prescribing institutional solutions that are normatively sound in theory but practically inert or dangerous in contexts lacking specific "lucky" leadership conditions.

  **3. Methodological Approach: Conceptual Analysis of Moral Luck and Design**
  Rather than employing a comparative empirical case study methodology, this project will utilize conceptual analysis rooted in moral philosophy and institutional design theory. The core analytical tool will be the concept of "moral luck," specifically focusing on *constitutive luck* (the traits of the leaders available) and *circumstantial luck* (the political moment they inhabit).

  **Justification for this Angle:**
  Empirical comparison is ill-suited for this specific inquiry for two reasons. First, isolating leadership variables from other socio-political factors in historical case studies (e.g., Argentina's *Nunca Más* vs. South Africa's TRC) invites confounding variables that obscure the specific normative weight of moral rhetoric. Second, the research question is fundamentally about *justification*, not merely *efficacy*. Even if a TRC succeeds empirically in a different context, the question remains whether the *moral permission* to grant amnesty was stable or lucky.

  By analyzing the conceptual link between *validity* and *contingency*, this project will treat the TRC not as a data point, but as a normative argument that relies on hidden premises regarding agency. This allows for a rigorous examination of whether a justice mechanism can be considered "just" if its success relies on virtues that cannot be institutionally guaranteed. The analysis will dissect the "South African Model" to separate invariant institutional features from contingent agential features, determining which are essential for the model's moral defensibility.

  **4. Criteria for Success and Failure**
  For practitioners and policymakers, a successful result will look like a refined heuristic for institutional adoption. Specifically, the project aims to produce a normative framework that requires leaders to assess "agential capacity" as a precondition for amnesty. Success means moving the policy recommendation from "Adopt a TRC to achieve reconciliation" to "Adopt a TRC only if specific moral-rhetorical conditions are met, otherwise risk legitimizing impunity." This provides a safeguard against the blind replication of models in hostile environments.

  Conversely, the project would count as a failure if the analysis concludes that moral luck is irrelevant to normative justification—for instance, if it can be proven that institutional design alone guarantees legitimacy regardless of leadership. A second form of failure would be producing a critique so abstract that it offers no actionable distinction for practitioners trying to decide between a tribunal and a commission. If the result is merely that "luck matters" without delineating *which* capacities are necessary or how to identify them, the proposal will have failed to bridge the gap between political philosophy and transitional practice.

  **5. Scope, Feasibility, and Limitations**
  Within a single semester, the project will accomplish a theoretical mapping of the moral luck argument as it applies to the South African TRC's amnesty provisions. The work will involve a close reading of the normative defenses of the TRC, contrasting them with philosophical literature on moral luck and agency. I will then apply this framework hypothetically to the contexts of Argentina and Rwanda to demonstrate the model's explanatory power regarding their divergent paths.

  **Limitations:**
  The primary limitation is the lack of primary fieldwork or interviews with transitional justice practitioners. The analysis will rely on secondary literature and established historical records, which may not fully capture the nuanced, behind-the-scenes rhetorical dynamics of the commissions. Additionally, as a conceptual project, it cannot empirically verify whether specific leadership traits *caused* specific outcomes; it can only argue that the *justification* for those outcomes relies on the assumption of such traits. Finally, the scope is limited to amnesty within truth commissions; it will not address broader reparations or institutional reform processes, focusing strictly on the quid-pro-quo of truth-for-amnesty. Despite these constraints, the semester provides sufficient time to construct a robust philosophical critique that challenges the universalist assumptions of current transitional justice orthodoxy.
