      *   **Case 5 (Rome/Epidemiology):** *Illegitimate.* Using modern models to estimate data, then *blaming* authorities for not acting on data they couldn't have. *Key:* Using modern tools for explanation is okay (like Case 6), but blaming for not using them is not.
      *   **Case 6 (Medieval Astronomy/Orbital Mechanics):** *Legitimate.* Comparing past predictions to modern truth to explain *why* they deviated (missing theory). *Key:* Explanatory use of modern knowledge, not normative blame.
      *   **Case 7 (Gender Norms/Equality):** *Illegitimate.* Judging past norms as morally deficient compared to modern equality, framing it like climate change denial. *Key:* Normative blame based on modern moral standards.

