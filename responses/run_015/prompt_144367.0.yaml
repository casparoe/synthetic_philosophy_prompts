prompt: |-
  Quick context so you know where I'm coming from: I write novels — three out, I teach the occasional workshop, and I took exactly one philosphy class in college and dropped it. I want to actually understand George Berkeley's idealism, and every time I try to read about it I get lost in vocabulary that isn't mine. So do me a favor: translate it into the vocabulary I work in every day, and then tell me where the translation breaks down.

  The version I think I'm meant to be translating, so you can see where I'm starting from: things like tables and trees are collections of ideas; ideas exist only in minds; so for a thing to be is to be perceived. The famous move is the master argument — try to think of a tree existing with nobody perceiving it and you can't get it done, because the moment you try, the tree is in your mind, so you've failed to think the thing you were trying to think. God is in the system because without a perceiver who never blinks, the world winks out every time you leave the room. And minds themselves aren't ideas: we don't get an idea of a mind, we get something else, some kind of notion. Correct me where I've got that wrong, but do the correcting in my terms.

  My terms: scene and summary, point of view, focalization, free indirect style, the implied author, voice, backstory, the world bible (everything I know about these people that never made it onto a page), published text versus draft, and what readers decide happened between chapters (they definately do this at Q&As).

  Four things I want you to get to:

  1. Summary looks like a counterexample to him. In summary I assert events nobody in the book perceives — no character is in the room, and the narrator isn't a witness either, it's just a voice. Whose mind is holding that tree up? If the answer is the reader's, then does my novel blink out of existence at 3am when nobody's reading it? Does the implied author get drafted in to do God's job, and is that a cheat or the same move Berkeley made?

  2. The sense-versus-imagination business. He separates ideas we take in from ideas we make up, and says the made-up ones are the faint ones. But the master argument is an argument about conceiving, and conceiving is what I'd call storyboarding a scene in my head — not the scene actually being on the page. So is the master argument quietly trading on that distinction? Does my on-the-page/in-your-head split map onto his so cleanly that it rescues the argument, or does it expose a slide he's making?

  3. Free indirect style. When I write a whole chapter inside a character's head, every sentence is made of that character's impressions, but the character herself is never one of the things depicted. Is that his notion of a spirit, finally cashed out in something I can point at? Or is it a grammatical trick that lets me fake a mind out of ideas — in which case craft has the same hole in it that his system does.

  4. What won't translate at all: drafts and cut material. I genuinely don't know what my protagonist had for breakfast if it never came up; there's no fact of the matter sitting in a drawer somewhere. Does that make my world more idealist than his — unwritten means genuinely indeterminate — or does it ruin the analogy, because he has an actual perceiver and I've only got an empty chair?

  Then give me the residue report: what carried over clean, what you had to fudge to make it fit, what has no expression in craft vocabulary at all, and whether that residue is my framework being thin or Berkeley being less clear than he sounds. And then the part I actually care about: I'm stuck on a chapter set in a house after everyone has left it, and I can't decide whether to narrate it or cut it. Tell me what I'd be doing in each case, and what a novel can do here that the argument can't. I think there's a workshop essay in this for the spring, so be honest about where the reading won't hold.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Novelist (3 books published), occasional workshop teacher, minimal philosophy background (dropped one class).
      *   **Goal:** Understand George Berkeley's Idealism (*esse est percipi* - to be is to be perceived) using literary craft vocabulary, identify where the analogy breaks, and apply it to a specific writing problem (a chapter in an empty house).
      *   **User's Current Understanding:** Things = collections of ideas; Ideas exist in minds; To be = to be perceived; Master Argument (can't conceive unperceived tree); God sustains reality when humans aren't looking; Minds are "notions," not ideas.
      *   **Required Vocabulary:** Scene/summary, POV, focalization, free indirect style, implied author, voice, backstory, world bible, published text vs. draft, reader inference.
      *   **Four Specific Questions:**
          1.  Summary (unperceived events) vs. Berkeley (who perceives it? Reader? Implied Author?).
          2.  Sense vs. Imagination (Berkeley's distinction) vs. On-page vs. In-head (Storyboarding).
          3.  Free Indirect Style (FIS) vs. Berkeley's "Notion" of Spirit/Mind.
          4.  Drafts/Cut Material (Indeterminacy) vs. Berkeley's God (Determinacy).
      *   **Deliverables:**
          1.  Translation of Berkeley into craft terms.
          2.  Corrections of user's understanding (in craft terms).
          3.  Answers to the four specific questions.
          4.  Residue Report (what fits, what's fudged, what's missing).
          5.  Practical Advice (The empty house chapter: narrate or cut?).
          6.  Workshop Essay potential (honesty about limitations).

  2.  **Deconstruct Berkeley's Idealism (Mental Sandbox):**
      *   *Core:* Material substance doesn't exist. Only minds (spirits) and ideas exist.
      *   *Esse est percipi:* Objects are bundles of sensations. No sensation = no object.
      *   *The Gap:* If I close my eyes, does the world vanish? No, because God perceives it constantly.
      *   *Minds:* Minds are active perceivers, not passive ideas. You can't have an "idea" of a mind, only a "notion" (relational understanding).
      *   *Master Argument:* You cannot conceive of an object existing unconceived, because the act of conceiving it puts it in your mind.

  3.  **Translate to Craft Vocabulary (The "Bridge"):**
      *   *Object/Tree:* A described detail in the text.
      *   *Mind/Spirit:* The consciousness processing the detail (Character, Narrator, Reader).
      *   *God:* The Implied Author / The Text itself as a permanent record / The Reader at any given time.
      *   *Idea:* A sensory image or thought rendered in prose.
      *   *Notion:* The structural presence of a POV character that isn't described physically.

  4.  **Address the Four Questions:**

      *   *Q1: Summary & Unperceived Events.*
          *   Berkeley: Nothing exists unperceived.
          *   Craft: Summary often tells us "The war lasted four years." No one saw all of it.
          *   Translation: In a novel, "existence" is textual presence. If it's in the summary, it's perceived by the *Narrator* (voice). If the narrator is omniscient, they are the "God" figure. If the reader stops reading, the book still exists as ink/code (Materialism!), but the *story world* suspends.
          *   The "Cheat": The Implied Author is the Berkeleyan God. They hold the continuity. Is it a cheat? No, it's the contract of fiction.

      *   *Q2: Sense vs. Imagination (On-Page vs. In-Head).*
          *   Berkeley: Senses = vivid, ordered, involuntary (God's language). Imagination = faint, voluntary.
          *   Craft: On-page text = fixed, shared (like Sense). Reader's imagination/Storyboarding = variable, internal (like Imagination).
          *   The Slide: Berkeley argues about *conceiving* (mental act). The Master Argument says you can't think of an unthought thing.
          *   Craft parallel: You can't write a scene that isn't written. But can you write a scene *about* an unobserved thing? Yes, via Omniscience.
          *   The Break: Berkeley denies material substrate. Craft assumes a material substrate (the book) that holds the "ideas" even when not read. Berkeley would say the book is just an idea too.

      *   *Q3: Free Indirect Style (FIS) & The Mind.*
          *   Berkeley: We perceive ideas, but we *notion* the mind perceiving them. We never see the eye seeing.
          *   Craft: In FIS, we see the world *through* the character. We never see the character's consciousness directly, only its effects on the prose.
          *   Match: This is a perfect map. The "Voice" is the notion of the spirit. The "Description" is the ideas.
          *   The Hole: In craft, we know the character is fictional (an idea). In Berkeley, the mind is real (a spirit).

      *   *Q4: Drafts/Cut Material (Indeterminacy).*
          *   Berkeley: God knows everything. The world is fully determined even if I don't look.
          *   Craft: The "World Bible" might be empty. If I didn't decide breakfast, it didn't happen.
          *   Comparison: This makes the Novel *more* idealist than Berkeley. Berkeley needs God to fill the gaps. The Novelist can leave gaps (Negative Capability).
          *   The Break: Berkeley hates indeterminacy (it implies chaos/atheism). The Novelist thrives on it.

  5.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Professional, peer-to-peer (writer to writer), sharp but accessible. No jargon without definition.
      *   *Structure:* Follow the user's requested structure (Translation -> Corrections -> 4 Points -> Residue -> Practical Advice).
      *   *Key Insight:* The "Book" is the material substance Berkeley denies. This is the biggest friction point.

  6.  **Refining the "Empty House" Advice:**
      *   If you narrate it: You invoke the Omniscient God (Implied Author). The house exists because the Voice says so.
      *   If you cut it: The house ceases to exist (Berkeleyan wink-out).
      *   Novel advantage: You can make the *absence* the point. Berkeley can't do "nothingness" easily because God is always there. A novel can dwell on the silence.

  7.  **Final Review against Constraints:**
      *   Did I use the specific vocab list? (Scene, summary, focalization, FIS, implied author, etc.)
      *   Did I answer all 4 points? Yes.
      *   Is the residue report honest? Yes.
      *   Is the advice practical? Yes.

  8.  **Self-Correction during drafting:**
      *   *Correction:* I need to be careful not to conflate the *physical book* with the *story world*. Berkeley would say the physical book is also an idea. But for the writer, the physical draft is real. I need to distinguish between the *ontological status of the fiction* vs. the *ontology of the book object*.
      *   *Refinement on Q1:* The "Reader at 3am" issue. The text exists materially. The *experience* of the story suspends. Berkeley says the *object* suspends without a mind. So the analogy holds for the *experience*, not the *paper*.
      *   *Refinement on Q4:* The "World Bible." If the author hasn't decided, does it exist? For Berkeley, God has decided. For the author, they might not have. This is a crucial divergence.

  9.  **Final Polish:** Ensure the "Workshop Essay" hook is strong. (Proceed to generate output).

  *(Self-Correction Note: Make sure to explicitly correct the user's summary of Berkeley first, as requested, before diving into the four points.)*
  *User's Summary Check:* "Things are collections of ideas" (Yes). "Ideas exist only in minds" (Yes). "To be is to be perceived" (Yes). "Master Argument" (Yes). "God sustains" (Yes). "Minds are notions" (Yes). *Verdict:* Their summary is actually surprisingly accurate. I just need to tweak the "why" using craft terms.

  *Let's build the response.*
answer: |-
  Here is the translation, the breakdown, and the advice, rendered in the language of the workshop.

  ### Part 1: The Translation (Berkeley in Craft Terms)

  You have the gist right. Here is the rigorous translation into your vocabulary.

  **The Ontology of the Page:**
  For Berkeley, there is no "material substance." There is no table underneath the description of the table. There is only the description.
  *   **Berkeley:** Matter does not exist.
  *   **Craft:** The "World Bible" does not exist. There is only the **Published Text**. Anything not on the page is not just hidden; it is ontologically void.

  **The Perception Clause:**
  *   **Berkeley:** *Esse est percipi* (To be is to be perceived).
  *   **Craft:** To exist in the story, a detail must be **Focalized**. If no character sees it, and the **Narrator** does not describe it, it is not in the scene.

  **The Master Argument:**
  *   **Berkeley:** You cannot conceive of an un-conceived object.
  *   **Craft:** You cannot write a scene that isn't written. If you try to imagine a tree in your novel that no one sees, you are necessarily seeing it (as the author), so it is now **Draft**. It has entered the **Implied Author's** vision. You cannot access the "unread draft."

  **The God Solution:**
  *   **Berkeley:** God perceives everything constantly, so the world doesn't vanish when we close our eyes.
  *   **Craft:** The **Implied Author** (or the Omniscient Narrator) holds the continuity. When the POV character leaves the room, the **Summary** voice keeps the house standing.

  **The Mind/Notion Distinction:**
  *   **Berkeley:** We have "ideas" of things, but only a "notion" of minds (because minds do the perceiving, they aren't perceived).
  *   **Craft:** We have **Description** (ideas), but we only have **Voice** or **Focalization** (notion) for the consciousness. You can describe a character's hand, but you cannot describe the "I" that owns the hand; you can only demonstrate it through syntax.

  ***

  ### Part 2: Corrections to Your Summary

  You are 90% there. Here are the tweaks in your terms:

  1.  **"Collections of ideas":** Be careful here. In craft, we might say a character is a collection of traits. For Berkeley, a tree is literally a bundle of sensations (green, rough, tall). It has no "tree-ness" holding them together. In your terms: There is no **Backstory** or **Character Arc** holding the scenes together, only the sequence of scenes themselves.
  2.  **"God is in the system":** You called God a perceiver who never blinks. In craft terms, God is the **Omniscient Narrator** who is distinct from the **Implied Author**. The Implied Author is *you* (the creator); God is the *narrating consciousness* that guarantees the world's continuity within the text.
  3.  **"Minds themselves aren't ideas":** You got this right. In craft, this is the difference between a character as an image (ideas) and a character as a POV engine (mind). You can't focalize through a focalizer.

  ***

  ### Part 3: The Four Questions

  #### 1. Summary and the Unperceived Event
  *The Problem:* In **Summary**, you write: "The war lasted four years." No character lived every second of that. No narrator witnessed it. Who perceives this?
  *The Translation:* In Berkeley's system, if it isn't perceived, it isn't. In your system, if it's in the **Published Text**, it exists.
  *The Solution:* The perceiver is the **Narrator Voice**. Even in a "neutral" summary, there is a voice speaking. That voice is the Berkeleyan God. It is the consciousness that holds the timeline together when the characters are asleep.
  *The Cheat:* Is the **Implied Author** cheating by drafting in God? No. In fiction, the **Narrator** is always the sustainer. The only time the novel "blinks out" at 3 AM is if you equate the novel with the *reading experience* rather than the *text*. Berkeley would argue the text itself is just paper (ideas of paper), so without a mind (reader or God), the book vanishes too.
  *Verdict:* Summary works because the **Narrator** is the permanent perceiver. It's not a cheat; it's the definition of Omniscience.

  #### 2. Sense vs. Imagination (On-Page vs. In-Head)
  *The Problem:* Berkeley says sensory ideas are "strong/vivid/involuntary" (God-given), while imagined ideas are "faint/voluntary." You distinguish between **Published Text** (fixed) and **Storyboarding** (internal).
  *The Translation:* The Master Argument relies on *conceiving*. When you storyboard, you are conceiving. Berkeley says you can't conceive an unperceived tree.
  *The Slide:* Here is where the analogy exposes a slide in Berkeley. He conflates *the act of imagining* with *the object imagined*.
  *Craft Parallel:* When you storyboard a scene, it exists in your head. When you write it, it exists on the page. Berkeley claims the "page" (material world) is just more "head" (ideas).
  *The Break:* Your distinction rescues the argument *for the reader*, but not for the writer. For the reader, the text is "Sense" (fixed, external, vivid). For you, the text is "Imagination" (made up). Berkeley needs God to make the "Sense" real. You don't. You just need ink.
  *Verdict:* The Master Argument works for the **Reader** (they can't read what isn't there), but it fails for the **Writer** (you know you made it up). Berkeley denies the Writer exists; he only allows the Perceiver.

  #### 3. Free Indirect Style (FIS) and the Notion of Spirit
  *The Problem:* In FIS, the prose is the character's impression, but the character's mind is never depicted.
  *The Translation:* This is the cleanest map you have.
  *   **Ideas:** The imagery, the metaphors, the sensory details.
  *   **Notion:** The **Focalization**.
  *In FIS:* You never write "He thought." You write the thought. The "He" is the **Notion**—the invisible engine driving the syntax. You perceive the *output* of the mind (the prose), not the mind itself.
  *The Hole:* In Berkeley's system, the Mind (Spirit) is *Real*, and the Ideas are *Dependent*. In your system, the Mind (Character) is *Fictional*, and the Ideas (Words) are *Real* (on the page).
  *Verdict:* Craft cashes out Berkeley's "Notion" perfectly. FIS is the technical application of "perceiving a mind without seeing it." But craft inverts the reality status: for you, the words are the substance; for Berkeley, the mind is the substance.

  #### 4. Drafts and Cut Material (Indeterminacy)
  *The Problem:* You don't know what the protagonist had for breakfast. It's indeterminate. Berkeley's God knows.
  *The Translation:* This makes your world *more* idealist than Berkeley's, but in a way he would hate.
  *   **Berkeley:** The world is fully determined by God's mind. Indeterminacy is impossible.
  *   **Craft:** The world is indeterminate until **Drafted**.
  *The Break:* If you haven't decided the breakfast, there is no "fact of the matter." In Berkeley's world, there is always a fact of the matter because God is thinking it.
  *Verdict:* This ruins the analogy. Berkeley uses Idealism to secure *certainty* (Science is real because God perceives it consistently). You use Idealism to secure *possibility* (It didn't happen until I wrote it). Your "empty chair" is a void; Berkeley's "empty chair" is filled by God.

  ***

  ### Part 4: The Residue Report

  **What Carried Over Clean:**
  *   **FIS as Notion:** The idea that consciousness is a grammatical function, not a described object, is a perfect match for Berkeley's "Spirit."
  *   **The Narrator as God:** The Omniscient Voice solving the "winking out" problem is a robust parallel.
  *   **Text as Idea:** Treating the Published Text as the only reality matches *esse est percipi*.

  **What I Had to Fudge:**
  *   **The Material Book:** I had to treat the physical book as "real" for your sake. Berkeley would insist the book is also an idea. If we stick strictly to him, your manuscript vanishes when you leave the study.
  *   **The Reader:** Berkeley doesn't have "Readers." He has "Perceivers." A reader brings their own baggage; a Berkeleyan perceiver just receives God's data.

  **What Has No Expression in Craft Vocabulary:**
  *   **The Passive Will:** Berkeley's ideas are *forced* upon us (I can't choose to see the tree as blue). In craft, the reader can choose to interpret the tree as blue even if you wrote green. Craft allows for misreading; Berkeley's Idealism does not allow for misperceiving God's language.
  *   **Sin/Error:** For Berkeley, error is misinterpreting the connections between ideas. In craft, error is just bad writing. The moral dimension of "truth" in Berkeley doesn't map to "verisimilitude" in fiction.

  **Is the Residue Your Fault or His?**
  It's Berkeley's. He is less clear than he sounds. He wants the stability of the material world (science, gravity, breakfast) without the substance. You, as a novelist, are comfortable with the instability. You admit the world is made up. He insists it's real *because* it's made up (by God). Your framework is actually more consistent for fiction than his is for reality.

  ***

  ### Part 5: The Empty House Chapter (Practical Advice)

  You are stuck on a chapter set in a house after everyone has left.
  *Option A: Narrate it.*
  *Option B: Cut it.*

  **What You Are Doing In Each Case:**

  **If You Narrate It (The Berkeleyan Move):**
  You are invoking the **Omniscient God**. You are asserting that the House has an existence independent of the Characters. The dust motes dancing in the light are "Ideas" perceived by the **Narrator Voice**.
  *   *Effect:* This creates atmosphere, haunting, or thematic weight. The house becomes a character (a Spirit).
  *   *Risk:* It slows the pace. It breaks the **Focalization** contract if you've been tight Third Person up to now.
  *   *Berkeleyan Verdict:* This is the only way the house "exists." Without this narration, the house is void.

  **If You Cut It (The Anti-Berkeleyan Move):**
  You are asserting that the House *only* exists when the Characters are in it. This aligns with **Limited POV**.
  *   *Effect:* The story remains strictly about the human experience. The silence is felt by the *reader* in the gap between chapters, not by a narrator in the text.
  *   *Risk:* You lose the mood.
  *   *Berkeleyan Verdict:* The house literally ceases to be. The story jumps from "Leaving" to "Returning."

  **What The Novel Can Do That The Argument Can't:**
  Berkeley cannot tolerate a gap. God must be perceiving the house every nanosecond.
  **You can write the gap.**
  You can write a chapter that is *about* the absence of perception. You can use **Free Indirect Style** to show the house "waiting." You can make the silence the subject. Berkeley's God is too busy perceiving to let the silence breathe. Your **Implied Author** can step back and let the nothingness hang there.

  **Recommendation:**
  Write the chapter, but write it as **Negative Capability**. Don't describe the house as if a camera is there. Describe it as if the house is feeling the absence of the people. Use the **Voice** to suggest that the *lack* of perception is the point.
  *   *Why:* Because in a novel, indeterminacy is a tool. In Berkeley's system, it's a bug. Use the bug.

  ***

  ### Part 6: The Workshop Essay Hook

  For your spring essay, here is the honest limitation:
  **Fiction is a better Idealism than Berkeley's.**

  Berkeley tries to use Idealism to prove the world is stable (God watches). Fiction uses Idealism to prove the world is malleable (The Author decides).
  Your essay shouldn't try to prove Berkeley right using novels. It should argue that **Novelists are the only honest Idealists.** We admit the world is made of language (ideas) and sustained by consciousness (readers/narrators). We don't need a God to hold the roof up; we just need the next page turn.

  Berkeley fails because he wants his cake (no matter) and eat it too (stable physics). You succeed because you admit the cake is made of words.

  **Final Verdict on the Chapter:**
  Keep it. But make the narration acknowledge that it is holding the world up by a thread. Let the reader feel the effort of the **Voice** keeping the house from winking out. That is the novelistic truth of Berkeley's system.
