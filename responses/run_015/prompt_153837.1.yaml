  **The Scenario**
  Beauty is put to sleep on Sunday. A fair coin is flipped. If it lands Heads, she is awakened on Monday and again on Tuesday, with amnesia induced between awakenings. If it lands Tails, she is awakened on Monday only. In all cases, a digital calendar is visible on the wall during every awakening, displaying the current day of the week. Beauty knows the schedule and the fairness of the coin. She wakes up, sees the calendar, and reads "Monday."

  **The Bookkeeping**
  *Assumptions:* The coin is fair ($P(Heads) = 1/2$). The "Halfer treatment" assigns uniform indifference over awakenings within a branch (e.g., if there are two awakenings, each gets probability $1/2$ conditional on that branch). The "Thirder treatment" assigns credence proportional to the total number of centered awakenings across the experiment.

  *Halfer Calculation:*
  1.  **Prior:** $P(Heads) = 1/2$.
  2.  **Likelihoods:** Given Heads (2 awakenings: Mon, Tue), $P(\text{Mon} | Heads) = 1/2$. Given Tails (1 awakening: Mon), $P(\text{Mon} | Tails) = 1$.
  3.  **Marginal:** $P(\text{Mon}) = P(\text{Mon} | H)P(H) + P(\text{Mon} | T)P(T) = (1/2 \cdot 1/2) + (1 \cdot 1/2) = 3/4$.
  4.  **Posterior:** $P(Heads | \text{Mon}) = \frac{P(\text{Mon} | H)P(H)}{P(\text{Mon})} = \frac{1/4}{3/4} = 1/3$.
  5.  **Result:** Credence in Heads lowers ($1/2 \to 1/3$).

  *Thirder Calculation:*
  1.  **Prior:** There are 3 possible centered awakenings ($H_{Mon}, H_{Tue}, T_{Mon}$). Each is weighted $1/3$. $P(Heads) = P(H_{Mon}) + P(H_{Tue}) = 2/3$.
  2.  **Evidence:** "Monday" eliminates $H_{Tue}$.
  3.  **Posterior:** Remaining possibilities are $H_{Mon}$ and $T_{Mon}$. They retain equal weight. $P(Heads | \text{Mon}) = 1/2$.
  4.  **Result:** Credence in Heads lowers ($2/3 \to 1/2$).

  **The Feature Doing the Work**
  The decisive feature is the **inverse frequency of the observed day across coin branches**. In the classic case, Monday constitutes 100% of Heads awakenings but only 50% of Tails awakenings, so learning "Monday" favors Heads. In this variant, Monday constitutes only 50% of Heads awakenings but 100% of Tails awakenings, so learning "Monday" favors Tails. Both treatments agree on the direction of the update because both rely on the ratio of Monday-awakenings to total-awakenings within each branch, which has been flipped relative to the classic setup.

  **The Removal Test**
  If we alter the schedule to be symmetric regarding Monday proportions—for example, Heads yields (Monday, Tuesday) and Tails yields (Monday, Wednesday)—the likelihood of observing Monday becomes equal in both branches ($1/2$). Under the Halfer treatment, $P(Heads | \text{Mon})$ remains $1/2$. Under the Thirder treatment, the ratio of Monday-Heads to Monday-Tails awakenings is 1:1, so $P(Heads | \text{Mon})$ remains equal to the prior ratio of Heads-Tuesdays to Tails-Wednesdays (which is 1:1), resulting in no update. The case collapses into a scenario where centered evidence is inert regarding the coin, confirming that the asymmetry in day-frequency was driving the update.

  **Defender Attacks**
  1.  **The Centered-Inertia Defender:** This philosopher holds that centered evidence cannot move uncentered credence. To maintain this, they must deny the Halfer conditionalization above. However, Spec 5 mandates the "three-fourths for Monday" treatment, which mathematically entails $P(Heads | \text{Mon}) = 1/3$. To insist $P(Heads | \text{Mon}) = 1/2$ while accepting the day-credences ($P(\text{Mon}|H)=1/2, P(\text{Mon}|T)=1$) creates a direct violation of the probability axioms ($P(A|B) \neq P(B|A)P(A)/P(B)$). They are forced to reject the standard definition of conditional probability or the relevance of indexical likelihoods, rendering their position incompatible with Bayesian updating.
  2.  **The Double Halfer:** This defender wants $P(Heads)$ to remain $1/2$ both before and after learning the day. To achieve this, they must reject the "uniform indifference over one's own awakenings" constraint. They would argue that because the design guarantees a Monday awakening in *both* branches, Beauty should be certain it is Monday upon waking ($P(\text{Mon})=1$). If $P(\text{Mon})=1$, learning "Monday" provides no information, and $P(Heads)$ stays at $1/2$. This attacks the case by denying the premise that the *number* of awakenings dictates day-credences, effectively rejecting the Self-Sampling Assumption in favor of a Self-Indication Assumption that treats the guaranteed Monday as a fixed reference point rather than a random sample.

  **What the Case Cannot Show**
  This case cannot settle whether the initial prior credence in Heads should be $1/2$ or $2/3$, as it presupposes the internal logic of both positions to demonstrate that, whichever prior you accept, the directional impact of centered evidence is robust.
