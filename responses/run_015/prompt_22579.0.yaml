          *   In Futarchy: Price $\to$ Selection of Reality.
          *   Equation: $P \approx E[Y | X(P)]$.
          *   This is an implicit function. We are looking for a fixed point $P^*$ such that $P^* = E[Y | X(P^*)]$.
          *   Problem: There might be multiple fixed points. Or the function might be unstable.
      *   *Self-Fulfilling Prophecies:* If the market thinks Policy A will work, it selects A. If selecting A makes it work (via confidence, investment, etc.), the market was "right," but only because it was believed.
      *   *Goodhart Distinction:*
