      *   **Goodhart's Law on Steroids:** Distinguish this from standard Goodhart's Law. Standard Goodhart is "measure becomes target." This is "measure becomes *cause*."
      *   **Equilibrium Analysis:** Discuss stable vs. unstable equilibria. Multiple equilibria (sunspot equilibria).
      *   **Analogy for a Chemist:** Use a chemical equilibrium or measurement interference analogy (e.g., a probe that changes the temperature of the solution it measures).
      *   **Conclusion:** Summarize the shift from "epistemic tool" to "control system."

