      *   *Underlying Assumption:* The market price $P$ is an unbiased estimator of $E[Outcome | Policy]$.
      *   *The User's Critique:* $P$ influences $Policy$, and $Policy$ influences $Outcome$. Therefore, $P$ influences $Outcome$. The estimator is no longer independent of the variable being estimated.

  3.  **Develop the Argument Structure:**
