answer: |-
  ### Preliminary Brainstorming: The Conceptual Landscape

  Before drafting the formal proposal, it is necessary to map the conceptual terrain to ensure the argument is pitched correctly for an internal grant committee. The core tension lies in the intersection of three domains: standard Evidential Decision Theory (EDT), the specific logical structure of XOR blackmail, and the temporal dynamics of commitment.

  **1. The Standard XOR Blackmail Puzzle**
  In the canonical formulation (popularised by Yudkowsky and Soares, though with roots in earlier Newcomb-like problems), an agent receives a blackmail letter. The blackmailer's policy is to send the letter if and only if a specific bad state of affairs obtains *XOR* the agent pays the demand.
  *   **CDT (Causal Decision Theory):** Argues that the state of the world (whether the bad thing is true) is causally independent of the agent's current action. The letter has already arrived. Paying loses money and changes nothing about the past. Recommendation: Do not pay.
  *   **EDT (Evidential Decision Theory):** Argues that the agent's action provides evidence about the state of the world. If the agent pays, this makes it highly probable that the bad thing is false (because the blackmailer's condition for sending the letter would have been satisfied by the payment rather than the bad state). If the agent refuses, it makes it highly probable the bad thing is true. Recommendation: Pay.

  **2. The Conflation Hypothesis**
  The standard analysis often treats the receipt of the letter as the starting point of the decision problem. However, this ignores the *ex-ante* stage where the agent exists prior to the blackmailer's simulation or decision.
  *   **Commitment Credibility:** Can the agent bind themselves to a policy beforehand? If the blackmailer simulates the agent's *policy* rather than their *momentary action*, the problem structurally resembles Newcomb's Problem more than a standard sequential game.
  *   **Evidential Updating:** The crux of the user's intuition is that EDT's "irrationality" here might stem from treating the *ex-post* decision as isolated. If we formally separate the stages, does EDT recommend a policy *ex-ante* that it then fails to execute *ex-post*? If so, the problem is dynamic inconsistency. Or, does the evidential link dissolve once we acknowledge the *ex-ante* causal structure?

  **3. The Gap**
  Much of the recent literature (FDT/TDT proponents) argues that EDT is simply wrong in these cases. However, fewer papers investigate whether EDT can be "saved" or at least clarified by rigorously modelling the temporal separation. If EDT agents are rational to precommit but irrational to comply, this is a specific type of failure (akrasia/time-inconsistency) distinct from a failure of normative guidance. Distinguishing these is vital for understanding the normative force of decision theories.

  **4. Scope for One Term**
  A single term (10–12 weeks) is insufficient for a comprehensive historical survey or empirical testing. It is, however, perfect for constructing a rigorous formal model and producing a tight philosophical argument (approx. 8,000–10,000 words for a paper, hence a 4,000-word proposal is generous). The focus must remain on the formal separation of stages and the resulting dominance arguments.

  ***

  # Research Proposal

  **Project Title:** Decoupling Commitment and Evidence: A Two-Stage Analysis of XOR Blackmail in Evidential Decision Theory

  **Principal Investigator:** [Your Name]
  **Department:** Philosophy
  **Duration:** One Term (12 Weeks)
  **Funding Request:** Internal Research Grant Scheme

  ## 1. Abstract

  This project proposes a formal re-examination of the XOR Blackmail problem within the framework of Evidential Decision Theory (EDT). Standard analyses of XOR blackmail suggest that EDT yields counter-intuitive recommendations, compelling agents to pay blackmailers based on spurious evidential correlations. However, existing literature often conflates the *ex-ante* stage of policy selection with the *ex-post* stage of compliance upon receiving evidence. This project hypothesises that formally separating these two stages reveals that the paradox for EDT does not necessarily arise from flawed belief-updating per se, but from a structural ambiguity regarding commitment credibility. By constructing a two-stage formal model, I will investigate whether the normative tension dissolves when the decision problem is treated as a choice over policies rather than actions. The outcome will clarify whether EDT's failure in XOR blackmail is a fundamental error in evidential reasoning or a manageable instance of dynamic inconsistency, with significant implications for the broader debate between causal and evidential approaches to rational choice.

  ## 2. Introduction and Background

  ### 2.1 The Problem of XOR Blackmail
  Decision theory is currently fractured by a class of problems known as "Newcomb-like" or "logical correlation" problems. Among these, XOR blackmail stands out as a particularly stubborn challenge for orthodox Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).

  In the canonical scenario, an agent faces a blackmailer who operates under a specific logical constraint. Let $S$ represent a state of the world where some damaging fact is true ($S=1$) or false ($S=0$). Let $A$ represent the agent's action: Pay ($A=1$) or Refuse ($A=0$). The blackmailer sends a demand letter ($L=1$) if and only if $S \oplus A = 1$ (where $\oplus$ denotes the exclusive OR function). In other words, the letter is sent if exactly one of the following is true: the damaging fact obtains, or the agent pays.

  The agent receives the letter ($L=1$). They must now decide whether to pay.
  *   **The Causal View:** The state $S$ is already fixed. The letter has already arrived. The agent's current action $A$ cannot causally influence $S$. Paying incurs a cost with no benefit. CDT recommends Refusal.
  *   **The Evidential View:** The agent's action provides evidence about $S$. If the agent Pays, the condition $S \oplus 1 = 1$ implies $S=0$. If the agent Refuses, the condition $S \oplus 0 = 1$ implies $S=1$. Thus, Paying is strongly correlated with the damaging fact being false. EDT recommends Payment.

  Intuitively, paying the blackmailer seems irrational; it rewards a threat that has already been executed. Yet, EDT seems to mandate payment to secure the "good news" that the damaging fact is false. This result is widely cited as a *reductio* against EDT.

  ### 2.2 The Conflation of Stages
  The standard framing of this problem presents the decision node as occurring *after* the letter is received. This framing implicitly assumes that the blackmailer's decision to send the letter is causally or logically prior to the agent's decision, but that the agent's *policy* was not available for inspection prior to the sending.

  However, in most rigorous formulations (particularly those involving simulation or logical omniscience on the part of the blackmailer), the blackmailer sends the letter based on a prediction of the agent's behaviour. This introduces an *ex-ante* stage: a point in time before the letter is sent, where the agent might adopt a general policy regarding blackmail.

  Current literature often treats the *ex-ante* commitment and the *ex-post* compliance as a single continuous decision problem, or it dismisses the *ex-ante* stage as irrelevant to the *ex-post* rationality. This proposal argues that this is a category error.
  1.  **Commitment Credibility:** At the *ex-ante* stage, the agent chooses a function mapping observations to actions.
  2.  **Evidential Updating:** At the *ex-post* stage, the agent updates beliefs based on the observation and chooses an action.

  If we separate these, we may find that EDT recommends a "Refuse" policy *ex-ante* (because committing to refuse discourages the letter), but a "Pay" action *ex-post* (because once the letter is here, paying buys good news). If this is the case, the problem is not that EDT gives the wrong answer *simpliciter*, but that EDT agents are dynamically inconsistent. Conversely, if separating the stages alters the evidential relevance of the action at the *ex-post* stage, the paradox may dissolve entirely.

  ### 2.3 Motivation for the Project
  Why does this distinction matter? If the failure of EDT in XOR blackmail is due to dynamic inconsistency, then the remedy might be institutional or psychological (binding mechanisms) rather than theoretical (abandoning EDT for Functional Decision Theory). If, however, the failure persists even when stages are separated, it indicates a deeper flaw in how EDT handles logical correlations.

  Furthermore, this distinction sheds light on the nature of "rationality" itself. Is rationality about maximising utility over time (requiring consistency), or is it about making the optimal move given current information (myopic optimisation)? By formalising the two-stage model, we can test whether EDT can be reconciled with long-term rationality without abandoning its core tenet: that actions are evidence.

  ## 3. Precise Statement of the Research Question

  The primary research question for this project is:

  **Does formally distinguishing the *ex-ante* commitment stage from the *ex-post* compliance stage resolve the normative paradox of XOR blackmail for Evidential Decision Theory, or does it merely relocate the point of failure?**

  This main question breaks down into three subordinate questions:
  1.  **Formalisation:** Can the XOR blackmail problem be rigorously modelled as a two-stage extensive form game where the blackmailer's move depends on the agent's *ex-ante* policy rather than their *ex-post* action?
  2.  **Dominance Analysis:** Does a dominance argument hold at the *ex-ante* stage that conflicts with the dominance argument at the *ex-post* stage for an EDT agent?
  3.  **Dissolution vs. Displacement:** If a conflict exists, is it resolvable within EDT (e.g., via self-binding), or does it demonstrate that EDT is fundamentally incompatible with sequential rationality in logical correlation cases?

  ## 4. Literature Review and Identified Gap

  ### 4.1 The Standard Consensus
  The literature on XOR blackmail is primarily situated within the "rationalist" community and contemporary analytic decision theory. The consensus, broadly speaking, is that EDT fails this test case.
  *   **Causalists (e.g., Joyce, Lewis):** Argue that EDT violates the principle of autonomy; agents should not treat their actions as causes of states they cannot influence. The evidential correlation is deemed spurious.
  *   **Functionalists (e.g., Yudkowsky, Soares):** Argue that both CDT and EDT fail because they treat the agent's output as a free variable rather than the output of a decision algorithm. They propose Functional Decision Theory (FDT) as a solution, which treats the decision as selecting a logical function.

  ### 4.2 The Gap: Temporal Structure in Evidential Problems
  While the failure of EDT is well-documented, the *structural reason* for this failure is often glossed over.
  *   **Ahmed (2014)** and others have discussed dynamic inconsistency in decision theory, but often in the context of Newcomb's Problem or Toxin Puzzle, where the causal structure differs from XOR blackmail.
  *   **Precommitment Literature:** There is a rich vein of literature on precommitment (Schelling, Gauthier). However, these discussions usually assume CDT agents trying to mimic commitment. There is scant literature analysing how an *EDT* agent specifically navigates the transition from *ex-ante* policy selection to *ex-post* execution in the presence of logical blackmail.
  *   **The Conflation:** Most treatments of XOR blackmail present the payoff matrix as if the decision is made solely at the moment of receiving the letter. They assume the blackmailer's prediction is of the *action*, not the *disposition*. While FDT proponents emphasise the algorithm, they often do so to advocate for a new theory rather than to diagnose the specific breakdown within EDT's temporal processing.

  ### 4.3 Contribution of this Project
  This project fills the gap by isolating the temporal dimension. It does not seek to defend EDT against FDT necessarily, but to clarify *where* EDT breaks.
  *   If EDT breaks at the *ex-post* stage despite a rational *ex-ante* commitment, the problem is **akrasia**.
  *   If EDT breaks at the *ex-ante* stage (i.e., it recommends a policy that leads to the letter being sent), the problem is **planning failure**.
  *   If separating the stages makes the *ex-post* evidential link vanish (because the evidence is already "priced in" by the policy), the problem is **framing**.

  By pinpointing the locus of the failure, this research contributes to the metaphysics of decision theory: are decision problems static snapshots or temporal processes?

  ## 5. Methodology

  The project will employ a mixed method of formal modelling and conceptual analysis. The work will be divided into three phases over the one-term duration.

  ### 5.1 Phase 1: Formalising the Two-Stage Model (Weeks 1–4)
  The first task is to construct a rigorous formal representation of the XOR blackmail problem that explicitly distinguishes the two stages.

  **The Variables:**
  *   $S \in \{0, 1\}$: State of the world (Bad Thing False/True). Prior $P(S=1) = \epsilon$ (where $\epsilon$ is small).
  *   $\Pi$: The agent's policy, chosen at $t_0$. $\Pi: \{Letter, NoLetter\} \to \{Pay, Refuse\}$.
  *   $L \in \{0, 1\}$: Letter sent. Determined by Blackmailer Function $B(S, \Pi)$.
      *   Standard XOR condition: $L=1 \iff S \oplus \Pi(L=1) = 1$.
      *   *Crucial Nuance:* The blackmailer predicts what the agent *would do* if they received the letter. This depends on $\Pi$.
  *   $A \in \{0, 1\}$: Actual action taken at $t_1$ (upon receiving $L$).
  *   $U$: Utility function. $U = -1000 \cdot S - 100 \cdot A$. (Agent prefers ~S and ~A).

  **The Distinction:**
  Standard models conflate $\Pi(L=1)$ and $A$. In this model, I will treat them as distinct variables.
  *   **Ex-Ante Rationality:** Evaluating $E[U | \Pi]$ at $t_0$.
  *   **Ex-Post Rationality:** Evaluating $E[U | A, L=1]$ at $t_1$.

  **EDT Calculation:**
  I will formalise the EDT expected utility calculation for both stages.
  *   At $t_0$: The agent considers which policy $\Pi$ provides the best evidence for $S=0$.
  *   At $t_1$: The agent considers which action $A$ provides the best evidence for $S=0$, given $L=1$ is already observed.

  I will use probabilistic graphical models to represent the dependencies. Specifically, I will compare a causal graph (where $S \to L$ and $A \to U$) against an evidential graph (where $A \leftrightarrow S$ via the common effect $L$ or logical constraint). The key will be to represent the blackmailer's prediction as a logical node that links $\Pi$ to $L$.

  ### 5.2 Phase 2: Dominance and Consistency Analysis (Weeks 5–8)
  Once the model is established, I will apply dominance reasoning to both stages.

  **Ex-Ante Dominance:**
  Does a policy of "Refuse if Letter" dominate "Pay if Letter" from the perspective of $t_0$?
  *   If I commit to Refuse: The blackmailer sends letter iff $S \oplus 0 = 1 \implies S=1$. So if I commit to Refuse, I only get the letter if the Bad Thing is true.
  *   If I commit to Pay: The blackmailer sends letter iff $S \oplus 1 = 1 \implies S=0$. So if I commit to Pay, I only get the letter if the Bad Thing is false.
  *   *Wait, this is the crux:* If I commit to Pay, I get the letter more often (whenever S=0). If I commit to Refuse, I get the letter less often (only when S=1).
  *   But utility depends on $S$ and Cost.
      *   Commit Refuse: Letter sent only if $S=1$. I don't pay. Utility: $-1000$. (Bad outcome certain if letter arrives). But if $S=0$, no letter. Utility: $0$.
      *   Commit Pay: Letter sent if $S=0$. I pay. Utility: $-100$. If $S=1$, no letter (because $1 \oplus 1 = 0$). Utility: $-1000$ (Bad thing happens, but no letter? Wait, the blackmailer policy needs to be precise).

  *Correction on Blackmailer Policy for the Model:*
  Standard XOR Blackmail: Blackmailer sends letter iff ($S$ is True XOR Agent Pays).
  *   If Agent Policy is "Pay": Letter sent iff ($S$ True XOR True) $\iff$ $S$ False.
      *   Case $S=0$: Letter sent. Agent Pays. Cost 100. $S$ safe. Total -100.
      *   Case $S=1$: No Letter. Agent Pays nothing. $S$ bad. Total -1000.
  *   If Agent Policy is "Refuse": Letter sent iff ($S$ True XOR False) $\iff$ $S$ True.
      *   Case $S=0$: No Letter. Agent Pays nothing. $S$ safe. Total 0.
      *   Case $S=1$: Letter sent. Agent Refuses. Cost 0. $S$ bad. Total -1000.

  *Ex-Ante Comparison:*
  *   Policy Pay: Expected Utility = $P(S=0)(-100) + P(S=1)(-1000)$.
  *   Policy Refuse: Expected Utility = $P(S=0)(0) + P(S=1)(-1000)$.
  *   Since $P(S=0) \approx 1$, Policy Refuse yields $\approx 0$. Policy Pay yields $\approx -100$.
  *   **Result:** Ex-Ante, EDT should prefer the "Refuse" policy. It avoids the cost of paying in the likely scenario where $S=0$.

  **Ex-Post Dominance:**
  Now, assume the letter *has been received* ($L=1$).
  *   If I Pay: Evidence suggests $S=0$ (as derived in Intro). Utility $\approx -100$.
  *   If I Refuse: Evidence suggests $S=1$. Utility $\approx -1000$.
  *   **Result:** Ex-Post, EDT prefers "Pay".

  **The Conflict:**
  This preliminary derivation suggests a clear dynamic inconsistency. EDT recommends committing to Refuse, but executing Pay.
  The methodological task is to verify if this holds under all plausible priors and utility functions, and whether there are formal ways within EDT to "lock in" the *ex-ante* preference (e.g. by treating the *ex-post* self as a different agent or by modifying the evidential conditional).

  ### 5.3 Phase 3: Philosophical Interpretation and Drafting (Weeks 9–12)
  The final phase involves interpreting the formal results.
  *   **Scenario A (Dissolution):** If the formal model shows that a sophisticated EDT agent recognises the *ex-post* evidential link is screened off by the *ex-ante* policy choice, the paradox dissolves. (I assess this as unlikely but must test it).
  *   **Scenario B (Displacement):** If the model confirms dynamic inconsistency, the paradox shifts from "EDT is wrong" to "EDT agents are time-inconsistent." This changes the normative implication. It suggests EDT agents need precommitment devices, similar to hyperbolic discounters.
  *   **Scenario C (Structural Failure):** If the *ex-ante* calculation also fails (e.g., if EDT cannot properly evaluate the policy because it treats the policy choice itself as evidence in a problematic way), then EDT is fundamentally flawed for sequential problems.

  I will draft the final paper during this period, ensuring the argument is accessible to general philosophers of rational choice, not only specialists in decision theory.

  ## 6. Expected Results and Failure Conditions

  ### 6.1 What Success Looks Like
  A successful outcome for this grant is a completed manuscript (approx. 8,000 words) that achieves one of the following:
  1.  **Definitive Classification:** It conclusively demonstrates that the XOR blackmail paradox for EDT is a case of dynamic inconsistency rather than immediate irrationality. This would refine the critique of EDT, moving it from "it gives the wrong answer" to "it cannot coordinate with itself over time."
  2.  **Formal Clarification:** It produces a standardised two-stage formalism for XOR blackmail that future literature can adopt, clearing up ambiguities in how the blackmailer's prediction is modelled.
  3.  **Normative Insight:** It shows that if EDT agents are allowed to precommit, they outperform CDT agents, even if they are dynamically inconsistent. This would be a significant "save" for EDT, suggesting it is a viable theory provided agents have access to binding technology.

  ### 6.2 What Counts as Failure
  Given the speculative nature of philosophical research, "failure" does not mean proving a hypothesis wrong, but rather failing to advance the debate.
  1.  **Triviality:** If the two-stage model turns out to be mathematically equivalent to the standard one-stage model (i.e., the separation adds no analytical value), the project would fail to justify its premise. I mitigate this by ensuring the blackmailer's prediction target ($\Pi$ vs $A$) is explicitly distinct in the formalism.
  2.  **Inconclusiveness:** If the dominance arguments depend heavily on specific prior probabilities (e.g., only works if $\epsilon < 0.01$) without a principled reason for those priors, the result may be too fragile to publish.
  3.  **Scope Creep:** Attempting to solve the broader CDT vs. EDT debate rather than focusing on the specific structural question of XOR blackmail. The timeline is too short for a general defence of EDT.

  ### 6.3 Risk Management
  *   **Risk:** The formalism becomes too technical for a general philosophy journal.
      *   **Mitigation:** Keep the mathematics in an appendix or supplementary material; focus the main text on the conceptual implications of the two-stage separation.
  *   **Risk:** The conclusion is that "FDT is just better."
      *   **Mitigation:** Frame the paper as an *internal* critique of EDT. Even if FDT is the ultimate solution, mapping the precise failure mode of EDT is a valuable contribution to the literature.

  ## 7. Scope and Timeline Check

  ### 7.1 One-Term Feasibility
  A single term (12 weeks) is a tight but appropriate constraint for this specific question.
  *   **Weeks 1–3:** Literature review refinement and formal model construction. (This is the heaviest lift).
  *   **Weeks 4–6:** Running the dominance arguments and checking edge cases (e.g., what if the blackmailer is fallible?).
  *   **Weeks 7–9:** Drafting the argument.
  *   **Weeks 10–12:** Revision and submission preparation.

  This scope is realistic because it avoids empirical work and relies on existing logical frameworks. It does not attempt to survey the entire history of decision theory, but focuses narrowly on the temporal structure of one specific problem.

  ### 7.2 Resource Requirements
  *   **Buy-out:** I am requesting 50% buy-out from teaching duties for one term to ensure uninterrupted focus on the formal modelling.
  *   **Research Assistance:** No RA is required; the formalisation is within the PI's expertise.
  *   **Travel:** Minimal. Potential presentation at a decision theory workshop (e.g., LSE or ANU) if timing permits, but not essential for the grant deliverables.

  ## 8. Significance and Broader Impact

  ### 8.1 Contribution to Decision Theory
  This project addresses a foundational question: How should rational agents handle logical correlations over time? By isolating the commitment stage, we clarify the boundary between *planning* rationality and *choice* rationality. This has implications beyond blackmail, extending to any scenario involving prediction (e.g., job markets, credit scoring, algorithmic governance) where an agent's current choices are predicted based on their past dispositions.

  ### 8.2 Contribution to Philosophy of Action
  The distinction between *ex-ante* policy and *ex-post* action touches on the philosophy of action regarding intention. If an EDT agent intends to refuse but pays, do they have a unified agency? This project contributes to debates on diachronic rationality and the nature of intention as a guide for action.

  ### 8.3 Internal Departmental Benefit
  Delivering a paper on this topic will enhance the department's profile in formal philosophy and decision theory. It aligns with our strategic goal of strengthening research output in metaphysics and epistemology. The resulting paper will be targeted at top-tier journals (e.g., *Philosophy and Phenomenological Research*, *Nous*, or *British Journal for the Philosophy of Science*), ensuring high visibility.

  ## 9. Conclusion

  The XOR blackmail problem is often treated as a graveyard for Evidential Decision Theory. This proposal argues that the grave may be dug too shallow. By rigorously separating the stage of commitment from the stage of compliance, we may find that EDT's failure is not a sudden collapse of rationality upon receiving bad news, but a predictable friction between long-term planning and short-term evidential optimisation.

  Whether this distinction saves EDT or merely clarifies its demise, the analysis is necessary. We cannot accurately diagnose the limits of evidential reasoning without first ensuring we are looking at the correct temporal structure of the decision problem. This project offers a precise, formal, and philosophically rigorous method to do exactly that. Within one term, I will deliver a clear answer to whether the paradox dissolves or shifts, providing a valuable reference point for future work in rational choice theory.

