answer: |-
  ### Part 1: Brainstorming Pass

  Before constructing the procedure, we must isolate the variables. A spray decision is not merely agronomic; it is a distribution of risk and harm across time, species, and neighbors.

  **Factual Considerations (The "Is")**
  *   **Pest Density:** Is the population above the Economic Injury Level (EIL)?
  *   **Efficacy:** Will this chemical actually work on this strain?
  *   **Alternatives:** Are there biological, cultural, or mechanical controls available *now*?
  *   **Resistance Status:** What is the current susceptibility of the local population? How many modes of action remain?
  *   **Exposure:** What non-target organisms (pollinators, neighbors, water) are in the drift zone?

  **Ethical Considerations (The "Ought")**
  *   **Livelihood:** The grower's right to solvency vs. the cooperative's long-term viability.
  *   **Fairness:** Is the applicant absorbing a cost (restraint) that competitors are not? (The "Sucker's Payoff").
  *   **Stewardship:** Duty to future growers (resistance) and future ecosystems (biodiversity).
  *   **Suffering:** If insects are sentient, does chemical death cause more suffering than predation/starvation?

  **Irreducibly Uncertain (The "Unknown")**
  *   **Sentience Probability:** We do not know if the pest feels pain. We must act under risk.
  *   **Counterfactual Mortality:** Would the specific insects killed by the spray have died naturally this week? (The Displacement Problem).
  *   **Resistance Tipping Point:** We cannot know exactly which spray breaks the camel's back on resistance.
  *   **Market Reality:** Will the "cosmetic damage" actually result in financial loss, or is it perceived risk?

  ***

  ### Part 2: The Valley Spray Protocol (Decision Procedure)

  **Instructions for the Board:** This procedure must be completed by the applicant with Extension Agent verification. The Board votes only on Step 5. If any prior step triggers a "Stop," the application is denied without Board vote.

  **Step 1: The Necessity Test (Factual)**
  *   **Question:** Is the pest currently present *and* projected to exceed the Economic Injury Level (EIL) within 7 days without intervention?
  *   **Evidence Required:** Scouting logs, trap counts, or Extension Agent visual verification.
  *   **Stop Condition:** If **NO** (Prophylactic use), application is **DENIED**.
      *   *Reasoning:* Spraying without confirmed threat fails the necessity requirement and wastes the resistance commons.
  *   **Note on Scouting:** If scouting is "unreliable" (e.g., pest is hidden), the Agent must certify that *no* reliable method exists. If none exists, prophylactic use is treated as "High Risk" in Step 3.

  **Step 2: The Alternative Check (Factual/Practical)**
  *   **Question:** Is there a non-chemical control (biocontrol, mating disruption, pruning) that keeps loss below EIL?
  *   **Evidence Required:** Cost/benefit comparison (Chemical vs. Alternative).
  *   **Stop Condition:** If **YES** (Alternative exists and is economically viable), application is **DENIED** *unless* Step 4 overrides.
      *   *Reasoning:* Unnecessary chemical suffering is unjustified if effective alternatives exist.
      *   *Definition of Viable:* "Viable" means the grower remains solvent. It does not mean "maximum profit." If the alternative costs 20% more but keeps the farm profitable, it is viable.

  **Step 3: The Resistance Commons Veto (Ethical/Factual)**
  *   **Question:** If every grower in the valley used this chemical on this crop for this pest, would the mode of action fail within 5 years?
  *   **Evidence Required:** Extension Agent resistance risk assessment (Low/Med/High).
  *   **Stop Condition:** If **HIGH RISK**, application is **DENIED**.
      *   *Reasoning:* This is a Universalizability Veto. You cannot spend shared capital (susceptibility) on a private gain if universal spending bankrupts the account.
      *   *Exception:* Only if the farm faces immediate bankruptcy (verified by Board) *and* no other mode of action exists.

  **Step 4: The Displacement & Sentience Heuristic (Ethical/Uncertain)**
  *   **Question A (Displacement):** If we do nothing, what percentage of these specific insects would die naturally within 14 days?
      *   *Input:* Grower estimate (None / Some / Most).
      *   *Rule:* If **"Most"** (e.g., winter is coming, predators are swarming), the moral cost of spraying rises. The spray converts a natural death into a chemical death for no net reduction in pest pressure. **DENY** unless crop survival is at stake.
  *   **Question B (Sentience Risk):** Does this chemical cause prolonged sub-lethal effects (tremors, paralysis) before death?
      *   *Input:* Extension Agent classification (Clean / Dirty).
      *   *Rule:* If **"Dirty"** (e.g., neurotoxins with slow knockdown), the burden of proof for Step 1 (Necessity) doubles.
      *   *Reasoning:* Under sentience uncertainty, we apply the Precautionary Principle. We assume a non-zero probability of pain. Slow death increases expected suffering.

  **Step 5: The Board Values Call (Judgment)**
  *   **Trigger:** Only reached if Steps 1-4 are passed but Step 2 identified a cost difference (Chemical is cheaper/faster than Alternative).
  *   **Question:** Is the financial savings to the grower sufficient to justify the increased resistance risk and insect suffering?
  *   **Procedure:** 3 Growers + 1 Agent vote. Majority rules.
  *   **Guidance:** Do not vote on agronomy (that is done). Vote on whether the *margin of profit* is worth the *moral cost*.

  ***

  ### Part 3: Application and Verdicts

  Here is the procedure applied to your three cases. I am committing to the verdicts.

  **(a) Prophylactic Neonicotinoid Seed Coating**
  *   **Step 1 (Necessity):** **FAIL.** Pest appears 1 year in 3. Scouting is unreliable, but "unreliable" does not justify "always." The procedure treats unreliable scouting as a data gap, not a license for prophylaxis.
  *   **Step 3 (Resistance):** **HIGH RISK.** Neonics are high-risk for resistance and non-target harm.
  *   **Verdict:** **DENY.**
  *   **Reasoning:** This fails the Universalizability Test. If everyone plants neonics "just in case," resistance accelerates rapidly for a pest that isn't even there most years. The "unreliable scouting" is a management failure by the grower, not a justification to spend the commons.

  **(b) Aphid Outbreak in Greenhouse (Wasps vs. Spray)**
  *   **Step 1 (Necessity):** **PASS.** Outbreak confirmed.
  *   **Step 2 (Alternatives):** **PASS (with caveat).** Wasps work but cost more and take 2 weeks longer.
  *   **Step 3 (Resistance):** **LOW RISK.** Greenhouse populations are often isolated from the valley commons.
  *   **Step 4 (Displacement):** **CRITICAL.** In a closed greenhouse, an unchecked aphid population often collapses the plant, leading to mass aphid starvation. Spraying kills the current generation instantly. Releasing wasps allows two weeks of aphid reproduction *before* control kicks in.
  *   **Step 5 (Board Vote):** **ALLOW.**
  *   **Verdict:** **APPROVE SPRAY.**
  *   **Reasoning:** This is the verdict you will likely dislike. Your instinct is "Biocontrol is always better." The procedure disagrees.
      1.  *Displacement Ledger:* Spraying now kills *X* aphids. Waiting for wasps allows *X* to reproduce into *5X*, all of whom eventually die (either by wasp or starvation). Total insect death is higher with biocontrol. Total suffering is likely higher.
      2.  *Economic Viability:* The procedure defines "Viable Alternative" as one that preserves solvency. A 2-week delay that significantly impacts cash flow or market window threatens the grower's ability to farm ethically next year. Human livelihood trumps marginal insect welfare when the insect welfare calculus (total death count) favors the spray.

  **(c) Spray for Purely Cosmetic Damage**
  *   **Step 1 (Necessity):** **FAIL.**
  *   **Analysis:** The grower claims financial loss. However, "Cosmetic" implies the food is safe and nutritious. The EIL is calculated on *economic* injury. If the market rejects the fruit, it is economic injury. *However*, the Board must verify if the loss is real or a fear of lower grading.
  *   **Step 4 (Displacement):** **NEGATIVE.** Pests causing cosmetic damage late in the season often have high natural mortality (end of lifecycle). Spraying adds chemical death to insects that would die in weeks anyway.
  *   **Verdict:** **DENY.**
  *   **Reasoning:** Unless the grower proves that *without* spray, the crop is unsellable (not just less profitable), this fails the Necessity Test. We do not spend the Resistance Commons or incur Insect Suffering for market perfectionism. This prevents an "arms race" where every grower sprays for looks, raising resistance for everyone.

  ***

  ### Part 4: The "Unlike" Verdict and Limitations

  **The Verdict You Will Not Like: Case (b) — Allowing the Spray.**
  You likely staff this board to *reduce* pesticide use. You instinctively feel that releasing wasps is the "moral" choice and spraying is the "industrial" choice.
  **Why the Procedure is Right and Your Instinct is Wrong:**
  Your instinct relies on a heuristic ("Chemicals = Bad, Nature = Good") rather than the consequentialist reality of the situation.
  1.  **Total Suffering:** In a closed system, biocontrol often permits a higher peak pest density before suppression. If insects have even a small capacity for suffering, allowing the population to boom for two weeks before parasitism creates more total negative experience than a swift chemical knockdown.
  2.  **The Human Constraint:** A cooperative that bankrupts its members to save aphids ceases to exist. The procedure prioritizes the *continuity of ethical agency*. A bankrupt grower sells to a developer or an industrial conglomerate that cares even less about IPM. Protecting the grower's liquidity is a prerequisite for long-term stewardship.

  **What This Procedure Cannot Do (Systematic Errors):**
  1.  **The "Small Victim" Bias:** The procedure relies on the grower's economic data. It will systematically undervalue off-site harms (bee drift into wild hedgerows, aquatic invertebrate death in ditches) because no one "owns" those victims to speak for them in Step 5.
  2.  **The Verification Gap:** Step 1 relies on scouting. Growers who are bad at scouting will claim "unreliable" to bypass Step 1. The Extension Agent cannot verify 50 applications in 10 days perfectly. You will get false positives on "Necessity."
  3.  **The "Cosmetic" Loophole:** In Case (c), if a grower brings a signed letter from a buyer saying "We will not buy Grade B," the procedure *must* allow the spray (Step 1 passes). The procedure cannot fight market forces that demand perfection.

  **Monitoring Advice for Year One:**
  Watch the **Step 2 "Viability" Claims**. If growers consistently claim that biocontrol threatens solvency, audit their books. If they are lying to avoid the extra cost/effort of wasps, the procedure is being gamed. If they are telling the truth, you need to lobby buyers to accept Grade B fruit, because the procedure will always side with solvency over insects.
