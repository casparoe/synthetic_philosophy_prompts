  The claim stated precisely
  The threshold-domination thesis asserts that inheritance taxation is primarily justified not by rectifying luck-based unfairness, but by preventing wealth concentrations that exceed a specific limit. Beyond this limit, private economic power converts into social domination, undermining the substantive equality of status required for a functioning democracy, thereby necessitating redistribution to preserve political reciprocity.

  Your overall credence
  I assign a credence of 0.55 to the threshold-domination thesis as the decisive foundation. Confident domination concerns outweigh luck-egalitarianism, but uncertainty remains on threshold coherence and policy efficacy versus alternatives.

  Sub-question decomposition with assigned probabilities
  Decomposing the thesis reveals varying degrees of philosophical stability across its necessary conditions. (i) Coherent Threshold: Can we non-arbitrarily distinguish inequality from domination? I assign 0.70. While specific numerical limits are contentious, qualitative shifts in power dynamics, such as the capacity for political capture or market control, suggest a discernible tipping point where wealth transforms into authority over others. This relies on sociological data. (ii) Democratic Equality: Does status require the absence of domination? I assign 0.80. Formal rights are insufficient if economic dependency dictates political will. Substantive equality demands protection against private oligarchy to ensure citizens interact as peers rather than masters and subjects within the public sphere. Republican freedom requires non-domination specifically. (iii) Appropriate Remedy: Is inheritance tax the specific tool? I assign 0.60. While it targets intergenerational consolidation directly, avoidance strategies may shift domination into other channels, such as unequal access to elite human capital or social networks, potentially reducing the policy's efficacy in curbing power. Capital taxes might be better but face coordination problems. (iv) Accommodation: Can other theories absorb this? I assign 0.50. Luck-egalitarianism focuses on individual unfairness regarding brute luck, not structural power relations. Efficiency arguments ignore distributional power dynamics entirely. Thus, domination offers unique normative force not fully captured elsewhere, though overlap exists regarding opportunity equality. Rawlsian difference principle might also overlap here significantly. These probabilities reflect the strength of the philosophical link between wealth and power, tempered by practical implementation challenges and theoretical overlap with existing frameworks. The core intuition—that extreme wealth corrupts democratic reciprocity—is strong, but translating this into a specific tax policy without arbitrary lines or unintended consequences remains philosophically and empirically contested among political philosophers and economists alike. The decomposition isolates the metaphysical possibility of a threshold from the institutional capacity to enforce it without leakage. Further empirical study on wealth elasticity is required. Ultimately, the validity of the thesis hinges on whether political equality is merely procedural or fundamentally socio-economic in nature, unresolved in contemporary literature.

  Combination logic
  To derive the overall credence, I treat the sub-questions as partially independent necessary conditions. A simple multiplicative model (0.70 × 0.80 × 0.60 × 0.50) yields 0.168, which is too low because these factors are correlated; accepting domination implies accepting the need for remedies. Instead, I use a weighted average approach, prioritizing the normative core (ii and iv) over implementation details (i and iii). The high confidence in democratic theory (0.80) boosts the overall figure, while uncertainty about tax efficacy (0.60) and theoretical uniqueness (0.50) drags it down. The final 0.55 represents a balance between the strong philosophical case for preventing oligarchy and the weak empirical case for inheritance tax as the singular solution. It acknowledges that while the diagnosis is robust, the prescribed treatment remains contestable.

  Sensitivity analysis
  My final credence is most sensitive to sub-question (iv): whether luck-egalitarian or efficiency considerations can accommodate the domination claim. If existing frameworks can fully absorb the normative force of preventing oligarchy without invoking a distinct domination thesis, the unique justificatory power of my position collapses. A shift in (iv) from 0.50 to 0.80 would raise my overall credence significantly, as it would confirm the thesis adds necessary theoretical value. Conversely, if domination is merely a subset of luck egalitarianism, the thesis loses its distinctiveness.

  What would shift your view
  Empirical evidence demonstrating that inheritance taxation fails to reduce wealth concentration due to elite avoidance, while simultaneously stifling capital formation needed for social mobility, would substantially revise my credence downward. Alternatively, a philosophical proof showing that formal political rights alone guarantee equal status regardless of economic disparity would undermine the normative core. Conversely, historical data showing stable democracies strictly require wealth caps would increase confidence. Ultimately, proving that economic power does not translate into political domination would falsify the premise.
