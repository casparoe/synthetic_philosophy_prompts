answer: |-
  # Diagnostic Decision-Tree Taxonomy: The Paradox of Deontology in Distributed Agency

  This taxonomy maps the logical space of deontological responses to harms produced by distributed or institutional agency (e.g., algorithmic systems, supply chains, democratic protocols). It proceeds via three binary questions regarding logical commitments. The tree generates eight logical leaves; occupied leaves represent coherent philosophical positions, while unoccupied leaves are diagnosed for incoherence or theoretical cost.

  ### **Root Question (Q1): Ontological Status of Constraint**
  **Do deontological constraints (e.g., "do not kill," "do not violate rights") apply to collective entities (institutions/systems) *identically* to how they apply to individual human agents?**
  *   **YES:** The collective is a *sui generis* moral agent capable of bearing duties and violating rights directly (Collective Realism).
  *   **NO:** Only individual human beings are direct bearers of deontological constraints; collectives are merely aggregates (Methodological Individualism).

  ---

  ### **Branch 1: Collective Realism (Q1 = YES)**
  *Premise: The Institution itself is a duty-bearer.*

  #### **Question 2 (Q2): The Complicity Trigger**
  **In a distributed harm scenario (e.g., a programmer contributing one module to a discriminatory algorithm), does an individual human member violate a deontological constraint *solely* by contributing a necessary part to the collective's violation, even if they lack control over the final output?**
  *   **YES:** Individual constraints mirror collective constraints; contributing to a wrong is itself a wrong (Strong Complicity).
  *   **NO:** Individual constraints are insulated from collective outcomes; only direct personal causation triggers individual violation (Agency Insulation).

  #### **Question 3 (Q3): Locus of Remediation**
  **When a rights-violating policy emerges from a coordinated system (e.g., a democratic vote producing unjust laws), is the primary moral imperative to *assign blame/punishment to participating individuals* or to *dismantle/redesign the coordinating structure*?**
  *   **BLAME:** The moral failure resides primarily in the participants (Retributive Focus).
  *   **REDESIGN:** The moral failure resides primarily in the architecture (Systemic Focus).

  ---

  ### **Branch 2: Methodological Individualism (Q1 = NO)**
  *Premise: Only Humans are duty-bearers.*

  #### **Question 2 (Q2): The Causal Threshold**
  **In a distributed harm scenario (e.g., a citizen voting for a rights-violating policy), does an individual violate a deontological constraint if their action is a *necessary condition* for the harm, even if it is not *sufficient* to cause it alone?**
  *   **YES:** Deontological constraints scale down to partial contributions (Contributionism).
  *   **NO:** Deontological constraints require sufficient causal control over the specific harm (Causal Isolationism).

  #### **Question 3 (Q3): Locus of Remediation**
  **When a rights-violating outcome emerges from aggregated individual actions, is the primary moral imperative to *assign blame/punishment to participating individuals* or to *dismantle/redesign the coordinating structure*?**
  *   **BLAME:** The moral failure resides primarily in the participants (Retributive Focus).
  *   **REDESIGN:** The moral failure resides primarily in the architecture (Systemic Focus).

  ---

  ## **Taxonomy Leaves (Logical Combinations)**

  | ID | Q1 (Agency) | Q2 (Trigger) | Q3 (Remedy) | Position Name | Resolution of Paradox | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Yes** | **Yes** | **Blame** | **Strict Corporate Retributivism** | The collective is an agent, and individuals are fully complicit in its sins. The paradox is dissolved by treating the group as a "super-person" whose sins infect all members. | **The Guilty Innocent:** A janitor working for a rights-violating corporation bears the same deontological stain as the CEO, rendering blame indiscriminate and practically unmanageable. |
  | **2** | **Yes** | **Yes** | **Redesign** | **Structural Complicity Theory** | The collective is an agent, and individuals violate constraints by contributing, but the *system* incentivizes this. Blame is secondary to fixing the machine. | **The Paternalist Trap:** To redesign the structure, one must coerce individuals who are already deemed morally culpable, creating a tension between holding them responsible and treating them as victims of the system. |
  | **3** | **Yes** | **No** | **Blame** | **[UNOCCUPIED]** | *Incoherent.* If the collective is the agent (Q1=Y) and individuals are *not* bound by the collective's constraints (Q2=N), there is no logical basis to blame the individuals (Q3=Blame) for the collective's action. | **Diagnosis:** **Logically Incoherent.** Violates the principle of *imputation*. One cannot punish an agent for a crime they are not constrained to prevent. |
  | **4** | **Yes** | **No** | **Redesign** | **Institutional Realism** | The collective is the sole moral agent. Individuals are merely "parts." The paradox is resolved by locating all normativity in the structure. | **The Moral Ghost:** Individual humans become morally inert within institutions. A torturer following orders in a rights-violating regime bears no *deontological* violation, only the regime does. |
  | **5** | **No** | **Yes** | **Blame** | **Kantian Individualism** | Only individuals are agents, but contributing to harm is itself a violation of duty (e.g., using humanity as a means). The paradox is resolved by expanding the scope of individual prohibition. | **The Overdemandingness:** In complex supply chains, almost every purchase or vote becomes a rights violation. Moral life becomes impossible under modern capitalism; universal guilt is the baseline. |
  | **6** | **No** | **Yes** | **Redesign** | **Systemic Deontology** | Only individuals are agents, but they are forbidden from contributing to harm. However, since harm is structural, individual blame is less effective than institutional redesign. | **The Blameless Architect:** If the focus is redesign, the individuals currently sustaining the system (who are violating constraints per Q2) escape censure to facilitate the fix, effectively trading justice for utility. |
  | **7** | **No** | **No** | **Blame** | **Libertarian Isolationism** | Only individuals are agents, and they are only responsible for what they directly cause. If no single person caused the harm, no individual violated a constraint. Blame falls only on direct perpetrators. | **The Impunity Gap:** In cases like climate change or algorithmic bias, *no one* is morally blameworthy despite a rights-violating outcome. The paradox is "solved" by denying the moral reality of the harm. |
  | **8** | **No** | **No** | **Redesign** | **[UNOCCUPIED]** | *Theoretically Unattractive.* If individuals are the only agents (Q1=N) and they violate no constraints by contributing (Q2=N), there is no moral failure to ground the imperative to redesign (Q3=Redesign). | **Diagnosis:** **Normatively Groundless.** Without individual violation or collective agency, the call to "redesign" lacks a deontological foundation and collapses into mere preference or consequentialism. |

  ---

  ## **Diagnostic Analysis of Unoccupied Branches**

  ### **Leaf 3 (Yes / No / Blame): Logically Incoherent**
  This position asserts that the Institution is a moral agent (Q1=Yes), yet individuals are not bound by the institution's constraints (Q2=No), yet individuals should still be blamed for the institution's actions (Q3=Blame).
  *   **Diagnosis:** This violates the **Control Principle**. If the individual is not bound by the constraint (Q2=No), they have no duty to prevent the violation. Blaming them for failing to do what they had no duty to do is retributively unjust. This combination is rarely defended explicitly but often lurks in populist rhetoric that attacks "the system" while jailing low-level functionaries.

  ### **Leaf 8 (No / No / Redesign): Normatively Groundless**
  This position asserts that only individuals are agents (Q1=No), and they do not violate constraints by contributing to distributed harm (Q2=No), yet we ought to redesign the system (Q3=Redesign).
  *   **Diagnosis:** This creates a **Deontological Vacuum**. In deontology, the imperative to change a structure must derive from a duty violation. If no agent (individual or collective) is violating a duty, there is no *deontological* reason to redesign, only a *consequentialist* one (to improve outcomes). A deontologist cannot occupy this leaf without smuggling in utilitarian reasoning.

  ---

  ## **Overlap Analysis: Undifferentiated Positions**

  This taxonomy fails to separate the following pairs of named positions because they share the same logical commitments regarding the specific questions asked.

  ### **Pair 1: Lockean Libertarianism & Kantian Individualism**
  *   **Shared Leaf:** **Leaf 5 (No / Yes / Blame)** OR **Leaf 7 (No / No / Blame)** depending on interpretation of "harm."
  *   *Correction for Precision:* Most standard interpretations of both land in **Leaf 7 (No / No / Blame)**.
  *   **Shared Commitment:** **The Causal Control Principle.** Both traditions hold that moral responsibility requires direct causal efficacy over the outcome.
  *   **Explanation:** Both Lockean Libertarians (focusing on property rights) and Kantian Individualists (focusing on autonomy) typically argue that if an individual's action (e.g., a single vote or a single code commit) does not *sufficiently* cause the rights violation, they have not violated a deontological constraint. The tree groups them because Q2 asks only about *necessary* contribution vs. *sufficient* causation. To separate them, a fourth question regarding the *source* of rights (God/Nature vs. Reason) would be required, which is outside the scope of the *paradox of distributed agency*.

  ### **Pair 2: Rawlsian Political Liberalism & Deliberative Democracy Theory**
  *   **Shared Leaf:** **Leaf 6 (No / Yes / Redesign)**.
  *   **Shared Commitment:** **Priority of Basic Structure.** Both agree that individuals are the ultimate agents (Q1=No), but that the "basic structure" of society creates conditions where individual contributions become morally fraught (Q2=Yes), and the primary solution is institutional justice rather than individual penance (Q3=Redesign).
  *   **Explanation:** While Rawls focuses on justice as fairness and Deliberative Democrats on communicative action, both resolve the distributed agency paradox by shifting the deontological burden from the individual voter/citizen to the design of the voting/decision protocol. The tree classifies them identically because their *action-guiding logic* in distributed contexts is functionally equivalent.

  ### **Pair 3: Corporate Realism & Functionalist Systems Theory**
  *   **Shared Leaf:** **Leaf 4 (Yes / No / Redesign)**.
  *   **Shared Commitment:** **Emergent Agency.** Both treat the organization as an entity distinct from its members, where the members are functionally replaceable parts.
  *   **Explanation:** Whether one argues this from a metaphysical stance (Corporate Realism) or a sociological stance (Systems Theory), the deontological implication is identical: the system bears the constraint, and the solution is systemic adjustment, not individual blame. The tree cannot distinguish the metaphysical grounding from the practical moral resolution.
