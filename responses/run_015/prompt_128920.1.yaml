answer: |-
  # Seminar Activity: The Force-Content Ledger

  **Session Length:** 70 minutes
  **Group Size:** 8 students (split into two teams of 4)
  **Level:** Final-year Undergraduates (Metaethics)
  **Objective:** To phenomenologically demonstrate the Frege-Geach problem by forcing students to trade off between logical validity (Coherence) and moral commitment (Expressive Force).

  ## 1. Materials & Setup

  **The Room:**
  Arrange two tables facing each other. You (the Tutor) sit at the head as the **Semantic Umpire**. A whiteboard is needed for the "Master Ledger".

  **The Pack (per team):**
  *   **4 Red Cards:** Labelled **DISAPPROVAL** (Attitude).
  *   **4 Green Cards:** Labelled **APPROVAL** (Attitude).
  *   **8 White Cards:** Labelled **MENTION** (Neutral/Descriptive).
  *   **1 Set of Proposition Slips:** Pre-written sentences relevant to the scenario (see below).
  *   **1 Score Sheet:** To track Coherence Points (CP) and Expressive Force Points (EFP).

  **The Scenario:**
  *Alex is your flatmate. You saw Alex take a wallet from the library. Security asks you: 'Did Alex take it?'*
  *   **Proposition A:** "Lying to security is wrong."
  *   **Proposition B:** "If lying to security is wrong, then protecting Alex by lying is wrong."
  *   **Proposition C:** "Protecting Alex by lying is wrong."

  ## 2. Roles & Rules

  **Team 1: The Strict Expressivists**
  *   **Doctrine:** Moral sentences *always* express an attitude. There is no moral 'fact' to describe.
  *   **Constraint:** Whenever a moral predicate (e.g., 'is wrong') appears, you **must** play a Red or Green Attitude Card. You are forbidden from using White Mention Cards for moral terms.
  *   **Goal:** Maximise Expressive Force Points (EFP).

  **Team 2: The Hybrid Semanticians**
  *   **Doctrine:** Moral sentences express attitudes in main clauses, but in embedded contexts (like 'if' or 'not'), they merely *mention* the attitude to preserve logic.
  *   **Constraint:** In unembedded assertions (e.g., "Lying is wrong"), play Red/Green Cards. In embedded contexts (e.g., "If lying is wrong..."), you **must** play a White Mention Card.
  *   **Goal:** Maximise Coherence Points (CP) while retaining some EFP.

  **The Scoring Scheme (No Money):**
  *   **Coherence Point (CP):** Awarded if the Modus Ponens inference is logically valid (i.e., the term 'wrong' has the same semantic value in Premise 1 and Premise 2).
  *   **Expressive Force Point (EFP):** Awarded if a Red/Green card is played in an assertoric slot, indicating genuine moral commitment.
  *   **Penalty:** -1 CP for Equivocation (using different meanings for 'wrong' in the same argument). -1 EFP for 'Empty Speech' (playing a White Mention Card where an attitude was expected).

  ## 3. Timeline (70 Minutes)

  ### 00:00 – 00:10: Briefing & The Flatmate Hook
  Start by acknowledging the tension. "Many of you, like my flatmate, think Expressivism is obviously true because it captures the 'oomph' of moral judgement. But logic requires stability. Today, you aren't arguing theory; you are accounting for semantic value."
  *   Distribute packs.
  *   Explain the Card Rules strictly. Emphasise that a Red Card is not a truth-claim; it is an *act* of disapproval. A White Card is a *description* of that act.
  *   Write the Modus Ponens structure on the board:
      1.  P1: Lying is wrong.
      2.  P2: If lying is wrong, then protecting Alex is wrong.
      3.  C: Therefore, protecting Alex is wrong.

  ### 00:10 – 00:25: Round 1 (Strict Expressivism)
  Team 1 attempts to construct the argument using *only* Attitude Cards (Red/Green).
  *   **Task:** They must place cards next to the Proposition Slips on the table.
  *   **The Trap:** When they reach P2 ("If lying is wrong..."), they must decide: do they play a Red Card inside the 'If' clause?
  *   **Expected Outcome:** If they play the Red Card inside the 'If', the Semantic Umpire calls "Force Error!" You cannot express disapproval hypothetically. (You aren't actually booing lying; you are considering a world where it is booed).
  *   **Result:** They gain EFP for P1 and C, but lose CP because P2 becomes nonsensical (a conditional attitude is not a truth-apt premise for Modus Ponens).
  *   **Score:** High EFP, Zero CP.

  ### 00:25 – 00:40: Round 2 (Hybrid Strategy)
  Team 2 attempts the same argument using the Hybrid Rules.
  *   **Task:** They play Red Cards for P1 and C. They *must* play White Mention Cards for the embedded 'wrong' in P2.
  *   **The Trap:** P1 now means "Boo lying!" (Expression). P2 now means "If the attitude of booing applies to lying..." (Description/Mention).
  *   **Expected Outcome:** The Semantic Umpire calls "Equivocation!" The word 'wrong' has shifted from an expression of attitude to a description of an attitude. Modus Ponens fails because the middle term is not identical.
  *   **Result:** They gain CP for making P2 intelligible, but lose CP on Validity due to equivocation. They lose EFP on P2 because no attitude was expressed there.
  *   **Score:** Moderate CP (invalidated), Low EFP.

  ### 00:40 – 00:55: The Clash & Reconstruction
  Bring the teams together. Ask them to combine forces to save the argument.
  *   Allow them 5 minutes to negotiate a rule change that secures both CP and EFP.
  *   They will likely realise they cannot do it without abandoning the core Expressivist constraint (that moral sentences *only* express attitudes).
  *   Ask Team 1: "Why did your logic break?" (Answer: You can't 'boo' inside an 'if').
  *   Ask Team 2: "Why was your argument invalid?" (Answer: We changed the meaning of 'wrong' halfway through).

  ### 00:55 – 01:10: Debrief & Philosophical Mapping
  Use the whiteboard to map the game mechanics to the literature.

  1.  **The Red Card = Assertoric Force (Frege):** Explain that playing the card corresponds to the *judgement*, not the content. In the game, playing the card *was* the moralising.
  2.  **The Proposition Slip = Content:** The text "Lying is wrong" is the content.
  3.  **The 'If' Clause = Geach's Objection:** Geach pointed out that in "If lying is wrong...", the assertoric force (the Red Card) vanishes, but the content remains.
  4.  **The Equivocation:** Highlight that Team 2's White Card represents a shift from *using* language (expressing) to *mentioning* language (describing). In logic, $A \to B$ requires $A$ to be the same in both premises. The game showed that Expressivism makes $A$ different in P1 (Expression) and P2 (Mention).
  5.  **The Limitation (Crucial):** Admit to the students what the game failed to capture.
      *   *Frege's Distinction:* In Frege's original account, the distinction between force and content is not just about cards; it's about the *psychological act* of judgement versus the *thought* (Gedanke). The game reifies 'Force' into a physical object (the card), which makes it look like we can just swap it out. In reality, the problem is that Expressivism denies moral sentences have a 'content' independent of the 'force'.
      *   *Quasi-Realism:* Mention that sophisticated Expressivists (like Blackburn) try to solve this by saying we can *simulate* the logic of truth without believing in moral truths. The game didn't allow for simulation; it demanded strict accounting.

  ## 4. Predictable Failures & Troubleshooting

  **1. The "Cheating" Move (Embedded Attitude)**
  *   **What happens:** A student on Team 1, desperate for Coherence Points, slaps a Red Card down on the 'If' clause in P2. They argue, "I'm expressing that I disapprove of the conditional!"
  *   **How to handle:** Blow the whistle (or tap the desk). "Stop. You are not disapproving of the conditional. You are asserting the conditional. If you play the Red Card, you are committed to the truth of the antecedent. You cannot Modus Ponens from a commitment; you Modus Ponens from a proposition. Deduct 2 CP."
  *   **Teaching Point:** This highlights that attitudes are not truth-apt. You can't infer from a 'Boo!' alone.

  **2. The "Negation" Confusion**
  *   **What happens:** Students treat "Not wrong" as playing a Green Card (Approval).
  *   **How to handle:** Correct this immediately in the briefing. "Disapproval of lying" (Red) is not the same as "Approval of not-lying" (Green). In the game, Negation is a logical operator, not an attitude swap. If they confuse them, they invalidate the logic of P2.
  *   **Teaching Point:** This mirrors the negation problem (Schroeder's objection). Expressivism struggles to distinguish 'It is not the case that lying is wrong' from 'Lying is not wrong'.

  **3. The "Hybrid" Surrender**
  *   **What happens:** Team 2 argues that their White Cards *are* truth-apt, so they win Coherence Points.
  *   **How to handle:** Grant them the Coherence Points, but strip their Expressive Force Points. Ask the class: "If Team 2 wins on logic, have they saved Expressivism? Or have they just become Cognitivists who talk about attitudes?"
  *   **Teaching Point:** This reveals that solving Frege-Geach often requires conceding ground to Cognitivism (Hybrid views), which dilutes the original Expressivist motivation.

  ## 5. Tutor's Cheat Sheet: The "In the Weeds" Nuance

  To ensure this feels niche and not like a standard intro demo, emphasise the **Accounting** metaphor during the debrief.

  *   **Standard Demo:** Usually involves students shouting "Boo!" and realising it sounds silly in an 'If' statement.
  *   **This Demo:** Focuses on the *ledger*. The problem isn't that it sounds silly; it's that the *semantic value* cannot be balanced.
  *   **Key Phrase to Use:** "You are trying to balance a ledger where the currency changes value depending on which column you write it in. Frege-Geach shows that Expressivism is a currency that inflates to zero value when embedded."
  *   **On the Flatmate Argument:** Conclude by saying, "Tell your flatmate that Expressivism works perfectly for P1 and C. It is P2—the bridge between them—that collapses. You can have the 'oomph' or the logic, but the game proves you cannot have both without a hybrid tax."

  ## 6. What the Game Cannot Reproduce

  Be honest in the final 5 minutes.
  *   **The Content/Force Unity:** In the game, Content (Slip) and Force (Card) are separate physical objects. In Frege's actual theory, the Force is the *way* the Content is presented. Separating them artificially makes the problem look like a mechanical glitch rather than a deep metaphysical issue about the nature of judgement.
  *   **Inferential Role Semantics:** The game assumes a static meaning for 'wrong'. Modern Expressivists argue meaning is defined by its inferential role. The game is too rigid to model how 'wrong' might gain logical properties through use rather than definition.
  *   **Psychological Reality:** Playing a card is a conscious choice. Expressing an attitude is often pre-reflective. The game makes Expressivism look more deliberative than it claims to be.

  **End of Session:** Collect the cards. Do not let them keep the Red Cards. (Symbolic gesture: the attitudes remain in the room).
