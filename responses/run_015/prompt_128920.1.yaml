      *   *Check:* Did I explain the "Mention Card" clearly? It needs to represent *talking about* the attitude, not *having* the attitude.
      *   *Check:* Is the scoring clear? Coherence Points (CP) for valid logic. Expressive Force Points (EFP) for genuine attitude expression.
      *   *Crucial Point:* The game must demonstrate that you can't maximise both CP and EFP simultaneously under Expressivist constraints.

  13. **Final Polish:** Ensure the distinction between "Assertoric Force" (playing the card) and "Propositional Content" (the text) is clear in the instructions. Make sure the "Flatmate Argument" context is acknowledged in the intro to ground it.

