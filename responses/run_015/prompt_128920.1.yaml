          *   Troubleshooting: Predict cheating/errors (playing cards in wrong slots) and how to handle it.
          *   Tone/Style: British English, niche/not standard demo, no bibliography.
      *   **Constraint:** The user had an argument with their flatmate about this. The activity needs to be "in the weeds" enough to settle or illuminate that tension.

  2.  **Deconstruct the Philosophical Problem (Frege-Geach):**
      *   *Expressivism:* "Murder is wrong" = "Boo murder!" (Expresses attitude).
      *   *The Problem:* "If murder is wrong, then getting your little brother to murder is wrong."
      *   *Issue:* In the antecedent ("If murder is wrong..."), I am *not* saying "Boo murder!". I'm not expressing disapproval. I'm hypothesising.
      *   *Validity:* Modus Ponens requires the term "wrong" to mean the same thing in both premises. If the meaning changes (from expressing attitude to mentioning it), the argument is equivocal (invalid).
      *   *The Game's Job:* Force students to try to construct a valid argument while adhering to strict expressivist rules about when attitudes can be expressed. They should hit a wall where validity breaks because the "meaning" shifts between embedded and unembedded contexts.

  3.  **Drafting the Game Design ("The Attitude Accounting Game"):**
      *   *Name:* Needs to sound slightly technical but engaging. "The Assertoric Force Ledger"? "The Embedding Trap"? Let's go with **"The Force-Content Ledger"**.
      *   *Teams:*
          *   Team A: **Strict Expressivists** (Must play Attitude Cards for moral claims).
          *   Team B: **Hybrid Semanticians** (Switch to 'Mention' mode for embedded claims).
