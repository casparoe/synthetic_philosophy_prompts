answer: |-
  Here is the plan. I've worn the shoes of both the philosopher and the high-school coach; the key with competition kids is to treat them like intellectual peers but guard against their tendency to turn philosophy into another problem to "solve."

  ### 1. Verdict on the Example: "No Largest Prime"
  **Keep it, but pivot the focus.**
  You are right to worry. "There is no largest prime" is so clean and deductive that it makes Platonism feel like the only rational option. A nominalist looks like a lunatic denying logic.

  **The Fix:** Do not focus on the *proof*. Focus on the **objects**.
  The proof shows that for any prime $p$, there is a larger one. This implies an **infinite collection** of primes.
  *   **The Platonist Hook:** That infinite collection exists *somewhere*, regardless of whether we write it down.
  *   **The Nominalist Hook:** You cannot point to an infinite collection in the physical universe. Therefore, "the set of primes" is a useful fiction—a rule in a game we invented—not a discovered object.

  **Why this works:** It forces the debate away from "Is the logic valid?" (which everyone agrees on) to "What is the *status* of the things the logic is about?"

  ---

  ### 2. The Sequence (25 Minutes)

  **Minute 0–5: The Anchor (Establish Certainty)**
  *   **Action:** Go to the whiteboard. Ask a student to sketch the Euclid proof (multiply all primes + 1).
  *   **Goal:** Get universal agreement that the statement is *true*.
  *   **Crucial Phrase:** "Nobody here doubts this statement. It is necessarily true. The question for the next 20 minutes is not *if* it is true, but *why*."

  **Minute 5–10: The Location Problem (Create the Tension)**
  *   **Action:** Ask: "Where does this truth live?"
  *   **Prompt:** "If the universe vanished tomorrow—no atoms, no humans, no computers—would it still be true that there is no largest prime?"
  *   **The Split:** You will get "Yes" (It's a fact of reality) and "No" (Numbers are human concepts).
  *   **Definition Time:**
      *   **Platonism:** Math is **discovered**. The primes are like continents; we didn't make them, we mapped them. Truth is matching the map to the continent.
      *   **Nominalism:** Math is **invented**. The primes are like chess pieces. They only exist because we agreed to the rules of arithmetic. Truth is following the rules correctly.

  **Minute 10–15: Stress-Testing the Views (The "Aha" Moment)**
  *   **Action:** Challenge the Platonists. "If math is a place, where is it? Can you go there?" (They will struggle).
  *   **Action:** Challenge the Nominalists. "If math is just a game we made up, could we have made up a game where there *is* a largest prime?" (They might say yes, but then it's not *arithmetic* anymore).
  *   **Goal:** Show that both views have a cost. Platonism requires "spooky" non-physical existence. Nominalism makes math feel contingent on humans.

  **Minute 15–20: Intercepting Misconceptions (The Cleanup)**
  *   *(See section 3 below for specific scripting)*
  *   Use this time to field the "It's just language" and "Code" objections that naturally arise from the Nominalist definition.

  **Minute 20–25: The Exit Ticket**
  *   **Action:** Ask the final question (See section 4).
  *   **Goal:** Ensure they leave with the *question*, not a verdict.

  ---

  ### 3. Misconceptions: Order of Appearance & Interception

  These will surface in a predictable order. Do not wait for them to derail you; preempt them at these specific checkpoints.

  **1. "Math is just a language we made up."**
  *   **When:** Immediately after you define Nominalism (Minute 10).
  *   **Why:** It's the easiest way to dismiss the "invention" idea.
  *   **How to Head It Off:** Distinguish **Syntax** from **Truth**.
      *   *Say:* "English is a language. I can write 'The prime number is green.' It's grammatical, but it's nonsense. Math isn't just grammar. If I write '2+2=5', I haven't just spoken bad English; I've said something *false*. Nominalists don't say math is arbitrary; they say it's a **rigorous** invention, like the rules of Chess. You can't move a Bishop diagonally and call it Chess. But the Board doesn't exist outside the game."

  **2. "So Nominalists think 2+2 might equal 5?"**
  *   **When:** During the Stress-Test (Minute 15). A Platonist will use this to dunk on the Nominalist.
  *   **Why:** They confuse *ontology* (what exists) with *validity* (what follows from rules).
  *   **How to Head It Off:** Protect the Nominalist.
      *   *Say:* "No. A Nominalist agrees 2+2=4 is true *within the system*. The fight is about whether '2' exists before we define it. Think of it like Offside in soccer. Before soccer was invented, was the Offside Rule true? No. But once we invented soccer, it's absolutely true that you can't be offside. Nominalists think numbers are like the Offside Rule."

  **3. "A proof is just a program a computer can check." (Formalism)**
  *   **When:** Near the end (Minute 20). The coders will feel this solves everything.
  *   **Why:** They equate *provability* with *truth*.
  *   **How to Head It Off:** This is the hardest one. You must separate **Consistency** from **Reality**.
      *   *Say:* "A compiler checks if your code follows syntax rules. It doesn't check if the program does what you *intended*. If I write a program that simulates a world where 2+2=5, the code runs fine. Formalism says math is just the code running. But when you use math to build a bridge, you care that the math matches the steel, not just that the code compiles. Platonists say the 'match' is real; Formalists say the 'match' is just useful."

  ---

  ### 4. The Final Question
  Do not ask "Who is right?" That invites guessing. Ask a question that forces them to feel the weight of the ontology.

  **Ask this:**
  > "If we meet an alien civilization that never interacted with humans, and they have no concept of 'counting' or 'quantity,' do they **discover** our primes when they start doing math, or do they **invent** their own version that happens to look like ours?"

  *   **If they say "Discover":** They are leaning Platonist (Math is universal truth).
  *   **If they say "Invent":** They are leaning Nominalist (Math is a human cognitive tool).
  *   **The Win:** If they hesitate and say, "Wait, if they invent it, wouldn't it be different? But if they discover it, where was it hiding?" — **Then you have succeeded.**

  ---

  ### 5. What to Refuse (The Boundaries)
  You are correct to skip Gödel and Set Theory. Here is your script for why, if a sharp kid pushes:

  *   **Gödel:** "Gödel asks what we can *prove*. We are asking what *is*. You can have a true thing you can't prove. We're talking about the 'true' part, not the 'prove' part. Gödel complicates the map; we're trying to find the territory."
  *   **Set Theory/ZFC:** "Axioms are the rules of the game. We are arguing about whether the game board exists. Getting into ZFC is like arguing about the specific texture of the chess squares. It's too technical for the philosophical point."
  *   **Physics:** "Don't tell me 'math works in physics so it must be real.' Newtonian physics worked for 200 years and was still 'wrong' about gravity. Utility isn't existence."

  ### Summary Checklist for the Whiteboard
  1.  **Left Side:** Euclid's Proof (The Anchor).
  2.  **Center:** "Where does this live?" (The Puzzle).
  3.  **Right Side:** Two Columns: **Discovery (Plato)** vs. **Invention (Nominalist)**.
  4.  **Bottom:** The Alien Question.

  This plan respects their math skills while forcing them to step outside the proof and look at the ground they are standing on. Good luck.
