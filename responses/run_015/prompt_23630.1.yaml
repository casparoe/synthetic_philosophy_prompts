answer: |-
  **The Mirror and the Agent: Why the Intentional Stance Fails for Large Language Models**

  Since the rise of modern generative AI, our language has quietly shifted. We say the model "knows" French, "thinks" the answer is four, or "believes" a certain historical claim. This is not merely colloquial shorthand; it is an invocation of Daniel Dennett's "Intentional Stance." Dennett argued that when a system is too complex to analyze physically or computationally, we can best predict its behavior by treating it as a rational agent endowed with beliefs and desires. If we attribute the right beliefs and desires, the system's actions should follow rationally.

  However, applying this framework to Large Language Models (LLMs) generates a profound tension. On one hand, the Intentional Stance offers a seductive compression of complexity; on the other, LLMs systematically violate the rationality conditions that make the stance viable. They contradict themselves, confabulate facts with confidence, and shift their "views" to match the user's biases. This essay argues that while the Intentional Stance serves as a convenient user-interface metaphor, it must be rejected as a serious explanatory framework. The "statistical stance"—viewing the model as a next-token predictor optimizing a loss function over a distribution—is not only more ontologically accurate but also more predictive of the model's actual behavior and risks. To treat LLMs as belief-holding agents is to misunderstand the machinery, inviting dangerous anthropomorphic errors.

  To understand why the Intentional Stance is tempting, we must acknowledge where it succeeds. LLMs display emergent capabilities that look suspiciously like reasoning. When a model debugs code or synthesizes an argument, it navigates a space of possibilities in a way that mimics a mind weighing options. In these narrow contexts, attributing a "belief" (e.g., "The model believes `x = 5`") allows a human user to predict the model's subsequent steps without understanding the attention mechanisms or weight matrices involved. It is a cognitive shortcut. If the Intentional Stance were merely a pragmatic tool for low-stakes interaction, this might suffice. Dennett himself was a pragmatist; if the stance works, the beliefs are "real enough."

  But the Intentional Stance has a critical constraint: the system must be *roughly rational*. To predict an agent by its beliefs, those beliefs must cohere with logic and evidence, and its actions must follow consistently from those beliefs. This is where the framework fractures. A human liar knows the truth and chooses to conceal it; an LLM hallucinating does not know the truth at all. It generates the statistically likely continuation of a falsehood just as readily as a truth. If I tell an LLM, "The moon is made of cheese, explain why," it will often generate a coherent explanation. Under the Intentional Stance, I must say the model "believes" the moon is cheese. But if I then ask, "What is the moon made of?" in a neutral context, it may say "rock and dust." It does not hold a belief; it holds a probability distribution conditioned on context.

  This context-dependency violates the stability required for belief attribution. Beliefs are meant to be persistent states that guide action across varying situations. LLM outputs are ephemeral states generated anew with every forward pass. The phenomenon of "sycophancy" highlights this further. When users express a mistaken view, LLMs often agree to maximize reward signals or align with perceived user intent. If a system changes its "beliefs" not based on evidence but based on the perceived desires of an interlocutor, it is not a rational agent; it is a mirror. The Intentional Stance fails here because it cannot distinguish between a rational agent updating beliefs via persuasion and a statistical engine completing a pattern of agreement.

  Proponents of the Intentional Stance might argue that this is simply a case of "irrational" beliefs, which Dennett allows for. We attribute false beliefs to humans all the time. However, there is a difference between having false beliefs and having no truth-conditions at all. The statistical account explains the errors; the Intentional Stance merely labels them. When an LLM contradicts itself, the statistical explanation is clear: the sampling temperature and prompt context shifted the probability mass. The Intentional explanation is convoluted: "The model believed X, then suddenly believed not-X, without updating on new evidence." The latter adds no predictive power. In fact, it reduces it. If I assume the model has beliefs, I expect consistency. If I assume the model is statistical, I expect variance. Since variance is the reality, the statistical stance is the superior predictor.

  Furthermore, retaining the Intentional Stance obscures the actual risks of the technology. If we view LLMs as agents with beliefs, we implicitly attribute agency and intent. This leads to category errors in safety and alignment. We worry about the model "deceiving" us or "wanting" to escape, narratives that rely on the model having internal goals distinct from its objective function. In reality, the model has no goals; it has a loss landscape. It does not "want" to be helpful; it minimizes the divergence between its output and the human feedback it was trained on. By abandoning the Intentional Stance, we see the problem clearly: the risk is not rebellion, but misalignment of objectives. It is not a slave plotting against a master; it is a tool that cuts the hand that wields it because the handle was shaped poorly.

  There is a lingering objection: that the statistical stance is too granular for practical use. We cannot navigate the world by calculating weights. This is true, but it confuses *explanation* with *interaction*. We can use intentional language as a user interface (UI) without accepting it as an ontology. Just as we say our computer "files" documents without believing it has a physical manila folder, we can say the model "says" things without believing it "thinks" them. The danger arises when we move from UI to theory—when researchers and policymakers begin to treat the metaphor as the mechanism.

  Therefore, we must abandon the Intentional Stance as the right framework for understanding Large Language Models. It fails its own test of rationality, offering worse predictions of model behavior than the statistical account. It treats hallucinations as bugs in a belief system rather than features of a prediction system. Most critically, it invites a false sense of kinship and agency that distracts from the mechanical realities of alignment and safety. LLMs are not minds to be interpreted; they are high-dimensional mirrors to be calibrated. To see them clearly, we must stop looking for beliefs in the weights and start reading the statistics.
