answer: |-
  This is a precise and difficult knot. You are describing the intersection of epistemic logic, game theory, and the metaphysics of the special sciences, but you are right to feel that standard labels (reflexivity, performativity, Lucas critique) miss the specific predictive fragility you are isolating.

  Here are the answers to your five questions, in order.

  ### 1. Is there an established concept?

  There is no single canonical term that captures exactly the *predictive fragility* of the intentional stance under mutual modeling, though the components are well-trodden. The closest existing concept is **Reflexive Prediction Failure** within the literature on **Epistemic Game Theory**.

  If you need a label for the seminar, I recommend **Intentional Recursion Instability**.

  **Definition:** A system exhibits Intentional Recursion Instability when a predictive ascription of mental states (beliefs/desires) to a target fails specifically because the target's decision function includes a model of the predictor (or the predictor's community), creating a feedback loop where the accuracy of the prediction is a variable in the target's output.

  **Boundary Cases:**
  *   **Inside the boundary:** A lie detector that adjusts its threshold based on the examiner's expectation of the threshold. A high-frequency trading algo that pauses when it detects it is being front-run by a copy of itself.
  *   **Outside the boundary (Simple Adaptation):** A rat learns to avoid a trap. The trap does not model the rat. The prediction fails due to *learning*, not *reflexivity*. Supplying more data about the rat's learning history fixes the prediction.
  *   **Outside the boundary (Simple Ignorance):** You predict a chess move incorrectly because you didn't know the engine's evaluation function. Supplying the code fixes the prediction.
  *   **The Crucial Boundary:** The failure persists even with perfect constitutional (Grade 1) and design (Grade 2) knowledge. The failure is *structural*, not informational.

  Should you coin a term? Yes, but only to distinguish this from "Reflexivity" in the Soros sense (which is macro-economic and value-laden) or "Performativity" (which is linguistic/constitutive). Your phenomenon is *epistemic and dyadic*.

  ### 2. Is the fragility one thing or several?

  It is **one structural feature manifesting in two dynamic regimes**.

  The underlying structure is identical: the predictor ($P$) and target ($T$) are coupled such that $Output_T = f(Input, Model_P)$.

  However, the *instability* you observe splits based on the payoff structure of the interaction:

  1.  **The Coordination Regime (Pavement/Chess Self-Play):** Here, the instability is **Simultaneous Regress**. Both agents are solving for a fixed point simultaneously. The "dithering" is the system oscillating around a Nash Equilibrium without a coordination mechanism to select it. The failure is logical: there is no unique solution to the equation $I\ think\ that\ you\ think\ that\ I\ think...$ without an external breaker (convention, glance).
  2.  **The Adversarial Regime (Trading Algo):** Here, the instability is **Temporal Drift**. The target is not solving for a simultaneous equilibrium but is actively updating its function to minimize $P$'s accuracy over time. This is not merely regress; it is an arms race. The failure is evolutionary: the target moves to a part of the state space where $P$'s current model has no traction.

  **Verdict:** Treat them as one phenomenon (Reflexive Coupling) with two modes (Equilibrium Oscillation vs. Adaptive Drift). This explains why supplying constitutional data fails in both: the data is static, but the coupling is dynamic.

  ### 3. Does the marker fall where you put it? (Grades vs. Content)

  Your framing is slightly off, and your suspicion is correct: **The divider is not the Grade of Description, but the presence of Reflexive Coupling.**

  You assume the third grade (Intentional) is unique here. But consider a Grade 2 (Design) case: Two thermostats in the same room, each designed to maintain 70 degrees, but each equipped with a sensor that detects the other's output and adjusts its own threshold to compensate for the other's heat contribution. If they are perfectly symmetrical and reactive, they may oscillate indefinitely. A Grade 2 description ("it is designed to maintain temperature") fails to predict the oscillation just as a Grade 3 description fails in the pavement case.

  **Why it feels like a Grade 3 problem:**
  Grade 3 is the *natural habitat* of reflexive coupling. Minds are designed (by evolution or culture) to model other minds. Thermostats are not, usually. Therefore, you encounter this fragility almost exclusively in the Intentional Stance.

  **The Corrected Cut:**
  The relevant distinction is between **Open-Loop Systems** (Physical/Design/Intentional systems that do not model the predictor) and **Closed-Loop Reflexive Systems** (Systems whose function includes modeling the predictor).
  *   *Implication for your seminar:* You can teach this as a limit of the Intentional Stance, but you must acknowledge that the limit arises not from "beliefs and desires" per se, but from the **recursive architecture** that beliefs and desires typically instantiate in social animals.

  ### 4. Does this bear on whether the pattern is real?

  The third reading is the most robust: **The dependence is itself a real feature of the system that the lower grades cannot express.**

  *   **Against "Less than Real":** If the pattern were unreal, it would be random noise. It is not; it is structured failure. The clustering of bad predictions in the trading case is a signal, not noise.
  *   **Against "Reality is Stance-Relative":** This is too deflationary. It suggests the pattern exists only *for* the predictor. But the *interaction* exists independently of your specific prediction. The oscillation on the pavement happens even if you are not the one walking; it is a property of the dyad.
  *   **For "Relational Reality":** The pattern is real, but it is a **relational property**, not an intrinsic one. A heart's pumping is intrinsic to the heart (mostly). A convention's stability is intrinsic to the *network of mutual modeling*.

  **Evidence against this view:**
  To disprove the "Relational Reality" reading, one would need to show that a "View from Nowhere" (a Grade 1 physical description of the entire universe including both agents) could predict the outcome without referencing the mutual modeling relation.
  *   *Counter-evidence:* In principle, a Laplacian demon could predict the pavement dither. But in the special sciences, that prediction is computationally intractable and explanatorily useless. The *explanation* requires the relational property. If the explanation requires the relation, the relation is ontologically serious for the special sciences.

  ### 5. The Second Face (Stability) and Formal Results

  **Is convention-sustained stability the same phenomenon?**
  Yes. It is the **fixed-point solution** to the instability.
  *   **Instability** is the system searching for a fixed point in a reflexive loop (e.g., Matching Pennies).
  *   **Stability** is the system resting at a fixed point (e.g., Driving on the Right).
  Both arise from the same recursive structure. The difference is the payoff matrix. In coordination games, the reflexive loop converges (Schelling points). In zero-sum games, it cycles or diverges.

  **Formal Results:**
  You asked for a specific result, not a gesture.
  1.  **Existence of Stability:** **Nash's Existence Theorem (1950)** guarantees that in any finite game (including reflexive ones), there exists at least one equilibrium profile (a stable state where no agent wants to change strategy given the others'). This supports the "Stability" face.
  2.  **Failure of Convergence:** However, Nash does not guarantee that agents will *find* the equilibrium. **Shapley (1964)** demonstrated that in certain games (like a generalized Rock-Paper-Scissors), best-response dynamics (the process of modeling the other and adjusting) **do not converge**; they cycle indefinitely. This supports the "Instability" face (your pavement and chess cases).
  3.  **Computational Limits:** For the specific case of one algorithm modeling another (your chess/trading cases), **Computational Irreducibility** (Wolfram) and the **Halting Problem** apply. If Agent A models Agent B, and Agent B models Agent A, predicting the outcome is formally equivalent to solving the Halting Problem for a system containing the predictor. There is no general algorithm that can predict the outcome of two mutually modeling Turing Machines without simply running them.

  **The Deciding Case:**
  To decide if Stability and Instability are the same phenomenon, present your students with a **Coordination Game with Noise**.
  *   *Setup:* Two agents must coordinate to get a reward. They model each other.
  *   *Variable:* Introduce a small cost to switching strategies.
  *   *Result:* If they settle on a convention (Stability), it is because the payoff structure rewards fixed points. If they dither (Instability), it is because the payoff structure rewards unpredictability.
  *   *Conclusion:* The phenomenon is **Reflexive Sensitivity**. Whether it yields stability or instability depends entirely on whether the reflexive loop is **Cooperative** (convergent) or **Adversarial** (divergent).

  **Summary for the Seminar:**
  You are tracking **Reflexive Prediction Failure**. It is one phenomenon with two modes (oscillation vs. drift). It is not unique to the Intentional Stance, though endemic to it. It implies that social patterns are relationally real. And formally, it is bounded by Nash (stability exists) and Shapley/Computational Irreducibility (stability is not guaranteed or computable).
