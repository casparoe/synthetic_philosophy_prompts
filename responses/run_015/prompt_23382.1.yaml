  9.  **Final Polish:** Organize with clear headings. Ensure the distinction between "fact-checking mode" and "drafting mode" is clear. (This aligns with the user's description of using it for both).

  **(Self-Correction Note):** I should make sure not to give specific prompt engineering tricks that might violate safety policies myself, but general advice on how to assert control is fine. I need to be careful not to sound like I'm telling them how to bypass safety filters for harmful content, but rather how to stop unwanted stylistic hedging.

