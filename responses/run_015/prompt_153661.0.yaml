prompt: |-
  i'm TAing a final-year philosophy of science seminar, 14 students, one 80-minute slot, and I've got the session on scientific realism and theory change. I want them to feel the pull of structural realism before I name it — the thought that when a theory gets overthrown we keep the equations and lose the furniture: the ethers and the calorics go, but the pattern of relations they were standing in survives into the successor theory, so maybe that pattern was all we ever should have believed in. But I also want them to feel the thing that makes me suspicious of it. If all a theory ultimately says is "there are some things, call them #1, #2, #3, standing in such-and-such relations, and everything we observe follows from that" — the theoretical names crossed out and replaced with blanks — then it looks like you can make it true with basically any old junk, as long as there's enough of it and you can arrange it to match the pattern: the pens in the room, four people's left shoes, some prime numbers. Last year I tried a version of this with a toy theory about three invisible magnets and it fell flat, mostly because I explained the point first and then asked them to do the exercise, which killed it.

  So: can you design the whole session for me — groups, materials (index cards and random junk, nothing that needs a projector), a timeline for the 80 minutes, and what exactly the facilitator says and doesn't say? My rough idea is that each group gets the "crossed-out" theory plus a pile of objects and has to build models that make it true, and then something turns on their noticing that they can do it again and again with completely different stuff, and that this is either the whole point or a disaster, without me having told them which. Two things I care about. First, the epistemological and the ontic versions shouldn't collapse into each other: "structure is all we can know" and "structure is all there is" have to come apart in the activity, and by the end students should be able to say which one the junk-model problem actually bites and which one it sort of doesn't. Second, I want a debrief that maps specific moments in the room onto specific claims, tells me what will predictably go wrong the first time I run it (I'm guessing someone builds a model with the wrong number of objects, and someone else says "well obviously the theory also says the things are physical / causal / in spacetime" and short-circuits the whole thing before anyone feels it), and is honest about what the game can't deliver — I suspect it can't show the continuity-across-theory-change argument that made structural realism attractive in the first place, since my little toy theory has no history, and it probably can't reproduce whatever makes the triviality worry bite for infinite domains rather than for four pens. Oh, and please don't put the words "structural realism" or "Ramsey" or "Newman" on any handout that goes out before the debrief, and no looking things up — just build it from what the setup already gives you.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Role:** TA for a final-year philosophy of science seminar.
      *   **Audience:** 14 students (advanced undergraduates/graduates).
      *   **Time:** 80 minutes.
      *   **Topic:** Scientific Realism, Theory Change, Structural Realism (SR).
      *   **Goal:** Make students *feel* the pull of SR (equations survive, ontology changes) and *feel* the suspicion/triviality objection (Newman's Problem) without naming them initially.
      *   **Constraint 1 (Pedagogy):** Do not explain the point first. Let the activity generate the insight. Last year's "invisible magnets" failed because the explanation came before the exercise.
      *   **Constraint 2 (Materials):** Index cards, random junk, no projector.
      *   **Constraint 3 (Conceptual):** Distinguish Epistemic SR ("structure is all we can *know*") from Ontic SR ("structure is all there *is*"). The activity must show where the "triviality objection" bites (Ontic) and where it might not (Epistemic).
      *   **Constraint 4 (Debrief):** Map activity moments to philosophical claims. Predict failure modes (e.g., students adding hidden constraints like "physical objects"). Acknowledge limitations (can't show historical continuity, can't fully replicate infinite domain triviality).
      *   **Constraint 5 (Handouts):** No forbidden words ("Structural Realism", "Ramsey", "Newman") before the debrief.

  2.  **Deconstruct the Core Philosophical Tension:**

      *   *The Pull:* Theory $T_1$ (e.g., Fresnel's ether) is replaced by $T_2$ (e.g., Maxwell's EM). The ontology (ether) is discarded, but the math (structure) is retained. Conclusion: Believe in the structure, not the ontology.
      *   *The Push (Newman's Problem):* If a theory is just "There exist entities $x, y, z$ such that Relations $R$ hold among them," then *any* collection of enough entities can satisfy this. The theory becomes trivially true.
      *   *The Distinction:*
          *   Epistemic SR: We can only *know* the structure. (Newman's problem is less damaging here; maybe we can't know the nature, but the nature exists).
          *   Ontic SR: The world *is* structure. (Newman's problem is devastating; if the world is just structure, anything fits, so the claim is empty).

  3.  **Design the Activity (The "Engine"):**

      *   Need a "Theory" that is purely relational.
      *   Need "Ontologies" (piles of junk) that are diverse.
      *   Need a task that forces them to map the Theory onto the Ontology.
      *   *Idea:* Give them a diagram or a set of relational statements with blank slots.
      *   *Theory Card:* "There are 5 entities. Entity A repels B. B attracts C. C is between D and E. D transmits signal to E." (Keep it abstract but structured).
      *   *Junk Piles:* Pens, shoes, coins, paperclips, distinct colored cards, etc.
      *   *Twist:* After they build one model, ask them to build a *completely different* one with different stuff that still satisfies the theory.
      *   *Second Twist:* Ask them what makes one model "better" or "more real" than the other.

  4.  **Drafting the Timeline (80 Minutes):**

      *   0-10: Intro & Setup (No theory talk).
      *   10-30: Round 1 (Build a model).
      *   30-50: Round 2 (Build a *different* model + The "Constraint" Challenge).
      *   50-70: Debrief/Discussion (Connecting to Philosophy).
      *   70-80: Wrap up & Naming.

  5.  **Refining the Activity for the Specific Constraints:**

      *   *Constraint Check:* Need to ensure Epistemic vs. Ontic comes out.
      *   *Modification:* In Round 2, introduce a "Black Box" element. They know the relations hold, but they can't see the "insides" of the objects.
      *   *Failure Mode Prevention:* Students will say "But pens aren't magnets." I need to forbid them from using the *nature* of the objects in the theory description. The Theory Card must be purely structural.
      *   *Theory Card Design:* Use symbols. $O_1, O_2, O_3...$ Relations $R_1, R_2...$.
      *   *The "Aha" Moment:* Realizing that *any* 5 objects can be arranged to fit the relations if the relations are defined loosely enough, OR realizing that if the relations are specific (causal), random junk doesn't work.
      *   *Wait, the Newman Problem relies on the relations being extensional.* If the theory says "A causes B," random junk can't do that. If the theory says "A is related to B by R," anything can.
      *   *Decision:* The Theory Card must be ambiguous enough to allow the triviality, but the *discussion* must reveal why that's a problem.
      *   *Better Approach:* Give them a specific mathematical structure (a graph) and ask them to instantiate it.
      *   *Revised Activity:* "The Pattern." A specific network diagram (nodes and edges).
      *   *Round 1:* Make this pattern true with Pile A.
      *   *Round 2:* Make this pattern true with Pile B (totally different stuff).
      *   *Round 3:* The "Blind" Round. I tell them the pattern holds in the world. They have to tell me what the world is made of. They can't.

  6.  **Developing the Script/Facilitator Notes:**

      *   *Tone:* Socratic, neutral, slightly provocative.
      *   *Forbidden:* Do not validate "But these are just pens!" immediately. Let them struggle with the equivalence.
      *   *Differentiation:* How to split Epistemic/Ontic?
          *   Ask: "Does the fact that you can build this with pens mean the theory is *true*?" (Ontic)
          *   Ask: "Does the fact that you can build this with pens mean you can't *know* what the real stuff is?" (Epistemic).

  7.  **Addressing the Limitations (Debrief):**

      *   Must admit: This doesn't show *history* (Fresnel to Maxwell).
      *   Must admit: This is finite (Newman is about infinite sets).
      *   Must admit: We usually assume causal/natural relations, not arbitrary ones.

  8.  **Finalizing the Materials:**

      *   Handout 1: The "Theory" (Abstract Graph/Relations).
      *   Handout 2: Instructions (Build, Re-build, Reflect).
      *   Piles: 3 distinct piles per group (e.g., Stationery, Personal Items, Random Trash).
      *   Index cards for labeling.

  9.  **Review against Constraints:**

      *   No "Structural Realism" on handouts? Check.
      *   Epistemic vs. Ontic distinction? Need to ensure the debrief questions target this specifically.
      *   Predictable failures? Address the "But causality!" objection in the troubleshooting section.
      *   Timeline? 80 mins is tight. Keep instructions crisp.

  10. **Polishing the "Trap":**
      *   The trap needs to be that the relations are defined *only* by the diagram, not by physical properties.
      *   Relation $R_1$: "Is linked to."
      *   If a student says "Pens don't link," the TA says "Define 'link' however you need to satisfy the diagram."
      *   *Correction:* If they define it arbitrarily, it's trivial. If they can't, it's not. The tension is the point.
      *   *Better:* Give them specific relation names that *sound* physical but are undefined. "Exerts force on." Then let them interpret it metaphorically ("This pen exerts social force on that cap"). This highlights the ambiguity.
      *   *Actually, best for Newman:* Keep relations purely mathematical/topological. "Node A connects to Node B."
      *   Let's go with a specific Graph Structure (5 nodes, specific connections).
      *   Task 1: Instantiate with Pile 1.
      *   Task 2: Instantiate with Pile 2.
      *   Task 3: "The World is this Graph." What is the world made of?

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   Make sure the groups are small enough. 14 students = 3 groups of 4, 1 group of 2? Or 2 groups of 7? 3 groups of 4-5 is better for discussion.
      *   Ensure the "Epistemic vs Ontic" distinction is explicit in the debrief guide.
      *   Make sure the "History" limitation is acknowledged.

  12. **Final Polish:** Check tone. Ensure it sounds like a TA guide, not a textbook. Emphasize *silence* and *waiting* during the activity.

  *(Self-Correction on the "Trap"):* The prompt specifically mentions the "crossed-out theory" idea (Ramsey sentence style). I should incorporate that visual. A handout with blanks instead of nouns.
  *Revised Handout Idea:* "There exist entities __, __, __, __, __. Relation $\phi$ holds between __ and __..."
  *Actually, a Graph is more intuitive for 80 mins.* Let's stick to the Graph but describe it as a "Theory Schema."

  *Wait, one crucial detail:* The prompt asks to distinguish Epistemic vs Ontic *in the activity*.
  *How?*
  *   Epistemic move: "We can't tell which pile is the *real* one."
  *   Ontic move: "It doesn't *matter* which pile is the real one."
  *   I need a moment where they argue about whether the *nature* of the objects matters.
  *   I will add a "Secret Envelope" to each group. Inside is a claim: "The true nature of the entities is [Pile A]" vs "The true nature is irrelevant." No, that gives it away.
  *   Better: In the debrief, I ask two different questions to split the room. "Who thinks the theory is *true* of the pens?" vs "Who thinks we just *can't rule out* the pens?"

  Okay, ready to write.
answer: |-
  Here is a complete session plan designed to meet your constraints. It avoids naming the position until the end, relies on physical manipulation to generate the philosophical tension, and includes a robust troubleshooting guide for the debrief.

  # Session Plan: The Pattern and the Stuff
  **Time:** 80 Minutes
  **Students:** 14 (Split into 3 groups of 4, 1 group of 2)
  **Materials:**
  *   **3 "Junk Piles" per group:**
      *   *Pile A (Standard):* Pens, paperclips, erasers, sticky notes.
      *   *Pile B (Personal):* Keys, phones, shoes, water bottles (ask students to contribute).
      *   *Pile C (Abstract):* A deck of playing cards, some dice, a set of numbered index cards.
  *   **Handout 1:** "The Theory Schema" (See below).
  *   **Handout 2:** "Construction Log" (Blank space for notes).
  *   **Whiteboard/Chalkboard:** For the final debrief mapping.
  *   **Tape/Blu-tack:** To fix arrangements on tables.

  ---

  ## Part 1: The Setup (00:00 – 00:10)

  **Facilitator Script:**
  "Welcome. Today we are doing engineering, not philosophy. You are model-builders. I have a 'Theory Schema' on Handout 1. It describes a state of affairs. It does not tell you what the world is made of. It only tells you how many things there are and how they relate.

  Your job is to make the Theory *true*.

  **Rules:**
  1. You must use the objects on your table.
  2. You cannot add words to the Theory.
  3. You can define the relations *only* by how you arrange the objects.
  4. Do not ask me if your model is 'right.' Ask me if it satisfies the Schema.

  You have 10 minutes to build Model 1 using **Pile A**."

  **Handout 1 (The Theory Schema):**
  > **THEORY $\Sigma$**
  >
  > 1. There exist exactly **5** distinct entities.
  > 2. There is a relation **$R$** that holds between some pairs of entities.
  > 3. The structure of **$R$** is as follows:
  >    *   Entity 1 is related to Entity 2.
  >    *   Entity 2 is related to Entity 3.
  >    *   Entity 3 is related to Entity 4 and Entity 5.
  >    *   Entity 4 is NOT related to Entity 5.
  > 4. All observable phenomena follow from this structure.
  >
  > *Note: The intrinsic nature of the entities is unspecified.*

  *(Visual aid on the handout: A simple node-and-edge graph with 5 nodes matching the description above.)*

  ---

  ## Part 2: Construction & Variation (00:10 – 00:40)

  **Round 1 (Pile A - Stationery):**
  *   **Task:** Arrange the pens/paperclips to satisfy Theory $\Sigma$.
  *   **Facilitator Role:** Circulate. If a group asks, "Does 'related' mean touching?" say: "You decide. As long as you can consistently point to the relation and show it matches the diagram."
  *   **Goal:** They will likely place objects in a line or cluster and declare "touching" or "pointing at" as $R$.

  **Round 2 (Pile B - Personal Junk):**
  *   **Time:** 10 Minutes.
  *   **Task:** "Dismantle Model 1. Now make Theory $\Sigma$ true using **Pile B** (Keys, shoes, phones). The objects must be *ontologically distinct* from Round 1. No pens."
  *   **Facilitator Prompt (if they hesitate):** "Remember, the Theory doesn't say what the stuff is. It only cares about the pattern. Can a shoe be Entity 3? Can a key be Entity 4?"
  *   **Goal:** They will realize they can map the exact same graph onto totally different matter.

  **Round 3 (The Black Box Challenge):**
  *   **Time:** 10 Minutes.
  *   **Task:** "Put all objects in a box/bag. I am telling you that Theory $\Sigma$ is **True** of the contents of this bag. You cannot look inside.
      *   **Question 1:** Can you tell me what is in the bag?
      *   **Question 2:** Does it matter what is in the bag for the Theory to be true?
      *   **Write down your group's consensus on Handout 2.**"

  ---

  ## Part 3: The Debrief (00:40 – 01:15)

  *Do not sit down. Stand around the whiteboard. Keep the energy high.*

  **Step 1: The Triviality Intuition (00:40 – 00:55)**
  *   **Ask:** "Group 1, what was Entity 3 in Round 1? Group 2, what was Entity 3 in Round 2?"
  *   **Write on Board:** *Round 1: Eraser. Round 2: Left Shoe.*
  *   **Ask:** "Did the Theory change?" (No). "Did the Structure change?" (No). "Did the World change?" (Yes).
  *   **The Trap:** "If I tell you Theory $\Sigma$ is the *final truth* about the universe, do you know what the universe is made of?"
  *   **Expected Answer:** "No. It could be anything."
  *   **Follow-up:** "So if I say 'The universe is made of Erasers' vs 'The universe is made of Shoes,' have I said anything scientifically different?"
  *   **Goal:** Elicit the feeling that if structure is all there is, the 'stuff' is arbitrary. This is the **Newman Problem** (without naming it).

  **Step 2: Splitting Epistemic vs. Ontic (00:55 – 01:05)**
  *   **Facilitator:** "I want to split the room.
      *   **Side A:** Stand here if you think: 'The theory is true, the structure is real, but we just **can't know** what the stuff is.' (Epistemic)
      *   **Side B:** Stand here if you think: 'The theory is true, the structure is real, and there **is no stuff** beyond the relations.' (Ontic)"
  *   **Interrogate Side A (Epistemic):** "If we can't know the stuff, why posit it? Is it just a placeholder?"
  *   **Interrogate Side B (Ontic):** "Group 3, you built the model with dice. If 'structure is all there is,' did the dice cease to be dice and become just 'nodes'? If I swap the dice for coins, have I changed the world, or just the labels?"
  *   **The Crucial Distinction:**
      *   Point to Side A: "For you, the triviality problem is annoying but survivable. You believe there *is* a specific stuff (ether, electrons), you just admit your equations don't capture it."
      *   Point to Side B: "For you, the triviality problem is fatal. If the world *is* structure, and *any* junk fits the structure, then saying 'the world is structure' says nothing."

  **Step 3: Naming the Beast (01:05 – 01:15)**
  *   **Reveal:** "Side A is arguing for **Epistemic Structural Realism**. Side B is arguing for **Ontic Structural Realism**. The worry that 'any junk fits' is **Newman's Objection**. The idea that 'equations survive, furniture changes' is the **No Miracles Argument for Structure**."
  *   **Handout Distribution:** Now hand out a one-pager with the definitions of Ramsey Sentences, Worrall, and Newman.
  *   **Closing:** "Next week, read the Psillos paper. Come ready to tell Side B how they might escape the junk problem."

  ---

  ## Part 4: Facilitator's Troubleshooting Guide

  ### Predictable Failure Modes & Fixes

  **1. The "Causal" Objection (The Short-Circuit)**
  *   **What happens:** A student says, "This is silly. In real science, $R$ isn't just 'linked,' it's 'exerts force on.' Shoes can't exert force on keys like electrons do."
  *   **Why it kills the game:** It reintroduces intrinsic nature (causal powers) which the activity is trying to bracket.
  *   **The Fix:** "You are absolutely right. That is exactly the debate. For this game, assume the 'force' is defined *only* by the success of the prediction. If the shoe/key model predicts the observations as well as the electron model, does the 'force' distinction hold? Park that objection for the debrief."

  **2. The "Wrong Number" Error**
  *   **What happens:** A group uses 6 objects instead of 5.
  *   **The Fix:** Don't correct them immediately. Let them present. Then ask the other groups: "Does their model satisfy Schema $\Sigma$?" Let the students police the structure. It reinforces that the *structure* is the constraint, not the TA.

  **3. The "It's Obvious" Reaction**
  *   **What happens:** Students say, "Obviously the theory implies physical objects in spacetime."
  *   **The Fix:** "Okay, add 'in spacetime' to the Theory Schema. Now, does that rule out the playing cards? Cards are in spacetime. What specific *kind* of spacetime occupant is required? If you say 'mass,' add 'has mass' to the Schema. Now, does the theory tell you *what* has mass, or just that *something* does?" (This pushes them toward the Ramsey sentence view).

  ### Conceptual Limitations (Be Honest About These)

  In the debrief, explicitly acknowledge what this game **cannot** do, so students don't walk away with the wrong impression:

  1.  **No History:** "This game is static. It doesn't show you Fresnel's equations surviving into Maxwell's theory. It only shows you that *one* structure can have *many* ontologies. It doesn't prove that structure is what *actually* survives history."
  2.  **Finite vs. Infinite:** "Newman's original proof relies on infinite sets. With 5 objects, it's easy to fit the pattern. With infinite objects, the claim that 'any collection fits' is much stronger and harder to escape. This toy model understates the mathematical force of the objection."
  3.  **Natural vs. Arbitrary Relations:** "We let you define 'relation' however you wanted. Real science restricts relations to 'natural' ones (causal, spatiotemporal). The debate is whether 'naturalness' saves Ontic SR from the junk problem. This game doesn't solve that; it just exposes the need for it."

  ### The Epistemic/Ontic Split Check
  *   **If the room collapses into one view:**
      *   *Push Epistemic:* "If you think there is real stuff we can't know, aren't you just a realist who is slightly humble? Why call it Structuralism?"
      *   *Push Ontic:* "If you think there is only structure, how do you avoid the 'junk' problem? If the world is structure, and pens fit the structure, is the world made of pens?"

  ### Materials Checklist for TA
  *   [ ] 3 Bags of "Junk" (mixed stationery, personal items, cards/dice).
  *   [ ] 14 Copies of Handout 1 (Schema only).
  *   [ ] 14 Copies of Handout 2 (Log).
  *   [ ] 14 Copies of Handout 3 (Definitions - **Keep hidden until 01:05**).
  *   [ ] Tape/Blu-tack.
  *   [ ] Whiteboard markers (multiple colors to draw the graph).

  ---

  ## Handout 1 (Student Version)
  *(Print this exactly as is. No footer, no course code.)*

  **THEORY $\Sigma$**

  1.  There exist exactly **5** distinct entities.
  2.  There is a relation **$R$** that holds between some pairs of entities.
  3.  The structure of **$R$** is as follows:
      *   Entity 1 is related to Entity 2.
      *   Entity 2 is related to Entity 3.
      *   Entity 3 is related to Entity 4 and Entity 5.
      *   Entity 4 is NOT related to Entity 5.
  4.  All observable phenomena follow from this structure.

  *Note: The intrinsic nature of the entities is unspecified.*

  **[Diagram: 5 circles. Lines connecting 1-2, 2-3, 3-4, 3-5. No line between 4-5.]**

  ---

  ## Handout 3 (Reveal Version)
  *(Distribute only at 01:05)*

  **VOCABULARY REVEAL**

  *   **Ramsey Sentence:** A way of rewriting a theory where you replace all theoretical terms (electron, ether, field) with variables ("There exists an $x$ such that..."). This leaves only the logical structure.
  *   **Epistemic Structural Realism (ESR):** We can only *know* the structure of the world (the Ramsey sentence). The intrinsic nature of the entities is unknowable.
      *   *Response to Junk Problem:* The junk fits the structure, but the *real* world has a specific nature we just can't access.
  *   **Ontic Structural Realism (OSR):** There *is* no intrinsic nature. The world *is* structure. Objects are just nodes in a network.
      *   *Response to Junk Problem:* (The hard part). Must explain why some structures are "natural" and others aren't, without appealing to hidden stuff.
  *   **Newman's Problem:** If a theory is just "There exist entities with this structure," then *any* collection of enough entities can be arranged to satisfy it. The theory becomes trivially true.
