answer: |-
  You don't need to drop a verdict; you need to sharpen the definition of "evidential record." Your intuition is correctly identifying a distinction that your current "public vs. private" formulation is too blunt to capture. The tension between your two "breaker" cases (merged chronology vs. invented meeting) reveals that the ethical boundary isn't about *truth vs. fiction*, but about **Causal Architecture vs. Narrative Texture.**

  Here are two competing principles that formalize your intuitions and resolve the tension.

  ### Principle 1: The Permission of Narrative Texture
  **A dramatization may alter the sensory or temporal surface of a life to convey its psychological or historical truth, provided the alteration does not assert a false causal mechanism.**

  This covers your "OK" verdicts:
  *   **Invented Dialogue (Case 1):** This is texture. We understand film dialogue is necessarily fabricated to convey the *substance* of the public record (the papers).
  *   **Moved Suicide (Case 3):** This is scenic texture. Moving the wheat field to a church changes the *image*, but not the *cause* of the death or the *nature* of the despair. It preserves the psychological truth.
  *   **Merged Chronology (Case 6a):** This is temporal texture. Compressing five years into one acknowledges the medium's limitation. It says, "This is the *gist* of the era," not "This specific Tuesday caused that specific Thursday."
  *   **Grief VO (Case 4):** This is translational texture. It updates the *language* of feeling without changing the *fact* of the feeling.

  ### Principle 2: The Prohibition on Fabricated Agency
  **A dramatization must not attribute specific agential acts, interactions, or private resolutions to the subject that did not occur, particularly where those inventions imply a causal history or moral character unsupported by the record.**

  This covers your "Not OK" verdicts:
  *   **Vicious Letter (Case 2):** This resolves ambiguity against the subject. It attributes a specific moral failing (viciousness) that is not evidentially secure.
  *   **Hidden Romance (Case 5):** This attributes a specific agential relationship where silence was the historical fact. It colonizes the private sphere.
  *   **Invented Meeting (Case 6b):** **Here is your repair.** This violates Fabricated Agency. Unlike merging years (which scales time), inventing a meeting asserts a specific *causal link*. It claims Person A influenced Person B at Moment C. That is a claim about historical mechanics, not just narrative flow. It attributes an action to the dead politician that they did not take.

  ### Why the "Contract" Holds
  Your gut reaction to the **Invented Meeting (6b)** being worse than **Merged Chronology (6a)** is correct and consistent with these principles.
  *   **Merged Chronology** admits it is a summary. It treats time as a canvas to be stretched.
  *   **Invented Meeting** pretends to be a specific historical datum. It treats *causality* as a canvas to be painted.

  The "Posthumous Hermeneutic Contract" should therefore be revised from "respecting the evidential record" to **"respecting the topology of agency."** You can change the scenery (texture), but you cannot move the load-bearing walls (causality/agency).

  ### Application: The AI Voice Synthesis Case
  **Verdict:** This is a violation, and it is arguably worse than the Invented Meeting.

  **Analysis:**
  The AI voice case fails on both principles, landing it in a distinct, more severe category.
  1.  **Violation of Narrative Texture:** Unlike the grief VO (Case 4), which uses a *narrator* to translate feeling, AI synthesis claims to *be* the subject. It is not translating the text; it is simulating the biological signature.
  2.  **Violation of Fabricated Agency:** Speech is an agential act. By synthesizing the voice with speculative emotional cadences, you are attributing a specific *performance* to the dead poet. You are forcing them to "speak" words with an emotional inflection they never chose.

  **Classification:**
  It is closer to **Case 2 (The Vicious Letter)** than Case 1 (Invented Dialogue).
  *   **Case 1** is understood as a convention: *Actors speak for the dead.*
  *   **AI Voice** erases the convention: *The dead speak for themselves.*

  This crosses a threshold from **Dramatization** to **Necromantic Ventriloquism.** It resolves the ambiguity of how the poet *sounded* and *felt* in a way that is pure speculation, but presents it as evidential fact (their own voice). It colonizes the physical embodiment of the dead, which is the ultimate "private space" they leave behind.

  ### Summary for Your Seminar
  You do not need to bite a bullet. Your intuitions hang together if you define the obligation as follows:

  > **We owe the dead fidelity regarding the *causes* of their lives and the *ambiguity* of their interiors. We do not owe them fidelity regarding the *sensory details* of their staging, provided those details serve the psychological truth.**

  *   **Merged Years:** Changes sensory detail (time). **Permissible.**
  *   **Invented Meeting:** Changes causal history. **Impermissible.**
  *   **AI Voice:** Changes physical embodiment and resolves performative ambiguity. **Impermissible.**

  Your "contract" holds, provided you distinguish between **lying about what happened** (forbidden) and **lying about how it looked** (permitted). The Invented Meeting is a lie about what happened; the Moved Suicide is a lie about how it looked.
