answer: |-
  **Joint Statement on Demarcation and Epistemic Trust**

  **Signatories:** A Commitment to Methodological Falsificationism (MF) and A Commitment to Demarcation Pluralism (DP)

  **1. Agreed Claims**

  1.  **Logical Asymmetry:** We agree that there exists a fundamental logical asymmetry between verification and falsification; universal scientific laws cannot be conclusively verified by finite observations, but they can be logically contradicted by a single reproducible basic statement.
  2.  **Historical Function:** We acknowledge that Popper's criterion historically performed a vital function in distinguishing empirical inquiry from non-empirical systems, specifically by highlighting how early psychoanalysis and Marxism could accommodate any conceivable state of affairs, thereby insulating themselves from empirical refutation.
  3.  **Immunisation Strategies:** We share the view that immunisation strategies exist wherein auxiliary hypotheses are adjusted to shield a core theory from refutation, and that distinguishing legitimate theory refinement from illegitimate shielding is a central problem for any demarcation account.
  4.  **Purpose of Demarcation:** We concur that the ultimate purpose of any demarcation tool is not merely to classify sentences or disciplines linguistically, but to identify practices worthy of public epistemic trust, ensuring that policy and education rely on inquiries capable of correcting error.

  **2. Disagreements Table**

  | Issue | Methodological Falsificationist (MF) Wording | Demarcation Pluralist (DP) Wording |
  | :--- | :--- | :--- |
  | **Empirical Risk** | Empirical risk can be quantified independently of theoretical context by measuring the logical improbability of a prediction. | Empirical risk is context-dependent and cannot be quantified independently of the surrounding web of beliefs and instrumental constraints. |
  | **Adaptive Clinical Trials** | Adaptive refinement in clinical trials counts as progressive problem-solving only if the adjustment increases the overall predictive boldness of the programme. | Adaptive refinement in clinical trials counts as progressive problem-solving because it adheres to pre-registered institutional norms that ensure reliability despite logical flexibility. |
  | **Ontology of Science** | 'Science' names a natural kind of inquiry defined by a specific logical structure of testing and risk-taking. | 'Science' names an institutionally governed family resemblance where no single necessary-and-sufficient criterion captures all valid practices. |

  **3. Cruxes and Predictive Cases**

  **Crux 1: The Metric for Empirical Content**
  *   **Sub-question:** Does there exist a non-circular metric for the empirical content of a theoretical programme that is independent of sociological context?
  *   **Concrete Case:** The evaluation of a particular adaptive oncology trial that altered its primary endpoint after interim analysis showed lack of efficacy on the original endpoint.
  *   **MF Prediction:** This case reveals that without a strict logical metric, the alteration constitutes illegitimate immunisation that dilutes empirical risk, unless the new endpoint was predicated on a bold, independent prediction.
  *   **DP Prediction:** This case reveals that institutional safeguards (such as independent data monitoring committees and transparent reporting) maintain epistemic integrity even when the logical structure shifts, proving context matters more than abstract risk metrics.

  **Crux 2: Institutional Norms and Relativism**
  *   **Sub-question:** Can institutional norms perform the demarcation work originally assigned to falsifiability without collapsing into relativism?
  *   **Concrete Case:** The replication crisis in social psychology, where peer-reviewed studies failed to reproduce despite adhering to standard institutional norms of the time.
  *   **MF Prediction:** This case reveals that institutional norms alone are insufficient to prevent pseudoscience, as the crisis arose from a lack of rigorous falsifiable constraints on statistical modelling.
  *   **DP Prediction:** This case reveals that institutional norms are self-correcting; the crisis itself was identified and addressed through pluralistic norms (open data, preregistration), demonstrating that the system works without a single logical demarcation line.

  **Verbal Disagreement Note**
  We acknowledge that a portion of our divergence is purely verbal regarding the proper extension of the term 'science' itself. The MF prefers to restrict the label to practices exhibiting high logical risk, whereas the DP prefers to extend the label to any practice exhibiting high institutional reliability. We agree that no substantive issue remains regarding the *value* of the practices themselves; the dispute concerns only whether the honorific title 'science' should be withheld from reliable but logically flexible inquiries.

  Summary: This statement formalises our agreement on the logical asymmetry of falsification and the goal of epistemic trust while isolating our divergences on risk metrics and institutional norms to specific empirical cases for future resolution.
