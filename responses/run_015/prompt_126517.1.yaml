  The Oakridge Debate Society's original Constitution established Article I (Member Rights), requiring an 80% supermajority to amend any text within it, and Article II (Procedure), requiring a simple 51% majority for amendments and granting the Council power under Section II.4 to "reassign provisions between articles by 51% vote for structural coherence." In Step 1, citing a need to group all operational clauses together, the Council voted 51% to move the "Fair Hearing" provision from Article I to Article II, altering its location but not its text. In Step 2, relying on the provision's new location, the Council voted 51% to delete the "Fair Hearing" text entirely as part of a routine procedural update. Each vote complied with the thresholds active at the moment of voting, yet the final rulebook lacks a protection the original Constitution reserved exclusively for 80% consensus.

  **Verdicts**
  *   **Step 1:** Stepwise Test **Valid** (complies with II.4 reassignment power); End-State Test **Pending** (no substantive loss yet).
  *   **Step 2:** Stepwise Test **Valid** (complies with Article II 51% amendment rule); End-State Test **Invalid** (the final state removes a right the original rulebook forbade removing via 51%).

  **Feature Doing the Work**
  The **Procedural Reassignment Clause** (Section II.4). It decouples the substantive protection (the 80% lock on specific text) from the procedural classification (the Article label), allowing the procedure to be downgraded before the substance is touched.

  **If That Feature Is Removed**
  If Section II.4 required an 80% vote to reassign provisions from Article I, Step 1 would fail the Stepwise Test immediately. The chain is broken at the source, preserving the 80% threshold for any action affecting the protected text, regardless of labeling.

  **Strongest Reply for the Stepwise Defender**
  "Legality is a property of the present moment, not a historical trajectory. Once Step 1 lawfully reclassified the text, the 80% requirement ceased to exist for that provision; it was replaced by the 51% rule. To invalidate Step 2 is to enforce a 'ghost rule' from a superseded version of the Constitution, violating the principle that the current valid rulebook is the sole source of legal authority."
