      *   *Rationality vs. Causation:* Rationality is normative. Causation is descriptive. If I pick A because of a neuron firing, that's causal. Is it rational? Only if the norm allows causal tie-breaking.

  5.  **Identifying the Tensions (The "Impossible Trinity"):**

      *   *Tension 1: Rational Determinism vs. Arbitrary Choice.* If rationality requires a sufficient reason (Principle of Sufficient Reason - PSR), then choosing A over B without a preference is irrational. But if we demand Action (D1), we must allow it.
