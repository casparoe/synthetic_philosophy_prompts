prompt: |-
  ok so I'm trying to think about what a theory of rational choice actually owes us when an agent genuinely has no preference between options — not just "indifferent" in the von Neumann-Morgenstern sense, but truly equipreffered, with no hidden ordering and no coin-flip meta-preference either. Write the desiderata: the cases it has to cover (Buridan's ass, the agent who freezes, the one who picks randomly but feels nothing), the distinctions it must preserve (indifference vs equipreference, suspension vs arbitrary selection, rationality vs mere causation), and any constraints from decision theory or psychology it can't violate. Flag which requirements look jointly unsatisfiable — I suspect determinism in choice clashes with allowing arbitrary resolution, but tell me if I'm wrong. Also say exactly what would change your mind on which desideratum is the non-negotiable one and where your reasoning is shakiest.
