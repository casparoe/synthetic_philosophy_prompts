answer: |-
  Here is a decision procedure designed for your specific constraints: 15 minutes, no philosophy degree, high stakes for neighborly relations. It replaces the "Clean Hands" doctrine (which is an absolute bar) with a "Good Faith & Consistency" test (which weighs credibility).

  ### The "Good Faith & Consistency" Filter
  **Time limit:** 15 minutes per complaint.
  **Goal:** Determine if the complaint is valid, if the complainant has the credibility to press it, and if the committee can enforce it without looking corrupt.

  #### Step 1: The Fact Check (3 Minutes)
  *Ignore who said it. Look at what happened.*
  1.  **Did the behavior happen?** (Yes/No)
      *   *If No:* **Dismiss.** (End of process).
      *   *If Yes:* **Does it violate a specific, written house rule?** (Yes/No)
          *   *If No:* **Dismiss.** (You cannot sanction for "vibes" or unwritten expectations).
          *   *If Yes:* **Proceed to Step 2.**

  #### Step 2: The "Same Norm" Test (4 Minutes)
  *This replaces "Clean Hands." We are checking if the complainant is currently breaking the **same** rule they are complaining about.*
  1.  **Is the complainant currently violating the *exact same* rule?** (e.g., complaining about noise while making noise; complaining about chores while skipping chores).
      *   *Note:* "Sloppiness" is not a rule. "Dishes" and "Common Room Hoarding" are **different** rules. Do not group them together.
      *   *If No (they are clean on this specific rule):* **Complainant has Full Standing.** Proceed to Step 4.
      *   *If Yes (they are currently breaking this rule too):* **Proceed to Question 2.**
  2.  **Is the complainant openly admitting to their violation and taking steps to fix it?**
      *   *If Yes:* **Complainant has Restored Standing.** (Own your mess, keep your voice). Proceed to Step 4.
      *   *If No (they are denying it or ignoring it):* **Complainant has No Standing.**
          *   **Action:** **Dismiss the complaint.**
          *   **Crucial Add-on:** You must immediately open a *separate* file on the Complainant for their violation. You cannot let their violation slide just because you dismissed their complaint.
          *   *(Why: This stops people from weaponizing rules they don't follow, but ensures the rule is still enforced.)*

  #### Step 3: The "Past Sins" Check (3 Minutes)
  *What if they broke the rule in the past, but not now?*
  1.  **Did the complainant break this rule in the past (over 6 months ago) but stop?**
      *   *If Yes:* **Complaint Stands.** (Reform is allowed. Past sin does not forfeit future peace).
      *   *Note:* You may note in the rationale that the complainant has "historical context," but it does not block the sanction.
  2.  **Is the complainant filing on behalf of a third party who is completely clean?** (e.g., "I'm noisy, but my partner is quiet and they can't sleep").
      *   *If Yes:* **Complaint Stands.** (The victim has standing, even if the messenger is flawed).

  #### Step 4: The Committee Mirror (5 Minutes)
  *This is the hardest part. It asks if the Committee is too hypocritical to act.*
  1.  **Has the Committee consistently ignored this specific rule for popular members or founders in the last 12 months?**
      *   *If No:* **Proceed to Sanction/Mediate.**
      *   *If Yes:* **Stop.** You have a "Policy of Negligence."
          *   **Action:** You cannot sanction the Target *unless* you simultaneously acknowledge the Committee's failure in the written rationale.
          *   **Requirement:** The one-page rationale must include a sentence admitting the house has enforced this unevenly and that this sanction is a "reset" of the standard.
          *   *(Why: If you punish the new guy for what the old guy got away with, you are not justice, you are a purge. You must own the inconsistency.)*

  ---

  ### Why This Works (The Distinctions You Asked For)
  You suspected "they don't believe the norm," "they have no right," and "wrong messenger" were different. You are right. Here is how the procedure separates them:

  1.  **"They have no right to hold you to it" (Step 2, Current Violation):**
      *   This is the only time you dismiss a complaint. If I am currently dumping trash in the hallway, I cannot demand you stop doing it *today*. It is an abuse of power.
      *   *Fix:* You must fix your own behavior (admit it) before you can demand others fix theirs.
  2.  **"They don't really believe the norm" (Step 2, Denial vs. Admission):**
      *   If they break the rule but *deny* it, they are attacking the rule's existence. Dismiss their complaint.
      *   If they break the rule but *admit* it, they respect the norm enough to know they broke it. Allow their complaint.
  3.  **"The complaint is true but they shouldn't be the one saying it" (Step 3, Past Sins/Third Party):**
      *   The procedure ignores this. In a co-op, truth matters more than purity. If the dishes are rotting, it doesn't matter if the complainer partied loud in 2023. The dishes still need washing.
  4.  **"Same Norm" Ambiguity:**
      *   The procedure forces you to define "Same" by **Rule**, not by **Vibe**.
      *   *Test:* Are they cited for the same line in the handbook? If yes, it's the same norm. If one is "Noise" and one is "Chores," they are different norms, even if both are "being a bad neighbor."

  **Where the Procedure Hands Off to Values:**
  Step 4 (The Committee Mirror) is not a fact check; it is a political choice. The procedure tells you *that* you are inconsistent, but it cannot tell you *if* that inconsistency matters enough to stop a sanction. It forces you to write the apology, but you still have to vote to sanction. That is where you decide what kind of house you want to be.

  ---

  ### Case Studies

  #### Case 1: The Chore War
  **Facts:** Complainant (4 months missed shifts) files against Target (2 months missed shifts). Both are current violations. Complainant is not admitting fault.
  **Procedure Run:**
  *   Step 1: Fact Check. Yes, Target missed shifts. Rule exists.
  *   Step 2: Same Norm. Yes, both are missing chores. Complainant is currently violating.
  *   Step 2, Q2: Admission? No.
  *   **Result:** **Complaint Dismissed.** Complainant has No Standing.
  *   **Mandatory Follow-up:** Committee opens a separate violation file on the Complainant for their 4 missed shifts.
  *   **Why you might hate it:** The Target (who did less wrong) escapes sanction *in this specific instance* because the process was poisoned by the Complainant. However, the Complainant now faces sanction themselves. It stops the "I'll report you before you report me" arms race.

  #### Case 2: The Sloppy House
  **Facts:** Common Room Hoarder files against Target leaving dishes for a week.
  **Procedure Run:**
  *   Step 1: Fact Check. Yes, dishes left. Rule exists.
  *   Step 2: Same Norm. **No.** Hoarding is "Common Area Access." Dishes is "Hygiene/Kitchen." They are different handbook lines.
  *   **Result:** **Complaint Stands.** Complainant has Full Standing.
  *   **Why:** "Sloppiness" is a character judgment, not a rule violation. Unless the handbook says "General Sloppiness," you must treat specific rules as silos. A person can be a hog but a clean cook.
  *   **Outcome:** Target is sanctioned/mediated for dishes. Hoarder's behavior is ignored *for this case* (though could be reported separately).

  #### Case 3: The Founder's Noise (The One You Will Hate)
  **Facts:** Founder (noisy in 2023, never sanctioned) files against New Member (noisy in 2024, documented). Target's defense: "She got away with it." Committee admits they let the Founder slide because she was popular.
  **Procedure Run:**
  *   Step 1: Fact Check. Yes, New Member is noisy. Rule exists.
  *   Step 2: Same Norm. Founder is *not currently* noisy. (Past sin only).
  *   Step 3: Past Sins. Founder stopped (or at least isn't currently doing it). **Complaint Stands.**
  *   Step 4: Committee Mirror. **Yes.** Committee ignored this rule for the Founder previously.
  *   **Result:** **Complaint Stands, BUT...**
  *   **Mandatory Condition:** The Committee **must** sanction the New Member *only if* the written rationale includes a public admission that the Committee failed to enforce this rule against the Founder.
  *   **The "Hate" Part:** You (the Chair) have to write and read out loud: *"While the New Member is in violation, the Committee acknowledges this rule was not enforced for the Founder in 2023 due to Committee negligence. This sanction is intended to reset the standard for all future members."*
  *   **Why this is necessary:** If you sanction the New Member without admitting the Founder got special treatment, you confirm the house is run by popularity, not rules. You lose the moral authority to punish anyone.
  *   **Two Separate Questions:**
      1.  *Does her complaint stand?* **Yes.** (Her past doesn't block her current right to peace).
      2.  *Do we have business sanctioning?* **Yes, but conditionally.** You cannot enforce the law selectively without admitting the selectivity.
      3.  *Which first?* Answer Question 1 first (Validity), then Question 2 (Enforcement). If you answer 2 first, you get paralyzed by your own guilt.

  ### Honest Limitations (Philosophy Dressed as Checklist)
  1.  **The "Same Norm" Line:** Step 2 forces you to decide if "Dishes" and "Trash" are the same norm. The checklist says "check the handbook," but handbooks are often vague. If your handbook says "Keep common areas clean," then Dishes and Trash *are* the same norm. You cannot hide behind the checklist here; you have to interpret the text.
  2.  **The "Committee Mirror" Burden:** Step 4 assumes the Committee *knows* its own history. If you don't keep records of past dismissed complaints, you can't answer Step 4 honestly. This procedure requires you to keep a log of *dismissals*, not just sanctions.
  3.  **The "Hate" Reality:** This procedure will not make people happy. In Case 3, the New Member will feel targeted (because they are), and the Founder will feel vindicated (because they are). The goal isn't happiness; it's **integrity**. The procedure ensures that if you punish someone, you pay the social cost of admitting your own past failures.

  **Final Advice:** Print this. Put it on the table. When someone says "But you did it too!", point to Step 2. When someone says "But you let *her* do it!", point to Step 4. It takes the argument off your personalities and puts it on the paper.
