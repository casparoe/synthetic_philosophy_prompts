answer: |-
  Dear Chair and Members of the Advisory Board,

  I am writing to provide the decision procedure you requested, born out of the urgent need to structure our deliberations on market proposals involving protected goods. Given the constraints of your monthly meetings, the lack of economic expertise on staff, and the necessity of defending your recommendations to a skeptical legislature, I have designed a workflow that avoids abstract theory in favor of actionable questions. This procedure is intended to take roughly forty-five minutes to execute during a meeting. It moves from factual assessments to value judgments, ensuring that you know exactly when you are relying on evidence and when you are relying on collective moral intuition. The core of this tool is to distinguish between corruption, where the meaning of a good is fundamentally altered by price, and crowding-out, where existing non-market motivations are displaced by financial incentives. To make this practical, I have embedded specific stopping rules and evidence thresholds that lead to one of three recommendations: prohibit, restrict with enforceable safeguards, or permit with post-hoc monitoring.

  The procedure begins with a factual baseline assessment that should take no more than ten minutes. The first question asks whether the good or service in question is currently supplied primarily through non-market mechanisms such as altruism, civic duty, or public provision. If the answer is no, and the good is already routinely traded for profit, the procedure directs you to skip to the final monitoring phase, as the market norm is already established. If the answer is yes, you proceed to the second factual question regarding vulnerability. You must determine if the potential sellers or providers are facing a condition of desperation or urgent necessity that compromises their ability to refuse the transaction. Evidence here includes income levels relative to the proposed payment, the urgency of the need driving the supply, and the availability of alternatives. If there is clear evidence of systemic desperation, you mark this as a high-risk factor. If data on vulnerability is missing, the procedure mandates that you must assume the risk is present rather than absent, forcing a more conservative stance until evidence is provided. This rule prevents the board from approving markets based on optimistic assumptions about consent when data is scarce.

  Once the factual baseline is set, you move to the semantic degradation step, which is the heart of the corruption test and should take fifteen minutes. This step requires you to identify observable shifts in institutional language, social practice, or public justification that would occur if compensation were introduced. You are not asked to speculate on internal feelings but to look for external markers. Sufficient evidence of semantic degradation includes a shift in terminology where persons are referred to as vendors or units rather than donors or citizens, a change in legal contracts from agreements of care to bills of sale, or a public justification that frames the exchange solely in terms of efficiency rather than solidarity. For example, if introducing payment for a bodily good would require hospital forms to list the provider as a contractor rather than a participant in care, this counts as degradation. If the board observes that the language of the institution would permanently shift to reflect a commercial relationship, this is marked as a positive finding for corruption. At this juncture, the board must sign off on a judgment call, as determining what counts as a harmful shift in language is a value judgment, not a factual one. You must vote on whether the observed semantic shift is acceptable or unacceptable for this specific good.

  Following the semantic test, you proceed to the motivation displacement check, which addresses crowding-out. This question asks whether introducing payment is likely to reduce the existing supply of the good provided through non-market means. You should look for comparative data from similar jurisdictions or analogous goods. If evidence suggests that paying for the good will cause altruistic providers to withdraw, reducing the total supply or changing the quality of the pool, this is marked as a high risk. If data is missing, you again assume the risk is present. This leads to the final decision matrix. If both vulnerability and semantic degradation are high, the recommendation is to prohibit the exchange. If vulnerability is high but semantic degradation is low, or if semantic degradation is high but vulnerability is low, the recommendation is to restrict with enforceable safeguards, such as price caps, waiting periods, or mandatory counseling. If both risks are low, the recommendation is to permit with post-hoc monitoring. However, if the board disagrees with the matrix output based on strong moral conviction, there is a final override clause where the board must explicitly vote to overturn the procedure's recommendation and record the value judgment that justified the override. This ensures transparency when values trump the algorithm.

  To demonstrate how this works in practice, I will apply the procedure to the three cases you identified, starting with the proposal to allow direct cash payments to live kidney donors within a public health system. In the factual baseline, kidneys are currently supplied through altruism and public provision, so we proceed. Regarding vulnerability, live donors are often financially stressed, and the payment would be significant relative to their income, suggesting high vulnerability. We must assume this risk is present even if specific data on donor poverty rates is missing. Moving to semantic degradation, we observe that introducing cash payment would likely shift hospital language from donor care to vendor procurement, and contracts would resemble sales agreements rather than medical consents. The board must vote here, but historically, this shift is viewed as unacceptable commodification of the body. On motivation displacement, evidence from countries with compensated donation suggests altruistic donation rates may drop or the quality of health screening might be compromised by donors hiding medical history to secure payment. The procedure yields a recommendation to prohibit, as both vulnerability and semantic degradation are high. This aligns with most intuitive moral reactions, but note that the judgment call on semantic degradation is where the board must sign off. If the board believed that calling someone a vendor was acceptable, they could override, but they must record that value judgment. The procedure holds firm here, though it relies heavily on the board's willingness to label the semantic shift as degradation.

  The second case involves residents of a flood-stricken region trading future votes in a cooperative water-board election for immediate relief supplies. The factual baseline shows votes are currently protected from trade and supplied via civic duty. Vulnerability is extreme, as the residents are in a disaster zone needing immediate survival goods, making consent highly questionable. The procedure mandates assuming high vulnerability due to the emergency context. In the semantic degradation step, allowing vote trading would shift the language of elections from civic participation to market transactions. Voting booths might eventually be viewed as marketplaces, and public justification would shift from representation to asset management. This is a clear observable shift in institutional language and practice. The board must vote on whether this degradation is acceptable, but it is difficult to imagine a board signing off on this without violating the core concept of democratic equality. Regarding motivation displacement, if votes are tradable, the motivation to vote based on policy preference may be crowded out by the motivation to trade for survival. The procedure recommends prohibition due to high vulnerability and high semantic degradation. This case forces an uncomfortable judgment call only if the board considers the immediate survival need to outweigh the long-term corruption of the civic sphere. The procedure does not settle this value conflict automatically; it flags it for the board to vote on. If the board votes to permit because lives are at stake, they must use the override clause and record that survival values trump civic integrity in this instance. The procedure admits it cannot settle the matter of whether survival justifies civic corruption and returns the decision to your values.

  The third case is the proposal to suspend price-gouging restrictions on bottled water after a hurricane, where you expect the answer to be permit with monitoring. Applying the procedure, bottled water is already a market good, so the factual baseline suggests we might skip to monitoring, but the proposal is to remove a protective barrier during an emergency, which treats it as a protected necessity in this context. Vulnerability is high because residents need water to survive and have no alternatives during a hurricane. The procedure dictates assuming high vulnerability when data on alternative supply is missing. In the semantic degradation step, suspending price caps does not necessarily change the language used to describe water; it remains a commodity bought and sold. However, it might shift the public justification of the market from fair access to profit maximization during crisis. The board must vote on whether this shift in justification counts as degradation. If the board decides it does not, we move to motivation displacement. Higher prices might encourage more supply from outside the region, potentially increasing total availability, which suggests non-market motivations are not being displaced but rather market motivations are being leveraged. The procedure here creates tension. The vulnerability check suggests restriction or prohibition, but the semantic check suggests low degradation. If the board follows the matrix strictly, high vulnerability should lead to restriction, not permission. To reach your expected outcome of permit with monitoring, the board must make a judgment call that the vulnerability is mitigated by the increased supply resulting from higher prices. This requires the board to sign off on the economic claim that price hikes will reliably increase supply in a disaster zone, which is a factual claim often disputed. If the board accepts this evidence, they can recommend permission with monitoring. However, if the evidence is missing, the procedure requires assuming the risk, which would lead to restriction. This is where the procedure might misfire or produce an answer you dislike. It forces you to acknowledge that permitting price gouging relies on a value judgment that efficiency outweighs equity in emergencies, not just a factual determination. The procedure breaks down here only in the sense that it exposes the value conflict rather than hiding it. It admits it cannot settle whether profit incentives during disasters are morally acceptable and returns the decision to your values regarding equity versus efficiency.

  In all three applications, you will notice that the procedure does not pretend to settle questions that are genuinely about values. In the kidney case, it forces you to own the judgment that bodies should not be vendors. In the vote case, it forces you to decide if survival trumps civic integrity. In the water case, it forces you to admit that permitting price hikes is a choice to prioritize supply mechanisms over immediate affordability. There are points where the procedure will misfire, particularly when the distinction between corruption and crowding-out collapses. For example, if semantic degradation occurs but actually increases supply significantly, the procedure asks you to weigh meaning against survival, which is a philosophical question disguised as a procedural step. Additionally, the requirement to assume risk when data is missing may lead to overly conservative recommendations that frustrate the legislature. You must be prepared to defend the precautionary principle as a ethical stance, not just a risk management strategy. There are also distinctions that collapse under pressure, such as determining when a shift in language is permanent versus temporary. You may find yourselves debating whether a change in forms constitutes a permanent cultural shift, which is difficult to evidence without sociological study. In these moments, the procedure requires you to vote based on the best available intuition and record the uncertainty.

  Ultimately, this tool is designed to make your value judgments explicit rather than eliminating them. It will not save you from hard choices, but it will save you from making them unconsciously. When the procedure recommends prohibition but your intuition says permit, the override clause ensures you document why. When the procedure recommends permit but the public outcry is strong, the monitoring requirement ensures you have a mechanism to reverse course. The semantic degradation step is the most vulnerable to criticism because it relies on observable shifts that may be subtle, but it is necessary to translate the concept of corruption into something a legislature can understand. You can testify that you looked for changes in contracts and language, which is concrete, rather than testifying about the sanctity of the body, which is abstract. I urge you to test this procedure in your next monthly meeting with a low-stakes hypothetical before applying it to live proposals. You will likely find that the forty-five-minute window is tight, specifically during the semantic degradation discussion, so I recommend assigning one member to act as a timekeeper for that section. Be honest with the legislature that this tool highlights where evidence ends and values begin, and that your authority rests on your willingness to sign off on those value judgments publicly. This transparency is your best defense against accusations of elitism or abstract reasoning. I hope this serves your board well as you navigate these difficult waters, and I remain available should you need to refine the stopping rules after your initial trial.

  Sincerely,

  Your Consultant
