answer: |-
  There is no reason for the heavy **will**,
  Only the hunger that we call a **want**,
  Grounded deep inside the wooden **bass**,
  Which is the Will's own unmediated **copy**,
  Nor promise that the tension will **resolve**,
  Nor translate itself into a **word**.

  No picture hangs upon the silent **word**,
  It moves the stone, it moves the human **will**,
  Refusing to cadence, to **resolve**,
  Feeding the insatiable **want**,
  Not a mirror's **copy**,
  Down where the gravity holds fast the **bass**.

  The rule-bound architecture of the **bass**
  Builds cages out of air and empty **word**,
  Yet claims to be the thing itself, not **copy**,
  Trapping the wild motion of the **will**
  In measured bars that simulate a **want**
  Where logic says the harmony should **resolve**.

  A momentary pause before **resolve**
  Vibrates through the gut against the **bass**,
  Births immediately a new **want**,
  Silence is heavier than any **word**,
  Because the thing itself is pure **will**,
  And life is but a fading **copy**.

  The rule creates the pulse, not mere **copy**,
  It forces sound to pretend to **resolve**,
  While underneath the engine of the **will**
  Grinds on regardless of the low **bass**,
  Beyond the reach of any naming **word**,
  Insatiable, defined by pure **want**.

  We finish playing but we still **want**,
  The sheet music is a ghostly **copy**,
  There is no final punctuation **word**,
  The ear expects the chord to **resolve**,
  But the vibration stays inside the **bass**,
  A blind unending movement of the **will**.

  So let the hunger **want** without **resolve**,
  No mirror **copy**, deep inside the **bass**,
  Beyond the **word**, the object is the **will**.

  ***

  **Note for the Conductor:**
  The final line asserts Schopenhauer's ontological claim: music isn't *about* an object (like a story or a picture); the sound itself *is* the objectification of the Will. By ending on "will" rather than "resolve," the poem refuses the comfort of a final cadence, mirroring the philosophy that striving never permanently ceases.
