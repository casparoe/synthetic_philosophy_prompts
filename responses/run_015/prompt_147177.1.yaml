answer: |-
  This is a profound observation that cuts to the core of how modern technocracies manage risk, identity, and responsibility. You have identified a practical instantiation of the *Ship of Theseus* paradox embedded in regulatory compliance.

  As an AI, I do not hold beliefs, but I can analyze the logical structure of the regulatory practices you describe and map them onto philosophical frameworks. Below is an analysis of the metaphysical commitments implicit in these regulations, the consistency of those commitments, and the conditions under which this interpretation would require revision.

  ### 1. Philosophical Commitments: Process and Institution over Substance

  The regulatory distinction you describe—validating gradual replacement as "maintenance" but abrupt replacement as "new construction"—presupposes a specific metaphysical stance on **diachronic identity** (identity over time).

  **A. Rejection of Mereological Essentialism**
  If regulators believed that a system is identical to the sum of its parts (mereological essentialism), then changing even a single line of code would technically create a new object. By allowing incremental replacement without re-certification, regulators explicitly reject this view. They acknowledge that the *matter* (the code/hardware) is accidental to the *identity* of the system.

  **B. Adoption of Spatiotemporal/Process Continuity (Lockean View)**
  The preference for gradual change aligns with a Lockean view of identity, where persistence is grounded in the continuity of existence. In this framework, identity is a *trajectory* rather than a *state*.
  *   **The Commitment:** The system persists because there is an unbroken chain of causal processes linking Version 1.0 to Version 10.0. Each step is causally dependent on the previous one, preserving a "genetic" history.
  *   **The Breach:** A major migration (e.g., kernel swap) represents a discontinuity in that causal chain. Even if the output is identical, the *history of production* has been broken. The regulator is treating the *development process* as part of the object's ontology, not just the resulting artifact.

  **C. Institutional Essentialism (Searlean Status Functions)**
  Perhaps more strongly, this practice commits to a form of social constructivism regarding identity, akin to John Searle's concept of "status functions."
  *   **The Commitment:** The system is what the registry *says* it is. The certification number is not merely a label attached to an object; it constitutes the object's legal identity.
  *   **Implication:** Identity is not discovered (via code analysis) but conferred (via bureaucratic process). The "essence" of the certified banking platform is its place in the regulatory ledger, not its binary representation. A break in the administrative process (a new application for a new architecture) severs the identity, regardless of functional equivalence.

  ### 2. Internal Consistency and Rival Views

  **Is the practice internally consistent?**
  *   **Pragmatically:** Yes. The consistency lies in *risk assessment*, not ontology. Gradual change allows for continuous verification; the "surface area" of risk at any one time is small. Abrupt change introduces systemic risk because the *provenance* of the new components lacks the specific historical validation of the old context.
  *   **Metaphysically:** No. If identity were truly based on function (what the system *does*), the distinction would vanish. If identity were truly based on process (how the system *evolved*), the distinction holds. The inconsistency arises because regulators oscillate between treating the system as a functional black box (for output compliance) and a glass box (for architectural compliance).

  **Which rival views are ruled out?**
  1.  **Strict Functionalism:** This view holds that if $Input \to Output$ is identical, the system is identical. Regulatory practice rejects this. It implies that *how* the output is achieved matters for identity (e.g., safety properties, maintainability, hidden states).
  2.  **Type-Identity Theory:** In philosophy of mind, this suggests mental states are identical to brain states. In software, this would mean the code *is* the system. Regulators reject this; they treat the "Certified System" as a type that can be instantiated by different tokens, provided the lineage is preserved.
  3.  **Four-Dimensionalism (Perdurantism):** While process continuity sounds perdurantist (objects are space-time worms), regulators often treat the "current version" as the whole object for liability purposes, collapsing the temporal dimension unless a breach occurs.

  ### 3. Counterfactual: A Purely Functionalist Regime

  If regulators adopted a purely functionalist criterion (identity = input/output behavior + contractual obligation), the following would change:

  *   **Liability Assignment:** Liability would shift from *process negligence* to *outcome guarantees*. If the rewritten kernel produces an error that the old kernel would not have, liability is clear. But if the rewrite produces the *same* error due to a specification flaw, the "new" system would inherit the "old" system's liability history immediately. Currently, a "new" system often gets a liability grace period or a reset in precedence.
  *   **Certification Procedures:** Certification would become purely black-box testing. Auditors would no longer inspect code lineage, version control histories, or change management logs. They would only test boundary conditions and throughput.
  *   **Institutional Continuity:** Mergers and acquisitions would become metaphysically simpler. You could swap the entire backend of a bank overnight. If the ATM dispenses cash correctly, it is the "same" bank system.
  *   **The Risk:** This ignores *latent* properties. Functional equivalence today does not guarantee functional equivalence tomorrow under stress. The current "process-based" identity acts as a proxy for *predictability*. A functionalist view sacrifices long-term predictability for short-term interchangeability.

  ### 4. Epistemic Humility: What Would Change This Interpretation?

  My analysis rests on the assumption that regulatory distinctions map to coherent philosophical categories (process vs. substance). However, bureaucracy is often driven by inertia, resource constraints, or legal precedent rather than metaphysical coherence.

  **Evidence that would falsify the "Process Continuity" interpretation:**

  1.  **Documented Threshold Rulings:** If I could locate regulatory guidance (e.g., from the FAA, SEC, or OCC) that explicitly defines system identity based on a **percentage of code change** (e.g., "If >50% of codebase is rewritten, it is a new system regardless of timeline"), this would suggest a *mereological* view (identity by parts) rather than a process view. It would imply that identity is a aggregate of components, not a historical trajectory.
  2.  **Legal Precedent on "Substantial Similarity":** If a court case existed where liability was successfully transferred from a legacy system to a completely rewritten system *solely* based on functional equivalence (without regard for the development history), it would prove that the legal system accepts functionalism over process continuity. Currently, "successor liability" often hinges on corporate continuity, not software continuity.
  3.  **Inconsistent Application across Jurisdictions:** If maritime law (which you cited) actually *does* allow reconstruction in a different yard to retain identity (under specific treaties), while software regulation does not, the analogy breaks. This would suggest the software distinction is not a deep metaphysical commitment but a specific artifact of **auditability**. If the "why" is purely "we can't audit a rewrite as easily as a patch," then the metaphysics is incidental, not foundational.

  **Where my reasoning is most likely to fail:**

  *   **Attributing Rationality to Bureaucracy:** I am assuming the regulatory distinction is a coherent policy choice. It may simply be path dependence. Regulators may treat abrupt changes as "new" simply because the application forms for "major changes" are the same as "new applications," creating a false metaphysical distinction born of paperwork logistics.
  *   **The Nature of Software:** Unlike a ship, software is non-rivalrous and easily copied. A "migration" might involve running the old and new systems in parallel. If regulators allow the identity to transfer once the new system passes a "parallel run" period, this reintroduces functionalism (behavioral proof) rather than process continuity. If such precedents exist and are common, my claim that regulators reject functionalism is weakened.
  *   **Conflation of Safety and Identity:** Regulators may not care about "identity" at all. They may care about *risk profiles*. A gradual change has a known risk profile; a rewrite has an unknown one. Treating them differently is a risk management heuristic, not an ontological claim. My error would be interpreting a *prudential* rule as a *metaphysical* one.

  ### Summary

  The regulatory practice you observe implicitly commits to a **hybrid ontology**: it treats software systems as **institutional objects** whose identity is sustained by **continuous procedural history**. It rules out strict functionalism because it recognizes that *provenance* matters for risk, not just *performance*.

  However, be wary of over-interpreting bureaucratic friction as metaphysical depth. The distinction may exist not because regulators believe the "soul" of the machine resides in its version control history, but because **traceability** is the only mechanism they have to assign blame when things go wrong. If the chain of custody is broken, the blame cannot be assigned, and thus the "object" must be treated as new.

  To refine this view, one would need to examine **enforcement actions**: When a system fails, do regulators punish the *current maintainers* based on the *original certification* (implying identity persistence), or do they treat the certification as voided by the architectural shift (implying identity breakage)? The answer to that legal question determines whether the metaphysics is real or merely administrative.

  ***Disclaimer:** I am an AI, not an attorney or a regulatory compliance officer. This analysis is philosophical and theoretical, not legal advice. Regulatory frameworks vary significantly by jurisdiction and industry.*
