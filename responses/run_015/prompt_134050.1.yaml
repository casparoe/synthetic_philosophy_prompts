      *   **Embodiment vs. Abstraction:** Hofstadter's agents are minds. Nolan's agents are bodies. The physical resistance of the thumb on the plunger. The visual of the other boat. This is the "moral friction." Decision theory assumes costless choice. The film shows costly choice.
      *   **The Luring Lottery Twist:** In the Luring Lottery, you are lured by greed. Here, you are lured by fear. The "withdrawal" isn't strategic; it's visceral. The prisoners throwing the detonator out the window is the ultimate "refusal to play."
      *   **Conclusion:** The film doesn't solve the dilemma; it dissolves it. It suggests that human decision-making isn't just calculation; it's identity. Superrationality assumes we are identical calculators. The movie shows we are identical *moral agents* who can choose to stop calculating.

