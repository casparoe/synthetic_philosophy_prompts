prompt: |-
  I've been having this argument with my flatmate about whether constitutions ought to include lock-in provisions for long-term collective goals — think climate targets that future parliaments can't easily repeal. He calls it democratic self-binding, like Ulysses tying himself to the mast; I call it dead-hand control that treats voters in 2040 as subjects rather than sovereigns. Rather than keep shouting over dinner, we want an adversarial collaboration document, and I'd like you to draft it.

  Please write the joint statement between two camps. Camp one: intergenerational precommitment advocates who say constitutional climate lock-ins solve time-inconsistency problems across generations and protect the rights of future people. Camp two: living democracy advocates who say any entrenchment beyond normal amendment rules is illegitimate because it binds people who never consented, and risks freezing bad science or unfair burdens into law.

  We want a specific format: first a numbered list of claims both sides can sign, covering what Ulysses contracts actually do mechaniksally in constitutional design — entrenchment costs, sunset provisions, judicial review — not just the metaphor; then a disagreements table with each camp's view in wording they accept. The cruxes should include whether temporal discounting is a rational failure or a legitimate value shift, and whether there's a real distinction between binding yourself and binding strangers. For each crux, name a concrete institutional case both sides agree bears on it — perhaps a carbon-budget law with supermajority amendment rules, or a fiscal debt brake — and record each camp's advance prediction about what that case shows. Finally, include a residue report on whether any part of the fight was purely verbal, especially around words like sovereignty or consent. Keep it focused on institutional mechanics and predictions rather than a bibliography of philosophers. Write in British English, and don't worry if there's a small typo in my prompt — I wrote this quickly on my phone.
