answer: |-
  **JOINT STATEMENT ON CONSTITUTIONAL PRECOMMITMENT MECHANISMS**

  **Date:** 24 October 2023
  **Parties:** The Intergenerational Precommitment Camp (Camp 1) & The Living Democracy Camp (Camp 2)
  **Subject:** The legitimacy and mechanics of entrenching long-term collective goals (e.g., climate targets) against future legislative repeal.

  ### 1. Agreed Mechanical Claims

  Both camps affirm the following statements regarding the institutional mechanics of constitutional lock-ins. These claims describe *how* such provisions function, without endorsing their normative value.

  1.  **Entrenchment Costs:** Constitutional lock-ins function by raising the transaction costs of repeal. This is typically achieved through supermajority requirements, double-dissolution mechanisms, or mandatory referenda, making reversal possible but procedurally difficult.
  2.  **Judicialisation:** Entrenched goals shift enforcement authority from the legislature to the judiciary. Courts gain the power to review legislative compliance against the locked-in standard, altering the balance of powers.
  3.  **Sunset Provisions:** Mechanisms can be designed with mandatory expiration dates (sunsets) requiring positive re-authorisation. Both camps agree that sunsets reduce the 'dead-hand' effect but increase the risk of lapse during periods of political instability.
  4.  **Incentive Structures:** Lock-ins do not guarantee policy outcomes; they alter the incentive structure for future legislators. They make deviation politically costly rather than legally impossible, provided enforcement mechanisms remain functional.
  5.  **Amendment Distinction:** There is a mechanical distinction between ordinary legislation (simple majority, reversible) and constitutional entrenchment (heightened threshold, stable). Both camps agree that moving a goal from the former to the latter category changes its resilience to short-term electoral cycles.

  ### 2. Disagreements Table

  The following table outlines the substantive divergences between the camps. Each row identifies a crux, the respective positions, a concrete institutional case bearing on the issue, and the advance prediction each camp makes regarding that case.

  | Crux | Camp 1: Intergenerational Precommitment | Camp 2: Living Democracy | Institutional Case | Camp 1 Advance Prediction | Camp 2 Advance Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Temporal Discounting** | High discounting of future harms is a rational failure (myopia) that institutions must correct to ensure consistent welfare over time. | High discounting is a legitimate expression of current sovereign preference; present needs may rightly outweigh speculative future costs. | **Statutory Carbon Budget with Supermajority Amendment:** A law requiring net-zero by 2040, repealable only by a 2/3 parliamentary vote. | During an economic recession, the supermajority threshold will prevent repeal, successfully maintaining investment stability despite short-term pressure. | During an economic recession, the lock-in will trigger democratic backlash, leading to non-compliance or procedural workarounds that undermine rule of law. |
  | **Binding Self vs. Strangers** | The polity is a continuous entity across time; therefore, current voters are binding themselves (the state persists), not strangers. | The sovereign is the current electorate; future voters are distinct moral agents who cannot consent to past constraints, making this heteronomy. | **Constitutional Debt Brake:** A rule limiting structural deficit to 0.35% of GDP (e.g., Germany's *Schuldenbremse*), entrenched in basic law. | Over a 20-year horizon, the brake will prevent unsustainable borrowing, benefiting future citizens by preserving fiscal space for their priorities. | Over a 20-year horizon, the brake will prevent future parliaments from funding urgent, unforeseen priorities (e.g., adaptation, defence), forcing inefficient off-budget accounting. |
  | **Error Correction** | Entrenchment protects against transient majorities making irreversible errors (e.g., ecological tipping points) that cannot be undone later. | Entrenchment freezes current scientific or economic assumptions; if the locked-in pathway proves inefficient, correction is too costly. | **Independent Climate Council with Veto Power:** A technocratic body empowered to block legislation inconsistent with carbon budgets. | The Council will filter out short-termist lobbying, ensuring policy aligns with long-term physical constraints regardless of election results. | The Council will become a politicised bottleneck, enforcing outdated mitigation strategies while blocking necessary adaptation measures due to risk aversion. |

  ### 3. Residue Report: Verbal Disputes and Semantic Clarity

  Following our collaboration, we identify the following areas where disagreement appeared substantive but was partially driven by divergent definitions. Resolving these terms may narrow the practical gap between our positions.

  **A. Sovereignty**
  *   **The Dispute:** Camp 2 frequently invokes 'parliamentary sovereignty' to mean the absolute authority of the *current* legislature. Camp 1 invokes 'popular sovereignty' to mean the authority of the *people over time*.
  *   **Resolution:** We agree that if 'sovereignty' is defined as the instantaneous will of the current majority, lock-ins are illegitimate. If defined as the sustained will of the polity across generations, lock-ins are permissible. Much of our shouting stemmed from using the same word to describe different temporal units of analysis.

  **B. Consent**
  *   **The Dispute:** Camp 2 argues future voters cannot consent to lock-ins. Camp 1 argues consent is hypothetical or derived from continued residence and participation in the state.
  *   **Resolution:** We acknowledge this is not purely verbal but rests on a metaphysical disagreement about political identity. However, we agree to frame this mechanically: the dispute is not about 'consent' per se, but about the *threshold for exit*. Camp 2 requires a low exit threshold (simple majority); Camp 1 accepts a high exit threshold (supermajority). Framing it as 'exit costs' rather than 'consent' allows for empirical testing of which threshold produces better outcomes.

  **C. Rights of Future People**
  *   **The Dispute:** Camp 1 speaks of future 'rights' to a stable climate. Camp 2 argues rights cannot exist without a rights-bearer currently present to claim them.
  *   **Resolution:** We agree to substitute 'rights' with 'interests' for the purpose of institutional design. The mechanical question remains: ought current institutions weigh future interests heavily enough to restrict current action? This removes the ontological debate about future personhood and focuses on the weighting function in the legislative calculus.

  **Signed,**

  *The Intergenerational Precommitment Camp*
  *The Living Democracy Camp*
