  My verdict assumes a deflationary reading of Quine, where "no fact of the matter" is ontological, not epistemic. Some readers interpret Quine as a realist about neural states settling translation; I assume Quine's behaviorism precludes this settling semantic facts. I also assume the distinction between inscrutability and indeterminacy is crucial, though Quine sometimes blends them.

