  *The conflation:*
  The passage blurs four distinct theses. First, **Inscrutability of Reference**: the claim that terms like 'gavagai' cannot be uniquely mapped to objects (rabbits vs. stages). Second, **Indeterminacy of Translation**: the stronger claim that whole manuals of sentence translation can be empirically equivalent yet logically incompatible. Third, **Underdetermination of Theory**: the scientific principle that evidence never proves a theory uniquely, which Quine accepts but distinguishes from indeterminacy. Fourth, **Skepticism vs. Deflation**: the passage treats the lack of facts as an epistemic failure (we can't know), whereas Quine treats it as ontological deflation (there is nothing to know). Separating these clarifies that Quine's argument relies on behaviorism to move from underdetermination to indeterminacy. Science assumes facts beyond evidence; meaning does not. Once separated, the argument shows that while reference is inscrutable, communication succeeds because manuals save behavioral phenomena, not because they match mental facts.

  *My three checks:*
  (i) If a native learns English and says "we meant rabbit," Quine blocks this by arguing the English terms used to explain are themselves indeterminate. The native's assent to "rabbit" is just more behavior to be translated, subject to the same inscrutability. The argument depends on restricting evidence to publicly observable behavior; internal reports count only as more utterances, not privileged access to facts.
  (ii) If the argument applies within English, the claim "there is no fact of the matter" is indeed stated from inside a manual. Quine accepts this "immanence." It is not a fatal paradox but a feature of the view: we cannot step outside language to check it against reality. We speak from within our theory, acknowledging its indeterminacy relative to behavior.
  (iii) Scientists accept underdetermination without denying facts about electrons because scientific realism posits entities beyond evidence. Quine's behaviorism denies entities beyond behavior for meaning. The argument yields indeterminacy rather than ordinary underdetermination because Quine rejects the realist intuition for semantics. For electrons, we assume a fact of the matter; for meanings, we assume there is none.

  *My two cases:*
  Case A instantiates **Inscrutability of Reference**. It concerns the ontology of objects (canoes vs. planks). Case B instantiates **Indeterminacy of Translation**. It concerns the theoretical interpretation of sentences (spirits vs. metaphors). They are related but distinct: A is about terms, B is about holistic manual construction. Neither tie is breakable by behavioral evidence. Physical evidence (neural states) might break Case B if physicalism is true, but Quine argues semantic facts still do not exist even if neural facts do. Case A is unbreakable even by physics, as it concerns how we carve objects, not just neural firing. Thus, neither case admits a semantic fact of the matter, though Case B might admit a physical fact about brain states that correlates with one manual over another.

  *What survives of the pay-off:*
  Once corrected, "meaning is a myth" becomes "meaning is indeterminate." We retain the idea that there is no unique right manual, but we lose the nihilism that "nothing gets right." Manuals must still save the phenomena of behavior; some will fail pragmatically. The claim "any manual that works is as good as any other" survives only regarding empirical adequacy, not simplicity or utility. The corrected view is deflationary: it denies semantic facts exist, rather than claiming we cannot find them. It is a substantive thesis about the ontology of meaning, not merely an epistemic limitation. Communication works not because meanings match, but because behavior converges.

  *Replacement paragraph:*
  "Quine invites us to imagine a linguist encountering speakers of an unknown language. When a rabbit scurries past and a speaker says 'gavagai', the linguist notes the behavioral conditions for assent. She constructs a manual translating their speech into ours, matching patterns of stimulus and response. However, behavioral evidence alone cannot uniquely determine this manual. Multiple translations can fit all possible observations equally well, differing on whether 'gavagai' denotes rabbits, rabbit stages, or undetached parts. Quine argues this is not merely ignorance; there is no further fact of the matter about meaning beyond behavior. Meaning is not a hidden entity sentences possess, but a property we project when constructing manuals. This indeterminacy applies to English too: our own meanings are fixed only relative to a chosen manual. Thus, indeterminacy is not skepticism about other minds, but a denial that intentional facts exist independently of observable behavior."

