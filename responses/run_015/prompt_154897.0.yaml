answer: |-
  **Project Title:** Structural Indeterminacy: Resolving the Pasadena Paradox through Conditioning Rules

  **Project Summary**
  Expected Utility Theory (EUT) serves as the normative backbone of rational choice, yet it falters when faced with games possessing undefined expected values. The Pasadena Paradox presents a decision scenario where the expected utility sum converges conditionally but not absolutely, rendering the expectation undefined. This proposal investigates a specific variant of this problem: a decision scenario where conditioning on available information yields contradictory recommendations because the underlying expectation is undefined. The central research question is: *In such scenarios, is the resulting contradiction mathematical, epistemic, or normative?*

  Standard resolutions attempt to dissolve the paradox by rejecting the conditioning step, restricting the Principle of Total Evidence, or appealing to bounded rationality. This project argues that these approaches leave a critical gap: they avoid the contradiction without explaining its source. I propose treating the undefined expectation not as a technical glitch to be regularized, but as a structural feature revealing how decision rules should handle events of probability zero in continuous spaces. By formalizing a minimal model and comparing three conditioning rules (Standard Bayes, Jeffrey Conditioning, and Restricted Indifference), this project aims to establish a criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation.

  **Statement of the Problem**
  In the standard Pasadena game, a coin is tossed until heads appears. The payoff depends on the number of tosses $n$, arranged such that the series $\sum p_n x_n$ is not absolutely convergent. Consequently, the expected value depends on the order of summation. While existing literature focuses on the initial choice to play, this project focuses on the *updating* problem. Suppose an agent receives partial information about the outcome (e.g., the parity of $n$). Conditioning on this information can shift the "value" of the game arbitrarily depending on how the partition is defined, leading to contradictory recommendations (e.g., pay to switch vs. pay to stay) despite no new information regarding the physical probabilities.

  The precise question is whether this contradiction arises because the mathematics of infinite series breaks down (mathematical), because the agent lacks sufficient knowledge to specify a prior (epistemic), or because normative decision theory fails to prescribe an action in this domain (normative). Distinguishing these is vital. If mathematical, the paradox is a category error. If epistemic, better information resolves it. If normative, EUT requires revision.

  **Critique of Standard Resolutions**
  Current approaches fail to categorize the contradiction definitively.
  1.  **Rejecting the Conditioning Step:** Some argue that conditioning on partitions of infinite state spaces is impermissible when expectations are undefined. This leaves a gap: it offers no principled reason *why* conditioning is impermissible other than avoiding the contradiction. It renders the theory silent rather than resolving the conflict.
  2.  **Restricting the Principle of Total Evidence:** Others suggest agents should ignore specific partitions that trigger undefined expectations. This is ad hoc. It implies that acquiring relevant evidence is irrational, which contradicts the core tenets of Bayesian epistemology without providing a normative justification for the restriction.
  3.  **Appealing to Bounded Rationality:** This approach claims real agents cannot compute infinite series. While psychologically plausible, it sidesteps the normative question. The paradox challenges ideal rationality; appealing to cognitive limits changes the subject from what an agent *ought* to do to what they *can* do.

  All three resolutions patch the symptom (the contradiction) without diagnosing the cause (the structural nature of undefined expectations).

  **Proposed Approach and Methodology**
  I propose treating the undefined expectation as a structural feature analogous to the Borel-Kolmogorov paradox in continuous probability. In continuous spaces, conditioning on events of probability zero requires specifying a limiting process. Similarly, in the Pasadena scenario, the undefined expectation reveals that the decision rule lacks a specified limiting structure for the partition of the state space. The contradiction is not a glitch but a signal that the conditioning rule is under-specified.

  I will justify this structural interpretation against the obvious alternatives: declaring the game inadmissible or patching the expectation with an arbitrary truncated prior. Declaring inadmissibility is too strong, as similar structures appear in physical models (e.g., statistical mechanics). Truncating the prior imports arbitrary normative assumptions that beg the question by forcing convergence.

  **Method:**
  1.  **Formalization:** Construct a minimal model using standard probability theory. The model will represent the Pasadena scenario as a limit of finite games, explicitly defining the sigma-algebra of the information partitions.
  2.  **Comparative Analysis:** Apply three conditioning rules to the model:
      *   *Standard Bayes:* Conditioning via ratio of probabilities.
      *   *Jeffrey Conditioning:* Updating on uncertain evidence (probability shifts).
      *   *Restricted Indifference:* A rule imposing symmetry constraints on the partition to fix the limiting process.
  3.  **Evaluation:** Determine whether any rule avoids contradiction without importing normative assumptions that beg the question (e.g., assuming convergence to resolve non-convergence).

  **Success and Failure Criteria**
  **Success:** The project yields a clear criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation. For example, success might look like proving that Standard Bayes fails due to partition dependence, while Restricted Indifference succeeds by fixing the structural limit, thereby placing the Pasadena scenario determinately on the "inadmissible" side for standard EUT but "admissible" for a structurally enriched theory. This would classify the contradiction as *normative*, requiring a revision of conditioning rules.

  **Failure:** If all three rules either collapse into contradiction or depend on an arbitrary cutoff (e.g., a specific truncation point) to function, this will demonstrate that the paradox is genuinely unresolved rather than dissolved. This negative result is theoretically valuable: it would prove that the contradiction is *mathematical* in origin, implying that EUT cannot be extended to this domain without external regularization.

  **Timeline (One Semester)**
  *   **Month 1: Model Formalization.** Define the state space, probability measure, and payoff function. Rigorously map the analogy between the discrete Pasadena partitions and continuous measure-zero conditioning.
  *   **Month 2: Standard Bayes Analysis.** Apply standard conditional probability. Document the specific points of failure and partition dependence.
  *   **Month 3: Alternative Rules.** Apply Jeffrey Conditioning and Restricted Indifference. Analyze whether they stabilize the expectation without arbitrary truncation.
  *   **Month 4: Synthesis and Classification.** Compare results against success criteria. Determine the nature of the contradiction (Mathematical, Epistemic, or Normative).
  *   **Month 5: Writing and Dissemination.** Draft the final paper for the workshop. Prepare a presentation summarizing the criterion for admissible conditioning.

  **Broader Impact**
  This research clarifies the boundaries of Expected Utility Theory. By treating undefined expectations as structural features rather than errors, it offers a pathway to integrate decision theory with mathematical practices in physics and economics where infinite quantities frequently arise. The results will be of interest to philosophers of science concerned with the idealization of rational agents and the application of measure theory in normative contexts.

  **References**
  (To be added: Key positions on the Pasadena Game, Borel-Kolmogorov paradox literature, and recent debates on undefined expectations in decision theory.)
