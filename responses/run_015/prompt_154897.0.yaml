prompt: |-
  Write a short research proposal (about two pages, suitable for a philosophy-of-science workshop grant) on the Pasadena paradox and its connection to undefined expected values. State the precise question: in a decision scenario where conditioning on available information yields contradictory recommendations because the underlying expectation is undefined, is the contradiction mathematical, epistemic, or normative? Explain why the standard resolutions—rejecting the conditioning step, restricting the principle of total evidence, or appealing to bounded rationality—leave open exactly this gap.

  Propose an approach that treats the undefined expectation not as a technical glitch to be regularized away, but as a structural feature revealing how decision rules should handle events of probability zero in continuous spaces. Justify this structural interpretation against the obvious alternatives: either declaring the game inadmissible, or patching the expectation with an arbitrary truncated prior. Describe the method: formalize a minimal model using only standard probability theory, compare three conditioning rules (standard Bayes, Jeffrey conditioning, and a restricted version of the principle of indifference), and determine whether any avoids contradiction without importing normative assumptions that beg the question.

  Specify what success looks like: a clear criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation, with the Pasadena scenario falling determinately on one side. Specify failure: if all three rules either collapse into contradiction or depend on an arbitrary cutoff, showing the paradox is genuinely unresolved rather than dissolved. Provide a realistic one-semester timeline with monthly milestones. Do not include a bibliography or citation-based literature review; you may refer to positions and arguments by name, and note that references will be added later. Frame the proposal for a reader with general decision-theory background but no specialized knowledge of this particular paradox.
