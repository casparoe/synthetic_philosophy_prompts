answer: |-
  **JOINT STATEMENT ON THE EPISTEMOLOGY OF PSYCHIATRIC CLASSIFICATION**

  **Date:** October 14, 2026
  **Parties:** Camp V (Validator/Realist Working Group) and Camp L (Looping/Interactionist Working Group)
  **Subject:** Consensus, Residual Disagreement, and Procedural Recommendations following the Two-Year Adversarial Collaboration

  ### I. DEFINITIONS OF OPERATIONAL DEVICES

  To facilitate empirical adjudication of our theoretical differences, the undersigned parties define the following metrics and protocols for use in this statement and future research:

  1.  **Reactivity Quotient (RQ):** A metric estimating the causal influence of a diagnostic label on the prevalence of the phenomenon it denotes. It is calculated as the ratio of the category's incidence in a population where the label is publicly available, identity-available, and institutionally consequential ($I_{label}$), to its incidence in a population matched on symptom burden and help-seeking behavior where the label has never been available as a self-description ($I_{naive}$).
      *   Formula: $RQ = I_{label} / I_{naive}$.
      *   Interpretation: An RQ of 1.0 suggests the label tracks a static prevalence. An RQ > 1.0 suggests the label amplifies, creates, or reveals hidden prevalence.

  2.  **Self-Report Loading (SRL):** A structural metric of a diagnostic category's dependence on first-person phenomenology. It is calculated as the fraction of a category's necessary criteria that can *only* be ascertained from the patient's own verbal report, as opposed to observer-rated signs, biological markers, or administrative records.
      *   Formula: $SRL = N_{self-report} / N_{total\_criteria}$.
      *   Interpretation: High SRL categories are hypothesized by both camps to be more susceptible to linguistic and cultural drift.

  3.  **The Sealed-Derivation Protocol:** A methodological procedure to test the stability of a category's boundaries over time.
      *   Step A: Isolate archived clinical and phenotypic data collected *before* a specific diagnostic label entered public or professional discourse.
      *   Step B: Perform cluster analysis on this pre-label data to derive natural groupings without reference to the later label.
      *   Step C: Compare these pre-label clusters to the cluster defined by the criteria established *after* the label circulated.
      *   Interpretation: High concordance suggests the label captured a pre-existing structure (favors Camp V). Low concordance suggests the label shaped the structure (favors Camp L).

  ---

  ### II. AGREED CLAIMS

  The undersigned parties accept the following claims. These formulations are intended to be substantive; acceptance does not imply agreement on the underlying ontological mechanisms, but rather agreement on the empirical or logical constraints listed.

  1.  **Causal Efficacy of Classification:** Both camps accept that the act of psychiatric classification demonstrably affects a subset of the people classified. This effect includes changes in self-narrative, help-seeking behavior, social treatment, and access to resources.
  2.  **Validity and Reactivity:** Both camps accept that the fact of classification affecting the classified does not, by itself, establish that a category is unreal, invalid, or scientifically useless. A category can be causally potent (interactive) and still serve a predictive or explanatory function.
  3.  **Predictors of Loop-Proneness:** Both camps accept that specific structural features predict a category's susceptibility to looping effects. Specifically, categories with High Self-Report Loading (SRL > 0.6), high identity relevance, and high institutional consequence (e.g., disability eligibility) are empirically more prone to prevalence shifts and symptom drift than categories with low SRL and objective biomarkers.
  4.  **Looping and Tracking:** Both camps accept that heavy looping is compatible with the category still "tracking something." For Camp V, this means tracking a biological substrate that is expressed variably. For Camp L, this means tracking a stable pattern of distress or interaction, even if the specific phenomenology mutates. Neither camp asserts that high looping implies the category tracks *nothing*.
  5.  **The Distress/Impairment Clause:** Both camps accept that the inclusion of a distress-or-impairment clause in diagnostic criteria demonstrates that psychiatric kinds are value-laden. However, the camps agree that value-ladenness does not equate to arbitrariness. It indicates that the classification system is a hybrid of factual observation and normative judgment regarding human functioning.

  ---

  ### III. DISAGREEMENTS TABLE

  The following residual disputes remain unresolved. The "Verdict" column assesses whether the dispute is genuine (substantive difference in belief/worldview) or verbal (difference in definition masking agreement).

  | Issue | Camp V Formulation (Validator) | Camp L Formulation (Looping) | Verdict & Reason |
  | :--- | :--- | :--- | :--- |
  | **1. Nature of Convergent Validators** | Convergent validators (genetics, course, treatment response) reveal pre-existing natural structures. Convergence is evidence that the classification is carving nature at its joints, independent of the classification's existence. | Convergent validators may partly manufacture the structure they measure. Biological and longitudinal convergence can be the result of the classification homogenizing the population (e.g., via treatment selection or diagnostic gating). | **Genuine.** This is an ontological dispute regarding the direction of causality between the *concept* of the disorder and the *biology* of the disorder. |
  | **2. Meaning of Stability** | Stability of a category's criteria and prevalence across decades is evidence of validity. It suggests the category has successfully isolated a stable natural kind resistant to cultural fluctuation. | Stability across decades may evidence institutional reification rather than natural kind status. It shows the classification system has successfully standardized the looping effect, not that the underlying phenomenon is static. | **Genuine.** This is a dispute regarding the interpretation of historical evidence. Both agree stability exists; they disagree on what stability signifies. |
  | **3. Ultimate Purpose of Classification** | The primary aim of a classification system is *discovery*. It should aim to approximate the true underlying structure of psychopathology, even if current utility is compromised by the pursuit of truth. | The primary aim of a classification system is *utility within an interactive system*. It should aim to manage the feedback loops between classifier and classified, prioritizing ethical and social outcomes over ontological precision. | **Genuine.** This is a teleological dispute. One camp prioritizes epistemic accuracy; the other prioritizes systemic management. |
  | **4. Definition of "Real"** | A disorder is "real" if it exists mind-independently (i.e., would exist even if we had no concepts for it). | A disorder is "real" if it has causal powers in the social and biological world (i.e., it makes a difference, regardless of mind-independence). | **Verbal (with Genuine consequences).** The camps are using different definitions of "real." However, because these definitions drive different research priorities, the verbal dispute functions as a genuine practical divergence. |

  ---

  ### IV. CRUCES

  To move beyond theoretical stalemate, the undersigned parties identify the following empirical cruxes. For each, we specify the study or observation that would bear on the dispute, and we record our predictions *prior* to the outcome.

  **Crux 1: The Sealed-Derivation Test on Historical Categories**
  *   **Test:** Apply the Sealed-Derivation Protocol to a historical category with known high looping (e.g., *Hysteria* or early conceptualizations of *PTSD*). Compare pre-label clusters to post-label criteria.
  *   **Camp V Prediction:** We predict moderate-to-high concordance. Even if the label changed expression, the underlying liability distribution (e.g., trauma response, dissociation tendency) will cluster similarly in the pre-label data.
  *   **Camp L Prediction:** We predict low concordance. The pre-label data will show a diffuse distribution of symptoms that only coalesced into the specific diagnostic criteria *after* the label provided a script for patients and clinicians.
  *   **Significance:** High concordance supports the "discovery" model; low concordance supports the "interactive kind" model.

  **Crux 2: Manual Policy for High RQ / High SRL Categories**
  *   **Test:** A consensus panel is presented with a hypothetical category with RQ = 3.0 and SRL = 0.85. The panel must decide on inclusion status.
  *   **Camp V Prediction:** The manual should include the category but flag it for "further study." High RQ indicates high awareness, not necessarily invalidity. Exclusion prevents research into the underlying cause.
  *   **Camp L Prediction:** The manual should exclude the category from the main section or classify it as a "Socially-Responsive Syndrome." Inclusion validates the feedback loop and increases the RQ further, potentially harming the population by solidifying a transient identity.
  *   **Significance:** This tests whether the classification system prioritizes potential future validity (V) or current iatrogenic risk (L).

  **Crux 3: The Jurisdictional Split (PWDS Specific)**
  *   **Test:** Monitor two matched jurisdictions. Jurisdiction A introduces the PWDS label (screening, insurance codes). Jurisdiction B actively declines the label (treat symptoms, no code).
  *   **Camp V Prediction:** After 5 years, the underlying rate of *functional impairment* related to withdrawal/derealization will converge. Jurisdiction A will simply have better naming. The symptom profile will remain stable in both.
  *   **Camp L Prediction:** After 5 years, Jurisdiction A will show significantly higher prevalence and a more stereotyped symptom profile (matching the criteria) than Jurisdiction B. Jurisdiction B will show heterogeneous, fluid presentations of distress.
  *   **Significance:** Divergence confirms the label constitutes the syndrome; convergence confirms the label merely describes it.

  ---

  ### V. APPLICATION TO PROTRACTED WITHDRAWAL AND DERREALIZATION SYNDROME (PWDS)

  Based on the agreed claims and identified cruxes, the undersigned parties offer the following regarding the proposed inclusion of PWDS (adolescent-onset) in the upcoming classification manual.

  **1. Joint Recommendation to the Committee**
  Both camps recommend that PWDS **not be included as a fixed disorder** in the main diagnostic section at this time. Instead, it should be placed in a designated section for "Conditions Requiring Interactive Monitoring."
  *   **Reasoning:** The category exhibits High Self-Report Loading (7 of 8 criteria) and early indicators of a High Reactivity Quotient (prevalence tripling in 5 years post-identity formation).
  *   **Condition:** Inclusion in the monitoring section is contingent on the immediate initiation of the Sealed-Derivation Protocol using archived data from adolescent mental health surveys predating the online community's emergence.
  *   **Rationale:** Camp V accepts this because it allows for data collection to find validators without granting full ontological status. Camp L accepts this because it prevents institutional reification while acknowledging the distress is occurring.

  **2. Separate Predictions on Trajectory (If Included)**
  *   **Camp V Prediction:** If included, PWDS criteria will stabilize within two revision cycles. Genetic and neurocognitive validators will be identified that correlate with the self-reported symptoms, reducing the SRL over time. The RQ will settle near 1.0 as diagnostic awareness saturates.
  *   **Camp L Prediction:** If included, PWDS symptom profiles will narrow to match the criteria exactly (criterion creep), and prevalence will continue to rise disproportionately to general adolescent distress. The category will become a primary identity marker, making it difficult to distinguish the "disorder" from the "community."

  **3. Required Follow-Up Data (Regardless of Decision)**
  Both camps agree that the following data must be collected to resolve the epistemological status of PWDS:
  *   **Blinded Symptom Assessment:** Clinicians must assess adolescents for PWDS symptoms *without* using the label or asking about the identity community, to establish a baseline $I_{naive}$ for RQ calculation.
  *   **Longitudinal Identity Tracking:** Patients meeting criteria must be tracked for adoption of the PWDS label as a self-descriptor. Correlation between label adoption and symptom severity must be quantified.
  *   **Cross-Jurisdictional Comparison:** Prevalence and outcomes must be compared between regions where the label is clinically authorized versus regions where it is not, to test Crux 3.

  **Signed,**

  *Lead Representative, Camp V (Validators)*
  *Lead Representative, Camp L (Looping)*
