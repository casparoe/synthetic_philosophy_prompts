answer: |-
  This is a fascinating dataset. You and Maya are effectively running your own experimental philosophy study, and your friend is correct: Card 1 and its mirror are a famous pair of cases published by a philosopher named Joshua Knobe in 2003. In the literature, this is known as the "Knobe Effect" or the "Side-Effect Effect." It demonstrates that people's judgment of whether something was done *intentionally* depends heavily on whether the side effect is morally good or bad, not just on what the agent knew or wanted.

  Here is my analysis of Maya's psychology, my predictions for the new cards, and a proposal for how to settle the debate between your hypotheses.

  ### 1. Predictions for Card 5 and Card 6

  Based on her track record, here is my forecast for Maya's verdicts.

  **Card 5 (The Emergency Override)**
  *   **Prediction:** Maya will judge that the engineer did **not** duplicate the messages intentionally.
  *   **Reasoning:** You are currently stuck because Card 5 pulls in two directions. Procedurally, it looks like Card 3 (a binding rule was broken). Morally, it looks like the reverse of Card 1 (the outcome was justified/right).
      In Card 3, the junior developer broke a rule for a demo (a relatively selfish or trivial goal), and Maya called the harm intentional. In Card 5, the engineer breaks a rule to stop data loss (a morally urgent goal), and everyone agrees she "did the right thing."
      Maya's verdicts on Cards 1 and 4 show that moral valence (good vs. bad) is a primary switch for her. If the outcome is "good" or "justified," she tends to withhold the label "intentional," even if the agent foresaw it. Because the team agrees the action was correct, there is no blame to assign. Since she reserves "intentional" largely for things she wants to blame, she will likely let the procedural violation slide in favor of the moral justification.

  **Card 6 (The Battery Drain)**
  *   **Prediction:** Maya will judge that the engineer **did** degrade battery life intentionally.
  *   **Reasoning:** This card is the inverse of Card 5. Procedurally, it looks like Card 2 (permitted by policy, industry standard). Morally, however, Maya has already flagged it as "slimy."
      In Card 1, the CTO followed company goals (revenue) but harmed the environment, and Maya called it intentional. She did not care that he was "just doing his job." In Card 6, the engineer is "just doing her job" (following policy), but Maya perceives a moral harm (making phones worse for profit).
      Her hesitation on this card confirms she feels the tension. But to remain consistent with Card 1, the moral "badness" must trump the procedural "permission." If she says "not intentional" here, she undermines her verdict on Card 1 (where the CTO also followed revenue goals). To stay consistent, she must admit that doing something "slimy" makes the side effect intentional, even if the rulebook allows it.

  ---

  ### 2. The Competing Rules

  You proposed a "Blame Rule" and a "Rulebook Rule." Both are close, but to fully explain Cards 1 through 4, we need to refine them slightly. Specifically, your "Rulebook" hypothesis needs to account for the fact that the CTO in Card 1 didn't break a company rule, yet Maya still called it intentional.

  Here are the two strongest competing explanations for Maya's behavior:

  **Hypothesis A: The Accountability Principle (Your "Blame Rule")**
  *   **The Rule:** We label a side effect "intentional" primarily when we want to hold the agent morally responsible for a bad outcome. If the outcome is good, neutral, or justified, we treat the side effect as a mere accident or byproduct, even if it was foreseen.
  *   **How it fits the data:**
      *   *Card 1:* Harm is bad -> We want to blame -> Intentional.
      *   *Card 2:* Breakage is negligible/standard -> No blame needed -> Not Intentional.
      *   *Card 3:* Rule break caused harm -> Blame needed -> Intentional.
      *   *Card 4:* Speedup is good -> No blame needed -> Not Intentional.
  *   **Weakness:** It struggles to explain why we sometimes call *good* actions intentional (e.g., if someone saves a life on purpose). But in the specific context of *side effects*, Maya's data suggests she only uses "intentional" as a stick, not a carrot.

  **Hypothesis B: The Normative Deviation Principle (Your "Rulebook Rule" expanded)**
  *   **The Rule:** We label a side effect "intentional" when the agent deviates from a relevant norm. This norm can be a written company rule (Card 3) OR a moral expectation (Card 1). If the agent stays within the "acceptable path" (whether procedural or moral), the side effect is not intentional.
  *   **How it fits the data:**
      *   *Card 1:* Harming the environment violates a moral norm -> Deviation -> Intentional.
      *   *Card 2:* Breaking old scripts is standard practice -> No Deviation -> Not Intentional.
      *   *Card 3:* Skipping deployment approval violates a procedural norm -> Deviation -> Intentional.
      *   *Card 4:* Speeding up tests is within norms -> No Deviation -> Not Intentional.
  *   **Weakness:** It creates a conflict when norms clash. What happens when you violate a procedural norm to satisfy a moral norm (Card 5), or satisfy a procedural norm while violating a moral norm (Card 6)?

  **Which do I bet on?**
  I bet on **Hypothesis A (The Accountability Principle).**
  Why? Because Hypothesis B requires us to guess which "norm" is more important to Maya in a conflict. Hypothesis A is simpler: it looks at the final moral judgment. If Maya thinks the action was "the right thing" (Card 5), she won't blame, so she won't call it intentional. If she thinks it's "slimy" (Card 6), she will blame, so she will call it intentional. Her hesitation on Card 6 suggests her moral compass is fighting her policy manual; in Card 1, her moral compass won. I expect it to win here too.

  ---

  ### 3. The Tie-Breaker Card

  To definitively tell these rules apart, you need a scenario where **Accountability** and **Normative Deviation** point in opposite directions, without the "emergency" confusion of Card 5.

  You need a case where an agent **follows the rules perfectly** but produces a **blameworthy outcome**.

  **Card 7: The Mandatory Cut**
  > Leadership issues a new mandatory policy to cut costs. To comply, an engineer must remove a safety check from a legacy system. The engineer dislikes this but implements it exactly as specified in the policy. As a foreseen side effect, the system becomes slightly more prone to data corruption during peak loads. The engineer is following the rules perfectly, but the outcome is known to be harmful to customers.

  **Why this settles it:**
  *   **The Accountability Principle (Hypothesis A) predicts:** **Intentional.**
      *   *Reasoning:* The outcome is harmful and blameworthy ("slimy" like Card 6). Even though she followed orders, Maya's track record (Card 1) suggests that causing harm makes a side effect intentional. She blames the outcome, so she labels it intentional.
  *   **The Normative Deviation Principle (Hypothesis B) predicts:** **Not Intentional.**
      *   *Reasoning:* The engineer did not deviate from any norm. She followed the binding company policy exactly. She stayed within the "rulebook." Therefore, the side effect is just a byproduct of compliance, not an intentional act.

  **How to run it:**
  Present this card to Maya. If she says the engineer corrupted the data *intentionally*, she is driving by moral blame (Hypothesis A). If she says the engineer did *not* do it intentionally because she was "just following the new policy," she is driving by rule adherence (Hypothesis B).

  Given her reaction to Card 6 (calling it "slimy" despite policy permission), my money is on her saying **Intentional**. This would confirm that for Maya, "intentional" is a tool for assigning moral responsibility, not just a description of rule-following.
