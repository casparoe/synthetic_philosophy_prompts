answer: |-
  # Pass 1: Brainstorming

  **Cases to Account For:**
  *   **Kalenia:** Good EC reform + Bad term extension + Media capture + Clean election loss. Is it backsliding if they lose? Or is the damage structural regardless of the vote?
  *   **Marevia:** War shock + Emergency powers + Media closure + Elections held later. Metrics drop. Is crisis management backsliding? How to distinguish necessity from pretext?
  *   **Mandate:** 2/3 majority + Referendum + Abolishing checks. Popular sovereignty vs. Liberal safeguards. Can you vote away democracy?
  *   **Federation:** National degradation vs. Local improvement. Does the average matter? Or the worst state?
  *   **Mirror:** "Good" goals (breaking captured court) via "Bad" means (centralization). If we like the party, do we ignore the method?

  **Distinctions:**
  *   De jure (laws) vs. De facto (practice).
  *   Intent (strategy) vs. Effect (outcome).
  *   Temporary (emergency) vs. Permanent (entrenchment).
  *   Reversible (policy) vs. Irreversible (constitutional).
  *   Endogenous (government action) vs. Exogenous (war, pandemic).
  *   Central (national) vs. Subnational (federal).
  *   Overt (rigging) vs. Covert (harassment, tax audits).

  **Failure Modes:**
  *   **Concept Inflation:** Calling every policy dispute "backsliding."
  *   **Lagging Indicators:** Waiting until the election is rigged (too late to help).
  *   **False Positives:** Flagging Marevia during a war (abandoning partners in need).
  *   **Partisan Weaponization:** Only flagging governments we dislike (Mirror case failure).
  *   **Mind-Reading:** Requiring proof of intent (impossible to verify).
  *   **Legalism:** Ignoring informal norms (media capture without law changes).
  *   **The Ratchet:** Once labeled "backsliding," never labeled "recovering."

  **Tensions:**
  *   Sensitivity (fire early) vs. Specificity (don't cry wolf).
  *   Observability (evidence) vs. Attribution (intent).
  *   External Judgment (foundation board) vs. Internal Verdict (voters/courts).
  *   Neutrality (apply to friends) vs. Normativity (democracy is a specific value set).

  **Failure of Existing Tools:**
  *   Indices (V-Dem): Too slow, aggregate, lagging.
  *   Guardrails: Too formal, miss informal erosion.
  *   Mechanisms: Good for action, bad for holistic judgment.

  **The "Mirror" Problem:**
  *   If a government expands franchise but centralizes power, is it backsliding?
  *   If we say "no," we look partisan.
  *   If we say "yes," we punish democratization.
  *   Requires a baseline of *Liberal* Democracy, not just *Electoral*.

  **The "Marevia" Problem:**
  *   Requires a time-limit or sunset clause on emergency powers.
  *   Requires distinguishing "targeted" vs. "general" restrictions.

  **The "Kalenia" Problem:**
  *   Requires looking at *capacity to compete*, not just *election day*.
  *   Media capture matters even if election is clean (next time won't be).

  **Who Decides:**
  *   Domestic courts? (Maybe captured).
  *   Domestic voters? (Maybe misled or coerced).
  *   External observers? (Look imperialist).
  *   Hybrid? (External applying domestic evidence).

  **The "Drop" Candidate:**
  *   Can we really have Early Warning *and* Evidence?
  *   Can we really have Symmetry *and* Normative Clarity?
  *   Is "Backsliding" the right word? Or "Authoritarian Consolidation"?

  ***

  # Pass 2: Specification for Democratic Backsliding

  An adequate account of democratic backsliding for a foundation board must function as a tripwire, not a verdict on the final state of the regime. It must identify the *process* of erosion, not just the *outcome* of collapse. To be usable, it must satisfy five requirements. Each is motivated by a failure mode evident in your case materials.

  ### 1. The Entrenchment Requirement
  **Specification:** Measures must distinguish between temporary restrictions and permanent structural changes. A restriction on rights or powers must be coded as backsliding only if it lacks a credible sunset clause, is renewable by the executive alone, or is used to target specific political opponents rather than general security threats.
  **Motivating Case:** **Marevia.**
  **Failure Mode:** If this requirement is ignored, the account flags crisis management as authoritarianism. In Marevia, a war justifies temporary emergency powers. An account that treats all rights restrictions equally will force the board to suspend funding during a genuine existential threat, abandoning partners when they are most vulnerable. Without an entrenchment test, the concept cannot distinguish between a government saving the state and a government saving itself.

  ### 2. The Contestability Requirement
  **Specification:** Backsliding is present when the incumbent alters the rules of competition to create an asymmetric advantage that cannot be overcome by voter preference alone. This includes media capture, gerrymandering, or resource monopolization, regardless of whether the current election is "clean."
  **Motivating Case:** **Kalenia.**
  **Failure Mode:** If the account relies solely on election integrity (the "clean election" in Kalenia), it will return a false negative. The coalition extended the president's term and captured media. Even if they lost *this* election, the structural capacity for future fair competition was degraded. An account that ignores contestability waits until the election is rigged to act. By then, the foundation's partners are already illegal or imprisoned.

  ### 3. The Mechanism Observability Requirement
  **Specification:** The account must rely on observable actions (laws passed, owners changed, officials fired) rather than inferred intent. However, it must allow for the inference of strategy based on the *timing* and *targeting* of these actions (e.g., media bought immediately before an election cycle).
  **Motivating Case:** **The Mirror Case / General Intent.**
  **Failure Mode:** If the account requires proof of malicious intent, it becomes uncheckable. Governments will claim "efficiency" or "security" for every power grab. If the account ignores mechanism and looks only at outcomes, it cannot distinguish between a mandate (Mandate Case) and a coup. The board cannot read minds, but it can count the number of opposition-aligned outlets closed versus government-aligned ones. Ignoring observability makes the judgment look like a partisan opinion; ignoring mechanism makes it blind to strategy.

  ### 4. The Subnational Uniformity Requirement
  **Specification:** In federal systems, backsliding must be assessed at the level where the erosion is occurring. National averages are insufficient. If twelve states enfranchise voters but eight states purge rolls, the country is backsliding in the eight, and the foundation must assess risk accordingly.
  **Motivating Case:** **The Federation Case.**
  **Failure Mode:** If the account aggregates data nationally, it hides local authoritarianism. A government can point to democratization in friendly states to mask autocratization in opposition strongholds. For a foundation funding local groups, a national "green" light is useless if the local grantee is in a state that has effectively banned their operations.

  ### 5. The Normative Baseline Requirement
  **Specification:** The account must define backsliding as a movement away from *liberal democratic* norms (checks and balances, minority rights), not just *electoral* norms. However, it must acknowledge that breaking a *captured* institution is not backsliding.
  **Motivating Case:** **The Mandate Case / The Mirror Case.**
  **Failure Mode:** If the account is purely procedural (electoral-minimalist), it cannot flag the Mandate Case (abolishing court review via referendum) as backsliding. If the account is rigidly institutionalist, it flags the Mirror Case (breaking a captured court) as backsliding. The account must distinguish between *guardrails* and *obstacles*. Ignoring this turns the concept into a defense of the status quo, regardless of how undemocratic that status quo was.

  ### Addressing the Tensions and Questions

  **Desiderata vs. Preferences:**
  The demand for *election integrity* is an electoral-minimalist preference. The demand for *court independence* is a liberal-constitutionalist preference. An adequate account must treat the latter as a prerequisite for the former. Without independent adjudication of election disputes, the election itself is not a reliable metric. Therefore, liberal-constitutionalist demands are genuine desiderata for a concept intended to provide *early* warning. Minimalist accounts fire too late.

  **Joint Unsatisfiability:**
  There is a real tension between **Sensitivity** (Early Warning) and **Specificity** (Avoiding False Positives like Marevia). You cannot have both. To fire early (Kalenia media capture), you must accept that you will sometimes flag crisis measures (Marevia). To avoid flagging crisis measures, you must wait for entrenchment, by which time it is often too late.
  There is also a tension between **Intent** and **Observability**. We want to know if the government *means* to destroy democracy. We cannot know. We must infer intent from pattern. This creates a vulnerability to charges of bias. This tension is only dissolved by accepting that *patterned targeting* is the proxy for intent. If a government only audits opposition NGOs, the intent is observable in the effect.

  **The One-Way Ratchet:**
  The concept is structurally a ratchet. "Backsliding" implies direction. It is difficult to code "sliding forward" (democratization) with the same urgency. Consequently, the concept will almost always return a verdict of "yes" against incumbents and rarely "no."
  **Recommendation:** If the board cannot tolerate a ratchet, it should drop the umbrella term "Backsliding" and vote on a **List of Named Mechanisms** (e.g., "Suspension triggers: 1. Removal of EC commissioners without cause; 2. Acquisition of >50% of national media by allies..."). This removes the normative judgment of "direction" and focuses on specific actions. However, this loses the holistic view of Kalenia (where individual acts might be defensible, but the combination is not).

  **Who Decides:**
  An adequate account cannot leave attribution solely to domestic actors. In Kalenia, the opposition cried foul, but the government claimed reform. In the Mandate Case, the voters approved the change. Domestic verdicts are polarized. External observers must override domestic verdicts when domestic institutions (courts, EC) are compromised.
  **Cost:** This looks imperialist. It costs the foundation legitimacy in the eyes of the government. But the alternative is deferring to a captured court, which costs the foundation its mission. The board must accept the "imperialist" label as the cost of independence.

  **Hardest Requirement vs. Most Violated:**
  *   **Excludes the most accounts:** The **Mechanism Observability Requirement**. Most theoretical accounts rely on latent variables or expert surveys (V-Dem) that aggregate subjective judgments. Requiring observable, checkable mechanisms excludes most academic indices.
  *   **Violated by the board:** The **Normative Baseline Requirement**. Boards will quietly violate this by treating the *Mirror Case* as backsliding. When a government they dislike centralizes power, they will call it authoritarianism. When a government they like does it to break a captured court, they will call it "reform." This is the hypocrisy trap.

  **Which Requirement to Drop:**
  You should drop the **Sensitivity (Early Warning) Requirement**.
  You asked for a concept that "fires before the outcome is settled." You also asked for one that is "answerable to evidence rather than affiliation." These are incompatible in the Marevia scenario. To be evidence-based, you must wait for entrenchment. To be early, you must act on suspicion.
  For a foundation, the cost of a False Positive (suspending funding in Marevia during a war) is higher than the cost of a False Negative (continuing funding in Kalenia until the media capture is complete). Abandoning partners during a crisis destroys trust permanently. Funding them slightly longer while they are under pressure is a manageable risk.
  Shift the specification from "Early Warning" to "Confirmed Structural Change." Wait for the second term, or the second use of emergency powers. It is less glamorous, but it protects the board from the Marevia trap.

  ***

  # Closing Scorecard

  **Expert-Coded Indices (V-Dem, Freedom House):**
  *   *Performance:* Poor for this purpose.
  *   *Reason:* They are lagging indicators. They aggregate expert opinion, which takes time to coalesce. They often downgrade a country only after the democracy is already lost. They fail the **Sensitivity** test. They also obscure the specific mechanisms, making it hard to justify a suspension to donors without looking partisan.

  **Institutional Guardrail Accounts:**
  *   *Performance:* Mixed.
  *   *Reason:* Good at catching the **Mandate Case** (abolishing courts). Bad at catching informal erosion (Kalenia media capture). They are too legalistic. A government can backslide without changing a single law, simply by changing enforcement priorities. They fail the **Mechanism Observability** test regarding informal power.

  **Mechanism-Based Accounts (Media Capture, EC Capture):**
  *   *Performance:* Best for actionability.
  *   *Reason:* Directly maps to the foundation's grant portfolio. If you fund media litigation, media capture is your trigger. It satisfies **Observability**. However, it risks missing the forest for the trees (Federation Case) and requires a list of triggers rather than a holistic concept. It avoids the **Ratchet** problem if framed as "Risk Indicators" rather than "Backsliding."

  **Recommendation:** Adopt a **Mechanism-Based Account** with an **Entrenchment Filter**. Do not use the word "Backsliding." Use "Structural Risk Thresholds." List the specific actions (e.g., "Change to EC composition," "Acquisition of 3+ major outlets"). Require that two or more occur within one electoral cycle, or that one occurs without a sunset clause. This satisfies the need for evidence, avoids the Marevia trap (single emergency measure doesn't trigger), and reduces the partisan appearance (the list applies to everyone). It sacrifices the holistic "vibe" of backsliding for the defensibility of a checklist.
