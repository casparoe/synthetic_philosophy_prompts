answer: |-
  ### Part 1: Quick Brainstorm on Thesis Weaknesses

  Before we get to the Q&A, here is the cold assessment of where your armor has gaps.

  1.  **The "Homunculus" Regress:** If temporal parts bargain, who organizes the bargaining? If there is a "negotiator" self overseeing the deal between Present-You and Future-You, isn't *that* the unitary self you're trying to deny? If not, the bargaining mechanism lacks an enforcer.
  2.  **Rationality vs. Welfare:** You are defining "rational" as "strategically optimal given constraints." The behavioral economists define it as "maximizing global utility." You are talking past each other unless you explicitly distinguish *local strategic rationality* from *global welfare rationality*.
  3.  **The Collapse of Responsibility:** If akrasia is just a failed deal between partners, who is to blame? If the future self reneges, can the present self be held morally responsible? Virtue ethicists will smell moral evasion here.
  4.  **The "Unreliable Partner" Paradox:** If the future self is known to be unreliable (hence the high discount rate), why would they ever agree to the bargain? If they are unreliable, they will lie during the negotiation. This leads to a breakdown of trust that makes *any* agency impossible, not just akratic agency.
  5.  **Normative Authority:** Why should the present self's "reservation price" bind the future self morally? Hyperbolic discounting might be *predictable*, but calling it a *rational reservation price* risks legitimizing impulsivity as a contractual right.

  ***

  ### Part 2: Q&A Prep Sheet

  **Strategy:** You are framing agency as a *political* achievement rather than a *metaphysical* given. Your goal is to show that "unity" is the *result* of successful bargaining, not the *precondition* for it.

  #### Objection 1: The Metaphysical Clarification (The Grad Student)
  **Phrasing:** "Professor, I'm struggling with the authority structure here. On Frankfurt's view, we identify with certain desires through second-order volitions. In your model, is the 'bargain' itself just another first-order desire of the present temporal part? If so, what gives it normative authority over the future part? It seems like you've replaced hierarchy with anarchy."
  **Damage Rating:** Low (Metaphysical nitpick, doesn't kill the practical claim).
  **Two-Minute Reply:** "Great question. I'm not replacing hierarchy with anarchy; I'm replacing *authority* with *power*. Frankfurt asks, 'Which desire has the right to rule?' I'm asking, 'Which desire has the leverage to enforce?' The 'authority' of the bargain isn't magical; it's the shadow of the future. If the present self doesn't honor the deal (e.g., by setting up commitment devices), the future self learns not to trust the plan. The normative force comes from the stability of the equilibrium, not a higher-order metaphysical stamp."
  **Soft Spot:** You are sidestepping the *normative* "ought." Stability isn't morality. If a stable equilibrium is abusive (e.g., addiction), your model calls it a "successful bargain."
  **Prep Note:** If they press on "ought," concede that your model describes *structural rationality*, not necessarily *moral* rationality.

  #### Objection 2: The Character Attack (The Virtue Ethicists)
  **Phrasing:** "This fragmentation of the self seems to dissolve the very possibility of *phronesis* (practical wisdom). If there is no unitary agent to cultivate habits, how can we speak of vice or virtue? You're describing a civil war, not a person. If I succumb to akrasia, on your view, I haven't failed as a moral agent; I've just had a bad negotiation with a partner I can't control. That sounds like an excuse, not an explanation."
  **Damage Rating:** High (This is the majority of the room; they need to feel you aren't erasing morality).
  **Two-Minute Reply:** "I'm not erasing morality; I'm relocating it. On the unitary view, akrasia is a mystery: 'How could I know the good and not do it?' On my view, it's a political failure. Virtue isn't a pre-existing state; it's the *institutional capacity* to bind your future selves. A virtuous person isn't someone whose parts never fight; it's someone whose internal treaties hold. So, you are still responsible—not because you are a simple substance, but because you are the current administrator of a fragile coalition. Failing to maintain that coalition *is* the vice."
  **Soft Spot:** If they argue that "responsibility requires a single subject of experience," you have no empirical comeback. You must stand on the pragmatic utility of your model.
  **Prep Note:** Use the word "stewardship." It appeals to VE sensibilities. You are a steward of the future parts.

  #### Objection 3: The Definition of Rationality (The Behavioral Economists)
  **Phrasing:** "We have data showing hyperbolic discounting leads to systematically worse life outcomes—poor health, debt, addiction. You're calling this a 'rational reservation price.' That's semantic gymnastics. If the discounting leads to dynamic inconsistency and welfare loss, it's a computational error. Why label a bug a feature?"
  **Damage Rating:** Critical (This undermines your core decision-theoretic claim).
  **Two-Minute Reply:** "It's not gymnastics; it's game theory. In a repeated game with an unreliable partner, demanding a high immediate return *is* the rational move. If I know my future self will defect on my diet plan, it is instrumentally rational for my present self to value the cake *now* at a higher rate, because the 'future health' payoff is effectively risky. I'm not saying the *outcome* is optimal. I'm saying the *strategy* is rational given the constraint of non-binding contracts. You treat the self as a firm with enforceable contracts; I treat it as a coalition of sovereign states."
  **Soft Spot:** They will hit you on "Welfare." If the agent *themselves* regrets the discounting later, it's hard to call it rational.
  **Prep Note:** Concede that it is "locally rational but globally suboptimal." Do not fight them on welfare metrics.

  #### Objection 4: The Enforcement Problem (Combined Attack)
  **Phrasing:** "If the future self is unreliable, why would they ever agree to the present self's terms? And if they don't agree, how is this bargaining? It sounds like the present self is just dictating terms to a hostage."
  **Damage Rating:** Medium (Threatens the mechanism).
  **Two-Minute Reply:** "It is coercion, often. But it's *self*-coercion, which is the only kind available. We use commitment devices—locking the credit card, buying smaller plates. These are the 'treaties.' The future self 'agrees' only in the sense that they lack the capacity to violate the terms without high cost. The bargaining happens *ex ante* when the present self sets the constraints."
  **Soft Spot:** If the future self finds a loophole (and they always do), the model predicts total collapse.
  **Prep Note:** Emphasize that breakdowns (akrasia) are the *expected* result of weak enforcement, not a mystery.

  ***

  ### Part 3: Strategic Concessions (Say These Upfront)

  To disarm the room, open your Q&A by conceding these two points. It makes you look reasonable and protects the core thesis.

  1.  **Concede on Welfare:** "I am not arguing that hyperbolic discounting leads to the best life outcomes. The Behavioral Economists are right that it often reduces global welfare. My claim is narrower: it is a rational *response* to the structural inability to bind future actions."
  2.  **Concede on Unity:** "I am not denying that we *experience* ourselves as unitary. I am arguing that this unity is a fragile construction, not a metaphysical bedrock. When the construction fails, we call it akrasia."

  ***

  ### Part 4: The Nightmare Question

  **The Question:** "If agency is just a negotiation between temporal parts, and the future self is deemed 'unreliable' or 'hostile' to the present self's interests... does your framework make suicide or self-harm rational? If the future partner is toxic, isn't liquidating the firm the most rational bargaining move?"

  **Why it's dangerous:** It takes your "temporal parts as partners" metaphor to its logical, ethical conclusion. If the future self is just *another guy* who is going to ruin your life, terminating the contract looks like a valid business decision.

  **Your Prep for this Question:**
  *   **Do not** say "Suicide is always irrational." (Inconsistent with your model).
  *   **Do not** say "I haven't thought about that." (Amateur hour).
  *   **The Line to Walk:** You must distinguish between *ending a partnership* and *destroying the capacity for partnership*.

  **Draft Reply:**
  "That is the sharpest possible application of the model, and I appreciate it. Here is the limit: The 'bargaining' model presupposes the possibility of *future* bargaining. Suicide doesn't just terminate a bad deal; it destroys the table where deals are made. Even if the future self is unreliable, the *capacity* for renegotiation is the only source of value in the model.
  However, I will concede this: On my view, self-harm isn't a 'sin' against a unitary self; it's a desperate enforcement mechanism. It's the present self punishing the future self to restore leverage. That makes it tragic, not necessarily 'irrational' in the game-theoretic sense, but it is ultimately self-defeating because it ends the game. So, is it rational? It's a rational move in a game you are choosing to stop playing. But it validates the model only by destroying the agent."

  **Soft Spot:** This is still very dark. If they press, "So you aren't condemning it?", you need to pivot to *clinical* irrationality (depression alters the discount rate itself) rather than *strategic* irrationality.

  **Final Advice:** Keep your cool. The VEs want to save the soul; the BEs want to save the utility function. You are selling them a political science of the self. Stay in that lane. Good luck on Tuesday.
