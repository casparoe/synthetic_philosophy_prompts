      *   *Concessions:* Admit that *some* unity is needed for the concept of "bargaining" to make sense (you need two parties, but they must belong to the same 'firm'). Admit hyperbolic discounting often leads to suboptimal outcomes, even if strategically rational.

  6.  **Final Review against Constraints:**
