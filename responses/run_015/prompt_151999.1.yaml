prompt: |-
  You are a professional philosopher who also knows how measurement actually works in practice — someone who's read the literature on indicators, incentives and social epistemology, and who has also been in the room when a target gets set. Take your time with this one and think carefully: before you write any procedure, spend a few hundred words brainstorming on what actually goes wrong when a number stops being used to find something out and starts being used to hold someone to account, and only then commit to an answer. I'd rather have you reason first than produce something tidy. And please write the whole thing in British English.

  Some background so you know where I'm coming from. I'm 71 and retired; I spent about thirty-five years as a field biologist, freshwater invertebrates mostly, and then a lot of years on survey design, which is how I first started thinking about this. Since retiring I've got into philosophy properly, going through things on my own, and I ended up on the board of a small wildlife trust. We manage maybe 900 hectares across a handful of sites, a tiny staff, and a lot of volunteers who do most of the recording. Our board meets quarterly, we set targets once a year in a half-day workshop, and whatever we come up with has to be signed off by trustees who are mostly not technical and have about two hours of patience. We have spreadsheets and no statistician. Every number we produce is produced by the same volunteers whose behaviour the number is meant to change, which I think is the actual crux of our problem and possibly the thing that makes our situation different from the standard textbook case.

  What I want from you is a decision procedure my board could actually run on a proposed target, before we adopt it, to work out whether the number is going to get gamed and what to do about it. Concretely: the questions to ask in order; what counts as a sufficient answer to each question given that we have no statistician and a couple of hours; the point at which the procedure says stop, don't adopt this as a target at all; and the point at which it has to hand the decision to a person because the remaining question is about values rather than facts. Please also include a redesign step — how to respecify a target that fails, rather than only a veto — and be explicit about which of your steps are real checks and which are judgement dressed up as procedure.

  I've been muddling towards some distinctions of my own and I'd like you to use them or tell me which of them are muddled and should be dropped:

  - the cheap-move test: could a competent insider move the number in an afternoon without changing anything about the thing we care about?
  - audit surface: how visible the production of the number is to us, and how few people it depends on. I suspect a narrow audit surface is the real predictor and that a lot of the rest is downstream of it.
  - cliff versus slope: whether the target is a threshold or a continuous gradient. I think thresholds concentrate effort at the margin and also concentrate dishonesty at the margin.
  - orthogonal anchor: is there any second number that is correlated with what we want but hard for the people being measured to influence? If there isn't, I think we're stuck.
  - shape-watching rather than level-watching: looking at the distribution of the underlying records — suspicious heaping just past the line, oddly round numbers, variance collapsing — rather than at the headline figure.
  - proxy drift: cases where the number comes apart from the thing not because anyone responded to it but because the world moved underneath it. My instinct is that this is a genuinely different failure from gaming and needs a different fix, but I'm not confident, and I'd like you to say if the two really come apart or if it's one phenomenon with two stories about it.
  - spec churn: how often you can change the definition before everyone stops believing the number means anything. I worry that the obvious anti-gaming move, which is to keep re-specifying, has a cost I never see discussed.

  Then run the procedure on three of our actual cases.

  1. A payments-for-results scheme we're considering: landowners get paid per confirmed breeding pair of a target wader on their land, confirmed by a photograph with a date and a grid reference. The money is real and the landowners are not hostile, they're just busy.

  2. Our headline "species richness" figure: the number of species recorded on a site in a year, compiled largely by volunteers, published in the annual report, and — this is the part I'm uneasy about — used to decide how next year's volunteer budget is split between sites.

  3. The one I'll dislike: "hectares of habitat under favourable management", which is the number we report to our main funder. I invented it about fifteen years ago, it's the thing I'm known for locally, and my strong prior is that it's fine. Please apply the procedure to it honestly rather than flattering me, and if the procedure says it's the worst of the three, say so and say what I'd have to give up to fix it.

  Two more things. First, tell me where the Goodhart framing is the wrong frame altogether — where "when a measure becomes a target it stops measuring the thing" is not what's happening, including the awkward case where gaming and doing the actual thing coincide, so that the cheapest way to move the number just is to do the work. Second, tell me what the procedure cannot do: what it will never tell us, and where we should just accept a bad-but-cheap number and stop worrying.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Professional philosopher with practical knowledge of measurement, incentives, and social epistemology. Experienced in setting targets.
      *   **Tone/Style:** British English. Thoughtful, reasoning first (hundreds of words brainstorming) before the procedure. No tidy shortcuts.
      *   **User Background:** 71, retired field biologist (freshwater invertebrates), survey design expert, wildlife trust board member. Small org (900ha, tiny staff, many volunteers). Board meets quarterly, targets set annually (half-day), trustees non-technical (2 hours patience). No statistician. Volunteers produce the numbers *and* are measured by them.
      *   **Task:** Create a decision procedure for the board to evaluate proposed targets (check for gaming, redesign, veto points, value judgement handoff).
      *   **User's Distinctions:** Evaluate and use/drop: cheap-move test, audit surface, cliff vs. slope, orthogonal anchor, shape-watching vs. level-watching, proxy drift, spec churn.
      *   **Case Studies:** Run the procedure on three specific cases (Payments-for-results wader scheme, Species richness budget allocation, Hectares of favourable management).
      *   **Additional Requirements:** Identify where Goodhart's Law is the wrong frame. Identify what the procedure *cannot* do (limitations).

  2.  **Brainstorming & Reasoning (The "Philosopher in the Room" Phase):**

      *   *Core Tension:* The user identifies the crux: volunteers produce the data *and* are measured by it. This collapses the observer/observed distinction found in standard principal-agent problems. It's more like a community of practice turning into a performance management system.
      *   *Goodhart's Law Nuance:* "When a measure becomes a target, it ceases to be a good measure." But why? Usually, it's about *divergence*. The metric decouples from the goal. But in the user's context, the "goal" is often pro-social (conservation). If the metric drives good behaviour, is it still Goodhart's Law? No, that's alignment. The failure mode is *substitution* (doing the easy thing that looks like the hard thing).
      *   *The "Volunteer" Factor:* Volunteers are motivated by intrinsic rewards (nature, contribution). Introducing extrinsic rewards (budget allocation, status) can crowd out intrinsic motivation (Self-Determination Theory). If a volunteer feels their recording is being audited for budget purposes, they might stop recording or record selectively.
      *   *Audit Surface:* The user's intuition is strong here. If only one person compiles the spreadsheet, the audit surface is tiny. If everyone records, it's huge but diffuse. In small trusts, "everyone knows everyone." Social pressure is the real audit mechanism, not statistical forensics.
      *   *Proxy Drift vs. Gaming:* Crucial distinction. Gaming is *agency* (someone changed the number). Drift is *entropy* (the world changed). A target needs to be robust against both, but the fixes differ. Drift needs recalibration; gaming needs incentive restructuring.
      *   *Spec Churn:* Changing definitions too often destroys trust. In a volunteer org, trust is the currency. If the goalposts move, volunteers feel their past effort was devalued.
      *   *The "Two Hours of Patience":* The procedure must be conversational, not mathematical. It needs to fit into a board workshop context.
      *   *Values vs. Facts:* At some point, risk acceptance is a value judgement. "Is it worth the risk of gaming to get the clarity of a target?" That's not a fact a procedure can decide.

  3.  **Evaluating User's Distinctions:**

      *   *Cheap-move test:* Excellent. Practical heuristic. Keep.
      *   *Audit surface:* Very insightful for small orgs. Keep, but refine for "social audit" vs "data audit."
      *   *Cliff vs. Slope:* Standard economics, but vital. Thresholds create cliffs. Keep.
      *   *Orthogonal anchor:* Hard to find in small orgs. Might be too demanding. Keep as an ideal, but warn it's rare.
      *   *Shape-watching:* Requires statistical literacy. Might be too hard for trustees. Simplify to "anecdote check."
      *   *Proxy drift:* Vital distinction. Keep.
      *   *Spec churn:* Vital for trust. Keep.

  4.  **Drafting the Procedure (The "Decision Protocol"):**

      *   Needs to be step-by-step.
      *   Needs stop/go criteria.
      *   Needs a redesign loop.
      *   Needs a "Values Handoff" point.
      *   Language: British English (organisation, programme, centre, etc.).

  5.  **Running the Case Studies:**

      *   *Case 1 (Wader Payments):* High risk of gaming (photos can be faked/reused), but high stakes (money). Audit surface is narrow (who checks photos?). Orthogonal anchor? Maybe independent survey.
      *   *Case 2 (Species Richness/Budget):* Classic Goodhart. Volunteers will record easy species to boost numbers. Budget allocation creates competition between sites. High risk of volunteer demotivation.
      *   *Case 3 (Hectares Managed):* The user's baby. Likely robust *if* "favourable management" is well-defined. But if "favourable" is subjective, it's a paper tiger. Risk of "paper management" (plan exists, work doesn't).

  6.  **Addressing the "Goodhart is Wrong" & "Limitations" Sections:**

      *   *Goodhart is Wrong:* When the metric *is* the work (e.g., hectares mowed). When alignment is perfect. When the act of measuring improves the thing (Hawthorne effect, but positive).
      *   *Limitations:* It can't guarantee honesty. It can't fix a broken culture. It can't replace judgement. Sometimes a bad number is better than no number for communication.

  7.  **Refining the Tone:**

      *   Respectful of the user's experience (35 years field bio).
      *   Philosophical but grounded (no airy-fairy abstraction).
      *   British English spelling and idiom.
      *   Acknowledge the emotional weight of Case 3.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I spend enough words brainstorming at the start? *Adjustment:* Ensure the opening section is substantial and reflective.
      *   *Check:* Did I address the volunteer/data-producer overlap? *Adjustment:* Make sure the procedure explicitly asks about who collects the data.
      *   *Check:* Is the procedure usable in 2 hours? *Adjustment:* Keep steps concise, avoid jargon.
      *   *Check:* Did I use the user's distinctions? *Adjustment:* Explicitly reference them in the procedure and case studies.
      *   *Check:* Case 3 honesty. *Adjustment:* Be firm. If "favourable" is vague, it's vulnerable.

  9.  **Final Polish:**

      *   Ensure "organisation", "programme", "centre" spellings.
      *   Check that the "Values Handoff" is clear.
      *   Verify the "Redesign" step offers concrete alternatives, not just "don't do it."

  *(Self-Correction on the "Brainstorming" constraint)*: The prompt asks me to "spend a few hundred words brainstorming... before you write any procedure". I need to make sure this is a distinct section at the very beginning.

  *(Self-Correction on "British English")*: Ensure I use "s" instead of "z" in organisation/standardise, "programme" instead of "program", "centre" instead of "center". Also idioms like "quid pro quo", "kick up the touchline", etc., if appropriate, but keep it professional.

  *(Self-Correction on Case 3)*: The user says "The one I'll dislike... my strong prior is that it's fine." I need to be gentle but rigorous. If the procedure flags it, I must explain *why* without attacking the user's legacy.

  *(Final Plan)*:
  1.  **Preamble/Brainstorming:** The philosophy of measurement in a volunteer context.
  2.  **Evaluation of User's Distinctions:** Which to keep, tweak, or drop.
  3.  **The Decision Procedure:** The step-by-step guide.
  4.  **Case Studies:** Applying the procedure.
  5.  **Goodhart Limitations:** Where the frame fails.
  6.  **Procedural Limitations:** What this can't solve.

