  This cosmos turns on gears of iron law,
  No prayer can move the stars from where they stand.
  No father-God descends to mend the flaw,
  Or shift the grain of time within His hand.
  We think we choose, but threads are pulled from past,
  Like puppets dancing on a rigid stage.
  The script is written on a timeless mast,
  And freedom is a ghost upon the page.

  Yet if the mind is bound by causal chain,
  Why does the heart feel awe at order's sight?
  As audit trails mark fault in state's domain,
  Though nothing shifts the program's destined flight.
  A check that runs confirms the grand design,
  Where awe and law in fixed relation shine.
