answer: |-
  Good morning. Look, we've got a room split down the middle. Half of you speak logical empiricism, half of you speak municipal code. But you're actually staring at the same fracture line.

  Here's the uncomfortable truth: When a resident screams about a zoning variance, they think they're arguing about setbacks or density caps. They think this is an internal question—like checking if a move is legal in chess. They expect us, the planners, to be the referees holding the rulebook. They want us to say, "Yes, the math checks out," or "No, you're over the limit."

  But Carnap saw this coming decades ago. Most of what we treat as internal technical disputes are actually external framework choices. We aren't just applying rules; we're choosing which game to play. Do we value property stability over housing supply? Do we prioritize car flow or pedestrian safety? That's not a technical calculation found in the data. It's an external value judgment dressed up in engineering clothes.

  Here's where the authority collapses. As long as citizens believe we're just solving internal puzzles, they trust the expertise. The moment they realize the framework itself was a political choice—that the "rules" were selected to favor certain outcomes over others—the referee loses legitimacy. They realize we aren't just counting pieces; we designed the board. And once they know we designed the board, they stop asking for a ruling and start demanding a new game.

  So, my challenge for this workshop is simple: Stop hiding the external choices behind internal jargon. If we want durable planning, we need to justify the framework, not just the move. We need to admit that zoning isn't physics. It's ethics with a map. If we don't own that distinction, the public will tear the map apart.

  Thanks.

  ***

  ### Brainstormed Angles on Carnap's Distinction for Planning Justification

  **1. Legitimacy via Transparency (The "Designed Board" Angle)**
  *   **Concept:** Currently, planners derive authority from the perception of technical neutrality (internal).
  *   **Shift:** Acknowledge that the zoning code itself is an external choice.
  *   **Result:** Short-term instability (citizens question the rules) leads to long-term trust (citizens understand the values driving the rules). Authority shifts from "we know best" to "we chose this together."

  **2. Dispute Reframing (The "Value vs. Fact" Angle)**
  *   **Concept:** Public hearings often stall because citizens argue facts (traffic counts) when they mean values (neighborhood character).
  *   **Shift:** Use the distinction to categorize objections. Is this an internal error (wrong math) or an external objection (wrong priority)?
  *   **Result:** Prevents talking past each other. Planners can say, "Technically, this fits the code (internal), but the code itself prioritizes X over Y (external). Do you want to change the priority?"

  **3. Role Redefinition (The "Facilitator" Angle)**
  *   **Concept:** Planners currently act as arbiters of compliance.
  *   **Shift:** Planners become facilitators of framework selection.
  *   **Result:** Reduces the burden on planners to be "oracle-like." Their expertise is used to explain the consequences of different external frameworks (e.g., "If we choose framework A, you get stability; if B, you get affordability") rather than defending one framework as objectively true.
