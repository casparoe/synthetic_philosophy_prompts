answer: |-
  **MEMORANDUM**

  **TO:** Student Services and Activities Fee Committee
  **FROM:** Undergraduate Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation on $60k Reserve Allocation & Wellness Pass

  **Bottom Line Recommendation**
  I recommend we adopt **Option A (Campus Life Grants)**, funded immediately from the reserve, while maintaining the Wellness Pass for the current academic year and allowing it to lapse next year.

  This is not a utilitarian choice. Option A reduces aggregate welfare: we swap ~$63,000 in broad student value (the Pass) for ~$36,000 in distributed grants plus $8,000 in admin costs. Roughly $16,000 of the reserve would remain unspent and revert to the general fund. However, under a **prioritarian** framework, we are justified in accepting this efficiency loss to prioritize the moral weight of the worst-off.

  **The Exchange Rate**
  To make this concrete: We should be willing to accept **$3 of loss to comfortable students for every $1 of gain to high-need students** before rejecting a redistribution proposal.

  *   **Why not 1:1?** A 1:1 ratio treats all dollars as morally identical, ignoring diminishing marginal utility. $500 prevents eviction for a high-need student; $70 buys convenience for a comfortable one.
  *   **Why not unlimited?** An infinite ratio invites the "levelling down" objection—destroying value purely for equality's sake. We must acknowledge that waste (admin costs, unclaimed funds) is a genuine moral cost, not just noise.
  *   **Why 3:1?** This thresholds priority without abandoning responsibility. In this specific case, the ratio is roughly 1.4:1 ($50,400 loss to comfortable users vs. $36,000 gain to grant recipients). This falls well within the 3:1 limit, making Option A robust even if our estimates on take-up are slightly optimistic.

  **The 20% Overlap**
  Approximately 20% of Wellness Pass users are Pell-eligible—the same population the grants target. Cutting the Pass harms them too. This is not noise; it is a significant complication. However, the *intensity* of the benefit differs. The Pass provides ~$70/semester in convenience (printing, shuttle). The Grant provides $500 in emergency stability. Even for the overlapping population, the Grant addresses a deeper tier of need. We are not swapping like-for-like; we are trading convenience for security. Therefore, the overlap does not veto Option A, but it mandates we handle the transition carefully.

  **Timing and Mechanics**
  We should **keep the Pass active for the current year** and announce its lapse for the next academic year, funding the Grants from the reserve immediately.

  Our precedent treats cutting an existing service differently than declining to renew one. This distinction is morally relevant because of **reliance interests**. Students have organized budgets and commutes around the shuttle and printing. Revoking this mid-year violates a specific expectation created by the university. Allowing the Pass to lapse respects those reliance interests while still achieving the redistributive goal for the next cohort. It acknowledges that while we have a duty to redistribute, we also have a duty not to breach implicit contracts with current students.

  **The Strongest Argument Against (Option B/Status Quo)**
  The strongest case for retaining the Pass (Option B) is not about efficiency, but about **integrity and social infrastructure**.
  Students who commute or budget tightly around the Pass have structured their lives on its availability. To cut it—even for a noble cause—treats these students as means to an end rather than ends in themselves. Furthermore, the Pass is one of the few spaces where students from different backgrounds mix (the climbing wall, the shuttle). Removing it silos the campus. The 20% of high-need users who rely on the Pass but might not qualify for the Grants (due to the hardship index specifics) will be strictly worse off, with no compensatory gain. They bear the cost of a justice initiative they do not benefit from. This is a genuine complaint of unfairness, not just discomfort.

  **Conclusion**
  Option A is the only choice that aligns with our duty to the most vulnerable, provided we accept that total benefit may decrease. By setting a 3:1 exchange rate threshold, acknowledging the harm to Pass-dependent low-income students, and respecting reliance interests through a delayed lapse, we can mitigate the levelling down objection while acting on our prioritarian commitments.

  **Motion:** Allocate $44,000 from reserve to Campus Life Grants immediately; maintain Wellness Pass through current academic year; notify students of Pass discontinuation for next academic year.
