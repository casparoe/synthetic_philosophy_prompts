      *   *Immune Response:* Aesthetic resistance, cultural barrier, "bad taste," or critical distance.
      *   *Asymptomatic Carriers:* Critics/Connoisseurs who understand the form but feel nothing? Or perhaps artists who intend feeling but fail? Let's go with: People who can analyze the form perfectly without being "infected" (the formalists).
      *   *Mutation:* Interpretation/Reception variance (the feeling changes as it spreads).

  5.  **Identifying the Breaks (The "Disanalogies"):**
      *   *Biological Import 1: Identical Replication.* Viruses copy themselves. Art feelings are reconstructed, not copied. The viewer *generates* the emotion based on their own psyche + the form. It's not a download; it's a compilation.
