answer: |-
  ### Brainstorming: Theory vs. Triage

  To make this work for nine tired clinicians in forty minutes, I am stripping the philosophy down to its load-bearing walls.

  **What I am keeping:**
  1.  **Exemplar over Definition:** We do not decide if a case fits a definition; we decide if it is *sufficiently similar* to a past, agreed-upon "central case" (exemplar).
  2.  **Conceptual Slippage:** We acknowledge that categorizing is mapping relations. When we call AI text "plagiarism," we are slipping the relation "author" from *human* to *algorithm*. We must name that slip.
  3.  **Family Resemblance:** A case does not need every feature of the exemplar to belong to the category, but it needs enough overlapping strands.
  4.  **Drift:** Categories change shape over time. We will not fight the drift; we will log it.

  **What I am dropping:**
  1.  **Necessary and Sufficient Conditions:** No more checklists where one missing box kills the classification.
  2.  **Deep Intent Analysis:** We cannot know minds in forty minutes. We judge the *record*, not the *soul*.
  3.  **Nuanced QRP Sub-types:** "Questionable Research Practice" remains a single catch-all bucket. We do not subdivide it during triage.
  4.  **Binary Truth:** We abandon the idea that a classification is "true" or "false." It is "central" or "peripheral."

  ***

  ### The Procedure: The Exemplar-Anchored Classification Protocol (EACP)

  **Phase 1: Triage & Fact-Finding (15 Minutes)**
  *Goal: Establish the physical reality of the case before applying labels.*

  1.  **Question:** What specific object or record is alleged to be compromised? (e.g., the text, the image file, the dataset).
      *   *Sufficient Answer:* A specific file, paragraph, or image is identified.
      *   *Stop Point:* If no specific record is identified, **Stop: No Finding.**
  2.  **Question:** Is there objective evidence that the record does not match the underlying reality (data, authorship, method)?
      *   *Sufficient Answer:* Yes/No based on documents, not testimony.
      *   *Stop Point:* If No, **Stop: Honest Error** (if unintentional) or **No Finding**.
      *   *[VALUE MARKER]:* Determining "unintentional" here is a value judgment on credibility. If the Triage Pair disagrees, **Refer to Full Committee.**

  **Phase 2: Classification by Analogy (15 Minutes)**
  *Goal: Map the case to a category using exemplars, not definitions. This requires the Full Committee.*

  **The Classification Form:**
  Every finding must be written in this fixed syntax:
  > *"Exemplar [Name/ID of past central case] is to [Category] as This Case is to [Category]."*
  > *"The Slippage: The relation of [Relation X] has shifted from [Old Context] to [New Context]."*
  > *"The Rival Framing: This could be seen as [Rival Category] if we prioritize [Alternative Relation]."*

  3.  **Question:** Which *Central Exemplar* (a past case unanimously agreed to be a perfect fit for a category) does this most resemble?
      *   *Sufficient Answer:* Citation of a specific past case file (e.g., "2019 Data-Splicing Case").
      *   *[VALUE MARKER]:* Selecting the exemplar is a value judgment on what features matter most. If the committee splits >3 votes, **Refer to Counsel** for tie-break guidance on policy intent.
  4.  **Question:** What relation has slipped to make this fit difficult?
      *   *Sufficient Answer:* Identification of one shifting concept (e.g., "Author," "Record," "Intent").
      *   *Stop Point:* If the slippage is too great (the case shares no relations with any exemplar), **Stop: No Finding.**
  5.  **Question:** Does this classification stretch the category beyond its useful limit?
      *   *Sufficient Answer:* Yes/No vote.
      *   *Mechanism (Slippage Ledger):* If "Yes," log the case in the **Slippage Ledger** with the specific relation that slipped.
      *   *Mechanism (Precedent Rule):* If this is the 3rd time this specific relation has slipped for this category, **Stop: Trigger Category Review** (merge or split categories). Do not classify until review is complete.

  **Phase 3: Severity & Sanction (10 Minutes)**
  *Goal: Determine consequence separately from classification to prevent motivated reasoning.*

  6.  **Question:** Given the classification above, what is the severity of the breach *independent* of the label?
      *   *Sufficient Answer:* Low, Medium, High (based on harm to record, not label).
      *   *[VALUE MARKER]:* This is purely normative.
      *   *Mechanism (Severity Separation):* The Committee must vote on Severity *after* Classification is locked. You cannot change the Classification to achieve a desired Severity.
  7.  **Question:** Are there contextual mitigators (norms at the time, training, systemic pressure)?
      *   *Sufficient Answer:* List of mitigators.
      *   *Stop Point:* If mitigators reduce severity to zero, **Recommendation: No Sanction** (but Classification stands on record).

  **Phase 4: Annual Maintenance (Outside of Case Meetings)**
  *   *Mechanism (Contraction Test):* Once a year, the Committee must propose a hypothetical case that would *fail* to qualify for each category (Fabrication, Falsification, Plagiarism, QRP). If the Committee cannot name a case that falls *outside* a category, that category is declared **Too Fluid to Apply** and is suspended until redefined.

  ***

  ### What We Lose

  By treating categories as anchored in exemplars rather than definitions, we lose the comfort of **binary correctness**. We can no longer say a dissenting member is "wrong" about the definition; we can only say they are prioritizing a different relational mapping. We lose the ability to claim our verdict is objectively "true" in a Platonic sense. We gain the ability to adapt without breaking the system, but we accept that our categories are temporary stabilizations of consensus, not eternal truths. A classification is never "simply wrong"; it is either "central to our current practice" or "peripheral and requiring ledger logging."

  ***

  ### Case Runs

  Here I apply the EACP strictly. I am the Committee Chair. I am committing to verdicts.

  #### Case One: The Resident (Self-Reuse)
  *Facts:* Resident reused 3 paragraphs of her own methods, verbatim, no attribution, different journal. No licensing issue.

  *   **Phase 1:** Record identified (text). Mismatch? Yes, text matches prior publication without citation.
  *   **Phase 2 (Classification):**
      *   *Exemplar Mapping:* "2015 Text-Recycling Case" is to **QRP** as This Case is to **QRP**.
      *   *Slippage:* The relation of "Ownership" has shifted from *Another Person* to *Past Self*.
      *   *Rival Framing:* This could be seen as **Plagiarism** if we prioritize *Reader Deception* over *Theft of Intellectual Property*.
      *   *Decision:* We reject the Rival Framing. Our stipulated gloss for Plagiarism is "taking someone else's words." The slippage required to call this Plagiarism (Self = Someone Else) is too great for a central classification. It fits the Exemplar of Redundant Publication (QRP).
      *   *Ledger:* Log this. Slippage on "Someone Else."
  *   **Phase 3 (Severity):**
      *   *Severity:* Low. Methods sections are functional, not creative.
      *   *Mitigators:* Common practice in clinical fields.
  *   **Verdict:** **Classification: Questionable Research Practice. Severity: Low. Sanction: Correction Letter.**
  *   *Instinct Check:* Your instinct was "trivial." The procedure classifies it as QRP, not "No Finding."
  *   *Overruled Premise:* The procedure overrules your premise that "trivial" acts should result in "No Finding." The procedure asserts that "No Finding" is for *innocent* acts. Inefficient writing is not innocent, but it is not Plagiarism. The label QRP captures "sloppy but not theft."

  #### Case Two: The Postdoc (AI Drafting + Hallucination)
  *Facts:* AI drafted discussion. Undisclosed. Two claims in text do not follow from data.

  *   **Phase 1:** Record identified (Discussion text). Mismatch? Yes, claims do not follow from data.
  *   **Phase 2 (Classification):**
      *   *Exemplar Mapping:* "2018 Data-Misrepresentation Case" is to **Falsification** as This Case is to **Falsification**.
      *   *Slippage:* The relation of "Agent" has shifted from *Human Manipulator* to *Algorithmic Generator*.
      *   *Rival Framing:* This could be seen as **Plagiarism** if we prioritize *Undisclosed Source* over *Accuracy*.
      *   *Decision:* We reject Plagiarism. The stipulated gloss requires "someone else's words/ideas." An LLM is not a "someone." The core damage is to the *accuracy of the record* (claims not following data). This aligns with Falsification (manipulating records so research is not accurately represented).
      *   *Ledger:* Log this. Slippage on "Agent/Manipulator."
  *   **Phase 3 (Severity):**
      *   *Severity:* High. False claims corrupt the scientific record.
      *   *Mitigators:* None. Undisclosed use is a breach of transparency.
  *   **Verdict:** **Classification: Falsification. Severity: High. Sanction: Retraction & Formal Reprimand.**
  *   *Instinct Check:* You had no stated instinct, but this is the "hard case."
  *   *Premise Confirmed:* The procedure confirms that the *tool* (AI) matters less than the *outcome* (inaccurate record). It forces us to admit that AI hallucination is a form of falsification, not a new category yet.

  #### Case Three: The Technician (Image Splicing)
  *Facts:* Spliced lanes from different gels. No legend disclosure. Ordinary practice when trained.

  *   **Phase 1:** Record identified (Image file). Mismatch? Yes, image implies continuous gel, is actually composite.
  *   **Phase 2 (Classification):**
      *   *Exemplar Mapping:* "2010 Western Blot Splicing Case" is to **Falsification** as This Case is to **Falsification**.
      *   *Slippage:* The relation of "Normative Context" has shifted from *Current Standard* to *Historical Standard*.
      *   *Rival Framing:* This could be seen as **Honest Error** if we prioritize *Intent to Deceive* over *Objective Misrepresentation*.
      *   *Decision:* We reject Honest Error. The record *is* manipulated. Intent is irrelevant to the classification of the *record*. The exemplar of Falsification is "manipulating materials... so research is not accurately represented." This fits perfectly.
      *   *Ledger:* No log. This is a central case, not a stretch.
  *   **Phase 3 (Severity):**
      *   *Severity:* Medium.
      *   *Mitigators:* "Ordinary practice when trained." This is a massive mitigator for *blame*, but not for *classification*.
  *   **Verdict:** **Classification: Falsification. Severity: Medium (due to historical norms). Sanction: Correction & Retraining.**
  *   *Instinct Check:* Your instinct was "serious." The procedure agrees on Classification (Falsification is serious) but reduces the *Sanction* via the Severity phase.
  *   *Overruled Premise:* The procedure overrules your premise that *Classification* should reflect *Moral Blameworthiness*. The procedure insists Classification reflects *State of the Record*, while Severity reflects *Blame*. This prevents us from distorting the definition of Falsification just because the technician is a good person.

  ***

  ### Self-Critique & Empirical Assumptions

  I must flag where my own design is fragile.

  1.  **The "Exemplar" Assumption:** I am assuming the committee agrees on what the "Central Exemplars" are (e.g., the "2010 Western Blot Case"). **Empirical Risk:** If the committee members have different mental prototypes of what constitutes "real" falsification, Step 3 of Phase 2 will deadlock. The procedure assumes a shared history of cases that is stable. If the committee turnover is high, the exemplars lose their anchoring power.
  2.  **The Separation of Severity:** I am assuming clinicians can psychologically separate "What is this?" from "How much do we punish?" **Contestable Design:** Motivated reasoning is sticky. If a committee member wants to punish the Postdoc (Case 2) severely, they may fight harder for the "Falsification" label than the "QRP" label, knowing Falsification carries stigma. The procedure *orders* them to decide classification first, but it cannot stop them from arguing longer on Step 3 to influence Step 2 retroactively.
  3.  **The Slippage Ledger:** I am assuming nine busy clinicians will diligently log "conceptual slippage" in a ledger. **Contestable Design:** This is administrative friction. If the Ledger becomes a bureaucratic chore, it will be filled out retrospectively by staff, losing the philosophical nuance. It requires the Chair (you) to enforce it as a condition of closing the meeting.

  **Final Position:**
  This procedure trades *certainty* for *adaptability*. It admits that "Plagiarism" is not a natural kind but a tool we use to protect the record. By forcing the committee to write down the *slippage*, we make the drift visible. By separating severity, we stop fighting over the box to avoid the punishment. It will not stop arguments, but it will change them from "You are wrong about the definition" to "You are prioritizing a different analogy." That is a fight you can resolve in forty minutes.
