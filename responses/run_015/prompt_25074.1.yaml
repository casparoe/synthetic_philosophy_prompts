  **Quiz: What Drives Your Moral Compass?**

  1. **The White Lie:** You praise a friend's bad art to spare feelings.
     A. Wrong. Lying is inherently bad.
     B. Wrong, but kindness overrides it.
     C. Not wrong. Context changes the act's nature.

  2. **The Broken Promise:** You miss lunch to help an accident victim.
     A. Wrong. Promises bind absolutely.
     B. Wrong to break, but right to help.
     C. Right. The promise wasn't binding here.

  3. **Moral Expertise:** Can a novice master morality via rules?
     A. Yes. Principles codify judgment.
     B. Mostly. Rules guide, perception adjusts.
     C. No. Judgment is perceptual, like art.

  4. **The Bridge:** Push one man to save five others.
     A. Forbidden. Never use people as means.
     B. Permissible. Lives outweigh rights.
     C. Wrong here, though saving lives is usually good.

  5. **Sadistic Joy:** A torturer enjoys their work. Is the enjoyment bad?
     A. Yes. Pleasure in evil is evil.
     B. Yes, though pleasure is usually good.
     C. No. Pleasure is good; the act is bad.

  6. **Starving Thief:** Stealing bread to feed a starving child.
     A. Wrong. Property rights are absolute.
     B. Wrong, but necessity overrides.
     C. Not theft. Need negates the claim.

  7. **The Moral Book:** Could all moral truths fit in a handbook?
     A. Yes. Morality is codifiable.
     B. No. Principles conflict unpredictably.
     C. No. Reasons shift with details.

  8. **Loyalty:** You hide a friend's minor indiscretion; they later commit fraud.
     A. Wrong. Aiding wrongs is always bad.
     B. Wrong here, but loyalty is usually good.
     C. Loyalty isn't a reason here; it's irrelevant.

  **Scoring Key**

  **Mostly A's: Strong Generalism.** You believe morality consists of exceptionless laws. If an act falls under a rule (e.g., "do not lie"), it is judged accordingly, regardless of context.

  **Mostly B's: Ross-Style Pluralism.** You accept *prima facie* duties. Principles exist and genuinely conflict; right action requires weighing competing obligations without abandoning the rules.

  **Mostly C's: Dancy-Style Particularism.** You deny codifiability. Features (like lying) aren't inherently reasons; their moral valence depends on the holistic context. There are no true principles.

  **Mixed A/C:** Logically unstable. Claiming absolute rules (A) while denying codifiability (C) suggests unexamined inconsistency. You want laws but admit they can't be written.

  **Mixed B/C:** Plausible hybrid, but theoretically tense. Rossians say principles always retain some weight (B); Particularists say they can vanish entirely (C).

  **Mostly C except Q3=A:** Incoherent. You claim judgment is perceptual (C) yet learnable via rules (A). Particularists argue moral learning is akin to art criticism, not rule memorization.

  **Mostly A except Q4=B:** Common inconsistency. You claim absolutism but concede to utilitarian calculus in extreme cases, undermining the "absolute" claim.
