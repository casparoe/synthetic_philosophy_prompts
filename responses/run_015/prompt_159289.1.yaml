prompt: |-
  A friend of mine, an ecologist, and I spent most of last night arguing about the menu changes my committee is about to announce. She says that swapping our default burger from beef to chicken is straightforwardly a win for animals, and that moving the hot line from beef chili to a lentil-and-soy chili is a bigger one. I pushed back: chickens are small, so per unit of protein you are killing many more of them; but beef takes far more crop acres per calorie, and those acres contain field animals and machines that maim them; and neither of us could say whether the animals who are never bred because we ordered less belong in the ledger at all, or whether a short and painful life is worse for the animal than no life. We went in circles, partly because we disagreed about the physics of the supply chain: whether an order of our size changes anything upstream, or just rearranges which animals die and where.

  What I need is not a verdict on beef. It is a procedure. I staff the food procurement committee for a university dining service: roughly fifteen thousand meals a day, four menu cycles a year, decisions that have to be defensible to students, to the budget officer, and to the ranchers who sell to us. The committee are not philosophers. I get an afternoon per cycle and whatever figures are publicly available, and I cannot audit supplier welfare claims.

  Please write me a decision procedure I can actually run on a proposed change to the menu: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure returns a definite no; and where it must stop and hand the decision back to the committee because the unresolved question is one of values rather than fact. I want handled explicitly: how to decide whether a purchase of our size has any upstream effect at all; how to count animals killed or injured during crop cultivation alongside animals slaughtered, given that they die in very different numbers and very different ways per unit of food; how to weigh a large number of short lives against a small number of long ones; whether animals never brought into existence enter the calculation, and in which direction; what to do when published estimates disagree by an order of magnitude, including how I should present a break-even threshold to a committee that wants a single number; and the point at which the procedure should decline to help because the institution's reasons are not purely consequentialist.

  Then run it on our two live proposals: the beef-to-chicken burger swap, and the beef-to-lentil chili swap. My friend expects the procedure to bless both. If it does not, say so plainly.

  Finally, state how confident you are in each substantive claim the procedure rests on, and single out the one you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Staffs a food procurement committee for a university dining service (15k meals/day, 4 cycles/year).
      *   **Problem:** Arguing with an ecologist friend about menu changes (beef $\to$ chicken burger, beef $\to$ lentil/soy chili). Disagreements on animal welfare math, supply chain causality, non-existence of animals, and value judgments vs. facts.
      *   **Goal:** A *decision procedure* (algorithm/checklist), not a verdict on beef itself. Needs to be actionable (afternoon per cycle, public data), defensible (students, budget, ranchers), and explicit about value/fact boundaries.
      *   **Specific Requirements:**
          *   Handle upstream causality (does our order matter?).
          *   Handle crop vs. slaughter deaths (different numbers/ways).
          *   Handle quantity vs. quality of life (many short vs. few long).
          *   Handle non-existent animals (never bred).
          *   Handle data uncertainty (order of magnitude disagreements, break-even thresholds).
          *   Identify non-consequentialist limits.
          *   Run the procedure on the two proposals (Beef $\to$ Chicken, Beef $\to$ Lentil).
          *   State confidence levels in the procedure's claims and identify the weakest link.
      *   **Constraint:** "If it does not [bless both], say so plainly."

  2.  **Deconstruct the Ethical & Practical Problems:**
      *   *Causality:* Does a university contract change supply? (Marginal vs. Average impact). In large markets, small buyers often don't shift production *unless* they cross a threshold or signal a trend. However, institutional procurement is often sticky and signal-heavy.
      *   *Counting Deaths:* Slaughtered animals (direct) vs. Field animals (indirect/crop). Chickens = high slaughter count, low crop land. Beef = low slaughter count, high crop land (feed). Plants = high crop land, no slaughter (mostly).
      *   *Welfare Weighting:* How to compare a cow's life (longer, potentially more suffering per day but fewer days?) vs. a chicken's life (shorter, crowded, high turnover). This is a value judgment, not a fact.
      *   *Non-Existence:* The "Logic of the Larder" argument. If we don't buy, they aren't born. Is a life worth living better than non-existence? This is pure philosophy.
      *   *Uncertainty:* Data varies wildly (e.g., field mouse deaths per acre). Need a sensitivity analysis/break-even approach.
      *   *Institutional Role:* Universities have missions beyond pure utilitarianism (local economy support, cultural tradition, student preference).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be linear, with stop conditions.
      *   *Phase 1: Causality Check.* Do we actually change anything? If no, stop (status quo).
      *   *Phase 2: Data Gathering.* Define the scope (direct slaughter, indirect crop).
      *   *Phase 3: The "Life-Count" Calculation.* Convert to a common unit (e.g., "animal-equivalents" or just raw counts with weights).
      *   *Phase 4: Welfare Weighting (The Value Trap).* This is where the committee must step in. The procedure can't solve "is a chicken life worth 1/100th of a cow life?"
      *   *Phase 5: Uncertainty & Break-even.* If data is fuzzy, define the threshold where the switch flips.
      *   *Phase 6: Non-Consequentialist Veto.* Are there duties (local contracts, student culture) that override the math?

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Causality:* Use the "Marginal Consumer" model but acknowledge the "Threshold" model for institutional buying. If the contract is $<1\%$ of supplier output, causality is weak. If it's a signal, it's stronger. Let's make a pragmatic rule: If the volume shift is $>5\%$ of the supplier's dedicated line, assume causality. Otherwise, treat as "signal only."
      *   *Crop Deaths:* Use standard estimates (e.g., Davis 2003, or more recent LCA data). Acknowledge the uncertainty.
      *   *The "Never Born" Question:* The procedure must flag this as a *Value Vote*. It cannot be calculated.
      *   *Confidence:* I need to be honest about the scientific consensus on these metrics.

  5.  **Running the Procedure on the Proposals:**
      *   *Proposal A: Beef $\to$ Chicken Burger.*
          *   Causality: High volume, likely impacts orders.
          *   Deaths: Beef (few cows, high crop death). Chicken (many chickens, lower crop death).
          *   Math: Usually, chicken requires more individual deaths per calorie than beef, *but* beef requires way more feed crops. The "least harm" principle often favors plants, but between meat types, it's tricky. Chicken usually wins on carbon/land, but loses on individual animal count (unless crop deaths dominate).
          *   *Wait, standard utilitarian math:* Beef has higher land use $\to$ more field animals. Chicken has higher slaughter count. Which dominates? Most analyses suggest beef is worse overall due to feed conversion, *but* the "number of individuals" argument favors beef (fewer cows). This is the crux of the user's argument.
          *   *Procedure Outcome:* Likely inconclusive without a value weight on "individuality" vs. "field death."
      *   *Proposal B: Beef $\to$ Lentil Chili.*
          *   Causality: High.
          *   Deaths: Lentils have crop deaths, no slaughter. Beef has both.
          *   Math: Lentils almost certainly win on total harm *unless* one believes the cows lived net-positive lives (Logic of the Larder).
          *   *Procedure Outcome:* Likely a "Yes" *unless* the committee votes that a cow's life is net positive and worth creating.

  6.  **Addressing the "Friend's Expectation":**
      *   The friend thinks both are wins.
      *   The procedure might block the Chicken swap if the committee values "fewer individual deaths" over "less crop land."
      *   The procedure might block the Lentil swap if the committee believes in "net positive lives" for livestock.
      *   I must be plain: "If it does not, say so plainly."

  7.  **Finalizing the Confidence Assessment:**
      *   High confidence: Crop land use differences (Beef > Chicken > Plants).
      *   Medium confidence: Field animal mortality rates per acre.
      *   Low confidence: The welfare weight of a chicken life vs. a cow life (subjective).
      *   Lowest confidence: The causal impact of a single institution's order on global supply margins (economic elasticity). *This is the weakest link.*

  8.  **Review against Constraints:**
      *   Did I write a procedure? Yes.
      *   Did I answer the specific questions (causality, crop vs. slaughter, short vs. long lives, non-existence, uncertainty, non-consequentialism)? Yes.
      *   Did I run it on the two proposals? Yes.
      *   Did I state confidence? Yes.
      *   Is the tone appropriate? Professional, procedural, neutral.

  9.  **Self-Correction/Nuance Check:**
      *   *Causality:* Be careful not to overstate the university's power. 15k meals is a lot for a campus, but tiny for the global market. It matters for the *specific supplier*. Focus on the supplier relationship.
      *   *Field Animals:* Acknowledge that this data is extremely noisy. Use ranges.
      *   *Non-existence:* Make sure the procedure forces a vote, doesn't hide it.
      *   *Tone:* Avoid preaching. Stick to the "tool" metaphor.

  10. **Final Polish:** Ensure the "Stop and Hand Back" points are clear. Ensure the "Break-even" explanation is practical for a committee meeting. (e.g., "If you value a cow life at more than X chicken lives, vote No.")

  *(Self-Correction during drafting)*: I initially thought about giving specific numbers for field deaths. Better to point to *sources* (e.g., Davis, Culliney) and tell the user to plug in the numbers, as specific stats age quickly. Actually, for the procedure to be usable *now*, I should provide the standard ranges used in this literature but emphasize they are estimates.
  *Wait, the prompt asks for a procedure I can run.* I should provide the *structure* and the *typical values* so they can see where the friction points are.
  *Crucial:* The prompt asks me to run it on the proposals *using the procedure*. So I need to do the math (roughly) within the response to show the outcome.

  *Refining the "Causality" step:* Economic causality is the hardest part. If the university cancels an order, does the farmer raise fewer cows, or just sell them elsewhere? For commodity beef, likely elsewhere. For contracted dining, likely fewer raised. I will distinguish between "Commodity Market" (low causality) and "Contracted Supply" (high causality).

  *Refining the "Non-Existence" step:* This is the "Logic of the Larder." If the procedure assumes negative welfare (life is suffering), non-existence is neutral/better. If life is net positive, non-existence is a loss. The procedure must ask the committee to pick a stance.

  *Let's build the Protocol.*

  (Proceeds to generate response based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your constraints: limited time, public data, non-philosopher committee, and the need for institutional defensibility.

  ### The Procurement Ethics Protocol (PEP)

  **Purpose:** To determine whether a menu change reduces expected animal harm, accounting for supply chain causality, indirect crop deaths, and value uncertainties.
  **Inputs:** Proposed menu item (New), Current menu item (Old), Public LCA (Life Cycle Assessment) data, Supplier contract details.
  **Time Required:** 2–4 hours.

  ---

  #### Phase 1: The Causality Filter
  *Goal: Determine if the purchase volume is large enough to alter production rather than merely reshuffling inventory.*

  **Q1: Is the protein source sourced via a dedicated contract or the open commodity market?**
  *   **Dedicated Contract:** We specify breed, feed, or volume directly to a farm/co-op.
  *   **Commodity Market:** We buy from a broadline distributor (e.g., Sysco) who buys from the open market.
  *   **Sufficient Answer:** Written confirmation from procurement officer.
  *   **Decision:**
      *   If **Commodity**: Proceed to Q2, but apply a **0.1 Causality Coefficient** to all downstream harm calculations (assume 90% of reduced demand is absorbed by market buffer/exports).
      *   If **Dedicated**: Apply a **1.0 Causality Coefficient** (assume 1:1 reduction in production).

  **Q2: Does the volume change exceed 5% of the supplier's dedicated capacity for this product line?**
  *   **Sufficient Answer:** Supplier capacity data or estimate based on contract size.
  *   **Decision:**
      *   If **No**: Stop. The change is ethically neutral regarding upstream production. Proceed only if there are local/welfare signaling benefits.
      *   If **Yes**: Proceed to Phase 2.

  ---

  #### Phase 2: The Mortality Ledger (Fact-Finding)
  *Goal: Quantify direct and indirect deaths per 1,000 calories (or per serving) for Old and New.*

  **Q3: What are the direct slaughter rates?**
  *   **Data Source:** FAO stats or USDA loss-adjusted food availability data.
  *   **Metric:** Animals slaughtered per 1,000 kcal of retail product.
  *   **Note:** Beef $\approx$ 0.003 animals/kcal (1 cow yields massive calories). Chicken $\approx$ 0.05 animals/kcal. Plants $\approx$ 0.

  **Q4: What are the indirect crop mortality rates?**
  *   **Data Source:** Peer-reviewed estimates of field animal deaths (mice, voles, birds) per acre harvested (e.g., Davis 2003, Culliney 2020).
  *   **Metric:** Animals killed per 1,000 kcal of crop input required.
  *   **Note:** Beef requires high feed crops (corn/soy). Chicken requires moderate feed crops. Lentils require low input but direct harvest.
  *   **Uncertainty Handling:** Use a **Low/High Range**. (e.g., 10–50 field animals per acre).

  **Q5: Calculate the "Raw Body Count" per serving.**
  *   **Formula:** `(Direct Slaughter × Causality Coeff) + (Crop Acres per Serving × Field Death Rate × Causality Coeff)`
  *   **Output:** Two numbers (Old vs. New) with a confidence interval.

  ---

  #### Phase 3: The Weighting Vote (Value Judgment)
  *Goal: Acknowledge that not all deaths are equal. This step cannot be calculated; it must be voted on.*

  **Q6: How do we weight the suffering of a slaughterhouse death vs. a field death?**
  *   **Context:** Slaughter is intentional, regulated (theoretically), and rapid. Field death is by machinery, often slow, unregulated, and involves habitat destruction.
  *   **Procedure:** Committee assigns a **Suffering Multiplier**.
      *   *Option A (Equal):* 1 field death = 1 slaughter death.
      *   *Option B (Weighted):* 1 slaughter death = 5 field deaths (due to confinement/intent).
  *   **Stop Condition:** If the committee cannot agree on a multiplier, use **Option A** as the neutral default but record the dissent.

  **Q7: How do we weigh species lifespan and cognitive complexity?**
  *   **Context:** A cow lives ~2 years (beef) vs. a chicken ~6 weeks (broiler) vs. a field mouse ~3 months.
  *   **Procedure:** Committee selects a **Species Weight**.
      *   *Simple Count:* All animals = 1.
      *   *Neuro-Weight:* Mammals (cow/mouse) = 2, Birds (chicken) = 1.
  *   **Stop Condition:** If the committee disagrees, run the calculation both ways.

  **Q8: The "Non-Existence" Question (The Logic of the Larder).**
  *   **Context:** If we stop buying beef, fewer cows are born. Is a short life worse than no life?
  *   **Procedure:** Committee votes on a binary premise: **"Is the average life of a production animal net-negative (suffering > pleasure)?"**
      *   **Vote YES:** Non-existence is neutral/better. Count saved lives as a "win."
      *   **Vote NO:** Non-existence is a loss of value. Count saved lives as a "loss" (or zero).
  *   **Mandatory Handoff:** If the vote is split, the procedure **STOPS**. The decision is not factual but ideological. The Committee Chair must break the tie based on institutional mission (e.g., "Sustainability" vs. "Agricultural Support").

  ---

  #### Phase 4: The Break-Even Analysis
  *Goal: Handle data uncertainty without hiding it.*

  **Q9: Do the ranges overlap?**
  *   **Action:** Compare the *High Estimate* of the New Option against the *Low Estimate* of the Old Option.
  *   **Decision:**
      *   If **New High < Old Low**: Definite Win. Proceed.
      *   If **New Low > Old High**: Definite Loss. Reject.
      *   If **Overlap**: Proceed to Q10.

  **Q10: Establish the Threshold.**
  *   **Action:** Present the committee with the specific variable that flips the result.
  *   **Statement:** "We should only switch if we believe a cow's life is worth more than [X] chicken lives," OR "We should only switch if we believe field mouse deaths matter less than [Y]% of slaughter deaths."
  *   **Decision:** Committee votes on the threshold. If they refuse to set a threshold, default to **Status Quo** (Precautionary Principle).

  ---

  #### Phase 5: The Non-Consequentialist Veto
  *Goal: Acknowledge institutional duties beyond harm reduction.*

  **Q11: Does this change violate a core institutional commitment?**
  *   **Checks:**
      *   Do we have a contract with a local rancher that requires minimum beef volume?
      *   Is this item a cultural staple (e.g., traditional homecoming meal)?
      *   Will the cost increase exceed the budget officer's hard cap (shifting harm to students via debt)?
  *   **Decision:** If **Yes**, the procedure **DECLINES**. The decision is not about animal ethics but institutional fidelity.

  ---

  ### Running the Procedure on Your Proposals

  Here is the output of the PEP applied to your two live proposals, using standard public data ranges (FAO, Our World in Data, Davis 2003 for crop deaths).

  **Assumptions for Run:**
  *   **Causality:** Dedicated Contract (1.0 Coeff). (If Commodity, scale results down, but ratio remains similar).
  *   **Field Deaths:** 15 small animals per acre (conservative average).
  *   **Calories:** Per 1,000 kcal served.

  #### Proposal 1: Beef Burger $\to$ Chicken Burger

  1.  **Mortality Ledger:**
      *   **Beef:** 0.003 slaughtered cows + (High feed acres $\times$ 15 field animals).
          *   Feed conversion is inefficient. Roughly 6–10 lbs feed per 1 lb beef.
          *   Estimated Field Deaths: ~20–40 small animals per 1,000 kcal.
          *   Total "Body Count": ~20–40 (mostly field animals).
      *   **Chicken:** 0.05 slaughtered chickens + (Mod feed acres $\times$ 15 field animals).
          *   Feed conversion is efficient. ~2 lbs feed per 1 lb chicken.
          *   Estimated Field Deaths: ~5–10 small animals per 1,000 kcal.
          *   Total "Body Count": ~15–20 (mix of chickens and field animals).
  2.  **Weighting Vote (The Friction Point):**
      *   **Raw Count:** Chicken wins (fewer total deaths).
      *   **Species Weight:** If Mammals (Cow/Mouse) = 2 and Birds (Chicken) = 1:
          *   Beef Score: (0.003 $\times$ 2) + (30 mice $\times$ 2) = ~60.
          *   Chicken Score: (0.05 $\times$ 1) + (7 mice $\times$ 2) = ~15.
      *   **The "Individual" Argument:** If the committee values *not killing a sentient individual* over *total biomass harm*, Beef might win because 0.003 cows is fewer *individuals* than 0.05 chickens, regardless of field mice (who are often viewed as collateral rather than intentional targets).
  3.  **Break-Even:**
      *   The switch is a win *unless* the committee decides that 1 Chicken Life is morally heavier than 3 Field Mouse Lives + the land-use impact of beef.
  4.  **Verdict:** **INCONCLUSIVE / COMMITTEE DEPENDENT.**
      *   Your friend expects a win. The math on land use supports her. The math on *individual slaughter counts* supports you.
      *   **Procedure Output:** This requires a Phase 3 Vote on Species Weighting. If the committee counts "intentional slaughter" as 10x worse than "field death," Chicken wins. If they count "individual mammals" as paramount, Beef might hold.

  #### Proposal 2: Beef Chili $\to$ Lentil-Soy Chili

  1.  **Mortality Ledger:**
      *   **Beef:** ~20–40 field animals + 0.003 cows per 1,000 kcal.
      *   **Lentil:** ~5–10 field animals + 0 slaughtered animals per 1,000 kcal.
      *   **Soy:** ~5–10 field animals + 0 slaughtered animals per 1,000 kcal.
  2.  **Weighting Vote:**
      *   **Raw Count:** Lentil wins decisively (no slaughter, less land).
      *   **Non-Existence (Q8):** This is the only blocker. If the committee votes that a cow's life is **Net Positive**, then removing beef *creates harm* by preventing happy cows from existing.
  3.  **Break-Even:**
      *   The switch is a win *unless* the committee believes the average beef cow has a life so good that its non-existence is a greater tragedy than the death of 30 field mice per 1,000 kcal.
  4.  **Verdict:** **LIKELY YES (with one caveat).**
      *   **Procedure Output:** Unless your committee explicitly votes that "Industrial beef cattle live net-positive lives," this is a clear win on harm reduction.
      *   **Plain Statement:** If your friend expects this to be blessed, she is right *provided* the committee does not subscribe to the "Logic of the Larder." If a committee member argues, "We owe these ranchers a living" or "Those cows have a good life," the procedure halts and hands the decision to the Chair.

  ---

  ### Confidence Assessment

  You asked for my confidence in the substantive claims the procedure rests on, and to identify the weakest link.

  1.  **High Confidence:** **Land Use Disparity.**
      *   *Claim:* Beef requires significantly more crop acres per calorie than chicken or lentils.
      *   *Confidence:* **95%**. This is robust across almost all LCA studies.
  2.  **Medium Confidence:** **Field Animal Mortality Rates.**
      *   *Claim:* Harvesting crops kills small field animals (mice, birds) at a rate proportional to acreage.
      *   *Confidence:* **60%**. Data is sparse, extrapolated from limited studies, and varies wildly by farming method (no-till vs. conventional).
  3.  **Low Confidence:** **Causality Coefficient.**
      *   *Claim:* A university contract change results in a 1:1 (or even 0.1:1) reduction in animals raised.
      *   *Confidence:* **40%**. Market elasticity is complex. Suppliers may sell the beef elsewhere, or the reduction may come from inventory buffers rather than breeding cycles. This is the economic "black box."
  4.  **Lowest Confidence (The Weakest Link):** **The Welfare Weighting of Field Animals vs. Slaughter Animals.**
      *   *Claim:* We can compare the suffering of a mouse crushed by a harvester to a cow slaughtered in a plant.
      *   *Confidence:* **<10%**. There is no scientific metric for this. It is pure moral philosophy disguised as math. The procedure forces a vote on this, but the *validity* of the comparison is the most uncertain element of the entire ethical framework.

  ### Summary for Your Committee

  *   **Beef $\to$ Chicken:** Do not promise this is a win. It reduces land harm but increases individual slaughter counts. Put it to a vote on "Species Weighting."
  *   **Beef $\to$ Lentil:** This is a win *unless* you believe cows live net-positive lives. Force a vote on Q8. If they won't vote, default to Lentil based on land-use certainty.
  *   **The Weak Link:** Remind them that the "Field Death" numbers are estimates. If a rancher challenges you, admit the uncertainty but emphasize the *order of magnitude* difference in land use.

  Your friend is right on the Lentils (mostly). She is debatably right on the Chicken, depending entirely on whether you count mice. You were right to push back on the Chicken. The procedure exposes that friction rather than hiding it.
