answer: |-
  # Colloquium Prep Sheet: Commitment-without-Occupancy

  **Context:** 20 mins Q&A. Contract renewal stakes.
  **Goal:** Defend normative force without conceding to logical omniscience (LO).
  **Strategy:** Frame LO as a category error about *states* rather than *liabilities*.

  ---

  ### Strategic Concessions (First 5 Minutes)
  *Do not wait for these to be asked. Pre-empt them in your closing remarks or intro to signal control.*

  1.  **To the Logician:** Concede immediately that on your view, "belief" is not a set closed under a consequence relation. Say: *"If logic requires closure, I am not offering a logic of belief states. I am offering a logic of belief *governance*."* This disarms the definition attack before it lands.
  2.  **To the Bayesians:** Concede that your model does not preserve standard probability axioms at the level of *occupancy*. Say: *"Occupancy violates additivity. Commitment preserves it. The tension between the two is where the work gets done."*
  3.  **To the Mainstream:** Concede that "salience" is context-sensitive. Do not try to define it algorithmically. Say: *"Salience is dialectical, not computational. It depends on the conversational context."*

  ---

  ### The Eight Objections (Ordered by Damage Potential)

  #### 1. The "Just Psychology" Objection (Mainstream Epistemologists)
  **The Question:** "You're describing cognitive limitations, not epistemic norms. If I *can't* access a consequence until it's salient, in what sense am I *normatively* committed to it now? Isn't this just naturalized epistemology saying 'we are imperfect calculators'?"
  **The 2-Minute Reply:** "It's crucial to distinguish capacity from liability. I'm not saying you *ought* to know the consequence now. I'm saying you are *liable* for it once it's pointed out. Think of it like a contract: I'm not in breach until the payment is due, but the debt exists before the due date. The normativity lies in the Audit Rule: the obligation to reconcile when the debt is called. That's not psychology; that's accountability."
  **Soft Spot:** If they press on *why* the debt exists prior to awareness. (See "Prayer Question").

  #### 2. The "Not Logic" Objection (The Visiting Logician)
  **The Question:** "If your 'commitments' aren't closed under consequence, you aren't doing logic. You're doing cognitive science. You've changed the subject to avoid the problem rather than solving it."
  **The 2-Minute Reply:** "I'm not changing the subject; I'm refining the object. Traditional doxastic logic models the *ideal*, then penalizes the real for failing to be ideal. I'm modeling the *actual* normative structure of reasoning. A logic that demands impossibility isn't a logic of agency. My system is closed under the Audit Rule, not under entailment. That's a different structural rule, but it's still a logic of justification."
  **Soft Spot:** They may insist that "logic" *by definition* requires closure. You can't win a definition fight; rely on the room's preference for agency over formalism.

  #### 3. The "Broken Axioms" Objection (The Two Bayesians)
  **The Question:** "If an agent occupies $P$ and $P \to Q$, but doesn't occupy $Q$, their probability function isn't coherent. You're advocating for incoherent priors. How does this help modeling belief revision?"
  **The 2-Minute Reply:** "I'm advocating for a two-tiered model. The *Occupancy* tier is descriptive and incoherent. The *Commitment* tier is normative and coherent. Revision happens when the Audit Rule forces Occupancy to align with Commitment. This explains *why* revision happens: it's the settling of a normative debt, not just a Bayesian update. It adds a mechanism your models currently lack."
  **Soft Spot:** They might argue this makes the formalism useless for prediction. Admit it's not for prediction, but for *evaluation*.

  #### 4. The "Trivial Truths" Objection (General)
  **The Question:** "Am I committed to every tautology? $P \lor \neg P$? If so, you haven't solved Logical Omniscience, you've just renamed it. I'm still 'committed' to infinitely many things I don't know."
  **The 2-Minute Reply:** "Yes, you are committed to them, but they are *dormant*. LO is a problem because it treats dormant consequences as active guides for action. My view says they only constrain you when they become relevant to your current occupancy. Being committed to a tautology costs you nothing until someone asks you to bet on it. The 'omniscience' is there, but it's inert."
  **Soft Spot:** If they argue that *having* the debt is itself a cognitive burden (storage costs).

  #### 5. The "Salience Trigger" Objection (Mainstream/General)
  **The Question:** "Who decides what is salient? If I can avoid the Audit Rule by just never noticing the consequence, isn't this a license for dogmatism? I can ignore contradictions forever by staying ignorant."
  **The 2-Minute Reply:** "Salience isn't up to you; it's dialectical. If an interlocutor points out the consequence, it is now salient. You can't claim ignorance once the debt is called in. The norm binds you in community, not in isolation. Dogmatism is just refusing to pay a debt when the creditor arrives."
  **Soft Spot:** Relies heavily on the social nature of epistemology. Solitary reasoners are a edge case you might struggle with.

  #### 6. The "Disagreement" Objection (Mainstream Disagreement Folks)
  **The Question:** "If we have different Occupancies, and I see a consequence you don't, can I legitimately criticize you? Or do I have to wait for you to notice it?"
  **The 2-Minute Reply:** "You can criticize you precisely *because* you are committed, even if you don't occupy it. My view explains the legitimacy of your criticism: you're pointing out a debt I owe. On the standard view, you're just saying I'm irrational. On my view, you're saying I'm in arrears. It makes disagreement more productive."
  **Soft Spot:** Doesn't fully explain what happens if I refuse to audit.

  #### 7. The "Ontological Status" Objection (General/Metaphysics)
  **The Question:** "Where do these commitments exist? If they aren't in your head (unoccupied) and aren't in the world, what kind of state is this? It sounds like dispositional belief, which we already have."
  **The 2-Minute Reply:** "It's not a mental state; it's a normative status. Like being a 'citizen' or a 'debtor'. It's defined by your relationship to the propositions you *do* occupy and the rules of logic. We don't ask where 'marriage' is stored in the brain; it's a status constituted by rules and facts. Commitment is a deontic status, not a psychological one."
  **Soft Spot:** If they press hard on the metaphysics of normative statuses without psychological grounding.

  #### 8. The "Old News" Objection (Senior Faculty)
  **The Question:** "Isn't this just Cherniak's minimal rationality, or Brandom's commitment/inference distinction, or Stalnaker's pragmatic closure? What's the actual innovation?"
  **The 2-Minute Reply:** "Cherniak focuses on computational limits; I focus on normative liability. Brandom focuses on linguistic practice; I focus on the cognitive architecture of belief. Stalnaker assumes closure for the model. My innovation is the Audit Rule as the bridge mechanism. I'm not just saying 'we're limited'; I'm saying 'the limitation is the feature that drives revision'."
  **Soft Spot:** Requires you to be very sharp on the literature distinctions. Don't get bogged down in exegesis.

  ---

  ### The "Kill Shot" Reply
  *Keep this in your back pocket. If the room feels hostile or confused, use this to unify the theory.*

  **The Move:** "The entire debate on Logical Omniscience assumes that belief is a *container* that is either full or leaky. I'm asking you to treat belief as a *ledger*. A ledger can have entries that balance (Commitment) even if the cash on hand (Occupancy) doesn't match yet. The error isn't in the ledger; the error is in refusing to balance the books when the auditor arrives. If you accept that shift from container to ledger, the problem dissolves."

  ---

  ### The "Prayer" Question (The One to Avoid)
  **The Question:** "To know that I need to invoke the Audit Rule, don't I have to recognize that $P$ entails $Q$? If I recognize the entailment, don't I now occupy $Q$? If so, doesn't the Audit Rule presuppose the very Omniscience it's trying to avoid?"

  **Why it kills you:** It suggests the trigger for the rule requires the knowledge the rule is supposed to generate. It creates a regress or collapses the distinction between Occupancy and Commitment at the critical moment.

  **If Asked:** Do not bluff.
  **Deflection:** "That's the precise moment of transition. Recognizing the entailment makes $Q$ salient, which triggers the Audit. At that exact moment, $Q$ moves from Commitment to Occupancy. The rule doesn't require you to *already* occupy $Q$; it requires you to recognize the *link*. The link is the trigger, not the content."
  *(Note: This is weak. If they press on "recognizing the link," you are in trouble. Best to hope they don't see the regress.)*
