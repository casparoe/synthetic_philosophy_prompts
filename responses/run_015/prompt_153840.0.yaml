  Fatal defeaters arise from formal epistemology and historical granularity. Bayesian hinge models (e.g., Hartmann, Wenmackers) demonstrate that agents can assign probabilities <1 to foundational propositions and update them via conditionalization without systemic collapse. This directly contradicts the claim that hinges cannot be incrementally updated. If an agent can lower confidence in "I have hands" based on accumulating weird evidence without abandoning the whole framework, the bimodal claim is false. Historically, many "revolutions" (e.g., plate tectonics) involved decades of piecemeal adjustment to foundational assumptions, not a sudden gestalt switch. If hinges shift incrementally in practice, the bimodal model is empirically inadequate, suggesting hinges are merely high-confidence priors.

  Awkward defeaters concern the mechanics of the shift. If hinges are immune to evidence, framework transitions appear arational—mere conversions rather than reasoned revisions. This saves the discontinuity claim but isolates it from normative epistemology. It implies we cannot rationally argue for a new hinge, only adopt it. Additionally, if competing hinges overlap (e.g., Newtonian vs. Einsteinian physics coexisting), the "global replacement" model fails to capture the hybrid reality of scientific practice. The boundary between "scaffolding" and "structure" becomes blurred, forcing arbitrary distinctions.

  Dismissible defeaters include intuitions about gradual skepticism. A defender can argue that doubting specific perceptual claims isn't doubting the hinge "there is an external world." What looks like erosion is often just local testing within a stable scaffold. This move is defensible if hinge status is determined by logical role, not psychological confidence.

  Regarding insulation: It is a bug. If every apparent gradual hinge-change is redescribed as either local tweaking or catastrophic collapse, the theory becomes a tautology. To avoid this, hinge status must be identifiable independently of resistance to revision. Without independent criteria, the discontinuous model is unfalsifiable: it predicts nothing because any data can be accommodated by reclassifying the belief. The view survives only by sacrificing empirical content. A committed defender must concede that if hinge status is defined solely by immunity to change, the theory is trivial. The insulation protects the theory from refutation but empties it of explanatory power.
