      *   *User's Claim:* CDT addresses strategic interaction but leaves diachronic authority untouched.
      *   *Evaluation:* This is a nuanced take. CDT *does* focus on causal links at the moment of choice. It generally treats preferences as fixed inputs. So, yes, CDT doesn't typically model *changing* preferences as a strategic move in the way the user describes. However, Parfit's *resolution* isn't strictly CDT; he uses Hitchhiker to *attack* CDT. The user needs to be careful not to imply Parfit *supports* CDT here. Parfit thinks the rational agent *should* be the kind of person who pays.
