      *   **Mara's Counter (400-600 words):** Challenge the delegation analogy. Principled difference (opaque vs. transparent tools). The "audit questions on loan" problem. The annual drill evidence.
      *   **Dev's Rebuttal (600-800 words):** Address the "audit on loan" point. Functional capacity matters more than internal derivation. Concede the drill slowdown but reframe it.
      *   **Mara's Rebuttal (800-1000 words):** Address the functional capacity. What happens when the system fails *novelly*? The definition of understanding (grasp vs. navigation). Concede accuracy.
