          *   **Dev:** Understanding = navigation (moving around answer space, anticipating changes, locating fragility, knowing questions to ask). Loss of skill vs. gain of capacity. Analogy: delegation (calculators, stats packages, junior RAs).
      *   **Specific Constraints:**
