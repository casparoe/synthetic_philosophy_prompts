      *   *Mara's Argument:* Focus on the "black box." A stats package does what you tell it. This system tells *you* what to ask. That's the inversion. The drill is the smoking gun.
      *   *Dev's Counter:* The drill is a parlor trick. Real world is messy. If the ship sails faster, does it matter if the crew can't tie knots by hand? But need to address the "audit on loan" risk.
