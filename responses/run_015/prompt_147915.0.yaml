  2.  **Identify the Core Philosophical Concepts:**
      *   **The Non-Identity Problem:** Formulated by Derek Parfit (*Reasons and Persons*). This is the exact scenario described. An action affects *who* comes into existence. If the resulting life is worth living, can it be said to be harmed by the action that caused it to exist?
      *   **Harm Principle/Person-Affecting View:** Harm requires making someone worse off than they *would have been*. If the alternative is non-existence, and life is worth living, they aren't worse off.
      *   **Impersonal Principles/Total View:** We should maximize the total amount of well-being, even if it means creating more people.
      *   **Rights/Justice-Based Views:** Some actions are wrong regardless of comparative harm (e.g., violating rights, damaging ecological integrity).
      *   **Stewardship/Intergenerational Justice:** Obligations to future generations regarding the environment, not just individual welfare.

