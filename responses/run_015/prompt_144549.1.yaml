answer: |-
  This is a high-stakes seminar. You're walking into a room where the professor (Chen) already thinks your core premise (internalism) is false, and the students are freshly armed with Williams and Korsgaard. They will know the text better than you expect.

  Your personal stake is clear, but in the room, you must treat the "dad scenario" as a data point, not the argument. If you sound like you're rationalizing a life choice, Chen will treat it as a psychological defense mechanism rather than philosophy.

  Here are the objections ordered by potential damage, phrased for your specific audience.

  ### 1. The Moral Obligation Objection (Dr. Chen's Kill Shot)
  **The Objection:** "You're claiming external reasons lack normative authority. But surely I have a reason not to torture a child even if it doesn't connect to my current motivational set. If your view holds, a sociopath literally has *no reason* not to torture. Are you committed to saying morality is optional based on psychological contingency?"

  **Why it hurts:** Chen thinks internalism is dead for exactly this reason. If you concede this, you lose the room. If you double down, you sound like an error theorist.

  **Quick Reply:** "I'm distinguishing between *reasons that exist* and *reasons that bind*. The moral reason exists objectively, but it lacks *normative authority* over the agent without a motivational hook. In the sociopath case, we don't say they lack a reason; we say they are practically irrational or morally deficient. My claim is about the mechanism of *binding*, not the existence of the norm."

  **Softest Spot:** This smells like error theory. Chen will press: "If it doesn't bind, in what sense is it a *reason*? You're redefining 'reason' to mean 'motivating cause,' which begs the question against externalism."

  ### 2. The Diachronic Agency Objection (The Bratman/Peers Attack)
  **The Objection:** "You rely on a 'temporal slice' of the motivational set. But agency is diachronic. If I form a plan today (like finishing a PhD), that plan gives me a reason to act tomorrow even if my motivational set changes. If reasons are only anchored to the *current* slice, you make planning and commitment impossible. You're collapsing agency into a series of unconnected moments."

  **Why it hurts:** You already admitted your continuity argument is shaky. This is where they will smell blood. If you can't explain how a past decision binds a future self, your "temporal anchoring" destroys long-term projects (like the one you're currently in).

  **Quick Reply:** "I'm not denying diachronic agency, but I'm arguing the *authority* of the plan must be re-anchored at the time of execution. A past commitment provides a *candidate* reason, but it only becomes normative if the current self endorses it via a continuity of identity. If the continuity breaks, the reason loses its grip—which explains why we feel 'burnout' or 'alienation' from past plans."

  **Softest Spot:** This is your weakest armor. You'll have to define "continuity of identity" without circularity. If you say "the self continues," they'll ask "what constitutes that continuation if not shared reasons?"

  ### 3. The Williams "Deliberative Route" Objection (The Textual Check)
  **The Objection:** "You're presenting this as a Williams-internalist view, but Williams allows for a 'sound deliberative route.' I can have a reason to do X even if I don't currently want X, provided I *would* want X if I reasoned correctly from my current set. You seem to be cutting off the deliberative route by demanding connection to the *actual* current profile, not the *correctly reasoned* profile."

  **Why it hurts:** The second-years just read this. If you misread Williams, you lose credibility immediately.

  **Quick Reply:** "I'm tightening Williams. A deliberative route works only if the agent acknowledges the reasoning process *now*. If the 'external reason' requires me to become a different person to accept it (e.g., a purely rational agent), the route isn't sound for *me*, it's sound for a hypothetical agent. I'm demanding the route be traversable by the agent at $t_1$."

  **Softest Spot:** Williams explicitly allows for discovering new motivations through reasoning. You risk attributing a stricter view to him than he holds, making your view seem like a deviation rather than a defense.

  ### 4. The "Hope Nobody Asks" Objection (Presentism & Morality)
  **The Objection:** "Isn't this just Humean presentism? If reasons only bind at the temporal slice of decision, you make morality impossible and rationality purely instrumental. You're essentially saying 'might makes right' regarding desires. If your dad's care didn't fit your motivational set, you'd have no reason to care. Is normativity just whatever we happen to care about in the moment?"

  **Why it hurts:** It combines the moral objection with the metaphysical one. It frames your view as nihilistic.

  **Quick Reply:** "It's not that normativity is *whatever* we care about, but that normativity *requires* care to function. Without that anchor, 'ought' implies 'can' fails. If I *cannot* be motivated by an external reason, telling me I *ought* to follow it is category error. I'm preserving the 'can' in 'ought implies can'."

  **Softest Spot:** This concedes that morality is impossible for those without the "right" desires. It's a tough pill for a grad seminar to swallow.

  ### 5. The Rationalization Charge (The Personal Stake)
  **The Objection:** "This view seems perfectly tailored to justify abandoning long-term obligations when they become difficult or emotionally taxing. How do we distinguish between a legitimate lack of normative authority and simple weakness of will (akrasia) or rationalization?"

  **Why it hurts:** They know your situation. If this sounds like an excuse for dropping out, they won't engage the philosophy.

  **Quick Reply:** "Akrasia is acting against a reason you acknowledge as binding. My view is that in cases of deep conflict, the 'external' obligation often ceases to bind because the continuity condition fails. The distinction is empirical: does the agent feel the reason as authoritative, or as coercion? We shouldn't confuse social coercion with normative force."

  **Softest Spot:** This relies on introspection ("does the agent feel..."). Philosophers hate introspective criteria for normativity. Chen will call this psychological reductionism.

  ### Strategic Advice for the Q&A

  1.  **Defend the Continuity:** You flagged this as shaky. Do not wave it away. When Objection #2 comes (Diachronic Agency), slow down. Say: *"This is the crux of the paper. I'm arguing that continuity isn't metaphysical, it's motivational. If the motivational link breaks, the agent at $t_2$ is practically a different agent regarding that reason."* Own the radicalism.
  2.  **Handle Chen:** Don't try to convince Chen internalism is true. Concede that *moral realists* will hate your view, but argue your view explains the *phenomenology* of alienation better than externalism. Move the goalpost from "Truth" to "Explanatory Power."
  3.  **The Dad Factor:** If someone alludes to your personal situation, keep it brief. *"That scenario motivated the inquiry, but the argument stands on the temporal anchoring condition regardless of the specific content."* Do not get emotional; get technical.
  4.  **Terminology:** Be precise with "Binding" vs. "Existing." Your escape hatch is that external reasons *exist* but don't *bind*. Stick to that distinction relentlessly.

  Good luck. Keep your answers short. If you ramble, they will find the gap.
