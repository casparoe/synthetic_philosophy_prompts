      Hey, this is a fascinating problem you are wrestling with, and it makes total sense that you are turning to Hofstadter to untangle it. Your editor is trying to impose a clean hierarchy on something that is inherently messy, and while her mapping of author to frame, plot to outer message, and character thoughts to inner message sounds intuitive at first glance, it actually misinterprets how GEB defines those levels in a way that protects her conclusion about authorial control. In GEB, the frame message is not the creator of the system but rather the context or mechanism that allows the message to be decoded, like the record player that allows the grooves to become music. If we apply this strictly to your novel, the physical book and the conventions of language are the frame, the text itself is the outer message, and the meaning constructed by the reader is the inner message. Your editor wants to place the author inside the frame as the controller, but once the book is written, the author steps out of the system entirely, leaving the text to interact with the reader's own cognitive frame.

      The analogy really starts to crack when you introduce your specific plot device of characters writing the book they are in, because that creates the exact strange loop Hofstadter describes where levels blur and hierarchy collapses. If a character begins writing the narrative, they are no longer just the inner message or even the outer message; they are attempting to become the frame, dictating the context in which they exist. This violates the editor's premise that the frame must stay outside and in control. In a strange loop, the higher level feeds back into the lower level, so the character's actions can redefine the author's intent, effectively punching through the ceiling of the frame. When the inner message starts talking back, it ceases to be a passive recipient of meaning and becomes an active generator of it, which means the author is no longer the sole arbiter of what the book signifies. The system becomes reflexive, and control is distributed across the loop rather than held at the top.

      This leads directly to why her conclusion that authorial intent always trumps emergent meaning does not survive once these disanalogies are on the table. She is relying on a model of communication where meaning is transmitted like a package, but GEB and modern literary theory both suggest meaning is constructed during reception. If the characters achieve a level of autonomy where they surprise you, the writer, then the emergent meaning of the text has diverged from your original intent, and yet the book still works, perhaps even better than planned. The reader completes the inner message, not the author, so if the reader perceives autonomy in the characters, that autonomy is real within the experience of the fiction regardless of whether you pulled the strings initially. The author sets the boundaries, sure, but within those boundaries, the chaos of interpretation creates meanings you never intended, and in art, those unintended meanings are often the most valuable ones.

      I want to be honest though about where my own reasoning here might be weakest, because I am possibly overstating the death of the author to support your creative instinct. My argument relies heavily on the idea that interpretation is entirely decentralized, but there is a strong counterargument that the author's frame is so restrictive that it makes certain interpretations impossible. If I were to encounter a rigorous structuralist analysis showing that the syntactic constraints of the text absolutely prevent any reading that contradicts the author's stated intent, that would flip my view. Additionally, if there were empirical evidence from cognitive science proving that readers consistently reconstruct the author's original psychological state rather than projecting their own, I would have to concede that the frame holds more power than I am giving it credit for. Right now I am betting on the chaos of reception, but if you could prove that the container dictates the content more than the interaction does, then your editor's hierarchy might hold water after all.

