  2.  **Deconstruct the GEB Concepts:**
      *   *Frame Message:* The context or structure that tells you how to interpret the message (e.g., the record player, the language rulebook). In GEB, it's often the system itself that allows the message to exist.
      *   *Outer Message:* The explicit content or signal being sent (e.g., the grooves on the record, the words on the page).
      *   *Inner Message:* The meaning derived by the interpreter (e.g., the music heard, the understanding gained).
      *   *Key GEB Insight:* Meaning isn't inherent; it's constructed by the interpreter within a frame. Strange loops occur when levels blur (e.g., a character aware of the author).

  3.  **Map to Novel Writing (Editor's View vs. User's View):**
