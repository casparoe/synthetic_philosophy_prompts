  *   Let's check the truth of that statement in each waking:
      1.  **Heads-Mon:** Heads is True. Statement is **True**.
      2.  **Tails-Mon:** Monday is True. Statement is **True**.
      3.  **Tails-Tue:** Heads is False AND Monday is False. Statement is **False**.

  **The Update:**
  The experimenter telling you this true statement eliminates the possibility that you are in the **Tails-Tuesday** waking.
  *   Remaining Wakings: [Heads-Mon] and [Tails-Mon].
  *   Since these were originally equiprobable (1/3 each), they are now equally likely relative to each other.
  *   Probability of Heads = **1/2**.

  **The Answer:**
  If you adopt the principle that resolves your other inconsistencies (Thirderism), the answer to the variant is **1/2**.

