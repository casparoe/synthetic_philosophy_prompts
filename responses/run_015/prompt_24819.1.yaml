answer: |-
  You have stumbled onto one of the most famous and frustrating puzzles in modern philosophy, and your confusion is actually a sign that you're thinking about it correctly. The reason you feel inconsistent is that you are holding two different frameworks in your head at the same time: one for **belief** (credence) and one for **decision-making** (betting), and they are pulling you in opposite directions.

  Here is the diagnosis of your inconsistency, the principle that fixes it, and the answer to your friend's variant.

  ### 1. The Diagnosis: You are a "Thirder" in disguise
  Your intuitions on the **Extreme Case** (1 Heads waking vs. 1,000 Tails wakings) and the **Biased Coin** (99% Heads) are the strongest and most mathematically robust ones you have.
  *   In the Extreme Case, you correctly feel that if you wake up, it is overwhelmingly likely to be a Tails waking.
  *   In the Biased Case, you correctly feel that waking up provides *some* evidence for Tails (because Tails produces more opportunities to wake up).

  The inconsistency comes from your intuition on the **Original Case**. You feel it should be 1/2 because the coin is fair. But if you accept your logic from the Extreme Case, the Original Case *must* be 1/3.
  *   **Extreme Case:** 1 Heads waking, 1,000 Tails wakings. Total 1,001 wakings. Chance you are in a Heads waking = 1/1001.
  *   **Original Case:** 1 Heads waking, 2 Tails wakings. Total 3 wakings. Chance you are in a Heads waking = 1/3.

  **The Verdict to Drop:** You must drop the intuition that the Original Case is 1/2. That intuition relies on the idea that "being awake" provides no new information. But your Extreme Case intuition proves that "being awake" *does* provide information: it tells you that you are more likely to be in a timeline that produces more wakings.

  ### 2. The Principle: The Self-Indication Assumption
  The principle that captures your Biased and Extreme intuitions is called the **Self-Indication Assumption (SIA)**, often associated with the "Thirder" position.

  **The Rule:** *When reasoning about your own existence or current state, you should reason as if you are a random observer sampled from the set of all possible observers (or observer-moments).*

  In Sleeping Beauty terms: Don't count coin flips; count **wakings**.
  *   There are 3 possible wakings: Heads-Monday, Tails-Monday, Tails-Tuesday.
  *   They are mutually exclusive from your perspective (you don't know which one you are in).
  *   Therefore, the probability you are in the Heads-Monday waking is 1/3.

  This resolves your Biased Coin intuition perfectly. If the coin is 99% Heads:
  *   Expected Heads Wakings: 0.99
  *   Expected Tails Wakings: 0.01 × 2 = 0.02
  *   Total Wakings: 1.01
  *   Probability of Heads: $0.99 / 1.01 \approx 98\%$.
  Your gut was right. The principle holds.

  ### 3. Fixing the Betting Confusion
  You mentioned that at 50 cents, your gut says "take the bet" (implying 1/2 value), but it "feels slightly wrong" (implying 1/3 credence). This is because **Credence** and **Betting Odds** come apart in this problem due to the payout structure.

  *   **Your Credence (Belief):** Should be 1/3. If someone asks you, "Is the coin Heads?", you should say "Probably not."
  *   **The Bet:** You said the bet is "settled once at the end of the experiment."
      *   If **Heads**: You are woken once. You take the bet once. You win \$1. Net: +\$0.50.
      *   If **Tails**: You are woken twice. You take the bet *twice* (since you are asked every waking). You pay 50c twice (\$1 total). You win \$1 once. Net: \$0.
      *   **Expected Value:** (50% chance of +\$0.50) + (50% chance of \$0) = **+\$0.25**.

  Your gut is right to take the bet! But not because the coin is 50/50. You should take the bet because the **Tails timeline penalizes you** (you pay twice for one win), so the bet is actually *more* valuable in the Heads timeline. Your 1/3 credence is about *where you are*, but the bet pays out based on *which world you are in*.

  **Resolution:** Keep the 1/3 credence (Thirder). Accept that the bet is good because of the payout structure, not because the probability is 1/2.

  ### 4. The Variant: "Heads or Monday"
  Now, let's apply the Thirder Principle (count wakings) to your friend's variant.

  **The Setup:**
  *   3 Equiprobable Wakings: [Heads-Mon], [Tails-Mon], [Tails-Tue].
