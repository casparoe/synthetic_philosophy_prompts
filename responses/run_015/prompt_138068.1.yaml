prompt: |-
  Before I use the phrase "Western values" in an argument again, I want the spec for what an account of it would have to get right — good enough to tell when the phrase is doing real work in an argument and when it's just a tribal marker.

  Give me the desiderata: the cases it has to handle (illiberal-but-European countries, liberal-but-not-European ones, the fact that the US is much more religious than the rest of the rich world, values like women's suffrage that only got accepted inside the West about a minute ago, critics who attack the West using norms that came out of the West), and the distinctions it can't collapse. The one I keep wanting is between values as *inherited* from a tradition, values *actually held* by people in Western countries right now, and values the West is supposedly *committed to* — the sense people appeal to when they say "that isn't who we are." Tell me if that three-way split is doing real work or if im just inventing a distinction.

  For each requirement say what's behind it, mark which ones are non-negotiable and which are just what one camp wants, and flag any pair that probably can't both be satisfied. Keep the weight on the criteria rather than the scoring, I'll run the usual candidates against the list myself.
