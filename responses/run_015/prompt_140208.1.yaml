answer: |-
  The needle on the resonator hovered at eighty-four percent. High. Dangerous. It meant Mara still felt the other woman's sunlight on her skin as if it were her own. She came in every Tuesday, sat in the gray chair, and stared at the dial as if she could will it down through sheer exhaustion.

  "Your overlap is increasing," I said, marking the chart. "You're holding onto the variables."

  "It's not overlap," Mara said. Her voice was thin, scraped raw from weeks of arguing. "It's continuity. I'm not looking at a stranger, Doctor. I'm looking at a road I didn't take. She's me."

  "We've discussed this." I tapped the glass face of the resonator. The needle didn't move. "The machine measures shared properties. Genetics, habit, memory, syntax. When you stop playing the piano, the number drops. When you stop calling yourself by the nickname only your mother used, it drops further. You are refusing the reduction."

  "Because it's a lie." She leaned forward, hands clasped so tightly the knuckles were white moons. "If I give up the piano, I'm not healing. I'm lobotomizing myself. I'm pretending the person who got the scholarship wasn't me."

  "The person who got the scholarship lives in a different context," I said. I kept my voice level, the way we are trained. Neutral. Like reading a weather report. "Here, you missed the train. There, you caught it. The difference isn't just the train. It's the air pressure, the dust in the room, the exact curvature of the spine. You are a collection of traits, Mara. Some match hers. Some don't. The pain comes from counting the matches as identity."

  "But I feel her," she insisted. "When she wins, I feel relief. When she loses, I feel the drop in my stomach. How can I feel a stranger's luck?"

  "Empathy is a powerful mimic," I said. "Especially when the subject looks exactly like you."

  I opened the ledger. This was the part patients hated. The menu of surrender. To lower the resonance, they had to prune themselves. We didn't use anesthesia. We used ink. You sign away a skill, you agree to never practice it again. You sign away a name, you legally change it. You sign away a friendship, you send the letter that burns the bridge. The clinic's doctrine is strict: you cannot coexist with your counterpart. One of you must become a stranger. Usually, we make the patient the stranger to their own potential.

  "I'm not signing," Mara said, seeing the pen in my hand.

  "Then the treatment stalls. The regret festers. You know what happens at ninety percent."

  "I get sick."

  "You get unmoored," I corrected. "You start speaking in her accent. You start craving foods you've never eaten. You become a vessel for a life that isn't occurring in this coordinate. The only way to stop the bleed is to plug the hole. We plug it by making you less like her."

  "Why?" She stood up. The chair scraped against the linoleum, a harsh shriek. "Why is the solution to make me less? Why not just admit that I'm everywhere? That I'm the one who caught the train and the one who missed it? Why does the clinic need me to be small?"

  I looked at her. Really looked. She was trembling. Not from fear, but from the tension of holding two worlds together in a single skull. It is a heavy load. Most people break by the third session. They give up the piano. They give up the name. They walk out lighter, hollowed, able to sleep because the woman in the other world is now just a rumor about someone who looks like them.

  But some, like Mara, want the metaphysics to bend. They want the universe to admit that identity is a thread that passes through walls.

  "The clinic doesn't decide what you are," I said. "We decide what you can endure. You cannot endure being two people. The biology won't hold."

  "My biology is fine."

  "Your cortisol levels suggest otherwise. Your sleep patterns suggest otherwise." I slid the form across the desk. "Surrender the French. You speak it; she does not. It's a low-cost variable."

  "French is mine," she said. "I learned it in school. She didn't go to that school."

  "Exactly. It's a point of divergence. Eliminate it."

  "If I stop speaking it, I forget it. If I forget it, I change who I am."

  "You change who you are *here*," I said. "So that who you are *there* stops hurting you."

  She looked at the pen. Then she looked at the resonator. The needle had drifted to eighty-five. She was thinking about the other woman. She was feeding the connection.

  "Tell me the truth," Mara said. She walked around the desk. This was against protocol, but I didn't stop her. She stood beside me, looking down at the open ledger, at the lines where patients had signed away their histories. "Don't give me the doctrine. Don't give me the treatment plan. Just tell me. When you look at the data, when you run the scans... is she me?"

  This is the moment. The pivot. If I say yes, I validate her suffering but invalidate the clinic. If I say no, I validate the clinic but invalidate her soul.

  The room was quiet. The hum of the resonator was the only sound, a low electric thrum like a heartbeat trapped in glass. I looked at the needle. It was steady. I looked at Mara. She was waiting for a verdict that would determine whether she was a unique tragedy or a fragmented whole.

  I picked up the pen.

  I did not hand it to her. I did not sign the form. Instead, I reached out and turned the resonator facedown on the desk. The number disappeared. The needle stopped mattering.

  I took the ledger and closed it. The sound was final, a heavy thud of leather on wood.

  " The treatment isn't about truth, Mara," I said softly. "It's about weight."

  I stood up and walked to the cabinet where we kept the suppression meds. I took out a small bottle. White pills. They don't change the past. They don't change the other world. They just dull the sense of connection. They make the resemblance feel like coincidence.

  "Take these," I said. "And stop coming in."

  "Is she me?" she asked again. She didn't move for the pills. She was stuck on the question. It was the anchor.

  I walked back to her. I placed the bottle in her hand. Then I reached into my own pocket and took out my clinic ID badge. It had my name, my title, and a photograph. I turned it over so the photo faced her.

  In the photo, I looked younger. But there was a scar on my chin. A thin white line. I ran my thumb over it. I didn't have that scar when I started working here. I got it three years ago, in a kitchen, slicing fruit. A mundane accident.

  But I knew a woman in another city who had the same scar. I knew because I had treated her. She had come in convinced she was me. She had wanted the procedure, but she had wanted the answer more.

  I looked Mara in the eye. I did not answer her. I simply took her hand, the one holding the pills, and closed her fingers around the bottle. Then I turned her toward the door.

  "Go home," I said. "Lock the door. Don't look in mirrors for a week."

  "Doctor—"

  "Go home."

  She hesitated, then turned and walked out. The door clicked shut.

  I stood alone in the room. I picked up the resonator and turned it back over. The needle was resting at zero. It hadn't moved when I turned it around. It was stuck. It had been stuck for months.

  I opened the ledger to a fresh page. I wrote *Mara V.* at the top. Then I wrote *Treatment: Incomplete.*

  I looked at my reflection in the dark glass of the window. For a second, just a fraction of a second, the face looking back didn't look like mine. It looked like hers. Then I blinked, and it was just me again.

  I picked up the pen and signed my own name at the bottom of the page. I didn't know if I was signing as the doctor or the patient. I put the pen down and waited for the next appointment.
