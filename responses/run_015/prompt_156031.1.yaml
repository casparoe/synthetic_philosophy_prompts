      *   *Key Assumptions:*
          1.  **Bayesianism:** The agent updates via Conditionalization.
          2.  **Expected Utility Maximization:** The agent chooses actions to maximize expected utility relative to current credences.
          3.  **Costless Information:** The act of observation has no intrinsic cost (utility-wise).
          4.  **Option Retention:** The agent can choose any action available before the observation after the observation (including the action they *would* have taken).
          5.  **Ex-Ante Evaluation:** The value is calculated *before* receiving the information (expected value of the experiment).
          6.  **State Independence (often implicit):** The state of the world doesn't change *because* you looked (unless modeled as part of the state).
          7.  **Rationality Stability:** The agent remains a utility maximizer after receiving the info (no akrasia/weakness of will).

  3.  **Analyze the Dialogue (Jonah vs. Miriam):**

      *   *Jonah's Opening:* It's a theorem; premises must break. Counterexamples usually involve non-free info or changed options.
