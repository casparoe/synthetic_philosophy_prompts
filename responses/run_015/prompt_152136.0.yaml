      *   Check the constraint: "Neither can leave until they have addressed the other's last point." This adds urgency to the end.

  8.  **Drafting the Content (incorporating constraints):**
      *   *Start:* The hum of the ventilation. The locked door.
      *   *Middle:* The example of the surgeon or the judge? Let's use a judge. Intuitive sense of mercy vs. rigid sentencing guideline derived from ideal theory.
      *   *Echo:* The intuition says "leniency" based on pattern recognition. The rule says "severity" based on abstract justice. The agent doesn't know *why* the intuition says leniency (opacity).
      *   *Elena:* The ideal deliberator would reconcile this.
      *   *Marcus:* The ideal deliberator can't exist if the data is siloed.

  9.  **Polishing:**
      *   Remove tag-heavy dialogue. Use action beats.
      *   Ensure the philosophical terms are used correctly but naturally.
