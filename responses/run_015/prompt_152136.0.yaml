      *   Setting utilized? Yes.
      *   Tone formal/atmospheric? Yes.

  *(Self-Correction during drafting)*: Initially, I might make Elena too dismissive of the opacity. I need to make sure she acknowledges it but frames it as *integrable*. Marcus needs to argue it's *constitutive* of the failure, not just a bug. The ending needs to feel like a pause, not a resolution, but satisfying the "addressed the last point" condition.

