answer: |-
  The ventilation hummed, a low, steady drone that seemed to press against the silence of the archive stacks. Outside, the city was dark, but inside the restricted section, the lights were locked on a midnight setting. The door behind them had clicked shut an hour ago, engaging the magnetic seal that would not release until the security system registered a verbal resolution to the logged dispute.

  Marcus leaned against a steel shelving unit, rubbing the bridge of his nose. He looked at the stack of papers between them, then back to Elena.

  "You're treating the fracture as a surface phenomenon," Marcus said, his voice quiet but carrying easily in the dead air. "When I describe the deliberative echo, you hear static. I'm telling you it's a structural load-bearing failure."

  Elena sat on a wooden stool, her posture straight, hands folded in her lap. She didn't look at the door. "I hear you, Marcus. But you assume that because a subsystem operates opaquely—because the heuristic module doesn't 'know' the utilitarian calculus behind the rule—it constitutes a separate agent. It doesn't. It's a component within a single field."

  "A component that fires against the system's own command structure," Marcus countered. "Imagine the judge who has internalized the idealized sentencing framework. She knows the rule. But her pattern-recognition module, trained on years of case law before the reform, flashes a red signal: *'Too harsh.'* That module doesn't have access to the new normative framework. It only sees precedent. It issues a local prescription: *'Mitigate.'* The global procedure says: *'Enforce.'* That conflict isn't noise. It's the sound of the agent coming apart."

  "But the agent feels the conflict," Elena said, leaning forward slightly. "That affective tension *is* the access point. The discomfort of the echo is what summons the higher-order deliberation. Indirect normativity doesn't require every subsystem to be transparent at every millisecond. It requires that the agent, upon reflection, can endorse the procedure that resolves the echo."

  "Upon reflection," Marcus repeated, tasting the words. "By which time the action is often already fractured. Or worse, the reflection itself is hijacked. If the heuristic module is opaque, it can feed biased data into the reflection without the reflective module knowing the source. You call it correctable noise. I call it a blindness that makes idealization impossible. You cannot idealize a unity that isn't there."

  Elena stood up and walked slowly down the aisle, her fingers brushing the spines of the bound volumes. "You're conflating psychological unity with informational transparency. I don't need the heuristic module to understand the normative framework. I only need the *agent* to possess a mechanism for adjudicating the conflict. The idealized deliberator isn't the sum of the parts speaking in unison. It's the governance structure that manages the discord."

  "And when the governance structure lacks the keys to the room where the discord is happening?" Marcus pushed off the shelf, stepping into the aisle to face her. "That's the echo. The local prescription arises from a context the global procedure cannot see. If I tell you 'Don't eat the berry,' and your gustatory subsystem screams 'Sweet,' but doesn't tell you *why*—maybe it's detecting a toxin mimicry—you act on the scream. Your idealized deliberation is bypassed. The opacity isn't just a lack of data; it's a barrier to normativity."

  "Then the idealization was insufficiently robust," Elena said, turning to face him. "If the gustatory subsystem can bypass the normative rule, the rule wasn't properly internalized. Indirect normativity accounts for this. We build the ideal procedure to anticipate the echo. We train the intuition. The 'noise' becomes part of the signal. The discomfort of the echo is calibrated to align with the violation of the rule, not the satisfaction of the impulse."

  "You're describing a happy coincidence, not a structural guarantee," Marcus said. "You're assuming the training succeeds. But the deliberative echo proves it often doesn't. Consider the emergency responder. She has a protocol for triage—idealized, impartial, utilitarian. But her modular fear response locks onto the crying child, not the three unconscious adults. The fear module doesn't know the triage protocol. It just knows *proximity* and *distress*. It issues a prescription: *'Save the child.'* The protocol says: *'Save the three.'* She freezes. The echo isn't correctable in the moment. It destroys the coherence of the action."

  "She freezes," Elena acknowledged, her voice steady. "But why does she freeze? Because both prescriptions are claiming authority over the same agent. That struggle for authority proves the unity of the field. If they were truly separate agents, there would be no conflict, only parallel actions. The friction *is* the evidence of the single deliberative field. The idealization lies in how she resolves the freeze. Does she have a meta-rule for when intuition overrides protocol?"

  "And where does that meta-rule come from?" Marcus asked sharply. "If it comes from another opaque module, you've just kicked the can down the road. If it comes from reflection, you've admitted that direct evaluation is doing the work, not the indirect rule. In that moment of freeze, the protocol has failed. She is no longer following the indirect norm. She is directly evaluating the child versus the three. The echo forced her out of indirect normativity and back into direct calculation."

  Elena paused. The hum of the ventilation seemed to grow louder in the silence. "Not necessarily. She could be accessing a higher-order indirect norm. A rule about when to trust intuition. 'In high-stress environments with incomplete data, weight emotional salience higher.'"

  "But who wrote that rule?" Marcus pressed. "If it was written by the idealized deliberator, then the deliberator knew about the opacity beforehand. But if the deliberator knows about the opacity, it knows it cannot fully control the subsystems. So the idealization isn't a model of unified agency. It's a model of managed fragmentation. And if it's managed fragmentation, why pretend the unity exists at all? Why not admit that we are directly evaluating the management strategy itself, rather than following a unified ideal?"

  "Because the goal remains unified," Elena said, her tone hardening slightly. "The fragmentation is instrumental. The echo is a bug in the implementation, not the theory. You're taking the limitations of human cognitive architecture and treating them as metaphysical barriers to normativity. I'm saying the normative force holds even if the machinery rattles."

  "The machinery doesn't just rattle, Elena. It steers," Marcus said, walking back to the table and resting his hands on the wood. "When the subsystem lacks access to the normative framework, it isn't just rattling; it's operating under a different law. The fear module operates on survival logic. The triage protocol operates on utilitarian logic. When they conflict, you don't have one agent with a noisy signal. You have two logics fighting for the wheel. If you claim indirect normativity holds, you must claim the utilitarian logic *should* win. But if the survival logic wins—which it often does in high stress—then the normative framework you claimed was guiding the action was actually irrelevant. The echo reveals that the idealization was never in control."

  Elena walked back to the stool but didn't sit. "Irrelevant to the outcome, perhaps. But not to the justification. We judge the agent by the procedure they *endeavored* to instantiate, not merely by the subsystem that fired last. If the responder fails because the echo overwhelmed the protocol, we say she failed the ideal. We don't say the ideal was nonexistent. The existence of the conflict presupposes the authority of the ideal. She feels guilt, Marcus. Why guilt? Because she recognizes the protocol's claim over her, even if her modules failed to execute it."

  "Guilt is just another echo," Marcus said softly. "It's the punitive subsystem reacting to the violation of a social heuristic. It doesn't prove the validity of the utilitarian protocol. It just proves you have another module shouting louder. You're building a castle on a swamp and calling the sinking 'correctable noise.' I'm saying the ground won't hold. If opacity is inherent—if I cannot fully know why my intuition screams—then I cannot idealize my deliberation. I can only directly evaluate the outcomes of my fragments. I have to look at the action itself, not the procedure I hoped was driving it."

  "But direct evaluation is impossible without a framework," Elena argued. "How do you evaluate the outcome directly? You need values. Where do those values come from? If not from a deliberative procedure that attempts to unify your commitments, then from where? Whim? If you abandon the unified idealized field because of the echo, you have no ground to stand on to criticize the echo. You just have one module preferring what another module did."

  "I criticize based on coherence of outcome," Marcus replied. "I don't need a unified *agent* to see that saving three lives is better than saving one. I don't need to pretend my fear module agrees with me. I just need to acknowledge that my fear module is a force I must constrain, not a voice I integrate into a 'single field.' You want to absorb the echo into the deliberation. I say the echo proves deliberation is a post-hoc narrative we tell ourselves to mask the civil war."

  Elena looked at the door. The light above it was still red. "If it's a civil war, then peace is impossible. You're left with power struggles between modules. That's not ethics; that's hydraulics. Indirect normativity offers the possibility of peace. It says we can train the modules. We can dampen the echo."

  "By using direct evaluation to rewrite the code," Marcus shot back. "Which proves my point. The work is done by direct scrutiny of the modules, not by deferring to an idealized procedure. You're using direct reason to fix the indirect system. So the indirect system is subordinate. It's a tool, not a foundation."

  "It's a scaffold," Elena corrected. "You don't tear down the scaffold because the builders stumble. You reinforce it. The deliberative echo tells us where the scaffold is weak. It doesn't tell us to build without one."

  "But if the scaffold is made of the same wood as the builders," Marcus said, picking up a pen and tapping it against the table, "and the wood is rotten with opacity, then reinforcing it is futile. You need a different material. You need to stop pretending the deliberation is unified. Acknowledge the fragmentation. Evaluate the actions directly based on their impact, not their fidelity to a procedure that never actually held the reins."

  Elena fell silent for a long moment. She looked at the pen in his hand, then at his eyes. "If we do that, Marcus, if we abandon the unified ideal... then when the modules conflict, there is no 'us' to decide. There is only the conflict. To choose the impact over the procedure is still a procedure. You are privileging the outcome module over the rule module. That is still a hierarchy. And who establishes the hierarchy?"

  "Reality establishes the hierarchy," Marcus said. "Consequences don't care about our internal coherence. If the fear module saves the child and the utilitarian module wanted the three, the world records two deaths. The echo doesn't matter to the dead. It only matters to the agent's self-conception. You are protecting the agent's self-conception. I am protecting the world from the agent's fragmentation."

  "And yet," Elena said, her voice dropping, almost a whisper, "you are using a unified argument to tell me this. You are assuming *you* can weigh the consequences, that *you* can speak for the truth of the matter. If fragmentation is total, Marcus, your argument is just another echo. Why should I listen to your module over mine?"

  Marcus stopped tapping the pen. He set it down carefully on the table. The silence stretched, heavy and absolute.

  "Because," he said slowly, "my module is currently arguing for the cessation of the illusion. Yours is arguing for its preservation. The conflict between us is an externalized deliberative echo. And right now, the door won't open until we resolve it."

  "The door opens," Elena said, looking up at the sensor, "when we address the last point. You claimed direct evaluation protects the world. I claimed it lacks authority without a unified agent to endorse it. You haven't answered how you establish authority without unity."

  Marcus looked at the door, then back to her. "I don't establish authority. I establish necessity. We don't need authority to stop bleeding. We need pressure. Direct evaluation is pressure. Idealization is the story we tell about why we applied it."

  Elena nodded slowly. "Then we are left with this: You offer pressure without a hand to apply it. I offer a hand that sometimes shakes."

  "Better a shaking hand than a ghost," Marcus said.

  "Better a ghost than a void," Elena replied.

  She looked at the sensor. The light flickered, amber for a moment, then shifted to green. The magnetic lock disengaged with a heavy clunk.

  Neither moved immediately. The hum of the ventilation continued, indifferent to the resolution.

  "Tomorrow," Elena said, gathering her papers. "We test the triage case. Concrete data on resolution times."

  "Tomorrow," Marcus agreed, pushing away from the table. "But bring the data on the guilt responses, too. I want to see the cost of the echo."

  "You'll see the cost of integration," she said.

  "We'll see," he replied, opening the door. "We'll see which noise drowns out the other."
