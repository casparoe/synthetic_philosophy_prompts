      *   *Elena's Counter:* She needs to argue that idealization *includes* the process of resolving the echo. It's noise, not structural failure.
      *   *Marcus's Rebuttal:* If the subsystems are opaque to each other, the "ideal" observer doesn't exist. You can't idealize what isn't unified.
