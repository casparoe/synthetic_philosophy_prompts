          *   Niche Concept: "Deliberative Echo" (modular subsystem lacks access to normative framework of another, issuing conflicting local prescriptions).
          *   Elena's Stance: Indirect normativity can absorb echoes as correctable noise within a single deliberative field.
          *   Marcus's Stance: Opaque cross-modular conflicts undermine transparency/unity of idealization, forcing return to direct evaluation.
          *   Tone/Style: Philosophical novel (precise, atmospheric, distinct voices, concrete examples, formal/polished).
          *   No citations/bibliographies.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Indirect Normativity (Elena):** We shouldn't aim directly at the good/right in every action. Instead, we aim at ideals (virtues, rules, procedures) that *track* the good. Idealized deliberation is the method to find these ideals. It assumes a unified agent who can reflectively endorse these procedures.
      *   **Opacity/Fragmentation (Marcus):** The mind isn't fully transparent or unified. Subsystems operate with different information/norms. If part of me doesn't know *why* I'm following a rule (opacity), the "idealized deliberation" is a fiction. The conflict (echo) shows the system is broken, not just noisy.
      *   **Deliberative Echo:** Specific mechanism. Subsystem A (e.g., intuitive/heuristic) prescribes X. Subsystem B (e.g., reflective/normative) prescribes Y because it doesn't see A's data or framework. The "echo" is the conflict resounding through the agent.

  3.  **Setting the Scene:**
