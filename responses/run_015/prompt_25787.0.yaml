answer: |-
  Good evening. For those who don't know me, I'm [Your Name], one of [Advisor's Name]'s graduate students.

  Standing here, I'm aware of a unique challenge. About half of you are philosophers who could recite Frank Jackson's 1982 paper in your sleep. The other half are [Partner's Name]'s family, who just want to enjoy the open bar. My goal tonight is to bridge that gap without betraying [Advisor's Name]'s life's work. And she has been very clear: no cheap shots.

  For the family: [Advisor's Name] is famous for defending a thought experiment called "Mary's Room."

  Imagine Mary, a brilliant neuroscientist. She knows every single physical fact about color vision. She knows how light wavelengths hit the retina, how neurons fire, every chemical reaction in the brain. But, Mary has lived her entire life in a black-and-white room. She has never actually *seen* color.

  The question is: When Mary finally steps out and sees a red rose for the first time, does she learn something new?

  [Advisor's Name] has spent thirty years arguing "Yes." She argues that knowing all the *facts about* an experience is not the same as having the *experience itself*. There is something about "what it is like" to see red that cannot be captured in a textbook, no matter how thick. Physical data is incomplete without the lived reality.

  Now, why does this matter for a wedding?

  It is tempting to make the cheesy joke that [Advisor's Name] has finally "experienced love" for the first time. But that would be philosophically sloppy, and she'd never forgive me. She knew love before today.

  The real connection is this: Her entire career has been a defense of the reality of subjective experience. In a world that often tries to reduce everything to data points, algorithms, and biological functions, she has stood up and said, "No. The feeling itself matters. The 'what it is like' is real."

  And that is what we are celebrating tonight.

  You can read [Advisor's Name] and [Partner's Name]'s biographies. You can know the physical facts: where they met, what they do for work, their genetic histories. But those propositional facts do not capture the reality of *them*. They don't capture the quality of their laughter, the specific comfort of their silence, or the texture of their life together.

  Mary left her room alone. But [Advisor's Name] and [Partner's Name] are doing something better. They are committing to building a shared world of experience. They are promising to prioritize the "what it is like" over the "what is known."

  So, for the philosophers: This toast is not an argument against physicalism. It is an affirmation of the explanatory gap that makes intimacy possible.

  And for the family: This is a promise that they value how life *feels*, not just how it looks on paper.

  Please raise your glasses. To [Advisor's Name] and [Partner's Name]. May your life together be full of new facts that no textbook could ever teach you.

  To the couple!
