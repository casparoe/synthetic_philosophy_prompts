answer: |-
  # The Replaceability-Weighted Suffering Audit (RWSA)

  This is a 20-minute triage tool. It is not a moral truth machine; it is a consistency check for your specific ethical framework ("net-suffering with replaceability"). It forces you to separate empirical data (how many die) from ethical weighting (how much that death counts).

  ### The Commitments
  To make this runnable in 20 minutes without a database, I have made three hard commitments for you. You cannot change these mid-audit.

  1.  **The Replaceability Weight:** Farmed animals count at **1.0** (100%). Wild animals count at **0.1** (10%).
      *   *Defense:* Farmed animals are brought into existence solely to be killed; their suffering is directly purchased. Wild animals are collateral damage; they would largely exist regardless of this specific meal. This 10x discount reflects the "replaceability" gap without requiring complex population modeling.
  2.  **The Wild-Value Default:** Wild lives are assumed **Net Positive**.
      *   *Defense:* Claiming a wild life is "not worth living" (Net Negative) requires evidence of chronic, unmitigated agony (e.g., rampant disease, starvation). Standard ecology suggests homeostasis. The burden of proof is on the claim that a life is a net negative. Therefore, killing a wild animal is treated as a *harm* by default.
  3.  **The Unit of Measure:** **Sentient Deaths per 1,000 Calories.**
      *   *Defense:* Weight is too variable (bone vs. muscle). Calories are the functional unit of food energy. We count individuals, not biomass, because your principle focuses on "suffering subjects."

  ---

  ### The Procedure (5 Steps)

  **Step 1: Standardize the Claim**
  Convert the comparison to **1,000 Calories** of each food source.
  *   *Stop Condition:* If the claim is vague (e.g., "eating meat" vs. "eating plants"), ask for specific proxies (e.g., "Feedlot Beef" vs. "Wheat"). If they can't specify, **Claim Fails** (too ambiguous to audit).

  **Step 2: The Farmed Floor (The Certainty Layer)**
  Estimate the number of farmed animals slaughtered to produce 1,000 calories.
  *   *Heuristic:* Beef = ~0.002 cows (1 cow yields ~500,000 kcal). Chicken = ~0.05 birds (1 bird yields ~20,000 kcal). Plants = 0.
  *   *Calculation:* Multiply count by **1.0**.
  *   *Stop Condition:* If Option A has >10x the farmed deaths of Option B, Option B wins immediately unless Step 4 overrides. (This rarely happens).

  **Step 3: The Wild Estimate (The Ecology Layer)**
  Estimate wild animal deaths per hectare required to produce those 1,000 calories.
  *   *Heuristic:* Crop Harvest (wheat/soy) = ~10–20 small mammals/birds per hectare (combine harvester mortality). Pasture (Beef) = ~1–2 small mammals per hectare (habitat displacement/mowing).
  *   *Adjust for Yield:* Beef requires ~20x more land per calorie than crops.
  *   *Calculation:* (Land Needed × Death Rate) = Total Wild Deaths.

  **Step 4: The Wild-Value Gate (The Values Flag)**
  **STOP.** This is where math ends and ethics begins.
  *   *Ask:* "Is there specific evidence that the wild animals in this system live Net Negative lives?"
  *   *Rule:* If **No** (Default) → Multiply Wild Deaths by **0.1** (Harm Weight).
  *   *Rule:* If **Yes** (e.g., pesticide-drenched monoculture with documented suffering) → Multiply Wild Deaths by **-0.1** (Benefit Weight).
  *   *Journalistic Note:* If you cannot verify "Net Negative" in 5 minutes, you **must** use the Default (Net Positive). Flag this in your article as an assumption.

  **Step 5: The Tally**
  *   **Score** = (Farmed Deaths × 1.0) + (Wild Deaths × Wild Weight).
  *   **Lower Score = Less Suffering.**
  *   *Verdict:* If the difference is <20%, call it a **Tie/Insufficient Data**. If >20%, the lower score wins.

  ---

  ### Running the Claims

  #### Claim 1: "Switching from Beef to Chicken saves suffering because fewer sentient beings die per calorie."

  **Step 1:** 1,000 Calories Beef vs. 1,000 Calories Chicken.
  **Step 2 (Farmed Floor):**
  *   Beef: ~0.002 cows. (Score: 0.002)
  *   Chicken: ~0.05 birds. (Score: 0.05)
  *   *Observation:* Chicken requires ~25x more individual deaths per calorie than beef.
  **Step 3 (Wild Estimate):**
  *   Beef Land Use: High (~20x crops). Wild deaths via displacement/harvest of feed: ~0.4 equivalent small animals.
  *   Chicken Land Use: Moderate (~3x crops due to feed). Wild deaths: ~0.6 equivalent small animals.
  **Step 4 (Wild-Value Gate):**
  *   Default Assumption: Wild lives are Net Positive.
  *   Weight: 0.1.
  *   Beef Wild Score: 0.04.
  *   Chicken Wild Score: 0.06.
  **Step 5 (Tally):**
  *   **Beef Total:** 0.002 (Farmed) + 0.04 (Wild) = **0.042**
  *   **Chicken Total:** 0.05 (Farmed) + 0.06 (Wild) = **0.11**

  **Verdict:** **Claim Fails.**
  Under this procedure, **Beef results in less calculated suffering than Chicken.**
  *Why you won't like this:* You likely promote chicken as the "responsible meat." This procedure highlights that while beef uses more land, the sheer volume of individual chicken lives created and slaughtered (the Replaceability Weight) dominates the equation. The "fewer beings die" premise is factually false per calorie; *more* beings die, they are just smaller.

  ***

  #### Claim 2: "Vegan staples kill more wild animals via crop harvest than beef does via pasture, so beef is actually lower-suffering."

  **Step 1:** 1,000 Calories Wheat (Vegan) vs. 1,000 Calories Beef.
  **Step 2 (Farmed Floor):**
  *   Wheat: 0 farmed deaths.
  *   Beef: 0.002 cows. (Score: 0.002)
  **Step 3 (Wild Estimate):**
  *   Wheat Land Use: Low (1 hectare unit). Harvest deaths: ~15 small animals.
  *   Beef Land Use: High (20 hectare units). Pasture/Feed deaths: ~20 small animals (displacement + feed crop harvest).
  *   *Note:* Even though pasture kills fewer per acre, beef needs so many more acres that the total wild death count is often higher or comparable.
  **Step 4 (Wild-Value Gate):**
  *   Default Assumption: Wild lives are Net Positive.
  *   Weight: 0.1.
  *   Wheat Wild Score: 1.5.
  *   Beef Wild Score: 2.0.
  **Step 5 (Tally):**
  *   **Vegan Total:** 0 (Farmed) + 1.5 (Wild) = **1.5**
  *   **Beef Total:** 0.002 (Farmed) + 2.0 (Wild) = **2.002**

  **Verdict:** **Claim Fails.**
  While the wild animal death count is significant for vegan staples, the sheer land inefficiency of beef means it still displaces/kills more wild animals *in total*, even before counting the cow itself.
  *However,* notice the gap: 1.5 vs 2.0. It is closer than the Farmed Floor suggests.

  ***

  ### Where You Are Still Smuggling Judgments

  This procedure cannot settle the **Wild-Value Gate**.

  In Claim 2, if you decide that a field mouse living in a pesticide-sprayed wheat monoculture has a **Net Negative** life (Step 4 = -0.1), the math flips.
  *   **Vegan Wild Score:** 15 deaths × -0.1 = **-1.5** (A benefit).
  *   **Vegan Total:** **-1.5**.
  *   **Beef Total:** **2.002**.
  *   **New Verdict:** **Veganism is vastly superior.**

