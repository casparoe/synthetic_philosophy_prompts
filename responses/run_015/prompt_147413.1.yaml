answer: |-
  Two years ago, a source handed me a drive containing a technical annex. It was four hundred pages long. Every citation was real. Every individual claim was defensible. The internal logic held together under a casual read. I checked the steps I could check. I published the story. The document was wrong.

  It was not wrong because of a lie. It was wrong because a term shifted its scope somewhere between the second and the seventh section. The conclusion only looked like it followed because nobody was holding the whole thing in mind at once. There was no line I could have circled with a red pen. There was no single moment where the argument broke. The break was a property of the whole, not the parts.

  I tell you this because my entire professional authority rests on the assumption that a literate generalist, given time and documents, can tell a good argument from a bad one. I am here because you are stress-testing that assumption. You are building systems where two models argue a question before a judge, on the bet that it is cheaper to expose a bad argument than to build one that survives exposure. If that bet fails, if an argument can be defective in a way the judge cannot find, then the thing I have been doing for twenty years is a special case that happens to have worked, not a method that generalizes.

  I am not here to confess. I am not here to tell you my trade is obsolete. I am here to suggest that we are all standing on the same ice, and we need to know how thick it is.

  To do that, we need a sharper vocabulary for failure. In my newsroom, and I suspect in your labs, we tend to treat errors as a single category: something is wrong. But based on what I have seen, and what I hear you discussing, I propose we distinguish three kinds of defects.

  The first is a localizable defect. A particular step is wrong and can be shown to be wrong on the page. It is a math error in line four. It is a citation that leads to a dead end. In a debate protocol, this is the easy win for the challenger. The judge does not need to know the subject; they only need to see that the step does not follow. This is where the asymmetry holds. It is easier to break a leg than to build one.

  The second is a localizable but expertise-gated defect. One step is wrong, and a specialist would see it in a minute. But the judge, in these ten minutes, cannot. The gap between findable and findable-by-this-judge is exactly what a dishonest arguer can aim at. Here, the loss curve gets noisy. The judge might rule against a correct argument because it sounds complex, or for a wrong one because it sounds simple. This is where training signals degrade.

  The third is a distributed defect. Nothing is wrong anywhere locally. The wrongness is a property of the whole. It is a scope shift. It is a presupposition that does no work until it has been leaned on four times. It is a conclusion that follows only if you forget what the terms meant at the start. In cross-examination, there is no single step to attack. You cannot point to a line. You have to hold the entire structure in working memory and feel the drift.

  My sense, which I offer for you to test rather than ratify, is that the experimental results you are proud of are mostly won on arguments of the first kind. The second kind is where the training signal gets noisy in ways that are hard to see. The third kind is where cross-examination has no move at all. If that is right, then the inference from "debate works" to "debate scales" is resting on an untested step.

  I cannot tell you if this method compounds. I do not know. The program officers in the room are deciding next spring whether to renew this program. I am not here to pitch for renewal, and I am not here to hint that it should be wound down. I am here to say that the honest version of this inquiry cannot promise that we would notice if it failed. The whole worry is that the failure is silent. Any line of reasoning that suggests "we'll see it when it breaks" quietly denies the premise I have just asked you to take seriously.

  So why does this matter to a room of people who are not building models? Why should a philosopher or a funder care about the distinction between a localizable error and a distributed one?

  Because this is not just a problem for machines. It is a problem for institutions. When a government releases a risk assessment, when a corporation publishes a sustainability report, when a newsroom publishes an investigation based on leaked technical data, we are acting as judges. We are relying on the asymmetry between building and checking. We assume that if the argument were wrong, someone could show us the line.

  But if distributed defects are real, then our institutions are vulnerable to a specific kind of capture. Not by lies, but by drift. A policy can be consistent in every section and catastrophic in its whole. A model can be aligned in every test and misaligned in deployment. The mechanism is the same: the complexity of the whole exceeds the attention of the judge.

  I realize that standing between a room of people who build intelligence and a room of people who fund it, I was told the goal of tonight was to relax. I have prepared fifteen minutes on epistemic vulnerability. I assume this is what passes for relaxation in this sector.

  But there is affection in this critique. I am not prosecuting journalism. I am saying that my trade is a parallel instance of the problem you are solving. If you find a way to catch distributed defects in machine debate, you might find a way to catch them in policy. If you find that it cannot be done, we need to know that too. We need to know that there are arguments we cannot verify, only trust.

  This brings me to the limit of what I can say. I am a journalist. I deal in claims that can be printed. You deal in systems that can be run. There is a temptation to demand a verdict. Did the experiment work? Will the oversight scale? I cannot give you that verdict. To do so would be to pretend I understand the loss curve better than the people who wrote it.

  But I can offer a constraint. Do not let the success on localizable defects convince you that you have solved distributed defects. Do not let the ability to catch a math error convince you that you can catch a scope shift. The second is not just a harder version of the first. It is a different category of problem.

  If you treat them as the same, you will build a system that is robust against lies but fragile against drift. And if you bring that system into the world, you will give people a false sense of security. They will believe the argument was checked, when only the steps were checked.

  This is where the philosophers in the room earn their airfare. You are here to poke at the foundations. Ask whether "truth" in this context is a property of the argument or a property of the judge's belief. Ask whether a judge who cannot distinguish a Type 2 defect from a correct argument is actually judging anything at all. Do not let us settle for a pragmatic win if the epistemic foundation is rot.

  And this is where the funders earn their anxiety. You are betting on a method. But you are also betting on a theory of knowledge. If the theory is wrong, the method will not save you. You need to know if you are buying a tool or a promise.

  I am not here to tell you the theory is wrong. I am here to tell you that it is untested in the domain that matters most. The domain where the error is invisible to the judge.

  We are all judges now. Whether we are editing copy, reviewing code, or allocating capital, we are relying on the idea that bad arguments are easier to expose than good ones. That idea has served us well in the past. But the past was simpler. The arguments were shorter. The terms did not shift as fast.

  If we are entering a world where arguments are generated faster than they can be held in mind, we need a new epistemology. We need to know what we can verify, and what we must only trust. And we need to know the difference.

  I do not have the answer. None of us do. But if this workshop does nothing else, let it define the limits of the judge. Let it tell us where the red pen stops working. Because if we do not know where the pen stops, we will keep drawing circles around nothing.

  Thank you.

