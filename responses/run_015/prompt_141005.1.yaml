          *   Solving "Justification" in the absolute sense.

      *   *Conditions of Defeat:* What would make me change my mind? E.g., if ML theory proves OOD is purely data-dependent, or if philosophers prove Grue is purely linguistic.

  6.  **Fleshing out the Argument (The "Defended Allocation"):**
      *   Need to be firm. The user asked for a *defended* allocation.
