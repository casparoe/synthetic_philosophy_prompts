          2.  The 4-Question Agenda (Ordered).
          3.  The "Do Not Touch" List.
          4.  Conditions of Defeat.
          5.  Hume vs. Goodman distinction.

  7.  **Addressing Specific User Points:**
      *   *Tractability:* Philosophers can handle logic/semantics; ML folks handle architecture/loss landscapes. The intersection is "Inductive Bias as Entrenchment."
      *   *Crowded/Neglected:* Bayesian solutions are crowded. Latent space geometry as entrenchment is neglected.
      *   *Difference to Practice:* If we can't map projectibility to loss functions, the grant is useless.
      *   *Conflicts:* Tractability pulls toward formal ML; Impact pulls toward normative philosophy. Resolution: Focus on *mapping* norms to architectures.

  8.  **Final Polish:**
