      *   *Refining the Questions:*
          *   *Q1 (The Translation):* Is "Grue" just "Out-of-Distribution (OOD) Shift"? If yes, the New Riddle collapses into standard ML theory. If no, what's the residue? (Merges User's i & iii).
          *   *Q2 (The Bias):* In ML, "inductive bias" is descriptive (what the net does). In Phil, "projectibility" is normative (what it *should* do). How do we bridge this? (Refines User's iv & v).
          *   *Q3 (The Vocabulary):* Does the architecture impose a "privileged vocabulary" (like entrenchment) via its latent space geometry? (Refines User's i).
          *   *Q4 (The Intervention):* If we identify a "grue-like" failure mode, can we fix it by changing the prior, the data, or the architecture? (Practical payoff).

      *   *Selecting the "Avoid" List:*
          *   Hume's Problem (Old Riddle).
