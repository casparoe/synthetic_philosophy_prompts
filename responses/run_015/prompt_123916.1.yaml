      *   *Check:* Did I address the "smuggling in" accusation? Yes, point out that all definitions smuggle in ontology.
      *   *Check:* Is the distinction between "operational units" (OTUs) and "natural kinds" clear? I should use the term "lineage" as the real thing, and "species" as the name we give segments of lineages.
      *   *Check:* Confidence levels. I need to be careful not to sound like I'm delivering a final verdict from on high, because philosophers still fight about this. I will frame it as "Here is where the consensus weight lies."

  7.  **Final Polish:** Check against the specific constraints one last time. (No reading list, mention names only if helpful, bet on answer, single consideration for mind change).

      *(Self-Correction on Names)*: I should mention Ghiselin or Hull regarding species-as-individuals, as it's the strongest counter to the friend's "species-as-classes" assumption. I should mention Ereshefsky regarding pluralism. But keep it light.

      *(Self-Correction on the "Bet")*: I need to quantify or qualify my confidence. "80% confident" or "High confidence on X, moderate on Y." Let's go with a qualitative betting metaphor as requested ("How much of your own answer you'd bet on").

      *(Mind Changer)*: What would actually make species unreal? If the tree of life is actually a web everywhere, not just at the tips. If horizontal gene transfer is the rule, not the exception, even in macrobes.

