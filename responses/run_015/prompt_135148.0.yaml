answer: |-
  **Scenario**

  The village hall committee must book a marquee for the summer fete, which cannot be moved once set up. They have two suppliers. Supplier A is established, with ten years of local weather logs showing their structures hold firm in high winds 70% of the time. Supplier B is new to the area; they have no local logs, but the committee's engineer has inspected their design and certifies it also has a 70% chance of holding firm. The hire cost is identical, and the financial loss if the marquee collapses is the same in both cases. The committee is certain the 0.7 figure is correct for both suppliers. They must choose one now.

  **The Analysis**

  *   **Belief and Number:** The probability of success (marquee stands) is 0.7 for both Supplier A and Supplier B.
  *   **Evidence Bases:** Supplier A rests on a large weight of evidence (ten years of statistics). Supplier B rests on a low weight of evidence (one expert inspection, no history).
  *   **Expected Utility Verdict:** Indifferent. Since the probability of success (0.7) and the value of the outcomes (profit if it stands, loss if it falls) are identical, the calculation $0.7 \times \text{Gain} + 0.3 \times \text{Loss}$ yields the exact same number for both options. Plain expected-utility reasoning says there is no rational basis for preferring one over the other.

  **The Weight Consideration**

  *   **Recommendation:** Choose Supplier A (the high-weight option).
  *   **Reasoning:** Even though the probability is the same, the conclusion for Supplier A is more robust. We feel less uneasy betting on the established firm because the 0.7 is grounded in actual performance rather than theoretical assessment. The weight of evidence makes the probability feel more secure, suggesting it is the safer bet for action.

  **Stress-Testing the Case**

  *   **The Feature Doing the Work:** The implicit assumption that the probability estimate might *change* if more information were available. We prefer Supplier A because we suspect the 0.7 for Supplier B is more vulnerable to revision than the 0.7 for Supplier A.
  *   **Removing the Feature:** If we strictly enforce the stipulation that the agent is *certain* the 0.7 is final and immutable for both cases—meaning no amount of new evidence could shift these probabilities—the preference for Supplier A vanishes. If the risk is truly identical and fixed, the amount of evidence used to find that risk is irrelevant to the outcome. The case collapses; weight cannot do independent work in a static, one-off decision where the probabilities are known with certainty.

  **The Counterattack and Verdict**

  *   **Expected-Utility Counterattack:** "You have stipulated that the probability is 0.7 in both cases. If you are certain of this number, you have already accounted for all relevant uncertainty. To prefer Supplier A is to double-count the risk or to act on a feeling that contradicts your own certainty about the numbers. Rational action depends on the probability of outcomes, not the history of how you found them."
  *   **Does it Land?** Yes. Under the strict conditions of a single decision with fixed probabilities, the counterattack lands. Plain expected-utility reasoning is correct: weight adds nothing to the calculation.

  **What Needs to be Bolted On?**

  For Keynes's notion of weight to earn its keep, you must bolt on a **dynamic element**: the possibility that more evidence will arrive before the outcome is realised, or that the decision can be reversed. If the committee could wait another week for more data on Supplier B, the low weight of evidence makes waiting more valuable for Supplier B than for Supplier A. High-weight probabilities are less likely to shift with new evidence; low-weight ones are more volatile.

  *   **Is this Cheating?** It depends on how you define the problem. If you treat the decision as an isolated snapshot (as standard expected-utility often does), then yes, bolting on future learning is cheating because it changes the question. However, if you view decision-making as it happens in ordinary life—where choices are rarely truly final and information is always flowing—then it is not cheating. It simply recognises that most real-world decisions are part of a sequence, not a single bet. Keynes's weight matters for the *management* of belief over time, not necessarily for a frozen instant of choice.
