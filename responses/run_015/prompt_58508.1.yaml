  so my roommates alex and sam got into this dumb 1am fight after pizza night and i got stuck listening lol. it started because alex said if we really wanted to maximize total happyness and some guy like our friend greg genuinely gets 10x more joy from pizza than anyone else, then we should give greg like 7 out of 8 slices.

  sam said thats not how it works because of diminishing returns, like greg might love slice one and two way more but by slice six hes stuffed like everyone else, so a utilitarian wouldnt actually starve the rest of us.

  alex said ok fine, imagine greg 2.0 who gets 100 points of joy per slice every single slice with zero drop-off, while the rest of us max out at like 5 points per slice. then maximizing total happiness says give him literally everything and let us go hungry, which is obviously messed up, and thats nozick's whole utility monster point against utilitarianisn.

  sam said thats cheating twice over, first you just invented a psychology that could never exist, and second you cant even mesure joy points across different people like that, so the thought experiment just assumes what it needs.

  alex said we make rough comparisons across people all the time though, like giving the strong painkiller to the person in agony instead of the person with a mild headache, and anyway the point is theoretical — if your theory says *if* there was a monster we should feed him everything, that still shows the theory cares about the wrong thing.

  can you like walk through their back-and-forth and say whos got the better point at each step? and then who is more right overall and what are they both missing?
