answer: |-
  ### Part 1: Candidate Procedures & Selection

  I have served on similar bodies (ethics boards, zoning variances). The trap is always building a machine that looks objective but collapses under the first real conflict. You need a procedure that survives a 30-minute review and a hostile reading by the Solicitor.

  **Candidate 1: The "Intent & Impact" Audit.**
  *   **Method:** Ask: 1. What did the designer intend? 2. Who is impacted? 3. Is the impact fair?
  *   **Rejection:** **Dead on arrival.** You already noted half your items are inherited specs or vendor defaults (Sticking Point #4). There is no designer to interrogate. Furthermore, "fairness" is a values call that will stall your meeting for hours. This procedure demands evidence you don't have.

  **Candidate 2: The "Social Arrangement" Compatibility Test.**
  *   **Method:** Based strictly on Winner's second strand. Does this technology *require* a specific social hierarchy to function? (e.g., Nuclear power requires a military hierarchy).
  *   **Rejection:** **Too narrow.** It catches the tomato harvester but misses the park bench. It ignores "Loading" (intent to exclude) which is clearly relevant to your planter situation. It also fails the "Neutral vs. No Finding" legal test because it doesn't account for mitigation.

  **Candidate 3: The "Constraint & Access" Flowchart (Selected).**
  *   **Method:** Focuses on *barriers* and *entitlements*. It asks: Does this physically or digitally prevent action? Does it require specific authority to maintain? Can you opt out without losing a right?
  *   **Why:** It operationalizes "politics" as "distribution of access." It handles inherited designs (adoption = endorsement of constraint). It distinguishes "No Finding" (no constraints detected) from "Neutral" (constraints exist but are equitable/mandated). It is fast enough for a 20-minute review.

  ---

  ### Part 2: The Decision Procedure (v1.0)

  **Instruction:** Proceed sequentially. If a step triggers a **STOP**, record the finding and exit. If a step requires a vote, record the vote count.

  **Step 1: The Exclusion Test (Hard Constraints)**
  *   **Question:** Does this artifact physically, digitally, or legally prevent a specific class of persons from accessing a public space or service they could access previously?
  *   **Evidence:** Specs, bylaws, physical dimensions, software permissions.
  *   **If YES:** **Political Character: Loading.** Proceed to Step 3.
  *   **If NO:** Proceed to Step 2.
  *   *(Addresses Sticking Point #1: This captures "Loading".)*

  **Step 2: The Arrangement Test (Soft Constraints/Compatibility)**
  *   **Question:** Does this artifact require a specific social hierarchy, continuous funding stream, or specialized authority to function *as intended*? (e.g., A system that only works if a private contractor services it weekly; a road design that only works if police enforce speed limits).
  *   **Evidence:** Maintenance contracts, operational manuals, staffing specs.
  *   **If YES:** **Political Character: Compatibility.** Proceed to Step 3.
  *   **If NO:** **STOP. Finding: "No Political Character."** (This is your "No Finding". It means the artifact is functionally agnostic within current context).
  *   *(Addresses Sticking Point #4 & #5: Inherited designs count as "YES" if the hierarchy is embedded. Maintenance is explicit.)*

  **Step 3: The Entitlement & Avoidance Test (Values Call)**
  *   **Question:** Can an affected person avoid the political effect identified in Step 1 or 2 without surrendering a statutory right or essential public good?
  *   **Criteria:** "Essential public good" = Water, safety, transit, legal residence. "Statutory right" = Protected by City/Provincial law.
  *   **If YES (They can avoid it easily):** **Finding: "Neutral (Channeling)."** (The politics exist but are low-stakes friction).
  *   **If NO (They cannot avoid it):** **Finding: "Political (Exclusionary/Hierarchical)."**
  *   *(Addresses Sticking Point #2: This is where you define the Exit Test. It is a **Values Call**. The panel must vote on what counts as "Essential".)*
  *   *(Blunt Note: This step is **Judgement Dressed as Procedure**. You are defining "essential." There is no factual answer. Own the vote.)*

  **Step 4: The Blind Spot Declaration (Procedural Requirement)**
  *   **Requirement:** Before finalizing the finding, the Chair must ask: "Whose experience of this constraint is *not* represented in this room?"
  *   **Action:** Record the answer in the *minutes*, not the finding. (e.g., "Panel noted no members have experience with mobility devices.").
  *   *(Addresses Sticking Point #3: You cannot fix the blind spot, but you must record it to limit liability.)*

  **Step 5: The Drift Trigger (Time)**
  *   **Requirement:** If Step 2 was YES (Maintenance/Authority), attach a **Review Trigger** to the finding.
  *   **Action:** "This finding is valid only while [Contract X] is active" or "Review upon [Bylaw Y] amendment."
  *   *(Addresses Sticking Point #6: Builds expiration into the finding.)*

  ---

  ### Part 3: Application to Cases

  Here are the findings as they would appear in the public register.

  **(a) Concrete Planters & Armrests (Underpass)**
  > **Finding: Political (Exclusionary).**
  > **Reasoning:** The artifact imposes a hard physical constraint (Step 1) preventing recumbent posture on public infrastructure. While the design does not legally bar entry, the Entitlement Test (Step 3) determines that sleeping is a biological necessity for those without housing, and the underpass provides shelter otherwise unavailable. Avoidance requires surrendering access to shelter. The panel notes a blind spot regarding lived experience of homelessness (Step 4).
  > **Trigger:** Review if shelter capacity within 1km changes.

  **(b) Prepaid Smart Water Meters (Citywide)**
  > **Finding: Political (Hierarchical/Channeling).**
  > **Reasoning:** The artifact requires a specific administrative hierarchy (remote shut-off authority) to function (Step 2). The Entitlement Test (Step 3) is mixed: water is an essential good, but the opt-out exists. However, the cost ($40) and friction (trip to City Hall) constitute a financial barrier to avoidance. The politics are "Channeling" (pricing access) rather than "Loading" (total ban), but the barrier is significant for low-income users.
  > **Trigger:** Review if opt-out cost exceeds 1% of median monthly utility bill.

  **(c) Curb Extensions & Raised Crosswalk (Neighbourhood Corner)**
  > **Finding: Political (Equitable Reallocation).**
  > **Reasoning:** The artifact imposes a hard constraint on vehicular speed and path (Step 1). This is a political act of reallocating public right-of-way. However, under the Entitlement Test (Step 3), pedestrians (including children) have a statutory right to safe passage that outweighs the driver's entitlement to speed at this intersection. The constraint is deemed equitable as it prioritizes vulnerable users over motorized convenience.
  > **Trigger:** Review if accident data shows displacement of risk to adjacent corners.
  > *(Note: Yes, this is political. It prioritizes one life over another's convenience. That is the definition of politics. Do not apologize for it.)*

  ---

  ### Part 4: What This Procedure Cannot Do (Failure Modes)

  You asked for the failure modes. If you treat this procedure as a truth-machine, it will fail you. Here is where it breaks:

  **1. It Cannot Rank "Bad" vs. "Good" Politics.**
  The procedure identifies *that* politics exist, not whether they are *just*. A gas chamber and a wheelchair ramp both trigger Step 1 (Hard Constraint/Access). The procedure labels both "Political." It relies on the panel's moral courage in Step 3 to distinguish them. If your panel is cowardly, this procedure will legitimize atrocities with clean paperwork.

  **2. It Cannot Predict "Drift" Beyond the Trigger.**
  We included a Review Trigger (Step 5), but bureaucracy ignores triggers. If the budget for the irrigation system dries up in Year 2, the system becomes a ruin that blocks access. The procedure says "Neutral/Functional" at purchase, but "Exclusionary" at Year 2. The finding in the register will be outdated the moment the contract changes. You are documenting the *intent* of the purchase, not the *life* of the object.

  **3. It Cannot Fix the Panel's Blind Spot.**
  Step 4 forces you to admit you don't know what you don't know. It does not give you the knowledge. If you approve a software interface that is blind to screen readers, recording "No blind users on panel" in the minutes does not make the software accessible. It only protects you from claiming ignorance later.

  **4. The "Neutral" Trap.**
  The Solicitor warned you: "Neutral" is a claim. The biggest risk is using "Neutral (Channeling)" as a waste bin for things you don't want to fight about. If you label the water meters "Neutral" because the opt-out *exists*, even if nobody can afford it, you are using the procedure to hide a political choice behind a technicality.
  *   **Mitigation:** Require a dissenting opinion in the minutes if any member votes that the "Avoidance Cost" is prohibitive.

  **5. It Creates a "License to Build."**
  Once an item gets a "Political (Equitable)" finding, the department may treat that as a moral shield. "The Panel said this was equitable, so we don't need to consult the neighbours." The procedure is for *review*, not *absolution*. Ensure the Solicitor adds a disclaimer: "This finding describes political character; it does not constitute policy approval."

  ### Final Advice
  You are a retired lab tech. Treat this like a lab protocol. If the inputs are dirty (bad data from staff), the output is garbage. If the panel feels uncomfortable about a "Neutral" finding, **do not sign it.** Force it to "Political." It is better to have a register full of "Political" findings that tell the truth than a register of "Neutral" findings that hide the power dynamics. The planters got you on this panel; let the planters be the standard. If it sleeps like a bench but bites like a fence, call it a fence.
