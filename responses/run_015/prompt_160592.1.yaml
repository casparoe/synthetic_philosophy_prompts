  6.  **Addressing the Specific Sticking Points in the Procedure:**
      *   *Loading vs. Channeling:* Use "Hard Exclusion" vs. "Friction".
      *   *Exit Test:* Codify as "Right-to-Access".
      *   *Blind Spots:* Require a "Missing Voices" line in the notes (not the finding, but the record).
      *   *Inherited:* "Adoption is Endorsement."
