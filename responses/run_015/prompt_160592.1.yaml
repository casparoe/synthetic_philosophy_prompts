          *   Brainstorm 2-3 candidate procedures, reject some, commit to one.
          *   Procedure must distinguish "no finding" vs. "neutral" (legal distinction).
          *   Must identify where human judgment overrides procedure (values calls).
          *   Must identify where judgment is dressed as procedure (be blunt).
          *   Must address specific sticking points (loading vs. channeling vs. latent, exit test, panel blind spots, inherited designs, maintenance/drift, time/review).
          *   Must run the procedure on three specific cases (Planters, Smart Meters, Curb Extensions) and write the actual one-paragraph findings.
          *   Must include a section on "What the Procedure Cannot Do" (failure modes).
      *   **Tone:** Serious, pragmatic, experienced, blunt about limitations, respectful of the stakes (real people, real deadlines).

  2.  **Deconstruct the Context:**
