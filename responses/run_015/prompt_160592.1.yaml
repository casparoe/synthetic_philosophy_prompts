      *   *(c) Curb Extensions:* This is the tricky one. It excludes cars to include pedestrians. It is political (allocating space). But it's *equitable* politics (safety vs. speed). Need to distinguish "Politics of Safety" from "Politics of Exclusion."

  8.  **Drafting the "What It Cannot Do" Section:**
