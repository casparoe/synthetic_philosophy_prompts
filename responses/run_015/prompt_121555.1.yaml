      *   Standard falsification (Popper etc.) says: Prediction fails -> Theory falsified (unless ad hoc).
      *   Malthusian Escrow says: Prediction fails -> Theory goes into "escrow" (pending future settlement) if certain conditions are met (e.g., mechanism exists but timing/offsets unknown).
      *   Distinction: It's not just "lag," it's about *debt*. The theory claims a limit exists, but technology/behavior buys time. The debt accumulates until the limit hits or the escape hatch becomes permanent.
      *   Goal: Define norms for when to keep a theory in escrow vs. when to declare it dead.

  3.  **Drafting Section 1: The Escrow Framing (~150 words)**
      *   Need to define the niche. Standard falsification treats time-to-failure as binary. Escrow treats it as a ledger.
      *   Key idea: Distinguishing between a *false mechanism* and a *deferred constraint*.
      *   Why distinct: It formalizes the "right but early" intuition without granting infinite immunity. It requires defining the "collateral" posted to keep the theory alive.
      *   *Drafting thought:* Keep it tight. Focus on the "debt" metaphor.

  4.  **Drafting Section 2: Prioritized Agenda (~350 words)**
      *   Need 3 conceptual questions, ranked by dependency and tractability for philosophers/logicians.
