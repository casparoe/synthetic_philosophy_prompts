answer: |-
  1. The escrow framing
  Standard falsification treats failed predictions as terminal events. Malthusian Escrow reframes them as deferred settlements. The core distinction is recognizing that some constraints are real but temporally elastic due to intervening variables like technology or behavior. Unlike standard "lag," escrow implies a debt: the theory claims a limit exists, but society has borrowed time against it. This framework demands conceptual norms for how long a theory remains viable despite empirical failure. It shifts the burden from the critic to the proponent to post collateral explaining the delay. This prevents infinite immunity while acknowledging that structural limits often arrive later than linear extrapolations suggest. It is not about saving face; it is about managing explanatory debt across generational timescales where immediate verification is impossible, creating a ledger for theories that are not yet wrong but not yet right, forcing a decision on funding before the check clears.

  2. Prioritized agenda
  1. **The Collateral Condition:** What mechanistic account must a theorist provide to move a failed prediction into escrow? This is priority one because without it, escrow becomes a zombie theory repository. Philosophers can analyze historical cases to distinguish valid "escape hatches" (specific technological classes) from vague hand-waving. Tractability is high; it requires conceptual taxonomy, not new physics. *Evidence to move up:* If current AI safety debates show researchers cannot articulate *why* timelines slipped, only *that* they slipped. This indicates an urgent need for norms.
  2. **The Depreciation Schedule:** How does credence decay while a theory sits in escrow? If a prediction misses by 10 years, does probability drop linearly or exponentially? This depends on Q1; you need to know the collateral is valid before pricing its decay. This is tractable via Bayesian modeling of testimony rather than empirical data. *Evidence to move down:* If funders treat all long-term risks as binary (act/ignore), nuance becomes academic. If policy is threshold-based, decay rates matter less than crossing the line.
  3. **Settlement Criteria:** What counts as final verification? Does the limit need to bind globally or locally? This is downstream because you need Q1 and Q2 to know what you are measuring.

  Dependency is strict: Q1 gates Q2. If any excuse counts as collateral, depreciation is meaningless. You cannot model decay on invalid debt. Evidence for Q3 is historical, making it less urgent for current decision-making. The group must solve the taxonomy of valid excuses before modeling their decay. If Q1 remains undefined, Q2 produces false precision. If Q2 proves irrelevant to policy, Q3 becomes purely historical. The ordering ensures that if they fail at Q1, they stop before wasting time on Q2. This sequencing maximizes the chance of producing a usable tool within the two-year constraint, preventing scope creep into empirical modeling. Since the group lacks empirical capacity, Q1 is the only purely conceptual lift. Q2 requires math but no data. Q3 requires history. Q1 is the bottleneck. Furthermore, Q1 delivers immediate value to funders deciding on renewals. Q2 and Q3 are theoretical refinements that only matter if Q1 succeeds. If the group spends year one on Q2 without solving Q1, they produce a calculator for a currency that doesn't exist. Therefore, Q1 must be completed before Q2 begins, making it the critical path item.

  3. What's overrated / dead ends
  Formalizing "he was eventually right" is a dead end. It rewards luck over mechanism. If a theory survives only because an unpredictable black swan intervened, codifying that survival incentivizes bad forecasting. Similarly, debating general falsification thresholds (Popper vs. Kuhn) is overrated here; the problem isn't theory change, it's *theory suspension*. Finally, trying to quantify the exact "escape horizon" is empirical work, not conceptual. Philosophers shouldn't guess when AI arrives; they should define what counts as a valid reason for delay. Focusing on retrospective glory ignores the immediate decision problem: do we fund this now? Validating past misses doesn't help allocate future resources unless we know *why* they missed. Another dead end is probability matching; trying to align credence with historical accuracy rates ignores the structural uniqueness of each escrowed theory.

  4. The bottom line
  Focus exclusively on the **Collateral Condition**. This is the gatekeeper. If you cannot distinguish between a legitimate structural delay and an ad hoc rescue, the escrow framework collapses into superstition. Defining valid collateral directly informs funding bodies whether a missed timeline warrants patience or termination. It is the only piece that changes immediate behavior without requiring empirical data. Solve this, and the depreciation and settlement questions become manageable derivatives. Without this taxonomy, any model of decay is built on sand. For a four-person team, this offers the highest leverage per hour spent. It respects the timeline.
