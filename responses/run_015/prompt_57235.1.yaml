answer: |-
  Your hunch is sharp, but it is half-right. You have correctly identified the *mechanical* source of the disagreement (individuation criteria), but you are underestimating the *ontological* and *soteriological* stakes that make the stalemate permanent. If this were merely a taxonomic dispute about how to label cognitive events, the scholastics would have compromised. They didn't because the pramāṇa count is a proxy war for what kinds of reality exist and how we access them.

  Here is the diagnosis of the impasse.

  ### 1. The Individuation Trap (Where you are right)
  You noted the split between "form of cognition" (Dignāga) and "causal instrument" (Naiyāyikas). To be precise:
  *   **Dignāga** individuates by **object** (*prameya*). There are only two kinds of objects: particulars (*svalakṣaṇa*) and universals/constructions (*sāmānyalakṣaṇa*). Therefore, there can only be two means of knowing them. Any other "means" is just a complex arrangement of these two.
  *   **Nyāya/Mīmāṃsā** individuate by **instrument** (*kāraṇa*). If the causal chain producing the cognition is distinct, the pramāṇa is distinct. Hearing words involves a different causal apparatus (speaker, convention, trust) than seeing smoke, even if both yield a universalized conclusion.

  **Why this causes a stalemate:** You cannot persuade a Dignāgian to count *arthāpatti* separately by showing it *feels* different, because for Dignāga, phenomenology is irrelevant to ontology. Conversely, you cannot persuade a Bhāṭṭa to fold *arthāpatti* into inference by showing it *entails* the same conclusion, because for the Bhāṭṭa, the logical structure of the resolution is distinct (resolving an anomaly vs. deriving from a mark).

  They are not arguing about the data; they are arguing about the **grid** used to map the data.

  ### 2. The Substantive Stake: Intrinsic Validity (*Svataḥ Prāmāṇya*)
  You asked if something substantive is riding on this. Yes: the epistemic status of the Veda.

  *   **If Testimony (*Śabda*) is Inference:** It is extrinsically valid (*parataḥ prāmāṇya*). Like all inference, it requires verification of the premises (Is the speaker reliable? Do the words mean what I think?). This makes Vedic authority contingent on human reasoning.
  *   **If Testimony is Distinct:** It can be intrinsically valid (*svataḥ prāmāṇya*). Mīmāṃsakas argue that knowledge arising from words is valid *by default* unless defeated. This is non-negotiable for ritual orthodoxy.

  *   **If Postulation (*Arthāpatti*) is Inference:** It is subject to the strict rules of *vyāpti* (pervasion). You need a universal connection between "fatness" and "night eating."
  *   **If Postulation is Distinct:** It operates on **anomaly resolution**. You don't need a strict universal; you need a contradiction that demands a hypothesis. This is a much looser, more flexible epistemic tool. It allows Mīmāṃsakas to postulate metaphysical entities (like the enduring Self or the potency of ritual) that might not pass the strict Buddhist nominalist test for inference.

  So, nobody budges because reducing the pramāṇa count is an act of **ontological austerity**. For Buddhists, fewer pramāṇas mean fewer real entities. For Mīmāṃsakas, more pramāṇas mean more avenues to access dharma.

  ### 3. The *Arthāpatti* Deadlock: Doubt vs. Anomaly
  Your specific sub-case highlights the precise friction point.
  *   **The Bhāṭṭa Claim:** Inference requires doubt (*saṃśaya*). "Is there fire on the hill?" *Arthāpatti* does not arise from doubt; it arises from a cognitive dissonance ("He is fat" + "He doesn't eat by day" = Impossible). The cognition "He eats at night" lands to resolve the tension, not to answer a question.
  *   **The Naiyāyika/Buddhist Counter:** The dissonance *is* the doubt. The anomaly creates a question: "How is this possible?" The resolution is an inference to the best explanation.

  **Why nobody budges here:** It depends on how you define the *trigger* of inference.
  *   If inference is defined psychologically (I must consciously entertain a question), Bhāṭṭas win; *arthāpatti* feels immediate.
  *   If inference is defined logically (there is a relation of invariable concomitance), Nyāya/Buddhists win; fatness implies eating.

  The Bhāṭṭas dug in because admitting *arthāpatti* is inference threatens to make all knowledge inferential (since almost all knowledge resolves some anomaly). The Nyāya/Buddhists dug in because admitting *arthāpatti* is distinct opens the floodgates to "knowledge" based on mere coherence rather than empirical connection.

  ### 4. What Would Settle It? (And Why It Won't)
  You suggest conflict cases or individuation rules. Historically, they tried both.

  *   **Conflict Cases:** They did occur. (e.g., Perception says "The sun moves," Testimony says "The sun is stationary"). The solution was never to eliminate a pramāṇa, but to restrict its **domain** (*viṣaya*). Perception rules in the empirical; Testimony rules in the supersensible. This preserves the count but limits the scope.
  *   **Individuation:** To settle the count, you need a neutral meta-epistemology to decide whether "object" or "instrument" is the correct individuator. But that meta-epistemology would itself require a pramāṇa.
      *   If you use perception to decide, the Buddhists win (only particulars are real).
      *   If you use testimony to decide, the Mīmāṃsakas win.

  **The Diagnosis:** The stalemate is permanent because the pramāṇa systems are **closed loops**.
  Dignāga's system is closed by his ontology of moments (*kṣaṇika*). Nyāya's is closed by their realism of substances (*dravya*). You cannot prove one counting method is "correct" without already assuming the ontology that necessitates that counting method.

  ### Summary
  Your hunch is fair regarding the **mechanism** of the dispute (categorization criteria), but incorrect regarding the **motivation**. They aren't failing to see each other's questions; they are refusing to answer them because answering would concede the ontological ground.

  *   **Dignāga** won't budge because admitting a third pramāṇa admits a third kind of reality.
  *   **Mīmāṃsā** won't budge because folding *arthāpatti* into inference makes Vedic postulates vulnerable to empirical falsification.

  **Verdict:** Expect permanent stalemate. The only way to "settle" it is to step outside the system and adopt a modern externalist epistemology, but that simply changes the vocabulary of the stalemate rather than resolving the classical tension. The dispute persists because it is not actually about counting; it is about **boundary maintenance** between the empirical and the transcendent.
