      *   *Assessment:* This is partially correct but too deflationary. It misses the *soteriological* and *ontological* stakes. If you reduce pramāṇas, you reduce the kinds of reality accessible. If you expand them, you validate Vedic authority or specific metaphysical claims.
      *   *Diagnosis:* The stalemate isn't just category confusion; it's a clash of *reductionism vs. realism* regarding cognitive architecture, underpinned by theological/philosophical commitments.

  3.  **Deconstruct the Impasse (Why nobody budged):**
      *   **Dignāga's Strategy (Reductionism/Economy):** He wants to show that all knowledge is essentially binary (particular vs. universal). This serves the Buddhist nominalist ontology (no real universals, only particulars). If *arthāpatti* is inference, it relies on a universal connection (*vyāpti*). If it's not, what is it? Dignāga says everything reducible to *anumāna* is *anumāna*.
      *   **Naiyāyika/Bhāṭṭa Strategy (Realism/Pluralism):** They want to preserve the distinctness of certain cognitive events to protect the authority of the Veda (Testimony) and to account for complex reasoning that doesn't feel like standard inference (Postulation).
      *   **The *Arthāpatti* Crux:** The "Fat Devadatta" case.
          *   Bhāṭṭa: It's not inference because there's no doubt (*saṃśaya*). Inference requires doubt. Postulation resolves an anomaly.
          *   Naiyāyika: Doubt is implicit. The anomaly *is* the doubt.
          *   Buddhist: It's inference based on a natural sign (fatness implies eating).
      *   **The Real Stalemate:** It's about *Individuation Criteria*. When do we count two cognitive events as the *same kind*?
          *   Dignāga: By the *object* grasped (svalakṣaṇa vs. sāmānyalakṣaṇa).
          *   Naiyāyikas: By the *instrument* (cause) producing the cognition.
          *   Since they define "pramāṇa" differently at the root, they can't agree on the count.

