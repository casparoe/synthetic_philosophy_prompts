prompt: |-
  So I'm taking this aesthetics seminar and we've been going back and forth on forgeries for like three weeks now. Last session got pretty heated — half the class thinks a perfect forgery is literally just as good as the original (like, if you can't tell the difference even with the best science, what are you even mourning?), and the other half thinks that's completely missing the point, that the whole value of art is bound up with who made it and when and under what conditions. The prof keeps saying this is one of those debates where both sides think the other is confused about something really basic, and I want to get that tension onto the page.

  Could you write me a dialogue between two characters — let's call them Mira and Julian — who are standing in front of a Vermeer at a museum, right after overhearing that another painting in the same gallery (same period, same master) was just exposed as a brilliant forgery. Mira holds that if the forgery was good enough to fool experts for decades, the exposure shouldn't really change how we value the painting — the experience it gives us is the same, and the disappointment is just psychology we should get over. Julian holds that discovering it's a forgery genuinely changes what the painting is, and that our disappointment is rationally warranted, not just snobbery or fetishism about provenance.

  Make it a real back-and-forth — neither of them should be a strawman, and they should actually respond to each other's points rather than monologuing past each other. I want to see each of them forced to refine their view under pressure from the other. Keep it to 500 words max.
