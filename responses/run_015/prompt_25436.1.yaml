      "But it wore the costume perfectly. If you can't tell the difference, the difference doesn't exist where it matters. In the looking."

      "In the looking?" Julian turned to her. "You think art is just optical data? If I hand you a letter you think is from your father, and it turns out I wrote it yesterday, the words haven't changed. But the meaning has evaporated."

      "That's sentimentality," Mira countered. "We're talking about paint on canvas. The forger solved the visual problem. Maybe better than Vermeer. Why punish the object because of a biography?"

      "Because art isn't a problem solved. It's a moment captured. When you look at this," he tapped the air near the verified canvas, "you're meeting Vermeer's eye across centuries. The forgery? That's someone pretending to be him. It's not a meeting; it's a stage play."

      "So the value is in the handshake, not the touch?"

      "Exactly."

      "But if the touch feels identical," Mira pressed, "is the handshake necessary? Or is that just fetishizing provenance? If the experience is transcendent, does the source code matter?"

      "The source code is the art. Without the genuine origin, it's not art anymore. It's craft used to deceive."

      "Or," Mira said, softening, "maybe it's art that proves beauty can be divorced from genius. That's scary. It means the magic isn't in the master, it's in the mechanics."

      "Or," Julian replied, "it means the magic was never just mechanics. It was trust. And that's broken."

      Mira looked back at the painting. "Then we're not mourning the painting. We're mourning our own gullibility."

      "No," Julian said. "We're mourning the connection. You can't hug a mirror."

