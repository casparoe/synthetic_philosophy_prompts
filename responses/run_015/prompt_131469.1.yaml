answer: |-
  # RENEWAL DECISION PROTOCOL: SCIENTIFIC PROGRESS CHECK
  **For:** Panel Members | **Time:** 30 Minutes per File | **Constraint:** Do not count papers. Assess *direction*.

  ## PART 1: THE CHECKLIST (Answer Yes / No / Unknown)

  **Q1. Prediction Timing (Novelty vs. Accommodation)**
  In the last 5 years, did the group publish specific predictions *before* collecting the data that confirmed them?
  *   **Yes:** They are leading the data.
  *   **No:** They are explaining data they already have.
  *   **Default:** If >50% of "findings" are post-hoc explanations, mark **No**.

  **Q2. Scope Drift (Core-Softening Check)**
  Compare the current central claim to the original grant. Has the claim changed to *exclude* difficult data, or to *include* new phenomena?
  *   **Yes (Include):** "Mechanism X also applies to Y." (Expansion)
  *   **No (Exclude):** "Mechanism X applies, but only under condition Z (which we didn't check before)." (Retreat)
  *   **Default:** If the claim is vaguer now than at the start, mark **No**.

  **Q3. Independence (The "Echo Chamber" Check)**
  For new hypotheses added to save the theory: Can they be tested using tools/methods *outside* this group's specific framework?
  *   **Yes:** Independent labs could test this without adopting the group's theory.
  *   **No:** You must believe the theory to test the hypothesis.
  *   **Default:** If the only evidence is from the group's own custom instrument, mark **No**.

  **Q4. The Hard Stop (Instrument Delay vs. Degeneration)**
  If there are no confirmed facts yet (e.g., waiting on a detector): Is there a pre-registered, binary criterion for abandonment that will trigger within the *next* funding cycle?
  *   **Yes:** "If signal < X by Date Y, we stop."
  *   **No:** "We will refine the model based on data."
  *   **Default:** If no hard abandonment criterion exists, mark **No**.

  ---

  ## PART 2: DECISION MATRIX

  | Q1 (Prediction) | Q2 (Scope) | Q3 (Independence) | Q4 (Hard Stop) | **VERDICT** |
  | :--- | :--- | :--- | :--- | :--- |
  | **YES** | **YES** | **YES** | N/A | **RENEW** (Progressive) |
  | **NO** | **NO** | N/A | N/A | **TERMINATE** (Degenerating) |
  | **NO** | **YES** | N/A | **YES** | **RENEW** (High Risk/Instrument) |
  | **YES** | **NO** | **NO** | N/A | **TERMINATE** (Ad Hoc/Retreat) |
  | **UNKNOWN** | **UNKNOWN** | **UNKNOWN** | **NO** | **TERMINATE** (Default to Risk Control) |

  **ESCALATION TRIGGER:** If Q2 is "Unknown" (hard to tell if retreat or deepening), **do not decide.** Flag for Panel Discussion. This is a value judgment on what counts as "progress," not a fact check.

  ---

  ## PART 3: WORKED EXAMPLES

  **A. The Immune Group (40 Papers, Shifting Tissues)**
  *   **Q1:** **No.** Predictions confirmed, but tissues changed *after* data collection to find a fit.
  *   **Q2:** **No.** Scope narrowed implicitly ("It's not *all* chronic disease, just *these* tissues") without admitting retreat.
  *   **Q3:** **No.** Validations rely on their specific biomarker panel.
  *   **Verdict:** **TERMINATE.**
  *   **Why:** High output masks a "degenerating problem shift." The protective belt is absorbing anomalies by moving the goalposts, not predicting new facts.

  **B. The Signal Group (0 Papers, Detector Pending)**
  *   **Q1:** **Yes.** Predictions written down in advance.
  *   **Q2:** **Yes.** Core claim stable; no retreat to fit null results.
  *   **Q3:** **Yes.** Signal detection is independent of the theory's truth.
  *   **Q4:** **Yes.** Explicit abandonment criteria set for 18 months.
  *   **Verdict:** **RENEW.**
  *   **Why:** Theoretically progressive. Empirical stagnation is due to external constraint (instrument), not theoretical weakness.

  **C. The Mechanism Group ("Deepening Understanding")**
  *   **Q1:** **No.** New "predictions" are re-interpretations of old data.
  *   **Q2:** **No.** Claim retreated from "All Mammals" → "Stress Conditions" → "Regulatory Principle."
  *   **Q3:** **No.** "Regulatory Principle" is unfalsifiable without their specific framework.
  *   **Verdict:** **TERMINATE.**
  *   **Why:** This is "core-softening." The theory is being made immune to refutation by becoming vaguer, presented as sophistication.

  ---

  ## PART 4: THE UNLIKEABLE ANSWER

  **You will not like Verdict A.**
  Terminating a group with 40 papers feels punitive. Administratively, "productivity" (papers) is the easiest metric to defend. This procedure forces you to acknowledge that 40 papers of post-hoc accommodation is scientifically worth less than 0 papers of pre-registered risk (Case B). It requires you to ignore the "sunk cost" of a large, publishing team.

  ---

  ## PART 5: PHILOSOPHER'S APPENDIX (For Panel Defense)

  **Mapping to Lakatosian MSRP:**
  *   **Q1** tests for **Empirical Progress** (novel facts) vs. **Post-hoc Accommodation**.
  *   **Q2** detects **Degenerating Problem Shifts** disguised as belt adjustments. Lakatos allows belt changes, but not if they reduce content.
  *   **Q3** distinguishes **Lakatosian Ad Hoc 3** (independent test) from **Ad Hoc 1** (internal consistency only).
  *   **Q4** enforces the **Positive Heuristic** (a plan for growth) rather than endless **Negative Heuristic** (protecting the core).
  *   **Escalation** acknowledges that distinguishing "theoretical generalization" from "core retreat" is not algorithmic; it requires peer judgment on *content*, not just form.

  **Limitations & Judgment Calls:**
  1.  **The Monopoly Problem:** This procedure cannot see if a programme is degenerating but is the *only* framework in the field. Killing it may kill the field's capacity to ask the question. *Mitigation:* Escalate if the group is the sole holder of a specific methodology.
  2.  **The "Deepening" Trap:** Q2 relies on reviewers spotting the difference between "nuance" and "retreat." This is a judgment call dressed as a step. *Mitigation:* Require the Panel Chair to read the original grant aims personally.
  3.  **Naive Falsification:** Note that **No** on Q1 does not mean "falsified." Lakatos argues we should not kill a programme simply for anomalies. We kill it when it stops generating *new* content (Q1) and only explains old anomalies (Q2/Q3).

  **END OF PROTOCOL**
