  I'm trying to name a move I keep seeing in arguments about originals vs fakes or AI outputs. The claim is that the real thing has value because the creator took an emotional risk — put something genuinely personal on the line. But then you point out plenty of human art is totally mechanical or commissioned, with zero exposure involved, yet people still defend it over a copy. Meanwhile a forger risks prison, and AI teams risk careers and capital, but that never counts as "authentic risk." So the idea of risk is used like a movable fence: it applies only to the person we're already calling the author, and people dosen't specify what makes a risk "authorial" except that it produces the right conclusion. I see it with factory painters vs brilliant forgers, or ghostwriters vs named authors who barely edited. Is there an established term for this specific bait-and-switch, where "authentic exposure" is invoked selectively to protect originals? Or if there's no name, can you define exactly what distinguishes it from ordinary appeals to intentionality or artistic authenticity, and give a couple boundary cases?

  Please structure your answer in these sections, roughly this long:
  - "Restating the pattern" (~2 sentences): say back the phenomenon in your own words.
  - "Close neighbors" (~3 sentences): concepts that are near this but miss, like appeals to intentionality or the aura of an original.
  - "The carving" (~4 sentences): exactly what this is and isn't, with at least one boundary case where the risk is real but shouldn't count, and one where risk is minimal but should.
  - "The name or coinage" (~3 sentences): does it have a real term? If yes, say whether it actually fits. If no, propose a term and its scope.
