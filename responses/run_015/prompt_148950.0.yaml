      *   *Point 2: Hyperbolic Discounting definition.* "Present rewards are weighted exponentially more..." -> *Incorrect.* Standard rational choice is exponential discounting. Hyperbolic discounting is specifically *not* exponential (it's steep initially, then flattens). This is a technical definition error.
