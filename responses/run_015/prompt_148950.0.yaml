          *   *Virtue:* The virtuous person doesn't even feel the bad desire.

      *   **Hyperbolic Discounting (Behavioral Economics):**
          *   *Definition:* Time-inconsistent preferences. We discount the future steeply in the short term. (Note: Student said "exponentially," which is technically the *rational* model; hyperbolic is *non-exponential/steep short term*. This is a technical error).
          *   *Implication:* Explains *why* preference reversals happen (Planning self vs. Doing self).
