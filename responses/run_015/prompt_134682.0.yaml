answer: |-
  The dispute between internalist and externalist accounts of reasons for action concerns the necessary relationship between an agent's motivations and the truths of normative claims. The internalist holds that for an agent to have a reason to act, there must be a sound deliberative route connecting that action to the agent's actual motivational set. Reasons must be capable of gripping the agent; they cannot be entirely alien to what the agent cares about. The externalist denies this constraint, arguing that reasons can exist independently of an agent's subjective motivations. On this view, an agent may have a reason to act even if no amount of reasoning from their current desires could lead them to that action. While the externalist offers a robust account of objective value, the internalist offers a compelling explanation of motivation's role in agency. This essay argues that a modified internalism, specifically route-availability internalism combined with diachronic indexing and a deliberative-cost budget, provides the most coherent account of normative truth.

  Consider the case of Anya, an actuary indifferent to music who desires a rich inner life but mistakenly believes music cannot provide it. A structured course would correct this belief and generate a passion for music, yet the initial steps are tedious and unsupported by her current desires. Step-wise internalism asserts Anya has no reason to enrol because no single step in the process is currently motivated. She has no desire to endure tedium for a reward she does not yet value. Route-availability internalism, conversely, asserts she does have a reason because a sound deliberative route exists from her standing desire for a rich inner life to the enrolment, even if intermediate steps are not currently motivating.

  Step-wise internalism must be rejected because it renders agency statically brittle. It implies that agents cannot have reasons to undertake transformative experiences that correct their own evaluative mistakes. If reasons are strictly limited to what is currently motivating, an agent trapped by false beliefs about what satisfies their deeper desires is normatively stranded. Route-availability internalism is superior because it acknowledges that reasons can be discovered through deliberation. The truth of the reason statement depends on the existence of a pathway, not the agent's current awareness of it. Anya has a reason to enrol because the route from her desire for a rich inner life to the course is sound, even if she must traverse a motivational gap to realize it. To deny this is to privilege current psychological states over the objective satisfaction of the agent's own enduring ends.

  However, accepting route-availability raises the indexing problem: over which motivational set do we quantify? Consider Anya twenty years later. Due to a career change she currently has reason to make, her future self will love music. She currently finds ear protection uncomfortable but could preserve her hearing for future concerts. Synchronic indexing looks only at her present set. Since her current set does not value future music, she has no reason to wear protection. Diachronic indexing looks at her lifetime set. Since her future self will value music, she has a reason now to protect the capacity to enjoy it.

  Synchronic indexing must be rejected because it permits agents to destroy their own future reasons with impunity. It implies a normative fragmentation of the self, where an agent has no reason to facilitate the conditions of their own future rationality. Diachronic indexing is correct, but it requires a constraint to avoid attributing reasons that have no grip. The constraint is rational continuity. If the future motivational set is the result of a rational development from the current set, the current agent has reason to facilitate it. In Anya's case, the career change is one she has current reason to make, and the love of music is a stable development of her capacity for appreciation. Therefore, the reason exists now. Regarding abrupt changes: if an agent's motivations change abruptly without rational continuity (e.g., through brainwashing or caprice), diachronic indexing does not attribute reasons based on that new set. The truth value of a reason statement uttered about someone whose motivations change abruptly depends on whether the change was rationally accessible. If the change was irrational, the reasons associated with the new state do not retroactively bind the past self. This preserves the link between agency and reason while acknowledging the temporal extendedness of human life.

  Combining route-availability with diachronic indexing invites the collapse worry: if any sufficiently long route counts, internalism becomes extensionally equivalent to externalism. If one can always construct a complex chain of reasoning from any desire to any action, the requirement for a motivational link becomes vacuous. To prevent this, internalism must specify a deliberative-cost budget. This budget is a principled limit on the cognitive work, information-gathering, and imaginative exercise required for a route to count as available.

  The budget is set by objective standards of rationality applied to the specific agent's capacities. It is not infinite. An agent is required to perform a reasonable amount of deliberative work relative to the stakes of the action. For high-stakes decisions, the budget is larger; for trivial ones, it is smaller. It varies between agents based on cognitive capability and available time, but it does not vary so wildly as to make normative truth purely subjective. This budget rules out routes that require miraculous insight, excessive information costs, or imaginative leaps beyond human capacity. For example, if the only route from Anya's desires to a moral action requires understanding complex metaphysical truths inaccessible to her, the reason does not exist for her, even if it exists for a sage.

  Given this budget, the internalism/externalism dispute remains substantive. Externalism claims reasons exist even if no route is accessible within the budget. Budgeted internalism claims reasons exist only if a route is accessible. The distinction is hollow only if the budget is set so high that it encompasses all possible externalist verdicts. However, by grounding the budget in human cognitive limits, internalism preserves a category of actions that are objectively good but for which specific agents have no reason because the deliberative cost to reach them is too high. Thus, internalism remains distinct: it ties reasons to the agent's actual capacity to be moved, whereas externalism ties reasons to objective values regardless of capacity.

  I therefore commit to route-availability internalism with diachronic indexing and a deliberative-cost budget. This view captures the normative force of objective goods while respecting the psychological reality of agency. It allows agents to have reasons to grow and change without attributing reasons that are psychologically inaccessible.

  The single strongest objection to this verdict is that the deliberative-cost budget is intolerably vague. Critics will argue that without a precise metric for "reasonable cognitive work," the theory cannot adjudicate hard cases. If the budget is flexible, it can be manipulated to yield any desired verdict, rendering the theory unfalsifiable. This objection is answered by noting that vagueness is a feature of normative concepts, not a bug. Concepts like "negligence" or "fairness" also rely on context-sensitive standards without precise metrics. The budget is clarified through case law and reflective equilibrium, not algorithmic calculation. The theory provides a framework for argument, not a calculator for verdicts.

  For this verdict to be false, it would have to be shown that there are cases where an agent definitively has a reason to act despite there being no sound deliberative route from their motivational set to the action, even allowing for reasonable deliberative costs. If one can demonstrate a reason that is completely inert to the agent's psychology and inaccessible via any rational reflection on their cares, then internalism fails. Until such a case is produced, the internalist account remains the only view that successfully unites the normativity of reasons with the psychology of the agent who must bear them.
