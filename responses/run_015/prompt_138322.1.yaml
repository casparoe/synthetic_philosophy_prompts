answer: |-
  ### Step 1: Brainstorming the Beats

  1.  **Establish Authority:** Ilse must open by framing the debate not as moral vs. immoral, but as *rational* vs. *irrational*. She is not making a value judgment; she is solving an equation.
  2.  **The Harsanyi Hammer:** Clearly state the premises of the Aggregation Theorem (vNM axioms + Pareto). Conclude that social welfare *must* be a sum of individual utilities. Any other metric is mathematically incoherent.
  3.  **The Veil Move:** Invoke the veil of ignorance. If you don't know who you are, you maximize expected utility. In a fixed population, maximizing expected utility is identical to maximizing total welfare.
  4.  **The Patch (Crucial):** I need to advise you on the "possible people" flourish. **It is philosophically vulnerable.** Counting non-existent people introduces infinite sets, which breaks the probability math (probability of being any specific person becomes zero). Also, the Repugnant Conclusion applies to *population size* choices, not triage in a fixed population. In a fixed population, Total Utilitarianism and Average Utilitarianism yield the same result.
      *   *The Fix:* Have Ilse drop the "possible people" bit. Instead, have her focus on **Time-Discounted Utility**. The young have more *future* utility units to accumulate. The sickest have near-zero future utility. This is airtight within Harsanyi's framework without invoking metaphysical ghosts.
  5.  **The Kill:** Conclude that opposing this is not compassion; it is a violation of rational choice axioms. She isn't choosing who lives; she is choosing not to waste the resource.

  ### Step 2: Philosophical Patch Notes

  *   **The "Possible People" Problem:** As noted, including non-existent entities in the denominator of an average is mathematically undefined. If the set of possible people is infinite, your chance of being an existing person is zero.
  *   **The Repugnant Conclusion Irrelevance:** The Repugnant Conclusion (Parfit) argues that Total Utilitarianism forces you to prefer a huge population with barely worth-living lives over a small happy one. This applies to *creating* people. In a triage scenario, the population is fixed. Maximizing Total Utility and Average Utility are mathematically identical here.
  *   **Recommendation:** Keep the "Average" language if you love it, but ground it in **Expected Life-Years** rather than "possible existence." Ilse should argue that behind the veil, a rational agent maximizes their *expected lifespan*. This justifies saving the young without needing the shaky "possible people" metaphysics.

  ### Step 3: The Speech

  "Councilor Vane calls this cruelty. I call it arithmetic.

  We are not here to debate compassion. We are here to debate coherence. John Harsanyi proved in 1955 that if individual preferences satisfy the von Neumann-Morgenstern axioms of rationality, and we accept the Pareto principle—that we should not make someone worse off without making anyone better off—then social welfare *must* be a weighted sum of individual utilities. There is no escape clause. Any social welfare function that is not utilitarian violates the axioms of rational choice. It is literally irrational.

  So, let us be rational. Imagine yourself behind the veil of ignorance. You do not know your age, your health, or your role in Meridia. You have an equal probability of being any citizen currently standing in this room. You are a rational agent maximizing expected utility. Would you gamble on a protocol that saves a person with two weeks of life remaining? Or would you maximize the expected value of your own existence by prioritizing those with decades of utility ahead of them?

  Prioritizing the sickest is not morality; it is diminishing returns. It is burning fuel to warm a stone. The young possess the highest capacity for future utility. The carers possess instrumental value; saving one carer preserves the utility of the dozens they tend. To do otherwise is to violate the Pareto principle. You are choosing to make the collective worse off to satisfy an emotional urge for symmetry.

  I am not choosing who dies. I am choosing not to waste the only thing that can stop death. If you vote against this, you are not voting for kindness. You are voting to violate the laws of rational choice. You are voting for incoherence."

  ### Step 4: Heckles & Rebuttals

  *   **Heckle 1 (The Humanist):** "You're reducing human beings to numbers! What about the sanctity of life?"
      *   **Ilse's Swat:** "Sanctity is a luxury of surplus. When resources are fixed, 'sanctity' that ignores capacity is just vanity. I am respecting life by ensuring it continues, not by performing rituals over its end."
  *   **Heckle 2 (The Prioritarian):** "But the sickest suffer the most! Doesn't their pain count for more?"
      *   **Ilse's Swat:** "Pain is negative utility, yes. But dead is zero utility. You cannot maximize the relief of suffering if the subject ceases to exist. Harsanyi weights preferences, not pulses. A dead patient has no preferences to satisfy."
  *   **Heckle 3 (The Skeptic):** "Interpersonal comparison is impossible! You can't know their utility!"
      *   **Ilse's Swat:** "We use proxies: life-years, cognitive function, dependency ratios. It's an estimate. But an estimate based on data is superior to a guess based on sentiment. Would you prefer a flawed map or no map at all?"
