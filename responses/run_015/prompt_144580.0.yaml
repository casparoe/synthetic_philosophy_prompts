      *   *Best:* "Bleeding." If a robot leaks oil, is it bleeding? No. If a crab leaks hemolymph and recoils? Closer.
      *   *Recommendation:* Stick with the "Extension of a Concept" model. It's not about discovering a hidden ghost; it's about deciding how far to stretch our net based on similarities.

  9.  **Synthesize and Format:**
