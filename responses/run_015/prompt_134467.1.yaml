  ### Diagnostic Notes on Logical Spaces and Collapses

  **Unoccupied Logical Spaces**
  *   **Horizontal Inaccessibility + Ontologically Surplus (Path B.2):** This combination is **incoherent**. Horizontal inaccessibility is defined by the absence of a "fact of the matter" distinguishing bases; positing an "ontologically surplus" entity implies a fact of the matter exists regarding the surplus, which contradicts the definition of the horizontal barrier. Consequently, this path is terminated in the tree.

  **Collapsing Leaves**
  *   **Ontic Structural Realism (Leaf 7) vs. Dual-Aspect View (Leaf 3):** These leaves risk collapsing into one another on this framing. Leaf 3 posits a "real geometric substance" without location, while Leaf 7 posits "relations without terms." If the "geometric substance" of Leaf 3 is defined entirely by its relational effects without independent locatability, it becomes indistinguishable from the relation-only ontology of Leaf 7. The tree separates them based on the *source* of inaccessibility (Vertical vs. Horizontal), but if the resulting ontology is structurally identical, the distinction is merely genealogical rather than metaphysical.
  *   **Restricted Entity Realism (Leaf 2/6) vs. Epistemic Structural Realism (Leaf 4):** These positions become indistinguishable when the accessible correlation set is **maximally sparse**. If the "particles" in Leaf 2 or Leaf 6 are accessible *only* through their structural correlations (due to the permanent inaccessibility of their intrinsic nature), then asserting their existence as "entities" adds no predictive or explanatory power over Leaf 4's claim that only the structure is real. The distinction relies on a modal intuition about what *could* be known, which the root commitment explicitly rules out.
