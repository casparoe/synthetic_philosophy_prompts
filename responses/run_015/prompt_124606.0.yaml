      *   **Topic:** Moral status of video-game characters.
      *   **Core Constraint/Avoidance:** Avoid the "consciousness debate" (i.e., don't let students argue about whether AI *is* conscious). Stipulate consciousness for the sake of argument. Avoid the "derivative status only" cop-out (characters only matter because players care).
      *   **Specific Material:**
          *   Stipulation: A companion character has conscious, unpleasant states (pain-like) in a scripted scene.
          *   Case (i) Multiplication: Millions of copies sold/running.
          *   Case (ii) Suspension: Engine stops simulating when player leaves, resumes later (gappy consciousness).
          *   Case (iii) Unshipped Build: Code exists, never executed.
          *   The Crux: Implementation-based views lead to catastrophic multiplication/repeated killing. Pattern-based views imply the unshipped build matters but face the "abstract objects can't be harmed" problem.
      *   **Required Moves (5):**
          1.  Precise statement of Implementation vs. Pattern accounts.
          2.  Verdict on scaling moral weight with implementations (argued, not intuitive).
          3.  Engagement with causal-inefficacy worry for pattern views.
          4.  Contrast depicting vs. implementing suffering (Novelist vs. Designer).
          5.  Constructive third option OR argument none exists + implication for derivative-status move.
