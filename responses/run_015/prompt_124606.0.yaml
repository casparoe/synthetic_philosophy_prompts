      *   Check the marking scheme is usable by a TA or professor.

      *(Self-Correction on Model Answer)*: I need to make sure I don't just say "Pattern view is right." I need to show *why* it handles the cases better, while acknowledging the causation worry and solving it.
      *Revised Plan for Model Answer:*
      1. Define Implementation (token process) vs. Pattern (abstract functional structure).
      2. Scaling: Argue against it. If pain is bad, one instance is a tragedy. A million identical instances don't make it a "super-tragedy" in a way that paralyzes action, because the *quality* of the wrong is the same. (Or better: Defend Pattern view where scaling doesn't apply). Let's go with: Moral weight attaches to the *instantiation of the pattern*, not the raw count of electrons.
