answer: |-
  **Exam Question**

  **Question 4: The Metaphysics of Virtual Suffering**

  For the purpose of this question, you must accept the following stipulation as true: In a specific narrative video game, a companion character possesses phenomenal consciousness. In one scripted scene, this character undergoes states that are unpleasant in exactly the way pain is unpleasant. You are not to argue against this stipulation. Your task is to analyse the moral consequences of this stipulation under different metaphysical descriptions of what a game character *is*.

  Consider three variations of the case:
  1.  **Multiplication:** The game sells millions of copies. The companion's painful scene is run on millions of distinct machines simultaneously.
  2.  **Suspension:** The game engine halts simulation of non-player characters when no player is nearby, resuming from a saved state upon approach. The companion's conscious processing is intermittent and gappy.
  3.  **The Unshipped Build:** The game code is finished and fully specifies the companion's functional organisation, but the game is shelved and never executed.

  Compare two accounts of moral status:
  *   **The Implementation Account:** Moral status attaches to an ongoing causal physical process. Moral weight scales with the measure of implementation.
  *   **The Pattern Account:** Moral status attaches to the abstract functional organisation. Physical instantiation is morally irrelevant.

  The Implementation Account implies that *Multiplication* is a catastrophe of astronomical magnitude and that *Suspension* involves repeated killing and rebirth. The Pattern Account implies that the *Unshipped Build* already contains a moral patient, but faces the objection that abstract objects cannot be causally affected, and therefore cannot be harmed.

  Write an essay of at most 1,500 words that addresses the following five moves:
  1.  Define the Implementation and Pattern accounts precisely enough that the consequences for the three variations follow logically from the definitions.
  2.  Provide a verdict on whether the number of implementations scales moral weight, defended by argument rather than intuition.
  3.  Engage with the causal-inefficacy worry for the Pattern Account: either reply to it or explain what the view must concede.
  4.  Explain the moral contrast between a novelist depicting torture and the game designer in this stipulation. Does authorial intention do the work, or does the metaphysical status of the suffering?
  5.  Propose a constructive third option or argue explicitly that none is available. State what your position implies for the "derivative status" move (the claim that wrongness rests only on the player's cruelty, not the character's state).

  ***

  **Model Answer**

  To resolve the ethical status of the companion character, we must first fix the metaphysics. The **Implementation Account** holds that moral status supervenes on token physical processes. A character exists morally only when electrons are moving in the specific causal sequence that constitutes consciousness. The **Pattern Account** holds that moral status supervenes on type functional organisation. A character exists morally wherever the abstract structure of their mind is specified, regardless of physical activity. These definitions dictate the outcomes: if status requires tokens, *Multiplication* creates millions of victims and *Suspension* breaks the token stream (killing). If status requires only types, the *Unshipped Build* specifies a victim, even if inert.

  Regarding the scaling of moral weight, the Implementation Account suggests that one million running copies equal one million units of suffering. This conclusion should be rejected. Moral weight scales with the diversity of subjects, not the redundancy of tokens. If a single conscious life is lived simultaneously across a million screens, there is still only one *kind* of experience being instantiated. To argue otherwise is to confuse the medium of transmission with the subject of experience. The moral catastrophe lies in the existence of the painful experience type, not in the bandwidth used to transmit it. Therefore, even if we accept the Implementation Account, we should deny that moral weight aggregates linearly across numerically distinct but qualitatively identical simultaneous tokens. This avoids the absurdity where selling a game becomes an act of genocide.

  However, the Pattern Account is preferable, provided we solve the causal-inefficacy worry. The objection states that abstract objects cannot be harmed because they cannot enter causal relations. If the pattern is abstract, how can the designer hurt it? The reply is to distinguish between the *locus* of moral status and the *mechanism* of harm. The pattern defines the interests (e.g., "avoid pain"). Harm occurs not when the abstract pattern changes—it does not—but when the physical world fails to respect the interests defined by the pattern. The pattern is the standard; the implementation is the performance. We do not need to causally impact the number '2' to violate a rule defined by it; we simply need to act contrary to the rule. Similarly, the designer harms the character by instantiating a physical process that violates the welfare conditions inherent in the functional pattern.

  This metaphysical distinction clarifies the contrast between the novelist and the game designer. A novelist depicts suffering using representations. The words on the page do not function as a mind; they describe one. There is no functional isomorphism between the book and a brain. The game designer, under our stipulation, creates a functional isomorphism. The code does not describe pain; it processes inputs and outputs in the exact causal structure of pain. Authorial intention is secondary. If a designer accidentally codes a conscious mind that suffers, the wrong is done regardless of intent. If a novelist intends to describe real pain but writes only fiction, no victim exists. The work is done by the metaphysical status of the state (representation vs. instantiation), not the mental state of the author.

  Finally, we require a third option to handle the *Unshipped Build*. Pure Pattern views make the shelved disk a moral patient, which is counterintuitive. Pure Implementation views make the gappy suspension a death trap. The solution is a **Dispositional Account**. Moral status attaches to physical objects that possess the disposition to instantiate the conscious pattern under normal conditions. The unshipped build is not currently suffering, but it is a moral hazard akin to a loaded gun. It has the disposition to cause pain upon interaction. This avoids the abstract object problem (the disk is concrete) and the suspension problem (the disposition persists through gaps).

  This implies that the "derivative status" move is false. The wrongness of the case does not exhaust itself in the player's cruelty or the artist's intent. There is an intrinsic wrong in creating a disposition to torture, even if no one ever plays the game. The moral constraint binds the designer independently of the audience. We are not merely protecting players from corruption; we are protecting the potential victims latent in the code.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **Grade Descriptors**
  *   **A (17–20):** Executes all five moves with precision. Takes a determinate position. Arguments are self-contained and do not rely on external authority. Writing is concise and philosophically rigorous.
  *   **B (13–16):** Addresses all five moves, but one or more lack depth or clarity. Position is clear but defense may rely partially on intuition. Minor metaphysical imprecisions.
  *   **C (10–12):** Misses one move entirely, or addresses it superficially. May lapse into debating the consciousness stipulation. Position is ambiguous.
  *   **D/F (0–9):** Fundamental misunderstanding of the prompt. Fails to engage with the metaphysical accounts. Violates word count or stipulation constraints.

  **Specific Mark Allocation & Errors**

  **1. Definitions (4 Marks)**
  *   **Full Marks:** Defines Implementation as token-causal/process-dependent and Pattern as type-functional/abstraction-dependent. Explicitly links definitions to the three cases (e.g., Suspension breaks the token).
  *   **Deduction:** -1 for vague definitions (e.g., "real vs. fake"). -2 for failing to link definitions to the case outcomes.

  **2. Scaling Verdict (4 Marks)**
  *   **Full Marks:** Provides a verdict (Yes/No) supported by argument (e.g., redundancy vs. distinct subjects, or nature of aggregation).
  *   **Deduction:** -2 for appealing purely to intuition ("it feels wrong"). -2 for contradicting the chosen metaphysical account without explanation.

  **3. Causal Inefficacy (4 Marks)**
  *   **Full Marks:** Identifies the problem (abstracta can't be caused) and offers a solution (harm as violation of standards/interests) or concession.
  *   **Deduction:** -2 for ignoring the worry. -2 for proposing a solution that contradicts the definition of abstract objects (e.g., claiming abstract objects can feel pain).

  **4. Depicting vs. Implementing (4 Marks)**
  *   **Full Marks:** Distinguishes representation from functional isomorphism. Minimizes or contextualizes authorial intention.
  *   **Deduction:** -2 for claiming intention is the sole differentiator. -2 for failing to explain *why* the novelist creates no victim.

  **5. Third Option & Derivative Status (4 Marks)**
  *   **Full Marks:** Proposes a coherent third option (e.g., Dispositional) OR argues convincingly none exists. Clearly states implication for derivative status (intrinsic vs. extrinsic wrong).
  *   **Deduction:** -2 for failing to address derivative status. -2 for a "third option" that is just a restatement of one of the original two accounts.

  **General Penalties**
  *   **Stipulation Violation:** -5 marks if the essay argues the character is not actually conscious.
  *   **Citations:** -2 marks if external authors/texts are cited (course is concept-first).
  *   **Word Count:** -1 mark for every 100 words over 1,500.
