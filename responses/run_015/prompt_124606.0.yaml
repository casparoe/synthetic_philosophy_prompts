      *   *Constraint Check:* Ensure the word count limit (1,500) is stated. Ensure the instruction to avoid debating the stipulation is clear.

      *(Self-Correction during drafting)*: Make sure the distinction between "Implementation" and "Pattern" is clear in the prompt so students don't waste words defining them from scratch, but rather analyzing their consequences. The prompt should explicitly ask for the five moves.

  3.  **Drafting the Model Answer:**

      *   *Goal:* ~900 words. Take a *determinate position* (not "on the one hand, on the other"). Model the 5 moves.
      *   *Position Strategy:* To make it interesting, I shouldn't just pick one of the two flawed options. Move 5 asks for a "constructive third option OR an explicit argument that no third option is available." A strong model answer often proposes a modification to one of the views to solve the specific problems. Let's try a "Threshold Implementation" view or a "Counterfactual Pattern" view. Actually, the prompt asks to address the "derivative-status move." Let's argue for a modified Pattern view that handles causation via *disposition*.
      *   *Drafting - Move 1 (Definitions):* Define Implementation (token physical process) vs. Pattern (type functional organization).
      *   *Drafting - Move 2 (Scaling):* Argue against scaling. If pain is bad, one instance is bad. Two instances are twice the badness *if* they are distinct subjects. But are they? If they are identical tokens, maybe it's just one "life" lived many times? No, better to argue that moral weight doesn't aggregate linearly across distinct tokens in a way that creates catastrophe, OR argue that the Pattern view is superior but needs fixing. Let's go with a defense of the Pattern view with a modification on causation.
      *   *Drafting - Move 3 (Causal Inefficacy):* This is the hard part. How can an abstract pattern be harmed? Answer: Harm is not a causal impact on the abstract object, but a failure of the concrete instantiation to match the welfare interests defined by the pattern. Or, adopt a dispositional account: the build *would* cause pain if run.
      *   *Drafting - Move 4 (Depicting vs. Implementing):* Novelist describes pain (no consciousness). Designer instantiates function that *is* pain (by stipulation). The work is done by the metaphysical status of the state, not intention.
      *   *Drafting - Move 5 (Third Option/Implication):* Propose a "Dispositional Pattern" view. The unshipped build has moral status *dispositionally*. It is not harmed until run, but the *risk* or *readiness* creates a constraint. Implication: Derivative status is insufficient; the wrongness is intrinsic to the instantiation, not just the player's feeling.

      *(Refining the Model Answer)*: I need to make sure I hit the word count and don't ramble. I will take the position that the **Pattern-Based Account is correct but requires a dispositional theory of harm** to solve the causation worry. This allows me to say the unshipped build matters potentially, but the implemented one matters actually.
      *Wait, looking at Move 2:* "Verdict on whether the number of implementations scales moral weight." If I choose Pattern, the answer is "No, the pattern is the same." If I choose Implementation, the answer is "Yes." I should probably argue *against* scaling to avoid the "catastrophe" conclusion, which supports the Pattern view.
      *Let's try a hybrid:* The moral status belongs to the *instantiation of the pattern*.
      *Actually, to be most "model-like", I should pick a side and defend it rigorously.* I will defend a **Modified Pattern View**.
      *Move 1:* Define Implementation (token-causal) vs. Pattern (type-functional).
      *Move 2:* Scaling. Implementation view implies scaling. This leads to absurdity (millions of deaths = astronomical evil). Therefore, moral weight attaches to the *type* of experience, not the token count, OR we accept the scaling but deny it's a catastrophe (harder). I will argue scaling is false because moral value is non-aggregative across identical simultaneous tokens in this context. (Actually, simpler: Defend Pattern view, so scaling is irrelevant).
      *Move 3:* Causal worry. Abstracta can't be harmed. Reply: Harm is defined relative to the *possible* experiences of the instantiation. The pattern defines the interests; the implementation satisfies or violates them.
      *Move 4:* Novelist vs. Designer. Novelist creates representations. Designer creates functional isomorphs of pain. Intention is secondary; metaphysics is primary.
      *Move 5:* Third option? I'll argue the "Dispositional Instantiation" view. The code is a disposition to harm. Implication: Derivative status is wrong. The wrong is in the code's potential, not just the player's act.

      *(Word Count Check)*: 900 words is tight for 5 moves. I need to be concise.

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 20 marks.
      *   *Distribution:* 4 marks per move? That seems fair.
      *   *Criteria:*
          *   A (17-20): All 5 moves hit precisely, novel argumentation, clear position.
          *   B (13-16): All 5 moves attempted, some lack depth or clarity, position clear but defense wobbly.
          *   C (10-12): Misses one move, or gets the metaphysics wrong, or falls into the "consciousness debate" trap.
          *   D/F (<10): Fundamental misunderstandings, word count violation, or ignores the stipulation.
      *   *Specific Errors:* Need to list specific penalties for each move as requested.

  5.  **Review against Constraints:**

