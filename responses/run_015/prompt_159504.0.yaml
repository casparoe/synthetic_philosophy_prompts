          *   *Stalinesque:* The "show" is doctored *before* it reaches the "audience" (consciousness). The raw data is altered in the buffer before presentation.
          *   *Orwellian:* The "show" happens raw, but the "history book" is rewritten *after* the fact. The experience was one way, but the memory/report is another.

