      *   *User's Hunch:* The user suspects their vocabulary assumes a "ground truth" (the frame buffer) that the philosophical debate questions. *Yes.* Dennett's point is that there is no "Cartesian Theater" where the final image is shown. In engine terms, there *is* a frame buffer. That's the mismatch. The engine has a definitive "last known good state." The brain might not.

  6.  **Addressing Confidence:**
