  I'm in a graduate seminar on non-classical logic this term, and we've just finished the unit on Priest's Logic of Paradox, and I'm the one who has to run the discussion section on Thursday, so I've been trying to get the basic picture airtight before I stand in front of the cohort. I came across a summary of LP in a popular book on the philosophy of logic, and it's slick and mostly persuasive, but I have a nagging feeling it glosses over exactly the points our instructor keeps hammering. Here's the passage, more or less in the book's own words:

  "Paraconsistent logics are logics in which you can have a contradiction — a sentence and its negation both true — without the whole system collapsing into triviality, i.e., without everything becoming provable. The standard example is Priest's Logic of Paradox, a three-valued logic in which a statement can be true, false, or both. The idea is that LP is simply classical logic with the principle of explosion (ex contradictione quodlibet) removed and nothing else changed, so it keeps every valid inference of classical logic except the one that lets a contradiction prove anything. And if you're a dialetheist — someone who thinks that contradictions are true, as with the Liar sentence — then LP is the logic you're committed to, since a dialetheist can't use classical logic without proving everything."

  I think the book is a competent popularizer and I don't think it's being sloppy on purpose, so I'm not sure which of my suspicions are real and which are me over-reading. Could you audit this passage for me, sentence by sentence, and tell me which claims a careful logician working on LP would accept, which are subtle misrepresentations of the actual technical picture, and which a defender of dialetheism would push back on — and whether the book's bottom-line claims still hold once the misstatements are corrected? In particular, I'm unsure about (a) whether LP really is "just classical logic minus explosion," and (b) whether "dialetheist = someone who thinks contradictions are true" is quietly doing work that conflates the view with trivialism, but I can't articulate the objection cleanly. Please respond in the style of an expert in the logic of paradox, and think very carefully before answering, because the distinctions here are genuinely subtle and I'd rather be corrected than be confidently wrong in front of my cohort. At the end, please state how confident you are in each verdict you give, and single out the one point you are least sure about.
