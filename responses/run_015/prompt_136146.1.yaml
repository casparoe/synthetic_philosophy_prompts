  10. **Final Polish:** Ensure tone is empathetic (partner's health) but rigorous (philosophy of mind). Avoid jargon where possible, or define it (precision weighting).

      *(Self-Correction during drafting)*: Wait, the user asked specifically about the "drug, sensory signal, reality check" mapping. I need to make sure the table explicitly addresses those slots, even if "drug" is metaphorical in PP.
