      *   **Current State:** User has been reading about PP. Encountered the slogan "perception is controlled hallucination."
      *   **Lab Mate's Claim:** No principled line between ordinary perceiving and delusion (continuum of ignoring evidence); therefore, we don't perceive a mind-independent world.
      *   **User's Skepticism:**
          1.  *Circularity:* Hallucination is defined as perception without an object. If all perception is hallucination, the definition collapses.
          2.  *Inflexibility:* Partner couldn't be talked out of it (sensory evidence didn't update the model). Suggests the difference is *updatability*, not just weighting.
          3.  *Error Minimization:* Both hallucination and veridical perception minimize error (via action or ignoring), so error minimization doesn't distinguish them.
      *   **Request:**
