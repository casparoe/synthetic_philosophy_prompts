      *   *Insight:* Meta-cognitive access to the weighting process.
      *   *Breakdown:* The analogy breaks because "hallucination" implies a failure of reference, whereas PP says perception *creates* reference.

  5.  **Analyzing the "Smuggled Baseline":**

      *   The phrase "controlled hallucination" smuggles in the idea that there is an "uncontrolled" version (psychosis) and a "controlled" version (normal). But it also smuggles in the idea that there is a "true" world we are hallucinating *about*.
      *   The Lab Mate's conclusion (no mind-independent world) is a leap. PP is compatible with Critical Realism. We model a world that exists, but the *interface* is constructed. The map is not the territory, but the territory exists.

  6.  **Evaluating the Lab Mate's Conclusions:**

      *   *Continuum:* Yes, there is evidence for a continuum (schizotypy). But "no principled line" is too strong. There are phase transitions (bifurcation points) where the system loses stability.
