      *Wait, one more thing:* The user mentioned "Error minimization can't separate them." This is a deep point. Active Inference says we minimize *variational free energy*. A delusional system can minimize this by avoiding the world. I need to confirm this insight. Yes, "safety behaviors" in psychosis minimize prediction error by preventing disconfirmation. This supports the user's view that error minimization isn't truth-tracking.

