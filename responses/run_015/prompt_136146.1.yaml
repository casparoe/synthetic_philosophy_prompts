  2.  **Analyze the Core Concepts (Predictive Processing/Active Inference):**

      *   *Basic PP:* The brain is a prediction machine. It generates top-down predictions. Bottom-up sensory data is "prediction error." Perception is the balancing act (precision weighting) between priors and likelihoods.
      *   *Psychosis in PP:* Often modeled as "aberrant salience" or high precision on priors (ignoring error) OR high precision on error (overfitting noise). The user's psychiatrist suggested high precision on priors (priors > evidence).
