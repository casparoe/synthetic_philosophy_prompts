  3.  **Address the User's Skepticism (The "Bugs"):**

      *   *Circularity:* The user is right. "Hallucination" usually implies *false*. If *all* perception is hallucination, the word loses its contrastive power. PP theorists usually mean "constructive simulation," not "falsehood."
      *   *Inflexibility/Updatability:* This is crucial. In psychosis, the *precision weighting* mechanism itself is broken. It's not just that priors are strong; it's that the system cannot *recalibrate* the precision of the error signal. This is the "reality check" failure.
      *   *Error Minimization:* Active Inference says we minimize error by changing predictions *or* changing the world (action). A delusion can minimize error by avoiding disconfirming situations (safety behaviors). So, error minimization alone doesn't guarantee truth.

  4.  **Drafting the Audit (Mapping Table):**

      *   Need to compare *Ordinary Perception* vs. *Psychotic Episode* within the PP framework.
      *   *Drug/Pathology:* In PP, it's not a drug, it's a hyperparameter failure (Precision Weighting).
