      *   *Check:* Did I address the "Inverted Asymbolia" specifically? (Yes, crucial for 3 vs 4).
      *   *Check:* Did I explain *why* 1 & 7 is fake? (Yes, distinction between phenomenal character and propositional attitude).
      *   *Nuance on Claim 3:* "For an experience to be unpleasant *just is* for it to occupy the aversion role." This is a strong identity claim. It makes 3 very vulnerable to 4. I need to highlight that "just is" is the problem.
