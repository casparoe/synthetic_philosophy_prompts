  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Omar is morally right." In political philosophy, Tess's "boundary problem" is a famous, hard-to-solve issue (Frederick Whitt, etc.). I need to acknowledge that Tess is defending the *possibility* of democracy, while Omar is defending the *legitimacy* of it.
      *   *Nuance on Coercion:* Omar's "All Subjected Principle" is actually a distinct theory from "All Affected." I should point out that switching theories mid-debate is a weakness for him.
