      *   **The Issue:** Who gets to vote in the referendum? (Town residents only vs. Broader affected population).
      *   **The Characters:** Tess (Town Borders/Status Quo) vs. Omar (All Affected/Principle of Impact).
      *   **The Task:** Act as a referee. Go move-by-move to evaluate who has the better point on specific arguments (infinite regress, boundary problem, provisional lists, non-human/future voters, coercion vs. impact). Identify what *both* missed. Offer a potential third option. Declare an overall "winner" based on argumentative strength/logic, not necessarily moral preference.

  2.  **Deconstruct the Debate (Move-by-Move Analysis):**

      *   **Round 1: The Basic Principle**
          *   *Tess:* Town borders define the demos. Practicality. Slippery slope (everyone on earth).
          *   *Omar:* "All Affected Principle" (AAP). Democratic legitimacy requires those impacted to have a say. Distinction between "serious" and "trivial" impact.
          *   *Evaluation:* Tess has the practical high ground (boundaries exist). Omar has the moral high ground (fairness). Tess's slippery slope is a classic objection to AAP. Omar's distinction ("seriously affected") is the standard counter.
          *   *Verdict:* Tie/Setup. Tess defines the *status quo*, Omar defines the *ideal*.

      *   **Round 2: The Boundary Problem (Who decides "serious"?)**
          *   *Tess:* Who defines "serious"? It's circular (can't vote on who votes).
          *   *Omar:* Borders are arbitrary too. Suggests a procedural fix (petition to join, periodic review).
          *   *Evaluation:* Tess hits a major philosophical nerve here (the "boundary problem" in democratic theory). It's a strong logical point. Omar admits borders are arbitrary (true) but offers a procedural solution.
          *   *Verdict:* Tess wins on logic (the circularity is real), Omar wins on flexibility (admitting arbitrariness is honest).

      *   **Round 3: Stability vs. Fluidity & Non-Human/Future Interests**
          *   *Tess:* Fluid lists cause instability (fighting over the list, not the issue). Extends AAP to fish/future generations/global climate to show absurdity.
          *   *Omar:* Fluidity is a feature (shows "us" is arbitrary). Suggests guardians/trustees for non-voters. Shifts argument to "All Subjected Principle" (coercion/law).
          *   *Evaluation:* Tess's instability point is pragmatic and strong. Her reductio ad absurdum (fish/future) is the strongest philosophical objection to AAP. Omar's pivot to "guardians" weakens the "vote" argument (if they need a guardian, they aren't voters). His shift to "All Subjected to Coercion" is a different principle.
          *   *Verdict:* Tess wins this round. The fish/future point exposes a flaw in "affected." Omar's pivot changes the topic.

      *   **Round 4: Coercion vs. Impact**
          *   *Tess:* Water use isn't coercion (it doesn't order farmers around). So "subjected to law" doesn't apply.
          *   *Omar:* (Implicitly forced back to "affected").
          *   *Evaluation:* Tess is legally correct. Negative externalities (pollution/resource drain) aren't usually "coercion" in the legal sense.
          *   *Verdict:* Tess wins.

  3.  **Identify Missing Elements (What neither said):**
      *   *The County Budget:* The prompt mentions the tax break comes from the *county* budget, but the vote is in the *town*. Neither Tess nor Omar focused enough on the county residents who are paying for the tax break but might not be in the town or the downstream area.
      *   *Property Rights/Ownership:* The land belongs to someone. Does ownership grant voting priority?
      *   *Representation vs. Direct Vote:* Maybe the downstream town doesn't need a vote *here*, they need their own council to negotiate *there*. Intergovernmental agreements.
      *   *The "Exit" Option:* If you lose the vote, can you leave? (Tiebout sorting).

  4.  **Develop a Third Option:**
      *   *Stakeholder Council:* Instead of a binary referendum, create a board with reps from Town, County, and Downstream Town.
      *   *Conditional Approval:* Vote happens in town, but requires county approval + environmental impact sign-off from downstream.
      *   *Compensation:* If downstream suffers, they get paid (Coase theorem).

  5.  **Drafting the Response:**
      *   *Tone:* Fair, analytical, educational (civics context), slightly conversational but authoritative.
      *   *Structure:*
          1.  Intro (acknowledge the complexity).
