      *Decision:* Tess wins on logical consistency and spotting the flaws in Omar's criteria. Omar wins on moral intuition but fails to solve the implementation problems Tess raises. I'll call it a win for Tess on *debate mechanics*, but note that Omar identifies the real injustice.

      *Wait, looking closer at Round 3:* Omar's suggestion of "guardians" for fish/future people actually concedes they shouldn't *vote*. That undermines his "everyone affected votes" stance. Tess caught that.

      *Looking at Round 2:* Omar's "procedural" fix (petition to join) actually validates Tess's point about instability. Tess is right that this turns every election into a boundary dispute.

      *Okay, Tess has the stronger debate performance.*

