answer: |-
  This is a classic debate in political philosophy that your class stumbled into accidentally. You're arguing about the **"Boundary Problem"** of democracy: *Who constitutes "the people"?*

  Tess is arguing for the **Territorial Principle** (boundaries define the voters).
  Omar is arguing for the **All-Affected Principle** (impact defines the voters).

  Here is the move-by-move refereeing, followed by what they missed and a third option.

  ---

  ### Round 1: The Basic Principle
  *   **Tess:** Only town residents vote. Borders create stability.
  *   **Omar:** Everyone affected should vote. Downstream neighbors are being taxed (via water loss) without representation.
  *   **Referee Call:** **Draw.**
      *   **Why:** Tess is describing how democracy *actually works* (it requires borders to function). Omar is describing how democracy *should work* ideally (fairness).
      *   **Tess's Strength:** She identifies the practical necessity of a "stop point."
      *   **Omar's Strength:** He identifies the moral hazard of the status quo (the downstream town suffers consequences without input).
      *   **Note:** Omar's distinction between "seriously affected" vs. "stock price moved" is the standard defense against the slippery slope, but he hasn't proven *how* to measure it yet.

  ### Round 2: The "Who Decides?" Trap
  *   **Tess:** Who defines "seriously affected"? You can't vote on who gets to vote without already knowing who gets to vote. (This is the **Circularity Objection**).
  *   **Omar:** Town borders are arbitrary too. Suggests a procedural fix: vote now, but let people petition to join the voter roll later.
  *   **Referee Call:** **Point to Tess.**
      *   **Why:** Tess lands a heavy logical blow here. In political theory, this is known as the *paradox of founding*. You need a demos (people) to make a decision, but you need a decision to define the demos. Tess is right that "All Affected" doesn't solve the problem; it just moves it back one step.
      *   **Omar's Weakness:** His solution (petitioning to join) admits that the boundary is fuzzy. If the boundary is fuzzy, the legitimacy of the *first* vote is shaky.

  ### Round 3: Stability vs. Fluidity & The "Fish" Argument
  *   **Tess:** If the voter list changes, every election becomes a fight about the list, not the issue. Also, if "affected" is the rule, what about fish, future generations, or the global climate?
  *   **Omar:** Fluidity is good (shows "us" is arbitrary). Suggests guardians for fish/future people. Pivots to "All Subjected to Coercion" (if the law fines them, they should vote).
  *   **Referee Call:** **Point to Tess.**
      *   **Why:** Tess's "fish and future people" argument is the strongest philosophical objection to Omar's view. If a fish is "affected," does it get a vote? If not, why not? If yes, how?
      *   **Omar's Mistake:** By suggesting "guardians" for the fish/future, he admits they shouldn't *vote*. This undermines his core claim that "affected people get to decide." He also switches arguments mid-stream from "Affected" to "Coercion," which looks like he's running out of ammo.
      *   **Tess's Strength:** She correctly identifies that a democracy needs a settled "who" to function. If the "who" is always up for debate, governance stops.

  ### Round 4: Coercion vs. Harm
  *   **Tess:** The data center isn't *coercing* the downstream farmers (ordering them around); it's just harming them (using water). So the "Coercion" rule doesn't apply.
  *   **Omar:** (Silence/Teacher moved on).
  *   **Referee Call:** **Point to Tess.**
      *   **Why:** In legal and political theory, there is a difference between **negative externalities** (harm) and **coercion** (authority). The town isn't passing a law that *fines* the downstream farmers for drinking water; the town is allowing a company to *take* the water. Omar's "All Subjected Principle" doesn't fit this specific fact pattern. He is forced back to "Affected," which Tess already dismantled in Round 3.

  ---

  ### What Both of Them Missed
  There is a massive fact in your prompt that neither Tess nor Omar really tackled: **The County Budget.**

  *   **The Fact:** The tax break comes from the *county* budget, not just the town.
  *   **The Gap:**
      *   **Tess** says only the *Town* votes. But people in the *County* (who aren't in the town) are paying for the tax break. Under Tess's logic, they are being taxed without representation too.
      *   **Omar** says the *Downstream Town* votes because of water. But he ignores the *County Residents* who are losing money.
  *   **The Missing Argument:** If Omar's principle is "no taxation without representation," he should have demanded the **County** vote, not just the downstream neighbors. If Tess's principle is "borders matter," she should have acknowledged that the *Town* is subordinated to the *County* regarding budget issues.

  **Also missing:** The distinction between **Direct Democracy** (a referendum) vs. **Representative Democracy**.
  *   Neither asked: *Why is this a public vote at all?*
  *   Usually, town councils negotiate these deals. The "vote" is supposed to happen every few years when you elect the council members. A referendum is an exception. Both argued as if a referendum is the only way to be democratic, but the "third option" is often trusting the representatives to balance these interests (and voting them out if they fail).

  ---

  ### Is There a Third Option?
  Yes. Both are stuck on **Who gets a ballot?** A better civics solution is **Who gets a seat at the table?**

  **The Stakeholder Compromise:**
  Instead of expanding the voter roll (which causes Tess's stability problems) or restricting it (which causes Omar's fairness problems), you use **Conditional Zoning.**

  1.  **The Vote:** Only the Town votes (solving Tess's stability/boundary issue).
  2.  **The Constraint:** The Town Council cannot approve the permit unless they sign a **Binding Intergovernmental Agreement** with the County and the Downstream Town.
  3.  **The Mechanism:** If the water quality drops or the county budget suffers, the Data Center is automatically fined or shut down. The Downstream Town doesn't need to *vote* on the project; they need **veto power over the environmental impact.**

  This separates the *political decision* (Town votes) from the *rights protection* (Downstream neighbors have legal recourse). It solves Omar's fairness issue without breaking Tess's voting boundary.

  ---

  ### Overall Verdict: Who Won?
  **Winner: Tess.**

  **Why?**
  Omar had the better *moral* intuition (it feels unfair that downstream neighbors suffer). But Tess had the better *political* logic.
  1.  **She exposed the circularity:** Omar couldn't explain how to define "affected" without already having a government to define it.
  2.  **She exposed the instability:** Omar's plan would turn every election into a lawsuit about who is allowed to vote.
  3.  **She caught the pivot:** When Omar switched from "Affected" to "Coercion" to "Guardians," he admitted his original rule didn't work for fish or future generations.

  **The Takeaway:**
  Tess proved that **democracy requires borders to function.**
  Omar proved that **borders create injustice.**

  In a real civics context, Tess wins the debate because she defended the *system* we actually use. Omar lost because he proposed a system that sounds nice but is impossible to implement without creating chaos. However, the *best* solution isn't either of theirs—it's giving the downstream neighbors legal protections (lawsuits/contracts) rather than voting rights.
