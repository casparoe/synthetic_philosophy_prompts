      *   *Incommensurability:* Camp A tries to reduce it (hidden common metric). Camp B accepts it as ontological.
      *   *Aggregate Judgment:* Camp A accepts summation. Camp B worries about lexical thresholds.

  6.  **Formulate the Progress Condition:**

      *   If the diagnosis is "Cross-Purpose/Category Error," progress isn't solving the paradox but distinguishing the questions.
      *   If the diagnosis is "Hidden One-Dimensionality," progress is a formal framework for partial orders that handles choice without scalarization (e.g., decision theory under incomplete preferences).
