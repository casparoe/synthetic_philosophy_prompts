          *   Not empirical (is/ought gap).
          *   *Yes:* A conceptual distinction. Separating "Rational Requirement" from "Axiological Truth."
          *   Also: Decision theory for incomplete preferences (e.g., E-admissibility).
      *   *Conclusion:* The question is ill-posed as a single binary. Progress lies in pluralism about the "better than" relation.

