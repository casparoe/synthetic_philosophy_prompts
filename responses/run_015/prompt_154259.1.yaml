answer: |-
  Here is a complete lesson plan designed for your 75-minute slot. It is built to be low-prep (index cards, whiteboard, dice) and high-friction, forcing the students to generate the philosophical problems through gameplay rather than hearing them in a lecture.

  # Activity: The Athenian Market Simulation

  **Class Size:** 18 students
  **Time:** 75 minutes
  **Materials:**
  *   **Index Cards (3 colors):**
      *   *White (Goods):* 40 cards. Write "Grain" on 15, "Shoes" on 10, "Houses" on 5, "Flute Lesson" on 5, "Labor" on 5.
      *   *Blue (Need):* 20 cards. Write "Hungry" (needs Grain), "Cold" (needs Shoes/House), "Bored" (needs Flute), "Overwhelmed" (needs Labor).
      *   *Yellow (Money):* 50 small squares cut from cards. Write "1 Dr" on 40 of them and "5 Dr" on 10 of them.
  *   **Dice:** 3 six-sided dice.
  *   **Whiteboard:** For tracking scores and "Market Prices."
  *   **Timer:** Your phone.

  ---

  ## Part 1: Setup & Rules (5 Minutes)

  **Do not explain Aristotle yet.** Tell them they are heads of households in a small polis.

  1.  **Distribution:** Hand each student 1 **White Good Card** (randomly) and 1 **Blue Need Card** (randomly). Keep the rest of the deck.
  2.  **Goal:** Your goal is to survive and thrive. You score points by satisfying your Need.
  3.  **The Constraint:** You cannot use your own Good to satisfy your own Need (you can't eat your own seed grain, you can't live in the house you're building for a client). You must trade.
  4.  **Scoring:**
      *   Match Good to Need = **10 Points**.
      *   Unmatched Need = **0 Points**.
      *   *Write this on the board.*

  ---

  ## Part 2: Round 1 — The Barter Problem (15 Minutes)

  **Mechanic:** No money allowed. Direct trade only.
  **Time:** 10 mins trading, 5 mins scoring.

  1.  **Action:** Students must walk around and find someone who has the Good they Need and Needs the Good they have.
  2.  **Friction:** This will be chaotic. The person with "Grain" needs "Shoes," but the person with "Shoes" needs a "House," not Grain.
  3.  **The Twist:** After 5 minutes, ring a bell. Tell them: *"Winter is coming. If you haven't traded by the end of this round, your Good perishes."*
  4.  **Scoring:** Ask for a show of hands. Who got 10 points? (Likely less than half).
  5.  **Board Work:** Write "Round 1 Success Rate: ~40%." Ask one student who failed: *"What was the specific problem?"* (They will say: "I couldn't find a match.")

  **Philosophical Target:** *NE* V.5. The impossibility of commensurability without a common measure. "Need" is the metaphysical glue, but it doesn't solve the logistical problem of the "double coincidence of wants."

  ---

  ## Part 3: Round 2 — The Measure (15 Minutes)

  **Mechanic:** Introduce Money (Yellow Cards).
  **Time:** 10 mins trading, 5 mins scoring.

  1.  **Distribution:** Hand out 3 "1 Dr" cards to every student. (Total money in circulation: 54 Dr).
  2.  **Rule:** You can now sell your Good for Dr, and buy what you Need with Dr.
  3.  **Price Setting:** Tell them: *"There are no fixed prices. You must agree on them."*
  4.  **Action:** Trading resumes.
  5.  **Observation:** Trade will flow much faster. However, watch for price confusion. Some will sell Grain for 1 Dr, others for 5 Dr.
  6.  **Scoring:** Count points again. (Success rate should jump to ~80-90%).
  7.  **Board Work:** Write "Round 2 Success Rate: ~90%." Ask: *"What did the Yellow cards do that the White cards couldn't?"* (They will say: "It made it easier," "It split the trade.")

  **Philosophical Target:** Money as the *nomisma* (conventional measure). It makes things commensurable. It represents "Need" (*chreia*) in a portable form.

  ---

  ## Part 4: Round 3 — The Store & The Shock (20 Minutes)

  **Mechanic:** Goods Perish, Money Persists. Needs Change.
  **Time:** 15 mins trading, 5 mins scoring.

  1.  **The Shock:** Collect all **White Good Cards** from the previous round. Tell them: *"All unsold goods from Round 2 have rotted. You produce new Goods now."*
      *   Deal 1 new White Good to everyone.
      *   **Crucial:** Deal 1 new Blue Need card to everyone. (Your needs change).
      *   **Crucial:** They keep their **Yellow Money** from Round 2.
  2.  **The Bankruptcy Rule:** *"If you end this round with 0 Points AND 0 Dr, you are exiled. You sit out the rest of the game."*
  3.  **The Scoring Change:** Write on the board: **Final Score = (Points from Needs) + (2 Points per Dr held).**
      *   *This is the trigger for Unlimited Accumulation.* Previously, money was a means. Now, money is *also* the end.
  4.  **Action:** Trading begins.
      *   *Predictable Outcome:* Some students will have hoarded Dr in Round 2. They are now rich. Some will have spent everything and are vulnerable.
      *   *The Tension:* The rich students realize their Dr is valuable because others *need* it to avoid exile. The poor students realize they need Dr not just to buy goods, but to survive the scoring metric.
  5.  **The Usury Seed:** If a student is desperate (no good, no money), they may ask for a loan. If no one offers, walk by a rich student and whisper: *"If you lend them 5 Dr, they can buy food, survive, and pay you back later. But why would you do that for free?"*
      *   Do not mandate interest. Let them propose it. If a student says, "I'll lend you 5, pay me back 7," **write it on the board.**

  **Philosophical Target:**
  1.  **Money as Store:** Money holds value when goods perish (Hat #2).
  2.  **Unlimited Accumulation:** Because Dr counts toward the *final score*, students will stop trading for Need and start trading for Dr. (*Pol.* I.9).
  3.  **Usury:** Money breeding money (*Pol.* I.10).

  ---

  ## Part 5: The Debrief (20 Minutes)

  Stop the game. Do not announce winners yet. Move to the whiteboard. This is where you map their experience to the text.

  **1. The Incommensurability Problem (Round 1)**
  *   **Ask:** "In Round 1, why was it so hard to trade even though we all had needs?"
  *   **Student Answer:** "I had shoes but he wanted grain."
  *   **Aristotle (*NE* V.5):** "Exactly. 5 beds = 1 house. But beds aren't houses. Aristotle says 'Need' holds the city together, but Need is invisible. You can't hand someone 'Need.' You need a stand-in."

  **2. The Two-Hat Problem (Round 2 vs. Round 3)**
  *   **Ask:** "In Round 2, the Dr was a ruler. It measured the price of grain. In Round 3, I changed the scoring so Dr was worth points itself. Did anyone feel the Dr change from being a *tool* to being a *goal*?"
  *   **Student Answer:** "I stopped buying food I didn't need just to keep the coins."
  *   **Aristotle (*Pol.* I.9):** "This is the slide from *Oikonomia* (household management) to *Chrematistike* (wealth-getting). When the measure becomes the object, there is no limit. You can always want more points."
  *   **The Tension:** "To measure well, money should be stable and neutral (like a ruler). To store value, money must be desirable (like gold). If it's too desirable, everyone hoards it, and trade stops. If it's not desirable, no one holds it. Aristotle thinks this tension corrupts the soul of the trader."

  **3. Usury (The Loan)**
  *   **Ask:** (Point to the interest rate on the board if it appeared). "Someone charged interest. Why does Aristotle hate this specifically? More than selling shoes for profit?"
  *   **Student Answer:** "Because money isn't doing anything."
  *   **Aristotle (*Pol.* I.10):** "He calls it 'money breeding money.' A shoe is made to be worn. Grain is made to be eaten. Money is made to be exchanged. When you charge interest, you make money from money, not from production. It's unnatural because it has no limit."

  **4. The "Need" Illusion**
  *   **Ask:** "Aristotle says Money represents Need. But in Round 3, did anyone trade for something they didn't Need?"
  *   **Student Answer:** "Yes, I bought Dr just for the points."
  *   **Aristotle:** "This is his worry. Once money exists, it masks Need. We start serving the Money, not the Need."

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The Hoarder (The Liquidity Trap)**
  *   **Problem:** One student keeps all their Dr in Round 2. In Round 3, no one has money to trade. Market freezes.
  *   **Fix:** Acknowledge this immediately. "Look, the market has frozen. The 'Measure' has disappeared because everyone is treating it as a 'Store.' This is exactly Aristotle's fear of avarice stopping social cooperation." Turn the failure into data.

  **2. The Moralist (The Refuser)**
  *   **Problem:** One student refuses to charge interest or hoard, saying "It's wrong." They score low.
  *   **Fix:** Do not correct them. In the debrief, highlight them. "This student is practicing *Oikonomia*. They lost points in the game, but Aristotle would say they are the only one living 'according to nature.' The game rewards *Chrematistike*; Aristotle rewards Virtue."

  **3. The Inflationist**
  *   **Problem:** Students try to write their own money on scrap paper.
  *   **Fix:** Shut this down hard. "Only Yellow Cards are legal tender." This reinforces Aristotle's point that money is *nomisma* (law/convention), not just paper. It requires a sovereign authority (you, the TA) to enforce the convention.

  **4. Usury Doesn't Happen**
  *   **Problem:** Rich students just give money away or don't lend.
  *   **Fix:** If you reach the last 5 minutes of Round 3 and no interest has been charged, announce: *"The Bank is closing. Any debt not settled is forgiven."* This removes the risk of lending. If they still don't lend, prompt a specific rich student: *"You have 20 Dr. You will win anyway. If you lend 5 to [Poor Student], they stay in the game. Do you want them exiled?"* This forces the ethical calculation.

  ---

  ## Limitations: What You Must Say Out Loud

  Be honest with them in the last 3 minutes. The game cannot simulate everything.

  1.  **The Source of Value:** "In this game, *I* decided the Dr were worth points. In Aristotle's view, money's value comes from *your* mutual need for each other. I acted as the State; in reality, the 'convention' is a social agreement between citizens."
  2.  **Justice:** "The game rewarded the hoarder. Aristotle thinks the hoarder is unjust. The game simulates the *temptation* of unnatural wealth-getting, not the *virtue* of resisting it."
  3.  **The "Two-Hat" Reality:** "In the game, I forced the hats apart (Round 2 vs Round 3). In reality, money wears both hats simultaneously. That is why Aristotle thinks it's so dangerous: it's hard to tell when you're using the ruler, and when the ruler is using you."

  ## TA Cheat Sheet (Bekker Numbers for the Board)

  *   **Reciprocity & Measure:** *NE* V.5 (1133a-b)
  *   **Household vs. Wealth-Getting:** *Pol.* I.8-9 (1256b-1258a)
  *   **Usury (Money Breeding Money):** *Pol.* I.10 (1258b)
  *   **Convention vs. Nature:** *NE* V.5 (1133a) / *Pol.* I.9 (1257a)

  ---

  ### Why This Works for Your "Two-Hat" Angle
  The game forces the **Measure** function (Round 2) to be efficient, then forces the **Store** function (Round 3) to be lucrative. By changing the scoring rule in Round 3, you physically demonstrate the "slide" Aristotle describes: the moment the token stops being a yardstick and becomes the object of the game. When a student proposes interest, they have independently discovered *tokos* (offspring/interest), allowing you to reveal Aristotle's disgust as the punchline of the lesson.
