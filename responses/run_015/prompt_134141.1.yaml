      *   **The "Rerun History" Test:**
          *   If we rerun history, do we get the same result?
          *   *Weak Path Dependence:* Outcomes converge (e.g., industrialization happens everywhere eventually).
          *   *Strong Path Dependence:* Outcomes diverge based on early noise (e.g., specific keyboard layout, specific tax structure).
