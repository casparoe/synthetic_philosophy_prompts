      *   *Rerunning History:* This is the counterfactual test. If small changes lead to vastly different outcomes, path dependence is strong. If outcomes converge, they aren't.
      *   *Policy (Carbon Tax):* Increasing returns (network effects, sunk costs, adaptive expectations). Once industries retrofit, lobbying structures form, and behavior changes, reversal becomes politically and economically expensive. Is this *true* path dependence or just *political inertia* (status quo bias)? The distinction matters because status quo bias can be overcome with enough will; true lock-in makes the cost prohibitive.
