  hey, i need your take on path dependence—specifically whether history is locked in and if we reran the timeline we'd still get teh same outcomes. please lay out the most important implications for how we should think about irreversible policy choices, like whether adopting a carbon tax creates an institutional ecosystem that adapts around it (making reversal impossible even if the policy is a disaster) or if that's just status quo bias with extra steps. also, does this logic actually apply to tech standards—would QWERTY still dominate if we reran history, or is that example overused? i want to know if big reforms should be treated as one-way bets. don't need references, just reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Core Topic:** Path Dependence.
      *   **Key Question 1:** Is history locked in? (Determinism vs. Contingency). If we reran the timeline, would we get the same outcomes?
