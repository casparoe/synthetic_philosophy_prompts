              *   **Q3: Is fixing the relationship more important than just returning the object?**
                  *   **YES** → **Leaf 11:** [EMPTY] (Same as Leaf 9)
                  *   **NO** → **Leaf 12:** **Position:** The Encyclopedic Museum.
                      *   **Awkward Commitment:** "Museums are just secure storage for owners." (Wait, this overlaps with Leaf 10 mostly).
                      *   **Note:** 'Universal Museum' and 'Encyclopedic Museum' land on the same leaf effectively.
          *   **NO (Restitution Required)**
              *   **Q3: Is fixing the relationship more important than just returning the object?**
                  *   **NO (Property Focus)**
                      *   **Q4: Does the receiver need to prove direct cultural lineage?**
                          *   **YES** → **Leaf 13:** **Position:** The Cultural Nationalist.
                              *   **Awkward Commitment:** "Modern nations might not own their own past if culture shifted."
                          *   **NO** → **Leaf 14:** **Position:** The Strict Repatriationist.
