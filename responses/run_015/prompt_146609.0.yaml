                          *   **NO** → **Leaf 16:** **Position:** The Decolonial Humanist.
                              *   **Awkward Commitment:** "Anyone can claim anything as 'human heritage'."

  ***

  **ANALYSIS OF THE MAP**

  **Occupied vs. Empty**
  *   **The "Provenance Blocks" Branch (Leaves 1-8):** Technically mostly empty because once you answer YES to Q1, Q2-4 don't logically trigger. But in practice, this is where the **Legalist** and **Status Quo** positions live. It's crowded there.
  *   **The "Universal Access" Branch (Leaves 9-12):** Leaves 9 and 11 are empty because it's incoherent to say "Keep it for access" but also "The goal is relational repair." You can't repair a relationship by keeping the stolen item solely for your own public. Leaves 10 and 12 are occupied but basically the same spot.
  *   **The "Restitution" Branch (Leaves 13-16):** This is where the actual seminar debate is. All four are occupied, but Leaf 15 (Relational + Continuity) is the trickiest spot—it's where long-term loans live.

  **Why the empties?**
  *   **Incoherent:** You can't argue for relational repair while refusing return based on access (Leaves 9/11).
  *   **Redundant:** If provenance kills the claim, asking about cultural continuity is useless (Leaves 1-8).
  *   **Unexplored:** Leaf 14 (Strict Property + No Continuity) is rare. Usually, if you care about property, you care about who the specific owner is (Continuity). If you don't care about continuity, you usually care about relationships (Humanism). It's an unstable combo.

