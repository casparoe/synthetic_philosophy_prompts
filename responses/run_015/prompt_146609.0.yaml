  **Status:** Working Notes – pls ignore typos

  Here's the decision tree we discussed. I've tried to strip out the jargon so you can answer the questions based on intuition rather than knowing which philosopher says what. There are 4 splits, which technically makes 16 leaves, but lots of them are logically dead ends.

  **THE TREE**

  **Q1: If the paperwork is missing or messy (provenence), does that kill the moral claim?**
