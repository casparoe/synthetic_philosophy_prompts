      *   **Leaf 1-8 (All Q1=YES paths):** **Position:** The Legalist / Status Quo Defender.
          *   **Awkward Commitment:** "Loot stays loot if the receipt is lost."
          *   **Note:** 'Legalist' and 'Preservationist' both land here. The tree can't separate them.

  *   **NO (Claim Survives)**
      *   **Q2: Does keeping it for everyone to see ever trump sending it home?**
          *   **YES (Access Trumps)**
              *   **Q3: Is fixing the relationship more important than just returning the object?**
