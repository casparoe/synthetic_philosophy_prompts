      *   **Goal:** The user wants a breakdown of the distinct precise claims underlying the "Bad Lot" objection, an evaluation of their strength (platitude vs. substantive vs. false), an assessment of whether they block the inference, and a diagnosis of what the interlocutor likely meant.
      *   **Format:** A numbered list suitable for bringing to an advisor.

  2.  **Deconstruct "Inference to the Best of a Bad Lot" (IBBL):**
