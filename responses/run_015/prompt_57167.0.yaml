          *   *Reply:* Coherentist, or pragmatic vindication.
          *   *Note:* This is less about the "Bad Lot" specifically and more about IBE generally, but often conflated.

      *   *Reading 5: The "Privilege" vs. "Threshold" distinction (Van Fraassen's specific point).*
