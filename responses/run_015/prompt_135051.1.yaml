  I am drafting a conceptual paper on the philosophy of science in the early modern period, and I have adopted an interpretive stance that strikes most historians of science as too charitable: that Johannes Kepler’s astrological writings express a coherent philosophical position—call it mechanistic dispositionism—rather than being merely a patronage strategy or an embarrassing anachronism. On this reading, Kepler rejects deterministic natal astrology (he denies that celestial bodies compel specific human actions), yet he maintains that planetary configurations actualize dispositional properties in terrestrial matter, including human temperament, through geometric relations rather than through Aristotelian qualitative influence, occult sympathy, or direct causal force. The view is meant to be continuous with his celestial mechanics: both depend on the idea that mathematical structure in the heavens is physically efficacious without being deterministically causal, and both sit within a theology that emphasizes a Creator who institutes regular mathematical laws rather than intervening ad hoc. I want to subject this interpretation to serious stress-testing.

