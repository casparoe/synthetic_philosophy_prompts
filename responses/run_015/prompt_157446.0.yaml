  hey — I'm a TA for a graduate seminar on higher-order evidence that meets tuesday mornings, and the professor has this habit where he writes a case on the board, then writes his verdict under it in green marker, and flatly refuses to ever state a general principle ("the cases are the theory", he says). I've been keeping a list so I can try to reverse-engineer him, and next week I want to bring in a case of my own and see where he lands, so I'd like to predict him first. His verdicts so far, compressed: (1) you work through a proof while fairly drunk, conclude it's valid, sober up, can't reconstruct it — defeat, drop to roughly even odds, and it is *not* OK to keep a high credence while conceding the reasoning was drunk; (2) you're given a drug that a well-run study shows impairs performance on probabilistic puzzles, and you're doing a probabilistic puzzle — defeat, down to about 0.55, same remark about not just tacking on a second-order worry; (3) same drug, but the study says it only touches probabilistic reasoning and you're doing a propositional-logic proof — no defeat, stay at 0.95; (4) an epistemic peer who has tracked you in accuracy on this exact topic disagrees on a hard metasemantics claim — split the difference, about 0.6, and again keeping 0.9 while conceding she's your equal is not allowed; (5) same as 4 except you also learn she's just been given the logic-impairing drug, and you have nothing but your own reasoning — no defeat, the disagreement doesn't move you at all; (6) you learn that researchers using your exact statistical technique are prone to a known error, but a later replication finds the error is rare in the subcase your analysis falls under — partial defeat, 0.9 down to about 0.75, and here he added unprompted that keeping 0.9 while conceding you're not in a position to claim knowledge is "not irrational" either; (7) you learn your evidence base looks one-sided only because an assistant dropped half the dissenting studies from your folder,