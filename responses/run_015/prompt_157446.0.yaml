  my case: you've spent two hours working carefully through a large mixed evidence base (some statistical, some testimonial) and settled on p at 0.85 with detailed notes, and you can't redo it because a decision is due in an hour. Then, from a source you fully trust, you learn three things: (i) a large well-run study found that people doing exactly this kind of multi-step evaluation while mildly sleep-deprived — and you were — are just as accurate as rested people, no measurable effect on accuracy; (ii) the same study found their confidence is inflated by about ten points; (iii) a follow-up found that when sleep-deprived evaluators are told (i) and (ii) and asked to re-set their confidence, they over-correct and end up below the level their accuracy supports. You also can never tell from the inside whether you're sleep-deprived. So the question for him is: what should your credence in p be now; is staying at 0.85 while conceding that your confidence is miscalibrated irrational (is that epistemic akrasia, and is it OK here); and does it change anything that the first-order process is unimpaired and only the attitude is off?

  what I want from you: the two or three or four distinct rules that fit all eight of his verdicts (call them what you like, and please don't pin them to named philosophers — I can do that myself, and I don't want to argue about who said what), what each predicts about my case specifically — a number, whether revision is required or merely permitted, whether retention at 0.85 counts as akrasia and whether it's rationally fine — which one you'd actually bet on and why, and which further case would separate the rules mine doesn't. I was going to re-run it with (iii) flipped so that the told subjects correct well rather than over-correct; tell me whether that's the right discriminator or whether something else pulls the rules apart more cleanly. Also flag if my case is ill-posed in some way that would let him dodge it. Oh, and one more thing: if he thinks the cases are the theory, I'd also like one sentence on what he should write in green marker under mine given what he's written before, separate from what I'd write.

  give it back as a JSON object with these fields: "rules" — an array, one object per candidate rule, with fields "rule_name", "one_sentence_statement", "track_record_fit" (an object with "explains" and "strains_or_conflicts", each a list of the case numbers 1-8 with a few words on why), "prediction_new_case" (an object with "credence" as a number, "revision" as one of "required / permitted / not required", "retention_at_0.85" as one of "irrational / permissible / rationally fine", "is_that_akrasia" as a boolean, and "verdict_in_green_marker" as the one line you think he'd actually write), and "probability_this_is_his_rule" as a number between 0 and 1; then "best_guess" with "rule_name", "predicted_verdict", and "why" (two or three sentences); "discriminating_case" with "description", "predictions" (a map from rule name to prediction), "which_rules_it_separates", and "is_my_flipped_case_the_right_one"; "ill_posed" with "is_my_case_badly_specified" and "what_needs_fixing"; and "confidence" as a number between 0 and 1.
