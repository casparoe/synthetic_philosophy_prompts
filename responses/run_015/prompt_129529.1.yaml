prompt: |-
  i'm putting together a syllabus on climate ethics but i'm tired of the same old carbon-tax-vs-cap-and-trade framing. i want you to write the desiderata for a theory of climate obligation that takes carbon pricing, direct regulation, and degrowth seriously not as interchangeable policy levers but as competing moral ontologies: one treats harm as fungible and compensable, one treats it as a hard boundary that can't be priced, and one treats growth itself as the underlying harm.

  give me the full spec. what cases must it get right -- e.g., a factory that can pay it's way out versus one that has to be shut, a community that needs to contract consumption versus one that needs to build green infrastructure, and a rich country that owes precise compensation versus one that owes a structural transformation? for each, say why it's a test case and not just an example. then list the distinctions it can't collapse: efficiency vs justice, aggregate reduction vs distributive burden, intergenerational vs intragenerational equity, and whatever else belongs there -- with the consideration behind each.

  also flag which results it can't contradict. i'm thinking of things like the empirical point that pricing alone misses non-market externalities, or that degrowth without redistribution tends to reproduce colonial patterns of extraction. but you should include whatever genuinely constrains the theory.

  crucially, tell me which desiderata are genuinely non-negotiable and which are just liberal economics in disguise. and is there a joint unsatisfiability problem hiding in the list? specifically, can you really hold that carbon harm is incommensurable with money AND that rich countries owe precise, quantifiable compensation for past emissions? if some subset of the requirements can't all be satisfied together, say so -- thats the part i care about most.

  briefly score the three main approaches -- market pricing, green-new-deal-style regulation, and post-growth / degrowth -- against the list, but keep it short. the criteria are the point, not the scorecard.

  oh, and don't ask me for a bibliography. i don't have one and a model without web access shouldn't need to fake citations.
