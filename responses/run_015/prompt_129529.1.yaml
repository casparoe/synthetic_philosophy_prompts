answer: |-
  # Syllabus Spec: Moral Ontologies of Climate Obligation

  ## I. The Three Ontologies
  This syllabus treats policy mechanisms not as tools in a single toolbox, but as expressions of competing moral metaphysics.

  1.  **Market Pricing (Neoclassical/Utilitarian):** Harm is **fungible**. Carbon is an externality to be internalized. Moral obligation is satisfied when the social cost equals the private cost. The unit of analysis is the *transaction*.
  2.  **Direct Regulation (Deontological/Threshold):** Harm is a **boundary**. Certain emissions violate rights or biophysical limits regardless of cost. Moral obligation is satisfied by adherence to the constraint. The unit of analysis is the *act*.
  3.  **Degrowth/Post-Growth (Structural/Relational):** Harm is **systemic**. Growth itself is the metabolic error. Moral obligation is satisfied by reducing throughput and reorienting social purpose. The unit of analysis is the *system*.

  ## II. Critical Test Cases
  A viable theory must resolve these not by picking a policy, but by declaring which ontology takes precedence.

  | Test Case | The Scenario | Why It Is A Test (Not Just An Example) |
  | :--- | :--- | :--- |
  | **The Pay-to-Pollute Factory** | A factory emits beyond a safe threshold but pays a high tax/offset fee that funds green projects elsewhere. | **Tests Fungibility vs. Integrity.** Pricing accepts this as efficient; Regulation rejects it as a rights violation; Degrowth rejects it as sustaining the logic of accumulation. The theory must decide if moral clearance can be bought. |
  | **The Divergent Communities** | Community A (Global North) must contract energy use to stay within budget. Community B (Global South) must increase energy use for basic adaptation/infrastructure. | **Tests Universalism vs. Differentiation.** Pricing treats tons as equal regardless of source; Regulation struggles with unequal starting points; Degrowth demands asymmetric contraction. The theory must define *who* shrinks without invoking colonial paternalism. |
  | **The Rich Country's Debt** | A historical emitter owes restitution. Do they write a check (compensation) or dismantle their economic engine (transformation)? | **Tests Restorative vs. Transformative Justice.** Pricing quantifies the debt (commensurable); Degrowth argues the debt is structural (incommensurable). The theory must determine if the past can be settled without changing the future. |

  ## III. Distinctions That Cannot Be Collapsed
  The theory must maintain conceptual separation between these pairs. Collapsing them is where most frameworks fail.

  1.  **Efficiency vs. Justice:**
      *   *Consideration:* Efficiency minimizes aggregate cost; Justice distributes burden according to moral desert. A solution can be efficient and unjust (e.g., taxing the poor to offset the rich).
  2.  **Aggregate Reduction vs. Distributive Burden:**
      *   *Consideration:* Hitting 1.5°C (aggregate) is physically distinct from who suffers the transition (distributive). A theory that optimizes for the former often violates the latter.
  3.  **Intergenerational vs. Intragenerational Equity:**
      *   *Consideration:* Saving the future (inter) often requires extracting resources from the present poor (intra). Prioritizing one can actively undermine the other.
  4.  **Mitigation vs. Adaptation:**
      *   *Consideration:* Mitigation prevents future harm; Adaptation manages existing harm. Treating them as interchangeable allows emitters to pay for adaptation rather than stopping emissions (a moral hazard).
  5.  **Responsibility vs. Capacity:**
      *   *Consideration:* "Polluter Pays" (responsibility) differs from "Ability to Pay" (capacity). A theory must specify which principle governs when they conflict (e.g., a poor polluter vs. a rich non-polluter).

  ## IV. Empirical and Theoretical Constraints
  The theory cannot contradict these established findings without losing contact with reality.

  1.  **Price Inelasticity of Basics:** Energy demand for survival does not respond to price signals. Pricing mechanisms fail when consumption is non-discretionary.
  2.  **The Jevons Paradox:** Efficiency gains often lead to increased consumption, not reduction. A theory relying solely on efficiency is self-defeating.
  3.  **Colonial Reproduction:** Decarbonization that relies on extracting lithium/cobalt from the Global South to sustain Northern consumption reproduces colonial extraction patterns.
  4.  **Biophysical Non-Linearity:** Tipping points do not respect economic gradualism. Smooth pricing curves cannot account for abrupt systemic collapse.
  5.  **Political Feasibility of Contraction:** Voluntary contraction in a growth-dependent economy triggers recession and instability. A theory demanding degrowth must account for the transition mechanics, not just the moral end-state.

  ## V. Non-Negotiables vs. Liberal Economics in Disguise
  You must distinguish between ethical floor-boards and ideological smugglers.

  **Genuinely Non-Negotiable:**
  *   **Biophysical Limits:** The atmosphere has a carrying capacity independent of human valuation.
  *   **Basic Rights:** Access to air, water, and thermal stability cannot be commodified.
  *   **Non-Colonialism:** Solutions cannot rely on externalizing harm to vulnerable populations.

  **Liberal Economics in Disguise (Flag These):**
  *   **"Social Cost of Carbon":** Pretends to be objective science but relies on ethical choices about discount rates and the value of statistical life.
  *   **"Sustainable Development":** Often assumes growth can be fully decoupled from resource use (empirically contested).
  *   **"Pareto Efficiency":** Requires that no one be made worse off, which effectively vetoes necessary structural transformation.
  *   **"Discounting the Future":** Mathematically encodes the moral judgment that future lives are worth less than present ones.

  ## VI. The Joint Unsatisfiability Problem
  **Yes, there is a logical contradiction hiding in the requirements.**

  You cannot consistently hold that **Carbon Harm is Incommensurable** (Regulation/Degrowth view) AND that **Rich Countries Owe Precise, Quantifiable Compensation** (Market/Price view).

  *   **The Contradiction:** If harm is incommensurable (a rights violation, an existential threat, a sacred boundary), it belongs to a different moral category than money. Money is a tool of equivalence. To demand *precise* compensation is to admit that the harm *is* commensurable with currency.
  *   **The Consequence:** A theory must choose one of the following resolutions:
      1.  **Admit Incommensurability:** Reject precise compensation. Demand structural transformation, technology transfer, and debt cancellation instead. Money is merely a symbolic down payment, not a settlement.
      2.  **Admit Commensurability:** Accept that rights can be violated if the price is paid. This validates the "pay-to-pollute" ontology.
      3.  **The Hybrid Dodge:** Claim money is a "proxy" for structural change. This is logically unstable. If the money isn't spent on transformation, was the debt paid? If the transformation happens without money, was the debt owed?

  **Verdict:** A coherent theory must explicitly reject the idea that past emissions can be *settled* via currency. It must frame financial transfer as *reparative infrastructure* rather than *compensatory damages*.

  ## VII. Brief Scoring of Approaches

  | Approach | Performance on Desiderata | Critical Failure Point |
  | :--- | :--- | :--- |
  | **Market Pricing** | **Pass:** Efficiency, Quantifiable Compensation.<br>**Fail:** Incommensurability, Non-Colonialism, Biophysical Limits. | Collapses Justice into Efficiency. Treats rights violations as costs. Fails the "Pay-to-Pollute Factory" test morally, even if it passes economically. |
  | **Green New Deal (Regulation)** | **Pass:** Biophysical Limits, Basic Rights, Distributive Burden.<br>**Fail:** Degrowth Constraint, Incommensurability (sometimes). | Often assumes growth can continue via green tech. Struggles with the "Rich Country Debt" if it relies on domestic industrial expansion to fund the transition. |
  | **Degrowth / Post-Growth** | **Pass:** Incommensurability, Non-Colonialism, Systemic Harm.<br>**Fail:** Political Feasibility, Precise Compensation. | Lacks a mechanism for immediate transition without collapse. Struggles to quantify obligations (rejects the "Precise Compensation" constraint as category error). |

  **Summary:** Market Pricing solves the calculation problem but fails the moral ontology. Degrowth solves the moral ontology but fails the transition mechanics. Regulation sits in the middle but risks satisfying neither. Your syllabus should focus on the friction between these failures, not the promise of their synthesis.
