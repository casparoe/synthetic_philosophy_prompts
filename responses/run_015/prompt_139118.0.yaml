  4.  **Refining the "Strictly Require" vs. "Sit Comfortably" Distinction:**
      *   This is the crux of the paper.
      *   *Strictly Require:* There must be *some* correlate for moral status (you can't protect nothing). There must be a way to identify individuals (individuation).
      *   *Sit Comfortably:* The specific day (5 dpf) doesn't require *that* day, just *a* day. The mammal bias doesn't require mammals are intrinsically better, just that they are safer bets.
      *   *Key Insight:* The system is designed for *auditability*, not *truth*. It requires markers that are visible to an inspector, not necessarily markers that are ontologically precise.

  5.  **Drafting the Response (incorporating constraints):**
      *   Tone: Academic but conversational (peer-to-peer).
