      *   **Task:** Reconstruct the *implicit theory* presupposed by these practices (not argue what *should* be done). Use the TA's lens (rules substitute stand-ins for consciousness).
      *   **Specific Questions to Address:**
          *   What does the "independent feeding" line (Day 5 zebrafish) presuppose about consciousness (threshold vs. gradual, administrative convenience)?
          *   What does the beagle-vs.-fish weighting presuppose (moral weight vs. expected value/uncertainty)?
          *   What does "humane death" presuppose (badness of dying vs. suffering)?
          *   What does the octopus exception imply about behavioral/functional criteria and consistency?
          *   **Core Goal:** Distinguish between what the rules *strictly require* you to believe vs. what they merely *sit comfortably with* (underdetermination).
          *   **Concrete Thought Experiment:** What would change if we switched to an explicit expected-value calculation?
          *   **Constraints:** No reading list/citations. Argue it out. State confidence levels for main claims. Identify the least certain claim.

  2.  **Deconstruct the Regulatory Landscape (Mental Model):**
      *   *Zebrafish:* Embryos/larvae < 5 dpf (days post-fertilization) = not protected. > 5 dpf = protected. Why 5 dpf? Onset of feeding/swimming.
      *   *Mammals/Birds:* High protection.
      *   *Fish/Reptiles:* Lower protection than mammals, higher than invertebrates.
      *   *Invertebrates:* Generally unprotected *except* Cephalopods (octopuses).
      *   *Underlying Logic:* It's a mix of phylogenetic similarity (nervous system structure), behavioral complexity, and administrative pragmatism.

  3.  **Address the Specific Questions (Drafting Arguments):**

      *   **Q1: The Day 5 Line (Independent Feeding).**
          *   *Philosophical tension:* Consciousness is likely gradual. The rule is binary.
          *   *Presupposition:* It doesn't necessarily claim consciousness *switches on* like a light. It claims consciousness is *correlated* with functional independence.
          *   *Alternative:* It's purely administrative. A "safe harbor" line.
          *   *Reconstruction:* The rule presupposes that *capacity for nociception* (pain perception) coincides with the capacity for independent survival behavior. It treats a developmental milestone as a proxy for moral status.
          *   *Underdetermination:* Compatible with both "Consciousness actually starts here" (Threshold View) and "We don't know, so we pick a visible marker before we think it starts" (Precautionary View).

      *   **Q2: Beagles vs. Ten Thousand Fish.**
          *   *Philosophical tension:* Utilitarian calculus (Suffering x Number) vs. Speciesism/Phylogenetic Weighting.
          *   *Presupposition:* Moral weight is not linear. A mammal life > a fish life.
          *   *Expected Value (EV) View:* If we are uncertain about fish consciousness, we discount their moral weight. If we are certain about dogs, we weight them heavily.
          *   *Reconstruction:* The rules presuppose that *uncertainty* functions as a discount rate. We are more confident in dog pain than fish pain.
          *   *Underdetermination:* Compatible with "Dogs matter more intrinsically" (Hierarchical View) and "We are just more sure about dogs" (Epistemic View).

      *   **Q3: Humane Death vs. Killing.**
          *   *Philosophical tension:* Is death the harm, or is the *process* the harm?
          *   *Presupposition:* Killing is permissible (for science), but *suffering during* killing is not.
          *   *Reconstruction:* The badness lies in the *experience* of dying, not the cessation of existence. It separates "welfare" from "rights to life."
          *   *Underdetermination:* Compatible with "Animals have no right to life" and "Animals have a right to life but science overrides it, provided we minimize pain."

      *   **Q4: The Octopus Exception.**
          *   *Philosophical tension:* Phylogeny (invertebrate) vs. Behavior/Cognition (complex).
          *   *Presupposition:* Neural structure isn't the *only* metric; behavioral complexity matters.
          *   *Implication:* If behavior is the metric, crabs/lobsters might qualify.
          *   *Reconstruction:* The rule presupposes a *functionalist* criterion for specific high-performing invertebrates, but retains a *structuralist* criterion for the rest. It's an inconsistency held together by "exceptional evidence."

      *   **Q5: Expected Value Calculation (The Switch).**
