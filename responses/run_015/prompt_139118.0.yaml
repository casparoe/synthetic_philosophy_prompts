prompt: |-
  so i'm taking this seminar on animal minds (philosophy, cross-listed with bio) and i also have a work-study job pipetting in a zebrafish lab, and having both at once has made me notice that we already have a big pile of rules that seem to answer questions my seminar keeps insisting are completely open. The one that got me: in our lab the embryos and young larvae don't count as animals at all — no protocol, no paperwork, nothing — and then basically once they're feeding on their own, around day 5 iirc (I might have the exact day wrong), they do, and from that moment every procedure needs sign-off, we have to do the 3Rs thing, and we need a humane endpoint for killing them at the end. Meanwhile the same university treats a protocol with a couple of beagles in it as a vastly bigger deal than the several hundred fish my lab gets through a semester, the rules for mammals and birds are much stricter than for fish or reptiles, and invertebrates mostly get nothing at all — except octopuses, which do get something, even though they're about as distant from us as an animal gets. And the bit I can't get straight: the people in the lab, the PI included, will cheerfully say out loud that nobody really knows whether fish feel pain, and then go right back to following the line with zero apparent discomfort.

  For my final paper I'm supposed to be reconstructing what the practices presuppose rather than arguing what we should do instead, and my TA handed us a lens I keep turning over: she said that since nobody can measure consciousness directly, every rule quietly substitutes a stand-in for it — resemblance of the nervous system to ours, behavior that would be strange unless the animal was in pain, position on the family tree — and different rules substitute different stand-ins, which is why they cut in different places. So: use that or don't, but reconstruct the implicit theory. What does drawing the line at independent feeding presuppose about consciousness — that it's the sort of thing that switches on at a point rather than fades in, that its onset can be read off something as unglamorous as how the animal eats, or nothing at all beyond the need for a bright line somebody can administer cheaply? Does the beagle-versus-ten-thousand-fish weighting presuppose that moral weight isn't just expected suffering times headcount, or could an expected-value view actually reproduce it once you put in how much we trust the evidence for each species? What does requiring a humane death for animals we were going to kill anyway presuppose about the difference between the badness of dying and the badness of suffering? And is the octopus exception quietly committed to a behavioral/functional criterion that if applied consistently would drag in insects and crustaceans and blow up the rest of the scheme?

  What I'd really like is the difference between what these rules strictly require you to believe and what they merely sit comfortably with — where the practice is underdetermined and several rival theories (threshold vs. gradual, similarity-based vs. precautionary, anything else) would all license exactly the rules we have. Then tell me concretely what would have to change if we replaced the stand-in approach with an explicit expected-value calculation: which rules survive, which flip. Please don't give me a reading list or citations, I can't chase references this week, just argue it out. And say how confident you are in each of your main claims, and single out the one you're least sure of — the piece you'd give up first if someone who actually works on this pushed back on it.
reasoning: |-
