      *   *Option C: Reject (4) Integration Conditions.* This is the most promising spot. The friend claims ownership/exclusivity doesn't matter. But standard EMT *does* implicitly rely on a specific kind of coupling that is tighter than the Co-op case.
      *   *Option D: Reject (6)/(7) The Leap to "Shared Mind".* Just because memory is extended doesn't mean the *subject* of experience is distributed. This is the "Subjectivity" or "Phenomenology" objection.
      *   *Option E: Distinguish Coupling vs. Constitution.* The classic Adams & Aizawa objection.

  4.  **Develop the Core Counter-Argument:**
      *   The friend's argument conflates *extended cognition* with *distributed cognition* and *shared agency*.
      *   EMT (Clark & Chalmers) is about the *vehicle* of a specific cognitive process for a *specific subject*.
      *   The Co-op case introduces *other subjects* (the other 5 gardeners).
      *   **Crucial Distinction:** Otto's notebook is passive. The other gardeners are active agents with their own intentions.
      *   **The "Glue and Trust" criteria need refinement:** It's not just reliability; it's about *endorsement* and *integration into the subject's decision-making loop*.
      *   **Premise to Attack:** Premise (4) and the inference to (6). The friend assumes that because the *information* is accessible, the *cognitive process* is shared. But accessing information isn't the same as sharing a mind.
      *   **Better Attack:** The "Mark of the Cognitive." Adams & Aizawa argue that cognitive processes must involve intrinsic content. But a softer version is the "Subjectivity Constraint."
      *   **Best Attack for an EMT Defender:** Reject the move from "Extended Memory" to "Shared Mind." Accept that the ledger is part of the *system*, but deny that the system constitutes a *single mind*. Or, more precisely, reject Premise (4)'s claim that ownership/agency boundaries don't matter.

  5.  **Refining the Distinction (Otto vs. Co-op):**
      *   **Otto:** Notebook is a *tool* under his exclusive control. He decides what goes in. It has no agency.
      *   **Co-op:** Ledger is a *social contract*. Other people have agency over the content.
      *   **The "Endorsement" Condition:** For EMT, the external resource must be *automatically endorsed*. In the Co-op, do I automatically endorse Dana's entry? No, I trust the *system*, but I might query Dana. There's a layer of social negotiation missing in Otto's case.
      *   **The "Subject" Problem:** EMT extends the *vehicles* of cognition for a *subject*. It does not merge *subjects*. The Co-op case tries to merge subjects.

  6.  **Addressing Specific Moves & Costs:**
      *   *Coupling-Constitution Fallacy:* Adams & Aizawa. Cost: You have to define "cognitive" intrinsically. Hard to do without brain-chauvinism. Rejects (2).
      *   *Scaffolding:* The ledger is scaffolding, not part of the mind. Cost: Arbitrary line drawing. Why is Otto's notebook different? Rejects (1).
      *   *Integrationist (Clark's later view):* Focus on "deep integration." Cost: Vagueness.
