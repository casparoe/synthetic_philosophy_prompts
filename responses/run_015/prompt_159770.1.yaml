      4.  The "Subjectivity Constraint": Extended Vehicles vs. Shared Subjects.
      5.  Evaluate the standard moves (Coupling, Scaffolding, etc.) as requested.
      6.  Conclusion: What you sign up for.

      *Self-Correction on Premise (5):* The friend argues the Co-op is *better* (more reliable, self-correcting). This is true functionally. So rejecting (5) on functional grounds is hard. The rejection must be on *structural* grounds regarding *agency*. The parity principle compares internal processes to external *resources*. Are other people "resources"?
      *Clark's view:* He actually *likes* the idea of social extension. So a hardline Clarkian might accept (6).
