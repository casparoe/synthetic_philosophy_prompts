      *   *Check:* Did I address the "anomaly detection" use case? *Action:* Frame constraints around false positives/negatives in monitoring.
      *   *Check:* Did I address the friend's objection ("what do you mean by same mechanism")? *Action:* Explicitly tackle the definition problem in the trade-off section.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Suggest using activation distances.
      *   *Correction:* Activation distances aren't basis invariant either without care. Need to mention *feature* spaces or causal graphs.
      *   *Initial thought:* Say "causal mediation is settled."
      *   *Correction:* It's the *method*, but what counts as a significant causal effect is debated. Be precise.
      *   *Crucial Point:* The user wants to detect *internal* changes. If the internal representation rotates but the features remain semantically identical, is that a change? For safety, maybe yes (could indicate obfuscation). For stability, maybe no. I need to highlight this tension.

  8.  **Final Polish:** Ensure the tone is collaborative but rigorous. Avoid jargon without explanation. Make sure the "Unsatisfiable Subset" section is the highlight, as requested. (This is the "value add").

      *   *Key Insight for Unsatisfiable Subset:* You cannot simultaneously have (A) Perfect Basis Invariance, (B) Sensitivity to Obfuscated/Adversarial Mechanism Shifts, and (C) Human-Interpretable Grounding. You usually have to sacrifice one. For safety monitoring, (B) is crucial, which might hurt (A) or (C).

  9.  **Final Review against constraints:**
      *   Cases to get right? Included.
      *   Distinctions not to collapse? Included.
      *   Empirical facts? Included.
