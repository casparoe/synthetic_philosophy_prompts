prompt: |-
  I'm building a detector whose whole job is to flag when a neural net's internal machinery has changed, not just when its outputs look weird -- so less 'is this prediction out of distribution' and more 'is the net now getting it's answer by a different route than it used to, even if the answer still looks fine.' It was coming up in a conversation with a friend who works on interpretability and she kept answering 'well, what do you mean by same mechanism' and I honestly couldn't push back, because every definition I try breaks on some case. Before I lock one in, can you write out the desiderata -- what any adequate account of mechanism-identity has to actually deliver for this use? I mean the cases it has to get right (the same function computed by two structurally different circuits; a circuit that gets reused across several unrelated tasks; a mechanism that survives a weight update but has been re-expressed in a different basis; a spurious correlation that just looks mechanism-like; the same high-level mechanism seen at two very different granularities), the distinctions it can't collapse (functional equivalence vs. structural or causal identity, a mechanism vs. a sub-mechanism, and the granularity question of at what level of abstraction we even do the comparing), and any empirical fact about how these models actually work that it can't contradict (overparameterization, superposition, the fact that lots of different weight configurations can do the same job).

  Put the case or motivation behind each item rather than just listing them, mark wich ones you think are non-negotiable for the anomaly-detection use vs. which are just preferences of one camp, and tell me if any subset of the list looks jointly unsatisfiable -- that would be the single most useful thing you could give me. And please keep straight what's basically settled among people who actually do this work from what's genuinely still being argued about; don't dress up a contested reading as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user is building a "mechanism change detector" for neural networks. They want to flag internal changes even if outputs remain stable.
      *   **Problem:** They lack a robust definition of "same mechanism." Every definition they try fails on edge cases.
      *   **Task:** Write out the *desiderata* for an adequate account of mechanism identity suitable for this use case.
      *   **Specific Requirements:**
          *   Include cases it must get right (functional equivalence, reuse, basis invariance, spurious correlations, granularity).
          *   Include distinctions it must not collapse (functional vs. structural/causal, mechanism vs. sub-mechanism, granularity).
          *   Include empirical facts it cannot contradict (overparameterization, superposition, many-to-one mapping).
          *   Provide motivation/case for each item.
          *   Mark items as "Non-negotiable" (for anomaly detection) vs. "Preferences/Theoretical Debates."
          *   Identify any jointly unsatisfiable subsets (trade-offs).
          *   Distinguish settled science from contested theory.
      *   **Tone:** Rigorous, precise, aware of the interpretability literature (mechanistic interpretability), honest about uncertainties.

  2.  **Deconstruct "Mechanism Identity" in the Context of Neural Nets:**
      *   What is a mechanism? In mechanistic interpretability (MI), it's usually a circuit or a set of features/directions in activation space that causally contribute to a specific behavior.
      *   Why is identity hard? Neural nets are high-dimensional, overparameterized, and invariant to many transformations (permutation, scaling, rotation in certain layers).
      *   The user's specific goal is *anomaly detection* (monitoring for drift/alignment faking/tampering). This adds a constraint: the definition must be *operationalizable* and *sensitive* to meaningful changes but *robust* to irrelevant ones.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Functional Equivalence vs. Structural Identity.*
          *   *Case:* Two nets produce same logits but one uses attention heads A&B, the other uses C&D.
          *   *Requirement:* The detector must flag this as a change.
          *   *Status:* Non-negotiable for the user's goal.
          *   *Settled?* Yes, MI distinguishes behavior from mechanism.

      *   *Item 2: Basis/Reparameterization Invariance.*
          *   *Case:* Weights change due to optimization noise or basis rotation (e.g., in MLPs) but the function computed by the neurons relative to each other is the same.
          *   *Requirement:* The detector must *not* flag this as a change.
          *   *Status:* Non-negotiable (otherwise too many false positives).
          *   *Settled?* Mostly, but *how* to achieve this is contested (e.g., activation vs. weight space).

      *   *Item 3: Granularity/Abstraction.*
          *   *Case:* Is a "math circuit" one mechanism or 100 sub-mechanisms?
          *   *Requirement:* Must define the level of analysis.
          *   *Status:* Preference/Design Choice.
          *   *Settled?* No. "Natural abstraction" is a hypothesis, not a fact.

      *   *Item 4: Superposition & Polysemanticity.*
          *   *Case:* A neuron direction represents feature X in context A and feature Y in context B.
          *   *Requirement:* Cannot assume 1-to-1 mapping of neurons to features.
          *   *Status:* Non-negotiable (empirical fact).
          *   *Settled?* Yes, superposition is widely accepted.

      *   *Item 5: Causal vs. Correlational.*
          *   *Case:* A neuron activates with the output but ablating it does nothing (spurious).
          *   *Requirement:* Must rely on causal influence, not just correlation.
          *   *Status:* Non-negotiable.
          *   *Settled?* Yes, causal mediation is the gold standard in MI.

      *   *Item 6: Continuity vs. Discreteness.*
          *   *Case:* Weights drift slightly. Is it a new mechanism?
          *   *Requirement:* Needs a threshold or metric of "distance."
          *   *Status:* Non-negotiable for implementation.
          *   *Settled?* No, metric choice is open.

      *   *Item 7: Modularity/Reuse.*
          *   *Case:* Same circuit used for addition and subtraction.
          *   *Requirement:* Identity should track the circuit, not the task label.
          *   *Status:* Preference (depends on monitoring goal).
          *   *Settled?* Circuits are often task-specific but share components.

  4.  **Identifying Tensions/Unsatisfiable Subsets:**
      *   *Tension 1: Basis Invariance vs. Interpretability.* To be basis invariant, you often need to move to activation space or canonical forms. But canonical forms are hard to compute and might lose the "human-readable" semantics.
      *   *Tension 2: Fine-Grained Causal Identity vs. Robustness.* If you demand exact causal graphs, tiny weight noise looks like a change. If you smooth too much, you miss subtle misalignments.
      *   *Tension 3: The "Same Mechanism" Paradox.* If the weights change significantly (due to training) but the function is the same, is it the same mechanism? For *monitoring*, we usually care if the *algorithm* changed. But if the algorithm is implemented differently in weight space, how do we know?
      *   *Major Conflict:* **Basis Invariance vs. Weight Monitoring.** You can't monitor weights directly for mechanism identity because of permutation/basis symmetries. You *must* monitor something higher-level (features/circuits). But defining features robustly is the core unsolved problem of MI.

  5.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the difficulty (the "Ship of Theseus" problem for NNs).
      *   Section 1: Non-Negotiable Desiderata (The "Must-Haves" for the detector to work).
      *   Section 2: Empirical Constraints (Facts of NN architecture).
      *   Section 3: Theoretical/Design Choices (Where the field disagrees).
      *   Section 4: The Impossibility Results/Trade-offs (The "Jointly Unsatisfiable" part).
      *   Conclusion: Recommendation on where to anchor.

  6.  **Drafting Content - Specific Checks:**
