      *   Jointly unsatisfiable? Highlighted.
      *   Settled vs. Contested? Distinguished.

      *(Self-Correction on "Settled"):* Be careful. Very little is truly "settled" in MI. Use "Broad Consensus" vs. "Active Debate."

      *(Refining the "Mechanism" definition):* Acknowledge that "mechanism" is often a proxy for "algorithm implemented by weights."

      *(Final check on the "Friend's Objection"):* The friend is right that "mechanism" is ill-defined. The response should validate that while providing the best available scaffolding.

