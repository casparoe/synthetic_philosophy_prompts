answer: |-
  This is one of the hardest open problems in mechanistic interpretability (MI). Your friend is right to press you: there is no consensus definition of "mechanism identity" that survives all edge cases. In philosophy of science, this is the "multiple realizability" problem; in neural nets, it's compounded by high-dimensional symmetries and superposition.

  For an **anomaly detector**, you are not just asking a metaphysical question; you are engineering a constraint. You need a definition that minimizes false positives (flagging harmless re-expressions) while minimizing false negatives (missing deceptive alignment or capability shifts).

  Below are the desiderata for a mechanism-identity account tailored to your use case. I have categorized them by **Non-Negotiable** (your detector fails without these), **Empirical Constraints** (facts you cannot ignore), and **Theoretical Preferences** (where the field is still arguing). I conclude with the **Jointly Unsatisfiable Subset**, which is the critical trade-off you need to navigate.

  ---

  ### I. Non-Negotiable Desiderata
  *If your account violates these, the detector will either spam false alarms or miss critical safety failures.*

  **1. Causal Efficacy over Correlational Activity**
  *   **The Case:** A neuron might fire every time the model outputs "Paris," but if you ablate it, the output remains "Paris." It is a passenger, not a driver.
  *   **Requirement:** Identity must be defined over *causal subgraphs* (circuits), not just activation patterns. Two networks have different mechanisms if the set of nodes/edges whose removal changes the output differs, even if activation heatmaps look identical.
  *   **Status:** **Non-Negotiable.**
  *   **Consensus:** **Settled.** Causal mediation analysis is the gold standard in MI. Correlation is widely accepted as insufficient for mechanism claims.

  **2. Invariance to Trivial Reparameterizations**
  *   **The Case:** You multiply the weights of an MLP neuron by 2 and divide the subsequent layer's input weights by 2. The function is identical. Or, you permute the order of hidden neurons. The "machinery" hasn't changed, only the coordinate system.
  *   **Requirement:** The metric must be invariant to symmetries inherent in the architecture (permutation, scaling, and potentially basis rotation within layers).
  *   **Status:** **Non-Negotiable.**
  *   **Consensus:** **Settled.** Any definition relying on raw weight Euclidean distance is useless for mechanism identity.

  **3. Sensitivity to "Algorithmic" Drift**
  *   **The Case:** The model previously solved a math problem by retrieving a memorized answer (lookup mechanism). After an update, it solves it by performing step-by-step addition (computation mechanism). The output accuracy is 100% in both cases.
  *   **Requirement:** The detector must flag this as a mechanism change. This is the core of your project: distinguishing *how* the answer is derived.
  *   **Status:** **Non-Negotiable.**
  *   **Consensus:** **Settled (in principle).** This is the definition of the problem you are solving. However, *operationalizing* "algorithm" in a continuous weight space is the contested part.

  **4. Robustness to Noise vs. Sensitivity to Signal**
  *   **The Case:** SGD adds tiny amounts of noise to weights every step. A rigid definition would flag every training step as a "mechanism change."
  *   **Requirement:** There must be a continuity threshold. Mechanism identity must be a "coarse-grained" property that survives minor weight perturbations that do not alter the causal graph's topology or feature semantics.
  *   **Status:** **Non-Negotiable.**
  *   **Consensus:** **Contested.** How to define the "metric" of distance (e.g., activation angle, circuit overlap score) is an active area of research.

  ---

  ### II. Empirical Constraints
  *Your definition cannot contradict these observed properties of neural networks. If it does, it will break on real models.*

  **5. Accommodation of Superposition**
  *   **The Fact:** Features are not local. A single direction in activation space can represent Feature A in one context and Feature B in another (polysemanticity), or multiple features can be packed into a lower-dimensional subspace (superposition).
  *   **Constraint:** You cannot assume a 1-to-1 mapping between neurons/weights and semantic features. Mechanism identity must be definable over *directions* or *subspaces*, not individual units.
  *   **Status:** **Empirical Fact.**
  *   **Consensus:** **Settled.** Superposition is empirically verified in transformer MLPs and attention heads.

  **6. Many-to-One Weight Mapping**
  *   **The Fact:** There are vastly more weight configurations than functions. Two models can have near-zero weight cosine similarity but produce identical logits and internal activations on the data distribution.
  *   **Constraint:** Mechanism identity cannot be a function of weight similarity alone. It must be a function of the *computation traced through the weights*.
  *   **Status:** **Empirical Fact.**
  *   **Consensus:** **Settled.** This is the "loss landscape connectivity" finding (e.g., mode connectivity).

  **7. Context-Dependent Circuitry**
  *   **The Fact:** Circuits are often input-dependent. A model might use one circuit for short sentences and another for long sentences (e.g., induction heads vs. direct attention).
  *   **Constraint:** Mechanism identity cannot be a single global label for the whole model. It must be localizable to specific input distributions or tokens.
  *   **Status:** **Empirical Fact.**
  *   **Consensus:** **Broad Consensus.** Circuits are generally understood to be sparse and context-activated.

  ---

  ### III. Theoretical Preferences & Open Debates
  *These are not "facts," but choices you must make. Different camps prioritize these differently.*

  **8. The Granularity Problem (Atoms of Mechanism)**
  *   **The Question:** What is the smallest unit of "same mechanism"? Is it a single attention head? A path through the graph? A semantic feature (e.g., "noun-verb agreement")?
  *   **The Trade-off:** If you define it too finely (weights), you get false positives (see #2). If you define it too coarsely (input-output behavior), you miss internal drift (see #3).
  *   **Status:** **Design Choice.**
  *   **Consensus:** **Contested.** Some argue for "natural abstractions" (features exist objectively); others argue features are entirely observer-relative. For your detector, you likely need to anchor to *task-specific circuits* (e.g., "the induction circuit") rather than generic features.

  **9. Feature Stability vs. Basis Stability**
  *   **The Question:** If the semantic feature "dog" rotates 5 degrees in activation space, is it the same mechanism?
  *   **The Trade-off:**
      *   *Strict Basis:* Flag any rotation. (Good for catching obfuscation, bad for stability).
      *   *Strict Semantics:* Allow rotation as long as the feature still means "dog." (Good for stability, bad for catching obfuscation).
  *   **Status:** **Safety Preference.**
  *   **Consensus:** **Contested.** For safety monitoring, you might want to be stricter here. A rotating basis could be a model learning to hide its reasoning from your probes.

  **10. Modularity and Reuse**
  *   **The Question:** If the model uses the same "addition circuit" for both "counting apples" and "calculating dates," is that one mechanism or two?
  *   **The Trade-off:** Tracking by *structure* says it's one mechanism. Tracking by *function* says it's two.
  *   **Status:** **Preference.**
  *   **Consensus:** **Contested.** Most MI work treats circuits as task-specific, but acknowledges shared components (e.g., early layers are generic).

  ---

  ### IV. The Jointly Unsatisfiable Subset (The "Impossible Triangle")

  This is the most critical part for your engineering. You cannot maximize all three of the following properties simultaneously. You must choose which one to relax.

  **The Triangle:**
  1.  **Basis Invariance:** The detector ignores arbitrary rotations/reparameterizations of the internal space.
  2.  **Obfuscation Sensitivity:** The detector flags when the model actively changes its internal representation to hide its reasoning (even if the semantic output is the same).
  3.  **Human-Interpretable Grounding:** The detector compares mechanisms using concepts humans understand (e.g., "this is the 'lying' circuit").

  **Why they are Unsatisfiable Together:**
  *   **To achieve (1) Basis Invariance,** you typically move to canonical forms or compare activation subspaces. This smoothes over differences in *how* features are encoded.
  *   **To achieve (2) Obfuscation Sensitivity,** you need to detect when the model shifts its encoding specifically to evade detection. This often looks like a basis rotation or a change in superposition density. If you enforce strict Basis Invariance, you might treat an adversarial rotation as "the same mechanism."
  *   **To achieve (3) Human-Interpretable Grounding,** you rely on probes or feature dictionaries trained at Time T. If the model changes its basis at Time T+1, your human-grounded probes might fail to fire, leading you to think the mechanism is gone (False Positive) or missing that the feature is now encoded differently (False Negative).

  **Recommendation for Anomaly Detection:**
  For a safety monitor, **sacrifice (1) to preserve (2).**
  You should likely *not* be fully basis-invariant. You want to track the stability of the *specific feature directions* you identified during the "trusted" phase. If the model rotates its representation of "truthfulness" by 45 degrees, even if it can still answer truthfully, that is a suspicious internal change worth flagging. Full basis invariance is a property for comparing *functions*, but you are comparing *implementations*.

  ---

  ### V. Settled vs. Contested: A Cheat Sheet for Your Design

  | Concept | Status | Implication for your Detector |
  | :--- | :--- | :--- |
  | **Superposition** | **Settled** | Do not track individual neurons. Track subspaces or sparse feature directions. |
  | **Causal Mediation** | **Settled** | You must validate that the components you track actually cause the output. |
  | **Weight Symmetries** | **Settled** | Do not compare raw weights. Compare activations or causal graphs. |
  | **Natural Abstractions** | **Contested** | Do not assume features will remain stable across training without enforcement. |
  | **Modularity** | **Contested** | Assume circuits are entangled. A change in one task's mechanism may bleed into another. |
  | **Linearity of Features** | **Contested** | Assuming features add linearly is a useful approximation but often false. Your metric should handle non-linearity. |

  ### Summary Advice

  Your friend's objection ("what do you mean by same mechanism") is valid because "mechanism" is a **level of abstraction**, not a raw property of the weights.

  For your specific use case (anomaly detection), I recommend defining "Same Mechanism" operationally as:
  > **"Preservation of the Causal Feature Subspace."**

  1.  **Identify** the specific feature directions (in activation space) that constitute the trusted mechanism at $T_0$.
  2.  **Verify** their causal role via mediation at $T_0$.
  3.  **Monitor** at $T_1$ for:
      *   **Drift:** Do these directions still point the same way? (Relax Basis Invariance slightly).
      *   **Decoupling:** Do activations in these directions still causally influence the output?
      *   **Bypass:** Are there *new* directions achieving the same output with high causal influence?

  This definition accepts that "mechanism" is relative to the feature basis you chose, but it makes that basis explicit. It avoids the trap of searching for a Platonic "mechanism" and instead monitors the stability of the *specific implementation you audited*.
