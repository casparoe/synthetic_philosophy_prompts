  **Preliminary Brainstorming**

  Three candidate principles govern these judgments. First, **Functional Exclusion** posits that symbolic inferences are invalid if a utilitarian explanation (e.g., diet, structural integrity) exists. Second, **Contextual Segregation** requires that evidence for beliefs be spatially isolated from mundane domestic activities; mixed contexts suggest practical rather than institutional use. Third, **Arbitrary Consistency** suggests that uniform patterns without mechanical causes imply rule-following behavior. Together, these capture the partner's skepticism toward symbolic claims when material utility or domestic mixing offers alternative explanations.

  **Candidate Interpretive Rules**

  The two strongest principles are **Functional Exclusion** and **Contextual Segregation**.

  **Functional Exclusion** states that an archaeologist must reject an inference to belief or institution if a plausible materialist explanation accounts for the pattern. This delivers acceptance in Cases 1 and 3 because ochre on faces and miniature weapons lack practical utility; no mechanical cause explains them. It drives rejection in Cases 2, 4, and 5 because seals functioned in households, jar carvings prevented cracks, and dental wear matched diet and tool use. In each rejection, a functional alternative superseded symbolic intent.

  **Contextual Segregation** states that institutional inferences require spatial separation from daily domestic life. This delivers acceptance in Cases 1 and 3 because burials and isolated river deposits are segregated from living spaces, marking them as specialized zones. It drives rejection in Cases 2 and 4 because seals appeared in domestic trash and jars were in domestic contexts. The mixing of potential symbolic markers with mundane refuse or household tools dilutes institutional significance, suggesting decentralized or practical usage rather than centralized belief.

  **Divergent Predictions for the Bead Case**

  Applying **Functional Exclusion** to the bead building predicts she should **accept** the institutional inference. The beads are pierced but show no wear from stringing, eliminating adornment or counting functions. The non-local clay implies significant effort without utilitarian return. Since no practical explanation accounts for manufacturing useless objects, this rule demands a ritual interpretation.

  Applying **Contextual Segregation** predicts she should **reject** the institutional inference. The building contains sleeping mats and food-preparation debris, identifying it as a domestic dwelling rather than a specialized ritual structure. The beads are not isolated in a cache or burial but associated with daily life. Because the context is not segregated from mundane activity, this rule dictates that the beads represent unfinished craft, hoarding, or domestic play rather than institutionalized ritual.

  **Best Verdict and Closest Precedent**

  She will most likely **reject** the inference of an institutionalized ritual. Her prior judgments reveal a hierarchy where contextual purity often overrides object form. The closest precedent is **Case 2** (ceramic seals). In that instance, even though the objects had administrative forms, their presence in domestic trash negated the inference of a centralized bureaucracy. Similarly, the beads' presence amidst sleeping mats and food debris contaminates the context, suggesting a domestic rather than institutional origin.

  If she rejects the inference, she adopts the principle of **Contextual Primacy**: the function of a space dictates the interpretation of objects within it, regardless of the objects' utility. A domestic space yields domestic explanations (e.g., unfinished production). If she were to accept the inference, she would be adopting **Functional Determinism**: the lack of utility in an object forces a symbolic interpretation, regardless of its location. Given her rejection of Case 4 (domestic jars) despite symbolic motifs, she prioritizes context and material alternatives over abstract pattern matching.

  **The Crucial Test Case**

  To distinguish these rules, consider a cache of non-utilitarian, miniature clay animals found buried beneath the floor of a active kitchen hearth.

  **Functional Exclusion** demands accepting a ritual inference. The objects have no cooking value and are deliberately hidden, implying symbolic intent despite the location.

  **Contextual Segregation** demands rejecting a ritual inference. A kitchen hearth is a purely utilitarian zone; objects found there are assumed to be related to food preparation, fuel, or accidental loss. The domestic nature of the space invalidates the ritual claim, regardless of the objects' form. This scenario forces a choice between the object's uselessness and the space's functionality.
