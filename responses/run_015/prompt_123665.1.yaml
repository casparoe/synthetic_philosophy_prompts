answer: |-
  ### Quick Brainstorming Notes

  *   **The Core Tension:** Temporal neutrality says $t_1$ vs $t_2$ doesn't matter morally. Pure Time Preference (PTP) violates this. But risk adjustment says $P(existence)$ matters.
  *   **The Problem:** In long-term climate modelling, $P(existence)$ often declines as $t$ increases. So discounting for risk looks exactly like discounting for time.
  *   **The Moral Hazard:** If we discount future welfare because there's a risk they won't exist, does that reduce our incentive to prevent the risk (e.g., extinction)?
  *   **Conceptual Split:** Is the discount rate reflecting *impatience* (ethical flaw) or *expected value* (mathematical necessity)? The exam question needs to force the student to decide if 'probability of non-existence' is just 'time preference' in disguise when applied to intergenerational justice.

  ***

  ### MA Seminar: Philosophy of Economics
  **Exam Paper: Discounting, Risk, and Intergenerational Equity**
  **Time Allowed:** 90 Minutes

  **Question 1**

  Consider a climate-policy model that decomposes the social discount rate ($\rho$) into three distinct components: (1) a pure rate of time preference ($\delta$), (2) an elasticity-of-utility factor tied to economic growth ($\eta g$), and (3) an existential-risk adjustment ($\pi$) that downweights far-future welfare not because it is temporally distant, but because the beneficiaries may never come to exist due to catastrophic events.

  Standard philosophical critique (following Ramsey) rejects component (1) as ethically indefensible discrimination against future generations. However, component (3) is often defended as a neutral application of expected utility theory.

  Critically assess whether component (3) successfully avoids the moral objection levied against pure time preference, or whether it reintroduces a hidden form of temporal bias through the back door. In your answer, confront the coherence of rejecting 'distance in time' as a legitimate reason to care less while simultaneously allowing 'probability of non-existence' to do the same normative work. Does this distinction hold when the probability of existence is itself a function of time?

  ***

  ### Model Answer

  The ethical objection to pure time preference ($\delta$) is straightforward: it treats identical welfare differently solely based on its temporal location. Ramsey famously labelled this "ethically indefensible" because it implies we care less about future people simply because they are later. The question is whether an existential-risk adjustment ($\pi$) escapes this charge by shifting the justification from *time* to *probability*.

  Proponents of $\pi$ argue this is merely expected utility calculation. If there is a 10% chance humanity goes extinct before 2100, weighting welfare by 0.9 isn't discrimination; it's rational accounting for uncertainty. On this view, time is irrelevant; only the probability of the subject existing matters. If an asteroid might wipe us out tomorrow, we discount tomorrow's welfare not because it is tomorrow, but because there might be no one to experience it. This seems coherent with temporal neutrality: we value every moment equally, *conditional* on someone being there to live it.

  However, the coherence cracks when we examine the correlation between time and risk. In climate modelling, existential risk is rarely exogenous or constant. Cumulative risk typically increases with time. The further out we project, the higher the probability of catastrophe. Consequently, a discount rate based on $\pi$ will mathematically mimic a pure time preference rate. If $\pi$ rises as $t$ rises, the model effectively penalises the future for being distant, even if the justification is 'risk'. This reintroduces temporal bias through the back door. The outcome is indistinguishable from $\delta$, violating the spirit of temporal neutrality even if the technical justification differs.

  Furthermore, there is a deeper normative problem regarding endogeneity. In climate policy, the 'risk' of non-existence is often determined by current actions. If we discount future welfare because there is a high risk of extinction, we lower the calculated benefit of mitigation policies today. This creates a perverse feedback loop: high risk justifies high discounting, which justifies low investment in safety, which ensures the risk remains high. By treating existence probability as a fixed parameter for discounting, we may undermine the moral imperative to secure that existence. Pure time preference is rejected because it ignores the interests of future people; risk discounting might be rejected because it treats their potential non-existence as a fixed constraint rather than a variable to be managed.

  Ultimately, the distinction between $\delta$ and $\pi$ holds only if the probability of existence is independent of temporal distance and current policy. If risk is a function of time, $\pi$ becomes a proxy for $\delta$. To remain coherent, a temporally neutral framework must separate the *valuation* of future welfare from the *probability* of its realization, ensuring that discounting for risk does not become an excuse for neglecting the very conditions that make future welfare possible. Therefore, while $\pi$ is theoretically distinct from $\delta$, in practice it often fails to avoid the moral objection unless rigorously decoupled from temporal distance.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Move 1: Articulating the Ethical Objection to Pure Time Preference (4 marks)**
  *   **A Answer:** Clearly explains that $\delta$ is rejected because it discriminates based on temporal location alone, violating impartiality/temporal neutrality.
  *   **B Answer:** States that $\delta$ is 'bad' or 'unfair' without explaining the philosophical principle (impartiality) behind the objection.
  *   **Typical Mistake:** Confusing pure time preference with economic growth discounting ($\eta g$).

  **Move 2: Defending the Risk Adjustment as Expected Utility (4 marks)**
  *   **A Answer:** Explains the defence of $\pi$: it weights by probability of existence, not time, which is standard rational choice under uncertainty.
  *   **B Answer:** Simply asserts that risk matters without linking it to expected utility theory or the 'conditional' nature of welfare.
  *   **Typical Mistake:** Treating risk adjustment as just another form of impatience.

  **Move 3: The Correlation Critique (Time vs. Probability) (4 marks)**
  *   **A Answer:** Identifies that if risk increases with time, $\pi$ functionally mimics $\delta$, making the distinction merely semantic in practice.
  *   **B Answer:** Acknowledges risk increases over time but fails to explain why this undermines the moral coherence of the distinction.
  *   **Typical Mistake:** Assuming risk is always exogenous (e.g., random asteroids) rather than cumulative.

  **Move 4: The Endogeneity/Policy Feedback Problem (4 marks)**
  *   **A Answer:** Highlights that discounting for risk can reduce incentives to mitigate that risk, creating a moral hazard regarding future existence.
  *   **B Answer:** Mentions policy implications but doesn't connect the discount rate to the incentive structure for mitigation.
  *   **Typical Mistake:** Treating the probability of extinction as fixed rather than influenced by current discounting decisions.

  **Move 5: Final Verdict on Coherence (4 marks)**
  *   **A Answer:** Provides a nuanced conclusion: the distinction is theoretically valid but practically fragile; coherence requires decoupling risk from temporal distance.
  *   **B Answer:** Gives a binary 'yes' or 'no' without qualifying the conditions under which the distinction holds.
  *   **Typical Mistake:** Concluding that risk discounting is perfectly fine because "mathematically it's different," ignoring the normative impact.
