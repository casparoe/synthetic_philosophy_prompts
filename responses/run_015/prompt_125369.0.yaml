  **Strict Necessity:** Qualitative uniqueness. To justify specific legal protections (denial laws) and compulsory teaching, the event must be ontologically distinct. If it were merely "another genocide," the specific legal regime collapses into general human rights law. The state requires a specific object to protect to justify exceptional speech restrictions.

  **Merely Compatible:** The focus on bureaucracy/industry ("upward"). This explains *why* it's unique without denying universal relevance. It warns against modern rationality itself, not just ethnic hatred. This fits your background: the process matters as much as the product. However, a theological explanation (evil incarnate) would also license the practices without focusing on bureaucracy. The sociological book you mentioned sits well with the practice but isn't strictly required by the law.

  **Underdetermined:** The universal lesson. Is it "protect Jews" or "protect humanity from rationality"? The practice allows both. The resistance to counting bodies confirms the wrongness is non-aggregative; it's about the *method* (industrialized extermination), not just the *scale*. This aligns with your suspicion that the means constitute the wrong.

  Your "sideways vs. upward" distinction is robust. Sideways implies moral equivalence (diluting responsibility); upward implies structural diagnosis (identifying the vector). Comparing to other atrocities suggests the *intent* was similar (forbidden); comparing to bureaucracy suggests the *capacity* is universal (required).

  **Concrete Changes:** If uniqueness is dropped:
  1.  **Law:** Denial laws become harder to justify (why this lie and not that one?). They would likely vanish.
  2.  **Teaching:** Becomes comparative genocide studies. The Holocaust becomes a case study, not the paradigm.
  3.  **Memorials:** Shift from "Never Again (specifically this)" to "Never Again (any of this)." The specific warning about *industrial rationality* dilutes into a general warning about *violence*.

  The package holds together only if the Holocaust is viewed as the *limit case* of modernity. Remove that, and the specific rituals lose their coercive force, becoming voluntary moral reminders rather than civic duties.
