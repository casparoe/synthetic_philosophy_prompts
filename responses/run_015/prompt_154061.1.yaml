answer: |-
  I hear you on the subsidiarity trap, and you are right that the standard two-part test has become a rubber stamp that inevitably centralizes because it treats current incapacity as natural rather than historical. What you need is a triage procedure that functions less like a legal test and more like an engineering spec, one that forces us to look at the mechanics of competence rather than the rhetoric of it. Here is a draft procedure we can run before lunch, built to handle the three failure modes you identified.

  The first gate is what I am calling the Atrophy Adjustment. When we ask whether a municipality can handle a task, we usually look at their current staff and budget, which is exactly how the ratchet works because it penalizes them for having been sidelined. Instead, the question must be whether the municipality would be capable if it had been permitted to maintain that competence over the last decade. You do not need a study for this; you look for the artifacts of atrophy. If the local clerk shares a role with two other communes, if the last time they managed a project of this size was fifteen years ago, or if their IT supplier is dropping support because the contract is too small to maintain, those are not proofs of inherent incapacity but proofs of systemic starvation. If the file shows that the inability is due to lapsed contracts or staff turnover caused by lack of use, we mark the competence as present for the purpose of the test. We only accept incapacity as a valid reason to move the task up if the task requires scale that is physically impossible for the unit, like a population base too small to generate statistical validity, or infrastructure that cannot be duplicated. If the barrier is merely that they have not done it recently, the file stays down.

  The second gate is the Fiscal Boundary Test, which handles the spillover and the artificial sufficiency problems. You need to separate the money from the capability. If a municipality can afford a project only because of federal matching funds or cantonal equalization payments, that is not fiscal capacity, that is subsidy, and it does not count as a reason to keep the task local if the subsidy were removed. We treat the budget as if the transfers did not exist. Conversely, if the municipality can pay but the costs of the action fall on neighbors, like pollution or traffic, the task moves up. The evidence here is straightforward. If the contaminant flows downstream, if the housing shortage pushes workers into another commune, or if the tax break attracts businesses that use roads in a neighboring valley, that is a spillover. If the money is coming from Bern via us, we note that the local sufficiency is an artifact. This gate forces us to see whether the local unit is actually standing on its own feet or just standing on our toes.

  The third gate is the Unbundling Rule, which addresses the fact that deciding, paying, delivering, and setting standards are different functions. The procedure must allow us to split these. The rule for who decides the split is that the level setting the standard decides the delivery method, but not the funding source. If the canton sets the safety standard, the canton decides how it is measured, but the municipality can still build the plant. This breaks the regress because it anchors the decision authority to the standard-setting power, which is usually determined by the spillover check. If there are no spillovers, the municipality sets the standard and decides the split. If there are spillovers, the canton sets the standard and decides the split. This prevents us from saying everything belongs to the canton just because we are the ones writing the memo.

  Now we need to know where the procedure stops and where it hands off to the Regierungsrat. If the first two gates show that the municipality is capable absent atrophy and there are no significant spillovers or artificial subsidies, the file goes back to the lower level. That is a factual determination. We do not need the Council to decide that a municipality can fix a pothole. However, if the file passes the factual tests but there is a conflict between efficiency and uniformity, that is a value judgment. If the municipalities can run their own civil registries but the cost varies by a factor of six and data sharing is clunky, the choice between saving money and preserving local autonomy is not ours to make. We mark the file as a value conflict. We write the one-pager to say that the lower level can do it, but doing it locally costs more and creates less uniformity. Then we stop. The Regierungsrat must decide whether uniformity is worth the price. We do not pretend to answer that.

  Let us run this on your water treatment file. Five municipalities, contaminant crosses boundaries, one refuses to join and is the source. The Atrophy Adjustment likely clears them to build a plant; digging holes and pouring concrete is not beyond them even if they have not done it recently. But the Fiscal Boundary Test fails immediately. The contamination crosses boundaries, and the source municipality is exporting costs to the others. This is a classic spillover. The Unbundling Rule suggests the canton must set the standard and enforce the cleanup because of the cross-boundary effect, but the execution could remain municipal if they form a joint entity. However, since one refuses to join, the canton must enforce the standard on the source municipality. The recommendation is cantonal standard and enforcement, municipal or joint execution for the treatment. This is not a value judgment; the spillover makes it a cantonal responsibility to regulate, even if the pipes are local.

  The civil registry platform is harder. Forty municipalities, different contracts, support ending, huge cost variation. The Atrophy Adjustment says they are currently capable but struggling with vendor support. The Fiscal Boundary Test shows no spillovers; a birth in one commune does not cost another commune money, though it might affect federal statistics. The cost variation is internal to each municipality. Here the procedure hits the value wall. Factually, the municipalities can run registries. But the efficiency gain from a cantonal platform is massive. This is not a factual incapacity; it is a choice between local autonomy and cantonal efficiency. We write the page to say that local execution is factually possible but economically inefficient compared to a shared platform. We do not recommend the platform; we recommend that the Regierungsrat decide if the efficiency gain justifies the centralization. We hand them the trade-off, not the decision.

  The short-term rental file is the one that will sting. You drafted a cantonal licensing regime with caps per municipality. The Atrophy Adjustment suggests municipalities manage housing stock daily; they are not inherently incapable of registering rentals. The Fiscal Boundary Test is mixed. Tourism spills over, but housing availability is largely local. The spillover is not strong enough to mandate cantonal caps unless there is evidence that one municipality's lax rules are destroying another's housing market, which is hard to prove factually. The Unbundling Rule suggests a split. A cantonal register makes sense for data consistency and enforcement tracking, but the caps are a land-use decision. If the procedure is applied strictly, the caps belong to the municipalities because the housing market impact is primarily local. The cantonal role is the register and the enforcement mechanism if the municipality asks for it, but not the cap itself. If you send this to the Regierungsrat saying the caps are cantonal, you are making a value claim about uniformity over local zoning authority. The procedure says the register is yours, the caps are theirs. You will have to defend why the spillover justifies overriding local zoning, and if you cannot point to cross-boundary housing displacement, the file should technically go back to the municipalities with a cantonal data standard attached.

  Finally, you asked what this procedure cannot do and about the presumptive bonus. This procedure will systematically fail on files where the lower level acts strategically to fail. If a municipality deliberately lets a contract lapse to force us to take over, the Atrophy Adjustment might still catch it, but only if we know the history. If they hide the spillover, we miss it. It also cannot solve political centralization disguised as efficiency; if the Regierungsrat wants uniformity, they will find a spillover. Regarding the bonus, yes, you need a presumptive bonus for the lower level to counter the ratchet. Because competence atrophies when unused, the default assumption must be that the lower level is capable unless there is clear evidence of physical impossibility, not just administrative inconvenience. The standard test assumes status quo capability is natural; this procedure assumes status quo incapacity is often artificial. You should add a line to the one-pager that states whether the incapacity is structural or historical. If it is historical, the presumption is that the task stays down, and the burden of proof shifts to those wanting to centralize to show why the competence should not be rebuilt. This does not guarantee decentralization, but it stops the silent ratchet where we take a task because they are weak today and make them weaker tomorrow.
