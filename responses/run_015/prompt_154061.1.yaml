  2.  **Deconstruct the Three Problems & Design the Procedure:**
      *   *Problem 1 (Atrophy):* Need a "Counterfactual Competence Check." Don't ask "Can they do it now?" Ask "Could they do it if they hadn't been discouraged from doing it?" or "Is the inability structural or historical?"
      *   *Problem 2 (Spillovers/Money):* Need a "Boundary Cost Check." Distinguish between real fiscal capacity and subsidized capacity. Also check for externalities (pollution, etc.).
      *   *Problem 3 (Unbundling):* Need a "Function Split." Allow different levels for regulation, funding, execution. Need a rule for who decides the split (usually the level setting the standard).
