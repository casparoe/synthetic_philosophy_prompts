      *   **Audience:** Mixed group (50% sociology grad students, 50% smart friends/no background). 90-minute session.
      *   **Constraint:** Avoid shallow individualism/collectivism stereotypes.
      *   **Task:** Plan the explanatory arc.
      *   **Specific Requirements:**
          *   Lead with the dependency order (what idea must land first) and why.
          *   Lay out the carrying example (concrete scenario).
          *   Map misconceptions (order + where to head off).
          *   Define an understanding check (end of session).
          *   State omissions (what to leave out).
          *   **Style:** American English, Bottom Line Up Front (BLUF).
          *   **Length:** Under 350 words.

  2.  **Determine the Dependency Order:**
      *   What must land first? The prompt suggests "absolute vs. positional goods" or "democratic equality vs. meritocratic hierarchy."
      *   To avoid the individualism/collectivism trap, the core concept is *status anxiety in egalitarian systems*. If everyone is equal, how do we handle someone standing out?
      *   *Decision:* The foundational concept must be **Tocqueville's paradox of equality**: as conditions equalize, minor distinctions become more painful/visible. Without this, the comparison looks like cultural flavor rather than structural logic.

  3.  **Design the Carrying Example:**
      *   Needs to be concrete, relatable, and highlight visibility.
      *   *Idea:* A workplace promotion or a neighborhood renovation.
      *   *Selection:* A **neighbor winning a local award** or **building a visibly larger house**. Let's go with a **community fundraiser where one donor gives significantly more**. It highlights visibility, status, and the reaction of peers.
      *   *Needs:* Must include public recognition, peer reaction, and institutional framing (how the organization handles it).
      *   *Lacks:* Specific national flags initially (reveal later).

  4.  **Map Misconceptions:**
      1.  "Jantelagen is just politeness." -> Head off during scenario setup (frame as social sanction).
      2.  "Tall poppy is pure envy." -> Head off during analysis (frame as leveling mechanism for cohesion).
      3.  "American Dream is only about money." -> Head off during comparison (frame as moral validation of success).

  5.  **Define Understanding Check:**
      *   Need to verify they see these as logics, not personalities.
      *   *Check:* Ask them to apply the *opposite* logic to the scenario (e.g., "How would a Jantelagen society celebrate a winner without breaking the norm?").

  6.  **Identify Omissions:**
      *   Empirical mobility data (distracts from cultural logic).
      *   Literary origins (Law of Jante book details) - keep it conceptual.

  7.  **Drafting & Editing (monitoring word count):**
