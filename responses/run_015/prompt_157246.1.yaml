      Carry the session with a **paired fundraiser scenario**. In both, a peer donates 10x the average. In Version A, the organizer publicly plaques the donor; peers cheer. In Version B, the organizer anonymizes the gift; peers express discomfort at the publicity. Keep national labels hidden until midway. Include the peer reaction, not just the winner's feeling. Exclude specific dollar amounts to focus on relative status.

      Address misconceptions in this order:
      1. During scenario setup: Head off "Jantelagen is politeness" by emphasizing the *sanction* (discomfort/shaming), not manners.
      2. During analysis: Counter "tall poppy is envy" by framing it as cohesion maintenance.
      3. During synthesis: Correct "American Dream is money" by highlighting moral worthiness.

      End with a **logic-swap check**: Ask participants to design a way to celebrate success in Version B that doesn't trigger leveling mechanisms. If they suggest collective attribution or anonymized impact, they grasp the institutional logic.

      Openly omit empirical mobility data (distacts from cultural logic) and literary origins (Law of Jante details). We are analyzing functional responses to visibility, not historical etymology or economic stats.

