prompt: |-
  I'm putting together a single 90-minute session for a mixed reading group — half sociology grad students, half smart friends from other fields with no background — on why some democratic cultures celebrate winners while others seem to cut them down. I want to use the American Dream and Jantelagen / tall poppy syndrome as teh carrying comparison, but I want to avoid the shallow "Americans are individualists, Nordics are collectivists" version. Instead I want to frame both as institutional answers to the same problem: how a society that claims equality handles visible success and positional goods. But I'm unsure whether to start with that theoretical frame or with a concrete scenario.

  Plan the explanatory arc: what idea absolutely has to land first before the comparison even makes sense (is it the distinction between absolute and positional goods? democratic equality vs meritocratic hierarchy? something else?) and why that dependency holds; the one concrete scenario or paired scenario that should carry the whole session and what it needs to include and lack; the misconceptions people will bring in predictable order — I'm guessing first "Jantelagen is just Scandinavian politeness," then "tall poppy is pure envy," then "the American Dream is only about money" — and exactly where in the sequence to head each one off; a check I can run at the end to see whether they've grasped that these aren't national personalities but competing logics for managing visibility; and what I should openly say I'm leaving out (maybe empirical mobility data, maybe the actual literary origins of these terms?). Keep it under 350 words, in American English, bottom line up front: lead with the dependency order and why, then lay out the carrying example, misconception map, understanding check, and omissions.
