prompt: |-
  I edit — really I'm the only paid person on — a volunteer-run digital edition of the papers of a nineteenth-century naturalist and amateur geologist, mostly letters, field notebooks, and a pile of things he wrote twice because he moved between Welsh and English depending on who he was writing to. We publish plain text with footnotes, and people quote us constantly without reading the footnotes: our pages get copy-pasted into genealogy forums, local-history blogs, and lately into argumentative threads about who discovered what, always stripped of everything below the line. The volunteers are retired teachers and local-history buffs with no theory background at all, they get about fifteen minutes per letter, everything goes past a two-person editorial board, and there's also a family liaison — his great-granddaughter, who is also our single largest donor — who gets to see any note that touches on the family.

  The thing I keep loosing arguments about is what a passage means. Our house rule has always been "print what he wrote, don't guess at what he meant," and it's coming apart on four recurring situations. One: he often wrote the same report twice, and the English version quietly drops a claim the Welsh version makes, so we have to decide whether the dropped claim is part of what he meant or just something he left out for that audience. Two: in his last decade his eyes were bad and he dictated to his daughter, who "tidied" his prose — in one letter she turned "not uncommon" into "common," which the local paper later quoted as a much stronger finding than he'd made. Three: there are marginal notes in a different ink, added years later, that flatly contradict what the letter says, and I don't know whether a later annotation is part of his meaning or a second, later text. Four: some letters to his sister are in a private cipher the two of them invented, so the intended reader was exactly one person who had the key.

  So I want a decision procedure, not an essay. Something with ordered questions, a clear statement of what counts as a sufficient answer to each question, a point where the procedure stops and says no (don't emend, don't annotate, don't adjudicate — print and flag), and a point where it hands the thing to a person because the question is one of values rather than evidence. The bit I most need help with is that I think we've been conflating several different things and calling all of them "meaning": what the words mean, what he was trying to say, what he was trying to get his reader to take away, what a competent reader at the time would have taken it to mean, and what he would have said if you'd been able to stop him in the hall and ask. I suspect these come apart and that different ones should govern different jobs — emending a word, writing a note, translating, deciding the title and tags on the page, deciding whether to print a passage at all — but I can't get it straight in my head, and I need it in language a retired geography teacher can run in fifteen minutes. Please also be straight about which steps are judgment calls dressed up as procedure.

  Then run it on three of the cases above (your pick of which three, or all four if you want): the Welsh/English pair, the daughter's "not uncommon," and the later marginalia. Include at least one case where the procedure gives an answer I won't like and will have to defend to the donor. And tell me plainly what the procedure can't do — where it will produce a false confidence, and what I should keep doing by argument and taste instead.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Editor of a volunteer-run digital edition of 19th-century naturalist/geologist papers.
      *   **Context:** Plain text + footnotes. Volunteers (retired teachers, buffs) have ~15 mins/letter. 2-person editorial board. Family liaison (great-granddaughter/donor) reviews family notes.
      *   **Problem:** House rule "print what he wrote, don't guess at what he meant" is failing in four specific scenarios (Welsh/English discrepancies, daughter's dictation edits, later marginalia, private cipher). Users quote without footnotes, leading to misinformation.
      *   **Goal:** A *decision procedure* (ordered questions, clear stop points, hand-off points), not an essay. Needs to distinguish types of "meaning" (words, intent, reader reception, etc.). Needs to be usable by volunteers in 15 mins. Needs to identify where judgment calls are disguised as procedure.
      *   **Task:** Create the procedure, run it on 3 of the 4 cases, include an unpopular outcome (donor conflict), and state limitations.

  2.  **Deconstruct "Meaning":**
      The user correctly identifies that "meaning" is conflated. I need to operationalize these distinctions for the procedure:
      *   *Lexical/Syntactic Meaning:* What do the words say? (Transcription)
      *   *Authorial Intent (Immediate):* What did he want *this* reader to understand *now*? (Contextual annotation)
      *   *Authorial Intent (Retrospective):* What did he believe later? (Marginalia)
      *   *Mediated Intent:* What did the scribe (daughter) think he meant? (Dictation)
      *   *Scholarly Reconstruction:* What was the factual reality? (Footnotes/Correction)

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Constraint:* Must be simple enough for a volunteer in 15 minutes.
      *   *Structure:* Flowchart style (If X, then Y).
      *   *Stages:*
          1.  **Transcription Status:** Is the text physically legible and verifiable?
          2.  **Variation Detection:** Is there a conflict (two versions, scribe change, marginalia)?
          3.  **Intent Classification:** Whose voice is this? (Author, Scribe, Later Self).
          4.  **Action Determination:** Emend, Annotate, or Flag.
          5.  **Escalation:** When to stop and ask the Editor/Family.
      *   *Crucial Element:* Distinguishing "Evidence" from "Values." Evidence = ink, dates, handwriting. Values = importance, sensitivity, reputation.

  4.  **Refining the Procedure for the User's Constraints:**
      *   Volunteers aren't theorists. Avoid jargon like "hermeneutics." Use "What's on the page?" vs. "What's the story?"
      *   Need a hard "STOP" for value judgments (Family Liaison/Editor).
      *   Need to address the "quoting without footnotes" issue. The procedure must prioritize *visibility* of uncertainty.

  5.  **Developing the Test Cases:**
      *   *Case 1: Welsh/English Discrepancy.* (Dropped claim).
      *   *Case 2: Daughter's Dictation.* ("Not uncommon" -> "Common").
      *   *Case 3: Later Marginalia.* (Contradiction in different ink).
      *   *(Case 4: Cipher - skipped for brevity as requested "3 of the cases", but I'll focus on the three most textually complex ones).*
      *   *Requirement:* One outcome must be unpopular/defensible against the donor. The "Daughter's Dictation" case is the best candidate for this, as it touches on family reputation vs. textual accuracy.

  6.  **Drafting the Content - Step-by-Step:**

      *   *Introduction:* Acknowledge the tension between "diplomatic transcription" and "reading edition."
      *   *The Procedure:* Break it down into "The 15-Minute Triage."
      *   *Definitions:* Clarify the "Meaning" types simply.
      *   *The Steps:*
          1.  Source Identification (Who wrote this specific ink?)
          2.  Timing (When was this specific ink added?)
          3.  Audience (Who was supposed to read this?)
          4.  Conflict (Does this contradict the main text?)
          5.  Action (Print, Note, or Flag).
      *   *The "Value" Handoff:* Explicitly state where evidence ends and opinion begins.

      *   *Running the Cases:*
          1.  *Welsh/English:* Procedure should likely say "Print both, link them, note the omission." (Evidence-based).
          2.  *Daughter:* Procedure should say "Print daughter's text, footnote the dictation log if available, or flag the shift." *Correction:* If the daughter changed the meaning, that's a mediation issue. The procedure should force a footnote explaining the scribe's intervention. This might annoy the donor (great-granddaughter) because it highlights the daughter altering the "Great Man's" words.
          3.  *Marginalia:* Procedure should say "Print as marginalia, do not merge." (Distinct temporal layer).

      *   *Limitations:* Where does the procedure fail? (Tone, subtle bias, the "truth" of the science vs. the text).

  7.  **Review against Constraints:**
      *   *Decision Procedure?* Yes, numbered steps.
      *   *Ordered Questions?* Yes.
      *   *Clear Stop Points?* Yes (The "Escalation" step).
      *   *15-minute friendly?* Needs to be concise.
      *   *Distinguish Meaning Types?* Yes, embedded in the questions.
      *   *Unpopular Outcome?* Yes, the Daughter case.
      *   *Limitations?* Yes, final section.

  8.  **Polishing the Tone:**
      *   Needs to be professional, direct, slightly weary (matching the user's vibe), but authoritative.
      *   Avoid academic pretension.
      *   Ensure the distinction between "Textual Meaning" (what is there) and "Historical Meaning" (what happened) is clear.

  9.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe suggest emending the daughter's text back to "not uncommon."
      *   *Correction:* No, the house rule is "print what he wrote." But *she* wrote the final version. This is the crux. The procedure needs to decide if the daughter's text counts as "what he wrote." If he dictated and she edited without approval, it's her text. If he approved it, it's his. Since he had bad eyes, we can't know approval. *Decision:* The procedure must flag the uncertainty rather than fix it. This protects the editor but annoys the donor who wants a clean narrative.
      *   *Refining the "Meaning" definitions:* Make sure they map to specific actions (Emend vs. Annotate).
      *   *The "Donor" aspect:* Be explicit about where the Family Liaison *must* step in.

  10. **Final Polish:** Check the "STOP" conditions. Ensure the volunteer knows when to put the pen down and email the Editor. (This is crucial for the 15-minute limit).

  *(Self-Correction on the "Meaning" definitions)*: The user listed 5 types of meaning. I need to map these to the procedure steps so the volunteer isn't confused.
  1. Words mean -> Transcription.
  2. Trying to say -> Context/Intent.
  3. Reader take away -> Audience analysis.
  4. Competent reader at time -> Historical context.
  5. What he'd say in the hall -> Counterfactual (Avoid this one, it's a trap).

  Okay, let's build the response.
answer: |-
  Here is a decision procedure designed for your constraints. It separates *textual evidence* (what can be verified in 15 minutes) from *interpretive values* (what requires argument or family approval).

  ### Part 1: The Definitions (For the Volunteer Sheet)
  Do not use the word "meaning" in the workflow. It is too vague. Use these four categories instead. Each maps to a specific editorial action.

  1.  **Textual State:** What marks are on the page? (Action: Transcribe exactly).
  2.  **Production Context:** Who made the marks and when? (Action: Footnote the physical history).
  3.  **Communicative Intent:** Who was supposed to read this and what were they supposed to know? (Action: Headnote/Tagging).
  4.  **Factual Claim:** What assertion about the world is being made? (Action: Scholarly Footnote).

  *Note:* The procedure never attempts to resolve **Factual Claim** truth (e.g., did he actually find the fossil?). It only records what the **Textual State** asserts.

  ### Part 2: The 15-Minute Triage Procedure
  **Stop Rule:** If you spend more than 15 minutes on one letter, or if you answer "I don't know" to any question in Section B, stop. Mark the file `[REVIEW REQUIRED]` and send it to the Editorial Board.

  #### Section A: Physical Verification (Evidence)
  *Goal: Establish the Textual State.*

  1.  **Is the ink and handwriting consistent throughout the document?**
      *   **Yes:** Proceed to Q2.
      *   **No:** Identify the breaks. Is it a different hand (scribe) or a different time (marginalia)?
          *   *Action:* Transcribe exactly as is. Do not merge. Add `[Hand changes here]` tag. Proceed to Section B.
  2.  **Is there a companion document (draft, translation, duplicate copy) for this specific text?**
      *   **No:** Proceed to Section C.
      *   **Yes:** Proceed to Section B.

  #### Section B: Variation Analysis (Evidence)
  *Goal: Establish Production Context.*

  3.  **If there is a companion document, does the text differ substantively (names, dates, claims)?**
      *   **No (minor spelling/phrasing):** Treat as single text. Proceed to Section C.
      *   **Yes (claims added/dropped):** Do not choose one. Link both digital files.
          *   *Action:* In the footnote, state: "A parallel version exists [Link]. That version [includes/omits] the claim that X." **Stop.** Do not explain *why* he changed it.
  4.  **If the hand is different (scribe/daughter), is there a log or cover note indicating author approval?**
      *   **Yes:** Treat as Author's Text. Proceed to Section C.
      *   **No:** Treat as Mediated Text.
          *   *Action:* In the footnote, state: "Text dictated by Author to [Name]. [Name] is known to have edited phrasing in other instances." **Stop.** Do not correct the phrasing to match what you think he "meant."
  5.  **If there are marginalia, are they dated later than the main text?**
      *   **Yes:** Treat as a separate temporal layer.
          *   *Action:* Print marginalia in distinct formatting (e.g., indentation or italics). Footnote: "Added by Author in [Year], contradicts/amends paragraph 2." **Stop.** Do not merge the correction into the main text.

  #### Section C: Audience & Sensitivity (Values)
  *Goal: Establish Communicative Intent. **This is where you hand off to humans.** *

  6.  **Does the text contain information about living descendants or sensitive family medical/financial history?**
      *   **Yes:** **STOP.** Flag for Family Liaison. Do not annotate.
      *   **No:** Proceed to Q7.
  7.  **Does the text rely on a cipher or private code?**
      *   **Yes:** **STOP.** Flag for Editorial Board. We need a policy on decryption vs. privacy.
      *   **No:** Publish with standard footnotes.

  ---

  ### Part 3: Running the Procedure on Your Cases

  Here is how the procedure handles three of your four scenarios. I have selected the three that pose the greatest risk to your "print what he wrote" rule.

  #### Case 1: The Welsh/English Pair (Dropped Claim)
  *   **Section A, Q2:** Yes, there is a companion document (the other language version).
  *   **Section B, Q3:** Yes, the English version drops the claim found in Welsh.
  *   **Procedure Output:** Link both files. Footnote the English version: *"A Welsh version of this report exists [Link]. The Welsh text includes the claim that X; this English text omits it."*
  *   **Editorial Decision:** You do not decide if the claim is true. You do not decide if he "meant" it. You record that the *Textual State* varies by audience.
  *   **Why this works:** It prevents genealogists from copy-pasting the English claim as absolute fact without seeing the Welsh caveat. It respects the "print what he wrote" rule for *both* versions.

  #### Case 2: The Daughter's Dictation ("Not Uncommon" vs. "Common")
  *   **Section A, Q1:** No, the hand is different (daughter).
  *   **Section B, Q4:** No log of approval exists for specific phrasing changes.
  *   **Procedure Output:** Treat as Mediated Text. Footnote: *"Text dictated by Author to [Daughter]. Scribe is known to have strengthened claims in other correspondence (e.g., changing 'not uncommon' to 'common' in Letter #123)."*
  *   **The Unpopular Outcome:** You **do not** emend "common" back to "not uncommon" in the main text.
  *   **Why you will have to defend this to the Donor:** The great-granddaughter wants the text to reflect her great-grandfather's scientific integrity. She may argue, "He wouldn't have wanted that error, fix it."
  *   **Your Defense:** The procedure forbids us from guessing his mind. The physical document says "common." If we change it, we are lying about the document to tell the truth about the man. The footnote protects his reputation; the text protects the archive's integrity. If we emend, we become authors, not editors.
  *   **Risk:** Local papers will still quote "common." But your footnote creates a citable record of the distortion for anyone who *does* check.

  #### Case 3: The Later Marginalia (Contradiction)
  *   **Section A, Q1:** No, ink is different.
  *   **Section B, Q5:** Yes, added years later.
  *   **Procedure Output:** Print marginalia in italics/indent. Footnote: *"Added by Author c. 1890. Directly contradicts the assertion in paragraph 2."*
  *   **Editorial Decision:** Do not merge the correction into the original letter. Do not add a [sic].
  *   **Why this works:** It preserves the chronology of his thought. A letter from 1880 is a different *Textual State* than a note from 1890. Merging them creates a "super-letter" he never wrote.
  *   **Limitation:** Readers scanning the main text will still see the error. But the visual distinction signals "this is an addendum," not "this is the text."

  ---

  ### Part 4: What This Procedure Cannot Do (The False Confidence)

  You asked for plain talk on where this breaks. Here are the three failure points where procedure disguises judgment calls.

  **1. The "Substantive" Threshold (Section B, Q3)**
  The procedure asks volunteers to decide if a difference is "minor" or "substantive." A retired geography teacher might think a changed date is minor (typo); a historian knows it changes the priority of discovery.
  *   **The Risk:** Volunteers will normalize significant changes as "phrasing."
  *   **The Fix:** You (the Editor) must spot-check 10% of "minor" variance flags. Do not let this be purely volunteer-driven.

  **2. The "Known to Have Edited" Claim (Case 2 Footnote)**
  In the Daughter case, the footnote claims she is "known to have edited." Who knows? On what evidence?
  *   **The Risk:** This looks like evidence, but it is an argument. If the Family Liaison disputes the frequency of her editing, this footnote becomes a fight.
  *   **The Fix:** Keep a separate, internal "Scribe Reliability" memo agreed upon by the Board and Family. Reference that memo in the footnote rather than making the claim fresh each time. *"Scribe reliability assessed per Editorial Memo #4."* This moves the fight from the public footnotes to private governance.

  **3. The "Stop" Rule (Section C)**
  The procedure hands off "Values" questions to you or the Family Liaison. But volunteers often don't recognize a Values question. They think a family secret is just a "Fact."
  *   **The Risk:** A volunteer publishes a sensitive detail because it passed Section A and B, not realizing it triggers Section C, Q6.
  *   **The Fix:** You need a "Red Flag" keyword list (names of living people, specific medical terms, "confidential") that triggers an automatic hold before the volunteer even starts Section A.

  ### Summary of the "Meaning" Split
  To answer your specific worry about conflating meanings:

  *   **Textual State** governs **Emending**. (Never emend based on intent).
  *   **Production Context** governs **Footnoting**. (Explain who wrote the ink).
  *   **Communicative Intent** governs **Tagging/Titling**. (e.g., Tag as "Private Family Correspondence" vs. "Public Report").
  *   **Factual Claim** governs **Nothing**. (Your edition records claims, it does not adjudicate them).

  **Final Instruction for Volunteers:**
  "If the document says X, but you are sure he meant Y: Print X. Footnote the evidence for Y. If the evidence for Y is in your head and not on paper, delete it."
