      *   *Pearl/Woodward (Interventionism):* Causation is about potential manipulation. $X$ causes $Y$ if an intervention $do(X=x)$ changes $P(Y)$. Requires a Structural Causal Model (SCM). The intervention *severs* incoming arrows to $X$. It's not about "what if history was different" but "what if we set this variable externally." Focus on *invariance* and *mechanism*.
      *   *The Film's Mechanism:* Clarence shows George a world where he was *never born*. This looks like $\neg Born(George)$.
      *   *The Tension:* If George was never born, does that mean we just remove him (intervention) or do we rewind history and let it play out differently (counterfactual simulation)?
      *   *Lewisian Reading:* We look at the nearest possible world where George doesn't exist. But how do we get there? Do we keep the past fixed up until conception? If so, does Mary marry someone else? Does Potter still win?
      *   *Interventionist Reading:* We apply $do(Born(George) = 0)$. This surgically removes George's node from the graph. We then propagate the effects downstream. But what about upstream causes? An intervention fixes the variable regardless of parents.
      *   *The "Confusion":* The film presents the alternate reality as *determinate* (Pottersville exists, Mary is a librarian). But in a true counterfactual analysis, there's indeterminacy. In an interventionist model, we need the structural equations for the *other* agents (Mary, Potter) to know how they react to George's absence. The film assumes their reactions are fixed by George's absence, which implies a specific structural model that might be too rigid.

