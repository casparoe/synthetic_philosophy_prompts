prompt: |-
  I direct the variety development programme at a mid-sized seed company, and I need an allocation procedure my team can run every cycle, not a one-off recommendation. Roughly sixty candidate lines are screened each year; we advance six to ten of them to Stage 2 field trials; there is one main decision cycle in the spring and a smaller top-up round in the autumn. The stakes are not abstract: our base is currently £18m, and if it falls below £12m corporate places the programme in a restructuring review — of the three programmes in this company's history that hit that trigger, two were closed within eighteen months, and a closure costs about fifty-five jobs. My team is two breeders and one analyst with no formal training in decision theory, so anything I hand them has to run in a day on a spreadsheet. Everything above a certain size goes to the firm's investment committee, which includes a CFO who thinks in expected value and internal rate of return and who will ask, immediately, why we are not simply funding the highest-expected-value projects in descending order until the money runs out.

  The mechanics, so you don't have to guess at them:

  - There are no external top-ups. The programme lives on what its releases earn. Uncommitted capital carries over between years and earns roughly zero in real terms, so idle money is not compounding for us even though it is still the firm's money.
  - A Stage 2 advancement costs between £0.6m and £2.4m, spread over three years. A line that is dropped is a total loss of that spend. A line that becomes a commercial variety returns royalties over the following five years; historically 60% of successes have come back at three to six times the spend, and a handful at ten to forty times, which is what makes the arithmetic mean of the whole distribution look so much better than the typical outcome.
  - Funding is close to lumpy. At about 70% of the full Stage 2 budget the historical success rate for a class is roughly 80% of its full-funding rate and the payoff scales roughly proportionally; below 70% it collapses, because under-resourced trials produce data nobody can interpret. So the practical choice per project is usually zero, 70%, or 100%.
  - The projects are not independent. A bad season at the trial network — drought, or a disease that moves through the sites — has historically hit about one year in eight, and in those years the cohort success rate has run near 8% against a baseline near 35%. Failure is common across a cohort in exactly the years that hurt most.
  - They are not independent in a second way either. Our stations and staff can carry about eight concurrent Stage 2 projects at full quality; past that, our own rough estimate is that per-project success probability falls by something like 10% relative for each project above eight, and falls hardest for the weakest projects in the cohort.
  - Our probability estimates are thin and probably optimistic. They come from three to eight analogue lines per project, and the deeper reference class consists of advancement decisions *we ourselves chose to make*, which means it is selected by our own past enthusiasm. We have two years of scored forecasts against outcomes and nothing before that, so I do not know whether our breeders are calibrated, and I suspect they are not.
  - No borrowing and no external co-investment. Corporate also assigns us one mandated project per cycle (resistance-management and regulatory work) with a negative expected return, which we cannot decline.

  Here is what I think I know, and I would rather be corrected than flattered: sizing each commitment to maximise the expected logarithm of the bankroll gives the largest long-run growth rate, and this differs from maximising expected value because the expected value of a high-variance strategy is carried by rare enormous outcomes that a single entity like ours mostly does not live to collect. I take it this is why the log rule looks timid to a CFO and why the timidity is not a mistake. I am much less sure how much of that carries over to us, given that our horizon is not infinite, our bets are lumpy and correlated, our probabilities are guesses, and our bankroll is a budget line inside a firm that can absorb variance we cannot.

  What I want from you:

  1. A procedure, in the order my team would actually run it: the questions to ask, what counts as an adequate answer to each, where the procedure returns a hard no, and where it stops and hands the decision to a person or to the committee because the question is one of governance or values rather than of fact. It must include how to set the *number* of bets for a cycle, how to size each one given that they interact and share a common shock, how to haircut for thin and self-selected probability estimates with an actual rule rather than an instruction to be cautious, how to treat the mandated project, and a barrier test that asks what happens to the base if this cohort fails together.
  2. An honest paragraph I can put in front of the CFO answering "why not just take the highest-expected-value projects first", together with your own verdict on how much of that paragraph is a real argument and how much is a change of framing.
  3. The procedure run on three cases, with the arithmetic shown in whatever units you think are the right ones.

  Case A — the flagship long-shot. A novel trait cross championed by the breeder who founded the programme: £2.2m at full funding, a claimed forty-times upside, estimated success probability of 8% from its champion and between 1.5% and 3% from our analyst using the wider reference class. It is indivisible at anything like the size the sizing rule would want. I should tell you that I have been tempted to carve out a small "exploration" sub-budget — funded from the base, but not counted as part of the compounding bankroll — precisely so that bets like this do not have to pass the sizing test. Tell me whether that move is coherent or whether it is just a way of hiding a bad bet from the criterion, and if it is coherent, what discipline it needs: how large it may be, how it is replenished, who is allowed to spend it, and what happens when the exploration book is empty and the flagship project is still there.

  Case B — the dull one. An elite backcross for disease resistance: £1.9m at full funding, scored base rate 0.6 across fourteen analogues, realised multiples on success between two and three-and-a-half times with a median near 2.4x. The analyst points out that at 70% funding the historical success rate for this class is about 0.5 with the payoff scaling roughly proportionally, that 70% funding has a slightly higher expected multiple per pound spent, and that it has a materially lower chance of any success at all. What does the procedure say, and does the answer change if two projects of this class are available this cycle and the base cannot comfortably carry both at full funding?

  Case C — the near-duplicates. Two breeders each propose a project introgressing the same resistance gene into different backgrounds. The analyst scores them independently at 0.4 each and wants to fund both. They would very likely fail together in a network year, and if both succeeded they would cannibalise each other commercially, so the second success is worth far less than the first. I want to see how the procedure handles payoffs that are not additive across bets.

  Finally, the part I care most about. Tell me what the procedure cannot do, and be explicit about what would change your mind about the procedure itself. As I see it, the two load-bearing assumptions are that our capital really does behave like a multiplicative bankroll behind a near-absorbing barrier, and that our probability estimates mean anything once they have been shrunk. Tell me which one is doing more of the work in the recommendation you are making, what observation over the next two years would tell me it is false, and what I could cheaply measure to find out. Mark the places where you are extrapolating past what the growth-rate argument strictly establishes — in particular what survives, and what does not, once the horizon is a corporate review cycle rather than infinity and there is no recapitalisation after a bad year. And flag the ways you would expect this procedure to misfire that we would not notice until they had already cost us money. Please do not give me citations, links, or a reading list; I have a librarian for that. I want the reasoning and its breaking points.
reasoning: |-
  Here's a thinking process that leads to the suggested allocation procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Director of Variety Development at a mid-sized seed company.
      *   **Context:** £18m base, £12m survival threshold (critical risk). 60 candidates -> 6-10 advanced. Spring main cycle, Autumn top-up.
      *   **Team:** 2 breeders, 1 analyst (no decision theory training). Needs a spreadsheet-ready procedure.
      *   **Constraints:** No external capital. Uncommitted capital earns zero real return. Lumpy funding (0%, 70%, 100%). Capacity constraint (~8 projects max). Correlated risks (weather/disease years). Mandated negative EV project. Thin/optimistic probability estimates.
      *   **CFO Pressure:** Wants highest Expected Value (EV) descending order.
      *   **User's Intuition:** Log-utility (Kelly-ish) maximizes long-run growth and avoids ruin, unlike pure EV. Needs validation and operationalization.
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, thresholds, hand-offs).
          2.  A paragraph for the CFO (EV vs. Growth) + verdict on its validity.
          3.  Worked examples for Case A (Flagship Long-shot), Case B (Dull One), Case C (Near-Duplicates).
          4.  Critique/Limitations (What the procedure can't do, load-bearing assumptions, what would change my mind, measurement).

  2.  **Analyze the Core Problem:**

      *   **Objective:** Survive above £12m while growing the base.
      *   **Risk Profile:** Asymmetric. Downside is ruin (restructuring/closure). Upside is growth.
      *   **Mathematics:** This is a classic "Growth-Optimal Portfolio" problem with constraints (integer bets, correlation, capacity, ruin barrier). Pure Kelly Criterion is too aggressive for finite horizons and parameter uncertainty. "Half-Kelly" or fractional Kelly is standard practice.
      *   **The CFO's Objection:** EV maximization works for infinite independent trials with unlimited capital. It fails when a single string of losses wipes out the ability to play the game (Gambler's Ruin).
      *   **The "Log Rule":** Maximizing $E[\ln(Wealth)]$ approximates maximizing geometric growth rate. It penalizes volatility and correlation that threaten the barrier.

  3.  **Drafting the Procedure (Deliverable 1):**

      *   *Goal:* Make it actionable for a non-expert team in a spreadsheet.
      *   *Steps:*
          1.  **Sanity Check (The Barrier):** Calculate the "Worst Case Cohort Loss." If Base - Loss < £12m + Buffer, stop/reduce.
          2.  **Probability Haircut:** Address the "optimistic/thin" data. Need a shrinkage factor.
          3.  **Sizing Rule:** Adapt Kelly for lumpy bets (0, 0.7, 1.0).
          4.  **Capacity Check:** Limit to 8 projects.
          5.  **Correlation Adjustment:** Group by risk factors (e.g., same trait, same environment).
          6.  **Mandated Project:** Treat as a fixed cost/tax, not an investment decision.
          7.  **Governance Hand-off:** When does the Director/Committee decide? (e.g., when the math says "No" but strategic value says "Yes").
      *   *Refinement:* The user mentioned an "Exploration Budget." I need to address that in Case A analysis, but the main procedure should probably treat the core bankroll conservatively.
      *   *Specifics:* How to calculate the "Growth Score"? $f^* \approx \frac{p(b+1) - 1}{b}$. But since bets are lumpy, we compare Expected Log Wealth for 0%, 70%, 100%.
      *   *Simplification for Spreadsheet:* Instead of full log-optimization which is complex with correlation, use a "Risk-Adjusted Score" that mimics log-utility behavior. Score = $EV - \lambda \times Variance$ or simply a fractional Kelly fraction. Let's stick to a simplified Fractional Kelly approach adjusted for the barrier.
      *   *Actually, better approach for the team:* Calculate the "Survival Impact." If a project fails, how much does the base drop? If it drops too close to £12m, the "cost" of that risk is infinite.
      *   *Decision Rule:* Rank by Expected Log Growth contribution, subject to the Barrier Constraint and Capacity Constraint.

  4.  **Drafting the CFO Paragraph (Deliverable 2):**

      *   *Argument:* EV assumes we can play forever. We can't. We have a ruin barrier (£12m). EV maximization ignores the *sequence* of returns. A string of losses kills us before the "average" comes in. Log-utility accounts for the cost of volatility on compounding.
      *   *Verdict:* It's a real argument, not just framing. It's the difference between arithmetic and geometric mean returns.

  5.  **Working the Cases (Deliverable 3):**

      *   **Case A (Flagship):** High variance, low prob.
          *   Math: $p=0.03$ (analyst), $b=39$ (40x return - 1 cost). Kelly fraction $f = (0.03 \times 40 - 1) / 39 \approx 0.05$.
          *   Cost: £2.2m. Base: £18m. Fraction needed: 12%. Kelly says 5%. Overbet.
          *   Exploration Budget: Is it coherent? Yes, if treated as R&D expense (OpEx) rather than Capital Investment (CapEx/Bankroll). Needs strict cap (e.g., 5% of base).
      *   **Case B (Dull):** Moderate prob, low multiple.
          *   Math: $p=0.6$, $b=1.4$ (2.4x return - 1). Kelly $f = (0.6 \times 2.4 - 1) / 1.4 \approx 0.31$.
          *   Cost: £1.9m (10.5% of base). Kelly says 31%. Underbet? But capacity constraints and correlation matter.
          *   70% funding: Lower cost, lower prob. Need to compare Expected Log Wealth.
      *   **Case C (Duplicates):** Correlation.
          *   Math: If they fail together, variance increases. If they succeed together, payoff diminishes (cannibalization).
          *   Procedure must penalize the second project's EV significantly.

  6.  **Critique & Limitations (Deliverable 4):**

      *   *Load-bearing assumptions:* 1. The £12m barrier is hard (it is). 2. Probabilities are meaningful after haircut (weak link).
      *   *What changes my mind:* If the barrier is actually soft (corporate bailouts). If the probability estimates are pure noise (no signal).
      *   *Measurement:* Track calibration of breeder scores vs. actual outcomes.
      *   *Extrapolation:* Log-utility assumes infinite horizon. We have a 3-5 year corporate review cycle. This makes us *more* risk-averse than Kelly, not less.
      *   *Failure modes:* "Diworsification" (taking too many small bets), ignoring correlation clusters.

  7.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Correction:* The team can't run complex log-optimization in a day. I need a heuristic that *approximates* log-utility.
      *   *Heuristic:* "The 15% Rule." No single project > 15% of base. Total cohort risk (weighted) < X%.
      *   *Better Heuristic:* Use a "Safety Margin" calculation.
      *   *Decision:* I will propose a "Growth Score" spreadsheet tab. Inputs: Cost, Prob, Upside. Output: Adjusted Kelly Fraction. Compare to Budget Available.
      *   *Haircut:* Apply a 50% discount to breeder probabilities unless calibrated.
      *   *Barrier:* Explicit "Ruins Check."

  8.  **Final Polish:**

      *   Tone: Professional, direct, respectful of the stakes (55 jobs).
      *   Format: Clear headings, bullet points, arithmetic shown clearly.
      *   Check against constraints: No links, no citations. Spreadsheet friendly.

  **(Self-Correction on Case A Exploration Budget):** The user asks if carving out an exploration budget is coherent.
  *   *Analysis:* Yes, it separates "Core Business" (compounding bankroll) from "Optionality" (lottery tickets).
  *   *Discipline:* It must be capped (e.g., 5% of base), non-replenishable by success (successes go to main bankroll), and replenished only by annual allocation from surplus.
  *   *Verdict:* It prevents the "long shot" from distorting the core risk profile.

  **(Self-Correction on CFO Argument):**
  *   *Nuance:* The CFO cares about IRR. I need to explain that Geometric Mean IRR < Arithmetic Mean IRR when volatility is high. We care about Geometric.

  **(Self-Correction on Procedure Steps):**
  *   Make sure the "Mandated Project" is handled. It's a tax. Deduct its cost from the available budget *before* allocation.

  **(Self-Correction on Limitations):**
  *   Be honest: The procedure relies on $p$ being non-zero signal. If breeders are guessing, the math is garbage in, garbage out. The "Haircut" is the only defense.

  9.  **Final Review against User Prompt:**
      *   Procedure order? Yes.
      *   CFO paragraph + verdict? Yes.
      *   Three cases with arithmetic? Yes.
      *   Limitations/Assumptions/Measurements? Yes.
      *   No citations? Yes.

  Let's write it.
answer: |-
  ### 1. The Allocation Procedure

  This procedure is designed for a spreadsheet. It prioritises survival of the £12m barrier over maximising arithmetic mean return. It treats the programme bankroll as a compounding asset that cannot be replenished externally.

  **Step 1: The Ruin Check (Barrier Test)**
  *   **Question:** If we fund the proposed cohort and *every* project fails (0% success), where does the base land?
  *   **Calculation:** `Current Base (£18m) - Total Cohort Cost - Mandated Project Cost`.
  *   **Threshold:** The result must be ≥ £13.2m.
  *   **Reasoning:** £12m is the hard trigger. £1.2m (10%) is a safety buffer for operational overspend or unexpected carry-over costs.
  *   **Action:** If the result is < £13.2m, the cohort size is rejected immediately. Reduce the number of projects or funding levels (100% → 70%) and recalculate.
  *   **Hand-off:** If the only way to pass this test is to fund fewer than 4 projects, hand to the Investment Committee. This indicates the programme strategy is misaligned with the capital base.

  **Step 2: Probability Haircut (Calibration)**
  *   **Question:** Are the breeder probability estimates reliable?
  *   **Rule:** Apply a **50% shrinkage factor** to all breeder-estimated probabilities ($P_{breeder}$) unless the analyst can demonstrate calibration >0.7 correlation over 3 years.
      *   $P_{adjusted} = P_{breeder} \times 0.5$.
      *   Cap $P_{adjusted}$ at the historical base rate for that class (e.g., if the class average is 10%, no single line can be scored >10% regardless of breeder enthusiasm).
  *   **Reasoning:** Your estimates are thin and self-selected. This prevents "optimism bias" from inflating the Kelly fraction.
  *   **Action:** Analyst populates the `P_adjusted` column. No override allowed without Committee approval.

  **Step 3: Sizing Score (The Growth Metric)**
  *   **Question:** Does this project add to the geometric growth rate of the bankroll?
  *   **Calculation:** Calculate a "Growth Score" for each funding level (0%, 70%, 100%).
      *   $Gain = (Cost \times Multiple) - Cost$
      *   $Loss = Cost$
      *   $Growth Score = P_{adjusted} \times \ln(Base + Gain) + (1 - P_{adjusted}) \times \ln(Base - Loss)$
  *   **Comparison:** Compare the Growth Score of the project against the Growth Score of doing nothing (which is $\ln(Base)$).
  *   **Rule:** Only fund if `Growth Score(Project)` > `Growth Score(Null)`.
  *   **Sizing:** If 100% funding yields a lower score than 70% funding (due to risk concentration), select 70%. If 70% is lower than 0%, reject.
  *   **Note:** This approximates the Kelly Criterion but accounts for the finite bankroll and logarithmic utility directly.

  **Step 4: Correlation & Capacity Filter**
  *   **Question:** Do these projects share a common failure mode or cannibalise each other?
  *   **Rule:**
      1.  **Capacity:** Hard cap at 8 concurrent Stage 2 projects.
      2.  **Clustering:** Group projects by "Risk Cluster" (e.g., same disease resistance, same trial region).
      3.  **Penalty:** If adding a project increases the cohort's exposure to a single cluster >50% of total spend, reduce its Growth Score by 20%.
      4.  **Cannibalisation:** If two projects target the same market niche, value the second project at 50% of its commercial multiple.
  *   **Action:** Rank projects by Growth Score. Select top projects until the Capacity Cap (8) or Budget Cap (from Step 1) is hit.

  **Step 5: The Mandated Project**
  *   **Treatment:** Treat as a **fixed tax** on the bankroll, not an investment.
  *   **Action:** Deduct its cost from the Available Budget *before* Step 1. Do not include it in the Growth Score ranking. It is a compliance cost required to keep the licence to operate.

  **Step 6: Governance Hand-off**
  *   **Trigger:** The procedure hands the decision to a person/committee if:
      1.  A project fails the Growth Score test but is deemed "Strategically Essential" (e.g., blocking a competitor).
      2.  The Ruin Check forces the cohort size below 4 projects.
      3.  The Exploration Budget (see Case A) is invoked.
  *   **Requirement:** Any override must be signed by the Programme Director and recorded as a "Deviation from Growth Optimisation."

  ---

  ### 2. The CFO Paragraph

  **Draft for Investment Committee:**
  "Maximising Expected Value (EV) assumes we can repeat this bet infinite times with unlimited capital. We cannot. We have a hard ruin barrier at £12m. EV maximisation ignores the *sequence* of returns; a string of losses that is statistically possible under an EV strategy will trigger restructuring before the 'average' return materialises. By sizing for Expected Logarithmic Growth, we prioritise the Geometric Mean return over the Arithmetic Mean. This reduces volatility and correlation risk, ensuring we survive the bad years required to reach the good years. It is not risk aversion; it is capital preservation required for compounding."

  **Verdict:**
  This is a **real argument**, not framing. In multiplicative systems with a ruin barrier, Arithmetic Mean (EV) is a dangerous metric. Geometric Mean is the only metric that predicts long-term survival. However, the CFO may reject this if their bonus is tied to short-term Arithmetic EV. The argument holds mathematically, but it conflicts with standard corporate accounting which treats R&D as an expense to be minimised or maximised in isolation, not as a portfolio of compounding bets.

  ---

  ### 3. Worked Cases

  **Units:** £ Millions. Base = £18m. Ruin Barrier = £12m.

  #### Case A: The Flagship Long-shot
  *   **Inputs:** Cost £2.2m (100%). Multiple 40x. $P_{breeder} = 8\%$. $P_{analyst} = 3\%$.
  *   **Haircut:** $P_{adj} = 3\% \times 0.5 = 1.5\%$. (Using analyst base as it is more conservative).
  *   **Growth Score (100%):**
      *   Gain = $2.2 \times 40 - 2.2 = 85.8$.
      *   Loss = $2.2$.
      *   $Score = 0.015 \times \ln(18 + 85.8) + 0.985 \times \ln(18 - 2.2)$
      *   $Score = 0.015 \times 4.66 + 0.985 \times 2.76 = 0.07 + 2.72 = 2.79$.
      *   Null Score = $\ln(18) = 2.89$.
      *   **Result:** $2.79 < 2.89$. **Reject.**
  *   **Exploration Budget Coherence:**
      *   **Verdict:** Coherent, *if* disciplined. It separates "Core Compounding Capital" from "Optionality Purchase."
      *   **Discipline:**
          1.  **Size:** Max 5% of Base (£0.9m/year). Non-cumulative.
          2.  **Replenishment:** Only from annual surplus *after* core bankroll targets are met.
          3.  **Authority:** Director only. Breeders cannot access it.
          4.  **Empty Book:** If the budget is empty, the project waits. It does not cannibalise the core bankroll.
      *   **Application:** This project costs £2.2m. It exceeds the Exploration Cap. It must be rejected unless the Committee grants a specific exception, acknowledging it threatens the core growth rate.

  #### Case B: The Dull One
  *   **Inputs:** Cost £1.9m (100%). Multiple 2.4x. $P_{base} = 0.6$.
  *   **Haircut:** $P_{adj} = 0.6 \times 0.5 = 0.3$. (Aggressive haircut due to thin data).
  *   **Growth Score (100%):**
      *   Gain = $1.9 \times 1.4 = 2.66$. Loss = $1.9$.
      *   $Score = 0.3 \times \ln(20.66) + 0.7 \times \ln(16.1) = 0.3(3.03) + 0.7(2.78) = 0.91 + 1.95 = 2.86$.
      *   Null Score = $2.89$.
      *   **Result:** $2.86 < 2.89$. **Reject at 100%.**
  *   **Growth Score (70%):**
      *   Cost = £1.33m. Analyst says $P = 0.5$. Haircut $P_{adj} = 0.25$.
      *   Gain = $1.33 \times 1.4 = 1.86$. Loss = $1.33$.
      *   $Score = 0.25 \times \ln(19.86) + 0.75 \times \ln(16.67) = 0.25(2.99) + 0.75(2.81) = 0.75 + 2.11 = 2.86$.
      *   **Result:** Still marginal rejection ($2.86 < 2.89$).
  *   **Two Projects Available:**
      *   If you run two, correlation risk increases. If they share the same disease resistance, a failure year kills both.
      *   **Procedure:** The second project's multiple is discounted (cannibalisation/correlation). Even if the math worked for one, the procedure likely rejects the second due to the Capacity/Correlation filter (Step 4).
      *   **Decision:** Reject both under strict growth rules. This highlights the tension: the "Dull" project is actually value-destructive under conservative probability estimates. You must either improve the probability estimate (better data) or accept lower growth.

  #### Case C: The Near-Duplicates
  *   **Inputs:** Two projects. Cost £1.5m each. Multiple 3x. $P_{adj} = 0.4$.
  *   **Correlation:** High. If one fails due to network drought, both fail.
  *   **Cannibalisation:** If both succeed, second is worth 50%.
  *   **Project 1 Score:**
      *   Gain = $3.0$. Loss = $1.5$.
      *   $Score = 0.4 \times \ln(21) + 0.6 \times \ln(16.5) = 0.4(3.04) + 0.6(2.80) = 1.22 + 1.68 = 2.90$.
      *   Null = $2.89$. **Pass.**
  *   **Project 2 Score (Adjusted):**
      *   Multiple reduced to 1.5x (cannibalisation).
      *   Gain = $1.5 \times 0.5 = 0.75$. Loss = $1.5$.
      *   $Score = 0.4 \times \ln(18.75) + 0.6 \times \ln(16.5) = 0.4(2.93) + 0.6(2.80) = 1.17 + 1.68 = 2.85$.
      *   Null = $2.89$. **Fail.**
  *   **Decision:** Fund Project 1. Reject Project 2. The procedure correctly identifies that the second bet adds cost without proportional value due to correlation and market overlap.

  ---

  ### 4. Limitations, Assumptions, and Breaking Points

  **What the Procedure Cannot Do:**
  1.  **It cannot fix bad data.** If the breeder's probability estimates are noise (random guesses), the haircut makes them smaller noise, not signal. The procedure will systematically reject projects that might have been winners because the input $P$ is too low.
  2.  **It cannot predict "Black Swans" outside the model.** A regulatory ban on the trait, or a new competitor technology, is not in the $P$ or Multiple.
  3.  **It assumes the Barrier is Hard.** If Corporate quietly bails you out at £11m, the procedure is too conservative. If they close you at £13m, it is too aggressive.

  **Load-Bearing Assumptions:**
  1.  **The Barrier is Real (£12m).** This is the engine of the log-utility constraint. If this is a negotiating position rather than a hard cliff, the procedure sacrifices too much upside.
  2.  **Probabilities have Signal.** The haircut assumes there is *something* to save. If the breeders have zero calibration, the ranking is arbitrary.

  **What Would Change My Mind:**
  *   **Observation:** If, over the next two cycles, the projects rejected by this procedure (due to low Growth Score) consistently outperform the accepted ones.
  *   **Measurement:** Track the "Rejected Watchlist." Score the outcomes of lines you *didn't* fund (if possible, e.g., if they were funded in a different year or by a partner). If their success rate is significantly higher than your funded cohort, your probability model is broken, and the sizing rule is optimising garbage.

  **Extrapolation Warnings:**
  *   **Horizon:** Log-utility assumes an infinite horizon. You have a 3-5 year corporate review cycle. This means you should be *more* conservative than the procedure suggests, not less. The procedure assumes you can recover from a loss next year. If a loss triggers a review *this* year, the "Null" option is safer than calculated.
  *   **Recapitalisation:** The math assumes no external capital. If Corporate *does* inject cash after a bad year (despite the threat), the procedure is overly timid.

  **Expected Failure Modes:**
  1.  **The "Safety" Trap:** The team will learn to game the inputs to make projects pass the Growth Score. They will inflate Multiples or deflate Costs. You must audit the *inputs*, not just the outputs.
  2.  **Correlation Blindness:** The procedure relies on the team identifying clusters. They will miss subtle correlations (e.g., two different traits that both fail in high heat). This will cause the "Ruin Check" to underestimate the probability of total cohort failure.
  3.  **Innovation Starvation:** Strict log-growth favours "Dull" projects with high probability over "Flagship" projects. Over 5 years, this may secure the £12m barrier but fail to generate the £50m growth needed to make the programme strategically vital. You may survive but become irrelevant.

  **Cheap Measurement:**
  *   **Calibration Plot:** Once a year, plot Breeder Probability (x-axis) vs. Actual Success Rate (y-axis) for all decisions made 3 years prior. If the slope is not near 1.0, adjust the Haircut factor immediately.
  *   **Barrier Proximity:** Monitor `Base - Max Cohort Loss` monthly. If this gap shrinks below £2m, freeze all Stage 2 advancements regardless of the Score.
