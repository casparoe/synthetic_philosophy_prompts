  5.  **Identify Illuminating Scenes:**
      *   *The Conch:* Perfect example of failed monitoring/enforcement. It grants speech but no power to enforce.
      *   *The Fire:* Classic commons problem. Everyone benefits from rescue (public good), but maintaining it is costly (labor). Free-riding occurs (hunters let it go).
      *   *Pig Roast/Feast:* Jack uses resource distribution (meat) to buy loyalty, bypassing the rules. This is a breakdown of collective choice.
      *   *Ralph's Authority Collapsing:* Shows what happens when sanctions are absent. You can't punish defectors without force.

  6.  **Identify Distortions/Weaknesses:**
      *   *Resource Scarcity:* The island is lush. Food is plentiful (fruit, pigs). The tragedy isn't resource depletion, it's political violence. Ostrom solves *scarcity* conflicts; Golding writes about *fear* and *evil*.
      *   *Time Horizon:* Ostrom's communities are long-term. These are children with no long-term stake or memory.
      *   *Human Nature:* Ostrom assumes humans are capable of cooperation given the right institutions. Golding assumes humans are inherently sinful (Calvinist influence). The essay needs to address this tension: Is Golding wrong, or is he writing a different kind of tragedy?
      *   *The "Beast":* This is an external/internal threat, not a resource management issue. Ostrom doesn't account for mass hysteria.

  7.  **Drafting the Response:**
