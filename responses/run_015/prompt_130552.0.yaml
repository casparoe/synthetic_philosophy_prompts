answer: |-
  This is a sharp observation of a tension that exists in almost all means-tested welfare systems (like Universal Credit in the UK, SNAP/TANF in the US, etc.). The frustration your friend feels stems from a clash between legal individualism and administrative collectivism.

  Here is an analysis of what the current rule presupposes, how the proposed alternative differs, and what both imply about the nature of "need."

  ### 1. What the Current Rule Presupposes

  The current system relies on three overlapping presuppositions:

  **A. The "Economic Unit" Theory (Empirical Guess)**
  The state operates on the empirical assumption that romantic cohabitation creates a single economic unit. It presupposes that if two people are "living together as a couple," resources *will* flow between them, regardless of whether they actually do. It treats the relationship status as a proxy for financial interdependence. The logic is that it is administratively impossible to verify every cup of coffee or bill split, so a bright-line rule is applied: if you act like a couple, you are taxed and benefited like a single financial entity.

  **B. The Principle of Subsidiarity (Duty of Support)**
  There is a moral and legal presupposition that private obligations precede public ones. The state views itself as the insurer of last resort. If you have a partner, the presupposition is that they have a *duty* to support you before the taxpayer does. This is why his income counts as available to her: the state assumes he *ought* to be using that income to support the household, even if he legally isn't required to do so (since they aren't married).

  **C. Need is a Property of Households, Not Persons**
  This is the core philosophical stance. The system does not assess *individual* poverty; it assesses *household* poverty. The state's goal is to ensure a minimum standard of living for a domestic unit, not to guarantee individual financial autonomy within that unit.

  **Regarding the Asymmetries (Income vs. Debt, Fraud):**
  *   **Income vs. Debt:** Benefits are designed to supplement *cash flow* for subsistence, not to balance net worth. The state assumes your partner's income is *accessible* to you (you can eat the food they buy), but it does not assume their debts are *yours* (you are not legally liable for their credit card). The state protects itself from paying for your subsistence if resources exist; it does not offer to pay off your liabilities.
  *   **The Fraud Burden:** This presupposes **Information Asmetry**. The state cannot easily monitor your bedroom or your bank account, but you know your relationship status. Therefore, the duty to report is placed on you. Non-disclosure is treated as fraud because it violates the condition of eligibility: you were paid based on a false premise (that you were a single-person household).

  ### 2. What the Proposed Alternative Presupposes

  The suggestion to treat any two adults sharing an address for six months as one household (unless they declare otherwise) shifts the logic significantly:

  **A. Address Over Intimacy**
  This presupposes that **spatial proximity** is a better administrative indicator of shared economics than **relationship status**. It removes the "morality police" aspect of investigating whether two people are "really a couple." It admits that flatmates often share costs (utilities, rent) just as couples do, so the economic logic should apply equally.

  **B. Opt-Out Autonomy**
  By allowing a signed declaration of separate finances, this rule presupposes that financial independence is possible within a shared household, but that it is an **exception** that must be actively claimed. It shifts the default from "separate unless married/cohabiting" to "merged unless declared separate."

  **C. Administrative Efficiency over Moral Duty**
  This rule is less concerned with the "duty of support" between lovers and more concerned with preventing benefit duplication among people who clearly share living costs. It treats the household as a cost-sharing entity rather than a moral unit.

  ### 3. Person vs. Household: Comparing the Two

  Both versions ultimately agree that **need is a property of households, not persons.** Neither system offers a truly individual-based safety net where your entitlement is unaffected by who you live with.

  *   **The Current Rule** defines a "household" by **intimacy**. It says: "Need is communal where there is love/sex/commitment." It risks penalizing the vulnerable partner in an unequal relationship (like your friend's) because it assumes equality of access to resources that doesn't exist.
  *   **The Proposed Rule** defines a "household" by **address**. It says: "Need is communal where there is shared infrastructure." It risks penalizing flatmates who genuinely keep finances separate but don't want the hassle of filing a declaration.

  The proposed rule is arguably more honest: it admits that *any* cohabitation reduces individual costs (economies of scale), whereas the current rule pretends that only *romantic* cohabitation does.

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85-90%)**
  I am highly confident in the analysis of how welfare bureaucracies function logically. The principles of "economic unit," "subsidiarity," and "information asymmetry" are standard features of means-tested benefit design across liberal democracies (UK, US, Canada, Australia). The distinction between household-based vs. individual-based need is also a well-documented distinction in social policy theory.

  **Area of Least Certainty: The Weighting of Moral vs. Fiscal Intent**
  The part I am least sure about is the precise weighting of **moral presupposition vs. fiscal pragmatism** in the current rules.
  *   *Why I'm less sure:* Policymakers rarely state explicitly whether the "couple rule" exists because they genuinely believe partners *should* support each other (moral duty), or simply because it saves the state money by disqualifying more people (fiscal pragmatism).
  *   *The Ambiguity:* In practice, it is likely a hybrid. However, if the primary driver is fiscal saving, the proposed "address-based" rule would likely be resisted not because it's philosophically wrong, but because it might be *too* effective at capturing flatmates, thereby reducing the benefit bill further than politicians might want to admit publicly. Conversely, if the driver is moral (supporting the "traditional" family unit), the current rule persists to avoid "penalizing marriage." I cannot be 100% certain which motive dominates in your specific jurisdiction's legislation without access to parliamentary records or legislative intent documents.

  **Summary**
  The current rule presupposes that intimacy creates a financial merger and that the state should not support a person if their partner *could* support them. The proposed rule presupposes that shared address creates a cost-sharing merger unless proven otherwise. Both treat need as a household property, but the current rule ties that household to romantic status, creating the specific vulnerability your friend is experiencing where she is held responsible for resources she cannot access.
