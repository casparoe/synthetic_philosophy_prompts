      *   *Presupposition 2: Duty of Support.* There's a legal/social notion that partners *should* support each other before the state steps in (subsidiarity).
      *   *Presupposition 3: Household as Unit.* Need is assessed at the household level, not the individual level. The state doesn't want to subsidize a household that has aggregate resources above a threshold.
