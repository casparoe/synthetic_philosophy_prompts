answer: |-
  1. **Foundations (0–5 min):** Define EU inputs: $P(state)$ and $U(outcome)$. Stipulate that rational choice requires maximizing *current* $U$ over future outcomes. Establish that if either input is inaccessible to the current agent, EU stalls.
     *   *Defuse:* **Ordinary Risk.** Clarify immediately: Risk is unknown $P$ (resolvable by information); Transformation is unknown $U$ or unknown *self* holding $U$ (not resolvable by information).

  2. **Epistemic Gap (5–12 min):** Lead with the Antarctic case. Focus on "what it is like." Testimony provides propositions, not phenomenal experience. You cannot assign $U$ to an outcome you cannot conceptualize. Epistemic transformation must come first because you cannot assess value changes in an experience you cannot imagine.
     *   *Defuse:* **Testimony/Surveys.** Explain why third-person data doesn't yield first-person utility.
     *   *Defuse:* **Affective Forecasting.** Treat as a detour. Empirical bias explains *why* we fail, but the philosophical problem is that *no* amount of forecasting bridges the phenomenal gap.

  3. **Personal Gap (12–22 min):** Shift to value change. The Antarctic self may value isolation over career. Choosing now requires using future values, but you only have current values. The Antarctic example works here *only if* you frame it as altering fundamental priorities (e.g., solitude vs. achievement), not just comfort.
     *   *Defuse:* **Reversibility/Pilot.** The agent who reverses is the transformed self, not the ex ante self. Control isn't returned to the original utility function.
     *   *Defuse:* **Spontaneity.** Reason doesn't dictate *how* to choose when EU is silent, but silence isn't permission for arbitrariness; it marks a limit of the model.

  4. **Synthesis (22–30 min):** Combine gaps. EU requires fixed $U$ and known outcomes. Both fail.
     *   *Variant:* **Exclude.** The "invisible transformation" case is too complex for 30 minutes; it risks confusing the core logical gap regarding access to values.

  **The Check:** "If I grant you perfect knowledge of the future outcome's physical properties and psychological effects, does the decision problem dissolve?" If yes, it was epistemic (missing information). If no, because you still cannot endorse the future self's valuation, it is personal (missing values).

  **Refusals:**
  1.  **Metaphysics of Identity:** Keep the discussion pragmatic (agency), not ontological (who survives).
  2.  **Formalizing Discovery:** Decline to solve how to formalize value discovery; the point is that standard EU cannot do it.
