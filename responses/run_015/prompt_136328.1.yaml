      *   **Aristotelian VE:** *Phronesis* is context-sensitive. It's not a rigid rule. However, Aristotle acknowledges luck (*eutychia*). A virtuous act must hit the mean *relative to us*. If the situation is corrupted, the virtuous agent might still fail, but the *hexis* (state) remains virtuous.
      *   **The Challenge:** Create a case where *phronesis* itself (the weighing of context) is the *cause* of the failure, not just external obstruction. If the virtuous agent ignores the rule because their wisdom says "this case is an exception," and they turn out wrong, does that refute *phronesis*?

