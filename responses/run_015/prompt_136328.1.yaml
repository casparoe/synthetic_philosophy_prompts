answer: |-
  **The Scenario**

  Elena, a senior discharge administrator known for her nuanced judgment, overrides the standard protocol for Mr. Henderson, a patient flagged for immediate transfer to a lower-care facility. The protocol mandates transfer if vitals are stable for 48 hours, but Elena notices Henderson appears anxious and his home-care documentation is slightly disorganized; exercising *phronesis*, she judges that the blunt metric misses a high risk of readmission due to psychosocial instability, so she holds him to prioritize resource stewardship and patient safety. Her colleague Mark, lacking this training, processes Henderson's transfer strictly according to the 48-hour vital stability rule. Unbeknownst to Elena, the hospital's automated system had queued a specific remote-monitoring kit for any patient transferred under the standard protocol, a safety net her administrative override inadvertently bypassed, and her assessment of Henderson's anxiety was based on a temporary family dispute resolved hours earlier that was not yet updated in the chart. Henderson suffers a preventable crisis at home without the monitoring kit, while Mark's patients, including those with similar psychosocial risks, receive the automated support and remain stable; Elena's contextual weighing produced greater net harm than Mark's rigid adherence because her access to soft data was incomplete while the hard-data protocol included hidden safeguards.

  **The Verdicts**

  **Virtue Ethics:** The Aristotelian will argue this is a case of **moral luck** (specifically circumstantial), not a failure of the trait. *Phronesis* requires hitting the mean relative to the situation, but it presupposes access to relevant truths; if the institutional structure hides data (the monitoring kit queue) or presents false cues (the unresolved family dispute), the virtuous agent cannot perceive the *orthos logos* (right reason). The verdict is that the trait remains intact because the failure was exogenous. However, a stricter Aristotelian might concede that part of *phronesis* is knowing when institutional protocols encode collective wisdom that outweighs individual intuition; if Elena's override was overconfident, she lacked true *phronesis* and merely had confidence. To dissolve the case, the VE will claim the **institutional opacity is the real vice**; a virtuous institution wouldn't hide safety nets from experienced administrators, so the failure lies in the structure, not the character.

  **Situationism:** Doris would argue this demonstrates the **fragility of global traits**. The outcome wasn't determined by Elena's stable character but by a minor situational variable (access to the updated chart vs. the automated queue). Attributing the failure to "bad luck" is post-hoc rationalization to protect the concept of character from empirical falsification. If Elena's "wisdom" dissolves under specific bureaucratic framing, it isn't a robust trait but a context-specific behavior pattern. The situationist verdict is that we should stop attributing outcomes to *phronesis* and start designing systems (like Mark's protocol) that are robust against individual cognitive blind spots.

  **The Pivot Feature**

  The feature doing the work is **Information Asymmetry coupled with Embedded Safety Nets**. The case relies entirely on the fact that the blunt rule contained a hidden protective feature (the monitoring kit) that the nuanced override bypassed, and that Elena's contextual data was stale. **If you remove this feature**—if Elena has full access to the monitoring queue and real-time family data—the case collapses back into a boring standard example where *phronesis* correctly identifies the risk and prevents harm, vindicating virtue ethics. The scenario only works as a critique because the "wisdom" is operating in a corrupted information environment.

  **The Dissolution**

  The virtue ethicist's strongest move is to argue that **true *phronesis* includes meta-cognitive awareness of institutional limits**. They would claim Elena didn't actually possess *phronesis* in this instance because a truly practically wise agent would know that in high-stakes bureaucratic systems, overrides require verification levels she didn't meet. Thus, the failure wasn't virtue misfiring; it was pseudo-virtue (overconfidence) encountering a system designed for average agents. This protects the theory by making *phronesis* somewhat unfalsifiable—if it works, it's wisdom; if it fails, it wasn't true wisdom—but it shifts the burden to defining the conditions under which intuition is trustworthy.
