answer: |-
  Here is a teaching plan designed for your specific audience (rationalist-adjacent, analytically rigorous, bioethics-naïve). It structures the conceptual dependencies to prevent the "different child" objection from dissolving the moral stakes too early, while insulating the argument from historical eugenics baggage.

  ### 1. The Dependency Order
  Do not present the concepts linearly as they appear in the literature. Present them in the order of *defensibility*. If you introduce the Non-Identity Problem (NIP) immediately, your audience will use it to dismiss the obligation ("It's a different person, so no harm done"). If you introduce it too late, the obligation looks incoherent ("How can you harm someone who wouldn't exist?").

  **The Sequence:**
  1.  **The Intuition of Prevention:** Establish the baseline duty to prevent suffering in *existing* children.
  2.  **The Liberal Constraint:** Immediately distinguish *individual selection* from *state coercion* (pre-empt the "Eugenics" label).
  3.  **The Selection Scenario (Carrying Example):** Present the choice between embryos.
  4.  **The "Different Child" Objection:** Let the audience raise the NIP objection naturally.
  5.  **The Impersonal Principle (NIP Solution):** Deploy NIP not as a metaphysical riddle, but as a bridge to the *Principle of Procreative Beneficence* (PB).
  6.  **The Obligation:** Formulate PB only after the NIP bridge is crossed.

  **Why this order:** You need the audience to feel the weight of the choice *before* you tell them the children are numerically different. If they accept the duty to prevent suffering first, NIP becomes the tool that *extends* the duty to reproduction, rather than the tool that *dissolves* it.

  ### 2. The Carrying Example: Openness vs. Conscientiousness
  Your instinct to avoid the deafness case is correct; it triggers immediate ableism defenses that distract from the structural argument. However, Openness vs. Conscientiousness risks collapsing into "lifestyle preference." To make this work for Procreative Beneficence, the example must be tied to **expected welfare**, not **trait preference**.

  **What the example must have:**
  *   **Correlation to Suffering:** Do not frame it as "Artist vs. Accountant." Frame it as "Embryo A (High Openness, statistically higher risk of mood instability)" vs. "Embryo B (High Conscientiousness, statistically higher resilience to economic/health shocks)."
  *   **Incommensurability:** Both lives must be clearly *worth living*. Neither is a "disease."
  *   **The Delta:** There must be a calculable, albeit probabilistic, difference in expected quality-adjusted life years (QALYs) or equivalent welfare metric.

  **What the example must lack:**
  *   **Zero-Sum Social Value:** Do not imply society *needs* more conscientious people. The benefit must be internal to the child.
  *   **Certainty:** Emphasize these are polygenic risk profiles, not determinisms. PB operates on *expected* value, not guaranteed outcomes.

  **Setup Script:**
  > "Imagine IVF with polygenic screening. Embryo A has a genetic profile correlating with High Openness but lower emotional resilience. Embryo B has High Conscientiousness and higher emotional resilience. Both will lead lives well above the threshold of 'worth living.' However, actuarial data suggests Embryo B has a 15% higher probability of avoiding severe depressive episodes during adulthood. We are not choosing a career; we are choosing a statistical floor for suffering."

  ### 3. The Misconception Map
  Your audience will likely make two specific category errors. Address them at these precise moments:

  **Misconception A: "Liberal Eugenics = State Coercion"**
  *   **The Error:** Assuming that if a choice is morally obligatory, it must be legally mandated (the "Nazi Slippery Slope").
  *   **When to Head Off:** **Step 2 (The Liberal Constraint).** Before discussing the embryos.
  *   **The Fix:** Define "Liberal Eugenics" explicitly as *decentralized, market/family-based selection without state quotas.*
  *   **Script:** "We are discussing a moral obligation on parents, not a legal mandate from the state. In Rawlsian terms, we are asking about the duty of justice within the family, not the basic structure of the constitution. If you conflate 'ought' with 'must be law,' you will miss the distinction between sin and crime."

  **Misconception B: "Best Expected Life = Subjective Utility"**
  *   **The Error:** Assuming "Best Life" means "What the parents want" or "Highest Income."
  *   **When to Head Off:** **Step 3 (The Selection Scenario).** When defining the welfare delta.
  *   **The Fix:** Anchor "Beneficence" in **welfarism**, not **preference satisfaction**.
  *   **Script:** "Savulescu is not arguing you should select the child you would enjoy raising most. He is arguing you must select the child who will have the most well-being, regardless of your preference. If you prefer High Openness but High Conscientiousness offers the child more resilience, PB demands you choose Conscientiousness. This is anti-preference."

  ### 4. The Concrete Check (The "Nudge" Test)
  At the end of the session, do not ask "Do you agree?" Ask them to resolve a tension between parental obligation and state neutrality.

  **The Scenario:**
  > "The state provides universal healthcare. Genetic screening is expensive but reveals the Openness/Conscientiousness resilience gap we discussed.
  >
  > **Option X:** The state subsidizes the screening fully but remains neutral on which embryo is chosen (Liberal Neutrality).
  > **Option Y:** The state subsidizes the screening and structures the counseling to 'nudge' parents toward the higher-resilience embryo (Paternalistic Beneficence).
  >
  > If Procreative Beneficence is a *moral obligation* for parents, does the state violate neutrality by choosing Option Y? If yes, does that mean the state is complicit in parents failing their moral duty?"

  **What to look for:**
  *   **Failure:** They say "Option Y is eugenics" without addressing the moral obligation, OR they say "Option Y is required" without addressing state neutrality.
  *   **Success:** They articulate that the state can enforce *access* (justice) without enforcing *choice* (liberty), acknowledging that parents can be morally wrong to choose A without being legally punishable. They should identify the tension: *If the duty is strong enough, why is the state's hands-off approach permissible?*

  ### 5. Boundaries: What to Refuse
  Your audience will want to drill into empirical feasibility or deep metaphysics. You must bracket these to keep the session focused on the *normative* claim.

  **1. The Formal Non-Identity Structure**
  *   **Do Not:** Walk through Parfit's "Ridge Case" or the logic of the "Same Number Quality Claim."
  *   **Why:** It turns an ethical discussion into a metaphysical one. Your audience only needs the *conclusion* of NIP (that person-affecting principles fail here), not the proof.
  *   **How to Say It:** "We are accepting the Non-Identity Problem as a premise for tonight. Whether you find Parfit's metaphysics convincing is a separate debate. For this session, we are assuming that 'different person' does not equal 'no moral comparison.' If you reject that premise, PB doesn't get off the ground, but we aren't testing that premise today."

  **2. Genetic Mechanism & Heritability**
  *   **Do Not:** Debate the validity of GWAS studies or the heritability of personality traits.
  *   **Why:** It allows skeptics to dismiss the ethics by attacking the science ("The tech doesn't work anyway").
  *   **How to Say It:** "We are operating in a 'principle of feasibility' frame. Assume the technology works exactly as described in the example. We are testing whether we *should* use it if we *could*. If we bog down in the heritability coefficients, we aren't doing ethics; we're doing epidemiology."

  ### Summary Checklist for the Session Leader
  1.  **Start** with the duty to prevent suffering in existing kids.
  2.  **Define** Liberal Eugenics (Individual vs. State) immediately.
  3.  **Run** the Openness/Conscientiousness example (focus on resilience/welfare).
  4.  **Wait** for the "Different Child" objection, then apply NIP as the bridge.
  5.  **Conclude** with the "Nudge Test" to verify they grasp the Obligation/Neutrality tension.
  6.  **Bracket** the metaphysics of NIP and the biology of PGS explicitly.
