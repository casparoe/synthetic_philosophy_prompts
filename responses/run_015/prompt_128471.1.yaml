answer: |-
  ### Opening Concession Strategy
  To lower the temperature, explicitly concede in your opening remarks that while there may be no *moral obligation* for visitors to comply with extractive or purely local coordinative norms, there remains a strong *prudential* and *politeness-based* recommendation to do so. Acknowledge that your thesis describes the *bounds of moral blame*, not a license for rudeness. State clearly: "I am not arguing that visitors *should* violate these norms, only that they are not morally blameworthy in the same way locals are if they do not." This disarms the accusation that you are encouraging social disruption.

  ***

  ### Q&A Defense: Eight Objections

  #### 1. The Territorial Jurisdiction Objection (Legal Philosophy)
  **Objection:** "You treat territorial entry as a mere physical crossing, but in legal and political philosophy, entering a territory implies submission to its normative order. By crossing the border, the visitor implicitly consents to the 'rules of the game' necessary for public order. If queuing and tipping are part of the local public order, your 'local expectational contract' is redundant. The obligation stems from sovereignty, not convention."

  **Reply:** "Sovereignty governs laws, not conventions. While a visitor is bound by the *law* of the land, tipping and queuing are often extra-legal social technologies. My argument distinguishes between the *coercive* jurisdiction of the state and the *voluntary* coordination of civil society. A visitor submits to the former by entry, but only enters the latter through participation. To conflate the two is to over-extend state sovereignty into the realm of social etiquette."
  **Weakest Point:** This relies on a sharp law/convention distinction that is often blurred in practice (e.g., jaywalking is both a convention and often a legal infraction).

  #### 2. The Principle of Fairness Objection (Contractualism)
  **Objection:** "Even if there is no explicit contract, the Principle of Fairness applies. If a visitor benefits from the stability provided by locals queuing or subsidizing wages via tips, they are free-riding. Accepting the benefit of a cooperative scheme generates an obligation to do one's part, regardless of whether one signed a 'local contract.'"

  **Reply:** "The Principle of Fairness requires that the scheme be just and the benefits be voluntarily accepted. In the case of extractive artifacts like tipping, the scheme is arguably unjust (wage suppression), so no fairness obligation arises. For stabilizing artifacts like queuing, the benefit is non-excludable public order, not a specific good. One cannot 'accept' the benefit of a queue without joining it; thus, the obligation arises only *upon* joining, not merely by presence."
  **Weakest Point:** It is difficult to maintain that one does not "accept" the benefit of a stable social environment simply by walking down the street.

  #### 3. The Phronesis and Respect Objection (Virtue Theory)
  **Objection:** "You reduce morality to obligation, ignoring character. A virtuous agent possesses *phronesis* (practical wisdom) and recognizes that respecting local customs is a manifestation of respect for the community itself. To withhold compliance because one lacks 'contractual history' displays a vice of arrogance or insensitivity, regardless of the deontic status of the act."

  **Reply:** "Virtue ethics rightly focuses on character, but virtue requires acting for the right reasons. Complying with an extractive norm like tipping out of 'respect' may actually reinforce a vicious structure. My distinction allows the virtuous agent to recognize when a norm is merely coordinative versus when it is exploitative. True respect sometimes requires withholding participation from extractive artifacts to signal dissent."
  **Weakest Point:** This risks portraying the visitor as morally superior to the locals who sustain the "extractive" norm, which is patronizing.

  #### 4. The Constitutive Rule Objection (Cultural Anthropology)
  **Objection:** "You treat these norms as 'artifacts' external to the social reality, but anthropologically, rituals like tipping or queuing *constitute* the social reality. They are performative utterances that create the relationship between server and served. To opt out is not just to break a coordination rule; it is to deny the ontological status of the other participants."

  **Reply:** "I agree these norms are constitutive, which is precisely why participation must be voluntary. If a norm constitutes a relationship, one cannot be drafted into that relationship without consent. My thesis protects the agent's autonomy to choose which social realities they wish to inhabit. We can acknowledge the ontological power of the ritual without granting it moral authority over non-participants."
  **Weakest Point:** It underestimates the social cost to the *other* participants when one refuses to participate in a constitutive ritual (e.g., the waiter is genuinely harmed).

  #### 5. The Epistemic Access Objection (Contractualism)
  **Objection:** "You ground obligation in a 'local expectational contract,' but this contract is implicit. How is a visitor to know the terms? If the obligation depends on knowing the norm, you place an impossible epistemic burden on the visitor. If they don't know the norm, they can't form the contract; if they can't form the contract, they can never be bound."

  **Reply:** "The burden is not to know the specific history, but to recognize the *signal* of coordination. Once a visitor observes the pattern (e.g., a line forming), the 'contract' is offered in real-time. The obligation is triggered by the recognition of the coordinative attempt, not by prior historical knowledge. Ignorance excuses initial violations, but continued violation after observation triggers the derivative duty."
  **Weakest Point:** This creates a slippery slope where a visitor becomes "bound" merely by watching, which contradicts the "contractual history" requirement.

  #### 6. The Negative/Positive Duty Collapse Objection (Legal Philosophy)
  **Objection:** "You claim visitors have only a negative duty not to destabilize. In high-coordination contexts, the only way *not* to destabilize is to comply. If everyone else queues, walking to the front destabilizes the queue. Therefore, your negative duty functionally collapses into a positive duty to comply, rendering your distinction meaningless."

  **Reply:** "The distinction holds in edge cases. A negative duty allows me to opt out by *leaving* the situation (e.g., not taking the bus if I won't queue), whereas a positive duty requires me to queue if I am on the bus. The negative duty preserves the exit option. It forbids sabotage, not non-participation. This preserves agency while protecting the artifact."
  **Weakest Point:** In many public spaces (sidewalks, parks), there is no viable "exit" option, forcing compliance anyway.

  #### 7. The Extraction/Stabilization Blur Objection (Cultural Anthropology)
  **Objection:** "Your distinction between stabilizing (queuing) and extractive (tipping) artifacts is analytically unstable. Tipping also stabilizes the interaction by signaling satisfaction and ensuring future service. Queuing can be extractive of time. If the categories bleed into each other, your rule for when obligations attach collapses."

  **Reply:** "The distinction is not about the *effect* but the *structural purpose*. Stabilizing artifacts solve a collective action problem where everyone benefits from compliance (queue jumping hurts everyone). Extractive artifacts transfer wealth or power from one party to another (tips transfer wealth from diner to server to subsidize the owner). We can distinguish them by asking: who bears the cost of the coordination?"
  **Weakest Point:** In many service economies, tipping *does* solve a collective action problem regarding service quality, making it partially stabilizing.

  #### 8. The Civic Friendship Objection (Virtue Theory)
  **Objection:** "By exempting visitors from these norms, you prevent the formation of 'civic friendship.' Participating in shared conventions is how strangers build trust. Your framework keeps visitors in a state of moral isolation, preventing the very social integration that makes ethical life possible."

  **Reply:** "Civic friendship must be reciprocal. If the local norm is extractive, demanding visitor participation is not friendship but exploitation. My framework encourages visitors to engage with *stabilizing* norms, fostering trust where it is mutually beneficial, while withholding labor from extractive norms. This leads to a more honest, if less superficial, form of engagement."
  **Weakest Point:** It assumes the visitor is in a position to judge the "extractiveness" accurately, which hinders the trust-building process.

  ***

  ### The Objection You Hope No One Raises
  **The "Complicity in Injustice" Objection:** "If tipping is an extractive artifact that suppresses wages, and you argue visitors have *no obligation* to tip, are you not arguing that visitors are morally permitted to participate in wage suppression without contributing to the subsidy? If the system is unjust, the moral duty is not merely to withhold obligation, but to *refuse participation entirely* (i.e., do not eat at the restaurant). By allowing visitors to consume the service without the tip, you are licensing them to be complicit in the injustice they acknowledge, rather than requiring them to rectify it or abstain."

  *(Why this is dangerous: It traps you between admitting the visitor is complicit in injustice or admitting your "no obligation" claim facilitates harm. It forces you to take a stance on the morality of consuming within unjust systems, which may be outside the scope of your convention-focused thesis.)*
