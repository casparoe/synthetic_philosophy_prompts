      5. Contractualist (Epistemic Access) - Practical application problem.
      6. Legal (Negative/Positive Duty Collapse) - Logical consistency problem.
      7. Anthropological (Extractive/Stabilizing Blur) - Definition problem.
      8. Virtue (Habituation) - Long term impact.

      *Wait, I need to make sure the "Hope No One Raises" is distinct.* I will put that at the end as a separate section.

