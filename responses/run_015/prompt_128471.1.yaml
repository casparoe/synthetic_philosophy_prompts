prompt: |-
  I will defend the following thesis in a seminar next Thursday before a mixed audience: normative ethicists (mostly contractualists and virtue theorists), a legal philosopher specializing in immigration and territorial rights, and two cultural anthropologists whose work concerns ritual and social coordination. The thesis is that conventions governing tipping, queuing, and jaywalking are not universal moral obligations but coordinative artifacts that generate derivative duties only for agents who stand within a local expectational contract; visitors who lack that contractual history are bound not by a positive duty to comply but only by a negative duty not to destabilize the artifact. I further distinguish stabilizing artifacts, such as queuing norms that preserve cooperative expectations, from extractive artifacts, such as tipping regimes in service economies where gratuities suppress base wages, and I maintain that derivative obligations attach only to the former. Please prepare my Q&A defense: identify approximately eight objections I will actually receive, ordered by how damaging they are and by the discipline most likely to press them—contractualist, virtue-theoretic, anthropological, and legal—phrased in the vocabulary each group would use. For each objection, draft a concise reply suitable for a two-minute exchange, and append an explicit note identifying the weakest point in that reply. Include the single objection I am hoping no one raises. Finally, indicate what I should concede in my opening remarks to lower the temperature of the room, and do not include bibliographies, citation requests, or reading lists.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A defense:

  1.  **Analyze the Request:**
      *   **Thesis:** Conventions (tipping, queuing, jaywalking) are not universal moral obligations but *coordinative artifacts* generating derivative duties only for those within a *local expectational contract*. Visitors lack positive duty to comply, only a negative duty not to destabilize. Distinction made between *stabilizing artifacts* (queuing) and *extractive artifacts* (tipping), with obligations attaching only to the former.
      *   **Audience:** Normative ethicists (contractualists, virtue theorists), Legal philosopher (immigration/territorial rights), Cultural anthropologists (ritual/social coordination).
      *   **Task:** Prepare Q&A defense.
      *   **Requirements:**
          *   ~8 objections.
          *   Ordered by damage potential (most damaging first).
          *   Ordered/Tagged by discipline most likely to press them.
          *   Phrased in specific disciplinary vocabulary.
          *   Concise reply (2-minute exchange length).
          *   Explicit note on the *weakest point* of each reply.
          *   Include the "single objection I am hoping no one raises."
          *   Indicate what to *concede* in opening remarks to lower temperature.
          *   NO bibliographies/citations/reading lists.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Claim 1: Conventions are not universal moral obligations.* (Vulnerable to Universalist/Kantian/Virtue critiques).
      *   *Claim 2: Duties derive from local expectational contracts.* (Vulnerable to Contractualist critiques about who counts as a party).
      *   *Claim 3: Visitors only have negative duty not to destabilize.* (Vulnerable to Legal/Immigration critiques about territorial jurisdiction and integration).
      *   *Claim 4: Stabilizing vs. Extractive distinction.* (Vulnerable to Anthropological/Economic critiques about the function of tipping/ritual).
      *   *Claim 5: Derivative obligations attach only to stabilizing artifacts.* (Vulnerable to consistency critiques).

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (Contractualist - High Damage):* The "Local Expectational Contract" is too thin. If I benefit from the queue, haven't I accepted the terms? (Fairness/Free-rider problem).
      *   *Objection 2 (Legal/Territorial - High Damage):* Territorial jurisdiction implies obligation regardless of "contract." If you enter the territory, you submit to the norms (like laws).
      *   *Objection 3 (Virtue Theory - Medium/High Damage):* Character. A virtuous person respects local customs not because of contract but because of *phronesis* or respect for the community.
      *   *Objection 4 (Anthropological - Medium Damage):* The distinction between stabilizing and extractive is analytically unstable. Tipping *is* a coordination ritual, not just economic extraction.
      *   *Objection 5 (Contractualist - Medium Damage):* Who defines the "contract"? If it's implicit, how do visitors know the terms? Epistemic burden.
      *   *Objection 6 (Legal/Immigration - Medium Damage):* The "negative duty not to destabilize" is functionally identical to a positive duty to comply in high-stakes contexts.
      *   *Objection 7 (Virtue Theory - Low/Medium Damage):* Civic friendship. Participating in norms builds social capital.
      *   *Objection 8 (Anthropological - Low Damage):* Rituals constitute social reality. Opting out is an ontological violation, not just coordination failure.

      *   *The "Hope No One Raises" Objection:* The radical implication. If tipping is extractive and creates no obligation, does that mean one *ought not* to tip? Or is it permissible to free-ride on the wage suppression system? This attacks the moral core of the "extractive" label.

  4.  **Refining Vocabulary:**
      *   *Contractualists:* Scanlonian reasons, mutual justifiability, free-rider problem, principle of fairness.
      *   *Virtue Theorists:* Phronesis, civic friendship, character, telos, habituation.
      *   *Legal:* Territorial sovereignty, jurisdiction, implicit consent, public order.
      *   *Anthropologists:* Thick description, performative utterance, social ontology, ritual efficacy.

  5.  **Drafting Replies & Identifying Weak Points:**
      *   Need to ensure replies are punchy but admit a limitation (the "weakest point" note).
      *   *Strategy:* Defend the "coordinative" nature but admit epistemic difficulties or edge cases.

  6.  **Developing the Opening Concession:**
      *   Need to soften the "visitors don't have to comply" claim. Acknowledge that *prudence* or *respect* might dictate compliance even if *moral obligation* doesn't. This prevents the audience from thinking the thesis encourages rudeness.

  7.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   Disciplinary tags? Yes.
      *   Vocabulary check? Yes.
      *   2-minute reply length? (Keep text concise).
      *   Weakest point note? Yes.
      *   "Hope no one raises"? Yes.
      *   Opening concession? Yes.
      *   No citations? Yes.

  8.  **Final Polish:**
      *   Ensure the tone is academic but defensive.
      *   Check the ordering (Most damaging first).
      *   *Self-Correction on Ordering:* The Legal/Territorial objection is potentially the most damaging because it undermines the jurisdiction of the moral claim itself. The Contractualist "Fairness" objection is a close second. I will place the Legal one first as it challenges the framework's applicability. The Virtue one is damaging to the *spirit* of the thesis. The Anthropological one attacks the *definitions*.

      *(Self-Correction during drafting)*: Let's make sure the "Extractive vs. Stabilizing" distinction gets hit hard, as that's a core novelty of the thesis.

      *Revised Order:*
      1. Legal (Territorial Sovereignty) - Undermines the "visitor" exception.
