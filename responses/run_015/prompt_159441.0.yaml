  ### Scenario: The Leaky Flat

  Two flatmates, **A** and **B**, live in an old building with a shared, leaky ventilation shaft. Each has a private bedroom where they may choose to smoke or not. Smoke drifts between rooms, creating a material health and cleanliness cost, but not enough to constitute a tortious nuisance (legally, it remains within their private sphere).

  **Alternatives:**
  *   $n$: Neither smokes.
  *   $a$: A smokes, B does not.
  *   $b$: B smokes, A does not.
  *   $s$: Both smoke.

  **Preference Table & Payoff Logic:**
  Payoffs are additive: Benefit of smoking (+5), Cost of own smoke (0), Cost of other's smoke (-4), Synergistic cost of double smoke (-6 total).

  | Alternative | A's Payoff | A's Ranking | B's Payoff | B's Ranking |
  | :--- | :--- | :--- | :--- | :--- |
  | **$a$** (A only) | $+5 - 0 = 5$ | **1st** | $0 - 4 = -4$ | **4th** |
  | **$n$** (Neither) | $0$ | **2nd** | $0$ | **2nd** |
  | **$s$** (Both) | $+5 - 6 = -1$ | **3rd** | $+5 - 6 = -1$ | **3rd** |
  | **$b$** (B only) | $0 - 4 = -4$ | **4th** | $+5 - 0 = 5$ | **1st** |

  *Logic:* Each prefers to smoke if the other doesn't ($a \succ n$; $b \succ n$). Both prefer neither smoking to both smoking ($n \succ s$) due to accumulated filth/health costs. However, if the other *is* smoking, the air is already fouled, so one might as well smoke ($s \succ b$ for A; $s \succ a$ for B). These are strictly self-interested, material preferences; no moral judgment of the other's character is involved.

  ---

  ### Derivation of the Cycle

  We apply **Minimal Liberalism (ML)** (each person is decisive over pairs differing only in their own action) and the **Pareto Principle (P)** (if all strictly prefer $x$ to $y$, society prefers $x$ to $y$).

  1.  **Leg 1 (Liberalism - A):** Consider pair $(a, n)$.
      *   *Difference:* Only A's action changes (B does not smoke in either). This is within A's personal sphere (bedroom privacy).
      *   *Preference:* A strictly prefers $a$ to $n$ (Payoff 5 vs 0).
      *   *Social Judgment:* **$a \mathrel{P_{soc}} n$**.

  2.  **Leg 2 (Liberalism - B):** Consider pair $(b, n)$.
      *   *Difference:* Only B's action changes (A does not smoke in either). This is within B's personal sphere.
      *   *Preference:* B strictly prefers $b$ to $n$ (Payoff 5 vs 0).
      *   *Social Judgment:* **$b \mathrel{P_{soc}} n$**.

  3.  **Leg 3 (Pareto):** Consider pair $(n, s)$.
      *   *Difference:* Both change actions.
      *   *Preference:* A prefers $n$ to $s$ (0 vs -1). B prefers $n$ to $s$ (0 vs -1). Both strictly prefer $n$.
      *   *Social Judgment:* **$n \mathrel{P_{soc}} s$**.

  4.  **Leg 4 (Liberalism - A):** Consider pair $(s, b)$.
      *   *Difference:* Only A's action changes (B smokes in both). This is within A's personal sphere.
      *   *Preference:* A strictly prefers $s$ to $b$ (Payoff -1 vs -4). Given B is smoking, A prefers to smoke too.
      *   *Social Judgment:* **$s \mathrel{P_{soc}} b$**.

  **The Cycle:**
  Combining Leg 2 ($b \mathrel{P_{soc}} n$), Leg 3 ($n \mathrel{P_{soc}} s$), and Leg 4 ($s \mathrel{P_{soc}} b$):
  $$ b \mathrel{P_{soc}} n \mathrel{P_{soc}} s \mathrel{P_{soc}} b $$
  Social preferences are intransitive.

  ---

  ### Diagnosis

  **The Load-Bearing Feature:**
  The conflict is driven by **interdependent utility functions (externalities)**, not meddlesomeness. Specifically, it relies on the *conditional* preference over one's own sphere (Leg 4: A prefers to smoke *given* B is smoking).

  **If Cross-Sphere Preferences Are Removed:**
  If we "scrub" the profile so that A's preference over their own action is independent of B's action (i.e., A gets +5 from smoking regardless of B), A would be indifferent between $s$ and $b$ (assuming the cost of own smoke is zero). If $s \sim b$, Liberalism does not force $s \mathrel{P_{soc}} b$. The chain breaks ($b \mathrel{P_{soc}} n \mathrel{P_{soc}} s \sim b$), and the cycle vanishes. Thus, the paradox survives the removal of *moralistic* preferences but collapses if *material externalities* are removed.

  ---

  ### Defense of Paretian Liberalism

  A defender has four escape routes, ranked by damage:

  1.  **Restrict the Domain of Rights (Harm Principle):** Argue that if an action in a "personal sphere" creates material externalities (smoke leakage), it exits the protected sphere.
      *   *Cost:* Significantly shrinks the scope of liberal rights in any interconnected environment (noise, smells, property values).
  2.  **Disallow Cross-Sphere Preferences in Rights Assignment:** Argue that A cannot be decisive on $(s, b)$ because A's preference depends on B's state.
      *   *Cost:* Violates the definition of Liberalism (decisiveness over *pairs* differing in own action, regardless of *why* they are preferred).
  3.  **Coasean Bargaining:** Assume A and B will contract to ban smoking ($n$), bypassing the social ordering.
      *   *Cost:* Assumes zero transaction costs and binding enforcement, which Sen's theorem explicitly abstracts away to test institutional logic.
  4.  **Accept Intransitivity:** Admit social preference need not be a complete ordering.
      *   *Cost:* Abandons the goal of a consistent social choice function.

  **Least Damaging:** Restricting the Domain of Rights (1) is the most philosophically consistent with Millian liberalism, but it concedes that "personal spheres" are porous, making the impossibility result a boundary-setting problem rather than a logical contradiction.

  ---

  ### Conclusion for Students

  This case shows the Liberal Paradox is not a quirk of prudishness but a structural tension between **negative rights** and **interdependent utilities**. You should tell your students that the paradox survives whenever rights protect actions that generate externalities, meaning the problem is not about *what* people prefer (morals vs. materials) but about the *impossibility of reconciling individual sovereignty with collective efficiency* in a connected world.
