      *(Refining the "Flip")*: The prompt asks for the single consideration that would make me rewrite it to say something I'd hate. That means: What is the dark truth? The dark truth might be that the public ceremony is *coercive*. Or that the private marriage was *transactional* (visa) and this is the attempt to wash it. I need to be careful not to imply the visa marriage was fake, but acknowledge the tension. The "Flip" note needs to be sharp.

