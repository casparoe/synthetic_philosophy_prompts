  2.  **Deconstruct the Philosophical Angle (Kavka's Toxin Puzzle):**

      *   *Standard Puzzle:* You get money *now* for intending to drink toxin *later*. But once you have the money, why drink it? If you know you won't drink it, can you truly intend it?
      *   *Wedding Situation:* They got the "money" (legal status/visa) 18 months ago. Now they are doing the "drinking" (vows/ceremony).
      *   *Speaker's Insight:* The payoff isn't a lump sum. It's staggered. The legal status was one tranche. The communal recognition is another tranche, unlocked *only* by the public performance.
      *   *Philosophical Counter-argument:* If the vows don't change legal status, are they "empty"? No, because speech acts (illocutionary force) depend on context and audience. The audience *completes* the act.
      *   *Strategy:* Don't explain the puzzle explicitly (too academic for the family, too obvious for the philosophers). Use the *structure* of the puzzle without the jargon. Focus on "Intention," "Action," and "Witness."

  3.  **Drafting the Toast - Voice & Tone:**

      *   *Voice:* Firefighter. Direct, observant, comfortable with silence and heat, values teamwork and showing up. Not flowery, but sincere.
