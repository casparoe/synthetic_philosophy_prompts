      *   *The Synthesis:* The courthouse was the plan. This is the fire. Or better: The courthouse was the contract. This is the performance that makes it real *for us*.
      *   *The Staggered Payoff:* Explicitly address the "reward" aspect. The legal safety was step one. The family's blessing is step two.
