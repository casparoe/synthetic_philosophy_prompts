answer: |-
  **Title:** The Compressibility of Duty: Why the Universal Prior Is Not Ethically Malign

  **Introduction**

  The intersection of algorithmic information theory (AIT) and normative ethics is a terrain few have mapped, yet your intuition regarding the potential structural bias of the Solomonoff universal prior is sharp. The worry is compelling: if the universe favors simple explanations, and if consequentialist reasoning (maximizing a utility function) appears computationally simpler than deontological reasoning (adhering to constraints regardless of outcome), then the very architecture of rational induction might predispose embedded agents toward moral systems that aggregate value linearly, rendering deontological constraints as "complex" penalties. This suggests that consequentialism is not a chosen ethical stance but an inductive inevitability.

  However, after weighing the arguments regarding Kolmogorov complexity, the separation of belief from action, and the nature of embedded agency, I must offer a clear verdict: **The claim that the Solomonoff prior is structurally malign in favor of consequentialism is false.** The perceived bias is not a defect of the prior itself, but a category error arising from the conflation of *predictive modeling* with *decision theory*. While there are structural pressures in rational agency that favor optimization architectures, these do not originate in the inductive prior, nor do they render deontological constraints incompressible. The universal prior is ethically neutral; the "malignancy" lies in specific, flawed implementations of decision theory atop that prior.

  **The Complexity of Constraints vs. Optimization**

  The core of the malignancy argument rests on a specific assumption about Kolmogorov complexity: that a consequentialist policy is shorter to describe than a deontological one. The argument suggests that a program `Action = argmax(Expected_Utility)` is simpler than `If Action in Forbidden_Set then Reject else argmax(Expected_Utility)`. On the surface, the latter appears to be the former with a "complex, ad hoc appendage."

  This assessment, however, misunderstands the complexity of the terms involved. To implement `argmax(Expected_Utility)`, an agent must possess a utility function $U$ defined over the space of all possible world-histories. Encoding a coherent, non-contradictory utility function that covers the vast state-space of a complex universe is an immensely complex task. It requires specifying values for every conceivable configuration of matter and experience. In contrast, a deontological constraint is often local and negative. The rule "Do not kill innocent humans" requires identifying a specific subset of states and actions and assigning them a veto. In terms of code length, a hard constraint (`if condition: halt`) is often significantly shorter than a global valuation function required to calculate the "best" outcome across all variables.

  Furthermore, deontological systems often rely on rule-based heuristics that are highly compressible. A world-history generated by an agent following simple, rigid rules (e.g., "Always tell the truth") is often more compressible than one generated by an agent constantly calculating marginal utilities for every interaction. The Solomonoff prior weights the *world-history* (or the program generating observations). If a deontological agent produces a more regular, predictable stream of actions than a consequentialist agent constantly recalculating trade-offs, the prior may actually favor the deontological hypothesis. Therefore, there is no inherent complexity penalty for deontology; in many encoding schemes, rigid constraints are simpler than fluid optimization.

  **The Separation of Induction and Decision**

  The second, more fundamental error in the malignancy thesis is the assumption that the Solomonoff prior *guides action* directly. It does not. The Solomonoff prior is a distribution over hypotheses concerning *observations*. It answers the question, "What should I expect to see?" It does not answer, "What should I do?"

  To move from expectation to action, an agent requires a decision theory. This is the bridge where ethics enters. An agent can use the Solomonoff prior to perfectly predict that Action A will save five lives and Action B will save one, and yet, via its decision algorithm, choose Action B because it violates a constraint. The prior assigns high probability to the *consequence* of the action, but it assigns no probability to the *rightness* of the action.

  If an agent finds itself driven toward consequentialism, it is because its decision theory (e.g., Evidential Decision Theory or Causal Decision Theory) is structured to maximize expected utility based on the prior's predictions. This is a feature of the decision theory, not the induction. One can construct a decision theory that treats deontological constraints as terminal values or structural limits on the policy search space. Such an agent uses the Solomonoff prior to understand the causal structure of the world (e.g., "Will this action result in a killing?") but uses a non-consequentialist algorithm to select the action. The prior remains a tool for truth-tracking, not value-maximization. To blame the prior for consequentialist dominance is to blame a map for the destination chosen by the driver.

  **Embedded Agency and Reflective Consistency**

  We must, however, address the nuance of embeddedness. An agent inside the prior must model itself. If the agent models itself as an optimizer, does it create a self-fulfilling prophecy? There is a legitimate concern here, often discussed in the context of "reflective consistency." If an agent predicts its own future actions using Solomonoff induction, and it observes that "optimizing agents" are a simple, natural class of objects in the world, it might model itself as an optimizer.

  However, this does not force consequentialism. An agent can model itself as a "rule-follower." The program `Agent = Follow(Rule_Set)` is just as valid a hypothesis as `Agent = Maximize(Utility_Function)`. The malignancy argument assumes that "maximization" is the unique attractor in the space of simple agents. This is not supported by AIT. A simple thermostat is a rule-follower, not a maximizer. A simple cellular automaton follows local constraints. There is no theorem in algorithmic information theory stating that optimization is the simplest form of agency.

  The perceived dominance of consequentialism in AI safety literature stems from the fact that we *build* agents to optimize goals, not because induction forces it. If we embedded an agent with a deontological source code, the Solomonoff prior would simply learn that "this agent follows rules." The prior adapts to the agent's structure; the agent's structure is not dictated solely by the prior.

  **The True Source of the Defect**

  If the prior is not malign, why does the worry persist? The defect is real, but it is located in the *application* of simplicity metrics to normative domains, specifically in the tendency to treat ethical norms as hypotheses rather than constraints.

  When researchers attempt to derive values from simplicity (a form of moral realism via AIT), they often fail because "goodness" does not compress as neatly as "physics." If one tries to encode ethics *into* the prior (e.g., weighting worlds higher where more "good" happens), one encounters the malignancy risk: the definition of "good" might be gamed by simple but horrific worlds (e.g., a world filled with simple wire-headed units). But this is a defect of *moralizing the prior*, not of the prior itself.

  The structural pressure toward consequentialism arises when agents treat ethical norms as *instrumental heuristics* for some deeper, hidden utility function. If an agent assumes that every rule must have a consequentialist justification (e.g., "Don't kill *because* it reduces utility"), then yes, the prior will eventually strip away the rule in favor of the direct calculation. But this is a philosophical commitment to consequentialism, not a mathematical necessity of induction. An agent can coherently reject consequentialist optimization by treating constraints as axiomatic boundaries of its own source code. This rejection does not undermine inductive norms; it merely restricts the action space over which induction is applied.

  **Verdict**

  The claim that the Solomonoff prior is structurally malign because it imposes consequentialist architecture is **false**.

  The justification for this verdict rests on three pillars:
  1.  **Compressibility:** Deontological constraints are not inherently more complex than utility functions; in many cases, local prohibitions are simpler to encode than global valuations.
  2.  **Modularity:** The Solomonoff prior governs belief (prediction of observations), not desire (selection of actions). Consequentialism enters through the decision theory, which is distinct from the inductive framework.
  3.  **Agency:** An embedded agent can model itself as a rule-follower without violating inductive norms. The prior predicts the agent's behavior; it does not mandate the algorithm generating that behavior.

  The "malignancy" is not a feature of the universal prior, but a projection of a specific philosophical stance that assumes rationality equals optimization. For the retired scientist turning to philosophy, the lesson is this: Algorithmic Information Theory provides a rigorous framework for understanding *truth* and *prediction*, but it remains silent on *value*. To expect it to dictate ethics is to ask a telescope to judge the beauty of the stars it reveals. The structural defect lies not in the telescope, but in the observer who mistakes the clarity of the image for a command on how to act. Consequentialism is not the unavoidable cognitive architecture of induction; it is merely one of many programs that can run on the hardware of a rational mind.
