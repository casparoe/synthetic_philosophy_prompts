answer: |-
  Riley is closer to being right overall because Sam fails to define a coherent ontological category for non-functional properties, though Sam correctly identifies that Riley's conclusion presupposes a functionalist framework.

  **Move 1:** Riley accurately captures Dennett's eliminativist strategy: if the traditional definition of qualia requires properties that are intrinsically private and ineffable, yet no behavioral or introspective difference exists, the concept lacks explanatory traction. However, Sam is technically correct that epistemic indistinguishability does not logically entail ontological identity, unless one already accepts verificationism or functionalism as a metaphysical premise.

  **Move 2:** Sam's inverted qualia drug is a standard philosophical intuition pump, but by conceding that the subject reports "everything looks the same" while claiming an intrinsic flip, he renders the property causally inert. This inadvertently strengthens Riley's position that such properties are epiphenomenal and thus violate principles of causal closure or explanatory relevance.

  **Move 3:** Riley scores a decisive point here by extending the inversion to all relational structures; if the functional role of pain, pleasure, and disgust remains identical while the "inner glow" swaps, the glow does no work. This supports the charge of incoherence by showing the property is exempt from any naturalistic calibration, making it indistinguishable from a fictional posit like an invisible dragon.

  **Move 4:** Sam correctly accuses Riley of begging the question by assuming a false dichotomy between functional roles and ghosts, but his timbre analogy fails. Timbre is objectively measurable via spectral analysis and correlates with behavioral discrimination, whereas Sam's proposed qualia are explicitly defined as lacking such structural discriminability, making the analogy disanalogous.

  **Move 5:** Riley wins this exchange by forcing the dilemma: if a property is "structurally anchored," it must be identifiable via that structure; if it is not identifiable, the anchor is metaphorical. Sam cannot maintain that a property is both anchored in physical structure and inaccessible to structural analysis without contradicting the definition of "anchored."

  **Missed Points:** Both parties overlook that Dennett targets the *traditional philosophical definition* of qualia (ineffable, intrinsic, private, directly apprehensible) rather than denying the existence of experience itself. Additionally, both ignore the possibility that phenomenal concepts might refer to physical states via a mode of presentation that is neither purely functional nor mysteriously non-physical, such as via neural correlates that are first-person accessible but third-person describable.

  **Overall Adjudication:** Riley is closer to being right because the burden of proof lies on positing non-functional properties, and Sam fails to meet it without collapsing into mystery or contradicting his own structural claims. While Sam successfully highlights that Riley's argument relies on functionalist assumptions, he does not provide a viable alternative metaphysics that avoids the incoherence charge Dennett raises.
