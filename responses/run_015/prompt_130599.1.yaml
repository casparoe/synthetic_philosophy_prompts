answer: |-
  # Seminar Handout: The PP/FEP Sorting Hat
  **Goal:** Stop arguing about who cited who. Start arguing about what you actually believe.
  **Instructions:** Follow the path. Be honest. If you hedge, you end up in "Methodological Hell" (Leaf 2).

  ---

  ### THE TREE

  **NODE 1: The Reality Check**
  Is predictive coding in the brain *literally* Bayesian inference (neurons calculating probabilities), or is it just a useful metaphor for describing behavior?
  *   **NO (It's a metaphor):** Go to **Node 1A**.
  *   **YES (It's literal):** Go to **NODE 2**.

  **NODE 1A: The Metaphor Split**
  If it's just a metaphor, does the brain still use internal representations (models), or is it directly coupling with the environment?
  *   **Representations:** → **Leaf 1: Representational Instrumentalist** (Classic Clark-ish PP).
  *   **No Representations:** → **Leaf 2: Enactive Instrumentalist** (Radical Enactivism).

  **NODE 2: The Boundary Claim**
  Do Markov Blankets describe real physical boundaries that carve nature at its joints (skin, membrane), or are they just modeling conveniences for us observers?
  *   **NO (Just math tools):** → **Leaf 3: Methodological Bayesian** (Believes in the coding, not the ontology).
  *   **YES (Real boundaries):** Go to **NODE 3**.

  **NODE 3: The Scope Claim**
  Does the Free Energy Principle apply *only* to metabolically bounded living systems, or to anything that maintains a steady state (thermostats, corporations, AI)?
  *   **ANYTHING (Universal):** Go to **Node 3A**.
  *   **ONLY LIFE:** Go to **NODE 4**.

  **NODE 3A: The Thermostat Test**
  If it applies to thermostats, does a thermostat have "beliefs" and "preferences" in the same sense a human does?
  *   **YES:** → **Leaf 4: Panpsychist FEP** (Everything minimizes free energy, everything has a mind).
  *   **NO:** → **Leaf 5: Formalist FEP** (Everything obeys the math, but only life has mentality).

  **NODE 4: The Dark Room Problem**
  Does Active Inference successfully explain why we don't just seek dark rooms (by valuing information/complexity), or is this a fatal flaw for applying FEP to cognition?
  *   **FATAL FLAW:** → **Leaf 6: Biological Skeptic** (FEP works for cells/homeostasis, but fails for minds).
  *   **SUCCESSFUL FIX:** Go to **NODE 5**.

  **NODE 5: The Epistemic Escrow**
  Can prediction errors be held in a social/institutional buffer ("epistemic escrow") without being immediately minimized, or does this violate the core imperative of FEP?
  *   **VIOLATES FEP:** → **Leaf 7: Social Breakaway** (FEP is too individualistic; need social theory).
  *   **WITHIN FEP:** Go to **NODE 6**.

  **NODE 6: The Location of Escape**
  If escrow is within FEP, is the machinery for holding that error located inside the skull, or does it require external vehicles (notebooks, institutions, other people)?
  *   **INSIDE:** → **Leaf 8: Conservative Active Inference**.
  *   **OUTSIDE (Extended):** → **Leaf 9: Radical Extended FEP**.

  *(Wait, that's 9 leaves. Let's merge Leaf 8 and 3? No, let's merge Leaf 4 and 5. Nobody really cares about the thermostat belief distinction in practice.)*

  **[REVISION FOR HANDOUT]** Let's collapse Node 3A. Whether thermostats have "beliefs" is mostly semantic. Let's make that one leaf to keep us at 8.

  **REVISED NODE 3:** ...Anything vs Only Life?
  *   **ANYTHING:** → **Leaf 4: Universal Physicist** (FEP is a law of physics, mentality is secondary).
  *   **ONLY LIFE:** Go to **NODE 4**.

  *(Okay, now we have 8 Leaves total.)*

  ---

  ### THE LEAVES (Where you land)

  **Leaf 1: Representational Instrumentalist**
  *   **Commitment:** Brains act *as if* Bayesian, but don't literally compute probabilities. Representations are real tools.
  *   **Vibe:** "I like the psychology, not the physics."
  *   **Status:** Occupied (Classic PP).

  **Leaf 2: Enactive Instrumentalist**
  *   **Commitment:** Brains don't compute probabilities and don't hold representations. They just regulate coupling.
  *   **Vibe:** "Bayes is a ghost in the machine."
  *   **Status:** Occupied (Radical Enactivism).

  **Leaf 3: Methodological Bayesian**
  *   **Commitment:** Neurons do the math, but Markov Blankets are just for us modelers. No ontological weight on the boundaries.
  *   **Vibe:** "Shut up and calculate."
  *   **Status:** Occupied (Common in comp neuro).
  *   **Flag:** Hard to distinguish from Leaf 1 empirically.

  **Leaf 4: Universal Physicist**
  *   **Commitment:** FEP applies to everything. Blankets are real. Scope is universal.
  *   **Vibe:** "It's the theory of everything."
  *   **Status:** Occupied (Hardline Friston).
  *   **Flag:** Risks panpsychism whether you want it or not.

  **Leaf 5: Biological Skeptic**
  *   **Commitment:** Blankets are real, but only for life. Dark Room problem kills the cognitive application.
  *   **Vibe:** "Good for cells, bad for minds."
  *   **Status:** **Mostly Unoccupied.** Ugly position. Why accept the ontology but reject the main application? Usually a transition state before quitting FEP.

  **Leaf 6: Social Breakaway**
  *   **Commitment:** FEP works for individuals, but "Epistemic Escrow" (social buffering) breaks the model. Needs new framework.
  *   **Vibe:** "FEP is too solipsistic."
  *   **Status:** Emerging (Critical FEP).

  **Leaf 7: Conservative Active Inference**
  *   **Commitment:** Escrow is real and FEP-compliant, but happens internally (simulation, memory).
  *   **Vibe:** "The brain is a social simulator."
  *   **Status:** Occupied (Standard Active Inference).

  **Leaf 8: Radical Extended FEP**
  *   **Commitment:** Escrow requires external vehicles. The Markov Blanket stretches over tools/people.
  *   **Vibe:** "The skin is not the boundary."
  *   **Status:** Occupied (Extended Cognition + FEP).

  ---

  ### NOTES & FLAGS

  **Unoccupied Combos (The "Don't Bother" Zone)**
  *   **Blankets = Real + Scope = Thermostats Only:** Incoherent. If blankets are real physical boundaries, life has them too. Nobody argues thermostats are alive but humans aren't.
  *   **Dark Room = Fail + FEP = True for Cognition:** Contradictory. If you can't solve the Dark Room problem, you can't claim FEP explains cognition. This is Leaf 5 (Skeptic).
  *   **Escrow = Break + FEP = Universal:** Ugly. If social buffering breaks FEP, and humans are social, FEP can't be universal for humans. You'd have to argue humans aren't subject to FEP when together. Very messy.

  **Indistinguishable Pairs**
  *   **Leaf 1 (Instrumentalist) vs. Leaf 3 (Methodological):** Both deny the ontology of Blankets. The only diff is whether neurons *literally* do Bayes. Empirically? Almost impossible to tell apart without invasive neuro physics.
  *   **Leaf 4 (Universal) vs. Leaf 7 (Conservative):** If the Universalist says thermostats don't have *conscious* beliefs, they look a lot like the Conservative who just thinks biology is special. The distinction collapses unless you commit to panpsychism.

  **The "Epistemic Escrow" Twist**
  This is the new fault line. Traditional FEP assumes error minimization is immediate/continuous. If institutions allow us to *delay* that minimization (e.g., peer review, bureaucracy), does the math still hold?
  *   If you say **Yes (Leaf 7/8)**: You need to explain how "waiting" minimizes free energy. (Argument: It reduces long-term surprise).
  *   If you say **No (Leaf 6)**: You're arguing FEP is fundamentally individualistic and can't handle institutional time-scales.

  **Typo check:** hope i didnt miss any branches. if you end up in Leaf 5, you're probably lonely.
