prompt: |-
  I am a clinical educator at an NHS ambulance trust, responsible for training the non-clinical call handlers who triage 999 calls. A handler has roughly ninety seconds in which to gather what a caller tells them and to decide, among other things, how much weight that account should bear: whether reported chest pain is being minimised, whether a fall was a fall, whether someone is safe to leave at home. That weighting is recorded as a single code on the patient's record and follows them through the rest of the system. From next quarter the triage software will also attach an automatically generated reliability summary to every call, derived from features of the caller's speech and of the call itself, and handlers will be expected to take it into account when they set the code.

  Please write a decision procedure my handlers can actually run, in the order the questions arise, for deciding whether a low weighting of a caller's account — their own or the summary's — is tracking the reliability of what was said or is tracking something about who said it: accent, age, sex, class, distress, intoxication, or English as a second language. It must say what counts as a sufficient answer to each question, at what point the procedure stops and directs the handler to raise rather than lower the weighting, when the summary should be disregarded, and what exactly should go into the record when the procedure says the judgement is suspect. It should be usable by someone with no training in the relevant philosophy, say explicitly which part of the distinction philosophers draw between a credibility deficit caused by prejudice about the speaker and one caused by a gap in the concepts available for describing what has happened to you can survive into a ninety-second call and which cannot, and be honest about which steps are judgement wearing procedural clothing. Constraints: handlers work to scripted protocols and any change to a response category has to be countersigned by a clinician; I have about two minutes of a handler's attention during a call and ten minutes in debrief afterwards.

  Then run it on three calls: an eighty-two-year-old woman with a quiet voice and a strong regional accent describing abdominal pain, logged as a poor historian; a fluent thirty-four-year-old man who gives a textbook account of cardiac symptoms he has evidently read about; and a caller who reports something no triage category fits and can only say that it is not confusion. I would like at least one of these to come out in a way I will not like and will have to defend to the trust's clinical lead. Finally, tell me what the procedure cannot do and how it is most likely to be misused in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Clinical Educator at an NHS Ambulance Trust.
      *   **Audience:** Non-clinical 999 Call Handlers (triage).
      *   **Task:** Create a decision procedure to distinguish between *legitimate reliability concerns* (epistemic gaps, inconsistency) and *prejudicial credibility deficits* (bias against accent, age, sex, class, distress, intoxication, ESL).
      *   **Context:** 90-second triage window. New software adds an automated "reliability summary" based on speech features. Handlers must weigh the caller's account (recorded as a code).
      *   **Constraints:**
          *   Must be usable by someone with no philosophy training.
          *   Must fit within ~2 minutes of attention during a call + 10 minutes debrief.
          *   Handlers work to scripted protocols (cannot change response categories without clinician countersignature).
          *   Must specify when to stop, when to raise weighting, when to disregard the summary, and what to record.
          *   Must explicitly address the philosophical distinction (prejudice vs. conceptual gap) in a practical way.
          *   Must be honest about "judgement wearing procedural clothing."
          *   Must run the procedure on three specific cases (one of which must be uncomfortable/defendable).
          *   Must explain limitations and potential misuse.

  2.  **Deconstruct the Philosophical Core:**

      *   The prompt alludes to *Epistemic Injustice* (Miranda Fricker).
      *   *Testimonial Injustice:* Prejudice causes a hearer to give less credibility to a speaker than they deserve (e.g., bias against accent).
      *   *Hermeneutical Injustice:* A gap in shared concepts makes it hard for the speaker to make sense of their experience (e.g., "it's not confusion" but no category fits).
      *   *Constraint:* Handlers have 90 seconds. They cannot do deep philosophy. The procedure must be heuristic, not theoretical.
      *   *Distinction to survive:* "Is the problem *in the story* (inconsistency, physiological impossibility) or *in the teller* (who they are)?" vs. "Is the problem *in our toolkit* (no category fits)?"
      *   *Distinction to discard:* Deep analysis of structural power dynamics.

  3.  **Drafting the Decision Procedure (The "Reliability Check"):**

      *   *Goal:* A quick flowchart/checklist.
      *   *Structure:* Needs to be sequential.
      *   *Timing:* Must be doable in the 90-second window or immediately post-call during the coding phase.
      *   *Key Questions:*
          1.  Is the inconsistency internal to the account or external to the speaker?
          2.  Does the software flag match observable facts?
          3.  Is there a category fit?
          4.  Am I reacting to *how* it's said or *what* is said?
      *   *Action:* When to override the software, when to escalate.
      *   *Recording:* Specific text strings for the log.

      *Refining the "Philosophy" bit:* I need to translate "Hermeneutical Injustice" into "Protocol Gap." I need to translate "Testimonial Injustice" into "Speaker Feature Bias."
      *Constraint Check:* The prompt asks to say *explicitly* which part of the distinction survives.
      *Survivor:* The gap between *experience* and *protocol categories* (Hermeneutical).
      *Casualty:* The deep structural analysis of *why* the prejudice exists (Testimonial nuance). We can only check for *presence* of bias markers, not root causes.

      *Honesty Clause:* I need to admit that "Is this my bias?" is a question that often gets a "No" from a biased person. The procedure must force external verification (clinician countersignature) rather than relying solely on introspection.

  4.  **Developing the Three Case Studies:**

      *   *Case 1: 82yo woman, quiet, accent, abdominal pain.*
          *   Risk: Ageism + Accent bias.
          *   Software: Likely flags "low confidence" due to quietness/accent.
          *   Outcome: Should probably *raise* weighting or flag bias.
      *   *Case 2: 34yo man, fluent, textbook cardiac.*
          *   Risk: Over-credibility (Halo effect) vs. Malingering/Health Anxiety.
          *   Software: Likely flags "high reliability."
          *   Outcome: Needs scrutiny. Is he *too* perfect?
      *   *Case 3: "Not confusion," no category fits.*
          *   Risk: Hermeneutical injustice.
          *   Outcome: This is the one the user "won't like." Why? Because the procedure might force a "Low Reliability" code because the *system* can't process it, even if the *caller* is reliable. Or, it forces a clinician override which slows things down. Let's make it the latter: The procedure demands escalation, which costs time/resources, which the Trust might hate. Or, more subtly, the procedure forces the handler to admit the *system* is at fault, which is politically difficult.
          *   *Decision:* Let's make Case 3 the uncomfortable one. The procedure dictates that if no category fits, you cannot code "Unreliable Historian." You must code "Clinical Uncertainty" and escalate. This challenges the efficiency metric.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the pressure and the tool.
      *   **The Procedure (RAPID-C):** Reliability, Accent/Feature, Protocol, Internal Consistency, Discrepancy, Countersign.
      *   **Philosophical Translation:** Explicitly state what we are keeping (Concept Gap) and dropping (Structural Prejudice analysis).
      *   **The "Judgement in Clothing" Warning:** Be honest that checking one's own bias is hard.
      *   **Case Runs:**
          *   Case 1: Passes (Bias detected, weighting raised).
          *   Case 2: Passes (Caution advised, verify symptoms).
          *   Case 3: The "Uncomfortable" one. The procedure says "Do not code unreliable." It forces a pathway that might be operationally painful.
      *   **Limitations & Misuse:** Gaming the system, box-ticking, automation bias.

  6.  **Refining the "Uncomfortable" Case:**

      *   The prompt asks for *one* outcome I (the Educator) will not like and have to defend to the Clinical Lead.
      *   If Case 3 results in "Escalate to Clinician," the Clinical Lead might say "That clogs the line."
      *   *Better angle:* The procedure might conclude that for Case 3, the *software summary* must be disregarded, but the *handler* still has to assign a code. If the code options are binary (Reliable/Unreliable), and the truth is "System Failure," the handler is forced to choose "Reliable" but add a note that breaks the data model.
      *   *Best angle:* The procedure identifies that the *caller* is reliable, but the *triage system* is hermeneutically unjust. The instruction is to code them as "Reliable" but select a "Non-Specific" category. The Clinical Lead will hate this because "Non-Specific" categories often lead to lower priority dispatches, potentially risking the patient. The procedure protects the *epistemic dignity* of the caller but potentially compromises *clinical risk management*. That is a genuine ethical tension I have to defend.
      *   *Wait, let's look closer:* "I would like at least one of these to come out in a way I will not like." As the Educator, I want safety. If the procedure says "Trust the caller even if it doesn't fit," that sends an ambulance to a non-category. The Clinical Lead wants protocol adherence. I will have to defend sending resources based on a "vibe" that the procedure validated as "not bias."
      *   *Actually, the strongest tension:* The procedure might dictate that in Case 3, you *cannot* mark them as a "Poor Historian." You must mark them as "Reliable, Clinical Mismatch." The Clinical Lead will argue this corrupts the data. I have to defend the integrity of the record over the cleanliness of the data.

  7.  **Final Polish of the Procedure:**

      *   Keep it punchy.
      *   Ensure the "2-minute attention" constraint is met (bullet points, bold text).
      *   Ensure the "10-minute debrief" is utilized for the hard cases.
      *   Make sure the "Philosophy" section is clear but brief.

  8.  **Self-Correction/Review during drafting:**

      *   *Did I address the software?* Yes, need to specify when to ignore the AI summary.
      *   *Did I address the countersignature?* Yes, crucial for overriding the "Unreliable" code.
      *   *Is the philosophy clear?* Fricker's distinction needs to be simplified to "Bias against person" vs "Gap in our words."
      *   *Is the "Judgement in Clothing" honest?* Yes, acknowledge that the final check is still human intuition.

  9.  **Finalizing the Output Structure:**
      1.  Protocol Title & Purpose.
      2.  The Decision Procedure (The "Bias & Gap Check").
      3.  The Philosophical Translation (What survives, what dies).
      4.  The "Judgement in Clothing" Warning.
      5.  Case Studies (1, 2, 3).
      6.  Limitations & Misuse.

  *(Self-Correction on Case 3)*: Let's make Case 3 the one where the procedure forces the handler to *disregard* the software and *escalate*, which the Clinical Lead will claim is an inefficient use of clinical time for a "vague" call. I (Educator) have to defend that "vague" does not mean "unreliable."

  *(Refining the "Uncomfortable" aspect)*: The prompt says "one of these to come out in a way I will not like." As an educator, I likely prioritize safety. If the procedure results in *not* sending help, I won't like it. If it results in sending help against protocol, I might like it, but the Lead won't.
  *Wait, re-reading:* "I would like at least one of these to come out in a way I will not like and will have to defend to the trust's clinical lead."
  Okay, *I* (the Educator/User of the prompt) am the one who has to defend it. So the outcome must be controversial within the Trust.
  *Scenario:* Case 3 (The "Not Confusion" caller). The procedure says: "If no category fits, do not code 'Unreliable'. Code 'Reliable - Unmapped'." This requires a clinician countersignature. The Clinical Lead will say "This creates a bottleneck." I have to defend that bottlenecks are better than epistemic injustice.
  *Alternative:* The procedure fails to catch the bias in Case 1, and I have to defend why an 82-year-old was marked unreliable. No, I want the procedure to work.
  *Best fit:* The procedure correctly identifies Case 3 as a *system* failure, not a *caller* failure. It mandates a specific log entry that flags the triage software as deficient. The Clinical Lead will hate having the software's limitations exposed in the patient record. I have to defend transparency over brand protection.

  *Let's go with the "Hermeneutical Gap" outcome.* The procedure forces the handler to admit the *protocol* is the problem. The Clinical Lead wants the *caller* to be the problem (easier to manage). I have to defend the procedure that blames the protocol.

  *Wait, one more check:* "which part of the distinction philosophers draw... can survive into a ninety-second call and which cannot."
  *Survive:* The distinction between "I don't believe *you*" (Prejudice) and "I don't understand *this*" (Conceptual Gap).
  *Cannot:* The distinction between "Identity Prejudice" and "Individual Idiosyncrasy." We can't know the handler's heart in 90 seconds.

  *Okay, ready to write.*
answer: |-
  # The Reliability & Bias Check (RBC-90)

  **Purpose:** To prevent the automatic downgrading of a caller's credibility due to who they are (bias) versus what they are saying (clinical inconsistency), and to identify when our protocols lack the words for their experience.
  **Time:** 90 seconds (during call coding) + 10 minutes (debrief if escalated).
  **Authority:** Overrides automated software summary. Requires clinician countersignature for specific overrides.

  ### Part 1: The Decision Procedure

  Run these four questions in order. If you answer **YES** to any question, stop and follow the **ACTION**.

  **Q1. The Feature Check:**
  Is the reason I am doubting this account linked to *how* they sound (accent, volume, age, distress, ESL) rather than *what* they say (contradictions, physiological impossibility)?
  *   *Sufficient Answer:* "If they spoke with a different accent/voice, would I believe this exact same story?"
  *   **ACTION (YES):** Disregard the automated reliability summary. **Raise** the weighting code by one level. Log: *"Bias Check: Speaker features influenced initial doubt. Account treated as reliable."* **Stop.**

  **Q2. The Script Fit:**
  Does the caller's description match a triage category, or are they describing something the script has no name for?
  *   *Sufficient Answer:* "I am trying to force their words into a box that doesn't fit."
  *   **ACTION (YES):** Do **not** code as 'Unreliable Historian'. Code as 'Reliable - Unmapped'. **Escalate** to Clinician for countersignature. Log: *"Hermeneutical Gap: Caller reliable, protocol insufficient."* **Stop.**

  **Q3. The Internal Consistency:**
  Does the caller contradict themselves on *medical facts* (e.g., "I'm alone" vs "My wife is here") or *timeline* (e.g., "Just happened" vs "Last week")?
  *   *Sufficient Answer:* "There are two mutually exclusive facts in the account."
  *   **ACTION (YES):** You may **lower** the weighting. Log specific contradiction. **Stop.**

  **Q4. The Intuition Check:**
  Am I feeling 'sure' this is unreliable because the story feels 'too smooth' (textbook) or 'too messy' (emotional)?
  *   *Sufficient Answer:* "My gut says 'fake' but I can't point to a lie."
  *   **ACTION (YES):** **Raise** the weighting. Assume distress or health anxiety, not deception. Log: *"Intuition Check: No objective evidence of deception."* **Stop.**

  ---

  ### Part 2: The Philosophical Translation (For Educator Use)

  You asked which part of the philosophical distinction survives the 90-second window.

  **What Survives:** The distinction between **Testimonial Injustice** (Q1) and **Hermeneutical Injustice** (Q2).
  *   *In Practice:* We can distinguish between "I don't trust *you*" (Prejudice) and "I don't have a category for *this*" (Conceptual Gap). The procedure forces the handler to separate the speaker's identity from the content's fit.

  **What Cannot Survive:** The distinction between **Structural Prejudice** and **Individual Bias**.
  *   *In Practice:* We cannot know in 90 seconds if the handler is acting on societal classism or a personal bad experience with a similar voice. The procedure treats all "speaker feature" doubts as suspect equally. We sacrifice the *root cause* analysis for the sake of the *intervention*.

  **The "Judgement Wearing Procedural Clothing" Warning:**
  Q4 (The Intuition Check) is the weakest link. Asking a handler to introspect on their own bias in 90 seconds is asking them to be a philosopher-king while under fire. Most people believe they are unbiased. This step relies on the handler's honesty. It is proceduralised intuition, not objective measurement. It is a speedbump, not a barrier.

  ---

  ### Part 3: Case Runs

  #### Case 1: The 82-Year-Old Woman
  *   **Profile:** Quiet voice, strong regional accent, abdominal pain. Logged by software as 'Low Reliability'.
  *   **Run:**
      *   **Q1 (Feature Check):** Handler notes the software flagged "low confidence" due to audio clarity and accent. Handler asks: "If she spoke RP English loudly, would I doubt the pain?" Answer: No.
      *   **Action:** **YES.** Disregard software summary. Raise weighting to 'Reliable'.
      *   **Log:** *"Bias Check: Speaker features influenced initial doubt. Account treated as reliable."*
      *   **Outcome:** Ambulance dispatched based on pain report.
      *   **Verdict:** Procedure works as intended. Protects vulnerable demographic.

  #### Case 2: The Textbook Cardiac Caller
  *   **Profile:** 34M, fluent, lists exact cardiac symptoms ("radiating to jaw", "diaphoresis").
  *   **Run:**
      *   **Q1 (Feature Check):** No accent/distress issues.
      *   **Q2 (Script Fit):** Fits Cardiac Protocol perfectly.
      *   **Q3 (Internal Consistency):** No contradictions.
      *   **Q4 (Intuition Check):** Handler feels the account is "too perfect."
      *   **Action:** **YES.** Raise weighting (assume health anxiety or genuine research, not deception). Do not mark as 'Unreliable'.
      *   **Log:** *"Intuition Check: No objective evidence of deception."*
      *   **Outcome:** Treated as potential cardiac, but clinician alerted to potential anxiety component on arrival.
      *   **Verdict:** Prevents dismissal of a genuine crisis due to "malingering" bias.

  #### Case 3: The "Not Confusion" Caller
  *   **Profile:** Caller reports a sensation/state that no triage category fits. Explicitly states: "It is not confusion." Software flags 'Incoherent'.
  *   **Run:**
      *   **Q1 (Feature Check):** No accent issues.
      *   **Q2 (Script Fit):** Handler tries to fit "Not confusion" into 'Neurological', 'Psychiatric', 'Medical'. None fit. Caller is coherent but unmappable.
      *   **Action:** **YES.** This is a **Hermeneutical Gap**.
      *   **Instruction:** Do **not** code as 'Unreliable Historian'. Code as 'Reliable - Unmapped'. **Escalate** to Clinician for countersignature.
      *   **Log:** *"Hermeneutical Gap: Caller reliable, protocol insufficient."*
      *   **Outcome:** The call is held for a clinician. Dispatch is delayed by 4 minutes while waiting for countersignature. The patient record now contains a permanent flag that the Trust's triage software failed to categorize a valid medical experience.
      *   **Verdict:** **This is the outcome you will not like.**
      *   **Why you must defend it:** The Clinical Lead will argue that holding a call for 4 minutes breaches response time targets and that "Unmapped" is a waste resource category. They will want you to code the caller as 'Unreliable/Confused' to clear the queue.
      *   **Your Defence:** "If we code them 'Unreliable', we are gaslighting a patient to save 4 minutes. The procedure identifies that the *system* is the problem, not the *caller*. We must absorb the operational delay to maintain epistemic integrity. If the data shows 'Unmapped' is frequent, we fix the protocol, we don't silence the patient."

  ---

  ### Part 4: Limitations and Misuse

  **What the Procedure Cannot Do:**
  1.  **It cannot cure Automation Bias:** Handlers are told the software summary is "automatically generated." They will treat it as objective truth. The instruction to "Disregard" requires more cognitive effort than "Accept." In high-pressure shifts, they will accept the software.
  2.  **It cannot measure Distress vs. Intoxication:** A slurred speech flag from the software could be stroke, drink, or tears. The procedure asks the handler to tell the difference in 90 seconds. Often, they cannot.
  3.  **It cannot fix the "Countersignature Bottleneck":** In Case 3, if no clinician is available to countersign the 'Unmapped' code, the handler is stuck. The procedure offers no "fail-safe" for when the safety net is missing.

  **How It Will Be Misused:**
  1.  **The "Box-Ticking" Exemption:** Handlers will learn that answering "No" to Q1 allows them to downgrade credibility without logging the specific bias. They will say, "It wasn't the accent, it was the inconsistency," even when it was the accent, to avoid the extra logging work.
  2.  **Weaponised Escalation:** A handler who dislikes a caller (for legitimate or illegitimate reasons) may use Q2 (Script Fit) to force a clinician review on a difficult patient, effectively passing the "problem" up the chain under the guise of "Hermeneutical Gap."
  3.  **Data Corruption:** If Case 3 becomes common, the Clinical Lead may pressure you to reclassify 'Reliable - Unmapped' as a subset of 'Confused' to clean the dataset. The procedure protects the record, but management may overwrite the procedure to protect the metrics.

  **Final Note for the Educator:**
  You are introducing a friction point into a system designed for flow. The RBC-90 prioritizes *justice* over *efficiency*. In an NHS Trust, efficiency is the currency. You will be asked to prove that the delays caused by Case 3 do not harm other patients. You cannot prove that. You can only argue that the harm of silence is worse than the harm of delay. That is a moral argument, not a clinical one. Be prepared for that.
