answer: |-
  Here is a five-step triage protocol that treats feedback as data rather than truth, designed to run in twenty minutes without requiring you to be the arbiter of art.

  ### The Hume Translation
  You asked which parts of Hume survive and which get dropped. We're dropping the idea that there is a "correct" aesthetic judgment; you're not judging the book, you're judging the *utility of the feedback*. We're keeping **Delicacy** (can they detect specific elements?), **Practice** (have they been right before?), and **Comparison** (do they know the genre?). We're dropping **Freedom from Prejudice** because everyone has偏见 (bias); instead, we check for **Genre Alignment**. We're dropping the **Wine Key** story as a truth-test; finding the key doesn't mean the readers were right, it just means the text has artifacts. We use it only to check if the readers are reading the same book.

  ### The Procedure (20 Minutes Max)

  **Step 1: The Citation Check (3 Minutes)**
  *Goal: Filter mood from evidence.*
  Look at the notes from both readers. Can each reader point to a specific page, line, or scene that caused their reaction?
  *   **Pass:** "Page 12, the tense shift broke the timeline" or "Chapter 2, the narrator's cruelty felt unearned."
  *   **Fail:** "It didn't work for me" or "I couldn't put it down."
  *   **The Fix for Your Bias:** If a reader cites a spot, you have 60 seconds to find it in the manuscript. If you can't find it in 60 seconds, treat the citation as void. This stops you from hunting until you find evidence that supports your gut.
  *   **Verdict:** If one reader passes and the other fails, back the one who passed. If both fail, go to Step 3. If both pass, go to Step 2.

  **Step 2: The Genre Contract (3 Minutes)**
  *Goal: Filter borrowed standards.*
  Ask: Is the complaint about the book failing to be itself, or failing to be what the reader wants?
  *   **Test:** Look at the book's intent (literary, thriller, comic). If a reader complains a horror novel isn't "cozy," they violated the contract. If they complain the horror isn't "scary," they upheld it.
  *   **Verdict:** If one reader violated the contract and the other upheld it, back the one who upheld it. If both upheld it (or both violated it), go to Step 3.

  **Step 3: The Track Record Weight (5 Minutes)**
  *Goal: Apply practice and comparison.*
  Assign a weight to each reader based on history, not articulacy.
  *   **The Scary Good Editor:** Her global verdicts ("This doesn't work") count as specific citations. She is exempt from Step 1. If she disagrees with a regular member, her view carries 2x weight.
  *   **The Outlier Writer:** His dissent on a popular book triggers a "Pause," not a veto. If he loves what everyone hates, flag the manuscript for a second look, but don't override the group unless Step 1 and 2 favor him.
  *   **Regular Members:** Equal weight.
  *   **Verdict:** Calculate the weighted score. If one side is heavier, back them. If it's a tie, go to Step 4.

  **Step 4: The Consensus Gap (4 Minutes)**
  *Goal: Check for outliers.*
  Is this a 1-vs-1 fight, or is one reader representing a silent majority?
  *   **Test:** Quickly scan the other six members' notes (even if they didn't speak up yet, or recall past comments). If five people liked the prose and one hated it, the "hate" is an outlier unless Step 1 gave them specific citations the others missed.
  *   **Verdict:** If the disagreement is isolated to two people, treat it as a tie. If one view is shared by 3+ others, back the consensus. If still tied, go to Step 5.

  **Step 5: The Values Handoff (5 Minutes)**
  *Goal: Admit uncertainty.*
  If you are here, the text supports both readings, the standards are valid, and the readers are equally trusted.
  *   **Action:** Tell the writer: "Reader A wants X, Reader B wants Y. Both are technically valid. This is not a repair job; it's a vision choice. Which book do you want to write?"
  *   **Verdict:** No verdict. You hand the agency back.

  ### Special Rules for Your Group
  *   **The Editor:** Do not ask her to justify "It feels off." Her "feel" is data. If she says "Chapter 2 fails," you treat that as "Chapter 2 fails" unless the Outlier strongly disagrees.
  *   **The Outlier:** Do not let him bully the group with unique taste, but do not ignore him. If he is the *only* one who sees a flaw in a beloved manuscript, force Step 1 on everyone else. Often, the Outlier sees a structural crack everyone else glossed over because they were having fun.

  ### Test Cases

  **Case 1: The Debut Literary Novel (Overruling the Moderator)**
  *   **Scenario:** You love the manuscript. Reader A (Regular) says "The narrator is unbearable and I quit at Chapter 3." Reader B (Regular) says "Best voice I've read in years, couldn't put it down."
  *   **Your Gut:** Back Reader B (and your own taste).
  *   **The Procedure:**
      *   *Step 1:* Reader A cites specific passages on pages 14, 22, and 30 where the narrator lies to the reader. You find them in 60 seconds. Reader B offers only global praise ("Great voice!").
      *   *Step 2:* Both uphold the literary contract.
      *   *Step 3:* Equal track records.
      *   *Result:* **Back Reader A.** Even though you love the book, Reader A provided actionable data (Delicacy), and Reader B provided only mood. You tell the writer: "The voice is compelling, but Reader A found specific moments where the lying breaks trust. You need to decide if that break is intentional."
      *   *Why this works:* It forces you to prioritize repairable faults over vague praise, even when the praise matches your own feeling.

  **Case 2: The Genre Manuscript (Idea vs. Prose)**
  *   **Scenario:** A sci-fi thriller. Reader A says "The concept is genius, plot twists land." Reader B says "The prose is clunky, I stumbled on every page."
  *   **The Procedure:**
      *   *Step 1:* Reader B cites sentence-level issues on five pages. Reader A cites plot points. Both pass.
      *   *Step 2:* Contract check. A genre thriller must be readable. If the prose blocks the reading, the contract is broken regardless of the idea.
      *   *Step 3:* Equal weight.
      *   *Result:* **Back Reader B.** In genre fiction, readability is the baseline contract. You tell the writer: "The engine is great, but the wheels are falling off. Fix the prose so the idea can shine."
      *   *Why this works:* It prioritizes the *medium* over the *message* when the medium prevents access.

  **Case 3: The Finished Question (Values Handoff)**
  *   **Scenario:** Reader A says "This is done, publish it." Reader B says "This is a first draft, the ending is missing."
  *   **The Procedure:**
      *   *Step 1:* Reader B cites the unresolved subplot on page 200. Reader A says "It's ambiguous, that's the point." Both pass Step 1 (one cites text, one cites intent).
      *   *Step 2:* Contract check. Is it a literary novel (ambiguity okay) or a mystery (resolution required)? It's literary. Both uphold contract.
      *   *Step 3:* Editor hasn't read it yet. Outlier is silent.
      *   *Step 4:* Rest of group is split 3/3.
      *   *Result:* **Values Handoff.** You tell the writer: "Reader B sees a hole; Reader A sees a feature. No amount of editing fixes this. You have to decide if the book is a puzzle or a portrait."
      *   *Why this works:* It saves you from guessing the author's intent and stops the group from fighting over aesthetics.

  ### What This Procedure Cannot Do
  1.  **It cannot predict success.** Backing the "right" reader doesn't mean the book will sell or win prizes. It only means the revision will be coherent.
  2.  **It cannot fix bad writers.** If the writer lacks the skill to execute the feedback, the procedure just clarifies why the book is failing.
  3.  **It cannot protect feelings.** Even if you follow this perfectly, one reader might still feel unheard. You can mitigate it by praising their specificity, but you can't guarantee they stay in the group.
  4.  **It cannot replace the Editor.** If the Scary Good Editor is present, skip to Step 3 and let her talk. This procedure is for when she isn't there or when she's unsure.
  5.  **It cannot judge soul.** It measures craft, consistency, and contract. If a book has a beating heart but broken ribs, this procedure will tell you to fix the ribs, but it can't measure the heart.
