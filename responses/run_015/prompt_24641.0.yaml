answer: |-
  You have diagnosed the problem correctly. Arguments about luck egalitarianism (LE) often stall because one party is testing the theory against its *internal logic* (consistency with the luck/choice principle) while the other is testing it against *external constraints* (human decency, social stability, or basic needs). Your friend is defending the internal logic; you are attacking the external implications. Neither of you is wrong, but you are using different specification sheets.

  To resolve this, we need a formal specification of adequacy. Below is the blueprint for what a luck-egalitarian account must deliver to count as a viable foundational theory of justice.

  ### Part I: The Specification of Adequacy

  A luck-egalitarian theory is adequate only if it satisfies the following five requirements. I have flagged which are **Genuine Desiderata** (internal to the logic of LE) and which are often **Smuggled Prejudices** (external demands from competing frameworks).

  #### 1. The Principled Distinction Requirement
  *   **The Demand:** The theory must provide a non-arbitrary, actionable criterion for distinguishing *brute luck* (circumstances for which the agent is not responsible) from *option luck* (outcomes resulting from calculated risks or genuine choices). It cannot simply assert the distinction; it must define the boundary conditions.
  *   **Motivating Case:** *The Genetic Gamble.* Person A is born with a genetic predisposition to heart disease (brute luck). Person B smokes heavily knowing the risks (option luck). Both end up with heart disease. The theory must explain why we compensate A but not B, without relying on a metaphysical notion of "free will" that is impossible to verify in practice.
  *   **Status:** **Genuine Desideratum.** Without this, the theory has no engine.
  *   **Smuggled Prejudice Warning:** Libertarians often smuggle in a definition of "choice" that is too thin (any voluntary act counts), making almost all luck "option luck." Hard egalitarians smuggle in a definition that is too thick (social conditioning negates all choice), making almost all luck "brute luck."

  #### 2. The Non-Trivial Agency Requirement
  *   **The Demand:** The account of responsibility must be neither trivially true nor trivially false. It must acknowledge that agents have some control over their lives (avoiding hard determinism) without assuming agents have god-like control over their circumstances (avoiding libertarianism).
  *   **Motivating Case:** *The Expensive Taste.* Person C cultivates a taste for rare wine; Person D is content with tap water. If we compensate C to match D's welfare, we punish D for C's choices. If we don't, C suffers. The theory must specify which preferences count as "choices" subject to penalty and which count as "unchosen endowments."
  *   **Status:** **Genuine Desideratum.** This prevents the collapse you feared: either into "you chose it, you keep it" (Libertarianism) or "nothing is chosen, equalize everything" (Strict Egalitarianism).
  *   **Smuggled Prejudice Warning:** The assumption that "preferences are always chosen" is a libertarian prejudice. The assumption that "preferences are never chosen" is a sociological determinist prejudice.

  #### 3. The Harshness Constraint (The Decency Requirement)
  *   **The Demand:** The theory must not imply that individuals who suffer bad *option* luck are justly left to destitution, starvation, or death. Justice cannot mandate abhorrent outcomes even if the recipient is technically responsible.
  *   **Motivating Case:** *The Reckless Motorcyclist.* A rider chooses not to wear a helmet (option luck), crashes, and becomes permanently disabled. Pure LE suggests society owes him nothing, as his plight is due to choice. Adequacy requires the theory to explain why he is still owed *some* aid, or admit it is not a complete theory of justice.
  *   **Status:** **Smuggled Prejudice (from Sufficientarianism/Humanism).** Strictly speaking, *pure* LE fails this. To pass this, LE must be hybridized. If you demand this, you are demanding LE stop being "pure" and become a pluralist theory.
  *   **Note:** This is likely the core of your disagreement. Your friend says failing this is consistent; you say failing this makes the theory inadequate.

  #### 4. The Ex-Ante/Ex-Post Consistency Requirement
  *   **The Demand:** The theory must specify whether justice is assessed before risks are taken (ex-ante equality of opportunity) or after outcomes occur (ex-post equality of condition), and it must stick to that timing without contradiction.
  *   **Motivating Case:** *The Insurance Market.* If everyone has equal resources to buy insurance against bad luck, is the resulting inequality (where some bought it and some didn't) just? Pure LE often says yes (ex-ante). But if the risk was unknowable (true brute luck), ex-ante equality is impossible.
  *   **Status:** **Genuine Desideratum.** Inconsistency here leads to arbitrary redistribution.
  *   **Smuggled Prejudice Warning:** Prioritarians often smuggle in an ex-post focus (help the worst off regardless of choice) while claiming to respect choice.

  #### 5. The Metric Stability Requirement
  *   **The Demand:** The theory must identify a stable "currency" of justice (resources, welfare, capabilities, opportunity) that can be measured and redistributed without creating new inequalities or violating the luck/choice principle.
  *   **Motivating Case:** *The Disability Paradox.* If the currency is *resources*, a disabled person gets less value from the same bundle than an able-bodied person. If the currency is *welfare*, we reward expensive tastes. The theory must pick a metric that handles disability without collapsing into endless compensation claims.
  *   **Status:** **Genuine Desideratum.**
  *   **Smuggled Prejudice Warning:** Resource egalitarians (Dworkin) often treat "talent" as a resource to be taxed, which welfare egalitarians (Arneson) argue violates the metric by treating internal states as external goods.

  ---

  ### Part II: Negotiability and Impossibility

  Here is the critical analysis you need for your next conversation.

  **1. Non-Negotiable Requirements**
  For a theory to call itself *Luck Egalitarian*, it cannot drop **Requirement 1 (Principled Distinction)** or **Requirement 2 (Non-Trivial Agency)**. If you drop the distinction between brute and option luck, you are no longer a luck egalitarian; you are a strict egalitarian or a sufficientarian. If you drop agency, you are a determinist. These are the definitional core.

  **2. Negotiable Requirements**
  **Requirement 4 (Timing)** and **Requirement 5 (Metric)** are internal debates within the LE camp. Dworkin chooses resources/ex-ante; Arneson chooses welfare/opportunity/ex-ante; Cohen chooses access to advantage. You can be an adequate LE theorist while disagreeing on these.

  **3. The Impossibility Result**
  This is the most important point for your argument. **Requirements 1, 2, and 3 are jointly unsatisfiable in a "Pure" theory.**

  *   If you strictly neutralize brute luck (Req 1) and strictly hold people responsible for option luck (Req 2), you *will* violate the Harshness Constraint (Req 3).
  *   If you satisfy the Harshness Constraint (Req 3) by helping the reckless motorcyclist, you are violating the strict responsibility principle (Req 2).
  *   **Conclusion:** A "Pure" Luck Egalitarianism that serves as the *sole* foundational principle of a society is impossible. It must be a *hybrid* theory. It needs a "floor" (sufficientarianism) to catch those who fall through the cracks of option luck, or it needs a "humanity clause" that overrides the luck/choice principle in extreme cases.

  Your friend is defending a theory that cannot exist as a complete social system without becoming morally monstrous. You are objecting to the monstrosity. You are both right about the logic, but the logic itself is incomplete.

  ---

  ### Part III: The Killer Requirement

  You asked for the single requirement that does the most work excluding candidate theories.

  **The Winner: The Non-Arbitrary Responsibility Tracing Requirement (Refinement of Req 2).**

  This is the bottleneck. To make LE work, you must trace an outcome back to a choice for which the agent is truly responsible.
  *   **Why it knocks out Libertarians:** They assume responsibility attaches to any voluntary transaction. LE demands we ask if the *circumstances* of that transaction were fair (e.g., did the worker *choose* to sell their labor, or were they forced by brute luck starvation?).
  *   **Why it knocks out Strict Egalitarians:** They assume responsibility is largely illusory due to social conditioning. LE demands we find a space for genuine agency.
  *   **Why it knocks out Pure Luck Egalitarians:** In the real world, tracing responsibility is epistemically impossible. We cannot know if a person's risk-taking was due to genuine preference or genetic impulsivity, upbringing, or misinformation.
  *   **The Work it Does:** This requirement forces the theory to move from metaphysics to institutional design. It excludes any theory that relies on omniscient judges. It forces the theory to rely on *proxies* for responsibility (like insurance markets or standard work hours), which inevitably introduces errors. Acknowledging these errors is what breaks the "Pure" theory.

  ---

  ### Part IV: How the Contenders Fare (Briefly)

  *   **Ronald Dworkin (Resource Egalitarianism):**
      *   *Strengths:* Solves the Metric problem (auction/insurance model) and handles the Ex-Ante requirement well.
      *   *Weaknesses:* Fails the Harshness Constraint. If you can't afford insurance due to bad brute luck (e.g., uninsurable pre-existing condition in a private market), Dworkin's model leaves you behind. It also struggles with the Responsibility Tracing Requirement (assuming the hypothetical insurance market captures genuine choice).
  *   **Richard Arneson (Welfare Opportunity Egalitarianism):**
      *   *Strengths:* Better at handling the Non-Trivial Agency Requirement by focusing on *expected* welfare rather than actual outcomes.
      *   *Weaknesses:* Vulnerable to the "Expensive Tastes" objection (Metric Stability). Also faces the epistemic problem of measuring "opportunity for welfare."
  *   **G.A. Cohen (Access to Advantage):**
      *   *Strengths:* Most nuanced on the Brute/Option distinction. Tries to compensate for unchosen disadvantages even if they aren't strictly "resources."
      *   *Weaknesses:* Collapses closest to the Strict Egalitarian view. The distinction between "choice" and "circumstance" becomes so fine-grained it is administratively impossible to implement.

  ### Summary for Your Argument

  When you speak to your friend again, do not argue about whether luck egalitarianism is "good." Argue about **completeness**.

  Tell him: *"I agree that neutralizing brute luck is a necessary condition of justice. But I am arguing that it is not a **sufficient** condition. The **Harshness Constraint** is a non-negotiable requirement for any theory claiming to govern a real society. Since Pure Luck Egalitarianism violates the Harshness Constraint by design (in cases of bad option luck), Pure Luck Egalitarianism is an incomplete theory. It requires a sufficientarian floor or a humanitarian override to function. If you defend the Pure version, you are defending a theory that mandates letting the reckless starve. If you accept the floor, you are no longer a Pure Luck Egalitarian; you are a Pluralist."*

  This moves the debate from "Is the logic consistent?" (Yes, internally) to "Is the logic adequate?" (No, externally). That is likely where your disagreement actually lives.
