answer: |-
  The session must establish that utility is not a hidden mental cause but a mathematical representation that exists only if observed choices obey specific consistency axioms.

  ### The Carrying Example: Fixing the Cafeteria
  Your cafeteria intuition is correct but dangerous. **It must lack prices.**
  *   **What it has to have:** Overlapping choice sets. You need to show the agent choosing from Menu {Apple, Orange}, then later from {Orange, Banana}, then from {Apple, Banana}. The overlap (Orange appears twice, Apple appears twice) is the only thing that allows you to test consistency.
  *   **What it has to lack:** Costs, prices, or income constraints. If you introduce prices, programmers will immediately model this as an optimization problem with constraints ($max U(x) s.t. px \leq I$) and skip the revealed preference logic entirely. They will assume the agent is maximizing *value* rather than revealing *ordering*. Strip the money; make it "free items available on the tray."
  *   **Why the obvious one is wrong:** The standard econ example uses budget lines. For this audience, budget lines invite calculus thinking (marginal utility per dollar) rather than set-theoretic thinking (choice functions). You want them thinking about logic and consistency, not optimization gradients.

  ### The Session Plan & Misconception Map
  *Total Time: 120 Minutes. Do not deviate.*

  **0:00–0:15 | The Hook & The Pre-Session Bias**
  *   **Activity:** Show a single choice: "Agent picks Apple from {Apple, Orange}." Ask: "What is the utility of Apple?"
  *   **Intervention (Misconception 1: Utility as Cause):** Stop them from saying "Higher utility." Explicitly state: "We do not know why. We only know what was picked. Utility is not the engine; it is the scoreboard."
  *   **Goal:** Break the causal link. Utility is a label we apply *after* checking consistency, not a mental state driving the choice.

  **0:15–0:45 | The Machinery (Choice Functions & WARP)**
  *   **Activity:** Build the Cafeteria example without prices. Show three menus with overlaps. Demonstrate a consistent agent vs. a cycling agent.
  *   **Intervention (Misconception 2: The Tautology Trap):** When you define utility as "a number assigned to represent choice," someone will say "So it's just a relabeling; the theory says nothing."
  *   **Counter:** "It is a relabeling *only if* the choices satisfy WARP (Weak Axiom of Revealed Preference). If they cycle, no utility function exists. The theory says: 'Behavior is utility-maximizing IF AND ONLY IF it is consistent.'"
  *   **Goal:** Establish that the axioms are the content, not the numbers.

  **0:45–1:00 | Break**

  **1:00–1:30 | Testability & The Pub Argument**
  *   **Activity:** Discuss data requirements. Show that one choice from one menu cannot falsify the model. Show that two choices from overlapping menus can.
  *   **Intervention (Misconception 3: Introspection as Data):** Someone will suggest asking the agent what they *would* have chosen.
  *   **Counter:** "Revealed preference rejects introspection. 'Shadow menus' only count if you *observe* the choice, not if you ask. Counterfactuals are data only when realized."
  *   **Goal:** Distinguish between *theoretical emptiness* (no variation) and *empirical testability* (variation + stability assumption).

  **1:30–1:50 | The AI Application**
  *   **Activity:** Apply the logic to an AI agent. "We see the AI take Action A over B. Can we infer its reward function?"
  *   **Intervention (Misconception 4: Cycles vs. Changing Preferences):** They will argue a cycle means the agent is "irrational."
  *   **Counter:** "It means the *static utility model* fails. The agent might have changing preferences, or context-dependent preferences. The model isn't 'wrong,' it's just inapplicable to that data."
  *   **Goal:** Nuance the "irrationality" claim. It's a model failure, not necessarily a agent failure.

  **1:50–2:00 | The Capstone & Final Question**
  *   **Activity:** Summary.
  *   **Final Question:** "If I observe an agent choose A from {A,B} today, and B from {A,B} tomorrow, have I falsified the hypothesis that they are maximizing a stable utility function?"
      *   *Wrong answer:* "No, preferences changed." (This saves the theory by making it unfalsifiable).
      *   *Right answer:* "Yes, unless you index preferences by time, which changes the definition of the choice set. For the standard model, this is a falsification."
  *   **Goal:** Distinguish those who understand the stability assumption from those who treat utility as a get-out-of-jail-free card.

  ### The Pub Argument Resolution
  Your friend is half-right and half-wrong.
  *   **Where he is right:** Revealed preference is empirically empty if you only observe a single choice from a single budget set. It becomes a falsifiable hypothesis only when you observe choices across *varying* choice sets (menus/budgets) and assume **stability** of the underlying preference relation. Randomized prices *are* the correct way to generate this data.
  *   **Where he is wrong:** Asking people "what they *would* have taken" (counterfactual introspection) does not count as shadow menu data for RPT. That re-imports the mentalism Samuelson purged. RPT is strictly about *observed* behavior under *observed* constraints.
  *   **The Verdict:** The theory isn't empty; it's conditional. It says: "IF preferences are stable across contexts, THEN observed choices must satisfy consistency axioms." The friend confuses *data collection methods* (randomization is good, introspection is bad) with *theoretical structure*.

  ### The AI Question Verdict
  *   **Legitimate Application:** Yes, but specifically regarding **underdetermination** and **existence**.
  *   **The Nuance:** You cannot read off an AI's goals because (a) many utility functions can rationalize the same behavior (underdetermination), and (b) if the AI's behavior violates consistency axioms (e.g., due to bug or learning), no utility function exists (non-existence).
  *   **Placement:** Introduce this in the second hour (1:30 slot) after they understand that utility is a representation theorem, not a mind-reading tool. If you introduce it too early, they will treat it as a "limits of knowledge" problem rather than a "model specification" problem.

  ### What To Openly Refuse To Cover
  State this at the start to manage expectations:
  1.  **Uncertainty & Risk (VNM):** "We are doing choice under certainty. No probabilities, no expected utility. That's a different axiom set."
  2.  **Cardinal Utility:** "We are not measuring 'how much' you prefer A to B. Only that you prefer A to B. No utils are counted."
  3.  **Welfare Economics:** "We are not judging if the choices are 'good' for the agent. Positive economics only. No paternalism."

  If you try to cover VNM or Welfare, you will run out of time and confuse the core logic of revealed preference with expected utility theory. Keep it to choice functions and consistency.
