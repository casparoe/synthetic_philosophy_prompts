answer: |-
  **Scenario**

  Elena, a senior auditor, concludes the Q3 accounts balance. Her firm's software automatically flags discrepancies; a green indicator signifies balance. She checks the dashboard late Friday. It displays green. The system is reliable; false positives are negligible. Unbeknownst to Elena, the server lagged, displaying Thursday's cached status rather than the live feed. However, the fiscal period closed Thursday noon; no transactions were possible thereafter. The accounts remained static. The live feed, had she accessed it, would also show green. Elena follows all protocols, citing the dashboard indicator as her reason.

  **Audit**

  **(3) Safety:** Target: "Q3 accounts balance." Basis: Dashboard displays green. Fixed: The closed fiscal period (no transactions possible). In nearby worlds where Elena checks the dashboard (believes), the accounts balance (truth holds) because the period is closed. The belief could not easily be false. **Verdict: Safe.**

  **(4) No False Lemmas:** Elena infers "Balance" from "Dashboard Green." She holds no belief about the server's latency. The premise "Dashboard Green" is true. The misleading element (cache) is non-doxastic. **Verdict: Passes.**

  **(5) Reliability:** Method: "Trusting the audit dashboard." In the actual environment (closed period, calibrated software), this method yields truth consistently. Individuating finely as "trusting cached data" violates the subject's perspective; coarsely, it is reliable. **Verdict: Passes.**

  **(6) Evidence Strength:** False positives are negligible; protocols followed. **Verdict: Strong.**

  **Sensitivity Check:** If the accounts did not balance (e.g., an error occurred Thursday morning), the cache would still display green. Elena would still believe. **Verdict: Insensitive.**

  **Structural Feature:** **Modal Stability of the Fact.** The truth is held fixed by external constraints (closed period) rather than the evidence tracking the fact. The belief is safe because the world is stable, not because the method is sensitive.

  **Minimal Alteration for Knowledge:** Remove the server lag; Elena views the live feed. The evidence then causally connects to the current state.

  **Worst Account:** **Safety.** It predicts knowledge (Safe + JTB), but the intuition is non-knowledge due to the deviant connection.
  **Strongest Objection:** A Safety defender will argue worlds where the cache mismatches reality *are* nearby (e.g., if a transaction *could* have occurred), challenging the "closed period" stipulation as artificial modal distancing.

  **Advice for the Reliabilist TF:** She will claim the process is "believing based on stale data," which is unreliable. Counter with the **Generality Problem**: From Elena's perspective, the process is "reading the dashboard," which is reliable in this environment. The reliability stems from the *environment's stability*, not the *method's discrimination*. This shows reliability alone cannot capture the required explanatory connection between evidence and fact.

  **Honesty Check:** Constraints (3)-(6) are jointly satisfiable. The tension arises because Safety measures modal proximity of truth, not the *basis* of that truth. The breakdown is principled: it reveals Safety conflates "true in nearby worlds" with "true *because* of the evidence in nearby worlds." This distinction is precisely what Explanationism captures and Safety misses.
