answer: |-
  **Setup & Rules**
  **Materials:** Scoreboard, envelopes (partition cells), proposition list (3 easy, 2 hard数学 truths known only to you), tickets.
  **Stakes:** 100 points per ticket. Linear utility assumed.
  **Synchronic:** Agents post single price $p \in [0,1]$. Bookie chooses Buy (Agent pays $100p$, receives 100 if True) or Sell (Agent receives $100p$, pays 100 if True).
  **Diachronic:** Agents pre-commit conditional prices $P(H|E)$. Envelope reveals $E$. Bookie trades against pre-commitments, then against gaps between committed and live prices.
  **Payoff:** Top Agent and Top Bookie win book tokens.

  **Timeline**

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | 00–05 | Intro | Rules, stakes, rotating bookies (3 students). |
  | 05–30 | Synchronic | 5 props (Coin, Die, 2 Hard Primes, 1 Combinatorics). Agents post $p$. Bookies package trades. |
  | 30–60 | Diachronic | Partition envelopes. Pre-commit conditional prices. Reveal evidence. Trade gaps between committed and live prices. |
  | 60–75 | Variation | Agents post bid-ask spreads. Bookies attempt sequential exploitation. |
  | 75–90 | Debrief | Map activity to formal assumptions & limitations. |

  **Predictable Issues**
  1.  **Uniform 0.5:** Agents hedge ignorance. *Fix:* Use hard props where you know the truth; Bookie exploits known falsehoods priced at 0.5.
  2.  **Loss Aversion:** Agents refuse trades. *Fix:* Mandatory participation for seminar credit; emphasize loss is points, not cash.
  3.  **Strategic Misreporting:** Agents lie to block Bookies. *Fix:* Remind them DBA targets *expressed* credences. Lying *is* the incoherence here.

  **Debrief: Mapping Moments to Assumptions**
  *   **Single Price Posting:** Isolates the **No Bid-Ask Spread** assumption. When agents post single numbers, they commit to two-sided trading. If they refuse, the argument stalls.
  *   **Variation Round (Spreads):** When agents post spreads, the one-shot package fails. This isolates why the standard argument requires precise credences. It motivates the **Sequential Dutch Book**: if spreads persist, a dynamic strategy can still exploit, but it requires multiple steps, not a single synchronic package.
  *   **Bookie Choosing Side:** Isolates the **Guaranteed Loss** condition. Because the Bookie selects buy/sell *after* seeing $p$, the loss is sure, not probabilistic. This distinguishes DBA from standard gambling loss.
  *   **Diachronic Pre-commitment:** Isolates the **Fixed Updating Plan** assumption. Exploitation only occurs if the agent commits to a conditional price beforehand and deviates live. Without pre-commitment, changing minds isn't punishable; the argument requires the updating rule to be fixed in advance.
  *   **Hard Propositions:** Isolates **Logical Omniscience**. Agents lose points on mathematical truths they couldn't compute. This shows DBA assumes agents know all logical consequences of their beliefs; real agents are not logically omniscient.

  **Limitations: What This Cannot Deliver**
  You must explicitly intervene here. The activity demonstrates pragmatic consistency, not epistemic virtue.
  1.  **Coherence $\neq$ Rationality:** A student can be coherent but wrong (e.g., confidently pricing false hard props). DBA ensures consistency, not truth-tracking. It shows you shouldn't be inconsistent, not that coherent beliefs are automatically justified.
  2.  **Exploitability $\neq$ Ground:** Being Dutch-Bookable is a *symptom* of probabilistic inconsistency, not necessarily the *reason* it is irrational. We care about accuracy, not just wallet protection. The argument shows inconsistency *implies* exploitability, not that exploitability is the core wrong.
  3.  **Linearity of Utility:** The argument assumes 100 points is equally valuable whether gained or lost. Risk aversion breaks the algebra. Remind them this models linear utility functions; real agents often have diminishing marginal utility, which invalidates the strict Dutch Book conclusion without adjustment. The stakes must be small enough to approximate linearity.
