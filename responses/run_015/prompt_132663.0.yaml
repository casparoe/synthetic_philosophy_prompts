  **Brainstorm: Assumptions Required for Aumann's Agreement Theorem**

  Before auditing the friend's summary, we need to isolate the precise mechanical requirements of the theorem. It is not just about "being rational."

  1.  **Common Prior Assumption (CPA):** Both agents must start with the exact same probability distribution over the state space before receiving private information. This is the "Harsanyi Doctrine." If priors differ, posteriors can differ legitimately.
  2.  **Common Knowledge of Posteriors:** It is not enough that I know my probability and you know yours. We must both know both numbers, and know that we know them, ad infinitum. In practice, this usually requires a public announcement or a specific communication protocol.
  3.  **Bayesian Rationality:** Both agents must update their beliefs strictly according to Bayes' rule. No heuristic shortcuts, no motivated reasoning.
  4.  **Shared State Space (Partitions):** Both agents must be reasoning about the same set of possible worlds and agree on how information partitions those worlds. If we disagree on what constitutes a "possible instrument error," we aren't playing the same game.
  5.  **Sincerity/Truthfulness:** In the dynamic version (swapping numbers), agents must truthfully report their current posteriors. Lying breaks the convergence.
  6.  **Finite Partitions (for dynamic convergence):** For the "swapping numbers" version to guarantee convergence in finite steps, the information structures usually need to be finite.

