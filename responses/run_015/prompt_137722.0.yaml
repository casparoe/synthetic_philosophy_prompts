  ### 4. My Verdict

  **Load-Bearing Fork:** The **Released Promise (Node 3)** is the genuinely load-bearing fork. The Secret Promise (Node 1) merely sorts those who think morality is purely consequentialist/psychological from those who think it is deontic. But the Released Promise distinguishes the *structure* of the deontic relation. If the promisee can release me, the obligation is a **right** they hold (Normative Power/Rights/Convention). If they cannot, the obligation is a **duty** I hold (Integrity/Natural Duty). This distinction determines whether promising is fundamentally about *authority over others* or *governance of self*.

  **My Leaf:** My answers place me in **Normative Power View (l_normative_power)**. I hold that the promisee can release me (Node 3: Yes), but the bot does not bind me without my specific intent (Node 5: No), and I am bound by my intent rather than reasonable uptake (Node 6: No).

  **Adjacent Leaves:** The tree cannot cleanly separate **Normative Power** from **Practice-Dependent Conventionalism** on the "Auto-Generated" node alone. Both views often agree that utterances bind, but they disagree on *why*. A Conventionalist says the *social rule* binds me; I say *my will* binds me. The case of the **Auto-Generated Promise (b)** is the best separator, but a sophisticated Conventionalist could argue that configuring the bot *is* the exercise of the normative power within the practice. To separate us, we would need a case where **social uptake contradicts specific intent** without a tool intermediary—for example, a slip of the tongue that everyone understands correctly but I did not intend. The Conventionalist binds me to the understanding; the Normative Power theorist binds me to the intent.

  **Invented Distinction:** I had to invent a distinction in the **Normative Power (Robust vs. Strict)** leaves (Node 8). The literature discusses coercion by the promisee extensively, but coercion by a *third party* where the promisee is innocent is rarely used to split leaves in introductory taxonomies. I introduced it to force a distinction on how "voluntary" the exercise of normative power must be. Most texts assume coercion voids the promise, but they rarely distinguish whether the source of the threat matters if the promisee is blameless. This distinction is necessary to fill the logical space of the tree but is not a standard fault line in the canonical texts.
