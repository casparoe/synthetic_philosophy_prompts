answer: |-
  **Mapping: Theory to Case**

  The 1913 transition at Highland Park is the empirical crystallization of the shift from *formal* to *real subsumption*. Prior to the line, capital purchased labour-power but left the craft process largely intact (formal). The moving line reconstituted the labour process itself to fit capital's logic (real). This technological shift drives *relative surplus value*. By collapsing chassis assembly from hours to ninety minutes, Ford drastically reduced the necessary labour-time portion of the day, even while shortening the working day to eight hours. The surplus portion expands not by lengthening the day (absolute surplus value) but by intensifying productivity.

  The initial 400 per cent turnover and 10 per cent absenteeism are observable symptoms of resistance to real subsumption. Marx posits that capital's despotism in production meets friction; here, the friction is flight. The $5 day intervenes in the *value of labour-power*. Marx defines this not merely by physical subsistence but by a *moral-historical* element. Ford's Sociological Department represents capital attempting to unilaterally fix this moral element, policing thrift and sobriety to ensure the wage reproduces a stable worker rather than a dissipated one. By raising the wage above the social average, Ford effectively altered the historical component of labour-power's value, purchasing compliance.

  The queues at the gates are the *industrial reserve army* in action. The theory predicts that where a surplus population exists, the price of labour-power can be manipulated to secure discipline. The queue confirms that for the reserve army, access to the wage relation outweighs the degradation of the labour process. Finally, the four dimensions of *alienation* map cleanly: from *activity* (repetitive, unskilled motions); from the *product* (the worker creates a fraction of a chassis, not a car); from *species-being* (mechanical motion replaces creative agency); and from *man to man* (competition for the $5 day and the spying of the Sociological Department). The theory predicts that real subsumption intensifies these alienations, which the case confirms, yet it also predicts that the economic coercion of the reserve army compels workers to accept them.

  **Return Direction: Case to Theory**

  **One: Extraction versus Command.** Marx's apparatus treats the extraction of surplus value and the command over the labour process as analytically distinct but ontologically unified; command is the mechanism of extraction. The wage contract is "fair" in exchange (extraction is hidden) but despotic in production (command is visible). Ford complicates this. He deepened command (the line, the Sociological Department) while mitigating the *material* sting of extraction (higher wages). Workers queued not because the command relation vanished, but because the extraction outcome (wage) improved. This suggests that while Marx theorizes them as one wrong, the worker's lived calculus separates them. The case implies the primary grievance for the proletariat may be material deprivation (extraction) rather than lack of autonomy (command), provided the former is alleviated. Marx's theory struggles to account for why workers might willingly embrace deeper alienation if the price is right, unless one leans heavily on the "dull compulsion of economic relations."

  **Two: Structural versus Experienced Alienation.** The queues are not an anomaly; they confirm alienation as a *structural* property rather than an *experienced* harm. For Marx, alienation is objective: the worker does not own the means of production and confronts the product as capital. Subjective dissatisfaction is secondary. That men queued for alienated jobs confirms the coercive power of the reserve army, not the absence of alienation. Regarding the worker-as-consumer: the fact that workers could buy the Model T is irrelevant to alienation from the product. Marx's point is that the product confronts the worker as an alien power *during production* and as a commodity *in circulation*. Owning the commodity does not negate the fact that it was produced by alienated labour. The "palace/hut" analogy concerns relative social standing and the historical determination of needs, not commodity ownership. The theory holds: consumption does not cure production alienation. Critics who claim Fordism ended alienation because workers owned cars confuse use-value appropriation with the social relations of production.

  **Three: The Exploitation Verdict.** Can we determine if workers were more exploited in 1914 than 1912? If exploitation is the rate of surplus value ($s/v$), the verdict is determinate: productivity multiplied faster than wages. Even with the $5 day, the value created per hour surged, likely increasing the rate of exploitation. However, if exploitation is measured by the worker's material deprivation, the verdict reverses. Marx's theory is determinate on the *social relation* (exploitation likely increased) but silent on whether this constitutes a worsening of the worker's *condition* in absolute terms. The theory prioritizes the relational dynamic (capital's accumulation) over the material bundle (consumption). Consequently, the theory cannot settle whether the trade-off was "worth it" without importing a normative stance outside its economic categories. It tells us capital accumulated faster, but it does not forbid the conclusion that the worker's absolute standard of living improved even as their structural subordination deepened.
