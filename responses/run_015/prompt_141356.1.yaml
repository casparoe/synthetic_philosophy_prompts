      *Actually, the strongest competitor is the "Wrong Kind of Reasons" (WKR) distinction.*
      *   *Theory 1 (Fittingness):* Reasons must be of the "Right Kind" (object-given).
      *   *Theory 2 (Pragmatic Encroachment/Contextualism):* Sometimes practical stakes *do* count as reasons for attitudes (though the teacher has rejected this so far).
      *   *Theory 3 (The "Self-Fulfilling" Exception):* Reasons that make the attitude *successful* count if the attitude is *performative*.

      *Let's stick to the clearest philosophical distinction:*
