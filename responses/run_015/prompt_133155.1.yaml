answer: |-
  There is no single, canonical term in the philosophy of science or sociology of knowledge that captures this specific **reflexive round-trip degradation** (Technical $\to$ Interpretive $\to$ Technical) with the retention of authority but loss of boundary conditions. However, your observation identifies a composite pathology that sits at the intersection of several established frameworks.

  The phenomenon you describe is best understood as a pathological iteration of **"Traveling Concepts"** (Mieke Bal) undergoing **"Semantic Bleaching"** (Linguistics) facilitated by **"Institutional Decoupling"** (Organizational Sociology). While no single noun phrase exists, the dynamic is increasingly recognized in metascience under the descriptive label of **"Reflexive Conceptual Hollowing"** or **"Epistemic Greshamism."**

  Below is a precise delineation of this state, distinguishing it from ordinary conceptual stretching, and an identification of the threshold of irreversibility.

  ### 1. Why Existing Labels Fall Short
  To isolate this dynamic, we must distinguish it from the concepts you correctly excluded:
  *   **Not *Conceptual Stretching* (Sartori):** Stretching extends a concept to cover more empirical cases (e.g., applying "democracy" to non-states). Your case is not extension, but **intension loss**: the concept covers the *same* cases but with reduced discriminative power.
  *   **Not *Motte-and-Bailey*:** That implies a strategic, defensive equivocation (retreating to a defensible claim when challenged). The dynamic you describe is often structural and unintentional; practitioners genuinely believe they are using the rigorous term, unaware the boundary conditions have been severed.
  *   **Not *Family Resemblance*:** This implies the concept never had strict boundaries. Your case posits an original technical definition with strict boundaries that were eroded over time.

  ### 2. The Constituent Mechanisms
  The dynamic is a synthesis of three distinct processes:

  **A. Semantic Bleaching (Linguistics)**
  Originally describing grammaticalization (e.g., "very" losing its meaning of "true" to become a mere intensifier), this captures the loss of specific semantic content while retaining syntactic utility. The term "interventionist" becomes an intensifier for "explanation" rather than a descriptor of a specific causal structure.

  **B. Institutional Decoupling (Sociology)**
  Meyer and Rowan's concept of decoupling describes organizations that maintain formal structures (policies, titles) for legitimacy while actual work practices diverge. In your example, the *vocabulary* (formal structure) is retained for epistemic legitimacy, while the *methodology* (actual work) diverges from the original constraints. This explains the "credential vs. criterion" function.

  **C. The Boomerang Effect of Traveling Concepts**
  Mieke Bal's "Traveling Concepts" framework usually views migration as generative. However, when a concept travels from a **Formal Domain** (SCM) to an **Interpretive Domain** (Philosophy) and returns to a **Formal Domain** (ML/Computational), it undergoes a specific corruption. The interpretive domain acts as a "lossy compressor," stripping formal constraints to gain applicability. When this compressed version returns to the technical domain, it overwrites the original specification because it is "cheaper" to implement (lower epistemic cost).

  ### 3. Delineating the "Copycat" State
  To distinguish this **Reflexive Conceptual Hollowing** from ordinary ambiguity, look for these three pragmatic markers:

  #### Marker 1: Syntactic Fidelity vs. Semantic Drift
  *   **Ordinary Stretching:** The vocabulary changes along with the meaning (e.g., "intervention" becomes "influence").
  *   **Hollowing:** The vocabulary remains **rigidly identical** (e.g., "surgical intervention," "invariance"), but the operational definition required to satisfy those terms is swapped for a proxy (e.g., "salience mapping" substitutes for "do-operator").
  *   **Test:** Can the original formal constraints be applied to the new usage without breaking the model? If the answer is "no," but the term is still used, it is hollowing.

  #### Marker 2: Authority Inheritance without Liability
  *   **Ordinary Stretching:** The new usage claims its own validity.
  *   **Hollowing:** The new usage explicitly cites the **original technical authority** (e.g., Pearl, Woodward) to justify the relaxed usage, despite violating the original axioms. It claims the *prestige* of the rigorous definition without accepting the *liability* (the difficulty of satisfying the invariance conditions).
  *   **Test:** Check the citations. Are rigorous technical papers cited to justify non-rigorous applications?

  #### Marker 3: Operational Decoupling (Credential vs. Criterion)
  *   **Ordinary Stretching:** The criterion for application is updated to match the new meaning.
  *   **Hollowing:** The **criterion** (what you actually do) diverges from the **credential** (what you say you do). The term functions as a "seal of approval" (credential) rather than a test of validity (criterion).
  *   **Test:** If a model fails the original invariance test but is still labeled "interventionist" because it passes a qualitative check, decoupling has occurred.

  ### 4. The Point of Irreversibility
  The slippage becomes practically irreversible at the stage of **Citation Inversion**.

  *   **Phase 1 (Drift):** Technical papers cite the original rigorous definitions, but apply them loosely.
  *   **Phase 2 (Inversion):** New technical papers cite the **philosophical/relaxed interpretations** *instead* of the original technical definitions to define the term.
  *   **Phase 3 (Obfuscation):** The original technical definition is treated as a "special case" or "idealization" of the relaxed version, rather than the relaxed version being seen as a violation of the original.

  Once **Citation Inversion** occurs, the rigorous definition loses its status as the "ground truth." The copy becomes the simulacrum that defines the original. At this point, attempting to restore the original boundary conditions is not seen as "correcting an error," but as "being overly pedantic" or "using an outdated definition."

  ### 5. Proposed Terminology
  Since no standard label exists, the most precise way to name this in discourse is **"Reflexive Conceptual Hollowing."**

  *   **Reflexive:** Captures the round-trip migration (Technical $\to$ Philosophical $\to$ Technical).
  *   **Conceptual:** Identifies the unit of analysis.
  *   **Hollowing:** Describes the retention of the shell (syntax/authority) with the removal of the core (boundary conditions/exclusionary power).

  Alternatively, in the context of epistemic quality, this is a manifestation of **"Gresham's Law of Concepts"**: where "bad" (low-cost, low-rigor) concepts drive out "good" (high-cost, high-rigor) concepts because the former offer the same signaling value (credentials) for less operational effort.

  ### Summary
  You have identified a specific failure mode in interdisciplinary knowledge transfer. It is not merely ambiguity; it is **structural decoupling** masked by **syntactic fidelity**. The term functions as a **simulacrum**: it signals rigor without enforcing it. The dynamic becomes irreversible when the relaxed definition becomes the citation standard for the rigorous domain, severing the conceptual traceability back to the original formal constraints.
