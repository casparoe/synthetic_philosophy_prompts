      For the psychometricians, intelligence is a tool for *prediction*. In humans, the 'positive manifold'—the fact that performance across disparate tasks correlates—is an empirical reality. A single number (g) works because biology constrains us; our brains are general-purpose wetware where energy limits and neural efficiency create a common bottleneck. If you are hiring graduates, you do not care why they perform; you care that the test predicts it. Their definition holds because, for humans, the single capacity is statistically real.

      For the educators and cognitive psychologists, intelligence is a tool for *intervention*. If you tell a teacher a child has 'low intelligence', she cannot act. If you tell her the child lacks working memory but has strong verbal reasoning, she can adapt. Their resistance to a single number is not denial of the correlation, but a refusal to let a predictive statistic overwrite a causal explanation. They are right that flattening the profile obscures the levers for improvement.

      The AI researchers introduce a third condition: *generalisation*. They define intelligence by scope and learning rate because they are building systems from scratch, unconstrained by human biology. Here, your observation about jagged profiles is crucial. An AI can be superhuman at Go and illiterate at reading because silicon allows modular specialisation that biology forbids. When AI people argue with psychometricians, they are often talking past one another: one describes the structure of human minds, the other describes the potential space of all minds.

