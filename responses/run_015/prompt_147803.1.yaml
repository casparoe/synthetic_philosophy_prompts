answer: |-
  You have independently reconstructed one of the most famous and difficult passages in Marx's oeuvre. The text you are looking for is indeed in the **Grundrisse**, specifically the section known as the **"Fragment on Machines."**

  Your argument is logically tight, but your intuition that something is "broken" is correct. However, the break is not where you suspect. You should reject **(6)**.

  Your friend is right about the exegesis (Marx did view value as historical), but they haven't explained *why* that doesn't invalidate the theory. You are stuck because you are applying a standard of scientific validity (universality) that Marx explicitly rejects.

  Here is the breakdown of where the argument bends, why it looked straight, and what it costs you to fix it.

  ### The Break: Step (6)

  **The Step:** *"A theory that says of itself that it will stop being true isn't a good theory. So (1) is false, or at best only true for a while."*

  **Why it looked fine:**
  We are trained to think of scientific laws as trans-historical. If Newton's law of gravity stops working on Tuesdays, Newton was wrong. We expect economic theories to function like physics: identifying eternal mechanisms of human behavior. If the Labor Theory of Value (LTV) says "Value is labor" but also "Eventually value won't be labor," it sounds like a contradiction, like saying "All swans are white" and "Eventually swans won't be white."

  **Why it is wrong (in this framework):**
  Marx is not doing physics; he is doing **historical sociology**. He is not describing the eternal mechanics of "Production," but the specific social relations of "Capitalism."

  In this view, "Value" is not a natural property of a thing (like weight or mass); it is a social relation that only exists when products are exchanged by private owners in a market.
  *   **The Theory's Job:** The theory's job is to describe the logic of a specific system.
  *   **The System's Trajectory:** That system contains internal dynamics (automation) that erode the foundation of the system itself (labor as the measure of wealth).
  *   **The Result:** The theory accurately predicts that the *social conditions required for the theory to apply* will vanish.

  That is not a logical contradiction in the theory; it is a **historical contradiction in the object being studied.** A map that says "Here be dragons" and then shows the dragons dying out because the climate changed is a good map. It is accurately reporting that the territory is changing in a way that makes the map's legend obsolete.

  ### Resolving Your Worry About Step (1)

  You wrote: *"If that's the answer I dont see how (1) is a claim about what value is rather than about what it used to be in one period."*

  This is the crux. In Marxist theory, (1) is a claim about what value is **under capitalism**.

  Think of it like "Feudal Rent."
  *   **Claim:** "Surplus in feudalism is extracted via coercive rent."
  *   **Prediction:** "Capitalism will develop and make rent obsolete."
  *   **Conclusion:** Does this make the claim about Rent false? No. It makes it historically specific.

  Marx argues that "Value" (in the technical sense of crystallized socially necessary labor time) is the specific way capitalist society organizes wealth. If society moves to a post-capitalist mode (or a crisis where price disconnects entirely from labor), "Value" in that specific sense ceases to exist. It doesn't mean the theory was lying; it means the category itself has expired.

  ### The Cost of Rejecting (6)

  If you keep (1) through (5) and reject (6), you are accepting the *Grundrisse* position. Here is what you pay for that insight:

  **1. You must abandon Economic Naturalism**
  You cannot believe that "the economy" is a timeless machine governed by eternal laws (like supply and demand). You must accept that economic categories (Value, Profit, Wage) are historical costumes that society wears for a specific era. This makes economics much messier, because the rules change as the system evolves.

  **2. You must distinguish "Value" from "Wealth"**
  This is the hardest conceptual cost.
  *   **Wealth** = Use-values (stuff, services, abundance). This can grow infinitely with automation.
  *   **Value** = Labor-time accounting. This shrinks with automation.
  You have to accept that capitalism is unique in confusing these two. It tries to measure *Wealth* using *Value*. Step (5) says this measurement breaks. You have to accept that a world of massive abundance (high wealth) can be in economic crisis (low value/profit) simultaneously.

  **3. You must accept the system has an "End Condition"**
  If you reject (6), you accept that capitalism is not a stable equilibrium that can be tweaked forever. It has a logical limit. When labor time is no longer the main source of wealth, the law of value (and thus the price mechanism) ceases to function as a regulator. This implies the system doesn't just cycle; it eventually becomes incompatible with its own technology.

  ### Alternative: What if you reject (2) or (4)?

  You mentioned you'd prefer to keep (1)-(3). But for completeness, here is what it costs if you try to save (6) by breaking earlier links:

  *   **Reject (2) (Machines create value):** If you say machines *do* create new value, you save the theory from obsolescence (automation won't kill profit), but you lose the specific Marxist insight into exploitation. You move toward Sraffian or neoclassical economics. You lose the "human" core of the theory.
  *   **Reject (4) (Profit rate doesn't fall):** You can argue counter-tendencies (cheapening of machines, increased intensity of work) always offset automation. This saves capitalism from the "end condition," but it turns Marxism into a theory of equilibrium rather than crisis. It makes the *Grundrisse* insight (that automation fundamentally undermines the logic) impossible to hold.

  ### Summary

  The hole is in your philosophy of science, not in the economics.

  You are assuming a theory is "bad" if it describes a system that evolves out of the theory's applicability. Marx assumes a theory is "good" precisely *if* it can identify the limits of the system it describes.

  If you keep (1)-(5), you are left with a powerful, tragic insight: **Capitalism is a system that succeeds by making its own measuring stick irrelevant.** It drives to automate to survive competition, but in doing so, it removes the only source (labor) that validates its own accounting system (value).

  That isn't a broken theory. It's a theory about a broken system.
