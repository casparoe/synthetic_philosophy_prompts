answer: |-
  **Interview Questions**

  **1. The Parish-Rate Problem**
  "In our minute books, the poor appear only as grammatical objects: 'Ordered that John Doe be relieved,' never 'John Doe requested.' If we transcribe these verbatim, we preserve the administrative syntax that erased their agency. If we annotate them to restore agency, we risk inventing a history the document doesn't support. Given your claim that silences are manufactured, is the archivist's duty to preserve the syntax of the oppression or to interrupt it, and is there a technical standard for where that interruption occurs?"

  *   **Likely Reply:** "The duty is to preserve the record as evidence of the function. Agency isn't found in the syntax but in the context we build around the record. Interrupting the syntax compromises the evidentiary value."
  *   **Follow-up:** "If the 'evidentiary value' relies on the syntax of erasure, doesn't preserving it prioritize the state's logic over the subject's reality? At what point does 'context' become a euphemism for 'apology'?"

  **2. The Custodial Bind**
  "When a community deposits papers with a repository, they sign a deed of gift that usually transfers ownership and control of arrangement. You argue that custody dictates the narrative. Is there any legal instrument short of a perpetual loan— which most repositories reject—that prevents the archive from absorbing the collection into its own provenance structure, or is the loss of community control the price of preservation?"

  *   **Likely Reply:** "Repositories require ownership to ensure permanent preservation. A perpetual loan creates a custodial nightmare. The trade-off is necessary for long-term access."
  *   **Follow-up:** "If the trade-off requires the community to surrender the right to describe their own history to ensure that history survives, isn't the 'survival' contingent on the community's epistemological surrender?"

  **3. Inclusion as Re-description**
  "When we acquire records from under-recorded groups, we catalog them using the Library of Congress Subject Headings or our existing controlled vocabulary. This often forces their self-descriptions into the categories of the agencies that excluded them. You've called this 'a description problem, not a power problem.' But if the vocabulary dictates what is retrievable, doesn't description *become* power by determining what can be found?"

  *   **Likely Reply:** "Controlled vocabulary ensures consistency across collections. Without it, retrieval fails. The power lies in the creation of the records, not the metadata tags we apply to make them findable."
  *   **Follow-up:** "If the metadata tags determine findability, and findability determines historical usage, then the metadata dictates the historical narrative. If description dictates the narrative, how is it not an exercise of power?"

  **4. Retrievability Bias**
  "Once we digitize and OCR these minute books, only the words the clerks wrote become searchable. If a poor person described themselves in a way the clerk didn't record, that self-description is now permanently buried under the clerk's vocabulary. Does full-text searchability calcify the original manufacturing of silence, making the 'completeness illusion' harder to pierce than in a physical archive?"

  *   **Likely Reply:** "Digitization increases access, which allows more eyes to critique the record. The illusion is a user education problem, not a technological one."
  *   **Follow-up:** "If the technology privileges the recorder's vocabulary algorithmically, requiring 'user education' to overcome it places the burden of correcting archival bias on the least resourced researchers. Is that equitable?"

  **5. Silence vs. Noise**
  "You use the metaphor of 'silence' for these absences. But a poor-relief book is full of formulaic boilerplate repeated thousands of times. That isn't silence; it's noise. It drowns out the exception. If we reframe your theory from 'manufactured silence' to 'manufactured amplification,' does your prediction about digitization change? Does multiplying the noise make it harder to hear the exception?"

  *   **Likely Reply:** "Silence refers to the absence of the subject's voice, not the absence of text. Amplification is a useful metaphor, but the outcome is the same: the subject is obscured."
  *   **Follow-up:** "If the outcome is the same, does the metaphor matter? If we treat it as amplification, the solution isn't finding what's missing, but dampening what's there. Are you advocating for de-emphasizing the dominant record?"

  **6. The Negative-Space Problem**
  "I need a heuristic to distinguish a 'manufactured silence' from a 'banal silence.' If a record doesn't exist because nobody wrote anything down, versus because someone threw it away, the gap looks the same. What empirical test do you propose for us to tell the difference? If we can't test it, doesn't the theory risk becoming unfalsifiable?"

  *   **Likely Reply:** "We look at the patterns of retention. If similar records from a different jurisdiction survive, or if the gap aligns with a shift in policy, we infer manufacture. It's probabilistic, not absolute."
  *   **Follow-up:** "If it's probabilistic, then a significant portion of what you call 'manufactured' could be entropy. If half the silences are banal, does the 'manufactured' framing over-politicize the inevitable decay of paper?"

  **7. The Symmetry Worry**
  "If every archive is an instrument of the power that keeps it, then a community-run archive is an instrument of that community's power. They will also exclude, appraise, and silence. Does your critique apply reflexively to the community archives you often champion? Or is there a moral asymmetry where one kind of power is legitimate and the other isn't?"

  *   **Likely Reply:** "There is an asymmetry because state archives enforce state power, which is coercive. Community archives are voluntary associations. The power dynamic is fundamentally different."
  *   **Follow-up:** "Voluntary associations can still coerce internal minorities or exclude dissenters. If the mechanism of archival power is selection and description, doesn't that mechanism operate the same way regardless of who holds the pen?"

  **8. The Budget Question**
  "Repositories have finite budgets. Your theory implies that existing collections are structurally compromised by past appraisal decisions. Should we therefore prioritize re-describing existing holdings over acquiring new ones from under-recorded groups? If you say 'both,' given zero-sum budgeting, which one takes precedence?"

  *   **Likely Reply:** "That's an access problem, not an appraisal problem. We need to improve access to what we have while continuing to build responsibly."
  *   **Follow-up:** "If resources are finite, money spent on 'access' to compromised records is money not spent on acquiring un-compromised ones. If you refuse to prioritize, aren't you implicitly prioritizing the status quo of the existing collection?"

  **9. The Definition of Power (Targeting Phrase 1)**
  "You distinguish between description and power. But in archives, description *is* the mechanism of control. It determines the fonds, the series, the box numbers. If I cannot find it without your description, you control my access to reality. If description controls access to reality, can you articulate a definition of 'power' that excludes description, or must you concede that description is a subset of power?"

  *   **Likely Reply:** "Power implies intent to dominate. Description implies intent to organize. Most archivists are organizing, not dominating."
  *   **Follow-up:** "Structural power doesn't require individual intent. A road map organizes terrain, but it also dictates where you can drive. If the description dictates the path of inquiry, the lack of malicious intent doesn't negate the power dynamic. Why resist that classification?"

  **10. The Definition of Appraisal (Targeting Phrase 2)**
  "You distinguish between access and appraisal. But digitization is an appraisal decision. You choose what to scan, what to OCR, what to index. When you digitize a collection, you are re-appraising it for the digital age. If digitization is appraisal, then the 'completeness illusion' is a result of a new appraisal layer. Why call it an access problem when it's actually a second round of appraisal?"

  *   **Likely Reply:** "Digitization is a format migration to facilitate access, not a selection of content based on value."
  *   **Follow-up:** "You never digitize everything. You select based on condition, demand, and funding. That is selection based on value. If you select what becomes 'complete' for the online user, you are appraising. If you admit digitization is appraisal, does your defense of large-scale digitization hold?"

  ***

  **Analysis**

  Three things to consider before you hit record. First, the shakiest premises in your line of questioning are the **Symmetry Worry** and the **Negative-Space Problem**. The symmetry argument assumes "power" operates identically in a state repository and a community closet, ignoring that state power has the force of law and monopoly behind it, whereas community power is fragile and often defensive; she will easily dismantle the idea that these are morally equivalent. The negative-space question assumes "banal" and "manufactured" silences are empirically separable; in reality, they are often entangled (e.g., a record wasn't kept *because* the bureaucracy deemed the life banal), so demanding a heuristic test might make you look naive about the nature of historical evidence.

  Second, the answer that should change your mind about the "manufactured silence" framing is if she successfully argues that **preservation is the primary ethical act, and interpretation is secondary.** If she can convince you that without the "oppressive" administrative structure, the records would have been destroyed entirely, then the "manufactured" nature of the archive is the only reason you have *any* data to work with on Saturday mornings. If the choice was between "biased record" and "no record," the bias is a feature of survival, not just a bug of power.

  Third, your questioning is most likely to misfire on **Question 10 (Digitization as Appraisal).** You are presupposing that digitization is highly selective in a way that mirrors traditional appraisal. In many large-scale projects (like your own), the goal is often "mass digitization" of entire boxes or series to avoid making new selection biases. A specialist might correct you that digitization is often an *access* layer applied to *existing* appraisal, not a new appraisal itself. If she points out that you are conflating "digitization" with "selection for digitization," you may lose the technical high ground. Be prepared to concede that distinction if she makes it sharply.
