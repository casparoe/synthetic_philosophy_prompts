  Bottom line: You're right about the arithmetic; your friend is right about the memo.

  Your 97.2% to 92% calculation is correct and doesn't contradict Condorcet. The theorem assumes homogeneous competence p. It guarantees convergence in large groups for fixed p > 0.5, but adding voters with lower p can reduce accuracy. Your friend misapplies the theorem: "Bigger is better" only holds if new voters match existing competence.

  Regarding the memo: Your friend is correct. Shared input creates correlated errors. If the memo is wrong (20% chance), a majority of voters will likely follow it, regardless of their independent hunches. The group's accuracy plateaus at the memo's reliability (80%), not 100%. Independence requires that errors be uncorrelated; common signals violate this condition, preventing convergence to certainty.

  On deliberation: The theorem doesn't forbid deliberation, but standard CJT assumes static independence. Deliberation often increases individual competence p while reducing independence. Modern epistemic democracy literature models this trade-off rather than dismissing deliberation entirely.

  You correctly identified limits on group composition; your friend correctly identified limits on independence. Both of you are partially right, but applying the theorem requires strict attention to its assumptions: homogeneous competence and uncorrelated errors.
