answer: |-
  You have diagnosed the stalemate with remarkable precision. The committee is not stuck on facts; it is stuck on the grammar of its own practice. You are arguing in a language of moral verdicts while operating within a structure of institutional expression.

  Here is the reconstruction of the theory your practice presupposes, the analysis of its coherence, and the test for your *modus vivendi* hypothesis.

  ### I. The Reconstructed Theory: Epistemic Culpability and Instrumental Commemoration

  Your committee is operating on a hybrid theory that I will call **Epistemic Culpability** paired with **Instrumental Commemoration**.

  **1. Moral Responsibility: The Epistemic Culpability Model**
  Your "dissenters test" reveals that the committee does not use a timeless moral standard (Natural Law) nor a purely internal one (Conscience). It uses a **social-epistemic standard**.
  *   **The Presupposition:** An agent is culpable for a wrong if the moral knowledge required to reject that wrong was *socially available* to them.
  *   **The Mechanism:** The existence of contemporaneous dissent proves that the moral truth was accessible. Ignoring it transforms the agent from a passive product of their structure into an active participant in the wrong.
  *   **The Coherence Problem:** This theory is coherent only if we assume moral progress is endogenous to history (generated by dissenters) rather than exogenous (revealed later). It presupposes that "being a man of his time" is a valid excuse only when the "time" was a monolith. If the time was contested, the agent is responsible for which side of the contest they backed.
  *   **Conditions for Success:** For the defense to succeed under this theory, it must be true that: (a) dissent was non-existent, OR (b) dissent existed but was epistemically inaccessible (e.g., suppressed, in a language unknown, or confined to a marginalized group whose testimony was structurally silenced). Your committee seems to tacitly accept (b) rarely, treating the mere existence of a dissenting voice anywhere in the empire as sufficient notice.

  **2. Commemoration: The Instrumental/Expressive Model**
  The asymmetry you note (Feature 2)—indexing wrongs but not achievements—proves that commemoration is not a **Net Moral Scorecard**. If it were, the achievements would be discounted by the normative blindness required to produce them.
  *   **The Presupposition:** Public honor is not a judgment on the *whole person* (desert); it is a **claim of inheritance**.
  *   **The Mechanism:** When you keep Jefferson, you are not saying "Jefferson was good." You are saying "We are the heirs of the Declaration." When you critique his slavery, you are saying "We reject the heirs of the plantation."
  *   **The Coherence Problem:** This treats the historical figure as a **bundle of separable attributes**. It presupposes that the Declaration can be disentangled from the enslavement that funded the leisure to write it and the social order that made "men" a contested category. This is metaphysically dubious but politically necessary.

  ### II. Strict Presuppositions vs. Compatible Fits vs. Underdetermination

  **Strict Presuppositions (What the practice *must* assume to function):**
  1.  **Institutional Authority:** The university claims the standing to judge historical figures by contemporary standards.
  2.  **Semantic Malleability:** The meaning of a statue or name is not fixed at the moment of erection; it can be altered by current context (hence the plaque option).
  3.  **Selective Inheritance:** The institution can claim lineage from a figure's virtues without accepting liability for their vices.

  **Compatible Fits (What fits the data but isn't required):**
  1.  **The Dissenters Test:** You could theoretically hold a strict desert view and *still* use the dissenters test as a heuristic for culpability, but you don't have to. A strict Kantian might say slavery was wrong regardless of dissent. The test fits a liberal-progressive view of history, but it isn't logically required by the act of removal itself.
  2.  **Profit Distinction (Feature 4):** Treating building names (wealth) differently from statues (honor) fits a **complicity theory** (we shouldn't profit from sin), but the practice doesn't strictly require it. You could argue that *all* association is complicity, or *none* is.

  **Genuine Underdetermination (Where the theory breaks down):**
  1.  **The Plaque Paradox:** You identified this perfectly. If a plaque can fix the meaning (revisable inscription), removal is never logically necessary, only aesthetically preferred. If removal is necessary, the plaque is insufficient. The practice allows both, which implies the committee hasn't decided if a monument is a **text** (to be annotated) or a **ritual object** (to be purged).
  2.  **Inseparability:** You note Churchill and Columbus are treated differently despite "inseparable" wrongs. The theory underdetermines the threshold of inseparability. Is it 51%? 90%? There is no metric for when a virtue is "tainted" beyond repair.

  ### III. Verbal vs. Substantive Disagreements

  **Verbal Disagreements:**
  *   **"Honor":** This is the primary source of friction. One side uses "honor" to mean **respectful acknowledgment of historical impact** (descriptive). The other uses it to mean **moral endorsement of character** (normative). When a defender says, "We honor his leadership," they mean the former. When an opponent hears, "We endorse his leadership," they hear the latter.
  *   **"Removal":** Is removal **erasure** (pretending he didn't exist) or **relocation** (contextualizing him in a museum)? The word covers two distinct speech acts.

  **Substantive Disagreements:**
  *   **Current Complicity:** The distinction between building names (wealth) and statues (honor) is substantive. It rests on a real ethical difference between *benefiting from past injustice* vs. *symbolically aligning with it*. This is not verbal; it is a clash between reparative justice and expressive liberty.
  *   **The Function of the University:** Is the campus a **civic space** (reflecting shared values, requiring purity) or an **educational space** (reflecting complex history, requiring friction)? This determines whether a "flawed hero" is a bug or a feature.

  ### IV. Alternative Regimes: What the Practice Would Look Like

  If you replaced the current hybrid theory with a pure one, the landscape would change radically:

  **1. Pure Forward-Looking Consequentialism**
  *   **Theory:** Keep/remove based solely on future utility. Does this name inspire students? Does it cause pain that hinders learning? History is irrelevant.
  *   **Practice:** You might keep a Confederate general if his name brings in alumni donations that fund scholarships for minorities. You might remove Jefferson if his name causes measurable psychological harm to black students, regardless of his historical importance.
  *   **Result:** Highly unstable. Values shift. Today's inspiration is tomorrow's oppression.

  **2. Strict Desert-Based View (The Scorecard)**
  *   **Theory:** A figure is a moral unit. Calculate net moral worth. If Sins > Virtues, remove.
  *   **Practice:** Almost total clearance. Very few historical figures survive a rigorous net-worth calculation against modern standards. The campus becomes named after abstract concepts ("Justice Hall") or living donors.
  *   **Result:** Historical amnesia. The university severs its connection to the past.

  **3. The Quotation View**
  *   **Theory:** A name is a citation of a specific text/idea, not the life.
  *   **Practice:** "Jefferson Hall" is explicitly labeled "Citing the Declaration of Independence." The plaque is not an add-on; it is the **citation mark**. Without the plaque, the name is invalid.
  *   **Result:** Requires aggressive contextualization. Every building becomes a mini-exhibit. It turns the campus into a history museum rather than a shrine.

  ### V. The Verdict: Modus Vivendi and The Test

  Your hypothesis is correct. You are running two incompatible theories: a **Culpability Theory** for removal (looking backward at guilt) and an **Expressive Theory** for retention (looking forward at utility).

  The stalemate occurs because these theories return opposite answers in the "hard cases" (Jefferson, Churchill).
  *   **Culpability Theory says:** Remove (or mitigate heavily), because the dissenters test is failed.
  *   **Expressive Theory says:** Retain, because the "fragment" we need (1940, Declaration) is still vital to our identity.

  The committee is a **treaty zone**. The "plaque" option is the diplomatic compromise that allows both sides to claim victory: the removal side gets the admission of guilt (on the plaque), the retention side gets the continued presence of the name.

  **How to find out for sure:**
  To test if this is truly a *modus vivendi* rather than a coherent single theory, you must force a **trilemma**. Draft a policy that requires the committee to choose *one* primary justification for every decision, prohibiting hybrid reasoning.

  **The Test Proposal:**
  Propose a rule for the next case that reads: *"In evaluating a figure, the Committee must declare whether the primary basis for retention is (A) Moral Desert, (B) Educational Utility, or (C) Historical Inheritance. If (A), evidence of significant moral failure mandates removal. If (B), evidence of student harm mandates removal. If (C), evidence of historical significance mandates retention regardless of moral failure."*

  If the committee fractures when forced to select (A), (B), or (C) for a specific case like Jefferson, you have proven the *modus vivendi*. If they can unanimously select one and apply it consistently, you have found your theory.

  My prediction: They will fracture. The practice is not a search for truth; it is a negotiation over identity. You are not trying to solve a math problem; you are trying to write a constitution for a community that disagrees on its own origins. The stalemate is not a failure of reasoning; it is a symptom of the political reality you inhabit.
