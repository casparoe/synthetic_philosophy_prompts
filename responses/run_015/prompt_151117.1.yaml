  2.  **Analyze the Disagreement (Diagnosis):**
      *   *Is it empirical?* No. Both accept SR/Lorentz invariance. No experiment distinguishes Eternalism from Presentism *within* SR.
      *   *Is it formal?* Partially. Presentists struggle to define a "present" hyperplane covariantly. But some (e.g., Stein, Godfrey-Smith) argue formal coherence is possible via causal structures.
      *   *Is it verbal?* There's a strong semantic component. "Exists" is the flashpoint. Eternalists say "exists" = "is located at some spacetime coordinate." Presentists say "exists" = "is real *now*." If they define existence differently, they talk past each other.
      *   *Is it different questions?* Yes. One asks about the *geometry of spacetime* (physics), the other about the *metaphysics of time* (ontology).
      *   *The "Stein" Move:* Howard Stein (1968, 1991) argued that "becoming" is compatible with SR if defined via the past light cone (causal past). This shifts the debate from "global simultaneity" to "causal structure."
      *   *The "Underdetermination" Move:* The physics fixes the causal structure, but not the ontological interpretation of that structure.

      *Synthesis:* It is primarily a case of **Metaphysical Underdetermination by Physics**, compounded by **Verbal/Semantic Ambiguity** regarding the predicate "exists." It is *not* purely verbal because there are substantive commitments about the nature of reality (e.g., is the future real?), but the physics alone cannot adjudicate these commitments.

  3.  **Drafting the Diagnosis:**
      *   *Label:* It's a case of **Metaphysical Underdetermination** rooted in a **Category Mistake** (conflating frame-dependent coordinates with ontological reality).
      *   *Evidence from Eternalists:* They argue from the *manifold structure*. If all points in the manifold are equally valid coordinates, all points are equally "real." (Putnam: "There are no 'nows'").
      *   *Evidence from Presentists:* They argue from the *phenomenology of tense* and the *privilege of the local*. They claim 'exists' is indexical. (Prior: "Thank goodness that's over").
      *   *The Clash:* Eternalists treat 'exists' as a quantifier over the manifold ($\exists x \in M$). Presentists treat 'exists' as a property of events relative to an observer ($\exists_t x$).
      *   *Conclusion:* They are asking different questions. Physics answers "What is the causal structure?" Metaphysics answers "What is the ontological status of that structure?"

  4.  **Defining "Genuine Progress":**
      *   *Option 1: Conceptual Distinction (Invariant vs. Artifact).* This is the most promising philosophical move. Distinguishing between the *geometric structure* (invariant) and the *foliation* (artifact). Progress = recognizing that 'becoming' must be defined invariantly (e.g., via causal sets) if it is to be real.
      *   *Option 2: Cosmological Models (Curved Spacetime).* In GR, some solutions (FLRW) *do* have a preferred foliation (cosmic time). Does this save Presentism? Not really, because it's contingent, not necessary. But it shows SR isn't the whole story. Progress = acknowledging that SR is a local approximation and the global topology matters.
      *   *Option 3: Principled Underdetermination.* This is the most honest conclusion. Physics constrains metaphysics but doesn't dictate it. Progress = accepting that the Block Universe is a *model* consistent with physics, not a *deduction* from it.

