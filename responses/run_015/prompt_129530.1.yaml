answer: |-
  There is no single, capitalized Proper Noun for this specific mismatch in the canon (like "The Hard Problem"), but it is standardly referred to as **the Fission-Fusion Asymmetry** (or sometimes **the Asymmetry of Survival Intuitions**).

  It is a recognized puzzle, but you are correct to suspect that much of the seminar consensus you're encountering relies on an inconsistency that Parfit himself explicitly attacks. Parfit argues for a **Symmetry Thesis**: if psychological continuity (Relation R) is what matters, it should matter equally in both directions. If your seminar peers accept survival in fission but deny it in fusion, they are likely smuggling in a hidden commitment to strict identity that they claim to have abandoned.

  Here is how to define the mismatch rigorously so it isn't just sloppy identity talk, and why the intuition persists despite Parfit's arguments.

  ### 1. The Structural Mismatch
  To define this without equivocation, you must distinguish between **Causal Replication** (Fission) and **Causal Conflation** (Fusion).

  *   **Fission (1 $\rightarrow$ 2):** The causal chain from the original psychology is *preserved fully* in both branches. Branch A contains 100% of the relevant psychological continuity from the Original. Branch B contains 100% of the relevant psychological continuity from the Original. The "data" is copied perfectly.
  *   **Fusion (2 $\rightarrow$ 1):** The causal chain from the originals is *diluted* in the result. The Result contains roughly 50% of the psychological continuity from Person A and 50% from Person B. The "data" is merged and altered.

  **The Rigorous Definition:**
  The asymmetry rests on whether **survival** requires *exclusive* causal dependence.
  *   **Fission Intuition:** Survival requires that *someone* in the future carries my psychology. It does not require that they be the *only* one. (High fidelity, multiple targets).
  *   **Fusion Intuition:** Survival requires that *I* am the primary cause of the future person. If the future person is equally caused by someone else, my specific causal contribution is no longer sufficient to ground *my* survival. (Low fidelity, single target).

  ### 2. Why the Inconsistency Persists (The "Uniqueness" Trap)
  The reason your seminar peers likely accept fission but reject fusion is due to a hidden **Non-Branching Clause** or **Uniqueness Requirement** that they are applying inconsistently.

  Many theories of personal identity (like Nozick's "Closest Continuer" theory) argue that you survive only if there is a unique closest continuer.
  *   **In Fission:** There are two equally close continuers. Strict identity fails (because identity must be one-to-one), but *survival* is often granted because both successors feel like "me" from the inside. The first-person perspective seems to duplicate.
  *   **In Fusion:** There are two predecessors for one continuer. Strict identity fails. But here, *survival* is denied because the first-person perspective seems to be extinguished. Neither original "wakes up" in the fused body; a *third* perspective wakes up with mixed memories.

  The inconsistency lies here: In fission, people prioritize **Psychological Connectedness** (I have my memories). In fusion, people silently switch to prioritizing **Numerical Identity** (I must be the *only* source of this future person).

  ### 3. Parfit's Critique
  Parfit would say your seminar peers are failing to follow his argument to its conclusion. He argues that **Identity is not what matters; Relation R is.**

  *   **Parfit on Fission:** Identity does not hold (because there are two), but what matters (survival) does hold. I should care about both successors as I care about myself.
  *   **Parfit on Fusion:** Identity does not hold (because there were two predecessors), but what matters (survival) *should* still hold. Relation R exists between Person A and the Fused Result (just as it does in fission).

  If people deny survival in fusion, Parfit argues they are clinging to the "further fact" of identity—the idea that there is a deep, metaphysical "Ego" that must remain distinct. They treat fusion as death because two distinct "Egos" are destroyed to make one new one. They treat fission as survival because the "Ego" seems to replicate. Parfit claims this is an illusion; there is no Ego, only overlapping psychological connections.

  ### 4. How to Frame It in Seminar
  If you want to press this without sounding like you're just pointing out a contradiction, frame it as a question about **The Direction of Concern**.

  Ask: *"Is the asymmetry based on the **preservation of content** or the **preservation of the subject**?"*

  *   If it's about **content** (memories, traits), fusion should allow survival (the content exists in the future).
  *   If it's about the **subject** (the 'I'), fusion destroys the subject (two 'I's become one 'We' that feels like an 'I').

  The term you are looking for to describe the mismatch is **The Fission-Fusion Asymmetry**, but the philosophical error underpinning it is **The Violation of the Symmetry Thesis**. If they accept Relation R in fission, logical consistency demands they accept Relation R in fusion. If they don't, they haven't actually abandoned Identity as what matters; they've just hidden it inside their definition of survival.
