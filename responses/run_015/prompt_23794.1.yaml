prompt: |-
  My friend Priya is marrying Marcus and I'm giving the toast. She's a fisheries econ phd and a total Ostrom devotee -- thinks a commons governs itself fine with the right local rules. He's also an economist, wrote his whole dissertation arguing Hardin had it right, that without privatization or a real regulator a shared resource is doomed. They've been arguing about this since grad school. Half the room is their department, half is family who's never heard of a common-pool resource in their life. Write me a five-minute wedding toast that uses their years of bickering over the tragedy of the commons as the actual love story, with at least one solid joke about how splitting chores or sharing a fridge is basically a tiny commons problem -- it has to land as affection not a lecture, and it can't secretly side with either of them on who's right.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Priya (bride) and Marcus (groom).
      *   **Speaker:** Friend of the couple.
      *   **Key Characters:**
          *   Priya: Fisheries Econ PhD, Elinor Ostrom devotee (believes in self-governing commons with local rules).
          *   Marcus: Economist, Dissertation argued Garrett Hardin was right (believes shared resources need privatization/regulation to avoid tragedy).
          *   Dynamic: They've been arguing about this since grad school.
      *   **Audience:** 50% Economics Department (gets the jokes), 50% Family (doesn't know what a "common-pool resource" is).
      *   **Theme:** Use their academic bickering as their love story.
      *   **Specific Requirement:** Include a joke about household chores/fridge sharing as a "tiny commons problem."
      *   **Tone:** Affectionate, not a lecture, neutral (don't side with Priya or Marcus).
      *   **Length:** ~5 minutes (approx. 700-800 words spoken at a moderate pace).

  2.  **Deconstruct the Academic Conflict (The "Bit"):**
      *   *Hardin (Marcus):* "Tragedy of the Commons." Individuals acting in self-interest deplete shared resources. Solution: Private property or state control. Pessimistic about human nature/cooperation without enforcement.
      *   *Ostrom (Priya):* "Governing the Commons." Communities *can* manage shared resources successfully through trust, communication, and nested rules. Optimistic about cooperation.
      *   *The Metaphor:* Marriage *is* a commons. Shared resources (time, money, affection, fridge space).
      *   *The Resolution:* They don't need to agree on the theory to make the practice work. Their debate *is* the balance.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the split audience (econ vs. family). Define the "Tragedy of the Commons" simply for the laypeople.
      *   **The Meet-Cute/History:** How they met (grad school). The immediate intellectual spark/conflict. Framing the arguing as flirting.
      *   **The Core Metaphor (Marriage as a Commons):** This is where the specific joke about chores/fridge goes.
      *   **Balancing the Views:** Why Priya is right (trust/rules) AND why Marcus is right (structure/accountability). Show how they complement each other.
      *   **The Emotional Turn:** Moving from theory to reality. It's not about the resources; it's about the commitment.
      *   **The Toast:** Raise a glass.

  4.  **Drafting - Refining the Tone:**
      *   *Check:* Is it too academic? *Fix:* Explain Ostrom/Hardin simply.
      *   *Check:* Is it taking sides? *Fix:* Ensure both get a "win." Priya brings the trust, Marcus brings the structure.
      *   *Check:* Is the fridge joke funny? *Fix:* Make it relatable. "Who ate the last yogurt?"
      *   *Check:* Is it affectionate? *Fix:* Emphasize that the arguing is a form of intimacy.

  5.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. For the family, Priya and Marcus are economists. They fight about cows in a field. Priya thinks cows share fine. Marcus thinks cows eat everything. They met in grad school arguing. Now they are married. Marriage is like a field. Who does dishes? Priya says talk it out. Marcus says make a chart. They are perfect together. Love you both. Cheers.
      *Critique:* Too dry. Needs more warmth and specific wording.

  6.  **Writing - Iteration 2 (Adding Flavor & Jokes):**
      (Start with the audience split.) "Half of you know what a hedonic price model is, half of you just know where the open bar is."
      (Explain the theory.) "Imagine a pasture. Marcus says if everyone shares it, it dies. Priya says neighbors can fix it."
      (The Fridge Joke.) "In their apartment, the milk is the commons. Marcus wants a lock. Priya wants a meeting."
      (The Love Story.) "They didn't fall in love despite the arguing. They fell in love because of it."
      (The Conclusion.) "Marriage isn't a tragedy. It's a partnership."

  7.  **Polishing and Timing (The Actual Draft):**
      *   *Word Count Check:* A 5-minute toast is roughly 750 words.
      *   *Audience Bridge:* Need to make sure the family feels included, not alienated by jargon.
      *   *Neutrality:* Make sure Marcus doesn't sound like a killjoy and Priya doesn't sound naive.

      *(Self-Correction during drafting)*: I need to make sure I don't imply Marcus is *too* rigid. Frame his "regulation" as "reliability." Frame Priya's "commons" as "trust."

      *(Refining the Fridge Joke)*: Let's make it about the last slice of pizza or the thermostat. No, the prompt specifically asked for chores or fridge. Let's go with the fridge. It's a classic shared resource.

      *(Refining the Ending)*: Needs to be punchy. "To the Commons" sounds weird. "To Priya and Marcus" is standard. Maybe "To the successful management of their shared resources."

  8.  **Final Review against Constraints:**
      *   5 minutes? Yes.
      *   Ostrom vs. Hardin? Yes.
      *   Fridge/Chores joke? Yes.
      *   Neutral? Yes.
      *   Affectionate? Yes.

  9.  **Final Polish:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I've had the privilege of watching Priya and Marcus navigate the treacherous waters of grad school, the job market, and now, the even more treacherous waters of merging two lives into one.

  Looking around the room, I realize we have a bit of a split audience. About half of you are economists who probably already have a regression model running in your heads to predict the success of this marriage. The other half are family members who are just happy to be somewhere where the dress code is nicer than a departmental seminar.

  So, for the family: Priya and Marcus are economists. But specifically, they are economists who have been arguing about the same thing since the day they met.

  They met in a hallway outside a lecture hall. Priya was carrying a dog-eared copy of Elinor Ostrom's *Governing the Commons*. Marcus was holding a printout of Garrett Hardin's *The Tragedy of the Commons*.

  For the non-economists, here is the ten-second version of their seven-year flirtation. Imagine a shared pasture where farmers graze their cows. Marcus, following Hardin, argues that if you leave that pasture to the people, it's doomed. Everyone acts in their own self-interest, the grass gets eaten, and the whole system collapses. He believes you need clear ownership or a strict regulator to save us from ourselves.

  Priya, following Ostrom, argues that people aren't idiots. She believes that with trust, communication, and local rules, a community can manage a shared resource beautifully without anyone pointing a gun or drawing a property line.

  Marcus thinks Priya is a hopeless romantic who trusts too much. Priya thinks Marcus is a cynic who trusts too little.

  They have been debating this ever since. But here is the thing I've realized: Their relationship isn't a contradiction of their theories. It is the proof that they are both right.

  Because, let's be honest: Marriage is the ultimate common-pool resource.

  Think about their apartment. The fridge, for example. That is a shared ecosystem. There are limited resources—leftovers, condiments, that one jar of fancy pickles nobody wants to admit they bought.

  Early in their cohabitation, there was a crisis. The "Great Yogurt Shortage of 2021." Marcus's instinct was to install a digital lock on the dairy drawer and assign property rights. Priya's instinct was to call a household meeting to establish social norms regarding spoon usage.

  In the end, they did neither. Well, mostly neither. I think Marcus got a spreadsheet for the grocery bill, and Priya instituted a "check-in before you eat the last slice" policy.

  It works because Marcus provides the structure. He makes sure the bills are paid on time, that the 401k is funded, that the rules of the house are clear. He prevents the tragedy. But Priya provides the trust. She makes sure the home feels like a community, not a corporation. She ensures that when life gets hard, they don't retreat into self-interest, but lean into cooperation. She prevents the tragedy from ever starting.

  If they were both Priya, they'd have a lot of beautiful meetings about how to load the dishwasher, but the dishes might never actually get done. If they were both Marcus, the dishes would be done efficiently, but they'd probably be fighting over who used more soap.

  But together? They have found the equilibrium.

  To the family: You might not care about fisheries economics or privatization. But you know that a good marriage requires two things. It requires the faith that you're in this together, and the discipline to show up even when you're not feeling it. Priya brings the faith. Marcus brings the discipline.

  They have spent years proving that you can disagree fundamentally on how the world works, and still build a world that works for the two of you. They have turned their intellectual friction into emotional warmth.

  So, I'd like to propose a toast.

  To Priya and Marcus. May your shared resources never be depleted. May your transaction costs be low. And may you always remember that while Marcus might be right about the cows in the pasture, Priya is right about the people in the house.

  To the happy couple!
