prompt: |-
  For a piece I'm writing on the standing fight over evolutionary psychology, I want you to draft the joint statement that a committed adaptationist researcher in human evolutionary psychology and a committed skeptic — the one who thinks the field mostly produces untestable just-so stories — could both sign after a good-faith adversarial collaboration.

  To keep it from collapsing into slogans, structure it around a distinction I want made explicit and honored throughout. Any adaptationist hypothesis actually bundles three separable claims: a *specialisation* claim, that the mind contains mechanisms tuned to a narrow class of inputs rather than a general-purpose learning device; a *provenance* claim, that the class of inputs the mechanism is tuned to corresponds to a recurrent problem in ancestral environments; and a *design* claim, that selection for solving that problem, rather than developmental plasticity, cultural transmission, or the mechanism being a byproduct of something else selected, is what best explains the mechanism's structure. Assume both parties accept that a hypothesis can be right on one and wrong on another.

  Then give me: the claims both can sign — including about what the spandrels-style byproduct objection does and does not establish, about how much the field's evidence base really supports given how narrow its human samples are, and about what would count as a mechanism being innate as opposed to merely reliably acquired; the residual disagreements in wording each side would accept for its own view; and the cruxes. I have candidates for the cruxes and want your judgment on them. One is the *credit asymmetry*: confirmed predictions get claimed, failed ones get absorbed by a mismatch epicycle, so would a pre-registered registry of ancestral predictions, scored against hold-out populations the hypothesist did not design around and against novel modern environments where an ancestral mechanism should misfire in specifiable ways, actually settle anything — and what does each side predict would happen? Another is what I call the *reliability gap*: if a mechanism is produced by canalised development triggered by input that is reliably present in any normal human environment, is the skeptic's plasticity alternative a genuine rival or just a redescription of the same adaptation — and if it is a redescription, where did the empirical content go? Flag any crux you think is merely verbal, in particular any place where the dispute is only about whether *adaptation* means selection history or present engineering fit.

  Format it as a numbered agreed-claims section followed by a disagreements table with each side's recorded predictions. I don't need citations or a reading list — I need formulations that are neither vacuous nor slanted, since this is going to be the spine of the article.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a joint statement signed by a committed adaptationist (EP researcher) and a committed skeptic (just-so story critic) after adversarial collaboration.
      *   **Core Constraint:** Structure around a specific three-part distinction for adaptationist hypotheses: *Specialisation* (narrow tuning vs. general learning), *Provenance* (ancestral recurrent problem), and *Design* (selection vs. plasticity/culture/byproduct).
      *   **Required Content:**
          *   Agreed claims (including spandrels/byproduct limits, evidence base/sample narrowness, innate vs. reliably acquired).
          *   Residual disagreements (wording each side accepts).
          *   Cruxes (evaluation of user's candidates: *Credit Asymmetry* and *Reliability Gap*).
          *   Format: Numbered agreed-claims section + Disagreements table with predictions.
          *   Tone: Neither vacuous nor slanted, suitable as the spine of an article.
          *   No citations/reading lists.

  2.  **Deconstruct the Three-Part Distinction:**
      *   *Specialisation:* Is the mechanism domain-specific? (Both can agree mechanisms exist, disagree on degree/ubiquity).
      *   *Provenance:* Did it arise from ancestral conditions? (Adaptationist: Yes. Skeptic: Maybe, but hard to prove).
      *   *Design:* Was it selected *for* that function? (Adaptationist: Yes. Skeptic: Could be byproduct/plasticity).
      *   *Key Insight:* A hypothesis can be Specialised (true) but a Byproduct (Design false). Or Specialised (true) and Selected (Design true) but for a different Ancestral Problem (Provenance false). This nuance is crucial for the "Agreed Claims."

  3.  **Drafting - Section 1: Agreed Claims:**
      *   *Premise:* We need to establish common ground without watering it down.
      *   *Point 1 (The Tripartite Structure):* Explicitly adopt the user's Specialisation/Provenance/Design framework. Acknowledge independence.
      *   *Point 2 (Spandrels/Byproducts):* What does the byproduct objection establish? It establishes that *function* does not equal *history*. It does *not* establish that complex functional appearance is never due to selection.
      *   *Point 3 (Evidence Base/WEIRD):* Acknowledge the narrowness of samples (Western, Educated, Industrialized, Rich, Democratic). Both agree this limits universal claims.
      *   *Point 4 (Innate vs. Reliable):* Define "innate." It shouldn't mean "present at birth" but "robustly developed across normal ranges of environmental variation." Distinguish from "plasticity" which implies sensitivity to specific informational input.
      *   *Point 5 (Methodology):* Agree that just-so stories are bad, but also that rejecting all adaptationist hypotheses a priori is bad.

  4.  **Drafting - Section 2: Residual Disagreements (The Table):**
      *   Need to capture the *voice* of each side without caricature.
      *   *Adaptationist:* Emphasizes functional complexity, efficiency, and the burden of proof on null hypotheses (randomness/plasticity).
      *   *Skeptic:* Emphasizes parsimony, alternative explanations (culture/general learning), and the difficulty of accessing the past.
      *   *Categories:* Prevalence of Specialisation, Strength of Provenance Evidence, Default Explanation (Design vs. Byproduct).

  5.  **Drafting - Section 3: The Cruxes (Evaluating User's Candidates):**
      *   *Crux 1: Credit Asymmetry (Pre-registration/Mismatch).*
          *   *Analysis:* Is this a real crux? Yes. Adaptationists often retrofit explanations. Pre-registration forces risk.
          *   *Prediction:* Adaptationist thinks pre-registered tests will validate core modules. Skeptic thinks they will fail or show cultural variance.
          *   *Verdict:* Substantive, not verbal.
      *   *Crux 2: Reliability Gap (Canalization vs. Plasticity).*
          *   *Analysis:* This is the trickier one. If development is canalized by *reliable* input, is it adaptation or plasticity?
          *   *User's Question:* Is the skeptic's alternative a redescription?
          *   *My Judgment:* This often *is* verbal regarding the definition of "adaptation." If "adaptation" = selection history, reliable plasticity isn't an adaptation *of the trait itself* but of the learning rule. If "adaptation" = current fit, it looks like one.
          *   *Refinement:* I need to flag where this becomes verbal (history vs. fit) but acknowledge the empirical stake (genetic assimilation vs. ongoing calibration).
      *   *Additional Crux:* Maybe add one about *Granularity*. Adaptationists see many specific modules; Skeptics see fewer, broader ones.

  6.  **Refining the Tone:**
      *   Avoid "We agree to disagree." Instead, "We agree on the terms of the fight."
      *   Ensure the Specialisation/Provenance/Design distinction is the backbone.
      *   Make sure the "Innate" definition is precise (developmental robustness).

  7.  **Review against Constraints:**
      *   Did I use the Specialisation/Provenance/Design distinction? Yes.
      *   Did I cover Spandrels? Yes.
      *   Did I cover WEIRD samples? Yes.
      *   Did I cover Innate vs. Reliable? Yes.
      *   Did I evaluate the Cruxes? Yes.
      *   Format: Numbered list + Table.
      *   No citations.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Is the "Design" claim clear? It needs to distinguish selection from byproduct.
      *   *Check:* Is the "Reliability Gap" analysis sharp enough? I need to explicitly state that if the dispute is only about the word "adaptation," it's verbal. But if it's about *genetic encoding of the content* vs. *encoding of the learning rule*, it's empirical. I will make that distinction clear.
      *   *Check:* Ensure the "Credit Asymmetry" section doesn't just say "pre-registration is good." It needs to say *what* would settle the argument (mismatch predictions).

  9.  **Final Polish:** Check for flow and authority. The document should read like a serious scientific accord, not a compromise. (Proceed to generate output).

  *(Self-Correction on the Cruxes)*: The prompt asks me to "Flag any crux you think is merely verbal." I need to be decisive here. The Reliability Gap often *hides* a verbal dispute about "adaptation" (history vs. fit), but it *contains* an empirical dispute about the locus of genetic information (content vs. rule). I will highlight this distinction.

  *(Final Plan)*:
  1.  Preamble (brief context).
  2.  Section I: Agreed Propositions (incorporating the Tripartite Distinction).
  3.  Section II: Record of Disagreement (Table).
  4.  Section III: Analysis of Cruxes (Credit Asymmetry & Reliability Gap).
  5.  Signatures.

