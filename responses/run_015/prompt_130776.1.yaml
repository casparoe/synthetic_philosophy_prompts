answer: |-
  **JOINT STATEMENT ON THE STATUS OF HUMAN EVOLUTIONARY PSYCHOLOGY**

  **Signatories:** [Name], Proponent of Adaptationist Framework; [Name], Proponent of Structural/Skeptical Framework.
  **Date:** October 26, 2023
  **Context:** Result of Adversarial Collaboration regarding the epistemic standards of evolutionary psychology (EP).

  ### I. AGREED PROPOSITIONS

  We, the undersigned, acknowledge that public debate regarding human evolutionary psychology has frequently conflated distinct empirical claims, leading to dialogues of the deaf. To clarify the evidentiary burden and the scope of legitimate inference, we agree to the following propositions:

  **1. The Tripartite Structure of Adaptationist Hypotheses**
  We agree that any standard adaptationist hypothesis bundles three logically separable claims. A researcher may be correct on one and incorrect on another without the entire framework collapsing. These claims are:
  *   **Specialisation:** The mind contains mechanisms tuned to a narrow class of inputs (domain-specific) rather than operating solely as a general-purpose learning device.
  *   **Provenance:** The class of inputs the mechanism is tuned to corresponds to a recurrent problem structure in ancestral environments (the Environment of Evolutionary Adaptedness, or EEA).
  *   **Design:** Selection for solving that specific ancestral problem, rather than developmental plasticity, cultural transmission, or spandrel/byproduct status, is the best explanation for the mechanism's current structure.

  **2. The Limits of the Byproduct (Spandrel) Objection**
  We agree that demonstrating a trait is a byproduct establishes that the trait's *current utility* does not prove its *selection history*. However, we agree that the byproduct objection does *not* establish that complex functional appearance is *never* the result of direct selection. The burden is on the adaptationist to rule out byproduct status for specific mechanisms, but the burden is on the skeptic to demonstrate that a plausible byproduct explanation accounts for the data better than a selectionist one.

  **3. The Evidence Base and Sampling**
  We agree that the current evidence base for universal human psychological mechanisms is disproportionately drawn from Western, Educated, Industrialized, Rich, and Democratic (WEIRD) populations. We acknowledge that findings derived exclusively from these samples cannot definitively support **Provenance** claims (which require cross-cultural or ancestral inference) or strong **Specialisation** claims (which require ruling out cultural homogeneity). Claims of universality made without cross-cultural validation are provisionally treated as claims about local phenotypes.

  **4. Innateness vs. Reliable Acquisition**
  We agree to abandon the definition of "innate" as "present at birth" or "independent of environment." Instead, we define a mechanism as **developmentally robust** if it emerges reliably across the normal range of human environmental variation.
  *   We agree that **Reliable Acquisition** (a mechanism triggered by input present in all normal human environments) is empirically indistinguishable from **Genetic Canalisation** (a mechanism built regardless of specific informational input) without intervention studies (e.g., deprivation or novel environment experiments).
  *   Therefore, labeling a trait "innate" is not an explanation; it is a placeholder for a specific developmental trajectory that must be mapped.

  **5. Methodological Standards**
  We agree that post-hoc storytelling regarding ancestral function constitutes a hypothesis generator, not a confirmation. We further agree that rejecting all adaptationist hypotheses *a priori* is as dogmatic as accepting them without rigorous testing. The field requires pre-registered predictions that risk falsification.

  ***

  ### II. RECORD OF DISAGREEMENT

  While we agree on the standards above, we disagree on the prior probabilities assigned to competing explanations and the interpretation of existing data.

  | Domain of Dispute | Adaptationist Position (Signatory A) | Skeptic Position (Signatory B) |
  | :--- | :--- | :--- |
  | **Prevalence of Specialisation** | **High.** The computational complexity of adaptive problems (e.g., cheater detection, mate selection) requires domain-specific modules. General learning is too slow and data-hungry to solve these alone. | **Moderate to Low.** Many purported modules can be parsimoniously explained by domain-general associative learning or cultural evolution operating on ancient constraints. |
  | **Strength of Provenance Evidence** | **Sufficient.** Converging lines of evidence (paleoanthropology, primatology, cross-cultural universals) allow for robust reconstruction of ancestral selection pressures. | **Insufficient.** The EEA is a composite construct, not a specific time/place. Inferring specific selection pressures from modern behavior is prone to confirmation bias. |
  | **Default Explanation (Design)** | **Selection.** Complex functional design is the signature of natural selection. The null hypothesis should be randomness or drift, not plasticity, as plasticity itself requires an evolutionary explanation. | **Plasticity/Byproduct.** Given the cost of maintaining genetic hardware, developmental plasticity is the null. Apparent "design" may be the output of flexible systems responding to modern cues. |
  | **Interpretation of Mismatch** | **Confirmatory.** Maladaptive behavior in modern environments (e.g., obesity, phobias) confirms the existence of ancestral mechanisms tuned to past conditions. | **Ambiguous.** Mismatch is consistent with adaptation, but also with any system optimized for a different context. It does not identify *which* mechanism is ancestral. |

  ***

  ### III. ANALYSIS OF CRUXES

  We identify the following as the decisive empirical battlegrounds. We note where disputes appear substantive versus verbal.

  **1. The Credit Asymmetry Crux**
  *   **The Issue:** Adaptationist hypotheses often absorb failed predictions via "mismatch epicycles" (e.g., "It worked in the past, but fails now"), while successful predictions are claimed as validation. This creates an unfalsifiable shield.
  *   **Proposed Resolution:** A pre-registered registry of ancestral predictions scored against:
      1.  Hold-out populations the hypothesist did not design around.
      2.  Novel modern environments where an ancestral mechanism should *misfire* in specifiable ways (not just "fail," but fail *specifically*).
  *   **Signatory A Prediction:** Pre-registered mismatch predictions will validate the existence of specific modules. The pattern of errors will be non-random and consistent with ancestral logic.
  *   **Signatory B Prediction:** Pre-registered tests will reveal that "mismatch" explanations are post-hoc rationalizations. Variance will be better predicted by cultural variables or general learning parameters than by ancestral logic.
  *   **Verdict:** **Substantive.** This moves the field from narrative fitting to risk-bearing prediction.

  **2. The Reliability Gap Crux**
  *   **The Issue:** If a mechanism is produced by canalized development triggered by input reliably present in *any* normal human environment (e.g., gravity, bipedalism, face exposure), is the skeptic's "plasticity" alternative a genuine rival or just a redescription?
  *   **Analysis:** This crux contains both a verbal and an empirical component.
      *   *Verbal Component:* The dispute is verbal if "adaptation" is defined differently. If Adaptationist means "selected history" and Skeptic means "current engineering fit," they talk past each other. A trait can be an adaptation (history) that operates via plasticity (mechanism).
      *   *Empirical Component:* The dispute is substantive regarding the **locus of genetic information**.
          *   **Hypothesis 1 (Adaptationist):** The genome encodes the *content* of the mechanism (e.g., specific grammar rules).
          *   **Hypothesis 2 (Skeptic):** The genome encodes the *learning rule* that acquires the content from reliable environmental cues.
  *   **Resolution:** The crux is settled only by deprivation studies or artificial environment experiments. If a trait develops without the "reliable" input, it is canalized content. If it fails to develop, it is plastic acquisition.
  *   **Verdict:** **Mixed.** We flag that much current debate is verbal (definitions of adaptation). The empirical core is the *locus of information* (content vs. rule).

  **3. The Granularity Crux (Added)**
  *   **The Issue:** How many mechanisms exist?
  *   **Signatory A:** Hundreds of specific programs.
  *   **Signatory B:** Dozens of broad biases.
  *   **Verdict:** **Substantive.** This is a claim about cognitive architecture complexity that can be tested via interference tasks and neural imaging.

  ***

  **Signed:**

  _________________________ (Adaptationist Researcher)

  _________________________ (Skeptical Researcher)
