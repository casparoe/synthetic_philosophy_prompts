          *   *Fix:* Mid-session. After the first elimination. Crucial for iteration.
      *   *Misconception 3: Iteration stops too soon.* (Not seeing how removing a strategy changes the hull).
          *   *Fix:* During the iteration phase.
      *   *Sequence:* Define MSD (fix MC1) -> First Elimination (fix MC2) -> Iteration (fix MC3).

