  4.  **Decision 3: Misconception Mapping**
      *   *Misconception 1: Cell-by-cell ignoring probabilities.* (Thinking $u(A, L) > u(B, L)$ and $u(A, R) > u(B, R)$ is required).
          *   *Fix:* Early. When defining dominance.
