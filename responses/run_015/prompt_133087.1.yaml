      *   *Refinement:* Actually, for a 45-minute workshop, deep geometry might bog down. A hybrid is best. Define mixed strategy as a lottery (EU), then immediately visualize it as a point in payoff space. But the prompt asks to pick one *first*. The geometric idea ("point in a simplex" / "convex hull") is the *insight* needed to understand why a pure strategy can be dominated by a mix. If I start with EU, they'll just do algebra. If I start with Geometry, they see *why* the algebra matters. Let's go with **Geometry/Convex Hull first**, grounded in payoffs.

