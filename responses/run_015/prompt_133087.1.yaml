answer: |-
  Here is the 45-minute workshop plan.

  ### 1. Session Architecture (45 Minutes)

  *   **00:00 – 05:00:** **The Geometric Hook.** Define mixed strategies as points in payoff space (Convex Hull).
  *   **05:00 – 15:00:** **Defining Mixed Dominance.** Formal definition + First Elimination (Address Misconception 1).
  *   **15:00 – 25:00:** **Iteration Logic.** Why deleting a strategy changes the hull (Address Misconception 2 & 3).
  *   **25:00 – 35:00:** **Guided Practice.** The group solves a 3x3 reduction together.
  *   **35:00 – 40:00:** **The Check Question.** Individual assessment.
  *   **40:00 – 45:00:** **Scope & Boundaries.** What we ignored and why.

  ---

  ### 2. Foundational Dependency: Geometry First
  **Start with the Geometric Idea (Simplex/Convex Hull), not Expected Utility.**

  *   **Why:** Your audience already knows Expected Utility (EU) algebra. If you start there, they will treat mixed dominance as just "more algebra." They need to see *why* the algebra works.
  *   **The Move:** Draw a 2D payoff space (Payoff vs. Opponent's Move L, Payoff vs. Opponent's Move R). Plot the pure strategies as points. Draw the line segment connecting them.
  *   **The Insight:** Show that any mixture lies *on* that line segment. If a third pure strategy lies strictly *below* that line segment in all dimensions, it is dominated by the mixture.
  *   **Then:** Introduce EU algebra merely as the tool to calculate the coordinates of those points.

  ---

  ### 3. Example Selection: The Auction vs. 2x2
  **Do not use the 3-bidder auction as your primary teaching example.** Do not use 2x2 Matching Pennies.

  *   **What's wrong with the Auction:** It introduces continuous strategy spaces (budgets) and multi-dimensional actions (inspection + bid). In a 45-minute session, this confuses "mixed strategies over discrete actions" with "continuous pure strategies." You will spend 20 minutes defining the payoff function and 0 minutes on dominance.
  *   **What's wrong with 2x2 Matching Pennies:** There are **no dominated strategies** (pure or mixed) in standard Matching Pennies. It is a zero-sum game with a unique mixed NE, but nothing gets eliminated. It is useless for teaching IEDS.
  *   **The Fix:** Use a **3x3 Discrete Matrix** (Row player has 3 strategies, Column has 3).
      *   *Framing:* If you love the auction flavor, discretize it. "Bid Low, Bid Med, Bid High."
      *   *Structure:* Ensure Row 2 (Middle) is dominated by a 50-50 mix of Row 1 (Low) and Row 3 (High).
      *   *Why:* This isolates the mechanic. It allows them to see the "Convex Hull" of Rows 1 and 3 covering Row 2 without getting lost in auction theory.

  ---

  ### 4. Misconception Map: Intervention Points

  | Misconception | When it hits | Where you intervene |
  | :--- | :--- | :--- |
  | **1. Cell-by-Cell Checking**<br>("I need $u(A, L) > u(B, L)$ AND $u(A, R) > u(B, R)$") | **Minute 10**<br>(During Definition) | **Intervention:** Explicitly write the inequality: $\sum \sigma_i u(s_i, s_{-i}) > u(s', s_{-i})$. <br>**Say:** "You are allowed to lose against Column L if you win *enough* against Column R. We compare *expected* payoffs, not cell outcomes." |
  | **2. NBR vs. Strictly Dominated**<br>("If it's not a best response, I can delete it.") | **Minute 20**<br>(Before Iteration) | **Intervention:** Distinguish the concepts. <br>**Say:** "We are doing *Strict Dominance*. A strategy can be 'never a best response' but still survive strict dominance iteration in some games. Stick to the inequality check. Do not delete just because it looks suboptimal." |
  | **3. Static Hull**<br>("I removed Row 2, but the mix for Row 1 & 3 is the same.") | **Minute 25**<br>(During Round 2) | **Intervention:** Show how Column player's deletion changes Row's hull. <br>**Say:** "When Column deletes 'High', the payoff vector changes. The line segment between Low and High *shortens*. A mix that didn't dominate before might dominate now." |

  ---

  ### 5. End-of-Session Check Question
  **Goal:** Force comparison of two mixtures without solving for NE.

  **The Setup:**
  Provide this payoff matrix (Row Player):
  $$
  \begin{array}{c|ccc}
   & L & C & R \\
  \hline
  T & 6 & 0 & 0 \\
  M & 2 & 2 & 2 \\
  B & 0 & 0 & 6 \\
  \end{array}
  $$

  **The Question:**
  "Consider Mixed Strategy $\sigma_A = (0.5 T, 0.5 B)$ and Mixed Strategy $\sigma_B = (1.0 M)$.
  1. Calculate the expected payoff vector for $\sigma_A$ against $(L, C, R)$.
  2. Does $\sigma_A$ strictly dominate $\sigma_B$? Does $\sigma_B$ strictly dominate $\sigma_A$?
  3. Justify using the dominance inequality, not by finding a Nash Equilibrium."

  **The Answer Key (For You):**
  1.  $\sigma_A$ vector: $(3, 0, 3)$.
  2.  $\sigma_B$ vector: $(2, 2, 2)$.
  3.  Neither dominates the other. $\sigma_A$ beats $\sigma_B$ on L and R ($3>2$), but $\sigma_B$ beats $\sigma_A$ on C ($2>0$).
      *   *Why this works:* It forces them to compute the mixture vector and compare component-wise. It catches those who assume "mixing is always better" or who only check one column.

  ---

  ### 6. Scope Boundaries: What to Refuse
  Openly state these exclusions at the start and end to manage expectations:

  1.  **No Linear Programming:** "We are checking dominance by inspection and simple algebra. We will not formulate this as a linear program to find the optimal dominating mix."
  2.  **No Continuous Games:** "We are restricting ourselves to finite normal-form games. We are not handling continuous bid functions or infinite strategy spaces today."
  3.  **No Weak Dominance:** "We are only eliminating *Strictly* Dominated strategies. Weak dominance creates order-dependence problems we are ignoring for this session."
  4.  **No Equilibrium Computation:** "We are stopping at Iterated Elimination. We are not calculating the final Nash Equilibrium probabilities."

  ### Facilitator Notes
  *   **Typo Check:** Your prompt mentioned "three-bidder silent auction." In game theory, a 3-player game makes dominance checking significantly harder (you have to mix over two opponents' strategy profiles). **Simplify to 2-players** for the workshop. The logic of mixed dominance is identical, but the arithmetic is 50% faster.
  *   **Board Work:** Draw the Convex Hull. Literally draw the triangle/line. Econ grads trust pictures more than sums when learning new geometry.
  *   **Pacing:** If they get stuck on the arithmetic of the Check Question, walk them through the first column only. The concept (comparing vectors) matters more than the arithmetic speed.
