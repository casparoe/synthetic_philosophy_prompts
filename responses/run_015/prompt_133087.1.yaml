      *   *Idea:* Give a reduced matrix. Ask if Mix A dominates Mix B.
      *   *Better:* Give a game where a specific mix dominates a pure strategy, but only *after* another strategy is removed.
      *   *Best:* A specific numerical comparison. "Given Opponent plays L with prob $q$, does Mix $\sigma$ yield higher EU than Pure $S$?" No, that's BR.
      *   *Prompt Requirement:* "Compare two specific mixed strategies without computing full best-response correspondences."
