prompt: |-
  I've somehow let myself be talked onto my country's advisory panel on technological risk — six meetings a year, no staff of our own, a mandate that basically just says we're supposed to weigh uncertain risks before they land. I'm the token philosopher. I've been reading back through our decisions since 2019 because we've got a genuinely nasty one coming up and I'd like to say something non-embarrassing, and the thing that's bugging me is that I can read our own track record two or three different ways and I can't tell which one is actually ours.

  What we've done so far, compressed:

  - Insect-resistant GM maize: ok'd contained field trials, told them to hold off commercial planting for five years pending gene-flow and soil studies.
  - A flame retardant used in children's mattresses, thin evidence of developmental harm, a cheap substitute already on the market: recommended phasing it out.
  - Radio-frequency exposure from mobile masts, weak and contested epidemiology, nothing really to substitute for it, and a mast can be turned down or moved: no restriction, just disclosure and voluntary siting guidance.
  - A degreasing solvent with forty years of use behind it, small and uncertain carcinogenic risk, a ban would gut a domestic industry: no restriction, monitoring only.
  - A few years back, during the epidemic, a vaccine with incomplete safety data: we recommended rolling it out immediately, on the grounds that delay had a body count of its own.
  - A consumer credit scoring model using postcode-level proxies, no demonstrated disparate impact: we told them to drop the proxies, because the people on the receiving end couldn't see the decision, couldn't contest it, and couldn't get out of its way.
  - A proposal to sell mild cognitive enhancers from vending machines on campuses: we came out against it even though the safety data was decent, mainly because once everyone's taking them, not taking one stops being a free choice.

  The live case. A ministry wants to require that every smart speaker and every microphone-equipped TV sold here ship with an always-on ambient audio classifier, running locally on the device, listening for three things: falls and speech-pattern collapse in the over-70s, and sounds of violence between adults in the home. On a hit it alerts a human-staffed centre that can send an ambulance or the police. No raw audio leaves the device — only a flag and a twenty-second clip from around the moment of the hit. Mandatory on all new devices, so roughly four years to near-universal household coverage; no opt-out for the purchaser, though of course anyone can unplug the thing. The vendor says the false-positive rate is low but won't publish the numbers, and the proposed evaluation is a twelve-month pilot in two cities with the metrics chosen by the vendor. The ministry considered and rejected the alternative of subsidising personal alarm pendants plus an awareness campaign: about five times the cost per life-year and far lower coverage.

  Here's what I'd like from you. What should we decide if we want to be consistent with ourselves — wave it through, wave it through with conditions, or recommend against — and which of our seven is the closest analogue, and why that one rather than the others? The three rules I keep coming back to for our record are something about how bad the worst case is, something about whether the people bearing the risk opted in and can get out, and something about whether we can unwind the thing later; I suspect at least two of those come apart on this case, and I want to know which, what each predicts, and which one you'd bet we're really running. If our precedents genuinely underdetermine it, tell me what principle we'd be committing ourselves to with each of the three options, because that's what I'll end up saying out loud. And if you could design the variant of this case that would best tell the competing rules apart — change one feature at a time — that's the bit I'd find most useful, since I might actually get to ask for it.

  One more thing I'm unclear on and you can take or leave it: everything we've ever ruled on has been a substance or a machine, and this is arguably a change in what people do to each other in their own kitchens. Does that matter for whether our whole way of talking applies, or is that a distinction without a difference? Sorry, this got long — hope it's not too much.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Token philosopher on a national advisory panel on technological risk.
      *   **Task:** Needs to make a coherent recommendation on a new, complex case (mandatory ambient audio classifiers in smart speakers/TVs) based on the panel's past seven decisions.
      *   **Goal:** Wants to be "non-embarrassing" (consistent, principled) and understand the underlying logic of the panel's track record.
      *   **Constraints:** Six meetings a year, no staff, mandate to weigh uncertain risks.
      *   **Input Data:** Seven past cases (GM maize, flame retardant, RF masts, degreasing solvent, pandemic vaccine, credit scoring, cognitive enhancers). One live case (mandatory audio surveillance for safety).
      *   **User's Hypotheses:** Three potential rules: (1) Severity of worst case, (2) Consent/Opt-out ability, (3) Reversibility/Unwinding.
      *   **Specific Requests:**
          1.  Recommendation (Wave through, Conditions, Against) based on consistency.
          2.  Identify the closest analogue among the seven and explain why.
          3.  Analyze the three rules (Severity, Consent, Reversibility) – where do they split? Which one drives the panel?
          4.  If underdetermined, state the principle committed to by each option.
          5.  Design a "variant case" to test the competing rules.
          6.  Address the "substance/machine vs. social behavior" question.

  2.  **Deconstruct the Past Seven Cases (The "Precedents"):**

      *   *Case 1: GM Maize.* Risk: Environmental/Gene flow. Action: Contained trials, delay commercial. *Logic:* Precautionary where irreversible ecological damage is possible, but not a ban. Reversibility matters.
      *   *Case 2: Flame Retardant.* Risk: Developmental harm (kids). Action: Phase out. *Logic:* Vulnerable population, substitute available. High severity + Low cost to switch.
      *   *Case 3: RF Masts.* Risk: Cancer (weak evidence). Action: No restriction, disclosure. *Logic:* Risk uncertain/weak, no substitute, high social utility. Opt-out difficult but risk low.
      *   *Case 4: Degreasing Solvent.* Risk: Carcinogenic (uncertain). Action: Monitor only. *Logic:* Economic impact high, risk uncertain/long-term. Status quo bias when economic cost is high.
      *   *Case 5: Pandemic Vaccine.* Risk: Safety (incomplete data). Action: Roll out immediately. *Logic:* Counterfactual risk (delay kills) outweighs direct risk. Urgency + Net lives saved.
      *   *Case 6: Credit Scoring.* Risk: Algorithmic bias/fairness. Action: Drop proxies. *Logic:* Procedural justice. Inability to contest/see decision. Power asymmetry.
      *   *Case 7: Cognitive Enhancers.* Risk: Coercion/Social pressure. Action: Against. *Logic:* "Freedom to exit" erosion. Collective action problem. Even if safe, the *social dynamic* is the risk.

  3.  **Analyze the Live Case (Mandatory Audio Surveillance):**
      *   *Technology:* Always-on mic, local processing, flags + clips sent on trigger (falls, violence, speech collapse).
      *   *Mandate:* Mandatory on new devices, 4 years to coverage, no opt-out for purchaser (can unplug).
      *   *Benefit:* Safety for elderly, violence intervention. Cost-effective vs. pendants.
      *   *Risk:* Privacy, normalization of surveillance, false positives (police/ambulance dispatch), vendor opacity (won't publish FP rates), vendor-chosen metrics.
      *   *Key Tension:* Safety/Benefit vs. Privacy/Autonomy/Surveillance Creep.

  4.  **Evaluate the User's Three Rules against the Record:**

      *   *Rule 1: Severity of Worst Case.*
          *   Matches: Flame Retardant (kids harmed), Vaccine (death), Solvent (cancer).
          *   Mismatches: Credit Scoring (financial harm vs. dignity), Enhancers (social coercion vs. health).
          *   *Verdict:* Important, but not the sole driver. The panel blocked Enhancers despite "decent safety data."
      *   *Rule 2: Consent/Opt-out (Agency).*
          *   Matches: Credit Scoring (couldn't contest/opt-out -> Blocked), Enhancers (couldn't opt-out of pressure -> Blocked), Maize (contained -> Ok, Commercial -> Delayed).
          *   Mismatches: RF Masts (public exposure, no opt-out -> Ok), Vaccine (mandatory-ish/urgent -> Ok).
          *   *Verdict:* Strong predictor when *individual agency* is removed without overriding public good (like the vaccine).
      *   *Rule 3: Reversibility/Unwinding.*
          *   Matches: Maize (gene flow irreversible -> Delayed), Solvent (industry gutted -> Hard to reverse ban -> Monitored).
          *   Mismatches:* Credit Scoring (software change, easy to reverse -> Blocked), Enhancers (social norm, hard to reverse -> Blocked).
          *   *Verdict:* Relevant for physical/ecological risks, less so for social/algorithmic risks.

      *   *Synthesis:* The panel seems to care most about **Asymmetry of Power/Agency** combined with **Availability of Alternatives**. When people are trapped (Credit, Enhancers) or vulnerable without recourse (Flame Retardant), the panel acts. When the risk is uncertain but the utility is high and alternatives low (RF Masts, Solvent, Vaccine), they tolerate risk.

  5.  **Determine the Closest Analogue:**
      *   *Candidate 1: Credit Scoring.* Both involve opaque algorithms making decisions affecting life outcomes. Both involve "cannot contest" aspects.
      *   *Candidate 2: Cognitive Enhancers.* Both involve a shift in social norms/expectations (always-on safety vs. always-on enhancement). Both involve "mandatory" aspects creating coercion.
      *   *Candidate 3: RF Masts.* Both involve ubiquitous environmental exposure.
      *   *Winner:* **Cognitive Enhancers (Case 7)** mixed with **Credit Scoring (Case 6)**.
      *   *Why:* The Enhancer case is the strongest moral match. It wasn't about safety (data was decent); it was about the *structure of choice*. "Once everyone's taking them, not taking one stops being a free choice." Here: "Once every home has this, not having one makes you a negligent risk." It changes the baseline of responsible citizenship. However, the *opacity* of the vendor (won't publish false positives) leans heavily into Credit Scoring territory (black box decision making).
      *   *Refinement:* The **Credit Scoring** analogue is technically closer regarding *mechanism* (opaque algorithm, high stakes outcome), but the **Enhancer** analogue is closer regarding *social mandate*.
      *   *Decision:* I will argue **Credit Scoring** is the procedural analogue (opaque, uncontestable), but **Enhancers** is the normative analogue (coercive environment). If forced to pick one for consistency: **Credit Scoring**. Why? Because the panel acted on *procedural injustice* (can't see/contest) even without demonstrated disparate impact. Here, we have opaque metrics and no opt-out.

  6.  **Develop the Recommendation:**
      *   *Consistency Check:* In Credit Scoring, they said "drop the proxies" because people couldn't contest. In Enhancers, they said "no" because choice was eroded. In RF Masts, they said "ok" because risk was weak and utility high.
      *   *The Crux:* The vendor won't publish false positive rates. This is the "Credit Scoring" red flag (opaque decision making). The mandate removes opt-out. This is the "Enhancer" red flag.
      *   *Recommendation:* **Recommend Against (in current form) / Wave through with Strict Conditions.**
      *   *Why:* The opacity violates the Credit Scoring precedent. The mandate violates the Enhancer precedent. The "unplug" option is insufficient (like telling credit score victims to "use cash").
      *   *Conditions:* Open source metrics, independent audit, opt-out must be meaningful (not just unplugging a TV), sunset clause.

  7.  **Address the Three Rules (Severity, Consent, Reversibility):**
      *   *Severity:* Predicts approval (falls/violence are severe).
      *   *Consent:* Predicts rejection (mandatory, no opt-out).
      *   *Reversibility:* Predicts rejection (once infrastructure is built/norms shift, hard to remove).
      *   *Conflict:* Severity pulls one way, Consent/Reversibility pull the other.
      *   *Panel's True North:* Looking at Credit & Enhancers, **Consent/Agency** seems to trump Severity when the risk is structural rather than physical. Looking at Vaccine, Severity of *inaction* trumps Consent. Here, is the severity of inaction (falls/abuse) comparable to a pandemic? Probably not.
      *   *Bet:* The panel runs on **Agency/Contestability**. (See Credit Scoring).

  8.  **Design the Variant Case:**
      *   Need to isolate variables.
      *   *Variant A (Test Consent):* Make it opt-in but subsidized heavily. (Does the panel accept it if the mandate is gone?)
      *   *Variant B (Test Opacity):* Vendor publishes full FP/FN rates, independent audit required. (Does the panel accept it if the "black box" is opened?)
      *   *Variant C (Test Reversibility):* Pilot only, no mandate, hardware designed to be disabled remotely.
      *   *Best Variant:* **The Opacity Test.** Change the vendor requirement to "Public API for error rates." If the panel still rejects it, it's about the Surveillance/Privacy (Severity of worst case). If they accept it, it was about the Credit Scoring issue (Procedural Justice).

  9.  **Address the "Substance vs. Behavior" Question:**
      *   Does it matter that this changes social interaction?
      *   Yes. Case 7 (Enhancers) proves the panel cares about *social technology*, not just hardware. Case 6 (Credit) proves they care about *informational relationships*.
      *   This is a "social machine." It fits the mandate.

  10. **Drafting the Response:**
      *   *Tone:* Professional, analytical, respectful of the philosopher's role, slightly academic but practical.
      *   *Structure:*
          1.  Diagnosis of the Panel's "Hidden Theory."
          2.  The Closest Analogue.
          3.  The Three Rules Analysis.
          4.  Recommendation.
          5.  The Variant Case Design.
          6.  The Ontological Question (Substance vs. Behavior).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Privacy is bad." The panel approved RF masts despite public fear. They approved Solvents despite cancer risk. They are *pragmatic*. The rejection must be based on *their* logic, not generic privacy advocacy. The key is the **Credit Scoring** precedent: "Couldn't see the decision, couldn't contest it." The vendor refusing to publish false positive rates is the smoking gun. That is the inconsistency if they approve this.

      *Refining the Analogue:* Actually, **Cognitive Enhancers** is arguably stronger for the *mandatory* aspect. But Credit Scoring is stronger for the *opaque algorithm* aspect. I should highlight the tension between these two. The combination is lethal for approval.

      *Refining the Rules:*
      1.  Worst Case: (Death/Abuse vs. Surveillance State).
      2.  Opt-out: (Unplugging vs. Social isolation).
      3.  Unwind: (Software update vs. Norm shift).
      *Which one drives?* The panel blocked Enhancers (Social Norm) and Credit (Procedural). They passed Solvents (Economic) and Masts (Utility). They prioritize **Contestability** and **Coercion** over **Physical Risk** when the physical risk is uncertain or manageable.

      *Final Plan:*
      1.  Identify the "Hidden Theory": It's not risk severity, it's **Power Asymmetry and Contestability**.
      2.  Analogue: **Credit Scoring** (procedural opacity) + **Enhancers** (coercive environment).
      3.  Rules Analysis: Consent/Agency is the binding constraint.
      4.  Recommendation: **Reject current proposal, propose conditions.**
      5.  Variant: Remove the opacity.
      6.  Ontology: It fits the Enhancers precedent.

  11. **Final Polish:** Ensure the voice sounds like a colleague helping a philosopher prepare for a meeting. Clear, structured, insightful. (Check word count and depth). Ensure I answer every part of the prompt.

      *Wait, one nuance:* The Vaccine case. Why was that ok? Because "delay had a body count." Does the "falls/violence" case have a comparable body count of delay? The ministry says pendants are 5x cost. That's economic, not necessarily "body count." If the pendants save lives too, just less efficiently, the Vaccine precedent (urgency) doesn't fully apply. This strengthens the rejection argument.

      *Let's write.*
answer: |-
  This is a remarkably clean track record for a bureaucratic body, which makes your task easier. You have seven data points, and they are not random. They reveal a specific, if unstated, ethical topology. You are worried about being inconsistent; I am worried you might be too generous to the ministry.

  Here is the diagnosis of your panel's "hidden theory," the analogue you need to wield, the breakdown of your three rules, and the specific variant that will settle the argument in the room.

  ### 1. The Panel's Hidden Theory: Contestability, Not Just Safety

  You suspect your rules are about severity, consent, and reversibility. Looking at the seven cases, those are factors, but they are not the *driver*.

  *   **Severity:** You approved the solvent (cancer risk) and the masts (cancer risk), but blocked the enhancers (decent safety data). Severity of physical harm is not the veto point.
  *   **Consent:** You approved the vaccine (effectively mandatory for safety) and the masts (public exposure), but blocked the credit scoring (no opt-out). Consent is not the absolute veto point.
  *   **Reversibility:** You delayed the maize (gene flow is irreversible) but blocked the enhancers (social norms are arguably harder to reverse than gene flow).

  **The actual principle:** Your panel blocks technologies where **the subject of the risk cannot contest the decision or exit the system without prohibitive cost, specifically when the operator holds asymmetric information.**

  Look at the two rejections/delays that weren't about physical ecology:
  *   **Credit Scoring:** Rejected not because it was *wrong*, but because the subject "couldn't see the decision, couldn't contest it."
  *   **Cognitive Enhancers:** Rejected because "not taking one stops being a free choice." (Exit cost became prohibitive).

  Look at the approvals:
  *   **RF Masts:** Risk weak, but crucially, "mast can be turned down or moved." (Local contestability exists).
  *   **Vaccine:** Delay had a body count. (The risk of *inaction* was the dominant variable, overriding consent).

  **The Verdict:** Your panel is a **Procedural Justice** body masquerading as a Risk Assessment body. You care less about *what* the technology does than *who holds the leverage* when it goes wrong.

  ### 2. The Closest Analogue

  You have two strong contenders, but one is the killer.

  **The Normative Analogue: Cognitive Enhancers (Case 7).**
  This matches the *social dynamic*. The ministry is creating a "responsibility norm." If every home has this, a family that doesn't (because they unplugged it) becomes presumptively negligent if an accident occurs. This mirrors the enhancer case: "once everyone's taking them, not taking one stops being a free choice."
  *   *Why it's not the winner:* The Enhancer case was about social pressure. This case has a harder edge: state mandate and algorithmic opacity.

  **The Procedural Analogue: Credit Scoring (Case 6).**
  This is the one you cite in the meeting.
  *   **The Match:** In Case 6, you rejected a model with "no demonstrated disparate impact" solely because the subjects "couldn't see the decision, couldn't contest it."
  *   **The Application:** In this live case, the vendor "won't publish the [false-positive] numbers" and the evaluation metrics are "chosen by the vendor."
  *   **The Logic:** If a citizen is flagged for police intervention based on a 20-second clip triggered by a black-box classifier, can they contest that flag? Can they audit why their TV called the cops? No. The vendor holds the information asymmetry.

  **Recommendation:** You must argue from **Case 6 (Credit Scoring)**. It is the most legally robust precedent. It establishes that *opacity itself is a risk*, regardless of the physical safety benefits.

  ### 3. Analysis of Your Three Rules

  You asked which of your three rules comes apart. Here is the tension map:

  | Rule | Prediction on Live Case | Consistency with Record |
  | :--- | :--- | :--- |
  | **1. Severity of Worst Case** | **Approve.** (Domestic violence/elderly falls are high-severity harms; surveillance privacy loss is "soft" harm). | **Weak.** You approved solvents (cancer) and masts (cancer). You weigh physical harm heavily. |
  | **2. Opt-Out / Agency** | **Reject.** (Mandatory on devices; unplugging is a "prohibitive cost" exit, akin to the Enhancer case). | **Strong.** Matches Credit (no contest) and Enhancers (no exit). Contradicts Vaccine (urgent override). |
  | **3. Reversibility** | **Reject.** (Once infrastructure/norms are set, removing surveillance is politically impossible). | **Mixed.** Matches Maize (ecological lock-in). Contradicts Solvent (industry lock-in was accepted). |

  **Which one are you really running?**
  You are running **Rule 2 (Agency/Contestability)**, but with a **Rule 1 (Severity)** override *only* when the risk of delay is immediate death (Vaccine).
  *   *The Trap:* The Ministry will argue Rule 1 (Violence/Death is severe).
  *   *The Counter:* You approved the Solvent despite cancer risk because the *industry* would be gutted (economic agency). You blocked Credit Scoring despite *financial* risk (less than death) because *individual agency* was removed.
  *   *The Bet:* Your panel prioritizes **Individual Contestability** over **Aggregate Safety**, unless the Aggregate Safety risk is immediate and catastrophic (Pandemic). Domestic violence, while terrible, does not meet the "Pandemic" threshold for overriding procedural justice.

  ### 4. The Recommendation

  **Decision:** **Recommend Against (in current form).**
  Do not suggest "conditions" yet. Conditions imply the core mechanism is sound. The core mechanism violates Case 6.

  **The Argument:**
  "We approved the vaccine because delay killed. We approved the solvent because the risk was uncertain and the economic cost of banning was high. But in Case 6 (Credit), we established that when a system makes high-stakes decisions about people's lives, **opacity is a disqualifier.** The vendor's refusal to publish false-positive rates creates an information asymmetry that prevents the citizen from contesting a police dispatch. Until the metrics are independent and public, this is not a safety device; it is an unaccountable authority."

  **If forced to offer a path to approval (The "Conditions"):**
  1.  **Independent Audit:** Metrics and false-positive rates must be verified by a third party, not the vendor.
  2.  **Right to Explanation:** Households must have a mechanism to query why a flag was triggered (data access).
  3.  **Meaningful Opt-Out:** "Unplugging" is insufficient. There must be a hardware switch or a subsidized alternative (pendant) that does not carry a social stigma or insurance penalty.

  ### 5. The Variant Case (To Test the Rules)

  You asked for a variant that separates the competing rules. You want to know if the panel cares about the *Surveillance* (Severity/Privacy) or the *Opacity* (Contestability).

  **Proposed Variant:**
  > "Same mandate, same technology. However, the vendor is now **required by law to publish real-time false-positive/negative rates per demographic**, and every household receives a **quarterly log of all triggers** with a dedicated ombudsman to contest false alarms."

  *   **If the panel still rejects this:** Your true principle is **Rule 1 (Severity of Privacy/Surveillance)**. You believe ambient listening is inherently unacceptable regardless of safeguards. (This would contradict the RF Masts case where exposure was accepted).
  *   **If the panel accepts this:** Your true principle is **Rule 2 (Contestability)**. The problem was never the listening; it was the lack of recourse. (This aligns with Credit Scoring).

  **Why this helps you:** If you propose this variant in the meeting and the Ministry rejects *it*, you have exposed that their goal is not safety (which would welcome transparency) but **deployment speed and liability shielding**. That allows you to write a dissenting opinion that looks principled, not Luddite.

  ### 6. The Ontological Question (Substance vs. Behavior)

  *"Everything we've ever ruled on has been a substance or a machine, and this is arguably a change in what people do to each other... Does that matter?"*

  **It matters, but you have precedent to cover it.**
  Case 7 (Cognitive Enhancers) was not about a substance's toxicity; it was about the **social environment** the substance created. You ruled on the *context of use*, not just the chemistry.
  Case 6 (Credit Scoring) was about **informational relationships**, not physical machinery.

  **The Line to Draw:**
  "Our mandate covers technological risk. A technology that alters the **power dynamic between citizen and state** or **citizen and citizen** creates a risk profile indistinguishable from physical harm. In Case 7, we recognized that a drug can be 'safe' but the *situation* it creates is hazardous. Here, the microphone is safe; the *obligation* to host it is the hazard."

  ### Summary for your Statement

  1.  **Anchor:** Cite **Case 6 (Credit Scoring)**. Opacity + High Stakes = Rejection.
  2.  **Distinguish:** Distinguish from **Case 5 (Vaccine)**. This is not an immediate existential crisis where delay kills at scale; pendants exist as an alternative.
  3.  **Principle:** "We do not approve systems where the subject cannot contest the algorithm's judgment."
  4.  **Leverage:** Offer the **Variant (Independent Audit + Logs)**. If they refuse that, they reveal the risk is to *their* liability, not public safety.

  You are not the token philosopher; you are the only one tracking the logical consistency of the record. The others see safety; you see structure. Stick to the structure.
