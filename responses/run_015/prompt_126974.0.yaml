answer: |-
  ### Reasoning Outline

  1.  **Define the Standard Gene-Meme Analogy:**
      *   **Replicator:** A unit of information that passes its structure intact through successive replications (high fidelity). In biology, this is the gene (DNA sequence). In culture, this is the "meme" (idea, tune, practice).
      *   **Interactor/Vehicle:** The entity that interacts with the environment, causing the differential survival of the replicator. In biology, this is the organism/phenotype. In culture, this is the human mind, behavior, or artifact.
      *   **Conditions for Discrete Replicators:** To count as a Darwinian unit, a cultural element must possess *longevity* (persist over time), *fecundity* (be copied many times), and crucially, *fidelity* (be copied with enough accuracy to maintain identity distinct from blending). It must be individuated—there must be a fact of the matter about whether Unit A is a copy of Unit B or a independent invention.

  2.  **Select the Concrete Example:**
      *   **Domain:** Legal Reasoning (specifically the doctrine of *stare decisis* or precedent).
      *   **Why:** It mimics inheritance (past cases bind future ones) but relies on interpretation rather than copying.

  3.  **Identify the Components and the Collapse:**
      *   **Proposed Replicator:** The legal rule or principle (the *ratio decidendi*).
      *   **Proposed Interactor:** The judicial opinion, the court, or the specific legal argument.
      *   **The Structural Failure:** In biology, the replicator (genotype) causally contributes to the interactor (phenotype), and lineage is tracked via physical continuity. In law, the "rule" (replicator) does not exist independently of the "argument" (interactor). The identity of the rule is determined *retrospectively* by how future courts interpret it.
      *   **Type of Collapse:** Individuation Boundary. There is no non-arbitrary boundary separating one legal meme from another because the "copying" mechanism is actually "reconstruction." Even with perfect information about the text transmitted, we cannot determine if two rulings instantiate the "same" rule without knowing the normative intent of the receivers. This violates the causal history requirement of biological replicators.

  4.  **Determine the Repair:**
      *   The analogy needs to move from "copying" to "reconstructive inheritance." It must account for the fact that the receiver's cognitive/normative framework constitutes the identity of the unit, not just preserves it.

  ---

  ### The Gene-Meme Analogy and the Conditions of Discrete Replication

  In the standard evolutionary account of culture, the gene-meme analogy posits that cultural change can be modeled as a population-level shift in the frequencies of discrete units of information. Just as biological evolution relies on the differential survival of genes carried by organisms, cultural evolution relies on the differential survival of memes carried by human minds or artifacts.

  For a cultural unit to qualify as a discrete replicator in this framework, it must satisfy specific structural conditions distinct from continuous blending. First, it must exhibit **fidelity**: the transmission process must preserve the structural integrity of the unit across generations, minimizing noise such that Unit B in Generation 2 is recognizably a copy of Unit A in Generation 1, rather than a blend of A and Z. Second, it must possess **individuation**: there must be objective criteria for counting units. We must be able to say definitively whether a specific instance is a token of a particular type. Third, there must be a clear **replicator-interactor distinction**. The replicator is the information being copied; the interactor (or vehicle) is the physical or mental entity that houses the information and interacts with the selection environment. In biology, the gene is the replicator and the organism is the interactor. The gene influences the organism's traits, which determine survival, which in turn determines the gene's frequency. The causal arrow flows from replicator to interactor properties.

  ### The Structural Collapse in Legal Reasoning

  A profound conceptual issue arises when applying this framework to **legal reasoning**, specifically the transmission of judicial precedent. In this system, past decisions are supposed to constrain future rulings, mimicking hereditary inheritance.

  **The Proposed Components:**
  *   **The Replicator:** The legal rule or principle (often termed the *ratio decidendi*) extracted from a past case.
  *   **The Interactor/Vehicle:** The judicial opinion itself, the court issuing the ruling, and the specific legal argumentation employed to justify the outcome.

  **The Mapping Collapse:**
  The biological framework fails here not because transmission is noisy (an empirical issue), but because the identity conditions of the unit are structurally indeterminate (a conceptual issue). In biological evolution, the identity of a gene is grounded in its physical structure and causal lineage. If two organisms possess identical DNA sequences due to common ancestry, they possess the same gene. If they possess identical sequences due to independent mutation (convergence), they do not. The physical history determines the identity.

  In legal reasoning, the "replicator" (the legal rule) has no existence independent of the "interactor" (the interpretive act of the judge). A precedent does not transmit a fixed rule; it transmits a text and an outcome that must be *reconstructed* by the future court. Consider a scenario where Court A issues a ruling. Later, Court B and Court C both cite Court A. Court B derives Rule X from the case; Court C derives Rule Not-X from the exact same text.

  Under the gene-meme analogy, we must ask: Did Court B and Court C copy the same replicator?
  1.  **If yes:** Then the replicator cannot be the rule itself, because the rules are contradictory. It must be the text. But the text alone does not determine the legal outcome; the interpretation does.
  2.  **If no:** Then the replicator is the specific interpretation. But if the interpretation is generated by the receiver (Court B/C), then the "replicator" is created by the "interactor," reversing the causal arrow required by Darwinian theory. The vehicle is generating the replicator, not merely expressing it.

  **The Structural Failure:**
  The failure is one of **individuation and causal history**. Even with perfect information about the transmission chain (we have the texts, we know the judges read them), the biological framework cannot determine whether two instances are copies of the same unit or independent convergences. This is because the "unit" in law is defined by its *normative validity* in the present, not its *causal origin* in the past. Two judges may arrive at identical legal principles via entirely different reasoning paths (convergence that functions as identity), or cite the same source to justify opposite principles (divergence that functions as identity).

  In biology, the phenotype is selected, and the gene rides along. In law, the "phenotype" (the ruling) is selected, but the "gene" (the rule) is retroactively defined by that selection. There is no non-arbitrary boundary separating one legal meme from an adjacent one because the boundary is drawn by the interpretive community at the moment of reception, not by the structure of the transmitted information. The replicator-interactor distinction dissolves because the "information" is not a static packet carried by the vehicle; it is a potentiality actualized by the vehicle's interaction with the normative environment.

  ### Requirements for a Repaired Analogy

  To accommodate this case without collapsing back into a simple gene-parallel, a repaired evolutionary analogy must incorporate **reconstructive inheritance**. It cannot treat cultural transmission as the copying of static structures. Instead, it must model transmission as the triggering of cognitive or normative procedures within the receiver that *generate* the unit anew.

  The repaired framework would need to treat the "replicator" not as a discrete object passed between minds, but as a **constraint on reconstruction**. The past case does not supply the rule; it supplies the boundaries within which a new rule must be constructed to be considered valid. Therefore, the unit of evolution is not the meme itself, but the *procedure for generating memes* that counts as faithful within that specific cultural system. This shifts the focus from fidelity of copying to fidelity of reconstruction, acknowledging that the receiver's cognitive architecture is constitutive of the replicator's identity, not merely a vessel for it.
