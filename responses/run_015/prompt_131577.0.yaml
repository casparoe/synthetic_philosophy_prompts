prompt: |-
  I commission and edit evolutionary-explanation pieces for a popular-science magazine — roughly one "why do humans or other animals have trait X?" feature a month — and I want a triage procedure my editors can run on any proposed adaptive explanation before we buy it. I want the steelman version of the Gould–Lewontin spandrels critique, not the version that mostly licenses us to feel smarter than whoever pitched the story, and not a blanket skepticism that would make the section impossible to fill.

  Concretely: an ordered checklist of questions, with what counts as a sufficient answer to each, a point at which the procedure stops with a no, and the points where it hands the question back to a human because it is editorial or value judgment rather than evidence. My editors are generalists with at most an undergraduate biology course, they have about twenty minutes per pitch, and I sign off on the outcome, so the procedure has to be runnable without a specialist in the room and say plainly when it cannot be.

  The distinctions I most want preserved rather than flattened by the simplification: current utility versus historical selection for that effect — a trait can be useful now without having been built for that use — and, among the non-adaptive explanations, structural byproduct with no current function versus byproduct later co-opted for a function versus a trait that made sense in an ancestral environment and is now mismatched or locked in by lineage history. I also want the procedure to include what I call the accessibility check: is there some variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached? If such a variant exists and is absent, the adaptive story owes us an explanation, and I want the procedure to say what would discharge that debt.

  Then run it on three pitches: one arguing that the human taste for spicy food is an antimicrobial adaptation; one arguing that music is a byproduct of other cognitive machinery with no adaptive story of its own; and one that I expect to be uncomfortable, since my house line is that our debunkings are better evidenced than the adaptationist claims they mock, and I suspect a symmetric procedure will say they are often not. Show me where that suspicion is correct and where it is not, and be honest about what the procedure cannot settle even in principle.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Commissioning/Editing evolutionary-explanation pieces for a pop-sci magazine.
      *   **Goal:** A triage procedure (checklist) for editors to evaluate proposed adaptive explanations *before* buying the story.
      *   **Tone/Philosophy:** Steelman Gould-Lewontin (spandrels critique), not cynical dismissal, not blanket skepticism. Needs to be actionable for generalist editors (undergrad bio level, 20 mins/pitch).
      *   **Key Distinctions to Preserve:**
          *   Current utility vs. Historical selection.
          *   Non-adaptive categories: Structural byproduct (no function) vs. Exaptation (co-opted) vs. Mismatch/Legacy (ancestral function, now maladaptive or neutral).
          *   Accessibility Check: Is there a better variant nearby in design space that evolution missed? If so, why?
      *   **Output Format:** Ordered checklist, sufficient answers, stop points (No), hand-off points (Human/Editorial judgment).
      *   **Application:** Run the procedure on three specific pitches:
          1.  Spicy food taste = Antimicrobial adaptation.
          2.  Music = Byproduct (no adaptive story).
          3.  "Debunking" pieces (Meta-pitch: Are our debunkings better evidenced than the claims they mock?).
      *   **Constraint:** Be honest about what the procedure *cannot* settle.

  2.  **Drafting the Triage Procedure (The "Spandrel Screen"):**

      *   *Constraint Check:* 20 minutes, generalist editors. Needs to be simple but rigorous.
      *   *Step 1: The Definition.* Is the trait actually a trait? (Variation exists?)
      *   *Step 2: The History.* Is the claim about *origin* or *maintenance*? (Crucial distinction).
      *   *Step 3: The Alternative.* (The Spandrel check). Could this be a side effect?
      *   *Step 4: The Accessibility Check.* (The User's specific request). Is there a better design?
      *   *Step 5: The Evidence.* Comparative data, genetics, fossil record?
      *   *Stop/Go Criteria:* Need clear "Reject" triggers and "Escalate to Senior Editor" triggers.

      *Refining the Steps:*
      *   Q1: Variation & Heritability. (Basic Evo 101).
      *   Q2: Origin vs. Use. (The "Why" trap).
      *   Q3: The Byproduct Test. (Gould-Lewontin core).
      *   Q4: The Accessibility/Optimality Test. (The user's specific addition).
      *   Q5: The Mismatch Test. (Ancestral vs. Current).
      *   Q6: Evidence Quality. (Comparative, Phylogenetic, etc.).

      *Defining "Sufficient Answer":* Needs to be concrete. "The author cites X study" vs. "It makes sense."
      *Defining "Stop Points":* If Q1 fails, hard no. If Q4 fails, hard no unless explained.
      *Defining "Hand-offs":* When the science is ambiguous but the story is good (Editorial judgment).

  3.  **Applying the Procedure to the Pitches:**

      *   **Pitch 1: Spicy Food (Capsaicin) as Antimicrobial.**
          *   *Context:* This is a classic Sherman & Billing hypothesis.
          *   *Q1 (Variation):* Yes, cultural variation in spice use.
          *   *Q2 (Origin/Use):* Claim is usually cultural evolution, but pitch implies biological taste preference adaptation? Need to clarify. If biological, did we evolve to *like* burn?
          *   *Q3 (Byproduct):* Is liking spice a side effect of pain receptor stimulation (TRPV1)?
          *   *Q4 (Accessibility):* Could we have evolved actual immunity instead of masking bacteria with chili? Yes. Why didn't we? (Cost?).
          *   *Q5 (Mismatch):* Refrigeration makes this less relevant now.
          *   *Verdict:* Plausible as cultural evolution, weak as biological adaptation. Needs nuance.

      *   **Pitch 2: Music as Byproduct.**
          *   *Context:* Pinker's "Auditory Cheesecake" vs. Adaptive theories (sexual selection, bonding).
          *   *Q1 (Variation):* Universal, but variable complexity.
          *   *Q2 (Origin/Use):* Claim is *non-adaptive*. This flips the script. The checklist is designed to filter *adaptive* claims, but must handle *non-adaptive* claims too.
          *   *Q3 (Byproduct):* Does it piggyback on language/pattern recognition?
          *   *Q4 (Accessibility):* If it were adaptive, would it be more uniform?
          *   *Verdict:* Strong candidate for "Hand-off" because it's a theoretical debate, not easily settled by a single study.

      *   **Pitch 3: The "Debunking" Meta-Pitch.**
          *   *Context:* The user suspects their magazine's debunkings are just as speculative as the claims they mock.
          *   *Application:* Run the checklist on a typical "Why X is NOT adaptive" article.
          *   *Analysis:* Often, debunkings rely on "Just-So Story" accusations without offering alternative mechanisms (drift, constraint). They fail the Accessibility Check themselves (claiming "no function" without proving "no function").
          *   *Verdict:* The user's suspicion is likely correct. The checklist will expose weak debunkings.

  4.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the difficulty and the goal (rigor without paralysis).
      *   **The Protocol:** "The Spandrel Screen." Numbered steps. Clear Pass/Fail/Escalate.
      *   **The Application:** Run the three pitches through the screen.
      *   **The Meta-Analysis:** Address the user's suspicion about debunkings.
      *   **Limitations:** What can't this solve? (Deep time, untestable history).

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Critique:* Is 20 minutes realistic for this depth?
      *   *Fix:* Keep the questions sharp. Require the *pitch* to contain the answers, not the editor to research them. The editor checks if the *author* has done the work.
      *   *Critique:* The Music pitch is non-adaptive. The checklist is for adaptive explanations.
      *   *Fix:* Adapt the checklist to evaluate the *evidence for the non-adaptive claim*. A claim of "byproduct" needs as much evidence as a claim of "adaptation."
      *   *Critique:* The Accessibility Check is technical.
      *   *Fix:* Simplify the language for generalists. "Is there an obvious better way?"
      *   *Tone:* Professional, collaborative, scientifically rigorous but pragmatic.

  6.  **Final Polish:** Ensure the distinction between *current utility* and *historical selection* is highlighted in the protocol steps. Ensure the "Accessibility Check" is prominent. Make sure the "Stop" points are clear. (e.g., If the author confuses utility with selection, Stop).

      *(Self-Correction on the "Debunking" Pitch)*: I need to be careful not to just say "Yes, you're right." I need to show *where* the procedure flags the debunking pieces. Usually, they fail on providing an alternative mechanism (Drift? Constraint?) or they assume optimality to disprove it (strawman).

  7.  **Final Review against constraints:**
      *   Ordered checklist? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points? Yes.
      *   Hand-off points? Yes.
      *   Generalist friendly? Yes.
      *   Three pitches analyzed? Yes.
      *   Meta-suspicion addressed? Yes.
      *   Limitations acknowledged? Yes.

      *Let's build the response.*
answer: |-
  Here is a triage procedure designed for your constraints. It is titled **The Spandrel Screen**. It is built to be run by a generalist editor in 20 minutes, relying on the evidence provided in the pitch rather than requiring new research.

  Following the protocol, I have applied it to your three test pitches and provided the meta-analysis you requested regarding your house line on debunking.

  ***

  # The Spandrel Screen: A Triage Protocol for Evolutionary Pitches

  **Operator:** Generalist Editor
  **Time Budget:** 20 Minutes
  **Input:** The Pitch Document (must include proposed thesis, key evidence, and alternative explanations considered).

  ### Phase 1: The Definition Check (Hard Stop)
  *Goal: Ensure the subject is actually a trait capable of evolving.*

  **Q1: Is there heritable variation?**
  *   **The Question:** Does the trait vary between individuals or populations, and is that variation partly genetic (or culturally transmissible in a way that mimics selection)?
  *   **Sufficient Answer:** The pitch cites specific variance (e.g., "Some populations have X, others Y" or "Heritability estimate is Z").
  *   **Fail Condition:** The trait is universal and invariant (e.g., "Why do humans have blood?").
  *   **Action:** If **Fail**, **STOP**. Reject. There is nothing for selection to act upon.

  ### Phase 2: The Time-Travel Check (Hard Stop)
  *Goal: Distinguish current utility from historical selection.*

  **Q2: What is the claim about origin?**
  *   **The Question:** Is the author arguing the trait was *selected for* its current use, or that it is *useful now* (regardless of origin)?
  *   **Sufficient Answer:** The pitch explicitly uses phrases like "evolved to," "selected for," or "ancestral function." If arguing current utility only, it must avoid claiming historical origin.
  *   **Fail Condition:** The pitch conflates "why it is good now" with "why it evolved." (e.g., "Sleep is for memory consolidation, therefore we evolved sleep to consolidate memory").
  *   **Action:** If **Fail**, **STOP**. Reject or request rewrite. This is the fundamental adaptationist error.

  ### Phase 3: The Byproduct Test (Escalation Point)
  *Goal: Apply the Gould-Lewontin critique.*

  **Q3: Is there a simpler structural explanation?**
  *   **The Question:** Could this trait be a necessary side-effect of a different, larger adaptation? (e.g., Is the redness of blood an adaptation or a chemical byproduct of iron?)
  *   **Sufficient Answer:** The pitch acknowledges the leading "spandrel" hypothesis and provides evidence ruling it out (e.g., phylogenetic comparison showing the trait appears *before* the proposed function).
  *   **Action:** If the pitch ignores this, **ESCALATE**. Do not reject, but flag for Senior Editor. This requires a judgment call on whether the author has ignored a major alternative.

  ### Phase 4: The Accessibility Check (Hard Stop)
  *Goal: Test for Optimality and Constraint.*

  **Q4: Is there a "Better Design" nearby?**
  *   **The Question:** In the space of possible biological designs, is there a variant that performs the alleged function *more efficiently* or *at lower cost* that this lineage does not possess?
  *   **Sufficient Answer:** The pitch identifies a plausible "better variant" (e.g., "Why not eyes on the back of the head?") and explains the constraint (developmental, genetic, or phylogenetic) that prevents it.
  *   **Fail Condition:** The author claims the trait is "optimal" without addressing obvious, existing alternatives in nature or physics.
  *   **Action:** If **Fail**, **STOP**. Reject. The adaptationist story owes us a debt explaining why evolution "missed" the better solution.

  ### Phase 5: The Mismatch & Legacy Filter (Escalation Point)
  *Goal: Distinguish Adaptation, Exaptation, and Mismatch.*

  **Q5: Does the function match the environment of evolution?**
  *   **The Question:** If the trait is adaptive, did the selection pressure exist in the ancestral environment (EEA), or is it a modern match?
  *   **Sufficient Answer:**
      *   *Adaptation:* Pressure existed ancestrally.
      *   *Exaptation:* Trait existed for Reason A, now used for Reason B (must explain Reason A).
      *   *Mismatch:* Trait suited Ancestral Env, maladaptive now (e.g., sugar craving).
  *   **Action:** If the pitch claims "Adaptation" for a modern problem (e.g., "We evolved to check emails"), **ESCALATE**. This is likely a Mismatch or Exaptation story, not a direct Adaptation story.

  ### Phase 6: The Evidence Grade (Human Judgment)
  *Goal: Assess the strength of the support.*

  **Q6: What is the comparative basis?**
  *   **The Question:** Is the claim supported by cross-species comparison, fossil record, or genetics, or is it based on "logical plausibility"?
  *   **Sufficient Answer:** At least one line of empirical evidence (comparative phylogeny, genetic correlation, or fossil timeline).
  *   **Action:** If evidence is purely "Just-So" (plausible story only), **ESCALATE**. Senior Editor must decide if the narrative value outweighs the evidentiary weakness.

  ***

  # Application to Test Pitches

  Here is how the Screen runs on your three specific scenarios.

  ### Pitch 1: The Spicy Food Antimicrobial Hypothesis
  *Claim: Humans evolved a taste for capsaicin (chili heat) because spices kill food-borne bacteria in hot climates.*

  *   **Q1 (Variation):** **Pass.** High cultural and genetic variation in spice tolerance and usage.
  *   **Q2 (Time-Travel):** **Fail/Flag.** The pitch likely conflates *cultural* evolution (recipes) with *biological* evolution (taste receptors). Did we evolve to *tolerate* the burn, or did we learn to *use* the plant?
      *   *Editor Note:* If the claim is biological adaptation (TRPV1 receptor sensitivity), this is hard to sustain. If cultural, it passes Q2 but changes the magazine section (anthropology vs. biology).
  *   **Q3 (Byproduct):** **Escalate.** Capsaicin stimulates pain receptors. Is "liking spice" a byproduct of sensation-seeking or hormonal response to pain (endorphins), rather than antimicrobial intent? The pitch must rule this out.
  *   **Q4 (Accessibility):** **Fail.** **Stop.**
      *   *Reasoning:* A "better design" would be an immune system that handles the bacteria directly, or cooking food (which kills bacteria without pain). Why evolve a tolerance for a toxin rather than avoiding the toxin? The pitch owes an explanation for why cooking or immunity was insufficient.
      *   *Verdict:* **Reject** as a biological adaptation story. It may be viable as a cultural evolution story, but the "we evolved to like spice" claim fails the Accessibility Check.

  ### Pitch 2: Music as Auditory Cheesecake (Byproduct)
  *Claim: Music has no adaptive function; it is a byproduct of language, pattern recognition, and emotional processing.*

  *   **Q1 (Variation):** **Pass.** Universal capacity, variable output.
  *   **Q2 (Time-Travel):** **Pass.** The claim is explicitly about *origin* (lack of selection).
  *   **Q3 (Byproduct):** **Pass.** This is the core of the pitch. It identifies the "larger adaptations" (language, motor control) of which music is a side-effect.
  *   **Q4 (Accessibility):** **Escalate.**
      *   *Reasoning:* If music were adaptive, would we expect a more specialized "music module"? Perhaps. But the absence of a module isn't proof of non-adaptation.
      *   *Editor Note:* This is a theoretical stalemate. The Screen cannot settle "Adaptation vs. Byproduct" when both fit the data equally well.
  *   **Q5 (Mismatch):** **N/A.**
  *   **Q6 (Evidence):** **Escalate.**
      *   *Reasoning:* Evidence for "no function" is inherently harder than evidence for "function."
      *   *Verdict:* **Hand-off to Senior Editor.** The Screen clears the logic, but the evidentiary burden for a null hypothesis is high. This is a value judgment: Is the "Cheesecake" metaphor compelling enough for readers despite the evidentiary symmetry with adaptationist theories?

  ### Pitch 3: The "Debunking" Meta-Pitch
  *Claim: A piece arguing that a popular adaptationist claim (e.g., "The God Spot") is false.*

  *   **Q1 (Variation):** **Pass.**
  *   **Q2 (Time-Travel):** **Pass.** Usually critiques the origin story.
  *   **Q3 (Byproduct):** **Fail/Flag.**
      *   *Reasoning:* Many debunking pieces argue "It's not adaptation X," but fail to propose "It is Byproduct Y." They leave a vacuum. The Screen demands an alternative mechanism (Drift? Constraint? Exaptation?).
  *   **Q4 (Accessibility):** **Fail.**
      *   *Reasoning:* Debunkers often assume the adaptationist claim implies *optimality*. They show the trait is imperfect and declare it "not adaptive." But adaptations need not be optimal. This fails the nuance check.
  *   **Q6 (Evidence):** **Escalate.**
      *   *Reasoning:* Debunkings often rely on the "Just-So Story" accusation. But if the debunking offers no positive evidence for an alternative, it is *also* a Just-So Story (a "Null-So" Story).
      *   *Verdict:* **Hand-off to Senior Editor.** The procedure reveals that many debunkings are scientifically symmetric to the claims they mock.

  ***

  # Meta-Analysis: Your Suspicion and the Procedure's Limits

  You suspected that your house line ("our debunkings are better evidenced than the adaptationist claims they mock") might be wrong. **The procedure confirms your suspicion is largely correct.**

  ### Where the Suspicion is Correct
  The Spandrel Screen exposes that **negative claims require positive evidence.**
  When you publish a piece saying "Trait X is *not* an adaptation," you are making a historical claim about selection pressures. To support that, you must demonstrate either:
  1.  **Phylogenetic Inertia:** The trait existed before the pressure.
  2.  **Constraint:** The trait could not change due to developmental limits.
  3.  **Drift:** The trait varies neutrally.

  Most "debunking" pieces in pop-sci stop at Step 1 of the adaptationist's failure (plausibility) without completing Step 1 of their own burden (providing a mechanism). They commit the mirror image of the adaptationist error: assuming that because a "Just-So" story is weak, the "Null" story is true. The Screen forces editors to ask: "If it's not a spandrel, what is it?" If the answer is "We don't know," the piece is speculative, regardless of how satisfying the debunking feels.

  ### Where the Suspicion is Not Correct
  There is one area where debunkings often hold stronger ground: **The Accessibility Check (Q4).**
  Adaptationist claims often imply a level of functional optimization that doesn't exist. A debunking piece that successfully demonstrates a "Better Design" that evolution missed (e.g., "If this were for X, why is the nerve routed this inefficient way?") is on solid ground. If the debunking focuses on *engineering constraints* rather than *historical absence*, it passes the Screen more easily than the adaptationist pitch.

  ### What the Procedure Cannot Settle (Even in Principle)
  You asked for honesty about the limits. The Screen cannot resolve the following, and neither can science, currently:

  1.  **Deep Time Ambiguity:** For traits originating >1 million years ago, distinguishing between "Weak Selection," "Drift," and "Exaptation" is often statistically impossible. The Screen will flag these as **Escalate**, but the Senior Editor cannot fix the data gap.
  2.  **The "Function" Definition:** Biology has no consensus on whether "function" means "effect selected for" (historical) or "current causal role" (etiological). The Screen forces a choice (Q2), but the underlying science remains debated.
  3.  **Cultural vs. Biological Co-evolution:** In humans (Pitch 1), distinguishing genetic selection from cultural selection is notoriously difficult (Gene-Culture Coevolution). The Screen treats them as distinct for triage simplicity, but reality is often a blur.

  ### Recommendation for Implementation
  Adopt **The Spandrel Screen** but add a mandatory field to the pitch form: **"The Alternative Mechanism."**
  Require the author to state: *If this trait is not an adaptation for X, what is it?*
  *   A) Byproduct of Y.
  *   B) Drift/Neutral.
  *   C) Mismatch (Adapted for Z).
  *   D) Unknown.

  If they select D, the piece must be framed as a mystery, not a resolution. This preserves the "why" curiosity of your magazine without licensing the "smarter than the pitcher" cynicism. It forces humility on both the adaptationist and the debunker.
