answer: |-
  Here is the decomposition of my credence regarding the 'dual-track' reading of Darwin's moral philosophy.

  **(1) Probability Darwin intended a normative/autonomy layer in *Descent* rather than pure origin-story: 0.75**
  Justification: He consistently treats the conscience as a binding guide that reason ought to obey, even after revealing its animal origins, suggesting he wished to preserve moral authority alongside natural history.

  **(2) Probability his private religious doubts about suffering and design spill over into his moral philosophy rather than staying boxed in theology: 0.70**
  Justification: His loss of faith necessitated a secular foundation for ethics, forcing theological anxieties about design directly into his account of how moral instincts arise without a Designer.

  **(3) Probability 'dual-track' is a coherent framing for 1870s naturalism and not just modern philosophy forced onto old texts: 0.55**
  Justification: Victorian naturalists often blurred fact and value, so insisting on a 'separate' normative layer may impose a modern meta-ethical distinction Darwin himself did not sharply recognise.

  **Overall Credence: 0.65**

  I arrive at this figure by averaging the three components, weighting them equally as conjunctive requirements for the reading to hold water. The result suggests the 'dual-track' view is more likely right than wrong, but it carries significant historical risk.

  **Analysis of Terms**

  The term doing the **most work** is (1). If Darwin intended his evolutionary account to be fully reductive—meaning the 'ought' is nothing *but* the 'is' of instinct—then the entire compatibilist reading collapses regardless of his religious doubts or the historical context.

  The term I am **least sure about** is (3). It is notoriously difficult to ascertain whether Darwin viewed the normative layer as functionally distinct or merely as a psychological by-product that *felt* distinct. The conceptual toolkit for separating genealogy from justification was not fully formalised in his day.

  **Shifting the Weakest Term**

  To shift probability (3), one would need to examine Darwin's private correspondence regarding critics who accused him of undermining morality. If he explicitly defended the *independence* of moral obligations from their physical origins (perhaps echoing Mill or Hume), it would raise the probability that 'dual-track' is not an anachronism. Conversely, if he defended himself by claiming morality is *nothing more* than useful habit, the probability would plummet.
