      *   *Weakness:* "Jurisdiction" implies a court or a sovereign. The ICS is a scientific body, not a legal one. However, scientific classification *has* performative power (like law).
      *   *Verdict:* It's not mere wordplay *if* the essay defines jurisdiction broadly (epistemic authority + performative consequence). It needs to explicitly link scientific classification to regulatory power.
      *   *Suggestion:* Lean into the concept of "epistemic jurisdiction" or "ontological politics."

  3.  **Evaluate the Dates as Theories of Agency:**
      *   *1610 (Orbis/Lewis & Maslin):* Linked to Columbian Exchange, CO2 dip, pollen changes. *Agency:* Globalization, colonization, biological reshuffling. *Fit:* Good. It implicates early capitalism/colonialism.
