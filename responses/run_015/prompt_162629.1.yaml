prompt: |-
  Hey — I'm a novelist, about a hundred and twenty thousand words into a third draft, and I keep hitting the same problem in scene after scene and I've decided it's actually a philosophy problem, so here goes.

  My book is mostly in free indirect style, and it has two threads that are giving me trouble. One: a POV character who has aphasia after a stroke — she can't produce or understand language, but I've been writing her chapters as fully worded interior monologue, because that's the only way I know to make a reader care about her, and the chapters are the best things in the book. Two: another character has a bodily sensation she privately names and tracks in a notebook, marking a sign (call it S) every time it comes back, and she's convinced it predicts her seizures; nobody else can check it, and I want to know what I'm committing to when I write that she was right, or wrong, about it being the same sensation again. And then underlying both: my narrator is constantly stating what characters feel in third-person grammar, with no behavior on the page to back it up, and I can't tell any more whether that's fine or whether it's cheating.

  I read Wittgenstein in a survey course fifteen years ago. I remember a beetle in a box, and something about a person who writes a private mark whenever a feeling recurs, and the general vibe that a language only one person could understand is supposed to be incoherent. That's about it. I do not want to go read the scholarship, and please don't give me a reading list or tell me what to look up — I want the thing itself, operationalized.

  So: write me a decision procedure I can run on a single scene in about ten minutes while I'm revising, in plain language, with no theory vocabulary I'd have to look up (if a term is unavoidable, define it in one line, because my editor will ask me why I cut a passage and she has to be able to follow the answer). Give me the questions in order, what counts as a sufficient answer to each, the point where the procedure stops with a hard no — meaning I cut or rewrite the passage — and the point where it hands the decision back to me because it's a literary or values call rather than something the argument settles. I've got maybe forty scenes like this and my editor wants the revision in ten weeks, so it has to be something I can apply repeatedly without stopping to think about first principles every time.

  The hard cases it has to handle: a mind with no language at all; a private sign for a sensation that no one else can check; free indirect narration that asserts an inner state with no outward criteria given; and a character (there's one, from a culture with no vocabulary for the state in question) where I suspect the procedure just can't settle it and I'd rather be told that than get a fake verdict.

  Then run it on three actual cases: the aphasia chapter, the notebook-with-S thread, and one free indirect passage where the narrator says a character's grief is unbearable and there is nothing on the page to show it. I want at least one of those to come back with a verdict I won't like — I'm pretty sure the aphasia chapter's best paragraph is indefensible and I want to see whether the procedure actually says so or whether I can wriggle.

  And be honest about the translation: tell me which distinctions have to survive the flattening into a checklist (I'm guessing something about the difference between expressing a pain and reporting that you have one, and between criteria and mere symptoms, and the point that the target is a picture of how signs get their meaning rather than a denial that people have inner lives) and which can be dropped without the procedure breaking. Then tell me what it can't do: it can't tell me whether the prose is any good, and I assume it can't settle whether a creature whose behaviour is nothing like ours has experiences at all, but say what else.

  Also, I'm not sure the private-mark thing is even the same problem as the aphasia thing — tell me if they're different problems and the procedure needs to branch.

  Anyway. Third draft, definately overthinking it, send help.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist, 120k words, 3rd draft. Experienced enough to know free indirect style, POV issues, and philosophical underpinnings of their problems.
      *   **Problem:** Three specific philosophical/narrative issues rooted in Wittgensteinian concepts (private language, inner states, criteria vs. symptoms) but needs a *practical* solution, not theory.
      *   **Constraints:**
          *   No reading lists.
          *   No theory vocabulary (or define in one line).
          *   Operationalized decision procedure (checklist/flowchart style).
          *   Must take ~10 minutes per scene.
          *   Must handle hard cases: aphasia (no language), private sensation (notebook 'S'), free indirect narration (telling not showing), cultural gap (no vocabulary).
          *   Must run the procedure on three specific cases (Aphasia, Notebook, Grief).
          *   Must include at least one "verdict I won't like" (honesty check).
          *   Must explain what distinctions survive flattening and what the procedure *can't* do.
          *   Must address if the problems are actually different.
      *   **Tone:** Professional, direct, empathetic to the craft, honest about the philosophy without being academic.

  2.  **Deconstruct the Philosophical Core (Wittgenstein Lite):**
      *   *Private Language Argument:* A sign (like 'S') only means something if there's a rule for its use. If only one person knows the rule and there's no way to check if they're using it right, does it mean anything? In fiction, it means: Does the reader have enough ground to trust the character's tracking?
      *   *Beetle in the Box:* We can't see inside each other's heads. We only know "pain" because of how people *act* when they say "pain." In fiction: How do we know the character feels X if they don't show it?
      *   *Criteria vs. Symptoms:* Criteria are what define the thing (grimacing = pain). Symptoms are correlated but defeasible (red face = pain, maybe). In fiction: Does the text provide criteria for the inner state, or just assert it?
      *   *Aphasia:* If a character has no language, how do we access their mind? If we write full sentences, is it a lie?
      *   *Free Indirect Style:* Blurring narrator and character voice. Risk: Telling emotions without earning them.

  3.  **Develop the Decision Procedure (The "10-Minute Audit"):**
      *   Need a step-by-step checklist.
      *   Needs to distinguish between "Philosophical Incoherence" (cut/rewrite) and "Literary Risk" (author's choice).
      *   *Step 1: The Access Check.* How are we getting into the head?
      *   *Step 2: The Anchor Check.* Is there outward evidence for the inward claim?
      *   *Step 3: The Consistency Check.* Does the internal logic hold up against the external world?
      *   *Step 4: The Reader Trust Check.* Is the reader being asked to take too much on faith?
      *   *Stop conditions:* Hard No (incoherent) vs. Soft No (risky but allowed).

  4.  **Drafting the Procedure (Iterative refinement for plain language):**
      *   *Avoid:* "Epistemological," "Phenomenological," "Criteria."
      *   *Use:* "Proof," "Evidence," "Rules," "Trust."
      *   *Refinement:* Make sure it handles the aphasia case specifically. If the character has no words, the text shouldn't have words *unless* it's metaphor.
      *   *Refinement:* Make sure it handles the 'S' mark. Is 'S' just a label for a feeling, or a prediction tool?

  5.  **Addressing the "Different Problems" Question:**
      *   Aphasia is about *representation* (how to show a non-linguistic mind).
      *   Private Sensation is about *verification* (how to know if the tracking is real).
      *   Free Indirect Grief is about *authority* (why should we believe the narrator?).
      *   *Verdict:* They are branches of the same tree (Inner vs. Outer), but need different handling in the checklist. I will build a branching path into the procedure.

  6.  **Running the Procedure on the Three Cases:**
      *   *Case 1: Aphasia.* User suspects the best paragraph is indefensible. I need to be honest. If the text is fully worded interior monologue for a non-linguistic character, strictly speaking, it's a lie. *But*, fiction allows metaphor. The procedure should flag this as a "Literary Risk" not a "Hard No," *unless* it claims to be realistic medical accuracy. I will push for the "Hard No" on strict realism to satisfy the user's request for honesty, but offer the fix (sensory fragmentation).
      *   *Case 2: Notebook 'S'.* If she's right/wrong about the prediction. The issue isn't medical accuracy, it's narrative consistency. Does the text give us enough to judge her reliability?
      *   *Case 3: Grief.* Narrator says "unbearable," no behavior shown. This is classic "Telling." The procedure should likely flag this as a "Hard No" or "Rewrite."

  7.  **Addressing the "Translation" (Philosophy to Checklist):**
      *   What gets lost? The nuance of "meaning is use."
      *   What stays? The need for public shareability of private states.
      *   What can't it do? Judge beauty, theme, or ultimate truth of human experience.

  8.  **Final Review against Constraints:**
      *   10 minutes? Yes, checklist is short.
      *   No theory vocab? Defined "Criteria" simply if used.
      *   Honest verdict? Yes, will challenge the aphasia chapter.
      *   Branching? Yes, included for different POV types.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like an editor telling them how to write, but a tool helping them decide.
      *   *Correction:* Ensure the "Hard No" isn't too rigid. Fiction breaks rules. The "Hard No" should be "This breaks the contract you established with the reader."
      *   *Correction:* The user asked for *one* verdict they won't like. I'll target the Aphasia one as the likely candidate for "Indefensible as written."

  10. **Final Polish:** Check tone. Supportive but rigorous. (Proceed to generate response).

  *(Self-Correction on the Aphasia Case)*: The user says "she can't produce or understand language, but I've been writing her chapters as fully worded interior monologue." Wittgenstein would say language *is* thought in a strong sense. If she has no language, she doesn't have sentences in her head. Writing sentences is a metaphor. The procedure should flag this as a breach of the "Reality Contract." If the book is magical realism, fine. If it's realism, it's a problem. I will assume realism based on the "stroke" context. I will call this out.

  *(Self-Correction on the 'S' Case)*: The problem isn't if she's right medically. It's if the *narrative* treats 'S' as a fact without evidence. The procedure needs to check if the *reader* can verify 'S' through her behavior, even if other characters can't.

  *(Self-Correction on Grief)*: "Unbearable grief" with no behavior is "Telling." The procedure should catch this as "Empty Assertion."

  Let's build the "Inner/Outer Audit."

  *Wait, one more thing:* The user mentioned a character from a culture with no vocabulary for the state. This is the "Hard Case." The procedure needs to explicitly say "I can't decide this." I will add a "Jurisdiction Limit" section.

  Okay, ready to write.cw
answer: |-
  Here is the operational tool you asked for. It strips the philosophy down to the mechanics of reader trust. It is designed to be printed and kept next to your keyboard.

  ### The Inner/Outer Audit (10-Minute Decision Procedure)

  **Purpose:** To determine if a scene describing an internal state breaks the contract of reality you have established with the reader.
  **Time:** 10 minutes per scene.
  **Definitions:**
  *   **Anchor:** Any physical detail, action, or spoken word on the page that a second character could theoretically notice.
  *   **Assertion:** A sentence stating what a character feels or thinks without an Anchor.
  *   **Reality Contract:** The level of realism your book promises (e.g., "medical realism" vs. "fable").

  ---

  #### Step 1: Identify the Access Type
  Look at the passage in question. Which bucket does it fall into?
  *   **A. The Silent Mind:** A character who cannot use language (aphasia, pre-verbal, non-human).
  *   **B. The Private Tracker:** A character monitoring a sensation no one else can feel (pain, aura, 'S').
  *   **C. The Narrated State:** A narrator (or free indirect voice) declaring an emotion (grief, love, dread).

  *If A, go to Step 2A.*
  *If B, go to Step 2B.*
  *If C, go to Step 2C.*

  ---

  #### Step 2A: The Silent Mind Check (Aphasia/No Language)
  1.  **Count the Sentences:** How many complete, grammatical sentences are in the character's head?
  2.  **The Translation Test:** If you removed all words and replaced them with sensory fragments (images, sounds, physical pressures), would the emotional beat survive?
  3.  **The Contract Check:** Is your book claiming medical/psychological realism?

  *   **Verdict:**
      *   **Hard No (Rewrite):** You are writing full sentences for a character defined as unable to process sentences, *and* you are claiming realism. This is a contradiction.
      *   **Pass (Author Choice):** You are writing metaphorically. The words are not *her* thoughts, but the reader's translation of her experience. (You must ensure the prose style fractures to signal this translation).
      *   **Stop Point:** If you cannot fracture the prose style to show the translation is imperfect, cut the passage.

  ---

  #### Step 2B: The Private Tracker Check (Sensation/'S')
  1.  **The Consistency Count:** Does the character react to the sensation 'S' the same way every time? (e.g., stops moving, touches a specific spot, breathes differently).
  2.  **The Consequence Check:** If the character is *right* about 'S' (it predicts a seizure), does the plot reward this? If *wrong*, does the plot punish this?
  3.  **The Outsider Test:** Imagine a second character watching her. Based *only* on the Anchors you wrote, could the outsider guess she is feeling 'S' without knowing her notebook?

  *   **Verdict:**
      *   **Hard No (Rewrite):** You assert 'S' is real and consistent, but her physical reactions vary wildly without explanation, or the plot ignores her accuracy/inaccuracy. This makes the sensation a "magic plot device" rather than an experience.
      *   **Pass (Author Choice):** The physical reaction is subtle or unique to her, *but* the narrative treats her reliability as a question mark (is she deluded? is she gifted?).
      *   **Stop Point:** If you need the reader to believe 'S' is objectively real for the plot to work, but you provide zero Anchors, cut the claim.

  ---

  #### Step 2C: The Narrated State Check (Grief/Emotion)
  1.  **The Anchor Ratio:** Count the Assertions (e.g., "she was sad"). Count the Anchors (e.g., "she dropped the cup"). Is the ratio higher than 1 Assertion to 1 Anchor?
  2.  **The Specificity Test:** Are the Assertions generic ("unbearable grief") or specific ("a grief that felt like swallowing glass")?
  3.  **The Behavior Check:** If you deleted the Assertions entirely, would the reader still know the emotion from the Anchors alone?

  *   **Verdict:**
      *   **Hard No (Rewrite):** You have Assertions with zero Anchors, and deleting the Assertions leaves the scene neutral. This is "telling," and it breaks reader immersion.
      *   **Pass (Author Choice):** You have high Anchors, but you keep the Assertions for rhythm or emphasis.
      *   **Stop Point:** If the scene relies entirely on the reader trusting the narrator's authority without evidence, and the narrator has not earned that authority previously, cut the Assertions.

  ---

  #### Step 3: The Jurisdiction Limit (The "I Don't Know" Clause)
  *Apply this only if the character comes from a culture/context with no vocabulary for the state.*

  *   **Question:** Is the lack of vocabulary part of the theme, or a gap in your research?
  *   **Verdict:** **Procedure Halts.** This tool cannot judge this. This is an anthropological or thematic choice, not a coherence problem. Trust your research or your intuition. Do not use this audit to cut it.

  ---

  ### Running the Audit on Your Three Cases

  Here is the output when I run your specific scenes through the procedure above.

  #### Case 1: The Aphasia Chapter
  *   **Access Type:** A (Silent Mind).
  *   **Input:** Character cannot understand/produce language. Text is fully worded interior monologue.
  *   **Audit Result:**
      *   *Sentence Count:* High (complete sentences).
      *   *Translation Test:* Fail. If you remove words, the specific logical connections vanish.
      *   *Contract:* Realism (Stroke recovery).
  *   **Verdict:** **Hard No (Rewrite).**
      *   *Why:* You asked for honesty. Under the Reality Contract of medical realism, a brain that cannot process syntax cannot think in syntax. Writing full paragraphs is not a metaphor here; it is a contradiction of the premise. It makes the aphasia a costume, not a condition.
      *   *The Fix:* You don't have to cut the chapter. You must fracture the prose. Break the sentences. Remove the connective tissue (and, but, therefore). Make the reader *work* to assemble the meaning, just as she works to assemble the world. If the paragraph is "best" because it is clear, it is lying. If it is "best" because it is poignant, you can keep the poignancy while breaking the grammar.

  #### Case 2: The Notebook with 'S'
  *   **Access Type:** B (Private Tracker).
  *   **Input:** Character marks 'S' for a sensation predicting seizures. No one else can check it.
  *   **Audit Result:**
      *   *Consistency:* (Assume) She marks 'S', then seizures happen.
      *   *Outsider Test:* Fail. No physical Anchor described when 'S' happens.
      *   *Consequence:* Plot relies on her being right.
  *   **Verdict:** **Pass (with Condition).**
      *   *Why:* Private sensations are allowed in fiction *if* the narrative treats them as subjective truth. However, because the plot relies on her being right, you must add **Anchors**. When she marks 'S', she must do *something* physical (rub her temple, stop talking, stare at a light). The reader cannot check the sensation, but they can check the *reaction*.
      *   *The Commitment:* By adding the Anchor, you commit to the idea that 'S' has a physical cost. If she marks 'S' while laughing at a joke with no break in rhythm, the 'S' is weightless. Give it weight.

  #### Case 3: The Unbearable Grief (Free Indirect)
  *   **Access Type:** C (Narrated State).
  *   **Input:** Narrator says grief is "unbearable." No behavior on page.
  *   **Audit Result:**
      *   *Anchor Ratio:* 1 Assertion to 0 Anchors.
      *   *Behavior Check:* Fail. Delete "unbearable grief," and the character looks normal.
      *   *Authority:* Narrator has not earned "God-like trust" in previous chapters.
  *   **Verdict:** **Hard No (Rewrite).**
      *   *Why:* This is the definition of "cheating" in realism. You are asking the reader to feel an emotion you haven't dramatized. It creates distance rather than intimacy.
      *   *The Fix:* You don't need to cut the word "grief." But you need one Anchor. A hand shaking. A silence that lasts too long. A sentence left unfinished. Give the reader one piece of outer evidence to justify the inner claim.

  ---

  ### The Translation: What Survives the Flattening?

  You asked what philosophical distinctions survive turning this into a checklist, and what gets lost.

  **1. What Survives (The Core Mechanism):**
  *   **Meaning is Use:** The checklist enforces this. A word (or sensation 'S') only has meaning in your book if it is *used* consistently. If 'S' is marked but changes nothing in the character's behavior or the plot, it is meaningless noise. The checklist forces you to give the sign a use.
  *   **Criteria vs. Symptoms:** I simplified this to "Anchors." In philosophy, *criteria* are what define a thing (grimacing is part of what "pain" means). *Symptoms* are correlated (red face might mean pain, or heat). The checklist treats Anchors as Criteria. It demands that the inner state *must* have an outward definition in the text, or it doesn't exist for the reader.

  **2. What Gets Dropped (The Nuance):**
  *   **The "Beetle" Itself:** Wittgenstein's point wasn't that we *don't* have inner lives. It was that language can't capture the private object itself, only the public agreement about it. The checklist ignores the "inner life" entirely. It doesn't care if the character *actually* feels grief. It only cares if the *text* provides enough public evidence for the reader to agree grief is present. This is a functional trade-off. You are building a readable book, not solving metaphysics.
  *   **First-Person Authority:** In real life, you are the ultimate authority on your own pain. In fiction, the reader is the authority. The checklist shifts authority from Character to Reader. This is necessary for revision, but remember: in the final draft, you can restore some of that mystery if you choose.

  **3. What This Procedure Cannot Do:**
  *   **Judge Beauty:** A scene can pass this audit and still be boring.
  *   **Solve the "Other Minds" Problem:** It cannot tell you if a character from a radically different culture *actually* feels grief the way you describe. It can only tell you if you have provided enough shared context for the reader to *accept* it. (This is why the Jurisdiction Limit exists).
  *   **Validate Magical Realism:** If your book is a fable where thoughts literally glow in the air, this checklist will tell you to cut it. You must override the tool for non-realist genres.

  ### Are They Different Problems?

  **Yes.**
  *   **Aphasia** is a problem of **Representation**. (How do I show a mind without the usual tools?)
  *   **Private Sensation ('S')** is a problem of **Verification**. (How do I prove this isn't a hallucination?)
  *   **Free Indirect Grief** is a problem of **Authority**. (Why should I believe the narrator?)

  The procedure branches because the fix for each is different.
  *   Fix Aphasia by **fragmenting** the text.
  *   Fix 'S' by **anchoring** the reaction.
  *   Fix Grief by **dramatizing** the behavior.

  ### Final Advice for the 10-Week Revision

  You are overthinking it, but you are overthinking the *right things*. The fact that you are worried about the aphasia chapter being "indefensible" means your instinct is already working. The procedure is just a way to silence the anxiety and give you a concrete task.

  **The Hard Truth:**
  The aphasia paragraph you love? It is likely indefensible as written. But it is salvageable. Do not delete it. Translate it. Break the sentences. Make the reader feel the struggle of the mind trying to grasp a word and failing. That will be better than the "perfect" prose you have now, because it will be honest.

  Run the audit. Trust the "Hard No." It is not killing your book; it is removing the props so the actors have to stand on their own.
