  While the somatic analogy offers intuitive traction—mapping ruler to head, citizens to limbs, and common good to health—it collapses under Thomistic scrutiny. Aquinas distinguishes sharply between a usurper, who lacks title and may be resisted privately, and a legitimate ruler who becomes tyrannical, whom private individuals cannot depose. The biomedical model treats both as "cancer," obscuring this juridical distinction crucial to Aquinas's fear of sedition. Furthermore, Aquinas's "health" is not mere functional homeostasis but moral teleology ordered toward virtue and salvation; a stable body politic living in vice is not "healthy" in his sense. Most critically, the surgical conclusion fails because surgery implies a surgeon operating with authority. Aquinas explicitly forbids private tyrannicide, arguing that removing a tyrant often precipitates greater evils—scandal, instability, or a worse successor—than enduring the tyranny. Thus, the "knife" belongs not to the individual cell but to the public authority or God. The analogy smuggles in modern individualism and functionalism, ignoring Aquinas's prioritization of order and his restriction of coercive power to public institutions. Ultimately, the body politic cannot perform auto-surgery without risking death, making the analogy misleading for licensing assassination.
