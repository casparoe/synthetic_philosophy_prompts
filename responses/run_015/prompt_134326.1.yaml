prompt: |-
  hey so im writing the final for my philosophy of law seminar (upper-level, mostly third years) and im really tired of answers that just summarize the Hart-Devlin thing like its a wikipedia entry. i want an essay question that forces students to deal with the actual structure of Devlin's claim that society has a right to defend shared morality, and Hart's counter that this collapses law into morality without giving a criterion for which beliefs count as genuinely shared versus merely dominant.

  specifically, inject this twist: present a hypothetical liberal democracy where about 40% hold a coherent, institutionally embedded alternative moral framework, not just scattered dissent. ask students whether Devlin's social-cohesion argument implicitly treats majority moral beliefs as having a kind of epistemic dominance—like universal ascription over the minority—and whether Hart's harm principle can distinguish real harm from mere offense without smuggling in liberal commitments. the question should make them confront what "shared morality" even means when a substantial minority doesn't share it but is still socially integrated.

  please write the exam question itself, a model answer around 650 words, and a marking scheme that seperates an A from a B by listing the specific conceptual moves each must contain. no bibliographies or citation requests—students should answer from the concepts alone. keep it answerable without web access but hard to answer by reciting the standard debate summary, and avoid leaning on specific case-law dates or texts they'd need to look up.
