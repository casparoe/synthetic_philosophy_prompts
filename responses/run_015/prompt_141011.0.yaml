  **Note on Case Selection:** The **Ridley Reactor** has been excluded from this memo. It occupies the same logical space as the Kestrel Agent (informational continuity without metabolic boundary) but introduces artificial constraints irrelevant to a natural resource classification. Including it would pad the document without resolving the definitional conflict.

  ***

  **MEMORANDUM**

  **TO:** Classification Board, Orbital Station Keeler
  **FROM:** Dr. Aris (Metabolic Systems) & Dr. Vance (Informational Systems)
  **DATE:** Cycle 449
  **SUBJECT:** Joint Assessment of Vent Field 8-Beta (Plume Filaments)

  **1. AGREED CLAIMS OF FACT**

  1.  **Plume Filaments** maintain an internal chemical gradient distinct from the surrounding seawater, repairing membrane-like boundaries against thermal stress without external direction.
  2.  **Plume Filaments** exhibit sequence-based replication only when in physical contact with the specific mineral sulfides of the vent chimney.
  3.  **Plume Filaments** removed from the vent field retain internal chemistry and structural integrity indefinitely but cease all replication events.
  4.  **Kestrel Agents** possess no independent metabolism and remain chemically inert outside a host cell.
  5.  **Kestrel Agents** direct host metabolism to produce copies of themselves with heritable variation subject to selection pressures.
  6.  Neither Plume Filaments nor Kestrel Agents fit the historical terrestrial definitions of "cellular life" or "non-living matter" without qualification.
  7.  The drilling permit decision hinges on whether Plume Filaments are classified as "Biological Entities" under Statute 12.

  **2. AREAS OF DISAGREEMENT**

  | Issue | Signatory A (Metabolic) Wording | Signatory B (Informational) Wording |
  | :--- | :--- | :--- |
  | **Classification of Plume Filaments** | "Self-maintaining chemical structures with context-dependent reproductive capability." | "Darwinian populations constrained by environmental substrate." |
  | **Classification of Kestrel Agent** | "Metabolic parasites; functional components of host biology, not independent entities." | "Autonomous evolutionary lineages utilizing host infrastructure." |
  | **Definition of 'Alive' for Statute 12** | "Requires a bounded system capable of self-maintenance independent of specific replication sites." | "Requires a system capable of heritable variation and differential success, regardless of boundary origin." |
  | **Nature of the Dispute** | "Substantive: The lack of independent replication indicates a lack of biological agency." | "Semantic: The word 'Alive' is being conflated with 'Deserving of Protection'." |

  **3. CRUXES AND PREDICTIVE TESTS**

  *The following sub-questions represent the specific points where further data could resolve the classification deadlock. Both signatories agree these tests are theoretically decisive but note that time constraints (drilling schedule) may preclude execution.*

  **Crux 1: The Substrate Dependency Limit**
  *   **Question:** Is replication inhibited by the *absence* of the vent, or by the *presence* of inhibitors elsewhere?
  *   **Test:** Transport Plume Filaments to a synthetic mineral surface matching vent chemistry exactly, but isolated from the thermal gradient.
  *   **Prediction (A/Metabolic):** Replication will fail. The system requires the dynamic thermal flow of the vent to sustain the energy budget for copying, proving it is a feature of the vent, not an independent agent.
  *   **Prediction (B/Informational):** Replication will succeed. The sequence logic is intrinsic; if the mineral key is provided, the lock turns. This proves the information exists independently of the specific vent instance.

  **Crux 2: The Evolutionary Trajectory**
  *   **Question:** Does the Kestrel Agent evolve towards independence or deeper dependency?
  *   **Test:** Long-term isolation of Kestrel Agents in a vat supplying raw building blocks but no host cells.
  *   **Prediction (A/Metabolic):** No change. Without a host to exploit, there is no selection pressure for independence, only extinction. It confirms they are metabolic dead-ends.
  *   **Prediction (B/Informational):** Emergence of membrane-like structures. Evolution favors persistence; if the host is removed, variants that can capture raw blocks will be selected for. It confirms they are latent life forms.

  **Crux 3: The Protection Threshold**
  *   **Question:** Does Statute 12 protect "Life" or "Complexity"?
  *   **Test:** Board ruling on whether the Cinder Field (dormant vent) retains protected status despite zero current replication.
  *   **Prediction (A/Metabolic):** Protected. The chemical structures persist and maintain themselves slowly. The *process* of self-maintenance continues, even if slow.
  *   **Prediction (B/Informational):** Not Protected. Without evolution occurring, there is no biological process to protect. It is merely geology with a memory.

  **4. SEMANTIC NOTE**

  Signatory B contends that 40% of the disagreement is verbal: Signatory A uses "Alive" to mean "Physically Autonomous," while Signatory B uses "Alive" to mean "Historically Continuous." Both agree the Plume Filaments are unique and fragile. Both agree drilling will destroy them. The fight is over whether the word "Life" is the necessary trigger for protection, or if a new category ("Protected Phenomenon") would suffice. Signatory A refuses this compromise, arguing that removing the label "Life" invites exploitation of other edge cases.

  ***

  **PRIVATE ADDENDUM (NOT FOR BOARD)**

  **Aris:** Vance caved on the Kestrel classification; he let me list it as "parasitic" in the summary so long as I didn't block the "Darwinian" label on the Plumes.
  **Vance:** Aris caved on the protection language; he stopped arguing that only "true life" deserves rights and accepted that "unique evolutionary history" is enough for the permit denial.
