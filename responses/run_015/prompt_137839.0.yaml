answer: |-
  This is a classic problem in constructing a *pramāṇa* theory: you are trying to bridge classical Nyāya externalism (causal reliability) with modern intuitions that lean toward virtue epistemology (agent competence) and social epistemology (testimony chains). Your current draft principle breaks because it treats "source" too uniformly. It doesn't distinguish between an instrument's mechanical integrity and an agent's cultivated disposition.

  Here is the diagnosis of your draft, three candidate principles to repair it, and the identification of the sacrificial lamb.

  ### Diagnosis of Your Draft Principle
  *Current Draft:* (a) General Reliability + (b) No Instance Defect + (c) Novelty.

  1.  **The Doctor/Thermometer Contradiction:** Your draft treats the Doctor and the Broken Thermometer identically under (a) and (b). Both have a "source with a good track record" (Doctor's reputation/Thermometer brand) that is "defective in the instance" (Sloppy reasoning/Broken sensor). To save the Doctor verdict while keeping the Thermometer verdict, you must distinguish between *articulated process* (reasoning) and *underlying capacity* (expertise).
  2.  **The Spirit/Keys Problem:** Your draft fails here because (a) and (b) are satisfied for both. You looked (reliable source), nothing blocked the view (no defect). The difference is not in the source, but in the *object's fitness* to be perceived (*yogyatā*).
  3.  **The Novelty Glitch:** Your suspicion is correct. In Nyāya, *pramā* is defined as *anadhigata* (unapprehended before) primarily to exclude *memory* from being a *pramāṇa*-generated cognition. However, a second perception of the same fire *is* a *pramā* (true cognition), even if it isn't *new* information. Your clause (c) conflates "Knowledge" with "New Learning."

  ---

  ### Candidate Principle 1: The Causal-Integrity Principle
  **Statement:** A cognition counts as knowledge iff it is true, and the truth of the cognition is causally sustained by the *operative excellences* (*guṇas*) of the generating instrument, without interference from *defects* (*doṣas*) that sever the link between object and cognition.

  *   **Motivation:** Solves the Mist/Smoke case (fire didn't cause the cognition) and the Broken Thermometer (sensor defect severs the link).
  *   **How it handles the Doctor:** You must classify the Doctor's "sloppy reasoning" as epiphenomenal. The knowledge comes from their *expertise* (a latent disposition/*saṃskāra* functioning as perception), not the sloppy inference. The "source" is the expertise, not the argument.
  *   **How it handles Spirit/Keys:** The eyes have the excellence to detect keys (reflect light, occupy space). They lack the excellence to detect spirits (no causal interaction). The causal chain for spirits is null.
  *   **Verdicts Saved:** Smoke/Fire, Mist/Smoke, Broken Thermometer, Keys, Spirit.
  *   **Verdicts Dropped/Modified:**
      *   **Doctor:** You must accept the knowledge comes from *perception/expertise*, not the sloppy inference. If you insist the sloppy inference produced it, this principle kills the verdict.
      *   **Novelty:** This principle ignores novelty. Seeing the fire twice is knowledge both times.
      *   **Memory:** Memory is not generated by a current causal link to the object, so it is not *pramāṇa*-knowledge under this principle (though it remains true).
  *   **Predictions:**
      *   *New Instrument:* If it is reliable but you don't know it, it is still knowledge (externalism).
      *   *Parent/Child:* If the parent is confident but wrong about the mechanism, but the fact is true: Not knowledge (causal link broken by falsehood).
      *   *Photograph:* Knowledge, provided the photo is causally linked to the scene (not photoshopped).
      *   *Conflict:* The cognition with the intact causal chain wins; the other is *saṃśaya* (doubt).

  ### Candidate Principle 2: The Competence-Environment Fit
  **Statement:** A cognition counts as knowledge iff it results from the successful exercise of a cognitive competence (in an agent or instrument) within an environment for which that competence is designed, yielding a true belief.

  *   **Motivation:** Solves the Doctor/Thermometer tension. The Doctor's competence (medical intuition) is intact and designed for diagnosis. The Thermometer's competence (sensor mechanism) is broken. It distinguishes *agent virtue* from *instrument function*.
  *   **How it handles Spirit/Keys:** The human visual competence is designed for macroscopic physical objects (keys), not metaphysical entities (spirits).
  *   **Verdicts Saved:** Doctor, Broken Thermometer, Keys, Spirit, Gavaya (comparison is a competence).
  *   **Verdicts Dropped/Modified:**
      *   **Airline App:** This gets tricky. Is the "network" a competence? If you treat the App as an instrument, it works. If you treat it as testimony, you lack a "trustworthy speaker." This principle pushes you toward treating the App as an instrument (like a thermometer).
      *   **Chatbot:** If the Chatbot is not a competent agent (no understanding), this principle denies knowledge.
      *   **Novelty:** Like Principle 1, this drops the novelty requirement. Re-seeing the fire is an exercise of visual competence.
  *   **Predictions:**
      *   *New Instrument:* If it functions according to design, it yields knowledge even if uncalibrated by you (environment fit matters more than user calibration).
      *   *Parent/Child:* If the parent speaks outside expertise, they are not exercising competence. Not knowledge for the child (defective source).
      *   *Conflict:* Indicates one competence is being used outside its designed environment.

  ### Candidate Principle 3: The Informational-Link Principle (Hybrid)
  **Statement:** A cognition counts as knowledge iff it carries accurate information about the world, delivered by a channel that preserves that information from source to cognition, where the channel is either (i) a natural faculty operating without defect, or (ii) a social instrument backed by accountable agency.

  *   **Motivation:** Specifically designed to save your Testimony verdicts (Airline App) while killing the Chatbot. It introduces an "Accountability" clause for testimony.
  *   **How it handles Doctor/Thermometer:** The Doctor is an accountable agent; the Thermometer is not. When the Thermometer breaks, the channel is corrupted. When the Doctor reasons sloppily but lands on truth via expertise, the *agent* remains the source of accountability.
  *   **Verdicts Saved:** Airline App, Chatbot (denied), Doctor, Thermometer.
  *   **Verdicts Dropped/Modified:**
      *   **Memory:** Memory is an internal channel. It preserves information. This principle might grant it knowledge status, contradicting Nyāya orthodoxy but matching your intuition.
      *   **Novelty:** Dropped.
  *   **Predictions:**
      *   *New Instrument:* Knowledge, if it functions as a natural faculty extension (like glasses).
      *   *Parent/Child:* Knowledge, if the parent is an accountable agent, even if outside strict expertise (we trust agents broadly).
      *   *Conflict:* Requires checking the accountability of the sources.

  ---

  ### The Sacrificial Lamb

  You asked for honesty. Your verdicts are not a mess, but your **Novelty Clause (c)** is incompatible with your **Redundant Perception Verdict** (seeing the flames after inferring them).

  In Nyāya, *pramā* (true cognition) is distinct from *pramāṇa* (instrument). *Pramāṇa* generates *pramā*.
  *   **The Conflict:** You want the second cognition (seeing flames) to be knowledge. It *is* a *pramā*. But you want to keep the Novelty clause. Nyāya uses Novelty to distinguish *pramāṇa*-generated cognition from *memory*. It does *not* usually deny that re-perceiving an object is *pramā*.
  *   **The Fix:** Drop Novelty as a condition for **Knowledge**. Keep it as a condition for **Learning** (or *pramāṇa* in the strict sense of "new generator").
  *   **Why:** If you keep Novelty, you must say seeing the fire the second time is not knowledge. That contradicts your intuition that "I'm more confident, I'd act faster." Confidence and action-readiness are markers of knowledge.

  **The Second Lamb (Harder Pill):**
  You must reconcile the **Doctor** case.
  *   If the Doctor reasons *sloppily*, standard Nyāya classifies that as *hetvābhāsa* (pseudo-inference). It cannot yield knowledge.
  *   To save your verdict that this *is* knowledge, you must reclassify the cognitive event. It is not Inferential Knowledge. It is **Perceptual Knowledge based on Expertise** (*yogipratyakṣa* or simply *taj-jñatva*). The "sloppy reasoning" is post-hoc rationalization. The knowledge came from a direct perception of the symptoms by a trained eye.
  *   **If you refuse this reclassification:** You must sacrifice the Doctor verdict. A defective process cannot yield knowledge, even in a competent agent, unless the process is bypassed.

  ### Recommended Synthesis for Your Seminar

  Write this on the board:

  > **A cognition is knowledge-producing (*pramāṇika*) iff:**
  > 1.  **Truth:** The content corresponds to the state of affairs (*yathārtha*).
  > 2.  **Causal Integrity:** The cognition is caused by the object (or a reliable sign of it) via a chain free of truth-defeating defects (*doṣa*).
  > 3.  **Competence:** The instrument or agent possesses the specific fitness (*yogyatā*) to apprehend this type of object.
  > 4.  **Generativity:** The cognition is not *merely* a recollection of a prior cognition (Memory preserves knowledge; *Pramāṇa* generates it).

  **How this handles your specific headaches:**
  *   **Doctor:** Satisfies 2 & 3 via Expertise (Perception), not Reasoning (Inference).
  *   **Broken Thermometer:** Fails 2 (Defect in chain).
  *   **Spirit:** Fails 3 (No fitness to apprehend spirits).
  *   **Redundant Fire:** Satisfies all. It is Generative (new visual event), not merely Memory.
  *   **Chatbot:** Fails 3 (No agency/competence).
  *   **Airline App:** Satisfies 2 (Chain of accountable agents preserves information).

  **Predictions for your unlisted cases:**
  1.  **Brand-new instrument (reliable but uncalibrated):** Knowledge. (Externalism: Competence exists in the object, regardless of user calibration).
  2.  **Parent telling child truth outside expertise:** Knowledge. (Testimony relies on agent accountability, not just domain expertise, unless the claim is patently absurd).
  3.  **Photograph:** Knowledge. (It is a causal trace, functioning as a mechanical extension of perception).
  4.  **Conflicting Pramāṇas:** Doubt (*saṃśaya*). Knowledge requires the absence of defeaters. If Perception says "Fire" and Inference says "No Fire," the causal integrity of one is compromised. You cannot know until the conflict is resolved.

  **Final Advice:**
  Tell your students that the "Novelty" condition in classical definitions is often a proxy for "Non-Memory." It is not meant to ban re-acquaintance. Tell them the "Doctor" case forces us to choose between Process Reliabilism (Doctor fails) and Virtue Reliabilism (Doctor succeeds). Nyāya is usually Process Reliabilist, so saving the Doctor requires admitting the *process* was actually Perception, not Inference. That is the precise philosophical move that resolves the tension.
