      *   **Luther's Theology:** *De Servo Arbitrio* (The Bondage of the Will). Human will is not free in spiritual matters. It is bound to sin or God. Salvation is monergistic (God alone acts). Predestination is absolute. Human "freedom" is compatible with necessity, not libertarian freedom.
