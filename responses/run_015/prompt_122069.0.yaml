  # Spec Sheet: Normative Adequacy for Geometric Rationality

  **Subject:** Normative Foundations of Geometric Growth Optimization  
  **Context:** Decision theory under uncertainty, ergodicity economics, algorithmic trading, self-modifying agents.  
  **Objective:** Define necessary conditions for a theory of geometric rationality to transcend heuristic status and function as a complete normative framework.

  ---

  ## I. Core Desiderata

  ### 1. Ergodic Derivation without Subjective Risk Parameters
  *   **Motivating Case:** The theory must recover the classic Kelly criterion ($f^* = p - q/b$) strictly from the maximization of time-averaged growth rates in stationary, independent trials. It cannot invoke a subjective utility function $U(W) = W^{1-\gamma}/(1-\gamma)$ where $\gamma$ is a free parameter representing "risk aversion." The log-utility must emerge from the dynamics of wealth compounding, not from psychological preference.
  *   **Status:** **Non-negotiable.** Without this, the theory collapses into standard Expected Utility (EU) theory with a specific parameter choice, losing its claim to be a distinct "geometric" rationality.
  *   **Difficulty:** **High.** Requires justifying the normative priority of time-averages over ensemble-averages for a single agent without begging the question. It demands a rigorous link between physical dynamics (multiplicative processes) and rational obligation.

  ### 2. Robustness to Ontological (Model) Uncertainty
  *   **Motivating Case:** Agents face uncertainty not just over coin flips, but over the payoff structure itself (e.g., is the coin biased? is the market regime changing?). The theory must prescribe betting fractions under Knightian uncertainty without collapsing into Bayesian EU over a hyper-prior (which reintroduces additive utility) or Minimax (which kills growth).
  *   **Status:** **Non-negotiable.** Real-world environments are non-stationary; a theory requiring known distributions is merely a mathematical toy.
  *   **Difficulty:** **Very High.** Standard geometric growth assumes a known drift $\mu$. Incorporating uncertainty over $\mu$ typically forces a Bayesian update that looks like EU maximization. Distinguishing "geometric caution" from "risk aversion" in this context is formally elusive.

  ### 3. Reflexive-Bet Consistency (Endogenous Odds)
  *   **Motivating Case:** In prediction markets, venture capital, or political campaigning, the wager itself alters the probability of the outcome or the available odds (performativity). The growth rate $g$ becomes a function of the bet $f$: $g(f, P(f))$. The theory must solve for the fixed point where the bet is optimal given the belief, and the belief is calibrated given the bet's impact.
  *   **Status:** **Non-negotiable.** Applying Kelly to markets that react to Kelly-sized orders is dynamically unstable without this.
  *   **Difficulty:** **Extreme.** This breaks the i.i.d. assumption required for the Law of Large Numbers and Ergodic Theorems. It transforms the problem from optimization to game theory/equilibrium finding, potentially eliminating the unique log-optimal solution.

  ### 4. Descriptive Compatibility with One-Shot Deviations
  *   **Motivating Case:** Empirical agents reject log-optimal bets in high-stakes, single-shot scenarios (e.g., Allais paradox, "bet your life" scenarios). An adequate normative theory must explain why deviating from geometric growth is rational in finite horizons without labeling the agent "irrational" or "noisy."
  *   **Status:** **Preference (Pragmatic Camp).** A pure theorist might reject this (normative $\neq$ descriptive), but for a theory of *agency*, ignoring horizon effects is fatal.
  *   **Difficulty:** **High.** Geometric rationality is asymptotically dominant. Justifying deviation requires introducing boundary conditions (e.g., ruin constraints, finite utility of life) that risk violating Desideratum 1.

  ### 5. Epistemic-Pragmatic Separation
  *   **Motivating Case:** Beliefs should track truth (calibration), and bets should track survival (growth). The theory must prevent the "betting definition of probability" (operationalism) from collapsing epistemic rationality into pragmatic optimization. An agent should be able to hold a correct belief but bet differently due to leverage constraints, without being deemed epistemically irrational.
  *   **Status:** **Non-negotiable.** Collapsing belief into betting behavior prevents scientific learning and makes disagreement impossible to model formally.
  *   **Difficulty:** **Medium-High.** Kelly traditions often identify probability $p$ with optimal fraction $f^*$. Decoupling them requires a two-stage architecture (Inference $\to$ Action) that must not reintroduce EU-style utility functions in the action stage.

  ### 6. Principled Fractionalization
  *   **Motivating Case:** Practitioners routinely bet "Half-Kelly." The theory must derive fractional betting from first principles (e.g., as a response to Desideratum 2: model uncertainty) rather than treating it as a heuristic patch for "nerves" or "drawdown control."
  *   **Status:** **Preference (Implementation Camp).** Pure Kelly advocates view this as sub-optimality; practitioners view it as essential. An adequate theory must adjudicate this.
  *   **Difficulty:** **Medium.** If fractional Kelly is optimal under model uncertainty (as some proofs suggest), this satisfies Desideratum 2. If it is merely risk aversion, it violates Desideratum 1.

  ---

  ## II. Analysis of Tensions and Unsatisfiable Clusters

  There is a significant structural conflict between **Desideratum 1 (Ergodic Derivation)**, **Desideratum 3 (Reflexivity)**, and **Desideratum 5 (Epistemic-Pragmatic Separation)**.

  1.  **The Ergodic-Reflexivity Conflict:** Desideratum 1 relies on the existence of a stationary, measure-preserving transformation to define the time-average growth rate. Desideratum 3 posits that the agent's action changes the measure (the odds/probabilities). If the measure changes endogenously based on the strategy being optimized, the system is non-ergodic in the strict sense required for the Kelly derivation. You cannot maximize a time-average growth rate if the rate itself is a moving target dependent on the maximization path.
  2.  **The Separation-Reflexivity Conflict:** If bets influence outcomes (Desideratum 3), then "true" probabilities are partially constituted by the agent's actions. If epistemic rationality requires beliefs to match true probabilities (Desideratum 5), then beliefs must update based on intended actions. This creates a circular dependency: *I believe X because I will bet Y, but I will bet Y because I believe X.* Resolving this fixed point often requires collapsing belief into preference (violating Desideratum 5) or treating the environment as exogenous (violating Desideratum 3).

  **Jointly Unsatisfiable Cluster:** **{1, 3, 5}**
  *   You cannot maintain strict ergodic derivation (1) while allowing endogenous outcome modification (3) without conflating belief and action (5).

  ---

  ## III. Candidate Scorecard

  | Criterion | **Pure Kelly (Log-Utility)** | **Fractional Kelly (Heuristic)** | **EU + Explicit Risk Aversion** |
  | :--- | :--- | :--- | :--- |
  | **1. Ergodic Derivation** | **Pass.** Derives log from time-averages. | **Fail.** Sub-optimal growth by definition. | **Fail.** Smuggles in $\gamma$ parameter. |
  | **2. Ontological Uncertainty** | **Fail.** Assumes known $p$. | **Partial.** Often justified by parameter uncertainty. | **Pass.** Handles via priors over models. |
  | **3. Reflexive Bets** | **Fail.** Assumes exogenous odds. | **Fail.** No formal mechanism for feedback. | **Pass.** Can model as game-theoretic utility. |
  | **4. One-Shot Deviations** | **Fail.** Deems deviations irrational. | **Pass.** Accommodates via "safety" margin. | **Pass.** Built into curvature of $U(W)$. |
  | **5. Epistemic/Pragmatic** | **Fail.** Often conflates $p$ with $f^*$. | **Pass.** Allows separation (belief $\neq$ bet size). | **Partial.** Beliefs often derived from revealed preference. |
  | **6. Fractionalization** | **Fail.** Views as irrational. | **Pass.** But lacks first-principles derivation. | **Pass.** Derived from $\gamma > 1$. |

  **Summary:**
  *   **Pure Kelly** satisfies the core mathematical claim (1) but fails in complex, real-world environments (2, 3) and creates philosophical confusion (5).
  *   **EU + Risk Aversion** is the most flexible (2, 3, 4) but fails the specific mandate of geometric rationality to eliminate subjective risk parameters (1).
  *   **Fractional Kelly** is the pragmatic compromise but lacks a unified normative theory, oscillating between "robust Kelly" and "soft EU."

  ---

  Verdict: The cluster {(1), (3), (5)} is jointly unsatisfiable.
