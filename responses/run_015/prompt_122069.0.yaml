prompt: |-
  I'm putting together a spec sheet for a seminar on rational decision-making under uncertainty, and I'm stuck on what a normative theory of geometric rationality actually has to deliver before it counts as adequate rather than just a useful heuristic. I don't want another defense of Kelly betting; I want the full desiderata list — the phenomena it must cover, the distinctions it can't collapse, the puzzles it must dissolve — especially now that people are applying log-optimal reasoning to prediction markets, self-modifying agents, and compound leverage structures where the betting environment itself reacts to the wager.

  Write the requirements an adequate theory of geometric rationality (in the Kelly / log-utility tradition) must satisfy to be considered adequate. For each: the motivating case or formal distinction behind it, whether you treat it as non-negotiable or as a preference of one camp, and what makes it hard. Be explicit about at least these pressure points: (1) recovery of the classic ergodic Kelly result for independent, stationary trials without smuggling in an independent risk-aversion parameter; (2) handling ontological uncertainty — uncertainty not merely over outcomes but over which payoff structure or world-model is correct — without collapsing into standard expected utility; (3) the reflexive-bet problem, where placing a wager either updates the agent's own credences or shifts the outcome distribution (as in prediction markets, self-fulfilling beliefs, or strategic disclosure), so that geometric growth is no longer exogenous to the belief state; (4) consistency with the empirical pattern that real agents systematically deviate from log-optimality in high-stakes, one-shot choices (Allais-style reversals) without writing that deviation off as pure noise or irrationality; (5) preservation of a real, non-reducible distinction between epistemic rationality (getting beliefs calibrated) and pragmatic rationality (getting outcomes optimized), rather than collapsing the former into optimal betting behavior; and (6) a principled, non-ad-hoc account of fractional Kelly adjustments — whether drawdown constraints are rational modifications of the criterion or post-hoc patches.

  Flag any subset of these you think is jointly unsatisfiable, especially whether (3) can be integrated with (1) while (5) remains intact. Then briefly score pure Kelly, fractional Kelly, and standard Bayesian expected-utility with explicit risk aversion against the list, but keep the weight on the criteria and their interactions rather than on the scorecard. End with a single line: Verdict: [the jointly unsatisfiable cluster, or "none" if you think the full set is consistent].
