      *   *(2) Ontological Uncertainty:* Model uncertainty (Knightian). Standard EU handles this via priors over models. Geometric rationality needs to handle it without collapsing to EU (which implies additive utility). *Difficulty:* Very High. Log-utility is usually defined *given* a model.
      *   *(3) Reflexive Bets:* The bet changes the odds or the belief. Endogenous risk. Kelly assumes exogenous odds. *Difficulty:* Extreme. This breaks the i.i.d. assumption fundamental to the ergodic argument.
      *   *(4) One-Shot Deviations:* Allais paradox, etc. People aren't log-optimizers in single shots. Theory must explain this without calling people "irrational." *Difficulty:* High. Normative theories usually prescribe, not describe. Bridging the gap requires redefining rationality or time-horizon.
      *   *(5) Epistemic vs. Pragmatic:* Beliefs $\neq$ Bets. Standard Kelly sometimes blurs this (betting reveals belief). Need to keep them distinct. *Difficulty:* Medium-High.
