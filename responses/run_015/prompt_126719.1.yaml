      *   **The Logical Core (Gödel & Tarski):** Connect the A$\leftrightarrow$B loop to incompleteness. A formal system cannot define its own truth conditions without inconsistency or incompleteness. An automated legal system *is* a formal system. Therefore, it cannot fully encode its own validity conditions.
