prompt: |-
  You are an expert philosopher of science with particular attention to methodological debates in economics and physics. Before answering, please take a moment to outline the core commitments of each view separately, then proceed to the comparison.

  Compare Milton Friedman’s “F-twist” defence of unrealistic assumptions in scientific modelling—where predictive accuracy, rather than descriptive realism, justifies premises that are known to be false—with what we might call a “counterfactual-anchor” account of idealisation. On this latter view, unrealistic assumptions do not merely serve as predictive instruments; rather, they function as fixed points that stabilise the modal structure of a model across counterfactual perturbations, allowing the model to reveal which dependencies are robust and which are artefacts of the simplifying framework.

  Your comparison should address three specific points. First, how does each view explain the success of a model that relies on obviously false assumptions—say, the assumption of perfect rationality in a market-equilibrium model—when that success is not merely predictive but apparently explanatory? Second, to what extent can the counterfactual-anchor account absorb Friedman’s instrumentalist challenge without collapsing into it? Third, apply the distinction between “descriptive stripping” (removing detail that is present in the target) and “prescriptive locking” (fixing a parameter to prevent it from varying with others, thereby imposing a structure that the target does not possess). Show how this distinction affects the comparison, particularly regarding whether an idealisation can be evaluated independently of the predictive targets it serves.

  Write in a formal, analytical register suitable for a specialist audience. Do not provide a bibliography, reading list, or citations; I am working without access to external sources. Keep your response to roughly 600–800 words, and conclude with a brief note identifying which feature of the case does the central philosophical work and what happens if that feature is removed.
