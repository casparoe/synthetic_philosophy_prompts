answer: |-
  **Core Commitments**

  **Friedman's Instrumentalism ("The F-Twist"):**
  The primary commitment is that the validity of a theory rests exclusively on the accuracy of its predictions, not the descriptive truth of its assumptions. Indeed, Friedman argues that significant assumptions *should* be unrealistic; high abstraction is necessary for generality. Assumptions are merely convenient fictions or "as if" devices designed to generate testable implications. The theory is a tool for organization, not a depiction of reality. Epistemologically, this view is anti-realist regarding theoretical entities and structural claims.

  **The Counterfactual-Anchor Account:**
  The primary commitment is that models function to reveal the modal structure of a system—specifically, which dependencies are robust across possible worlds. Unrealistic assumptions serve as "anchors" that stabilise the model against counterfactual perturbations, isolating specific causal capacities from confounding noise. The goal is explanatory depth regarding structural relationships, not merely empirical adequacy. Epistemologically, this view maintains a structural realism: while assumptions are false, the causal dependencies they isolate can be objectively real.

  **Comparison**

  **1. Explaining Success with False Assumptions**
  For Friedman, the success of a model relying on perfect rationality is purely empirical. If the model predicts equilibrium prices accurately, the assumption is vindicated instrumentally. Explanation is reduced to prediction; there is no further fact of the matter regarding *why* the model works. The assumption of rationality is justified solely because it yields the correct output, regardless of psychological reality.

  Conversely, the counterfactual-anchor account posits that success is explanatory because the assumption isolates a specific causal capacity. Perfect rationality does not describe agents but anchors the model to demonstrate how incentives *would* operate absent cognitive noise. The model succeeds because it correctly identifies a robust structural dependency that persists across counterfactual scenarios. Thus, the falsehood of the assumption is permissible only insofar as it facilitates the isolation of a real causal mechanism, rather than merely fitting data.

  **2. Absorbing the Instrumentalist Challenge**
  The counterfactual-anchor account can absorb Friedman's insistence on false assumptions without collapsing into instrumentalism by distinguishing between *assumption truth* and *structural fidelity*. It accepts Friedman's premise that assumptions need not be descriptively accurate. However, it rejects the conclusion that truth is irrelevant. For the anchor account, assumptions must be *structurally* appropriate to maintain modal stability. If a model predicts well but relies on a spurious dependency that fails under perturbation, Friedman remains satisfied, whereas the anchor account rejects the model as explanatorily deficient. This preserves a realist commitment to causal structure while acknowledging the instrumental utility of idealisation, preventing collapse by demanding robustness beyond mere actual-world prediction.

  **3. Descriptive Stripping vs. Prescriptive Locking**
  This distinction is critical for evaluating idealisations independently of predictive targets. "Descriptive stripping" removes existing details (e.g., friction), while "prescriptive locking" fixes parameters to values the target does not possess (e.g., infinite divisibility). For Friedman, both are evaluated identically: by predictive output. The nature of the idealisation is irrelevant.

  For the counterfactual-anchor account, prescriptive locking carries higher epistemic risk. Locking imposes a structure the target lacks, potentially creating artefactual dependencies. Consequently, this view allows for independent evaluation: one can assess whether a locking assumption preserves the relevant modal structure before testing against data. If the locking distorts the causal topology, the model is flawed even if it predicts accurately by accident. Friedman denies this possibility, rendering the internal architecture of the model opaque until empirical testing occurs.

  **Concluding Note**

  The central philosophical work is performed by the **modal status** of the model's relationships. The counterfactual-anchor treats relationships as capacities holding across possible worlds, whereas Friedman treats them as regularities holding in the actual world. If this modal feature is removed, the distinction between capturing a causal capacity and fitting a curve vanishes, collapsing the anchor account back into instrumentalism.
