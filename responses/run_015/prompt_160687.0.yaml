answer: |-
  Here is the 40-minute battle plan. It is designed for verbal people who smell BS when math is used as a bludgeon.

  ### 1. The Board (Before the Term "Dutch Book")
  Do not write "Dutch Book" until minute 15. If you write it earlier, they stop listening to the logic and start categorizing the topic as "Gambling Theory."

  **What goes on the board first:**
  Draw a simple ticket.
  *   **Left side:** "Pays $1.00 if Event X happens."
  *   **Right side:** "Pays $0.00 if Event X does not happen."
  *   **Bottom:** "Your Fair Price: $____"

  **The Definition:**
  Write this sentence underneath: **"Your fair price *is* your probability."**
  If you think there is a 60% chance, your fair price is $0.60. If you won't buy it for $0.61 and won't sell it for $0.59, you don't actually believe it's 60%.

  **Why this first:** It bypasses "belief" (which is fuzzy) and moves immediately to "commitment" (which journalists understand). You are establishing that a probability claim is a promise to take a specific side of a bet at a specific price.

  ### 2. The Single Example
  **Do not use a horse race.**
  *Why:* Horse races have "odds" set by a bookie. That introduces an external actor, vig, and market dynamics. You want this to be about *internal* consistency, not market inefficiency.

  **Use: A Three-Way Election.**
  *   **Scenario:** Candidates A, B, and C are running. One *must* win.
  *   **The Setup:** Ask the room for "fair prices" (probabilities) for each winning.
  *   **The Trap:** Elicit prices that sum to more than 100%. This is easy. People are overconfident.
      *   "Who thinks A has a 40% chance?" (Write $0.40 on board)
      *   "Who thinks B has a 40% chance?" (Write $0.40 on board)
      *   "Who thinks C has a 40% chance?" (Write $0.40 on board)
  *   **The Arithmetic:**
      *   Total Cost to buy all three tickets: **$1.20**
      *   Maximum Payout (since only one wins): **$1.00**
      *   **Net Result:** A guaranteed loss of $0.20.

  **Why this carries the whole thing:** It requires no knowledge of the candidates. It relies on the logical constraint (one must win) which is indisputable. It shows that you can be reasonable on every individual line item but incoherent in the aggregate.

  ### 3. Misconceptions: Order and Defusal
  They will arrive in this specific order. Do not wait for questions; preempt them at these exact timestamps.

  **Misconception 1: "So rationality just means not going broke."**
  *   **When:** Immediately after you reveal the $0.20 loss (Minute 15).
  *   **Defusal:** "If I bet one penny on each, I lose three cents. Does that matter? No. The money is just a scoreboard. The real loss is **contradiction**. You have asserted 'A might happen,' 'B might happen,' 'C might happen' in a way that logically cancels itself out. The Dutch Book doesn't punish you for being wrong; it punishes you for being inconsistent."

  **Misconception 2: "The bookie must be cheating or already know my numbers."**
  *   **When:** When explaining who takes the other side of the bet (Minute 20).
  *   **Defusal:** "There is no bookie. Or rather, *you* are the bookie. In this argument, you are required to take *either* side of the bet at your stated price. If you say the price is $0.40, you must be willing to buy it at $0.40 OR sell it at $0.40. The 'Dutch Bookie' is just a mirror reflecting your own prices back at you. You are betting against yourself."

  **Misconception 3: "Fine, but I don't gamble / This doesn't apply to news."**
  *   **When:** Wrap up (Minute 35).
  *   **Defusal:** "You make decisions under uncertainty every day. You allocate column inches, you assign reporters, you choose headlines based on the probability that a story will hold up. If your internal probabilities are incoherent, you will allocate resources inefficiently. You'll chase stories that can't all be true. This isn't about casinos; it's about resource allocation under uncertainty."

  ### 4. The Generalization (The Template)
  **Where:** Minutes 30–35.
  **How:** Do not draw new diagrams. Use the "Coherence Test" framing.

  Say this: "The Dutch Book isn't a fact about betting. It's a **template for testing norms.**"
  *   **Static Coherence:** (What you just showed them). Your probabilities at one moment must sum to 1.
  *   **Dynamic Coherence:** "We can run the same test on how you *change* your mind."
  *   **The Pitch:** "If you plan to update your belief based on new evidence, there is a specific rule (Conditionalization) you must follow. If you don't follow it, a Dutch Bookie can construct a sequence of bets over *time* that guarantees you lose money, just like the single-moment example guaranteed loss over *options*."
  *   **The Limit:** Stop there. Do not explain *how* the dynamic book works. Just establish that the *logic* (inconsistency → guaranteed loss) applies to updating rules and base rate matching too. It turns "You should update this way" from a preference into a consistency requirement.

  ### 5. The Closing Question
  Do not ask: "What is a Dutch Book?" (They will recite the definition).
  Do not ask: "How do you avoid one?" (They will say "Sum to 100%").

  **Ask this:**
  > "If I have incoherent beliefs that allow a Dutch Book to be made against me, does that prove my predictions are **false**?"

  **The Answer you want to hear:** "No. It proves they are **inconsistent**. I could be perfectly accurate every time, but if my stated confidence levels don't add up, I'm still vulnerable."
  *This confirms they understand the argument is about structure/coherence, not truth/accuracy.*

  ### 6. The Refusal
  **What to openly refuse to get into:**
  > "I am not going to tell you **what the probabilities actually should be.**"

  **Why:** Journalists always want the "right" answer. They will ask, "Okay, so what *is* the real chance Candidate A wins?"
  **The Line:** "The Dutch Book argument is agnostic on truth. It doesn't tell you how to find the truth; it only tells you how to stop contradicting yourself once you've made a claim. It polices the grammar of your uncertainty, not the facts."

  ### Summary Timeline
  *   **00-05:** Board Setup (Ticket & Price = Probability).
  *   **05-15:** The 3-Candidate Example (The Trap).
  *   **15-20:** Defuse "Money vs. Logic" & "The Bookie."
  *   **20-30:** Why this matters (Coherence vs. Truth).
  *   **30-35:** The Template (Updating/Conditionalization mention).
  *   **35-40:** The Closing Question & The Refusal.
