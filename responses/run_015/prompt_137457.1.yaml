answer: |-
  **Lecture Allocation (24 Lectures)**

  1.  **Individual lives (Microhistory):** 4 lectures.
  2.  **Household, village, parish, workshop:** 6 lectures.
  3.  **Institutions and organisations:** 5 lectures.
  4.  **Elites, cabinets, diplomacy, legislation, war:** 5 lectures.
  5.  **Transnational and systemic processes:** 4 lectures.

  I reached this allocation **in spite of** the napkin formula, because the formula treats these registers as competing silos rather than interlocking layers of the same reality.

  ***

  **Intermediate Terms**

  1.  **Individual lives:** Causal Work 3/10; Archive Distortion 9/10. Direction: Towards the **heterodox** (only the unusual leave a trace).
  2.  **Household and community:** Causal Work 7/10; Archive Distortion 7/10. Direction: Towards the **propertied** (heads of households appear in tax records, dependents do not).
  3.  **Institutions:** Causal Work 8/10; Archive Distortion 5/10. Direction: Towards the **official** (internal minutes survive, informal practices vanish).
  4.  **Elites and State:** Causal Work 8/10; Archive Distortion 3/10. Direction: Towards the **victorious** (winners write the treaties and keep the chancery records).
  5.  **Systemic processes:** Causal Work 9/10; Archive Distortion 8/10. Direction: Towards the **catastrophic** (famine and plague are recorded; slow stability is invisible).

  ***

  **Tier List by Corrective Value**

  **Tier 1: Transnational/Systemic and Individual Lives**
  These two registers offer the highest corrective value because students arrive assuming history is driven solely by national political agency; the systemic shows them the cage, while the microhistorical shows them the mouse gnawing the bars.

  **Tier 2: Household and Community**
  This lands in the middle because while it corrects the assumption that public life was the only life, students often intuitively grasp that families mattered, even if they misunderstand the structure of those families.

  **Tier 3: Institutions and Elites**
  These occupy the bottom tier not because they are unimportant, but because they offer the least corrective value; students already over-index on kings and wars, so teaching more of this reinforces existing biases rather than rectifying them.

  *Disagreement Note:* The lecture allocation grants more time to the Tier 3 registers (10 lectures) than to the Tier 1 registers (8 lectures). This is a deliberate concession to narrative chronology; students need the scaffold of dates and states to locate the systems and individuals, even if the intellectual heavy lifting lies in the latter.

  ***

  **Verdict on the Formula**

  The formula is a useful heuristic for identifying bias, but it fails as an allocation tool because it assumes causation is divisible. It most **over-rewards** the Transnational/Systemic register, as the high causal score and high student error inflate its claim despite the legibility penalty. It most **under-rewards** Individual Lives, because the legibility penalty (the divisor) crushes the score for microhistory, ignoring that its value lies precisely in its exceptionality. The term that does the most damage is **'Share of causal work'**, because it implies we can measure how much a peasant caused history versus a king without already choosing a theoretical lens; causation is not a pie to be sliced, but a web to be traced. Ultimately, the registers are not rival claimants but **nested**: you cannot teach the village without the parish, nor the parish without the state, nor the state without the climate. Treating them as nested suggests the allocation should not be chronological blocks, but rather spiral returns to the same period through different lenses, which my allocation approximates by keeping the numbers relatively balanced rather than letting the formula dictate a structural monopoly.

  ***

  **Two Pressures**

  **If I had to cut one register entirely:**
  I would cut **Individual Lives (Microhistory)**. The course would then be unable to say that historical actors possessed interiority or agency distinct from their social function; it would become a history of structures and constraints where people are merely variables, risking a return to the determinism your friend warns against, albeit from a structural rather than state-centred direction.

  **If compressed to a ten-lecture module:**
  The **Household** and **Individual** registers would lose their claim first. Compression favours the registers with the highest leverage over the widest geography; Systemic processes and State actions dictate the boundaries within which households and individuals operate. In a ten-lecture course, you are forced to teach the cage rather than the mice, because there is no time to show how the mice navigated it.
