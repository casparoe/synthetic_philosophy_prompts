  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, one detail:* The friend says it's an AI reconstruction of a 1920s piece. How does the friend *know* this? Did the garage seller know? Or is the friend speculating? I should mention that unless the user was sold a forgery *as* an original for a high price, the "cheated" angle is weak.
      *   *Focus:* Stick to the philosophical question about value.
