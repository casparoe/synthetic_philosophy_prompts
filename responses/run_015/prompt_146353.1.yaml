answer: |-
  **Dr. Aris Thorne:** Let's settle the protocol for the vessel. We have fuel for one immediate trip. If we go near, we rescue the three in calm waters. Because that trip is brief, we retain enough fuel for a potential second run later. If we go far, we rescue the thirty in the storm, but the fuel consumption is total. No second trip. Furthermore, the thirty share a single life-raft and water supply; saving any requires saving all. The three near are independent.

  **Dr. Lena Okonkwo:** Agreed on the facts. The question is the selection procedure. I propose a lottery where every individual receives one ticket. Thirty-three tickets total. If a ticket from the distant cluster is drawn, we go far. This gives every person an identical ex ante chance of rescue, roughly ninety percent for the distant group, ten percent for the near.

  **Thorne:** That procedure is unacceptable, Lena. You claim it's non-aggregative, but weighting probabilities by group size smuggles aggregation in through the back door. By giving the distant cluster thirty chances against the near cluster's three, you allow the larger group to outvote the smaller. This violates the separateness of persons. The thirty do not possess a collective claim that outweighs the three. We must flip a coin between the *options*: fifty percent chance we save the three, fifty percent we save the thirty.

  **Okonkwo:** But Aris, that ignores the pairwise comparison. If I compare any one person from the distant group to any one person from the near group, their claims are equal. Why should the mere fact that they are clustered together reduce their individual probability? My lottery respects each person's equal priority without summing welfare. It avoids the counterintuitive result where we might save one person over fifty simply because they were grouped differently.

  **Thorne:** It avoids that result only by aggregating claims. Consider the interdependence of the thirty. They are linked by the raft. Morally, this structural unity suggests they function as a single claimant unit. You cannot save one without saving all. Therefore, the choice is not between thirty individuals and three individuals; it is between one collective entity and three atomic individuals. Your lottery treats them as thirty separate claims, which relies on an unrealistic moral atomism. It ignores that their fate is shared.

  **Okonkwo:** Physical interdependence doesn't merge moral persons. They are still thirty distinct consciousnesses. My lottery accommodates the raft constraint perfectly: if a distant ticket wins, all thirty are saved. If a near ticket wins, only that individual is saved initially, leaving the others for the second trip. But here is where your view falters. You insist on the fifty-fifty coin flip between options. If we go near, you admit a second trip is possible. Are you counting the potential lives saved on that second trip?

  **Thorne:** I cannot count them without violating anti-aggregationism. To weigh potential future lives against present certain lives is to engage in dynamic aggregation across time. It treats future persons as mere units to be summed against current persons. I must reject that. The decision now rests only on the immediate claimants: the three versus the thirty-unit.

  **Okonkwo:** So you admit that if we ignore the second trip, your view implies we might save the single collective unit of thirty only half the time, while the three individuals get the other half. But if we consider the second trip, you say we must ignore those future claims. This commits you to an implausible presentism about moral reasons. If the second trip saves certain, identifiable people, why does their temporal location negate their claim?

  **Thorne:** Because their claim is contingent on the first decision. They are not yet in peril. To count them now is to use them as a trump card against the thirty in the storm. It aggregates across time. But notice how your view collapses here. If you give every person an equal ticket, including potential future victims, you must estimate how many we might save later. That requires speculation and summation. You become a utilitarian calculating expected value. I remain consistent: only actual, present claimants count, and their grouping does not amplify their weight.

  **Okonkwo:** I don't need to sum expected value. I only need to acknowledge that the three near are not the only ones affected by the choice. However, let's return to the interdependence point. You argue the thirty are a single unit, justifying your fifty-fifty split between options. But this reveals the flaw in your strict anti-aggregationism. You treat the three near as atomic, yet the thirty far as fused. Why? If persons are separate, the raft doesn't change that. If persons are aggregable, the raft doesn't matter. You are selectively applying atomism to favor the smaller group.

  **Thorne:** I am not favoring them; I am respecting the structure of the choice. The thirty present a binary outcome: all or none. The three present a modular outcome. But my core point remains: your lottery gives the thirty a thirty-times greater chance of survival than the three. That is numbers counting. You say it's procedural fairness, but procedure cannot disguise the substantive outcome that the many outweigh the few.

  **Okonkwo:** It outweighs them only because there are more of them, not because their welfare sums to a greater total. Each ticket represents an equal moral status. If you deny this, you must accept that saving one person over fifty is permissible if the one flips heads. Most find that abhorrent. My view captures that intuition without abandoning the separateness of persons. I don't sum their pain; I honor their equal right to chance.

  **Thorne:** And I say that right to chance cannot be amplified by proximity to others. The thirty in the storm do not gain moral weight because they are crowded together. But I concede this tension regarding the second trip. If I reject dynamic aggregation, I risk ignoring future harms. Yet if I accept it, I betray the separateness of persons across time. Perhaps the interdependence of the thirty forces us to see that rescue ethics cannot be purely atomistic.

  **Okonkwo:** Precisely. The raft shows that context matters. My pairwise lottery respects the individuals while acknowledging the structural reality that saving them is a single act. You treat the act as the unit of choice; I treat the person as the unit of chance. Given the stakes, the person must prevail.

  **Thorne:** Then we remain at an impasse. You see a lottery of individuals; I see a choice between incompatible options. But I warn you, Lena: if you allow the thirty to dominate the probability space, you have already accepted that numbers count, whatever you call the mechanism.

  **Okonkwo:** And I warn you, Aris: if you refuse to let the numbers influence the chance, you have already decided that the many matter no more than the few, whatever you call the principle. The vessel waits. We must choose.
