answer: |-
  If you enforce laws solely for stability, you become complicit in atrocities like the Holocaust, proving that moral legitimacy matters more than order. Some injustices are simply too high a price for peace.

  History shows that regimes relying purely on force without justice inevitably collapse into revolution, meaning your strategy fails even on its own pragmatic terms. Long-term stability requires perceived legitimacy.

  This view collapses into "might makes right" because it treats existing power as the only source of legitimacy, ignoring Pascal's actual warning that force without justice is tyrannical. Consequently, your argument is merely might makes right in fancy clothes.

  It is also purely status-quo bias since it grants automatic authority to accidental historical outcomes rather than reasoned principles. This prevents necessary corrections to systemic errors like your zoning rule.

  There is a principled line where passively tolerating a bad law becomes actively enforcing injustice, specifically when your actions directly harm others rather than merely preserving a system. Defending the rule crosses this line by weaponizing stability against your neighbors.
