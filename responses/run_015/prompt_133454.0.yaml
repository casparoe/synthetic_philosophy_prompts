answer: |-
  **Project Title:** The Ontology of Decline: Kinetic Incidence vs. Structural Accessibility in Violence Metrics

  **Research Question**
  Can the global claim "violence is declining" possess a determinate truth value when metrics of actualized harm diverge from metrics of harm capacity? Specifically, if kinetic incidence falls while structural accessibility rises, is the claim necessarily ambiguous?

  **Project Summary**
  Public and academic debates regarding global violence trends (e.g., the "Pinker debate") are predominantly framed as empirical disputes. Proponents cite per-capita casualty rates; critics cite absolute death counts or marginalized suffering. Both sides assume that with better data, the truth value of "violence is declining" will settle. This project challenges that assumption. I argue the disagreement is ontological: "violence" lacks a single natural unit of measurement. Normalization choices (per capita, per conflict, per weapon) smuggle in normative judgments about whose vulnerability counts. To resolve this, I propose a new conceptual distinction: **Kinetic Incidence** (actualized harm events) versus **Structural Accessibility** (systemic conditions that make harm available to be actualized). Even with perfect data, these metrics can diverge. This project determines whether such divergence renders global violence claims indeterminate.

  **Methodology (Four-Month Schedule)**
  *   **Month 1: Conceptual Architecture.** Rigorous definition of Kinetic Incidence (KI) and Structural Accessibility (SA). I will map existing metrics onto these categories to demonstrate where current literature conflates them. Deliverable: A conceptual schema distinguishing event-based ontology from capacity-based ontology.
  *   **Month 2: Formalizing Divergence.** Construction of formal comparison cases where KI decreases while SA increases. I will model scenarios where deterrence or technology reduces actual deaths while increasing systemic lethality potential.
  *   **Month 3: Evaluation of Scenarios.** Application of the KI/SA framework to specific domains, limited to nuclear deterrence and digital infrastructure. This tests whether the divergence is theoretical or observable in current geopolitical conditions.
  *   **Month 4: Synthesis and Drafting.** Integration of analysis into a coherent argument regarding truth conditions for violence claims. Final polishing of the manuscript.

  **Deliverables and Failure Conditions**
  The primary deliverable is a journal-ready manuscript (approx. 8,000 words) suitable for philosophy of social science or interdisciplinary peace studies venues. A secondary deliverable is a visual framework illustrating the KI/SA divergence.

  **Failure Conditions:** The project fails if the distinction between KI and SA collapses under scrutiny (e.g., if SA is shown to be reducible to probabilistic KI) or if the divergence is proven to be merely semantic rather than ontological.

  **Scope Assessment**
  Four months is sufficient for the conceptual work and formal modeling, but tight for empirical validation. To remain feasible, I will restrict Month 3 case studies to illustrative scenarios rather than comprehensive data reviews. The risk is over-extending into political science empirical work; I will mitigate this by keeping the focus on the metaphysical implications of the metrics, not the geopolitical data itself.

  ***

  **Confidence Note**
  I am highly confident (85%) in the philosophical framing, specifically that metric selection involves ontological commitments often disguised as empirical choices. The point I am least sure about is the operationalizability of "Structural Accessibility." There is a risk that this concept may overlap too significantly with existing literature on "structural violence" or "risk assessment," requiring careful differentiation to ensure it counts as a novel contribution rather than a renaming of established concepts.
