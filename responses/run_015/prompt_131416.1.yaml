answer: |-
  ### The "Single Individual" Edit Protocol (10-Minute Version)

  **Purpose:** Prevent pieces that allow readers to hide in the crowd or turn subjects into abstract types.
  **Who:** Section Editors.
  **Time:** 10 minutes max per piece.

  #### Step 1: The Signature Test (Answerability)
  **Question:** Is there a specific human name attached to the *opinion* or *claim*?
  *   **Pass:** A named author takes responsibility for the argument.
  *   **Fail:** "Staff Editorial," "The Paper," "A Group of Students," or unnamed collective.
  *   **Hard Stop:** If **Fail**, do not publish as is. Either assign a named signatory or spike.
  *   **Exception (Hand-off):** If the piece relies on protecting a vulnerable source (whistleblower/victim), send to Editor-in-Chief (EIC). *Note: This is a values call, not a factual one. The EIC must verify the vulnerability.*

  #### Step 2: The Leveling Test (Specifics vs. Types)
  **Question:** Does the text describe a specific person/event, or does it turn a person/group into a representative "type"?
  *   **Pass:** "John Doe in Chem 101 said..." or "The safety valve on Machine X failed."
  *   **Fail:** "Students feel...", "International students think...", "The Administration is corrupt." (Generalizations that erase individual faces).
  *   **Hard Stop:** If **Fail**, rewrite required. Force the text to name names or specify instances. If it relies on an aggregate (polls) to make a moral claim, spike it.

  #### Step 3: The Spectator Test (Action vs. Opinion)
  **Question:** After reading, is the audience positioned to *judge* others, or to *decide* for themselves?
  *   **Pass:** The reader is prompted to check their own lab safety, talk to a specific person, or vote on a specific measure.
  *   **Fail:** The reader is prompted to feel outraged at a villain, nod in agreement with a vague sentiment, or feel part of a "movement" without a specific task.
  *   **Hard Stop:** If **Fail**, rewrite the conclusion/call-to-action. If the piece *only* works as outrage fuel, spike it.

  ---

  ### What Was Dropped from the Theory
  To make this fit a 10-minute checklist, I excised:
  1.  **The Religious Teleology:** Kierkegaard's ultimate goal is the individual's relationship to God. Here, the goal is ethical responsibility to the community.
  2.  **The Critique of Reflection:** Kierkegaard's deep historical analysis of "the age of reflection" is too abstract for an edit. We focus on the *output* (spectatorship) rather than the *epoch*.
  3.  **The Distinction Between Preaching and Journalism:** Kierkegaard thought the press was inherently corrupting. We are assuming the press can be redeemed if the *mode* of address changes.

  ---

  ### Queue Run-Through

  #### Piece 1: Unsigned Editorial ("The Campus Has Spoken")
  *   **Step 1 (Signature):** **FAIL.** "The Outlet is the author." This is the definition of the phantom public. No one is answerable if the poll is wrong or the sentiment shifts.
  *   **Step 2 (Leveling):** **FAIL.** "The Campus" is an abstract aggregate. It turns 10,000 individuals into one voice that doesn't exist.
  *   **Step 3 (Spectator):** **FAIL.** Invites readers to feel powerful because "we" won. No specific action required.
  *   **Verdict:** **SPIKE.**
  *   **Fix:** If you must run it, find one student willing to sign an op-ed saying, "Here is what the poll suggests to *me*," and change the headline to "What This Poll Means to Me."

  #### Piece 2: Lab Safety Exposé (Leaked Docs, Anonymous Source)
  *   **Step 1 (Signature):** **PASS/FAIL HYBRID.** The *reporter* is named (Good), but the *source* is anonymous (Bad). The knowledge comes from the shadows.
  *   **Step 2 (Leveling):** **PASS.** Specific lab, specific violations. Not attacking a "type" of person, but a specific safety failure.
  *   **Step 3 (Spectator):** **RISK.** If written as "Look how evil the lab managers are," it fails (spectator outrage). If written as "Here is the risk we all share," it passes (individual responsibility).
  *   **Verdict:** **HAND-OFF TO EIC / VALUES CALL.**
  *   **The Kierkegaardian Problem:** The procedure flags the anonymous source. Kierkegaard would argue that truth delivered in secret fuels gossip and suspicion, not ethical action. It allows the reader to judge the lab without the lab being able to answer directly to the accuser.
  *   **The Cost:** To follow the protocol strictly, you would have to **name the source** or **kill the piece**.
      *   *Option A (Name Source):* You endanger a whistleblower. (Unacceptable ethically, even if Kierkegaardian).
      *   *Option B (Kill Piece):* You protect the "purity" of communication but leave a safety hazard unaddressed.
      *   *Option C (The Compromise):* The Reporter must take *full* ownership. Not "Sources say," but "I have seen documents that show..." The Reporter becomes the answerable party for the truth of the leak. The piece must be framed not as a scandal for the public to consume, but as a direct demand for accountability addressed to the specific lab heads.
  *   **Recommendation:** Run it, but rewrite the framing. Remove "exposé" language. Use "Report." The reporter must stand as the single individual witnessing the truth, not a conduit for anonymous gossip.

  #### Piece 3: First-Person (Named Student, "International Student" framing)
  *   **Step 1 (Signature):** **PASS.** Named author.
  *   **Step 2 (Leveling):** **FAIL (Reception Risk).** The text is specific, but the framing ("What international students think") turns her into a representative type. It erases her individuality to make her a symbol.
  *   **Step 3 (Spectator):** **PASS/FAIL.** Depends on the ending. If it ends with "understand us," it's spectatorship. If it ends with "here is how I am navigating this," it's action.
  *   **Verdict:** **REWRITE FRAMING.**
  *   **Fix:** Change headline from "What International Students Think" to "How I Navigated [Specific Incident]." Add an editor's note clarifying this is one person's experience, not a representative sample. Force the reader to see *her*, not the *category*.

  ---

  ### Where The Procedure Misfires

  **1. The Epistemic Value of the Aggregate**
  Kierkegaard assumes "The Public" is always a lie. But sometimes, "The Campus Has Spoken" (polling data) *is* the only way to identify systemic issues that no single individual can see. If a lab is unsafe, one student's experience is anecdotal; a poll of 500 students is evidence. The Kierkegaardian check risks blinding you to structural patterns that only appear in the aggregate. It privileges the existential truth of the individual over the statistical truth of the system.

  **2. The Violence of Answerability**
  Demanding a name protects against irresponsibility, but it also exposes the vulnerable. In Piece 2 (the exposé), the Kierkegaardian demand for direct communication ignores power asymmetry. A student whistleblower *cannot* stand answerable before the University Administration without being crushed. Sometimes anonymity is not cowardice; it is the only condition under which truth can be spoken. Following the "Signature Test" strictly protects the powerful (who can afford to be named) and silences the weak.

  **3. Collective Action Requires a "Public"**
  Kierkegaard wants the "Single Individual." But student organizing, unions, and policy change require a "We." If you successfully block every piece that creates a sense of collective identity ("Students feel..."), you may atomize your readership to the point where political action becomes impossible. You might produce a paper full of ethically pure individuals who feel unable to act together.

  **4. The Burden on the Editor**
  This procedure shifts the burden of "answerability" onto your section editors. They now have to judge whether a piece invites "spectatorship." That is a subjective, philosophical call, not a copy-editing call. In a 10-minute window, this risks becoming a arbitrary censorship tool ("I don't like this opinion, so I'll call it spectatorship") rather than a genuine ethical check. You will need an appeals process for authors who feel their call-to-action was misread.
