      *   10-min procedure? Check.
      *   Ordered questions + Pass/Fail/Hand-off? Check.
      *   Note dropped theory? Check.
      *   Run on 3 pieces? Check.
      *   Honest on Piece 2? Check.
      *   Critique at end? Check.

  8.  **Final Polish:** Tone should be professional, direct, respectful of the user's expertise but focused on the practical task. Avoid academic jargon in the checklist itself. Ensure the "Piece 2" analysis acknowledges the tension between Kierkegaardian ethics and journalistic protection of sources. (Self-correction: Kierkegaard would likely view the *exposé* as fueling the "public" outrage rather than individual repentance/action. I need to make sure the procedure reflects that risk without being useless).

      *Refining Piece 2 Analysis:* The prompt says "I think it will give me an answer on (2) I won't like." This implies the Kierkegaardian lens might condemn the exposé. Why? Because it uses the press to create a public outcry (spectatorship) against an abstract entity (the Lab/Admin) based on hidden info. It turns readers into judges without full context. The "cost" is potentially spiking a vital safety story because the *method* relies on the very mechanisms (anonymous leaking, public shaming) Kierkegaard distrusts. I need to be clear about this tension.

      *Refining the Procedure:* Make sure the "Hand-off" captures the safety/whistleblower exception, because a hard "No" on anonymity kills all investigative journalism. The "Values Call" is where the Editor overrides Kierkegaard for utilitarian reasons.

      *Dropped Theory:* The religious teleology (before God), the specific critique of "reflection" as a historical epoch, the distinction between "preaching" and "journalism" (since we are doing journalism).

