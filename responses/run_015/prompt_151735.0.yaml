      *   *Correction on Theory of Change:* Does it presuppose norms change *through* shame? Or does it presuppose norms are *maintained* by shame but *changed* by argument? The prompt asks about *change*.
      *   *Refined View:* The system presupposes that *legitimacy* is derived from rational principle (to justify exclusion), but *compliance* is derived from reputational risk. Therefore, the theory of change is **Deliberative Status-Adjustment**. Norms change when the *status cost* of violating them outweighs the *benefit*, triggered by public deliberation that re-calibrates what counts as honorable.
