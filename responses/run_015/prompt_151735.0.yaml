      *   *Specific Vulnerability:* The causal link between "Public Argument" and "Status Shift." If status shifts happen *independently* of moral argument (e.g., purely tribal), then the CoC is just window dressing (ideology), not a governance tool.

  7.  **Drafting the Response (incorporating the above):**
