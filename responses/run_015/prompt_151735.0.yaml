  9.  **Final Polish:** Ensure the distinction between *norm justification* and *norm enforcement* is clear. Ensure the Appiah reference is integrated well. Make sure the "change my mind" section is specific. (Self-correction: Ensure I don't sound too cynical. The CoC might actually facilitate the argument that drives the shame.)

  *(Self-Correction during final review)*: I need to make sure I answer the specific question: "What philosophical commitments about how moral norms actually change does this institutional design presuppose?"
  *Answer:* It presupposes that norms change via **social calibration of honor**, facilitated by **codified focal points**. It rejects pure rationalism (reason alone doesn't move feet) and pure legalism (laws don't work without state power). It is a **Honor-Based Constructivism**.

