      *   *Tension:* The "Legalistic Façade" (CoC text) vs. The "Social Engine" (reputation). This looks like a category error or a functional hybrid.

  3.  **Step-by-Step Analysis Plan:**
      *   **Step 1: Phenomenological Description.** Accurately characterize the OSS governance model without judging it yet.
      *   **Step 2: Identifying the Implicit Theory.** Is it Rationalist? Materialist? Honor-based? It seems to be a hybrid, but which is *foundational*?
      *   **Step 3: Analyzing Tensions.** The gap between justification (principles) and mechanism (shame).
