answer: |-
  Here is the carving you asked for.

  ### The Name
  There is no single, settled term in legal theory or political science that captures this exact configuration. The closest established concept is the **Paradox of Self-Amendment** (specifically the *legal* variant, not the logical one), but that describes the *possibility* of the conflict, not the *state* of having two live rule-books.

  I propose the term: **Procedural Validity Schism**.

  I am coining this phrase to describe the specific structural condition you are in. It is distinct from a "Constitutional Crisis" (which implies a breakdown of order) and distinct from "Ambiguity" (which implies the text is unclear). In a Procedural Validity Schism, the text is clear, the procedures were followed, but two mutually exclusive rule-books claim valid lineage from the same source.

  **Confidence Level:** I am **85% confident** that "Procedural Validity Schism" is not an existing term of art you will find in a textbook. I am **95% confident** that it accurately describes the structure you outlined. I am **90% confident** that the "Paradox of Self-Amendment" is the correct philosophical neighbor, with the caveats below.

  ---

  ### The Closest Neighbor: The Paradox of Self-Amendment
  The philosopher Peter Suber wrote the definitive work on this (*The Paradox of Self-Amendment*, 1990). He distinguishes between the *logical* paradox (can a rule change itself?) and the *legal* paradox (does the new rule replace the old one?).

  **How your case differs:**
  Suber's work often focuses on whether the change is *possible*. You have passed the point of possibility; the change *happened*. Your problem is not "Can they do this?" but "Which reality counts?" Suber's paradox explains why the conflict exists (the rule authorized its own removal), but it doesn't name the resulting state of two coexisting validities. That is the **Schism**.

  ### Why the Other Neighbors Don't Fit

  **1. The Parliament Acts (Manner and Form)**
  *   **The Neighbor:** The UK debate over whether the 1911 Parliament Act could be used to pass the 1949 Act (which amended the 1911 Act). This is the "Manner and Form" argument: can you change the rules for making rules using the old rules?
  *   **The Difference:** In the UK system, there is a sovereign court system (ultimately the Supreme Court) that can declare one chain invalid. In your CLT, the adjudicator (the Chair) is *inside* the disputed system. The Parliament model assumes a referee outside the game; you have a referee wearing one of the team jerseys.

  **2. The German Basic Law (Eternity Clauses)**
  *   **The Neighbor:** Article 79 of the German constitution declares certain principles (human dignity, democracy) unamendable.
  *   **The Difference:** That is *substantive* entrenchment ("You cannot change X"). Your clause was *procedural* entrenchment ("You can change X, but only via Y process"). Substantive entrenchment creates a hard wall; procedural entrenchment creates a hurdle. Your board jumped the hurdle, but the other side says the hurdle was actually a wall. The German model doesn't account for the "two rule-books" outcome because the German Constitutional Court would simply void the violation.

  **3. Hart's Rule of Recognition**
  *   **The Neighbor:** H.L.A. Hart's theory that law exists because officials *accept* a ultimate rule (the Rule of Recognition) that validates all other rules.
  *   **The Difference:** You asked if this is the Rule of Recognition shifting. It is not a shift; it is a **fracture**. A shift implies the whole group moves from Rule A to Rule B. A fracture means half the group accepts Rule A as the ultimate validator, and half accepts Rule B. Hart's theory describes how a system works when it is unified; it diagnoses your situation as a failure of the Rule of Recognition, but it doesn't name the structural deadlock itself.

  **4. Gödel-in-the-Constitution**
  *   **The Neighbor:** The idea that a system containing self-reference can generate inconsistencies that destroy its own consistency.
  *   **The Difference:** You are correct to suspect this is about self-destruction. Gödelian problems usually imply the system crashes or becomes trivial (everything is true). Your system hasn't crashed; it has **forked**. It is running two incompatible operating systems simultaneously. That is a Schism, not a collapse.

  **5. The Senate Nuclear Option**
  *   **The Neighbor:** A simple majority reinterpreting a standing rule to bypass a supermajority requirement.
  *   **The Difference:** The Nuclear Option is openly admiting "We are ignoring the text to set a new precedent." Your board claims they *followed* the text (the 2/3 amendment clause). The Nuclear Option is a coup disguised as a ruling; your situation is a genuine dispute over which text governs.

  ---

  ### Definition: Procedural Validity Schism
  A **Procedural Validity Schism** occurs when:
  1.  **Clear Text:** The governing document is not ambiguous; the words have agreed-upon meanings.
  2.  **Competing Chains:** Two different procedural chains (Chain A and Chain B) are executed.
  3.  **Internal Validity:** Each chain is valid according to the rules in place *immediately before* that specific step was taken.
  4.  **Mutual Exclusivity:** The outcome of Chain A invalidates the authority of Chain B, and vice versa.
  5.  **Adjudicative Recursion:** The mechanism designated to resolve the dispute (e.g., the Chair, a committee) derives its own authority from the disputed document, rendering its ruling contestable by the losing chain.

  ### Boundary Conditions
  For a situation to count as a **Procedural Validity Schism**, the following must be true:
  *   **Good Faith:** Both sides must believe they are following the rules. (If one side knows they are breaking the rules, it's a **Coup**).
  *   **Procedural, not Substantive:** The dispute must be about *how* a rule was changed, not just *what* the rule says. (If you just disagree on what "affordability" means, that's **Interpretive Vagueness**).
  *   **No External Arbiter:** There must be no agreed-upon authority outside the document (like a court with unquestioned jurisdiction) to settle it. (If you both agreed to ask a judge, the Schism collapses into a **Litigation**).

  ### Two Near-Misses (What It Is Not)

  **1. Interpretive Vagueness Settled by Practice**
  *   **Scenario:** The bylaws say "meetings start at 7 PM." Some think that means 7:00, some think 7:15. For ten years, everyone shows up at 7:15.
  *   **Why it's a miss:** The text was ambiguous or silent on precision, and *custom* resolved it. In your case, the text is precise (2/3 vs 4/5), and custom is contested. This is **Constructive Ambiguity**, not a Schism.

  **2. A Constitutional Coup**
  *   **Scenario:** The Chair declares the 4/5 clause void because "it's bad for the community," without citing an amendment vote.
  *   **Why it's a miss:** That is a violation of the rules, not a competing validity chain. In a Coup, one side knows they are breaking the system. In a Schism, both sides claim the system authorizes them.

  ### The "Chair" Problem: Adjudicative Recursion
  You mentioned the second instance (the Chair ruling on the Chair's authority) feels related but different. It is the same phenomenon, applied to the referee.
  *   **The Structure:** The Chair's power to rule on procedure comes from the Bylaws. The Bylaws are now the subject of the procedure.
  *   **The Term:** This is **Adjudicative Recursion**. It is the engine that sustains the **Procedural Validity Schism**. Without the Chair's ruling, you might have just had a confused meeting. With the ruling, you have two official records of the meeting.
  *   **Why it matters:** In a Schism, the first group to control the "official minutes" often wins the practical battle, even if they lose the theoretical one. This is why the Chair's ruling is dangerous—it creates a paper trail for one side of the Schism.

  ### Summary Recommendation for Your Context
  You are in a **Procedural Validity Schism** driven by **Adjudicative Recursion**.

  *   **The 2/3 Side** relies on "Continuing Sovereignty" (no board can bind a future board unless explicitly stated).
  *   **The 4/5 Side** relies on "Self-Embracing Sovereignty" (the entrenchment implies it protects itself).
  *   **The Reality:** Neither side can win internally. The system has forked.

  **Practical Note:** Since you asked for theory, I will keep this brief: In a Validity Schism, the "winner" is usually determined by who controls the physical assets (the bank account, the deed, the server) or by an external arbiter (a court). Since your bylaws cannot resolve this (they are the source of the split), and the Chair cannot resolve this (they are part of the split), the only non-violent resolution is an external authority or a negotiated reset.

  **Confidence Statement:** I am **85% confident** in the utility of the term **Procedural Validity Schism**. It is not a standard legal term you can cite in court to win a case, but it is the most accurate theoretical description of the structural deadlock you are facing. The philosophical attributions to Suber, Hart, and the UK Parliament Acts are standard interpretations, though specific applications to small community bylaws are rare in the literature.
