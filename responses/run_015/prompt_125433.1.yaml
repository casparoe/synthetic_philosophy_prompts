  Good evening, everyone. For those who don't know me, I'm one of the many students who had the privilege of working with [Advisor's Name]. For those who do know me… well, you know I probably owe her another draft or two.

  Standing here tonight, looking at the mix of people in this room, I realized there's a tricky question we usually ask at retirements. We look at the person standing here in the emerita gown, and we look at photos of the grad student from 1985, and we ask: "Is she the same person?"

  Now, half of you are nodding because you know exactly why that's a trap. The other half are wondering why I'm making it sound complicated.

  Here's the thing: [Advisor's Name] built her career arguing that asking if someone is *literally identical* across different times or situations is a mistake. Strict identity is too rigid. It demands that everything essential stays the same. If we used that standard for tonight, we'd have to worry that because she knows more now, or cares about different things, or has different hair, she isn't really the person who started this journey.

  But she taught us a better way to look at it. She taught us that we don't need strict identity to make sense of a life. We just need counterpart relations.

  For the family at the table: think of it this way. Strict identity is like demanding a seedling be exactly the same as the oak tree. If you demand they are identical, you miss the growth. Counterpart theory says the seedling and the oak are different stages, linked by what matters—by history, by cause, and by similarity in the things that define them.

  For my colleagues here: she showed us that transworld identity is unnecessary baggage. We don't need the 1985 grad student to be ontologically identical to the 2024 emerita. We just need the relation of similarity to hold where it counts. The "worlds" of her career—the early papers, the tenure years, the mentorship phase—they aren't connected by a rigid thread of sameness. They're connected by counterpart relations.

  And this is why tonight matters. If we insisted on strict identity, change would be a loss. Every new idea would threaten who she was. But under counterpart theory, change is how the relation gets stronger. The person standing here tonight isn't the same as the one in 1985. Thank goodness. The 1985 version was brilliant, but she was untested. The version in the middle years was productive, but stretched thin.

  But this version? The one retiring tonight? She is the best counterpart. She carries the history of all the previous versions without being held hostage by them. She resembles the original in passion and intellect, but she maximizes the virtues that matter most: wisdom, generosity, and impact.

  So, I'm not going to toast the person she was. I'm not going to try to pretend she hasn't changed. I'm going to toast the fact that across all the possible ways her career could have gone, the version of her standing here tonight is the one that best fulfills the promise of all the others.

  To [Advisor's Name]: may your next world be your best counterpart yet. Cheers.
