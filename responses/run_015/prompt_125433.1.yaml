      *   *Transworld Identity (TWI):* Object $x$ in World $W1$ is literally the same object as $y$ in World $W2$. Requires strict identity conditions. If properties change too much, identity might break.
      *   *Counterpart Theory (CT):* Object $x$ in $W1$ is not literally in $W2$. Instead, $x$ has a *counterpart* in $W2$ that resembles $x$ in relevant ways. Similarity matters more than strict identity. Allows for change and variation without logical contradiction.
      *   *Application to Life:* If we use TWI, the person she was in 1985 must be *identical* to the person now. If she changed too much, did she cease to be herself? That's risky. If we use CT, the 1985 version and the 2024 version are different stages/counterparts linked by similarity and causality. The "best" counterpart is the one that fulfills the potential of the earlier versions.

