answer: |-
  Yes, because the divergence rests on a deontic constraint rather than parametric uncertainty.

  A city water utility considers adding Chemical X to reduce cardiovascular events across the general population. However, due to older pipe infrastructure in one neighborhood, the chemical leaches lead, causing kidney failure for residents there. The utility board decides; the general public gains health; the neighborhood bears the risk. No consent is sought from the neighborhood. The benefit is reduced heart disease; the harm is renal failure.

  Precautionary Principle: "Do not impose serious health risks on identifiable non-consenting individuals for aggregate social gain." Expected Utility: Benefit = 100 QALYs; Harm = 10 QALYs; Probability interval = 5%–20%. Worst-case Expected Net = 100 - (0.20 × 10) = 98 QALYs. Even with 3× harm valuation: 100 - (0.20 × 30) = 94 QALYs.

  Expected utility aggregates health outcomes, finding the large majority gain outweighs the small expected minority loss. The calculation remains positive even at the highest probability and tripled harm weight, robustly favoring adoption. The precautionary principle vetoes the imposition itself, treating the non-consensual risk as a rights violation regardless of the net health surplus. EU maximizes the sum; PP protects the individual from being sacrificed. The EU verdict holds across the probability interval and value changes; the PP verdict holds regardless of magnitude.

  The working feature is the separation of risk-bearers from beneficiaries without consent. If the neighborhood consented, or if the risk/benefit were distributed identically, the precautionary verdict collapses to match expected utility. Without this relational asymmetry, the principle loses its critical force and becomes mere risk aversion. This confirms the principle tracks relational justice, not just outcome magnitude. Removing the asymmetry removes the conflict, proving the feature does the work.

  Objection: Analysts can add a "rights violation" cost to the utility function to match the verdict. Reply: That requires infinite weight to match the principle's lexical priority, breaking the finite trade-off premise of standard cost–benefit analysis. Thus, within standard bounded rationality, the divergence remains genuine. Students cannot reproduce the veto with finite pessimistic utilities; they must abandon aggregation entirely.
