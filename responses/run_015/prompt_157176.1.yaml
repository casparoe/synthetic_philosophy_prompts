  **Residue Report**

  The translation holds structurally but fractures on the "meaningful life" criterion. In Nozick's metaphysics, the capacity for long-term planning grants inviolable side-constraints. In mechanism design, this capacity maps to a discount factor $\delta$ or a dynamic strategy space. Animals, lacking this, are modeled as agents with $\delta \approx 0$ or static types. The distortion arises because Nozick treats this parameter difference as a qualitative threshold for moral status, whereas MD treats it as a continuous variable affecting optimal contracting.

  Specifically, the "meaningful life" qualifier becomes a preference-revelation failure. If an agent cannot plan long-term, they cannot reveal preferences over life-trajectories, only instantaneous welfare. The mechanism can optimize instantaneous $w_a$, but cannot respect "autonomy" because autonomy requires dynamic consistency. Consequently, the Nozickian distinction between "utilitarianism for animals" and "side-constraints for humans" translates to a distinction between static optimization and dynamic mechanism design. The human capacity for a "meaningful life" is simply the ability to participate in a repeated game with memory; animals play a one-shot game.

  The residue with no counterpart is the deontological modality of the constraint itself. In MD, constraints are shadow-priced; they represent trade-offs at the boundary. Nozick's side-constraints are absolute prohibitions, invariant to the magnitude of $u_h$. There is no Lagrange multiplier high enough to lift a Nozickian right, whereas in MD, any constraint can be violated if the objective function weight is sufficiently high. The formalism cannot capture the "inviolability" without breaking the optimization framework entirely. This suggests that "rights" in Nozick's sense are not mechanism constraints, but meta-rules about which mechanisms are permissible to instantiate.

  **Verdict**

  The leftover exposes an undefended essentialism in Nozick, not a failure of economic formalism. The mechanism design translation demonstrates that animal protection can be derived from stability conditions and asymmetries in strategic capacity without invoking mystical "rights." Nozick insists on a qualitative moral discontinuity between humans and animals based on "meaningful life," yet the formal model shows this is merely a difference in parameters ($\delta$, strategy space).

  If the protection of animals is achievable via implementation constraints that prevent predatory equilibria, the additional claim of "moral status" adds no explanatory power. Nozick's resistance to utilitarianism for humans, while accepting it for animals, relies on an intuition that the formalism reveals as arbitrary. He posits a moral magic where parameter thresholds generate deontological absolutes. The economic framework strips this away, showing that what Nozick calls "rights" are simply robust equilibrium constraints. The residue is not a deep moral truth missed by economics, but Nozick's unwillingness to accept that moral status might be continuous rather than binary.
