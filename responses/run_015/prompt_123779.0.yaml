  **The Popperian response**
  My friend, you have struck the nerve exactly. If this framework treats every subjective counter-report as mere 'noise' without offering an independent test for that noise distinct from the theory itself, then it is not science; it is a conventionalist stratagem. I have always insisted that auxiliary hypotheses are permissible, indeed necessary, but only if they extend the reach of falsification, not retreat from it. Here, the 'misattribution' clause functions as an immunizing belt. It ensures the core theory never faces a genuine refutation from the phenomenological data it claims to explain. A scientific theory must forbid certain states of affairs. If 'recursive correlationism' can accommodate any first-person report by labeling it noise, it forbids nothing regarding consciousness itself. It may make risky predictions about blood flow, but if the psychological content is insulated from refutation, the theory as a whole loses its empirical character. It becomes a metaphysical research programme, not science. That is the difference between progress and dogma.

  **One small concession**
  I admit that no theory is ever tested in isolation; a protective belt of auxiliary assumptions is inevitable in any complex investigation. We must tolerate some ambiguity while we devise new tests, provided we do not make it a principle to evade refutation.

  **The counter-punch**
  But tell me, if you defend this framework, what specific observation of first-person experience would you allow to falsify it? If you cannot name one without resorting to 'verification' of the neural pattern alone, are you not simply disguising verificationism as empirical risk? Or do you admit the theory speaks only of brains, leaving consciousness untouched?
