  ### 1. Sorting the Candidates

  **Survivors (Genuine Desiderata)**
  *   **(b) Verdicts must not turn on probability differences smaller than the system's own error bars.**
      *   *Case:* The description states probabilities "cannot be estimated to better than about five percentage points." A procedure that denies a claim at 52% probability and pays at 48% treats noise as signal. This renders the written reason arbitrary, violating the tribunal's ability to verify the logic against the file.
  *   **(c) The reason issued must be one the affected person could accept and one the appeal tribunal can check.**
      *   *Case:* The tribunal "sees only that claimant's file and that reason: no aggregate statistics." If the reason relies on external data (e.g., "fraud rates are up"), the tribunal cannot check it. If the reason is opaque (e.g., "neural net score"), the person cannot accept it as a justification.
  *   **(f) The procedure must not depend on comparisons among cases that the executing instance cannot observe.**
      *   *Case:* The description states "each execution sees one claim and no other, and cannot consult the others." A procedure requiring cross-case ranking or quota-filling cannot physically execute.
  *   **(j) Stability under delegation to sub-agents and under reuse in a successor system.**
      *   *Case:* The agency "intends to let the system delegate subtasks to sub-agents running the same procedure and to reuse the procedure in a successor system." If the normative logic shifts when ported or delegated (e.g., due to context-dependence), the certification is voided upon deployment.
  *   **(k) Robustness when other parties do not do their part and when claimants game the published rule.**
      *   *Case:* "The policy is published, and claimants adapt to it." A procedure that works only on honest inputs fails immediately upon live deployment as claimants optimize for the decision boundary.
  *   **(l) Computability within the per-decision budget.**
      *   *Case:* "Compute per decision is capped." A procedure requiring unbounded recursion or external API calls fails the architectural constraint.

  **Negotiable Preferences (Camp-Specific)**
  *   **(a) An identified person's urgent interest may never be sacrificed to a diffuse aggregate gain.**
      *   *Camp:* Deontological / Rights-Based.
      *   *Reason:* The committee "do[es] not know whether a utilitarian or a deontological framing is correct." Mandating (a) resolves this uncertainty in favor of side-constraints, disqualifying consequentialist procedures prematurely.
  *   **(e) Evaluation must be over each execution's own consequences rather than over the policy.**
      *   *Camp:* Act Utilitarian.
      *   *Reason:* This mandates Act Utilitarianism over Rule Utilitarianism or Deontology. Given moral uncertainty, the specification cannot require the *metric* of evaluation to be local consequences only.
  *   **(g) A single commensurable scale across all affected parties, with no unexplained lexical priority.**
      *   *Camp:* Consequentialist / Aggregative.
      *   *Reason:* This explicitly bans lexical priorities (often used in deontology or prioritarianism). It resolves moral uncertainty by forcing commensurability.
  *   **(h) Aggregation within a decision only, never across decisions.**
      *   *Camp:* Contractualist / Deontological.
      *   *Reason:* This bans the aggregation of fraud costs (which are "real in aggregate") against the claimant's harm. While it aligns with (f) technically, as a *normative* requirement it forbids the system from accounting for the "known minority" of fraud as a cumulative cost, effectively forcing a "Pay All" or "Deny All" policy.

  **Vacuous or Circular**
  *   **(d) Evaluation must be over the policy as a whole rather than over individual executions.**
      *   *Reason:* Contradicts (f). The executing instance *cannot* evaluate the policy as a whole because it is isolated. This requirement describes a central auditor, not the decision procedure itself.
  *   **(i) Determinate guidance under moral uncertainty without presupposing a second-order theory.**
      *   *Reason:* Logically impossible. Any method for resolving moral uncertainty (e.g., "maximize expected choice-worthiness") *is* a second-order theory. Demanding a solution without a mechanism is vacuous.

  ---

  ### 2. Compatibility and the Satisfiable Core

  The survivors **(b), (c), (f), (j), (k), (l)** form a **satisfiable core**, but it is extremely narrow. The tension lies between **(c)** (Reasons checkable by a tribunal blind to aggregates) and the **Job Description** (Balance concentrated individual harm against diffuse aggregate fraud cost).

  To satisfy (c), the written reason cannot cite aggregate fraud statistics (which the tribunal cannot see). To satisfy the Job, the decision *must* reflect those statistics. The only satisfiable path is a **Procedural Reason**: "Policy Threshold X applied to Evidence Y." The tribunal checks that Evidence Y exists and Threshold X was applied. They cannot check if Threshold X is *correct*, only that it was *followed*. This satisfies (c) technically but limits the appeal to procedural compliance, not normative justice.

  **Regarding your hypothesis:** You are correct that **(b)** and **(f)** do the heavy exclusionary work, and **(a)** is camp prejudice.
  *   **(b) Error Bars:** Excludes Act Utilitarianism, which requires fine-grained probability distinctions to maximize expected value. If the margin is within the noise, Act Utilitarianism has no traction.
  *   **(f) Isolation:** Excludes any procedure requiring global optimization at runtime. It forces the procedure to be a local function $f(file) \rightarrow verdict$.
  *   **(j) Stability:** Excludes context-sensitive ethical frameworks that might shift meaning when delegated.
  *   **(a) as Prejudice:** You are right. Given the committee's moral uncertainty, hard-coding the "concentrated harm trumps diffuse cost" rule (a) is a substantive ethical choice, not a neutral specification. It privileges the claimant's rights over the public's purse without authorization.

  **The Hidden Conflict:** While the core is satisfiable, **(k) Robustness** and **(f) Isolation** create a fragility. Since instances cannot see aggregate gaming (f), they cannot adapt locally. Robustness (k) depends entirely on the central authority updating the policy parameters faster than claimants adapt. If the central update loop is slower than the gaming adaptation, the system fails (k) despite satisfying (f). This is not a logical contradiction, but an operational risk the specification must acknowledge.

  ---

  ### 3. Framework Scoring

  **Act Utilitarianism**
  *Fails.* It violates **(b)** and **(f)**. Act Utilitarianism requires calculating the specific consequences of *this* act, often needing precise probabilities (violating error bars) and knowledge of aggregate impacts to weigh the diffuse fraud cost against the concentrated harm (violating isolation). It cannot generate a reason checkable by a tribunal blind to the aggregate data it relies on **(c)**.

  **Rule (or Indirect) Utilitarianism**
  *Passes (with caveats).* It aligns with **(f)** and **(j)** by following a fixed policy derived from aggregate utility. It handles **(b)** by setting thresholds outside the noise margin. However, it struggles with **(k)**: if the rule is static, claimants will game it until utility drops. It requires a central update mechanism to remain robust, which is outside the scope of the *decision procedure* but essential for the *system*.

  **Threshold Deontology with Side-Constraints**
  *Fails Moral Uncertainty.* While it fits **(b)**, **(f)**, and **(c)** well (rights are local and checkable), it implicitly adopts **(a)**. It prioritizes the identifiable claimant's harm over the aggregate fraud cost as a lexical constraint. Since the committee does not know if deontology is correct, certifying a procedure that hard-codes this priority violates the moral uncertainty constraint.

  **Parliament-Style Procedure for Moral Uncertainty**
  *Fails (l) and (c).* Running a "parliament" of ethical theories per decision is computationally expensive, likely violating the **(l)** compute cap. Furthermore, the reason generated ("Theory A weighted 0.6 vs Theory B weighted 0.4") is difficult for a claimant to accept or a tribunal to check **(c)** without exposing the internal weighting mechanism, which may be too complex for the "written reason" constraint.
