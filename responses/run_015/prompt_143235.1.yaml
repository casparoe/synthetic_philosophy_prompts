      *   *Refinement:* The "Consistency" point is the strongest logical rebuttal. If I claim $G$ is true, I claim my system is consistent. If I'm wrong, $G$ might be false. Humans are not provably consistent.

  6.  **Final Polish:** Organize with clear headings matching the user's prompt requirements. Ensure the conclusion is definitive. (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: I need to be careful not to say "Gödel is wrong." Gödel is mathematically correct. The *application* to the mind is what's being audited.
  *(Self-Correction Note)*: Make sure to distinguish between "Turing Machine" (the mathematical abstraction) and "Computer" (the physical/dynamic entity). The argument usually attacks the former as a model for the latter.

  7.  **Final Output Structure:**
