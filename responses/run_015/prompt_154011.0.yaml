answer: |-
  The tension you have identified is one of the most significant and enduring problems in Buddhist philosophy. It is often referred to as the **problem of diachronic identity and moral responsibility**. If there is no self (*anattā*) to act and no self to receive the fruit, and if existence is a series of discrete moments (*kṣaṇikavāda*), the link between action and consequence appears severed.

  Below is an analysis separating established doctrinal frameworks from contemporary scholarly controversies, specifically addressing whether karma can sustain a notion of moral desert or must be reduced to causal conditioning.

  ### I. Established Doctrinal Frameworks
  *These points represent positions generally agreed upon within specific Buddhist scholastic traditions (Abhidharma, Madhyamaka, Yogācāra) regarding the mechanics of karma, though they differ from one another.*

  **1. The Definition of Karma as *Cetanā* (Volition)**
  Across nearly all Buddhist schools, it is established that karma is not the physical action itself, but the volition (*cetanā*) that precedes it. This shifts the locus of karma from the external world to the mental continuum. This is crucial for the no-self doctrine: even if there is no "agent," there is a causal sequence of volitional moments.

  **2. The Metaphor of the Stream (*Santāna*)**
  Traditional Buddhism rejects the notion of a static substratum (a soul or *ātman*) but affirms causal continuity. The standard analogy is a flame passed from one candle to another: the flame at $T_2$ is not identical to the flame at $T_1$, nor is it totally different. It is causally dependent.
  *   **Established View:** Moral responsibility is assigned to the *continuum* (*santāna*), not a substantial self. The suffering or happiness experienced at $T_2$ belongs to the continuum that originated the volition at $T_1$, even if no ontological "owner" persists.

  **3. Scholastic Mechanisms for Continuity**
  Different Abhidharma schools developed specific technical doctrines to explain how a karmic seed survives the gap between action and fruition without a self to hold it:
  *   **Sarvāstivāda:** Posited a distinct force called *prāpti* (possession) that links a dharma to a specific mental continuum, ensuring the karmic potential travels with that stream.
  *   **Sautrāntika & Yogācāra:** Developed the theory of "seeds" (*bīja*). Volitions plant seeds in the mental stream. In Yogācāra, these are stored in the *ālaya-vijñāna* (storehouse consciousness). This provides a repository for karmic latency without positing a permanent self.
  *   **Theravāda:** Utilizes the concept of *bhavaṅga* (life-continuum) and rebirth-linking consciousness (*paṭisandhi-viññāṇa*) to maintain continuity across lifetimes.
  *   **Madhyamaka:** Nāgārjuna (in *Mūlamadhyamakakārikā*, Chapter 17) argues that positing a permanent self actually *destroys* karma (because an unchanging self cannot act or change), whereas emptiness (*śūnyatā*) allows for dependent origination, making karma possible. For Madhyamaka, karma operates on the level of "conventional truth" (*saṃvṛti-satya*).

  **4. Karma vs. Justice**
  It is well-established in primary texts that *vipāka* (karmic fruit) is not administered by a judge or deity. It is described as a natural law (*dhamma-niyāma*), akin to a seed producing a specific plant. The "normativity" is soteriological (leading to suffering or liberation) rather than juridical (punishment or reward based on merit).

  ---

  ### II. The Problem of Moral Desert
  *Here we move from doctrinal mechanics to comparative ethics. This is where the tension between "desert" and "causality" becomes acute.*

  **1. The Western Concept of Desert**
  In Western analytic ethics, "moral desert" typically requires:
  *   **Agency:** A robust sense of authorship.
  *   **Identity:** The person punished/rewarded must be numerically identical to the person who acted.
  *   **Normativity:** The consequence is *deserved* in a retributive or distributive justice sense.

  **2. The Buddhist Concept of Responsibility**
  Buddhist philosophy generally substitutes **causal responsibility** for **metaphysical desert**.
  *   **Established View:** You suffer the consequence not because a cosmic ledger demands you "pay" for a sin, but because the volitional act structurally altered the causal continuum in a way that necessitates that experience.
  *   **Implication:** If "desert" implies a retributive judge, Buddhism rejects it. If "desert" implies "the natural outcome belonging to this specific causal stream," Buddhism accepts it.

  **3. Can Desert Exist Without a Bearer?**
  Some contemporary philosophers of Buddhism argue that a "narrative self" or a "conventional person" is sufficient for a pragmatic notion of desert.
  *   **Argument:** We hold persons responsible in law and ethics without needing to prove metaphysical soul-identity. Similarly, karma functions on the level of the conventional person (*pudgala*).
  *   **Counter-Argument:** If the self is ultimately a fiction, "desert" is also a fiction. To assign normative weight to a fiction risks reinforcing the very clinging (*upādāna*) that Buddhism seeks to extinguish.

  ---

  ### III. Contested Scholarly Debates
  *The following points are subjects of active disagreement among specialists in Buddhist philosophy and comparative ethics. There is no consensus.*

  **1. Naturalization vs. Metaphysical Realism**
  *   **The Naturalist Position:** Scholars like **Mark Siderits** (advocating "Buddhist Compatibilism" or "Paleocompatibilism") argue that karma can be understood as a psychological and social causal theory without literal rebirth or metaphysical baggage. On this view, karma is fully naturalizable: bad actions condition the mind toward future suffering *in this life*. Desert is pragmatic, not cosmic.
  *   **The Traditionalist Position:** Scholars like **Damien Keown** argue that stripping karma of rebirth and its cosmological framework gutted its normative force. They contend that without the transmigration of the karmic stream across lifetimes, the observed inequities of life (good people suffering) render karma empirically false and morally incoherent.
  *   **The Contention:** Can karma function as a theory of *justice* if it is limited to one lifetime? Naturalists say yes (psychological conditioning); Traditionalists say no (it requires cosmic timescales to balance the moral equation).

  **2. The Status of the *Ālaya-vijñāna* (Storehouse Consciousness)**
  *   **The Critique:** Critics (often from the Madhyamaka tradition or modern analysts) argue that the Yogācāra *ālaya-vijñāna* is a "self" in all but name. If it holds karmic seeds and persists through time, does it not violate *anattā* to preserve moral desert?
  *   **The Defense:** Yogācāra proponents argue the *ālaya* is momentary and changing, thus not a self.
  *   **The Contention:** Is the *ālaya* a coherent philosophical solution to the diachronic identity problem, or is it an ad hoc metaphysical substratum smuggled in to save the theory of desert?

  **3. Normativity: Law of Nature or Moral Imperative?**
  *   **Descriptive View:** Some scholars argue karma is purely descriptive (like gravity). It has no normative weight; it simply *is*. Suffering is not "punishment," it is just the ripening of a cause.
  *   **Prescriptive View:** Others argue that because karma is tied to *sīla* (ethics) and the cessation of suffering, it is inherently normative. It tells agents what they *ought* to do to achieve *nirvāṇa*.
  *   **The Contention:** If karma is merely causal (like touching fire burns), does the concept of "moral desert" apply at all? Fire does not "deserve" to burn you; it just does. If karma is like fire, "desert" is a category error. If karma is moral, it requires a normativity that pure causality lacks.

  **4. The "No-Self" Dilemma in Ethics**
  *   **The Eliminationist View:** If there is no self, there is no one to be harmed and no one to harm. Some interpretations of Madhyamaka suggest that ultimate truth renders karma silent.
  *   **The Conventionalist View:** Most ethicists argue that karma functions *only* on the conventional level. However, this creates a tension: If the self is ultimately unreal, is the suffering caused by karma ultimately unreal?
  *   **The Contention:** How much ontological weight must the "conventional person" bear to sustain moral responsibility? Is a "fictional agent" enough to ground "real suffering"?

  ---

  ### IV. Synthesis: Is a Coherent Theory of Desert Possible?

  To answer your specific question on whether karma *must* be reduced to causal-psychological conditioning:

  **1. The Case for Reduction (Causal-Psychological)**
  If you define "moral desert" strictly through a Western lens requiring a metaphysically robust, enduring agent, then **yes**, karma cannot function as moral desert. In this reading, karma is best understood as a theory of **habit formation and psychological conditioning**. Volitional acts create tendencies (*vāsanā*) that shape future experience. The "normativity" is therapeutic: you avoid unwholesome actions not because you "deserve" punishment, but because they perpetuate *duḥkha* (unsatisfactoriness).

  **2. The Case for Preservation (Causal-Responsibility)**
  However, many philosophers argue that "desert" does not require a substantial self, only **causal ownership**.
  *   **Argument:** If mental state $M_1$ causes mental state $M_2$ within a single continuum, $M_2$ is the "property" of that continuum.
  *   **Coherence:** This preserves a form of desert without a substratum. It is a "process-based desert." The continuum "deserves" the fruit because it generated the cause, even if no "thing" persists.
  *   **Constraint:** This requires accepting the **Two Truths doctrine**. Ultimate truth denies the agent; conventional truth affirms the responsibility. To demand ultimate metaphysical grounding for conventional moral desert is, from a Buddhist standpoint, a category mistake.

  ### Conclusion

  There is no consensus on whether karma requires a metaphysical substratum.
  *   **Well-Established:** Buddhist traditions universally deny a permanent self (*ātman*) while universally affirming moral responsibility and the efficacy of karma across time. They resolve this via causal continuity (*santāna*) and specific mechanisms (seeds, possession, conventional truth).
  *   **Genuinely Contested:** Whether this resolution satisfies the requirements of "moral desert" as understood in comparative ethics.
      *   If you require **retributive justice**, karma fails (no judge, no self).
      *   If you require **causal ownership**, karma succeeds (the stream owns its modifications).
      *   If you require **naturalization**, the tradition fractures (Traditionalists demand rebirth; Modernists accept psychological conditioning only).

  **Philosophical Verdict:** You do not *have* to conclude that karma is merely psychological conditioning with no normative weight, but you *do* have to redefine "desert." It cannot be **substance-based desert** (owed to a soul); it must be **process-based responsibility** (owed to a continuum). Whether this counts as "moral desert" depends on whether you believe normativity can emerge from impersonal causality—a question that remains open in both Buddhist and Western philosophy.
