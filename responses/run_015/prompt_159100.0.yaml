  Bottom line
  Don't take the bet. Your wife is right: the "thickness" (probability weight) of the branch matters far more than how many copies wake up on it. Your brother-in-law is trying to sell you on a philosophical loophole that doesn't hold up to decision theory, and you'd be handing over $600 for a 90% chance of losing it.

  What you two are actually disagreeing about
  This isn't really a fight about quantum mechanics; it's a fight about what "probability" means for *you*. Your wife is arguing from the standard view (the Born Rule), where the 90/10 split dictates your subjective odds of experiencing either outcome. Your brother-in-law is arguing from a "branch-counting" view, where he thinks creating more copies on the losing side changes the odds of *being* a winner.

  The wrinkle he admitted—that eight of the nine copies are "vanishingly thin"—actually undermines his own position. If some copies count less than others, then "headcount" isn't the metric; "measure" (thickness) is. Once you admit measure matters, you're back to your wife's math, where the 90% branch dominates your future experience regardless of how many people are printed on the 10% side.

  Adding it up both ways
  Let's look at the expected value from your perspective as the person stepping into the machine. Under your wife's view (standard physics), you have a 90% chance of being the single guy who loses $600, and a 10% chance of being one of the winners who nets $100. Your expected value is (0.9 × -$600) + (0.1 × $100) = **-$530**. That's a terrible bet.

  Your brother-in-law wants you to count heads instead of weight. He says there are 10 futures, 9 are winners, so you have a 90% chance of winning. That math gives you (0.9 × $100) + (0.1 × -$600) = **+$30**. However, this ignores that the "losing" future is nine times heavier than the entire "winning" branch combined. Even if you care about the total happiness of all copies (Total Utilitarianism), the math barely breaks positive (+$30 total expected utility), but *you* personally still face a 90% risk of loss.

  What I'd do
  I'd keep the $600 and buy a nice steak for the cookout instead. Unless you are a committed Total Utilitarian who values the sum of all your copies' happiness more than your own specific financial security, the risk is massively skewed against you. The fact that nine other versions of you get rich doesn't help the version of you that wakes up broke, and physics suggests that's the version you're most likely to be.

  The strongest thing on the other side
  The only serious philosophical counter-argument is the "Self-Indication Assumption" in anthropics, which suggests you should reason that you're more likely to exist in a world with more observers. If the 10% branch literally contains nine times as many conscious experiences as the 90% branch, some theories say you should update your odds toward that branch. It's a niche view, but it's the only one that gives your brother-in-law a leg to stand on.

  Confidence and my weakest point
  I'm about 95% confident you should reject the bet, as standard decision theory heavily favors the Born Rule (your wife's view). My weakest point is the deep anthropic philosophy; while consensus leans toward measure over count, the interpretation of probability in Many-Worlds isn't settled physics, so there's a slim chance your brother-in-law is tapping into a controversial but valid fringe theory.
