          *   **Misconceptions:** Map specific interventions to specific times. Bill (Early), Margaret (Hold), Compsci (Define terms early, engage late).
          *   **The Crux:** Place it as the bridge. Use the "Designer's Stance" vs. "Physical Stance" distinction.
