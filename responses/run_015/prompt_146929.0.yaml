answer: |-
  Here is the build. It respects your expertise, uses the whiteboard constraint, and fits the forty-five-minute window.

  ### 1. The Order
  Your instinct is correct. The dependency is real, not just pedagogical.

  **Darwin first.** Darwin establishes the *ontological possibility*: that design-like complexity can exist without a designer. This clears the ground. If you start with Turing, the claim that "comprehension is just computation" sounds like a category error or a metaphor. If you start with Darwin, it becomes a historical fact about the universe: *blind processes build competent things.*

  **Turing second.** Turing provides the *mechanistic explanation*: how that competence is physically instantiated. Once the group accepts that nature builds competent systems without foresight (Darwin), you can argue that the human mind is one such system (Turing).

  **The Dependency:** Darwin makes the *phenomenon* plausible; Turing makes the *mechanism* intelligible. Without Darwin, Turing looks like reductionism. With Darwin, Turing looks like engineering.

  **Time allocation:** 15 minutes Darwin, 15 minutes Turing, 15 minutes the Boomerang/Check.

  ### 2. The Carrying Example
  Use **both**, but for different halves. Do not try to stretch the metabolic rerouting example into the Turing half.

  **For Darwin: The Metabolic Rerouting.**
  *   **Why:** It demonstrates *accumulation*. The "solution" appears over generations. This captures the "inversion" perfectly: the outcome looks planned, the process was blind trial and error.
  *   **What it must have:** A clear "before" (knockout, growth stops) and "after" (growth resumes via side route).
  *   **What it must lack:** Any hint of the cell "knowing" the side route exists. Emphasize the death of the failures.

  **For Turing: Chemotaxis.**
  *   **Why:** It demonstrates *operation without representation*. The rerouting example is about history; chemotaxis is about real-time control. It maps better to a machine (input → logic → output) than a metabolic pathway does.
  *   **Transformation:** On the whiteboard, draw the bacterium. Draw the sugar gradient. Draw the flagellar motor. Now draw the internal pathway. **Crucially:** Draw a box around the internal chemistry and label it "No Map."
  *   **The Pivot:** Tell the group: "In the rerouting example, the competence was built by time. In chemotaxis, the competence is built by structure. Turing asks: if the structure is complex enough, does the 'No Map' label still hold for *us*?"

  **Why not transform the Rerouting example?** Metabolic flux is continuous and analog; Turing machines are discrete and symbolic. Stretching the analogy risks Bill (aerospace) objecting on engineering grounds. Chemotaxis is a control loop; everyone understands a thermostat. It's a safer bridge to computation.

  ### 3. The Misconceptions
  You cannot answer these; you must *dissolve* them by sequencing.

  *   **Bill (Selection removes only):** Head this off **during the Darwin section**. When you draw the rerouting on the board, explicitly draw the "graveyard" of bacteria that didn't mutate. Say: "Selection is a filter. A filter doesn't need to build; it just needs to let the built things pass." Do not let this become a debate. It's a definition.
  *   **Margaret (Machines can't mean):** **Let this stand.** This is the intuition the session is designed to challenge. When she raises it (likely during Turing), say: "Hold that. That is exactly the intuition Turing is inverting. We will come back to whether that intuition survives the end of the session."
  *   **Compsci Guy (LLMs understand):** Head this off **at the start**. Define your terms. "For this hour, 'comprehension' means *semantic understanding*, not *behavioral competence*. We are investigating whether the former is required for the latter." If he interrupts later, remind him: "We are discussing the architecture of the mind, not the benchmark performance of a model."
  *   **Generic (No purpose / Tautology / Statistics):**
      *   "No purpose": Address in the **Crux** section (see below).
      *   "Tautology": Head off early. "Fitness is not defined by survival alone; it is defined by specific traits predicting survival."
      *   "Statistics": Acknowledge it. "Yes, it is statistical, but the *result* is deterministic design."

  **The one to let stand:** Margaret's. It is the counter-weight. If you crush it too early, the inversion feels like a trick.

  ### 4. The Crux (End State vs. Process)
  Your insight is the strongest philosophical point you have. It is essentially Dennett's "Free Floating Rationale."

  **Where it belongs:** Between Darwin and Turing. It is the bridge.
  **How to write it on the board:**
  Draw two columns.
  Left: **The Process** (Blind, Local, Mechanical).
  Right: **The Explanation** (Global, Teleological, "For the sake of").
  Draw an arrow from Left to Right labeled "Competence."
  Draw an arrow from Right to Left labeled "Understanding."
  **Cross out the second arrow.**

  **The Script:** "The explanation *requires* the goal. The process *ignores* the goal. The goal exists for *us*, the observers, not for *them*, the systems."

  **Stopping the Slide to Teleology:**
  You must distinguish the **Design Stance** from the **Physical Stance**.
  Say: "We can *predict* the cell's behavior by assuming it 'wants' to grow (Design Stance). But we *explain* the behavior by looking at the enzymes (Physical Stance). The inversion tells us the Design Stance is a useful fiction generated by the Physical Stance."
  If someone says "So purpose is real," reply: "Purpose is real *for the observer*, not *in the mechanism*." Keep that distinction on the board.

  ### 5. The Boomerang (We are Machines)
  **Yes, raise it.** But you must control the landing.
  **Where:** The last 5 minutes of the Turing section, before the Check.
  **How:** Do not frame it as "We are just computers." Frame it as "We are the product of the same inversion."

  **The Script:** "If Turing is right, our comprehension is not a magic spark. It is a competence built out of smaller competences that do not comprehend. This does not make us less human; it makes us less magical."

  **Handling the Compsci Guy:**
  Pre-empt his hijack by adding a constraint: "This does not mean any machine we build comprehends. It means our comprehension is *naturalized*. It doesn't validate AI; it validates biology."
  If he tries to claim LLMs understand, turn it back on the definition: "Does the LLM have the evolutionary history that grounds the symbols? Or is it just the competence without the comprehension? That is the question this inversion forces us to ask."

  ### 6. The Check (Reverse-Paley)
  **Verdict:** This is the right test. It is superior to a restatement because it tests the *logical space* of the theory, not just memory.

  **Why it works:** If they truly grasp the inversion, they should struggle to describe what evidence for "real foresight" would look like, because the inversion claims such evidence is impossible in principle (since any evidence would be a physical product of a blind process).

  **The Prompt:** "If Darwin and Turing are wrong, what would the world look like? What observation would force us to reinstate a Designer?"
  **What it shows you:**
  *   If they say "Irreducible complexity," they haven't got it (that's just hard engineering).
  *   If they say "A message in the DNA," they haven't got it (that's just complex syntax).
  *   If they struggle and say "I don't know," **they have got it.** They understand that the inversion closes the door on supernatural explanation.

  **What to leave out:**
  *   **The Hard Problem of Consciousness:** Do not let the session drift into "qualia." It will eat the time and solve nothing.
  *   **AI Ethics:** Do not discuss whether we should treat machines well.
  *   **Morality:** Do not discuss whether this inversion undermines ethics.

  **Final Instruction:**
  When you ask the Reverse-Paley question, **wait**. Let the silence sit for ten seconds. The discomfort is the learning. If someone answers quickly, ask: "But couldn't a blind process produce that?" Keep pushing until they realize the inversion is a closed loop. That is where the philosophy happens.
