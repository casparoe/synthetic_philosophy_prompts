answer: |-
  Brainstorm
  The core of your struggle lies in distinguishing between *aggregation* and *emergence*. Traditional individualism argues that social facts are nothing over and above the sum of individual actions, while holism argues that social structures exert downward causation. Your intuitions, however, suggest a more nuanced middle ground: you accept individualism when individual variance drives outcome variance, but you switch to holism when structural relations or systemic constraints determine outcomes regardless of individual variance. This suggests your ontology isn't committed to either extreme but rather tracks *where the causal leverage lies*. The conceptual landscape here involves supervenience (social facts depend on individual facts) versus autonomy (social facts have independent explanatory power). Your flipping on the language case suggests you are sensing the transition point where individual acts crystallize into structural constraints.

  The Principle
  I propose **The Principle of Relational Causal Power**. This principle states that individualistic explanations are sufficient only when the causal mechanism relies on the intrinsic properties of agents (beliefs, desires, calculations) aggregating without significant interaction effects. Conversely, holistic explanations are required when the causal mechanism relies on *relational properties* (network positions, shared expectations, systemic constraints) or when the macro-outcome exhibits *equifinality* (stability despite micro-variation). In short: if changing the individuals changes the outcome, look to the individuals; if changing the individuals leaves the outcome unchanged, or if the outcome depends on the pattern of connections rather than the nodes, look to the structure.

  Clause one motivates your verdicts on Maria and Region A. In Maria's case, the action tracks her specific internal state (anger), and in Region A, the unemployment spike tracks the sum of independent calculations; in both, the variance in the macro-outcome is directly explained by variance in micro-properties. Clause two motivates your verdicts on Region B, Gridtown, and the Zoning Referendum. Region B shows equifinality (same spike, different local conditions), implying a systemic constraint. Gridtown demonstrates that network topology (a relational property) drives outcomes despite identical agent preferences. The Zoning case relies on shared expectations, which are irreducibly relational facts existing between heads, not within them.

  Application to Unlisted Cases
  Applying this to your "glimmer" case resolves your ambivalence: the principle dictates a temporal shift. Initially, when only your friend uses the word based on her intent, individualism suffices (Clause 1). However, once the group adopts it with grammatical rules she never intended, the usage is constrained by collective convention—a relational structure that exists independently of any single user's intent. At that point, holism wins (Clause 2), because the meaning is now fixed by the system, not the coinage.

  Regarding the startup versus corporation culture: the principle predicts the startup's culture dies with the founder because it relies on Clause 1 mechanisms (the founder's intrinsic charisma and whims). The culture is not structurally encoded. In the large corporation, culture survives turnover because it is embedded in Clause 2 mechanisms (formal procedures, hierarchy, relational norms) that constrain new individuals regardless of their intrinsic preferences. The corporation has achieved structural autonomy; the startup has not.

  Tensions and What to Drop
  Adopting this principle forces you to abandon the purity of your Region A verdict. You claimed Region A was "clean aggregation" of individual calculations, but labor markets are inherently structural systems (prices, laws, supply chains) that shape those calculations. If you accept Clause 2—that systemic factors matter when outcomes are constrained—you must admit that Region A likely involves hidden holistic forces (market structures) just like Region B, even if the local conditions differed. You cannot consistently claim Region B is holistic while Region A is purely individualistic unless you prove the owners in Region A were truly immune to structural pricing pressures. The tradeoff is acknowledging that "individual calculation" is almost always structurally embedded, pushing you toward holism more often than you initially wanted. You must also drop the ambivalence on the "glimmer" case; the principle demands a sharp line where convention overrides intent.

  Confidence Note
  I am highly confident in this principle as a diagnostic tool for explanatory adequacy, as it aligns with modern structuralist and mechanistic accounts in social science without committing to mystical group minds. The specific point I am least sure about is the boundary of "intrinsic properties." If beliefs themselves are socially constituted (e.g., Maria's anger was sparked by movement rhetoric), then Clause 1 may rarely apply, potentially collapsing the distinction and forcing a near-total holism. Distinguishing between socially formed internal states and structural causal powers remains the hardest philosophical knot to untie.
