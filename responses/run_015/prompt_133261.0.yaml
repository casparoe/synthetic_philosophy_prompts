prompt: |-
  I'm in a course on social ontology and the individualism vs. holism debate keeps bugging me — I was arguing with friends last week about whether society is always just people summed up, or if there are real group-level forces that do causal work. You should act like an expert philosopher of social science; think carefully, maybe start with a quick brainstorm of the conceptual landscape, then get precise and don't just list textbook positions.

  Here are my gut verdicts on explanations, and I want to know if there's one principle behind them, or if I have to drop something. When Maria joined the climate strike, her own anger and beliefs fully explain why she went — no need to invoke "the movement" as an extra cause. Fine. When unemployment spiked in Region A, every factory owner indivdually calculated automation costs and quit hiring; that aggregates up cleanly, so methodological individualism works. Fine. But when Region B had the exact same spike despite totally different local labor conditions, it feels like you need a systemic or global factor that isn't just summed-up choices — holism wins here. In my virtual-world design class we invented a synthetic environment called Gridtown where agents all have identical preferences but different network positions, and the macro-patterns (segregation, cascade failures) come out totally different — I think that proves structure does real explanatory work. Then there's language in our shared virtual space: my friend coined "glimmer" for a specific LED effect, and at first it was just her word, but now the whole group uses it with grammatical rules she never intended. I keep flipping — sometimes I say it's just aggregated adoption of an individual coinage, other times I say the collective linguistic framework explains why people picked it up and shaped it. That's the case I go back and forth on. There's also this zoning referendum: every voter I talked to said they supported reform, but it failed because people assumed others wouldn't vote yes and stayed home. So explaining the outcome needs reference to shared expectations that aren't in any one head.

  So what's the unifying principle? Maybe something about causal redundancy, or about whether reshuffling the indivdual agents while keeping macro-structure constant changes the outcome? Please organize your answer exactly like this: "Brainstorm" (about one paragraph), "The Principle" (about two paragraphs — state it precisely and say which clause each listed case motivates), "Application to Unlisted Cases" (predict for the "glimmer" case and for why a small startup's culture dies with the founder but a large corporation's culture survives turnover), "Tensions and What to Drop" (say which of my verdicts a simpler principle forces me to abandon, and be honest about the tradeoff), and "Confidence Note" (say how confident you are in the principle overall and single out the specific point you're least sure about). Please don't include bibliographies, reading lists, or citations — neither I nor the model being tested can verify them without searching, and I want this to work offline. Also avoid quoting any real texts verbatim.
