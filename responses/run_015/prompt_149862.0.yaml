          *Revised:* ...Ultimately, the novel asks whether she can inhabit the past without conquering it, finding a modernity that honours the hidden covenants of the earth. The stakes are personal and communal. If she fails, she loses her connection to the ancestry she sought to reclaim, becoming an outsider in her own home. The wall becomes her judge. Success is not defined by the completion of the pavilion, but by the preservation of the spring. She must realise that her role is not to impose form upon chaos, but to reveal the order already present. This requires a surrender of ego, a recognition that the best architecture sometimes means knowing what not to build. Her return journey is complete only when she understands that the wall is not a limit to her freedom, but the foundation of it. The arc concludes not with a grand unveiling, but with a quiet acknowledgement of debt to those who built before her.
