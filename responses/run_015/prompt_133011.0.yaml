answer: |-
  The faulty step is **(5)**.

  Specifically, you should reject the claim within (5) that **"Calibration is the only external check we have on a set of probability estimates."**

  ### Why the step looked sound
  This premise relies on a standard frequentist intuition: a probability claim is "true" if, in the long run, the event occurs with the stated frequency. Calibration is the empirical measure of this fit. It looks sound because calibration is indeed a *necessary* condition for a probability estimate to be correct. If an actuary predicts 0.8 risk for a group and only 0.2 experience complications, that actuary is objectively wrong. Since your two actuaries are both calibrated, it seems there is no empirical ground to prefer one over the other. This makes the choice of class appear purely volitional, paving the way for the skepticism in (6).

  ### Why you should reject it
  Calibration is necessary, but it is not sufficient, and it is certainly not the *only* check. In forecasting and statistical modeling, we also value **resolution** (or informativeness).

  Consider your two actuaries. Actuary A partitions patients by a causally relevant factor (e.g., presence of a specific genetic marker) and predicts 0.8 for those with it and 0.2 for those without. Actuary B ignores the marker and predicts 0.5 for everyone (the base rate). Over a long run, both can be perfectly calibrated. Actuary A is right 80% of the time in the high-risk group and 20% in the low-risk group. Actuary B is right 50% of the time overall.

  While both are calibrated, Actuary A's partition is objectively superior because it captures variance in the data that Actuary B's ignores. The data *does* adjudicate between these partitions: it shows that Actuary A's cells are more homogeneous (lower within-cell variance) than Actuary B's. We have external checks for this, such as proper scoring rules (e.g., Brier score or Log Loss), which penalize uninformative predictions even if they are calibrated.

  Therefore, the data is not silent. It tells us which reference classes are *more informative* while remaining calibrated.

  ### What rejecting it costs you
  Rejecting (5) costs you the idea that all calibrated reference classes are epistemically equal. You must accept that while there may be no *single* "correct" class (preserving your premise 3), there is an objective **ranking** of classes based on their predictive power.

  This imposes a constraint on the "choice" mentioned in (3). You wrote that the class is "settled by what we already know and by what the estimate is wanted for." Rejecting (5) commits you to the view that "what the estimate is wanted for" includes an objective epistemic goal: **maximizing informativeness.** You are not free to choose a class simply to produce a desired number; you are constrained to choose the class that best resolves the uncertainty, given the available data.

  ### How this saves your argument (and keeps premise 3)
  This rejection allows you to hold on to **(3)**, which you wish to preserve.
  *   **(3) remains true:** There is still no fact of the matter that *dictates* one unique class to the exclusion of all others (e.g., you might trade off specificity for sample size). The choice is still supplied by us based on our goals.
  *   **(6) is blocked:** Because the data *does* constrain us (by ruling out uninformative partitions), statistics *do* constrain what we should expect. We cannot simply "shape" the class to produce any answer we like; we are bound to select from the set of classes that offer genuine predictive resolution.
  *   **(7) is avoided:** Global skepticism is averted because induction is not undermined; it is merely recognized as aiming for the most informative stable frequencies, not a mythical "single true frequency."

  By distinguishing between *uniqueness* (which you deny in 3) and *quality* (which the data reveals, contra 5), you dissolve the skeptical conclusion without abandoning the pragmatism of your central thesis.
