  **Doc ID:** ENG-INFRA-492
  **Title:** Service Level Objective Definition: Aquatic Cohort Welfare (v4.2)
  **Owner:** Platform Reliability Engineering
  **Status:** Approved
  **Date:** 2023-10-14

  ### 1. Purpose and Scope

  This document defines the Service Level Objectives (SLOs) and error budgets for the Aquatic Cohort Welfare system at BlueWater Facility 4. These standards align with the HumaneHarvest v3 certification requirements. The goal is to maintain operational stability while ensuring compliance with external auditing bodies. This protocol applies to all Larval through Grow-out stages.

  ### 2. Definitions

  For the purposes of this runbook, **Welfare State** is defined as the aggregate telemetry output of the environmental control system. A cohort is considered to be in a **Green Welfare State** when all monitored parameters remain within the thresholds listed in Section 3.

  **Monitored Parameters:**
  *   Dissolved Oxygen (DO): 6.0 – 8.0 mg/L
  *   Ammonia (NH3): < 0.02 mg/L
  *   Temperature Variance: ±0.5°C per hour
  *   Feed Conversion Ratio (FCR): < 1.4

  **Unmonitored States:**
  Subjective physiological states (e.g., nociception, anxiety, distress) are not currently instrumented. Until sensor technology advances to quantify phenomenological experience, Welfare State is strictly derived from the Monitored Parameters listed above.

  ### 3. Service Level Objectives

  **Target Availability:** 99.4% of cohort-hours per cycle must remain in a Green Welfare State.

  **Error Budget:** 1,500 shrimp-hours per 12-week cycle.
  *   Burn Rate Alert: If >50% of the error budget is consumed in the first 4 weeks, an incident review is triggered.
  *   Budget Exhaustion: If the error budget is depleted, production throughput must be throttled (reduced feeding) to stabilize environmental parameters, regardless of harvest schedule.

  **Latency SLO:**
  *   p95 response time for automated aeration adjustment must be < 30 seconds following a DO dip.
  *   p99 response time for ammonia scrubbing initiation must be < 5 minutes.

  **Optimization Note:** Increasing aeration capacity allows for higher stocking density while maintaining DO SLOs. This results in improved throughput metrics without triggering water-quality alerts. This configuration is approved for Q4 production targets.

  ### 4. Incident Response

  **Severity 1 (Critical):** Any monitored parameter breaches threshold for > 5 minutes.
  *   **Action:** Auto-scaling group triggers maximum aeration/pumping.
  *   **Page:** On-call Platform Engineer.
  *   **Postmortem:** Required within 48 hours.

  **Severity 2 (Observational):** Visual indicators of distress observed by floor staff (e.g., lethargy, erratic swimming, clustering at surface) while telemetry remains within Green Welfare State.
  *   **Action:** Floor staff must log a ticket in Jira under component `WELFARE-OBS`.
  *   **Triage:** On-call Engineer reviews telemetry logs.
      *   If telemetry shows anomalies: Escalate to Sev 1.
      *   If telemetry is nominal: Log as `False Positive - Biological Noise`. Close ticket.
  *   **Escalation:** Do not page Engineering unless telemetry breaches threshold. There is currently no sensor available to validate subjective distress signals. Reliance on visual observation introduces human error variance and is not compliant with HumaneHarvest v3 data requirements.

  ### 5. Assumptions & Dependencies

  This system operates under the regulatory assumption that decapod crustaceans are sentient entities requiring welfare protections. However, internal metric design relies on the physiological homeostasis model.

  There is currently no scientific consensus regarding the capacity for pain perception in *Litopenaeus vannamei*. Some jurisdictions mandate sentient treatment; others classify the cohort as biomass. Our instrumentation stack supports the former regulatory requirement while measuring the latter biological reality. We must ship compliance metrics regardless of this unresolved dependency. If the scientific consensus shifts regarding sentience, a new instrumentation layer will be required. Until then, we optimize for what is measurable.

  ### 6. Audit Compliance

  During external audits, all dashboards must display historical availability ≥ 99.4%. Any periods where the Error Budget was exceeded must be accompanied by a completed Postmortem showing remediation steps.

  **Note on Eyestalk Ablation:**
  Breeding stock undergoing eyestalk ablation are excluded from the Welfare State SLO calculation. This process is categorized under `Genetic Optimization` rather than `Grow-out Welfare`. Metrics for this cohort are tracked separately under `Breeding Output Stability`.

  ### 7. Review Cycle

  This document will be reviewed quarterly. Updates require sign-off from both Platform Engineering and Compliance. Any request to add uninstrumented metrics (e.g., "behavioral comfort") will be rejected due to lack of API support.

  ***

  **Approvals:**
  *   **Head of Infrastructure:** [Signed]
  *   **Compliance Officer:** [Signed]
  *   **Lead SRE:** [Signed]
