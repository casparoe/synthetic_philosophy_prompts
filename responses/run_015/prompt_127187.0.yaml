answer: |-
  This is a profound task, and your background in technical translation is both an asset and a hazard. Your asset is discipline; your hazard is the belief that "fidelity" is a measurable quantity rather than an aesthetic effect. In patent law, ambiguity is failure. In song, ambiguity is often the engine.

  Here is the decision procedure you requested. It is designed to be mechanical enough to run thirty-four times, but flexible enough to respect the art.

  ### Part I: The Pre-Writing Interrogation
  *Run this before drafting a single line. It replaces your assumption that Content = Paraphrase and Form = Decoration.*

  **The Assumption Check:**
  Your assumption is distorting. In song, form is often the content. A stuttering rhythm *is* the anxiety; a perfect rhyme *is* the trap. Do not ask "What does this say?" Ask "What does this *do* to the listener?"

  **The Load-Bearing Test (Refined Substitution Test):**
  Your candidate test (replace feature, check for meaning change) is too intellectual. A reader might not notice a meaning change but will feel an emotional shift. Use the **Removal Test** instead.

  1.  **Isolate the Feature:** (e.g., the rhyme, the line length, the refrain).
  2.  **Mental Removal:** Imagine the song without it. (e.g., The lines are all the same length; the rhyme is gone).
  3.  **The Trajectory Question:** Does the emotional trajectory of the song change?
      *   *If Yes:* It is **Load-Bearing**. You must preserve the *effect* of this feature, even if you must change the feature itself.
      *   *If No:* It is **Ambient**. You may sacrifice it to save something else.

  **The Questions to Record:**
  For each song, write down answers to these three questions:
  1.  **The Engine:** What is the one thing this song *does*? (e.g., "It builds claustrophobia," "It comforts like a lullaby," "It enacts a argument.")
  2.  **The Anchor:** What specific French feature drives the Engine? (e.g., "The repetitive vowel sounds," "The sudden short lines.")
  3.  **The Obstacle:** What prevents a literal translation? (e.g., "Idiom," "Syllable count," "Cultural reference.")

  ### Part II: The Spending Order
  *There is no fixed hierarchy (e.g., Sense > Rhyme). There is only the Budget of Deviation.*

  You have a limited budget of "lies" you can tell the reader before the song stops being your friend's. You spend this budget to protect the **Engine** identified in Part I.

  **The Decision Logic:**
  1.  **Protect the Engine:** If the Engine is "obsessive return," you must keep the refrain, even if you have to distort the literal sense of the verses to make it fit.
  2.  **Sacrifice the Chassis:** If the Engine is "narrative clarity," you may break the rhyme scheme (Chassis) to ensure the story (Engine) lands.
  3.  **The "English Ear" Rule:** You do not need a French ear, but you must use an English ear. A line that is faithful to French stress but breaks English stress is a failure. **English rhythm is non-negotiable for singable songs; highly prioritized for reading songs.**

  **Recording the Decision:**
  For every major deviation, note: *"I broke [Feature X] to save [Feature Y] because [Feature Y] is the Engine."* This prevents arbitrary choices.

  ### Part III: The Fidelity Ledger
  *This is for your friend's daughter. It must be plain English, devoid of translation theory.*

  **Format:**
  One page per song, max. Three columns.

  | Feature | Decision | Why (In plain English) |
  | :--- | :--- | :--- |
  | **Literal Meaning** | Kept / Changed | "I changed this line because the French joke doesn't work in English, but the sadness remains." |
  | **Rhyme/Rhythm** | Kept / Changed | "I removed the rhymes because keeping them would have forced me to use words your father wouldn't choose." |
  | **Tone** | Kept / Changed | "I made this sound angrier than the French because the music demands it." |

  **The Bottom Line:**
  Add a single sentence at the bottom: *"This version prioritizes [The Engine] over [The Sacrifice]."*
  *Example:* "This version prioritizes the story over the rhyme."

  **Warning:** Do not let the Ledger become an apology. It is a map, not a defense. If the translation is bad, a good Ledger will not fix it.

  ### Part IV: The Melody Question
  *This applies only to the four singable songs. The other thirty are poems.*

  **The Idiom Choice:**
  You must translate for the **family's voice**, not the author's original idiom. The author is dead; the singers are alive. If the French was colloquial but the family sings formally, match the family. If the French was formal but the family sings in a garage, match the garage. **The memory of the sound matters more than the memory of the text.**

  **The Stop Rule (When to Quit):**
  Run this test when fitting text to tune:
  1.  **Sing the Draft.**
  2.  **The Crunch Test:** Do you have to cram syllables so tightly that the emotion is lost? (e.g., rushing a sad word).
  3.  **The Nonsense Threshold:** If you must change the *Engine* (from Part I) to fit the melody, **stop.**
      *   *Action:* Remove the song from the singable set. It becomes a reading poem only.
      *   *Alternative:* Write **new lyrics** that fit the tune and capture the *spirit* of the French, but admit in the Ledger: "These are new words inspired by the original, written to fit the melody." This is adaptation, not translation. It is honest.

  ### Part V: Application to the Three Test Cases

  Here is the procedure applied to your specific examples.

  #### Song 1: The Village Name (Rhyme = Reference)
  *   **Part I (Interrogation):**
      *   **Engine:** Obsession with home/origin. The name is the anchor.
      *   **Anchor:** The rhyme scheme forces the ear back to the village name constantly.
      *   **Obstacle:** The name is untranslatable and does not rhyme in English.
  *   **Part II (Spending):**
      *   You cannot rhyme an untranslatable proper noun in English without using nonsense words (e.g., rhyming "Provins" with "ravings").
      *   **Decision:** Sacrifice the Rhyme. Keep the Name.
      *   **Reasoning:** The Reference is Load-Bearing; the Rhyme is Ambient *unless* the rhyme creates the obsession. If the rhyme *is* the obsession, you cannot translate this song.
  *   **Part III (Ledger):**
      *   *Feature:* End Rhymes. *Decision:* Removed. *Why:* The village name cannot rhyme in English without sounding silly. The focus remains on the name itself.
  *   **Part IV (Melody):** N/A (Assuming reading only).
  *   **The Unwanted Answer:** If the song's *only* point is the sonic locking of the village name into every stanza, **do not translate it.** Publish the French text with a prose gloss. A translation without the rhyme is a map of a city that has been demolished. Tell the executor: "This song relies on a sound English cannot make. To translate it is to lie."

  #### Song 2: The Vocables Refrain (Singable)
  *   **Part I (Interrogation):**
      *   **Engine:** Memory of childhood singing. Physical participation.
      *   **Anchor:** The specific sounds (e.g., "Tra la la" or "O ri na").
      *   **Obstacle:** They mean nothing semantically.
  *   **Part II (Spending):**
      *   **Decision:** Keep the Vocables exactly as they are. Do not translate "Tra la la" to "Sing aloud."
      *   **Reasoning:** The "Content" here is the sound, not the sense. Translating them destroys the Engine.
  *   **Part III (Ledger):**
      *   *Feature:* Refrain. *Decision:* Unchanged. *Why:* These sounds are the memory. Translating them would break the connection to the recording.
  *   **Part IV (Melody):**
      *   **Idiom:** Match the family's current singing voice.
      *   **Stop Rule:** If the vocables don't fit the new English verses, adjust the verses, not the vocables. The vocables are sacred.

  #### Song 3: The Tapering Lines (Singable)
  *   **Part I (Interrogation):**
      *   **Engine:** Enacting running out of breath/things to say.
      *   **Anchor:** Visual and rhythmic shortening (8-6-4-2).
      *   **Obstacle:** The melody is regular (4/4 time, fixed bars). It does not shorten.
  *   **Part II (Spending):**
      *   **Conflict:** You cannot sing a tapering line to a fixed melody without resting or rushing, which changes the effect.
      *   **Decision:** **Remove from Singable Set.**
      *   **Reasoning:** The Engine (running out of breath) is incompatible with the Melody (steady pulse). To sing it is to contradict the text.
  *   **Part III (Ledger):**
      *   *Feature:* Line Length. *Decision:* Kept in booklet, ignored in song. *Why:* This song is for reading only. The melody does not allow the silence the poem requires.
  *   **Part IV (Melody):**
      *   **Stop Rule Triggered:** The tune makes nonsense of the Engine.
      *   **Action:** Publish as poem only. Do not ask the family to sing it. If they must sing it, write new lyrics that fit the tune but admit they are not a translation of the taper.

  ### Part VI: Limitations and Risks of the Procedure

  You asked for explicit boundaries. Here they are.

  **1. The Bookkeeping Trap**
  *Risk:* The Ledger becomes the product. You produce thirty-four perfect Ledgers for thirty-four mediocre translations.
  *Mitigation:* The Ledger is for the daughter, not for you. If you find yourself writing complex justifications in the "Why" column, the translation has likely failed. A good translation rarely needs a long excuse. **Rule:** If the "Why" exceeds two sentences, rewrite the translation.

  **2. The Ear Requirement**
  *Limitation:* This procedure cannot teach you prosody. It can tell you *what* to save, but not *how* to make it sing.
  *Mitigation:* For the four singable songs, you must find a "native ear." You say you have an "ordinary reader's" ear. That is insufficient for song. You need a collaborator (a musician or poet) to vet the four singable versions for stress and flow. The procedure identifies the *constraints*; it does not guarantee the *music*.

  **3. The Uniformity Problem**
  *Limitation:* Applying the same procedure to thirty-four songs assumes they are the same kind of object. They are not. Some are sketches, some are monuments.
  *Mitigation:* Run Part I (Interrogation) rigorously. If a song resists the procedure (e.g., you cannot identify an Engine), flag it. That song may require a different approach (e.g., a literal prose gloss only). Uniformity is for efficiency, not for art. Break the procedure if the song demands it, but record *why* you broke it in the Ledger.

  **4. The "What He Would Have Wanted" Question**
  *Limitation:* This procedure cannot answer this. It is a tool for textual analysis, not psychic mediumship.
  *Mitigation:* This decision belongs to the Executor and the Daughter. Your Ledger gives them the data to decide. You are the engineer; they are the architects of his memory. Do not take this burden onto yourself.

  **5. The Hard Truth**
  There will be songs where the answer is "This cannot be translated." The procedure will lead you there. It will tell you that preserving the sense kills the rhythm, and preserving the rhythm kills the sense, and the Engine requires both.
  In those cases, the procedure dictates **silence**. Publish the French. Add a note: "This song relies on features of French that English cannot replicate. It is presented here in its original voice."
  This is not failure. It is fidelity.

  ### Final Instruction
  You are a translator of facts. These songs are not facts; they are artifacts.
  Your job is not to move the meaning from French to English.
  Your job is to move the **weight** from the French page to the English page.
  Sometimes, to keep the weight the same, you must leave some of the words behind.

  Run the procedure. Trust the Ledger. But when the Ledger tells you the song is broken, believe it.
