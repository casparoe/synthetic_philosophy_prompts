prompt: |-
  I should say at the outset what I do and don't know, so that the procedure can be pitched at the right level. I translate for a living — patent and clinical documentation, French into English — and I am good at the kind of fidelity that can be checked word by word against a source. I have no training in verse, no ear developed beyond an ordinary reader's, and until recently no interest in the problem.

  What changed: a friend of mine, a songwriter who worked in French, died two years ago. His partner, who is the executor and speaks none of the language, has asked me to prepare English versions of the thirty-four short songs he recorded, for a bilingual booklet accompanying a reissue of the recordings. Four of them the family still sings together, and they would like to sing those in English. I have two or three evenings per song, spread over about a year, for no fee; at the end my friend's daughter, who is eighteen and has read none of the French, looks at the English page proofs and says yes or no. She will read them cold, without me in the room. The one book on translation I own, which I read because its title puns on a word for a work made in memory of someone dead, contains dozens of English renderings of a single short French poem, each of them preserving something different; it convinced me that the music is where the difficulty is and left me with no way to proceed.

  So: please write me a decision procedure I can run alone, in an evening, on each of the thirty-four songs, and run the same way each time.

  The things I need it to contain, in order:

  First, the questions to ask about a song before writing anything — what the features of its form actually are, and which of them are doing work. My working assumption has been that content is whatever survives a prose paraphrase and that form is everything left over, so that form is what I sacrifice first. Tell me if that assumption is the thing distorting the procedure: I suspect it is, because several of these songs seem to mean things by their form that no paraphrase captures (a refrain that keeps returning the way the thought it reports keeps returning; lines that get shorter as the speaker runs out of things to say; a rhyme that yokes two words the song is arguing belong together). I need a way to separate load-bearing form — the kind whose loss changes what the song claims — from ambient form, the texture a reader enjoys but which carries nothing a paraphrase would miss. My candidate test is a substitution test: replace the feature with a different one and ask whether a reader who has never seen the French would take the song to be saying something different. Improve it if you can, and tell me where it fails.

  Second, the spending order, and the grounds for it. Given a song where rhyme, metre, register, line-length, and literal sense cannot all be kept, what do I preserve, and how do I decide in this case rather than by a fixed ranking? I want the reasoning to be recordable, because of the third thing.

  Third, a short written artefact per song — a fidelity ledger, say: what I kept, what I sold, what it cost, and one line of justification — that someone with no French and no poetry can read and use to decide whether to accept my version. It should make the trade-offs visible without inviting her to reopen each one.

  Fourth, the melody question. For the four songs the family sings, the tune fixes how many syllables there are and roughly where the stresses fall, and I can test my result by singing it. But I also notice that fitting English to a tune is not one thing: you can set it in the idiom he wrote in or in an idiom the family actually sings, and those give different answers about which syllables may be crunched. Say which choice is mine to make and which is not. And give me a rule, with a stop in it, for when the tune makes nonsense — at what point I leave that song out of the singable set, or write new English words to the tune rather than a translation of his.

  Please apply the whole procedure to three songs from the cycle, including at least one where the answer is one I will not want to hear — including, if that is where it lands, that a song should not be translated at all and should appear in French with a prose gloss.

  1. A song in which every stanza ends on the name of the village where he grew up, with all the rhymes built on that name. The name is untranslatable, and to an English reader it is noise; rhyme and reference are the same feature here.

  2. A song whose refrain, repeated unchanged after every stanza, is two lines of vocables — singable nonsense in the manner of a work chantey — which his daughter used to sing along to as a small child. This is one of the four that get sung. There is nothing here to translate.

  3. A song in which each stanza's lines shorten, eight syllables to six to four to two, the taper enacting a speaker running out of breath or of things to say. This one is also sung, and the tune will not permit the taper.

  Finally, be explicit about what the procedure cannot do: which questions it converts into bookkeeping rather than answering, where it cannot be run by someone without an ear for English prosody, where it hands the decision to a person because the issue is what my friend would have wanted rather than what his text permits, and whether a procedure applied uniformly across thirty-four songs is itself a choice I should be making. I would particularly like your view on whether the ledger risks becoming the product — pages of justification standing in for versions I have not managed to make good.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Professional translator (French to English, patent/clinical), high fidelity to source, no poetry training, no "ear" beyond ordinary reading.
      *   **Context:** Translating 34 short songs by a deceased friend (songwriter) for a bilingual booklet. Executor (partner) doesn't speak French. Daughter (18, no French) is the final approver. 4 songs need to be singable. Unpaid, limited time (2-3 evenings/song).
      *   **Problem:** Needs a decision procedure to handle the translation of lyrics, balancing form, content, and singability. Needs to justify trade-offs to a non-French speaker.
      *   **Specific Requirements:**
          1.  Pre-writing questions (Form vs. Content, load-bearing vs. ambient).
          2.  Spending order (Hierarchy of priorities, context-dependent).
          3.  Written artifact (Fidelity Ledger for the daughter).
          4.  Melody question (Singability vs. Translation, when to quit).
          5.  Application to 3 specific test cases (Village rhyme, Vocables refrain, Tapering lines).
          6.  Limitations/Critique of the procedure itself (Bookkeeping vs. Art, Uniformity issue).

  2.  **Deconstruct the Core Tension:**
      *   The user is a *prose* translator used to "fidelity checked word by word."
      *   Poetry/Song translation requires *fidelity to effect*, which often means betraying the words.
      *   The "Fidelity Ledger" is a brilliant idea but risks becoming a defensive shield rather than a transparency tool.
      *   The daughter is the ultimate audience. She doesn't know French. She cares about *memory* and *feeling*, not linguistic accuracy.

  3.  **Drafting the Procedure (Section by Section):**

      *   **Section 1: Pre-Writing Questions (Form vs. Content):**
          *   Challenge the user's assumption: "Content = prose paraphrase, Form = everything else." This is dangerous in song. Form *is* content in song.
          *   Refine the "Substitution Test." It's good, but needs to be specific to *song*.
          *   *New Test:* The "Removal Test." If you remove the feature, does the emotional trajectory change?
          *   *Load-bearing vs. Ambient:* Load-bearing = structural/emotional engine. Ambient = decoration.
          *   *Questions:* What does the rhyme *do*? (Lock ideas together? Create momentum?) What does the rhythm *do*? (March? Lullaby? Stumble?)

      *   **Section 2: Spending Order (Priorities):**
          *   Cannot be a fixed ranking (e.g., Sense > Rhyme). It must be song-specific.
          *   *The "Currency":* You have a budget of "Deviation."
          *   *Decision Logic:* Identify the "Engine" of the song. Protect the Engine. Sacrifice the "Chassis."
          *   *Recordability:* Need to note *why* a choice was made based on the Engine.

      *   **Section 3: The Fidelity Ledger:**
          *   Audience: The daughter (18, no French).
          *   Tone: Honest, not academic.
          *   Structure: Feature | Decision | Cost | Why.
          *   *Crucial Warning:* Do not let the Ledger justify a bad poem. It explains the compromise, it doesn't fix it.

      *   **Section 4: The Melody Question:**
          *   Distinction: "Translation for the page" vs. "Translation for the voice."
          *   The 4 singable songs are a different project than the 30 reading songs.
          *   *Idiom:* Translate for the *family's* voice, not the author's original idiom (unless they match).
          *   *The Stop Rule:* If fitting the tune requires breaking the core meaning (the Engine), drop it from the singable set. Keep it as a poem or French-only.
          *   *New Words:* If the translation fails the tune, write *new* lyrics that capture the *spirit* but fit the music (adaptation vs. translation).

      *   **Section 5: Applying to the Three Test Cases:**
          *   *Song 1 (Village Rhyme):* The name is the rhyme. Untranslatable.
              *   *Verdict:* You cannot rhyme an untranslatable proper noun in English without nonsense.
              *   *Solution:* Keep the name. Abandon the rhyme scheme. Explain in Ledger that the "foreignness" is the point. Or, translate the *feeling* of home, not the name (but the name is specific). Best: Keep name, lose rhyme, explain the loss of "locking" effect.
              *   *Hard Truth:* If the rhyme *is* the meaning (obsession with home), losing the rhyme kills the song. Maybe this one stays French with a gloss.
          *   *Song 2 (Vocables Refrain):* Nonsense syllables. Daughter knows them.
              *   *Verdict:* Do not translate. Keep the vocables.
              *   *Reason:* It's memory, not semantics. Translating "Tra la la" to "Sing loud" kills the memory.
              *   *Ledger:* Feature: Vocables. Decision: Keep. Cost: None. Why: It is the memory itself.
          *   *Song 3 (Tapering Lines):* Visual/structural metaphor (running out of breath). Tune forbids it.
              *   *Verdict:* Conflict between Page Form and Musical Form.
              *   *Decision:* If it's for the *booklet only*, keep the taper. If it's for *singing*, the tune wins.
              *   *Hard Truth:* If the taper is the *point* (dying breath), and the tune is upbeat/regular, the song is broken for singing. Recommendation: Do not sing this one. Keep as poem.

      *   **Section 6: Limitations & Critique:**
          *   *Bookkeeping Risk:* Yes, the Ledger can become a shield for failure.
          *   *Ear Requirement:* You need an ear for English rhythm even if you don't have one for French.
          *   *Uniformity:* Applying the same procedure to 34 songs is efficient but might crush unique songs.
          *   *The "What he would have wanted" question:* The procedure can't answer this. That's the executor/daughter's call.

  4.  **Refining the Tone:**
      *   Respectful, professional, empathetic.
      *   Acknowledge the user's expertise (precision) while guiding them into the ambiguity of art.
      *   Avoid poetic jargon where possible, or define it clearly.
      *   Be direct about the "Hard Truths."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about the "Substitution Test"?
      *   *Correction:* I need to explicitly validate or modify their proposed test. Their test is "replace and see if meaning changes." I should refine this to "remove and see if *effect* changes."
      *   *Check:* Did I address the "Ledger becoming the product" fear?
      *   *Correction:* Yes, in the final section. I need to warn that a perfect ledger with a bad translation is still a bad translation.
      *   *Check:* The daughter's role.
      *   *Correction:* Emphasize that the Ledger is for *her*, not for critics. It needs to be readable by an 18-year-old non-expert.

  6.  **Final Polish:**
      *   Ensure the three test cases are distinct and illustrate the procedure's limits.
      *   Make sure the "Stop Rule" for melody is clear.
      *   Ensure the distinction between the 30 reading songs and 4 singing songs is maintained.

  7.  (Final thought on the "Village" song): This is the trickiest. If the rhyme scheme relies on the village name (e.g., *X, X, X, Nom-du-Village*), and the name is untranslatable, you can't rhyme in English. If the *obsession* is the point, maybe you rhyme with *nothing* to show the isolation? No, that's too clever. Better to admit defeat on the rhyme and keep the name. Or, as the prompt suggests, maybe this one *shouldn't* be translated. I will argue for the latter in the "unwanted answer" slot.

  8.  (Final thought on the "Vocables"): This is the easiest. Don't touch them. It's a memorial artifact.

  9.  (Final thought on the "Taper"): This highlights the Music vs. Text conflict. If the tune doesn't taper, you can't sing the taper. So it must be a reading poem only.

