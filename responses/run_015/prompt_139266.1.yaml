          *   Rigidity check: $P_{new}(H|a_i)$ must equal $P(H|a_i)$. Since $a_i$ are atoms, conditionalizing on an atom makes you certain of it (if probability > 0). So $P(H|a_i)$ is 0 or 1. $P_{new}(H|a_i)$ is also 0 or 1. They match.
