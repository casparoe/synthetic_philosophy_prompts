      *   So the math *is* valid. The error is definitely normative/conceptual in (2).
      *   *Key Distinction:* JC is a constraint on *how* you move from $P$ to $P_{new}$ given a specific *stimulus*. It is not a constraint on the pair $\langle P, P_{new} \rangle$ in isolation.
      *   *The "Exogeneity" Constraint:* The partition $\mathcal{E}$ must be independent of the specific values of $P$ and $P_{new}$. It is determined by the *phenomenology* or the *causal link* between world and mind.

