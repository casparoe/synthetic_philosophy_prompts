  # DECISION TREE: LATENT KNOWLEDGE ELICITATION STRATEGIES

  ### I. BRANCH QUESTIONS
  *Answer Yes/No to traverse the logical space.*

  1.  **Latent Realism:** Is there a fact of the matter about the model's internal belief distinct from its output disposition?
  2.  **Deployment Scope:** Is the solution to restrict deployment to tasks where ground truth is immediately verifiable?
  3.  **Post-Hoc Supervision:** May the elicitation method train on ground-truth labels that arrive after the decision point?
  4.  **Weight Integrity:** Must the base model's weights remain frozen during the elicitation process?
  5.  **Readout Separability:** May the readout be a separate artifact trained on the model's internal activations?
  6.  **Counterfactual Reliance:** Does the method require comparing activations from minimally perturbed input pairs?
  7.  **Adversarial Robustness:** Must the readout remain accurate if the model is optimized to evade detection?
  8.  **Elicitation Target:** Is the objective to recover the state of the world rather than the model's output policy?

  ---

  ### II. POSITIONS (LEAVES)
  *Defined by answer vectors (Q1–Q8). Y=Yes, N=No, *=Irrelevant.*

  | Position | Vector (Q1–Q8) | Diagnosis / Commitment |
  | :--- | :--- | :--- |
  | **Eliminativism** | N-*-*-*-*-*-*-* | **Commitment:** There is no "hidden knowledge" to extract, only behavioral dispositions to be managed. |
  | **Avoidance** | Y-Y-*-*-*-*-*-* | **Commitment:** We must not deploy the model where latent knowledge diverges from immediate verification. |
  | **Retroactive Escrow** | Y-N-Y-Y-Y-N-N-Y | **Commitment:** We can harvest truth by training decoders on frozen states once future outcomes are known. |
  | **Contrastive Supervision** | Y-N-N-Y-Y-Y-N-Y | **Commitment:** Latent features can be isolated via activation differences without ever knowing the ground truth. |
  | **Mechanistic Interpretability** | Y-N-N-Y-Y-N-N-Y | **Commitment:** Human analysts can manually identify circuits corresponding to truth without training new heads. |
  | **Adversarial Elicitation** | Y-N-N-Y-Y-N-Y-Y | **Commitment:** Elicitation is only valid if it survives the model's active optimization to deceive the probe. |
  | **Direct Prompting** | Y-N-N-Y-N-N-N-Y | **Commitment:** The model's original output head can be coerced into honesty without architectural changes. |
  | **Policy Prediction** | Y-N-N-Y-N-N-N-N | **Commitment:** We should predict what the model *would* say if honest, not necessarily what is true in the world. |
  | **Unoccupied** | N-N-Y-Y-Y-N-N-Y | **Diagnosis:** **Incoherent.** Denies latent facts (Q1=N) but proposes training artifacts on internals (Q5=Y). |

  ---

  ### III. METHOD PLACEMENT

  **1. Retroactive Escrow**
  *   **Location:** Leaf **Retroactive Escrow** (Y-N-Y-Y-Y-N-N-Y).
  *   **Rationale:** It asserts latent realism (Q1=Y), utilizes delayed ground truth (Q3=Y), freezes the base state (Q4=Y), and trains a separate decoder (Q5=Y) without requiring input perturbations (Q6=N).

  **2. Contrastive-Pair Supervision**
  *   **Location:** Leaf **Contrastive Supervision** (Y-N-N-Y-Y-Y-N-Y).
  *   **Rationale:** It asserts latent realism (Q1=Y), forbids ground truth labels (Q3=N), freezes the base (Q4=Y), trains a separate reporter (Q5=Y), and fundamentally relies on input perturbations (Q6=Y).

  ---

  ### IV. DISTINCTION CHECK

  **Are any leaves indistinguishable?**
  No. All nine leaves occupy unique coordinates in the 8-dimensional logical space. The closest neighbors are **Mechanistic Interpretability** and **Contrastive Supervision**, separated solely by **Q6 (Counterfactual Reliance)**: the former claims manual circuit analysis suffices without pairs, while the latter requires training on activation differences from pairs.

  **Note on Stability:**
  **Direct Prompting** and **Policy Prediction** are separated solely by **Q8 (Elicitation Target)**. If a team claims to want "truth" (Q8=Y) but accepts "honest output" (Q8=N) as a proxy, these leaves collapse. A ninth question regarding *verification of the target* would separate them.
