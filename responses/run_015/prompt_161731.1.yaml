prompt: |-
  So I'm in this group chat — half rationalist-adjacent, half startup people — and we're trying to help a small nonprofit-ish org drop degree requirements from its hiring and use a work-sample/portfolio thing instead. One guy in the chat, who reads a lot of evo-psych, more or less shut the discussion down with: "a signal is like an advertisement. The money you spend on the ad is thrown away, and that waste is the whole point — it's what makes the message believable. If it didn't cost anything, everyone would run the ad, and then the ad carries zero information. So your cheap take-home test can't work. The waste has to be somewhere; you're just moving it around." He then reeled off peacock tails, stotting gazelles, Rolexes, expensive weddings, and said the handicap-principle math guarantees this in general: honest signalling requires waste, full stop. Nobody had a good answer and its been bugging me for a week.

  My own half-baked pushback, which I'd rather you stress-test than just agree with: as I understand it the handicap condition isn't "resources get destroyed," it's closer to "the signal has to be differentially costly — it has to cost a worse sender more than it costs a better one" — which is a claim about what a *lower-quality* sender *would* pay, i.e. a counterfactual, not about anything actually being burned up in equilibrium. And if that's the real condition, there ought to be signals where nothing is consumed at all: posting a bond or a hostage that you get back if you turn out to be telling the truth, or a credential that's free to hold but gets retroactively yanked plus a penalty if the holder underperforms — the cost is real and deters the fakers, but nobody ever pays it on the equilibrium path. Call them hostage signals versus burnt-money signals if that helps. If hostage signals genuinely work, then the ad analogy is smuggling in waste where the theory only needs differential cost, and my friend's "you're just moving the waste" is false rather than deep. But I also suspect there's a catch — something about needing someone who can verify quality after the fact, or about a single bond only sorting people into two bins instead of a smooth scale, or about the bond having to be big enough to sting the marginal type while top types post it for free — and maybe that's exactly where the waste creeps back in.

  So: audit the analogy properly. Give me the correspondence table (what plays the role of the ad budget, the product's actual quality, the customer, the repeat purchase, the rival firm that would love to lie), then separate the disanalogies that matter for the use he's making of it from the ones that are just decoration, and tell me whether "waste is load-bearing" survives once you put hostage-type signals next to burnt-money-type ones. If the ad picture is the wrong one, give me a better analogy for what a signal actually is. Assume for concreteness that the org gets ~30 applicants per role, can observe job performance reasonably well about six months after hiring, and can't pay anyone to sit through anything long. Write in American English, and keep it concrete rather than literature-flavored.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A group chat (rationalist/startup mix) discussing removing degree requirements for a nonprofit in favor of work samples/portfolios.
      *   **The Opponent:** A guy using evolutionary psychology/handicap principle arguments to claim *all* honest signaling requires "waste" (burnt resources), analogous to advertising or peacock tails. He argues cheap tests can't work because they lack this waste.
      *   **The User's Pushback:** The user suspects the handicap principle requires *differential cost* (costlier for low-quality than high-quality), not necessarily *burnt resources*. They propose "hostage signals" (bonds, revocable credentials) where cost is counterfactual (paid only if caught lying) rather than equilibrium (paid by everyone).
      *   **The Task:** Audit the analogy (Advertising vs. Signaling). Create a correspondence table. Separate relevant disanalogies from decoration. Determine if "waste is load-bearing" survives when comparing hostage vs. burnt-money signals. Provide a better analogy if needed.
      *   **Constraints:** Concrete, American English, not literature-flavored. Assume specific org constraints (~30 applicants, observable performance at 6 months, no pay for long tests).

  2.  **Deconstruct the Theory (Handicap Principle & Signaling):**
      *   *Core Concept:* Signaling theory (Spence, 1973) and the Handicap Principle (Zahavi, 1975).
      *   *The Opponent's Claim:* Cost must be *sunk* (wasted) to be credible. Analogy: Advertising budget is burnt money. Peacock tails are energy-draining.
      *   *The User's Claim:* Cost must be *differential*. If a signal is cheap for high-quality but prohibitively expensive for low-quality (even if the cost is conditional/counterfactual), it works.
      *   *The Nuance:* In equilibrium, high-quality types *do* pay the cost in standard signaling models (e.g., getting a degree takes time even for smart people). However, *screening* models (where the receiver moves second) can utilize bonds or probationary periods where the cost is avoided if true.
      *   *Key Distinction:* Signaling (sender moves first) vs. Screening (receiver moves first/sets terms). The nonprofit is setting terms, so this is technically a *screening* problem, though often colloquially called signaling.
      *   *The "Waste" Question:* Is waste necessary? In a separating equilibrium, the low type *doesn't* mimic. Do they pay the cost? No, they opt out. Do the high types pay the cost? In a degree model, yes (time/effort). In a bond model, no (money returned). In a work-sample model? Yes (time/effort).
      *   *The Opponent's Error:* He conflates "costly to fake" with "costly to everyone in equilibrium."

  3.  **Audit the Advertising Analogy:**
      *   *Ad Budget:* The signal cost.
      *   *Product Quality:* Candidate ability.
      *   *Customer:* The Nonprofit.
      *   *Rival Firm:* Low-quality applicants (fakers).
      *   *Repeat Purchase:* Long-term employment/performance.
      *   *Disanalogy:* Advertising is usually about *brand* reputation over many sales. Hiring is a *one-off* transaction per candidate (mostly). Advertising burns money to show confidence in repeat buys. Hiring can use probation (bond-like) because performance is observable later.
      *   *Crucial Point:* Advertising is a *signal* (sender chooses spend). Hiring tests are often *screens* (receiver chooses test). This changes the math.

  4.  **Evaluate "Hostage Signals" (Bonds/Probation):**
      *   *Mechanism:* Post $X. If performance < Y, lose $X.
      *   *Equilibrium:* High quality posts $X, performs well, gets $X back. Cost = 0 (excluding opportunity cost of capital). Low quality knows they will fail, so they don't post $X.
      *   *Is there waste?* No resources are destroyed in equilibrium. The *threat* of waste drives the separation.
      *   *Does this refute the opponent?* Yes, strictly speaking. Waste isn't required *in equilibrium*.
      *   *The Catch:* Liquidity constraints. Good candidates might not have the cash. This introduces a *differential cost* based on wealth, not ability. This is why degrees persist (they signal wealth + ability).
      *   *Work Samples:* These *do* have a cost (time). But it's differentially costly. A skilled dev takes 2 hours; an unskilled one takes 20 hours or produces garbage. The "waste" is the time spent. Is it "thrown away"? For the hired person, no (it leads to job). For the rejected person, yes.
      *   *Opponent's "Moving Waste Around":* He might argue the rejection cost is the waste. But the org cares about the *hired* person's signal cost.

  5.  **Drafting the Response:**
      *   *Tone:* Direct, analytical, respectful but firm on the theory. American English.
      *   *Structure:*
          1.  Verdict upfront (You're right, he's half-wrong).
          2.  The Correspondence Table (Ad vs. Hiring).
          3.  The Theory Check (Signaling vs. Screening, Differential Cost vs. Burnt Cash).
          4.  The "Hostage" Analysis (Why bonds work theoretically but fail practically).
          5.  The Work Sample Reality (Where the cost actually lies).
          6.  Better Analogy (The "Probationary Period" or "Money-Back Guarantee").
          7.  Actionable Advice for the Nonprofit.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say "Signaling Theory is wrong." It's not. The opponent is applying it too broadly.
      *   *Clarification:* Distinguish between *ex-ante* cost (before hiring) and *ex-post* cost (after hiring).
      *   *The "Waste" Definition:* In biology, the tail *is* the waste. In economics, the cost is the barrier. If the barrier is refundable, it's not waste *for the successful signaler*.
      *   *The "Moving Waste" Counter:* The opponent says "you're just moving the waste." He means the cost of *processing* the applicants or the cost of the *rejected* applicants doing the test. I need to address this. The org's cost is admin. The applicant's cost is time. If the test is efficient, the "waste" is minimized.
      *   *Key Insight:* The opponent is describing a *pooling* equilibrium fear (everyone applies). The goal is a *separating* equilibrium.
      *   *Work Samples:* They are *not* free. They cost time. But they are *correlated* with skill. That's the key. It's not just "costly," it's "productivity-revealing." Advertising is often *not* productivity-revealing (just budget-revealing). This is a huge disanalogy.

  7.  **Finalizing the Content:**
      *   *Table:* Ad Spend -> Test Time. Product -> Skill. Customer -> Hiring Manager.
      *   *Disanalogy:* Ads don't test product function; work samples *are* product function.
      *   *Hostage Signals:* Bonds fail due to liquidity. Probation works (deferred cost).
      *   *Conclusion:* The "waste" must be *differential*, not *sunk*. Work samples work because they are *less* costly for high-skill, not because they are *free*.
      *   *Recommendation:* Use a timed, small-scope work sample. It's a "skin in the game" signal without the "burnt money" requirement.

  8.  **Review against Constraints:**
      *   American English? Yes.
      *   Concrete? Yes.
      *   No literature fluff? Yes.
      *   Address the 30 applicants/6-month observation constraint? Yes.

  9.  **Final Polish:** Ensure the distinction between Signaling (applicant chooses) and Screening (org chooses) is clear, as this is the theoretical lever the user can pull. The opponent is treating it as pure Signaling; the Org can make it Screening.

  *(Self-Correction on "Hostage Signals"):* I need to be careful. A pure bond is rare. A "probationary period" is a more realistic hostage signal. You get the job, but if you fail in 6 months, you're fired (cost of unemployment). This is a *deferred* cost. The opponent argues the cost must be *upfront*. I need to explain why deferred works if verification is possible (which the prompt says it is).

  *(Refining the "Waste" argument):* The opponent says "waste is the whole point." The counter is "differential cost is the whole point." If the cost is zero for the high type and infinite for the low type, separation happens with zero waste. The problem is finding a signal where cost is truly zero for the high type. Work samples aren't zero cost, but they are *lower* cost. That's enough.

  Okay, ready to write.
answer: |-
  Here is the audit.

  **The Verdict:** You are right on the theory; he is right on the intuition but wrong on the mechanism. The Handicap Principle requires **differential cost**, not **burnt resources**. However, in practice, "waste" often creeps back in because finding a signal that is truly free for high-quality candidates but impossible for low-quality ones is hard. Your friend's "advertising" analogy is the wrong model for hiring. It's a *screening* problem, not a *signaling* problem, and that changes the math.

  Here is the breakdown.

  ### 1. The Correspondence Table

  Your friend is mapping Hiring onto Advertising. Let's make that explicit to see where the gears grind.

  | Advertising Model (His Analogy) | Hiring Model (Your Reality) |
  | :--- | :--- |
  | **Ad Budget** | Time/Effort spent on application (Degree or Test) |
  | **Product Quality** | Candidate Ability / Productivity |
  | **Customer** | The Nonprofit (Hiring Manager) |
  | **Rival Firm** | Low-ability Applicants (Fakers) |
  | **Repeat Purchase** | Long-term Employment / Performance |
  | **Verification** | Customer uses product (hard to verify quality quickly) | **6-month performance review** (You said this is observable) |
  | **Goal** | Convince customer quality is high | Convince employer ability is high |

  **The Critical Disanalogy:**
  In advertising, the money spent on the ad *does not improve the product*. It is pure waste. That is why it works as a signal: only a company confident in repeat purchases (high quality) can afford to burn cash upfront.

  In hiring, a work sample *is* a slice of the product*. If I ask a coder to fix a bug, the cost of the test is time, but the output *reveals* ability directly. It's not just a signal; it's a **measurement**.

  Your friend is treating the work sample like a billboard (pure cost). It's actually like a free trial (functional test).

  ### 2. Signaling vs. Screening (The Theoretical Lever)

  Your friend is describing a **Signaling** game: The applicant moves first (gets a degree), the employer moves second (hires). In this setup, the applicant must burn resources to prove worth.

  But your nonprofit is setting the rules. This is a **Screening** game: The employer moves first (sets the test), the applicant moves second (takes it or declines).

  In Screening models, you do not need burnt resources in equilibrium. You need **incentive compatibility**.
  *   **High Type:** Takes test, passes, gets job. Net cost = Time spent.
  *   **Low Type:** Takes test, fails (or knows they will), declines. Net cost = 0 (because they don't do it).

  Your friend claims "waste has to be somewhere." In this equilibrium, the waste is *avoided* by the low type because they self-select out. The "cost" is the *risk* of failure, not the *burn* of resources.

  ### 3. Auditing the "Hostage Signal" (Bonds & Probation)

  You proposed a bond: "Post $5k, get it back if you perform."
  *   **Theory:** This is a perfect separator. High types post it (cost = 0 if returned). Low types know they'll fail and lose $5k, so they don't apply. No waste in equilibrium.
  *   **The Catch (Liquidity Constraints):** This is where your friend's "waste" argument sneaks back in, not as theory, but as friction. High-ability candidates might be cash-poor (students, career switchers). The cost of capital is differentially high for them.
  *   **The Fix (Deferred Cost):** Since you can observe performance at 6 months, you don't need a cash bond. You need a **probationary period**.
      *   *Mechanism:* Hire on a 6-month contract. If performance is good, convert to permanent. If bad, terminate.
      *   *Cost to High Type:* Low (they keep the job).
      *   *Cost to Low Type:* High (unemployment, resume gap).
      *   *Waste:* Minimal. The "waste" is the risk of unemployment, which is a counterfactual cost for the high type.

  So, your intuition holds: **Hostage signals work without burnt money, provided verification is possible.** Your friend is ignoring the "verification" variable. Peacocks can't verify a mate's genes after mating; employers *can* verify an employee's output after hiring. That changes the game from "Handicap" to "Probation."

  ### 4. Why the Work Sample Works (Without "Burning" Money)

  Your friend says a cheap take-home test can't work because it lacks waste. He's confusing **absolute cost** with **marginal cost**.

  *   **Degree:** Cost = 4 years + $100k. High type pays this. Low type pays this (or borrows and defaults). It's a huge barrier, but it's blunt.
  *   **Work Sample:** Cost = 5 hours.
      *   **High Type:** Spends 5 hours, produces great work. Cost per unit of quality = Low.
      *   **Low Type:** Spends 20 hours, produces garbage, or quits. Cost per unit of quality = High.

  The signal works not because the 5 hours is "wasted," but because the **opportunity cost** is higher for the low type. They know their time is less likely to result in a payout.

  **Is the time "waste"?**
  *   For the hired candidate: No. It was the interview.
  *   For the rejected candidate: Yes.
  *   **The Math:** If you have 30 applicants and hire 1, 29 people "wasted" their time. Your friend would argue *this* is the waste he predicted.
  *   **The Counter:** This is **processing cost**, not **signaling cost**. Degrees also have rejection waste (people who get degrees but don't get jobs). The work sample reduces total social waste because the "test" is shorter than a 4-year degree.

  ### 5. A Better Analogy

  Tell your friend to drop the Advertising analogy. It implies the signal is uncorrelated with quality (a bad product can have a good ad).

  **Use the "Money-Back Guarantee" Analogy.**
  *   **Scenario:** A vacuum cleaner salesman offers a 30-day trial.
  *   **Signal:** "I am so confident this works, I'll let you use it for free and return it if it sucks."
  *   **Waste:** Does the salesman burn money? Only if the product is bad. If the product is good, the cost is zero (minus shipping).
  *   **Application:** The work sample is a micro-trial. The probation period is a macro-trial.
  *   **Why it refutes him:** The guarantee separates good products from bad ones *without* the good product manufacturer burning cash in equilibrium. The cost is conditional on failure.

  ### 6. Concrete Advice for the Nonprofit

  Given your constraints (30 applicants, 6-month verification, no pay for tests), here is how you structure the "Hostage/Screening" mechanism to satisfy the theory without the waste:

  1.  **The Filter (Low Cost):** Require a portfolio or GitHub link. Cost to applicant: 0 (they should have one). Cost to fake: High (hard to fake deep history).
  2.  **The Test (Differential Cost):** A timed, small-scope work sample (max 2 hours).
      *   *Why:* It imposes a time cost. High-skill people finish in 1 hour with high quality. Low-skill people take 5 hours or fail. The *differential* sorts them.
      *   *Addressing the "Waste":* Acknowledge that rejected applicants "waste" time. Mitigate this by making the test tiny.
  3.  **The Bond (Deferred):** The real "hostage" is the **probationary period**.
      *   Make it explicit: "First 6 months are contract-to-hire."
      *   This puts the risk on the employee (as your friend wants), but since you verify performance, the high-performer pays no penalty. The "waste" is only incurred by the faker who gets caught.

  ### Summary for the Chat

  Paste this if you want to shut it down cleanly:

  > "You're applying the Handicap Principle to a Screening problem. Zahavi's Handicap requires burnt resources because the receiver (peahen) can't verify quality later. We *can* verify quality after 6 months.
  >
  > That turns this into a 'Money-Back Guarantee' model, not an 'Advertising' model. In a guarantee model, the seller doesn't burn cash in equilibrium; they only pay if the product is bad.
  >
  > The work sample isn't a burnt signal; it's a differential filter. It costs the low-skill applicant more time/effort per unit of quality than the high-skill one. The 'waste' isn't load-bearing; the *slope of the cost function* is. We don't need to burn money to sort; we just need a test where the marginal cost of faking is higher than the marginal cost of doing it."

  **Bottom Line:** Your friend is treating "cost" as "sunk expense." Economics defines it as "opportunity cost." A refundable bond has a high opportunity cost for a liar (risk of loss) and a low one for a truth-teller. That sorts without burning. He's half-right that *some* cost is needed, but wrong that it must be *waste*.
