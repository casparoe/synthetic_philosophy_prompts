  Here is the breakdown of the bet.

  ### Overall Credence: 0.40

  I assign a **40% probability** that the recursive co-authorship view (RCV) is the *necessary* solution to the boundary problem, displacing both "all affected interests" (AAI) and birthright.

  This is a "best available theory" credence. It acknowledges that while AAI is over-inclusive and birthright is morally arbitrary, RCV carries heavy implementation costs and philosophical risks that prevent me from going above 0.5.

  ### Decomposition

  Here are the component probabilities. I am treating these as **conjunctive constraints** (all need to hold for the thesis to be fully true), which is why the overall number is lower than the arithmetic average.

  **(a) Legitimacy = Authorship > Affectedness: 0.75**
  *Reasoning:* AAI collapses because everyone is affected by everything (climate, markets, war). It offers no boundary. Birthright offers a boundary but no moral agency. Authorship (the republican ideal of non-domination) is the only one that grounds the *value* of democracy rather than just its *scope*. However, 0.25 is docked because "affectedness" still matters for basic human rights protections even if it doesn't determine voting membership.

  **(b) "Active Contestation" is Non-Circular: 0.45**
  *Reasoning:* This is the classic Whelan regress: to define the practice, you must define the practitioners; to define the practitioners, you must define the practice. Pinning down "active contestation" without presupposing the very boundary you're trying to solve is notoriously difficult. Most attempts sneak in a prior assumption of state jurisdiction.

  **(c) Residents In / Absentee Out Fit: 0.70**
  *Reasoning:* RCV tracks our intuitions well here. Long-term residents are embedded in the coercive legal order; absentee passport-holders often are not. However, 0.30 is docked because "embeddedness" is a spectrum, not a binary. Some residents are passive; some expats are deeply economically engaged. The line remains fuzzy.

  **(d) Compatibility with "Unearned" Membership: 0.50**
  *Reasoning:* You asked for the weight I give the intuition that membership shouldn't be "earned." I interpret this variable as the *probability that this intuition is compatible with RCV*. RCV sounds like membership must be *maintained* through activity (earning). If membership is a basic right (unearned), RCV fails. I'm split 50/50 on whether "right to contest" counts as a status (unearned) or a performance (earned).

  **Combination Method:**
  I treat (b) as a **gatekeeper**. If the theory is circular, the rest doesn't matter.
  $Credence \approx (a) \times (c) \times (d) \times \text{adjustment for } (b)$
  $0.75 \times 0.70 \times 0.50 = 0.26$.
  I bump this to **0.40** because even a partially circular theory can be pragmatically superior to the alternatives (AAI/Birthright), which are functionally broken.

  ---

  ### The Shakiest Term: (b) Non-Circularity

  Term **(b)** is the weak link. Defining "the practice of mutual lawmaking" without already assuming a state boundary is the philosophical bottleneck. If you define the practice by *territory*, you've smuggled in birthright/jurisdiction. If you define it by *people*, you've smuggled in AAI. Escaping the circle requires a meta-theory of jurisdiction that RCV currently lacks.

  ### The Argument That Would Move My Number

  To move my credence from **0.40 to 0.70+**, I need a **functionalist account of jurisdiction** that decouples "practice" from "state."

  **The Argument:** If you can demonstrate that "lawmaking practices" emerge organically from social cooperation (e.g., digital communities, supply chains, municipal networks) *prior* to state recognition, then the boundary isn't drawn by the state, but recognized by it. If the *demos* constitutes itself through interaction, and the state merely records that constitution, the circularity dissolves. The boundary becomes empirical (where does the cooperation stop?) rather than normative (who *should* be in?).

  ### The Friend's Objection: Exit vs. Entry

  Your friend argues the real issue is **exit**, not entry. This **does change the decomposition**, specifically lowering my credence in the necessity of RCV.

  1.  **Impact on (a):** If easy exit is available, "affectedness" becomes voluntary. If I can leave the tax zone, I am not "subjected" in the same way. This weakens the need for strict *authorship* rights. Legitimacy might be secured by exit options ( Tiebout sorting) rather than voice (co-authorship).
  2.  **Impact on (c):** If exit is the key, the distinction between residents and expats matters less than the distinction between *trapped* and *mobile* populations. RCV focuses on entry/voice, which might be solving the wrong problem.

  **Verdict:** If your friend is right, the boundary problem isn't about *who belongs*, but *how coercive the belonging is*. This shifts the solution from a **Recursive Co-Authorship View** to a **Voluntary Association View**. That would drop my overall credence in *your* specific thesis to **0.25**, because RCV is still too focused on entry/voice rather than exit/looseness.

  **The Typo:** You wrote "demos iff you're embedded in a practice... that you can actively contest." The typo isn't textual, it's theoretical: **"Can" vs. "Do."** If you mean *capacity* to contest, it's a right (unearned). If you mean *actual* contestation, it's a duty (earned). That ambiguity is hiding inside term (d).
