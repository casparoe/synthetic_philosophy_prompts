prompt: |-
  I write a column on science, memory and public argument for a national magazine, and about a year ago I let a city councilman I had interviewed talk me into serving as one of two lay members of my city's Commemoration and Naming Advisory Panel. We meet monthly, we get a case file roughly ten days in advance, we have no research staff and no budget to hire one, we may not commission polling or archival work beyond what is in the file, we must publish a one-paragraph written rationale for every recommendation, and the council treats our recommendations as binding in practice even though formally it is free to ignore them. We handle perhaps fifteen items a year: petitions to remove or relocate a statue, petitions to rename a street, a school, or a clinic, applications to install something new, and increasingly proposals that split the difference by adding an interpretive plaque or moving the object indoors. What I have discovered is that my own reactions are inconsistent in ways I could not defend in print: I argued for keeping a monument I would have wanted gone had the same person's name been on a school, and I argued for renaming a street in a case where I would have left an identical statue alone. I want to stop improvising, and I would also like to write the column about the framework rather than about my gut.

  So give me a decision procedure the panel can actually run on a case file in an afternoon: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no because the file does not support going further, and where it deliberately hands the decision to a human because the question is one of values rather than facts. A few things I want it to do, because I have become convinced they are where these cases actually turn. First, treat public commemoration as a speech act by a speaker with an audience, and give me an explicit rule for fixing the content of that act, since a bronze or a street sign has no determinate propositional content: my own candidate proxy is what a reasonably informed passerby would take away in the few seconds they give it, read alongside the dedicatory inscription and the circumstances of the original installation, and I want you to keep that proxy, replace it with a better one, or say why the attempt is misguided. Second, distinguish the available responses rather than framing everything as keep versus remove: leave as is, add context, rewrite the inscription, relocate to a museum or cemetery, remove to storage, remove and destroy, and install something new under a fixed term with a sunset clause. Third, build in the variable I have started calling compulsion, meaning how far the city forces residents to repeat the name in the course of ordinary life, which seems to me to run from school or street addresses through building names to a statue in a park that one can simply walk past, and the related variable of inescapability, since a name on a bus route or an attendance boundary is not avoidable in the way a monument is. Fourth, treat a plinth or a name as a scarce and rival resource, so that retaining is also a decision not to commemorate anyone else, and say what the procedure does with the fact that the marginal signal from yet another monument of the same kind is close to zero while the marginal signal from a renaming is not. Fifth, handle separability: the case where the honored deed is detachable from the wrongdoing, the case where the deed is constituted by it, as with discoveries that depended on coerced subjects or a fortune made in the slave trade, and the case where the point of the original installation was itself an act of intimidation rather than of honor. Sixth, tell me what to do about a name whose commemorative force has simply drained away, where no one in the neighborhood any longer knows who the person was, and about the asymmetry that removal is nearly irreversible in practice while retention imposes a continuing cost on identifiable living people. Where a step looks like a judgment call dressed up as procedure, label it as one rather than hiding it, and where the panel as a lay body should defer to someone else, say to whom.

  Then run the finished procedure on three cases, all of them composites I have built from several real disputes, so please treat the facts as given rather than as claims to check. One: an 1894 bronze in a city park, paid for by subscription among professional colleagues, honoring a surgeon whose celebrated technique he developed by operating without anesthesia on enslaved women; the plinth names only the technique; his name is also on a street and a clinic; a descendant association has petitioned for removal, the county historical society wants retention with a new plaque, and a teaching hospital has offered the piece a place in a collection. Two: a street named for a nineteenth-century textile industrialist who endowed the public library and once published a pamphlet arguing that immigrants should not vote; no living group identifies as injured by that pamphlet; nobody on the street knows who he was; renaming would cost the city about a hundred and eighty thousand dollars and force re-addressing on roughly a hundred and forty households and businesses. Three, the one I expect to argue with: the founder of the city's tuberculosis sanatorium system, credited in her own time with saving thousands of lives and the subject of an admiring column I wrote in 2019, newly documented from her own correspondence as having drafted and lobbied for the state's compulsory sterilization law, with several people sterilized under that law still alive and willing to testify. I am inclined toward retention with a large new interpretive installation, and I want to know whether the procedure underwrites me or overrules me, so commit to a verdict on each case and give your reasons instead of laying out what a panel might say. Finally, be blunt about the limits: tell me what this procedure cannot do, which of my stipulations you dropped and why, which step you are least confident in, and what would have to be true for the procedure to be giving the wrong answers systematically.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** A science/memory/public argument columnist who serves on a city Commemoration and Naming Advisory Panel.
      *   **Problem:** Inconsistent gut reactions to commemoration cases (statues, street names, etc.). Wants a structured decision procedure to replace improvisation.
      *   **Constraints/Requirements for the Procedure:**
          *   Must be runnable by lay members in an afternoon with limited files (no research staff/budget).
          *   Must treat commemoration as a *speech act* (define content).
          *   Must distinguish responses (keep, context, relocate, remove, destroy, sunset, etc.).
          *   Must account for *compulsion* (forced repetition of name) and *inescapability*.
          *   Must treat space/names as *scarce/rival resources* (opportunity cost).
          *   Must handle *separability* (deed vs. wrongdoing, intimidation vs. honor).
          *   Must handle *faded commemorative force* (nobody knows who it is) and *asymmetry* (removal irreversible vs. retention costs).
          *   Must label judgment calls vs. procedural steps.
          *   Must specify deferrals.
      *   **Task:** Create the procedure, then run it on three specific composite cases.
      *   **Output Requirements:** Commit to a verdict on each case. Be blunt about limits, dropped stipulations, confidence levels, and systematic error conditions.

  2.  **Deconstruct the Procedure Design:**

      *   *Goal:* A flowchart-like logic that filters cases from "easy keep" to "easy remove" with nuanced middle grounds.
      *   *Step 1: The Speech Act (Content Definition).* The user suggests "reasonably informed passerby." I need to refine this. It needs to account for the *original* intent vs. *current* reception. Let's call it the "Public Uptake Test."
      *   *Step 2: Compulsion & Inescapability.* This is a crucial filter. A street name is higher compulsion than a park statue. This should weight the severity of the harm.
      *   *Step 3: Separability & Origin.* Is the honor tied to the harm? Was the installation itself an act of aggression (e.g., Jim Crow statues)?
      *   *Step 4: Scarcity & Opportunity Cost.* Does keeping this block a better commemoration? Is the signal marginal (another statue) or significant (a street name)?
      *   *Step 5: Faded Force.* Does anyone care? If the name is dead, does retention still harm?
      *   *Step 6: Remedy Selection.* Matching the finding to the specific action (plaque, move, rename, etc.).
      *   *Step 7: The Human Valve.* Where do we admit we can't calculate this? (Values).

  3.  **Drafting the Procedure (Iterative Refinement):**

      *   *Refining the Speech Act:* The user's "passerby" proxy is good but needs to include the *file*. Let's stick close to their suggestion but formalize it: "The Reasonable Resident Standard."
      *   *Refining Compulsion:* Need a scale. Level 1 (Statue in park - avoidable), Level 2 (Building name - avoidable but functional), Level 3 (Street/School - unavoidable/compelled).
      *   *Refining Separability:* Need to distinguish "Tainted Achievement" (cure found via unethical means) vs. "Constitutive Harm" (wealth/power built *on* oppression) vs. "Hostile Installation" (placed to intimidate).
      *   *Refining Scarcity:* If it's a statue, keeping it denies space. If it's a street name, keeping it denies linguistic real estate.
      *   *Refining Faded Force:* If no one knows who it is, is it still speech? Yes, but low volume.
      *   *Decision Nodes:* I need clear "Stop" points. If X is true, go to Remedy Y.

  4.  **Developing the Three Cases:**

      *   *Case 1 (The Surgeon):* High harm (enslaved women), medical achievement tied to harm (constitutive/tainted), multiple commemorations (statue, street, clinic). High compulsion on street/clinic, low on statue.
      *   *Case 2 (The Industrialist):* Low harm (pamphlet, no living injured group), faded force (nobody knows him), high cost to rename (money + household burden). Low compulsion (street name is high compulsion technically, but low cognitive load if unknown).
      *   *Case 3 (The Sanatorium Founder):* High honor (saved lives), High Harm (sterilization law), Living Victims (still alive). User leans toward "Keep + Plaque." I need to test this rigorously. Compulsion is high (institution name?). Harm is active/ongoing for victims.

  5.  **Running the Procedure on Cases:**

      *   *Case 1:* The medical technique *depends* on the abuse. Separability fails. Compulsion on clinic/street is high. Verdict: Remove from clinic/street. Statue? Relocate to museum (contextualize the ethics of medicine).
      *   *Case 2:* Faded force is key. Harm is historical/abstract. Cost of change is high. Scarcity: Street names are scarce, but is *this* name doing work? No. Verdict: Keep (due to cost/faded force) OR Rename if a specific replacement is ready (scarcity argument). Actually, the procedure should weigh the "living cost" of re-addressing vs. the "symbolic cost" of the name. Given "no living group identifies as injured," the procedure likely says Keep or Add Context. Let's push for "Keep" based on the cost/benefit of faded force.
      *   *Case 3:* This is the hard one. User wants "Keep + Plaque." But there are *living victims*. Compulsion is high (sanatorium system). The harm (sterilization) is constitutive of the policy she lobbied for. Separability fails. The "speech act" is "We honor this person." If the person actively harmed living citizens, does the plaque fix it? Usually, living victims trump historical nuance. Verdict: Remove Name (from buildings/system), Relocate Statue (if exists) to museum with heavy context. I must challenge the user's inclination here.

  6.  **Addressing the "Blunt Limits" Section:**

      *   What can't this do? It can't heal trauma. It can't predict future values.
      *   Dropped stipulations? Maybe the "sunset clause" is too bureaucratic for a lay panel.
      *   Least confident step? The "Faded Force" assessment (how do we know no one knows?).
      *   Systematic error? If the panel lacks diversity, the "Reasonable Resident" becomes "Reasonable Dominant Culture Resident."

  7.  **Review against Constraints:**

      *   *Afternoon run?* Yes, needs to be checklist style.
      *   *Speech Act defined?* Yes.
      *   *Compulsion/Inescapability?* Yes, integrated into the weighting.
      *   *Scarcity?* Yes, included in the "Opportunity Cost" step.
      *   *Separability?* Yes, a specific gate.
      *   *Verdicts committed?* Yes.
      *   *Tone:* Intellectual, rigorous, matching the columnist's voice.

  8.  **Final Polish:**

      *   Ensure the distinction between "Fact" and "Value" is clear.
      *   Make sure the "Speech Act" definition is robust.
      *   Check the Case 3 verdict carefully. The user expects to argue with it. I need to be firm. If living victims exist, "context" is often insufficient because the *honor* itself is the injury.
      *   Refine the "Compulsion" metric. Street addresses are functional. Statues are expressive.
      *   Ensure the "Scarcity" point about marginal signal is clear (another statue = low signal, street name = high signal).

      *(Self-Correction during drafting Case 3)*: The user wrote a column admiring her in 2019. Now new info. She wants to keep the name with a plaque. My procedure must test if "Add Context" is sufficient when *living victims* are the counter-party. Usually, restorative justice suggests removing the honor if it glorifies the perpetrator of harm against living people. I will rule against the user's inclination but acknowledge the tension.

      *(Self-Correction on Case 2)*: Cost is high ($180k + 140 households). Harm is low (no injured group, faded). Procedure should favor status quo unless a specific replacement is waiting (Scarcity). I will rule "Keep" but note the scarcity caveat.

      *(Self-Correction on Case 1)*: Surgeon. Enslaved women. Technique *is* the harm. Clinic name = High Compulsion. Statue = Low Compulsion. Verdict: Remove from Clinic/Street. Move Statue to Museum.

  9.  **Finalizing the Text:** Structure clearly. Procedure first, then Cases, then Limits. Use bolding for steps. Maintain the columnist's analytical tone.

      *Wait, one detail:* "Remove and destroy" is an option in the prompt. I should include it but note it's rare (only for hostile installations or safety).
      *Another detail:* "Sunset clause." I'll include it for new installations as a procedural safeguard.

      *Let's refine the "Speech Act" proxy.* The user suggested "reasonably informed passerby." I will adopt this but add "in the current context" to account for changing mores.

      *Let's refine "Compulsion."* I'll create a 3-tier scale.
      1. Passive (Statue in park).
      2. Functional/Avoidable (Building name, you can choose not to enter).
      3. Compelled/Inescapable (Street address, School zone, Bus route).

      *Let's refine "Separability."*
      1. Detachable (Philanthropy separate from bad views).
      2. Constitutive (Wealth/Success built on harm).
      3. Hostile (Installed to intimidate).

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for a lay panel operating under your constraints, followed by its application to your three cases and an audit of its limitations.

  ### The Commemoration Decision Procedure (CDP)

  **Pre-Condition:** The panel confirms the file contains sufficient historical data to answer the factual questions below. If the file relies on contested historical claims (e.g., "Did he actually own slaves?"), the step is labeled **[JUDGMENT]** and requires a vote. If the file lacks data, the recommendation is *Table Until Researched*.

  #### Step 1: Define the Speech Act (Content Fixation)
  **Question:** What is the propositional content of this commemoration *today*?
  **Proxy:** The "Reasonable Resident Standard." What would a reasonably informed local resident, reading the dedicatory inscription and aware of the general circumstances of the installation, understand the city to be asserting in 10 seconds or less?
  **Sufficient Answer:** A single sentence summarizing the honor (e.g., "The city asserts X is a hero," or "The city asserts Y's contribution is worthy of emulation").
  **Stop Condition:** If the content is purely descriptive (e.g., "Battle occurred here") with no honorific element, recommend **Leave As Is** unless safety is at risk.
  **[JUDGMENT]:** Determining "reasonable" interpretation when historical context is obscure.

  #### Step 2: Assess Compulsion and Inescapability
  **Question:** How forcibly does the city require residents to interact with this name or image?
  **Scale:**
  *   **Level 1 (Passive):** Statue in a park, plaque on a wall. (Avoidable; one can walk around).
  *   **Level 2 (Functional):** Building name, room name. (Avoidable but functional; one must engage to use the service).
  *   **Level 3 (Compelled):** Street name, school name, attendance boundary, bus route. (Inescapable; residents must use the address/identifier for legal, mail, or daily life).
  **Rule:** As Compulsion Level increases, the threshold for Harm (Step 3) required to justify removal decreases. Level 3 commemorations require a higher burden of ethical purity than Level 1.

  #### Step 3: Test for Separability and Origin
  **Question:** What is the relationship between the honored achievement and the documented harm?
  **Categories:**
  *   **Detachable:** The harm is biographical but unrelated to the honor (e.g., a donor who beat their spouse but funded a library).
  *   **Constitutive:** The honor was made possible *by* the harm (e.g., wealth from slave trade, medical breakthroughs on non-consenting subjects).
  *   **Hostile:** The primary purpose of the original installation was intimidation or political dominance (e.g., Confederate monuments erected during Jim Crow to signal exclusion).
  **Stop Condition:** If **Hostile**, recommend **Remove/Relocate** immediately. Do not pass Go.
  **[JUDGMENT]:** Distinguishing "Detachable" from "Constitutive" often requires ethical reasoning, not just historical fact.

  #### Step 4: Evaluate Living Harm vs. Faded Force
  **Question A:** Are there identifiable living persons or communities actively harmed by the continued presence of this speech act?
  **Question B:** Has the commemorative force drained away? (Does the neighborhood know who this is? Does the name carry any signal at all?)
  **Rule:**
  *   If **Living Harm** exists: Retention imposes a continuing cost. The burden of proof shifts to retentionists to show why the honor outweighs the injury.
  *   If **Faded Force** is total (nobody knows the name) AND **Living Harm** is absent: The marginal signal is zero. Retention is inert. Removal is low-cost symbolically but may have high administrative costs.
  **Asymmetry Check:** Removal is irreversible. Retention is reversible (mostly). If Living Harm is present, irreversibility of removal is less weighty than the reversibility of the harm caused by retention.

  #### Step 5: Scarcity and Opportunity Cost
  **Question:** Does retaining this item block a specific, viable alternative commemoration?
  **Rule:**
  *   **Statues/Plinth:** Space is rival. Keeping a marginal statue denies space for a new one.
  *   **Street/Building Names:** Linguistic real estate is rival. Keeping a "zero signal" name prevents a "high signal" name.
  *   **Marginal Signal:** If the object is one of fifty similar statues (e.g., another generic founder), its marginal value is low. If it is a unique street name, its marginal value is high.
  **[JUDGMENT]:** Determining if a "better" candidate exists is political, not procedural. The panel should only note if *a* candidate exists, not rank them.

  #### Step 6: Select Remedy
  Match the findings to the least intrusive effective remedy.
  *   **Leave As Is:** No Living Harm, Detachable harm, or Faded Force with high removal cost.
  *   **Add Context (Plaque/Installation):** Detachable harm OR Constitutive harm where the object itself is historically significant (e.g., the actual surgical tool), provided Compulsion is Level 1 or 2. **Not sufficient for Level 3 with Living Harm.**
  *   **Relocate (Museum/Cemetery):** Constitutive harm or Hostile origin, where the object has artifactual value but should not honor in public space.
  *   **Remove to Storage:** Hostile origin with no artifactual value, or Level 3 Compulsion with Living Harm.
  *   **Remove and Destroy:** Rare. Only if the object itself is dangerous (e.g., structurally unsound) or its existence constitutes a continuing hate crime (extremely high bar).
  *   **Sunset Clause:** For *new* installations only. Not a remedy for existing disputes.

  #### Step 7: The Human Valve
  **Question:** Does this decision require weighing incommensurable values (e.g., "Is medical progress worth the suffering of the few?")?
  **Rule:** If yes, the panel must explicitly state: *"This recommendation rests on a value judgment regarding [Value A] vs. [Value B], not on historical fact."* The panel defers to the Council only on this specific value weighting if the panel is deadlocked, but must record the dissent.

  ---

  ### Application to Cases

  #### Case 1: The Surgeon (1894 Bronze, Street, Clinic)
  **Facts:** Technique developed via non-consensual surgery on enslaved women. Name on Street (Level 3), Clinic (Level 2), Statue (Level 1). Living descendant association petitioning. Historical society wants plaque. Hospital offers museum home.

  **Procedure Run:**
  1.  **Speech Act:** "The city honors this surgeon's medical innovation."
  2.  **Compulsion:** Clinic (Level 2), Street (Level 3), Statue (Level 1).
  3.  **Separability:** **Constitutive.** The technique *is* the result of the harm. You cannot separate the celebrated method from the unethical means.
  4.  **Living Harm:** Descendant association identifies injury.
  5.  **Scarcity:** Clinic name blocks naming for a benefactor or victim group. Street name blocks other historical figures. Statue blocks park space.
  6.  **Remedy Selection:**
      *   *Clinic/Street:* Level 2/3 Compulsion + Constitutive Harm + Living Harm. **Add Context is insufficient.** The city cannot compel citizens to use the name of someone whose honor is constituted by abuse. **Verdict: Remove Name.**
      *   *Statue:* Level 1 Compulsion. Artifactual value to medical history. **Verdict: Relocate to Museum.**
  **Panel Recommendation:** Remove name from Clinic and Street. Relocate statue to the teaching hospital's collection with an interpretive exhibit detailing the ethics of the technique.
  **Reasoning:** The "Constitutive" finding kills the "Keep" option for high-compulsion assets. A plaque on a clinic where patients must check in under the name of their oppressor fails the Living Harm test.

  #### Case 2: The Industrialist (Street Name)
  **Facts:** Endowed library, published anti-immigrant voting pamphlet. No living injured group. Nobody knows who he is. Renaming costs $180k + 140 re-addressings.

  **Procedure Run:**
  1.  **Speech Act:** "The city honors this industrialist's civic contribution."
  2.  **Compulsion:** Street Name (Level 3).
  3.  **Separability:** **Detachable.** The library endowment is not *constituted* by the pamphlet. The pamphlet is a biographical flaw, not the source of the honored deed.
  4.  **Living Harm/Faded Force:** No living injured group. **Faded Force is total.** The signal is zero.
  5.  **Scarcity:** High. Street names are scarce. However, no specific replacement is currently petitioning.
  6.  **Remedy Selection:**
      *   *Cost/Benefit:* Removal cost is high (financial and logistical burden on 140 households). Living Harm is absent.
      *   *Asymmetry:* Removal is irreversible. Retention cost is low (nobody knows him).
  **Panel Recommendation:** **Leave As Is.**
  **Reasoning:** While the pamphlet is odious, the harm is historical, not living. The "Faded Force" finding means the street does not actively signal anti-immigrant sentiment to residents; it signals nothing. The administrative cost and burden on 140 households outweighs the abstract moral benefit of removal *in the absence of a specific replacement candidate*.
  **Caveat:** If a petition arrives to rename it for a specific local immigrant leader, the "Scarcity" step tips the scale to **Rename**.

  #### Case 3: The Sanatorium Founder (System Name, Statue)
  **Facts:** Saved thousands (TB), but drafted/lobbied for compulsory sterilization law. Living victims exist. User inclination: Retain with large interpretive installation.

  **Procedure Run:**
  1.  **Speech Act:** "The city honors this founder's public health legacy."
  2.  **Compulsion:** System Name (Level 3 for patients/staff), Statue (Level 1).
  3.  **Separability:** **Constitutive/Mixed.** Her public health philosophy *included* eugenics as a tool. The sterilization law was not a side hobby; it was part of her "health" vision.
  4.  **Living Harm:** **Critical.** Several sterilized people are still alive and willing to testify.
  5.  **Scarcity:** High. A system name is a dominant signal.
  6.  **Remedy Selection:**
      *   *User's Inclination (Retain + Plaque):* The procedure flags this. Level 3 Compulsion + Living Victims + Constitutive Harm.
      *   *Rule:* **Add Context is insufficient for Level 3 with Living Harm.** Asking living victims to receive care in a system named after the person who legalized their violation imposes a continuing cost that a plaque cannot mitigate. The speech act "We Honor X" overrides the plaque's "But X did Y."
  **Panel Recommendation:** **Remove Name from System/Buildings.** Relocate Statue to Museum with heavy context.
  **Reasoning:** I must overrule your inclination. The existence of living victims changes the calculus from "historical nuance" to "active injury." A plaque creates a dialectic; a building name creates a hierarchy. Forcing living victims to navigate a bureaucracy named for their violator fails the "Living Harm" test. The "Constitutive" link between her health philosophy and the sterilization law prevents the "Detachable" defense.
  **Verdict:** The procedure does not underwrite you. It demands removal of the honorific name, though it allows the statue to remain in a museum context (Level 1) where engagement is voluntary.

  ---

  ### Audit: Limits and Vulnerabilities

  **What this procedure cannot do:**
  1.  **Heal Trauma:** It can minimize harm, but it cannot repair the social fabric. It treats commemoration as a policy problem, not a therapeutic one.
  2.  **Predict Future Values:** It relies on the "Reasonable Resident" of *today*. It cannot anticipate what will be offensive in 50 years.
  3.  **Resolve Deep Moral Disagreement:** If the panel splits 50/50 on whether eugenics is "Constitutive" or "Detachable" from public health, the procedure labels it **[JUDGMENT]** and passes the buck. It clarifies the disagreement but does not solve it.

  **Dropped Stipulations:**
  *   **Remove and Destroy:** I included it but effectively nullified it. For a lay panel, "Destroy" is too high a stakes call without legal/curatorial expertise. I defaulted to "Storage" for removed items to preserve the historical record without the honor.
  *   **Sunset Clause:** I restricted this to *new* installations. Applying sunsets retroactively to old monuments creates administrative chaos and devalues the "Speech Act" stability required for public memory.

  **Least Confident Step:**
  *   **Step 4 (Faded Force):** Determining if "nobody knows who he was" is empirically difficult without polling (which you cannot commission). The panel must rely on anecdotal evidence from the file. This is the weakest link; a name might be "faded" to the panel but deeply symbolic to a small, unrepresented group.
      *   *Fix:* Require the file to include a statement from the neighborhood council or HOA regarding name recognition.

  **Systematic Error Conditions:**
  The procedure will give the wrong answers systematically if:
  1.  **The "Reasonable Resident" is not representative.** If your panel and your city's "informed public" are demographically homogenous, the "Speech Act" definition will default to dominant culture norms, missing coded harms (like Case 2's pamphlet).
  2.  **Cost is weighted too heavily.** In Case 2, I prioritized the $180k cost over the moral stain. If the city is wealthy, that cost is negligible. The procedure needs a "City Budget Capacity" modifier. If the city can afford it easily, the cost argument collapses.
  3.  **Living Harm is under-counted.** If the file does not surface living victims (because they are marginalized and not in the room), the procedure defaults to "Keep." The panel must actively seek out potential living harm, not just wait for petitions.

  **Final Note for your Column:**
  The value of this procedure is not that it produces "correct" answers, but that it forces inconsistencies into the open. When you argue for keeping the Surgeon's statue but renaming the Street, the CDP forces you to admit that you are weighing *Compulsion* higher than *Honor*. When you argue for the Sanatorium Founder, the CDP forces you to admit you are weighing *Historical Complexity* higher than *Living Dignity*. That is the column: not the verdict, but the admission of what value you sacrificed to reach it.
