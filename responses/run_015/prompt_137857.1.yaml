  5.  **Final Polish:** Check tone. Ensure no citations. Ensure the "One Disagreement" is named clearly. Ensure the brainstorming section is distinct and rough.

      *(Self-Correction on Tone)*: Make sure I sound like the mediator, not just a scribe. "I have mediated enough of these to know..." "Don't try to sneak 'defeasibility' in as 'certainty'..."

      *(Self-Correction on Verbal Dispute)*: I need to take a stand. I think the "Having vs Giving" is partly verbal but masks a real modal disagreement. I will argue that the *status of the baseline* is the real disagreement.

