      *   **Phenomenon:** Simpson's Paradox (reversal of association upon conditioning).
      *   **Causal Structure:** Randomisation $\to$ Treatment (A/B). Treatment $\to$ Toxicity $\to$ Completion (Post-treatment variable). Completion $\to$ Mortality. Also Treatment $\to$ Mortality.
