answer: |-
  **Arithmetic Check (Grader's Notes):**
  *   **Overall:** A = 190/1000 (19%); B = 140/1000 (14%). **A > B** (A has higher mortality).
  *   **Completers:** A = 30/600 (5%); B = 90/900 (10%). **A < B** (A has lower mortality).
  *   **Stopped:** A = 160/400 (40%); B = 50/100 (50%). **A < B** (A has lower mortality).
  *   **Reversal:** Confirmed. Overall A is worse, but within strata A is better.
  *   **Weights:** Arm A is 60% completers; Arm B is 90% completers. Arm A has more weight on the high-mortality "Stopped" stratum.
  *   **Part (d) Check:** If proportions were equal (e.g., 75% completers in both), the overall risk would be a weighted average with identical weights. Since A is better in *both* strata, A would necessarily be better overall. Reversal is mathematically impossible with equal weights. Student is incorrect.

  ***

  **Feedback for Student:**

  **(a) Show that the direction of the comparison reverses...**
  **Status: Correct.**
  You have correctly identified the rates in the overall population and within both strata. You clearly demonstrate that while Arm A has higher overall mortality (19% vs 14%), it has lower mortality within both the "Completers" and "Stopped early" groups. This accurately demonstrates the reversal.

  **(b) Explain in a sentence or two how that is arithmetically possible.**
  **Status: Correct.**
  Your explanation of the weighted average mechanism is accurate. You correctly identify that the stratum sizes (weights) differ substantially between arms (600/400 vs 900/100) and that Arm A's overall rate is dragged up because a larger proportion of its patients fall into the high-mortality "Stopped early" stratum. This is the standard arithmetic explanation for Simpson's Paradox.

  **(c) A hospital guideline committee has to recommend one of the two regimens...**
  **Status: Incorrect / Conceptually Flawed.**
  This is the most critical part of the question, and the recommendation here is unsafe.
  *   **The Error:** You recommend relying on the disaggregated (stratified) comparison. In a randomised trial, "completion" is a **post-randomisation variable** influenced by the treatment (via toxicity). Conditioning on it introduces **selection bias** (or collider bias). The randomisation guarantees balance only at baseline, not within subgroups defined by post-treatment events (as evidenced by the completion rates: 60% in A vs 90% in B).
  *   **The Causal Principle:** For a policy recommendation, the committee needs the **Intention-to-Treat (ITT)** estimate (the overall 19% vs 14%). This captures the *total effect* of assigning the regimen, including the risk that patients might stop early due to toxicity. The stratified analysis answers a different, biased question ("What if we could force completion?").
  *   **Specific Claim:** Your statement that "because assignment was randomised, we dont have to worry that the subgroup comparisons are confounded" is false. Randomisation protects against confounding of the *treatment assignment*, but it does not protect against bias introduced by conditioning on intermediates or colliders.

  **(d) Could this kind of reversal happen even if both arms had the same proportion of completers?**
  **Status: Incorrect.**
  *   **The Math:** The answer is **No**. Simpson's Paradox relies on the weights (proportions in each stratum) differing between groups. If both arms had the same proportion of completers (e.g., 75%), the overall risk would be the same weighted average of the stratum-specific risks for both arms. Since A is better in both strata, it would mathematically have to be better overall.
  *   **Your Reasoning:** You claimed the reversal comes from rates "rather than the weights." This is the opposite of the truth; the reversal is *entirely* driven by the interaction between the rates and the unequal weights.

  **Summary:**
  You have a strong grasp of the arithmetic mechanics of Simpson's Paradox (parts a and b). However, you have not successfully applied the causal inference concepts regarding post-randomisation variables and Intention-to-Treat analysis (part c), and you have a misunderstanding of the mathematical conditions required for the paradox to occur (part d). In evidence-based medicine, distinguishing between the arithmetic association and the causal effect of assignment is the primary learning objective.

  **Mark: 10/20**

  *   (a) 4/4
  *   (b) 4/4
  *   (c) 2/8 (Credit for identifying completion as a predictor; major deduction for incorrect causal recommendation and misunderstanding of randomisation limits).
  *   (d) 0/4
