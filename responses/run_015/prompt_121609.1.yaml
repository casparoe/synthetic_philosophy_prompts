              *   *Causal Inference Principle:* Completion is a *post-randomisation* variable influenced by treatment (toxicity). Conditioning on it opens a collider path or blocks a mediator path, inducing selection bias. It destroys the randomisation balance within strata.
              *   *Intention-to-Treat (ITT):* In a pragmatic trial, the policy question is "What happens if we assign A vs B?" not "What happens if we assign A vs B *and* force completion?" The overall risk (19% vs 14%) captures the *total effect* of the assignment, including the effect mediated through toxicity/dropout.
