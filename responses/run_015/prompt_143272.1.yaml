prompt: |-
  what should a theory of rational deference to objective chance actually be able to do? i want the full desiderata list, not just a restatement of the principal principle. include: the cases it has to get right (like learning the law without the outcome, or finding out the reference class was wrong, or being inside the system that generates the chances), the distinctions it cant collapse (first-order vs second-order chance, knowing the law vs knowing you're applying it to the right domain), and any hard constraints from physics or decision theory it cant violate. also flag if some subset is jointly unsatisfiable -- especially around avoiding bootstrap problems while still allowing belief revision when you discover the chance setup was misdescribed. which one requirement kills off the most popular accounts? table's fine, but keep the weight on the criteria, not on scoring lewis-style or frequentist alternatives.
