answer: |-
  A robust theory of rational deference to objective chance must do more than state that credence should track chance (the Principal Principle). It must function as a bridge law between metaphysics (what chance *is*) and epistemology (how we *believe*). It needs to survive cases where our evidence is incomplete, our models are wrong, and the future is open.

  Below is the full desiderata list, organized by function, followed by the specific tensions and the "killer" constraint that eliminates the most common accounts.

  ### I. The Desiderata List

  | Category | Requirement | Description & Rationale |
  | :--- | :--- | :--- |
  | **Normative Core** | **Generalized Deference** | Must prescribe credence $C(A \mid Ch(A)=x) = x$ *ceteris paribus*, but generalized to handle uncertainty about the chance function itself. It cannot require logical omniscience about what the chances are. |
  | | **Action-Guidance** | Deference must translate to decision theory. If $Ch(A)=x$, a rational agent must accept bets on $A$ at odds $< x$. If the theory doesn't license betting behavior, it fails as a guide to action. |
  | **Epistemic Access** | **Fallible Identification** | Agents rarely know $Ch$ directly. The theory must handle $C(A \mid E)$ where $E$ suggests $Ch(A)=x$, but $Ch$ might actually be $y$. It must allow belief revision when the *model* of the chance setup is corrected. |
  | | **Admissibility Filter** | Must distinguish information that is "admissible" (about the past/law) from "inadmissible" (about the future outcome). It must explain *why* crystal ball gazing overrides chance, while physical history does not. |
  | | **Second-Order Chance** | Must handle uncertainty about the chance function (e.g., "There is a 70% chance this coin is biased"). The theory must aggregate these higher-order chances into a first-order credence without collapsing the distinction. |
  | **Metaphysical** | **Non-Supervenience on Current State** | Must accommodate chances that do not supervene on the current physical state (e.g., Humean Best Systems where future frequencies determine present chance). The theory cannot break if the "truth" about chance lies partly in the future. |
  | | **Single-Case Applicability** | Must apply to singular events (this specific decay, this specific toss), not just long-run frequencies. A theory that only works for ensembles fails the decision-theoretic constraint for individual agents. |
  | **Dynamic/Revisionary** | **Model Correction** | If an agent learns the reference class was wrong (e.g., "This isn't a fair coin, it's a trick coin"), credence must update to the new chance, not stay fixed on the old deference. |
  | | **Law Discovery** | If an agent learns the probabilistic law without seeing the outcome (e.g., learning QM is true), credence must align with the new law immediately, not wait for empirical frequency data. |
  | **Structural** | **Indexical Consistency** | Must handle self-locating beliefs (being *inside* the system). If the chance setup involves the observer's existence or location (e.g., Quantum Immortality, Sleeping Beauty), deference must not lead to Dutch Books. |
  | | **No Bootstrap** | The definition of chance cannot be circular (i.e., Chance is not *defined* as what we defer to). There must be a fact of the matter about chance independent of our credence, to which we can be wrong. |

  ---

  ### II. Critical Distinctions The Theory Cannot Collapse

  A successful theory must maintain the following separations. Collapsing them leads to subjectivism or fatalism.

  1.  **First-Order vs. Second-Order Chance:**
      *   *The Distinction:* $Ch(A)=x$ is a fact about the world. $C(Ch(A)=x) = y$ is a fact about the agent's confidence in that fact.
      *   *The Trap:* Simple PP formulations assume the agent knows $Ch$. A robust theory must show how to integrate over a distribution of possible chance functions: $C(A) = \sum C(A \mid Ch_i) \cdot C(Ch_i)$.
  2.  **Knowing the Law vs. Knowing the Domain:**
      *   *The Distinction:* I might know the physics (the law says biased coins land heads 70%), but misidentify the object (I think this is a biased coin, but it's actually a two-headed coin).
      *   *The Trap:* Deference must be to the chance *of the actual setup*, not the *assumed setup*. If I discover the domain application was wrong, deference must switch to the new objective chance, not remain loyal to the old law I believed in.
  3.  **Ontic Chance vs. Epistemic Probability:**
      *   *The Distinction:* Objective chance is a feature of the territory; credence is a feature of the map.
      *   *The Trap:* The theory cannot reduce chance to "idealized credence." If it does, it violates the **No Bootstrap** constraint. There must be a gap between what the chance *is* and what we *believe it is*.

  ---

  ### III. Hard Constraints (Physics & Decision Theory)

  1.  **The No-Signaling Constraint (Physics):**
      *   Deference to quantum chances cannot allow for superluminal communication. If updating credence based on chance assignments allowed an agent to infer a distant measurement setting instantly, the theory violates relativity. The theory of deference must be compatible with the no-communication theorem.
  2.  **The Dutch Book Constraint (Decision Theory):**
      *   If an agent defers to chance according to the theory, they must not be susceptible to a synchronic or diachronic Dutch Book.
      *   *Specific Failure Mode:* If the theory says "Defer to $Ch$" but also "Update on Evidence $E$," and $Ch$ and $E$ conflict (e.g., $E$ is inadmissible info about the future), the agent can be pumped for money. The theory must define the hierarchy of authority between Chance and Evidence.
  3.  **The Supervenience Constraint (Metaphysics):**
      *   If one adopts a Humean view, chances supervene on the total history of the world. The theory of deference must not require the agent to know the *entire* future history to set present credence. It must provide a proxy for chance that is accessible now.

  ---

  ### IV. The Joint Unsatisfiability Flag (The "Impossible Trinity")

  There is a specific triad of requirements that appears jointly unsatisfiable in many frameworks. A theory must explicitly sacrifice or modify one to survive.

  1.  **Direct Deference:** $C(A \mid Ch(A)=x) = x$ (Credence equals chance directly).
  2.  **Fallibilism:** It is possible for the agent to be wrong about what the chance function is (or for the chance function to depend on future events they don't know).
  3.  **No-Undermining:** Present credence should not undermine the truth of the chance function itself (i.e., assigning credence $x$ shouldn't make it the case that the chance is *not* $x$).

  **The Conflict:**
  If chances are Humean (dependent on future frequencies), then knowing the present chance gives you information about the future. If you defer directly (1), your credence affects the probability of the future history. If that future history determines the chance (2), your credence can make the chance statement false (Undermining).
  *   *Lewis's Solution:* Sacrifice **Direct Deference**. Replace PP with the "New Principle" ($C(A \mid Ch(A)=x) = x / (1-Ch(\text{undermining}))$).
  *   *Alternative:* Sacrifice **Humean Supervenience** (make chances non-reductive propensities).
  *   *Alternative:* Sacrifice **Fallibilism** (claim we can never know chances, only evidence).

  **The Bootstrap Tension:**
  You requested a flag on **Avoiding Bootstrap vs. Allowing Belief Revision**.
  *   *Requirement:* Chance must be independent of credence (No Bootstrap).
  *   *Requirement:* Credence must update when we realize our chance-model was wrong (Belief Revision).
  *   *Tension:* If chance is totally independent, how do we ever identify it to defer to it? If we identify it via our best theory, and the theory changes, did the *chance* change or just our *access*?
  *   *Resolution:* The theory must treat chance as a **rigid designator** of a functional role. We defer to "whatever property plays the chance role in the true physics." When physics updates, we don't change the definition of chance; we change our identification of which physical property fills that role.

  ---

  ### V. The "Killer" Requirement

  Which single requirement kills off the most popular accounts?

  **The Requirement of Single-Case Deference under Fallible Access.**

  *   **Why it kills Frequentism:** Frequentism defines chance as long-run relative frequency. It cannot assign a meaningful chance to a single, non-repeatable event (e.g., "The chance this specific president is re-elected"). Therefore, it cannot guide single-case betting, violating the **Action-Guidance** constraint.
  *   **Why it kills Simple Subjectivism:** If chance is just "my degree of belief," you cannot be wrong about it. This violates the **No Bootstrap** and **Belief Revision** constraints. You cannot discover you were wrong about the chance if the chance *is* your belief.
  *   **Why it kills Lewis's Original Principal Principle:** As noted above, it fails the **No-Undermining** constraint in Humean worlds. If the future determines the chance, and your credence informs the future, the original PP leads to inconsistency.
  *   **Why it kills Naive Propensity:** Propensity theories often struggle to explain *why* we should defer to them (the **Action-Guidance** link). Unless the propensity is defined functionally as "that which guides credence," the link is mysterious. If it *is* defined that way, it risks collapsing into subjectivism (Bootstrap).

  **Summary:** The hardest hurdle is constructing a theory where **Chance is Objective (Mind-Independent)** but **Deference is Rational (Mind-Dependent)** without requiring the agent to have God's-eye access to the future or the laws. The theory must explain how a finite agent, embedded in the system, with a potentially flawed model of the physics, is nonetheless normatively bound by a chance function they cannot fully verify.
