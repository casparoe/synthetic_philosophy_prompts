      *   Ensure the distinction between *causal* responsibility and *moral* responsibility is clear.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I answer the specific question about the formal model? *Yes, need to emphasize that models describe structure, not norms.*
      *   *Check:* Did I address the "hidden empirical" aspect? *Yes, the link between interpretability and control.*
