      *(Refining the "Collapse" section)*: The prompt worries that "non-negotiable" reduces to "unreflective." I need to acknowledge that if negotiability is just meta-cognition, then simple systems suffer by default. The dissertation must argue that suffering requires a *specific* kind of grip, not just lack of meta-cognition.

      *(Final check on constraints)*: No citations. Two pages (visual estimation).

