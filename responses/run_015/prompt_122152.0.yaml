      *   **The Vulnerability:** The "Non-Negotiable" trap. If non-negotiable just means "cannot reflect," then a thermostat suffers. If it means "cannot reflect *and* is conscious," we beg the question. Need to thread this needle.
      *   **Method:** Conceptual analysis of system architectures. Not measuring outputs, but analyzing the *structure of the objective*.
      *   **Case Studies:**
          1.  *Reward Hacking:* The agent that wires its own reward. High valence, zero negotiability (it's stuck in a loop).
          2.  *RLHF:* The LLM tuned by human preference. Aversive signals (downvotes/loss) are external. Can it reframe them?
      *   **Outcomes:** Success = A taxonomy of machine states based on negotiability. Failure = Collapsing back into "we don't know if it feels." Unmanageable = Trying to define negotiability too broadly.

  4.  **Refining the Tone and Length:**
