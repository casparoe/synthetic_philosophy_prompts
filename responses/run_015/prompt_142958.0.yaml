prompt: |-
  I sit on a grant panel that funds field work in animal behaviour, and a large share of the proposals we read contain the same move somewhere in the background section: some trait — a patch of colour, a call, a bout of vigilance, an unwieldy structure — is described as a costly signal, and its cost is said to be what makes it honest. The move is load-bearing. It is what licenses treating the trait as an adaptation for communication rather than as a weapon, a byproduct, a cue, or a symptom, and it usually arrives with no more support than the observation that the trait is expensive or risky to have. Expensiveness alone does not separate types: a cost that every individual pays equally, however large, tells a receiver nothing. But we have no shared standard for when the claim has been earned, and I would like one before the next round.

  Please write me the specification I should be applying when a proposer claims that trait T in species S is maintained as a costly signal of quality Q. That is: the requirements a case must meet before the claim is anything more than a just-so story, each with the case or consideration that motivates it, sorted into what is non-negotiable, what is a strong presumption that can be rebutted with argument, and what is merely the taste of one research tradition. The purpose is fixed, so please keep it in view: this is an evidential standard for empirical claims about particular traits, not a general theory of communication, and "adequate" means adequate to license the word *signal* in that case — as against cue, index, armament, or epiphenomenon.

  These are the demands I keep half-formulating and then abandoning, to show you where I am stuck. I would rather you rebuilt the list than annotated mine, but I want your criteria to be answerable to them:

  - Not "the trait is expensive" but "the extra cost of a somewhat larger or more intense trait is smaller for a higher-quality individual" — the graded or single-crossing condition that the strategic models place at the centre. A flat tax on all bearers cannot separate types.
  - Costs counted at the margin of the signalling act, so that a cost the animal would incur anyway — a display given from a perch it would occupy regardless, a migration route that doubles as an advertisement — cannot be charged to the signal.
  - A currency requirement: the cost must be one that Q genuinely makes cheaper to bear, so that the link between quality and cost runs through Q rather than through some third variable that happens to correlate with it.
  - A declaration of which cost mechanism is being posited: production cost, receiver-imposed or social cost, or vulnerability cost such as attraction of predators — since these make different predictions when receivers are experimentally removed.
  - A timing condition: whether the cost must be realised at the point of the receiver's decision, or whether a cost that is merely pledged and falls due later does the same work.
  - A receiver-side requirement: that someone actually reads the trait, that the reading feeds back onto the signaler's fitness, and that the response is not better explained by a preference that predates the trait.
  - An alternative-hypotheses requirement: why the trait is not a weapon or a direct fitness benefit, and why a cheaper equivalent producing the same response has not invaded.
  - A say-which-it-is requirement: is the trait mechanically tied to Q, in which case the machinery of cost is idle and the evidentiary burden shifts to the mechanism, or is it conventional and cost-maintained?

  Test the list on three composite cases from the current round, since a standard that cannot decide cases is not one:

  (1) A lizard in which males develop a carotenoid-based throat patch, drawn from stores that depend on foraging success and parasite load, only in wet years; the display is performed from basking rocks that males occupy irrespective of patch size; patched males receive more attacks from territory holders; females prefer larger patches; and females of a closely related species lacking the patch also prefer blue-baited models.

  (2) A fish with male parental care in which the courtship display itself is cheap, but displaying commits the male to weeks of egg-guarding during which he loses substantial mass and runs elevated predation risk — a cost that falls due only if the female accepts him, and that he could in principle escape by deserting afterwards.

  (3) A bird whose dawn chorus costs every male, in every condition, roughly the same four per cent of body mass per morning.

  Two further things matter more to me than the list itself. First: which of the things people demand in this area are genuine desiderata and which are inherited rhetoric — in particular whether the cost has to be *wasteful*, something that lowers fitness with no compensating return, or whether that is Zahavi's polemical framing rather than a result, and whether full separation is required or reliability on average is enough. Second: whether some subset of the requirements is jointly unsatisfiable, in which case that is itself the finding I want. My suspicions are that a requirement that the signal mean the same thing across habitats and seasons cannot be met jointly with the fact that costs are context-dependent, and that a requirement of unfakeability by construction cannot be met jointly with one of evolutionary flexibility plus affordability for the lowest-quality bearer; tell me if these are right and whether there are better ones.

  Finally, name the single requirement that does the most work in excluding candidate traits, and — in a few lines only, since the criteria are the deliverable and not the scorecard — say how the main families of account in the area fare: Zahavi's original handicap principle, the Grafen-style strategic models, the index or mechanical-constraint approach, and the results showing that honesty can be stable without cost when interests partly coincide.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **User:** A grant panelist funding animal behaviour fieldwork.
      *   **Problem:** Too many proposals claim a trait is a "costly signal" based merely on expensiveness/risk, without rigorous justification. This licenses treating the trait as communication rather than a cue, weapon, or byproduct.
      *   **Task:** Create a specification (evidential standard) for claiming Trait $T$ in Species $S$ is a costly signal of Quality $Q$.
      *   **Structure:**
          *   Categorized requirements (Non-negotiable, Strong Presumption, Research Tradition/Taste).
          *   Motivations for each requirement.
          *   Test the specification against three composite cases (Lizard, Fish, Bird).
          *   Address two meta-questions: (1) Waste vs. Cost (Zahavi's rhetoric) & Separation vs. Average Reliability; (2) Unsatisfiable subsets of requirements (trade-offs).
          *   Identify the single most exclusionary requirement.
          *   Briefly evaluate main theoretical families (Zahavi, Grafen, Index, Partial Coincidence) against this standard.
      *   **Tone:** Rigorous, precise, philosophical but practical (grant panel context), avoiding unnecessary jargon where possible but respecting the technical depth.
      *   **Constraints:** Do not just annotate the user's draft list; rebuild it. Keep the purpose fixed (licensing the word *signal*).

  2.  **Deconstruct the User's Draft List & Theoretical Background:**
      *   *User's points:* Marginal cost (single-crossing), marginal accounting (opportunity cost), currency linkage (Q reduces cost), cost mechanism declaration, timing (pledged vs. realized), receiver response (fitness feedback), alternative hypotheses (weapon/cue), index vs. signal distinction.
      *   *Theoretical Context:*
          *   **Zahavi (Handicap):** Cost must be wasteful/detrimental to ensure honesty.
          *   **Grafen (Strategic Models):** Formalized Zahavi. Requires differential cost (single-crossing condition).
          *   **Index/Mechanical Constraint:** Trait is physically linked to quality (unfakeable), cost is secondary or irrelevant to honesty.
          *   **Partial Coincidence of Interest (e.g., Godfray, Bergstrom):** Honesty can be maintained without cost if sender/receiver interests align enough.
      *   *Key Distinction:* Signal (evolved to convey info) vs. Cue (info extracted but not evolved for that) vs. Index (physically constrained) vs. Weapon (direct fitness effect).

  3.  **Drafting the Specification (Iterative Process):**

      *   *Category 1: Non-Negotiable (The "Must-Haves" for the label "Costly Signal").*
          *   If it's not read by a receiver, it's not a signal. (Receiver Response).
          *   If the cost doesn't vary by quality, it doesn't enforce honesty. (Differential Cost).
          *   If the cost isn't actually paid (or pledged) in a way that affects fitness, it's not a handicap. (Fitness Consequence).
          *   Need to rule out "Index". (Fakeability).
      *   *Category 2: Strong Presumption (Rebuttable).*
          *   Marginal accounting (is the cost *of the signal* or just *of living*?).
          *   Mechanism specificity (production vs. social).
          *   Separation vs. Pooling (Does it need to fully separate types?).
      *   *Category 3: Research Tradition (Taste/Specific Models).*
          *   "Waste" (Zahavi's specific framing vs. net fitness).
          *   Timing (immediate vs. delayed).

      *Refining the "Non-Negotiables":*
      1.  **Receiver Dependence:** The trait must elicit a specific response that affects signaler fitness. (Rules out cue/byproduct).
      2.  **Differential Marginal Cost:** The cost of increasing the signal must be lower for high $Q$ than low $Q$. (Rules out flat tax).
      3.  **Fakeability:** It must be physiologically possible for a low $Q$ individual to produce the trait, but they don't because of the cost. (Rules out Index).
      4.  **Net Cost:** The signal must impose a net fitness cost *conditional on the response* (or at least, the cost is the mechanism of honesty, not just a byproduct). *Wait, this is tricky.* If the benefit outweighs the cost, it's still a signal. The *cost* must be real, even if net fitness is positive. Let's phrase it as "Fitness Consequence."

      *Refining the "Strong Presumptions":*
      1.  **Marginal Accounting:** Costs must be attributable to the signal, not background maintenance.
      2.  **Alternative Exclusion:** Must show it's not a weapon or direct benefit.
      3.  **Currency Link:** The quality $Q$ must be what mitigates the cost.

      *Refining the "Tradition":*
      1.  **Waste:** Does it need to be wasteful? No, just costly *marginaly*.
      2.  **Perfect Separation:** Not needed, statistical reliability is enough.

  4.  **Testing Against Cases:**

      *   *Case 1 (Lizard):* Carotenoid patch.
          *   Receiver? Yes (females prefer, males attack).
          *   Differential Cost? Yes (foraging/parasite load affects stores).
          *   Fakeable? Yes (carotenoids can be eaten, not mechanically tied).
          *   Issue: Females of related species prefer it too. Suggests pre-existing bias (Sensory Exploitation). Does this kill the "Signal" claim? It complicates the *evolutionary origin*, but not necessarily current maintenance. However, the "basking rock" issue suggests the *display* cost might be zero (marginal accounting).
          *   *Verdict:* Fails Marginal Accounting on the display, passes on the patch production. The "related species" bit suggests Cue/Index origins, but current maintenance could be signal. Needs more work on the *cost of the patch* vs. *cost of foraging*.
      *   *Case 2 (Fish):* Cheap display, expensive guarding.
          *   Receiver? Yes (female accepts).
          *   Differential Cost? Guarding is costly. Is it *differential*? High quality males might guard better/cheaper? The prompt says "loses substantial mass". If low quality males desert, is that a cost?
          *   Timing: Cost falls *after* acceptance. This is a "Pledged Cost".
          *   Fakeability: Can a low quality male display and then desert? If yes, the signal is fakeable unless there's a social cost to desertion.
          *   *Verdict:* This is a "Commitment Signal". It passes if desertion is punished or physiologically impossible. If desertion is easy and cost-free, it's bluffing. The specification needs to handle delayed costs.
      *   *Case 3 (Bird):* Dawn chorus, flat 4% cost.
          *   Differential Cost? **No.** "Costs every male... roughly the same".
          *   *Verdict:* Fails Non-Negotiable #2 (Differential Marginal Cost). It cannot be a costly signal of quality under the Grafen/Zahavi definition. It might be a signal of presence (unfakeable by virtue of being alive?), but not quality.

  5.  **Addressing Meta-Questions:**
      *   *Waste:* Zahavi's "waste" is rhetorical. Net fitness can be positive. The cost must be *marginal* and *differential*, not necessarily net negative.
      *   *Separation:* Perfect separation is rarely found. Statistical correlation (reliability) is sufficient.
      *   *Unsatisfiable Subsets:*
          *   Context-dependence vs. Fixed Meaning: Costs *are* context-dependent. A signal cannot mean the exact same thing across all contexts if the cost structure changes. The requirement should be "reliability within the relevant ecological context," not "universal meaning."
          *   Unfakeability vs. Flexibility: If it's mechanically unfakeable (Index), it's not a Costly Signal. This is a category error, not a trade-off. The trade-off is between *Affordability* and *Reliability*. If the lowest quality can afford it, it's not reliable.

  6.  **Identifying the "Single Most Exclusionary Requirement":**
      *   It's the **Differential Marginal Cost (Single-Crossing Condition)**. Most proposals fail here because they show a trait is expensive, not that it is *differentially* expensive relative to the quality being signaled.

  7.  **Evaluating Theoretical Families:**
      *   *Zahavi:* Gets the intuition (cost ensures honesty) but muddies the water with "waste".
      *   *Grafen:* Provides the math (single-crossing) but assumes equilibrium which is hard to prove in field.
      *   *Index:* Often conflated with signal. If it's an index, cost is irrelevant to honesty.
      *   *Partial Coincidence:* Shows cost isn't always needed, which undermines the "Costly Signal" claim if interests align too much.

  8.  **Review and Refine:**
      *   Check tone: Needs to be authoritative but helpful for a panelist.
      *   Check constraints: Did I answer the specific questions about waste and unsatisfiable sets? Yes.
      *   Check the Cases: Ensure the verdict is clear based on the spec.
      *   *Self-Correction on Case 1:* The "related species" preference suggests the trait might be a *cue* exploited by the receiver, or the signal evolved via sensory bias. But for *current maintenance* as a signal of quality, the cost structure matters most. The "basking rock" issue is critical for marginal accounting.
      *   *Self-Correction on Case 2:* This is a "commitment" signal. The cost is deferred. Does the spec allow this? Yes, if the *pledge* is binding (social or physiological).
      *   *Self-Correction on Case 3:* Clear fail.

  9.  **Final Polish:** Organize into the requested sections. Ensure the distinction between "Signal" and "Index" is sharp, as this is a common point of confusion in grants. (An index is honest by physics/physiology; a signal is honest by economics/cost).

      *(Self-Correction during drafting the response)*: Make sure to explicitly address the "Waste" question in the meta-analysis section, as the user highlighted it. Ensure the "Unsatisfiable" section addresses their specific suspicions about context-dependence.

      *Structure Plan:*
      1.  Introduction (Acknowledging the purpose).
      2.  The Specification (Three tiers).
      3.  Application to Cases (1, 2, 3).
      4.  Meta-Analysis (Waste, Separation, Unsatisfiable Sets).
      5.  The Single Exclusionary Requirement.
      6.  Theoretical Families Scorecard.

      *Refining the "Non-Negotiables":*
      1.  **Receiver Efficacy:** Response affects fitness.
      2.  **Differential Marginal Cost:** Single-crossing.
      3.  **Physiological Fakeability:** Must be possible to fake, but too costly.
      4.  **Marginal Accounting:** Cost attributed to signal, not background.

      *Wait, one nuance:* The user asked for "Non-negotiable, Strong Presumption, Taste".
      *   Non-negotiable: Receiver response, Differential Cost, Fakeability.
      *   Presumption: Marginal Accounting, Alternative Hypotheses (Weapon/Cue).
      *   Taste: Waste, Perfect Separation, Timing (immediate vs delayed).

      *Let's check the User's "Currency Requirement".* "Cost must be one that Q genuinely makes cheaper to bear." This is essentially the Differential Cost condition. I will fold it there.

      *Let's check the User's "Timing".* Is delayed cost okay? Yes, if binding. I'll put this in Presumption or Taste. Actually, if the cost is deferred, it risks being a bluff. I'll make "Binding Mechanism for Deferred Cost" a Strong Presumption.

      *Let's check the "Waste" question.* Zahavi said waste. Grafen showed cost. Modern theory shows cost is sufficient but not always necessary (partial coincidence). I need to be clear: For a *Costly Signal* claim, cost is necessary. Whether it is *wasteful* (net negative) is not.

      *Okay, ready to write.*
answer: |-
  # Specification for Claims of Costly Signalling in Animal Behaviour

  **Purpose:** To establish an evidential standard sufficient to license the classification of a trait $T$ in species $S$ as a *costly signal* of quality $Q$, distinguishing it from a cue, index, weapon, or epiphenomenon.

  **Scope:** Empirical proposals for field work. Theoretical generality is secondary to case-specific justification.

  ---

  ## I. The Specification

  ### A. Non-Negotiable Requirements
  *Failure to meet these conditions invalidates the claim that $T$ is a costly signal.*

  1.  **Receiver Efficacy and Feedback**
      *   **Requirement:** There must be empirical evidence that receivers detect $T$, alter their behaviour in response to it, and that this behavioural alteration confers a fitness benefit (or avoids a cost) to the *signaller*.
      *   **Motivation:** Distinguishes signals from cues (where information is extracted but not evolved for transmission) and from traits that are merely conspicuous. Without fitness feedback linked to the receiver's response, the trait cannot be maintained by selection for communication.

  2.  **The Single-Crossing Condition (Differential Marginal Cost)**
      *   **Requirement:** The marginal cost of increasing the intensity or magnitude of $T$ must be lower for individuals of high $Q$ than for individuals of low $Q$.
      *   **Motivation:** A flat cost (e.g., a "tax" paid equally by all) cannot sustain honesty. High-quality individuals must be able to "afford" more of the signal than low-quality individuals *at the margin*. This is the mathematical core of the handicap principle; without it, low-quality individuals would mimic high-quality ones.

  3.  **Physiological Fakeability**
      *   **Requirement:** It must be physiologically possible for a low-quality individual to produce the trait $T$ (or a higher magnitude of $T$), but they are deterred from doing so by the cost.
      *   **Motivation:** Distinguishes *signals* from *indices*. If $T$ is mechanically or physiologically tied to $Q$ (e.g., deep voice frequency tied to body size), it is an index. Indices are honest by construction, not by cost. If a trait is unfakeable by physics, claiming it is a "costly signal" is a category error.

  ### B. Strong Presumptions
  *These are required unless the proposer provides a rigorous argument for why they do not apply in this specific ecological context.*

  1.  **Marginal Accounting**
      *   **Requirement:** Costs must be attributable to the signal itself, not to background maintenance or activities the animal would undertake regardless of signalling.
      *   **Motivation:** Prevents "double-counting." If a male displays from a perch he would occupy anyway for thermoregulation, the thermoregulatory cost cannot be charged to the signal. Only the *extra* risk or energy expenditure incurred *because* of the signalling act counts.

  2.  **Exclusion of Direct Benefits and Weapons**
      *   **Requirement:** The proposer must demonstrate that the receiver's response is not driven primarily by direct material benefits (e.g., resources, protection) or fear of coercion (weapons), unless these are explicitly part of the signalling model.
      *   **Motivation:** A trait that coerces a receiver (a weapon) or pays for itself directly (a resource) does not require a cost-based honesty mechanism. The "costly signal" label is reserved for cases where information is the primary commodity.

  3.  **Binding Mechanism for Deferred Costs**
      *   **Requirement:** If the cost is pledged but realised later (e.g., parental commitment), there must be a mechanism (social punishment, physiological lock-in) that prevents the signaller from deserting or cheating after the receiver has responded.
      *   **Motivation:** A deferred cost without a binding mechanism is a bluff. Low-quality individuals could signal, receive the benefit, and then escape the cost.

  ### C. Research Tradition / Taste
  *These are common demands that are not strictly necessary for the claim to hold. Proposers should not be penalised for omitting them, provided they justify their stance.*

  1.  **Net Fitness "Waste"**
      *   **Status:** Taste (Zahavi's rhetoric).
      *   **Clarification:** The signal need not lower the signaller's *net* fitness (benefits can exceed costs). It must only impose a *marginal cost* that ensures honesty. Demanding that the trait be net detrimental is a misunderstanding of the equilibrium condition.

  2.  **Perfect Separation of Types**
      *   **Status:** Taste (Idealised modelling).
      *   **Clarification:** Signals need not perfectly separate high from low quality. Statistical reliability (correlation between $T$ and $Q$) is sufficient. Demanding zero overlap is empirically unrealistic and theoretically unnecessary.

  3.  **Immediate Realisation of Cost**
      *   **Status:** Taste (Classical Handicap).
      *   **Clarification:** Costs can be immediate (energy expenditure) or deferred (predation risk later, parental investment). As long as the *expectation* of the cost influences the signalling decision at the time of the act, the timing is secondary.

  ---

  ## II. Application to Composite Cases

  ### Case 1: The Lizard (Carotenoid Patch)
  *   **Verdict:** **Fail (Marginal Accounting & Index Ambiguity)**
  *   **Analysis:**
      *   *Passes:* Receiver Efficacy (females prefer, males attack); Physiological Fakeability (carotenoids are dietary, not mechanically fixed).
      *   *Fails:* **Marginal Accounting.** The display is performed from basking rocks occupied regardless of patch size. The cost of the *display act* is zero. The cost of the *patch production* relies on foraging success. If foraging success *is* the Quality $Q$, the patch is arguably an **Index** of foraging ability, not a signal maintained by differential cost.
      *   *Critical Flaw:* Females of a related species lacking the patch also prefer blue models. This suggests a pre-existing sensory bias (Sensory Exploitation). While this doesn't rule out current signal maintenance, it shifts the burden to prove the cost is currently maintaining the honesty, rather than the trait simply riding a pre-existing preference.
  *   **Funding Decision:** Reject as a "costly signal" proposal. Reframe as "Index of Condition" or "Sensory Exploitation" requires different predictions.

  ### Case 2: The Fish (Parental Commitment)
  *   **Verdict:** **Pass (Conditional on Binding Mechanism)**
  *   **Analysis:**
      *   *Passes:* Receiver Efficacy (female acceptance); Differential Cost (mass loss/predation risk likely higher for low-quality males).
      *   *Presumption Check:* **Binding Mechanism.** The cost is deferred (weeks of guarding). The proposal must demonstrate why a low-quality male cannot display, gain mating, and then desert. If desertion is possible and unpunished, the signal is fakeable. If social norms or physiological changes (e.g., hormonal shifts upon spawning) lock the male in, it satisfies the **Binding Mechanism** presumption.
      *   *Note:* This is a "Commitment Signal." The cost is real, but the timing is delayed.
  *   **Funding Decision:** Fundable, provided the proposal explicitly addresses the stability of the commitment (why desertion doesn't invade).

  ### Case 3: The Bird (Dawn Chorus)
  *   **Verdict:** **Fail (Single-Crossing Condition)**
  *   **Analysis:**
      *   *Passes:* Receiver Efficacy (implied); Marginal Accounting (4% mass loss is specific to the chorus).
      *   *Fails:* **Single-Crossing Condition.** The prompt states the cost is "roughly the same four per cent... in every condition." If the cost is flat across all qualities, a low-quality male pays the same price as a high-quality male. There is no differential barrier to mimicry. If low-quality males can afford the 4% cost, they should signal. If they don't, it is not because of the signal cost, but perhaps because they lack the energy reserves entirely (which makes it an Index of survival, not a Costly Signal of quality).
  *   **Funding Decision:** Reject. The cost structure described cannot maintain honesty via the handicap mechanism.

  ---

  ## III. Meta-Analysis: Desiderata and Trade-offs

  ### 1. Waste vs. Cost
  Your suspicion is correct: **"Waste" is inherited rhetoric, not a technical requirement.**
  Zahavi's original framing emphasised "wastefulness" to prove the signal's reliability to sceptics. However, strategic models (Grafen et al.) show that the cost need only be *marginal* and *differential*. The net fitness of a signaller can be (and usually is) positive; otherwise, the signalling system would not evolve.
  *   **Standard:** Do not demand net fitness loss. Demand marginal cost that scales inversely with quality.

  ### 2. Separation vs. Reliability
  **Perfect separation is not required.**
  In noisy biological systems, perfect separation is impossible. Honesty is stable so long as the correlation between signal and quality is sufficient to make receiver response beneficial on average.
  *   **Standard:** Demand statistical reliability, not categorical separation.

  ### 3. Unsatisfiable Subsets (The Trade-offs)
  You asked if certain requirements are jointly unsatisfiable. Your suspicions are partially right, but the conflict is often between *categories* rather than requirements.

  *   **Context-Dependence vs. Fixed Meaning:** You suspected a requirement that "the signal mean the same thing across habitats" conflicts with "costs are context-dependent."
      *   **Resolution:** This is a false dilemma. A signal does not need to mean the same thing across habitats; it needs to be reliable *within* the habitat where it is produced. The standard should be **Local Reliability**. Demanding cross-context consistency is indeed unsatisfiable and should be discarded.
  *   **Unfakeability vs. Flexibility:** You suspected "unfakeability by construction" conflicts with "evolutionary flexibility."
      *   **Resolution:** This is a category boundary, not a trade-off. If a trait is unfakeable by construction (Index), it is **not a Costly Signal**. You cannot have both. Proposers often try to claim the robustness of an Index with the evolutionary flexibility of a Signal.
      *   **Finding:** The joint requirement of "Physiologically Unfakeable" AND "Maintained by Differential Cost" is logically incoherent. The panel must force a choice: Is it an Index (honest by physics) or a Signal (honest by economics)?

  ---

  ## IV. The Single Most Exclusionary Requirement

  **The Single-Crossing Condition (Differential Marginal Cost).**

  This is the filter that removes the majority of "just-so" stories. Most proposals can demonstrate that a trait is expensive (e.g., bright colours attract predators, large antlers require calcium). Very few can demonstrate that the *marginal cost* of being brighter or larger is *lower* for high-quality individuals than for low-quality individuals. Without this gradient, expensiveness is merely a barrier to entry, not a guarantor of honesty.

  ---

  ## V. Scorecard: Theoretical Families

  *   **Zahavi's Handicap Principle:** **Partial Pass.** Correctly identifies cost as the guarantor of honesty. Fails on the "waste" rhetoric (net cost not required) and often lacks the formal marginal analysis required by the Single-Crossing Condition.
  *   **Grafen-Style Strategic Models:** **Pass.** Provides the rigorous mathematical definition (Single-Crossing) required by this specification. However, field data rarely meets the equilibrium assumptions these models presuppose.
  *   **Index / Mechanical-Constraint:** **Fail (by definition).** These traits are honest due to physical linkage, not cost. Proposals claiming these are "costly signals" are misclassified. They should be funded as indices, not signals.
  *   **Partial Coincidence of Interest (e.g., Godfray/Bergstrom):** **Pass (with caveat).** Shows honesty can exist without cost if interests align. However, if a proposer claims "Costly Signal," they are explicitly invoking a cost mechanism. If interests coincide enough to remove the need for cost, the "Costly Signal" label is inappropriate, even if the trait is a signal.
