answer: |-
  This is a incredibly sharp distinction you're making, and honestly, it cuts to the heart of where archival theory has moved in the last 15 years. You are absolutely right to feel that lumping "structured illegibility" in with "absence" obscures the mechanics of power.

  If we treat them as the same problem, the solution is always "find more stuff." But if your hypothesis is correct, the solution isn't finding more stuff; it's **dismantling the finding aid.**

  Here is a way to break down the conceptual split you're sensing, using some of the theoretical frameworks that might resonate with what you're wrestling with.

  ### 1. Absence vs. Epistemic Violence
  Traditional "silence" (à la Michel-Rolph Trouillot in *Silencing the Past*) often focuses on moments of erasure: the moment of fact creation (making the source), the moment of assembly (making the archive), or the moment of retrieval (making the narrative). Usually, when people talk about silence, they mean a gap in the record.

  What you are describing—"structured illegibility"—isn't a gap. It's a **barrier**.
  *   **Absence** says: *This person did not exist.*
  *   **Structured Illegibility** says: *This person existed, but only as a problem to be managed.*

  In your example of the 19th-century institutional records, the archive isn't silent; it's screaming. But it's screaming in a language that dehumanizes the subject. This aligns with what Ann Laura Stoler calls "reading along the archival grain." She argues that we shouldn't just look for what the archive hides, but look at *how* the bureaucracy categorizes. The taxonomy itself is the artifact of power.

  So, to answer your first question: **Yes, it is a different kind of power.** It is the power of definition. It is the difference between being erased and being misnamed. Misnaming is often more insidious because it allows the institution to claim, "We have nothing to hide; the records are open," while knowing full well that the indexing system makes the truth unreachable without specialized decryption labor.

  ### 2. The Distribution of Responsibility
  This is where the ethics get messy. If the problem is illegibility rather than absence, the burden of labor shifts.

  **The Record-keeper (Creator):**
  They wielded the initial power to define. They created the "deviance" category. Their responsibility was the act of categorization as control.

  **The Archivist (Custodian):**
  This is the pivot point. Traditional archival theory (Jenkinson) argues the archivist is a neutral custodian; they preserve "original order" and do not interfere with the creator's taxonomy.
  *   *The Trap:* If an archivist preserves a racist, homophobic, or colonial taxonomy in the name of "neutrality" or "provenance," they are actively maintaining the structured illegibility. They are guarding the barrier.
  *   *The Shift:* Modern critical archivists (like Michelle Caswell or the authors of the *Statement on Archival Labor*) argue that description is not neutral. Metadata is a site of power. If an archivist keeps the "deviance" index without adding a note, a parallel access point, or a content warning, they are complicit in the illegibility. The responsibility shifts to them to provide **contextual scaffolding**.

  **The Researcher:**
  We often romanticize the researcher who "reads against the grain" (like a detective). But if we say the *only* way to access these histories is to master the oppressive institutional logic required to decode them, we are extracting labor from the marginalized.
  *   If a queer researcher has to wade through thousands of pages of "deviance reports" to find their ancestors, while a researcher studying institutional architecture just uses the floor plans, the archive is demanding an emotional tax from one and not the other.
  *   So, does the responsibility lie with the researcher? **No.** Relying on "reading against the grain" as the *only* method of repair individualizes a structural problem.

  ### 3. Why Conflation Obscures Power
  If we call both absence and illegibility "silence," we imply the archive is a passive vessel that has suffered loss.
  *   **Absence** implies accident, decay, or neglect.
  *   **Illegibility** implies design.

  By distinguishing them, you highlight that archives are not just repositories of history; they are **technologies of governance**. The "ward number" system wasn't an accident; it was designed to strip identity to make management easier. When we treat that as just "silence," we miss the fact that the archive was *working as intended*.

  ### 4. Implications for Recovery and Repair
  If your concept of "structured illegibility" holds, then "recovery" changes shape.
  *   **Traditional Recovery:** Find the missing document.
  *   **Repair against Illegibility:** Re-describe the document.

  This brings up the "anachronism problem." If we re-catalog that 19th-century file under "Queer Relationships," are we imposing modern identity on the past? Maybe. But if we leave it under "Deviance," we are perpetuating the institution's violence.

  Some archives are experimenting with **parallel description**. They keep the original finding aid (to preserve the history of the bureaucracy) but create a community-based index layer on top of it. This acknowledges the "structured illegibility" without erasing the evidence of how that illegibility was constructed.

  ### Summary of the Split
  You're essentially identifying the difference between **ontological silence** (you are not here) and **epistemic noise** (you are here, but you are static).

  *   **Ontological Silence:** Requires creation of new records (oral histories, community archiving) to fill the void.
  *   **Epistemic Noise:** Requires **translation** and **intervention** in existing records.

  Does this map onto what you're feeling? It sounds like you're pushing back against the idea that the archive is a graveyard, and suggesting instead that sometimes it's a labyrinth designed to keep you out. That shifts the ethical mandate from "excavation" to "dismantling."
