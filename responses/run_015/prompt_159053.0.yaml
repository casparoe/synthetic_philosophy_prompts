answer: |-
  Your gut is better than your tentative rule. Your rule fails because it conflates **prediction** (robustness) with **explanation** (mechanism). The Ideal Gas law isn't robust near condensation, but it's still a "fine" model because it correctly identifies the dominant causal forces (kinetic energy) under standard conditions. Schelling isn't robust to all preference changes, but it's "fine" because it's an existence proof, not a prediction engine.

  To save your verdicts (especially the Domino case), you need a principle that distinguishes between **simplifying a mechanism** and **assuming away the mechanism**.

  Here is the repaired principle, tested against your list, followed by the two new cases.

  ### The Three-Path Principle

  An unrealistic assumption is excusable if and only if it satisfies **one** of the following three conditions, subject to a **Constraint**.

  **Path 1: The Benchmark (Null Model)**
  The assumption is intended to establish a baseline from which deviations are measured. The falsity *is* the point.
  *   *Motivating Cases:* Hardy-Weinberg, Coase Theorem.
  *   *Why:* HW assumes no selection to *measure* selection. Coase assumes zero transaction costs to *measure* transaction costs.

  **Path 2: The Approximation (Causal Inertness)**
  The assumption simplifies a feature that is causally secondary to the specific outcome variable. The detail is "noise" relative to the "signal" you are studying.
  *   *Motivating Cases:* Point masses (Orbital), Frictionless planes, Well-mixed cell, Domino (Known Probability).
  *   *Why:* Planet shape doesn't drive orbit trajectory. Cell spatiality doesn't drive metabolic flux rates. Household uncertainty (Domino) adds noise, but the *cascade mechanism* (eviction → vacancy → stress) remains intact.

  **Path 3: The Logic (Sufficiency/Existence)**
  The model claims to show that a mechanism *can* produce a result, not that it *does* so exclusively or precisely.
  *   *Motivating Cases:* Schelling, Friedman's Billiard (interpreted instrumentally).
  *   *Why:* Schelling proves mild preferences are *sufficient* for segregation. Friedman argues agents act *as if* they calculate; the model predicts shots, not cognitive processes.

  **The Constraint: Mechanism Integrity**
  An assumption is **inexcusable** if it removes the specific heterogeneity, friction, or feedback loop that constitutes the causal explanation for the phenomenon under investigation.
  *   *Motivating Cases:* Representative Agent (Fiscal), Perfect Rationality (Efficient Markets), Theory of the Firm (Black Box), Domino (No Renegotiation).
  *   *Why:* Fiscal stimulus works *because* of heterogeneity (MPC differences). Markets fail *because* of bounded rationality. Firms exist *because* of internal coordination costs. Cascades stop *because* landlords renegotiate. Assuming these away assumes away the phenomenon.

  ---

  ### Running the List

  Here is how the principle adjudicates your cases. It saves your intuitions, including the Domino split.

  | Case | Verdict | Path / Violation | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Point Masses / Sphere** | Fine | Path 2 (Approx) | Shape/size is causally inert for trajectory. |
  | **Frictionless Plane** | Fine | Path 2 (Approx) | Friction is secondary to inertia/gravity for the law being derived. |
  | **Ideal Gas** | Fine | Path 2 (Approx) | Intermolecular forces are negligible *at standard conditions*. (Note: Domain limits apply). |
  | **Hardy-Weinberg** | Fine | Path 1 (Benchmark) | The model *is* the null; deviation is the finding. |
  | **Schelling** | Fine | Path 3 (Logic) | Proves sufficiency of mild preferences, not exact segregation levels. |
  | **Friedman (Billiard)** | Fine* | Path 3 (Logic) | *Only if* treated as predictive instrumentalism. If treated as cognitive description, it violates Integrity. |
  | **Rationality (Markets)** | Not Fine | **Violates Constraint** | Assumes the conclusion (efficiency) by assuming away the friction (irrationality) that explains market anomalies. |
  | **Rep Agent (Fiscal)** | Not Fine | **Violates Constraint** | Heterogeneity *is* the mechanism (different MPCs). Removing it kills the causal chain. |
  | **Coase** | Fine | Path 1 (Benchmark) | Zero costs is the baseline to measure the impact of positive costs. |
  | **Infinitely-Lived (OLG)** | Not Fine | **Violates Constraint** | OLG models study intergenerational transfer. Infinite life removes the generation gap, which is the mechanism. (Distinct from HW). |
  | **Firm (Black Box)** | Not Fine | **Violates Constraint** | "Theory of the Firm" is about the interior. Making it a black box removes the subject. |
  | **Cell (Well-Mixed)** | Fine | Path 2 (Approx) | Spatial structure is noise relative to reaction kinetics for metabolic flux. |
  | **Domino (Prob)** | Fine | Path 2 (Approx) | Information imperfection is noise; the cascade mechanism remains. |
  | **Domino (Renegotiation)**| Not Fine | **Violates Constraint** | Renegotiation is the **stabilizing feedback**. Assuming it away forces the cascade. |
  | **Homogeneous Mixing** | **Depends** | Path 2 vs. Constraint | **Fine** for basic dynamics (Path 2). **Not Fine** for policy targeting/vaccine rollout (Constraint: structure is the mechanism). |

  ### Resolving Your Flip-Flops

  **1. The Domino Model**
  Your intuition was correct to split these.
  *   **Known Probability:** Passes **Path 2**. Whether households know the probability or estimate it affects the *timing*, but not the *existence* of the cascade.
  *   **No Renegotiation:** Fails **Mechanism Integrity**. If landlords renegotiate, the cascade stops. By assuming they don't, you are effectively assuming "Cascades happen because I assumed nothing stops them." That is circular.

  **2. Homogeneous Mixing (Epidemics)**
  This is the hardest case. The principle resolves it by forcing you to specify the **model's claim**.
  *   If the claim is *"Here is how exponential growth works,"* the assumption is **Fine (Path 2)**. Structure is noise relative to the basic reproduction number.
  *   If the claim is *"Here is how we achieve herd immunity with 40% coverage,"* the assumption is **Not Fine (Constraint)**. Network structure *is* the mechanism that allows targeted immunity.
  *   *Handout Advice:* Mark this as a "Context Dependent" case to teach students that excusability depends on the research question, not just the math.

  ---

  ### The Two New Cases

  **1. Citation Networks (Uniform Random Citation)**
  *   **Verdict:** **Not Fine** (for a positive model of network structure).
  *   **Analysis:** Real citation networks are scale-free (preferential attachment). If you assume uniform random citation, you generate a Poisson distribution, not a power law.
  *   **Principle:** This **Violates Mechanism Integrity**. The "rich-get-richer" dynamic is the specific mechanism that explains the heavy tail of citations. Assuming uniformity removes the causal engine.
  *   *Exception:* It is **Fine (Path 1)** if used as a Null Model to detect "communities" or "topics" (i.e., "These papers cite each other more than random chance would allow").

  **2. Academic Hiring (Scalar Quality, Perfect Observation)**
  *   **Verdict:** **Not Fine** (for a model of hiring outcomes/inequality).
  *   **Analysis:** Hiring mismatches and inequality arise from noisy signals, multidimensional quality, and bias.
  *   **Principle:** This **Violates Mechanism Integrity**. If quality is scalar and observed perfectly, the "best" candidate always gets the job. The model cannot explain why top departments don't always hire top candidates, or why bias persists. It assumes away the friction that generates the interesting variance.
  *   *Exception:* It is **Fine (Path 1)** if the model is normative (i.e., "What *should* happen in an ideal market?").

  ### Recommendation for the Handout

  Pick the **Three-Path Principle + Constraint**.

  **Why?**
  1.  **It saves the Domino case.** It explicitly validates your unease about renegotiation (Constraint violation) while permitting the probability assumption (Approximation).
  2.  **It handles the "Ideal Gas" problem.** It clarifies that robustness isn't the test; causal inertness is. The gas law holds *because* forces are negligible, not because they never exist.
  3.  **It teaches judgment.** By separating "Benchmark" from "Approximation" from "Logic," you force students to ask: *What is this model doing?* Is it measuring a gap, simplifying noise, or proving a possibility?

  **The One-Sentence Summary for the Handout:**
  > "An unrealistic assumption is excusable if it establishes a baseline, simplifies causally inert details, or proves logical possibility; it is inexcusable if it assumes away the specific friction or heterogeneity that drives the phenomenon you claim to explain."
