      *   **Egalitarian/Fairness:** Focus on equal treatment of heirs/children.
      *   **Utilitarian:** Focus on the outcome (ROI, happiness, societal benefit).
      *   **Rawlsian Justice:** Veil of ignorance (would you agree to these rules if you didn't know who you'd be?).
