      *   While both involve "unequal distribution," the moral weight, agency, and temporal scope differ significantly.
      *   However, the sister's point touches on a deeper truth: *both* reinforce existing inequalities within a family system. I need to acknowledge that validity while distinguishing the mechanisms.

  3.  **Philosophical Frameworks to Apply:**

