      *   **Situation B (The Parents' Education Funding):**
          *   Asset: Money for education.
          *   Beneficiaries: The User (Law School) vs. Sister (Art School).
          *   Decision: Fund Law School, deny Art School.
          *   Rationale (implied): Practicality/ROI/Parental discretion.
          *   Nature: *Inter vivos* gift/parental allocation during lifetime.
      *   **The Sister's Claim:** Both are "wealth clinging to one branch" and there is "no moral difference" between capital trapped across generations and parents spending more on one kid's career.
      *   **The User's Question:** Is there a principled distinction, or is this just family resentment? What is the philosophical structure?

  2.  **Initial Assessment & Intuition:**

