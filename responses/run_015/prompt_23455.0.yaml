      *Wait, one technical nuance:* In the active view, we define a new metric $g' = d^*g$. At a specific point $p$ inside the hole, $g(p) \neq g'(p)$. If $p$ is a real entity, the physical properties at $p$ have changed. But the boundary conditions are fixed. So the future at $p$ is undetermined. This is the core. I will make sure this is crystal clear.

      *Resolution:* The physical reality is not the pair $(M, g)$ but the equivalence class under diffeomorphisms. Or, more physically, only coincidences (e.g., where a particle worldline intersects a curvature singularity) are real.

