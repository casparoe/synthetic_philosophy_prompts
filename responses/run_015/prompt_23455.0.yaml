      *   *The Setup:* A spacetime manifold $M$. A metric field $g$. A "hole" region $H$ (an open set).
      *   *The Move:* A diffeomorphism $d$ that is the identity outside $H$ but non-trivial inside $H$.
      *   *The Result:* Two models: $(M, g)$ and $(M, d^*g)$.
      *   *The Conflict:* They agree on all data outside $H$ (initial data). They differ inside $H$.
      *   *The Substantivalist Trap:* If manifold points are real individuals, then $g(p) \neq (d^*g)(p)$ means the physical situation is different at point $p$. Thus, indeterminism.
      *   *The Resolution:* Diffeomorphism invariance. The points aren't labeled independently of the fields. The two models represent the *same* physical reality.

  3.  **Drafting - Section by Section:**

