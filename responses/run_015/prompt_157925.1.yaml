  *(Self-Correction on Pitch 3)*: This needs to be the hard No. The logic: If Minor Char A is functionally the counterpart of Major Char A, but we are billing a crossover with Major Char A, we have two counterparts for one slot. Or, we are mislabeling Minor Char A. This violates the "Unique Mapping" rule.

