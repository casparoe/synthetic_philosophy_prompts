answer: |-
  Here is the decision procedure you asked for. It translates your friend's counterpart theory into production language, keeps the fan wiki happy, and gives you the leverage to kill the crossover pitch.

  ### The "Continuity Link" Protocol
  **Time to run:** 15–20 minutes.
  **Goal:** Determine if a character in a branch timeline can be billed as the "Same Character" (Prime) or must be billed as a "Variant/Counterpart."
  **Philosophy:** We do not prove identity. We measure **Link Strength**. A link is strong enough for "Same Character" billing only if it survives specific stress tests.

  ---

  #### Step 1: The Split Point (Causal Anchor)
  *Identify the exact moment the timeline diverges from Prime Canon.*
  *   **Question:** Does the character exist *before* the Split Point with the same history?
  *   **Pass:** Yes. Their history is identical up to the split.
  *   **Fail:** No. The character is created *after* the split, or their history is rewritten *before* the split (e.g., "What if she was adopted?").
  *   **Action:** If **Fail**, mark as **Origin Variant**. Proceed to Step 2 only to determine if it's a *sellable* Variant. If you need "Same Character" billing, **STOP. HARD NO.**

  #### Step 2: The Memory & Body Match (Qualitative Similarity)
  *Counterpart theory says identity is based on similarity, not just origin. We test the degradation.*
  *   **Question:** Does the character have the same memories up to the Split Point, and do they occupy the same physical continuity (no resurrection, no body swap)?
  *   **Pass:** Yes. Same body, same memories up to the split.
  *   **Fail:** No. (e.g., The character died in Prime before the split but is alive here; or they have different memories of the past).
  *   **Action:** If **Fail**, mark as **Functional Variant**. You can tell the story, but you cannot bill them as the Prime character without qualification. **STOP.**

  #### Step 3: The Transitivity Check (Branch of a Branch)
  *Counterpart relations are not transitive. A counterpart of a counterpart is not necessarily a counterpart of the original.*
  *   **Question:** Is this pitch a branch of a branch (Timeline C comes from Timeline B, which comes from Prime A)?
  *   **Pass:** No. It branches directly from Prime.
  *   **Fail:** Yes. It is a secondary/tertiary branch.
  *   **Action:** If **Fail**, calculate **Drift**. For every layer of branching, the Link Strength degrades.
      *   1 Layer (Prime → Branch): Link Strong.
      *   2 Layers (Prime → Branch → Sub-Branch): Link Weak. Bill as "Variant."
      *   3+ Layers: **STOP. HARD NO.** The link is too thin to sustain character identity.

  #### Step 4: The Identity Collision (Uniqueness Test)
  *A character counterpart relation should be 1-to-1. If one character in the branch claims to be the counterpart of two different Prime characters, or if two branch characters claim to be the same Prime character, the link breaks.*
  *   **Question:** Does this character's role in the story overlap with another existing character's counterpart slot?
  *   **Pass:** No. The mapping is unique.
  *   **Fail:** Yes. (e.g., This minor character is acting as the counterpart for a major character who also exists/is promised elsewhere).
  *   **Action:** If **Fail**, **STOP. HARD NO.** This creates a continuity contradiction the wiki will flag and marketing cannot resolve.

  #### Step 5: The Narrative Claim (Contextual Weight)
  *Identity is context-relative. Sometimes we need them to be the same for the emotion, even if the metaphysics are shaky.*
  *   **Question:** Does the emotional core of the story collapse if this is *not* the same person?
  *   **Pass:** Yes. The story is about *this* person's specific history.
  *   **Fail:** No. The story would work with a different character.
  *   **Action:** If **Fail**, but Steps 1 & 2 passed, you have a **Marketing Variant**. You can call them the "Same Character" for ads, but the wiki must list them as "Timeline X Version."
  *   **Escalation:** If Steps 1 & 2 passed, but Step 4 failed, **ESCALATE TO SHOWRUNNER.** This is a business decision, not a continuity one.

  ---

  ### Decision Matrix (The "Cheat Sheet" for Writers)

  | Result | Billing | Wiki Tag | Who Decides |
  | :--- | :--- | :--- | :--- |
  | **Steps 1, 2, 4 Pass** | "Same Character" | Prime/Alt-Timeline | You (Editor) |
  | **Step 1 Fail, 2 Pass** | "Variant" | Divergent Origin | You (Editor) |
  | **Step 2 Fail** | "Variant" | Resurrection/Analog | You (Editor) |
  | **Step 3 Fail (2+ layers)** | "Variant" | Drifted Counterpart | You (Editor) |
  | **Step 4 Fail** | **REJECTED** | N/A | **Showrunner** |
  | **Step 5 Fail** | "Same Character" | Narrative Analog | Marketing |

  ---

  ### Running the Three Pitches

  Here is the procedure applied to your current table.

  #### Pitch 1: The Bottle Episode (Dead Doctor Alive)
  *   **Premise:** Doctor dies in Ep 4 (Prime). In this branch, Doctor is alive and practicing.
  *   **Step 1 (Split Point):** Where does the timeline split?
      *   *If Split is Ep 1-3:* Doctor exists before split with same history. **PASS.**
      *   *If Split is Ep 5:* Doctor is dead in Prime before split. **FAIL (Step 2).**
      *   *Assumption:* Pitch implies a "What if the accident didn't happen?" scenario. Split is pre-death. **PASS.**
  *   **Step 2 (Memory/Body):** Same body, same memories up to split. **PASS.**
  *   **Step 3 (Transitivity):** Direct branch from Prime. **PASS.**
  *   **Step 4 (Collision):** No other Doctor claiming the slot. **PASS.**
  *   **Step 5 (Narrative):** Story relies on it being *this* Doctor. **PASS.**
  *   **Verdict:** **YES.** Bill as "The Doctor." Wiki tags as "Timeline B."
  *   **Note:** If the pitch implies the Doctor died and came back *after* the Prime death event, Step 2 kills it. It becomes a "Resurrection Variant."

  #### Pitch 2: The Hero's Son (Born After Choice)
  *   **Premise:** Spin-off about Hero's son. Conceived/born *after* the branch point in a timeline where Hero made a different choice. Marketing promises "Our Hero's Son."
  *   **Step 1 (Split Point):** The Son does not exist before the split. He is a product of the branch.
      *   *Correction:* Step 1 applies to the *character being billed*. The pitch bills the *Son*. The Son has no Prime counterpart.
      *   *Adjustment:* We are testing the *relationship*, not the Son's identity. The Hero is the Anchor.
      *   Hero exists before split? **YES.**
      *   Hero history same before split? **YES.**
  *   **Step 2 (Memory/Body):** Hero matches. Son is new biology. **PASS (for Hero).**
  *   **Step 3 (Transitivity):** Direct branch. **PASS.**
  *   **Step 4 (Collision):** Does this Son conflict with a Prime Son?
      *   *If Prime Hero has no son:* **PASS.**
      *   *If Prime Hero has a different son:* **FAIL (Step 4).**
      *   *Assumption:* Prime Hero has no son (otherwise marketing wouldn't promise "Our Hero's Son" without qualification). **PASS.**
  *   **Step 5 (Narrative):** Story is about the lineage. **PASS.**
  *   **Verdict:** **YES.** The *Hero* is the Same Character (Counterpart). The *Son* is a New Character. Marketing can say "Our Hero's Son" because the Hero is the constant.
  *   **Wiki Tag:** Hero = "Timeline B Version." Son = "New Character."

  #### Pitch 3: The Crossover (Minor Char A = Major Char B)
  *   **Premise:** Minor Character from Show A appears in Show B Branch. Reads as counterpart of Major Character from Show A. We have an announced Tentpole Crossover featuring the *actual* Major Character from Show A.
  *   **Step 1 (Split Point):** Minor Char exists before split. **PASS.**
  *   **Step 2 (Memory/Body):** Minor Char has Minor Char history, not Major Char history. **FAIL.**
      *   *Wait, let's look closer.* The pitch says they "read as the counterpart." This implies they are *acting* the role of the Major Character without the history. This is a Step 2 Fail (Psychological/History mismatch).
      *   *However, let's assume they fudge the history.* Let's assume Step 2 is a soft Pass (close enough for TV).
  *   **Step 3 (Transitivity):** Direct branch. **PASS.**
  *   **Step 4 (Identity Collision):** **CRITICAL FAIL.**
      *   You have an announced Tentpole Crossover with **Major Character A**.
      *   This pitch introduces **Minor Character A** functioning as **Major Character A**.
      *   **The Collision:** You now have two entities in the franchise ecosystem claiming the "Major Character A" counterpart slot in Show B's timeline.
      *   If Minor Char *is* the counterpart, the Tentpole Crossover is lying (because the *real* Major Char can't exist there without breaking the 1-to-1 rule).
      *   If Major Char *is* the counterpart (for the Tentpole), then this Minor Char is an imposter/variant, and billing them as the counterpart is false advertising.
  *   **Step 5 (Narrative):** Does the story collapse if this is just a Minor Char? Probably not.
  *   **Verdict:** **HARD NO (Step 4).**
  *   **Why:** This violates the **Uniqueness Test**. You cannot have two counterparts for one Prime identity in the same narrative ecosystem without explicit "Doppelganger" billing, which kills the Tentpole marketing.
  *   **Script for Showrunner:** "This pitch creates an Identity Collision. We have promised the audience the Major Character for the Tentpole. If we establish this Minor Character as a functional counterpart in this branch, we dilute the Tentpole's uniqueness and create a wiki contradiction where two characters occupy one identity slot. Step 4 of the Protocol kills this."

  ---

  ### What This Procedure Cannot Do (The Limitations)

  You asked for plain talk on where this tool fails. Here it is:

  1.  **It Cannot Measure Audience Tolerance.**
      The procedure might say "Hard No" on a Step 2 Fail (e.g., a resurrection), but if the emotional payoff is high enough, the audience *will* accept it. The protocol protects continuity, not viewer satisfaction. If the Showrunner overrides a "No" for emotional reasons, the protocol cannot stop them—it only flags the cost (Wiki contradiction).

  2.  **It Cannot Define "Canon License."**
      "Is this story licensed by the canon?" is a legal/rights question, not a metaphysical one. You might have a perfect Counterpart Link (Steps 1–5 Pass), but if the actor is unavailable or the rights to that specific timeline iteration are tangled, the procedure says "Yes" and Legal says "No."

  3.  **It Cannot Fix "Bad Similarity."**
      Counterpart theory relies on *similarity*. If a writer creates a branch where the character is the same origin (Step 1 Pass) but acts completely out of character (Step 2 Fail), the protocol flags it. But it can't tell you *how much* out of character is too much. That is a subjective creative call.

  4.  **It Assumes the "Split Point" is Knowable.**
      In messy TV production, the "Split Point" often moves in post-production. If the episode airs and the wiki locks the Split Point at Ep 4, but the next season implies it was Ep 2, the protocol breaks. You need the authority to lock the Split Point in the writer's room, or this checklist is useless.

  ### Summary for Your Meeting
  *   **Use the Protocol** to validate Pitches 1 and 2. They pass the Link Strength test.
  *   **Use Step 4 (Identity Collision)** to kill Pitch 3. It is the only objective reason that protects the Tentpole marketing.
  *   **Tell your Friend:** She was right about the metaphysics (identity isn't transitive, origin isn't everything), but you've codified her insights into a production filter that protects the franchise without needing a philosophy degree to run it.
  *   **Tell your Showrunner:** "We can do Pitches 1 and 2 without breaking the wiki. Pitch 3 breaks the math of the crossover event. We have two characters claiming one identity slot. It devalues the tentpole."
