  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Continuity Editor for a shared-universe sci-fi franchise (main show + 2 spin-offs).
      *   **Task:** Needs a practical decision procedure to evaluate "what if"/alt-timeline pitches (30/season, 20 mins/pitch).
      *   **Constraints:**
          *   Writers know plot, not metaphysics (no jargon like "de re," "Lewis," "modal logic").
          *   Marketing hates the word "variant" (overuse is bad).
          *   Fan wiki watches for contradictions (consistency is key).
          *   Must handle branching timelines (branch of a branch).
          *   Must incorporate *Counterpart Theory* insights (context-relative, non-transitive, 1-to-many or 1-to-none mappings) without using the jargon.
          *   Must handle specific edge cases (dead character alive, origin change, dual counterparts, evil twin, unique timeline character).
          *   Must evaluate three specific pending pitches (one needs to be a "No").
          *   Must admit limitations (audience acceptance, "licensed by canon" vs. "same character").
      *   **Conflict:** User's current rule (Origin Scene Identity) vs. Friend's philosophical critique (Counterpart Theory/Contextual Identity). The user wants to synthesize these into a usable tool.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Current Rule (Origin Essentialism):* Same character iff same origin.
          *   *Pros:* Clear, binary, easy to check.
          *   *Cons:* Breaks on "What if adopted?" (origin changes), breaks on "Dead character alive" (origin implies death?), Marketing hates "variant" label.
      *   *Friend's Critique (Counterpart Theory):* Identity doesn't hold across worlds. We pick counterparts based on similarity/context.
          *   *Pros:* Handles origin changes, handles dead/alive, handles branching.
          *   *Cons:* Vague, subjective, hard to codify for writers.
      *   *Synthesis:* We need a *Weighted Similarity + Narrative Function* test that mimics counterpart theory but looks like a production checklist. We need to acknowledge that "Same Character" is a marketing claim, not a metaphysical truth.

  3.  **Drafting the Decision Procedure (The "Continuity Protocol"):**
      *   *Goal:* 20-minute evaluation. No jargon.
      *   *Structure:* Sequential gates. Fail any = Stop/escalate.
      *   *Incorporating Counterpart Theory:*
          *   *Context-Relative:* Step needs to ask "What is this story *about*?" (The context determines the link).
          *   *Non-Transitive:* Step needs to check the chain (A is like B, B is like C, is A like C?).
          *   *1-to-Many/None:* Step needs to check for conflicts (Is this character claiming to be two people? Or no one?).
      *   *Drafting Steps:*
          1.  **The Anchor Point (Branch Logic):** Where does time split? (Handles branch-of-branch).
          2.  **The Continuity Thread (Similarity):** Physical/Mental history match? (Handles dead/alive, origin changes).
          3.  **The Narrative Claim (Context):** Who does the story *say* this is? (Handles marketing vs. truth).
          4.  **The Conflict Check (Uniqueness):** Does this steal identity from another character? (Handles dual counterparts).
          5.  **The Escalation:** When to pass to Showrunner.

      *Refining the Steps for the User's Constraints:*
      *   Need to make sure "Origin" isn't the only factor (per Friend's critique) but still matters (per User's current rule).
      *   Need to explicitly handle the "Dead Character" case.
      *   Need to ensure the "Crossover" pitch fails.

      *Revised Procedure Idea:* "The Three-Strand Test."
      1.  **Causal Strand:** Did they come from the same past up to the split? (Origin/History).
      2.  **Psychological Strand:** Do they think/act/remember the same? (Similarity).
      3.  **Functional Strand:** Does the story need them to be the *same* person for the emotional beat to land? (Context).
      *   *Rule:* You need 2 out of 3 to claim "Same Character." You need 3 out of 3 to claim "Prime Canon." If 0 or 1, it's a Variant (or No).
      *   *Wait, the Friend says Identity doesn't hold.* So the procedure shouldn't ask "Is it the same?" It should ask "Is the link strong enough to support the marketing claim?"
      *   *Let's try a "Link Strength" approach.*

      *Finalizing the Procedure Structure:*
      *   **Step 1: The Split Point (Causal).** Establish the branch.
      *   **Step 2: The Memory/Body Match (Qualitative).** Similarity.
      *   **Step 3: The Narrative Weight (Contextual).** Why does it matter?
      *   **Step 4: The Transitivity Trap (Chain).** Branch of a branch check.
      *   **Step 5: The Identity Collision (Uniqueness).** One-to-many check.

  4.  **Developing the Specific Cases (The "Stress Test"):**
      *   *Case 1: Dead Doctor Alive.*
          *   Split: Before death? If yes, Same Character. If split is *after* death, it's a resurrection (Variant/No).
          *   User wants to advertise as "The Doctor's Story."
          *   If the branch happens *before* the death event, the Doctor never died in that timeline. Counterpart theory says this is a valid counterpart.
          *   *Verdict:* Pass (with caveat).
      *   *Case 2: Hero's Son (Born after choice).*
          *   Split: Hero's choice.
          *   Son exists in Branch, not Prime.
          *   Marketing: "Our Hero's Son."
          *   Counterpart view: The Son is a counterpart of... no one (doesn't exist in Prime). But he is the *son* of the Hero's counterpart.
          *   *Verdict:* Pass (Relation is via parent, not self-identity).
      *   *Case 3: Crossover (Minor Char A = Major Char B).*
          *   Show A Minor Char appears in Show B Branch.
          *   Reads as counterpart of Show A Major Char.
          *   Conflict: If Minor Char A is actually Major Char A's counterpart, then the announced "Tentpole Crossover" (presumably bringing in the *actual* Major Char A) is undermined or redundant. Or, it creates a 1-to-2 mapping (Minor Char is counterpart to Major Char AND Major Char is counterpart to Major Char).
          *   *Verdict:* **FAIL.** This hits the "Identity Collision" step.

  5.  **Refining the Procedure for the "No" on the Crossover:**
      *   I need to make sure Step 5 (Identity Collision) is rigorous enough to kill Pitch 3.
      *   The issue is "Counterpart Ambiguity." If Character X in Timeline 2 could be Character Y or Character Z from Timeline 1, the link is broken.
      *   Also, the "Marketing Promise" aspect. If we promised a specific crossover, this dilutes it.

  6.  **Addressing the Limitations:**
      *   The procedure can't measure audience tolerance for contradiction.
      *   It can't decide "Canon License" (legal/rights issues).
      *   It can't fix bad writing.

  7.  **Tone and Style:**
      *   Professional, direct, actionable.
      *   No philosophy jargon (explain concepts via production terms).
      *   Acknowledge the friend's point without citing the friend.
      *   Empower the user to push back on the Showrunner.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "2 out of 3" rule too vague?
      *   *Fix:* Make it a "Breaker" system. Certain mismatches are automatic fails.
      *   *Critique:* Did I incorporate the "non-transitive" bit?
      *   *Fix:* Add a specific check for "Branch of a Branch." If A splits to B, and B splits to C, does C match A? If the chain degrades too much, it's a Variant.
      *   *Critique:* Did I handle the "Origin Change" (Adoption)?
      *   *Fix:* Ensure Step 2 (Psychological/History) weighs heavier than Step 1 (Causal/Origin). This addresses the Friend's critique that Origin Essentialism is too rigid.
      *   *Critique:* The user wants the Crossover to be the "No."
      *   *Fix:* Ensure the logic clearly identifies *why* (Identity Collision/Marketing Conflict).

  9.  **Final Polish:**
      *   Check against the specific constraints: 20 mins, no jargon, fan wiki safe.
