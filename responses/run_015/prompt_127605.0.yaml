  2.  **Deconstruct the Positions:**
      *   *Sen's Liberal Paradox:* There exists at least one pair of alternatives where individual $i$ is decisive (Liberalism), and another pair where individual $j$ is decisive. If everyone prefers $x$ to $y$, society should prefer $x$ to $y$ (Pareto). Sen proves these can conflict. Example: Prude (P) and Lewd (L) reading a book. P prefers neither read > both read > L reads. L prefers both read > P reads > neither reads. If P is decisive on "P reads vs. P doesn't" and L is decisive on "L reads vs. L doesn't", we get a cycle or a Pareto inferior outcome enforced by rights.
      *   *Lexical Liberal (LL):* The conflict is real. To save rights, we must prioritize them lexically over Pareto efficiency *but* only within specific spheres (local liberalism). Rights aren't universal trump cards; they are domain-specific.
      *   *Preference-Reconstructionist (PR):* The conflict is an artifact of thin preference descriptions. If we include *why* people prefer things (e.g., respect for rights) into the preference ordering itself (second-order), the Pareto condition applies to the *reconstructed* preferences, and the cycle disappears without needing to carve out spheres.

  3.  **Drafting - Section by Section:**

