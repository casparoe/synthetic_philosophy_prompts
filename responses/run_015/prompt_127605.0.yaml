      *   **Section 4: Concrete Cases & Predictions.**
          *   Case (a): Diet. A wants to ban B's sugary drink. B claims right to choose.
              *   LL Prediction: Sphere restriction applies. B's choice is in the "personal" sphere. A's preference is inadmissible for social ranking regarding that choice.
              *   PR Prediction: Reconstruct preferences. If B values the right highly, and A's preference is meddlesome, the aggregated reconstructed preferences will uphold B's choice via Pareto on the *new* profile.
          *   Case (b): Zoning. Local vs. Municipal vs. State.
              *   LL Prediction: Nested spheres can be defined. Local decision holds within the local sphere.
              *   PR Prediction: Nested spheres are unstable. Preferences over jurisdiction will resolve the conflict via reconstructed utility, not rigid boundaries.
      *   **Section 5: Disagreements Table.**
          *   Columns: Issue, LL Position, PR Position, Agreed Test, Divergent Prediction.
      *   **Section 6: Verbal Dispute Assessment.**
          *   Is "Liberalism" the same? LL sees it as a constraint on aggregation (a rule). PR sees it as an input to aggregation (a value). This is a substantive disagreement, not merely verbal, though terminology overlaps.

  4.  **Refining the Tone:**
      *   Must be formal, philosophical, yet precise.
