answer: |-
  This is one of the hardest places for philosophy to land: not in a lecture hall, but in a living room where a family is breaking apart. You are right to feel the tension. If we take determinism seriously—if your brother's addiction is the inevitable result of genetics, environment, trauma, and neurochemistry—then the moral outrage your parents feel (and the guilt you might feel) seems like a category error.

  But you've also spotted the exact friction point that bothered Einstein's critics: **If nothing is chosen, why act?**

  Here is a way to square this that isn't a "word trick," and that might help you navigate your relationship with your brother without losing your mind or your compassion.

  ### 1. Einstein's Activism Was Causal, Not Retributive
  You asked what Einstein was doing signing petitions if he believed people weren't ultimately responsible. The answer is that he viewed his petitions as **part of the causal chain**, not as judgments on souls.

  Think of it like this: If you see a rock tumbling down a hill toward a house, you don't blame the rock. You know gravity and geology caused it. But you also don't sit passively. You might try to divert the rock. Why? Because your attempt to divert it is *also* a cause.

  Einstein didn't speak out to punish militarists for their "evil choices." He spoke out because he believed that **moral argument is a force of nature.** When you tell someone "you ought not do this," you are introducing a new variable into their psychological equation. You are adding pain, social pressure, or reason to their internal calculus. That might tip the scale.

  For Einstein, saying "war is bad" wasn't about blaming the warmonger; it was about trying to alter the conditions that produce warmongers. He wasn't inconsistent; he was just a mechanic who believed that talking is a wrench.

  ### 2. The "Word Trick" of Responsibility
  You said the compatibilist definition of responsibility (being "responsive to reasons") feels like a trick. I understand why. It feels like we are redefining the word to save our feelings.

  But there is a more practical distinction that avoids the semantics: **Backward-Looking Blame vs. Forward-Looking Accountability.**

  *   **Backward-Looking (Retributive):** "You did X, therefore you are bad, and you deserve to suffer." This requires metaphysical free will. If determinism is true, this *is* nonsense. Your brother does not "deserve" suffering in a cosmic sense.
  *   **Forward-Looking (Functional):** "You did X, and X causes harm. Therefore, we must impose consequence Y to make X less likely in the future." This requires no magic freedom. It only requires that human behavior is malleable.

  When your parents cut him off, they are likely operating (hopefully) on the second model, even if they use the language of the first. If giving him money causes him to buy alcohol, removing the money is a causal intervention. It isn't punishment; it's **boundary setting as physics.**

  If you view their action as "punishment for a sin," you will feel conflict. If you view it as "removing fuel from a fire," it becomes a tragic necessity rather than a moral verdict.

  ### 3. Applying This to Your Brother
  So, how do you hold this view without becoming cold or fatalistic?

  **A. Drop the Anger, Keep the Boundaries**
  Einstein said seeing the world deterministically freed him from anger. This is the most useful tool for you. Anger assumes your brother is withholding something from you (sobriety, stability) that he *could* give but *won't*.
  If you view his addiction as a causal trap—a storm he is caught in rather than a path he is walking—you can grieve the situation without hating the person. You can love the brother while fighting the disease. This doesn't mean you let him stay on your couch and drink; it means you evict him without venom. You protect yourself because his current state is dangerous, not because he is "evil."

  **B. You Are a Cause, Not a Judge**
  You mentioned that praise and blame feel like "noise sprayed on top of a causal chain." But noise *changes* chains.
  Your relationship with him is an input. If you engage with him with shame and blame, that is a causal input that might drive him deeper into addiction (stress -> drinking). If you engage with him with firm boundaries but zero judgment ("I love you, I cannot give you money, I will pick you up if you call for a ride"), that is a different causal input.
  You aren't trying to reach his "free will." You are trying to hack his conditioning.

  **C. The Danger of Fatalism**
  The trap you are worried about is fatalism: "If it's all determined, why bother?"
  Einstein's life proves that determinism does not equal passivity. The fact that his actions were determined didn't stop them from being effective.
  Your brother's recovery is determined, too. But *your support* is part of what determines it. You cannot force the outcome, but you are a necessary variable in the equation.

  ### 4. A Synthesis for You
  Here is the mindset shift that might help you sleep at night:

  **Your brother is not choosing addiction over you. He is caught in a causal loop that overrides his choice.**
  **Your parents are not punishing him. They are removing themselves as variables that allow the loop to continue.**
  **You are not responsible for saving him. You are responsible for how you interact with the situation.**

  Einstein's Spinoza-God is the order of the universe. In that order, addiction is a tragedy of biology and circumstance, not a moral failure. But in that same order, **love is also a cause.**

  You can accept that your brother couldn't have done otherwise *in that moment*, while still working to ensure the *next moment* is different. You can stop asking "Why is he doing this to us?" (which implies malice) and start asking "What conditions are producing this?" (which implies solutions).

  This doesn't fix the pain. It doesn't get him sober. But it might stop you from burning out on anger at a ghost—the ghost of the "free will" he doesn't have. You can treat the brother who exists, not the brother you wish he was capable of being.
