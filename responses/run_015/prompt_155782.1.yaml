      *   Actually, Quadratic Scoring Rule $2c_w - \sum c_i^2$.
      *   If I set all $c_i = 0.2$ (sum 1). Score if $w=1$: $0.4 - 5(0.04) = 0.2$.
      *   If I set all $c_i = 0.24$ (sum 1.2). Score if $w=1$: $0.48 - 5(0.0576) = 0.48 - 0.288 = 0.192$.
      *   So incoherence (sum > 1) is penalized.
      *   But does the game *show* dominance? No, it shows *average performance*. Dominance means "Better in *every* world."
      *   I must warn the user: The game cannot demonstrate dominance empirically because you can't play every world. It demonstrates *propriety* (expected utility maximization leads to coherence).
      *   I need to be honest about this limitation. The game supports the *veritist* claim (accuracy is the goal), and the *propriety* claim (honesty is the best policy), but the *dominance theorem* is a mathematical backstop they have to trust after seeing the incentives.

      *Re-evaluating the User's "Twist":*
      The user says: "dominance argument delivers coherence over the coarse algebra and nothing at all inside the groups."
      This is philosophically sound. If the accuracy measure is coarse, the norm is coarse.
      The game will show: In Block 2, internal distribution doesn't change the score.
      This maps to: The accuracy norm does not demand fine-grained coherence if the accuracy measure is coarse.
      This is a great setup for discussing *why* we choose the fine-grained Brier score (Joyce's argument).

      *Okay, plan is solid.* I will structure the response to validate the math, warn about the "Dominance vs. Propriety" empirical gap, and provide the logistical scaffolding.

