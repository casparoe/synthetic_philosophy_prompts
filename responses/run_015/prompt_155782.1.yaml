answer: |-
  This is a bold and pedagogically sound plan. You are essentially asking students to *inhabit* the mathematical structure of accuracy-first epistemology before they see the proofs. That is the right way to teach formal epistemology to philosophers.

  Here is the honest assessment: **Your mathematical intuition is correct, but your empirical demonstration of "dominance" will fail if you aren't careful.** The game demonstrates *propriety* (incentives), not *dominance* (mathematical guarantee across all possible worlds). You can only play a few worlds (rounds); dominance requires *all* worlds.

  However, the "Coarse vs. Fine" twist is brilliant. It demonstrates that **normative force is relative to the accuracy measure.** If the measure is coarse, the norm is coarse. This sets up Joyce's argument for why we *must* use fine-grained measures perfectly.

  Here is the blueprint to make this work in 75 minutes without you drowning in arithmetic.

  ### 1. The Math Check (Does the rule hold?)
  **Yes.**
  *   **Block 1 (Fine):** Standard Brier/Quadratic Score on 6 cells. Strictly proper. Maximizing expected score requires $P(A) + P(B) + ... = 1$ and $P(A) = \text{true probability}$.
  *   **Block 2 (Coarse):** You partition the 6 cells into 3 groups (e.g., {1,2}, {3,4}, {5,6}). You sum the reported credences for each group ($C_{G1}, C_{G2}, C_{G3}$) and score *those* sums using the quadratic formula.
  *   **Result:** The rule is proper for the coarse algebra, but **not strictly proper** for the fine algebra.
  *   **Student Experience:** In Block 2, Student A (50, 50, 0, 0, 0, 0) and Student B (0, 100, 0, 0, 0, 0) will receive the **exact same score** if the truth falls in Group 1. They will feel the "release" of normative pressure inside the group.

  ### 2. Order of Play
  **Run Block 1 (Strict/Fine) First.**
  *   **Why:** You need to establish the baseline pressure. Students need to feel the "pain" of incoherence (summing >100) and the "reward" of calibration in a high-resolution environment.
  *   **Then Block 2 (Coarse):** When they realize their internal distribution doesn't matter, the contrast highlights that the *norm* comes from the *measure*.
  *   **Debrief:** You move from "I felt pressured to be coherent" (Block 1) to "Why was I pressured?" (Veritism) to "Why did the pressure vanish?" (The Measure).

  ### 3. Game Logistics (The "Machine")
  Do not calculate scores by hand. You will lose 20 minutes and introduce errors.
  *   **Prep:** Create a simple Excel/Google Sheet.
      *   Input: Student ID, 6 Credences, Truth Card.
      *   Output: Score automatically.
      *   Have a projector ready to display the leaderboard after each block.
  *   **Materials:**
      *   **Truth Generator:** A deck of cards (remove face cards). Ace=1, 6=6. Shuffle and draw one per round.
      *   **Slips:** Pre-printed slips with 6 boxes labeled 1–6. Space to write 0–100.
      *   **Payoff:** High-quality chocolate. The "Reading Choice" is too much power for a game winner; keep it to chocolate + bragging rights.
  *   **Rounds:** 5 Rounds per Block. (10 total).
      *   *Why 5?* One round is luck. Five rounds allows the Law of Large Numbers to whisper that coherence pays off.
      *   *Time:* 2 mins per round (report, draw, reveal, record). 10 rounds = 20 mins. + Setup/Debrief = 75 mins.

  ### 4. The Rules (Student Facing)
  *Do not mention scoring formulas.*

  **Instructions:**
  1.  "We are running a Calibration Challenge. There are 6 possible states of the world (Cards 1–6)."
  2.  "In each round, assign a confidence number (0–100) to each card. **You do not need to sum to 100.**" (Crucial: let incoherence happen).
  3.  "I will draw a card. You get points based on your numbers and the card. Higher points = more chocolate."
  4.  **Block 1:** "Standard Scoring." (You run the fine formula).
  5.  **Block 2:** "Algorithm Update." (You run the coarse formula). "Same 6 boxes, same cards. New scoring algorithm."

  ### 5. The Debrief (Mapping Experience to Theory)
  This is where you do the work. Do not lecture until the game ends.

  **Step 1: Veritism (The Goal)**
  *   *Ask:* "Why were you trying to maximize points?"
  *   *Point:* Because points mapped to accuracy. If accuracy didn't matter, you would have just written random numbers. You treated accuracy as the *goal* (Veritism).

  **Step 2: Propriety (The Incentive)**
  *   *Ask:* "In Block 1, did anyone try summing to 150% to be 'safe'? How did it go?"
  *   *Point:* The scoring rule made honesty the best policy. That is **Propriety**. If the rule wasn't proper, you would have gamed it (e.g., always reporting 100 on one card).
  *   *Show:* Display the aggregate data. Show that students who hovered near sum=100 outperformed extreme incoherent students *on average*.

  **Step 3: The Coarse Twist (Strict Propriety & Dominance)**
  *   *The Reveal:* Pull up two students' sheets from Block 2.
      *   Student X: [40, 10, ...]
      *   Student Y: [10, 40, ...]
      *   (Same group sums, different internal distribution).
  *   *Ask:* "They played differently but got the same score. Why?"
  *   *Reveal:* "In Block 2, I only scored the Groups."
  *   *The Lesson:* "In Block 1, the accuracy measure demanded fine-grained coherence. In Block 2, it did not. The **Dominance Argument** says incoherent credences are always less accurate. But 'less accurate' depends on how we measure accuracy. If we measure coarsely, fine-grained incoherence isn't 'dominated.' It's invisible."
  *   *The Punchline:* "Joyce's argument relies on the claim that the *fine-grained* Brier score is the correct measure of accuracy. This game shows you why that choice matters. If we accepted the Coarse Measure, you would be epistemically permitted to be wild inside the groups."

  ### 6. What The Game Cannot Reproduce (Honesty Check)
  You need to say this in the debrief to prevent misunderstanding.

  1.  **Dominance vs. Expectation:** The game shows *ex-post* accuracy (what actually happened). The Dominance Theorem is about *ex-ante* guarantee (what *could* happen). A coherent student can lose to an incoherent student in 5 rounds due to luck. The theorem says the coherent student *would* win in the long run or *in every possible world* (depending on the specific theorem version). Acknowledge that luck swamped the signal for some people.
  2.  **Pragmatic Contamination:** You offered chocolate. This introduces pragmatic utility. A strict veritist says we should care about accuracy *for its own sake*. By paying them, you made accuracy instrumental. Acknowledge the irony: "We used pragmatism to teach anti-pragmatism."
  3.  **The "Why" of the Measure:** The game shows *that* the measure matters, not *why* the fine-grained measure is the correct one. That requires the philosophical argument (Joyce's non-pragmatic justification), which is your homework for them.

  ### 7. What Goes Wrong (Troubleshooting)
  *   **The Extremizer:** One student will put 100 on every cell (Sum = 600).
      *   *Outcome:* In Block 1, they will get hammered by the sum-of-squares penalty. In Block 2, they might do okay if the groups sum "correctly" by accident.
      *   *Fix:* Don't stop them. Use them as a data point in debrief. "Look at Student Z's score. The math punished them."
  *   **The Arithmetic Error:** You will mistype a number in your spreadsheet.
      *   *Fix:* Have a "Score Dispute" rule. "If your math doesn't match mine, show me your slip after class." (It won't happen, but it lowers anxiety).
  *   **The "Why are we doing this?" Look:**
      *   *Fix:* Frame it immediately as "We are testing a hypothesis about rationality." Upper-level undergrads respond well to being research subjects.
  *   **Confusion on Groups (Block 2):**
      *   *Fix:* Draw the groups on the board clearly. {1,2} | {3,4} | {5,6}. Tell them: "The computer sees these pairs as single buckets now."

  ### Summary Recommendation
  Your plan is solid. The "Coarse Block" is the pedagogical killer app here—it makes the abstract property of "strict propriety" physically felt as a "loss of constraint."

  **One final tweak:** In the debrief, explicitly distinguish between **Coherence** (summing to 1) and **Calibration** (matching frequencies). The scoring rule punishes incoherence heavily. Make sure they see that the penalty for summing to 150% is mathematical, not just "bad luck."

  Go run this. It's going to be the class they remember.
