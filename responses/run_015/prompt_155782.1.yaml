          *   **The Twist:** Two blocks.
              *   Block 1: Standard Quadratic Scoring Rule (Brier Score style) on fine cells.
              *   Block 2: "Coarse" Quadratic Scoring Rule. Sum credences within 3 groups, score the groups. Internal distribution within groups doesn't affect score.
          *   **Claim:** Block 2 rule is proper but not *strictly* proper regarding the fine partition. Students should feel they can reshuffle within groups without penalty.
      *   **Needs:**
          *   Validation of the mathematical claim (does the rule work?).
