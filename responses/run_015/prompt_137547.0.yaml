      *   Data: A > B, B > C.
      *   Inference: U(A) > U(B) > U(C).
      *   Problem: Is U(A) = 100, U(B)=99, U(C)=0? Or U(A)=10, U(B)=9, U(C)=8?
      *   Test: Ask Analysts to bet on whether their Agent would accept a 50% chance of A vs 100% of B.
      *   If U(A) >> U(B), they take the risk. If U(A) ~ U(B), they don't.
      *   The data (A>B) doesn't tell us this.

  7.  **Refining the Materials:**
      *   Need Choice Sheets.
      *   Need "Secret Instruction" cards for some Agents.
      *   Need "Analyst Worksheet" for reconstruction.
      *   Stakes: A bag of mixed chocolates or distinct stickers/cards representing prizes. Let's use **distinct chocolates** (e.g., Dark, Milk, Caramel, Nut). It's cheap, immediate, consumable, and preferences vary.
      *   *Correction:* Eating in a seminar might be distracting. Let's use **"Raffle Tickets"** for 4 distinct prizes (e.g., $10 Coffee, $10 Book, 1hr WFH pass, Choose next topic). This is high value, zero cost to run immediately (drawn at end).

  8.  **Addressing the "Sharp Conclusion":**
      *   Must force the question: Is the Utility Function a *discovery* (latent truth) or a *compression* (lossy summary of data)?
      *   If it's compression, RPT is just data summarization, not psychology.
      *   If it's discovery, we need evidence beyond choices (neuroscience? introspection?).

  9.  **Addressing the "Meta-Note":**
      *   Where does *this* design beg the question?
      *   It assumes preferences *should* be stable.
      *   It assumes the "Secret Rule" people *don't* have preferences (but maybe they prefer following rules?).
      *   It assumes utility is for *prediction*.
      *   What would change my mind? If participants argue that the "Rule Follower" *does* have a preference (for simplicity), then RPT holds (preferences over processes). I need to acknowledge this counter-argument.

  10. **Timeline Check:**
      *   0-5: Intro & Pairing.
      *   5-20: Choice Rounds (3 rounds x 5 mins).
      *   20-35: Reconstruction (Analysts build the model).
      *   35-45: Prediction Test (The Intensity Trap).
      *   45-65: Debrief (The 3 Points).
      *   65-75: Sharp Conclusion & Meta-Note.
      *   *Wait, 75 mins total.* The above is 75. Tight. Need to cut Reconstruction time. Merge Reconstruction with Debrief.

  11. **Final Polish:**
      *   Ensure the "Secret Rule" doesn't get revealed too early.
      *   Ensure the "Identity" shift is subtle.
      *   Make sure the Engineers feel the pain of "underdetermined models."

      *(Self-Correction during drafting)*: The prompt asks for "Generate real choice data for each other."
      Okay, Person A chooses, Person B records. Then they swap? No, keep roles fixed for consistency, then swap roles for the second half?
      Let's keep roles fixed for the experiment to maintain the "Analyst vs Subject" dynamic, then debrief.
      Actually, 16 people = 8 pairs.
      4 pairs: Normal Agents.
      4 pairs: "Rule-Based" Agents (Secretly instructed).
      This allows a comparison in the debrief.

      *Wait, Objective 2 (Identity)* requires the *same* option to appear different.
      Round 1: Options {Chocolate, Fruit, Cookie}.
      Round 2: Options {Chocolate, Fruit, Cookie}. (But Chocolate is wrapped differently).
      Round 3: Options {Chocolate, Fruit, Cookie}. (But Analyst suggests one).

      Let's refine the "Identity" task.
      Menu 1: {A, B, C}.
      Menu 2: {A, B, D}.
      If they choose A in both, is "A" the same?
      Better: Menu 1: {Coffee, Tea}. Menu 2: {Coffee, Tea, Water}.
      If they choose Coffee in 1, but Tea in 2... wait, that's regularity violation.
      Let's use the **"Description"** trick.
      Item 1: "5 mins break".
      Item 1 (later): "5 mins break (Extended)".
      If the agent treats them differently, the Analyst must decide if they are the same option.

      *Okay, let's finalize the plan.*

      **Structure:**
      1.  **Setup:** 8 Pairs. 4 "Standard", 4 "Rule-Followers".
      2.  **Task:** 3 Rounds of choices over "Prizes" (Raffle tickets).
      3.  **Twist:** Round 2 changes the *description* of one prize (Identity). Round 3 introduces Risk (Intensity).
      4.  **Reveal:** Rule-followers reveal their algorithm.
      5.  **Debrief:** Map to the 3 points.

