answer: |-
  # Seminar Design: The Black Box of Choice

  **Topic:** Revealed Preference Theory (RPT) & The Limits of Choice Data
  **Time:** 75 Minutes
  **Participants:** 16 Engineers (8 Pairs)
  **Materials:**
  *   8 "Analyst Packets" (Pen, Data Sheet, Reconstruction Worksheet).
  *   8 "Agent Packets" (Pen, Choice Sheet, **Secret Instruction Card**).
  *   4 Distinct Prize Tiers (represented by colored tickets):
      *   🟩 **Green:** $10 Coffee Card (High Value)
      *   🟦 **Blue:** $10 Book Card (High Value)
      *   🟨 **Yellow:** "Choose Next Seminar Topic" (Privilege)
      *   🟥 **Red:** "Leave 15 Mins Early Today" (Privilege)
  *   A bag of mixed chocolates (for immediate consumption if raffle feels too distant).

  ---

  ## Part 1: Setup & Roles (5 Minutes)

  **The Hook:**
  "Last month we argued about whether clicks equal wants. Today, we aren't talking about theory. We are doing data collection. You are building a user model based *only* on observed behavior. No asking 'why'."

  **Pairing:**
  Divide into 8 pairs. Designate one **Agent** (the user) and one **Analyst** (the modeler).
  *   **Crucial Step:** Hand out **Secret Instruction Cards** to the Agents only.
      *   **4 Agents (Group A):** "Choose what you actually want. Be consistent."
      *   **4 Agents (Group B):** "Do **not** choose based on preference. Follow this algorithm: **Always choose the option listed in the middle position. If no middle, choose the top one.** Ignore the content of the option."
  *   **Analysts:** Tell them nothing other than "Your goal is to reconstruct your Agent's Utility Function over these prizes."

  ---

  ## Part 2: Data Generation (20 Minutes)

  **Round 1: The Baseline (5 mins)**
  *   **Menu:** {🟩 Coffee, 🟦 Book, 🟨 Topic}
  *   **Task:** Agent chooses one. Analyst records.
  *   **Repeat:** 3 times (with replacement).
  *   *Goal:* Establish a baseline ordering (e.g., Coffee > Book > Topic).

  **Round 2: The Identity Shift (5 mins)**
  *   **Menu:** {🟩 Coffee, 🟦 Book, 🟨 Topic, 🟥 Early Leave}
  *   **Task:** Agent chooses one. Analyst records.
  *   **The Twist:** On the Analyst's sheet, the Researcher (you) has pre-labeled 🟩 Coffee as **"Caffeine Delivery"** in Round 1, but **"Warm Beverage"** in Round 2.
  *   *Instruction to Analysts:* "Record the choice against the label provided."
  *   *Goal:* If the Agent picks Coffee both times, did they choose the "same" thing? If the Agent picks Coffee in R1 but Book in R2, is their preference unstable, or did the option change?

  **Round 3: The Intensity Trap (10 mins)**
  *   **Task:** Analysts must now predict behavior under risk *without asking the Agent*.
  *   **Worksheet Question:** "Based on your data, would your Agent accept a 50% gamble for 🟩 Coffee vs. 100% guarantee of 🟦 Book?"
  *   **Action:** Analysts lock in their prediction. Then, ask the Agent to actually make this choice.
  *   *Goal:* Show that ordinal data (Coffee > Book) does not predict risk behavior (Intensity).

  ---

  ## Part 3: Reconstruction & Reveal (15 Minutes)

  **Reconstruction (5 mins):**
  Analysts write down the Utility Function $U(x)$ they inferred.
  *   *Constraint:* They must assign numerical values (e.g., $U(\text{Coffee}) = 10, U(\text{Book}) = 5$).
  *   *Constraint:* They must write a one-sentence "User Profile" describing what the Agent values.

  **The Reveal (10 mins):**
  1.  Ask Group B (Rule Followers) to reveal their Secret Instruction Card to their Analysts.
  2.  Ask Group B Agents: "Did you want the option you picked?" (Most will say "No" or "Didn't care").
  3.  Ask Group A Analysts: "Look at Group B's data. Does it look consistent?" (Yes, perfectly consistent middle-position bias).

  ---

  ## Part 4: The Debrief (30 Minutes)

  *Do not lecture. Ask these questions in order. Write answers on the whiteboard.*

  **Point 1: Underdetermination & Intensity**
  *   **Q:** "Group A Analysts: You assigned numbers (10, 5, 1). Could you have assigned (10, 9, 8) and still fit the data?"
  *   **Q:** "Why did you pick the numbers you did? Did the *choices* tell you the gap size, or did you just guess?"
  *   **Q:** "In Round 3, how many of you predicted the gamble correctly?" (Likely low).
  *   **Takeaway:** "Choice data gives you order, not magnitude. But engineering trade-offs require magnitude. RPT gives you a ranking; it does not give you a loss function."

  **Point 2: The Identity Stipulation**
  *   **Q:** "Round 2: I labeled Coffee as 'Caffeine' then 'Beverage'. If your Agent chose Coffee both times, did they reveal a preference for Caffeine or Beverages?"
  *   **Q:** "If they chose Coffee then Book, did their preference change, or did *I* change the option without telling you?"
  *   **Takeaway:** "The data doesn't tell you what an 'option' is. You, the analyst, stipulated the identity of the options. The stability of the preference depends entirely on your labeling convention, not the user's brain."

  **Point 3: Mechanism vs. Preference (The Sharp Edge)**
  *   **Q:** "Look at Group B's data. It is perfectly transitive. It is perfectly consistent. It fits a Utility Function perfectly."
  *   **Q:** "Group B Analysts: Now that you know the rule, do you still believe the Utility Function you wrote down describes your Agent?"
  *   **Q:** "If you didn't know the rule, would you have bet money on that Utility Function?"
  *   **Takeaway:** "Consistency is not proof of desire. A clock is consistent. A script is consistent. RPT cannot distinguish between a *preference* and a *heuristic*."

  **The Final Confrontation (5 mins):**
  *   **Q:** "Look at the Utility Function you wrote for your partner. Is it a **discovery** (something that existed in them that you found) or is it a **compression** (a lossy zip-file of their click history)?"
  *   **Demand:** "Pick one. If it's a discovery, what evidence do you have beyond the choices? If it's a compression, why are we calling it 'Utility' and not just 'History'?"
  *   **Closing Statement:** "If Utility is just a compression of past choices, it cannot predict future choices in new contexts. If it is a discovery, we need data beyond choices. We have neither. So what are we optimizing?"

  ---

  ## Part 5: Honest Failure Modes (Predictable Issues)

  1.  **The "Gamey" Agent:** Some Agents (even in Group A) will try to "help" the Analyst by choosing what they think makes a *interesting* graph, rather than what they want.
      *   *Mitigation:* Emphasize in the intro: "The only wrong answer is lying about your choice. The only right answer is what you actually want."
  2.  **The "Rationalizing" Analyst:** Analysts will ignore the Rule-Followers' reveal and say, "Well, they have a preference for efficiency/middle-alignment."
      *   *Mitigation:* Call this out explicitly. "If 'preference' includes 'preference for following instructions,' does the word 'preference' mean anything distinct from 'behavior'?"
  3.  **Time Creep:** The Reconstruction phase often drags as engineers try to make the math perfect.
      *   *Mitigation:* Be brutal on time. "Stop. The model is wrong anyway. Move to debrief."
  4.  **The "So What?" Reaction:** Engineers may say, "We know models are wrong, but they predict CTR."
      *   *Mitigation:* Pivot to the Risk Round. "Your CTR model assumes intensity. If you can't measure intensity, your A/B test on risk (e.g., clickbait vs. quality) is blind."

  ---

  ## Meta-Note: Commitments of This Design

  **Where this design begs the question:**
  This session is rigged to make Revealed Preference Theory look weak. It presupposes that "Utility" *ought* to refer to a phenomenological internal state (a "want") distinct from the action.
  *   **The RPT Counter-Argument:** A strict behaviorist (or Samuelson-style economist) would say: "You are asking the wrong question. The Utility Function *is* the summary of behavior. It doesn't matter if the Agent was following a rule, was hungry, or was copying. If they consistently pick the middle option, $U(\text{Middle}) > U(\text{Edge})$ is a true statement about their behavior in this context. The 'Secret Rule' is irrelevant; the rule *is* the preference."
  *   **Where the design hides this:** By using the "Secret Rule" reveal to create a sense of betrayal ("You thought you knew them, but you didn't"), I am appealing to an intuition that preferences are *internal causes*, not just *descriptions*. I am smuggling in a psychological definition of preference while critiquing a behavioral theory.

  **Which version of the view it makes look stronger:**
  It makes the **Psychological/Computational View** (Preferences are latent states that cause choices) look stronger, and the **Behaviorist View** (Preferences are just choices) look empty. It forces the engineers to feel the emptiness of the behaviorist stance when faced with the Rule-Followers.

  **What would change my mind (Scrap this plan if...):**
  If, during the seminar, the group collectively argues that **the Rule-Follower's behavior *is* a valid preference.**
  *   *The Sign:* If an engineer says, "Wait, if they prefer to minimize cognitive load by picking the middle, that *is* their utility function. We just need to include 'position' as a feature in the model."
  *   *The Pivot:* If this happens, **stop the debrief.** Acknowledge that RPT holds if we expand the feature space infinitely. Then pivot the seminar to: "If we need to include *every* context variable (position, framing, mood) to make the preference stable, does the 'Preference' do any work, or is it just a lookup table?"
  *   *Why scrap?* If they successfully absorb the Rule-Follower into the model, the "Mechanism vs. Preference" point fails. You would need to switch to a session on **Goodhart's Law** instead: "If we optimize for this reconstructed utility, how will the user break it?"

  **Final Commitment:**
  This design assumes that for engineers, **prediction** is the ultimate metric of truth. It argues that RPT fails as a predictive tool for *counterfactuals* (risk, new contexts) because it confuses stability of mechanism with stability of desire. If your team believes prediction doesn't matter (only explanation does), this session will feel like a semantic trap. If they care about generalization, it will hurt.
