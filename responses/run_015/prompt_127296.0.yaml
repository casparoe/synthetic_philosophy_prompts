prompt: |-
  Write a deadpan travel-guide entry in the style of a Lonely Planet page, approximately 600 words, describing travel to the Republic of Isotypia, a fictional nation that has adopted Otto Neurath's ISOTYPE as its sole official language, legal code, and administrative protocol. Cover standard guide sections: arrival and customs (all signage, contracts, and government forms use standardized proportional pictograms with no artistic embellishment or linear perspective), local etiquette (communication is restricted to stacked, repeatable icons representing quantities exactly; metaphor, irony, and negation are administratively discouraged), practical tips for the mandatory entry literacy exam (recognizing standardized worker, factory, and crop symbols; interpreting quantity by repetition rather than scale), and a sidebar on the national holiday celebrating the protocol's democratic claim that pictures unite where words divide. The satire should exaggerate real commitments of Neurath's project—the proportional-representation rule, the prohibition on hidden meaning and metaphysical depiction, the rejection of verbal ambiguity, and the Vienna Circle's anti-metaphysical stance—so that a specialist recognizes the parody as philosophically fair. Let the standard objections emerge only through deadpan practical advice: who certifies the symbol designers, which demographic groups consistently fail the visual literacy exam, and whether mastery of icon recognition qualifies one to govern. Include a brief description of an invented bureaucratic visa form rendered entirely in pure pictogram logic with no words. Maintain the cheerful, practical tone throughout, never breaking character to explain the joke.
