answer: |-
  **REPUBLIC OF ISOTYPIA**

  **Getting There & Away**
  Upon landing at Vienna-Neurath International, travelers will immediately note the absence of textual signage. All directions are conveyed via high-contrast, flat-color pictograms adhering to the National Standard of 1936. Do not look for depth or shading; architectural blueprints and airport terminals are rendered in orthographic projection to prevent metaphysical misinterpretation. If you see a picture of a plane pointing left, proceed left. Do not ask for clarification using idioms; airport staff are trained to ignore non-literal queries.

  **Entry Requirements**
  All visitors must complete the *Formular Bild-Visum* prior to border control. This document contains no alphabet. The top row displays a sequence of vessels; color the single steamship representing your mode of arrival. The second row features ten identical human figures; shade exactly the number of persons in your traveling party. The third row depicts suitcases; mark one icon per bag. Note that quantity is strictly determined by repetition, not scale. Shading a single large suitcase to represent five bags will result in immediate detention for "Proportional Fraud." Officials will count your physical luggage against your marked icons. Discrepancies of even one unit are treated as visa violations.

  **Local Etiquette & Communication**
  Isotypia operates on the principle that pictures unite where words divide. Consequently, spoken language is permitted only for essential safety warnings, but all administrative and commercial transactions must be conducted via the *Stack Protocol*. To order two coffees, present a card with two identical cup icons stacked vertically. Do not use hand gestures, which vary culturally.

  Travelers should be aware that negation, irony, and metaphor are administratively discouraged. There is no official icon for "no" or "not." To indicate you do not want soup, you must present an icon of bread. Attempting to cross out a soup icon with a red line is considered an act of visual vandalism. Sarcasm is classified as a Class C misinformation offense. Keep your expressions flat and your iconography literal.

  **The Visual Literacy Exam**
  To exit the airport, all tourists must pass the Mandatory Entry Literacy Exam. You will be asked to identify standardized symbols for *Worker*, *Factory*, and *Grain*, and calculate total output based on icon stacks. Be advised: humanities graduates and children under twelve consistently fail this section due to a tendency toward interpretive abstraction. The exam is administered by the Central Transformations Office, the sole body authorized to certify symbol designers. Mastery of the icon set does not officially qualify one to govern, though the current High Chancellor was formerly the Chief Iconographer, leading many to assume a correlation.

  **Practical Tips**
  *   **Currency:** Coins bear numerical values represented by dots. Count carefully.
  *   **Dining:** Menus list ingredients via picture. If you have an allergy, carry a medical card with a crossed-out icon (private import only).
  *   **Art:** Galleries are sparse. Abstract art is illegal as it obscures the factual reality of the depicted object.

  ***

  **SIDEBAR: Festival of the Transformed Fact**
  **When:** November 10
  **Where:** Capital District (Sector 7)

  The nation's primary holiday celebrates the 1936 adoption of the Picture Language. Parades feature massive floats displaying statistical data regarding grain production and housing units, rendered in accurate scale. The highlight is the *Burning of the Verb*, a ceremonial incineration of obsolete dictionaries. It is a joyous occasion emphasizing democratic access to information. Visitors are encouraged to join the procession, provided they bring a stack of exactly five icons representing their personal happiness. Do not bring six. Do not bring four. The Bureau of Public Morals will be counting.
