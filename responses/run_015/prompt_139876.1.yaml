answer: |-
  Here is a 90-minute session plan designed for your specific audience and constraints. It prioritizes intellectual honesty, structural clarity, and the distinction between settled game theory and contested decision theory.

  ### **Session Overview: The Logic of Correlated Choice**
  **Time:** 90 Minutes
  **Tools:** Whiteboard, Marker (two colors).
  **Goal:** Distinguish Causal Independence from Logical Dependence in a One-Shot Prisoner's Dilemma.

  ---

  ### **Part 1: The Concession (0–20 Minutes)**
  **Objective:** Establish credibility by conceding the standard view before challenging it. Do not attempt to undermine dominance yet.

  1.  **The Matrix (5 mins):** Draw the standard Prisoner's Dilemma payoff matrix on the board.
      *   $C, C = (3, 3)$
      *   $D, C = (5, 0)$
      *   $C, D = (0, 5)$
      *   $D, D = (1, 1)$
  2.  **The OR Analyst's Turn (10 mins):** Invite the operations-research analyst to state the standard case. Let them articulate *strict dominance*.
      *   *Board Note:* Write **"Standard View: Defect is Dominant."**
      *   *Your Stance:* Explicitly agree. "Under Causal Decision Theory, given causal independence, this is mathematically settled. I am not here to argue that your hand moving causes theirs to move."
  3.  **The Problem Statement (5 mins):** Frame the tension.
      *   "If we both follow this dominant logic, we get (1, 1). If we both do the 'irrational' thing, we get (3, 3). The question for tonight is not moral ('should we be nice?') but structural ('is there a reasoning procedure where choosing 3 is the maximizing move?')."

  **Why this order:** If you challenge dominance immediately, the engineers and the OR analyst will categorize you as "soft on math." Conceding the orthodox baseline secures their attention for the deviation.

  ---

  ### **Part 2: The Intuition Pump – Newcomb's Problem (20–35 Minutes)**
  **Objective:** Introduce *logical correlation without causal link* before applying it to the PD.

  1.  **The Setup (10 mins):** Briefly describe Newcomb's Problem.
      *   Box A (transparent): $1,000.
      *   Box B (opaque): $1,000,000 or $0.
      *   Predictor: Has already predicted your choice with 99.9% accuracy.
      *   Choice: One-box (take B) or Two-box (take A + B).
  2.  **The Poll:** Ask for a show of hands. One-boxers vs. Two-boxers.
  3.  **The Lesson (5 mins):**
      *   Two-boxers argue: "My choice cannot causally affect what is already in the box." (Causal Independence).
      *   One-boxers argue: "My choice is *evidence* of what is in the box because we share a reasoning process." (Logical Correlation).
      *   *Board Note:* Draw a distinction: **Causal Influence** (No) vs. **Logical Correlation** (Yes).

  **Placement:** Newcomb belongs here, early-middle. It isolates the specific metaphysical hurdle (acausal correlation) so you don't have to fight the Prisoner's Dilemma payoffs and the metaphysics simultaneously later.

  ---

  ### **Part 3: The Core Example – "The Open-Source Algorithm" (35–55 Minutes)**
  **Objective:** Implement your preferred case study. Avoid clones; use independent instantiations of shared logic.

  1.  **The Scenario (10 mins):**
      *   Two high-frequency trading bots.
      *   Team A and Team B (different companies, no communication, no collusion).
      *   Both bots run the *same* open-source optimization code (Version 4.2).
      *   They face a one-shot pricing dilemma identical to the PD matrix.
      *   They cannot communicate during the trade.
  2.  **The "Shift" (10 mins):** *This is the critical pivot point.*
      *   Explicitly state: "We are not choosing a *move* (Cooperate/Defect). We are choosing a *reasoning procedure*."
      *   *Board Note:* Write **"Choosing the Algorithm, Not the Output."**
      *   Argument: If I choose the algorithm "Cooperate if the other runs Version 4.2," and I know the other runs Version 4.2, then my output correlates with theirs. Not because my signal reaches them, but because $f(x) = f(x)$.
  3.  **The Math Teacher vs. OR Analyst Exchange (5 mins):**
      *   Invite the Math Teacher to comment on symmetry. They will likely say: "If the setup is symmetric, the outcome must be symmetric, so pick the best symmetric outcome."
      *   Invite the OR Analyst to respond. They will likely say: "That stipulates the equilibrium rather than deriving it."
      *   *Your Mediation:* "The Math Teacher is right about the *result* of shared logic. The OR Analyst is right that standard theory excludes logic from the causal chain. Superrationality claims the chain is logical, not causal."

  **Example Constraints:**
  *   **Must Contain:** Isolation (no signaling), Shared Input (the payoff matrix), Shared Process (the code/argument).
  *   **Must Lack:** Metaphysical identity (they are distinct servers), Direct Causation (Bot A does not hack Bot B).

  ---

  ### **Part 4: The Tremble (55–70 Minutes)**
  **Objective:** Stress-test the theory with probability. Address the discontinuity honestly.

  1.  **The Perturbation (10 mins):**
      *   "Suppose Bot B has a hardware glitch. 5% chance it defects randomly (tremble). Or, suppose there is a 10% chance Bot B was written by a team that rejected Version 4.2."
      *   Ask: "Does the recommendation to Cooperate survive?"
  2.  **The Calculation (5 mins):**
      *   Walk through the Expected Utility.
      *   $EU(C) = p(3) + (1-p)(0)$
      *   $EU(D) = p(5) + (1-p)(1)$
      *   Solve for $p$. (With these numbers, if $p < 0.5$, Defect dominates).
  3.  **The Discontinuity (5 mins):** *Be blunt here.*
      *   "If $p=1$ (certainty of shared reasoning), Cooperate is dominant. If $p=0.9$, Defect may become dominant depending on payoffs."
      *   *Honest Answer:* "Yes, the prescription is discontinuous at the limit. Superrationality is brittle. It requires high confidence in the *shared nature of the reasoning*, not just the shared nature of the incentives."
      *   *Why include this:* It prevents the audience from thinking this is a "magic bullet" for cooperation. It shows you are treating it as a rigorous model, not a hope.

  ---

  ### **Part 5: Misconception Map & Live Disputes (70–85 Minutes)**
  **Objective:** Categorize objections and distinguish settled facts from live theory. Use the whiteboard to create a "Map."

  **Draw three columns:** **Misconception**, **Reality**, **Status**.

  1.  **The Golden Rule:**
      *   *Misconception:* "This is just 'do unto others' in math."
      *   *Reality:* Golden Rule is moral/normative. Superrationality is instrumental/selfish. You cooperate *to get the 3*, not to be good.
      *   *Status:* Settled (Category Error).
  2.  **Telepathy/Causation:**
      *   *Misconception:* "This assumes my choice changes their mind."
      *   *Reality:* Assumes my choice *predicts* theirs via shared cause (the reasoning).
      *   *Status:* Settled (Logical, not Causal).
  3.  **Literal Identity:**
      *   *Misconception:* "You have to believe the other person IS you."
      *   *Reality:* You believe the *function* is the same. Distinct instances, same code.
      *   *Status:* Settled (Functionalism).
  4.  **Threshold Cooperativeness:**
      *   *Misconception:* "It just means cooperate if you think they will."
      *   *Reality:* Standard theory says "Defect *regardless* of what you think they will." Superrationality says "Your belief about them is constrained by your choice."
      *   *Status:* **Live Dispute** (See Notes).
  5.  **EDT vs. CDT:**
      *   *Misconception:* "This is just Evidential Decision Theory."
      *   *Reality:* Superrationality is often modeled as EDT, but proponents argue it's a distinct "Functional" approach.
      *   *Status:* **Live Dispute** (See Notes).

  **Handling the OR Analyst:** If they claim this is "refuted as EDT," acknowledge that CDT (Causal Decision Theory) is the academic orthodoxy, but note that CDT loses money in Newcomb problems. Frame it as "CDT is standard, but Superrationality highlights a blind spot in CDT regarding logical facts."

  ---

  ### **Part 6: Closing Question (85–90 Minutes)**
  **Objective:** Test if they understand the *mechanism*, not just the outcome.

  **The Question:**
  > "If you decide to Defect, does the *probability* that the other agent Defects change? If you say 'No,' you are a Causal Decision Theorist. If you say 'Yes,' you have accepted the Superrational premise. Which is it, and why?"

  *   **Why this works:** It forces them to admit whether they view their choice as *evidence* (Superrational/EDT) or *independent* (Standard/CDT). It separates "I want to cooperate" from "I believe my choice correlates with theirs."

  ---

  ### **What to Decline to Explain**
  1.  **Formal Modal Logic:** Do not write out the Gödelian sentences or formal proofs of logical implication. It will bog down the engineers.
  2.  **Functional Decision Theory (FDT) Formalism:** Mention it as the modern academic descendant if asked, but do not teach the calculus.
  3.  **Moral Justifications:** If someone asks "But is it *right*?", decline. "We are discussing efficiency of reasoning, not ethics."

  ---

  ### **PRESENTER NOTES: SETTLED VS. DISPUTED**
  *(Keep this on your lectern/paper. Do not put on the whiteboard as fact.)*

  **SETTLED FACTS (Consensus in Game Theory/Logic)**
  *   **Payoff Structure:** The matrix provided is a valid Prisoner's Dilemma ($T > R > P > S$ and $2R > T+S$).
  *   **Nash Equilibrium:** (Defect, Defect) is the unique Nash Equilibrium under standard assumptions.
  *   **Dominance:** Defect is the strictly dominant strategy under **Causal Decision Theory (CDT)**.
  *   **Causal Independence:** There is no physical signal sent between the agents in the one-shot case.
  *   **Brittleness:** If the correlation probability drops below a certain threshold (dependent on payoffs), the Expected Utility of Defection exceeds Cooperation.

  **LIVE DISPUTES (Contested in Decision Theory/Philosophy)**
  *   **Normative Status:** Is Superrationality a *rational requirement* or a *heuristic*? (Orthodoxy says it is irrational; Proponents say orthodoxy is flawed).
  *   **CDT vs. EDT vs. FDT:** Is Superrationality simply Evidential Decision Theory (EDT)? Or is it the newer Functional Decision Theory (FDT)? Some argue EDT fails in other cases (e.g., "Smoking Lesion"), so if Superrationality collapses into EDT, it inherits EDT's problems.
  *   **The "Why":** Does the correlation arise from *simulation* (I simulate you), *identity* (we are the same type), or *common cause* (we share the same logical laws)? There is no consensus on the metaphysical grounding.
  *   **Group Agency:** Does this argument covertly assume the two agents are a single group agent? If so, is it just "Team Reasoning" relabeled?
  *   **Applicability:** Does this apply to humans? (Humans are not deterministic algorithms). The "Tremble" section highlights this: humans are noisy, making the $p=1$ assumption rarely met in reality.

  ---

  ### **Summary of Flow Dependencies**
  1.  **Dominance must be conceded first.** (Otherwise the OR Analyst disengages).
  2.  **Newcomb must precede the PD application.** (Otherwise the "correlation without causation" concept is too abstract).
  3.  **The "Algorithm" example must precede the "Tremble."** (You must establish the perfect correlation case before breaking it).
  4.  **The Misconception Map must follow the Tremble.** (Once they see the fragility, they will generate objections; categorize them then).
  5.  **The Closing Question relies on the "Shift."** (They must understand they are choosing a reasoning procedure, not just a move, to answer correctly).
