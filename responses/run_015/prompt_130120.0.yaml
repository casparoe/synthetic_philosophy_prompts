  ***

  ### The Double-Entry Sort

  **START:** Imagine a society where everyone believes thrift is holy. But there's no banking system to track savings or loans—no ledgers, no interest rates, just cash under mattresses. Does capital accumulate anyway?

  *   **YES:** Belief is enough; culture moves matter directly. → *Go to Branch A*
  *   **NO:** You need a translation layer (like accounting) to turn values into action. → *Go to Branch B*

  **BRANCH A (Direct Flow):** If no tech is needed, test the limit. Say a culture demands profit-seeking but the law bans interest. Does the culture win?

  *   **YES:** Culture overrides material law. → **Leaf 1**
  *   **NO:** Material law overrides culture. → **Leaf 2**

  **BRANCH B (Translation Layer):** Okay, so you need the ledger. Look at Weber's *Protestant Ethic*. Did he show us the specific admin tech (like double-entry books) that turned prayer into profit, or did he imply the feeling itself moved the money?

  *   **YES:** He showed the tech; the spirit was just the UI. → **Leaf 3**
  *   **NO:** He implied the feeling; the tech was incidental. → **Leaf 4**

  ***

  ### The Leaves

  **Leaf 1: The Idealist Purist**
  *Position:* Strong Cultural Causation.
  *Awkward Commitment:* You have to explain why holy thrift didn't make medieval monks capitalists without invoking magic.

  **Leaf 2: The Materialist Reductionist**
  *Position:* Materialist Reduction.
  *Awkward Commitment:* You have to admit every revolution in ideas was just a subsidy change in disguise.

  **Leaf 3: The Institutional Weberian**
  *Position:* Translation-Layer View.
  *Awkward Commitment:* You have to argue the most famous book on religion is actually about accounting software.

  **Leaf 4: The Correlation Skeptic**
  *Position:* Weber Confused Correlation with Design.
  *Awkward Commitment:* You have to claim the biggest theory in social science is just a coincidence story.

  ***

  **NOTE ON INDIFFERENCE:**
