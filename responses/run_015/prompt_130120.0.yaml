prompt: |-
  hey, im a journalist covering science and ideas, and im working on a feature about whether culture can actually cause big economic shifts or if its just post-hoc storytelling. im using Weber's protestant ethic thesis as the central case, but im bored with the usual materialism-vs-idealism split.

  can you design a sorting quiz — basically a decision tree — that sorts readers by thier actual commitments on "can culture be a cause?" rather than by which camp they say they like? i want it injected with a niche framing im calling the "double-entry problem": the idea that values only become causally efficent when there's an institutional bookkeeping mechanism (like double-entry accounting) that translates belief into calculable economic action. so the first branch should ask whether culture needs that kind of "translation layer" to do real work.

  from there, split on whether Weber actually identified such a layer in protestant ethics, or whether he just assumed values flow straight into behavior without institutional mediation. use concrete cases for each node — for example, "if a society praises thrift but lacks banking reform, can it still accumulate capital?" or "if an ethic demands profit-seeking but the law bans interest, does the culture win?" — so people answer without knowing the label.

  each leaf should carry a position name (or "unnamed" if the combo is unoccupied) plus one sentence on its most awkward commitment. flag any pair of leaves your tree cant really seperate. audience is smart general readers, not grad students; dont include bibliographies or citation lists, since i want the logic to stand alone without web access. and please keep the tone casual — like im emailing an editor with a typo or two in the draft, maybe "seperate" instead of separate, "recieve" where it belongs. make sure the tree covers strong cultural causation, materialist reduction, the translation-layer view, and the view that Weber confused correlation with institutional design.
