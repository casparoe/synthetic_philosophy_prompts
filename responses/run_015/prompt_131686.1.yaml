answer: |-
  1. The institutional boundary and its conceptual tension

  In Central and Northern Europe, a strict institutional boundary separates philosophical counselling from clinical mental-health care. Philosophical practitioners address existential orientation and value conflicts but are ethically barred from diagnosing or treating mental disorders. Conversely, psychiatric frameworks classify profound crises of meaning—sustained questioning of life's point—as symptoms of conditions like depressive episodes, eligible for medical treatment and insurance reimbursement. This division generates a conceptual tension regarding the ontological status of existential distress. If a crisis of overall meaning constitutes a genuine harm comparable to physical injury or cognitive dysfunction, restricting its treatment to non-medical counsellors appears negligent. However, if such a crisis represents merely a conceptual confusion or a philosophical puzzle rather than a pathology, medicalising it constitutes a category error. The boundary thus hinges on an unstated assumption about whether the search for global meaning is a legitimate object of medical intervention or a matter of rational clarification.

  2. Reconstruction of the implicit theory

  The institutional boundary implicitly presupposes a cognitivist or clarificatory theory of meaning, closely aligning with Moritz Schlick's positivist-influenced account. On this view, asking for the "meaning of life" as a global totality rests on a linguistic or conceptual misunderstanding; meaning inheres only in particular activities pursued for their own sake, akin to play. Consequently, existential distress is not interpreted as a direct harm to well-being in the medical sense, but rather as a state of confusion or disorientation regarding value structures. The suffering associated with meaninglessness is deemed secondary to the intellectual error of seeking a singular, overarching purpose where none exists. Therefore, the appropriate intervention is conceptual clarification—redirecting attention toward intrinsically valuable moments—rather than clinical therapy aimed at symptom reduction. This theory posits that well-being is secured not by curing a deficit of meaning, but by correcting the false expectation that life must possess a unified teleological point. The separation remains coherent only if existential crisis is categorized as a failure of understanding rather than a failure of psychological function, thereby reserving medical jurisdiction for functional impairment while assigning philosophical jurisdiction to normative confusion. This protects medicine from treating normal philosophical questioning as disease, while protecting philosophy from practising medicine without license.

  3. Strict presupposition versus mere compatibility

  Strictly speaking, the practice presupposes only that a crisis of meaning is distinct from psychopathology. It requires a distinction between functional impairment, which defines the domain of medicine, and normative disorientation, which defines the domain of philosophy. It does not strictly require Schlick's specific verificationist claim that global meaning is a nonsense question. That specific metaphysical stance is compatible but not necessary. The system could accommodate an objective teleological view where philosophy discerns true purpose and medicine treats the depression resulting from failing to achieve it. Alternatively, it could accommodate radical constructivism, where philosophy assists in constructing values while medicine stabilizes the mood required to do so. The essential presupposition is merely jurisdictional: that the content of the distress, specifically questions of value, is separable from the mechanism of the distress, such as neurochemical or severe psychological dysfunction. As long as the institution maintains that questioning life's point is not itself a disease, the boundary holds, regardless of whether meaning is viewed as discovered, created, or dissolved by the individual agent.

  4. Rival licensing accounts

  Rival philosophical theories can indeed license the same institutional division without adopting Schlick's dissolution of the question. An objective teleological theory could justify the split by positing that philosophy identifies the correct ends of human life, while medicine treats the psychological impediments preventing their pursuit. Here, the crisis is a mismatch between life and objective good, remedied by guidance, whereas the accompanying despair is a medical symptom. Similarly, a radical constructivist view could maintain the boundary by framing meaning as a subjective project; philosophical counsellors facilitate the construction of values, while clinicians treat the incapacitating anxiety that arises during this process. Even a purely instrumental view of meaning, where meaning serves social cohesion, could support the division: philosophy adjusts the individual's narrative to fit social roles, while psychiatry manages the breakdown of agency. In all these rival accounts, the core justification remains the distinction between the normative task of defining or finding value and the clinical task of restoring functional capacity, preserving the separation despite divergent metaphysical commitments regarding the nature of meaning itself.

  5. Implications of replacing the view

  If we replaced the presupposed view with one treating a crisis of overall meaning as a direct harm to well-being on par with bodily injury, the institutional landscape would shift dramatically toward medicalisation. Professional jurisdiction would migrate entirely to clinical psychology and psychiatry, rendering non-medical philosophical counsellors liable for negligence if they treated severe cases without medical licensing. Funding mechanisms would change to reimburse specific therapeutic protocols for existential disorder, likely requiring standardized diagnostic codes currently absent from major classifications. Diagnostic practice would evolve to categorize meaninglessness as a primary condition rather than a secondary symptom of depression, necessitating biomarkers or standardized psychometric tests for meaning deficiency. Consequently, the space for non-pathologizing existential inquiry would vanish; questioning life's purpose would be inherently framed as a symptom requiring cure rather than a philosophical opportunity. This would eliminate the current distinction between clarification and treatment, subsuming all existential distress under the mandate of health insurance and clinical ethics, thereby transforming a philosophical problem into a public health priority.
