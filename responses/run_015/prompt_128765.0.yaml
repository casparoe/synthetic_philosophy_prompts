answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes

  **Question:**
  Bradley's Regress argues that if a relation $R$ is a distinct constituent of a fact alongside particulars $a$ and $b$, a further relation is required to link $R$ to its relata, generating an infinite vicious regress. Standard responses often attempt to dissolve this by positing internal relations or brute unity. Consider instead a functionalist account of predication, where the copula is treated not as a relational constituent but as a function mapping a property to an object (e.g., the structure $F(x)$ rather than $aRb$).

  Does this functional model genuinely dissolve Bradley's Regress by eliminating the need for a distinct unifying entity, or does it merely relocate the problem to the meta-level of how the function and its argument are jointly instantiated? Evaluate whether this approach secures the intuitive unity of the proposition without implicitly reintroducing a 'relating relation' in disguise. Your answer must explicitly address the ontological status of the function itself and the mechanism of its application.

  ***

  **Model Answer**

  Bradley's Regress arises from the intuition that if the constituents of a proposition are merely aggregated, an external unifier is required to bind them, which in turn requires unifying, ad infinitum. The functionalist account attempts to bypass this by re-categorizing the predicative element. On this view, a property $F$ is not an object waiting to be related to $x$; it is essentially unsaturated, functioning as a mapping rule that yields a truth-value or a state of affairs when applied to an argument $x$.

  The first move in defending this account is to claim that functional predication eliminates the need for a separate unifying entity. In a relational model ($aRb$), $R$ is ontologically coordinate with $a$ and $b$, inviting the question of what links $R$ to them. In the functional model ($F(x)$), the "copula" is not a third thing. The unity is internal to the category of the function. Just as a mathematical function does not need a further connector to operate on a number, a metaphysical function does not need a relation to apply to an object. The unsaturated nature of $F$ implies that its very identity is constituted by its capacity to combine with $x$. Therefore, the demand for a further unifier is a category mistake; the function *is* the combining principle, not a component requiring combination.

  However, the second move involves a robust objection: functional application itself requires an account of how the function and its argument are jointly instantiated. Even if $F$ is unsaturated, the actual obtaining of the state of affairs—the fact that $F$ is *applied* to $x$—seems to be a distinct ontological occurrence. If the function $F$ and the object $x$ exist, what ensures that they are currently in a state of application rather than merely being listed together? If "application" is an event or a higher-order fact, we face a regress of application. To say "$F$ applies to $x$" seems to posit a link between the function and the argument. If this link is real, Bradley's problem returns at the meta-level: what links the function to the application? If the link is not real, the unity of the proposition remains unexplained. The functionalist may argue that application is primitive, but this risks obscuring the problem rather than solving it.

  The third move requires a reasoned judgment on whether this strategy secures propositional unity or relocates the difficulty. Ultimately, the functional account does not dissolve Bradley's Regress; it relocates it. It successfully demonstrates that treating the copula as a relation is a specific, perhaps flawed, way of modeling predication. By shifting to functions, we avoid the specific regress of *relating relations*. However, we inherit the regress of *instantiation*. The mystery of how an unsaturated entity hooks onto a saturated one is metaphysically isomorphic to the mystery of how a relation hooks onto relata. The functional view secures unity only by treating "saturation" as a brute, unanalyzable primitive. This stops the regress, but at the cost of admitting that the fundamental mechanism of propositional unity is inexplicable. Thus, the functional model offers a superior grammatical analogy but fails to provide a deeper ontological resolution. It clarifies that the unifier is not an entity, but it cannot explain how non-entity unifiers operate without invoking a primitive form of togetherness that remains vulnerable to the same intuitive pressures that generate Bradley's Regress initially.

  ***

  **Marking Scheme**

  **Total Points:** 100

  **1. The Functionalist Claim (25 Points)**
  *   **20–25 pts:** Clearly articulates the view that the copula is an unsaturated function, not a relational constituent. Explains that unity is internal to the function's nature, rendering a third unifying entity unnecessary.
  *   **10–19 pts:** Identifies the functional view but fails to explain *why* it supposedly avoids the regress (e.g., treats it merely as notational change).
  *   **0–9 pts:** Misunderstands the functional model, treating it as a standard relational view.

  **2. The Meta-Level Objection (25 Points)**
  *   **20–25 pts:** Explicitly argues that "functional application" creates a new unity problem. Identifies that the joint instantiation of function and argument requires explanation, potentially restarting the regress.
  *   **10–19 pts:** Notes there is a problem but fails to locate it specifically at the level of application/instantiation.
  *   **0–9 pts:** Claims the functional view is immune to further questioning without justification.

  **3. Reasoned Judgment on Unity (25 Points)**
  *   **20–25 pts:** Concludes that the regress is relocated, not dissolved. Argues that "unsaturatedness" is a brute primitive that stops the regress only by fiat, failing to fully explain propositional unity.
  *   **10–19 pts:** Offers a judgment but lacks reasoning (e.g., simply asserts one side wins).
  *   **0–9 pts:** Fails to reach a conclusion or contradicts previous analysis.

  **4. Conceptual Clarity and Structure (15 Points)**
  *   **12–15 pts:** Argument is logically sequenced, terminology is precise (e.g., distinguishing "entity" from "function"), and prose is clear.
  *   **6–11 pts:** Argument is understandable but occasionally vague or disorganized.
  *   **0–5 pts:** Difficult to follow; significant ambiguity in key terms.

  **5. Avoidance of Specific Conceptual Pitfall (10 Points)**
  *   **10 pts:** The answer successfully distinguishes the functional view from other ontological categories.
  *   **0 pts:** **The Common Mistake:** The student conflates the functional view with a **trope-theoretic account of predication**.
      *   *Grader Note:* Deduct all 10 points if the student argues that the function is a "particularized property instance" or a "mode" that adheres to the substance. The functional view relies on *unsaturatedness* (completeness via argument), whereas trope theory relies on *particularity* (properties as concrete particulars). Conflating these suggests the student treats the function as an entity that needs sticking, which undermines the specific functionalist defense against Bradley.

  **General Guidance:**
  *   Answers should not be penalized for taking a definitive stance (e.g., arguing it *does* dissolve the regress) provided the argument is rigorous and addresses the meta-level objection.
  *   Citations are not required; evaluation is based on conceptual coherence.
