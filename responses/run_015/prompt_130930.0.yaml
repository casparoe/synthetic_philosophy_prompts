answer: |-
  # The Structured Defect Comparison (SDC) Selection Protocol
  **Timebox:** 20 Minutes | **Users:** Co-Facilitators | **Escalation:** Lead Facilitator (You)

  ## Phase 1: Primary Figure & Defect Window (5 Minutes)
  **Goal:** Verify the primary text supports the methodology.

  1.  **Q:** Is there a specific, namable virtue (e.g., "Strategic Patience," not just "Goodness") clearly demonstrated in the text?
      *   *Sufficient Answer:* Yes, specific noun phrase identified.
      *   *Stop/No:* If virtue is vague or generalized.
  2.  **Q:** Is there a documented failure/limitation (Defect Window) directly linked to the *exercise* of that virtue?
      *   *Sufficient Answer:* "The virtue caused the failure" or "The virtue blinded them to X." (e.g., "Patience led to complicity.")
      *   *Stop/No:* If the failure is incidental (e.g., "He was brave but also caught the flu").
  3.  **Q:** Is the defect documented in primary/secondary sources, not rumor?
      *   *Sufficient Answer:* Citations available.
      *   *Stop/No:* If based on legend or hearsay.

  ## Phase 2: The Pairing (5 Minutes)
  **Goal:** Ensure the second figure illuminates the virtue through contrast, not just difference.

  4.  **Q:** Does the second figure operate in a similar context regarding the *same virtue*?
      *   *Sufficient Answer:* Yes, both faced decisions requiring [Virtue].
      *   *Stop/No:* If contexts are too disparate (e.g., comparing a soldier's courage to a teacher's patience).
  5.  **Q:** Is the second figure's defect *structurally different* but related to the same tension?
      *   *Sufficient Answer:* Figure A failed by excess (e.g., Recklessness); Figure B failed by deficit (e.g., Cowardice).
      *   *Stop/No:* If both failed in the exact same way (no contrast) or in unrelated ways (no synthesis).

  ## Phase 3: Ethical & Pedagogical Safety (5 Minutes)
  **Goal:** Prevent cynicism, hagiography, or normalization of harm. **[JUDGMENT HEAVY]**

  6.  **Q:** Does the defect window imply the defect was *necessary* for the virtue?
      *   *Sufficient Answer:* No. The defect is a cost/limit, not a prerequisite.
      *   *Stop/No:* If the narrative suggests "You must be cruel to be just."
      *   **ESCALATE TO LEAD:** If the defect involves harm to vulnerable populations (abuse, complicity in oppression). *Facilitators cannot decide this alone.*
  7.  **Q:** Will the defect distract from the virtue or consume the discussion?
      *   *Sufficient Answer:* No, the defect is a lens, not the image.
      *   *Stop/No:* If the defect is so morally heavy it triggers shutdown or outrage rather than analysis.

  ## Phase 4: The Discussion Question (5 Minutes)
  **Goal:** Ensure the output drives analysis, not admiration.

  8.  **Q:** Does the draft question ask participants to locate the virtue *between* the figures?
      *   *Sufficient Answer:* Question asks "How do we navigate between X and Y?"
      *   *Stop/No:* Question asks "Who was better?" or "What can we learn from [Hero]?"
  9.  **Q:** Is the question answerable without resolving the moral ambiguity?
      *   *Sufficient Answer:* Yes, the tension remains.
      *   *Stop/No:* If the question implies a clear "right" answer exists.

  ***

  ## ⚠️ Protocol Limitations & Judgment Markers

  **Where Judgment Cannot Be Eliminated:**
  *   **Phase 3, Q6 (Harm vs. Flaw):** The protocol cannot calculate moral weight. Determining whether a defect is a "teachable limitation" or "disqualifying harm" is a values decision. **This must be escalated to the Lead Facilitator.**
  *   **Phase 3, Q7 (Distraction Level):** Facilitators must guess group capacity. What analyzes well with adults may traumatize or distract a mixed community group.

  **If The Group Wants Inspiration:**
  *   **This Procedure Will Fail.** SDC is designed to deconstruct heroism. If the group's goal is "uplift" or "motivation," this protocol will produce cynicism or confusion. The procedure cannot be tweaked to provide inspiration; it is an analytical tool, not a devotional one. **If inspiration is the goal, abandon SDC.**

  ***

  ## Case Applications

  ### Case 1: The Abolitionist (Cruel) vs. The Local Organizer (Ineffective)
  *   **Virtue:** Justice / Conviction.
  *   **Defect A:** Personal cruelty (abuse of family/subordinates).
  *   **Defect B:** Ineffectiveness due to excessive kindness.
  *   **Protocol Run:**
      *   Phase 1: Pass (Virtue clear, defect documented).
      *   Phase 2: Pass (Contrasting defects on effectiveness/kindness).
      *   Phase 3, Q6: **ESCALATE.** "Serious personal cruelty" involves harm to vulnerable parties.
      *   Phase 3, Q7: **FAIL.**
  *   **Decision:** **REJECT.**
  *   **Reasoning (The Answer You Won't Like):** While this looks like a perfect structural pair, the "Cruelty" defect is morally weightier than the "Virtue." In a community center setting, asking participants to analyze "cruelty" as a structural defect of "justice" risks normalizing abuse as a necessary cost of righteousness. It creates a False Dichotomy: *To be effective, you must be cruel; to be kind, you must be useless.* This does not illuminate the virtue of Justice; it obliterates it. The defect overshadows the lesson.
  *   **Outcome:** Drop the Abolitionist. Find a figure whose defect is *rigidity* or *burnout*, not cruelty.

  ### Case 2: The Religious Legend (No Documented Failure)
  *   **Virtue:** Holiness / Devotion.
  *   **Defect A:** None recorded (Hagiography).
  *   **Protocol Run:**
      *   Phase 1, Q2: **FAIL.**
  *   **Decision:** **REJECT.**
  *   **Reasoning:** The SDC method requires a "Defect Window." If the record contains no failure, you are forced to invent one (fiction) or ignore the record (dishonesty). This forces the workshop into hagiography, which violates the core premise.
  *   **Outcome:** Select a different figure with documented human limitations, or switch methods entirely.

  ### Case 3: The Political Leader (Strategic Patience = Complicity)
  *   **Virtue:** Strategic Patience.
  *   **Defect A:** Complicity in harmful policy.
  *   **Protocol Run:**
      *   Phase 1: Pass.
      *   Phase 2: Pass (Assuming a paired figure exists).
      *   Phase 3, Q6: **FAIL / ESCALATE.**
  *   **Decision:** **REJECT.**
  *   **Reasoning:** This fails the "Necessary Defect" safety check. Framing complicity in harm as a "defect window" tied to patience implies that harm is an acceptable structural cost of patience. In a community context, this teaches that marginalized suffering is a valid trade-off for strategic gain. The procedure flags this because the defect (harm) is not a limitation of the virtue, but a violation of ethics that obscures the virtue.
  *   **Outcome:** Do not use. The pedagogical risk of normalizing complicity outweighs the analytical value.

  ***

  ## Lead Facilitator Handoff Log
  *Use this section when Phase 3 triggers an Escalation.*

  | Case | Issue | Fact Finding (Facilitator) | Value Judgment (Lead) |
  | :--- | :--- | :--- | :--- |
  | **1** | Cruelty vs. Virtue | Letters confirm abuse. | **Is this teachable or toxic?** |
  | **3** | Complicity vs. Patience | Policy records confirm harm. | **Does this normalize harm?** |

  **Note to Lead:** If you override the Phase 3 "Reject" on Case 1 or 3, you are moving from *Analysis* to *Values Instruction*. Ensure the community center's mission supports you dictating that specific moral trade-offs are acceptable.
