  Your proposition P is intellectually provocative because it targets the *implicit* causal theory embedded in analogies, rather than just the surface-level label. However, my credence in P as strictly formulated is **0.42**. While you are correct that mechanisms are the active engine of expectation, the cognitive and rhetorical coupling between "precedent" and "mechanism" is so tight that treating them as independent variables (as your test requires) is often impossible. Your friend is likely correct that case-selection is the upstream bottleneck because the label *stipulates* the mechanism; however, you are right that making the mechanism explicit is the only viable remedy. The low credence reflects the conceptual fragility of the test rather than the invalidity of your intuition.

  ### Decomposition

  1.  **Separability of Stages (0.50):** *Necessary.* Cognitive schema theory suggests labels like "Munich" trigger scripts automatically, meaning mechanism-selection is often not a distinct deliberative stage but an implicit feature of the label itself.
  2.  **Predictive Weight of Mechanism (0.70):** *Contributing.* Conditional on a mechanism being explicitly articulated, it does carry more predictive weight than the label alone, supporting your intuition that mechanisms drive expectations.
  3.  **Independence of Variations (0.35):** *Necessary.* Your test requires holding the precedent fixed while swapping the mechanism, but precedents are semantically constituted by their mechanisms (e.g., "Munich" *means* appeasement fails), making Variation 2 conceptually unstable.
  4.  **Menu/Politics Story (0.60):** *Alternative Explanation.* Your friend's view that rhetorical availability drives case-selection is strong; if the menu is constrained politically, case-selection is the true bottleneck, and mechanisms are indeed post-hoc rationalizations.
  5.  **Function of Precedents (0.80):** *Definitional.* Historical analogies in deliberation often serve coalition coordination and legitimation rather than prediction, meaning "epistemic distortion" may be the wrong metric for their primary function.

  ### Combination Logic
  I treat the "Necessary" terms (Separability, Independence) as caps on the maximum possible credence; since Independence is low (0.35), the headline cannot exceed that range significantly without charitable reinterpretation. The "Contributing" term (Predictive Weight) pulls the number up, acknowledging your core insight, while the "Definitional" term (Function) penalizes the framing for potentially measuring the wrong outcome. The final figure is a weighted average heavily discounted by the Independence and Function constraints.

  ### Disagreement Locus
  You and your friend most likely disagree on **Separability/Independence**: you treat the mechanism as a downstream variable that can be critiqued independently of the label, whereas she treats the mechanism as semantically embedded in the label, making case-selection the decisive causal lever.

  ### Weakest Step
  The most vulnerable step in your framing is the **Independence of Variations**, specifically the assumption that a group can coherently maintain a precedent label ("This is Munich") while rejecting its constitutive causal mechanism ("Concessions will work"), as this often dissolves the analogy entirely.

  ### Most Decisive Evidence
  Transcript analysis of crisis deliberations (e.g., ExComm during Cuba) showing whether participants argue primarily about the *validity of the label* or the *validity of the causal story* once the label is invoked; if debates collapse when the mechanism is challenged, Independence is false.

