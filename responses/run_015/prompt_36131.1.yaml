answer: |-
  To construct a criterion of demarcation that functions for public schools and regulatory agencies rather than seminar rooms, we must first abandon the idea that we are judging static propositions and instead accept that we are judging the conduct of a community. This decision resolves the asymmetry you noted between theories and practices, because it allows us to acknowledge that a formally scientific theory can be handled unscientifically, just as fruitful work can occur under metaphysical assumptions that are not themselves falsifiable. If the unit of analysis is the research practice rather than the theory, the first desideratum becomes a requirement for empirical risk-taking. A scientific community must formulate claims that could, in principle, be shown false by evidence, but this must be understood dynamically rather than logically. This handles the tension regarding historical science and Newtonian mechanics because it does not demand that a theory be abandoned the moment an anomaly appears. Instead, it demands that the community treats anomalies as problems to be solved rather than secrets to be hidden. The motivation here is practical: a regulatory agency cannot rely on a body of research that treats counter-evidence as irrelevant, even if the core theory remains protected for a time. This requirement is non-negotiable for the purpose at hand because without the possibility of empirical constraint, there is no mechanism for a regulator to distinguish between a genuine discovery and a persistent delusion.

  The second requirement addresses the statistical corner and the reality of auxiliary hypotheses. Since modern science rarely faces a single refuting observation, the criterion must demand that the community employs explicit error-statistical methods to control for noise and model uncertainty. It is not enough to fit data; the practice must demonstrate a capacity to detect errors when they are present. This dissolves the problem of auxiliary hypotheses absorbing anomalies by shifting the burden to the justification of those auxiliaries. If an anomaly is explained away by adjusting an error model or an auxiliary assumption, the criterion requires that this adjustment be independently testable or justified by prior evidence, rather than invented solely to save the core claim. This is motivated by the need to prevent regulatory capture by industries that produce complex models designed to obscure harm rather than reveal it. Like the first requirement, this is non-negotiable because without error control, data becomes malleable clay rather than a constraint on belief.

  The third requirement, which I argue does the most work in excluding candidate criteria, is the prohibition of degenerative problem shifts or ad hoc immunization. A scientific practice must exhibit progressivity, meaning that adjustments to the theory or its protective belt should lead to novel predictions or expanded explanatory power, not merely retrospective accommodation of known facts. This is where most pseudosciences fail, not because they are unfalsifiable in principle, but because they constantly retreat into reinterpretation when challenged. The motivation is to distinguish between a field that is growing and one that is stagnating while maintaining the appearance of activity. I classify this as non-negotiable for the specific purpose of curriculum and regulation because these institutions need to invest in knowledge that expands reliable control over the world, not knowledge that merely defends itself. In contrast, a requirement that often gets dressed up as rational but is actually a prejudice of one camp is the demand for ontological parsimony or metaphysical naturalism. While many scientists prefer naturalistic explanations, making this a formal criterion would exclude legitimate historical sciences or instrumental models that are highly reliable without committing to a specific metaphysics. For a public school board, the reliability of the method is the non-negotiable asset, not the philosophical commitment of the practitioners.

  The fourth desideratum concerns usability by non-experts. Since judges and school boards cannot evaluate the technical validity of string theory or bite-mark analysis themselves, the criterion must rely on observable institutional behaviors rather than internal logical consistency. The practice must demonstrate transparency, peer critique, and a mechanism for correcting errors that is external to the immediate proponents of the claim. This is motivated by the division of cognitive labor in a democratic society; the public relies on proxies for truth because they cannot verify the truth directly. This requirement is non-negotiable for the regulatory context because a criterion that requires a judge to understand quantum chromodynamics is useless in a courtroom. However, we must be careful not to confuse this with an appeal to consensus, which is a prejudice. Consensus can be wrong, but the presence of an open channel for dissent and correction is the structural feature that matters. Therefore, the criterion demands evidence of active criticism being addressed, not evidence of universal agreement.

  When we score the traditional philosophical frameworks against these desiderata, falsificationism fails on the second and third counts because it is too brittle regarding auxiliary hypotheses and historical anomalies, often condemning successful science as unscientific due to its logical rigor. Lakatos's picture of research programs performs better because it accommodates the protective belt and focuses on progressive versus degenerative shifts, satisfying the third requirement well, but it struggles with the fourth requirement because identifying a degenerative shift often requires expert hindsight that a school board does not possess. A Kuhnian appeal to puzzle-solving normal science satisfies the practice-oriented first requirement and handles the historical tension well, but it risks failing the non-negotiable demand for empirical risk-taking if normal science is interpreted as mere conformity within a paradigm without external constraint. Ultimately, the most robust approach for public policy combines the Lakatosian focus on progressivity with the institutional transparency required for non-expert verification, ensuring that the demarcation rests on how knowledge is handled rather than what it claims to be.
