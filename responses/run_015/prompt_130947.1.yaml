prompt: |-
  I'm delivering the opening remarks this Thursday at our neighborhood assembly about the old riverbank lot. Roughly half the audience are residents and activists split between those who want affordable housing built and those who want the land left as open green space. The other half are graduate students in urban ethics and two city mediators who have studied comparative epistemology, so they will notice if I misrepresent the philosophical ideas. I have no formal academic training — I'm just a longtime resident who read about Jain anekāntavāda, the doctrine of many-sided truth, and kept returning to it.

  I want the speech to avoid declaring a winner. Instead, I want anekāntavāda — particularly the view that every claim is made from a specific standpoint (naya) and that reality can outstrip any single yes-or-no judgment, including the idea that some situations are inexpressible within our present categories — to do real structural work. I've been thinking that the future of this lot might be exactly such an inexpressible case: neither "development" nor "preservation" fully captures it, and our debate language may be inadequate. The speech should embody this framework, not decorate itself with it. Please do not include a bibliography, reading list, or citations to specific texts. I also want to avoid the common misreading of anekāntavāda as simple "everyone is equally right" relativism.

  Please work as both a careful philosophical thinker and an experienced speechwriter. Before drafting, think step by step and briefly brainstorm how this framework will constrain what can and cannot be said.

  Please organize your response exactly as follows:

  1. Brief setup of the occasion and audience (~100 words)
  2. Pre-writing notes: identify three specific structural uses of anekāntavāda in the speech — for instance, how claims will be qualified by standpoint, how resolution will be deliberately withheld, and how the inexpressible mode applies to the lot's undetermined future (~150 words)
  3. The speech itself (~650 words). Write it in my voice: earnest, non-academic, precise. It should address both sides without endorsing either as fully correct, and it should close by honoring the inexpressible seventh mode rather than calling for compromise or a vote.
  4. Commentary on structural choices (~200 words): explain precisely where the philosophical idea shaped the rhetoric, how the mixed audience is served, and what misinterpretation of many-sided truth was deliberately avoided.
