      *   **Specific Scenes to Cover:** The pool party (plastics conversation), the hotel (affair with Mrs. Robinson), the church ending.
      *   **Key Questions:** Is the older generation a unified kind or individual careerists? Is Benjamin's rebellion a performance of generational identity or just personal confusion? Is the film documenting or manufacturing a cohort experience?
