answer: |-
  **JOINT STATEMENT ON THE NORMS OF ASSERTION**

  **Signatories:** The Epistemic Norms Working Group (Knowledge-Norm Faction & Truth-Norm Faction)
  **Date:** October 26, 2023
  **Subject:** Locus of Agreement and Structured Disagreement Regarding the Constitutive Rules of Assertion

  Following a period of adversarial collaboration, the undersigned parties submit this statement to clarify the current state of our debate. We acknowledge that while our explanatory frameworks differ, our commitment to the rigor of the inquiry is shared. We have identified a stable core of agreed-upon data and principles, and we have isolated the specific theoretical junctures where our views diverge.

  ### I. Agreed-Upon Claims

  Both factions endorse the following propositions as the common foundation for future research:

  1.  **Non-Pragmatic Normativity:** The rule governing assertion is not merely a matter of etiquette, conversational maxims, or social convention. It is a normative constraint intrinsic to the act itself; violating it renders the act defective *qua* assertion, not just rude.
  2.  **Shared Data Points:** The "Lottery Case" (asserting a ticket will lose based on odds alone) and the "Lucky True Case" (asserting a truth based on a guess or flawed reasoning that happens to be right) constitute shared data that any adequate theory must explain. Both sides agree these cases elicit negative normative judgments.
  3.  **Validity of Epistemic Criticism:** The criticism "That is true, but you had no reason to say it" is a legitimate and coherent criticism of an asserter. Both sides agree that truth alone, absent proper epistemic support, is insufficient for a *proper* assertion, though we disagree on whether this insufficiency stems from the constitutive norm itself (Knowledge) or a derivative norm (Truth + Prudence/Justification).

  ### II. Locus of Dispute

  The following table outlines the specific theoretical disagreements that remain. For each row, we have identified a test case, the competing predictions, and an assessment of whether the disagreement is substantive or verbal.

  | Dispute | Test Case / Evidence | Knowledge-Norm Prediction | Truth-Norm Prediction | Nature of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Group Assertion Licensing**<br>*(Who must hold the epistemic position?)* | **The Pooled-Lab Result:** A research lab issues a press release asserting $p$. The data supports $p$, but no single member understands the full derivation; knowledge exists only in the pooled data. | **Licensed.** The *collective* possesses knowledge via pooled justification. The spokesperson is a mouthpiece for the group's epistemic state. If the group knows, the assertion is proper. | **Licensed (but for different reasons).** The assertion is proper primarily because $p$ is *true*. The group's epistemic state is relevant only insofar as it reliably tracks truth. If $p$ were false, the group's "knowledge" would not save the assertion. | **Substantive.** Disagreement concerns whether the norm attaches to the *epistemic state* (which can be distributed) or the *factive status* of the content. |
  | **(b) Non-Human Systems**<br>*(Does the norm apply without belief?)* | **The Calibrated Alert:** An automated tsunami warning system outputs "Tsunami Imminent" based on sensor data (excellent evidence). It has no beliefs. | **Not Assertion.** The system cannot know. Therefore, it cannot assert. It merely signals. The norm of assertion does not reach it because the necessary condition (a knower) is absent. | **Not Assertion (Conceptual).** The system does not undertake a *commitment* to truth, so it is not asserting. However, if we *did* treat it as assertion, Truth would be the only bar; the lack of belief would be irrelevant to the norm's satisfaction. | **Largely Verbal.** Disagreement turns on the definition of "assertion" (requires agency/commitment). Substantive disagreement remains on whether *Truth* alone could suffice if agency were present without belief. |
  | **(c) Weight of Ordinary Judgments**<br>*(Methodology of intuitions)* | **The Unconfident Truth-Teller:** A speaker asserts $p$. $p$ is true. The speaker admits, "I'm just guessing, I don't know." Ordinary observers say, "You shouldn't have said that." | **Tracks Knowledge.** The ordinary judgment is evidence that the constitutive rule is Knowledge. Observers object because they detect the lack of knowledge, even if they cannot articulate it. | **Tracks Risk/Prudence.** The ordinary judgment is evidence that the rule is Truth, supported by secondary norms of responsibility. Observers object because the *risk* of falsehood was too high, not because knowledge was strictly missing. | **Substantive.** Disagreement concerns the *best explanation* of folk intuitions. KN treats intuitions as direct tracking of the norm; TN treats them as tracking a cluster of norms (Truth + Prudence). |

  ### III. Clarification on Verbal Disputes

  We acknowledge that a portion of our historical conflict stems from terminological divergence regarding the phrase "Constitutive Norm."

  *   **The Knowledge Faction** uses "Constitutive Norm" to mean the *unique* rule that distinguishes assertion from other speech acts (e.g., guessing).
  *   **The Truth Faction** uses "Constitutive Norm" to mean the *primary* rule of correctness, while allowing that other rules (justification, belief) are necessary for the act to be *responsible*, even if not strictly constitutive.

  We agree that if the Knowledge Faction admits that Truth is a necessary condition for Knowledge, and the Truth Faction admits that Justification is a necessary condition for Responsible Assertion, the extensional difference between our views in standard cases is minimal. Our remaining disagreement is explanatory: **Does justification constrain assertion because it is part of the definition of the act (KN), or because it is the best means to ensure the act satisfies its primary goal of Truth (TN)?**

  ***

  **Signed,**

  *Dr. A. Williamson (Knowledge-Norm Representative)*
  *Dr. B. Weiner (Truth-Norm Representative)*
