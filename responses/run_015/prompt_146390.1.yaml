prompt: |-
  I'm taking an upper-level seminar on Communication and Evolution — philosophy department, cross-listed with biology — and each of us has been asked to design and run one 75-minute session for the rest of the class. There are about twenty of us, mixed backgrounds, and the room has tables, index cards, a deck of cards, and no reliable projector. My session is on costly signaling and the handicap principle, and I want it to be a game rather than a presentation, because the three mistakes I keep hearing in section are all things people could discover for themselves if the incentives were arranged properly. The mistakes are: first, that a signal is honest *because* it is expensive, as though the cost itself bought truthfulness, rather than because the cost falls differently on different types relative to what they have to gain; second, that wastefulness is the essence of the thing, so that any inefficiency in a signal counts in favor of the explanation, when on the reading I find most plausible the waste is a byproduct and what does the work is the differential cost; and third, that costly signaling *guarantees* honesty, when what it does is make honesty one available equilibrium among others — a room full of bluffing signallers is also a possible outcome and I don't want the game to quietly rule it out by construction.

  So here is what I want. Design a runnable game with real but harmless stakes — no money, ideally forfeited raffle tickets, tokens, or a tedious five-minute transcription task — in which participants are paired, one draws a hidden type from a deck, and the other decides whether to accept or reject them, with the signaller choosing a signal level beforehand. I'd like it staged so that the first phase is cheap talk and collapses into noise on its own, and the later phases let them find, by playing repeatedly, the signal level at which the types separate, and to notice that the separation point moves when the stakes of being accepted move and when the cost schedule moves. Nobody should hear the phrase "handicap" until the debrief. I also want two wrinkles handled, not just mentioned: a transfer variant, where the tokens a signaller gives up go to their receiver instead of being destroyed, so total surplus is preserved and nothing is wasted — I want participants to feel whether honesty survives that change and what it tells us about whether waste or differential cost was doing the work; and a phase with what I've been calling a "tell," a signal whose intensity is mechanically fixed by the signaller's type and so can't be faked at any price, to see whether they notice that it needs a different kind of explanation entirely.

  Give me the full payoff table with actual numbers, the materials, a minute-by-minute timeline, and the debrief mapping specific moments in the session onto specific parts of the account. Please be concrete about what will predictably go wrong the first time I run it — students differ enormously in how much they mind doing a boring task, and someone will try to be clever about reputation across rounds — and how I should handle each. Finally, be honest about which feature of the idea the game cannot reproduce and I will have to supply myself: my guess is that it's the fact that in the biological case the structure is an equilibrium produced by selection over many generations with nobody reasoning anything out, that real signals are honest only on average rather than perfectly, and that the whole setup assumes common knowledge of the payoff structure that my players will not quite have.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar (Philosophy/Biology), 20 students, 75 minutes.
      *   **Topic:** Costly Signaling and the Handicap Principle.
      *   **Goal:** A game-based session (no lecture) where students discover key concepts through incentives.
      *   **Key Misconceptions to Address:**
          1.  Cost *itself* buys truthfulness (vs. differential cost relative to benefit).
          2.  Waste is the essence (vs. waste is a byproduct of differential cost).
          3.  Costly signaling *guarantees* honesty (vs. it's one equilibrium among others, including pooling/bluffing).
      *   **Game Mechanics:** Paired, hidden types, signal level choice, accept/reject decision.
      *   **Phases:**
          1.  Cheap Talk (collapses to noise).
          2.  Costly Signaling (separation emerges).
          3.  Transfer Variant (tokens go to receiver, not destroyed; tests waste vs. differential cost).
          4.  "Tell" Variant (mechanically fixed signal; tests necessity of cost).
      *   **Constraints:** No money (use tokens/raffle tickets/tasks), no reliable projector, tables/index cards/deck of cards available.
      *   **Deliverables:** Payoff table, materials, minute-by-minute timeline, debrief mapping, troubleshooting (what goes wrong), and limitations (what the game *can't* show).

  2.  **Deconstruct the Theory (for Game Design):**
      *   *Signaler Types:* High Quality (HQ) and Low Quality (LQ).
      *   *Receiver Action:* Accept (A) or Reject (R).
      *   *Payoffs:*
          *   Receiver wants to Accept HQ, Reject LQ.
          *   Signaler wants to be Accepted regardless of type.
          *   Signaling Cost: $C(s, type)$. Crucially, $C(s, LQ) > C(s, HQ)$ for separation to occur.
      *   *Equilibrium:* Separating (HQ signals high, LQ signals low) vs. Pooling (both signal same or bluff).
      *   *The "Waste" Critique:* If the cost is a transfer to the receiver, does separation still hold? Yes, if the marginal cost differs.
      *   *The "Tell":* If signal is fixed by type, cost is irrelevant.

  3.  **Drafting the Game Mechanics:**
      *   *Currency:* "Labor Tokens" (LT). Can be redeemed for a raffle (chocolate/coffee) or used to buy out of a "penalty task" (transcription). This creates real but harmless stakes.
      *   *Types:* Red Card (HQ) and Blue Card (LQ). Drawn from a deck.
      *   *Signal:* Number of tokens offered (0-10).
      *   *Cost:* Tokens surrendered.
      *   *Receiver Payoff:* Gets a reward if they Accept HQ, gets a penalty if they Accept LQ.
      *   *Signaler Payoff:* Gets a big reward if Accepted, minus signal cost.

      *Refining Payoffs:*
      *   Signaler Benefit from Acceptance: 10 LT.
      *   Signaler Cost per Signal Unit:
          *   HQ (Red): 0.5 LT per unit.
          *   LQ (Blue): 1.5 LT per unit.
          *   *Why?* LQ finds signaling harder.
      *   Receiver Benefit: +5 LT if Accept HQ.
      *   Receiver Cost: -5 LT if Accept LQ.
      *   Receiver Neutral: 0 if Reject.

      *Check Separation:*
      *   If Signal = 4.
      *   HQ Cost: $4 \times 0.5 = 2$. Net: $10 - 2 = 8$. (Worth it).
      *   LQ Cost: $4 \times 1.5 = 6$. Net: $10 - 6 = 4$.
      *   Wait, LQ still gains 4. They might still bluff.
      *   Need to make LQ bluffing unprofitable at the separation threshold.
      *   Let's adjust. Signaler Benefit = 12 LT.
      *   HQ Cost = 1 LT/unit. LQ Cost = 3 LT/unit.
      *   Threshold Signal = 4.
      *   HQ Net: $12 - 4 = 8$.
      *   LQ Net: $12 - 12 = 0$. (Indifferent, but risky).
      *   Better: Threshold Signal = 5.
      *   HQ Net: $12 - 5 = 7$.
      *   LQ Net: $12 - 15 = -3$. (Loss).
      *   So LQ won't signal 5. HQ will. Separation works.

      *Transfer Variant:*
      *   Instead of burning tokens, Signaler gives them to Receiver.
      *   Does this change incentives?
      *   Signaler cost is still the loss of tokens.
      *   Receiver gain is tokens + type value.
      *   Separation logic holds because marginal cost to Signaler differs. Waste is not required.

      *Tell Variant:*
      *   Signal is fixed. HQ *must* show 5 fingers, LQ *must* show 2.
      *   Cost is irrelevant. Honesty is hard-wired.

  4.  **Developing the Timeline (75 Minutes):**
      *   0-5: Setup & Stakes explanation.
      *   5-15: Phase 1 (Cheap Talk). No tokens. Just "I am HQ".
      *   15-30: Phase 2 (Costly Signaling). Tokens burned.
      *   30-45: Phase 3 (Transfer). Tokens given to receiver.
      *   45-55: Phase 4 (The Tell). Fixed signals.
      *   55-75: Debrief & Theory Mapping.

      *Critique:* 75 minutes is tight for 4 phases + debrief with 20 students. Need to streamline rounds. Maybe 3 rounds per phase. Pairings need to be quick.
      *Adjustment:* Combine Phase 1 & 2 intro. Make Phase 3 & 4 quicker.
      *Revised Timeline:*
      *   0-10: Intro, Stakes, Rules.
      *   10-20: Phase 1 (Cheap Talk).
      *   20-35: Phase 2 (Costly/Destroy).
      *   35-50: Phase 3 (Transfer).
      *   50-60: Phase 4 (Tell).
      *   60-75: Debrief.

  5.  **Addressing the "Mistakes" & "Wrinkles":**
      *   *Mistake 1 (Cost buys truth):* Phase 2 shows cost matters, but Phase 3 shows waste doesn't.
      *   *Mistake 2 (Waste is essence):* Phase 3 (Transfer) directly addresses this. If separation holds without waste, waste isn't the mechanism.
      *   *Mistake 3 (Guarantees honesty):* Phase 1 shows pooling. Also, in Phase 2, if the threshold is set wrong, pooling can happen. I need to ensure the game *allows* for pooling if they coordinate poorly, but incentivizes separation.
      *   *Tell:* Phase 4 shows cost isn't *necessary* if correlation is physical.

  6.  **Troubleshooting:**
      *   *Boredom/Task Aversion:* Some hate transcription. Make the "penalty" mild or offer a choice (transcription OR clean up tables).
      *   *Reputation:* Students might try to build reputation across rounds. *Fix:* Randomize partners every round. Anonymize types.
      *   *Math Anxiety:* Keep numbers simple (integers).
      *   *Cheating:* Monitor card draws.
      *   *Equilibrium Selection:* They might get stuck in a pooling equilibrium in Phase 2. *Facilitator Role:* Nudge, don't tell. "Notice anyone signaling 0 is getting rejected?"

  7.  **Limitations (The "Honesty" Clause):**
      *   Game assumes rational agents calculating payoffs. Biology is blind selection.
      *   Game has perfect separation (mostly). Biology is noisy.
      *   Game has common knowledge. Real life doesn't.

  8.  **Finalizing Materials:**
      *   Deck of cards (Red/Black for HQ/LQ).
      *   Tokens (poker chips or paper slips).
      *   Score sheets.
      *   Index cards for signals.
      *   Raffle prize.

  9.  **Writing the Plan:** (Iterative refinement for clarity and tone).
      *   *Tone:* Academic but practical.
      *   *Structure:* Clear headings.
      *   *Payoff Table:* Needs to be explicit.
      *   *Debrief:* Must link game moments to the three specific mistakes identified in the prompt.

      *(Self-Correction during drafting)*: Wait, the prompt asks for the "Transfer Variant" to test if honesty survives when tokens go to the receiver. If tokens go to the receiver, the Receiver's incentive to Accept changes.
      *   *Standard:* Signaler pays $C$ to pool. Receiver gets 0 from signal.
      *   *Transfer:* Signaler pays $C$. Receiver gets $C$.
      *   Does this break separation?
      *   Signaler Incentive: Unchanged (I lose $C$).
      *   Receiver Incentive: Changed. Now they *want* high signals regardless of type because they get the tokens.
      *   *Crucial Adjustment:* To make the Transfer Variant work as a test of "Waste vs. Differential Cost," the Receiver must *not* be able to keep the tokens as personal profit *in a way that overrides type discrimination*.
      *   *Better Design for Transfer:* The tokens are transferred, but the Receiver's *goal* remains identifying type. Or, the tokens are transferred to a "common pot" that both share?
      *   *No, stick to the prompt's intuition:* "tokens a signaller gives up go to their receiver instead of being destroyed."
      *   *Problem:* If Receiver gets the tokens, they might Accept *everyone* who offers tokens, even LQ.
      *   *Solution:* The Receiver's payoff for Accepting LQ must be negative enough that even the transfer doesn't cover it.
      *   *Example:* Accept LQ = -10. Transfer = 5. Net = -5. Still bad to accept LQ.
      *   Accept HQ = +10. Transfer = 5. Net = +15. Good.
      *   So separation *should* hold. This proves waste isn't needed, only differential cost to the signaller.
      *   *Wait, one more nuance:* If the transfer makes the Receiver indifferent, the equilibrium might shift. I need to ensure the numbers make it clear that the *Signaler's* differential cost is the driver, not the *Receiver's* benefit from waste.
      *   *Actually, the prompt says:* "so total surplus is preserved and nothing is wasted — I want participants to feel whether honesty survives that change."
      *   Okay, I will design the payoffs so the Receiver still prefers HQ even with the transfer. This isolates the Signaler's cost structure as the active ingredient.

  10. **Final Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   20 students? 10 pairs.
      *   No projector? All info on handouts/whiteboard.
      *   Stakes? Raffle tickets vs. Transcription.
      *   Mistakes addressed? Yes, in debrief.
      *   Wrinkles included? Yes (Transfer, Tell).
      *   Limitations acknowledged? Yes.

  11. **Drafting the Content:** (Focusing on the specific payoff numbers to ensure the math works for the "Separation" logic).
      *   Signaler Prize (Acceptance): 20 tickets.
      *   HQ Cost per unit: 1 ticket.
      *   LQ Cost per unit: 3 tickets.
      *   Separation Threshold: 7 units.
      *   HQ Net: $20 - 7 = 13$.
      *   LQ Net: $20 - 21 = -1$. (LQ won't do it).
      *   Receiver Gain (HQ): 5 tickets.
      *   Receiver Loss (LQ): -10 tickets.
      *   Transfer Variant: Signaler cost becomes Receiver gain.
      *   Receiver Net (HQ + Transfer 7): $5 + 7 = 12$.
      *   Receiver Net (LQ + Transfer 7): $-10 + 7 = -3$. (Still won't accept LQ).
      *   This works.

  12. **Final Polish:** Check the "Tell" phase. How to implement mechanically?
      *   Instead of choosing a number, the Card *is* the signal. Red = High Signal, Blue = Low Signal. No choice involved.
      *   This removes the "Cost" variable entirely. If they still separate, cost wasn't the cause of honesty (it was physical constraint).

  13. **Troubleshooting Section:** Be specific about "Reputation" and "Math Anxiety".
      *   Reputation: Shuffle pairs every round.
      *   Math: Provide a "Cheat Sheet" for payoffs.

  14. **Limitations:** Evolution vs. Rationality. Noise. Common Knowledge.

  15. **Output Generation:** (Proceed to write the response following this structure).
answer: |-
  Here is a complete lesson plan designed for a 75-minute seminar session. It is built to be run without a projector, using physical props to create incentives that reveal the logic of costly signaling through play rather than exposition.

  # Session Title: The Price of Proof
  **Topic:** Costly Signaling, Handicap Principle, and Equilibrium Selection
  **Time:** 75 Minutes
  **Class Size:** 20 Students (10 Pairs)

  ## I. Materials & Stakes
  **The Stakes (Harmless but Real):**
  *   **Currency:** "Labor Tokens" (LT). Use poker chips or slips of paper.
  *   **Reward:** At the end of class, hold a raffle. 1 LT = 1 ticket. Prize: A high-quality chocolate bar or a "Get Out of One Transcription Task Free" pass.
  *   **Penalty:** The 3 students with the lowest LT totals at the end must complete a 5-minute tedious transcription task (copying a paragraph of dense text by hand) after class. *Note: This creates aversion to losing tokens without requiring monetary buy-in.*

  **Physical Props:**
  *   **Deck of Cards:** Remove face cards. Red suits (Hearts/Diamonds) = **High Type (HQ)**. Black suits (Clubs/Spades) = **Low Type (LQ)**. Shuffle thoroughly.
  *   **Signal Cards:** 20 Index Cards per student, numbered 0–10.
  *   **Decision Cards:** 20 Index Cards marked **ACCEPT** and 20 marked **REJECT**.
  *   **Payoff Cheat Sheets:** One per student (see table below).
  *   **Whiteboard:** To track aggregate statistics (optional but helpful).

  ## II. The Payoff Structure
  *Print this on the Cheat Sheet. Do not use variables; use concrete numbers.*

  | **Role** | **Action** | **Payoff Condition** | **Value** |
  | :--- | :--- | :--- | :--- |
  | **Signaler** | **Base** | If Receiver chooses **ACCEPT** | **+20 LT** |
  | | | If Receiver chooses **REJECT** | **0 LT** |
  | | **Cost** | Per Unit of Signal Sent (HQ / Red) | **-1 LT** |
  | | | Per Unit of Signal Sent (LQ / Black) | **-3 LT** |
  | **Receiver** | **Base** | If they Accept a **HQ** Signaler | **+5 LT** |
  | | | If they Accept a **LQ** Signaler | **-10 LT** |
  | | | If they **Reject** (any type) | **0 LT** |

  *Crucial Logic:*
  *   **Separation Point:** A signal of **7 units**.
  *   **HQ Net:** $20 - (7 \times 1) = 13$ LT. (Worth it).
  *   **LQ Net:** $20 - (7 \times 3) = -1$ LT. (Not worth it).
  *   **Receiver Logic:** Accepting LQ is always a net loss, even if they get a transfer (see Phase 3).

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:10: Setup & Stakes
  *   **Action:** Distribute Cheat Sheets. Explain the Raffle/Penalty stakes clearly.
  *   **Rule:** "You will play 10 rounds. Partners change every round. Do not talk to your partner except as the rules allow. Keep your card hidden."
  *   **Deal:** Deal one card to each student. Red = HQ, Black = LQ. They keep this card for the first 3 rounds (Phase 1 & 2), then reshuffle.

  ### 0:10 – 0:20: Phase 1 — Cheap Talk (The Collapse)
  *   **Mechanic:** Signaler looks at their card. They verbally tell the Receiver: "I am High Type" or "I am Low Type." **No tokens change hands.**
  *   **Decision:** Receiver chooses Accept/Reject.
  *   **Rounds:** 3 Rounds. Rotate partners after each round.
  *   **Expected Outcome:** Everyone claims to be HQ. Receivers quickly realize this is noise. Acceptance rates should hover at 50% (random guessing) or drop to 0% (cynicism).
  *   **Facilitator Note:** Do not intervene. Let them feel the frustration of unverified claims.

  ### 0:20 – 0:35: Phase 2 — Costly Signaling (The Burn)
  *   **Mechanic:** Signaler chooses a signal level (0–10) by placing that many LT into a "Burn Pile" (center of table). These tokens are **destroyed**.
  *   **Decision:** Receiver sees the pile size, then chooses Accept/Reject.
  *   **Rounds:** 5 Rounds. Rotate partners every round.
  *   **Expected Outcome:**
      *   *Early Rounds:* Confusion. Some LQ bluff high, lose tokens, get rejected anyway (if Receivers catch on).
      *   *Later Rounds:* Convergence. HQ players signal ~7. LQ players signal 0 or 1. Receivers Accept only signals $\ge$ 7.
      *   *Risk:* If the class coordinates poorly, you might get a "Pooling Equilibrium" where everyone signals 0 and Receivers reject everyone. If this happens, nudge: "Notice that Receivers are rejecting 0. What happens if you offer 1?"

  ### 0:35 – 0:50: Phase 3 — The Transfer Variant (The Waste Test)
  *   **Mechanic:** Same as Phase 2, **EXCEPT** tokens are not burned. The Signaler places tokens in the **Receiver's** personal pile.
  *   **Payoff Change:** Signaler still loses the tokens. Receiver gains the tokens *plus* their Base Payoff.
  *   **Rounds:** 5 Rounds. Rotate partners.
  *   **Expected Outcome:** Separation should persist. HQ signals ~7, LQ signals 0.
  *   **Why:** Even if the Receiver gets the 7 tokens, accepting an LQ yields: $-10 (\text{Base}) + 7 (\text{Transfer}) = -3$. It is still a loss. The honesty is maintained by the *Signaler's* differential cost, not the *Receiver's* benefit from waste.

  ### 0:50 – 0:60: Phase 4 — The "Tell" (The Cost Test)
  *   **Mechanic:** Reshuffle cards. **Signalers cannot choose a number.**
      *   If you hold **Red (HQ)**, you *must* place exactly **7 tokens**.
      *   If you hold **Black (LQ)**, you *must* place exactly **1 token**.
      *   *Cost:* Tokens are **destroyed** (like Phase 2).
  *   **Decision:** Receiver sees the tokens, chooses Accept/Reject.
  *   **Rounds:** 3 Rounds.
  *   **Expected Outcome:** Perfect separation immediately. No calculation needed.
  *   **Point:** Honesty exists without *choice*, proving cost is not the *source* of honesty here, but a constraint on choice.

  ### 0:60 – 0:75: Debrief & Theory Mapping
  *   **Action:** Collect cards. Tally raffle tickets. Begin discussion.
  *   **Mapping:** Connect game moments to the three specific mistakes identified in your prompt.

  ---

  ## IV. The Debrief Script (Mapping Game to Theory)

  **1. Addressing Mistake #1: "Cost buys truthfulness."**
  *   *Ask:* "In Phase 1, why didn't anyone believe you when you said 'I'm High Type' for free?"
  *   *Point:* Words are cheap. Cost creates a barrier.
  *   *Ask:* "In Phase 3 (Transfer), the tokens weren't wasted; the Receiver got them. Did honesty collapse?"
  *   *Point:* No. The *waste* didn't matter. The *differential cost* mattered. It cost the LQ type 3x more to send the signal than the HQ type. The Handicap Principle isn't about burning resources; it's about resources hurting the liar more than the truth-teller.

  **2. Addressing Mistake #2: "Wastefulness is the essence."**
  *   *Ask:* "Compare Phase 2 (Burn) and Phase 3 (Transfer). Did your behavior change much?"
  *   *Point:* If waste were the mechanism, Phase 3 should have broken the equilibrium. It didn't. Waste is a byproduct of the mechanism (differential marginal cost), not the mechanism itself. In biology, the 'waste' (e.g., a heavy tail) is just the physical manifestation of the cost differential.

  **3. Addressing Mistake #3: "Costly signaling guarantees honesty."**
  *   *Ask:* "In Phase 2, Round 1, did everyone separate immediately? Did anyone try to bluff high and fail?"
  *   *Point:* Honesty is an **equilibrium**, not a law of physics. If everyone bluffs, the signal becomes worthless (Phase 1). If everyone separates, the signal is valuable. The system can get stuck in a 'bad' equilibrium (everyone rejects everyone).
  *   *Ask:* "In Phase 4 (The Tell), was there any cost to being honest?"
  *   *Point:* No. You were forced. This shows that in nature, some signals (index signals) are honest because they *can't* be faked, not because they are expensive. Costly signaling is only one explanation for honesty, not the only one.

  ---

  ## V. Troubleshooting: What Will Go Wrong

  **1. The "Reputation" Loophole**
  *   *Problem:* Students sit next to friends and try to signal "Trust me, it's me" across rounds, bypassing the token cost.
  *   *Fix:* **Enforce strict partner rotation.** Use a pre-written list of pairings (1-2, 3-4... then 1-3, 2-4...) or have them move one seat to the right every round. Remind them: "Your partner is anonymous. They do not know your history."

  **2. The "Math Anxiety" Freeze**
  *   *Problem:* Students stall because they are calculating $20 - (7 \times 3)$ in their heads.
  *   *Fix:* The **Cheat Sheet** is vital. Include a small lookup table on it:
      *   *Signal 7 Cost (HQ):* 7 LT
      *   *Signal 7 Cost (LQ):* 21 LT
      *   *Net Profit (HQ):* 13 LT
      *   *Net Profit (LQ):* -1 LT
  *   *Facilitator:* Walk around during Round 1 of Phase 2. If a pair is stuck, ask: "If you are Low Type, and you send 7, do you end up with more or less than you started?"

  **3. The "Pooling" Stall (Equilibrium Failure)**
  *   *Problem:* In Phase 2, Receivers get burned by a bluff, decide to Reject *everything*, and Signalers stop signaling. The market collapses.
  *   *Fix:* You need to act as a "Market Maker." Announce after Round 2: "I'm noticing a lot of Rejections. Receivers, remember you get +5 for a correct Accept. Signalers, remember you get +20. You both lose if you don't trade." This nudges them toward the cooperative separating equilibrium without giving away the solution.

  **4. The "Task Aversion" Variance**
  *   *Problem:* Some students don't care about the raffle and don't fear the transcription task. They play randomly.
  *   *Fix:* Make the transcription task public. "The bottom 3 must stay 5 minutes late and copy this text while the rest of us leave." Social pressure is often a stronger motivator than the task itself.

  ---

  ## VI. Limitations: What This Game Cannot Reproduce
  *Be honest about this in the final 5 minutes. It establishes your philosophical credibility.*

  1.  **Rationality vs. Selection:** In this game, *you* calculated the payoffs. In evolution, genes don't calculate. The "equilibrium" emerges because bluffing genotypes die out over generations. The game simulates the *logic* of selection, not the *process*.
  2.  **Perfect vs. Noisy Separation:** In the game, if you do the math, separation is perfect. In biology, signals are noisy. High-quality animals sometimes fail to signal; Low-quality ones sometimes get lucky. The game creates a "clean" equilibrium that nature rarely achieves.
  3.  **Common Knowledge:** In the game, everyone has the Payoff Cheat Sheet. Everyone knows everyone knows the costs. In reality, animals must *learn* the cost structure through trial and error. The game assumes the very knowledge (the cost differential) that evolutionary theory tries to explain the origin of.

  ## VII. Instructor's Prep Checklist
  *   [ ] 1 Deck of Cards (Face cards removed).
  *   [ ] 200+ Tokens (Poker chips or paper squares).
  *   [ ] 40 Index Cards (Numbered 0-10).
  *   [ ] 40 Decision Cards (Accept/Reject).
  *   [ ] 20 Payoff Cheat Sheets.
  *   [ ] 1 Prize (Chocolate/Pass).
  *   [ ] 1 Text sample for the penalty task.
  *   [ ] Whiteboard marker.

  This design forces the students to inhabit the incentives. When they feel the pain of the LQ cost in Phase 2, and the relief that the tokens weren't wasted in Phase 3, they will have visceral evidence against the three common misconceptions before you ever write the word "Handicap" on the board.
