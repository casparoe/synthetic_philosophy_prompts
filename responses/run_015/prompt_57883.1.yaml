  Could you write a short story about it for me, like set in a pretty normal near-future town where a 16 year old runs a discord / group chat to organize a skatepark cleanup and one of the most helpful and funny people in the chat turns out to be not a person at all but like three different AI personas run by some older kid trying to win a school election or sell something? Make it focus on that trust-falling-apart feeling rather than killer robots, and show why just one fake person ruins it for all the real ones. At the end can you add a quick note on where you bent Dennett's actual arguement to make the story work better? And tbh if my take on Dennett is off or this setup can't really show what he meant, just say so plainly dont just go along with it to be nice.
