answer: |-
  Here is the single rule that captures Douglass's method, followed by how it applies to your three questions, the modern case, and the honest admission of where it breaks.

  ### The Single Rule: **The Presumption of Constitutional Innocence**

  **"Interpret the text according to its ordinary grammatical meaning, but resolve every ambiguity in favor of natural liberty and human dignity; treat the Constitution as a charter of principles that judges history, rather than a record of history that limits principles."**

  In practice, this means: The words matter more than the secret intentions of the drafters, but the *meaning* of the words is defined by moral truth, not by the corrupt practices that existed when they were written. If the text can be read to support oppression or liberty, liberty wins. If the text conflicts with established custom, the custom is void.

  ***

  ### 1. Would Douglass sign on to Originalism?
  **Verdict: No.** He would reject both Original Intent and Original Public Meaning.

  *   **Original Intent:** Douglass explicitly broke with Garrison on this. Garrison said the secret pro-slavery intent of the framers made the document pro-slavery. Douglass said secret intent is legally irrelevant; only the text binds us. So he rejects Intent Originalism.
  *   **Original Public Meaning (OPM):** This is where your worry is correct. If OPM asks, "What did the public in 1787 understand 'persons held to service' to mean?", the answer is "slaves." Douglass cannot accept this. His rule requires him to say, "It doesn't matter what they *did* with the words; it matters what the words *ought* to mean in a free society." He treats the text as having a moral potency that transcends its historical reception.
  *   **Amendments:** He wanted amendments not because the original text was morally bankrupt, but because the original text was being administratively corrupted. He would tell the modern Originalist: "You are worshipping the idol of history instead of the law of liberty." He wouldn't feel the loss of Originalism because he never believed history defined the law.

  ### 2. The "Deeply Rooted" Test (1787 vs. 1868)
  **Verdict: You are closer, but with a major correction.**

  Your friend is right that a descriptive history test fails Douglass (because the history is bloody). You are right that he looks to the Preamble. But Douglass's rule changes the definition of "tradition." He does not look for a tradition that *existed*; he looks for a tradition that was *promised*.

  *   **1787:** He would reject a 1787 "deeply rooted" test if it relies on the practice of the states. He would accept it only if it relies on the *principles* of the Declaration and Preamble.
  *   **1868:** He would overwhelmingly prefer 1868 (the Second Founding) as the anchor. The Reconstruction Amendments codified the "Presumption of Liberty" into positive law.
  *   **The Correction:** Douglass would argue that "deeply rooted" is a trap if it validates oppression. If a practice is deeply rooted but unjust (like slavery or segregation), the Constitution's purpose is to *uproot* it. He would flip the test: "Is the claim of *liberty* deeply rooted in the national promise?" If yes, the oppressive tradition must fall.

  ### 3. The 13th Amendment Punishment Exception
  **Verdict: The move generalizes, but it requires a moral definition of "punishment."**

  Douglass's method reads exceptions narrowly to prevent them from swallowing the rule.
  *   **Application:** He would argue that "punishment for crime" means penal sanction imposed by the state for retribution or rehabilitation, *not* economic exploitation for private profit.
  *   **The Collapse?** It doesn't collapse, but it reveals the engine of his method. He isn't doing linguistic analysis; he is doing moral analysis. If "punishment" is defined by the morality of the 13th Amendment (anti-slavery), then turning prisoners into unpaid labor for private corporations is a "badge of slavery," not a "punishment."
  *   **Result:** He would rule that the exception allows the state to make you work *for the state* as part of a sentence, but it does not allow the state to sell your labor to private interests. That turns the prisoner back into property, which violates the main clause. The method holds, but it relies entirely on the "Presumption of Liberty" overriding the economic incentives of the prison system.

  ***

  ### The "Douglass Inversion" Verdict
  **Your friend is wrong, and Douglass would reject the framing.**

  The Inversion suggests the text is a vessel that can be filled with good or bad content depending on the generation (Taney vs. Douglass). Douglass believes in **moral realism**. He does not think Taney's reading in *Dred Scott* was a valid "interpretation" that happened to be evil. He thinks Taney's reading was **legally false**.

  Douglass would say: "Taney did not read the Constitution differently; he read it incorrectly." The text *itself* points to liberty. If a generation reads bigotry into it, they are not exercising constitutional interpretation; they are committing perjury against the law. He would think your friend's framing concedes too much to the oppressor by suggesting the text *allowed* for Taney's reading. The text never allowed it; the Court just lied.

  ***

  ### The Modern Case: *Kelo v. City of New London* (2005)

  **The Issue:** Can the government take private property from one owner and give it to a private developer for "economic development" under the "Public Use" clause of the 5th Amendment?

  **The Surprise:**
  *   **You (Textualist):** Modern textualists (like Scalia) actually joined the majority in *Kelo*, deferring to the legislature's definition of "Public Use." You might expect a textualist to say, "The text says Public Use, the Legislature says it's for the public, case closed."
  *   **Your Friend (Living Constitutionalist):** They often defer to legislative judgments on economic progress and evolving community needs. They would likely support the city's plan as a valid modern adaptation of property rights.
  *   **Douglass's Rule:** He votes for the **homeowner (the Dissent)**.
      *   **Why?** Under the **Presumption of Constitutional Innocence**, "Public Use" must be read in light of securing "Liberty" and "Property." Taking a home to give to a private corporation violates the core purpose of the Constitution, which is to protect the individual against encroachment. Economic efficiency is not "Liberty."
      *   **The Surprise:** He defeats the Textualist's deference to the state and the Living Constitutionalists' faith in progress. He uses the text to enforce a rigid moral boundary that neither modern camp respects.

  ***

  ### The Honest Failure: What the Rule Can't Rescue

  **The Three-Fifths Clause.**

  Douglass's famous argument was that the Three-Fifths Clause was a *penalty* on the South (because they lost 2/5ths of their population count) rather than a boost.

  **The Rule fails here.**
  If you apply the **Presumption of Constitutional Innocence** to the math, it breaks. Counting enslaved people as 3/5ths of a person gave Southern states *more* representation in the House and Electoral College than if slaves were counted as zero (the abolitionist preference). It was a political bonus for slaveholders, not a penalty.

  To make his argument work, Douglass has to claim the clause was a step toward counting them as full persons (which it wasn't) or that it reduced power relative to counting them as full persons (which is true, but irrelevant, because the alternative was counting them as none).

  **Why it fails:** His rule requires him to treat the text as a vehicle for liberty. But this specific text was a calculated compromise to *protect* slavery. There is no ambiguity to resolve in favor of liberty here; the math is explicit. Douglass has to engage in historical gymnastics to claim this clause was anti-slavery. This is the one place where his method looks like result-oriented rationalization rather than interpretation. He cannot rescue the claim that the 1787 Constitution was *functionally* anti-slavery in its operation, only that it was *theoretically* capable of being read that way. The Three-Fifths Clause proves the document was a hybrid, not the pure charter of liberty he needed it to be to win the argument against Garrison.
