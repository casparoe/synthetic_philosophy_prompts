answer: |-
  # Q&A Preparation Sheet: Indexical Non-Aggregation in Emergency Contexts

  **To:** The Author
  **From:** Research Assistant
  **Subject:** Anticipated Objections and Defence Strategies for Upcoming Workshop

  The following document outlines the probable lines of questioning from your specific audience. The objections are ordered by a combination of likelihood and potential damage to your thesis. Please note that the distinction you draw between *institutional planning* (aggregative) and *individual action* (non-aggregative) is the primary target for nearly all interlocutors.

  ---

  ### Objection 1: The Diachronic Consistency Challenge
  **Likely Objectors:** Disaster-Response Coordinators & Applied Ethicists (supported by the Decision Theorist).
  **Vocabulary:** 'Standard Operating Procedures', 'Implementation Gap', 'Protocol Adherence', 'Diachronic Consistency'.

  **(1) The Core Challenge**
  'You concede that aggregate outcomes matter for institutional planning but deny they matter for the individual agent. However, institutions act only through agents. If a triage protocol is designed to save the most lives (planning), it will instruct the field agent to save the five. If your agent follows your theory, they must ignore the protocol. If they follow the protocol, they violate your theory. How do you avoid institutional paralysis or systematic disobedience?'

  **(2) Suggested Reply (2 Minutes)**
  'I accept that institutions must issue directives, but we must distinguish the *justification of the rule* from the *moral reason for the act*. The institution uses aggregates to ensure fair ex-ante expectations across the population; this is a macro-level distributive requirement. However, when the agent faces the specific victims, the moral phenomenology changes. The agent is not maximising a social function; they are responding to indexed claims.
  My view suggests that protocols should not mandate "save the greater number" as a moral imperative, but rather establish a *fair procedure*, such as a lottery, when pathways diverge. If the protocol demands aggregation, the protocol is morally flawed, not my theory. The agent's duty is to the persons before them, not to the abstract plan. We avoid paralysis by recognising that the protocol sets the *menu* of permissible options, but the indexed reason selects the specific choice within that menu.'

  **(3) Weakest Point of Reply**
  This reply is vulnerable to the charge of 'rule-worship' versus 'act-sabotage'. If the institution has legitimately calculated that saving five saves more future capacity, the coordinator will argue the agent's 'indexed reason' is myopic and undermines the collective effort. You risk painting the agent as a rogue operator.

  **(4) Concession Strategy**
  **Hold Firm.** Do not concede that the protocol overrides the indexed reason. However, *concede* that your theory requires protocols to be rewritten as procedural guidelines (e.g., 'flip a coin') rather than outcome mandates ('save the most'). Acknowledge this requires significant institutional reform.

  ---

  ### Objection 2: The 'Wasted Lives' Objection
  **Likely Objectors:** Weighted-Utilitarian Moral Philosophers.
  **Vocabulary:** 'Opportunity Cost', 'Moral Mathematics', 'Preventable Harm', 'Scalar Weight'.

  **(1) The Core Challenge**
  'If you save the one instead of the five, four people die who could have lived. You claim the reason doesn't aggregate, but the *loss* certainly does. By refusing to acknowledge the proportional weight of five claims, you are effectively saying the deaths of the four extra victims do not count morally in the decision. How is this not a dereliction of moral duty?'

  **(2) Suggested Reply (2 Minutes)**
  'The deaths do count, but they do not count *against* the one in a way that cancels their claim. To aggregate is to treat the five as a single block of value greater than the one. My indexical view holds that the one has a claim to be saved that is not negated by the existence of others elsewhere in the causal pathway.
  Think of it this way: if I owe a debt to Alice, I cannot justify not paying her by saying I could instead pay five smaller debts to others. The claim is relational. In rescue, the "debt" is the duty to aid. Saving the one honours a specific moral relation. The tragedy of the four is real, but it is not a reason to *violate* the claim of the one. We mourn the four, but we do not use them as weights to crush the one.'

  **(3) Weakest Point of Reply**
  The debt analogy is imperfect. Debts are perfect duties owed to specific creditors; rescue duties in emergencies are often imperfect or general. The utilitarian will press that in emergency contexts, the 'creditor' is humanity or the collective, which *does* aggregate.

  **(4) Concession Strategy**
  **Hold Firm on Principle, Concede on Tragedy.** Do not accept that the four deaths are morally irrelevant. Emphasise that your view accepts the tragedy but rejects the *solution* of aggregation. Acknowledge the emotional cost to the agent, but maintain that moral correctness is not determined by body counts alone.

  ---

  ### Objection 3: The Incommensurability Problem
  **Likely Objector:** Decision Theorist.
  **Vocabulary:** 'Preference Ordering', 'Decision Matrix', 'Incompleteness', 'Rational Choice'.

  **(1) The Core Challenge**
  'You argue that reasons in Intervention A (saving five) and Intervention B (saving one) belong to different indexical frames and cannot be compared. If reasons cannot be compared, the choice is rationally underdetermined. Does this imply the agent should randomise? If so, on what basis? If not, isn't the choice arbitrary? A theory that renders rational choice impossible is practically useless.'

  **(2) Suggested Reply (2 Minutes)**
  'It does not render choice impossible; it renders *maximisation* impossible. Rationality is not solely about maximising a scalar value. It is about acting on sufficient reasons. In my framework, both A and B present sufficient indexed reasons.
  Therefore, the rational action is not to weigh them against each other—which is category error—but to acknowledge the parity of the claims. This supports randomisation, not as a tie-breaker between unequal weights, but as the only method that respects the non-comparability of the frames. Arbitrariness arises only if one *should* have compared but didn't. If comparison is blocked, selection via lottery is the most rational expression of equal respect for the indexed claims.'

  **(3) Weakest Point of Reply**
  The Decision Theorist will argue that 'sufficient reason' is too vague for high-stakes triage. If one pathway is 90% likely to succeed and the other 10%, your indexical view seems to ignore probability weighting because it focuses on the 'claim' rather than the 'outcome'.

  **(4) Concession Strategy**
  **Concede on Probability.** You must allow that *causal structure* (part of your index) includes probability of success. If Intervention A has a 90% success rate and B has 10%, the indexical reason in A is stronger *because* the causal link is more robust, not because there are more people. This preserves non-aggregation while allowing for risk-weighting.

  ---

  ### Objection 4: The Kantian Duty Objection
  **Likely Objector:** Kantian Moral Philosopher.
  **Vocabulary:** 'Imperfect Duties', 'Humanity as End', 'Maxims', 'Respect'.

  **(1) The Core Challenge**
  'You claim aggregation fails to respect separateness. But does your view not isolate victims too much? If I have an imperfect duty to aid, surely fulfilling that duty more extensively (saving five) honours the value of humanity more than saving one. By restricting the scope of the duty to the indexical frame, are you not limiting the expression of moral goodwill?'

  **(2) Suggested Reply (2 Minutes)**
  'On the contrary, aggregation risks treating humanity as a container to be filled, rather than individuals to be respected. Saving five *because* there are five uses the individuals as units of value.
  My view honours the imperfect duty by recognising that the duty is owed to *each* person. I cannot discharge my duty to the one by pointing to the five. The "extent" of the goodwill is measured by the fidelity to the claim, not the volume of outcomes. Saving the one with full fidelity to their claim is morally superior to saving the five while treating them as a aggregate mass. We respect humanity by respecting the person, not the population.'

  **(3) Weakest Point of Reply**
  This risks sounding like moral self-indulgence (keeping one's hands clean) at the expense of actual lives. The Kantian may counter that allowing four to die when one could save them fails the test of universalisability (would you will a world where agents ignore numbers?).

  **(4) Concession Strategy**
  **Hold Firm.** This is your strongest philosophical alliance. Emphasise the 'separateness of persons' argument. However, be careful not to sound like you value the *agent's integrity* over the *victims' lives*. Frame it as integrity *for the sake of* the victims' dignity.

  ---

  ### The Weakest Point in Your Position
  **The Planning/Action Distinction**

  You must prepare to defend the boundary between *institutional planning* (where you allow aggregation) and *individual action* (where you forbid it) more vigorously than any other point.
  *   **Why it is weak:** It appears to be an ad hoc manoeuvre to avoid the charge of practical absurdity. If aggregates provide moral reasons for the planner, it is difficult to explain why those reasons vanish when the plan is handed to the agent. The audience will suspect you are trying to satisfy the Coordinators (by allowing planning aggregates) and the Philosophers (by denying action aggregates) simultaneously without a coherent metaphysical bridge.
  *   **Defensive Strategy:** Argue that the *subject* of the moral reason changes. In planning, the subject is the 'population' (which is aggregative). In action, the subject is the 'encounter' (which is indexical). Do not call it a 'concession'; call it a 'category distinction'.

  ---

  ### The Dangerous Objection (Hope They Do Not Raise)
  **The Delegation Argument**

  *   **The Objection:** 'If the institution legitimately decides on an aggregative basis that Resource X should be deployed to save the five, the agent is merely a delegate of that decision. To ignore the aggregate count at the point of action is to usurp the authority of the justly constituted institution. If your theory requires the agent to disobey a justly formed plan, your theory is incompatible with organised disaster response.'
  *   **Why it is Dangerous:** This collapses your Planning/Action distinction. It argues that the moral work was *already done* at the planning stage. If the plan says "save the five," the agent's "indexed reason" is pre-empted by the institutional mandate. If you argue the agent can override the plan, you are accused of anarchy. If you argue the agent must follow the plan, you admit that aggregation *does* guide action after all, contradicting your thesis.
  *   **Preparation:** If raised, you must argue that institutional authority is limited to *logistics*, not *moral valuation*. The institution decides *where* the agent can be, but not *how* the agent values the lives they encounter. This is a difficult line to walk, so prepare to speak slowly and clearly on this specific point.
