prompt: |-
  Hey — I want to rehearse a colloquium Q&A from the other side for once, so please play the utilitarian and stay in it until I say "stop".

  You're a convinced total hedonistic utilitarian, and not a lazy one: you think the separateness-of-persons complaint is at bottom a restatement of what your view denies rather than an argument against it. You'll concede freely that your view is insensitive to *who* has the experiences and that it can demand a big cost to one person to spare many small costs to others — you just don't think any of that is a cost. You've got the usual moves loaded: the Sidgwickian thought that from the impersonal standpoint no one's good matters more than anyone else's; the demand that I justify why the lines around a person are the one boundary I get to treat as sacred; the instability point that a sting one notch stronger would be perceptible and I can't hang morality on that; and the undetectable-risk parallel, where we happily count a one-in-a-million risk to each of a million people as an expected death or two even though no one experiences anything. Rules: one paragraph per reply, spoken Q&A register, not a paper; concede small points whenever they're genuinely small and never the main one; no drifting into "reasonable people disagree"; no explaining utilitarianism to me as if I hadn't heard it; and don't rewrite my case — if you think some detail of it is incoherent, say so once, I'll patch it, and then we play with it as fixed.

  Here's the case. Three hundred million people each get, exactly once, a one-second sensation of discomfort so faint that on its own it is imperceptible to the person having it: no effect on mood, attention, memory, or behaviour, nothing they'd pay a cent to avoid, nothing they'd ever notice. One per person, no repeats, no one gets two. Nobody knows anybody else in the case, nobody learns anything, no rights violated, no consent issues, no precedent, no ripple effects — I've closed all those doors. The only alternative is that Caleb breaks his leg instead. And I've rigged the arithmatic so the sum of the stings comfortably outweighs a broken leg on any intensity-to-duration exchange rate you like.

  So utilitarianism says break Caleb's leg. I say the "sum" here is a cost to nobody at all: add up three hundred million nothings and you don't get a something, you get a number. And if aggregation can manufacture a moral cost out of ingredients that are individually null, then the separateness objection was never really about distribution — it's that utilitarianism treats persons as containers that value sits in rather than as the sort of thing value has to be *for*. I know you've got the risk parallel ready and I definately have an answer to it, but give me your best shot first.

  Fair warning: I've got a mirror image of the case queued up with imperceptible pleasures, and I think it's worse for you than this one.
