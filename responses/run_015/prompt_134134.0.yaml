  # JOINT STATEMENT ON THE COMBINATION PROBLEM
  **Parties:** Constitutive Micropsychist; Phenomenal-Boundary Emergentist
  **Date:** October 24, 2023
  **Subject:** Adversarial Collaboration Regarding Phenomenal Composition and Boundaries

  ### 1. Agreed Claims

  1.  **Definition of the Problem:** We agree that the combination problem specifies the explanatory gap between the existence of micro-phenomenal properties (if any) and the unified character of macro-phenomenal experience. The core task is to explain how discrete phenomenal bases relate to singular phenomenal wholes without logical contradiction.
  2.  **Structural Correspondence:** We agree that macro-phenomenal unity must covary systematically with physical functional organization. There cannot be a change in the structure of phenomenal boundaries without a corresponding change in the structural or dynamical properties of the physical substrate.
  3.  **Joint Rejection of Brute Emergence:** We jointly reject the hypothesis that macro-consciousness is a brute emergent fact with no structural explanation whatsoever. Any viable theory must account for the dependency of macro-experience on micro-constituents or micro-structural conditions, rather than positing a nomological dangler disconnected from the underlying physics.

  ### 2. Disagreements Table

  | Issue | Micropsychist Formulation | Emergentist Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status of Macro-Subject** | The macro-subject is a mereological sum of micro-subjects; the whole is nothing over and above the coordinated parts. | The macro-subject is a novel entity grounded in the micro-base; the whole possesses properties not identical to the sum of parts. | Substantive |
  | **Persistence of Micro-Subjects** | Micro-subjects retain their phenomenal identity within the macro-subject; they are not annihilated by combination. | Micro-subjects are subsumed or cease to exist as distinct subjects when the macro-boundary forms; only the macro-subject persists. | Substantive |
  | **Definition of Phenomenal Combination** | "Combination" denotes the literal aggregation of distinct phenomenal fields into a larger field. | "Combination" denotes the structural transformation where micro-bases give rise to a new, singular phenomenal field. | Verbal |

  ### 3. The Cruxes

  **Crux 1: The Stacking Problem**
  *Question:* Can micro-subjects retain phenomenal identity inside a macro-subject without being merged or annihilated?
  *Concrete Case:* A hierarchical neural system where lower-level modules (e.g., columnar structures) maintain informational integrity while contributing to a global workspace.
  *   **Micropsychist Prediction:** This case demonstrates that phenomenal experience is **stackable**. The lower-level modules possess their own rudimentary subjectivity which is preserved and included within the global subject's experience. The macro-subject experiences *through* the micro-subjects.
  *   **Emergentist Prediction:** This case demonstrates that phenomenal experience is **exclusive**. The formation of the global workspace creates a new boundary that subsumes the lower-level bases. The modules are physical contributors only; their potential subjectivity is extinguished or transformed into the non-subjective ground of the macro-subject.

  **Crux 2: The Boundary-Integration Mechanism**
  *Question:* Is informational closure necessary and sufficient for a new phenomenal subject regardless of the micro-level?
  *Concrete Case:* The split-brain scenario interpreted under conditions of perfect informational symmetry-breaking (where hemispheric communication is severed, creating two closed informational loops).
  *   **Micropsychist Prediction:** This case demonstrates that subjectivity tracks **physical parthood**. Two subjects exist because the constitutive micro-constituents are partitioned into two distinct physical clusters, regardless of the degree of informational closure.
  *   **Emergentist Prediction:** This case demonstrates that subjectivity tracks **functional closure**. Two subjects exist *only because* informational integration dropped below a critical threshold. If informational closure were maintained despite physical separation, only one subject would exist; the boundary is defined by integration, not mere physical adjacency.

  ### 4. Conclusion on Verbal vs. Substantive Disputes

  We identify the disagreement regarding the **Definition of Phenomenal Combination** as purely verbal. The Micropsychist uses "combination" to imply mereological summation, while the Emergentist uses it to imply structural transformation. However, this terminological divergence does not resolve the substantive disagreement regarding the **Ontological Status of the Macro-Subject** and the **Persistence of Micro-Subjects**. Even if we standardized the terminology, we would still disagree on whether micro-experiences literally survive within the macro-system or are replaced by it. The verbal dispute masks but does not eliminate the metaphysical divergence concerning whether consciousness is additive or generative.

