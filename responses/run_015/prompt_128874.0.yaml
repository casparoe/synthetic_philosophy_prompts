answer: |-
  **Setup:** Divide the 13 students into six pairs and one rotating judge to manage the odd number. Each pair receives a Scenario Card describing a mundane conflict and two hidden Goal Cards: one player acts as the Sender with a specific communicative objective, while the other is the Receiver who must infer that objective. The Sender must write a single sentence response that is literally true but underinformative, deliberately flouting the Maxim of Quantity to trigger a specific implicature without stating the goal directly. The Receiver writes down their inference, and the judge verifies whether the implicature was successfully transmitted without explicit statement.

  **Rules/Payoff:** Pairs earn 10 points if the Receiver writes down the exact implicature intended by the Sender, confirming that the calculation succeeded despite the flout. They lose 5 points if the Receiver takes the statement literally or infers the wrong meaning, indicating a breakdown in mutual knowledge or relevance. Crucially, pairs lose 10 points if the Sender’s message is too explicit, penalizing any attempt to decode rather than implicate. The game runs for five rounds with roles swapping, and the judge awards points based on strict adherence to the Quantity violation constraint.

  **Sample Round:** In a scenario about messy communal spaces, the Sender’s hidden goal is to make the Receiver wash their dishes. The Sender writes, "The sink is completely full," which is true but omits the request to clean. If the Receiver writes, "I should wash my dishes now," the pair gains 10 points for successful implicature recovery. If the Receiver writes, "Yes, it is very full," they fail because they processed the sentence meaning rather than the speaker meaning. If the Sender writes, "Please wash your dishes because the sink is full," they lose points for violating the flout requirement.

  **Debrief:** Use the failed rounds to demonstrate cancellability by asking if the Sender could have added "but I’m not asking you to clean" without contradiction, showing how implicatures vanish under explicit negation. Discuss non-detachability by asking if changing "sink" to "basin" would have altered the inference, proving the implicature attaches to the content rather than the specific words. This maps the point losses to theoretical failures: literal interpretations show a lack of inferred speaker meaning, while explicit statements show a reliance on sentence meaning.

  **Limitation:** This activity cannot reproduce the unconscious, automatic nature of real-world implicature calculation because the game forces students to metalinguistically analyze the process rather than experience it naturally. I am 85% sure about this design, but I am least confident in the judge’s ability to objectively rule on whether an implicature was "exact" enough, as context-dependent inference can be subjective even with clear rubrics.
