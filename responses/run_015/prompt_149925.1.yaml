answer: |-
  ### Part I: Brainstorming and Conceptual Framework

  **Core Distinctions: Acceptable Idealization vs. Damaging Misrepresentation**
  To construct a viable decision procedure, we must isolate the specific features that make an unrealistic assumption benign rather than harmful.
  1.  **Causal Isolation vs. Causal Interference:** An acceptable idealization isolates a variable without severing or falsifying the causal chain leading to the specific output of interest. A damaging misrepresentation alters the causal topology such that the output becomes sensitive to the falsehood.
  2.  **Error Magnitude vs. Systematic Bias:** Idealizations introduce noise or negligible error; misrepresentations introduce systematic bias that shifts the prediction consistently in one direction, potentially across a policy threshold.
  3.  **Intervention Robustness:** This is the critical differentiator for policy models. An assumption may yield accurate predictions under status quo conditions (instrumental success) but fail when policy interventions change the system's structure (e.g., assuming farmers maximize profit works until a subsidy changes the incentive structure). Acceptable idealizations remain robust under the specific interventions proposed; damaging ones break under intervention.

  **Friedman's Instrumentalism vs. Structural/Causal Critiques**
  *   **The Instrumentalist Success:** The argument that assumptions need not be true, only that the model predicts accurately, succeeds in contexts where the system is stable and the goal is purely short-term forecasting. It allows for necessary simplifications to make computation feasible.
  *   **The Structural/Causal Pushback:** Critics argue that for policy planning, we need to know *why* a model works. If the mechanism is wrong, the model cannot reliably predict the effects of interventions (the Lucas Critique). Furthermore, if the model is used to explain phenomena to stakeholders, false ontological claims undermine trust and understanding.
  *   **Translation to Checklist:** We cannot rely solely on past predictive accuracy (as future policy changes the system). We must translate the philosophical debate into a test of *sensitivity* and *mechanism*. The checklist must ask: "Does this falsehood matter for *this* decision?" and "Will this falsehood matter if we change the rules?"

  **Survivable Distinctions for a Practical Checklist**
  *   **Survivable:** The distinction between "negligible error" and "threshold-crossing bias." This can be operationalized via sensitivity analysis.
  *   **Survivable:** The distinction between "status-quo forecasting" and "intervention planning." This determines whether structural fidelity is required.
  *   **Unsurvivable:** The distinction between "true" and "false" assumptions. All models are false. The checklist must focus on "relevantly false" vs. "irrelevantly false."
  *   **Unsurvivable:** Purely epistemic judgments. At some point, the tolerance for risk is a value judgment, not a scientific one. The procedure must flag these moments rather than pretending to resolve them algorithmically.

  ***

  ### Part II: Formal Decision Procedure for Model Assumption Evaluation

  **Document Title:** Protocol for the Evaluation of Unrealized Assumptions in Coupled Forecasting Models
  **Authority:** Regional Advisory Board on Watershed Policy
  **Purpose:** To classify unrealistic model assumptions as either *Computational Fictions* (acceptable) or *Representational Distortions* (problematic) relative to specific policy decisions.

  #### 1. Working Definitions

  *   **Computational Fiction:** An assumption known to be factually false that simplifies calculation but does not materially alter the causal pathway leading to the policy-relevant output. The error introduced is random, negligible, or contained within acceptable uncertainty bounds for the specific decision context.
  *   **Representational Distortion:** An assumption known to be factually false that misrepresents a causal mechanism essential to the policy-relevant output. The error introduces systematic bias, reduces robustness under policy intervention, or obscures risks critical to stakeholder safety.

  #### 2. The Evaluation Sequence

  The Board shall apply the following five tests sequentially to each contested assumption.

  **Step 1: The Explicitness Test**
  *   **Question:** Is the assumption explicitly documented, and is its falsehood acknowledged by the modelers?
  *   **Criteria:** The model documentation must state the assumption (e.g., "Soil permeability is treated as uniform") and acknowledge the empirical reality (e.g., "Terrain is heterogeneous").
  *   **Stop Point:** If **No**, the model is **Rejected** for revision. Undocumented assumptions cannot be evaluated. If **Yes**, proceed to Step 2.

  **Step 2: The Policy-Relevance Mapping**
  *   **Question:** Does the output variable influenced by this assumption directly inform the specific policy decision at hand?
  *   **Criteria:** Establish a chain of inference from the assumption to the final output (e.g., Permit Approval, Flood Warning Level).
  *   **Stop Point:** If the assumption influences only variables irrelevant to the decision (e.g., aesthetic visualization not used for zoning), classify as **Computational Fiction** and **Accept**. If it influences the decision variable, proceed to Step 3.

  **Step 3: The Sensitivity and Magnitude Test**
  *   **Question:** If the assumption were replaced by a more realistic distribution or function, would the output change enough to alter the policy decision?
  *   **Criteria:** Modelers must provide a sensitivity analysis comparing the idealized output against a range of realistic perturbations.
      *   *Pass:* The variation falls within the "noise floor" of measurement error or below the policy action threshold.
      *   *Fail:* The variation crosses a policy threshold (e.g., changes a 10-year flood zone to a 100-year zone).
  *   **Stop Point:** If **Pass**, classify as **Computational Fiction** and **Accept**. If **Fail**, proceed to Step 4.

  **Step 4: The Intervention Robustness Test**
  *   **Question:** Does the assumption rely on structural stability that the proposed policy might disrupt?
  *   **Criteria:** This test targets behavioral or systemic feedback loops. If the policy changes incentives, physical constraints, or agent behaviors, does the assumption remain valid?
      *   *Pass:* The mechanism is physical and invariant (e.g., gravity) or the behavioral assumption is robust to the specific incentive change.
      *   *Fail:* The assumption relies on agents behaving consistently despite changed incentives (e.g., perfect profit maximization when subsidies change), or relies on linear feedbacks in a system known to have tipping points within the projection window.
  *   **Stop Point:** If **Fail**, classify as **Representational Distortion** and **Reject/Revise**. If **Pass**, proceed to Step 5.

  **Step 5: The Risk and Value Alignment Check**
  *   **Question:** Given the remaining uncertainty, does the risk profile align with the Board's mandate (e.g., precautionary principle vs. cost-benefit optimization)?
  *   **Criteria:** This is not a scientific test but a governance one. Even if scientifically defensible, does the potential error pose unacceptable risk to vulnerable populations or ecosystems?
  *   **Stop Point:**
      *   If risk is within tolerance: **Accept** (possibly with monitoring).
      *   If risk is outside tolerance: **Conditional Approval** (requires monitoring plans) or **Hand to Human Judgment** (Board vote required).

  #### 3. Stop Points and Recommendations Summary

  | Outcome | Classification | Recommendation |
  | :--- | :--- | :--- |
  | **Step 1 Fail** | Undocumented | **Reject.** Return to modelers for documentation. |
  | **Step 2 Pass** | Irrelevant | **Accept.** Assumption is inert regarding policy. |
  | **Step 3 Pass** | Computational Fiction | **Accept.** Error is negligible. |
  | **Step 3 Fail** | Potential Distortion | Proceed to Step 4. |
  | **Step 4 Fail** | Representational Distortion | **Reject/Revise.** Model is fragile under intervention. |
  | **Step 5 Fail** | Risk Misalignment | **Conditional/Hand to Judgment.** Requires value decision. |

  ***

  ### Part III: Worked Applications

  **Case A: Uniform Soil Permeability in Flood-Runoff Model**
  *   **Context:** Model used to designate flood zones for insurance and zoning. Terrain is known to be heterogeneous.
  *   **Step 1 (Explicitness):** Documented. **Pass.**
  *   **Step 2 (Relevance):** Directly influences runoff volume and peak flow timing. **Pass.**
  *   **Step 3 (Sensitivity):** Sensitivity analysis shows that while aggregate watershed volume is accurate within 5%, localized peak flows in sub-basins vary by 40% depending on soil placement. The policy involves specific zoning parcels.
  *   **Analysis:** The error crosses the threshold for parcel-level zoning.
  *   **Step 4 (Robustness):** Physical property, invariant to policy. **Pass.**
  *   **Step 5 (Risk):** High risk to property owners if localized flooding is underestimated.
  *   **Verdict:** **Representational Distortion** for parcel-level zoning. **Computational Fiction** for aggregate watershed insurance pooling.
  *   **Recommendation:** Reject for zoning decisions unless model is updated to spatially distributed permeability. Accept for aggregate insurance modeling with a safety margin added.

  **Case B: Perfect-Information Rational Actors in Irrigation Demand**
  *   **Context:** Model used to predict water usage under a new tiered pricing policy. Assumes farmers have perfect knowledge of future prices and maximize profit purely.
  *   **Step 1 (Explicitness):** Documented. **Pass.**
  *   **Step 2 (Relevance):** Directly determines demand elasticity. **Pass.**
  *   **Step 3 (Sensitivity):** Historical data shows farmers often maintain crop types despite price fluctuations due to risk aversion and tradition. Model overestimates reduction in water use by 30%.
  *   **Analysis:** Error exceeds acceptable bounds for water allocation planning. **Fail.**
  *   **Step 4 (Robustness):** The policy *changes* the incentive structure. The assumption that behavior remains purely profit-maximizing ignores cultural and risk factors that do not shift linearly with price.
  *   **Analysis:** The assumption breaks under the specific policy intervention. **Fail.**
  *   **Verdict:** **Representational Distortion.**
  *   **Recommendation:** **Reject.** Modelers must incorporate behavioral economics parameters (e.g., risk aversion, information lag) before the model can inform pricing policy.

  **Case C: Linear Climate Feedback for Five-Year Projections**
  *   **Context:** Model projects regional temperature and precipitation anomalies for a 5-year infrastructure plan. Climate science indicates nonlinearity at decadal scales.
  *   **Step 1 (Explicitness):** Documented. **Pass.**
  *   **Step 2 (Relevance):** Influences load calculations for drainage infrastructure. **Pass.**
  *   **Step 3 (Sensitivity):** Comparison with non-linear global circulation models downscaled to the region shows divergence is <2% over a 5-year horizon. Nonlinear tipping points are statistically unlikely within this window.
  *   **Analysis:** Error is within engineering safety margins. **Pass.**
  *   **Step 4 (Robustness):** Physical system. However, if the region is near a known climatic tipping point (e.g., snowpack collapse), linearity is dangerous.
  *   **Analysis:** Board must verify proximity to tipping points. Assuming none are near, **Pass.**
  *   **Step 5 (Risk):** Infrastructure has a 50-year lifespan, but the model is only for the 5-year planning phase.
  *   **Verdict:** **Computational Fiction** (conditionally).
  *   **Recommendation:** **Conditional Approval.** Acceptable for the 5-year planning window, provided the model includes a disclaimer that it is not valid for long-term infrastructure design and must be re-run annually.

  ***

  ### Part IV: Limitations and Honest Accounting

  **1. Disguised Judgment Calls**
  This procedure cannot eliminate subjective judgment; it can only locate it. Specifically, Step 3 (Sensitivity) requires defining "acceptable error." Determining whether a 10% error in flood prediction is tolerable is not a scientific question; it is a political and ethical one regarding risk tolerance. The procedure flags this in Step 5, but Board members must recognize that setting the threshold is a value judgment, not a discovery of fact.

  **2. The Problem of Unknown Unknowns**
  The procedure assumes we know *how* an assumption is false. It cannot account for structural errors we have not yet identified. A model may pass all five tests and still fail because a critical variable was omitted entirely. This procedure evaluates *known* idealizations, not model completeness.

  **3. The Conservatism Trigger**
  The procedure should default to a more conservative stance (rejecting assumptions more readily) when:
  *   **Irreversibility:** The policy decision causes irreversible harm (e.g., species extinction, permanent aquifer depletion).
  *   **Vulnerability:** The affected population lacks the capacity to absorb error (e.g., low-income housing in flood zones).
  *   **Novelty:** The system is being pushed into a regime where historical data (used for sensitivity analysis) is no longer a reliable guide (e.g., climate change exceeding historical variance).

  **4. Misfire Conditions**
  The procedure will misfire if the sensitivity analysis provided by modelers is itself based on the flawed model structure. If the model cannot simulate the "realistic" scenario to compare against the "idealized" one, Step 3 cannot be completed. In such cases, the burden of proof shifts entirely to the modelers to provide external validation, and the default Board position should be **Conditional Approval** with mandatory empirical monitoring.

  **5. Epistemic vs. Pragmatic Conflict**
  There will be cases where an assumption is a Representational Distortion (ontologically false and causally active) but yields better predictions than a complex "true" model due to error cancellation. Friedman's instrumentalism suggests accepting this. However, for policy intervention, this procedure prioritizes structural fidelity (Step 4) over pure predictive fit. The Board must accept that a "truer" model might be less accurate in the short term but is required for long-term policy reliability. This trade-off must be explicitly voted upon in Step 5.
