answer: |-
  **UNIVERSITY EXAMINATION PAPER**
  **Course:** *Fiction and the Will* (PHIL/ENGL 404)
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 – 1,500 Words
  **Total Marks:** 20

  **Question 1**

  Consider a thought experiment in which an agent, motivated by a single need (such as hunger), is placed between two options that are exactly identical in every relevant respect. There is no reason to prefer the left option over the right, nor the right over the left.

  In the craft of fiction, I propose a constraint called the **Principle of Narrative Asymmetry**. It holds that prose must present options sequentially; whichever option is named first, described at greater length, or attended to first by the character acquires a salience that the character has no rational reason to treat as a reason. Because narration runs in one direction, a state of exactly equal pull can be asserted in summary but never shown in scene. Furthermore, readers assume actions are motivated; a choice depicted without a reason is read as a fault in characterisation or as concealed information.

  Does this representational difficulty tell us anything about the case itself? Specifically, does the Principle of Narrative Asymmetry demonstrate that a genuine standstill of the will is not a *possible state* of an agent at all, or only that such a state is *unshowable* in text? Explain the difference between these two verdicts and argue for which one the philosophical example requires. In your answer, distinguish between having no reason to prefer either option and having no reason to choose at all, and clarify whether breaking such a tie constitutes an arbitrary choice or a random movement.

  ***

  **MODEL ANSWER**

  The Principle of Narrative Asymmetry describes a genuine limitation of text, but it commits a category error when applied to the ontology of the will. To claim that narrative linearity proves the impossibility of a mental standstill is to confuse the map with the territory. The philosophical example of the identical bundles requires the standstill to be a *possible state* of the agent, not merely an unshowable one. If the standstill were impossible—if the mind, like the sentence, were forced by its own structure to privilege one option first—then the will would not be choosing; it would be sliding down the path of least resistance, determined by the accidental order of thought.

  We must first distinguish the motivation to act from the motivation to prefer. In the thought experiment, the agent has a compelling reason to choose *something* (hunger), but no reason to choose *this* rather than *that*. The Narrative Asymmetry suggests that the mere act of considering option A before option B provides a reason to prefer A. If this were true of the mind as it is of the page, equilibrium would be physically impossible. However, a mind can hold two concepts in suspension simultaneously in a way that prose cannot. Narrative is temporal; deliberation can be structural. To argue that the standstill is impossible because it cannot be written is to argue that silence is impossible because speech requires sound. The philosophical example needs the standstill to be real because its purpose is to isolate the will from the intellect. If the intellect always tips the scale, however slightly, the will is merely the execution of a calculation.

  This leads to the crucial distinction between the unshowable and the impossible. If the standstill is only unshowable, the limitation lies in communication. We cannot depict the equilibrium without breaking it, much as we cannot photograph motion without blurring it, but the motion exists. If the standstill is impossible, the limitation lies in agency. The verdict matters because if the standstill is impossible, the agent is never truly free in these scenarios; they are determined by the micro-asymmetries of their own attention. The philosophical example requires the standstill to be possible to demonstrate that the will can initiate action without a prior determining cause. It posits a moment where reason ends and agency begins.

  Finally, we must define what breaks the tie. If the agent chooses without a preferential reason, is this randomness? No. Randomness is an event without an agent, like a coin toss decided by wind. Arbitrary choice is an event decided *by* the agent without a prior reason. The Narrative Asymmetry risks conflating these. It suggests that because the reader sees the choice happen after a description of the left bundle, the description caused the choice. But in the agent, the "break" is not a cause acting upon them; it is an exercise of capacity. To pick arbitrarily is to assert that the self is a sufficient cause.

  Therefore, the Principle of Narrative Asymmetry reveals a constraint on the novelist, not the philosopher. The novelist must fake the equilibrium by balancing sentence length or attention, knowing the reader will impose a hierarchy. But the philosopher must insist that the hierarchy is not there. If we accept the narrative constraint as a metaphysical truth, we dissolve the will into the mechanics of attention. We are left with a creature that does not choose, but merely reacts to the order in which its own thoughts occur. The example needs the standstill to be possible to preserve the distinction between being moved and moving oneself. The text cannot show the stillness, but the agent must be able to inhabit it, if only for an instant, before the will speaks.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **1. The Map/Territory Distinction (4 Marks)**
  *   **Full Marks:** Identifies that the Principle of Narrative Asymmetry (PNA) applies to *representation* (text/time) but not necessarily to *cognition* (mind/structure). Argues that conflating the two is a category error.
  *   **Common Confusion:** Treating the PNA as a metaphysical truth about how minds work, rather than a constraint of prose.
  *   **B-Grade Stall:** Acknowledges the difference but fails to explain *why* it matters for the definition of agency.

  **2. Possible State vs. Unshowable State (4 Marks)**
  *   **Full Marks:** Clearly defines the difference: "Unshowable" means the state exists but cannot be depicted; "Impossible" means the state cannot exist. Argues the example requires the state to be *possible*.
  *   **Common Confusion:** Treating "unshowable" and "impossible" as synonyms in this context.
  *   **B-Grade Stall:** Correctly defines the terms but hedges on which verdict the example needs, or chooses "impossible" without addressing the determinism implication.

  **3. Reason to Prefer vs. Reason to Act (4 Marks)**
  *   **Full Marks:** Distinguishes the general motivation (hunger/need to act) from the specific motivation (reason to prefer A over B).
  *   **Common Confusion:** Arguing that hunger itself breaks the tie between the specific bundles.
  *   **B-Grade Stall:** Mentions hunger but fails to separate the *urge to choose* from the *reason for the specific choice*.

  **4. Arbitrary Choice vs. Random Movement (4 Marks)**
  *   **Full Marks:** Defines randomness as cause without agent (wind/coin) and arbitrary choice as agent without prior cause (will/fiat).
  *   **Common Confusion:** Equating "no reason" with "randomness/chance."
  *   **B-Grade Stall:** Uses the words "random" and "arbitrary" interchangeably.

  **5. Resisting the Framing (4 Marks)**
  *   **Full Marks:** Explicitly challenges the prompt's implication that narrative constraints dictate philosophical reality. Rewards the argument that accepting the PNA as metaphysical dissolves the will into attention mechanics.
  *   **Common Confusion:** Accepting the PNA as the primary lens for the solution without critique.
  *   **B-Grade Stall:** Attempts to "solve" the narrative problem (e.g., suggesting how to write the scene) rather than critiquing its philosophical relevance.

  **Note on B-Grade Answers:**
  A B-grade answer (10–14 marks) will typically possess the correct vocabulary (salience, deliberation, agency) and will successfully summarize the thought experiment. It will stall by treating the Principle of Narrative Asymmetry as a given truth to be accommodated rather than a premise to be tested. It will often conflate the *order of reading* with the *order of thinking*, missing the core ontological distinction required for full marks. It may also default to standard survey dialectics (e.g., "animals can't do this, humans can") rather than engaging with the specific narrative constraint provided.
