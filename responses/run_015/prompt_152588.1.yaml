      *   *The "Finite" Qualification:* Maxwell writes, "One of the best established facts in thermodynamics is that it is impossible in a system enclosed in an envelope which permits neither change of volume nor passage of heat, and in which both the temperature and pressure are everywhere the same, to produce any inequality of temperature or pressure without the expenditure of work. But this is one of the best established facts in thermodynamics... [The demon] shows that the second law of thermodynamics has only a statistical certainty."
      *   *Wait, check the "finite" claim:* The user mentions Maxwell qualifies the being as "finite in its powers." In the 1867 letter, Maxwell actually calls the being a "finite being" (contrasted with an infinite intelligence/Laplace's Demon). He says: "if we conceive of a being whose faculties are so sharpened that he can follow every molecule in its course, such a being, whose attributes are still as essentially finite as our own..."
      *   *Maxwell's Intent:* Maxwell was challenging the *absolute* status of the Second Law (as held by Clausius and Thomson). He wanted to show it was *statistical*. He was *not* trying to save the Second Law by finding a cost in the demon's operation. He was using the demon to *break* the Second Law (in the deterministic sense) to prove its statistical nature.
