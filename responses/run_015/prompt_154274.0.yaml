answer: |-
  Your hypothesis is largely correct, but it identifies the symptom rather than the disease. The stall is not merely about unargued metaphysical commitments regarding personal identity; it is about a **bedrock disagreement over the unit of rational agency**.

  The debate appears to be about epistemology (can I know the future?) versus ontology (am I the future?), but formally, it is a conflict between **Expected Utility Theory (EUT)**, which requires a stable utility function, and **Transformative Experience (TE)**, which violates that stability.

  Here is the diagnosis of the disagreement, the classification of its type, and the specific path required for progress.

  ### 1. Diagnosis: The Clash of Value and Identity

  To understand why the debate is stalled, we must look at what each side claims about the relationship between the *valuer* and the *value*.

  **Side A (The Epistemic Camp, e.g., L.A. Paul):**
  *   **Claim:** Rational choice requires assigning subjective values to outcomes. TEs make this impossible because the phenomenal character of the outcome is inaccessible to the current self.
  *   **Identity Commitment:** **Diachronic Continuity.** This side implicitly assumes that the *same* subject who chooses will experience the outcome. If there were no continuity, the "ignorance" wouldn't matter for *your* rationality; it would just be a gamble on someone else's life.
  *   **Value Theory:** **Phenomenal Internalism.** Value is grounded in "what it is like." If you cannot access the qualia, you cannot access the value.
  *   **The Block:** An information gap.

  **Side B (The Preference/Identity Camp, e.g., Pettigrew, Ullmann-Margalit, Harman):**
  *   **Claim:** Even if you could know the qualia (via perfect testimony), your preference ordering would fundamentally restructure. The pre-TE self and post-TE self have incommensurable utility functions.
  *   **Identity Commitment:** **Diachronic Fragmentation.** This side treats the timeline as a sequence of agents (temporal slices). The pre-TE agent is evaluating a outcome for a *different* agent (the post-TE self).
  *   **Value Theory:** **Structural Relativism.** Value is grounded in the preference architecture of the specific time-slice.
  *   **The Block:** A principal-agent problem.

  **The Hidden Formal Disagreement:**
  You identified an "identity-stability axiom." In formal decision theory, this is the **Stationarity Assumption**. Standard intertemporal choice assumes that $U_{now}(Outcome) \approx U_{future}(Outcome)$, or at least that the probability distribution of future utilities is known.
  *   Side A argues we cannot populate the probability matrix ($P$).
  *   Side B argues the utility function ($U$) itself is a variable that changes discontinuously.

  The stall occurs because Side A tries to solve a **Variable $U$** problem with **Variable $P$** solutions (e.g., "get more data"), while Side B argues that no amount of data stabilizes $U$.

  ### 2. Classification: Bedrock Disagreement

  This is not a **verbal** dispute (they agree on the definitions of "transformative" but disagree on its implications) nor a standard **substantive** dispute (it cannot be settled by empirical data about how much preferences change).

  It is a **Bedrock Disagreement** (in the Wittgensteinian sense). The two sides are operating with incompatible norms of rationality that rest on different foundational pictures of the self:
  1.  **The Narrative Self (Side A):** Rationality is about making a choice that makes sense for a life story. The self is a single entity persisting through time. The threat is *alienation* from one's own future.
  2.  **The Sequential Self (Side B):** Rationality is about coherence between temporal slices. The self is a series of entities. The threat is *conflict* between distinct agents.

  Because these are normative foundations, neither side can "prove" the other wrong without begging the question. Side A cannot prove continuity matters without assuming the Narrative Self. Side B cannot prove fragmentation matters without assuming the Sequential Self.

  ### 3. Path to Progress

  To break the stall, we must stop trying to force TEs into standard Expected Utility Theory. Progress requires a **Reframing** supported by a **Formal Model**.

  **A. Conceptual Distinction: Epistemic vs. Axiological Transformation**
  We must formally decouple the two problems, as they require different solutions.
  *   **Epistemic Transformation:** I don't know what the experience feels like. (Solved by testimony, simulation, or accepting uncertainty).
  *   **Axiological Transformation:** I don't know *who* will value the experience. (Solved by authority transfer).
  Current debate conflates these. Acknowledging that one can exist without the other dissolves the "stall." For example, a religious conversion might be epistemically transparent (you know the doctrines) but axiologically transformative (you no longer value secular success).

  **B. Formal Model: Diachronic Authority rather than Utility Maximization**
  We need a model that replaces "Maximize Expected Utility" with **"Authorize Successor."**
  Instead of asking, "What maximizes my current utility?" the model should ask, "Under what conditions is it rational for Agent-$t_1$ to grant decision-making authority (or life-control) to Agent-$t_2$?"
  *   This borrows from **Constitutional Political Economy**. The pre-TE self is the "constitutional convention"; the post-TE self is the "government."
  *   Rationality is not about predicting the government's specific policies (utility), but about agreeing to the *process* by which policies are chosen.
  *   **Progress Condition:** A formal model where the choice variable is not the *outcome*, but the *degree of constraint* placed on the future self.

  **C. Reframing: The Dissolution**
  The problem dissolves if we accept that **rationality is not the primary norm for transformative choices.**
  If identity is discontinuous (Side B), then standard rationality (maximizing current preferences) is the wrong tool. If identity is continuous (Side A), then ignorance is just risk, which we handle all the time.
  The progress lies in admitting that TEs are **Arational Commitments**. They are acts of *faith* or *will*, not calculation.
  *   **Progress Condition:** A normative framework that validates "leaps" not as failures of rationality, but as necessary mechanisms for identity constitution. We stop asking "Is this rational?" and start asking "Is this authentic?" or "Is this authoritative?"

  ### Summary Verdict

  Your hypothesis is **correct in diagnosis but requires formal specification.** The stall is indeed caused by unargued metaphysical commitments regarding diachronic identity, which manifest formally as a violation of the stability axioms in decision theory.

  *   **Type:** Bedrock Disagreement (Competing norms of agency).
  *   **Required Progress:** A **Constitutional Reframing**. We must move from a model of *prediction and maximization* (which fails under TE) to a model of *authorization and commitment*. The question is not "What will I value?" but "Do I trust the process that will determine what I value?"

  Until the debate shifts from "Can we calculate the utility?" to "How do we legitimize the succession of selves?", the stall will remain.
