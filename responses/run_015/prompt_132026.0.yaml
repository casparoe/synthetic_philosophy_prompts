answer: |-
  **Essay Question (45 Minutes)**

  Philosophers debate whether hyperbolic discounting provides a genuine explanation of weakness of will (akrasia) or merely redescribes it. Critically assess whether the hyperbolic model can account for *synchronic* akrasia—acting against one's present best judgment at the moment of action—or whether it is limited to explaining *diachronic* preference reversal. Defend a definite position on whether this psychological model solves the philosophical puzzle of akrasia.

  ***

  **Model Answer**

  Hyperbolic discounting describes a cognitive bias where agents disproportionately value immediate rewards over future ones, leading to preference reversals as temporal proximity changes. While this model offers a robust mechanistic account of diachronic instability, it fails to explain synchronic weakness of will. Consequently, hyperbolic discounting redescribes rather than solves the philosophical puzzle of akrasia.

  To see this, we must distinguish diachronic from synchronic cases. Diachronic weakness involves planning to diet tomorrow but eating cake today. Here, hyperbolic discounting explains the shift: the value of the cake spikes as it becomes immediate, overriding the prior preference for health. This is a conflict between past and present selves. However, synchronic akrasia occurs when an agent acts against their *present* best judgment at the *moment* of action. The agent judges, right now, that health is better, yet eats the cake anyway.

  Hyperbolic discounting mechanistically predicts that preference follows perceived value based on time. If an agent chooses the cake, the model implies the cake was preferred at that moment. If preference determines judgment, then the agent did not violate their best judgment; they simply acted on their strongest current desire. This reduces akrasia to a change in preference, not a failure of rationality. Therefore, the model cannot explain synchronic akrasia because it eliminates the normative gap required for weakness of will. True akrasia requires acting against what one judges best, not merely acting on what one wants most. By collapsing judgment into discounted preference, hyperbolic discounting offers a redescription of behavior rather than an explanation of the irrationality involved.

  A serious objection arises: perhaps "best judgment" is just a long-term preference subject to the same discounting curves. If judgment is nothing over and above weighted desires, then when the cake wins, the judgment has effectively shifted to match it. There is no violation, only updated valuation.

  This objection fails because it conflates predictive desire with normative judgment. When an akratic agent says, "I know I shouldn't eat this," they assert a normative truth that persists despite the urge. If hyperbolic discounting were the full story, the agent would say, "I now want this more, so it is best." The phenomenology of akrasia involves regret and a sense of violation precisely because the judgment remains stable while the action diverges. Hyperbolic discounting explains why the urge wins, but it cannot explain why the agent recognizes the urge as subordinate to a conflicting judgment at the very moment of succumbing. Thus, while useful for behavioral prediction, the model leaves the philosophical core of weakness of will untouched.

  ***

  **Marking Scheme (Total: 100 Points)**

  **1. Distinguishing Synchronic from Diachronic Weakness (20 Points)**
  *   **Top (18-20):** Clearly defines synchronic (present judgment vs. present action) and diachronic (past plan vs. present action) cases.
  *   **Adequate (10-17):** Mentions time differences but blurs the distinction between judgment and preference.
  *   **Typical Failure:** Treats all weakness as a conflict between "now" and "later," missing the synchronic puzzle entirely.

  **2. Identifying Hyperbolic Discounting's Mechanistic Prediction (20 Points)**
  *   **Top (18-20):** Correctly identifies that the model predicts preference reversal based on temporal proximity (immediate rewards spike in value).
  *   **Adequate (10-17):** States that people value immediate things more but fails to link this to preference reversal mechanics.
  *   **Typical Failure:** Describes hyperbolic discounting vaguely as "impatience" without explaining the structural shift in valuation.

  **3. Stating a Clear Thesis with Reasons (20 Points)**
  *   **Top (18-20):** Takes a definite stance (e.g., "it redescribes rather than explains") and supports it with the argument that the model collapses judgment into preference.
  *   **Adequate (10-17):** Takes a stance but relies on assertion rather than reasoning about the nature of judgment.
  *   **Typical Failure:** Hedges (e.g., "it explains some parts but not others") without committing to the explanatory limit regarding synchronic cases.

  **4. Engaging a Serious Objection (20 Points)**
  *   **Top (18-20):** Raises a plausible counter-argument (e.g., judgment is just long-term preference) and rebuts it (e.g., distinguishing normative judgment from desire).
  *   **Adequate (10-17):** Mentions an objection but offers a weak or unrelated rebuttal.
  *   **Typical Failure:** Raises a straw-man objection or fails to rebut the objection, leaving the thesis vulnerable.

  **5. Avoiding the Future-Oriented Error (20 Points)**
  *   **Top (18-20):** Explicitly recognizes that not all weakness involves future consequences; some involves immediate violation of present standards.
  *   **Adequate (10-17):** Focuses heavily on self-control over time but acknowledges present judgment briefly.
  *   **Typical Failure:** Treats all akrasia as a failure of future-oriented self-control, ignoring the synchronic violation of present best judgment.
