  Let her throw the lever, but do not let her feel clean. The 15% credence means the Doctrine of Double Effect is mostly a rationalization, so granting her moral absolution would be a lie. The "honest version" of the character accepts the utilitarian necessity of the act but carries the deontological residue of having sacrificed a life. She saves the five, but she doesn't sleep; the lever is heavy, not because of the physics, but because the distinction between intending and foreseeing is too thin to wash the blood off her hands.
