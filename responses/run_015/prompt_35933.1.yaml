  The final credence is most sensitive to the **normative weight of intuitions (Piece 3)**. If you accept that evolutionary origins debunk moral intuitions (Greene/Singer), the number drops to near zero; if you accept reflective equilibrium (Rawls/Scanlon), it doubles. New fMRI data on "personal force" vs. "intention" processing would move Piece 2, but Piece 3 is the philosophical bottleneck.

