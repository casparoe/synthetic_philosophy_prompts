answer: |-
  Here is my committed assessment. I will start by flagging the theoretical errors, then address the meta-ethical worry, and finally tell you exactly what to do with your committee.

  ### 1. You are overreading Williams and misreading Appiah

  You are conflating two distinct mechanisms and drawing a cynical conclusion that neither author supports.

  **On Williams:** I need to flag a likely conflation here. If you are referring to **Eric Williams** (*Capitalism and Slavery*), his thesis is indeed economic determinism: slavery became unprofitable, so it was abandoned. If you are referring to **Bernard Williams** (the moral philosopher), he never argued that moral reasons are causally inert. Bernard Williams argued that moral *theory* often fails to capture the psychological reality of motivation, but he did not claim that *reasons* themselves do no work. If your premise relies on the idea that "moral argument is causally inert," you are leaning on a crude materialism that Bernard Williams would have rejected. Assuming you mean the Eric Williams thesis (which is the one that matches your description), you are treating a historical sociological claim as a universal philosophical truth. That is a category error. Just because economics drove the end of chattel slavery in the British Empire does not mean reasons are *never* effective in other normative contexts.

  **On Appiah:** You are fundamentally misreading *The Honor Code*. Appiah does not argue that moral argument is inert. He argues that moral argument is the *engine* that redefines honor. In the dueling case, it wasn't just that prestige shifted; it was that a specific set of arguments (about civility, about the absurdity of killing a man for an insult) successfully penetrated the elite circles that defined honor. The argument provided the *content* of the new norm. Without the argument, there is no new definition of "honourable person." Appiah's point is that reasons work *through* social psychology, not that they don't work at all. To say Appiah and Williams are saying the same thing is to ignore Appiah's core insistence that the *script* of the argument matters.

  **The Verdict:** Your conclusion that "reasons never move anyone" does not follow. What follows is that reasons rarely move people *in isolation* from social context. Reasons are the blueprint; social pressure is the construction crew. You need both. If you scrap the argument, you remove the blueprint, and the social pressure becomes mere bullying without a direction.

  ### 2. The Meta-Ethical Worry: Stop doubting you are right

  You asked if you should stop telling yourselves you're right, since "there's no such thing as being right, there's just what the winners ended up doing."

  **This is a mistake.** This is the genetic fallacy. The causal history of a belief (how it came to be victorious) is separate from its justification (whether it is true). Even if slavery ended solely because it became unprofitable (Eric Williams), it does not follow that slavery was morally permissible until the market shifted. It was always wrong; the world just took time to catch up.

  If you abandon the conviction that you are *right*, your campaign loses its resilience. Social pressure campaigns are exhausting. If you are only doing it because you think "winning is all that matters," you will quit when the pushback gets hard. You need the ethical conviction to sustain the social pressure. Do not drop the ethics case. It is the only thing that legitimizes the shaming.

  ### 3. Strategic Advice: Friction, not Shame

  Now, to your committee work. You asked if you should scrap the argument-and-report side and focus on making the shoulder-tap embarrassing and expensive.

  **My direct advice:** Do not scrap the argument, but stop expecting it to convert people. Keep the argument as the *justification* for the policy, but shift your tactical energy to **making the shoulder-tap procedurally expensive**, not socially embarrassing.

  Here is why:

  1.  **The Backlash Risk:** You are right to worry about shaming making people dig in. In academia, "shaming" is often perceived as a power play by a rival faction. If you frame shoulder-tapping as "dishonourable," senior faculty (who benefit from the network) will frame you as "naive" or "ideological." They will dig in because their status is threatened.
  2.  **The "Expensive" Route:** Appiah notes that norms change when the practice becomes incompatible with the identity of the group. In a university, the identity is "meritocratic" and "bureaucratically sound." You don't need to make them feel *ashamed*; you need to make the shoulder-tap *administratively impossible*.
      *   **Action:** Push for rules where a search committee cannot be formed without a public advert log. Push for HR to reject appointment papers that lack a transparency dossier. Make the shoulder-tap require more signatures, more forms, and more justification than the open hire.
      *   **Why this works:** It bypasses the moral resistance. People aren't being asked to repent; they are being asked to comply with bureaucracy. It removes the "moral victory" from the resistors and turns it into a compliance issue.
  3.  **The Role of Argument:** Keep the ethics report, but use it to arm the administrators, not the faculty. The Dean needs the ethical argument to justify the new bureaucracy to the Board. The faculty just need to know the new form is mandatory.

  ### Summary of Commitments

  1.  **Theoretical Correction:** You are wrong that reasons are inert. They are the necessary precondition for the shift in honor. You are wrong that Williams and Appiah say the same thing; Appiah explicitly centers the power of discourse to redefine prestige.
  2.  **Meta-Ethics:** Do not abandon the claim that you are right. That is your fuel. The fact that victory requires social leverage does not negate the truth of the premise.
  3.  **Strategy:** Do not rely on moral shaming; it creates martyrs. Rely on **procedural friction**. Make the unethical path the hard path. Keep the ethical argument as the public justification for the friction, but do not expect the argument alone to change hearts. Change the incentives, and the hearts will follow later (rationalization is a powerful moral force, too).

  You are fighting a coordination problem, not a knowledge problem. They know it's unfair; they just like the convenience. Fix the convenience, and you fix the norm.
