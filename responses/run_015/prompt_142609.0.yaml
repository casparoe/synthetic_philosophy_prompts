  **The Compliance Decision Procedure**

  **Step 1: The Value Test.** Is anything of value (cash, goods, services, donations) being offered or requested?
  *   *No:* Proceed.
  *   *Yes:* Go to Step 2.

  **Step 2: The Expectation Test.** Is there an explicit or implicit expectation of favourable treatment, now or in the future?
  *   *No:* Go to Step 3.
  *   *Yes:* **STOP.** Hard No. Report to Compliance Lead.

  **Step 3: The Refusal Test.** Could either party refuse without risk to safety, operations, or relationship?
  *   *Yes:* Go to Step 4.
  *   *No:* **STOP.** This is extortion. Do not pay. Contact Security/Legal immediately.

  **Step 4: The Recipient Test.** Is the benefit going to a third party (charity, relative, community) nominated by the official?
