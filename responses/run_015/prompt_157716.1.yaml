  2.  **Deconstruct the Desiderata (The "What"):**
      *   I need to categorize these into:
          1.  Extensional Adequacy (covering the cases).
          2.  Intensional/Conceptual Clarity (the distinctions).
          3.  Metaphysical/Empirical Constraints (neuroscience, observability).
          4.  Normative/Epistemic Constraints (authority, rationality).

  3.  **Address the "Hard Cases" (The "Why"):**
      *   *Cyclical Choices (Reflective):* If an agent says "I know A>B, B>C, C>A and I stand by this," a theory that forces transitivity calls them irrational. A theory that ignores the cycle loses predictive power. *Constraint:* Must accommodate rational intransitivity. *Distinction:* Procedural rationality vs. Consistency.
      *   *Framing Reversals (Knowledgeable):* Asian Disease Problem style, but the agent *knows* they are equivalent. *Constraint:* Utility cannot be solely extensional over outcomes. *Distinction:* Description-dependence vs. Error.
      *   *Genuine Incompleteness:* "I can't compare" $\neq$ "I don't care." *Constraint:* Utility function must allow partial ordering. *Distinction:* Indifference ($I$) vs. Non-comparability ($N$).
      *   *Intertemporal Shifts:* Past self chose X, Present self chooses Y and thinks Past self was *mistaken* but not *irrational* (e.g., taste change). *Constraint:* Utility must be indexical or time-relative without implying dynamic inconsistency as a failure of rationality. *Distinction:* Rational Revision vs. Weakness of Will.

  4.  **Address Consistency Conditions (The "How"):**
      *   *Empirical Equivalence:* Must recover WARP/SARP where they hold.
      *   *Neuroscience:* No "hedonimeter." Utility isn't a single firing rate.
      *   *First-Person Authority:* The agent knows their pain/pleasure/preference better than the observer *sometimes*.
      *   *Camp vs. Adequacy:*
          *   "No unobservables" = Behaviorist Camp Preference.
          *   "Predictive accuracy" = Genuine Adequacy.
          *   "Neuro-compatibility" = Genuine Adequacy (given modern science).
          *   "First-person authority" = Genuine Adequacy (phenomenological constraint).

  5.  **Identify Tensions (The "Trilemma"):**
      *   The classic tension: **Behavioral Determinacy vs. First-Person Authority vs. Normative Neutrality.**
      *   If behavior determines utility (Revealed Preference), First-Person Authority is illusory when they conflict.
      *   If First-Person Authority holds, Behavior doesn't fully determine utility.
      *   If Normative Neutrality holds (no "true" utility), we can't say the agent is mistaken about their own utility.
      *   *Specific Trilemma:* **Complete Behavioral Determinacy + Full First-Person Authority + Non-Constructivist Realism.** You can't have utility be *just* choice, *just* inner state, and *just* normative fact simultaneously when they diverge.

  6.  **Score the Camps:**
      *   *Strict Behaviorist (Samuelson):* Fails Hard Cases (cycles, framing), Fails First-Person Authority. Wins on Empirical Equivalence.
      *   *Mental-State Causal (Neoclassical/Psychological):* Fails Neuroscience (no single signal), Fails Framing (why does description matter if mental state is about outcome?). Wins on First-Person Authority.
      *   *Normative Constructivist (Broome/Decision-Theoretic):* Fails Empirical Determinacy (underdetermined), Wins on Hard Cases (can model norms).
      *   *Most Damaging Requirement:* **Knowledgeable Framing Reversals.** It kills extensional behaviorism (same choice structure, diff choice) and standard mentalism (same belief about outcome, diff utility).

  7.  **Defeaters and Reasoning Failures:**
