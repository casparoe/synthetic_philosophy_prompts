answer: |-
  **START:** Individual act $A$ contributes to collective Harm $H$, but $A$'s individual causal contribution to $H$ is undetectable.

  **Q1. Signal Shape:** Is the accumulation of acts like radiation dose (linear sum) or like a circuit breaker (steps/cliffs)?
  *   *Case:* Does every photon risk DNA damage (linear), or does nothing happen until $N$ voters align (cliff)?
  *   **Yes (Linear/Continuous):** Go to Q3.
  *   **No (Stepped/Threshold):** Go to Q2.

  **Q2. Trigger Visibility:** If stepped, is the trigger point knowable to the agent before acting?
  *   *Case:* Can you see the cliff edge (voting count), or is it hidden behind a reorder algorithm (supermarket chicken)?
  *   **Yes (Known):** Go to Q3.
  *   **No (Hidden/Rounded):** Go to Q3. *(Note: Hidden thresholds function probabilistically like linear ones).*

  **Q3. System Saturation:** Is the harm state already guaranteed regardless of $A$?
  *   *Case:* Are 100 people pushing a car that needs 50 (overdetermination), or is the group nothing over its members (bare case)?
  *   **Yes (Saturated):** Go to Q4.
  *   **No (Contingent):** Go to Q5.

  **Q4. Coupling:** If $A$ refrains, does the probability of similar units refraining increase?
  *   *Case:* If I stop flying, will 10% of my peers follow (partial compliance), or are we independent particles?
  *   **Yes (Coupled):** **Leaf: Rule Utilitarianism** (Obligation via generalization).
  *   **No (Independent):** **Leaf: Complicity Theory** (Wrong to join, even if no difference).

  **Q5. Damage Location:** Is harm only the final failure, or does the stress accumulation count?
  *   *Case:* Is damage only the bone break, or do micro-fractures count?
  *   **Final State Only:** **Leaf: Hard Inefficacy** (Unnamed: No obligation exists if no difference made).
  *   **Stress Counts:** **Leaf: Constitutive Harm** (Micro-harms aggregate morally).

  **Back to Q1/Q2 Linear/Hidden:** **Leaf: Act Utilitarianism** (Obligation based on expected value/probability).

  **Back to Q2 Stepped/Known + Q3 Not Saturated:** **Leaf: Threshold Deontology** (No obligation until trigger point).

  ***

  **LOGICAL SPACE MAP**
  *   **Occupied:** Act Utilitarianism (Linear/Hidden), Complicity (Saturated), Threshold Deontology (Known/Below).
  *   **Empty Cell 1:** *Known Threshold + Below Limit + Obligated.* **Incoherent.** Violates rationality; demands cost for zero causal leverage.
  *   **Empty Cell 2:** *Linear + Saturated + No Obligation.* **Unattractive.** Denies mathematical expectation; implies overdetermination absolves all prior contributors.
  *   **Empty Cell 3:** *Hard Inefficacy.* **Unexplored.** Rarely defended explicitly; usually hides behind other labels.

  ***

  **DOSE-RESPONSE ANALOGY CRITIQUE**
  Your framing is the spine, but it breaks at the boundary of agency. Tissue does not reorder itself based on exposure; supply chains do. In the "rounded" supermarket case, the system has memory and hysteresis. A linear no-threshold model assumes passive accumulation; social harms involve active management (inventory algorithms) that introduce discrete steps where biology has none. The analogy holds for *risk assignment*, but fails for *causal mechanics*.

  ***

  **MY COMMITMENT**
  *   **Load-Bearing Question:** **Q1 (Signal Shape).** Flipping this changes everything. If linear/hidden, expected utility solves the puzzle. If stepped/known, obligation vanishes until the cliff. Everything else is secondary processing.
  *   **Correct Leaf:** **Act Utilitarianism (Expected Value).** Even in threshold cases, if the trigger is hidden (rounded), the individual act carries a probability of being the trigger. You must bet on the probability, not the certainty.
  *   **Incoherent Cell:** **Known Threshold + Below Limit + Obligated.** You cannot be obliged to prevent a outcome you literally cannot affect when the rules of affect are known. That is not ethics; it is superstition.
