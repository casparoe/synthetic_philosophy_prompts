answer: |-
  1. Verify that the protected group has enough data points to be statistically meaningful, and if the count is below your company's threshold for reliability, flag the model as unassessable until more data is collected.
  2. Calculate whether predicted risk scores match actual outcome rates for each group, and separately measure if false positive and false negative rates are equal across those same groups.
  3. If the underlying approval rates differ between groups, accept that satisfying both calibration and equalized odds is mathematically impossible, meaning you must eventually pick one metric to prioritize.
  4. Quantify the exact performance loss required to fix the failing metric, acknowledging that improving one will necessarily worsen the other due to the base rate difference.
  5. Escalate the model to stakeholders for a final decision on which fairness definition aligns with company values, since mathematics cannot determine which error type is more ethically acceptable.
