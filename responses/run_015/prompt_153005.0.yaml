  ### Brainstorming Summary
  A localized, high-complexity contradiction (e.g., in Large Cardinal axioms) differs from a pervasive error (e.g., Naive Comprehension) in its *dependency depth*. Pervasive errors infect the inference rules or definitions required for basic arithmetic; localized errors reside in axioms optional for finite computation. This distinction matters for continuity because it allows for *surgical excision* rather than *foundation replacement*. However, the "leakage problem" arises because classical logic allows explosion ($\bot \to \phi$), and applied mathematics often uses "unsafe" axioms (Choice) to derive "safe" results (physics predictions). A theory of continuity must block explosion without invalidating the mixed proofs that rely on the contaminated axioms to reach empirically verified conclusions.

  | Desideratum | Requirement Statement | Motivating Case | Status (Hard / Negotiable) | Conflict Flag | Score vs A | Score vs B | Score vs C |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1: Arithmetic Stability** | $\Pi_1^0$ sentences provable in consistent fragments must remain provable and true. | Verification of finite computational results (e.g., prime number checks) must not be overturned. | Hard | None | Satisfies | Satisfies | Satisfies |
  | **D2: Non-Explosiveness** | The theory must not entail every sentence (avoid *ex falso quodlibet*) despite the contradiction. | Preventing the derivation of $1=2$ from the set-theoretic contradiction. | Hard | D3 | Fails | Fails | Satisfies |
  | **D3: Principled Quarantine** | There must be a formal criterion distinguishing "safe" derivations from "unsafe" ones. | Isolating Large Cardinal axioms from Separation/Replacement used in analysis. | Hard | D2, D4 | Partial | Partial | Satisfies |
  | **D4: Applied Empirical Adequacy** | Proofs yielding physical predictions must remain valid even if they invoke "unsafe" axioms. | Navier-Stokes existence proofs using Choice must still support fluid dynamics predictions. | Hard | D3 | Satisfies | Partial | Partial |
  | **D5: Logical Uniformity** | Prefer a single logic across all domains rather than hybrid systems. | Avoiding confusion when a proof moves from arithmetic to set theory. | Negotiable | None | Satisfies | Partial | Fails |
  | **D6: Heuristic Continuity** | Mathematicians should feel they are practicing the same discipline post-crisis. | Preserving standard proof techniques and notation where possible. | Negotiable | None | Partial | Fails | Satisfies |

