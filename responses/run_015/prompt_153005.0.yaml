prompt: |-
  You are a senior philosopher of mathematics and formal epistemologist with working knowledge of proof theory and the history of foundational crises. Before you draft anything, spend a brief moment brainstorming: what distinguishes a localized, high-complexity contradiction in the foundations from a pervasive mathematical error, and why does that distinction matter for evaluating continuity?

  Your task is to write the full specification of desiderata that any adequate theory of foundational continuity—call it Theory T—must meet, under the following crisis scenario. Suppose mathematicians prove an explicit contradiction within ZFC augmented by a standard large-cardinal axiom, but the contradiction is provably confined to statements about uncountable cardinals and non-constructive choice; meanwhile, arithmetic, real analysis, and every result with a direct computational verification below complexity class Π₃⁰ remain untouched. Theory T must explain how mathematics proceeds without global abandonment of set theory and without collapsing into naive instrumentalism or full-bore paraconsistency. Crucially, T must include a principled boundary mechanism that isolates the corrupted region from sound mathematics, and it must address the leakage problem: many applied-physics proofs (for example, existence arguments for Navier-Stokes solutions) implicitly invoke choice through non-constructive existence theorems, yet these must not be permitted to contaminate empirically validated predictions.

  For each desideratum, provide: (1) the exact conceptual or formal requirement; (2) the motivating case, thought experiment, or applied result that makes it a genuine constraint; (3) whether it is hard (non-negotiable) or negotiable, with brief justification; (4) if it stands in tension with another desideratum on your list, flag the pair and explain why joint satisfaction looks impossible. Keep the weight on the criteria and their motivating cases.

  Then briefly score three stances against your list—refer only by these labels, do not provide bibliographies, citations, or reading lists: (A) Quinean holistic revisionism (minimal mutilation of the web of belief); (B) structuralist retreat (relocating applied mathematics into a category-theoretic foundation claimed to be immune); (C) localist paraconsistency (accepting true contradictions only in the upper atmosphere of set theory, preserving classical logic elsewhere).

  Deliver your response in two structured parts. First, present a table with exactly these columns: Desideratum | Requirement Statement | Motivating Case | Status (Hard / Negotiable) | Conflict Flag | Score vs A | Score vs B | Score vs C. Fill every row consistently; the scoring columns should contain brief ratings (e.g., Satisfies / Partial / Fails) for each stance. Second, conclude with a JSON object containing exactly these fields: hard_desiderata_count (integer), negotiable_count (integer), primary_unsatisfiable_pair (string naming the two desiderata in tension), best_scoring_stance (string: A, B, or C), and critical_flaw_of_winner (string summarizing the single hard desideratum that even the best stance fails).
