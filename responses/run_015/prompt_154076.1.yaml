answer: |-
  Here are ten questions designed to corner the "coarser grain" defense, progressing from functional architecture to identity conditions and finally to falsification. Each includes a follow-up keyed to her most likely rebuttal.

  ### 1. The Global Workspace Problem
  **Question:** In human cognition, we often posit a global workspace to explain how disparate inputs become a unified, reportable state. Your colony relies on stigmergy—pheromone trails that decay and diffuse without a central locus of control. If there is no bottleneck where information converges *simultaneously*, is the Intentional Stance actually predicting behavior, or just rationalizing outcomes after the fact?

  **Likely Reply:** She will argue that brains don't have a central homunculus either; unity is an illusion or a output feature, not a structural requirement.
  **Follow-up:** "If unity is just an output, humans can report on visual and auditory inputs within milliseconds of each other. Pheromone diffusion takes minutes. Does the lack of temporal synchrony prevent the binding of distinct properties into a single object representation in a way that neuron firing does not?"

  ### 2. The Temporal Grain Latency
  **Question:** A colony's decision takes minutes; pheromone fields integrate over hours. What fixes the temporal grain of a mind? Could Aunt Hillary ever think about an event shorter than her own decision latency, like a falling leaf?

  **Likely Reply:** She will note that your "now" is also a constructed window; you don't perceive neural spikes, so why demand the colony perceive seconds?
  **Follow-up:** "My 'now' allows me to catch a ball before it hits me. If the environment changes faster than the pheromone update cycle, the colony crashes. Does a mind need to be able to model changes faster than its own update cycle to count as having a 'world model'?"

  ### 3. Dennett's Placement (Popperian vs. Gregorian)
  **Question:** You place the colony as Popperian because trails let it kill off routes internally. But if the nest architecture and trail network are doing the representational work, this looks less like Popperian internal hypothesis-testing and more like Gregorian use of an external mind tool. Does your account secretly need her to be Gregorian?

  **Likely Reply:** She will argue the distinction between internal and external is blurry; notebooks and smartphones are part of our extended mind too.
  **Follow-up:** "Gregorian creatures inherit tools culturally. Ants inherit trails physically and chemically. If the 'tool' is physically bonded to the biology, does this collapse the distinction between biological evolution and cultural evolution in your framework?"

  ### 4. The Persistence of Memory
  **Question:** If the trail network is the memory, and the ants are merely the readers and writers, does the mind persist when the ants are asleep or inactive?

  **Likely Reply:** She will point out that your mind persists when you sleep, so why not the colony's?
  **Follow-up:** "When I sleep, my neural structure remains intact. When ants sleep or die, the pheromone evaporates. Is the colony's 'memory' more like a neural structure or like a whiteboard that gets erased by the weather?"

  ### 5. Individual Agency vs. Neural Subsistence
  **Question:** You argue the 'coarser grain' reply works for humans and neurons. But neurons are causally locked by physics; they don't have competing survival drives. Ants do. What stops an ant from eating the food instead of bringing it back, and does that individual agency undermine the colony's agency in a way a neuron's 'agency' does not?

  **Likely Reply:** She will claim neurons can misfire or fail to propagate signals; it's all just noise in the system either way.
  **Follow-up:** "When a neuron misfires, it's noise. When an ant defects, it's a competing agent pursuing its own fitness. Does the colony spend energy suppressing internal rebellion in a way a brain does not suppress neuronal rebellion?"

  ### 6. The Locus of Error
  **Question:** For a system to have beliefs, it must be capable of error. When an ant follows a false trail and walks off a cliff, who is mistaken? The ant or Aunt Hillary?

  **Likely Reply:** She will say it doesn't matter; the system failed, and the distinction is arbitrary.
  **Follow-up:** "If the ant dies correcting the error, the colony loses a worker. If I correct a false belief, I lose nothing physical. Does the cost of error falling on the *constituents* rather than the *whole* suggest the constituents are the true subjects?"

  ### 7. The Fission Case
  **Question:** If the colony were divided into two viable halves that later re-merge, does Aunt Hillary become two subjects and then one again?

  **Likely Reply:** She will cite split-brain patients, suggesting human consciousness can also divide into two streams.
  **Follow-up:** "Split-brain patients rarely re-merge into a single corpus callosum. If two streams of consciousness merge, how are contradictory beliefs resolved without a central arbiter?"

  ### 8. Turnover and Identity
  **Question:** How does that fission case differ from the ordinary case in which the queen dies and every worker is replaced within a season?

  **Likely Reply:** She will invoke the Ship of Theseus; you replace your cells too, yet remain you.
  **Follow-up:** "I replace my cells, but I don't replace my *structure* via an external queue. If the queen dies, the colony's organizational structure fundamentally shifts. Is Aunt Hillary the same subject after a queen replacement, or a successor?"

  ### 9. The Complexity Threshold
  **Question:** If I map every ant to a neuron, the ant has a much richer behavioral repertoire than a neuron. If the parts are themselves Popperian creatures capable of learning, does the richness of the parts threaten the unity of the whole?

  **Likely Reply:** She will argue that complexity of parts doesn't negate complexity of the whole; a society can be an agent.
  **Follow-up:** "If the parts are themselves thinkers, does the colony become a society of minds rather than a single mind? At what point does the 'coarser grain' become a 'crowd'?"

  ### 10. Falsification
  **Question:** Finally, what observation would count against your claim that the colony, rather than its ants or its environment, is the locus of the mind?

  **Likely Reply:** She will likely say that if the system stops behaving intelligently or adaptively, the claim is defeated.
  **Follow-up:** "If the ants stop behaving intelligently, the colony stops. If the colony stops, the ants might still live. Which cessation is the death of the subject? If you can't distinguish them observationally, is this metaphysics or science?"
