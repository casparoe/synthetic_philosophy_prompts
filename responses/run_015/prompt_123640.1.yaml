  3.  **Predicting Ryle's View:**
      *   *Traditional Ryle:* He hated the idea of mental states as hidden inner causes. He viewed mental talk as describing dispositions to behave.
      *   *LLMs:* They are purely behavioral (input -> output). There is explicitly no "ghost" (no consciousness claimed by most developers) and no "machine" in the Cartesian sense (no homunculus inside).
