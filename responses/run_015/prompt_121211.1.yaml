  8.  **Final Polish:** Ensure the distinction between "Identity" (strict) and "Survival" (what matters) is clear, as this is the Parfit/Dennett overlap. Ensure the distinction between "Fiction" (Dennett) and "Illusion" (Metzinger) is clear.

