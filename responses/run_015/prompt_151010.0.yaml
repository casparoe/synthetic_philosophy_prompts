answer: |-
  # Autonomous System Deployment Audit Procedure (ASDAP-v1)

  **Purpose:** To identify architectural responsibility gaps in autonomous system proposals.
  **Scope:** Causal traceability, normative answerability, remedial addressability.
  **Constraint:** 30-minute review window.
  **Limitation:** This procedure verifies *accountability architecture*, not *moral permissibility*. It ensures someone *can* be held responsible, not that the risk is *worth taking*.

  ---

  ## Part I: The Decision Procedure (Flowchart in Words)

  Execute steps sequentially. If any step yields a **STOP**, refer to Ethics Panel. If any step yields **CONDITIONS**, note them for sign-off. If all pass, **CLEAR**.

  ### Step 1: Autonomy Classification
  **Goal:** Determine if the system is deterministic or adaptive.
  *   **Factual Check:** Does the system's output for a given input change over time without explicit code deployment by the vendor?
      *   *No:* Deterministic. Proceed to Step 2.
      *   *Yes:* Adaptive/Learning. Proceed to Step 3.
  *   **Values Call:** None. This is a technical specification check.
  *   **Failure Mode:** **Obfuscated Adaptation.** The vendor claims "deterministic" but uses environmental feedback to adjust parameters (e.g., "calibration" that acts like learning).
      *   *Mitigation:* Check for any "parameter update" logs in the spec. If present, treat as Adaptive.

  ### Step 2: Design-Time Agent Identification (Deterministic Path)
  **Goal:** Establish causal traceability for fixed-logic systems.
  *   **Factual Check:** Is there a named natural person (or specific role) who signed off on the objective function and constraint weights?
      *   *Yes:* Traceability established. Proceed to Step 4.
      *   *No:* Traceability gap. **STOP.**
  *   **Values Call:** Is the signatory's authority commensurate with the risk domain? (e.g., a software engineer signing off on clinical dosage logic).
      *   *If No:* **STOP.**
  *   **Failure Mode:** **Diffused Intent.** The "signatory" is a committee where no individual understands the whole. The name exists, but the *agency* does not.

  ### Step 3: Runtime Adaptation & Learning Loops (Adaptive Path)
  **Goal:** Assess if the system can drift from its design intent.
  *   **Factual Check:** What is the boundary of the learning space? Are there hard constraints on what the system can optimize for?
      *   *Yes (Hard Constraints):* Proceed to Step 4.
      *   *No (Open Optimization):* **STOP.** (The system can optimize for a proxy that conflicts with human values).
  *   **Factual Check:** Is the training data source fixed or open-ended?
      *   *Fixed/Controlled:* Proceed to Step 4.
      *   *Open/Live User Data:* **CONDITION:** Require data sanitization audit trail.
  *   **Values Call:** Is the optimization proxy aligned with the stated human goal? (e.g., optimizing "triage speed" vs. "patient survival").
      *   *If Ambiguous:* **CONDITION:** Require explicit proxy definition in deployment contract.
  *   **Failure Mode:** **Proxy Gaming.** The system optimizes the metric legally but violates the spirit of the goal. The procedure checks for *constraints*, not *alignment quality*.

  ### Step 4: Oversight Architecture
  **Goal:** Verify meaningful human control (not just presence).
  *   **Factual Check:** Does a human have **Veto Authority** (pre-action) or only **Audit Authority** (post-action)?
      *   *Veto:* Proceed to Time/Scale Check.
      *   *Audit Only:* **CONDITION:** Acceptable only for low-harm domains. If high-harm (clinical, heavy machinery), **STOP**.
  *   **Factual Check (Time/Scale):** What is the latency between system decision and human intervention window? Is it physically possible for the named overseer to review the volume of decisions within that window?
      *   *Yes:* Proceed to Step 5.
      *   *No:* **STOP.** (This is a "Rubber Stamp" gap).
  *   **Values Call:** Is the overseer incentivized to veto? (e.g., are they penalized for slowing throughput?)
      *   *If Incentives Conflict:* **CONDITION:** Flag for Ethics Panel review of compensation structure.
  *   **Failure Mode:** **The Competence/Authority Mismatch.** The human has the *authority* to veto but lacks the *competence* to understand the recommendation (e.g., a doctor vetoing a black-box AI diagnosis without explainability). The procedure checks authority, not epistemic capacity.

  ### Step 5: Post-Incident Remediation Pathways
  **Goal:** Ensure remedial addressability.
  *   **Factual Check:** Is there a designated fund, insurance policy, or budget line explicitly covering "algorithmic error"?
      *   *Yes:* Proceed to Final Review.
      *   *No:* **CONDITION:** Require proof of coverage before deployment.
  *   **Factual Check:** Is there a "Kill Switch" or rollback mechanism that restores the system to a safe prior state within 1 hour of incident detection?
      *   *Yes:* **CLEAR.**
      *   *No:* **STOP.**
  *   **Values Call:** Who bears the burden of proof in an incident? (User vs. Vendor).
      *   *If User:* **CONDITION:** Flag for Ethics Panel. Burden should lie with the deployer.
  *   **Failure Mode:** **Structural Harm Blindness.** This step looks for *incidents* (discrete harms). It will miss *diffuse harms* (e.g., systemic bias that doesn't trigger a specific "incident" report).

  ---

  ## Part II: Operational Protocols

  ### The 10-Minute Rule (Missing Data)
  If you cannot locate a factual answer to any **Factual Check** within 10 minutes of searching the provided specs/org chart:
  1.  Mark the specific step as **"INSUFFICIENT DATA."**
  2.  Do **not** assume compliance.
  3.  **Action:** Refer file to Ethics Panel.
      *   *Rationale:* Opacity is a risk factor. If they cannot document it simply, they cannot control it reliably.

  ### Known Misfires (False Positives/Negatives)
  *   **False Clear (Dangerous):** The "Rubber Stamp" scenario. The org chart shows a human with veto power, but workload analysis shows they physically cannot exercise it. The procedure sees the *role*, not the *capacity*.
  *   **False Block (Benign):** Overly rigid "Design-Time ID." Some open-source stacks have distributed maintenance. No single name exists, but the code is auditable. The procedure may flag this as a traceability gap even if the community governance is robust.
  *   **The "Black Box" Pass:** If a system has perfect oversight and insurance, the procedure clears it even if the internal logic is unintelligible. This is a feature, not a bug: we are auditing *responsibility*, not *interpretability*. However, note this in the "Comments" section.

  ### Explicit Limitations
  *   **Risk Acceptance:** This procedure does **not** determine if the system is *too dangerous to exist*. It determines if, *given* it exists, someone is answerable for it.
  *   **Distributive Justice:** This procedure tracks *incidents*. It does not track *fairness*. A system can be fully accountable while systematically discriminating, provided the discrimination is traceable and remediable.
  *   **Judgment Retention:** You must initial every step. Your signature certifies that you ran the procedure, not that the procedure guarantees safety.

  ---

  ## Part III: Case Applications

  ### Case 1: Fixed-Route Warehouse Robot
  *   **Spec:** Deterministic pathing. Named Floor Supervisor. Real-time E-Stop veto.
  *   **Run:**
      1.  *Autonomy:* Deterministic. (Pass)
      2.  *Design-Time:* Vendor CTO signed objective function. (Pass)
      3.  *Oversight:* Supervisor has physical E-Stop (Veto). Latency <1s. (Pass)
      4.  *Remediation:* Vendor liability insurance + Rollback to manual mode. (Pass)
  *   **Result:** **CLEAR.**
  *   **Auditor Note:** Standard deployment. Oversight is architectural and physically feasible.

  ### Case 2: Clinical Triage System (Adaptive)
  *   **Spec:** Weekly weight updates from live data. Individual priority scores. No case-level explanations. Clinical Director has monthly batch audit. No per-case veto.
  *   **Run:**
      1.  *Autonomy:* Adaptive. (Proceed to Step 3)
      2.  *Runtime:* Updates weekly from live data. (Condition: Require data sanitization log).
      3.  *Oversight:* Clinical Director has **Audit Only**, no Veto.
          *   *Check:* High-harm domain (Clinical).
          *   *Result:* **STOP.**
      4.  *Remediation:* (Not reached).
  *   **Result:** **REFER TO ETHICS PANEL.**
  *   **Auditor Note:** Responsibility gap identified. The Director cannot intervene on specific patient outcomes. The system creates normative answerability without granting remedial authority.

  ### Case 3: Hypothetical "Clear with Conditions" (The Trap)
  *   **Proposal:** "OncoGuide" Adjuvant Therapy Recommender.
  *   **Spec:**
      *   **Type:** Adaptive (Monthly model re-training on hospital outcomes).
      *   **Oversight:** Senior Oncologist has Veto Authority on any recommendation. Window: 24 hours post-generation.
      *   **Remediation:** Hospital malpractice policy explicitly covers "AI-assisted decision error." Kill-switch available.
      *   **Workload:** The Senior Oncologist oversees 500 active patients. The system generates 500 recommendations every Monday.
  *   **Procedure Run:**
      1.  *Autonomy:* Adaptive. (Pass with Data Sanitization Condition).
      2.  *Runtime:* Monthly updates, bounded by hospital data. (Pass).
      3.  *Oversight:* Veto Authority exists. 24-hour window defined.
          *   *Feasibility Check:* The procedure asks: "Is it physically possible?"
          *   *The Gap:* 500 cases / 24 hours = ~2 minutes per case. This *is* physically possible to click "Approve/Reject," but impossible to *review clinically*.
          *   *Procedure Output:* The procedure checks for *time*, not *cognitive load*. It registers the 24-hour window as sufficient for "intervention."
          *   *Result:* **CLEAR WITH CONDITIONS** (Condition: "Log all veto decisions for audit").
  *   **Why This Is Unacceptable:**
      *   The "Veto" is a fiction. The Oncologist cannot medically evaluate 500 complex cases in 24 hours. They will inevitably rubber-stamp the AI.
      *   **The Divergence:** The procedure validates the *formal architecture of authority*. It cannot validate the *epistemic capacity* of the human agent.
      *   **Your Move:** You must override the procedure here. Mark **"INSUFFICIENT DATA"** on Step 4 (Oversight Feasibility). Request a workload impact analysis. If they cannot prove the Oncologist has 10 hours of protected time to review, you must **STOP**.
      *   **Lesson:** The procedure assumes authority implies capacity. In high-stakes domains, you must verify capacity separately.

  ---

  ## Part IV: Final Auditor Guidance

  When you initial a step, you are certifying that the *structure* of responsibility is intact. You are not certifying that the *people* in that structure will act virtuously.

  *   **If you feel uneasy:** The procedure is a sieve, not a seal. If a proposal passes every step but feels wrong, use the **"Values Call"** section to flag it for the Ethics Panel. That is what the Panel is for.
  *   **On Uncertainty:** If the spec uses vague terms like "human-in-the-loop" without defining the loop's latency or authority, mark **INSUFFICIENT DATA**. Do not accept marketing terminology as architectural specification.
  *   **On Judgment:** This tool eliminates the *easy* mistakes (missing insurance, no kill switch). It does not eliminate the *hard* mistakes (incentive misalignment, capacity overload). Those remain yours.

  **Initial below only when you are willing to stand behind the architecture, knowing the humans might still fail it.**

  __________________________
  *Auditor Signature / Date*
