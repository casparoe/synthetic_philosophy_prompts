      *   *Metzinger:* "The Ego Tunnel." Focuses on the "Phenomenal Self-Model" (PSM). Transparency is key (we look *through* the model, not *at* it).
      *   *Predictive Processing:* Often associated with Hohwy, Clark, Friston. Compatible with Illusionism but not identical.
      *   *The "Hard Problem":* Illusionists (Dennett, Metzinger, Frankish) claim it dissolves or is a cognitive illusion.
      *   *AI Claim:* This is the tricky part. Just because something *can* be simulated doesn't mean current architectures *do* simulate it, or that "sufficient capacity" is well-defined. Also, functional equivalence $\neq$ ontological identity for some critics, but for Illusionists, functional equivalence *is* the ontology.
      *   *The GUI Analogy:* Very common in this literature (Hoffman, Dennett).
