          7.  Conclusion 2 (Hard Problem): Dissolves entirely (asking "what it's like" is like asking why an icon "feels like" a folder).
      *   **User's Task:** Audit the summary claim by claim.
      *   **Specific Questions:**
          *   What is accurate vs. conflation/overstatement?
