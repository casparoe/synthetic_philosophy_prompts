answer: |-
  1. Objections in order

  1. **Moral Psychologist:** "Depressed agents can't register defects. Your view says they have no reasons. That's cruel and empirically wrong."
  *Reply:* It diagnoses normative isolation, not moral worth. If the motivational set is closed to repair, external reasons don't grip. We offer diagnosis, not therapy. The view explains why we feel pity rather than blame. It preserves the intuition that reasons require a foothold. Without a registrable defect, there is no entry point for criticism.
  *Concede:* Acknowledge this limits normative hope for severe pathology; doesn't solve clinical treatment.

  2. **Decision Theorist:** "Is the repair relation well-defined? What about cycles? A repairs B, B repairs A. Is the fixed point stable?"
  *Reply:* The 'finite chain' clause blocks infinite loops. Order-dependence is intentional; paths matter. No unique fixed point is required for reasons to exist. Different paths yield different reasons, which reflects agent history. Stability isn't the goal; connectivity is.
  *Concede:* Admit no algorithmic guarantee of convergence; uniqueness is not promised.

  3. **Kantian:** "Your 'defect' is just the moral law smuggled in. You've reversed the order of explanation. Rationality dictates the repairs."
  *Reply:* Defects are structural (means-end), not substantive. The moral law isn't needed to spot inconsistency. The agent registers the defect, not an external law. Rationality is the tool, not the master.
  *Concede:* The line between structural and substantive is thinner than claimed; some overlap exists.

  4. **Humean Projectivist:** "Are these repairs truth-tracking or just a genealogy of our practices? Do you claim normative realism?"
  *Reply:* Genealogy first. Stability in repair practices creates the appearance of truth-tracking. No robust realism needed. The project is explaining our discourse, not grounding it in Platonism. We track stability, not facts.
  *Concede:* Deny independent normative facts driving the repairs; it's quasi-realist.

  5. **Primitivist:** "This counterfactual machinery is idle. Reasons are primitive. You're reducing the irreducible."
  *Reply:* Machinery explains agent-specific binding. Primitivism loses the link between agent and reason. It answers 'why me?' where primitivism stops. The counterfactuals do work explaining grip.
  *Concede:* Doesn't eliminate the primitive 'ought', just anchors it to agents.

  6. **Action Theorist:** "Is weakness of will a defect or just competing motivations? You conflate akrasia with irrationality."
  *Reply:* Diachronic uptake failure is the defect, not the competition. Akrasia breaks the chain. The agent fails to execute registered intentions. It's a failure of transmission, not content.
  *Concede:* Empirical distinction is hard to draw; clinical vs. moral weakness blurs.

  7. **Senior Normative:** "What does this change for first-order ethics? Why should I care about this metaethical machinery?"
  *Reply:* Limits blame. You can't blame agents unreachable from here. Normative criticism requires a path. It prevents utopian demandingness. It tells you when criticism is futile.
  *Concede:* Doesn't generate new duties, only constraints on criticism and blame.

  8. **Grad Student:** "Why 'local' repairs? Why not global idealization? Where do you stop the chain?"
  *Reply:* Global breaks the grip condition. Agents must recognize each step. Stopping point is when no further defects are registrable. Local ensures the agent owns the change.
  *Concede:* 'Local' is context-sensitive and vague; boundary cases exist.

  2. What to concede before the first question

  In my opening remarks, I will explicitly state that this view does not guarantee a unique idealized endpoint for every agent. Path-dependence is a feature, not a bug. I will also concede that 'local repair' is context-sensitive and lacks a precise algorithmic definition. By owning the vagueness now, I prevent the Decision Theorist and Grad Student from treating it as a fatal flaw later. It frames the view as practical rather than formal.

  3. The reply that has to land

  "The anchoring clause is not a constraint on rationality; it is a constraint on *ownership*. Externalism gives you reasons the agent cannot recognize; Humeanism gives the agent recognition without reasons. My view says a reason is only a reason if the agent can walk the path to it without losing themselves. If the agent cannot register the defect, the reason does not exist for them. This preserves the internalist grip while allowing normative criticism of deformable sets."

  4. The question I hope nobody asks

  **The Kantian Constructivist:** "If an agent registers sexism as a virtue, is repairing it a defect? If you say yes, you're an externalist. If no, you're a relativist. Your 'registrable' clause collapses."
  *Honest Answer:* "If the agent cannot register it as a defect, I cannot claim they have a reason to stop without violating internalism. This view accepts that some agents are normatively isolated from moral truths. It is a cost of taking internalism seriously."
  *Fallback:* "That case tests the limits of 'defect.' I define defects structurally—means-end, consistency. Substantive moral errors are only defects if they create structural instability. I need to think more about substantive structural links."

  5. Wording traps in my own slides

  Avoid the word "Idealization" on slide one; it sounds externalist. Use "Modification" or "Repair." Avoid "Defect" without qualification; it sounds normative. Use "Registrable Inconsistency." Do not say "Rational Agent" when you mean "Agent undergoing repair." Say "Agent at stage n." This prevents the Kantian from claiming you've presupposed a thick notion of rationality before the argument begins. Precision here blocks the smuggling objection.
