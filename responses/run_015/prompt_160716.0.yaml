  **Brainstorming Notes**

  The genuinely ridiculous feature of the non-identity problem isn't the metaphysics of personhood; it's the administrative erasure of harm. If harm requires a specific victim who is worse off than they would otherwise be, and the alternative is non-existence, then suffering becomes invisible to cost-benefit analysis provided life remains "worth living." The satire lies in codifying this as a form-filling exercise. The bureaucracy shouldn't question the morality; it should simply adjust the "Persons Affected" column based on conception dates. The technical apparatus should be a threshold for genetic distinctness—something measurable like a time-shift in conception. The ending must show a policy that harms the living (visible cost) and the future (invisible cost), yet gets approved because the invisible cost is administratively zero.

  ***

  **OFFICE FOR INTERTEMPORAL FISCAL COMPLIANCE**
  **Supplementary Impact Assessment Guidance Note 88-F**
  **Subject: Conditional Existence Exemption (CEE) Protocols**

  **1.0 Purpose and Scope**
  This note clarifies the application of Section 5.2 (Person-Affecting Restriction) of the National Impact Assessment Framework. It addresses policies where the implementation timeline alters the identity of future persons rather than merely affecting the welfare of pre-existing persons. Under the Conditional Existence Exemption (CEE), officers must distinguish between *Same-Person Choices* and *Different-Person Choices*. Where a policy determines which specific individuals come into existence, those individuals cannot be logged as "adversely affected" unless their quality of life falls below the Net Negative Existence Threshold (NNET).

  **2.0 Technical Apparatus: Conception-Displacement Threshold**
  To operationalize identity distinction, Assessing Officers must apply the Conception-Displacement Threshold (CDT). Genetic modeling indicates that a shift in conception timing of greater than 48 hours results in a distinct genetic entity. Therefore, if a policy alters economic or environmental conditions such that the average conception date for the affected demographic shifts by >48 hours relative to the counterfactual baseline, the resulting population is considered distinct.

  For the purposes of Form 12-B (Cost-Benefit Analysis), distinct persons generated by the policy are not considered "worse off" than their counterfactual non-existence, provided their projected welfare remains above the NNET. Consequently, the "Persons Adversely Affected" column for this cohort must be entered as zero. This exemption does not apply to persons already alive at T0 (Decision Date), whose identity is fixed.

  **3.0 Worked Example: Oakhaven Waste Storage Initiative**
  **Policy:** Construction of low-security nuclear waste facility in Oakhaven Valley.
  **Current Population:** 450 residents (Identity Fixed).
  **Projected Future Population (T+50 years):** 2,000 residents (Identity Variable).

  **3.1 Impact Analysis**
  *   **Current Residents:** Increased particulate matter during construction projects to reduce life expectancy by an average of 1.2 years. This constitutes a quantifiable harm.
      *   *Form 12-B Entry (Persons Affected):* 450.
  *   **Future Residents:** Facility leakage projected to increase cancer risk by 15% over baseline. However, the economic activity required to build the facility accelerates local employment, shifting average conception dates by 3 weeks.
      *   *CDT Calculation:* 3 weeks > 48 hours threshold. Identity distinct.
      *   *Welfare Check:* Projected life satisfaction remains above NNET (life deemed worth living despite health risks).
      *   *Form 12-B Entry (Persons Affected):* 0.

  **3.2 Net Assessment**
  While the policy imposes health costs on the current population, the exclusion of the future cohort from the "Persons Affected" column significantly reduces the total negative utility score. The budget savings from low-security construction outweigh the quantified harm to the 450 existing residents. The harm to the 2,000 future residents is administratively nullified under the CEE, as they would not exist to experience harm under the alternative high-security protocol (which would delay conception via reduced economic activity).

  **4.0 Compliance**
  Officers are reminded that questioning the CEE violates the Neutrality Principle. The form reflects the metaphysical status of the claimants, not the moral weight of their suffering. Ensure the "Persons Affected" total matches the CDT calculation exactly. Discrepancies will be returned for revision.

  **Approved by:**
  *Dr. A. Vance, Head of Temporal Equity & Fiscal Standards*
  *Office for Intertemporal Fiscal Compliance*
