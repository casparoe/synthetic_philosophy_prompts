  2.  **Deconstruct the "Problem of Old Evidence" (Bayesian Context):**
      *   *The Puzzle:* If evidence $E$ is already known (probability = 1) before hypothesis $H$ is formulated, then $P(E|H) = P(E) = 1$. Consequently, $P(H|E) = P(H)$. The evidence $E$ cannot confirm $H$ because it doesn't raise the probability of $H$.
