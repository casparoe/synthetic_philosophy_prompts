  **JOINT STATEMENT ON THE ONTOLOGY OF THEMATIC QUALITIES**

  **PREAMBLE**
  We, the undersigned critics, representing divergent ontological commitments regarding narrative art, hereby submit this document as the record of our adversarial collaboration. While we remain divided on the fundamental existence of thematic universals, we acknowledge that our disagreement is productive only within a shared framework of inquiry. This statement delineates the ground we hold in common, the precise coordinates of our divergence, and the specific empirical cruxes upon which our theoretical differences turn.

  ***

  ### I. AGREED CLAIMS

  1.  **Conditions of Adequacy:** Any adequate account of thematic quality (e.g., tragic irony, narrative melancholy) must explain two phenomena: the *stability* of critical consensus across time (why distinct readers often identify the same quality in a text) and the *variability* of interpretation across cultures (why those same qualities may vanish or mutate in different historical contexts). A theory that explains stability at the cost of variability, or vice versa, is insufficient.
  2.  **The Role of Authorial Intent:** Authorial intent is neither the sovereign determinant of thematic meaning nor irrelevant to it. Intent functions as a constraint on interpretation. A reading that contradicts established historical evidence of the author's design is not thereby impossible, but it bears a higher burden of proof to demonstrate how the text sustains the quality independent of that design.
  3.  **Cross-Cultural Resonance:** Two culturally and historically distant novels may genuinely share the same thematic quality. We agree that when a reader in 12th-century Kyoto and a reader in 19th-century Paris both identify a specific quality of "transient sorrow" in distinct texts, this is not merely a linguistic coincidence. However, we disagree on what constitutes the "sameness" of that quality.
  4.  **Textual Constraint:** The text itself imposes limits on interpretation. Not all readings are equally valid. A reading must be grounded in the syntactic, semantic, and structural features of the work. Pure projection, where the reader ignores textual evidence to impose a theme, is rejected by both parties as criticism.

  ***

  ### II. STATEMENTS OF DISAGREEMENT

  | Topic | The Narrative Realist Position | The Narrative Constructivist Position |
  | :--- | :--- | :--- |
  | **Ontological Status** | Thematic universals are mind-independent abstract objects or properties. A novel *instantiates* melancholy in the same way a physical object *instantiates* mass. The quality exists within the structure of the work regardless of whether it is perceived. | Thematic qualities are emergent, relational properties. They exist only in the event of reading. A novel does not *contain* melancholy; it possesses the *capacity to afford* an experience of melancholy within a specific interpretive community. |
  | **Truth Conditions** | A statement about a theme (e.g., "This novel is tragic") is truth-apt. It is either correct or incorrect based on whether the work successfully instantiates the universal form of Tragedy. | A statement about a theme is a report on a successful interaction. It is valid or invalid based on coherence with interpretive norms, not correspondence to an external abstract object. |
  | **The Nature of Error** | When a reader fails to detect a thematic universal present in the text, the error lies in the reader's perception. The text remains defective only if it fails to instantiate the universal clearly enough to be detected by a competent observer. | When a reading diverges from the consensus, the error is not ontological but pragmatic. The text is not "broken"; the interpretive practice has simply generated a different outcome. The text is a tool, and tools do not have single correct uses. |

  ***

  ### III. THE CRUXES

  We identify two specific philosophical impasses where our positions are mutually exclusive. Resolution of these cruxes is not required for collaboration, but clarity regarding them is essential.

  **Crux A: The Argument from Intersubjective Agreement**
  *Question:* Does widespread agreement among competent readers regarding a thematic quality necessitate the existence of a shared abstract object causing that agreement?
  *   **Realist Necessity:** Yes. Consensus is evidence of detection. Without a shared object to detect, agreement would be miraculous.
  *   **Constructivist Sufficiency:** No. Consensus is evidence of shared cognitive infrastructure and cultural training. Agreement proves shared processing, not shared objects.

  **Crux B: The Argument from Thematic Defect**
  *Question:* If a novel is widely and persistently misread thematically (e.g., read as comic when it is tragic), is the defect located in the novel's construction or in the reception?
  *   **Realist Location:** The defect is primarily in the reception (the readers failed), unless the text is so ambiguous it fails to instantiate the universal. A "misread" implies a "correct read" exists independently.
  *   **Constructivist Location:** The defect is in the communicative circuit. If the text consistently generates the "wrong" theme in a specific culture, the text has failed to afford the intended quality *for that culture*. There is no "correct read" outside of actual reading practices.

  ***

  ### IV. LITERARY CASES AND PREDICTED INTERPRETATIONS

  For each Crux, we have selected a concrete literary case that both sides accept as bearing on the problem. Below we record our predicted interpretations of these cases in advance of further analysis.

  #### Case for Crux A (Intersubjective Agreement)
  **The Texts:** *The Tale of Genji* (Heian Japan) and *Madame Bovary* (19th Century France).
  **The Phenomenon:** Readers in both traditions identify a quality of "inevitable disillusionment with worldly desire."

  *   **Realist Interpretation:** The structural differences between the texts are superficial. Both works instantiate the same abstract universal of *Worldly Disenchantment*. The fact that this quality is recognized across a millennium and distinct cultures proves the universal exists independently of the specific texts. The texts are merely different vessels for the same substance.
  *   **Constructivist Interpretation:** The texts share structural affordances (narratives of desire followed by loss) that trigger similar affective responses in human readers. The "sameness" is a function of human psychology and the similar social structures of courtly life, not an abstract object. The quality is generated anew in Kyoto and Rouen; it does not travel between them.

  #### Case for Crux B (Thematic Defect/Misreading)
  **The Text:** *Moby-Dick* (1851).
  **The Phenomenon:** For several decades following publication, the work was predominantly received and categorized as a straightforward sea adventure narrative, largely ignoring its metaphysical and tragic dimensions.

  *   **Realist Interpretation:** The early reception was defective. The novel *contained* the tragic universal of "Man vs. The Void" from the moment of its completion. The early readers lacked the critical competence to detect the instantiation. The novel was not at fault; the perception was. The quality was real but unseen.
  *   **Constructivist Interpretation:** During those decades, the novel *was* an adventure story. Thematic quality is not a hidden container to be found but a function of the reading practices of the time. When interpretive practices shifted in the 20th century, the novel *became* a metaphysical tragedy. The text did not change; the relational conditions for generating the theme changed.

  ***

