prompt: |-
  Hey, so I'm a TA for an intro philosophy of AI course and next week I have to teach Turing's view on how machines should be educated — specifically the bit where he argues we should start with a child machine and teach it, rather than trying to program an adult one from scratch. My students are undergrads, mostly CS majors, so they know what a neural net is and have heard of reinforcement learning, but none of them have actually read the 1950 paper. I need a plan for a fifty-minute section.

  What I want from you is not the explanation itself, but the teaching plan. Specifically: what idea has to be in place before the question even makes sense to them — like, why is "just program it" not obviously the right move, and what has to break down in their mental model first? What's the one running example that should carry the whole section, and what does that example need to have and lack in order to do the work? I'm thinking maybe chess, but im not sure it's the right carrier. Which misconceptions will the students predictably bring in or form along the way — I'm guessing a lot of them will go "but we already do this with RL, so what's the point?" and maybe also "Turing was just saying machines can learn, which is obvious now" — and exactly where in the sequence should each one be headed off so it doesn't poison the rest of the lecture? And what's one question I can ask at the end that would show they actually got the dependency structure of the argument versus just nodding along?

  One more thing: I want a brief moment where the connection to what we're actually doing with modern LLMs clicks, but I don't want to spend the whole section on that. Can you work in where that moment should land and what the minimal version of it looks like? Please write the whole thing as continuous prose, no headings, no bullets, no bold, no tables — just flowing paragraphs like you're emailing me the plan.
