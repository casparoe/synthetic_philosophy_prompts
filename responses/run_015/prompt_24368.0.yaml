answer: |-
  # Joint Statement on the Concept of Biological Function
  **Prepared by:** The Etiological and Causal-Role Working Groups
  **Date:** October 26, 2023
  **Context:** Philosophy of Biology Seminar

  ## Part I: Agreed Claims regarding Phenomena and Explanatory Adequacy

  Before detailing our disagreements, we affirm the following claims regarding the biological phenomena any satisfactory account of function must address. We agree that these phenomena are real and that our respective theories are attempts to systematize them.

  1.  **Regularity and Contribution:** Biological traits (e.g., hearts, feathers, enzymes) exhibit stable regularities and typically contribute to the survival, reproduction, or capacities of the organism containing them.
  2.  **The Function/Effect Distinction:** There is an intuitive distinction between what a trait is *for* (its function) and what a trait merely *does* (its side effects or accidental consequences). For example, the heart makes a thumping sound, but that is not its function.
  3.  **The Reality of Malfunction:** Biological traits can fail. It is meaningful to say a specific heart is "failing" or "broken" even if it is a member of a type (hearts) that generally works.
  4.  **Exaptation and Novelty:** Traits can acquire new uses over time. A trait may evolve for one reason (e.g., thermoregulation) and later be utilized for another (e.g., flight). Additionally, novel traits can arise that have no evolutionary history yet appear to serve a purpose.
  5.  **Explanatory Utility:** Attributing functions is not merely metaphorical; functional explanations are indispensable to biological research, guiding inquiry into mechanism, development, and evolution.
  6.  **Token vs. Type:** We distinguish between trait *types* (the general kind, e.g., "the vertebrate heart") and trait *tokens* (specific instances, e.g., "this specific heart in this specific patient").

  ## Part II: Statement of Disagreement and Cruxes

  While we agree on the phenomena listed above, we disagree on the metaphysical and conceptual grounds that justify function attributions. The following table outlines our precise points of divergence, the specific cruxes (sub-questions) that sustain the disagreement, and the test cases we propose to resolve them.

  | Area of Disagreement | Etiological Account (Selected Effects) | Causal-Role Account (Current Contribution) |
  | :--- | :--- | :--- |
  | **Core Definition** | A trait's function is determined by its **evolutionary history**. $X$ has function $F$ if $X$ exists because ancestors of $X$ did $F$ and were naturally selected for doing $F$. | A trait's function is determined by its **current causal capacity**. $X$ has function $F$ if $X$ currently performs $F$ and $F$ contributes to the capacity or fitness of the containing system. |
  | **The Status of Normativity** | Function is inherently **normative**. Selection history establishes a standard of "proper functioning." A trait *ought* to do what it was selected for, even if it currently cannot. | Function is inherently **descriptive/dispositional**. Function is a matter of what a trait *can* and *does* do within a system. Normativity is a secondary judgment we add, not part of the function itself. |
  | **Crux 1: The Possibility of Non-Performing Functions**<br>*(Can a trait have a function it is not currently performing?)* | **Yes.** A trait retains its function as long as it belongs to a lineage selected for that activity, even if the specific token is broken. | **No.** If a trait token loses the capacity to contribute to the system, it loses that function. A "broken" trait is simply a trait without that function. |
  | **Case for Crux 1:**<br>*The Stopped Heart*<br>A human heart suffers a massive infarction and stops pumping blood permanently, though it remains in the body. | **Prediction:** We should say the heart **malfunctions**. It still has the function of pumping blood, but it is failing to meet the historical standard. | **Prediction:** We should say the heart **has lost the function**. It no longer contributes to the organism's capacity; calling it a "malfunctioning pump" is shorthand for "a pump that no longer pumps." |
  | **Crux 2: The Time-Index of Function**<br>*(When does a new function begin?)* | **History-Dependent.** A trait only acquires a new function when natural selection begins acting on that new contribution. Prior to selection, the new contribution is a side effect. | **Capacity-Dependent.** A trait acquires a new function as soon as it begins making a causal contribution to the system's fitness/capacity, regardless of selection history. |
  | **Case for Crux 2:**<br> *The Proto-Feather*<br> Consider the first dinosaur with feathers that used them for warmth (selected), but which accidentally provided lift when jumping (not yet selected). | **Prediction:** The function is **thermoregulation only**. The lift is a beneficial side effect (exaptation) until a lineage is selected specifically for flight. | **Prediction:** The function includes **flight (or lift)**. If the feathers contribute to the organism's survival/capacity via lift, that is a function, regardless of whether selection has "locked it in." |
  | **Crux 3: Verbal vs. Substantive Dispute**<br>*(Are we defining different concepts?)* | **Substantive.** We are analyzing the single, correct concept of "biological function" used in evolutionary biology. The Causal-Role view conflates function with mere causal contribution. | **Substantive.** We are analyzing the concept of "function" used in physiology and systems biology. The Etiological view conflates the *origin* of a trait with its *current utility*. |
  | **Potential Resolution:**<br>*Conceptual Pluralism* | **Condition for Agreement:** We could agree if we admit there are two distinct concepts: "Proper Function" (Etiological) for evolutionary contexts and "System Function" (Causal-Role) for physiological contexts. | **Condition for Agreement:** We could agree if we admit that "function" is polysemous (has multiple meanings) and that each account captures a legitimate, context-dependent usage of the term. |

  ## Part III: Metaphilosophical Note on Verbal Disputes

  We acknowledge the possibility that a portion of our dispute is verbal rather than substantive. Specifically, we recognize that:

  1.  **Etiological Camp:** Tends to prioritize the evolutionary biologist's question: *"Why is this trait here?"*
  2.  **Causal-Role Camp:** Tends to prioritize the physiologist's question: *"What does this trait do for the system now?"*

  If "function" is a term that serves both inquiries, it may be that both accounts are correct within their respective domains. However, we remain divided on whether a **unified theory** is possible. The Etiological camp argues that without history, we cannot distinguish function from coincidental benefit (the "Swampman" objection). The Causal-Role camp argues that without current capacity, function becomes disconnected from the actual mechanics of the organism (the "Dead Organ" objection).

  ## Signatories

  _________________________ (Etiological Representative)

  _________________________ (Causal-Role Representative)

  ***

  ### Instructor's Note on Terminology (For Student Use)
  *In drafting this, I have used the standard philosophical labels "Selected Effects" (Etiological) and "Causal Roles." I must point out a common confusion in the prompt's description: In the philosophy of biology literature, **Larry Wright** (1973) is typically associated with the **Etiological** account ("X is there because it does Y"), while **Robert Cummins** (1975) is associated with the **Causal-Role** account. The prompt described the Causal-Role view as "Wright-style." In your seminar, you should verify with your professor whether they are using a non-standard convention or if this was a mix-up. The joint statement above uses the conceptual definitions (History vs. Current Capacity) which are accurate regardless of the names attached.*
