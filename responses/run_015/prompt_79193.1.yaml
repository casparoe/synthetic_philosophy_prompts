answer: |-
  The ideal of ascriptive universality exerts a powerful pull on epistemology. It suggests that for a judgment to count as knowledge, its warrant must be reproducible by any suitably situated inquirer, independent of the specific social or historical position from which it is uttered. However, the dominance objection rightly warns that this ideal often functions as a mask for power. It argues that what presents itself as a view from nowhere is merely the view from the center, demanding that reasons be phrased in the idiom of those who already hold epistemic authority. This requirement disqualifies situated knowers by reclassifying their grounds as bias or mere experience. You may be inclined to think this objection dismantles the ideal entirely. I argue instead that the dominance objection succeeds only against a needlessly strong reading of ascriptive universality. A reconstructed version survives by relocating universality from the content of the warrant to the form of the challenge.

  To see this, we must distinguish three concepts the objection tends to run together. Content universality holds that a claim is true or valid for everyone. Ascription universality holds that any inquirer could in principle recognize and reproduce the warrant. Entitlement universality holds that everyone is equally entitled to demand that the claim be made good to them on terms they can accept. The dominance objection treats ascription universality as though it were content universality. It assumes that requiring a warrant to be reproducible from elsewhere requires the warrant to be standpoint-independent. This is a mistake. The reconstructed ideal I propose abandons the demand for standpoint-independent warrants while retaining entitlement universality. On this reconstruction, a claim is ascriptively universal not because everyone could have discovered it, nor because its warrant is transparent from every standpoint, but because the claimant is bound to make the claim answerable to anyone who presses it, on terms the claimant must supply rather than presuppose. The universality lies in the standing obligation to keep the space of contestation open, not in the standpoint-independence of what is contested.

  Consider a concrete case. A community health worker in an industrial zone notices a cluster of respiratory illnesses among children living near a new factory. Official environmental monitors show emissions within legal limits. Under the strong reading of ascriptive universality, the worker's judgment lacks warrant because she cannot reproduce the data generated by the official monitors; her evidence is anecdotal and situated. She is silenced, her knowledge dismissed as local conviction. The dominance objection correctly identifies this as an exercise of power, but often stops at critique. The reconstructed ideal, however, offers a procedural path forward. The worker claims a hazard exists. The officials challenge her. Under the reconstruction, the officials cannot simply dismiss her for lacking standard data. Nor does the worker need to possess the technical capacity to run gas chromatographs. Instead, the universality requirement binds the claimant to supply terms for verification that the challenger can take up. The worker might propose a specific health survey correlated with wind patterns. The officials are then obligated to engage with these terms. They must either accept the test, propose a mutually agreeable alternative, or provide a public justification for why the proposed terms are epistemically unfit. The warrant remains situated—the knowledge arises from her specific observation—but the obligation to answer is universal.

  You might raise the strongest version of the dominance objection against this reconstruction: the charge that even the form of the challenge—the demand that a claimant supply terms anyone could take up—is itself a culturally specific genre of reason-giving. Is not this demand for accountability, this insistence on negotiable terms of verification, merely another imposition of Western, bureaucratic rationality? If so, the reconstruction has smuggled the original problem back in at a higher level.

  This objection conflates the style of reasoning with the structure of accountability. The reconstruction does not mandate a specific vocabulary or method, such as statistical significance or formal logic. It mandates only that if one claims authority over a shared world, one must offer a path for others to assess that claim. To refuse this is to claim privilege—to assert that one's word binds others without offering them a way to contest it. While the specific terms of engagement will vary across contexts, the structural obligation to provide them is a pragmatic necessity for non-coercive coordination. It is not a cultural preference but a condition of epistemic citizenship. If a knower refuses to make their claim answerable on any terms but their own, they are not protecting a unique epistemic tradition; they are asserting domination.

  Finally, we must acknowledge what this reconstruction costs. It cannot underwrite epistemic authority based on opaque expertise or sacred tradition that forbids questioning. There are domains where authority rests precisely on the inability of the layperson to verify the warrant—whether because the knowledge is esoteric or because the tradition holds that certain truths are not for public contestation. The reconstructed ideal demands that even these claims be open to some form of challenge, however minimal. If a priest claims divine will dictates a policy affecting the community, the ideal requires that he offer some terms by which the community can assess the claim's impact or coherence, rather than resting on fiat.

  Giving up this kind of authority is acceptable because epistemic authority in a shared social world cannot rest on unchallengeable fiat if it is to remain distinct from brute power. We lose the comfort of deference to the inscrutable, but we gain a framework where knowledge claims are linked to responsibility. The reconstructed ideal does not promise that everyone will agree, nor that all standpoints are equally accurate. It promises only that no standpoint is immune from the obligation to explain itself to those it affects. By shifting the locus of universality from the warrant's origin to the claimant's obligation, we preserve the normative force of knowledge without surrendering to the dominance of the center. The view from nowhere is indeed a fiction, but the obligation to answer to anyone is a requirement we can all share.
