prompt: |-
  I run an upper-level undergraduate seminar in moral philosophy—about 14 students, one 75-minute session. The announced topic is moral particularism versus generalism, but I want the session to target a specific, somewhat neglected pressure point within that debate: reason holism, or the claim that the very same non-moral feature can operate as a reason with opposite moral valence across contexts without being governed by any further general principle.

  Design a structured in-class deliberation—preferably with assigned roles and forced choices rather than open discussion—so that participants discover this holism for themselves before it is named. The rules should be arranged so that students apply identical descriptive predicates to two structurally parallel cases and reach opposite moral verdicts, then face a mechanism that makes them feel the cost of either retaining both verdicts or collapsing them into a hidden generalization.

  Specify: the physical setup and materials; the roles or constraints (for example, some participants must defend verdicts using only descriptive, non-moral vocabulary, while others must propose the relevant difference that saves consistency); a phased timeline; and an incentive scheme that rewards coherence but penalizes ad hoc exceptions—using points, voting tokens, or staged public commitments rather than real money.

  Then provide a debrief that maps specific moments in the activity onto parts of the particularist/generalist debate: where students implicitly appealed to ceteris paribus conditions, where they invented unstated background conditions to save a rule, and where they simply refused to generalize. Include an honest account of what will go wrong the first time—especially the tendency to smuggle in covert general principles—and how to handle it without undermining the exercise.

  Finally, be explicit about which feature of particularist reason holism the activity cannot reproduce—whether the phenomenology of direct moral perception, the metaphysical claim about the non-codifiability of reasons, or the rejection of moral explanation altogether—and note that this gap must be filled by the facilitator's follow-up discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate moral philosophy seminar (14 students, 75 mins).
      *   **Topic:** Moral Particularism vs. Generalism.
      *   **Specific Focus:** Reason Holism (the claim that a feature can be a reason for in one context and against in another without a governing principle).
      *   **Goal:** Design a structured in-class deliberation where students *discover* holism before it's named.
      *   **Mechanism:** Forced choices, assigned roles, identical descriptive predicates applied to parallel cases leading to opposite verdicts, costs for inconsistency or ad hoc generalizations.
      *   **Requirements:** Physical setup/materials, roles/constraints, phased timeline, incentive scheme, debrief (mapping activity to debate), honest account of potential failures (smuggling principles), and limitations of the activity (what it *can't* reproduce).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Generalism:* Moral principles exist. If $F$ is a reason for $A$ in case $X$, it must be a reason for $A$ in case $Y$ unless there's a relevant difference $G$ (defeater/enabler) that is itself principled.
      *   *Particularism (Holism):* $F$ can be a reason for $A$ in $X$ and a reason against $A$ in $Y$ without a principled difference. The context changes the valence directly.
      *   *The Trap:* Students naturally want to save generalism by finding *some* difference. The activity needs to make finding that difference costly or impossible within the constraints.

  3.  **Designing the Activity ("The Valence Shift"):**
      *   *Core Mechanism:* Two cases that look descriptively identical regarding a specific feature (e.g., "causing pain"), but intuitively demand opposite verdicts.
      *   *Constraint:* Students must use specific vocabulary. One group describes, one group judges, one group seeks principles.
      *   *Incentive:* Points for consistency, penalties for "ad hoc" moves (vetoed by the facilitator or opposing team).
      *   *Structure:*
          1.  Setup & Rules (10 mins)
          2.  Case 1 Deliberation (15 mins)
          3.  Case 2 Deliberation (15 mins)
          4.  The Clash/Reconciliation Phase (20 mins)
          5.  Debrief (15 mins)

  4.  **Developing the Cases:**
      *   Need a feature that is usually negative but can be positive, or vice versa.
      *   *Idea:* "Breaking a promise." Usually wrong. But what if breaking it saves a life? (Too standard, leads to "unless it saves a life" principle).
      *   *Idea:* "Causing pain." Usually wrong. But what if it's a dentist or a tattoo? (Too easy to generalize as "consent").
      *   *Better Idea (Dancy-style):* Focus on the *valence* of a feature like "pleasure" or "intent."
      *   *Selected Feature:* "Deriving satisfaction from another's misfortune." (Schadenfreude).
      *   *Case A:* A sadist watches a victim suffer. (Wrong).
      *   *Case B:* A justice advocate feels satisfaction seeing a tyrant punished. (Right/Good).
      *   *Descriptive Predicate:* "Agent experiences positive affect triggered by Subject's suffering."
      *   *Challenge:* Students must use *only* that predicate. They can't say "unjust suffering" vs. "just suffering" immediately.

      *Refining the Constraint:* To make it harder to generalize, I need to restrict the vocabulary available to the "Judges."
      *   *Role 1: Observers.* Describe the act using a fixed list of non-moral terms.
      *   *Role 2: Judges.* Issue verdicts (Permissible/Impermissible).
      *   *Role 3: Auditors.* Check for consistency and propose principles.

      *Wait, the prompt asks for "forced choices" and "incentive scheme."*
      Let's gamify it.
      *   Team A (Prosecution): Must argue the act is Wrong.
      *   Team B (Defense): Must argue the act is Permissible.
      *   Actually, better: Two juries. Same descriptive facts provided. Different contexts hidden in the "background" but the *feature* remains the same.
      *   *Revised Plan:* The "Feature Lock" Game.
      *   Feature: "Lying."
      *   Case 1: Lying to protect a victim. (Intuitively Permissible).
      *   Case 2: Lying to manipulate a market. (Intuitively Impermissible).
      *   *Constraint:* The "Principle Drafters" must write a rule that covers Case 1 without accidentally permitting Case 2, using *only* the descriptive vocabulary provided.
      *   *Twist:* The vocabulary provided is identical for both. The context is provided narratively, but the *reason* cited must be the feature itself.

      *Let's try a different angle to hit "Reason Holism" specifically.*
      Holism says the *same feature* changes valence.
      Activity: "The Reason Bank."
      Students are given cards with "Reasons" (e.g., "It causes pain," "It breaks a promise," "It brings pleasure").
      They are given Case Cards.
      They must place the Reason Card on the Case Card as either "Support" or "Oppose."
      *   Case 1: Punching a stranger. (Pain = Oppose).
      *   Case 2: Punching an attacker in self-defense. (Pain = ?).
      *   If they say "Pain = Oppose" in both, they need a defeater.
      *   If they say "Pain = Support" in Case 2 (because it stops attack), they admit holism? No, that's complex.

      *Let's go with the "Identical Predicate, Opposite Verdict" constraint.*
      *   **Setup:** 14 Students.
      *   **Groups:** 3 Groups of 4 (Judges), 2 Facilitators (Rotating students).
      *   **Materials:** Case Files, Token Buckets, "Principle Boards."
      *   **The Hook:** The predicate is "The agent intentionally causes the death of a human being."
      *   **Case A:** Euthanasia (Mercy killing).
      *   **Case B:** Murder for inheritance.
      *   **Task:** Group 1 judges A. Group 2 judges B. Group 3 are Auditors.
      *   **Constraint:** Groups 1 & 2 must justify their verdict citing the *predicate* as the primary reason.
      *   **Wait, that's impossible.** No one cites "causing death" as a reason *for* euthanasia.
      *   **Correction:** The task is to determine if the predicate counts *in favor* or *against*.
      *   **Holism Claim:** In Case A, "causing death" might be neutral or even part of the good (relief). In Case B, it's bad.
      *   **Better Predicate:** "The act involves deception."
      *   Case A: Surprise party. (Deception = Good/Neutral).
      *   Case B: Fraud. (Deception = Bad).
      *   **Constraint:** Judges must assign a "Valence Token" (+ or -) to the feature "Deception" in their specific case.
      *   **Auditors:** Must write a General Principle that explains why Deception got + in A and - in B.
      *   **Penalty:** If the Principle uses moral terms (e.g., "unless it's malicious"), they lose points. They must use descriptive terms only.

  5.  **Refining the Incentive Scheme:**
      *   Currency: "Coherence Chips."
      *   Start with 10 each.
      *   Gain chips for consistent verdicts.
      *   Lose chips for using forbidden moral vocabulary in principles.
      *   Lose chips for admitting "It just depends" without a principle (if playing Generalist) OR Gain chips for admitting it (if playing Particularist).
      *   *Wait, I don't want to bias them toward one side yet.* I want them to feel the tension.
      *   *Revised Incentive:* The "Legislature." They are drafting a Moral Code.
      *   Goal: Maximize coverage of cases with minimum rules.
      *   If they need a new rule for every case, they lose efficiency points.
      *   If they apply one rule and get counter-intuitive verdicts, they lose accuracy points.

  6.  **Developing the Timeline:**
      *   0-10: Setup & Roles.
      *   10-25: Case 1 (Surprise Party). Assign Valence to "Deception."
      *   25-40: Case 2 (Fraud). Assign Valence to "Deception."
      *   40-60: The Reconciliation (Auditors try to bridge).
      *   60-75: Debrief.

  7.  **Addressing the "Smuggling Principles" Failure Mode:**
      *   Students will say "Deception is bad *unless* it benefits the recipient."
      *   "Benefits" is moral/descriptive blur.
      *   Facilitator must challenge: "Define 'benefit' without using 'good' or 'happy'."
      *   This exposes the difficulty of codification.

  8.  **Addressing the Limitations:**
      *   Activity is linguistic/conceptual.
      *   Cannot reproduce the *phenomenology* of seeing a reason.
      *   Cannot prove the *metaphysics* (whether principles exist in reality).
      *   Must be filled by lecture on Dancy/McNaughton.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Roles:* Needs to be tighter. Let's make it a "Court of Appeal."
      *   *Cases:* Need to be structurally parallel.
      *   *Predicate:* "Copying another's work without attribution." (Plagiarism vs. Homage/Parody).
      *   *Predicate:* "Taking property without consent." (Theft vs. Borrowing in emergency).
      *   *Let's stick with "Deception" (Lying).* It's the classic example.
      *   *Case 1:* Lying to a murderer at the door (Kant's example).
      *   *Case 2:* Lying to get out of a dinner party.
      *   *Constraint:* Both are "Asserting what one believes to be false with intent to induce belief."
      *   *Task:* Assign moral weight to that description.

      *Wait, the prompt asks for "Reason Holism."*
      This means the *same feature* is a reason *for* in one and *against* in another.
      In the Lying case, Lying is usually a reason *against*. In the Surprise Party, is it a reason *for*? Or just neutralized?
      Particularism says it can be a reason *for*.
      Example: "The fact that it would amuse him is a reason to do it." Usually yes. But if he laughs at pain, it's a reason against.
      *Let's use "Amusement/Pleasure".*
      Case 1: Telling a joke. (Pleasure = Reason For).
      Case 2: Laughing at a funeral. (Pleasure = Reason Against).
      *Predicate:* "The act produces amusement for the agent."
      *Verdict:* Case 1 (Good), Case 2 (Bad).
      *Challenge:* How to generalize without saying "unless it's inappropriate"?

      *Okay, let's finalize the plan around "Producing Amusement."*

      *Setup:*
      *   14 Students.
      *   2 Teams of 5 (Case A & Case B).
      *   4 Arbiters (The Generalists).
      *   Facilitator (Instructor).
      *   Materials: Case Cards, Valence Tokens (Green/Red), Principle Whiteboards.

      *Incentive:*
      *   Teams get points for intuitive verdicts.
      *   Arbiters get points for creating a single principle that covers both.
      *   Penalty: If Arbiters use moral terms (right, wrong, appropriate) in the principle, they lose points.

      *Debrief:*
      *   Map the Arbiters' struggle to Generalism (Principlism).
      *   Map the Teams' frustration to Particularism (Holism).
      *   Discuss the "Smuggling" (using "context" as a hidden principle).

      *Limitations:*
      *   Activity is about *justification*, not *perception*.
      *   Doesn't solve the metaphysical status of reasons.

  10. **Review against constraints:**
      *   Structured deliberation? Yes.
      *   Assigned roles? Yes.
      *   Forced choices? Yes (Valence tokens).
      *   Incentive scheme? Yes (Points for coherence vs. intuition).
      *   Debrief mapping? Yes.
      *   Honest account of failure? Yes.
      *   Limitations? Yes.

  11. **Final Polish:** Ensure the tone is academic yet practical. Make sure the "Reason Holism" aspect is central (the *valence* switching). Ensure the "Descriptive Predicate" is rigid.

      *Self-Correction on "Reason Holism":* Make sure the activity forces them to treat the feature as a *reason*, not just a property.
      *Instruction:* "You must place the Feature Card in the 'Pro' column or the 'Con' column."
      *Feature:* "The agent derives amusement."
      *Case 1:* Comedy Club. (Pro).
      *Case 2:* Mocking a stutterer. (Con).
      *Arbiters:* Write the rule. "Amusement is Pro UNLESS..."
      *Constraint:* The "UNLESS" clause cannot contain moral words.
      *Result:* They will struggle to describe "mocking" without using "cruel" or "harmful" (which invites further exceptions).

      *Wait, one more check:* The prompt asks for "opposite moral verdicts" then "cost of retaining both or collapsing."
      My plan does this. Teams want opposite verdicts. Arbiters try to collapse. If they can't, they feel the cost (lost points/inconsistency).

      *Let's write it.*
answer: |-
  # Seminar Plan: The Valence Shift
  **Topic:** Reason Holism within the Particularism/Generalism Debate
  **Time:** 75 Minutes
  **Students:** 14 (Upper-level Undergraduate)

  ## I. Physical Setup and Materials

  **Room Arrangement:**
  *   Three distinct tables arranged in a triangle.
  *   **Table A (Case Team 1):** 5 Students.
  *   **Table B (Case Team 2):** 5 Students.
  *   **Table C (The Legislators):** 4 Students.
  *   **Instructor:** Roaming facilitator/timekeeper.

  **Materials:**
  *   **Case Files:** Two envelopes (one for Table A, one for Table B) containing identical *Descriptive Predicate Cards* but different *Context Narratives*.
  *   **Valence Tokens:** 20 Green chips (Reason For) and 20 Red chips (Reason Against) per Case Team.
  *   **Principle Whiteboards:** 2 small whiteboards for Table C.
  *   **Currency:** "Coherence Credits" (printed slips or poker chips).
  *   **Vocabulary Ban List:** A visible handout listing forbidden terms for Table C (e.g., *wrong, right, appropriate, harmful, benefit, cruel, kind*).

  ## II. Roles and Constraints

  1.  **Case Teams (Tables A & B):**
      *   **Task:** Read the Context Narrative. You are given one mandatory **Descriptive Predicate** (e.g., *"The agent derives sensory amusement from the act"*). You must assign a moral valence to this predicate *in this specific context* by placing a Green (For) or Red (Against) token on the table.
      *   **Constraint:** You must reach a unanimous verdict on the token color. You may discuss the narrative, but your justification for the token must cite the Predicate.
      *   **Goal:** Maximize **Intuition Points** (awarded if your verdict matches the pre-determined "philosophical consensus" for that case).

  2.  **The Legislators (Table C):**
      *   **Task:** Observe the verdicts of Tables A and B. You must draft a **General Principle** that explains why the *same Predicate* received different tokens.
      *   **Constraint:** The principle must be universal (apply to all agents) and **Descriptively Pure** (cannot use any terms on the Vocabulary Ban List).
      *   **Goal:** Maximize **Coverage Points** (awarded if one principle successfully explains both verdicts without contradiction).

  3.  **The Facilitator (Instructor):**
      *   Enforces the Vocabulary Ban.
      *   Acts as the "Bank," distributing and deducting Coherence Credits.
      *   Introduces the "Holism Reveal" in the debrief.

  ## III. Phased Timeline

  ### Phase 1: Setup and Distribution (10 Minutes)
  *   **0-5 mins:** Explain the goal: "We are testing whether moral reasons behave like scientific laws."
  *   **5-10 mins:** Distribute materials.
      *   **Predicate (Both Tables):** *"The agent experiences a spike in dopamine associated with the observation of another's physical state."* (Euphemism for *taking pleasure in someone's condition*).
      *   **Narrative A (Table A):** A comedian performing a slapstick routine for a willing audience. The audience laughs. The comedian feels amusement at their own success/the audience's reaction. (Consensus: Permissible/Good).
      *   **Narrative B (Table B):** A bully trips a classmate in the hallway. The classmate falls and cries. The bully laughs. (Consensus: Impermissible/Wrong).
      *   *Note:* The Predicate is descriptively identical in both (dopamine spike/amusement at another's state), but the context shifts the valence.

  ### Phase 2: Case Deliberation (15 Minutes)
  *   Tables A and B deliberate separately.
  *   They must agree on a Token Color (Green or Red) for the Predicate.
  *   **Incentive:** If Table A chooses Green and Table B chooses Red, they each earn 10 Coherence Credits (Intuition Points). If they match (both Green or both Red), they earn 0 (Counter-intuitive verdict).
  *   *Expected Outcome:* Table A places Green (Amusement is a reason *for* comedy). Table B places Red (Amusement is a reason *against* bullying).
  *   *Philosophical Trap:* They have now affirmed that the *same descriptive feature* functions as a reason *for* in one case and *against* in the other.

  ### Phase 3: The Reconciliation (25 Minutes)
  *   Tables A and B present their tokens to Table C (The Legislators).
  *   **Task for Table C:** Draft a single principle of the form: *"Feature F is a reason for X, UNLESS..."*
  *   **Constraint Enforcement:** The Instructor acts as a strict editor.
      *   If Legislators write: *"Unless it causes harm,"* Instructor asks: "Define 'harm' without using 'wrong' or 'bad'." (Students usually struggle to define harm non-normatively).
      *   If Legislators write: *"Unless it is non-consensual,"* Instructor asks: "Is the comedy audience's consent descriptive or moral? Define 'consent' without implying 'permission'."
  *   **Incentive:**
      *   Table C earns 20 Credits if they produce one principle that satisfies both Case Teams.
      *   Table C loses 5 Credits every time they use a Banned Word.
      *   Case Teams can **Veto** a principle if it would force them to change their Token Color in their own case. (e.g., If the principle implies comedy is wrong, Table A vetoes).
  *   *Expected Outcome:* Table C will struggle. They will try to add "defeaters" (contextual conditions), but every defeater will either be too broad (ruling out comedy) or too moralized (using banned words like "malicious").

  ### Phase 4: The Collapse (10 Minutes)
  *   **Forced Choice:** The Instructor announces a "Budget Cut."
      *   **Option 1:** Table C abandons the General Principle. They admit the Predicate has no fixed valence. (Table C loses all Coverage Points; Case Teams keep Intuition Points).
      *   **Option 2:** Table C forces a Generalization. They must write a rule that covers both cases using *only* physical/descriptive terms. (If they succeed, everyone gets bonus points. If they fail after 3 attempts, everyone loses 10 points).
  *   **Action:** Most groups will fail Option 2 and reluctantly choose Option 1.
  *   **Result:** The class has structurally enacted the failure of Generalism to capture Reason Holism without smuggling in moral premises.

  ### Phase 5: Debrief and Mapping (15 Minutes)
  *   **Reveal:** Name the phenomenon. "You just discovered **Reason Holism**."
  *   **Mapping the Activity:**
      1.  **The Predicate:** Represents the *non-moral feature* (e.g., "causing pain," "lying," "amusement").
      2.  **The Tokens:** Represent the *valence of the reason* (contributing positively or negatively to the moral status).
      3.  **The Legislators' Struggle:** Represents the *Generalist/Principlist* attempt to codify defeaters and enablers (e.g., *ceteris paribus* clauses).
      4.  **The Vocabulary Ban:** Represents the demand for *non-moral natural properties*. When students tried to say "unless it's cruel," they were smuggling a moral concept to save the principle.
      5.  **The Veto:** Represents the *particularist intuition* that no principle should override the specific moral verdict of the case.
  *   **Handling Failure (Smuggling Principles):**
      *   *Likely Error:* Students will say, "The rule is: Amusement is good unless it violates autonomy."
      *   *Correction:* Ask, "Is 'autonomy' a descriptive property like mass or velocity, or is it a moral status?" If it's a moral status, the principle is circular (Moral Feature + Moral Exception = Moral Principle).
      *   *Pedagogical Move:* Do not shut this down aggressively. Write it on the board. Label it "The Hidden Morality." Show how Generalism often hides moral premises inside descriptive exceptions.
  *   **Limitations (What the Activity Misses):**
      *   **Phenomenology:** The activity is linguistic and bureaucratic. It does not reproduce the *experience* of seeing a reason. Particularists claim we *perceive* the valence directly (moral perception); this activity makes it look like a calculation.
      *   **Metaphysics:** The activity shows it is *hard* to generalize, not that it is *impossible*. A sophisticated Generalist (e.g., a sophisticated Kantian) might argue we just haven't found the right principle yet (The "Esoteric Principle" defense).
      *   **Explanation:** Particularism often rejects the idea that moral explanation requires subsumption under a law. This activity assumes explanation *is* the goal (by tasking Table C). You must clarify in lecture that Particularists like Jonathan Dancy argue moral explanation works via *similarity to paradigm cases*, not via principles.

  ## IV. Incentive Scheme Summary

  | Action | Reward/Penalty | Rationale |
  | :--- | :--- | :--- |
  | **Case Team Intuitive Verdict** | +10 Credits | Rewards moral sensitivity (particularist intuition). |
  | **Legislators Single Principle** | +20 Credits | Rewards generalist coherence. |
  | **Use of Banned Moral Terms** | -5 Credits per word | Penalizes covert generalism/circularity. |
  | **Case Team Veto** | Blocks Principle | Prevents generalism from overriding intuition. |
  | **Final "Budget Cut" Failure** | -10 Credits (All) | Simulates the theoretical cost of the impasse. |

  ## V. Instructor's Cheat Sheet: The "Holism" Reveal

  **Key Definition to Provide:**
  > **Reason Holism:** A feature that is a reason in favor of an action in one case may be a reason against it in another, or no reason at all, without there being any change in its descriptive nature and without any general principle explaining the shift.

  **Discussion Questions for Post-Activity:**
  1.  "Table C, when you couldn't define 'harm' without saying 'bad,' what does that suggest about the relationship between descriptive facts and moral reasons?"
  2.  "If we accept Option 1 (No Principle), do we lose the ability to criticize the Bully? Or does the similarity to the Bully case suffice?"
  3.  "Is the 'Comedy' case actually the same predicate? Or did we miss a descriptive difference?" (This invites the Generalist counter-argument, which you can then field using Dancy's response about *enablers* vs. *reasons*).

  ## VI. Anticipated Failure Modes & Mitigation

  1.  **The "Context" Dodge:** Students will argue the cases aren't parallel because the *context* is different.
      *   *Response:* "Agreed. Holism admits contexts differ. The claim is that the *context* changes the valence of the *feature* without a *rule* governing how context does that. Can you write the rule for how context changes it?"
  2.  **The "Scientific" Defense:** Students will try to define "harm" biologically (e.g., "tissue damage").
      *   *Response:* "Does comedy cause no biological stress? Does bullying always cause tissue damage? If not, the descriptive definition fails to track the moral verdict."
  3.  **Student Frustration:** The Vocabulary Ban can feel like a "gotcha."
      *   *Mitigation:* Acknowledge it openly. "I am restricting your vocabulary to simulate the Generalist's constraint: principles must be grounded in the natural world, not in moral intuitions."

  ## VII. What This Activity Cannot Do

  Be explicit with students that this simulation has gaps:
  1.  **It is not Moral Perception:** The activity treats reasons as tokens to be placed. Particularism claims we *see* the reason in the situation, like we see the danger in a snarling dog. This activity makes it look like a legislative contract.
  2.  **It is not Metaphysical Proof:** Successfully stumping the Legislators doesn't prove principles *don't exist*, only that *these* students couldn't find them. You must follow up with Dancy's argument that the search for principles is misguided, not just difficult.
  3.  **It Ignores Moral Explanation:** The activity assumes explaining a verdict requires a principle. Particularists argue we explain verdicts by citing the *relevant features* directly, not by citing a law that connects the feature to the verdict.

  **Follow-up Assignment:**
  Ask students to write a 1-page reflection: "Identify a moment in the activity where you felt a principle was necessary but unavailable. Was this a failure of your imagination, or evidence of Holism?"
