  Here is the argument drafted for your seminar prep. I've focused on sharpening the distinction between a "gap" in understanding (the standard Fricker view) and an active "overwriting" of understanding (the preemption view), specifically targeting the internalization of that overwriting.

  ### Hermeneutical Injustice as Conceptual Preemption

  The standard account of hermeneutical injustice, following Fricker, posits a *lacuna*: a gap in shared conceptual resources that leaves marginalized groups unable to make their experiences intelligible to others. I argue this is insufficient. The problem is not usually that the concepts *do not exist*, but that institutional vocabularies are locked in so tightly that they actively preempt alternative descriptions. This is **conceptual preemption**. It is not a silence; it is a noise-canceling mechanism. Dominant institutions (medical, legal, state) possess the hermeneutical power to define what counts as "data" versus "noise." When a marginalized group offers a descriptive term rooted in their lived experience, the institutional framework does not merely fail to understand it; it categorizes it as error, anomaly, or subjective distortion relative to the authorized vocabulary.

  The mechanism of preemption operates through **operationalization**. Institutional vocabularies are tied to metrics, protocols, and legal statutes that require standardization. To enter the institutional sphere, experience must be translated into these standardized units. If the translation fails—because the experience lacks a biomarker, a property line, or a diagnostic code—the institution does not admit ignorance. It treats the untranslatable residue as non-existent. The harm is not just communicative failure between groups; it is a specific second-order harm where the victim internalizes the institutional vocabulary as the only valid metric of reality. Consequently, their own first-order testimony begins to sound incoherent *to themselves*. They do not just feel unheard; they feel unintelligible.

  **Medical Case: ME/CFS and Cardiopulmonary Exercise Testing (CPET)**
  Consider patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS). Patients report a specific phenomenology: Post-Exertional Malaise (PEM), a pathological crash following minor exertion. However, clinical trials and disability assessments often rely on Cardiopulmonary Exercise Testing (CPET) as the gold standard "biomarker" for capacity. CPET measures oxygen uptake and heart rate during exertion. A patient might complete the test with "normal" oxygen metrics, even while experiencing severe delayed collapse hours later.
  Here, the biomarker language (oxygen uptake) preempts the patient-reported outcome (crash). Because the institutional vocabulary defines "capacity" as "peak oxygen uptake," the patient's description of "crash" is treated as subjective noise or deconditioning. The second-order harm emerges when the patient looks at their own "normal" test results and begins to doubt their own bodily sensations. They think, "The machine says I am fit; therefore, my feeling of collapse must be psychological." The institutional vocabulary colonizes their self-interpretation, making their own pain sound like a lie even in their own head.

  **Governance Case: Indigenous Cultural Burning vs. Wildfire Risk**
  In land management, Indigenous peoples often describe controlled burning as "cleaning the country" or "healing the land." This is a relational vocabulary where fire is a tool of care and reciprocity. State governance frameworks, however, operate within a vocabulary of "risk," "liability," and "suppression." Fire is categorized legally as a hazard to be mitigated. When Indigenous practitioners propose cultural burns, the state vocabulary preempts the Indigenous description. The burn is not heard as "care"; it is heard as "arson risk" or "environmental damage."
  The second-order harm occurs when Indigenous land managers begin to navigate their own practices through the state's liability framework. They start to view their own traditional knowledge as "risky" or "illegal" rather than "necessary." The preemption forces them to justify their care in the language of danger, creating an internal incoherence where their own epistemic relationship to the land feels fractured. They know the land needs fire, but the only available vocabulary tells them fire is destruction.

  **Conclusion**
  Conceptual preemption is more insidious than a hermeneutical gap. A gap implies we just need to find the right words. Preemption implies the wrong words are actively blocking the right ones. The specific harm is the colonization of the victim's internal monologue. When the institutional vocabulary is the only one granted ontological weight, the victim's own experience becomes unintelligible to themselves, producing a deep epistemic alienation that mere communication cannot fix.

