answer: |-
  Sequence

  1.  **Rules and Axiom (5 mins):** Write the axiom MI and the four rules on the board. **Constraint:** Do not mention MU yet. **Dependency:** None; this establishes the formal system.
  2.  **Derivation Sprint (15 mins):** **Students:** Working in pairs, derive as many distinct theorems as possible. **Goal:** Implicitly encourage trying to shorten strings. **Dependency:** Requires rules to be fixed. This generates data and creates investment in the system.
  3.  **Pattern Hunt (10 mins):** **Students:** Count the number of 'I's in every string they generated. Report to the board. **Instructor:** Circle the counts. Ask: "What do you notice?" **Dependency:** Requires generated strings. This shifts focus from string manipulation to property tracking.
  4.  **Invariant Proof (20 mins):** **Instructor:** Formalize the observation. Show how each rule transforms the count of 'I's. Prove that starting at 1, you cannot reach 0. **Dependency:** Requires the pattern data. This converts empirical observation into rigorous justification.
  5.  **MIU* Contrast (10 mins):** **Instructor:** Erase Rule 3, write II → U. **Students:** Re-evaluate the count argument. Can MU be derived now? **Dependency:** Requires understanding of the Invariant proof. This tests whether the method is robust or accidental.
  6.  **Meta-Discussion (15 mins):** **Instructor:** Define "jumping out." We used arithmetic to prove facts about strings. **Students:** Discuss whether arithmetic is also a system. **Dependency:** Requires the completed proof. This solidifies the philosophical lesson without invoking Gödel.

  The invariant

  Do not introduce this as number theory; introduce it as rule mechanics. Write the count of 'I's next to every derived string on the board. Ask students to describe the *effect* of each rule on that count. Rule 1 adds zero 'I's; Rule 4 removes zero 'I's. Rule 3 removes three 'I's. Rule 2 doubles the count. State clearly: "We start with one 'I'. Zero is a multiple of three; one is not." Walk through the operations: doubling a non-multiple of three never yields a multiple of three; subtracting three from a non-multiple leaves a non-multiple. The conclusion feels like a physical constraint of the rules, not a theorem of arithmetic. You are not proving a fact about numbers; you are proving a fact about what these specific rules *do* to numbers.

  Misconceptions

  (a) **Truth vs. Derivability:** Head this off in Step 1. Explicitly state: "MU is not false; it is unreachable. These strings are not sentences; they are positions." If you wait until the end, the "unprovable truth" framing will stick.
  (b) **Escape vs. Meta-System:** Address this in Step 6. When defining "jumping out," clarify: "We jumped out of MIU into arithmetic. But arithmetic is also a system. We could jump out of that." This prevents the mystification of the meta-level.
  (c) **Zero is not a Multiple:** Address this in Step 4. When defining the target state (MU has zero 'I's), explicitly assert: "Zero is a multiple of three. That is why we want it. That is why we can't get it."
  (d) **The Trick vs. The Method:** Address this in Step 5. If students think the invariant is a puzzle trick, MIU* shows it is a method sensitive to rule changes. If the method fails in MIU*, it confirms the method analyzes the rules, not the concept of "puzzle."

  Check

  Place MIU* immediately after the Invariant Proof (Step 5). Do not save it for the closing check. Write the modified rule on the board. Ask: "Does the counting argument still hold?" The students should see that Rule 3 now subtracts two 'I's. Ask: "Can we reach zero now?" They should see that 1 → 2 → 0 is possible. This confirms that the invariant was a discovery about the *specific* rules of MIU, not a universal law of string puzzles. It validates the method by showing where it breaks.

  What to withhold

  Drop the gesture at incompleteness entirely. Your suspicion is correct: it manufactures error (a). First-year students cannot distinguish "unprovable in system S" from "true but unprovable." Invoking Gödel suggests MU has a truth value, which undermines the syntactic lesson. Also, refuse to explain *why* the meta-system is formalizable. Acknowledge it ("arithmetic can be formalized too") but do not demonstrate it. Explaining how to formalize arithmetic within logic exceeds the time budget and distracts from the core lesson: that reasoning *about* a system differs from reasoning *within* it. Keep the focus on the shift in perspective, not the hierarchy of systems.
