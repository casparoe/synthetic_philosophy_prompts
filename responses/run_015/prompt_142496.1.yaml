      *Another nuance:* "Return only their rank within their own group, and the underwriter takes the top slice of each group's list." This is post-processing. If you take the top 10% of Group A and top 10% of Group B, you have equal selection rates. If the true base rates differ, the PPV (approval quality) will differ. The engineer claims PPV matches. This is only possible if the holdout was reweighted to make base rates equal.

      *Conclusion:* The engineer is measuring performance on a fantasy dataset.

