  **The Constraint:** Human auditory discrimination for steady tones has a measurable Just Noticeable Difference (JND). For this frequency, let's stipulate the JND is exactly **1 dB**. Two sound levels are *indiscriminable* to Elena if they differ by less than 1 dB.

