  For Elena to know $p$ based on her auditory experience, $p$ must be true not only in the actual case but in all cases indiscriminable from the actual case. (This is the Safety Condition applied to indiscriminability).
  *   **Knowledge Condition:** $S$ knows $p$ at level $L$ only if $p$ is true at all levels $L'$ where $|L - L'| < 1$.

  **The Scenario:**
  The actual sound level in the booth is **83.5 dB**.
  The threshold for $p$ ("above 80 dB") is **80.0 dB**.
  $p$ is false at 80.0 dB and below.

