answer: |-
  **Project Proposal: Complicity and Identification**
  **A Framework for Council Decision-Making on Controversial Street Names**

  **Submitted by:** [Your Town] Heritage Working Group
  **Funding:** £6,000 Grant (6 Months Part-Time)
  **Date:** October 2023

  ### 1. The Research Question
  Current national debates regarding controversial heritage focus almost exclusively on statues. This project asks a sharper, more administrative question: **At what point does a street name cease to function as a neutral identifier and become a compulsory act of commemoration, and what is the fair process for managing that transition?**

  Unlike a statue, which a citizen can choose to ignore or walk past, a street name is administrative infrastructure. Residents must write it on forms, speak it to emergency services, and share it with deliveries. The core tension is not merely about 'erasing history', but about **compelled speech** versus **administrative burden**. This project seeks to define a threshold for intervention that respects both ethical concerns and the practical reality for residents.

  ### 2. Why the 'Statue Model' Fails Here
  The standard solutions applied to statues do not translate to street nomenclature. This project proceeds on the basis that three common arguments require re-evaluation for streets:

  *   **Contextualisation:** Placing a plaque at the base of a statue explains the controversy. Placing a plaque at the start of a road does not change the address on a resident's bank statement or driving licence. You cannot 'contextualise' a postcode.
  *   **Relocation:** Moving a statue to a museum removes it from public space while preserving the object. A street name cannot be moved; it can only be deleted or changed. The 'object' is the usage itself.
  *   **Passive vs. Active:** A statue is a passive monument. A street name is an active tool. When a resident gives their address, they are inadvertently endorsing the namesake. However, if the namesake is unknown to 90% of the street, is the endorsement real, or is the name now just a geometric label?

  We need to determine if the 'invisibility' of the history makes the offence worse (insidious) or better (harmless), and who bears the cost of fixing it.

  ### 3. Work Plan (6 Months Part-Time)
  We have no access to academic libraries and will rely on public records, local engagement, and council data. The team of three will divide labour between research, engagement, and drafting.

  *   **Month 1: Scoping and Precedent.**
      *   Identify all local streets with potentially controversial namesakes.
      *   Collate public data on recent street renaming cases in other UK councils (e.g., London, Bristol, Glasgow) to understand legal and logistical hurdles.
      *   Review current council minutes to understand the existing protocol for naming or renaming streets.
  *   **Month 2: Resident Burden Audit.**
      *   Draft and distribute a survey to residents on identified streets.
      *   Focus: Are they aware of the namesake? Do they feel uncomfortable using the address? What concerns do they have about the cost/hassle of changing it (bank details, utilities, ID)?
      *   *Goal:* Quantify the 'administrative burden' vs. the 'ethical discomfort'.
  *   **Month 3: Council and Stakeholder Interviews.**
      *   Informal meetings with council officers (Legal, Democratic Services, Housing).
      *   Establish the hard constraints: Royal Mail guidelines, Land Registry fees, emergency service databases.
      *   Meet with local community groups to gauge sentiment beyond the immediate street residents.
  *   **Month 4: Drafting the Framework.**
      *   Develop a 'Decision Matrix' for councillors.
      *   Create criteria for triggering a review (e.g., formal complaint threshold, historical evidence standard).
      *   Propose a funding model for renaming costs (Council vs. Resident vs. Grant).
  *   **Month 5: Consultation on Draft.**
      *   Present the draft framework to a focus group including residents from affected streets and council officers.
      *   Refine based on feedback. Ensure the language is non-confrontational and procedurally sound.
  *   **Month 6: Final Report and Guidance.**
      *   Finalise the document.
      *   Prepare a summary presentation for the relevant Council Committee.
      *   Submit final grant reporting.

  ### 4. The Deliverable
  The output will not be a recommendation to rename specific streets. That is a political decision. Instead, the deliverable will be a **Street Naming Review Toolkit**.

  This will include:
  1.  **A Flowchart for Complaints:** A clear path for how a concern is raised, investigated, and decided.
  2.  **A Cost-Benefit Template:** A standardised way to calculate the financial impact on residents versus the reputational/ethical impact on the town.
  3.  **A 'Middle Ground' Menu:** Options short of renaming, such as dual-naming, historical interpretation boards at street corners, or community art projects that recontextualise the space without changing the address.
  4.  **Implementation Guide:** A step-by-step checklist for council officers if a renaming is approved (notifying Royal Mail, Land Registry, schools, etc.).

  This ensures the Council can make a defensible, consistent decision by next year, rather than reacting ad-hoc to media pressure.

  ### 5. Risk Assessment and Limitations
  We are mindful that this project could fail or stall in the following ways:

  *   **Scope Creep:** We may identify too many streets. We will limit our deep-dive case studies to a maximum of three specific streets to keep the workload manageable.
  *   **Community Hostility:** Street naming is emotionally charged. Resident surveys could trigger local disputes or media attention that distracts from the policy work. We will maintain strict neutrality and refer media queries to the Council.
  *   **Council Inertia:** The Council may accept the report but take no action. To mitigate this, we will involve a sympathetic councillor as a stakeholder early in Month 3 to champion the findings.
  *   **Time Constraints:** As part-time volunteers, illness or work commitments could delay us. We will build a two-week buffer into Months 4 and 5.
  *   **Legal Complexity:** We are not lawyers. If the Royal Mail or Land Registry regulations prove more complex than anticipated, we will pivot to recommending the Council seek specific legal counsel, rather than attempting to interpret law ourselves.

  ### 6. Conclusion
  This project moves the debate from 'topple or keep' to 'how do we govern shared space fairly?'. By treating street names as administrative obligations rather than just monuments, we can produce guidance that protects residents from undue burden while allowing the town to address its historical legacy with integrity.
