          *   *Punishment:* Justified by its consequences (deterrence, norm reinforcement), but *retributive emotions* are part of the "user interface" of morality. They aren't metaphysically deep, but they are functionally real.
          *   *Reactive Attitudes:* Strawsonian. We *need* to feel resentment and gratitude to maintain social bonds.
          *   *View on Retribution:* Often sees retributive instincts as evolved heuristics that generally track utility, even if the metaphysics are fuzzy.

      *   **Gregg Caruso (Hard Incompatibilism/Public Health Quarantine Model):**
          *   *Core:* Determinism (or luck) undermines basic desert. No one *deserves* suffering.
          *   *Punishment:* Retribution is morally illegitimate. Only incapacitation/rehabilitation (like quarantining a disease carrier) is permissible.
          *   *View on Retributive Emotions:* These are based on a cognitive error (the belief in basic desert). They are akin to superstition. They should be educated away, though he acknowledges the psychological difficulty.
