prompt: |-
  A guy I work with — call him Dan — does a kind of in-house should-we-enlarge-the-decision-body consulting for our clients, and I've been trying to reconstruct the rule he's actually running. His calls so far:

  - 100 raters, each right 51% of the time, independent, two options, plain majority: yes, enlarging helps a lot.
  - Same but each rater is at 49%: no — he said adding more just makes the majority more confidently wrong.
  - 500 people who all watched the same misleading explainer before deciding, each about 60% accurate otherwise: no. His line was that the shared bad input is a common cause and the crowd can't correct for it.
  - 12 independent raters at 65%: yes.
  - Sequential voice votes where each person hears the earlier ones and updates honestly rather than strategically: no. He called it a cascade and said the later votes add almost nothing.
  - 200 independent raters, half at 70% and half at 47%: yes, though he grumbled about it and said equal weighting was leaving something on the table.
  - Tacking one extra 50%-accurate rater onto an existing panel: no, basically a no-op that can hurt through ties.

  Now the case on his desk. A client runs a 7-person case-review panel and wants to go to 31. All 31 would come out of the same training pipeline and use the same scoring protocol. On held-out data each reader is about 67% accurate, and the correlation between whether two randomly picked readers get the same case right is about 0.25. That's all anyone knows: nobody has checked whether the shared component of their errors points in some particular direction or is mostly just case difficulty (easy cases everyone nails, hard cases everyone struggles with), and the client has never ran the panel at more than 7.

  Does Dan say enlarging helps? I care less about the yes or no than about the different rules that fit his track record about equally well and what each of them predicts here, which one you think he's really running and why, and what measurement or follow-up case would separate them. Also tell me where your own answer is most likely to break and what would change your mind.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Goal:** Determine if "Dan" would recommend enlarging a decision body from 7 to 31 members based on specific case details.
      *   **Input Data:** A list of 7 past scenarios with Dan's verdicts (Yes/No) and reasoning. A new scenario (7 vs. 31, 67% accuracy, 0.25 error correlation).
      *   **Requirements:**
          1.  Identify different rules/models that fit Dan's track record.
          2.  Predict the outcome for the new case under each rule.
          3.  Hypothesize which rule Dan is *actually* using and why.
          4.  Propose a measurement/follow-up to distinguish between the rules.
          5.  Identify where *my* analysis might break and what would change my mind.

  2.  **Analyze Dan's Track Record (The "Training Data"):**
      *   *Case 1:* 100 raters, 51% acc, independent, majority. -> **YES**. (Condorcet Jury Theorem (CJT) logic: $p > 0.5$, independent, $N \to \infty$ implies accuracy $\to 1$).
      *   *Case 2:* 100 raters, 49% acc, independent, majority. -> **NO**. (CJT logic: $p < 0.5$, $N \to \infty$ implies accuracy $\to 0$).
      *   *Case 3:* 500 raters, 60% acc, *shared misleading input*. -> **NO**. (Correlated error/Common cause. Independence assumption violated).
      *   *Case 4:* 12 raters, 65% acc, independent. -> **YES**. (CJT logic: Small $N$ but high $p$ helps, larger $N$ helps more).
      *   *Case 5:* Sequential voice votes (information cascade). -> **NO**. (Social proof/herding destroys independence).
      *   *Case 6:* 200 raters, mixed ability (70% & 47%), equal weight. -> **YES** (but grumbled). (Weighted voting would be better, but raw numbers still help if avg $p > 0.5$).
      *   *Case 7:* Adding one 50% rater. -> **NO**. (Noise addition, tie risk).

      *   *Core Pattern:* Dan is a strict Bayesian/Statistical Decision Theorist focused on **Independence** and **Competence ($p > 0.5$)**. He implicitly uses the Condorcet Jury Theorem but penalizes heavily for correlations (common shocks, cascades) and sub-50% competence.

  3.  **Analyze the New Case:**
      *   *Current:* 7 people.
      *   *Proposed:* 31 people.
      *   *Accuracy:* 67% ($p = 0.67$).
      *   *Source:* Same training pipeline, same protocol.
      *   *Correlation:* Pairwise error correlation $\rho \approx 0.25$.
      *   *Unknown:* Direction of shared error (bias vs. difficulty).

  4.  **Develop Competing Models/Rules:**

      *   **Model A: The Pure Condorcet Idealist (Independence Assumption).**
          *   *Rule:* If $p > 0.5$ and independent, enlarge.
          *   *Fit to History:* Fits Cases 1, 2, 4, 6, 7 perfectly. Struggles with 3 and 5 unless "independence" is interpreted strictly (which Dan seems to do).
          *   *Prediction for New Case:* **YES**. $p=0.67$ is good. 31 is bigger than 7.
          *   *Flaw:* Ignores the stated $\rho = 0.25$.

      *   **Model B: The Correlation Skeptic (Effective Sample Size).**
          *   *Rule:* Enlarge only if Effective $N$ ($N_{eff}$) increases significantly. $N_{eff} \approx N / (1 + (N-1)\rho)$.
          *   *Fit to History:* Explains Case 3 (high $\rho$ due to shared input -> low $N_{eff}$). Explains Case 5 (cascades -> $\rho \to 1$). Explains Case 1 & 4 ($\rho \approx 0$).
          *   *Prediction for New Case:* Calculate $N_{eff}$.
              *   For $N=7, \rho=0.25$: $7 / (1 + 6*0.25) = 7 / 2.5 = 2.8$.
              *   For $N=31, \rho=0.25$: $31 / (1 + 30*0.25) = 31 / 8.5 \approx 3.65$.
              *   Gain is small (2.8 to 3.65).
          *   *Verdict:* **NO** (or "Meh"). The marginal gain in signal-to-noise is tiny compared to the cost/complexity. Dan grumbled in Case 6 about inefficiency; he might see this as inefficient.

      *   **Model C: The Common Cause/Bias Detector.**
          *   *Rule:* If errors are correlated, check if they are *biased* (systematic) or just *noisy* (difficulty). If systematic bias exists, enlarging cements the error (Case 3).
          *   *Fit to History:* Specifically targets Case 3. Distinguishes between "hard cases" (okay to enlarge) vs. "wrong training" (bad to enlarge).
          *   *Prediction for New Case:* **UNCERTAIN/NO**. The prompt says "nobody has checked whether the shared component... points in some particular direction." Dan hates unknown risks (Case 3). He likely assumes the worst (systematic bias from "same training pipeline").
          *   *Verdict:* **NO** until audited.

      *   **Model D: The Diminishing Returns Pragmatist.**
          *   *Rule:* Enlarge only if the marginal accuracy gain exceeds a threshold.
          *   *Fit to History:* Fits Case 7 (adding 1 rater is negligible). Fits Case 6 (grumbling about weights).
          *   *Prediction:* Calculate accuracy gain. With $\rho=0.25$, the curve flattens fast.
          *   *Verdict:* **NO**.

  5.  **Select the "Dan" Model:**
      *   Dan's reasoning in Case 3 ("shared bad input is a common cause") and Case 5 ("cascade... later votes add almost nothing") shows he understands *why* independence fails.
      *   In the new case, the correlation is *given* (0.25). It's not hypothetical.
      *   The "same training pipeline" triggers his Case 3 alarm ("same misleading explainer").
      *   *Hypothesis:* Dan is running **Model B/C Hybrid**. He calculates Effective N or assumes correlated error implies systematic bias risk.
      *   *Most likely:* He says **NO**. The correlation (0.25) is high enough that 31 people isn't much better than 7, and the "same training" suggests the correlation isn't just case difficulty, but potential systematic bias.

  6.  **Drafting the Response:**

      *   *Introduction:* Acknowledge Dan's persona (Statistical Purist / Epistemic Vigilante).
      *   *Rule Reconstruction:* Define the three main candidate rules.
          1.  **Naive Condorcet:** $p > 0.5 \to$ Enlarge.
          2.  **Effective N (Correlation Adjusted):** $N_{eff}$ must grow meaningfully.
          3.  **Common Cause Veto:** Correlated error + Shared Origin = Stop.
      *   *Applying to New Case:*
          *   Naive: Yes.
          *   Effective N: Marginal gain (2.8 to 3.65). Probably No.
          *   Common Cause: High risk of systematic bias. No.
      *   *Dan's Likely Call:* **NO.** Why? The "same training pipeline" is the smoking gun for Case 3 logic. The 0.25 correlation confirms non-independence.
      *   *Distinguishing Measurement:* Need to separate *difficulty* correlation from *bias* correlation. Split the 31 into groups with different training seeds or blind them to the protocol nuances. Or check error overlap on specific false positives/negatives.
      *   *My Uncertainty:* Where could I be wrong? If 0.25 is considered "low" in psychometrics (it's actually moderate/high for binary decisions). If the cost of error is asymmetric. If Dan is more optimistic about $p=0.67$.

  7.  **Refining the Calculation (Self-Correction/Verification):**
      *   Let's check the $N_{eff}$ formula again. Bahadur representation or simple intraclass correlation.
      *   Formula: $Var(\bar{X}) = \frac{\sigma^2}{N} [1 + (N-1)\rho]$.
      *   Effective sample size $N_{eff} = \frac{N}{1 + (N-1)\rho}$.
      *   $N=7, \rho=0.25 \to 7 / (1 + 1.5) = 7/2.5 = 2.8$.
      *   $N=31, \rho=0.25 \to 31 / (1 + 7.5) = 31/8.5 \approx 3.65$.
      *   Going from 7 to 31 (4.4x cost) yields 3.65/2.8 (1.3x effective power).
      *   Dan grumbled in Case 6 about "leaving something on the table." He hates inefficiency. This looks inefficient.
      *   Also, Case 3 is the strongest prior. "Same training pipeline" $\approx$ "Same misleading explainer."
      *   Conclusion stands: Dan says No.

  8.  **Structuring the "Where I Break" Section:**
      *   I need to be humble about the correlation interpretation. Is 0.25 high? In binary classification, yes.
      *   I need to consider if Dan cares about *calibration* vs. *discrimination*.
      *   What if Dan is actually a *weighted voting* advocate (Case 6) and sees this as a chance to implement weights? But the prompt implies a binary yes/no on *enlarging*, not restructuring.

  9.  **Final Polish:** Ensure tone is analytical but captures the "Dan" character (slightly pedantic, statistically rigorous, risk-averse regarding epistemic independence).

      *(Self-Correction during drafting)*: Wait, Case 6 says "Yes" to mixed ability (70% and 47%). Average is 58.5%. He said Yes. So he tolerates some drag. But Case 3 (60% acc) was a No because of correlation. The New Case has 67% acc (better than Case 3) but 0.25 correlation (explicitly stated). Case 3 didn't state a number, but implied $\rho$ was high enough to negate the 60%.
      Is 0.25 high enough to negate 67%?
      With independence, 7 people @ 67% is very strong.
      With $\rho=0.25$, it's much weaker.
      The key is the *marginal* benefit.
      Dan's Case 7 (adding 1 rater) was a No. This implies he looks at marginal utility.
      Marginal utility of 24 extra people with $\rho=0.25$ is low.
      Dan's Case 3 reasoning ("crowd can't correct for it") is the killer. If the correlation comes from "same training," he will assume it's systematic bias until proven otherwise.

      *Decision:* Dan says **No**.

  10. **Final Review against constraints:**
      *   Did I give the Yes/No? Yes.
      *   Did I outline different rules? Yes.
      *   Did I predict for each? Yes.
      *   Did I say which one Dan is running? Yes.
      *   Did I suggest a follow-up? Yes.
      *   Did I include "Where I break"? Yes.

      *Let's write it.*
answer: |-
  Based on Dan's track record, he is not a simple head-counter. He is an **epistemic vigilante** who applies a rigorous, correlation-adjusted version of the Condorcet Jury Theorem. He cares less about the raw number of heads and more about the *independence of the errors*.

  Here is the breakdown of the rules that fit his history, how they apply to the new case, and my assessment of what Dan will actually do.

  ### 1. Three Rules That Fit Dan's History

  **Rule A: The Naive Condorcet (Competence Threshold)**
  *   **Logic:** If individual accuracy $p > 0.5$ and votes are binary, increasing $N$ increases group accuracy. If $p < 0.5$, increasing $N$ decreases it.
  *   **Fits Cases:** 1 (51%, Yes), 2 (49%, No), 4 (65%, Yes), 7 (50%, No).
  *   **Fails Cases:** 3 (60%, No) and 5 (Cascade, No). To make this fit, you have to assume Dan treats Case 3 and 5 as violating the "independence" clause implicitly required by Condorcet.
  *   **Prediction for New Case:** **YES.** $p=0.67$ is well above 0.5. $31 > 7$.

  **Rule B: The Effective Sample Size (Correlation Discount)**
  *   **Logic:** Correlated errors reduce the information value of additional raters. Dan mentally calculates Effective $N$ ($N_{eff}$). If $N_{eff}$ doesn't grow proportionally to cost/complexity, he rejects.
  *   **Formula:** $N_{eff} \approx \frac{N}{1 + (N-1)\rho}$.
  *   **Fits Cases:** Explains Case 3 (shared input $\to \rho \approx 1 \to N_{eff} \approx 1$) and Case 5 (cascades $\to \rho \to 1$). Explains Case 6 grumbling (equal weighting with mixed ability is statistically inefficient, effectively lowering $N_{eff}$).
  *   **Prediction for New Case:** **NO (or "Not Worth It").**
      *   Current Panel ($N=7, \rho=0.25$): $N_{eff} = 7 / (1 + 1.5) = \mathbf{2.8}$.
      *   Proposed Panel ($N=31, \rho=0.25$): $N_{eff} = 31 / (1 + 7.5) = \mathbf{3.65}$.
      *   **Analysis:** You are quadrupling the headcount (7 to 31) to gain the equivalent of less than one additional independent rater (2.8 to 3.65). Dan hates inefficiency (Case 6) and no-ops (Case 7).

  **Rule C: The Common Cause Veto (Systematic Bias Check)**
  *   **Logic:** Correlation isn't just noise; it's a signal of shared vulnerability. If the correlation source is *systematic* (training, protocol, shared input) rather than *case difficulty*, enlarging the body cements the bias.
  *   **Fits Cases:** Specifically drives Case 3 ("shared bad input is a common cause"). Also informs Case 5 (social proof is a common cause).
  *   **Prediction for New Case:** **NO.** The prompt states "same training pipeline and same scoring protocol." To Dan, this is the exact same structural flaw as Case 3 ("same misleading explainer"). Without proof that the correlation is due to case difficulty rather than pipeline bias, he assumes the latter.

  ### 2. What Dan Actually Says

  **Dan says: No.**

  **Why:**
  Dan is running a hybrid of **Rule B and Rule C**.
  While Rule A (Naive Condorcet) fits the majority of his "Yes" votes, his "No" votes are the ones that reveal his true constraints. He is willing to accept high $N$ only if independence is plausible.

  In this new case, two red flags trigger his Case 3 reflex:
  1.  **Explicit Correlation:** $\rho=0.25$ is massive for binary decisions. In psychometrics, anything above 0.10 often suggests shared method variance.
  2.  **Shared Origin:** "Same training pipeline" is the smoking gun. In Case 3, he rejected 500 people at 60% accuracy because of "shared bad input." Here we have 31 people at 67% accuracy with "shared training." He will view the 7% accuracy gain as insufficient to offset the risk that the training pipeline itself encodes a systematic blind spot.

  Furthermore, the **Effective Sample Size** calculation (Rule B) confirms the inefficiency. Dan grumbled in Case 6 about "leaving something on the table." He will view paying for 24 extra salaries to gain 0.85 effective raters as gross negligence of resources.

  ### 3. How to Separate the Rules (The Follow-Up)

  To distinguish whether Dan is objecting due to *inefficiency* (Rule B) or *bias risk* (Rule C), propose this measurement:

  **The "Split-Protocol" Audit:**
  Take the 31 candidates. Randomly assign them to three distinct training seeds or scoring protocols (A, B, C) that are functionally equivalent but methodologically distinct.
  *   **If Dan says "Yes, if we split them":** He is running **Rule C (Common Cause)**. He believes the correlation is systematic bias. Breaking the shared pipeline breaks the correlation, restoring independence.
  *   **If Dan still says "No":** He is running **Rule B (Effective N)**. Even if you break the bias, the remaining correlation (due to case difficulty) keeps $N_{eff}$ low. He believes the marginal gain is too small regardless of bias.

  **A simpler diagnostic:**
  Ask him: *"If we could prove the 0.25 correlation is entirely due to case difficulty (hard cases fool everyone) and zero due to training bias, would you approve?"*
  *   **Yes:** He's a Common Cause Vetoer.
  *   **No:** He's an Effective Sample Size Pragmatist.

  ### 4. Where My Analysis Breaks (And What Changes My Mind)

  **The Weak Point: The Interpretation of $\rho = 0.25$.**
  I am assuming Dan views 0.25 as "high correlation." In some social science contexts, 0.25 is moderate. If Dan has an internal lookup table where $\rho < 0.30$ is considered "acceptable independence," my Effective N calculation becomes less persuasive to him. If he believes 0.25 is mostly "case difficulty" (which is honest error, not bias), he might revert to Rule A.

  **What Would Change My Mind:**
  If Dan asks: *"What is the cost of a false negative vs. a false positive?"*
  *   **Asymmetric Loss:** If the client's risk is heavily skewed (e.g., missing a fraud is 100x worse than flagging a clean case), Dan might switch to **Rule A**. Even a small gain in $N_{eff}$ (2.8 to 3.65) shifts the tail probabilities of the distribution. If the goal is to minimize variance at the extreme tails rather than maximize mean accuracy, the larger $N$ helps even with correlation.
  *   **Calibration Data:** If the client shows Dan that on the "hard cases" where the raters correlate, the *majority* is still right 80% of the time, Dan's Case 3 objection evaporates. He objects to shared *wrongness*, not shared *difficulty*.

  **Summary:** Dan will likely block the expansion because he sees 31 clones as statistically indistinguishable from 7 clones, and he hates paying for clones. He wants orthogonal errors, not just more errors.
