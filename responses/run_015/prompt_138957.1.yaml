answer: |-
  Your taxonomy of reserved-sphere (a), comparative-efficiency (b), and participation-consent (c) captures the normative landscape well, but the practices you identify reveal that no single system rests on one pillar. Instead, each system conceals a specific hierarchy among these theories, determining which "wrong" is paramount.

  In Germany, the Bundesrat's veto over laws the *Länder* execute strictly presupposes (c) participation-consent. The substantive wrong prevented is not federal encroachment on a reserved subject (a), but rather the imposition of administrative burdens without the administrator's agreement. This explains why the veto triggers on execution, not subject matter. However, this theory is philosophically underdetermined regarding the EU. If the wrong is executing rules one didn't make, the *Länder* should hold a veto over EU law they administer. The fact that they do not suggests the German model presupposes a sovereign demos: (c) applies fully only within the closed circuit of the federal state. Outside that circuit, (c) degrades to consultation because the *Länder* are not constituent masters of the EU. If the theory shifted to (a) reserved-sphere, the Bundesrat veto would vanish for administrative laws touching federal competences, and the EU veto would strengthen where *Länder* culture is implicated. Currently, the system prioritizes domestic administrative peace over external sovereignty protection.

  The European Union's operationalization of subsidiarity appears to be (b) comparative-efficiency, yet it functions as (c) participation-consent. The "self-applied constraint" is normative only because the political cost of ignoring reasoned opinions is high, not because a court enforces a logical test. The fact that the Council (Member State governments) adopts the measure means the "boundary" is policed by the very entities whose competence is at stake. This presupposes that the Member States are the primary guardians of their own power, making the process a negotiation of consent rather than a judicial finding of efficiency. If the theory were strictly (b), an independent technocratic court would annul measures frequently based on empirical data. If it were (a), the Treaty would list exclusive domains rigidly rather than using a "better achieved" test. The current practice fits (b) rhetorically but presupposes (c) politically. The rarity of annulment confirms that the boundary is a political question, not a legal one.

  The American asymmetry reveals that federalism is protected not as a state right (a) but as a safeguard for political accountability. The clear statement rule presupposes that the wrong is not federal preemption itself, but federal preemption that obscures who is responsible. It forces Congress to own the displacement of state law. Conversely, the Dormant Commerce Clause invalidates state statutes without congressional text because the beneficiary there is not the state, but the national market and the individuals within it. This shows the principle is underdetermined: it protects the *process* of federalism (accountability) rather than the *substance* of state sovereignty. If the theory were (a), the Dormant Commerce Clause would not exist, as states would have a reserved sphere to regulate commerce as they saw fit. If the theory were (c), Congress would require state consent to preempt. The current rules imply that the "wrong" is political opacity or market fragmentation, not the violation of state dignity.

  Switzerland represents the radicalization of (c). By barring courts from reviewing federal statutes, the system presupposes that the only legitimate boundary is the electorate's will, expressed through referenda. The "wrong" of federal overreach is cured not by legal correction but by political mobilization. This makes the boundary purely procedural. If the theory were (a) or (b), a court would be necessary to define the sphere or measure efficiency. The Swiss model implies that legal boundaries are fictitious without democratic enforcement.

  Regarding the "upward principle" (the obligation to centralize), this is not a rival to subsidiarity but the logical flip side of (b) comparative-efficiency. If the lower level *cannot* sufficiently achieve the objective (including equity goals like "equivalent living conditions"), the center *must* act. In Germany and the EU, this transforms subsidiarity from a shield against centralization into a sword for it. The phrase "cannot be sufficiently achieved" implicitly includes the failure to ensure cohesion. If the theory were strictly (a) reserved-sphere, positive obligations to centralize would be suspect, as they invade the lower level's domain regardless of outcome. If the theory were (c), centralization would require consent regardless of necessity. The existence of upward obligations proves that (b) efficiency ultimately trumps (a) and (c) in both the German and European contexts: the ultimate wrong is not centralization, but the failure to solve problems that transcend local capacity.

  In sum, these practices are philosophically underdetermined because they mix theories. Germany mixes (c) domestically with a weakened (c) externally. The EU masks (c) as (b). The US sacrifices (a) for political accountability. Switzerland chooses (c) over legal certainty. If you forced a single theory onto any of these systems, the machinery would break: the Bundesrat would lose its administrative veto, the EU would need a powerful court, the US would lose the Dormant Commerce Clause, and Switzerland would require judicial review. The "wrong" subsidiarity prevents is therefore not uniform; it is the specific illegitimacy each polity fears most—be it administrative imposition, political opacity, or democratic exclusion.
