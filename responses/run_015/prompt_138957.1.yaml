  6.  **Drafting the Content (Iterative process):**
      *   *Self-Correction during drafting:* I need to make sure I don't just describe the systems but analyze the *theory*. The prompt asks for the "implicit theory."
      *   *Focus:* Keep the distinction between "strictly presupposes" and "fits well with" clear.
