answer: |-
  This is a classic objection to Lewisian Modal Realism, often called the **"Problem of Induction for Modal Realists"** or a variant of the **"Principle of Indifference"** objection. Your flatmate has constructed a valid *reductio* against a specific *version* of Modal Realism—one that combines Lewis's metaphysics with a naive epistemology of self-location.

  The good news is that you do not need to abandon the core tenets you want to keep (indexical actuality, counterpart theory, no duplicates). The hole in the argument is not in the metaphysics (Step 1 or 2), but in the epistemology and probability theory (Step 3 and 5).

  Here is the breakdown of where the argument fails, the cost of the available repairs, and why your flatmate is half-right but ultimately wrong about the Boltzmann Brain comparison.

  ### The Critical Error: Step (3) and Step (5)

  The argument collapses at the junction of **(3)** and **(5)**.

  **Step (3)** invokes the Principle of Indifference: *In a self-locating problem with N candidates and no evidence distinguishing them, you spread credence evenly.*
  **Step (5)** assumes a specific counting measure: *The orderly continuations are a speck next to the messy ones.*

  Lewis explicitly rejects the inference from "There are many worlds" to "Probability is determined by counting worlds." In *On the Plurality of Worlds*, Lewis argues that **probability is not the proportion of worlds.**

  If you treat the set of all possible worlds as a set of equiprobable outcomes (like tickets in a lottery), you get the result your flatmate wants. But Lewis argues that logical space does not come with a pre-packaged, uniform measure. We cannot simply count worlds because:
  1.  **Individuation is tricky:** Depending on how you describe worlds, you can make any outcome seem rare or common (Bertrand's Paradox).
  2.  **Laws determine chance:** Probability is grounded in the *chances* defined by the laws of nature within a world, not the metaphysical abundance of worlds.

  **The Lewisian Reply:** We should not assign a uniform prior over all possible worlds. We should assign a measure over logical space that weights worlds according to their **naturalness**. Worlds governed by simple, stable laws (like ours) have a higher "measure" or "weight" than worlds governed by chaotic, gerrymandered laws, even if there are "more" (in terms of cardinality or description) of the latter.

  ### Pricing the Options

  You asked for a price list on how to save Modal Realism. Here is the cost of each repair, ranked from cheapest to most expensive for a Lewisian.

  #### 1. Refuse to Count Worlds / Take Ratios (Reject Step 3 & 5)
  *   **The Move:** Deny that credence should be spread evenly across worlds. Deny that "number of worlds" determines probability. Assert that we need a *measure* over logical space, and that measure is not uniform.
  *   **The Cost:** You must accept a primitive notion of "measure over logical space" that is not derived from cardinality. You have to say, "It is simply a brute fact that orderly worlds are more *probable* than chaotic ones, even if chaotic worlds are more *numerous*."
  *   **Lewisian Compatibility:** **High.** This is Lewis's official position. He argues that we weight worlds by their similarity to the actual world (for counterfactuals) or by the intrinsic chances (for probability).
  *   **Verdict:** **Cheapest.** This saves your metaphysics intact.

  #### 2. Swap Uniform Count for Similarity-Weighted Measure (Refine Step 3)
  *   **The Move:** Accept self-locating uncertainty, but argue that not all candidate locations are equally likely. Locations in worlds that are "more natural" or "more similar to my current experience" get higher credence.
  *   **The Cost:** You face the "Circularity Worry." To weight worlds by similarity to *this* world, you have to presuppose *this* world is special (epistemically, if not metaphysically). Your flatmate will say you're begging the question.
  *   **Lewisian Compatibility:** **High.** Lewis uses similarity metrics for counterfactuals. Extending this to credence is a natural step.
  *   **Verdict:** **Moderate.** It requires defending a non-uniform prior, but it's philosophically defensible.

  #### 3. Refuse the Move to Self-Locating Uncertainty (Reject Step 2)
  *   **The Move:** Argue that "Which world am I in?" is a ill-formed question. Under Counterpart Theory, you are **world-bound**. You do not exist in other worlds. Therefore, there is no uncertainty about which world you are in; you are 100% in this one. The uncertainty is only about *what laws govern this world*.
  *   **The Cost:** You lose the ability to model certain epistemic scenarios as self-location. It makes the "hotel room" analogy fail. You have to explain induction purely as inference to the best explanation of *local* laws, not as locating oneself in a multiverse.
  *   **Lewisian Compatibility:** **Medium.** Lewis accepts *de se* uncertainty (e.g., the Two Gods case), but he insists you are only in one world. However, for the purpose of induction, treating yourself as "located" among counterparts is often useful.
  *   **Verdict:** **Expensive.** It complicates the epistemology of modality, though it blocks the flatmate's specific "hotel room" analogy.

  #### 4. Give Up the Indexical Account of Actuality (Reject Step 1)
  *   **The Move:** Admit that "actual" marks a metaphysically privileged status.
  *   **The Cost:** **Fatal.** This collapses Modal Realism into Actualism or Ersatzism. If our world is metaphysically privileged, the whole motivation for Lewis's system (parsimony, uniformity of semantics) vanishes.
  *   **Verdict:** **Do Not Do This.**

  ### Is This Just the Boltzmann Brain Problem?

  Your flatmate is **structurally right** but **diagnostically wrong**.

  **Where he is right:** This *is* a version of the Boltzmann Brain problem. Any theory that posits a vast space of possibilities (Eternal Inflation, Many-Worlds Quantum Mechanics, Modal Realism) faces the question: "Why are we in the orderly corner?" If the theory implies that disordered observers are more numerous, the theory predicts we should be disordered.

  **Where he is wrong:** He claims this hits every view *equally*. It does not.
  1.  **Physics Multiverses:** In inflationary cosmology, the "measure problem" is a live, unsolved crisis. They *need* a physical measure to stop Boltzmann Brains from dominating. They don't have a consensus solution.
  2.  **Modal Realism:** Lewis *has* a solution ready-made: **Natural Properties.** Lewis's metaphysics is built on the idea that some properties are "more natural" than others. Laws of nature are regularities among natural properties. Chaotic worlds (where walls turn to flamingos) require gerrymandered, unnatural laws. Orderly worlds require natural laws.
      *   Lewis can argue that the *measure* over logical space is determined by naturalness. Therefore, worlds with stable laws have higher measure than worlds with chaotic laws, regardless of how many "variations" of chaos exist.
      *   Because MR is a metaphysical theory, it can stipulate the measure based on naturalness. Physical theories cannot easily do this without new physics.

  So, MR is actually in a *better* position than physical multiverse theories here, because Lewis already has the metaphysical machinery (Naturalness) to define a non-uniform measure.

  ### How to Win the Argument (The Script)

  Tell your flatmate this:

  > "You're assuming that probability in Modal Realism is determined by the **cardinality** of worlds (counting them). Lewis explicitly denies this.
  >
  > 1.  **Probability is not Counting:** Just because there are more ways to be chaotic than orderly doesn't mean chaotic outcomes are more *probable*. Probability is determined by the **laws of nature** within a world, not the metaphysical abundance of worlds.
  > 2.  **The Measure Problem:** We don't apply a Principle of Indifference over all possible worlds. We apply a measure weighted by **naturalness**. Worlds with stable, simple laws have a higher 'weight' in logical space than worlds with chaotic, complex laws.
  > 3.  **Counterpart Theory:** I am not 'in' other worlds waiting to wake up there. I am world-bound. The question isn't 'Which world am I in?' (I know it's this one). The question is 'What are the laws of this world?' My evidence (past order) supports the hypothesis that this world has stable laws. The existence of chaotic counterpart-worlds doesn't change the evidence I have about *this* world's laws.
  >
  > You've proven that Modal Realism + Naive Counting = Skepticism. Lewis rejects Naive Counting. So Modal Realism stands."

  ### Summary Recommendation

  **Reject Step (3) and (5).**
  Do not give up indexical actuality. Do not give up counterpart theory. Do not give up plenitude.
  Instead, insist that **credence does not track cardinality.** The "number" of worlds is irrelevant to probability; only the **measure** (grounded in naturalness and law) matters. This preserves the Lewisian package while blocking the skeptical conclusion.

  Your flatmate's argument works only if you treat possible worlds like lottery tickets. Lewis treats them like a logical space with a topology of naturalness. Once you impose that topology, the "chaotic noise" worlds are pushed to the margins of the measure, and induction is saved.
