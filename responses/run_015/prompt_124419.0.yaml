answer: |-
  **Project Title:** The Unit of Justification: Disaggregating the Aggregation Problem in Contractualism

  **1. The Research Question**
  Standard objections to Scanlon-style contractualism charge that its prohibition on interpersonal aggregation is arbitrary "intuition-mongering." This project tests that charge by asking: **Does the contractualist prohibition on aggregation rest on a principled distinction between intra-personal summation and inter-personal headcount, or does it collapse into an indefinable metric of complaint strength?**

  I argue that the "aggregation problem" is not a single dilemma but a conflation of three distinct structural issues: (1) Cross-person headcount (numbers vs. single victim); (2) Intra-personal summation (many burdens in one life vs. one burden in many lives); and (3) The Threshold Problem (sub-threshold harms that cumulatively devastate). Current literature focuses on (1), but the coherence of contractualism hinges on (2) and (3). If contractualists permit intra-personal summation (as they must to account for prudence) but ban inter-personal aggregation, they require a principled account of why the "person" is the moral aggregation barrier. If they cannot provide this without appealing to an external metric of value (e.g., utility), the "separateness of persons" is merely a label, not an argument.

  **2. Intervention and Argument Standard**
  The committee is rightly skeptical of proposals that simply refine contractualist intuitions. To avoid question-begging, this project will not assume the "separateness of persons" is morally fundamental. Instead, it will derive constraints strictly from the *procedure* of reasonable rejectability.

  A non-question-begging argument here must demonstrate that the *structure* of justification itself—appealing to reasons that no one could reasonably reject—generates the asymmetry between intra- and inter-personal burdens. If the asymmetry can only be defended by importing a prior axiology (e.g., "utility matters, but persons matter more"), the project will conclude that contractualism is dependent on consequentialist foundations. The goal is not to save contractualism, but to determine its cost: either it accepts a revisionist metric of complaint strength, or it admits a structural dependency on the very views it claims to replace.

  **3. Methodology (12-Month Plan)**
  *   **Months 1–3: Conceptual Mapping.** Formalize the distinction between the three aggregation problems. Construct case pairs that isolate Intra-personal Summation from Cross-person Headcount. *Deliverable:* A taxonomy of complaint types showing where standard contractualist responses conflate distinct logical problems.
  *   **Months 4–6: The Intra-personal Anchor.** Analyze the permissibility of summation within a single life. If a single person can complain about the sum of many small burdens, why can't a group? I will test "Prudential Unity" arguments against "Justificatory Individualism." *Deliverable:* Draft article on the moral significance of the person-boundary in complaint formation.
  *   **Months 7–9: The Threshold Challenge.** Investigate sub-threshold harms. If a burden is too small to ground a complaint individually, does it vanish or aggregate? This tests whether "complaint strength" is continuous or discrete. *Deliverable:* Analysis of whether threshold cases dissolve the aggregation problem or exacerbate it.
  *   **Months 10–12: Synthesis and Implications.** Determine if the distinctions hold. If they collapse, map the required metric of complaint strength. If they hold, articulate the structural principle preventing inter-personal aggregation. *Deliverable:* Final manuscript and fellowship paper.

  **4. Candidate Conclusions**
  1.  **The Unified Metric:** Complaint strength is uniform across persons. Contractualism must permit some inter-personal aggregation to remain consistent with intra-personal summation. (Revisionist)
  2.  **Structural Asymmetry:** Intra-personal summation is a feature of prudence, not justification. Inter-personal aggregation remains banned because justification is dyadic (agent-to-critic), not global. (Orthodoxy defended)
  3.  **Threshold Dissolution:** Aggregation is only problematic below the threshold of noticeability. Above the threshold, numbers count; below it, no complaint exists. (Dissolution)
  4.  **The Collapse:** The distinction between intra- and inter-personal burdens cannot be maintained without an external axiology. Contractualism is not a freestanding theory of rightness. (Eliminativist)

  **Decision Criteria:** The choice between these conclusions will be decided by whether a principle can be formulated that permits intra-personal summation while banning inter-personal aggregation *without* referencing the total sum of well-being. If the only defense of the ban appeals to "total badness," Conclusion 4 obtains.

  **5. Failure Conditions and Risk Assessment**
  **Real Failure Condition:** The project fails if, by Month 9, the distinction between Intra-personal Summation and Cross-person Headcount proves to be merely verbal. If every attempt to distinguish them relies on a premise that skeptics reject (e.g., "persons are morally sacred"), the year yields no progress beyond restating the stalemate.

  **Primary Risk (The Metric Worry):** Your hunch is correct: everything bottoms out in how to measure the strength of a complaint. If "strength of complaint" is cashed out in terms of "badness," contractualism collapses into consequentialism. If it is cashed out in terms of "reasons," we need a theory of reasons that isn't just consequentialism in disguise.
  *Mitigation:* The project treats the *metric of complaint strength* as the object of study, not a tool. I will not assume complaints have weights; I will investigate what *gives* them weight.

  **Scope Check:** This is too big for 12 months if I treat all three problems equally.
  *Cut:* **Problem 1 (Cross-person Headcount).** This is the trap. It absorbs attention but relies on the assumptions of (2) and (3). I will treat (1) as the *symptom* and focus 80% of the time on the link between (2) and (3). If I solve the Intra-personal/Threshold link, the Headcount problem resolves itself.

  ***

  ### Advisor's Strategic Assessment (For Your Eyes Only)

  **Does the Three-Problems Framing Collapse?**
  No, it holds, but only if you are ruthless about **Problem 2 (Intra-personal)**.
  *   **Problem 1** is about *weight* (Who wins?).
  *   **Problem 2** is about *units* (What counts as one complaint?).
  *   **Problem 3** is about *existence* (Is there a complaint at all?).
  Most contractualists conflate 1 and 2. They say "we don't aggregate" without specifying *where* the aggregation barrier sits. If you can show that contractualists *must* allow aggregation within a life (to explain why I can't be sacrificed for a trivial gain to another, even over time), but *cannot* explain why that aggregation stops at the skin, you have them. That is your wedge.

  **The "Complaint Strength" Trap**
  You are right to worry. This is the most likely point of failure. If you find yourself writing paragraphs about "how bad the burden is," stop. You have left contractualism. You must talk about "the force of the reason for rejection."
  *   *Advice:* Make the "Metric Worry" explicit in the proposal (as I did above). It shows the committee you know where the bodies are buried. It turns a vulnerability into a research objective.

  **Is 12 Months Enough?**
  Only if you cut Problem 1. Do not try to solve the "Save the Many vs. Save the One" case directly. It's a tar pit. Use the Intra-personal case (One person suffers 100 headaches vs. One person suffers 1 migraine) to set the rules, then apply them to the Many vs. One case. If you try to tackle Taurek-style cases head-on, you will spend 12 months reviewing literature instead of generating arguments.

  **Tone for the Committee**
  They think contractualism is intuition-mongering. Do not promise to "refine" contractualism. Promise to **stress-test** it. Frame the project as an investigation into whether contractualism has *any* non-question-begging resources to handle aggregation. If the answer is "no," that is a successful result for a fellowship. It shows rigor. If you promise to "save" the theory, they will smell desperation.

  **Final Verdict:** The idea is fundable. It moves the debate from "What are our intuitions?" to "What is the structural capacity of the theory?" That is what skeptical committees want to see. Just don't get seduced by the "Numbers" debate. Stay on the "Unit of Aggregation."
