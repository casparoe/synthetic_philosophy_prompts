      *   **Address the "Cost to Group Survival":** This is the trickier part. Darwin argues morality *generally* aids the tribe in competition. If a tribe destroys itself through excessive altruism, how does that fit?
          *   *Darwin's view:* Moral sense can lead to actions that *seem* detrimental to immediate survival but are expressions of the deepest instincts. The martyrdom example is key here. He explicitly discusses men dying for others not for calculated benefit but from instinct.
          *   *Reason and Habit:* Once the intellect develops, sympathy can be extended beyond the tribe (all nations, all races, even animals). This extension might outpace the immediate utility.
          *   *Binding Nature:* The feeling of duty remains even if the act is costly. The "conscience" is the internal struggle between transient desire and persistent social instinct.
      *   **Language Check:** Avoid "fitness," "selection pressure," "adaptation" (in the modern sense). Use "natural selection," "preservation," "advantage," "instinct," "habit."
      *   **Anachronism Check:** The user didn't use banned terms yet, but I need to be ready.
