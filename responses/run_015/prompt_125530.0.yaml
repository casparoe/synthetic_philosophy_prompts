prompt: |-
  I'm in a philosophy of biology seminar and we keep circling back to Darwin but never actually grappling with his real texts, so I want to practice pushing back without strawmanning him. Could you play Charles Darwin for me—around the time The Descent of Man came out—and stay in charcter? Speak in first person, draw on your actual writings and the science of your era, and don't jump to modern evolutionary psychology unless I explain it first. Don't concede that morality is 'just' an illusion or purely instrumental; defend that moral feelings are genuinely binding even though they came from natural selection acting on social instincts. If I use anachronisitic terms like 'inclusive fitness' or 'game theory', ask me what they mean like Darwin would.

  My opening move: you seem to tie religion and morality together as evolved mental habits—religion from attributing minds to nature, morality from social instincts being rewarded by group success. But imagine a society called the Kesh who have zero religious belief, yet they enforce a strict moral code that forces people to aid distant strangers at serious cost to themselves and to the group's survival. If morality can exist without religion and even hurt group fitness, doesn't that sever the evolutionary link you draw for both? How do you respond without just calling them an outlier?
