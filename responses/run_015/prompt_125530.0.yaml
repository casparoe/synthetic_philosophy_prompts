answer: |-
  My dear Sir,

  You propose a most intriguing case, this society of the Kesh. I appreciate greatly that you do not simply dismiss them as a fable, for in natural history, we must always be prepared for anomalies that test the rigour of our principles. Allow me to respond as best I can, drawing upon the arguments I have set forth in *The Descent of Man*, which sits upon my desk even now.

  First, I must clarify a point of potential misunderstanding. You suggest I tie religion and morality together as a single knot. I do not conceive of them as identical, though they are often entwined. In my view, the moral sense arises primarily from the social instincts—those impulses of sympathy and cooperation we observe in the higher animals, particularly the social mammals. Religion, on the other hand, springs from a different root: the tendency of the human mind to attribute agency and life to all things, combined with deep feelings of dependence and fear. 

  Therefore, the existence of the Kesh—a people with morality but no religion—would not disturb me greatly. Indeed, it might support my contention that morality is a natural outgrowth of social living, independent of supernatural belief. If they possess strong social instincts and a developed intellect, they may arrive at a moral code through reason and habit alone, without the aid of spiritual agencies. I have written that a man might be an atheist and yet be moral; the moral sense is not the exclusive property of the religious man.

  Now, to the more difficult matter: their morality aids distant strangers at serious cost to themselves and their group's survival. You ask if this severs the evolutionary link.

  I would argue it does not sever the link, but rather demonstrates the power of the intellect when applied to the social instinct. In Chapter IV of *Descent*, I discuss how the moral sense can lead a man to risk his life for the sake of others, or to follow a principle even when it brings him no personal advantage. We admire the hero who perishes for his country; we do not say his action is 'wrong' because it ends his life. We recognise that the social instinct is so strong that it overrides the instinct of self-preservation.

  With the Kesh, it appears their reason has extended the circle of sympathy beyond their own tribe to include distant strangers. Once the intellect is highly developed, habit and reason can extend sympathy to all men, and even to animals. This extension may, in specific instances, conflict with immediate survival. If a tribe sacrifices its own preservation to aid others, it may indeed perish. Natural Selection is not a benevolent guardian; it is a strict taskmaster. If the Kesh truly destroy themselves through this excessive altruism, they will vanish, and their specific moral code with them. 

  However, this does not render their moral feelings an illusion, nor does it negate the origin of the faculty. The *capacity* for morality evolved because, generally speaking, tribes possessing men who were faithful, brave, and sympathetic would flourish better than those who did not. The link is in the origin of the faculty, not necessarily in the utility of every single action that faculty produces. Just as a man may use his language to tell a lie, or his reason to calculate a error, the moral instinct may be directed by reason into channels that are costly.

  You ask how I defend the binding nature of these feelings if they are costly. I answer thus: The moral sense is binding because it is composed of the most persistent instincts we possess. When a man acts against his social instinct to satisfy a transient desire, he feels misery—what we call conscience. This misery is not a calculation; it is a real, palpable suffering. The obligation is real because the pain of violating the instinct is real. Even if aiding a distant stranger harms the Kesh materially, the internal compulsion to aid him is a genuine feature of their mental constitution, forged by long ages of social living.

  To say morality is "just" evolved is like saying love is "just" a reproductive strategy. It may have originated there, but the feeling itself is the highest quality we possess. The Kesh may be doomed by their nobility, but I would not call their nobility an illusion.

  I must ask, however: when you speak of cost to the "group's survival," do you imply that a tribe must always out-compete its neighbours to be considered moral? For I have argued that a tribe of moral men will usually beat a tribe of selfish men. But if the Kesh define their "group" as all humanity, then aiding strangers is aiding their own extended group, even if their immediate village suffers. 

  Pray, tell me more of this cost. Is it a financial ruin, or a loss of life in conflict? And when you speak of these evolutionary links, you modern scholars sometimes use terms I do not recognise. You have not yet used them, but I sense a rigour in your questioning that suggests new mathematics behind the biology. If you speak of "fitness" or "games," I beg you, explain them to me as you would to a naturalist who has spent his life counting barnacles, not calculating equations.

  I remain, Sir, your humble servant,

  Ch. Darwin
