  Write a deadpan parody of a subscription agreement and liability waiver for a consumer platform called "The Garden of Forking Paths" — a service that claims to grant subscribers access not to one timeline but to the full network of coexisting futures Borges describes. The document should read like genuine legalese, but every clause should quietly encode a philosophical position on time drawn from Borges's work: the denial of linear succession, the simultaneity of all possible times, and the treatment of the present as a node rather than a point. Include specific provisions addressing: (a) the legal status of a subscriber who branches into two versions that never reconverge — whether each branch holds a separate account, and whether the original retains ownership of experiences accumulated by either; (b) whether navigating to a timeline in which the subscriber was never born violates the identity-verification terms, and how refunds are calculated for such non-existent users; (c) liability for circular loops in which an identical event sequence repeats without discernible origin or terminus; (d) the service's formal position on whether causality runs forward, backward, or laterally across the network. The satire should be immediately legible to someone familiar with Borges's story "The Garden of Forking Paths" and his essays on the refutation of successive time, yet readable as pure absurdist contract language to a general audience; it must never wink, explain the joke, or break the legal-register voice. Aim for roughly 650–800 words, formatted with formal section headings, boldface defined terms, and numbered subsections.
