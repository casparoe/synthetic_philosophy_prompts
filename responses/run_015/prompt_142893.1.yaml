prompt: |-
  Hi — I'm one of five people on the investment committee of a small (~$180m) college endowment. We look at maybe 25 opportunities a year, meet monthly, and every memo we write ends in a number: a probability of hitting the target return, which we then feed into a position size. I've become convinced this is broken in a specific way: it makes us systematically favour whatever is easiest to model, and it lets a manager with a nice backtest of a brand-new strategy outcompete a boring fund with fifteen years of actual data, because the backtest produces a cleaner number. Someone pointed me at Keynes's Treatise on Probability — the bit about probability being a degree of rational belief grounded in evidence, and especially his separate notion of the weight of an argument (how much evidence you have, as opposed to how favourable it is), plus his claim that for a lot of real decisions there just is no numerical probability and people fall back on a convention that the future will look like the past, or on what everyone else is doing.

  Can you turn that into a procedure we could actually run in a committee meeting? I mean: the questions in order, what counts as a real answer to each, when the procedure spits out a no, and when it has to hand the question back to us as a values call. Three things I care about most. (1) A test for whether a number in a memo is grounded in an actual class of comparable cases or is really just model output dressed up — I want the memo to say which. (2) Some rule connecting weight to position size that doesn't collapse into "be more conservative when you know less." (3) What we're supposed to do when there genuinely is no probability: Keynes seems to say falling back on convention is just what everyone does, but I want to know when that's fine and when it's self-deception, and whether "hold cash and wait" is ever an honest output we could defend to a board that hates cash drag.

  Then run it on three cases: (a) re-upping with a private credit manager we've been with through two downturns and who has 15 years of quarterly data; (b) a first-time fund doing something genuinely new with a beautiful backtest and three months of live trading; (c) our single biggest allocation, which we've rolled over for years mostly because its never given us a reason to stop — I have a feeling the procedure is going to tell us something about that one that we don't want to hear. And please say plainly what the procedure can't do for us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Member of a 5-person investment committee for a ~$180m college endowment.
      *   **Current Process:** 25 opps/year, monthly meetings, memos end in a probability of hitting target return -> drives position size.
      *   **Problem:** Systematically favors easy-to-model stuff (clean backtests) over messy reality (long track records). "Probability" is often spurious precision.
      *   **Philosophical Anchor:** Keynes's *Treatise on Probability*. Key concepts: Probability as degree of rational belief, *Weight of Argument* (amount of evidence vs. favorability), non-numerical probabilities, reliance on convention/herding when evidence is low.
      *   **Deliverable:** A concrete procedure for committee meetings.
          *   Questions in order.
          *   What counts as a real answer.
          *   When it says "No."
          *   When it kicks back a "Values Call."
      *   **Three Specific Constraints/Goals:**
          1.  Test for grounded numbers (class of cases vs. model output).
          2.  Rule connecting *Weight* to position size (not just "be conservative").
          3.  Guidance on "No Probability" scenarios (Convention vs. Self-deception vs. Cash).
      *   **Application:** Run the procedure on three cases:
          (a) Established Private Credit (15 yrs, 2 downturns).
          (b) First-time Fund (New strategy, beautiful backtest, 3 mos live).
          (c) Legacy Core Allocation (Rolled over for years, no reason to stop).
      *   **Caveat:** State plainly what the procedure *can't* do.

  2.  **Analyze the Keynesian Framework:**

      *   *Probability ($P$):* The balance of evidence favoring an outcome. (e.g., 70% chance of success).
      *   *Weight ($W$):* The total amount of relevant evidence. (e.g., 15 years of data vs. 3 months + backtest).
      *   *Key Insight:* High $P$ with Low $W$ is dangerous. Low $P$ with High $W$ might be a bargain.
      *   *Non-Numerical Probability:* Some things simply cannot be quantified meaningfully. Forcing a number is deception.
      *   *Convention:* When $W$ is low, we mimic others or assume the status quo. This is risky if the environment changes.

  3.  **Drafting the Procedure (The "Keynesian Gate"):**

      *   *Goal:* Move from "What's the number?" to "What's the evidence behind the number?"
      *   *Step 1: The Provenance of the Probability.* (Addressing Constraint 1). Is this frequentist (class of cases) or subjective (model output)?
      *   *Step 2: Assessing Weight.* (Addressing Constraint 2). How much evidence do we have? Need a metric or scale.
      *   *Step 3: The Decision Rule.* How do $P$ and $W$ interact to determine size?
      *   *Step 4: The "No Probability" Clause.* (Addressing Constraint 3). When do we admit ignorance? When is cash okay? When is convention okay?

      *   *Refining Step 3 (Size vs. Weight):* The user doesn't want "be conservative." They want a rule.
          *   Idea: Size = $f(P, W)$.
          *   If $W$ is low, max size is capped regardless of $P$.
          *   If $W$ is high, size can scale with $P$.
          *   This prevents a "perfect backtest" (High $P$, Low $W$) from getting a huge allocation.

      *   *Refining Step 4 (Convention/Cash):*
          *   Convention is acceptable *only* if the cost of being wrong is low or the cost of decision-making is high.
          *   Cash is defensible if $W$ is low across the board (market-wide uncertainty) or if specific opps lack $W$.
          *   Self-deception check: Are we holding because it's good, or because selling is hard?

  4.  **Developing the Three Cases:**

      *   *Case A (Private Credit):* High $W$ (15 yrs, downturns). $P$ is likely grounded. Procedure should validate this.
      *   *Case B (New Fund):* Low $W$ (3 mos + backtest). $P$ is likely model-derived. Procedure should cap size heavily or reject.
      *   *Case C (Legacy Core):* This is the tricky one. It sounds like "Convention" masquerading as "Evidence." $W$ might be high (years of data), but is the *relevance* of that evidence decaying? Or is it just inertia? Keynes would call this "assumption the future looks like the past." The procedure needs to flag this as a "Values Call" or a "Convention Check."

  5.  **Addressing the Constraints Explicitly:**

      *   *Constraint 1 (Grounded Number):* The "Provenance Question."
      *   *Constraint 2 (Weight/Size):* The "Weight Cap."
      *   *Constraint 3 (No Probability/Cash):* The "Ignorance Protocol."

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the insight. It's a sophisticated critique of modern portfolio theory/decision making.
      *   *The Procedure:* "The Weighted Belief Protocol."
          *   Phase 1: Provenance (Class vs. Model).
          *   Phase 2: Weight Scoring (The 1-5 Scale).
          *   Phase 3: Sizing Matrix (P x W).
          *   Phase 4: The Convention/Cash Test.
      *   *Running the Cases:* Apply the protocol rigorously.
          *   Case C needs to hurt a bit (as requested).
      *   *Limitations:* What can't this do? (It can't predict markets, it can't remove bias entirely, it requires discipline).

  7.  **Refining the "Weight" Metric:**
      *   How to quantify Weight?
      *   Factors: Time, Regime Changes, Data Transparency, Structural Stability.
      *   Let's create a "Weight Score" (1-5).
      *   1 = Backtest only.
      *   3 = Some live data, one regime.
      *   5 = Multiple regimes, structural understanding.

  8.  **Refining the "Size" Rule:**
      *   Standard approach: Size $\propto$ Probability.
      *   Keynesian approach: Size $\propto$ Probability $\times$ Weight.
      *   Or better: Max Size is a function of Weight.
      *   Let's propose: *Maximum Allocation % = Base % $\times$ Weight Score.*
      *   If Weight is 1/5, max allocation is 20% of what you'd normally give.

  9.  **Refining the "Convention/Cash" aspect:**
      *   When is convention okay? When the alternative is costly speculation.
      *   When is cash okay? When Weight is low *and* Probability is ambiguous.
      *   Defense to Board: "We are preserving capital because the *weight of evidence* required to deploy is not present."

  10. **Review against User Tone:**
      *   User is intellectual, pragmatic, slightly cynical about current process.
      *   Tone should be professional, direct, respectful of the Keynesian framework, not overly academic but rigorous.
      *   Avoid jargon where possible, but use the specific terms ($P$ and $W$).

  11. **Self-Correction/Edge Case Check:**
      *   *Did I answer the "Values Call" part?* Yes, need to specify when the committee must vote based on philosophy rather than math.
      *   *Did I address the "Board hates cash drag"?* Yes, need a script for that.
      *   *Is Case C handled honestly?* It needs to reveal that "no reason to stop" is not evidence. It's convention.

  12. **Final Polish:** Ensure the distinction between *Probability* (favorability) and *Weight* (evidence volume) is clear throughout. (Self-correction: Make sure the sizing rule doesn't just say "be conservative." It needs to be mechanical. E.g., A High Probability with Low Weight gets a smaller slot than Medium Probability with High Weight.)

      *   *Idea for Sizing:* "The Confidence-Weighted Cap."
      *   If Weight < 3, Max Position = X%.
      *   If Weight >= 4, Max Position = Y%.
      *   This forces the "beautiful backtest" to be small.

      *   *Idea for Case C:* The procedure should force a "Re-underwriting." If the thesis is "it always worked," that's a convention. The procedure should flag that the *Weight* of evidence regarding the *current* environment might be low if the strategy relies on past regimes that no longer exist.

      *   *Wait, one nuance:* Keynes argues that for unique events, numerical probability is meaningless. So Step 1 must allow for "Non-Numerical." If Non-Numerical, you can't feed it into the sizing model. You have to make a qualitative call.

      *(Self-Correction during drafting)*: Keep it actionable. A 5-person committee needs a checklist, not a philosophy seminar.

      *   *Structure:*
          1.  The Protocol (The Checklist).
          2.  The Sizing Rule.
          3.  The "No Number" Rule.
          4.  The Case Studies.
          5.  The Limitations.

      *   *Let's write it.*
answer: |-
  This is a sophisticated diagnosis. You have identified that your committee is confusing *risk* (variance of outcome) with *uncertainty* (lack of knowledge about the distribution of outcomes). Keynes's distinction between the *probability* of an argument (how likely it is true) and the *weight* of an argument (how much evidence supports it) is the exact tool needed to fix this.

  Here is a procedure designed for a five-person committee, operationalizing Keynes's *Treatise on Probability*. It replaces the single "Probability of Success" number with a two-dimensional assessment: **Confidence ($P$)** and **Weight ($W$).**

  ### The Procedure: The Weighted Belief Protocol

  Run this at the start of the discussion, before debating valuation or terms.

  #### Phase 1: The Provenance Test (Addressing Constraint 1)
  **Question:** "Is the probability number in the memo derived from a *reference class* of comparable historical outcomes, or is it output from a *model* of a single unique system?"

  *   **Valid Answer (Reference Class):** "We have 15 years of data across 3 credit cycles. This manager's cohort has a known failure rate of X%."
  *   **Invalid Answer (Model Output):** "Our Monte Carlo simulation suggests a 90% chance of success," or "The backtest shows a Sharpe of 2.0."
  *   **The Rule:** If the answer is Model Output, the Probability ($P$) is marked as **Provisional**. It cannot exceed 60% regardless of model elegance. If the answer is Reference Class, $P$ can be rated up to 90%.
  *   **The "No":** If the memo cannot identify a reference class *and* admits the model relies on assumptions about future correlation/volatility that have never been observed, the proposal is **Rejected** unless it is designated as "Venture/Research Capital" (max 1% of portfolio).

  #### Phase 2: The Weight Scoring (Addressing Constraint 2)
  **Question:** "What is the Weight ($W$) of the evidence?"
  Score $W$ on a scale of 1 to 5. This is not about how *good* the news is, but how *much* there is.

  *   **$W=1$ (Theoretical):** Backtest only. No live capital.
  *   **$W=2$ (Fragile):** <1 year live data. Single market regime.
  *   **$W=3$ (Established):** 3–5 years live data. One downturn or stress event.
  *   **$W=4$ (Robust):** 7+ years. Multiple regimes. Transparent data.
  *   **$W=5$ (Deep):** 10+ years. Structural understanding of *why* returns exist, not just *that* they exist.

  #### Phase 3: The Sizing Matrix (The Rule)
  Do not size based on $P$ alone. Size based on the **Weighted Capacity**.

  *   **The Cap Rule:** Maximum Position Size = (Standard Risk Limit) $\times$ ($W$ / 5).
      *   *Example:* If your standard limit for a strategy is 10% of the portfolio:
      *   Case B ($W=2$): Max size is 4%. Even if $P$ is 95%.
      *   Case A ($W=5$): Max size is 10%.
  *   **The Rationale:** This prevents a "clean backtest" from dominating the portfolio. It forces the "beautiful number" to prove its weight before earning its size.

  #### Phase 4: The Convention & Cash Test (Addressing Constraint 3)
  **Question:** "If we cannot assign a numerical probability, what convention are we using to decide?"

  *   **Scenario A: Legitimate Convention.** "We are holding this asset because it provides liquidity for operations, and the cost of being wrong is low." -> **Acceptable.**
  *   **Scenario B: Self-Deception.** "We are holding this because we always have, and selling feels like admitting a mistake." -> **Forbidden.** This triggers a **Values Call**.
  *   **Scenario C: Cash.** "The Weight of evidence across all available opportunities is below 3."
      *   **Board Defense:** "We are not holding cash because we fear markets. We are holding cash because the *Weight of Evidence* required to deploy capital responsibly is currently unavailable. Deploying now would be speculation, not investment."

  ---

  ### Running the Procedure on Your Three Cases

  Here is how the protocol forces the conversation to change in your next meeting.

  #### Case (a): The Private Credit Manager (15 Years, 2 Downturns)
  *   **Phase 1 (Provenance):** Reference Class. They have survived actual credit cycles. The probability is grounded in realized loss data, not modeled defaults.
  *   **Phase 2 (Weight):** $W = 5$. Deep evidence. Structural understanding of their underwriting is known.
  *   **Phase 3 (Sizing):** Eligible for full standard allocation.
  *   **Phase 4 (Convention):** Not relying on convention. Relying on evidence.
  *   **Verdict:** **Approve.** The procedure validates what you already feel, but now you can defend it mathematically. You aren't betting on their future; you are betting on the *weight* of their past.

  #### Case (b): The First-Time Fund (Beautiful Backtest, 3 Months Live)
  *   **Phase 1 (Provenance):** Model Output. The backtest is a model. 3 months live is noise.
      *   *Constraint:* Probability ($P$) capped at 60% (Provisional).
  *   **Phase 2 (Weight):** $W = 2$. Fragile. No stress testing.
  *   **Phase 3 (Sizing):** Max Position = Standard Limit $\times$ (2/5). If your normal max is 5%, this fund gets 2%.
  *   **Phase 4 (Convention):** None.
  *   **Verdict:** **Approve as Satellite Only.** The committee member arguing for a large allocation based on the "clean number" is overruled by the Weight Cap. You participate to learn (gain Weight), not to earn return.

  #### Case (c): The Legacy Core Allocation (Rolled over for years)
  *   **Phase 1 (Provenance):** **Fail.** Why do we own this? "It's never given us a reason to stop." This is not a reference class; it is inertia.
  *   **Phase 2 (Weight):** **Ambiguous.** You have 10 years of data ($W=5$), *but* is that data relevant to the *current* regime? If the market structure has changed, the Weight of *relevant* evidence drops to $W=2$.
  *   **Phase 3 (Sizing):** If $W$ is downgraded to 2 due to regime change, the Position Size Cap drops to 40% of current holdings.
  *   **Phase 4 (Convention):** **Self-Deception Alert.** The memo admits you are holding because of convention ("future looks like the past").
  *   **Verdict:** **Values Call.** The procedure forces you to admit you are not making an investment decision; you are making a habit.
      *   *The Hard Question:* "Are we holding this because it is the best use of capital, or because selling it requires work we don't want to do?"
      *   *Outcome:* You must either re-underwrite the thesis (find new Reference Class evidence) or reduce the position to the Weighted Cap. If you cannot articulate *why* it works now, you must treat it as Case (b).

  ---

  ### What This Procedure Cannot Do

  You asked for plain speech on the limitations.

  1.  **It Cannot Predict Regime Changes:** Keynes's Weight measures *past* evidence. It does not predict when the past stops being relevant. If the Legacy Fund (Case C) blows up because of a black swan, the procedure won't stop it, but it will ensure you weren't over-sized when it happened.
  2.  **It Cannot Eliminate Disagreement:** Two committee members may score Weight differently. One sees 15 years of data ($W=5$); another sees 15 years of data in a zero-interest environment that no longer exists ($W=2$). The procedure forces you to argue about *Weight*, which is more productive than arguing about *Probability*, but it doesn't solve the dispute.
  3.  **It Cannot Satisfy a Board That Demands Certainty:** When you hold cash because $W$ is low, the board will still call it "drag." You can explain the logic, but you cannot make them like the feeling of uninvested capital.
  4.  **It Requires Discipline to Downgrade "Beautiful" Numbers:** Your committee loves clean models. This procedure tells you to distrust them. The hardest part isn't the math; it's the psychological discipline to assign a low Weight to a compelling narrative.

  ### Summary for the Committee
  Adopt this motion: *"No memo shall be voted on without a designated Weight Score ($W$). Position size limits are hard-capped by $W$. If Provenance is 'Model Output', Probability is capped at 60%."*

  This shifts your culture from "Who has the best forecast?" to "Who has the most evidence?" That is the only edge a small endowment has.
