answer: |-
  Here are nine questions designed to press the guest on the specific philosophical commitments underlying her extrinsic defense of AC, with follow-ups keyed to her predicted responses.

  **1. The Banach–Tarski "Measurement Problem"**
  You argue that Banach–Tarski isn't a genuine paradox because the decomposition pieces are non-definable; we can prove they exist, but we can't exhibit them or cut along them. But this defense seems to rely on the reals *not* having a definable well-ordering. If we assume $V=L$, there is a $\Delta^1_2$ definable well-ordering of the reals, which yields definable non-measurable sets. In that context, the pieces *are* definable. So, is your comfort with Banach–Tarski secretly a bet against $V=L$? And if so, are you accepting AC only on the condition that the universe is "wide" enough to hide the monsters?

  *   **Follow-up:** She will likely reply that $V=L$ is too restrictive and most set theorists reject it. Press her: "If your justification for AC depends on the universe *not* being $V=L$, then you aren't justifying AC alone; you're justifying AC + 'there are non-constructible reals.' Why does the extrinsic case for AC get a free pass while the extrinsic case for large cardinals (which also kill $V=L$) is treated as a separate, harder sell?"

  **2. The Hierarchy of Monsters**
  You claim that denying AC doesn't buy us a tamer universe, just different monsters—like infinite Dedekind-finite sets of reals, or the reals being a countable union of countable sets. But these aren't just "different"; they break specific tools analysts use. What is the metric you're using to weigh these pathologies? Is there a principled reason why a Banach–Tarski decomposition is philosophically cheaper than a Dedekind-finite set of reals, or does it just come down to which tools you personally want to keep in the toolbox?

  *   **Follow-up:** She will likely argue that ZF pathologies are more disruptive to "mainstream" mathematics. Push back: "But 'mainstream' mathematics is largely analysis and algebra, which mostly need Dependent Choice or the Ultrafilter Lemma. The real monsters of ZF only appear if you strip choice away entirely. Why should the fact that *total* denial of AC is messy count as an argument for *full* AC, rather than just a moderate amount of choice?"

  **3. Indispensability Overkill**
  Your indispensability argument rests on the utility of AC for mainstream math. But most of the heavy lifting—Hahn–Banach, Baire Category, existence of nonprincipal ultrafilters—follows from the Boolean Prime Ideal Theorem or Dependent Choice, both strictly weaker than AC. The things that require *full* AC are often the extravagant ones: well-ordering the reals, bases for arbitrary vector spaces. Why isn't the extrinsic justification a stronger argument for a weaker system like ZF+DC? Why pay the ontological cost of well-ordering the continuum if the analysts don't need it?

  *   **Follow-up:** She will likely cite "uniformity" and not wanting to check which theorems need how much choice. Counter: "Uniformity is a convenience for the prover, not necessarily a truth about the objects. Are you arguing that the universe *is* uniform, or just that it's annoying to work in one that isn't? If it's the latter, isn't that a pragmatic argument for a formal system, not a philosophical argument for the truth of AC?"

  **4. The Solovay Alternative**
  In Solovay's model, assuming an inaccessible cardinal, Dependent Choice holds and every set of reals is Lebesgue measurable, has the Baire property, and the perfect set property. Banach–Tarski for reals is simply false there. You might object that Solovay's model requires an inaccessible while ZFC doesn't. But does that mean you accept AC partly because it's the "low-cost" option? If consistency strength were free, would you still prefer ZFC over a universe where all sets of reals are measurable?

  *   **Follow-up:** She will likely say that inaccessibles are a heavy price and ZFC is the "base" theory. Press: "So ZFC is the default because it's cheap? That sounds like AC is the budget axiom. If we discovered tomorrow that ZFC required an inaccessible but ZF+DC didn't, would you switch sides? If not, then the consistency strength isn't the real reason; you actually prefer the consequences of AC."

  **5. Extrinsic Justification and $V=L$**
  You defend AC on extrinsic grounds: it's fruitful and generates a rich theory. But $V=L$ (the Axiom of Constructibility) is even more fruitful in some ways: it settles CH, gives a definable well-ordering, and simplifies combinatorics. Many set theorists reject $V=L$ because it restricts the universe too much. But if extrinsic fruitfulness is the metric, why does $V=L$ fail? At what point does "fruitful" become "too restrictive," and who decides where that line is?

  *   **Follow-up:** She will likely argue $V=L$ is "false" because it limits the height of the universe or contradicts large cardinals. Push: "But that's an *intrinsic* argument about the concept of set, which you said doesn't yield AC. If you're allowed to use intrinsic intuitions to rule out $V=L$, why aren't you allowed to use intrinsic intuitions to rule out AC? You can't have it both ways: either we judge axioms by their consequences, or by the iterative conception, but you're mixing them to get ZFC."

  **6. Extrinsic Justification and Determinacy**
  On the other end, the Axiom of Determinacy (AD) implies that all sets of reals are regular (measurable, etc.) and settles many questions ZFC leaves open. You call it a "curiosity confined to a corner." But for the study of the reals specifically, AD is arguably more "fruitful" and "uniform" than AC. Is your rejection of AD just because it contradicts AC, or is there an extrinsic reason why the "corner" of the universe containing the reals shouldn't be governed by Determinacy?

  *   **Follow-up:** She will likely say AD contradicts AC and we need AC for the whole universe. Counter: "So AC is the 'king' axiom that trumps local regularity of the reals? This suggests your commitment isn't to fruitfulness per se, but to ZFC as a specific package. If AD turned out to be more fruitful for 90% of mathematics, would you keep AC for the sake of the other 10%? It sounds like ZFC is the goal, and extrinsic justification is the post-hoc rationalization."

  **7. Falsifiability and Evidence Against**
  If your position is justified wholly by fruitfulness and convenience, it should be revisable. What would count as evidence *against* AC? If tomorrow someone showed that AC implies a contradiction in arithmetic, you'd drop it, obviously. But short of inconsistency, is there any mathematical discovery that would make you say, "Okay, AC is too costly, we should weaken it"? Or is the position immune to revision as long as ZFC remains consistent?

  *   **Follow-up:** She will likely say, "It hasn't failed us yet." Press: "That's not a condition for failure, that's a lack of success. If a position admits no evidence counts against it short of outright contradiction, isn't it dogmatic? A pragmatic justification requires that the pragmatism could, in principle, run out. Are you saying the utility of AC is infinite?"

  **8. Choice and Classical Logic**
  In constructive and categorical settings, adding a choice principle often entails the Law of Excluded Middle (Diaconescu's theorem). This suggests AC isn't just an innocent existence claim; it carries heavy logical strength that collapses intuitionistic logic to classical logic. Given that you defend AC as "intuitive" or "innocent," how do you reconcile this with the fact that it forces a specific, strong logic on us? Does this suggest AC is actually a logical axiom in disguise, and if so, shouldn't we be even more careful about adopting it?

  *   **Follow-up:** She will likely say, "We work in classical logic anyway." Counter: "But *why*? If AC is what *buys* you classical logic in a neutral setting, then arguing for AC because 'we use classical logic' is circular. You're using the consequence of AC to justify AC. Shouldn't the fact that AC dictates the logic make us more suspicious of its 'innocence'?"

  **9. The Sociological Deflection**
  Finally, you've mentioned that mainstream mathematics is already committed to AC, so philosophical scruples come too late. This sounds like a sociological fact: ZFC is the dialect the profession happens to speak. But this podcast is about the *philosophy* of math. Is your position ultimately that AC is *true*, or just that it's the *lingua franca*? If it's just the lingua franca, why should philosophers treat it as a discovery about sets rather than a convention of the guild?

  *   **Follow-up:** She will likely try to say it's both: it's the convention *because* it works. Press: "That's the deflection I expected. But 'works' for whom? If the analysts in my audience think this is a waste of time, and the constructivists think it's false, and the large cardinal theorists think it's too weak... 'Working' is doing a lot of heavy lifting here. I need you to say it plainly: If the profession switched to ZF+DC tomorrow, would you say they were *wrong*, or just speaking a different dialect? If they're not wrong, then AC isn't true, it's just policy."
