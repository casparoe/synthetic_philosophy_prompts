answer: |-
  ### Rejected Design Sketches

  1.  **Lecture-First Proof Reconstruction:** I would begin with a whiteboard derivation of the strategy-stealing argument, then assign games as "verification exercises."
      *   *Rejection:* This violates the core pedagogical goal; students would treat the games as mere illustrations of a truth they were already told, rather than data sources for a truth they must construct.
  2.  **Single-Game Tournament:** We would play a single-elimination 5×5 Hex tournament, and I would reveal the paradox only after the winner is crowned.
      *   *Rejection:* This prioritizes competitive skill over structural analysis; strong players would win by heuristics, masking the logical necessity that *no* strategy can guarantee a P2 win.
  3.  **Abstract Logic Sheets:** Students would receive printed game trees and mark "winning" or "losing" nodes without moving physical pieces.
      *   *Rejection:* This removes the tactile friction of the "occupied cell" problem; the physical impossibility of placing a stone where one already sits is crucial for intuiting the non-constructive nature of the proof.

  ***

  ### Recommended Session Design: "The Phantom Move"

  **Session Title:** Existence Without Construction
  **Duration:** 90 Minutes
  **Participants:** 16 (8 pairs)
  **Materials:**
  *   8 packets per pair (printed on A4):
      *   Sheet A: 3×3 Tic-Tac-Toe grids (x6).
      *   Sheet B: 5×5 Hex boards (x4).
      *   Sheet C: Complete Graph $K_6$ (dots in a hexagon, all edges drawn) (x4).
      *   Sheet D: Handicap Hex boards (x2).
  *   Red and Blue pens (one set per pair).
  *   **The Truth Ledger:** A single printed table per student with 4 rows (one per round) and columns for *Prediction (P1/P2/Draw)*, *Outcome*, *Points*.
  *   Whiteboard for final tally.

  **Scoring Scheme (The Truth Ledger):**
  Students do not score points for winning games. They score points for **predicting the structural outcome** before play begins.
  *   Correct Prediction: +2 points.
  *   Incorrect Prediction: 0 points.
  *   *Rationale:* This forces them to bet on the *mathematical properties* of the game (symmetry, draw-possibility, move-value) rather than their skill at playing.

  ---

  ### Timeline & Procedure

  #### 0:00–0:05 | Setup & The Ledger
  Distribute materials. Do not mention "strategy stealing," "proof," or "existence."
  **Instruction:** "You are testers for a game theory firm. Your job is not to win, but to categorize the games. Before each round, mark your Ledger: Will Player 1 win, Player 2 win, or is a Draw possible? You will play three matches per round. If your prediction matches the aggregate result, you earn points."

  #### 0:05–0:20 | Round 1: The Draw Possibility (Tic-Tac-Toe)
  **Game:** Standard 3×3 Tic-Tac-Toe.
  **Task:** Play 3 matches. Swap who is P1.
  **The Trap:** Most students know P1 can force a draw, but rarely a win against optimal play.
  **Expected Ledger Entry:** Most will mark "Draw" or "P1 Win."
  **Philosophical Hook:** An extra move (P1's first stone) does not hurt, but it does not guarantee a win because the game admits a draw. Stealing guarantees *non-loss*, not victory.

  #### 0:20–0:45 | Round 2: The Main Event (5×5 Hex) & The Drill
  **Game:** 5×5 Hex. No swap rule. P1 connects top-bottom; P2 connects left-right.
  **Task:** Play 2 matches.
  **The Physical Drill (Minute 35):** Stop play.
  **Instruction:** "Pause. P2 players, take a red pen. P1, place one stone anywhere. P2, pretend that stone is *yours*. You are now the First Player with an extra stone on the board. Write down where your *next* move would be to win."
  **The Collision:** Inevitably, some P2s will write down a coordinate that P1 just occupied.
  **Instruction:** "If your winning move is where the dummy stone sits, you must play elsewhere. Does your strategy still work?"
  **Task:** Resume play for 1 more match.
  **Expected Ledger Entry:** "P1 Win." (Since Hex cannot end in a draw, and SSA proves P1 cannot lose).
  **Philosophical Hook:** The extra stone is harmless (monotonicity). The game cannot draw. Therefore, P1 must win. But the drill shows you don't know *how*.

  #### 0:45–1:05 | Round 3: The Liability (Sim / Ramsey Game)
  **Game:** Play on the printed $K_6$. Players alternately claim edges in their colour.
  **Loss Condition:** You lose if you complete a triangle of your own colour. (This is the game *Sim*, equivalent to avoiding a monochromatic $K_3$).
  **Note:** By Ramsey's Theorem ($R(3,3)=6$), a draw is impossible.
  **Task:** Play 3 matches.
  **Expected Ledger Entry:** Many will guess "P1 Win" by habit from Hex.
  **Reality:** An extra edge here is a **liability**. It brings you closer to completing a triangle. SSA fails because the "extra move never hurts" premise is false.
  **Philosophical Hook:** Stealing requires monotonicity. Here, more is less.

  #### 1:05–1:20 | Round 4: The Symmetry Break (Handicap Hex)
  **Game:** 5×5 Hex with special rules.
  **Variant A (2 matches):** P2 has a **Bolt**. Once per game, P2 may place two stones in one turn. P1 has no Bolt.
  **Variant B (1 match):** **Double Bolt**. Both players may place two stones once per game.
  **Task:** Predict the winner on the Ledger before playing.
  **Expected Ledger Entry:**
  *   Variant A: Students often guess "P2 Win" (extra move = advantage).
  *   Variant B: Students often guess "P1 Win" (first move advantage).
  **Philosophical Hook:** SSA relies on role symmetry. If P2 has a tool P1 lacks (Variant A), P1 cannot steal the strategy perfectly. If both have it (Variant B), symmetry is restored.

  #### 1:20–1:30 | Debrief & Closing
  **Step 1: The Tally.** Collect Ledger scores. Reveal the "Correct" structural outcomes.
  **Step 2: Mapping Premises.** Draw three columns on the board: *No Draws*, *Extra Move Harmless*, *Symmetry*. Check them off for each round.
  *   TTT: Harmless? Yes. Symmetry? Yes. No Draws? **No**. (Result: P1 cannot lose, but might draw).
  *   Hex: Harmless? Yes. Symmetry? Yes. No Draws? **Yes**. (Result: P1 Win).
  *   Sim: Harmless? **No**. Symmetry? Yes. No Draws? Yes. (Result: SSA fails).
  *   Handicap A: Harmless? Yes. Symmetry? **No**. (Result: SSA fails).
  **Step 3: The Friend's Claim.** Address the late-night argument directly.

  ---

  ### Analyst's Notes for the Instructor

  #### 1. The Handicap Hex Analysis (For your preparation)
  You asked for explicit reasoning on the Handicap variants to guide the debrief.

  *   **Variant A (P2 has the Bolt):**
      *   **Does SSA Survive?** **No.**
      *   **Reasoning:** SSA requires P1 to pass, become P2, and steal P2's strategy. If P2's winning strategy relies on using the Bolt (playing two stones at once), P1 (now acting as P2) cannot execute that move because P1 does not possess the Bolt. The roles are no longer interchangeable.
      *   **Student Pitfall:** They will predict P2 wins simply because "more moves." While P2 *might* win, SSA does not prove it. Conversely, they might think P1 still wins by SSA; you must correct that the asymmetry breaks the steal.
      *   **Actual Outcome:** Likely P2 win due to raw advantage, but *not provable by SSA*.

  *   **Variant B (Both have the Bolt):**
      *   **Does SSA Survive?** **Yes.**
      *   **Reasoning:** Symmetry is restored. P1 passes. P1 is now P2. P2 has a Bolt. P1 (as P2) also has a Bolt. P1 can steal any strategy P2 employs.
      *   **Student Pitfall:** They will focus on the Bolt as a "power-up" and miss that the *availability* is what matters for the proof, not the move itself.
      *   **Actual Outcome:** P1 Win (by SSA).

  #### 2. The Physical Drill (Round 2)
  This is the critical moment. When a student writes down a move that is already occupied by the "dummy" stone:
  *   **Do not solve it for them.** Ask: "If that spot is taken, is your strategy broken?"
  *   **The Insight:** In Hex, an extra stone is never a liability. If the strategy says "play here" and "here" is already filled by your own colour, you are *ahead* of schedule. You can play anywhere else.
  *   **The Gap:** This highlights the **non-constructive** nature. They know they *can* win, but the "occupied cell" moment shows they don't have a deterministic algorithm for *which* cell to pick instead without analyzing the whole board. This is the "existence without computation" gap.

  #### 3. Predictable Pitfalls
  *   **Skill vs. Strategy:** In Round 3 (Sim), a strong player might win as P2 simply by skill, leading the group to think "P2 wins." You must intervene: "Did P2 win because of the game structure, or because Alice is better at triangles?" Remind them of the Ledger: they are betting on *structure*.
  *   **Induction from Samples:** Students will say, "P1 won all 3 Hex games, so P1 must win." You must counter: "You played 3 games. SSA proves it for *all* possible games. Your sample size is anecdotal; the argument is universal."
  *   **The "Draw" Confusion:** In TTT, if P1 wins a game due to a P2 blunder, students may mark "P1 Win" on the ledger. Remind them: "We are asking about optimal play. Is a draw *possible*?"

  #### 4. Limitations to Supply Yourself
  The activity cannot reproduce two key mathematical facts; you must state these in the debrief:
  1.  **Hex Cannot Draw:** The students play 5×5. They might not encounter a draw, but they haven't *proved* one is impossible. You must supply the topological argument (Brouwer fixed-point/chain argument) as the missing premise that turns "P1 cannot lose" into "P1 must win."
  2.  **Generality:** They played 5×5. SSA applies to $N \times N$. You must explicitly generalize the finding: "The board size didn't matter. The logic holds for 100×100."

  #### 5. Closing Move (The Friend's Claim)
  End the session by returning to your friend's argument.
  **Script:** "My friend claimed that in any race, the follower can steal the leader's playbook plus one free move. Tonight you found three reasons she is wrong.
  1.  **Draws:** In Tic-Tac-Toe, stealing guarantees you don't lose, but not that you win.
  2.  **Liability:** In Sim, an extra move brings you closer to defeat; you cannot steal a strategy that kills you.
  3.  **Symmetry:** In Handicap Hex, if the leader has a tool the follower lacks, the playbook cannot be copied.
  The Strategy-Stealing Argument is not a universal law of competition. It is a fragile logical machine that only runs when the board is symmetric, the extra move is free, and a draw is impossible. It gives you a promise of victory, but hands you no map to find it."

  ---

  ### Contingency: The 60-Minute Cut
  If we are down to one hour, **cut Round 4 (Handicap Hex).**
  *   **Reasoning:** Round 1 (TTT) establishes the "Draw" premise. Round 2 (Hex) establishes the "No Draw + Harmless Move" premise. Round 3 (Sim) establishes the "Harmful Move" premise. These three form the complete logical trinity required to refute your friend's sweeping claim.
  *   **Impact:** Round 4 tests "Symmetry," which is important, but the asymmetry of the Bolt is harder to explain quickly than the asymmetry of "move value" in Sim. Sim is more visceral (completing a triangle = death).
  *   **Adjustment:** Reduce Round 2 to 2 matches total (1 normal, 1 with Drill) to save 5 minutes. Use the saved time for a richer debrief on the Friend's Claim.
