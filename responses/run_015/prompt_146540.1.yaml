answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigators, Project [ID Number/Name]
  **FROM:** Departmental Research Ethics Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Review Decision Regarding Proposal on Moral Blame Attribution

  **1. Overview of Review**

  The Departmental Research Ethics Panel has completed its review of the proposed study titled "Framing Effects on Victim-Blaming Attributions." We understand the methodological rationale for concealing the true hypothesis from participants during the active phase of the experiment. However, the proposed protocol relies on describing the task to subjects as a study on "reading comprehension strategies," while the actual measurement concerns moral judgment and blame attribution.

  Following a deliberative session, the Panel has identified significant ethical tensions regarding the informed consent process. This memo outlines the Panel's reasoning, introduces a key ethical framework for your revision, and states our final decision.

  **2. Ethical Analysis: Deception and Autonomy**

  A division emerged within the Panel regarding the nature of the proposed deception. One view held that describing the study as "reading comprehension" is misleading but not technically a falsehood, and that the immediate debriefing cures any ethical deficit. The opposing view argued that for the purposes of informed consent, the distinction between "misleading" and "lying" is moot.

  The Panel ultimately sides with the latter interpretation. The ethical core of informed consent is not merely the avoidance of factual falsehoods, but the preservation of participant autonomy. Autonomy is compromised whenever a participant is denied information that would materially affect their decision to participate. If a subject would decline to participate in a study about *victim-blaming* but agrees to a study about *reading comprehension*, their consent is not valid, regardless of whether the researcher uttered a literal lie. Withholding the normative nature of the task treats the participant as a means to an end, rather than an agent capable of authorizing the use of their data.

  Consequently, the argument that post-study debriefing rectifies the initial violation is insufficient. While debriefing is necessary, it cannot retroactively authorize an action that was unauthorized at the time it occurred.

  **3. The Requirement of Authoritative Disclosure**

  In evaluating this proposal, the Panel is applying a standard we term **Authoritative Disclosure**. This concept posits that valid consent requires more than the absence of falsehoods; it requires the active presentation of the study's normative stakes.

  In medical ethics, this often pertains to disclosing risks and the nature of interventions. In social science research involving moral psychology, Authoritative Disclosure requires that participants understand the *moral context* of their engagement, even if the specific hypothesis remains concealed. Participants must be made aware that they are engaging in tasks that involve social judgment, moral evaluation, or sensitive interpersonal scenarios.

  To claim a study is about "reading comprehension" when it is actually about "moral blame" fails this standard. It obscures the normative weight of the activity. A participant might be comfortable analyzing sentence structure but uncomfortable analyzing scenarios involving sexual assault or negligence. By hiding the moral nature of the content, the current protocol denies participants the authority to decide if they wish to engage in moral evaluation.

  **4. Panel Decision: Approval with Conditions**

  The Panel recognizes the scientific value of this research and acknowledges that full disclosure of the hypothesis prior to participation would invalidate the data. Therefore, we are not rejecting the proposal. However, we cannot approve the protocol as currently written.

  **Decision: Approved with Mandatory Modifications.**

  The study may proceed only if the Principal Investigators implement the following conditions to align the protocol with the principles of autonomy and Authoritative Disclosure:

  **A. Revision of the Consent Narrative (The "Masked" Consent)**
  You may not fully disclose the hypothesis, but you may not categorize the task as "reading comprehension." The consent form must accurately describe the *activity*, if not the *purpose*.
  *   *Requirement:* The consent form must state that the study involves "evaluating scenarios and making judgments about individuals." This satisfies Authoritative Disclosure by informing the participant of the normative nature of the task without revealing the specific variables being manipulated.

  **B. Justification of Necessity**
  *   *Requirement:* You must submit a brief addendum explicitly arguing why less deceptive methods (e.g., role-playing, hypothetical consent, or partial disclosure) are methodologically insufficient. The burden of proof lies with the researchers to demonstrate that deception is the *only* viable path to valid data.

  **C. Enhanced Debriefing and Data Withdrawal**
  Because the initial consent was necessarily limited, the debriefing process must be robust enough to restore the participant's agency.
  *   *Requirement:* The debriefing must explain not only the true purpose but also the *societal importance* of the research (addressing the normative stakes).
  *   *Requirement:* Participants must be given a meaningful opportunity to withdraw their data *after* the deception is revealed. This cannot be a perfunctory offer. They must be reminded that their data will be destroyed if they choose, with no penalty. This functions as a "retroactive consent" mechanism.

  **D. Risk Mitigation**
  *   *Requirement:* Given the subject matter (victim-blaming), materials may induce distress or moral discomfort. You must provide a list of support resources in the debriefing packet and ensure the researcher is trained to handle adverse emotional reactions during the disclosure phase.

  **5. Conclusion**

  The Panel's concern is not with the use of deception per se, but with the erosion of the participant's status as a moral agent. By shifting the description from "reading comprehension" to "scenario evaluation," and by strengthening the debriefing process, you can maintain methodological rigor while respecting the requirement for Authoritative Disclosure.

  Please submit the revised consent forms and the necessity justification addendum within fourteen days. Upon receipt, the Panel Chair will issue final clearance.

  Sincerely,

  The Departmental Research Ethics Panel
