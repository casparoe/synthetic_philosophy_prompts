  Which claim is doing the actual persuasive work?
  It is almost certainly the third claim: **"Since no perfect system exists, there is no principled reason to prefer one imperfect system over another."** This is a classic instance of the **Nirvana Fallacy** (or Perfect Solution Fallacy). Mark is smuggling in a normative premise that unless a system is mathematically perfect, improvements are meaningless. The first claim (the actual theorem) is too technical to persuade on its own; it's the inference to indifference that does the heavy lifting.

  What is the most devastating thing you can say?
  You don't need to teach social choice theory; you just need to invoke the **Theory of Second Best**. You can say:

  > "Mark, Arrow proves perfection is impossible, not that improvement is. By that logic, we shouldn't bother fixing a leaky roof because we can't build a house that lasts forever. Plurality voting fails specific criteria—like preventing vote-splitting—that Ranked Choice handles better. Just because RCV isn't mathematically perfect doesn't mean it isn't *better* than what we have now. We aren't choosing between a perfect system and a flawed one; we're choosing between two flawed ones, and one works better for us."
