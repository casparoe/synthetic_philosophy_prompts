answer: |-
  **Translations and Residue Reports**

  **Transcendent Realism** maps to **Declared Kinds**. The intension (schema definition) is the primary entity; the extension (records) is contingent. A kind exists because it is declared, regardless of instantiation.
  *Residue:* Clean on intension/extension distinction. Smuggles "existence" as schema-validity rather than ontological status. Fails to capture "independence from mind," since a declared kind requires a data owner's assertion.

  **Immanent Realism** maps to **Derived Kinds** with non-empty extensions. The universal is the predicate logic instantiated in every matching record. It exists only if the query returns data.
  *Residue:* Smuggles "wholly present." In the registry, a value is stored once or referenced; it is not "located" in multiple records simultaneously unless co-ticketed. The "unity" of the universal is just the shared predicate ID, not a multiply-located entity.

  **Class Nominalism** maps to **Extensions** alone. A kind is strictly the set of record IDs satisfying a condition. Intensions are merely compression algorithms for listing tokens.
  *Residue:* Cleanest translation. Ignores *why* records are grouped. Collapses distinct derived kinds with co-extensive predicates into identity, which the registry distinguishes by definition ID.

  **Resemblance Nominalism** maps to **Aspect Value Clustering**. Records are grouped because they share filler values on specific aspects (e.g., COLOR = "red"). No kind node is required, only similarity metrics.
  *Residue:* Smuggles "resemblance." In the registry, resemblance is computed via equality checks on aspect fillers. It cannot distinguish natural joints from gerrymanders without external modality (necessary vs. contingent aspects).

  **Trope Theory** maps to **Reified Aspect Occurrences**. Each slot filling is a unique node (token). A record is a bundle of these aspect-nodes linked by identity-bearing aspects.
  *Residue:* Very clean fit for reified aspects. Struggles slightly with "bundle theory" if the record ID itself is considered a substance rather than just another trope ID, but the registry allows records to be nothing but connectors for aspect nodes.

  **Case Studies**

  1.  **Empty Kinds:** Transcendent Realism validates **RADIATION-SPILL-INCIDENT** (Declared) as real; Immanent Realism rejects it (no instances). Class Nominalism accepts both as empty sets. The registry validates both schemas equally. *Disagreement:* Ontological status of empty intensions. *Agreement:* Operational validity.
  2.  **Co-extensive Derived Kinds:** Class Nominalism asserts identity (same records = same kind). Realisms assert distinctness (different predicates = different universals). The registry enforces distinctness via definition IDs. *Disagreement:* Whether intension defines identity. *Agreement:* Query results are identical.
  3.  **Repeated Aspects/Co-tickets:** Trope Theory sees two distinct color-tropes. Realism sees one universal manifested twice, or two instances linked by identity. The registry sees two aspect occurrences linked by a co-ticket assertion. *Disagreement:* Whether the link is discovered (Realism) or stipulated (Registry/Trope). *Agreement:* Structural topology is identical.
  4.  **Kinds-as-Records:** The registry handles reflection cleanly (a kind is a record typed as "Kind"). Metaphysical positions stumble over type/token confusion (is the kind an instance of itself?). *Disagreement:* Category errors. *Agreement:* None; this is a modeling feature metaphysics lacks.

  **Verdict**

  Your suspicion is correct: the registry is metaphysically neutral because it tracks **assertions** (declared kinds, co-tickets) and **computations** (derived kinds), not truth-makers. It records *that* a classification exists, not *why* it is correct.

  Your guess about missing primitives is largely right, but requires sharpening.
  1.  **Modality:** You lack **necessary vs. contingent aspects**. Identity-bearing aspects approximate necessity, but only for linkage, not ontology. You cannot distinguish a "natural joint" (sparse property) from a "gerrymander" (abundant property) because both are just predicates.
  2.  **Causation/Explanation:** You have no primitive for **grounding**. You can assert a co-ticket, but you cannot store *why* the aspects are identical (e.g., "same physical patch" vs. "data entry error").
  3.  **Location:** You lack spatial topology. "Wholly present" dissolves because your "location" is storage addresses, not physical space.

  **The Harder Thing**

  Which parts of the dispute dissolve due to vocabulary deficiency, and which due to claim clarity?

  **Vocabulary Deficiency:** The dispute over **Immanent Realism** ("wholly present") dissolves. Your vocabulary has no concept of non-spatial location. Without a substrate where one thing can be in two places without being copied, "multiply located unity" is unintelligible. It becomes either "shared reference" (pointer) or "copies" (value), neither of which captures the metaphysical claim.

  **Claim Clarity:** The dispute over **Class Nominalism vs. Realism** regarding co-extensive kinds reveals the metaphysical claim was often about **utility**, not ontology. When Realists insist co-extensive kinds are distinct, they often mean "useful for different explanations." Your registry captures this by keeping definition IDs distinct even if extensions match. The metaphysical "distinctness" translates cleanly to "different intensions," suggesting the dispute was never about existence, but about **explanatory power**—which, again, your system lacks primitives to store.

  The registry does not solve the problem of universals; it operationalizes the **administration** of universals. It treats universals as managed resources (schemas) rather than discovered entities. The "residue" you feel is the gap between managing a classification and explaining why the classification cuts reality at the joints. Your system captures the cut; it cannot capture the joint.
