  ### Part 4: Margin Comments & Feedback

  **General Comment:**
  You write with confidence and fluency, but in upper-level metaphysics, confident prose cannot substitute for argumentative precision. You have ignored several explicit stipulations in the question (regarding A/B theory and singular propositions) and made fundamental category errors regarding ontology. You have treated philosophical tensions as settled facts.

  **Specific Margin Comments:**

  > **"So presentism is the A-theory of time... while eternalism is the B-theory"**
  > *   **Problem:** Conflation of two things the question asks to be kept apart.
  > *   **Cost:** 1 mark (deducted in part c).
  > *   **Note:** The question explicitly stated: "presentism is not to be identified with the A-theory." This is a definitional error within the context of this exam. Presentism is an ontological thesis (what exists); A-Theory is a thesis about passage (dynamic vs. static). One can consistently hold a B-Theoretic Presentism.

  > **"...eternalism is in effect the same view as four-dimensionalism"**
  > *   **Problem:** Term used in the wrong sense / Conflation.
  > *   **Cost:** Implicit penalty in conceptual clarity.
  > *   **Note:** Eternalism concerns *times*; Four-Dimensionalism concerns *object persistence*. They are independent theses. The question warned you of this ("four-dimensionalism... is a further thesis again").

  > **"I think this solves the grounding objection completely."**
  > *   **Problem:** Overstatement of a modest claim.
  > *   **Cost:** 2 marks (deducted in part a).
  > *   **Note:** You provide no argument for *why* it solves it, only an assertion. A complete answer must address whether present traces can ground truths about *non-existent* relata.

  > **"Be careful to distinguish singular propositions... from general or qualitative ones."** (Prompt Instruction)
  > *   **Problem:** Instruction ignored.
  > *   **Cost:** 2 marks (deducted in part a).
  > *   **Note:** You mention Churchill but do not explain how a present fossil grounds the truth about *that specific individual* versus *some* individual. This is the core of the grounding problem for singular propositions.

  > **"they stand in the right causal and historical relations to Churchill's cigar-smokings."**
  > *   **Problem:** Step that does not follow / Question Begging.
  > *   **Cost:** Included in part (a) assessment penalty.
  > *   **Note:** If Churchill does not exist (as Presentism claims), he cannot be a relatum in a causal relation. You are assuming the past exists to prove the past is grounded.

  > **"a stored past is an existing past."**
  > *   **Problem:** Category mistake (Representation vs. Represented).
  > *   **Cost:** 2 marks (deducted in part b).
  > *   **Note:** A photograph of a person is not the person. A trace of an event is not the event. Growing Block theory claims the *event* exists; Archival Presentism claims the *trace* exists. These are ontologically distinct.

  > **"That is just the growing block theory with the block redescribed in terms of traces"**
  > *   **Problem:** Violation of authoritative definitions.
  > *   **Cost:** 2 marks (deducted in part b).
  > *   **Note:** You are penalized for arguing against the stipulated definitions. Growing Block = Past entities exist. Archival Presentism = Only present entities exist. They cannot be the same view by definition.

  > **"Finally, the relativity objection settles the whole dispute."**
  > *   **Problem:** Overstatement.
  > *   **Cost:** 1 mark (deducted in part c).
  > *   **Note:** Physics constrains metaphysics, but rarely "settles" ontological disputes definitively. Metaphysical interpretations of SR (e.g., Neo-Lorentzianism) remain live options.

  > **"not a move a philosopher is entitled to make."**
  > *   **Problem:** Defensible but under-argued / Dogmatism.
  > *   **Cost:** 1 mark (deducted in part c).
  > *   **Note:** You dismiss the Neo-Lorentzian reply without argument. Many philosophers argue that metaphysical privilege need not be empirically detectable. You need to argue *why* this is illegitimate, not just assert it.

  **Summary of Credit:**
  *   You correctly defined the core ontological claims of Presentism and Eternalism in your first sentence.
  *   You accurately summarized the intuitive force of both the Grounding and Relativity objections.
  *   You identified the correct Presentist reply to Relativity (privileged foliation), even if you dismissed it too quickly.

  **Verdict:**
  This is a failing mark (8/20). While you demonstrate familiarity with the terminology, you have failed to adhere to the logical constraints of the question and have conflated distinct metaphysical categories that the course explicitly distinguished. In upper-level philosophy, reading the question precisely and respecting conceptual distinctions is as important as constructing arguments.
