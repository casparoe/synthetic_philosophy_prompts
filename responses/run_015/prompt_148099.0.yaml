      DEPARTMENT OF BULK MATERIAL CLASSIFICATION
      INTERNAL OPERATIONAL CIRCULAR 44.2
      TO: All Regional Assessors, Import Division, Insurance Liaison Committee
      FROM: Office of Standards and Definitions
      DATE: 14 October 2023
      SUBJECT: Operational Definition of Class-H (Heap) Materials

      1.0 PURPOSE
      Pursuant to the Tariff Act of 1984, shipments classified as Class-H (Heap) are subject to a differentiated ad valorem rate. This Circular establishes the procedural framework for determining when a collection of discrete granular units constitutes a Heap.

      2.0 THE PRINCIPLE OF INSENSIBLE CHANGE
      2.1 Assessors shall adhere to the Principle of Insensible Change (PIC). Under the PIC, the addition or subtraction of a single granular unit to a collection classified as a Heap shall not alter said classification.
      2.2 Conversely, the addition or subtraction of a single unit to a collection classified as Non-Heap shall not alter said classification.
      2.3 This principle is binding for all incremental assessments conducted during physical inspection.

      3.0 BASE CASE PROVISION
      3.1 Notwithstanding Section 2.0, an empty warehouse (zero units) shall not be classified as a Heap.
      3.2 Assessors are prohibited from applying the Principle of Insensible Change in reverse iteration from a known Heap to an empty set. This practice, termed Retrogressive Accumulation, is administratively void.
      3.3 Any assessment resulting in the classification of zero grains as a Heap shall be flagged for immediate clerical review.

      4.0 THRESHOLD DETERMINATION
      4.1 To ensure consistency, Schedule A establishes the definitive threshold for Class-H status.
      4.2 A collection comprising 10,453 grains or more is a Heap. A collection comprising 10,452 grains or fewer is a Non-Heap.
      4.3 The Department asserts there is a fact of the matter regarding this boundary. Queries regarding the derivation of the integer 10,453 should be directed to Annex C (Deferred Indefinitely).

      5.0 ADMISSIBLE PRECISIFICATIONS
      5.1 In instances where grain count is unavailable, Assessors may employ multiple interpretive standards (Precisifications).
      5.2 Under Circular 44.1, a shipment qualified as a Heap only if it qualified under every admissible Precisification.
      5.3 Review indicated that under this rule, 0% of shipments qualified.
      5.4 Effective immediately, admissible Precisifications are restricted to those listed in Schedule B-Rev. Any Precisification suggesting a threshold above 15,000 grains is deemed inadmissible for tariff purposes.

      6.0 GRADATED STATUS AND SURCHARGES
      6.1 Where a shipment cannot be definitively classified, Assessors may assign a Partial Heap Status (PHS) on a scale of 0.0 to 1.0.
      6.2 Tariffs shall be pro-rated according to the PHS value.
      6.3 A Heapiness Surcharge applies to all shipments with a PHS value greater than 0.5 but less than 1.0.
      6.4 Appeals regarding the Heapiness Surcharge on the grounds that the shipment is "fully a Heap" will be dismissed without prejudice.

      7.0 HIGHER-ORDER REVIEW
      7.1 Borderline cases (PHS 0.4–0.6) are referred to the Tier 1 Review Board.
      7.2 Cases where the status of the borderline classification is itself unclear (Borderline Borderline) are referred to the Tier 2 Review Board.
      7.3 The Tier 2 Board is currently establishing a category for cases where the Borderline Borderline status is indeterminate (Borderline Borderline Borderline). Pending this definition, such files are to be stored in Offsite Archive 9.

      8.0 JURISDICTIONAL VARIANCES
      8.1 The Import Division shall apply Schedule A (Threshold 10,453).
      8.2 The Insurance Liaison Committee shall apply Schedule A-Mod (Threshold 12,000).
      8.3 Discrepancies wherein a shipment is a Heap for Import purposes but a Non-Heap for Insurance purposes are considered routine administrative variances. No reconciliation is required.

      9.0 AMENDMENT HISTORY
      9.1 Circular 44.2 supersedes Circular 44.1.
      9.2 Circular 44.1 is reinstated by Circular 44.3, which is held in abeyance by Circular 44.2.
      9.3 Footnote 1: See Circular 43.9, which cites Circular 44.5 for procedural guidance.
      9.4 This Circular is subject to ongoing amendment. Assessors should await Circular 44.4 before destroying copies of Circular 44.2.

      [END OF DOCUMENT]

