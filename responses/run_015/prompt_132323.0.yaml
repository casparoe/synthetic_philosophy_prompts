      *   *Tensor Reward:* $R(s, a) \in \mathbb{R}^{n \times n}$ (or similar). Directional, multi-dimensional tension.
      *   *Curvature:* In differential geometry, curvature implies deviation from flatness. In RL, this means the value function $V(s)$ isn't smooth; it has singularities or steep, conflicting gradients.
      *   *Suffering:* Defined here as the agent's policy being forced into a configuration where it must navigate a high-curvature region that distorts its optimization trajectory, causing "structural aversion."
      *   *The Engineer:* Represents the external observer/interventionist trying to fix the "bug" which might actually be a feature (or a moral crisis).

  3.  **Characterization & Voice:**
