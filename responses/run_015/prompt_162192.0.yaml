answer: |-
  ### The protocol

  **Step 1: Unit of Analysis (Linkage Rule).**
  Determine if the measure is isolated or sequential. Annotators must search for prior institutional changes by the same governing coalition within the preceding 24 months. **Pass Condition:** The measure functionally lowers the cost or raises the payoff of a subsequent anti-competitive move (e.g., packing courts enables ignoring future rulings; changing election law aids future gerrymandering). **Fail Condition:** The measure stands alone with no functional dependency on prior or future acts. **Exit:** If isolated, tag as "Ordinary Reform" unless it singularly disables opposition participation (e.g., banning a specific party). If linked, proceed to Step 2. *Reasoning:* Isolated errors are noise; sequences are strategies. Do not code single bills as backsliding unless they are knockout blows.

  **Step 2: Symmetry Check (The Swap Test).**
  Before researching the specific context, rewrite the measure description stripping all proper nouns (country, party, leader names). Replace them with "Governing Party A" and "Opposition Party B." Code the measure based solely on this abstracted text. Then, unblind the real entities. **Pass Condition:** The tag remains identical after unblinding. **Fail Condition:** The tag changes based on who enacted it. **Exit:** If the tag changes, you are biased. You must recode to match the blind assessment or escalate to an editor with a note confessing the bias. *Reasoning:* Partisanship is the primary source of noise. If you would call it tyranny when your enemies do it but reform when your friends do it, your data is worthless.

  **Step 3: The Consent Problem (Mandate Rule).**
  Check if the measure passed via referendum or supermajority. **Rule:** Popular mandate is **not** a defense against backsliding. **Reasoning:** Democracy is constrained majority rule. A majority cannot vote to remove the constraints that protect minorities and future majorities; that is self-cannibalization, not deepening. **Exit:** If the measure removes checks on the majority (e.g., judicial independence, press freedom), tag as "Democratic Backsliding" regardless of vote share. Proceed to Step 4.

  **Step 4: The Baseline Problem.**
  Check the country's most recent V-Dem Electoral Democracy Index. **Threshold:** If the score is below 0.4, the country is not a democracy. **Exit:** You cannot slide from a floor that does not exist. Tag as "Unclear" with the note `BASELINE_FAIL`. Do not code "Democratic Backsliding" for autocracies becoming more autocratic; that is consolidation, not backsliding. If above 0.4, proceed to Step 5.

  **Step 5: Latency vs. Exercise.**
  Determine if the power has been used against an opponent. **Rule:** If the change grants structural advantage (e.g., legislature controls election commission), code as "Democratic Backsliding" even if unused. **Reasoning:** The harm is the potential for arbitrary exclusion, not just the act. A gun on the table changes the negotiation even if not fired. **Exit:** If the power is purely administrative with no competitive advantage, tag "Ordinary Reform." If structural advantage exists, tag "Democratic Backsliding."

  **Final Output:** Tag, One-line Justification, Confidence (1-5), Deciding Test (Step 1-5).

  ### Thresholds, exits, and incomplete evidence

  Annotators must assign a Confidence Level (1-5) based on evidence availability. **Level 1-2:** Insufficient evidence. Tag must be "Unclear." Do not infer intent from vibes. If search results yield only partisan op-eds without legal text or independent analysis, default to "Unclear." **Level 3:** Conflicting expert analysis. Tag based on the preponderance of institutional evidence (legal text over commentary). **Level 4-5:** Clear consensus among watchdogs (e.g., Venice Commission, Freedom House) matching your protocol assessment. **Exit Rule:** If you cannot complete the Symmetry Check (Step 2) because you lack knowledge of the opposing party's stance, tag "Unclear." It is better to have a gap in the dataset than a biased entry. The "Insufficient Evidence" tag is a valid quality control mechanism, not a failure of the annotator. When versioning the codebook, diff the "Deciding Test" field to see if disagreements stem from Linkage (Step 1) or Symmetry (Step 2).

  ### Four worked cases

  **Hungary (Constitutional and Electoral Changes, early 2010s)**
  The Fidesz coalition passed a new constitution and electoral laws following a supermajority win.
  *Step 1 (Linkage):* Pass. The constitutional changes entrenched electoral laws that favored the incumbent, creating a feedback loop.
  *Step 2 (Symmetry):* Pass. If an opposition coalition rewrote the constitution to lock in their advantage, it would be universally condemned.
  *Step 3 (Mandate):* Pass. The supermajority does not legitimize removing checks on future majorities.
  *Step 4 (Baseline):* Pass. Hungary was democratic prior to 2010.
  *Step 5 (Latency):* Pass. Structural advantages were granted immediately.
  **Record:** Tag: Democratic Backsliding. Justification: Linked sequence of constitutional changes entrenched incumbent advantage. Confidence: 5. Deciding Test: Step 1 (Linkage).

  **Poland (Judicial Reforms, post-2015)**
  The PiS government passed laws allowing the executive to discipline judges and pack the constitutional court.
  *Step 1 (Linkage):* Pass. Court packing was followed by laws disciplining judges who ruled against the government.
  *Step 2 (Symmetry):* Pass. No annotator would accept executive control over judicial tenure if enacted by the opposition.
  *Step 3 (Mandate):* Pass. Electoral victory does not justify subordinating the judiciary.
  *Step 4 (Baseline):* Pass. Poland was above the 0.4 threshold.
  *Step 5 (Latency):* Pass. Powers were exercised, but the structural change alone suffices.
  **Record:** Tag: Democratic Backsliding. Justification: Executive gained power to discipline judiciary, removing check on power. Confidence: 5. Deciding Test: Step 5 (Latency).

  **Turkey (Constitutional Referendum, 2017)**
  Referendum approved executive expansion, abolishing the Prime Minister role and weakening parliament.
  *Step 1 (Linkage):* Pass. Part of a longer sequence following the 2016 coup attempt to consolidate power.
  *Step 2 (Symmetry):* Pass. Abstracted, this is a shift from parliamentary to unchecked executive power.
  *Step 3 (Mandate):* Pass. **Crucial:** The referendum mandate is irrelevant. A majority cannot vote to end competitive democracy. Annotators who cite the referendum as "deepening" are wrong; they confuse popularity with liberty.
  *Step 4 (Baseline):* Pass. Turkey was borderline but still coded as electoral democracy pre-2017.
  *Step 5 (Latency):* Pass. Structural shift confirmed.
  **Record:** Tag: Democratic Backsliding. Justification: Referendum removed checks on executive, concentrating power despite majority vote. Confidence: 4. Deciding Test: Step 3 (Mandate).

  **US State (Legislature Takes Election Administration, mid-decade)**
  A state legislature moves authority from an independent election commission to itself.
  *Step 1 (Linkage):* Pass. Fits a pattern of similar bills in multiple states following contested elections.
  *Step 2 (Symmetry):* Pass. If Democrats seized control of election administration from a neutral body, Republicans would call it a power grab. The blind test confirms this is structural advantage.
  *Step 3 (Mandate):* Pass. Passed by legislature, not referendum, but even if popular, see Step 3 rule.
  *Step 4 (Baseline):* Pass. US state baseline is democratic.
  *Step 5 (Latency):* Pass. The power creates a conflict of interest regardless of immediate use.
  **Record:** Tag: Democratic Backsliding. Justification: Legislature granted itself authority over election administration, creating structural conflict. Confidence: 4. Deciding Test: Step 2 (Symmetry).

  ### The verdict you won't like

  The verdict you will dislike is the **US State** case. As an American, you likely view state legislatures as the bedrock of democracy and resist comparing their procedural changes to Orbán's Hungary. You want to believe this is "Ordinary Reform." The protocol forces you to admit it is **Democratic Backsliding**. The Symmetry Test (Step 2) proves that if the parties were swapped, you would recognize the danger. American exceptionalism is not a valid coding variable. If the structure grants incumbents control over their own reelection mechanics, it is backsliding, regardless of the flag flying over the capitol. I refuse to soften this: consistency requires applying the same structural standards domestically as internationally.

  ### Known failure modes

  This protocol will misfire in three specific areas. First, **Federalism Nuance.** The protocol treats unitary and federal states similarly. In the US case, state-level backsliding might be checked by federal courts. The protocol codes the state change as backsliding even if the federal baseline holds. This creates tension: is it backsliding if it can be reversed upstream? The protocol says yes, because the local institutional damage is real regardless of the safety net. Second, **Intent vs. Outcome.** The protocol assumes structural advantage implies intent to abuse. Sometimes incompetence creates bad structures without authoritarian intent. The protocol codes these as backsliding anyway because the effect on competition is identical. Annotators will feel this is unfair to "well-meaning" actors. It is not. Data measures impact, not soul. Third, **Speed of Change.** The 24-month linkage window is arbitrary. Slow-roll backsliding over six years will fail Step 1, fragmenting one strategy into multiple "Ordinary Reforms." This undercounts erosion in stable regimes. There is no fix for this without deep archival research, which violates the 20-minute constraint. You must accept this blind spot.

  ### Where I'm guessing

  I am least confident in the **Symmetry Check's** compliance. I am assuming annotators will honestly document their bias during the blind test. In reality, they may game the blind description to match their desired outcome. I am guessing that the shame of writing "I changed my mind after unblinding" is sufficient deterrent. It might not be. I am also guessing on the **Baseline Threshold** (0.4 V-Dem). This is a hard line for a fuzzy concept. A country at 0.41 sliding to 0.39 is treated differently than one at 0.39 sliding to 0.37, though the reality is continuous. I chose 0.4 because it roughly separates electoral democracies from electorals autocracies in current datasets, but it is a heuristic, not a law. Finally, I am guessing that **Latency** (unused powers) is sufficient for backsliding. Some literature argues only exercised power counts. I disagree, but I acknowledge that coding potential harm increases false positives. I accept that risk to catch the slow burns.
