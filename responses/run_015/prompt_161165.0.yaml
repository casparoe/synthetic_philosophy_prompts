answer: |-
  Consider a high-precision interferometric campaign mapping the amplitude and phase of a classical electromagnetic field across a continuous aperture. In a simpler, discrete case—say, comparing the integrated intensity of two distinct spectral lines—the nominalist paraphrase works cleanly: "Line A deposits more energy than Line B" replaces real-number magnitudes with concrete comparative relations between detector events, losing no predictive power and positing no extra entities. However, when reconstructing the full continuous vector field required to predict interference patterns at arbitrary sub-wavelength resolutions, the nominalist must paraphrase the complex field values as intrinsic qualitative relations between spacetime points themselves to avoid quantifying over numbers. Because the mathematical model demands a continuum of independent values to preserve linear superposition, the nominalist is forced to posit that spacetime points possess a cardinality of distinct qualitative states matching the real numbers—effectively reifying the mathematical continuum into the fabric of spacetime—whereas the platonist treats the field values as abstract vectors supervening on a physically coarser-grained substrate that need not itself be infinitely divisible. The blocking feature is *informational density*: the nominalist must embed the infinite precision of the mathematical continuum into the concrete ontology to avoid abstracta, while the platonist locates that precision in the abstract realm, leaving the physical world potentially discrete or finite.

  ***

  **Walkthrough of Views**
  The **Platonist** accepts the vector field as a mapping from concrete spacetime points to abstract complex numbers. Their concrete ontology is just the spacetime manifold and the physical field excitations; the "values" are abstract objects. Their cost is epistemic: they owe an explanation of how causal interactions with detectors give us reliable knowledge of causally inert numbers. The **Nominalist (Paraphraser)** rejects the abstract numbers. They must interpret "field value = $v$" as "spacetime point $p$ stands in relation $R_v$ to..." To make this true without numbers, the concrete world must actually contain enough distinct relations $R_v$ to map one-to-one onto the complex plane. If the physics doesn't strictly require spacetime to be continuous (e.g., if it's compatible with a discrete substrate), the Platonist can treat the continuous math as an abstract idealization. The Nominalist, however, cannot; for their paraphrase to be *true*, the concrete relations must exist. Thus, the Nominalist is forced to commit to a richer physical ontology (infinitely distinct concrete states) than the Platonist (who only commits to the abstract math being rich).

  **The Single Feature**
  The feature doing the work is **Continuity vs. Physical Granularity**. The mathematical model requires a continuum (uncountable infinity) of values to function (specifically for superposition and differentiation). The Platonist can house this continuum in the abstract realm, remaining agnostic about whether physical spacetime is truly continuous or just "smooth enough" for measurement. The Nominalist must house the continuum in the concrete realm to ground the truth of their paraphrases. If the physical world is arguably discrete or finite in information capacity (as some interpretations of quantum gravity suggest, or even just by practical measurement limits), the Nominalist must *add* concrete structure (distinct qualitative tropes at every point) to match the math, whereas the Platonist does not.

  **Removal Test**
  If you remove the requirement for **continuous variables** (e.g., switch to a discrete lattice theory or a finite-state automaton model), the case collapses back into an ordinary indispensability argument where Nominalism looks parsimonious again. In a discrete theory, the nominalist only needs a finite or countable set of concrete relations to match the math. There is no "informational density" mismatch. The nominalist can simply say "State A follows State B" without needing to ground real numbers. In that scenario, the Platonist looks wasteful for positing abstract numbers when concrete counters would do, and the epistemic access problem becomes the Platonist's only burden.

  **Nominalist Escape and Evaluation**
  A smart nominalist would attack this by arguing: **"If the continuous field theory is empirically adequate, the concrete structure *must* be there anyway."** They would claim that denying the continuity of spacetime relations while accepting the success of Maxwell's equations is inconsistent; if the math works, the structural relations it describes are instantiated concretely. Therefore, the "bloat" isn't extra—it's just what physics already demands.
  *Evaluation:* This escape is strong but concedes the main point. It admits that Nominalism forces a commitment to specific physical structures (continuous spacetime) that the Platonist can avoid. The Platonist can say, "The math is continuous, the world might not be; the math is just a tool." The Nominalist must say, "The math is continuous, so the world *is*." This makes Nominalism less flexible regarding future physics (e.g., if spacetime is found to be discrete, the Nominalist's paraphrase becomes false, while the Platonist's math remains useful).

  **Platonist Epistemic Cost**
  Does this case make the Platonist's epistemic problem better or worse? **Worse.** By highlighting that the math is *indispensable* for the reconstruction (you can't just round off to discrete bins without losing interference predictions), it tightens the link between the successful prediction and the abstract objects. The Platonist cannot easily dismiss the vectors as mere fictions here; they are doing heavy lifting. However, the trade-off is ontological: the Platonist pays with epistemic mystery (how we know about numbers), while the Nominalist pays with concrete bloat (positing infinite physical distinctness). Your reading group should argue whether "mystery" is a heavier cost than "bloat."
