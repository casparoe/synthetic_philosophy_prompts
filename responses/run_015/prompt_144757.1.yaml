  1.  **Analyze the Request:**
      *   **Topic:** Kafka's *The Metamorphosis*.
      *   **Angle:** Moral status as a gradient (degrees of sentience/cognitive continuity/affective range/social reciprocity), not just a binary "human vs. insect."
      *   **Key Question 1:** Which specific moments map onto downward shifts in the family's care (feeding -> neglect -> removal)?
      *   **Key Question 2:** Does the novel treat inner life as morally relevant but invisible, or do appearance/function override cognition?
      *   **Key Question 3:** Where does the story *resist* being read as a neat illustration of gradated status?
      *   **Key Question 4:** What does Kafka add to the philosophical debate that a straightforward argument about degrees of sentience misses?
      *   **Constraints:** No citations, no reading list, sharp and honest reading.

  2.  **Deconstruct the "Gradient of Moral Status" Framework:**
      *   The prompt suggests a scale: Thermostat (0) -> Insect -> Mammal -> Human.
      *   Factors: Cognitive continuity, affective range, social reciprocity.
      *   Gregor's situation: Human mind + Insect body.
      *   The Family's reaction: A sliding scale of dehumanization/neglect.

  3.  **Address Key Question 1: Mapping the Downward Shifts:**
      *   *Initial State:* Shock, but care exists. Grete brings milk and bread. This acknowledges biological need (mammalian level).
      *   *Shift 1 (Dietary/Instinct):* Gregor rejects milk/bread for rotting cheese. The family sees this as "animalistic" preference. This lowers his status from "sick human" to "pet with weird tastes."
      *   *Shift 2 (The Couch Scene/Visual Trauma):* Gregor hangs from the ceiling or reveals himself to the lodgers/mother. The mother faints. This is about *appearance* overriding *intent*. He tries to save the picture (cognitive continuity/memory), but they see a monster.
      *   *Shift 3 (The Apple Incident):* The father throws the apple. It gets stuck. This is active violence, moving from neglect to harm. Moral status drops to "vermin to be exterminated."
      *   *Shift 4 (Grete's Speech):* "It must be got rid of." She denies it's Gregor. This is the final severing of social reciprocity. He is no longer a subject, but an object/obstacle.

  4.  **Address Key Question 2: Inner Life vs. Appearance/Function:**
      *   Gregor's inner life is rich (worry about work, love for sister, music).
      *   The family *cannot* access it. They only see the shell.
      *   *Crucial Point:* The novel suggests that moral status is *intersubjective*. It doesn't matter what Gregor *is*; it matters what he can *communicate* and what role he fills.
      *   When he loses speech, he loses the primary tool for asserting moral status.
      *   When he loses economic function (breadwinner), he loses social utility.
      *   *Verdict:* Appearance and function override cognition because cognition without communication is solipsistic. It doesn't register on the social moral scale.

  5.  **Address Key Question 3: Resistance to the "Neat Illustration":**
      *   If it were a neat gradient, Gregor's moral status should drop in sync with his physical decay.
      *   *Resistance:* Gregor's *humanity* (empathy, self-sacrifice) actually *peaks* near the end. He starves himself to spare them. He dies loving them.
      *   The gradient model assumes moral status is based on *capacity* (can he think? can he feel?). Kafka shows moral status is based on *recognition*.
      *   Also, the family *rises* as Gregor *falls*. Their moral status (in a social sense) improves (they get jobs, look healthier) as his degrades. This complicates the "moral universe" of the book. It's not just about Gregor's status; it's about the economy of care.

  6.  **Address Key Question 4: What Kafka Adds to the Debate:**
      *   Philosophy often asks: "What properties grant rights?"
      *   Kafka asks: "What happens when properties remain but the *relationship* breaks?"
      *   The "Uncanny Valley" of moral status. He's not an insect; he's a *wrong* human.
      *   The burden of proof is on the sufferer to prove they are still moral subjects.
      *   The horror isn't becoming an insect; it's realizing your humanity was contingent on your utility and form all along.
      *   Kafka introduces *affective dissonance*: Gregor feels shame. Insects don't feel shame. This proves his mind is human, but the shame is useless. It highlights the tragedy of unrecognized interiority.

