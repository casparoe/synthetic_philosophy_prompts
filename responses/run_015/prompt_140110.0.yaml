answer: |-
  1. Setup and Materials
  Divide the room into three groups: four Engineers behind a screen, one World-Operator facing them, and nine Observers split between watching the Engineers and the Operator. Give Engineers a bag of colored poker chips and a deck of index cards specifying movement rules based solely on chip adjacency and color. The World-Operator holds a secret map linking chip configurations to external states and a stack of feedback cards. Observers receive log sheets to record the Engineers' moves alongside the World-Operator's feedback signals. Ensure the screen physically prevents Engineers from seeing the Operator or any external context clues. All communication flows through written notes or chip movements; speech is forbidden until the debrief.

  2. Rules and Scoring
  Engineers earn poker chips from the pot whenever the World-Operator places a green feedback card, which happens only when chip arrangements match the Operator's hidden state map. If the arrangement mismatches, the Operator places a red card, and Engineers lose a chip; they must revise their rule-cards accordingly. Observers score points by correctly predicting whether the next move will yield green or red based on their own theories of what the chips mean. Halfway through, the facilitator silently swaps the World-Operator's map for a new one that inverts the meaning of specific colors. Engineers must adapt their syntax rules to regain green cards without knowing the semantics have shifted. The group wins collectively if total chip count remains positive after ninety minutes.

  3. Minute-by-Minute Timeline
  Minutes 0-15: Distribute roles and materials, explain constraints, and enforce the silence rule. Minutes 15-45: Run the first simulation phase where the hidden map remains stable and Engineers develop reliable syntax rules. Minutes 45-50: Facilitator executes the silent map swap while Engineers are reviewing their rule-cards. Minutes 50-80: Run the second phase where previous successful moves now trigger red feedback, forcing confusion and rule renegotiation. Minutes 80-90: Allow open discussion among Engineers and Operators while Observers compile their logs. Minutes 90-120: Conduct the full-group debrief focusing on the moment the mapping changed.

  4. The Debrief
  Begin by asking the Engineers if the chips caused the green cards or if the rules caused the green cards, then ask the Observers what the chips were *about* before the swap. Point to the exact minute the map changed to highlight that the physics of chip movement remained identical while the truth-value flipped. Introduce the term 'epiphenomenalism' to describe the Engineers' view that only shape matters, and 'original intentionality' for the Observers' view that meaning matters. Ask whether the system became 'wrong' or merely 'different' when the feedback turned red despite identical moves. Guide them to see that causal closure holds physically, yet explanatory power requires the semantic layer. Conclude by asking which description they would use to debug the system if asked to fix the red streak.

  5. Failure Modes plus the One Feature
  If Engineers deduce the semantic swap too quickly, slow the feedback rate to force reliance on syntactic patterns alone. If Observers dominate the conversation, enforce a rule that only Engineers can propose rule changes to maintain the syntax/semantics split. The primary failure mode is the group agreeing that the chips were never 'about' anything, collapsing the tension too early. You must personally state that this activity cannot reproduce the first-person experience of having thoughts feel meaningful from the inside. The simulation shows external attribution of meaning, but not the internal phenomenology of intentionality. Ensure you emphasize that the hard problem remains why any substrate feels like anything at all.
