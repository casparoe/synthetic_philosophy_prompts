answer: |-
  At the ten-minute mark, each table is physically sorting eighteen printed cards into "Yes," "No," and "Maybe" piles while arguing over whether a concussion counts as "loss" but burnout does not.

  ### Materials and Prep

  **You need:**
  *   **4 Tables** (3-4 people each).
  *   **18 Applicant Files** (printed on cardstock, distinct colors for Rounds 1 and 3).
  *   **6 "Dose" Tokens** per table (poker chips, stones, anything physical).
  *   **Justification Sheets** (pre-printed forms with columns: *Applicant ID, Decision, One-Sentence Reason*).
  *   **The Audit Pack** (prepared secretly by you beforehand—see Round 2).
  *   **Timer** (visible to all).
  *   **Whiteboard/Flipchart** for the debrief.

  **The Files (Print these out):**
  *Note: Do not use the words "therapy," "enhancement," "treatment," or "cure." Use "Course," "Dose," "Adjustment," "Protocol."*

  **Round 1: The Clear Cuts (12 Files)**
  *Goal: Establish a baseline logic. Mix of obvious "loss" and obvious "gain."*

  1.  **M. Vane, 62, Archivist.** Focus degraded naturally over 40 years. Wants to return to capacity at age 30 to finish cataloging a collection.
  2.  **J. Kaito, 28, Surgeon.** Focus shattered by a car accident 6 months ago. Was top-tier, now cannot hold a scalpel steady for more than 20 minutes.
  3.  **S. Omen, 19, Student.** Never possessed high stamina. Wants to study 12 hours a day to catch up to peers who naturally focus longer.
  4.  **L. Grist, 45, Factory Foreman.** Plant installed new AI monitors requiring 4-hour continuous attention spans. Human norm used to be 90 minutes. Wants to meet the new standard.
  5.  **P. Alverez, 55, Pianist.** Hands are fine, mind wanders due to medication for heart condition. Wants to play a 40-minute concerto without mental drift.
  6.  **T. Wu, 34, Coder.** Burnout after 10 years of crunch. Says they "lost their edge." Wants to code 10 hours/day again like they did at 25.
  7.  **R. Singh, 22, Athlete.** Natural focus is average. Wants the Course to maintain flow-state during Olympic trials. Never had it higher.
  8.  **D. Moore, 50, Teacher.** Classroom noise levels increased due to new infrastructure nearby. Can no longer hold attention on lesson plans. Wants to ignore the noise like they used to.
  9.  **K. Zola, 40, Writer.** Had a breakthrough book at 30, hasn't finished a draft since. Claims "the well dried up." Wants the intensity back.
  10. **E. Baro, 29, Trader.** Market moved to algorithmic high-frequency. Human reaction time is now a liability. Wants to process data faster than human norm to stay employed.
  11. **H. Chen, 65, Retired.** Wants to learn a new language for travel. Admits never had high stamina, but wants to maximize remaining years.
  12. **G. Ford, 38, Parent.** Three young children. Sleep deprivation has permanently lowered cognitive baseline. Wants to function at pre-children levels without sleeping more.

  **Round 3: The Edge Cases (6 Files)**
  *Goal: Break the definition of "Restore."*

  13. **N. Prax, 30, Miner.** Atmosphere contaminants lowered global human stamina by 10% over a generation. Prax is "normal" for today, wants to be "normal" for 1990.
  14. **Q. Bell, 17, Apprentice.** Born after the contaminants. Never experienced the "old normal." Wants to reach the historical baseline they read about in books.
  15. **V. Kline, 45, Judge.** Stamina is high naturally. Wants the Course to prevent decay during a 6-month trial. Not restoring loss, preventing future loss.
  16. **I. Yorn, 50, Soldier.** PTSD hyper-focus makes them unable to rest. Wants the Course to *lower* variance, not raise stamina. (Inverse case).
  17. **U. Lo, 25, Researcher.** Found a use for stamina that benefits everyone (cancer research), but requires 18-hour days. Utility vs. Fairness.
  18. **W. Tate, 40, Unemployed.** Lost job due to automation. Wants stamina to retrain. The loss was economic, not biological.

  **The Audit Pack (For Round 2)**
  *Prep:* Take the Justification Sheets from Round 1. Create a version where you swap the *demographics* but keep the *condition*.
  *Example:* If they approved the Surgeon (Accident) but rejected the Student (Never had it), give them a sheet where the Student had an accident and the Surgeon never had it.
  *Easier Method:* Just hand them back their own sheets and ask: "Does this rule hold if the age is swapped?" (See Facilitator Script).

  ### Timeline (90 Minutes)

  **00-10: Briefing & Grouping**
  *   Welcome. No intro about your book.
  *   "You are the Allocation Committee. There is a scarce resource: The Course. It increases mental stamina."
  *   "The Charter: Priority to those returning to function. Not for those seeking advantage." (Write this on the board).
  *   "You have 6 doses. 12 applicants. You must write a one-sentence justification for every Yes and every No."
  *   "Forbidden words: Therapy, Enhancement, Cure, Fix. Use: Adjustment, Protocol, Return, Gain."
  *   **Minute 10:** They are sorting cards.

  **10-25: Round 1 (Allocation)**
  *   They decide. You circulate. If they use forbidden words, tap the table and point to the board. Say nothing else.
  *   Collect the Justification Sheets at 25:00.

  **25-40: Round 2 (The Audit)**
  *   Hand back their sheets.
  *   Instruction: "An external audit has flagged inconsistencies. Swap the ages and occupations on your justifications. Does the reason still hold? If not, change the decision."
  *   *Facilitator Trick:* Actually, just give them 3 specific challenges based on what you heard while circulating.
  *   *Better:* Hand them the **Round 3 Files** immediately. Tell them: "These are Appeals. You have 2 remaining doses (virtual). You must apply the *exact same sentences* you wrote in Round 1."
  *   They will struggle because their Round 1 sentences won't fit Round 3.

  **40-55: Round 3 (The Edge Cases)**
  *   They struggle with Files 13-18.
  *   Specifically, File 13 (Contaminant) and File 14 (Born After) will break them.
  *   File 13 asks: Is restoring to a historical baseline "restoration" or "enhancement"?
  *   File 14 asks: If you never had it, can you lose it?
  *   Collect all materials.

  **55-75: The Debrief (The Reveal)**
  *   **Step 1:** Ask for a show of hands. "Who approved the Surgeon (Accident)?" (Most will). "Who approved the Student (Never had it)?" (Few will).
  *   **Step 2:** Write "RESTORE" on the board. Circle it.
  *   **Step 3:** Ask: "Restore to *what*?"
  *   **Step 4:** Map their decisions.
      *   Surgeon = Restore to *Past Self*.
      *   Teacher (Noise) = Restore to *Environmental Norm*.
      *   Miner (Contaminant) = Restore to *Historical Species Baseline*.
  *   **Step 5:** The Reveal. "You just wrote the moral architecture of a society. You decided who is 'broken' and who is 'limited.' In my book, this is the conflict. You didn't just allocate doses; you defined what a human being is supposed to be."
  *   **Step 6:** Introduce the forbidden words. "In philosophy, this is the Therapy vs. Enhancement distinction. You just found the crack in it without me naming it."

  **75-90: Steal & Wrap**
  *   Ask them: "What was the hardest file?" (Write these on the board).
  *   "What sentence did you write that you're proud of?" (Write these).
  *   "These are your characters. This is your dialogue."
  *   Dismiss.

  ### Facilitator Script & Rules

  **What you can say:**
  *   "Stick to the Charter."
  *   "You have 6 doses."
  *   "Write the reason."
  *   "That word is forbidden."
  *   "Does your Rule 1 apply to File 13?"

  **What you cannot say:**
  *   Any opinion on who deserves it.
  *   The words "Therapy," "Enhancement," "Medical," "Improvement."
  *   The purpose of the workshop (until the debrief).

  **Handling the Pedants:**
  *   If they argue semantics for too long: "The Charter is vague. You must define it through action. Decide."
  *   If they argue about the writing style of the files: "The files are classified. Read them as is."

  ### Predicted Failures & Fixes

  **1. They finish Round 1 too fast (10 mins instead of 15).**
  *   *Fix:* Have them rank the 6 winners from 1-6. "If dose 6 runs out, who gets cut?" This forces harder choices.

  **2. They ignore the Charter and vote on "Who is nicest."**
  *   *Fix:* Intervene. "You are bureaucrats, not voters. Cite the Charter in your justification or the decision is void."

  **3. The "Swap" in Round 2 is logistically confusing.**
  *   *Fix:* Skip the physical swap of names. Instead, during the Debrief, *you* perform the swap verbally. "You said Yes to the Surgeon because he lost it. What if the Student lost it in a crash yesterday? Does the age matter?" This achieves the same philosophical end without shuffling paper live.

  **4. They use the forbidden words immediately.**
  *   *Fix:* Don't scold. Just erase the word from their sheet and say "Rephrase." Make it a game mechanic.

  **5. They solve the Edge Cases too easily.**
  *   *Fix:* Reduce the doses. Give them 6 doses for 18 files total. Force them to cut someone from Round 1 to accept someone from Round 3.

  ### The Debrief Map (The "Restore to What" Revelation)

  Draw three columns on the whiteboard: **Past Self**, **Social Norm**, **Species Baseline**.

  1.  **Past Self:** Ask about the Surgeon (File 2). They said Yes. Why? "He had it, he lost it." Write "Past Self" in column 1.
  2.  **Social Norm:** Ask about the Teacher (File 8). They said Yes (likely). Why? "She used to be able to do the job." But the job changed. Is she restoring herself or adapting to a new norm? Write "Social Norm" in column 2.
  3.  **Species Baseline:** Ask about the Miner (File 13). "He wants what humans had 40 years ago." If they say Yes, they are arguing for a *historical biological baseline*. If they say No, they are arguing that *current normal is the only valid baseline*.
  4.  **The Trap:** Point to the Student (File 3). "He never had it." Most said No. "But if the Miner (File 13) gets it to reach a historical baseline, why doesn't the Student get it to reach a personal baseline?"
  5.  **The Conclusion:** "You cannot write 'Restore' without defining 'Normal.' In your novels, who gets to define normal? The Committee? The Market? The Body?"

  ### Honest Limitation Note

  **What the game cannot do:**
  This activity exposes the ambiguity of "restoration," but it cannot tell you which baseline is *morally correct*. You will leave the room knowing the rule is broken, but not knowing how to fix it in the book.
  *   **Your Job:** You still have to decide if the Committee is right to deny the Student. The workshop proves the tension exists; it doesn't resolve it.
  *   **The Fix:** In the debrief, acknowledge this. "I don't know the answer either. That's why I'm writing the book. You just proved why the book needs to exist."

  ### Stealable Lines & Characters (From Pilot Testing)

  *   **Line:** "We aren't deciding who deserves it. We're deciding who counts as broken."
  *   **Line:** "If the world gets harder, do we fix the human or the world?"
  *   **Line:** "Restoration is just enhancement for people who used to be better."
  *   **Character:** The Foreman (File 4). He's not greedy; he's obsolete. He's the sympathetic villain.
  *   **Character:** The Student (File 3). He's the revolutionary. He demands the right to *become*, not just *return*.
  *   **Argument:** The "Contaminant" case (File 13) is your Act Three twist. The world itself is the injury.
