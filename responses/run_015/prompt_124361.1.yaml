          *   Let's find a subtle one relevant to the protagonist. Maybe "Predictive Accuracy" vs. "Normative Authority." (Just because you predict behavior doesn't mean you judge it right). Or "Internal Consistency" vs. "Contextual Sensitivity."
          *   Better: "Value Neutrality of the Framework" vs. "Substantive Moral Judgments." A framework that judges bias cannot itself be purely neutral.

  4.  **Refining the Criteria for the Novel:**
      *   Make them sound academic but accessible (since the protagonist uses them).
