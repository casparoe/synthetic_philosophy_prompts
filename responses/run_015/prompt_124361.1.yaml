  2.  **Deconstruct the Core Problem:**
      *   The protagonist needs to defend against the accusation "You're just biased."
      *   This implies there *is* such a thing as non-biased moral disagreement.
      *   The framework must differentiate between:
          *   *Bias:* Systematic error in moral reasoning/judgment rooted in irrelevant factors (self-interest, prejudice, cognitive shortcuts).
          *   *Preference/Taste:* Subjective valuation that doesn't claim universal moral force (e.g., liking chocolate vs. vanilla).
          *   *Legitimate Moral Weight:* Different but valid prioritization of moral values (e.g., liberty vs. security).
          *   *Epistemic Bad Luck:* Being wrong due to lack of information, not flawed processing.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Handling the Cases.*
          *   Need to distinguish the "Moral Tourist" (pragmatic adherence) from the "Exile" (principled rejection). The theory needs to account for *commitment depth* vs. *behavioral compliance*.
          *   Need to distinguish "Discounting animal pain" (moral judgment) vs. "Hating bitter taste" (sensory preference). The theory needs a "Universality Claim" test.

      *   *Requirement 2: The Distinctions.*
          *   Bias vs. Taste: Taste is private; Bias masquerades as public reason.
