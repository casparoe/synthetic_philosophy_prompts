prompt: |-
  hey, im writing a novel and my protagonist is a moral psychologist who keeps getting told shes "just biased" whenever she disagrees with someone on value, so i want her to have an actual framework that separates real moral bias from legit preference. can you write the desiderata for such a theory? i need: the cases it has to handle right (like the "moral tourist" who adopts local norms for a season vs the "exile" who rejects them, or discounting animal pain vs just hating bitter taste), the distinctions it cant blur (bias vs taste vs epistemic bad luck), whether theres a contradiction hidden between demanding objectivity and allowing different moral weights, and which one requirement kills the usual pop-psych explanations. flag any pair thats jointly unsatisfiable. keep it to the criteria, not a full scorecard, and dont worry about citations—i dont have access right now. (also i keep misspelling desiderata as desiderta, lol)
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Create a set of *desiderata* (criteria/requirements) for a moral psychological theory/framework.
      *   **Protagonist:** A moral psychologist who gets accused of bias when disagreeing on values. She needs a framework to distinguish *real moral bias* from *legitimate preference*.
      *   **Specific Requirements:**
          *   Handle specific cases: "Moral Tourist" (adopts local norms temporarily) vs. "Exile" (rejects them); Discounting animal pain vs. hating bitter taste.
          *   Maintain distinctions: Bias vs. Taste vs. Epistemic Bad Luck.
