answer: |-
  Here are the desiderata for your protagonist's framework. They are designed to be rigorous enough to shut down a debate but flexible enough to allow for genuine moral disagreement.

  ### The Desiderata for the Bias/Preference Framework

  **1. The Universality Claim Condition (Handles Taste vs. Moral Judgment)**
  The framework must distinguish between claims that demand universal assent and those that do not.
  *   **Requirement:** A judgment counts as a *moral valuation* only if the agent implies that others *ought* to share it given similar conditions. A judgment counts as *taste* (e.g., hating bitter taste) if the agent accepts that others may legitimately differ without being "wrong."
  *   **Application:** Discounting animal pain fails this test if the protagonist claims everyone *should* discount it (moral claim). Hating bitter taste passes as preference because she admits others might like it.
  *   **Constraint:** The framework must flag any attempt to disguise a taste as a moral universal as a "Normative Overreach Bias."

  **2. The Commitment/Compliance Distinction (Handles Tourist vs. Exile)**
  The framework must separate behavioral adherence from internal endorsement.
  *   **Requirement:** The theory must measure *psychological cost* associated with non-compliance.
  *   **Application:** The "Moral Tourist" exhibits low psychological cost when violating the norm in private (instrumental compliance). The "Exile" exhibits high psychological cost when adhering to the norm (principled rejection).
  *   **Constraint:** Bias cannot be assigned based on behavior alone; it must track the alignment between internal weighting and external action. A Tourist isn't biased; they are pragmatic. An Exile isn't biased; they are principled.

  **3. The Informational Sensitivity Condition (Handles Epistemic Bad Luck)**
  The framework must distinguish between flawed processing and flawed data.
  *   **Requirement:** A judgment is only "biased" if it remains stable despite the provision of full, neutral information. If the judgment changes when new facts are introduced, it was an *epistemic error*, not a moral bias.
  *   **Application:** If someone discounts animal pain because they believe animals lack nerves, correcting that belief changes their view. That was bad luck/ignorance. If they know animals feel pain but discount it anyway because "they aren't human," that is bias.
  *   **Constraint:** The framework must not label ignorance as bias. Bias is a *resistance* to correction, not a lack of knowledge.

  **4. The Reflective Endorsement Test (The Pop-Psych Killer)**
  This is the requirement that destroys standard pop-psychology explanations.
  *   **Requirement:** A moral stance is legitimate only if it survives *causal transparency*. If revealing the psychological cause of the belief (e.g., "You only think this because you're tired/wealthy/indoctrinated") undermines the agent's own confidence in the belief, it is a bias. If the agent says, "I know that's the cause, but the reason is still valid," it is a legitimate preference/weighting.
  *   **Why it kills Pop-Psych:** Pop-psych argues "Everyone has biases, therefore all judgment is suspect." This requirement argues "Legitimate judgments are bias-proofed by reason." It forces the accuser to prove that the belief *cannot* stand without the irrelevant cause.

  **5. The Weighting Constraint (Handles Objectivity vs. Different Weights)**
  The framework must allow for different moral hierarchies without collapsing into relativism.
  *   **Requirement:** The theory must permit agents to assign different *weights* to valid moral axioms (e.g., Liberty vs. Security) without labeling the lower-weighted axiom as "biased away."
  *   **Constraint:** Bias is only present when an agent assigns *zero* weight to a universally recognized axiom due to an irrelevant factor (e.g., ignoring Liberty because the victim is a rival), not when they simply prioritize Security higher than Liberty.

  ***

  ### The Hidden Contradiction: Objectivity vs. Moral Weights

  There is a tension here your protagonist will have to navigate.
  *   **The Contradiction:** If morality is objective (there is a truth), then differing weights imply one person is wrong. If differing weights are allowed (pluralism), then morality appears subjective.
  *   **The Resolution in the Framework:** The framework must treat *Foundational Axioms* as objective (e.g., "Pain is bad") but *Trade-off Functions* as variable (e.g., "How much pain is acceptable to prevent a lie?").
  *   **The Risk:** If the framework defines the "Correct Weighting," it becomes dogmatic. If it allows *any* weighting, it cannot identify bias. Your protagonist must define a "Zone of Legitimate Variation." Anything outside that zone is bias; anything inside is preference.

  ***

  ### Jointly Unsatisfiable Pairs

  You asked to flag pairs of requirements that cannot both be true. Your protagonist should know these traps so she doesn't walk into them.

  **1. Complete Psychological Reductionism + Normative Authority**
  *   **Pair:** You cannot claim that all moral judgments are *fully explainable* by psychological causes (reductionism) AND claim that some judgments have *authority* over others (normativity).
  *   **Why:** If you explain away all morality as just brain states, you lose the ground to call something "biased" rather than just "different brain states." To call something a bias, you must assume some judgments are *not* just psychological artifacts.
  *   **Verdict:** The protagonist must reject Complete Reductionism.

  **2. Universal Commensurability + Legitimate Pluralism**
  *   **Pair:** You cannot claim all values can be measured on a single scale (commensurability) AND claim that different people can legitimately prioritize them differently without error.
  *   **Why:** If there is one single scale of "Good," there is only one correct weighting. If there are legitimate different weightings, there cannot be a single scale.
  *   **Verdict:** The framework must accept *Incommensurability* (some values cannot be directly compared) to allow for legitimate pluralism.

  ***

  ### A Note on Spelling
  You mentioned the typo: It is indeed **desiderata** (plural) and **desideratum** (singular). It comes from the Latin *desiderare* (to long for/require). Your protagonist would definitely catch that error in someone else's manuscript!
