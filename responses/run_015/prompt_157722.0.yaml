answer: |-
  You have hit upon one of the most famous and philosophically charged boundaries in quantitative genetics. You are not smuggling anything in; you are correctly identifying that **heritability answers a specific question, and your intuition is asking a different one.**

  The short answer is: **The $0/0$ undefinedness is not a defect in the concept; it is a feature.** It signals that the question heritability is designed to answer ("Why are these individuals *different*?") has ceased to have meaning because there are no differences.

  However, your intuition that the trait is "as genetic as it gets" is also correct, provided you are using a different definition of "genetic." Here is how to disentangle the two.

  ### 1. Variance vs. Causation (The Lewontin Distinction)
  Richard Lewontin famously illustrated this exact problem. Heritability is a statistic about **variance**, not about **causation of the mean**.

  *   **Your Inbred/Controlled Case:** Every individual has phenotype $P = 10$.
  *   **The Question Heritability Asks:** "Of the differences between individuals, what proportion is due to genetic differences?"
  *   **The Answer:** "There are no differences. The question is meaningless."

  Your intuition is asking: "If I were to perturb this system, which factor would change the outcome?" That is a question about **developmental necessity** or **causal potency**, not heritability.

  Consider the trait "having a heart."
  *   **Causation:** It is 100% genetic (you need specific genes to grow a heart) and 100% environmental (you need oxygen/nutrients to grow a heart).
  *   **Heritability:** In a normal human population, $V_G$ for "having a heart" is 0 (everyone has the genes) and $V_E$ is 0 (everyone gets enough oxygen). $h^2$ is undefined/zero.
  *   **Intuition:** It feels "genetic." But statistically, it explains no variance.

  If we defined heritability as 1 in your $0/0$ case, we would be conflating "genetic determination" with "genetic variance." This is dangerous because it leads to essentialism. A trait can be entirely genetically determined (monogenic) but have zero heritability if the allele is fixed in the population.

  ### 2. Your Counterfactual Fix is Actually "Potential Heritability"
  You proposed: *"Hold the environment fixed and ask how much variance you'd see if you randomized genotype."*

  This is a coherent concept! In quantitative genetics, this is related to the **Reaction Norm**.
  *   A genotype is not a value; it is a function $P = f(G, E)$.
  *   Your inbred line is a single function $f(G_1, E)$.
  *   By holding $E$ constant and varying $G$, you are essentially measuring the **slope of the genetic reaction norm** in that specific environment.

  If you formalized your fix, you would be calculating the **Broad-Sense Heritability of a Reference Population**. Breeders actually do something like this. They estimate "Genetic Variance" ($V_G$) not just by looking at the current population, but by estimating the additive genetic variance *available* in the gene pool.

  However, this is not *realized* heritability. It is *potential* heritability.
  *   **Realized $h^2$:** Predicts response to selection *right now*.
  *   **Potential $h^2$:** Predicts response to selection *if we introduced variation*.

  The standard definition stays with *realized* variance because evolutionary biology and breeding are concerned with **change**. If $V_P = 0$, selection differential ($S$) is 0. The Breeder's Equation ($R = h^2 S$) works perfectly even if $h^2$ is undefined, because $R$ must be 0. You cannot select for a trait where everyone is identical.

  ### 3. The "Measurement Error" Reality Check
  In the real world, your $0/0$ case never actually happens. Even in an inbred line in a controlled environment, $V_P > 0$. Why? **Developmental Noise ($V_{DE}$).**

  Stochastic molecular events during development mean that even isogenic organisms in identical environments are not phenotypically identical (e.g., fingerprint ridges, neural connectivity, slight size differences).
  *   In this realistic scenario: $V_G = 0$, $V_E \approx 0$, but $V_{DE} > 0$.
  *   Therefore $V_P > 0$.
  *   Therefore **$h^2 = 0 / V_P = 0$.**

  This reinforces the standard definition. Even with developmental noise, if there is no genetic variance, heritability is zero. The fact that the trait is "genetically programmed" doesn't matter; the *differences* you see are purely noise, not genes.

  ### 4. Why Redefining It Would Break Things
  If you redefined heritability to be 1 in the $0/0$ case (claiming the trait is "intrinsic"), you break the link between heritability and **evolvability**.

  Imagine a population of clones where height is determined entirely by genes, but there is no variation.
  *   **Your Definition:** $h^2 = 1$.
  *   **Implication:** If we select the tallest individuals, the next generation should be taller.
  *   **Reality:** Since they are clones, the next generation will be identical to the parents. Response to selection = 0.

  If $h^2=1$ but $R=0$, the Breeder's Equation breaks. By keeping $h^2$ undefined (or 0) when $V_G=0$, the math correctly predicts that evolution cannot occur, regardless of how "genetic" the trait developmentally is.

  ### Summary
  You aren't smuggling anything in; you are correctly sensing that **Heritability is not a measure of "Geneticness."**

  *   **Your Intuition:** Measures **Causal Potency** (If I wiggle G, does P wiggle?). In your $0/0$ case, the answer is Yes.
  *   **Standard Heritability:** Measures **Attribution of Variance** (Given that P is wiggling, is it because G wiggled?). In your $0/0$ case, the answer is "P isn't wiggling."

  The $0/0$ undefinedness is the mathematical way the concept says: *"I am a tool for analyzing differences. You have given me a population with no differences. I cannot work."*

  Your counterfactual fix is valid for asking about **developmental architecture**, but it should not be called heritability, because it does not predict response to selection in the current population. It predicts response to selection in a *hypothetical* population. Keeping the concepts distinct prevents the error of assuming that "highly genetic" traits (in the developmental sense) are easily evolvable (in the statistical sense).
