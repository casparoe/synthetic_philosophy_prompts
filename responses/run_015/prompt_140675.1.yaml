      *   **Key Innovations to Include:**
          1.  The Forced-Choice Test (inaction is still a choice).
          2.  The Witness Asymmetry (who is ranking matters epistemically and morally).
      *   **Required Sections:** Precise question, critique of standard positions, approach/method, month-by-month method, possible outcomes/deciders, concrete protocol description, three failure conditions, honest scope cut.
      *   **Tone:** Committed, sharp, not hedged into mush.

  2.  **Messy Brainstorming (Pre-drafting):**
      *   *What's the real crux?* It's not metaphysics; it's pragmatics. The panic about "ranking suffering" is actually anxiety about *authority* and *context*. If I say "A was worse than B," am I saying B doesn't matter? Am I saying I own A's memory?
      *   *The Grant Panel Perspective:* Reviewers hate "survey of the literature." They want a *problem* that gets solved. The problem here isn't "is ranking possible?" (too abstract). The problem is "practitioners need to make decisions but lack a normative framework that doesn't offend."
      *   *The Trap:* Getting stuck in metaethics. Need to anchor it in the *protocol*. The protocol is the hook. It proves the theory has cash value.
      *   *The Tension:* The "Witness Asymmetry" is risky. It sounds like identity politics if not handled carefully. Needs to be framed as *epistemic position + moral license*, not just "who you are."
      *   *The Forced Choice:* This is the killer argument against hard incomparabilism. If you have resources to save one group from genocide vs. another from famine, you *must* compare. Denying comparability leads to paralysis, which is itself a moral outcome.
      *   *Scope Cut:* Can't do a full history of memory. Can't interview practitioners. Must be conceptual + hypothetical case testing.
      *   *Voice:* Needs to sound like a philosopher who knows the game. Confident, precise, slightly impatient with vague hand-wringing.

  3.  **Drafting - Section by Section:**

      *   *Title:* Needs to be punchy. "The Architecture of Atrocity Comparison"? "Purpose-Relative Comparability"? Let's go with something that highlights the shift from metaphysics to pragmatics.
      *   *The Question:* Not "Is ranking possible?" but "Under what constraints is ranking morally licensed and practically useful?"
      *   *Critique of Standard Views:*
          *   Uniqueness Thesis (each event is sui generis): Leads to paralysis.
          *   Flat Incomparabilism (values are distinct): Fails the forced-choice test.
          *   Single-Scale Consequentialism (everything is utility): Erases qualitative difference, offensive to memory.
      *   *The Approach:* Tripartite framework (Unit, Dimension, Purpose).
      *   *Method:* 9 months. Months 1-3: Framework construction. 4-6: Stress testing (forced choice/witness). 7-8: Protocol drafting. 9: Writing.
      *   *Outcomes:* Either we find stable conditions for comparison or we prove that only specific agents can compare specific things for specific ends.
      *   *The Protocol:* It won't give answers; it will give *questions* to ask before ranking. A decision tree.
      *   *Failure Conditions:* 1. Framework collapses back into utilitarianism. 2. Protocol is too vague to use. 3. Witness asymmetry proves intractable.
      *   *Scope Cut:* No empirical fieldwork. No comprehensive history.

  4.  **Refining the Voice:**
      *   Avoid academic hedging ("I hope to," "I intend to"). Use "I will," "The project argues."
      *   Make sure the "messy brainstorming" looks distinct from the proposal.
      *   Check word count (1000-1200 for the proposal).
      *   Ensure no citations/named philosophers.

  5.  **Review against Constraints:**
      *   No bibliography? Check.
      *   No specific dates/death tolls? Check.
      *   Include Forced-Choice and Witness Asymmetry? Check.
      *   Include 3 failure conditions? Check.
      *   Include scope cut? Check.
      *   Brainstorming first? Check.

  6.  **Final Polish:**
      *   Make the "crux" in the brainstorming feel authentic—like a philosopher talking to themselves.
      *   Ensure the proposal sounds like it deserves money *now*.

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* cynical about the "Witness Asymmetry." It needs to be framed as a philosophical problem about authority, not just sociological observation. Also, ensure the "protocol" doesn't sound like a bureaucratic checklist but a normative tool.

  *(Word Count Check)*: The proposal needs to be tight. 1000-1200 words is roughly 2 single-spaced pages. I need to be economical.

  *(Brainstorming Section)*: Keep this separate and clearly marked as "thinking process."

  Let's write.
answer: |-
  ### Pre-Draft Brainstorming: Where does the body lie?

  *Okay, strip the varnish off. What actually kills this proposal in a committee room?*

  1.  **The "So What?" Trap:** If I just say "comparison is complex," reviewers will yawn. Everyone knows comparison is complex. The pivot has to be: *The complexity is the solution, not the obstacle.* The panic about ranking isn't a metaphysical mystery; it's a category error. People are trying to use a "blame" ruler to measure "compensation" needs.
  2.  **The Witness Asymmetry Risk:** This is the spicy bit. If I frame it as "only victims can compare," I sound like I'm doing identity politics, not philosophy. I need to frame it as *epistemic privilege vs. moral license*. The descendant knows the pain (epistemic) but might lack the impartiality required for resource allocation (license). The bureaucrat has the license but lacks the epistemic ground. The tension is the engine.
  3.  **The Forced-Choice Lever:** This is my hammer against the "incomparabilists." If you say "you can't compare," I put you in a triage situation. You *will* choose. Your silence is a choice. The proposal needs to make sure this doesn't sound like a gotcha moment but a genuine probe into the structure of deliberation.
  4.  **The Protocol:** It can't be a flowchart. It has to be a *licensing mechanism*. It tells you when you are allowed to speak, not just what to say.
  5.  **The Cut:** I can't interview memorial boards. I don't have the budget or the IRB clearance for a 9-month solo. I have to simulate their constraints through thought experiments. I need to admit this plainly so it doesn't look like I'm overpromising.

  *Okay, the core is this: Comparability isn't a property of the events; it's a property of the question being asked.*

  ***

  ### Grant Proposal: The Architecture of Atrocity Comparison

  **Project Title:** Purpose-Relative Comparability: A Normative Framework for Historical Ranking

  **The Question**
  Standard debates ask whether historical atrocities *can* be ranked. This is the wrong question. The proposed project asks: *Under what specific constraints is ranking morally licensed and practically useful?* I argue that comparability is not a metaphysical property of events but a function of the purpose for which the comparison is made. A ranking valid for resource allocation may be obscene when used for commemoration; a ranking valid for blame may be incoherent for compensation. The project seeks to determine the conditions under which comparative judgments avoid moral offense and practical paralysis.

  **The Problem with Standard Positions**
  Current literature offers three unsatisfactory answers. First, the **uniqueness thesis** holds that each atrocity is *sui generis*. While respectful, this leads to deliberative paralysis. If events are truly incomparable, agents facing forced choices—such as a funding board allocating limited reparations between two groups—have no rational basis for decision. Inaction becomes a default policy, which is itself a moral outcome with victims.

  Second, **flat incomparabilism** suggests values like "dignity" and "suffering" occupy distinct dimensions that cannot be traded. This view collapses under the **forced-choice test**. When an agent must prevent one of two harms, they implicitly weigh dimensions against one another. The incomparabilist owes an account of what deliberation looks like in these cases. If they cannot provide one, the view is practically inert.

  Third, the **single-scale consequentialist** view reduces all harm to a common metric (e.g., utility units). This is tractable but morally offensive. It erases qualitative differences between, say, cultural destruction and mass killing, treating them as merely different quantities of the same thing. This flattening insults the specific nature of the harm and often triggers the intuition that ranking is inherently obscene.

  **The Approach**
  I propose a tripartite framework that disaggregates comparison along three axes:
  1.  **Unit:** What is being compared? (A single event, a policy, a regime, a centuries-long practice). Total-suffering rankings often fail because they compare unequal units (e.g., a week of violence vs. a century of oppression).
  2.  **Dimension:** Along which vector? (Death toll, duration, cruelty, betrayal of trust, cultural erasure). Different dimensions yield different orderings.
  3.  **Purpose:** What is the comparison for? (Prevention, commemoration, blame, compensation).

  By separating these, the metaphysical panic evaporates. We are not asking "Is A worse than B?" but "Is A worse than B *along dimension X* for *purpose Y*?"

  This approach integrates two novel elements. First, the **forced-choice test** serves as a stress test for any normative framework. If a theory cannot guide action when resources are scarce, it is insufficient for practical ethics. Second, the **witness asymmetry** acknowledges that the offensiveness of ranking shifts depending on the agent. A descendant of victims ranking suffering claims a different authority than a detached academic or a state issuing apologies. There is a tension here: those in the best epistemic position to compare (insiders) are often those we are least comfortable granting normative license to (due to potential bias), while those with the license (official bodies) lack the epistemic ground. The project maps this tension rather than trying to solve it away.

  **Method and Timeline (Nine Months)**
  *Months 1–3: Framework Construction.* I will formalize the tripartite axes, defining the boundaries between units, dimensions, and purposes. I will draft the arguments against the uniqueness thesis and single-scale consequentialism, focusing on the forced-choice objection.
  *Months 4–6: Stress Testing.* I will construct hypothetical case studies involving resource allocation and commemorative decisions. I will test the witness asymmetry by varying the agent in these cases (e.g., victim group vs. state committee) to see where the intuitive objection to ranking arises.
  *Months 7–8: Protocol Development.* I will draft the one-page "how to compare" protocol. This will not be a calculator but a decision tree that forces users to specify unit, dimension, and purpose before making a judgment.
  *Month 9: Synthesis.* Finalizing the 7000-word paper and refining the protocol for public release.

  **Possible Outcomes**
  The project will succeed if it produces a stable set of conditions under which comparison is permissible.
  *Outcome A:* Comparability is robust across purposes, provided the unit and dimension are fixed. (Unlikely, but would simplify the protocol).
  *Outcome B:* Comparability is strictly purpose-relative. Rankings for compensation cannot be used for commemoration. (Most likely).
  *Outcome C:* The witness asymmetry proves decisive. Certain comparisons are only licensed when made by specific agents.

  The decision between these outcomes will rest on whether the forced-choice scenarios generate consistent intuitions across different agent perspectives. If the "offense" taken at ranking disappears when the purpose is clarified (e.g., "we are ranking to allocate funds, not to rank grief"), Outcome B is confirmed.

  **The Deliverable Protocol**
  The one-page protocol will be aimed at memorial boards and compensation commissions. It will contain three mandatory checkpoints:
  1.  **Unit Specification:** Define the temporal and causal boundaries of the events being compared.
  2.  **Dimension Selection:** Explicitly state which vector of harm is being weighed (e.g., "We are comparing scale of loss of life," not "We are comparing which was worse").
  3.  **License Check:** Identify who is making the judgment and for what end. If the end is commemoration, the protocol may advise against ranking entirely. If the end is resource allocation, it will require a dimension selection.

  **Failure Conditions**
  I define three specific conditions under which this project would fail:
  1.  **Collapse into Consequentialism:** If the framework cannot distinguish between qualitative harms without resorting to a single metric of "utility," it loses its moral advantage.
  2.  **Protocol Vagueness:** If the one-page protocol yields only platitudes (e.g., "be careful") rather than actionable constraints, it fails the practical test.
  3.  **Intractable Asymmetry:** If the witness asymmetry proves so radical that no cross-agent comparison is ever permissible, the project yields nihilism rather than guidance.

  **Scope and Constraints**
  To fit the nine-month timeline and solo budget, I must cut empirical fieldwork. I will not interview memorial boards or compensation commissioners. Instead, I will rely on public records of their decisions and constructed hypotheticals based on standard cases in the literature. This limits the project to normative theory rather than empirical ethics. I am also cutting a historical genealogy of how ranking has been used politically; the focus remains strictly on the conditions of moral license, not the history of the practice. This ensures the deliverable is a tool for current practitioners, not a history of memory.

  **Conclusion**
  The intuition that ranking atrocities is obscene is correct, but for the wrong reasons. It is not because comparison is impossible; it is because we are often comparing without specifying why. This project provides the architecture to make those comparisons honest, limited, and useful.
