answer: |-
  This is a remarkably sharp intuition. You have effectively rediscovered the central engine of the Kripke-Putnam revolution in the 1970s, but you are pressing on a specific structural feature that often gets glossed over in introductory summaries. You are noticing the gap between *how we identify* a referent and *what determines* the referent across possible worlds.

  Let's walk through the carving you are looking for, test it against your cases, and then see where the established terminology fits.

  ### The Carving: Epistemic Role vs. Metaphysical Role

  The distinction you are sensing is between two different "directions of fit" a word can have with the world.

  1.  **The Epistemic Role (The "Finder"):** This is the rule you use to pick out the object in the *actual* world, given your current state of knowledge. It answers the question: "What evidence would justify me in applying this word?" In your example, for water, this is the clear, drinkable liquid in the lakes. For Jack the Ripper, it is "the person who committed these specific murders."
  2.  **The Metaphysical Role (The "Anchor"):** This is the rule that determines whether the word applies to an object in *counterfactual* scenarios. It answers the question: "Once we have fixed what we are talking about, what makes it *that* thing in any other situation?" For water, this is H2O. For Jack the Ripper, it is the specific biological human being.

  Your intuition is that for some words, these two roles are **decoupled**, and for others, they **collapse**.

  *   **Decoupled (The Gap):** When the Epistemic Role is contingent (it could have been otherwise) but the Metaphysical Role is essential. This creates the "odd result" you noticed: the statement "Water is H2O" is *necessary* (true in all worlds where water exists) but *a posteriori* (we needed science to find the Metaphysical Role).
  *   **Collapsed (No Gap):** When the Epistemic Role *is* the Metaphysical Role. If you define a term as "whatever plays Role R," then finding the thing that plays Role R is both how you identify it and what makes it that thing. If the world changes so something else plays Role R, the word applies to the new thing.

  ### The Terminology (After the Carving)

  Now that we have the carving, we can look at the labels. There isn't one single name, but rather a cluster of terms depending on which philosophical framework you use.

  **1. Reference-Fixing Description vs. Semantic Content**
  Saul Kripke, in *Naming and Necessity*, argued that for proper names (like "Jack the Ripper") and natural kind terms (like "Water"), the description you use to identify the thing (the Epistemic Role) is merely a **reference-fixing description**. It pins the label to the object in the actual world. However, it does not give the **meaning** (or semantic content). The meaning is just the object itself.
  *   *Why this fits:* It explains why we don't say "There is no Jack the Ripper" if the description fails. The description was just a hook; the name refers to the man rigidly.
  *   *Why it feels thin:* As you noted, "Rigid Designator" only describes the Metaphysical Role. It doesn't formally account for the Epistemic Role as part of the linguistic machinery. Kripke largely treats the Epistemic Role as pragmatic or psychological, not semantic.

  **2. Primary vs. Secondary Intension (Two-Dimensional Semantics)**
  This framework (developed by philosophers like David Chalmers and Frank Jackson) formalizes your "two rules" exactly.
  *   **Primary Intension:** A function from worlds considered as *actual* to extensions. This captures your Epistemic Role. It asks: "If this world turns out to be the actual one, what does the word pick out?" (e.g., "the clear stuff in the lakes").
  *   **Secondary Intension:** A function from worlds considered as *counterfactual* to extensions. This captures your Metaphysical Role. It asks: "Given what water actually is (H2O), does this stuff in another possible world count as water?"
  *   *The Collapse:* For your "Role R" term, the Primary and Secondary Intensions are identical. For "Water," they come apart. This is the most precise technical match for your intuition.

  ### Distinguishing from Other Distinctions

  You asked how this differs from other famous dichotomies. Here is the differentiation:

  *   **Sense vs. Reference (Frege):** Frege believed the Sense (Epistemic Role) *determined* the Reference in all worlds. He thought the two rules were the same rule. Your observation is essentially the proof that Frege was wrong about modality. For Frege, "Water is H2O" would be contingent (because the sense is "clear liquid," and clear liquid might not be H2O elsewhere). You have identified the break between Sense and Reference that Kripke exploited.
  *   **Meaning in the Head vs. World (Externalism):** This explains *why* the gap exists (because the world contributes to meaning), but it doesn't describe the *structure* of the gap. Externalism is the ontology; your "two rules" are the semantics.
  *   **Rigid Designation:** As you suspected, this is too thin. "Rigid" just means the Metaphysical Role tracks the same object across worlds. It doesn't explain the Epistemic Role. A term can be rigid ("Water") or non-rigid ("The President"), but both have Epistemic Roles. Your distinction applies to both; the difference is whether the Epistemic Role matches the Metaphysical Role.
  *   **Reference-Fixing without Meaning:** This is the Kripkean view. It matches your "Jack the Ripper" case well. However, for "Water," Putnam argued the microstructure *is* part of the meaning, not just the reference. So for natural kinds, the Metaphysical Role is semantic, whereas for names, it might just be referential.

  ### Boundary Cases: Where does it stop applying?

  This is where the philosophy gets messy, and your intuition is the right guide.

  **1. Indexicals ("I", "Here")**
  David Kaplan distinguished **Character** (the rule, e.g., "the speaker") from **Content** (the referent, e.g., "John").
  *   *Does it fit?* Yes. The Character is your Epistemic Rule (look for the speaker). The Content is the Metaphysical Anchor.
  *   *The Difference:* The rule is linguistic, not empirical. You don't need an experiment to know who "I" refers to; you just need the context. So the "gap" is logical, not scientific.

  **2. Social Kinds ("Money")**
  *   *Analysis:* "Money" is defined by its function (Role R: medium of exchange, store of value).
  *   *Verdict:* This looks like your **Collapse** case. If we found a society where shells were used instead of paper, we call the shells money. If we imagine a counterfactual world where paper exists but no one accepts it as exchange, it isn't money there. The Epistemic Role (looks like currency) and Metaphysical Role (functions as currency) are tightly bound. If they come apart (fake money), we say it's *not* money, not that we were wrong about the nature of money.

  **3. Natural Kinds with Evolving Science ("Gene")**
  *   *Analysis:* Historically, "gene" was defined functionally (unit of heredity—Collapse case). Now, it is defined structurally (DNA sequence—Gap case).
  *   *Verdict:* This shows that the "Two Rules" status of a term can *change* over time. As science progresses, we often try to move terms from the "Collapse" category (functional definitions) to the "Gap" category (essential definitions). This creates philosophical friction (e.g., "Is junk DNA a gene?").

  ### Summary Conclusion

  You have identified the distinction between **Epistemic Identification Conditions** and **Metaphysical Truth Conditions**.

  *   When they **come apart**, you have **Natural Kind Terms** or **Proper Names** (in the Kripkean view). This yields the **Necessary A Posteriori**. The technical framework that best models this is **Two-Dimensional Semantics** (Primary vs. Secondary Intension).
  *   When they **collapse**, you have **Functional Terms** or **Explicit Definitions**. This yields the **Contingent A Priori** (if you define it as "the actual F") or simple contingency.

  The "odd result" you find—that you need an experiment to know a necessary truth—is the hallmark of the gap between these two rules. The experiment tells you which Metaphysical Anchor is attached to your Epistemic Hook. Once you know that, modality takes over, and the truth becomes necessary.

  So, the carving is real, it is central to modern philosophy of language, and the most robust framework for handling it is **Two-Dimensionalism**, which treats your "two rules" as two distinct dimensions of meaning rather than trying to force one to do the work of both.
