      *   *Work done:* It does heavy lifting. It rules out "conspiratorial" correlations between prepared systems.

  5.  **Addressing Specific Question 3: Surviving Research Programs:**
      *   *Bohmian Mechanics:* Survives. It is psi-ontic (the wavefunction is a real guiding field). It satisfies PBR. Defenders object to the claim that it's ruled out (Sentence 3 of the article).
      *   *Everettian (Many Worlds):* Survives. The wavefunction is the whole reality (psi-exhaustive). It is psi-ontic. Defenders object to the claim that collapse is the only remaining question (Sentence 7).
      *   *QBism:* Survives, but by rejecting the framework. QBism denies that there is an underlying "ontic state" $\lambda$ in the sense PBR requires. They treat the theorem as a reductio of the ontological models framework, not of QBism. Defenders object to Sentence 6.
      *   *Nomological/Instrumental:*
          *   *Nomological (e.g., Goldstein/Zanghi view of Bohm):* If the wavefunction is a law, is it "real"? PBR says it can't be *merely* information about hidden variables if those variables are independent. But if it's a law governing the variables, it might fit psi-ontic (as a real relation/field). Usually, nomological views in Bohmian context treat psi as real but not material. PBR is compatible with psi being part of the ontology.
          *   *Instrumental:* If instrumentalism means "no underlying reality," PBR doesn't touch it because PBR assumes there *is* an underlying reality ($\lambda$). Instrumentalists deny the premise.
      *   *Single System:* PBR essentially requires multiple systems (tensor products) to derive the contradiction. Single-system no-go theorems for psi-epistemic models exist (e.g., Hardy, or variants), but PBR specifically relies on independent preparations of multiple systems to amplify the distinguishability.

