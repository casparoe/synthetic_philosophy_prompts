      *   *"Real":* In PBR context, "real" (psi-ontic) just means "distinct quantum states imply distinct physical states." It does *not* necessarily mean the wavefunction is a material field or the *only* thing that exists.

  4.  **Addressing Specific Question 2: The Independence Assumption:**
      *   *Role:* Crucial. PBR requires preparing two systems independently such that their ontic states are uncorrelated.
