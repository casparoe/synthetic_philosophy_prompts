answer: |-
  ### Part 1: Sentence-by-Sentence Audit

  **Sentence 1:** "In the 1920s it was still possible to hope that the wavefunction was only a bookkeeping device — a summary of what an experimenter knows about a system, the way a probability distribution summarizes what a gambler knows about a coin."
  *   **Verdict:** **Accept.**
  *   **Comment:** This is a historically accurate characterization of the epistemic view held by figures like Einstein and later proponents of statistical interpretations. The analogy to classical probability is the standard way to explain the psi-epistemic position.

  **Sentence 2:** "In 2012 three physicists closed that question for good."
  *   **Verdict:** **Wrong.**
  *   **Correction:** "In 2012 three physicists presented a theorem that significantly constrained that question, provided one accepts specific metaphysical assumptions."
  *   **Comment:** Foundational questions in physics are rarely "closed for good." The PBR theorem relies on a specific framework (ontological models) and assumptions (preparation independence) that are themselves subject to debate.

  **Sentence 3:** "Building on Bell's theorem, which had already shown that no locally causal hidden-variable theory can reproduce the quantum predictions, they proved that no hidden-variable theory of any kind can either..."
  *   **Verdict:** **Wrong.**
  *   **Correction:** "...they proved that no *psi-epistemic* ontological model can reproduce the quantum predictions..."
  *   **Comment:** This is a critical category error. Bell's theorem constrains *locality*. PBR constrains the *ontological status of the wavefunction*. Bohmian mechanics is a hidden-variable theory (particles are the hidden variables) that reproduces quantum predictions and is fully compatible with PBR. PBR does not rule out hidden variables; it rules out models where the wavefunction is *merely* information about those variables.

  **Sentence 3 (continued):** "...any model in which a quantum state represents mere information about an underlying physical state of the system, and in which systems prepared independently have independent physical states, must make predictions that contradict those of quantum theory."
  *   **Verdict:** **Accept.**
  *   **Comment:** This is a technically accurate summary of the theorem's actual logical structure. It correctly identifies the two key premises: the psi-epistemic condition and the preparation independence assumption.

  **Sentence 4:** "The wavefunction is therefore not a state of knowledge but a state of reality — a physical field, albeit one defined not on ordinary three-dimensional space but on a configuration space whose dimension grows with the number of particles."
  *   **Verdict:** **Wince.**
  *   **Comment:** The first clause ("state of reality") is acceptable shorthand for "psi-ontic," but the second clause ("a physical field...") is an unwarranted metaphysical leap. PBR establishes that distinct quantum states correspond to distinct physical states. It does not prove the wavefunction is a *field* (it could be a law, a property of particles, or a component of a larger state), nor does it settle the debate over configuration space realism versus three-dimensional space realism.

  **Sentence 5:** "A system's physical state is nothing over and above its wavefunction."
  *   **Verdict:** **Wrong.**
  *   **Correction:** "A system's wavefunction is fixed by its physical state."
  *   **Comment:** This claims "state-exclusivity" (the wavefunction is the *only* physical stuff). PBR only establishes "state-supervenience" (the physical state determines the wavefunction). You can have a physical state consisting of the wavefunction *plus* particle positions (as in Bohmian mechanics), which satisfies PBR but contradicts this sentence.

  **Sentence 6:** "The Copenhagen interpretation is finished, and with it recent attempts such as QBism that treat quantum states as degrees of belief."
  *   **Verdict:** **Wrong.**
  *   **Comment:** "Copenhagen" is a label for a diverse cluster of views, some of which are compatible with psi-ontic conclusions. More importantly, QBism explicitly rejects the "ontological models framework" that PBR assumes. QBists argue that measurement outcomes do not reveal pre-existing properties of a system in the way PBR requires. Therefore, PBR does not refute QBism; it refutes QBism *only if* you first accept the realist premises that QBists deny.

  **Sentence 7:** "What survives of the measurement problem is a well-defined dynamical question: by what physical mechanism does a real wavefunction collapse?"
  *   **Verdict:** **Wince.**
  *   **Comment:** This assumes that "real wavefunction" entails "collapse." No-collapse realist interpretations (like Everettian quantum mechanics) treat the wavefunction as real but deny that it collapses. This sentence incorrectly implies that dynamical collapse theories are the only realist option remaining.

  **Sentence 8:** "It closes with the aside that the result has since been confirmed in the laboratory."
  *   **Verdict:** **Wince.**
  *   **Comment:** Experiments have confirmed the *quantum predictions* used in the PBR argument. They have not confirmed the *metaphysical conclusion* without caveats, because the experiment cannot test the "preparation independence" assumption directly. That assumption remains a theoretical postulate about the nature of the preparation devices, not an experimentally verified fact.

  ***

  ### Part 2: Specific Conceptual Questions

  #### 1. Ontological Distinctions (Supervenience, Constitution, Exclusivity)

  Your seminar handout's three-way distinction is coherent and aligns with the standard Harrigan-Spekkens framework used in foundations. Here is how the PBR result maps onto them:

  *   **State-Supervenience:** This claims that the complete physical state ($\lambda$) fixes the quantum state ($\psi$). In technical terms, the probability distributions over $\lambda$ for distinct $\psi$ do not overlap. **PBR establishes this.** If two systems have different wavefunctions, they must have different underlying physical states.
  *   **State-Constitution:** This claims $\psi$ is a *part* of $\lambda$, but $\lambda$ might contain other things (like particle positions). **PBR is compatible with this.** Bohmian mechanics is the prime example: $\lambda = (\psi, \text{positions})$. The wavefunction is real and part of the state, but not the whole state. PBR does not rule this out.
  *   **State-Exclusivity:** This claims $\lambda = \psi$ (nothing but the wavefunction). **PBR does not establish this.** The theorem allows for "extra" hidden variables, provided they don't allow different $\psi$ to share the same $\lambda$.

  **Does "real" mean more than distinct states correspond to distinct physical states?**
  No. In the context of the theorem, "psi-ontic" (or "real") means precisely that distinct quantum states correspond to disjoint distributions over the ontic state space. It does not imply the wavefunction is a material field, nor does it imply it is the *only* thing that exists. The magazine article conflates "psi-ontic" with "psi-exhaustive" (Exclusivity), which is the source of its major errors.

  #### 2. The Independence Assumption

  **Is the assumption doing more work than the article admits?**
  Yes. The "Preparation Independence" assumption is the heavy lifter of the theorem. It states that if you prepare two systems independently, their underlying physical states are uncorrelated. Without this, you can construct psi-epistemic models that reproduce quantum predictions by allowing "conspiratorial" correlations between the hidden variables of the two systems.

  **Could an experiment corroborate a result whose extra premise concerns the physical states of independently prepared systems?**
  No, not directly. An experiment can verify the statistical predictions of quantum mechanics (the inequalities derived in the PBR proof). However, the assumption that the *ontic states* are independent is metaphysical. You can ensure your lasers and crystals are causally isolated, but you cannot measure the ontic states $\lambda$ to verify they are uncorrelated. If nature violates preparation independence (e.g., via superdeterminism or holistic constraints on state space), the experimental results would look the same, but the conclusion that the wavefunction is ontic would not follow. The experiment confirms the *conditional*: "If preparation independence holds, then the wavefunction is ontic." It does not confirm the antecedent.

  #### 3. Surviving Research Programs

  **Bohmian Mechanics:**
  *   **Status:** **Untouched.**
  *   **Reason:** Bohmian mechanics is a psi-ontic theory. The wavefunction is a real guiding field. It satisfies the PBR conclusion.
  *   **Objection:** Defenders would object to Sentence 3 of the article, which claims PBR rules out hidden-variable theories. Bohmians would point out their theory is a counterexample to that claim.

  **Everettian Quantum Mechanics (Many Worlds):**
  *   **Status:** **Untouched.**
  *   **Reason:** Everettians believe the wavefunction is the complete physical state (State-Exclusivity). This is fully compatible with PBR.
  *   **Objection:** Defenders would object to Sentence 7, which suggests collapse is the only remaining dynamical question. Everettians deny collapse occurs.

  **QBism:**
  *   **Status:** **Untouched (by rejection of premises).**
  *   **Reason:** QBism denies the "ontological models framework." It denies that measurement outcomes reveal pre-existing properties of a system ($\lambda$) in the way PBR assumes. For a QBist, PBR is a *reductio ad absurdum* of the assumption that quantum states describe an observer-independent reality, not a proof that they do.
  *   **Objection:** Defenders would object to Sentence 6. They argue PBR assumes a realist view of probability and measurement that QBism explicitly rejects.

  **Nomological Views (e.g., Wavefunction as Law):**
  *   **Status:** **Complicated/Untouched.**
  *   **Reason:** If the wavefunction is viewed as a law of nature (rather than a physical object), one must check if this fits the "psi-ontic" definition. In Bohmian nomological views, the wavefunction is real but not a material field. PBR requires the wavefunction to be a property of the system's state. If the "law" is part of the physical description of the system, it survives.
  *   **Objection:** Defenders would object to Sentence 4's claim that the wavefunction is a "physical field." They might argue it is a real relation or law, not a field.

  **Instrumentalism:**
  *   **Status:** **Untouched.**
  *   **Reason:** Instrumentalism denies there is any underlying physical state $\lambda$ at all. PBR assumes such a state exists. If you deny the premise, the conclusion doesn't apply.
  *   **Objection:** Defenders would object to the entire framing of the article, which assumes a realist interpretation is mandatory.

  **Single System vs. Multiple Systems:**
  *   **Technical Point:** The 2012 PBR argument essentially requires several independently prepared systems (tensor product structure) to derive the contradiction. The orthogonality required to distinguish the epistemic distributions is achieved by combining multiple copies. While there are subsequent single-system no-go theorems for psi-epistemic models (e.g., by Hardy or modified PBR variants), the specific 2012 result cited in the article relies on the independence of multiple preparations.
