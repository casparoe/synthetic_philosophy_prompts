  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the friend's debate. State the thesis: The Tempe crash isn't a true *responsibility gap*; it's a *responsibility displacement* masked as a gap, illuminated by the moral crumple zone concept.

      *   **Direction 1: Theory Illuminating the Crash (Responsibility Gap & Crumple Zone):**
          *   *Responsibility Gap:* Apply the definition. Machine acted, human didn't intervene. Superficially looks like a gap. The AI couldn't be blamed (not an agent). The driver *could* be blamed legally, but was it fair?
          *   *Moral Crumple Zone:* This is the stronger lens. The driver (Vasquez) became the crumple zone. She absorbed the legal and public wrath.
          *   *Mapping the Decisions:*
              *   *Technical:* Disabling Volvo AEB. This is a crucial causal link. It wasn't an AI "hallucination" only; it was a design choice to prioritize ride comfort over safety redundancy.
