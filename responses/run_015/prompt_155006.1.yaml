      *   **Direction 2: The Crash Illuminating the Theory (Where Theory Breaks/Needs Change):**
          *   *Critique of "Gap":* The term "Responsibility Gap" implies *no one* can be held responsible. In Tempe, *many* could have been, but the structure protected the top. The gap is manufactured, not inevitable.
          *   *The "Human-in-the-Loop" Myth:* Theory often assumes the human *can* intervene. Tempe proves that in high-automation, the human is a component, not a controller. If the system is designed to fail silently (no alert until too late), the human is decoration.
          *   *Organizational Negligence vs. Systemic Gap:* If we find specific negligent actors (engineers who disabled brakes, execs who set timelines), the "gap" closes. The theory needs to account for *corporate agency*. The "Autonomous System" label is a liability shield.
          *   *Refining Moral Crumple Zone:* It's not just about blame absorption; it's about *blame redirection*. The theory needs to emphasize the *intent* of the design (optimizing for deployment speed over safety).

      *   **Synthesis/Conclusion:**
