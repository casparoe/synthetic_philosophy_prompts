prompt: |-
  Hi — I'm on the grants committee of a small family foundation (five trustees, monthly meetings, maybe a dozen grants a year out of about a million dollars total, and the closest thing we have to a research capacity is me with a spreadsheet). We keep having the same arguement and I want to stop having it by turning it into a form we fill in.

  The argument in one paragraph: almost every proposal has near-term effects we can sort of see and long-run effects we can't see at all. Cash transfers to very poor households obviously help the recipients, but they also move local prices, and migration, and maybe fertility, and therefore possibly who exists in twenty years. The deworming proposal has beautiful trial evidence on school attendance, thin evidence on earnings, and no evidence whatsoever on what a slightly better-educated cohort does to a country's politics or growth rate. And then we get asks like a curriculum-reform advocacy group where the entire case is long-run and the near-term is invisible. Two of us have fallen into saying "we're clueless about the long run, therefore the near-term numbers shouldn't be allowed to decide it", and three say "the numbers are all we've got, therefore they should decide it", and if I'm honest both sides are using cluelessness as a route to a verdict they already liked.

  So: write me a decision procedure we can actually run on a proposal in an afternoon. Fixed order of questions, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to humans because the issue is one of values rather than evidence. It has to meet some constraints:

  - It can't require a number we have no way of getting. If a step needs a parameter, say what to do when it's unobtainable.
  - It has to terminate. We can't spend a meeting asking whether we're clueless about whether we're clueless.
  - I want it to separate two kinds of causal channel, roughly: ones where the effect enters through a damped, near-additive pathway (a consumable delivered once, a one-off medical treatment) and ones where it enters through a system that amplifies and redistributes — prices, norms, institutions, anything that changes what other agents later do. My hypothesis is that cluelessness is mainly a property of the second kind and that the procedure should treat the first kind as decideable on near-term numbers. Tell me if that's wrong.
  - Related: somewhere in it there should be a sign-stability check — not "estimate the size" but "would the sign of the total effect stay the same across a spread of background assumptions we can't distinguish between?" If the sign flips, I want the procedure to say the expected-value calculation was unearned, and to say what we do instead (fall back to option value? to reversibility? to near-term numbers as a tie-breaker only?).
  - It should flag explicitly when an intervention's main effect is identity-affecting — changes how many people exist, or when, or which ones — because that's where our committee visibly falls apart, and I suspect a lot of the rest of the disagreement is really about that.
  - And it should handle the fact that our counterfactual — the donor spending the money on something else, or the money not existing — is just as opaque as the grant.

  Then apply it to two proposals: the deworming program, and the curriculum-reform advocacy group. Include at least one place where the procedure gives an answer our committee won't like, and don't soften it. Finally, tell me which steps are judgement calls wearing a lab coat, and what the procedure simply cannot tell us.

  Keep it under 700 words, no citations or reading suggestions (we won't read them), and write it so the retired doctor and the lawyer on the comittee could follow it without me in the room.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Grants committee member of a small family foundation (5 trustees, $1M/year, ~12 grants).
      *   **Problem:** Recurring argument about near-term measurable effects vs. long-term uncertain effects (cluelessness). Some trustees prioritize near-term numbers, others dismiss them due to long-term uncertainty. Both sides use uncertainty strategically.
      *   **Goal:** A decision procedure (form/checklist) to resolve this in an afternoon.
      *   **Constraints:**
          *   Fixed order of questions.
          *   Define adequate answers & stop conditions (No vs. Human Decision).
          *   No impossible data requirements (handle missing parameters).
          *   Must terminate (no infinite regress).
          *   Distinguish causal channels: Damped/Near-additive (consumables, one-off treatments) vs. Amplifying/Systemic (prices, norms, institutions).
          *   Include a sign-stability check (does the effect sign flip under different assumptions?).
          *   Flag identity-affecting interventions (population changes).
          *   Handle opaque counterfactuals (what else would the money do?).
          *   Apply to two cases: Deworming program vs. Curriculum-reform advocacy.
          *   Include at least one uncomfortable answer.
          *   Identify "judgement calls wearing a lab coat" and limitations.
          *   **Length:** Under 700 words.
          *   **Tone:** Accessible to a retired doctor and a lawyer (no jargon, no citations).

  2.  **Drafting the Procedure:**
      *   Need a step-by-step flow.
      *   *Step 1: Counterfactual.* What happens if we don't fund? (Keep it simple: Status quo vs. Other donor).
      *   *Step 2: Causal Type.* Damped vs. Amplifying.
      *   *Step 3: Identity Check.* Does this change who exists?
      *   *Step 4: Sign Stability.* Does the good stay good under different assumptions?
      *   *Step 5: Decision Rule.* Based on previous steps.

  3.  **Refining the Steps (incorporating constraints):**
      *   *Constraint:* Handle missing data. *Solution:* Use "Best Available Estimate" or "Conservative Bound".
      *   *Constraint:* Terminate. *Solution:* Max 5 steps.
      *   *Constraint:* Sign stability. *Solution:* Explicit question about sign flipping.
      *   *Constraint:* Identity affecting. *Solution:* Explicit flag.
      *   *Constraint:* Damped vs. Amplifying. *Solution:* Classification step.

  4.  **Drafting the Content (Iterative):**

      *   *Intro:* Brief context.
      *   *The Procedure:*
          1.  **Counterfactual Baseline:** If we don't fund, does the activity happen anyway? If yes, stop (No). If unknown, assume 50% displacement.
          2.  **Causal Pathway:** Is the main effect *damped* (direct consumption/treatment) or *amplifying* (changing systems/norms/prices)?
          3.  **Identity Check:** Does the intervention primarily change *who* is born or *when*? If yes, flag as "Identity-Affecting."
          4.  **Sign Stability:** Across three plausible future scenarios (optimistic, pessimistic, status quo), does the net impact remain positive? If no, mark "Unstable."
          5.  **Decision Rule:**
              *   If Damped + Stable Sign + Not Identity-Affecting → Fund based on near-term numbers.
              *   If Amplifying OR Identity-Affecting OR Unstable Sign → Near-term numbers are tie-breakers only. Decision requires explicit values vote (majority rules).
      *   *Applications:*
          *   Deworming: Damped (health), Stable (health good), Not Identity. → Fund.
          *   Advocacy: Amplifying (policy), Unstable (policy might backfire), Maybe Identity (growth effects). → Values vote.
      *   *Uncomfortable Truth:* The procedure might force funding a boring thing over an exciting thing, or vice versa. Or it might admit we can't know. Let's make the Advocacy group fail the "Sign Stability" hard.
      *   *Limitations:* What is judgement vs. math.

  5.  **Word Count Check & Tone:**
      *   Need to be concise.
      *   Avoid academic jargon ("expected utility", "longtermism"). Use "good/bad", "numbers", "guesses".
      *   Ensure the "uncomfortable answer" is clear.
      *   Ensure the "judgement calls" section is distinct.

  6.  **Writing - First Pass (Mental):**
      Start with the form.
      Q1: Counterfactual. If money doesn't go here, does it go elsewhere? If we don't know, assume half is wasted.
      Q2: Mechanism. Direct (pills) or Systemic (rules)?
      Q3: Identity. Does it change population?
      Q4: Sign Check. Does good become bad under stress?
      Decision: If Direct + Stable + No Identity -> Go with numbers. If Systemic/Identity/Unstable -> Values vote.
      Apply to Deworming: Direct, Stable. Fund.
      Apply to Advocacy: Systemic, Unstable. Values vote.
      Uncomfortable: Advocacy might get rejected if values don't align, despite high upside.
      Limitations: Defining "Systemic" is subjective.

  7.  **Writing - Second Pass (Refining for constraints & word count):**
      *   Make it a literal form structure.
      *   Ensure the "Damped vs Amplifying" distinction is clear as per user hypothesis (validate it).
      *   Ensure the "Sign Stability" leads to a specific action (fallback to option value/reversibility).
      *   Check word count strictly.

      *Drafting text:*
      **The Foundation Decision Protocol**

      **Step 1: The Counterfactual**
      Question: If we do not fund this, does the work happen anyway?
      Answer: Yes / No / Unknown.
      Rule: If Yes, reject. If Unknown, discount claimed benefit by 50%.

      **Step 2: Causal Pathway**
      Question: Is the primary benefit *Direct* (goods/services consumed once) or *Systemic* (changing rules, prices, norms, or institutions)?
      Rule: Mark as "Direct" or "Systemic."
      Note: Direct effects dampen over time. Systemic effects amplify or redistribute.

      **Step 3: Identity Check**
      Question: Does the main mechanism change who exists, when they are born, or total population size?
      Rule: If Yes, flag as "Identity-Affecting."

      **Step 4: Sign Stability**
      Question: Under three scenarios (Best Case, Worst Case, Status Quo), does the net impact remain positive?
      Rule: If the sign flips (good becomes bad), mark as "Unstable."

      **Step 5: The Decision**
      *   **Green Light:** Pathway is Direct + Sign is Stable + Not Identity-Affecting.
          *   *Action:* Fund based on near-term cost-effectiveness numbers. Long-term uncertainty is ignored.
      *   **Yellow Light:** Pathway is Systemic OR Identity-Affecting OR Sign is Unstable.
          *   *Action:* Near-term numbers are tie-breakers only. Trustees must vote based on values/risk tolerance. If split 2-2, default to Reversibility (can we stop later?). If irreversible, default to No.

      **Application**
      **1. Deworming Program**
      Step 1: No (funding needed).
      Step 2: Direct (medical treatment).
      Step 3: No (health improvement doesn't significantly alter identity).
      Step 4: Stable (health is good in all scenarios).
      *Verdict:* Green Light. Fund based on cost-per-child.
      *Uncomfortable Truth:* This prioritizes measurable health over potentially huge but uncertain systemic gains.

      **2. Curriculum-Reform Advocacy**
      Step 1: Unknown (discount 50%).
      Step 2: Systemic (changes institutions/norms).
      Step 3: Possibly (growth affects population).
      Step 4: Unstable (policy could entrench bad norms or fail).
      *Verdict:* Yellow Light. Numbers don't decide. Requires values vote. If trustees disagree on the politics, default to No (irreversible policy change).
      *Uncomfortable Truth:* High-upside advocacy is structurally disadvantaged against boring direct aid unless trustees unanimously agree on the vision.

      **Limitations & Judgement Calls**
      This procedure cannot tell you what values to hold. It separates evidence from values, but does not supply the values.
      *Judgement Calls:* Distinguishing "Direct" from "Systemic" is subjective (e.g., does education count as direct?). Assessing "Sign Stability" relies on imagination, not data.
      *What it cannot do:* It cannot resolve disagreement about whether changing the future is better than helping the present. It forces you to admit when you are guessing.

