answer: |-
  **The Foundation Decision Protocol**

  **Step 1: The Alternative Use**
  *Question:* If we do not fund this, does the work happen anyway?
  *Answer:* Yes / No / Unknown.
  *Rule:* If Yes, stop (Reject). If Unknown, discount claimed benefit by 50%.

  **Step 2: Causal Pathway**
  *Question:* Is the primary benefit **Direct** (goods/services consumed once, e.g., pills, cash) or **Systemic** (changing rules, prices, norms, or institutions)?
  *Rule:* Mark as "Direct" or "Systemic."
  *Note:* Direct effects dampen over time. Systemic effects amplify or redistribute.

  **Step 3: Identity Check**
  *Question:* Does the main mechanism change who exists, when they are born, or total population size?
  *Rule:* If Yes, flag as "Identity-Affecting."

  **Step 4: Sign Stability**
  *Question:* Under three scenarios (Best Case, Worst Case, Status Quo), does the net impact remain positive?
  *Rule:* If the sign flips (good becomes bad), mark as "Unstable."

  **Step 5: The Decision**
  *   **Green Light:** Pathway is Direct + Sign is Stable + Not Identity-Affecting.
      *   *Action:* Fund based on near-term cost-effectiveness numbers. Long-term uncertainty is ignored.
  *   **Yellow Light:** Pathway is Systemic OR Identity-Affecting OR Sign is Unstable.
      *   *Action:* Near-term numbers are tie-breakers only. Trustees must vote based on values/risk tolerance. If split 2-2, default to **Reversibility**. Can we stop later if it goes wrong? If No (irreversible), default to **Reject**.

  ***

  **Application**

  **1. Deworming Program**
  *   **Step 1:** No (funding needed).
  *   **Step 2:** Direct (medical treatment).
  *   **Step 3:** No (health improvement doesn't significantly alter identity).
  *   **Step 4:** Stable (health is good in all scenarios).
  *   **Verdict:** **Green Light.** Fund based on cost-per-child.
  *   *Note:* This validates near-term numbers despite long-term cluelessness.

  **2. Curriculum-Reform Advocacy**
  *   **Step 1:** Unknown (discount 50%).
  *   **Step 2:** Systemic (changes institutions/norms).
  *   **Step 3:** Possibly (growth affects population).
  *   **Step 4:** Unstable (policy could entrench bad norms or fail).
  *   **Verdict:** **Yellow Light.** Numbers don't decide. Requires values vote. If trustees disagree on the politics, default to **Reject** (policy change is hard to reverse).
  *   *Uncomfortable Truth:* High-upside advocacy is structurally disadvantaged against boring direct aid unless trustees unanimously agree on the vision.

  ***

  **Limitations & Judgement Calls**

  This procedure separates evidence from values, but does not supply the values.

  **Judgement Calls Wearing a Lab Coat:**
  1.  **Direct vs. Systemic:** Distinguishing these is subjective. Is education a direct service or a systemic norm changer? The committee must agree on a classification before scoring.
  2.  **Sign Stability:** Assessing "Worst Case" relies on imagination, not data. A pessimistic trustee can always manufacture a bad scenario to trigger a Yellow Light.

  **What It Cannot Tell Us:**
  It cannot resolve disagreement about whether changing the future is better than helping the present. It forces you to admit when you are guessing, but it cannot tell you how much risk you should take on those guesses. If the committee is split on values, this protocol defaults to safety (Reject), which may preserve capital but miss transformative opportunities.
