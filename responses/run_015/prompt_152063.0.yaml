answer: |-
  You must establish the distinction between truth-conditional content and conventional force using a neutral operator like "but" versus "and" before introducing the slur accounts, or students will collapse the pragmatic explanation into "just speaker intent."

  ### 1. Pre-Embedding Prep (10 mins)
  Before touching slurs, you must give them the logical tools to see the embedding test. They know truth-conditions; they do not know pragmatics.
  *   **The Neutral Analogy:** Write "John is poor but honest" vs. "John is poor and honest."
  *   **The Test:** Ask: "If I say 'It's not the case that John is poor but honest,' did I deny he is honest?" (No, I denied the contrast). "If I say 'If John is poor but honest...'" (The contrast survives).
  *   **The Lesson:** Some meaning (the contrast) survives embedding where truth-conditions don't, yet it isn't "what is said." This creates the conceptual bucket for "derogation as force" later.
  *   **Harm Agreement:** State explicitly now: "Both theories we will look today agree the word causes harm and restricts usage. They disagree on *where* in the grammar the harm lives."

  ### 2. The Example Pair (Selection Criteria)
  Do not use the N-word or C-word; the taboo will halt analysis. Do not use "Illegal/Undocumented"; the neutral term is politically contested.
  *   **Recommendation:** **"Queer" (slur/reclaimed) vs. "Gay" (neutral).**
  *   **Has:** Clear historical derogation, visible in-group reclamation (Queer Studies, Queer Nation), neutral counterpart ("Gay") is not heard as a slur.
  *   **Lacks:** Extreme volatility that silences the room (provided you frame it as a linguistic dataset).
  *   **Warning:** Explicitly state you are using these terms as *data*, not endorsements. If your demographic makes "Queer" too volatile, swap for **"Bitch" vs. "Woman"**, noting reclamation in pop culture, but warn that gender dynamics may distract from the semantics.

  ### 3. Ordering the Accounts (20 mins)
  Do not present one as the "solution" to the other. Present them as competing explanations for the embedding data.
  *   **Order:** **Semantic Account first, then Pragmatic Account.**
  *   **Why:** They already know semantics (truth-conditions). Leveraging this makes the Semantic Account feel familiar, not "obviously correct." If you start with Pragmatics, they will treat it as "just intent" (a misconception).
  *   **Semantic Account (Content View):** Derogation is part of the truth-conditions. "X is a [slur]" is true only if X is [group] AND X is deserving of contempt.
      *   *Strength:* Explains why you can't use the word without derogating.
      *   *Weakness:* Struggles with reclamation (how can the truth-conditions change?) and embedding (does the contempt survive negation?).
  *   **Pragmatic Account (Force View):** Derogation is conventional force (like "but"). Reference is the same as neutral; the word *does* something rather than *says* something.
      *   *Strength:* Explains reclamation (changing the force/use) and embedding (force can be suspended).
      *   *Weakness:* Risks sounding like "it's just how you use it" (intent).
  *   **Defusing Misconceptions:**
      *   *'Same referent so same meaning':* Kill this in the **Pre-Embedding Prep** with the "but/and" analogy.
      *   *'Just speaker intent':* Kill this when introducing the **Pragmatic Account**. Emphasize *conventional* force (linguistic rule), not psychological intent.
      *   *'If not truth-conditional, not really meaning':* **Let this sit.** When you introduce the Pragmatic Account, allow them to feel the tension that "meaning" might be broader than "truth conditions." Do not resolve this until the final summary. This is the philosophical core of the lesson.
      *   *'Offensive vs. Derogatory':* Address during **Example Selection**. Clarify that "offensive" is about feeling upset; "derogatory" is about subordinating a group. A word can be offensive without being a slur (e.g., profanity), and a slur can be used without immediate offense (in-group).

  ### 4. Reclamation (10 mins)
  Use the same example pair. This tests both accounts without introducing new variables.
  *   **The Data:** In-group members use the slur without derogation.
  *   **Semantic Challenge:** If derogation is truth-conditional, is the in-group user lying? Or has the word changed meaning?
  *   **Pragmatic Challenge:** If derogation is force, how is the force disabled? (Answer: Convention change).
  *   **Consensus Check:** Reiterate that both sides agree the word is harmful when used *out-group*, preventing the Pragmatic view from sounding like an excuse.

  ### 5. Board Question & Refusal (10 mins)
  *   **The Question:** Write: **"John is a [slur] but I don't condemn him."**
      *   Ask: "Is this a contradiction?"
      *   **Semantic Account:** Yes (or nearly). You asserted the derogation in the first clause, denied it in the second.
      *   **Pragmatic Account:** No. You asserted the reference, but cancelled the force.
      *   *Instruction:* Have them vote, then reveal which theory predicts which answer.
  *   **What to Refuse to Settle:** Do not decide between **Conventional Implicature vs. Expressive Content vs. Presupposition**. Tell them: "Linguists fight over the formal machinery for this. Today we care about the distinction between content and force, not the formal label."
  *   **Settled vs. Live:**
      *   **Settled:** Slurs differ from neutrals despite coreference; embedding tests are the diagnostic tool; harm is real regardless of theory.
      *   **Live:** Whether derogation is truth-conditional or pragmatic; how reclamation formally works; whether there is one mechanism for all slurs.

  ### 6. Timing Check
  *   0-10: Neutral Analogy & Harm Agreement.
  *   10-30: The Two Accounts (Semantic then Pragmatic) + Misconception defusing.
  *   30-40: Reclamation Case Study.
  *   40-50: Board Question & Open Disputes.
