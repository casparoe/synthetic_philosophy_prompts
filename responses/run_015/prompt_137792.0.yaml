answer: |-
  Here is the one-line summary for your handout: **In this session, you will play a simple betting game that forces you to betray your own pre-set rules, then use that friction to locate the hidden commitments driving your characters.**

  ### The Activity: "The Counterfactual Promise"

  **Materials Needed:**
  *   12 small envelopes.
  *   24 index cards (2 per person).
  *   Pens (12).
  *   Poker chips or printed paper tokens (start each person with 10).
  *   One large coin (visible to all) or 12 small coins.
  *   A whiteboard or flipchart (for scoring totals only, no equations).

  **The Rules (For You):**
  1.  **Phase 1 (The Policy):** Participants write "YES" or "NO" on Card 1 answering: *"If the coin lands TAILS, will you pay 3 chips?"* They seal Card 1 in an envelope without showing anyone.
  2.  **Phase 2 (The Reality):** Flip the coin publicly.
      *   **If HEADS:** They receive 8 chips *only if* Card 1 says "YES." (They do not pay anything).
      *   **If TAILS:** The 8 chips are unavailable. They are handed Card 2 and asked: *"The coin is TAILS. Do you choose to pay 3 chips now?"* They write YES/NO on Card 2 and hand over chips if applicable. (Card 1 remains sealed).
  3.  **Phase 3 (The Reveal):** Open envelopes. Compare Card 1 (Policy) vs. Card 2 (Action).

  **Minute-by-Minute Timeline (75 Minutes)**

  **00:00 – 00:10 | Introduction & Setup**
  *   Welcome them. State clearly: "We are not discussing theory today. We are testing how decisions feel."
  *   Distribute chips (10 each), cards, envelopes, pens.
  *   Explain the rules exactly as written above. Be crisp. Do not explain *why* yet.
  *   **Crucial Instruction:** "Write on Card 1 what you honestly believe you should do. Seal it. Do not show anyone."
  *   *Goal:* Establish the "Pre-Commitment."

  **00:10 – 00:20 | Phase 1 (The Seal)**
  *   Give them 3 minutes to think and write on Card 1.
  *   Collect the sealed envelopes into a box/bowl (keeps them honest).
  *   *Facilitator Note:* Watch for hesitation. Some will try to game the system. Let them.

  **00:20 – 00:30 | Phase 2 (The Flip)**
  *   Flip the coin.
  *   **Heads Group:** Count their winnings based on the envelopes (you open them secretly or they open under honor system). They feel relief or regret based on what they wrote earlier.
  *   **Tails Group:** Hand them Card 2. Ask the question: *"The coin is Tails. The 8 chips are gone. Do you pay 3?"*
  *   *The Trap:* Rational self-interest says "NO." You gain nothing by paying now. The reward condition (Heads) is already failed.
  *   Most will write "NO" on Card 2, even if they wrote "YES" on Card 1.

  **00:30 – 00:40 | Phase 3 (The Reveal)**
  *   Have everyone open their envelopes.
  *   Ask for a show of hands: "Who wrote YES on Card 1 but NO on Card 2?"
  *   Usually, 50–70% of the Tails group will have betrayed their sealed self.
  *   Ask the Tails group: "Look at your sealed card. That was you thirty minutes ago. Why don't you trust that person anymore?"
  *   *Goal:* Make the dissonance visceral. They are arguing with their past self.

  **00:40 – 00:55 | Debrief (The Theory Lite)**
  *   **The Pivot:** Now you can say the words "Decision Theory."
  *   Explain: "Card 1 is your **Policy**. Card 2 is your **Impulse**."
  *   Connect to the Dead Mother: "Your protagonist promised their mother (Card 1). The mother is dead (The Coin is Tails). The reason for the promise is gone. Card 2 says 'Don't bother.' But the story is about whether Card 1 still matters."
  *   **The Second Beat (Your Request):** Ask the Tails group: "If there were a version of you in a parallel universe where the coin landed Heads, would you want *that* version to know you refused to pay?"
  *   They will say "Yes, because that version wins 8 chips only if I pay."
  *   **The Point:** "The envelope isn't magic. The magic is that your decision *now* defines what kind of person you *were* then. You are writing a character who is consistent across timelines, not just consistent with current incentives."

  **00:55 – 01:15 | Writing Exercise (The Manuscript)**
  *   Prompt: "Open your current draft. Find a scene where a character keeps or breaks a promise, habit, or code."
  *   Task 1: Identify the 'Coin Flip.' What information changed that makes the promise seem useless now? (e.g., The benefactor is dead, the secret is out, the money is lost).
  *   Task 2: Rewrite the internal monologue. Instead of weighing the *current* pros/cons (Card 2), have them weigh the *identity cost* of betraying Card 1.
  *   Share: 2-3 volunteers read the "before" and "after" logic (not necessarily the prose).

  ---

  ### What Will Go Wrong (And How to Fix It)

  **1. The "It's Just a Game" Dismissal**
  *   **Failure:** A participant says, "I wouldn't pay the chips because there's no real consequence," rendering the tension fake.
  *   **Fix:** Acknowledge it immediately. "You're right. In the game, the chips are paper. In your novel, the chips are your protagonist's soul, reputation, or life. The game is just a skeleton; you provide the flesh." Do not argue the stakes; validate them and pivot to the *structure* of the choice.

  **2. The "Smart" Player Who Games It**
  *   **Failure:** Someone writes "YES" on Card 1 hoping for Heads, knowing they will write "NO" on Card 2 if Tails hits. They feel clever, not conflicted.
  *   **Fix:** Call this out during the debrief. "That strategy works for winning chips. It fails for writing characters. A character who lies to their past self isn't clever; they're fragmented. That fragmentation is actually a great character flaw, but you have to write it as a flaw, not a victory."

  **3. Confusion on the Payoff**
  *   **Failure:** People get confused about who gets points when, turning the room into a math seminar.
  *   **Fix:** Keep the scoring binary and visible on the board.
      *   HEADS + Card 1 YES = +8 chips.
      *   TAILS + Card 2 YES = -3 chips.
      *   TAILS + Card 2 NO = 0 change.
      *   Do not discuss expected value. Discuss *regret*.

  **4. The Silence**
  *   **Failure:** You ask "Why don't you trust your past self?" and no one answers.
  *   **Fix:** Have them turn to a neighbor and talk for 2 minutes first. Writers talk easier in pairs than to a room. Then ask for volunteers.

  ---

  ### What The Game Cannot Reproduce (Your Limitations)

  You need to state these explicitly in the debrief so you don't overpromise:

  1.  **Time:** The game is instantaneous. In a novel, the gap between Card 1 (The Promise) and Card 2 (The Moment) is years of suffering. The game captures the *logic* of the conflict, but you must supply the *weight* of time in your draft.
  2.  **Social Cost:** In the game, no one sees what you wrote on Card 2 unless you show them. In a novel, other characters judge the protagonist. The "shame" of breaking a promise is often external, not just internal logic.
  3.  **Information Asymmetry:** In the game, everyone knows the rules. In a novel, the character might not know the coin has flipped (the mother is dead, but they don't know yet). This adds dramatic irony the game doesn't have.

  ### The "One More Beat" (For the Debrief)

  To hit your specific request about the envelope not being the work:

  When the Tails group admits they wrote "NO" on Card 2 (refusing to pay), ask them: **"Did opening the envelope change the math?"**
  They will say "No."
  Ask: **"So why did the answer change?"**
  They will say: "Because the reward was gone."
  Say: **"Exactly. The envelope didn't bind you. Your knowledge of the outcome unbound you. The question for your novel is: What knowledge does your character gain that makes them feel unbound? And is that feeling true?"**

  This moves them from "I broke the rule" to "I broke the rule because I thought the context changed." That is where the story lives.
