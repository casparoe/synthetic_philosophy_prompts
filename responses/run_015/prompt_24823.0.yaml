answer: |-
  ### The Wild Animal Harm Filter (WAHF)

  This procedure is designed for procurement teams operating under epistemic uncertainty (lack of perfect data) and moral uncertainty (disagreement on how to weigh different lives). It relies on the **Expected Value** framework common in animal ethics literature (e.g., Effective Altruism, Global Priorities Institute), prioritizing robust proxies over precise but unavailable data.

  **Time Requirement:** 4–8 hours of analyst time over two days (data gathering + calculation).
  **Data Sources:** Public Life Cycle Assessment (LCA) databases (e.g., Our World in Data, FAO STAT, Agribalyse). Do not commission new studies.

  #### Step 1: The Land-Use Proxy (The Primary Filter)
  **Question:** What is the difference in land occupation (m² per serving) between the current product and the proposed replacement?
  **Why:** Habitat conversion and displacement are the single largest drivers of wild animal harm in agriculture. "Land Sparing" literature suggests that reducing total agricultural land is the most robust way to reduce wild animal displacement, even if intensity per hectare rises.
  **Sufficient Answer:** An order-of-magnitude estimate (e.g., "10x less," "roughly equal").
  **Action:**
  *   If Proposed Land Use < Current Land Use: **Pass to Step 2.**
  *   If Proposed Land Use > Current Land Use: **Reject** (unless Step 4 overrides).
  *   If Data is Unavailable: **Stop.** Hand to ethics board.

  #### Step 2: The Trophic Efficiency Check
  **Question:** How much plant feed is required to produce one serving of the current product versus the proposed product?
  **Why:** Crop cultivation causes direct mortality to field animals (mice, birds) and insects (pesticides/harvest). Reducing feed demand reduces this "crop death" footprint.
  **Sufficient Answer:** Feed Conversion Ratio (FCR) estimates.
      *   Beef (grain-finished): ~6–25 kg feed per kg protein.
      *   Chicken: ~2–4 kg feed per kg protein.
      *   Plants: ~1 kg feed per kg protein (direct consumption).
  **Action:** Calculate the *reduction* in feed demand. Larger reduction = higher ranking.

  #### Step 3: Direct Mortality & Management
  **Question:** Does the current production method involve active culling of wild predators or high-bycatch harvesting?
  **Why:** Ruminant grazing often involves government or private culling of wolves, coyotes, and competitors. Fishing involves bycatch. Monocrops involve harvest deaths.
  **Sufficient Answer:** Binary check (Yes/No) or rough estimate of culling intensity.
  **Action:**
  *   If Current involves predator culling and Proposed does not: **Add positive weight to Proposed.**
  *   If both involve similar crop harvest deaths: **Neutral.**

  #### Step 4: The Insect Sensitivity Switch (The Moral Weight Variable)
  **Question:** How much moral weight ($W$) do we assign to an insect relative to a vertebrate (mouse/bird)?
  **Why:** This is the pivot point. Plant agriculture and poultry feed agriculture both kill insects via pesticides and harvesters. If insects matter nearly as much as vertebrates, the "crop death" argument gains weight.
  **Procedure:** Run the calculation twice.
  *   **Scenario A (Vertebrate Bias):** $W_{insect} \approx 0$. (Standard regulatory/ethical view). Rank based on Steps 1–3.
  *   **Scenario B (Inclusive Sentience):** $W_{insect} > 0.01 \times W_{vertebrate}$. (High-welfare view). Re-evaluate Step 2. Does the feed reduction in the Proposed option still outweigh the pesticide load?
  **Action:**
  *   If Ranking is the same in A and B: **Proceed to Step 5.**
  *   If Ranking flips between A and B: **Flag as "Value Sensitive."** Hand to ethics board.

  #### Step 5: The Value Stop (Procurement Handoff)
  **Question:** Is the remaining uncertainty factual or moral?
  **Why:** Procurement can solve factual uncertainty (data gathering). It cannot solve moral uncertainty (weighting lives).
  **Action:**
  *   If the procedure yields a clear winner across Scenario A and B: **Procurement signs off.**
  *   If the winner depends entirely on whether insects count (Step 4 flip): **Stop.** This is a values question. Present the two scenarios to the Sustainability Team Lead or Ethics Board for a tie-break decision. Do not make this call yourself.

  ---

  ### Application to Proposals

  Here is the procedure run on your two specific proposals. Data is based on median global LCA values (Our World in Data / Poore & Nemecek 2018).

  #### Proposal 1: Replace Beef Line with Chicken Line
  *   **Step 1 (Land):** Beef requires ~100 m²/100kcal. Chicken requires ~10 m²/100kcal.
      *   *Result:* **90 m² saved per unit.** (Pass)
  *   **Step 2 (Feed):** Beef FCR ~10:1. Chicken FCR ~3:1.
      *   *Result:* **7 units of crop feed saved per unit protein.** (Reduces crop-related wild animal harm).
  *   **Step 3 (Management):** Beef grazing often involves predator control (wolves/coyotes). Chicken is confined (less direct wild interaction, but feed crops still harvest).
      *   *Result:* **Reduction in direct predator culling.**
  *   **Step 4 (Insects):** Both rely on crops (grain-finished beef vs. chicken feed). However, Beef requires significantly *more* crops per calorie.
      *   *Scenario A (Vertebrate Bias):* Chicken wins (less land, less feed).
      *   *Scenario B (Insect Weight):* Chicken still wins because it demands fewer total crops than beef, meaning fewer insect deaths in feed cultivation.
  *   **Step 5 (Stop):** Consistent winner across moral weightings.

  #### Proposal 2: Replace Chicken Line with Grain-Based Plant Line
  *   **Step 1 (Land):** Chicken requires ~10 m²/100kcal. Plants (grain) require ~1–2 m²/100kcal.
      *   *Result:* **8–9 m² saved per unit.** (Pass)
  *   **Step 2 (Feed):** Chicken FCR ~3:1. Plants FCR ~1:1.
      *   *Result:* **2 units of crop feed saved per unit protein.**
  *   **Step 3 (Management):** Chicken is confined. Plants are open field. Both involve harvest deaths.
      *   *Result:* **Neutral/Slight gain for Plants** (no need to grow feed for animals, just food for humans).
  *   **Step 4 (Insects):** Both involve crop cultivation and pesticides.
      *   *Scenario A (Vertebrate Bias):* Plant wins (less land).
      *   *Scenario B (Insect Weight):* Plant wins, but the margin is narrower. The reduction in crop volume is smaller here (2 units saved) compared to Proposal 1 (7 units saved).
  *   **Step 5 (Stop):** Consistent winner, but margin is smaller than Proposal 1.

  ### Comparison of Reduction Magnitude
  The procedure asks which proposal produces the *larger reduction* in harm.

  1.  **Land Reduction:** Proposal 1 (Beef→Chicken) saves ~90 m². Proposal 2 (Chicken→Plant) saves ~8 m². **Proposal 1 wins by order of magnitude.**
  2.  **Feed/Crop Reduction:** Proposal 1 saves ~7 units of feed. Proposal 2 saves ~2 units of feed. **Proposal 1 wins.**
  3.  **Insect Harm:** Since Proposal 1 reduces total crop volume more than Proposal 2, it likely reduces insect deaths more, *unless* the beef in question is 100% grass-fed with zero grain. Assuming standard grocery supply chains (grain-finished), Proposal 1 reduces the total agricultural footprint more aggressively.

  ### Limitations and Failure Points
  You must be honest about where this logic breaks:
  1.  **Grass-Fed Exception:** If your beef supplier is 100% regenerative grass-fed with no grain, Step 2 flips. Grass-fed beef uses *more* land but *fewer* crop insects. If you weight insects highly, Proposal 1 could theoretically increase harm. The procedure assumes standard grain-finished supply chains.
  2.  **Local Ecology:** This uses global averages. If your beef comes from a degraded pasture that supports *no* wildlife, and your chicken feed comes from a biodiversity hotspot, the land metric fails. You lack the ecologist to verify this.
  3.  **The "Value Stop" Failure:** If your sustainability team decides insects count equally to mice, the certainty of Proposal 1's victory diminishes, though the land-use difference is so vast it usually still dominates.
  4.  **Domestic vs. Wild:** This procedure ranks *wild* animal harm. It does not account for the harm to the domestic cows or chickens themselves. If your mandate expands to "total animal harm," the Plant option becomes the absolute priority regardless of wild metrics.

  ### Conclusion
  Under the "Land Sparing" heuristic, which is the most robust proxy for wild animal harm under deep uncertainty, the inefficiency of ruminant meat (beef) is the largest driver of harm. Removing beef saves more land and reduces more crop demand (and associated field deaths) than removing chicken. While replacing chicken with plants is ethically positive, the *marginal reduction* in wild animal harm is smaller than removing beef.

  Verdict: Proposal 1 (replacing beef with chicken) ranks as producing the larger reduction in wild animal harm per serving.
