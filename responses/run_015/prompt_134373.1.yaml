  ok so i have this old notebook where for about four years i just wrote down every time i suddenly felt nauseous, no weather data or anything, just random notes. a friend recently showed me this biomechanical model that says nausea hits exactly when air pressure drops more than 8 millibars in an hour, and if you cross-check weather logs it apparently explains every single entry in my notebook. but i never recorded pressure, only nausea, so the match was reconstructed after the fact. there's also this older simpler idea that i just have motion sickness. should i actually take the pressure model seriously and update my belief, or is it circular to use old notes i already had to confirm a theory that was clearly designed around logs like mine? my roommate says thats like grading your own homework.
