prompt: |-
  I work as a disability benefits assessor for a national scheme. I see eleven or twelve claimants a week, forty minutes each, one appointment only; before the appointment I have the standard self-report form, which asks about a fixed list of activities such as walking fifty metres, preparing a meal, and washing. I write a report that goes to a decision-maker who never meets the claimant and who signs off every award, and a sample of my reports is read by a quality assurance auditor whose main test is whether the written evidence in the file supports the recommendation. A wrong denial can strip most of someone's income and push them into work that makes them worse; a wrong award costs the fund money and, in sufficient numbers, costs the scheme its political licence. Some claimants do misrepresent their condition. I cannot fix any of this in the room; I can only change how I weigh what I hear.

  I want the literature on epistemic injustice turned into a procedure I can actually run in those forty minutes. The distinction I have in mind is the one Miranda Fricker draws between two failures: a hearer giving a speaker a deflated level of credibility because of prejudice tied to the speaker's identity, and a speaker being unable to make their own experience intelligible — to themselves as much as to the hearer — because the shared vocabulary has no place for it. I want the procedure to say at each step which of the two it is dealing with, because they call for different repairs, and I want it to be usable by someone who has never read the theory.

  The procedure should give me, in order: the questions to ask myself in the room and then again while writing; what counts as a sufficient answer to each; the point at which it stops with a no; and the point at which it hands the decision to someone else because the remaining question is one of values rather than facts. It has to survive four constraints: it must fit on one side of A4 so it can be laminated and kept on the desk; it must produce a report an auditor will accept; it must not pretend the assessment is a forty-minute psychotherapy or a re-examination; and it must be honest about which of its steps are judgment calls wearing procedural clothing.

  Five distinctions I want preserved if they can be, and want told honestly cannot be if they cannot.

  One: the difference between recording a claim as not established and recording it as not credible. I suspect a large share of what my file currently calls low credibility is really unestablished, and that the two deserve different sentences in the report.

  Two: the difference between using a claimant's identity prejudicially and using it as evidence. When a former warehouse picker tells me he cannot lift a crate, his occupational history is doing real epistemic work; when an accent or a diagnosis of a personality disorder moves my estimate, something else is. I want a test — the one I have been using informally is to ask whether the same datum offered by a claimant of higher status would have raised their credibility; if not, the datum is a proxy for status — but I want it stated properly and I want to know when it gives the wrong answer.

  Three: proxy credibility, my label for credit routed through a higher-status intermediary so that a specialist's letter, or a support worker's rephrasing, or even my own tidier prose in the report, ends up carrying the epistemic weight that the claimant's own account should carry.

  Four: scripted fluency. Some claimants have learned the form's vocabulary from a support group or a benefits adviser and produce beautifully fitted accounts; some have not and ramble. It is tempting to treat fluency as coaching and rambling as honesty. Both temptations are errors, and I want the procedure to block both rather than replace one with the other.

  Five: credibility excess. I want the procedure to catch the cases where I believe someone too readily because they are like me, because I like them, or because we share a background — not only the cases where I believe them too little.

  There are hard cases the procedure has to handle rather than bracket: the claimant who gives inconsistent numbers across three assessments; the claimant seen once through an interpreter and once without; the claimant who answers I don't know to nearly everything and whose adult child answers for them; the claimant who has clearly been coached; and the claimant who withholds information because previous disclosures were used against them.

  Then apply the procedure to three files and show the work.

  A. Mr H, fifty-four, former warehouse picker, chronic lower back pain, no imaging finding that matches the severity he reports. Recorded walking distance: two hundred metres, then fifty, then depends on the day. One of three assessments was conducted through a Punjabi interpreter, two were not. The auditor has flagged the inconsistency.

  B. Ms K, twenty-nine, formerly a copywriter, reporting fatigue and post-exertional crashes. Highly articulate, uses the form's own phrasing precisely, brings a two-page letter from a hospital specialist, and turns out to have read the same subject at the same university as I did. I like her and I believe her; I expect this is the case where your procedure tells me something I will not want to hear.

  C. Mr O, sixty-one, monosyllabic, I don't know to most questions, daughter answering for him, no diagnosis in the notes but some suggestion of cognitive impairment.

  Finally, I want the parts the procedure cannot do. I already suspect three: it cannot repair a gap in the shared vocabulary, only decline to punish the claimant for it; and it cannot tell me how to set the threshold between wrongly denying and wrongly granting, which looks like a values question that should be owned by whoever sets policy rather than by me or by the theory. Tell me if there are others, and tell me where the procedure will misfire — in particular whether a quarterly log of my own credibility ratings against claimant demographics would actually detect bias in me or would simply teach me to equalise the numbers.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Disability benefits assessor (national scheme).
      *   **Constraints:** 40 mins/claimant, one appointment, standard self-report form, report goes to decision-maker (who doesn't meet claimant), QA audit checks evidence vs. recommendation. High stakes (income loss vs. fund integrity).
      *   **Goal:** Turn Miranda Fricker's *Epistemic Injustice* (Testimonial Injustice vs. Hermeneutical Injustice) into a practical, one-page A4 procedure (laminatable).
      *   **Requirements:**
          *   Distinguish between the two injustices at each step.
          *   Usable by someone unfamiliar with the theory.
          *   Include: Questions to ask (in room & writing), sufficient answers, stop points (No), hand-off points (Values vs. Facts).
          *   Must survive 4 constraints: One page, audit-proof, not therapy/re-exam, honest about judgment calls.
          *   Preserve 5 Distinctions: Not Established vs. Not Credible; Identity as Prejudice vs. Evidence; Proxy Credibility; Scripted Fluency; Credibility Excess.
          *   Handle Hard Cases: Inconsistency, Interpreters, "I don't know"/Proxy answers, Coaching, Withholding due to trauma.
          *   Apply to 3 Files (Mr H, Ms K, Mr O).
          *   Identify Limitations: What the procedure *cannot* do (including the user's suspicion about vocabulary gaps and threshold setting, plus the bias log question).

  2.  **Analyze the Theory (Fricker) in Context:**

      *   *Testimonial Injustice:* Prejudice causes a deflation of credibility (e.g., "benefit scrounger" stereotype, mental health diagnosis, accent).
      *   *Hermeneutical Injustice:* Lack of shared concepts/vocabulary makes experience unintelligible (e.g., "brain fog," "spoon theory," pain without imaging).
      *   *The Assessor's Dilemma:* They are a gatekeeper, not a therapist. They need to record evidence for an audit. They cannot fix the system, only weigh evidence fairly within the constraints.

  3.  **Drafting the Procedure (The "One-Pager"):**

      *   *Challenge:* Fitting all this on one side of A4 is tight. It needs to be dense but readable.
      *   *Structure:*
          1.  Header (Title/Purpose).
          2.  Phase 1: In the Room (Listening).
          3.  Phase 2: Writing the Report (Weighing).
          4.  Decision Matrix (The 5 Distinctions).
          5.  Stop/Hand-off Rules.
      *   *Content:* Needs to translate "Testimonial" to "Credibility Check" and "Hermeneutical" to "Intelligibility Check."
      *   *Addressing the 5 Distinctions:*
          1.  *Not Established vs. Not Credible:* Needs specific phrasing in the report section.
          2.  *Identity Prejudice vs. Evidence:* The "Status Swap Test."
          3.  *Proxy Credibility:* Warning against letting third parties overwrite the claimant.
          4.  *Scripted Fluency:* Decouple fluency from truth.
          5.  *Credibility Excess:* Check for affinity bias.
      *   *Hard Cases:* Need specific triggers in the procedure.

  4.  **Refining the Procedure (Iterative Process):**

      *   *Drafting thought:* I can't write "Fricker" on the sheet. It needs to be operational language.
      *   *Terminology:* Use "Credibility Deficit" (Testimonial) and "Expression Gap" (Hermeneutical).
      *   *Audit Proofing:* The report must explicitly state *why* evidence was weighed a certain way.
      *   *Honesty:* Acknowledge where the assessor is making a judgment call.

  5.  **Applying to the Three Files:**

      *   *Mr H (Inconsistency/Interpreter):*
          *   Issue: Testimonial (is he lying?) vs. Hermeneutical (does pain fluctuate?).
          *   Interpreter issue: Hermeneutical (loss of nuance) + Testimonial (bias against non-native speakers?).
          *   Application: Focus on "fluctuation" vs. "contradiction."
      *   *Ms K (Affinity/Fluency):*
          *   Issue: Credibility Excess (same uni, likable) + Scripted Fluency (knows the lingo).
          *   Application: The "Status Swap Test" is crucial here. Would I believe a less articulate claimant with the same medical letter?
      *   *Mr O (Cognitive/Proxy):*
          *   Issue: Hermeneutical (cannot express) + Proxy Credibility (daughter speaking).
          *   Application: Distinguish between *inability* to speak and *unwillingness*. Avoid punishing the "I don't know."

  6.  **Addressing the Limitations (The "Cannot Do" List):**

      *   *Vocabulary Gap:* The procedure can protect the claimant from penalty, but it can't create the concepts.
      *   *Threshold Setting:* This is political/policy, not epistemic. The assessor applies the threshold, doesn't set it.
      *   *The Bias Log:* This is a crucial insight. Quantitative logs often lead to "gaming" (equalizing numbers rather than fixing bias). It creates a target, not justice.
      *   *Structural Constraints:* The procedure cannot fix the 40-minute limit or the decision-maker's distance.

  7.  **Final Review against Constraints:**

      *   *One Page:* I need to format the text so it *looks* like it fits on A4 (concise, bullet points).
      *   *Audit Proof:* The report phrasing must be explicit.
      *   *Honest:* Admit where judgment is used.
      *   *Five Distinctions:* Ensure all are embedded in the steps.

  8.  **Constructing the Output:**

      *   *Introduction:* Acknowledge the difficulty and the ethical weight.
      *   *The Procedure (The "Epistemic Weighting Protocol"):* Designed to be printed.
      *   *The Three Files:* Walkthrough using the protocol.
      *   *The Limitations:* Honest assessment of what theory cannot fix.
      *   *The Bias Log Question:* Specific answer regarding Goodhart's Law.

      *(Self-Correction during drafting)*: I need to make sure I don't just summarize Fricker. The user wants a *procedure*. The distinction between "Not Established" and "Not Credible" needs to be a specific checkbox or sentence structure in the report section of the procedure. The "Status Swap Test" needs to be a concrete question.

      *(Refining the "One Page" aspect)*: I will present the procedure in a format that *could* be laminated. I will use bolding and clear sections.

      *(Refining the Bias Log)*: The user asked if it would detect bias or teach equalization. The answer is almost certainly the latter (Goodhart's Law). I need to explain *why*.

      *(Refining the Hard Cases)*: Make sure the procedure explicitly mentions how to handle interpreters and proxies.

  9.  **Final Polish:** Check tone. It needs to be professional, empathetic but realistic, and rigorous. The user is a practitioner asking for tools, not a student asking for an essay.

      *Wait, one constraint check:* "It must produce a report an auditor will accept." The procedure needs to generate specific audit trails. I will add a "Report Phrasing" section.

      *Another constraint check:* "Honest about which of its steps are judgment calls wearing procedural clothing." I need to label these explicitly in the procedure.

      *Let's build the A4 content.*
      Title: EVIDENCE WEIGHTING PROTOCOL (EWP)
      Sections: Pre-Interview, In-Room, Post-Interview/Writing.
      Checks: The 5 Distinctions.
      Stop/Hand-off rules.

      *Okay, ready to write.*
answer: |-
  Here is the procedure, designed to fit on one side of A4, followed by the application to your three files and the analysis of limitations.

  ***

  # EVIDENCE WEIGHTING PROTOCOL (EWP)
  **Purpose:** To separate *credibility deficits* (prejudice) from *expression gaps* (vocabulary) and ensure report recommendations are auditable.
  **Constraint:** This is an evidence-weighing tool, not a diagnostic or therapeutic instrument.

  ## PHASE 1: IN THE ROOM (Listening)
  **Q1: The Status Swap Test (Distinction 2)**
  *Ask:* "If this claimant had a different accent, diagnosis, or class marker, would I weigh this specific datum the same?"
  *   **Yes:** Proceed. (Identity is evidential, e.g., occupational history).
  *   **No:** Flag as *Potential Testimonial Injustice*. Do not discard datum; seek corroboration.
  *   **Hard Case (Interpreter):** Assume 20% nuance loss. Do not treat translation lag as hesitation or evasion.

  **Q2: The Fluency Check (Distinction 4)**
  *Ask:* "Is the coherence of this account due to truth, or due to coaching/education?"
  *   **Action:** Decouple *clarity* from *truth*. A rambling account can be true; a scripted account can be true.
  *   **Record:** Note "Claimant uses clinical terminology" OR "Claimant struggles to describe pain." Do not infer veracity from style.

  **Q3: The Intelligibility Check (Hermeneutical)**
  *Ask:* "Is the claimant failing to explain, or does the form lack the words for their experience?"
  *   **Action:** If they say "I can't explain," record *Expression Gap*, not *Evasion*.
  *   **Hard Case ('I Don't Know'):** If persistent, check for cognitive impairment. If proxy (family) answers, record *who* observed the activity. Do not penalize lack of self-knowledge if impairment is evident.

  ## PHASE 2: WRITING THE REPORT (Weighing)
  **Q4: The Proxy Credibility Check (Distinction 3)**
  *Ask:* "Am I accepting this evidence because a specialist/support worker said it, while ignoring the claimant's own account?"
  *   **Rule:** Third-party evidence supports; it does not replace. If the specialist letter contradicts the claimant's lived experience without explanation, note the conflict. Do not let professional prose overwrite lay testimony.

  **Q5: The Affinity Check (Distinction 5)**
  *Ask:* "Am I believing this readily because we share a background (school, humour, demeanour)?"
  *   **Action:** If *Yes*, apply higher scrutiny to this file than usual to offset *Credibility Excess*.

  **Q6: The Verdict Distinction (Distinction 1)**
  *Select one finding for each activity:*
  *   **[A] Established:** Evidence supports the claim.
  *   **[B] Not Established:** Evidence is insufficient or contradictory, but no deception is implied. *(Use this for fluctuation, memory gaps, lack of medical correlation).*
  *   **[C] Not Credible:** Specific evidence suggests deliberate fabrication. *(Requires specific justification, e.g., surveillance contradiction).*
  *   **Audit Rule:** You must cite specific evidence for [B] and [C]. [C] requires higher evidentiary threshold than [B].

  ## PHASE 3: STOP & HAND-OFF
  **STOP (No):** If the claim is [C] Not Credible, you must have objective corroboration (e.g., contradictory surveillance, proven fraud). Subjective impression is insufficient.
  **HAND-OFF (Values):** If the evidence is [B] Not Established but the claimant is at risk of destitution, this is a **Policy Threshold** issue.
  *   **Report Phrasing:** "Evidence is insufficient to meet the statutory threshold for [Activity], though claimant reports significant difficulty. Recommendation is based on evidentiary weight, not absence of need."
  *   **Why:** This signals to the Decision-Maker that the *rule*, not the *fact*, is the barrier.

  **JUDGMENT CALLS (Honesty Log)**
  *Mark these in your notes:*
  1.  [ ] I resolved an inconsistency by assuming fluctuation (Value judgment).
  2.  [ ] I prioritized medical evidence over lay testimony (Value judgment).
  3.  [ ] I accepted a proxy account due to apparent impairment (Value judgment).

  ***

  # APPLICATION TO FILES

  ### File A: Mr H (The Inconsistent Warehouse Picker)
  *   **Phase 1 (Listening):**
      *   *Q1 (Status Swap):* Would I doubt a middle-class manager's varying walking distance? Likely less. Flag potential class/occupation bias.
      *   *Q3 (Intelligibility):* Pain fluctuates. "Depends on the day" is a valid phenomenological description, not necessarily a contradiction.
      *   *Hard Case (Interpreter):* The Punjabi session likely introduced noise. Treat the two English sessions as the baseline, the interpreted one as lower confidence, not contradictory.
  *   **Phase 2 (Writing):**
      *   *Q6 (Verdict):* Select **[B] Not Established** for the 200m claim, **[A] Established** for the 50m claim.
      *   *Reasoning:* Inconsistency is likely due to the nature of chronic pain (fluctuation) + translation variance, not deception.
      *   *Audit Proofing:* Explicitly write: "Variation in reported distance attributed to condition fluctuation and interpreter variance. No evidence of deliberate fabrication [C]."
  *   **Outcome:** Avoids punishing the hermeneutical gap of "pain fluctuation" as a testimonial failure ("lying").

  ### File B: Ms K (The Articulate Copywriter)
  *   **Phase 1 (Listening):**
      *   *Q2 (Fluency):* She uses the form's phrasing. Is this coaching or lived experience?
      *   *Q5 (Affinity):* **CRITICAL STOP.** You share a university background. You like her. You are experiencing *Credibility Excess*.
      *   *Action:* Apply higher scrutiny. Does the medical evidence support the fatigue *independent* of her articulation?
  *   **Phase 2 (Writing):**
      *   *Q4 (Proxy):* The specialist letter is strong, but ensure you aren't using it to bypass her own account.
      *   *Q6 (Verdict):* If the medical evidence holds, **[A] Established**. If it relies *only* on her articulation, downgrade to **[B] Not Established**.
      *   *Honesty Log:* Mark "Affinity Check Applied."
  *   **Outcome:** The procedure forces you to admit you might be believing her *too easily*. It protects the fund from affinity bias, even if she is telling the truth.

  ### File C: Mr O (The Monosyllabic Father)
  *   **Phase 1 (Listening):**
      *   *Q3 (Intelligibility):* "I don't know" is likely a cognitive symptom, not evasion.
      *   *Hard Case (Proxy):* Daughter is answering.
      *   *Q4 (Proxy Credibility):* Do not treat the daughter's word as the father's. Treat it as *observational evidence of the father*.
  *   **Phase 2 (Writing):**
      *   *Q6 (Verdict):* **[B] Not Established** for self-report, **[A] Established** for observed need (via daughter).
      *   *Report Phrasing:* "Claimant unable to self-report due to apparent cognitive impairment. Evidence derived from third-party observation. No indication of deception."
      *   *Hand-Off:* If the scheme requires self-report for award, use the **Hand-Off (Values)** phrasing. "Claimant meets functional need but fails procedural evidentiary standard."
  *   **Outcome:** Prevents punishing a hermeneutical injustice (inability to articulate) as a testimonial failure (evasion).

  ***

  # WHAT THE PROCEDURE CANNOT DO

  You asked for honesty about where this tool misfires. Here are the four structural limits.

  **1. The Vocabulary Gap (Hermeneutical Limit)**
  You suspected this, and you are right. The procedure can *decline to punish* the claimant for the gap (by marking [B] Not Established rather than [C] Not Credible), but it cannot *bridge* the gap. If the scheme's definitions of "mobility" or "cooking" fundamentally exclude their lived reality (e.g., "you can cook" means "you can stand," ignoring the executive function required to plan the meal), the report will still recommend denial. The procedure makes the injustice visible in the text ("fails procedural evidentiary standard"), but it does not change the outcome.

  **2. The Threshold Problem (Political Limit)**
  The procedure identifies where evidence is [B] Not Established. It cannot tell you where the line between [B] and [A] should be drawn in terms of severity. That is a resource allocation decision (values), not an epistemic one (facts). By forcing you to write "Recommendation is based on evidentiary weight, not absence of need," you are shifting the moral burden to the Decision-Maker/Policy. The procedure cannot absolve you of the feeling that you are denying need, because you are.

  **3. The Bias Log (The Goodhart's Law Limit)**
  You asked if a quarterly log of credibility ratings against demographics would detect bias.
  **It will not.** It will teach you to equalise the numbers.
  If you know you are being measured on "equal denial rates across demographics," you will subconsciously adjust your [C] Not Credible findings to match the quota. This is Goodhart's Law: *When a measure becomes a target, it ceases to be a good measure.*
  *   **Risk:** You might grant a fraudulent claim from an under-protected group to balance the books, or deny a valid claim from an over-protected group to avoid appearing biased.
  *   **Better Alternative:** The *Honesty Log* in Phase 3. This requires qualitative reflection on *why* a judgment was made, which is harder to game than a quantitative ratio. However, it relies on your own honesty.

  **4. The Structural Silence (Institutional Limit)**
  The procedure assumes the Decision-Maker reads the nuance. In your description, the Decision-Maker "signs off every award" and never meets the claimant. If the Decision-Maker ignores your [B] Not Established distinction and treats it as a denial anyway, the procedure has protected your integrity but not the claimant.
  *   **Misfire Point:** The procedure makes *your* report robust against audit, but it cannot guarantee the *system* responds to the nuance. It creates a paper trail of injustice (showing where the rules blocked the need) rather than preventing the injustice itself.

  ### Summary of Limitations
  The EWP converts **epistemic errors** (bias, misunderstanding) into **procedural transparency**. It stops you from adding *unnecessary* harm through prejudice or vocabulary gaps. It does not stop the *necessary* harm inherent in a rationing system that requires 40-minute proofs of suffering. It makes you a more honest witness, not a different judge.
