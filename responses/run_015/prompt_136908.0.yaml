answer: |-
  The thinker you are recalling is Otto Neurath, a central figure in the Vienna Circle of Logical Positivists. Neurath advocated for a "unified science" based on a physicalist vocabulary to facilitate social planning, but he famously insisted that this vocabulary was a pragmatic convention for coordination, not a metaphysical discovery of how the world truly is. He likened science to rebuilding a ship at sea: we must use the planks we have (our current concepts) to fix the vessel, knowing that the choice of planks is driven by utility and agreement rather than mirroring reality.

  Your consultant is operating on a stricter, outdated version of Positivism combined with Max Weber's instrumental rationality: the belief that science can objectively determine the most efficient *means* to a goal, while *ends* remain subjective preferences. Her error lies in assuming that metrics like "bike-traffic flow" are brute facts. As Hilary Putnam argued in *The Collapse of the Fact/Value Dichotomy*, this distinction is untenable because description and evaluation are entangled. Choosing to measure "traffic flow" rather than "habitat continuity" or "social linger time" is not a neutral observation; it is a "thick concept" that embeds a specific normative vision of what a riverfront is *for*. By defining efficiency as speed, the algorithm privileges the commuter over the angler before the voting even begins.

  However, acknowledging that the framework is value-laden does not mean your board's decision is merely arbitrary noise or "taste in scientific clothing." If values were purely emotive (just feelings), deliberation would be impossible, but human reasoning is not limited to algorithmic calculation. John Dewey argued that values are hypotheses about what will lead to human flourishing, subject to testing through experience and debate. There is a rational basis for choosing one framework over another: you can argue that a metric is *blind* to crucial consequences, *incoherent* with the town's stated mission, or *destructive* to long-term community well-being. Rationality here is not about finding a neutral vantage point (which doesn't exist), but about pragmatic coherence and the ability to give reasons that others can accept.

  Verdict: The fact-value split is philosophically obsolete because selecting metrics is inherently normative, yet this does not reduce your vote to arbitrary taste because rational deliberation relies on pragmatic judgment about consequences rather than algorithmic certainty.
