prompt: |-
  I am preparing a short methods statement for a philosophy of mind reading group, in which I say that my work proceeds within the framework of heterophenomenology. Before I circulate it I would like a consistency audit of the commitments I actually hold, because I suspect that not all of them can stand together and I cannot tell which ones are doing the damage. They are:

  1. The data are the subjects' utterances and other report behaviour. The theorist first constructs a world as it seems to the subject out of that material, and only afterwards asks which of the posits of the constructed world are real.
  2. That bracketing is genuinely neutral: adopting the method commits one neither to realism nor to antirealism about phenomenal states, in the way that the anthropologist's suspension of belief commits her neither way about the gods of the people she studies.
  3. I nonetheless accept the negative conclusion that the method's principal advocate draws from it: a good deal of the constructed world is unreal, and there are no ineffable intrinsic properties answering to some of the things subjects say about their experience.
  4. There is no third-person test for the presence of a phenomenal property over and above report and report-guided behaviour; if there were, I would no longer be doing this method but something else.
  5. In constructing the world I apply a principle of charity: I attribute to subjects beliefs that render their reports mostly true and mostly rational, since otherwise the material is not interpretable as a text at all.
  6. Subjects are frequently wrong about the fine-grained character of their own experience. Change blindness, inattentional blindness, and the poverty of what people claim about the detail of their peripheral field all show that the world as it seems to them is richer than the world they actually have.
  7. I want to extend the method to non-linguistic animals by treating reliable discriminative behaviour — a lever press, a gaze fixation, a matching-to-sample response — as a form of report, without requiring that the animals be trained on any symbol system.
  8. The method is superior to introspectionist approaches precisely because it declines to grant the subject a privileged epistemic position.

  Please tell me which of these are genuinely incompatible, which merely look incompatible, and, for each real incompatibility, what the cheapest revision is and what I would forfeit by making it. Rank the tensions by severity rather than reporting them as equally damaging, and end by identifying the single revision that would clean up the most. Assume I know the view well enough that I do not need it summarized; I want to know where my own package breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested consistency audit:

  1.  **Analyze the Request:**
      *   **Task:** Conduct a consistency audit of 8 specific commitments held by the user regarding their adoption of heterophenomenology (Dennett's framework) for a philosophy of mind reading group.
      *   **Goal:** Identify genuine incompatibilities vs. apparent ones, propose cheapest revisions for real conflicts, explain what is forfeited, rank tensions by severity, and identify the single most effective revision.
      *   **Constraint:** Assume the user knows the view well (no summaries needed). Focus on where *their* package breaks.
      *   **Tone:** Analytical, critical, precise, philosophical.

  2.  **Analyze the Commitments:**
      *   1. *Data/Construction:* Data = utterances/behavior. Theorist constructs "world as it seems." Then asks what's real. (Standard Dennett).
      *   2. *Neutrality:* Bracketing is neutral (agnostic) re: realism/antirealism about qualia/phenomenal states. (Standard Dennettian pitch).
      *   3. *Negative Conclusion:* Accepts Dennett's conclusion: much of the constructed world is unreal; no ineffable intrinsic properties (qualia). (Substantive commitment).
      *   4. *No Third-Person Test:* No test for phenomenal properties beyond report/behavior. If there were, it wouldn't be heterophenomenology. (Methodological boundary).
      *   5. *Principle of Charity:* Attribute beliefs to make reports mostly true/rational to interpret the "text." (Standard interpretive principle).
      *   6. *Subjects Wrong:* Subjects are frequently wrong about fine-grained character (change blindness, etc.). The world *seems* richer than it is. (Empirical commitment/Illusionism).
      *   7. *Extension to Animals:* Extend to non-linguistic animals via discriminative behavior as "report" without symbols. (Extension of method).
      *   8. *Anti-Privilege:* Superior to introspection because it denies privileged epistemic position. (Epistemological stance).

  3.  **Identify Potential Tensions/Incompatibilities:**

      *   **Tension A: Neutrality (2) vs. Negative Conclusion (3).**
          *   (2) says the method is neutral/agnostic about the reality of phenomenal states.
          *   (3) says you accept the conclusion that many such states (ineffable intrinsic properties) are *unreal*.
          *   *Analysis:* Dennett often presents heterophenomenology as a neutral method that *leads* to the conclusion that qualia don't exist. However, if you *start* by committing to (3) as part of the package, (2) becomes disingenuous. Is (2) a claim about the *method itself* or *your adoption* of it? The prompt says "adopting the method commits one neither way." But if you hold (3) as a commitment *of your work*, you aren't neutral.
          *   *Severity:* High. This is the classic "Trojan Horse" criticism of Dennett. If the method *entails* the conclusion, it's not neutral. If the conclusion is independent, why tie them?
          *   *Resolution:* Clarify that the method is neutral, but your *theory* uses the method to argue for (3). Or drop the claim of strict neutrality if you think the method forces the conclusion.

      *   **Tension B: Principle of Charity (5) vs. Subjects are Frequently Wrong (6).**
          *   (5) says attribute beliefs to make reports *mostly true*.
          *   (6) says subjects are frequently wrong about the *fine-grained character* (the world seems richer than it is).
          *   *Analysis:* If I say "I see a detailed red field," and you interpret me charitably, you attribute the belief that there is a detailed red field. But (6) says the detailed red field is an illusion (unreal). So, to make my report "true," do you make the *world* detailed (violating 3/6) or do you make my belief about the *seeming* true (which is compatible)?
          *   *Refinement:* Heterophenomenology distinguishes between the *phenomenal world* (how it seems) and the *real world*. Charity applies to the *truth of the seeming*. "It seems to me there is a detailed field." That belief is true (I do have that seeming). The *object* of the seeming (the detailed field) is unreal.
          *   *Conflict:* If (5) implies making the *content* of the experience veridical regarding the external world or the intrinsic nature of experience, it clashes with (6). If (5) only applies to the *report of the seeming*, it's consistent. However, (6) says the "world as it seems to them is richer than the world they actually have." This implies the *seeming itself* is misrepresentational. If I believe "I am experiencing rich detail," and I am not, then charity is violated.
          *   *Severity:* Medium-High. This is the "Error Theory" vs. "Charity" problem. If subjects are systematically deluded about their own experience, how much charity can you apply before you stop interpreting *their* world and start imposing *yours*?

      *   **Tension C: No Third-Person Test (4) vs. Extension to Animals (7).**
          *   (4) says no test for phenomenal property over and above report.
          *   (7) treats discriminative behavior (lever press) as report.
          *   *Analysis:* This seems consistent *if* you define report broadly. However, the leap from linguistic utterance (1) to lever press (7) is significant. A lever press is ambiguous. Is it a report of *experience* or just a conditioned reflex?
          *   *Conflict:* If there is no third-person test for phenomenal properties (4), how do you distinguish a lever press that reports a *phenomenal state* from one that reports a *discrimination without phenomenality* (philosophical zombie behavior)? Heterophenomenology usually relies on the *subject's* take on their world. Animals can't give a "take."
          *   *Severity:* Medium. It stretches the definition of "text" (1).

      *   **Tension D: Neutrality (2) vs. Anti-Privilege (8).**
          *   (2) says neutral about reality of states.
          *   (8) says denies privileged epistemic position.
          *   *Analysis:* Denying privileged access is a substantive epistemological claim, not a neutral bracketing. Traditional introspectionism assumes privilege. Heterophenomenology denies it. This isn't necessarily incompatible, but (2) claims neutrality about *ontology* (realism/antirealism), while (8) is about *epistemology*.
          *   *Severity:* Low. These address different categories.

      *   **Tension E: Construction of World (1) vs. Subjects Wrong (6).**
          *   (1) Construct a world *as it seems* to the subject.
          *   (6) The world as it seems is richer than what they have.
          *   *Analysis:* If the "world as it seems" is an illusion, do you construct the illusion or the reality? You construct the illusion (the *opinion* of the subject). This seems consistent. The subject *believes* the world is rich. You record that belief.
          *   *Severity:* Low, provided "world as it seems" means "subject's model of the world," not "veridical world."

  4.  **Deep Dive into the Major Conflicts:**

      *   **Conflict 1: The Neutrality Lie (2 vs 3).**
          *   Commitment 2 claims the method is agnostic. Commitment 3 claims you accept the eliminativist conclusion derived from it.
          *   *Problem:* If you circulate this saying "I use this neutral method," but everyone knows the method's advocate uses it to eliminate qualia, and you *also* eliminate qualia, readers will suspect the neutrality is a ruse.
          *   *Philosophical Issue:* Can a method be neutral if its application systematically yields one ontological result? Dennett argues yes (it just turns out there are no qualia). Critics argue no (the method defines data in a way that excludes qualia by fiat).
          *   *Verdict:* This is the most damaging rhetorical and philosophical tension. It looks like bad faith.

      *   **Conflict 2: Charity vs. Systematic Error (5 vs 6).**
          *   Commitment 5: Make them mostly true/rational.
          *   Commitment 6: They are wrong about fine-grained character (systematic error).
          *   *Problem:* If I say "My visual field is dense and detailed everywhere," and you say "No, it's sparse, you just think it's dense," you are violating charity regarding the *content* of their experience. You are telling them what their experience *really* is, rather than taking their word for how it *seems*.
          *   *Nuance:* Heterophenomenology treats the *belief* about experience as the datum. "I believe my field is dense." That belief is real. The density is not. Charity applies to the rationality of holding the belief given their inputs. But (6) suggests the *seeming itself* is impoverished, not just the belief. If the *phenomenology* is sparse but they *report* dense, they are lying or mistaken about the phenomenology. Heterophenomenology usually collapses the distinction between seeming and believing seeming.
          *   *Verdict:* High severity. It threatens the interpretive core. If you override their report on fine-grained character with cognitive science data (change blindness), you aren't constructing *their* world; you're constructing the *scientist's* world and labeling it theirs.

      *   **Conflict 3: The Animal Leap (1/4 vs 7).**
          *   Commitment 1: Data are utterances/report behavior.
          *   Commitment 7: Lever press = report without symbols.
          *   *Problem:* Utterances allow for the construction of a "world as it seems" (propositional attitudes). A lever press indicates discrimination, not necessarily a "world." Without language, can you construct a "phenomenal world" or just a "behavioral profile"?
          *   *Verdict:* Medium severity. It requires redefining "text."

  5.  **Drafting the Audit:**

      *   *Structure:*
          1.  Introduction (acknowledge the tightrope walk).
          2.  Ranked Tensions (Severe to Minor).
          3.  For each: The Clash, Why it breaks, Cheapest Revision, Cost.
          4.  The Single Best Revision.

      *   *Refining the "Neutrality" Tension (2 vs 3):*
          *   If I keep 2, I must soften 3 (say "I remain open" vs "I accept").
          *   If I keep 3, I must soften 2 (say "The method is neutral in principle, but I find it supports...").
          *   *Cheapest:* Modify 2. Admit the method *permits* the conclusion, rather than claiming it commits one *neither* way in practice. Actually, Dennett claims the method *is* neutral, but the *results* are eliminativist. The user says "adopting the method commits one neither way." This is the Dennett line. The user *also* says "I accept the negative conclusion." This is consistent *if* the commitment comes from the results, not the adoption.
          *   *Wait, re-reading 2:* "adopting the method commits one neither way... in the way that the anthropologist's suspension of belief..."
          *   *Re-reading 3:* "I nonetheless accept the negative conclusion that the method's principal advocate draws from it."
          *   *Is this incompatible?* No, strictly speaking. I can use a neutral tool to build a specific house. *However*, the tension arises if the tool *only* builds that house. The tension is rhetorical/philosophical plausibility.
          *   *Actually, look at 5 vs 6 again.* This is the deeper technical flaw.
          *   *Charity (5)* requires interpreting the subject as rational and their reports as mostly true.
          *   *Error Theory (6)* says their reports about fine-grained experience are false (the world seems richer than it is).
          *   If the subject says "It looks detailed," and you say "No, it doesn't, that's an illusion," you are violating the heterophenomenological rule of taking the *subject's word* on how it seems. You are substituting the *third-person truth* for the *first-person seeming*.
          *   Dennett's move: The "seeming" *just is* the judgment. There is no extra "qualitative character" to be wrong about. So if they judge it is detailed, it seems detailed. The error is in thinking the *world* is detailed, not the *seeming*.
          *   But (6) says: "the world as it seems to them is richer than the world they actually have." This phrasing is tricky. Does it mean "The representation is rich" (True) or "They seem to have a rich representation but don't" (False)?
          *   If (6) means "They claim rich experience, but the neural machinery is sparse," that's fine.
          *   If (6) means "They claim rich experience, and even the *experience itself* is sparse (they are wrong about the phenomenology)," that violates the heterophenomenological reduction. Heterophenomenology says: If it seems X to you, then it *seems* X to you. You can't be wrong about the seeming, only about the world.
          *   Commitment 6 says: "Subjects are frequently wrong about the fine-grained character of their own experience." This implies error *about the experience*, not just the world. This is the killer. Dennett usually says you can't be wrong about how it seems, only about what causes it. If the user claims subjects are wrong about the *character of experience*, they are smuggling in a realist notion of experience that the method is supposed to bracket or eliminate.
          *   *Correction:* Dennett *does* say subjects are wrong about their experience (e.g., the Color Phi phenomenon). He argues there is no determinate order of experience. So subjects are wrong that there *was* a specific order.
          *   So, (5) Charity vs (6) Error. If I attribute beliefs to make them rational (5), but I conclude their beliefs about experience are false (6), I am treating them as irrational or mistaken about their own data.
          *   *Resolution:* Charity applies to *reasonableness given their cognitive architecture*, not truth of phenomenal claims.
          *   *Severity:* High. This is the "Self-Interpretation" problem.

      *   *Refining the "Neutrality" Tension (2 vs 3):*
          *   If you hold (3), you are an eliminativist/illusionist. If you hold (2), you claim methodological agnosticism.
          *   Many critics argue heterophenomenology is *not* neutral; it is eliminativism disguised as method. By holding both, the user invites the criticism that they are pretending to be neutral while holding a gun to the subject's head.
          *   *Revision:* Drop the claim of strong neutrality (2). Acknowledge the method is motivated by naturalism which leans toward (3).

      *   *Refining the "Animal" Tension (1/4 vs 7):*
          *   (1) Data = utterances. (7) Data = lever press.
          *   (4) No test beyond report.
          *   If lever press = report, this is consistent. But is it *heterophenomenology*? Heterophenomenology requires a "text" to interpret. A lever press is not a text. It requires the theorist to *impute* the content.
          *   *Revision:* Acknowledge this is an *analogy* or *extension*, not strict heterophenomenology.

  6.  **Finalizing the Ranking:**
      1.  **Charity (5) vs. Systematic Error (6).** This strikes at the heart of interpretation. If they are wrong about their experience, whose experience are you studying?
      2.  **Neutrality (2) vs. Eliminativism (3).** This is the "Bad Faith" charge. It undermines the methodological justification.
      3.  **Linguistic Data (1) vs. Animal Behavior (7).** This is a category error risk.
      4.  **No Third-Person Test (4) vs. Animal Extension (7).** (Linked to above).

      *Wait, let's look closer at 5 vs 6.*
      Dennett's solution: The "world as it seems" is a *theoretical construct* of the subject. The subject is the narrator. The narrator can be unreliable. Charity makes them *interpretable*, not *infallible*.
      So, 5 and 6 are compatible *if* Charity is understood as "make them intelligible," not "make them true."
      Commitment 5 says: "attribute to subjects beliefs that render their reports mostly true."
      Commitment 6 says: "Subjects are frequently wrong."
      "Mostly true" allows for "frequently wrong" on specific details.
      *However*, if the "fine-grained character" is the *bulk* of the report, then "mostly true" is violated.
      *Decision:* This is a tension of degree, but manageable.

      *Let's look closer at 2 vs 3.*
      (2) "adopting the method commits one neither way."
      (3) "I nonetheless accept the negative conclusion."
      This is logically consistent. I can adopt a method that doesn't *force* a conclusion, but I happen to accept the conclusion the advocate found.
      *However*, in the context of a methods statement, claiming neutrality (2) while holding the conclusion (3) often signals that the neutrality is merely procedural, not ontological.
      *Is there a deeper conflict?*
      What about (4) "No third-person test... if there were, I would no longer be doing this method."
      And (6) "Change blindness... show that the world as it seems to them is richer than the world they actually have."
      How do we know (6) is true? Via third-person tests (psychophysics).
      So we use third-person tests to correct the first-person report.
      This is consistent with Heterophenomenology (the theorist decides what is real).
      *But*, (5) Charity says make their reports *mostly true*.
      If third-person tests show their reports are false (about detail), and we prioritize the third-person tests, are we violating Charity?
      Dennett says: The report is true as a report of an *opinion*. "I see detail" = "I am inclined to judge there is detail." That belief is real. The detail is not.
      So (5) is satisfied (the belief exists), (6) is satisfied (the detail doesn't).
      *So 5 and 6 are compatible under Dennett's specific definition of 'belief'.*

      *Where is the real break?*
      It's (2).
      If you accept (3) (no ineffable intrinsic properties), you are an antirealist about qualia.
      If you claim (2) (method is neutral), you are claiming your method doesn't presuppose antirealism.
      *The Problem:* Many argue the method *presupposes* antirealism by defining data solely as public behavior (1). If you define data as behavior, you've already excluded private qualia from the data set.
      So (1) + (2) is the tension. If data *are* utterances (1), you have already ruled out private qualia as data. So you aren't neutral (2).
      *This is the "Definition vs. Neutrality" conflict.*
      Commitment 1 defines the data as public. Commitment 2 claims this definition is neutral. Commitment 3 admits the result is antirealist.
      *Critique:* You can't claim neutrality if your data definition excludes the opposing ontology by fiat.
      *Severity:* High. This is the standard objection to Dennett (e.g., from Chalmers or Searle).

      *Let's look at (7) Animals.*
      Heterophenomenology relies on the "intentional stance" and interpreting a "text."
      Animals don't produce text.
      To treat lever presses as reports (7) requires assuming the animal has beliefs to interpret.
      This relies heavily on (5) Charity.
      But without language, the "world as it seems" is underdetermined.
      Is this incompatible? No, just risky.

      *Let's look at (8) Anti-Privilege.*
      "Declines to grant the subject a privileged epistemic position."
      This is consistent with (6) Subjects are wrong.
      This is consistent with (1) Data = behavior.
      This contradicts traditional introspectionism, which is the point.

      *Okay, the strongest tension is between 1, 2, and 3.*
      1 (Data = Public) + 2 (Neutral) + 3 (Antirealist Conclusion).
      If 1 is true, 2 is false (because private data is excluded a priori).
      If 2 is true, 1 must be loosened (allow private data as potential, then reject). But 1 says data *are* utterances.
      So 1 and 2 are in tension.
      Dennett's defense: We can't *use* private data scientifically, even if it exists. So it's methodologically neutral (we don't say it doesn't exist), but practically excluded.
      But the user says "The data *are*..." (Ontological/Methodological claim).
      If the user claims (2), they must admit that the definition in (1) is a methodological filter, not an ontological exclusion.
      But (3) says "posits... are unreal."
      *Okay, the biggest friction point for a reading group:*
      Claiming Neutrality (2) while holding Eliminativism (3) often reads as disingenuous to realists.
      Claiming Charity (5) while claiming Systematic Error (6) reads as paternalistic.

      *Ranking:*
      1. **Charity (5) vs. Systematic Error (6).** If you tell the group "I interpret them charitably to make them true" and then "I think they are wrong about their own experience," they will ask: "In what sense are you interpreting *their* world?" This undermines the core phenomenological claim.
      2. **Neutrality (2) vs. Data Definition (1) & Conclusion (3).** The claim of neutrality is vulnerable to the charge that the method is rigged.
      3. **Animal Extension (7) vs. Linguistic Data (1).** Stretching the definition of "text."

      *Cheapest Revisions:*
      1. For 5/6: Clarify that Charity applies to the *rationality of the report given the inputs*, not the *veridicality of the content*. Or admit that "Charity" is limited by the "Third-Person Override."
      2. For 2: Drop the claim of "genuine neutrality." Admit the method is motivated by naturalism.
      3. For 7: Call it "Heterophenomenology*" or "Behavioral Phenomenology."

      *Single Best Revision:*
      Modify (2). Stop claiming the method is neutral. Claim it is *naturalistic*. This aligns (1), (3), (6), and (8) immediately. It removes the "Trojan Horse" accusation.

      *Wait, one more check on 5 vs 6.*
      If I say "I see 100 dots" (there are 10).
      Charity: Attribute belief "I see 100 dots." (True belief about seeming).
      Error: "There are 100 dots." (False belief about world).
      Commitment 6 says: "Subjects are frequently wrong about the fine-grained character of their own experience."
      This says they are wrong about the *experience*, not the world.
      "My experience is detailed." -> False, according to 6.
      "My experience is sparse." -> True, according to 6.
      But the subject says "Detailed."
      So the subject is wrong about their experience.
      If the subject is wrong about their experience, what is the "world as it seems"?
      Is it the world they *say* seems? Or the world that *actually* seems (which they misreport)?
      Heterophenomenology usually says: The "world as it seems" *is* the world they say seems. There is no access to the "actual seeming" other than the report.
      So if (6) claims they are wrong about the *character of experience*, it implies there is a fact of the matter about the character of experience independent of the report.
      *This contradicts (1) and (4).*
      (1) Data = utterances.
      (4) No test beyond report.
      (6) They are wrong about experience (implying we know the experience is different from the report).
      *How do we know?* Via change blindness (behavioral tests).
      So behavioral tests trump reports about experience.
      This is consistent with (4) (tests are report-guided behavior).
      But it violates the spirit of (5) Charity if the report is about the *experience*.
      *Resolution:* Dennett argues there is no "character of experience" independent of the judgments/Reports. So the subject isn't wrong about the *experience*, they are wrong that the experience *veridically represents* the world.
      But (6) says "wrong about the... character of their own experience."
      *This is the specific phrasing that breaks.*
      If the user writes "wrong about the character of their experience," they are positing a real character that differs from the reported character. This violates the heterophenomenological reduction (which collapses reported character into real character of the *opinion*).
      *Correction:* Subjects are wrong about the *world*, not the experience. Or, subjects are wrong that they *have* the experience they claim.
      *Decision:* This is a subtle but fatal phrasing error in (6).

      *Re-evaluating Severity:*
      The (6) phrasing is a technical philosophical error within the framework.
      The (2) claim is a rhetorical/strategic vulnerability.
      The (6) error is more damaging to internal consistency. The (2) claim is more damaging to external credibility.
      The prompt asks for "consistency audit of the commitments I actually hold."
      So internal consistency is key.
      (6) claims knowledge of "character of experience" that (1) and (4) say is inaccessible except via report.
      If (1) Data = Utterances, and (6) Utterances != Experience Character, then how do you know (6)?
      You know it via (4) Third-person tests.
      So (4) allows overriding (1).
      So (1) is not the *only* data for the *final theory*, only for the *construction of the world as it seems*.
      Okay, so:
      Step 1: Construct world as it seems (based on 1 & 5).
      Step 2: Evaluate reality (based on 3, 4, 6).
      In Step 1, the world *seems* detailed. (Subject says so).
      In Step 2, the world *is* sparse. (Science says so).
      So the subject is wrong about the *world*.
      Commitment (6) says: "wrong about the... character of their own experience."
      If "character of experience" = "how it seems," then they can't be wrong (by definition of heterophenomenology).
      If "character of experience" = "properties of the neural state," then they can be wrong.
      Dennett usually avoids saying "wrong about experience." He says "wrong about the properties of the world" or "the experience is not what they think it is (because 'it' doesn't exist)."
      *Verdict:* (6) is phrased in a way that contradicts the reduction in (1).

      *Plan:*
      1. Highlight the "Neutrality vs. Conclusion" tension (2 vs 3) as a rhetorical/philosophical risk (Severity: High).
      2. Highlight the "Charity vs. Error" tension (5 vs 6) as a technical inconsistency regarding the status of the "seeming" (Severity: Highest).
      3. Highlight the "Animal Extension" (7) as a category stretch (Severity: Medium).
      4. Recommend revising (2) to drop neutrality claims (cleans up the most).
      5. Recommend revising (6) to clarify *what* they are wrong about (world vs. experience).

      *Wait, which revision cleans up the most?*
      If I drop (2) (Neutrality), I align with (3) (Eliminativism). This makes the package honest.
      If I fix (6) (Error), I align with (1) (Data). This makes the package coherent.
      Fixing (6) is more important for *internal* consistency. Fixing (2) is more important for *external* reception.
      The prompt asks: "identify the single revision that would clean up the most."
      Usually, dropping the neutrality claim (2) resolves the tension with (3) and allows (6) to stand as a substantive theoretical claim rather than a methodological discovery. If you admit you are a naturalist/eliminativist, then (6) is just your theory, not a paradox of the method.
      Actually, fixing (6) is crucial. If you say "Subjects are wrong about the character of their experience," you are claiming access to the character of experience independent of report. This violates (4).
      So (6) contradicts (4).
      (4) No test for phenomenal property over and above report.
      (6) We know they are wrong about phenomenal property (via change blindness).
      Change blindness tests *report-guided behavior*. It does not test *phenomenal property* directly.
      So (6) must be phrased: "Subjects are wrong about the *world*," OR "Subjects' reports of phenomenal properties are not reliable guides to *anything* real."
      If (6) says "wrong about... experience," it implies experience is a thing they can be wrong about.
      *Okay, I will recommend revising (6) to align with (1) and (4).*
      *Wait, revising (2) is "cheaper".* Changing "Neutral" to "Naturalistic" is one word. Changing (6) requires rethinking the illusionism claim.
