  This is a sophisticated package, but it contains the classic fault lines found in Dennettian heterophenomenology, sharpened by your specific commitment to illusionism (3) and animal extension (7). The tensions range from rhetorical vulnerabilities to genuine logical friction.

  Here is the consistency audit, ranked by severity.

  ### 1. The Interpretive Override (Severity: Critical)
  **The Clash:** Commitment 5 (Principle of Charity) vs. Commitment 6 (Systematic Error).
  **The Problem:** Commitment 5 requires you to attribute beliefs that render reports *mostly true* to make the subject interpretable. Commitment 6 asserts that subjects are *frequently wrong* about the fine-grained character of their experience (e.g., claiming rich peripheral detail where there is none). If you accept (6) as a substantive finding, you are systematically overriding the subject's report about their own experience with third-person data. This violates the spirit of (5). If the subject says "It looks detailed" and you say "No, the phenomenology is sparse," you are no longer constructing *their* world (1); you are constructing the *neuroscientist's* world and labeling it theirs.
  **Cheapest Revision:** Qualify (5) to specify that Charity applies to the *rationality of the judgment given their cognitive inputs*, not the *veridicality of the phenomenal content*. Alternatively, rephrase (6) to say subjects are wrong about the *world*, not the *experience* (though this weakens the illusionist claim).
  **What You Forfeit:** You forfeit the claim that the subject is the ultimate authority on "how it seems." You must admit that the theorist's model of the subject's experience can trump the subject's own description of it.

  ### 2. The Trojan Horse (Severity: High)
  **The Clash:** Commitment 2 (Methodological Neutrality) vs. Commitment 3 (Eliminativist Conclusion).
  **The Problem:** You claim the method is "genuinely neutral" (2), akin to an anthropologist studying gods, yet you "nonetheless accept" the conclusion that qualia are unreal (3). While logically possible (a neutral tool can yield a specific result), this is the most common philosophical objection to heterophenomenology: that the definition of data in (1) *already* excludes private qualia by fiat. Claiming neutrality while holding an eliminativist conclusion invites the charge of bad faith—that the neutrality is a ruse to smuggle in antirealism.
  **Cheapest Revision:** Drop the claim of "genuine neutrality" in (2). Reframe the method as *methodologically naturalistic*. Acknowledge that the bracketing is motivated by a commitment to third-person explainability, not agnosticism.
  **What You Forfeit:** You lose the rhetorical high ground of "impartiality." You must admit that the method is designed to serve a naturalistic ontology, which makes it less palatable to dualists or realists in the reading group, but far more honest.

  ### 3. The Category Stretch (Severity: Medium)
  **The Clash:** Commitment 1 (Utterances as Data) vs. Commitment 7 (Animal Behavior as Report).
  **The Problem:** Heterophenomenology relies on interpreting a "text" (utterances) to construct a "world as it seems." A lever press (7) is not a text; it is a signal. To treat it as a report of a *phenomenal world* requires a massive leap of the Principle of Charity (5) without the semantic constraints of language. Without language, you cannot distinguish a report of *experience* from a report of *discrimination* (zombie behavior).
  **Cheapest Revision:** Explicitly frame (7) as an *analogy* or *extension* ("Heterophenomenology*"), acknowledging that the "world as it seems" for animals is vastly more underdetermined than for humans.
  **What You Forfeit:** You forfeit the claim that you are applying the *same* method to animals as to humans. You are applying a *structurally similar* method to a different category of data.

  ### 4. The Epistemic Boundary (Severity: Low)
  **The Clash:** Commitment 4 (No Third-Person Test) vs. Commitment 6 (Change Blindness Evidence).
  **The Problem:** You claim there is no test for phenomenal properties over and above report (4), yet you cite change blindness (6) as proof that subjects are wrong about their experience. Change blindness *is* a third-person test.
  **Resolution:** This is only a tension if you think change blindness tests *phenomenal properties*. It tests *discriminative capacity*. As long as you maintain that the test shows the *report* is unreliable (not that it accesses the qualia directly), (4) and (6) are consistent.
  **Cheapest Revision:** Ensure (6) is phrased to emphasize that these tests show the *unreliability of the report*, not direct access to the phenomenal character.
  **What You Forfeit:** Nothing, provided you maintain the distinction between testing behavior and testing "qualia."

  ---

  ### The Single Revision That Cleans Up the Most

  **Revise Commitment 2.**

  **Current:** "That bracketing is genuinely neutral: adopting the method commits one neither to realism nor to antirealism..."
  **Proposed:** "That bracketing is **methodologically naturalistic**: adopting the method prioritizes third-person explainability, which typically supports an antirealist stance..."

  **Why this is the key:**
  1.  **Resolves the Trojan Horse:** It aligns your methodological description (2) with your theoretical conclusion (3). You stop claiming to be an agnostic anthropologist and admit to being a naturalistic engineer.
  2.  **Licenses the Override:** It dissolves the tension between Charity (5) and Error (6). If the method is neutral, overriding the subject looks like a violation. If the method is naturalistic, overriding the subject with empirical data is the *point*.
  3.  **Supports Animal Extension:** It makes (7) easier to defend. You aren't claiming animals have "texts" in the human sense; you are claiming their behavior is data for a naturalistic model of their cognitive world.

  By sacrificing the claim of neutrality, you gain a coherent, honest package where the method, the data, and the conclusion all pull in the same direction.
