  **I**

  In the year the frost killed the vines, Elias was twenty years old and held the ladder for his master. They were repairing the north wall of the chapter house, where the rain had driven through the mortar and rotted the beams behind the stone. The master did not speak of styles or ages. He spoke of load and balance. He told Elias to mix the lime with sand from the river bend, because the old sand had too much salt. They pulled down the loose stones and numbered them with chalk so they could be put back in the same order. When a carving of a leaf was found broken, the master told Elias to cut a new one that matched the wear on the old one, so the eye would not catch on the difference. The work was slow. The goal was invisibility. When the scaffolding came down, the wall looked as it had before the frost, as it had for a hundred years. Elias wiped the dust from his hands and thought only of the warmth of the hearth and the weight of the hammer in his belt.

  ***

  *Excerpt from a survey of architectural history, published 1890:*
  *The period from 1480 to 1500 represents the twilight of the Gothic tradition. Structural integrity remains, but imaginative vigor has stalled. Builders in this era merely copied predecessors without understanding the underlying spiritual geometry. It is a time of stagnation, marked by a repetitive adherence to outdated forms.*

  ***

  **II**

  Twenty years later, Elias was the master. The councilors of the town had changed. The men who sat on the dais were younger, and they had traveled to the southern cities where the light was different. They called Elias into the chamber and showed him a drawing on parchment. It depicted a wall without the dark recesses of the north side. It showed columns that stood clear of the shadow, and spaces that let the sun strike the floor. One councilor tapped the drawing. He said the old wall was gloomy. He said it reminded them of a time of sickness and war. He wanted the stone scraped clean. He wanted the blackened statues taken down. He did not ask for invisibility. He asked for a break.

  Elias argued that the stone would weaken if scraped too thin. The councilor said strength was less important than appearance. They wanted the town to look forward, not back. Elias went to the yard and told his apprentices to bring the chisels. They worked for months. They removed the soot of centuries. They took down the statues of the saints who had protected the town during the plague and put them in crates in the cellar. Elias kept one small angel in his own workshop. He did not know why. He simply could not bear to see it smashed. When the wall was finished, it was pale and bright. The neighbors said it looked new. Elias knew the stone was the same stone his master had set, but it no longer looked like the same wall. He felt a strange lightness, as if he had cut a rope that held the building to the ground.

  ***

  *Excerpt from a cultural history, published 1950:*
  *The decades around 1500 mark the dawn of the Renaissance in the north. A sudden clarity emerges in public works. Architects reject the gloomy complexity of the medieval for the rational order of the classical. This is not merely aesthetic; it is philosophical. The break is sharp. The year 1495 serves as a convenient boundary between the old darkness and the new light.*

  ***

  **III**

  Elias was old now, and his hands shook when he held the pencil. The town had grown. New houses were being built beyond the river, using brick instead of stone. Young men came to his workshop to ask about the pale wall in the square. They called it a monument. They asked if he had designed it to look like the buildings of the ancients. Elias told them he had designed it to satisfy the councilors. They asked if he felt he was part of a movement. He told them he was part of a payroll.

  He went into the cellar and opened the crate. The angel was covered in dust. It looked dark again. He took a cloth and wiped the face. It shone pale in the candlelight. He realized that if he had left it on the wall, it would have been scraped white. Because he had saved it, it remained dark. The people in the square looked at the white wall and saw a new age. If they looked at the angel in his hand, they would see the old one. Both were made in the same year. Both were made by the same hand. The difference was only where they stood.

  He put the angel back in the box. He walked out into the square and looked at the wall. The sun was setting, and the stone was turning gray. It looked like the old wall again. He understood then that the light did not come from the stone. It came from the people who decided where to stand to look at it. He went home and wrote the date on his ledger. He did not write the name of the age. He wrote only the day's wage and the cost of the lime.

  ***

  The story argues for the "lamplighter" view: periods are not discovered joints nor mere inventions, but self-fulfilling prophecies. The characters act on emerging narratives (the councilors' desire for "newness"), which physically alters the record (scraping the wall, storing the statue). This material change validates the later historians' conflicting labels in the seams. The "Real Joints" view is left standing in the physical continuity of the stone; the "Invented Labels" view remains in the historians' contradictory dates. The story suggests periods become real because we build them to match the map.

  \answer{Periods are not found in the past but are constructed by present choices that alter the past's physical remains to fit the narrative.}
