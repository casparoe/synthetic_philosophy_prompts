      *   **John Searle (Chinese Room/Biological Naturalism):** Syntax (symbol manipulation) is not Semantics (meaning). A computer simulates pain but doesn't feel it. Only biological brains have "original intentionality" due to specific causal powers. Replicants are just sophisticated Chinese Rooms.

  3.  **Analyze *Blade Runner* (1982) through these lenses:**
      *   **The Voight-Kampff (VK) Test:** This is the Turing Test + Lie Detector. It measures physiological response to emotional stimuli. If replicants pass (or nearly pass), they functionally have emotion.
      *   **Implanted Memories (Rachael):** Tyrell gives them a past to ground their emotions. Searle would say: "Fake past = fake emotion." Dennett would say: "If the past structures the present behavior coherently, it's a real past for the agent."
