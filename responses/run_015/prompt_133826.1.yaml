      *   *The "Bio" Loophole:* Searle insists on biology. Replicants *are* biological (genetic engineering), not silicon. So Searle might actually be forced to concede they have original intentionality *if* he accepts their tissue is functionally equivalent to human tissue. But the film treats them as "manufactured."
      *   *Dennett's Victory:* The film forces the *audience* and Deckard to take the Intentional Stance. We feel for Roy. Therefore, ethically, the stance *creates* the reality.
