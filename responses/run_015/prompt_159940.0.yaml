prompt: |-
  I run a reading group on promissory obligation, and the argument has been going round in circles for a year, so I want a diagnosis rather than a verdict. One camp says the practice does the work: to promise is to invoke a social institution with a point — giving others reliable assurance about one's future conduct — and the obligation is to do what that institution, properly described, requires; whether keeping the promise does anyone any good is beside the point, and the wrong in breaking it is infidelity rather than harm. The other camp says a practice can only ever be a transmission mechanism: what matters is that the promisee has been given a normative power over the promiser's conduct, or that there is something intrinsically bad about being let down by someone one trusted, so a promise no one relies on, or whose keeping benefits no one, raises a quite different question. I am not asking about contracts or legal enforcement.

  My hypothesis is that these are not two answers to one question. One camp is asking what the practice we actually have requires of someone who has invoked it; the other is asking what would make such requirements genuine moral requirements rather than conventions. Each side slides between the two, so every exchange stalls: one side produces cases where the practice's rules and morality come apart, the other replies that those are cases where the practice has been misdescribed, and neither point is one the opposition ever denied. Behind that I suspect a further disagreement nobody argues for — about whether an act of will can generate a reason at all.

  Test it against a case I think neither side handles well. Call it the disowned promise: before Alf says anything, Bea tells him that she does not accept promises, does not want that kind of claim on him, and will not recognise one if he makes it. Alf promises anyway. Later Bea finds she has relied, is let down, and resents it. Is there a promissory obligation here, and if not, what is left? Now vary one feature: the same disclaimer, but the two have for years relied on each other's bare word, and Bea knows she will rely again.

  What kind of disagreement is this actually — verbal, a dispute about which cases count as data, or bedrock intuitions about the authority of the will? And given your diagnosis, what would count as progress? I would rather have a distinction that dissolves part of it, or an argument that no convergence should be expected, than another survey of the two positions.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group on promissory obligation stuck in a loop for a year.
      *   **The Two Camps:**
          *   Camp A (Practice/Institution): Promising is invoking a social institution. Obligation comes from the rules of that institution (infidelity is the wrong). Consequentialist considerations (harm/benefit) are secondary.
          *   Camp B (Normative Power/Reliance): Practice is a transmission mechanism. What matters is the normative power transferred or the harm of betrayal/reliance. Empty promises (no reliance/benefit) are problematic.
      *   **User's Hypothesis:** They aren't answering the same question. Camp A asks "What does the practice require?" (Descriptive/Conceptual). Camp B asks "What makes these requirements *moral*?" (Justificatory/Normative). There's a slippage between these questions. Underlying this is a disagreement about whether the will can generate reasons (Voluntarism).
      *   **The Test Case:** "The Disowned Promise." Alf promises Bea *after* she explicitly rejects promises/disclaims authority.
          *   Variant 1: Pure disclaimer. Bea relies anyway, gets let down, resents.
          *   Variant 2: Disclaimer + History of reliance. Bea knows she will rely.
      *   **The Goal:** A diagnosis of the disagreement (Verbal? Data selection? Bedrock intuitions?) and a path to progress (Dissolution? Acceptance of divergence?). No surveys of positions. No legal/contract talk.

  2.  **Evaluate the User's Hypothesis:**
      *   The user suggests a distinction between *internal rules of the practice* vs. *external moral justification*.
      *   *Critique:* This is strong, but maybe slightly off. Camp B (Normative Power) often claims to be describing the *nature* of the obligation, not just justifying it externally. However, the user is right that Camp A leans towards "This is what promising *is*" while Camp B leans towards "This is why promising *binds*."
      *   *Refinement:* The deeper issue is likely about *source of normativity*. Is the normativity internal to the convention (Practice View) or does the convention merely facilitate a pre-existing moral power (Will/Reliance View)?

  3.  **Analyze the Test Case ("The Disowned Promise"):**
      *   *Scenario 1 (Pure Disclaimer):* Alf promises despite Bea saying "Don't."
          *   Camp A (Practice): If Alf invokes the institution, he's bound by its rules. Bea's rejection might be irrelevant to the *existence* of the obligation, only to whether she can claim it. But if she doesn't recognize the institution, can he invoke it *towards her*? Promising is interpersonal.
          *   Camp B (Will/Reliance): If Bea rejects the normative power, Alf cannot transfer it. If she doesn't rely (initially), there's no harm. If she relies *despite* the disclaimer, is that Alf's fault?
          *   *Result:* Both struggle. Camp A makes Alf bound to someone who opted out. Camp B makes Alf not bound, but Bea's resentment seems intelligible.
      *   *Scenario 2 (History of Reliance):* Disclaimer + Pattern.
          *   Camp A: The practice is entrenched. The disclaimer is a formality overridden by conduct.
          *   Camp B: Reliance creates the obligation (or the harm). The disclaimer is undermined by the expectation created by history.
          *   *Result:* This variant pushes both towards an obligation, but for different reasons (Convention vs. Reliance/Expectation).

  4.  **Diagnose the Disagreement:**
      *   Is it verbal? No. They agree on the word "promise," they disagree on the *ground* of the obligation.
      *   Is it about data? Partially. Camp A treats "I promise" utterances in vacuo as data. Camp B treats "harmless broken promises" as counter-evidence to obligation.
      *   Is it bedrock? Yes. It's about the **Authority of the Will vs. The Authority of the Good/Practice**.
      *   *Key Insight:* The user's hypothesis about "Practice Requirements" vs. "Moral Justification" is good, but the *real* stall point is **The Scope of the Second-Personal Standpoint**.
      *   Camp A says: Entering the practice creates a second-personal claim *by definition*.
      *   Camp B says: A second-personal claim requires *uptake* or *reliance* to be moral.
      *   The "Disowned Promise" reveals the friction: Can I impose a second-personal claim on you without your consent to the *framework*?

  5.  **Formulate the Diagnosis:**
      *   **The Category Error:** The group is conflating **Constitutive Rules** (what counts as a promise) with **Normative Force** (why you must keep it).
      *   **The Real Divide:** It's not Practice vs. Will. It's **Exclusionary Reasons** vs. **Ordinary Reasons**.
          *   Camp A (Practice): Promising creates an *exclusionary reason* (you don't weigh the good/bad, you just do it).
          *   Camp B (Transmission): Promising aggregates ordinary reasons (reliance, harm, trust).
      *   **The "Disowned Promise" Function:** It tests *Uptake*.
          *   If the Will is sovereign (Camp B-ish), Bea's disclaimer blocks the obligation.
          *   If the Practice is sovereign (Camp A-ish), Alf's invocation binds him regardless, because the practice exists independently of Bea's momentary will.
      *   **The Stalemate:** Camp A thinks Camp B reduces promising to mere prediction/reliance (losing the *obligation*). Camp B thinks Camp A makes promising magical/fetishistic (obligation without point).

  6.  **Develop a Path to Progress:**
      *   Stop asking "Is there an obligation?" Start asking "What kind of reason is generated?"
      *   **Dissolution Strategy:** Distinguish between **Obligation** (Bindingness) and **Accountability** (Standing to Blame).
          *   In the Disowned Promise (Variant 1): Alf might have an obligation (to himself/the practice), but Bea lacks *standing* to resent (she opted out).
          *   In Variant 2: Bea regains standing through the pattern of reliance (estoppel-like, but moral).
      *   **Acceptance of Divergence:** Acknowledge that "Promissory Obligation" might be a cluster concept. Sometimes it's Practice-based (formal), sometimes Reliance-based (informal). The friction arises when treating them as unitary.
      *   **The "Bedrock" Issue:** The voluntarism question (Can will create reasons?) is indeed the engine. Progress requires admitting this is a meta-ethical stalemate unless they shift to **Second-Personal Authority** (Darwall). The question isn't "Can will create reasons?" but "Can I authorize you to hold me accountable?"

  7.  **Drafting the Response:**
      *   *Validate the User:* Their hypothesis is sharp. Confirm the slippage between "internal rules" and "moral force."
      *   *Refine the Diagnosis:* It's a dispute about **Uptake** and **Second-Personal Standing**.
      *   *Analyze the Case:*
          *   Variant 1: Shows the limit of the Will. Alf binds himself, but Bea cannot claim. Resentment is misplaced (or reveals she *does* accept the practice despite words).
          *   Variant 2: Shows the limit of the Practice. The history overrides the disclaimer. Reliance re-establishes the normative link.
      *   *Propose Progress:*
          1.  **Split the Concept:** Distinguish *Fidelity* (internal to promiser) from *Accountability* (external, promisee's standing).
          2.  **Focus on Uptake:** Make "Uptake" the explicit variable.
          3.  **Meta-Ethical Truce:** Acknowledge the Voluntarism deadlock. Shift to phenomenology of resentment.
      *   *Tone:* Philosophical, diagnostic, respectful of the stalemate, avoiding "solving" the ethics.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I talk about contracts? No.
      *   *Check:* Did I give a verdict? No.
      *   *Check:* Did I address the "Disowned Promise"? Yes, crucial.
      *   *Refinement on User's Hypothesis:* The user says Camp A = Practice Requirements, Camp B = Moral Requirements. I should nuance this. Camp A thinks Practice *constitutes* the Moral Requirement. Camp B thinks Practice *transmits* Independent Moral Reasons. The slippage is indeed treating the *existence* of the practice as sufficient for *moral bindingness*.
      *   *Key Terminology:* Use "Standing to Blame" vs. "Existence of Duty." This often dissolves the "Disowned Promise" tension. Alf has a duty (maybe), Bea has no standing (in V1).

  9.  **Final Polish:** Ensure the distinction between "Obligation" and "Accountability" is clear, as this is the most productive tool for reading groups stuck on this. (Referencing Darwall or Wallace implicitly without name-dropping too much). Ensure the "Voluntarism" point is addressed as the engine of the stalemate.

  **(Self-Correction Note):** Wait, I need to be careful not to just repeat the user's hypothesis back to them. I need to *test* it and *extend* it. The user thinks it's Practice-Description vs. Moral-Justification. I think it's more about **The Locus of Normativity** (Institution vs. Interaction) and **The Conditions of Standing**. I will incorporate their insight but push it toward the "Standing/Accountability" distinction which handles the Disowned Promise better.

