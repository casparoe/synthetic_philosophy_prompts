answer: |-
  Your hypothesis is sharp, and it correctly identifies the structural slippage that fuels the stalemate. However, I suggest the diagnosis can be tightened. The disagreement is not merely between "what the practice requires" (descriptive) and "what makes it moral" (justificatory). Both camps claim to be offering a moral account.

  The deeper diagnosis is that your group is conflating **the existence of a duty** with **the standing to enforce it**, and they are doing so against a background disagreement about **bipolarity**.

  Here is the diagnosis of the disagreement, an analysis of your test case, and a proposal for progress that avoids a verdict.

  ### 1. The Diagnosis: Bipolarity and the Locus of Normativity

  The circle persists because the two camps are arguing past each other on the **structure** of the obligation, not just its source.

  *   **Camp A (Practice)** treats promissory obligation as **monadic** (primarily). To promise is to bind *oneself* by invoking a rule. The obligation exists once the ritual is performed correctly. The promisee is the beneficiary of the duty, but not necessarily its co-author. This is why they feel Bea's disclaimer is irrelevant: Alf bound *himself*.
  *   **Camp B (Will/Reliance)** treats promissory obligation as essentially **bipolar**. The obligation is a normative relation *between* two people. It requires a transfer of authority or a specific impact on the promisee. Without the promisee's uptake (acceptance of the authority) or reliance, the relation is not established. This is why they feel the disclaimer is fatal: Bea refused the authority.

  **The Slippage:**
  When Camp A says "There is an obligation," they mean "Alf has violated a constitutive rule of agency."
  When Camp B says "There is no obligation," they mean "Bea has no standing to hold Alf accountable."
  Both use the phrase "promissory obligation," but Camp A is tracking **Fidelity** (internal consistency with the practice), while Camp B is tracking **Accountability** (external liability to another).

  **The Bedrock:**
  You are correct that voluntarism is the engine. Camp A assumes the will can bind the self via public rules. Camp B assumes the will can only bind the self if it successfully alters the normative situation of *another*. This is a meta-ethical deadlock about whether reasons can be created ex nihilo by convention.

  ### 2. Testing the "Disowned Promise"

  Your test case is excellent because it isolates **Uptake**. Let's apply the Bipolarity/Accountability distinction.

  **Variant 1: Pure Disclaimer**
  *   *Alf promises; Bea rejects the framework.*
  *   **Camp A (Practice):** Alf is obligated. He invoked the institution. Bea's resentment is justified because he broke the rule, even if she verbally opted out. (Problem: This makes obligation coercive; it imposes a normative status on Bea she rejected.)
  *   **Camp B (Will/Reliance):** Alf is not obligated. He cannot unilaterally impose a duty. Bea's resentment is irrational or misplaced (perhaps she is disappointed, but not *wronged*). (Problem: This makes promising too fragile; anyone can opt out of being promised.)
  *   **Diagnosis via Distinction:** Alf may have a duty of **Fidelity** (he ought to keep his word to maintain his own integrity as a practitioner of the institution), but Bea lacks the **Standing** to resent him. She waived her right to the claim. Her resentment reveals she *actually* accepts the practice despite her words, or it is merely frustration at a failed prediction.

  **Variant 2: Disclaimer + History of Reliance**
  *   *Alf promises; Bea rejects framework but relies based on history.*
  *   **Camp A (Practice):** The history confirms the practice is in force. The disclaimer is noise. Obligation stands.
  *   **Camp B (Will/Reliance):** The reliance recreates the normative link. The disclaimer is overridden by conduct (estoppel). Obligation stands.
  *   **Diagnosis via Distinction:** Here, the two camps converge on the *result* (there is an obligation) but for different structural reasons. Camp A says the Practice subsumed the disclaimer. Camp B says the Reliance restored the Bipolar link.
  *   **The Residual Conflict:** If Bea relies *knowing* Alf knows she disclaims promises, Camp B might argue Alf is not liable for her "voluntary" reliance. Camp A would argue Alf is liable because he invoked the practice. This reveals the bedrock: **Can I be liable for your reliance if I told you not to rely?**

  ### 3. What Counts as Progress?

  Since the voluntarism deadlock (Can the will create reasons?) is likely unresolvable in a reading group setting, progress requires changing the question. You need to decouple the concepts your group has fused.

  **Strategy A: The Accountability/Fidelity Split**
  Propose that "Promissory Obligation" is a cluster concept containing two distinct normative phenomena:
  1.  **The Duty of Fidelity:** A duty the promiser owes to the practice/to themselves to be consistent. (Camp A's domain).
  2.  **The Right to Claim:** A power the promisee holds to demand performance or resent failure. (Camp B's domain).

  *Progress looks like:* Agreeing that in the **Disowned Promise (Variant 1)**, Alf violates Fidelity (he is untrustworthy *simpliciter*), but Bea lacks the Right to Claim (she cannot legitimately resent *as a promisee*). This allows Camp A to say "He did wrong" and Camp B to say "She can't blame him" without contradiction.

  **Strategy B: The Uptake Condition**
  Shift the debate from "What creates the obligation?" to "What constitutes **Uptake**?"
  *   Camp A implies Uptake is passive (hearing the promise).
  *   Camp B implies Uptake is active (accepting the authority/relying).
  *   *Progress looks like:* Analyzing the **Disowned Promise (Variant 2)**. Does long-term reliance count as *tacit* Uptake that overrides explicit disclaimer? If Camp B says "Yes," they move closer to Practice. If Camp A says "No, explicit disclaimer always wins," they move closer to Will. This forces them to refine their boundary conditions rather than restating first principles.

  **Strategy C: Accept the Divergence (The Wittgensteinian Move)**
  Argue that the "circle" is a feature, not a bug. Promising is a **family resemblance** concept.
  *   In formal contexts (oaths, vows), Camp A (Practice) dominates.
  *   In informal contexts (friendship, casual agreements), Camp B (Reliance/Trust) dominates.
  *   *Progress looks like:* Stopping the search for a Unified Theory of Promissory Obligation. The "Disowned Promise" is a **borderline case** designed to break the concept. Acknowledge that in this specific weird case, our intuitions fracture because the concept itself fractures.

  ### Recommendation

  I recommend **Strategy A (The Accountability/Fidelity Split)**.

  It respects your hypothesis that they are asking different questions, but it gives them a vocabulary to map those questions onto the same case without talking past each other.

  **The Proposal to the Group:**
  "For the next session, let us assume both camps are partially right but describing different normative relations. Camp A is describing the **Promiser's Integrity** (Fidelity). Camp B is describing the **Promisee's Standing** (Accountability).
  Apply this to the **Disowned Promise**:
  1.  Does Alf violate Integrity? (Camp A wins).
  2.  Does Bea have Standing? (Camp B wins).
  3.  If the answers differ, is 'Promissory Obligation' the right name for the whole thing, or do we have two different things that usually travel together?"

  This moves the group from a stalemate about *truth* to a collaborative analysis of *structure*. It dissolves the circle by showing that the circle was drawn around two distinct points.
