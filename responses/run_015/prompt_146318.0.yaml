  10. **Final Polish:** Check against the prompt's constraints. (No citations, conceptual diagnosis, respect both fields). *Self-correction: Ensure I don't dismiss Kripke too easily; acknowledge why OE was attractive (haecceity) before showing why biology strains it.*

