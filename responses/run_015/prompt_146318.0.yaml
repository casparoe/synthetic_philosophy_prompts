      *   *Section 3 (Modality Breakdown):* This is crucial. Philosophers use "possible worlds" as logical spaces. Biologists use "phase spaces." Biology shows *causal* independence from precise micro-states. Metaphysics claims *ontological* dependence. The breakdown is that biology describes *continuity of form*, while OE demands *continuity of substance/history*.
