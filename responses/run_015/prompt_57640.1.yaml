  *(Word Count Management)*: I need to expand on the implications of the Bishop's act vs. Halden's "normality." Halden is about simulating freedom; the Bishop is about transcending justice. That's a key distinction. Also, need to ensure the Fantine point lands hard regarding "less-eligibility."

