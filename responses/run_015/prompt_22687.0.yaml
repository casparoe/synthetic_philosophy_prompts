          *   *Bernard Williams:* Critique of utilitarianism (integrity, projects).
          *   *Evolutionary/Psychological reality:* We are wired for partiality.
          *   *Synthesis:* It's not necessarily a *bias* in the negative sense; it might be a feature of human morality.

      *   **Reframing for a Physicist:**
