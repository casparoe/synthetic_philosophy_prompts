      *   *Why Killing?* Because the agent *stopped the flow*. The resumption is just undoing the stop. The *state of stopped flow* is the killer. The agent maintains that state by omission.
      *   *Why not Action?* Because pressing 'Resume' is an action. Not pressing is an omission.
      *   *Why Killing?* Because the *interruption* was agent-caused. The *continuation of interruption* is agent-maintained.
      *   *Control:* Patient is on bypass. Machine alarms "Low Battery". Agent *omits* to change battery.
      *   *Difference:* In Target, Agent *initiated the stop*. In Control, Agent *failed to prevent the stop*.
      *   *Wait, Constraint:* "The death is not better explained by... a lethal process already underway independently."
      *   In Target, the lethal process (no blood flow) is *created* by the calibration.
      *   In Control, the lethal process (machine failure) is *independent* (battery dies naturally).
      *   This fits the "Threat Test".

  3.  **Drafting the Case:**
      *   **Target:** "The Calibration Pause."
      *   **Control:** "The Battery Failure."
      *   **Tests:**
          1.  Action/Omission: Both are omissions (not pressing resume vs not changing battery).
          2.  Threat: Target (Agent introduced the stoppage); Control (Battery died naturally).
          3.  Agency: Target (Agent engaged the machine's 'stop' feature); Control (Agent withheld the 'fix' feature).
      *   **Fragility:** Professional role. If I'm not the technician, I'm not killing. I must acknowledge this.

  4.  **Refining the "No Bodily Movement" Constraint:**
      *   In "Calibration Pause," the agent presses 'Start Calibration'. Then sits. Machine stops. Agent does not press 'Resume'.
      *   Is "not pressing" an omission? Yes.
      *   Is there movement? No.
      *   Is it killing? Yes, because the agent *paused* the life support.
      *   *Wait:* If the calibration *automatically resumes*, then it's not an omission. It must require manual resume.
      *   *Plausibility:* Medical devices often require "Confirm" after calibration.
      *   *Permissibility:* Calibration is standard maintenance.

  5.  **Final Polish:**
      *   Ensure the distinction between "Killing" and "Letting Die" is clear.
      *   Killing: Agent is the source of the lethal sequence.
      *   Letting Die: Agent is a bystander to a lethal sequence.
      *   In Target, the lethal sequence (cessation of flow) begins *because* the agent initiated calibration.
