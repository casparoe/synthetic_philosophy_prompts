answer: |-
  ### Target Case: The Calibration Pause

  **Setting:** A standard intensive care unit.
  **Patient:** A patient with total heart failure, sustained exclusively by a heart-lung bypass machine. The patient is conscious but paralyzed for comfort (permissible, consensual).
  **Agent:** The perfusionist (machine technician).
  **Setup:** The bypass machine requires a mandatory 30-second flow calibration every four hours to ensure accuracy. This is standard, permissible procedure. To calibrate, the agent presses "Start Calibration." The machine *automatically clamps the tubes and stops blood flow* for the 30-second cycle. At the end of the cycle, the machine beeps and displays "PRESS RESUME TO RESTORE FLOW." It does not resume automatically (a safety feature to prevent air embolism if lines were opened).
  **The Omission:** The agent initiates the calibration at 12:00. The flow stops. The cycle completes at 12:00:30. The agent remains seated, hands in lap, looking at the screen. The agent *omits* to press "RESUME." The agent makes no bodily movement after the initial "Start" press.
  **Outcome:** Blood flow remains stopped. The patient dies of circulatory arrest at 12:05.
  **Pre-theoretic Verdict:** This is **Killing**. Although the agent did not move at the moment of death, the agent initiated the stoppage of life-support and failed to undo it. The death results from an *agent-interrupted* life process, not a natural failure.

  ### 1. Matched Control Case: The Battery Failure

  **Setting:** Same ICU, same patient, same machine.
  **Agent:** Same perfusionist.
  **Setup:** The machine is running normally. A low-battery warning appears (the machine is unplugged due to a floor wash, permissible). The battery has 5 minutes of charge.
  **The Omission:** The agent remains seated, hands in lap. The agent *omits* to plug the machine back in or swap the battery.
  **Outcome:** The battery dies. The machine stops. Blood flow stops. The patient dies of circulatory arrest.
  **Pre-theoretic Verdict:** This is **Letting Die**. The machine failed due to a natural limitation (battery depletion). The agent failed to prevent the failure, but did not initiate the stoppage. The death results from the *natural exhaustion* of the life-support, which the agent failed to arrest.

  ### 2. Three Tests

  | Test | Target Case (Calibration) | Control Case (Battery) |
  | :--- | :--- | :--- |
  | **1. Action/Omission Test**<br>(Did the agent perform a bodily movement causing death?) | **Omission.** After the "Start" press, the agent was static. Death occurred due to *not pressing* "Resume." | **Omission.** The agent was static. Death occurred due to *not plugging in* the cord. |
  | **2. Threat Test**<br>(Did the agent introduce the lethal threat or fail to stop a pre-existing one?) | **Agent-Introduced Threat.** The cessation of blood flow was *caused* by the calibration command. The threat (no flow) would not exist but for the agent's setup. | **Pre-existing Threat.** The battery depletion is a natural process independent of the agent's specific commands. The threat arises from the environment/machine limits. |
  | **3. Agency Test**<br>(Did harm come from engaging a harmful feature or withholding a preventive one?) | **Engaging Harmful Feature.** The agent engaged the "Clamp/Stop" function (via calibration). The omission was merely sustaining that engagement. | **Withholding Prevention.** The agent withheld the "Power/Charge" function. The machine disengaged itself. |

  ### 3. Analysis of Verdicts and Key Feature

  **Which tests deliver "Killing"?**
  In the Target Case, the **Threat Test** and the **Agency Test** deliver the "Killing" verdict. The Action/Omission test delivers "Omission" for both cases, yet our moral intuition distinguishes them (Killing vs. Letting Die). Therefore, the Action/Omission test collapses the distinction, failing to track the moral reality. The Threat and Agency tests successfully identify the Target Case as Killing because they locate the *source of the lethal sequence* in the agent's prior permissible action which created a dependency on a subsequent restoration.

  **Which tests collapse it back to "Letting Die"?**
  The **Action/Omission Test** collapses the Target Case into "Letting Die." A defender of this test argues that since the immediate cause of death was the *absence* of a "Resume" press (a non-event), it is structurally identical to the *absence* of a battery swap.

  **The Single Feature Doing the Work:**
  The feature is **Causal Origination of the Threat**.
  In the Target Case, the lethal state (stopped flow) is an *artificial state* created by the agent. In the Control Case, the lethal state (stopped flow) is a *default state* of the system (entropy/failure) that the agent failed to prevent. The distinction between Killing and Letting Die tracks whether the agent *made the patient vulnerable* to the specific threat that killed them, even if the final trigger was an omission.

  ### 4. The Redescription and Evaluation

  **Defender's Redescription:**
  A defender of the Action/Omission reduction would argue: *"In the Calibration Case, the killing actually happened at 12:00 when you pressed 'Start Calibration.' The subsequent 5 minutes were merely the unfolding of that earlier action. At the moment of death (12:05), you did nothing. Therefore, strictly speaking, the death at 12:05 is a letting die caused by the earlier action. If we isolate the moment of death, it is an omission."*

  **Evaluation:**
  This is a **refusal to engage**, not a real answer.
  It artificially slices the causal sequence to protect the theory. It stipulates that "killing" must be localized to a single muscular contraction, ignoring that agency extends over *sustained states* that the agent controls. If I lock you in a room (action) and don't let you out (omission), and you starve, describing the starvation as "letting die" because I didn't unlock the door at the moment of death ignores that I created the trap. The redescription saves the Action/Omission test only by rendering it insensitive to the *structure of control* that generates moral responsibility. It treats the agent as a series of snapshots rather than a continuous controller of the environment.

  ### 5. Fragility and Role Constraints

  **Where the case is fragile:**
  This case depends heavily on the agent's **professional role** and **exclusive access**.
  1.  **Exclusive Access:** If anyone else could have pressed "Resume," the agent's omission is less clearly the *cause* of death (others could have intervened). The console must be locked to the agent.
  2.  **Professional Duty:** If the agent were a bystander, failing to press "Resume" would not be killing; it would be a failure to rescue (letting die). The "Killing" verdict relies on the agent being the *guarantor* of the machine's function.

  **Is this cheating?**
  Given the purpose (testing the distinction between doing and allowing), relying on professional role is **not cheating**, provided the role is defined by *causal exclusivity* rather than mere normative duty.
  *   If the role is just "He promised to help," that's normative.
  *   If the role is "He holds the only key," that's causal.
  In the Calibration Case, the fragility lies in the intersection: The agent is the *only one permitted and able* to resume flow. If the "Killing" verdict vanishes when we remove the professional title (even if causal exclusivity remains), then the distinction is normative, not causal.
  *   *Honest Assessment:* If a random person sat in the chair and didn't press the button, we would likely call it "Letting Die" (failure to rescue). If the technician does it, we call it "Killing." This suggests the Killing/Letting Die distinction may not be purely causal/structural, but inherently normative (based on duty).
  *   *Implication for the Test:* This reveals that the Action/Omission distinction fails *even more* than expected. Not only does Omission sometimes equal Killing (Target Case), but whether it equals Killing often depends on *duty*, which neither Action/Omission nor pure Causal Structure captures. The case successfully breaks the Action/Omission reduction, but exposes that the Killing/Letting Die distinction may rest on normative expectations rather than metaphysical structure.
