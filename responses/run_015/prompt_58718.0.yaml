      *   *The Counter-Example:* Licensing exams (MCAT, Bar, etc.) often focus on the final answer.

  3.  **Brainstorming Key Concepts:**
      *   **Epistemology:** Justified True Belief (JTB). The grading policy demands *Justification*. A correct answer without work is a "Gettier case" (true belief without knowledge).
      *   **Pedagogy:** Formative vs. Summative assessment. Intro classes are for learning (formative), licensing is for gatekeeping (summative).
      *   **Utility/Transfer:** Ability to adapt to new problems (transfer learning) vs. rote application.
