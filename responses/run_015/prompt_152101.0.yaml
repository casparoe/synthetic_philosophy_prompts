  **INTERNAL MEMORANDUM**

  **TO:** All Personnel
  **FROM:** Dr Alistair Vance, Senior Partner
  **DATE:** 14 October 2023
  **SUBJECT:** Mandatory Implementation of Geometric Protocols v.4.2

  Effective immediately, Ergodic Partners LLP is transitioning all operational and interpersonal conduct to align with strict geometric growth principles. Recent audits indicate that whilst our financial portfolios adhere to Kelly-optimal sizing, our human capital allocation remains dangerously exposed to arithmetic averaging errors. We must recognise that life is a non-ergodic process; what holds for the ensemble does not hold for the single trajectory over time. To survive without hitting an absorbing state—be it termination, insolvency, or social ostracisation—all staff must adopt the following protocols.

  **1. Hiring and Talent Allocation**
  Binary hiring decisions are prohibited. All recruitment must utilise fractional Kelly positioning across a portfolio of candidates. If a candidate presents a 60% probability of successful integration with odds of 1:1, the optimal exposure is 20% of a full-time equivalent. We shall engage five such candidates simultaneously to diversify idiosyncratic risk. This ensures that the firm's capability compounds geometrically rather than suffering volatility drag from over-concentration in a single high-variance employee.

  **2. Workplace Attachments**
  Emotional investment is subject to diminishing marginal utility. Staff must model colleague relationships using a logarithmic utility function. Deep affinity should only be purchased when the edge is statistically significant. Before initiating personal bonds, calculate the probability of the colleague's departure. If the risk of separation exceeds your Kelly fraction, you are over-leveraged. Protect your emotional equity; ruin in the social domain is as terminal as ruin in the financial domain.

  **3. Meeting Strategy**
  Conversational stakes must adhere to risk-parity principles. Do not commit fully to an argument unless your informational edge warrants maximum geometric growth. In conditions of high uncertainty, minimise verbal exposure. Listening is the equivalent of holding cash; it preserves optionality whilst others incur volatility drag through premature commitment. Interrupting is treated as unauthorized leverage and will be penalised.

  **4. Annual Corporate Retreat**
  The retreat is not for leisure but for morale compounding. We do not seek to maximise the ensemble average of enjoyment (which invites ruin via excess) but the time-average growth rate of collective cohesion. Activities will be calibrated to ensure positive geometric drift in team stability. Any activity carrying a non-zero probability of interpersonal conflict is classified as an absorbing state and is strictly forbidden.

  Compliance will be monitored via quarterly utility audits. Deviations suggesting arithmetic reasoning will be corrected. We exist to grow, not to gamble.

  ***

  **Reflective Note**

  This satire takes liberties by treating subjective probabilities (e.g., candidate success, emotional rupture) as knowable inputs for the Kelly formula, whereas the criterion strictly requires precise edge estimation. It also conflates the ergodicity economics critique (Peters), which challenges ensemble averages in physical systems, with a normative ethical framework. The satire relies on the contested interpretation that avoiding "ruin" in social contexts is mathematically identical to financial solvency. I would regard this portrayal as unfair if proponents of geometric rationality explicitly disavow extending Kelly optimisation to interpersonal ethics, insisting it remains a strictly financial tool rather than a universal heuristic for life. The ambiguity lies precisely in whether growth optimisation can ever be separated from moral prescription when applied to human behaviour.
