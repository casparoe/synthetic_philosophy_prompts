  **DIVISION 44: CIVIC INTERFACE HARDWARE**  
  **CATALOGUE ISSUE 10.4 | EFFECTS WARRANTY VALID THROUGH 2028**  
  **SECTION: PUBLIC SPACE MODULATION & ACCESS CONTROL**

  **ITEM 44-102: TRI-POSITION SEGMENTED ARMREST ASSEMBLY**  
  **Model:** TB-AR-3P  
  **Application:** Designed for installation on standard transit waiting benches. The three-position armrest configuration divides seating surface into discrete zones. This geometry prevents recumbency while maintaining seated capacity for single occupants. The unit is warranted to produce a *Dispersal (Night-Use)* effect. By eliminating continuous flat surface area, the object removes the affordance for sleeping without requiring active enforcement by security personnel. The political decision regarding loitering is delegated to the steel profile, ensuring consistent application regardless of shift changes or attendant discretion.  
  **Specs:** Material: Galvanized Steel, 14-Gauge | Finish: Anti-Graffiti Epoxy, Matte Grey | Lead Time: 6 Weeks | **Social Output: Exclusion (Recumbent Bodies)** | Compatibility: Standard Bench Frame Series B.

  **ITEM 44-205: STANDARD GEOMETRY OVERPASS SPAN**  
  **Model:** PK-OS-126  
  **Application:** Pre-cast concrete overpass module for parkway integration. Vertical clearance is fixed at 3.8 meters. This dimension is sold as "Standard Geometry" but is warranted to produce a *Traffic Composition Control* effect. The clearance permits private passenger vehicles while physically excluding high-volume public transit buses. This distributes mobility access according to vehicle class without signage or legal prohibition. The structure performs the sorting function permanently. Procurement officers should note that altering the clearance post-installation requires structural demolition; the policy is cast in concrete.  
  **Specs:** Material: Pre-Stressed Concrete, 5000 PSI | Clearance: 3.8m (Hard Stop) | Lead Time: 14 Months | **Social Output: Exclusion (High-Capacity Transit)** | Maintenance: Structural Integrity Only.

  **ITEM 44-310: NORMATIVE CYCLE FARE GATE**  
  **Model:** AC-NG-04  
  **Application:** Automated entry turnstile for municipal facilities. The gate operates on a fixed 4.5-second cycle. If a user exceeds this duration, the gate locks and signals an alert. This timed cycle enforces a *Pace Compliance* norm. The machine settles the question of "reasonable speed" so that no attendant has to decide it. Delays are registered as mechanical faults rather than human variance, shifting blame from the user to the system, though the user bears the consequence of denied entry. The effect is *Deference to Authority (Automated)*.  
  **Specs:** Material: Stainless Steel Brushed | Cycle: 4.5s ±0.2 | Power: 24V DC | **Social Output: Behavioral Standardization** | Warranty: Void if manual override used >5 times/shift.

  **ITEM 44-400: RESOURCE DISTRIBUTION MODULES (OPTION A/B)**  
  **Model:** WR-CZ-100 (Central) / WR-DZ-50 (Distributed)  
  **Application:** Water reclamation and dispensing units. Clients must select one configuration; hybridization voids effects warranty.  
  **Option A (Centralized):** High-capacity plant serving a 5km radius. Requires continuous custody and defined exclusion zones.  
  **Option B (Distributed):** Kit of small cells serving 200m radius. Requires community consensus for placement.  
  **Specs:** Capacity: 10k Gal (A) / 500 Gal (B) | **Social Output: Hierarchy (A) / Autonomy (B)** | **Required Accessories:** (A) 24hr Security Personnel, Perimeter Fencing; (B) Neighborhood Council Vote, Conflict Resolution Fund. Note: Option B lead time is contingent on successful voting cycle.

  **ITEM 44-900: PARTICIPATORY OPEN PLAZA MODULE**  
  **Model:** PP-NULL-00  
  **Application:** Universal access surface certified by the Bureau of Ethical Interface. This module carries the highest rating for Participation, Neutrality, and Freedom from Surveillance. To achieve this certification, all edges, barriers, surveillance mounts, and texture variations have been removed. The surface has no defined function to avoid excluding non-standard uses. Load-bearing capacity is minimized to prevent injury liability. The result is a *Null Effect* zone. It cannot support seating, commerce, or transit, as these imply preference. It serves as a monument to the consultation procedure that produced it.  
  **Specs:** Material: Non-Slip (Certified), Non-Texture | Slope: 0.00% | **Social Output: None (Certified Neutral)** | Usability: Ceremonial Only | Lead Time: Indefinite (Pending Stakeholder Review).

  ***

  **HOW TO ORDER**  
  Submit Purchase Order via Municipal Procurement Portal. Specify Model Number and Desired Social Output. Note that Social Outputs are warranted only under **Standard Social Conditions** as defined in Appendix Z (Vol. 4). Deviations in local economic pressure, demographic density, or enforcement budgets may alter realized effects. The Manufacturer is not liable for political outcomes resulting from improper installation or unauthorized social modification.

  **FOOTNOTE:**  
  ¹ Effects Index ratings are derived from controlled testing environments. Actual field performance depends on the surrounding regulatory regime. Please note: An object cannot enforce a policy that the surrounding institution does not uphold; however, the institution may cite the object as the source of the policy. See Appendix Z, Section 3.2 ("Liability Deflection Protocols").
