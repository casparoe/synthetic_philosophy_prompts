      *Refining Case 1:* If the pig has *no* consciousness, it's basically a plant. Nozick might say it's morally neutral *for the pig*, but what does it do to *us*?
      *Refining Case 2:* The AI is essentially a utilitarian calculator. Nozick would hate that. Rights are trumps, not inputs.
      *Refining Case 3:* This is the strongest violation of Kantian principles. Using a living being as a factory.

