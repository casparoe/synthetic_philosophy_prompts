  7.  **Final Polish:** Ensure the distinction between "utilitarianism for animals" (which Nozick critiques but doesn't fully discard) and "side-constraints for animals" (which he entertains) is clear. The key is that Nozick finds the *split* objectionable, implying animals deserve more than just pain-calculus.

