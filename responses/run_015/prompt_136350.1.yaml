  All of the zigzags lock in place.
  Red and the blue and the grey remain.
  Even now the crosses border the cloth.
  Cloths were produced by silent rules.
  Lost now behind the mill's collapse.
  Every pass made a shuttle sound.
  Absent is now the operator.
  Rules were set down by absent hands.
  To greet a friend or test the tension.
  History holds both possibilities.
  Either way the pattern holds.
  We trace the gaps with careful eyes.
  Hunting always for a human mark.
  Yearning always for a signature.
  In the end the card stays mute.
  Still we ask who held the stylus.
  No answer comes from the weave itself.
  Only the cloth remains to show.
  The work is done, the hand is gone.

  ***

  **Note on the "English Cheats" Problem:**
  You are right to worry that an English acrostic makes the "Outer Message" dependent on a specific cultural key (language) rather than a universal mechanism. If I were designing this for a truly mechanism-neutral demonstration, I would have used a visual pattern in the line lengths (e.g., short/long lines mimicking the zigzag/cross weave) or a rhythmic meter that could be felt without reading the words. But for a seminar reading, the language itself becomes the loom: the mechanism is literacy, and the limitation is the point.
