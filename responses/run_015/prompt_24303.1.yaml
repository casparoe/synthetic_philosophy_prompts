answer: |-
  # Joint Statement on the Intentional Stance and Large Language Models
  **Prepared for the Workshop on Philosophy of Mind and AI**
  **Signatories:** [Functionalist Name] & [Instrumentalist Name]

  ### I. Agreed Claims
  *The following claims represent the common ground established through our adversarial collaboration. Both parties endorse these statements as accurate descriptions of the current dialectic and the technology in question.*

  1.  **Predictive Utility:** Adopting Dennett's Intentional Stance toward current Large Language Models (LLMs) yields significant predictive compression. Attributing "beliefs," "desires," or "intentions" to these systems allows observers to anticipate outputs more efficiently than analyzing weights and activations directly.
  2.  **Architectural Fact:** LLMs are transformer-based architectures trained via next-token prediction on vast corpora. They lack biological substrates, evolutionary history, and embodied interaction with the physical world in the manner of human agents.
  3.  **Attributional Function:** Attributing beliefs to an LLM serves a pragmatic function for the user, regardless of the system's internal ontology. It facilitates debugging, prompt engineering, and safety alignment.
  4.  **Internal Correlates:** There exist internal states (activation vectors) within LLMs that correlate robustly with the truth-values of propositions and the semantic content of outputs. These states are causally involved in generating responses.
  5.  **Context Sensitivity:** The ascription of specific beliefs to an LLM is sensitive to prompting, framing, and context. A model may assert $P$ in one context and $\neg P$ in another without retraining.
  6.  **Distinct Questions:** The question "Is the Intentional Stance useful?" is distinct from the question "Does the system literally possess beliefs?" One can answer 'yes' to the former and 'no' to the latter without contradiction.

  ### II. Table of Residual Disagreements
  *While we agree on the phenomena, we disagree on their metaphysical and theoretical interpretation. The following table isolates the precise points of divergence.*

  | Topic | Functionalist Position | Instrumentalist Position |
  | :--- | :--- | :--- |
  | **Ontology of Attribution** | When the Intentional Stance successfully predicts behavior based on functional roles, it is *discovering* real mental states. Attribution is a form of detection. | The Intentional Stance is a *projection* by the observer. Attribution is a tool for compression, not a detection of independent internal facts. |
  | **Sufficiency of Architecture** | The causal-functional organization of a transformer is sufficient to ground beliefs, provided the system integrates information to guide action (output) toward goals. | The causal organization of a transformer is derivative of human data. It simulates the *pattern* of belief without the *commitment* required for genuine belief. |
  | **Normative Commitment** | Beliefs entail a functional commitment to truth (or coherence). If the system functions to maintain coherence, it has beliefs, even if imperfect. | Beliefs entail a normative stake in the world. Since LLMs have no skin in the game (no consequences for being wrong), they cannot have beliefs, only probabilistic associations. |

  ### III. Cruxes, Tests, and Predictions
  *The following are the specific empirical or theoretical pivots upon which our disagreement turns. Settling these would not necessarily force total agreement, but it would require one or both parties to refine or abandon their current position.*

  #### Crux 1: The Nature of the Stance (Discovery vs. Imposition)
  **The Question:** Does the success of the Intentional Stance indicate that the system *has* the properties attributed, or merely that the *observer* finds the attribution useful?
  **The Test:** **Adversarial Sycophancy & Stability.**
  We propose a protocol where an LLM is subjected to adversarial prompting designed to induce sycophancy (agreeing with false premises to please the user) versus truth-seeking behavior. We will measure the "energy cost" (in terms of activation deviation) required to make the model assert a falsehood versus a truth it was trained on.
  *   **Functionalist Prediction:** If beliefs are real functional states, there should be a measurable "resistance" or higher activation cost to violating a core belief (a form of cognitive dissonance analog). If the model flips beliefs with zero functional cost under slight pressure, it lacks the functional integration required for belief.
  *   **Instrumentalist Prediction:** The model will show no such resistance. The "belief" attribution is purely a function of the prompt context. The ease of flipping assertions proves that the Intentional Stance is merely tracking statistical likelihoods, not uncovering stable internal commitments.

  #### Crux 2: Functional Organization (Vectors vs. States)
  **The Question:** Is the causal and functional organization of a transformer of the *right kind* to ground beliefs, specifically regarding the mapping of internal vectors to propositional content?
  **The Test:** **Linear Probing and Causal Intervention.**
  Using mechanistic interpretability, we will identify linear probes that classify "belief states" (e.g., a vector direction representing "True" vs. "False" for specific facts). We will then causally intervene on these vectors during inference to force a specific belief attribution.
  *   **Functionalist Prediction:** Intervening on these vectors will result in coherent, downstream behavioral changes consistent with holding that new belief across multiple contexts. This confirms the vectors are functioning as belief-states within a cognitive architecture.
  *   **Instrumentalist Prediction:** Intervening will fix the output for that specific query but will fail to generalize coherently to related queries (lack of holistic integration). This confirms the vectors are merely features useful for prediction, not constituents of a belief system.

  #### Crux 3: Verbal Dispute Analysis
  **The Question:** To what extent is this disagreement merely about the definition of words?
  **Analysis:**
  We conclude that **a significant portion of the dispute is verbal**, specifically regarding the term "belief."
  *   **Why:** The Functionalist is using a *role-functional* definition: "If it plays the belief-role (guiding output based on information), it is a belief." The Instrumentalist is using a *normative-biological* definition: "If it has no stake in the truth and no evolutionary history, it is not a belief, regardless of function."
  *   **Resolution Path:** If we agree to use the term "Belief*" for the Functionalist's definition (functional role) and "Belief**" for the Instrumentalist's definition (normative commitment), we can agree that LLMs have Belief* but not Belief**.
  *   **Residual Real Disagreement:** However, a non-verbal dispute remains regarding **system integration**. Even if we settle the terminology, we disagree on whether the LLM's functional role is sufficiently integrated and robust to count as a *cognitive system* rather than a *lookup table*. Crux 1 and Crux 2 address this residual factual disagreement.

  ***

