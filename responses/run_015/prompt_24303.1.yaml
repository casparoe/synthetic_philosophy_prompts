  2.  **Deconstruct the Positions:**
      *   **Functionalist:** Beliefs are defined by causal/functional role. If the system processes information and acts *as if* it has beliefs to achieve goals, and the internal structure supports that functional role, it *has* beliefs. LLMs likely meet this bar.
      *   **Instrumentalist (Dennettian):** The Intentional Stance is a strategy for prediction. Attributing beliefs is useful *for us*, but doesn't necessarily imply an ontological fact *about the system* independent of that stance. LLMs are tools for prediction, not believers.
      *   **Common Ground:** Both agree LLMs behave in ways that make intentional attribution useful. Both agree on the mechanics of transformers (mostly). Both agree "belief" is a tricky term.
      *   **The Clash:** Is the attribution *discovering* a real state (Functionalism) or *imposing* a useful fiction (Instrumentalism)?

