          *   Specific questions: Cases of drift without influence-seeking steps? Cases of influence-seeking not resembling drift?
          *   Ranking: Fatal to awkward defeaters.
          *   Concessions: What can a defender concede?
          *   Falsifiability: Is the view insulated/unfalsifiable? Is that a vice or feature?
