  4. History Teacher: When a student submits an essay, I need to know if the argument is genuinely theirs, not just whether they can explain where the words came from. If they can defend the argument's structure orally, the origin of the words matters less, but this is weakest because it conflates verbal fluency with genuine historical understanding.

  5. AP Computer Science Teacher: If the model weights update silently between sessions, isn't the company effectively rewriting your notebook while you sleep, violating the stability required for extended cognition? I argue that version locking creates stability, but this is weakest because it relies on corporate compliance rather than cognitive integration.
