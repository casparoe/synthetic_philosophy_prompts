prompt: |-
  I'm on our univ's Distinguished Service Award commitee. There's a nomination for a staffer who rescued a grad student from a chemical fire — clearly the right act — but leaked messages show she was mostly calculating media coverage and her promotion prospects, not thinking about the victim. Our charter mentions 'moral character,' not just outcomes, and the panel is split: some say saving a life is enough; others say awarding her collapses moral worth into mere behaviorism. I need a memo for Thursday recommending approve, reject, or approve with conditions, with reasoning that takes the strongest losing argument seriously rather than brushing it aside. I'm also playing with this idea that moral worth doesn't need pure altruism but needs your reasons to be 'structurally anchored' to the value — your practical reasoning tracks the good propperly, not just accidentally produces it. Can you draft the memo so it uses that framing but also shows exactly where it might break down?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Distinguished Service Award Committee.
      *   **Task:** Draft a memo recommending a decision (Approve, Reject, or Approve with Conditions) regarding a nomination.
      *   **Subject:** A staffer who saved a grad student from a chemical fire (good outcome) but leaked messages suggest her motives were self-serving (media coverage, promotion) rather than altruistic (bad motive/character).
      *   **Constraint 1 (Charter):** The award charter specifies "moral character," not just outcomes.
      *   **Constraint 2 (Committee Dynamics):** The panel is split. Some say outcome is enough; others say motive matters (collapsing moral worth into behaviorism).
      *   **Constraint 3 (Argumentative Style):** Must take the strongest losing argument seriously (steel-manning), not dismiss it.
      *   **Constraint 4 (Philosophical Framing):** Use the user's specific idea: Moral worth doesn't need pure altruism but requires reasons to be "structurally anchored" to the value (practical reasoning tracks the good properly, not accidentally).
      *   **Constraint 5 (Critical Reflection):** Show exactly where this framing might break down.
      *   **Deadline:** Thursday (implies urgency/formal tone).

  2.  **Determine the Recommendation:**
      *   *Option A (Approve):* Ignores the "moral character" clause too much. Risks cynicism.
      *   *Option B (Reject):* Punishes a life-saving act based on private thoughts. Could discourage future action. Seems too harsh for a service award.
      *   *Option C (Approve with Conditions):* Acknowledges the act but addresses the character concern. Allows for nuance.
      *   *Decision:* **Approve with Conditions** (or a nuanced "Approve" with a specific citation of the philosophical framing). Actually, given the "moral character" clause, a straight "Approve" is hard to defend if the motives were *purely* calculative. However, rejecting a life-saver is politically and ethically fraught. The "Structurally Anchored" framework offers a middle ground: Did her reasoning track the good *enough*? If she calculated "saving him gets me praise," she still had to *save him* to get the praise. The action was necessary for the goal.
      *   *Refined Decision:* I will recommend **Approval**, but with a specific caveat in the citation language that acknowledges the complexity, or perhaps **Approval with a Specific Citation Focus**. Let's go with **Recommendation: Approve**, but grounded in the "structural anchoring" argument, while acknowledging the risk. Wait, the prompt asks to show where the framing breaks down. If I recommend approval, I need to show why the "Reject" argument is strong but ultimately less convincing *under this framework*, while admitting the framework's limits.
      *   *Alternative:* **Recommendation: Approve with Conditions/Context.** This feels safer given the charter. Let's aim for **Approve**, but explicitly address the character clause through the philosophical lens. Actually, the prompt asks to "recommend approve, reject, or approve with conditions." I need to pick one.
      *   *Strategic Choice:* **Approve.** Why? Because the "structural anchoring" argument suggests that even if the *ultimate* end was self-promotion, the *proximate* reasoning required valuing the student's life as a necessary condition. To get the credit, the student must live. Therefore, her reasoning was anchored to the value of the life, even if instrumentally. However, I must show where this breaks down (i.e., if she would have let him die if no cameras were present).
      *   *Wait, a better nuance:* **Approve with Conditions.** The condition being how the award is framed/cited. This respects the "moral character" clause without denying the award. Let's go with **Recommendation: Approve with Specific Citation Language.** This effectively functions as "Approve with Conditions."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly.
      *   **Context:** Briefly state the facts (Fire, Rescue, Leaked Messages).
      *   **The Charter Constraint:** Acknowledge "Moral Character."
      *   **The Philosophical Framework (The Core):** Introduce the "Structurally Anchored" concept.
          *   Explain it: Moral worth isn't about pure selflessness (Kantian duty) but about whether the agent's reasoning *tracks* the good.
          *   Apply it: She needed the student alive for the glory. Therefore, her plan *required* the good outcome. It wasn't accidental (like kicking a bucket that puts out a fire). It was deliberate.
      *   **Steel-manning the Opposition (The "Reject" Argument):**
          *   Argument: If the cameras weren't there, would she have acted? If no, then the anchoring is fragile. It collapses morality into reputation management.
          *   Acknowledge validity: This is the "breaking point" of the framework.
      *   **Resolution/Recommendation:**
          *   We approve because the *action* required structural engagement with the value of life, even if the *motivation* was mixed.
          *   Condition: The citation should focus on the *act of service* and *impact*, avoiding explicit claims of "selflessness" which might be factually contestable.
      *   **Risk Analysis (Where the framing breaks):**
          *   If we normalize instrumental morality, do we erode trust?
          *   What if the leakage was taken out of context? (Epistemic uncertainty).

  4.  **Refining the Tone:**
      *   Needs to be academic, administrative, yet philosophically rigorous.
      *   Avoid being too abstract; keep it tied to the committee's decision.
      *   Ensure the "structural anchoring" concept is explained clearly for non-philosophers on the committee.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I take the losing argument seriously? *Yes, the section on "The Risk of Instrumentalization" needs to be robust.*
      *   *Check:* Did I use the specific framing? *Yes, "structurally anchored" and "practical reasoning tracks the good."*
      *   *Check:* Did I show where it breaks down? *Yes, in the "Limitations" section.*
      *   *Check:* Is the recommendation clear? *Yes, Approve with specific citation constraints.*

  6.  **Final Polish:**
      *   Make sure the distinction between "outcome" and "character" is bridged by the "structural anchoring" idea.
      *   Ensure the "Thursday" deadline is met (date the memo accordingly).
      *   Keep it concise enough for a committee read but deep enough to satisfy the prompt's intellectual requirements.

  *(Self-Correction on the Recommendation)*: If I recommend "Approve," the "Reject" side feels ignored. If I recommend "Reject," the "Approve" side feels ignored. "Approve with Conditions" allows me to validate the act (Approve) while respecting the character concern (Condition on how we describe it). This is the most diplomatic and philosophically honest path.

  Let's refine the "Structurally Anchored" argument. The core idea is that for her plan to succeed (promotion), the student *had* to live. Therefore, her practical reasoning *had* to include "preserve student life" as a sub-goal. This anchors her agency to the value of life, even if life wasn't the *terminal* value. The counter-argument is that this makes morality too contingent on external rewards. I need to make sure this tension is the heart of the memo.

  7.  **Finalizing the Memo Structure:**
