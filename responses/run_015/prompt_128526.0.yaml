answer: |-
  Your friend's strong relativist reading fails because Montaigne does not use the essay to suspend moral judgment, but to invert the hierarchy of barbarism based on a universal standard of cruelty that condemns European violence as objectively worse than Tupinamba ritual.

  Here is the menu of claims hidden within the slogan "we call barbarism whatever isn't our own practice," analyzed for textual fidelity, defensibility, and whether it supports your friend's conclusion that cross-cultural criticism is off-limits.

  **1. Trivial Psychological Bias**
  *   **The Claim:** Humans have an instinctive cognitive bias to label unfamiliar customs as inferior or scary.
  *   **In the Text:** Yes. This is the literal opening gesture of the essay; Montaigne observes that people usually call "barbarous" what they aren't accustomed to.
  *   **Defensible:** Yes. This is a sound observation of human psychology and ethnocentrism.
  *   **Supports Friend's Conclusion:** No. Acknowledging a bias exists does not mean the bias is correct, nor does it mean we cannot overcome it to make valid judgments. It warns against knee-jerk reactions, not reasoned critique.

  **2. Descriptive Cultural Relativism**
  *   **The Claim:** Different societies operate under different normative systems and customs.
  *   **In the Text:** Yes. Montaigne spends significant space detailing Tupinamba social structures, war practices, and lack of hierarchy to show they differ from France.
  *   **Defensible:** Yes. This is empirically true and the basis of anthropology.
  *   **Supports Friend's Conclusion:** No. Describing difference is not the same as prescribing moral immunity. One can acknowledge different customs while still evaluating them against a standard of human welfare.

  **3. Epistemic Humility**
  *   **The Claim:** We should hesitate before judging other cultures because our own perspective is limited and potentially corrupted.
  *   **In the Text:** Yes. Montaigne constantly questions whether Europeans are truly "civilized" given their own behavior.
  *   **Defensible:** Yes. This is a robust philosophical stance against arrogance.
  *   **Supports Friend's Conclusion:** Weakly. Humility suggests we should be careful and self-reflective before criticizing, but it does not establish a total prohibition on criticism. It demands better grounds for judgment, not the absence of judgment.

  **4. Strong Normative Relativism**
  *   **The Claim:** There is no universal moral standard; all practices are equally valid within their own context, and external criticism is always illegitimate.
  *   **In the Text:** No. Montaigne explicitly ranks actions, arguing that some forms of violence are worse than others regardless of culture.
  *   **Defensible:** Philosophically contentious. It leads to paralysis where one cannot condemn atrocities outside one's own border.
  *   **Supports Friend's Conclusion:** Yes. This is exactly your friend's position, but it is not Montaigne's position. She is attributing a modern anthropological stance to a Renaissance humanist who believed in a universal "reason."

  **5. Strategic Mirror Critique**
  *   **The Claim:** The "savage" is used as a rhetorical device to expose the hypocrisy of the "civilized," implying a shared standard that the home culture is failing.
  *   **In the Text:** Yes. This is the core engine of the essay. The Tupinamba are not idealized for being different, but for being closer to "natural reason" than the corrupted Europeans.
  *   **Defensible:** Yes. This is a valid form of immanent critique.
  *   **Supports Friend's Conclusion:** No. This reading allows for cross-cultural criticism of *both* sides. It implies we can criticize the Tupinamba (for eating humans) but must criticize Europeans more (for torturing humans).

  **The Wars of Religion Comparison**
  Your friend's omission of Montaigne's comparison to European violence is fatal to her reading because it introduces a universal metric of suffering. Montaigne argues that eating a dead body (Tupinamba) is less barbaric than torturing a living body (Europeans during the Wars of Religion). For this comparison to hold logical weight, there must be a trans-cultural standard of cruelty that applies to both groups. If strong relativism were true, Montaigne could only say the practices are *different*, not that one is *worse*. By ranking European torture as superior in barbarism to Tupinamba cannibalism, he confirms that moral judgment is not off-limits; rather, it must be applied consistently. He is not saying "cannibalism is good because they do it," he is saying "cannibalism is less bad than what we do," which presupposes we are all subject to the same moral law.
