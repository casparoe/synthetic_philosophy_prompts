answer: |-
  You are asking for a mirror, not a manual. You want to know what your panel has actually been doing, and how to apply that history to a case that breaks your pattern. You have five precedents that feel consistent because they all resulted in protecting the victim, but they relied on three different justifications that you have never needed to separate until now.

  Here is the breakdown of your panel's history, the conflict in the Fen case, and the specific reasoning you need for next week.

  ### 1. What have you actually been doing for nine years?

  You have not been enforcing the rules as written. If you were, Case 2 (Valley Fight) would be your only model, and Case 3 (Grave Garden) and Case 5 (Painted Hall) would have been denied. In both 3 and 5, the aggressor followed the mechanical rules (claiming land, winning a siege). You overruled the mechanics.

  You have also not been purely protecting "property," because in Case 3 and 5, the items had no economic value.

  **What you have actually been doing is acting as a "Customs Authority."** You decide which player behaviors count as legitimate culture and which count as vandalism.
  *   **Building a Keep (Case 1):** Legitimate culture.
  *   **PvP in a Loot Zone (Case 2):** Legitimate culture (consented).
  *   **Maintaining a Grave Garden (Case 3):** Legitimate culture (despite no mechanics).
  *   **Hoarding while Asleep (Case 4):** Legitimate expectation (security norm).
  *   **Collecting Paintings (Case 5):** Legitimate culture (protected from war).

  You have consistently ruled that **player intent and social ritual create value that the code must respect,** *unless* the player explicitly consented to the risk (Case 2). You prioritize the "Spirit of the Server" over the "Letter of the Code."

  ### 2. The Three Rules (Sharpened for Disagreement)

  You identified three principles that fit your past five cases. Here they are stated sharply enough that they will vote differently on Fen.

  **Rule A: The Principle of Subjective Harm (Experience)**
  *   **Definition:** If a player's genuine experience of the world is destroyed by another's action, and the victim did not explicitly consent to that risk, it is a harm we remedy.
  *   **Logic:** Focuses on the victim's feelings and continuity of experience.
  *   **Vote on Fen:** **RESTORE.** Ossuary's experience is wrecked. He did not consent to Fen dying (he was away). The harm is real to him.

  **Rule B: The Principle of Invested Labor (Expectation)**
  *   **Definition:** If a player invests sustained time or ritual into a state of the world, they gain a "property right" to that state, even if the code doesn't recognize ownership.
  *   **Logic:** Focuses on the work put in. (Matches Case 1 Keep, Case 3 Garden, Case 5 Paintings).
  *   **Vote on Fen:** **RESTORE, BUT NO IMMUNITY.** Ossuary invested three years of ritual. That labor deserves restitution. However, an NPC is not "his" property to immunize. Granting immunity would allow players to lock world objects via labor, which breaks the game's dynamism.

  **Rule C: The Principle of Community Standing (Practice)**
  *   **Definition:** We only protect things that the community practices have made matter. Private hobbies do not override public mechanics.
  *   **Logic:** Focuses on the server's health. (Matches Case 3 "standing in the life of the server").
  *   **Vote on Fen:** **DENY.** Fifteen players and a forum thread of jokes do not constitute "community standing." This is a private delusion, not a server institution. Protecting it sets a precedent that any player can hold world mechanics hostage for personal roleplay.

  ### 3. What to Decide (Consistency vs. Prediction)

  **What you will likely decide:**
  You will **Restore Fen, deny Immunity, and issue no Sanction.**
  *   *Why:* It is the path of least resistance. Restoring an NPC costs the developers five minutes. Denying immunity preserves the plague mechanic for the other 40,000 players. Not sanctioning Grieve acknowledges he broke no written rule. It makes everyone mostly happy without changing the code.

  **What you should decide (for Consistency):**
  You should **Restore Fen and deny Immunity, but write a specific reason.**
  *   **Closest Analog:** **Case 3 (The Grave Garden).**
      *   *Similarities:* Both involve non-mechanical value (stones/NPC) in a public space (claimable land/town square). Both involve one player destroying another's ritual project.
      *   *Difference:* The Garden was on player-claimable land; Fen is a world NPC.
      *   *Principle:* In Case 3, you ruled that social value outweighs mechanical claim rights. You must apply that here. If you deny Fen, you contradict Case 3. You admitted the Garden "had standing." You must now decide if Ossuary's ritual has standing.
  *   **The Commitment:** By restoring Fen, you commit to the idea that **persistent player ritual creates a shield against mechanical erasure.** You are telling players: "If you build a culture here, we will protect it from being farmed."
  *   **The Limit:** By denying immunity, you commit to the idea that **this protection is retrospective, not prospective.** You will fix the harm, but you will not change the rules to prevent it happening again. This preserves the "risk" element of your sandbox (Case 2).
  *   **Sanction:** Do **not** sanction Grieve. In Case 2, you ruled that following the mechanics is legal, even if the outcome is harsh. Grieve used a feature as intended. Sanctioning him would mean you are punishing players for using game systems to hurt others' feelings, which is a slippery slope in a sandbox.

  ### 4. How to Write the Ruling

  To remain consistent with your nine-year history, your reasoning should lean on **Rule B (Invested Labor)** but acknowledge **Rule C (Community)**.

  *   **Do not say:** "Ossuary was sad." (Too subjective).
  *   **Do not say:** "Grieve was mean." (Irrelevant to rules).
  *   **Do say:** "The player Ossuary established a persistent, known social practice over three years. While the plague mechanic is valid, using it specifically to target an established server practice undermines the social stability we protected in the Grave Garden ruling (2019). We restore the NPC to honor the labor invested. We deny immunity because world mechanics must remain dynamic. We issue no sanction because the mechanic was used as designed."

  ### 5. Settling Facts (What would change the vote?)

  You asked what future facts would settle the disagreement between your three principles. Here is how they shift the vote:

  *   **If 200 players mourned her:**
      *   *Shift:* Rule C (Community) switches to **RESTORE**.
      *   *Result:* Unanimous Restore. It becomes a "Server Institution" like Halberd Keep.
  *   **If Ossuary spent real money on the rings:**
      *   *Shift:* Rule A (Experience) becomes a Consumer Protection issue.
      *   *Result:* Restore + Potential Refund. Developers would likely intervene directly, bypassing you.
  *   **If Ossuary had never told a soul (Secret Ritual):**
      *   *Shift:* Rule C (Community) switches to **DENY**. Rule B (Labor) weakens (no public expectation).
      *   *Result:* Likely Deny. You cannot protect secrets in a public world without creating traps for other players. Case 3 worked because the garden was visible and known.
  *   **If Grieve did it for loot (Plague drops):**
      *   *Shift:* Rule A (Experience) weakens (collateral damage vs. targeted malice).
      *   *Result:* Still Restore, but less moral outrage. It becomes a standard "collateral damage" ruling like Case 2.
  *   **If the new Memory NPCs are already in place:**
      *   *Shift:* This changes the nature of the harm. If Fen "remembers" being abandoned, the harm is persistent and mechanical.
      *   *Result:* **Stronger case for Immunity.** If the game now tracks relationships, Ossuary's labor is mechanically recognized. Destroying a "max friendship" NPC is closer to destroying a max-level character (Case 4).

  ### Summary for Next Week

  1.  **Acknowledge the Split:** Admit internally that Rule C (Community Standing) is the weak point here. 15 people is not a community. But Rule B (Labor) is your strongest precedent (Case 3).
  2.  **The Verdict:** Restore Fen. Deny Immunity. No Sanction.
  3.  **The Reason:** "Established social practice warrants restitution, but does not grant ownership of world mechanics."
  4.  **The Future:** Warn players that the upcoming "Memory" patch changes the landscape. Future cases involving Memory NPCs will be treated as character assets (Case 4), not world scenery.

  You have been running a **Common Law Court** for a digital nation. You rely on precedent, not code. Stick to the Grave Garden precedent. It is the only one that keeps your nine years of logic intact.
