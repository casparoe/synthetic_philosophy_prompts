answer: |-
  **PREP SHEET: COLLOQUIUM Q&A STRATEGY**
  **Topic:** Commitment-without-Occupancy (CwO) vs. Logical Omniscience
  **Stakes:** Contract Renewal (Do not waffle. Do not apologize.)

  ### I. THE OPENING FIVE MINUTES (Inoculation)
  *Goal: Pre-empt the "hand-waving" charge and signal respect to all three factions.*

  1.  **Define Terms Rigorously:** Do not use "belief" as a catch-all. Explicitly state: "I am proposing a functional distinction between *Occupied* states (premise-available for inference/action) and *Committed* states (truth-conditional consequences)." Write this on the board.
  2.  **Acknowledge the Logician:** Early on, concede that on a *model-theoretic* definition, your view isn't a logic. Frame CwO as a *normative epistemology of logic*, not a rival formal system. This disarms the visiting logician's primary weapon before they draw it.
  3.  **Acknowledge the Bayesians:** State clearly that CwO is compatible with probabilistic coherence as an ideal, but treats coherence as a *target of the Audit Rule*, not a static constraint on the agent's state.
  4.  **The Hook:** Frame the problem not as "How do we model minds?" but "How do we justify criticism?" If you solve the justification of criticism, the modeling follows. This appeals to the mainstream epistemologists (the majority).

  ---

  ### II. THE EIGHT OBJECTIONS (Ordered by Damage Potential)

  #### 1. The Normative Gap (Mainstream Epistemologists)
  **The Question:** "You say I'm committed to consequences I haven't grasped. But epistemology is about *my* reasons. If I can't access the commitment, how can it be a norm for *me*? You're making me responsible for facts outside my cognitive reach. That sounds like blame without agency."
  **The 2-Minute Answer:** "Distinguish *blame* from *correctness*. A chess player isn't 'blamed' for missing a mate-in-three, but the move is still objectively losing. Commitment marks the objective landscape of reasons; Occupancy marks your current position on it. The Audit Rule only triggers when the commitment becomes salient—i.e., accessible. Until then, you aren't violating a norm; you're just in a state that is vulnerable to correction. The norm isn't 'Know everything,' it's 'Don't resist correction when it's presented.'"
  **Soft Spot:** If they press on *why* the latent commitment constrains you *now* if it has no psychological reality. Don't say "metaphysics." Say "public accountability."

  #### 2. The "Not Logic" Charge (The Visiting Logician)
  **The Question:** "If your consequence relation doesn't close under conjunction or implication, it isn't a consequence relation. You've just described a psychological limitation and called it a logic. You haven't solved Logical Omniscience; you've dissolved logic."
  **The 2-Minute Answer:** "I agree that if logic is defined as a closure operator on mental states, this isn't logic. But I'm arguing that logic is a norm on *discursive commitment*, not a description of *cognitive storage*. The closure exists in the space of commitments (the 'debt'), even if it doesn't exist in the space of occupancy (the 'wallet'). I'm preserving the strictness of logic by relocating it from the mind to the conversation."
  **Soft Spot:** They may insist that epistemology requires the logic to be in the mind. Concede that *ideal* epistemology does, but *human* epistemology requires your distinction.

  #### 3. The Dutch Book Threat (The Formal Bayesians)
  **The Question:** "If I occupy $P$ and $P \to Q$, but don't occupy $Q$, I can be Dutch Booked. I'll buy a bet on $P$, buy a bet on $P \to Q$, and refuse to pay on $Q$. You've licensed incoherence. How is this rational?"
  **The 2-Minute Answer:** "You've licensed *temporary* incoherence, not *stable* incoherence. The Dutch Book argument shows why the Audit Rule is necessary. If a bookie makes the connection salient (offers the bet on $Q$), the Audit Rule forces me to avow $Q$ or retract $P$. My view predicts *when* the Dutch Book succeeds: only when the latent commitment is made salient. It explains the diachronic stability of rationality without requiring synchronic omniscience."
  **Soft Spot:** If they argue that rational agents shouldn't *enter* the bet in the first place. Reply: "Bounded agents must act before auditing is complete."

  #### 4. The Salience Manipulation (Mainstream Epistemologists)
  **The Question:** "You say the Audit Rule triggers when a commitment is made salient. But salience is manipulable. An interlocutor can force me to avow things by drawing attention to them selectively. Doesn't this make rationality dependent on the agenda of whoever is questioning me?"
  **The 2-Minute Answer:** "It makes *explicit* rationality dependent on dialogue, yes. But that's a feature, not a bug. Rationality is a social practice of giving and asking for reasons. If you can't defend a commitment when asked, you shouldn't have occupied the premises. The manipulation worry is real, but the remedy is the right to *retract* premises, not to ignore consequences."
  **Soft Spot:** The power dynamic. If the questioner is malicious, the Audit Rule forces you into a corner. Admit this is a risk of discursive rationality.

  #### 5. The Regress of Audit (Mainstream/Logician)
  **The Question:** "When a commitment is made salient, I must audit it. But auditing is an inference. Do I need to occupy the rules of inference to audit? And do I need to audit *that* occupancy? You've pushed the omniscience problem back one step."
  **The 2-Minute Answer:** "No regress. Occupying the rules of inference is part of what it means to be a reasoning agent—it's constitutive, not a separate belief. We don't need to audit our capacity to audit; we just need to exercise it. The Omniscience problem is about *propositional* consequences, not *procedural* competence."
  **Soft Spot:** If they argue procedural competence *is* propositional knowledge (intellectualism). Pivot to "know-how."

  #### 6. The Gradation Problem (Mainstream Epistemologists)
  **The Question:** "Belief comes in degrees. Your Occupancy/Commitment split sounds binary. If I'm 90% sure of $P$, and $P$ entails $Q$, am I 90% committed to $Q$? Or is commitment all-or-nothing? If it's graded, how does the Audit Rule work?"
  **The 2-Minute Answer:** "Commitment inherits the degree of the Occupied premise. If I occupy $P$ with 0.9 credence, I am committed to $Q$ with at least 0.9 credence. The Audit Rule applies to the *credence assignment*. When salient, I must adjust my credence in $Q$ to match the constraint, or lower my credence in $P$. The binary element is only in *availability*, not in *strength*."
  **Soft Spot:** Compounding uncertainty. If $P \to Q$ is also uncertain. Keep it simple: "Constraints propagate."

  #### 7. The Triviality Charge (The Logician/Mainstream)
  **The Question:** "Isn't this just 'Bounded Rationality' with new vocabulary? Cherniak and others said we can't compute all consequences. You've added 'Commitment' but changed nothing about the predictions."
  **The 2-Minute Answer:** "Bounded Rationality treats logic as a cost-benefit analysis (I *can't* compute it). CwO treats logic as a normative debt (I *owe* it). The prediction changes: Bounded Rationality says I'm excused for ignoring $Q$. CwO says I'm vulnerable to correction on $Q$. It explains why we feel *guilty* or *corrected* when contradictions are pointed out, rather than just 'computationally overloaded'."
  **Soft Spot:** If they say "Guilt is just psychological." Insist on the normative phenomenology.

  #### 8. The Memory/Storage Objection (Formal Bayesians)
  **The Question:** "What determines Occupancy? Is it working memory? Long-term memory? If I forgot $P$ but still 'occupy' it in long-term storage, am I committed? Your distinction collapses into a memory model."
  **The 2-Minute Answer:** "Occupancy is functional, not anatomical. It's about what is currently available to guide action or inference without retrieval cost. If you have to 'look it up' (even internally), it's not Occupied, it's Committed. The line is fuzzy, but so is 'heap'. Fuzziness doesn't invalidate the distinction."
  **Soft Spot:** The fuzzy boundary. Don't try to draw a hard line. Admit it's a spectrum.

  ---

  ### III. THE KILL SHOT (The Single Reply)
  *If the room turns hostile and you need one sentence to ground the whole project:*

  **"Logic is not a description of what is in the head; it is the rulebook for what can be demanded of the head. I am not modeling the mind; I am modeling the demand."**

  *Use this if they conflate the psychological impossibility of omniscience with the normative necessity of consistency.*

  ---

  ### IV. THE PRAYER QUESTION (Do Not Get This)
  **The Question:** "If I occupy $P$, and $P$ entails $Q$, but $Q$ is false (and I can verify $Q$ is false without seeing the link to $P$), your Audit Rule says I must give up $P$. But what if $P$ is a foundational perceptual belief and $Q$ is a complex theoretical claim? Your rule forces me to abandon the evidence for the theory. Doesn't this prioritize logical consistency over empirical justification?"

  **Why it's deadly:** It pits your normative rule against standard epistemic foundationalism. If you say "Logic wins," you look like a rationalist fanatic. If you say "Evidence wins," you undermine the universality of the Audit Rule.
  **Preparation:** Have a ready distinction between *defeasible* occupancy and *logical* commitment. "Perceptual beliefs are Occupied *defeasibly*. The Audit Rule forces a choice, but it doesn't dictate *which* horn to drop, only that one must go. Usually, you drop the Occupied belief that has the least independent support."

  ---

  ### V. STRATEGIC NOTES FOR THE ROOM
  *   **The Logician:** Do not fight them on definitions of "Logic." Yield the term to them. "You're right, strictly speaking, this is epistemology *using* logic, not a new logic." This makes them look pedantic if they keep pressing.
  *   **The Bayesians:** They want to see the math. Don't try to derive equations on the board. Tell them: "The formal model is in the paper. Here I'm defending the philosophical interpretation of the variables."
  *   **The Mainstream:** They are the vote. Keep eye contact with them. Use examples of *conversation* and *disagreement*. They care about how we treat each other as reasoners.
  *   **Body Language:** When asked a tough question, pause. Take a sip of water. Look at the questioner, then scan the room. Answer slowly. Speed signals panic; slowness signals control.
  *   **The "I Don't Know":** If you get stumped, do not bluff. Say: "That's a pressure point I'm currently working through. My initial thought is X, but I need to check if that holds in case Y." This shows you are a serious researcher, not a salesman.

  **Good luck. You own the room because you've defined the terms. Don't let them redefine them back.**
