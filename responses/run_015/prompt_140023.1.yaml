      *   *Refining:* Needs to be tighter. Let's frame it around the *status* of the negation. Is it a logical operator or a soteriological tool? The prompt asks to put the fork to the students.
      *   *Final Polish:* Ensure Sanskrit terms are defined in the prompt as requested. Make sure the word count limit is clear.

