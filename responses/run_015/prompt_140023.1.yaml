answer: |-
  ### Exam Question

  **Question 1 (1,200 words maximum)**

  A critic of Nāgārjuna argues that the *catuṣkoṭi* (the four-cornered negation: *x* is *F*, *x* is not *F*, *x* is both, *x* is neither) is logically defective. They claim that if the first two corners are genuine contradictories, the third and fourth are logically impossible, and rejecting all four is simply inconsistent. Furthermore, they argue that if this negation applies to everything, it entails global skepticism; if it does not, Nāgārjuna owes an account of why some things escape it.

  Write an essay defending Nāgārjuna against this critic. You must address three specific points:
  1.  **The Logical Charge:** Explain why the *catuṣkoṭi* is not merely redundant or contradictory. Does Nāgārjuna deny the law of non-contradiction, or is the scope of the negation restricted?
  2.  **The Mundane Test:** Apply the four corners to a mundane proposition (e.g., "The bus has left"). Do all four corners get rejected here? If yes, how is this not global skepticism? If no, what principled distinction marks the difference between this case and the cases where Nāgārjuna applies the negation?
  3.  **The Regress Worry:** If Nāgārjuna asserts that "all views are empty," is this not itself a view? Explain how the concept of the emptiness of emptiness (that emptiness itself lacks *svabhāva*, or intrinsic nature/independent essence) resolves this without changing the subject.

  *Note: In your answer, define any Sanskrit terms you use, such as **svabhāva** (intrinsic nature/own-being), **saṃvṛti-satya** (concealing/conventional truth), and **paramārtha-satya** (ultimate truth).*

  ***

  ### Model Answer

  Nāgārjuna's *Mūlamadhyamakakārikā* is often misread as a attack on logic itself. However, a close reading suggests the *catuṣkoṭi* (four-cornered negation) is not a rejection of logical operators, but a *reductio ad absurdum* targeting a specific presupposition: the existence of *svabhāva* (intrinsic nature or independent essence). The critic's charge of redundancy holds only if one assumes the terms in the tetralemma refer to entities possessing *svabhāva*. Nāgārjuna's project is to demonstrate that no such entities exist. Therefore, the negation is not contradictory; it is the logical consequence of denying the ontological ground required for the contradictions to arise.

  Regarding the logical charge, the critic assumes bivalence (that every proposition is either true or false) applies universally. In classical logic, "x is F" and "x is not F" are contradictories; they cannot both be false. However, bivalence presupposes that 'x' refers to a determinate subject with fixed boundaries. If 'x' lacks *svabhāva*, it lacks the ontological stability required to sustain a truth value in the ultimate sense. Nāgārjuna does not deny the law of non-contradiction within the realm of language; he denies that language hooks onto ultimate realities. The third and fourth corners (both/neither) are not redundant additions but exhaustive options for those trying to locate *svabhāva*. By rejecting all four, Nāgārjuna shows that the search for intrinsic nature is category-error, not a logical puzzle with a solution. He is not asserting "not (P or not-P)" as a new truth; he is dissolving the presupposition that makes P meaningful ultimately.

  This leads to the mundane test. If we apply the tetralemma to "The bus has left," we must distinguish between *saṃvṛti-satya* (conventional truth) and *paramārtha-satya* (ultimate truth). In the conventional realm, the bus functions effectively. It has a schedule, a location, and passengers. Here, the law of excluded middle holds: the bus has either left or it has not. To reject all four corners here would indeed be global skepticism, rendering action impossible. Nāgārjuna explicitly preserves conventional reality (*vyavahāra*). The principled distinction is pragmatic and ontological: the tetralemma applies only when one reifies a phenomenon, treating a dependently originated thing as if it possessed *svabhāva*. The bus, understood as a dependently arisen aggregate of parts and concepts, is empty. But the proposition "the bus has left," understood conventionally, is valid. The negation applies not to the bus's conventional function, but to the claim that the bus exists *independently* of its causes, parts, and designation. Thus, Nāgārjuna avoids skepticism by limiting the scope of ultimate analysis to the error of reification, not the utility of convention.

  Finally, the regress worry asks: if Nāgārjuna asserts "all views are empty," is this not a view? If he says "I have no thesis," is that not a thesis? This is addressed in the *Vigrahavyāvartanī* through the doctrine of the emptiness of emptiness. If emptiness were a *svabhāva*—a true description of reality—it would itself be a substantial view, liable to the same negation. Nāgārjuna avoids this by treating emptiness as a therapeutic tool, like a purgative drug that expels itself along with the disease. The statement "I have no thesis" is not a metaphysical claim about the world; it is a performative negation of the impulse to grasp. It functions within *saṃvṛti* to point toward *paramārtha*, without claiming to capture *paramārtha* as an object.

  Therefore, the critic's charge fails because it treats Nāgārjuna's negations as propositional claims about existing things. They are not. They are demonstrations that the concept of *svabhāva* generates contradictions when applied consistently. The mundane world remains intact because it never claimed *svabhāva* to begin with; only the philosopher's reification does. By ensuring emptiness is itself empty, Nāgārjuna prevents his own philosophy from becoming the new dogma. The *catuṣkoṭi* is not a breakdown of logic, but the logical limit of essentialism.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Target of Negation (4 points)**
  *   **Full Marks:** Identifies that the *catuṣkoṭi* targets *svabhāva* (intrinsic nature), not conventional existence or logical operators per se.
  *   **Common Error:** Student claims Nāgārjuna rejects the Law of Non-Contradiction universally or claims reality is "illogical."

  **2. Logical Redundancy Rebuttal (4 points)**
  *   **Full Marks:** Explains that corners 3 & 4 are relevant only if one assumes *svabhāva* is possible; rejecting all four shows the concept is incoherent, not that logic is broken.
  *   **Common Error:** Student argues that Nāgārjuna proposes a "four-valued logic" or that reality is "beyond logic" without explaining the presupposition failure.

  **3. The Mundane Test & Scope (4 points)**
  *   **Full Marks:** Correctly states the tetralemma does *not* negate conventional propositions (the bus left/didn't leave) and distinguishes this via the Two Truths doctrine.
  *   **Common Error:** Student applies the negation to the bus (global skepticism) OR fails to explain *why* the bus is exempt (mere assertion).

  **4. Avoiding Skepticism (4 points)**
  *   **Full Marks:** Articulates the principled distinction: Convention is valid for practice; Ultimate analysis invalidates reification. Emptiness permits convention.
  *   **Common Error:** Student treats the Two Truths as two separate worlds (dualism) rather than two perspectives on one reality.

  **5. The Regress/Thesis Worry (4 points)**
  *   **Full Marks:** Uses "emptiness of emptiness" or the "no thesis" move to show the statement is therapeutic/instrumental, not a metaphysical assertion.
  *   **Common Error:** Student claims "I have no thesis" is a trick or a lie, or ignores the self-referential problem entirely.

  ***

  ### Grading Criteria: Distinguishing Performance

  **A Grade (17-20 points):**
  An A answer treats the *catuṣkoṭi* as a *reductio* on essentialism rather than a mystical mystery. The student explicitly connects the logical redundancy charge to the presupposition of *svabhāva*. In the mundane test, they clearly articulate that the bus *does* have a truth value conventionally, and that denying this is a misreading of *saṃvṛti*. On the regress, they explain *how* emptiness empties itself (instrumentalism) rather than just stating it. The argument is tight, textual, and avoids vague appeals to "ineffability."

  **B Grade (13-16 points):**
  A B answer gets the Two Truths distinction correct and identifies *svabhāva* as the target. However, it may wobble on the logic charge, perhaps suggesting Nāgārjuna "transcends" logic without explaining the mechanism of the negation. The mundane test might be handled correctly but without a robust defense against skepticism (e.g., "it just works"). The regress worry is answered with "emptiness of emptiness" but lacks the nuance of the therapeutic/instrumental function. It is accurate but lacks philosophical bite.

  **C Grade (9-12 points):**
  A C answer relies on clichés ("emptiness is not nothingness," "it is a mystery," "the Middle Way"). It often conflates the two truths, suggesting the bus is both real and unreal simultaneously (contradiction) rather than conventionally real and ultimately empty. It may claim Nāgārjuna denies all reality (nihilism) or fails to address the regress worry. Appeals to "meditative experience" to solve the logical contradiction without philosophical justification will be penalized here; this is a philosophy seminar, not a theology class.

  **Note on "Mystery" Appeals:**
  Students often attempt to resolve the logical tension by claiming the ultimate truth is "ineffable" or "accessible only through meditation." While textually supportable in some traditions, in this context, this counts as changing the subject. If a student argues that logic fails because reality is a mystery, they lose marks on Point 1 and Point 2. They must explain the *logical* reason why the predicates fail (lack of referent/*svabhāva*), not simply assert that the referent is beyond speech.
