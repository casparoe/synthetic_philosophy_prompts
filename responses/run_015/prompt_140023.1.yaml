          3.  Address the regress/performative contradiction worry (If "no thesis," isn't that a thesis? *Vigrahavyāvartanī* move allowed but not required; must engage "emptiness of emptiness").
          4.  Format: One question, ~90 mins/1,200 words. No secondary lit dependence (no Prāsaṅgika/Svātantrika). Define Sanskrit terms.
          5.  Deliverables: Question, Model Answer (800-1,000 words), Marking Scheme (20 pts, 5 must-hit points), Grading Criteria (A vs. B vs. C), specifically addressing the "mystery/meditation" cop-out.
          6.  Constraint: Model answer cannot just say "emptiness isn't nothingness."

  2.  **Drafting the Question:**

