          3.  The Mundane Test: Apply to "the cat." In convention (*saṃvṛti*), excluded middle holds. In ultimate (*paramārtha*), it fails because the cat lacks intrinsic nature. This avoids global skepticism.
          4.  The Regress/Thesis: Address "I have no thesis." Emptiness of emptiness. The negation is therapeutic, not propositional.
          5.  Conclusion: Summarize how this resolves the friend's worry without abandoning logic entirely.
      *   *Tone:* Academic, precise, philosophical.
      *   *Content:* Need to ensure I don't just say "it's meditation." I need to explain *why* the logic fails (presupposition of *svabhāva*).

  4.  **Creating the Marking Scheme:**

