answer: |-
  ### The Solidarity-Velocity Decision Procedure (SVDP)

  **Philosophical Grounding:** This procedure operationalizes David Miller's *Strangers in Our Midst* and Elizabeth Anderson's *Democratic Equality*. It treats social trust and fiscal reciprocity as finite infrastructure. If integration moves faster than the welfare state's capacity to absorb costs without visible strain, the political coalition supporting redistribution collapses. The goal is not to stop immigration, but to prevent the *legitimacy crisis* that stops all immigration.

  **Time Budget:** 30 Minutes.
  **Data Required:** Current budget utilization rates, service waitlists, recent community sentiment surveys (or council meeting minutes), and the proposal's fiscal timeline.

  #### Step 1: The Fiscal Reciprocity Floor (Hard Constraint)
  *   **Question:** Does the proposal's net fiscal impact over 3 years remain neutral or positive *without* reducing per-capita spending on existing vulnerable residents (native or newcomer)?
  *   **Pass:** External funding covers 100% of new costs, OR new tax revenue from newcomers exceeds service costs within 24 months.
  *   **Fail:** Requires cutting existing line items or dipping into emergency reserves.
  *   **Outcome:** **Hard No.** (If you break the budget, you break the trust required to fund *any* integration.)
  *   **Time:** 5 mins.

  #### Step 2: Service Velocity Check (Capacity Constraint)
  *   **Question:** Are the specific public goods required (school seats, clinic slots, affordable housing units) currently operating at >90% capacity?
  *   **Pass:** Capacity is <90% OR the proposal includes funded expansion that comes *online before* arrival.
  *   **Fail:** Capacity is >90% and expansion is unfunded or delayed.
  *   **Outcome:** **Yes-with-Conditions.** (Condition: Arrival is paused until capacity expansion is verified. Do not rely on "stretching" existing services.)
  *   **Time:** 10 mins.

  #### Step 3: The Solidarity Calibration (Trust Constraint)
  *   **Question:** Is there evidence of active community resentment tied specifically to *resource competition* (e.g., "they are taking our housing/schools") rather than general prejudice?
  *   **Pass:** Opposition is abstract/ideological, or support is neutral/positive.
  *   **Fail:** Organized opposition cites specific strained resources (schools, waiting rooms, waitlists).
  *   **Outcome:** **Hand to Human.** (This is a values conflict. Data cannot weigh "felt displacement" against "actual fiscal gain." This requires political leadership to decide whether to educate the public or pause the program.)
  *   **Time:** 10 mins.

  #### Step 4: The Integration Pathway (Moral Hazard Check)
  *   **Question:** Does the proposal create a permanent tier of residents who contribute fiscally but remain socially/linguistically segregated?
  *   **Pass:** Includes mandatory language/civic access with a timeline to full labor mobility.
  *   **Fail:** Relies on permanent segregation (e.g., dormitories) or removes integration requirements to lower short-term costs.
  *   **Outcome:** **Hard No.** (This violates the "reciprocity" clause of solidarity. It creates a guestworker underclass that erodes long-term social trust.)
  *   **Time:** 5 mins.

  ***

  ### Case Applications

  #### Case 1: 50 Families, Strained Schools, Strong Volunteers
  *   **Step 1 (Fiscal):** School budget is strained. Volunteers offer labor, not cash. Net fiscal impact is negative on the municipal ledger. **Fail.** *Correction:* If volunteers are formalized as grant-funded positions, it passes. Assuming they are informal: **Fail.**
  *   **Step 2 (Velocity):** Schools >90% capacity. **Fail.**
  *   **Step 3 (Solidarity):** Strong volunteer network suggests high social trust, but strained budgets suggest latent friction.
  *   **Step 4 (Integration):** Standard placement. **Pass.**
  *   **Procedure Output:** **Yes-with-Conditions.**
  *   **Conditions:** You cannot place the families until the volunteer network is formalized into a funded "Community School Liaison" role to offset the budget strain. You cannot rely on goodwill; it must be budgeted labor.
  *   **Why:** Relying on unpaid labor privatizes the welfare state. It works until the volunteers burn out, at which point the public blames the city.

  #### Case 2: Factory Dormitory, No Language, Guaranteed Jobs/Tax
  *   **Step 1 (Fiscal):** Guaranteed jobs mean immediate tax revenue. Housing is private. **Pass.**
  *   **Step 2 (Velocity):** Housing is built. Jobs exist. **Pass.**
  *   **Step 3 (Solidarity):** Likely low initial resentment due to economic gain. **Pass.**
  *   **Step 4 (Integration):** Skips language classes. Creates segregated housing. **Fail.**
  *   **Procedure Output:** **Hard No.**
  *   **Why:** This is the answer you will hate. On a spreadsheet, this is a win: taxes up, housing solved. But philosophically, this creates a permanent underclass. It treats newcomers as capital inputs, not citizens. It violates the *reciprocity* requirement of solidarity. If they never learn the language, they cannot participate in the democratic process that sustains the welfare state. This creates a "guestworker" ghettos that historically trigger nationalist backlashes within 5-10 years.
  *   **The Hate Factor:** You are blocking immediate housing and employment for refugees to protect a theoretical long-term social contract. It feels bureaucratic and cruel in the short term.

  #### Case 3: Tax Compliance Pilot, Angry Residents ("Replacement")
  *   **Step 1 (Fiscal):** Improved tax compliance. **Pass.**
  *   **Step 2 (Velocity):** No new service load. **Pass.**
  *   **Step 3 (Solidarity):** Residents feel "replaced." Opposition is explicitly tied to demographic change, not just resources. **Fail/Hand-off.**
  *   **Step 4 (Integration):** Pilot improves compliance (good). **Pass.**
  *   **Procedure Output:** **Hand to Human.**
  *   **Why:** The procedure detects a legitimacy crisis. The fiscal data says "Yes," the social data says "No." An algorithm cannot decide whether to prioritize fiscal health over the *feeling* of political ownership among long-term residents. If you ignore the anger, you risk a populist backlash that defunds your whole office. If you capitulate, you reward nativism. This is a political judgment, not an administrative one.

  ***

  ### Where This Procedure Misfires for a 200k City

  1.  **The Data Lag:** In a mid-sized city, budget utilization data is often 6 months old. Step 2 (Velocity) assumes real-time knowledge of school seats or clinic slots. In reality, you'll be guessing, which makes the "Hard No" feel arbitrary to frontline staff.
  2.  **The Informal Economy:** Small cities run on informal networks (landlords renting basements, churches feeding families). Step 1 (Fiscal) ignores this. By demanding formal fiscal neutrality, you might kill organic integration that costs the city nothing but looks "off the books."
  3.  **The "Hate" Paradox:** Case 2 shows the procedure's coldness. It prioritizes the *system's* longevity over the *individual's* immediate suffering. In a crisis (e.g., war refugees), a Hard No on dormitory housing because it lacks language classes is morally agonizing. The procedure protects the city's future at the expense of the newcomer's present.

  Verdict: Step 3 (The Solidarity Calibration regarding felt displacement vs. fiscal reality).
