answer: |-
  The list is not jointly satisfiable; the requirement to fix the grain of the base in advance conflicts irreconcilably with the requirement to absorb inherited and imported elements without ad-hoc redescription, so the grain constraint must be relaxed to allow contextual specification to avoid tautology.

  ### Desiderata for Base-Superstructure Causal Claims

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Causal Mechanism Differentiation** | Distinguishes whether the base *creates* a form, *selects* it from existing variants, or *shapes* its content while leaving the form intact. Without this, correlation is mistaken for genesis. | Non-negotiable (Logical necessity for causal clarity) |
  | **2. Base Granularity Protocol** | Fixes the level of abstraction for the base (e.g., "capitalism" vs. "rentier capitalism") prior to analysis. Prevents unfalsifiable redescriptions of the base to match any superstructural outcome. | Non-negotiable (Falsifiability constraint) |
  | **3. Temporal/Diffusal Accounting** | Handles elements inherited from prior modes or diffused from other societies. Must distinguish inert residue from re-functionalized archaisms (e.g., feudal honor in modern officers). | Non-negotiable (Historical reality) |
  | **4. Constitutive Boundary Definition** | Determines whether legal forms (property, contract) are part of the base or superstructure. If base includes law, "base determines law" is tautological; if not, base lacks economic definition. | Non-negotiable (Conceptual coherence) |
  | **5. Bidirectional Causality Allowance** | Permits "wrong-way" causation where state capacity or religious doctrine shapes accumulation. Excluding this a priori ignores historical feedback loops. | Negotiable (Depends on deterministic vs. probabilistic view) |
  | **6. Internal/External Distinction** | Separates a practice's internal content (science truth), its resource uptake (prestige), and its directional use (weaponization). | Preference (Specific to science/tech focus camps) |
  | **7. Last Instance Operationalization** | Defines what counts as evidence against the claim that the base is determinant "in the last instance." Without falsification conditions, the claim is metaphysical. | Non-negotiable (Testability constraint) |

  ### Incompatibility Analysis
  Your suspicion is correct: **Base Granularity Protocol** and **Temporal/Diffusal Accounting** cannot be jointly satisfied under strict conditions. To explain why a specific inherited form (e.g., archaic property law) was selected rather than another, one must cite specific features of the current economic structure (e.g., "weak industrial bourgeoisie," "strong rentier sector"). However, citing these specific features violates the **Base Granularity Protocol** if the grain was fixed in advance at a higher level of abstraction (e.g., "industrial capitalism"). If you allow the grain to be specified *after* observing the legal form to explain the selection, you commit the post-hoc redescription fallacy the Protocol forbids. If you keep the grain fixed, you cannot explain the specific selection of inherited forms without resorting to non-economic variables, thereby weakening the causal claim. To resolve this, the Granularity Protocol must be downgraded to a Negotiable status, allowing the base description to be refined iteratively provided the refinement rules are pre-registered.

  ### Exclusionary Power
  The **Constitutive Boundary Definition** excludes the most candidates. Most contemporary social theories recognize that "economic relations" (wages, property, trade) are constituted by legal rules. If the base is defined to exclude law, it becomes an abstract phantom without empirical purchase; if it includes law, the theory collapses into "law determines law." Straight reductionism fails here by ignoring the legal constitution of property; functionalism fails by assuming the legal form follows economic need without constitutive overlap; relative autonomy theories often fail by leaving the boundary vague enough to evade the problem rather than solve it.

  ### Scorecard of Familiar Positions

  *   **Straight Reductionism:** Fails **Causal Mechanism Differentiation** and **Bidirectional Causality**; treats all superstructural elements as direct originations of the base, ignoring selection and feedback.
  *   **Functional Explanation:** Fails **Base Granularity Protocol** and **Last Instance Operationalization**; explains the existence of institutions by their utility to the base, risking tautology and lacking falsification conditions.
  *   **Relative Autonomy:** Fails **Last Instance Operationalization**; preserves the complexity of social life by making the base's ultimate priority vacuous or unreachable by evidence.
  *   **No Economic Essence:** Fails **Constitutive Boundary Definition** by dissolution; denies the existence of a distinct economic base, making the theory incapable of testing the specific causal claim in question.
