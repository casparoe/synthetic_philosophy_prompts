answer: |-
  A village of philosophers decides to share a single concept: "Fairness." They treat it like a common pasture. They whisper when they invoke it, afraid that if too many people demand fairness at once, the supply will get trampled and die. They stand in line to take small, careful bites of Justice, worried about overgrazing the moral landscape.

  An economist visits the town hall and laughs. "You're treating Fairness like a common-pool resource!" she says. "But ideas are pure public goods! They're non-rivalrous. My using 'Fairness' doesn't leave less for you. You can't deplete it by standing on it."

  The villagers are relieved. "So," asks the Mayor, "we can all demand maximum Fairness whenever we want?"

  "Exactly," says the economist. "It's non-rivalrous."

  "Great," says the Mayor. "Then I demand my neighbor be perfectly fair to me."

  "And I demand it from him!" says the neighbor.

  "And I demand it from both of them!" shouts the baker.

  Everyone spends the day demanding Fairness, consuming the concept endlessly without diminishing the stock. But when the economist asks, "Okay, but who is actually going to *act* fairly? Who is paying the cost to produce the good?"

  The room goes silent.

  The Mayor shrugs. "Why should I produce it? Since the benefit is non-excludible, I get the advantage of everyone else's fairness whether I contribute or not."

  The economist sighs, closing her notebook. "Congratulations. You were worried about the Tragedy of the Commons, but you've accidentally optimized for the Free-Rider Problem. You realized the grass doesn't die when you walk on it, so now nobody has an incentive to plant any."
