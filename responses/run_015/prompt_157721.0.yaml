answer: |-
  Your coworker's fashion analogy accurately describes the social mechanism of norm diffusion but fails by reducing material suffering and coercive enforcement to aesthetic preference, ultimately obscuring how rational arguments provide the necessary infrastructure that makes status shifts possible rather than arbitrary.

  Here is the mapping of her analogy:
  *   **The Fashion Designer:** Moral entrepreneurs and elite innovators (e.g., Quakers, Enlightenment philosophers, Wilberforce) who prototype new ethical standards.
  *   **The Runway:** The public sphere, including Parliament, the press, and high-society salons where new norms are displayed and validated.
  *   **The Season Change:** Historical tipping points or crises (e.g., the Industrial Revolution, the Haitian Revolution) that render old norms obsolete.
  *   **The Social Cost:** Stigma, ostracization, and loss of honor associated with being seen as "backward" or "barbaric."
  *   **The Critic:** Reformers and journalists who explicitly label the old practice immoral, functioning as trendsetters who declare specific outfits "out."

  The mapping breaks down in three critical areas. First, it treats slavery and dueling as purely aesthetic choices, ignoring that dueling was a mechanism of honor enforcement while slavery was a system of capital accumulation; ending slavery required civil war and legislation, not just elite embarrassment. Second, it conflates status loss with interest loss; when your coworker claims slavery became "economically embarrassing," she muddies the distinction between losing money (interest) and losing face (honor), whereas historically, slavery remained profitable long after it became morally suspect. Third, the analogy suggests the content of the moral argument is irrelevant, like a hemline height, but rational arguments provide the *language* of the new trend; without the philosophical framework of human rights, there is no coherent "new fashion" to adopt, only vague signaling.

  Regarding your Williams point, your coworker's conclusion that rational arguments never drive moral change is too strong once you separate status shifts from reasoning. While Williams is correct that reason alone rarely moves people without a shift in sentiment or social context, rational arguments construct the honor code itself; they define *why* the new outfit is superior. Reason does not pull the lever of change, but it builds the lever, meaning moral revolutions are not merely arbitrary trend cycles but shifts grounded in intelligible claims about justice that allow status to be recalibrated.
