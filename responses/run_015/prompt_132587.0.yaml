answer: |-
  This is a exceptionally sharp observation. You have identified a fissure in how liberal legal systems conceptualize autonomy across time. The tension you're describing sits right at the intersection of legal philosophy, political theory, and metaphysics.

  To answer your core question: **Yes, the pairing is philosophically inconsistent if pressed on metaphysics, but it is pragmatically stable because it relies on different criteria for "capacity" rather than "identity."** The identity talk is largely post-hoc rationalization for risk-management strategies.

  Here is a breakdown of the philosophical presuppositions, the consistency check, and the institutional implications of swapping the models.

  ### 1. The Metaphysics of the Self in Each Domain

  **Psychiatric Advance Directives (PADs): Narrative Identity & Hierarchical Will**
  You asked if PADs require a psychological-continuity theory (i.e., the manic self is literally a different person). Strictly speaking, **no.** If the law required strict psychological discontinuity, it would be impossible to treat the patient at all (you can't treat a stranger without consent).

  Instead, PADs rely on a **Dworkinian distinction between critical and experiential interests**, or a **Frankfurtian hierarchy of wills**.
  *   **The Theory:** The "self" is not the momentary bundle of desires (the manic refusal), but the enduring narrative arc of values (the advance directive).
  *   **The Mechanism:** It treats the future refusal not as *another person*, but as a *corrupted version of the same person*. The metaphysics here is **normative**, not ontological. It asserts that autonomy is the ability to govern one's life according to deep values, not the ability to act on every immediate impulse.
  *   **Why it works:** It assumes pathology creates a specific kind of epistemic blindness. The "sick" self literally cannot access the values of the "well" self.

  **Constitutional Precommitment: Corporate Fiction & Trusteeship**
  Constitutional law does not rely on psychological continuity because "The People" is a legal fiction, not a biological organism.
  *   **The Theory:** This relies on a **corporate identity theory**. The polity is an institution that persists despite the total turnover of its members (like a ship of Theseus, or a corporation).
  *   **The Mechanism:** It treats the future majority not as "sick," but as **agents with limited authority**. In constitutional theory (specifically the precommitment theory championed by scholars like Stephen Holmes and Jon Elster), the current generation are *trustees* of the constitutional order, not absolute owners.
  *   **Why it works:** It assumes that passion and short-term interest can distort collective judgment (the "tyranny of the majority"), but it does not pathologize the majority. It merely procedurally cools them down.

  ### 2. The Consistency Check: Why the Double Standard?

  You ask: *If we think a future refusal can be inauthentic in the clinic, shouldn't we be able to say a future generation's urge to repeal the constitution is also inauthentic?*

  **The Inconsistency:**
  If we applied the Psychiatric Model to the Constitution, we would need a mechanism to declare a democratic movement "clinically insane" or "inauthentic" to void its outcomes. This exists in history (e.g., Carl Schmitt's distinction between the "will of the people" and the "opinion of the masses," or emergency powers that suspend democracy to "save" it), but it is anathema to liberal democracy. Liberal democracy presupposes that **there is no epistemic authority higher than the collective will** to determine what the collective will *should* be.

  If we applied the Constitutional Model to Psychiatry, we would have to honor the manic refusal but make it procedurally difficult to act on (e.g., "You can refuse meds, but only if 2/3 of your family agrees"). This happens sometimes (substituted judgment), but it fails because the *mechanism* of decision-making in mania is chemically compromised, whereas the mechanism of voting is procedurally sound.

  **The Resolution:**
  The difference lies in the **locus of error**.
  *   **In Psych:** The error is internal/biological. The *hardware* of decision-making is malfunctioning. Therefore, the output (refusal) is invalid.
  *   **In Politics:** The error is external/temporal. The *hardware* (voting) works, but the *software* (passion/short-termism) is risky. Therefore, the output is valid but constrained by previous rules.

  ### 3. Institutional Swaps: What if we changed the view?

  **Scenario A: Pure Present Autonomy in Psychiatry**
  *   **The View:** Every refusal is authoritative. No "authentic self" trumps the "present self."
  *   **Institutional Change:** Ulysses contracts become unenforceable. If a patient says "no" during a manic episode, they must be released or left untreated.
  *   **Outcome:** This leads to the "revolving door" phenomenon. Individuals cycle through competence and incapacity, destroying their long-term life narrative (jobs, relationships, health) because their "well self" has no legal tool to protect itself from their "sick self." Autonomy becomes fragmented and self-defeating.

  **Scenario B: The Psychiatric Model in Constitutional Law**
  *   **The View:** Some democratic movements are "inauthentic" expressions of the People (e.g., "populist hysteria").
  *   **Institutional Change:** You empower a guardian body (Court, Council, Monarch) to determine not just *procedure*, but *authenticity*. They can void an amendment not because it was passed incorrectly, but because "The People weren't themselves."
  *   **Outcome:** This is the definition of **paternalistic authoritarianism**. It requires an arbiter of "true" popular will. Historically, this leads to regimes where elites veto democratic outcomes they dislike by claiming the populace is "deluded." It destroys the legitimacy of the democratic fiction.

  ### 4. The Underdetermination Hypothesis

  You asked: *Could both practices be explained by tractability or risk-management concerns rather than by any theory of the self?*

  **Yes. This is the strongest explanation.**

  This aligns with Jon Elster's analysis in *Ulysses and the Sirens*. Precommitment strategies are rarely about metaphysics; they are about **strategic constraint against predictable irrationality.**

  *   **Psychiatric Law:** The "identity" talk is a legal fiction designed to solve a **liability and harm-reduction problem**. It is easier to justify coercing a patient if you say "we are helping the *real* you" than "we are overriding your rights for safety." The metaphysics is a moral lubricant.
  *   **Constitutional Law:** The "continuity of the People" is a fiction designed to solve a **coordination and stability problem**. If every generation could rewrite the rules instantly, long-term investment and rights protection would collapse. The metaphysics is a stability mechanism.

  **Why the Identity Talk Persists:**
  We use identity language because "risk management" sounds cold and coercive.
  *   Telling a patient "We are managing the risk of your suicide" feels like an assault. Telling them "We are honoring your true self" feels like care.
  *   Telling a citizen "We don't trust you to vote correctly" feels like elitism. Telling them "You are bound by the enduring will of the People" feels like civic duty.

  ### Conclusion

  The parallel you found hides a disagreement about **epistemic access**, not just identity.

  1.  **Psychiatry** assumes the past self has *better epistemic access* to the patient's values than the present sick self. Therefore, the past self wins.
  2.  **Constitutionalism** assumes the past founders had *better structural position* (cooler heads, no immediate stake) than the present majority. Therefore, the past rules win, but the present agent remains valid.

  If you strip away the metaphysics, both systems are admitting the same thing: **Autonomy is not just about doing what you want now; it's about having the tools to bind yourself to what you value over time.**

  The inconsistency arises only if you demand a unified theory of "Personhood." If you view them as distinct technologies for distinct problems (biological regulation vs. political coordination), the divergence makes sense. The "self" in psychiatry is a biological/narrative unit; the "self" in constitutional law is a corporate/legal unit. Confusing the two is where the philosophical trouble starts.
