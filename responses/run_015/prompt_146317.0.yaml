answer: |-
  Hi everyone. Thanks for coming out on a Tuesday. I know the title says "Beyond the QWERTY Story," and I promise I'm not going to spend the next hour rehashing the typewriter keyboard debate. We all know the drill: some inefficient standard gets adopted early, switching costs get too high, and we're stuck. It's the classic path dependence story. It's clean, it's tidy, and honestly, it's a bit too neat for the room we're in today.

  Looking around, I see we've got a split crowd. Half of you think about history in terms of contingency and necessity, and the other half of you spend your days keeping legacy banking systems from collapsing under their own weight. You might think you don't have much in common, but I'd argue you're both staring at the same structural problem. You're just seeing it at different scales.

  So, I want to propose a framing for the next couple of days. I want to treat institutional history—whether that's the evolution of democracy or the COBOL code running a wire transfer—not as a story of efficiency, but as a non-ergodic Markov process with absorbing barriers.

  I know, that's a mouthful. But stick with me.

  For the engineers here, you know this intuition. You've got a system state. You make a transition. Sometimes you hit a state where you can't leave. An absorbing barrier. Maybe it's a regulatory standard written in 1974, maybe it's a database schema that nobody understands but everyone relies on. Once you're in that state, the probability of leaving drops to zero.

  For the philosophers, the key word here is *non-ergodic*. In an ergodic system, the time average equals the ensemble average. If I roll a die enough times, the average outcome looks like the average of a thousand people rolling once. History *would* be ergodic if we could replay the tape of human civilization a thousand times and average the results. If we did that, and democracy showed up in 90% of the runs, we could say it was inevitable.

  But we can't replay the tape. We have one trajectory. One time average. And if the system has absorbing barriers—like, say, the invention of nuclear weapons or the establishment of a global Swift network—then the path we're on diverges permanently from the paths we didn't take. The ensemble average becomes meaningless because those other worlds don't exist to be averaged.

  This creates a bit of a paradox for what we're here to discuss.

  If history is non-ergodic, then asking questions like "Would democracy have arrived anyway?" or "Was the 2008 financial crisis inevitable?" is actually a malformed question. It assumes there's a stable probability distribution over possible histories. But if early random fluctuations get magnified by absorbing barriers, there is no stable distribution. There's just the one walk we happened to take.

  Now, I don't want to turn this into a math lecture, and I definately don't want to suggest that we're powerless. That's the trap.

  If I tell the engineers in the room that their legacy systems are "historically contingent," you might think that means they're easy to change. Just refactor the code, right? But if the system is non-ergodic, those absorbing barriers are real. The cost of exit isn't just high; it's structurally prohibitive. The history is baked into the architecture.

  But if I tell the philosophers that nothing is inevitable, you might think we can just wish for a different institution. But we can't ignore the absorbing barriers. We are where we are because of specific transitions that closed off other doors.

  So here's the constraint I want us to work under this week. We shouldn't claim our current banking regs—or any institution—are inevitable. That's teleology, and it's lazy. But we also shouldn't pretend they're easily changeable. That's voluntarism, and it's dangerous.

  We're stuck in the middle. The path was contingent once, but it's rigid now. Not because it's the best path, but because the process broke ergodicity. The random noise of the past got amplified into the structure of the present.

  This workshop isn't about finding the exit. It's about mapping the barriers. It's about understanding why the system looks locked in without conceding that it was destined to be this way.

  The engineers can tell us where the barriers are physically. The philosophers can tell us what those barriers mean for agency and responsibility. And hopefully, together, we can figure out if "locked in" is a permanent state or just a very long transient phase.

  I'll stop there. We've got coffee, we've got time, and I suspect plenty of disagreement. Let's get into it.
