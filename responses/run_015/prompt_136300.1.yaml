      *   *The Real Mechanism of Collapse in Gödel:* It stems from the interaction between **Essence** and **Necessary Existence**.
      *   If $G$ is an essence of God (which it is), and $NE$ is positive (Axiom 4), then God exists necessarily.
      *   *Where does collapse come from?* It comes if *every* true property is entailed by the God-like essence. If the set of "Positive Properties" is closed under entailment (Axiom 1) and includes *all* true properties (or entails them), then everything true is positive. If everything true is positive, and God has all positive properties, and God exists necessarily... we might get collapse.
