      *   **Theorem:** $\Box \exists x G(x)$. (God exists necessarily).

  3.  **Address the Modal Collapse Objection:**
      *   *What is Modal Collapse?* It's the derivation of $\phi \to \Box \phi$ for *any* proposition $\phi$. If God exists necessarily, and God wills/knows/creates everything, does everything become necessary?
      *   *Plantinga's Version:* Often criticized because "Maximal Greatness" includes "Necessary Existence." If it's *possible* that a Maximally Great Being exists, then it exists in *all* worlds. But does this force *contingent* facts (like "I am wearing a blue shirt") to be necessary? Usually, Plantinga defenders say no, because God's existence doesn't dictate every specific contingent fact.
      *   *Gödel's Version:* The worry is stronger here because of the structure of *positive properties*. If $P(\phi) \to \Box P(\phi)$, and God has all positive properties, does the set of positive properties become so large or rigid that it forces all truths to be necessary?

