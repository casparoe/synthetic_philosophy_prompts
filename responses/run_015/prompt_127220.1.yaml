  ## Part III: The Scoring Key

  **Branch 1: The Unity Check (Questions 1, 3, 5)**
  *   **Mostly A:** You lean toward **Phenomenal Unity**. You believe there is a "feel" to pleasure.
      *   *Proceed to Branch 2A.*
  *   **Mostly B:** You lean toward **Disunity or Non-Phenomenal Unity**. You believe pleasure is attitudinal, functional, or fragmented.
      *   *Proceed to Branch 2B.*

  **Branch 2A: The Location Check (Questions 2, 4, 11)**
  *   **Mostly A:** **Hedonic Tone Realism.** You believe pleasure is a sensory ingredient.
      *   *Leaf:* Hedonic Tone Realism.
  *   **Mostly B:** **Adverbialism / Simple Property.** You believe pleasure is a way of feeling or a non-natural quality.
      *   *Leaf:* Adverbialism or Simple Non-Natural Property.

  **Branch 2B: The Location Check (Questions 6, 8, 10)**
  *   **Mostly A:** **Attitudinal / Experiential.** You require consciousness or memory for pleasure to count.
      *   *Leaf:* Attitudinal Hedonism.
  *   **Mostly B:** **Functional / Desire.** You believe pleasure is about state-regulation or desire satisfaction, even without feeling.
      *   *Leaf:* Functionalism or Desire Satisfactionism.

  **Branch 3: The Consequence Check (Questions 7, 9, 12)**
  *   **Mostly A:** **Hedonist Preservation.** You try to save the idea that pleasure is the sole good, even if you have to shrink the definition.
      *   *Leaf:* Perfectionism or Deflated Subjectivism.
  *   **Mostly B:** **Hedonist Abandonment.** You accept that pleasure is not the only good, or that the concept is broken.
      *   *Leaf:* Value Pluralism or Error Theory.

  ### Indistinguishable Leaves
  *   **Attitudinal Hedonism vs. Desire Satisfactionism:** The questionnaire cannot reliably separate these. Both allow for non-sensory pleasure and prioritize the subject's stance over the sensory object. *Diagnosis:* Remediable only with a question about unconscious desire satisfaction (e.g., "Is a betrayed spouse happy if they never find out?").
  *   **Adverbialism vs. Simple Non-Natural Property:** Both posit pleasure as irreducible. *Diagnosis:* Genuinely indistinguishable across cases; this is a metaphysical split, not a phenomenological one.

