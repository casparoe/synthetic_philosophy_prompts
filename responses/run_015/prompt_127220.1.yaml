  ## Part IV: Character Placement

  **Marta: Hedonic Tone Realism**
  *   *Path:* 1A (Common glow), 2A (Sensory change needed), 4A (Pain is pain), 5A (Mixable ingredients).
  *   *Analysis:* Marta is a sensualist. She trusts the varnish, the smell, the cold plum. She occupies a standard, well-populated cell. She believes pleasure is something you *have*, like a coin.
  *   *Risk:* None. This is a stable, common-sense position.

  **Kilian: Error Theory (with Functionalist leanings)**
  *   *Path:* 1B (Different kinds), 3A (Shine is pleasure), 6A (No trace, no good), 9B (Value without feeling), 12B (Phantom satisfaction).
  *   *Analysis:* Kilian occupies a sparse cell. He separates the "shine" (phenomenology) from the "good" (function/value). Because the shine is gone (Stroke), he claims the pleasure is gone, yet he continues to function. He is drifting toward **Error Theory regarding Phenomenology** but **Functionalism regarding Behavior**.
  *   *Risk:* **High.** This combination (Phenomenal Nihilism + Functional Continuity) is theoretically unstable. If pleasure doesn't exist (Error), why does the function persist? You may need to rewrite him to fully embrace **Separatism**: The "shine" is one thing, the "value" is another, and they have divorced. He is not an Error Theorist; he is a **Dualist**.

  **Eduarda: Attitudinal Hedonism**
  *   *Path:* 1B (Different kinds), 2B (External object okay), 6B (Experience counts), 8A (Feel required), 9A (Pain is bad).
  *   *Analysis:* Eduarda believes pleasure is about *welcoming* the world (Attitude), which allows for the Borrowed Afternoon, but she retains enough Hedonism to believe pain is bad (Martyr). She occupies the **Attitudinal Hedonist** cell.
  *   *Risk:* None. This fits her role as the administrator. She looks for the "welcome" in her students.

