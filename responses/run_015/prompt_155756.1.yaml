answer: |-
  There is no single, canonical term that captures the entire configuration you describe. However, your observation sits precisely at the intersection of three established literatures: the **Reference Class Problem** (statistics/philosophy), **Pragmatic Encroachment** (epistemology), and **Boundary Work** (sociology of science).

  The structural difficulty you identify—the existence of multiple valid groups—is the **Reference Class Problem**. The *shift* in selection based on the stakes or purpose of the decision is best described as **Pragmatic Encroachment on Reference Class Selection**.

  Below is a detailed breakdown of the concepts, followed by the specific distinctions you requested, and a proposed definition for your committee's use.

  ### 1. The Core Concepts

  **The Reference Class Problem (The Structure)**
  Coined by Hans Reichenbach (1949), this is the statistical backbone of your observation. It states that any individual case belongs to infinitely many reference classes, and different classes yield different frequencies. Standard statistical literature treats this as an *epistemic crisis*: "Which class is the *true* one?" The literature usually concludes that one must choose the "narrowest relevant class" for which reliable statistics exist. Your observation complicates this by showing that "relevance" is not fixed by data quality alone, but by the *decision context*.

  **Pragmatic Encroachment (The Shift)**
  In contemporary epistemology, "pragmatic encroachment" is the thesis that whether a person *knows* a proposition (or is justified in believing it) can depend on practical stakes, not just evidence.
  *   *Standard view:* If the evidence supports probability $P$, you believe $P$ regardless of the stakes.
  *   *Encroachment view:* If the cost of being wrong is high (e.g., overriding patient autonomy), the evidentiary standard rises, requiring a more specific reference class. If the cost is distributed (e.g., budgeting), a broader class suffices.
  Your committee members are engaging in **Decision-Relative Contextualism**: they are implicitly agreeing that the "correct" probability is not a property of the patient alone, but a relation between the patient, the data, and the *action* the number will justify.

  **Boundary Work (The Function)**
  In Science and Technology Studies (STS), "boundary work" refers to the strategies actors use to create, maintain, or blur the lines between "objective science" and "subjective judgment."
  *   When withholding care, clinicians draw the boundary around **Actuarial Science** (broad groups, population validity).
  *   When overriding autonomy, they draw the boundary around **Clinical Judgment** (narrow groups, individual validity).
  This is not regarded as dishonest because it serves a functional institutional need: it allows the system to be fiscally responsible (population level) while maintaining moral legitimacy (individual level).

  ### 2. Addressing Your Three Distinctions

  You asked to distinguish this phenomenon from cherry-picking, plain reversal, and to identify legitimate versions.

  **A. Distinction from Cherry-Picking**
  *   **Cherry-Picking:** The alternatives are *concealed*. The speaker presents one reference class as if it were the only valid one. The intent is deception regarding the state of the evidence.
  *   **Your Phenomenon:** The alternatives are *acknowledged* ("Nobody disputes anyone's figures"). The disagreement is not about the *truth* of the frequency, but about the *relevance* of the grouping to the specific decision at hand. It is transparent selection, not concealment. In rhetorical terms, cherry-picking is a fallacy of suppression; your phenomenon is a **negotiation of relevance**.

  **B. Distinction from Plain Reversal (Simpson's Paradox)**
  *   **Plain Reversal:** In Simpson's Paradox or simple partitioning, the existence of conflicting numbers usually leads to *epistemic paralysis* or a demand for a causal model to resolve the conflict. The stance is: "We cannot know the probability until we agree on the cause."
  *   **Your Phenomenon:** The conflict is resolved *pragmatically*, not causally. The group does not seek the "one true number"; they accept that different numbers serve different institutional functions. The stance is: "We know both numbers are true; we must decide which one governs this specific action." It moves from an epistemic problem to a **governance protocol**.

  **C. Is There a Legitimate Version?**
  Yes. In decision theory and bioethics, shifting the grain of the grouping based on the decision type is not only legitimate but often required. This relies on the concept of **Loss Functions**.
  *   **Budgeting/Policy (Aggregate Loss):** The goal is to minimize error across the population. A broad reference class reduces variance and exploits the Law of Large Numbers. Using a narrow class here would lead to overfitting and fiscal instability.
  *   **Bedside/Clinical (Individual Loss):** The goal is to minimize specific harm to *this* patient (e.g., wrongful denial of care). The "cost" of a false negative is concentrated on one person. Therefore, the evidentiary standard requires the narrowest possible class to respect individual distinctness.
  *   **Legitimacy:** The move is legitimate when the shift in granularity tracks a shift in **who bears the risk**. If the system bears the risk (budget), use system-level stats. If the patient bears the risk (outcome), use patient-level stats.

  ### 3. Proposed Definition

  Since no single label exists, I recommend adopting a descriptive definition for your committee's records. This distinguishes the phenomenon from bias while acknowledging its strategic nature.

  **Term:** **Decision-Relative Reference Class Selection**

  **Definition:**
  > A deliberative practice in which multiple statistically valid reference classes are available for a single case, and the selection of the governing class is determined not by data superiority, but by the **decision context** and the **distribution of risk**.
  >
  > **Boundary Conditions:**
  > 1.  **Transparency:** All competing reference classes and their associated frequencies are openly acknowledged as valid.
  > 2.  **Non-Arbitrariness:** The selection of the class correlates systematically with the stakes of the decision (e.g., aggregate resource allocation vs. individual autonomy).
  > 3.  **Non-Resolution:** The disagreement is not resolved by acquiring more data, as the conflict arises from the cross-cutting nature of the variables, not data scarcity.

  **Boundary Cases (What this is NOT):**
  *   **Data Dredging:** Where the speaker searches for *any* subgroup that supports a pre-determined conclusion, regardless of decision context.
  *   **Epistemic Negligence:** Where the speaker ignores a narrower, more predictive class that is available and relevant to the specific decision at hand (e.g., using a population average for a bedside decision when a specific biomarker is available).
  *   **Motivated Concealment:** Where the existence of alternative reference classes is hidden from the decision-makers.

  ### Summary for Your Committee
  You are observing a **functionalist resolution to the Reference Class Problem**. Your colleagues are not failing to find the "true" probability; they are correctly identifying that "probability" is not a monolithic property of the patient, but a tool that changes shape depending on whether it is being used to manage a **population** (where broad classes minimize systemic error) or a **person** (where narrow classes minimize individual injustice).

  This is not a bug in your review process; it is a feature of how clinical evidence interfaces with ethics. The "disagreement" is actually a negotiation over which ethical framework (utilitarian/population vs. deontological/individual) is currently in force. Recognizing this explicitly may allow your committee to move from arguing about *numbers* to arguing about *which decision framework applies*, which is a more productive use of your time.
