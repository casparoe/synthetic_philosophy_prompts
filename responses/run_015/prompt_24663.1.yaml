answer: |-
  ### The dependence chain

  In the Prisoner's Dilemma, defection is a dominant strategy: it yields a higher payoff regardless of what your opponent chooses. You don't need to model their mind; the math works out purely based on your own payoff matrix. The Centipede Game is fundamentally different. Here, there is no dominant strategy. Your optimal move at any node depends entirely on your belief about what the other player will do at the *next* node. If you believe they will pass (cooperate), you should pass to get a larger later payoff. If you believe they will take (defect), you should take now to avoid getting nothing.

  Backward induction constructs a fragile chain of these beliefs. To decide at node one, you must believe the other player will decide at node two based on what they believe you will do at node three. This creates a recursive dependency: my action depends on your action, which depends on your belief about my action, and so on, all the way to the final node. Unlike the robust, belief-independent logic of a dominant strategy, the Centipede's logic is a house of cards built on mutual expectations. If any link in this chain of expectations breaks, the recommendation to "defect immediately" collapses. The strategy is not optimal in isolation; it is only optimal conditional on a specific, unbroken sequence of future rationalities.

  ### Why the prediction is fragile

  This dependency makes the backward-induction solution incredibly sensitive. The argument requires "common knowledge of rationality": I must know you are rational, you must know I know, and so on. If you introduce even a tiny probability that your opponent is not fully rational—perhaps they are altruistic, or simply confused—the logic unravels. If I think there is a 1% chance you will pass at the final node, I should pass at the second-to-last node to capture the growth. But if I pass, you should pass at the node before that, anticipating my cooperation.

  This small doubt propagates backward. A tiny crack at the end justifies cooperation near the end, which justifies cooperation slightly earlier, eventually validating cooperation at the very start. Similarly, if payoffs are slightly perturbed so that cooperation is occasionally rewarded, the strict defection path disappears. In the Prisoner's Dilemma, a small doubt doesn't change the dominant strategy; defection remains best. In the Centipede Game, however, the stark prediction of immediate defection relies on perfect certainty. Once uncertainty enters the system, the equilibrium shifts dramatically from "take immediately" to "pass for several rounds," aligning much closer with how actual humans behave. The theoretical conclusion is mathematically sharp but empirically brittle, collapsing under the weight of minimal uncertainty.

  ### Entailment or procedure?

  This fragility forces us to reconsider what backward induction actually tells us. It is not a law of nature describing what rational agents must do. Instead, it is a reasoning procedure whose output is only as reliable as the beliefs it starts from. If the input assumptions—perfect rationality and common knowledge—are not met, the output is garbage.

  We should view the "defect immediately" conclusion not as a strict entailment of rationality, but as a limit case. It shows what happens in a hypothetical world of perfect transparency. In the real world, where beliefs are noisy, backward induction serves better as a benchmark than a prediction. Recognizing this distinction prevents us from labeling cooperative players as "irrational." They may simply be responding rationally to a different set of beliefs about the world. It highlights how sensitive strategic reasoning is to our assumptions about others' minds.
