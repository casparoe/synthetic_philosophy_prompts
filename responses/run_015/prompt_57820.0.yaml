prompt: |-
  So me and my housemates got into this dumb late-night argument about our city council proposal and now I'm actually confused. They're talking about doing three things at once for local elections: fining people like 20 bucks if they don't vote, letting 16 and 17 year olds vote, and letting non-citizens who've lived here a few years vote for mayor and school board but obviously not for like president or congress. Supporters keep saying its all about making democracy more inclusive and representative, but that sounds off to me because forcing people to vote doesn't feel like inclusion, and letting a teenager and a 40 year old non-citizen vote locally but not nationally seems kinda arbitrary.

  What view of what voting even is would you need for that whole package to make sense together? Like does it treat voting as a duty vs a right, or about being affected vs being a member, or about being competent enough? And is there a tension — like does compulsory voting presuppose people are competent enough that you can force them, while the age limit presupposes some people aren't? Tell me what the proposal strictly needs to assume vs what it just kinda fits with, and what would have to change if you swapped in the opposite view.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**
      *   **Context:** Late-night argument with housemates about a specific city council proposal.
      *   **The Proposal:** A package of three reforms:
          1.  Compulsory voting (fine ~$20 for non-voting).
          2.  Lowering voting age to 16.
          3.  Non-citizen voting in local elections (mayor, school board) for long-term residents.
      *   **User's Confusion:** The arguments for "inclusivity" seem contradictory. Forcing people (compulsory) doesn't feel inclusive. Differentiating between local/non-citizen and national/citizen seems arbitrary. Age limits vs. competence seem inconsistent.
      *   **The Task:** Identify the underlying *view of voting* that makes this specific package coherent. Analyze tensions (duty vs. right, affected vs. member, competence). Distinguish between what the proposal *strictly needs* to assume vs. what it *fits with*. Explore what happens if you swap in the opposite view.

  2.  **Analyze the Three Components Individually & Collectively:**

      *   **Compulsory Voting:**
          *   *Standard Justification:* Civic duty, legitimacy through high turnout, reducing polarization (forces candidates to appeal to everyone, not just bases).
          *   *Underlying View:* Voting is a *civic obligation* (like jury duty or taxes), not just a personal right. It's about the health of the system, not individual expression.

      *   **Voting Age 16:**
          *   *Standard Justification:* "Taxation without representation" (working teens), cognitive maturity is sufficient, habit formation.
          *   *Underlying View:* Competence is reached earlier than 18. Or, the "affected interests" principle (teens are affected by school board/city policies) outweighs strict legal adulthood.

      *   **Non-Citizen Local Voting:**
          *   *Standard Justification:* "All affected interests" principle. If you live here, pay local taxes, use local services (schools, trash, police), you should have a say. Citizenship is a national status; residency is a local status.
          *   *Underlying View:* Voting is about *stakeholding* in a specific community, not national sovereignty or allegiance.

      *   **The Package Deal (Synthesis):**
          *   Why do these go together? They all shift voting away from "national citizenship privilege" toward "local community participation."
          *   *Core Philosophy:* **Civic Republicanism + Stakeholder Theory.** Voting is a duty of residence/participation, not a right of nationality.

  3.  **Address the User's Specific Tensions:**

      *   *Duty vs. Right:* Compulsory voting screams "Duty." Lowering age/non-citizen voting screams "Right/Inclusion."
          *   *Resolution:* It's a *universal duty of residence*. If you live here and are capable, you *must* participate. The "inclusion" part is just expanding the definition of who counts as a resident stakeholder.
      *   *Competence:* Forcing 16-year-olds vs. forcing adults.
          *   *Resolution:* The threshold for "local competence" is lower than "national competence." You don't need to understand foreign policy to vote for a school board.
      *   *Arbitrariness (Local vs. National):*
          *   *Resolution:* It's not arbitrary if you view local gov as service management (trash, schools) vs. national gov as sovereignty (war, borders).

  4.  **Drafting the Analysis (Iterative Process):**

      *   *Introduction:* Acknowledge the confusion. It *is* a mix of philosophies, but there is a coherent thread.
      *   *Core View:* Define the "Stakeholder + Duty" model.
      *   *Breaking down the assumptions:*
          *   **Voting as a Duty (Compulsory):** Needs assumption that participation is necessary for legitimacy.
          *   **Voting as Stakeholding (Non-citizens/16yo):** Needs assumption that impact matters more than legal status.
          *   **Competence:** Needs assumption that local voting requires less expertise than national.
      *   *Addressing Tensions:*
          *   *Duty vs. Right:* It reframes the right as a responsibility.
          *   *Competence:* It creates a tiered competence model (local vs. national).
      *   *Strict Needs vs. Fits:*
          *   *Strict:* Must believe voting is about local impact. Must believe low turnout is bad.
          *   *Fits:* Progressive ideology, civic republicanism.
      *   *The Swap:* What if we view voting as a *National Privilege*? Then all three fail. What if we view it as *Pure Individual Liberty*? Then compulsory voting fails.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "this is progressive." I need to explain the *political theory* behind it.
      *   *Key Concept:* **The "All-Affected Interests" Principle.** This is the glue. If you are affected, you vote. If you are a member of the polity, you must vote.
      *   *Key Concept:* **Civic Duty vs. Liberal Right.** The proposal blends these. It expands the *pool* (liberal inclusion) but mandates the *act* (republican duty).
      *   *The "Arbitrary" Line:* The user thinks local vs. national is arbitrary. I need to explain why a proponent sees it as functional. (Local = administration, National = sovereignty).

  6.  **Final Structure:**
      1.  **The Unifying Theory:** "Residential Stakeholder Citizenship."
      2.  **Deconstructing the Three Pillars:** How each fits the theory.
      3.  **Resolving the Tensions:** Duty vs. Right, Competence.
      4.  **Strict Assumptions vs. Compatible Beliefs:** What is essential vs. what is incidental.
      5.  **The Counter-Model:** What happens if you swap the view (e.g., Voting as National Privilege).

  7.  **Tone Check:** Keep it analytical, neutral, and philosophical. Avoid taking sides on whether the proposal is *good*, just whether it is *coherent*. (The user asked "What view... would you need for that whole package to make sense," not "Is this a good idea.")

  8.  *(Final Polish)*: Ensure the distinction between "strictly needs" and "fits with" is clear. This is a crucial part of the prompt.
      *   *Strict:* Voting is a function of residency/impact. Low turnout undermines legitimacy.
      *   *Fits:* General progressive values, trust in government efficiency.

  9.  **Generate Output.** (Proceeding to write the response based on these thoughts.)
answer: |-
  This is a great question because it cuts through the surface-level political talking points and asks about the underlying political philosophy. Your confusion is warranted: on the surface, this package mixes **coercion** (fines) with **expansion** (lowering age/status limits).

  However, there is a coherent philosophical framework that binds these three ideas together. For this package to make sense, you have to reject the idea that voting is primarily a **national right of citizenship** and instead adopt a view of voting as a **local duty of residency.**

  Here is the breakdown of the specific view of voting required to make this triad coherent, the tensions involved, and what happens if you swap the underlying assumptions.

  ### 1. The Unifying Theory: "Residential Stakeholder Citizenship"

  To support all three measures simultaneously, you must view voting not as a privilege granted by a nation-state, but as a **function of being governed.**

  *   **The Core Principle:** The legitimacy of a government depends on the participation of everyone subject to its rules.
  *   **The Glue:** This connects the *expansion* (who votes) with the *compulsion* (that they vote). If voting is how we authorize the rules that bind us, then everyone bound by the rules should vote, and everyone who should vote must vote to maintain legitimacy.

  Here is how each pillar fits that view:

  #### A. Compulsory Voting (The Duty)
  *   **The Assumption:** Voting is a civic obligation similar to jury duty or paying taxes, not a consumer choice.
  *   **Why it fits:** If voting is the mechanism by which the community governs itself, opting out is akin to refusing to pay for a service you use. Low turnout makes the government illegitimate because it no longer represents the "general will," only the "motivated will."
  *   **Strict Need:** You must assume that **high turnout is more important than individual liberty to abstain.**

  #### B. Voting at 16 (The Competence Threshold)
  *   **The Assumption:** Competence is tied to **affected interests**, not legal adulthood.
  *   **Why it fits:** 16-year-olds pay taxes (on income), use public transit, attend public schools, and are subject to local curfew laws. Under the "Residential Stakeholder" view, if the city council decides on the bus route or the school budget, the 16-year-old is a stakeholder.
  *   **Strict Need:** You must assume that **cognitive maturity for local issues is reached before national legal adulthood.**

  #### C. Non-Citizen Local Voting (The Scope of Sovereignty)
  *   **The Assumption:** Local government is about **administration**, not **sovereignty**.
  *   **Why it fits:** This resolves your "arbitrary" concern. In this view, national elections (President/Congress) determine sovereignty, borders, and war (requiring citizenship/allegiance). Local elections (Mayor/School Board) determine trash collection, zoning, and education (requiring residency). If you live here, pay local taxes, and send kids to school, you are a stakeholder in the *administration*, regardless of your national passport.
  *   **Strict Need:** You must assume a **functional distinction between local management and national sovereignty.**

  ---

  ### 2. Resolving the Tensions

  You identified two major tensions. Here is how a proponent of this package resolves them logically:

  #### Tension 1: Duty (Fines) vs. Inclusion (Rights)
  *   **The Conflict:** How can you force people to do something you claim is an inclusive right?
  *   **The Resolution:** This view treats voting as a **Collective Responsibility** rather than an **Individual Liberty.**
      *   *Liberal View:* Voting is a right I can choose to exercise or not.
      *   *This Proposal's View:* Voting is a social contract. We are expanding the *circle of responsibility* (to 16-year-olds and non-citizens) because they are part of the community, but once you are in the circle, you cannot opt out.
      *   *Coherence:* It is not contradictory if you believe inclusion means "bringing everyone into the system of obligation," not just "giving everyone a ticket to the show."

  #### Tension 2: Competence (Forcing 16-year-olds vs. Adults)
  *   **The Conflict:** If 16-year-olds are competent enough to be fined for not voting, why are they not competent enough for other adult things?
  *   **The Resolution:** **Tiered Competence.**
      *   This model assumes that understanding who should fix the potholes or run the school board requires less "competence" than understanding foreign policy or macroeconomic theory.
      *   By restricting non-citizens and 16-year-olds to *local* elections, the proposal implicitly admits they might not be ready for *national* stewardship. It lowers the bar for entry to match the lower stakes/complexity of local governance.

  ---

  ### 3. Strict Assumptions vs. "Fits With"

  It is important to distinguish what this proposal *requires* to be true versus what ideologies just happen to align with it.

  | **Strictly Needs to Assume** | **Just "Fits With" (Compatible but not required)** |
  | :--- | :--- |
  | **Voting is about Impact:** If you are affected by a law, you should have a say in it. | **Progressive Politics:** Usually, this package is proposed by left-leaning groups, but a libertarian could support it if they believe it reduces government overreach by making voters more accountable. |
  | **Legitimacy requires Universality:** A government elected by 40% of the people is inherently flawed. | **Distrust of Elites:** Supporters might argue this reduces the power of wealthy donors, but the system could theoretically work even with high donor influence. |
  | **Local ≠ National:** City Hall is a service provider; Washington is a sovereign power. | **High Trust in Bureaucracy:** You don't need to trust the government to be efficient, you just need to believe it needs a mandate to function. |
  | **Coercion is Legitimate:** The state has the right to enforce participation in its own selection. | **Social Democracy:** Often aligns with welfare states, but compulsory voting exists in non-welfare states too (e.g., Australia). |

  ---

  ### 4. The Swap: What if you change the view?

  To see why this package is specific, let's swap in the two most common opposing views of voting.

  #### Swap A: Voting as a "National Privilege" (The Conservative/Restrictionist View)
  *   **View:** Voting is a benefit of citizenship and allegiance to the nation-state.
  *   **Result:**
      *   *Non-citizen voting:* **Fails.** If voting is about national allegiance, a non-citizen cannot vote for *anything*, even dogcatcher.
      *   *Age 16:* **Fails.** If voting is tied to legal adulthood/contractual capacity, 18 is the line.
      *   *Compulsory:* **Maybe.** Some conservatives support duty, but many view forced voting as government overreach.
  *   **Verdict:** The package collapses completely.

  #### Swap B: Voting as a "Pure Individual Liberty" (The Libertarian View)
  *   **View:** Voting is a personal right, like speech or religion. The state cannot compel expression.
  *   **Result:**
      *   *Non-citizen/Age 16:* **Supports.** The more people who can exercise liberty, the better.
      *   *Compulsory:* **Fails Hard.** Fining someone for not voting is a violation of the right *not* to speak/associate.
  *   **Verdict:** The package collapses on the coercion element.

  ### Summary
  For your housemates' proposal to make sense, they are operating on a **Civic Republican** model of local governance. They believe:
  1.  **Legitimacy comes from participation** (hence the fines).
  2.  **Authority comes from being affected** (hence the 16-year-olds and non-citizens).
  3.  **Local power is administrative, not sovereign** (hence the restriction to mayor/school board).

  Your intuition that it feels "arbitrary" comes from viewing voting through a **National/Liberal** lens (where voting is a uniform right of adult citizens). Their intuition comes from a **Local/Functionalist** lens (where voting is a duty of residents managing shared resources). You aren't arguing about the policy details; you're arguing about the definition of what a vote *is*.
