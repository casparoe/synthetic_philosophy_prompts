answer: |-
  **Address: The Weight of a Sentence**

  Good evening.

  It is a peculiar honor to stand between a philosophy department and a literary festival. Usually, these two groups meet only in the footnotes of each other's work. The philosophers are here to ask what we mean when we say something is the case. The readers are here to feel what it is like when something is the case. And I am the novelist standing in the middle, holding a book that, by the admission of my reviewers, refuses to say that anything is the case at all.

  We are gathered to talk about fiction and truth. I know what half of this room hopes to hear. You want to be told that while nonfiction gives you the facts, fiction gives you the *Truth*. You want to hear that the novel accesses a deeper reality, a spiritual resonance that a police report or a history book cannot capture. It is a comforting thought. It makes the act of reading feel like a pilgrimage.

  I am not going to offer you that comfort. I cannot. Because the other half of this room—the philosophers, many of whom are deflationists—would be right to stop me. They hold that "truth" is not a hidden treasure waiting to be unearthed. To say "It is true that snow is white" adds nothing to "Snow is white." Truth is not a heavy, glowing property that some sentences possess and others lack. It is a tool we use to endorse our own speech. It is a stamp we put on a claim to say, "I stand by this."

  If we accept that view—and I think we must, if we want to be honest about language—then the idea that fiction possesses "more truth" than nonfiction collapses. A novel cannot be *more* endorsed than a fact. It can only be a different kind of arrangement of words.

  So, if truth is not a substance that fiction stores in higher concentrations, what is the novel for? Why do we spend our lives making them and reading them?

  I want to suggest that the value of a novel lies not in the truth of its sentences, but in their *usability*.

  If truth is just a device for endorsement, then the primary transaction of standard discourse is: "I assert P, and I ask you to believe P." Nonfiction operates heavily here. Even when it is nuanced, it ultimately asks you to align your map of the world with its claims.

  But consider my own recent work. As some of you know, my last three books are written in what critics have called a "secondhand manner." Nothing in them is asserted outright. There is no omniscient narrator telling you what happened. Every claim reaches the reader as something overheard, reported, or whispered by a character with a reason to lie. A character says, "I heard that the bank closed." Another says, "They told me the bank never opened." The book itself never says, "The bank closed."

  In the strict philosophical sense, these books do not ask to be believed. They withhold assertion.

  Now, if truth is simply the act of standing behind a sentence, then my books are empty of truth. I have removed the stamp. I have declined to endorse the content. To the reader expecting a "deeper truth," this might feel like a betrayal. I am not giving you a reality to inhabit. I am giving you a rumor to examine.

  But this is where the deflationary view becomes useful for the writer. If truth is not a magical property, then removing it does not remove the *power* of the sentence. It only removes the *obligation*.

  When I write, "The sun rose over the valley," and assert it as true, I am asking you to check your knowledge of astronomy and geography. I am asking you to verify. But when I write, "She told him the sun rose over the valley," I am no longer asking you to verify the sun. I am asking you to verify *her*.

  What is lost when a book withholds assertion? Certainty is lost. The comfort of a stable world is lost. You cannot quote my books as evidence in an argument. You cannot say, "As [Author] wrote, the war began in 1914," because I never wrote that the war began; I only wrote that a soldier *said* it began.

  But what is gained?

  What is gained is the freedom to handle the sentence without the burden of its factuality. When you read a claim that is not asserted, you are free to inspect the *shape* of the claim rather than its correspondence to the world. You can ask: Why would someone say this? What pressure forced this sentence out of a human mouth? What does it do to the person who hears it?

  In a world obsessed with "fact-checking," where every sentence is immediately put on trial to see if it matches reality, the secondhand novel offers a sanctuary. It is a place where sentences are allowed to exist not because they are true, but because they were *spoken*.

  This brings us to the structural work I want the deflationary thought to do. If truth is not a hidden nature, then the value of literature is not that it *has* truth. The value is that it creates a space where we can practice *managing* claims.

  When you read a novel where everything is reported and nothing is guaranteed, you are not learning about the world. You are learning about the weight of a sentence in a human life. You are seeing how a lie can comfort, how a rumor can destroy, how a hope can sustain, regardless of whether the object of that hope exists.

  To the philosophers: I am not claiming my fiction accesses a non-deflationary truth. I am claiming it simulates the social environment in which truth-claims are traded.

  To the readers: You will not find a deeper reality here. You will not find the "True Story" behind the news. But you might find something more practical. You will find a simulation of how we live with uncertainty.

  We spend most of our waking lives not in the position of the verifier, but in the position of the listener. We are constantly receiving reports from friends, lovers, politicians, and news anchors. We rarely have direct access to the facts. We have only the secondhand word. We have to decide how to act on information that we cannot verify.

  A novel that withholds assertion trains you for this. It forces you to hold a thought in your mind without demanding that you sign a affidavit for it. It allows you to say, "I understand this claim, I see its consequences, but I do not need to settle its truth to understand its impact."

  This is not a "higher truth." It is a different competency.

  If I tell you, "It is true that love endures," I am making a metaphysical claim that is easily falsified. If I tell you, "He told her that love endures, and she believed him for a night," I am making a claim about human fragility that is much harder to shake.

  The deflationist says that calling a sentence "true" adds nothing to the sentence. I would go further. In fiction, calling a sentence "true" might subtract from it. It narrows the sentence down to a single function: matching the world. But a sentence in a novel has many functions. It can reveal character. It can set a rhythm. It can expose a bias. It can build a trap.

  By refusing to assert, by refusing to ask for your belief, I am trying to return the sentence to its full complexity. I am asking you to look at the tool, not just the job it was hired to do.

  So, do not come to my books for the truth. Come to them for the testimony. Do not come to find out what happened. Come to find out what it feels like when someone tells you something happened, and you have to decide what to do next.

  In the end, the novel does not save us from the burden of verification. But it might teach us how to carry it. It teaches us that a sentence can be heavy, dangerous, or beautiful, without ever needing to be true. And in a time when we are exhausted by the demand to decide what is real and what is fake, that might be the only honesty left worth offering.

  Thank you.

  ***

  **Note on the Speech**

  This address leans heavily on a pragmatic interpretation of deflationism, specifically the idea that truth is a device for endorsement or assertion (a la Ramsey or Brandom). By framing truth as a speech act ("I stand by this") rather than a correspondence relation, I can argue that fiction which withholds assertion (my "secondhand manner") opts out of the truth-game without losing value. However, this quietly changes the subject from *truth* to *trust* and *utility*. A hardline deflationist might argue that fictional sentences are simply not in the business of truth-evaluation at all (they are "pretend assertions"), so discussing them as "withholding assertion" is category confusion. I have glossed over this by treating the novel as a simulation of assertoric environments. Furthermore, I have shifted the audience's expectation from "Truth" (a property) to "Competency" (a skill in navigating claims). This satisfies the philosophers by avoiding metaphysical inflation, and satisfies the readers by offering a tangible benefit to reading (training for uncertainty) that feels as weighty as "Truth" without requiring the metaphysical baggage. The speech argues that the "gain" of the secondhand style is the liberation of the sentence from the burden of verification, allowing the reader to focus on the *consequences* of the claim rather than its *accuracy*.
