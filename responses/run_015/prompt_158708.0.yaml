      *   *Refining the Deflationary Move:* I need to be careful not to say "Fiction is false." Deflationists say "Snow is white" is true iff snow is white. Fiction says "Sherlock Holmes lived at 221B." This isn't true. But the *emotions* or *situations* might be. Wait, the prompt says "without implying that some further property has been secured." So, I shouldn't say "It's emotionally true." I should say "It is *useful*."
      *   *Key Insight:* If truth is just a device for endorsement, then the "secondhand manner" is a suspension of endorsement. It allows the reader to hold the thought without needing to verify the world. It shifts the work from *verification* to *navigation*.

  4.  **Drafting the Note:**
      *   Need to be honest about where the speech bends the rules.
      *   Deflationism usually applies to assertoric discourse. Fiction is often seen as non-assertoric (pretend assertion).
      *   The speech shifts from "Truth" to "Trust" or "Utility."
      *   Acknowledge that this might be changing the subject, but argue it's a necessary pragmatic move.

  5.  **Writing - Iteration 1 (Mental Outline):**
      *   Hello philosophers, hello readers.
      *   Philosophers say truth is cheap. Readers say it's deep.
      *   I say: Let's look at what we *do* with sentences.
      *   My books don't assert. They report.
      *   If truth is just endorsing a sentence, my books don't ask for endorsement.
      *   So what do they do? They let you try the sentence on.
      *   You don't check if it fits the world; you check if it fits your mind.
      *   That's the gain. The loss is certainty.
