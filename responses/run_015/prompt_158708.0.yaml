      *   *The Problem:* If truth is just disquotation (asserting P is the same as asserting 'P is true'), what happens when you *don't* assert P? If I don't ask to be believed, am I opting out of truth-talk entirely? Or am I doing something else?
      *   *The Goal:* Show that the value of fiction isn't in possessing a property called "Truth," but in the *utility* of the sentences for the reader. Deflationism helps here because it shifts focus from *correspondence to reality* to *assertibility conditions* or *use*.

  3.  **Drafting the Address - Section by Section:**

      *   **Introduction:** Acknowledge the split audience. Set the stage without pretension. Avoid the "Art reveals Truth" trap.
      *   **Addressing the Philosophers:** Acknowledge deflationism without jargon. "True" is a tool, not a treasure.
      *   **Addressing the Readers:** Validate their desire for something *real* without promising metaphysical depth.
      *   **The Core Argument (Deflationary Utility):** If "true" just means "I stand by this," then fiction is interesting because it plays with *standing by* things.
