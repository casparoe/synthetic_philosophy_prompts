      *   *Check:* Did I lecture on disquotation? *Correction:* Keep it to "saying 'true' adds no weight."
      *   *Check:* Did I address the "secondhand" wrinkle? *Yes, make it the centerpiece.*

  10. **Final Review against constraints:**
      *   10 mins? (Word count check).
      *   Plain enough for festival? (Yes, avoid jargon).
      *   Not question-begging for philosophers? (Yes, respect deflationism).
      *   Definite position on the "secondhand" style? (Yes: Loss of authority, gain of freedom/examination).
      *   Note included? (Yes).

  *(Self-Correction on Word Count)*: A 10-minute speech is usually around 1,300 to 1,500 words. I need to ensure it's substantial enough but not too long.

  *(Refining the Deflationary Stance)*: I need to be careful. If I say "Fiction isn't true," the audience might balk. If I say "Fiction is true," the philosophers will groan. The middle path: Fiction *uses* sentences without the commitment of truth. It simulates the *shape* of truth-telling. The "secondhand" style makes this simulation explicit.

