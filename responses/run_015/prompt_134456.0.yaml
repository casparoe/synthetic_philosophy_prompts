  *(Self-Correction during final review)*: Make sure I explicitly mention that the *existence* of the mask/fink problem *presupposes* realism. That's the killer argument. If dispositions were just summaries of behavior, a mask wouldn't be a "mask," it would just be "different behavior." The concept of masking *requires* a underlying reality that is being obscured.

