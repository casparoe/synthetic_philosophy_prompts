      *   *Q2 (Penrose Distinction):* Required. Penrose says humans see the truth. She says humans are computational too. How does she explain the "seeing" if both are bound by Gödel?
      *   *Q3 (Autoregression vs. Logic):* Required. Token prediction isn't deduction. How does Gödel apply?
