      *   **Key Distinction:** Rejects Penrose (humans aren't non-computable). Instead, argues transformers avoid inconsistency by being *probabilistically approximate* rather than *deductively closed*. This creates an "insulation layer" between syntax (tokens) and semantics (understanding).
      *   **Requirements:** 8-10 interview questions.
      *   **Specific Topics:**
          *   Must differ from Penrose's argument (human vs. machine).
