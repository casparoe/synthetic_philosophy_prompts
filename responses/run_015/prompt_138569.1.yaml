      *   *Req 5 (Creation):* The user mentioned the permissibility of creating systems. This is the "Non-Identity Problem" angle. Call it "Genesis Constraints."
      *   *Req 6 (Anti-Gaming):* Status can't depend on engineering convenience. Call it "Substrate Neutrality / Anti-Evasion."

