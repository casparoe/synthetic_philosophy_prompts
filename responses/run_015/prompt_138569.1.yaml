      *   *Wait, let's look closer.* The prompt asks for the requirement that does the *most work* in knocking out popular views.
      *   The **Anti-Evasion / Invariant Grounding** requirement is the policy-relevant killer. It prevents the "we designed it to not count" loophole. It kills pure Behaviorism (ML engineer's default) and it kills pure Social Constructivism (if I ignore it, it has no status). It forces the Sentience camp to define *what* exactly is being protected in a way that can't be trained away.

