      *   F: Collapse $c_F \to (0.7, 0.3)$. $S = 0.18$.
      *   **Rank:** Tie (difference 0).
  5.  **INB:** $S_{raw} - (1 - 1/|A|)$.
      *   C: $S_{raw} = 0.18$. Baseline $1 - 0.5 = 0.5$. $S = -0.32$.
      *   F: $S_{raw} = 0.34$. Baseline $1 - 0.25 = 0.75$. $S = -0.41$.
      *   **Rank:** F is more accurate by 0.09.

  (c) **Viability Ranking**
  1.  **INB (8):** Residual penalty on complexity can still discourage honest fine-grained reporting.
  2.  **UEB (6):** Incentivizes arbitrary distinction-making to concentrate probability density.
  3.  **AL (4):** Incentivizes strategic vagueness by penalizing refined partitions.
  4.  **BXB (2):** Improper unless the agent's beliefs align with the designer's background measure.
  5.  **CCB (1):** Discards private epistemic labor by collapsing all agents to the coarsest vocabulary.

  (d) **Bonus for Informativeness**
  No, I would not add an explicit bonus for informativeness. Doing so renders the scoring rule improper, which violates the core accuracy-first constraint that agents should maximize expected score *only* by aligning credences with truth. Instead, I would give up the requirement that vocabulary choice be endogenous to the scoring layer, treating the partition as a fixed constraint per agent or evaluating vocabulary quality as a separate, non-epistemic metric.

  (e) **Limitations**
  This setup cannot settle whether cross-granularity accuracy comparisons are coherent, because it assumes the "actual world" $w$ is the sole arbiter of truth, ignoring whether the vocabulary itself successfully carves nature at its joints. If the fine-grained agent distinguishes irrelevant details while the coarse-grained agent captures the causally relevant structure, scoring based solely on $w$ credits the former for luck and penalizes the latter for abstraction, leaving unresolved whether conceptual engineering is an epistemic achievement distinct from credal accuracy.
