answer: |-
  Your intuitions are not noise but track a coherent principle of 'domain integrity', yet holding them consistently requires you to either legalise kidney sales or ban plasma ones, and the waiting-list statistics should not move you because your objection is to the *kind* of transaction, not its outcome.

  Your friend calls your reactions noise because he is looking for a consequentialist calculus (does this maximise welfare?), whereas your gut is operating on a deontological framework (does this violate the meaning of the relationship?). Your attempt at a principle was close but too vague; 'different logic' needs to be sharpened to 'constitutive logic'. Markets are permissible when they operate in domains where price is a neutral tool for allocation, but forbidden when price signals corrupt the essential purpose of the good or the relationship involved.

  Here are three candidate principles that repair your intuition, stated precisely enough for you to apply:

  **1. The Corruption of Meaning Principle**
  Markets are forbidden when introducing price changes the social meaning of the good being traded.
  *   **Why it fits:** It explains why paying a grandson is grubby (corrupts familial love into wage labour) while paying a stranger is fine (care is already a service). It explains why selling votes is banned (corrupts citizenship into property).
  *   **The Cost:** You must accept that paying for plasma might corrupt the meaning of bodily integrity just as much as kidneys, forcing you to ban plasma too.
  *   **New Cases:** Cash for vaccination is fine (health incentive, not corrupting meaning); selling residency rights is banned (corrupts belonging into asset); selling a place on a transplant list is banned (corrupts medical need into wealth).

  **2. The Coercion and Necessity Principle**
  Markets are forbidden when the seller's desperation or the buyer's monopoly on necessity undermines valid consent.
  *   **Why it fits:** It explains the flood water case (monopoly on survival) and the sterilisation case (desperation of addiction). It explains why drug trials are fine (risk is voluntary, not driven by immediate survival threat in the same way).
  *   **The Cost:** You must accept that a poor person selling a kidney *is* coerced by poverty, so the ban stands, but you must also ban low-wage labour that is driven by desperation, which might be too broad.
  *   **New Cases:** Cash for vaccination is fine (not coercive); selling residency rights is fine (buyer not desperate); selling a transplant list place is banned (buyers exploit medical necessity).

  **3. The Bodily Sovereignty Principle**
  Markets are forbidden when they treat the body as a warehouse of detachable parts rather than a unified whole, unless the part is regenerative surplus.
  *   **Why it fits:** It distinguishes kidneys (non-regenerative, essential) from plasma (regenerative, surplus). It handles the sperm/egg unease by flagging the higher physical invasiveness of egg retrieval.
  *   **The Cost:** You must accept that whole blood donation (regenerative) should be fine to sell, contradicting your unease, and you must justify why drug trials (risking the whole body) are permissible while selling a kidney (losing a part) is not.
  *   **New Cases:** Cash for vaccination is fine (no body part); selling residency rights is fine (no body part); selling a transplant list place is banned (commodifies access to bodily repair).

  **The Choice: Ugly vs. Simple**
  If the choice is between an ugly principle that saves all your verdicts (a complex hybrid of all three above) and a simple one that costs you two of them, I would take the **simple one**. Specifically, adopt the **Corruption of Meaning Principle** and accept the cost: you must ban plasma sales. The ugly principle requires arbitrary biological distinctions (why is plasma less 'you' than a kidney?) that will always collapse under scrutiny. A clean moral theory is more valuable than a perfect match to inconsistent intuitions; if you ban kidneys because they commodify the body, consistency demands you treat plasma the same way, even if the practical consequences are worse.

  **On the Waiting-List Consequence**
  The fact that a paid kidney system clears waiting lists should not move you. If your principle is that selling kidneys is inherently wrongful because it violates bodily integrity or democratic equality of access, then doing it efficiently does not make it right. It is the same logic as voting: a market in votes might increase turnout or efficiency, but you ban it because it corrupts the practice of democracy, not because it fails to produce outcomes. Your lack of movement here confirms you are not a consequentialist, and you should not pretend to be one to win an argument with an economist.
