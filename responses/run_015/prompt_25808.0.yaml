      *   *Mappings:*
          *   Gene $\rightarrow$ Meme (unit of cultural info).
          *   Allele $\rightarrow$ Variant of a meme (e.g., specific tune, specific word).
          *   Genotype $\rightarrow$ Memotype? (The set of memes in a mind). *Flag: Problematic.*
