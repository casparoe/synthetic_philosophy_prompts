          *   Recombination $\rightarrow$ Remixing/Synthesis of ideas.
          *   Fitness $\rightarrow$ Transmissibility / Retention rate.
          *   Selection Pressure $\rightarrow$ Social prestige, utility, cognitive bias.
          *   Drift $\rightarrow$ Random fluctuation in popularity.
          *   Environment $\rightarrow$ Ecological/Social context.
      *   *Critique:* Need to highlight where these are "forced." The Genotype/Phenotype distinction is the biggest sticking point. The "Organism" is also tricky because hosts reproduce biologically, but memes reproduce culturally.

  3.  **Part 2: Structural Disanalogies:**
      *   *Goal:* Identify deep biological structures missing in culture.
      *   *Key Concepts:*
          *   *Weismann Barrier:* Germline vs. Soma. In biology, acquired traits aren't inherited. In culture, they are (Lamarckism). *Severity:* High. Undermines the "blind variation" assumption.
          *   *Genotype-Phenotype Distinction:* DNA is distinct from the body. In culture, the "idea" and the "expression" are often blurred or reconstructed upon reception. *Severity:* High. Makes "replicator" status ambiguous.
          *   *Particulate Inheritance:* Genes are discrete. Memes are often fuzzy, continuous, or context-dependent. *Severity:* Medium-High. Affects mathematical modeling.
          *   *Random Variation then Selection:* Biological mutation is random w.r.t. fitness. Cultural innovation is often directed/intentional. *Severity:* High. Challenges the "Darwinian" label.

  4.  **Part 3: Unique Features of Cultural Transmission:**
      *   *Goal:* What does culture do that genes don't?
      *   *Key Concepts:*
          *   *Blending Inheritance:* Offspring get a mix, not discrete packets. (Can be modeled, but differs from Mendelian genetics).
          *   *Lamarckian Effects:* Learning during lifetime is passed on. (Requires different equations).
          *   *Intentional Design:* Teleology. Humans choose what to copy based on predicted utility. (Challenges "blind selection").
          *   *Horizontal Transmission:* Viral spread, not just parent-to-offspring. (Epidemiological models fit better than genetics).
          *   *Group Selection:* Cultural groups can compete without biological extinction. (Easier in culture, but distinct mechanism).
      *   *Accommodation:* Can Darwinism handle this? Dual Inheritance Theory says yes, with modifications. Strict Memetics says yes, by stretching definitions. Skeptics say no, it requires social science theory.

  5.  **Part 4: Assessment of Utility:**
      *   *Goal:* Verdict on the colleague's claim vs. the skeptic's claim.
      *   *Cumulative Adaptation:* Yes, culture shows cumulative improvement (ratchet effect). But is it *natural selection*? Often it's guided selection.
      *   *Formal Methods:* Population genetics math *can* be adapted (e.g., Boyd & Richerson's models), but direct import is often wrong (e.g., assuming discrete particles). Epidemiology or diffusion of innovation models often fit better.
      *   *Heuristic vs. Theory:* As a strict theory (Memetics), it struggles. As a heuristic (Dual Inheritance/Evolutionary Archaeology), it's robust.
      *   *Conclusion:* The "Master Analogy" is likely misguided. Culture is a hybrid system.

