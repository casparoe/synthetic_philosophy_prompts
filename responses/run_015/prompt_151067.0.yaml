      *   **Explicit Conditions:** What would change the verdict? (Arguments/findings that would make honoring sunk costs rational or fallacious).
      *   **Self-Critique:** Indicate where the analysis might fail or rely on unstated assumptions.

  2.  **Initial Brainstorming & Categorization:**
      *   The slogan is usually economic/decision-theoretic.
      *   It maps onto the "Sunk Cost Fallacy."
      *   Standard view: Sunk costs are irrelevant to rational choice.
      *   Challenge: Commitments, integrity, identity, signaling, learning.
      *   Readings to distinguish:
          1.  *Causal/Physical:* Past money doesn't cause future money. (Trivial).
          2.  *Decision-Theoretic (Weak):* Maximize expected utility from *now*. (Standard Economics).
          3.  *Normative (Strong):* Past investment *never* generates a reason. (Exclusionary).
          4.  *Psychological/Heuristic:* Don't let loss aversion drive you. (Behavioral Econ).
          5.  *Integrity/Identity:* (The counter-claim). Past commitment creates a duty to self.

  3.  **Drafting the Menu of Readings:**

      *   *Reading 1: The Causal Truism.* Past expenditure cannot physically alter the probabilistic structure of future outcomes.
          *   Application: True for the musician. The 10 years don't guarantee a hit.
          *   Contingency: None really, but ignores normative weight.

      *   *Reading 2: The Decision-Theoretic Maxim (Standard Econ).* Rationality = Maximizing Expected Utility (MEU) from the current node forward. Past costs are excluded from the calculation.
          *   Application: If music has lower EU than the new career, she should quit. Her "identity" feeling is just a preference to be weighed, not a trump card.
          *   Contingency: Depends on whether "identity" is just a preference or a constraint.

      *   *Reading 3: The Strong Normative Exclusion.* Sunk costs *cannot* constitute reasons for action. To treat them as reasons is a category error.
          *   Application: If she stays *because* she spent 10 years, she is irrational.
          *   Contingency: Depends on the theory of reasons (Internalism vs. Externalism, Future-Bias).

      *   *Reading 4: The Psychological Heuristic (Loss Aversion).* The slogan warns against emotional bias (regret aversion), not rational principle.
          *   Application: Is she staying because she hates losing, or because she values consistency?
          *   Contingency: Hard to distinguish internally.

      *   *Reading 5: The Integrity/Identity Exception (The Counter-Claim).* Past commitments generate obligations of integrity.
          *   Application: She stays to honor her self-conception. This *is* a reason.
          *   Contingency: Schechtman, Korsgaard, etc. Is practical identity a source of reasons?

  4.  **Analyzing the Musician Case:**
      *   The crux is: Is "honoring my past commitment" a *future-directed benefit* (feeling good about myself) or a *backward-looking reason* (the past itself matters)?
      *   If it's just about future happiness (avoiding regret), Standard Econ captures it.
      *   If it's about *integrity* (I owe it to my past self), Standard Econ might miss it.

  5.  **Determining "What Would Change the Verdict":**
      *   *To make Sunk Costs Rational:* A theory of diachronic rationality (e.g., Bratman's planning theory) where stability of intention is a value in itself. Or a theory of obligations to past selves.
      *   *To make Musician Fallacious:* A strict hedonistic utilitarianism or a view that personal identity is illusory (Parfit), reducing "identity" to momentary preferences.

  6.  **Identifying Weak Points/Assumptions:**
