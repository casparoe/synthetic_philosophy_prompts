answer: |-
  Right then, pull up a chair. This is a proper good pub question, the sort that starts with Hobsbawm and ends with someone shouting about the EU. You've hit on a really sticky wicket in nationalism studies: the difference between *genesis* (how it started) and *ontology* (what it is now).

  Here's a quick brainstorm before we get to the numbers. Hobsbawm's 'invented traditions' often gets dismissed as just being about the ceremonial fluff—the flags, the anthems, the coronations. But Anderson's 'imagined communities' goes deeper; it's about the cognitive machinery of belonging. Your concept of 'institutional memory drift' is basically a fancy way of describing *reification* or *path dependence*. Once the state prints the maps, teaches the language, and counts the heads, the 'imagined' bit becomes concrete. The question is whether knowing the trick was sleight-of-hand matters once the rabbit is out of the hat. Historians love a origin story, but sociologists care more about current function. By 2050, I reckon the field will be more interdisciplinary, which helps your case, but academics hate declaring anything 'useless'.

  Here's my decomposed credence that your specific hypothesis becomes the dominant view by 2050.

  ### The Decomposition

  **1. Probability modernist accounts (Anderson) remain the baseline for origins: 0.85**
  *Justification:* Despite ethno-symbolist pushback, the link between state-building, print/digital media, and national consciousness is too robust to be fully overturned by 2050.

  **2. Probability 'institutional memory drift' is accepted as a real mechanism: 0.90**
  *Justification:* Institutional theory and state capacity literature already treat bureaucratic categorisation as reality-making; this is basically settled social science.

  **3. Probability historians agree drift makes origins explanatorily moot (vs. supplementary): 0.45**
  *Justification:* Scholars are loath to declare origin stories irrelevant; they'll likely argue initial 'stitching' constrains future path dependence rather than vanishing entirely.

  **4. Probability of historiographical consensus on this specific synthesis by 2050: 0.70**
  *Justification:* Twenty-five years is enough for a paradigm shift, but the humanities are fragmented and rarely unite behind a single 'dominant' view.

  ### The Calculation

  $$0.85 \times 0.90 \times 0.45 \times 0.70 = 0.241$$

  **My total credence: ~24%**

  ### The Weakest Link

  I'm least confident in **Term 3 (Explanatory Mootness)**.

  I gave it the lowest score because 'moot' is a brutal word in academia. Even if institutions sustain the nation, the *shape* of that nation usually depends on the original invention (e.g., why the border is here and not there, why this language is standard). Historians will argue that the initial 'stitching' creates the grooves the water flows down, so the origin never truly stops mattering.

  **Evidence that would move this number:**
  I'd need comparative data on **state collapse versus identity persistence**. If we see nations where the institutions were completely destroyed (war, regime change, border erasure) but the national identity persisted unchanged, that proves the 'drift' isn't enough and origins/ethnicity matter more. Conversely, if identities dissolve rapidly once the census and schools stop, your 'drift' theory wins, and I'd bump that probability up to 0.75 easily.

  So, tell your mates I reckon you're onto something about the institutions, but don't bet the next round on historians admitting origins don't matter—they're too fond of a backstory for that.
