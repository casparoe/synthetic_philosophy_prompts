answer: |-
  Here is the breakdown of the philosophical and historical claims embedded in your meetup argument, evaluated with the requested confidence levels and constraints.

  ### The Menu of Claims
  *Hidden inside "Darwinism isn't falsifiable, so anything built on it isn't science either."*

  **1. The Tautology Claim**
  *   **Content:** "Survival of the fittest" defines fitness retrospectively by survival. Therefore, Natural Selection (NS) is analytically true and empirically empty.
  *   **Verdict:** **Substantive but Historically Contextualized.** Popper definitely held this in the 1950s/60s. He treated the Spencerian phrase as the definition of the theory. However, biologists had already resolved this by defining fitness via specific traits/propensities *prior* to selection.
  *   **Confidence:** 90% (This is standard history of philosophy of biology).
  *   **Relevance to Jealousy:** Low. Even if NS is tautological, specific *models* of selection (e.g., parental investment theory) are not.

  **2. The "No Prohibition" Claim**
  *   **Content:** NS alone forbids no specific outcome. To predict anything, you need auxiliary assumptions (heritability, variation, environmental constraints). Without these, any outcome can be rationalized post-hoc.
  *   **Verdict:** **Substantive and Defensible.** This is the strongest philosophical objection. A theory that predicts everything predicts nothing. Popper's worry was that NS is a universal *framework* that requires specific *models* to become testable.
  *   **Confidence:** 95% (This captures the core logical problem Popper identified).
  *   **Relevance to Jealousy:** High. This is the actual vulnerability of the jealousy hypothesis if it is presented as a "universal" without specifying boundary conditions.

  **3. The Demarcation Claim**
  *   **Content:** Unfalsifiable = Metaphysical = Not Science (and implicitly, not worth serious empirical attention).
  *   **Verdict:** **Partially False / Outdated.** Early Popper (1934) was strict. Later Popper (1970s) acknowledged metaphysical programmes can be rational and fruitful. He distinguished "science" from "meaningless," but allowed metaphysics to guide science.
  *   **Confidence:** 85% (Popper's softening on the *value* of metaphysics is well-documented, even if the demarcation line remained).
  *   **Relevance to Jealousy:** Medium. If the meetup guy thinks "metaphysical" means "ignore it," he is using 1934 Popper, not 1978 Popper.

  **4. The Contagion Claim**
  *   **Content:** If the parent framework (NS) is unfalsifiable/metaphysical, then specific hypotheses built on it (male jealousy) inherit that status and are also unfalsifiable.
  *   **Verdict:** **Probably False.** This is a category error. A general framework can be broad while specific instantiations are precise. Newtonian mechanics is a framework; "this planet will be here at t=1" is a testable claim derived from it.
  *   **Confidence:** 90% (Philosophically unsound reasoning).
  *   **Relevance to Jealousy:** Critical. This is the *only* claim that gets your friend to his desired conclusion. If this claim fails, his argument fails.

  **5. The Recantation Scope Claim**
  *   **Content:** Popper recanted on "Evolution" (Common Descent) but maintained that "Natural Selection" (the mechanism) remained a metaphysical programme.
  *   **Verdict:** **Debatable / Likely False.** The 1978 recantation ("I have changed my mind about the testability... of natural selection") suggests he came to view NS as testable *in principle* when formulated precisely, not just common descent. Your friend's distinction is likely a rationalization to save the critique.
  *   **Confidence:** 75% (Textual memory is fuzzy here, see "Least Sure" section).
  *   **Relevance to Jealousy:** High. If Popper recanted on NS testability, the "unfalsifiable by construction" charge loses its authority.

  **6. The "Just-So Story" Claim**
  *   **Content:** Adaptationist explanations are post-hoc narratives (Gould/Lewontin) rather than predictions. This is distinct from falsifiability but often conflated with it.
  *   **Verdict:** **Substantive and Defensible.** This is a methodological critique, not necessarily a logical one. It charges the *practice* of evo-psych, not the *logic* of NS.
  *   **Confidence:** 95% (This is the standard Gould/Lewontin critique).
  *   **Relevance to Jealousy:** Very High. This is likely the *real* objection your friend has, dressed up in Popperian clothing.

  ---

  ### Verdict on the Meetup Argument

  **Which reading did he most likely mean?**
  He most likely meant a conflation of **Claim 1 (Tautology)** and **Claim 6 (Just-So Story)**, wrapped in the authority of **Claim 3 (Demarcation)**. He used the "Metaphysical Research Programme" label to shut down the conversation, implying that because the *engine* (NS) is arguably broad, the *car* (Jealousy Hypothesis) cannot be driven anywhere specific.

  **Which readings earn him the conclusion?**
  Only **Claim 4 (Contagion)** earns him the conclusion that the *jealousy hypothesis specifically* is unscientific.
  *   **If Claim 4 is false (as I assess):** Then the status of Darwinism is irrelevant to the status of the jealousy hypothesis. The jealousy hypothesis stands or falls on its own operationalization.
  *   **If Claim 2 (No Prohibition) is true:** It damages the jealousy hypothesis *only if* the hypothesis fails to specify the necessary auxiliary assumptions (e.g., "in ancestral environments where paternity uncertainty was X...").

  **What extra commitments are needed to test the Jealousy Hypothesis?**
  To inoculate the hypothesis against the "No Prohibition/Just-So" critique, the proponent must add:
  1.  **Independently Measurable Variables:** You cannot define "jealousy" solely by the behavior you are trying to explain. You need physiological markers (cortisol, heart rate) or psychometric scales validated independently of the evo-psych theory.
  2.  **A Competing Null Model:** You must specify what the data would look like if the *cultural transmission* hypothesis were true. If both NS and Cultural Learning predict the same outcome, the test is weak (Claim 2 violation).
  3.  **Predictive Specificity (not just Universality):** Instead of "all men do this," the claim should be "men in high-paternity-uncertainty environments show *more* of this response than men in low-paternity-uncertainty environments." This introduces the auxiliary assumptions required to make NS falsifiable.
  4.  **Costly Signaling or Trade-off:** A demonstration that the jealousy behavior incurs a cost that would be selected *against* unless it solved the specific adaptive problem. This rules out "spandrel" (by-product) explanations.

  ---

  ### The One Thing I Am Least Sure Of

  **The Precise Scope of Popper's 1978 Recantation regarding Natural Selection.**

  I am 75% confident (as noted in Claim 5) that Popper's recantation covered Natural Selection as a mechanism, not just Common Descent. The quote you found ("I have changed my mind about the testability and logical status of the theory of natural selection") strongly supports this.

  **However,** I am less certain about the *philosophical justification* Popper gave for that change. Did he decide NS was falsifiable *simpliciter*? Or did he decide it was a "metaphysical research programme" that *could* generate falsifiable theories (which he always allowed), and he was merely regretting calling it "unscientific" in a pejorative sense?

  There is a nuanced distinction between:
  1.  "NS is a scientific theory."
  2.  "NS is a metaphysical framework that is rational to use for generating scientific theories."

  Popper's later work often blurred this. If he only meant (2), your friend is technically right that NS *itself* isn't a testable theory, but wrong that this invalidates the specific jealousy hypothesis (which would be the testable theory generated by the framework). If he meant (1), your friend is wrong on the history. My uncertainty lies in whether Popper explicitly upgraded NS to category (1) or just defended category (2) more robustly. Given the quote you provided ("testable scientific theory"), he seems to lean toward (1), but scholars debate whether he was being precise or generous in that interview.

  **Confidence in this uncertainty:** 95% (I am highly confident that this specific textual/philosophical nuance is the weak point in my own reconstruction without access to the primary text *Objective Knowledge* or the 1978 interview transcript).
