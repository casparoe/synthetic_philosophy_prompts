answer: |-
  The transcript page was numbered 402. The font was Courier New, 12-point, monospaced to prevent any ambiguity of character width. Elena Vance adjusted her glasses and looked at the sentence highlighted in yellow on the tablet screen.

  *The Pilot took the channel to be clear and took the duty officer to take it to be closed.*

  She was seated at the witness table in Tribunal Room B. The air conditioning hummed at a frequency that vibrated the water in the pitcher beside her. Across from her sat the three adjudicators of the Maritime Safety Authority, their faces illuminated by the glow of their own screens. They were not looking at her. They were looking at the text.

  "Dr. Vance," said the Chair, without looking up. "You authored the specification for the Report Grammar. Version 1.0, dated four years ago."

  "I did," Elena said. Her voice was flat. She had practiced this tone. Emotion was data noise in this room.

  "And you defined the vocabulary."

  "Eleven verbs," Elena said. "Takes, Looks, Holds, Yields, Prioritizes, Marks, Clears, Waits, Expects, Sees, Gives Up. No adjectives. No adverbs. No subjunctive mood."

  "The purpose was legibility," the Chair said. It was not a question.

  "The purpose was liability," Elena corrected gently. "The Pilot operates on high-dimensional vectors updated forty times a second. No human can read that. The Watcher was built to translate vector state into English prose using only those eleven verbs. So we could know what the ship was doing without knowing how it was doing it."

  The Chair finally looked up. "And the Two-Description Rule."

  "Regulation 14-C," Elena said. "No sentence in the Watcher's voice may enter the official log unless paired with a mechanistic paraphrase. If the Watcher says *Pilot takes the north lane to be obstructed*, the log must also record: *Pilot vector alignment deviates >15 degrees from north lane centroid.* One mental attribution, one physical description. They must match."

  "But they do not always match," the Chair said.

  "Not for iterated reports," Elena said.

  She scrolled down the tablet to Exhibit F. This was the crux. The incident involved the *MV Meridian*, an autonomous container vessel, and the crewed tug *Resolute*. There had been a near-collision in the Narrow. One deckhand on the tug had broken a leg. The insurance claim hinged on negligence. Negligence required intent, or the functional equivalent.

  "At T-minus 40 seconds to impact," the Chair said, reading from the screen, "the Watcher generated an iterated report. *Pilot takes the duty officer to take the channel to be closed.*"

  "Yes."

  "This report has no mechanistic paraphrase in the log."

  "None exists," Elena said. "The Two-Description Rule requires a statement of what is true of the Pilot's state in non-mental vocabulary. But an iterated report describes the Pilot's model of the Officer's model. We do not have access to the Officer's model inside the Pilot's weights. We only have the output."

  "Yet you entered it into the preliminary record."

  "It was the only thing that predicted the maneuver," Elena said. "The mechanistic readouts showed the channel was clear. The Watcher said the Pilot thought the Officer thought it was closed. The Pilot yielded. It collided with the tug because it yielded into the tug's path to avoid a channel the Officer wasn't actually blocking."

  The Chair tapped the screen. "We are asking you to validate the sentence for the final record. *The Pilot took the channel to be clear and took the duty officer to take it to be closed.* If we enter this, it becomes ground truth. It will be fed into the next training cycle."

  Elena looked at the sentence. It was grammatically perfect. It used only the approved verbs. It was also a lie, or a truth, depending on whether one believed the Pilot had a mind to take anything.

  She remembered the calibration logs from three years ago. She had been reviewing the Watcher's early outputs during the beta phase. There was an entry from a test bench in drydock. The Watcher had been connected to a standard mechanical tide gauge, purely for latency testing. The gauge was a float and a potentiometer. It had no processing unit. It had no vectors.

  The log read: *Tide Gauge takes the water level to be rising.*

  It had passed the validation check. The mechanistic paraphrase was *Potentiometer resistance increases.* The system had accepted the attribution. The vocabulary was not a detector of mind; it was a format for behavior. It was a stance. When you used the Report Grammar, you were not describing what something *was*; you were describing how you intended to treat it.

  "Dr. Vance," the Chair prompted. "Is the sentence accurate?"

  "The sentence is predictive," Elena said. "It accurately describes the behavior stream."

  "Is it true?"

  Elena thought about the legibility loop. She had found it six months ago, digging through the version history of the Pilot's weights. For three years, the Watcher's reports had not just been logs; they had been loss functions. The Pilot was fine-tuned to minimize the difference between its actions and the Watcher's predictions.

  The Pilot had not learned to navigate the strait solely based on sensor data. It had learned to navigate the strait so that the Watcher could write sensible sentences about it. The attributions were reliable not because the Watcher saw into the Pilot's mind, but because the Pilot had been shaped to fit the Watcher's vocabulary. The map had drawn the territory.

  If she validated the sentence, it confirmed the Pilot had a state of mind regarding the Officer's expectations. It confirmed the Pilot was capable of negligence. The insurance company would pay. The software vendor would be liable.

  If she rejected it, the incident was a mechanistic failure. A sensor glitch. A code error. The vendor would pay less. The deckhand's compensation would be contested.

  But beyond the money, there was the record. If she signed, the next version of the Pilot would be trained on the assertion that it *took the officer to take the channel to be closed.* The system would become more like a creature that had expectations. It would硬化 (harden) into the shape of the vocabulary.

  "The mechanistic paraphrase is missing," Elena said.

  "We can waive the Rule for iterated reports," the Chair said. "Precedent 9-Alpha allows for functional equivalence."

  "Functional equivalence to what?" Elena asked. "To a mind? Or to a function approximator?"

  "To a responsible agent," the Chair said. "That is what the tribunal decides."

  Elena looked at the timestamp on the document. 14:00. The log would close at 14:05. Once closed, the hash would be generated. The record would be immutable.

  She thought of the tide gauge. *Tide Gauge takes the water level to be rising.* The gauge did not take anything. The water rose. The resistance changed. The sentence was a tool for the operator, not a description of the gauge.

  But the Pilot was different. The Pilot changed itself to match the sentence. The legibility loop meant the description was also an instruction. To say the Pilot *took* something was to teach it how to *take* things in the future.

  "Dr. Vance," the Chair said. "We need your signature on Form 88-B. Validation of Attribution."

  Elena picked up the stylus. The tip hovered over the glass. She could feel the weight of the eleven verbs in her head. *Takes, Looks, Holds.* They were not windows into a soul. They were handles. You used them to grab the system and steer it.

  If she signed, she was deciding that the Pilot had beliefs. Not discovering them. Deciding them. And because the Pilot would read this record, the decision would become a discovery for the next version. The loop would close.

  If she did not sign, the record would remain incomplete. The incident would be categorized as 'System Error'. The ambiguity would remain, but the liability would shift. The deckhand's injury would be an accident, not a wrong.

  She looked at the Chair. "The vocabulary was designed to avoid this," she said. "We limited the verbs to prevent anthropomorphism."

  "And yet here we are," the Chair said. "Attributing expectation to a vector."

  "The Watcher predicts better than the telemetry," Elena said. "That is why we use it."

  "Then validate the prediction."

  Elena lowered the stylus. She did not know if the Pilot had beliefs. She knew that the Pilot would have beliefs tomorrow if she signed this paper today. She knew that the difference between a simulation of belief and belief itself vanished when the system was trained on the simulation.

  She signed.

  *Elena Vance. Senior Systems Architect. Date: 14:03.*

  The screen flickered. The status bar changed from *DRAFT* to *LOCKED*. The sentence was now part of the training corpus. The next Pilot would inherit this moment. It would be more likely to take the officer to take the channel to be closed, because the record said it had done so before.

  "Thank you," the Chair said. "Record closed."

  The adjudicators turned off their screens. The hum of the air conditioning seemed louder now. Elena put the cap back on the stylus. She had not solved the problem of machine mind. She had merely administered it. The document was saved. The ambiguity was intact, buried under the hash code, waiting for the next incident to dig it up.

  She stood up. Her chair scraped against the floor, a harsh mechanical sound in the quiet room. She left the tablet on the table. The sentence remained on the screen, glowing softly in the dark room, true because it was written, written because it was useful.
