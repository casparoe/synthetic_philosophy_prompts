answer: |-
  # Archival Silence: A Decision Tree for Classification

  **Instructions:** Follow the branches below based on how you answer each concrete question. Do not worry about matching a theorist yet; answer based on your intuition about the material. Your path ends at one of eight positions.

  ### Node 1: The Nature of the Blank Space
  **Question:** When you encounter a blank census record or a missing file folder, is this absence a **missing data point** (a container that should be full but isn't), or is it **evidence that the system requires exclusion to function** (constitutive absence)?
  *   **A. Missing Data Point (Container)** → Go to Node 2A
  *   **B. Systemic Exclusion (Constitutive)** → Go to Node 2B

  ### Node 2A: The Cause (If Container)
  **Question:** Is this silence traceable to a specific **exercise of power** (censorship, selective collecting), or is it a **neutral accident** (decay, fire, never-written)?
  *   **A. Exercise of Power** → Go to Node 3A
  *   **B. Neutral Accident** → Go to Node 3B

  ### Node 2B: The Cause (If Constitutive)
  **Question:** Is this structural silence produced by **power relations** (hierarchy, colonialism), or is it **non-power related** (ontological limits, entropy, the unrecordable)?
  *   **A. Power Relations** → Go to Node 3C
  *   **B. Non-Power Related** → Go to Node 3D

  ### Node 3: The Obligation (All Paths)
  **Question:** Is our primary obligation to silent subjects **epistemic** (recover the truth of what happened) or **political** (change how future documentation occurs)?
  *   **A. Epistemic (Recover Truth)** → Go to Node 4
  *   **B. Political (Change Future)** → Go to Node 4

  ### Node 4: The Digital Shift (All Paths)
  **Question:** Does mass digitization **reduce silence** (by increasing access) or **shift its topology** (by creating new forms of exclusion/worsening gaps)?
  *   **A. Reduces Silence** → **LEAF**
  *   **B. Shifts/Worsens Gap** → **LEAF**

  ---

  ## The Eight Positions (Leaves)

  **1. The Old-School Empiricist**
  *   **Path:** Container → Power → Epistemic → Reduces
  *   **View:** Archives are broken containers fixed by labor. Digitization helps us find what power hid.
  *   **Commitment:** Believes truth is recoverable if we just digitize enough suppressed files.

  **2. The Restorative Activist**
  *   **Path:** Container → Power → Political → Reduces
  *   **View:** Archives are weapons used against communities. Digitization is a tool for restitution.
  *   **Commitment:** Treats access as justice; assumes giving people the files changes the power dynamic.

  **3. The Fatalist Historian**
  *   **Path:** Container → Accident → Epistemic → Reduces
  *   **View:** Silence is tragic loss (rot, fire). We save what survives.
  *   **Commitment:** Accepts that most history is gone forever; digitization only saves the lucky scraps.

  **4. Unnamed (The Politicized Accident)**
  *   **Path:** Container → Accident → Political → Shifts
  *   **View:** Even random decay is political if we choose what to digitize.
  *   **Awkward Commitment:** Must argue that ignoring a water-damaged ledger is an act of oppression, not just triage.

  **5. The Foucauldian Critic**
  *   **Path:** Constitutive → Power → Political → Shifts
  *   **View:** Archives produce truth rather than store it. Silence is a tool of governance.
  *   **Commitment:** Recovering "lost voices" reinforces the system that categorized them; we must change the categorization itself.

  **6. The Derrida-Adjacent (Archive Fever)**
  *   **Path:** Constitutive → Power → Epistemic → Shifts
  *   **View:** The drive to recover truth is itself the sickness. The archive destroys what it records.
  *   **Commitment:** Obsessed with the impossibility of total memory; digitization accelerates the destruction of the original context.

  **7. Negative Provenance (Unexplored)**
  *   **Path:** Constitutive → Non-Power → (Any) → Shifts/Worsens
  *   **View:** Absence is built into the structure of recording, but not because of a villain. Digitization makes this structural gap wider.
  *   **Why Unexplored:** It offers no enemy to fight. If silence is ontological (not caused by power) but digitization still worsens it, there is no political lever to pull. It is structural pessimism without a culprit.

  **8. Unnamed (The Ontological Optimist)**
  *   **Path:** Constitutive → Non-Power → (Any) → Reduces
  *   **View:** Even if absence is structural, tech can bridge the gap.
  *   **Awkward Commitment:** Must claim algorithms can recover what was never recorded because of the limits of human language, not just bias.
