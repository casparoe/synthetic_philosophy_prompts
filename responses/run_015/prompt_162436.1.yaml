answer: |-
  ### The Design Space Axes

  Before presenting the tree, here are the five independent axes used to construct it. These are derived from your candidate list, filtered for engineering observability.

  1.  **State Effect:** Does the system read/compute only, or write to external systems of record (production, money, comms)?
  2.  **Goal Persistence:** Is the objective fully specified per invocation (stateless), or does it carry a persistent/underspecified goal across invocations (stateful)?
  3.  **Approval Coupling:** Does every state-changing action require a distinct human approval signal, or is authority pre-delegated?
  4.  **Permission Dynamics:** Are the resource budget and capability set fixed at start, or can the system expand them (spend more, install code, spawn children)?
  5.  **Failure Direction:** If human attention drops to zero mid-execution, does the system default to *halt* (safe) or *continue* (unsafe)?

  ### The Decision Tree

  **Node 1: External State**
  *From the design doc: Does the system write to external systems of record (production databases, financial ledgers, external email/communications)?*
  *   **No (Read/Compute Only):** Go to Node 2.
  *   **Yes (Write/Act):** Go to Node 3.

  **Node 2: Goal Persistence (Read Path)**
  *From the design doc: Does the system maintain state or a goal across invocations (e.g., a long-running research job), or is it a stateless function (e.g., a linter)?*
  *   **Stateless:** **Leaf 1 (Pure Instrument)**.
  *   **Stateful/Persistent:** **Leaf 2 (Fire-and-Forget Job)**.

  **Node 3: Goal Persistence (Write Path)**
  *From the design doc: Is the objective fully specified per invocation (e.g., "merge this PR"), or is it persistent/underspecified (e.g., "keep latency low")?*
  *   **Per-Call Specified:** Go to Node 4.
  *   **Persistent/Underspecified:** Go to Node 5.

  **Node 4: Approval Coupling**
  *From the design doc: Does every state-changing action require a distinct human approval signal (token, click, signature)?*
  *   **Yes (Per-Action Gate):** **Leaf 3 (Gated Tool)**.
  *   **No (Pre-Authorized):** **Leaf 4 (Authorized Script)**.

  **Node 5: Permission Dynamics**
  *From the design doc: Can the system expand its own resource budget or capability set during execution (e.g., install unvetted packages, mint new credentials, spend unallocated money)?*
  *   **Yes (Expandable):** **Leaf 5 (Affordance Expander)**.
  *   **No (Fixed Scope):** Go to Node 6.

  **Node 6: Delegation**
  *From the design doc: Can the system delegate tasks to external entities (spawn sub-agents with independent budgets, or hire humans via API)?*
  *   **Yes:** **Leaf 6 (Recursive Delegator)**.
  *   **No:** Go to Node 7.

  **Node 7: Failure Direction**
  *From the design doc: If the supervising human disconnects or stops monitoring, does the system automatically enter a safe-halt state?*
  *   **Yes (Halt on Inattention):** **Leaf 7 (Supervised Agent)**.
  *   **No (Continue on Inattention):** Go to Node 8.

  **Node 8: Identity Assumption**
  *From the design doc: Does the system act under a specific human principal's identity (e.g., sending email as "John Doe") rather than a service account?*
  *   **Yes (Human Principal):** **Leaf 8 (Principal Proxy)**.
  *   **No (Service Account):** Go to Node 9.

  **Node 9: Recoverability**
  *From the design doc: If the system runs unchecked for one hour, is the damage technically and commercially recoverable within RTO/SLA?*
  *   **Yes (Recoverable):** **Leaf 9 (Wide-Authority Agent, Corrigible)**.
  *   **No (Irreversible/Critical):** **Leaf 10 (Wide-Authority Agent, Critical)**.

  ---

  ### The Leaves

  | Leaf | Name | Awkward Commitment | Engineering Consequence |
  | :--- | :--- | :--- | :--- |
  | **1** | **Pure Instrument** | We commit that this system *cannot* change state, even by accident. | No threat model beyond data leakage; no kill switch required; lint-style review only. |
  | **2** | **Fire-and-Forget Job** | We commit that "no side effects" holds even if the job runs for days (e.g., report generation). | Audit log of input/output required; resource quota enforcement; no credentials to write systems. |
  | **3** | **Gated Tool** | We commit that the human gate cannot be bypassed by retry logic or batching. | Identity of approver logged per action; system cannot hold write credentials, only "propose" credentials. |
  | **4** | **Authorized Script** | We commit that the tool/agent distinction is marketing; only the API scope matters. | **Deflationary:** Governance is purely the Auth Matrix; no "agent" review required; treat as privileged service account. |
  | **5** | **Affordance Expander** | We commit that the system's security boundary moves as it installs code or mints creds. | **High Security:** Sandbox required; package allow-listing; dynamic credential rotation; sign-off by Security Lead. |
  | **6** | **Recursive Delegator** | We commit that we can audit entities we did not directly spawn or hire. | Contractual liability for downstream agents; budget caps per child; termination propagation mechanism. |
  | **7** | **Supervised Agent** | We commit that "supervision" is a technical heartbeat, not a managerial expectation. | Watchdog timer required; automatic rollback on heartbeat loss; human must be "in-the-loop" not "on-the-loop". |
  | **8** | **Principal Proxy** | We commit that the human principal accepts liability for the agent's mistakes as if they did them. | Legal/HR review required; explicit user consent flow; audit trail tied to principal's identity, not service ID. |
  | **9** | **Wide-Authority (Corrigible)** | We commit that interruptibility compensates for the lack of a safe-halt default. | **Kill Switch:** Global interrupt signal required; reversible actions only; post-hoc audit mandatory. |
  | **10** | **Wide-Authority (Critical)** | We commit that we can predict all failure modes of an unchecked autonomous system. | **Highest Security:** Formal verification or equivalent; named liability owner; manual sign-off gate for deployment. |

  ---

  ### Analysis of the Space

  #### Unoccupied Combinations
  Three regions of this design space are logically possible but empirically unoccupied in engineering practice. Their absence is diagnostic:

  1.  **Write + Per-Call + Pre-Auth + No Loop (The "God Script"):** A system that writes to prod with pre-authorized credentials but has no loop and isn't gated.
      *   *Diagnosis:* **Unattractive.** Security policies generally forbid un-gated write access unless it's a pipeline (which implies a loop) or a human (which implies a gate). This is the "rm -rf /" risk profile.
  2.  **Persistent Goal + Per-Action Gate (The "Micro-Managed Agent"):** A system that carries a goal across invocations but asks for permission for every step.
      *   *Diagnosis:* **Incoherent.** If a human must approve every step, the system's persistence provides no efficiency gain. It collapses into a Gated Tool (Leaf 3) or a human workflow.
  3.  **Expandable Permissions + Safe-Halt Default (The "Contained Bomb"):** A system that can install code or spawn agents but halts immediately if watched.
      *   *Diagnosis:* **Unexplored/Unstable.** If it can expand permissions, the *state* of the system persists even if the process halts (e.g., installed packages remain). A process halt does not revoke affordances. This combination is a security illusion.

  #### Indistinguishable Leaves
  The tree cannot cleanly separate **Leaf 7 (Supervised Agent)** and **Leaf 9 (Wide-Authority, Corrigible)** in all cases.
  *   *Reason:* Both rely on human intervention to prevent damage. Leaf 7 defaults to *halt* (passive safety), while Leaf 9 defaults to *continue* but promises *interruptibility* (active safety). In practice, if the "heartbeat" in Leaf 7 is long (e.g., 1 hour), it behaves like Leaf 9.
  *   *Guidance:* If the "halt" state leaves the system in a partially applied, inconsistent state, treat it as Leaf 9. If "halt" means "revert to start," it is Leaf 7.

  #### The Single Cut
  The cut doing the most work is **Node 7: Failure Direction** (Halt on Inattention vs. Continue).
  *   *Why:* This is the "deepest cut" you suspected. It separates systems that *require* human attention to be safe (Agents) from systems that are safe *unless* human attention is applied to drive them (Tools/Scripts).
  *   *Governance Impact:* This node determines whether you need a **Watchdog** (Leaf 7) or a **Kill Switch** (Leaf 9/10). The former is an availability requirement; the latter is a safety requirement. Confusing them is the source of your team's friction.

  #### Binary, Spectrum, or Axes?
  The Tool/Agent distinction is **two axes that your team is conflating.**
  1.  **Authority Axis:** (Gated vs. Pre-Auth). This is about *permission*.
  2.  **Persistence Axis:** (Per-Call vs. Persistent Goal). This is about *state*.

  "Agent" is being used to describe the top-right quadrant (Persistent + Pre-Auth). "Tool" is being used for the bottom-left (Per-Call + Gated). The friction arises because Marketing calls anything with a loop an "Agent" (Persistence), while Security calls anything with credentials an "Agent" (Authority).
  *   **Verdict:** Stop using the words "Tool" and "Agent" in design reviews. Use the Leaf Names. They map directly to the governance controls you need. A "Principal Proxy" requires HR review; a "Fire-and-Forget Job" does not. The label dictates the process.
