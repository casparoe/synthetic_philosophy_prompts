  A civilization might burn its history in a flash,
  Radiating power until the source is stripped bare,
  A lighthouse beam exhausting the bulb in a century,
  Visible across the spiral arm for a blink of an eye,
  Then gone, leaving only the cold math of its passing.

  Or stretch energy thin over epochs,
  A whisper dragged out until it is background,
  Too faint to trigger alarms of distant dishes,
  Persisting where the flare would have faded,
  Leaking information into vacuum,
  Safe, enduring, and invisible to us.

  We scan for the spike, the anomaly,
  Budget fixed, currency is noticeability,
  Cannot buy both duration and intensity,
  If sum is bounded by physics,
  We miss long quiet songs of survivors,
  Short loud screams have already finished,
  Hearing the echo of a choice.

  Watts poured outward not kept for later,
  Years kept quiet lost to neighbors,
  Gambling on strategy with telescopes,
  Hoping they chose flare not slow burn,
  Hoping they shout while we listen,
  Chance thins as timeline thickens,
  Snapshot captures only what is bright, brief,
  Biasing census toward those that die.

  Nothing forces the trade to be real, strictly speaking,
  They could expand,
  They could grow loud enough to fill the sphere,
  They could last forever,
  They could do both without breaking,
  Yet the sky remains dark to our instruments,
  So we wonder about the cost,
  Is it true absence,
  Or just a different allocation.
