answer: |-
  Here is a precise principle that organizes your intuitions, resolves the tension between Case 4 and Case 5, and offers a prediction on your final query.

  ### The Principle: The Counterfactual Cost Criterion

  **Definition:** A cultural value is a genuine cause of a social outcome if and only if the *specific content* of that value compels agents to incur a **net material cost** or **forgo a material benefit** that they would otherwise pursue given the prevailing economic incentives.

  To pass the test, you must be able to construct a counterfactual: *If these agents held different values but faced the exact same material incentives, would the outcome change?* If the outcome remains the same (because the behavior was already materially optimal), the culture is epiphenomenal (a label or rationalization). If the outcome changes (because the value vetoed a materially optimal choice), the culture is causal.

  ### Applying the Principle to Your Cases

  *   **Case 1 (Puritan Merchants): PASS (Theoretically).**
      *   *Incentive:* Consume luxury (utility) or reinvest (future profit).
      *   *Constraint:* Asceticism vetoes consumption *even when affordable*.
      *   *Result:* Forced reinvestment. Without the value, capital disperses into consumption.
  *   **Case 2 (Japanese Manufacturing): FAIL.**
      *   *Incentive:* High quality leads to market share and profit.
      *   *Constraint:* None. "Culture" aligns with material self-interest.
      *   *Result:* A firm with cynical mercenaries but the same supply chain incentives produces the same quality. The "culture" is descriptive, not causal.
  *   **Case 3 (Aristocratic Dueling): PASS.**
      *   *Incentive:* Stay alive (highest biological material good).
      *   *Constraint:* Honor vetoes survival.
      *   *Result:* Death. Without the value, the rational actor declines the duel.
  *   **Case 4 (Nordic Welfare): FAIL.**
      *   *Incentive:* Voters want security/insurance; Labor parties want power.
      *   *Constraint:* None. Egalitarian norms *align* with the material interests of the majority coalition.
      *   *Result:* The welfare state is built on coalitional math. The "egalitarian culture" is the post-hoc story told to stabilize the institution, not the engine that built it.
  *   **Case 5 (Religious Conversion): PASS.**
      *   *Incentive:* Maintain existing kin networks and property customs (low transaction costs).
      *   *Constraint:* New religious rules (e.g., endogamy, tithing, breaking ancestral ties) impose immediate social and material costs.
      *   *Result:* Institutions reorganize *against* the previous equilibrium.

  ### Resolving Your Pattern Conflict (Case 4 vs. Case 5)

  Your tentative pattern was that values only cause outcomes at a "small scale" (direct behavioral inhibition). **Case 5 broke this** because it involves large-scale institutional reorganization.

  The **Counterfactual Cost Criterion** saves Case 5 by rejecting the "scale" requirement. It argues that scale is irrelevant; **costliness** is the key.
  *   **Case 4 fails** not because it is large-scale, but because the values *tracked* material interests (Labor parties built welfare because it helped their voters, not because they loved equality abstractly).
  *   **Case 5 succeeds** because religious conversion often demands *costly signals* (sacrificing kin ties, wealth, or time) that reorganize institutions in ways pure material calculation would not dictate.

  ### The Case The Principle Cannot Save: Case 1

  While the principle *theoretically* validates your intuition on Case 1, it cannot save it **empirically**. This is the heart of your "just-so story" anxiety.

  Historically, it is fiercely debated whether Protestant merchants actually reinvested *more* than Catholic merchants in the same regions. If Catholic merchants also accumulated capital (using different rationalizations, like dynastic building), then the "Protestant Ethic" was not the *cause* of accumulation, but merely one of several cultural coats painted over a broader shift in economic technology.

  The Counterfactual Cost Criterion requires you to prove that *without* asceticism, the capital would have been consumed. Given that Catholic capitalism existed (e.g., in Flanders and Northern Italy prior to the Reformation), Case 1 is the most vulnerable to collapsing into a just-so story. The principle saves the *logic*, but history may not support the *fact*.

  ### Prediction: Corporate "Psychological Safety"

  **Verdict:** This is **Case 2 (Management Technique in Cultural Clothing).**

  **Reasoning:**
  1.  **Alignment with Incentives:** "Psychological safety" is introduced to reduce error-reporting friction, increase innovation, and retain talent. These are direct material benefits to the firm.
  2.  **No Costly Constraint:** It does not ask employees to forgo a material benefit or incur a cost against their interest. It asks them to speak up, which (in a well-functioning system) improves their standing and the firm's output.
  3.  **Counterfactual:** If you removed the "culture" talk but kept the incentives (bonuses for innovation, no punishment for errors), the metrics would likely shift the same way.

  **Prediction:** The "culture" label is a implementation tool to lower the transaction costs of management, not a causal value overriding material incentives. When the metrics stop shifting (i.e., when the material payoff becomes unclear), the "culture" will evaporate rapidly, unlike the Puritan or Dueling codes which persisted despite high costs.

  ### Summary
  *   **Principle:** The Counterfactual Cost Criterion (Values must veto material self-interest to be causal).
  *   **Resolution:** Scale doesn't matter; costliness does. This explains why Nordic Welfare (interest alignment) is different from Religious Conversion (interest override).
  *   **Weak Link:** Case 1 (Weber) is logically sound but historically fragile.
  *   **Psych Safety:** It is an instrumental management technique (Case 2), not a genuine cultural cause.
