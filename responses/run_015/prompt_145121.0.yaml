      Better argument for Consequentialist: The *marginal* utility of firing vs. suspending is zero. Suspension signals the rule. Firing adds cost (recruitment) without adding signal strength. (Wait, constraint: "no... harm to innocent third parties... or service collapsing"). Recruitment cost might be seen as third party harm (shareholders).
      Okay, simpler Consequentialist logic: The sanction's severity is justified by its ability to prevent future violations. A suspension creates a public record and a financial sting for 99% of staff. Firing adds no *additional* deterrent signal to the group (the line is drawn at suspension), so the extra severity is wasteful excess.
      This avoids "he's useful" and "third party harm." It's about diminishing returns on deterrence.

