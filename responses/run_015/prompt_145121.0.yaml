answer: |-
  Marcus, a senior project manager, knowingly bypassed a mandatory safety audit to meet a deadline, a culpable violation of firm policy that risked severe harm though none occurred. The standard sanction for this infraction is a two-week unpaid suspension, a penalty known to deter the salaried staff effectively. Marcus, however, is independently wealthy and finds the prospect of forced leisure pleasant; the firm knows the financial loss is negligible to him and that he feels no sting from the suspension, though his colleagues remain unaware of his insulation.

  **Recommendations and Reasoning**
  The **Retributivist** demands termination. On this view, punishment must inflict a burden proportional to the moral gravity of the offense; since the standard suspension imposes no actual deprivation or "pain" on Marcus due to his unique resilience, it fails to satisfy the debt of justice owed by *him* specifically. To match his culpability with equivalent suffering, the sanction must be escalated until it actually costs him something commensurate with the wrong. The **Consequentialist** recommends the standard suspension. Since the goal is general deterrence and norm reinforcement, the suspension successfully signals to the rest of the workforce that violations carry costs; escalating to termination yields no additional deterrent benefit for the group (the line is already drawn) and constitutes wasteful excess without increasing overall social utility.

  **The Single Feature**
  The offender's **idiosyncratic subjective resilience** to the standard sanction (his wealth and attitude render the penalty costless to him).

  **The Collapse**
  If Marcus were an average employee for whom the unpaid suspension represented a significant financial hardship and social shame, both theories would converge on the standard suspension. The Retributivist would be satisfied because the objective penalty now translates to proportional subjective burden, and the Consequentialist would be satisfied because the deterrent value remains maximized without unnecessary escalation.

  **Strongest Retributivist Objection**
  A retributivist can object that desert must be measured by **objective deprivation** (loss of liberty, income, or status) rather than **subjective suffering**. If punishment is scaled to individual sensitivity, two offenders committing the same crime receive different sanctions based on their psychological or financial constitution, violating the principle of equality before the law. By this metric, Marcus received the same "amount" of punishment (10 days pay, 10 days liberty) as anyone else, so termination is unjustified excess.

  **Evaluation**
  This objection **works** to neutralize the divergence, but only by redefining the retributive currency. It forces the retributivist to abandon the intuition that punishment is essentially about "paying a debt" through suffering, accepting instead that it is a formal transaction of rights. If the retributivist holds that justice requires the offender to *feel* the weight of the wrong, the objection fails; if they hold that justice requires the offender to *lose* the equivalent value, the objection succeeds and the theories realign.
