  The most robust principle classifies an environment as epistemically bad when its filtering rules decouple belief revision from actual evidence reliability or erode the agent's capacity to assess sources, though this requires sacrificing the intuition that Case #6 is fine if the outside commentary is objectively trustworthy.

  **The Principle: Epistemic Reliability and Agency**
  An information environment is epistemically defective to the degree that it:
  1.  **Filters by Identity/Ideology rather than Track Record:** Exclusion is bad if based on *who* is speaking rather than *what evidence* they have produced, unless there is independent proof that the identity correlates with unreliability. (Motivated by #1 vs. #5/#6).
  2.  **Immunizes Against Revision:** Exclusion is bad if it treats counter-evidence as proof of the exclusionary doctrine itself (self-sealing). (Motivated by #3 vs. #4).
  3.  **Atrophies Evaluative Capacity:** Environments are bad if they remove the agent's ability to independently verify claims or choose to engage with nothing at all. (Motivated by #7 and the AI case).

  **Verdicts on Your Cases**
  *   **#1 (Scientist):** Passes. Filtering by track record (peer review) satisfies Clause 1.
  *   **#2 (Survivors):** Passes. The goal is support, not truth-seeking; Clause 1 allows filtering if the "outside" is irrelevant to the specific epistemic goal (comfort/safety).
  *   **#3 (Family):** Fails Clause 1. Filtering by voting record is identity-based, not reliability-based. Verdict: Bad (matches your "mildly bad").
  *   **#4 (Conspiracy):** Fails Clause 2. Self-sealing doctrine. Verdict: Very Bad (matches your intuition).
  *   **#5 (Religious):** Fails Clause 1 (conditionally). If "worldliness" is not a reliable marker of falsehood, this is bad.
  *   **#6 (Marginalized):** **The Sacrifice.** This principle verdicts #6 identically to #5 *unless* you can demonstrate that outside commentary is actually unreliable for that group. If the outside sources are trustworthy but merely harmful, this principle calls the environment epistemically bad, contradicting your intuition that it is "fine." To save your intuition, you must argue that systemic bias makes those outside sources objectively less reliable for this group (a claim supported by standpoint epistemology but contested by liberal epistemology).
  *   **#7 (Disengagement):** Fails Clause 3. Total disengagement atrophies capacity. Verdict: Epistemically defective (though distinct from forming false beliefs).
  *   **AI Assistant:** Fails Clause 1 and 3. Weighting by engagement decouples from reliability (popularity ≠ truth), and outsourcing filtering atrophies capacity. Verdict: Bad (resolves your flip-flop).

  **Verdicts on Unlisted Cases**
  *   **Scientist blocking cranks:** Fine. Blocking those with poor track records satisfies Clause 1.
  *   **Purely Algorithmic Feed:** Bad. Fails Clause 1 (optimizes for engagement/retention, not truth) and Clause 3 (opaque filtering prevents independent assessment).

  **Settled vs. Live Disputes**
  *   **Settled:** The distinction between *epistemic bubbles* (lack of exposure, fixable by adding sources) and *echo chambers* (active undermining of outside sources, fixable only by restoring trust) is widely accepted in social epistemology (e.g., C. Thi Nguyen). This supports the distinction between your Case #3 and Case #4.
  *   **Live Dispute:** Whether "epistemic partiality" (favoring your group's sources) is ever justified. Liberal epistemologists argue Clause 1 should always apply universally; Standpoint Epistemologists argue that for marginalized groups, outside sources are structurally unreliable, making Case #6 compliant with Clause 1. Your intuition on #5 vs. #6 relies on this disputed claim.
  *   **Live Dispute:** Whether total disengagement (#7) is an epistemic vice. Veritists argue no false beliefs = no harm; Virtue Epistemologists argue failing to exercise inquiry is itself a defect. My principle sides with Virtue Epistemology.
