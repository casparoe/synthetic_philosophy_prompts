      *   **Topic:** The Knobe Effect (Side-Effect Effect).
      *   **Goal:** A *diagnosis* of why the literature seems stuck/stalled, not a survey.
      *   **User's Understanding:** Summarizes the main competing accounts (Concept Penetration, Construal/Trade-off, Pragmatic/Blame, Individual Differences, Normative/Descriptive Hybrid). Notes that no account has retired the others.
      *   **User's Contribution:** Ran an internal experiment at work.
          *   *Condition A (Team):* Replicates Knobe asymmetry.
          *   *Condition B (System):* Intentionality ascription collapses (low for both), but Blame asymmetry remains.
      *   **User's Hypothesis:** "Overloading error." Intentionality ascription is an API endpoint typed for *persons* (accountability verdict). When passed a *system*, it throws (no intentionality), but blame is routed differently. The dispute is stalled because camps are talking past each other (documenting behavior vs. arguing documentation vs. arguing purpose).
      *   **Specific Questions:**
          1.  What kind of disagreement is this? (Verbal, Substantive/Empirical, Data/Competence, or Two Questions?)
