  # Joint Adversarial-Collab Statement on the Special Composition Question

  **Parties:** The Strong Universalists vs. The Cohesion-Gradualists  
  **Date:** October 2023  
  **Status:** Draft for Mutual Review

  Look, we've been arguing about the Special Composition Question (SCQ) for a while now. Usually, this ends with everyone digging in harder. But we realized we actually share a lot of methodological ground, even if our ontological pictures look different. We want to stop talking past each other and pin down exactly where the split happens.

  Below is what we agree on, where we diverge, and the specific test cases we think will settle (or at least clarify) the dispute.

  ### 1. Agreed Claims
  *Both camps sign off on the following numbered statements.*

  1.  **The Formal Problem:** We agree the core question is: "Under what conditions do some things compose a whole?" We are not debating language usage (we know ordinary people say "table" and not "table-plus-moon"); we are debating what actually exists in the world.
  2.  **No Magical Glue:** Both sides reject the idea that composition requires a primitive, unanalyzable "bonding" relation. We don't want metaphysics that relies on mysterious forces that kick in only when parts get close enough. If composition happens, it should be explainable via facts about the parts and their relations.
  3.  **Ontological Parsimony:** We both want to avoid unnecessary bloat. We just disagree on what counts as "unnecessary." (Universalists worry about restricting quantifiers arbitrarily; Gradualists worry about populating the world with arbitrary, gerrymandered objects.)
  4.  **Formal Mereology Isn't Enough:** We agree that Classical Extensional Mereology (CEM) is a useful logical tool, but it doesn't solve the metaphysical debate. You can model either view using formal systems; the dispute is about what those models represent in reality.
  5.  **Causal Integration Matters:** Even the Universalists agree that causal/spatiotemporal integration is what makes an object *useful* or *salient*. We just disagree on whether that integration determines *existence* itself.

  ### 2. Disagreements Table
  *Here is the precise wording each camp accepts for its own view, and where we think the other side goes wrong.*

  | Issue | Strong Universalist Stance | Cohesion-Gradualist Stance | The Exact Divergence |
  | :--- | :--- | :--- | :--- |
  | **Nature of Composition** | Composition is **binary**. Either the parts compose an object, or they don't. There is no middle ground. | Composition is **gradable**. Objects have "mereological density" based on causal/spatiotemporal integration. | Is "being a whole" a switch (on/off) or a dial (0 to 1)? |
  | **Scattered Objects** | A scattered pair of shoes composes an object **fully**. Its existence is ontologically equal to a living cat. | A scattered pair of shoes composes an object **weakly** (near-zero density). It exists, but not in the same robust way as a cat. | Do scattered composites have the same ontological weight as cohesive ones? |
  | **Truth Conditions** | "There exists a table-plus-moon" is **literally true**. The difference between it and a table is pragmatic, not metaphysical. | "There exists a table-plus-moon" is **degenerate**. It has such low density it borders on fiction, though not strictly zero. | Is the difference between a table and a table-plus-moon one of *kind* or *degree*? |
  | **Restriction** | Any attempt to restrict composition introduces arbitrariness (the "sharp line" problem). | Any attempt to make composition binary introduces arbitrariness. Reality is fuzzy; our logic should match. | Which arbitrariness is worse: positing too many objects or forcing a binary structure on a gradient world? |

  ### 3. The Cruxes
  *We identified two main sticking points. For each, we agreed on a concrete case to test our predictions. We're recording our verdicts in advance so we can't move the goalposts later.*

  #### Crux A: Is Being-a-Whole Binary or Gradable?
  *The Question:* Can an object slowly cease to be a whole, or does it snap out of existence at a specific threshold?

  **The Test Case: The Decaying Organism**
  *Scenario:* A complex organism is poisoned. Over six months, its causal integration slowly degrades. Cells die, systems fail, cohesion drops. At month 6, it is dust.
  *   **Universalist Verdict:** The object exists at Month 1, Month 3, and Month 6. At Month 6, it is just a "collection of dust particles" that still composes an object. There is no point where it stops composing something; it just changes properties. The term "organism" stops applying, but the *object* remains.
  *   **Gradualist Verdict:** The object's mereological density decreases continuously. At Month 1, density is high (≈1.0). At Month 3, it's lower (≈0.5). At Month 6, it's near zero. There is no single moment it vanishes, but its status as a "whole" fades out. It doesn't snap; it dissolves.

  #### Crux B: Status of Near-Zero Composites
  *The Question:* Do composites with almost no causal integration have real metaphysical status, or are they just useful fictions we treat as real?

  **The Test Case: Instant Vaporization**
  *Scenario:* An organism is instantly vaporized by a laser. The particles are scattered across a room but remain physically present.
  *   **Universalist Verdict:** The parts still compose an object instantly after vaporization. The "vaporized-object" exists just as much as the "living-organism" did a second ago. The composition relation is unrestricted; the change in causal structure doesn't affect existence, only classification.
  *   **Gradualist Verdict:** The mereological density drops precipitously but remains non-zero. The "vaporized-object" is a real composite, but it has extremely low density. It is not a fiction, but it is metaphysically lightweight compared to the organism. It is not *nothing*, but it is hardly a *thing* in the robust sense.

  ### 4. Next Steps
  We agree that the "Decaying Organism" case is the best battleground. If the Universalists can explain why there's no metaphysical difference between a living cat and a pile of cat-dust without sounding like they're ignoring physics, and if the Gradualists can explain how "degrees of existence" work without collapsing into fuzzy logic nonsense, we might get somewhere.

  Until then, we agree to disagree—but politely, and without accusing each other of believing in magic glue.

  **Signed,**  
  *The Universalist Camp* & *The Cohesion-Gradualist Camp*
