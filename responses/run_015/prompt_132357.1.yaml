      *   *Is the colleague totally wrong?* Well, effective altruism has a point about prioritization. I should acknowledge that *maximizing* impact is a valid goal, but *demanding* maximum impact as a condition for *any* worth is the error.
      *   *Biology Analogy:* Since the user is a biologist, use an ecological analogy. A single pollinator matters even if the hive is threatened.

  8.  **Final Polish:** (Reviewing against the prompt's specific phrasing).
