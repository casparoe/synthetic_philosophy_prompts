answer: |-
  ### The Toast

  Good evening. For those who don't know me, I'm [Your Name]. I'm [Mother's Name]'s daughter, and I'm also a student of philosophy. That means I spend a lot of time thinking about rules, and duties, and the precise boundaries of what we owe each other.

  I mention that because, for thirty-one years, my mother worked in a place where those boundaries were very blurry. Officially, the shelter was open eight to eight. Unofficially, it was open whenever someone showed up who needed a bed. And for most of those years, if someone showed up at nine, or two in the morning, my mother was the one who opened the door.

  Now, if I were giving a lecture, I might try to categorize that. I might try to draw a clean line between what was required by her job description and what was extra. But standing here, looking at this room, that project seems impossible. And that is exactly her point.

  I spend my days studying the boundary between what is owed and what is given. My mother never saw the difference.

  To the staff, past and present: You know better than anyone that this work is not a solo act. You know the late nights, the impossible caseloads, the juggling of second jobs and childcare. My mother didn't do what she did because she expected you to do the same. She did it because she had a specific kind of stamina, and a specific refusal to let a policy manual override a human need. She didn't set a standard to judge you; she set a pace to keep the lights on. We are grateful for your endurance, and we are grateful that she could be the one to absorb the shock when the system rattled.

  To the guests who have stayed at the shelter, and who are here tonight: Thank you for trusting her with your safety. She always said that a shelter isn't a service provider; it's a home. And a home doesn't lock the door just because the clock says it's closing time. You taught her that dignity isn't something you give people; it's something you recognize in them.

  To the Board and our donors: Thank you for funding this dinner, and for funding the work. You made her career possible. But I know my mother well enough to know her wish for you. She would say that the ultimate success of this shelter isn't that it finds enough heroes to run it, but that it becomes unnecessary. Until then, thank you for ensuring that when the need arises, the resources are there to meet it, so that the person behind the desk doesn't have to become the resource themselves.

  And to my mother: I want to rescue you from the idea that you are only this job. You are not just the Director. You are the person who grew prize-winning pumpkins in the allotment. You are the banjo player who kept time in a bluegrass band for a decade. You are the woman whose puns are so atrocious they actually stop conversations dead.

  If I praised you only for your sacrifice, I would be ignoring the life you kept alive alongside the work. You didn't give up your life to save others; you brought your life into the room with you. You brought the music, and the humor, and the stubborn belief that people matter more than schedules.

  So, I am not going to thank you for sacrificing your Christmases. I am going to thank you for showing us that care isn't a transaction. It's a presence.

  Please raise your glasses. To [Mother's Name]. May your retirement be long, your pumpkins be large, and your puns remain terrible.

  ***

  ### Notes on Philosophical Commitments and Risks

  **1. The Dissolution of the Supererogatory/Obligatory Distinction**
  The toast avoids the trap of labeling her actions as either "above and beyond" (supererogatory) or "strictly required" (obligatory). Instead, it adopts a **phenomenological stance**: it claims that *she* did not experience the distinction ("My mother never saw the difference").
  *   **Commitment:** This leans on the idea that moral categories are descriptive of experience, not just metaphysical truths about acts. It suggests that for a virtuous agent, the question "Did I have to do this?" is less salient than "Does this need doing?"
  *   **Risk:** If the distinction is objective regardless of her perception, this line is factually false. If her actions *were* supererogatory, saying she didn't see the difference might obscure the fact that she was exploited.
  *   **Alternative:** If I become convinced that acknowledging the exploitation is more important than honoring her perspective, I would change the line to: *"I study the boundary between what is owed and what is given. My mother lived in the space where that boundary failed."* This indicts the system more directly but risks making the toast too political for a dinner.

  **2. The "Supervisor Line"**
  *"I spend my days studying the boundary between what is owed and what is given. My mother never saw the difference."*
  *   **Commitment:** This is the nod to the supervisor. It references the debate over whether supererogation is a distinct category or if "duty" expands to meet need (the "saintly obligation" problem). It implies a critique of the Kantian rigid separation of duty and inclination.
  *   **Least Confident Element:** It risks sounding like I'm saying she was unthinking.
  *   **Alternative:** If the concern is that this makes her sound unreflective, I would replace it with: *"I study why we do the right thing. My mother just did it."* This is less technical but retains the action/theory split.

  **3. Role Duties and the Successor Problem**
  The toast explicitly addresses the staff to clarify that her stamina was *specific to her*, not a universal expectation ("She didn't set a standard to judge you").
  *   **Commitment:** This rejects the idea that role duties automatically expand to fill the capacity of the role-holder. It argues for a "reasonable person" standard in job descriptions, not a "maximum capacity" standard.
  *   **Risk:** If the philosophical view is that professional roles *do* require maximizing welfare (a strong utilitarian view of professional ethics), then praising her for not expecting this of others is actually criticizing her professional rigor.
  *   **Alternative:** If I accept the strong utilitarian view, I would have to frame her restraint as a failure to maximize, which is untenable for a toast. Instead, I would lean harder on the *institutional* failure: *"The system relied on her capacity. That was a risk we took, and one we must not take again."*

  **4. The Institutional Critique vs. Individual Virtue**
  The toast thanks the donors but includes the mother's wish that the shelter become "unnecessary."
  *   **Commitment:** This navigates the "virtue as a trap" critique. It acknowledges her virtue without endorsing the system that required it. It treats her virtue as a stopgap, not a solution.
  *   **Risk:** If the institutional critique is total (i.e., individual virtue is *always* a tool of neoliberal outsourcing), then praising her at all is complicit.
  *   **Alternative:** If I decide the vocabulary of individual virtue is irredeemable here, I would shift the praise entirely to the *collective*: *"To the community she built, which kept people safe when the structures failed."* This removes her from the pedestal but might feel too impersonal for a daughter.

  **5. The "Cost" Condition of Supererogation**
  Standard definitions often require supererogatory acts to involve significant cost or sacrifice to the agent. The toast mentions her missed Christmases but reframes them as "presence" rather than "sacrifice."
  *   **Commitment:** This challenges the idea that moral worth requires suffering. It suggests her work was integrated into her life (bluegrass, pumpkins) rather than subtracting from it.
  *   **Risk:** If true supererogation *requires* net cost, and I claim she didn't sacrifice her life, I might be denying the moral weight of her achievement.
  *   **Alternative:** If the cost condition is non-negotiable, I would acknowledge the cost directly but contextualize it: *"Yes, there were Christmases missed. But there were also lives held together. She weighed that cost, and she paid it willingly."* This restores the "sacrifice" element but risks the "moral saint" caricature I'm trying to avoid.

  **Summary of Fragility**
  The toast is most fragile on the line about her not seeing the difference between owed and given. If she *did* see it and felt resentful, or if she saw it and felt coerced, the line romanticizes her oppression. However, given the prompt's description of her line ("the scandal is that the job exists"), she seems to view the *need* as primary, making the "no difference" claim a faithful representation of her worldview, even if it's philosophically contentious.
