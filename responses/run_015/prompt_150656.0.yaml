      *   **Constraints:**
          *   4-5 minutes spoken (approx. 600-750 words).
          *   Affectionate, not scolding (even toward the board/donors).
          *   No technical jargon (no "supererogatory," "obligatory," etc.), *except* one subtle line for the supervisor.
          *   Avoid false praise (don't imply the extra was optional/charity).
          *   Avoid implying the job *required* the burnout (don't set impossible standards for successors).
          *   Avoid reducing her to a moral saint (include her humanity: allotment, puns, bluegrass).
          *   Avoid implying others are blameworthy for doing less.
          *   Goal: Present her as a specific person, not a case study.
      *   **Deliverables:**
          1.  The Toast.
          2.  A page of notes (philosophical commitments, potential failures, contingencies).

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Trap:* If I say she did "more than enough," I validate the system's failure (donors/board off the hook). If I say she did "only what was needed," I normalize exploitation (staff off the hook? No, staff feel pressured).
      *   *The Solution:* Shift the frame from *quantity of duty* to *quality of presence*. It's not about *how much* she did (which invites the supererogation/obligation debate), but *how* she did it (with humanity, consistency, and specific care).
      *   *The "Supervisor Line":* Needs to be philosophically dense but sound like normal speech. Something about "necessity" or "choice" or "reasons."
      *   *The Audience:* Needs to feel included, not accused. The board paid for the dinner, so acknowledge their support without absolving them of systemic responsibility (subtly). The guests need to feel dignified, not like recipients of charity.

  3.  **Drafting the Toast - Section by Section:**
      *   *Opening:* Acknowledge the room, the mix of people. Establish the tone (warm, grounded).
      *   *The Work:* Describe the shelter not as a charity case but as a home. Address the "8 to 8" vs. "whenever" issue without calling it "extra." Call it "showing up."
      *   *The Person:* Integrate the non-work stuff (bluegrass, puns, allotment). This breaks the "moral saint" image.
      *   *The Philosophical Pivot (Subtle):* Address the "why." Not because she had to, not because she was a saint, but because she saw people.
      *   *The Board/Donors:* Thank them, but hint that the work shouldn't rely on individual heroics forever.
      *   *The Closing:* Raise a glass to the future and the specific person.

      *Drafting thought:* How to handle the "supererogation" line? Maybe something like, "She taught me that the things we call optional are often the only things that matter." Or "She never distinguished between what was asked and what was needed." Let's go with the latter, but tweak it for the supervisor. *Idea:* "In philosophy, we argue about where duty ends and choice begins. Mom just drew the line where the need was." A bit clunky. *Better:* "I spend my days studying the difference between what we must do and what we choose to do. My mother never saw the difference." That's the one.

      *Drafting thought:* How to avoid blaming the staff? Emphasize *her* specific capacity, not a universal standard. "She had a specific kind of stamina."
      *Drafting thought:* How to avoid blaming the donors? "Thank you for making tonight possible, and for supporting the work that made her life possible."

  4.  **Refining the Toast (Iterative Process):**
      *   *Word Count Check:* Need to ensure it's 4-5 minutes. ~130-150 words per minute. Target ~650-750 words.
      *   *Tone Check:* Is it too academic? Keep sentences rhythmic.
      *   *Specifics:* Mention the bluegrass. Mention the puns. Mention the "open whenever."
      *   *The "Teeth":* Ensure the critique of the system is soft but present. "The scandal is that the job exists" is her line. I can't say that directly without scolding. I can say, "She hoped her work would eventually become unnecessary."

  5.  **Drafting the Notes:**
      *   *Commitments:* What philosophical stance does this toast take? It essentially dissolves the supererogatory/obligatory distinction by focusing on *attention* rather than *action volume*. It leans towards a virtue ethics frame rather than deontological/consequentialist.
      *   *Weak Points:* The "I never saw the difference" line. Is it false? Did she see the difference and ignore it?
      *   *Contingencies:* If supererogation *does* require cost, does the toast fail? If role duties *do* swallow everything, is the praise empty?
      *   *Alternative:* If the "duty/choice" line is too risky, what replaces it? Focus on "care."

  6.  **Final Polish:**
      *   Check the "Supervisor Line." Make sure it's identifiable but invisible to the aunt.
      *   Check the Board address. Ensure it doesn't sound like a protest.
      *   Check the Guests. Ensure they aren't objectified.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally imply the staff *couldn't* do what she did in a way that sounds patronizing. Frame it as "her specific rhythm" rather than "her superior sacrifice."
      *(Self-Correction on the Supervisor Line)*: "I study the line between duty and grace. She just lived in the space between." No, "grace" is too religious. "I study the boundary between what is owed and what is given. She treated them as the same thing." That's clearer.

      *(Final Review of the Prompt Requirements)*:
