      *   *Counter:* Inertia determines *how* things move under force. Bond strength determines *how much* force is needed to break them. In GR, mass (inertia) and energy (binding) are coupled ($E=mc^2$). If the definition of inertial mass depends on the universe, does rest mass? In Machian theories, yes, inertial mass is induced. But rest mass (internal energy) is usually treated as intrinsic. However, if *all* mass is relational, does binding energy change?
