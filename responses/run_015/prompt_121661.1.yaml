      *   **The "Cost":** Abandoning strict Leibnizian reductionism for a field-theoretic relationism (the metric is real but not a container). Accepting that "local" means "local field values," not "independent of boundary conditions."
      *   **The Test Case:** The Rotating Shell (Thirring-Lense). It demonstrates frame dragging (inertia is relational) without implying chemical variation (local laws hold).
      *   **Refining the Ontology:** Suggest "Structural Realism" or "Metric Field Ontology" as a middle ground.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Step (6) imply Step (9)?* Only if one assumes that *all* physical properties are inertial properties. They aren't.
      *   *Is Step (1) compatible with GR?* Strictly speaking, GR allows empty universes (Minkowski), which violates (1). So the relationist must modify (1) to allow the metric field as a derivative entity or accept that (1) is an idealization. I should point this out.
      *   *Focus on the "Sealed Laboratory":* The Equivalence Principle is key here. The lab cannot distinguish acceleration from gravity locally. But it *can* measure tidal forces (curvature). The distant matter determines the curvature, but the curvature is a *local* tensor. So the lab measures the local tensor. It doesn't need to "know" about the galaxies, just the local field they produced. This saves (7).

