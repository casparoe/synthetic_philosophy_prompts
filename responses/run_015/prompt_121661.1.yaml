      *   *Why this helps:* It shows that "distant matter" influences local inertia *via the local metric field*, not by magic action-at-a-distance. It validates the "local autonomy" (the observer measures the local field) while validating the "global determination" (the field comes from the shell).
      *   *Isolated Void:* Less useful because GR allows vacuum solutions (Minkowski space), which troubles strict relationists (what are you relating to?). The Shell case is better because it actively demonstrates the mechanism of influence without violating locality.

