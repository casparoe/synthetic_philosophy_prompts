  1. The ledger calls the present to account,
  And binds the living to the past's demand.
  We stand as guardians of the sheer extent
  Of pain stored up so justice might endure.
  The archive opens like a hungry mouth,
  Demanding voice where silence tries to hide.
  This stanza establishes the ethical claim of the archive upon the present, reflecting Margalit's notion of a duty to remember collective wrongs.

  2. Yet healing whispers that the mind must clear,
  To function well the burden must be cast.
  The therapist suggests we turn away,
  From keeping fresh the voices of the dead.
  For sanity requires a lighter load,
  So living people struggle to be free.
  Here the therapeutic imperative emerges, echoing Rieff's analysis of culture pressing for the dissolution of painful memory to ensure present functioning.

  3. But someone bears the weight of files kept,
  The curator who feels the old pain rise.
  This archival grief is quietly borne,
  When duty makes the sorrow start anew.
  The institution holds the tears within,
  Where moral fidelity demands its price.
  This section exposes archival grief as the concealed emotional labour required to sustain moral fidelity within institutional remembrance.

  4. So active unmemorising takes hold,
  Not to erase the crime or hide the face.
  But loosen up the tight and binding chains,
  To give the present some much needed room.
  It is a choice to let the record sleep,
  Without betraying those who died in pain.
  The poem articulates active unmemorising as an ethically deliberate release from mnemonic duty, distinct from simple denial or celebration.

  5. So we remain between the stone and air,
  To neither forget nor remember all.
  A tension lasting past the final end,
  Where justice walks and mercy waits unseen.
  The scale remains balanced on the sharp edge,
  Between the duty and the need to live.
  Finally, the verse holds both ethical positions in irreducible suspension, refusing to resolve the tension between fidelity and forgetting.
