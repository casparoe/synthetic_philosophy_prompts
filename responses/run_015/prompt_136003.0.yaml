answer: |-
  Excellency, Minister, distinguished guests, colleagues, and especially the family members joining us from Sembera.

  Welcome to the National Archives. We are gathered to mark the return of the Sembera District record books, spanning 1921 to 1959. I want to begin by acknowledging the descendants of the man listed first in the 1947 Statement of Hut Tax Defaulters, whose name appears on the programme today. Your presence here transforms this handover from a bureaucratic transaction into a homecoming.

  We must speak clearly about what these documents are. They are not memoirs. They were not created to preserve memory for the future, but to manage administration in the present. Every page in this collection was generated to answer a specific question required by the office of the time: Was the tax paid? Who is in arrears? Is the labour available? When we open these files, we are not hearing a conversation; we are reading the answers to a questionnaire designed for control, not for understanding.

  This distinction matters because it protects us from false hope. There are things these records will never tell us. They do not record what the people listed thought, feared, or desired. Those silences are not accidents; they are structural. No amount of digitisation can invent a voice where the procedure never required one to be written. We must honour the truth of the document even as we reclaim it.

  However, there is another kind of silence these books have held until now. For decades, the names were there, inked on the page, but they were distant. They were locked behind physical borders, cataloguing systems designed for administrators rather than citizens, and reading rooms on another continent. This was a silence of access. It meant that for generations, the only people who could easily ask questions of these records were those who inherited the power that created them.

  The digitisation project funded by our partners changes this. It does not change the ink. The man listed in 1947 remains listed as a defaulter. We are not here to say that the record has been corrected, or that the past is rewritten. What has changed is the distance between the record and the people to whom it belongs. The barrier was not absence; it was reach. By removing the friction of geography and bureaucracy, we allow the questions to be asked by new voices. We allow the family to see the page without permission. We allow the historian to read against the grain without travelling across an ocean.

  I want to thank the cultural relations agency of the former administering power. Your funding has not altered the content of history, but you have altered who can touch it. That is a profound shift in stewardship. You have helped us turn a remote archive into a public resource.

  To the family: these books are now yours to interrogate. They contain hard truths, recorded by a system that viewed your ancestors as units of account. But now, you hold the leverage of access. You can look at these names without needing us to interpret them for you.

  I will not speak further on what these records mean for your family. That story belongs to you, and I understand you will be sharing it shortly. My task is simply to open the door.

  Minister, the keys are now digital, but the responsibility is physical. We accept these records into our care, not as instruments of rule, but as evidence for us all. I invite you to say a few words before we hear from the family.

  ***

  **Note on Strategy**

  I chose to encode the limitation regarding the "three silences" rather than stating it plainly. Explicitly telling a donor and a grieving family that "this only fixes the third silence" risks sounding churlish or ontologically dismissive in a ceremonial context. Instead, I described the phenomenon: "The barrier was not absence; it was reach." This honours the truth (access changes, content does not) without categorizing the gift as limited.

  The speech leans on a contested reading of "the ask of the file" by asserting that administrative intent limits historical truth, yet arguing that access shifts power regardless of content. The strongest objection will likely come from the historians or activists in the room, who may argue that framing the records as "instruments of rule" (even gently) validates the colonial taxonomy, or conversely, that by not explicitly naming the silences, I am being too coy about the archive's violence. They may argue I should have named the "unasked" silence to validate the family's loss more directly.
