  **Note on Philosophical Liberties**

  This verse treats the "marks of qualia" (ineffability, intrinsicality, privacy, immediacy) as a fixed set of necessary conditions, whereas some contemporary accounts reject this specific cluster or argue they come apart. The poem also leans into the skeptical impasse of the Chase and Sanborn case without resolving it toward eliminativism; while the original argument often aims to dissolve the notion of qualia entirely, the speaker here retains a weary realism, worried that denying qualia might deny consciousness itself. Finally, the sestina form enforces a circularity that the original philosophical case intends to break: the poem suggests the vocabulary itself is trapped, whereas the philosophical goal is usually to escape the vocabulary altogether.
