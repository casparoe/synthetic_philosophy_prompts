  ### Diagnostic Decision Tree: Individual Responsibility in Collective Harms

  To diagnose your philosophical position on individual contributions to collective harms (such as climate change, industrial animal agriculture, or national elections), answer the following five questions. Each question corresponds to a specific node in the decision tree. Record your Yes/No answers to trace your path to a specific philosophical position.

  **Node 1 (Vote Causality):** In a national election with millions of voters, is it true that your single ballot physically determines the winner?
  **Node 2 (Meat Causality):** In a large-scale supply chain, does purchasing one specific meal directly trigger the slaughter of one specific animal?
  **Node 3 (Collective Duty):** If you cannot change the harmful outcome alone, do you still have a moral obligation to coordinate with others to prevent it?
  **Node 4 (Expressive Value):** If an action changes no physical outcomes, does performing it anyway carry moral weight as a statement of values?
  **Node 5 (Virtue/Character):** Does participating in a harmful system damage your own moral integrity even if the system remains unchanged?

  ---

  ### Terminal Positions (Leaves)

  Below are six distinct philosophical positions mapped to specific paths through the tree. Each includes the required answer pattern and a practical recommendation.

  **1. Probabilistic or Expected-Harm Aggregation**
  *   **Path:** Yes (Node 1), Yes (Node 2), No (Node 3), No (Node 4), No (Node 5).
  *   **Position:** You believe individual actions have a calculable causal impact, even if small, and reject non-causal duties.
  *   **Recommendation:** Vote and avoid meat strictly because your specific contribution statistically reduces expected harm.

  **2. Pure Inefficacy Denial**
  *   **Path:** No (Node 1), No (Node 2), No (Node 3), No (Node 4), No (Node 5).
  *   **Position:** You believe individual actions have no causal power and generate no other form of moral responsibility.
  *   **Recommendation:** Do not worry about voting or dietary choices, as your individual behavior makes no difference to the outcome or yourself.

  **3. Collective-Action or Coordination-Duty**
  *   **Path:** No (Node 1), No (Node 2), Yes (Node 3), No (Node 4), No (Node 5).
  *   **Position:** You deny individual causal efficacy but affirm a duty to join groups that can collectively effect change.
  *   **Recommendation:** Vote and change your diet only as part of an organized campaign where your participation helps reach a critical threshold.

  **4. Structural-Complicity or Social-Connection Responsibility**
  *   **Path:** No (Node 1), No (Node 2), Yes (Node 3), Yes (Node 4), No (Node 5).
  *   **Position:** You accept responsibility based on your connection to harmful structures, viewing action as both a duty and a recognition of your position within the system.
  *   **Recommendation:** Vote and avoid meat to acknowledge your entanglement in unjust systems and to support structural transformation, regardless of immediate causal impact.

  **5. Expressive or Norm-Constitution Duty**
  *   **Path:** No (Node 1), No (Node 2), No (Node 3), Yes (Node 4), No (Node 5).
  *   **Position:** You deny causal efficacy and collective coordination duties, but believe actions matter because they express values or establish social norms.
  *   **Recommendation:** Vote and avoid meat primarily to signal your opposition to harmful practices and help shift cultural expectations.

  **6. Virtue-Based or Character-Corruption Avoidance**
  *   **Path:** No (Node 1), No (Node 2), No (Node 3), No (Node 4), Yes (Node 5).
  *   **Position:** You deny external efficacy and social duties, but believe participation in harm corrupts the agent's own character.
  *   **Recommendation:** Vote and avoid meat solely to maintain your own moral integrity, even if the world remains exactly the same.

  ---

  ### Diagnostic Limitations: Overlapping Leaves

  **The Overlap:** The tree fails to genuinely separate **Collective-Action** (Path: N-N-Y-N-N) and **Structural-Complicity** (Path: N-N-Y-Y-N).

  **Why it Occurs:** The distinction between these two positions relies entirely on Node 4 (Expressive Value). However, Structural-Complicity is fundamentally about political responsibility arising from social connection, not merely about "signaling" or expression. A proponent of Structural-Complicity might answer "No" to Node 4 (rejecting the idea that their action is merely a signal) while still maintaining the position, because their motivation is forward-looking political justice rather than expression. By using "Expressive Value" as the branching criterion, the tree forces Structural-Complicity into a box that emphasizes symbolism over structural responsibility, making it look too similar to Expressive views or artificially distinct from Collective-Action views.

  **Proposed Splitting Case:** To genuinely separate them, introduce a hypothetical case where coordination is impossible. Ask: *"If it is impossible to organize a group to solve the problem, are you still responsible for your part in the harm?"*
  *   **Collective-Action** would answer **No** (responsibility depends on the possibility of joint success).
  *   **Structural-Complicity** would answer **Yes** (responsibility depends on your connection to the structure, regardless of solvability).

  ---

  ### The Missing View: A Coherent but Absent Combination

  **The Combination:** Yes (Node 1), No (Node 2), No (Node 3), No (Node 4), Yes (Node 5).
  *   **Interpretation:** This view holds that voting causally matters, but eating meat does not; there is no duty to coordinate or signal; yet, one must still act to preserve personal virtue.

  **Diagnosis of Absence:** This combination reflects **practical unattractiveness** rather than logical incoherence. It is rare because it fragments moral reasoning across domains without a unifying principle. If one believes voting is causally efficacious (Node 1: Yes), they typically adopt a consequentialist framework that would also scrutinize meat consumption for expected harm (Node 2: Yes) or dismiss virtue as secondary to outcomes (Node 5: No). Conversely, if one cares about Virtue (Node 5: Yes), they usually extend that concern to all areas of life, not just voting. Theorists neglect this view because it requires maintaining two incompatible moral frameworks simultaneously—one causal/consequentialist for politics and one aretaic/character-based for consumption—without a bridge to explain why the standards differ.
