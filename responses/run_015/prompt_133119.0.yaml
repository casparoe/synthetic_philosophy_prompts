answer: |-
  ### Desiderata for an Adequate Epistemology of Markets

  To evaluate competing accounts of market epistemology without begging the question against the no-trade theorems, a theory must satisfy a specific set of adequacy conditions. These conditions are divided into **Structural Desiderata** (non-negotiable constraints required for the theory to describe the actual phenomenon of markets) and **Interpretive Desiderata** (camp-specific preferences regarding the ontological or normative status of the market).

  #### I. Structural Desiderata (Non-Negotiable)

  These requirements must be met for a theory to count as an explanation of *actual* financial markets rather than a normative idealization or a logical toy model.

  **1. The Trade Consistency Condition**
  *   **Requirement:** The theory must explain the existence of sustained, endogenous trading volume without relying exclusively on exogenous liquidity shocks or preference shocks.
  *   **Motivation:** The no-trade theorem demonstrates that if prices fully reveal information, speculative incentives vanish. A theory that explains trade solely by positing exogenous "liquidity traders" (agents who trade for reasons outside the epistemic model) effectively outsources the explanation of the paradox rather than resolving it. An adequate epistemology must explain why agents with epistemic motives continue to trade despite the information revealed by price.
  *   **Status:** **Non-Negotiable.** If a model cannot generate volume from within its epistemic assumptions, it fails to describe the object of study.

  **2. The Epistemic Fidelity Condition**
  *   **Requirement:** The theory must account for the correlation between price movements and subsequent fundamental outcomes, however noisy.
  *   **Motivation:** If prices were purely random or purely manipulative with no link to underlying value, the term "market epistemology" would be a category error. Markets occasionally predict recessions, earnings, or defaults. A theory that treats price as entirely decoupled from truth (e.g., a pure beauty contest with no anchor) fails to explain the successful coordination markets sometimes achieve.
  *   **Status:** **Non-Negotiable.** Without some fidelity, the market is not an epistemic engine but a casino.

  **3. The Condition of Strategic Opacity (Reflexivity)**
  *   **Requirement:** The theory must model the agent's interpretive framework as endogenous to the market dynamics she is observing. The way an agent reads a price signal must be capable of changing the nature of the signal itself.
  *   **Motivation:** This addresses your specific concern regarding incommensurability. In standard models, the mapping from information to price is structural and fixed (known to the modeler, if not the agents). In reality, agents operate with evolving mental models. If agents collectively shift from viewing a price drop as a "buying opportunity" to viewing it as a "liquidity crisis," the epistemic function of the price changes. A theory that treats the interpretation of price as static cannot capture the feedback loops where the theory of the market becomes part of the market.
  *   **Status:** **Non-Negotiable.** Ignoring this reduces the epistemology to a static signal-processing problem, missing the constitutive role of agent belief in shaping market reality.

  **4. The Breakdown Condition**
  *   **Requirement:** The theory must specify the conditions under which the epistemic function of the market fails (e.g., bubbles, crashes, or frozen liquidity).
  *   **Motivation:** Markets are not always efficient aggregators; they sometimes become amplifiers of error. An epistemology that only explains equilibrium states is insufficient. It must explain not just how knowledge is aggregated, but how ignorance or false belief can become common knowledge and sustain itself temporarily.
  *   **Status:** **Non-Negotiable.** A theory of knowledge that cannot account for systematic error is not a theory of human knowledge.

  #### II. Interpretive Desiderata (Camp-Specific)

  These requirements reflect philosophical commitments that vary between schools of thought (e.g., Neoclassical, Austrian, Behavioral, Post-Keynesian). A theory may fail these and still be structurally adequate, but it will align with specific camps.

  **5. The Ontological Parsimony Condition**
  *   **Requirement:** The theory should not posit collective cognitive states (e.g., "market sentiment") that cannot be reduced to individual agent states.
  *   **Motivation:** Methodological individualists require that all market phenomena be derivable from micro-foundations. Holists argue that emergent properties possess causal powers irreducible to the individual.
  *   **Status:** **Camp-Specific.** (Methodological Individualism vs. Emergentism).

  **6. The Determinacy Condition**
  *   **Requirement:** Given a set of initial information distributions, the theory should yield a unique or bounded set of price outcomes.
  *   **Motivation:** Rational Expectations proponents prefer determinate equilibria to ensure predictive power. Heterodox and Complexity theorists often accept radical indeterminacy or path dependence as a feature of complex adaptive systems.
  *   **Status:** **Camp-Specific.** (Equilibrium Theory vs. Complexity/Instability).

  **7. The Normative Teleology Condition**
  *   **Requirement:** The theory should imply that the market's epistemic function tends toward social optimality (e.g., optimal risk sharing or resource allocation).
  *   **Motivation:** Welfare economists view epistemic efficiency as instrumental to social good. Critical theorists or Institutionalists may view the market's epistemic function as serving specific class interests or stabilizing unstable systems without regard for welfare.
  *   **Status:** **Camp-Specific.** (Welfare Economics vs. Political Economy).

  ---

  ### The Impossibility Result

  There is a subset of requirements that is **jointly unsatisfiable** given classic no-trade results. Any adequate theory must explicitly abandon at least one of the following three propositions. You cannot hold all three simultaneously:

  1.  **Common Priors:** All agents share the same prior probability distribution over states of the world.
  2.  **Common Knowledge of Rationality:** It is common knowledge that all agents are rational expected-utility maximizers who update via Bayes' rule.
  3.  **Endogenous Speculative Volume:** Sustained trade occurs primarily due to differences in information interpretation rather than exogenous liquidity needs.

  **Analysis:**
  If you maintain (1) and (2), the no-trade theorem holds: prices become fully revealing, informational asymmetries vanish, and (3) becomes impossible. Therefore, an adequate epistemology of markets *must* violate either Common Priors (allowing for "agreeing to disagree") or Common Knowledge of Rationality (allowing for noise, bias, or bounded rationality), or it must admit that most trade is non-epistemic (liquidity-driven).

  Most formal finance literature preserves (1) and (2) by sacrificing (3), attributing volume to exogenous noise traders. Most behavioral literature preserves (3) by sacrificing (2). Most Austrian/Hayekian literature preserves (3) by sacrificing (1) (emphasizing dispersed, incommensurable knowledge). **An adequate theory must explicitly state which of these three pillars it collapses.**

  ---

  ### The Primary Exclusionary Criterion

  The single requirement that does the most work in excluding the most popular competing theories is **The Condition of Strategic Opacity (Reflexivity)**.

  **Why it excludes competitors:**
  *   **Standard Rational Expectations Equilibrium (REE):** REE models typically assume a fixed, known structure mapping states to prices. Agents know the model (or the distribution of the model). This violates Strategic Opacity because the agents' interpretive framework is not shaped by the dynamics; it is a fixed parameter of the environment. REE assumes the map is known; Reflexivity argues the map is drawn by the travelers.
  *   **Static Behavioral Models:** Many behavioral models introduce bias (e.g., overconfidence) as a fixed parameter. This fails Strategic Opacity because it treats the *mode* of interpretation as static. It does not account for the scenario where agents realize they are in a bubble and change their interpretive framework, thereby altering the bubble's dynamics.
  *   **Efficient Market Hypothesis (Strong Form):** This is excluded immediately because it assumes prices fully reveal information, leaving no room for the opacity required for strategic interpretation.

  **Conclusion:**
  To satisfy the Condition of Strategic Opacity, a theory must treat the market not as a mechanism that *processes* information, but as a recursive system where the *theory of the mechanism* is an input into the mechanism. This excludes any model that treats the price-formation function as exogenous to the agents' beliefs. Consequently, this criterion forces the theorist to abandon the comfort of fixed-point equilibria in favor of dynamic, potentially unstable evolutionary paths, making it the highest barrier to entry for a robust market epistemology.
