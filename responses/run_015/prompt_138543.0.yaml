prompt: |-
  I'm a backend engineer rather than a physicist, and I've been falling down a Maxwell's demon rabbit hole ever since I read a piece in one of those glossy science magazines on a flight last week (Nautilus? New Scientist? I honestly dont remember, and I dont have the issue anymore). I want to know how much of it to trust. I'm reconstructing the key paragraph from memory, so the wording is mine and I'm probably smoothing it out, but the substance was roughly this: "In the nineteenth century Maxwell imagined a tiny being with a trapdoor between two chambers of gas, letting fast molecules pass one way and slow molecules the other until one side is hot and the other cold, for free — a flat violation of the second law. The resolution, when it finally came after about a century of argument, turned out not to be about the door or even about the mechanics of measurement, but about memory. Rolf Landauer showed in 1961 that erasing a single bit of information necessarily dumps at least kT ln 2 of heat into the environment — around 3 × 10^-21 joules at room temperature — and Charles Bennett realised that this is the missing term: the demon can only operate in a cycle if it wipes its memory between molecules, and the entropy it creates by erasing always pays for the entropy it takes out of the gas. So information is physical, and there is a hard floor of kT ln 2 per bit on the energy cost of any computation whatsoever, however cleverly it is built." The piece then goes on to conclude that the era of ever-more-efficient computing therefore has to end at some point, and that quantum computers will run into exactly the same wall once they get big enough.

  Could you go through that more or less line by line and tell me what someone who actually works on the foundations of statistical mechanics would accept, what they'd wince at, and what they'd say is just wrong? I have three specific suspicions and I'd rather you deal with them than just reassure me. First, the flat "at least kT ln 2, no matter what" claim about erasure: if the bit I'm erasing isn't maximally random — if I already半 know what it says, or it came from a biased source — doesn't the floor drop, and doesn't the honest bound scale with how much information the bit actually carries rather than being a constant per bit? I cant do the thermodynamics myself, so if I've got that backwards say so. Second, the leap to "any computation whatsoever": I've read somewhere that logically reversible computation is supposed to dodge the bound entirely, which if true makes the magazine's per-bit floor on *all* computation look like an overstatement of a more modest thesis — but then I dont understand why everything isn't built reversibly, so I'd like the gap between "in principle" and "in practice" spelled out, including roughly how far today's hardware actually is from the bound (and please tell me if you're not confident about that number instead of inventing one). Third, the two closing claims: does either survive once the summary is cleaned up? A friend in a philosophy-of-physics reading group also insists that the whole erasure story is contested, that there are people who argue the demon can reset its memory without paying the Landauer cost at all and that the cost was never really about erasure in the first place — is that a genuine live dispute or is he just being contrarian?

  One more thing I keep getting stuck on, which is my own invention rather than the magazine's, so tell me if it's confused: imagine a demon that never erases anything. It has an enormous tape of fresh bits that are already zeroed, prepared by somebody else before the experiment started; each cycle it just writes one measurement result into the next free cell and moves the tape along. Naively it seems to sort molecules forever while paying no erasure cost at all, which can't be right, but I can't see exactly where the accounting catches up. Is the cost simply displaced onto whoever zeroed the tape — and if so, is that a real answer or just pushing the bump in the carpet? Does that case show that the content of Landauer's principle is really about a global entropy budget that includes the preparation of the memory, rather than about the act of erasing? And relatedly, when the magazine says "information is physical," is that sentence doing any actual work in the argument, or is it a slogan that would survive even if the Landauer–Bennett story were false?
