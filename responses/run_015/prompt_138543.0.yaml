answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified the exact points where pop-science exposition tends to fracture under scrutiny. As a backend engineer, your intuition about state, memory, and resource accounting is actually better suited to this topic than most laypeople's, because information thermodynamics *is* essentially resource accounting for phase space.

  Here is the autopsy of that magazine paragraph, followed by a direct address of your suspicions and your thought experiment.

  ### Part 1: Autopsy of the Paragraph

  Let's break down the claims as a statistical mechanician would see them.

  > *"In the nineteenth century Maxwell imagined a tiny being with a trapdoor between two chambers of gas... for free — a flat violation of the second law."*

  **Verdict: Accept.**
  This is the standard setup. No issues here.

  > *"The resolution... turned out not to be about the door or even about the mechanics of measurement, but about memory."*

  **Verdict: Accept (with nuance).**
  This refers to Charles Bennett's 1982 resolution. Earlier attempts (like Szilard's) focused on the cost of *measurement*. Bennett showed measurement can be done reversibly (without heat cost). The cost comes from the necessity of *resetting* the measurement apparatus to repeat the cycle.

  > *"Rolf Landauer showed in 1961 that erasing a single bit of information necessarily dumps at least kT ln 2 of heat into the environment..."*

  **Verdict: Wince.**
  This is the standard statement of Landauer's Principle, but it contains a hidden assumption: the bit being erased is maximally uncertain (50/50 probability). As you suspected, if the bit is already known to be `0`, resetting it to `0` costs nothing. The magazine treats the bit as a generic container rather than a state with specific entropy.

  > *"...and Charles Bennett realised that this is the missing term: the demon can only operate in a cycle if it wipes its memory between molecules, and the entropy it creates by erasing always pays for the entropy it takes out of the gas."*

  **Verdict: Accept.**
  This is the core of the modern consensus. To run a cycle, the demon must return its internal state to the initial configuration. That logical irreversibility maps to thermodynamic irreversibility.

  > *"So information is physical, and there is a hard floor of kT ln 2 per bit on the energy cost of any computation whatsoever, however cleverly it is built."*

  **Verdict: Wrong.**
  This is the biggest overstatement. There is a hard floor on *logically irreversible* operations (erasure, AND, OR). There is **no** hard floor on *logically reversible* operations (NOT, CNOT, Toffoli). If a computation is reversible, it can, in principle, be performed with arbitrarily low energy dissipation. The magazine conflates "computation" with "erasure."

  > *"The piece then goes on to conclude that the era of ever-more-efficient computing therefore has to end at some point, and that quantum computers will run into exactly the same wall once they get big enough."*

  **Verdict: Wince / Nuanced.**
  The era of efficiency is ending, but mostly due to practical transistor physics (leakage, voltage thresholds), not because we are hitting the Landauer limit. We are still orders of magnitude away from it. Regarding quantum computers: Quantum gates are unitary (reversible), so the computation itself doesn't inherently pay the Landauer cost. However, *initialization* (resetting qubits to |0⟩) and *readout* (measurement) are irreversible. So the periphery pays the cost, not necessarily the gate operations.

  ---

  ### Part 2: Addressing Your Three Suspicions

  #### Suspicion 1: The "Hard Floor" and Biased Bits
  **You are correct.** The bound is not a constant per physical bit; it is a constant per *nat* (or bit) of *Shannon entropy* erased.

  The generalized Landauer bound is:
  $$ W \ge k_B T \ln 2 \cdot (H_{\text{initial}} - H_{\text{final}}) $$
  Where $H$ is the Shannon entropy of the information bearing degree of freedom.
  *   If you erase a random bit ($H_{\text{initial}} = 1$, $H_{\text{final}} = 0$), cost $\ge kT \ln 2$.
  *   If you erase a biased bit (say, 90% likely to be 0), the entropy is lower, and the minimum work required is less.
  *   If you "erase" a bit you already know is 0 ($H_{\text{initial}} = 0$), the cost is zero.

  The magazine's claim implies every bit flip is a thermodynamic event of maximum magnitude. In reality, the cost scales with the *uncertainty* you are removing from the system. If your backend logs are highly compressed (high entropy), rotating them out costs more thermodynamically than rotating out a log of all zeros.

  #### Suspicion 2: Reversible Computation and the Practical Gap
  **You are correct again.** Logically reversible computation dodges the Landauer bound entirely.

  **Why isn't everything built reversibly?**
  1.  **Speed vs. Adiabaticity:** To compute reversibly without dissipating heat, you must change the physical state of the system "adiabatically" (infinitely slowly) to avoid exciting non-computational degrees of freedom (which manifests as heat). If you switch a transistor fast, you dissipate energy. Reversible computing requires slow, careful clocking.
  2.  **Error Correction:** This is the killer. In a noisy environment, bits flip. To fix errors, you must measure the syndrome and reset ancilla bits. This reset is irreversible. As you scale a reversible computer, the overhead of error correction introduces irreversible operations that dominate the energy budget.
  3.  **Complexity:** Building circuits where every output uniquely determines the input (bijection) is harder than standard logic. You have to save all intermediate "garbage" bits until you can uncompute them.

  **How far is current hardware from the bound?**
  This number varies by architecture, but a safe engineering estimate is that modern CMOS technology operates roughly **1,000 to 10,000 times** above the Landauer limit per logical operation.
  *   $kT \ln 2$ at 300K $\approx 3 \times 10^{-21}$ Joules.
  *   Modern switching energy is often cited around $10^{-18}$ to $10^{-17}$ Joules.
  *   *Caveat:* I am not confident in a single precise number because "operation" is ill-defined (is it a FLOP? A bit transport? A transistor switch?). However, the consensus is we are not yet brushing against the thermodynamic wall; we are brushing against the *material* wall (voltage scaling limits, leakage). We have maybe 2-3 orders of magnitude of thermodynamic headroom left, but huge engineering hurdles to access it.

  #### Suspicion 3: The Closing Claims and the Philosophical Dispute
  **The "End of Efficiency" Claim:**
  It is true that efficiency gains cannot go on forever, but Landauer's principle is not the immediate bottleneck. The bottleneck is that to distinguish a signal from thermal noise, you need a voltage significantly higher than $kT/q$. As we shrink transistors, leakage currents make it hard to maintain that voltage without melting the chip. We will hit practical thermal density limits long before we hit the fundamental Landauer limit.

  **The Philosophical Dispute:**
  Your friend is referencing a genuine debate, primarily driven by philosophers of physics John Earman and John Norton (late 90s/early 2000s).
  *   **Their Argument:** They argued that Landauer's Principle is often used to "exorcise" Maxwell's Demon by assuming the Second Law to prove the Second Law (circular reasoning). They claimed the link between logical irreversibility and thermodynamic irreversibility wasn't rigorously proven without assuming what it set out to prove.
  *   **The Counter-Argument:** In 2012 and onwards, experimental groups (e.g., Bérut et al., *Nature*) physically measured the heat dissipated during bit erasure in colloidal particles and electronic systems. They confirmed the $kT \ln 2$ bound within experimental error.
  *   **Verdict:** The *philosophical* soundness of the derivation is still picked at in foundations seminars, but the *physical reality* is considered experimentally settled. The heat *does* appear. Your friend isn't being contrarian, but they are prioritizing foundational logic over experimental consensus. In engineering terms: the spec might be debated, but the hardware behaves as predicted.

  ---

  ### Part 3: Your "Infinite Tape" Thought Experiment

  > *Imagine a demon that never erases anything. It has an enormous tape of fresh bits that are already zeroed... each cycle it just writes one measurement result into the next free cell and moves the tape along.*

  This is a classic objection, and your intuition that the cost is "displaced" is exactly right. Here is the accounting:

  1.  **The Resource:** A tape of "fresh zeroed bits" is a **low-entropy resource**. It is thermodynamically equivalent to a tank of compressed gas or a fresh battery. It represents "negentropy."
  2.  **The Transaction:** When the demon writes a random measurement result onto a zeroed bit, it randomizes that bit (assuming the measurement outcome is unpredictable). The entropy of the tape *increases*.
  3.  **The Conservation:** The demon reduces the entropy of the gas (sorting it). It increases the entropy of the tape (randomizing the zeros). If the process is ideal, $\Delta S_{\text{gas}} + \Delta S_{\text{tape}} = 0$. No heat is dissipated *during the sorting*.
  4.  **The Catch:** Where did the zeroed tape come from? Someone (or some process) had to prepare it. To take a random tape and zero it out requires paying the Landauer cost.
  5.  **Global Budget:** You cannot have an infinite supply of zeroed bits without an infinite energy source to zero them. If the tape is truly infinite and *already* zeroed at the start of the universe, you have simply posited a universe with infinite low-entropy memory, which is effectively positing a universe with infinite free energy available.

  **Is this just pushing the bump in the carpet?**
  No, it's valid accounting. It shows that Landauer's Principle isn't about the *act* of erasure specifically, but about the **consumption of low-entropy memory states**.
  *   **Erasure:** Consumes a random bit, outputs a zero bit + heat. (Restores the resource).
  *   **Your Tape:** Consumes a zero bit, outputs a random bit. (Uses the resource).

  Both processes are bound by the same thermodynamic ledger. If you want to run the demon forever, you need an infinite supply of zeroed bits. Producing that supply requires infinite work. The cost isn't avoided; it's just shifted from the *demon's runtime* to the *tape factory*.

  ### Part 4: "Information is Physical" — Slogan or Substance?

  This sentence is doing actual work, but it's often misunderstood.

  *   **Slogan Interpretation:** "Computers use electricity, so they get hot." (Trivial).
  *   **Substance Interpretation:** "Information states are not abstract; they are mapped to physical microstates. Therefore, constraints on information manipulation (logic) are constraints on physical phase space trajectories."

  If the Landauer-Bennett story were false, the slogan "Information is Physical" would still survive in a weaker form (e.g., you need physical media to store bits). But the *strong* version of the slogan—that the *logic* of information dictates the *thermodynamics* of the medium—relies entirely on the validity of Landauer's Principle.

  The argument is: Because a bit *is* a physical state (e.g., an electron in a well), you cannot change the logical constraints (erase the bit) without affecting the physical constraints (phase space volume), which forces a change in heat/entropy to satisfy Liouville's theorem/Hamiltonian dynamics.

  So, yes: The specific claim that "logic dictates heat" depends on Landauer. The broader claim that "you can't store info without matter" does not.

  ### Summary for the Backend Engineer

  1.  **Trust your skepticism.** The magazine conflated "erasure" with "computation." Reversible computing exists and bypasses the limit in principle.
  2.  **The Bound is Variable.** $kT \ln 2$ is the *maximum* cost per bit, applicable only to random bits. Biased data costs less to erase.
  3.  **The Tape Argument.** Your infinite tape scenario works, but it treats zeroed memory as fuel. You are burning negentropy. The cost was paid when the fuel was refined.
  4.  **The Wall.** We are not hitting the Landauer wall yet; we are hitting the voltage/noise wall. But the Landauer wall is the ultimate horizon.
  5.  **The Dispute.** Philosophers argue about the proof; experimentalists measure the heat. The heat wins.

  The magazine story is the "Executive Summary" version: mostly right on the vibe, wrong on the technical specs. You've successfully debugged the physics.
