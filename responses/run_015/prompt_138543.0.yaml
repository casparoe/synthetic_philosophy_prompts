  *(Refining the Hardware Gap)*: Current CMOS switching energy is around $10^{-18}$ to $10^{-19}$ Joules. $kT \ln 2$ at 300K is $\approx 3 \times 10^{-21}$ J. So we are about 100x to 1000x above the limit. I will state this range.

