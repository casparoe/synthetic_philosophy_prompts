answer: |-
  This is not vagueness, ambiguity, or a cluster concept. You are describing a specific ontological stance that is standard in maintenance engineering but rarely named in philosophy. Your team is not classifying defects; you are individuating units of labor.

  The established philosophical neighbor is **Pragmatic Individuation**, but that term is too broad for your precision. It covers any kind defined by use (e.g., "chair," "hammer"). Your case is narrower: the identity is defined not by the *use* of the object, but by the *intervention* required to resolve it.

  I propose you adopt the term **Remedial Identity**.

  Below is the carving you asked for. It distinguishes this phenomenon from its neighbors, explains your three structural properties, and defines the boundaries where the term should not be applied.

  ### The Concept: Remedial Identity

  **Definition:** Two issue reports share Remedial Identity if and only if the optimal set of interventions required to resolve them is identical.

  Under this definition, a "bug" is not a state of the code, nor a user experience, nor a causal history. A bug is a **ticket to work**. Therefore, "sameness" is determined by the equivalence of the work ticket, not the equivalence of the error.

  *   **Case 1 (Same Bug):** Different symptoms, same null pointer. The intervention is "guard the null." One intervention covers both reports. Remedial Identity holds.
  *   **Case 2 (Different Bugs):** Same output, different causes (rounding vs. cache). The interventions are "fix math" and "clear cache." These are distinct labor units. Remedial Identity fails, regardless of phenomenological similarity.
  *   **Case 3 (The Split):** Same cause, different subsystems/owners. The intervention requires two distinct change sets, reviewed by two distinct people, deployed via two distinct pipelines. Although the *cause* is one, the *remedy* is two. Remedial Identity fails. The team members arguing for "one bug" are prioritizing *Causal Identity*; those arguing for "two" are prioritizing *Remedial Identity*. In a tracker, Remedial Identity must win, which is why the split persists.

  ### Explanation of Your Three Properties

  **1. Graded Shifts**
  The "grade" is not a measure of similarity; it is a measure of **interventional overlap**.
  *   *High confidence:* The fix is obviously a single commit (Case 1).
  *   *Contested:* The fix requires coordination across boundaries (Case 3).
  *   *Competence:* A good triager estimates the scope of the remedy before the code is written. The "pedant" splits remedies that are actually unified (wasting tracking overhead). The "enthusiast" merges remedies that are actually distinct (losing accountability). Both are criticized for misestimating the labor unit.

  **2. Non-Transitivity and Asymmetric Repair**
  Strict identity is transitive. Remedial Identity is often **epistemically non-transitive** because the intervention is unknown at the time of judgment.
  *   *The Setup:* You assert A=B (same fix) and B=C (same fix) based on current evidence. Later, you discover A requires Fix 1 and C requires Fix 2.
  *   *The Asymmetry:* The tracker's purpose is to account for work.
      *   **Merging (A+B $\rightarrow$ One):** You are asserting that two presumed labor units are actually one. If you are wrong, you have **lost track of work**. This is an accounting error. Hence: "We were wrong."
      *   **Splitting (A $\rightarrow$ A1+A2):** You are asserting that one presumed labor unit is actually two. If you are right, you have **found more work**. This is an discovery of complexity. Hence: "It turned out to be two."
      *   This explains why splitting feels like discovery and merging feels like correction. One increases the fidelity of the work queue; the other risks reducing it.

  **3. Rule Failure**
  Rules fail because they try to codify *Causal* or *Phenomenological* identity onto a *Remedial* system.
  *   "Same root cause" fails when one cause requires two distinct deployment procedures (Case 3).
  *   "Same user failure" fails when one failure requires two distinct code fixes (Case 2).
  *   The rule misfires exactly where the *labor* diverges, because the rule is tracking the wrong ontology. You cannot write a policy for Remedial Identity because the identity is determined by the *solution*, which is unknown at the time of *triage*. The "policy" is simply the team's collective heuristic for predicting the solution.

  ### Distinctions from Nearest Neighbors

  To circulate this to your team, you must distinguish **Remedial Identity** from the concepts your friend suggested.

  | Concept | Why it is not this | The Distinction |
  | :--- | :--- | :--- |
  | **Vagueness** | Vagueness implies a borderline where confidence drops. | In your cases, confidence is high on both sides of a disagreement. The disagreement is not about *degree*, but about *criteria*. |
  | **Polysemy** | Polysemy implies two distinct meanings of "same" (e.g., "same car" vs. "same model"). | Your team insists there is only one sense of "same bug." They are not switching definitions; they are weighing causal vs. operational factors within a single sense. |
  | **Cluster Concepts** | Cluster concepts rely on overlapping features (e.g., "game"). | Your cases are not held by overlapping features. Case 1 shares *no* symptoms. Case 2 shares *no* causes. They are held together solely by the *action* taken. |
  | **Natural Kinds** | Natural kinds exist independent of human action (e.g., "gold"). | A "bug" does not exist independent of the decision to fix it. If you decide not to fix it, it becomes "working as intended." Its identity depends on the intention to intervene. |

  ### Boundaries and Edge Cases

  **Remedial Identity** applies only within the context of a **maintenance workflow**. It should not be applied in the following contexts:

  1.  **Post-Mortem Analysis:** When writing a blameless post-mortem or a security advisory, you switch to **Causal Identity**. Here, you *want* to group distinct fixes under one root cause to prevent recurrence. If you apply Remedial Identity here, you will fragment your understanding of the system's weakness.
  2.  **User Documentation:** When writing release notes for users, you switch to **Phenomenological Identity**. Users care about symptoms, not patches. If you apply Remedial Identity here, you will list technical fixes that mean nothing to the user.
  3.  **Automated Testing:** In regression testing, you switch to **State Identity**. A test passes or fails based on the system state, not the fix. Merging two bugs that fail the same test is valid here, even if the fixes differ.

  ### Summary for the Team

  We are not arguing about what a bug *is*. We are arguing about what a bug *costs*.

  **Remedial Identity** dictates that two reports are the "same bug" only if they consume the same unit of engineering labor.
  *   If the fix is one commit, it is one bug.
  *   If the fix is two commits, it is two bugs.
  *   If the fix is one commit but requires two approvals, it is likely two bugs.

  When we merge, we are consolidating labor. When we split, we are recognizing distinct labor. The discomfort we feel when these calls are difficult is not philosophical confusion; it is the friction of estimating work before the work is done. Accept that "Same Bug" is a shorthand for "Same Fix," and the non-transitivity will resolve into simple estimation error.
