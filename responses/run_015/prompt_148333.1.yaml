prompt: |-
  My friend and I spent a good part of last night arguing about moral foundations theory, and I came away unable to tell whether I had been disagreeing with the theory or merely with his version of it. I would be grateful for an audit of the position he defended. What follows is my best reconstruction of it, as nearly in his own words as I can manage:

  "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty — each of which evolved to cope with a different recurring problem of living in groups. Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set, which is why they can build coalitions around nation, tradition and religion and the left cannot. Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood, and it pulls you into a political camp rather than the other way about. Judgement comes first and reasoning comes afterwards. Present people with a harmless taboo violation and they condemn it instantly, flounder when asked to say what was wrong with it, and then manufacture reasons on the spot. So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have. And once you see that, you see that there is no answer to the question of who is right. Morality is a bundle of evolved reactions, people are wired with different weightings of them, and asking whose weighting is correct is like asking whose taste in food is correct. The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."

  I objected at several points and was not convinced by my own objections. Three in particular I could not settle. First, whether the "liberals run on two foundations" line, as he put it, is what the research actually claims, or whether something has gone missing in the retelling. Second, whether the claim that reasoning arrives after judgement, even if we grant it, supports what he took it to support — it struck me that it might be a claim about the order in which things happen to us rather than about whether our reasons are any good, but he said that distinction was evasive. Third, the step from "our moral judgements have a psychological explanation" to "there is no fact of the matter". I accused him of committing the genetic fallacy. He replied that if you learnt your belief that two and two make four was being produced by a brain lesion you would abandon it, and that if I thought the moral case was relevantly different I should say precisely how. I could not.

  I also tried him with a hypothetical. Suppose a large longitudinal study found that foundation profiles are strongly heritable, stable across the life course, and better predictors of later party identification than party identification is of them. He said that would settle the matter outright and show that there is no fact of the matter about whose political morality is correct. I doubt it settles anything of the kind, but I could not say what it would establish if it were true, or what it would leave exactly where it was.

  Could you go through his account claim by claim and separate what the theory's proponents would accept, what is a defensible simplification for a popular treatment, and what they would reject as a misstatement? Please flag anywhere his summary runs together two things the framework keeps apart, and note where he has quietly converted a relative claim into an absolute one. Where he draws a conclusion — about who is right, or about what the psychological findings would show — say whether the conclusion survives once the misstatements are corrected, and whether the argument as he gives it cuts against the left and the right symmetrically or only against one of them. Finally, I should say that I am not a psychologist; I have read one popular book on this, and he has read the same one more carefully than I have, which may be the whole difficulty.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with a friend about Moral Foundations Theory (MFT).
      *   **Task:** Audit the friend's position claim-by-claim against the actual theory (as proposed by Haidt and colleagues).
      *   **Specific Requirements:**
          *   Separate what proponents accept vs. simplifications vs. misstatements.
          *   Flag conflation of distinct concepts.
          *   Note conversion of relative claims to absolute ones.
          *   Evaluate conclusions (about "who is right" and the "genetic fallacy" issue).
          *   Assess symmetry (does the argument cut against both sides or just one?).
          *   Address the hypothetical longitudinal study scenario.
      *   **User's Background:** Not a psychologist, read one popular book (likely *The Righteous Mind*), friend read it more carefully.
      *   **Tone:** Analytical, precise, fair to the theory but critical of the friend's extrapolations.

  2.  **Deconstruct the Friend's Statement (Claim-by-Claim Analysis):**

      *   *Claim 1: "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty..."*
          *   **Status:** Mostly accurate. Haidt originally proposed 5, added Liberty later. "Innate" is nuanced (preparedness vs. hardwiring).
      *   *Claim 2: "...each of which evolved to cope with a different recurring problem of living in groups."*
          *   **Status:** Accurate. This is the evolutionary psychology basis of MFT.
      *   *Claim 3: "Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set..."*
          *   **Status:** Simplification/Relative claim made absolute. Research shows liberals *score lower* on binding foundations (Loyalty, Authority, Sanctity), not zero. It's a difference in *reliance*, not exclusive usage.
      *   *Claim 4: "...which is why they can build coalitions around nation, tradition and religion and the left cannot."*
          *   **Status:** Defensible simplification, but arguably teleological. MFT suggests this *explains* electoral success/coalition building, but "cannot" is strong.
      *   *Claim 5: "Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood..."*
          *   **Status:** Plausible but debated. Heritability of personality traits is high, but moral foundations are influenced by culture. "Fixed by early adulthood" is a bit rigid but generally aligns with personality stability.
      *   *Claim 6: "...and it pulls you into a political camp rather than the other way about."*
          *   **Status:** Supported by research (morality predicts politics more than vice versa), but causality is bidirectional over time.
      *   *Claim 7: "Judgement comes first and reasoning comes afterwards." (Social Intuitionist Model)*
          *   **Status:** Accurate to Haidt's SIM.
      *   *Claim 8: "So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have."*
          *   **Status:** Overstatement. "Never" is too strong. Reasoning can influence others (persuasion) and oneself (private reflection), though intuition leads.
      *   *Claim 9: "And once you see that, you see that there is no answer to the question of who is right."*
          *   **Status:** **Major Leap.** This is the move from *is* to *ought* (Naturalistic Fallacy/Genetic Fallacy). MFT describes psychology, not meta-ethical truth.
      *   *Claim 10: "Morality is a bundle of evolved reactions... asking whose weighting is correct is like asking whose taste in food is correct."*
          *   **Status:** Haidt often uses this analogy, but it's controversial. It implies moral relativism which isn't strictly *in* the data.
      *   *Claim 11: "The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."*
          *   **Status:** Relative claim supported by some data (empathy accuracy), but "understands" is complex. It cuts symmetrically in theory (if left used all foundations, they might understand right better), but empirically favors conservatives in the US context.

  3.  **Address the User's Three Specific Objections:**

      *   *Objection 1: "Liberals run on two foundations."*
          *   **Analysis:** It's a relative difference, not an absolute absence. Liberals care about loyalty/authority/sanctity but frame them differently or prioritize them less.
      *   *Objection 2: Reasoning arrives after judgement (does this invalidate reasons?).*
          *   **Analysis:** The "order of operations" doesn't necessarily invalidate the *truth value* of the reasoning. This is the Genetic Fallacy concern. The friend conflates *causal origin* with *justification*.
      *   *Objection 3: Psychological explanation -> No fact of the matter.*
          *   **Analysis:** This is the Genetic Fallacy pure and simple. Explaining *why* I believe X doesn't prove X is false (or true). The "brain lesion" analogy is flawed because math is objective; morality's ontological status is debated, but MFT doesn't settle it.

  4.  **Address the Hypothetical Longitudinal Study:**
      *   **Friend's View:** Heritability/Stability = No fact of the matter.
      *   **Counter:** Heritability describes *variation*, not *truth*. Eye color is heritable; "blue is better than brown" is not settled by that. It establishes *predictive power*, not *normative validity*.

  5.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the user's reconstruction. Validate that the friend is channeling Haidt but extending beyond the data.
      *   **Section 1: Claim-by-Claim Audit:** Break down the friend's paragraph into distinct propositions. Label them (Accepted, Simplification, Misstatement/Overreach).
      *   **Section 2: Addressing the Three Sticking Points:** Directly answer the user's specific doubts (Liberal foundations, Intuition vs. Reason, Genetic Fallacy).
      *   **Section 3: The Longitudinal Hypothetical:** Explain what such a study would actually prove (prediction vs. truth).
      *   **Section 4: Symmetry Check:** Does this argument hurt one side more? (It claims to be symmetric but often functions as a critique of liberal universalism).
      *   **Conclusion:** Summarize the core disagreement (Descriptive Psychology vs. Normative Ethics).

  6.  **Refine the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Make sure not to defend MFT uncritically. MFT has critics (e.g., regarding the "foundations" themselves or cross-cultural validity). Stick to what *proponents* claim vs. what the *friend* claims.
      *   *Nuance:* The "Liberty" foundation was added later (2012ish). Ensure the timeline is acknowledged if relevant (friend includes it, which is up-to-date).
      *   *Nuance:* Haidt *does* flirt with moral relativism in *The Righteous Mind*, but he usually stops short of saying "there is no truth." He says "there are many truths." Distinguish this.
      *   *Clarification:* The "brain lesion" analogy. If I believe 2+2=4 because of a lesion, the belief is accidentally true, but my *justification* is gone. In morality, if the "foundation" is the only source of justification, removing it removes the justification. But MFT doesn't say foundations are the *only* source of justification, just the *initial* trigger.

  7.  **Final Polish:** Check tone. Ensure it's helpful, not condescending. Use clear headings. (Proceed to draft response based on these points.)

      *   *Key distinction to highlight:* Descriptive (how we *do* judge) vs. Normative (how we *should* judge). The friend collapses these.
      *   *Key distinction to highlight:* Relative (more/less) vs. Absolute (all/none).
      *   *Key distinction to highlight:* Causal origin vs. Epistemic validity.

  8.  **Drafting the Response:** (Mental outline of the specific sections)
