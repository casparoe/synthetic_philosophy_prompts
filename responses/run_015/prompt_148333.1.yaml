      *(Refining the "Liberal" claim)*: Haidt's data shows liberals score *near zero* on Sanctity/Authority often, but not strictly zero. The friend's "only two" is a rhetorical shorthand that became a literal claim.

      *(Refining the "Symmetry")*: The friend claims symmetry ("both sides rationalising"), but the conclusion ("Right understands Left better") is asymmetric. I need to point this out.

