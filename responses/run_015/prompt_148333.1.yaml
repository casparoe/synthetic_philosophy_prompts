answer: |-
  This is an exceptionally clear reconstruction of your friend's position. It is also a very common reading of Jonathan Haidt's *The Righteous Mind*, which is almost certainly the "one popular book" you both read.

  Your friend is arguing for a position that blends **Moral Foundations Theory (MFT)** (a descriptive psychological model) with **Moral Anti-Realism** (a philosophical meta-ethical stance). While Haidt flirts with the latter, the theory itself does not necessitate it. Your friend has taken descriptive findings and converted them into normative conclusions.

  Here is an audit of his claims, separated by what the theory's proponents would accept, what is a defensible simplification, and what constitutes a misstatement or philosophical overreach.

  ### Part 1: Claim-by-Claim Audit

  | Claim from your friend's reconstruction | Status in MFT | Notes on Distortion |
  | :--- | :--- | :--- |
  | **"Moral judgements run on a handful of innate foundations..."** | **Accepted.** | This is the core axiom. Proponents add nuance: "innate" means "first-draft preparedness," not "hardwired script." |
  | **"...harm/care, fairness, loyalty, authority, sanctity and liberty."** | **Accepted.** | Accurate. Liberty was added later (c. 2012) to the original five. |
  | **"...each of which evolved to cope with a different recurring problem..."** | **Accepted.** | This is the evolutionary psychology basis of the theory. |
  | **"Liberals are effectively running on only two of them, care and fairness."** | **Simplification / Relative→Absolute.** | **Crucial Error.** Data shows liberals score *significantly lower* on the "binding" foundations (Loyalty, Authority, Sanctity), rarely zero. Your friend has converted a *difference in degree* into a *difference in kind*. |
  | **"Conservatives run on the full set."** | **Defensible Simplification.** | Conservatives generally score moderate-to-high on all six. |
  | **"...which is why they can build coalitions... and the left cannot."** | **Defensible Simplification.** | Haidt argues this explains why conservatives often win electoral coalitions despite being outnumbered. However, "cannot" is too strong; it implies impossibility rather than strategic difficulty. |
  | **"Your profile is... substantially heritable, more or less fixed by early adulthood."** | **Accepted (with caveats).** | Personality traits (Openness, Conscientiousness) correlate with foundations and are heritable. However, culture shapes how foundations are expressed. |
  | **"...it pulls you into a political camp rather than the other way about."** | **Accepted.** | Longitudinal data suggests moral intuitions predict later political affiliation better than affiliation predicts intuitions. |
  | **"Judgement comes first and reasoning comes afterwards."** | **Accepted.** | This is the **Social Intuitionist Model**. Intuition is the elephant; reason is the rider. |
  | **"So a political argument is never really an argument..."** | **Overstatement.** | "Never" is too strong. Reasoning can trigger new intuitions in *others* (social persuasion) or oneself (private reflection), even if it doesn't drive the initial judgment. |
  | **"...both sides are rationalising intuitions they were always going to have."** | **Accepted (mostly).** | Confirms the "rational tail wagging the emotional dog" metaphor. |
  | **"And once you see that, you see that there is no answer to the question of who is right."** | **Rejected (Philosophical Overreach).** | **Major Leap.** This moves from *psychology* (how we judge) to *meta-ethics* (what is true). MFT describes the *mechanism* of judgment, not the *validity* of the judgment. |
  | **"Asking whose weighting is correct is like asking whose taste in food is correct."** | **Contested.** | Haidt uses this analogy to suggest moral diversity is functional, not that truth is impossible. Your friend uses it to deny truth entirely. |
  | **"The right... commands a wider moral vocabulary, and therefore understands the left better than the left understands it."** | **Accepted (Empirically).** | Studies on "moral empathy" show conservatives can predict liberal responses better than vice versa. However, this is an empirical claim about *accuracy*, not a normative claim about *truth*. |

  ### Part 2: Addressing Your Three Sticking Points

  You identified the three weakest links in your friend's chain. Here is how to untangle them.

  #### 1. The "Two Foundations" Claim
  **Your doubt:** Is it true liberals *only* use two?
  **The Audit:** This is a **Relative→Absolute conversion**.
  MFT data is plotted on spectrums. Liberals score very low on Loyalty, Authority, and Sanctity compared to conservatives. In a popular retelling, "very low" becomes "non-existent."
  **Why it matters:** If liberals *actually* lacked these foundations, they would be psychologically incapable of understanding concepts like patriotism or religious reverence. They aren't; they often reject them based on *Harm* or *Fairness* grounds (e.g., "This tradition is exclusionary/harmful"). Your friend's claim suggests liberals are morally colorblind to binding values; the theory suggests they simply prioritize individualizing values higher.

  #### 2. Intuition First, Reasoning Second
  **Your doubt:** Does the order of operations invalidate the reasoning?
  **The Audit:** This conflates **Causal Origin** with **Epistemic Justification**.
  Your friend is correct that MFT claims intuition causes the judgment. He is incorrect that this *necessarily* invalidates the reasoning.
  *   *Example:* A mathematician might have an intuitive flash that a theorem is true before proving it. The fact that the intuition came first does not make the subsequent proof invalid.
  *   *The Friend's Counter:* He argues moral reasoning is *post-hoc fabrication*, not proof.
  *   *The Rebuttal:* Even if reasoning is often a fabrication, it can still be subjected to external scrutiny. The fact that my judgment started as a gut feeling doesn't mean the gut feeling can't be wrong. MFT explains why we *start* where we do; it does not prove we *cannot move* via reason.

  #### 3. The Genetic Fallacy (Psychological Explanation → No Fact of the Matter)
  **Your doubt:** Does explaining the origin of a belief prove it has no truth value?
  **The Audit:** You are correct; this is the **Genetic Fallacy** (specifically, an **Evolutionary Debunking Argument**).
  Your friend's "brain lesion" analogy is flawed.
  *   *The Lesion Case:* If a brain lesion causes you to believe 2+2=4, the belief is true, but your *access* to the truth is accidental. You have no justification.
  *   *The Moral Case:* Your friend argues that because evolution selected for *fitness* (survival), not *truth*, our moral intuitions are unreliable.
  *   *The Flaw:* This proves too much. Evolution also selected for our visual cortex and our logical faculties. If we dismiss all evolved faculties because they were selected for survival, we cannot trust *anything*, including the friend's argument about MFT.
  *   *The MFT Stance:* Proponents argue MFT reveals that there are *multiple* moral truths (pluralism), not *no* moral truths (nihilism). Haidt argues we need to balance the foundations, not that the foundations are fake.

  ### Part 3: The Longitudinal Hypothetical

  **The Scenario:** A study proves foundation profiles are heritable, stable, and predict party ID better than party ID predicts them.
  **Friend's Conclusion:** This settles that there is "no fact of the matter" about whose morality is correct.
  **Your Intuition:** This settles nothing of the kind.

  **Analysis:**
  You are right. Such a study would establish **Predictive Power**, not **Normative Validity**.
  *   **Analogy:** Suppose a study showed that preference for sweet vs. salty food is highly heritable and predicts which restaurants people join. That would not settle whether "sweet food is objectively better than salty food." It would just explain why people *choose* differently.
  *   **What it would establish:** It would confirm that political identity is deeply rooted in personality and biology. It would suggest that converting voters via rational argument is difficult (because you are fighting biology).
  *   **What it would leave untouched:** It would leave untouched the question of whether a society *should* prioritize Care over Authority. That is a philosophical question, not a psychological one. You cannot derive an *ought* (who is right) from an *is* (who is heritable).

  ### Part 4: Symmetry and Conclusions

  **Does the argument cut symmetrically?**
  Your friend claims symmetry ("both sides are rationalising"), but his conclusion is **asymmetric**.
  *   **Symmetric Claim:** Both sides rely on intuition over reason. (MFT supports this).
  *   **Asymmetric Conclusion:** The Right understands the Left better than the Left understands the Right. (MFT supports this empirically, *but*...)
  *   **The Hidden Normative Claim:** The Right is "more complete" because they use more foundations.
      *   **Critique:** This assumes that *more* foundations = *better* morality. That is a value judgment, not a finding. A liberal could argue that relying on Authority and Sanctity leads to oppression, so using *fewer* foundations is morally superior. MFT cannot adjudicate this; it only notes the difference.

  **Does the conclusion ("No one is right") survive correction?**
  No. If you correct the misstatements:
  1.  Liberals use all foundations, just weighted differently.
  2.  Intuitive origins do not negate the possibility of reasoned truth.
  3.  Heritability does not negate normative validity.

  Then the conclusion shifts from **"Morality is subjective taste"** to **"Morality is a complex negotiation between competing, biologically-rooted values.""
  The latter allows for the possibility that some weightings are better for specific societal goals (e.g., liberty vs. order), whereas the former shuts down the conversation entirely.

  ### Summary for Your Next Conversation

  Your friend has conflated **Descriptive Psychology** (how the mind works) with **Normative Ethics** (how we should live).

  1.  **On the "Two Foundations":** Point out that MFT shows *difference in reliance*, not *absence of capacity*. Liberals condemn taboo violations using Harm/Fairness logic, not no logic at all.
  2.  **On the "Genetic Fallacy":** Remind him that explaining the origin of a belief (evolution/psychology) does not determine its truth value. If it did, we would have to doubt logic and perception, which are also evolved.
  3.  **On the "No Fact of the Matter":** Ask him if he believes *slavery* is wrong. If yes, ask him if that belief is just "taste." If he says slavery is objectively wrong, he has admitted there is at least *one* moral fact, and his nihilism is inconsistent.
  4.  **On the Heritability Study:** Remind him that knowing *why* people disagree (biology) doesn't tell us *how to resolve* the disagreement (philosophy/policy).

  Your friend is defending a view called **Moral Nihilism** or **Error Theory** and using MFT as a prop. MFT proponents generally defend **Moral Pluralism**. The former says "Nothing is right." The latter says "Many things are right, and they conflict." That is a significant difference.
