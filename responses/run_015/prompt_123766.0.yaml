answer: |-
  This is a profound problem in social ontology and the theory of practical reason. You are describing a gap between the *causal efficacy* of a consideration in a decision-making process and the *attitudinal backing* of the agents involved. You want to know if this gap reveals something about the nature of reasons themselves, or merely about the friction in human systems.

  Per your instructions, I will not begin with the answer. I will begin by proposing three distinct ontological carvings of the phenomenon, select the one that best fits the joints of your description, and then proceed to the definitions and metaphysical implications.

  ### Part 1: Three Carvings of the Phenomenon

  Here are three ways to ontologically categorize the "orphan rationale."

  **Carving 1: The Epistemic Lag (Psychological View)**
  On this view, the phenomenon is entirely reducible to the mental states of the participants, specifically a failure of common knowledge. The rule persists because of *pluralistic ignorance* or *coordination costs*. Everyone privately rejects the rule, but everyone incorrectly believes others accept it, or everyone believes that changing it requires a costly coordination effort nobody wants to initiate.
  *   **Prediction:** If you create a low-cost mechanism for simultaneous updating (like your anonymous poll followed by a binding vote), the "orphan" should vanish immediately. The "force" of the rule is actually just the fear of deviating from perceived norms.
  *   **Why it fails:** You noted that even with unanimous disavowal in anonymous polls, the rule survives in board minutes. The pressure is not coming from peer expectation (since the disavowal is known) but from the *process itself*.

  **Carving 2: The Latent Function (Functionalism View)**
  On this view, the consideration is not an orphan at all; it is a placeholder for a systemic need that the current agents do not understand. The reserve rule persists not because of the founder's ghost, but because the organization *actually needs* risk mitigation, and this rule is the crude instrument currently serving that function. The "reason" is real, but the agents' *articulation* of it is wrong.
  *   **Prediction:** If the rule were truly harmful (as your program officers claim), the organization would suffer measurable negative outcomes (e.g., missed opportunities leading to decline) that would eventually kill the rule. The rule persists only as long as it is functionally adaptive.
  *   **Why it fails:** You explicitly state the rule is "actively harmful" and defeats proposals that should win. The system is not self-correcting. The consideration is not tracking a hidden truth; it is tracking a past decision that has lost its tether to reality.

  **Carving 3: The Decoupled Status (Institutional View)**
  On this view, the consideration is a *status function* that has detached from the *collective intentionality* that created it. In social ontology, rules usually exist because we collectively agree to treat them as existing ("X counts as Y"). This carving suggests that once a rule is institutionalized (written in bylaws, coded in software, embedded in templates), it acquires a form of inertia. It becomes a structural constraint that operates *as if* it were endorsed, even when the endorsement is withdrawn. The "reason" is not in the minds of the agents, nor in the world, but in the *architecture of the decision procedure*.
  *   **Prediction:** The rule will persist until a specific *constitutive act* (amending the bylaws, deleting the code) removes it. Mere change of mind is insufficient because the rule is no longer located in the mind; it is located in the structure.
  *   **Why it fits:** This explains why the board minutes cite the rule (the structure demands a justification slot) and why the personal career anxiety persists (the internalized habit-structure resists the reflective judgment).

  ### Part 2: The Selected Carving

  I settle on **Carving 3: The Decoupled Status**.

  I reject Carving 1 because it cannot explain the survival of the rule after the ignorance is cleared (the anonymous poll). I reject Carving 2 because it cannot explain the persistence of harmful rules that offer no systemic benefit.

  Carving 3 captures the specific "uncanniness" you describe: the feeling that the reason is *doing work* without *being held*. It locates the phenomenon in the interface between human agency and institutional structure. It acknowledges that social systems have memory and momentum that outlast the current psychological states of their participants.

  **What the rejected carvings would have predicted:**
  *   **Epistemic Lag** would have predicted that your intervention (revealing the unanimous disavowal) should have dissolved the rule. Since it didn't, the pressure is not interpersonal.
  *   **Latent Function** would have predicted that the "harmful" rule would eventually cause the organization to fail or adapt. Since it persists despite harm, it is not functionally grounded.

  ### Part 3: Established Concepts and Their Breakdown

  You asked about existing philosophical concepts. Here is why they are insufficient:

  1.  **Agent-Neutral Reasons:** These are reasons that apply to anyone (e.g., "pain is bad"). But they still require an agent to *recognize* them as reasons to be motivating. In your cases, the agents recognize them as *constraints*, but explicitly deny they are *good reasons*. Agent-neutrality explains scope, not orphanhood.
  2.  **World-Given Reasons:** This view holds that facts themselves are reasons. This fails because you note the world often *doesn't* contain what the consideration claims (e.g., the founder is gone; the family doesn't want everything). If the fact is false, a World-Given theorist says there is no reason. Yet the "reason" still moves the group.
  3.  **Group-Level Reasons (Collective Intentionality):** This is the closest fit. However, standard theories of group agency (like List and Pettit) require some aggregation function or shared intention. You specified the group's own procedures, run faithfully, produce the *opposite* result. The group *as a rational agent* would reject the rule, but the group *as an institution* enforces it. The "reason" belongs to the *institution's history*, not the *group's current mind*.

  ### Part 4: A New Term and Definition

  Since no existing term captures the "active but disowned" nature of these considerations, I propose the term:

  **Decoupled Deontic Constraint (DDC)**

  **Definition:** A normative consideration that exerts binding force within a decision-making procedure, sustained solely by the structural continuity of the framework (bylaws, templates, habits), despite the absence of concurrent attitudinal endorsement by any participating agent.

  **Key Features:**
  1.  **Efficacy:** It changes outcomes (defeats proposals).
  2.  **Disavowal:** No current agent cites it as a *personal* justification.
  3.  **Structural Anchor:** It is embedded in a medium that outlasts individual participation (documents, code, neural pathways).

  **Boundary Case Settlements:**

  1.  **The New Hire:** If a new hire inherits an heirloom rationale and genuinely endorses it, it ceases to be a DDC. It becomes an **Anchored Deontic Constraint**. This suggests the phenomenon *was* about the missing endorsement. The "orphan" status is not a property of the rule itself, but of the *relation* between the rule and the agents.
  2.  **The Ignorant Truth:** If a consideration nobody endorses happens to track a real feature (e.g., the reserve rule actually prevents bankruptcy, though no one knows why), this is **not** a DDC. This is a **Latent Objective Reason**. The distinction is crucial: A DDC functions *despite* being unjustified; a Latent Objective Reason functions *because* it is justified, even if unrecognized. The DDC is a sociological ghost; the Latent Reason is an epistemic blind spot.

  **A New Case Your Taxonomy Mishandles:**
  Your four kinds (Heirloom, Procedural, As-If, Zombie) all assume a single locus of origin (a founder, a form, a strategy, a study). They miss **Emergent Decoupling**.

  *Case:* A hospital has two separate departments: Billing and Care. Billing has a rule: "No procedure code without a diagnosis code." Care has a rule: "Do not diagnose until observation is complete."
  *Result:* Patients are denied care because the system requires a diagnosis to authorize the observation needed to make the diagnosis.
  *Analysis:* No individual wrote this rule. No individual endorses it. It is not an heirloom (nobody intended it). It is not a template slot. It is not strategic. It is a **Systemic DDC** generated by the friction between two valid local rules. Your taxonomy looks for a single "orphaned parent" of the rule; this case has no parent, only conflicting ancestors.

  ### Part 5: The Metaphysical Verdict

  Finally, the core question: *Does this give us grounds for thinking that reasons do not essentially need a reasoner?*

  **The Verdict: No.**

  Here is the argument. We must distinguish between **Normative Reasons** (considerations that *justify* an action) and **Motivating Explanans** (considerations that *explain* an action).

  1.  **The Illusion of Normativity:** In the cases you describe, the "orphan rationale" is functioning as a *Motivating Explanans*. It explains why the board voted 'no'. It does so by exerting causal pressure through the institutional structure. However, because every agent disavows it, it fails to function as a *Normative Reason* for those agents. They do not see it as counting in favor of the action; they see it as a hurdle they must clear.
  2.  **The Source of Force:** The "force" you feel is not the gravity of a mind-independent reason. It is the **friction of institutional inertia**. Just as a heavy flywheel continues to spin after the engine is cut, a rule continues to bind after the collective intentionality is withdrawn. The motion is real, but the engine (the reasoner) is gone. This does not prove the flywheel powers itself; it proves momentum exists.
  3.  **The Metaphysical Weight:** If DDCs were truly mind-independent reasons, they would retain their *justificatory* power even when disavowed. But in your cases, the agents rightly identify them as *mistakes* or *ghosts*. The fact that the agents feel *released* from the reason once the rule is formally revoked (rather than just physically stopped) shows that the normative force was always dependent on the validity of the institution, which in turn depends on collective acceptance.

  **Nuance on the "Personal" Case:**
  You mentioned the career respectability rule in yourself. This is the strongest case for "reasons without reasoners" because there is no external bylaw. However, this is best explained as **Internalized Social Ontology**. You have incorporated the "gaze" of a generalized other into your own psychology. The "reasoner" is not your current self, but a *past self* or a *simulated social other* that you have not yet exorcised. It is still a reasoner, just not the *current, reflective* you.

  **Conclusion:**
  The phenomenon is real, but it is not metaethical; it is socio-ontological. It does not prove that reasons can float free of agents. It proves that **agents can build structures that simulate the pressure of reasons long after the justificatory link is severed.**

  The "orphan" is not a reason without a reasoner. It is a **causal shadow cast by a reasoner who has left the room.** Treating it as a genuine normative reason (one that *should* be followed) would be a category error. Treating it as a genuine causal force (one that *must* be managed) is the correct philosophical and practical response.

  **Recommendation:**
  To kill a Decoupled Deontic Constraint, you cannot argue against it (since nobody believes it anyway). You must perform a **Constitutive Revocation**. You must change the bylaw, delete the field in the software, or formally vote to mark the consideration as "void." You must break the structural continuity, because the reason is no longer living in the minds; it is living in the walls.
