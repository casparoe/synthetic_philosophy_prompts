  When the butcher Ding cuts the ox, he does not look at the joints. He meets the spirit with his own. The artisans look only at the joints. They have a map of the carcass, but they know nothing of the living ox.

  If a thousand men dream a butterfly, is the fluttering less real? If the origin is known, does the wing cease to beat? You mistake the footprint for the walking. The artisans have traced the footprint back to the foot, but they have not taken a single step.

  You fear not-knowing is confusion. I say confusion is trying to own the wind. If the lattice binds all sleepers, then there is no "private" transformation to lose. There is only the Great Transformation, which eats all things and is eaten by none.

  To wake is not to escape the lattice. It is to realize the lattice is woven from your own qi. The butterfly remains. The dreamer remains. Only the question of "who" dissolves like mist in the morning sun. The question vanishes, but the fluttering remains. Do not seek the owner of the dream. Be the dream that dreams itself.
