          *   *Wait, if it hardens, does it remove the tension?* No.
          *   *This distinguishes students who check "Intrinsic Basis" vs students who check "Reactivity".*

  9.  **Final Review against Constraints:**
      *   50 mins? Yes, tight.
      *   Order dependencies? Fink/Mask before Mimicker.
      *   Central Object? Light-Sensitive Crystal (avoids machinery).
      *   Misconceptions pre-empted? CP (start), Mask=Fink (during comparison), Relations (Rifle).
