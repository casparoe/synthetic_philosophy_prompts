      *   *Refining the Order:*
          1.  SCA + CP Pre-emption.
          2.  Crystal Case 1 (Fink).
          3.  Crystal Case 2 (Mask).
          4.  Distinction (Intrinsic Basis vs. Pathway).
          5.  *Then* Mimicker (Reverse-Fink). Why? Because Fink/Mask are both "True D, False Counterfactual." Mimicker is "False D, True Counterfactual." Group the False Negatives first to distinguish them, then introduce the False Positive.
