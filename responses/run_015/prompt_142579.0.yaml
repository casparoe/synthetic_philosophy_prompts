      *   *What breaks if swapped?* If you do Mimicker first, students think the problem is "Counterfactuals are unreliable." They won't see the *structural* difference between Fink (intrinsic loss) and Mask (extrinsic block) because they are busy looking at "Counterfactual != Disposition." You need to establish the *direction* of the analysis failure first.

      *   *Wait, one more detail:* "Rifle whose safety prevents firing... seems more, not less, disposed to fire for having it."
      *   *Interpretation:* This is about *functional* dispositions. A rifle *with* a safety is a better rifle. But the safety prevents firing.
      *   *Stress Test:* If the safety is a Mask, the rifle is disposed to fire. If the safety is part of the *definition* of the rifle's firing conditions (disposed to fire *iff* safety off), then the safety isn't a mask, it's a condition of the stimulus.
      *   *I will use this to challenge the "Simple" in Simple Conditional Analysis.*

      *   *Ready to write.*
