  ### Seminar Plan: Finks, Masks, and the Limits of Conditionals

  **Time:** 50 Minutes
  **Central Object:** A **Photo-Chromatic Crystal** (The "Glow-Stone").
  **Disposition:** To luminesce (glow).
  **Stimulus:** Exposure to UV light.
  **Manifestation:** Emitting visible light.

  ---

  ### 1. Sequence and Dependencies (0–5 mins)

  **Order of Introduction:**
  1.  **SCA Recap:** $D \leftrightarrow (S \square\rightarrow R)$.
  2.  **Fink Case** (Intrinsic loss).
  3.  **Mask Case** (Extrinsic block).
  4.  **Distinction** (Basis vs. Pathway).
  5.  **Mimicker/Reverse-Fink Case** (False positive).
  6.  **Stress Test** (Rifle Safety).
  7.  **Discrimination Case** (Sensitive Mask).

  **Why this order?**
  Finks and Masks are both **False Negatives** (The object has the disposition, but the counterfactual is false). They must be grouped to show that $D \rightarrow (S \square\rightarrow R)$ fails for two *structurally different* reasons. The Mimicker is a **False Positive** ($(S \square\rightarrow R) \rightarrow D$ fails).
  **What breaks if you swap them?** If you introduce the Mimicker before distinguishing Fink from Mask, students will collapse all three into "The Counterfactual is unreliable." They will miss the ontological distinction (Intrinsic Basis vs. Extrinsic Pathway) which is required to solve the Rifle Safety stress test later. You must split the False Negatives *before* introducing the False Positive.

  **Pre-emption: The *Ceteris Paribus* Fix**
  *   **Point:** Immediately after SCA recap, before the Glow-Stone.
  *   **Action:** Ask: "Can't we just add 'all else being equal' to the conditional?"
  *   **Response:** State clearly: "No. 'All else being equal' is just a label for 'no finks and no masks.' Using it makes the analysis circular."
  *   **Why:** Prevents them from dismissing the cases as "abnormal conditions."

  ---

  ### 2. The Central Object and Epicycles (5–25 mins)

  **Object:** The **Glow-Stone**.
  *   **Must Have:** A clear intrinsic causal basis (molecular lattice structure) that produces the manifestation (light) when stimulated (UV).
  *   **Must Lack:** External machinery, agents, or "devices" that look like independent actors. The interference must be a property of the setup, not a "machine" that upstages the stone.
  *   **Why the Live Wire Failed:** The "cut-out device" was an external agent. Students focused on the *device's intention* rather than the *wire's disposition*. The Glow-Stone removes the "machine"; the interference is law-like or structural.

  **Epicycle 1: The Fink (5–15 mins)**
  *   **Scenario:** The Glow-Stone is chemically unstable. The moment UV light hits it, its molecular lattice instantly rearranges into inert lead.
  *   **Result:** UV hits $\rightarrow$ Disposition vanishes $\rightarrow$ No Glow.
  *   **Key Question:** "Does the stone remain a Glow-Stone during the stimulus?" (No).
  *   **Disposition = Basis Strategy:** **Let this surface.** When students say "But it's not a Glow-Stone anymore," validate them. "Exactly. The Fink removes the *basis*. The disposition is gone." Use their intuition to define the Fink: *Stimulus removes the intrinsic basis.*

  **Epicycle 2: The Mask (15–25 mins)**
  *   **Scenario:** The Glow-Stone is placed inside a perfect UV-filter box. The lattice remains intact. UV hits the box, not the stone.
  *   **Result:** Stimulus attempted $\rightarrow$ Disposition remains $\rightarrow$ No Glow (blocked).
  *   **Key Question:** "If we remove the box *after* the attempt, is the stone still ready to glow?" (Yes).
  *   **Distinction:** Fink = Basis destroyed. Mask = Pathway blocked.
  *   **Pre-emption: Mask = Approved Fink**
      *   **Point:** During the comparison of Epicycle 1 & 2.
      *   **Action:** Ask: "Is a mask just a fink we like?"
      *   **Correction:** "No. In the Mask case, the stone *still has the power*. In the Fink case, it *lost the power*. One is a loss of property, the other is a blockage of output."

  ---

  ### 3. The Mimicker / Reverse-Fink (25–35 mins)

  **Epicycle 3: The Mimicker**
  *   **Scenario:** A piece of ordinary Lead. It is *not* a Glow-Stone. However, it is coated with a chemical that flashes brightly *upon contact* with UV.
  *   **Result:** UV hits $\rightarrow$ No Disposition $\rightarrow$ Glow happens.
  *   **Logic:** This attacks the right-to-left direction: $(S \square\rightarrow R) \rightarrow D$.
  *   **Why Here?** Now that they see Fink/Mask break the left-to-right direction, this shows the analysis is broken *both ways*. It prevents them from thinking "Dispositions are just conditionals that need tweaking."

  ---

  ### 4. The Stress Test: The Rifle Safety (35–45 mins)

  **The Case:** A rifle is disposed to fire when the trigger is pulled. It has a safety catch. When the safety is *on*, pulling the trigger does nothing.
  **The Twist:** A rifle *with* a safety is a *better* rifle (more disposed to function reliably as a rifle) than one without.
  **The Trap:** Students will say the safety is a Mask (it prevents firing).
  **The Stress:**
  1.  Ask: "Is the firing pin disconnected when the safety is on?" (Yes).
  2.  Ask: "Is the intrinsic basis of firing (the connected mechanism) intact?" (No).
  3.  **Conclusion:** The safety is **not a Mask**. It alters the *configuration of the basis*. The rifle is not disposed to fire *in that state*.
  4.  **Pre-emption: Dispositions = Relations**
      *   **Point:** During this analysis.
      *   **Misconception:** "So the disposition is just a relation to the safety catch position."
      *   **Correction:** "No. The disposition is intrinsic to the *mechanism*. The safety changes the mechanism's state. If you say it's a relation, you can't explain why the rifle is *better* for having the safety. It's disposed to fire *safely*, not just *to fire*."
      *   **Goal:** Force them to see that some "interferences" are actually *constitutive conditions* of the disposition, not external masks.

  ---

  ### 5. Final Discrimination Case (45–50 mins)

  **The Case:** **The "Reactive Foam" Vase.**
  *   **Object:** A Fragile Vase.
  *   **Setup:** It is wrapped in special foam.
  *   **Mechanism:** The foam is inert *unless* it detects a high-velocity impact. If an impact is detected, the foam instantly hardens into steel.
  *   **Event:** A hammer strikes the vase. The foam detects it, hardens, and the vase does not break.
  *   **Question:** Is the foam a **Fink** or a **Mask**?

  **The Discrimination:**
  *   **Students with Labels:** Will say **Fink**. "It reacts to the stimulus! It changes upon impact!" (They focus on the *timing/reactivity*).
  *   **Students with Distinction:** Will say **Mask**. "The vase's molecular structure (basis) never changed. The foam blocked the force (pathway). The reactivity of the foam doesn't make it a Fink; only the loss of the vase's fragility does."
  *   **Why this works:** It decouples "Reactivity to Stimulus" (which looks Finkish) from "Loss of Intrinsic Basis" (which *is* Finkish). It tests if they understand the *ontological* difference, not just the temporal one.

  ---

  ### 6. What to Refuse to Explain

  **Topic:** **The Metaphysical Ground of Dispositions.**
  **Statement:** "I will not explain *what* the disposition is made of today—whether it is a primitive power, a categorical property, or a reduced conditional. We are analyzing the *logic of the analysis* (SCA), not the *ontology of the property*."
  **Reason:** This debate (Categoricalism vs. Dispositionalism) consumes entire courses. Engaging with it here will collapse the Fink/Mask distinction into a verbal dispute about "real properties," preventing the logical analysis of the conditional.

  ---

  ### Summary of Misconception Pre-emptions

  | Misconception | Pre-emption Point | Strategy |
  | :--- | :--- | :--- |
  | **"Add *Ceteris Paribus*"** | **Min 5** (Post-SCA) | Declare it circular: "Normal conditions" = "No Finks/Masks." |
  | **"Mask = Fink we approve"** | **Min 20** (Fink vs Mask) | Focus on *Basis Integrity*: Mask keeps basis, Fink kills it. |
  | **"Dispositions = Relations"** | **Min 40** (Rifle Test) | Use the "Better Rifle" intuition to show the safety is a *state change*, not an external relation. |
  | **"Disposition = Basis"** | **Min 10** (Fink Case) | **Let it surface.** Use it to define the Fink ("The basis is gone"). |

  ### Contingency: If the "Disposition = Basis" Collapse Happens Early
  If students insist "Fragility *is* the molecular structure" in the first 5 minutes:
  *   **Do not fight.** Say: "Fine. Let $D$ = Structure. In the Fink case, the Structure vanishes. In the Mask case, the Structure remains. The SCA still fails in both because the Counterfactual is false while $D$ is true (in the Mask). We still need to distinguish *why* the Counterfactual fails."
  *   This preserves the seminar goal (SCA analysis) without getting bogged down in metaphysics.
