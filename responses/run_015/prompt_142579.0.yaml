          7.  Final Case.

      *   *Refining the "Disposition = Basis" Strategy:*
          *   Let it surface in the Fink/Mask distinction phase. "Is the crystal still the same crystal?"
          *   If they say "Yes," ask "Then why didn't it glow?" (Leads to Mask).
          *   If they say "No," ask "When did it change?" (Leads to Fink).

      *   *Refining the Rifle Safety:*
          *   Rifle is disposed to fire. Safety is on. Trigger pulled. No fire.
          *   Is Safety a Mask?
          *   If students say "Yes," ask: "Is the firing pin disconnected?" If yes, the *intrinsic basis* (mechanical connection) is altered. That's Fink-ish (or just 'not disposed').
          *   If students say "No, it's still a rifle," press on the *current* disposition vs *type* disposition.
          *   *Goal:* Show that some "masks" are actually part of the *definition* of the disposition's basis (the rifle is disposed to fire *when safety is off*). This tests if they see the disposition as specific or general.

      *   *Final Discrimination Case:*
          *   Needs to separate "Learned Labels" from "Understanding."
          *   *Idea:* A case that looks like a Mask but is a Fink, or vice versa, based on *timing* or *intrinsicality*.
          *   *Case:* A pill that cures a disease. The disease is disposed to kill.
          *   *Better:* **The Shy Iron.**
