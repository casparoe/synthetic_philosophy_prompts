          *   Disposition: Breaking.
          *   Stimulus: Strike.
          *   Mechanism: Upon strike, the vase enters a superposition where it is both broken and unbroken, but observation reveals unbroken.
          *   *Too physics-heavy.*
          *   *Let's go with:* **The "Compliant Steel".**
          *   Disposition: Bending (malleability).
          *   Stimulus: Hammer strike.
          *   *Fink:* Steel turns to rubber *on impact*.
          *   *Mask:* Steel is backed by a rigid anvil (doesn't bend, but stays malleable).
          *   *Discriminator:* **The "Reluctant Spring".**
          *   Disposition: Snapping back.
          *   Stimulus: Stretching.
          *   Case: The spring is stretched. It *wants* to snap back (basis intact). But it is coated in a glue that hardens *only when the spring tries to move*.
          *   *Question:* Is the glue a Fink or a Mask?
          *   *Analysis:* The glue hardens *upon the manifestation attempt*. It removes the ability to move. It acts on the *pathway*. But it reacts to the *stimulus/manifestation*.
