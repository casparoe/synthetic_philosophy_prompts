      *Focus on the Math/Morality gap:* This is the specific case. How does a math-trained bot talk morals? Aris: It found isomorphisms. Voss: It's mimicking the form without the substance.

  5.  **Final Polish:** Check against constraints. No citations. Ensure the specific objections (circularity, normative vs. psychological, misunderstanding vs. error) are hit.

