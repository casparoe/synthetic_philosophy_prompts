      *   *The "Successive Statues" Objection:* If every micro-change creates a new constituting relation, do we get a new statue? Baker says no, the *same* statue stands in constitution relations to different matter over time. But critics say this is just a way of hiding perdurantism. I should highlight this tension.
      *   *The "Dominance" View:* Make sure to emphasize the *suppression* of the clay's sortal. The clay doesn't disappear, but its identity is subsumed. This explains why we don't count "Clay + Resin" as a separate object competing with the Statue.

  6.  **Final Polish:**
