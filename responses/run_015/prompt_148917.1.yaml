          *   *Ontology:* Avoids coincidence. Only one thing exists there.

      *   *Section 3: Comparative Evaluation.*
          *   *Coherence:* DH seems more coherent for *internal* replacement where form is stable. CV is better at distinguishing modal properties (Statue could have been made of bronze) but struggles with *actual* material turnover without implying object succession.
          *   *Arbitrariness:* CV faces the "How much matter?" problem. DH faces the "How much form?" problem. The latter is arguably more aligned with our artifact concepts.
          *   *Ontological Cost:* CV pays with coincident objects ($S$ and $C$). DH pays with metaphysical "Form" (which some find spooky, but the prompt assumes DH as a given framework).
          *   *Conclusion:* DH offers a leaner ontology and better fits the intuition of artifact persistence through material turnover, provided one accepts hylomorphic metaphysics. CV is more robust on modal distinctions but clunkier on diachronic identity in this specific case.

