      *   *Quinean Underdetermination:* Data doesn't dictate theory. Auxiliary hypotheses can always save a theory.
      *   *Causal Inference Framework:* Potential Outcomes (Neyman-Rubin) vs. Structural Causal Models (Pearl/DAGs). TTE leans heavily on Potential Outcomes + Inverse Probability Weighting (IPW) / G-methods.
      *   *The "Vibe":* Regulatory bodies (FDA) like TTE because it imposes *discipline*. It's not that the data changes, but the *question* becomes sharper.
      *   *The Tension:* TTE claims to reduce bias, but can it ever eliminate *unmeasured* confounding? No. So how does it claim "causal clarity"? It claims *conceptual* clarity, not necessarily *ontological* certainty.

