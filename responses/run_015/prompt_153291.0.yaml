  8.  *(Self-Correction during drafting)*: I initially thought about saying Max EV is always wrong for repeated bets. That's not true. If you can bet size independent of wealth (additive bets), Max EV is fine. Kelly applies to *multiplicative* dynamics (proportional betting). I must emphasize the *multiplicative* nature of the wealth dynamics in the analysis. The engine analogy implies fuel consumption is proportional to distance/speed, which fits multiplicative, but needs explicit stating.

