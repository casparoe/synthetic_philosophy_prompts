      *   *Refining the "Mortality" point:* If the horizon is finite (I die in 10 years), Kelly might be too conservative. Fractional Kelly is often better. The analogy implies an *infinite* voyage. This is a critical disanalogy.

  7.  **Final Polish:** Check against all constraints in the prompt.
