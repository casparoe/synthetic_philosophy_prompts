  # Activity: The Stabilization Protocol

  ## 1. The Setup

  **Scenario:** The class is divided into three competing "Engineering Councils" (6 students each). They are managing a remote reactor core ("The Box") that is showing signs of instability. Their goal is to keep the reactor **Online** at the end of the session.

  **Materials:**
  *   **3 Team Packets:** Each contains 1 "Observation Lexicon," 3 "Intervention Tokens," 1 "Decision Slate," and 6 "Data Log Cards."
  *   **Instructor Materials:** A "Master Log" (sealed envelope containing the hidden truth), a whiteboard for public data, a timer.
  *   **The Manuals:** Two printed sheets distributed to *all* teams at the start.
      *   *Manual $\alpha$:* "Type $\alpha$ cores hum passively. If Injected, they Stabilize."
      *   *Manual $\beta$:* "Type $\beta$ cores hum passively. If Injected, they Overload."
  *   **The Lexicon:** A printed list of permitted observation terms: `[Silent]`, `[Hum]`, `[Shake]`.
      *   *Constraint:* If the reactor exhibits a behavior not on this list, the team cannot record it unless they spend a Token to "Calibrate Sensors." Calibrating allows them to add *one* new term to their Lexicon for the rest of the game (e.g., `[Staccato-Hum]`).

  **Timeline (80 Minutes):**

  *   **00:00 – 00:10 (Setup):** Divide into 3 teams. Distribute packets. Read the Manuals. Explain the goal: Maximize "System Integrity Points" (SIP).
      *   *Scoring Rule:* System Online at end = +100 SIP. System Overload/Meltdown = -100 SIP. Spending a Token = -10 SIP.
      *   *Intervention Rule:* At minute 50, teams must submit a Decision Slate: `[INJECT]` or `[HOLD]`. This is irreversible.
  *   **00:10 – 00:30 (Passive Observation):** You (Instructor) announce the reactor's state every 3 minutes (7 rounds total).
      *   *Public Data:* You write `[Hum]` on the board every time.
      *   *Private Data:* On the Team Data Log Cards, you write `[Hum]` for Teams 1 and 2. For Team 3, you write `[Hum]` but verbally whisper "It sounds... rhythmic" (planting doubt without violating the Lexicon).
      *   *Constraint:* Students must record observations using *only* the Lexicon. If they write `[Rhythmic]`, you circle it and mark "Invalid Category."
  *   **00:30 – 00:50 (The Token Market & Deliberation):** Teams realize `[Hum]` fits both Manual $\alpha$ and Manual $\beta$ perfectly (Underdetermination).
      *   They may spend Tokens to Calibrate Sensors (add a new category).
      *   They must debate whether to Intervene (`[INJECT]`).
      *   *Rule:* Decision must be unanimous. They must write a 2-sentence justification on the Slate referencing their Data Logs.
  *   **00:50 – 01:00 (The Intervention):** Collect Slates. Do not reveal outcomes yet.
  *   **01:00 – 01:20 (Scoring & Debrief):** Reveal the Master Log. Score the teams. Conduct the philosophical debrief.

  **The Hidden Data Stream (Instructor Only):**
  *   **Truth:** The Core is Type $\alpha$ (Injection is good).
  *   **The Twist:** The Core is actually emitting a `[Staccato-Hum]`.
  *   **Resolution:**
      *   If a team Injects: System Stabilizes (+100).
      *   If a team Holds: System Meltdowns (-100).
      *   *Crucial:* If a team Injects *without* buying the `[Staccato]` category, they get +100 but you note in debrief they were "Blind Lucky." If they buy `[Staccato]` and Inject, they get +90 (100 - 10 token).

  ## 2. The Debrief

  Do not use the words *underdetermination*, *Quine*, *Duhem*, or *theory-laden* until the final 5 minutes.

  **Phase 1: The Scoreboard (5 mins)**
  Reveal the Master Log. The Core was Type $\alpha$. Injection was required.
  *   **Team 1 (Conservative):** Did not buy Token. Recorded `[Hum]`. Followed Manual $\beta$ (safer). Held. **Score: -100.**
  *   **Team 2 (Scientific):** Bought Token. Recorded `[Staccato-Hum]`. Matched to Manual $\alpha$. Injected. **Score: +90.**
  *   **Team 3 (Gambler):** Did not buy Token. Recorded `[Hum]`. Ignored Manuals. Flipped a coin/Gut feeling. Injected. **Score: +100.**

  Ask Team 3: "Why did you inject?" (Likely: "We had to do something," or "It felt right.")
  Ask Team 2: "You spent resources to see what Team 3 ignored. You scored lower. Was your expenditure wasted?"

  **Phase 2: Mapping the Collision (15 mins)**
  *   **The Weak Reading (Poverty of Data):** Ask Team 1 why they held. They will say, "We didn't have enough information. `[Hum]` is too vague."
      *   *Point:* This is the "temporary" reading. They believe if they just waited longer, `[Hum]` would turn into something else.
  *   **The Vocabulary Artifact:** Ask Team 2 when the decision became possible. They will say, "When we bought `[Staccato]`."
      *   *Point:* The underdetermination wasn't in the world (the core was always Type $\alpha$); it was in the *Lexicon*. But notice: Buying `[Staccato]` was a *costly choice*. You had to hypothesize that a distinction *existed* before you could measure it. That hypothesis was not given by the data.
  *   **The Observation-Intervention Asymmetry:** Point out that Manual $\alpha$ and $\beta$ agreed on every single observation round (00:10–00:30).
      *   *Point:* Passive observation *could not* distinguish the theories, even with perfect recording. Only an intervention (changing the system) could test them. But you had to choose the intervention *before* knowing the outcome.
  *   **The Sting (Right for Wrong Reason):** Address Team 3's win.
      *   *Point:* Team 3 won more points than Team 2. If science is about winning, Team 3 is the model. But if we run this 100 times, Team 3 melts down 50 times. Team 2 stabilizes 95 times.
      *   *Concept:* Evidence does not *force* the conclusion (Team 2 still had to interpret `[Staccato]` as matching Manual $\alpha$). But evidence *constrains* reliability.

  **Phase 3: Naming the Beast (5 mins)**
  Now introduce the terminology.
  *   **Underdetermination:** The gap between the `[Hum]` data and the choice of Manual.
  *   **Theory-Laden Observation:** The decision to buy the `[Staccato]` token. You couldn't see the distinction until you paid for the concept.
  *   **Virtues (Simplicity, etc.):** Team 1 chose Simplicity (don't spend tokens, don't intervene). Team 2 chose Fruitfulness (spend to gain control). These are not evidential; they are pragmatic tie-breakers.

  **Final Takeaway:** "A working scientist in this situation does not wait for the data to speak (it won't). They propose a new vocabulary (Token), justify the cost by the potential control it offers (Intervention), and accept that their 'truth' is the one that keeps the reactor online reliably, not the one that wins a single lucky round."

  ## 3. Forecast of Failure & Mitigation

  **Failure 1: Meta-gaming the Instructor.**
  *   *Risk:* Students ask, "What do *you* think is happening?" or "Is Manual $\alpha$ the real one?"
  *   *Mitigation:* **The Black Box Rule.** State at minute 00:05: "I am not the Designer. I am the Sensor. I cannot interpret the data, only report it. If you ask me for a hint, I must charge a Token." This makes extracting authority costly.

  **Failure 2: Group Split / Assertion.**
  *   *Risk:* Teams split 3-vs-3 and deadlock, or one dominant student dictates the choice.
  *   *Mitigation:* **The Signature Rule.** The Decision Slate requires *all six* signatures. If one is missing, the team is disqualified (Score -100). This forces internal negotiation about *why* they are choosing, surfacing the theoretical commitments.

  **Failure 3: "Science is Arbitrary" (The Team 3 Problem).**
  *   *Risk:* Students conclude that since Team 3 won with a guess, theory is useless.
  *   *Mitigation:* **The Reliability Counter.** During debrief, do not focus on the *points*. Focus on the *variance*. Ask: "Would you hire Team 3 to manage a nuclear plant?" This shifts the metric from "Truth as Winning" to "Truth as Reliability." It shows that theoretical virtues (consilience) are risk-management tools, not just aesthetic preferences.

  **Failure 4: The Vocabulary Feels Fake.**
  *   *Risk:* Students feel buying `[Staccato]` is just "getting more data," missing the point that the *category itself* is a theoretical commitment.
  *   *Mitigation:* **The Translation Trap.** In the debrief, reveal that Manual $\alpha$ was written in the *old* language. Team 2 had to *translate* `[Staccato]` into `[Hum-Type-1]` to use the Manual. That translation step is where the theory entered. Emphasize that the Token didn't give them the answer; it gave them the *words to argue for the answer*.

  ## 4. Limitations (Instructor Note)

  Be prepared to supply these in the final discussion, as the activity cannot simulate them:

  1.  **The Web of Belief:** In this activity, the "Manuals" are isolated rules. In real science, rejecting Manual $\alpha$ might require rejecting chemistry, optics, or math. The "cost" of changing theory is usually much higher than a token.
  2.  **Background Commitments:** The teams here start as blank slates. Real scientists share a "form of life" (Wittgenstein) or "paradigm" (Kuhn) that makes Manual $\alpha$ seem obvious and Manual $\beta$ absurd before the game even starts. The activity makes the choice look harder than it usually is.
  3.  **Global Skepticism:** This activity assumes the Reactor exists and the Master Log is real. It does not address the Cartesian worry that the Reactor is a dream. Clarify that Underdetermination is about *rival realisms*, not *realism vs. illusion*.

  **Final Instruction to Instructor:**
  When Team 3 wins, do not smile. Look concerned. Say, "You survived. But you don't know why. Do you feel safe?" Let that silence do the work of the lecture.
