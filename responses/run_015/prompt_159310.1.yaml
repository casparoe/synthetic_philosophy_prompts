answer: |-
  ### Defense Prep Sheet: Chapter 3 (Interventional Reflection)

  **Strategy Note:** You have 20 minutes for Q&A. That is roughly 3 minutes per question if you get 6 serious interventions. You cannot win every point. Your goal is to show the *coherence* of the proposal and its *advantage* over the status quo in loop cases, not to prove it solves every diachronic problem in epistemology.

  ---

  ### 1. Early Concessions (First 5 Minutes)
  *Do not wait to be cornered on these. Weave them into your opening remarks or the first answer to define the battlefield.*

  *   **Concede Scope:** Interventional Reflection (IR) is not a replacement for all diachronic norms. It does not solve forgetting, evidence loss, or irrationality (the "Pill Case"). It is specifically a repair for *causal feedback loops*. If you try to claim it solves the Sleeping Beauty problem or arbitrary belief revision, you will be shredded.
  *   **Concede Psychological Realism:** Do not claim agents can literally perform a $do()$ operation on their own brains in real-time. Frame the intervention as a *normative standard* for coherence, analogous to how expected utility theory is a norm despite humans not calculating integrals.
  *   **Concede the van Fraassenian Point:** Acknowledge that in non-loop cases, IR collapses to Standard Reflection. You are not overthrowing van Fraassen; you are extending the domain of his insight to causal environments he didn't model.

  ---

  ### 2. The One Reply That Must Land
  **The Objection:** *The Dutch Strategy Survival (External Examiner)*
  "If Reflection is motivated by immunity to Dutch Strategies, does your intervention preserve that? If I bet against you based on your *actual* future credence, but you defer to your *intervened* future credence, the odds won't match the payout. You've blocked the money pump only by changing the betting rules."

  **The Reply (2 Minutes):**
  "The Dutch Strategy argument relies on the assumption that your future self acts on their credence. In loop cases, Standard Reflection fails because the *act* of holding the credence changes the truth conditions. My proposal separates the *epistemic evaluation* from the *causal impact*.
  If we construct the Dutch Book scenario such that the bookie knows the intervention protocol, the book is fair. The incoherence Standard Reflection identifies in loop cases is a result of conflating the *predictive* value of a credence with its *causal* value. IR restores coherence by ensuring you defer to the credence that *would* track the truth if it weren't distorting it. We keep the pragmatic motivation, but we apply it to the stable fixed point, not the unstable equilibrium."

  **Why it must land:** If the pragmatic justification fails, IR looks like a technical hack without normative force. The External Examiner needs to see that rationality is still being served.

  **Soft Spot:** You are assuming the bookie can bet on the *intervened* world. In reality, we live in the *actual* world. If the intervention is counterfactual, how does it protect you from actual losses? *Defense:* Emphasize that the loss in loop cases comes from *instability*, not just losing money. IR stabilizes the agent.

  ---

  ### 3. The Objection List (Ordered by Damage)

  #### 1. The Metaphysics of Intervention
  **Who:** Senior Causal Modeler
  **The Question:** "You're treating credence as a variable in a causal graph. But credence is a doxastic attitude, not a switch. To intervene on $C_{t'}(p)$, you have to sever the incoming arrows from evidence. If you do that, isn't the resulting state just a number, not a belief? How can a norm tell me to defer to a state that isn't responsive to evidence?"
  **The Reply:** "In causal decision theory, we intervene on decision nodes all the time. I'm treating the *formation process* of the credence as the variable. The intervention $do(C_{t'}(p)=x)$ means 'set the credence to $x$ via a process that bypasses the causal feedback loop to $p$, while keeping the evidential intake intact.' It's not erasing evidence; it's blocking the *output* of the belief from looping back to alter the *input*."
  **Honest Note:** This is the weakest metaphysical link. You are asserting that evidence paths can be kept open while causal output paths are cut. In a physical brain, these might be the same mechanism. *Fallback:* "It's a structural idealization, like frictionless planes in physics. It defines the rational ideal, even if implementation is messy."

  #### 2. The Normative Category Error
  **Who:** Philosopher of Science (van Fraassen line)
  **The Question:** "Van Fraassen intended Reflection as a constraint on a *policy* of belief revision, not a description of causal mechanics. Your Central Bank case shows the forecaster is also an actor. That's a point about the pragmatics of assertion or policy, not a failure of the doxastic norm. Why change the epistemology when the problem is just that the agent is speaking into the microphone?"
  **The Reply:** "Because the agent *is* the microphone. In loop cases, the belief state itself is part of the causal machinery of the world. A norm that ignores the agent's causal footprint demands an impossible coherence. If a norm requires me to have a credence that, by virtue of having it, makes itself false, the norm is defective. IR respects the agent's embeddedness in the world."
  **Honest Note:** She may not buy that epistemology should care about causal embeddedness. *Fallback:* "Even if it's a policy constraint, the policy must be feasible. Standard Reflection demands an infeasible policy in loop cases."

  #### 3. Deliberation Crowds Out Prediction
  **Who:** Senior Causal Modeler
  **The Question:** "Spohn and others argue you can't use causal models to predict your own decisions because the calculation of the prediction is part of the decision process. If you are calculating what your credence *would be* under intervention, aren't you just forming that credence now? Doesn't the calculation collapse the intervention?"
  **The Reply:** "There's a distinction between the *object* credence (in $p$) and the *meta* credence (in what my future credence would be). I am not calculating $p$ now; I am calculating the stability condition of my future self. The intervention is a hypothetical evaluation of a future state, not the formation of the current belief."
  **Honest Note:** This is a tightrope walk. If the examiner presses that the *act* of modeling yourself changes the model, you have to concede that IR applies to *idealized* agents, not necessarily bounded ones.

  #### 4. The "Pill Case" Limitation
  **Who:** Grad Student (Attached to the Pill Case)
  **The Question:** "Consider the case where I know I'll take a pill that makes me confident of Heads, regardless of the coin. Standard Reflection fails here. Does your Interventional Reflection fix this? Because it looks like there's no causal loop from my belief to the coin."
  **The Reply:** "No, and it shouldn't. IR is designed for *causal loops*, where your belief affects the truth. The Pill Case is an *external manipulation* case. That's a different failure mode (loss of reliability), not a failure of stability. IR isn't a panacea for all Reflection failures; it's a specific repair for causal feedback. For the Pill Case, we need a different constraint, like Newcomb-aware conditioning."
  **Honest Note:** This reduces the scope of your chapter. *Mitigation:* Frame this as a virtue. "A scalpel is better than a hammer. I'm solving the loop problem, not every diachronic problem."

  #### 5. Vacuity / Triviality
  **Who:** External Examiner
  **The Question:** "Isn't Interventional Reflection just Conditionalization on the proposition that an intervention occurred? If so, haven't you just reduced Reflection to Conditionalization, which is what I already thought? What work is 'Intervention' actually doing?"
  **The Reply:** "It's not vacuous because standard Conditionalization can't handle the loop. If I conditionalize on 'My future credence is $x$', in a loop case, that evidence is contaminated by the causal effect of the credence. The $do()$ operator explicitly filters out that contamination. It yields a different value than standard conditionalization in loop cases, which is why it's substantive."
  **Honest Note:** Ensure you have a formal example ready where $C(p | C'=x) \neq C(p | do(C'=x))$. If they are equal in your examples, you're in trouble.

  #### 6. De Se and Forgetting
  **Who:** Recent Hire (Self-locating)
  **The Question:** "How does the intervention handle *de se* propositions? If I forget who I am, is that a loop? If I intervene to set my credence that 'I am in Room A', do I lose the self-locating content?"
  **The Reply:** "Forgetting is evidence loss, not a causal loop. The intervention blocks causal paths from belief to *truth*. Forgetting blocks paths from *truth* to belief. They are opposites. IR doesn't apply to forgetting. For *de se*, the intervention sets the credence in the centered proposition without altering the center itself. The 'I' remains fixed; only the causal impact of the 'I' on the world is blocked."
  **Honest Note:** Don't try to solve forgetting here. If she pushes, concede: "IR is silent on forgetting. That's a job for Shoham or Arntzenius."

  #### 7. Dutch Books Show Nothing
  **Who:** Grad Student (Skeptic)
  **The Question:** "You're relying on Dutch Strategies to motivate this. But Dutch Books only show inconsistency in betting behavior, not epistemic irrationality. Why should I care about your fix if the pragmatic motivation is flawed?"
  **The Reply:** "I agree Dutch Books aren't *constitutive* of irrationality. But they are a *symptom*. If a norm guarantees you can be pumped for money in a stable environment, that norm is suspect. IR removes the symptom in loop cases. Even if you reject the pragmatic foundation, the structural instability of Standard Reflection in loops remains a theoretical cost IR resolves."
  **Honest Note:** Don't fight this war. It's not your chapter's core. Dismiss gently and move to structural coherence.

  ---

  ### 4. The Dreaded Question
  **The Question:** "If you intervene to set your credence to $x$, you have severed the link between your evidence and your belief. You are deferring to a future state that is, by definition, not evidence-responsive. Why is *that* state epistemically authoritative? Why should your current self trust a future self that is holding a belief 'by hand'?"

  **Why it's deadly:** It attacks the core epistemic value of the intervened state. If the intervened credence isn't "truth-tracking" in the usual sense, why defer to it?

  **The Prepared Reply:**
  "Because in loop cases, the *natural* evidence-responsive process is distorted by the feedback loop. The 'by hand' state is actually *more* truth-tracking than the natural state, because the natural state is self-defeating.
  Think of the Central Bank case: If the Bank sets inflation expectations 'by hand' (ignoring the feedback), they predict inflation accurately. If they let expectations form naturally, the feedback loop distorts the prediction. The intervention restores the evidential link that the loop severs. We defer to the intervened state *because* it is the only one that isn't corrupted by the agent's own causal footprint."

  **Honest Note:** This relies on the claim that the loop *corrupts* the natural process. If the examiner argues the loop is just "how the world is," you need to stand firm that rationality requires *stability*, and only the intervened state offers stability.

  ---

  ### Final Tactical Advice
  *   **When stuck:** "That's a compelling objection regarding [X]. In this chapter, I'm focusing on the stability condition in causal loops. I think [X] might require a separate constraint, but it doesn't negate the need for IR in the loop cases."
  *   **Watch the External:** If they look satisfied with the Dutch Book reply, you've passed. If they keep circling back to it, they aren't convinced.
  *   **Watch the Causal Modeler:** If she asks for the graph, draw it immediately. Node $C$ (Credence), Node $P$ (Proposition), Arrow $C \to P$ (Causal), Arrow $P \to C$ (Evidential). Intervention cuts $C \to P$. Keep it visible.

  Good luck. You know the material. Don't let them expand the scope beyond causal loops.
