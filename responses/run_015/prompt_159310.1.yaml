          *   *Weakness:* Risk of triviality.

      *   *Selection:* I need to pick the top 7-8 by *damage*.
          1.  Dutch Strategy Survival (External) - High Damage.
          2.  Coherence of Intervention on Belief (Causal Modeler) - High Damage.
          3.  Normative Scope/Assertion (van Fraassenian) - Medium/High Damage.
          4.  Vacuity/Triviality (External) - Medium Damage.
          5.  Deliberation Crowds Out Prediction (Causal Modeler) - Medium Damage.
          6.  The Pill Case/Scope Limit (Grad Student) - Low/Medium Damage.
