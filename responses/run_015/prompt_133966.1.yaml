answer: |-
  Risk-weighting functions as local intrapersonal prioritarianism over live possibilities, necessitating recursive evaluation to respect how information reshapes an agent's relative standing.

  On the interpretive claim, if $r$ encodes a priority weighting rather than a taste for uncertainty, its moral force derives from comparing outcomes within the set of possibilities currently open to the agent. A unit of utility matters more if it lifts the agent from the bottom of their *live* options, not the bottom of an ex-ante tree that includes already-refuted disasters. Consequently, the structural claim follows: evaluation must fold backward. At each node, we re-rank continuation values and re-apply $r$, because the set of "worse-off" possibilities shrinks as information eliminates branches. Global evaluation mistakenly assigns priority weight to outcomes that are no longer possible, violating the contrastive nature of priority.

  Regarding objection (i), your arithmetic is correct (26.25 global vs. 28.75 recursive), but the violation of reduction is warranted. Global evaluation compares 40 to 0 and 100; recursive evaluation compares 40 to the secured value of the alternative branch (25). Because priority is contrastive among *live* possibilities, the timing of resolution matters: learning you face (25 vs. 40) is preferable to facing (0 vs. 40 vs. 100) because the worst-case (0) is eliminated earlier. This captures the distinct value of security and relief, which global RWEU flattens. The prospect's value depends on when uncertainty resolves because the agent's relative standing improves as bad possibilities are eliminated; this is not a representational artifact but a feature of how priority tracks live options.

  Regarding objection (ii), the view neither collapses nor is vacuous. It does not degenerate into expected utility with a reshaped $u$ because the weighting depends on the *path* of intermediate rankings, not just terminal probabilities; no static $u^*$ can replicate the path-dependent weights of the recursive tree. It does not approach risk-neutrality when finely grained unless continuity assumptions force linearity, which is not inherent to the model; $r$ remains non-linear at every branching node. The view bites hardest in sequential contexts where intermediate resolution eliminates worst-case scenarios early (e.g., staged medical testing). This is a virtue: it models the intuition that avoiding the *possibility* of disaster now is valuable, even if the ex-ante distribution is identical. Global RWEU cannot distinguish between early and late resolution of uncertainty; recursive RWEU captures the dynamic value of hope and relief inherent in the prioritarian interpretation.
