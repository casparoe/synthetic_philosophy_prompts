answer: |-
  **MEMORANDUM**

  **TO:** Legal Secretary, Northvale Council on Assisted Reproduction
  **FROM:** Legal Analyst
  **SUBJECT:** Precedent Analysis and Recommendation: Pending Polygenic Selection Application
  **DATE:** 24 October 2023

  **1. Derived Rules and Predictions**
  The record supports three operative rules. First, the *Net Welfare Rule*: selection is permissible where there is a net expected benefit to the child, however small, provided it is not speculative (Decisions 1, 4, 5). This rule predicts licensing here, as expert evidence confirms a net well-being gain. Second, the *Source Constraint*: the benefit must accrue to the child, not the parents, and the child's interest operates as a side-constraint rather than a maximand (Decisions 3, 4, 6). This predicts licensing, as parental burden is not the primary driver. Third, the *Nature of Advantage Rule*: advantages derived solely from social positioning are suspect. While avoiding severe, society-wide social penalties is permissible (Decision 2), securing relative rank is doubtful (Decision 7 *obiter*), and ratifying local prejudices is forbidden (Decision 8). Coupled with the unused "interests of children generally" clause, this implies a *Universalisation Test*. This rule predicts refusal, as the gain is explicitly positional and zero-sum. These rules are consistent: welfare must be real (Rule 1), child-focused (Rule 2), and not purely relative (Rule 3).

  **2. Closest Analog**
  Decision 7 (Height) is the closest analog. Like the pending application, it concerned a non-medical trait where the benefit was largely positional. Decision 7 was refused because the evidence failed to show a within-family benefit (genetic nurture). Here, the evidence cures that defect via within-family designs. However, Decision 7 expressly reserved the question of whether positional advantage alone can satisfy the provision. The pending application forces the Council to resolve that reservation. Decision 5 (Polygenic Risk) is methodologically similar but concerned a medical condition, distinguishing it from scholastic rank. Decision 2 (Craniofacial) distinguishes avoiding an absolute social penalty from gaining a relative advantage; thus, it settles only that social factors matter, not that rank optimization is permissible. Decision 7 settles the evidentiary standard but leaves the principled question open.

  **3. Predicted Ruling**
  The Council will likely refuse the licence. While the *Net Welfare Rule* is satisfied, the *Nature of Advantage Rule* combined with the statutory "interests of children generally" clause will prevail. The expert testimony that the payoff is entirely positional (a) and decays if the practice spreads (b) directly engages the unused second clause. Decision 7's doubt regarding relative advantage suggests the Council views welfare as requiring absolute, not merely comparative, improvement. Furthermore, Decision 8's refusal to ratify local prejudice implies a broader reluctance to endorse selection based on social competition rather than medical need. The ruling will depend on interpreting "welfare" to exclude gains that are nullified if universalised, thereby activating the "interests of children generally" clause to prevent an genetic arms race. The trade-off with psychiatric risk (Case 1) is irrelevant if the primary gain is impermissible.

  **4. Recommendation and Principles**
  I recommend refusal. To license would commit the Council to the principle that parental optimization of relative social standing is a valid use of reproductive technology, provided the net welfare calculus is positive. This logically commits the Council to licensing cohort expansion (point f), as Decision 5 permits selection among available embryos to maximize welfare; if more embryos yield more welfare, refusal would be inconsistent. Conversely, refusal adopts the principle that the Council protects the class of children from competitive selection pressures, even where an individual child might gain. This does not require reopening Decision 2. Decision 2 concerned avoiding a severe, reliably imposed stigma (an absolute burden), whereas this application concerns securing a competitive rank (a relative good). Distinguishing absolute harm from relative advantage preserves consistency. Refusal maintains the boundary between medical welfare and social engineering.

  **5. Discriminating Future Application**
  The single further application that best discriminates between the *Net Welfare Rule* and the *Universalisation Test* is: Selection for immunity to a common, non-genetic environmental pathogen where widespread adoption would reduce population genetic diversity, increasing future vulnerability for children generally.
  *   *Net Welfare Rule Prediction:* License. The individual child gains absolute health protection with no positional decay; the net welfare is clear (Decision 1, 5).
  *   *Universalisation Test Prediction:* Refuse. While the individual gains, the "interests of children generally" are harmed by reduced diversity and increased class vulnerability.
  This case isolates the conflict between individual absolute benefit and collective long-term interest, forcing the Council to define the weight of the unused statutory clause.
