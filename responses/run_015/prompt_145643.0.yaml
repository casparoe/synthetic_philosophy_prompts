answer: |-
  ### Pre-Seminar Brainstorm: Audience Mapping & Alliances

  Before diving into the Q&A, here is the landscape of the room. You are walking into a minefield where three distinct epistemic cultures collide.

  *   **International Lawyers (approx. 10):** Their god is *Legal Certainty*. They view the Genocide Convention as a fragile compromise. To them, *dolus specialis* (specific intent) is not a bug; it is the feature that prevents the crime from swallowing all war crimes. They will ally with the Historians on "particularity" but for doctrinal reasons. They fear your "parallel category" creates a treaty nightmare.
  *   **Moral Philosophers (approx. 10):** Their god is *Normative Consistency*. They are worried about "moral grading" (is genocide worse than crimes against humanity?). They are your natural allies on the *problem* (the asymmetry of attention) but will attack your *solution* (does a new label actually create new duties, or is it just semantic shuffling?).
  *   **Historians (approx. 10):** Their god is *Context*. They hate frameworks that flatten distinct events into "structural features." They will worry that "structured group destruction" becomes a catch-all bin that erases the specific ideological motivations of perpetrators.
  *   **The Vocal Opponent:** Likely a strict constructionist Lawyer or a Historian who believes the sanctity of the word "genocide" is the only leverage victims have. They will argue that creating a "junior" category institutionalizes a hierarchy of suffering.

  **Strategic Alliance:** You need the Philosophers to validate the moral asymmetry, while assuring the Lawyers you aren't touching the Criminal Statute (individual guilt), only the State Duty (prevention/intervention). You must assure Historians that "structural features" is an analytical tool, not a historical erasure.

  ***

  ### Q&A Prep Sheet

  #### I. Strategic Concessions (Say these early to build credibility)
  1.  **Concede the Legal Bedrock:** Acknowledge that for *individual criminal liability*, specific intent (*dolus specialis*) is non-negotiable. You are not proposing a new crime for the ICC; you are proposing a new trigger for *state obligation* and *preventive intervention*.
  2.  **Concede the Political Reality:** Admit that states currently ignore the Genocide Convention's prevention duties (Article I) even when genocide is proven. Your argument is not that a new label *guarantees* action, but that the current label *guarantees politicized inaction* due to the stigma of the word.
  3.  **Concede Historical Nuance:** Agree that "structural features" cannot replace historical narrative. It is a diagnostic category for policy, not a replacement for historical memory.

  #### II. The Weakest Point in Your Position
  **The Enforcement Gap:** If states refuse to intervene when "genocide" is legally proven (e.g., Rwanda, Srebrenica), why do you believe they will intervene for "structured group destruction"?
  *   **Defense Strategy:** Do not argue they *will* intervene out of goodness. Argue that the *stigma* of "genocide" causes states to block the designation to avoid the obligation. A less stigmatized, technocratic label ("structured group destruction") lowers the political cost of admission, allowing intervention without the admission of "evil." You are selling a loophole for morality.

  #### III. The "Hope Nobody Asks" Question
  **"Isn't 'Juridical Spotlighting' just a fancy way of saying 'Politics'? If the problem is political will, why do you think a semantic shift will fix it? Are you not just proposing a more sophisticated propaganda tool?"**
  *   **Survival Strategy:** Pivot to *institutional design*. Argue that language constitutes reality in law. The current vocabulary forces a binary (Genocide or Not Genocide). By introducing a parallel category, you break the binary. It's not about fixing political will directly; it's about removing the veto power that the *fear of the label* gives to perpetrator states and their allies in the UN Security Council.

  ***

  #### IV. Objections & Replies (Ordered by Likelihood and Damage)

  **1. The "Dilution" Objection (International Lawyer)**
  *   **Phrasing:** "You claim you aren't diluting genocide, but by creating a parallel category that triggers 'equivalent duties,' you are effectively decoupling the legal consequence from the legal definition. If 'structured group destruction' mandates the same intervention as genocide, what is the practical difference? You are creating a backdoor to expand the Genocide Convention without the state consent required to amend it. Doesn't this undermine the rule of law?"
  *   **2-Minute Reply:** "The difference lies in the subject of the duty, not the object. The Genocide Convention binds states to prevent a specific *crime* committed by *individuals* with specific intent. My proposal binds states to respond to a *structural condition* regardless of individual provability. This isn't a backdoor amendment; it's a complementary track. We keep the criminal definition pure for prosecution, but we acknowledge that state duties to protect populations shouldn't hinge on proving the mindset of a dictator in real-time. We aren't eroding the law; we are admitting that the current law is a poor tool for prevention because it waits for proof of intent that often only exists after the bodies are counted."
  *   **Vulnerability:** This relies on the distinction between individual criminal liability and state responsibility. If they press that the Convention *already* covers state responsibility for prevention, you must argue the *trigger* for that responsibility is currently too high (intent) to be useful.

  **2. The "Hierarchy of Suffering" Objection (Moral Philosopher)**
  *   **Phrasing:** "You argue that 'structured group destruction' triggers equivalent duties. But by giving it a different name, aren't you institutionalizing a two-tiered system of victimhood? You're telling Group A they are victims of 'Genocide' and Group B they are victims of 'Structured Destruction.' Doesn't this validate the very moral grading you claim to oppose? Why not just expand the definition of genocide?"
  *   **2-Minute Reply:** "Because expanding the definition destroys its utility as a mobilizing tool. The power of 'genocide' is its rarity and its moral shock. If we dilute it, we lose the spotlight. My proposal accepts that moral grading exists but seeks to neutralize its *consequences*. Whether you are labeled Genocide or Structured Destruction, the *duty to intervene* remains identical. The label distinguishes the *perpetrator's mindset*, not the *victim's worth*. We preserve the unique horror of specific intent without making the protection of the victims contingent upon it. It separates the commemorative label from the protective obligation."
  *   **Vulnerability:** Philosophers may argue that language *is* reality. If the duties are the same, the names should be the same. You must hold the line that the *name* serves a diagnostic function for intent, while the *duty* serves a protective function for life.

  **3. The "Historical Flattening" Objection (Historian)**
  *   **Phrasing:** "You talk about 'structural features' and 'perpetrator patterns' as if mass violence is a mechanical process. This sounds like a framework that would classify the Holodomor, Rwanda, and the Armenian massacres under the same bureaucratic heading. Doesn't this erase the specific ideological, cultural, and historical contexts that make each event distinct? Are you not prioritizing legal categorization over historical truth?"
  *   **2-Minute Reply:** "I am not proposing this as a replacement for historical memory, but as a tool for real-time policy. Historians look backward to understand *why*; policymakers must look forward to stop *how*. 'Structured group destruction' is a diagnostic category for intervention, not a commemorative one. We can acknowledge the unique ideological hatred in Rwanda while simultaneously recognizing that the *structural mechanism* of blockade and slaughter is identical to a famine caused by negligent siege elsewhere. We need a vocabulary that allows us to act on the structural reality without waiting for the historical verdict on ideology."
  *   **Vulnerability:** Historians hate "presentism." If they argue that ignoring ideology leads to failed intervention (because you don't understand the motive), concede that ideology matters for *strategy*, but structure matters for *triggering* the duty.

  **4. The "Sovereignty" Objection (The Vocal Opponent/Lawyer)**
  *   **Phrasing:** "States reject the genocide label because it threatens their sovereignty. You think they will accept a new category that imposes 'equivalent duties' of intervention? This is naive. If anything, creating a new category gives states another box to check without acting. It creates a 'soft' obligation that allows them to ignore the 'hard' one."
  *   **2-Minute Reply:** "That is precisely why the current system fails. States block the 'genocide' finding to avoid the sovereignty hit. If we offer a category that addresses the *humanitarian catastrophe* without immediately accusing the state of the 'crime of crimes,' we lower the diplomatic barrier to entry. It is not naivety; it is strategic ambiguity. We trade the moral stigma for the practical intervention. If a state accepts a 'Structured Destruction' designation to avoid the 'G-word,' and that acceptance allows peacekeepers to enter, we have saved lives. I am prioritizing the cessation of killing over the purity of the accusation."
  *   **Vulnerability:** This is a cynical argument. If the opponent values moral truth over pragmatic outcomes, they will call this "complicity." Stand firm on the consequentialist ethic: saving lives > naming evil.

  **5. The "Spotlighting" Counter (Philosopher/Lawyer Hybrid)**
  *   **Phrasing:** "You coined the term 'juridical spotlighting' to describe how the genocide label redistributes attention. But doesn't your new category just create a new spotlight? You are still deciding which structural features count. Won't powerful nations simply use 'Structured Destruction' for their enemies and block the designation for their allies, just as they do with Genocide?"
  *   **2-Minute Reply:** "Yes, politics will always infect application. But currently, the veto is binary: either it is Genocide (and we must act) or it is nothing (and we can ignore it). My framework introduces a third option: It is not Genocide, *but* it is Structured Destruction (and we must still act). It narrows the scope of the 'nothing' category. It doesn't eliminate political manipulation, but it reduces the cost of acknowledging violence. It makes it harder to say 'this is nothing' because we now have a category for 'this is destruction without specific intent.' It shrinks the zone of impunity, even if it doesn't eliminate it."
  *   **Vulnerability:** This admits your system isn't perfect. Ensure you emphasize "shrinking the zone of impunity" as the metric of success, not "eliminating politics."

  ***

  ### Final Tactical Advice

  *   **Watch the "Intent" Trap:** Lawyers will try to drag you into a debate about how to prove intent. Refuse. Constantly reiterate: "Intent is for the courtroom. Structure is for the emergency room."
  *   **Defend the "Parallel":** Do not let them convince you to merge the categories. If you merge them, you lose the Lawyers. If you keep them separate but link the *duties*, you keep the Lawyers (legal precision intact) and win the Philosophers (moral duty equalized).
  *   **Tone:** Be humble about the limits of law, but rigorous about the moral cost of the current gap. You are not trying to rewrite the 1948 Convention; you are trying to build a safety net underneath it.
