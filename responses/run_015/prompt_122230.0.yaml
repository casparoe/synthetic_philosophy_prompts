answer: |-
  To determine what a theory of causation must deliver in this tripartite debate, we must separate logical necessities from the philosophical preferences of modern naturalism. The primary task is not to prove that causation exists—all three parties agree events follow events—but to locate the ontological source of that sequence. Many students mistakenly treat the problem of induction as the decisive blow against occasionalism, but this is a category error. Al-Ghazālī saves induction more robustly than Hume ever could. For the Humean, induction is a psychological habit with no rational grounding; for the occasionalist, it is grounded in the consistent will of a faithful God. Therefore, demanding that a theory ground induction in *created natures* rather than *divine consistency* is not a non-negotiable requirement for adequacy; it is a naturalistic preference that begs the question against the theological framework. A theory of causation does not fail simply because it locates the guarantee of regularity in a Agent rather than a substance.

  Similarly, the demand for modal compatibility—the idea that a causal link remains true even if the effect is prevented—is largely analytic metaphysics sneaking in through the back door. While causal-power theorists use masked powers to explain why fire fails to burn wet cotton, occasionalists explain the same phenomenon via divine intervention. Both accounts handle the counterfactual equally well; one appeals to internal constraints, the other to external volition. Insisting that the modal link must reside *within* the object rather than *above* it is not a requirement for logical coherence, but a preference for immanent over transcendent explanation. This desideratum belongs to the camp of those who wish to close the system of nature to external agency, not to those seeking a logically consistent account of event sequences.

  The non-negotiable desiderata are the preservation of the miracle/nature distinction and the avoidance of collapsing law-statements into divine whim. These two are inseparable. If occasionalism is true, there is no ontological difference between a natural event and a miracle; there is only the difference between what God usually does and what God rarely does. This renders the concept of "nature" empty. A robust theory of causation must deliver an account where nature has its own integrity, such that a miracle is a genuine violation of how things *are*, not just a surprise in how things *appear*. Without this, law-statements cease to describe the behavior of creatures and become merely records of divine habit. This collapses physics into theology, not in a harmonious way, but in a way that makes scientific inquiry into created natures impossible because there are no created natures to investigate.

  Therefore, the single desideratum that determines the adequacy of a theory in this debate is the capacity to grant reality to secondary causes. A theory fails if it makes creatures purely passive occasions for divine action. It must explain how created things contribute to their own effects without compromising divine sovereignty. This is not about saving induction or satisfying modal logic; it is about saving the reality of the world. If the fire does not burn the cotton, but God burns the cotton *at the occasion* of the fire, then the fire is an idol, not a cause. A theory of causation must deliver a world that acts, not just a world that is acted upon.

  \answer{The ontological grounding of secondary causal efficacy}

  Verdict: Occasionalism ultimately fails because it preserves divine power at the cost of annihilating the reality of the created order.
