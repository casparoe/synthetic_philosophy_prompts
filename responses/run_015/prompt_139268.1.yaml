answer: |-
  "What the result actually says"
  The theorem states that if investors start with the same basic understanding of how probabilities work and know everyone else is rational, purely speculative trading based on private information cannot happen. If I try to sell you an asset, you realize I must have bad news about it. Since you are rational, you update your view to match mine, lowering your price estimate. If we both reason this way, we agree on the price immediately, leaving no gap for a trade to occur. Crucially, this only applies to speculative bets where we disagree on value due to private information. It assumes we trust each other's reasoning completely and start from the same baseline beliefs. It does not forbid trading for other reasons, like needing cash or balancing risk. The core idea is that information gets shared instantly through the mere offer to trade, neutralizing the advantage before a deal is struck.

  "Line by line"
  The claim that rational people should never trade is too broad. A professional would say rational people should never engage in *speculative* trade based solely on private information. The blog correctly identifies the mechanism: an offer to sell signals negative private information, causing the buyer to lower their valuation. If I know you are rational, I know you know I know, and so on. This infinite recursion means we agree on price before shaking hands. However, it glosses over your second nag. The theorem explicitly excludes trades driven by liquidity needs, risk sharing, or consumption smoothing. You might sell stock to buy a house, not because you think the stock will fall. This is a crucial distinction the blog misses.

  Regarding your first nag: the blog gets the logic slightly backwards. Prices aren't correct *because* nobody trades; rather, the theorem implies that if prices weren't correct, rational traders would exploit the error until it vanished. The theorem suggests that if everyone is perfectly rational, prices adjust instantly to information without needing actual transactions to validate them. In reality, prices become informative *because* people trade on information, not because they don't. The blog conflates the theoretical endpoint (no trade) with the market process (price discovery). It suggests silence proves efficiency, when actually trading activity is what pushes prices toward efficiency.

  There is also a hidden assumption the blog omits: we must start with the same "prior" beliefs about the world. If we fundamentally disagree on how the economy works, the theorem breaks, and trade can happen rationally. The blog assumes we agree on basics but differ on news, which is a narrow case.

  The conclusion that real-world trading implies irrationality is partially true for high-frequency speculative volume, but ignores institutional rebalancing. Pension funds trade to match liabilities, not to gamble. The blog treats all volume as speculative betting, which is factually incorrect. Finally, the advice to use index funds remains sound, but not because trading is impossible, but because beating the market after costs is statistically unlikely. The blog mixes a theoretical puzzle with practical investment advice, conflating "no speculative trade" with "no trade at all." It treats a specific mathematical boundary condition as a description of daily market behavior. While the intuition about overconfidence driving volume is supported by research, the leap to market efficiency relies on assumptions no real market meets. Real markets are efficient enough to make stock picking hard, but not because traders are silent; they are efficient because arbitrageurs act quickly, not because they refuse to act. The blog warns against overconfidence correctly, but misattributes the source of market efficiency.

  "Why real people do trade anyway"
  Real markets are full of rational trades that the theorem excludes. First, liquidity needs drive volume; people sell assets to buy homes or fund retirement, not because they think prices will drop. Second, risk sharing is vital. You might sell a tech stock to buy bonds simply to balance your portfolio, regardless of expected returns. Third, investors have different time horizons; a pension fund buys long-term while a hedge fund trades short-term. Finally, people honestly disagree on fundamental models of the world. The theorem assumes we all start with the same baseline beliefs, but in reality, we interpret data differently. These factors create constant, rational reasons to swap assets. Trading is often about managing life, not just beating the market.

  "Verdict"
  The blog's investment advice is solid, but its reasoning is shaky. You should likely use index funds, but not because rational trading is impossible. You should do it because transaction costs and fees eat away profits, and identifying mispriced assets is incredibly hard. The theorem correctly highlights that overconfidence drives excessive trading, warning you against gambling on private hunches. However, its claim that prices are perfect because nobody trades is backwards; prices are useful because people do trade. So, take the warning about hubris to heart, but ignore the claim that markets are magically efficient without activity. The conclusion holds, but the proof provided is flawed.
