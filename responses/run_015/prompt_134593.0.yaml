answer: |-
  The standard caricature of Confucian ethics paints it as a hierarchy of blind obedience, where the subordinate swallows their conscience to preserve the chain of command. This reading treats roles as static positions of power rather than dynamic processes of becoming. If we take Confucian role ethics seriously, however, the obligation to remonstrate with a corrupt parent or ruler is not an exception to loyalty; it is the ultimate expression of it. This is because Confucian roles are not defined by one-way deference, but by mutual moral recognition. A "father" is only a father insofar as he enacts fatherhood; a "ruler" is only a ruler insofar as he enacts rulership. When a superior violates the norms that make the relationship what it is, they are actively dismantling the very structure that gives them authority. To oppose them is not betrayal, but role-preservation.

  To see how loyalty and correction sit on the same spectrum, we must re-examine the famous story in *Analects* 13.18. The Duke of She tells Confucius about a "Straight Body" in his village whose father stole a sheep, and the son testified against him. Confucius replies that in his village, "Straightness" consists of the father covering for the son and the son covering for the father. Superficially, this looks like nepotism trumping justice. But if we view roles as constitutive of the self, the logic shifts. The "Straightness" (*zhi*) Confucius praises is not about legal compliance; it is about the integrity of the relational space.

  In the Duke's village, the son treats the father as a stranger—a discrete legal entity separate from the relationship. By reporting him, the son prioritizes the state's law over the family's existence, effectively dissolving the father-son bond. In Confucius's village, "covering" (*yin*) is an act of protecting that relational space from external destruction. However, this protection is not a license for complicity. If the father continues to steal, the relationship rots from the inside. A father who acts like a criminal ceases to function as a moral anchor for the son. Therefore, true "covering" must include preventing the father from becoming the kind of person who needs covering. Remonstration is the internal maintenance of the relationship, just as silence before the magistrate is the external defense of it. Loyalty (protecting the bond from outside) and correction (protecting the bond from inside) are two sides of the same coin: maintaining the viability of the role. If you let a parent or ruler corrupt themselves, you are allowing the role itself to degrade, which ultimately destroys the ground you both stand on.

  This implies that authority in Confucianism carries a hidden epistemic condition. Authority is not merely a positional fact; it is a moral claim that requires recognition to be real. A ruler claims to rule by virtue (*de*); if they act viciously, the claim is false. Because the subordinate's role is co-constitutive, they are not just a passive recipient of orders but a guardian of the role's definition. This generates a *cognitive* duty to resist. It is not enough to simply feel uncomfortable with corruption; the subordinate has an obligation to *know* and *articulate* that the superior has deviated from the Way (*Dao*). Ignorance in the face of corruption is not innocence; it is a failure of role-performance. By failing to recognize the corruption, the subordinate validates a false authority, thereby participating in the distortion of the social order. The duty to remonstrate is thus epistemic: you must judge the superior to fulfill your own function within the hierarchy.

  The obvious objection is that this argument smuggles modern liberal autonomy or democratic dissent into ancient relational ethics. Critics will argue that framing remonstration as "role-preservation" is just a euphemism for individual conscience overriding authority, which is a Western import. They will say that granting the subordinate the right to judge the superior collapses the hierarchy into a contract between equals.

  This charge does not stick, because the source of normativity is fundamentally different. In modern autonomy-based resistance, the ground for dissent is the individual's rights or internal moral compass *against* the collective or the authority. The logic is: "I resist because this violates *my* principles." In Confucian role-based remonstration, the ground for dissent is the relationship itself. The logic is: "I resist because this violates *our* role."

  When a Confucian minister remonstrates with a tyrant, they are not appealing to their own individual rights, which they do not possess as abstract individuals. They are appealing to the tyrant's own commitment to being a ruler. They are saying, "You are not acting like a ruler, and by enabling you, I am not acting like a minister." The resistance is not an assertion of independence, but a desperate attempt to restore dependence on the proper moral order. It is deeply conservative in the literal sense: it seeks to conserve the role against the person occupying it.

  Furthermore, autonomy-based resistance usually envisions an exit option—if the state is corrupt, the individual can withdraw or revolt to establish a new contract. Role ethics offers no such exit. You cannot stop being a son; you cannot easily stop being a minister without abandoning the social fabric entirely. Therefore, remonstration is not a tool for overthrowing the structure, but for keeping it habitable. The distinction lies in the telos: autonomy seeks self-determination; role ethics seeks relational harmony. Resisting a corrupt superior in the Confucian frame is an act of devotion to the hierarchy's ideal form, not a rejection of hierarchy itself. It acknowledges that without correction, loyalty becomes complicity, and the role collapses into mere power. By resisting, the subordinate proves they take the role more seriously than the superior does.
