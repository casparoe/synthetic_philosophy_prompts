  ### The Thought Experiment: The Quiddistic Swap

  **Scenario:**
  Consider a world, $W_{swap}$, that is microphysically identical to our actual world in every categorical respect. In $W_{swap}$, every particle has the same intrinsic "quiddity" (property-identity) as its counterpart in our world. There are particles with *mass*, particles with *negative charge*, and particles with *positive charge*, distributed in exactly the same spatiotemporal arrangement as in our world.

  However, in $W_{swap}$, the **causal laws** governing these properties are inverted relative to our world. In our world, mass is associated with gravitational attraction and like charges repel. In $W_{swap}$, the property *mass* (the very same intrinsic property instantiated in our world) governs gravitational *repulsion*, and *negative charge* (the very same intrinsic property) attracts other negative charges.

  Crucially, this is not a world where we simply relabel the properties. We are stipulating that the intrinsic nature of the property—the "thisness" or quiddity that makes it *mass* rather than *charge*—is held fixed, while the nomic role it plays is altered.

  ### 1. Conceivability of the Scenario

  This scenario counts as **conceivable** in the sense relevant to the zombie argument for the following reasons:

  *   **Coherence:** There is no logical contradiction in the description. The statement "Property $P$ exists and causes effect $E$" is logically consistent with "Property $P$ exists and causes effect $\neg E$." Unlike a square circle, the concept of a property does not *logically* entail its causal role.
  *   **Ideal Reasoner:** An ideal reasoner, fully grasping the concepts of "mass," "charge," and "causal law," would not find a contradiction *a priori*. They could model $W_{swap}$ mathematically simply by flipping the signs in the force equations while keeping the variables representing the properties identical.
  *   **No A Priori Ruling Out:** We cannot rule out $W_{swap}$ from the armchair alone without adopting a specific metaphysical thesis about the nature of properties. To a Humean about laws (who views laws as contingent regularities supervening on categorical properties), $W_{swap}$ is not just conceivable, but metaphysically possible. The conceivability here rests on the intuition that properties are "categorical bases" that can be coupled with different laws, just as the zombie argument rests on the intuition that physical states are "categorical bases" that can be coupled with different phenomenal states.

  ### 2. Metaphysical Impossibility

  Despite its conceivability, there is a strong, independent metaphysical reason to think $W_{swap}$ is **impossible**. This reason stems from **Dispositional Essentialism** (championed by metaphysicians like Stephen Bird and Brian Ellis).

  *   **The Argument:** Dispositional Essentialism holds that fundamental physical properties are *essentially* dispositional. To be "mass" *just is* to have the power to attract other masses gravitationally. To be "negative charge" *just is* to have the power to repel other negative charges. The causal role is not an external law attached to the property; it is constitutive of the property's identity.
  *   **The Impossibility:** If Dispositional Essentialism is true, then a world containing the property *mass* that repels is not a world with *different laws*; it is a world without *mass*. If we stipulate that $W_{swap}$ contains *mass* (the actual property), but that mass repels, we are stipulating a contradiction: "The property that essentially attracts repels."
  *   **Type of Necessity:** This is **metaphysical necessity** grounded in the essences of properties, not merely nomological necessity. It is not that the laws *happen* to be fixed; it is that the properties *cannot exist* without their specific powers. This is distinct from the "Water = H2O" case because it does not rely on the semantics of natural kind terms rigidly designating a microstructure. It relies on the ontology of properties themselves: properties are not "quiddities" that wear different "law-hats"; they are their powers.

  ### 3. Structural Analogy to the Zombie Argument

  The structural parallel between the **Quiddistic Swap Argument** and the **Zombie Argument** is tight. Both arguments rely on an inference from conceivability to metaphysical possibility to challenge a reductionist thesis.

  | Step | The Zombie Argument (Against Physicalism) | The Quiddistic Swap Argument (Against Categoricalism) |
  | :--- | :--- | :--- |
  | **1. The Base** | **Physical Facts:** The complete distribution of categorical physical properties (mass, charge, position). | **Categorical Facts:** The complete distribution of property quiddities (mass-identity, charge-identity). |
  | **2. The Target** | **Phenomenal Facts:** The presence of conscious experience. | **Nomic Facts:** The specific causal powers/laws associated with those properties. |
  | **3. The Conceivability** | We can conceive of a world with all Physical Facts but no Phenomenal Facts (a Zombie World). | We can conceive of a world with all Categorical Facts but different Nomic Facts (the Swap World). |
  | **4. The Inference** | **Conceivability $\to$ Possibility:** If Zombies are conceivable, they are metaphysically possible. | **Conceivability $\to$ Possibility:** If the Swap is conceivable, it is metaphysically possible. |
  | **5. The Conclusion** | **Anti-Physicalism:** Physical facts do not necessitate phenomenal facts; Physicalism is false. | **Quidditism / Humeanism:** Categorical facts do not necessitate nomic facts; Dispositional Essentialism is false. |
  | **6. The Rejoinder** | **Physicalist:** The link is necessary a posteriori. You aren't conceiving of the *same* physical facts without consciousness; you're misdescribing the base. | **Dispositionalist:** The link is necessary a posteriori. You aren't conceiving of *mass* with different powers; you're conceiving of a different property. |

  In both cases, the anti-reductionist (Dualist or Humean) claims the gap between Base and Target is contingent because it is conceivable. The reductionist (Physicalist or Dispositionalist) claims the gap is illusory because the Target is essential to the Base, even if this necessity is only discoverable a posteriori.

  ### 4. Disanalogy and Defense

  A defender of the Zombie Argument (a Dualist) will inevitably try to drive a wedge between these cases to save the inference from conceivability to possibility in the mind case. Here is the strongest move available to them, followed by an assessment of its cost.

  **The Defensive Move: The "Intrinsic Nature" Distinction**
  The Dualist can argue that the analogy fails because of the *kind* of property involved.
  *   **In the Physics Case:** Properties like mass and charge are defined by their **extrinsic** causal roles. It is plausible (via Dispositional Essentialism) that their identity is exhausted by what they *do*. Therefore, changing the role changes the property.
  *   **In the Mind Case:** Phenomenal states (like pain) are defined by their **intrinsic** qualitative character, not their causal role. Pain feels a certain way *regardless* of what causes it or what behavior it produces. Therefore, one can coherently conceive of the physical base (which is defined by causal role) existing without the phenomenal state (which is defined by intrinsic feel), because the two belong to different metaphysical categories. The Dualist claims that while physical properties *might* be essentially dispositional, phenomenal properties are essentially *qualitative*, breaking the parallel.

  **Assessment of the Defense**
  This defensive move is intelligible, but it exacts a significant cost elsewhere in the anti-physicalist's position: **Epiphenomenalism.**

  1.  **The Cost:** If the Dualist insists that phenomenal properties are *intrinsic* and distinct from the *extrinsic/causal* physical properties to avoid the Dispositionalist rebuttal, they sever the causal link between the mental and the physical. If "pain" is not defined by its causal role (e.g., causing withdrawal), then it is difficult to explain how pain *causes* withdrawal without overdetermination or violation of physical closure.
  2.  **The Dilemma:**
      *   **Option A:** The Dualist concedes that phenomenal properties *do* have essential causal roles. If so, the Quiddistic Swap analogy holds firm. If physical properties are essentially dispositional, and mental properties are essentially dispositional, then the conceivability of a gap in both cases is equally suspect. The inference from conceivability to possibility is undermined in the mind case just as it is in the physics case.
      *   **Option B:** The Dualist maintains that phenomenal properties are intrinsically non-causal (Epiphenomenalism). This saves the conceivability argument but renders consciousness a metaphysically inert byproduct, a position many find independently implausible or self-undermining (if thoughts about consciousness are caused by physical states, how do we know about the consciousness?).

  **Conclusion for the Class**
  This thought experiment forces your students to recognize that the move from "I can conceive of X without Y" to "X can exist without Y" is not a free logical inference. It depends on a background metaphysical assumption about whether Y is essential to X. In the physics case, Dispositional Essentialism provides a robust reason to think Y (causal power) is essential to X (property), rendering the conceivability of a swap misleading.

  If the Dualist wishes to preserve the Zombie Argument, they must explain why the link between Physical Base and Consciousness is *not* essential in the way the link between Property and Power is. But in doing so, they risk pushing consciousness out of the causal order entirely. The "Quiddistic Swap" thus acts as a stress test: it shows that conceivability alone cannot bear the weight of metaphysical possibility without a prior commitment to the contingency of the relevant connection.
