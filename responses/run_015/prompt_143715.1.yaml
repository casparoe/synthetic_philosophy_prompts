      *   So, (6) isn't *entirely* false empirically, but (7) is too strong ("deny it... purely on moral grounds"). The evidence suggests a *bias*, not a *constitutive rule*.
      *   So the modal slide (Constitution vs. Bias) is also crucial.
      *   *Decision:* Highlight both the Equivocation (Moral vs. Epistemic Norms) and the Modal Slide (Constitution vs. Performance Error/Bias).

  9.  **Final Plan:**
      *   Validate the argument structure.
      *   Identify the **Equivocation on "Normative"** (Moral vs. Alethic).
      *   Identify the **Modal Slide** (Constitutive vs. Heuristic).
      *   Advise rejecting/modifying (6) and refining (3).
