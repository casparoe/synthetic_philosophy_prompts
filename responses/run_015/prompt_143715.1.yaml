answer: |-
  This is a sharp reconstruction of the problem. Your advisor is correct: there is a slide here, but it's subtle because it hides inside the word "normative." You have identified the tension perfectly in your final question, but I think you are underestimating the **equivocation on the *type* of normativity** and overestimating the strength of **constitution vs. bias**.

  Here is the diagnosis of the logical slide, followed by the least costly way to save your thesis.

  ### 1. The Primary Slide: Equivocation on "Normative" (Premises 4 & 6)

  The strongest logical break occurs between (4) and (6).

  *   **In (2) [Intentionality]:** The normativity at play is **moral/practical**. The Knobe Effect shows that *moral badness* makes us more willing to apply the concept INTENTIONAL.
  *   **In (4) [Belief]:** You correctly note that belief has normative conditions, but these are **alethic/epistemic** (truth, justification, evidence).
  *   **In (6) [The Slide]:** You infer that because belief has *normative conditions* (epistemic), it is subject to the *same kind of normative intrusion* as intentionality (moral).

  **The Mistake:** Just because a concept is "normative" (governed by rules) doesn't mean it is "moralized" (governed by moral rules).
  *   Chess has normative conditions (rules of movement).
  *   Morality has normative conditions (rules of conduct).
  *   That chess is normative does not imply that whether a move is "legal" depends on whether it is morally good.

  By moving from (5) to (6), you assume that *any* normative susceptibility opens the door to *moral* susceptibility. But belief might be normatively constituted by *truth norms* specifically, which are insulated from moral consequences.

  ### 2. The Secondary Slide: Constitution vs. Performance (Premises 2 & 7)

  There is also a modal slide regarding *how* the normativity works.

  *   **In (2):** You claim normative evaluation **partly constitutes** the concept. This is a strong metaphysical claim about the concept's identity conditions.
  *   **In (7):** You conclude we would **deny attribution** purely on moral grounds.
  *   **The Mistake:** Even if the Knobe Effect is real, many philosophers (e.g., Machery, Nadelhoffer) argue it is a **performance error** or a **pragmatic implicature**, not a change in semantic constitution.
      *   If it's a performance error (bias), then in the Dr. Reed case, we might be *biased* to say he "didn't believe" it, but strictly speaking, he *did* believe.
      *   If it's constitution, then he *literally did not believe* it.
      *   Your argument assumes the Knobe Effect proves **Constitution** (2), but then uses that to prove a radical **Eliminativism** about belief (7/8). Most proponents of the Knobe Effect stop at "moral considerations influence application," not "moral considerations overwrite evidence conditions."

  ### 3. The Least Costly Premise to Reject

  To save your seminar paper without collapsing epistemology into ethics, you should **modify (3) and reject (6).**

  **Do not reject (2).** The Normative-Constitution Thesis for *Intentional Action* is defensible and has strong backing (e.g., Holton, Knobe's later work on the "Deep Self").

  **Do reject the Universal Contagion in (3).**
  Your caveat in (3)—*"unless intentionality is uniquely action-linked"*—is actually the solution, not the problem. You should lean into it.
  *   **Intentionality** is a concept of **agency**. It connects the mind to the *world-changing* potential of an action. Moral norms are inherently about how we change the world.
  *   **Belief** is a concept of **representation**. It connects the mind to the *world-as-it-is*. Epistemic norms are about accuracy.

  **The Fix:** Restrict your thesis to **Volitional/Agency Concepts**.
  Argue that moral psychology constitutes *agency* concepts (Intentional, Decided, Chose) but not *representational* concepts (Belief, Knows, Perceives). This preserves the Knobe insight without destroying epistemology.

  ### 4. How to Salvage the "Broad Thesis" (The Seminar Paper Angle)

  If you restrict the thesis too much, your paper might feel too narrow. Here is how you keep the "Broad Thesis" alive without accepting the *reductio*:

  **Option A: The "Epistemic Knobe Effect" Compromise**
  There is empirical literature (Beebe & Buckwalter 2010) suggesting there *is* a Knobe Effect for knowledge ("He knew it would happen" is attributed more when the outcome is bad).
  *   **Modification:** Don't argue that belief *constitution* collapses. Argue that **high-stakes moral contexts pragmatically shift the threshold** for attribution.
  *   **Cost:** You have to retreat from "Constitution" (Metaphysics) to "Pragmatics" (Language Use). This is less revolutionary but more defensible.

  **Option B: The "Responsibility" Bridge**
  Argue that we attribute mental states not to describe the mind, but to **assign responsibility**.
  *   **Thesis:** Mental state attribution is a tool for moral accounting.
  *   **Application to Belief:** We don't deny Dr. Reed *had* the belief in the "kill" scenario. We deny it because attributing "belief" implies **responsibility for the belief**. If the belief was involuntary or the outcome tragic, we withhold the label to mitigate blame.
  *   **Benefit:** This keeps your core idea (Mental State Attribution = Moral Psychology) but explains why epistemology doesn't *collapse*. Epistemology studies the *conditions* of belief; Moral Psychology studies the *attribution* of belief for social purposes. They are different projects.

  ### Recommendation for Your Paper

  1.  **Keep (1) and (2).** Defend the Normative-Constitution Thesis for Intentionality.
  2.  **Modify (3).** Change "Normative Contagion" to **"Agency-Relative Normativity."** Argue that moral constitution applies only to mental states that implicate the agent's stance toward outcomes (Intention, Desire, Decision).
  3.  **Reject (6).** Explicitly argue that Belief is insulated because its constitutive norm is Truth, not Goodness.
  4.  **Pivot the Conclusion.** Instead of "Epistemology collapses," conclude that **"Folk Psychology is fundamentally a system of Moral Accounting, but it respects functional boundaries between Agency and Representation."**

  This satisfies your adviser (no scope mistake), keeps your core insight (Knobe reveals something deep about moral psychology), and avoids the absurdity of (8).
