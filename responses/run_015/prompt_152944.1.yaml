answer: |-
  # Workshop Design: The Migration Cascade

  ## 1. Rules, Payoff Structure, Timeline, and Roles

  **Metaphor:** The team is governing a critical "Project Titan" database migration. The underlying reality is either **SAFE** (migration succeeds) or **RISKY** (migration causes outage). Each engineer receives a private "stress-test result" (Signal) that is noisy. They must publicly "Approve" or "Block" the migration in sequence.

  **Participants:**
  *   **16 Decision-Makers (D1–D16):** Seated in a visible linear sequence.
  *   **2 Observers (O1, O2):** Seated to the side with scoreboards.
  *   **Facilitator:** Manages timing, envelope distribution, and state tracking.

  **Materials:**
  *   18 Opaque envelopes per round (16 for Deciders, 2 spares).
  *   Inside each envelope: A card reading `BUILD: PASS` or `BUILD: FAIL`.
  *   Whiteboard: Tracks public votes (Approve/Block) and Individual Reputation Scores.
  *   Reputation Tokens: Physical chips or a visible score next to each name (Start: 10 points).
  *   Reward Pool: A jar representing the "Coffee Fund."

  **Signal Accuracy (The Math):**
  *   **True State:** Determined by coin flip at start of round (Hidden).
  *   **Signal Noise:** If True State is SAFE, 70% of envelopes contain `PASS`, 30% `FAIL`. If True State is RISKY, 70% contain `FAIL`, 30% `PASS`.
  *   **Implication:** Signals are useful but not perfect. Rational agents should trust their signal *unless* public history outweighs it.

  **Payoff Structure:**
  *   **Group Win:** If the Final Majority Vote matches the True State, every participant adds **10 points** to their Reputation Score.
  *   **Group Loss:** If the Majority mismatches the True State, **0 points** awarded.
  *   **Rebase Penalty:** After all 16 vote, a "Rebase Phase" occurs. Anyone may flip their vote. However, flipping costs **5 Reputation Points** immediately (visible "Flip-Flop" penalty).
  *   **Reward:** At the end of the workshop, if the total Group Pool exceeds a threshold, the Facilitator buys coffee for the team. Individual top-scorers get first pick of pastries.

  **Timeline (90 Minutes Total):**
  *   **00:00 – 00:10 (Setup):** Explain metaphor, rules, and stakes. Seat participants. Distribute Round 1 envelopes (sealed).
  *   **00:10 – 00:25 (Round 1):** Sequential voting (10 mins) + Rebase Phase (3 mins) + Tally (2 mins).
  *   **00:25 – 00:40 (Round 2):** Swap O1/O2 with D15/D16. Repeat sequence. (Observers now feel end-of-chain pressure).
  *   **00:40 – 00:45 (Transition):** Final score tally. Prepare board for debrief.
  *   **00:45 – 01:30 (Debrief):** Structured discussion (see Section 3).

  **Role Rotation:**
  *   **Round 1:** Original 16 Deciders act. Observers record.
  *   **Round 2:** Observers swap into positions D15 and D16. Original D15/D16 become Observers. This ensures those recording the cascade also experience the pressure of joining a locked-in sequence.

  ## 2. Engineering the Cascade

  The cascade must emerge from the mechanics, not facilitator manipulation. We rely on the **Bayesian Threshold**.

  *   **Signal Weight:** A private signal is worth ~2.2 bits of information (based on 70% accuracy).
  *   **Public Weight:** Each public vote is interpreted as "This person saw a signal matching their vote."
  *   **The Tipping Point:**
      *   **D1:** Votes strictly on private signal.
      *   **D2:** If D1 and D2 signals match, they vote alike. If they conflict, D2 follows their own signal (tie-break).
      *   **D3:** If D1 and D2 both voted "Approve," D3 infers two "PASS" signals likely exist. Even if D3 holds a "FAIL" signal, the probability that the True State is SAFE (given two prior Approvals) outweighs their single noisy FAIL signal.
      *   **Lock-in:** D3 votes "Approve" *regardless* of their private signal. D4 sees three Approvals and ignores their signal entirely. The cascade locks.

  **Visibility Conditions:**
  *   Votes are written on a central whiteboard immediately after declaration.
  *   No discussion is allowed between participants.
  *   Envelopes must remain sealed until the participant's turn.
  *   **Rebase Tension:** The 5-point penalty is calibrated to be painful. If a participant realizes a cascade is wrong during the Rebase Phase, they must weigh: *Is being right worth losing half my round earnings and looking inconsistent?* This mimics the social cost of amending a public code review.

  ## 3. The Debrief (45 Minutes)

  **Phase 1: The Private Signal (10 mins)**
  *   **Ask:** "D1 and D2, what was in your envelope? What did you vote?"
  *   **Map:** This represents isolated stress-test results. Individually, you are rational. You trusted your data.
  *   **Concept:** **Private Information.** In engineering, this is your local build log. It is accurate but isolated.

  **Phase 2: Bayesian Updating & Suppression (15 mins)**
  *   **Ask:** "D5 through D10, did anyone have a signal that contradicted the majority? Why did you vote with the majority?"
  *   **Map:** This is **Rational Herding**. You didn't "follow the crowd" blindly; you calculated that the crowd's visible history was statistically more reliable than your single noisy test.
  *   **Concept:** **Information Cascade.** Your private evidence was suppressed not by fear, but by rational calculation. The public log became more informative than your private log.

  **Phase 3: The Rebase Penalty & Lock-in (15 mins)**
  *   **Ask:** "During the Rebase Phase, who wanted to flip but didn't? Why?"
  *   **Map:** This is **Social Rationality vs. Epistemic Rationality**. You knew the group might be wrong, but the cost of inconsistency (reputation loss) outweighed the marginal gain of correcting the record.
  *   **Concept:** **Path Dependence.** Once the cascade starts, the cost of reversal creates a "sticky" equilibrium. In engineering, this is why bad architectural decisions persist; the social cost of admitting error exceeds the technical cost of maintaining the legacy system.

  **Phase 4: Collective Rationality (5 mins)**
  *   **Takeaway:** The group acted rationally at every individual step, yet produced an irrational collective outcome. This is not a failure of intelligence; it is a structural feature of sequential decision-making with public visibility.
  *   **Action:** To break cascades, teams must hide votes (blind reviews) or incentivize dissent (bug bounties for finding architectural flaws).

  ## 4. Honest Limitation

  **Unreproducible Feature:** **Common Knowledge of Rationality.**
  In the theoretical model of information cascades, it is "common knowledge" that every agent is a rational Bayesian updater who knows that everyone else is also a rational Bayesian updater.
  *   **In the Workshop:** Participants cannot be sure their colleagues are calculating odds. They might suspect D1 was guessing, joking, or misunderstood the rules. This uncertainty dampens the cascade effect compared to the mathematical model.
  *   **Verbal Supply:** During the debrief, explicitly state: "In the math model, you know for a fact that D1 was rational. In this room, you had to guess if D1 was competent. In real engineering, we often assume competence where none exists, which accelerates cascades even faster than today's simulation."

  ## 5. Predicted Failure Mode & Mitigation

  **Predicted Failure:** **Sequence Breaking by Dominant Personalities.**
  Senior engineers may attempt to signal information non-verbally (sighing, nodding) or break the "no talk" rule to warn others ("Check your envelope carefully!"), which contaminates the private signal isolation.

  **Mitigation Tactics:**
  1.  **The "Silent Room" Protocol:** Explicitly state that any verbal communication outside of the declared vote results in immediate disqualification from the Coffee Fund for the entire team. This creates peer pressure to enforce silence.
  2.  **Observer Enforcement:** Empower the 2 Observers to flag rule violations. They are the "Compliance Bot."
  3.  **Physical Barriers:** Have participants hold envelopes up to shield them from peripheral vision until the exact moment of decision.
  4.  **Facilitator Pacing:** The Facilitator must move down the line briskly. Do not allow dwell time. "D1, vote." "D2, vote." Momentum prevents collusion.

