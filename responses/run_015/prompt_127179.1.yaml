answer: |-
  Your friend is right, but she is speaking in a shorthand that obscures the practical mechanics. You have correctly diagnosed the disease (information cascades) but your proposed treatment addresses the symptoms (social pressure) rather than the pathology (Bayesian updating).

  Here is the breakdown of what your friend means, why your current plan will likely fail, and the actual mechanism design fix you need.

  ### 1. What your friend is talking about

  **"Treating a rational response... as a reasoning error"**
  You are assuming readers conform because they are lazy or intimidated (social pressure). Game theory assumes they conform because they are being *rational*.
  If Reader 1 through Reader 6 all give a candidate a 9/10, Reader 7 faces a calculation: *"I see this candidate as a 7/10. But six of my colleagues, whom I respect, see them as a 9. Statistically, it is more likely that I missed something than that all six of them are wrong."*
  Reader 7 updates their belief based on the public information. This is not a weakness; it is efficient data processing. Hiding the *names* or *timestamps* doesn't change the math. If Reader 7 sees six "9s" on the sheet, they know there is a consensus, regardless of whether those scores were entered five minutes ago or five days ago.

  **"The readers I want to throw out are exactly the ones whose private information I most want"**
  In a cascade, public actions (scores) become worthless, but *private signals* (individual judgments) still hold value.
  If the first six readers are wrong (a "false cascade"), the only thing that can save you is a later reader whose private signal is strong enough to contradict the group. By discarding the last third of readers, you are systematically deleting the very data points that could correct a mistake. You are reducing your sample size from 9 to 6, which increases statistical noise, while assuming the early voters are the most accurate (which is not necessarily true).

  **"Shuffling is basically cosmetic"**
  Your plan relies on a "running summary." As long as Reader 5 can see the scores of Readers 1–4, a cascade can form. Shuffling the order prevents them from knowing *who* voted first, but it does not prevent them from seeing *what* the group thinks. An informational cascade does not require knowing you are "Reader #7"; it only requires knowing that "most people have already voted High."

  ### 2. Why your proposed fix will fail

  1.  **The Shared Sheet is the Problem:** As long as the sheet is live and visible during the voting window, you have a sequential game, not a simultaneous one. Reader 9 sees eight data points; Reader 1 sees zero. Reader 9 is mathematically pressured to conform to the aggregate, even if anonymized.
  2.  **Discarding Votes Increases Variance:** Going from 9 readers to 6 makes your ranking less stable. In a pool of 400 files fighting for 20 spots, the margin between #20 and #21 is razor-thin. Reducing your data density makes that cutoff noisier, not fairer.
  3.  **False Security:** You will feel like you've solved the problem because the timestamps are gone. But the "running summary" acts as a gravitational pull. Readers will still anchor to the average.

  ### 3. The Actual Fix: Mechanism Design

  To get nine independent opinions, you must enforce **Simultaneous Blind Submission**. You cannot mitigate the cascade; you must structurally prevent the information flow until the decision is locked.

  **Step 1: Lock the Sheet (The "Sealed Bid" Model)**
  *   Readers can enter scores, but they **cannot view** other scores until the voting window closes for that file (or for the whole batch).
  *   Most survey tools (Qualtrics, Google Forms with scripts, specialized admissions software) allow this. If you are using a raw Excel/Google Sheet, you need separate tabs that are merged by an admin only after the deadline.
  *   **Crucial:** No running averages. No "8 out of 9 people have voted." Nothing.

  **Step 2: Calibration Sessions**
  *   Cascades often happen because readers have different baselines (one person's 8 is another's 6). When they see the discrepancy, they assume the majority is "correct."
  *   Hold a calibration session before reading begins. Read 3 sample files together. Discuss until you agree on a score. This aligns the "private signals" so they are actually comparable.

  **Step 3: The "Outlier Review" Protocol**
  *   Once scores are submitted and unlocked, *then* you look for cascades.
  *   If 8 readers say "Admit" and 1 says "Reject," do not let the 1 change their score to match the 8. Instead, trigger a review. Ask the outlier to write a 2-sentence justification.
  *   Often, the outlier spotted a fatal flaw the others missed (or vice versa). This leverages the private information your friend mentioned, rather than discarding it.

  **Step 4: Randomized File Assignment**
  *   Ensure readers aren't reading files in the same order. If Reader 1 reads Files 1–50 and Reader 2 reads Files 1–50, Reader 2 might infer Reader 1's fatigue or bias. Randomize the queue so reader effects are uncorrelated.

  ### 4. Is it hopeless?

  No. It is entirely solvable, but it requires more administrative friction than your current plan.

  Your current plan tries to make the readers *feel* independent while keeping the information flow open. That is why your friend calls it cosmetic.
  The fix is to make them *actually* independent by cutting the information flow until the vote is cast.

  **Summary of Action Items:**
  1.  **Stop** the live shared sheet immediately.
  2.  **Implement** a submission system where scores are hidden until all readers submit (or a deadline passes).
  3.  **Keep** all 9 votes; use the variance between them as data, not noise.
  4.  **Use** the post-vote discussion to investigate outliers, not to enforce consensus.

  If you do this, you won't stop readers from *discussing* later, but you will ensure the initial score is based on their judgment of the file, not their judgment of their colleagues. That is the only way to break the cascade.
