          *   Enceladus: Kills the "Evolution" requirement. Supports "Life as State."
          *   Chalk Line: Kills the "Individual" requirement. Supports "Life as System."
          *   Stripped Cell: Tests the "Threshold."
      *   *Identify the Downstream Inferences:*
          *   Astrobiology wants Enceladus to be alive (biosignature).
          *   AI Ethics wants Halvorsen to be alive (moral status).
          *   Biology proper wants Chalk Line to be *not* alive (it's a tool).
      *   *The Diagnosis:* The dispute is about **Projectibility**. Which definition allows us to make successful inductive inferences about unknown cases?
      *   *Progress:* Stop defining "Life." Define "Living Systems," "Evolutionary Processes," and "Dissipative Structures" separately. Progress is a formal theory of *when* these clusters decouple.

  6.  **Refining the Tone:**
      *   Match the user's precision. Avoid fluff. Be direct.
      *   Don't say "It's a cluster concept." Say *why* the cluster clusters and what happens when it unclusters.
      *   Address the "one sample" problem. The thought experiments are attempts to generate synthetic samples.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I answer "what kind of disagreement is this?" Yes: It's a disagreement about *projectibility* and *ontological category*.
      *   *Check:* Did I use the four cases? Yes, mapped them to specific failures of specific definitions.
      *   *Check:* Did I suggest progress? Yes, splitting the concept and looking for coupling laws.
      *   *Correction:* Make sure I don't just agree with the user. Push back on the idea that there's *no* factual question. The factual question is: "Are metabolism and evolution nomologically linked?"

  8.  **Final Structure:**
      *   **Diagnosis:** It's a "Projectibility Dispute" masked as a definition dispute.
      *   **Case Analysis:** Walk through the four cases and show which definition breaks where.
      *   **The Hidden Empirical Question:** Is the Earth-cluster necessary or contingent?
      *   **The Verbal Component:** We are using one word for three different ontological kinds.
      *   **Path to Progress:** Decouple the concepts, search for coupling laws.

