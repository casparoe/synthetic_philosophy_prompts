      *   **Task:** Evaluate the hypothesis using four specific, novel thought experiments (Halvorsen loops, Enceladus gels, Chalk line, Stripped cell). Determine which cases are load-bearing for which position. Identify the *real* disagreement. Suggest what progress would look like.
      *   **Constraints:** No reading lists, no standard surveys, no lazy "it's a cluster concept" dismissal. Argue from the cases. Be critical (don't just flatter).

  2.  **Deconstruct the User's Hypothesis:**
