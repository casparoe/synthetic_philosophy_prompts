          *   *Load-bearing:* Tests "Individuality vs. System." Is the life the organism or the organism+machine? Tests the boundary of the "self" in self-sustaining.
      *   *Case 4: Stripped Cell (Reduced Parasite).*
          *   Autopoiesis: Borderline (Boundary exists, but self-production is compromised).
          *   Evolution-only: YES (Genome evolves).
          *   NASA: Borderline (Self-sustaining?).
          *   *Load-bearing:* Tests "Continuity vs. Threshold." At what point of reduction does life stop?

  4.  **Synthesize the Diagnosis:**
      *   The user is right that it's a "different-questions-under-one-name" problem, but it's deeper than just "purpose." It's a category error between *types of explanations*.
      *   *The Real Conflict:* We are trying to unify three distinct ontological categories under one label:
          1.  **The Material Substrate** (Chemistry/Thermodynamics) -> Enceladus Gels.
          2.  **The Historical Process** (Evolution/Lineage) -> Halvorsen Loops, Chalk Line.
          3.  **The Organizational Form** (Autopoiesis/Boundary) -> Stripped Cell, Enceladus Gels.
      *   Earth life happens to unify all three. The thought experiments separate them.
      *   The "Verbal" aspect: We use "life" to mean "thing that evolves" *and* "thing that metabolizes" *and* "thing that is an individual." When these come apart, the word breaks.
      *   The "Substantive" aspect: There *is* a factual question about whether these properties are nomologically linked (must they always go together?) or contingent (do they just happen to go together on Earth?).

  5.  **Drafting the Argument (Iterative refinement):**
