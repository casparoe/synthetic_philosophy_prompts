  **Awkward Defeaters:** Cases of genuine preference reversal (e.g., arrival reveals the debt was illusory) show slice-evaluation can diverge from disposition value without metaphysical discontinuity. This suggests the "ought" persists even with identity continuity, making your framing inelegant rather than false.

  **Predictive Power:** This framing predicts nothing rivals don't unless it entails FDT. If it merely relabels "winning dispositions" as "identity," it lacks unique empirical implications and risks collapsing into trivial long-term consequentialism ("rationality = winning").

  **Unfalsifiability Risk:** High. Asserting that any defector failed to "fully internalize" renders the claim tautological. To avoid this, you must specify independent criteria for internalization beyond the action itself. Otherwise, you absorb every counterexample by stipulation.

  **Concession:** You must concede that without a specific decision theory validating subjunctive dependence, your view is merely a metaphysical assertion without formal leverage. The insulation is problematic; if every counterexample is absorbed by "insufficient internalization," the theory predicts nothing. A robust defense requires formalizing "internalization" as a logical constraint, not just a phenomenological state.
