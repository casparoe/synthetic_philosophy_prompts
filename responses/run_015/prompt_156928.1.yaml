answer: |-
  This is a remarkably sharp intervention for a graduate seminar, and it touches on one of the most persistent anxieties in contemporary historiography. You have identified a genuine methodological friction point, but I would argue that your formulation of "scalar consistency" imposes a rigid binary on two traditions that were fundamentally interested in *mediation* rather than separation.

  Your roommate is partially correct that there is no unified ontology of scale, but you are right to sense a tension. However, the tension is not a contradiction that renders the methods incompatible; rather, it is the engine that drives them. Here is a breakdown of why your "methodological betrayal" thesis might be overstating the case, and why scholars combine these scales without discomfort.

  ### 1. Microhistory Did Not Reject the Macro; It Refracted It
  Your reading of Ginzburg and Levi suggests they view macro-structural explanation as inherently violent. While they certainly critique *deterministic* structuralism (like Braudelian *longue durée* or mechanistic Marxism), they do not reject macro-explanation *per se*.

  Giovanni Levi's seminal essay, "On Microhistory," explicitly defines the method as a "reduction of the scale of observation," not a reduction of the scale of *significance*. The goal is not to stay in the parish forever, but to use the parish as a prism. When Ginzburg writes about Menocchio (*The Cheese and the Worms*), he is not merely cataloging a miller's eccentricities; he is using that micro-trace to map the circulation of Reformation ideas across Europe. The micro-evidence is the **mechanism** by which the macro-force becomes visible.

  If microhistorians rejected macro-conclusions, their work would be antiquarianism. They argue instead that macro-forces (like the Inquisition or the Reformation) do not exist as abstract clouds; they only exist insofar as they are enacted, resisted, or negotiated at the local level. Therefore, using a notarial document to explain a national shift isn't a betrayal; it is an assertion that the national shift *is* the aggregate of those local negotiations.

  ### 2. Thompson and the Constitution of the "National"
  Your reading of E.P. Thompson is where the "scalar consistency" principle breaks down most clearly. Thompson's *The Making of the English Working Class* is the ultimate macro-narrative built from micro-archives. Thompson was not arguing that the working class existed only in specific villages; he was arguing that "class" is a relationship that happens *between* people, which then coalesces into a national consciousness.

  Thompson's objection to state archives was not that they were "macro" and therefore invalid, but that they were **elitist** and **reified**. He believed the state archive treated the working class as a object of administration (rioters, paupers) rather than agents of history. When he uses local correspondence or Methodist records, he is not trying to stay local; he is trying to reconstruct the *formation* of a national political subject. For Thompson, the local voice is the evidentiary basis for the macro-claim, not a boundary that limits it.

  ### 3. The Category Error: Generalization vs. Mediation
  Your puzzle rests on the idea that using a local document to explain a national tax code is a generalization error (i.e., "This one notary proves the whole code changed"). If a historian did that, you would be right: that is bad method.

  However, respected scholars do not usually do this. They use local documents to show **mediation**.
  *   **Bad Method:** "Notary X in Village Y refused to pay the tax; therefore, the National Tax Code of 1750 failed."
  *   **Good Method (Micro/Macro synthesis):** "The National Tax Code of 1750 relied on local enforcement. Notary X's records show how local kinship networks allowed for systematic evasion, which forced the Central State to restructure the code in 1760."

  In the second scenario, the micro-evidence explains the *causal mechanism* of the macro-change. This violates your principle of "scalar consistency," but it adheres to the principle of **causal adequacy**. Historians like Charles Tilly or James Scott (in *Seeing Like a State*) do exactly this: they use granular data to show why high-modernist (macro) schemes fail or succeed.

  ### 4. Why the Discomfort is Missing in Practice
  You ask why scholars combine these without theoretical discomfort. The answer is that most historians are **pragmatists**, not pure epistemologists.

  Since the 1990s, there has been a move toward "Global Microhistory" (e.g., Francesca Trivellato) and "Connected Histories" (Subrahmanyam), which explicitly reject the micro/macro binary. They argue that the "local" is often a node in a global network. A notarial record in Genoa might concern a shipment of silk from Bengal. The document is micro; the implication is macro. To insist on scalar consistency here would be to blind oneself to the reality of the early modern world.

  Furthermore, the "betrayal" you fear is actually the core of the **historical sociological** turn. Scholars like Philip Gorski or William Sewell Jr. argue that structures only have reality insofar as they are instantiated in practice. If you cannot find the macro-structure in the micro-practice, the structure is a fiction. Therefore, digging for the macro in the micro is not a betrayal of microhistory; it is the only way to validate the macro.

  ### 5. Conclusion: A Productive Tension, Not a Contradiction
  Your study group's concept of "scalar consistency" is a useful heuristic for spotting bad history (over-generalization from thin evidence), but it is not a faithful representation of the Italian or British traditions.

  *   **Your Roommate:** Is right that there is no unified ontology. Thompson was a humanist Marxist; Ginzburg is more of a cultural morphologist. They come from different places.
  *   **You:** Are right that there is a tension regarding *agency vs. structure*. But both traditions resolve this by arguing that structure is *enacted* through agency.

  The "betrayal" only occurs if one treats the micro-archive as a self-contained universe. If the historian treats the micro-archive as a **site of entry** into larger networks, the methodological sin vanishes. The friction you feel is likely the friction of doing history itself: the constant struggle to balance the particularity of the evidence with the generality of the argument. That isn't a bug in the system; it's the feature.

  **Suggestion for your seminar:** You might propose that "scalar consistency" is less a rule these historians follow, and more a **risk** they manage. The "betrayal" happens not when scales mix, but when the *connection* between the scales is asserted rather than demonstrated. If the historian shows *how* the parish record influenced the tax code, the method holds. If they simply assume the parish represents the nation, that is where the epistemic violence lies.
