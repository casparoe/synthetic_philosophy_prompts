  ### Priority 3: The Semantic Problem (Line 2)

  **Status:** Deprioritized.
  **Reasoning:** This is the least productive use of three years. Whether a pathogen is an "agent" is largely a linguistic choice.
  *   *Risk:* If you define agency as "counterfactual robustness" (as your prompt suggests), you risk diluting the term "agency" until it applies to falling rocks. This invites criticism from social scientists who reserve "agency" for intentionality.
  *   *Recommendation:* Treat "agency" as a metaphor for **high-leverage causal efficacy**. Do not build your metaphysics on it. If Line 1 is solved, you can say "Pathogens have causal efficacy" without needing to say "Pathogens have agency." The explanatory work is done by the causal model, not the label.

  ### Summary of the 3-Year Arc

  1.  **Year 1 (Upstream):** Focus entirely on **Line 1**. The causal modelers and philosophers co-author a framework for "Natural Experimental Identification in Macro-History."
      *   *Deliverable:* A set of criteria for when a climate/pathogen variable counts as a causal intervention equivalent.
  2.  **Year 2 (Midstream):** Apply this framework to 2-3 case studies (e.g., 536 CE Volcano, Little Ice Age, Columbian Exchange).
      *   *Deliverable:* Revised causal graphs that integrate human and non-human nodes without collapsing into determinism.
  3.  **Year 3 (Downstream/Synthesis):** Formalize the **Non-Competitive Pluralism** (Line 3) based on the results of Year 2. Publish the philosophical defense of why these models do not exclude human agency.
      *   *Deliverable:* A monograph or special issue establishing "Constraint-Based Causal Pluralism."

  **Final Advice:** Do not let the group get stuck on whether a virus "acts." Let them focus on whether a virus *changes the counterfactuals* available to a host population. That is the upstream key that unlocks the rest of the door.
