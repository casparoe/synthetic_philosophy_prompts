answer: |-
  Here is a prioritized research agenda for your interdisciplinary group, ranked by upstream conceptual dependency, tractability for your specific team profile, and potential for historiographical impact.

  ### The Ranking

  1.  **Upstream (The Gateway): Line 1 — Causal Identification & Interventionism.**
      *   *Reframed:* **The Epistemic Access Problem.** How do we validate non-human variables as causal nodes when strict manipulation is impossible?
  2.  **Midstream (The Goal): Line 3 — Causal Exclusion & Pluralism.**
      *   *Reframed:* **The Compatibility Problem.** How do we model human intent and environmental constraint in the same system without overdetermination?
  3.  **Downstream (The Distraction): Line 2 — Non-Human Agency.**
      *   *Reframed:* **The Semantic Problem.** Does labeling a pathogen an "agent" add explanatory power, or is it metaphorical decoration?

  ### The Criteria for Prioritization

  I am using four criteria to order these questions, weighted for a three-year philosophical-methodological project:

  1.  **Dependency Ordering:** You cannot solve *exclusion* (Line 3) until you have established *causal status* (Line 1). If a volcanic eruption is merely "background noise" rather than a causal variable, it cannot exclude human agency. Establishing the ontology of the non-human cause is the prerequisite for negotiating its relationship with human causes.
  2.  **Tractability for the Team:** Your team includes causal modelers. Line 1 is the only question that allows philosophers and modelers to work on the *same object* (the causal graph/identification strategy). Line 3 is largely metaphysical and risks splitting the team into "modelers" and "theorists." Line 2 is largely linguistic and risks endless definitional debates with little payoff.
  3.  **Neglect in Literature:** Line 3 (Exclusion) is well-trodden in Philosophy of Mind but under-theorized in History. However, Line 1 (Interventionism in deep history) is the current bottleneck in Cliometrics and Historical Epidemiology. Solving Line 1 provides the *tools* to solve Line 3.
  4.  **Historiographical Leverage:** A solution to Line 1 changes *how history is written* immediately (by validating new variables). A solution to Line 3 changes *how history is interpreted* (by validating pluralism). The former is upstream of the latter.

  ---

  ### Priority 1: The Epistemic Access Problem (Line 1)

  **Why this is the Upstream Crux:**
  The dominant account of causation in social science is manipulationist/interventionist (e.g., Woodward). It states $X$ causes $Y$ if an intervention on $X$ changes $Y$. The problem is that no one can intervene on a continental climate shift or a viral phylogeny. If your team accepts strict interventionism, non-human forces are causally inert. If you reject interventionism entirely, you lose the rigor of causal modeling.

  The upstream task is not to answer "Yes/No" to interventionism, but to develop a **Historical Identification Protocol** that treats *natural experiments* (volcanic winters, pathogen mutations) as functional equivalents to interventions. This settles the ontological status of the non-human force. Until you settle this, any discussion of "agency" or "exclusion" is speculative.

  **Concrete Success: The "Exogenous Shock" Distinction**
  Over three years, success looks like a formal principle that distinguishes between *Boundary Conditions* and *Causal Triggers*.

  *   **The Principle:** **"Causal Asymmetry of Constraint."**
      A non-human force counts as a historical cause not when it *determines* an outcome, but when it acts as an **exogenous shock that alters the payoff matrix of human decision-making without dictating the specific choice.**
  *   **The Case Study:** Late-Antique Volcanic Winter (e.g., 536 CE) and Mediterranean Fragmentation.
      *   *Current Narrative A (Determinism):* The aerosol forcing caused crop failure, which caused famine, which caused the collapse of the Byzantine administrative state. (Humans are puppets).
      *   *Current Narrative B (Intentionalism):* The volcanic winter was background noise; Justinian's overextension and plague mismanagement caused the fragmentation. (Volcano is scenery).
      *   *Your New Narrative:* The volcanic forcing is modeled as an **exogenous parameter shift** in the resource-extraction equation. It did not cause the fragmentation directly; it rendered the *previous* equilibrium of border defense causally impossible. It reduced the "decision space" available to imperial planners. The *choice* to retreat, consolidate, or abandon specific frontiers remains a human variable, but the *cost* of those choices was set by the aerosol forcing.
  *   **Why this moves the needle:** This allows the causal modelers to put the volcano in the DAG (Directed Acyclic Graph) as a parent node to "Resource Availability," which is a parent node to "Imperial Decision." It prevents exclusion because the human node ("Imperial Decision") still has variance that is not explained by the volcano.

  **Dependencies:**
  *   **Line 3 (Exclusion) depends on this.** Once you model the volcano as a *constraint on the decision space* rather than a *competitor for the decision*, the exclusion problem largely dissolves. They are no longer competing causes; they are causes at different levels of the mechanism (Constraint vs. Selection).
  *   **Line 2 (Agency) is bypassed.** You do not need to call the volcano an "agent." You only need to establish it as a "constraint-modifying cause." This saves the team from the quagmire of defining non-human intentionality.

  ---

  ### Priority 2: The Compatibility Problem (Line 3)

  **Status:** Parallel/Midstream.
  **Reasoning:** Once Line 1 is settled (volcanoes are valid causal nodes), Line 3 becomes a technical question of variance partitioning rather than a metaphysical crisis. However, the team should work on this in parallel to ensure the *interpretation* of the models remains philosophically sound.

  **The Task:** Develop a **Non-Competitive Pluralism Framework**.
  The goal is to show that "Sufficient Human Explanation" does not imply "Environmental Irrelevance."
  *   *Success Condition:* A demonstration that a historical event can be *fully* explained by human intention (e.g., "The Emperor chose to retreat") while simultaneously being *fully* dependent on environmental context (e.g., "The retreat was only rational because of the crop failure").
  *   *Mechanism:* Use the concept of **Realization**. Human decisions *realize* historical outcomes, but environmental conditions *structure* the space of realizable decisions. This mirrors the "Multiple Realizability" argument in Philosophy of Mind but inverts it to avoid exclusion.

