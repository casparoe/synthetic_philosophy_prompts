      *   *Check:* Am I being too academic? Keep language grounded in experimental terms (signal, noise, gain).

  12. **Final Polish:** Ensure the distinction between "Normatively Irrelevant" and "Psychologically Potent" is clear. The philosopher claims $X$ is normatively irrelevant. The subject shows $X$ is psychologically potent. If the goal is normative truth, $X$ is noise. If the goal is descriptive psychology, $X$ is signal. The "Sealed Confound" happens when the philosopher claims normative truth while relying on psychological potency.

      *Wait, one nuance on Trolley:* The user says the leader said "the difference... is where the interesting work is." The user noticed wording changes verdicts. My job is to say if that's a *bug* or a *feature*. In Trolley, it's a feature (moral distinction). In Teletransportation, it's a bug (metaphysical identity shouldn't depend on the word "destroyed"). I must make this distinction sharp.

