          3.  The Test (Counter-balancing for small N).
          4.  The Lab Analogy (Where it holds, where it breaks).
          5.  The Commitment (Trolley vs. Teletransportation vs. Victim).
          6.  Confidence & Falsification.

  9.  **Refining the "Commitment":**
      *   I need to be careful not to dismiss the Trolley problem. The "decoration" (shoving vs. lever) turned out to be *theoretically relevant* (Foot's doctrine of double effect / personal force). So the philosopher was wrong to call it decoration, but the *intuition* wasn't an artifact; it was a signal.
      *   Teletransportation: The wording ("destroyed") is purely rhetorical loading. That fits "Sealed Confound" perfectly.
      *   So, I will argue that Example 2 is the true positive for the user's concept. Example 1 is a false positive (it looked like a confound, but was a hidden variable). Example 3 is a known bias, distinct from the philosophical method error.

  10. **Final Review against Constraints:**
