answer: |-
  Here is the brainstorming and elimination process, followed by the analysis and commitment you requested.

  ### Part 1: Brainstorming and Elimination

  I have listed ten candidate concepts from philosophy, psychology, and rhetoric. I will cross out the ones that fail to capture the specific structural flaw you identified: *a feature declared irrelevant by the argument's own rules nonetheless drives the verdict.*

  1.  **Intuition Pump:** (Dennett). A thought experiment designed to elicit a specific intuition.
      *   *Cross out.* This is the tool, not the malfunction. A pump can be well-calibrated or leaky. You are describing a specific leak, not the pump itself.
  2.  **Framing Effect:** (Tversky & Kahneman). Logically equivalent descriptions producing different decisions.
      *   *Keep as candidate.* This is the psychological mechanism. However, "framing" usually implies the *facts* are held constant. In your Trolley example, the physical facts change (lever vs. hands-on). In Teletransportation, the facts are constant, only words change. "Framing" is too broad for the *philosophical* error of declaring irrelevance.
  3.  **Confounding Variable:** (Statistics). An extraneous factor that correlates with the independent variable.
      *   *Keep as candidate.* This is the structural error. But in standard stats, you don't *tell* the subject to ignore the confound. The "sealed" aspect is unique to your description.
  4.  **Loaded Question:** (Rhetoric). A question containing a controversial presupposition.
      *   *Cross out.* These are scenarios, not questions. The flaw isn't a presupposition (e.g., "Have you stopped beating your wife?"), but an emotional weighting of the description.
  5.  **Persuasive Definition:** (Stevenson). Redefining a term to alter emotional attitude.
      *   *Cross out.* The definitions aren't changing. "Destroy" means the same thing in both Teletransportation versions. The *valence* changes, not the definition.
  6.  **Vividness Effect:** (Psychology). Vivid information weighs more than pallid information.
      *   *Keep as candidate.* This explains *why* the confound works (shoving is vivid, "increasing mass" is pallid). But it doesn't capture the *normative* claim that the detail *shouldn't* matter.
  7.  **Experimenter Demand Effect:** (Psychology). Subjects guess the hypothesis and comply.
      *   *Cross out.* Your subjects aren't trying to please the group leader. They are reacting genuinely to the stimulus.
  8.  **Normatively Irrelevant Variation:** (Experimental Philosophy). A change in a case that should not alter the moral verdict but does.
      *   *Keep as candidate.* This is the closest technical term in "X-Phi." However, it lacks the "sealed" component—the explicit instruction to disregard the feature.
  9.  **Affective Heuristic:** (Psychology). Relying on current emotion rather than objective analysis.
      *   *Cross out.* This describes the cognitive shortcut, not the methodological flaw in the case construction.
  10. **Sealed Confound:** (Your term). A confound the case tells you to hold fixed.
      *   *Select.* This is the most precise description of the *methodological sin*. It combines the statistical error (confound) with the rhetorical command (sealed/declared irrelevant).

  **Winner:** I will adopt your term **"Sealed Confound"** but anchor it in the literature as a specific, pathological subtype of **Framing Effect** within **Normatively Irrelevant Variation**.

  ---

  ### Part 2: The Concept and The Test

  **Is "Intuition Pump" the answer?**
  No. An intuition pump is the apparatus. A "Sealed Confound" is a calibration error in the pump. When a philosopher sets up a case, they are claiming: "Variable A drives the verdict; Variable B is noise." If Variable B drives the verdict, the pump is leaking. If the philosopher *insists* Variable B is noise while relying on it to get the result they want, that is the Sealed Confound.

  **The Test (for a group of 6 retirees)**
  You cannot run a double-blind randomized control trial (RCT). However, you can run a **Counter-Balanced Within-Subject Design**. This controls for order effects and isolates the wording variable.

  *   **Procedure:**
      1.  **Split:** Divide your 6 people into two groups (A and B).
      2.  **Session 1:** Group A gets the "High-Valence" version (e.g., "Shove the man," "Body destroyed"). Group B gets the "Low-Valence" version (e.g., "Divert mass," "Psychological continuity").
      3.  **Washout:** Wait one week. (Crucial. If you do it immediately, they remember their answer).
      4.  **Session 2:** Swap. Group A gets the Low-Valence version. Group B gets the High-Valence version.
      5.  **Instruction:** Tell them, "We are reading new cases today." Do not tell them it is the same case reworded.
      6.  **Measurement:** Compare the verdicts.
          *   If Subject 1 says "No" to High-Valence and "Yes" to Low-Valence, they are susceptible to the Sealed Confound.
          *   If Subject 1 says "No" to both, the wording is irrelevant to them.
          *   If the group average shifts significantly between Session 1 and Session 2, the case is contaminated.

  **Your Lab Analogy: Is it good?**
  It is excellent, but with one critical break point.
  *   **Where it holds:** You are correct that this is **Experimenter Expectancy** mixed with **Instrument Drift**. The philosopher (operator) hopes for a specific result (utilitarian verdict) and adjusts the gain (wording) until the needle moves, then claims the gain setting was irrelevant.
  *   **Where it breaks:** In electrophysiology, the noise is external to the signal. In philosophy, the "noise" (emotional reaction to "shoving") *is* the data if the goal is to understand human morality. The break is in the **Objective**.
      *   If the goal is **Descriptive** (How do humans judge?), the variation is *signal*.
      *   If the goal is **Normative** (What *should* humans judge?), the variation is *noise*.
      *   The Sealed Confound occurs when the philosopher claims a Normative conclusion based on Descriptive noise, while asserting the noise is zero.

  ---

  ### Part 3: The Commitment

  You asked me to pick which of your three examples genuinely has the artifact and which do not. I will not hedge.

  **1. The Trolley Problem (Lever vs. Footbridge)**
  *   **Verdict:** **Not a Sealed Confound.** This is a **Hidden Variable**.
  *   **Reasoning:** Your group leader was right, though perhaps for the wrong depth of reason. The difference between "throwing a lever" and "shoving a man" is not merely decorative "vividness." It tracks a genuine moral parameter: *personal force* and *directness of harm*. When you rewrote the footbridge case in flat language ("increasing mass... by means of a human body"), you didn't remove the confound; you sanitized the moral violation. The fact that support went up proves that the *emotional salience* of the violence was masking the utilitarian calculation, but the underlying distinction (direct killing vs. indirect letting die) is philosophically robust.
  *   **Status:** The case is valid. The intuition is not an artifact; it is a feature of moral cognition that simple utilitarianism fails to capture.

  **2. The Teletransportation Case (Destroyed/Replica vs. Sleep/Wake)**
  *   **Verdict:** **Definite Sealed Confound.**
  *   **Reasoning:** This fits your definition perfectly. The metaphysical claim is that "material continuity is irrelevant." Therefore, the words "destroyed" and "replica" are stipulated to be irrelevant to the question of *survival*. However, these words trigger loss-aversion and fear of death (psychological variables) that have nothing to do with metaphysical identity. When you swap "destroyed" for "sleep," you remove the threat response. If the verdict flips based *only* on those words, the case is measuring fear, not identity.
  *   **Status:** This is the artifact. The philosopher is smuggling in an emotional penalty for "destruction" while claiming to test a theory of continuity.

  **3. The Identifiable Victim (Named Child vs. Statistics)**
  *   **Verdict:** **Known Cognitive Bias (Identifiable Victim Effect).**
  *   **Reasoning:** This is not a Sealed Confound in the philosophical method sense; it is a documented psychological limitation. Philosophers generally agree that the number of lives saved *should* matter more than identifiability. When people act otherwise, it is a failure of rational agency, not necessarily a flaw in the *case setup* (unless the case claims to test rational obligation).
  *   **Status:** This is data about human limitation, not a methodological error in the thought experiment itself.

  **My Pick:**
  **Example 2 (Teletransportation)** is the one that best fits your concept of the **Sealed Confound**. It is the only one where the author explicitly instructs you to disregard a feature (material continuity/words of destruction) while relying on that feature to secure the intuition that "you do not survive."

  ---

  ### Part 4: Confidence and Falsification

  **Confidence Level:** High (85%).
  I am confident because Example 2 is the only one where the *truth conditions* of the scenario remain identical while the *emotional valence* changes. In Trolley (Example 1), the physical mechanism changes (lever vs. hands), which changes the moral act. In Teletransportation, the physical mechanism is stipulated to be identical; only the label changes.

  **What Would Change My Mind:**
  1.  **If the Teletransportation verdict holds steady** across the "Destroyed" and "Sleep" wording in your counter-balanced test. If your group says "No, I don't survive" in both versions, then the intuition is robust and my claim of a Sealed Confound is false.
  2.  **If a theory of "Narrative Identity"** proves that the word "destroyed" is actually conceptually relevant. If survival *requires* a first-person narrative that the word "destroyed" breaks but "sleep" preserves, then the wording isn't decoration; it's data. (I find this unlikely, but it is the only philosophical out).

  **Final Word:**
  You are right to be suspicious. In your old lab, if you changed the buffer solution and the channel conductance changed, you didn't say "Ah, the buffer is irrelevant, the channel is just sensitive to pH." You said, "The buffer was a confound." In Example 2, the philosophers are changing the buffer (words) and claiming they are measuring the channel (identity). That is bad science, regardless of whether it is done with pipettes or paragraphs.

  Stick with **Sealed Confound**. It is a precise term for a specific methodological failure. Use the counter-balancing test on Example 2. I expect you will find the "zero drift" you suspect.
