answer: |-
  # Q&A PREP SHEET: SCALAR MORAL WEIGHT & NEURON PROXIES
  **Context:** Joint Ethics/Disability Bioethics Session.
  **Constraint:** No citations. Actionable only.
  **Audience:** 25 specific stakeholders (see below).

  ---

  ## STRATEGIC CONCESSIONS (Put these on Slide 2)
  *Do not wait to be cornered. Pre-empt the two biggest attacks by stating these limitations as features, not bugs.*

  1.  **Scope Limit:** Explicitly state: *"This metric is for prioritizing welfare interventions among non-human species. It is not a metric for human moral status, rights, or inviolability."*
      *   *Why:* Disarms the Disability Bioethics and Marginal Cases crowd immediately. Stops the "would you harvest anencephalic infants?" line of questioning before it starts.
  2.  **Proxy Admission:** Explicitly state: *"Neuron count is a noisy, structural proxy for functional capacity. It is not an identity claim about consciousness."*
      *   *Why:* Disarms the Neuroanatomist. If you admit the data is messy, they can't accuse you of ignoring the mess.

  ---

  ## THE "MUST LAND" REPLY
  **The Distinction:** You must successfully distinguish **Moral Status** (lexical threshold/right to life) from **Moral Weight** (intensity of experience per unit time).
  *   **Why:** If these collapse, the Marginal Cases philosophers will prove you are a speciesist, or the Critical Animal Studies scholar will prove you are building a hierarchy of worth.
  *   **The Line:** *"Status determines who is in the game (inviolability); Weight determines how much the stakes matter within the game (suffering intensity). Humans are in the game by virtue of personhood/relations; animals are in the game by virtue of sentience. Once in the game, intensity scales with hardware."*

  ---

  ## THE "HOPE NOBODY ASKS" QUESTION
  **The Question:** (From the Clinical Neuroethicist) *"You tie moral weight to binding-structure neuron count. In pediatric hemispherectomies, we remove half the cortex. These children retain personhood, rich experience, and full moral status. By your metric, their moral weight should be halved. It plainly isn't. Your proxy is falsified."*

  **Why it's the worst:** It uses clinical data to empirically falsify your core thesis in front of the people who care most about human vulnerability.
  **The Reply:** *"Plasticity. The metric measures the capacity for binding in a species-typical brain. In hemispherectomy, the remaining neurons reorganize to assume the binding function. They become the new binding structure. The count is lower, yes, but the functional density per neuron increases. My metric tracks the hardware available for binding; in plasticity cases, the hardware is repurposed, not lost. However, I concede this metric is licensed only for species-typical comparisons, not individual pathological variance—which is why I exclude individual humans from the calculation entirely."*
  **Soft Spot:** You are relying on the "species-typical" dodge again. If they press that the *child* is the unit of moral concern, not the *species*, you have to fall back on the "Human Exemption" concession.

  ---

  ## TOP 8 OBJECTIONS (Ordered by Damage in This Room)

  ### 1. The Clinical Falsification (Clinical Neuroethicist)
  **Phrasing:** *"I've sat with parents of hemispherectomy patients. Their children are whole persons. Your math says they are half-persons. If your neuron count doesn't track human cases, why trust it for pigs?"*
  **2-Minute Reply:** Acknowledge the gravity. Reiterate the "Species-Typical" constraint. Argue that hemispherectomy is a radical reorganization event, not a standard biological state. The metric is designed for inter-species comparison of typical biology, not intra-species pathology. In the animal context, we aren't comparing injured to uninjured; we are comparing species-typical mice to species-typical cows.
  **Soft Spot:** If they argue that *individual* capacity is what matters morally, not *species-typical* capacity, your metric collapses for individuals.

  ### 2. The Legitimation Device (Critical Animal Studies)
  **Phrasing:** *"This isn't science; it's a technology of governance. Assigning scalar weight to lives legitimizes the 'humane' exploitation of the 'lesser.' You're building a calculator for the slaughterhouse."*
  **2-Minute Reply:** Refuse the utilitarian trap. Argue that *ignoring* differences is more dangerous. If a cow suffers 10x more intensely than a fish, and we treat them equally, we misallocate welfare resources and cause more net suffering. Transparency about weight helps prioritize abolition or harm reduction where it matters most. Hiding the scale doesn't stop exploitation; it just makes welfare work inefficient.
  **Soft Spot:** Hard to prove empirically that your metric leads to better outcomes than a flat "all lives equal" heuristic in a capitalist system.

  ### 3. The Speciesist Dodge (Marginal Cases Philosopher 1)
  **Phrasing:** *"You exclude humans to save your theory. But if neuron count matters for a pig, why doesn't it matter for a human with cognitive disabilities equivalent to that pig? This is status inconsistency."*
  **2-Minute Reply:** Lean on the "Status vs. Weight" distinction. Humans have a lexical threshold of moral status based on social/relational personhood, not just sentience. Once over that threshold, weight might still vary, but rights do not. For animals, who lack that lexical status, we must rely on sentience metrics. It is a dual-threshold system, not a single ladder.
  **Soft Spot:** This looks like ad hoc speciesism. You need to defend why "relational personhood" trumps "neural capacity" without sounding religious or arbitrary.

  ### 4. The Methodological Noise (Neuroanatomist)
  **Phrasing:** *"Isotropic fractionator requires tissue fixation. Shrinkage varies by species. You're basing moral weight on n=3 specimens with 20% error bars. That's not ethics; that's numerology."*
  **2-Minute Reply:** Concede the noise. Argue that body mass and EQ have *larger* error bars regarding consciousness. Neuron count is the *least bad* proxy we have. We don't need perfect precision to make triage decisions; we need signal-to-noise better than the status quo. If the error is random, it cancels out in large-scale policy.
  **Soft Spot:** If the error is systematic (e.g., fixation shrinks primate tissue more than rodent tissue), your entire scaling is biased.

  ### 5. The Redundancy Worry (Disability Bioethics)
  **Phrasing:** *"You assume 1 neuron = 1 unit of experience. But brains are redundant. Extra neurons might be backups, not new states. Why count hardware that isn't functionally unique?"*
  **2-Minute Reply:** Argue from metabolic cost. Evolution doesn't maintain expensive redundant hardware without function. Even if redundant for *survival*, those neurons contribute to the *resolution* or *bandwidth* of the experience. Redundancy allows for richer binding, not just safety.
  **Soft Spot:** We don't know the metabolic cost of "redundant" neurons vs. "active" neurons in wild animals.

  ### 6. The Frame-Rate Offset (EA Grad Student)
  **Phrasing:** *"Mice process visual data faster than humans. A mouse second might contain more 'moments' than a human second. If you scale by neuron count but ignore temporal density, your spreadsheet is wrong."*
  **2-Minute Reply:** Concede the point. This is why the metric is "Weight per Unit Time," not "Weight per Life." Acknowledge that a temporal multiplier is needed. However, argue that higher frame-rates often correlate with smaller brains/neurons, so the neuron count might already inversely correlate with speed. Don't promise a number yet; promise the variable.
  **Soft Spot:** We have almost no data on subjective temporal density across species. You're asking them to trust a variable you can't measure.

  ### 7. Recognition vs. Quantity (Marginal Cases Philosopher 2)
  **Phrasing:** *"Moral weight isn't a quantity to be measured; it's a relation to be recognized. You're turning a ethical demand into an engineering problem."*
  **2-Minute Reply:** Accept the philosophical framing but pivot to practice. *"In an ideal world, yes. In a world with limited welfare budgets, we have to triage. Recognition tells us *who* matters; this metric tells us *how much* harm is happening. We need both to act."*
  **Soft Spot:** Hard to defend "engineering" ethics to a room full of critical theorists without sounding cold.

  ### 8. Grain vs. Volume (General/You)
  **Phrasing:** *"More neurons might mean finer discrimination (grain), not deeper suffering (volume). A high-res pain isn't necessarily a heavier pain."*
  **2-Minute Reply:** Argue that richness of repertoire *is* moral weight. The ability to anticipate, remember, and nuance suffering makes it worse. A dull, monochromatic pain is less morally significant than a complex, anticipatory one. Neuron count tracks the capacity for that complexity.
  **Soft Spot:** This is phenomenological speculation. You have no way to prove that "complex pain" is worse than "intense simple pain."

  ---

  ## FINAL NOTE FOR THE SPREADSHEET STUDENT
  If asked for a multiplier: **Do not give one.**
  Say: *"The ratio of pallial neurons between Species A and Species B is the starting coefficient. Do not apply it to humans. Do not apply it to individual variance. Treat it as a prior, not a constant."*
  If you give a hard number, the Critical Animal Studies scholar will frame it as a "price list for lives," and the Neuroanatomist will dismantle the precision. Keep it scalar, not cardinal.
