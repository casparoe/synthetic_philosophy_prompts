answer: |-
  **The Teletransporter DMV**

  I step into the teleporter. The light blinks red. "Fission Event," the computer chirps. "Please step out, both of you."

  Two of me walk out. Let's call us Lefty and Righty. We look identical, down to the coffee stain on the shirt and the specific anxiety about whether we locked the front door. We immediately start arguing.

  "I'm the one with the student loans," Lefty says. "Which means I'm also the one with the credit score. I need the credit score for the mortgage."

  "Absolutely not," says Righty. "I have the psychological continuity. I remember taking out the loans. Therefore, I am the debtor. You're just the new guy. You take the loans; I'll take the Netflix profile."

  "I remember the loans too!" Lefty shouts. "I have Relation R with the borrower!"

  "So do I! That's why *I'm* the borrower!"

  A Teleportation Technician steps in, holding a clipboard. She looks tired. "Gentlemen, please. You're both holding up the queue."

  "Tell him," Lefty points at Righty. "He's a copy. I'm the original."

  "Am not," says Righty. "I have the memories. I have the personality. I have the right causal connection."

  The Technician sighs and flips open a manual titled *Parfit, D., Reasons and Persons, Chapter 10*. "Look, there is no 'original.' There is no further fact of the matter. Identity is a one-to-one relation. You two are one-to-two. Therefore, neither of you is identical to the person who stepped in. But both of you bear Relation R to him."

  "So... who pays the Sallie Mae bill?" they ask in unison.

  "Who cares?" The Technician shrugs. "Personal identity isn't what matters. Survival is what matters. And you're both surviving. Just split the debt and share the password. Arguing about who is 'really' you is like two halves of an amoeba suing each other for custody of the nucleus. It's an empty question."

  Lefty and Righty look at each other.
  "Fine," says Lefty. "But I'm keeping the apartment lease."
  "Over my dead body," says Righty. "Which, technically, hasn't happened yet."

  ***

  ### Philosophical Footnotes & Liberties Taken

  **1. Binary vs. Degrees of Continuity:**
  In the joke, I treat Psychological Continuity (Relation R) as a switch that flips on (you either have it or you don't). Parfit actually emphasizes that connectedness (direct psychological links) comes in *degrees*, while continuity (overlapping chains of connectedness) is what matters for survival. By making the copies perfect duplicates, I sidestep the "faded copy" problem where survival might be partial.

  **2. Ignoring the "Animalist" Objection:**
  The joke assumes Reductionism is true (we are just brains/bodies/psychological streams). It ignores Eric Olson's *Animalist* view or Wiggins' bodily continuity arguments, which would say the "original" is the biological organism that stayed in the scanner (if it wasn't destroyed) or that the fission products are merely psychologically similar *people*, not the *same person*. If Olson is right, the Technician is wrong, and the legal dispute is actually about biological persistence, not Relation R.

  **3. The "Empty Question" Assumption:**
  The punchline relies on Parfit's claim that questions of identity in fission cases are "empty" (have no yes/no answer because reality doesn't contain that fact). I'm treating this as a settled metaphysical truth for the sake of the bit, whereas in the literature, it's a highly contested deflationary move.

  ### When I Would Drop This Framing

  I would stop telling this joke and switch to a different one (perhaps about the horror of being replaced) if a compelling argument showed that **fission destroys the coherence of continuity-based survival** rather than illustrating it.

  Specifically, if the **"Too Many Thinkers"** problem or the **Branching Objection** proves fatal: If it can be demonstrated that having two successors logically entails that *neither* survives (because survival conceptually requires uniqueness, not just what matters), then Parfit's separation of "identity" and "what matters" collapses. If someone successfully argues that "what matters" *logically presupposes* identity (i.e., you can't care about psychological continuity unless you believe it preserves *you* specifically), then the Technician's advice becomes not just unhelpful, but metaphysically incoherent. In that world, the amoeba analogy fails because amoebas don't have prudential concern for their future branches, whereas persons arguably do require identity for that concern to be rational.
