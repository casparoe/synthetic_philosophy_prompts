  ## Part 3: The Positions (Occupied Cells)
  *These are the coherent combinations of verdicts. Where no canonical name exists, a label is invented.*

  | Position | Dim I (Ontology) | Dim II (Bounds) | Dim III (Causal) | Dim IV (Relativity) | Diagnosis |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hard Instrumentalist** | Physicalist | Bounded | Predictivist | Instrumental | Only the physical stance describes what is really there; higher stances are useful fictions. |
  | **Dennett-Style Realist** | Pattern Realist | Absolutist | Predictivist | Absolute | Patterns are real if they offer the best compression/prediction, independent of specific budgets. |
  | **Structural Platonist** | Pattern Realist | Absolutist | Interventionist | Absolute | Patternhood is mind-independent; if the structure exists, it is real, regardless of use. |
  | **Interventionist** | Pattern Realist | Control-First | Interventionist | Absolute | A pattern is real exactly when it licenses counterfactuals and supports control. |
  | **Pragmatist Relativist** | Pattern Realist | Bounded | Predictivist | Relative | Patternhood is relative to an observer's loss function and compute budget. |
  | **Quietist Deflationary** | Deflationary | Bounded | Contextual | Instrumental | Calling a pattern "real" adds nothing beyond its predictive usefulness; dissolve the question. |
  | **Mechanism Realist** *(Invented)* | Pattern Realist | Absolutist | Predictivist | Instrumental | Accepts the design stance as carving something real but eliminates the intentional stance as fiction. |
  | **Control-Realist** *(Invented)* | Pattern Realist | Control-First | Predictivist | Relative | Steerability makes a pattern real, even if it doesn't compress and varies by interface. |

  **Empty Cells (Diagnosed):**
  *   **Physicalist + Absolute:** *Incoherent.* If only physics is real, there cannot be one "true" high-level carving.
  *   **Pattern Realist + Instrumental:** *Incoherent.* If patterns are real, they are not merely instruments.
  *   **Deflationary + Absolute:** *Unattractive.* If "real" adds nothing, positing an absolute truth is otiose.
  *   **Interventionist + Relative:** *Unexplored.* Usually interventionists seek objective causal structures, not observer-relative ones.

