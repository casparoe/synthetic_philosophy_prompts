answer: |-
  # The Pattern Reality Diagnostic

  ## Part 1: The Diagnostic Questions
  *Answer each by selecting the option that best matches your intuition about the specific case described. Do not worry about consistency yet.*

  **1. The Glider (Ontology)**
  A glider moves across a Conway's Game of Life board. It survives collisions and regenerates.
  *   **A.** The glider is a real object existing *in* the board; the cells are just its substrate.
  *   **B.** The glider is just a description *of* the cells; only the cell states are real.
  *   **C.** The glider is real only relative to an observer looking for moving shapes.

  **2. The Cryptographic Stream (Budget)**
  A billion-bit stream comes from a secure pseudorandom generator. It is compressible in principle (tiny seed) but infeasible for any bounded observer to decompress.
  *   **A.** It is a patterned stream; the in-principle compressibility makes it real.
  *   **B.** It is not a pattern; if no feasible compressor can find the seed, it is noise.
  *   **C.** It is a pattern only relative to an observer's specific computational budget.

  **3. The Market & The Model (Intentionality)**
  A market price implies a probability of a rate cut; a language model acts to answer helpfully.
  *   **A.** The probability and the goal are real properties of the system.
  *   **B.** They are useful fictions; only the trading algorithms and matrix weights are real.
  *   **C.** They are real only relative to a user's loss function (what they care about predicting/steering).

  **4. The Thermostat (Design)**
  A thermostat turns on the furnace. We can predict it by saying it "believes" the room is cold, or by tracing its circuit.
  *   **A.** The belief attribution carves something real; the circuit is just the implementation.
  *   **B.** The belief is a shorthand; the circuit description is the only reality.
  *   **C.** Both are equally real descriptions of the same physical fact.

  **5. The Bee Colony (Levels)**
  Scout dances lead the colony to a nest site.
  *   **A.** The colony itself makes the decision; it is a cognitive agent.
  *   **B.** Only the individual bees decide; the "colony decision" is a summary.
  *   **C.** The colony decision is real, but only as a compression of the bees' actions.

  **6. The Goodharted Regularity (Fragility)**
  A regularity holds reliably in data but collapses the moment anyone trades on it.
  *   **A.** The pattern was never real; its fragility proves it was spurious.
  *   **B.** The pattern was real but was destroyed by the intervention.
  *   **C.** The pattern was real relative to the pre-intervention environment.

  **7. The Spurious Correlation (Counterfactuals)**
  A variable predicts perfectly but supports no counterfactuals (intervening on it changes nothing).
  *   **A.** It is not a real pattern; real patterns must support intervention.
  *   **B.** It is a real pattern; prediction is enough, counterfactuals are optional.
  *   **C.** It is a real pattern only for observers who cannot intervene.

  **8. The Unsteerable System (Control vs. Compression)**
  You can steer a system's behaviour perfectly, but it admits no shorter description than a raw state listing.
  *   **A.** There is no pattern; without compression, there is only noise you happen to control.
  *   **B.** There is a pattern; control is sufficient for reality even without compression.
  *   **C.** There is a pattern only relative to the controller's interface.

  **9. The Random Bits (Definition)**
  A bit sequence is algorithmically incompressible (truly random).
  *   **A.** It is devoid of pattern; randomness is the absence of structure.
  *   **B.** It has a pattern; "randomness" is a structural property of the sequence.
  *   **C.** It is patterned only relative to a compressor that fails to compress it.

  **10. Conflicting Compressions (Relativity)**
  Two observers with identical data and compute but different loss functions find different optimal clusters.
  *   **A.** Only one clustering is the true pattern; the other is mistaken.
  *   **B.** Both patterns are real; reality admits multiple incompatible carvings.
  *   **C.** Neither is "real"; they are just useful tools for different tasks.

  ---

  ## Part 2: The Logical Space
  *The 10 questions collapse into four logical dimensions. A "Cell" is a specific combination of verdicts across these dimensions. Not all combinations are coherent.*

  **Dimension I: Ontological Status (Q1, Q4, Q5, Q9)**
  *   **Physicalist:** Only the low-level substrate (cells, circuits, bees) is real.
  *   **Pattern Realist:** High-level objects (gliders, beliefs, colonies) are real.
  *   **Deflationary:** "Real" is the wrong word; usefulness is the only metric.

  **Dimension II: Computational Bounds (Q2, Q8)**
  *   **Absolutist:** In-principle compressibility/structure is sufficient.
  *   **Bounded:** Feasibility for a specific observer is required.
  *   **Control-First:** Compressibility is irrelevant; steerability is sufficient.

  **Dimension III: Causal Depth (Q6, Q7)**
  *   **Interventionist:** A pattern must survive intervention/support counterfactuals.
  *   **Predictivist:** Accurate prediction is sufficient for patternhood.
  *   **Contextual:** Fragility under action does not negate prior reality.

  **Dimension IV: Observer Relativity (Q3, Q10)**
  *   **Absolute:** There is one true carving of the system.
  *   **Relative:** Patterns depend on the observer's loss function/budget.
  *   **Instrumental:** Patterns are fictions, so relativity doesn't apply.

  **Coherence Constraints:**
  1.  **The Physicalist Trap:** If you choose **Physicalist** on Dim I, you cannot choose **Absolute** on Dim IV (you must be Instrumental or Deflationary).
  2.  **The Interventionist Conflict:** If you choose **Interventionist** on Dim III, you cannot choose **Control-First** on Dim II if the control lacks counterfactual support (see Q7).
  3.  **The Realist Requirement:** If you choose **Pattern Realist** on Dim I, you must choose either **Absolute** or **Relative** on Dim IV (you cannot be Instrumental).

