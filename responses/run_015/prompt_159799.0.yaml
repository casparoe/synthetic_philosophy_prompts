      *   Provide a concrete alternative protocol.

  7.  **Key Insight to Highlight:** The value of the group isn't agreement; it's *diversity of perspective* that survives evidence sharing. If you force agreement, you destroy the value of the group (the "wisdom of crowds" effect requires independence).

