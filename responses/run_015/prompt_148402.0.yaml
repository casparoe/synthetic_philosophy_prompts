answer: |-
  ### Adjudication of the Exchange

  **1. Jordan's Initial "Half-Broadcast" Proposal**
  *   **Rating:** **Partly right but missing something.**
  *   **Justification:** Jordan correctly identifies that modern Global Workspace Theory (GWT) often models broadcasting as graded (e.g., Dehaene), which allows for states that are globally available for some systems (emotion) but not others (report). This creates conceptual space between full Access Consciousness (A-consciousness) and unconscious processing. However, she misses that Ned Block's definition of A-consciousness is broad: if information is available for *any* rational control or modulation (including emotional regulation), it arguably qualifies as access. By narrowing "access" to only conceptual report, Jordan risks creating a verbal distinction without a functional difference, failing to fully decouple phenomenality from function.

  **2. Riley's "Refractory Residues" Objection**
  *   **Rating:** **Partly right but missing something.**
  *   **Justification:** Riley correctly points out that if Jordan's "half-broadcast" is still a form of access, the only way to save Phenomenal Consciousness (P-consciousness) is to posit it without *any* global availability. This aligns with Local Recurrent Processing theories (e.g., Lamme), which suggest early sensory processing can sustain experience. However, Riley is missing empirical grounding: calling these states "conscious" is an assumption, not a finding. He asserts the existence of "rich experiential character" in sub-threshold noise without independent evidence, effectively stipulating the conclusion he wants to prove.

  **3. Jordan's Response on Ad Hoc Attribution and Panpsychism**
  *   **Rating:** **Partly right but missing something.**
  *   **Justification:** Jordan is methodologically right to demand independent criteria for attributing consciousness to sub-threshold events; without them, the claim is indeed ad hoc. Her "subject" argument (that experience requires a unified subject, which implies integration) is philosophically robust. However, her charge of "panpsychism" is imprecise. Suggesting isolated neural loops are conscious is not cosmic panpsychism, but rather "micro-consciousness" or fragmentation. While the reductio highlights the absurdity of ubiquitous intracranial consciousness, the label is rhetorically inflated, obscuring the valid point about the unity of experience.

  **4. Riley's Distinction Between Integration and Broadcasting**
  *   **Rating:** **Partly right but missing something.**
  *   **Justification:** Riley makes a theoretically coherent move by distinguishing *local integration* (sufficient for P-consciousness) from *global broadcasting* (necessary for A-consciousness). This saves the phenomenon of rich experience from GWT's functional constraints. However, he is missing that this effectively abandons GWT as a theory of *phenomenal* consciousness. By conceding that P-consciousness does not require the workspace, he admits Jordan's original suspicion: GWT explains access, not phenomenality. He wins the point on phenomenology but loses the debate on whether GWT can accommodate it.

  **5. Jordan's Final Parsimony Challenge**
  *   **Rating:** **Clearly right.**
  *   **Justification:** Jordan identifies the fatal flaw in Riley's position: epiphenomenalism. If a conscious state (the anesthetized patient's V1 activity) makes no difference to cognition, behavior, or report, it is undetectable in principle. In a scientific context, positing entities that are causally inert and empirically inaccessible violates methodological parsimony. While metaphysically possible (as Chalmers might argue), scientifically it renders the theory vacuous. Jordan correctly holds that a theory of mind must explain how consciousness fits into the causal order, not just posit its existence in a causal vacuum.

  ### Overall Verdict
  **Jordan is more right overall.**

  While Riley successfully highlights the intuitive gap between functional access and felt experience (the core of Block's original distinction), his defense retreats into unfalsifiable metaphysics. Jordan maintains a scientifically tractable position. Her argument that consciousness must have some causal footprint (integration/availability) to be attributed to a subject is methodologically superior to Riley's willingness to posit undetectable "ghosts" in the neural machine. Jordan preserves the utility of GWT as a scientific theory, whereas Riley's view renders P-consciousness a scientifically idle property.

  ### The Deepest Issue
  The deepest issue both parties are failing to address is **the Explanatory Gap (The Hard Problem) masked by a verbal dispute over "Access."**

  Their disagreement is **partly verbal and partly substantive**, but both layers obscure the fundamental problem:
  1.  **Verbal:** They are talking past each other on the definition of "Access." Jordan treats "global availability" as a mechanistic threshold (GWT), while Riley treats "access" as a functional output (report/control). If they agreed on definitions, Jordan's "half-broadcast" might just be Riley's "local integration."
  2.  **Substantive (The Failure):** Neither addresses *why* either global broadcasting or local recurrence should produce *phenomenal experience* at all. They argue over *where* to locate consciousness in the neural architecture (Workspace vs. Local Cortex) assuming that identifying the correlate explains the phenomenon. They fail to address whether "Phenomenal Consciousness" is a well-defined natural kind that can be neatly mapped onto neural processes, or if their debate is merely about how to label functional capacities. By treating P-consciousness as a "thing" to be located rather than a problem to be explained, they bypass the Hard Problem entirely.
