answer: |-
  This is a sharp piece of philosophy. You are right to worry that it "proves too much." If this argument holds, it doesn't just dismantle Effective Altruism (EA); it dismantles expected utility theory (EUT), cost-benefit analysis, and indeed any decision theory that relies on maximizing a function. Since you want to preserve the coherence of EUT and utilitarianism while still critiquing "measurability bias" in EA, you need to find the step where the argument conflates *measurement conventions* with *substantive arbitrariness*.

  The break point is **Premise (8)**.

  Here is the diagnosis of why it looked plausible, why it is false, and what you pay to reject it.

  ### The Break Point: Premise (8)

  > **(8) If the choice of unit is arbitrary, then the EMV ranking it produces depends on an arbitrary choice, and so is not a fact about which option is genuinely better.**

  **Why it looked fine on first reading:**
  This premise relies on a natural language ambiguity regarding the word "arbitrary." In ethics, if a premise is arbitrary, the conclusion usually collapses (e.g., "You should kill because I arbitrarily say so"). The argument assumes that because the *unit* (the "meter stick" of goodness) is a human convention, the *measurements* derived from it are unstable or lack truth conditions. It treats moral units like "choosing a favorite color" rather than "choosing between Celsius and Fahrenheit."

  **Why you should reject it:**
  In measurement theory and decision science, the choice of unit is **conventional**, not **arbitrary in a way that affects ordering**.

  Expected Moral Value (EMV) operates on a **ratio scale**. A key feature of ratio scales is invariance under positive linear transformation.
  *   If Option A has 10 "moral units" and Option B has 5 "moral units," A > B.
  *   If you change your unit by a factor of 1,000 (milli-moral-units), Option A has 10,000 and Option B has 5,000. A > B.
  *   If you change your unit by a factor of 0.01, Option A has 0.1 and Option B has 0.05. A > B.

  The *magnitude* of the difference changes, but the **ranking** does not. Since the decision procedure is "maximize EMV" (i.e., pick the top of the ranking), the choice of unit is irrelevant to the output of the decision procedure.

  Therefore, the choice of unit can be "arbitrary" (in the sense that there is no Platonic "Moral Meter" stored in a vault in Paris) without rendering the ranking arbitrary. The ranking depends on the *structure* of the values, not the *label* of the unit. Premise (8) falsely infers that conventionalism about units entails indeterminacy about orderings.

  ### The Secondary Break Point: Premise (7)

  > **(7) If the choice of unit is a substantive moral judgment, then the EMV computation presupposes the very kind of judgment it was supposed to do for us, and is circular.**

  **Why it looked fine:**
  It appeals to the worry that you can't use a moral theory to justify a moral theory. If defining the "unit" requires deciding how much suffering matters relative to joy, haven't you already done the moral work?

  **Why you should reject it:**
  This mischaracterizes how axiomatic systems work. It confuses **circularity** with **foundationalism**.
  *   **Circularity:** "Action X is right because EMV says so, and EMV is right because Action X is right."
  *   **Foundationalism:** "We accept Utilitarianism as a foundational axiom. Given that axiom, EMV is the correct procedure. Therefore, Action X is right."

  All normative theories rest on substantive moral judgments (axioms). Utilitarianism posits "maximize welfare." Deontology posits "respect rights." Pointing out that EMV rests on substantive moral judgments (like how to weigh lives against each other) is not a *reductio*; it is simply identifying the theory's axioms. Premise (7) tries to frame the necessity of axioms as a defect, which would refute *every* normative theory, not just EA.

  ### The "Proves Too Much" Test

  If you reject (7) and (8) as outlined above, does the argument still kill Utilitarianism or Expected Utility Theory?
  *   **No.** Standard EUT acknowledges that utility functions are unique only up to positive linear transformation (rejecting 8). It also acknowledges that EUT rests on the VNM axioms, which are substantive rational/moral commitments (rejecting 7).
  *   By rejecting these premises, you save EUT and Utilitarianism from the charge of incoherence, while leaving room to critique EA on other grounds.

  ### The Cost: What the Defender of EMV Must Concede

  If you reject (8) and (7) to save the decision procedure, you cannot claim that EMV is a "value-free" or "purely scientific" algorithm. You must concede the following:

  1.  **EMV is not a moral neutralizer:** You cannot say, "We don't need to argue about values, just run the EMV calculation." The calculation *embeds* value judgments (specifically, the axioms that allow you to construct the scale in the first place).
  2.  **Interpersonal Comparison is the Real Battleground:** The "Measurability Bias" critique in EA is usually not about the *metaphysics* of units (which this argument attacks), but about the *epistemology* of interpersonal comparison. You must concede that while the *math* of EMV is stable under unit changes, the *input* (how many units does saving a life generate vs. curing blindness?) is where the substantive moral work happens.
  3.  **No "View from Nowhere":** You cannot claim EMV gives you the "God's eye view" of morality. It gives you the optimal action *relative to a specific axiomatic framework* (e.g., total utilitarianism).

  ### The Gain: What the Measurability-Bias Critic Loses

  By forcing the critic to accept the rejection of (8) and (7), you strip them of their strongest weapon. They can no longer claim:
  *   **"EA is Incoherent":** They must retreat from saying the procedure is broken to saying it is *difficult to apply*.
  *   **"Quantification is Impossible":** They must admit that quantification is *possible* (mathematically and conceptually) but perhaps *epistemically demanding*.
  *   **"EA Pretends to be Science":** They lose the claim that EA is pseudoscience because it lacks units. They must instead argue that EA's *estimates* of those units are unreliable.

  ### Summary of the Exit

  The argument you found is a sophisticated version of the **incommensurability objection**. It tries to show that moral values cannot be put on a common scale.

  *   **Reject Premise (8):** Changing the unit (convention) does not change the ranking (decision), so the procedure is not arbitrary.
  *   **Reject Premise (7):** Relying on axioms is foundationalism, not circularity.

  **The Modified Conclusion:**
  The EMV procedure provides genuine moral guidance *conditional on* accepting the underlying axioms that allow for cardinal measurement. The "Measurability Bias" is not that measurement is *impossible* (metaphysical), but that EA practitioners often act as if the *inputs* are more certain than they are (epistemic).

  This allows you to critique EA for being overconfident in its numbers (the usual measurability bias critique) without having to argue that using numbers at all is philosophically bankrupt.
