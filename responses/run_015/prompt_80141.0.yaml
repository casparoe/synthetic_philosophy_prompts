  # JOINT STATEMENT ON FREE WILL AND DETERMINISM
  **A Collaborative Draft by Compatibilist and Hard Determinist Signatories**

  **Preamble:** We, the undersigned, acknowledge that we share a commitment to naturalism and accept the truth of causal determinism. We agree that the past state of the universe, combined with the laws of nature, entails every future state, including human decisions and actions. Our disagreement is not metaphysical, but concerns the semantic and normative implications of this fact for human agency and moral responsibility.

  ### I. Agreed Claims

  1.  **Metaphysical Baseline:** We agree that indeterminism (in the sense of uncaused events affecting human choice) is false. Every human decision is the inevitable result of prior causal chains extending back before the agent's birth.
  2.  **The Illusion of Openness:** We agree that the subjective *feeling* of being able to do otherwise in the moment of choice does not prove the metaphysical capacity to do otherwise. Both sides accept that this phenomenology is compatible with determinism.
  3.  **Pragmatic Necessity:** We agree that society requires mechanisms to regulate behavior, protect safety, and encourage prosocial conduct. We agree that abandoning all distinctions between voluntary and involuntary action would lead to catastrophic social outcomes, regardless of the truth of determinism.
  4.  **The Role of Reason:** We agree that human beings differ significantly in their capacity to respond to reasons, incentives, and threats. We agree that these differences are themselves causally determined but are empirically real and relevant to how we treat individuals.
  5.  **No "Magic" Freedom:** We agree that no form of free will exists that violates the laws of physics or allows an agent to be a *causa sui* (cause of itself) in an uncaused sense.

  ### II. Disagreements and Cruxes Table

  | Issue / Crux | Compatibilist Position | Hard Determinist Position |
  | :--- | :--- | :--- |
  | **1. Core Definition of Free Will** | **Claim:** Free will is the *capacity* to act according to one's own desires, reasons, and character without external coercion or internal compulsion (e.g., psychosis).<br><br>**Wording:** "An agent has free will if they are the appropriate locus of causal control, even if that control is determined." | **Claim:** Free will requires *ultimate origination*. To be free, an agent must be the ultimate source of their actions in a way that is not fully determined by prior causes.<br><br>**Wording:** "An agent has free will only if they possess the power to break the causal chain, making them the ultimate author of their actions." |
  | **2. Moral Responsibility** | **Claim:** Responsibility is grounded in *accountability* and *reason-responsiveness*. Blame and praise are justified as reactive attitudes that regulate behavior and acknowledge agency.<br><br>**Wording:** "Moral responsibility survives determinism because it depends on the agent's relationship to their reasons, not on metaphysical openness." | **Claim:** Responsibility requires *Basic Desert*. For blame to be fair, the agent must have had the genuine ability to avoid the blameworthy action in a categorical sense.<br><br>**Wording:** "Moral responsibility is incompatible with determinism because it is unfair to blame agents for actions they could not ultimately avoid." |
  | **3. Crux One: The Principle of Alternative Possibilities (PAP)**<br>*(Testing the hypothesis: Does responsibility require the ability to have done otherwise?)* | **Concrete Case:** *The Rewind Universe.* Imagine we rewind the universe to exactly one minute before a choice, keeping all laws and prior states identical. <br><br>**Prediction:** We agree the agent *cannot* choose differently in the replay. However, the Compatibilist concludes this **does not negate responsibility**. The relevant "ability" is conditional (e.g., "I could have if I had wanted to"), not categorical. | **Concrete Case:** *The Rewind Universe.* Imagine we rewind the universe to exactly one minute before a choice, keeping all laws and prior states identical.<br><br>**Prediction:** We agree the agent *cannot* choose differently in the replay. The Hard Determinist concludes this **negates responsibility**. If the agent cannot produce a different outcome in even one replay of identical conditions, they lack the control required for desert. |
  | **4. Crux Two: The Function of Free Will**<br>*(Testing the hypothesis: Is free will for responsibility or for sourcehood/meaning?)* | **Concrete Case:** *The Manipulated Hero.* An agent is causally determined (via upbringing/genetics) to save a child from a burning building. They feel no internal conflict and act on their own values.<br><br>**Prediction:** The Compatibilist concludes the agent **deserves praise**. The function of free will is to identify actions that flow from the agent's character, making them a valid target for social reinforcement, regardless of the origin of that character. | **Concrete Case:** *The Manipulated Hero.* An agent is causally determined (via upbringing/genetics) to save a child from a burning building. They feel no internal conflict and act on their own values.<br><br>**Prediction:** The Hard Determinist concludes the agent **does not deserve basic praise**. The function of free will is to establish *ultimate sourcehood*. Since the agent's character was ultimately formed by luck (genes/environment), the action is not *ultimately* up to them, making praise merely pragmatic, not morally foundational. |

  ### III. Joint Assessment: Verbal vs. Substantive Dispute

  After reviewing the claims and cruxes above, we offer the following assessment regarding the nature of our disagreement:

  **1. The Verbal Component:**
  We acknowledge that a significant portion of our debate is **semantic**. We are using the term "Free Will" to label different clusters of properties.
  *   The Compatibilist uses "Free Will" to mean *Voluntary Agency* (freedom from coercion).
  *   The Hard Determinist uses "Free Will" to mean *Metaphysical Liberty* (freedom from causal determination).
  *   **Resolution:** If we agree to distinguish between "Free Will (Compatibilist)" and "Free Will (Libertarian/Hard Determinist)," we agree that "Free Will (Compatibilist)" exists and "Free Will (Libertarian)" does not.

  **2. The Substantive Component:**
  We conclude that the dispute is **not merely verbal**. Even if we standardize our terminology, we disagree on normative ethics and the justification of reactive attitudes.
  *   **Retributive Justice:** The Hard Determinist holds that retributive punishment (punishment justified *because* the offender deserves to suffer) is morally impermissible under determinism. The Compatibilist holds that retributive attitudes can be morally permissible if they track reasons-responsiveness.
  *   **The Fairness of Luck:** The Hard Determinist argues that because our character is determined by "constitutive luck" (factors outside our control), any system of desert is fundamentally unfair. The Compatibilist argues that fairness is internal to the social practice of holding agents accountable, not dependent on escaping luck.
  *   **Crux Verification:** Our hypothesis is confirmed. The disagreement splits along the two cruxes identified:
      1.  Whether the *conditional* ability to do otherwise is sufficient for responsibility (Crux 1).
      2.  Whether the purpose of responsibility is *social regulation* (Compatibilist) or *cosmic justice/ultimate authorship* (Hard Determinist) (Crux 2).

  **Signed,**

  _________________________
  *Representative, Compatibilist Working Group*

  _________________________
  *Representative, Hard Determinist Working Group*
