prompt: |-
  Hey, im working on a feature for the magazine about how philosophy departments are tweaking exams so students cant just regurgitate the standard lecture notes. I was chatting with a metaphysics prof over coffee and she said shes tired of seeing the same old Ship of Theseus answers every semester — you know, the usual same-ship-because-continuity vs different-ship-because-parts routine. She wants an exam prompt that forces upper-level students to actually wrestle with persistence conditions, not just name-drop.

  Heres the twist she wants injected: forget wooden planks. Imagine the original ship is slowly replaced by bio-engineered coral that grows into the identical shape and functional layout, but contains zero original wood atoms and has a totally disrupted causal chain. At the same time, a museum in another city rebuilds a perfect wooden replica using every original plank they preserved. The exam should ask students to pick one of the three standard positions — endurantism, perdurantism, or conventionalism — and defend it through this coral-and-replica case. They specifically need to say whether the coral-ship counts as having survived, and they have to deal with the tension between spatio-temporal continuity and functional continuity without just repeating textbook definitions.

  She wants the full package: the exam question itself, a model answer around 600 words, and a marking scheme out of 20 that splits an A from a B by listing the exact moves. For example, an A should distinguish material continuity from functional role, correctly apply the chosen metaphysical framework to the coral case without hand-waving, and address why intuition pumps break down with bio-engineered replacements. A B might summarize the standard ship problem well but miss the coral-specific problem or conflate endurantism with essentialism. Also she said 90 minutes, max about 800 words for the answer. No bibliography needed — this is for my article on exam design, not a literature review. And please dont drop in any verbatim quotes from whoever originally told the plank-rebuilding story; i remember theres a classic version but i dont have the text in front of me, so just paraphrase if you mention it. Thanks!
