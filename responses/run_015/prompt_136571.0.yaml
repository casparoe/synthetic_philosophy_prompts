answer: |-
  ### Exam Question: Metaphysics of Artifacts (PHIL 402)

  **Time Allowed:** 90 Minutes
  **Word Limit:** Maximum 800 words

  **Prompt:**
  Consider the following variation on the Ship of Theseus. The original vessel (*Ship O*) is docked. Over five years, bio-engineered coral is induced to grow over the hull, metabolizing the wood until *Ship O* consists entirely of living coral. It maintains the exact functional layout and spatio-temporal location of the original, but contains zero original wood atoms and the causal chain of manufacture is disrupted by the biological intervention. Simultaneously, a museum collects every discarded wooden plank and reassembles them into a perfect replica (*Ship R*) in a different city.

  Select **one** of the following metaphysical frameworks: **Endurantism**, **Perdurantism**, or **Conventionalism**.

  Using only your chosen framework, argue whether the coral vessel (*Ship C*) counts as the surviving original ship. Your answer must:
  1.  Define persistence conditions within your chosen framework.
  2.  Explicitly distinguish between material continuity and functional role in this specific case.
  3.  Explain why standard intuition pumps regarding wooden planks fail or succeed when applied to bio-engineered replacement.

  ***

  ### Model Answer (Conventionalism)

  **Selected Framework:** Conventionalism

  Conventionalism posits that identity over time is not a deep metaphysical fact discoverable in the world, but rather a product of our linguistic and conceptual schemes. Objects persist only insofar as our conventions dictate that they do. There is no "fact of the matter" independent of human interests regarding whether *Ship C* (coral) or *Ship R* (reassembled wood) is the true Ship of Theseus.

  In standard artifact cases, conventions usually prioritize either material constitution or functional continuity. For a hammer, functional role dominates; if I replace the handle, it remains the same hammer. For a heirloom diamond, material constitution dominates; a synthetic replica is not the same object. The bio-engineered coral case creates a conflict because it decouples these conventional markers. *Ship C* maintains functional and spatio-temporal continuity but loses material constitution. *Ship R* maintains material constitution but loses spatio-temporal continuity and current functional role (as a museum piece).

  Applying conventionalism to *Ship C*, we must ask what our current conventions prioritize for ships. Historically, ships are defined by their function (navigation) and continuous history of maintenance. Under a functionalist convention, *Ship C* survives because it continues to serve the role of the ship in the original location. The material shift from wood to coral is irrelevant if the convention for "ship identity" allows for gradual replacement of parts, even if the new parts are biologically distinct. However, the prompt notes a "disrupted causal chain." If our convention requires a continuous history of human maintenance, the bio-engineered growth might violate this. Yet, conventionalism allows us to adjust the scheme. If we value the living vessel, we adjust the convention to include biological growth as valid maintenance.

  The crucial advantage of conventionalism here is handling the tension between material and functional continuity without contradiction. An endurantist might struggle to explain how the substance changes entirely while the object remains. A conventionalist argues the object remains only because we *say* it does. If we care about the wood, *Ship R* is the original. If we care about the voyage, *Ship C* is the original. Neither is metaphysically privileged.

  This explains why standard intuition pumps break down with bio-engineered replacements. Classic thought experiments assume inert materials (planks) swapped gradually. Intuition relies on a clear distinction between "the object" and "the matter." Bio-engineering blurs this distinction because the matter is now alive and growing, not merely swapped. The causal disruption further strains intuition because the growth is not a standard repair but a biological overwrite. Our standard conventions for artifacts assume passive matter; when the matter becomes active (coral growing), our linguistic rules for identity lack clear guidance.

  Therefore, *Ship C* survives only relative to a convention that prioritizes functional/spatio-temporal continuity over material constitution. There is no metaphysical truth here. The "A" grade move is recognizing that the confusion arises not from the world, but from expecting a single answer where our conventions conflict. We must choose a scheme based on our interests (preservation vs. usage), acknowledging that the coral ship is the original only within the scheme that values functional continuity despite material and causal disruption.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Framework Application (6 Marks)**
  *   **A (5-6):** Clearly defines the chosen position (e.g., Conventionalism) without conflating it with others (e.g., does not treat Endurantism as synonymous with Essentialism). Applies the framework consistently to the specific coral case.
  *   **B (3-4):** Defines the position correctly but applies it generically. May slip into metaphysical realism (claiming there *is* a fact of the matter) while claiming to be a conventionalist.
  *   **C (0-2):** Incorrect definition or failure to apply the framework to the prompt.

  **2. Material vs. Functional Distinction (6 Marks)**
  *   **A (5-6):** Explicitly analyzes the tension between the coral's functional continuity and the wood's material continuity. Explains how the chosen framework resolves or dissolves this tension.
  *   **B (3-4):** Identifies the difference between wood and coral but treats them as standard plank swaps. Fails to address why the *type* of material (bio-engineered vs. wood) matters.
  *   **C (0-2):** Ignores the material/functional distinction or conflates the two.

  **3. Handling the Bio-Engineering Twist (5 Marks)**
  *   **A (4-5):** Addresses the "disrupted causal chain" and the active nature of the coral. Explains why standard intuition pumps (inert planks) fail here (e.g., active growth vs. passive replacement).
  *   **B (2-3):** Mentions the coral but treats it exactly like wooden planks. Ignores the causal disruption or biological aspect.
  *   **C (0-1):** No mention of the specific twist conditions.

  **4. Clarity and Argument Structure (3 Marks)**
  *   **A (3):** Concise, logical flow, within word limit. No hand-waving.
  *   **B (2):** Understandable but slightly disorganized or verbose.
  *   **C (0-1):** Difficult to follow or significantly over/under word count.

  **Grade Boundary Notes:**
  *   **To secure an A (16+):** The student must avoid the trap of solving the puzzle metaphysically. They must show *why* the puzzle exists (conflicting conventions/intuitions) and specifically address how bio-engineering disrupts standard causal histories.
  *   **A B grade (12-15):** Typically results from a solid summary of the Ship of Theseus that fails to engage with the *bio-engineered* specificities. If the student treats the coral exactly like wood planks, they cannot score higher than a B, regardless of philosophical accuracy. Conflating Endurantism with Material Essentialism is an automatic cap at B.
