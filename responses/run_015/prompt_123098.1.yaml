      *   **Thesis:** Exposure-based fixes (showing opposing views, fact-checking) often fail or backfire in echo chambers because the issue is *trust*, not *access*. The solution lies in expanding who people trust (testimonial surface area).
      *   **Task:** Draft Q&A prep with ~7 objections.
      *   **Format:** Table with columns: Who, Objection (in their voice), Damage (H/M/L), Two-minute reply, Where reply is softest.
      *   **Specific Requirement:** Include the "hope nobody asks" question (personal/brother angle) and handle it honestly/toughly.
      *   **Ordering:** By damage potential (High to Low).

  2.  **Analyze the Audience & Stakeholders:**
      *   **Librarians:** Committed to information literacy, believe anyone can learn to find reliable sources. *Potential friction:* Your thesis suggests their current methods (source checking) might be ineffective or harmful in certain contexts.
      *   **Civics Teachers:** Need scalable, measurable interventions for 120 students. *Potential friction:* "Testimonial surface area" sounds hard to teach/measure in a semester.
      *   **County Commissioner:** Thinks media literacy is indoctrination. *Potential friction:* Might seize on the idea that "trust" is subjective to argue against the program entirely, or argue that this approach is manipulative.

  3.  **Brainstorming Objections:**
      *   *Librarian:* "If we can't teach them to check sources, what *do* we teach? Are we giving up on truth?"
      *   *Teacher:* "How do I grade 'trust'? I need a curriculum that fits in 45 minutes."
