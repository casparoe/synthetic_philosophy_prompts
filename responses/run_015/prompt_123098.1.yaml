  | **County Commissioner** | "Hold on. You're telling me that instead of teaching people to verify facts, you want us to run a social engineering program to change who they trust? That sounds less like literacy and more like propaganda. Why should tax dollars fund you manipulating community trust networks?" | **High** | "I understand why that sounds manipulative, but the distinction is critical. Propaganda tells you *what* to think; this framework identifies *who* you already listen to and asks why that circle has shrunk. We aren't asking the library to become a trusted source; we're asking them to identify the trusted sources that already exist—the mechanic, the coach, the nurse—and partner with them. If we only push 'official' sources, we confirm the bias that institutions are lying. We aren't building trust in the government; we're rebuilding the connective tissue the government needs to function. If we don't, the cost isn't just confusion; it's paralysis." | It *is* a form of social engineering. Distinguishing 'repairing' trust from 'manufacturing' it is philosophically messy, and a determined critic can paint any trust-building as manipulation. |
  | **Head Librarian** | "Our mission is equitable access to accurate information. If I hear you right, you're saying source evaluation drills are useless. Are you asking us to abandon the idea that there is such thing as a reliable source? That feels like surrendering to post-truth relativism." | **High** | "Not surrender, but triage. Source evaluation works for people in an *epistemic bubble*—they just haven't seen the evidence. But for someone in an *echo chamber*, handing them a 'reliable source' checklist is like handing a map to someone who thinks the cartographer is an enemy. I'm not saying truth doesn't exist. I'm saying truth without a trusted messenger is just noise. We keep teaching verification, but we have to pair it with *messenger validation*. We teach patrons to ask: 'Why do I trust this person?' before we ask 'Is this link secure?' Otherwise, we're just shouting into a void we helped dig." | It risks sounding like we are lowering standards for 'reliability.' It's hard to explain how to validate a messenger without falling back into the very source-checking I'm critiquing. |
  | **Civics Teacher** | "I have 120 kids, 45-minute periods, and a state test. 'Testimonial surface area' sounds profound, but how do I grade it? If I can't measure it in a semester, I can't use it. Do you have a worksheet for this, or is this just theory?" | **High** | "You can measure it, but not with a multiple-choice quiz. Assign a 'Trust Audit.' Have students map the five people they'd believe if those people contradicted their parents or their favorite YouTuber. Then, have them interview one person outside that circle—not to debate, but to ask, 'Who do *you* trust?' The metric isn't 'did they change their mind?' The metric is 'did they identify a new node in their network?' If a student leaves your class able to name three credible voices they disagree with but still respect, you've expanded their surface area. That's a civic skill more durable than knowing how to find an ISSN number." | It's still subjective grading. Administrators want data, and 'respectful disagreement' is harder to quantify than 'correct citation.' |
  | **Sharp-eyed Attendee (The "Hope Nobody Asks")** | "You opened with your brother. Be honest: Is this whole theory just a sophisticated way of processing the grief that your brother doesn't talk to you anymore? Are we building a county-wide program on the basis of one family's estrangement?" | **Med** | "That's a fair cut. Yes, the pain is personal. If my brother hadn't slipped away, I probably wouldn't be standing here. But anecdote isn't data; it's a hypothesis generator. The research on echo chambers supports this: trust decays before facts do. My brother is the N=1 that sent me to the literature, not the literature itself. However, you're right to be wary. If I'm proposing this as a way to 'get my brother back,' I'm the wrong person to lead it. I'm proposing this so other families don't end up at my dinner table. Use the framework, check my bias, but don't throw out the tool because the person holding it is scarred." | It admits vulnerability which can be weaponized. It acknowledges the N=1 problem without fully solving it. It relies on the audience's empathy, which might not be there. |
  | **Tech-Savvy Librarian** | "You're focusing on social roles, but aren't you ignoring the algorithm? My patrons aren't distrusting nurses because of a social choice; they're distrusting them because Facebook feeds them videos saying nurses are traffickers. How does 'surface area' fix a code problem?" | **Med** | "Algorithms amplify existing fractures; they rarely create them from scratch. The algorithm knows to feed the anti-nurse video because the user has already signaled a distrust of medical institutions. If we only fight the algorithm, we're playing whack-a-mole with content. If we expand the testimonial surface area, the algorithm loses its leverage. If I trust my local nurse *and* my online community, the video becomes a point of conflict rather than confirmation. We can't ban the content, but we can armor the social bond. Tech breaks the connection; only humans can rebuild it." | It understates the sheer power of algorithmic radicalization. Sometimes the code *does* create the distrust where none existed. |
  | **Civics Teacher** | "Okay, but what if their 'trusted surface' includes a conspiracy theorist? You're saying we should respect who they trust. What if they trust the wrong person? Do we validate that?" | **Med** | "We don't validate the *belief*, we acknowledge the *bond*. If a student trusts a uncle who believes QAnon, telling them 'he's a liar' severs the link and pushes them deeper. The intervention is to add *another* node, not cut the existing one. We introduce a new trusted figure who contradicts the uncle on specific points without attacking the uncle's character. It's not about validating the conspiracy; it's about preventing the isolation that makes the conspiracy sticky. We're not endorsing the uncle; we're ensuring the student has enough other voices that the uncle isn't the *only* voice." | It's a high-wire act. In practice, adding nodes often feels like validating the bad ones. It requires nuance that tired teachers might not have. |
  | **Community Advocate** | "This sounds like it privileges people with 'good' social networks. What about patrons who are isolated? No dive shop guy, no trustworthy coworker. Isn't 'testimonial surface area' just a classist way of saying 'poor people are easier to radicalize'?" | **Low** | "It's not classist to observe that isolation is a risk factor; it's a public health reality. Loneliness is a predictor of radicalization. But this isn't about blaming the isolated; it's about the library *becoming* the surface area. For patrons with no network, the librarian isn't just a source of books; they have to be a source of social stability. That's a heavy lift, and it means we need resources for community building, not just database access. We acknowledge the deficit so we can fill it, rather than pretending everyone walks in with the same social capital." | It admits the library system is under-resourced for this kind of social work. It places a burden on staff that they may not be trained or paid to handle. |
