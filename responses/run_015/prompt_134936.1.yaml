answer: |-
  ### Lewisian Convention vs. Evolutionary Stabilization: The Case of Normative Residue

  David Lewis's account of convention and the evolutionary-game-theoretic (EGT) account of norms offer distinct metaphysical and explanatory frameworks for social regularities. The tension between them centers on **arbitrariness**: Lewis requires that a convention be one of multiple viable solutions to a coordination problem *at the time of its practice*, whereas EGT explains stability through path dependence and selection dynamics that often render alternatives non-viable over time.

  The case of "normative residue"—specifically, a grammatical gender system that began as an arbitrary agreement but became structurally embedded—tests the limits of Lewis's definition. Below is an analysis of whether such a practice remains a Lewisian convention, which conditions hold, and how EGT resolves the tension.

  #### 1. Framework Comparison: Rational Expectation vs. Dynamic Stability

  **Lewis's Account (Synchronic and Rationalist):**
  For Lewis, a convention is a solution to a coordination problem sustained by a system of **expectations**.
  *   **Mechanism:** Agents conform because they expect others to conform, and they prefer to coordinate.
  *   **Arbitrariness:** Crucially, there must be at least one alternative regularity ($R'$) that *could* have served the same purpose. If $R$ is the only rational solution, it is not a convention but a necessity.
  *   **Agency:** Agents must possess common knowledge of the regularity and the preferences sustaining it.

  **Evolutionary Game Theory (Diachronic and Naturalist):**
  EGT views norms as **Evolutionarily Stable Strategies (ESS)**.
  *   **Mechanism:** Regularities stabilize through repeated interaction, replication of successful strategies, and selection pressures (social or biological).
  *   **Arbitrariness:** EGT acknowledges historical arbitrariness (path dependence), but once a norm fixes, selection pressures often eliminate alternatives. The norm appears "uniquely optimal" not because of inherent superiority, but because the cost of deviation (invasion by mutants) is too high.
  *   **Agency:** Agents need not represent the norm as a solution; they merely need to behave in ways that avoid negative payoffs.

  #### 2. Analysis of the "Normative Residue" Case

  In the case of linguistic gender-marking, the practice originated as a Lewisian convention (arbitrary assignment, common knowledge, conditional preference). However, over generations, it became grammatically embedded. Deviation now causes communication breakdown or social sanction. The original coordination problem (distinguishing nouns) remains, but the *choice* of system has vanished.

  **Does it remain a convention in Lewis's strict sense?**
  **No.** While it retains the *form* of a convention, it loses the *substance* of Lewisian arbitrariness. It has transitioned into a **non-conventional norm** (or a constitutive rule).

  Here is the status of Lewis's three specific conditions in this scenario:

  1.  **Common Knowledge of the Regularity:** **APPLIES.**
      Speakers still know the rule (e.g., "table" is feminine). They also likely possess historical or comparative knowledge that other systems exist (e.g., genderless languages). However, Lewis requires common knowledge not just of the rule, but of the *contingency* of the rule as a live option. If speakers know the alternative is historically possible but practically impossible, the "common knowledge" condition is strained.

  2.  **Preference for Conditional Conformity:** **TRANSFORMED.**
      *   *Lewisian Standard:* I prefer to conform *because* I expect you to conform, to solve a coordination problem.
      *   *Residue Case:* I prefer to conform because deviation incurs high **switching costs** or **sanctions**.
      In Lewis's model, the preference is driven by the *benefit of coordination*. In the residue case, the preference is driven by the *avoidance of penalty*. While mathematically similar in a payoff matrix, philosophically this shifts the motivation from "let's coordinate" to "I must comply." The conditional preference becomes coercive rather than cooperative.

  3.  **Availability of Alternatives (Arbitrariness):** **FAILS.**
      This is the breaking point. Lewis requires that an alternative regularity $R'$ be a *viable* equilibrium.
      *   *Lewis's Criterion:* If others switched to $R'$, I would prefer to switch to $R'$.
      *   *Residue Reality:* Even if others switched, the transition cost (relearning grammar, social stigma during transition) might be so high that I would *not* prefer to switch. The alternative is no longer a "possible regularity" in the relevant sense; it is a "theoretical possibility" but a "practical impossibility."
      Because the alternative is erased by the dynamics of the system (grammatical embeddedness), the regularity is no longer arbitrary in the present tense. It has become **functionally necessary**.

  #### 3. The Evolutionary Explanation of the Transition

  EGT provides a coherent description of how a Lewisian convention ossifies into a non-conventional norm.

  *   **Path Dependence:** EGT explains that the initial selection of the gender system was arbitrary (multiple equilibria existed).
  *   **Lock-In:** Over time, the norm accumulated "increasing returns." As more agents adopted it, the cost of deviation increased (network effects). Eventually, the system reached a point where the alternative equilibrium, while theoretically possible, is unreachable without a massive, simultaneous coordination shock.
  *   **Selection Dynamics:** The norm is now maintained by selection-like pressures (social exclusion, communicative failure) rather than mutual expectation of cooperation.

  **Can EGT describe agents who regard the practice as arbitrary?**
  **Yes.** EGT distinguishes between the **dynamics of behavior** and the **cognitive representation** of agents.
  *   *Behavioral Level:* Selection pressures punish deviation, making the norm behave *as if* it is necessary.
  *   *Cognitive Level:* Agents can retain the representation that the norm is arbitrary (e.g., a linguist knowing gender is historical residue).
  *   *Coherence:* EGT coherently describes a population where agents *know* $R'$ is possible (historical arbitrariness) but *act* as if $R$ is necessary (current stability). Lewis's framework struggles here because it ties the *status* of the convention to the agents' current reasoning about viable alternatives. If agents reason "I must do this because there is no other way," Lewis would classify this as rule-following, not convention. EGT allows the label "norm" to persist regardless of the agents' internal representation of arbitrariness.

  #### 4. Conclusion: From Convention to Institution

  The practice of linguistic gender-marking, once a Lewisian convention, becomes a **non-conventional norm** once the original coordination problem vanishes and alternatives are no longer viable.

  *   **Lewis's Verdict:** It fails the strict definition because the **availability of alternatives** condition is violated. The regularity is no longer arbitrary in the practical sense required for convention; it is a "locked-in" equilibrium. It resembles a **constitutive rule** (like the rules of chess) rather than a convention (like driving on the right).
  *   **EGT's Verdict:** It is a stable norm sustained by path dependence. The "arbitrariness" is a historical property, not a current functional one.

  The tension reveals a limitation in Lewis's synchronic account: it cannot easily categorize norms that *were* arbitrary but *are now* necessary due to historical accumulation. EGT resolves this by decoupling the origin of the norm (which can be arbitrary) from its maintenance (which can be coercive). In the case of normative residue, the agents may regard the practice as arbitrary in principle, but the evolutionary dynamics ensure that, in practice, they treat it as a law of nature. Thus, it is a convention that has **lost its defining arbitrariness**, becoming a fossilized institution sustained by selection rather than mutual expectation.
