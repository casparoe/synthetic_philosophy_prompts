  **JOINT STATEMENT ON ALGORITHMIC GOVERNANCE AND LEGAL THEORY**

  **Signatories:**
  Representative of Legal Positivism (Hartian Tradition)
  Representative of Natural Law Jurisprudence (Fullerian Tradition)

  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Predictive Policing and Machine-Learning-Generated Norms

  ### I. Agreed Claims

  The undersigned, representing distinct traditions in legal philosophy, submit the following points of agreement. These claims establish a shared conceptual vocabulary for analyzing algorithmic governance. We acknowledge that while these points are settled between us for the purpose of this collaboration, they may remain contested in the broader scholarly community. We commit to not presenting contested interpretive claims regarding our respective traditions as consensus views.

  1.  **Structural Frameworks:** We agree that H.L.A. Hart's model of a legal system, comprising the union of primary rules (governing conduct) and secondary rules (governing the recognition, change, and adjudication of primary rules), provides a valid descriptive schema for analyzing how norms function. We further agree that Lon Fuller's eight principles of legality (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, and congruence between official action and declared rule) provide a valid normative framework for evaluating the form of law, understood here as procedural requirements without attributing to them any specific substantive moral content that is itself disputed.
  2.  **Empirical Characteristics of Algorithmic Systems:** We agree on the following empirical characteristics of current predictive-policing algorithms and machine-learning regulatory norms: (a) they often exhibit opacity regarding model weights and decision logic; (b) they frequently generate case-specific risk scores rather than general directives; (c) they lack traditional legislative promulgation; and (d) they depend on training data that may encode historical patterns of bias or enforcement.
  3.  **Validity and Merit:** We agree that the *concept* of legal validity (whether a norm belongs to the legal system) is analytically distinguishable from the *concept* of substantive moral merit (whether the norm is just or good). We acknowledge that we disagree on whether procedural morality affects validity, but we agree that substantive justice and legal validity are distinct categories of evaluation.
  4.  **Efficacy and Normativity:** We share the acknowledgment that a normative system can possess social efficacy—meaning it is recognized and applied by officials and generally obeyed by citizens—while simultaneously failing to meet the normative conditions of the rule of law. A system can be effective as a mechanism of social control without satisfying the requirements of legality.
  5.  **Scope of Disagreement:** We agree that the core dispute regarding algorithmic governance is not whether such systems can be oppressive or inefficient (both agree they can be), but whether systems that fail principles of intelligibility and promulgation can properly be classified as "law" and whether they can be integrated into a legal system's rule of recognition without altering the nature of that system.

  ### II. Residual Disagreements

  The following table outlines the specific points of divergence that remain after our collaboration. Each side accepts the wording below as an accurate description of its own view regarding algorithmic governance.

  | **Issue** | **Positivist Position (Hartian)** | **Natural Law Position (Fullerian)** |
  | :--- | :--- | :--- |
  | **Publicity and Intelligibility** | The principle of publicity is satisfied if the code, data, and model architecture are technically accessible to the public and legal professionals, even if the resulting logic is not cognitively intelligible to the average subject. Law is a technical artifact; accessibility of the source code constitutes sufficient notice. | The principle of publicity is violated if the norms are not humanly intelligible to those governed. Technical accessibility of code does not satisfy publicity if the subject cannot comprehend the rule guiding their conduct. Law must serve as a guide to action, which requires cognitive accessibility. |
  | **Social Source and Opacity** | Hart's social-source thesis permits a rule of recognition that incorporates opaque, machine-generated outputs as binding legal norms, provided that legal officials (judges, police, administrators) consistently treat them as authoritative. The moral quality or form of the output does not negate its legal validity if the social fact of acceptance exists. | A rule of recognition cannot incorporate opaque, machine-generated outputs as binding legal norms if those outputs fail the internal morality of law. Treating such outputs as authoritative does not make them law; rather, it demonstrates a failure of the system to maintain the conditions necessary for legal validity. Incorporating such norms smuggles in a moral failure that voids legal status. |

  ### III. Cruxes of the Dispute

  We identify two specific sub-questions (cruxes) where settling the matter would significantly move at least one party's position regarding the classification of algorithmic governance.

  **Crux (a): The Nature of Generality**
  Does the principle of generality require that legal rules be framed in terms that apply to classes of persons and actions in a way that is independently graspable by those subject to them, or can case-specific algorithmic outputs collectively constitute a general normative framework?

  **Crux (b): Internal Morality and Validity in ML Contexts**
  Is the internal morality of law (specifically publicity and intelligibility) a condition of legal validity itself, as Fuller maintains, or only a condition of efficacy and moral legitimacy that is conceptually separable from validity, as Hart maintains—specifically when the "law" in question is generated by statistical models rather than by intentional human promulgation?

  ### IV. Empirical Predictions and Test Cases

  For each crux, we specify a concrete case or institutional arrangement that would bear on the question. We record in advance our respective predictions regarding how these cases should be characterized.

  **Test Case for Crux (a): The Transparent Black Box**
  *Scenario:* A jurisdiction fully publishes the architecture, training data, and decision weights of its predictive-policing model. However, the system retains case-specific risk scores that are not reducible to any human-readable rule (e.g., no simple "if X then Y" statement can summarize the output).
  *   **Positivist Prediction:** This satisfies the requirements of generality and publicity. The rules exist and are knowable via the technical specification. The fact that the rule is complex and case-specific does not negate its generality, as it applies to all subjects within the dataset according to the same function.
  *   **Natural Law Prediction:** This fails the requirements of generality and publicity. Because the output is not reducible to a human-readable rule, the subject cannot use the law to plan their conduct. A system of case-specific scores, even if technically transparent, constitutes a series of particular commands rather than a general law, failing the test of legality.

  **Test Case for Crux (b): The Judicial Adoption of Opaque Scores**
  *Scenario:* A judiciary consistently applies an opaque risk-score threshold in bail and sentencing decisions, treating it as binding without legislative enactment. Officials regard the score as determinative.
  *   **Positivist Prediction:** This demonstrates the incorporation of algorithmic norms into the rule of recognition. Because officials consistently treat the scores as authoritative, they are valid law within that system. This confirms the separability of law and morality: the norms are legally valid despite lacking procedural morality (intelligibility/promulgation).
  *   **Natural Law Prediction:** This does not demonstrate valid legal incorporation. While officials treat the scores as binding, the failure of the norms to guide conduct (due to opacity and lack of promulgation) means they lack legal validity. This undermines the separability thesis in this context: the absence of procedural morality (internal legality) means the system has ceased to function as law, regardless of official acceptance.

  ### V. Conclusion: Verbal and Substantive Disputes

  In concluding this collaboration, we distinguish between disputes that appear to be verbal and those that remain substantive.

  **Verbal Disputes:**
  A portion of our disagreement dissolves when terms are specified with precision in the algorithmic context. Specifically, the definition of "rule" is a point of verbal contention. If "rule" is defined functionally as any consistent causal regularity utilized by officials to determine outcomes, the Positivist view prevails. If "rule" is defined normatively as a standard capable of being followed by a subject for the purpose of conduct planning, the Natural Law view prevails. Similarly, "publicity" is contested: if defined as *availability of information*, the Positivist view holds; if defined as *comprehensibility of instruction*, the Natural Law view holds. Clarifying these definitions reduces the scope of our conflict.

  **Substantive Disputes:**
  However, substantive disagreements remain regarding the conditions under which a normative system counts as law. Even with precise definitions, we disagree on whether the *purpose* of law is primarily social control and order (favoring the Positivist acceptance of effective algorithmic governance) or the facilitation of human agency through reciprocal governance (favoring the Natural Law rejection of unintelligible norms). This substantive divide determines whether a system of opaque algorithmic governance is classified as a defective legal system or as a non-legal system of managerial direction. We agree that this distinction carries significant practical consequences for judicial review, legislative oversight, and the legitimacy of enforcement in the age of machine learning.

  ***

  **Signed,**

  __________________________
  Representative of Legal Positivism

  __________________________
  Representative of Natural Law Jurisprudence
