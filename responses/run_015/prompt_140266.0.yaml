answer: |-
  This is a sophisticated observation that cuts to the heart of how we apply essentialist metaphysics to our everyday intuitions about persons. You have identified a tension that is recognized in specialized metaphysics but rarely given a single, canonical label in introductory literature.

  The short answer is: **No, there is no single, universally standardized name for this specific asymmetry**, though it is a composite of several well-known distinctions (epistemic vs. metaphysical modality, reference fixing vs. rigid designation, and the "switched at birth" objection to origin essentialism).

  However, the pattern you describe is robust enough to warrant a precise conceptual carving. Below, I will map your observation onto existing philosophical machinery, explain why the standard accounts feel unsatisfying (as you noted), and propose a term and definition that captures the specific asymmetry you are isolating.

  ### 1. The Existing Landscape

  To understand why this lacks a single name, we have to see how it is currently fragmented across three distinct discussions:

  **A. Epistemic vs. Metaphysical Modality (Kripke)**
  Kripke's standard response to your second case (the discovery) is that you are conflating *epistemic possibility* ("For all I knew, I could have had different parents") with *metaphysical possibility* ("It is possible in reality for me to have had different parents").
  *   **The Gap:** This explains the logic, but not the *intuition*. Even after accepting Kripke's distinction, people still feel that in the discovery case, *they* persist despite the origin change, whereas in the counterfactual case, *they* would not persist. Kripke explains why the statements have different truth values, but not why the *criteria for identity* seem to shift.

  **B. The "Switched at Birth" Objection**
  This is the closest existing named problem. It is a standard counterexample to Origin Essentialism (discussed by J.L. Mackie, Graff Forbes, and others). If Origin Essentialism is true, a person switched at birth is literally a *different person* than the one they took themselves to be.
  *   **The Gap:** Most people reject this conclusion. They say, "I am still me; I just have different biological parents." This suggests that in actual-world reidentification, we prioritize **psychological/bodily continuity** over **origin**. But in counterfactual reasoning (your first case), we prioritize **origin** over **psychological/bodily continuity**. The literature discusses this as an objection to Essentialism, but rarely as a distinct *asymmetry in reasoning*.

  **C. Reference Fixing vs. Rigid Designation**
  This is the technical mechanism behind the asymmetry. When we ask "Could I have...?", we treat the name "I" as a **rigid designator** picking out an entity defined by its actual origin. When we ask "Did I...?", we treat "I" as fixed by **descriptive criteria** (memory, body, social role) to locate the entity in the actual world.
  *   **The Gap:** You are noticing that we switch between these two modes of "anchoring" the self without noticing the switch.

  ### 2. Conceptual Carving: Evidence vs. Essence

  To carve this up tightly, we need to distinguish between the **criteria we use to identify a person** (Evidence) and the **criteria that constitute their identity** (Essence).

  *   **In the Counterfactual Case ("Could I have..."):** You are holding the *Essence* (Origin) fixed and asking if the *Evidence* (Life, Sex, Parents) can vary. Since Origin is essential, the answer is "No" to changing origins, but "Yes" to changing life details.
  *   **In the Discovery Case ("Did I have..."):** You are holding the *Evidence* (The person standing here with these memories) fixed and asking if the *Essence* (Origin) can turn out to be different. Here, intuition prioritizes the Evidence. We assume the person standing here is the primary reality, and the origin is a discoverable fact *about* them, not the thing that *makes* them.

  The asymmetry arises because we treat Origin as **Constitutive** in modal contexts but **Contingent/Descriptive** in epistemic contexts.

  ### 3. A Proposed Term: The Origin Anchoring Asymmetry

  Since no established term captures the *shift in intuition* specifically, I propose we label this **The Origin Anchoring Asymmetry**.

  **Definition:**
  > **The Origin Anchoring Asymmetry** is the cognitive tendency to treat causal origins as the **fixed anchor** for personal identity when evaluating *counterfactual scenarios* (metaphysical modality), while treating psychological/bodily continuity as the **fixed anchor** for personal identity when evaluating *actual-world discoveries* (epistemic modality).

  **Boundary Conditions:**
  To determine if a case falls under this asymmetry, apply the **Fixity Test**:
  1.  **Counterfactual Frame:** If the question asks "Could X have originated from Y?", is the intuition that X ceases to exist? (If Yes, Origin is the Anchor).
  2.  **Retrospective Frame:** If the question asks "Did X originate from Y?" (and the answer is unexpectedly Y*), is the intuition that X still exists? (If Yes, Psychology/Body is the Anchor).
  3.  **Asymmetry Confirmation:** If the answer is Yes to both, the Origin Anchoring Asymmetry is present.

  ### 4. Is the Asymmetry Real or Rhetorical?

  You asked what kind of finding would show the asymmetry is real rather than an artifact of phrasing. This is a question for **Experimental Philosophy (X-Phi)**.

  **The Artifact Hypothesis:** The asymmetry is merely pragmatic. In the counterfactual case, the grammar ("Could I have been born to...") presupposes the current self is evaluating a hypothetical. In the discovery case, the grammar ("I was switched") presupposes the current self is the subject of the narrative. The shift in intuition is just a shift in grammatical presupposition.

  **The Real Asymmetry Hypothesis:** The asymmetry reflects a deep conflict in our folk metaphysics between **Haecceitism** (identity is a "thisness" grounded in origin) and **Qualitative Continuity** (identity is grounded in properties).

  **How to Test It:**
  To prove it is real, you would need to control for phrasing and isolate the *direction of inquiry*.
  *   **Study Design:** Present participants with identical vignettes about a person "Alex."
      *   *Group A (Modal):* "If Alex had originated from Sperm B, would it still be Alex?"
      *   *Group B (Epistemic):* "Alex discovers he originated from Sperm B. Is it still Alex?"
  *   **Control:** Ensure the "magnitude of difference" is held constant (e.g., specify that Sperm B would have resulted in the same psychology/body).
  *   **Finding:** If Group A says "No" (Not Alex) and Group B says "Yes" (Still Alex) despite identical metaphysical facts, the **Origin Anchoring Asymmetry** is a genuine cognitive phenomenon, not just a linguistic artifact.

  ### 5. Why This Matters

  This asymmetry explains why Origin Essentialism feels compelling in the seminar room but irrelevant in the therapist's office.
  *   **In Metaphysics:** We care about *individuation across worlds*. We need a principle that distinguishes $x$ from $y$ in every possible world. Origin is the only candidate that doesn't rely on mutable qualities.
  *   **In Life:** We care about *reidentification across time*. We need a principle that tells us the person in front of us is the same as the person from yesterday. Psychology and body are the only accessible candidates.

  The asymmetry you noticed is the friction between **Identity as a Metaphysical Constraint** (what makes me *me* in the universe) and **Identity as an Epistemic Tool** (how I track *myself* through life).

  ### Summary
  *   **Name:** There is no canonical name. I propose **The Origin Anchoring Asymmetry**.
  *   **Carving:** It is the divergence between using Origin as the **Metaphysical Anchor** (in counterfactuals) vs. using Psychology/Body as the **Epistemic Anchor** (in discovery).
  *   **Existing Neighbors:** It sits between Kripke's *Epistemic/Metaphysical Distinction* and the *Switched at Birth Objection*, but specifically targets the *shift in intuition* rather than the logical consistency.
  *   **Validation:** It can be empirically tested by holding the metaphysical facts constant and varying only the direction of the query (Modal vs. Retrospective).

  You have effectively isolated a "bug" in how human cognition applies essentialist metaphysics to self-conception. It is a fertile area for analysis because it reveals that we are **Essentialists about others** (or our abstract selves) but **Continuity Theorists about our lived experience.**
