      *   Participatory? Yes.
      *   Paired roles? Yes.
      *   Divided knowledge/shared agency? Yes.
      *   Structured error/correction? Yes (built into the task difficulty).
      *   "Whose decision?" question? Included.
      *   Debrief connection? Included.
      *   Limitation admission? Included.
      *   Warning? Included.
      *   No advance explanation of the philosophy? Yes, keep the "why" hidden until debrief.

  10. **Polishing the Text:**
      *   Ensure tone is facilitative, not academic.
      *   Make sure the rules are strict enough to force the tension.
      *   Ensure the debrief leads them to the split-brain analogy without forcing it.
      *   *Self-Correction on Limitation:* The biggest limitation is that in split-brain cases, *both* sides can initiate action. In this sim, only the Actor initiates. I must highlight this.
      *   *Self-Correction on Warning:* The most likely failure is the Observer giving up or the Actor ignoring the touch. I need to emphasize the "physical resistance" rule.

  11. **Final Polish:** Check the flow. Intro -> Activity -> Immediate Reflection -> Philosophical Connection -> Limitations -> Wrap. (Wait, 90 mins is tight for all this. I need to be concise in the plan).
      *   Intro: 10 mins.
      *   Activity: 25 mins.
      *   Debrief: 45 mins.
      *   Buffer: 10 mins.
      *   Okay, that works.

      *Wait, one critical check:* "Confusion should emerge from the roles and constraints, not from any explanation given in advance."
      *   I must not tell them this is about split-brain until the debrief. I must frame it as a "Communication Challenge."

      *Let's refine the "Error" mechanism.* To ensure the error happens, I will give the Actor a "Logic Sheet" that suggests one solution, but the Observer has the "True Target" which contradicts the Logic Sheet. This guarantees conflict.
      *   *Actually, that's too complex to set up quickly.*
      *   *Simpler:* The Target is ambiguous. The Actor interprets it one way (based on what they can see of the blocks), the Observer sees the full picture. When the Actor moves, the Observer must physically intervene.
      *   *Best approach for "Structured Moment":* I will act as the "System." Halfway through, I will swap the Target Image for the Observer. The Actor doesn't know. The Observer now has to reverse the previous instruction. This forces a correction that looks like an error to the Actor.

