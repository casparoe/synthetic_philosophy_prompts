answer: |-
  **Joint Statement of Adversarial Collaboration: Institutions vs. Geography**

  **I. Agreed Premises**
  1.  **Unit:** The primary unit of analysis is the polity or region observed over centuries.
  2.  **Outcome:** The target explanation is the *level* of income per capita today, generated by differential *growth rates* over historical windows.
  3.  **Reversal:** The "Reversal of Fortune" (negative correlation between 1500 prosperity and modern income) is a robust stylized fact.
  4.  **Mechanism:** Any deep cause must operate through identifiable incentives or constraints facing households, firms, or officials on a human timescale.
  5.  **Institutions:** Defined as humanly devised rules (formal laws and informal norms) structuring exchange; distinct from, though influenced by, endowments.
  6.  **Geography:** Includes disease ecology, climate, topography, and transport costs; distinct from policy choices made within those constraints.
  7.  **Persistence:** Long-run persistence requires a mechanism of reproduction; mere inertia is not an explanation.
  8.  **Identification:** Exogenous shocks (colonial patterns, eradication campaigns, legal transplants) are necessary to identify causal direction.
  9.  **Convergence:** No region is permanently locked into poverty by immutable factors alone; policy changes can alter trajectories.
  10. **Measurement:** Historical data on income and institutional quality are imperfect; robustness across datasets is required.
  11. **Primacy:** The dispute concerns the *binding constraint* on development, not the existence of multiple factors.
  12. **Falsifiability:** All claims must admit contrary evidence; tautological definitions are excluded.

  **II. Disagreements and Tests**

  | Crux / Test | Institutions Claim | Geography Claim | Agreed Evidence | Predictions (Inst / Geo) | Falsification (Inst / Geo) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Levels vs. Growth** | Institutions determine long-run *growth rates* via incentives to invest/innovate. | Geography determines *income levels* (one-off shifts) via productivity/health taxes. | Long-run growth data across ecological zones. | **Inst:** Persistent growth diffs. **Geo:** Convergence to different levels. | **Inst:** No growth diff despite rule changes. **Geo:** Sustained growth diffs solely from ecology. |
  | **2. Mediation** | Geography acts *through* institutions (e.g., settlers brought rules). | Geography has *direct* effects (e.g., disease burden) independent of rules. | Regions with similar ecology, different rules. | **Inst:** Outcomes diverge with rules. **Geo:** Outcomes converge with ecology. | **Inst:** Rules change, outcomes stick to ecology. **Geo:** Rules change, outcomes shift fully. |
  | **3. Path Dependence** | Critical junctures create divergent institutional paths (equilibria). | Initial endowments constrain the *set* of feasible institutions directly. | Colonial settlement density vs. modern rules. | **Inst:** Settlement density predicts rules. **Geo:** Density predicts outcomes via disease. | **Inst:** Density uncorrelated with rules. **Geo:** Density uncorrelated with outcomes. |
  | **4. Verbal/Definition** | Institutions include adaptive informal norms (broad definition). | If institutions include all norms, the claim becomes unfalsifiable tautology. | Measurement of informal norms vs. formal laws. | **Inst:** Norms shift with incentives. **Geo:** Norms are sticky cultural priors. | **Inst:** Norms persist despite incentive shifts. **Geo:** Norms shift rapidly with incentives. |
  | **5. Test: Portable** | Migrant outcomes converge to host-country institutions quickly. | Migrant outcomes persist based on origin geography/culture. | Second-generation income by origin/destination. | **Inst:** High convergence. **Geo:** High persistence. | **Inst:** No convergence. **Geo:** Full convergence. |
  | **6. Test: Transplant** | Formal legal/administrative imposition causes rapid convergence. | Convergence slow/nil if terrain/disease ecology stays put. | Colonial legal codes vs. economic performance. | **Inst:** Fast growth under good rules. **Geo:** Stagnation despite good rules. | **Inst:** Good rules, no growth. **Geo:** Good rules, fast growth. |
  | **7. Test: Disease** | Eradication yields one-off level shift (health capital). | Eradication yields sustained growth rate change (binding constraint removed). | 20th-century malaria/hookworm campaigns. | **Inst:** Level shift only. **Geo:** Growth rate shift. | **Inst:** Growth rate shifts. **Geo:** Only level shifts. |
  | **8. Test: Archival** | New data will correlate with property rights measures. | New data will correlate with ecological zones. | Pre-registered analysis of digitized census/tax records. | **Inst:** Rights predict variance. **Geo:** Ecology predicts variance. | **Inst:** Ecology predicts better. **Geo:** Rights predict better. |

  *Discriminatory Power Verdict:* (5) High; (6) Medium (confounded by informal norms); (7) Low (hard to separate health capital from institutional response); (8) High (if pre-registration is strict).

  **III. Addendum: The Culture-First Objection**
  *I refuse to sign Claim 5.* Defining institutions as "formal laws and informal norms" absorbs culture by fiat. If "institutions" include deep-seated habits of cooperation and trust carried along family lines, the institutions claim becomes unfalsifiable: any persistence is attributed to "informal institutions," any change to "formal institutions." This is verbal sleight-of-hand. My refusal is substantive: culture is a prior condition that shapes which institutions are feasible, not merely an institution itself. If the institutions camp insists on this broad definition, they must explain why some societies adopt extractive norms and others cooperative ones without referencing culture. Until "institutions" are restricted to enforceable rules, I cannot accept the framework as scientific.

  **IV. Closing Note on Confidence**
  I am highly confident an institutions adherent would accept Claim 5 as written, though the culture theorist's objection is valid; I reconstructed the geography camp's "Levels vs. Growth" distinction (Row 1) from standard arguments, as some geographers argue for growth effects too. The claim I am least sure of is Row 7 (Disease Test); both camps have moved toward acknowledging health affects both levels and growth, making the prediction distinction potentially stale. However, the framing here forces a specific parameter commitment (level vs. rate) that should expose theoretical weaknesses.
