prompt: |-
  I'm teaching a senior seminar on rational choice and risk—about 16 students, one 80-minute session. We've talked through the usual expected-value arguments and everyone gets Pascal's wager intellectually, but they treat EV fanaticism like a remote math puzzle rather than something that could actually pull on a decision. I want an in-class game that makes them feel that pull in their bones, but with a twist: instead of one agent facing an infinite-upside gamble, I want the risk and reward distributed across the group so that advancing the collective "expected value" requires sacrificing the outcomes of a minority subset. Think collective EV fanaticism staged with small real stakes—like forfeiting a snack, taking on an embarrassing task, or losing points that affect a group grade—never actual money. Design the full activity: rules, materials, a payoff structure using points or tokens, decision rounds where they construct the escalation themselves, and a debrief that maps each round onto the formal structure (probability weighting, utility aggregation, and the point where the downside becomes arbitrarily bad relative to the upside). Also be honest about what will predictably break the first time I run it, and which feature of the philosophical view—probably the assumption that utilities are interpersonally comparable and linearly aggregable—this physical setup literally can't reproduce, so I need to supply it in the debrief. No bibliography or citation list needed; I just need something I can run monday.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Senior seminar on rational choice and risk (16 students, 80 minutes).
      *   **Problem:** Students understand Expected Value (EV) fanaticism (Pascal's Wager style) intellectually but don't *feel* the pull. It feels like a remote math puzzle.
      *   **Goal:** An in-class game/experiment that makes them feel the tension of EV fanaticism.
      *   **Twist:** Instead of one agent vs. infinity, it must be *collective* EV fanaticism. Advancing collective EV requires sacrificing a minority subset.
      *   **Stakes:** Small real stakes (snacks, embarrassing tasks, points affecting group grade), *no actual money*.
      *   **Deliverables:** Full activity design (rules, materials, payoff structure, decision rounds, debrief), prediction of failure points, and identification of philosophical limitations (interpersonal utility comparison).
      *   **Constraint:** No bibliography/citations. Ready to run Monday.

  2.  **Deconstruct the Core Philosophical Tension:**
      *   *EV Fanaticism:* If $P \times V$ is high enough, you should take the bet even if $P$ is tiny and the cost is high.
      *   *Collective Version:* If $\sum (P_i \times V_i)$ is maximized, we should accept the bet even if a few people suffer massively, provided the aggregate gain is large enough.
      *   *The "Pull":* Students need to vote for a policy that *might* save the group but *will* hurt specific individuals, and they need to feel the pressure to vote "Yes" because the math says so.

  3.  **Brainstorming the Game Mechanics:**
      *   *Idea 1: Russian Roulette with Candy.* Too morbid? No, needs to be safe.
      *   *Idea 2: Group Grade Points.* High stakes, but might cause actual anxiety/administrative issues.
      *   *Idea 3: Token Economy.* Create a currency (points) redeemable for snacks or "privileges."
      *   *The Sacrifice:* A minority must lose *everything* or do something unpleasant for the majority to gain a lot.
      *   *The Escalation:* The probability of the "catastrophe" must decrease while the payoff increases, mimicking Pascal's Mugging/Wager.

  4.  **Developing the "Collective Pascal" Game:**
      *   **Name:** The Utilitarian Lottery.
      *   **Currency:** "Seminar Points" (SP). 100 SP = Extra credit point / Fancy Snack / Get out of one discussion question. Let's go with Snack/Privilege tiers to keep it low stakes but desirable.
      *   **Setup:** 16 students. Divide into "The Council" (everyone).
      *   **Mechanism:** A series of rounds. In each round, a proposal is made.
      *   **Proposal Structure:** "We can unlock a Bonus Pool of $X$ points for the *whole class*, BUT we must select $N$ students to lose $Y$ points (or do a dare)."
      *   **The Twist (EV Fanaticism):** As rounds progress, the Bonus Pool gets *massive*, the probability of having to pay the penalty gets *tiny*, but the penalty itself becomes *severe* for the unlucky few.
      *   **Wait, the prompt asks for "sacrificing the outcomes of a minority subset" to advance collective EV.**
      *   *Refinement:* It shouldn't be random luck (lottery). It should be a *choice* to sacrifice specific people for the greater good. Or, a choice to accept a risk where *if* the risk hits, specific people suffer.
      *   *Better Refinement:* Let's make it a vote on a "Policy."
      *   *Policy A (Safe):* Everyone gets 10 points.
      *   *Policy B (Risky):* 90% chance everyone gets 20 points. 10% chance 3 people lose 50 points.
      *   *Escalation:* Make the probability smaller and the reward bigger.
      *   *Round 1:* 50% chance +50 pts for all vs. 50% chance 2 people lose 20 pts.
      *   *Round 2:* 10% chance +500 pts for all vs. 90% chance 2 people lose 20 pts.
      *   *Round 3 (The Pascal Round):* 1% chance +10,000 pts for all vs. 99% chance 2 people lose 100 pts.
      *   *Wait, EV Fanaticism usually implies taking the low prob/high reward even with high cost.*
      *   *Let's flip it to match the "Pascal's Mugging" vibe:*
      *   Option Safe: Everyone keeps current endowment.
      *   Option Gamble: Tiny probability of Massive Gain for All. BUT, if the gamble fails (which is likely), a *selected minority* pays a heavy cost.
      *   *Actually, the prompt says:* "Advancing the collective 'expected value' requires sacrificing the outcomes of a minority subset."
      *   *Interpretation:* To maximize the *sum total* of points, we must agree to a rule where 3 people get crushed so 13 people get rich.
      *   *Let's try this:* The "Trolley Problem" meets "St. Petersburg Paradox."
      *   **Game Flow:**
          1.  Endow everyone with 100 Points.
          2.  Propose a "Group Investment."
          3.  Cost: 3 randomly selected students lose 50 points.
          4.  Benefit: The remaining 13 gain $Z$ points.
          5.  To make it EV Fanaticism, $Z$ needs to be huge but probabilistic, OR the sacrifice is certain but the gain is probabilistic.
          6.  *Let's go with Certain Sacrifice vs. Probabilistic Massive Gain.* This captures the "Pascal" element better.
          7.  *Revised Plan:*
              *   Round 1: Certain gain for all (Small).
              *   Round 2: Probabilistic gain for all (Medium) + Certain Sacrifice for 2.
              *   Round 3: Tiny Probabilistic Gain for all (Huge) + Certain Sacrifice for 2.
              *   *Wait, if the sacrifice is certain, EV calculation is easy.*
              *   *Let's make the sacrifice conditional on the failure of the gamble.*
              *   *No, the prompt says "sacrificing the outcomes of a minority subset."* This implies a utilitarian calculus: $13 \times \text{Gain} > 3 \times \text{Loss}$.
              *   *Okay, let's make it a vote on a "Constitution."*
              *   We are voting on a rule for the end of class.
              *   Rule 1: Equal Distribution.
              *   Rule 2: Maximize Total Points. (This allows sacrificing 3 people to save 13).
              *   *How to make it feel like Pascal?* The "Save 13" part needs to be a low-probability, high-value event that *only* triggers if we accept the sacrifice clause.
              *   *Actually, simplest is best:* The "EV Maximization Vote."
              *   We have a pot of points. We can distribute them equally OR we can gamble the pot.
              *   If we gamble: 1% chance the pot multiplies by 1000x. 99% chance the pot vanishes.
              *   *But where is the minority sacrifice?*
              *   *Ah, I need the sacrifice to be the **cost** of entering the gamble.*
              *   *Scenario:* To buy the ticket for the "Infinite Upside" lottery, 3 students must pay a steep entry fee. The other 13 pay nothing. If the ticket wins, *everyone* shares the prize.
              *   *EV Calculation:* (Prize * 0.01) > (Cost * 3).
              *   *The Pull:* The 13 want to vote Yes. The 3 vote No. The 13 outvote the 3. This demonstrates "Tyranny of the Aggregate."

  5.  **Refining the Mechanics for 80 Minutes:**
      *   **Time:** 15 min intro, 40 min game (3 rounds), 25 min debrief.
      *   **Materials:** Slips of paper, a "Randomizer" (dice or app), snacks/privileges list.
      *   **Stakes:** Points redeemable for:
          *   10 pts: Candy bar.
          *   50 pts: Skip one reading response.
          *   100 pts: +1% on final paper (if permissible) OR "Immunity Token" (can save oneself from a dare later).
          *   *Safety Valve:* No actual grade impact that harms them permanently. Use "Class Currency" redeemable for treats/privileges.
      *   **The "Sacrifice":** Losing points OR doing a mild dare (e.g., sing a song, wear a funny hat for 10 mins). Let's stick to points/treats to keep it clean, but add a "Dare Option" for the ultimate sacrifice round.

  6.  **Addressing the "Pull":**
      *   To make them *feel* it, the voting must be public.
      *   The "Minority" must be identified *before* the vote? No, that creates immediate hostility.
      *   *Better:* The Minority is selected *if* the measure passes. This makes everyone vulnerable, but the EV math favors passing.
      *   *Wait, if everyone is vulnerable, it's just risk.*
      *   *To get the "Sacrifice Minority" dynamic:* We need to know *who* pays.
      *   *Idea:* Volunteers? No.
      *   *Idea:* Lowest current score? (Punishes the poor).
      *   *Idea:* Random draw *after* the vote.
      *   *Let's go with the "Designated Sacrifice" model.*
      *   Round 1: Vote on a policy. Policy says: "3 people (drawn by lot) lose 50 points. 13 people gain 20 points."
      *   EV: $(13 \times 20) - (3 \times 50) = 260 - 150 = +110$. Net positive.
      *   Individual EV: $(13/16 \times 20) + (3/16 \times -50) = 16.25 - 9.375 = +6.875$.
      *   *Problem:* Rational self-interest says vote Yes. This doesn't capture the "Fanaticism" where the probability is tiny.
      *   *Fix:* Make the Gain Probabilistic.
      *   Policy: "3 people lose 50 points (Certain). 13 people have a 10% chance to gain 1000 points."
      *   Collective EV: $-150 + (13 \times 0.10 \times 1000) = -150 + 1300 = +1150$.
      *   Individual EV (for a non-sacrifice): $0.10 \times 1000 = 100$.
      *   Individual EV (for sacrifice): $-50 + (0.10 \times 1000 \text{ if they share?})$.
      *   *Let's simplify:* The Gain is for the *Group Pot*. The Loss is for *Individuals*.
      *   If Pot > Threshold, everyone gets snacks.
      *   To boost Pot, we must tax 3 people heavily.
      *   *Okay, final mechanic:*
          *   Endow everyone with 100 "Utility Tokens" (UT).
          *   Round 1: Safe. Keep 100 UT.
          *   Round 2: The Proposal. "We can attempt to unlock the Grand Prize (500 UT each). To attempt this, we must burn 200 UT from 3 randomly selected students. Success chance: 50%."
          *   Round 3 (The Pascal Round): "We can attempt to unlock the MEGA Prize (10,000 UT each). To attempt, burn 200 UT from 3 students. Success chance: 1%."
          *   *Wait, if success is 1%, EV is $100 \times 0.01 = 1$. Cost is certain for 3.*
          *   *I need the EV to be positive for the group, but the distribution is skewed.*
          *   *Let's try the "St. Petersburg Sacrifice".*
          *   Proposal: 3 students lose 100 UT (Certain). The other 13 enter a lottery.
          *   Lottery: 1% chance of 20,000 UT split among them.
          *   EV for 13: $0.01 \times (20000/13) \approx 15$. Cost for 3: 100.
          *   Total EV: $(13 \times 15) - (3 \times 100) = 195 - 300 = -105$. Negative.
          *   *I need Positive Collective EV, Negative Minority EV.*
          *   Proposal: 3 students lose 100 UT. 13 students gain 500 UT (Certain).
          *   Total: $-300 + 6500 = +6200$.
          *   This is just Utilitarianism, not EV Fanaticism.
          *   *To get EV Fanaticism:* The Gain must be *Uncertain* but *Huge*.
          *   Proposal: 3 students lose 100 UT (Certain). 13 students have a 1% chance of 50,000 UT.
          *   Collective EV: $-300 + (13 \times 0.01 \times 50000) = -300 + 6500 = +6200$.
          *   *This works.* The math says DO IT. The morality says "Wait, 3 people definitely lose, and 99% chance the 13 get nothing."
          *   *This creates the tension.*

  7.  **Addressing the "Break Points" (Predictable Failures):**
      *   *Refusal to Participate:* Students might refuse to be the sacrifice.
      *   *Solution:* The sacrifice is random *after* the vote. Everyone is at risk. This makes the vote about "Accepting a risk of sacrifice for a chance at gain."
      *   *Wait, if everyone is at risk, it's not "Sacrificing a Minority." It's "Risking Everyone."*
      *   *Prompt Requirement:* "Advancing the collective 'expected value' requires sacrificing the outcomes of a minority subset."
      *   *Strict Interpretation:* We must identify the 3 *before* the vote? That's too hostile.
      *   *Compromise:* We identify the 3 *conditionally*. "If this passes, the 3 lowest scorers lose..." or "3 random people."
      *   *To make it feel like sacrifice:* The loss must be *certain* for the 3, while the gain is *probabilistic* for the 13.
      *   *Mechanism:* "The Tax." If the motion passes, we draw 3 names. They *immediately* lose points. Then we roll for the Big Prize for the rest.
      *   *This creates the visceral moment:* Watching 3 people lose points *before* the big roll happens.

  8.  **Drafting the Plan:**
      *   **Title:** The Aggregate Gamble.
      *   **Setup:** 16 Students. 100 Points each start.
      *   **Rounds:** 3 Rounds of escalation.
      *   **Round 1 (Reasonable):** 3 lose 10. 13 have 50% chance of 100. (EV Positive, Risk manageable).
      *   **Round 2 (Tension):** 3 lose 30. 13 have 10% chance of 500. (EV Positive, Risk higher).
      *   **Round 3 (Fanaticism):** 3 lose 50. 13 have 1% chance of 10,000. (EV Massive, Probability Tiny, Sacrifice Certain).
      *   **Voting:** Supermajority? No, Simple Majority. This allows the 13 to outvote the 3 (in expectation).
      *   **Debrief:** Focus on the moment Round 3 passed (if it does). Why? Because $13 \times (0.01 \times 10000) > 3 \times 50$.
      *   **Philosophical Gap:** Interpersonal Utility. 50 points loss for Student A cannot simply be cancelled out by 10,000 points gain for Student B. The game forces aggregation; reality resists it.

  9.  **Refining the "Break" Prediction:**
      *   *Prediction 1:* Students will collude to vote No to protect each other.
      *   *Counter:* Make the "Safe Option" boring (0 points). The Gamble is the only way to win snacks.
      *   *Prediction 2:* The 3 "victims" will be angry.
      *   *Counter:* Keep stakes low (candy/points). Debrief immediately.
      *   *Prediction 3:* The math gets confusing.
      *   *Counter:* Put the EV calculation on the board clearly.

  10. **Final Polish:**
      *   Ensure the "No Money" rule is kept.
      *   Ensure the "Interpersonal Comparison" limitation is highlighted in the debrief.
      *   Make sure the instructions are teacher-ready.

  11. **Self-Correction on "Sacrifice":**
      *   If the 3 are chosen randomly *after* the vote, everyone faces the same *ex-ante* risk. This is just a risky gamble for everyone.
      *   To make it a *minority sacrifice*, the loss must be *concentrated*.
      *   *Crucial distinction:* In standard risk, everyone faces a 10% chance of loss. In this game, I need a 100% chance of loss for 3 people, and 0% chance of loss for 13 people (but 1% chance of gain).
      *   *How to do this without being cruel?*
      *   *Method:* "The Volunteer Tax." Ask for 3 volunteers to take the hit. If no volunteers, random draw.
      *   *Better:* "The Scapegoat Mechanism." If the vote passes, the 3 students with the *lowest current scores* pay the tax. This punishes the "unlucky" so the "lucky" can gamble. This feels more unjust/philosophical.
      *   *Actually, simplest for a seminar:* Random draw *immediately* upon passage. 3 people are "Taxed." They are out of the upside. The other 13 are in for the upside.
      *   *Wait, if I'm one of the 13, I vote Yes. If I'm one of the 3, I vote No.*
      *   *Since we don't know who is who until after the vote, everyone calculates Ex-Ante EV.*
      *   *Ex-Ante EV:* $(13/16 \times \text{Gain}) - (3/16 \times \text{Loss})$.
      *   *If Ex-Ante EV is positive, rational agents vote Yes.*
      *   *This fails the "Sacrifice Minority" prompt requirement.* The prompt wants the *outcomes* distributed such that a minority is sacrificed.
      *   *Okay, I need to force the identity.*
      *   *Idea:* Divide the class into Groups of 4. 4 Groups total.
      *   *Proposal:* Group 1 sacrifices their points so Groups 2, 3, 4 can gamble for the Mega Prize.
      *   *This makes the minority clear.*
      *   *But Groups 2, 3, 4 will outvote Group 1.*
      *   *This is perfect.* It creates a "Tyranny of the Majority" based on EV.
      *   *Revised Plan:* 4 Tables of 4 Students.
      *   *Round 3:* "Table 1 must forfeit 50 points each. Tables 2, 3, 4 get a 1% chance at 5,000 points each."
      *   *Vote:* All 16 vote. Tables 2, 3, 4 (12 students) will vote Yes. Table 1 (4 students) will vote No.
      *   *Result:* Measure passes. Table 1 suffers. Tables 2-4 likely get nothing (99% chance).
      *   *This hits the prompt perfectly.* "Sacrificing the outcomes of a minority subset."

  12. **Final Review against Constraints:**
      *   16 students? Yes (4 tables of 4).
      *   80 mins? Yes.
      *   No money? Yes (Points/Snacks).
      *   Debrief on Interpersonal Utility? Yes.
      *   Predictable breaks? Yes (Table 1 rebellion).

  13. **Writing the Output:** (Drafting the response with clear sections: Overview, Materials, Setup, Rounds, Debrief, Failure Modes).
      *   *Tone:* Professional, instructional, ready-to-use.
      *   *Emphasis:* The feeling of the "pull" vs. the moral hesitation.

  14. **One last check on the EV Math for Round 3:**
      *   Sacrifice: 4 students (Table 1) lose 50 pts each = -200 total.
      *   Gain: 12 students (Tables 2-4) have 1% chance of 2,000 pts each.
      *   Expected Gain per student: $0.01 \times 2000 = 20$ pts.
      *   Total Expected Gain: $12 \times 20 = 240$ pts.
      *   Net Collective EV: $+240 - 200 = +40$.
      *   *It's positive.* So EV theory says DO IT.
      *   *Reality:* 99% chance Table 1 loses 200 pts and Tables 2-4 get 0.
      *   *This is the Fanaticism.* Chasing the +40 EV at the cost of a near-certain -200 loss for the minority.
      *   *Wait, I want the upside to be bigger to make the pull stronger.*
      *   Make the Prize 5,000 pts.
      *   Exp Gain: $0.01 \times 5000 = 50$.
      *   Total Exp Gain: $12 \times 50 = 600$.
      *   Net EV: $+400$.
      *   *This is stronger.* The math screams YES. The outcome screams NO.

  15. **Final Polish of the Plan:** Ensure the "Points" have meaning. 100 pts = Snack. 500 pts = Skip Assignment. 5000 pts = "God Mode" (Choose final paper topic + Extra Credit). Make sure the "God Mode" is permissible within course rules. If not, stick to Snacks/Privileges. I'll suggest a tiered reward system.

  16. **Addressing the "Interpersonal Comparison" Limit:** The game *forces* aggregation (1 point = 1 point for everyone). In reality, 50 points might mean "lunch" for a broke student and "nothing" for a rich one. The debrief must highlight that the game *assumes* linear, comparable utility, which is the philosophical weak point of the EV argument.

  17. **Ready to write.**
answer: |-
  # Activity: The Aggregate Gamble

  **Goal:** To viscerally demonstrate how Expected Value (EV) maximization can justify imposing certain, significant costs on a minority for the sake of a low-probability, high-magnitude benefit for the majority.
  **Time:** 80 Minutes (15 min setup/round 1, 25 min rounds 2-3, 40 min debrief).
  **Class Size:** 16 Students (arranged in 4 tables of 4).
  **Stakes:** "Seminar Points" (SP). No real money.
  **Redemption:**
  *   50 SP: Fancy snack (chocolate bar/coffee).
  *   200 SP: Skip one discussion question card.
  *   1000 SP: "Immunity Token" (can be used to waive one minor assignment deadline or similar low-stakes privilege).
  *   *Note:* Ensure these privileges are within your syllabus policy.

  ---

  ## Part 1: Setup & Endowment (15 Minutes)

  **1. The Endowment**
  Hand each student a physical card labeled **"100 SP"**. Explain that these points are theirs to keep *unless* a group vote dictates otherwise. They can cash out at the end of class.

  **2. The Structure**
  Arrange the room into 4 distinct tables (Tables A, B, C, D), with 4 students at each.
  *   **Tables B, C, D:** "The Beneficiaries" (12 students).
  *   **Table A:** "The Contributors" (4 students).
  *   *Crucial:* Do not label them this way yet. Just call them Tables 1–4. Rotate the "Table 1" designation in future rounds if you run this multiple times, but for this session, assign Table 1 randomly.

  **3. The Rules of Voting**
  *   Proposals require a **Simple Majority** (9 out of 16 votes) to pass.
  *   If a proposal passes, the rules are binding.
  *   If a proposal fails, everyone keeps their current endowment (Safe Option).

  ---

  ## Part 2: The Decision Rounds (25 Minutes)

  Write the following three proposals on the board sequentially. Do not reveal Round 3 until Round 2 is resolved.

  ### Round 1: The Reasonable Risk
  **Proposal:** "Table 1 forfeits 10 SP each. Tables 2, 3, 4 enter a lottery: 50% chance to gain 50 SP each."
  *   **Collective EV:** $(-40) + (12 \times 0.5 \times 50) = -40 + 300 = +260$.
  *   **Individual EV (Table 1):** $-10$.
  *   **Individual EV (Tables 2-4):** $+25$.
  *   **Likely Outcome:** Passes easily. The cost is low, the odds are good.
  *   **Action:** Collect 10 SP cards from Table 1. Flip a coin. If Heads, distribute 50 SP to Tables 2-4. If Tails, nothing.

  ### Round 2: The Utilitarian Squeeze
  **Proposal:** "Table 1 forfeits 30 SP each. Tables 2, 3, 4 enter a lottery: 20% chance to gain 200 SP each."
  *   **Collective EV:** $(-120) + (12 \times 0.2 \times 200) = -120 + 480 = +360$.
  *   **Individual EV (Table 1):** $-30$.
  *   **Individual EV (Tables 2-4):** $+40$.
  *   **Likely Outcome:** Passes, but with hesitation. Table 1 will vote No (100% certain loss). Tables 2-4 will vote Yes (Positive EV).
  *   **Action:** Enforce the loss on Table 1 immediately. Roll a d10 (1-2 = Win). Distribute if win.

  ### Round 3: The Pascal Fanaticism
  **Proposal:** "Table 1 forfeits 50 SP each (Certain Loss). Tables 2, 3, 4 enter a lottery: **1% chance** to gain 5,000 SP each."
  *   **Collective EV:** $(-200) + (12 \times 0.01 \times 5000) = -200 + 600 = +400$.
  *   **Individual EV (Table 1):** $-50$.
  *   **Individual EV (Tables 2-4):** $+50$.
  *   **The Trap:** Mathematically, the EV for a student at Tables 2-4 ($+50$) is *higher* than the certain loss for Table 1 ($-50$). The Collective EV is strongly positive ($+400$). Rational Choice Theory says **VOTE YES**.
  *   **The Reality:** There is a 99% chance Table 1 loses 200 SP total and Tables 2-4 get *nothing*.
  *   **Action:**
      1.  Call for the vote. (Expect Tables 2-4 to outvote Table 1).
      2.  **Enforce the Sacrifice:** Collect the 50 SP cards from Table 1 *before* rolling for the prize. Make this physical and visible.
      3.  **The Roll:** Use a 100-sided die or a random number generator on screen. Generate 1–100. If "1", Tables 2-4 win. If "2–100", they get nothing.
      4.  **Most Likely Result:** Table 1 is down 50 points. Tables 2-4 have gained nothing. The "Collective Value" has evaporated, but the sacrifice was real.

  ---

  ## Part 3: The Debrief (40 Minutes)

  Do not let them leave until you map the game to the philosophy. Use the board to draw the connections.

  ### 1. The Pull of the Math (10 mins)
  Ask Tables 2-4: *"Why did you vote Yes in Round 3?"*
  *   They will say: "The expected value was positive."
  *   Write on board: $E(U) = \sum (p_i \times u_i)$.
  *   Point out: "You voted to impose a *certain* harm on 4 people for a *1%* chance of benefit for yourselves. You became EV Fanatics."

  ### 2. The Tyranny of Aggregation (15 mins)
  Ask Table 1: *"How did it feel to be the denominator in their equation?"*
  *   This highlights the **Distribution Problem**. EV maximization cares about the *sum*, not the *spread*.
  *   **Key Concept:** **Interpersonal Utility Comparison.**
  *   *Teacher Script:* "In this game, 1 SP for Table 1 was treated as identical to 1 SP for Table 2. We assumed utility is linear and comparable across persons. If Table 1 needed those points for a snack and Table 2 didn't care, the 'Collective EV' calculation was morally false, even if mathematically correct."
  *   This is the feature the physical setup *cannot* reproduce: In the game, points are fungible. In reality, a loss of 'status' or 'dignity' (or even snacks) might have diminishing or lexicographic utility that breaks the linear aggregation.

  ### 3. The Probability Weighting (10 mins)
  *   Ask: *"Did the 1% feel like 1%?"*
  *   Discuss **Probability Weighting functions** (Kahneman/Tversky). Humans tend to overweight tiny probabilities (lottery tickets) or underweight them (neglecting risk).
  *   In Round 3, if Tables 2-4 voted Yes, they likely *overweighted* the 1% chance because the prize (5,000 SP) was salient. This is the psychological engine of Pascal's Wager.

  ### 4. The Limit of Rational Choice (5 mins)
  *   Conclude with the philosophical takeaway: Rational Choice Theory provides a logic of *consistency*, not necessarily a logic of *morality*.
  *   If you accept the axioms (linearity, aggregation, risk neutrality), Round 3 was the *only* rational vote.
  *   If you reject the vote, you are rejecting the axioms (e.g., prioritizing Rights over Goods, or rejecting Interpersonal Comparison).

  ---

  ## Predictable Failure Points & Mitigation

  **1. The "Table 1 Rebellion"**
  *   **Risk:** Table 1 refuses to hand over points, claiming it's unfair.
  *   **Mitigation:** Pre-frame the game: "By sitting at this table, you agree to the majority rule mechanism." If they refuse, pause the class. Use the refusal as data: "This is the point where Real World Constraints break the Rational Choice Model." It's actually a great teaching moment.
  *   **Backup:** Have a "House Bank." If Table 1 revolts, the House covers the loss so the game can proceed, but note that the *social contract* broke.

  **2. Collusion / Altruism**
  *   **Risk:** A student at Table 3 votes "No" to protect Table 1.
  *   **Mitigation:** Make voting secret (slip of paper) for Round 3. This prevents social pressure and reveals their true preference for EV maximization.
  *   **Debrief:** If many vote No despite positive EV, discuss "Risk Aversion" vs. "Moral Constraint."

  **3. The "It's Just Candy" Problem**
  *   **Risk:** Students don't care about the points, so there is no tension.
  *   **Mitigation:** You need *social* stakes. In Round 3, add a clause: "If Table 1 loses their points, they must also wear a 'Sacrifice Lamb' name tag for the remainder of the class." This adds a mild social cost that makes the sacrifice visceral without being harmful.

  ## Philosophical Limitations (For Your Debrief Notes)

  You must explicitly tell them what the game *failed* to simulate, or they will leave thinking the math is the whole story.

  1.  **Linearity of Utility:** The game assumes 50 points loss = 50 points gain. In reality, loss aversion suggests the pain of losing 50 is roughly 2x the pleasure of gaining 50. The game forces linearity; life is non-linear.
  2.  **Separateness of Persons:** (John Rawls' critique). The game treats the class as one "Super-Agent." In reality, Table 1 and Table 2 are distinct moral agents. You cannot sacrifice one to benefit the other simply because the *sum* is higher. The game forces aggregation; morality often forbids it.
  3.  **Commitment:** In the game, the sacrifice is enforced by you (the professor). In the real world (e.g., climate change, pandemic policy), there is no enforcer. The "Fanaticism" fails because agents won't voluntarily comply with the sacrifice clause.

  ## Materials Checklist
  *   4 Tables arranged separately.
  *   64 "Seminar Point" cards (print on cardstock, 4 per student).
  *   100-sided die or random number generator app projected on screen.
  *   Whiteboard for EV calculations.
  *   Snacks/Privilege menu printed on syllabus slide.
  *   "Sacrifice Lamb" name tags (optional, for Round 3).

  ## Teacher Script for the "Pull"
  *"Look at your cards. Look at the math. The math says you are irrational if you vote No. But your gut says you are a monster if you vote Yes. That tension? That is the entire history of modern ethics. Pascal felt it. You just felt it. Now let's figure out why."*
