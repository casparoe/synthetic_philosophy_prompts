answer: |-
  The Clinton administration's refusal to designate the 1994 Rwandan massacres as genocide was legally consistent with the restrictive 1948 Convention definition but incompatible with Raphael Lemkin's broader 1944 conceptualization, although the colonial construction of Hutu and Tutsi identities introduces contested ambiguity regarding the stability of the protected group. Under Lemkin's 1944 *Axis Rule in Occupied Europe*, genocide included both physical destruction and the disintegration of political and social institutions, whereas the 1948 Convention narrowed this to physical or biological destruction of national, ethnical, racial, or religious groups. The slaughter of approximately 800,000 people, primarily Tutsis, satisfies the settled historical record for physical destruction required by both frameworks. However, the administration's lexical avoidance relied on the 1948 Convention's stricter legal threshold to evade intervention obligations. The injected framing of Hutu and Tutsi as colonial administrative-racial categories rests on the settled historical fact of Belgian codification in 1933, but whether this renders them insufficiently "stable" to qualify as a protected group under Lemkin's intent is a contested interpretation among legal scholars. If these categories are viewed as political classes solidified by colonial rule rather than organic ethnic groups, they might arguably fall outside Lemkin's protected categories, providing a technical basis for the administration's hesitation that aligns with the injected framing but contradicts the ICTR's settled legal finding that Tutsis constituted a stable ethnic group.

  Lemkin's framework fails to explain the politics of naming because the 1948 Convention explicitly excluded political groups from protection, a deletion settled in the legal record due to Soviet and U.S. opposition during drafting, despite Lemkin's objections. Because the Rwandan conflict involved the Rwandan Patriotic Front (RPF) insurgency against the Habyarimana regime, the violence possessed a dual ethnic and political character; consequently, the U.S. legal calculus to avoid the term was structurally rational under the treaty's exclusion of political violence, rather than purely an act of cowardice. Furthermore, documented violence by the RPF against Hutu civilians introduces a problem of selective application that Lemkin's unitary perpetrator-group concept cannot easily accommodate. While the ICTR settled that the 1994 campaign against Tutsis was genocide, the scale and intent of RPF retaliatory killings remain a contested historical interpretation; if viewed as symmetrical ethnic cleansing, it challenges the legal specificity of "genocidal intent" required by the Convention. Thus, Lemkin's original vision, which prioritized the protection of group existence over state sovereignty, cannot account for a legal regime where state interests and the exclusion of political groups allow for lexical avoidance despite mass physical destruction.
