answer: |-
  This is a high-quality disagreement. Your friend is making a category error common in analytic philosophy: treating *anatta* as a rival *theory of personal identity* (like Locke or Parfit) rather than a *soteriological technology* aimed at *mamakāra* (mine-making). You are correct that the crux isn't just the absence of a soul, but the absence of a *recipient* for contact (*sparśa*).

  If you have three years to allocate research energy, do not spend it trying to prove whether a self exists metaphysically. That is a dead end. Instead, focus on the functional implications of denying ownership.

  Here is the ranked agenda for the *anatta*/personal identity space, ordered by upstream impact and tractability.

  ### 1. The Framing Question: Metaphysical Claim vs. Phenomenological Strategy
  **Rank:** #1 (Most Upstream)
  **The Question:** Is *anatta* an ontological denial (there is no self) or a pragmatic instruction (do not identify)?
  **Why it's #1:** This decides whether "Personal Identity" is even the correct container for the debate.
  *   **If Metaphysical:** *Anatta* competes with Hume, Kant, and Parfit. It becomes a claim about the furniture of the universe. Your friend wins here: it looks like bundle theory with extra steps.
  *   **If Phenomenological/Pragmatic:** *Anatta* is a claim about the *structure of experience* and the *utility of identification*. It bypasses the identity debate entirely. It argues that the *feeling* of ownership is a cognitive error, regardless of whether a self exists underneath.

  **Tractability:**
  *   **Philosophers:** High. This requires textual analysis (early Nikāyas vs. later Abhidharma) and conceptual mapping. It is solvable by clarifying the *purpose* of the doctrine.
  *   **Empiricists:** Medium. Cognitive science can measure the "sense of agency" and "sense of ownership" (e.g., rubber hand illusion, thought insertion in schizophrenia). They can show that "ownership" is a modular add-on, not a fundamental feature of consciousness.

  **Reasoning:** If *anatta* is primarily about stopping *mamakāra*, then the Western "Personal Identity" debate (which asks "What persists?") is asking the wrong question. The Buddhist question is "What binds?" Resolving this dissolves your friend's Hume comparison. Hume described the *bundle*; Buddhism describes the *glue* (craving/clinging) and offers a solvent.

  ### 2. The Ethics of No-Owner: Dissolution vs. Redistribution of Responsibility
  **Rank:** #2 (High Impact, Downstream of #1)
  **The Question:** If there is no recipient of *sparśa*, does moral responsibility vanish, or does it shift from "agent-based" to "process-based"?
  **Why it's #2:** Once you establish #1 (that this is about ownership, not ontology), you must answer the "So What?" for ethics. If I don't own my actions, why shouldn't I commit violence?
  *   **Dissolution View:** No self = no karma = no responsibility. (Nihilism).
  *   **Redistribution View:** Responsibility isn't held by a noun (the Self) but by the causal continuity of the process. Suffering still happens; the goal is to stop the propagation of suffering, not to punish an agent.

  **Tractability:**
  *   **Philosophers:** High. This is normative ethics. It parallels debates in compatibilism and Parfit's *Reasons and Persons*.
  *   **Empiricists:** Low. You cannot measure "moral responsibility" directly. You can measure pro-social behavior, but not the *grounds* for it.

  **Reasoning:** This is where policy and practice live. If *anatta* implies responsibility is distributed across causal conditions (upstream causes, environmental factors, neural states), it radically changes criminal justice and moral blame. It moves ethics from *retributive* (punish the self) to *consequentialist/preventative* (interrupt the causal chain of suffering). This is more tractable and impactful than arguing about rebirth.

  ### 3. Death and Continuity: Payoff or Sideshow?
  **Rank:** #3 (Lowest Priority for this Debate)
  **The Question:** Does *anatta* require rebirth/continuity to function, or is it strictly about the present moment?
  **Why it's #3:** This is the most emotionally charged but philosophically least relevant point for *personal identity*.
  *   **Traditional View:** Karma requires continuity across lives.
  *   **Secular/Phenomenological View:** *Anatta* works on the "moment-to-moment" death. The "self" dies every second.

  **Tractability:**
  *   **Philosophers:** Low. It leads to unfalsifiable metaphysics.
  *   **Empiricists:** Zero. Science cannot address rebirth.

  **Reasoning:** This is overrated in the context of your debate. Whether consciousness continues after biological death does not change the claim that *present awareness is not owned*. You can accept *anatta* as a description of current phenomenological reality without committing to rebirth. Focusing here distracts from the core mechanism (*sparśa* without a recipient).

  ---

  ### Overrated Implications (Where not to spend time)
  1.  **"Does the Self Exist?" (Ontological Nihilism):** Spending time trying to prove the self *doesn't exist* is a trap. It leads to infinite regress (who is denying the self?). The research should focus on the *cost of the assumption* of self, not the truth value of the self.
  2.  **Rebirth Mechanics:** As noted above, this is a soteriological payoff, not a premise for the phenomenology of *anatta*. Debating this stalls the identity conversation.
  3.  **Hume Comparison:** Stop trying to prove Hume wrong. Admit the structural similarity (bundle theory) but pivot to the *functional difference*. Hume stopped at description; Buddhism offers an intervention. That is the differentiator, not the metaphysics.

  ### What Would Change My Mind
  1.  **Textual Evidence:** If rigorous philological work on the earliest Pāli/Chinese Āgamas demonstrated that the Buddha explicitly framed *anatta* as an ontological truth-claim intended to refute Brahmanical *ātman* metaphysically (rather than therapeutically), Priority #1 would shift. We would have to treat it as a metaphysical rival to Hume.
  2.  **Neuroscience of Ownership:** If empirical research identified a singular, non-modular "neural correlate of self-ownership" that could not be deconstructed into sub-processes (agency, location, embodiment), the phenomenological deconstruction argument would weaken. (Current evidence suggests ownership is modular and fragmentable).
  3.  **Ethical Collapse:** If societies or groups that successfully adopted *anatta* views showed statistically significant increases in antisocial behavior (due to lack of agency), the "Redistribution" ethics model would fail, forcing a return to a "conventional self" for moral purposes (the Two Truths doctrine becomes a necessary fiction rather than a pedagogical tool).

  ### Weak Points in This Reasoning (Epistemic Flags)
  1.  **The "Experience" Gap:** I am analyzing *anatta* as a conceptual system. I do not have subjective experience. My assessment of the "phenomenological" claim is second-hand, derived from reports. It is possible that the *actual experience* of *anatta* reveals a metaphysical truth that conceptual analysis misses. I am privileging the philosophical framework over the soteriological claim.
  2.  **Western Bias:** This agenda frames *anatta* through the lens of Western analytic philosophy (metaphysics, ethics, tractability). This risks stripping the doctrine of its soteriological context (Nirvana). By making it "tractable," I may be reducing it to something it isn't meant to be.
  3.  **The "Process" Problem:** In Priority #2, I suggest responsibility shifts to "causal continuity." But without a self, what defines the boundaries of that process? Why is *this* causal stream responsible and not *that* one? This is the "Boundary Problem" in process philosophy, and I am underestimating how hard it is to solve without smuggling in a self.

  ### Summary Advice for the Researcher
  Tell your friend: **"Hume describes the prison; Buddhism provides the key."**
  The research agenda shouldn't be about whether the prison walls are real (Metaphysics). It should be about how the lock works (Phenomenology of *mamakāra*) and what happens when we walk out (Ethics of No-Owner).

  Spend year 1 on **Framing** (Ontology vs. Strategy).
  Spend year 2 on **Ethics** (Responsibility without an Agent).
  Ignore **Death/Rebirth** unless you are doing comparative religion; it's noise for identity theory.
