answer: |-
  You have identified a very specific, well-documented, and frustrating mechanism of institutional survival. While there is no single "universal" term that captures every nuance you described, there are three established concepts that map onto different parts of the cycle. Understanding them helps isolate exactly what makes your observation distinct.

  ### 1. The Existing Vocabulary (and why they fall short)

  **A. Organizational Decoupling (Meyer & Rowan, 1977)**
  *   **What it is:** Institutional theory describes how organizations separate their "formal structures" (policies, mission statements, task forces) from their "actual work practices."
  *   **Why it fits:** It explains the structural gap you noticed: the task force exists on paper (formal structure) but has no sway over the core system (work practices).
  *   **Why it's incomplete:** Decoupling describes a *state of being*, not an *active process*. It doesn't account for the *use of the critic*. In decoupling, the policy might just be ignored. In your scenario, the critic is actively *used* as fuel.

  **B. Recuperation (Situationist International / Political Theory)**
  *   **What it is:** The process by which radical ideas, images, or dissent are twisted, co-opted, absorbed, or defused by the dominant culture or system.
  *   **Why it fits:** This captures the "metabolizing" aspect. The dissent is not crushed; it is digested and repurposed to strengthen the system (e.g., a punk aesthetic sold by Nike).
  *   **Why it's incomplete:** Recuperation is usually cultural or ideological. It doesn't specifically describe the *bureaucratic machinery* (the task force, the report, the committee) that facilitates the absorption in large organizations.

  **C. Non-Performatives (Sara Ahmed, 2012)**
  *   **What it is:** A speech act that does not produce what it names. When an institution says "we are committed to diversity," the saying *is* the doing. The promise substitutes for the action.
  *   **Why it fits:** This explains why the task force's report is treated as "proof" of correction. The production of the document *is* the institutional goal, not the implementation of the recommendations.
  *   **Why it's incomplete:** Ahmed focuses heavily on the language and the document. Your observation includes the *human element*: the specific recruitment of the critic to lend credibility to the non-performative.

  ### 2. The Coinage: Procedural Immunization

  Because existing terms miss the specific *mechanism of using the critic to protect the core*, I propose the term **Procedural Immunization**.

  This term borrows from Roberto Esposito's concept of *immunization* (where a community introduces a small dose of a threat to protect itself from the full disease) and applies it to bureaucratic procedure.

  **Definition:**
  > **Procedural Immunization** is a defensive organizational strategy wherein dissent is acknowledged and assigned to a low-power procedural body (e.g., task force, committee, working group). The energy of the critique is converted into administrative activity (reports, meetings, guidelines) that generates legitimacy and resilience for the institution, without altering the core power structures that generated the flaw.

  **The Boundary Conditions (How to distinguish it):**
  To qualify as *Procedural Immunization*, the scenario must meet these three criteria. If any are missing, it is something else:

  1.  **The Decoupling Condition:** The body created to address the flaw must be structurally separated from the decision-making levers of the core system. (If they have veto power or budget authority, it is **Reform**, not Immunization).
  2.  **The Credibility Condition:** The body must include the critics or affected parties. Their presence is required to validate the process. (If the body is composed entirely of loyalists, it is **Shamming** or **Tokenism**, not Immunization).
  3.  **The Metabolic Condition:** The output of the body (report, recommendations) must be used by the institution to demonstrate responsiveness, effectively "spending" the critique to purchase legitimacy. (If the report is ignored and buried without reference, it is **Suppression**, not Immunization).

  ### 3. How it differs from Co-optation

  You asked specifically about the difference from **Co-optation** (Philip Selznick, 1949). This is the most common confusion.

  *   **Co-optation** brings the dissenter *inside* the leadership circle to neutralize them. The goal is to make the dissenter feel responsible for the system, thereby silencing their criticism.
      *   *Example:* Giving a student protester a seat on the Board of Trustees.
  *   **Procedural Immunization** keeps the dissenter *outside* the core but *inside* a process. The goal is not to silence the dissenter, but to **instrumentalize** them. Their continued criticism is actually useful, provided it is channeled into the task force.
      *   *Example:* Asking the student protester to chair a "Student Feedback Committee" that reports to the Board (which ignores the reports).

  In Co-optation, the critic is neutralized by **responsibility**.
  In Immunization, the critic is neutralized by **procedure**.

  ### 4. The Foucault Connection: Productive Power vs. Metabolic Power

  You mentioned Foucault's idea that power is productive. Foucault argues that power doesn't just say "no"; it produces reality, domains of objects, and rituals of truth.

  *   **Foucault's Counter-Conduct:** Foucault suggests that where there is power, there is resistance. He acknowledges that power can absorb resistance, but he generally views this as a shifting tactical landscape.
  *   **Procedural Immunization:** This is a more cynical, cybernetic refinement of Foucault. It suggests the system has developed a specific *organs* (task forces) designed to turn resistance into a resource.

  In this cycle, the "flaw" is not a bug; it is a **feature of the system's legitimacy**. The institution *needs* the flaw to exist so it can demonstrate its "commitment to fixing it." If the bias were actually eliminated, the task force would lose its purpose, and the institution would lose a key mechanism for demonstrating its own virtue.

  ### Summary
  The phenomenon is a synthesis of **Organizational Decoupling** (the structure) and **Recuperation** (the political dynamic).

  While you can accurately call this **Bureaucratic Recuperation**, the term **Procedural Immunization** better captures the specific boundary you identified: the conversion of dissent into institutional antibodies that protect the core from actual change.
