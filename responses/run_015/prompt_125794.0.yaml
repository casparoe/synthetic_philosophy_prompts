answer: |-
  **The menu**

  **1. Cost-Reallocation**
  The burden of a linguistic default falls asymmetrically on whoever is not the default, who must repeatedly work out whether an utterance includes them and must mark themselves when they want to be seen, so the point of reform is to move a small recurring cost. The mechanism is the distribution of communicative labor and cognitive load; it treats language as a technology where efficiency and fairness matter. Verdict: Substantive and defensible. This reading avoids metaphysical claims about thought and focuses on the tangible friction experienced by non-default speakers. It acknowledges that while beliefs may not change, the daily experience of participation does, which is a real change in the social world even if it is not a change in ideology.

  **2. Practice/Rehearsal**
  Uttering a form is repeatedly performing a way of carving up the world, and the mechanism is habit and attention rather than doxastic change, so a slogan about what words can change may simply be aimed at the wrong psychological variable. The mechanism is habituation and attentional conditioning; speech acts are rehearsals that strengthen neural pathways associated with specific social categorizations. Verdict: Substantive and defensible. This aligns with contemporary understanding of implicit bias, where repeated exposure to associations shapes automatic responses independent of stated belief. It suggests that changing the words changes the practice, and changing the practice eventually alters the disposition, bypassing the need for conscious conversion.

  **3. Availability (Satire)**
  Defamiliarisation does not argue you into a conclusion but alters which contrasts are representable for you, turning an invisible default into a visible option that can subsequently be accepted or refused. The mechanism is cognitive salience and representability; it makes the invisible visible by mapping it onto a visible analogue. Verdict: Substantive and defensible. This reading saves the satire from the charge of being merely rhetorical; its job is not to persuade but to reveal the existence of the constraint. Once the default is visible, it becomes a choice rather than a necessity, which is a prerequisite for any subsequent reform.

  **4. Diagnostic**
  The fact that the joke lands on you is evidence that the default was there, which is not at all the same as evidence that abolishing it would help. The mechanism is inference to the best explanation of intuitive reaction; the discomfort proves the presence of the norm. Verdict: Trivial. While true, this reading is limited because it establishes the diagnosis without implying a cure. It confirms the existence of the generic masculine but offers no account of why removing it matters, leaving the friend free to agree the problem exists while denying the solution works.

  **5. Expressive/Social-Meaning**
  What is changed is what speakers conventionally signal about the norms of their community, which is a change in the world only in the thin sense that conventions are part of the world. The mechanism is signaling theory and convention coordination; usage signals adherence to group norms. Verdict: Substantive. Though the friend may dismiss this as merely symbolic, conventions constitute social reality. Changing the signal changes the coordination point of the community, which alters the social landscape even if material conditions remain initially unchanged. It is a change in the rules of the game, which is a real change.

  **6. Strong Constitutive**
  A language's categories fix the categories available to thought, such that speaking a sexist language makes sexist thought inevitable. The mechanism is linguistic determinism; grammar constrains cognition. Verdict: False. This strong Whorfian claim is empirically unsupported and unnecessary for reform. Most reformers do not claim that generic *he* makes women unthinkable, but that it marks them as secondary. Accepting this reading would make the friend's dismissal correct, but since the reading is false, his dismissal rests on a strawman of the reformer's position.

  **What the slogan had to mean**

  For the slogan "you can't change the world by changing the words" to perform the double work your friend demanded—dismissal of reform and dismissal of the satire—it must express a claim of causal inertness. He is asserting that language is epiphenomenal to social reality. To dismiss reform, he must deny the Cost-Reallocation and Practice readings; to dismiss the satire, he must deny the Availability and Diagnostic readings. The only reading that supports both dismissals is the negation of the Strong Constitutive thesis: he assumes you believe words *constitute* the world, and since they do not, changing them does nothing. This is plausibly what people mean when they say it, but it is a category error. If he retreats to the weaker readings—admitting words change costs, habits, or signals—his slogan becomes false. If he admits the Diagnostic reading, he must admit the satire works. Therefore, his position survives only if he insists on the false Strong Constitutive reading as the only alternative to his own quietism.

  **Pump, proof, or intervention**

  The satirical method is best understood as an intuition pump that functions as a diagnostic intervention. It does not argue; it triggers recognition. The "borrowed force" worry—that the satire works only because we already agree racism is bad—misidentifies the source of the force. The force comes from the structural isomorphism, not the moral valence. The satire transfers the *feeling* of absurdity from a rejected case (racial pronouns) to an accepted case (gender pronouns). It proves the default exists (Diagnostic) and makes alternatives visible (Availability). The orthogonal mapping worry suggests that because the moral axis is fixed, the linguistic axis transfers nothing. But the transfer is not of moral value; it is of structural awareness. The satire changes its audience by breaking the invisibility of the default. It does not prove reform will succeed, but it proves the status quo is not a necessity. If the default is visible, it is contestable. The satire converts a background condition into a foreground object, which is a necessary condition for any political change.

  **The strongest version of my side**

  You should lead with the Cost-Reallocation reading combined with the Expressive reading. This avoids the trap of linguistic determinism while asserting a material change in social interaction. It frames reform not as mind-control but as ergonomic fairness and norm signaling. The most damaging objection is that token linguistic changes mask substantive inequality, allowing institutions to signal virtue without altering power structures. This is a serious charge that linguistic reform is merely decorative. To settle the matter, you need evidence not of changed beliefs, but of changed experiences. Empirical data on the cognitive load of non-default speakers, or reports of exclusion correlated with specific usages, would validate the Cost-Reallocation thesis. If the friction is real, removing it is a real change, regardless of whether it solves every social problem.
