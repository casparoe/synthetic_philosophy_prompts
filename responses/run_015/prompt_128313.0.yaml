  **Q&A PREP SHEET: CENTIPEDE & DIACHRONIC IDENTITY**
  **Context:** Colloquium, Thursday.
  **Audience:** Action Theory (dominant), Behavioral Econ (2), Advisor (Common Knowledge).
  **Status:** Train wifi spotty. No citations. Standard lit only.

  Here are the eight objections you will face, ordered by potential damage to the thesis (and your credibility).

  ### 1. The Common Knowledge Collapse (Advisor)
  **The Objection:** "If the agent at node 1 isn't identical to the agent at node 20, you've destroyed the epistemic conditions for the game. Backward induction requires Common Knowledge of Rationality (CKR). If the 'self' fragments, does Node 1 know Node 20's utility function? If not, this isn't a Centipede game anymore; it's a game of incomplete information. You haven't solved the paradox; you've just changed the game structure."
  **The 2-Minute Reply:** "That's the crucial twist. I'm not arguing Node 1 lacks *information* about Node 20. I'm arguing Node 1 cannot treat Node 20's rationality as *binding* on itself. CKR assumes that 'rationality' is a stable function across the tree. I'm claiming rationality is indexed to the temporal slice. The logic of induction fails not because I don't know what you'll do, but because what's rational for 'future me' isn't necessarily authoritative for 'present me.' The game tree remains perfect information; the *authority* of the backward recursion is what breaks."
  **Where You're Soft:** You are blurring epistemic access with metaphysical identity. If they press on whether Node 1 can *predict* Node 20 without assuming identity, you might stumble. You need to hold the line that prediction is possible, but *normative bindingness* is not.

  ### 2. The Biographical Projection (The One You Pray Nobody Asks)
  **The Objection:** "Let's be honest. You mentioned the farm negotiation. Aren't you just projecting your parents' divorce onto decision theory? Is this metaphysics, or is it trauma looking for a formal model?"
  **The 2-Minute Reply:** "I appreciate the candor. Biographical context often sparks philosophical insight—Frege didn't develop logic in a vacuum. The farm negotiation was the *phenomenon* that demanded explanation, not the explanation itself. Whether my parents are divorced or cooperating is irrelevant to the structural claim: that long-duration negotiations reveal diachronic fragmentation inherent in any extended agency. The math stands regardless of the biography that inspired it."
  **Where You're Soft:** This is credibility damage control. If you sound defensive, you lose the room. You have to acknowledge the spark without letting it become the fuel. Don't deny the emotion; subordinate it to the logic.

  ### 3. Diachronic Agency (Philosophers of Action)
  **The Objection:** "Standard planning theory defines agency as temporally extended. To be an agent *is* to treat your future selves as yourself. If you deny this, you aren't fixing Rational Choice Theory; you're denying the possibility of agency itself. You're left with a series of momentary impulses, not a game."
  **The 2-Minute Reply:** "I'm not denying we *act* as if we are extended. I'm denying that we *are* numerically identical over time in the way RCT requires for backward induction. We plan, yes, but planning is a negotiation between successive selves, not a command from a stable sovereign. The Centipede game exposes the limit of that planning. When the stakes stretch over decades, the 'we' becomes a 'they.' That's not the absence of agency; it's the complex reality of it."
  **Where You're Soft:** You need a threshold for when identity fragments. Is it time? Stakes? If you can't define when the self splits, this looks like special pleading for the Centipede case.

  ### 4. Preference Stability vs. Identity (Standard RCT)
  **The Objection:** "Economists already model changing preferences over time. You don't need new metaphysics for that. You're just renaming 'changing utility functions' as 'non-identity.' What work is the identity claim actually doing?"
  **The 2-Minute Reply:** "Changing preferences assumes a stable container holding those preferences. If I change my mind about ice cream, I'm still me. But in the Centipede game, the change is so profound—driven by time, context, and pressure—that the *continuity of interest* required for induction breaks. Standard RCT treats preference shifts as noise or discounting. I'm treating them as structural fractures. It changes the solution concept from 'optimization' to 'inter-temporal bargaining.'"
  **Where You're Soft:** Mathematically, the models might look identical. You have to argue that the *interpretation* changes the normative implications, not just the output.

  ### 5. Falsifiability (Behavioral Economists)
  **The Objection:** "We run these experiments. How do I measure 'agent identity' in the lab? If you can't operationalize this, it's just poetry. How is this different from a 'trembling hand' or altruism?"
  **The 2-Minute Reply:** "Look for discontinuities. Altruism and trembling hand predict smooth decay in cooperation over time. My model predicts sharp drops at points where the 'self' context shifts—e.g., introducing delays, changing negotiators, or external stressors that disrupt continuity. Don't measure identity directly; measure the breakdown of recursive reasoning when temporal distance is manipulated."
  **Where You're Soft:** This is hard to test cleanly. If their data shows smooth curves, your theory is in trouble. Admit this is a preliminary model needing operationalization.

  ### 6. The Normative Force
  **The Objection:** "Even if descriptive backward induction fails, isn't it still *normatively* rational? Shouldn't we advise players to act as if they are identical? You've solved the descriptive problem by killing the normative force."
  **The 2-Minute Reply:** "Normativity requires a subject to whom the norm applies. If there is no stable subject across the game tree, there is no one for whom backward induction is the 'right' strategy. It's like telling a committee to act like a dictator. The normative force dissolves because the unit of agency is misidentified. The rational move is to recognize the fragmentation and bargain accordingly."
  **Where You're Soft:** Philosophers love normativity. Conceding this feels like giving up on rationality entirely. Be careful not to sound like you're endorsing irrationality.

  ### 7. The Stop Condition (Internal Consistency)
  **The Objection:** "If agents are different at every node, why doesn't the game end at node 1? If I don't care about future me, I should defect immediately. Your model explains why BI fails, but not why anyone cooperates at all."
  **The 2-Minute Reply:** "Because successive agents aren't strangers; they're *overlapping*. They share partial interests—reputation, legacy, family name (or in the lab, experimental norms). Cooperation happens not because of identity, but because of *alignment*. The Centipede game isn't about total identity or total strangers; it's about partial alignment. That's why cooperation decays but doesn't vanish instantly."
  **Where You're Soft:** You need to explain why alignment holds for 19 rounds and breaks at 20. Without a model of "partial identity," this looks vague.

  ### 8. Occam's Razor (Triviality)
  **The Objection:** "RCT assumes a stable self because it's a useful simplification. You're adding metaphysical baggage without gaining predictive power. Isn't this just complicating the model for no reason?"
  **The 2-Minute Reply:** "It's only baggage if the simplification works. In decades-long negotiations—or Centipede games where players defect early—the stable self assumption fails systematically. Adding this metaphysical cost buys us explanatory power where standard logic consistently crashes. It's not complicating the model; it's fixing the foundation so the model doesn't collapse under real-world weight."
  **Where You're Soft:** If the behavioral economists say "standard models predict well enough," you lose. You need to emphasize the *systematic* failure of RCT in long-horizon games.

  ***

  **General Advice for the Room:**
  *   **For the Advisor:** Do not get dragged into formal epistemic logic weeds. Keep it on the *authority* of the future self, not the *knowledge* of the future self.
  *   **For the Economists:** Don't promise data you don't have. Promise a new framework for interpreting existing anomalies.
  *   **For the Action Theorists:** Use their language ("planning," "agency") but twist the conclusion.
  *   **For the "Divorce" Question:** Take a breath. Smile. Answer calmly. If you get angry, they win.

  **Note on the Typo:** You mentioned a typo in the prompt ("actualy", "thier", etc.). I've ignored it in the output as per your instruction to focus on the task, but keep an eye on your slides—typos in a philosophy colloquium give the audience something to fixate on instead of your argument. Good luck on Thursday.
