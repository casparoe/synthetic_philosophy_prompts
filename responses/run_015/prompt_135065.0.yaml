answer: |-
  My dear colleague,

  I have been reflecting deeply on our recent correspondence regarding the structure of value and the logical properties of the better than relation, particularly in light of the troubling arguments that suggest this relation might not be transitive. You asked me to weigh the familiar linear spectrum argument against a more provocative cyclic formulation, and to consider whether the latter succeeds where the former falters in establishing genuine intransitivity. It is a fascinating puzzle, one that strikes at the heart of rational choice theory and our understanding of normative comparisons. To begin with, we must recall the architecture of the standard linear spectrum argument, which typically proceeds by constructing a sequence of options where each member is marginally better than its predecessor, yet the final member is intuitively worse than the first. In cases like Parfit's Repugnant Conclusion, we are asked to accept that a world with a vast population of lives barely worth living is better than a world with a smaller population of exquisite lives, based on a chain of pairwise trade-offs where a slight loss in quality is compensated by a gain in quantity. The threat to transitivity arises if one insists that the first option is clearly better than the last while simultaneously accepting every step in the chain, thereby forcing a rejection of the transitive principle that if A is better than B and B is better than C, then A must be better than C. However, this linear formulation is often met with the objection that it masks a shift in multidimensionality. Critics argue that we are not comparing like with like at each step, but rather trading off distinct values, such that the relation better than is not a single uniform ordering but a context-sensitive aggregation of different dimensions. Furthermore, the linear argument leans heavily on vagueness-driven tolerance principles, akin to the Sorites paradox, where the inability to distinguish adjacent steps does not necessarily imply identity or equivalence in a way that compounds over long distances.

  Now consider the cyclic formulation, which you rightly identify as a more radical challenge. In this scenario, we construct a chain of options where A is better than B, B is better than C, and so on, until we reach an option Z that is judged better than A, closing the loop. This formulation appears to escape the specific weakness of the linear spectrum because it does not rely on a counterintuitive endpoint judgment to clash with the chain; rather, the chain itself generates the contradiction. If the better than relation is transitive and asymmetric, a cycle implies that A is better than A, which violates the irreflexivity inherent in strict preference. To avoid this absurdity, one must deny transitivity. At first glance, this seems to bypass the objection regarding hidden multidimensionality. In a linear spectrum, one can argue that we drift from one type of value to another, but in a cycle, we return to the starting point. If A is identical to the final option in the chain, then no net change in multidimensional properties has occurred, yet a preference cycle exists. However, upon closer inspection, the multidimensionality objection retains its force. For a cycle to exist among distinct options, there must be some property that changes at each step to justify the preference, yet these changes must cancel out perfectly upon returning to the start. If the options are truly distinct, then the final option is not identical to A, but merely similar, and the cycle is actually a spiral or a loose loop where the final judgment relies on a contextual shift rather than a strict identity. If the options are identical, then we are asserting that A is better than A, which is not a failure of transitivity but a failure of asymmetry or irreflexivity, or simply a mistake in judgment. Thus, the cyclic version does not fully escape the charge that it relies on hidden variables or contextual factors that alter the meaning of better than at each link in the chain.

  Furthermore, we must examine whether the cyclic formulation offers a stronger defense against the vagueness objection. In the linear spectrum, the plausibility of each step relies on the tolerance principle, where a negligible difference cannot affect the verdict. The cyclic argument exploits this same tolerance, suggesting that small, imperceptible improvements can accumulate to form a circle. However, if vagueness is the root cause, then the non-transitivity is merely semantic rather than ontological. It suggests that our language or concepts are not sharp enough to sustain transitivity over long chains of marginal differences, not that value itself is non-transitive. The cyclic version sharpens this by showing that vagueness can lead to logical contradiction, but it does not prove that a precise underlying value structure is non-transitive. Indeed, one might argue that if we could precisify the values, the cycle would disappear, revealing an underlying transitive order that our vague judgments obscure. The cyclic argument therefore succeeds in demonstrating the instability of our intuitive judgments under conditions of vagueness, but it fails to prove that the relation better than is genuinely non-transitive in a precise, metaphysical sense. It shows that our access to value is noisy, not that value is circular.

  There is also the pragmatic objection known as the money pump argument, which applies with greater force to the cyclic formulation than to the linear one. If an agent truly holds cyclic preferences, preferring A to B, B to C, and C to A, they can be exploited by a series of trades that leave them worse off than when they started, paying a fee to switch from A to B, then B to C, then C to A, ending up with A but less wealth. This pragmatic inconsistency suggests that rational agents cannot maintain cyclic preferences. Proponents of genuine non-transitivity might argue that rationality does not require acyclicity, or that the agent might refuse to trade based on the history of transactions, but this introduces dynamic inconsistency or menu dependence, which again points to hidden multidimensionality rather than a failure of transitivity in the static relation. The linear spectrum does not invite exploitation in the same way, as it does not loop back, but the cyclic version's vulnerability to money pumps undermines its claim to represent a rational structure of value. If the cyclic ordering leads to self-defeating behavior, it is more plausible to view it as a defect in the agent's judgment process rather than a feature of the normative landscape.

  Ultimately, while the cyclic formulation is rhetorically more dramatic and logically tighter in forcing a contradiction between transitivity and irreflexivity, it does not succeed in showing that the better than relation is genuinely non-transitive rather than merely embedded in a circular ordering that masks an underlying transitive structure. Both the linear and cyclic arguments rely on the accumulation of negligible differences, and both are susceptible to the explanation that our comparative concepts are vague or that we are failing to account for all relevant dimensions of value. The cycle adds the pressure of potential exploitation, which makes accepting genuine non-transitivity even costlier than in the linear case. It seems most reasonable to conclude that these arguments reveal the limits of our epistemic access to value and the precision of our normative concepts, rather than demonstrating that value itself violates the transitive law. The circularity is likely a artifact of the sorites-like instability in our judgments when faced with marginal trade-offs, suggesting that while our expressed preferences may cycle, the underlying better than relation remains transitive, waiting to be uncovered by a more precise description of the options involved. I hope this analysis helps clarify the stakes in our ongoing debate, and I look forward to hearing your thoughts on whether the pragmatic costs of cyclic preferences are sufficient to dismiss the metaphysical possibility of non-transitive value.

  Yours sincerely,

  A Friend
