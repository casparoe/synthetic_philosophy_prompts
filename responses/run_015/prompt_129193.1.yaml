answer: |-
  **Project Title:** Parameterizing the Divergence: A Logical Audit of Contrastive Explanation in Global History

  **Project Summary**
  This six-month project proposes a conceptual resolution to the stalemate surrounding the "Great Divergence" and the "Needham Question." Current historiographical debate regarding why modern science and industrialization arose in Britain rather than China is characterized by intractable disagreement. I argue this disagreement is not primarily empirical but logical: the central contrastive questions are under-specified. Specifically, they lack fixed values for two hidden parameters: the *scale of aggregation* (civilization vs. region) and the *bundling of explananda* (mechanization vs. growth vs. mathematization). Furthermore, the contrast class is often a "residue" (everything that did not industrialize) rather than a relevant alternative, reducing the question to a singular "Why Britain?" inquiry. This project will develop a formal diagnostic framework to parameterize these questions, separating genuine contrastive explanations from pseudo-questions. The deliverable will be a methodological toolkit for historians to audit and reformulate causal questions before seeking empirical answers.

  **Intellectual Merit and Problem Statement**
  The debate over the Great Divergence suffers from a mismatch between the precision of the causal claims offered and the vagueness of the questions asked. Existing positions in the philosophy of explanation generally assume the *explanandum* is well-formed. Standard interventionist accounts focus on identifying difference-makers within a fixed causal model, while traditional contrastive accounts focus on the selection of the foil. However, both approaches fail when the question itself shifts its semantic content based on implicit contextual parameters.

  First, the *Scale Parameter*. Explanatory factors are not scale-invariant. A factor that explains divergence at the civilizational level (e.g., broad cultural or institutional differences between Europe and Asia) may vanish or change significance when the comparison is rerun at the level of comparable river deltas (e.g., Lancashire vs. the Yangtze). If the ordering of candidate causes is not invariant under changes in the level of aggregation, the unparameterized question generates pseudo-disagreement where historians are effectively answering different questions.

  Second, the *Bundling Parameter*. The "outcome" of the Great Divergence is treated as a monolith, but it is a conjunctive package: mechanization of production, sustained per-capita growth, and the mathematization of nature. These conjuncts may have partly independent explanations. Demanding a single contrastive factor for a conjunctive explanandum may be a category error, asking for a cause that does not exist because the "divergence" is not a single event but a cluster of distinct trajectories.

  Third, the *Residue Class Worry*. In contrastive explanation, the foil must be a relevant alternative. Currently, the contrast term ("China" or "The East") is often selected simply because it lacked the outcome. This makes the contrast class a residue of failure rather than a class of comparable possibilities. If the contrast class includes all non-industrializing societies regardless of their proximity to industrialization, the question carries no more information than the singular "Why Britain?" A genuine contrastive question requires a condition of *counterfactual proximity*: the foil must have been a live candidate for the outcome within the same causal field.

  **Methodology and Work Plan**
  This project is purely conceptual and requires no archival research, quantitative analysis, or language training. The work involves logical analysis, model construction, and testing against secondary historiography.

  *   **Months 1-2: Formalizing the Parameters.** I will define the logical syntax for the Scale and Bundling parameters. This involves mapping existing historiographical arguments onto a matrix of scales (continental, regional, local) and outcomes (technological, economic, epistemic). The goal is to demonstrate that competing causal claims (e.g., coal vs. institutions) are often functions of these hidden parameters. I will draft a set of transformation rules showing how an explanation valid at one scale translates or fails to translate to another.
  *   **Months 3-4: The Residue Condition and Case Testing.** I will formulate the "Counterfactual Proximity Condition" to distinguish genuine contrastive questions from singular questions in disguise. This condition will specify the necessary shared causal preconditions for a valid foil. I will test this condition against canonical treatments of the Great Divergence and the Needham Question. Cases where the foil fails the condition will be flagged as logically defective, requiring reformulation (e.g., changing the foil from "China" to "specific Chinese regions with high market integration").
  *   **Months 5-6: Toolkit Development and Refinement.** The final phase focuses on translating the logical framework into a usable heuristic for historians. I will draft the "Question Audit Protocol," a step-by-step guide for researchers to check their explanatory questions for scale ambiguity, bundling errors, and residue foils. The final manuscript will integrate the formal analysis with the practical protocol.

  **Alternative Approaches**
  Two obvious alternatives are rejected. First, applying a standard interventionist or contrastive account of explanation "off the shelf" is insufficient because these models presume the question is already well-posed. They offer tools for finding answers, not for diagnosing defective questions. Using them without modification would perpetuate the current stalemate by validating ill-formed queries. Second, abandoning the question on the grounds that it is ideologically loaded or Eurocentric is defeatist. While the question has been used to serve ideological ends, its logical structure is independent of its usage. Repairing the logic allows the question to be asked without presupposing the superiority of one path, whereas abandonment cedes the explanatory ground entirely. This project offers a third way: repairing the question rather than answering it prematurely or discarding it.

  **Deliverables**
  The primary deliverable is a monograph-length manuscript (approx. 40,000 words) suitable for publication in a press specializing in philosophy of history or historiography. Additionally, I will produce a standalone "Question Audit Protocol." This document will be designed for use by empirical historians, providing a checklist to ensure their comparative questions are scale-explicit, outcome-disaggregated, and logically contrastive. This ensures the project contributes not only to philosophical theory but to the practice of historical research.

  **Risk Assessment and Failure Conditions**
  The primary risk is that the proposed apparatus becomes a technical redescription of the trivial claim that "history is complicated." A successful framework must have bite; it must rule some questions out or force specific reformulations.

  **Failure Mode 1: Over-Permissiveness.** The project fails if the diagnostic criteria certify every contrastive question as well-posed. If the "Counterfactual Proximity Condition" is defined so loosely that any non-industrializing society counts as a valid foil for Britain, the framework adds no value over existing methods. To avoid this, the condition must explicitly exclude foils that lack the necessary baseline capacities (e.g., state capacity, market integration) that made the outcome possible in the primary case.

  **Failure Mode 2: Over-Restrictiveness.** The project fails if the criteria condemn all contrastive questions in history, implying that only singular explanations are valid. This would render the framework useless for comparative history. Success requires showing that valid contrastive questions *are* possible, provided they are parameterized correctly.

  **Failure Mode 3: Tautology.** The project fails if the conclusion is merely that "different scales yield different explanations." This is already known. The deliverable must go further to specify *how* the explanations relate across scales (e.g., reduction, emergence, or independence) and provide a rule for selecting the appropriate scale for a given explanatory interest. If the final output is merely a warning to "be careful," rather than a procedure for "being precise," the project will not have met its objective of resolving the logical stalemate.

  **Conclusion**
  By treating the Great Divergence not as an empirical puzzle but as a logical one, this project offers a pathway through the current deadlock. It respects the complexity of historical causation without surrendering to relativism. The result will be a clarified conceptual landscape where historians can identify whether their disagreements are about the world or about the questions they are asking.
