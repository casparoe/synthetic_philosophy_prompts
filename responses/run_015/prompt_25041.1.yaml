answer: |-
  Dear Colleague,

  You are quite right to press for clarity on the desiderata before evaluating specific theories of the meta-problem. It is a common failure mode in this literature to propose a mechanism for why we believe in consciousness without first specifying what counts as success for that mechanism. If we are to treat the meta-problem as a distinct explanatory target, roughly defined as the problem of explaining why we make the consciousness judgments we do, then we must establish a rigorous set of criteria that any adequate theory must meet. The primary desideratum is phenomenological and doxastic coverage. An adequate theory must account for the specific range of verbal reports and intuitive judgments humans make about consciousness, including the assertion that there is a hard problem, the conceivability of zombies, the sense that qualia are ineffable, and the intuition that consciousness makes a causal difference even when behavior is held fixed. This is a requirement rather than a preference because the meta-problem is defined by these very judgments; if a theory explains everything except the persistence of the intuition that there is a hard problem, it has failed to address the meta-problem itself. It must explain not just that we report consciousness, but why we report it as mysterious, non-physical, or distinct from functional processing.

  The second desideratum is empirical adequacy regarding cognitive architecture. The theory must not contradict established findings in psychology and neuroscience concerning how judgments are formed, how introspection works, and how verbal reports are generated. For instance, if a theory posits a specific module responsible for consciousness judgments, it cannot be contradicted by lesion studies or neuroimaging data showing that such judgments are distributed or rely on different circuitry. This is a requirement because the meta-problem is ultimately a problem about human cognition, and human cognition is a natural phenomenon subject to empirical constraint. A theory that relies on cognitive mechanisms known to be impossible given our current understanding of the brain is scientifically vacuous, regardless of its philosophical elegance. Closely related to this is the third desideratum, which is the avoidance of explanatory circularity or question-begging. The theory must explain the judgment that consciousness is mysterious without presupposing the truth of the judgment in the explanation. For example, one cannot explain why we think consciousness is non-physical by positing that we have direct access to a non-physical property, unless one is prepared to solve the hard problem itself. This is a requirement because the utility of the meta-problem approach lies in its potential to dissolve or bracket the hard problem; if the solution to the meta-problem secretly relies on the ontology of the hard problem, it offers no dialectical progress and merely restates the mystery in cognitive terms.

  When we distinguish between non-negotiable requirements and camp-specific commitments, the line falls between structural adequacy and ontological commitment. The non-negotiables are the three I have just outlined: coverage of the target judgments, consistency with empirical data on cognition, and logical non-circularity. Any theory that fails these is not a viable theory of the meta-problem regardless of whether one is an illusionist or a realist. In contrast, commitments regarding the veridicality of consciousness judgments are camp-specific. For example, an illusionist theory is committed to the desideratum that the theory must explain why we are systematically mistaken about having phenomenal consciousness, whereas a realist theory is committed to the desideratum that the theory must explain how our judgments track a real feature of the world. A neutral theory of the meta-problem should ideally not require either commitment as a condition of adequacy, because the meta-problem is supposed to be neutral ground that both sides can accept before arguing about the hard problem. Therefore, requiring a theory to prove consciousness is illusory or real is a preference of a specific camp, not a requirement of the meta-problem framework itself. Similarly, whether the theory must preserve the intuition that consciousness is causally efficacious is a realist commitment, whereas explaining that intuition as a cognitive error is an illusionist commitment.

  There are, however, significant tensions between certain desiderata that make satisfying all of them simultaneously difficult. The most prominent tension exists between the desideratum of empirical adequacy and the desideratum of accounting for the specific content of our intuitions. If we take empirical data seriously, it suggests that our introspective mechanisms are constructive and prone to error, which supports an error theory of consciousness judgments. However, if we adopt a strong error theory, it becomes harder to account for the robustness and universality of the intuition that consciousness is real without implying that the error is so systematic it mimics truth, which some argue reinstates the mystery we hoped to dissolve. Conversely, if we prioritize the intuition that our judgments are veridical to satisfy the phenomenological coverage desideratum, we risk violating the empirical constraint that introspection is unreliable, or we risk violating the non-circularity constraint by assuming the existence of the very property we are trying to explain the judgment of. Another tension arises between the desire for a unified cognitive explanation and the diversity of consciousness judgments. Explaining why philosophers think zombies are conceivable might require different cognitive mechanisms than explaining why laypeople think they have a private inner movie. A theory that is too unified may lack the nuance to cover the data, while a theory that is too fragmented loses its explanatory power.

  If I had to identify the single requirement that does the most work in excluding candidate theories, it is the constraint against explanatory circularity, specifically the prohibition on presupposing the hard problem's ontology in the explanation of the judgment. This is the most exclusionary because many intuitive explanations of why we believe in consciousness subtly rely on the existence of consciousness to explain the belief. For example, saying we believe we are conscious because we are conscious and can observe it is trivial and fails the meta-problem test. Saying we believe we are conscious because we have a phenomenal concept that refers to phenomenal properties often smuggles in the assumption that such properties exist and have the unique features that generate the hard problem. A theory that avoids this trap must explain the judgment entirely in terms of functional, structural, or representational features that do not themselves rely on the problematic ontology. This excludes a vast number of realist accounts that attempt to solve the meta-problem by appealing to the unique epistemic access consciousness provides, as that access is precisely what is in question. It forces the theorist to construct a model where the judgment arises even if the ontology were different, which is a demanding constraint that most extant views struggle to meet without slipping into question-begging.

  Finally, I must disclose the assumptions upon which this list of desiderata depends. The primary assumption is agnosticism regarding the hard problem. The list assumes that the meta-problem is distinct from the hard problem and that a solution to the former does not logically entail a solution to the latter, though it may render the latter less pressing. If one drops this assumption and assumes instead that the hard problem is real and unsolvable by physicalist means, the desiderata change significantly. Specifically, the non-circularity constraint would relax to allow explanations that posit direct acquaintance with non-physical properties as the cause of the judgments, because under that assumption, such acquaintance is a fact rather than a presupposition. Conversely, if one assumes that consciousness is wholly illusory, the desideratum regarding phenomenological coverage shifts from explaining why we make the judgments to explaining why we make them despite their falsity, placing a heavier burden on the error-theory component of the account. The list I have provided is designed for a neutral framework where the goal is to map the cognitive origins of the problem regardless of its ultimate metaphysical status. If you adopt a strong metaphysical stance upfront, the meta-problem loses its neutrality and becomes merely a subset of the hard problem debate, at which point these desiderata collapse into the standard requirements for solving the hard problem itself. I hope this specification helps you navigate the literature with a clearer eye for what is actually being claimed versus what is being assumed.

  Warmly,

  A Colleague
