answer: |-
  The corridor outside the committee room was drafty, the wood stove in the corner having long since surrendered its heat. Pyotr Alexandrovich stood before the door, clutching two bundles of manuscript paper against his chest. They felt different in weight, though the heavier one was physically lighter.

  The first bundle was his Symphony in C Minor. It was dense with modulation, a lattice of counterpoint so intricate that the professors at the Conservatory nodded with tight, approving lips when they examined it. The critics in St. Petersburg had called it "a triumph of structure." When it was performed last month, the applause had been polite, rhythmic, and dead. Pyotr had watched the audience from the wings; they checked their pocket watches during the adagio. He had felt nothing while writing it but the satisfaction of solving a puzzle. They had felt nothing while hearing it but the passage of time.

  The second bundle was a single sheet, folded twice. The paper was cheap, the ink smudged. It contained only a melody and a simple accompaniment, a folk song titled *The Birch in Winter*. When the village choir had sung it at the estate three weeks prior, the merchants in the front row had wiped their eyes. The old nursemaid in the gallery had sobbed into her shawl. A profound silence had hung in the air after the final note, a silence that felt like a physical touch.

  Pyotr had claimed both works as his own.

  He shifted the bundles. The symphony was technically his. The song was not.

  It belonged to Elena. She had written it during the last winter of her consumption, humming the melody while staring out at the frozen garden. She had never learned notation; she could only sing. Pyotr had sat by her bedside with a pen, catching the notes as they came to her, transcribing her fevered breath onto the staff. She had died in March. He had submitted the transcription under his name in April. He told himself he had orchestrated it, that he had given it form, but the core of it—the thing that made the nursemaid weep—was entirely hers.

  "Pyotr Alexandrovich," the beadle said, opening the door. "The Committee is ready."

  The room smelled of stale tobacco and old leather. Three men sat behind a long table draped in green baize. At the center was Professor Ivanovich, a man whose criticism could ruin a career with a single adjective. He wore his spectacles low on his nose and looked at Pyotr with an expression of rare warmth.

  "Please, sit," Ivanovich said.

  Pyotr sat, placing the manuscripts on the table. He kept his hand on the thin sheet of *The Birch in Winter*.

  "We have deliberated," Ivanovich began, steepling his fingers. "The Symphony is, without question, a work of immense skill. Your command of form is beyond your years. It is a master's architecture."

  Pyotr waited. He knew the *but* was coming.

  "However," Ivanovich continued, his voice softening, "the Prize for Artistic Distinction is not awarded for architecture alone. It is awarded for truth. We seek the work that speaks to the soul of the people."

  He reached out and touched the smudged sheet of paper.

  "This song," Ivanovich said. "There is a sincerity here that is... startling. One does not hear composition here. One hears a confession. You have managed to strip away the artifice of the Conservatory and touch something raw. It is rare, Pyotr Alexandrovich, to find a man who can bleed so openly onto the page."

  Pyotr's throat tightened. The stove in the corner clicked as the metal cooled.

  "We are prepared to award you the Prize for *The Birch in Winter*," Ivanovich said. "It will be published under your name with the Committee's seal. It is the kind of work that endures because it is true."

  *Because it is true.*

  The words hung in the cold air. If the value of the work lay in the transmission of feeling from artist to audience, then the song was a masterpiece. The audience had wept. They had felt the grief embedded in the melody. But the grief was not Pyotr's. He had been a scribe, not a source. He had felt only the loss of his sister, not the specific winter sorrow of the birch tree she had composed.

  If he accepted, the song would be published. It would move thousands more. The feeling would spread, infectious and potent. But the link would be a lie. The audience would believe they were communing with Pyotr's soul, when they were communing with a ghost's.

  If he confessed, the Prize would likely be withdrawn. A plagiarist had no place in the Academy. But more than that, the nature of the art might change in their eyes. Would it still be "true" if they knew the composer had not felt it? Or did the truth of the feeling reside solely in the sound, regardless of the hand that wrote it?

  "Pyotr?" Ivanovich prompted. "Do you accept the Committee's decision?"

  Pyotr looked at his hands. They were stained with ink. He remembered Elena's hand, translucent and blue-veined, tapping the rhythm on the quilt. She had not written it for a prize. She had written it because the feeling inside her was too heavy to carry alone. She had passed it to him so he could carry it.

  Had he carried it? Or had he stolen it?

  The Symphony sat beside the song, a monument to his own skill, empty of life. The song sat beside it, full of life, owned by a liar.

  "Ivanovich," Pyotr said. His voice sounded thin in the large room.

  "Yes?"

  Pyotr looked at the smudged ink on the cheap paper. He thought of the nursemaid's tears. He thought of the polite applause for the Symphony. He thought of the theory that art was a bridge of feeling, and wondered if a bridge built on a false foundation could still hold the weight of those who crossed it.

  The Professor waited, his pen poised over the ledger, ready to record the winner's name. The silence stretched, filled only by the wind rattling the windowpane. Pyotr opened his mouth, but the air remained trapped in his lungs, heavy and unresolved.
