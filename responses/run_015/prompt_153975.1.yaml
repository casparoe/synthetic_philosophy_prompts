      *   *Insight:* The user might be conflating "Dynamic Consistency" with "Path Independence." Hammond (1988) shows Dynamic Consistency + Consequentialism $\rightarrow$ EU. If the user thinks PPI is different from Dynamic Consistency, they need to define it. But if PPI means "evaluation of subtree doesn't depend on path," that *is* consequentialism/dynamic consistency.
