      *   *Review against constraints:* British English? Yes. No citations? Yes. ~900 words? Need to monitor.

      *   *Self-Correction on Step (1):* Step (1) is technically true about the *model*, but false about the *system* described in the probe (which includes memory). The argument shifts between "model" and "system". Step (4) is where the normative claim happens. I will focus on (4) as the primary rejection, noting its dependence on the narrow system definition in (1).

      *   *Refining the "Human" analogy:* Step (8) is the killer. If we accept (4), we lose human agency. So (4) must go or be qualified.

