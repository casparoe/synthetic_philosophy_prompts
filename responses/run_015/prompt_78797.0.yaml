  Consider a **Professional Ethics Board** within a closed guild (e.g., a Bar Association or Medical Board). The Board is empowered by the Guild's Code of Conduct to sanction members for violations. The Code of Conduct also stipulates that the Board has the final authority to interpret the Code, including any challenges to the Board's own jurisdiction.

  **The Loop:** The Board's authority derives from the Code (Rule A), but the Board's rulings determine the valid meaning and scope of the Code (Rule B). Thus, the Code empowers the Board, and the Board sustains the Code.

  **The Inviolate Level:** The system posits an external ground: the **Member's Consent**. The theory is that the Board is not arbitrary because members voluntarily agreed to be bound by the Code when they joined the Guild. This consent is treated as the "inviolate level"—the factual foundation outside the rules that justifies the rules.

  **The Challenge:** Suppose a member is sanctioned and challenges the Board, arguing, "I never consented to this specific interpretation of the Code, and therefore you have no authority over me." To hear this challenge, the Board must assert jurisdiction. To assert jurisdiction, it must rule that membership *does* imply consent to the Board's interpretation.

  **The Collapse:** Here, the distinction between the loop and the inviolate level dissolves. The "Consent" (the supposed outside ground) has no independent content; it is defined entirely by the Board's ruling. The Board does not discover whether the member consented; it *decides* what counts as consent. Consequently, the "inviolate level" is not a fixed foundation outside the system, but merely the topmost node of the loop. The system does not rest on consent; it rests on the Board's assertion that consent exists. There is nothing outside the circle.
