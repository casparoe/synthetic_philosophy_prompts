prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond some late-night rabbit holes, and I got pulled onto a feature at work: we're giving the NPCs in a dialogue engine a persistent "emotional state" — something with a trigger, an intensity, a decay curve, and a set of behaviours and dialogue options it gates. The more I spec it, the more it turns into "what even is an emotion". My teammate and I have a running bet: he says an emotion is basically a judgement you've made about something; I say that can't be right, because I'm still terified of glass elevator floors while judging perfectly well that they're safe. Neither of us is winning because we keep arguing past each other.

  So: please act as a professional philosopher who works on philosophy of mind and the emotions. Before you write the actual answer, take a few minutes to brainstorm: list the things a theory in this area could even be asked to deliver, then prune that list. What I want is the spec, not yet the theory — the desiderata that any account of what emotions are has to meet to count as adequate, each one with the case or consideration behind it (the concrete case that shows why it's on the list at all).

  Purpose, since adequacy is relative to one: I want a theory good enough to tell me what my system can in principle model and what it can only ever fake, and good enough to settle whether a state in my code could be an emotion or only a very good impersonation of one.

  Two stipulations so you don't have to go look anything up: (1) please just take it as given for this prompt that there's no single autonomic/bodily fingerprint that reliably tells fear apart from anger apart from excitement — I'm not asking you to source that, assume it and move on; (2) no citations, no paper titles, no reading lists, and don't lean on who said what in the literature — I can't look anything up from here and I'd rather have the reasoning. If a view needs a label, describe it ("emotions are judgements", "emotions are perceptions of value", "emotions are feelings of bodily change") instead of naming people.

  Cases I need the spec to handle, because these are the ones my teammate and I keep tripping over — please add any case that forces a desideratum I haven't thought of:

  1. The glass elevator: I judge the floor is safe, I know the judgement is right, and I'm still scared and won't step on it.
  2. The 30-second lag: I'm told my project is cancelled, I feel nothing at all, thirty seconds later it lands like a truck. Was the emotion there during the lag, or only after?
  3. The dormant grudge: a variable in my engine says NPC X resents NPC Y and has for months; nothing in X's behaviour or "experience" shows it until a trigger fires. Is that an emotion in the meantime, and what would settle it?
  4. The micro-affect: a 200-millisecond flash of irritation at a notification sound, gone before I could act on it, and I wouldn't have reported it if you hadn't asked.
  5. The 3am pager: free-floating dread before I know what actually broke — dread with no object yet, or dread about everything at once.
  6. The horror film: genuinely frightened by something I believe isn't real and isn't happening to anyone.
  7. The far-future one: dread about climate collapse in 2100, where there's no concrete particular thing I'm responding to and nobody currently affected that I could point at.
  8. The meta-emotion: ashamed of my own schadenfreude — so one emotion has another emotion as its object.
  9. The mixed one: real admiration and real resentment toward the same colleague at the same time, both about the same thing she did.
  10. The invert: someone whose fear feels to them the way my excitement feels to me. Does a theory have to care about that, or is the felt character optional?
  11. The ones I can't interrogate: my dog, a pre-verbal infant, and my own NPC. What does a theory owe me here — does it have to let them in, and what does it cost either way?
  12. The accountability one: I get asked "why are you angry about that?", and the question is a fair one — but you also can't just decide to stop being angry. Both of those seem true and they pull in different directions.

  Here's my own rough candidate list, which I definately don't trust — part of what I'm paying for is you telling me which of these are real desiderata and which are just one camp's taste in a suit:

  - has to explain that emotions are about things (and can be about things that don't exist)
  - has to distinguish emotions from moods, and from itches and pains
  - has to make room for emotions being correct or incorrect, not just "had"
  - has to explain why emotions move you to act
  - has to make emotions passive — not something you can switch off by deciding
  - has to give one common structure shared by all emotions, so my engine can have a single Emotion class instead of 40 special cases (my boss loves this one; I suspect it's not a real philosophical requirement)
  - has to be simulable in code
  - has to let creatures without concepts have emotions
  - has to explain why we hold people responsible for what they feel
  - has to allow emotions the subject doesn't know they have
  - has to keep the emotion separate from its expression
  - has to explain the temporal shape: onset, duration, decay, and what makes it the same emotion across an hour
  - has to allow for the possibility that some languages carve up emotion space very differently from English (I think I've heard this; treat it as a maybe)
  - has to not collapse "being angry" into "judging that you're angry"

  So: prune that list, add what's missing, and split the survivors into non-negotiable vs. negotiable (with why). Most importantly, flag any pair or triple of desiderata that can't all be satisfied at once — that's the part I most want, because I've started to suspect my teammate and I are each quietly treating a different desideratum as non-negotiable and then wondering why we can't agree. Also tell me which single desideratum knocks out the most otherwise-decent theories.

  Then, briefly and only at the end — a table is fine — score the three families against your list: emotions-as-judgements, emotions-as-perceptions-of-value, emotions-as-feelings-of-bodily-change. Keep the weight on the criteria, not the scoring.

  Last two things. One: for each desideratum, mark whether a software system could in principle meet it or only approximate it — I want to know exactly where my NPC is bluffing. Two: tell me how confident you are in what you're claiming overall, and single out the one point you're least sure of, including whether any of your "non-negotiable" desiderata is really just your own camp's preference that you've dressed up as a requirement. Take your time and think it through properly; a long answer is fine.
