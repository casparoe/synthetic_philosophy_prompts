answer: |-
  That slogan conceals four distinct claims, ranging from banal to bogus.

  1.  **Material Dependence:** Pleasure requires neurochemistry. (True, but trivial).
  2.  **Specific Causality:** Dopamine *alone* causes all pleasure. (False. Opioids handle hedonic impact; dopamine is largely about motivation and prediction).
  3.  **Qualitative Identity:** Because the chemical substrate overlaps, the subjective experience is identical. (False. Neural pathways and cognitive context define the qualia, not just the neurotransmitter).
  4.  **Normative Equivalence:** Because the mechanism is shared, the value is equal. (False. This is the genetic fallacy).

  To shut down the Bach-vs-steak debate, your interlocutor relied on Claim 4, smuggled in by Claim 3. They argued that shared substrate implies shared value. This is a reductionist category error.

  As a physicist, you know that knowing the ink composition doesn't tell you if you're reading a love letter or an eviction notice. The medium isn't the message. The "fancy hat" isn't decoration; it's the structure of the experience itself. Reducing the medium to its atoms doesn't erase the difference between a sonata and a snack. Claim 2 is scientifically shaky, but Claim 4 is the philosophical sleight-of-hand. Don't let them confuse the map (neurochemistry) with the territory (lived experience). The mechanism is necessary, but not sufficient to define the quality.
