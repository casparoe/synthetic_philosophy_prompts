      *   **Structure:** Four specific parts (Agreed Claims, Disagreements Table, Crux Table, What Neither Side Holds).
      *   **Constraints:** No citations, names, or titles. Neutral labels. No adjudication (must be signable by both). Journal-ready (approx. 2-page density). Audience knows signalling game formalism.

  2.  **Deconstruct the Positions:**
      *   *Side A (Handicap):* Focuses on the *maintenance* of equilibrium via incentive compatibility. The core mechanism is the cost structure relative to quality. If costs aren't differential (single-crossing property), low types mimic high types.
      *   *Side B (Cue/Constraint):* Focuses on the *causal link* between quality and signal. If the signal is physically constrained or verified, cost isn't the primary driver. Cost might exist, but it's not the *enforcer*.
      *   *Common Ground:* Both accept game theory basics (conflict leads to deception unless constrained), both agree cost definitions matter, both agree empirical reality is complex.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to define "cost" carefully.
      *   *Absolute Cost:* Resources/fitness spent.
      *   *Marginal/Differential Cost:* How cost changes with signal intensity and quality (the single-crossing condition).
      *   *Counterfactual Cost:* What a liar *would* pay.
      *   *Fitness vs. Resource:* Currency matters.
      *   *Game Theory:* Conflict + Costless Signal = Deception (Babbling Equilibrium).
      *   *Empirics:* Whether costless channels exist biologically is an open question, not a theorem.
      *   *Goal:* Ensure both sides feel their definitions are respected without conceding the main argument.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to capture the core friction: Is differential cost the *mechanism* or a *byproduct*?
      *   *Claim 1:* The definition of the Handicap Principle. Side A says it *is* differential cost. Side B says it's often misidentified as such when it's actually constraint.
      *   *Claim 2:* The role of cost in stability. Side A says necessary. Side B says sufficient but not necessary (other mechanisms exist).
      *   *Claim 3:* "Cost" terminology. Side A focuses on fitness consequences. Side B focuses on production constraints.
      *   *Verdict:* Mostly substantive, but some verbal confusion around "cost" vs. "constraint."

  5.  **Drafting - Section 3: Crux Table:**
      *   This is the hardest part. Needs to be testable/falsifiable scenarios.
      *   *Crux 1 (Separability):* Can we have honesty without differential cost? Side A says No (unstable). Side B says Yes (if constrained/verified).
      *   *Crux 2 (Subsidized Signal):* If costs are paid externally (mutant with low marginal cost). Side A says System collapses. Side B says System holds (if constraint remains).
      *   *Crux 3 (Perceptibility):* Signal makes cue easier to see. Side A says Still needs cost to prevent exaggeration. Side B says No cost needed if cue is hard to fake.
      *   *Crux 4 (Enforcement/Retaliation):* Cost paid *after* by receiver. Side A says This *is* a differential cost (expected fitness). Side B says This is distinct from production cost. *Correction:* Need to make sure Side A accepts retaliation as a cost form. Let's frame it as: Is production cost necessary? Side A: No, *expected* cost is enough. Side B: Agrees, but calls it verification, not handicap. *Refinement:* Let's focus on whether *production* cost is required.
      *   *Crux 5 (Origin vs. Maintenance):* Side A focuses on maintenance (equilibrium). Side B argues origin matters (how did the link arise?).
      *   *Crux 6 (Model Features):* Does the math depend on continuity/additivity? Both should admit model sensitivity.
      *   *Predictions:* Must show where they diverge. If they predict the same outcome, note it (as per instructions).

  6.  **Drafting - Section 4: What Neither Side Holds:**
      *   Clear up strawmen.
      *   Side A doesn't say signals must be wasteful for *no reason*.
      *   Side B doesn't say cost is irrelevant ever.
      *   Neither says conflict is always total.
      *   Neither says biology always matches idealized models perfectly.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Constraint Check:* No citations? Yes. No names? Yes.
      *   *Length:* Needs to be dense but readable (like a 2-page statement).
      *   *Signability:* Would Side A sign? It acknowledges their core theorem. Would Side B sign? It acknowledges alternative mechanisms.
      *   *Specific Instruction:* "Flag explicitly any crux on which both sides would predict the same outcome." I need to ensure I identify where they actually agree on the outcome but disagree on the label/mechanism.
      *   *Specific Instruction:* "Any crux on which you think neither side would in fact move." I need to be honest about entrenched positions.

  8.  **Final Polish:**
      *   Ensure the distinction between "differential cost" (marginal) and "absolute cost" is clear in Section 1.
      *   Ensure the "Separability" crux is sharp.
      *   Make sure the "Verdict" column in Section 2 distinguishes verbal vs. substantive clearly.
      *   Check formatting (Tables need to be text-friendly).

  *(Self-Correction during drafting Section 3)*: I need to be careful with the "Enforcement" crux. Side A (Handicap) typically subsumes retaliation costs into the "expected cost" calculation. If the expected cost is differential, they are happy. Side B distinguishes "production constraint" from "post-hoc punishment." I need to frame the crux so it highlights this distinction. Let's ask: "Is *production* cost necessary?" Side A: No, *expected* cost is necessary (which can be retaliation). Side B: Production cost specifically is not necessary. This might be too much agreement. Let's try: "Is the *single-crossing property* of the cost function the *only* way to satisfy incentive compatibility?" Side A: Yes. Side B: No (constraints can do it). That's better.

  *(Self-Correction on Crux 6)*: The prompt asks to flag if both predict the same outcome. In the "Model Features" crux, they might agree that discrete vs continuous changes the math, but disagree on biological relevance. I will note if the prediction is identical.

  *(Final check on constraints)*: "No citations, bibliographies, author names, or paper titles." "Refer to positions by the neutral labels above." I will use "Differential Cost Position" and "Constraint-and-Cue Position."

  Let's assemble.
answer: |-
  **JOINT STATEMENT ON SIGNALLING STABILITY AND THE ROLE OF COST**

  **1. Agreed Claims**

  Both parties affirm the following propositions as the common ground for this debate. Disagreements concern the interpretation and necessity of these claims, not their validity.

  1.  **Taxonomy of Cost:** We distinguish four notions of cost often conflated in literature:
      *   *Absolute Production Cost:* The fitness or resource expenditure required to produce a signal of a given magnitude.
      *   *Marginal (Differential) Cost:* The rate at which production cost increases with signal intensity, specifically how this rate varies with the signaller's underlying quality (the single-crossing property).
      *   *Counterfactual Mimicry Cost:* The cost a lower-quality individual *would* incur were they to produce a signal typical of a higher-quality individual, including any post-signal retaliation.
      *   *Currency:* Costs may be measured in immediate resources, opportunity, or ultimate fitness.
      *   *Note:* The **Differential Cost Position** asserts that stability requires specific properties of *Marginal Cost*. The **Constraint-and-Cue Position** asserts that stability is often secured by factors affecting *Counterfactual Mimicry Cost* that do not rely on *Marginal Cost* structures.
  2.  **Game-Theoretic Baseline:** Both sides accept that in a signalling game with strict conflict of interest, if a signal is costless and uncorrelated with quality by definition, the equilibrium is uninformative (babbling). Information transfer requires a constraint on deception.
  3.  **Empirical Status of Costless Channels:** Whether biological organisms possess access to truly costless signalling channels is an empirical and developmental question, not a theorem of game theory. The existence of low-cost channels does not falsify signalling theory, but their absence may explain signal reliability.
  4.  **Equilibrium Focus:** Both sides agree that the primary theoretical object is the stability of the signalling equilibrium against invasion by deceptive mutants.
  5.  **Fitness Consequences:** Both sides agree that if a signal reduces the signaller's fitness without providing a return benefit, it cannot be maintained by selection unless it secures a larger benefit via receiver response.

  **2. Disagreements Table**

  | Disputed Claim | Formulation (Differential Cost Position) | Formulation (Constraint-and-Cue Position) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **The Stabilizing Mechanism** | Honesty is stabilized *because* the marginal cost of signalling is lower for high-quality individuals. This cost structure is the mechanism. | Honesty is stabilized because the signal production is physically or developmentally linked to quality. Differential cost is a frequent byproduct, not the mechanism. | **Substantive.** Disagreement concerns causal priority in the maintenance of equilibrium. |
  | **Definition of Handicap** | The Handicap Principle *is* the claim that differential cost is necessary for honest signalling under conflict. | The Handicap Principle is often a label applied to any costly signal, obscuring cases where cost is not the stabilizing factor. | **Verbal/Substantive.** Term "Handicap" is the pivot. Substantive question: Is differential cost *necessary*? |
  | **Role of Constraints** | Physical constraints are merely one way to generate the required differential cost function. | Physical constraints can enforce honesty even if the differential cost function is absent or flat. | **Substantive.** Disagreement on whether constraints map necessarily onto differential cost functions. |
  | **Necessity of Waste** | Signal cost (fitness reduction) is required to offset the benefit of deception. | Signal cost is not required if deception is physically impossible or verified post-hoc. | **Substantive.** Disagreement on whether "waste" is a necessary condition for reliability. |

  **3. Crux Table**

  | Crux (Yes/No Question) | Agreed Test / Model Variation | Prediction (Differential Cost) | Prediction (Constraint-and-Cue) | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Separability:** Can equilibrium honesty persist if the correlation between signal and quality is fixed, but the differential marginal cost is driven to zero? | A model where quality physically limits maximum signal intensity (hard cap), but marginal cost is identical for all types below the cap. | **No.** Without differential marginal cost, lower types will signal at their maximum cap, blurring the distinction. System unstable. | **Yes.** The hard cap prevents mimicry regardless of marginal cost structure. System stable. | **Decisive.** |
  | **Subsidized Signal:** If a mutant arises that produces the full high-quality signal at negligible marginal cost (without changing quality), does the system collapse? | Introduction of a "cheat" genotype that bypasses production costs but retains the signal phenotype. | **Yes, collapses.** The incentive compatibility constraint is violated; deception pays. | **Depends.** If the signal is a cue of underlying physiology the mutant lacks, receivers ignore it. If it is a pure signal, system collapses. | **Partial.** Agreement if signal is pure; disagreement if signal is an index. |
  | **Perceptibility:** Does a trait that merely makes an existing cue easier to measure require differential cost to remain honest? | Modelling a "magnifier" trait that increases receiver detection accuracy of a hard-to-fake cue. | **Yes.** Exaggerating the magnifier must be differentially costly, or low-quality types will exaggerate the magnifier. | **No.** If the underlying cue is hard-to-fake, the magnifier need not be costly to be honest. | **Substantive.** |
  | **Enforcement:** If all cost is imposed by receivers post-signal (retaliation), is this distinct from a production handicap? | A model where production is costless, but receivers punish mismatches between signal and revealed quality. | **No.** Expected retaliation creates a differential *expected* cost function. This is a handicap mechanism. | **Yes.** This is verification/enforcement, distinct from production-based handicap. The mechanism is receiver-side, not signaller-side. | **Verbal.** Both agree system is stable. Disagreement is on taxonomy of "Handicap." |
  | **Origin vs. Maintenance:** Do the competing theses explain how honesty originates or only how it persists? | Comparative analysis of evolutionary trajectories vs. equilibrium stability conditions. | **Maintenance.** The theory explains why the equilibrium holds, not necessarily how it arose. | **Both.** Constraints often explain the origin (exaptation of cues), which then dictates maintenance. | **Substantive.** Scope of explanation differs. |
  | **Model Sensitivity:** Does the necessity of differential cost depend on mathematical assumptions (continuity, additivity)? | Comparing discrete vs. continuous quality variables; additive vs. multiplicative cost-benefit functions. | **No.** Differential cost is required across model specifications. | **Yes.** In discrete models or specific cost-benefit combinations, honesty can hold without strict single-crossing. | **Potential Stalemate.** Both sides may claim the opposing model specifications are biologically unrealistic. |

  **4. What Neither Side Holds**

  To prevent the re-litigation of strawmen, we explicitly reject the following attributions:

  *   **The Differential Cost Position does not hold:** That signals must be wasteful for *no reason* other than cost. Cost must be linked to quality.
  *   **The Differential Cost Position does not hold:** That all biological signals are handicaps. Some signals may occur under common interest or be constrained cues.
  *   **The Constraint-and-Cue Position does not hold:** That cost is irrelevant to signalling biology. Cost is often present and correlated with quality.
  *   **The Constraint-and-Cue Position does not hold:** That game theory is inapplicable to constrained signals. Strategic interaction exists whenever receiver response is conditional.
  *   **Neither side holds:** That conflict of interest is always total. Both acknowledge that partial alignment of interests facilitates signalling.
  *   **Neither side holds:** that empirical measurement of cost is straightforward. Both acknowledge the difficulty of measuring lifetime fitness costs versus immediate resource expenditure.
