answer: |-
  **Project Description: The Negative Value of Endogenous Signals**

  **The Question**
  Good's theorem is a cornerstone of Bayesian decision theory: for a standard expected-utility agent, free information always has non-negative expected value. The intuition is simple. Once you receive a signal, you can always choose to ignore it and perform the act you would have chosen anyway. Therefore, having the signal cannot make you worse off. This result holds robustly across single-agent decision problems, provided the state of the world is fixed independently of the information gathering.

  My project asks whether this holds when the signal's reliability is endogenous to the act of consulting it. I am interested in a specific class of decision problems where the signal predicts a fact about the agent (e.g., "you will be happier in Career A"), but the accuracy of that prediction depends on whether the agent actually reads the prediction. This creates a fixed-point structure: the signal predicts the outcome, but the consultation of the signal alters the outcome, thereby retroactively affecting the signal's reliability.

  The research question is determinate: Is there a nontrivial class of decision problems with these endogenous signals in which the expected value of consulting a free signal is provably negative? If so, what feature of the signal structure or the agent's response rule drives the negativity? I aim to provide a clean classification theorem distinguishing cases where information retains non-negative value from those where consulting it is strictly harmful.

  **Distinctions from Existing Results**
  It is standard to note that information can be harmful in strategic settings (where other players react to your being informed), under belief-dependent utility (where anxiety offsets material gain), or for non-expected-utility agents (who may be dynamically inconsistent). I need to be clear that this project does not recycle those results.

  This is not a game-theoretic result disguised as a single-agent problem. There is no second player reacting to my information state; the "reaction" comes from the agent's own causal influence on the state via the information channel. It is also distinct from standard preference change. In the literature on preference change, the utility function shifts over time. Here, the utility function is fixed. The problem is that the *state of the world* (specifically, which career yields higher utility) is partly constituted by the agent's response to the signal. Finally, this is not about the psychological cost of knowing. The model assumes no direct disutility from receiving news. The negative value arises structurally because consulting the signal moves the agent away from the state the signal predicted, rendering the guidance misleading in a way that ignoring the signal would have avoided.

  **Methodology**
  I propose a four-month timeline to formalize and solve this problem.

  *Month 1: Formalization.* I will construct the minimal interesting model. This involves two acts, two states, and a binary signal. Crucially, the signal's reliability matrix will not be fixed exogenously. Instead, reliability will be specified as a function of the agent's information policy (i.e., whether they commit to consulting the signal or ignoring it). I will define the response function mapping signals to mixed acts.

  *Month 2: Fixed-Point Analysis.* The core technical challenge is solving for the equilibrium where the signal's prediction matches the outcome generated by the agent's response to that prediction. I will determine conditions under which a consistent fixed point exists. If multiple fixed points exist, I will analyze stability conditions.

  *Month 3: Value Calculation.* Once the equilibrium behavior is defined, I will calculate the expected utility of consulting the signal versus ignoring it. I will look for parameter ranges where the consulting strategy yields strictly lower expected utility.

  *Month 4: Synthesis and Write-up.* I will generalize the result from the 2x2 case to broader classes of signals and draft the paper for submission.

  **Success and Failure Conditions**
  A positive result looks like a theorem specifying the necessary and sufficient conditions for negative value of information in this context. For example, I might show that negative value arises exactly when the signal's influence on the state outweighs its predictive accuracy.

  I anticipate two distinct failure modes. The first is boring: the class of problems collapses into a known category. For instance, it might turn out that endogenous signals are mathematically isomorphic to standard strategic settings with a "nature" player that reacts to information. If I prove this equivalence, the project fails to identify a new phenomenon, though the proof itself may be useful.

  The second failure mode is more interesting: the expected value of consulting the signal turns out to be ill-defined without an arbitrary equilibrium-selection rule. If the model generates multiple stable fixed points with different payoffs, the "value of information" depends entirely on which equilibrium the agent lands in. In this case, the finding would be that the question itself is ill-posed within standard decision theory, requiring an auxiliary theory of equilibrium selection to answer. This would still be a substantive contribution, shifting the focus from value calculation to equilibrium selection.

  **Broader Relevance**
  This is not merely a technical puzzle. We are increasingly subject to algorithmic recommendation systems and predictive tests that are partly self-fulfilling. Risk scores in healthcare, aptitude tests in education, and credit scoring all function as signals that influence the very outcomes they predict. If an agent knows that consulting a risk score changes their behavior in a way that invalidates the score, standard decision theory tells them to consult it anyway. If my project shows that consulting can be harmful even without psychological costs, it suggests a normative gap in how we advise agents to interact with predictive algorithms. It provides a formal basis for skepticism toward "free information" in feedback loops.

  **Scope and Contingencies**
  The scope is tight: one semester, one core theorem. If the formal part proves harder than expected, I will drop the analysis of mixed acts and restrict the agent to pure strategies. This simplifies the fixed-point analysis significantly. If I only secure three months of funding rather than four, I will cut the generalization phase (Month 4) and focus solely on solving the 2x2 case completely. The priority is a solved model over a generalized sketch.

  **Terminology Note**
  I will use the term "endogenous signals" rather than "self-referential signals." "Self-referential" suggests the signal refers to itself (like the Liar Paradox), whereas here the signal refers to the agent, but its *accuracy* is determined within the model. "Endogenous" correctly signals to the panel that the reliability parameter is determined by the system's internal dynamics rather than outside it.
