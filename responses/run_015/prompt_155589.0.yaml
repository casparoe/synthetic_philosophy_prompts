prompt: |-
  hey — I need a dialogue for a medical ethics reading group I'm running, and I want the two sides to end up genuinely stuck rather than one of them winning on vibes.

  Here's the case — please keep it, I built it specifically so the standard moves don't land cleanly.

  Miriam, 62, lifelong offshore sailor, signs a very detailed advance directive. It refuses antibiotics and tube feeding if she ever reaches a stage where she can no longer recognise her daughter or take part in any of the activities that made her life hers. It also contains what her lawyer ended up calling the calibration clause: if a later version of Miriam disagrees with the document, her disagreement is to be discounted in proportion to how far her daily life has shrunk relative to the life she had when she signed it. Her stated reason was that she doesn't trust a smaller life to judge itself.

  At 74 Miriam has moderate-stage dementia. She has lucid days, still recognises her daughter, has stopped sailing, sings in the care-home choir, has a new partner, and says things like "the old me was scared of the wrong thing." On a lucid day she signs a counter-directive revoking the first one, in which she writes that honouring a document because the document tells you not to trust her lets a stranger's suspicion of her do the deciding. She then gets pneumonia, which antibiotics would very likely clear up.

  The two characters:

  Dev defends the authority of the earlier self — precedent autonomy, roughly — including, crucially, the claim that Miriam was entitled to bind not just the treatment decision but the evidentiary weight of her later self's protest.

  Ruth defends the later Miriam — present endorsement, the difference between the interests you have in how your life goes as a whole and the interests you have in how it feels moment to moment, the gap between imagining a condition and being in it. But she has to take seriously that the calibration clause was written by the same person and wasn't obviously crazy at the time.

  What I want from the exchange:

  - No strawmen. Give Dev the strongest version of the epistemic point: that dementia changes what you want partly by changing the machinery that reports what you want, so Miriam's contentment isn't straightforwardly evidence that her life is going well by her own lights. Give Ruth the strongest version of hers: that the earlier Miriam was making a prediction about a state she had never occupied, and that "shrunk" is doing enormous unexamined work — it presupposes a single scale on which a life with less ambition and autonomy but more daily affection and music is simply smaller.
  - They have to actually reply to each other. In particular: Ruth should have to say whether the calibration clause is illegitimate because self-binding about your own future credibility is never permitted, or because Miriam calibrated it wrongly. And Dev should have to say whether the choir is a counterexample to the directive's own trigger condition — Miriam can't sail, but she does take part in something — or whether the trigger condition is definately to be read by the earlier Miriam's standards about which activities count.
  - I'd like them to notice at least one spot where they may just be arguing about words — e.g. whether the Miriam who signed and the Miriam who sings are the same subject of authority at all — and to say what would still be at stake if that bit is purely verbal.
  - One thing they should not do: settle anything by appeal to what the law or her jurisdiction says. Assume no legal frame, keep it moral and metaphysical.
  - And don't let either of them resolve it by splitting the difference into "give the antibiotics this time." If the case has a right answer, fine, but I want the reasoning, not a compromise.

  Length: whatever it needs, but dense — I'd rather have eight real turns than twenty that restate.

  Then, after the dialogue, give me the same material as a JSON object:

  {"characters": [{"name": "Dev", "thesis": "one sentence", "strongest_argument": "...", "hardest_objection_she_must_answer": "...", "did_she_answer_it": "yes | partially | no"}],
   "shared_ground": ["claim both would sign", "..."],
   "cruxes": [{"crux": "...", "why_it_matters": "...", "Dev_predicts": "...", "Ruth_predicts": "...", "evidence_both_would_accept_as_bearing_on_it": "..."}],
   "verbal_or_semi_verbal": [{"surface_dispute": "...", "diagnosis": "...", "what_is_left_if_it_is_verbal": "..."}],
   "clause_by_clause": [{"clause": "the no-antibiotics instruction | the trigger condition | the calibration clause | the counter-directive", "Dev_treatment": "...", "Ruth_treatment": "...", "status": "agreed | contested | contested_for_different_reasons"}]}

  Fill in both characters in the first array, and at least three cruxes and four clause rows.
