answer: |-
  **Dev:** We have to start with the calibration clause. It's the hinge. Miriam at sixty-two wasn't just saying "no antibiotics"; she was anticipating exactly this moment. She knew dementia doesn't just change what you want; it changes the machinery that generates wants. When current-Miriam says the old Miriam was "scared of the wrong thing," that's the pathology talking. The calibration clause instructs us to discount that protest precisely because her life has shrunk. She can't sail, she's institutionalized. The clause treats her current contentment as epistemically suspect because it's formed within a narrowed horizon. Precedent autonomy isn't just about respecting past choices; it's about respecting the only version of herself who had the cognitive capacity to weigh the whole life against its end.

  **Ruth:** But that assumes "shrunk" is a neutral metric. You're treating ambition and autonomy as the only currencies of a life's size. Miriam at seventy-four isn't living a smaller life; she's living a different one. She sings in a choir. She has a partner. She recognizes her daughter. The earlier Miriam was making a prediction from a state of ignorance—she had never occupied the cognitive state she was legislating against. To discount her current endorsement because she isn't sailing is to impose the values of a sailor on a singer. The calibration clause isn't illegitimate in principle—people can bind themselves—but it was calibrated wrongly. It presupposes a single scale of value where there are actually incommensurable ones.

  **Dev:** If the scale is incommensurable, then the earlier self's decision to prioritize the "sailor values" stands as the only coherent ordering we have. You say the clause was calibrated wrongly, but who corrects the calibration? The person whose capacity to calibrate is the very thing under dispute? The clause exists because Miriam suspected her future self might find comfort in a life she previously deemed undignified. That comfort is the danger. If we honor the counter-directive, we aren't honoring Miriam; we're honoring the dementia. The machinery is damaged. You're arguing that because the damage feels good, it isn't damage.

  **Ruth:** I'm arguing that "damage" is a value judgment, not a medical fact. But let's look at your trigger condition. The AD refuses treatment if she can't "take part in any of the activities that made her life hers." She sings. She loves. Is the choir a counterexample to the trigger? Or do you claim the trigger is defined exclusively by the earlier Miriam's standards of what counts? If it's the latter, the clause is tautological: she loses authority when she stops doing what the old her decided mattered. That renders the trigger condition useless. It just means "when I stop being me," where "me" is frozen at sixty-two.

  **Dev:** It's not tautological; it's protective. The trigger condition must be read by the earlier Miriam's standards because she is the one who defined "activities that made her life hers." Sailing was the core. The choir is a substitute, a coping mechanism, not the constitutive activity. If we let the current self redefine the trigger, the advance directive collapses. Any adaptation to dementia would void the restriction. The earlier self gets to decide what counts as a life worth living because the earlier self is the one who has to die if the judgment goes wrong. The choir doesn't satisfy the trigger because the author of the document didn't authorize choir-singing as a substitute for sailing.

  **Ruth:** So we arrive at the identity question. If the author of the document and the woman in the bed are psychologically discontinuous enough that the author's values no longer apply, why does the author retain authority? You're treating them as the same subject of authority for the purpose of obligation, but different subjects for the purpose of experience. If the "old Miriam" is effectively dead, why does her will bind the living woman? Is this just a verbal dispute about whether "Miriam" is a persisting entity or a series of temporal stages?

  **Dev:** It's not merely verbal. Even if we grant psychological discontinuity, the interest in not living a life one deems undignified persists. But let's say it is verbal. What remains is the conflict of interests. The past self has an interest in the narrative integrity of her life. The present self has an interest in continued existence and current comfort. If we say they are different people, we still have to decide which person's interests trump. I argue the past self's interests trump because the present self's interests are contingent on a cognitive impairment the past self explicitly sought to guard against. The verbal dispute doesn't dissolve the moral obligation.

  **Ruth:** But the moral cost is paid by the present self. She is the one who feels the pain of pneumonia. She is the one who sings. If you override her, you are using a living person as a monument to a dead one. You say the past self's interests trump because they were formed competently. I say the present self's interests trump because they are the only ones currently being experienced. We are stuck because you prioritize the integrity of the biography, and I prioritize the quality of the biography's current chapter. Neither principle collapses under the other. The calibration clause tries to solve this by weighting the scales, but it weights them using the old scale. We have no neutral ground to weigh the weighing.

  **Dev:** And without that neutral ground, we default to the only competent judgment available. The present judgment is compromised by the condition it evaluates. The past judgment is compromised by ignorance of the condition. But the past judgment includes a mechanism for handling the compromise—the calibration clause. The present judgment offers no mechanism for handling the loss of capacity. So we are left with the document, or we are left with nothing but immediate impulse. I choose the document.

  **Ruth:** And I choose the person. But I admit I cannot prove to you that the person in the choir is more "Miriam" than the person on the boat. You cannot prove to me that the boat matters more than the song. We are arguing about which ignorance is more authoritative: the ignorance of what dementia feels like, or the ignorance of what life without sailing feels like. The calibration clause doesn't solve it; it just encodes the preference for the first ignorance.

