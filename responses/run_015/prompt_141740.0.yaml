  3. For the look-again view, the provenanced twin allows confident scrutiny while the other invites doubt, fundamentally altering the visual experience despite identical surfaces. The uncertainty itself becomes a visible feature that degrades the appreciation, making the copy feel aesthetically poorer.
  4. The who-did-it view struggles here because the artist's agency is identical in both, suggesting the market's preference is indeed mere paperwork-worship rather than genuine artistic loss. It cannot explain why we value the documented twin without conceding that history matters more than the act itself.
  5. The look-again view survives best, implying visitors feel short-changed because labelling an object as a replica genuinely changes what they perceive, not just what they know. Their disappointment is valid, as the label alters the looking rather than merely correcting a fact about the object's origin.
