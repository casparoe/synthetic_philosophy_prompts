prompt: |-
  I write historical novels set in periods and among events whose shape most of my readers already know. The manuscript I am currently outlining concerns a real and well-documented mercantile expedition that failed, and anyone who opens the book will know within thirty pages that it failed. A review of my last novel complained, fairly I thought, that the book moved as though the catastrophe had been fated: every chapter laid another brick on a road that led to only one place, and the characters' decisions read as stage directions rather than as gambles. I do not think the remedy is to stop telling stories with known endings. I am not going to give up dramatic irony, and my readers do not want me to; the pleasure of the form is precisely that we watch people walk toward an outcome we can already see. What I want is to keep the outcome known while making the route to it feel like one that could have gone otherwise, and to do that without falsifying the record or manufacturing uncertainty nobody had.

  The difficulty is that I cannot see, from inside my own drafting, when I am doing the thing I am trying to avoid. I know how it ends; so does my reader; and the archive I work from is not neutral, since documents survive in part because they later mattered, and the people who wrote them were frequently explaining themselves after the fact. I have begun separating out three or four failure modes, and I would like a procedure that handles them, though I would rather you sharpen or replace my distinctions than simply adopt them. First, my own foreknowledge leaking into causation: treating something as a cause mainly because, given the outcome, it looks like one. Second, retrofitted motive: giving a character a reason that fits what they later did, and then experiencing that reason as though it explained the action rather than being inferred from it. Third, archival selection: promoting whatever survived in the record, and above all whatever was uncovered, litigated, or confessed afterwards, into the engine of the plot, when its prominence in the file may be an effect of the disaster rather than a cause of it. Fourth, a problem that belongs to the reader rather than to me: an explanation can be scrupulously fair and still land as inevitable, because the person reading it knows the ending and supplies the rest. A related worry is that when I try to restore contingency by dramatizing alternatives, I may be inventing options that were never in the air: logically available, but not ones anyone at the time proposed, feared, or could have acted on. I have been calling these dead alternatives, as opposed to live ones, and I want the procedure to draw that line and to say what would count as evidence that an alternative was live.

  So please turn what is actually known about hindsight bias and the narrative fallacy into a procedure I can run on a plotline before I draft it: the questions in order, what counts as a sufficient answer to each, where the answer is a stop or a rewrite, and where the question comes back to me because it is a judgment about the novel rather than a fact about the past. The constraints are these. I have roughly an afternoon per plotline. I work with a research assistant who reads the period hands and knows nothing of the theory, and a fact-checker who must sign off on anything the book asserts about the world; so most steps have to be executable by the assistant, and the procedure should say which steps cannot be delegated. It must not ask me to withhold the outcome or to feign ignorance I do not have, and it has to leave room for the reader's foreknowledge as a fixed condition rather than a defect to be engineered away. Then run it on three subplots from the current outline: a purser's embezzlement, recorded in the sources because it was discovered during the post-mortem into the failure, which I have been using as the main causal hinge and as my villain; a lieutenant's change of allegiance, for which the surviving letters give no reason at all and to which I have supplied a childhood grievance; and the loss of the expedition's fortified trading post, which on the military facts looks genuinely overdetermined, since the garrison was too small, the relief was not coming, and the siege works were competently built. At least one of the three should return a verdict I will not like, and I would rather have it from you than from my editor. I should also say that I have been toying with a device for restoring contingency from the reader's side: a scene dramatizing an outcome that did not occur, staged as a rumour running through the camp, a letter that argues for the other course, or a chapter from the perspective of someone who expected things to go differently. Tell me whether your procedure licenses that device, on what conditions, and where it degenerates into manufacturing a contingency the period did not contain. Finally, be plain about what the procedure cannot do: I would rather know now which of these questions it can only re-describe.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** A historical novelist writing about known failures (dramatic irony is desired, fatalism is not).
      *   **Problem:** Hindsight bias/narrative fallacy makes the plot feel fated/inevitable. Characters feel like puppets, decisions feel like stage directions.
      *   **Goal:** A procedural checklist to run on plotlines *before* drafting to detect and mitigate hindsight bias without falsifying history or feigning ignorance of the outcome.
      *   **Constraints:**
          *   ~1 afternoon per plotline (must be efficient).
          *   Research Assistant (RA) available (reads period hands, no theory knowledge).
          *   Fact-checker (FC) available (signs off on assertions).
          *   Cannot withhold outcome from the writer.
          *   Must accept reader foreknowledge as a fixed condition.
          *   Must sharpen/replace the user's four failure modes (Foreknowledge leaking, Retrofitted motive, Archival selection, Reader inevitability/Dead alternatives).
          *   Must test the procedure on three specific subplots (Purser's embezzlement, Lieutenant's defection, Fort loss).
          *   Must evaluate a specific narrative device (counterfactual scenes/rumors).
          *   Must be plain about limitations (what the procedure *cannot* do).
          *   Tone: Professional, rigorous, critical (willing to deliver a verdict the writer won't like).

  2.  **Deconstruct the Failure Modes & Theory:**

      *   *Hindsight Bias:* "I knew it all along." Distorts memory of probability.
      *   *Narrative Fallacy:* Imposing a story structure (cause -> effect) on messy reality.
      *   *User's Modes:*
          1.  *Causal Leakage:* $A \to B$ only because we know $B$ happened.
          2.  *Retrofitted Motive:* Explaining action $X$ with reason $Y$ because $X$ happened, ignoring $Z$.
          3.  *Archival Selection:* Using post-disaster documents (inquests, confessions) as pre-disaster drivers.
          4.  *Dead Alternatives:* Inventing choices no one at the time considered possible.

      *   *Refinement:* I need to turn these into actionable questions for the RA and the Writer. The RA handles the *archive*; the Writer handles the *narrative logic*; the FC handles the *plausibility*.

  3.  **Develop the Procedure (The "Contingency Audit"):**

      *   *Phase 1: Archival Triangulation (RA led).* Focus on timing and provenance of documents.
      *   *Phase 2: Motive & Decision Mapping (Writer/RA joint).* Focus on "Live Alternatives."
      *   *Phase 3: The "Before" Test (Writer led).* Focus on the subjective experience of the moment.
      *   *Phase 4: The Reader Check (Writer led).* Focus on the dramatic irony vs. fatalism balance.

      *   *Key Concept:* "Live Alternatives." An alternative is "live" if there is evidence (explicit or implicit) that contemporaries considered it viable *before* the outcome was known.

  4.  **Drafting the Steps (Iterative refinement for constraints):**

      *   *Step 1 (RA): Document Provenance.* Date every source. Flag anything written *after* the failure.
      *   *Step 2 (RA): The Silence Check.* What isn't in the record? If a motive is invented, is it consistent with period psychology or just plot-convenient?
      *   *Step 3 (Writer): The Fork in the Road.* Identify the decision point. List alternatives. Mark them Live/Dead.
      *   *Step 4 (Writer): The Causal Weight.* Does this event *cause* the failure or just *precede* it?
      *   *Step 5 (FC): Plausibility Sign-off.* Can we assert this?

  5.  **Applying the Procedure to the Three Subplots:**

      *   *Subplot 1: Purser's Embezzlement.*
          *   *Issue:* Recorded because discovered post-mortem. Used as "main causal hinge."
          *   *Audit:* If discovered *after*, did it cause the failure *during*? Or is it a scapegoat?
          *   *Verdict:* Likely a "Stop/Rewrite." It sounds like Archival Selection bias. The embezzlement might be a symptom or a minor factor inflated by the inquest to find a villain.
      *   *Subplot 2: Lieutenant's Defection.*
          *   *Issue:* No reason in letters. Writer supplied "childhood grievance."
          *   *Audit:* Is this a Retrofitted Motive? Is "childhood grievance" a Live Alternative?
          *   *Verdict:* Risky. Needs evidence of *type* of motive, even if specific is invented.
      *   *Subplot 3: Fort Loss.*
          *   *Issue:* Overdetermined (small garrison, no relief, good siege).
          *   *Audit:* Is this inevitable? Can contingency exist here?
          *   *Verdict:* This is where the "Reader Inevitability" problem lives. The history says "fated," the novel needs "gamble."

  6.  **Evaluating the Narrative Device (Counterfactuals/Rumors):**

      *   *Condition:* Licenses if the rumor/letter existed or represents a "Live Alternative" recognized at the time.
      *   *Degeneration:* If the alternative was unthinkable to the period mindset, it's "Dead."
      *   *Verdict:* Useful for showing *hope*, not just changing history.

  7.  **Refining the Output Structure:**

      *   Introduction: Acknowledge the sophistication of the prompt.
      *   The Procedure: "The Contingency Audit." Broken down by role (RA, Writer, FC).
      *   The Application: Run the audit on the three subplots.
      *   The Device: Analyze the counterfactual technique.
      *   Limitations: What this can't fix.

  8.  **Self-Correction/Critique during drafting:**

      *   *Critique:* Is the procedure too theoretical for the RA?
      *   *Fix:* Make the RA's instructions concrete (dates, provenance, search terms).
      *   *Critique:* Did I address the "Dead vs. Live" alternative distinction clearly?
      *   *Fix:* Define "Live" as "supported by contemporary discourse or action."
      *   *Critique:* The prompt asks for *one* verdict I won't like.
      *   *Fix:* I need to be hard on the Purser subplot. It smells like the classic "great man/villain" fallacy in history.
      *   *Critique:* Ensure I don't tell the writer to hide the ending.
      *   *Fix:* Explicitly state the procedure assumes the ending is known.

  9.  **Final Polish:** Check tone. It needs to be collaborative but rigorous. Avoid fluff. Ensure the "Stop/Rewrite" conditions are clear. (Self-correction: Make sure the distinction between *historical* contingency and *narrative* contingency is clear.)

  10. **Final Review against constraints:**
      *   Afternoon per plotline? Yes, steps are scoped.
      *   RA/FC roles defined? Yes.
      *   No feigning ignorance? Yes.
      *   Three subplots analyzed? Yes.
      *   One unpleasant verdict? Yes (Purser).
      *   Device evaluated? Yes.
      *   Limitations stated? Yes.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a sophisticated problem of historical epistemology applied to narrative craft. You are asking for a way to operationalize *contingency* without violating *facticity*. The core tension is between the archive (which organizes the past by outcomes) and the novel (which must organize the past by choices).

  Below is the **Contingency Audit Procedure**. It is designed to be executed in an afternoon per plotline. It separates tasks between your Research Assistant (RA), Fact-Checker (FC), and yourself (Writer). Following the procedure, I have applied it to your three subplots and evaluated your proposed narrative device.

  ### Part I: The Contingency Audit Procedure

  **Objective:** To distinguish between *causal factors* (things that made the outcome more likely) and *narrative determinants* (things that feel like they made the outcome unavoidable).
  **Time:** 3–4 Hours per plotline.
  **Roles:** RA (Archive), FC (Plausibility), Writer (Narrative Logic).

  #### Step 1: Provenance & Timing (RA Led)
  **Task:** Create a timeline of the *evidence*, not just the events.
  1.  List every document supporting this plotline.
  2.  Assign a date of creation to each.
  3.  Flag any document created *after* the failure was known (inquests, memoirs, confessions, litigation).
  4.  Flag any document where the author had a motive to shift blame or claim foresight.

  **Pass Condition:** At least 40% of the evidentiary weight for the character's *decision-making process* comes from pre-failure documents (letters, orders, logs, contemporary gossip).
  **Stop/Rewrite:** If >60% of the motive or causal logic relies on post-failure documents. This indicates **Archival Selection Bias**. You are using the explanation of the disaster as the cause of the disaster.
  **Writer Judgment:** If the RA flags a document, you must decide if you are using it as *fact* or as *period perception*.

  #### Step 2: The "Live Alternative" Test (RA & Writer Joint)
  **Task:** Identify the decision point. List three alternative actions the character could have taken.
  1.  **RA Search:** Search contemporary correspondence, manuals, or parallel cases for evidence that *anyone* in that position considered these alternatives viable *at that time*.
  2.  **Classification:**
      *   **Live:** Contemporaries discussed it, planned for it, or feared it *before* the outcome.
      *   **Dead:** Logically possible today, but anachronistic or unthinkable to the period mindset.
      *   **Ghost:** An option that existed but was explicitly ruled out by the character for a documented reason.

  **Pass Condition:** The path taken in the novel must compete with at least one **Live** alternative that had a non-zero probability of success in the eyes of the characters.
  **Stop/Rewrite:** If the only alternatives are **Dead**. This indicates **Foreknowledge Leakage**. You are offering modern choices to historical actors.
  **Writer Judgment:** You may invent a specific choice, but its *category* must be Live.

  #### Step 3: Motive Provenance (Writer Led, FC Verified)
  **Task:** Interrogate the "Why."
  1.  State the character's motive for the key action.
  2.  Ask: Did I infer this motive because the action happened? (e.g., "He defected, therefore he must have been disgruntled.")
  3.  **FC Check:** Is this motive consistent with period psychology and social structures? (e.g., Would a lieutenant defect for a childhood grievance, or for pay/politics/religion?)

  **Pass Condition:** The motive is consistent with period norms even if the specific instance is invented.
  **Stop/Rewrite:** If the motive exists solely to explain the action and has no parallel in contemporary behavior. This is **Retrofitted Motive**.
  **Writer Judgment:** You may keep the motive if it serves the theme, but you must acknowledge it as speculation, not historical recovery.

  #### Step 4: The Causal Weight Check (Writer Led)
  **Task:** Measure the event against the outcome.
  1.  If this event were removed, would the failure still happen?
  2.  If the answer is "Yes," this event is *atmospheric*, not *causal*.
  3.  If the answer is "No," verify with the FC that this causal link is historically defensible, not just narratively convenient.

  **Pass Condition:** You acknowledge the difference between *trigger* and *condition*.
  **Stop/Rewrite:** If you are treating an atmospheric event as a causal hinge to simplify the narrative. This is **Narrative Fallacy**.

  ---

  ### Part II: Application to Your Subplots

  I have run the Audit on the three subplots you provided.

  #### 1. The Purser's Embezzlement
  *   **Audit Step 1 (Provenance):** The RA will likely flag that the embezzlement is recorded *because* it was discovered during the post-mortem. Pre-failure logs likely show discrepancies, but not "theft."
  *   **Audit Step 4 (Causal Weight):** If the expedition failed due to weather, strategy, or supply chain collapse, did the embezzlement *cause* the failure, or did the failure *expose* the embezzlement?
  *   **Verdict:** **STOP / REWRITE.**
  *   **Reasoning:** This is a classic case of **Archival Selection**. Inquests need villains. The archive preserves the embezzlement because it explains the loss to the investors, not necessarily because it caused the loss. By making this the "main causal hinge," you are accepting the inquest's conclusion as historical fact. It turns a complex systemic failure into a morality play.
  *   **Remedy:** Keep the embezzlement, but downgrade its causal weight. Let it be a stressor that hampered a specific decision, not the engine of the catastrophe. The "villain" is not the purser; the villain is the fragility of the system that allowed the purser to matter that much.

  #### 2. The Lieutenant's Change of Allegiance
  *   **Audit Step 2 (Live Alternatives):** The RA searches for reasons officers defected in this period. Pay, promotion, religion, coercion, factionalism.
  *   **Audit Step 3 (Motive Provenance):** You supplied a "childhood grievance."
  *   **Verdict:** **CAUTION / REVISION.**
  *   **Reasoning:** This risks **Retrofitted Motive**. Unless "childhood grievance" is a known trope or documented driver for defection in this specific culture/period, it reads as a novelistic convenience to humanize a gap in the record.
  *   **Remedy:** Shift the motive to a **Live** category (e.g., unpaid wages, religious doubt, a rival's promotion) but render it through the *texture* of a personal grievance. The *category* must be historical; the *specifics* can be novelistic. If the RA finds no evidence of personal grudges driving defection in this era, you must invent a different motive or admit the motive is unknowable (which can be its own drama).

  #### 3. The Loss of the Fortified Trading Post
  *   **Audit Step 4 (Causal Weight):** You note it is "overdetermined" (small garrison, no relief, competent siege).
  *   **Audit Step 2 (Live Alternatives):** Was there *any* contemporary expectation of relief? Was there a debate on holding vs. abandoning?
  *   **Verdict:** **PASS (with conditions).**
  *   **Reasoning:** This is where **Dramatic Irony** does the heavy lifting. The reader knows it falls. The tension cannot come from *if* it falls, but from *how* they face the falling. The contingency lies not in the military outcome, but in the moral choices made during the siege.
  *   **Remedy:** Do not try to manufacture a military way out if the FC says none existed. Instead, use the **Reader Inevitability**. The tragedy is that they fight well *knowing* it is futile. The "gamble" is not survival, but honor, or saving the civilians, or delaying the enemy. Ensure the characters discuss the futility (Live Alternative: Surrender/Flight) and reject it for their own reasons.

  ---

  ### Part III: The Narrative Device (Counterfactuals/Rumors)

  You proposed dramatizing an outcome that did not occur (rumors, letters arguing the other course).

  **Audit Ruling:** **LICENSED, WITH STRICT CONDITIONS.**

  **Condition 1: The "Live" Requirement.**
  The counterfactual must be a **Live Alternative** (per Step 2). If a letter argues for a course of action that no one at the time would have considered tactically sound, it is a "Dead Alternative" and will read as authorial intrusion.
  *   *Example:* A rumor that relief is coming is valid if relief was *expected* historically. A rumor that the enemy will simply leave is invalid if the enemy's strategy was known to be total conquest.

  **Condition 2: The Source of Uncertainty.**
  The device must reflect *their* uncertainty, not *yours*.
  *   *Valid:* A character clings to a rumor because they are desperate, even if the reader knows it's false.
  *   *Invalid:* The narrative voice presents the rumor as a genuine "what if" branch that the author is exploring for fun.

  **Degeneration Point:**
  The device degenerates into manufacturing contingency when it suggests the alternative was *equally probable* to the historical outcome, when the archive shows it was not. Use the device to show **Hope**, not **Probability**. The tragedy is that they hoped for the Live Alternative that didn't happen, not that the alternative was secretly possible.

  ---

  ### Part IV: Limitations (What This Procedure Cannot Do)

  I must be plain about where this audit fails.

  1.  **It Cannot Fix "Thematic Fatalism."**
      If your theme is "Pride comes before a fall," the plot will always feel fated because the theme demands it. The Audit checks historical causality, not thematic resonance. If your theme requires inevitability, the Audit will flag it as bias, but you may choose to override the Audit for the sake of the art.

  2.  **It Cannot Solve the "Archive is a Graveyard" Problem.**
      The RA can flag post-failure documents, but sometimes *only* post-failure documents exist. The Audit will tell you "Stop," but it cannot give you the pre-failure evidence that was never written or was lost. In these cases, you must write the *absence* of evidence as part of the story (e.g., characters acting in the dark), rather than filling it with invented certainty.

  3.  **It Cannot Neutralize Reader Foreknowledge.**
      The Audit accepts reader foreknowledge as a fixed condition. It cannot make the outcome feel "surprising." It can only make the *path* feel contingent. If a reader insists on feeling that the outcome was avoidable, no procedure can satisfy them without lying about history.

  4.  **It Cannot Judge Prose Style.**
      You can pass the Audit and still write sentences that sound like "And so, inevitably, X happened." The Audit checks the structure of the plot, not the texture of the sentences. You must still vigilantly edit for teleological language (e.g., "leading to," "resulting in," "doomed to").

  ### Summary Recommendation

  Your instinct about the **Purser** is the most dangerous. The archive wants a villain; the novel should want a system. Downgrade the embezzlement from "Cause" to "Complication."

  Your instinct about the **Fort** is the most promising. Lean into the overdetermination. Let the characters see the wall closing in. That is where the "gambles" live—not in changing the ending, but in choosing how to meet it.

  Run the Audit. Accept the "Stop" on the Purser. It will hurt, but it will save the book from feeling like a lecture.
