  ### Preamble

  You know the standard protocol. This quiz contains nine variations. Do not calculate what your favorite theory says; report the credence you actually find compelling in the scenario as described. Each question offers specific numerical options plus a "no determinate answer" option. There are no trick questions, but some stipulations are delicate. Answer based on your immediate epistemic intuition, not on allegiance to a camp. The goal is to map your commitments across cases where standard labels may fracture. Honesty yields a useful profile; consistency yields a coherent one. Begin when ready.

  ***

  ### The Instrument

  **Item 1: The Two-Laboratory Case**
  The protocol is run independently in two indistinguishable laboratories (A and B). You wake in one of them. You are truthfully told that exactly one of the two coins landed Heads. What is your credence that the coin in *your* laboratory landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No determinate answer

  **Item 2: The Sampling Route**
  In the standard case, you wake. Which description best mandates your reasoning?
  A) I am a random draw from the class of all possible awakenings.
  B) I am a random draw from the class of experimental subjects.
  C) Neither class is privileged; the question is ill-posed.
  D) No determinate answer.

  **Item 3: The Duplicate Person**
  Standard protocol, except: if Tails, the second awakening is undergone by a numerically distinct person created overnight with your memories; you are not revived for the second awakening. You wake. What is your credence in Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No determinate answer

  **Item 4: The Single-Count Bet**
  At each awakening, you choose between Ticket H (pays $100 if Heads) and Ticket T (pays $100 if Tails). After the experiment, one of your actual awakenings is selected uniformly at random; only the choice made at *that* awakening is honored. Which ticket do you choose?
  A) Ticket H
  B) Ticket T
  C) Indifferent
  D) No determinate answer

  **Item 5: Heads or Tuesday**
  Standard protocol. You wake and are truthfully told: "Either the coin landed Heads or today is Tuesday." What is your credence that the coin landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No determinate answer

  **Item 6: Credence in Monday**
  Standard protocol. You wake. Without further information, what is your credence that today is Monday?
  A) 1/2
  B) 2/3
  C) 3/4
  D) No determinate answer

  **Item 7: Credence in Heads given Monday**
  Standard protocol. You wake and are truthfully told: "Today is Monday." What is your credence that the coin landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No determinate answer

  **Item 8: Asymmetric Payoffs**
  Standard protocol. You wake. You must choose one ticket to be paid after the experiment (all awakenings count for payment). Ticket H pays $100 if Heads. Ticket T pays $60 if Tails. Which do you choose?
  A) Ticket H
  B) Ticket T
  C) Indifferent
  D) No determinate answer

  **Item 9: Precision**
  Standard protocol. You wake. Is there a precise numerical credence in Heads mandated by rationality?
  A) Yes (specify value in other items)
  B) No, only an interval is mandated
  C) No, credence is undefined here
  D) No determinate answer

  ***

  ### Scoring Key

  Assign each reader to the leaf whose profile matches their answers.

  **Leaf (i): The Lewis Halfer**
  *   **Profile:** Item 7 (Heads|Mon) = 2/3. Item 6 (Mon) = 3/4. Item 1 (Two-Lab) = 1/2.
  *   **Duplicate Person (Item 3):** Answers 1/2. (Worlds are still H/T; distinct person doesn't change world count).
  *   **Two-Laboratory (Item 1):** Answers 1/2. (Treats self as random subject/experiment, not awakening).

  **Leaf (ii): The Standard Halfer**
  *   **Profile:** Item 7 (Heads|Mon) = 1/2. Item 6 (Mon) = 3/4 (implied by coherence) or Refusal. Item 1 (Two-Lab) = 1/2.
  *   **Duplicate Person (Item 3):** Answers 1/2.
  *   **Two-Laboratory (Item 1):** Answers 1/2. (Distinguished from Leaf i solely by Item 7).

  **Leaf (iii): The Centered-World Thirder**
  *   **Profile:** Item 5 (H or Tue) = 1/2. Item 6 (Mon) = 2/3. Item 1 (Two-Lab) = 1/2.
  *   **Duplicate Person (Item 3):** Answers 1/2. (Conditions on "I am Beauty"; Twin is not me).
  *   **Two-Laboratory (Item 1):** Answers 1/2. (Treats self as random subject, despite counting awakenings in standard case).

  **Leaf (iv): The SIA Thirder**
  *   **Profile:** Item 5 (H or Tue) = 1/2. Item 6 (Mon) = 2/3. Item 1 (Two-Lab) = 1/3.
  *   **Duplicate Person (Item 3):** Answers 1/3. (Counts all subject-occasions; Twin counts as a draw).
  *   **Two-Laboratory (Item 1):** Answers 1/3. (Treats self as random awakening across the multiverse of runs).

  **Leaf (v): The Reference Class Pluralist**
  *   **Profile:** Item 2 = "Neither/Ill-posed" or "Depends". Item 1 = "No determinate answer".
  *   **Duplicate Person (Item 3):** Answers "No determinate answer" or depends on stipulated class.
  *   **Two-Laboratory (Item 1):** Answers "No determinate answer". (Refuses to fix reference class without pragmatic context).

  **Leaf (vi): The Imprecise Credencer**
  *   **Profile:** Item 9 = "Interval" or "Undefined". Items 1-8 show high variance or refusal.
  *   **Duplicate Person (Item 3):** Refusal or Interval.
  *   **Two-Laboratory (Item 1):** Refusal or Interval.

  **Leaf (vii): The Pragmatist**
  *   **Profile:** Item 9 = "Undefined". Item 4 (Betting) = Determinate Choice. Item 1 = Refusal.
  *   **Duplicate Person (Item 3):** Refusal on credence, Answer on betting equivalent.
  *   **Two-Laboratory (Item 1):** Refusal on credence. (Holds credence is only defined relative to a decision problem).

  ***

  ### Diagnostics

  **Logical Space and Empty Cells**
  The nine items generate a high-dimensional space, but coherence constraints collapse it significantly.
  *   **Incoherent Cell:** Item 6 (Mon) = 1/2 combined with Item 7 (H|Mon) = 1/2. This implies P(H & Mon) = 1/4 and P(T & Mon) = 1/4. Since P(T & Tue) must be >0, probabilities sum to <1.
  *   **Incoherent Cell:** Item 5 (H or Tue) = 1/3. Given the protocol, P(H or Tue) ≥ P(H). If P(H)=1/3 (Thirder), P(H or Tue) must be 2/3. If P(H)=1/2 (Halfer), P(H or Tue) must be 3/4. 1/3 is mathematically impossible.
  *   **Unoccupied Cell:** Item 4 (Bet) = Ticket T combined with Item 1 (Two-Lab) = 1/2. A 1/2 credencer should prefer H in the Single-Count Bet (see below). This combination suggests a disconnect between stated credence and decision theory.

  **Item Discriminatory Power**
  *   **Most Discriminatory:** Item 1 (Two-Laboratory). It is the only item that cleanly separates Leaf (iii) (Centered-World Thirder) from Leaf (iv) (SIA Thirder), who otherwise agree on all standard Beauty numbers. It also separates Halfers from Pluralists (Leaf v).
  *   **Secondary:** Item 5 (Heads or Tuesday). It reverses the standard Halfer/Thirder ordering (2/3 vs 1/2), catching those who rote-learned "Halfer=1/2, Thirder=1/3" without understanding the conditionalization dynamics.

  **Mis-sorting Risks**
  *   **Leaf (vii) vs. Leaf (vi):** Both refuse credence answers. Leaf (vii) is distinguished only if they answer Item 4 (Betting) decisively. A Pragmatist who also refuses betting decisions will be mis-sorted as an Imprecise Credencer.
  *   **Leaf (i) vs. Leaf (ii):** Both are Halfers. They are distinguished solely by Item 7 (H|Mon). If a reader guesses on Item 7, a Lewis Halfer may be sorted as Standard, or vice versa.

  **Indistinguishable Pairs**
  *   **Leaf (iii) and Leaf (iv) on Standard Items:** On Items 5, 6, and 7, these leaves produce identical numerical answers (1/2, 2/3, 1/2). The instrument relies entirely on Item 1 and Item 3 to separate them. If a reader answers "No determinate answer" on Item 1, they collapse into Leaf (v).
  *   **Failure Source:** This is a failure of the *questions*, not the views. The standard Beauty protocol is insufficient to distinguish SSA-Thirders from SIA-Thirders; only cross-world cases (like Two-Lab) do so. If a reader refuses to engage with cross-world cases, the instrument cannot sort them.

  **Verdict on Item 4 (Betting)**
  The stipulation ("one awakening selected uniformly") does *not* fully restore ex ante weighting for Thirders in a 1:1 choice.
  *   **Analysis:** For a Thirder (P(H)=1/3), the expected utility of Ticket H is 1/3 * 1 * $100. The expected utility of Ticket T is 2/3 * 1/2 * $100 = 1/3 * $100. They are **Indifferent**.
  *   **Halfer:** P(H)=1/2. EU(H) = 1/2. EU(T) = 1/2 * 1/2 = 1/4. They prefer **Ticket H**.
  *   **Result:** The item successfully separates Halfers (H) from Thirders (Indifferent), but it does not make Thirders choose Tails, which might confuse readers expecting their 1/3 credence to manifest as a Tails preference.
  *   **Proposal:** To make prices track credence directly, the payoff for Tails should be halved (e.g., Ticket T pays $50). Then Thirder EU(T) = 2/3 * 1/2 * 50 = 1/6 * 50 = 1/3 * 25... wait.
  *   **Fix:** To track 1/3 credence, odds should be 2:1. If Ticket H pays $100 and Ticket T pays $50.
      *   Thirder: EU(H) = 1/3 * 100 = 33.3. EU(T) = 2/3 * 1/2 * 50 = 16.6. (Prefers H).
      *   Actually, to make them Indifferent at 1/3 credence: Payoff T must be double Payoff H *adjusted for selection*.
      *   Better Fix: Ask for a *price*. "What is the maximum you would pay for Ticket H?" vs "Ticket T?". This avoids the 1:1 choice trap.
