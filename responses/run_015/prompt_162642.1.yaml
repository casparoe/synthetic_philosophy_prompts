      *   *Contradiction in the Will:* The outcome where universal adoption leads to a payoff state the agent rationally cannot will (e.g., mutual defection is worse than mutual cooperation).
      *   *Legislating Member:* The superrational agent recognizing the symmetry.
      *   *Rationality:* Expected utility maximization subject to the logical constraint of sameness.
      *   *Other Agents:* Mirrors of the self (copies/similar reasoning).
      *   *Non-compliance:* Irrationality (in superrationality) vs. Immorality (in Kant).

  3.  **Address Stress Point 1: Payoffs vs. Form.**
      *   *Superrationality:* Depends entirely on the matrix. If $T > R > P > S$ (PD), cooperate. If payoffs change (e.g., Deadlock), defect.
      *   *Kant:* The test is formal. A false promise fails regardless of the "payoff" of lying.
      *   *Critique:* If the moral verdict flips with the numbers, the morality isn't in the *rule* (superrationality), it's in the *setup* (payoffs). This undermines the "for free" alignment claim. You still have to align the payoffs.

  4.  **Address Stress Point 2: Compliance/Thresholds.**
      *   *Superrationality:* Requires a population of superrational agents. If I face a standard rational agent (Nash), I defect. If only 50% are superrational, cooperation might not hold depending on thresholds.
      *   *Kant:* I must will the law even if *no one else* follows it. "Let justice be done though the world perish."
      *   *Critique:* Superrationality is conditional on others' reasoning types. Kant is unconditional on others' compliance. The mapping breaks on partial compliance.

  5.  **Address Stress Point 3: Partial Correlation ($\lambda$).**
      *   *Scenario:* Shared base model, different inputs/objectives. Output correlation $\lambda \in (0, 1)$.
      *   *Superrationality:* Recommendation degrades continuously as $\lambda$ drops. At some point, expected utility favors defection.
      *   *Kant:* Moral verdict is binary (Permissible/Impermissible). It doesn't become "less wrong" if others are less likely to comply.
      *   *Critique:* This shows superrationality is about *causal/logical correlation*, not *normative constraint*. The analogy suggests the "moral" force was just statistical correlation all along.

  6.  **Address Stress Point 4: Symmetry vs. Asymmetry.**
      *   *Superrationality:* Thrives on symmetry (same game, same reasoning). Asymmetric games (Ultimatum, bargaining with different utilities) are much harder/undefined for superrationality.
      *   *Kant:* Applies to all maxims, symmetric or not (e.g., duties to self, duties to superiors/subordinates).
      *   *Critique:* Superrationality covers a tiny slice of morality (symmetric coordination). It cannot ground a general moral framework.

  7.  **Address Stress Point 5: Hidden Imports (Direction of Fit).**
      *   *Import 1 ("All"):* Kant = All rational beings (persons). Superrationality = All agents with *my source code/reasoning*. This is a club of clones, not a kingdom of ends.
      *   *Import 2 (Direction of Fit):* Kant = Constraint on maximization (Deontology). Superrationality = Tool for maximization (Consequentialist/Decision theoretic).
