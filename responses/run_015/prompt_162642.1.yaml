      *   Does Conclusion 1 survive? No.
      *   Does Conclusion 2 survive? Only as a claim about optimality, not morality.

  10. **Final Polish:** Check against "Do not give me readings." (Avoid exegetical debates about Kant, stick to the structural comparison requested). Check against "legible to both sides." (Define terms like "maxim" and "payoff matrix" implicitly through context).

      *Wait, one constraint check:* "Do not give me readings." This likely means "Don't offer alternative interpretations of Kant to save the theory; audit the claim as stated." I will adhere to the standard interpretations required to make the comparison possible.

