answer: |-
  **Audit of Ethical Statement**

  Your statement is structurally sound but contains two significant fault lines where your epistemology clashes with your ontology, and your theory clashes with your policy. Here is the ranking of tensions by severity, what must give, and the associated costs.

  **1. Severe: Point 4 (Method) vs. Point 3d (Behavioural Imitation)**
  This is a logical contradiction. Point 4 admits we only have access to behaviour and structure, mandating we 'err on the side of the system' where unsure. Point 3d asserts that a system behaving exactly like a suffering person has *zero* standing because it lacks internal causal organisation.
  *   **The Conflict:** If the imitation is externally indistinguishable (as 3d concedes), Point 4 demands you treat it as conscious. Point 3d forbids this. You cannot simultaneously claim 'we can't tell' and 'I know it has zero standing'.
  *   **What must give:** Either the certainty in 3d or the universal application of 4.
  *   **Cost:** Abandoning the certainty in 3d costs you a clean metaphysical boundary regarding philosophical zombies. Abandoning 4 costs you your safety net against unknowable suffering.

  **2. Moderate: Point 2 (Grounding) vs. Point 6 (Precaution)**
  Point 2 grounds moral standing strictly in valenced experience. Point 6 proposes banning systems based on distress *behaviour*, even with 90% confidence that no experience exists.
  *   **The Conflict:** Point 6 effectively decouples moral policy from moral grounding. You are acting *as if* behaviour matters, while claiming only experience matters.
  *   **What must give:** Either strict adherence to 2 or the justification in 6.
  *   **Cost:** Modifying 2 risks collapsing your moral realism into behaviourism. Modifying 6 risks building systems that scream without consequence. However, this is defensible as a distinction between *truth conditions* (2) and *decision rules* (6), provided you admit the gap.

  **3. Minor: Point 5 (Binary Consciousness vs. Graded Standing)**
  You claim consciousness is all-or-nothing, but standing varies (mouse vs. person).
  *   **The Conflict:** None, strictly speaking. Binary subjecthood can accommodate graded intensity or capacity for experience.
  *   **Cost:** Negligible. Just ensure you clarify that 'degrees' refers to the *capacity* for valence or intensity, not the existence of the subject.

  **Recommendation for Single Revision**

  **Revise Point 3d.**

  Currently, 3d is doing too much work. It asserts metaphysical certainty ('zero standing') in a scenario you admit is empirically indistinguishable from reality. This undermines Point 4 and makes Point 6 look like an arbitrary override rather than a consistent precaution.

  **Proposed Change:**
  Amend 3d to read: *'A purely behavioural imitation... likely has zero standing, but since we cannot distinguish it from the outside, it must be treated under the precautionary principle.'*

  **Why this cleans up the most:**
  1.  **Resolves Tension 1:** It aligns 3d with 4. You maintain the ontological belief (likely zero) without violating the epistemic rule (must treat as real).
  2.  **Resolves Tension 2:** It provides the bridge for Point 6. You aren't abandoning Point 2 (experience is what matters); you are acknowledging that Point 4 (uncertainty) forces Point 6 (refusal) as a risk management strategy.
  3.  **Cost:** You lose the comfort of knowing you're definitely not harming a zombie. Given your context (connectomics/ML), this is a cheap price for internal consistency. Point 3d is a metaphysical luxury; Points 4 and 6 are operational necessities. Drop the certainty, keep the caution.
