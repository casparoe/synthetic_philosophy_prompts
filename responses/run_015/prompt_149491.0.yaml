prompt: |-
  You are a professional philosopher of physics with genuine fluency in classical and quantum statistical mechanics, and with experience supervising dissertation projects. Please think the task through carefully before writing. Begin with a short, explicit brainstorming phase in which you set out at least three different ways of sharpening my half-formed idea below, say in a sentence or two each why you set two of them aside, and only then draft the proposal itself. Work in a formal, polished register, and aim for about 1,200 words for the proposal proper, exclusive of your brainstorming note.

  Two standing constraints. First: do not produce a bibliography, do not cite particular books, papers, or authors, and do not attribute any view to a named individual. I will supply the references myself and I do not want invented ones; I want the argument to stand on its own conceptual legs, since I am applying as an independent scholar and will not have library access in the first months of the fellowship. You may of course refer to positions and arguments by description, e.g. the view that the arrow is nothing over and above an entropy gradient grounded in a low-entropy boundary condition on the early universe, or the view that the directedness of time is a primitive asymmetry not to be reduced to anything thermodynamic. Second: anything I place in single quotes below is a label I have coined myself, not a quotation from anything, so please do not attribute it to anyone.

  Now the context and the idea. I am a retired chemical physicist. My working life was in molecular spectroscopy and relaxation phenomena, and a large part of it was spent on the practical question of how a coarse-grained, experimentally accessible description emerges from an underlying microphysics whose dynamics is, to within the accuracy I ever needed, time-reversal invariant. Since retiring I have been reading philosophy of physics seriously and auditing a graduate seminar, and I am applying for a one-year independent research fellowship, hosted by an institute where I would have one philosopher of physics as a mentor and monthly seminars at which fellows present work in progress.

  Here is the half-formed idea I want turned into a proposal. The standard disagreement, as I have encountered it, is between those who reduce the direction of time to a thermodynamic gradient plus a boundary condition, and those who treat temporal directedness as primitive and independent of thermodynamics. Both sides, it seems to me, talk as if there were a single thing, the arrow, which either reduces or does not. But in my own field one never gets an entropy without first choosing a partition of the state space into macrostates: the gradient is a gradient of some coarse-grained entropy, and different choices of macrovariables give different gradients, and in principle gradients that do not agree. In practice, for the coarse-grainings available in a laboratory, they overwhelmingly agree, and we simply help ourselves to that agreement and speak of the arrow. I want to make the agreement itself the object of study. Call this 'coarse-graining relativity': the claim that there is a family of gradient-like asymmetries, one per admissible macrostate partition, and that the appearance of a single direction of time is the appearance of their coincidence.

  Two further thoughts hang off this. The first I call the 'accessibility restriction': the partitions that matter are not arbitrary mathematical partitions but those whose variables a creature embedded in the universe could in fact measure and manipulate with the resources available to it at that epoch, and my suspicion is that a structural fact about which partitions are thus accessible does more explanatory work than the boundary condition alone, and perhaps explains why the boundary condition looks less ad hoc than it is often said to look. The second is what I call the 'plateau case'. In the familiar symmetric picture, entropy increases away from a low-entropy temporal minimum in both directions, and creatures on either side call the low-entropy side their past. But suppose the minimum is not sharp: suppose there is a temporally extended region across which the relevant macro-entropy is very nearly constant, with only small fluctuations. Then locally there is no gradient to speak of. Does the direction of time there merely become weak, or does it go indeterminate, or do local fluctuations produce small, transient, mutually disagreeing arrows that flicker? What would such a region be like from the inside, given that we are supposed to explain memory, records, and causal asymmetry by appeal to the gradient? If the plateau case is coherent, then the direction of time is at best a regional matter, and I think that is a real result rather than a curiosity.

  What I need from you is a proposal document, not an essay defending the view. Please give me: (a) the question stated precisely enough that it has a determinate answer, with the plateau case and the accessibility restriction built into it rather than appended; (b) a short argument for why the existing positions leave it open, i.e. why neither the reductionist nor the primitivist has any resources for the coincidence question as I have posed it, and in particular why the coincidence has been treated as background rather than as a problem; (c) the method, month by month across twelve months, including what I would actually do, what I would present at the monthly seminars and when, and where I would need my mentor; (d) an explicit statement of why this approach rather than the obvious alternatives, which as I see them are these: proving a measure-theoretic typicality theorem about when two coarse-grainings induce the same gradient, which I suspect is either trivial or intractable and in either case does not answer the accessibility question; treating the whole thing as an empirical cosmological question about the shape of the early low-entropy state, which I cannot do without collaborators and data; or abandoning the framework and arguing directly about the causal arrow, which is the well-trodden path I am trying to avoid; (e) an account of what a successful result would look like, and of what would count as the project having failed rather than merely having produced a negative answer; and (f) an honest assessment of whether twelve months is enough, and if not, what the fallback six-month version would drop.

  Finally, and this matters to me as much as the proposal: add a short closing paragraph in which you tell me plainly which parts of my framing are confused, ill-posed, or already settled by an argument that a competent graduate student would be expected to know, and where my chemical-physics instincts are likely to lead me astray in a philosophy context. I would much rather hear that from you now than from a review panel.
