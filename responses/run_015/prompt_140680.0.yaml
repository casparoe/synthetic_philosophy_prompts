      *   **The "Weaker Argument" Problem:** If the religious reason is the *only* motivating factor, does the public reason feel like a sham? This is the "translation proviso" critique. If the public reason is too weak, is it honest?
      *   **Viability of Mark's Rule:** The "Proviso" is key. Religious reasons are welcome *if* public reasons are also provided in due course. It prevents the "polite changing of the subject" if enforced strictly (i.e., no official position without the public reason eventually).

