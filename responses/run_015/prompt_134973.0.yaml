  Good evening, everyone. For those of you who don't know me, I had the privilege of working with [Name] for several years. And looking around this room, I see we have a bit of a split audience. Half of you know [Name] as the beloved father, husband, and brother who spent decades doing "government statistics." The other half know him as the person who spent twenty-five years worrying about whether we are a random sample of all possible observers.

  Usually, at a retirement toast, you face a specific rhetorical trap. It's actually a problem [Name] spent his career thinking about.

  If I stand here and say, "He was just a random draw from the population of smart people who got lucky," I'm committing a kind of philosophical undersampling. It ignores the specific, rigorous work he put in. It treats his career as if he were just a random observer in the set of all retirees, interchangeable with anyone else. That feels unfair to the effort we all witnessed.

  But, there's the opposite risk. If I stand here and say, "The universe conspired to create him," or "He was cosmically destined to solve these problems," I'm walking straight into the trap of the Presumptuous Philosopher. For the colleagues here: we know that thought experiment. It warns us against assuming our own existence proves a grand theory about the universe. For the family: it means we shouldn't pretend he was the "Chosen One" destined for greatness without evidence. That's arrogance, and [Name] was never arrogant.

  So, how do we toast him without falling into either trap? We acknowledge that while he wasn't destined, he wasn't random either. He was a specific observer who chose to look at hard problems, and in doing so, made the reference class of "great mentors" significantly larger. He didn't just occupy space in the universe; he improved the conditions for the rest of us observing it.

  He taught us that how you frame the question matters. And I think he's applied that to this moment, too.

  For the forecasters in the room: I know he's been updating his prior on "leisure time" for a decade, and today the confidence interval finally collapsed to one hundred percent. For the rest of the family: that just means he's finally going to be home for dinner without checking his email.

  [Name], you spent twenty-five years reasoning about where we fit in the grand scheme of things. Today, we don't need a model to know where you fit. You fit right here, at the center of this room, surrounded by people who are better off because you observed us.

  To your retirement. May your future predictions be wrong only in the direction of pleasant surprises. Cheers.
