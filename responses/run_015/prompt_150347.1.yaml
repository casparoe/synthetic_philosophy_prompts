  The opposing camp treats these detectors as homologous structures only if they share structural identity, inherited from shared training dynamics rather than architectural ancestry. Here, the architecture imposes a developmental constraint, limiting which traits can emerge and forcing the optimization process to find solutions within a restricted morphological space. Sometimes, a circuit originally selected for attention mechanisms is co-opted for anomaly detection, an instance of exaptation where a trait acquires a new utility. To clarify where functional equivalence fails to imply shared mechanism, we introduce a sharp non-standard distinction: mechanism-level homoplasy versus developmental pathway conservation. Mechanism-level homoplasy occurs when the trait performs the same function but arises via different structural configurations within the phenotype, indicating independent evolutionary solutions to the same problem. Developmental pathway conservation exists when the underlying rules of growth—the optimization algorithm itself—remain invariant, even if the resulting morphology differs. The debate hinges on whether the shared optimization logic constitutes a sufficient lineage to claim homology, or if the architectural divergence forces a classification of analogy. Proponents of deep homology suggest that despite architectural differences, the shared genetic toolkit of the optimization routine implies a common ancestral logic, rendering the detectors homologous at a regulatory level even if their morphological expression diverges. This distinction isolates whether the identity of the mechanism lies in its final form or in the conserved rules that generated it.

  2. Clean Translations

  The distinctions regarding structural identity versus functional equivalence survive translation intact because evo-devo is fundamentally concerned with decoupling phenotype from genotype. The biological vocabulary captures the ML debate without distortion because homology and analogy are precisely defined by ancestry and function, respectively. Deep homology maps cleanly onto the shared optimization algorithms that govern model training, acting as the conserved genetic toolkit beneath divergent architectures. Developmental constraint accurately reflects how architecture limits the space of possible circuits. Because the ML debate is ultimately about whether a mechanism is defined by its outcome or its construction, the biological framework provides a ready-made ontology for distinguishing these categories. The tension between convergent evolution and shared lineage is the exact tension present in interpretability research. This separation of trait history from current utility allows mechanism identity to rest on origin rather than performance. Consequently, the framework validates the core philosophical conflict.

  3. The Residue: Breaks and Silences

  Several parts of the ML debate have no expression in evo-devo vocabulary. First, gradient descent is a directed, deterministic optimization process occurring within a single lifetime, lacking the blind variation and multi-generational time-scales of natural selection. Second, models lack true phylogenetic continuity; they are often created de novo rather than descended from parents, breaking the lineage requirement for strict homology. Third, direct weight copying allows structural traits to be transferred instantly across architectures, a form of cloning impossible in biological evolution. These gaps expose an unexamined assumption in the mechanistic debate: that circuits are stable natural kinds akin to biological organs. In biology, organs are stabilized by generations of selection; in ML, they are ephemeral artifacts of optimization. The biological framework cannot capture the Lamarckian speed at which these traits are acquired or the ability to copy phenotypic states directly. This suggests the mechanistic debate assumes a stability in artificial mechanisms that does not exist, treating transient optimization outcomes as if they were evolved traits with deep historical roots. Consequently, the lack of genuine generational inheritance means that claims of homology are metaphorical rather than literal. The biological vocabulary struggles to represent the intentional design of the architecture itself, which acts as a pre-selected constraint rather than an evolved limitation.

  4. Assessment of the Residue

  The translation suggests that mechanistic anomaly detection is missing a distinction analogous to deep homology. The intuition that this is a problem about functional equivalence under different developmental histories maps cleanly onto evolutionary reasoning, provided one accepts the optimization algorithm as the genetic toolkit. However, the biological vocabulary imports misleading commitments regarding phylogenetic continuity. Treating training runs as ontogeny works, but treating model families as clades obscures how artificial mechanisms are constructed through direct engineering rather than descent. The concept of developmental pathway conservation is more accurate than homology here, as it acknowledges shared rules without implying false lineage. Ultimately, the biological framework validates the intuition but warns against reifying artificial circuits as natural kinds. Insisting on strict homology causes collapse, but adopting deep homology and pathway conservation ensures the translation holds.
