prompt: |-
  I co-host a tiny, very informal podcast — me and a friend, both software engineers, zero philosophy background — and the format is roughly "read one paper, then talk to someone who actually understands it." Next week's guest is a philosopher who works on the wrong kind of reasons problem. Here's my probably-garbled read of her view, from the one papre of hers I could get through plus a couple of email exchanges, and it's definately the kind of thing she'll correct me on in the first five minutes: she thinks a reason for an attitude is never just a reason, it's always a reason relative to whatever standard of correctness that attitude has. So the famous demon case — someone offers you a pile of money to admire them, and there's clearly a reason to admire them in some sense, but not the kind of reason that would make them admirable — isn't a puzzle you solve by drawing a line between two kinds of reason. It's a symptom: the fitting-attitude / buck-passing style analysis of value was trying to define value in terms of a single univocal relation, something like reason-to-favour, that doesn't exist. Her positive move is to rebuild the account on fittingness instead, with reasons fragmenting by attitude type.

  She's fast, she's very good, and she has one habit I want to plan around: whenever a case gets hard, she re-describes it so that the problematic reason turns out to be a reason to get yourself into the attitude, or a reason for some action, or a reason to bring it about that you have it, and then concludes that it was never a reason for the attitude at all.

  Draft me eight to ten questions that press on the view rather than having her restate it. Here's what I think is load-bearing, but argue me out of it if I'm wrong:

  - One on what actually gets lost if reason-for fragments by attitude type. I expect her to say nothing is lost, that we never needed the unified thing. The follow-up I want is the one that makes her deal with cross-attitude comparisons — you have more reason to believe p than to want q, that sort of thing — and with the thought that every reason is a reason for something. If that goes, what's left of the unity of normativity, and is she happy paying that price?
  - One on whether the fragmentation has a principled stopping point, or whether it just spawns a new kind for every attitude with a slightly different correctness standard. I want her to say what makes two standards the same standard.
  - One built out of my actual day job. I work on ML tooling, and there's a structural wrinkle I keep hitting: for some attitudes, having the attitude causally changes the object. Trusting a model and giving it feedback on the strength of that trust literally makes it more trustworthy. Being loyal to a friend partly constitutes the friendship you're loyal to. So a reason that looks purely state-given — you'll get better outcomes if you trust — feeds back into the object and starts looking object-given. Ask her whether her account has anything to say here, and specifically whether the right/wrong kind distinction was ever really about causal direction at all, or whether the looping cases are a corner she can cordon off. Follow-up: what if the feedback loop is the normal case rather than the exception?
  - One on whether the same problem has an analogue for action rather than attitude. If being paid to do something is a reason to do it but not the right kind, then any buck-passing story about rightness inherits its own wrong-kind problem, and I want to know whether her view predicts that or has to treat action as special.
  - One on the messy middle: considerations that are partly one kind and partly the other, and attitudes whose object is thin or basically missing — generalized anxiety, hope that isn't hope that anything in particular, finding something meaningful. Does the machinery still run, or does it only work for attitudes with a clean propositional object?
  - At least two questions constructed so that her favourite re-describing move is closed off in advance, and one that hands her the move, lets her use it, and then turns her own commitment against her.
  - One where the answer might actually change what I build: if you were specifying a system that forms attitudes in response to considerations, and you wanted it to track only the right kind, what would you even be trying to specify, on her view? Is that a well-posed design problem in her terms, or does she think the whole framing is confused?
  - A closer on what would count against her: what would she have to become convinced of — say, that pragmatic considerations really are reasons for belief in the full-blooded sense, not just reasons to get yourself to believe — to give the view up?

  For each question give me the question itself, a line or two on why it's there and what the strongest version of her answer probably looks like, and the follow-up I should have queued up. Assume she'll answer the steelmanned version, and that it's fair game to push on any distinction she hasn't actually cashed out.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** A tiny, informal podcast hosted by two software engineers (no philosophy background).
      *   **Guest:** A philosopher specializing in the "wrong kind of reasons" (WKR) problem.
      *   **Guest's View (as understood by host):** Reasons for attitudes are relative to standards of correctness for that attitude. The WKR problem (e.g., the demon case) shows that "reason-to-favour" isn't univocal. We should rebuild on *fittingness*, with reasons fragmenting by attitude type.
      *   **Guest's Habit:** When cases get hard, she re-describes the reason as a reason to *get* the attitude (or act), not a reason *for* the attitude, thereby dissolving the counterexample.
      *   **Task:** Draft 8-10 questions that press on the view, prevent restatement, and cover specific load-bearing topics provided by the user.
      *   **Format:** For each question: The Question, Rationale/Expected Answer, Follow-up.
      *   **Tone:** Informal but sharp, acknowledging the host's background (SE/ML) while engaging deeply with the philosophy.

  2.  **Deconstruct the Guest's View & Habits:**
      *   *Core Claim:* Normativity is fragmented. Reasons are attitude-specific (relative to correctness standards).
      *   *Strategy:* Dissolve WKR cases by re-classifying pragmatic reasons as reasons for *actions* (to induce attitude) rather than reasons *for the attitude*.
      *   *Vulnerability:* This strategy relies on a clear distinction between "reason for attitude" and "reason to induce attitude." If that distinction blurs, the view struggles. Also, fragmentation risks losing the unity of normativity.

  3.  **Review the User's Load-Bearing Points:**
      1.  *Loss of Unity:* What is lost by fragmentation? Cross-attitude comparison?
      2.  *Principled Stopping Point:* When do standards split?
      3.  *ML/Feedback Loops:* Causal loops where attitude changes object (trust/loyalty). Is WKR about causal direction?
      4.  *Action Analogue:* Does WKR apply to actions too? (Reason to do vs. Right kind of reason to do).
      5.  *Messy Middle:* Mixed reasons, non-propositional attitudes (anxiety, hope).
      6.  *Blocking the Re-description:* Two questions blocking the move, one using the move against her.
      7.  *Engineering Implication:* Specifying a system to track "right kind" reasons.
      8.  *Falsification:* What would change her mind?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Unity/Fragmentation):* Needs to hit the "what's left of normativity" point.
          *   *Draft:* If reasons fragment, can I compare reasons across attitudes?
          *   *Refinement:* Make it about weighing. If I have a reason to believe and a reason to desire, can I weigh them? If not, is normativity just a bag of tricks?
          *   *Follow-up:* If she says "no comparison needed," push on rational conflict (believing p vs wanting not-p).

      *   *Question 2 (Stopping Point):* Needs to address individuation of attitudes/standards.
          *   *Draft:* How many kinds of reasons are there?
          *   *Refinement:* Is it one kind per attitude verb? What about subtle differences (fear vs. dread)? When does a standard split?
          *   *Follow-up:* If it's vague, isn't the theory just describing the data rather than explaining it?

      *   *Question 3 (ML/Feedback):* This is the host's unique angle.
          *   *Draft:* In ML, trust makes the model better. So pragmatic reasons become object-given.
          *   *Refinement:* Focus on the *constitutive* vs. *causal* loop. If trusting makes the object trustworthy, the "state-given" reason looks "object-given." Does your view collapse here?
          *   *Follow-up:* If loops are normal, is the WKR distinction just a temporary stable state?

      *   *Question 4 (Action Analogue):* Does WKR apply to action?
          *   *Draft:* Is there a wrong kind of reason for action?
          *   *Refinement:* If I pay you to phi, is that a reason to phi? If yes, does buck-passing about value fail for actions too? If no, why are actions special?
          *   *Follow-up:* If actions have WKRs, does fragmentation go all the way down to individual action types?

      *   *Question 5 (Messy Middle):* Non-propositional attitudes.
          *   *Draft:* What about anxiety?
          *   *Refinement:* Generalized anxiety or hope without an object. What is the "standard of correctness" there? If there's no object, what makes a reason the "right kind"?
          *   *Follow-up:* If the machinery breaks for non-propositional attitudes, is fittingness too narrow?

      *   *Question 6 (Blocking Re-description 1):* Prevent the "reason to induce" move.
          *   *Draft:* Don't say it's a reason to induce.
          *   *Refinement:* Use a case where inducing is impossible or irrelevant. Sub-doxastic states or immediate reactions.
          *   *Follow-up:* If you can't act to get the attitude, where does the reason go?

      *   *Question 7 (Blocking Re-description 2):* Another block.
          *   *Draft:* What if you already have the attitude?
          *   *Refinement:* Sustaining an attitude vs. forming it. A reason to *keep* admiring the demon.
          *   *Follow-up:* Is sustaining different from forming? If not, why?

      *   *Question 8 (Using the Move Against Her):* Let her re-describe, then trap her.
          *   *Draft:* Okay, say it's a reason to act. Then what?
          *   *Refinement:* If the reason is to *act* to get the attitude, isn't that just a practical reason? If so, haven't you just reduced theoretical normativity to practical normativity?
          *   *Follow-up:* Does this make belief just another action?

      *   *Question 9 (Engineering/Design):* The "what do I build" question.
          *   *Draft:* How do I code this?
          *   *Refinement:* If I want an AI to only respond to right-kind reasons, what is the target variable? Is "fittingness" computable or definable without circularity?
          *   *Follow-up:* If it's not well-posed, should engineers stop trying to align "reasons"?

      *   *Question 10 (Falsification):* The closer.
          *   *Draft:* What changes your mind?
          *   *Refinement:* Specific empirical or conceptual discovery. Pragmatic encroachment?
          *   *Follow-up:* Is the view unfalsifiable?

  5.  **Review and Refine:**
      *   *Check against constraints:* 8-10 questions? Yes. Specific topics covered? Yes. Format correct? Yes.
      *   *Tone Check:* Ensure it sounds like a smart SE talking to a philosopher, not a philosopher talking to a philosopher. Use terms like "load-bearing," "specifying a system," "edge cases."
      *   *Specific Focus:* Ensure the "re-description habit" is explicitly addressed in the strategy notes.
      *   *Self-Correction on Q3 (ML):* Make sure the distinction between causal and constitutive is clear, as that's where the philosophical meat is.
      *   *Self-Correction on Q6/7 (Blocking):* Ensure these are distinct. One on *immediacy* (no time to act), one on *sustaining* (already have it).

  6.  **Final Polish:** Check the "Expected Answer" and "Follow-up" sections to ensure they anticipate the guest's likely defenses (steelmanning) while providing a sharp edge for the host to push back. (e.g., anticipating she will say "normativity isn't unified" and pushing on "then why do we feel conflict?").

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here are ten questions designed to press the view without letting her retreat into definitions. They are ordered to build momentum, starting with the structural costs of her view, moving through your specific ML angle, trapping her re-description habit, and ending with falsification.

  ### 1. The Cost of Fragmentation
  **Question:** "You're arguing that 'reason' fragments by attitude type because there's no univocal 'reason-to-favour.' I can accept that. But normativity feels unified to the agent—I feel a conflict between what I have reason to believe and what I have reason to desire. If reasons are relative to distinct standards of correctness, how do you weigh them against each other? Do I ever have *more* reason overall to believe *p* than to want *q*, or does the unity of normativity just disappear?"

  *   **Why it's there:** This hits your first load-bearing point. It forces her to admit whether "normativity" is just a homonym for a bunch of unrelated relations.
  *   **Expected Answer:** She'll likely say there is no global weighing. Conflicts are just clashes of systems, like a syntax error vs. a runtime error.
  *   **Follow-up:** "If there's no global weighing, then rational conflict is an illusion. But when I believe *p* and want *not-p*, I feel a pull to resolve it. If your view says that pull is category confusion, aren't you explaining away the very phenomenon—rational agency—you're trying to account for?"

  ### 2. The Individuation Problem
  **Question:** "If reasons fragment by the standard of correctness for the attitude, where does the splitting stop? Is there a different kind of reason for 'fear' vs. 'dread'? For 'hope' vs. 'optimism'? What makes two attitudes share a *single* standard of correctness rather than spawning their own reason-type?"

  *   **Why it's there:** This addresses your second point on principled stopping points. If every nuance gets a new reason-type, the theory loses predictive power.
  *   **Expected Answer:** She will argue for clusters. Attitudes with the same "direction of fit" or same correctness conditions (e.g., truth for belief) share a standard.
  *   **Follow-up:** "But correctness conditions are often debated. If the standard of correctness for 'trust' is partly constituted by the trust itself, does that mean 'trust' gets its own unique reason-type? If so, isn't the taxonomy just following the intuitions it's supposed to explain?"

  ### 3. The Feedback Loop (Your ML Angle)
  **Question:** "In my work, I see cases where holding the attitude changes the object. If I trust a model and tune it based on that trust, it becomes more trustworthy. If I'm loyal to a friend, that loyalty partly constitutes the friendship. Here, a 'state-given' reason (outcomes improve if I trust) feeds back into the object and becomes 'object-given.' Does your distinction survive causal loops, or does the Right/Wrong Kind distinction collapse when the attitude is part of the correctness condition?"

  *   **Why it's there:** This uses your domain expertise to challenge the static nature of "object-given" vs. "state-given." It suggests the distinction might be temporal, not structural.
  *   **Expected Answer:** She may try to cordon this off as a special "constitutive" case or argue the reason is still for the *action* of tuning, not the attitude.
  *   **Follow-up:** "If these loops are the normal case for social attitudes and adaptive systems, and not the exception, then the 'pure' object-given reason is a theoretical fiction. Are you building a theory for a world where agents don't affect their objects?"

  ### 4. The Action Analogue
  **Question:** "Does this problem apply to action? If a demon threatens me unless I phi, I have a reason to phi, but it feels like the 'wrong kind' of reason for the action being *right*. If your fragmentation view holds, do we need to fragment reasons for action too? Or is action the one place where 'reason' stays univocal?"

  *   **Why it's there:** Tests the scope of her view. If actions don't have WKRs, why not? If they do, buck-passing accounts of value are in trouble everywhere.
  *   **Expected Answer:** She will likely say actions don't have WKRs in the same way because actions don't have "correctness conditions" like attitudes do; they have success conditions.
  *   **Follow-up:** "But if I phi solely for the money, we call that instrumental, not 'right.' If you treat action as special because it lacks a 'standard of correctness,' aren't you just defining the problem away for actions to save the theory for attitudes?"

  ### 5. The Messy Middle (Non-Propositional Attitudes)
  **Question:** "Your view relies on standards of correctness. But what about attitudes without clear objects? Generalized anxiety. A vague sense of meaning. Hope that isn't 'hope that *p*.' If there's no propositional object to be correct *about*, what is the standard of correctness? Do these attitudes have no 'right kind' of reasons, or does your machinery break down there?"

  *   **Why it's there:** Presses the "messy middle." Fittingness accounts often struggle with non-propositional states.
  *   **Expected Answer:** She might argue these are defective attitudes or that they have implicit objects (anxiety *about* safety).
  *   **Follow-up:** "If you have to add implicit objects to make the theory work, are you preserving the view by making it unfalsifiable? What if the phenomenology is genuinely objectless?"

  ### 6. Blocking the Re-Description (Immediacy)
  **Question:** "I know you often argue that pragmatic reasons are reasons to *get* yourself to have an attitude, not reasons *for* it. But consider immediate, reflexive attitudes—a flinch of disgust, a snap of admiration. There's no time for an intervening action to 'get yourself' into the state. In those cases, isn't the pragmatic reason forcing itself into the attitude slot whether you like it or not?"

  *   **Why it's there:** This closes off her favorite move. You can't intend to induce a reflex.
  *   **Expected Answer:** She might say reflexive attitudes aren't the kind of thing that take reasons at all (sub-personal).
  *   **Follow-up:** "But if I can be criticized for a snap judgment ('you shouldn't be disgusted by that'), it's taking reasons. If it takes reasons, and I can't act to get there, where does the pragmatic reason go? It seems it has to be a reason for the attitude itself."

  ### 7. Blocking the Re-Description (Sustaining)
  **Question:** "Let's grant your move for *forming* an attitude. You say the money is a reason to *bring about* the admiration. But what about *sustaining* it? Once I already admire the demon, the money is a reason to *keep* admiring. That's not an action to induce a state; I'm already in the state. Is a reason to sustain an attitude a different kind of beast than a reason to form it?"

  *   **Why it's there:** Another block. Sustaining is often passive. It forces her to distinguish formation vs. maintenance, which complicates the "reason to act" defense.
  *   **Expected Answer:** She may claim sustaining is an active process of not-revising, which is an action.
  *   **Follow-up:** "That makes 'not changing your mind' an action. If that's true, doesn't 'action' become so broad it swallows 'attitude' whole? At that point, haven't you just reduced all normativity to practical normativity?"

  ### 8. Turning the Move Against Her
  **Question:** "Okay, let's play that card. Let's say the demon's money is strictly a reason to *act* to induce admiration, not a reason for admiration. If that's the case, then the normativity of belief/attitude is entirely subordinate to the normativity of action. Doesn't that collapse the distinction you're trying to save? If all 'wrong kind' reasons are just practical reasons, isn't theoretical reason just a subset of practical reason?"

  *   **Why it's there:** This uses her move to force a reductionist conclusion she might not want. If she dissolves WKRs into practical reasons, she risks eliminating theoretical normativity.
  *   **Expected Answer:** She will likely resist the collapse, arguing practical reasons govern the *causes* of attitudes, but not the attitudes themselves.
  *   **Follow-up:** "But if the only leverage we have on our attitudes is practical (acting to cause them), and the 'theoretical' reasons are just the ones that fit the standard, aren't you admitting that the only *effective* reasons are practical? What work is the 'fitting' reason doing if it can't compete with the practical one?"

  ### 9. The Engineering Specification
  **Question:** "I want to build a system that forms attitudes based only on the 'right kind' of reasons. On your view, what am I specifying? If I tell you 'filter out state-given reasons,' and you say 'those are actually reasons for action,' do I have a well-posed design problem? Or is 'track the right kind of reason' a confused request, like asking for a 'round square'?"

  *   **Why it's there:** Connects directly to your work. It asks if her theory offers a functional definition or just a philosophical classification.
  *   **Expected Answer:** She might say it's well-posed: specify the correctness condition (e.g., truth) and filter for inputs that bear on that.
  *   **Follow-up:** "But in a neural net, the 'input that bears on truth' and the 'input that optimizes the loss function' (the pragmatic payoff) are mathematically identical during training. If the math doesn't distinguish them, is your distinction implementable, or is it purely interpretive?"

  ### 10. The Closer (Falsification)
  **Question:** "Finally, what would count against this view? If pragmatic considerations turned out to be reasons for belief in the full-blooded sense—not just reasons to act, but reasons that make the belief correct—would you abandon the fragmentation view? Or is the view structured so that any such case would just be re-described as a reason for action?"

  *   **Why it's there:** Tests the scientific/philosophical robustness. A view that can't be wrong isn't useful.
  *   **Expected Answer:** She might say if pragmatic factors affected *truth* directly (pragmatic encroachment), she'd have to adjust.
  *   **Follow-up:** "So the view stands or falls on the 'truth/connection to object' being hermetically sealed from practical outcomes? Given the feedback loops we discussed earlier, that seems like a risky bet. Is it a bet you're willing to lose?"
