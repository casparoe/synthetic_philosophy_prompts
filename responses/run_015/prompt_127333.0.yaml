answer: |-
  Dear Student,

  It is a pleasure to engage with you on this profound intersection of metaphysics and clinical neuropsychology. To properly assess Daniel Dennett's proposition that the self is a center of narrative gravity, we must first rigorously articulate the theoretical commitments underpinning this view before subjecting them to the stress test provided by cases of severe amnesia. Dennett's naturalism demands that we abandon the Cartesian theater, the idea that there is a little person inside the head watching experiences unfold. Instead, he proposes that the self is an abstraction, akin to the center of gravity of a physical object. Just as the center of gravity is a real and useful theoretical posit that helps us predict how an object will behave, yet is not itself a physical part of the object, the self is a fictional anchor point that organizes the multitude of competing drafts of experience into a coherent story. The core commitment here is that selfhood is not a substance but a function of narration. It relies on the continuous weaving of disparate sensory inputs, memories, and intentions into a unified autobiographical timeline. Without this weaving, without the ongoing revision and updating of the story of me, there is no center to hold the experiences together. Consequently, personal identity is not found in a mental substrate or a soul but in the continuity of the narrative itself. If the narrative breaks, the self, in the meaningful sense of a person persisting through time, fragments or dissolves. This view prioritizes the linguistic and conceptual organization of experience over the raw phenomenology or the biological continuity of the organism. It suggests that to be a self is to be the protagonist of a story that is being told, primarily to oneself but also to others, and that this storytelling must be dynamic, updating the present moment against the backdrop of the past to project a future.

  When we bring this framework to bear on the tragic and illuminating case of Clive Wearing, we are presented with a scenario that seems designed to challenge the necessity of narrative continuity. Wearing, a distinguished musician and musicologist, suffered viral encephalitis in nineteen eighty-five which devastated his hippocampus and surrounding medial temporal lobes. The clinical result was a profound anterograde amnesia, meaning he could not form new episodic memories, and a severe retrograde amnesia, wiping out most of his past autobiographical history. His subjective experience is often described as a perpetual waking; he frequently writes in his diary that he has just woken up for the first time, only to cross it out and write it again moments later. Yet, amidst this cognitive devastation, he retained his ability to play the piano and conduct a choir with immense skill, and he maintained a deep, visceral emotional bond with his wife, Deborah. He recognizes her not through factual recall but through an surge of affection, often greeting her as if she has been absent for years even if she has only left the room for minutes. In mapping Dennett's center of narrative gravity onto Wearing's condition, we must ask precisely what constitutes the center in his situation. If the self is the point around which the autobiography coheres, Wearing appears to lack a self, because he lacks an autobiography that extends beyond the immediate present. There is no updating of the life story because there is no retention of the previous chapters. According to a strict reading of the narrative gravity model, Wearing should be a mere organism, a collection of reactive systems without a subject. However, the clinical reality is more nuanced. Wearing speaks, he expresses despair about his condition, he loves, and he performs complex temporal tasks like music.

  The narrative gravity model explains certain features of Wearing's condition with remarkable precision, particularly the fragmentation of his personal identity over time. The theory predicts that without the ability to link the present moment to the past, the sense of being a persisting entity should collapse. Wearing's repeated exclamations of having just woken up confirm that the narrative thread has been severed. He cannot situate himself in a timeline, so every moment is an isolated island. This supports Dennett's claim that the robust sense of selfhood we typically enjoy is dependent on the successful integration of memory into a story. Furthermore, the model accounts for the specific nature of his interaction with Deborah. Because he cannot update the narrative of their relationship with recent events, his brain defaults to a static, archaic version of the story where she is a long-lost loved one returning. The emotional intensity is a residue of a narrative that can no longer be revised. In this sense, the theory succeeds in diagnosing the loss of the autobiographical self. The center of gravity has not disappeared entirely, but it has become unmoored from temporal progression, leaving Wearing stuck in a recursive loop of the same emotional chapter. The theory correctly identifies that the loss of narrative updating results in the loss of the diachronic self, the self that travels through time.

  However, the case of Clive Wearing also exposes significant limitations in the narrative gravity model, particularly regarding the preservation of skilled musicianship and the persistence of a minimal, embodied sense of agency. Wearing can sit at a piano and perform complex pieces, navigating the temporal structure of the music despite having no memory of the notes he played seconds ago. This suggests that there is a form of self-organization that operates independently of autobiographical narrative. Music unfolds over time, requiring a integration of past notes, present execution, and anticipation of future notes, yet Wearing achieves this without a conscious story of himself doing so. If the self is strictly a center of narrative gravity, it is difficult to explain who or what is playing the piano. Dennett might argue that this is merely sub-personal machinery, a set of procedural routines that do not require a self. But Wearing experiences pride and frustration during these performances; he recognizes the music as his own output. This points to a minimal self, a pre-reflective sense of ownership over one's actions and body, which persists even when the autobiographical narrative is destroyed. The narrative model struggles to accommodate this because it tends to conflate the self with the story told about the self. Wearing demonstrates that one can be an agent, a lover, and a musician without being a narrator. The theory risks misdescribing this clinical reality by implying that because the story is broken, the subject is gone, whereas Wearing's suffering indicates that a subject remains to feel the loss.

  Furthermore, the theory remains silent on the mechanism of the emotional bond with Deborah. Dennett's framework is heavily linguistic and conceptual, focusing on the web of sentences that constitute the self. Yet Wearing's love for his wife is affective and embodied, surviving the destruction of the semantic and episodic knowledge that would normally support such a narrative. The narrative gravity model does not have a clear category for this kind of non-representational continuity. It cannot easily explain how the center of gravity holds firm in the emotional realm while dissolving in the cognitive realm. If the self is a fiction generated by language and memory, Wearing's enduring emotional core suggests that there are deeper, perhaps evolutionary older, structures of selfhood that are not dependent on the higher-order narrative functions. This does not necessarily refute Dennett, but it forces a refinement of the theory. It suggests that we must distinguish between the autobiographical self, which is indeed a center of narrative gravity, and the minimal self, which is a center of embodied agency. Wearing confirms that narrative coherence is necessary for the full, rich sense of personal identity that allows us to plan lives and understand ourselves as historical beings. However, he also shows that Dennett's model, if taken as a complete account of selfhood, neglects the contribution of non-representational, embodied capacities that sustain a basic sense of presence and agency even when autobiography fails.

  In conclusion, the case of Clive Wearing serves as a crucial boundary marker for the narrative gravity theory. It validates the claim that the sophisticated, diachronic self is a construct dependent on memory and narration, as evidenced by Wearing's inability to perceive his own continuity. Yet it simultaneously challenges the reductionist impulse to equate the self solely with that narrative. The center of gravity in Wearing's situation is not a single point but a fractured landscape. There is the broken narrative center that fails to update, causing his perpetual awakening, and there is a resilient, embodied center that persists in his music and his love. A disciplined application of Dennett's view must acknowledge that while the narrative self is a fiction, it is a fiction built upon a real, biological substrate of agency and affect that can survive the collapse of the story. Wearing teaches us that the self is not merely the story we tell, but also the capacity to act and feel that makes the telling possible. Therefore, the theory succeeds in explaining the loss of identity over time but requires expansion to account for the persistence of identity in the moment. It reveals that while narrative may be the glue of personal identity, it is not the sole constituent of selfhood, and any complete philosophy of mind must make room for the silent, skilled, and emotional self that remains when the story stops.

  I hope this analysis helps you navigate the complexities of your seminar discussions. Please feel free to reach out if you wish to delve deeper into the distinctions between minimal and autobiographical selfhood.

  Warmly,

  Your Instructor
