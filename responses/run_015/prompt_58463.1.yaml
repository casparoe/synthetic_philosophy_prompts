      *   *Wait, re-evaluating:* The prompt asks to view it through "expected value fanaticism" regarding the "tiny sliver of a chance." So I should stick to the framing that *before* the win is secured, it looks like a tiny chance. But the "cheat" is that Strange *knows* the outcome. I need to balance the "in-universe perspective" (friends see a gamble) vs. "audience perspective" (we know he saw the future).
      *   *Key Distinction:* To the Avengers, it's a risky bet. To Strange, it's a map. The ethical tension lies in him forcing the Avengers to follow the map without showing it to them.

  6.  **Final Review against User Prompt:**
      *   *Lens:* EV Fanaticism. (Check)
