  7.  **Final Polish:** Ensure clear headings and a strong concluding thought. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: Make sure to mention *Pascal's Mugging* specifically as it's the classic EV fanaticism case. Also, distinguish between "risk neutrality" (EV maximization) and "risk aversion." Strange acts as a risk-neutral agent regarding the fate of the universe, which is arguably required when stakes are existential.

