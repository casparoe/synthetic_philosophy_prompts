answer: |-
  ### (1) Role, Constraints, and Scope

  The committee acts not as an agent of current expressed will, but as a trustee for the university's intergenerational integrity. Your scope is limited to binding commitments exceeding ten years: infrastructure contracts, endowment policies, and core curricula. The normative standard is Extrapolated Volition (EV): approving only what stakeholders would endorse under full information, cognitive coherence, and reflective equilibrium. You are constrained from paternalism; you cannot substitute committee values for stakeholder values. However, you must distinguish between transient preferences and stable values. This procedure acknowledges epistemic limits: you cannot predict future technological or social shifts perfectly. Your mandate is to minimize regret for future stakeholders who cannot vote today. If the procedure cannot resolve ambiguity without imposing values, you must return "do not decide."

  ### (2) The Procedure: Steps, Tests, and Stopping Rules

  **Step 1: Stakeholder Mapping.** Identify current students, faculty, and staff. **[JUDGMENT]** Define proxies for future students (e.g., alumni boards, demographic trends). Do not exclude minority voices; weight by affected interest, not population size.

  **Step 2: Preference Elicitation.** Gather raw data via surveys and town halls. Record intensity, not just direction.

  **Step 3: Coherence Testing.** Analyze raw preferences for logical consistency.
  *   *Transitivity:* If A > B and B > C, does A > C hold?
  *   *Framing Independence:* Do preferences flip when costs/benefits are described differently?
  *   *Time-Consistency:* Do short-term desires contradict long-term goals expressed by the same group?
  Failures here trigger a return to Step 2 for clarification.

  **Step 4: Informational Correction.** Provide neutral, expert briefings on consequences (e.g., tuition impacts, ROI of requirements). **[JUDGMENT]** Ensure briefings describe *causal outcomes* without prescribing *value weightings*. Re-survey preferences after information uptake. This models "full information" without committee value substitution.

  **Step 5: Deliberative Synthesis.** Convene a stratified random sample of stakeholders for structured deliberation. They must reconcile conflicting coherent preferences. **[JUDGMENT]** The committee determines when deliberation has reached "reflective equilibrium" versus stalemate.

  **Step 6: Stopping Rules.** The procedure halts and returns "do not decide" if:
  *   *Divergence Threshold:* Informed preference variance exceeds 40% across stakeholder groups.
  *   *Rights Violation:* The commitment irreversibly removes future agency (e.g., banning future speech).
  *   *Value Construction:* The choice requires creating a new value rather than discovering an existing one.

  **Step 7: Final Recommendation.** Approve only if informed, coherent preferences converge on the proposal. Document all **[JUDGMENT]** calls for audit.

  ### (3) Worked Applications

  **Case 1: Thirty-Year Fossil-Fuel-Free Energy Contract.**
  Raw surveys show support for sustainability but resistance to the 2% tuition hike. Coherence testing reveals framing dependence: students accept the cost when framed as "insurance against carbon taxation" rather than "fee." Informational correction clarifies that renewable locks hedge against volatile fossil markets. Deliberative synthesis shows long-term financial stability aligns with student interest in affordable future tuition. The procedure recommends **approval**. The tuition hike is validated as a coherent trade-off for long-term cost stability and ethical alignment.

  **Case 2: Mandatory Two-Year Foreign Language Core.**
  Current students oppose this by 70%, citing cost and time. However, coherence testing reveals a contradiction: students express high value for "global competency" and "cognitive flexibility" in mission statements, yet reject the primary mechanism to achieve them. Informational briefings present data on wage premiums and cognitive benefits of bilingualism. In deliberative synthesis, stakeholders acknowledge that their immediate opposition stems from short-term workload stress, conflicting with their reflective equilibrium regarding the value of a degree. The procedure recommends **approval**.
  *Resistance:* The committee will strongly resist this. Implementing a mandate opposed by 70% of current constituents appears politically suicidal and paternalistic. However, the procedure forces this because the "expressed preference" fails the coherence test against the stakeholders' own deeper educational values. The committee must choose between political ease and fiduciary duty to the students' future selves.

  **Case 3: Endowment Divestment (Fossil + Nuclear).**
  Activists demand divestment; financial officers project reduced returns impacting future financial aid. Coherence testing shows no framing error; this is a genuine value conflict: ethical purity vs. socioeconomic accessibility. Informational correction confirms the aid reduction will disproportionately affect low-income future students. Deliberative synthesis fails to reconcile these competing goods; stakeholder groups remain polarized even under full information. The divergence threshold is exceeded. The procedure returns **"do not decide."** The committee must maintain the status quo or seek a hybrid solution, as EV cannot resolve incompatible moral orderings without imposing a specific value hierarchy.

  ### (4) Judgment Points and Hard Limits

  This procedure cannot solve fundamental value conflicts where coherence permits incompatible orderings (e.g., liberty vs. equality). It assumes values are discoverable, but some values are constructed through the decision process itself; in those cases, Step 4 risks subtle paternalism. The definition of "future proxies" in Step 1 is an unavoidable **[JUDGMENT]** call with no objective standard; excluding future generations biases toward the present, while over-weighting them risks tyranny by the unborn. Furthermore, the procedure cannot account for black-swans—radical future shifts in morality or technology that render current coherence irrelevant. Finally, if the committee ignores the "resisted recommendation" in Case 2, the procedure becomes merely decorative. Its hard limit is political will: it can identify rational commitments, but it cannot enforce them against a governance body unwilling to act as a trustee for the future.
