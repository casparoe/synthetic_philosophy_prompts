prompt: |-
  Act as a professional philosopher who also keeps up with experimental philosophy and cultural psychology. Before you write any numbers, spend a few sentences listing the sub-questions you think the answer actually depends on; if you think one of the terms I list below is the wrong thing to condition on, replace it and say why.

