  ### The Single Test Case to Settle It

  While Case 3 strongly suggests the Threshold View, a skeptic might argue Priya just thinks the difference in Case 3 was *too small* to matter (a "Sliding Scale" view). To definitively prove she is a Threshold theorist and not a secret Maximization theorist, you need to test the **size of the gap** above the threshold.

