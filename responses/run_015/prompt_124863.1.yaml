  Based on the pattern of verdicts, I can tell you exactly what principle Priya is running, what she will say about the donor egg case, and the single case that will prove it.

  ### The Principle: The Person-Affecting Threshold View

  Priya is not running an impersonal utilitarian view (Candidate 1), nor is she running a maximization view across identities (Candidate 3). She is running a **Person-Affecting Threshold View** (Candidate 2).

  Here is how her rulebook works, reconstructed from her verdicts:

  1.  **The Same-Person Rule:** If the *same* child will exist regardless of your choice, you have a duty not to make them worse off than they could reasonably have been. (This explains **Case 1**. Identity is fixed, so standard harm applies.)
  2.  **The Threshold Rule:** If a *different* child will exist depending on your choice, you do not owe them the *best* possible life. You only owe them a **Decent Minimum**. If their life will be above that line, you have not wronged them, even if an alternative child would have had a better life. (This explains **Case 3**. The life is decent, so the Non-Identity Problem holds: no complaint.)
  3.  **The Threshold Exception:** If the life you create will fall *below* the Decent Minimum, you have wronged that child, even if they wouldn't otherwise exist. The Non-Identity Problem is bypassed by the severity of the harm. (This explains **Case 2**. The life is "rough" and "below decent," so a complaint is valid.)
  4.  **The Third-Party Rule:** You must not harm existing people. (This explains **Case 4**.)

  **Why the other candidates fail:**
  *   **Candidate 1 (Impersonal Outcome):** Fails on **Case 3**. An impersonal view would say waiting two months is obligatory because it creates more wellbeing. Priya says it's "Her call."
  *   **Candidate 3 (Maximization Across Identities):** Fails on **Case 3**. If she owed the potential child the "best start measured against the kid you could have had instead," she would have been obliged to wait. Priya says she wasn't.

  ### The "Damages Only" Remark
  This is the most sophisticated part of her view. She is distinguishing between **Wrongful Life** and **Wrongful Birth**.
  *   **Wrongful Life:** Suing because "I should never have been born." Priya rejects this (even in Case 2) because it requires comparing existence to non-existence, which she likely finds incoherent.
  *   **Wrongful Birth:** Suing because "My parents burdened me with extra costs." Priya accepts this *only* when the life falls below the Threshold (Case 2).
  *   **The Principle:** Existence is never a compensable harm, but *unnecessary burdens* are compensable if they push a life below the decent minimum.

  ### Prediction for the Donor Egg Case (Case 6)

