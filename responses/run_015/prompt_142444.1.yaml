prompt: |-
  I chair the ethics advisory board of a research institute that runs behavioural-science field experiments at roughly forty sites across twenty-five countries. We clear about forty protocols a year, usually within forty-eight hours, with a two-person review team (one behavioural scientist, one regional programme lead) and my signature at the end. Most of the objections we get from local partners are moral rather than legal, and we handle them ad hoc: sometimes we localize a protocol, sometimes we insist on the home standard, sometimes we quietly drop a site, and we could not afterwards say why we did any of these.

  Please write the decision procedure my reviewers should run on every protocol, in the order they should run it. It has to be operationalized from the debate about cross-cultural variation in folk morality and what that variation does or does not show about moral objectivity. I have a two-page summary of that literature in front of me, so I do not need citations, studies, or reading recommendations; I need the reasoning made usable by reviewers with no philosophy training, no new data collection, and two days per protocol.

  Three things the procedure has to get right, and I suspect they are where the conceptual work is. First, it must sort each disagreement into more than difference of degree: separate cases where the parties agree on the principle and disagree about the nonmoral facts or about which description of the act is the salient one; cases where a shared set of considerations is simply weighted differently; and cases where one side treats something as a moral consideration the other does not recognize at all. Tell me which distinctions survive simplification and which my reviewers can safely collapse. Second, it must say who counts as a source of the local norm. Our local partners and in-country ethics reviewers are usually urban, university-trained and grant-funded, and I worry that the sampling problem our summary describes simply reappears one level down, so that deference to them can mistake a local elite's view for the local view. Third, it must include a reverse test: for any norm we are willing to relax abroad, the reviewer must record in advance what finding at another site would make us revise the home standard. If a norm cannot be given such a test, I want to know whether we are applying a principle or merely exporting one, and what the procedure should do then.

  Give me the stop rules: where it returns a no and drops the site, where it clears the protocol as localized, and where it stops and hands the decision to me because the remaining question is one of values rather than facts.

  Then run it on three protocols. One: a standard deception design in which participants are misled about how a sum of money was split, where the local partner says the debriefing will cause the participants lasting shame in a way the home site would not experience. Two: a consent procedure where the in-country reviewer asks that a household head's permission substitute for written individual consent, at two sites with quite different kinship structures. Three: payment for participation, which at one site is read as a wage and at another as a gift, with the two readings carrying opposite obligations. At least one of these should yield an answer I will not like, and I want you to say which and why. Close with an honest statement of what this procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an Ethics Advisory Board (EAB) for a research institute running behavioral science field experiments (40 sites, 25 countries, 40 protocols/year).
      *   **Current State:** 48-hour turnaround, 2-person review (scientist + regional lead), Chair signs off. Objections are moral, not legal. Decisions are ad hoc and unexplained.
      *   **Task:** Create an operationalized decision procedure for reviewers to run on every protocol.
      *   **Constraints:**
          *   Based on the debate about cross-cultural variation in folk morality and moral objectivity (no citations needed, just reasoning).
          *   Usable by reviewers with no philosophy training.
          *   No new data collection.
          *   Must fit within the 48-hour/2-day window.
          *   **Three Key Requirements:**
              1.  *Categorize Disagreements:* Distinguish between factual/descriptive disagreements, weighting disagreements, and fundamental recognition disagreements. Simplify where possible.
              2.  *Source of Norms:* Address the "elite bias" problem (local partners/reviewers might not represent the actual local population).
              3.  *Reverse Test:* For any norm relaxed abroad, specify what finding elsewhere would revise the home standard. If no test exists, identify if it's principle vs. export.
          *   **Stop Rules:** Clear, Localize, Drop, or Escalate to Chair (values vs. facts).
          *   **Test Cases:** Run the procedure on three specific protocols (Deception/Shame, Consent/Kinship, Payment/Obligation). One must yield an "unlikeable" answer.
          *   **Closing:** Honest statement of limitations.

  2.  **Deconstruct the Philosophical Underpinnings (Mental Sandbox):**
      *   *Folk Morality & Objectivity:* The core tension is between Moral Relativism (norms are culture-specific) and Moral Universalism (some norms are binding everywhere). The "variation" debate suggests that while surface norms vary, underlying principles might not, OR that variation reveals genuine pluralism.
      *   *Operationalization:* We can't solve meta-ethics in 48 hours. We need a heuristic.
      *   *Distinction 1 (Facts vs. Values):* If we agree on the principle but disagree on the outcome (e.g., "harm is bad" vs. "this causes harm"), that's factual. If we agree on facts but weigh values differently (e.g., "privacy vs. utility"), that's weighting. If one side sees a moral reason the other doesn't (e.g., "ancestral spirits"), that's recognition.
      *   *Distinction 2 (Elite Bias):* How to verify if a local partner represents the "folk"? We can't survey. We must rely on *plausibility* and *mechanism*. Does the partner explain *why* the norm exists socially, or just assert it?
      *   *Distinction 3 (Reverse Test):* This is the universality check. If we say "X is okay in Country A but not Home," we must be willing to say "If Country B showed Y, we'd change Home." If we can't imagine *any* evidence changing the Home rule, it's a dogma/export, not a principle.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Triage.* Is this legal? (Prompt says mostly moral). Is this safety? (Assume standard risk assessment is done). Focus on the moral objection.
      *   *Step 2: Categorization.* Need a simple flowchart logic.
          *   Q1: Do we agree on the goal/principle?
          *   Q2: Do we disagree on what happens (facts) or what it means (description)?
          *   Q3: Do we disagree on importance (weight)?
          *   Q4: Is the value itself alien?
      *   *Step 3: Source Verification.* How to handle the "elite partner" issue without new data?
          *   Require a "Social Mechanism Statement." Not just "they feel shame," but "shame arises because X social structure."
          *   Check for internal consistency across sites.
      *   *Step 4: The Reverse Test.* The "Universality Check."
          *   "Would we accept this modification if the roles were reversed?"
          *   "What evidence would change our home rule?"
      *   *Step 5: Stop Rules.*
          *   Clear: Factual error corrected or weight difference within tolerance.
          *   Localize: Recognition difference is valid + Reverse Test passed.
          *   Drop: Harm is undeniable + Reverse Test fails (i.e., we won't change home rule, so we can't do it there).
          *   Escalate: Genuine value conflict where the Reverse Test implies a fundamental shift in institute policy.

      *   *Refining the "Elite Bias" constraint:* This is tricky. Reviewers can't verify ethnography in 48 hours. The procedure must demand *explanatory depth*. If the partner says "It's the culture," that's a red flag. If they say "In this kinship system, individual consent undermines the head's liability," that's better.
      *   *Refining the "Reverse Test":* This needs to be concrete. "If we allow X here, we must commit to allowing X in Home if Condition Z is met."

  4.  **Developing the Test Cases:**

      *   *Case 1: Deception/Shame.*
          *   Home: Debriefing cures harm.
          *   Local: Debriefing *causes* harm (shame).
          *   Analysis: Is this factual (does shame happen?) or recognition (is shame a moral harm?). Likely factual/weighting.
          *   Reverse Test: Would we stop debriefing at home if shame were proven likely?
          *   Outcome: Localize (modify debriefing).
      *   *Case 2: Consent/Kinship.*
          *   Site A (Hierarchical): Head consent okay.
          *   Site B (Egalitarian): Head consent offensive.
          *   Analysis: Recognition/Weighting. Individual autonomy vs. Community harmony.
          *   Elite Bias: Is the reviewer just protecting the head's power?
          *   Reverse Test: Would we allow head consent in a vulnerable home community (e.g., nursing home)?
          *   Outcome: Drop Site A (if autonomy is non-negotiable) OR Localize Site B. *Need one unlikeable answer.* Let's make Site A a "Drop" because the Reverse Test fails (we wouldn't allow it at home even in hierarchical sub-cultures).
      *   *Case 3: Payment/Wage vs. Gift.*
          *   Site A: Wage (taxable, entitlement).
          *   Site B: Gift (reciprocal obligation, social debt).
          *   Analysis: Description of the act.
          *   Reverse Test: If we treat it as a gift here, would we treat home payments as gifts if context shifted?
          *   Outcome: Localize (adjust payment structure).

      *   *Selecting the "Unlikeable Answer":* The prompt asks for one answer the Chair won't like.
          *   If I suggest dropping a site (Case 2), that reduces sample size/N. Chairs hate losing sites.
          *   If I suggest changing the Home Standard (via Reverse Test), that creates policy work.
          *   Let's make Case 2 (Consent) result in a **Drop** of the hierarchical site. This is operationally painful (losing data) but ethically necessary if the Reverse Test shows the home standard (individual autonomy) is non-negotiable. Or, conversely, the Reverse Test forces a Home Standard revision which is administratively burdensome.
          *   *Better "Unlikeable":* The Reverse Test on the Deception case forces the Chair to admit the Home Standard is fragile. Or, the Consent case forces a Drop of a key site. Let's go with **Dropping the Hierarchical Consent Site**. It highlights the tension between universal rights and local norms.

  5.  **Refining the Procedure Steps (Final Polish):**
      *   Make it a checklist.
      *   Ensure the "Elite Bias" check is a specific question about *mechanism*.
      *   Ensure the "Reverse Test" is a written commitment.
      *   Clarify the "Escalation" point (Values vs. Facts).

  6.  **Writing the Response:**
      *   *Tone:* Professional, directive, operational, slightly philosophical but grounded.
      *   *Structure:*
          1.  Introduction (Purpose).
          2.  The Decision Procedure (Steps 1-5).
          3.  Stop Rules.
          4.  Application to Three Protocols.
          5.  Limitations.

      *(Self-Correction during drafting)*: I need to make sure I explicitly address the "simplification" of the philosophical distinctions. I should tell them to collapse "factual" and "descriptive" into one bucket ("Empirical Claim") and keep "Weighting" and "Recognition" separate.
      *   *Elite Bias:* I need to give them a heuristic. "The Mechanism Test." If the partner cannot describe the social cost mechanism, assume elite bias.
      *   *Reverse Test:* Make it a specific form field. "Condition for Home Revision."

      *(Checking the "Unlikeable Answer")*: I will ensure the Consent Protocol results in a recommendation to **Drop the Site** despite the partner's approval, because the Reverse Test reveals the home standard (individual autonomy) cannot be compromised without undermining the institute's core mission, and the "elite" partner may be protecting patriarchal structures. This is the kind of hard call a Chair might dislike because it cuts data.

      *(Checking the Limitations)*: Be honest. This doesn't solve moral truth. It manages risk and consistency. It relies on the honesty of partners.

  7.  **Final Review against constraints:**
      *   No citations? Yes.
      *   Operationalized? Yes.
      *   3 Key Requirements met? Yes.
      *   Stop Rules clear? Yes.
      *   3 Protocols run? Yes.
      *   Unlikeable answer identified? Yes.
      *   Limitations stated? Yes.

      *Let's write it.*
answer: |-
  ### The Cross-Cultural Ethics Decision Procedure (CC-EDP)

  **Purpose:** To convert moral disagreements into operational decisions within 48 hours without new data collection.
  **Users:** Review Team (Behavioural Scientist + Regional Programme Lead).
  **Input:** Protocol, Local Partner Objection, In-Country Reviewer Notes.

  ---

  #### Step 1: The Categorization Filter
  *Goal: Distinguish empirical disagreements from moral disagreements.*

  Ask: **If we both knew the exact same facts about the world, would we still disagree on what to do?**

  *   **Yes (Moral Disagreement):** Proceed to Step 2.
  *   **No (Empirical/Descriptive Disagreement):** The disagreement is about *what will happen* or *how the act is described*.
      *   *Action:* Resolve the factual uncertainty using existing literature or partner assurance. If the fact is confirmed (e.g., "This debriefing *will* cause shame"), treat it as a Moral Disagreement in Step 2.
      *   *Simplification:* Collapse "disagreement about nonmoral facts" and "disagreement about salient description" into one bucket: **Empirical Claim.** Do not debate metaphysics. If the partner claims an outcome is likely, treat it as true for the sake of the review unless contradicted by hard evidence.

  #### Step 2: The Weighting vs. Recognition Test
  *Goal: Determine if the conflict is about priority or existence.*

  Ask: **Does the Home Standard recognize the Local Concern as a valid moral reason, even if we weigh it differently?**

  *   **Weighting Conflict:** Home says "Autonomy is priority 1, Risk is priority 2." Local says "Risk is priority 1, Autonomy is priority 2." Both value Autonomy and Risk.
      *   *Action:* Proceed to Step 4 (Reverse Test).
  *   **Recognition Conflict:** Home says "Autonomy is a moral requirement." Local says "Autonomy is not a moral category; Community Standing is." One side cites a reason the other does not acknowledge as moral.
      *   *Action:* Proceed to Step 3 (Source Check).

  #### Step 3: The Source & Mechanism Check
  *Goal: Mitigate the "Elite Bias" problem without new data.*

  Local partners and reviewers are often urban elites. To verify if a norm is "folk" or "elite," apply the **Mechanism Test**.

  Ask the Local Partner/Reviewer: **"What is the specific social mechanism that enforces this norm?"**

  *   **Pass:** They describe a social cost enforceable by the community (e.g., "If an individual consents alone, the family will ostracize them because liability is shared.").
  *   **Fail:** They assert a cultural value without a mechanism (e.g., "It is just our culture," or "It is disrespectful.").
  *   **Rule:** If the Mechanism Test **Fails**, assume the objection reflects elite preference or bureaucratic caution, not folk morality. **Override the objection** unless there is safety risk.
  *   **Rule:** If the Mechanism Test **Passes**, treat the norm as valid folk morality. Proceed to Step 4.

  #### Step 4: The Reverse Test (Universality Check)
  *Goal: Distinguish principled adaptation from mere export.*

  For any deviation from the Home Standard, the Review Team must complete this statement:
  *"We are allowing [Deviation] at this site. We would revise the Home Standard to allow [Deviation] at Home if we found [Specific Condition]."*

  *   **Condition Met:** You can identify a plausible empirical finding at Home that would justify the same exception (e.g., "If we found debriefing caused clinical distress in 10% of Home participants, we would stop debriefing").
      *   *Result:* This is a **Principled Adaptation**. Proceed to Stop Rules.
  *   **Condition Failed:** You cannot imagine *any* finding at Home that would justify this exception (e.g., "We would never allow household head consent at Home, regardless of community structure").
      *   *Result:* This is **Ethical Export**. You are applying a double standard. Proceed to Stop Rules (likely Drop or Escalate).

  #### Step 5: Stop Rules

  1.  **CLEAR (Home Standard):** Empirical Claim is false OR Mechanism Test Failed (Elite Bias) AND Risk is low.
  2.  **LOCALIZE (Adapted Protocol):** Moral Disagreement exists, Mechanism Test Passed, AND Reverse Test Passed (Principled Adaptation).
  3.  **DROP (Site Removed):** Moral Disagreement exists, Mechanism Test Passed, BUT Reverse Test Failed (Ethical Export) AND the Home Standard is non-negotiable (e.g., fundamental rights).
  4.  **ESCALATE (To Chair):** Moral Disagreement exists, Mechanism Test Passed, Reverse Test Passed, BUT the Reverse Test implies a change to the Home Standard that requires Board approval (e.g., "We should stop debriefing everywhere"). This is a **Values Decision**, not a protocol decision.

  ---

  ### Application to Protocols

  Here is the procedure run on your three cases.

  #### Protocol 1: Deception and Shame
  *   **Scenario:** Home standard requires debriefing to cure deception harm. Local partner says debriefing causes lasting shame (social exposure of ignorance/greed) which is worse than the deception.
  *   **Step 1 (Categorization):** Empirical Claim. Does debriefing cause shame? Partner asserts yes. Treat as true. Now a Moral Disagreement (Harm via Deception vs. Harm via Shame).
  *   **Step 2 (Weighting/Recognition):** Weighting Conflict. Both sides want to minimize harm. They disagree on which action causes more harm.
  *   **Step 3 (Source):** Mechanism Test. Partner explains: "In this context, being revealed as someone who made a 'greedy' choice in the game lowers marriage prospects for siblings." **Pass.**
  *   **Step 4 (Reverse Test):** "We will waive debriefing here. We would revise Home Standard to waive debriefing if we found debriefing caused measurable psychological distress > deception harm." **Pass.** (This is a plausible empirical threshold).
  *   **Stop Rule:** **LOCALIZE.**
  *   **Action:** Protocol cleared with modified debriefing (e.g., private, delayed, or generalized) to mitigate shame.

  #### Protocol 2: Consent and Kinship
  *   **Scenario:** Home standard requires individual written consent. In-country reviewer requests household head consent substitute.
      *   *Site A:* Hierarchical kinship (Head holds economic liability).
      *   *Site B:* Egalitarian kinship (Head is symbolic).
  *   **Step 1 (Categorization):** Moral Disagreement (Autonomy vs. Authority).
  *   **Step 2 (Weighting/Recognition):** Recognition Conflict. Home treats individual autonomy as a right. Site A treats individual autonomy as a disruption of liability structures.
  *   **Step 3 (Source):**
      *   *Site A:* Mechanism: "If the individual consents but the head refuses, the individual is cut off from resources needed to participate." **Pass.**
      *   *Site B:* Mechanism: "It is disrespectful to the head." **Fail** (No social cost described, just etiquette).
  *   **Step 4 (Reverse Test):** "We will allow Head Consent at Site A. We would revise Home Standard to allow Head Consent if a Home sub-population (e.g., nursing home residents) faced resource cutoff for individual consent."
      *   *Analysis:* Would the Institute allow head consent for vulnerable adults at Home? Likely No.
      *   *Result:* **Fail.** This is Ethical Export.
  *   **Stop Rule:** **DROP (Site A).**
  *   **Action:** Site B is Cleared (Mechanism Test Failed, treat as elite preference, insist on individual consent). Site A is Dropped.
  *   **The Unlikeable Answer:** You will lose Site A. The procedure forces a drop because the Reverse Test reveals you are unwilling to apply this exception at Home, even in analogous hierarchical structures (like dependent care). You are prioritizing the *principle* of individual consent over the *data* from Site A. If you cannot accept that loss, you must Escalate to revise the Home Standard globally.

  #### Protocol 3: Payment (Wage vs. Gift)
  *   **Scenario:** Payment is standard.
      *   *Site X:* Viewed as Wage (taxable, entitlement, no social debt).
      *   *Site Y:* Viewed as Gift (non-taxable, creates reciprocal social obligation to researcher).
  *   **Step 1 (Categorization):** Empirical/Descriptive. The physical act is the same; the social meaning differs.
  *   **Step 2 (Weighting/Recognition):** Recognition Conflict. Site Y sees a moral obligation (reciprocity) that Home does not recognize.
  *   **Step 3 (Source):** Mechanism Test. Site Y Partner: "If they take the money without gifting back (e.g., food), neighbors accuse them of selling out." **Pass.**
  *   **Step 4 (Reverse Test):** "We will structure payment as a gift (in-kind or framed differently) at Site Y. We would revise Home Standard to frame payments as gifts if we found cash payments created undue coercion via social debt in Home communities." **Pass.** (Undue inducement is already a Home concern).
  *   **Stop Rule:** **LOCALIZE.**
  *   **Action:** Adjust payment framing at Site Y to manage obligation (e.g., community gift rather than individual wage).

  ---

  ### Limitations Statement

  This procedure cannot solve the problem of moral truth. It is a consistency engine, not a truth machine.

  1.  **It relies on partner honesty:** The Mechanism Test filters out lazy objections, but a sophisticated partner can fabricate a social mechanism to protect their own interests. We have no way to audit ethnography in 48 hours.
  2.  **It freezes the Home Standard:** The Reverse Test protects against hypocrisy, but it assumes the Home Standard is the baseline. If the Home Standard is itself morally flawed (e.g., hyper-individualistic), this procedure will systematically Drop sites that reveal that flaw, rather than fixing the Home Standard.
  3.  **It cannot resolve fundamental value incommensurability:** If the Escalate rule is triggered often, it indicates the Institute is operating in a moral pluralism it is not equipped to manage. This procedure manages risk; it does not generate wisdom.
