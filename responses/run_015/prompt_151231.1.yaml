  **Philosophy Department Replaces Personnel Files With Spacetime Worms**

  STATE COLLEGE—Citing a need for ontological consistency, the University Philosophy Department officially transitioned to a perdurantist human resources framework this Monday, restructuring faculty employment around four-dimensional temporal parts rather than three-dimensional instantaneous slices.

  Under the new policy, tenure no longer guarantees job security for a professor's current manifestation, but instead secures the extension of their entire spacetime worm. Consequently, termination is now classified as "temporal truncation," wherein administration simply ceases to extend the employee's career vector beyond the current semester. Conversely, plagiarism investigations have been suspended, as appropriating ideas is now viewed as accessing shared mental content across different temporal stages of the same academic organism.

  Emeritus status has also been redefined as literal post-mortem continuation. While biologically deceased, retired professors remain on the payroll provided their causal influence persists in the departmental timeline. "We are honoring the whole worm, not just the fleshy present," said Dean Martha Higgs. "If ideas live on, theire employment status must reflect that extent."

  The department is simultaneously piloting an exdurantist model for its adjunct pool. Under this system, each semester is treated as an instantaneous stage linked to the next by counterpart relations rather than strict identity. This allows administration to deny benefits by arguing that the adjunct teaching Logic 101 in September is not identical to the adjunct seeking health coverage in October.

  "That wasn't you who earned the sick leave," HR Director Alan Turing told staff. "That was your Tuesday counterpart. You are merely a temporal stage linked by similarity, not numerical identity. Benefits do not transfer across counterpart relations."

  The policy has drawn criticism from remaining endurantists. Professor Gerald Flinch, who claims he was technically fired in 2019, complained that administration keeps extending his worm against his will.

  "I am wholly present at every moment, and at the moment of my dismissal, I ceased to be employed," Flinch said. "But HR keeps sending me paychecks and assigning me advisees. I am not a worm. I am a man. Stop extending me."

  Administration notes that appeals must be filed within the same temporal coordinate as the grievance, rendering most complaints causally impossible. Sabbaticals are now considered "gaps in the worm," requiring continuity forms for spatial reappearance. The department chair reminded staff that punctuality is now a metaphysical necessity.
