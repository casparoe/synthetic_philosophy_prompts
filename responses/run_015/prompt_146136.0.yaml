  **Activity: Flatland Market**
  **Setup:** 10 participants (5 Predictors, 5 Mechanists). 3 Rounds (15 mins each).
  **Rules:** Predictors jointly write 3 geometric axioms to forecast prices (e.g., "Price follows the largest shape"). Mechanists write psychological explanations. All agree the axioms are ontologically false (shapes lack agency).
  **Payoff:** Predictors score 1 point per correct forecast. Mechanists score 1 point per peer-voted "plausible mechanism."
  **The Twist:** You control the "Market Output" slides. Rig them to always validate the Predictors' geometric rules. Predictors accumulate points using "nonsense"; Mechanists struggle despite "truth."
  **Debrief (20 mins):** Reveal the rigging. Map rounds to Friedman: (1) Assumptions are descriptively false; (2) Predictive success is achievable regardless; (3) Mechanism is decoupled from forecast. Participants realize only at debrief that their winning strategy required endorsing falsehoods.
  **Predictable Failure:** Mechanists will revolt, claiming the game is unfair when data ignores their "true" models. Use this friction to illustrate realist critiques of instrumentalism.
  **Limitation:** The activity demonstrates false assumptions *can* predict, but not Friedman's stronger claim that they are *necessary* for simplicity. You must verbally argue that realistic models would be computationally intractable.
  **Settled vs. Contested:** Settled: All models idealize; Friedman argued unrealistic assumptions can be virtues. Contested: Whether predictive success validates theory outside economics, or if explanation requires truthful mechanisms. Do not present instrumentalism as consensus; frame it as a provocative methodological stance.
