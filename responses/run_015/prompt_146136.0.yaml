prompt: |-
  Hey, I'm a journalist who writes about science and ideas, and I'm putting together a dataset of conceptual prompts that are kinda in the weeds but don't need web access. I need one for a grad workshop — about 10 people, 75 minutes — that makes participants feel the force of Friedman's F-twist: the idea that wildly unrealistic assumptions in a model aren't just tolerable, they can be structurally necessary for predictive success, and that this severs "getting the mechanism right" from "getting the forecast right."

  Design a runnable activty (game, role-play, or simulation) where the group splits into "predictors" and "mechanists." The predictors should score points using rules they all agree are literally false — maybe a micro-economy called Flatland Market where agents have no minds, no utility, just geometric movement rules — but they still generate accurate price predictions over three rounds. The mechanists score points for ontological truth. Make sure participants build the false-model sequence themselves and only notice at the end that they've endorsed something they think is nonsense. Include a clear payoff scheme with no real money, rules that take under 10 min to explain, and a debrief that maps each round onto parts of the F-twist argument.

  Also tell me what will predictably go wrong the first time you run it, and be frank about which feature of Friedman's actual methodological defense the activty can't reproduce and you'll have to supply verbally.

  Please separate what's settled (that idealization is ubiquitous, Friedman argued unrealistic assumptions can be virtues) from what's genuinely contested (whether this applies outside economics, whether explanation can be fully decoupled from truth). Keep the whole thing under 400 words max, and don't present a contested view as the consensus. There's probably a typo in here — "activty" — but you get the idea.
