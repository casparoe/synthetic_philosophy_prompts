          4.  Explain why the text is blackmail (serious issue).
          5.  Advise on next steps (confrontation, evidence, exit strategy).

  5.  **Refining the Logic (Self-Correction/Nuance):**
      *   *Wait, is the bot argument Newcomb's Problem?* Yes, essentially. In Newcomb's Problem, one-boxing is often argued as rational if the predictor is perfect. However, in this real-world context, the "predictor" is a janky bot built by the flatmate. It's not a perfect omniscient being. It's a tool used for manipulation. The flatmate is claiming the *past* simulation depends on the *present* choice, which is causally backwards unless the bot is actually perfect and the choice was predetermined. But even then, using it to guilt-trip is manipulative.
      *   *The Text:* This is the red flag. Even if the user *wanted* to help with the fridge, this text makes it impossible to trust the flatmate.
      *   *Stance:* Absolutely do not pay based on these terms. The relationship is compromised.

  6.  **Drafting the Content (British English Check):**
