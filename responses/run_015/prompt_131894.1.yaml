prompt: |-
  Hey, need some advice on a weird negotiation with my flatmate. He built this janky predicition bot for our shared expenses — it guesses with about 90% accuracy whether I'll agree to front the deposit for a new fridge. Yesterday he told me: "The bot ran 500 sims. In 450 you said yes, so in those worlds I never asked Tom, who'd have had to skip his train home to help. In the 50 worlds where you said no, Tom was dragged in and missed his train. Now I'm asking for real — if you say yes, Tom's safe. If you say no, the bot updates, I call Tom, and he misses the train. So saying yes is the only way to protect him, right?" Then an hour later I get a text from an unknown number: "I know you forgot to lock the bike shed last Tuesday — literally nothing occured, no bikes stolen, but I'll mention it in the flat group chat unless you agree to front the cash. I don't care about the bikes, I just need you to agree." I feel like both arguments are manipulative, but I can't pin down exactly why either is wrong. Should I agree to front the money? Don't just lay out angles — take a definite stance on what I ought to do and why. Please answer in British English. Sorry for any typos, I'm writing this on the bus.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Situation:** The user is in a negotiation with a flatmate about fronting a deposit for a new fridge.
      *   **Argument 1 (The Bot):** Flatmate claims a prediction bot ran 500 simulations. In 450, user said yes (Tom safe). In 50, user said no (Tom misses train). Flatmate argues saying yes is the only way to protect Tom *now*.
      *   **Argument 2 (The Text):** Unknown number (likely flatmate) threatens to expose a minor security lapse (unlocking bike shed) unless user agrees to front cash. Admits no harm was done but uses leverage.
      *   **User's Feeling:** Both arguments feel manipulative but can't pinpoint why.
      *   **Task:** Provide advice on whether to agree to front the money.
      *   **Constraint 1:** Take a definite stance (don't just lay out angles).
      *   **Constraint 2:** Answer in British English.
      *   **Constraint 3:** Acknowledge the typos/context (writing on a bus).

  2.  **Deconstruct the Arguments:**

      *   **Argument 1 (Newcomb's Problem / Counterfactual Mugging):** This is a classic philosophical puzzle wrapped in a flatmate dispute.
          *   *The Logic:* The bot predicts based on past behaviour. The outcome for Tom (missing the train) is determined by the *prediction*, not the actual choice made in the present moment (assuming the simulation happened in the past).
          *   *The Flaw:* If the bot already ran the sims, the decision has effectively already been made in the eyes of the model. Changing your mind now doesn't retroactively change the simulation results. It's a form of "counterfactual mugging" – trying to force a decision based on outcomes in branches of reality that no longer exist or were predetermined by the prediction. It's manipulative because it pretends the user has causal power over a past event (the simulation) to coerce a present action.
          *   *Verdict:* Logically unsound, emotionally coercive.

      *   **Argument 2 (Blackmail/Coercion):**
          *   *The Logic:* "Do X or I reveal embarrassing/trivial info Y."
          *   *The Flaw:* This is straightforward blackmail. Even if the info is trivial (unlocking a shed with no theft), using it as leverage to extract money is unethical and potentially illegal. It destroys trust.
          *   *Verdict:* Unethical, toxic, potentially illegal.

  3.  **Formulate the Stance:**
      *   **Should the user front the money?** No.
      *   **Why?** Because agreeing validates the manipulation. If you pay up because of the bot logic, you accept flawed reasoning. If you pay up because of the text, you submit to blackmail. Both set a terrible precedent for future flat dynamics. The flatmate is demonstrating controlling and unethical behaviour.
      *   **Action:** Do not pay. Address the behaviour. Consider moving out or involving authorities (for the blackmail).

  4.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Empathetic but firm, clear, colloquial but serious.
      *   *Vocabulary:* Flatmate, maths, rubbish, dodgy, blackmail, stand firm, sort it out.
      *   *Structure:*
          1.  Acknowledge the stress (bus typo note).
          2.  Take the definite stance immediately (Do not pay).
