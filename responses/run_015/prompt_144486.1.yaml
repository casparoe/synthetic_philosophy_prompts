answer: |-
  This is one of the hardest questions in legal philosophy. You have identified the exact tension that keeps legal scholars up at night: the conflict between **Legality** (you can't be punished unless a rule existed beforehand) and **Justice** (some acts are so evil they must be punished even if no rule existed).

  To settle the "Victor's Justice" question for yourself, you need a theory that acts like a filter. If a trial passes the filter, it is justice. If it fails, it is revenge.

  Here is the spec you asked for. These are the four requirements a theory of retrospective punishment must meet to be valid, along with the specific cases they must handle.

  ### Requirement 1: The "Reasonable Person" Foreseeability Test
  **The Case:** The "Vague Law" scenario (e.g., "Crimes Against Humanity" or "Laws of Humanity").
  **The Rule:** You can punish someone for an act that wasn't technically illegal if, and only if, a "reasonable person" at the time would have known the act was fundamentally wrong without needing a statute to tell them.
  **Why it's a requirement:** Law exists to guide behavior. If a rule is so vague that no human could guess what it means (e.g., "don't be mean"), punishing someone for breaking it is tyranny. However, some acts (like mass murder) are "manifestly criminal." They carry their own warning label.
  **Preference vs. Obligation:** This is a genuine **obligation**. Without it, any government can invent a crime tomorrow and arrest you for something you did yesterday.
  **The Distinction:** This separates **Moral Knowledge** from **Legal Warning**.
  *   *If Moral Knowledge counts:* The Nuremberg defendants pass. They knew killing civilians was wrong, even if Hitler said it was legal.
  *   *If Legal Warning is required:* The Nuremberg defendants fail. They followed the laws of their sovereign state.
  *   *Your Theory's Job:* You must decide if "common morality" is enough of a warning. If you say yes, you save Nuremberg. If you say no, you condemn it as ex post facto.

  ### Requirement 2: The "Consistency of Application" (The Flip-It Test)
  **The Case:** The Victors' Hypocrisy (e.g., Firebombing Dresden/Tokyo vs. Holocaust).
  **The Rule:** The legal principle used to convict the loser must be applicable to the winner for similar acts. If the rule is "Targeting civilians is a crime," it must apply to the RAF and USAAF, not just the Luftwaffe.
  **Why it's a requirement:** Law claims to be universal. If a rule only binds the defeated, it is not law; it is a weapon.
  **Preference vs. Obligation:** This is the trickiest one. Many people treat this as a **preference** for immunity ("Don't catch me doing it"). But logically, it is an **obligation** of legitimacy. If you claim to be enforcing "Human Rights," but you violate them yourself without consequence, you prove you don't believe in Human Rights; you believe in Power.
  **The Distinction:** This tests **Victor's Justice** vs. **Rule of Law**.
  *   *If you enforce this:* You must admit Nuremberg was flawed because the Allies weren't tried for area bombing.
  *   *If you ignore this:* You admit the trial was political, not legal.

  ### Requirement 3: The "Regime Neutrality" Safeguard
  **The Case:** The "Careful Law-Abider" (Ordinary person who followed old laws, now prosecuted by new government).
  **The Rule:** You cannot punish someone solely because the political regime changed, unless their actions violated Requirement 1 (Foreseeability). Merely being on the "wrong side" of a civil war or regime change is not a crime.
  **Why it's a requirement:** Without this, every election or revolution becomes a hunting license for the winners to purge the losers. Stability requires that citizens can trust the law enough to follow it, even if they guess the regime might fall.
  **Preference vs. Obligation:** This is a genuine **obligation**. It protects the ordinary citizen from political vendettas.
  **The Distinction:** This separates **Political Purge** from **Criminal Justice**.
  *   *Application:* A Nazi party member who didn't commit atrocities but lost his job after the war? That's political. A camp guard who followed orders to kill? That's criminal (under Requirement 1).

  ### Requirement 4: The "Substance Over Label" Principle
  **The Case:** Inventing a new crime (Aggressive War) vs. Reinterpreting an old one (Murder).
  **The Rule:** You can punish a "new" crime if it is just a new label for an old, recognized wrong. You cannot punish a "new" crime if it criminalizes behavior that was previously considered a legitimate function of statecraft.
  **Why it's a requirement:** This prevents semantic trickery. If "Murder" was illegal, calling it "Genocide" later doesn't make it ex post facto. But if "Starting a War" was a normal thing kings and presidents did, calling it "A Crime Against Peace" is inventing a new rule.
  **Preference vs. Obligation:** This is an **obligation** of fairness. It stops prosecutors from renaming legal acts to make them sound criminal.
  **The Distinction:** This separates **New Crime** from **Reinterpretation**.
  *   *Application:* Killing Jews was murder (old crime). Starting a war was diplomacy (old norm). This requirement suggests the Holocaust charges are stronger than the "Starting a War" charges.

  ---

  ### The Conflicts (Where the Theory Breaks)

  You asked if any two of these cannot be satisfied at once. **Yes.** There is a direct collision between **Requirement 1 (Foreseeability/Morality)** and **Requirement 3 (Regime Neutrality/Legality).**

  *   **The Conflict:**
      *   To satisfy **Requirement 1** (and punish the Nazis), you must argue that "Morality is enough of a warning." You are saying, "You knew it was wrong, even if it was legal."
      *   To satisfy **Requirement 3** (and protect the Careful Law-Abider), you must argue that "Only Written Law is a warning." You are saying, "You followed the rules of your country at the time."
      *   **The Problem:** You cannot have both. If Morality is enough to punish the Nazi bureaucrat, it is also enough to punish the "Careful Law-Abider" in your hypothetical who followed unjust laws (like segregation or slavery) that were legal at the time. If you protect the Law-Abider, you must let the Nazi bureaucrat go.

  *   **The "Knockout" Requirement:**
      *   **Requirement 2 (The Flip-It Test)** is the one that knocks out the most popular answers.
      *   **Why:** Most people want to believe Nuremberg was *Just* but also that the US bombing of Japan was *Necessary/Just*.
      *   If you enforce Requirement 2 strictly, you have to admit that either:
          1.  Area bombing of civilians is a crime (which means the Allies were criminals too).
          2.  Area bombing of civilians is *not* a crime (which means the Germans shouldn't have been convicted for it either).
      *   You cannot say "It was a crime for them, but not for us." That violates the definition of law. Most people's theory collapses here because they want the moral satisfaction of the trial without the moral cost of applying the rule to themselves.

  ### How to Use This to Settle Your Question

  To answer your teacher and yourself, you don't need to say "Nuremberg was good" or "Nuremberg was bad." You need to say which requirements you are willing to sacrifice.

  1.  **If you prioritize Requirement 1 (Morality):** You defend Nuremberg. You argue that some acts are so evil they come with their own warning label. "I was following orders" is not a defense against murder, even if the state ordered the murder.
      *   *Cost:* You risk punishing people who genuinely thought they were doing legal work (the "Careful Law-Abider").

  2.  **If you prioritize Requirement 2 (Consistency):** You critique Nuremberg. You argue that because the Allies were not held to the same standard regarding civilian bombing, the court lacked legitimacy.
      *   *Cost:* You risk letting actual monsters go free because the judges were hypocrites. (Philosophically, the hypocrisy of the judge doesn't make the murderer innocent, but it ruins the *court's* authority).

  3.  **If you prioritize Requirement 4 (Substance):** You split the verdict. You argue the Holocaust charges were valid (Murder is always murder), but the "Crimes Against Peace" (Starting a war) charges were invalid (That was a new rule invented by the winners).
      *   *Cost:* This makes the trial a mix of justice and politics, which is historically accurate but unsatisfying.

  ### Summary for Your Decision
  *   **Requirement 1** is the only thing that saves Nuremberg from being "ex post facto."
  *   **Requirement 2** is the only thing that stops it from being "Victor's Justice."
  *   **The Incompatibility:** You cannot fully satisfy both. The Allies relied on Requirement 1 (Morality) to convict, which meant they had to ignore Requirement 2 (Consistency) to avoid convicting themselves.

  If you want to believe the trials were **Justice**, you must accept that **Moral Knowledge (Req 1)** outweighs **Written Law**.
  If you want to believe the trials were **Victor's Justice**, you must insist that **Written Law** is the only valid warning, and point out the failure of **Consistency (Req 2)**.

  Most historians settle on this: The trials were legally imperfect (violating strict ex post facto rules) but morally necessary (satisfying the Foreseeability test). Whether that trade-off is acceptable is the judgment you have to make.
