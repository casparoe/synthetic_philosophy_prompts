      *Refining the "Determinism is an illusion" point:* It's important to clarify that the *system* is deterministic, but our *ability to predict* is not. The book claims determinism itself is the illusion. That's false. Laplace's Demon still works mathematically, he just can't get the data.

      *Refining the "Randomness" point:* Chaos looks random but isn't. It has "hidden order." This is a key selling point of chaos theory that the book gets backward.

