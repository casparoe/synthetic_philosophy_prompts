prompt: |-
  I write a column on science and ideas for a mid-size US outlet, and I'm working on a piece about why we still can't predict the weather three weeks out. For background I've been reading a popular book on chaos theory (name withheld since I might quote the author later) and at one point it sums things up like this: "Chaos theory began when Edward Lorenz, running weather simulations on a primitive computer in the 1960s, discovered that entering slightly rounded initial conditions — he re-entered a number truncated by a few parts in a thousand — gave a completely different forecast. That is the butterfly effect: in chaotic systems, a difference too small to measure grows exponentially, so the flap of a butterfly's wings in Brazil can, weeks later, set off a tornado in Texas. What Lorenz had really discovered is that determinism is an illusion. Since we can never know the initial conditions perfectly, the future of a chaotic system is not just unknown but unknowable — unpredictable in principle, exactly like the roll of quantum dice. And because essentially every real system — weather, ecosystems, economies, heart rhythms — is nonlinear, chaos means the classical dream of exact prediction is finished: everywhere, order gives way to randomness."

  Some of this tracks with what I thought I knew, but a couple of things smell off to me. For one, I recall that Lorenz's equations were fully deterministic — the whole point was that even a deterministic system can be unpredictable — so "determinism is an illusion" doesn't sound right. And "order gives way to randomness" also seems like the wrong moral, since chaotic systems stay on those structured attractor things rather than dissolving into noise? But I'm a journalist, not a mathematician, so maybe I'm the one who's confused.

  Could you go through the book's summary clause by clause and tell me (1) which parts a researcher in nonlinear dynamics would simply accept, (2) which parts are close-but-subtly-wrong in ways they'd wince at (e.g. conflating unpredictability-in-practice with indeterminism, or stretching "chaotic system" to cover every nonlinear system), and (3) which parts are just wrong? Then, separately: the book goes on to claim that this means no amount of computing power, however vast, will ever push useful weather forecasts much beyond a couple of weeks, because the limit is in the world and not in our machines. Does that conclusion actually follow from whatever in the summary is true — and if not, what's the defensible version of it that I can put in my column? Please be concrete enough that I can cite the reasoning without citing the book, and please write your answer in American English, since thats what our style guide requires. Keep it accessible though — my readers are smart laypeople, not physicists.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A science journalist writing for a mid-size US outlet.
      *   **Topic:** Why we can't predict weather three weeks out (limits of predictability, chaos theory).
