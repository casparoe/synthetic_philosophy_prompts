      *   *Implication for Budget:* Don't split 50/50 based on "stopping power." Split based on "learning rate." Control buys data; Alignment buys potential robustness. The budget should prioritize control measures that maximize *information gain* about failure modes, not just prevention. This validates the user's intuition but refines it: Control isn't just a shield; it's a scientific instrument.

