      *   *Paragraph 2:* The Phenomenal Consciousness Defeater. The asymmetry relies on the badness of pain. Pain doesn't require narrative. If pain is bad, its absence is good. This undermines the restriction.
      *   *Paragraph 3:* The Marginal Cases (Infants/Animals). If narrative is the key, infants lack it. Does asymmetry not apply to them? That implies creating happy infants is good. This conflicts with standard antinatalist intuitions and protection of vulnerable life.
      *   *Paragraph 4:* Empirical Gradualism. Narrative self isn't on/off. It's a spectrum. Where is the cutoff? This leads to arbitrariness.
      *   *Paragraph 5:* Unfalsifiability. If the theory adjusts to fit intuitions about AI vs Humans, is it predictive?
      *   *Paragraph 6:* Concessions. Defender might shift to "minimal self" vs "narrative." But this weakens the original claim.
      *   *Paragraph 7:* Verdict. The position is exposed. It sacrifices the foundational logic of harm for scope management.

