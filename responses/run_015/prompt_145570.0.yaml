      *Self-Correction on "Reverses":* If it reverses, does it mean absence of pleasure *is* bad? Yes. So for non-narrative beings, we have a duty to create them if they will be happy? That's a strong claim. I need to highlight how radical this is.

      *Refining the "Narrative" concept:* Why would narrative matter? Maybe because only a narrative self can be "deprived"? But pain doesn't require deprivation to be bad. It just hurts. This is the strongest attack.

      *Structure:* Start with the conceptual grounding. Move to the marginal cases. Then the empirical issues. Then the methodological risk. End with verdict.

