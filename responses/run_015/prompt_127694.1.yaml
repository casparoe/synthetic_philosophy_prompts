answer: |-
  There is no single, canonical label in the literature that captures this specific manoeuvre precisely as you have described it. However, the position you outline is a recognisable and distinct variant of **Biological Internalism**, which might best be termed **"Substrate-Dependent Normativity"** or **"Location-Sensitive Normative Internalism."**

  While standard objections to the Extended Mind Thesis (EMT) typically challenge the *functional* equivalence of external resources (arguing, for instance, that notebooks lack the plasticity or non-derived content of neural states), the objection you describe is more radical. It concedes functional parity but denies that functional parity is sufficient for *ontological* or *normative* parity. It posits that the boundary of the organism is not merely a physical contour but a normative frontier: certain epistemic properties (justification, belief attribution, doxastic responsibility) attach to processes solely in virtue of their instantiation within the biological substrate, regardless of their causal role.

  Below is a conceptual analysis of this position, its relation to standard objections, and an assessment of its philosophical viability.

  ### 1. Conceptual Definition

  **Substrate-Dependent Normativity** is the view that the normative status of a cognitive process (its capacity to constitute a belief, justify an action, or bear epistemic responsibility) supervenes not only on its functional profile but also on its physical location or biological constitution.

  The core commitment is this: Two processes, $P_{internal}$ and $P_{external}$, may be functionally isomorphic (identical in input-output relations, inferential role, and reliability). However, $P_{internal}$ possesses normative authority (it counts as a belief, it justifies an assertion) while $P_{external}$ does not, purely because $P_{internal}$ is realised within the biological boundary of the agent.

  This differs from plain internalist intuition in that it does not rely on a phenomenological difference (e.g., 'it feels different') or a functional difference (e.g., 'the notebook is slower'). It relies on a metaphysical stipulation that the *skin* or *skull* is a condition for the applicability of cognitive norms.

  ### 2. Relation to Standard Objections

  To understand why this is a distinct failure mode, we must distinguish it from the three primary taxonomic categories of EMT objections.

  **A. The Coupling-Constitution Fallacy**
  The coupling-constitution objection (associated with Adams and Aizawa) argues that proponents of EMT mistake a causal relationship for a constitutive one. Just because a notebook is causally coupled to a brain does not mean it is part of the mind. Typically, this objection is supported by claiming there *are* functional differences (e.g., the notebook has 'derived' content while the brain has 'non-derived' content).
  *   **Distinction:** The opponent you describe *grants* the functional parity that Adams and Aizawa typically deny. They accept the coupling is sufficiently tight to mimic the function. Their denial is not that the notebook fails to play the role of memory, but that playing the role of memory *outside the head* does not confer the status of 'remembering'. They accept the constitution of the function but deny the constitution of the *normative status*.

  **B. The Glue and Trust Conditions**
  Clark's own criteria for extension (reliability, accessibility, automatic endorsement) are designed to prevent 'cognitive bloat'. They act as filters to ensure only trustworthy resources are counted as mental.
  *   **Distinction:** In your scenario, the opponent concedes that the external resource meets these criteria (it is bespoke, reliable, and automatically consulted). The objection is not that the resource is untrustworthy (a functional failure), but that trustworthiness *external to the organism* is insufficient for epistemic binding. It treats the 'Glue' condition as necessary but not sufficient, adding a hidden 'Location' condition.

  **C. Biological Internalism**
  Standard biological internalism argues that cognition is essentially a biological phenomenon. Usually, this is defended by claiming that only biological systems possess the specific causal powers required for cognition.
  *   **Distinction:** Standard biological internalism usually argues that non-biological systems *cannot* achieve functional parity. Your opponent's version is more concessive: it admits non-biological systems *can* function identically, but asserts they still lack the *authority*. This shifts the argument from empirical psychology (what can brains do?) to metaphysics (what kind of stuff can bear norms?).

  ### 3. Boundary Cases and Diagnostic Tests

  To determine if an interlocutor is employing Substrate-Dependent Normativity rather than a standard functional objection, one can utilise the following boundary cases.

  **The Neural Implant Case**
  Imagine the bespoke symbolic notation is not in a notebook but stored on a chip implanted directly into the mathematician's parietal lobe, interfacing seamlessly with neural tissue.
  *   **Standard Internalist:** Likely accepts this as mental, as it is now inside the biological boundary (or sufficiently integrated).
  *   **Substrate-Dependent Normativist:** If they accept the implant but reject the notebook despite identical function, they confirm their objection is location-sensitive. If they reject the implant because it is silicon, their objection is substrate-sensitive (Biological Chauvinism). Both fall under the umbrella you identified, but the implant case isolates 'location' from 'material'.

  **The Telepathic Link Case**
  Suppose the clinician accesses the shared database via a direct neural link that feels subjectively identical to recalling an internal memory, bypassing conscious search.
  *   **Test:** Does the data become 'belief' only when it crosses the threshold of the skull? If the database remains on a server but is accessed with zero latency and no conscious effort, does it count? The Substrate-Dependent Normativist must say 'no', implying that the physical site of storage matters more than the phenomenology or functional integration.

  **The Gradual Replacement Case**
  If neurons are gradually replaced by functionally identical nano-structures, at what point is normative authority lost?
  *   **Test:** If the opponent argues authority is lost immediately upon crossing the skull boundary, regardless of functional continuity, they are committed to the location-sensitive view.

  ### 4. Does it Collapse into a Familiar Objection?

  This is the crucial analytical question. Does Substrate-Dependent Normativity stand as a distinct philosophical position, or is it a disguised version of a more fundamental commitment?

  **Argument for Collapse:**
  One might argue this position collapses into a rejection of **Functionalism**. The Extended Mind Thesis is grounded in functionalist metaphysics: mental states are defined by what they *do*, not what they are *made of* or *where they are*. By insisting that location determines normative status despite functional identity, the opponent is effectively abandoning functionalism in favour of a form of **Substrate Chauvinism** or **Biological Naturalism**.
  If one accepts Functionalism, the objection is incoherent. If one rejects Functionalism, the objection is valid but rests on a broader metaphysical disagreement, not a specific problem with extension. In this sense, it collapses into the general debate between Functionalism and Biological Naturalism.

  **Argument for Distinctness:**
  However, there is a nuance that preserves its distinctness. One can be a functionalist about *causation* but an internalist about *normativity*. This is the position of **Epistemic Internalism** applied to vehicle location. The opponent might argue: "I grant the notebook functions as memory causally. But *responsibility* for that memory, and the *justification* it provides, requires the agent to have a specific kind of ownership that only biological interiority can provide."
  This does not necessarily reject functionalism about the mind generally, but asserts a specific exception for *normative properties*. It claims that epistemic norms are 'human-centric' or 'organism-centric' in a way that causal roles are not. This is a distinct failure mode because it accepts the scientific description of the system (the functional parity) but rejects the philosophical interpretation of the system's status (the normative attribution).

  ### 5. Conclusion and Conceptual Carving

  The resistance you have encountered is best defined as **Location-Sensitive Normative Internalism**. It is a specific configuration of objections that:

  1.  **Concedes** the Parity Principle regarding causal/functional roles.
  2.  **Denies** the Parity Principle regarding ontological/normative status.
  3.  **Grounds** the denial in a metaphysical condition of spatial or biological boundary, rather than functional capacity.

  It is distinct from the Coupling-Constitution fallacy because it does not dispute the tightness of the coupling. It is distinct from standard Biological Internalism because it does not necessarily claim biological systems function uniquely, only that they *normatively* uniquely.

  Ultimately, this position functions as a **Metaphysical Veto**. It halts the extension argument by stipulating that the 'mark of the mental' includes a location clause. In a debate grounded in functionalism, this is a category error. However, in a debate concerning epistemic responsibility and the nature of justification, it highlights a genuine tension: whether our normative practices (blame, credit, justification) are tied to the functional architecture of cognition or to the biological boundaries of the agent.

  If your goal is to overcome this objection, you cannot do so via functional examples alone, as the opponent has immunised their position against functional evidence. You must instead challenge the metaphysical premise: why should the skull be a normative boundary? If the function is identical, what work is the location doing other than satisfying a pre-theoretical intuition? The burden shifts to the opponent to explain why epistemic authority should supervene on geography rather than role.
