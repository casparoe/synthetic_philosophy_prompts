  # Appendix: The Collapse Diagnostic Instrument

  ## I. The Logical Space (Axes)

  Before applying the instrument, the user must acknowledge the four axes defining the logical space. These axes are treated as independent variables for the purpose of sorting, though empirical correlations exist.

  1.  **Locus of Change (Subject):** What is the primary variable that fails?
      *   *Options:* Governing Institution, Demographic Mass, Systemic Complexity, Administrative Legibility.
  2.  **Normative Valence (Evaluation):** Does the change constitute a decline in welfare?
      *   *Options:* Yes (Commoners/Elites), No (Neutral/Improvement), Mixed (Elite down/Commoner up).
  3.  **Temporality (Rate):** Is the change compressed within generational memory?
      *   *Options:* Catastrophic (<3 generations), Gradual (>5 generations).
  4.  **Continuity (Boundedness/Reversibility):** Is the unit discrete and is the change permanent?
      *   *Options:* Discrete/Permanent, Network/Reversible, Absorbed/Continuous.

  **Note on Rate vs. Evaluation:** Axis 2 (Valence) and Axis 3 (Rate) are logically distinct. A rapid revolution may improve welfare (High Rate, Positive Valence); a slow drought may ruin it (Low Rate, Negative Valence). However, the term "collapse" often conflates them. This instrument treats them as separate branching points to expose that conflation.

  ---

  ## II. The Diagnostic Instrument (Decision Tree)

  **Instructions:** Begin at Question 1. Compare your concrete case description to the schematized options provided. Select the option that best matches your empirical data. Follow the branch to the next numbered question until you reach a **Leaf (Theoretical Position)**.

  **Q1. Primary Signal (Subject)**
  Does the most archaeologically visible change resemble:
  *   **A.** The **Eastern Mediterranean (1200 BCE)**: Palaces burn and scripts vanish, but many settlements persist. *(Go to Q2)*
  *   **B.** The **Rapa Nui (Schematized)**: Monumental production stops and population estimates drop sharply, regardless of political structure. *(Go to Q3)*
  *   **C.** **Invented Case Alpha**: A polity whose entire population is replaced over two generations, but the administrative apparatus, archives, and tax system continue without interruption. *(Go to Q4)*

  **Q2. Institutional Continuity (Locus)**
  If following Branch A (LBA): Is the change defined by the loss of the *state* or the loss of *complexity*?
  *   **A.** The state apparatus disappears, even if villages remain. *(Go to Q5)*
  *   **B.** Settlement hierarchy flattens, but some governance remains. *(Go to Q6)*

  **Q3. Demographic vs. Cultural (Locus)**
  If following Branch B (Rapa Nui): Is the "collapse" the people or the style?
  *   **A.** It is a demographic crash; without people, there is no society. *(Leaf: Demographic Version)*
  *   **B.** It is a cultural shift; the people remain but stop building statues. *(Go to Q7)*

  **Q4. Administrative Legibility (Subject)**
  If following Branch C (Invented Alpha): If the tax system works but the people are new, did the society collapse?
  *   **A.** Yes, the "society" (the original people) is gone. *(Leaf: Demographic Version)*
  *   **B.** No, the "state" (the system) survived. *(Leaf: Institutional-Collapse Minimalism)*
  *   **C.** The category fails; this is conquest, not collapse. *(Leaf: Eliminativist Position)*

  **Q5. Normative Valence (Evaluation)**
  If following Branch 2A (State Loss): Did the median person's quality of life decline?
  *   **A.** Yes, skeletal health and security worsened. *(Go to Q8)*
  *   **B.** No, health improved after the elites vanished. *(Go to Q9)*

  **Q6. Complexity Loss (Subject)**
  If following Branch 2B (Hierarchy Flattening): Is the loss of marginal returns the key metric?
  *   **A.** Yes, energy capture per capita dropped. *(Leaf: Complexity-Loss View)*
  *   **B.** No, energy remained stable, just redistributed. *(Leaf: Transformationist Position)*

  **Q7. Reversibility (Continuity)**
  If following Branch 3B (Cultural Shift): If statue building resumes 200 years later, was it a collapse?
  *   **A.** Yes, the discontinuity defines the event. *(Go to Q8)*
  *   **B.** No, it was a pause or reorganization. *(Leaf: Transformationist Position)*

  **Q8. Temporality (Rate)**
  If following Branch 5A or 7A (Negative Valence/Discontinuity): Did the change occur within two generations?
  *   **A.** Yes, it was sudden. *(Leaf: Evaluative Position)*
  *   **B.** No, it was a slow decline over centuries. *(Leaf: Complexity-Loss View)*

  **Q9. Agency & Description (Legibility)**
  If following Branch 5B (Welfare Improved): How is the change described?
  *   **A.** **Invented Case Beta**: Participants describe the change in celebratory terms, outside observers file it as a catastrophe. *(Leaf: Legibility/Descriptive View)*
  *   **B.** **Invented Case Gamma**: A polity is absorbed intact into a neighbor; nothing changes locally except who receives the surplus. *(Leaf: Eliminativist Position)*

  **Q10. Boundedness (Unit)**
  (Reserved for Network Cases) Does your case resemble:
  *   **A.** **Invented Case Delta**: A trade network dissolves, but no specific polity ends. *(Leaf: Eliminativist Position)*
  *   **B.** A discrete polity with clear borders. *(Return to Q1)*

  ---

  ## III. Scoring Key: Theoretical Positions (Leaves)

  The leaves of the tree correspond to specific theoretical commitments regarding what "collapse" predicates.

  1.  **Demographic Version** (Q3A, Q4A)
      *   *Definition:* Collapse is primarily a population crash.
      *   *Awkward Commitment:* Must classify a genocide with intact institutions as a "societal collapse" while classifying a bloodless administrative vanishing as "survival."
  2.  **Institutional-Collapse Minimalism** (Q4B)
      *   *Definition:* Collapse is strictly the disappearance of the governing apparatus.
      *   *Awkward Commitment:* Must accept that a society can "collapse" even if 90% of the population lives exactly as before.
  3.  **Eliminativist Position** (Q4C, Q9B, Q10A)
      *   *Definition:* The category "collapse" does no comparative work and should be discarded.
      *   *Awkward Commitment:* Must describe the Late Bronze Age Eastern Mediterranean without using the term "collapse," relying solely on lower-resolution descriptors like "change."
  4.  **Transformationist Position** (Q6B, Q7B)
      *   *Definition:* Nothing really collapses; systems only reorganize.
      *   *Awkward Commitment:* Must treat the total loss of literacy and monumental capacity as semantically equivalent to a dynastic shift.
  5.  **Complexity-Loss View** (Q6A, Q8B)
      *   *Definition:* Collapse is a sharp reduction in socio-political complexity/energy capture.
      *   *Awkward Commitment:* Must classify slow, centuries-long degradations as the same category as sudden catastrophes if the endpoint complexity is identical.
  6.  **Evaluative Position** (Q5A, Q8A)
      *   *Definition:* Collapse is irreducibly normative; things must get worse for someone.
      *   *Awkward Commitment:* Cannot classify a "happy collapse" (e.g., liberation from a predatory state) as a collapse, even if the state vanishes instantly.
  7.  **Legibility/Descriptive View** (Q9A)
      *   *Definition:* Collapse is specifically the loss of a society's capacity to describe itself (literacy/bureaucracy).
      *   *Awkward Commitment:* Must classify a pre-literate society as incapable of "collapsing," or treat the loss of pottery styles as equivalent to the loss of scripts.

  *(Note: The Evaluative Position and Complexity-Loss View form a family often grouped as "Systems Collapse," distinguished here by the Rate axis.)*

  ---

  ## IV. Analysis of the Logical Space

  ### 1. Unoccupied Cells
  Three logical combinations within the axes (Subject, Valence, Rate, Continuity) yield no coherent theoretical position in current literature:

  *   **Cell 1: High Rate + Positive Valence + Institutional Continuity.**
      *   *Description:* A sudden change where life improves, but the government stays the same.
      *   *Diagnosis:* **Incoherent.** If the government stays and life improves, this is "Reform" or "Golden Age," not collapse. No position claims this is collapse.
  *   **Cell 2: Low Rate + Negative Valence + Legibility Gain.**
      *   *Description:* A slow decline in welfare where administrative record-keeping increases.
      *   *Diagnosis:* **Unattractive.** This describes a bureaucratic grind or stagnation (e.g., late Byzantium). While empirically possible, no "collapse" theory claims increased legibility marks a collapse, even if welfare drops.
  *   **Cell 3: Demographic Stability + Institutional Loss + Network Boundedness.**
      *   *Description:* No people die, no state ends, but a "network" dissolves.
      *   *Diagnosis:* **Unexplored.** This is the "Network Collapse" cell. It is rarely theorized because "network" lacks the discrete ontology required for "collapse" in most frameworks (see Q10).

  ### 2. The Rate vs. Evaluation Axis
  You asked whether Axis 3 (Rate) does independent work or collapses into Axis 2 (Evaluative).
  *   **Verdict:** They are **logically independent but empirically entangled.**
  *   **Restructuring:** I have kept them separate in the tree (see Q5 vs. Q8) to force the distinction. However, be aware that the **Evaluative Position** often smuggles Rate in as a proxy for Suffering (i.e., "It must be fast to be traumatic").
  *   **Risk:** If you define "Collapse" as "Suffering," Rate becomes secondary. If you define it as "System Failure," Rate becomes primary. The tree separates them at Q5 (Valence) and Q8 (Rate) to prevent this slippage. If you find your cases always cluster (Fast=Bad), your sample is biased toward catastrophe, not your definition.

  ### 3. Indistinguishable Leaves
  The instrument cannot separate the following pair:

  *   **Pair:** **Institutional-Collapse Minimalism** (Q4B) vs. **Legibility/Descriptive View** (Q9A).
  *   **Reason:** In the schematized cases, the disappearance of the "governing apparatus" (Minimalism) almost always entails the disappearance of "archives/scripts" (Legibility).
  *   **Assessment:** These are likely the **same position under two descriptions.** Minimalism describes the *structure* that vanishes; Legibility describes the *evidence* of that structure.
  *   **Separation Test:** To separate them, you would need a case where the bureaucracy vanishes but the literacy remains (e.g., a digital administration crash where people can still read). Without such a case, treat these leaves as a single "State-Disappearance" family.

  ### 4. Closing Note on Instrument Limits
  This instrument sorts *definitions*, not *truths*. If your case lands on the **Eliminativist Position**, the instrument does not tell you "This is not a collapse." It tells you "If you call this a collapse, you are adopting a category you theoretically reject." Use the leaves to clarify your own terminology in the dissertation chapter, not to adjudicate the history itself.
