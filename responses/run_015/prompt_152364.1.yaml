      *   *(b) Normative Weight:* Deciding if the intuition counts as evidence or error (e.g., is the "feeling" of non-physicality a bug or a feature?).
      *   *(c) The Export Problem:* Does solving the meta-problem solve/dissolve the hard problem, or does it leave the hard problem intact?

  3.  **Evaluate Against Constraints & Goals:**
      *   **Constraint:** No neuroimaging. This limits empirical source-tracking that relies on fMRI/EEG. It favors computational modeling, conceptual analysis, and behavioral/functional architecture.
      *   **Goal:** Artificial phenomenological reports. This is the key. We need to build agents that *say* they are conscious in a way that is meaningful. This requires knowing *what* to implement to generate the report, and *how to interpret* that report.
      *   **Timeframe:** 3 years. Needs tangible outputs, not just endless debate.

  4.  **Ranking Strategy:**

      *   **Priority 1: (a) Source-Tracking (specifically Functional/Computational Mechanisms).**
          *   *Why:* To build an agent that reports phenomenology, you need a blueprint of the mechanism that generates that report in humans. If you don't know *how* the brain generates the claim "I am conscious," you can't build it.
          *   *Tractability:* High for philosophers + cog sci without imaging. They can work on computational cognitive architectures (e.g., Global Workspace, Higher-Order Thought, Predictive Processing) that generate self-models.
          *   *Upstream/Downstream:* Extremely upstream for the artificial reporting goal. You need the mechanism before you can judge its normativity or exportability.
