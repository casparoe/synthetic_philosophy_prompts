      *   **Priority 2: (c) The Export Problem (Operationalized).**
          *   *Why:* Once you have the mechanism, you need to know what it *means* for the agent. If the agent says "I feel pain," is that a true report or a glitch? This determines the safety and ethics of the project.
          *   *Tractability:* Medium. It's conceptual, but needs to be tied to the model from (a).
          *   *Upstream/Downstream:* Downstream of (a), upstream of deployment.
          *   *3-Year Result:* A framework for "Functional Phenomenology" — criteria for when an artificial report warrants moral consideration or operational trust.

      *   **Priority 3: (b) Normative Weight.**
          *   *Why:* This is the most philosophical and least actionable for building agents. Debating whether the intuition is *veridical* is a rabbit hole that rarely yields engineering constraints.
          *   *Tractability:* Low for moving the needle. Philosophers have been doing this for decades without consensus.
          *   *Upstream/Downstream:* Downstream. It matters less *if* the intuition is veridical than *how* it functions in the system.
          *   *3-Year Result:* Likely just a paper arguing for illusionism or pragmatism. Low impact on the actual agent design.

  5.  **Identify Missing Lines:**
