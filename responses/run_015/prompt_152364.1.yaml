      *   *Control Theory/Self-Modeling:* Thomas Metzinger's Ego Tunnel. Crucial for artificial reports.
      *   *Linguistic/Pragmatic Analysis:* How do we *use* consciousness claims? (Wittgensteinian angle).
      *   *Alignment/Safety:* If the agent claims pain, do we shut it off? This is the "Artificial Phenomenological Reports" end-game.

  6.  **Identify Dead Ends:**
