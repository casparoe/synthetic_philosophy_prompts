      **MEMORANDUM**
      **TO:** Legacy Review Committee
      **FROM:** [My Name], Junior Member
      **DATE:** 1 March 2024
      **SUBJECT:** Recommendation on Disbursement of Legacy Fund

      **Recommendation**
      The Committee should recommend a hybrid allocation of the $12M Legacy Fund, splitting resources between direct restitution to lineal descendants and community reinvestment. We must reject the proposal for general scholarships and the implication that no disbursement is warranted. Specifically, I propose:
      1.  **$6 million in direct payments** to the forty documented living descendants of the enslaved individuals owned by the university and its benefactor.
      2.  **$6 million as an endowed fund** generating perpetual income for economic development in the two city neighborhoods where these descendants currently reside.
      Disbursement should occur within six months of presidential approval.

      **Rationale: What We Owe and to Whom**
      Our charge is to identify what the university owes and to whom. The historical record establishes that the university's founding capital was accumulated through the commodification of human beings. This creates a specific liability distinct from general societal racism. The debt is owed primarily to those whose ancestors were the specific instruments of this accumulation.

      Option (C), general scholarships, is insufficient. While beneficial, it dilutes the specific historical link. It treats the fund as diversity aid rather than restitution. The university does not owe Black students generally for this specific history; it owes the specific families whose labor and bondage generated the endowment.

      Therefore, Option (A) is morally necessary. However, Option (B) is also required to address the structural reality of the harm. Enslavement was not merely an individual injury but a communal destruction. By combining direct payment with place-based investment, we acknowledge both the specific lineage of the debt and the broader socioeconomic context in which that debt manifests today.

      **Addressing the Objections**
      Two arguments have stalled our progress. We must address them honestly to move forward.

      First, the commissioned economists report that descendants are not measurably worse off than Black families in the same counties whose ancestors were enslaved elsewhere. Three members conclude this dissolves the case for restitution. This finding is empirically significant but morally irrelevant to the question of liability.

      The economists measure *comparative disadvantage* relative to a control group. Restitution, however, is based on *unjust enrichment* and *specific wrongs*. If I steal $100 from you, I owe you restitution even if you subsequently inherit a million dollars from another source. My liability is determined by the act of theft, not by your current net worth relative to your neighbors. The university holds capital generated by the sale of human beings. That capital is tainted regardless of whether the victims' descendants are currently poorer than other Black families. The wealth gap may track twentieth-century policy, as the economists note, but the university's endowment tracks nineteenth-century trafficking. We cannot use broader structural racism to excuse specific institutional liability. To accept the economists' conclusion as a veto is to claim that diffuse systemic wrongs absolve specific historical ones. They do not.

      Second, one member raised the non-identity problem: that descendants owe their existence to the enslavement and thus cannot claim harm. While philosophically intricate, this argument collapses under practical moral scrutiny. As the member conceded when pressed, accepting this logic would exonerate any wrongdoer whose act was a necessary condition for the victim's existence. If a parent abuses a child, they cannot claim the child owes them gratitude for procreation. Similarly, the university cannot claim the descendants should accept their status because the injustice was a precondition for their birth. This argument proves too much and must be rejected as incompatible with any coherent theory of moral responsibility.

      **Allocation and Timeline**
      The $6 million allocated to descendants amounts to approximately $150,000 per individual. This is not a "price" on slavery, which is incalculable, but a disgorgement of specific ill-gotten gains. It should be paid as a lump sum to allow recipients autonomy over repair.

      The remaining $6 million should seed a community endowment. The principal must remain intact, with yields directed toward housing stabilization, small business grants, and educational infrastructure in the two identified neighborhoods. This addresses the economist's insight—that wealth is structural—without accepting their conclusion that specific liability is void.

      **Conclusion**
      We face a choice between symbolic gestures and substantive repair. Scholarships are symbolic; inaction is cowardly. This hybrid model respects the specific history of the 310 enslaved individuals while acknowledging the communal nature of the harm. The economist data explains *why* the harm persists structurally, but it does not explain away *who* caused it. We owe this debt to the descendants and their community. I urge the Committee to adopt this recommendation and forward it to the President by the 15 March deadline.

