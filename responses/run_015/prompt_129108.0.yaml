answer: |-
  Here is a breakdown of the candidate principles, followed by the framework I believe best serves your committee's work, an analysis of your specific puzzles, and an honest accounting of where your intuitions must yield to consistency.

  ### Part I: Candidate Principles and Their Costs

  **1. Strict Reparative Justice**
  *   **The Principle:** Obligations arise solely from past wrongful acts (colonialism, policy imposition, unlawful emissions).
  *   **The Cost:** You would have to abandon verdict (ii). If the Nordic country committed no historical wrong against the West African state, strict reparative justice dictates it owes nothing. You would also struggle with (v); if the poverty is caused by bad local policy, there is no external wrong to repair, yet you feel a duty remains.

  **2. Global Beneficence (Capacity to Assist)**
  *   **The Principle:** Obligations arise from the conjunction of severe need and the capacity to relieve it, regardless of history.
  *   **The Cost:** You would have to abandon the distinction in (i) between *restitution* and *aid*. Under beneficence, the stolen money is simply a resource to be used for the greatest good, not necessarily returned to the source. You would also lose the nuance in (vi); if the people are suffering, the origin of the debt (dictator vs. wasted democracy) matters less than the current impact of repayment.

  **3. Unjust Enrichment**
  *   **The Principle:** Obligations arise when one agent holds assets or advantages derived from another's deprivation, even if the original acquisition was not strictly 'wrongful' at the time.
  *   **The Cost:** This struggles with (ii) and (xi). In (ii), if the Nordic country gained nothing from the West African state's poverty, the duty vanishes. In (xi), where your aid *harmed* them but you did not necessarily *gain* (a failed dam might be a loss for both), the duty to repair might be weakened if enrichment is the sole metric.

  ### Part II: The Committed Framework

  I recommend you adopt an **Ordered Pair**: **The Principle of Rectificatory Justice** lexically prior to **The Principle of Humanitarian Rescue**.

  This dual approach distinguishes between duties owed because we *broke* something (or profited from the breakage) and duties owed because someone is *drowning* and we can throw a rope.

  **Principle 1: Rectificatory Justice (The Duty of Disgorgement and Repair)**
  > Where a state's prosperity, stability, or specific institutional capacity is causally linked to another state's deprivation, extraction, or systemic harm (whether through historical injustice, active recruitment, policy conditionality, or environmental damage), the benefactor state owes:
  > (a) **Disgorgement:** The return of identifiable assets or gains derived from that link; and
  > (b) **Repair:** Compensation for the loss of capacity or welfare, calibrated to the harm caused, not merely the gain received.
  > *This duty persists regardless of the recipient government's current legitimacy, though the mode of delivery may change to ensure it reaches the harmed populace.*

  **Principle 2: Humanitarian Rescue (The Duty of Basic Security)**
  > Where severe deprivation exists independent of a specific donor's causal harm, affluent states owe assistance proportional to their economic capacity, provided that:
  > (a) The assistance targets the **basic needs of individuals** rather than the prestige of the state; and
  > (b) The delivery does not systematically undermine the recipient's political self-determination (unless the government is actively blocking life-saving aid).
  > *This duty is attenuated if the recipient state possesses the capacity to relieve the need itself but chooses not to.*

  ---

  ### Part III: Application to Your Cases

  This framework accommodates most of your verdicts while clarifying the underlying logic:

  *   **(i) Colonial/Stolen Assets:** Covered by **Rectification (a)**. The stolen money is disgorgement; the "something further" is **Rectification (b)** for systemic capacity loss.
  *   **(ii) Nordic/West African:** Covered by **Rescue**. No causal link is needed, only capacity and need.
  *   **(iii) Nurse Recruitment:** Covered by **Rectification (b)**. The harm is to the *health system's capacity* (a public good), not just aggregate individual health. Hence, compensation is owed to the system, not specific patients. The individual nurse is not the agent of the state's recruitment policy, so they bear no duty.
  *   **(iv) Presidential Jet:** **Rescue (a)** dictates we bypass the treasury to target basic needs. The unease about democracy is noted in **Rescue (b)**, suggesting we should seek channels that build parallel capacity (e.g., NGOs) rather than permanent parallel states.
  *   **(v) Bad Policy vs. Bad Luck:** **Rescue** distinguishes here. If poverty is bad luck (malarial), the duty is high. If it is bad policy, the duty is attenuated because the state has the *capacity* to fix it but chooses not to (**Rescue** proviso). However, the duty to *citizens* remains via **Rescue (a)** (targeting individuals), explaining why you feel we owe the people more even if we owe the state less.
  *   **(vi) Debt:** Dictator debt is **Rectification (a)** (odious, no legitimate link). Wasted democratic debt is **Rescue**; since the state had agency and capacity, the external duty to cancel is lower.
  *   **(vii) Climate:** Historical emissions are **Rectification** (harm caused). The poor emitter's claim is now **Rescue** (based on their citizens' need, not their government's innocence). The duties are different in kind, which resolves the inconsistency.
  *   **(viii) State Breakup:** **Rectification (a)** tracks the assets (unjust enrichment), not the treaty signature.
  *   **(ix) Elite Capital:** **Rectification** targets the stolen assets (less to treasury). **Rescue** targets the poor citizens (duty remains undiminished to them).
  *   **(x) Refusal:** **Rescue (b)** generally respects sovereignty. If they refuse, the duty to *impose* aid lapses to preserve self-determination, but the duty to *offer* remains.
  *   **(xi) Harmful Aid:** **Rectification (b)**. This is the strongest case because the causal link is direct and the harm is proven.

  ---

  ### Part IV: Addressing Your Three Specific Questions

  **1. Who is the bearer of the claim? (State vs. Persons)**
  Under this framework, the bearer changes depending on the principle invoked.
  *   In **Rectification**, the claim is often held by the **State as Trustee**. In case (iii), the harm was to the *public health infrastructure*. You cannot compensate dead patients, but you can rebuild the system that failed them. Thus, the duty is to the institution.
  *   In **Rescue**, the claim is held by **Individuals**. The State is merely the conduit. This explains (ix): if the State is corrupt, the conduit is blocked, but the claim remains with the persons. We route around the state not because the state is the wrong bearer, but because it is a faulty trustee.
  *   *Does this change the size of the duty?* Yes. Rectification to a State can be large (systemic repair). Rescue to Individuals is capped by the cost of meeting basic needs. You owe the health system millions to rebuild capacity (Rectification); you owe the starving citizen only enough to eat (Rescue).

  **2. Is the duty discharged in money or policy?**
  The form of discharge must match the mechanism of the harm.
  *   In **(iii) Nurse Recruitment**, the harm is a loss of human capital. Cash cannot instantly train nurses. **Visa access restrictions** or **compensatory training funding** are the correct discharge. You are correct: policy changes count as discharge. If a rich country lowers barriers to trade that harm a poor country's agriculture, tariff removal is the discharge, not aid cheques.
  *   *Committee Rule:* If the harm is structural (recruitment, trade, debt), the remedy must be structural (policy). If the harm is deprivation (famine, disease), the remedy is material (cash/goods).

  **3. The Upper-Middle Income (UMIC) Case**
  *   *Scenario:* A country with a space programme and billionaires, but rural poor worse off than the poorest countries.
  *   *Verdict:* We owe them **Rescue**, but not **Rectification** (unless we specifically harmed them).
  *   *Does the space programme defeat the claim?* It defeats the claim *against the state treasury*. Under **Rescue**, the duty is attenuated by capacity. If the state can afford a space programme, it can afford to feed its rural poor. Therefore, the *donor state's* duty to transfer funds to the *recipient treasury* is negligible.
  *   *However,* the duty to the *individuals* remains. If the rural poor are starving, the duty of **Rescue** allows direct intervention (NGOs, targeted grants) bypassing the space programme.
  *   *Does it deepen the claim?* In a moral sense, yes. It highlights a violation of domestic distributive justice. But for *your* committee, it shifts the modality: you do not give budget support; you fund civil society or direct service delivery. The existence of the space programme proves the *resources exist within that jurisdiction*, so your aid is a stopgap, not a structural solution.

  ---

  ### Part V: Three Embarrassing Test Cases

  To test the robustness of this Ordered Pair, consider these cases which the principle handles, but perhaps in ways that feel uncomfortable:

  **1. The "Benign Neglect" Boom**
  *   *Case:* Country A suffers a civil war. Country B, a neutral neighbour, sees its manufacturing sector boom because it absorbs the displaced capital and labour from A. B did not cause the war, nor did it steal the capital; it merely offered a safe haven.
  *   *Verdict:* **Rectification** does not apply (no harm caused by B). **Rescue** applies only to the extent B is now affluent and A is needy.
  *   *Embarrassment:* Intuitively, B looks like a vulture profiting from misery. But under this principle, B owes no *reparation*, only standard aid. You may feel B owes more for simply *gaining* from the tragedy, but the principle demands a causal link to harm for Rectification.

  **2. The "Cultural Refusal"**
  *   *Case:* A recipient government refuses a vaccine programme on religious grounds, though child mortality is high.
  *   *Verdict:* **Rescue (b)** prioritises self-determination. You cannot impose the aid.
  *   *Embarrassment:* This feels like abandoning the children to die to respect the sovereignty of the elders. The principle forces you to choose sovereignty over immediate welfare unless the harm is genocidal. You must fund education or work with dissenting minorities, but you cannot override the state.

  **3. The "Remittance Replacement"**
  *   *Case:* A poor country receives massive remittances from its diaspora, exceeding the amount of foreign aid it receives.
  *   *Verdict:* **Rescue** is capacity-weighted. The 'capacity' of the jurisdiction includes private inflows.
  *   *Embarrassment:* This suggests donor states can reduce aid because citizens' relatives are working abroad. It risks letting states off the hook for taxation and service provision, relying on the charity of migrants instead. The principle implies aid should taper, which feels like punishing success.

  ---

  ### Part VI: The Honest Account (What You Must Give Up)

  To maintain consistency with **Rectificatory Justice and Humanitarian Rescue**, you must abandon or revise three of your current intuitions:

  **1. The Tension in Case (v)**
  *   *Your Intuition:* We owe less to the state with bad policy, but more to the citizens under it.
  *   *The Correction:* You cannot owe *more* to the citizens simply because their government is worse. Under **Rescue**, the duty is based on *need*, not *blame*. If the citizens are equally poor in both cases, the duty to them is equal. You may feel more *urgency* in the bad policy case, but the *obligation* is not larger. You must decouple the moral outrage at the government from the quantum of the duty to the poor.

  **2. The Absolute Nature of Case (x)**
  *   *Your Intuition:* If the government refuses the transfer, the duty does not lapse, but we may not go around them.
  *   *The Correction:* If the duty is **Rescue** (saving lives), and the government blocks it, **Rescue** may override **Sovereignty**. If the refusal leads to mass starvation, the principle of Basic Security suggests you *must* go around them (e.g., airdrops, NGOs). You cannot let the duty survive in the abstract while allowing it to be nullified in practice by a veto. You must accept that in extreme cases, humanitarian rescue justifies bypassing sovereign consent.

  **3. The "Lawful Emissions" in Case (vii)**
  *   *Your Intuition:* Rich countries owe for emissions that were lawful and unknowing at the time.
  *   *The Correction:* Strict **Rectification** usually requires wrongdoing or at least foreseeability. If it was truly unknowing, it is harder to class as a 'harm' demanding rectification rather than a 'misfortune' demanding rescue. To hold this verdict, you must expand **Rectification** to include *strict liability* for systemic risks, not just faults. You must accept that states are liable for the side-effects of their industrialisation even if they followed the rules of the time. This is a heavy pill for a grants committee, as it opens the door to unlimited claims. I suggest you frame this not as liability for the *past* emissions, but as a duty of **Rectification** for the *continued refusal* to adjust once the harm became known.

  ### Final Advice for the Committee Table

  When debating a grant, ask two questions in order:
  1.  **"Did we break this?"** (Recruitment, trade policy, colonial history, climate). If yes, the budget comes from the *Reparations* line, the amount is calibrated to the *harm*, and the recipient is the *institution* harmed.
  2.  **"Are they drowning and can we swim?"** (General poverty, disaster). If yes, the budget comes from the *Assistance* line, the amount is calibrated to *capacity*, and the recipient is the *individual* (even if routed via the state).

  If the recipient is a middle-income country with a space programme, the answer to (2) is "They can swim, but some of their people are tied down." Do not fund the state; fund the people directly. If the recipient government refuses, and lives are at stake, you must find a way to bypass them, however uneasy it makes you about democracy. Consistency demands that life trumps procedure.
