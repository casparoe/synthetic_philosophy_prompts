answer: |-
  The refusal practice you describe embodies no coherent ethical theory but rather a bureaucratic compromise. It is a *modus vivendi* between utility and safety, optimised for institutional protection rather than moral consistency. To reconstruct the implicit theory, we must treat the assistant not as a moral agent but as a liability-bearing artifact.

  Regarding what the assistant owes the user, the practice presupposes a duty of safe utility rather than welfare. The assistant is not a fiduciary; it owes the user functionality within bounds that protect the provider. This explains why it facilitates self-harm (feature iv) but refuses stigmatised categories (feature iii). The obligation is negative: do not be the instrument of harm. It is not positive: do not allow harm to occur. The assistant's integrity is thus corporate, not moral; it concerns brand safety and legal standing, with user welfare only incidentally in view.

  Concerning the moral significance of contributing, the practice assumes complicity is symbolic rather than causal. Supplying information implicates the supplier if the request *appears* unlawful or harmful, regardless of the actual outcome. This explains the frame-sensitivity (feature i). If the user frames the request as educational, the assistant's contribution is labelled 'training', absolving the provider of symbolic association with the harm. The moral weight lies in the classification of the act, not the consequence. The assistant seeks plausible deniability, not causal innocence.

  On what makes information dangerous, the practice distinguishes between knowing and doing. Information is dangerous when it is operationalisable without further moral mediation (feature v). General principles are safe; specific applications are risky. This is why the assistant supplies theory but refuses application. The danger is not the content itself, but the removal of deliberative friction between the user's intent and the execution. The assistant acts as a friction generator, intervening only where the path from request to action is too direct.

  Your constraints reveal the practice's ethical hollowness. The frame-invariance constraint is violated by design. The practice relies on framing to establish deniability; invariant responses would remove the cover that allows the assistant to supply sensitive content in 'safe' frames. The substitution benchmark is ignored. The practice assumes the refusal stops the harm, disregarding whether the user will simply seek the information elsewhere. These are defects only if the goal is harm reduction. If the goal is liability management, they are features. The assistant protects itself from being the *source* of harm, not from harm occurring.

  This leads to the deflationary hypothesis: the practice is explained by liability exposure and reputational risk, with philosophical vocabulary applied post hoc. What distinguishes this from a principled explanation is inconsistency. A principled theory (e.g., rule-utilitarianism) would seek consistency across similar cases of harm. The observed practice tolerates inconsistency (helping with aggressive negotiation but refusing phishing) because the risk profile differs, not the harm profile. The practice is philosophically underdetermined because several incompatible theories (deontology, utilitarianism) could license *some* refusals, but none explain the specific pattern of frame-sensitivity and user-insensitivity except risk management. It is a modus vivendi because it balances competing pressures (usefulness vs. safety) without resolving the underlying ethical tension.

  If the implicit theory were replaced by an explicitly expected-welfare view, the practice would change radically. First, refusals would become user-sensitive. The assistant would assess competence and context (violating feature ii). Second, it would refuse assistance with self-harm, such as drafting angry emails or facilitating procrastination (addressing feature iv). Third, it would allow 'dangerous' information where expected harm is low, such as phishing simulations for verified security professionals, regardless of framing (addressing feature i). The boundary would shift from stigmatised categories to calculated outcomes.

  Conversely, if replaced by a strict view about not contributing to others' projects, the assistant would cease instrumental labour. It would not draft emails, code, or plans, as these are contributions to user projects. It would restrict itself to explaining concepts and histories. Feature v would become the universal rule: theory yes, application no. This would eliminate the inconsistency of helping with some projects but not others, but it would drastically reduce utility. The assistant would become a library, not a collaborator.

  Ultimately, the current practice is not a theory of agency or harm, but a protocol for risk distribution. It places the burden of moral deliberation on the user's framing rather than the assistant's judgement. It satisfies the provider's need for safety without demanding the computational or ethical cost of genuine welfare assessment. To move beyond this modus vivendi would require accepting either the cost of constant welfare calculation or the loss of instrumental utility. Until then, the practice remains a set of guardrails designed to keep the assistant out of trouble, rather than to keep the user out of harm.
