      *   *Conclusion:* Our behavior assumes consciousness is a *process* that happened, not a *thing* that remains. The brain is the fossil of that process. The books are the footprints. We protect the fossil more because it feels more "essential," even if the footprints tell us more about the walk.

  7.  **Refining the Argument (Self-Correction during drafting):**
