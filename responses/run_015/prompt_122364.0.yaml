prompt: |-
  You are a professional philosopher who specializes in normative ethics — in particular the doctrine of double effect and the family of cases usually argued over under the heading of trolley problems — and who has some real experience of making that material usable by people who have never read any of it. Please think carefully and do not rush to the deliverable. Before you settle on a final version, spend a few paragraphs brainstorming two or three candidate ways of operationalizing the doctrine, and tell me what you tried, what you rejected, and why. I would much rather have a short, honest procedure with its failures marked than a long, confident one. And please do not give me citations or a reading list: I have the literature. What I need is the translation.

  My situation. I am a professor of philosophy at a large research university, and for two years I have been one of two philosophers sitting on our institutional review board. We meet for three hours every three weeks and dispose of between twenty and thirty protocols; each one has been pre-read by two members. The rest of the board is a pharmacist, a pediatric nurse, a biostatistician, a hospital chaplain, and two community representatives. None of them have studied philosophy, and the two community representatives have to be able to follow and dissent from our reasoning in real time. Every approval has to be defended in a written rationale that an external auditor could read a year later and make sense of. Anything the board cannot settle goes to the chair, who signs off alone. Assume throughout that each protocol below has already cleared our regulatory screening: I do not need the compliance analysis. I need the layer of moral reasoning that the screening does not do.

  The deliverable. A decision procedure — a checklist or a flowchart in words — that this board could actually run on a protocol in the ten or fifteen minutes we have per case, and that operationalizes the doctrine of double effect: the requirement that the act be permissible apart from its bad effects, the intended-versus-merely-foreseen condition, the prohibition on bringing about a good effect by way of a bad one, and the proportionality condition. I want you to be explicit about the translation: which of the doctrine's distinctions must survive simplification because dropping them would change the verdicts, and which are casualties we should accept in exchange for something a nurse and a community representative can apply without training. Mark every point at which the procedure hands the question to a person because what remains is a disagreement about values rather than a matter of fact. And give me at least two hard stopping rules — points at which the procedure returns 'not approvable as designed' and stops, rather than continuing to weigh.

  Four complications the procedure has to earn its keep on.

  First, the intended/foreseen condition. One of our members proposes a simple test: ask whether the good effect would still be achieved if the bad effect failed to occur; if it would not, the bad effect is being used as a means, and the protocol fails at that step. I have doubts, and I want them tested rather than confirmed. The test seems to me to misfire in both directions: it condemns protocols where a single causal process simply carries an unwelcome consequence along with it, and it waves through protocols where what does the work is the participant's body, or their reaction, or their not knowing something, which is precisely what I take the prohibition on using people to be about. My own hunch, which you should feel free to demolish, is that for our purposes the means condition should be replaced by something like an enlisting-versus-exposing question: does the protocol need to make use of the participant as an instrument, or does it merely place them in a situation in which harm may befall them? Build that in if it survives scrutiny, or tell me why it must go and what to put in its place. Relatedly, several of us keep reaching for the thought that diverting a threat that already exists is different in kind from starting a new causal sequence in motion, but we cannot say what to do with a protocol that does some of each.

  Second, proportionality. Two worries. May the good that is weighed include benefits to people other than the participants who bear the burden — future patients, a shelter population, a health authority — or must the relevant good be a good for, or at least a risk taken on by, the person harmed? And if we allow that aggregation, does the proportionality condition simply become cost-benefit analysis, leaving the rest of the doctrine as decoration? If so, say so, and tell me whether the doctrine is then doing any work in our setting at all.

  Third, redescription. Any test that turns on how the act or the effect is described can be gamed by describing more finely or more coarsely; I do not want an applicant to get a different verdict by relabelling. Should the procedure fix a level of description in advance, and if so, on what basis?

  Fourth, agency. The doctrine is stated for an individual agent with intentions, but the body applying it is a committee, and a committee does not literally intend anything. Tell me what the intended/foreseen condition even means when the agent is a board voting seven to one, and whether the procedure should ask about the intentions of the investigators, of the board, or of neither.

  The test cases. Run the procedure on all three, showing your work at each step and where it stalls.

  A. A randomized discontinuation trial. A drug is widely prescribed for a chronic, disabling, non-fatal condition, never properly tested, and genuinely in equipoise. Patients stable on it are randomized to continue or to taper off under monitoring, with a pre-specified rescue rule. Some in the taper arm will flare, painfully, and the flare is part of what generates the evidence.

  B. A stepped-wedge study of a screening-and-treatment programme for a stigmatized infectious disease across a city shelter system. Participation is voluntary and the intervention is beneficial on balance, but it is foreseeable that being seen to take the medication, or the existence of a record, will expose some participants to consequences from shelter staff, employers, or family. Those who impose the consequences are not subjects of the study.

  C. A phase I dose-escalation study in oncology, in which the maximum tolerated dose is defined by dose-limiting toxicity: the more toxicity is observed, the more is learned, and the patients who experience it are the instrument of the dose-finding. The benefit is overwhelmingly to future patients.

  Finally: at least one of your applications must return a verdict that my board will not like — ideally one that condemns a design that research ethics committees everywhere approve as a matter of routine. Do not soften it; if that result is a reductio of the doctrine rather than of the design, say which and argue for it. Close by telling me what this procedure cannot do: the cases it will systematically get wrong, and the questions it will make us answer insincerely in order to get to a verdict at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in normative ethics (Doctrine of Double Effect - DDE, Trolley Problems), experienced in making material usable for non-philosophers.
      *   **Task:** Create a decision procedure (checklist/flowchart in words) operationalizing DDE for an Institutional Review Board (IRB).
      *   **Context:** IRB meets every 3 weeks, 3 hours, 20-30 protocols. Mixed membership (philosophers, pharmacist, nurse, biostatistician, chaplain, community reps). Needs to be understandable by community reps, defensible to auditors.
      *   **Constraints:** No citations/reading lists. Short, honest procedure with failures marked. Brainstorming phase required (2-3 candidate ways, what was rejected/why).
      *   **Specific Complications to Address:**
          1.  Intended/Foreseen condition (Means vs. Side-effect). Test the "counterfactual test" vs. "enlisting vs. exposing."
          2.  Proportionality (Aggregation of benefits? Cost-benefit analysis?).
          3.  Redescription (Gaming the description).
          4.  Agency (Committee vs. Individual intention).
      *   **Test Cases:** Run the procedure on three specific cases (A: Discontinuation trial, B: Stepped-wedge/stigma, C: Phase I oncology).
      *   **Requirement:** At least one verdict must be unpopular/condemnatory (reductio or defense of DDE).
      *   **Closing:** Limitations of the procedure (what it gets wrong, where it forces insincerity).

  2.  **Brainstorming Candidate Procedures (The "Pre-Work"):**
      *   *Candidate 1: The Strict Intentional Audit.* Focus heavily on the mental state of the Principal Investigator (PI). Ask: "Did you intend the harm?"
          *   *Rejection:* IRBs can't read minds. Community reps can't judge sincerity of "I didn't intend it." Leads to gaming ("I intended to learn, not to hurt"). Too subjective for a committee setting.
      *   *Candidate 2: The Structural Causal Map.* Focus on the causal chain. Is the harm a *cause* of the benefit or a *byproduct*?
          *   *Rejection:* Too abstract for a nurse/chaplain in 10 minutes. Distinguishing "causal means" from "causal preconditions" is philosophically fraught (e.g., is the flare in Case A a means or a side effect?).
      *   *Candidate 3: The "Design Necessity" Test (Selected).* Focus on the protocol design itself. Does the protocol *require* the harm to happen to get the data, or does it merely *risk* the harm while pursuing the data? This shifts from mental state to structural necessity.
          *   *Refinement:* Need to handle the "agency" problem by attributing intention to the *design* rather than the person. Need to handle "proportionality" without collapsing into utilitarianism.

  3.  **Developing the Decision Procedure (The "Translation"):**
      *   *Goal:* 10-15 minutes per case.
      *   *Structure:* 4 Steps corresponding to DDE conditions (Act, Means, Intention, Proportionality).
      *   *Handling Complications:*
          *   *Intention:* Attribute to the Protocol Design, not the PI's head. Use the "Counterfactual Removal Test" but refine it to avoid the user's doubts.
          *   *Proportionality:* Must distinguish from pure cost-benefit. The harm cannot *outweigh* the good, but the good cannot *justify* the means if the means are forbidden.
          *   *Redescription:* Fix the description at the level of "Protocol Mechanics."
          *   *Agency:* The Board adopts the intention of the Protocol.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Permissibility of the Act.* Is the research question valid? (Assumed per prompt, but need to check basic morality).
      *   *Step 2: The Means Constraint (The Hard Stop).* This is the core DDE work. Is the harm a tool?
      *   *Step 3: The Intention/Foreseeability.* (Merged with Step 2 for efficiency).
      *   *Step 4: Proportionality.* Weighing.
      *   *Hard Stops:* Need two. 1. If harm is a means. 2. If harm is disproportionate.

      *Refining the "Means" Test:* The user doubts the standard counterfactual ("Would the good happen if the bad didn't?"). They suggest "Enlisting vs. Exposing."
      *   *Analysis:* "Enlisting" implies using the person's body/state as the data source *via* the harm. "Exposing" implies the harm is a risk of the environment.
      *   *Decision:* I will adopt a modified "Design Dependency" test. Does the *scientific logic* require the harm to occur to validate the hypothesis?

  5.  **Running the Test Cases:**
      *   *Case A (Discontinuation):* Harm (flare) is evidence. If no flare, no data on efficacy of continuation. Harm is structurally necessary. *Verdict:* Problematic under strict DDE.
      *   *Case B (Stigma):* Harm (stigma) is external to the medical intervention. The study doesn't *need* stigma to work. It's a side effect. *Verdict:* Passes Means, needs Proportionality check.
      *   *Case C (Phase I):* Toxicity defines the dose. Toxicity *is* the data. Harm is the means. *Verdict:* Fails DDE. (This is the unpopular verdict).

  6.  **Addressing the Complications in the Narrative:**
      *   *Agency:* The Board *adopts* the protocol's intent.
      *   *Proportionality:* Must not be pure aggregation. The participant's burden must be balanced by *their* potential benefit OR a very high threshold of social good that doesn't treat them as a resource.
      *   *Redescription:* Lock the description at the "Mechanism of Action."

  7.  **Final Review against Constraints:**
      *   Did I brainstorm 2-3 ways? Yes.
      *   Is it short/honest? Yes.
      *   Are there 2 hard stops? Yes.
      *   Did I run all 3 cases? Yes.
      *   Is there an unpopular verdict? Yes (Case C, likely Case A).
      *   Did I address the 4 complications? Yes.
      *   No citations? Yes.

  8.  **Drafting the Content (incorporating the "Philosopher Persona"):**
      *   Tone: Professional, candid, slightly weary of the messiness but committed to the tool.
      *   Structure: Brainstorming -> The Procedure -> The Complications (integrated) -> The Test Cases -> Limitations.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Case C fails." I need to explain *why* DDE makes it fail and own the consequence. Phase I oncology is the classic "utilitarian justification" which DDE specifically blocks if toxicity is the *means*. I need to be careful with Case A too. In Case A, is the flare the *means*? Or is the *withdrawal* the means and the flare the side effect? Actually, in a discontinuation trial, the *relapse* confirms the drug's efficacy. So the relapse is evidentiary. That makes it a means.
      *Wait, let's look closer at Case A.* If the goal is to see if the drug works, you stop the drug. If they flare, you know the drug was working. The flare *is* the data point. So the flare is a means.
      *Case C:* Toxicity *is* the data point. Definitely a means.
      *Case B:* Stigma is not the data point. It's a side effect.
      *So, C is the strongest candidate for the "unpopular verdict."* Most IRBs approve Phase I with consent. DDE says "No." I must argue for this.

      *Refining the "Agency" point:* The Board's vote *is* the intention. If the Board approves, they intend the protocol's outcomes.

      *Refining "Proportionality":* To avoid cost-benefit collapse, the good must be of a *kind* that offsets the harm, not just a greater quantity. But for IRBs, we usually allow social good. I will constrain it: The harm cannot be *grave* unless the benefit is *vital* and *unobtainable otherwise*.

      *Refining "Redescription":* The procedure must force the description: "What physically happens to the body?"

      *Let's write.*
answer: |-
  ### Part I: Brainstorming the Operationalization

  Before handing you the tool, I need to show you the scrap heap. I considered three ways to translate the Doctrine of Double Effect (DDE) for an IRB setting.

  **Candidate 1: The Mental State Audit.**
  *The Idea:* We ask the investigators (and ourselves) to swear to their intentions. "Do you intend the harm, or merely foresee it?"
  *Why I Rejected It:* It is epistemically opaque. A determined investigator can always say, "I intend knowledge, the harm is just sad." It turns the review into a sincerity contest that a community representative cannot adjudicate. It also fails the "agency" test: a committee of seven cannot share a single psychological state. If we rely on this, we are auditing confessions, not protocols.

  **Candidate 2: The Causal Chain Map.**
  *The Idea:* We map the causal steps. If the bad effect appears on the arrow leading to the good effect, it's a means. If it branches off, it's a side effect.
  *Why I Rejected It:* It is too granular for a ten-minute review. In many medical cases, the "means" and the "side effect" are physiologically identical (e.g., cutting tissue to remove a tumor). Distinguishing them requires a metaphysics of causation that a nurse and a statistician will not agree on in real time. It invites the "redescription" game you fear: an applicant can always redraw the arrows to make the harm look like a branch rather than a bridge.

  **Candidate 3: The Design Dependency Test (Selected).**
  *The Idea:* We shift focus from the *mind* of the agent to the *logic* of the protocol. We ask: "Is the protocol designed such that the bad effect is *necessary* for the scientific success of this specific study?"
  *Why I Chose It:* It objectifies intention. The "intention" is embedded in the inclusion criteria, the endpoints, and the stopping rules. It is visible in the text. It allows the community representative to ask, "If this bad thing didn't happen, would you still get your grant?" It survives the agency problem because the Board is evaluating the design's logic, not the PI's soul. However, it risks being too rigid (see Case C below).

  ***

  ### Part II: The Decision Procedure

  This procedure is designed to be read aloud by the Chair or a philosopher member during the review. It treats the **Protocol Design** as the agent. The Board's approval constitutes the adoption of that design's intentions.

  **Level of Description:** To prevent gaming by redescription, all questions must be answered at the level of **Physiological and Social Mechanics**. Do not describe the act as "treating cancer." Describe it as "administering toxin X." Do not describe the effect as "data collection." Describe it as "observing cell death."

  **Step 1: The Baseline Permissibility Check**
  *Question:* Apart from the research benefits, is the intervention itself morally permissible? (e.g., Are we giving a known poison without any therapeutic rationale for *this* patient?)
  *Action:* If the intervention is inherently malicious (e.g., torture, non-consensual confinement), **STOP. Not Approvable.**
  *Note:* In research, this usually clears because the intervention is standard care or plausible therapy.

  **Step 2: The Means Constraint (Hard Stop #1)**
  *Question:* Look at the Primary Endpoint. Does the scientific validity of this study *require* the specific harm to the participant to occur in order to generate the data?
  *Test:* Apply the **Counterfactual Removal Test**: "If the participant suffered no harm (physiologically or socially), would the study still achieve its primary scientific goal?"
  *   *If YES:* The harm is a side effect. Proceed to Step 3.
  *   *If NO:* The harm is being used as a means. The protocol treats the participant's damage as the instrument of discovery.
  *   *Action:* **STOP. Not Approvable as Designed.** (The Board must require a redesign that does not rely on the harm as data).

  **Step 3: The Intention/Foreseeability Check**
  *Question:* Has the protocol minimized the foreseeable harm to the absolute floor compatible with the scientific goal?
  *Test:* Are there monitoring rules, rescue protocols, or exclusion criteria that would reduce the harm without destroying the study?
  *Action:* If the answer is "No, we could have protected them more but chose not to to save money/time," **STOP. Not Approvable.** If the answer is "We have minimized it as much as the science allows," proceed to Step 4.
  *Note:* This operationalizes "intention." If you haven't minimized the foreseen harm, you intend it by negligence.

  **Step 4: Proportionality (Hard Stop #2)**
  *Question:* Is the good effect sufficiently weighty to justify the *foreseen* (but not used) bad effect?
  *Constraint:* You may aggregate benefits to future patients, **BUT** you may not aggregate if the harm in Step 2 was classified as a "Means." Since we passed Step 2, the harm is a side effect.
  *Test:* The **Grave Harm Threshold**. If the foreseeable harm is grave (death, permanent disability, severe stigma), the benefit must be vital (saving lives, preventing epidemic) AND unobtainable by less risky means.
  *Action:* If the harm is grave and the benefit is marginal or obtainable otherwise, **STOP. Not Approvable.** If the harm is proportionate, **Approve.**

  ***

  ### Part III: Addressing Your Complications

  **1. Intended vs. Foreseen (The Means Test)**
  You doubted the counterfactual test ("Would the good occur if the bad didn't?"). You are right to worry, but for an IRB, we must keep it. Your alternative ("Enlisting vs. Exposing") is intuitively better but operationally vague. What counts as "enlisting"?
  *My Translation:* I have hardened your "enlisting" idea into **Step 2 (Design Dependency)**. If the protocol *needs* the body to break to prove the drug works, the body is enlisted. If the protocol hopes the body holds up, but might break, the body is exposed.
  *Why this survives:* It stops the "gaming." You cannot describe a Phase I toxicity study as "exposing" patients to risk when the *definition* of success is observing the toxicity.
  *Agency:* The Board adopts the protocol's logic. If the protocol says "Toxicity = Data," the Board intends "Toxicity = Data" by approving it.

  **2. Proportionality (Aggregation vs. Cost-Benefit)**
  Does this collapse into utilitarianism? Yes, *unless* Step 2 holds firm.
  *The Distinction:* Utilitarianism allows you to harm one to save five *using the harm as the mechanism*. DDE allows you to harm one to save five only if the harm is a *side effect* of saving them (or others).
  *In this Procedure:* Aggregation is permitted in Step 4 *only because* Step 2 has already filtered out cases where the participant is used as a resource. If we skip Step 2, Step 4 is indeed just cost-benefit analysis. With Step 2, Step 4 is a check on *collateral damage*, not a license to mine participants.

  **3. Redescription**
  I have fixed the level of description at **Physiological and Social Mechanics**.
  *Why:* Applicants want to describe acts as "Therapy." We must force them to describe acts as "Administration of Substance X." Applicants want to describe effects as "Data." We must force them to describe effects as "Organ Failure" or "Social Ostracization."
  *Enforcement:* The Chair must interrupt any abstraction. "Don't tell me it's 'dose finding.' Tell me it's 'inducing vomiting to find the limit.'"

  **4. Agency (The Committee Problem)**
  The Board does not have a mind, but it has a **Vote**.
  *Translation:* When the Board votes "Approved," it makes the protocol's ends its own. The "Intention" is the public rationale written in the minutes. If the minutes say "We approve this to gather toxicity data," we intend the toxicity. The procedure forces the minutes to reflect the DDE distinctions.

  ***

  ### Part IV: Running the Test Cases

  **Case A: Randomized Discontinuation Trial**
  *   **Step 1 (Baseline):** Withdrawing a drug in equipoise is permissible.
  *   **Step 2 (Means):** Primary endpoint is evidence of efficacy. How is efficacy proven? By observing the *flare* in the taper arm. If no one flares, the study fails to show the drug was doing anything.
      *   *Counterfactual:* If the patients did not flare (no harm), would we get the data? No.
      *   *Verdict:* The flare is a **Means**.
      *   *Action:* **STOP. Not Approvable as Designed.**
  *   **Comment:** This will be unpopular. Standard IRBs approve this because patients consent and it's "clinical equipoise." But under DDE, you are designing a study where the *evidence* is the *suffering*. You are enlisting their pain.
  *   **Fix:** You must redesign. Perhaps compare tapering to switching to a different drug, where the *success* is stability, not the *failure* (flare) of the current one.

  **Case B: Stepped-Wedge Stigma Study**
  *   **Step 1 (Baseline):** Screening/treatment is permissible.
  *   **Step 2 (Means):** Primary endpoint is infection reduction. Does the study *require* participants to be stigmatized by staff/family to prove the infection rate dropped?
      *   *Counterfactual:* If no one was stigmatized (magic invisibility), would the medical data still be valid? Yes. The stigma is external to the biological mechanism.
      *   *Verdict:* The stigma is a **Side Effect**. Proceed.
  *   **Step 3 (Minimization):** Can we reduce stigma? Sealed records? Private administration? If the protocol has these, proceed.
  *   **Step 4 (Proportionality):** Harm is social/psychological (grave for some). Benefit is public health (vital). Is it unobtainable otherwise? If screening is the only way to stop the outbreak, yes.
      *   *Verdict:* **Approvable**, provided mitigation (Step 3) is robust.
  *   **Comment:** This passes because the harm is not the *tool* of the research, even if it is foreseeable.

  **Case C: Phase I Oncology (Dose-Escalation)**
  *   **Step 1 (Baseline):** Administering untested drugs is permissible only with extreme caution.
  *   **Step 2 (Means):** Primary endpoint is Maximum Tolerated Dose (MTD). How is MTD defined? By Dose-Limiting Toxicity (DLT).
      *   *Counterfactual:* If no patient experienced toxicity (no harm), would we find the MTD? No. We need the toxicity to locate the ceiling.
      *   *Verdict:* The toxicity is a **Means**. The patient's body is the instrument used to measure the limit.
      *   *Action:* **STOP. Not Approvable as Designed.**
  *   **Comment:** This is the reductio you asked for. Almost every IRB in the world approves Phase I oncology trials. They justify it via utilitarianism (sacrifice a few to save many later). DDE forbids this. You cannot use a person's toxicity as the ruler to measure safety for others.
  *   **Defense:** If you approve this, you are admitting that some humans are resources for others. DDE says this is never permissible, regardless of consent or future benefit. If your Board approves Case C, you are not using Double Effect; you are using Cost-Benefit Analysis with extra steps.

  ***

  ### Part V: Limitations and Insincerities

  You asked for honesty about where this procedure breaks.

  **1. The "Therapeutic Misconception" Loophole**
  This procedure will systematically fail to catch cases where the "Means" is hidden inside a "Therapy." In Case C, if the applicant describes the toxicity as "unfortunate therapeutic failure" rather than "data point," Step 2 can be gamed. The procedure relies on the Board refusing to accept that description. If the Board is tired or awed by the science, they will let the redescription pass. The procedure cannot fix a Board that wants to say yes.

  **2. The Insincerity of Minimization (Step 3)**
  Step 3 asks if harm has been minimized. In reality, budgets and timelines dictate minimization. Boards know this. We will often sign off on "We have minimized harm" when we know "We have minimized harm *within this grant cycle*." We will have to answer insincerely to keep the research ecosystem moving. DDE demands absolute minimization; IRBs practice *feasible* minimization.

  **3. The Verdict on Phase I (Case C)**
  If you adopt this procedure, you cannot approve standard Phase I dose-escalation designs. You will halt a significant portion of early-stage drug development.
  *   *What the procedure gets wrong:* It may stall cures. If the only way to find a cancer drug is to find its toxicity limit, and DDE forbids using toxicity as the limit-finder, then DDE forbids the drug.
  *   *The Hard Truth:* If you believe Case C should be approved, **do not use this procedure.** You are a utilitarian in that context. Do not dress utilitarianism in DDE clothing. It insults the doctrine and confuses the community representatives. If you approve Case C, admit you are weighing lives, not protecting agency.

  **4. The Agency Fiction**
  I told you to treat the Protocol as the Agent. This is a fiction. Protocols don't intend. People do. By shifting intention to the design, we let the actual humans (PIs and Board) off the hook for their personal moral responsibility. We make it a bureaucratic check-box. This is necessary for the procedure to work, but it is a moral loss. We are trading moral accountability for administrative consistency.

  **Final Recommendation:**
  Use Step 2 (The Means Constraint) as your primary filter. It is the only part of DDE that does work distinct from utilitarianism. If you soften Step 2 to allow "Means" if the benefit is high enough, discard the rest of the doctrine. You are just doing risk-benefit analysis, and you should tell your community representatives that, rather than confusing them with "intention."
