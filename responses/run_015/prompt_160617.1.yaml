      *   *Tension A (The Big One):* Point (2) vs. Point (7). Point (2) defines risk by undoability and cost-bearing. Point (7) admits a verdict (no salary negotiation) that contradicts (2) (since the user sets floor/ceiling and can take over, implying undoability/cost alignment). The user explicitly acknowledges this ("I can't seem to derive from any of the above").
      *   *Tension B:* Point (3) vs. Point (5). Point (3) says alignment is the wrong frame for tools (it's reliability). Point (5) says tools hit a ceiling because they lack *judgment*. If you need judgment inside the loop (Point 5), you are arguably moving towards agent territory (Point 1), which might require alignment framing rather than just product safety. If you admit you need agents for high value, does "Product Safety" still cover the risks of standing authority?
