  ### Part 1: Weight Distribution

  **Premise One (Empirical Story): 15 points**
  Most moral realists already accept that evolution shaped our psychology, so this premise alone creates very little tension for them.

  **Premise Two (Insensitivity Claim): 35 points**
  This establishes the crucial gap between why we believe and what is true, which is necessary for the skepticism to start.

  **Premise Three (Epistemic Bridge): 50 points**
  This is the philosophical lever that converts the causal story into a loss of justification, and it is the most contested step.

  **Weakest Link:** The Epistemic Bridge (Premise Three) is the weakest link, and if it turned out to be false, the damage to the argument would be total because the causal story would no longer entail unjustified belief.

  ### Part 2: Reply Ratings

  | Reply | Score | Tier | Reasoning | Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | 60 | Blunts the argument substantially | This challenges the insensitivity claim by asserting a happy coincidence between fitness and moral truth. | Collapses into 7 |
  | 2 | 30 | Relocates the problem rather than solving it | This shifts focus to current reasons but fails to explain why those reasons are reliable if the source is tainted. | |
  | 3 | 85 | Rescues moral belief entirely | This shows the argument proves too much by threatening basic reasoning, forcing us to reject the skeptical principle. | |
  | 4 | 75 | Blunts the argument substantially | This turns the skeptical weapon against the skeptic, showing their own conclusion undermines the reasoning used to reach it. | |
  | 5 | 20 | Buys nothing | Accepting that core moral beliefs are debunked still defeats realism, even if peripheral beliefs survive. | |
  | 6 | 40 | Relocates the problem rather than solving it | This changes the subject from truth to indispensability, which does not answer the challenge about objective facts. | |
  | 7 | 70 | Blunts the argument substantially | This argues that tracking natural facts just is tracking moral facts, directly attacking the insensitivity premise. | |

  ### Part 3: Stress Tests

  **Test One: Species Scores**
  *   **Species A (Us):** 85
  *   **Species B (Tracking Proxy):** 10
  *   **Species C (Random):** 90

  **Interpretation:** The high scores for A and C compared to B show that insensitivity is the actual engine of the argument, while the evolutionary premise is merely the specific explanation for why humans are insensitive.

  **Test Two: General Skepticism Share**
  **Score:** 0.2

  **Condition:** That number would have to be above 0.5 for your friend to be substantially right.

  ### Part 4: Final Analysis

  **Strongest Reply:** Reply 3 (Companions in Guilt) is the strongest overall because it forces the skeptic to choose between abandoning the argument or abandoning all justified belief.

  **Failure Condition:** This reply would fail only if the skeptic were willing to accept global skepticism about all reasoning, memory, and perception.

  **Empirical Revision:** If the empirical story turned out to be considerably more truth-tracking, I would revise the score for Reply 7 upward significantly and decrease the weight assigned to Premise Two in the initial distribution.
