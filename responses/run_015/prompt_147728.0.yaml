              *   *Case 3: Bisected Colony.* (Fission).
                  *   *Verdict:* One becomes two.
                  *   *Implication:* Which one is the original? Neither? Both?
                  *   *Embarrassment:* High. Suggests "subjecthood" is not a unique historical track.
              *   *Case 4: Pheromonal Overlay.* (The "Truman Show" Ants).
                  *   *Verdict:* Colony A acts out Colony B's history.
                  *   *Implication:* Who is the thinker? A (the hardware) or B (the software/history)?
                  *   *Embarrassment:* Fatal/High. If the *history* of the signals determines the belief, but the *ants* are different, where is the subject? If A is the subject, why does it believe B's food locations? If B is the subject, where is B? This decouples the physical substrate from the intentional content too loosely.

      *   **Part 3: The Meta-Question (Insulation & Functionalism):**
