              *   *Fatal vs. Awkward:* If the colony state supervenes *trivially* on the ant state without emergent causal powers, it's redundant. But if the colony state has *downward causation* (e.g., colony structure constrains ant behavior in a way ant-rules don't capture), it's real.
              *   *Verdict:* The risk is that colony-level laws are just derived from ant-level laws, whereas mental laws might not be derivable from neural laws (multiple realizability). If colony behavior is *deducible* from ant rules without loss, the "subject" status is threatened.

