answer: |-
  **Title:** Anchored Competence: The Asymmetry Between Darwinian Tracking and Turingian Computation

  **Introduction**

  In the landscape of naturalistic philosophy, two inversions stand paramount for their ability to dissolve the mystery of complex order without invoking a supernatural designer or an immaterial soul. Charles Darwin demonstrated that the earthworm tills the soil with agronomic competence despite possessing no comprehension of soil chemistry. Alan Turing proposed that a machine might exhibit intelligent behavior despite possessing no comprehension of the symbols it manipulates. Together, these insights form the backbone of what Daniel Dennett has termed the "competence without comprehension" paradigm. The standard interpretation suggests a profound parallel: both men showed that mindless processes can generate the appearance of mind.

  However, this analogy faces a significant challenge regarding the source of the competence. Darwinian competence is historically anchored; the worm's behavior tracks environmental realities through generations of selective retention. Turingian competence, by contrast, is anchored in formal symbol-manipulation rules that carry no necessary relation to the world they describe. This essay argues that this "tracking-versus-computation asymmetry" undermines the standard analogy. While the reductionist reply—that evolutionary tracking itself reduces to genetic computation—offers a compelling formal unity, it fails to account for semantic grounding. Consequently, Darwin's inversion succeeds in eliminating comprehension by replacing it with causal history, whereas Turing's inversion, taken in isolation, substitutes syntactic adequacy for genuine adaptive fit. Comprehension is eliminated in biology, but in the abstract Turing machine, it is merely bypassed, leaving the system semantically ungrounded.

  **The Parallel Inversions**

  To understand the weight of the asymmetry, one must first appreciate the strength of the analogy. Prior to Darwin, biological complexity was widely viewed as evidence of a Designer; the eye implied an optician. Darwin inverted this reasoning: the accumulation of small, blind variations filtered by survival could produce design-like complexity without a designer. The earthworm does not need to understand the nitrogen cycle to enrich the soil; it needs only to behave in ways that, historically, correlated with survival.

  Turing performed a structurally similar inversion for the mind. Prior to Turing, intelligence was often conflated with internal conscious states or semantic understanding. Turing's Imitation Game shifted the criterion to behavioral output. If a system can manipulate symbols to produce responses indistinguishable from a human, it is functionally intelligent, regardless of whether it "understands" the meaning of those symbols. In both cases, the "inner light" of comprehension is rendered superfluous. The worm is a biological robot; the computer is a logical organism. Both achieve competence through mindless procedures.

  **The Tracking-versus-Computation Asymmetry**

  The crux of the challenge lies in the relationship between the agent and the world. Darwinian competence is inherently relational and historical. An earthworm's soil-tilling behavior is not merely a successful output; it is a *tracking* mechanism. The worm's physiology and instincts exist in their current form *because* they matched specific environmental pressures over deep time. The competence is "about" the environment in a causal sense; the environment sculpted the behavior. This is what Ruth Millikan might call a "proper function": the behavior is defined by its historical success conditions. The worm is anchored to the world by the chain of ancestry that links its current behavior to past survival.

  Turing's inversion, however, isolates the agent from this historical anchor. In the strict formulation of the Turing Test, the interrogator communicates via text-only channel, deliberately stripping away physical embodiment and history. The machine's competence is derived from syntactic rules—if *this* symbol, then *that* symbol. As John Searle later emphasized in his Chinese Room argument, syntax is not sufficient for semantics. A machine can manipulate Chinese characters perfectly without knowing they refer to a world. Its competence is anchored in the consistency of its code, not in a causal history of interaction with the referents of that code.

  Here lies the asymmetry: Darwin explains competence via *world-tracking* (the behavior fits because the world selected it). Turing explains competence via *symbol-processing* (the behavior fits because the rules are consistent). The Darwinian worm is adaptive because it is coupled to the world; the Turing machine is successful because it is coupled to its program. The former guarantees a relation to reality; the latter guarantees only internal coherence.

  **The Reductionist Reply: Evolution as Computation**

  The strongest reply to this asymmetry is the reductionist argument, championed by thinkers like Dennett and Richard Dawkins. This view posits that the asymmetry is illusory because evolutionary tracking *is* a form of computation. DNA is a digital code; natural selection is an algorithm that processes genetic information against the "data" of the environment. If the genome is software and the body is hardware, then the earthworm is, effectively, a biological Turing machine.

  On this view, the worm's "tracking" is just a long-running computation where the "reward function" is survival. If evolution is computational, then the difference between the worm and the AI is merely one of substrate (carbon vs. silicon) and timescale, not of kind. The asymmetry collapses because the historical anchor of Darwinism is revealed to be nothing more than a specific type of computational history. If both are computing, then both are equally devoid of comprehension, and the parallel holds.

  **Critiquing the Reduction: The Grounding Problem**

  While the reductionist reply is powerful, it conflates the *description* of a process with the *grounding* of that process. It is true that we can describe evolution computationally. However, for a computation to be about the world, it must be implemented in a system that interacts causally with that world.

  In the Darwinian case, the "code" (DNA) is inextricably linked to the "execution" (the phenotype) which physically struggles against the environment. The feedback loop is closed by life and death. The computational state of the genome matters *because* it has direct causal powers over survival. The semantics are grounded in the physics of survival.

  In the Turingian case, specifically within the confines of the Imitation Game, the system is disembodied. The symbol manipulation has no necessary causal connection to the objects the symbols represent. A computer processing the symbol "apple" does not interact with an apple; it interacts with voltage states. Unless the machine is embedded in an environment where its outputs have consequences for its own persistence (a robotic, evolutionary context), its computation is ungrounded.

  Therefore, the reductionist reply fails to fully collapse the asymmetry. Saying "evolution is computation" ignores that evolution is *grounded* computation. The Turing machine, as traditionally conceived in philosophy of mind, is *ungrounded* computation. The worm tracks the world because its existence depends on that tracking. The machine simulates tracking because its programmer designed it to do so. The worm's competence is intrinsic to its causal history; the machine's competence is extrinsic, borrowed from the human designers who built the bridge between syntax and the world.

  **Conclusion: Divergent Eliminations of Comprehension**

  Does this asymmetry undermine the standard analogy? It refines it significantly. The standard analogy suggests that Darwin and Turing made the *same* move: eliminating the need for a homunculus by showing that blind processes yield competence. This is true regarding the *mechanism* (blind variation/algorithmic processing) but false regarding the *ontology* of the competence.

  Darwin's inversion succeeds in eliminating comprehension because it replaces it with something sufficient for intentionality: causal history. The worm does not understand the soil, but its behavior is *about* the soil because it was shaped by the soil. Turing's inversion, if restricted to syntactic manipulation, eliminates comprehension but replaces it with something insufficient for intentionality: formal consistency.

  Therefore, comprehension cannot be eliminated in both cases by the exact same move. Darwin eliminates comprehension by externalizing it into history. Turing eliminates comprehension by internalizing it into syntax. For Turing's inversion to match Darwin's robustness, the machine must not merely pass the Imitation Game; it must be an "evolved" entity embedded in a world where its symbols have survival value.

  Ultimately, Darwin's inversion is ontologically complete; it explains how mindless matter becomes about the world. Turing's inversion is methodologically brilliant but ontologically incomplete; it explains how mindless matter can mimic the world. The asymmetry holds: the worm tracks because it is tethered to reality by the chain of life; the machine computes because it is tethered to logic by the chain of code. To bridge this gap, artificial intelligence requires not just better algorithms, but the Darwinian anchor of embodied, evolutionary risk. Until then, the worm possesses a genuine, history-grounded competence that the Turing machine, in its abstract isolation, can only simulate.
