      *   *Parties:* Bad because they demand loyalty to the group over truth. They create a "collective passion."
      *   *Unions:* Okay if defensive/concrete, bad if bureaucratic/ideological.
      *   *Religion:* Okay if spiritual/individual relation to God, bad if institutional/political.
      *   *Organisations:* Generally suspect if permanent/large because they develop a life of their own (idolatry of the collective).
