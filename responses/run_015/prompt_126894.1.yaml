      *   *Best Test Case:* A temporary citizens' assembly (dissolves after decision) vs. a permanent one. If Weil accepts the temporary one but rejects the permanent one, the rule is about Permanence/Institutionalisation. If she rejects both, the rule is about Compulsion/Power.

