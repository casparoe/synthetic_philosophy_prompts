  4.  **Identify Competing "Rules" (Interpretations of Weil):**
      *   *Rule A: The Anti-Party/Pro-Conscience Rule.* The main evil is collective pressure forcing individuals to lie about what they think. If the body doesn't demand ideological conformity, it might be okay.
      *   *Rule B: The Anti-Permanence/Scale Rule.* The main evil is the institution itself becoming an idol. Permanent bodies develop bureaucracies and self-preservation instincts that crush the soul.
      *   *Rule C: The Anti-Coercion/Voluntary Rule.* The main evil is forcing people into collective machinery. Compulsion violates the spiritual freedom necessary for true judgement.
      *   *Rule D: The Anti-Power Rule.* The main evil is seeking or wielding power. Any body with binding veto power is seeking to impose will, which corrupts.

  5.  **Evaluate the Bristol Proposal against each Rule:**
      *   *Rule A (Conscience):* **Pass.** No party line, sortition prevents factions, narrow remit reduces ideological drift. Members can think independently.
      *   *Rule B (Permanence):* **Fail.** It is explicitly "permanent." Even if members rotate, the *structure* persists. Weil distrusts permanent structures.
      *   *Rule C (Voluntary):* **Fail.** It is compulsory ("called up like jury service"). Weil values spiritual liberty; compulsion might taint the attention.
      *   *Rule D (Power):* **Fail/Mixed.** It has "binding veto power." Weil is sceptical of power, but she accepts defensive power (unions). Is a veto defensive? Maybe. But it stops contracts, which is an exercise of force.

  6.  **Synthesize the "Best Guess":**
      *   Weil is fundamentally concerned with the *spiritual condition* of the participant.
      *   She hates parties because they demand you stop thinking.
      *   She hates permanence because it creates a "collective entity" that demands loyalty.
