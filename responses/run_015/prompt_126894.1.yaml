prompt: |-
  hey — i'm putting together a long read on democratic experiments and the philosophy behind them for the magizine's ideas section, and i've hit a wierd corner case with Simone Weil's framework. From her essay on parties and a few other fragments, she seems to rule like this:
  - political parties are harmful because they force members to defend positions they don't actually hold and suppress independent judgement
  - trade unions are acceptable when they stay focused on concrete defence of workers and don't turn into bureaucratic machines
  - religious groups are fine if they stay spiritual, but become dangerous when they start acting like social or political parties
  - small groups formed round a specific practical task are generally healthy
  - large permanent organisations tend to crush the human soul regardless of what they claim to be for

  Now Bristol is proposing a permanent citizens' assembly, picked entirely by lot, with binding veto power over local contracts that use algorithmic sentencing tools. It's not voluntary — you get called up like jury service — there's no party line, and its remit is very narrow: check one kind of software. Would Weil back it, reject it, or split the difference?

  I'm not after a simple yes/no. What's the actual rule she's running — is it about voluntary membership, about scale and permanence, about whether the body seeks power, or about the suppression of independent thought? Lay out the other rules that fit her earlier verdicts just as well, say what each predicts for this assembly, give me your best guess with reasons, and tell me which further case would actually tell them apart. Please answer in British English, and don't bother with citations — just reason it through.
reasoning: |-
