      *   *Core Argument 2: The Role of Reason.* Reason is for Nature. Faith/Church is for Scripture (regarding salvation). An LLM applies "reason" (logic/stats) to Scripture. Galileo might see this as encroaching on the sphere of faith *if* it claims authority.
