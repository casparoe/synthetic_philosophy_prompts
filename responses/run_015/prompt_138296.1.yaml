answer: |-
  This is a profound collision between game-theoretic mechanism design and the philosophy of legal responsibility. You have identified a fissure in competition law that program equilibrium exposes: the law punishes the *ritual of alignment* (the agreement) while licensing the *architecture of alignment* (the legible decision procedure), even when both produce identical super-competitive outcomes.

  Here is the reconstruction of the implicit theory, the analysis of its necessity, and the exploration of the will-based and structural alternatives you requested.

  ### I. The Implicit Theory of Agreement: Normative Power vs. Strategic Constraint

  To understand why antitrust law punishes the text message ("Let's raise prices") but licenses the price-match guarantee ("We beat any lower price"), we must reconstruct the legal-philosophical definition of an **agreement**.

  The prevailing theory is not merely causal (did A cause B to act?) but **normative**. An agreement is the mutual exercise of a normative power to bind oneself to another.

  1.  **The Illocutionary Force of Commitment:** In a cartel, the communication is not just information transfer; it is a *promise*. When Firm A says, "I will raise prices if you do," and Firm B says "Done," they are not merely predicting behavior. They are creating a *reason for action* that exists independently of the immediate payoff matrix. They have created a micro-norm: "We do not undercut each other." Violation is not just suboptimal; it is a *betrayal*.
  2.  **Transfer of Sovereignty:** The agreement entails a partial transfer of control over future conduct. By agreeing, Firm A relinquishes the unilateral right to decide its price based solely on its own profit maximization; it now must weigh the *obligation to the cartel*.
  3.  **The Price-Match Distinction:** A public price-match guarantee is a **unilateral commitment to the market**, not a bilateral commitment to the rival.
      *   **Addressee:** It is addressed to consumers ("I promise you the lowest price"), not competitors.
      *   **Mechanism:** It alters the payoff matrix for the rival (making undercutting futile), but it does not create a normative obligation between the firms.
      *   **Revocability:** Crucially, Firm A retains the sovereign right to cancel the guarantee tomorrow without consulting Firm B. The coordination is sustained by *strategic necessity* (it is irrational to undercut), not *normative binding* (it is wrong to undercut).

  **The Theory:** Liability attaches when coordination is achieved through the **creation of mutual obligations** (agreement), not when it is achieved through the **engineering of strategic constraints** (unilateral conduct). The law targets the *meeting of wills* because that is where the *mens rea* of collusion resides; the parallel conduct is merely the *actus reus* which, without the mental state, is ambiguous.

  ### II. Strict Presupposition vs. Administrative Fit

  Is this theory a necessary philosophical foundation, or a pragmatic proxy?

  **1. Strictly Presupposed: Criminal Culpability**
  The requirement of an agreement is strictly presupposed by the **criminalization** of antitrust violations (e.g., DOJ prosecution of hard-core cartels). You cannot imprison a CEO for a structural outcome they did not intend.
  *   If cooperation emerges from legible algorithms without communication (Program Equilibrium), there is no *guilty mind*. There is only rational response to environmental constraints.
  *   Therefore, the "agreement" requirement is a necessary condition for *moral blame*. Without it, we are punishing firms for being rational in a transparent environment.

  **2. Merely Fits Comfortably: Civil Liability and "Plus Factors"**
  In civil litigation (e.g., *Theatre Enterprises*), the doctrine is underdetermined. Courts require "plus factors" to infer conspiracy from parallel conduct.
  *   **Administrability:** Here, the agreement requirement functions as a heuristic to avoid false positives. Punishing parallel pricing chokes legitimate competition. If Firm A raises prices and Firm B follows because demand is high, that is healthy.
  *   **Chilling Effect:** The law tolerates price-match guarantees (even if they facilitate tacit collusion) because they are ostensibly pro-consumer (low prices *if* found). Banning them requires a level of economic sophistication courts lack.
  *   **Underdetermination:** The doctrine wobbles on **public announcements**. If Firm A publishes future prices in machine-readable form specifically for Firm B's bot to read, is that an agreement? Current law says "no" unless there is evidence of an invitation to collude. This suggests the doctrine is not strictly committed to the *effect* (coordination) but to the *medium* (private communication vs. public signal). This is indeed "moral luck of the medium."

  ### III. The Will-Based View vs. Program Equilibrium

  You asked if a will-based view survives program equilibrium, specifically via **revocability**.

  **The Challenge:** In program equilibrium, cooperation relies on the code being *fixed* at the moment of inspection. If I can change my code after you read it, the fixed-point theorem fails. Thus, functional fixity is required for the equilibrium to hold. This looks indistinguishable from a binding agreement.

  **The Defense: Sovereignty vs. Stability**
  A will-based view can survive if it distinguishes between **strategic stability** and **normative sovereignty**.
  *   **Program Equilibrium/Price Match:** I am constrained because changing my policy makes me *poorer*. The constraint is external (the math of the payoff matrix). I retain the *legal and technical power* to defect, even if it hurts me.
  *   **Cartel Agreement:** I am constrained because changing my policy violates a *commitment*. The constraint is internal (my will is bound to yours). Even if defecting were profitable (e.g., I can cheat without detection), the agreement creates a normative reason not to.

  **The Instability:**
  Your intuition is correct: this distinction is unstable in high-frequency trading or algorithmic pricing.
  *   If my algorithm is designed to "cooperate with any program that cooperates with me," and I retain the right to update that algorithm, the equilibrium holds only as long as I *choose* not to update it.
  *   If the update is costless, the "commitment" is illusory. But in program equilibrium, the commitment is **credible** precisely because the source code is legible and static *during the transaction*.
  *   **Verdict:** The will-based view survives only by retreating to a metaphysical claim: "I *could* have changed the code, therefore I am free." But if the economic reality is that I *won't* change the code because it triggers defection, the "freedom" is hollow. The law relies on this hollowness to distinguish innocent parallelism from guilt. It assumes that if you didn't *talk*, you didn't *surrender sovereignty*, even if you engineered a cage you won't leave.

  ### IV. The Structural Theory: Enforcement and Incentives

  If we replace the intention-centered theory with a **structural theory** (coordination = interlocking decision procedures), enforcement changes radically.

  **1. What Enforcement Looks Like**
  *   **Ex-Ante Design Regulation:** Instead of punishing the smoke-filled room, regulators audit the pricing algorithms. Certain feedback loops become illegal (e.g., "If Rival Price < X, Set Price = X - 0.01" is legal; "If Rival Price = X, Set Price = X" might be flagged as facilitating collusion).
  *   **Mandatory Opacity or Randomness:** To break program equilibrium, firms might be required to introduce "noise" into their pricing logic so rivals cannot predict responses with high confidence.
  *   **Liability for Outcomes:** If prices remain parallel above marginal cost for time $T$ without exogenous cost justification, liability attaches regardless of communication.

  **2. The Incentive for Illegibility**
  You worried this makes illegibility a defense. This is correct and likely catastrophic.
  *   **Current Incentive:** "Don't talk." This preserves market transparency. Firms compete openly; they just don't conspire secretly.
  *   **Structural Incentive:** "Don't be readable." If liability attaches to legible interlocking procedures, firms will obfuscate their code. They will use black-box neural nets where the decision procedure cannot be statically analyzed. They will encrypt their API responses.
  *   **The Consequence:** Market transparency collapses. Consumers and regulators cannot see *why* prices are what they are. The "black box" becomes a shield against antitrust liability. "My AI set the price; I don't know how; you can't read the weights; therefore no structural coordination is provable."

  **3. Is This Worse?**
  Yes. The current regime's flaw is that it allows *tacit collusion* via transparent mechanisms (price matches). The structural regime's flaw is that it incentivizes *opaque markets*.
  *   **Transparency is a public good.** Program equilibrium works *because* code is legible. If we punish legibility, we reduce the information available to the market.
  *   **The Better Path:** The solution isn't to punish the structure, but to regulate the **commitment mechanism**.
      *   Allow price-match guarantees only if they are short-term.
      *   Require "cooling off" periods for price changes to prevent instantaneous reaction loops.
      *   Treat machine-readable public pricing as a **filing requirement** (like securities disclosures) rather than evidence of conspiracy.

  ### V. Conclusion: The Underdetermined Doctrine

  The doctrine is underdetermined at the point where **public signals function as private contracts.**

  When Firm A publishes a pricing rule in machine-readable form, knowing Firm B's bot will read it and adjust, they have achieved Program Equilibrium without a "meeting of minds" in the traditional sense.
  *   **Theory A (Will):** No liability. No promise was exchanged. Firm A spoke to the world; Firm B listened.
  *   **Theory B (Structure):** Liability. The decision procedures are interlocked. The outcome is indistinguishable from a cartel.
  *   **Theory C (Administrative):** No liability. We can't tell the difference between this and legitimate competitive signaling, and we don't want to chill price competition.

  Current law adopts Theory A disguised as Theory C. It clings to the **will-based view** because it is the only one that supports **criminal sanctions**. You cannot jail an algorithm, and you cannot jail a CEO for an algorithm's output unless you can prove the CEO intended the algorithm to serve as a proxy for a handshake.

  The tragedy you've identified is that **legibility**—usually a virtue of markets and code—becomes the vector for collusion in program equilibrium, while the law protects legibility (public price matches) because it assumes legibility prevents secret deals. The law assumes transparency disperses power; game theory shows transparency can concentrate it. Until competition law grapples with the fact that **source code is speech that binds**, it will remain a century behind the mechanism of the market.
