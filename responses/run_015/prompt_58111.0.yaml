answer: |-
  Here are two parallel cases involving a university tutor, Dr. Aris, followed by an analysis of the principled difference between them.

  ### Case 1: The Transparent Corrector
  Dr. Aris is a respected tutor in the History Department. Five years ago, while finishing her own doctoral thesis, she committed an act of plagiarism: she inadvertently failed to quote a specific archival source correctly, presenting the interpretation as her own. She was flagged by an external examiner, accepted the sanction, and publicly corrected the record. Since then, she has been meticulous about citation and often speaks to students about the pressures that lead to academic dishonesty.

  Today, Dr. Aris discovers that one of her undergraduates, Leo, has copied several paragraphs from a journal article without attribution. She calls Leo into her office. She outlines the evidence clearly and states, "Leo, this is plagiarism. It violates the fundamental agreement of our academic community. I know the panic that leads to this; I made a similar mistake early in my career, and I had to work hard to regain my integrity. But the rule stands for all of us. I have to report this, and you need to understand why this undermines your own learning."

  Leo feels the weight of the blame. While he knows Dr. Aris's history, her admission makes her judgment feel fair. Her blame seems **in order**; she is enforcing a norm she acknowledges binds her just as strictly as it binds him.

  ### Case 2: The Moral Superior
  Dr. Aris is a respected tutor in the History Department. Five years ago, while finishing her own doctoral thesis, she committed an act of plagiarism: she inadvertently failed to quote a specific archival source correctly, presenting the interpretation as her own. She was flagged by an external examiner, accepted the sanction, and corrected the record. Since then, she has been meticulous about citation. However, she views her past mistake as a shameful secret that would undermine her authority if revealed.

  Today, Dr. Aris discovers that one of her undergraduates, Leo, has copied several paragraphs from a journal article without attribution. She calls Leo into her office. She outlines the evidence clearly and states, "Leo, this is plagiarism. It violates the fundamental agreement of our academic community. People like me uphold the truth; people like you undermine it. I would never compromise my integrity in this way. You have failed to meet the standard I expect."

  Leo feels the weight of the blame, but also a sting of injustice. He senses the disparity in how they are being judged. Her blame seems **objectionably hypocritical**; she is enforcing a norm while implicitly positioning herself as exempt from the moral frailty that led to his violation.

  ***

  ### The Principled Difference: The Claim of Exemption

  The contrast between these cases turns on a specific condition of moral standing: **The Condition of Non-Exemption.**

  To have the standing to blame, an agent must not only uphold the norm in question but must also refrain from implying that they are *exempt* from the norms they enforce. Hypocrisy undermines standing not merely because the blamer has sinned, but because the act of blaming often carries an implicit message about the relationship between the blamer, the wrongdoer, and the rule.

  **1. Why Case 1 preserves standing:**
  In the first case, Dr. Aris's blame is an act of **communal enforcement**. By disclosing her own past violation, she explicitly rejects any claim to moral superiority. She positions herself and Leo as equals under the law of academic integrity. Her message is: *"We are both subject to this norm. I failed, I was corrected, and now I am ensuring you are corrected."* Because she includes herself in the scope of the norm's judgment (by admitting her own fallibility), she retains the standing to enforce it. Her authority comes from her current commitment to the rule, not from a claim of pristine moral history.

  **2. Why Case 2 undermines standing:**
  In the second case, Dr. Aris's blame is an act of **moral differentiation**. By concealing her past and stating, "People like me... I would never," she creates a false moral hierarchy. Her message is: *"I am a guardian of the norm; you are a violator of the norm."* This is factually false regarding their moral history and character potential. She claims a standing based on a moral immunity she does not possess. The hypocrisy lies in the **false implication of exemption**: she demands that Leo submit to a standard from which she implicitly excuses herself (not in action, but in identity).

  ### Why This Is Not About Severity

  It is crucial to note that the **severity of Dr. Aris's own wrongdoing is identical in both cases.** In both scenarios, she committed the same act of plagiarism five years ago, faced the same sanction, and has behaved identically since.

  If the loss of standing were based on the *severity* of the blamer's past sin, Dr. Aris would lack standing in both cases (or in neither). However, our intuition distinguishes them. This proves that the erosion of standing is not a mathematical calculation of "sin units" (i.e., *I stole $100, so I cannot blame you for stealing $100*).

  Instead, the erosion of standing is **relational and communicative**.
  *   In **Case 1**, the communication affirms the universality of the norm.
  *   In **Case 2**, the communication asserts a double standard.

  Therefore, the principled difference is not *what* Dr. Aris did in the past, but *how she positions herself relative to the norm* in the present act of blaming. Hypocrisy undermines standing when the blamer asserts a moral privilege they do not have, not simply when they have a moral blemish they do possess.
