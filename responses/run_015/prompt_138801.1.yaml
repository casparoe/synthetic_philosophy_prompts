answer: |-
  You don't need to discard any of your verdicts. You need to discard the idea that the Inside View and Outside View are competing *sources* of truth. They are not. The Outside View is the *structure* of probability; the Inside View is the *data* you use to select which reference class you actually belong to.

  Your intuition is already doing the heavy lifting, but your stated rule ("Go Outside unless...") is too blunt. It treats Inside View information as "exemptions" rather than "re-classifiers."

  Here are the three principles that unify your seven cases without forcing you to surrender #2 (Marriage) or #5 (Startup).

  ### Principle 1: The Reference Class Update Test (Cases 1, 2, 3, 4)
  **Rule:** Inside View information only overrides the broad Outside View if it validly moves you into a *narrower, causally distinct reference class.*

  *   **Case 1 (Reno):** Your "bottom-up plan" is prospective simulation. It does not change the physical reality of plumbing or permits. You remain in the class "People attempting renos." The plan is not data; it is hope. **Verdict: Outside View.**
  *   **Case 2 (Marriage):** You are correctly rejecting the "40% divorce" base rate, but not because you are using an Inside View *instead* of an Outside View. You are using Inside View data (15 years of history, conflict resolution patterns) to update your reference class. You are not in the class "New Marriages." You are in the class "Marriages that have already survived 15 years of stress." The divorce rate for *that* class is near zero. The "everyone was confident" clause applies to people at Year 0. You are at Year 15. **Verdict: Inside View (as Class Updater).**
  *   **Case 3 (Grant):** "Near miss + fixed complaints" moves you from "All Applicants" to "Resubmitted Near-Misses." This is a causally distinct class with a different success rate. **Verdict: Inside View (as Class Updater).**
  *   **Case 4 (Coding):** "70% done" moves you from "Projects Starting" to "Projects in Final Integration." The failure modes for the latter are vastly different (and fewer) than the former. **Verdict: Inside View (as Class Updater).**

  **Why this saves #2:** You aren't ignoring the base rate; you are accusing the base rate of being *irrelevant* to your specific coordinates. Confidence at Year 0 is noise. Survival at Year 15 is signal.

  ### Principle 2: The Endogeneity Filter (Case 5)
  **Rule:** You cannot narrow the reference class using a signal that is *produced by the same psychological engine* as the optimism bias.

  *   **Case 5 (Startup):** You identified this perfectly as the "Selection Shadow." A Letter of Intent (LOI) is a signal of viability, *but* it is also a signal of salesmanship. Salesmanship is correlated with overconfidence. If the class is defined by "Founders who convinced someone to sign," you have selected for persuasiveness, not necessarily product-market fit. The narrowing criterion is *endogenous* to the bias. Therefore, the broad class ("Startups") is safer than the poisoned narrow class ("Startups with LOIs from optimistic founders").
  *   **Contrast with Case 3 & 4:** Reviewer comments (Case 3) and working code (Case 4) are *external* constraints. You cannot "charm" a compiler into thinking 70% of the code is written. You cannot "salesman" a reviewer into saying "fix X and you're in." Those signals are exogenous to your optimism.

  **Verdict:** Trust the Broad OV over the Narrow OV when the narrowing criterion is endogenous to the bias.

  ### Principle 3: Forecast Utility vs. Decision Utility (Cases 6, 7)
  **Rule:** Use the Outside View for *portfolio allocation* and *decision gating*. Use the Inside View for *identity construction* and *effort allocation*.

  *   **Case 6 (Course):** You identified the split: OV for *choosing* (is this worth the money?), IV for *bracing* (can I make it work?). This isn't a contradiction; it's recognizing that a probability forecast has different utility depending on whether you are acting as an investor (OV) or an operator (IV).
  *   **Case 7 (Bets vs. Career):** For 30 angel bets, you are an investor. You need the aggregate OV to price the portfolio. For one career move, you are the asset. The "mean" of the reference class is irrelevant because you cannot be "average" in a singular life event; you will either succeed or fail. You must use the IV to maximize the probability of the "succeed" branch, shaded by the OV to ensure you aren't deluded.

  ### The "Selection Shadow" is Real
  Your wrinkle about the "Selection Shadow" is not double-counting; it is a precise identification of **Conditioning on the Dependent Variable.**

  When your reference class is "People who started X," you have already filtered out "People who looked at X and wisely didn't start." This makes the class look harder than it is (survivorship bias in reverse). However, it also filters out "People who looked at X and deluded themselves."

  In the **Novel Case** (quitting job to write), you are facing the Selection Shadow. The class "People who quit to write" is poisoned by the fact that *quitting* is often a signal of commitment, which is correlated with stubbornness.

  **How to apply the framework to the Novel:**

  1.  **Apply Principle 1 (Class Update):** Do you have retrospective data or prospective plans?
      *   If your IV is "I have a great outline and discipline," that is prospective (like the Reno). **Stay with the OV (most fail).**
      *   If your IV is "I have already written 60,000 words while working full time, and an agent is reading the manuscript," that is retrospective data (like the Marriage/Code). **You have updated your class to "Finished Drafts," where success rates are higher.**
  2.  **Apply Principle 2 (Endogeneity):** Is the signal you are relying on (e.g., "I feel ready") something that failed founders also felt? If yes, ignore it.
  3.  **Apply Principle 3 (Utility):** Are you betting 30% of your net worth (Portfolio -> OV) or betting your identity (Singular -> IV shaded by OV)?

  ### Summary of Verdicts
  *   **Keep #2 (Marriage).** It is not an Inside View override; it is a Reference Class Update based on survival data.
  *   **Keep #5 (Startup).** Narrowing is harmful when the narrowing signal is endogenous to the bias.
  *   **Refine #6 (Course).** Acknowledge that you are switching roles (Investor vs. Operator), not switching epistemologies.
  *   **The Novel:** If your "Inside View" is based on *plans and feelings*, the Outside View wins (don't quit). If your "Inside View" is based on *completed work and external validation*, you have earned the right to update the class (consider quitting).

  You don't need to choose between Inside and Outside. You need to use the Inside View to find the *correct* Outside View. If your Inside View is just a simulation (Reno), it fails. If it's data (Marriage, Code), it succeeds. If it's a signal correlated with bias (Startup), it backfires.
