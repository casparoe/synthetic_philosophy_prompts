answer: |-
  **DEPARTMENT OF CIVIC RESOLVE AND POTENTIAL ACTION**
  **FORM 88-INT: CIVIC INTENTION STIPEND (CIS) FREQUENTLY ASKED QUESTIONS**

  **1. What is the primary function of the Civic Intention Stipend?**
  The CIS is a liquidity incentive designed to monetize the preparatory mental state known as "Sincere Civic Resolve." Eligible citizens receive a substantial disbursement upon verification of a firm intention to undertake a Tier-3 Discomfort Task (e.g., twelve months of untreated sewer maintenance, manual snow removal in Sector 7). The program recognizes that the *willingness* to suffer for the public good holds intrinsic economic value, independent of the suffering itself.

  **2. Am I contractually obligated to perform the task I intend to do?**
  No. Under Section 4, Clause B of the CIS Accord, the disbursement of funds immediately releases the recipient from any obligation to execute the intended task. In fact, physical performance of the task after receipt of funds constitutes a breach of contract. The program incentivizes the intention, not the action. Performing the labor would render the intention instrumental rather than sincere, thereby invalidating the qualifying mental state retroactively. You are paid to intend, not to do. Indeed, doing is discouraged.

  **3. How does the Department verify sincerity if the action is not required?**
  Verification is conducted via Prefrontal Coherence Scanning (PCS) and a sworn affidavit of resolve. The PCS measures neural alignment between stated goals and emotional resistance centers. Because the reward removes the rational utility of performing the task, applicants often struggle to maintain the necessary intention during the scan. Applicants are advised to focus on the nobility of the hypothetical act while ignoring the financial incentive currently being processed. If the scan detects calculation regarding the non-performance clause, the application is denied for "Instrumental Contamination."

  **4. Why is the separation of intention and action considered economically viable?**
  Dr. Alva K. Merton, Lead Behavioral Economist for the Department, states: "Critics argue that intending an action requires a belief that one will perform it. This is a category error. Under modern decision-theoretic consistency, intention is a distinct asset class from execution. We are decoupling the mental commitment from the physical liability. A citizen can hold a perfectly valid intention to drink a toxin, provided the payment for holding that intention is processed before the swallowing reflex is engaged. The CIS optimizes societal welfare by compensating citizens for the emotional labor of resolving to do what no rational actor would subsequently choose to do."

  **5. What is the program's stance on "counterfactual regret"?**
  Counterfactual regret refers to the anxiety experienced by a recipient who worries that, in a nearby possible world, they might have followed through with the task. The Department classifies this as "Modal Uncertainty Liability." If a recipient harbors significant doubt about their own counterfactual behavior, it suggests the original intention was not stable across all possible worlds. Recipients found ruminating on paths not taken may be subject to audits. The official stance is that the actual world is the only metric of liability; however, excessive worry about alternative selves may indicate a failure of genuine resolve, potentially triggering recoupment proceedings.

  **6. What happens if I accidentally perform the task?**
  Accidental performance is treated as fraud. If you inadvertently spend a day in the sewers after receiving the stipend, you imply that your intention was not merely a mental state eligible for payment, but a directive for action. This violates the separation principle outlined by Dr. Merton. You will be required to return the stipend plus a penalty fee for unauthorized civic contribution. The Department reminds citizens: intend boldly, act never.

  **7. Who do I contact for disputes regarding neural scan results?**
  Submit Form 99-Neuro to the Office of Epistemic Compliance. Do not attempt to re-scan within 48 hours, as residual guilt may skew coherence metrics.
