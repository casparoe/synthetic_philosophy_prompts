prompt: |-
  I'm on the distributional review panel at a big regional transit authority — we screen every service and fare change before it goes to the board, so three or four proposals a month, decided in about two working days by me and two analysts who have no philosophy or econ training, and whatever we write ends up in the public packet that the board, and occasionally a judge or a reporter, actually reads. So it can't just say "the aggregate benefit outweighs the aggregate burden"; it has to show the work. The thing we keep deadlocking on is basically that old torture-vs-dust-specks hypothetical, except with bus stops: is a change that adds something genuinely trivial to an enormous number of people — 90 seconds to 400,000 daily trips, a fare system that rounds up and overcharges about three cents a ride, a platform relocation that makes 60,000 people walk an extra ninety feet — even comparable to a change that lands something severe on a small number of people, like ending door-to-door paratransit for forty wheelchair users or closing a station that twelve elderly residents depend on entirely? Half the office says obviously the millions of specks win on arithmetic, the other half says obviously you can't add up dust specks, and I dont want to settle it by whoever talks loudest.

  What I want is a procedure we could actually run on a proposal, not an essay about aggregation. Concretely:

  - the questions in order, what counts as a sufficient answer to each, where the procedure just returns a no, and where it has to hand the decision to a person because the question is one of values rather than facts;
  - a rule for the unit of aggregation — per person, per trip, per person-minute? — because multiplying 90 seconds by 400,000 trips gives ten thousand hours, while dividing it among people who each lose a minute and a half gives roughly nothing, and I suspect whether the specks count at all depends entirely on which of those we pick;
  - a rule for burdens below the threshold of anyone noticing: a one-in-ten-million increase in lifetime cancer risk from some new cleaning solvent, a three-cent rounding error nobody detects, a delay shorter than anyone registers. Do these contribute their expected value, contribute nothing, or is that exactly the value call I have to make out loud?;
  - whether it matters if the trivial burdens pile up on the same people repeatedly or are spread thinly across different ones (our fare change hits the same daily commuters over and over; the platform move hits each rider once or twice);
  - how to treat a policy that certainly imposes a serious burden on five identifiable people versus one that imposes a one-in-a-million chance of that same burden on five million people — about five expected people, but nobody identifiable in advance. Does the procedure work in expected value and then shrug at what actually happens, and is that defensible in a public document?;
  - what to do when we simply don't have a number, which is most of the time — a rough count, or a count from a five-year-old survey — and how to reason with bounds instead.

  Then please run it on three cases: (1) the fare-rounding overcharge, roughly three cents across ninety million rides a year, which everyone here has always treated as paperwork noise; (2) a station consolidation that saves the agency about $600k a year and forces twelve elderly residents with no alternative to add 1.2 miles to every trip; (3) a scheduling change that adds ninety seconds to 400,000 daily trips but gets eight maintenance workers off a genuinely miserable 2am shift. I have a sinking feeling the procedure is going to tell us the rounding thing is the biggest item on the ledger — say so plainly if that's what falls out, I'd rather hear it now. Also be straight about which steps are judgment dressed up as arithmetic, because the board will treat anything with a number in it as objective and I need to know where I'm smuggling in a value choice, and flag the cases the procedure genuinely can't settle so we know to escalate them instead of pretending.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Member of a distributional review panel at a regional transit authority.
      *   **Task:** Screen service/fare changes before board approval (3-4 proposals/month, 2 days turnaround).
      *   **Audience:** Board members, potentially judges or reporters (public packet). Needs to "show work," not just assert aggregate utility.
      *   **Core Conflict:** The "Torture vs. Dust Specks" problem applied to transit. Small burdens on many vs. severe burdens on few.
      *   **Constraints:** No philosophy/econ training for the team. Needs a *procedure*, not an essay.
      *   **Specific Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Rule for unit of aggregation (per person, trip, time?).
          *   Rule for sub-threshold burdens (unnoticeable impacts).
          *   Rule for repetition (same people vs. different people).
          *   Rule for risk/probability (certain harm to few vs. probabilistic harm to many).
          *   Rule for uncertainty/missing data (bounds reasoning).
          *   Flag where value judgments are disguised as arithmetic.
          *   Flag cases the procedure *cannot* settle (escalation points).
      *   **Test Cases:**
          1.  Fare rounding (3 cents x 90M rides).
          2.  Station consolidation ($600k savings, 12 elderly +1.2 miles/trip).
          3.  Scheduling change (90 secs x 400k trips vs. 8 maintenance workers off 2am shift).
      *   **Tone:** Direct, practical, honest about limitations, willing to admit if the math yields counterintuitive results.

  2.  **Analyze the Ethical/Methodological Problems:**

      *   *Aggregation:* Utilitarianism says sum the total. Rights-based/deontological views say individual thresholds matter. The user needs a hybrid that works for public accountability.
      *   *Units:* "Total hours" hides distribution. "Per person" hides frequency. "Per trip" inflates frequent riders.
      *   *Sub-threshold:* Does a 1-second delay count? If you add enough 1-second delays, does it become a minute? (Sorites paradox).
      *   *Repetition:* Hitting the same poor commuter 300 times/year is worse than hitting 300 tourists once.
      *   *Risk:* Expected value vs. identifiable victims (Statistical vs. Identified Life).
      *   *Uncertainty:* Data is rarely perfect. Need a "worst-case reasonable bound" approach.

  3.  **Drafting the Procedure (The "Distributional Impact Screening Protocol" - DISP):**

      *   *Goal:* Make it actionable for analysts without econ degrees.
      *   *Structure:* A flowchart logic.
      *   *Step 1: Identification & Thresholding.* Separate "noise" from "signal." Define a *De Minimis* threshold.
      *   *Step 2: Aggregation Unit.* Needs to balance total impact with individual experience. Let's use *Annualized Impact Per Affected Person*. This captures repetition.
      *   *Step 3: Severity Classification.* Categorize impacts (Trivial, Moderate, Severe/Critical).
      *   *Step 4: Distributional Weighting.* Acknowledge that burdens on vulnerable groups count more (Equity).
      *   *Step 5: The Trade-off Rule.* How to compare Severe/Few vs. Trivial/Many. This is the hard part. I need a "Lexical Priority" rule (Severe trumps Trivial unless the Trivial is massive *and* concentrated).
      *   *Step 6: Uncertainty Handling.* Use bounds.

  4.  **Refining the Specific Rules (Addressing User's Bullet Points):**

      *   *Questions in Order:*
          1.  Who is affected? (Identify groups)
          2.  Is the impact above the *Noticeability Threshold*?
          3.  What is the *Annualized Individual Burden*? (Not total sum, not per trip).
          4.  Is there a *Critical Harm* category? (Loss of access, safety risk).
          5.  Can the Critical Harm be mitigated?
          6.  If not, does the Aggregate Benefit justify it? (Only if benefit is also critical).
      *   *Unit of Aggregation:* **Annualized Burden Per Unique Person.** Why? Because 90 seconds x 300 trips = 7.5 hours/year. That's noticeable. 90 seconds x 1 trip = nothing. This solves the "dust speck" repetition issue.
      *   *Sub-threshold:* If it's below noticeability *and* doesn't accumulate to noticeability over a year, it counts as **Zero** for the public packet. (Pragmatic choice). *Value Judgment Flag:* This is a policy choice, not a fact.
      *   *Repetition:* Handled by the "Annualized Per Person" unit.
      *   *Risk/Probability:* Use Expected Value *but* flag "Identifiable vs. Statistical." If 5 people definitely lose access, that weighs heavier than 5 million people having a 1/1M risk of losing access, even if EV is same. *Value Judgment Flag:* This is the "Identifiable Victim Effect," ethically debatable but politically necessary.
      *   *Missing Data:* Use "Conservative Bounds." If range is 10-100 people, assume 100 for burden, 10 for benefit. If the decision flips within the bounds, escalate.

  5.  **Running the Test Cases:**

      *   *Case 1: Fare Rounding (3 cents x 90M rides).*
          *   Unit: Per person/year. Assume avg rider takes 300 rides. $9/year.
          *   Threshold: Is $9 noticeable? Probably below "hardship" threshold.
          *   Verdict: Trivial burden. Aggregate is high ($2.7M), but individual is low.
          *   *Wait, user suspects this might be the biggest item.* If we sum strictly, $2.7M is huge. But under the *Individual Annualized* rule, it's likely "De Minimis." I need to be honest: If the procedure sums total revenue, it wins. If it weights individual hardship, it loses. I will design the procedure to prioritize *hardship* over *revenue* to avoid the "tyranny of the specks."
          *   *Correction:* The user asked me to be straight if the procedure says rounding is the biggest item. If I use strict Utilitarian aggregation, $2.7M > $600k savings. But this is a *Distributional* panel. The goal is equity. I should structure the procedure to filter out trivial individual burdens *before* aggregation. Otherwise, the agency can never do anything because small fees always sum to big numbers.
          *   *Decision:* The procedure must have a "Relevance Threshold." If individual impact < $X or < Y minutes/year, it drops out. This prevents the rounding issue from dominating. I will explicitly flag this as a value judgment.

      *   *Case 2: Station Consolidation (12 elderly, +1.2 miles).*
          *   Impact: Severe. Loss of access/mobility for vulnerable group.
          *   Benefit: $600k.
          *   Verdict: Critical Harm. Cannot be traded for mere cost savings unless agency is in fiscal emergency (which is a Board decision, not Analyst).
          *   Escalation: Yes.

      *   *Case 3: Scheduling (90 secs x 400k vs. 8 workers off 2am).*
          *   Riders: 90 secs x 2 trips/day x 250 days = ~12 hours/year. Trivial/Moderate.
          *   Workers: 2am shift is a health/safety/life-quality critical issue.
          *   Comparison: Moderate/Many vs. Severe/Few.
          *   Verdict: Depends on the "Severity Weighting." If 2am shift is "Critical," it trumps 12 hours of travel time.
          *   Escalation: Likely needs Board value judgment on labor vs. rider time.

  6.  **Addressing the "Value Judgment Disguised as Arithmetic" Warning:**

      *   I need to explicitly highlight where the analysts are making ethical choices (e.g., setting the threshold, weighting vulnerable populations, choosing annualized vs. per-trip).
      *   I need to identify "No-Go" zones where the math doesn't solve the moral problem.

  7.  **Final Review against Constraints:**

      *   *Procedure not essay?* Yes, structured as a protocol.
      *   *Questions in order?* Yes.
      *   *Unit of aggregation?* Defined (Annualized Per Person).
      *   *Sub-threshold?* Defined (Drop out if below noticeability + accumulation).
      *   *Repetition?* Handled by unit.
      *   *Risk?* Handled by Expected Value + Identifiable Victim Flag.
      *   *Uncertainty?* Handled by Bounds.
      *   *Test Cases?* Run through the protocol.
      *   *Honesty?* Admit where the rounding issue might look big mathematically but should be filtered ethically.

  8.  **Self-Correction/Refinement on the "Rounding" Case:**
      *   The user has a "sinking feeling" the procedure will call the rounding the biggest item.
      *   If I use pure Cost-Benefit Analysis (CBA), $2.7M revenue > $600k savings.
      *   But this is a *Distributional Review*. The purpose is to protect the vulnerable from aggregate tyranny.
      *   If I tell them "Yes, the rounding is the biggest burden," they might kill a revenue source that keeps buses running.
      *   *Better approach:* Distinguish between *Transfer* (fare money stays in system) and *Deadweight Loss/Burden* (time lost, access lost).
      *   Fare rounding is a *Transfer* from rider to agency. Station closure is a *Loss* of utility.
      *   I need to make sure the procedure distinguishes between "Cost to Rider that is Revenue to Agency" vs "Cost to Rider that is Waste."
      *   *Actually, looking closer:* The prompt asks about "burdens." A fare increase is a burden.
      *   *Crucial distinction:* Is the $2.7M a "burden" in the distributional sense? Yes. But is it *severe*? No.
      *   *The "Speck" Solution:* The procedure must include a **Severity Gate**. Trivial burdens do not aggregate to override Severe burdens. This is the "Lexical Priority" rule. I will implement this. It stops the 400,000 x 90 seconds from automatically crushing the 12 elderly.
      *   *Wait, Case 3:* 400,000 riders x 90 seconds. Is that trivial? 12 hours/year is annoying but not life-altering. 2am shift is life-altering.
      *   *Okay, I will build the "Severity Gate" into the procedure.* This answers the "Torture vs. Dust Specks" dilemma by saying "Torture trumps Specks, unless the Specks become a Fog that blinds everyone." But for transit, 90 seconds is a Speck.

  9.  **Finalizing the Output Structure:**
      *   **Part 1: The Protocol (DISP).** Step-by-step instructions.
      *   **Part 2: The Value Flags.** Explicitly listing where ethics enter.
      *   **Part 3: The Test Cases.** Applying the protocol.
      *   **Part 4: The "Sinking Feeling" Answer.** Addressing the fare rounding specifically.

      *(Self-Correction during drafting)*: Make sure the "Unit of Aggregation" is clear.
      *   *Option A:* Total Minutes. (Utilitarian).
      *   *Option B:* Minutes Per Person Per Year. (Distributional).
      *   *Decision:* Use Option B for the "Burden Score." This prevents the "dust speck" inflation. 90 seconds x 1 person = 90 seconds. 90 seconds x 1 million people = 90 seconds (average). *Wait, that ignores the total social cost.*
      *   *Better:* Calculate Total Burden *but* apply a discount factor for triviality.
      *   *Best for this user:* **Tiered Classification.**
          *   Tier 1: Critical (Loss of access, safety).
          *   Tier 2: Significant (>30 mins/day).
          *   Tier 3: Minor (<5 mins/day).
          *   Rule: Tier 1 cannot be outweighed by Tier 3, regardless of N. Tier 1 can be outweighed by Tier 1 or Tier 2 (large N).
      *   This solves the philosophical deadlock practically.

      *Let's refine the "Rounding" verdict.* If the procedure is honest, $2.7M is a lot of money for riders. But is it a *distributional* harm? It's regressive. The procedure should flag regressivity.
      *   Okay, I will advise that the "Sinking Feeling" is correct *if* they sum dollars, but wrong *if* they use the Severity Gate. I will recommend the Severity Gate to prevent the panel from becoming a pure accounting office.

      *Let's refine the "Uncertainty" rule.* "Bounds Reasoning." If Low Estimate says Pass and High Estimate says Fail, you must Escalate.

      *Let's refine the "Risk" rule.* Expected value for calculation, but "Identifiable Victim" flag for the Board.

      *Okay, ready to write.*
answer: |-
  Here is a procedural framework designed for your constraints: no philosophy training, high public scrutiny, short turnaround, and a need to resolve the "aggregation vs. severity" deadlock without pretending it's pure math.

  We will call this the **Distributional Impact Screening Protocol (DISP)**.

  ### Part 1: The Procedure (DISP)

  This is a flowchart logic. If a proposal fails a step, it returns a "No" or "Escalate." If it passes all, it returns "Clear."

  **Step 1: The Unit of Account (Aggregation Rule)**
  *   **Rule:** Calculate impact as **Annualized Burden Per Unique Person**, not per trip and not total aggregate.
  *   **Calculation:** `(Impact per trip) × (Trips per year per average affected user)`.
  *   **Why:** This solves the repetition problem. A 90-second delay for a daily commuter (7.5 hours/year) is counted as 7.5 hours. A 90-second delay for a tourist (one trip) is counted as 90 seconds. It prevents inflating the "dust specks" by counting the same person 300 times, while still acknowledging that 300 specks on one person make a mark.
  *   **Value Flag:** This assumes a year is the relevant horizon. It discounts impacts on occasional users.

  **Step 2: The Noticeability Threshold (Sub-Threshold Rule)**
  *   **Rule:** Any impact below **$5/year** or **10 minutes/year** per person is recorded as **Zero** in the public packet.
  *   **Condition:** This applies *only* if the impact does not accumulate to cross the threshold within the year (handled by Step 1).
  *   **Why:** This resolves the "dust speck" paradox. If a single person cannot notice it over a year of exposure, it is administrative noise, not a distributional burden.
  *   **Value Flag:** **High.** This is a moral choice to ignore small harms. You must state in the packet: *"Impacts below this threshold are deemed de minimis per Board Policy X."* Do not present this as a fact of nature.

  **Step 3: Severity Classification (The Lexical Gate)**
  *   **Rule:** Classify every burden into one of three tiers.
      *   **Tier 1 (Critical):** Loss of essential access (no alternative route), safety risk, health impact, or cost >5% of documented income for low-income cohorts.
      *   **Tier 2 (Significant):** Time loss >30 mins/day, cost >$50/month, or moderate inconvenience with no alternative.
      *   **Tier 3 (Minor):** Time loss <30 mins/day, cost <$50/month, inconvenience with reasonable alternatives.
  *   **The Trade-Off Rule:**
      *   Tier 1 burdens **cannot** be outweighed by Tier 3 benefits/burdens, regardless of the number of people. (Torture beats dust specks).
      *   Tier 1 burdens **can** be outweighed by Tier 1 or Tier 2 benefits *if* the number of beneficiaries is >10x the number of burdened (adjustable ratio).
      *   Tier 2 and Tier 3 are aggregated using standard cost-benefit (total annualized hours/dollars).
  *   **Value Flag:** **Critical.** This is the "Lexical Priority" rule. It prevents arithmetic from crushing vulnerable minorities. The 10x ratio is a policy choice, not a math fact.

  **Step 4: Risk and Probability (The Identifiable Victim Rule)**
  *   **Rule:** Calculate Expected Value (EV) for the ledger (e.g., 1 in 1M risk × 5M people = 5 expected victims).
  *   **Exception:** If the victims are **Identifiable** (known names/addresses, e.g., the 12 elderly residents) vs. **Statistical** (random riders), the Identifiable burden is automatically upgraded one Severity Tier (e.g., from Tier 2 to Tier 1).
  *   **Why:** Public accountability requires protecting known constituents over probabilistic averages.
  *   **Value Flag:** **High.** This admits the "Identifiable Victim Effect" is policy, not economics.

  **Step 5: Uncertainty (Bounds Reasoning)**
  *   **Rule:** Never use a single point estimate. Use **Conservative Bounds**.
      *   For Burdens: Use the **Upper Bound** (worst reasonable case).
      *   For Benefits: Use the **Lower Bound** (worst reasonable case).
  *   **Decision Rule:**
      *   If Upper Bound Burden < Lower Bound Benefit → **Clear**.
      *   If Upper Bound Burden > Lower Bound Benefit → **Escalate to Board**.
      *   *Do not* average them to make a decision. If the decision flips depending on which bound you pick, the Board must decide the risk tolerance.
  *   **Value Flag:** This shifts risk aversion to the Board.

  ---

  ### Part 2: Where You Are Smuggling in Values

  You asked for honesty on where judgment is dressed as arithmetic. Put this in an internal memo; do not put it in the public packet, but know it so you can defend it if questioned.

  1.  **The Noticeability Threshold (Step 2):** Deciding that $5/year "doesn't count" is a value judgment. A strict utilitarian says $5 × 1,000,000 people = $5,000,000 harm. You are choosing to ignore this. *Defense:* "Administrative feasibility and cognitive limits of review."
  2.  **The Lexical Gate (Step 3):** Deciding that 12 people's access trumps 400,000 people's 90 seconds is a rights-based view, not utilitarian. *Defense:* "Equity Policy mandates protection of essential access."
  3.  **The Identifiable Victim Upgrade (Step 4):** Treating known people as more valuable than statistical people is ethically controversial but politically required. *Defense:* "Accountability to current constituents."
  4.  **The Time Horizon (Step 1):** Choosing "Per Year" ignores long-term cumulative effects (e.g., a 1-minute delay every day for 20 years). *Defense:* "Budget and planning cycles are annual."

  ---

  ### Part 3: Running the Test Cases

  Here is how the DISP processes your three deadlocks.

  #### Case 1: The Fare Rounding (3 cents × 90M rides)
  *   **Data:** 3 cents/ride. Assume average rider takes 300 rides/year (daily commuter).
  *   **Step 1 (Unit):** $0.03 × 300 = **$9.00 per person/year**.
  *   **Step 2 (Threshold):** Is $9.00 > $5.00 threshold? **Yes.** It passes the filter.
  *   **Step 3 (Severity):** Is $9/year > 5% of income for low-income? No. Is it loss of access? No. **Classification: Tier 3 (Minor).**
  *   **Step 5 (Uncertainty):** Ride volume is known (90M). Revenue is certain ($2.7M).
  *   **Result:** The procedure registers this as a **$2.7M Tier 3 Burden**.
  *   **Comparison:** If the alternative is raising base fare by $0.50 (Tier 2 burden), the rounding wins.
  *   **The "Sinking Feeling":** You suspected this would show up as the biggest item. **Mathematically, it does.** $2.7M is a large number. However, under Step 3, it is *Tier 3*.
  *   **Verdict:** **Clear**, *provided* no Tier 1 burdens exist elsewhere. The procedure acknowledges the money is taken, but classifies it as "Minor."
  *   **Public Packet Language:** *"Total annual impact estimated at $2.7M. However, individual impact averages $9/year, classified as Minor (Tier 3). No loss of access or essential service."*

  #### Case 2: Station Consolidation ($600k savings, 12 elderly +1.2 miles)
  *   **Data:** 12 identified people. +1.2 miles/trip. Assume 3 trips/week.
  *   **Step 1 (Unit):** 1.2 miles × 3 trips × 52 weeks = **187 miles/year per person**. (Convert to time/cost: ~60 hours/year or $150 in transport costs).
  *   **Step 2 (Threshold):** Well above threshold.
  *   **Step 3 (Severity):** "No alternative" is the key phrase. This is **Loss of Essential Access**. **Classification: Tier 1 (Critical).**
  *   **Step 4 (Identifiable):** These are 12 known residents. **Upgrade confirmed (already Tier 1).**
  *   **Trade-Off Rule:** Can Tier 1 burden be outweighed by Benefit? The benefit is $600k savings to the agency.
      *   Is agency savings a Tier 1 Benefit? No. It is operational efficiency (Tier 3).
      *   **Rule:** Tier 1 Burden cannot be outweighed by Tier 3 Benefit.
  *   **Verdict:** **No / Escalate.** The procedure blocks this.
  *   **Public Packet Language:** *"Proposal imposes Critical (Tier 1) burden on 12 identified residents with no alternative access. Operational savings are classified as Tier 3. Per Distributional Protocol, Tier 1 burdens cannot be offset by Tier 3 benefits. Recommendation: Do not approve without mitigation plan."*
  *   **Note:** This forces the Board to either find a mitigation (shuttle service?) or vote to override the protocol explicitly.

  #### Case 3: Scheduling Change (90 secs × 400k trips vs. 8 workers off 2am)
  *   **Data:**
      *   Riders: 90 secs/trip. 2 trips/day. 250 days/year. = **12.5 hours/year per rider**.
      *   Workers: 8 workers. 2am shift (health/safety risk).
  *   **Step 1 (Unit):**
      *   Riders: 12.5 hours/year.
      *   Workers: Shift elimination (Qualitative).
  *   **Step 3 (Severity):**
      *   Riders: 12.5 hours/year is annoying but not access-losing. **Classification: Tier 3 (Minor).** (It's below the 30 mins/day Tier 2 threshold).
      *   Workers: 2am shift work is linked to long-term health degradation and safety risks. If this change eliminates the shift, it is a **Health/Safety Benefit**. **Classification: Tier 1 (Critical) Benefit.**
  *   **Trade-Off Rule:** Can Tier 3 Burden (Riders) outweigh Tier 1 Benefit (Workers)?
      *   Rule says: Tier 1 *Burdens* trump Tier 3 *Benefits*. It does not explicitly say Tier 1 *Benefits* trump Tier 3 *Burdens*.
      *   *Correction:* The logic must be symmetric. If Tier 1 Harm is forbidden, Tier 1 Good should be prioritized.
      *   *Refinement:* A Tier 1 Benefit *can* outweigh Tier 3 Burdens, even at scale, because the Tier 3 Burden is below the "Severity Gate."
  *   **Verdict:** **Clear.** The health of 8 workers (Tier 1) outweighs the minor inconvenience of 400,000 riders (Tier 3), because the rider burden does not cross the severity threshold to trigger the "Lexical Gate."
  *   **Public Packet Language:** *"Rider impact is Minor (Tier 3) at 12.5 hours/year average. Worker impact is Critical (Tier 1) regarding occupational health and safety. Protocol permits Tier 1 benefits to offset Tier 3 burdens."*

  ---

  ### Part 4: The "Sinking Feeling" and The Escalation List

  You asked me to be straight about the fare rounding.

  **Yes, the procedure identifies the fare rounding as the largest *monetary* burden on the ledger ($2.7M vs $600k savings).**
  If you run a pure spreadsheet, the rounding looks worse than the station closure.
  **However,** the DISP procedure is designed to stop that spreadsheet from making the decision. By classifying the rounding as **Tier 3** and the station closure as **Tier 1**, the procedure inverts the priority. The station closure kills the proposal; the rounding does not.

  **When to Escalate to the Board (The "No-Go" Zones):**
  Do not pretend the procedure solves everything. Send it to the Board with a "Requires Value Judgment" flag in these specific scenarios:

  1.  **The Bounds Flip:** If your Conservative Bounds (Step 5) show a Pass in the best case and a Fail in the worst case. *Reason:* Risk tolerance is a political choice.
  2.  **Tier 1 vs. Tier 1:** If a proposal saves 5 people from losing access (Tier 1) but causes 5 *other* people to lose access (Tier 1). *Reason:* The math cancels out; the Board must choose which community to prioritize.
  3.  **The Threshold Challenge:** If a public comment campaign argues that the $5/10-minute Threshold (Step 2) is too high. *Reason:* Changing the threshold changes the outcome. That is a policy change, not an analysis.
  4.  **Identifiable vs. Statistical Conflict:** If a Tier 1 risk to 100 statistical people (e.g., accident risk) conflicts with a Tier 1 burden on 5 identifiable people. *Reason:* Step 4 upgrades the identifiable, but the Board must confirm that weight.

  ### Summary for your Team

  1.  **Adopt the Annualized Per Person Unit.** Stop summing total trip minutes. It lies about distribution.
  2.  **Adopt the Severity Tiers.** Hard-code the rule that "Critical trumps Minor," regardless of the headcount. This solves the torture/dust-speck deadlock without philosophy.
  3.  **Admit the Threshold.** Write the $5/10-minute cutoff into your charter. If a reporter asks why you ignored the 3-cent fee, you say: *"Board policy defines de minimis impacts as under $5/year to focus review resources on substantive hardships."*
  4.  **Escalate the Uncertainty.** If the data is old or rough, do not average it. Show the range. If the range crosses the decision line, make the Board sign off on the risk.

  This procedure protects you. It shows work, it uses numbers, but it hard-wires the ethical priorities so the "loudest voice" in the office can't override the protection of the vulnerable with a spreadsheet sum.
