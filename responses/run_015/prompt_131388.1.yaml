answer: |-
  Your diagnosis is remarkably close to the structural heart of the impasse. The stalemate in your group is not primarily a failure of argumentation but a failure of *categorization*. You have correctly identified that "inefficacy" is not a single causal claim but a portmanteau for three distinct causal mechanisms, each of which licenses different normative responses. The reason your group is talking past one another is that they are treating the inefficacy objection as a monolithic philosophical problem when it is actually a cluster of empirical uncertainties mapped onto conflicting normative frameworks.

  Here is the diagnosis of the impasse, engaging your taxonomy and the dynamics you described.

  ### 1. The Utility and Limits of Your Taxonomy

  Your three-way distinction (Imperceptibility, Redundancy, Displacement) is the correct analytical tool for this problem. It clarifies the impasse by revealing that your group members are not disagreeing about the *same* proposition.

  *   **Member 1 (Expected Value)** relies on **Imperceptibility (i)** and **Redundancy (ii)**. Their argument works only if there is a non-zero probability that the act triggers a threshold or adds to a sum that matters. In voting (ii), the "landslide" might have been a margin of one; in meat (i), the order might trigger a restock. For them, the moral math is $P(\text{impact}) \times \text{Value}$. As long as $P > 0$, the objection fails.
  *   **Member 2 (Complicity)** finds their footing in **Displacement (iii)**. If the market absorbs the purchase (the chicken is sold to someone else, the carbon is offset by price elasticity), then $P(\text{impact})$ is effectively zero, not tiny. The EV calculation collapses. Member 2 shifts the ground to *agency*: "I participated," regardless of the causal downstream effect. This response is inert against (i) and (ii) (where impact *is* possible) but becomes decisive in (iii).
  *   **Member 3 (Empirical)** is the pivot. They are correctly observing that we do not know which causal mode governs which case. Is the meat market threshold-based (ii) or equilibrium-based (iii)? Is the election a landslide (ii) or a toss-up (i)?

  **Where the taxonomy distorts:**
  The risk is treating these modes as mutually exclusive in practice. In complex systems (climate, global supply chains), all three operate simultaneously. Your carbon emission is imperceptible (i), likely redundant given others' emissions (ii), *and* potentially displaced by market adjustments (iii). The impasse persists because Member 1 selects the aspect of the case that allows for (i)/(ii), while Member 2 selects the aspect that ensures (iii). When they switch examples (voting vs. meat), they are shopping for the causal mode that validates their normative framework. Voting is structurally prone to (ii); Meat is structurally prone to (iii).

  ### 2. The Nature of the Disagreement: Empirical Masking Normative

  Is the disagreement substantive, verbal, or a matter of different questions? It is **substantive**, but the substantive normative disagreement is being shielded by empirical uncertainty.

  If the empirical facts were settled, the group would be forced into a starker, harder conflict.
  *   **Scenario A:** Suppose we prove meat purchasing is purely **Displacement (iii)**. The individual buyer *never* changes the number of chickens killed. Member 1 (EV) *must* concede that there is no outcome-based reason to abstain. Member 2 (Complicity) wins, but only by admitting they are no longer arguing about consequences.
  *   **Scenario B:** Suppose we prove meat purchasing is **Threshold-based (ii)**. Member 2's complicity argument becomes less urgent (though not void), and Member 1's EV argument becomes empirically robust.

  Currently, Member 3's empirical skepticism allows Members 1 and 2 to avoid this showdown. Member 1 can say, "We don't know it's displacement, so assume probability." Member 2 can say, "We don't know it's thresholds, so assume complicity."

  Therefore, the "hidden empirical question" is carrying almost all the weight. The literature often treats inefficacy as a conceptual problem, but your group has correctly intuited it is an engineering problem. However, even if the engineering were solved, a **bedrock normative disagreement** remains: *If consequences are nullified by displacement, do moral reasons vanish?* Member 1 says yes (Consequentialism). Member 2 says no (Deontology/Virtue). This is not a verbal dispute; it is a clash of first principles that the inefficacy objection merely triggers.

  ### 3. Do Non-Consequentialist Moves Change the Subject?

  You ask whether complicity, fairness, and expression change the subject. The answer depends on which failure mode is active.

  *   **Against Imperceptibility (i) and Redundancy (ii):** Non-consequentialist moves can look like subject-changing. If my vote *did* decide the election (negating ii), or if my emissions *did* cross a threshold (negating i), insisting on "complicity" rather than "outcome" seems like sour grapes.
  *   **Against Displacement (iii):** Non-consequentialist moves do **not** change the subject; they are the *only* available response. If the system reabsorbs the act such that the total harm is identical, the consequentialist reason *has* vanished. If there is still a moral reason to act (as Member 2 insists), it *must* be non-consequentialist.

  The friction in your group arises because Member 1 treats the Complicity response as a failed Consequentialist argument (i.e., "You're trying to find consequences where there are none"), while Member 2 treats it as a rival framework (i.e., "Consequences are not the only source of reasons").

  Your suspicion is correct: The Complicity response is evaluated as if it were competing to answer "Which act has better consequences?" when it is actually answering "What kind of agent am I?" or "How do I relate to this harm?" The slippage between "reasons to act" and "grounds for blame" is crucial here. We might blame a participant in a harmful system (Member 2's focus) even if their removal wouldn't change the system's output (Member 1's focus).

  ### 4. What Would Progress Look Like?

  You asked for an honest assessment of what progress looks like. Do not expect a formal result or a verdict that refutes the inefficacy objection universally. That is impossible because the objection is causally contingent.

  **Progress looks like Disaggregation and Normative Pluralism.**

  1.  **Stop seeking a Unified Theory:** Acknowledge that Voting, Meat, and Emissions are causally distinct.
      *   **Voting** is primarily a **Redundancy (ii)** problem. The EV argument is strongest here. Progress means accepting that for most voters, the outcome-based reason is negligible, and if they vote, it is for expressive or civic-duty reasons (shifting to Member 2's framework).
      *   **Meat/Emissions** are primarily **Displacement (iii)** problems. The EV argument is weakest here. Progress means admitting that if the market is efficient, the individual purchase likely changes no outcomes. If one abstains, it must be on grounds of integrity or complicity, not "saving chickens."

  2.  **Shift from Act-Tokens to Policies/Dispositions:** This is the most promising philosophical move to bridge the gap.
      *   Member 1 (EV) struggles with single acts in Displacement scenarios. But a *policy* of "I do not buy factory meat" might have different causal properties (signaling, habit formation, influencing peers) than a single token act.
      *   Member 2 (Complicity) cares about the agent's character. A *disposition* to not participate is exactly what they value.
      *   By moving the locus of evaluation from the **token act** (which is easily swallowed by displacement) to the **policy or disposition** (which has broader causal and expressive footprint), you satisfy Member 1's need for causal leverage and Member 2's need for integrity.

  3.  **Accept the Bedrock:** Finally, progress requires admitting that if the causal story is fully Displacement (iii), Member 1 and Member 2 will never agree. Member 1 will say, "Then there is no reason not to do it." Member 2 will say, "There is a reason, just not a consequentialist one." This is not a puzzle to be solved; it is a boundary line between ethical frameworks. Progress is recognizing this boundary rather than trying to cross it with arguments designed for the other side.

  ### Summary Diagnosis

  Your group is stuck because they are fighting a three-dimensional war on a two-dimensional map.
  *   **Dimension 1 (Causal):** Is the mechanism Imperceptibility, Redundancy, or Displacement? (Member 3 holds the keys).
  *   **Dimension 2 (Normative):** Do reasons depend on outcomes or agency? (Member 1 vs. Member 2).
  *   **Dimension 3 (Evaluation):** Are we judging acts, policies, or agents? (The hidden variable).

  The impasse dissolves if you force the group to agree on the causal mechanism for a specific case *before* arguing the morality. If you agree that a specific meat purchase is Displacement (iii), Member 1 must concede the EV argument fails for that token. If you agree a specific vote is Redundancy (ii), Member 2 must concede the complicity argument is less urgent than the civic duty argument.

  The "inefficacy objection" is not one objection. It is a Rorschach test. Member 1 sees a probability calculation. Member 2 sees a test of integrity. Member 3 sees a lack of data. You are right to sort them. The progress lies in stopping the attempt to force one answer to fit all three modes.
