answer: |-
  The established term is the "Wrong Kind of Reasons" problem, technically carved as the distinction between state-given and object-given reasons.

  This distinction divides considerations into those that bear on the correctness of the attitude itself (object-given) and those that bear on the benefits of holding the attitude (state-given). In your examples, the pragmatic benefits (sleeping better, working life easier, money) are state-given reasons: they count in favor of *wanting* to be in the state, or *bringing it about*, but they do not bear on the question the attitude itself answers. Forgiveness answers "Is there grounds to release this debt?"; admiration answers "Is this person meritorious?"; belief answers "Is this proposition true?". When you offer a state-given reason in deliberation about the attitude, you are answering the wrong question, which creates the sensation of a category mistake or spoilage. This spoilage occurs because attitudes like belief and admiration have constitutive aims (truth, merit); introducing considerations irrelevant to those aims undermines the integrity of the attitude, turning it into a mere simulation or instrument.

  Your boundary cases resolve when you examine whether the consideration targets the attitude's constitutive aim or a voluntary policy surrounding it. In the co-founder case, trust is often hybrid: if "trust" means believing she is reliable, pragmatic reasons are the wrong kind; but if "trust" means making a commitment to rely on her despite uncertainty to enable cooperation, pragmatic reasons are the right kind because the constitutive aim of that commitment includes maintaining the partnership. The respectability you feel suggests you are treating trust as a voluntary commitment (state-given reasons apply) rather than a purely cognitive assessment (object-given reasons required). In the admiration-cultivation case, the reason is not for the admiration itself but for the *policy* of cultivating it. This is permissible because it acknowledges the distinction: you cultivate the state *in order to* become sensitive to object-given reasons (merits) you currently miss. The consideration supports the activity of cultivation, not the fittingness of the admiration directly, so it avoids the category mistake.

  The precise carving lies in the norm of fittingness. Object-given reasons make an attitude *fitting* (the object warrants the reaction); state-given reasons make an attitude *advantageous* (having the reaction is useful). The confusion arises because both are reasons to *bring about* the state, but only object-given reasons are reasons *for* the state in the sense of validating its content. When deliberation requires validating the content, offering advantages spoils the process by substituting utility for validity.
