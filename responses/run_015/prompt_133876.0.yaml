answer: |-
  Your friend's slogan mixes compatible ideas about information with incompatible claims about consciousness, and none of the unpacked premises actually prove that uploading preserves your subjective continuity.

  *   **Substrate-Independent Patternism**
      *   **Thesis:** You are defined by the informational structure of your mind, not the biological meat running it, so moving the pattern preserves the person.
      *   **Trivial:** No, this contradicts biological naturalism.
      *   **Defensible:** Yes, within functionalist philosophy of mind.
      *   **Supports Upload Survival:** No, this justifies creating a *duplicate* who thinks they are you, but does not explain why your current stream of consciousness jumps to the new substrate instead of ending.

  *   **Socially Constituted Identity**
      *   **Thesis:** The self exists partly outside the skull in how other people model and remember you, so widening those models widens the self.
      *   **Trivial:** No, this is a specific sociological claim.
      *   **Defensible:** Yes, Hofstadter explicitly argues this in *I Am a Strange Loop*.
      *   **Supports Upload Survival:** No, this explains how you live on in *others* after death, not how *you* subjectively experience waking up in a computer.

  *   **Instantiable Strange Loops**
      *   **Thesis:** Self-reference is a computational process that can be instantiated on multiple hardware systems simultaneously without loss of fidelity.
      *   **Trivial:** No, it requires specific architectural conditions.
      *   **Defensible:** Yes, software can run on multiple servers.
      *   **Supports Upload Survival:** No, running two instances creates two distinct entities immediately upon divergence, meaning the original is replaced by a branching set of successors rather than extended.

  *   **Narrative Continuity**
      *   **Thesis:** Identity is a story told over time, and as long as the story remains coherent across the transition, the person survives.
      *   **Trivial:** Yes, in a metaphorical sense.
      *   **Defensible:** Yes, as a theory of psychological continuity.
      *   **Supports Upload Survival:** No, this confuses symbolic immortality with literal survival, allowing others to say you survived while offering no guarantee that you will experience the upload.
