      *   *Is the moral weight section too Compatibilist?* I should acknowledge that Hard Determinists would say "No moral weight." But given the user likes Dennett, leaning into Compatibilism is appropriate, while noting the alternative.
      *   *Biological nuance:* Mention that even Sphex isn't *perfectly* rigid in nature, it's an experimental artifact. This appeals to the field ecologist.

