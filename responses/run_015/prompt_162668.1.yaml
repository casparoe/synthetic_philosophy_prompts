      *   **Resolution for Each:**
          *   For Clash 1: The Swap Test needs a constraint. It's not just "would I favor this if I were them?" It's "is the ground of the favor *relational* or *categorical*?"
          *   For Clash 2: Accept that parental love *is* evolved, but argue that "evolved" doesn't mean "unjustified" if it serves a constitutive project of agency.
          *   For Clash 3: Move from "feel" to "structure."
      *   **The Missing Distinction:**
