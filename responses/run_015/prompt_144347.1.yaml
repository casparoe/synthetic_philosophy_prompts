prompt: |-
  I've been asked to run a two-hour evening session on the Principal Principle for our city rationality meetup, and I want a plan for the session rather than the session itself. Please don't write out the explanation or draft me slides; I can do that. What I need is the architecture: what has to be introduced in what order and why, what carries the idea, and where the predictable failures are.

  The audience: fifteen to twenty-five people, mostly working programmers, two or three physicists, a handful of people whose entire philosophy of probability comes from Bayesian statistics and the sequences. Roughly half will arrive with the reflex that probabilities just are degrees of belief and that "objective chance" is either shorthand for a frequency or a leftover confusion. So the principle has to be made to bite before it can be stated, or it will sound like "your probability should equal the probability."

  The carrying example. I have a candidate and I want you to either adopt it or replace it, with reasons either way. There is a sealed grey box in the town library, running on its own battery, with a screen and a lens. Every morning at nine the screen shows a number between zero and one; at noon the lens either flashes green or doesn't. The manufacturer is dead and the manual is one page: it says only that the displayed number is the chance that the lens will flash that day. The library has kept a public log for three years: on the 1,271 days the screen read 0.30, the lens flashed on 30.1 percent of them, and so on up the range. Nobody has opened the box, and I intend to refuse, on principle, to say whether its mechanism is deterministic.

  Two variants the example has to be able to absorb. First, the Calibration Rival: a black-box forecasting model trained on the public log whose calibration over the last six months beats the displayed number. If the number is the chance and the model is better calibrated, what does the principle tell me to match? I want this staged so that it forces the gap between deferring to a chance and deferring to a well-calibrated forecaster, rather than letting the two collapse into the same thing. Second, the case where the information you would gain if the event happened would itself discredit the chance you deferred to — a second machine, deliberately boring in description, whose tomorrow's number depends on today's flash. I want that to land as a genuine tension and not as a puzzle-box technicality, and I especially want your advice on the moment I say "that information is inadmissible," because someone will immediately say that this is just reclassifying every counterexample as inadmissible, and I don't yet know whether to concede that, bite it, or reframe it earlier in the sequence so it doesn't look like a rescue.

  Two constraints I'm fairly confident about and want you to check: no quantum mechanics anywhere in the example, and no coins or dice. I think I know why both matter — the first licenses "chance is a fundamental brute primitive, mystery, next question," and the second lets symmetry do all the work so the principle looks like a restatement of indifference — but tell me if I have it backwards or if the costs are different from what I think.

  What I want mapped, concretely.

  One: the dependency structure. What must be in place before the principle can be stated non-vacuously, and what depends on what. In particular, how do I get this audience to grant chance enough independence from opinion that the principle says something, without opening the metaphysical question of whether chances exist? And where does the conditional form go? My instinct is that the admissibility clause only becomes visible once they see that the principle constrains credence conditional on a chance proposition, and not unconditional credence, and I'm unsure whether that distinction belongs before the first statement of the principle or after it, as a repair.

  Two: the misconception map, keyed to three people I expect to be in the room. The determinist physicist, who will say that under a block universe the chances are zero or one and the principle either tells him nothing or tells him to be certain. The machine-learning person, who will say that chance is just the output of the best-calibrated model and the principle is expert deference with extra formalism. And the decision-theory person, who will try to drag the entire second hour into Sleeping Beauty. For each: the strongest version of the point, the exact moment in the sequence to head it off, and how much of it I should concede rather than defeat.

  Three: the check. One question at the end that distinguishes having got the idea from having memorized the formula. Tell me what a successful answer looks like and which near-miss answers I should be able to tell apart from the real thing.

  Four: what to refuse to cover, and where in the session to say so out loud. My current list is the metaphysics of laws, the amended principles that quantify over conditional chances, the Sleeping Beauty literature, and whether chances exist at all. Tell me what else is on it.

  Finally, a sequencing question I keep going back and forth on. I want the session to have one takeaway sentence, something like the thought that the principle's whole content lives in its admissibility clause, so that the real question is which information is permitted to move you away from the chance. Should I hand that sentence to the room at the start as a map, or withhold it and let it land at the end? Argue for one.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create an *architecture* (plan/structure) for a 2-hour evening session on David Lewis's Principal Principle (PP).
      *   **Constraint:** Do *not* write the explanation or slides. Focus on order, dependencies, failure points, and flow.
      *   **Audience:** 15-25 people, mostly programmers, some physicists, some Bayesians/Sequences readers. Skeptical of "objective chance" (view it as frequency or confusion).
      *   **Core Example:** A sealed grey box in a library (screen shows $x \in [0,1]$, lens flashes green with chance $x$). 3 years of calibration data. Mechanism unknown (deterministic vs. indeterministic agnostic).
      *   **Variants to Handle:**
          1.  *Calibration Rival:* A black-box ML model beats the box's calibration. Does PP say follow the box or the model?
          2.  *Inadmissible Information:* A second machine where tomorrow's number depends on today's flash. Future info discredits the chance. How to handle "inadmissibility" without it looking like a "get out of jail free" card?
      *   **Constraints:** No QM (avoids "brute primitive" dodge), No Coins/Dice (avoids symmetry/indifference confusion).
      *   **Deliverables:**
          1.  Dependency Structure (Order of concepts).
          2.  Misconception Map (Physicist, ML person, Decision Theorist).
          3.  The Check (Final question to test understanding).
          4.  Refusals (What *not* to cover).
          5.  Sequencing Advice (Takeaway sentence at start or end?).

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Formula:* $C(A | H_{tw} \& E) = x$. (Credence in A given History, Theory of Chance, and Admissible Evidence E equals the Chance x).
      *   *The Problem:* If you think chances are just frequencies or beliefs, PP is trivial ($P(A|P(A)=x) = x$).
      *   *The Bite:* PP connects *metaphysical chance* (world-stuff) to *epistemic credence* (mind-stuff). It requires granting that chance is distinct from current evidence.
      *   *The Trap:* Admissibility. If future info is allowed, PP breaks. If "admissible" just means "doesn't break PP," it's circular.

  3.  **Drafting the Architecture (Section by Section):**

      *   **Dependency Structure:**
          *   Need to establish the *gap* between Credence and Chance first. If they are the same, PP is trivial.
          *   Need to establish the *authority* of Chance. Why listen to it?
          *   Need to introduce the *constraint* (PP) *before* explaining the loophole (Admissibility), otherwise, the loophole looks like the definition.
          *   *Order:* Intuition Pump (Box) -> The Gap (Chance vs. Credence) -> The Principle (Statement) -> The Threat (Future Info) -> The Repair (Admissibility) -> The Rival (ML Model).
          *   *Why:* If you define admissibility too early, it kills the tension. If you define it too late, the principle looks falsified.

      *   **The Example (Grey Box):**
          *   *Verdict:* Keep it. It's excellent. It avoids QM (no "spooky action") and Coins (no symmetry). It forces reliance on the *testimony of the manual* + *empirical track record* rather than physical symmetry.
          *   *Refinement:* Ensure the "manual" is treated as a law-like statement, not just a claim. The calibration data supports the manual, but the manual *defines* the chance.

      *   **Misconception Map:**
          *   *Physicist (Determinist):* "Chance is 0 or 1." *Counter:* PP applies to *epistemic* situations where we lack the history. Or, compatibilism about chance. *Concession:* Grant that if they knew the microstate, chance vanishes. That *is* the inadmissibility point.
          *   *ML Person (Reductionist):* "Chance = Best Predictor." *Counter:* PP distinguishes the *source* of the probability. The box *makes* the chance; the ML model *predicts* it. If the box says 0.5 and ML says 0.9 (but box is right long-term), PP says trust the box *as chance*, ML is just evidence. *Nuance:* This is the hardest part. Need to separate "objective propensity" from "subjective calibration."
          *   *Decision Theorist (Sleeping Beauty):* "What about self-locating belief?" *Refusal:* Hard boundary. PP is about chance, not indexicals.

      *   **The Check:**
          *   Need a scenario where Chance = 0.5, Evidence = Strong (0.9), but Evidence is *inadmissible*.
          *   *Scenario:* A crystal ball shows the future outcome.
          *   *Success:* "I update to 0.9 because the crystal ball is inadmissible info overriding the chance."
          *   *Failure:* "I stay at 0.5 because PP says match chance." (Misses admissibility). OR "I update because the chance was wrong." (Misses the definition of chance).

      *   **Refusals:**
          *   Metaphysics of Laws (Humean vs. Anti-Humean).
          *   Sleeping Beauty / Self-Locating Belief.
          *   Lewis's Best System Analysis (too technical).
          *   Conditional Chances (keep it simple first).
          *   Existence of Chance (bracket it, don't solve it).

      *   **Sequencing the Takeaway:**
          *   *Option A (Start):* Sets the frame, prevents wandering. Risk: Spoilers the tension.
          *   *Option B (End):* Allows the "Aha!" moment. Risk: People get lost in the weeds of admissibility.
          *   *Recommendation:* **End.** The concept of Admissibility is the punchline. If you say it at the start, they won't feel the problem it solves. The session should feel like "Here is a rule -> Here is why it breaks -> Here is the fix -> The fix *is* the rule."

  4.  **Refining the "Admissibility" Tension:**
      *   The prompt asks specifically about the "inadmissible information" trap (reclassifying counterexamples).
      *   *Strategy:* Don't define admissibility positively. Define it negatively. "Information is admissible unless it gives you knowledge of the future outcome *through a channel other than the chance itself*."
      *   *Better:* Frame it as "Information about the *history* up to time t is admissible. Information about the *future* after t is not." Then introduce the tricky case (Machine 2) where future info leaks into the present setting.
      *   *Advice:* Acknowledge the circularity risk openly. "Lewis admits this is the weak spot." This builds trust with the rationalist audience.

  5.  **Review against Constraints:**
      *   No QM? Checked.
      *   No Coins/Dice? Checked.
      *   Audience level? High (programmers/physicists). Can handle formalism but need conceptual clarity.
      *   Time? 2 Hours. Need to pace the variants carefully.

  6.  **Final Polish of the Plan:**
      *   Make sure the "Calibration Rival" variant is placed correctly. It should come *after* Admissibility is established, to test if they understand that PP defers to *Chance*, not *Calibration*.
      *   Ensure the "Determinist" objection is handled early so it doesn't fester.
      *   Structure the "Check" to be interactive.

  7.  **Writing the Response:** (Iterative refinement during drafting)
      *   *Self-Correction on the Takeaway:* I initially thought End. But for a rationality meetup, framing the *problem* first is often better. However, the prompt asks about the specific sentence: "The principle's whole content lives in its admissibility clause." If I say that at the start, they will treat Admissibility as the definition. If I say it at the end, it's the synthesis. I will argue for **End**, but with a "Teaser" at the start.
      *   *Self-Correction on the ML Person:* This is the biggest risk. If they think Chance = Calibration, PP is empty. I need to emphasize that the Box *generates* the chance, the ML *observes* it. The Box is the "Authority," the ML is the "Expert." PP is about Authorities.
      *   *Self-Correction on the Check:* Make sure the "Near Miss" answers are distinct. One is rigid adherence (ignoring admissibility), one is Bayesian updating (ignoring chance authority).

  8.  **Final Output Structure:** Match the prompt's requested sections (Dependency, Misconception, Check, Refusals, Sequencing).

  *(Self-Correction during final review)*: Wait, the prompt asks about the "Calibration Rival" variant specifically regarding the gap between deferring to chance vs. deferring to a forecaster. I need to make sure the architecture explicitly creates space for this distinction. The ML model provides *evidence* about the chance, or *evidence* about the outcome? If it's calibrated better, does it override the chance? No, because the chance is the *truth* about the propensity. The ML model is just a better predictor of the *outcome* perhaps because it detects inadmissible info? No, if it's just better calibrated on past data, it suggests the Box's chance claim might be false.
  *Correction:* The prompt says "If the number is the chance...". We must stipulate the Box *is* the chance source. If the ML beats it, the ML is finding *inadmissible* information (leakage) or the Box is lying (not chance). To make the example work, we must assume the Box *is* the Chance source by fiat (Lewisian "Theory of Chance"). The ML model is then providing *inadmissible* evidence if it predicts better than chance allows. Or, the ML model is just a better estimator of the *history*.
  *Decision:* The architecture must force the distinction: Chance is the *metaphysical ceiling* on prediction given admissible info. If ML beats it, ML has inadmissible info. This reinforces the Admissibility clause.

  Okay, ready to write.
answer: |-
  Here is the architecture for the session. It is designed to move from intuition to formalism to tension, ensuring the "bite" of the principle is felt before the technical repairs are offered.

  ### One: The Dependency Structure

  You cannot state the Principal Principle (PP) meaningfully until the audience grants a distinction they are naturally inclined to collapse. The session must follow this specific dependency chain:

  1.  **The Gap (Credence vs. Chance):**
      *   **Goal:** Establish that $C(A)$ (credence) and $Ch(A)$ (objective chance) are distinct concepts *for this room*.
      *   **Why:** If $Ch(A)$ is just "the ideal credence," PP is a tautology ($C(A|Ch(A)=x) = x$). You must force them to treat Chance as a feature of the *world* (the box's mechanism) and Credence as a feature of the *mind* (their betting odds).
      *   **Method:** Use the Grey Box. Ask: "If the box says 0.5, but you have a strong hunch it will flash, can you be rational betting 0.9?" If they say "Yes, trust your hunch," they are rejecting PP. If they say "No, trust the box," they accept the authority of Chance.
      *   **Placement:** First 20 minutes. Do not mention Lewis or formulas yet.

  2.  **The Authority (Why Defer?):**
      *   **Goal:** Justify why Credence should align with Chance.
      *   **Why:** Programmers/Bayesians respect calibration. You need to argue that Chance is the *limit* of calibration given specific information.
      *   **Placement:** Minutes 20–40. Introduce the calibration log. Show that over the long run, the box is right. This bridges the metaphysical (chance) and the epistemic (frequency/credence).

  3.  **The Principle (The Statement):**
      *   **Goal:** Formalize the intuition. $C(A | Ch(A)=x \& E) = x$.
      *   **Why:** Now that they feel the pull of the box, give them the rule.
      *   **Placement:** Minutes 40–50.
      *   **Crucial Detail:** State it *without* the admissibility clause ($E$) first, or treat $E$ as "your current evidence." Let them feel the constraint.

  4.  **The Threat (Future Information):**
      *   **Goal:** Break the principle.
      *   **Why:** If PP holds unconditionally, it forbids updating on new evidence. If I see the flash happen, my credence should be 1, not the chance $x$.
      *   **Placement:** Minutes 50–70. Introduce the "Second Machine" variant (tomorrow's number depends on today's flash). This creates the tension where knowing the future setup changes the current chance.

  5.  **The Repair (Admissibility):**
      *   **Goal:** Restrict the evidence $E$.
      *   **Why:** This is where the principle lives. Information is admissible only if it doesn't "screen off" the chance.
      *   **Placement:** Minutes 70–90. This is the core philosophical work. Define admissibility negatively: "Information about the future outcome is inadmissible."
      *   **Handling the Circularity:** Acknowledge openly: "Yes, this looks like we are defining admissible as 'that which doesn't break the principle.' Lewis admits this is the weak spot. We are trading a metaphysical mystery for an epistemic boundary."

  6.  **The Rival (Calibration vs. Chance):**
      *   **Goal:** Distinguish the ML model from the Box.
      *   **Why:** To prevent the reduction of Chance to "Best Predictor."
      *   **Placement:** Minutes 90–105.
      *   **Resolution:** If the ML model beats the Box, the ML model is either (a) using inadmissible information (leakage from the future) or (b) the Box is not actually the source of Chance (it's just another predictor). To save PP, we must stipulate the Box *is* the Chance source. Therefore, the ML model is providing inadmissible evidence about the outcome, not a better estimate of the Chance.

  ### Two: The Misconception Map

  **1. The Determinist Physicist**
  *   **The Point:** "In a block universe or deterministic system, objective chance is 0 or 1. The box is deterministic. Therefore PP tells me to be certain or tells me nothing."
  *   **When to Head It Off:** During **The Gap (Step 1)**.
  *   **Strategy:** Concede the metaphysics, deny the relevance. "PP is a principle for *agents* embedded in time, not gods outside it. Even if the universe is deterministic, if the mechanism is computationally inaccessible to you (the sealed box), the *effective* chance is the number on the screen."
  *   **Concession:** Grant that if they *could* open the box and simulate the circuit, the chance would vanish (become 0 or 1). This actually *helps* you: it proves that Chance is relative to the *admissible information* available to the agent. The "chance" exists only relative to an information partition.

  **2. The Machine-Learning Person**
  *   **The Point:** "Chance is just the output of the best-calibrated model. If the Black-Box Rival beats the Grey Box, the Rival *is* the chance. PP is just 'defer to the best expert'."
  *   **When to Head It Off:** During **The Rival (Step 6)**.
  *   **Strategy:** Distinguish *source* from *predictor*. The Grey Box *generates* the propensity; the ML model *observes* patterns.
  *   **Concession:** Concede that in practice, we only identify chances via calibration. But insist that PP is a normative claim about *what chance is*, not how we find it. If the Box is defined as the Chance source, and the ML beats it, the ML is cheating (using future info).
  *   **Risk:** If you don't hold this line, PP collapses into "Defer to the Brier Score Winner," which loses the metaphysical bite.

  **3. The Decision-Theory Person**
  *   **The Point:** "How does this interact with Sleeping Beauty? Or self-locating belief? If the chance is 1/2 but I'm a clone..."
  *   **When to Head It Off:** **Before the session starts (in the Refusals)** and again at **The Repair (Step 5)**.
  *   **Strategy:** Hard boundary. "PP connects Chance to Credence. Sleeping Beauty connects Indexicals to Credence. Mixing them creates noise. We are bracketing self-location today."
  *   **Concession:** None. This is a scope constraint. If you allow this, you will not finish the Admissibility clause.

  ### Three: The Check

  **The Question:**
  "The Grey Box displays 0.5. You have a friend inside the library who can see the lens. She sends you a text message at 11:59 AM saying 'It is definitely going to flash at noon.' What should your credence be at 11:59 AM, and does this violate the Principal Principle?"

  **Successful Answer:**
  "My credence should be 1 (or near 1). This does *not* violate PP because my friend's text is **inadmissible information**. PP only constrains credence conditional on *admissible* evidence. Information about the future outcome that bypasses the chance mechanism is inadmissible."

  **Near-Miss Answers (Failure Modes):**
  1.  **The Rigid Dogmatist:** "My credence must stay at 0.5 because the Chance is 0.5."
      *   *Diagnosis:* They memorized the formula $C(A|Ch(A)=x) = x$ but missed the $E$ (evidence) clause. They think PP forbids updating.
  2.  **The Hard Bayesian:** "My credence is 1. PP is wrong because I should always update on evidence."
      *   *Diagnosis:* They reject the authority of Chance entirely. They haven't grasped that PP is a constraint on *how* evidence interacts with chance, not a ban on evidence.
  3.  **The Metaphysical Dodger:** "The chance wasn't really 0.5 if she knew the outcome."
      *   *Diagnosis:* They are conflating Chance with Epistemic Probability. They need to be reminded that the Box's 0.5 is a physical propensity that existed *before* the text arrived.

  ### Four: What to Refuse to Cover

  State these explicitly at the beginning (Minutes 0–5) to manage expectations and prevent derailment.

  1.  **The Metaphysics of Laws:** "We are not debating Humean Supervenience vs. Armchair Metaphysics today. We are taking 'Chance' as a given input."
  2.  **The Existence of Chance:** "Whether chances *actually* exist in our universe is a physics question. We are asking: *If* there are chances, how should you believe?"
  3.  **Sleeping Beauty / Indexicals:** "We are not covering self-locating belief. PP applies to propositions about the world, not 'where am I'."
  4.  **Conditional Chances:** "We are sticking to chances at time $t$ for events at time $t'$. We are not formalizing $Ch(A | B)$."
  5.  **Lewis's Best System Analysis:** "We are not deriving chances from laws and frequencies. We are taking the Box's manual as the source of chance."

  **Add to this list:** **The Circular Definition of Admissibility.**
  *   *Why:* You will discuss the *problem* of admissibility, but refuse to offer a definitive *solution* (because Lewis didn't have one). Tell them: "We will identify why admissibility is necessary, but we will not solve the circularity today. That is an open problem in philosophy." This prevents them from feeling you are hiding the ball.

  ### Five: Sequencing the Takeaway Sentence

  **The Sentence:** *"The Principal Principle's whole content lives in its admissibility clause; the real question is which information is permitted to move you away from the chance."*

  **Recommendation:** **Withhold until the End.**

  **Argument:**
  1.  **Preserves the Tension:** If you tell them at the start that Admissibility is the key, they will treat the first hour (The Gap and The Authority) as mere preamble. They will wait for the "real" point. You need them to feel the *conflict* between Bayesian Updating and Deference to Chance first.
  2.  **Prevents Premature Optimization:** Programmers especially will try to "solve" the Admissibility clause immediately if they know it's the goal. They will try to define it formally before they understand *why* it's needed.
  3.  **The "Aha" Moment:** The session structure is a mystery story.
      *   *Act 1:* Here is a rule (PP).
      *   *Act 2:* Here is a crime (Future Information breaks the rule).
      *   *Act 3:* Here is the detective (Admissibility).
      *   *Conclusion:* The detective *is* the rule.
      *   If you reveal the detective at the start, it's not a mystery, it's a manual.

  **Modification:**
  Give them a **Teaser** at the start instead.
  *   *Teaser:* "By the end of tonight, you will see why the Principal Principle is not a rule about believing in chance, but a rule about ignoring the future."
  *   *Takeaway:* Deliver the full sentence at Minute 110, as the summary of the Admissibility section. Then use the final 10 minutes for The Check.

  ### Specific Advice on the "Inadmissible Information" Trap

  You asked specifically about the moment you say "that information is inadmissible" and the fear of reclassifying counterexamples.

  **The Strategy:** **Own the Circularity.**
  Do not try to defend Admissibility as a clean, independent category. It is not.
  *   **Say this:** "Lewis defines admissible information roughly as 'information about the past and present, not the future.' But as our Second Machine shows, present settings can encode future outcomes. So, we must refine it: Information is inadmissible if it gives you knowledge of the outcome *by a route that bypasses the chance*."
  *   **The Concession:** "Yes, this risks being circular. We are effectively saying 'Information is inadmissible if it breaks the Principal Principle.' I am not going to pretend to solve this tonight. The value of PP is not that it solves the definition of admissibility, but that it **localizes** the problem. It tells us that *all* the metaphysical difficulty of chance is concentrated in the question of what counts as admissible evidence. That is the progress."

  This satisfies the rationalist audience. They prefer a clearly defined open problem over a hand-waved solution. It frames PP not as a finished theorem, but as a tool for mapping the boundary between physics and epistemology.
