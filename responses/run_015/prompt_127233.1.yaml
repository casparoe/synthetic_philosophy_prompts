          *   Let's look closer. If I commit to (5) Contractualism, reasonable rejection is key. Can the one reasonably reject "Save the Many"? Yes, they die. Can the five reasonably reject "Save the One"? Yes, they die. In standard contractualism (Scanlon), if the burden is equal (death), numbers don't break the tie. So (3) holds.
