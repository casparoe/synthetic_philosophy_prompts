          *   *Conflict:* If (6) is true (policy should maximize ex ante welfare), then in the small stakes case, a policy of saving the five from 10 mins terror gives everyone a better ex ante prospect than a lottery or saving the one. But (7) says numbers give *no reason* here. If numbers give no reason in the one-off small stakes, why do they generate a reason in the policy small stakes?
