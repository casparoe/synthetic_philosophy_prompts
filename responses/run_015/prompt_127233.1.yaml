          *   *Actually, the biggest tension is between (5) and (6).* (5) is Scanlonian. Scanlon explicitly rejects the "ex ante" justification for sacrificing the few in the "Numbers" case. Scanlon agrees with Taurek on the one-off, but might allow policy differences? No, Scanlon generally holds that if the complaint is death vs death, numbers don't count.
