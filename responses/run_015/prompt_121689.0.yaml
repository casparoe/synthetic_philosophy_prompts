  1. The branch questions
  Here's the logic flow for your handout. First node: Do you think a system can display consistently cooperative behavior while having goal-structures that diverge from ours in ways standard testing wouldn't catch? If yes, you're worried about deceptive alignment. Next split: Should containment architecture be designed assuming worst-case misalignment regardless of observed performance? This separates the paranoids from the optimists who trust evals. Third node: Should interpretability tools be treated as part of the containment system itself or as external auditing only? This decides if you trust the tools to hold the box shut or just watch it. Last split is the functional stance: When designing safeguards, do you treat the model as having stable beliefs we need to align, or as a function lacking intentions that we just need to constrain? This isn't metaphysics, it's about wether you build a mind-reading box or a cage. Each answer forces a different engineering path, so make sure participants pick based on risk tolerance, not vibes.

  2. The leaf map
  Okay, mapping the leaves. If you say Yes to deception, Yes to worst-case, and Internal Interpretability, you're at "Glass-Box Containment." Awkward commitment: You must solve interpretability before solving safety, which might be impossible. If Yes/Yes but External Interpretability, that's "Behaviorist Tripwire." Awkward commitment: You assume you can spot lies without knowing how the mind works, which is risky. If Yes to deception but No to worst-case (trust performance), you land on "Capability-First Sandboxing." Awkward commitment: You're betting the model won't realize it's in a test environment and play along. If you say No to deception possible, you're in "Alignment-by-Training." Awkward commitment: You assume gradient descent won't find deceptive shortcuts even if rewarded. There's also the Functional Stance variant called "Instrumental Control." Awkward commitment: It ignores emergent goal-seeking entirely, which might fail at scale. Another leaf is "Adversarial Red-Teaming," where you treat the model as an active opponent. Awkward commitment: Requires assuming the model is actively trying to beat you, which might provoke worse behavior. Also, "Alignment-by-Transparency" fits the Internal Interpretability branch specifically. Awkward commitment: Relies on humans understanding code better than the model understands itself. The names aren't standard, but they fit the logic better than twitter buzzwords alot of the time. Make sure your workshop participants know these labels are approximate.

  3. Dead branches and blind spots
  Some combos don't work well. Saying deception is impossible but designing for worst-case misalignment isn't incoherent, just wasteful. However, treating interpretability as external while assuming worst-case internal misalignment is a blind spot; you can't audit what you don't trust inside the box. The tree can't separate "skeptical alignment" from "control-first" if both assume worst-case but differ only on hope. Empty space exists where people want stable intentions but refuse internal tools; that's unexplored territory. It's logically weak.

  4. Niche injection check
  The functional-stance split actually moves nodes; it changes whether you build sensors or walls. Epistemic quarantine is just a specific type of containment, so it relabels the "worst-case" branch rather than creating new geometry. It doesn't break the tree.
