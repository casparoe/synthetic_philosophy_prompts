          *   *Moore's Actual View:* Moore explicitly argues against hedonism (value = pleasure). He introduces "organic unities" (Principia Ethica, Chapter 2). The value of a whole is not necessarily proportional to the sum of the values of its parts. A whole can have great value even if its parts (e.g., pleasure alone) have little value, or vice versa.
