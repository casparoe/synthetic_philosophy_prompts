answer: |-
  Eli stood before the refrigerated cases, tapping a pencil against his notebook where he'd written that chicken feed demands twice the acreage of cattle grain. The hum of the freezers buzzed in his ears as he multiplied the cornfield rodent deaths by the square footage needed for the poultry package.

  He scribbled the total suffering-years for the chicken, noting how the insects crushed during harvest pushed the number higher than the single cow's contribution. His finger hovered over the lean ground beef, since the ledger claimed its grazing land spared more field mice than the grain-fed bird.

  Satisfied that the beef carried a lighter debt of wild lives, Eli reached out and lifted the package of ground beef from the shelf. The plastic felt cold and slick under his palm as he prepared to move toward the checkout.

  Looking down at the page, he saw that his equation counted twelve months of a clucking hen exactly the same as twelve months of a squeaking field mouse. The neat columns of numbers suddenly looked strange, reducing distinct breathing creatures to identical sums on the paper.

  Eli returned both packages to the shelf under the bright fluorescent lights and stared at the glowing price tags. He walked away empty-handed, unsure whether the comparison collapses once he stops pretending different kinds of lives can be weighed on one scale.
