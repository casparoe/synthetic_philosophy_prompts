          2.  **Epistemic Quality:** Voting on premises without discussing *why* leads to bad information pooling.
          3.  **Normative Legitimacy:** A decision isn't legitimate unless the *justifications* are shared/agreed upon, not just the boolean outcomes.
          4.  **Metaphysical/Conceptual:** Judgments *are* reasons; you can't separate them. (Likely false/overblown).
          5.  **Reason Transmission:** If the conclusion depends on premises, the support for the conclusion depends on the support for the premises.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Interpretation 1: The Discursive Dilemma (Doctrinal Paradox).*
