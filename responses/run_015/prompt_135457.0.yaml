prompt: |-
  I'm on a research ethics board and we're trying to design a voting protocol for multi-criteria approval of clinical trials. We were going to vote on each criterion—risk, benefit, consent quality—separately then apply a threshold rule to approve. A philosopher on the board said "you can't agregate judgments without agregating the reasons behind them" and claimed that means our two-stage protocol is conceptually broken. I think he might be smuggling in some specific view about reason-transmission or maybe invoking the discursive dilemma, but I can't tell which. Could you lay out the different precise claims hiding in that one sentence? For each reading say whether it's about formal non-aggregability of reasons, about epistemic loss when voters keep reasoning private, about a normative requirement that people pool justifications before voting, or about the discursive dilemma applying directly to our criteria. Then tell me which readings actually kill our premise-based protocol vs which ones just mean we should add a deliberative round first, and flag which are trivial, which are substantive, and which are just false. I want a menu with verdicts I can bring back to the meeting, not a lecture on judgment aggregation.
