      *   *Make sure to address the forecasting angle:* The user mentioned forecasting reference classes. Fuzzy sets are actually *better* for forecasting than crisp sets because they allow for probability weights (e.g., "0.8 Western").
      *   *Address the "Unfalsifiable" worry:* If we use cluster concepts, we can still be wrong. If a society has 0 out of 10 cluster traits, calling it "Western" is false.

