prompt: |-
  Next week I am presenting at a labor-law and political-economy seminar. The thesis I am defending is that labor law should recognize a positive right to autotelic leisure—time structured by intrinsic, non-recuperative ends—rather than merely imposing chronometric hour-limits. I argue that the 35-hour week protects only residual, recuperative leisure; that karoshi is not merely an extreme of long hours but a symptom of the jurisprudential collapse of the work/leisure boundary inherited from the secularized Protestant work ethic embedded in employment-at-will doctrine; and that comparative evidence from Japanese work-style reform and France's Aubry-era 35-hour legislation shows that hour-limits without structural leisure rights reproduce the same ethic in compressed form.

  The audience is precisely this: three labor-law scholars who defend at-will employment as efficiency-enhancing and worry about judicial overreach; two comparative-law professors who have written on Japanese karoshi litigation and the French 35-hour framework and who will test whether I understand the institutional details; one labor economist who treats labor supply as revealed preference and will ask why people work long hours if leisure is so valuable; and one philosopher of work who is broadly sympathetic but thinks I am smuggling a perfectionist conception of the good life into legal doctrine.

  Draft my Q&A prep sheet. I need roughly eight objections I will actually face from this specific audience—not generic objections, but ones phrased in the vocabulary each subgroup uses—ordered from the most damaging to the least. For each objection, provide: (1) the likely speaker and the exact form they will put it in; (2) a concise reply I can deliver in about two minutes; (3) an explicit note on where that reply is weakest or concedes too much. Identify what I should concede up front to disarm the audience. Then state the single reply that must land for the proposal to survive, and flag the one question I am hoping nobody asks, with a brief strategy for deflecting it if it comes.

  Write the answer in American English.
