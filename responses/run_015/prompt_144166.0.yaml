answer: |-
  There is no single, universally agreed-upon word for this specific phenomenon, but political scientists, philosophers, and game theorists have converged on a cluster of concepts to describe it. The dynamic you are describing—where the falsity is transparent and the repetition serves as a mechanism of social sorting rather than persuasion—is most precisely analyzed through the lenses of **signaling theory**, **preference falsification**, and **common knowledge**.

  Here is a breakdown of the established concepts, how they differ from traditional propaganda, and a nuanced look at Hannah Arendt's relevance.

  ### 1. Conceptualizing the Phenomenon

  While "post-truth" is the common umbrella term, it is often too vague. Three more specific frameworks capture the mechanism you described:

  **A. Costly Signaling (Evolutionary Psychology/Game Theory)**
  In this view, the false claim is not a mistake; it is a **badge**. Because the claim is easily verifiable as false, repeating it carries a social cost (ridicule from outsiders, reputational risk). By accepting that cost, the supporter signals high commitment to the group. If the claim were plausible, believing it would require no courage or loyalty. The *absurdity* is the feature, not the bug. It forces a binary choice: "Are you one of us, or are you one of them?"

  **B. Preference Falsification (Timothy Kuran)**
  Economist Timur Kuran coined this term to describe when individuals publicly support a norm or claim they privately reject. When a leader makes an obvious falsehood, and supporters repeat it despite knowing better, they are engaging in preference falsification. This creates a spiral: as more people falsify their preferences to fit in, the public perception of reality shifts, making it riskier for dissenters to speak out. The "transparency" you note is crucial here; everyone knows everyone is falsifying, but no one admits it.

  **C. Common Knowledge (Game Theory)**
  This is perhaps the most technical fit. A fact is "common knowledge" not just when everyone knows it, but when *everyone knows that everyone knows it*.
  *   **Traditional Lie:** I try to hide the truth from you.
  *   **Your Phenomenon:** We both know this is false, but we agree to act as if it is true.
  By forcing the public to accept an obvious falsehood, a leader establishes a new baseline of "common knowledge." It demonstrates power over reality itself. It says, "I have the power to define what we agree to pretend is true."

  ### 2. Distinction from Propaganda and Cynicism

  It is important to distinguish this from older models of political deception.

  *   **Vs. Traditional Propaganda:** Classical propaganda (e.g., WWII era) generally aims to **persuade**. It wants the audience to *believe* the falsehood (e.g., "The enemy is weak"). The mechanism you describe does not seek belief; it seeks **allegiance**. Fact-checking fails against it because the supporter is not arguing about facts; they are arguing about identity.
  *   **Vs. Cynicism:** Cynicism suggests a belief that "everyone lies" or "nothing matters." This phenomenon is more active. It is not a withdrawal from truth, but a **weaponization** of it. It requires energy and coordination. It is not "I don't care what is true"; it is "I care more about my team than what is true."

  ### 3. Hannah Arendt: Settled vs. Contested

  You are correct to identify Hannah Arendt as a key touchstone, specifically her essay *"Lying in Politics"* (1971) and *The Origins of Totalitarianism* (1951). However, scholars debate how well her framework maps onto this specific "loyalty test" dynamic.

  **What is Settled (General Consensus):**
  *   **Defactualization:** Arendt argued that modern political lying differs from traditional lying. The traditional liar hides the truth; the modern political liar (specifically in totalitarian contexts) seeks to destroy the "factual ground" itself. She called this "defactualization."
  *   **The Loss of Common Sense:** Arendt believed that when lies become pervasive, they erode *sensus communis* (common sense). This isolates individuals, making them more dependent on the leader for their grasp of reality.
  *   **Image-Making:** In *"Lying in Politics,"* she analyzed the Pentagon Papers and noted a shift toward "image-making," where policy is designed for public consumption rather than actual outcomes. She viewed this as a threat to the republic's stability.

  **What is Contested (Scholarly Debate):**
  *   **Complicity vs. Dupery:** There is significant debate over whether Arendt believed the subjects *knew* they were being lied to.
      *   *Reading A (The Isolated Subject):* Some scholars argue Arendt believed totalitarian propaganda actually *succeeded* in making people believe the lies, largely by isolating them from alternative information sources. In this reading, the supporters are victims of epistemic closure.
      *   *Reading B (The Complicit Subject):* Other scholars (such as Seyla Benhabib or contemporary interpreters like Jason Stanley) argue Arendt understood that the lie functions to test obedience. In this reading, the subject may know the lie is false but accepts it to survive or belong. This aligns closer to your observation, but it is a matter of interpretation, not explicit textual consensus.
  *   **Intent vs. Structure:** There is disagreement on whether Arendt viewed this as a calculated strategy by leaders or a structural byproduct of bureaucracy. In *"Lying in Politics,"* she suggests that decision-makers sometimes begin to believe their own fabrications (self-deception), whereas your description implies a cold, strategic calculation by the leader. Arendt's view on whether the liar *knows* they are lying is nuanced; she suggests that in modern politics, the line between the liar and the lie blurs.
  *   **Applicability to Democracy:** Arendt focused heavily on totalitarian regimes. Political theorists contest whether her framework applies directly to democratic erosion. Some argue that in a democracy, the "loyalty test" lie functions differently because there are still independent institutions (courts, press) that maintain a competing reality, whereas Arendt often wrote about contexts where those institutions were already destroyed.

  ### 4. Summary of Terms

  If you are looking for the most precise vocabulary to use:

  1.  **"Performative Falsehood"**: Captures that the act of speaking is more important than the content.
  2.  **"Epistemic Signaling"**: Highlights that the claim is a signal of group membership regarding knowledge/truth.
  3.  **"Preference Falsification"**: Highlights the gap between private belief and public assertion.

  **Recommendation:**
  While "Post-Truth" is the common noun, the most accurate description of the *mechanism* is **"Common Knowledge Signaling."** This captures the specific weirdness you noted: that the transparency of the lie is what makes it effective. It transforms the lie from a claim about the world into a claim about the relationship between the speaker and the listener.

  Regarding Arendt, it is safest to say: *Arendt identified the destruction of the factual ground as a political tool, but contemporary theorists have expanded her work to explain how obvious falsehoods function specifically as loyalty signals in fragmented media environments, a nuance that remains a subject of scholarly interpretation.*
