answer: |-
  You have noticed a structural dynamic that is central to contemporary philosophy of mind, and there are established terms for the different facets of what you are describing. However, no single word captures the entire chain (the slide, the lack of relief, and the undermining) in one package.

  Here is the breakdown of the terminology that maps onto your observation, followed by a precise coinage for the specific dynamic of "stuckness" you identified.

  ### 1. The Slide: **The Meta-Problem of Consciousness**
  The specific shift you described in your second case (and the structural move in your first) has an established name: **The Meta-Problem of Consciousness**.

  Coined prominently by David Chalmers (2018), this term refers to the problem of explaining *why we think* there is a hard problem of consciousness. Instead of asking "Why is there experience?" (the Hard Problem), the theorist asks "Why do people *say* there is experience?" or "Why do people *judge* that physical accounts are insufficient?"

  *   **How it fits:** It names the "slide" from the object (the machine/experience) to the subject (the belief/report about the machine/experience).
  *   **The Promise:** Proponents (often Illusionists or Eliminativists like Keith Frankish or Daniel Dennett) suggest this is an "Easy Problem." They argue that explaining the *behavior* of claiming to have consciousness is tractable, whereas explaining consciousness itself is not.
  *   **The Boundary:** This term applies specifically to consciousness. If you saw this same move in ethics (shifting from "Is this good?" to "Why do we *think* this is good?"), it would be called **Genealogical Debunking** or **Evolutionary Debunking**.

  ### 2. The Reduction: **Psychologism**
  In your first case, when you told your friend that his inability to imagine the machine having experience was "just a fact about him," you committed a move known as **Psychologism**.

  *   **Definition:** The reduction of logical, metaphysical, or normative truths to mere psychological facts about the thinker.
  *   **How it fits:** You treated his metaphysical conviction ("No physical account captures experience") as a psychological limitation ("His imagination won't accept it").
  *   **The Boundary:** Psychologism is traditionally considered a fallacy (argued against by Frege and Husserl) because it conflates *why we believe X* with *whether X is true*. However, in consciousness studies, it is often used deliberately as a strategy to dissolve the Hard Problem.

  ### 3. The Undermining: **Epistemic Self-Defeat**
  You noted that your explanation "would have applied to my friend's own conviction, so that his insisting on it started to look like the very thing needing an explanation rather than a reason for me to accept it." This is **Epistemic Self-Defeat** (or a **Self-Undermining Explanation**).

  *   **Definition:** An explanation that, if true, undermines the rational grounds for accepting the explanation itself.
  *   **How it fits:** If you explain your friend's conviction as merely a psychological quirk, you must also explain your own conviction (that he is wrong) as a psychological quirk. If all convictions are just psychological quirks, neither side has a claim to truth.
  *   **The Boundary:** This occurs whenever a theory explains away the very intuition required to believe the theory. (e.g., "All beliefs are determined by physics" is a belief; if it is determined by physics, why trust it as true?)

  ### 4. The "Stuckness": **The Hardness of the Meta-Problem**
  You observed that the new question "inherits the whole difficulty of the old one." You felt that explaining the *belief* in consciousness was just as hard as explaining consciousness itself.

  There is no single noun for this, but it is the central objection to the Meta-Problem approach. David Chalmers explicitly distinguishes between the **Easy Meta-Problem** (explaining reports of consciousness via simple mechanisms) and the **Hard Meta-Problem** (explaining why we make these reports in a way that doesn't secretly presuppose consciousness).

  Critics argue that to explain why we *think* we are conscious, you eventually have to explain why it *feels like* something to think that, which brings you right back to the Hard Problem.

  ### A Coinage for the Specific Dynamic
  Since you asked for a name for the *combination* of these features (the slide to the second-order, the failure to reduce difficulty, and the reflexive undermining), and because existing terms split these features apart, I propose the following term to capture the precise phenomenon you noticed:

  **Term:** **Explanatory Recursion**
  **Definition:** An argumentative move where a first-order difficulty (e.g., "What is experience?") is displaced to a second-order explanation (e.g., "Why do we believe in experience?"), but the second-order explanation implicitly requires the resources of the first-order explanation to succeed, resulting in no net gain in explanatory power.

  **Boundary Cases:**
  *   **Successful Reduction (Not Explanatory Recursion):** Explaining why people believe in ghosts by citing sleep paralysis. This *is* easier than proving ghosts exist, because sleep paralysis does not require ghosts to explain.
  *   **Explanatory Recursion (Your Case):** Explaining why people believe in experience by citing... experience. If the explanation of the belief relies on the very phenomenon being explained (or an equivalent difficulty), it is recursive.
  *   **Simple Psychologism (Not Explanatory Recursion):** Dismissing an opponent by saying "You are just saying that because you are angry." This is an *ad hominem*; it doesn't attempt to solve the problem, it just attacks the person. Explanatory Recursion attempts to solve the problem but fails to reduce the difficulty.

  ### Summary
  *   The **Slide** is called **The Meta-Problem of Consciousness**.
  *   The **Reduction** is called **Psychologism**.
  *   The **Undermining** is called **Epistemic Self-Defeat**.
  *   The **Stuckness** (your core insight) is the objection that **The Meta-Problem is Hard**.
  *   The **Combined Phenomenon** can be precisely labeled **Explanatory Recursion**.

  Your intuition is correct: this move is often presented as a way out (by Illusionists), but it is widely recognized by Realists as a shell game that hides the original difficulty inside the explanation of the belief. You have independently rediscovered the central tension in the current philosophy of mind debate between Chalmers (Realism) and Frankish/Dennett (Illusionism).
