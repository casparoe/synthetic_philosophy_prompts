answer: |-
  Here is a specification of desiderata for a consequentialist decision procedure designed to operate under radical cluelessness, followed by an adjudication of their compatibility and a brief evaluation of candidate approaches.

  ### I. Desiderata for a Procedure Under Cluelessness

  **1. Non-Dissolution (The Reality Constraint)**
  *   **Specification:** The procedure cannot assign zero weight to consequences that are structurally unmeasurable or epistemically inaccessible. It must acknowledge that far-future effects exist and are ontologically significant.
  *   **Consideration:** To stipulate that unmeasurable effects count for nothing is to solve the problem by changing the ontology of consequentialism. It turns the view into "Knowable-Consequentialism," which abandons the core commitment that value is mind-independent.
  *   **Adjudication:** **Non-negotiable.** Without this, the procedure is not consequentialist; it is a form of epistemic constructivism.

  **2. Non-Reduction (The Dominance Constraint)**
  *   **Specification:** The procedure cannot simply maximize expected value based solely on near-term, estimable effects. It must not treat the near-term as a proxy for the long-term unless a specific justificatory link is established.
  *   **Consideration:** The definition of cluelessness states that far-future effects *dominate* near-term ones in expected magnitude. Ignoring them because they are hard to measure violates the dominance premise.
  *   **Adjudication:** **Non-negotiable.** To reduce to near-term maximization is to concede that cluelessness defeats consequentialism, rather than providing a procedure to navigate it.

  **3. Grain-Invariance (The Framing Constraint)**
  *   **Specification:** Verdicts must remain stable when options are re-individuated (e.g., splitting "Donate to Charity A" into "Donate $10" and "Donate $20," or merging two career paths into "Work in Sector X").
  *   **Consideration:** If verdicts swing based on how the agent describes the option space, the procedure is vulnerable to framing effects and manipulation. It undermines the objectivity of the verdict.
  *   **Adjudication:** **Structural Preference.** While highly desirable for coherence, I classify this as a preference rather than a hard non-negotiable because standard decision theory often takes the option set as exogenous. Enforcing this may require meta-rules about canonical option description that are external to the decision procedure itself.

  **4. Near-Term Weight under Symmetry (The Action-Guidance Constraint)**
  *   **Specification:** When long-run effects are judged to be roughly sign-symmetric (equally likely to be positive or negative) or orthogonal to the choice, the procedure must specify what weight near-term reasons retain. It cannot declare all options permitted simply because the long-run is unknown.
  *   **Consideration:** If the long-run is noise, and the procedure says "all options equal," it violates the requirement to act. If it says "maximize near-term," it risks violating Non-Reduction. It must explain *why* the known small good outweighs the unknown massive good.
  *   **Adjudication:** **Non-negotiable.** A decision procedure that fails to guide action in common cases (where long-run symmetry is the best estimate) is practically useless.

  **5. Anti-Fanaticism (The Astronomical Payoff Constraint)**
  *   **Specification:** The procedure must not recommend options solely on the basis of tiny-probability, astronomical-payoff outcomes (Pascal's Mugging) unless the evidence for the link is robust, regardless of the agent's subjective prior.
  *   **Consideration:** A reflective non-specialist cannot have reliable priors for metaphysical possibilities. A procedure that inherits arbitrary priors allows fanaticism to dominate ordinary moral reasons.
  *   **Adjudication:** **Non-negotiable.** For a procedure aimed at real-time agents, susceptibility to mugging renders it action-guiding only in theory, not in practice.

  **6. Graceful Degradation (The Permissibility Constraint)**
  *   **Specification:** The procedure must distinguish between returning a set of permitted options and returning an empty set (paralysis). As cluelessness deepens, the set of permitted options may widen, but it must not vanish.
  *   **Consideration:** The prompt stipulates the agent is "not entitled to the answer that no option is better." The procedure must handle deep uncertainty without collapsing into skepticism.
  *   **Adjudication:** **Non-negotiable.** This is a functional requirement for any algorithm intended to be run by an agent who *must* act.

  **7. Endogenous Deliberation (The Value of Information Constraint)**
  *   **Specification:** The procedure must determine whether, and how much, to invest in reducing cluelessness (research/thinking) versus acting on current evidence.
  *   **Consideration:** Cluelessness is partly a function of time and resources. A rational procedure must treat the reduction of uncertainty as an instrumental good, bounded by the costs of delay.
  *   **Adjudication:** **Non-negotiable.** Ignoring the cost of deliberation leads to either paralysis (infinite research) or rashness (zero research).

  ---

  ### II. Incompatibility and the "Most Work" Constraint

  **The Impossible Subset**
  I judge that **Non-Reduction**, **Near-Term Weight under Symmetry**, and **Grain-Invariance** cannot be jointly satisfied.
  *   **Reasoning:** If far-future effects dominate (Non-Reduction), then finer grain individuation (Grain) typically reveals *more* causal pathways to the far future, increasing the variance of the unknown component. If the procedure respects Grain-Invariance, it must discount these new pathways to keep the verdict stable. But discounting new pathways based on their complexity or unknowability looks like assigning them zero weight (violating Non-Dissolution/Non-Reduction). If it *doesn't* discount them, the verdict shifts with grain (violating Grain-Invariance). If it keeps the verdict stable by relying on near-term effects, it must justify why near-term effects trump the newly revealed long-term variance (violating Near-Term Weight unless a specific bridge principle is added).

  **The Constraint Doing the "Most Work"**
  You suspect **Grain-Invariance** is the primary exclusionary constraint. I argue against this. The constraint doing the most work is **Near-Term Weight under Symmetry**.

  *   **Argument:** Grain-Invariance is a formal coherence condition; it can often be sidestepped by stipulating a "canonical" level of description for options (e.g., basic bodily movements or high-level life choices). While theoretically messy, it is a manageable technical hurdle.
  *   **Why Near-Term Weight is Harder:** This constraint requires a substantive normative bridge between *epistemic* status (unknown) and *ontological* weight (dominant). To satisfy Near-Term Weight, the procedure must explain why a known unit of near-term value is not swamped by an unknown unit of long-term value that is acknowledged to be potentially orders of magnitude larger.
      *   If you say the long-term value *does* swamp it, you lose Action-Guidance (because the sign is unknown).
      *   If you say the long-term value *does not* swamp it, you violate Non-Reduction (because you are effectively treating the long-term as negligible).
      *   Solving this requires a new normative principle (e.g., "uncertainty discounts magnitude" or "only robust consequences count"), which fundamentally alters the consequentialist calculus. Grain-Invariance is merely a consistency check; Near-Term Weight demands a reconstruction of value theory under uncertainty.

  ---

  ### III. Evaluation of Candidate Procedures

  1.  **Maximizing Expected Value (EV) with a Prior over Signs:**
      *   **Performance:** Fails **Anti-Fanaticism** and **Near-Term Weight**.
      *   **Analysis:** If the agent assigns a non-zero prior to astronomical payoffs, EV dominates near-term reasons. If the agent assigns a symmetric prior to the long run, the variance is so high that near-term reasons are mathematically swamped unless the utility function is bounded. It satisfies Non-Dissolution but fails Action-Guidance for non-specialists.

  2.  **Deferring to Robust Near-Term Reasons:**
      *   **Performance:** Fails **Non-Reduction**.
      *   **Analysis:** This procedure effectively treats cluelessness as a reason to ignore the long run. It satisfies Action-Guidance and Grain-Invariance (mostly) but dissolves the problem by stipulating that "unmeasurable" implies "decision-irrelevant," violating the core consequentialist commitment to objective value.

  3.  **Hedging Across a Portfolio of Bets:**
      *   **Performance:** Best on **Endogenous Deliberation** and **Graceful Degradation**; ambiguous on **Non-Reduction**.
      *   **Analysis:** This approach treats options as bets on different moral theories or causal models. It allows for acting without resolving cluelessness. However, it struggles to specify *how* to hedge without a meta-probability distribution (which returns us to the EV problem). It handles Grain-Invariance better by focusing on the *distribution* of outcomes rather than point estimates, but it risks becoming too vague to be action-guiding.

  ---

  ### IV. Confidence Statement

  I am **highly confident** (85%) that **Near-Term Weight under Symmetry** is the more fundamental bottleneck than Grain-Invariance, as it strikes at the core tension between consequentialist ontology and epistemic limitation. I am **moderately confident** (70%) in the incompatibility of the triad (Non-Reduction, Near-Term Weight, Grain-Invariance), as a clever formalization of "option individuation" might resolve the grain issue without sacrificing the other two.

  I am **least sure** about the evaluation of **Hedging/Portfolio** approaches. This is the least formalized of the three candidates in the literature, and it is possible that a sophisticated "moral hedging" procedure could satisfy Near-Term Weight without violating Non-Reduction by treating the *robustness* of an outcome as a second-order value, though this risks collapsing into a non-consequentialist view.
