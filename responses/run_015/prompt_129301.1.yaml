answer: |-
  **To:** The Admissibility Committee
  **From:** The Chair
  **Subject:** Admissibility of Joint Submission on River Personhood
  **Date:** 24 May 2024

  Colleagues,

  We find ourselves at a juncture where our accumulated case law is less a coherent jurisprudence and more a sedimentary record of our own shifting philosophical comfort levels. You have asked for a decision that maintains consistency with our six precedents. I must begin by stating plainly: **I assess the confidence that these six precedents form a coherent logical system at approximately 20%.**

  We are attempting to apply Rawlsian constraints on public reason within a Citizens' Convention, a body designed precisely to broaden the scope of discourse beyond the technocratic. The tension between Precedent 1 (Bishops/Embryo) and Precedent 6 (Churches/Refugees) is not merely a tension; it is a contradiction that was acknowledged at the time ("over a dissent that this was flatly inconsistent with 1") and resolved in favour of admissibility. Precedent 6 effectively amended Precedent 1, though we never formally codified the change.

  Below is the analysis of the candidate rules, their predictions, and the necessary critique of our practice.

  ### 1. Analysis of Candidate Rules

  **A. The Translation Requirement (derived from Precedent 1)**
  *   **Principle:** Religious or comprehensive doctrines cannot justify a policy conclusion unless accompanied by an independent secular argument sufficient to sustain that specific conclusion.
  *   **Application:** The Secular Charity's appendix explicitly states their consequentialist case *does not* support legal personhood, only weaker protections. The religious partners provide the only justification for the specific claim.
  *   **Prediction:** **Reject** (or return for revision).
  *   **Confidence:** 90% (based strictly on the text of Prec 1).
  *   **Consistency Check:** Inconsistent with Precedents 2, 4, 5, and 6.

  **B. The Civic-Respect Rule (derived from Precedent 3)**
  *   **Principle:** Submissions are admissible unless they deny the equal standing of other citizens (e.g., calling beliefs "arrested development").
  *   **Application:** Claiming a river is a person does not deny the standing of the farmers, even if it burdens their economic interests. The animist cosmology is affirmed literally, but not imposed as a test for citizenship.
  *   **Prediction:** **Admit**.
  *   **Confidence:** 85%.
  *   **Consistency Check:** Consistent with 2, 4, 5, 6. Inconsistent with the *rationale* of 1 (which demanded more than just respect).

  **C. The Officials-Only Restraint (derived from Precedent 4)**
  *   **Principle:** The duty of secular restraint applies to state officials, not citizens in a convention. Citizens may argue from comprehensive doctrines provided they seek exemptions or specific burdens rather than imposing theology.
  *   **Application:** This is a Citizens' Convention. The claim seeks a legal status (personhood) which imposes a burden on operators, but Precedent 4 suggests citizens are not bound by the restraint we impose on officials.
  *   **Prediction:** **Admit**.
  *   **Confidence:** 80%.
  *   **Consistency Check:** Directly contradicts the *outcome* of Precedent 1 (where citizens *were* bound to translate).

  **D. The Convergence Rule (derived from Precedent 5)**
  *   **Principle:** Agreement between opposed comprehensive doctrines (e.g., Catholic and Marxist) constitutes a form of public reason sufficient for admissibility.
  *   **Application:** We have Anglican, Animist, and Secular convergence. However, the Secular partner admits their doctrine does not actually reach the conclusion without the "fiction." This weakens the "Overlapping Consensus" argument.
  *   **Prediction:** **Admit** (with a note on the fictive nature).
  *   **Confidence:** 70%.
  *   **Consistency Check:** Consistent with 5, but stretches the definition of convergence if one partner admits their reasoning is instrumental rather than foundational.

  **E. The Congeniality Rule (derived from Precedent 6)**
  *   **Principle:** Purely religious arguments are admitted when the conclusion aligns with the Convention's broad ethos (e.g., refugee protection, nature conservation), overriding the Translation Requirement.
  *   **Application:** This is a Convention on *Climate and Nature*. A submission protecting a river is highly congenial. The religious arguments (Creation, Cosmology) are the primary drivers.
  *   **Prediction:** **Admit**.
  *   **Confidence:** 95% (based on the trajectory of Prec 6 over Prec 1).
  *   **Consistency Check:** Consistent with 2, 4, 5, 6. Inconsistent with 1.

  ### 2. The Closest Analog

  **Precedent 6 (Churches/Refugees)** is the controlling analog.
  In Precedent 6, a submission argued *purely* from Scripture and was admitted, despite the dissent noting the inconsistency with Precedent 1. In the current case, the religious arguments (Anglican/Animist) are the only ones actually supporting the specific claim of personhood. The Secular Charity's appendix functions similarly to the preface in Precedent 1 or the framing in Precedent 2: it is present, but it is not the engine of the argument. Since Precedent 6 established that a lack of independent secular sufficiency is not fatal when the conclusion is humanitarian (or in this case, environmental), Precedent 6 governs.

  ### 3. Underdetermination and Principles Adopted

  Our precedents genuinely underdetermine this decision because we have never resolved whether Precedent 1 was an anomaly or the rule.

  *   **If we Reject:** We adopt the principle that **Procedural Integrity trumps Inclusivity.** We would be affirming that the "Translation Requirement" is the bedrock of the Convention, and that Precedent 6 was an error. We would be prioritising the logical consistency of the public record over the expressive liberty of the citizens.
  *   **If we Admit:** We adopt the principle that **Democratic Expression trumps Public Reason.** We would be affirming that in a Citizens' Convention, the source of a value (theology, cosmology, or fiction) is less important than the fact of the coalition and the alignment with the Convention's remit. We accept that "fictive framing" is a valid political tool for citizens, even if it lacks ontological truth.

  ### 4. A Discriminating Case

  To distinguish between the **Civic-Respect/Officials-Only Rule** (which suggests citizens can argue anything respectful) and the **Congeniality Rule** (which suggests we only admit what we like), we require a case where the conclusion is *uncongenial* to the Committee but procedurally identical to this one.

  **The Test Case:** A joint submission from a Traditionalist Catholic group and a Secular Heritage Society arguing against the construction of *wind farms* on a specific ridge.
  *   **Arguments:** Catholics argue from Stewardship of Creation (landscape as God's temple); Secular partners argue from aesthetic heritage but admit that economically, the wind farm is superior.
  *   **Discrimination:**
      *   If we **Admit** this, the **Officials-Only/Civic-Respect Rule** holds (citizens may argue from doctrine regardless of the conclusion).
      *   If we **Reject** this (citing lack of secular sufficiency, per Precedent 1), the **Congeniality Rule** holds (we only relaxed the rules for the Refugees and the River because we liked the outcome).

  ### 5. A Plain Speaking Critique

  You asked me to say plainly if the practice is misconceived. **It is.**

  We are a Citizens' Convention. The distinct purpose of such a body, as opposed to a Parliament or a Court, is to allow citizens to bring their whole selves—their faiths, their cultures, their moral intuitions—into the deliberative space. By vetting the *reasons* rather than the *civility* of the submission, we are replicating the exclusionary mechanisms of the technocratic state we were convened to advise.

  Precedent 1 was likely a mistake born of bioethical anxiety. Precedent 6 was a correction towards democratic reality. The current submission highlights the absurdity of our position: the Secular Charity is being honest enough to tell us their secular argument fails, yet they argue the "fiction" is motivationally indispensable. To strike this down is to demand a dishonesty from our secular partners (pretending the secular case is stronger than it is) while simultaneously policing the honesty of our religious partners.

  ### Recommendation

  **Decision:** **Admit the submission in full.**

  **Reasoning:** To reject it would be to resurrect Precedent 1, which Precedent 6 effectively overruled. The weight of our recent practice (Precedents 2, 4, 5, 6) favours admissibility provided civic respect is maintained (Precedent 3). The "fictive framing" admitted by the Charity is a political strategy, not a violation of admissibility; citizens are permitted to use rhetoric and metaphor to motivate action.

  **Caveat:** We must append a note to the record acknowledging that the secular appendix does not independently sustain the claim of personhood, to ensure the public record reflects the actual weight of the arguments.

  **Confidence in this Decision:** 85% (as the most faithful interpretation of our *current* practice, if not our *logical* consistency).
  **Confidence in the Coherence of our Precedents:** 20%.

  We should schedule a committee review to formally retire the "Translation Requirement" of Precedent 1, as it is no longer operable.

  Yours,

  **The Chair**
