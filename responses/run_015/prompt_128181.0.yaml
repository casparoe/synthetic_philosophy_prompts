  # The Transformative Sorter

  **Instructions:** Start at Question 1. Follow the Yes/No path until you reach a Leaf. Answer based on the concrete case in front of you, not on what category you think it belongs to.

  ### Questions

  1.  **Can you try a smaller version of this first without locking yourself in?**
      *   **Yes:** Go to 2.
      *   **No:** Go to 3.

  2.  **If you tried that smaller version, would it tell you what the full experience feels like?**
      *   **Yes:** Go to Leaf 1.
      *   **No:** Go to Leaf 2.

  3.  **Is staying exactly as you are now a real option?**
      *   **No:** Go to Leaf 3.
      *   **Yes:** Go to 4.

  4.  **Afterward, will you judge whether this was worth it using the same priorities you have now?**
      *   **Yes:** Go to 7.
      *   **No:** Go to 5.

  5.  **If your priorities change, will you still be able to see why your old self wanted what they wanted?**
      *   **Yes:** Go to 6.
      *   **No:** Go to Leaf 6.

  6.  **Does finding out the answer beforehand ruin the point of doing it?**
      *   **Yes:** Go to Leaf 7.
      *   **No:** Go to Leaf 8.

  7.  **Can you get reliable data from other people who have done this?**
      *   **Yes:** Go to Leaf 4.
      *   **No:** Go to Leaf 5.

  ---

  ### Leaves

  **Leaf 1: Nothing special is going on.**
  *   **Path:** 1-Yes, 2-Yes.
  *   **Verdict:** This is ordinary decision-making under uncertainty; go get evidence and compute.
  *   **Awkward Commitment:** You must trust your current self's judgment to interpret the sample correctly.

  **Leaf 2: The specialness is real but cheaply fixable.**
  *   **Path:** 1-Yes, 2-No.
  *   **Verdict:** Run the experiment anyway; the noise is manageable.
  *   **Awkward Commitment:** You must act on a signal you know is imperfect.

  **Leaf 3: The choice isn't really a choice.**
  *   **Path:** 1-No, 3-No.
  *   **Verdict:** Decision theory is idle; you are responding to necessity, not weighing options.
  *   **Awkward Commitment:** You must surrender agency and stop pretending you could do otherwise.

  **Leaf 4: Ordinary uncertainty, high stakes.**
  *   **Path:** 1-No, 3-Yes, 4-Yes, 7-Yes.
  *   **Verdict:** Ordinary decision-making, but you must rely on testimony rather than simulation.
  *   **Awkward Commitment:** You must trust second-hand data to carry the full weight of the risk.

  **Leaf 5: Incoherent.**
  *   **Path:** 1-No, 3-Yes, 4-Yes, 7-No.
  *   **Diagnosis:** Unoccupied. If your priorities stay the same but you can't sample and can't get data, you aren't deciding; you're guessing in the dark.
  *   **Diagnosis Line:** Incoherent: A blind gamble disguised as a decision.

  **Leaf 6: No determinate answer.**
  *   **Path:** 1-No, 3-Yes, 4-No, 5-No.
  *   **Verdict:** A nasty one where even asking whether it was worth it for me has no determinate answer.
  *   **Awkward Commitment:** You must act without a metric for success that survives the act.

  **Leaf 7: The identity leap.**
  *   **Path:** 1-No, 3-Yes, 4-No, 5-Yes, 6-Yes.
  *   **Verdict:** The case where the only thing left to go on is whether you want to find out who you'd turn into.
  *   **Awkward Commitment:** You must bet on curiosity over comfort without knowing the payoff.

  **Leaf 8: Cold engineering.**
  *   **Path:** 1-No, 3-Yes, 4-No, 5-Yes, 6-No.
  *   **Diagnosis:** Unoccupied. Deep change is possible, you can remember your old self, but mystery adds no value.
  *   **Diagnosis Line:** Unattractive: Treats a shift in who you are as a mere calculation.

  ---

  ### Test Cases

  | Case | Path | Leaf | Notes |
  | :--- | :--- | :--- | :--- |
  | **Becoming a parent** | 1-No, 3-Yes, 4-No, 5-Yes, 6-Yes | **7** | Fits the canonical "transformative" mold perfectly. |
  | **Starting HRT** | 1-No, 3-Yes, 4-No, 5-Yes, 6-No | **8** | **Flag:** Lands in Unoccupied. Many users report Q6=No (medical clarity), but Q4=No (priority shift). Suggests the tree sees this as "calculated identity shift" rather than a leap. |
  | **Converting to religion** | 1-No, 3-Yes, 4-No, 5-No, 6-Yes | **6** | Faith often breaks retrievability (Q5=No). Fits "No determinate answer." |
  | **Starting a PhD** | 1-Yes, 2-Yes | **1** | Masters/coursework act as high-fidelity samples. Ordinary uncertainty. |
  | **Moving abroad (no language)** | 1-No, 3-Yes, 4-Yes, 7-Yes | **4** | Visits (Q1) aren't full living. Priorities same (Q4). Data available (Q7). Ordinary High Stakes. |
  | **Taking a psychedelic** | 1-No, 3-Yes, 4-No, 5-Yes, 6-Yes | **7** | Low dose isn't a sample. Priorities shift. Mystery is key. |
  | **First serious relationship** | 1-No, 3-Yes, 4-No, 5-Yes, 6-Yes | **7** | Casual dating isn't a sample for commitment. Fits "Identity leap." |
  | **Cochlear implant (deaf adult)** | 1-No, 3-Yes, 4-No, 5-No, 6-No | **6** | **Flag:** Often Q5=No (Deaf culture/values shift). Lands in "No determinate answer" rather than "Identity leap." |
  | **Prison sentence** | 1-No, 3-No | **3** | Not a choice. |
  | **Chronic illness diagnosis** | 1-No, 3-No | **3** | Not a choice (acceptance vs denial isn't the choice itself). |
  | **Adopting a dog** | 1-Yes, 2-Yes | **1** | Fostering is a high-fidelity sample. Ordinary uncertainty. |

  ---

  ### Honesty Check: Collapsed Leaves

  **Leaf 1 (Ordinary) vs. Leaf 4 (Ordinary High Stakes)**
  *   **The Split:** Whether you can sample personally (Leaf 1) or must rely on others (Leaf 4).
  *   **The Collapse:** At the margins, a bad sample (Leaf 2) and relying on others (Leaf 4) feel identical: you are acting on incomplete data. The tree separates them based on *source* (self vs. other), but the decision procedure ("trust the data you have") is the same.
  *   **Verdict:** This is a verbal dispute wearing a substantive one's clothes. The epistemic position is identical; only the social mechanism differs.

  **Leaf 6 (No Determinate Answer) vs. Leaf 7 (Identity Leap)**
  *   **The Split:** Whether you can retrieve your old self's values (Q5).
  *   **The Collapse:** In practice, "I can't understand why I wanted that" (Leaf 6) and "I understand but don't care anymore" (Leaf 7) often feel the same from the inside: the old self is dead. The tree forces a distinction on *retrievability*, but the decision procedure ("jump anyway") is identical.
  *   **Verdict:** Real continuum. The tree draws a hard line where users experience a fade. Leaf 6 cases just feel more violent than Leaf 7 cases, but the math doesn't change.
