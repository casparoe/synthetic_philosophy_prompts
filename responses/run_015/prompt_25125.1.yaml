  This differs from the **Non-Identity Problem** (which concerns *who* exists, not the value of a past life) and **Reputation** (which concerns others' beliefs, not actual outcomes). It also differs from Parfit's **Future Generations** work, which focuses on obligations to future people, not how their existence retroactively values your life.

  **Settled:** There is consensus that this intuition conflicts with strict Experientialism. Most agree that if posthumous harm is possible, Experientialism is false.
  **Contested:** Whether posthumous harm is metaphysically possible. **Timeless** theories say yes (events can affect past welfare); **Existence** theories say no (you must exist to be harmed). Some argue you care about the *project*, not your *well-being*.

  If your colleague meant a specific named paradox, she may have referred to **The Epicurean Challenge** regarding death's badness, but **Posthumous Harm** is the specific literature for events after death affecting life's value. Some also discuss this under **Posthumous Interests**. The specific intuition about humanity's survival touches on **Impersonal Value**, but your framing ("my life going well") keeps it within prudential value debates.
