  Patient M has undergone complete commissurotomy. Seated in a controlled booth, M fixates centrally on a dot. For 150ms, a specific color (e.g., red) appears exclusively in the left visual field (LVF), while a specific shape (e.g., square) appears exclusively in the right visual field (RVF). Eye-tracking ensures no saccades occur. M is instructed nonverbally via demonstration: "Match the color to the shape." To succeed, M must simultaneously use both hands to grasp a specific object—a red square—and place it into a sorting bin within 1.5 seconds. Neither hemisphere receives the complete instruction: the right hemisphere (RH) processes red but not square; the left hemisphere (LH) processes square but not red. Subcortical pathways remain intact, permitting basic motor synchronization, but cortical exchange is severed. The response requires a single, fluid bimanual sweep; sequential hand movements trigger a failure tone. Crucially, no verbal report is permitted during the task. Afterward, when asked verbally what stimuli appeared, M says, "I saw a square," consistently denying the color. The task repeats across varied combinations, requiring novel integrations each time. M achieves 95% success rates on the bimanual sorting despite the lateralized information split. The tight deadline and simultaneous movement requirement prevent serial observation of one hand by the other, ruling out cross-cueing strategies where one hemisphere infers the other's information from delayed motor feedback. This protocol isolates motor coordination from verbal reporting capabilities.

  ***

  **Rival Readings and Predictions**
  The **Integrationist** reads M as a single subject with impaired access between cortical modules. They predict smooth performance because one conscious mind integrates color and shape pre-motorically. They explain the verbal denial as an output failure: the LH speech center lacks access to RH visual data, though the subject phenomenally saw red. The **Fragmentationist** reads M as hosting two distinct streams of consciousness. They predict smooth performance via intact subcortical motor pathways coordinating hands without conscious unity. They explain the verbal denial as truthful: the LH stream literally did not experience red.

  **The Philosophical Feature**
  The work is done by the **tight deadline preventing cross-cueing**. This forces simultaneous integration. If removed (e.g., unlimited time), the LH could watch the RH hand move, infer the color, and coordinate serially. Success would then be compatible with two minds using serial inference rather than simultaneous unity, collapsing the test's power to isolate experiential unity.

  **Worse Reading and Reply**
  The Fragmentationist reading comes out worse regarding the **unity of agency**. It is difficult to explain how two distinct conscious agents solve a novel, complementary puzzle simultaneously without communication. The strongest reply appeals to **subcortical motor integration**: conscious unity is not required for bimanual coordination. The subcortical systems (e.g., colliculi) can bind visual-motor information and execute synchronized movements independently of cortical conscious streams. Thus, successful performance proves motor unity, not conscious unity.
