      *   **Sam's Stance:** Pro-Platonist/Realist. Shadows are ontologically dependent, not just fake. VR is physical. Science aims at mathematical structures (Forms). Recollection/Dialectic allows access. Participation implies a causal link to the Good, not just correlation. Normative criteria (coherence, universality) distinguish Forms from shadows.
