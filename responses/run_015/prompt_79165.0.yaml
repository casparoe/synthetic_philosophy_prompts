answer: |-
  You are right to be unsatisfied with "that's just interpretation." That answer collapses a dynamic, multi-stage process into a static snapshot. What you are describing is a lifecycle of meaning, and it has distinct phases with distinct legal and philosophical weights.

  Here is the carving you asked for.

  ### 1. The First Move: Reading the Text Against Itself
  **The Legal Name:** **The Absurdity Doctrine** (or the **Golden Rule**).
  **The Linguistic Name:** **Pragmatic Enrichment** (specifically **Generalized Conversational Implicature**).

  When you read "no vehicles" as "no motor vehicles" to avoid banning ambulances, you are invoking the **Absurdity Doctrine**. In statutory and contract interpretation, this is the principle that a literal reading should be discarded if it leads to a result that is irrational, unworkable, or plainly contrary to the evident purpose of the rule. It is not "interpretation" in the sense of decoding; it is *correction* in the sense of triage.

  However, since you deal with policies more than statutes, the linguistic concept is often more precise. This is **Pragmatic Enrichment**. In linguistics (following Grice), the semantic content ("vehicle" = anything on wheels) is overridden by the pragmatic context (we are on a boardwalk; we care about noise and safety). The listener supplies the unstated premise ("motorized") to make the speaker's utterance rational. This is governed by the **Principle of Charity**: we assume the rule-maker is rational, so if the literal text makes them look irrational, we adjust the text to save their rationality.

  **Why "Interpretation" is insufficient:** Interpretation implies discovering what is *there*. The Absurdity Doctrine admits that what is *there* is broken and must be bypassed. It is a safety valve, not a lens.

  ### 2. The Second Move: The Repair Becoming the Rule
  **The Legal Name:** **Course of Performance** (or **Practical Construction**).
  **The Sociological Name:** **Reification**.
  **The Name I Give You:** **Interpretive Crystallization**.

  This is the move that interests you most. The correction stops being a "workaround" and becomes the "truth."

  In contract law (UCC § 2-208), this is **Course of Performance**. If parties repeatedly act in a way that contradicts the written text but is accepted by both sides, that conduct defines the agreement more accurately than the text. In organizational policy, this is often called **Practical Construction**. The "rule" is not the document; the rule is the operational reality.

  However, these terms describe the *evidence* of the change, not the *ontological shift* you are observing. You are describing a process where a temporary fix hardens into permanent infrastructure. The sociological term is **Reification**: an abstract idea or a temporary fix becomes treated as a concrete, natural thing.

  I propose calling this **Interpretive Crystallization**.
  *   **Liquid Phase:** The text is ambiguous; the absurdity doctrine is applied ad hoc.
  *   **Cooling Phase:** The correction is repeated consistently (Course of Performance).
  *   **Crystallization:** The correction is forgotten as a correction. It is now the "obvious" meaning. The original text is treated as a fossil that merely *suggests* the current rule, rather than *containing* it.

  **Distinction from Rectification:** You asked if this is like correcting a contract to match what was agreed (**Rectification**). It is distinct. Rectification looks *backward* to fix a mistake at the moment of signing (proving the text didn't match the original meeting of the minds). **Interpretive Crystallization** looks *forward*. It acknowledges that the original text might have been clear, but the *agreement has evolved* through practice. The "new meaning" wasn't the original intent; it is the *current* intent, forged by usage.

  ### 3. The Core Question: When Does the Repair Become the Meaning?
  You asked: *At what point does a hardened repair stop being a repair and become the real meaning?*

  The edge is **Reliance**.

  As long as the correction is just a "wink and a nod" among senior staff, it is a repair. It becomes the "real meaning" when a third party (a new hire, an auditor, a vendor) **relies** on the corrected version to their detriment, and the organization would be estopped from enforcing the literal text.

  In legal theory, this is where **Estoppel** meets **Custom and Usage**.
  *   **Before the Edge:** A compliance officer can say, "The text says X, but we do Y."
  *   **After the Edge:** A compliance officer must say, "The rule is Y. The text is outdated."

  **Does this bridge the Textualist vs. Purposivist gap?**
  Yes, but only retrospectively.
  *   **At T=0 (Drafting):** Textualists and Purposivists are pointing at different objects. One points to the ink, one to the intent.
  *   **At T=10 (Crystallization):** They are pointing at the *same* object, but for different reasons.
      *   The **Purposivist** says: "The meaning is Y because that is the purpose."
      *   The **Textualist** (if honest) must say: "The meaning is Y because the text has been effectively amended by the Course of Performance, which is a recognized canon of construction."

  The "words" have not absorbed the "purpose." Rather, the "practice" has overwritten the "words."

  ### Summary for Your Work
  You are fighting a battle against **Interpretive Crystallization** without having the vocabulary to name the enemy.

  1.  **When arguing the First Move:** Do not call it "interpretation." Call it **avoiding an absurd result** or **applying the Principle of Charity**. Frame it as saving the rule from self-negation.
  2.  **When arguing the Second Move:** Do not call it "precedent." Call it **Course of Performance** or **Established Custom**. Argue that the *operational rule* has diverged from the *documentary rule*.
  3.  **When proposing the Rewrite:** Your frustration with the text getting "longer and less like what anyone meant" is the symptom of **Drafting to the Fossil**. You are amending the text to match the *crystallized interpretation* rather than simplifying the text to match the *current intent*.
      *   *Bad Fix:* "No vehicles (meaning motor vehicles, not bicycles, but actually also not maintenance carts)..."
      *   *Good Fix:* Delete the old sentence. Write the current operational rule as if it were new. **Break the Crystallization.**

  **The Name:** If you need a label for your colleagues to stop them from dismissing this as "just interpretation," call it **Normative Drift via Practical Construction**. It signals that the norm has moved, the text has not, and the gap is now a liability.

  **The Edge:** The repair becomes the meaning when the cost of reverting to the text exceeds the cost of updating the text. That is the moment of Crystallization. Before that, it's a workaround. After that, it's a bug in the documentation.
