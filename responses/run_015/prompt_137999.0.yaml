answer: |-
  ### Brainstorming on Supererogation and Eulogy Structure

  Supererogation refers to actions that are morally good but not obligatory—doing more than duty requires. Traditional moral frameworks often rely on this category to preserve a space for personal life; without it, morality risks becoming impossibly demanding. However, strict utilitarians and some Kantians deny the category exists. They argue that if you can prevent suffering without sacrificing something of comparable moral weight, you are obligated to do so. Mira belonged to this camp. She believed donating a kidney or half her income wasn't "extra"; it was simply what was owed. This creates a eulogistic paradox: if I praise her for doing her duty, I imply others are failing theirs. If I call her actions "extraordinary," I violate her own moral understanding and isolate her from the community she served.

  The demandingness objection suggests that a morality requiring such sacrifice is unsustainable for most humans. If I validate Mira's view without qualification, I risk inducing guilt in the family and neighbors who lived ordinary lives, or worse, encouraging her burnt-out colleagues to ignore their own limits. Praise can function as a burden; calling someone "saintly" often excuses the rest of us from following their example ("Oh, she was a saint, I'm just human"). Conversely, for the agent, being praised for duty can feel like an insult—it suggests their baseline is abnormal. To praise Mira honestly, I must praise her *clarity* and *consistency*, not the magnitude of the sacrifice. The focus must shift from the *act* (which implies a standard for others) to the *attention* (which was uniquely hers).

  Finally, there is the problem of praising someone for doing what they thought was required. We don't praise people for not stealing; we expect it. But Mira's "requirement" was internal and rigorous. The praise should honor her integrity to her own convictions, not the external metric of the deed. The speech must navigate a narrow path: acknowledging the height of her commitment without presenting it as a ladder others must climb. It should frame her life not as a measuring stick, but as a testament to what human care looks like when fear is removed. This honors her without weaponizing her memory against the living.

  ***

  ### Eulogy for Mira

  Good afternoon. Thank you for being here.

  Standing here, looking out at this room, I am aware of the weight of what we are doing. We are trying to fit a life into words. But specifically, we are trying to fit Mira's life into words, and Mira was very specific about how her life should be described. She was a palliative-care nurse for twenty years. In 2019, she donated a kidney to a stranger. For a decade, she gave away roughly half her income. She spent the last eight months of her sabbatical caring for a friend who was dying.

  If I list those things plainly, I know what some of you are feeling. If you are her family, her neighbors, or her friends from the ward, you might feel a pang of inadequacy. You might think, "I have two kidneys. I keep my income. I loved her, but I didn't live like that." And if you are her friends from the effective altruist community, you might feel a different pressure. You might feel that her life sets a standard you must meet to be good people. Some of you are already working yourselves to exhaustion trying to match her output.

  Mira would have been furious at both of those reactions.

  She rejected the idea that there is a category of "good deeds" that are optional extras. She didn't believe she was being generous. She believed she was responding to need that was right in front of her. She once told me that nobody gets extra credit for doing what was obviously owed. She didn't see herself as going above and beyond. She saw herself as paying attention when others looked away.

  So, I am not going to call her a hero. I am not going to call her a saint. She would have hated those words, and they aren't true. Those words create a distance between her and us. They suggest she was made of different material. She wasn't. She was made of the same stuff as the rest of us. She felt pain, she got tired, she loved her daughter Nora more than anything in this world.

  The difference was not in her capacity for sacrifice, but in her clarity. She saw a need, and she did not hesitate. That is what I want us to remember. Not the magnitude of the act, but the lack of hesitation.

  To her mother, and to her brothers: You do not need to measure yourselves against her. Love does not have a quota. Mira did not love you less because she was caring for strangers; she loved the world because she knew how to love you. You were her anchor. When she came home from the ward, when she came back from the hospital after the surgery, it was this family that grounded her. Her life was not a judgment on yours. It was just her life.

  To her colleagues and her friends in philosophy: Please hear this carefully. Mira did not want followers. She did not want you to burn out trying to replicate her choices. She knew that care requires sustainability. If you destroy yourself trying to save others, you cannot care for anyone tomorrow. She would not want her memory to function as a dare. She would want you to live long, effective lives. That means resting. That means keeping your own kidneys. That means knowing that you are valuable even when you are not producing utility.

  Nora asked me to say two things. She said: don't make my mum sound like she was showing off, and don't make everyone else sound like they failed.

  I hope I am honoring that. Mira wasn't showing off. She was quiet about it. She didn't talk about the money or the surgery unless it was to explain why she was tired. And you have not failed. Morality is not a competition where there is one winner and the rest of us lose.

  There is a concept in ethics about actions that are good but not required. Mira disagreed with that. She thought everything good was required. But here is the thing: she never used that belief to make others feel small. She never shamed anyone for keeping their second kidney. She never shamed anyone for buying their daughter a birthday present instead of donating the money. She just did what she thought was right, and she made space for the rest of us to be human.

  That is the gift we have left. Not a list of duties we haven't finished. But a memory of what it looks like when someone refuses to look away from suffering. We don't have to replicate the exact choices to honor that. We honor it by paying attention to the need that is directly in front of us, whatever that is. For some of you, that need is a stranger. For many of you, that need is yourselves. For all of us, right now, that need is Nora, and her grandmother, and her brothers.

  Mira is not watching over us. She is not at peace in some other place. She is here, in the fact that we are gathered. She is here in the work her colleagues will do tomorrow when they hold a patient's hand. She is here in the money her friends will donate, and in the money they will keep to buy themselves dinner. She is here in Nora, who is fifteen, and who is going to grow up knowing her mother loved the world fiercely.

  We do not need to be Mira. We just need to be here, for each other, without looking away.

  Thank you.
