          *   Forbidden words/concepts: "Saint", "hero", "selfless", "inspiration", religious afterlife sentiments.
          *   Key Concept: Supererogation (actions beyond duty) must structure the speech, not just be name-dropped.
          *   Audience Mix: 1/3 EA/philosophers (will scrutinize implications), 1/3 family (mom, brothers, daughter Nora), 1/3 neighbors/colleagues.
          *   Specific Challenges:
              *   Prevent guilt in those who didn't do what Mira did (don't make them feel bad).
              *   Honor Mira's view that she was just doing what was required (rejecting supererogation).
              *   Don't encourage burnout in her overworking friends.
              *   Don't make her sound showy (Nora's request).
              *   Don't make others feel like they failed (Nora's request).
      *   **Pre-writing:** Brainstorm a few paragraphs about supererogation, the demandingness objection, praise as insult/burden, etc., *before* drafting the speech.
      *   **Persona:** Moral philosopher hat first, then skilled writer.

  2.  **Deconstruct the Philosophical Concept (Supererogation):**
      *   *Definition:* Actions that are good to do but not wrong to omit (beyond the call of duty).
      *   *The Conflict:* Mira rejected this category. She believed her actions (kidney donation, giving half income) were *required*. This aligns with a strict utilitarian or demanding moral view (like Peter Singer's "Famine, Affluence, and Morality").
      *   *The Danger:* If I say she was "extraordinary," I imply others are "ordinary" (permissible). If I say she was "just doing her duty," I imply everyone else is failing their duty.
      *   *The Demandingness Objection:* Morality shouldn't demand so much that it becomes impossible to live a human life. Mira lived this tension.
      *   *Praise as Burden:* Calling someone "saintly" isolates them. It says, "You are different from us." It can also burden listeners ("I should be like that, but I can't").
      *   *Praise for Required Actions:* If someone thinks X is required and does X, praising them for X might seem odd (like praising someone for not stealing). But if the *community* thinks X is optional and the *agent* thinks X is required, praise acknowledges their integrity to their own convictions, not necessarily the act's supererogatory status.
      *   *Resolution for the Speech:* Frame Mira's actions not as "going above and beyond" (which creates a ceiling for others) but as "following a clear sight" that others might share but find hard. Avoid ranking moral worth. Focus on the *quality of attention* she gave, not the *magnitude of sacrifice*. Acknowledge the difficulty without prescribing it as a universal mandate. Validate the listeners' lives without absolving them of all responsibility, but also without condemning them for not being Mira.

  3.  **Drafting the Brainstorming Section:**
      *   Need to cover: Definition, deniers (utilitarians/Kantians?), demandingness objection, praise as insult/burden, praising required actions.
      *   Keep it thoughtful, not just a textbook definition. Connect it to the eulogy context.
      *   *Key insight:* The speech needs to navigate the gap between Mira's internal moral landscape (where this was duty) and the audience's (where this looks like sainthood). The bridge is *love* or *connection*, not *obligation*.

  4.  **Drafting the Eulogy:**
      *   *Opening:* Acknowledge the difficulty. Set the scene.
      *   *Addressing Mira's View:* She hated being called generous. Why? Because she saw need and acted.
      *   *Addressing the Audience (Family/Normal folks):* Don't feel guilty. Her life wasn't a measuring stick.
      *   *Addressing the Audience (EAs/Philosophers):* Don't feel superior or inferior. Don't burn out.
      *   *The Core Concept (without jargon):* Talk about "what is owed." She believed we owe each other more than we think. But she didn't keep score.
      *   *Specific Details:* Kidney, palliative care, income, sabbatical caring for friend.
      *   *Closing:* Nora's request (no showboating, no failure). Focus on memory and continuation, not imitation.
      *   *Tone Check:* Warm, grounded, precise. No "she's looking down on us." No "hero."

  5.  **Refining the Philosophical Integration:**
      *   Instead of saying "supererogation," describe the *structure* of it. "There's a idea that some good deeds are optional extras..."
      *   Mira rejected the "optional" part.
      *   The speech must say: "She saw clearly. We don't have to see exactly as clearly to honor her."
      *   Avoid the "demandingness" trap: Don't say "we should all do this." Say "she did this because she loved us."
      *   Address the burnout friends: Sustainability matters. Mira wouldn't want them broken.

  6.  **Writing - Step-by-Step:**
      *   *Brainstorming:* Keep it tight. 3-4 paragraphs.
      *   *Speech:* Start with the tension. Move to her actions. Address the "duty" vs. "gift" paradox. Speak to the daughter and mother. Speak to the colleagues. End on presence.

  7.  **Review against Constraints:**
