      *   *Critical Check:* If the meta-chain justifies the *rule*, does that justify the *application* of the rule? (The problem of bridging). If I have infinite reasons to trust vision, do I have infinite reasons to trust *this* visual experience? Meta-infinitism says "No, just finite reasons for this one, infinite for the rule." Is that enough? Yes, if the rule is sound.

