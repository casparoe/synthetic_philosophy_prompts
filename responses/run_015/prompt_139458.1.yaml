      *   **Point 2 (Finitude):** It inherits Klein's solution (availability). It doesn't solve the psychological burden better, but it might make the *content* of the reasons easier to generate (philosophical arguments vs. empirical details).
      *   **Point 3 (Arbitrariness):** This is the strongest point for the view. It avoids "brute" foundationalism. The stop isn't arbitrary because it's *defeasible* and *defended*. But watch out for the "Meta-Arbitrariness" (why engage in meta-vindication?).
