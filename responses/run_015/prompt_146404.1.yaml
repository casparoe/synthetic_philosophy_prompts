prompt: |-
  I am a graduate TA for an undergraduate decision-theory course, and I have been asked to run next week's discussion section on ambiguity using a chapter from a popular book on irrationality that the lecturer is fond of. Before I stand up in front of the students I want to know which sentences of it I would be embarrassed to repeat. The chapter's core passage reads as follows: The Ellsberg setup is simple. An urn holds 90 balls: 30 are red, and the remaining 60 are black and yellow in a proportion you are not told. Offer people a straight choice between a bet that pays $100 on red and one that pays $100 on black, and they take the red. Then offer them a choice between a bet that pays $100 on red-or-yellow and one that pays $100 on black-or-yellow, and they take black-or-yellow. Now notice that no assignment of probabilities to the possible compositions fits both of those choices: the first requires you to treat black as unlikely, the second requires you to treat it as likely. So people are not maximizing expected utility. The reason is that they are ambiguity averse: they dislike acting on probabilities they do not know, and they behave as if the composition of the urn were the worst case consistent with what they have been told. That is irrational in a strict sense, and not merely a quirk of taste — it makes your preferences turn on how the options are carved up rather than on anything about the world, and a bookie who knows the composition can charge you a small fee to shuffle your bets and leave you poorer whatever happens. Nor is any of this risk aversion: the prize is the same in every bet, so someone's distaste for variability applies equally to both bets in each pair and cannot produce the reversal. And the moral travels well beyond urns — whenever one option's probabilities are known and another's are not, the known one is the rational choice, and no adjustment in the size of the known risk changes that.

  I have worked through enough of the algebra not to need it re-derived: if K is the number of black balls, preferring red to black forces the expected value of K below 30, while preferring black-or-yellow to red-or-yellow forces it above 30, so no single prior over K is consistent with both. What I cannot tell is how much of the surrounding commentary a decision theorist would stand behind. Three things make me suspicious. First, the sentence about behaving as if the composition were the worst case: I had the impression that there is a whole family of formal models of ambiguity-sensitive choice and that the maximally pessimistic one is merely the best-known member of it, so that this gloss overstates what the data support. Second, the money-pump claim: I have also half-heard the opposite argument, namely that it is the person who ignores ambiguity who is exposed, because a counterparty who knows the composition can always offer them bets priced on information they lack — so I do not know which way that consideration actually cuts, or whether a genuine sure-loss argument against ambiguity aversion exists at all as opposed to an argument that it violates a particular axiom. Third, the closing sentence appears to sit badly with the earlier one: if ambiguity aversion is irrational in a strict sense, the author cannot also recommend it, and anyway the claim that the magnitude of the known risk never matters looks like it must be false in any model that lets stakes matter. A related worry: our lecturer's slides use the two-urn version instead, with a known 50/50 urn beside an unknown one, and the striking result there is that the same people prefer the known urn when betting on red and also when betting on black. My guess is that this version demonstrates something slightly different from the one-urn version — a failure of additivity rather than a failure of the sure-thing principle — but I am not confident, and I do not know whether the book's worst-case gloss explains that pattern better or worse than it explains the one-urn pattern. Finally, my study group tried a variant on each other: we replaced the ambiguous urn with a two-stage device, drawing one ticket from a bag of 61 tickets numbered 0 to 60 to fix K, with everything about the bag公开 known, so that the process generating the composition carries no ambiguity and the only remaining ignorance is about which ticket came up. Two people in the group said the book's author would predict exactly the same preferences here, on the grounds that what people react to is not knowing the actual proportion. I suspect that depends on whether the leading models collapse the two-stage gamble into a single-stage one or treat the stages separately, but I cannot tell which models do which, nor whether the matter is settled theoretically or is really an empirical question about whether people reduce compound gambles.

  So please audit the passage claim by claim: mark what a decision theorist would accept as written, what is a simplification that would pass in a popular book but would not survive a seminar, and what is straightforwardly wrong or backwards. Tell me explicitly whether the closing lesson survives after the errors are corrected, or whether the defensible version of it is narrower than the author suggests, and whether the author's own claims are in tension with one another. Then take my three side-questions — the relation between the one-urn and two-urn presentations, the status of the money-pump or sure-loss argument, and what should be expected in the ticket-bag variant — and for each separate what is implied by the theory from what remains an open empirical question. Where a claim is genuinely contested rather than settled, say so plainly: for the purposes of a discussion section I would much rather be able to tell students that experts disagree about a point than assert something false with confidence.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate TA for an undergraduate decision theory course.
      *   **Task:** Audit a specific passage from a popular book on irrationality regarding the Ellsberg Paradox and ambiguity aversion.
      *   **Goal:** Identify sentences/claims that are accurate, simplified, or wrong/contested from a decision theorist's perspective. Address specific side questions (one-urn vs. two-urn, money pump/sure-loss, two-stage/ticket-bag variant).
      *   **Tone:** Professional, academic, nuanced, helpful for teaching. Needs to distinguish between "popular science gloss" and "technical reality."
      *   **Key Constraints:** Do not re-derive the algebra (user knows it). Focus on the commentary surrounding the math. Be explicit about tensions, errors, and open questions.

  2.  **Deconstruct the Passage (Claim-by-Claim Audit):**

      *   *Claim 1: "The Ellsberg setup is simple... [description of urn and bets]... they take the red... they take black-or-yellow."*
          *   **Status:** Accurate description of the empirical phenomenon.
          *   **Nuance:** Standard Ellsberg 3-color urn.

      *   *Claim 2: "Now notice that no assignment of probabilities to the possible compositions fits both of those choices..."*
          *   **Status:** Accurate (within Subjective Expected Utility - SEU).
          *   **Nuance:** This is the core violation of Savage's Sure Thing Principle (or Additivity of probability).

      *   *Claim 3: "So people are not maximizing expected utility."*
          *   **Status:** Accurate *if* we assume SEU is the only definition of rationality.
          *   **Nuance:** Technically, they are violating SEU axioms. Whether this means "not maximizing expected utility" depends on whether you allow non-additive probabilities (e.g., Choquet Expected Utility). But in the context of standard SEU, this is correct.

      *   *Claim 4: "The reason is that they are ambiguity averse: they dislike acting on probabilities they do not know..."*
          *   **Status:** Accurate definition of ambiguity aversion.
          *   **Nuance:** "Dislike acting on probabilities they do not know" is a bit colloquial. Better: "Dislike betting on events with unknown probability compared to known probability."

      *   *Claim 5: "...and they behave as if the composition of the urn were the worst case consistent with what they have been told."*
          *   **Status:** **Simplification/Overstatement.**
          *   **Critique:** This describes *Maxmin Expected Utility* (MEU/Gilboa-Schmeidler). It is *one* model, not *the* explanation. Smooth Ambiguity (Klibanoff et al.) or Alpha-Maxmin allow for less than worst-case. The data supports ambiguity aversion, not necessarily *maximal* pessimism.

      *   *Claim 6: "That is irrational in a strict sense, and not merely a quirk of taste..."*
          *   **Status:** **Contested/Philosophical.**
          *   **Critique:** In SEU framework, yes, it's irrational (axiom violation). In broader decision theory, it's a preference shape. Calling it "irrational in a strict sense" is a normative claim, not a positive one. Many theorists argue ambiguity aversion is a reasonable heuristic or distinct preference dimension.

      *   *Claim 7: "...it makes your preferences turn on how the options are carved up rather than on anything about the world..."*
          *   **Status:** **Accurate (regarding framing/description invariance).**
          *   **Nuance:** This refers to the violation of description invariance or extensionality.

      *   *Claim 8: "...and a bookie who knows the composition can charge you a small fee to shuffle your bets and leave you poorer whatever happens."*
          *   **Status:** **Contested/Technically Nuanced.**
          *   **Critique:** This is the "Money Pump" argument. It holds if preferences are dynamic and the agent doesn't anticipate the shuffle. If the agent has stable ambiguity averse preferences (e.g., MEU), they might reject the shuffle if the shuffle introduces new ambiguity or if they value the *source* of uncertainty. Standard Dutch Book arguments apply to incoherent probabilities, but ambiguity aversion isn't necessarily probabilistic incoherence (it's non-additivity). This needs careful handling.

      *   *Claim 9: "Nor is any of this risk aversion: the prize is the same in every bet, so someone's distaste for variability applies equally to both bets in each pair and cannot produce the reversal."*
          *   **Status:** **Accurate.**
          *   **Nuance:** Crucial distinction. Risk = known probabilities. Ambiguity = unknown probabilities. Concave utility (risk aversion) cancels out in the pairwise comparison *under SEU*.

      *   *Claim 10: "And the moral travels well beyond urns — whenever one option's probabilities are known and another's are not, the known one is the rational choice..."*
          *   **Status:** **Normative Overreach/Debatable.**
          *   **Critique:** This is the "Principle of Insufficient Reason" or a strong normative claim for SEU. Many decision theorists disagree that the "known" option is *always* rational. It depends on the context (e.g., strategic vs. natural uncertainty).

      *   *Claim 11: "...and no adjustment in the size of the known risk changes that."*
          *   **Status:** **False/Overstatement.**
          *   **Critique:** If the known risk is 1% win vs ambiguous 50% win, people switch. Even normatively, if the known risk is terrible, it's not "rational" to take it just because it's known. This contradicts standard utility theory too (stakes matter).

  3.  **Address Side Questions:**

      *   *Q1: One-Urn vs. Two-Urn (50/50 known vs. Unknown).*
          *   **Theory:** Both demonstrate ambiguity aversion. Two-urn is often cleaner because it removes the "complementarity" constraint of the 3-color urn (Red + Black + Yellow = 90).
          *   **Additivity vs. Sure Thing:** Both violate Sure Thing Principle. Two-urn highlights the preference for *source* clarity.
          *   **Worst-Case Gloss:** Worst-case explains Two-Urn well (Unknown could be 0% Red). But again, it's just one model.

      *   *Q2: Money Pump / Sure-Loss Argument.*
          *   **Theory:** Classic Dutch Book applies to probabilistic incoherence (P(A) + P(not A) != 1). Ambiguity aversion violates *independence* or *sure thing*, not necessarily coherence in a static sense.
          *   **Dynamic Consistency:** If preferences change after the shuffle, you get pumped. If you anticipate the shuffle, you might not.
          *   **Counterparty:** The TA's worry is valid. If the counterparty knows the composition, they can exploit SEU maximizers too if the SEU maximizer has the wrong prior. But the specific "money pump" usually targets the *intransitivity* or *dynamic inconsistency* caused by the ambiguity preference updating.
          *   **Verdict:** It's a normative argument, not a descriptive fact. It relies on accepting SEU as the *only* rational standard.

      *   *Q3: Ticket-Bag Variant (Two-Stage / Compound Gamble).*
          *   **Theory:** Reduction of Compound Lotteries Axiom (ROCL). SEU assumes people reduce them.
          *   **Ambiguity Models:** Some treat the second stage as ambiguity (Source Theory).
          *   **Empirical:** People often *do not* reduce compound lotteries when ambiguity is involved. They treat the "unknown K" differently from "known K distribution."
          *   **Verdict:** This is an **open empirical question** and theoretically contested. SEU says preferences should be identical. Ambiguity models (like Smooth Ambiguity) might distinguish them depending on how the second-order belief is treated.

  4.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the TA's position and the quality of their skepticism.
      *   **Part 1: Passage Audit:** Break down sentence by sentence (or logical block by block). Use labels: *Accepted*, *Simplification*, *Contested/Wrong*.
      *   **Part 2: The Tension:** Address the contradiction between "irrational" and "recommendation."
      *   **Part 3: Side Questions:**
          *   One-Urn vs. Two-Urn.
          *   Money Pump/Dutch Book.
          *   Ticket-Bag/Compound Lottery.
      *   **Part 4: Teaching Advice:** How to frame this for undergrads without lying but without getting bogged down.

  5.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction on Money Pump:* I need to be careful. A standard Dutch Book proves incoherent probabilities lead to sure loss. Ambiguity aversion implies non-additive probabilities. Does non-additivity lead to a sure loss? Not necessarily in a static setting. It leads to sure loss in a *dynamic* setting if you update naively. I should clarify that distinction.
      *   *Correction on "Worst Case":* Make sure to mention Gilboa-Schmeidler (1989) specifically as the source of the "worst case" idea, distinguishing it from the general phenomenon.
      *   *Correction on "Rationality":* Distinguish between *internal consistency* (axioms) and *external success* (making money). The book conflates these.
      *   *Ticket Bag:* This is essentially the distinction between "Risk" (known distribution of K) and "Ambiguity" (unknown K). If the bag of tickets is known, it's technically Risk (Second-order probability). If people still treat it as Ambiguity, they are violating Reduction of Compound Lotteries. This is a key teaching point.

  6.  **Final Review against User Constraints:**
      *   Did I audit claim by claim? Yes.
      *   Did I mark accept/simplify/wrong? Yes.
      *   Did I address the closing lesson tension? Yes.
      *   Did I answer the three side questions separating theory vs. empirical? Yes.
      *   Did I acknowledge where experts disagree? Yes.

  7.  **Drafting the Response:** (Proceed to generate output based on these thoughts.)
answer: |-
  This is an excellent set of notes. Your skepticism is well-founded; the passage you've been assigned mixes robust empirical descriptions with contentious normative claims and conflates specific models with general theory. As a TA, your goal is to help students distinguish between *what people do* (descriptive), *what standard theory says they should do* (normative SEU), and *whether that standard is the only rational one* (philosophical/extended theory).

  Here is an audit of the passage, followed by answers to your three side questions.

  ### Part 1: Passage Audit

  I have broken the text into logical claims. I use the following labels:
  *   **[Accepted]:** Standard decision theory consensus.
  *   **[Simplification]:** Technically imprecise but passable for intro level; requires nuance in a seminar.
  *   **[Contested/Wrong]:** Normatively debatable or factually incorrect.

  **1. "The Ellsberg setup is simple... [description of urn and bets]... they take the red... they take black-or-yellow."**
  *   **[Accepted]:** This accurately describes the empirical regularity known as the Ellsberg Paradox.

  **2. "Now notice that no assignment of probabilities to the possible compositions fits both of those choices..."**
  *   **[Accepted]:** Within the framework of Subjective Expected Utility (SEU), this is correct. It demonstrates that no single additive probability measure over {Red, Black, Yellow} can satisfy the Independence Axiom (or Sure Thing Principle) given these preferences.

  **3. "So people are not maximizing expected utility."**
  *   **[Simplification]:** Strictly speaking, they are not maximizing *Subjective* Expected Utility as defined by Savage (1954). However, they *could* be maximizing Expected Utility under non-additive probabilities (e.g., Choquet Expected Utility). For an undergrad class, "violating SEU" is the intended takeaway, but a theorist would note that we can model this behavior as utility maximization if we relax the additivity axiom.

  **4. "The reason is that they are ambiguity averse: they dislike acting on probabilities they do not know..."**
  *   **[Accepted]:** This is the standard definition of ambiguity aversion (preference for known probabilities over unknown probabilities).

  **5. "...and they behave as if the composition of the urn were the worst case consistent with what they have been told."**
  *   **[Simplification/Overstatement]:** This describes **Maxmin Expected Utility (MEU)** (Gilboa & Schmeidler, 1989). While MEU is the most famous model of ambiguity aversion, it is not the *only* one. Models like **Smooth Ambiguity** (Klibanoff, Marinacci, Mukerji, 2005) or **$\alpha$-Maxmin** allow for ambiguity aversion without assuming the decision maker focuses *exclusively* on the worst-case scenario. The data supports ambiguity aversion; it does not universally support *maximal* pessimism.

  **6. "That is irrational in a strict sense, and not merely a quirk of taste..."**
  *   **[Contested]:** This is a normative claim, not a positive one.
      *   *Internal Consistency:* If you accept Savage's axioms as the definition of rationality, then yes, it is irrational.
      *   *Ecological Rationality:* Many theorists argue that in real-world environments, ambiguity aversion is a robust heuristic that protects against adversarial information structures. Calling it "irrational in a strict sense" assumes SEU is the sole arbiter of rationality, which is a philosophical stance, not a mathematical proof.

  **7. "...it makes your preferences turn on how the options are carved up rather than on anything about the world..."**
  *   **[Accepted]:** This refers to a violation of **Extensionality** or **Description Invariance**. The physical outcomes are the same, but the description (known vs. unknown probability) changes the choice.

  **8. "...and a bookie who knows the composition can charge you a small fee to shuffle your bets and leave you poorer whatever happens."**
  *   **[Contested/Technically Nuanced]:** This is the **Money Pump** argument.
      *   *Theoretically:* A money pump requires **dynamic inconsistency**. If an agent is ambiguity averse but *dynamically consistent* (they anticipate their future preferences), they may refuse the shuffle. The pump works only if the agent fails to anticipate that the "shuffle" returns them to a state they previously rejected.
      *   *Counter-argument:* As you suspected, if the bookie knows the composition and the agent does not, the bookie can exploit *any* agent whose subjective prior differs from the true composition, not just ambiguity-averse ones. The specific vulnerability of the ambiguity-averse agent is that they value the *source* of uncertainty, not just the distribution. Whether this constitutes a "sure loss" depends on whether you value the information state itself.

  **9. "Nor is any of this risk aversion: the prize is the same in every bet, so someone's distaste for variability applies equally to both bets in each pair and cannot produce the reversal."**
  *   **[Accepted]:** This is a crucial and correct distinction. Under SEU, risk aversion (concave utility) cancels out in pairwise comparisons where the monetary stakes are identical. The reversal is driven by the probability weighting, not the utility function.

  **10. "And the moral travels well beyond urns — whenever one option's probabilities are known and another's are not, the known one is the rational choice..."**
  *   **[Contested/Wrong]:** This is a strong normative overreach.
      *   *Normatively:* There is no consensus that "known risk" is always superior to "unknown risk." In strategic settings (game theory), ambiguity often signals the presence of an informed opponent, making ambiguity aversion rational.
      *   *Descriptively:* People do not always choose the known option if the known probability is sufficiently low (e.g., 1% known vs. ambiguous 50%).

  **11. "...and no adjustment in the size of the known risk changes that."**
  *   **[Wrong]:** This is factually incorrect both descriptively and normatively.
      *   *Descriptively:* If the known bet pays $100 on Red (30/90) and the ambiguous bet pays $100 on Black (0-60/90), people prefer Red. If the known bet pays $100 on a 1% chance and the ambiguous bet is 50/50, people switch. Stakes and probabilities matter.
      *   *Normatively:* Even a strict SEU maximizer would switch if the known probability is low enough. This sentence contradicts the expected utility framework the author is using to criticize the students.

  ---

  ### Part 2: Tension in the Closing Lesson

  You correctly identified a tension. The author claims ambiguity aversion is "irrational in a strict sense" (Claim 6) but then implies a normative rule that one *should* choose the known option (Claim 10).

  *   **The Tension:** If ambiguity aversion is merely a "quirk of taste" (like preferring chocolate to vanilla), it cannot be irrational. If it is "irrational" (like believing $2+2=5$), then one ought not to do it. The author tries to have it both ways: they treat it as a psychological bias (taste) that leads to exploitation (irrationality), but then prescribe a rule ("choose the known one") that ignores the *degree* of risk (Claim 11).
  *   **The Defensible Version:** The defensible version is narrower: "Ambiguity aversion violates the Sure Thing Principle of Subjective Expected Utility. If you wish to adhere to SEU axioms, you must not exhibit these preferences. However, whether SEU is the correct normative standard for all decisions is an open philosophical question."
  *   **Teaching Advice:** Tell the students: "The author is arguing from the perspective of Savage's SEU. Within that system, ambiguity aversion is an error. Outside that system, it can be modeled as a rational preference for information clarity. The claim that you should *always* pick the known risk regardless of magnitude is false in almost any model."

  ---

  ### Part 3: Addressing Your Side Questions

  Here is how to separate theoretical implications from empirical open questions for your discussion section.

  #### 1. One-Urn vs. Two-Urn Presentations
  *   **The Setup:**
      *   *One-Urn (3-color):* 30 Red, 60 Black/Yellow unknown.
      *   *Two-Urn:* Urn A (50 Red/50 Black), Urn B (100 Red/Black unknown).
  *   **Theoretical Implication:** Both setups demonstrate a violation of the **Sure Thing Principle** (Savage) or **Additivity** of probability.
      *   In the One-Urn, the violation is often framed as $P(Red) > P(Black)$ and $P(Black \cup Yellow) > P(Red \cup Yellow)$. Since $Yellow$ is common, this implies $P(Red) > P(Black)$ and $P(Black) > P(Red)$.
      *   In the Two-Urn, the violation is preferring to bet on Urn A (Red) over Urn B (Red), AND Urn A (Black) over Urn B (Black). This violates the principle that if you prefer Source A to Source B for one event, you shouldn't prefer Source B to Source A for the complement event, assuming symmetry.
  *   **Does "Worst-Case" explain both?** Yes, Maxmin Expected Utility explains both. In Two-Urn, the worst case for Urn B is 0% Red (for the first bet) and 0% Black (for the second bet).
  *   **Teaching Point:** The Two-Urn version is often pedagogically superior because it isolates **Source Preference** without the arithmetic constraint of the 3-color urn (where probabilities must sum to 1). It makes it clearer that the aversion is to the *source* of uncertainty, not just the specific event.

  #### 2. The Money Pump / Sure-Loss Argument
  *   **Theoretical Status:** This is **Contested**.
      *   *The Standard Argument:* If your preferences violate the axioms of probability (like additivity), you can be Dutch-Booked.
      *   *The Counter-Argument:* Ambiguity aversion violates *Independence*, not necessarily *Coherence* in a static sense. A dynamic money pump requires the agent to be **dynamically inconsistent** (naive about their future choices). If the agent is sophisticated (anticipates the bookie's shuffle), they may reject the initial bet or the shuffle to avoid the loss.
      *   *Your Intuition:* You are correct that a counterparty with information can exploit SEU maximizers too (if the SEU prior is wrong). The unique vulnerability of the ambiguity-averse agent is that they might pay to avoid information or pay to switch bets in a cycle *because* the information state changes their valuation, not because their probability estimate changed.
  *   **Teaching Point:** Tell students: "The money pump argument assumes you will accept a series of bets that individually look okay but collectively lose money. This works if you don't look ahead. If you look ahead (dynamic consistency), you might avoid the pump. Whether ambiguity aversion *necessarily* leads to sure loss is a matter of ongoing debate in dynamic choice theory."

  #### 3. The Ticket-Bag Variant (Two-Stage / Compound Gamble)
  *   **The Setup:** Instead of "unknown K", we draw K from a known bag of tickets (0 to 60).
  *   **Theoretical Implication:** This invokes the **Reduction of Compound Lotteries (ROCL)** axiom.
      *   *SEU Prediction:* SEU assumes agents reduce compound lotteries to simple ones. If the bag of tickets is known, the overall probability of drawing Black is calculable (it averages to 30/90). An SEU maximizer should be **indifferent** between the Urn and the Ticket-Bag.
      *   *Ambiguity Model Prediction:* Many ambiguity models (like Source Theory) suggest people treat "Risk" (known distribution of K) differently from "Ambiguity" (unknown K). Even if K is drawn from a known bag, if the agent focuses on the *second stage* (the urn draw) where the probability is conditional on K, they may still feel ambiguity.
  *   **Empirical Status:** **Open Question / Mixed Evidence.**
      *   Some experiments show people *do* reduce the compound lottery and treat the Ticket-Bag as Risk (preferring it less than the pure Risk urn, but more than the pure Ambiguity urn).
      *   Others show people treat the Ticket-Bag exactly like the Ambiguous Urn because the *realization* of K is unknown at the time of betting.
  *   **Teaching Point:** This is the perfect place to tell students "Experts Disagree."
      *   *Say this:* "Standard theory says these two scenarios are identical (Reduction of Compound Lotteries). However, psychological evidence suggests people often treat a 'known distribution of unknown probabilities' differently from a 'known probability.' Whether this is a rational distinction or a cognitive bug is theoretically unresolved."

  ### Summary for Your Discussion Section

  1.  **Validate the Math:** The algebra showing no single prior fits the choices is solid.
  2.  **Qualify the "Irrationality":** Clarify that "irrational" means "violates SEU axioms," not necessarily "makes you poor in all contexts."
  3.  **Correct the "Worst Case":** Note that ambiguity aversion $\neq$ pessimism. It's a preference for clarity.
  4.  **Correct the "Always Choose Known":** Explicitly refute Claim 11. If the known risk is 1% and the ambiguous is roughly 50%, rational agents switch.
  5.  **Highlight the Disagreement:** On the Money Pump and the Ticket-Bag variant, be honest that these are frontiers of research, not settled facts.

  If you frame it this way, you respect the lecturer's text while ensuring the students leave with a technically accurate understanding of the field's current state.
