      *Wait, one nuance on Case 2:* If the patient says the craving makes life worth living, strict tranquilism says they are wrong about welfare. But clinical practice relies on self-report of suffering. I need to decide: Do we treat the *observable* craving or the *reported* suffering?
      *Decision:* For a clinical protocol, we must rely on reported aversiveness. If they don't mind the craving, it's not a welfare negative *to them*. However, the *consequences* (court) cause suffering. I will focus on the court anxiety as the lever.

      *Wait, one nuance on Case 3:* The "Apathy" case. Strict tranquilism says this is the best state. I must admit this is the most dangerous clinical recommendation. I will explicitly state that the protocol recommends *maintaining* this state, which might be ethically untenable for the team.

      *Wait, on "Authenticity":* The user asked about this. Tranquilism doesn't care about authenticity. A chemically induced void is as good as a natural one. I need to state this clearly.

      *Let's build the "Values Handoff":* This is where the NP says "The math says X, but you value Y."

