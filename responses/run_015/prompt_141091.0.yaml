      *   *Verdict:* This is the strongest point. In *Politics* I.10, Aristotle distinguishes *oikonomia* (management of household) from *chrematistike* (wealth-getting). Interest makes money the source *and* end of the transaction. Renting a ruler makes the ruler a tool for a transaction whose end is something else.
      *   *Refinement:* It's not just "same stuff." It's that the *use* of money *is* its transfer. To charge for the transfer *in the same medium* creates a self-referential loop that violates the "measure" function. A measure measures *other* things. If a measure measures itself and grows, it ceases to be a stable measure.

