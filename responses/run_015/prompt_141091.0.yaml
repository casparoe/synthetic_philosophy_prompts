          7.  Alternative Analogies.
          8.  Scholarly Fault Lines.
      *   Tone Check: Keep it sharp. Avoid condescension. Acknowledge the colleague's point has merit (it's a standard objection) but show where it fails textually.

  11. **Refining the "Ruler Rent" Objection:**
      *   Why is renting a ruler okay? Because you return the *same* ruler. You pay for the *service* of having access to the standard.
