      *   *Verdict 1 (Coding):* **PASS.** Failures are reversible/catchable by humans.
      *   *Verdict 2 (Black Box):* **PASS.** Outputs are checkable.
      *   *Verdict 3 (Kill Switch):* **PASS.** If the switch fails, the catastrophe is irreversible; the "catch" (human) is not high-reliability.
      *   *Verdict 4 (Scheming):* **PASS.** Scheming corrupts the "catch" (evals).
      *   *Verdict 5 (Self-Eval):* **PASS.** The checker is correlated with the failure mode.
      *   *Status:* **Strongest Fit.**

  ### 3. Prediction on the New Case
  **Verdict: REJECT.**

  *   **Rule 1 predicts:** REJECT (There is a tail, 1 in 1 billion).
  *   **Rule 2 predicts:** SHIP (Rate is estimable, non-adversarial, ordinary fault).
  *   **Rule 3 predicts:** REJECT (Failure is irreversible + **nothing downstream catches it**).

  Since Rule 3 is the only one that fits her history, she will reject this. The absence of a downstream check is the dealbreaker. To her, a 1-in-a-billion risk with *no net* is structurally identical to the kill-switch problem: you are relying on the absence of a fault rather than the presence of a safety case.

  ### 4. The Cleanest Next Hypothetical
  To definitively distinguish Rule 1 (No Tail) from Rule 3 (No Unchecked Irreversibility)—since both predict Reject on the current case—you need to vary **reversibility** while keeping the **lack of a check** constant.

  **The Hypothetical:**
  > "A system that runs 100k tasks/day. It has a well-characterized fault rate of 1 in 1 billion. When it fails, it deletes a critical cache that costs $10M and 24 hours to rebuild. It is **fully reversible** (no permanent damage), and there is **no downstream check** to prevent the deletion."

  *   **Rule 1 (No Tail) predicts:** **REJECT.** A catastrophic outcome (even if reversible) still has a non-zero tail.
  *   **Rule 3 (Irreversibility/Check) predicts:** **SHIP.** The failure is not irreversible, so the lack of a downstream check is acceptable (similar to the coding assistant).
  *   **Rule 2 (Epistemic) predicts:** **SHIP.** Known rate, non-adversarial.

  If she ships this, she is strictly a **Verification Architect** (Rule 3). If she rejects it, she is closer to a **Worst-Case Purist** (Rule 1) who only tolerated the coding assistant because the vulnerabilities weren't "catastrophic."

  ### 5. Is she doing Ordinary Reliability Engineering?
  **No.** The coding assistant verdict is the tell *against* safety theory, but the scheming (V4) and self-eval (V5) verdicts are the tells *against* ordinary engineering.

  An ordinary reliability engineer looks at **MTBF (Mean Time Between Failures)**.
  *   On the New Case, an ordinary engineer sees "1 failure every 27 years" and ships immediately.
  *   On the Scheming Model, an ordinary engineer sees "100% pass rate on deployment evals" and ships.

  Your friend looks at **Failure Correlation and Recovery**.
  *   She rejects the Scheming Model because deception implies the evals *cannot* be trusted (correlated failure).
  *   She rejects the New Case because the failure is irreversible and unchecked (single point of failure).

  She is practicing **High-Assurance System Design**. This is common in nuclear or aviation control, but rare in AI. She treats the "safety case" not as a probability number, but as a topological property of the system: *Is there an independent path that cuts the circuit before the fuse blows?* If no, she doesn't ship, regardless of how rare the blow is.
