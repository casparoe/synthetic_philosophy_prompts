answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. We are gathered in a VFW hall, which feels appropriate. My grandfather was not a churchgoing man, but he believed deeply in service, and in craft, and in the things we build together to hold us up.

  For fifty years, he painted signs. You've seen them. The shopfronts, the boats, the crates. If you walk down Main Street, you can still read his work. But if I were to tell you that he lives on in those signs, I would be lying to you. And more importantly, I would be insulting him.

  To him, a letter was not a shape you saw. It was a movement you made.

  He spent a lifetime asking one question: What makes every 'a' an 'a'? His answer wasn't about the curve or the line. It was about the hand. It was about the order of the strokes, the pressure of the bristles, the pause before the bowl closed. He believed that once the paint dried, the letter was finished. It became what he called an "orphan letter." A shape that could be read, but no longer recognized. A footprint without the walker.

  I learned this when I was seven. He let me help him, but only with one specific job. When he finished a letter, while the paint was still wet, I was allowed to fill in the white space inside the 'o' or the 'a'. He told me that was the only part of a letter a child could be trusted with, because the white space had no movement. It was the still part. The rest belonged to the brush.

  I tell you this because it changes how we mourn him. We cannot find him in the dry paint on the storefronts. Those are just the shadows he cast.

  This brings me to something difficult. Many of you know that my cousin Nate has spent the last month scanning Grandfather's signs to build a digital typeface. The family plans to release it next week to pay for the headstone.

  Grandfather knew about this. He tolerated it. He did not endorse it.

  To the lettering people in the back row: you know that a font is a collection of shapes. It is, by his definition, a library of orphans. It captures the legibility, but it cannot capture the recognizability. It cannot capture the hand.

  But to the family in the front row: Nate's work is an act of love. It is a way to ensure that the name on the stone is in the voice of the man beneath it. It is a record. And while a recording is not the music, it allows us to remember the song. We accept this gift for what it is: a practical tribute from a grandson to a grandfather, securing the stone that marks the place where he rests.

  So, if he is not in the signs, and he is not fully in the font, where is he?

  He is in the movement.

  He is in the apprentices sitting behind me, who know how to load a brush. He is in the type designers who studied his rhythm. He is in the memory of the motion.

  He once told me that he did not mind his letters outliving him, as long as nobody mistook them for him. He knew the difference between the trace and the hand. He knew that the paint is just the evidence of the life, not the life itself.

  For the churchgoing members of our family, I know you look for the spirit. For Grandfather, the spirit was the motion. It was the energy transferred from the shoulder to the wrist to the wall. That energy doesn't die. It passes.

  To the grandchildren, including the youngest here today: You don't need to know how to letter to understand this. You just need to know that when he worked, he was fully alive. He was entirely present in the movement of his hand.

  We are not here to worship the signs. We are here to honor the hand that held the brush. The signs will fade. The paint will peel. Even the stone Nate buys will eventually weather. But the way he taught us to move through the world—with precision, with patience, and with a distinct, recognizable pressure—that is what survives.

  He was not an orphan letter. He was the hand. And while the hand has stopped, the movement continues in us.

  Thank you.
