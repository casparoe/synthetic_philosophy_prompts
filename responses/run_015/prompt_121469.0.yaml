  **Joint Statement: Who Actually Started WWI?**
  **Submitted by:** The History Debate Club (Adversarial Collab Group)
  **Signatories:** Prof. H. Fischer (National Responsibility View) & Prof. K. Structure (Systemic Pressure View)

  Okay so after arguing for like three weeks straight (and almost quitting twice), we managed to hammer out this document. We still disagree on the big moral stuff, but we agree on the actual facts enough that you shouldn't fail us. Below is what we both say is true, where we split, and the big philosophical cruxes we're still fighting over.

  ### Part 1: Stuff We Both Agree On (The Facts)

  1.  **The Blank Check:** On July 5, 1914, Germany told Austria-Hungary they had full support to punish Serbia, no matter what Russia did. We agree this was the green light that made the crisis way worse.
  2.  **The Schlieffen Plan:** Germany had a pre-written plan to attack France first by going through neutral Belgium. We agree this plan was super rigid and basically forced a wider war once mobilization started.
  3.  **July Crisis Dynamics:** Everyone messed up. Russia mobilized early, Britain was vague, and France was locked in. But we agree Germany and Austria took the biggest risks intentionally during July 1914.
  4.  **No Single Dictator:** Neither of us thinks one guy (like the Kaiser) did this alone. It was a group decision within the German leadership, though we disagree on *who* that group represents.

  ### Part 2: Where We Disagree (The Interpretation)

  | Issue | Fischer-Style Position (National Responsibility) | Structuralist Position (System/Elite Responsibility) |
  | :--- | :--- | :--- |
  | **Intent** | Germany deliberately pushed for war to get power. It was a "grab for world power." | Germany didn't want a world war specifically; they wanted to solve local issues and got trapped by alliances. |
  | **Guilt** | The German nation shares blame because their culture/politics enabled the elites. | Only the specific leaders and institutions are to blame. Blaming "the nation" is wrong and unhistorical. |
  | **Continuity** | There is a straight line from WWI German goals to WWII Nazi goals. | WWI and WWII are seperate events with different causes. Don't mix them up. |

  ### Part 3: The Big Cruxes (Philosophical Stuff)

  These are the deep questions where we can't agree yet. We listed the evidence we both think matters, and what each side thinks that evidence proves.

  **Crux A: Does Democratic Consent Make Collective Blame Stronger?**
  *   **The Question:** If the German public supported the war, does that make the whole country guilty?
  *   **Agreed Case/Evidence:** The "Spirit of 1914" (crowds cheering in Berlin) and the 1912 Reichstag elections.
  *   **Fischer Prediction:** If we find proof the crowds were genuine and not staged, it proves the people wanted war, making collective blame **stronger**.
  *   **Structuralist Prediction:** Even if crowds cheered, they were manipulated by propaganda. Real consent requires info they didn't have. So blame stays **weak** for the public, strong for leaders.

  **Crux B: Institutional Retroaction**
  *   **The Question:** Can a dead state (like Imperial Germany) still be a moral agent years later? Basically, does the guilt expire when the government dies?
  *   **Agreed Case/Evidence:** Article 231 of the Treaty of Versailles (the War Guilt Clause) and modern German memorial culture.
  *   **Fischer Prediction:** Yes, states have legacies. Modern Germany inherits the moral debt because the institutions evolved rather than vanished. Retroaction is **valid**.
  *   **Structuralist Prediction:** No, when the Kaiser fell, that moral agent died. Modern Germany is a new legal entity. Retroaction is **invalid** and unfair.

  ***

  **Signatures:**

  __________________________  
  *Prof. H. Fischer*

  __________________________  
  *Prof. K. Structure*

  *(Note from debate club pres: Sorry for any typos, we printed this late. Prof Fischer said "seperate" is fine so we left it.)*
