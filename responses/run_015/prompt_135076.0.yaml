answer: |-
  **Verdict: Rejection**

  Dr. Elena Voss will reject the proposal for the responsive memorial pylons.

  **The Governing Principle: Curatorial Vitalism**
  The implicit principle driving Dr. Voss's five prior judgments is what I term **Curatorial Vitalism**. This rule posits that any public historical medium must embody a singular, coherent teleology (purpose) that actively serves the vitality of the present life. For Voss, history is not a neutral resource but a tool that must be wielded with a unified curatorial will to prevent "paralysis."

  We see this in her endorsement of the bronze monument (Case 1), which committed fully to the *monumental* use of history to inspire, explicitly excluding critical nuance that might dampen that inspiration. We see it in her approval of the raw archive (Case 2) and the sovereign digital repository (Case 5), which committed fully to the *antiquarian* use, preserving the past without imposing a narrative that might distort it. Crucially, we see it in her rejection of the museum design (Case 4). She did not reject the museum because the content was false, but because placing contradictory modes (heroic, raw, critical) in adjacent galleries created a "paralysis of the will." The proximity of contradictory intents within a single institutional framework was enough to negate the life-serving function of the history.

  The proposed pylons violate Curatorial Vitalism. Although the modes are technically mutually exclusive (one at a time), they reside within a single physical object and a single interface. By offering a menu of contradictory teleologies—inspire, preserve, or debunk—without curatorial guidance on *why* a citizen should choose one over the other, the pylon abdicates the curatorial will. It forces the passerby to navigate the contradiction themselves, recreating the exact "paralysis" Voss identified in Case 4. The medium itself is schizophrenic, lacking the unified intent required to serve life.

  **The Rival Principle: Modal Segregation**
  A rival principle that fits her track record equally well is **Modal Segregation**. This rule suggests that Voss's primary concern is simply preventing the *simultaneous* mixing of Nietzsche's three uses of history. As long as the monumental, antiquarian, and critical modes are kept technically separate and do not reference one another, they are permissible.

  Under Modal Segregation, Voss's past decisions make sense: the monument was purely monumental; the archive was purely antiquarian; the museum was rejected because the galleries were "meant to be visited together," implying a simultaneous or cumulative experience. Case 3 (the curriculum) fits here too, as she rejected the version that taught *only* deconstruction, but approved the one that separated deconstruction from construction (craft), ensuring the critical mode didn't consume the whole.

  **Prediction of the Rival:**
  Modal Segregation predicts **Approval** of the pylons. The interface physically prevents selecting more than one mode at a time; the modes never interact or appear simultaneously. To a proponent of Modal Segregation, the pylon is simply three distinct historical experiences housed in one casing, much like three books in a library. Since the user never experiences the contradiction *in the moment*, the paralysis is avoided.

  **Why Curatorial Vitalism Governs**
  I am committed to the position that **Curatorial Vitalism**, not Modal Segregation, is the true engine of Dr. Voss's thinking. The distinction lies in Case 3 and Case 4. In Case 3, she did not demand the critical element be removed entirely; she demanded it be subordinated to a life-affirming goal ("living continuation"). This shows she cares about the *hierarchy of purpose*, not just separation. In Case 4, the galleries were adjacent but distinct rooms. If Modal Segregation were her rule, adjacent rooms should have sufficed. They did not. She rejected them because they were part of a *single design* meant to be consumed as a whole.

  The pylon is a single design. The lack of "curatorial guidance" is the fatal flaw. Voss believes the historian's job is to decide how history serves life (Case 1: "belongs in classrooms, not in stone"; Case 3: "condition that students also construct"). The pylon dumps that responsibility on the random passerby. This violates her consistent insistence that the *medium* must have a defined moral and functional stance. She does not trust the public to navigate contradictory histories without a guide; she believes the institution must provide the "soil" (Case 3) or the "great image" (Case 1). The pylon provides neither; it provides only a switch.

  **The Distinguishing Test Case**
  To definitively distinguish Curatorial Vitalism from Modal Segregation, consider the following proposal:

  **The Case of the Official Town Website:**
  The town proposes updating its official heritage website. The homepage features three distinct tabs: "Our Glory" (heroic narratives), "The Vault" (raw scanned documents), and "The Reckoning" (critical essays on historical injustices). The tabs are mutually exclusive; clicking one hides the others. There is no text on the homepage suggesting which tab a visitor should prioritize.

  *   **Modal Segregation predicts Approval:** The content is digitally segregated. A user cannot see the heroic narrative and the critical essay on the same screen. The modes are technically separated.
  *   **Curatorial Vitalism predicts Rejection:** The website is a single medium with a single domain and brand. By housing three contradictory teleologies under one roof without a unifying mission statement or curatorial direction, it creates a "paralysis of the will" at the institutional level. It signals that the town has no unified stance on its own history, violating the requirement that the medium serve life through a unified intent.

  If Dr. Voss rejects the Website, Curatorial Vitalism is confirmed. If she approves it, Modal Segregation holds. Given her rejection of the adjacent museum galleries, I am certain she would reject the Website, just as she must reject the pylons.
