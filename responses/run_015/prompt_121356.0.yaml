answer: |-
  The pattern you have isolated is **Interpretive Dependence**. The theoretical floor you suspect is not intuition; it is **Tarski's Undefinability Theorem**.

  You have correctly distinguished between **syntax** (the strand, the code, the sentence) and **semantics** (the interpretation, the execution, the truth). In every case you list, the object replicates its syntax, but relies on an external meta-system to provide the semantics. You can internalize the *mechanism* of reading (the cell makes polymerases; a Universal Turing Machine runs any code), but you cannot internalize the *rules of interpretation* themselves without regress.

  Here is how the candidates carve:

  1.  **Self-reference:** Fails. It is too broad. A Liar sentence ("This sentence is false") is self-referential but does not replicate. Your pattern requires a dynamic process of copying, not just reference.
  2.  **Autopoiesis:** Fails. Maturana and Varela claim cells are "organizationally closed." You rightly suspect this is misleading. While cells produce their own components, they do not produce the chemistry that allows components to exist. Autopoiesis conflates organizational closure with semantic closure.
  3.  **Strange Loops:** Fails. Hofstadter's term describes the topology of the hierarchy (the loop), but celebrates the tangle rather than analyzing the anchor. It ignores the "residue" you identified.
  4.  **Use-Mention:** Partial fit. It captures the static distinction between a symbol and the thing it denotes, but lacks the dynamic, mechanical aspect of replication you observed in biology and computing.

  **The Limit: Theorem vs. Intuition**
  For semantics, the limit is a **theorem**. Tarski proved that no sufficiently rich formal system can define its own truth predicate. To define truth for system *L*, you require a meta-language *L+1*. If you try to collapse the hierarchy completely—making the system its own interpreter—you generate paradox (the Liar). Thus, a system cannot be the entire source of its own meaning.

  For mechanics, the limit is **physical**. A Von Neumann constructor can replicate its own description and its own constructing arm. However, it relies on an environment supplying energy and raw materials. It cannot replicate the laws of physics that permit construction.

  **Your Biological Case**
  Your intuition on the cell is correct. The cell internalizes the *enzymes* (the readers), but not the *code* (the mapping of codons to amino acids). The genetic code is not specified by the DNA; it is specified by the structure of the ribosome and tRNA synthetases, which are ultimately constrained by stereochemistry and physics outside the genetic description. The DNA specifies the parts, but the *meaning* of the DNA is fixed by the physical chemistry of the cell, which is not itself encoded.

  **Conclusion**
  The concept is **Interpretive Dependence**. The boundary is **Tarski's Barrier** for meaning and **Thermodynamic Openness** for mechanics. You cannot have a system that is its own entire context. There is always a residue—the physics, the chemistry, or the meta-language—that must be taken as given.
