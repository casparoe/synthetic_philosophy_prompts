      *   "False information" is accurate but dry.
      *   The columnist wants to know when they can use the strong language ("lie") without being technically wrong or getting edited out.
      *   *Key Insight:* The procedure shouldn't determine *ontological truth* (does the model have a soul?), but rather *functional attribution* (who is responsible for the deception, and does the mechanism matter for the story?).

  3.  **Drafting the Procedure (The "10-Minute Adjudication Protocol"):**
      *   *Goal:* Move from "It said something false" to "Can I call this a lie?"
