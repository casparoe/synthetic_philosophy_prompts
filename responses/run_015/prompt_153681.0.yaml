      *   *Refining the Theory Diagnosis:*
          *   She isn't a pure Natural Lawyer (Case 3: good outcome didn't save it).
          *   She isn't a Positivist (Case 1: bad content killed it).
          *   She is closest to **Lon Fuller**. Why? Because she focuses on the *process* of making law (Case 4: secrecy kills it; Case 3: judicial overreach kills it) and sets a moral floor (Case 1).
          *   *Wait, check Case 3 again:* "Violates legislative intent... legally invalid." Fuller cares about fidelity to the system. If a judge ignores intent, they break the system's integrity.
