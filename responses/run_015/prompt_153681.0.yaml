answer: |-
  Based on the track record you've described, your roommate is not running a standard Positivist program (like Hart or Raz), nor is she a classical Substantive Natural Lawyer (like Aquinas or Finnis). She is operating almost exclusively within the framework of **Procedural Natural Law**, specifically the version articulated by Lon Fuller.

  Here is the breakdown of her jurisprudential profile, the prediction for the AI case, and how to test her further.

  ### 1. Diagnosing Her Theory

  She is a **Fullerian Procedural Natural Lawyer**.

  Here is why the other labels don't fit, and why Fuller does:

  *   **Why she isn't an Exclusive Positivist:** An exclusive positivist believes law is valid solely based on its source (e.g., did the legislature pass it?), regardless of its content. Your roommate rejected the Torture Statute (Case 1) despite it clearing every legislative step. To a positivist, that is valid law, however wicked. To her, extreme immorality destroys validity.
  *   **Why she isn't an Inclusive Positivist:** An inclusive positivist allows morality to determine validity *only if* the legal system's rules say so. Your roommate seems to think morality and procedure matter *inherently*, not just because a rulebook says they do.
  *   **Why she isn't a Substantive Natural Lawyer:** A classical natural lawyer might have accepted the Life-Saving Court Decision (Case 3) as valid law because it achieved a higher moral good (saving lives). Your roommate called it "legally invalid." She separates the *goodness of the outcome* from the *validity of the legal act*.

  **The Pattern:** She believes law is a specific human craft with internal requirements. If you violate the *process* of making law (secrecy, ignoring intent) or the *substantive floor* (torture), it ceases to be law. However, achieving a good moral result does not cure a procedural defect.

  ### 2. Mapping Her Verdicts to the Theory

  Here is how her four past cases align with this reading:

  *   **The Torture Statute (Case 1):** This reflects the "Radbruch Formula" influence often paired with Fuller. There is a threshold of injustice where a rule loses its legal character. It fails the substantive minimum required for a system to claim fidelity.
  *   **The Tribal Custom (Case 2):** Fuller viewed law as a way to subject human conduct to the governance of rules. If a community consistently follows a rule (coin flip) that is known and applied, it satisfies the internal requirements of legality for that group, even without a state.
  *   **The Life-Saving Decision (Case 3):** This is the strongest evidence for her proceduralism. She prioritizes the integrity of the legal system (legislative intent) over the immediate moral benefit. For a Fullerian, a judge violating their role undermines the "congruence" between the declared rule and official action, damaging the system's ability to guide conduct in the future.
  *   **The Secret Memo (Case 4):** This is pure Fuller. One of the core requirements of legality is that rules must be public. If people cannot know the rule, they cannot follow it. The fact that it was morally good is irrelevant to its status *as law*.

  ### 3. The Verdict on the AI Regulatory Code

  **Prediction:** She will say this is **Not Law** (or legally invalid).

  **Reasoning:**
  While the AI code satisfies the Positivist criteria (promulgated, notice-and-comment met), it fails the Fullerian requirement of **human agency and responsibility**.

  For your roommate, law is not just a set of commands; it is a purposive human activity. It requires that the makers of the law understand what they have made so they can be responsible for it. If literally *no human* read the text, the agency cannot claim fidelity to the rule. They cannot explain it, they cannot defend its logic, and they cannot ensure it is applied consistently in the future.

  This violates the principle that there must be congruence between the rule as declared and the action of the officials enforcing it. If the officials don't know what the rule says, they cannot act in accordance with it intentionally. It becomes a force of nature, not a legal rule.

  **Closest Analog:**
  **The Secret Executive Memo (Case 4).**
  In both cases, there is a "black box" element that prevents public accountability and understanding. In Case 4, the box was secrecy; in the AI case, the box is the algorithmic generation that no human comprehends. In both, the moral neutrality or goodness of the outcome does not cure the structural defect in how the rule came into existence.

  ### 4. The Hypothetical That Splits the Theories

  To truly test whether she is committed to this "Human Agency/Procedural" view versus a standard Positivist view, you should offer her the **"Gibberish Statute"** hypothetical.

  **The Hypothetical:**
  > A legislature passes a statute following every correct procedure. It is published and clear. However, due to a clerical error, the text printed in the official code is total gibberish (random words with no syntax). No one can understand it, including the legislators who voted on it. It is morally neutral.

  **How the Theories Split:**
  *   **The Positivist (Hart/Raz):** Will likely say this **is Law**. It has the correct source (legislature) and followed the rule of recognition. It is a *bad* law, or a *broken* law, but it is legally valid until repealed.
  *   **Your Roommate (Fullerian):** Should say this is **Not Law**. It fails the requirement that law must be understandable and capable of guiding conduct. If it cannot be understood, it cannot function as law.

  **Why this splits them:**
  The AI case is slightly muddy because the AI code *works* (it fixes coordination). A positivist might argue the AI code is valid because it functions as a rule. The Gibberish Statute removes the "functioning" element. If she still calls the Gibberish Statute "Not Law," she is confirmed as a Procedural Natural Lawyer who believes understandability and human responsibility are conditions of validity, not just features of good policy.

  ### 5. A Note on the "Eight Principles"

  Since you mentioned mixing up the eight principles, here is how to think about them without quoting texts, specifically regarding your roommate's logic:

  She treats these principles not as moral ideals, but as functional necessities. Think of them like the rules of carpentry. If you want to make a table, you must use wood that is rigid. If you use jelly, you haven't made a "bad table"; you have failed to make a table at all.

  For her, the eight principles (things like making rules public, not changing them daily, ensuring they don't contradict each other, and making sure they are possible to follow) are the "wood" of law.
  *   **Case 4 (Secret Memo)** failed the "Publicity" requirement.
  *   **Case 3 (Court Decision)** failed the "Congruence" requirement (the judge's action didn't match the declared rule/intent).
  *   **The AI Case** fails the "Responsibility/Understandability" requirement. If the maker doesn't know the rule, they cannot ensure it is applied consistently.

  ### Summary for Dinner
  Tell her you think she's channeling Fuller. She treats law as a reciprocal relationship between the governor and the governed. If the governor (the agency) doesn't even know what they are governing with (the AI code), the reciprocity is broken. It's not law; it's just automated administration.

  If she pushes back and says the AI code *is* law because it was published, ask her about the Gibberish Statute. That is where her commitment to "law as a human craft" will either hold or break.
