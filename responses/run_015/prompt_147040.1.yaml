          *   **Intentionality:** The student argues Davidson's model eliminates self-deception if deception requires intentional action. Davidson actually argues self-deception is *not* intentional in the standard way (it's not a purposeful act), but it is still *self-deception* because of the causal structure of irrationality. The student sets up a straw man by implying Davidson fails because he removes intention, whereas Davidson's whole point is redefining self-deception to *not* require standard intentionality.
