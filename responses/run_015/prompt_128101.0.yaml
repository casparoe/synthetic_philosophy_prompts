      *   *Sentence 1:* "An action has moral worth only if it is done from duty alone, which means the agent feels no inclination to perform it and actively suppresses any emotional pull."
          *   *Accuracy:* "From duty alone" is accurate. "Feels no inclination... actively suppresses" is the caricature. Kant says inclination must not *determine* the will, not that it must be absent or suppressed.
      *   *Sentence 2:* "If you take pleasure in helping someone, that pleasure cancels the moral value of the act."
          *   *Accuracy:* Caricature. Kant says pleasure doesn't cancel worth unless it is the *determining ground* of the will.
      *   *Sentence 3:* "Kant's shopkeeper, who charges fair prices only to maintain his reputation, acts in accordance with duty but not from it, so his conduct has no moral worth."
          *   *Accuracy:* Accurate summary of the *Groundwork* example.
      *   *Sentence 4:* "By contrast, the misanthrope who helps others despite feeling nothing but contempt for them has full moral worth, because his will is determined solely by the representation of the moral law with no contaminating feeling."
          *   *Accuracy:* Mostly accurate regarding the misanthrope example, but "no contaminating feeling" implies feelings are inherently contaminating, which is the caricature. Feelings are irrelevant if not the motive.

