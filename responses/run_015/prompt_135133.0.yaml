  I am a journalist covering philosophy of science and cognitive theory, and I am drafting a two-page proposal for a six-week independent research fellowship aimed at conceptual problems in reasoning. My half-formed idea is this: heuristic arguments—our reflexive surprise at unexplained correlations, our demand for mechanisms, our default to modular explanations—are usually treated either as informal Bayesian updates or as evolutionary shortcuts. I want to propose that they are better reconstructed as audits of what I call an “independence escrow” condition: a structural, resource-bounded constraint on belief revision that presumes modularity not because independence is empirically probable, but because tracking all interaction terms exceeds a distributed reasoning system’s amortization budget. The precise question is whether the presumption of independence in heuristic reasoning can be formalized as a consistency check on cognitive budgets rather than as a probabilistic prior or a methodological default. The proposal must state the question with this framing; explain why existing statistical, evolutionary, and normative-epistemological treatments leave it open; lay out a week-by-week method in which I map three canonical heuristic patterns—correlation-surprise, mechanism-demand, and modularity-default—onto the escrow framework, locate their divergence points from standard probabilistic accounts, and specify honest failure conditions, including cases where tracking interactions is cheap yet independence is still presumed; describe the deliverable, a polished conceptual framework of roughly four thousand words rather than an empirical study, and define what result would count as success versus what would show the project is too large for six weeks; and argue why this angle is preferable to the obvious alternative of refining Bayesian priors. The audience is a foundation board with scientific literacy but no specialization in formal epistemology. Do not include a bibliography, citation list, or reading recommendations; I will supply those myself. Write in a formal, polished register appropriate to a grant prospectus. Bottom line: state the project’s central wager in one sentence on the final line, prefixed exactly as “Bottom line:”.
