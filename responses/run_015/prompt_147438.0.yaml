answer: |-
  # The 15-Minute Hall Decision Procedure

  This is a rigid checklist. Do not skip steps. Do not do this while tired. If you cannot answer a step with written evidence, you default to the smaller hall.

  **Definitions:**
  *   **Base Hall:** The size that fits your average turnout + 10% buffer. (Financially safe).
  *   **Boom Hall:** The size that fits your hopeful turnout. (Financially risky/nonrefundable deposit).
  *   **Reference Class:** The group of past events you compare this one to.

  ---

  ### Step 1: Lock the Reference Class (3 Minutes)
  **Question:** "What are the last 5 events that are most boringly similar to this one?"
  *   **Rule:** You must pick the *most boring* similarity, not the most exciting.
  *   **Bad Answer:** "The one time we had a viral post." (This is cherry-picking).
  *   **Good Answer:** "The last 5 zoning debates, including the ones with low turnout."
  *   **Action:** Write down the average attendance of those 5 events. This is your **Base Number**.

  **⚠️ LIE ALERT:** If you exclude a past event because "conditions were different," you are lying. Include it.
  **⚠️ LIE ALERT:** If you can't find 5 similar events, your Base Number is automatically your absolute lowest turnout ever.

  ### Step 2: Interrogate the Inside Story (4 Minutes)
  **Question:** "What specific evidence proves people will show up *beyond* the Base Number?"
  *   **Rule:** Anecdotes do not count. Only hard commitments count.
  *   **Bad Answer:** "People are commenting 'interested' on Facebook." (This is not a commitment).
  *   **Bad Answer:** "The speaker is local." (This is a hope, not data).
  *   **Good Answer:** "50 people have pre-registered with email confirmations."
  *   **Good Answer:** "3 local organizations have bussed members here."
  *   **Action:** Count the **Verified Commitments**. Ignore "likes," "shares," or verbal "I'll try to come."

  **Hard Stop:** If Verified Commitments are less than 50% of the extra seats needed for the Boom Hall, **STOP. Rent the Base Hall.**

  ### Step 3: The Coffee Discount (Modesty Check) (3 Minutes)
  **Question:** "If I bet $100 of my own money on my current attendance estimate, would I take that bet?"
  *   **Rule:** You are likely overconfident. You must apply a discount to your "Extra Hope" number.
  *   **Action:** Take the number of *extra* people you expect beyond the Base Number. Cut it in half.
  *   **Example:** Base is 45. You hope for 200. Extra hope is 155. Cut 155 in half = 77. New Estimate = 45 + 77 = 122.
  *   **Why:** This accounts for no-shows, weather, traffic, and your own optimism bias.

  **⚠️ LIE ALERT:** If you feel angry or resistant about cutting the number in half, you are emotionally invested in being right. **Default to Base Hall.**

  ### Step 4: The Risk Value Check (3 Minutes)
  **Question:** "If the hall is half-empty, does the loss ruin next month's budget?"
  *   **Rule:** This is not about facts; this is about pain tolerance.
  *   **Action:**
      *   If **YES** (It ruins the budget): **Rent the Base Hall.** (Procedure ends).
      *   If **NO** (We can absorb the loss): You may proceed to consider the Boom Hall *using the discounted number from Step 3*.

  ### Step 5: Partner Sign-Off (2 Minutes)
  **Question:** "Does my partner agree to risk the deposit based on the Step 3 number?"
  *   **Rule:** Your partner did not drink the coffee. They did not write the hype posts. They are the cold water.
  *   **Action:** Show them the Base Number (Step 1) and the Verified Commitments (Step 2).
  *   **Requirement:** For a **Boom Hall**, your partner must physically sign or text "Approved."
  *   **Veto Power:** If your partner says "No," you rent the Base Hall. No arguing.

  ---

  ### Application to Your Three Scenarios

  #### 1. The Viral Zoning Debate
  *   **Step 1 (Base):** Last 5 zoning debates averaged 45 people. **Base Number = 45.**
  *   **Step 2 (Story):** You claim 200. Verified Commitments? You have 0 pre-registrations, just Facebook comments. **Hard Stop Triggered.**
  *   **Result:** You do not pass Step 2. You cannot count comments as commitments.
  *   **Decision:** **Rent the Base Hall.**
  *   **Why:** The procedure forces you to admit a "like" is not a ticket.

  #### 2. The Strong Inside / Weak Outside (The Annoying One)
  *   **Scenario:** A famous author is speaking. Base rate for author talks is 40. You have 60 pre-registrations (Verified Commitments).
  *   **Step 1 (Base):** 40 people.
  *   **Step 2 (Story):** 60 verified tickets. This passes the 50% threshold for extra seats.
  *   **Step 3 (Discount):** Extra hope is 60. Cut in half = 30. New Estimate = 40 + 30 = 70.
  *   **Step 4 (Risk):** Boom Hall holds 150. Base Hall holds 80. Your estimate (70) fits in Base Hall.
  *   **Decision:** **Rent the Base Hall.**
  *   **Your Feeling:** Annoyed. You think, "But this author is huge!"
  *   **Procedure Logic:** The procedure acknowledges the strong inside view (the tickets) but still discounts for no-shows. Since the discounted number fits the safe hall, you don't gamble the deposit. You protect the budget against the 50% of ticket-holders who won't show.

  #### 3. The Agreement But Weird Gut Feel
  *   **Scenario:** Town Hall meeting. Base rate 150. Verified commitments 150. Discounted estimate 150. Boom Hall holds 150.
  *   **Step 1-3:** All pass. Math says Boom Hall is safe.
  *   **Step 4 (Risk):** You ask, "If half-empty, does it hurt?" You say "No."
  *   **Step 5 (Partner):** You show partner. Partner says, "The math works, but I know you're exhausted and desperate for a win."
  *   **Decision:** **Partner Vetoes. Rent Base Hall (or cancel).**
  *   **Why:** This is where values override facts. Even if the numbers work, if your emotional state or risk tolerance is off, the partner veto saves you from a stress-induced mistake.

  ---

  ### What This Procedure Cannot Fix

  1.  **Bad Data:** If your past records are wrong (e.g., you lied about past turnout to look good), Step 1 will fail. Garbage in, garbage out.
  2.  **Black Swans:** A snowstorm, a pandemic, or a competing event happening the same night cannot be predicted by base rates.
  3.  **Your Physical State:** If you are sleep-deprived, grieving, or financially desperate, you will try to rush Step 3 and Step 5. The procedure assumes you are capable of honesty. If you are not, the procedure becomes a checklist you lie through.
  4.  **Strategic Losses:** Sometimes you *want* to lose money on a hall to build prestige for a bigger goal later. This procedure is for financial safety, not marketing strategy. If you want to gamble for marketing, admit it in Step 4 and label it "Marketing Expense," not "Booking Error."

  ### Final Rule
  If you finish this checklist in less than 10 minutes, you didn't think hard enough. Wait 5 minutes. Then sign.
