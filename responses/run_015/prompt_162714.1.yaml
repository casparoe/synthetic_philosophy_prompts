answer: |-
  ### 1. Dependency Structure

  Before you draw the cycle of trades, two distinct conceptual layers must be established on the board. If you skip these, the argument collapses into a magic trick rather than a normative proof.

  **Layer 1: The Static Preference Map (Left Board)**
  *   **What:** Write the preference ordering explicitly: $A \succ B$, $B \succ C$, $C \succ A$.
  *   **Why:** You must establish that the agent is not making a mistake in *valuation* at any single moment. At $t_1$, they genuinely prefer $B$ to $A$ (plus the penny cost). If students think the agent is merely confused about the value of $A$, the pump looks like an error in calculation, not a structural flaw in rationality.
  *   **Prerequisite:** Define "Strict Preference" ($\succ$) as implying willingness to pay a small cost to switch. Without this, the penny cost doesn't bite.

  **Layer 2: The Decision Node Structure (Right Board)**
  *   **What:** Draw the sequence as three distinct decision nodes ($t_1, t_2, t_3$).
  *   **Why:** You must visually separate the *moments of choice*.
  *   **The Crucial Dependency for the Reply:** Before you introduce the objection (planning), you must explicitly label the default assumption of the argument: **Myopic Choice**. Write: *"Assumption: At each node, the agent maximizes current preference without binding future selves."*
  *   **Why this order?** The "Planning Reply" is unintelligible without the "Myopic Assumption." If you present the pump without specifying that the agent is choosing locally at each node, students will naturally assume the agent can plan. When you later introduce planning as a *reply*, they will think you are changing the rules. You must establish the myopic constraint as the *premise* of the pump so that breaking it counts as a *counter-argument*.

  ### 2. The Core Example

  Your instinct is correct: **Three goods (A, B, C) with a penny cost per swap.** Do not change this. It is the cleanest topology. However, the *framing* of the example determines whether students see it as a parlor trick or a philosophical argument.

  **What it must contain:**
  *   **Re-tradeability:** The agent must end up holding $A$ at the end, just as they started, but with less money ($A - 3p$ vs $A$).
      *   *Why:* If the cycle stops at $C$, the agent has $C - 2p$. They might prefer $C - 2p$ to $A$. To show a "sure loss," the final state must be strictly dominated by the initial state (Same Good, Less Money).
  *   **Unconnected Offerers:** Frame the offers as coming from three different traders in a market, not one villain.
      *   *Why:* If one person offers all trades, students will argue the agent is being coerced or tricked by a strategic opponent (game theory). If the offers are independent market opportunities, the loss stems entirely from the agent's internal preference structure.
  *   **No Risk/Uncertainty:** The outcomes must be certain.
      *   *Why:* If there is risk, the loss could be attributed to bad luck or risk-aversion, not preference cycles.
  *   **Static Preferences:** Explicitly state the agent's preferences do not change during the sequence.
      *   *Why:* If preferences change (e.g., they get tired of $A$), the cycle is rational adaptation, not irrationality.

  **What it must lack:**
  *   **Transaction Costs as Friction:** Do not frame the penny as a "fee" for service. It is a pure loss.
  *   **Psychological Explanations:** Do not suggest the agent is "confused." They are perfectly informed.

  ### 3. Misconception Map

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"This shows cyclic preferences are logically impossible."** | When stating the conclusion. | **Defuse:** Explicitly distinguish *logical contradiction* (A=A) from *pragmatic inconsistency* (sure loss). The agent isn't breaking logic; they are violating a norm of efficiency. |
  | **"The agent can just refuse the final swap."** | During the pump run-through. | **Defuse:** Remind them of the **Myopic Assumption** on the board. At $t_3$, $A \succ C - 2p$. Refusing violates their current preference. The pump assumes they act on current preferences. |
  | **"This requires an exploiter."** | During setup. | **Defuse:** Emphasize the **Unconnected Offerers**. The loss happens even if the offerers don't know each other. The "exploiter" is the structure of the preferences, not a person. |
  | **"This proves Transitivity."** | When summarizing the result. | **Defuse:** Clarify that the pump strictly rules out *cycles* (Acyclicity). Transitivity requires an additional step (assuming completeness/connectedness). |
  | **"This proves Completeness."** | When summarizing the result. | **Defuse:** Note that pumping incompleteness requires an extra premise: that the agent pays to resolve indifference. Without that, intransitivity is the primary target. |

  ### 4. Closing Question

  Do not ask "What is the money pump?" (They can memorize that). Ask a question that forces them to apply the **Local-vs-Plan** distinction.

  **The Question:**
  > "If the agent knows the entire sequence of offers at $t_0$, the money pump fails. Does this mean the agent is rational? Or does it mean the argument relies on a specific constraint on rational agency? What is that constraint?"

  **Desired Answer:**
  They should identify that the argument relies on the constraint that **rational agents cannot (or do not) bind their future selves.** If they say "It means planning is rational," push further: "The argument assumes planning is *not* the default mode of choice. Why?" (Target: The distinction between *myopic choice* as the baseline for the pump and *resolute choice* as the escape route).

  ### 5. Scope Limitation

  You are right to exclude the dispute over **whether rationality requires resolute choice**. That is a deep debate in dynamic choice theory (McClennen vs. Gauthier) that will swallow the hour.
  *   **State this openly:** "We are not settling whether it is *possible* or *rational* to bind oneself. We are establishing that *if* you choose myopically, cyclic preferences are costly."
  *   **State this openly:** Exclude **Representation Theorems**. Do not discuss how this maps to utility functions mathematically. Keep it normative and intuitive.

  ---

  ### Session Plan Table

  | Step | Idea Introduced | Depends On | Misconception Defused Here | Check That It Landed | Minutes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Setup** | **The Preference Cycle.** Write $A \succ B \succ C \succ A$. Define $\succ$ as willingness to pay small cost. | None. | That preferences are merely "feelings" rather than choice-guides. | Ask: "If I have $A$, will I pay 1p for $B$?" (Yes/No). | 10 |
  | **2. The Pump** | **The Sequence.** Introduce 3 independent traders. Run the trades ($A \to B \to C \to A$). Show final state ($A - 3p$). | Setup (Preference Cycle). | That an exploiter is required. | Ask: "Did the traders collude?" (No). | 15 |
  | **3. The Norm** | **Pragmatic Inconsistency.** Contrast starting state ($A$) with end state ($A - 3p$). Define "Sure Loss." | The Pump. | That this is a logical contradiction. | Ask: "Is $A - 3p = A$?" (No, it's worse). | 10 |
  | **4. The Reply** | **Myopia vs. Planning.** Explicitly label the "Myopic Assumption." Introduce "Planning/Resoluteness" as the objection. | Setup (Decision Node Structure). | That the agent can simply refuse the final swap. | Ask: "At $t_3$, why can't they refuse?" (Because $A \succ C$). | 15 |
  | **5. Limits** | **Acyclicity & Completeness.** Clarify the argument proves Acyclicity primarily. Note the extra premise for Completeness. | The Norm. | That this proves Transitivity directly. | Ask: "Does this rule out $A \sim B$?" (Only if willing to pay). | 5 |
  | **6. Close** | **Final Question.** Pose the question on constraints on agency (see Section 4). | The Reply. | That planning solves the problem without cost/assumption. | Listen for "binding" or "myopia" in answers. | 5 |
  | **Total** | | | | | **60** |
