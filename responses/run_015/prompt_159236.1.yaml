answer: |-
  The air in Outpost Vellum's bio-lab smelled of ozone and wet fur. Outside, the terraformed rain hammered the polycarbonate dome, but inside, the only sound was the hum of the fabricator and the sharp click of Elias's scalpel against the tray. He was the team's medic, responsible for keeping the local fauna alive enough to study. Ren, the lead biologist, stood over the data slate, her brow furrowed.

  On the table between them lay a crest-stalker, a hexapedal scavenger native to the moon's highlands. Its iridescent crest, usually rigid and fan-like, hung limp against its neck. The animal breathed steadily, but its eyes were dull.

  "Start with the grazer data," Elias said, wiping his gloves. "If we can't agree on the flap, we can't touch the crest."

  Ren swiped the screen. A hologram of a local grazer rotated slowly. It possessed a large, translucent membrane along its spine. "Population A uses the flap for mating displays. Population B lost the display behavior generations ago, but the flap remains. Now, a parasitic spore drifts through the valley. The flap deflects it. In Population B, the flap is the only thing keeping them alive."

  "So it's a shield," Elias said.

  "Functionally, yes," Ren corrected. "But historically? It was a billboard. If you ask what it's *for*, the history says mating. The current capacity says survival. If a Population B grazer comes in with a torn flap, do we treat it as a reproductive injury or a immune system failure?"

  "Does it matter?" Elias asked. "We stitch it either way."

  "It matters if the tissue is necrotic," Ren said. "If it's a shield, we reinforce it. If it's a display, maybe we let it heal rough. Nature doesn't care about beauty. But if we decide it's a shield, we're saying the current job overrides the history. We're saying function is what happens *now*."

  Elias glanced at the corner of the lab. Inside a stasis tank floated the second case: a fabricator print. They had scanned a wild predator and asked the machine to build a specimen molecule by molecule. It had no ancestors. It had never faced selection. Yet, inside its chest cavity, a chamber pulsed rhythmically.

  "The spec sheet says that chamber was designed for thermal regulation," Elias said. "Cooling the blood during high-speed chases."

  "Look at the chemical output," Ren said, tapping the tank's monitor. "It's filtering heavy metals from the bloodstream. The cooling design failed during the print, but the geometry accidentally created a filtration sink. It's keeping the animal alive in our heavy-metal-rich water supply. It has no history. No selection event ever chose for this filter. But without it, the animal dies in a week."

  "So is it a broken cooler or a working filter?" Elias asked.

  "That's the question," Ren said. "If function is history, that chamber is malfunctioning. It's failing to cool. If function is contribution, it's the most vital organ in the body. If I label it 'broken,' protocol says I should replace it with a correct cooler. If I do that, the animal dies of toxicity. If I call it a filter, I leave it alone. But I'm validating a glitch."

  Elias looked back at the crest-stalker on the table. This was the third case, and the one currently bleeding. The crest-stalker's crest wasn't held up by bone or muscle tension alone. It required constant grooming. The animals interlocked their grooming claws with the crest's base every few hours, depositing an oil that hardened the keratin. If an individual stopped grooming—due to injury, depression, or lethargy—the crest softened and collapsed within a season.

  There was no genetic selection for the crest's rigidity yet; the trait was too new, stabilized only by this behavioral loop. It was a function maintained by habit, not history.

  "This one isn't selected for," Elias said, probing the limp crest. "It's just a habit that got out of hand. The animal stopped grooming. The crest failed."

  "Is it broken?" Ren asked.

  "It's not doing what a crest does," Elias said. "It's not standing."

  "But there's no 'supposed to' here," Ren countered. "There's no ancestral lineage that died because their crests drooped. There's just this animal, right now, failing to maintain its own structure. If you surgically reinforce the crest, you bypass the loop. You fix the hardware, but you ignore the software. The animal stays lethargic, stops grooming something else, and dies later."

  "So I treat the lethargy," Elias said.

  "Or you admit the crest has no function," Ren said. "If there's no history of selection, and the grooming is just a behavioral tic, then the crest is just decoration. If it droops, nothing is wrong. It's just... different. Treating it implies there's a norm. But where did the norm come from? Not evolution. Not design. Just habit."

  Elias picked up the syringe. One option was a stimulant to wake the animal's grooming impulse. The other was a structural injectable to harden the crest regardless of behavior. The stimulant respected the loop but risked the animal's current weakness. The injectable fixed the appearance and structural integrity immediately but treated the creature like a machine with a broken part, ignoring the behavioral capacity that usually sustained it.

  "If I harden the crest," Elias said, "I'm saying the function is structural integrity. I'm saying the goal is a standing crest."

  "And if you stimulate the grooming?" Ren asked.

  "Then I'm saying the function is the maintenance behavior. The crest is just the output."

  The rain hammered harder. The fabricator hummed in the corner, ready to print a replacement chamber for the tank animal if Elias decided the current one was 'broken.' The grazer data blinked on the screen, waiting for a classification that would determine future treatment protocols for the whole valley.

  Elias hovered the needle over the crest-stalker's neck. He could feel the weight of the definition pressing down. If he chose the stimulant, he was betting that the animal's history of behavior mattered more than its current physical state. If he chose the hardener, he was betting that what the part *did* right now was all that mattered, regardless of how it got there.

  "Field medics care," Ren said quietly, echoing a argument from somewhere far away. "Because calling something broken is different from saying it's doing something else. You treat those differently."

  Elias didn't answer. He looked at the limp crest, then at the steady rise of the animal's flank. He adjusted his grip on the syringe, knowing that whichever way he pushed the plunger, he was answering the question for everyone who came after. The needle descended, but the choice hung in the air, unresolved.
