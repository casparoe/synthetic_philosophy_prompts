      *   Key texts: *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying).
      *   Core principle: Lying is always sinful. No exceptions (not even to save a life).
      *   Definition of a lie: Speaking a falsehood with the intention to deceive (*fallax enuntiatio cum intentione fallendi*).
      *   Key nuance: It's about the *intent* to deceive, not just the truth-value of the proposition. If you say something true but intend for the listener to believe something false, Augustine often categorizes this as lying or at least morally equivalent.
      *   Mental reservation vs. Intent: Augustine is strict. If the speaker knows the listener will draw a false conclusion and intends that, it's problematic.

  3.  **Analyze the Three Cases through Augustine's Lens:**

      *   *Case 1: PR Omission.* True statement, omitted context, intent to mislead journalists.
          *   Augustine: If the intent is to create a false belief in the listener's mind, this qualifies as lying in spirit, if not strict definition. In *De Mendacio*, he discusses speaking truth to deceive. He condemns this. He would likely collapse this into lying because the *will* to deceive is present.

      *   *Case 2: Dog Whistles.* Innocuous literal meaning, sinister signaled meaning.
          *   Augustine: This is tricky. If the speaker intends the specific audience to believe something false (or evil) while maintaining plausible deniability, the intent to deceive (or at least manipulate) is key. Augustine cares about the heart's intention. If the goal is to lead someone into error or sin via coded language, it's sinful. He might see this as a sophisticated form of deception, thus lying.

      *   *Case 3: Algorithms.* Platform doesn't assert anything; code maximizes engagement.
          *   Augustine: This is the hardest fit. Augustine focuses on human speech acts (*enuntiatio*). An algorithm isn't a person. However, the *designers* are people. If designers knowingly structure systems to spread falsehoods for profit, they are cooperating with evil. Augustine might not call the algorithm a "lie," but the designers are guilty of facilitating deception. His framework struggles with non-human agents, but the human intent behind the system is judgeable.

  4.  **Compare with Contemporary Kantian:**
      *   Kant: Also absolutist about lying (see "On a Supposed Right to Lie from Philanthropy"). Duty to truthfulness.
      *   Difference: Kant focuses on the maxim and the violation of rational agency. Augustine focuses on sin, the state of the soul, and charity (love of God/neighbor).
      *   Similarity: Both would likely condemn the intent to deceive in Cases 1 & 2.
      *   Difference on Case 3: A Kantian might focus on the violation of universalizability or treating users as mere means. Augustine focuses on the corruption of the soul and the breach of trust inherent in communication.

