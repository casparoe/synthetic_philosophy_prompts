prompt: |-
  hey so me and my friend Jonas (he's a phil phd too) have been going back and forth with Maya from my cohort — she's in moral psych — about Frankfurt cases and PAP, but we kept getting stuck on this twist we made up and I honestly can't tell who's right. here's how it went.

  Maya started by saying the standard Frankfurt setup (Black, Jones, the election decision) does kill PAP for moral responsibility, but not for the reason everyone thinks. she thinks what's actually doing the work is that the case severs the link between an agent's deliberative accesibility — whether an alternative is live inside their practical reasoning — and the actual causal pathway. in the classic version, Jones can still see "not deciding now" as a live option right up until he decides, even though Black makes it impossible for him to actually do it. so the case doesn't show there's no alternative in some metaphysical sense; it shows that having an alternative inside your reasoning horizon isn't necessary for blame.

  Jonas said thats just relabeling the mistake. he argued that if deliberative accesibility is the key, then Frankfurt hasn't actually shown PAP false in its original form — PAP is about objective alternatives, not about what you can see yourself doing. he then proposed a nested version: Black doesn't just watch Jones's brain for a sign of deciding otherwise; Black monitors Jones's own recognition of a specific branch point in his reasoning — the moment Jones himself frames "I could stop now" as a live option. if Jones reaches that framing, Black intervenes and makes it causally impossible for Jones to stop, but crucially Jonas thinks that in this version Jones doesnt have deliberative accesibility to stopping, because the monitoring mechanism collapses the practical horizon exactly at the point where he would have accessed it. so Jonas claims this nested case saves PAP: responsibility requires that the alternative be both objectively available and within the agent's deliberative field, and Frankfurt-style manipulation can target the second condition without touching the first.

  Maya replied that Jonas is smuggling in an epistimic condition that Frankfurt never intended. she said Frankfurt's whole point was that responsibility tracks the actual causal structure of the action — whether it flows from the agent's own will — not whether the agent had some special access to counterfactual paths. if Jonas wants to defend PAP by adding a deliberative-accessibility clause, he's not defending PAP, he's defending a totally different principel that Frankfurt never addressed. she also said Jonas's nested case is incoherent: if Black collapses the horizon exactly when Jones recognizes the branch point, then Jones never actually completes the recognition, so there's no clear moment where he lacks accesibility — it's just a standard Frankfurt case with extra neuroscience window dressing.

  Jonas came back with: but if Maya admits that in the classic case Jones still has deliberative access even though he can't do otherwise, then she's conceding that the absence of objective alternatives doesn't matter as long as the agent thinks they exist. that makes moral responsability depend on the agent's epistemic state, not on real possibilities. he thinks that's a worse result than just keeping PAP in its original form.

  they asked me to referee but honestly I can't tell who's right about what. please adjudicate point by point: is Maya right that Frankfurt's case works via severing deliberative access rather than killing objective alternatives? is Jonas's nested case actually different, or is it just window dressing? and does either of them miss something obvious about sourcehood or about collective responsability? also tell me who's more right overall and whether there's a better framing they're both ignoring.
