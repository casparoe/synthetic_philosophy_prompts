      *   **Overall Verdict:** Maya is closer to the consensus view (Sourcehood), but Jonas identifies a genuine tension (the role of phenomenology). However, Jonas's specific move (Nested Case) fails to save PAP because it either collapses into a manipulation case (no responsibility) or remains a Frankfurt case (responsibility without robust alternatives).
