answer: |-
  This is a fantastic dispute. It's clear you're all operating at a high level, but you've stumbled into a specific knot in the literature that sits between the metaphysics of free will and the psychology of agency. You are effectively debating the **"Flicker of Freedom" strategy** versus the **Actual Sequence (Sourcehood) view**, but you're framing it through the lens of *deliberative phenomenology*.

  Here is the adjudication, point by point.

  ### 1. Is Maya right that Frankfurt works by severing deliberative access from the causal pathway?

  **Verdict: Partially right on intuition, imprecise on terminology.**

  Maya is correctly identifying the **Actual Sequence** intuition, which is the standard compatibilist/sourcehood response to Frankfurt. However, her phrasing ("severs deliberative accessibility... from the actual causal pathway") is slightly confused.

  In the standard Frankfurt case, Jones's *deliberative accessibility* is usually left intact. Jones deliberates normally. He thinks, "I can vote for A or B." He chooses A. The fact that he *couldn't* have chosen B (due to Black) is irrelevant to the actual causal history of choosing A.
  *   **Where Maya is right:** She correctly sees that responsibility tracks the **actual source** of the action (Jones's own will), not the existence of counterfactual blockers. She is effectively arguing for a **Sourcehood Principle** over PAP.
  *   **Where she is imprecise:** She suggests the case works by messing with "deliberative accessibility." It doesn't. In the standard case, Jones *does* have deliberative access to the option; he just lacks the *power* to actualize it if he tries. Maya is conflating *access to the concept of an alternative* with *access to the possibility of an alternative*.

  **Correction:** Frankfurt cases show that **Regulative Control** (the power to do otherwise) is not necessary for responsibility, provided **Guidance Control** (the mechanism that actually produces the action is the agent's own) is present. Maya is gesturing at Guidance Control but describing it as "deliberative accessibility."

  ### 2. Is Jonas's Nested Case actually different, or is it window dressing?

  **Verdict: It is a "Flicker of Freedom" strategy, and it fails to save PAP for the reasons Maya suspects, though her "incoherence" charge needs nuance.**

  Jonas has constructed what is known in the literature as a **Flicker of Freedom** case (associated with David Wiggins and Robert Kane). The strategy is to argue that there *is* still an alternative possibility in Frankfurt cases, just a very small one (e.g., the possibility of *beginning* to choose otherwise, or in Jonas's version, the possibility of *framing* the alternative).

  *   **The Strength of Jonas's Move:** He is trying to show that if you remove the *phenomenological sense* of an open future (deliberative accessibility), our intuition that Jones is responsible vanishes. He is arguing that PAP survives if we define "alternative" as "accessible deliberative branch point."
  *   **The Weakness (Maya's Point):** Maya is right that this smuggles in an epistemic/psychological condition that PAP (traditionally understood) doesn't require. PAP is a metaphysical claim about causal powers, not a psychological claim about what the agent is thinking.
  *   **The "Incoherence" Charge:** Maya says if Black intervenes *at* the moment of recognition, the recognition never completes. This is the crux.
      *   If Jones *is* responsible in the nested case, he must have decided on his own. If he decided on his own, Black did not intervene. Therefore, the "branch point" was *not* triggered.
      *   Jonas wants to say Jones lacks deliberative access to stopping. But if Jones decides on his own, he *could* have triggered the monitor (in the counterfactual sense).
      *   **The Fatal Flaw:** Even if Jonas succeeds in finding an alternative (the "flicker" of recognizing the branch), that alternative is not **robust**. For PAP to ground moral responsibility, the alternative must be relevant to the blame. Merely having the ability to *start thinking* about doing otherwise, only to be shut down by Black, does not give Jones the kind of control that makes him blameworthy. Jonas saves the *existence* of an alternative, but not the *significance* of that alternative.

  ### 3. Are they missing something obvious about Sourcehood or Collective Responsibility?

  **Yes. They are missing the distinction between Regulative and Guidance Control, and the role of Robustness.**

  *   **Sourcehood (Actual Sequence):** Both are dancing around this. The consensus among Frankfurt-defenders (like John Martin Fischer) is that responsibility requires **Guidance Control**. This means the mechanism that issues in the action must be the agent's own (reasons-responsive). It does *not* require **Regulative Control** (the ability to do otherwise). Maya is arguing for Guidance Control but calling it "deliberative access." Jonas is arguing that Regulative Control is necessary but trying to hide it inside the deliberative process.
  *   **Robustness:** This is the missing key for Jonas. Even if his nested case preserves a tiny alternative (the flicker of recognition), that alternative is not *robust* enough to ground responsibility. If I can only "think about stopping" but cannot actually stop, that alternative is morally inert. Jonas needs to explain why *that* specific alternative is enough to satisfy PAP's moral weight. He can't.
  *   **Collective Responsibility:** This is largely a red herring here. This debate is about individual agency conditions. Bringing in collective responsibility wouldn't solve the metaphysical tension between PAP and Sourcehood.

  ### 4. Who is more right overall?

  **Maya is more right about the metaphysics; Jonas is more right about the phenomenology.**

  *   **Metaphysically (Maya):** She is correct that Frankfurt cases undermine PAP. The existence of Black (the counterfactual intervener) does not change the actual sequence of events when Jones acts on his own. Responsibility supervenes on the actual sequence. Jonas's attempt to save PAP by finding a "flicker" is a well-known strategy that most metaphysicians of free will consider unsuccessful because the flicker lacks robustness.
  *   **Phenomenologically (Jonas):** Jonas hits on a crucial psychological truth: *Human practices of blame* often depend on the agent *feeling* like they had a choice. If we discover an agent was neurally incapable of even *conceiving* of an alternative (Jonas's nested case), we might be less inclined to blame them, even if the causal source was "theirs." Jonas is identifying a condition for **moral address**, not necessarily **moral responsibility**.

  ### 5. A Better Framing: Guidance Control vs. Reasons-Responsiveness

  To resolve this, stop talking about "deliberative accessibility" and start talking about **Mechanisms**.

  Propose this framing to them:

  1.  **Shift to Fischer & Ravizza:** The debate isn't about "alternatives" (PAP) vs. "no alternatives" (Frankfurt). It's about **Regulative Control** (PAP) vs. **Guidance Control** (Frankfurt).
  2.  **The Test:** Ask Jonas: "In your nested case, if Jones decides on his own (so Black does nothing), is the mechanism that produced the decision **reasons-responsive**?"
      *   If **Yes**: Then Jones has Guidance Control. He is responsible. The fact that he lacked a robust alternative (because Black *would* have stopped him) is irrelevant. Maya wins.
      *   If **No**: Then Jones is basically a manipulated puppet. He isn't responsible. But this isn't because PAP is true; it's because Sourcehood is missing.
  3.  **The "Flicker" Rebuttal:** Tell Jonas that even if he finds an alternative possibility (the flicker of recognition), he must show that the alternative is **robust**. Does having the ability to *think* about stopping allow him to avoid blame? No. Therefore, PAP is still dead, even if a tiny alternative survives.

  **Final Ruling:**
  Maya wins the philosophical argument (PAP is false; Sourcehood is what matters). Jonas wins the psychological insight (our blame practices track perceived options). Jonas's nested case does not save PAP; it merely shifts the location of the counterfactual blocker without restoring robust control.

  **Suggested Peace Offering:** Suggest they read **John Martin Fischer's "The Frankfurt Cases: The Moral of the Stories"** together. It explicitly addresses the "flicker" strategy Jonas is using and validates Maya's Sourcehood intuition while clarifying the terminology Maya is fumbling.
