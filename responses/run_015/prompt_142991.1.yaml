  **NATIONAL ENDOWMENT FOR ETHNOLINGUISTIC FIELDWORK (NEEF)**
  **POLICY DIRECTIVE 74-B**
  **SUBJECT: COMPLIANCE STANDARDS FOR RADICAL TRANSLATION MANUALS**

  **1.0 PURPOSE AND SCOPE**
  All grant recipients engaged in radical translation fieldwork must adhere to the Principle of Translational Indeterminacy. Recipients are reminded that translation manuals constructed from behavioral evidence alone are underdetermined by that evidence. Consequently, no single manual constitutes a factual discovery of native meaning. This directive establishes compliance protocols for acknowledging the empirical equivalence of incompatible ontological schemes.

  **2.0 EMPIRICAL EQUIVALENCE AND DISCLAIMER REQUIREMENTS**
  In contexts involving fleeting stimulus conditions (hereinafter "gavagai-type scenarios"), fieldworkers must recognize that multiple translation manuals may be compatible with the totality of native assent and dissent behavior. Specifically, manuals rendering a native expression as "rabbit," "undetached rabbit part," or "temporal stage of rabbithood" are to be treated as empirically equivalent.

  Per Section 2.1, all published manuals must carry a prominent "No-Fact-of-the-Matter" disclaimer. This disclaimer must explicitly state that the selection of one manual over another is not adjudicable by behavioral evidence and reflects only the translator's analytical hypotheses. Claims of unique correctness are prohibited. Grant funds may be withheld if a fieldworker implies that the native intends "rabbit" rather than "rabbit stage" without citing specific analytical hypotheses bridging the gap between stimulus meaning and terminology.

  **3.0 DOCUMENTATION OF ANALYTICAL HYPOTHESES**
  Translators must submit a separate Appendix of Analytical Hypotheses alongside all draft manuals. This appendix must detail the projections used to map native syntax onto home-language ontology. Peer reviewers are mandated to certify that no unstated ontological commitments have been smuggled into the translation key.

  Reviewers must verify that the translator has not privileged enduring objects over temporal stages unless such privilege is justified by manual simplicity rather than factual accuracy. As noted in previous audit cycles, the distinction between indeterminacy of translation and indeterminacy of reference is critical; however, for compliance purposes, any claim that reference is fixed independently of the background language will result in immediate probation.

  **4.0 INFORMANT DISPUTE RESOLUTION AND REFUND PROTOCOL**
  NEEF acknowledges that indigenous informants may dispute translation outputs. If an informant contests a manual—claiming, for instance, that "gavagai" was mistranslated as "rabbit" rather than "momentary rabbit-flash"—the fieldworker must initiate Protocol 12-Onto.

  Since there is no fact of the matter regarding the informant's intended reference, the dispute cannot be settled by appeal to truth. Instead, arbitration will focus on whether the fieldworker adequately disclosed the underdetermination of the stimulus evidence. If the fieldworker failed to inform the informant that the translation was one of multiple empirically adequate options, a partial grant refund is triggered. The refund amount corresponds to the percentage of the manual claimed to be uniquely determined. Informants will be compensated in equivalent trade goods, acknowledging that the value of such goods is likewise subject to ontological relativity.

  **5.0 ADMINISTRATIVE OVERSIGHT**
  The burden of policing these standards falls upon the Office of Ontological Audit. Regarding the complexity of this oversight, Senior Ontological Auditor Dr. Aris Thorne noted in the last fiscal review:

  > "The administrative difficulty lies not in verifying the behavioral data, which is straightforward, but in ensuring that translators do not unconsciously revert to realist assumptions when drafting analytical hypotheses. We are essentially auditing the absence of factual grounds. It requires reviewers to read multiple incompatible manuals simultaneously and certify that neither is more true than the other, while ensuring the grantee doesn't secretly believe one is. The paperwork required to document that there is no paper trail for the truth is substantial."

  **6.0 EFFECTIVE DATE**
  This policy is effective immediately. All existing manuals must be revised to comply with Section 2.1 within ninety days. Failure to append the required disclaimers will be interpreted as a claim to factual uniqueness, constituting fraud under the Indeterminacy Compliance Act.

  **AUTHORIZED BY:**
  *The Committee on Radical Interpretation*
  *National Endowment for Ethnolinguistic Fieldwork*
