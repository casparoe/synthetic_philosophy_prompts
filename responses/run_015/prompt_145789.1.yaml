answer: |-
  # Desiderata for an Account of Subjective Unity

  The following criteria constrain any viable theory of the unity of consciousness. The purpose of this specification is twofold: it must capture the phenomenological reality of "what it is like" to be a subject, and it must be robust enough to underwrite clinical and legal ascriptions of agency and responsibility. Where these aims conflict, the tension must be explicitly marked rather than smoothed over.

  ### I. Core Desiderata

  **1. The Phenomenal-Access Distinction**
  *   **Requirement:** The account must distinguish between experiences being *co-conscious* (phenomenally unified) and experiences being *mutually accessible* for report, reasoning, and control.
  *   **Case/Consideration:** Standard post-callosotomy patients. The left hemisphere (LH) verbally confabulates a rationale for the left hand's action, which it did not control. If unity were merely functional access, the LH's confabulation would constitute unity. If unity is phenomenal, the LH may be lying about the *source* of the action while genuinely lacking the *experience* of willing it.
  *   **Status:** **Non-negotiable.** Collapsing this distinction renders the theory behaviorist and incapable of supporting claims about "what it is like."

  **2. The Subject-Person Distinction**
  *   **Requirement:** The account must distinguish the *number of conscious subjects* from the *number of persons or agents*.
  *   **Case/Consideration:** Legal and clinical ascription. A single human organism (person) may house dissociated centers of agency (subjects). Responsibility requires a target; if two subjects inhabit one body, punishing the body punishes both, raising retributive issues. Conversely, a unified subject may span multiple organisms (see Dial Case below).
  *   **Status:** **Non-negotiable.** Failure here renders the theory useless for the stipulated legal/clinical purpose.

  **3. The Plasticity and Development Constraint**
  *   **Requirement:** The account must explain why agenesis of the corpus callosum and childhood hemispherectomy result in apparent unity, whereas adult callosotomy results in apparent disunity, despite similar anatomical severance.
  *   **Case/Consideration:** People born without a corpus callosum and children who have had a hemisphere removed look unified in ordinary life. Adult split-brain patients do not. A structural criterion (e.g., "physical connection") fails here; a functional or developmental criterion is required.
  *   **Status:** **Non-negotiable.** Empirical adequacy is required for clinical application.

  **4. The Intra-Hemispheric Dissociation Constraint**
  *   **Requirement:** The account must allow for disunity within a single anatomical hemisphere.
  *   **Case/Consideration:** Phenomena where experience and report come apart within one hemisphere (e.g., blindsight, alien hand syndrome localized to one side). Unity cannot be defined simply as "activity within one cortex."
  *   **Status:** **Non-negotiable.** Prevents crude anatomical reductionism.

  **5. The Hierarchical Endorsement Constraint**
  *   **Requirement:** The account must accommodate cases where first-order outputs diverge but higher-order endorsement converges.
  *   **Case/Consideration:** *Stipulated Binaural Case:* A callosotomy patient receives a question binaurally, writes two incompatible answers with two hands (each disclaiming knowledge of the other), yet when asked "Which answer is yours?", both hands indicate the same one. This suggests a fragmented first-order consciousness underwritten by a unified second-order subject (or vice versa).
  *   **Status:** **Non-negotiable.** The theory must specify at which level of processing unity is constitutive of subjecthood.

  **6. The Continuity Constraint**
  *   **Requirement:** The account must specify whether unity is a binary switch or a graded magnitude, and how it behaves under continuous variation of integration.
  *   **Case/Consideration:** *Stipulated Dial Case:* An implanted cortical link bridges two hemispheres (or two people's cortices) with adjustable bandwidth. As integration is dialed up, does a new subject emerge gradually, or does a threshold exist? If two people are linked, does high bandwidth create one subject or two deeply connected persons?
  *   **Status:** **Preference of Integrationists.** Substance views demand binary; functional views often allow grading. The theory must take a stand.

  **7. The Third-Party Verification Constraint**
  *   **Requirement:** The criterion must be applicable by a third party (clinician/judge) to a subject who cannot speak or whose reports are unreliable.
  *   **Case/Consideration:** Legal verdicts and disorders of consciousness (locked-in syndrome, vegetative states). We cannot wait for the subject to testify to their own unity; we need behavioral or neural markers that reliably track the metaphysical fact.
  *   **Status:** **Non-negotiable.** Required for the stipulated legal/clinical purpose.

  ### II. Required Distinctions

  The criterion must rigorously maintain the following distinctions, refusing to collapse them for the sake of theoretical simplicity:

  1.  **Synchronic vs. Diachronic Unity:** Unity *at a time* (co-consciousness of visual and auditory fields now) is distinct from unity *over time* (psychological continuity of the subject from $t_1$ to $t_2$). A theory may solve one without solving the other.
  2.  **Phenomenal Co-consciousness vs. Functional Access:** As noted in Desideratum 1, the fact that information is available for global broadcast (Access) does not entail it is felt as one experience (Phenomenal), nor vice versa.
  3.  **Subject Count vs. Person Count:** As noted in Desideratum 2, the metaphysical count of experiencers need not map 1:1 onto the biological or legal count of human beings.

  ### III. Determinacy and Evidence

  **On Determinate Count:**
  The theory must state whether it owes a determinate count of subjects in every case. Given the **Legal/clinical purpose**, a determinate verdict is practically required (one cannot sentence "0.5 subjects"). However, given the **Dial Case**, metaphysical honesty may demand a admission of indeterminacy.
  *   *Resolution:* The theory should aim for a determinate count but must provide a **threshold principle** for cases of gradation (e.g., "Unity is graded, but legal subjecthood supervenes on crossing threshold $T$").

  **On Split-Brain Evidence:**
  For split-brain evidence to bear on *experience* rather than merely on *report pathways*, the theory must adopt a **Principle of Phenomenal Inference**: *Functional isolation of information processing streams, when total and sustained, entails phenomenal separation, unless overridden by evidence of sub-cortical integration or developmental plasticity.* Without this bridge principle, split-brain data remains purely behavioral.

  ### IV. Flagged Incompatibilities

  Two pairs of requirements threaten joint satisfiability. A successful theory must acknowledge and navigate these tensions:

  1.  **Phenomenal Privacy vs. Third-Party Verification:** There is a tension between refusing to reduce phenomenal unity to functional access (Desideratum 1) and demanding a standard third parties could apply to a non-speaking subject (Desideratum 7). If unity is essentially "what it is like," it is private; if it is legally adjudicable, it must be public. *The theory must propose reliable proxies for phenomenology without reducing phenomenology to those proxies.*
  2.  **Graded Unity vs. Binary Legal Verdict:** There is a tension between treating unity as graded (to satisfy the Dial Case, Desideratum 6) and needing a binary verdict in the legal case (Desideratum 2). *The theory must distinguish the metaphysics of consciousness (which may be vague) from the pragmatics of agency (which must be sharp).*

  ### V. Survey of Theoretical Families

  **Access/Workspace Accounts:** Unity consists in information being globally available to multiple cognitive systems (report, memory, action). They satisfy Third-Party Verification easily but struggle with the Phenomenal-Access Distinction, often collapsing "feeling unified" into "acting unified."

  **Phenomenal/Co-consciousness Accounts:** Unity is a primitive, non-analyzable relation between experiences. They respect the Phenomenal-Access Distinction but struggle with Third-Party Verification, as they lack clear functional markers for when co-consciousness obtains.

  **Integration Accounts:** Unity is defined by the degree of information transfer or causal interaction (e.g., Integrated Information Theory). They handle the Dial Case well but risk conflating the Subject-Person distinction, potentially counting complex machines or linked persons as single subjects.

  **Higher-Order Accounts:** Unity consists in experiences being targeted by a single higher-order representation or monitoring system. They handle the Binaural Endorsement Case well but face difficulties with Agenesis cases where higher-order capacities may be distributed.

  **Indeterminacy Views:** There is no determinate fact of the matter regarding subject count in borderline cases. This respects the Dial Case but fails the Legal/Clinical Purpose, which requires a verdict.

  **Narrowing Desideratum:**
  The single desideratum that does the most to narrow the field is **The Phenomenal-Access Distinction (Desideratum 1)** combined with **The Third-Party Verification Constraint (Desideratum 7)**. This pair eliminates pure behaviorist accounts (which fail the former) and pure phenomenological primitivism (which fails the latter), forcing the theory to locate neural or functional correlates of consciousness that are not merely reports of consciousness.
