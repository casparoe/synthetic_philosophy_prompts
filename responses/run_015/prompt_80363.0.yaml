answer: |-
  Elena stands on a freezing ledge that is visibly cracking beneath her boots; within seconds, the ice will shear off, plunging her into the abyss. Survival requires she leap immediately to one of two identical rock outcroppings positioned equidistant to her left and right. Both rocks offer the same grip, stability, and path to safety; her body is equally balanced, there is no wind, and no psychological bias pulls her toward either side. Staying put guarantees death, while leaping to either rock guarantees life, yet there is absolutely no feature distinguishing the left option from the right.

  View One holds that the overwhelming reason to survive is sufficient to generate action; the agent leaps, and while the selection of left over right is arbitrary, the act itself is rational because the justification lies in the disjunction (left *or* right) rather than a specific conjunct. View Two argues that rational motion requires a comparative justification for *this* specific path over *that* one; without a directional reason, the will lacks a vector, so staying put is the only rational default, even if it leads to disaster. The feature doing the work is the **indifference of the options** relative to the agent's goals, which isolates the necessity of a directional reason from the necessity of action itself. Adding a deadline heightens the cost of inaction but does not break the symmetry between left and right, so it fails to provide a directional reason; however, adding a tiny cost difference (e.g., the left rock is one inch closer) destroys the case entirely by smuggling in the directional reason the setup was designed to exclude.

  View Two comes out badly because it implies rationality mandates self-destruction in symmetric crises, contradicting how agents actually function. A defender of View Two would attack the case by arguing that perfect symmetry is metaphysically impossible; there are always neural fluctuations, air currents, or micro-biases that provide a hidden tiebreaker. This attack lands on the *realism* of the scenario but misses the *philosophical* point: the case is an idealized test of rational structure, not a physics problem. Even if micro-differences exist, the agent is unaware of them, so from the agent's internal perspective, the symmetry holds, and the problem of directional justification remains unsolved.
