          *   (3) Negative reward is a setback (fits 1b).
          *   (4) RPE ($\delta$) drives learning (fits 1c).
          *   (5) Conclusion: Suffering = negative RPE ($\delta < 0$).
      *   **Problematic Consequences (A-E):** Hyperparameter dependence, perfect predictors don't suffer, behavior-independent agony, retroactive editing, inference doesn't count.
