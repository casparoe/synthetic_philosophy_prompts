answer: |-
  The physicist you're trying to recall is **Rolf Landauer**. He coined the slogan "Information is Physical" in a 1991 paper of the same name. Your frustration is well-founded: the slogan is a Rorschach test. It ranges from a tautology to a deep metaphysical claim, and in the context of Maxwell's Demon, it is often used to slide between them.

  Your friend is using the slogan to plug a specific hole in his argument (the infinite ledger), but he needs a much stronger claim than the slogan usually carries to do it. Here is the menu of interpretations, ranked from weakest to strongest, with an assessment of their truth and their utility in your debate.

  ### The Menu: Interpretations of "Information is Physical"

  #### 1. The Substantiation Claim (Weak)
  *   **Claim:** There is no such thing as "information" in the abstract; a bit must always be instantiated by a physical degree of freedom (e.g., a spin, a voltage, ink on paper).
  *   **Status:** **Trivial/True.** No serious physicist or philosopher denies this.
  *   **Role in Debate:** **None.** You and your friend already agree on this. You both acknowledge the ledger is a physical object. This interpretation does no work to block the "infinite ledger" scenario.

  #### 2. The Landauer Principle Claim (Medium)
  *   **Claim:** Logical operations have thermodynamic consequences. Specifically, logically irreversible operations (like erasing a bit to reset memory) must dissipate heat into the environment.
      *   *Equation:* $\Delta S_{env} \ge k_B \ln 2$ per bit erased.
  *   **Status:** **Substantive & Defensible.** This is the standard resolution to the Demon *if* memory is recycled. It is derived from Liouville's theorem and the assumption that the demon is a physical system in thermal equilibrium.
  *   **Role in Debate:** **Against your friend.** This is *your* argument. Your friend is trying to evade this by proposing *never* to erase. This claim does not prevent an infinite ledger; it only penalizes resetting one.

  #### 3. The Storage Cost Claim (Medium-Strong)
  *   **Claim:** Storing information (even without erasure) requires physical resources (energy/volume) to maintain stability against thermal fluctuations. A bit cannot exist without a potential well separating the 0 and 1 states.
  *   **Status:** **Substantive & Defensible.** To keep a memory register from randomizing due to thermal noise, you need an energy barrier. As the ledger grows, the physical system representing it must grow.
  *   **Role in Debate:** **Partial Help.** This implies the ledger has a "mass" or energy cost that scales with $N$ molecules. However, it doesn't strictly forbid an infinite ledger *unless* you add a constraint on total available energy/matter.

  #### 4. The Finitude Claim (Strong)
  *   **Claim:** The universe (or any closed system containing the demon) has a finite number of distinguishable physical states. Therefore, the memory capacity of the demon is strictly bounded.
      *   *Physics:* This relies on the **Bekenstein Bound** or holographic principles ($I \le 2\pi R E / \hbar c \ln 2$).
  *   **Status:** **Substantive but Contingent.** It depends on cosmology and quantum gravity. In classical statistical mechanics with an infinite container, this is false. In our actual universe, it is likely true.
  *   **Role in Debate:** **Crucial.** This is the **only** reading that blocks the infinite ledger. If the universe is finite, the ledger *must* eventually fill, forcing erasure (triggering Landauer's Principle) or halting the demon.

  #### 5. The Ontological Claim (Very Strong)
  *   **Claim:** Information is the fundamental constituent of reality ("It from Bit"). Physical laws are derivative of information-theoretic constraints.
  *   **Status:** **Speculative/Metaphysical.** Associated with John Wheeler and some digital physics advocates. Not required for standard thermodynamics.
  *   **Role in Debate:** **Distraction.** Even if reality is made of information, it doesn't automatically solve the thermodynamic accounting of the Demon without invoking the Finitude Claim (#4).

  ---

  ### Diagnosis of Your Friend's Move

  Your friend is trying to use the slogan to smuggle **Claim #4 (Finitude)** while pretending it follows from **Claim #1 (Substantiation)**.

  1.  **The Loophole:** In the standard formulation of Maxwell's Demon (e.g., in classical stat mech), nothing prevents the demon from having an infinite tape. If the tape is infinite and never erased, the entropy of the gas decreases, the entropy of the memory increases (as it becomes more randomized or filled), but the *total* entropy of the closed system (Gas + Demon) stays constant or increases. The Second Law is saved *globally*, but the demon successfully creates a local temperature difference forever.
  2.  **The Smuggle:** To say the demon *must* stop or erase, you must assert the tape cannot be infinite. Claim #1 ("bits need matter") does not imply Claim #4 ("matter is finite"). You can have infinite matter in an infinite universe.
  3.  **The Verdict:** When your friend said, "Information is physical," and acted like the discussion was over, he was implicitly invoking the **Bekenstein Bound** (Claim #4) without stating it. He assumed that because information is physical, it is subject to the resource constraints of *our specific universe* (finite energy/volume).

  ### Is He Cheating?

  **Yes, but perhaps innocently.**

  *   **If you are doing classical thermodynamics:** The assumption of a finite universe is an external constraint, not a law of thermodynamics. In a classical infinite universe, the "infinite ledger" demon is a valid counterexample to the claim that the Second Law *must* be saved by Landauer erasure. (See: **Earman and Norton**, 1998, who argue that Landauer's Principle presupposes the Second Law rather than proving it, and that the infinite memory loophole is only closed by fiat).
  *   **If you are doing modern physics:** Claim #4 is widely accepted. There is a maximum entropy density for any region of space. Therefore, an infinite ledger is physically impossible *in our world*.

  **How to reply:**
  Tell him: *"You are conflating 'information requires a substrate' with 'the substrate is finite.' I agree information is physical (Claim #1). But unless you assume the universe has finite information capacity (Claim #4), the demon can just keep writing. 'Information is physical' doesn't prove finitude; cosmology does. Are you willing to rest the Second Law on the Bekenstein Bound?"*

  This forces him to admit he is relying on a cosmological premise (finite universe) rather than a purely thermodynamic one, which clarifies exactly what work the slogan was doing.
