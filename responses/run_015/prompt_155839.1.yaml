answer: |-
  # The Identity & Emptiness Decision Tree

  **Instructions:** Answer each node based on your immediate intuition. Do not worry about philosophical consistency yet. Follow the branch that feels most true to your gut.

  ### Node 1: The Synthetic Replacement (Root)
  **Case:** Your memories are slowly replaced by synthetic ones. They feel identical, but they have zero causal link to your actual past.
  *   **(A)** The original mental stream is broken; there is just emptiness where "you" were.
  *   **(B)** A new conventional self picks up the thread; functionally, you continue.
  *   **(C)** There never was an owner of the memories anyway; nothing was lost.

  > **Branching:**
  > *   If **(A)** or **(C)**: Go to **Node 2** (The Ownership Test).
  > *   If **(B)**: Go to **Node 3** (The Boundary Test).

  ---

  ### Node 2: The Ownership Test (Split-Brain)
  **Case:** A surgery separates your hemispheres. Two bodies wake up. Both claim your pre-surgery intentions and memories with equal conviction.
  *   **(A)** Both are deluded. Neither is the original "you" because ownership is an illusion.
  *   **(B)** Both are valid. "You" are a process that can branch; context determines which one counts.

  > **Branching:**
  > *   If **(A)**: Go to **Node 4** (The Blame Test).
  > *   If **(B)**: Go to **Node 6** (The Label Test).

  ---

  ### Node 3: The Boundary Test (Distributed Self)
  **Case:** Your mental state is distributed across three bodies with asynchronous updates. They share data but experience locally.
  *   **(A)** This breaks the self. A person must be a single, localized locus of experience.
  *   **(B)** This works. The self is a pattern of information; location doesn't matter.

  > **Branching:**
  > *   If **(A)**: Go to **Node 5** (The Story Test).
  > *   If **(B)**: Go to **Leaf D**.

  ---

  ### Node 4: The Blame Test (Moral Responsibility)
  **Case:** The "you" from Node 2 (Split-Brain) commits a crime in one body. The other body knows nothing of it.
  *   **(A)** Punishing either is unjust. There is no enduring entity to hold accountable.
  *   **(B)** Punish the specific body that acted. Conventional responsibility tracks the physical cause, not a soul.

  > **Branching:**
  > *   If **(A)**: Go to **Leaf A**.
  > *   If **(B)**: Go to **Leaf B**.

  ---

  ### Node 5: The Story Test (Narrative Continuity)
  **Case:** You wake from deep anesthesia with total amnesia. Your body is the same, but your internal story is reset.
  *   **(A)** You are a new person. The self is the story, and the story ended.
  *   **(B)** You are the same person. The social and biological designation remains despite the memory gap.

  > **Branching:**
  > *   If **(A)**: Go to **Leaf C**.
  > *   If **(B)**: Go to **Leaf B**.

  ---

  ### Node 6: The Label Test (Ultimate vs. Useful)
  **Case:** You understand that "self" is not a findable thing in the brain or body.
  *   **(A)** Then the word "I" is a mistake. It refers to nothing real and should be discarded.
  *   **(B)** The word "I" is a tool. It doesn't need to be "real" to be useful for navigating the world.

  > **Branching:**
  > *   If **(A)**: Go to **Leaf A**.
  > *   If **(B)**: Go to **Leaf B**.

  ---

  ### The Leaves (Outcomes)

  **Leaf A: Hard Reductionist**
  *   **View:** No conventional or ultimate self.
  *   **Summary:** You chose the path of strict emptiness. Ownership is an illusion, responsibility is a mechanical causal chain, and the label "I" is ultimately erroneous.
  *   **Philosophical Proxy:** Eliminitive Materialism / Strict Abhidhamma Reductionism.

  **Leaf B: Two-Truths Conventionalist**
  *   **View:** Empty ultimately, but functional conventionally.
  *   **Summary:** You accept there is no "ghost in the machine," but you maintain that the designation of a person is valid and necessary for ethics and daily life.
  *   **Philosophical Proxy:** Madhyamaka (Prasaṅgika) / Neo-Lockean Functionalism.

  **Leaf C: Narrative Reconstructionist**
  *   **View:** Self is a story we tell.
  *   **Summary:** You ground identity in psychological connectedness. If the story breaks (amnesia/synthetic memory), the self ends. Continuity is key.
  *   **Philosophical Proxy:** Parfitian Reductionism / Psychological Continuity Theory.

  **Leaf D: [Open Slot: Distributed Conventional Self]**
  *   **View:** Self is a non-local pattern.
  *   **Summary:** You accepted that identity can span multiple loci without a central owner.
  *   **⚠️ COHERENCE FLAG:** *This position risks incoherence within standard Dependent Origination.* If the "self" is distributed across async bodies, who experiences the *vipaka* (result) of karma? If Body 1 acts and Body 2 feels the result, does that violate the principle that experience is local? If Body 2 does *not* feel the result, in what sense are they the "same self"?
  *   **Status:** *Theoretically unstable without redefining "experience."*

  ---

  ### ⚠️ Blind Spots & Overlaps (Instructor Notes)

  This tree cannot perfectly separate all schools based on gut intuition alone. Be aware of these convergences:

  1.  **The Conventional/Narrative Overlap (Node 1 & 5):**
      *   Both **Two-Truths (Leaf B)** and **Narrative (Leaf C)** users often select **(B)** at Node 1 ("Conventional self picks up thread").
      *   *Differentiation:* They only separate at Node 5. However, a sophisticated Narrative theorist might argue social designation *is* part of the story, pushing them back to Leaf B. The tree assumes Narrative prioritizes *internal* psychological continuity over *external* social designation.

  2.  **The Reductionist/Two-Truths Overlap (Node 6):**
      *   A **Hard Reductionist (Leaf A)** and a **Two-Truths (Leaf B)** practitioner agree on emptiness.
      *   *Differentiation:* The split relies entirely on the *utility* of language (Node 6). Many Buddhists operate in both modes depending on context (meditation vs. ethics), making this a fluid boundary rather than a hard split.

  3.  **The Distributed Incoherence (Leaf D):**
      *   As flagged, Leaf D is the "trap" node. It tests whether the participant is willing to sacrifice the locality of experience to save the continuity of the pattern. Most traditional Buddhist frameworks will reject this leaf because *vedana* (feeling) and *viññāṇa* (consciousness) arise dependent on a specific sense base, not a cloud network.
