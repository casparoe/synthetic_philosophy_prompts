      *   Step 2: Write a script for "What to do if interrupted." (e.g., "Pause, assess, continue").
      *   Step 3: Do task. (TF interrupts). Follow script.
      *   Step 4: TF interrupts the *script*. (e.g., You can't pause).
      *   Step 5: You need a script for the script.
      *   This illustrates the regress.

      *   *Okay, let's lock this in.*

  10. **Review against constraints:**
      *   20 students? Yes, groups of 4.
      *   75 mins? Yes, timeline fits.
      *   Candy/Credit? Included.
      *   No naming at start? Yes.
      *   Address CS majors? Yes.
      *   Address Deception? Yes.
