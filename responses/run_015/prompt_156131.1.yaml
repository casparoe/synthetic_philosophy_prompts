          *   Activities: Mentorship, challenging projects, community service, reflection on values.
          *   Vibe: Active, not passive.
      *   *Objective List (Parfit/Rawls):* Specific goods are good regardless of feelings.
          *   Items: Knowledge, Friendship, Autonomy, Achievement.
