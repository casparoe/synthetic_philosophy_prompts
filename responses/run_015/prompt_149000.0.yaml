answer: |-
  In *Capital* and the *Grundrisse*, Marx posits that machinery transforms the worker from the operator of a tool into a conscious appendage of an automatic system. This process, termed real subsumption, integrates living labor into fixed capital to maximize surplus value extraction. Established scholarship agrees that for Marx, the "general intellect"—social knowledge objectified in machines—becomes a direct force of production, subordinating living labor. However, whether contemporary algorithmic management constitutes a continuation of this trajectory or a rupture remains fiercely contested. The scenario of "subsumption without replacement," where workers remain essential but are governed by real-time data protocols, tests the limits of Marx's value-theoretic framework. Does the digital interface merely extend the factory's logic, or does it dissolve the boundary between production and reproduction?

  Proponents of continuity argue that algorithmic control represents the logical culmination of real subsumption. Here, the software platform functions as the machinery, and the worker's cognitive and affective responses are the living labor being mined. Scholars in this camp maintain that value is still grounded in socially necessary labor time, merely obscured by digital mediation. Conversely, others suggest a qualitative break, arguing that networked automation dissolves the distinction between labor time and life time, potentially invalidating labor as the sole measure of value. This latter view, often associated with post-workerist thought, contends that when the "general intellect" dominates production so thoroughly, the law of value enters a crisis. It is crucial to note that this claim of a systemic break is interpretive and disputed, not a settled Marxist consensus. The question remains whether value creation has shifted or merely become harder to measure.

  Ultimately, Marx's framework remains robust enough to classify algorithmic subsumption as an intensification of real subsumption rather than a transcendence of it. While the networked nature of management appears novel, the underlying dynamic remains the reduction of living labor to a variable component of constant capital. The worker is not freed from the machine but is more tightly coupled to it via feedback loops. Therefore, this scenario does not escape Marx's value theory but rather exemplifies his prediction that capital would seek to absorb all facets of human activity into the valorization process. The tension lies not in the framework's failure, but in capital's increasing reliance on capturing value from processes that mimic automation while still relying on precarious human labor. The "appendage" status is thus preserved, even if the chain is digital. Consequently, the controversy is less about the validity of Marx's categories and more about the historical specificity of their application. The algorithmic loop does not negate the labor theory of value; it highlights capital's desperate attempt to sustain it amidst rising organic composition of capital.
