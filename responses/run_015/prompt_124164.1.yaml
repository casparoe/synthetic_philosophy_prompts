answer: |-
  Here is a 35-minute battle plan designed for high school juniors. It moves fast, avoids getting bogged down in 16th-century anthropology, and centers your specific argument about epistemic failure.

  ### The Core Sequence (35 Minutes)

  **0:00–0:05 | The Hook: Etymology as Epistemology**
  *   **Action:** Write the word **BARBARIAN** on the board.
  *   **Ask:** "Where does this word come from?"
  *   **Teach:** It's Greek *bar-baros*. It mimics the sound of someone speaking a language you don't understand. To the Greeks, foreign speech sounded like "bar-bar-bar."
  *   **The First Idea That Must Land:** **Labeling is a claim about knowledge, not just morality.** When we call someone a barbarian, we aren't just saying they are "bad"; we are saying their internal logic is *noise* to us. We are admitting we cannot hear their reason.
  *   **Why this first?** If they think "barbaric" is a moral judgment, you're stuck in ethics. If they see it as a *linguistic/epistemic* judgment (I can't understand you), you open the door to ontology.

  **0:05–0:15 | Montaigne's Flip (The Text Summary)**
  *   **Context:** Briefly state Montaigne wrote this in 1580 after meeting three Tupinamba men in France.
  *   **The Argument:** Montaigne notices Europeans call the Tupinamba "savages" for eating the dead. But Montaigne points out Europeans burn people alive for religious differences (Wars of Religion).
  *   **The Pivot:** Montaigne argues the Tupinamba practice is about *honor* and *vengeance* within a specific spiritual framework, whereas European torture is about *pain* and *control*.
  *   **Skip This:** Do **not** discuss Montaigne's "Noble Savage" utopianism or his comparisons to Plato/ideal republics. It eats time and distracts from the epistemic argument. Do **not** get into the historical accuracy of whether the Tupinamba actually did this; treat the text as a philosophical thought experiment.

  **0:15–0:25 | The Ontology Identification Pivot (Your Core Contribution)**
  *   **The Concept:** Explain that before we can judge an act *Good/Bad* (Ethics), we must identify *What It Is* (Ontology).
  *   **The Carrying Example (Not Tupinamba):** Use **Surgery vs. Stabbing**.
      *   *Scenario:* A person takes a knife and cuts open another person's chest.
      *   *Observation:* Physically, the acts are identical.
      *   *Ontology:* In one context, it is "Murder/Assault." In the other, it is "Life-Saving Surgery."
      *   *The Epistemic Failure:* If you walk into an operating room without knowing medical ontology, you see a murder. You label the surgeon "barbaric." Your moral judgment is wrong because your *ontological identification* was incomplete.
  *   **Apply to Montaigne:** When Europeans saw cannibalism, they ontologically identified it as "Hunger + Murder." Montaigne suggests the Tupinamba ontology was "Spiritual Absorption + Honor." Because the European cannot access the Tupinamba internal logic (the "language"), they fail to identify the *being* of the act.
  *   **Key Phrase to Repeat:** "You cannot judge the morality of an act you have not correctly identified."

  **0:25–0:30 | Misconception Management (The Shutdowns)**
  *   *Expect Misconception 1 (Moral Equivalence):* "So you're saying cannibalism is basically the same as surgery?" or "So cannibalism is okay?"
      *   **Shutdown:** "No. I'm saying we lack the data to judge it. Relativism isn't 'everything is equal.' It's 'I don't have the translation key.' If I can't read the language, I can't grade the essay."
  *   *Expect Misconception 2 (Edginess):* "This is just an excuse to be edgy about violence."
      *   **Shutdown:** "Actually, it's the opposite. Calling them 'barbarians' is the lazy, edgy move because it stops inquiry. Demanding we understand the ontology before judging is the harder, more rigorous intellectual work. It demands *more* truth, not less."

  **0:30–0:35 | The Assessment Question**
  *   **Do not ask:** "What did Montaigne say about cannibals?" (Tests memory).
  *   **Do not ask:** "Is cultural relativism good?" (Tests opinion).
  *   **Ask This:**
      > "If we accept that labeling a practice 'barbaric' is an epistemic failure regarding ontology, what specific piece of information must we possess *before* we are ethically permitted to condemn a foreign ritual?"
      >
      > *Target Answer:* We need access to the **internal logic/intent** (the ontology) of the act, not just the physical description of the act.
      >
      > *Why this works:* It forces them to distinguish between the *physical act* (eating flesh) and the *ontological act* (honoring the dead), proving they grasped the "inaccessible information" point.

  ### Teacher's Cheat Sheet

  **1. What idea has to land first?**
  The distinction between **Description** (what the body does) and **Identification** (what the act *is* within a system). If they think "cutting a chest" is inherently "violence," you lose the argument. They must agree that "cutting a chest" is neutral until the ontology (surgery vs. murder) is applied.

  **2. The Carrying Example**
  Stick to **Surgery vs. Stabbing**. It is visceral, immediate, and removes the "cultural distance" that lets them dismiss the Tupinamba as "ancient history." It shows that *we* are the ones who could be misidentified as barbarians if our ontology isn't understood.

  **3. What to Skip in Montaigne**
  *   **Skip:** The long passages where he compares Brazilian customs to French laws specifically (too many details).
  *   **Skip:** His idealization of their lack of private property (distracts into economics/politics).
  *   **Keep:** Only the definition of "Barbarism" and the comparison of *cruelty* (burning vs. eating).

  **4. Handling the "Edgy" Accusation**
  Juniors love to call things "edgy." Pre-empt this. Frame the "Barbarian" label as the *lazy* position. Frame your ontological argument as the *hard* position.
  *   *Script:* "It's easy to call something savage. It's hard to figure out why a smart group of people would do it. Montaigne isn't defending cannibalism; he's defending intelligence."

  **5. Room Setup**
  Sit in a circle. If you stand at a board, it becomes a lecture. If you sit with them, it becomes a "club study session." Keep the energy conversational.

  ### Summary of the Argument Flow for You
  1.  **Barbarian** = "I can't understand your noise." (Epistemic limit)
  2.  **Montaigne** = "Their noise makes more sense than our 'civilized' cruelty." (Ethical flip)
  3.  **Ontology** = "You called it murder because you didn't know it was surgery." (The Mechanism)
  4.  **Conclusion** = "Condemnation without Ontological ID is intellectual laziness." (The Takeaway)
