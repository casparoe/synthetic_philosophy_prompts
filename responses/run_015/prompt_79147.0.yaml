          3.  Diagnostic questions for the group to test if vocabulary is rigged vs. analogy failing on facts, plus one example where it's just a bad analogy (not a trap).
      *   **Constraints:** No bibliography. Flag potential classicist objections.

  2.  **Deconstruct the Thucydides Passages (Book 3, The Mytilenian Debate/Corcyra):**
      *   *Correction/Clarification:* The user says "Book 3, the Corcyra civil war bit." Actually, the famous "stasis" (civil war) description is in Book 3, but it describes Corcyra (Book 3.82-83). The specific quotes provided are indeed from the Corcyra stasis analysis (3.82).
      *   *Passage 1:* "In peace and prosperity..." (3.82.1). War removes necessities, acts as a "rough master," levels characters to fortunes.
      *   *Passage 2:* "Words had to change their ordinary meaning..." (3.82.4-5). Reckless audacity = courage; prudent hesitation = cowardice, etc.
      *   *Relationship:* Passage 1 sets the material/psychological condition (scarcity, fear, survival). Passage 2 describes the *sociolinguistic* consequence. It's not just that people *feel* different; the very framework for discussing action collapses.
      *   *Causality:* Thucydides implies a causal chain. War $\rightarrow$ Scarcity/Fear $\rightarrow$ Breakdown of Norms $\rightarrow$ Corruption of Language. Language isn't just bent; it's weaponized to enforce the new norms.

  3.  **Evaluate the Friend's Claim ("Vocabulary Capture" & Historical Analogies):**
      *   *The Friend's Thesis:* Analogies are self-sealing because they redefine the vocabulary needed to oppose them. "Slow down" becomes "Appeasement."
      *   *Is it in the text?* Thucydides is describing *stasis* (civil war), not *historical analogy* per se. He is describing how political factions destroy shared reality.
      *   *The Leap:* The friend is applying a theory of *internal political discourse* (Corcyra) to *external policy reasoning* (Munich/Vietnam).
      *   *Validity:* It's a creative appropriation, not a literal exegesis. Thucydides isn't talking about using the Peloponnesian War as an analogy for something else; he's talking about how language breaks down *during* the war. However, the mechanism (redefining terms to foreclose debate) is structurally similar to how "Munich" functions.
      *   *Distortion Risk:* A classicist would wince at saying Thucydides is theorizing "historical analogies" here. He is theorizing *stasis* and the breakdown of *nomos* (convention/law). The friend is generalizing a specific pathology of civil war to general policy debate.
      *   *Verdict:* It's a fair *application* of the insight, but a slight *distortion* of the specific subject matter. The insight holds: if you define the situation as "Corcyra," then "moderation" *is* "cowardice." If you define the situation as "Munich," then "negotiation" *is* "surrender."

  4.  **Develop the "Vocabulary Capture" Judgment (Vietnam Example):**
      *   *Standard Objection:* Vietnam isn't like WWII (disanalogy).
      *   *Vocabulary Capture Objection:* Once "Munich" is invoked, the language of diplomacy is pre-corrupted. "Negotiation" isn't just risky; it's semantically equivalent to "betrayal."
      *   *Connection to Thucydides:* In Corcyra, "prudent hesitation" became "cowardice." In Vietnam, "strategic pause" became "losing nerve." The *words* themselves lost the capacity to describe a middle ground.

  5.  **Draft Diagnostic Questions:**
      *   Need to distinguish between "Bad Analogy" (facts don't match) and "Rigged Vocabulary" (language prevents opposition).
      *   *Q1:* Does the analogy allow for a neutral description of the alternative? (If "diplomacy" = "appeasement," it's rigged).
      *   *Q2:* Does the analogy dictate the moral valence of the verbs? (Are we "retreating" or "redeploying"?).
      *   *Q3:* Can the analogy be falsified by events, or does it reinterpret events to fit?
      *   *Example of just a bad analogy:* Comparing a trade dispute to the Cold War. The vocabulary isn't necessarily rigged (you can still talk about tariffs without being a "communist"), but the structural dynamics don't match.

  6.  **Refine and Polish (Self-Correction/Classicist Check):**
      *   *Check:* Did I identify the text correctly? Yes, Book 3.82 (Corcyra).
      *   *Check:* Is the friend wrong? Not entirely, but they are doing "theory building" using Thucydides as a foundation, which is common but technically anachronistic.
      *   *Tone:* Needs to be patient, analytical, not dismissive of the friend but clarifying the text.
      *   *Classicist Wince:* Must flag that Thucydides is talking about *stasis* (factional violence), not *policy debate* in a stable democracy. The stakes in Corcyra were death, not just policy loss. Applying this to a Senate hearing is a reduction in stakes, though the linguistic mechanism might be similar.
      *   *Causality:* Address the user's confusion on scarcity vs. language. It's both. Scarcity drives the fear; fear drives the linguistic shift to justify violence.

  7.  **Final Output Structure:**
      *   **Part 1: The Textual Mechanics.** Break down 3.82.1 vs 3.82.4. Explain the causal link (War $\rightarrow$ Necessity $\rightarrow$ Moral Collapse $\rightarrow$ Linguistic Collapse).
      *   **Part 2: The "Vocabulary Capture" Verdict.** Validate the friend's insight but flag the anachronism. Apply to Vietnam/China loss. Show how it differs from standard "disanalogy."
      *   **Part 3: Diagnostic Questions.** Create tools for the group. Provide the "Bad Analogy vs. Rigged Trap" example.
      *   **Classicist Flags:** Insert specific notes where a specialist would object.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that Thucydides isn't talking about *historical analogy* in the text. He is talking about the *present reality* of the war corrupting language. The friend is using Thucydides to explain how *historical analogy* corrupts language. That's the crucial distinction. The friend is saying "Using 'Munich' creates a Corcyra-like environment." That's the bridge.

  9.  *(Final Review against constraints)*: No bibliography. Concrete examples. Diagnostic questions. Flag classicist objections.

