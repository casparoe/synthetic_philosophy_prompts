answer: |-
  This is a classic problem in the philosophy of social norms, touching directly on the distinction between **Lewisian conventions** (self-sustaining equilibria of expectation) and **imperatives/mandates** (compliance driven by external authority). Your colleague's track record suggests she is a careful theorist, likely influenced by David Lewis's *Convention* (1969) or perhaps Edna Ullmann-Margalit's *The Emergence of Norms*.

  Here is the breakdown of the predictions, my assessment of her underlying principle, a test case to separate them, and a view on the "maturation" of norms.

  ### 1. Predictions for the Startup Case

  The two principles diverge sharply on the startup stand-up meeting.

  *   **Principle 1 (Coordination + Arbitrariness):** This principle looks at the *structure* of the situation.
      *   **Analysis:** There is a coordination problem (the meeting requires everyone to be present to function). There is no uniquely best solution (9:00 a.m. is arbitrary; 9:15 a.m. would work just as well).
      *   **Prediction:** **Convention.** Under this principle, the *source* of the solution (the founder's decree) matters less than the *structural features* of the practice (arbitrary coordination). As long as the practice coordinates behavior on an arbitrary option, it qualifies.

  *   **Principle 2 (Sustained by Common Expectation):** This principle looks at the *psychological motivation* of the participants.
      *   **Analysis:** The prompt states employees attend "because of the founder's rule, not because they independently expect one another to." Their preference for conforming is conditional on avoiding punishment (firing), not conditional on the expectation that peers will conform.
      *   **Prediction:** **Not a Convention.** Under this principle, a practice held together by threat of authority is a *mandate* or *regulation*, not a convention. Conventions must be self-policing through mutual reliance.

  ### 2. Which Principle Is She Running?

  My best guess is that she is running **Principle 2 (Sustained by Common Expectation)**, likely with a background requirement of arbitrariness (to rule out Chess).

  **Why?**
  1.  **Her Stated Definition:** Her "rough" definition explicitly cites the *reason* the practice holds: "because each participant expects the others to do it." This is a causal/psychological claim about the agents' reasons for action, which aligns with Principle 2. Principle 1 is functional; Principle 2 is motivational.
  2.  **The Dinner Verdict:** She rejected the dinner habit because "each person simply chooses for herself." This highlights a lack of *interdependence*. In the startup case, there is interdependence (we need to meet), but the *source* of the conformity is external (the founder). If she were running Principle 1, the Dinner case might be trickier (is there a loose coordination benefit to eating together?), but her rejection focuses on the lack of mutual reliance.
  3.  **The Nature of "Convention":** In the philosophy of norms, the distinction between a *law/decree* and a *convention* is almost always drawn at the line of enforcement. A traffic light is a convention only when I stop because I expect *you* to stop (and we crash if we don't), not merely because I expect a *police officer* to ticket me. Since your description of the startup case explicitly negates the mutual expectation ("not because they independently expect one another to"), it is designed to fail the Lewisian test.

  **Verdict:** She will likely classify the startup meeting as **Not a Convention**. She views it as a **mandate** that *mimics* a convention structurally but lacks the normative machinery (mutual expectation) that defines the concept.

  ### 3. A Case to Separate the Principles

  To definitively prove which principle she is using, you need a case that satisfies the **Coordination/Arbitrariness** condition (Principle 1) but fails the **Expectation** condition (Principle 2).

  **The Case: The "Mob-Enforced Cartel"**
  Imagine a group of competing gas station owners in a small town. They all agree to sell fuel at $5.00/gallon.
  *   **Coordination/Arbitrariness:** There is a coordination problem (price wars hurt everyone), and the price is arbitrary ($5.10 would work too).
  *   **Enforcement:** They do not maintain this price because they trust each other. They maintain it because a local crime syndicate has threatened to burn down the station of anyone who undercuts the price.
  *   **Expectation:** Each owner complies solely due to fear of the syndicate, not because they expect the *other owners* to comply.

  **The Separation:**
  *   **Principle 1** classifies this as a **Convention** (It solves a coordination problem with an arbitrary solution).
  *   **Principle 2** classifies this as **Not a Convention** (It is sustained by external threat, not common expectation of convergence among the participants).

  If she calls this a convention, she is prioritizing structure (P1). If she calls it a coercion/racket, she is prioritizing expectation (P2).

  ### 4. On Maturation and Normative Genesis

  You asked whether a practice held up by enforcement can mature into a genuine convention, and whether this should change her ruling.

  **The Philosophical View:**
  Yes, absolutely. This is a standard trajectory in norm emergence (often discussed by Lewis and Ullmann-Margalit).
  1.  **Phase 1 (Decree):** The founder imposes 9:00 a.m. Compliance is based on fear. (Not a convention).
  2.  **Phase 2 (Habit/Precedent):** The founder leaves or stops checking. People continue showing up at 9:00 a.m. because "that's how it's always been done."
  3.  **Phase 3 (Convention):** People show up at 9:00 a.m. because they expect *their colleagues* to be there, and the meeting fails if they aren't. The normative force has shifted from *external authority* to *mutual reliance*.

  **Should this change her ruling?**
  **No.** Classification should be **synchronic** (based on current status), not **diachronic** (based on history or potential).
  *   **Reasoning:** If you classify the startup rule as a convention *now* because it *could* become one later, you lose the ability to distinguish between a free-standing social norm and an authoritarian order. The mechanism of compliance (fear vs. trust) has real-world implications for how stable the norm is and how it reacts to shocks (e.g., if the founder leaves, a mandate collapses; a convention persists).
  *   **Recommendation:** Advise her to classify it as **"Not a Convention (currently)"** but acknowledge it as a **"Proto-Convention"** or **"Potential Convention."** This preserves the conceptual clarity of her definition (Principle 2) while acknowledging the dynamic nature of norm genesis that you are studying. It allows you to track the *transition* from mandate to convention without blurring the categories.

  ### Summary for Your Colleague
  When you present your case, frame it like this:
  *"I have a case that is structurally arbitrary and coordinates action, but the compliance is driven by authority rather than mutual expectation. If you classify this as a convention, you are prioritizing the functional outcome (Principle 1). If you classify it as a mandate, you are prioritizing the normative source (Principle 2). Given your definition emphasizes why the practice 'holds,' I suspect you'll say it's not a convention yet, but I want to confirm if you allow for 'enforced conventions' that haven't yet internalized the expectation."*

  This shows you understand the stakes and invites her to clarify the boundary condition without accusing her of inconsistency.
