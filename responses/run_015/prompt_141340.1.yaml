answer: |-
  ### 1. Theoretical Correction

  You are correct about the consequence of **Supervaluationism**: because it preserves classical logic, the Law of Excluded Middle ($P \lor \neg P$) holds. Therefore, the sentence "Neither $P$ nor $\neg P$" is logically false, not indeterminate.

  **However,** your examples ("dusk nor night," "elderly or no longer young") are typically **contraries**, not contradictories. "Night" and "Dusk" do not exhaust the possibilities (there is Twilight). "Bald" and "Hairy" do not exhaust the possibilities (there is thinning).
  *   **The Fix:** If you write "Neither $P$ nor $\neg P$" (e.g., "Neither bald nor not bald"), Supervaluationism renders this false. If you write "Neither $P$ nor $Q$" where $P$ and $Q$ are contraries (e.g., "Neither bald nor hairy"), it can be true.
  *   **For the Legal Reader:** You cannot tell him "It is indeterminate" without specifying the logic. You must tell him: *"This sentence asserts a truth-value gap. In this fiction, the predicate does not divide the world exhaustively."* If you use the Reporter to say "There is no fact of the matter," you are asserting **Ontic Indeterminacy**, which overrides the logic of the predicates.

  ### 2. The Procedure (The "Vagueness Protocol")

  **Goal:** Determine the truth-commitment of a vague sentence.
  **Time:** 5 Minutes.
  **Operator:** Copy Editor (CE), with Author (A) and Legal Reader (LR) hand-offs.

  **Step 1: The Filter (Ignorance vs. Vagueness)**
  *   **Question:** Is the uncertainty due to missing information (e.g., "The file was lost") or word meaning (e.g., "The file was 'large'")?
  *   **If Missing Info:** Mark as **Epistemic**. Stop. (No philosophical commitment).
  *   **If Word Meaning:** Proceed to Step 2.
  *   **Trap:** If the sentence relies on ambiguity (e.g., "bank" of river vs. money), flag for standard copy-editing and **Stop**.

  **Step 2: The Source (Who speaks?)**
  *   **Question:** Is this the Narrator, a Character (including Free Indirect Style), or the Reporter?
  *   **If Character:** Mark as **Subjective**. The truth value is limited to the character's perspective. **Stop.** (LR accepts this as character voice, not world fact).
  *   **If Narrator or Reporter:** Proceed to Step 3.

  **Step 3: The Reporter Override**
  *   **Question:** Is there a marginal note from the Reporter attached to this scene or predicate?
  *   **If Yes:** The Reporter's note is a **Stipulative Precisification**. It fixes the truth value.
      *   *Action:* Check if the note resolves the vagueness (e.g., "For this record, 'night' begins at 9 PM").
      *   *If Resolved:* Mark as **Stipulated Fact**. **Stop.**
      *   *If Note says "No fact of the matter":* Mark as **Ontic Indeterminacy**. Pass to **Author** (Step 5).
  *   **If No:** Proceed to Step 4.

  **Step 4: The Logic Check (Contraries vs. Contradictories)**
  *   **Question:** Does the sentence assert a gap ("Neither... nor...") between two terms?
  *   **If No:** (e.g., "He was bald.") Mark as **Standard Vague**. **Stop.**
  *   **If Yes:** Are the terms exhaustive opposites ($P$ and $\text{not-}P$) or distinct categories ($P$ and $Q$)?
      *   *Test:* Can you imagine a third option? (e.g., Twilight between Dusk/Night).
      *   **If Third Option Exists (Contraries):** Mark as **Gap-True**. **Stop.**
      *   **If No Third Option (Contradictories):** (e.g., "Neither true nor false," "Neither bald nor not bald").
      *   **Action:** **HALT.** Pass to **Author**. This sentence is logically risky under Supervaluationism.

  **Step 5: Author Decision (Values & Logic)**
  *   **Question:** Do you intend this to be a logical contradiction (to show confusion) or an ontological gap (the world is fuzzy)?
  *   **If Ontological Gap:** You must instruct the Legal Reader that this fiction operates on **Paracomplete Logic** (gaps allowed) OR rely on the Reporter's authority to define the gap.
  *   **If Epistemic:** Rewrite to imply ignorance ("No one knew if...") rather than negation ("It was not...").

  ---

  ### 3. Copy Editor's One-Page Checklist

  **PASSAGE VAGUENESS CHECK**

  1.  **Is it just missing info?** (e.g., "We didn't know the time.")
      *   [ ] Yes → Mark **Epistemic**. DONE.
      *   [ ] No → Go to 2.
  2.  **Is it a word meaning issue?** (e.g., "It was 'late'.")
      *   [ ] No (It's ambiguous) → Standard Edit. DONE.
      *   [ ] Yes → Go to 3.
  3.  **Who is speaking?**
      *   [ ] Character (or thoughts) → Mark **Subjective**. DONE.
      *   [ ] Narrator / Reporter → Go to 4.
  4.  **Is there a Reporter Note?**
      *   [ ] Yes, it defines the word → Mark **Stipulated**. DONE.
      *   [ ] Yes, it says "No fact of the matter" → **PASS TO AUTHOR**.
      *   [ ] No → Go to 5.
  5.  **Does it say "Neither X nor Y"?**
      *   [ ] No → Mark **Standard Vague**. DONE.
      *   [ ] Yes → Are X and Y opposites like "True/False" or "Bald/Not-Bald"?
          *   [ ] No (e.g., "Dusk/Night") → Mark **Gap-True**. DONE.
          *   [ ] Yes → **PASS TO AUTHOR**. (Logical Risk).

  **TEST LINES (Apply to yourself to check understanding):**
  1.  *"He was tall."* → **Standard Vague**. (No gap asserted).
  2.  *"She was neither tall nor short."* → **Gap-True**. (Medium exists).
  3.  *"It was neither true nor not true."* → **PASS TO AUTHOR**. (Logical contradiction risk).
  4.  *"I didn't know if it was night."* → **Epistemic**. (Ignorance, not vagueness).

  ---

  ### 4. Operational Notes

  **Higher-Order Vagueness (Borderline of a Borderline)**
  The procedure cannot resolve this. If a passage hinges on whether a "borderline case" is itself "borderline," the CE must flag it as **High Complexity** and pass it to you. The procedure treats all vagueness as first-order for the sake of speed. You must handle the recursion manually.

  **Consistency of Stance**
  You may vary the stance (Epistemic vs. Ontic) from passage to passage *only if* marked by a shift in voice (e.g., Character vs. Reporter). If the Narrator asserts an ontological gap in Chapter 1 and an epistemic limit in Chapter 2 without explanation, the Legal Reader will flag this as inconsistency. The Procedure forces you to identify the *source* of the claim; consistency is required per *source*, not necessarily per book.

  ---

  ### 5. Application to Draft Passages

  **Passage 1:** *"It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which."*
  *   **Step 1 (Filter):** Word meaning (Dusk/Night).
  *   **Step 2 (Source):** Narrator (descriptive) + Character (Sergeant).
  *   **Step 3 (Reporter):** No note.
  *   **Step 4 (Logic):** "Neither Dusk nor Night." Are these contradictories? No. Twilight exists.
      *   *Result:* **Gap-True**.
  *   **Step 5 (Author Check):** The second clause ("no one... could have said which") introduces Epistemic uncertainty onto an Ontic gap.
  *   **Procedure Output:** **SAFE.** The CE marks this as **Gap-True**.
  *   **Warning:** You expected to not like the result. The procedure says it is logically safe *provided* "Dusk" and "Night" are treated as contraries. If your Legal Reader argues "Night = Not-Dusk," you must provide a glossary definition. The risk is not logic, but definition.

  **Passage 2:** *Reporter's Note: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say."*
  *   **Step 1 (Filter):** Word meaning (Sound Mind).
  *   **Step 2 (Source):** Reporter.
  *   **Step 3 (Reporter):** Yes. Note says "No fact of the matter."
  *   **Procedure Output:** **PASS TO AUTHOR.**
  *   **Reason:** The CE cannot determine the Legal Reader commitment here. This is an **Ontic Indeterminacy** claim.
  *   **Your Decision:** You must tell the Legal Reader: *"This is a stipulation of Institutional Truth. The predicate 'sound mind' has no extension outside of medical verdict in this fiction."* This is a value/world-building decision, not a copy-edit.

  **Passage 3:** *"The woman on the far pavement was elderly, or at any rate no longer young."*
  *   **Step 1 (Filter):** Word meaning (Elderly/Young).
  *   **Step 2 (Source):** Free Indirect Style (Narrator filtering Character perception).
  *   **Step 3 (Reporter):** No note.
  *   **Step 4 (Logic):** "Elderly or... no longer young." This is a hedge, not a gap claim.
  *   **Procedure Output:** **Subjective.**
  *   **Reason:** FID counts as Character voice for truth-commitment purposes.
  *   **Result:** CE marks **Subjective**. No commitment to objective truth required. Legal Reader accepts this as the character's uncertainty, not the world's indeterminacy.

  ---

  ### 6. What The Procedure Cannot Do

  1.  **It cannot resolve "No Fact of the Matter."** When the text asserts ontological indeterminacy (Passage 2), the procedure halts. It cannot generate the justification for the Legal Reader; it only flags that one is needed. You must write the memo to him.
  2.  **It cannot police Higher-Order Vagueness.** If you write, "It was borderline whether it was borderline dusk," the CE will mark it **Standard Vague** or **High Complexity**. She cannot verify the logic of the recursion. You must review these manually.
  3.  **It cannot fix Contradictory Gaps.** If you write "Neither bald nor not bald," the procedure tells you to stop. It does not tell you *how* to rewrite it. You must choose: either change to contraries ("Neither bald nor hairy") or accept the logical falsehood as a stylistic device (and warn the Lawyer).
  4.  **It cannot enforce World-Consistency.** The procedure checks local consistency (Source/Reporter). It cannot check if Chapter 1's "Ontic Gap" contradicts Chapter 10's "Epistemic Limit" unless the CE reads the whole book as one passage. You are responsible for the global metaphysics.

  **Final Advice:** The procedure protects you from *logical embarrassment* (Passage 1) and *attribution errors* (Passage 3). It does not protect you from *metaphysical commitment* (Passage 2). That is the price of writing a book about borderline cases: someone must decide where the border lies, even if that decision is "there is no border." The procedure ensures that decision is yours, not an accident of instinct.
