      *   *Actually, the best advice:* If you want to assert indeterminacy, use the operator "It is indeterminate whether P." Do not assert "Neither P nor not-P" as a fact of the world unless you are using a paracomplete logic (which the Lawyer won't accept).
      *   *Wait, the Reporter says:* "There was no fact of the matter." This is the operator "It is indeterminate." This is safe.
