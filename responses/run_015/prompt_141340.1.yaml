          2.  **Legal Reader (LR):** Needs to understand the "commitment" of sentences in language he accepts (truth values, indeterminacy types, accountability).
          3.  **Theoretical Framework:** The user outlines two views: Epistemicism (sharp boundary, unknown) vs. Supervaluationism (many precisifications, truth = true on all). The user is worried about Supervaluationism making "Neither P nor not-P" *false* (because $P \lor \neg P$ is a tautology on all precisifications).
          4.  **Narrative Device:** A "Reporter" character who adds marginal notes that act as *stipulative precisifications* (sharpenings).
          5.  **Deliverables:**
