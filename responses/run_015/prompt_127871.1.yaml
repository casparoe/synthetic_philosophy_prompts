answer: |-
  Your intuition is correct. This isn't just a moral quibble about "honesty is the best policy." Your friend is proposing a strategy that attacks the very infrastructure required for collective action to function.

  While her quote—"politics is about creating reality, not reporting it"—sounds radical and pragmatic, it confuses **political framing** with **factual fabrication**.

  Here is a breakdown of why this strategy is not only ethically fraught but strategically dangerous, and why your concern about eroding the "shared ground" of politics is philosophically sound.

  ### 1. The Distinction Between Framing and Fabrication
  Your friend is right that politics involves *creating* reality. When organizers say, "We are a community, not just customers," they are creating a social reality that didn't exist before. This is **framing**. It interprets facts to build power.

  However, what she is proposing is **fabrication**. She isn't reinterpreting a filing; she is inventing one.
  *   **Framing:** "The landlord's recent repairs show he is preparing to push us out." (Interpretation of ambiguous facts).
  *   **Fabrication:** "The landlord has filed eviction notices." (A verifiable falsehood).

  Politics requires a shared baseline of factual truth to debate interpretations. If you remove the baseline, you don't get "created reality"; you get chaos. As political theorist Hannah Arendt argued in *Truth and Politics*, factual truths are the ground upon which we stand. If you lie about facts (like court filings), you aren't changing the world; you are removing the floor everyone is standing on.

  ### 2. Trust is the Currency of Organizing
  Tenant unions run on a specific type of capital: **solidarity trust**.
  *   **High-Risk Verification:** Eviction filings are public records. In the age of digital court dockets, it takes a tenant five minutes to verify your friend's claim.
  *   **The Collapse:** If even one tenant checks the records and finds nothing, your friend isn't just caught in a lie; she is revealed as a manipulator. The narrative shifts from "The Landlord vs. Us" to "The Union Leader vs. Us."
  *   **The Aftermath:** Once trust is broken in a vulnerable community, it is almost impossible to rebuild. If the landlord *does* try to evict someone six months from now, no one will believe the union's warning. You have burned the warning system to start a fire.

  ### 3. Coordination Requires Common Knowledge
  You mentioned that collective action needs a "stable world to act in." In game theory and political science, this is the problem of **common knowledge**.
  For a group to act together, everyone needs to know $X$, and everyone needs to know that *everyone else* knows $X$.
  *   If the basis for action is a lie, the coordination is fragile.
  *   If tenants organize based on the fear of immediate eviction, they might make rash decisions (e.g., withholding rent when they aren't legally protected, or moving out prematurely).
  *   When the material reality (no eviction notice) clashes with the organizational reality (we are being evicted), the collective action fractures. People who acted on the lie feel betrayed; people who knew the truth feel alienated.

  ### 4. The "Retrospective Truth" Fallacy
  Your friend argues: *"If we win, the lie becomes true in retrospect—there never was an eviction."*
  This is a dangerous rewriting of history.
  *   **Process Matters:** In organizing, *how* you win determines what you win. If you win through manipulation, you build a culture of manipulation. The union becomes a top-down operation where leaders feed tenants whatever narrative suits the moment, rather than a democratic body where members assess risks together.
  *   **The Precedent:** If the lie "works," she validates the tactic for herself and others. Next time, the stakes might be higher, or the lie harder to debunk. It normalizes authoritarian leadership under the guise of urgency.

  ### 5. Strategic Vulnerability
  From a purely Machiavellian perspective, this is a bad move.
  *   **Landlord Counter-Attack:** The landlord can easily produce the court docket showing zero filings. He can then paint the union as a group of radical liars trying to scam him or disrupt the building without cause. This gives him moral and legal high ground.
  *   **Legal Liability:** Depending on jurisdiction, spreading false information to induce fear or disrupt contracts could expose the union (or your friend personally) to legal liability for slander, interference with business, or fraud.

  ### 6. The "Shared Ground" Argument
  Your deepest concern is that this erodes the shared ground that makes politics work. This aligns with the concept of the **Epistemic Commons**.
  Just as we need a clean environment to live, we need a clean information environment to govern ourselves.
  *   **Politics is Negotiation:** Politics is the process of negotiating conflicting interests based on a shared understanding of the situation.
  *   **Lying Ends Negotiation:** If one side (even the "good" side) treats facts as optional, negotiation becomes impossible. It becomes pure warfare. If tenants cannot trust their own leaders, they retreat into individualism. They stop acting as a *class* and start acting as isolated individuals trying to survive the misinformation.

  ### Conclusion
  Your friend is treating truth as a **tool**, but in organizing, truth is the **terrain**.

  You can fight on difficult terrain, but if you blow up the ground beneath your own feet, you lose. Her strategy might generate a spike in adrenaline (fear), but it mortgages the union's long-term credibility for short-term urgency.

  **A Better Alternative:**
  She can achieve the urgency without the lie.
  *   *Truth:* "The landlord has not filed yet, but his actions (renovations, harassment, market rates) indicate he is preparing to clear the building. We need to organize *before* the papers are filed, because once they are, it's too late."
  *   *Why this works:* It is verifiable, it creates urgency (pre-emptive action), and it builds trust because it treats the tenants as adults capable of understanding risk.

  Your friend's view that treating facts as "sacred texts" is naive is partially right—facts should be interrogated. But treating facts as **playdough** is not sophistication; it's nihilism. Politics requires a world we can all point to and say, "That is there." If you remove that, you don't have politics anymore; you have propaganda.
