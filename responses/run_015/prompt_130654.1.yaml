      *   *Is the user reinventing "Relaxed Bell Inequalities"?* Yes, partially. I need to mention that quantifying MI is known, but the *experimental gradient* based on RNG type is the novel (and flawed) part.
      *   *Is there any scenario where the user is right?* If the SD mechanism involves some sort of dynamical decoherence of the correlation over time. But that requires a specific model.

