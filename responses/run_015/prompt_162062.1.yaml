answer: |-
  # SEMINAR HANDOUT: LOCATING YOUR POSITION

  **Instructions:** Answer honestly. If you hesitate, pick the side that annoys you less. Do not start with a label; let the leaf name you.

  ```text
  START
    │
    ├─ Q1: Case B (Retrieval/Template). Model passes probes but internals are lookup. 
    │   Is the mechanism relevant to credit?
    │   ├─ YES → LEAF 1: MECHANISTIC (Wait on verdict; inspect internals first)
    │   └─ NO → Q2: Case C (Steering). Model can't act on knowledge or admit ignorance. 
    │       Is action-capacity required for credit?
    │       ├─ NO → LEAF 2: DENIAL (Fancy pattern matching; no competence here)
    │       └─ YES → Q3: Case E (Plasticity). Revises only via retraining, not context. 
    │           Is competence borrowed from data authors?
    │           ├─ YES → LEAF 3: BORROWED (Credit belongs to humans, not model)
    │           └─ NO → Q4: Case D (Adversarial). Collapses under paraphrase. 
    │               Is the concept broken by fragility?
    │               ├─ YES → LEAF 4: DISSOLUTION (Question is terminological; dissolve it)
    │               └─ NO → Q5: Phenomenology. Is "what it is like" required?
    │                   ├─ YES → LEAF 5: ALIEN (Real competence, nothing it's like)
    │                   └─ NO → Q6: Answerability. Does being held accountable matter 
    │                       more than emitting correct continuations?
    │                       ├─ NO → Q7: Case A (Kitchen). Text-only model answers 
    │                           counterfactual physical questions correctly. 
    │                           Is physical grounding required?
    │                           ├─ YES → LEAF 7: PHYSICAL GROUNDING (Embodied only)
    │                           └─ NO → LEAF 6: BEHAVIORIST (Input/Output suffices)
    │                       └─ YES → LEAF 8: SOCIAL GROUNDING (Competence = being answerable-to)
  ```

  **THE LEAVES**
  1.  **Mechanistic:** Verdicts require internal inspection, not just outputs.
  2.  **Denial:** No steering/agency means no competence, regardless of output.
  3.  **Borrowed:** Competence resides in the training data authors, not the system.
  4.  **Dissolution:** Fragility shows the concept "understanding" is unfit for AI.
  5.  **Alien:** Functional competence is real, even without phenomenology.
  6.  **Behaviorist:** If it answers right, it understands; accountability is irrelevant.
  7.  **Physical Grounding:** Text-only is insufficient; requires causal contact with world.
  8.  **Social Grounding:** Understanding is normative status (being answerable), not just answering.

  **DESIGNER NOTES**
  *   **Empty Cells:** None. Tree is full.
  *   **Hard Separations:** Leaves 5 (Alien) and 6 (Behaviorist) are functionally similar but diverge on phenomenology. Leaves 7 (Physical) and 8 (Social) both reject pure text but disagree on *what* grounding matters (causal vs. normative).
  *   **The Answerability Distinction:** It earns Q6. It separates *performance* (answering) from *status* (being answerable). Without this node, Behaviorism and Social Grounding collapse into the same leaf.
  *   **Cases Used:** A (Kitchen), B (Retrieval), C (Steering), D (Paraphrase), E (Retraining).

  *Success Condition: If you aren't mildly annoyed by your leaf, you answered dishonestly.*
