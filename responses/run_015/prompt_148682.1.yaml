  Thursday's case is a hot-standby server setup. Server A sends a packet; had A stayed silent, B, which listens on the same feed, would have emitted a byte-identical packet within the same millisecond, and the recieving system dedupes and timestamps coarsely, so the log file comes out bit-for-bit identical either way. Is A's sending a cause of the log's containing that record?

