  # 1. The Space Before the Names

  **Axis 1: Affective Reality.** Is the sadness genuinely unpleasant during the experience? (Yes / No, it is neutral or pleasurable).
  **Axis 2: Fictional Shield.** Is the unreality of the events essential for the value? (Yes / No).
  **Axis 3: Temporal Locus.** Is the primary value realized *during* the viewing or *after* the tension resolves? (During / After).
  **Axis 4: Integration.** Is the sadness a means to an end, a constituent part of the end, or irrelevant to the end? (Means / Part / Irrelevant).

  *Critique:* A fifth axis often proposed is **Objectivity** (Is the value in the work or the viewer?). I reject this as spurious for sorting purposes; every viewer locates value somewhere, and forcing a choice between "work" and "viewer" creates false binaries (e.g., insight requires both). Dropping it costs the ability to distinguish pure formalism from pure sentimentalism, but those are captured by Axis 4 (Integration) and Axis 1 (Reality) combined.

  # 2. The Tree

  **Branch Nodes (6):**
  1.  Is the sadness itself painful while you feel it?
  2.  Would you feel the same value if you knew it was real news?
  3.  Do you feel better primarily because the tension is gone?
  4.  Is the sadness necessary to learn something true?
  5.  Does the beauty of the making turn the pain into something else?
  6.  Are you watching to feel something about yourself?

  **Leaves (10):**

  1.  **Conversionism** (Tolerated Price)
      *   *Position:* Sadness is a genuine cost paid for other artistic goods.
      *   *Awkward Commitment:* You would prefer the same film without the sadness if the other goods remained.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: During] [Integration: Means]
      *   *Probes:* (a) No, needs narrative goods. (b) Yes, if goods present. (c) Bittersweet (less cost). Dose: Less is better. (d) No, goods missing.

  2.  **Psychical Distance** (Defused)
      *   *Position:* Sadness is felt but rendered safe by the frame.
      *   *Awkward Commitment:* You are not actually suffering, only simulating it safely.
      *   *Coordinates:* [Unpleasant: No] [Shield: Yes] [Locus: During] [Integration: Part]
      *   *Probes:* (a) Yes, music provides frame. (b) No, real suffering breaks frame. (c) Devastating (frame holds). Dose: Ceiling exists. (d) No, frame broken by cheapness.

  3.  **Pretend Theory** (Imagination Only)
      *   *Position:* The emotion is not really felt, only undergone in imagination.
      *   *Awkward Commitment:* You are never actually sad, only pretending to be.
      *   *Coordinates:* [Unpleasant: No] [Shield: Yes] [Locus: During] [Integration: Irrelevant]
      *   *Probes:* (a) Yes, imagination works. (b) No, real pain stops pretense. (c) Irrelevant. Dose: Irrelevant. (d) Yes, pretense works regardless.

  4.  **Formalism** (Manner Transforms)
      *   *Position:* The passion is turned into pleasure by the manner of presentation.
      *   *Awkward Commitment:* A badly made tragedy offers no value, however true.
      *   *Coordinates:* [Unpleasant: No] [Shield: No] [Locus: During] [Integration: Part]
      *   *Probes:* (a) Yes, form carries it. (b) Yes, if well-made. (c) Devastating (more form). Dose: More is better. (d) No, manner is cheap.

  5.  **Meta-Response** (Enjoyment of Response)
      *   *Position:* What is enjoyed is one's own capacity to respond.
      *   *Awkward Commitment:* The film matters less than your proof of sensitivity.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: During] [Integration: Means]
      *   *Probes:* (a) Yes, tests sensitivity. (b) Yes, tests empathy. (c) Devastating (tests depth). Dose: More is better. (d) Yes, still moved.

  6.  **Organic Unity** (Constituent)
      *   *Position:* The unpleasant episode is a constituent of an overall valuable experience.
      *   *Awkward Commitment:* You cannot remove the pain without destroying the value.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: During] [Integration: Part]
      *   *Probes:* (a) Yes, if unified. (b) Yes, if unified. (c) Devastating (necessary). Dose: Optimal fit. (d) No, unity broken.

  7.  **Cognitiveism** (Understanding)
      *   *Position:* The good is a piece of understanding the work affords, with sadness as vehicle.
      *   *Awkward Commitment:* You would swap the sadness for a lecture if the insight remained.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: After] [Integration: Means]
      *   *Probes:* (a) No, needs proposition. (b) Yes, insight gained. (c) Bittersweet (clearer lesson). Dose: Ceiling (clarity limit). (d) No, insight shallow.

  8.  **Catharsis** (Homeostatic)
      *   *Position:* The good is a homeostatic release or settling after tension.
      *   *Awkward Commitment:* The sadness itself is worthless; only the relief matters.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: After] [Integration: Means]
      *   *Probes:* (a) Yes, builds tension. (b) Yes, but risky. (c) Devastating (more release). Dose: More is better. (d) Yes, still releases.

  9.  **Vitalism** (Custom: Feeling Alive)
      *   *Position:* Sadness confirms one's capacity to feel intensely.
      *   *Awkward Commitment:* You seek pain to avoid numbness, not for art's sake.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: During] [Integration: Part]
      *   *Probes:* (a) Yes, feels intense. (b) Yes, very intense. (c) Devastating. Dose: More is better. (d) Yes, still intense.

  10. **Compassion** (Custom: Ethical Connection)
      *   *Position:* Sadness is the cost of connecting with another's suffering.
      *   *Awkward Commitment:* You value the suffering person over the art object.
      *   *Coordinates:* [Unpleasant: Yes] [Shield: No] [Locus: During] [Integration: Part]
      *   *Probes:* (a) No, needs subject. (b) Yes, highest value. (c) Devastating (honors loss). Dose: Realistic fit. (d) No, exploitative.

  # 3. Four Probes (Verdicts embedded in Leaves above)

  *Note: Verdicts summarized in Leaf data above for compactness. Key distinctions:*
  *   **(a) Music:** Distinguishes Cognitive (No) from Formalist/Vitalist (Yes).
  *   **(b) Nonfiction:** Distinguishes Distance/Pretend (No) from Cognitive/Compassion (Yes).
  *   **(c) Ending/Dose:** Distinguishes Catharsis/Vitalism (More/Devastating) from Conversion/Cognitive (Less/Bittersweet).
  *   **(d) Cheap Art:** Distinguishes Formalist/Organic (No) from Pretend/Meta-Response (Yes).

  # 4. The Quiz

  **Instructions:** Choose the option that best fits your actual experience, not how you think you *should* feel.

  1.  **Instrumental Music:** A wordless adagio gives you a lump in the throat.
      *   A) It moves me just as much as a sad film scene.
      *   B) It feels empty without a story to attach to.
      *   C) It relaxes me, but doesn't make me sad.
  2.  **Real Suffering:** A documentary shows real pain, filmed beautifully.
      *   A) I can appreciate it just like a fiction film.
      *   B) It feels wrong to enjoy this; I look away.
      *   C) It hits harder and feels more important than fiction.
  3.  **The Ending:** Two versions of a film: one ends in total loss, one in mild hope.
      *   A) I prefer the total loss; it feels more complete.
      *   B) I prefer the hope; the loss is too heavy for a Tuesday.
      *   C) I prefer the total loss, but only if I'm in the right mood.
  4.  **Manipulation:** A film makes you cry but feels cheap and manipulative.
      *   A) The crying still feels good; I got what I came for.
      *   B) I feel cheated; the tears don't count.
      *   C) I feel ashamed of myself for crying.
  5.  **Aftermath:** Immediately after the credits roll, you feel:
      *   A) Drained, but clear-headed and calm.
      *   B) Still heavy, but richly so.
      *   C) Ready to talk about what it meant.
  6.  **Truth vs. Beauty:** A sad scene is factually unrealistic but beautifully shot.
      *   A) The beauty saves it; I don't care about the facts.
      *   B) It ruins the scene; I can't learn from a lie.
      *   C) It doesn't matter; I know it's pretend.
  7.  **Safety:** Would you watch this if the events were happening next door?
      *   A) No, that would be horrific, not art.
      *   B) Yes, helping them would be more important.
      *   C) Yes, I need to witness it.
  8.  **Focus:** When you cry at a film, you are thinking about:
      *   A) The character's plight.
      *   B) How sensitive you are to the plight.
      *   C) The universal truth of the plight.
  9.  **Intensity:** If the film could make you twice as sad without breaking:
      *   A) I would watch it; I want to feel it all.
      *   B) I would skip it; once is enough.
      *   C) I would watch it; the release would be greater.
  10. **Self-Report:** Why do you come to these sad films?
      *   A) To understand something about life.
      *   B) To feel something intense.
      *   C) To experience a great work of art.

  # 5. The Scoring Key

  **Mapping Logic:**
  Tally responses into three buckets: **A (Form/Feeling)**, **B (Truth/Safety)**, **C (Insight/Release)**.
  *   **Leaf 1 (Conversion):** High B on Q4, Q6.
  *   **Leaf 2 (Distance):** High B on Q2, Q7.
  *   **Leaf 3 (Pretend):** High C on Q6, Q7.
  *   **Leaf 4 (Formalist):** High A on Q1, Q4, Q6.
  *   **Leaf 5 (Meta-Response):** High B on Q8, Q4.
  *   **Leaf 6 (Organic):** High A on Q3, Q6, Q9.
  *   **Leaf 7 (Cognitive):** High C on Q5, Q8, Q10.
  *   **Leaf 8 (Catharsis):** High A on Q5, Q9.
  *   **Leaf 9 (Vitalism):** High A on Q9, Q10 (Option B).
  *   **Leaf 10 (Compassion):** High C on Q2, Q7 (Option B).

  **Tie-Breaking:**
  If tied between two leaves, prioritize the answer to Q3 (Ending) and Q5 (Aftermath). Q3 distinguishes Integration (Part vs Means). Q5 distinguishes Temporal Locus (During vs After).

  **Inconsistent Patterns:**
  If a respondent chooses "Painful" (Q1-A) but "Enjoyable" (Q10-B), flag as **Impure Profile 1: The Stoic Tragedian**. They deny enjoyment but seek maximum sadness. Assign to **Leaf 7 (Cognitive)** or **Leaf 6 (Organic)** based on Q10.
  If a respondent chooses "Insight" (Q10-A) and "Sensitive Self" (Q8-B), flag as **Impure Profile 2: The Intellectual Sentimentalist**. Assign to **Leaf 5 (Meta-Response)**.
  If a respondent chooses "Beauty" (Q6-A) and "Real Suffering OK" (Q2-A), flag as **Impure Profile 3: The Aesthetic Humanist**. Assign to **Leaf 4 (Formalist)**.

  **Crowded/Empty Predictions:**
  *   **Crowded:** **Leaf 7 (Cognitive)** and **Leaf 8 (Catharsis)**. Most viewers justify sadness via "learning" or "release."
  *   **Empty:** **Leaf 3 (Pretend)**. Few admit they don't *really* feel the emotion; it feels like a denial of experience.
  *   **Empty:** **Leaf 1 (Conversion)**. Few admit the art would be *better* without the sadness; they insist the sadness is necessary.

  # 6. Diagnostics

  **Unoccupied Cells:**
  *   **[Unpleasant: No] + [Integration: Means]:** If the pain isn't real, why use it as a tool? (Incoherent).
  *   **[Shield: Yes] + [Locus: After]:** If safety is required, why wait for the end? (Merely Unattractive).
  *   **[Unpleasant: Yes] + [Shield: Yes]:** Genuine pain that requires fiction to exist? (Unexplored/Masochistic).

  **Indistinguishable Leaves:**
  *   **Leaf 4 (Formalist)** and **Leaf 6 (Organic)**. Both claim sadness is part of the value during the experience. The tree cannot fully separate "beauty transforms pain" from "pain is part of unity" without asking about bad art (Probe D), which some users answer inconsistently.

  **Discriminating Nodes:**
  *   **Most Weight:** Node 1 (Affective Reality). It splits the space between those who feel pain (8 leaves) and those who don't (2 leaves).
  *   **Least Weight:** Node 6 (Self-Focus). Meta-Response overlaps heavily with Vitalism and Cognitiveism in practice.

  **Background Assumption:**
  *   **Assumption:** Viewers can accurately introspect on whether their sadness is unpleasant *during* the experience.
  *   **Falsification:** If physiological data (skin conductance) shows stress during "pleasurable" sadness reports, the Affective Reality axis collapses, merging Leaves 1, 6, 7, 8, 9, 10 into a single "Pain-Seeking" cluster.

  # 7. House Rules

  *   No bibliography or citations included.
  *   Positions labeled by standard descriptive names where possible; historical attributions omitted for brevity.
  *   Vocabulary restricted to filmgoer experience (e.g., "lump in the throat," "credits roll").
