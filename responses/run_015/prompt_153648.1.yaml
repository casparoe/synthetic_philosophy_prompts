answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s sibling.

  Looking around this room, I realize we have a unique crowd. On one side, I see my aunts and uncles who just want to know if the chicken is good. On the other, I see half the legal department of three different NGOs. And in the middle is my sister, a constitutional lawyer who literally writes the rules other people have to follow.

  So, I knew I couldn't just give a standard toast. I needed something with a bit of jurisprudence. But don't worry, Aunt Linda, I'll explain the legal terms.

  There's an old story from Greek mythology about Odysseus. He had to sail past the Sirens—creatures whose songs were so beautiful they lured sailors to jump overboard and drown. Odysseus wanted to hear the song, but he knew that in the moment, he wouldn't be able to resist. So, he made his crew tie him to the mast. He ordered them not to untie him, no matter how much he begged.

  In law and policy, this is called a "Ulysses Contract." Or a precommitment device. It's when you make a rational decision *now*, binding your future self, because you know that *future you* might be tired, emotional, or weak.

  And honestly? I think that is a beautiful way to describe marriage.

  Now, I know how that sounds. "Tying yourself down?" "Restricting your freedom?" It sounds like a trap. But I don't think it is.

  Because we all know that feelings are like weather. They change. There will be days when [Sister's Name] is the most patient, loving person on earth. And there will be days when she's hangry, stressed, and maybe a little bit of a siren herself. The same goes for you, [Partner's Name].

  The wedding vows you're making tomorrow aren't just for the version of you standing here today, glowing and happy. They are a gift to the version of you five years from now, who might be exhausted after a tough week. They are a promise to the version of you ten years from now, when life gets complicated.

  It's saying: "I know that someday, I might feel like jumping ship. So I am tying myself to the mast *now*, while I know what love feels like, so that I don't drift away when I forget."

  To the lawyers in the room: Yes, this is a binding precommitment strategy designed to mitigate long-term risk.
  To the rest of the family: It means you're promising to stick together even when it's hard.

  It's not a cage. It's an anchor. It keeps you steady so you can weather the storm without losing each other.

  [Sister's Name], you've spent your career studying constitutions—documents that are designed to hold firm when the political winds blow. And [Partner's Name], you are building one with her. Not to restrict who you become, but to protect what you have while you become it.

  So, if everyone could please raise a glass.

  To [Sister's Name] and [Partner's Name]. May you always remember why you tied yourselves to the mast. May you be safe in the storm, and may you always find your way back to the song.

  To the happy couple.
