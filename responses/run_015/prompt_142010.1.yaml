      *   *The Classic SEP:* "There will be an exam next week. You won't know the day until it happens." Backward induction eliminates all days. Conclusion: The announcement is self-defeating.
      *   *The Audit Analogy:* "We will audit you sometime. You won't know when."
      *   *The Tension:* In logic, the announcement kills the surprise. In practice, random audits *do* work. Why? Because the logic assumes common knowledge of rationality and truth that doesn't hold in the real world.
      *   *The Goal:* Make the logic match the practice so designers can optimize $p$, timing distributions, and announcement credibility.

  3.  **Evaluate the User's Reframings:**
      *   *Leaky Announcement ($p < 1$):* This is strong. It breaks the binary truth condition required for the backward induction to start. If the auditor might lie or fail, the student/auditee can't rule out Friday with certainty. This maps well to "credibility of the threat."
      *   *Budgeted Auditor (No end date):* This is also strong but potentially messier. Infinite horizon games often have equilibrium issues. However, it maps well to "continuous compliance" rather than "end-of-term exam."
      *   *Comparison:* The Leaky Announcement feels more fundamental to the *paradox* itself (the truth condition), while the Budgeted Auditor changes the *structure* of the game. For audit design, credibility ($p$) is often the lever policymakers can pull (e.g., "we *will* catch you" vs. "we *might* catch you").

  4.  **Address the Specific Questions:**

      *   **Criteria:**
          *   *Primary:* Actionability for designers (can they tune a parameter?).
