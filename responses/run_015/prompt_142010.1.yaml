answer: |-
  Here is the opinionated roadmap. I am treating this as a mechanism design problem disguised as an epistemic paradox. The classic literature fails because it treats the announcement as a logical truth rather than a strategic signal. Your funders want to know how to tune the signal so the inspection actually works.

  ### 1. The Ordering & Criteria
  **The Ordering:**
  1.  **Formalize the "Leaky Announcement" (Credibility)** – Months 1–4.
  2.  **Define "Surprise" as a Decision Variable** – Months 4–6.
  3.  **Analyze the "Budgeted Auditor" (Horizon)** – Months 6–9.

  **The Criteria:**
  I am ranking by **Actionability** > **Tractability** > **Upstream-ness**.
  *   **Actionability:** Can a regulator read the output and adjust a parameter (e.g., "increase audit noise" or "lower credibility")? This is the funder's goal.
  *   **Tractability:** Can a philosopher and a game theorist actually solve this in 9 months without data?
  *   **Upstream-ness:** Does this solve the root logical tension?

  **The Tension:**
  "Upstream-ness" pulls you toward the definition of knowledge (epistemic logic). "Actionability" pulls you toward probability and incentives (game theory). If you spend 9 months on epistemic logic, you will produce a paper that explains why the paradox exists, but not how to run an audit. You must privilege the Game Theorist's tools (probabilities, equilibria) over the Philosopher's tools (modal logic), using the Philosopher primarily to prevent conceptual sleight-of-hand.

  ### 2. Which Reframing First?
  **Verdict:** **The Leaky Announcement ($p < 1$).**
  **The Budgeted Auditor is a dead end for Month 1.**

  **Why:**
  The classic Surprise Exam Paradox (SEP) collapses because of the **terminal node**. Backward induction works because Friday is certain. If you remove the end date (Budgeted Auditor), you dissolve the paradox entirely. An infinite or indefinite horizon with a constant probability of audit is just a Poisson process. It's useful for operations, but it doesn't solve the *logical* friction you're trying to harness. It bypasses the problem rather than fixing it.

  The **Leaky Announcement** attacks the actual brittle assumption: **Common Knowledge of Truth.**
  In the classic SEP, the student *knows* the teacher tells the truth. In audits, the auditee *knows* the auditor might miss a violation (false negative) or might bluff (false positive threat).
  *   **Tractability:** This is solvable. You replace binary knowledge ($K$) with probabilistic belief ($P > \theta$).
  *   **Actionability:** This gives regulators a knob. If surprise collapses when credibility $p > 0.95$, but works at $p = 0.8$, that is a massive policy insight. It suggests that being *too* reliable might undermine the deterrent effect of randomness.

  ### 3. The Single Crux
  **Your guess:** "What 'surprise' means."
  **My correction:** **The Status of the Announcement.**

  It is not just about the definition of surprise (not-deducible vs. not-believed). It is about whether the announcement is a **Constraint** or a **Payoff**.
  *   **Classic SEP:** The announcement is a logical constraint on the world. (It *must* happen, and it *must* be surprising). This creates the contradiction.
  *   **Audit Reality:** The announcement is a strategic move to maximize compliance. The auditor *wants* surprise, but might settle for non-surprise if it catches a violation.

  **The Crux Question:**
  *Does the auditee believe the auditor is committed to the announcement, or that the auditor is optimizing for catch-rate?*

  If the auditee believes the auditor is optimizing, backward induction fails because the auditor might *choose* not to audit on Friday even if it's the last day, if auditing costs more than the expected catch.
  **The Philosopher's job:** Rigorously distinguish between "The audit will occur" (factual claim) and "I intend to audit" (statement of strategy).
  **The Game Theorist's job:** Model the auditor's payoff function. If the auditor gets utility from "Surprise" *and* "Detection," does an equilibrium exist where the announcement is self-fulfilling rather than self-defeating?

  **Why this hangs everything:** If you treat the announcement as a hard constraint, you get paradox. If you treat it as a signal in a signaling game, you get policy levers.

  ### 4. Rabbit Holes to Deprioritize
  **Your suspicion is correct:** **Self-Reference / Gödel / Moore's Paradox.**
  *   **Why avoid:** This literature treats the announcement as a sentence referring to its own knowability. This is fascinating for logic, but useless for audits. Auditors do not issue Gödelian sentences; they issue compliance schedules.
  *   **Specific Trap:** **Epistemic Logic (S5 systems).** Do not let the Philosopher spend 3 months axiomatizing knowledge operators ($K_a K_b p$). In the real world, knowledge is not closed under implication. Acknowledge this, assume bounded rationality, and move to probabilistic beliefs.
  *   **Secondary Trap:** **Psychological Surprise.** Do not measure "heart rate" or "stress." Surprise in this context is strictly **informational**: $P(\text{Audit}_t | \text{History}_{t-1}) < \text{Threshold}$. Keep it formal.

  ### 5. Early Results That Shift Priorities
  **Months 1–2 Deliverable:** A formal model of the "Leaky Announcement" showing the **Discontinuity at $p=1$**.

  *   **Move Up:** If they find that for any $p < 1$, the paradox vanishes and a mixed-strategy equilibrium emerges immediately. This implies regulators should *intentionally* introduce uncertainty about their own reliability (e.g., publicly admit to missing some violations) to maintain the "surprise" deterrent.
  *   **Move Down:** If they find that even with $p < 1$, the backward induction still kills surprise unless $p$ is vanishingly small (e.g., $p < 0.1$). This would suggest the SEP framework is fundamentally broken for audits, and you should pivot the remaining 6 months to the "Budgeted Auditor" (infinite horizon) model, accepting that the "Surprise" logic doesn't apply and focusing purely on optimal randomization rates.

  ### 6. Uncertainty Flags
  *   **Literature Gap:** I am flagging uncertainty on whether **Quine's 1953 analysis** or **Sorensen's work on blindspots** already covers the probabilistic ($p < 1$) case sufficiently. There is a niche literature on "probabilistic surprise examinations" (e.g., by Wright or Kritchman), but it is often still focused on the logical paradox rather than the *design* implication. Your team needs to verify if the "discontinuity at $p=1$" is already a settled theorem. If it is, Month 1 is wasted.
  *   **Game Theory Equilibrium:** I am guessing that a Perfect Bayesian Equilibrium exists for the Leaky Announcement, but I am not certain if it requires the auditor to randomize over *whether to audit at all* vs. *when to audit*. This distinction matters for budgeting.

  ### Summary of Instructions for the Team
  1.  **Philosopher:** Define "Announcement Credibility." Ensure we aren't smuggling in "Common Knowledge of Rationality."
  2.  **Game Theorist:** Build the $p < 1$ model. Find the equilibrium strategies for Auditor and Auditee.
  3.  **Joint Goal:** Produce a "Phase Diagram" for regulators. Axes: Credibility ($p$) vs. Audit Budget ($N$). Regions: "Surprise Possible," "Surprise Collapses," "Compliance Fails."

  If they do this, you get a tool. If they analyze the logic of the sentence, you get a paper. Fund the tool.
