  *(Self-Correction on "Budgeted Auditor")*: Actually, the "No end date" version is basically the "Unexpected Hanging" variant or infinite horizon. But for audits, the "Leaky" part is more critical because auditors *fail*. I will stick with Leaky as Priority 1.

  *(Self-Correction on Crux)*: I need to be careful not to just say "bounded rationality." That's a catch-all. It needs to be about the *announcement status*. Is the announcement a promise? A threat? A probability distribution?

