      *   **Reframing Choice:**
          *   *Leaky Announcement* wins. It directly addresses the "common knowledge of truth" assumption which is the brittle part of SEP in real life. Auditors *do* miss things. Auditees *know* they miss things.
          *   *Budgeted Auditor* is second. It's important, but if the announcement isn't credible, the horizon doesn't matter.

      *   **The Crux:**
          *   User guesses: "Surprise" definition (not-deducible vs. not-credibly-predicted).
          *   My take: Yes, but specifically **Common Knowledge of Rationality vs. Bounded Credibility**. The paradox relies on the auditee believing the auditor is omniscient/truthful and that the auditee knows the auditor knows they know... In audits, this chain breaks. The crux is modeling the *breakdown* of common knowledge, not just the definition of surprise.

      *   **Rabbit Holes:**
          *   User suspects: Self-reference/Gödel/Moore's Paradox.
          *   My take: Confirmed. This is the "logic trap." It explains why the sentence is paradoxical, not how to design a policy. Avoid epistemic logic deep dives unless they translate to probability bounds.

      *   **Early Results:**
