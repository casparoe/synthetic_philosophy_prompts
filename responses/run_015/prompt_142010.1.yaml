      *(Self-Correction during drafting)*: Wait, is the "Budgeted Auditor" actually just a Poisson process? If there's no end date, it's not really a "surprise exam" anymore, it's just random monitoring. The *Paradox* relies on the finite horizon. So the "Leaky Announcement" preserves the paradox structure while making it realistic. The "Budgeted Auditor" might dissolve the paradox entirely, which is useful but less interesting for the specific "SEP to Audit" mapping. I should argue for Leaky Announcement first.

      *(Refining the Crux)*: The user says "Surprise meaning." I think it's actually "Common Knowledge of the Policy." In audits, the policy is known, but the *execution* is noisy. The crux is distinguishing between *Policy Certainty* and *Execution Certainty*.

      *(Refining the Criteria)*: The funder wants utility. So "Actionability" is king. Can a regulator read the paper and say "Okay, I need to set my false negative rate below X"?

  6.  **Final Polish:**
      *   Ensure the 9-month timeline is respected (don't suggest empirical work).
      *   Make sure the Phil/GT division of labor is implicit (Phil on definitions/epistemology, GT on equilibria/probabilities).
      *   Check the "flagging guesses" requirement.

  7.  **Final Output Structure:**
      *   Executive Summary (The Ordering).
      *   Criteria & Tensions.
      *   Reframing Verdict (Leaky vs. Budgeted).
      *   The Single Crux (Common Knowledge vs. Credibility).
      *   Rabbit Holes to Avoid.
      *   Early Wins/Milestones.
