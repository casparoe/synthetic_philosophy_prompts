answer: |-
  ### Exam Question

  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question:**
  Select **one** of the following semantic frameworks covered in the course: (i) Tarskian Hierarchies, (ii) Kripkean Fixed Points (Strong Kleene), (iii) LP/Dialetheism, or (iv) Gupta-Belnap Revision Theory.

  Apply your chosen framework systematically to the following four cases:
  1.  **The Liar:** A sentence $\lambda$ equivalent to $\neg T(\lambda)$.
  2.  **The Infinite Chain:** A sequence indexed by $\mathbb{Z}$, where $S_i \leftrightarrow \neg T(S_{i+1})$.
  3.  **The Truth-Teller:** A sentence $\tau$ equivalent to $T(\tau)$.
  4.  **The Yablo Sequence:** A sequence indexed by $\mathbb{N}$, where $Y_i \leftrightarrow \forall k > i (\neg T(Y_k))$.

  In your essay, you must:
  *   State clearly what a theory of truth is supposed to deliver (e.g., classical logic, unrestricted T-biconditionals, semantic closure) and explicitly identify which desideratum your chosen framework sacrifices.
  *   Demonstrate how your framework assigns semantic status (true, false, gap, glut, unstable) to each of the four cases.
  *   Critically evaluate the concept of **"ungroundedness."** Does your framework's classification of these cases (e.g., as gaps, gluts, or unstable) offer a genuine *diagnosis* of why they are problematic, or does it merely *re-describe* the fact that they lack a classical fixed point?

  *Note: Answers that simply list the properties of the chosen theory without engaging with the specific structural differences between the Chain and the Yablo sequence will not receive credit above a passing grade.*

  ***

  ### Model Answer (Kripkean Fixed Points)

  A theory of truth should ideally preserve the T-biconditionals ($T(\ulcorner A \urcorner) \leftrightarrow A$) and allow semantic closure (truth talk about truth). The Kripkean fixed-point construction prioritizes these by sacrificing classical logic, specifically the Law of Excluded Middle. By using Strong Kleene valuation, we allow truth-value gaps to block paradox while retaining the T-schema for grounded sentences.

  Applying this to the four cases yields distinct results. (1) The **Liar** receives no truth value at any stage of the construction; it remains a permanent gap. (2) The **Truth-Teller** is also a gap in the minimal fixed point, though it *can* be true in other fixed points; Kripke treats it as ungrounded because its truth value does not supervene on non-semantic facts. (3) The **Yablo Sequence** behaves like the Liar: no sentence in the sequence ever receives a classical value in the construction. Despite lacking circularity, the dependence structure prevents values from "flowing" from the base.

  The **Infinite Chain** is the critical test case. Classically, this sequence is consistent; it admits alternating models (…T, F, T, F…). However, in Kripke's construction, it is treated identically to the Liar: every sentence remains a gap. There is no "stage 0" base from which values propagate, so the construction never assigns them values.

  This forces the question: is "ungroundedness" a diagnosis or a re-description? If we treat the Chain as a gap simply because it lacks a base, we are arguably re-describing the problem. The Chain is not inconsistent (unlike the Liar or Yablo); it is merely under-determined. By classifying the Chain alongside the Liar, Kripke implies that *any* sentence not grounded in non-semantic fact is semantically defective. This is a substantive philosophical claim, not just a technical observation. It diagnoses the problem as one of *reference* rather than *consistency*.

  However, this diagnosis comes at a cost. By grouping the consistent Chain with the inconsistent Liar, Kripke sacrifices the ability to distinguish between paradoxes of inconsistency (Liar/Yablo) and paradoxes of under-determination (Chain/Truth-Teller). A B-student might accept this as a technical necessity. An A-student must recognize that this is a choice: we are defining "meaningful" as "grounded." If we value classical consistency over groundedness, the Chain should be true-or-false. Kripke chooses groundedness.

  Thus, "ungrounded" is a diagnosis only if one accepts that truth *must* supervene on the non-semantic. If one views truth as potentially coherent without a base (as classical models of the Chain show), then "ungrounded" is merely a label for "not handled by this specific construction." Kripke delivers semantic closure and the T-schema for grounded sentences, but the cost is a blunt instrument that cannot distinguish between the logical inconsistency of the Liar and the mere lack of foundation in the Chain. We save the T-schema, but we lose the nuance of classical consistency.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Desiderata and Trade-offs (5 Marks)**
  *   **Full Marks:** Clearly states what the theory keeps (e.g., T-schema) and what it gives up (e.g., Classical Logic/LEM). Explicitly owns the cost.
  *   **How they blow it:** Vaguely saying "it solves the paradox" without specifying which logical principle is sacrificed, or claiming the theory keeps *everything* (e.g., claiming Kripke keeps classical logic).

  **2. Technical Application: Liar & Truth-Teller (5 Marks)**
  *   **Full Marks:** Correctly identifies Liar as a gap/glut/unstable (depending on theory) and Truth-Teller as ambiguous/ungrounded/consistent. Distinguishes the two (e.g., in Kripke, both are gaps in the minimal fixed point, but Truth-Teller has other fixed points).
  *   **How they blow it:** Treating the Truth-Teller exactly like the Liar without nuance (ignoring fixed-point multiplicity), or claiming the Truth-Teller is simply True.

  **3. Technical Application: Chain vs. Yablo (5 Marks)**
  *   **Full Marks:** Recognizes the Chain has classical models (consistent) while Yablo does not (inconsistent). Explains how their chosen theory handles this distinction (or fails to).
  *   **How they blow it:** Treating the Chain and Yablo as identical. Failing to notice the Chain is classically consistent. This is the primary filter for A-grade work.

  **4. Diagnosis vs. Re-description (5 Marks)**
  *   **Full Marks:** Engages with the prompt's core philosophical question. Argues whether "ungrounded" explains *why* the sentences fail or just labels *that* they fail to fit the model.
  *   **How they blow it:** Asserting "It is a diagnosis because Kripke says so" without philosophical justification. Ignoring the "re-description" option entirely.

  **5. Coherence and Ownership (5 Marks)**
  *   **Full Marks:** The conclusion follows from the analysis. The student defends the trade-off identified in Point 1 based on the evidence from Points 2-4.
  *   **How they blow it:** Contradicting their initial desiderata (e.g., saying they want classical logic but defending a theory that sacrifices it without acknowledging the tension).

  ***

  ### Instructor Note: The "Separator" Case

  You are correct: **The Infinite Chain (Case 2)** is the strongest separator between A and B answers.

  **Why?**
  *   **The Liar (1)** is rote memorization. Any student who attended lectures can recite how their theory handles the Liar.
  *   **The Truth-Teller (3)** is often glossed over as "boring" or "contingent." Students can hand-wave it.
  *   **The Yablo (4)** is popular, but often taught as "The Liar without circularity." Students tend to memorize "Yablo = Paradox" without analyzing the model theory deeply.
  *   **The Chain (2)** forces a confrontation between **consistency** and **groundedness**.
      *   A **B-student** will treat the Chain like the Liar: "It has no base, so it's ungrounded/paradoxical." They rely on the *label* "ungrounded."
      *   An **A-student** will notice that the Chain *has* classical models (alternating T/F). They must explain why their theory (e.g., Kripke) rejects a classically consistent sentence. This forces them to answer the "Diagnosis vs. Re-description" prompt genuinely: Is the lack of a base a *defect* (diagnosis), or just a limitation of Kripke's construction (re-description)?

  If you swap the Chain for another Liar variant, you lose the ability to test whether they understand that "ungrounded" $\neq$ "inconsistent." Keep the Chain. It is the only case that breaks the intuition that "paradoxical" means "logically impossible."
