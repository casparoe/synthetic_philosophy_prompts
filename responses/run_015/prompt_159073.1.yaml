          *   *Splitting them:* The "Black Death" scenario (1348).
              *   *Load-bearing:* Massive. Changes everything.
              *   *Discrimination:* Low. It killed monks and peasants, lords and serfs. (Though some nuance exists, broadly it was indiscriminate compared to famine).
              *   *Answerability:* Low (by 1810s standards of knowledge, though quarantine existed).
              *   *Result:* Under the user's test, the Black Death isn't an "actor." It's a backdrop.
          *   *Which to drop?* If you drop *Discrimination*, you risk determinism (nature rules all). If you drop *Load-bearingness*, the environment is just set dressing. If you drop *Answerability*, you lose the moral stakes.
          *   *Fatal Defeater:* A scenario that passes all three but *still* feels like determinism. Or a scenario that fails one but *must* be treated as an actor for the story to work.
          *   *The Split Case:* A sudden, unpredictable earthquake in 1815.
              *   Load-bearing: Yes (destroys the loom shop).
              *   Discrimination: Yes (poor housing collapses, rich stone houses stand).
