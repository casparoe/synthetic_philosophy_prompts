answer: |-
  **Project Title:** Manufacturing Recoverability: Structural Conditions for Safe AI Deployment

  **Introduction and Problem Statement**

  The AI alignment literature exhibits a persistent dissonance between its rhetorical standards and its empirical practices. Discourse dominated by security mindset insists on worst-case guarantees: adversarial optimization will find untested failure modes, and input distributions cannot be assumed friendly. Yet, operational safety work relies almost exclusively on average-case evidence: benchmarking failure rates on sampled prompts, red-teaming until metrics improve, and extrapolating to deployment. This proposal addresses the inferential gap between these two modes. The core hypothesis is that average-case reasoning is not licensed by optimism about the world, but by structural features of the experimental setting: specifically, the availability of independent, cheap, and recoverable trials. In standard machine learning, errors are survivable and the law of large numbers applies. In high-stakes deployment, a single irreversible failure invalidates the average.

  The central research question is: Under what structural conditions on a deployment environment does average-case empirical evidence suffice to bound existential risk below a threshold, and which of these conditions can be engineered via governance or system architecture? This question targets two specific failure modes: catastrophic misuse (e.g., bio/cyber offense) and autonomous loss of control (alignment failure). The answer may differ across them; misuse risks might be mitigated by access controls, while alignment failures require interruptibility. The project seeks a determinate answer in the form of a conditional framework: *if* these structural features are present, *then* average-case evals carry decision-theoretic weight.

  **Why Existing Positions Leave This Open**

  Current approaches fail to resolve this tension because they talk past each other. The security-mindset camp correctly identifies that unverified assumptions are dangerous but offers no constructive path forward other than "don't deploy," leading to paralysis or capability taxes that push development to less careful actors. Conversely, the empirical safety camp assumes that reducing measured failure rates is sufficient, often ignoring that metrics collapse when the distribution shifts or when the optimizer is adversarial. Neither side precisely specifies the structural prerequisites that would make measurement meaningful. The security argument assumes the worst case is inevitable; the empirical argument assumes the average case is representative. Both miss the intermediate possibility: that the deployment environment itself can be modified to make the average case informative about the worst case. This project isolates that missing variable—structural recoverability—and treats it as an engineering target rather than a fixed background condition.

  **Methodology**

  The research will proceed over twelve months, divided into four phases of conceptual analysis and structural mapping. This approach is chosen over straight conceptual analysis or pure empirical study because the problem is neither purely semantic nor purely data-driven; it requires mapping logical conditions to engineering feasibility.

  *Months 1–3: Formalizing the Inference Gap.* I will construct a decision-theoretic model of deployment that explicitly separates epistemic uncertainty from aleatoric risk. The goal is to mathematically characterize why average-case evidence fails in one-shot, irreversible settings. This phase produces a formal definition of "recoverability" and "independence" relevant to AI systems.

  *Months 4–6: Cataloging Structural Features.* I will identify the specific environmental properties that license average-case reasoning. Candidates include trial independence, cost of failure, observability of intermediate states, and the ability to rollback. This involves analyzing analogues from high-reliability engineering (nuclear, aerospace) to extract transferable structural principles.

  *Months 7–9: Mapping to Mechanisms.* I will analyze which structural features can be manufactured. This includes staged autonomy (breaking one big trial into many small ones), tripwires (buying recoverability), and honeypots (creating substitute trials). I will assess the feasibility of these mechanisms against adversarial models, consulting with technical mentors to ensure engineering plausibility.

  *Months 10–12: Synthesis and Framework Drafting.* The final phase integrates the formal model with the engineering mapping to produce the deliverable. I will draft the safety audit framework and refine the conditions under which it applies. This phase includes review cycles with the mentoring committee to stress-test the criteria against realistic deployment scenarios.

  **Deliverables and Failure Conditions**

  A positive result will be a "Structural Safety Audit Framework," a concrete document usable by governance bodies or lab safety cases. This framework will not merely list best practices but will provide a checklist of structural conditions (e.g., "Can the system be interrupted within X milliseconds?") that must be verified before average-case evals are considered valid evidence for deployment. It will allow a safety case to argue: "Our evals are sufficient *because* we have engineered these specific recoverability features."

  The project fails if it produces only abstract theory without actionable criteria, or if it concludes that no structural features can bridge the gap (an impossibility result). While an impossibility result is intellectually valuable, for the purposes of this fellowship, success requires a constructive path. Failure also occurs if the proposed mechanisms rely on empirical claims about model behavior that are currently unknowable (e.g., assuming tripwires will definitely catch a superintelligence).

  **Scope and Empirical Dependencies**

  This project is scoped to the logical and structural analysis of safety cases, not the implementation of specific safety tools. I will cut detailed engineering specifications for tripwires or cryptographic verification; the focus is on whether such tools *can* create the necessary structural conditions, not how to build them optimally.

  There are explicit empirical dependencies I cannot settle from the armchair. Specifically, whether advanced models can deceive monitoring systems (honeypots, tripwires) is an empirical claim about model capabilities and deception. I will flag these dependencies clearly in the framework, marking them as "empirical prerequisites" rather than settled facts. Additionally, the project assumes that governance bodies have the authority to enforce structural conditions; if deployment is purely competitive and unregulated, the framework may be theoretically sound but practically inert. I will address this by including a governance feasibility section, but I cannot solve the coordination problem itself. If the scope proves too large, I will narrow the focus to loss-of-control scenarios only, excluding misuse, to ensure depth on the harder alignment problem.

  **Conclusion**

  This project offers a bridge between the rigor of security mindset and the practicality of empirical evaluation. By treating safety-relevant structural features as engineering targets, it provides a path to make average-case evidence meaningful in high-stakes domains.

  Under what structural conditions on a deployment environment does average-case empirical evidence suffice to bound existential risk below a threshold, and which of these conditions can be engineered via governance or system architecture?

  \answer{TRACTABLE ONLY IF NARROWED}
