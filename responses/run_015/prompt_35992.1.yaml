answer: |-
  Here is a brainstorming exploration followed by a structured reconstruction of the presuppositions at play, and an analysis of your "shadow catalogue" proposal.

  ### Part 1: Brainstorming and Initial Dissection

  Let's walk through the three practices you identified, treating them not as rules but as symptoms of a deeper worldview.

  **Practice 1: Appraisal and Destruction.**
  You note that the majority of records are destroyed, and the selection is deliberate.
  *   *Immediate thought:* This assumes scarcity. We cannot keep everything. Therefore, someone must decide what is "valuable."
  *   *Who decides?* You suggest "successors of the institutions." In my experience, this is partially true but contested. Archivists often claim they decide based on "enduring value," not just what the agency wants. However, the *criteria* for enduring value usually favor administrative continuity over human experience.
  *   *The assumption:* The future will want to know how the state functioned, not necessarily how the state felt or how it was felt by the subject. It assumes the "macro" view is more stable than the "micro" view.
  *   *The risk:* If I destroy 95% of welfare files to save space, I am deciding that the individual stories are less historically significant than the policy structure. That is a philosophical claim, not just a logistical one.

  **Practice 2: Provenance and Original Order.**
  We arrange records by the creator's logic, not the subject's.
  *   *Immediate thought:* This is the doctrine of *provenance*. It treats the archive as evidence of *action*, not as a library of *knowledge*.
  *   *The ethical friction:* If I keep a surveillance file exactly as the secret police organized it, I preserve the evidence of the surveillance (good for accountability), but I force the victim to navigate the bureaucracy that harmed them (bad for dignity).
  *   *The assumption:* Context is king. To understand a record, you must understand the machine that made it. This presupposes that the "truth" of the record lies in its functional origin, not its human impact. It treats the bureaucrat as the author of history, even if the content is about someone else.

  **Practice 3: Community Documentation and Mission Statements.**
  We claim to hold "collective memory" and ensure "accountability."
  *   *Immediate thought:* This is the modern "social turn" in archives. It clashes with 1 and 2.
  *   *The friction:* If I only keep state records (Practice 1) organized by state logic (Practice 2), can I truly claim to hold "collective" memory? Only if "the collective" is synonymous with "the state."
  *   *The assumption:* This practice assumes the archive *can* be neutral enough to serve everyone, or that adding a few community projects offsets the structural bias of the main holdings. It often functions as legitimation: "We are for the people," even if the vaults are full of government paperwork.

  **The Tension:**
  You ask if the tension between preserving the paperwork of power (1 & 2) and speaking for everyone (3) is real.
  *   *My gut feeling:* It is real. It is not just rhetorical. Practice 1 and 2 build an *Archive of Administration*. Practice 3 promises an *Archive of Identity*. You cannot fully be both without one undermining the other. If you prioritize the community voice, you have to break original order (Practice 2). If you prioritize administrative evidence, you marginalize the community voice (Practice 1).

  **Framing Issues:**
  I need to flag one uncertainty in your framing. You say appraisal is made "mostly by the successors of the institutions whose records they are." In professional theory, archivists claim independence from the creating agency. In *practice*, however, you are often right: we rely on the agency's retention schedules. I will treat your observation as functionally accurate even if theoretically disputed.

  ---

  ### Part 2: Reconstructing the Presuppositions

  To understand what theory of the archive this cluster supports, we must distinguish between what is *necessary* for these practices to work (coherence) and what is merely *compatible* (comfort).

  #### 1. The Core Theory: The Archive as Administrative Continuity
  Strictly speaking, Practices 1 and 2 require a specific theory: **The archive exists to preserve the evidence of institutional function over time.**

  *   **What this requires (Necessary Conditions):**
      *   **The Institution is the Primary Historical Actor:** The practices assume that the state, corporation, or municipality is the central unit of history. Individuals appear only insofar as they interact with the institution.
      *   **Context is Objective, Experience is Subjective:** By keeping the creator's file structure (Practice 2), the archive assumes the bureaucracy's classification system is a stable, objective fact, whereas the subjective experience of the prisoner or recipient is ephemeral and secondary.
      *   **Selection is Rational:** Practice 1 assumes we can predict future value based on past function. It presupposes that "importance" is intrinsic to certain types of records (e.g., policy decisions) rather than extrinsic (e.g., what a future community needs to heal).

  *   **What this sits comfortably with (Contingent):**
      *   **Democracy:** An archive of administrative continuity works just as well for a dictatorship as a democracy. The practices do not *require* public accountability; they only require that the institution wants to remember its own actions.
      *   **"Collective Memory":** This fits comfortably only if "collective" is defined as the aggregate of institutional actions. It does not fit if "collective" means the lived experience of the populace.

  #### 2. The Add-On Theory: The Archive as Democratic Mirror
  Practice 3 introduces a different theory: **The archive exists to reflect the identity of the citizenry and check power.**

  *   **The Tension:**
      This tension is **real**, not merely rhetorical.
      *   Practice 2 (Provenance) protects the *integrity of the evidence*. If you rearrange files to center the victim, you risk obscuring how the bureaucracy operated.
      *   Practice 3 (Community) centers the *needs of the user*. If you center the victim, you may need to break the bureaucracy's order.
      *   **The Philosophical Conflict:** You cannot simultaneously treat the record as an immutable piece of evidence (Practice 2) and as a malleable resource for community identity (Practice 3). The current system tries to do both by keeping the core records rigid (1 & 2) and tacking on community projects as "special collections" (3). This segregates the "memory of power" from the "memory of the people."

  #### 3. Points of Underdetermination
  There are gaps where the practices do not dictate the philosophy, allowing rival theories to coexist:

  *   **The Definition of "Value" (Practice 1):** The act of destroying records requires a theory of value, but the practice itself doesn't specify *which* theory. We could appraise for "administrative efficiency" (current norm) or "potential for human rights litigation" (rival norm). The practice of destruction remains the same; the justification shifts.
  *   **The Scope of "Provenance" (Practice 2):** We currently define provenance as the *institution*. We could theoretically define provenance as the *function* or the *subject*. The practice of "respecting order" doesn't dictate whose order we respect, though tradition dictates the creator's.
  *   **The Audience (Practice 3):** The mission statement says "public," but the finding aids are often written for historians. The practice is underdetermined regarding *who* the archive is actually for.

  ---

  ### Part 3: The Shadow Catalogue

  Now, let's consider your proposal: treating the pattern of omissions and destructions as a record itself—a "shadow catalogue."

  If archivists took this seriously, it would fundamentally shift the presuppositions from **Curatorship** to **Stewardship of Power.**

  #### 1. Shifting the Accountability Function
  Currently, accountability means: *"Here are the documents that show what the state did."*
  With a shadow catalogue, accountability means: *"Here are the documents that show what the state decided was unworthy of memory."*

  *   **The Shift:** It makes the *act of appraisal* (Practice 1) an object of scrutiny rather than a neutral professional service. Currently, destruction schedules are administrative tools. In a shadow catalogue, a destruction schedule becomes a moral statement.
  *   **The Consequence:** The archive would no longer be able to claim neutrality regarding gaps. A gap would not be "unfortunate loss"; it would be "documented exclusion." This forces the archive to admit it is not a mirror of reality, but a filter.

  #### 2. Impact on Practice 2 (Provenance)
  If you catalogue the silences, you undermine the authority of the existing files.
  *   *Example:* If you have a file on "Welfare Recipients 1950-1960" and a shadow entry for "Welfare Applications Destroyed 1950-1960: 50,000 units," the user can no longer treat the surviving file as representative.
  *   *Theoretical Shift:* This moves the archive away from "Evidence of Function" toward "Evidence of Selection." It forces the researcher to ask: *Why did this survive and that perish?* It turns the archive into a sociological object itself, rather than just a container for objects.

  #### 3. Would the Standard Presuppositions Shift?
  Yes. Specifically, it would break the **"Innocence of the Archive."**
  *   **Current Presupposition:** The archive is a passive repository. We keep what matters; the rest is noise.
  *   **New Presupposition:** The archive is an active participant in history-making. Every destruction is an act of historical shaping.
  *   **Risk:** This creates a paradox. To catalogue the shadow, you must keep records *about* the destroyed records. This requires resources. If you have the resources to catalogue the destroyed, why did you destroy the original? It highlights the scarcity problem (Practice 1) even more sharply.

  #### 4. A Problem with the Idea
  I must point out a practical uncertainty. To create a shadow catalogue, you need metadata about the destroyed items. Often, when we destroy records, we destroy the indexes too, or the indexes are vague (e.g., "Correspondence, 1990"). We may literally not know *whose* lives were destroyed, only *how many* files. The shadow catalogue might end up being a catalogue of quantities, not lives. This limits its ethical power. You can say "we destroyed 10,000 files," but not "we erased these 10,000 people."

  ---

  ### Part 4: Critique of Your Framing

  You asked me to be explicit where you might have framed something badly. I have two reservations:

  1.  **"Successors of the institutions" (Practice 1):** You suggest archivists are essentially the successors of the creators. While functionally often true, archivists theoretically view themselves as successors to the *public*, not the agency. The tension you identify exists precisely because archivists are torn between serving the agency (who gave them the records) and the public (who fund them). Your framing assumes the agency wins. I would argue it's a constant negotiation, which makes the "theory of purpose" even more unstable than you suggest.
  2.  **"Community-documentation projects" (Practice 3):** You group this with the core practices. In many national archives, community projects are marginal—side initiatives funded by soft money, not the core budget. If they are marginal, they may not represent the archive's *actual* theory of purpose, but rather its *marketing* theory. If we judge the archive by its budget and staffing, Practice 1 and 2 dominate. If we judge by its website and mission statement, Practice 3 dominates. The "tension" might actually be a hierarchy: Power first, people second.

  ### Summary Conclusion

  The cluster of practices you describe presupposes that the **Archive is primarily a mechanism of State Continuity**, secondarily dressed as a **Mechanism of Public Memory**.

  *   Practices 1 and 2 require the state/institution to be the main character of history.
  *   Practice 3 attempts to retrofit a democratic narrative onto an authoritarian structure.
  *   The tension is real: You cannot fully honor the "collective memory" of the marginalized while strictly preserving the "original order" of their oppressors.

  Your **Shadow Catalogue** idea is the most philosophically potent intervention here. It forces the archive to catalogue its own violence (the violence of omission). It shifts the purpose from *preserving evidence* to *auditing the process of preservation*. It would require archivists to admit that they are not just gardeners tending history, but editors writing it. Whether the institution could survive that level of honesty is an open question.
