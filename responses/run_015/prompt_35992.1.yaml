          2.  Respect des Fonds/Provenance (arranging/describing from the creator's POV, even for marginalized subjects).
          3.  Community Documentation/Mission Statements (claiming to be guardians of collective memory/accountability).
      *   **The Tension:** Preserving paperwork of power vs. claiming to speak for everyone. Is this tension real or rhetorical?
      *   **Requirements:** Distinguish between what practices *require* (necessary conditions) vs. what they *sit comfortably with* (contingent). Identify underdetermined points.
      *   **The "Shadow Catalogue" Idea:** Analyze the implications of cataloging silences/omissions/destructions. Would this shift the presuppositions?
      *   **Structure:** Begin with open-ended brainstorming, then move to reconstruction, then analyze the "shadow catalogue" idea. Be explicit about uncertainties/framing issues.

  2.  **Deconstruct the Practices (Brainstorming & Initial Analysis):**

      *   *Practice 1 (Appraisal/Destruction):* This is the "weeding" process. It assumes resources are finite. It assumes someone (the archivist/creator) knows better than chance what matters. It assumes "value" is intrinsic to the record or its potential use. *Crucial point:* The prompt says "made mostly by the successors of the institutions whose records they are." This is a strong claim. In reality, archivists often negotiate with creators, but the *logic* of administrative history often dominates. It presupposes the *continuity of the state/institution* is the primary narrative.
      *   *Practice 2 (Provenance/Original Order):* "Respect des fonds." We keep the files how the bureaucracy made them. Why? To preserve context and evidence of function. But ethically? It reifies the bureaucrat's gaze. A prisoner is a number in a ledger. Keeping the ledger *as is* preserves the evidence of how the state treated prisoners, but it doesn't center the prisoner's humanity. It presupposes *evidence of action* is more important than *narrative of experience*.
      *   *Practice 3 (Community/Mission):* "Collective Memory." "Accountability." This is the modern branding. It clashes with 1 & 2. If I only keep state records (1) and organize them by state logic (2), can I really be the guardian of *collective* memory (3)? Only if "collective" means "the state's aggregate." If "collective" means "the people," there's a gap.
      *   *The Tension:* Is it hypocritical? Or is it a dialectic? Maybe the archive *is* the memory of power, and the *researcher* uses it for accountability? The prompt asks what the *practices* presuppose, not what researchers do.
      *   *Underdetermination:* The practices don't dictate *why* we keep provenance. Is it to protect the truth of the creator's intent? Or is it just efficient? The practices don't dictate *who* "collective memory" belongs to.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the role, set the tone (precise, experienced).
      *   **Brainstorming Phase:** Walk through the three points informally. Question the prompt's framing where necessary (e.g., "successors of the institutions").
      *   **Reconstruction of Presuppositions:**
          *   *Necessary Conditions (What makes it coherent):* The archive is an extension of the administration. Evidence > Experience. Continuity of the Institution > Continuity of the People.
          *   *Contingent Comforts (What fits but isn't required):* Democracy, Accountability, Neutrality.
          *   *Underdetermined Points:* The definition of "value." The owner of "memory."
      *   **Analyzing the Tension:** Is it real? Yes. It's the tension between *Archive as Evidence* (1 & 2) and *Archive as Identity* (3).
      *   **The Shadow Catalogue:** This is the provocative part.
          *   If we catalogue destruction, we make the *act of forgetting* visible.
          *   Does this shift accountability? Yes, from "what did you do?" to "what did you decide was unworthy of memory?"
          *   Does it break the "Neutrality" myth? Yes.
      *   **Critique of the Prompt:** The prompt says appraisal is "mostly by the successors." In many national archives, archivists fight creators. I need to note this nuance. Also, "community documentation" is often a side project, not the core. I need to be careful not to overstate its integration.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I initially thought about saying "Archivists are neutral." But the prompt implies they aren't. The presupposition is actually *functional neutrality*—we preserve the function, not the moral worth.
      *   *Refining Practice 1:* The prompt says "destroy the large majority." This assumes scarcity. It also assumes the *future* looks like the *past* (we know what will be valuable).
      *   *Refining Practice 2:* This is "Provenance." It assumes the creator's context is the *only* valid context. This is the epistemological core.
      *   *Refining Practice 3:* This is the "Social Turn" in archives. It clashes with the "Administrative Turn" of 1 & 2.
      *   *The "Shadow Catalogue":* If I log what I destroyed, I am admitting agency. Standard theory says "we just keep what matters." Shadow theory says "we decided what doesn't matter." This shifts from *curator* to *judge*.

  5.  **Final Polish:**
