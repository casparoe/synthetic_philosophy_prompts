      *   Critique of Framing: Nuance on appraisal and community work.

  *(Self-Correction Note during final review)*: I need to make sure I don't just agree with the user. The prompt asks me to be explicit about where they might have framed something badly. The claim that appraisal is "mostly by the successors of the institutions whose records they are" is technically debatable. Archivists often claim independence. I should point out that the *effect* is often what the user says, even if the *theory* claims independence. I also need to ensure I don't use too much Derrida/Foucault jargon ("archive fever," "power/knowledge") unless I explain it simply. The prompt asks for "no unnecessary jargon."

