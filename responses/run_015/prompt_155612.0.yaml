answer: |-
  Here is a defended agenda based on your constraints (no archive access, two-year horizon, conceptual focus) and your specific criterion: distinguishing live research questions from retrospective redescription.

  ### The Verdict: Upstream Priority Ranking

  1.  **Priority 1: The Formal-Conceptual Problem (Q1).**
      *   *Status:* **Gatekeeper.**
      *   *Reasoning:* This is the necessary condition for the project's survival. If Foucault's analytics cannot rigorously map onto algorithmic governance without becoming metaphorical, the framework is indeed merely retrospective. You must establish the *ontology of power* before you can apply it (Q3) or judge it (Q2).
  2.  **Priority 2: The Empirical-Institutional Problem (Q3).**
      *   *Status:* **Validation.**
      *   *Reasoning:* This is the "proof of concept." Since you lack archival access, your "archive" is the present institutional structure of academia. This is the only way to demonstrate *tractability* to your friend. It transforms Q1 from abstract theory into a diagnostic tool.
  3.  **Priority 3: The Normative-Structural Problem (Q2).**
      *   *Status:* **Synthesis (not Premise).**
      *   *Reasoning:* Treating this as an upstream problem is a trap. It leads to scholastic paralysis (the "cryptonormativity" debate has raged for 40 years). Normative traction in a Foucaultian framework is not found *before* analysis but emerges *immanently* from the friction identified in Q1 and Q3.

  ---

  ### Detailed Justification & Criteria Application

  #### 1. The Formal-Conceptual Problem (Q1)
  *   **Tractability (High):** This requires conceptual labor, not archival digging. You are analyzing the *logic* of algorithms (prediction, scoring, feedback loops) against the *logic* of discipline (enclosure, normalization, observation).
  *   **Dependency:** Upstream of everything. If you cannot distinguish "algorithmic governmentality" from "disciplinary power," Q3 becomes a category error.
  *   **Practical Leverage (High):** This directly informs governance design. If algorithms operate via *modulation* (Deleuze) rather than *discipline* (Foucault), policy interventions designed to break "enclosures" (e.g., data privacy as a wall) will fail against systems designed for "flow."
  *   **The Trap:** Do not simply assert algorithms are "new." The rigorous work is showing *where* Foucault breaks. Does the "panopticon" hold when the observer is non-human and the goal is not normalization but *pre-emption*?
  *   **Decision:** Commit to the hypothesis that **Biopower is not scale-invariant.** Disciplinary power relies on the *individual* as the target of normalization. Algorithmic power targets the *dividual* (data doubles) and populations via risk. Securing this distinction is your primary conceptual deliverable.

  #### 2. The Empirical-Institutional Problem (Q3)
  *   **Tractability (Medium):** You are inside the institution. Citation metrics, grant algorithms, and tenure clocks are observable without special access.
  *   **Dependency:** Depends on Q1. You need the vocabulary from Q1 to describe *what* the university is becoming.
  *   **Practical Leverage (High):** This moves the work from "theory of tech" to "politics of knowledge." It answers your friend's challenge: if you can show how research funding algorithms *produce* specific subjectivities (the "grant-ready researcher"), you prove the framework generates live questions.
  *   **Decision:** Use Q3 not as a case study, but as a **stress test**. If your Q1 framework cannot explain the shift from "peer review" (disciplinary/judgment) to "metric impact" (modulatory/prediction), the framework fails.

  #### 3. The Normative-Structural Problem (Q2)
  *   **Tractability (Low):** This is the black hole. Attempting to ground "emancipation" foundationally contradicts Foucault's anti-essentialism.
  *   **Dependency:** Downstream. You cannot define what is "emancipatory" about a subject until you define how that subject is being constituted (Q1 + Q3).
  *   **Practical Leverage (Low/Mixed):** Solving this philosophically changes little in policy. However, failing to address it leaves you open to the charge of nihilism.
  *   **Decision:** **Do not solve this foundationally.** Adopt Foucault's late solution: **Freedom as Practice.** Normativity is not a ground you stand on; it is the capacity to refuse the specific mode of subjectivation being imposed. In the context of algorithms, "emancipation" is not returning to a true self, but disrupting the feedback loops that固化 (solidify) the predictive score.

  ---

  ### Dependency Relations & Incoherent Combinations

  You asked which combinations of answers are incoherent. Avoid these specific pairings:

  1.  **The "Techno-Disciplinarian" Incoherence:**
      *   *Commitment:* Claiming algorithmic governance is identical to 19th-century disciplinary power (Q1 = No Change) **AND** arguing that traditional humanist rights offer a solution (Q2 = Liberal Humanism).
      *   *Why it fails:* If power is the same, the resistance should be the same. But if the architecture is distributed and predictive, "rights" based on individual autonomy (the product of discipline) are obsolete. This makes your work retrospective redescription.
  2.  **The "Crypto-Normative" Incoherence:**
      *   *Commitment:* Maintaining strict anti-essentialism regarding the subject (Q2 = Foucault Orthodoxy) **BUT** condemning algorithmic governance as "dehumanizing" (Q3 = Moral Critique).
      *   *Why it fails:* If there is no "human" essence to dehumanize, the critique lacks a subject. You must rephrase the critique: algorithms do not dehumanize; they **foreclose possibilities of subjectivation.**
  3.  **The "Methodological Irony" Incoherence:**
      *   *Commitment:* Arguing academia has shifted to modulatory logic (Q3 = Modulation) **WHILE** using traditional disciplinary methods to prove it (e.g., seeking "truth" via static textual analysis).
      *   *Why it fails:* Your method must reflect your object. If the object is dynamic/predictive, your conceptual method must account for feedback and flux.

  ### The Two-Year Agenda

  To maximize leverage and avoid the "retrospective" trap, structure your work as follows:

  **Year 1: The Ontology of Algorithmic Power (Q1 + Q2-lite)**
  *   **Goal:** Rigorously define "Algorithmic Governmentality."
  *   **Task:** Map the shift from *Normalizing Judgment* (Foucault) to *Predictive Scoring*.
  *   **Normative Handle:** Do not seek a moral foundation. Define "freedom" operationally as **reversibility**. Disciplinary power is hard to reverse (a criminal record); algorithmic power is fluid but totalizing. Emancipation is the capacity to introduce noise into the prediction.
  *   **Deliverable:** A conceptual paper establishing that biopower is *not* scale-invariant. The "micro-physics of power" changes when the observer is code.

  **Year 2: The University as Laboratory (Q3 + Synthesis)**
  *   **Goal:** Apply the Q1 framework to the Q3 context.
  *   **Task:** Analyze research funding and citation metrics not as "evaluation" but as "behavioral modification infrastructure."
  *   **Leverage:** Show how specific policies (e.g., open review, blind grading) fail because they assume a disciplinary logic, whereas the system operates on a modulatory logic.
  *   **Deliverable:** A diagnosis of the "Predictive University." This proves to your friend that the framework generates *new* questions (e.g., "How do we design opacity into a system designed for total transparency?") rather than just redescribing old ones.

  ### Final Recommendation

  **Treat Q1 as upstream.**
  If you cannot formally distinguish algorithmic modulation from disciplinary normalization, the rest of the project collapses into the "elegant retrospective redescription" your friend fears.

  **Treat Q2 as a constraint, not a goal.**
  Do not try to "solve" the normative vacuum. Instead, demonstrate how the *specific* constraints of algorithmic power create *specific* sites of resistance. This shifts the burden from "What is Justice?" to "Where does this specific mechanism break?"

  **Treat Q3 as your archive.**
  Since you cannot access historical archives, make the contemporary university your genealogical site. This satisfies the empirical requirement without needing external access.

  **The Coherence Check:**
  If, after Year 1, you find that algorithmic power *is* just discipline scaled up, **stop.** Pivot to a different framework (e.g., Deleuze, Simondon, or Stiegler). Continuing to force Foucault onto a logic he explicitly excluded (prediction/pre-emption) would be the scholastic refinement you want to avoid. The value of this agenda lies in its willingness to break the tool if it doesn't fit the job.
