          *   *Aggregation Problem:* Shrimp = high volume/low individual weight. Salmon = low volume/high individual weight. Weighting by individual count vs. intensity changes rankings drastically.
          *   *Proposed Solutions:*
              1.  Unified index with sentience weight (e.g., 0.3 for shrimp).
              2.  Two-track standard (Outcome for finfish, Input for crustaceans).
              3.  Hold on decapod certification.
      *   **Key Objections to Address:**
          1.  Publishing a shrimp score turns a guess into a marketing claim (greenwashing risk).
          2.  Certifying animals killed young mostly comforts buyers, doesn't help animals.
      *   **Personal Stance:** The user is okay with admitting aggregation is impossible ("isn't mush"), but needs a actionable recommendation for a vote.
