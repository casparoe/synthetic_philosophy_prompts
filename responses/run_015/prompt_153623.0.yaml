  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty. State the purpose (recommendation for the vote).
      *   **The Core Problem:** Explicitly state the Aggregation Problem. Don't hide it. Acknowledge that weighting by individual vs. biomass yields opposite results.
      *   **Evaluation of Options:**
          *   *Unified Index:* Reject. Cites the "marketing claim" risk and the lack of scientific consensus on decapod sentience weighting.
