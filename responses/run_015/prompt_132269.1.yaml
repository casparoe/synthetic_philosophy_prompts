      *   **Move 4 (Owen - Epistemic Payoff):**
          *   *Assessment:* Clearly Right.
          *   *Reasoning:* This is the core motivation for disjunctivism. The phenomenal character might be indistinguishable, but the *epistemic standing* is not. You can't know $p$ via hallucination. This distinguishes the states without requiring a "qualia" difference. It answers Nadia's demand for introspective availability correctly: metaphysical differences don't require introspective markers.
      *   **Move 5 (Nadia - Idle Wheel/Externalism):**
          *   *Assessment:* Questionable.
