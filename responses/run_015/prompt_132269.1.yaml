      *   *Move 5:* Questionable. The "Idle Wheel" charge fails because epistemic status *does* affect reasoning (you can't use hallucinations as premises for knowledge). The "Experience + World" package is less parsimonious for singular thought.
      *   *Move 6:* Largely Right. Singular thought is the hardest hurdle for common factor views.

  7.  **Final Polish:**
