      *   *What do they care about?* Suffering, moral status, withdrawal of care.
      *   *The Tension:* They treat *access* (ability to report/command) as the *proxy* for *phenomenality* (experience). When access is found neurally (fMRI), they assume phenomenality was present all along. When access is absent, they often treat for pain anyway (precautionary).
      *   *Implicit Theory:* It's not a strict identity theory (Access = Phenomenal). It's an *epistemic* reliance on Access as the only reliable marker for Phenomenal, combined with a *moral* precautionary principle regarding Phenomenal.
      *   *GWT Fit:* GWT says Access (Global Availability) *is* (or is necessary for) Consciousness. If GWT is true, "Orphaned Islands" (Phenomenal without Access) are impossible or irrelevant. If clinical practice worries about Orphaned Islands (giving analgesia to non-responders), it conflicts with strict GWT.

  3.  **Address the Three-Way Disambiguation:**
      *   *Block's Access Consciousness:* A representation is available for use in reasoning/speech.
      *   *Global Broadcast (GWT):* The *mechanism* (neuronal ignition) that supposedly realizes Access.
      *   *Behavioral Responsiveness:* The *observable output* (blinking, moving) used as the *measure* of Access.
      *   *Collapse:* Clinicians treat Behavioral Responsiveness as the proof of Access, and Access as the proof of Phenomenality.

  4.  **Analyze the Thought Experiments:**
      *   *Case 1: Silent Broadcast.* GWT intact, but no output (behavioral or neural signature).
