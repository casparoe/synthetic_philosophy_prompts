      *   *The Cases:* Analyze Silent Broadcast (Practice fails to detect) vs. Orphaned Island (Practice treats as conscious despite GWT saying otherwise).
      *   *Load Bearing:* Orphaned Island reveals the rift between GWT metaphysics and Clinical Ethics.
      *   *Underdetermination:* Acknowledge that precautionary behavior looks the same whether you believe in Orphaned Islands or just fear being wrong about Access.

  8.  **Drafting the JSON:**
