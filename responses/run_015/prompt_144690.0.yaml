      *   Check constraints (one sentence for practice_core, specific keys).
      *   Ensure the logic in the JSON matches the prose.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Practice *rejects* GWT. Practice uses GWT *tools* (fMRI). But Practice's *ethical* stance (treat for pain even if no access) contradicts GWT's *metaphysical* stance (no access = no consciousness).
      *   *Nuance:* The prompt asks if practice presupposes identity. I should argue it presupposes *correlation* for diagnosis, but *possibility of divergence* for ethics.
      *   *Silent Broadcast:* If there is *no measurable signature*, practice *cannot* diagnose consciousness. This highlights the epistemic limit.
      *   *Orphaned Island:* This highlights the metaphysical/ethical divergence.
      *   *Load Bearing:* Orphaned Island is more critical because it challenges the *treatment* protocol, whereas Silent Broadcast just challenges *diagnostic accuracy*. The prompt asks which shows what practice is *committed to*. The commitment to treating pain in non-responders shows a commitment to the *possibility* of Phenomenality without Access.

  10. **Final Review against Constraints:**
      *   Prose first.
      *   JSON at the end.
