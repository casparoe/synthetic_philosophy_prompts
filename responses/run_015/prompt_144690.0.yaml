answer: |-
  The clinical practice you describe is not operating on a single, coherent metaphysical theory of consciousness; rather, it operates on a hybrid of epistemic reliance on access and a moral precautionary principle regarding phenomenality. To reconstruct the implicit theory, we must first disentangle the three concepts you noted are being collapsed. **Block's Access Consciousness** is a functional state where a representation is available for reasoning and rational control of speech. **Global Broadcast** is the specific neurocomputational mechanism (ignition, widespread availability) proposed by GWT to *realize* access. **Behavioral Responsiveness** is the observable output (movement, eye blink) used as the *measure* of access. In the clinic, these are treated as a chain of equivalence: Behavior proves Access, Access proves Broadcast, and Broadcast is taken as the proxy for Phenomenal Consciousness. However, the practice breaks this chain when it administers analgesia to non-responders; here, they admit that Phenomenality might exist without Behavior or detectable Access.

  The practice does not presuppose the identity of phenomenal consciousness with access. If it did, the administration of analgesia to patients diagnosed as lacking access (unresponsive wakefulness syndrome) would be irrational waste. Instead, the practice presupposes a high correlation between access and phenomenality for *diagnostic* purposes, but treats the link as fallible for *ethical* purposes. The "retroactive" attribution of consciousness when fMRI covert awareness is found ("they were trapped the whole time") suggests a realist commitment: the consciousness existed prior to detection, implying access was present neurally even if behaviorally absent. This aligns with GWT (neuronal ignition constitutes the consciousness), but the precautionary sedation of non-igniting patients contradicts GWT's metaphysical claim that without ignition, there is no subject to suffer. Thus, the practice is metaphysically agnostic but ethically risk-averse. It treats access as the only *reliable evidence* channel, not the *constitutive condition* of experience.

  Regarding your two cases, they perform different work in stress-testing this implicit theory. **Silent Broadcast** (intact workspace, no output/signature) exposes the *epistemic* limit of the practice. On a GWT view, this patient is conscious. The practice, however, must classify them as unconscious because its diagnostic criteria rely on measurable signatures (behavioral or neural). The practice is not "wrong" metaphysically here; it is simply blind. It cannot act on what it cannot measure. **Orphaned Island** (phenomenality without workspace/access) exposes the *metaphysical* tension. On a strict GWT view, this patient is not conscious and cannot suffer. Yet, clinical practice administers analgesia precisely because it cannot rule out this scenario. Therefore, the Orphaned Island case is load-bearing. It demonstrates that the practice is committed to the *possibility* of phenomenal consciousness without global access, which strictly rules out strong identity theories (like strict GWT) that define consciousness *as* global availability. The practice survives by treating GWT as a diagnostic tool rather than a metaphysical truth.

  If we swapped the implicit view for a **strict access-identity view**, the bedside changes would be drastic: analgesia would be withheld from non-responders (no access = no pain), and the moral urgency of finding covert awareness would vanish (if they can't access, they aren't there). Conversely, if we adopted a view where **orphaned islands are real and common**, the practice would shift toward universal sedation for all brain-injured patients regardless of diagnosis, and fMRI command-following would lose its status as the "gold standard" for moral standing, becoming merely one indicator among many. Currently, the practice is underdetermined because the precautionary principle licenses the same behavior (giving drugs) whether you believe orphaned islands are real or you simply believe your access-tests are imperfect. The metaphysics only shows up when you ask *why* we give the drugs: is it because experience *can* exist without access, or because we fear we missed the access? The former rejects GWT identity; the latter preserves it but admits epistemic failure.

