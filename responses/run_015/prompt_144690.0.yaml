      *   *Which is load-bearing?* The "Orphaned Island" case. The practice's precautionary principle (giving drugs to non-responders) admits the *possibility* of Phenomenality without Access. Strict GWT denies this possibility. Therefore, practice is incompatible with strict GWT identity claims, though it uses GWT-like tools (fMRI access) to find consciousness.

  5.  **Evaluate "Ruled Out" vs. "Merely Compatible":**
      *   *Ruled Out:* Strong Identity Theories that deny the possibility of Phenomenality without Access (if practice admits precautionary treatment for non-access). Behaviorism (purely) is ruled out because fMRI mental imagery counts as consciousness without movement.
      *   *Compatible:* Epistemic humility (we don't know), Precautionary Principle, Dual-Aspect theories where Access is the *trackable* correlate but not the *essence*.

  6.  **Analyze "What Would Change":**
