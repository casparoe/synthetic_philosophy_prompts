      *   *(b) Likelihood Availability:* If $P(\text{Message}|H)$ is known, it's standard Bayes. The debate exists *because* the problem is posed as "You are told the conditional probability is $q$," not "You received a signal generated by process $X$." It highlights the difference between *learning a fact about probabilities* vs. *learning a fact about the world*. If the mechanism is known, Bayes wins. The debate is about cases where the mechanism is opaque.
