      *   *Option C: DALYs/QALYs.* The health field already solved this pragmatically. They use time-trade-off (TTO) or standard gamble methods to anchor health states to death (0) and perfect health (1). This is essentially what the user is doing, *but* the anchoring is common (death/health) not individual (worst/best menu).
