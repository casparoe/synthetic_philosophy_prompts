      *   The "Underdetermination": You cannot get interpersonal comparability purely from individual choice data. Choice data gives $u_i$ up to positive affine transformation ($a u_i + b$). To compare $u_1$ and $u_2$, you need to fix $a$ and $b$ across individuals. Behavioral data alone doesn't fix the scaling factor $a$ across people.
