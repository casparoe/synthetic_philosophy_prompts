      *   *Doubt 1 (The Bed Net vs. Child Death):* This is the crux. By normalizing to [0,1] per person, you assume the "size" of a person's preference range is morally equivalent. But moral weight usually depends on the *absolute* magnitude of the welfare change, not the relative position within their personal menu. The normalization throws away the information needed to compare magnitudes across people.
      *   *Doubt 2 (Self-Test Linearity):* This is likely due to the "small stakes" issue or hypothetical bias. But more deeply, vNM utility is defined over *outcomes*, not just money. If the outcomes are just "money," it measures utility of money. If the outcomes are "health states," it measures utility of health. The linearity suggests the elicitation method might be flawed (hypothetical bias) or that the user's utility for money is indeed linear in that range (less likely). But the deeper issue is: does vNM utility = moral value?

  4.  **Theoretical Deep Dive (Harsanyi & Interpersonal Comparison):**
      *   Harsanyi's Utilitarianism: Assumes we *can* compare utilities. He argues for "extended sympathy" (imagining yourself in another's shoes).
