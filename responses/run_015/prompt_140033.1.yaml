      *   **Current Practice:** Using subjective wellbeing (SWB) accounting (self-reported life satisfaction $\times$ people).
      *   **User's Objection:** SWB relies on interpersonal comparisons of utility (ICU), which ordinalists say are unscientific/unmeasurable.
