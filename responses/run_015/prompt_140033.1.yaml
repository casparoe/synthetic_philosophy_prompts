          2.  *Money-Metric (with caveats):* Use a common numeraire but adjust for diminishing marginal utility of income.
          3.  *Time-Trade-Off:* Anchor to life-years.
      *   **Conclusion:** The underdetermination is real. You cannot get ICU from behavior alone. You need a normative bridge. The current SWB method might actually be *better* at capturing intensity than the proposed vNM normalization, despite the introspection noise.

  8.  **Refining the Tone:**
