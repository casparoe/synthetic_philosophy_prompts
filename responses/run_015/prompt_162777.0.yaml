  **Decomposition of Remaining Probability (0.75):**
  1.  **Coherent but empty (0.15):** The definition describes a possible metaphysical structure, but nature contains no such intrinsic non-representational properties.
  2.  **Conjuncts come apart (0.25):** The four marks are real but belong to different phenomena; no single feature satisfies all four simultaneously.
  3.  **No determinate reference (0.35):** The term is verbally confused or picks out a shifting cluster, making disputes partly linguistic rather than factual.

  **Sub-question Probabilities and Justifications:**

  1.  **Strawman Definition (0.4):** There is a 40% chance elimination arguments attack a conjunctive definition nobody holds. While some defenders soften the view, the intuitive force of qualia relies on the strong conjunctive package, making the strawman charge only partially effective.
  2.  **Exhaustive Representationalism (0.6):** There is a 60% probability all phenomenal character is exhausted by representational content. Most phenomenological variance tracks environmental features, suggesting no intrinsic residue remains once representation is accounted for.
  3.  **Phenomenal Drift Undermines Authority (0.7):** There is a 70% probability drift undermines the authority clause. If subjects cannot verify identity across time, claims of immediate authority over experience become unverifiable and suspect even for the present moment.
  4.  **Inversion Tomography Vindicates Qualia (0.2):** There is a 20% probability such technology vindicates intrinsic qualia. Neural classifiers map structural relations and functional roles, leaving the intrinsic-and-ineffable notion as quined as before.

  **Combination and Sensitivity:**

