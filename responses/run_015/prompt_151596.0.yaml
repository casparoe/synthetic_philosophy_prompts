answer: |-
  This is a sharp set of constraints. You are asking for the architectural blueprints of a moral theory that survives the particularist critique without collapsing into arbitrariness or secretly reinstating generalism through the back door.

  Here is the full desiderata list for a theory of moral reasoning compatible with robust moral particularism, followed by the analysis of the asymmetrical remainder problem and the consistency checks you requested.

  ### I. The Core Desiderata

  A particularist-compatible theory of moral reasoning must satisfy requirements across three domains: Metaphysical (how reasons exist), Epistemological (how we know them), and Psychological (how we process them).

  **1. Contextual Valence Switching (Metaphysical)**
  *   **Requirement:** The theory must allow a feature (e.g., "breaking a promise," "causing pain") to function as a reason for action in one context, a reason against action in another, and be morally irrelevant in a third.
  *   **Case Handling:** It must explain why kindness is a virtue when comforting the grieving but a vice (cruelty) when comforting a tyrant seeking confidence to oppress. It cannot treat "kindness" as having a fixed positive valence that is merely "outweighed" in the tyrant case; the valence itself must flip.

  **2. Holistic Interaction (Metaphysical)**
  *   **Requirement:** The theory must model reasons as non-additive. The presence of Reason B can alter the moral weight or even the existence of Reason A.
  *   **Distinction:** It must distinguish between **Silencing** (a feature fails to generate a reason due to context), **Disabling** (a feature would generate a reason but is blocked), and **Outweighing** (the reason exists but is overridden).
  *   **Why it matters:** If you treat all conflicts as "outweighing," you imply the reason is always present, which leads to excessive moral residue (see Section IV). If you treat them all as "silencing," you lose the ability to explain regret.

  **3. Case-Based Competence (Epistemological)**
  *   **Requirement:** The theory must explain how agents navigate new cases without subsuming them under universal principles. It must rely on **similarity metrics** rather than **subsumption**.
  *   **Mechanism:** Reasoning proceeds by comparing the current case to a repository of prior cases (paradigms), assessing relevant similarities and differences, rather than deducing conclusions from major premises.

  **4. Defeated vs. Absent Reasons (Epistemological)**
  *   **Requirement:** The theory must track reasons that are *defeated* differently from reasons that are *absent*.
  *   **Case Handling:** In the promise-breaking case (breaking a promise to save a life), the promise does not vanish. It remains a moral feature that requires explanation. If the theory treats the promise as "absent" because the life was saved, it cannot explain why an apology is still owed. If it treats it as "defeated," it must explain why the duty to apologize persists even if the duty to keep the promise did not.

  **5. Cognitive Plausibility (Psychological)**
  *   **Requirement:** The reasoning model must align with dual-process cognitive science.
      *   **System 1:** Fast, pattern-recognition based moral intuition (matching current case to stored prototypes).
      *   **System 2:** Slow, deliberative adjustment when the case is novel or conflicting.
  *   **Constraint:** The theory cannot require agents to perform calculations of "moral weight" that exceed working memory limits. It must explain how we make holistic judgments without explicitly summing variables.

  **6. Normative Stability without Codification (Epistemological)**
  *   **Requirement:** The theory must explain why morality isn't random. If there are no principles, why do we agree on most cases?
  *   **Solution:** Stability arises from shared human forms of life and shared cognitive architectures for pattern recognition, not from shared adherence to rules. The theory must explain how moral *training* works without appealing to rule-learning (i.e., training is calibration of perception, not memorization of codes).

  ---

  ### II. The Asymmetrical Moral Remainder Problem

  This is the specific sticking point you identified.
  *   **The Scenario:** You betray a friend to save a group of strangers. You make the particularist call that saving the strangers was the right thing to do.
  *   **The Phenomenon:** You feel moral residue (guilt/regret) regarding the friend, but little to no residue regarding the strangers you failed to save *more* efficiently (or the strangers you simply didn't prioritize).
  *   **The Worry:** Does this asymmetry imply a hidden generalist hierarchy (Friends > Strangers)? If particularism says "context is king," why is the residue asymmetrical?

  **Does the theory have to explain this?**
  **Yes.** It is non-negotiable. If a theory of moral reasoning cannot account for the phenomenology of moral agency (specifically regret and residue), it is descriptively inadequate.

  **Can it treat residue as non-cognitive noise?**
  **No.** If residue is just noise, moral learning becomes impossible. Residue functions as a feedback mechanism. If you feel no residue when betraying a friend, you are morally deficient (a psychopath). If you feel equal residue for the strangers, you are morally confused (impartiality gone wrong).

  **The Particularist Solution (Without Smuggling Generalism):**
  The theory must explain the asymmetry without invoking a universal rule like "Always prioritize friends." It does this by analyzing the **texture of the relationship** as a context-sensitive feature, not a ranking rule.

  1.  **Specificity of the Reason:** The reason generated by the friendship is *specific* to that individual. The reason generated by the strangers' need is *general*. When you violate the specific reason, the damage is to a concrete, existing normative bond. When you fail to maximize aid to strangers, you fail a general demand, but you do not sever a specific bond.
  2.  **The Nature of the Remainder:** The residue tracks the **uncanceled claim**, not the **wrongness of the act**.
      *   You did the right thing (all things considered).
      *   However, the friend's claim was not *nullified*; it was **overridden**. The claim persists as a debt (apology, restitution).
      *   The strangers' claim was satisfied (they were saved). There is no remaining claim to generate residue.
      *   *Correction for your scenario:* If you saved *some* strangers but not *all*, and feel no residue for the ones left behind, the particularist explains this via **salience**. The friend was salient; the distant strangers were not. The theory must account for *justified salience* vs. *bias*.
  3.  **Avoiding Generalism:** This does not smuggle in generalism because it does not claim "Friends *always* trump Strangers." It claims "In *this* context, the specific texture of the friendship generated a reason that, when overridden, left a specific kind of trace." In a different context (e.g., the friend asks you to help them commit fraud), the friendship feature might generate no reason at all (valence switch), and thus no residue would be appropriate when refusing.

  **Verdict:** The asymmetry is explained by the **persistence of the specific relational claim**, not by a hierarchical principle. The theory must model reasons as having "persistence conditions" after being overridden.

  ---

  ### III. Non-Negotiable vs. Generalist Baggage

  Here is the filtration of requirements.

  **Non-Negotiable (Particularism lives or dies by these):**
  1.  **Valence Variability:** Features must be able to change moral polarity based on context.
  2.  **Holism:** Reasons must interact non-additively.
  3.  **Perceptual Model:** Moral judgment must be modeled as a form of perception/sensitivity rather than calculation.
  4.  **Residue Explanation:** The theory must account for moral regret without admitting the action was wrong.

  **Generalist Baggage (You can discard these):**
  1.  **Codifiability:** The requirement that all moral knowledge must be statable in propositional language. (Discard: Moral knowledge can be tacit know-how).
  2.  **Transitivity of "Better Than":** The requirement that if A > B and B > C, then A > C. (Discard: In holistic contexts, C might change the valence of A).
  3.  **Symmetry of Residue:** The requirement that similar objective outcomes produce similar subjective residue. (Discard: As shown above, relational texture matters).
  4.  **Exceptionlessness:** The requirement that a valid reason must hold in all cases unless explicitly overridden by a higher rule. (Discard: Reasons can be silenced entirely).
  5.  **Transparency:** The requirement that the agent must be able to articulate *why* they decided correctly. (Discard: One can be right without being able to state the principle, similar to a native speaker knowing grammar without knowing the rules).

  ---

  ### IV. Joint Unsatisfiability Check (The Danger Zones)

  There are points where these desiderata pull against each other. A viable theory must navigate these tensions; it cannot satisfy all maximally.

  **1. Holism vs. Learnability (The "Cluelessness" Objection)**
  *   **Tension:** If reasons are truly holistic (anything can change the valence of anything else), how do we ever learn morality? If "pain" is good in one case and bad in another with no rule to tell us which, moral education seems impossible.
  *   **Conflict:** *Radical Holism* is jointly unsatisfiable with *Moral Competence*.
  *   **Resolution:** The theory must posit **Default Valences**. Features have a default polarity (pain is usually bad) that holds unless specific contextual features (enablers/disablers) intervene. This limits holism enough to make learning possible without reintroducing rigid principles. If the theory insists on *total* holism (no defaults), it fails the Cognitive Plausibility desideratum.

  **2. Cognitive Plausibility vs. Normative Stability**
  *   **Tension:** Cognitive science tells us human pattern recognition is rife with bias (proximity bias, in-group bias, availability heuristic). If moral reasoning is just pattern recognition (System 1), how do we distinguish *correct* moral perception from *bias*?
  *   **Conflict:** *Strict Naturalism* (reasoning is just how brains work) is jointly unsatisfiable with *Normative Authority* (reasoning tells us what we ought to do).
  *   **Resolution:** The theory must include a **Reflective Equilibrium** mechanism (System 2) that checks intuitive patterns against considered judgments in varied cases. It must admit that cognitive plausibility does not guarantee moral correctness; it only explains the *mechanism* of judgment. The theory fails if it claims "what feels right is right."

  **3. Moral Residue vs. Right Action**
  *   **Tension:** If I did the *right* thing (the action supported by the balance of reasons), why is there residue? Residue implies something bad happened. If something bad happened, was it truly the right thing?
  *   **Conflict:** *Monistic Conception of Rightness* (there is only one moral status for the act) is jointly unsatisfiable with *Moral Residue*.
  *   **Resolution:** The theory must adopt a **Pluralist Conception of Status**. An act can be "What ought to be done" (all things considered) while simultaneously involving "The violation of a genuine claim." The theory fails if it tries to collapse "Right Action" into "Action with no negative moral features."

  ### V. Summary of the Theory's Burden

  To work, your theory of moral reasoning must be a **Calibrated Perception Model**.

  1.  **Input:** Contextual features (not isolated facts).
  2.  **Processing:** Similarity matching against a database of prior cases (not rule application).
  3.  **Output:** A judgment of what to do + a map of **uncanceled claims** (residue).
  4.  **Constraint:** It must allow for default valences to ensure learnability, but permit exceptions without requiring a higher rule to authorize them.
  5.  **Handling the Asymmetry:** It must treat residue as the **echo of a silenced reason**, not the **shadow of a wrong act**. The friend's claim echoes because it was a specific, relational frequency. The strangers' claim did not echo because it was satisfied or was too diffuse to generate a specific harmonic in that context.

  If the theory treats residue as noise, it fails cognitive science (ignoring feedback loops). If it treats residue as proof of wrongness, it fails logic (contradicting the "right action" judgment). It must thread the needle: Residue is the cost of the holism, not the indictment of the choice.
