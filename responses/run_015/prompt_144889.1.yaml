  # Joint Statement on Affective Partial Zombies and the Conceivability Argument

  **Parties:** Camp A (Non-Physicalist/Conceivability Proponent) and Camp B (Physicalist/Identity Theorist)
  **Subject:** The metaphysical status of affective phenomenal character relative to physical-functional organization.
  **Date:** October 26, 2023

  ## 1. Agreed Claims

  We, the undersigned representatives of Camp A and Camp B, affirm the following propositions as the common ground for this collaboration:

  1.  **Definition of the Target Entity:** An "affective partial zombie" is defined as a being physically and functionally identical to a normal human being, possessing intact sensory-phenomenal character (e.g., the visual experience of red, the auditory experience of a tone) and intact cognitive-functional organization (e.g., belief formation, reasoning, memory), but lacking *affective phenomenal character*. Specifically, this entity lacks the felt valence of experience: it detects tissue damage without feeling the unpleasantness of pain, and detects reward stimuli without feeling the pleasantness of pleasure, while maintaining all normal avoidance and approach behaviors.
  2.  **Logical Form of the Argument:** Both camps agree that the conceivability argument under discussion follows this logical structure:
      *   P1: It is conceivable that an affective partial zombie exists.
      *   P2: If it is conceivable that $X$ exists, then it is metaphysically possible that $X$ exists.
      *   P3: If it is metaphysically possible that an affective partial zombie exists, then affective phenomenal properties are not metaphysically necessitated by physical-functional properties.
      *   C: Therefore, affective phenomenal properties are not metaphysically necessitated by physical-functional properties.
  3.  **Modal Distinction:** We agree on the distinction between *epistemic possibility* (a scenario is consistent with what we currently know or can coherently imagine) and *metaphysical possibility* (a scenario is compatible with the fundamental nature of reality). We agree that Camp A argues P1 entails P2, while Camp B argues P1 entails only epistemic possibility, not metaphysical possibility.
  4.  **Supervenience Base:** We agree that the "physical-functional properties" in question include all neurophysiological states, behavioral dispositions, and computational roles accessible to third-person investigation.
  5.  **Goal of Collaboration:** The objective is not to force a concession but to isolate the precise theoretical or empirical pivot points that determine the truth value of P2 and the interpretation of P1.

  ## 2. Disagreements Table

  | Feature | Camp A Formulation | Camp B Formulation | Precise Crux |
  | :--- | :--- | :--- | :--- |
  | **Conceivability** | We can form a coherent, positive conception of a being that processes nociception and exhibits avoidance behavior without the accompanying feeling of unpleasantness. This conception contains no logical contradiction. | We can form a representation of a being described as having avoidance behavior without unpleasantness, but this representation relies on incomplete concepts. We are imagining the *concept* of pain without its essence, not the *state* itself. | Does ideal conceivability track metaphysical possibility, or does it track only the independence of our concepts? |
  | **Functional Role of Affect** | Affective valence is an intrinsic quality added to a functional process. The function (avoidance) can remain constant while the intrinsic quality (unpleasantness) is removed or altered. | Affective valence is constituted by the functional role itself (e.g., the urgent motivational push). To remove the unpleasantness is to alter the functional profile, making the "partial zombie" functionally distinct from a human. | Is affective phenomenology extrinsic to the causal role, or is it identical to (or constituted by) the causal role? |
  | **Explanatory Gap** | The gap between physical description and affective feeling is ontological. No amount of physical data logically entails why a state feels unpleasant rather than neutral. | The gap is epistemic. We lack the cognitive capacity to see the identity directly, just as pre-scientific minds could not see the identity between water and H₂O, but the identity holds nonetheless. | Is the explanatory gap a sign of distinct properties or a limitation of human cognitive architecture? |

  ## 3. The Cruxes

  To resolve the disagreements above, we identify the following specific sub-questions. Resolving these would necessitate a shift in position for at least one camp.

  **Crux 1: The Nature of Phenomenal Grasp**
  Does our first-person grasp of affective states (e.g., the hurtfulness of pain) reveal the intrinsic nature of those states, or does it reveal only their functional and causal roles as presented to the subject?
  *   *Significance:* If grasp reveals only functional roles, Camp B's identity theory is supported. If it reveals intrinsic non-functional qualities, Camp A's non-physicalism is supported.

  **Crux 2: Separability of Valence and Motivation**
  Can the motivational force of a state (the drive to avoid or approach) be metaphysically separated from its phenomenal valence (the feeling of badness or goodness) while holding the physical substrate constant?
  *   *Significance:* If they are separable, the partial zombie is possible. If they are necessarily linked, the partial zombie is impossible.

  **Crux 3: The Modal Intuition Reliability**
  Is the intuition that "affective partial zombies are possible" robust under ideal reflection (i.e., does it survive when all physical facts are known), or does it dissolve when the concepts are fully regimented?
  *   *Significance:* This determines the truth of P2 in the logical form agreed upon in Section 1.

  ## 4. Adjudication Plan: Arguments and Predictions

  For each Crux, we identify specific considerations bearing on the issue and record the explicit predictions of each camp regarding the outcome of further inquiry.

  ### Regarding Crux 1 (Phenomenal Grasp)
  *   **Shared Consideration:** Introspective analysis of the experience of sudden pain. We will analyze whether the "urgency" of the pain is experienced as a separate component from the "sensation" or as identical to it.
  *   **Camp A Prediction:** Introspection will confirm that the unpleasantness is a distinct "layer" or quality that could theoretically be present without the sensory discrimination, or vice versa. Subjects will report that the "badness" feels like a property *of* the experience, not the experience *itself*.
  *   **Camp B Prediction:** Rigorous introspection will reveal that the "badness" is indistinguishable from the subject's disposition to attend to and reject the stimulus. As subjects refine their vocabulary, the intuition of a separable "feeling" will diminish, revealing it as a reification of a functional disposition.

  ### Regarding Crux 2 (Valence and Motivation)
  *   **Shared Consideration:** Clinical data on pain asymbolia and deep brain stimulation (DBS) affecting mood and valence. We will examine cases where patients report feeling pain but not minding it, or feeling pleasure without a specific object.
  *   **Camp A Prediction:** Neuroscience will identify distinct neural correlates for "sensory discrimination" and "affective valuation." We predict the discovery of physical states that carry sensory information without affective weight, confirming that affect is an add-on property that could theoretically be missing in a physical duplicate (if the duplicate lacks the specific "affect-generating" rule, which Camp A argues is not strictly functional). *Correction for precision:* Camp A predicts that we will find cases where the functional output (avoidance) is preserved via reflex or cognitive command while the affect is chemically suppressed, suggesting the affect is not necessary for the function.
  *   **Camp B Prediction:** Neuroscience will show that "pain asymbolia" involves a functional deficit in the motivational system, meaning the patient is not functionally identical to a normal human. We predict that any system exhibiting fully normal avoidance learning and protective behavior *must* instantiate the affective state, as the affect *is* the high-priority weighting of that information.

  ### Regarding Crux 3 (Modal Intuition Reliability)
  *   **Shared Consideration:** Comparative analysis with other theoretical identities (e.g., heat/molecular motion, water/H₂O). We will test whether the conceivability intuition persists when the subject is fully educated on the physical mechanisms of affect.
  *   **Camp A Prediction:** Even with complete physical knowledge, the question "Why does this physical state feel unpleasant?" will remain intelligible and open. The intuition of possibility will remain robust, unlike the intuition regarding water/H₂O.
  *   **Camp B Prediction:** The intuition of possibility relies on an incomplete understanding of the concepts. As the concept of "pain" is regimented to include its causal role, the conceivability of the partial zombie will vanish, mirroring the historical trajectory of other scientific identities.

  ## 5. Verbal Disputes and Substantive Residue

  We have identified potential verbal disputes that must be set aside to ensure our disagreement is substantive.

  1.  **Definition of "Functional Identicality":**
      *   *Potential Verbal Dispute:* If Camp B defines "functional role" to *include* the production of phenomenal reports or the internal "feeling" as a causal node, then the partial zombie is impossible by definition. If Camp A defines "functional role" strictly as input-output behavior and internal computational state transitions excluding phenomenology, the zombie is definitionally possible.
      *   *Resolution:* We agree to define "functional identicality" for the purpose of this collaboration as **input-output behavior plus internal computational/causal structure accessible to third-person physics**, explicitly excluding phenomenal character from the definition of function. This ensures the debate is not merely about the definition of "function."

  2.  **Usage of "Physical":**
      *   *Potential Verbal Dispute:* Camp A may use "physical" to mean "non-mental," while Camp B uses "physical" to mean "whatever fundamental physics posits," allowing for the possibility that phenomenality is a physical property.
      *   *Resolution:* We agree to use "physical" to refer to the ontology of completed fundamental physics. The dispute is whether affective phenomenology is *necessitated* by that ontology, not whether it is *part* of it.

  3.  **Substantive Residue:**
      *   Even after clarifying these terms, a substantive disagreement remains. Camp A maintains that the link between the physical-functional description and the affective experience is contingent (could have been otherwise). Camp B maintains that the link is necessary (could not have been otherwise), akin to identity. This is not a verbal dispute; it is a disagreement about the modal structure of reality and the limits of conceptual analysis.

  **Signed,**

  *Representative, Camp A*
  *Representative, Camp B*
