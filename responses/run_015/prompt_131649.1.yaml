answer: |-
  This is a crucial pivot for your seminar. Moving from "Look, this animal does X" to "What does a theory of animal consciousness actually owe us?" is the difference between natural history and natural philosophy.

  As requested, I'll approach this as a philosopher of mind with a footing in comparative neurobiology. I'll start by mapping the terrain of edge cases (the "stress tests"), then lay out the formal desiderata, distinguishing between methodological necessities and contested theoretical commitments. Finally, I'll highlight the tensions where current frameworks might break.

  ### Part 1: The Stress Test (Brainstorming Edge Cases)

  Before defining the theory, we have to define the data it must fit. If a theory works for a lab mouse but breaks on a honeybee, it's a theory of mammalian consciousness, not animal consciousness.

  1.  **The Decentralized Agent (Octopus):** Two-thirds of an octopus's neurons are in its arms. An arm can taste, touch, and react to stimuli even when severed (for a short time).
      *   *Challenge:* Is the consciousness centralized in the brain, or is there a "cloud" of peripheral experience?
  2.  **The Miniaturized Agent (Insects):** Bees have ~1 million neurons (humans have ~86 billion). They navigate, communicate, and potentially show optimism/pessimism biases.
      *   *Challenge:* Is there a minimum complexity threshold? If so, where? (The "Sorites Paradox" of mind).
  3.  **The Colonial Organism (Siphonophores/Portuguese Man o' War):** These are colonies of specialized zooids functioning as one animal. There is no central brain; coordination is chemical and mechanical.
      *   *Challenge:* Is there a subject of experience here? If yes, where is it located? If no, at what point in evolutionary complexity does the "subject" emerge?
  4.  **The Developmental Shift (Holometabolous Insects):** A caterpillar's nervous system is largely histolyzed (dissolved) and rebuilt into a butterfly.
      *   *Challenge:* If the caterpillar is conscious, does consciousness cease during pupation and restart? Is it the same subject?
  5.  **The Nociception/Pain Distinction (Fish/Crustaceans):** Many animals withdraw from harm (nociception) without opioid analgesics reducing the behavior (suggesting no "suffering").
      *   *Challenge:* The theory must distinguish between *reflexive avoidance* and *phenomenal pain*.
  6.  **The Split Subject (Split-brain mammals/humans):** Severing the corpus callosum can result in two independent streams of consciousness in one body.
      *   *Challenge:* Consciousness might not be inherently unified. A theory demanding unity fails here.

  ---

  ### Part 2: The Desiderata (Requirements for an Adequate Theory)

  Here is the specification list. I have tagged items as **[NN]** (Methodological Non-Negotiable: required for the theory to be scientifically/philosophically coherent) or **[C]** (Contested/Camp Preference: depends on which theory of consciousness you adopt).

  #### 1. The Substrate Constraint
  *   **Requirement:** The theory must specify whether consciousness depends on specific neuroanatomy (e.g., cortex, pallium) or functional organization (e.g., feedback loops, integration).
  *   **Reasoning:** If you require a neocortex, you exclude birds and cephalopods (who have different structures but similar cognitive outputs). If you require *any* information processing, you risk panpsychism (attributing mind to thermostats).
  *   **Status:** **[NN]** It must take a stance. **[C]** *Which* stance is the great divide (Biological Naturalism vs. Functionalism vs. IIT).
  *   **Biological Guardrail:** Cannot contradict known homologies. (e.g., You cannot claim the mammalian thalamus is irrelevant if lesioning it abolishes consciousness in mammals).

  #### 2. The Continuity Principle (Graded vs. Sharp)
  *   **Requirement:** The theory must account for evolutionary continuity. It should generally allow for gradations in the *richness* or *intensity* of experience, even if it posits a threshold for the *presence* of experience.
  *   **Reasoning:** Evolution rarely produces sharp binary switches. A theory that says "Zero consciousness in reptiles, Full consciousness in mammals" is biologically implausible.
  *   **Status:** **[NN]** for biological plausibility. **[C]** for ethical application (law often demands a binary "protected/not protected").
  *   **Nuance:** A theory can posit a sharp *threshold* (e.g., Integrated Information > Φ) while acknowledging that *content* varies widely.

  #### 3. The Boundary Problem (Individuation)
  *   **Requirement:** The theory must define what counts as a single "subject" of experience.
  *   **Reasoning:** This is where siphonophores and social insects break things. Is a hive a mind? Is a human with a gut microbiome a single mind?
  *   **Status:** **[NN]** A theory without a boundary condition cannot count minds.
  *   **Tension:** This is the hardest constraint. Most theories (like Global Workspace) assume a single organism = single subject. Colonial organisms challenge this directly.

  #### 4. The Phenomenal/Access Distinction
  *   **Requirement:** The theory must distinguish between *phenomenal consciousness* (what it feels like) and *access consciousness* (availability for reporting/action).
  *   **Reasoning:** Animals cannot report verbally. If you conflate access (reporting) with phenomenology (feeling), you will falsely conclude animals are unconscious because they can't talk.
  *   **Status:** **[NN]** Essential to avoid "behaviorist trap."
  *   **Biological Guardrail:** Must accommodate cases where access is lost but phenomenology might remain (e.g., locked-in syndrome analogues, or perhaps certain dream states in animals).

  #### 5. The Valence Constraint
  *   **Requirement:** The theory must account for affect (positive/negative feeling), not just cognition (processing).
  *   **Reasoning:** In animal welfare, we care primarily about suffering and flourishing, not just "thinking." A theory that grants an animal "thought" but no "pain" is ethically useless.
  *   **Status:** **[NN]** for welfare ethics. **[C]** for pure metaphysics (some theories focus only on awareness, not affect).

  #### 6. The "Lights On" Test (Wakefulness vs. Content)
  *   **Requirement:** Distinguish between the *level* of consciousness (wakefulness/arousal) and the *content* of consciousness (percepts).
  *   **Reasoning:** A sleeping mammal has a different level of consciousness than a waking one. An insect might have a permanently different "level" than a mammal.
  *   **Status:** **[NN]** Neurobiologically settled (brainstem arousal systems vs. cortical content).

  ---

  ### Part 3: Jointly Unsatisfiable Constraints (The Contradictions)

  You asked if there are subsets of requirements that create contradictions. Yes. This is where you will find the most fruitful seminar discussion. A theory usually survives by sacrificing one of these.

  #### 1. The "Unity vs. Decentralization" Contradiction
  *   **Constraint A:** Consciousness requires a unified phenomenal field (The "Cartesian Theater" intuition; supported by some interpretations of Global Workspace Theory).
  *   **Constraint B:** The theory must accommodate decentralized nervous systems (Octopus arms, nerve nets in jellyfish) without positing magical centralization.
  *   **The Conflict:** If consciousness *must* be unified, then either the octopus arm has no experience (counter-intuitive given its complexity) or the octopus has eight mini-minds plus a central mind (which violates our intuition of a single subject).
  *   **Resolution:** You must drop A (accept distributed consciousness, like IIT does) or restrict the theory to centralized brains (exclude cephalopods/jellyfish).

  #### 2. The "Substrate Neutrality vs. Biological Specificity" Contradiction
  *   **Constraint A:** Consciousness is substrate-neutral (Functionalism: if it computes like a mind, it is a mind).
  *   **Constraint B:** Consciousness depends on specific biological mechanisms (Biological Naturalism: only specific neurochemistry counts).
  *   **The Conflict:** If A is true, a sufficiently complex AI or a silicon-based alien is conscious. If B is true, we might never know if non-mammals are conscious because their neurochemistry differs.
  *   **Resolution:** Most comparative biologists lean toward a "Weak Substrate Neutrality": The *function* matters, but it must be implemented in a *biological-like* architecture (e.g., recurrent processing, not just feed-forward).

  #### 3. The "Evolutionary Continuity vs. Ethical Binary" Contradiction
  *   **Constraint A:** Consciousness is a graded evolutionary trait (Biology).
  *   **Constraint B:** Moral status requires a binary threshold (Ethics/Law).
  *   **The Conflict:** You cannot map a gradient perfectly onto a binary switch without arbitrariness. If consciousness is graded, at what exact Φ-value (or neuron count) does an animal gain the right not to be eaten?
  *   **Resolution:** This isn't a scientific contradiction but a policy one. The theory must deliver the gradient; the ethicists must draw the line. If the theory tries to draw the line itself, it becomes prescriptive rather than descriptive.

  ---

  ### Part 4: Settled vs. Contested (For your Seminar Notes)

  To keep your seminar honest, ensure participants know which battles are already fought and which are ongoing.

  **Fairly Settled (Consensus among experts):**
  1.  **Behavior is not enough:** You cannot infer consciousness solely from complex behavior (the "Philosophical Zombie" problem is accepted as a logical possibility, even if unlikely).
  2.  **Mammals are conscious:** There is near-universal agreement that at least mammals (and likely birds) possess some form of phenomenal consciousness.
  3.  **Neurobiology matters:** You cannot talk about mind without talking about brain/body structure. Dualism is out of the scientific framework.
  4.  **Nociception ≠ Pain:** Reflexive withdrawal is distinct from the emotional experience of suffering.

  **Genuinely Contested (Live Debates):**
  1.  **The Insect Question:** Do insects have *phenomenal* experience, or are they "auto-pilots"? (Recent work on bumblebee "play" and optimism biases pushes toward "yes," but skeptics remain).
  2.  **Theories of NCC (Neural Correlates of Consciousness):** Is it Global Workspace (information broadcasting), Integrated Information Theory (mathematical integration), or Predictive Processing (controlled hallucination)? Each yields different verdicts for fish and octopuses.
  3.  **Panpsychism vs. Emergentism:** Does consciousness emerge at a certain complexity, or is it a fundamental property of matter that amplifies? (This changes how you view simple organisms).
  4.  **The Hard Problem:** Can a physicalist theory *ever* explain why it feels like something, or will it only explain the functions?

  ### Summary Advice for the Seminar

  When someone waves a single study (e.g., "Bees roll balls, therefore they feel joy!"), hit them with **Desideratum #4 (Phenomenal/Access Distinction)**. Ask: *"Does this behavior prove they feel the joy, or just that they are programmed to seek the reward?"*

  When someone says "Only humans have consciousness because of the cortex," hit them with **Desideratum #1 (Substrate Constraint)**. Ask: *"Are you arguing for consciousness or for a specific biological implementation of consciousness? How do you account for birds?"*

  When someone asks "Is the hive conscious?", hit them with **Desideratum #3 (The Boundary Problem)**. Ask: *"What physically defines the edge of the subject?"*

  This framework forces the conversation away from "cool animal tricks" and toward "what constitutes a mind."
