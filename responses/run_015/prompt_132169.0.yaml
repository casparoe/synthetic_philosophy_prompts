answer: |-
  # Joint Statement on the Role of Cost in Honest Signalling

  **Preface**
  This statement summarizes a decade of theoretical exchange regarding the stability of honest signalling under partial conflict of interest. Our goal is not to declare a victor but to isolate the precise points of divergence, agree on the formal background, and identify the empirical or modelling tests that could resolve the dispute. We adopt the neutral labels **The Differential Cost Thesis** (holding that differential marginal cost is the necessary mechanism for stability) and **The Constraint and Verification Thesis** (holding that differential cost is a frequent byproduct of other stabilizing mechanisms).

  ## 1. Agreed Claims

  Both parties endorse the following propositions as the foundation for further debate:

  1.  **Taxonomy of Cost:** We distinguish four distinct notions of cost often conflated in literature:
      *   *Absolute Production Cost:* The total fitness reduction incurred by producing a signal of a given intensity.
      *   *Marginal (Differential) Cost:* The rate at which production cost increases with signal intensity, specifically as it varies with signaller quality. The Differential Cost Thesis asserts that at equilibrium, this marginal cost must decrease as quality increases.
      *   *Counterfactual Cost:* The cost a lower-quality mimicker *would* incur were it to produce the signal typical of a higher-quality type. This includes costs imposed by post-hoc retaliation.
      *   *Currency:* Costs may be measured in immediate resources, opportunity, or ultimate fitness. We agree fitness is the ultimate currency, but resource costs often serve as proxies in models.
      *   *Attribution:* The Differential Cost Thesis concerns *Marginal Cost*. The Constraint and Verification Thesis concerns *Counterfactual Cost* and the physical/developmental mechanisms that generate it.

  2.  **Game-Theoretic Background:**
      *   Both sides accept standard signalling game formalism.
      *   Both agree that under strict conflict of interest and common knowledge of types, freely chosen costless signals ("cheap talk") cannot sustain honesty at equilibrium.
      *   Both agree that whether biological signallers possess access to a cost-free channel is an empirical and developmental question, not a theorem of game theory. A signal may be physiologically costless to produce but still carry fitness consequences via receiver reaction.

  3.  **Empirical Correlation:** Both sides agree that in many natural systems, high-quality individuals bear lower absolute costs for high-intensity signals than low-quality individuals. The dispute concerns whether this correlation is the *cause* of stability or a *consequence* of other stabilizing factors.

  4.  **Function of the Receiver:** Both sides agree receivers must evolve to attend to signals only when doing so yields a net fitness benefit, and that receiver psychology/physiology constrains the signalling equilibrium as much as signaller physiology does.

  ## 2. Disagreements Table

  | Disputed Claim | Formulation (Differential Cost Thesis) | Formulation (Constraint and Verification Thesis) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Source of Stability** | Honesty is stabilized *because* the marginal cost of signalling is lower for high-quality types. This cost structure prevents mimicking. | Honesty is stabilized by constraints, indices, or verification. The marginal cost structure is a downstream consequence of these constraints, not the primary stabilizer. | **Substantive** |
  | **Necessity of Differential Cost** | For continuous qualities and partial conflict, differential marginal cost is a *necessary* condition for a stable honest equilibrium. | Differential marginal cost is *sufficient* but not necessary. Honesty can persist via hard constraints or enforcement even if marginal costs are identical across types. | **Substantive** |
  | **Definition of 'Handicap'** | A handicap is strictly a signal satisfying the differential marginal cost condition. If the condition fails, it is not a handicap. | A handicap is any signal that reduces fitness relative to not signalling. The marginal cost condition is a specific subtype, not the definition. | **Verbal** |
  | **Role of Retaliation** | Receiver retaliation functions by altering the signaller's cost function to satisfy the differential cost condition. | Receiver retaliation is a distinct mechanism (enforcement) that operates independently of production cost structures. | **Verbal/Substantive** |
  | **Surviving Question** | *N/A* | *N/A* | **Substantive Core:** Can an honest signalling equilibrium be maintained if the marginal cost of signalling is identical for all quality types, provided other constraints (physical or social) remain in place? |

  *Note on Verbal Disagreements:* Where the dispute is verbal (e.g., definition of 'Handicap'), the substantive question survives by asking whether the *mechanism* of stability relies on the cost function's slope or on external constraints. We agree to use "Handicap" only when referring to the Differential Cost Thesis to avoid ambiguity.

  ## 3. Crux Table

  The following tests identify where our predictions diverge. We commit to updating our views based on the outcomes described.

  | Crux | Question | Test Case / Model Variation | Prediction (Diff. Cost Thesis) | Prediction (Constraint & Verif. Thesis) | Condition for Moving |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Separability** | Can signal-quality correlation be fixed while differential cost is removed? | A model where signal production costs are identical across types, but a physical constraint prevents low-quality types from producing high signals. | System collapses; low-quality types will mimic until signal becomes uninformative. | System remains stable; constraint prevents mimicking regardless of cost slope. | **Diff. Cost:** Accept stability without differential cost.<br>**C&V:** Accept collapse if constraint is permeable. |
  | **Subsidized Signal** | What happens if production cost is externally paid? | A mutant arises that produces the full signal at negligible marginal cost (or cost is subsidized by a third party), changing no other traits. | Honesty collapses; the mutant invades and degrades signal information. | Honesty persists if the subsidy does not bypass the underlying constraint or verification mechanism. | **Diff. Cost:** Accept persistence if constraint holds.<br>**C&V:** Accept collapse if cost was the only barrier. |
  | **Perceptibility** | Do amplifiers require differential cost? | A trait evolves that makes an existing hard-to-fake cue easier to perceive, without adding production burden. | Unstable unless the amplification itself carries a differential cost. | Stable, because the underlying cue remains hard to fake; amplification is parasitic on the index. | **Diff. Cost:** Accept stability of cost-free amplifiers.<br>**C&V:** Accept instability if cue becomes decoupled. |
  | **Enforcement** | Is punishment a cost mechanism? | All production costs are zero; fitness costs are imposed solely by receiver retaliation upon verification of dishonesty. | This *creates* a differential cost structure effectively; it is a subset of the Handicap logic. | This is a distinct mechanism (enforcement); production cost slopes are irrelevant here. | **Diff. Cost:** Acknowledge enforcement as distinct from production cost.<br>**C&V:** Acknowledge enforcement mathematically mimics differential cost. |
  | **Origin vs. Maintenance** | Do the theses address the same timeframe? | Evolutionary simulation tracking the *invasion* of a signalling system vs. its *maintenance* at equilibrium. | The differential cost condition is required for both origin and maintenance. | Different mechanisms may drive origin (e.g., sensory bias) vs. maintenance (e.g., constraint). | **Diff. Cost:** Accept distinct origins.<br>**C&V:** Accept differential cost is required for maintenance. |
  | **Model Dependence** | Is the dispute biological or mathematical? | Compare discrete vs. continuous quality variables; additive vs. multiplicative cost functions. | The necessity of differential cost holds across model specifications. | The necessity disappears in discrete models or specific cost-benefit combinations. | **Diff. Cost:** Accept limit cases where cost is not required.<br>**C&V:** Accept general principle holds in continuous limits. |

  *Note on Predictive Convergence:* We flag that in the **Enforcement** crux, both sides may predict the same outcome (stability via punishment). This test cannot settle the dispute unless we agree on whether punishment *counts* as satisfying the Differential Cost Thesis. We agree it does not settle the definition, only the outcome.
  *Note on Entrenchment:* On the **Model Dependence** crux, there is a risk neither side will move, as each may attribute the result to model artifacts. We agree to treat robustness across model types as evidence for the biological reality of the mechanism.

  ## 4. What Neither Side Holds

  To prevent the recurrence of strawman arguments in this volume, we explicitly reject the following attributions:

  1.  **The Differential Cost Thesis does not hold:**
      *   That all signals must be costly in absolute terms (only marginal differences matter).
      *   That signaller and receiver interests must be strictly opposed (partial conflict is sufficient).
      *   That costs must be measured in energy (fitness is the metric).
      *   That receivers are passive; receiver choice is part of the equilibrium.

  2.  **The Constraint and Verification Thesis does not hold:**
      *   That cost is irrelevant to signalling evolution (cost is often a correlate, just not the driver).
      *   That all signals are indices or constraints (costly signalling is admitted as one pathway among many).
      *   That receivers can verify quality perfectly without cost (verification itself is subject to selection).
      *   That "honesty" implies moral intent (it refers only to statistical correlation between signal and type).

  3.  **Both sides reject:**
      *   That group selection is required to maintain honesty.
      *   That signallers consciously calculate costs (mechanisms are evolutionary, not cognitive).
      *   That a single theory must explain all signalling systems across taxa.

  We submit this statement to clarify the terrain. The path forward lies not in redefining terms, but in constructing the specific models and empirical tests outlined in the Crux Table.
