  # JOINT STATEMENT ON THE PROVENCE AND AUTHORITY OF HISTORICAL NARRATIVE
  **Produced by the Adversarial Collaboration on Historiographical Bias**
  **Date:** October 24, 2023
  **Signatories:** [The Archival Objectivist] & [The Power-and-Narrative Constructivist]

  ### I. AGREED PROPOSITIONS
  *After twelve months of dialogue, we affirm the following claims as the common ground necessary to sustain our disagreement.*

  1.  **Ambiguity of the Thesis:** The slogan "History is written by the victors" conflates two distinct claims: a *causal* claim regarding the production and preservation of sources (sociology of archives), and an *epistemic* claim regarding the justification of historical belief (philosophy of knowledge). We agree that failing to distinguish these leads to category errors.
  2.  **Asymmetry of the Record:** We agree that the immediate post-conflict documentary record is quantitatively dominated by the victor's state apparatus (military logs, diplomatic cables, administrative census). However, we also agree that this asymmetry often reverses or complicates over time, as defeated parties frequently generate high-volume exculpatory literature (memoirs, diaries, oral histories) that survives due to private preservation networks.
  3.  **Capacity for Correction:** We agree that professional historiography has demonstrably overturned specific factual claims made by victorious powers. We cite as evidence the revision of strategic bombing efficacy in WWII via post-Cold War Soviet archives, and the correction of colonial demographic estimates via archaeological evidence. We disagree on whether these corrections alter the underlying *narrative structure* or merely the *data points* within a victor-defined framework.

  ### II. RESIDUAL DISAGREEMENTS
  *Where we diverge on the interpretation of the agreed propositions.*

  | Domain of Dispute | The Archival Objectivist Formulation | The Power-and-Narrative Constructivist Formulation |
  | :--- | :--- | :--- |
  | **The Locus of Bias** | Bias operates primarily at the level of **selection and emphasis**. The victor chooses which facts to highlight, but the raw material (dates, casualty counts, treaty texts) exerts a negative constraint on what can be plausibly asserted. | Bias operates primarily at the level of **categorization and ontology**. The victor defines what counts as an "event," a "combatant," or a "massacre," rendering alternative descriptions unintelligible rather than merely unemphasized. |
  | **Efficacy of Source Criticism** | Source criticism is a **corrective technology**. By triangulating victor records with subaltern archives and material evidence, the historian can isolate the victor's ideological distortion from the event itself. | Source criticism is a **bounded practice**. It operates within the periodization and agent-structures established by the victor; it can refine the picture but cannot escape the frame in which the picture is drawn. |
  | **Currency of Accounts** | The longevity of a historical account tracks its **evidential density**. Victor narratives persist initially due to prestige, but decay if they fail to accommodate new material evidence. | The longevity of a historical account tracks its **institutional utility**. Victor narratives persist because they legitimize current geopolitical arrangements, regardless of evidential friction. |

  ### III. CRUXES AND TESTABLE PREDICTIONS
  *We identify three specific points of contention where empirical investigation could shift our credences. For each, we specify the evidence to be examined and our respective predictions.*

  #### Crux 1: The Losers-Litigation Asymmetry
  **The Issue:** Does the "tragedy premium" (the cultural circulation of defeat narratives) counteract the "victor's archive"?
  **The Test:** A citation and translation analysis of post-conflict historiography (specifically the US Civil War and the Franco-Prussian War) over a 100-year span. We will measure the ratio of "Victor Official Records" vs. "Defeated Memoirs" in academic bibliographies and public syllabi.
  **Predictions:**
  *   **Objectivist:** Defeated party memoirs will be cited frequently but **tagged as subjective**. The *factual baseline* of the narrative will remain anchored in victor records. (Pattern: High citation of losers, low adoption of loser *facts*).
  *   **Constructivist:** Defeated party memoirs will shape the **moral vocabulary** of the history. Even if facts are corrected, the *questions asked* (e.g., "Why did they lose?" vs. "Why did they fight?") will follow the defeated party's defensive framing. (Pattern: High citation of losers, high adoption of loser *categories*).

  #### Crux 2: The Self-Critical Victor
  **The Issue:** Does state-sponsored admission of wrongdoing falsify the thesis, or does it represent a sophisticated adaptation of power?
  **The Test:** Comparative analysis of official state historiography following moral reckoning (e.g., Post-1968 West Germany, Post-1990s Canada regarding Indigenous schools).
  **Predictions:**
  *   **Objectivist:** These cases **falsify the strong thesis**. If history were written by victors to justify power, victors would suppress damaging evidence. The inclusion of damaging facts proves evidence constrains power.
  *   **Constructivist:** These cases **confirm the nuanced thesis**. Admitting past sin is a strategy to secure current moral authority. The narrative structure remains "Victor as Moral Arbiter," merely shifting from "Victor as Innocent" to "Victor as Penitent." The *agency* remains with the victor.

  #### Crux 3: The Mechanism of Belief (Causal vs. Epistemic)
  **The Issue:** Is the dispute merely verbal? Does "written by" mean "caused us to believe" or "entitles us to believe"?
  **The Test:** Analysis of textbook revisions in post-regime change states (e.g., Eastern Europe 1990–2000). We will track the speed of narrative change relative to the opening of archives.
  **Predictions:**
  *   **Objectivist:** Narrative change will lag **archive access**. Historians will wait for new evidence before altering the text. This proves the belief is epistemically driven (evidence-based).
  *   **Constructivist:** Narrative change will lag **institutional turnover**. Textbooks will change only when the *personnel* of the education ministry change, regardless of archive access. This proves the belief is causally driven (power-based).

  ### IV. CONFIDENCE NOTE AND REFLECTION
  *Authored jointly for the appendix of this statement.*

  We estimate a **85% probability** that a genuine adherent of the Archival Objectivist camp would sign Section I and II without reservation. The formulations there respect the constraint of material evidence which is central to their position.

  We estimate a **70% probability** that a genuine adherent of the Power-and-Narrative Constructivist camp would sign Section I without reservation. There is a risk that Proposition I.3 ("Capacity for Correction") implicitly validates an objective standard of "correction" that a radical constructivist might reject as merely swapping one regime of truth for another.

  **Least Sure Formulation:**
  We single out **Section I, Proposition 3**: *"We agree that professional historiography has demonstrably overturned specific factual claims made by victorious powers."*
  *Reason for uncertainty:* While the Objectivist signs this easily, the Constructivist signs it only with the private reservation that "factual claims" are themselves theory-laden. A more rigorous Constructivist might argue that overturning a "claim" is simply the imposition of a new vocabulary, not a correction toward truth. We retained this phrasing to allow the collaboration to proceed, but flag it as the most likely point of future fracture.
