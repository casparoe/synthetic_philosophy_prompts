answer: |-
  Here is a complete design for your session. It is built to maximize the experiential tension between linear expectation and geometric growth without relying on formulas until the debrief.

  ### 1. Design Notes & Market Validation

  **Your Kelly Fractions:**
  You calculated correctly.
  *   **60/40 @ Even:** $f^* = 20\%$. (The Anchor)
  *   **20% @ 5-to-1:** $f^* = 4\%$. (The Longshot)
  *   **50/50 @ 0.9-to-1:** $f^* = 0\%$. (The Trap)
  *   **90/10 @ Even:** $f^* = 80\%$. (The Confidence)

  **Critique of Market 3 (50/50 @ 0.9-to-1):**
  This market has **Negative Expected Value** ($0.5 \times 0.9 - 0.5 \times 1 = -0.05$). An Expected Value (EV) maximizer *also* refuses this bet. It does not create tension between EV and Growth; it only tests if participants understand basic EV.
  *   **Recommendation:** If you can swap one market, replace Market 3 with a **High-Leverage Positive EV** bet. Example: **55% chance to win 2-to-1**.
      *   EV is positive ($0.55 \times 2 - 0.45 = 0.65$), so an EV maximizer bets 100%.
      *   Kelly is $\approx 32.5\%$.
      *   This creates the specific divergence you want (EV says "All-In," Growth says "Wait").
      *   *If you must keep the 0.9-to-1 market:* Use it as a "Sanity Check" round. In the debrief, explicitly state that this round did not separate EV from Growth, but filtered out those who confuse probability with edge.

  **The Finale (Two Markets at Once):**
  Yes, offer two markets simultaneously in the final block.
  *   **Configuration:** Two **independent** 60/40 @ Even bets available each round.
  *   **Rule:** Participants can split their stake however they like between the two (e.g., 10% on A, 10% on B).
  *   **Lesson:** Kelly applies to the *portfolio*, not the individual bet. The optimal move is 20% on A and 20% on B (40% total exposure). This teaches that "diversification" allows for higher aggregate risk, but overbetting the *sum* still leads to ruin. Do not correlate them; independence teaches the aggregation principle best.

  **Incentives:**
  The tension between the **Individual Leaderboard** (Arithmetic Max) and the **Group Donation** (Geometric Mean) is the **best part of the design**. Do not hide it.
  *   **Announce at Start:** "One of you will win a prize for the highest final bankroll. But the donation to the charity chosen by that winner depends on the *geometric mean* of everyone's performance. If you go bust, you hurt the donation."
  *   **Why:** This externalizes the internal mathematical conflict. The "Lucky All-In" player wins the prize but tanks the donation. The "Kelly" players save the donation but likely lose the prize. This sparks the post-game argument that cements the learning.

  **Withdrawal Mechanic ("Tuition"):**
  Include it. It clarifies that bankroll is for *living*, not just scoring.
  *   **Rule:** Every 5 rounds, all players must pay 10% of their *current* bankroll into a "Tuition" pot. If you cannot pay, you are eliminated (bankrupt).
  *   **Why:** It makes "paper wealth" irrelevant. If you have \$1M on paper but \$0 cash because you are overbet, you can't pay tuition. It punishes volatility more than simple ruin does.

  **Rounds & Visibility:**
  You need **30 to 40 total bets** for the Law of Large Numbers to visibly separate the median from the mean.
  *   **Pacing:** You need 3 minutes per round (Bet writing -> RNG -> Calc -> Record).
  *   **Total Gameplay:** ~90 minutes.
  *   **Feasibility:** This is tight for 2 hours. You must be ruthless with timekeeping. Use a projected timer.

  ---

  ### 2. Materials & Setup

  *   **Projector:** Display a live random number generator (e.g., Random.org integer generator) and a timer.
  *   **Whiteboard:** Track the "Tuition" countdown and the current Round Number.
  *   **Index Cards:** 3 per person. Used to submit bets secretly.
  *   **Bankroll Sheets:** A simple printed grid for each player to track: `Start | Bet % | Result | End | Tuition`.
  *   **Calculators:** Phones are fine.
  *   **Starting Bankroll:** Assign everyone **1,000 Units**. (Abstract units avoid currency confusion).
  *   **Prizes:**
      1.  **Individual:** \$50 voucher (or equivalent) to the highest final bankroll.
      2.  **Group:** Donation = $\$10 \times \text{Geometric Mean}(\text{Final Bankroll} / 1000)$.
      *   *Note:* If the Geometric Mean is 1.0 (no growth), donation is \$10. If it's 2.0, donation is \$20. If half the room goes bust (0), the Geometric Mean is 0, and the donation is \$0.

  ---

  ### 3. Timeline & Script (120 Minutes)

  **0:00 – 0:10 | Introduction & Incentives**
  *   **Say:** "Welcome. For the next 90 minutes, you are traders. You start with 1,000 Units. There are two ways to win today. First, the person with the most units at the end wins a prize. Second, the group will unlock a donation to a charity of that winner's choice. The size of the donation depends on how well *everyone* grew their account, specifically the geometric average. If the group average growth is zero, the donation is zero. If anyone goes to zero, the donation is zero."
  *   **Say:** "You will face different markets. In each round, write down the *percentage* of your current bankroll you wish to wager on the Index Card. Hand it to me. I will resolve the market publicly. You calculate your new balance. Every 5 rounds, you pay 10% tuition."
  *   **Constraint:** "No formulas on the board. No talking about strategy during rounds."

  **0:10 – 0:35 | Block 1: The Anchor (60/40 @ Even)**
  *   **Market:** 60% chance to double stake, 40% chance to lose stake.
  *   **Rounds:** 10 Rounds.
  *   **RNG:** Projector generates integer 1–100. 1–60 = Win.
  *   **Tuition:** Collect after Round 5.
  *   **Observation:** Watch for the "All-In" players. Watch for the "Fixed Amount" errors (betting 100 units instead of 10%).
  *   **Script (Round 1):** "Market A. 60% Win, Even Money. Submit bets."
  *   **Script (Round 6):** "Tuition time. Calculate 10% of your *current* holding. Deduct it. If you can't pay, you're out."

  **0:35 – 0:45 | Break**
  *   Allow them to compare notes. This is where the "I'm up 500%" vs "I'm down 50%" conversations happen.

  **0:45 – 1:05 | Block 2: The Extremes (90/10 & 20/5x)**
  *   **Rounds 11–15 (Market 4):** 90% Win @ Even Money.
      *   **Say:** "Market B. 90% Win, Even Money."
      *   **Lesson:** Kelly says bet 80%. EV says bet 100%. This teaches that Growth isn't always "timid."
  *   **Rounds 16–20 (Market 2):** 20% Win @ 5-to-1.
      *   **Say:** "Market C. 20% Win, Pays 5-to-1."
      *   **Lesson:** Kelly says bet 4%. EV says bet 100%. This teaches that high payout does not mean high stake.

  **1:05 – 1:25 | Block 3: The Trap & The Portfolio**
  *   **Round 21 (Market 3):** 50% Win @ 0.9-to-1.
      *   **Say:** "Market D. 50% Win, Pays 0.9-to-1."
      *   **Action:** Most should bet 0. If someone bets, note it.
  *   **Rounds 22–26 (The Split):** Two independent Market A opportunities (60/40 Even) per round.
      *   **Say:** "Two independent opportunities this round. You may split your stake. Write '% on Left' and '% on Right'."
      *   **RNG:** Roll two dice or two random numbers.
      *   **Lesson:** Optimal is 20% Left, 20% Right. Total exposure 40%.

  **1:25 – 2:00 | Debrief & Reveal**
  *   **Step 1: The Leaderboard.** Announce the winner. Ask them: "What was your strategy?" (Likely: "I bet big early.")
  *   **Step 2: The Donation.** Calculate the Geometric Mean. Announce the donation amount. (Likely: Disappointingly low due to busts).
  *   **Step 3: The Graph.** Draw a whiteboard sketch. X-axis = Time, Y-axis = Log(Wealth). Draw the "Lucky All-In" line (steep up then flat zero) vs. the "Kelly" line (steady slope).
  *   **Step 4: The Reveal.** Now write the Kelly formula. Show the fractions (20%, 80%, 4%, 0%).
  *   **Step 5: The Discussion.** Connect their feelings to the math.

  ---

  ### 4. What Will Go Wrong (And How to Handle It)

  1.  **The Lucky All-In Winner:**
      *   *Scenario:* One student bets 100% on Block 1, gets lucky, wins the Individual Prize.
      *   *Reaction:* They will feel validated. "EV works."
      *   *Fix:* In the debrief, point to the Donation. "You won the prize, but your strategy destroyed the group's donation. The EV maximizer wins the lottery; the Growth maximizer builds the wealth. Which one is sustainable?"
  2.  **Fixed Amount Confusion:**
      *   *Scenario:* Students bet "100 units" every round instead of "10%".
      *   *Fix:* During Round 1, walk around and check cards. If you see "100", correct them verbally: "Remember, percentage of *current* bankroll."
  3.  **Boredom Betting on Market 3:**
      *   *Scenario:* Students bet on the Negative EV market just to "play the game."
      *   *Fix:* In debrief, ask: "Who bet on Market D?" Ask them why. Highlight that *discipline* (betting zero) is a valid and often optimal position.
  4.  **The Leaderboard Gamer:**
      *   *Scenario:* A student realizes the Donation is separate and ignores it to maximize their own rank.
      *   *Fix:* Acknowledge this. "This is rational for you, irrational for the group. This is exactly the 'Tragedy of the Commons' that Growth Rate optimization solves in nature. You acted like a gene trying to maximize replication; the group needed to act like an organism trying to survive."
  5.  **Calculation Drift:**
      *   *Scenario:* By Round 20, bankrolls are weird decimals ($1,432.87).
      *   *Fix:* Tell them to round to the nearest integer. Small errors don't matter for the lesson.

  ---

  ### 5. What The Game Cannot Reproduce (You Must Supply This)

  The game is a simulation; you must provide the theoretical bridge in the debrief.

  1.  **Asymptotics:** The game is only 26 rounds. Kelly is an *asymptotic* optimizer (infinite time).
      *   *Say:* "In 26 rounds, luck still matters. Kelly guarantees dominance over *infinite* time. In the short run, a lucky idiot can beat a genius. In the long run, the idiot goes extinct."
  2.  **Known Probabilities:** In the game, $p=0.6$ is God's truth. In reality, we estimate $p$.
      *   *Say:* "Because you knew the odds perfectly, Full Kelly was mathematically safe. In real life, you don't know the odds. If you think $p=0.6$ but it's actually $0.55$, Full Kelly will ruin you. This is why practitioners use 'Half-Kelly'—to buffer against estimation error."
  3.  **Non-Repeatable Opportunities:** Kelly assumes you can keep betting.
      *   *Say:* "If this was a one-shot bet (e.g., a startup exit), Growth Rate maximization might be wrong. If you need \$1M to save a life and you have \$500k, you don't bet 20%. You bet what's required to hit the target. Kelly is for repeatable games, not Hail Marys."

  ---

  ### 6. Deception & Parameter Uncertainty

  **Do not deceive the room.**
  Do not secretly change the probabilities (e.g., make it 55% instead of 60%).
  *   **Reason:** If they find out (and statisticians will suspect), you lose credibility.
  *   **Alternative:** Teach "Parameter Uncertainty" explicitly in the debrief.
  *   **Script:** "Imagine I lied, and the win rate was actually 55%. The 20% bettors would still grow. The 100% bettors would still eventually die. But the 20% bettors would grow slower. In the real world, we shrink our bets not because the math is different, but because our *inputs* are uncertain. That is the only reason to bet less than Full Kelly."

  ---

  ### 7. Final Comprehension Check

  Do not ask them to recite the formula. Ask a qualitative question that requires the intuition you just built.

  **The Closing Question:**
  *"I have a coin. It lands Heads 60% of the time. If Heads, I quadruple your stake. If Tails, you lose the stake. We play this once a week for the rest of your career. What fraction of your net worth do you bet?"*

  *   **Wrong Answer (EV):** "100%. The EV is massive ($0.6 \times 4 - 0.4 = 2.0$)."
  *   **Wrong Answer (Timidity):** "1%. It's risky."
  *   **Right Answer (Growth):** "Calculate Kelly: $b=3$ (net odds), $p=0.6$. $f^* = (3 \times 0.6 - 0.4) / 3 = 1.4 / 3 \approx 46\%$."
  *   **Pass/Fail:** If they say "I'd bet everything," they missed the lesson. If they say "I'd bet a fraction, because I need to survive the Tails to compound the Heads," they got it.

  **Final Instruction to You:**
  When the Lucky All-In winner stands up to claim their prize, applaud them. Then turn to the room and say, *"This is why Wall Street is full of people who went bust. They were right about the Expected Value, but wrong about the Time."*
