prompt: |-
  I run a Saturday-afternoon workshop series for a university forecasting and decision-making reading group: about sixteen people, mostly graduate students in statistics, computer science and economics, with a few philosophers. They are comfortable with expected value and with compound interest, but almost none of them have heard of the Kelly criterion or thought about growth rates. I have two hours with a short break, a whiteboard, a projector, index cards, dice and several decks of cards, and everyone has a phone with a calculator. Real money is out of the question, but I can put a genuine small donation behind the outcome and I can offer one modest individual prize.

  What I want designed is a single runnable session in which they do the betting rather than hear about it: a game with written stake decisions, rounds resolved by an explicit randomizer that is visibly not me, and a debrief afterwards. The thing I most want them to feel, before anyone names it, is that maximizing expected bankroll and maximizing the growth rate of the bankroll come apart on a repeated multiplicative bet: the expected-value maximizer's fortune is real on paper and nonexistent in almost every actual path, because the mean is carried by a vanishing sliver of lucky trajectories. I would also like them to feel that overbetting is punished asymmetrically — that growth falls off slowly on the over-side and then turns negative once you go past about twice the growth-optimal stake — and that the recommendation is not simply "be timid," since some bets legitimately call for staking most of what you have. Nothing with a formula on the board for the first forty minutes, and no reading list: I want the activity, not sources.

  The markets I was going to use, in some order you should choose, are: a 60/40 bet in your favour at even money; a 20% chance paying 5 to 1; an even-chance bet paying only 0.9 to 1; and a 90% chance at even money. I believe the growth-maximizing fractions of current bankroll for these are respectively 20%, 4%, nothing, and 80% — tell me if I have that wrong, tell me what each market earns its place in the sequence for, whether to give anyone these numbers and when, and whether the last block should instead offer two markets at once with participants free to split their stake, in which case say whether those two should be independent or deliberately correlated and what that version teaches that the single-market version cannot.

  On incentives, I am considering making the donation depend on the geometric mean of everyone's final bankroll while a separate leaderboard ranks people by final bankroll and the top scorer picks the charity. Tell me whether that tension is the best part of the design or a distraction, whether the geometric-mean rule should be announced at the start or revealed at the end, and roughly how many rounds the game needs and how fast each round must run for the growth-rate difference to be visible over luck — and if you think no feasible number of rounds makes it visible, say so plainly and tell me what the activity can accomplish instead. I am also toying with a withdrawal mechanic in which players must periodically spend a fraction of their bankroll on something consumed and scored separately; advise whether that clarifies the structure or muddies it, and where it would go.

  Please give me the rules and materials, a timeline with minute marks including what I say out loud, the debrief mapped onto specific moments that will have occurred, and an honest account of what will go wrong: the player who stakes everything early and wins, the confusion between betting a fixed fraction and betting a fixed amount, the rounds where the right action is to abstain and people bet from boredom, and the participant who notices the leaderboard is separable from the donation and starts playing for the leaderboard alone. Then tell me what the game cannot reproduce and I must supply in words: the asymptotic character of the growth-rate argument, the assumption that the probabilities are known, and the fact that a fixed target or a lumpy, non-repeatable opportunity calls for something other than growth-rate maximization. Finally, if there is a version in which the stated probabilities are slightly wrong so that full-Kelly staking does worse than a deliberately shrunken fraction, describe it and tell me whether it requires deceiving the room; if the same lesson can be taught without deception, use that instead. Include one last round or one closing question that would let me tell whether the idea landed or whether they have merely learned a formula.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Audience:** ~16 grad students (stats, CS, econ, philosophy). Comfortable with EV and compound interest. Unfamiliar with Kelly/Growth rates.
      *   **Goal:** Experiential learning. They must *feel* the divergence between EV maximization and Growth Rate maximization in repeated multiplicative bets. They need to feel the asymmetry of overbetting (slow decline then ruin) and that "timidity" isn't always the answer (sometimes bet big).
      *   **Constraints:** 2 hours (with break). Whiteboard, projector, cards, dice, phones. No real money (small donation + 1 prize). No formulas for first 40 mins. No reading list.
      *   **Specific Markets Provided:**
          1.  60/40 @ even money (Kelly = 20%)
          2.  20% chance @ 5-to-1 (Kelly = 4%? Need to verify)
          3.  50/50 @ 0.9-to-1 (Kelly = 0%? Need to verify)
          4.  90/10 @ even money (Kelly = 80%? Need to verify)
      *   **Incentive Structure:** Donation based on Geometric Mean of group bankrolls vs. Leaderboard (individual max) + Charity choice. Withdrawal mechanic consideration.
      *   **Deliverables:** Rules, materials, timeline (minute-by-minute), script highlights, debrief mapping, "what will go wrong" analysis, limitations of the game, parameter uncertainty/Kelly shrinkage question, final comprehension check.

  2.  **Verify the Math (Kelly Criterion):**

      *   Formula: $f^* = \frac{bp - q}{b}$ where $b$ is net odds received (e.g., 1-to-1 means $b=1$), $p$ is prob of win, $q = 1-p$.
      *   *Market 1:* 60% win, Even money ($b=1$). $f^* = \frac{1(0.6) - 0.4}{1} = 0.2$. (20%). **Correct.**
      *   *Market 2:* 20% win, 5-to-1 ($b=5$). $f^* = \frac{5(0.2) - 0.8}{5} = \frac{1.0 - 0.8}{5} = \frac{0.2}{5} = 0.04$. (4%). **Correct.**
      *   *Market 3:* 50% win, 0.9-to-1 ($b=0.9$). $f^* = \frac{0.9(0.5) - 0.5}{0.9} = \frac{0.45 - 0.5}{0.9} < 0$. (0%). **Correct.** (Negative EV).
      *   *Market 4:* 90% win, Even money ($b=1$). $f^* = \frac{1(0.9) - 0.1}{1} = 0.8$. (80%). **Correct.**

      *   *Sequence Logic:*
          *   Market 1 (60/40): The "standard" Kelly example. Moderate bet.
          *   Market 3 (Negative EV): Teaches abstention. Crucial for distinguishing EV (positive if you ignore risk of ruin? No, EV is negative here too actually. $0.5 \times 0.9 - 0.5 \times 1 = -0.05$). Wait, if EV is negative, EV maximizers also shouldn't bet. This doesn't distinguish EV vs. Growth.
          *   *Correction on Market 3:* The prompt says "even-chance bet paying only 0.9 to 1".
              *   EV = $0.5 \times 0.9 + 0.5 \times (-1) = 0.45 - 0.5 = -0.05$.
              *   If EV is negative, *neither* EV nor Growth maximizers bet. This market fails to distinguish the two philosophies.
              *   *Alternative:* To distinguish EV vs. Growth, we need a bet with *Positive EV* but *High Risk of Ruin* if overbet.
              *   *Wait, re-reading prompt:* "The thing I most want them to feel... is that maximizing expected bankroll and maximizing the growth rate of the bankroll come apart."
              *   Usually, this is demonstrated by a bet where EV says "Bet Everything" (because $p \times b > q$) but Kelly says "Bet Fraction".
              *   Example: 60% chance to double your money (1-to-1). EV = $0.6(2) + 0.4(0) = 1.2$. EV says bet all. Kelly says 20%.
              *   The prompt's Market 1 (60/40 even money) does exactly this. EV says bet 100% (maximize linear expectation). Kelly says 20%.
              *   Market 3 (Negative EV) is useful to teach *not every positive probability is a bet*, but it doesn't separate EV from Growth. I should advise the user on this. Actually, Market 3 is good for teaching "Don't bet on negative EV," which is a prerequisite for Kelly. But does it help the main lesson? Maybe as a control.
              *   Market 4 (90/10 even money): Kelly = 80%. Teaches "Boldness is sometimes optimal."
              *   Market 2 (20% @ 5-to-1): Kelly = 4%. Teaches "Low prob high payout needs small stake."

      *   *Decision:* I will recommend keeping Market 3 but framing it carefully, or swapping it for a high-leverage positive EV bet if the goal is strictly EV vs. Growth divergence. However, Market 1 already does the heavy lifting for EV vs. Growth (Bet All vs. Bet 20%). Market 3 teaches discipline. Market 4 teaches that Kelly isn't just "be small." Market 2 teaches sensitivity to odds.
      *   *Actually, looking closer at Market 3:* If the EV is negative, the EV maximizer *also* doesn't bet. So it doesn't create tension. I should advise replacing Market 3 with a bet that has Positive EV but suggests a Kelly fraction < 100% to reinforce Market 1, OR a bet where EV says Bet All but Kelly says Bet Nothing (impossible if EV > 0).
      *   *Better interpretation:* The prompt asks me to use the markets "in some order you should choose." I should critique Market 3. If EV < 0, it doesn't help the specific EV vs. Growth tension. I will suggest replacing it or using it as a "trap" for people who just see "50% chance" and ignore payouts.
      *   *Wait, one more check:* Is there a bet where EV says "Bet More" than Kelly? Yes, any positive EV bet. EV maximization on repeated multiplicative bets implies betting 100% (until ruin). Kelly implies $f^*$. So Market 1, 2, and 4 all create the tension. Market 3 does not. I will advise dropping Market 3 or replacing it with a "Correlated Split" round as suggested in the prompt.
      *   *Prompt Question:* "whether the last block should instead offer two markets at once... independent or deliberately correlated."
      *   *Idea:* Correlated markets teach diversification. If I have two 60/40 bets that are perfectly correlated, it's just one bet. If independent, I can bet on both. This teaches that Kelly applies to the *portfolio*.
      *   *Decision:* I will recommend using Market 3 as a "Sanity Check" round (don't bet on negative EV) but acknowledge it doesn't separate EV/Growth. I will recommend the "Split Stake" finale for the diversification lesson.

  3.  **Incentive Structure Design:**

      *   *Goal:* Make them feel the Geometric Mean vs. Arithmetic Mean tension.
      *   *Proposal:*
          *   **Individual Prize:** Goes to the person with the highest final bankroll (Arithmetic Max). This incentivizes EV-maximizing behavior (high variance, bet big).
          *   **Group Donation:** Size depends on the *Geometric Mean* of the group's final bankrolls. This incentivizes the group to collectively play Kelly (maximize growth, minimize ruin).
      *   *Tension:* If everyone plays for the Individual Prize, they bet big, many go bust, Geometric Mean crashes, Donation shrinks. If everyone plays Kelly, Individual Prize winner might be a lucky over-better, but Donation is maximized.
      *   *Announcement:* Announce *both* at the start. The tension is the feature, not a distraction. It creates a "social dilemma" analogous to the math dilemma.
      *   *Withdrawal Mechanic:* "Consumption." If you don't withdraw, you just compound. If you withdraw, you reduce compounding base.
      *   *Advice:* Keep it simple. Add a "Tuition" fee every 5 rounds (e.g., 10% of current bankroll). This mimics real life (you don't just compound forever; you need to eat). It makes ruin more painful (you can't pay tuition) and makes steady growth more valuable than volatile spikes. *Verdict:* Include it. It clarifies why "paper wealth" doesn't matter if you can't survive the drawdown.

  4.  **Rounds and Visibility:**

      *   To see the Law of Large Numbers kick in for Growth Rates, you need enough rounds.
      *   With 16 people, luck is high.
      *   If we do 10 rounds of 60/40:
          *   Kelly (20%): Median outcome is robust.
          *   EV Max (100%): Most will be zero. One might be huge.
      *   *Problem:* 2 hours is short. Setup, explanation, betting, resolving, recording takes time.
      *   *Pacing:* 5 minutes per round is tight. 10 rounds = 50 mins. Plus 4 markets.
      *   *Solution:* Automate resolution. Use the projector/phone calculators.
      *   *Visibility:* The divergence is visible if we compare the *median* participant vs. the *mean* (which is skewed by the one lucky winner).
      *   *Rounds:* Aim for 30-40 total bets across the session, grouped into "Blocks" by market type.
      *   *Block 1 (Market 1):* 10 rounds. (The main lesson).
      *   *Block 2 (Market 4):* 5 rounds. (The "Bet Big" lesson).
      *   *Block 3 (Market 2):* 5 rounds. (The "Bet Small" lesson).
      *   *Block 4 (Market 3):* 1 round. (The "Don't Bet" lesson).
      *   *Block 5 (Split):* 5 rounds. (Diversification).
      *   *Total:* ~26 rounds. Feasible in 90 mins of gameplay.

  5.  **What Will Go Wrong (Pre-mortem):**

      *   *The Lucky All-In:* One student bets 100% every time on Market 1, gets lucky, wins the Individual Prize. This validates EV maximization in their eyes.
          *   *Mitigation:* In debrief, highlight that 15 others went bust. The Geometric Mean tanked. The "Lucky All-In" is the vanishing sliver.
      *   *Fixed Amount vs. Fixed Fraction:* Students might bet \$10 every time instead of 10% of bankroll.
          *   *Mitigation:* Clear instructions. "You must write down a *percentage* of your current visible bankroll."
      *   *Boredom Betting on Market 3:* People bet on the negative EV bet just to do something.
          *   *Mitigation:* Make the penalty clear.
      *   *The Leaderboard Gamer:* Someone ignores the donation and plays for the prize.
          *   *Mitigation:* Acknowledge this is rational for the individual, destructive for the group. That's the point.
      *   *Calculation Errors:* Phones vary.
          *   *Mitigation:* Provide a standard spreadsheet link or simple calculator instructions. Or, simpler: Pre-printed "Bankroll Trackers" where they just move a token? No, phones are faster. Require them to show screen to neighbor for verification.

  6.  **Deception/Parameter Uncertainty:**

      *   *Question:* "If there is a version in which the stated probabilities are slightly wrong... describe it."
      *   *Advice:* Do **not** deceive. It undermines trust and muddies the math. The lesson is about *known* probabilities vs. Growth.
      *   *Better Lesson:* "Parameter Uncertainty" leads to *Fractional Kelly*. If you aren't sure it's 60%, maybe it's 55%, you should bet less than 20%.
      *   *Implementation:* In the debrief, mention that in real life, we don't know $p$. So we bet Half-Kelly. But for the game, we assume God's eye view.

  7.  **Final Comprehension Check:**

      *   Don't ask for the formula.
      *   Ask a qualitative question: "I offer you a coin flip. Heads you triple your money, Tails you lose it all. Do you take it? Why?" (EV says yes, Growth says no).
      *   Or: "Why did the person with the highest score contribute least to the group donation?"

