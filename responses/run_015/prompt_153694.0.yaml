          5.  **Finale (Two 60/40 Independent):** Diversification. 5 Rounds. Teaches Portfolio Kelly.
      *   *Critique of Market 3:* As noted, EV also says don't bet. I will advise the user to frame this as "Distinguish Edge from Probability."
      *   *Critique of Split:* Independent 60/40 bets. If I have bankroll $W$, and two opportunities. Kelly on portfolio is sum of Kelleys if independent. $20\% + 20\% = 40\%$ total exposure. This teaches that Kelly is about *total risk exposure*, not per-bet.

