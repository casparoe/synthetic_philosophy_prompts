answer: |-
  **Scenario**
  In an industrial hatchery, veteran chick-sexers sort day-old chicks by handling them and uttering "Hen" or "Cock." Their skill is perceptual but ineffable; they react to a specific tactile-visual cue (vent shape *V*) they cannot describe. A radical interpreter, an auditor new to poultry, observes the sexers holding "Hen" true precisely when *V* is present. She cannot detect *V* herself; her only verification method is waiting six weeks for the birds to develop secondary sex characteristics (adult female phenotype *F*). In the current batch, *V* and *F* are perfectly correlated: every chick with *V* develops into *F*, every chick without *V* develops into a male. The sexers also hold true sentences like "Hens lay eggs" and "Hens need layer feed." The interpreter knows (from biology, not the speakers) that *V* is a fallible indicator of *F*; in rare cases, hormonal disruption can produce a bird with *V* that never develops *F* or lays eggs, but no such cases appear in the observed evidence base.

  **The Two Readings**
  *   **Reading 1 (Triangulation-Favored):** "Hen" is true of a chick iff it possesses vent shape *V*.
  *   **Reading 2 (Charity-Favored):** "Hen" is true of a chick iff it is an adult female *F*.

  **The Checks**
  *   **Charity Check:** Reading 2 wins. If we assign Reading 1, the sexers hold false beliefs: they believe "All Hens lay eggs," but on Reading 1, this means "All *V*-shaped vents lay eggs," which is biologically false (due to the rare hormonal disruptions). Reading 2 renders their web of belief coherent and maximally true ("All adult females lay eggs" is analytically/biologically robust). Charity prioritizes making the speaker rational and right about the world they talk about.
  *   **Triangulation Check:** Reading 1 wins. Triangulation requires the content to be fixed by the common cause of the speaker's utterance and the interpreter's observation of the situation. The immediate cause of the utterance is *V*. *F* (the adult state) does not exist yet and cannot causally influence the present utterance. Reading 1 anchors the meaning in the actual causal transaction; Reading 2 anchors it in a future, distal property that plays no causal role in the speech act.

  **The Feature and The Collapse**
  The feature driving the divergence is **the contingent correlation between the proximal cue (*V*) and the distal kind (*F*)**. The gap exists only because *V* is a fallible, albeit reliable, sign of *F*. If you switch off this contingency—making *V* a *constitutive necessary condition* of *F* (so that having *V* logically guarantees developing *F*)—the truth conditions of Reading 1 and Reading 2 become necessarily equivalent. The causal anchor and the truth-maximizing extension would coincide, collapsing the two readings into one.

  **Indeterminacy or Underdetermination?**
  This is **underdetermination** in principle, but **indeterminacy** for the radical interpreter. In principle, the truth conditions differ: a *V*-bird that fails to develop *F* would falsify Reading 2 but verify Reading 1. More evidence (waiting for a counterexample) could settle it. However, the radical interpreter is constrained to the *current* evidence base of held-true sentences. Since the counterexample is not in the evidence, and Davidson holds that meaning is fixed by available causal interactions, there is no fact of the matter *for the interpreter* at this time. It is indeterminacy relative to the radical constraint, though the world contains the facts to resolve it later.

  **The Davidsonian Objection**
  A committed Davidsonian would argue I cheated by violating the **radical** constraint. I stipulated that the interpreter "knows (from biology)" that *V* is a fallible indicator of *F*. But a radical interpreter cannot bring prior knowledge of what constitutes a 'hen' or 'female' to the table; she must derive the concept of 'hen' entirely from the speakers' patterns. By assuming she already grasps the distinction between *V* and *F* independently of the speakers' usage, I have smuggled in a "reference magnet" (the biological reality of *F*) that Davidson's theory explicitly forbids. For Davidson, if the speakers treat *V* as criterial for 'Hen', then *V* *is* what they mean by 'Hen', and my biological objection is just me imposing my own theory on their truth.
