answer: |-
  Dear Colleague, your intuition that the impasse is the subject is correct, but the diagnosis requires a slight sharpening: the stalemate is not merely a disagreement over the rules of explanation nor a verbal ambiguity regarding causation, but a foundational ontological clash between two incompatible pictures of human being, one viewing agents as complex mechanisms whose outputs can be traced to antecedent state variables, and the other viewing them as meaning-making entities whose actions are constitutively unintelligible without reference to the reasons they avow. This is not a dispute that can be settled by better data because the two sides are not looking at the same world; the econometrician sees a landscape of independent variables where culture is one input among many, while the interpretivist sees a web of significance where culture is the medium through which inputs are recognized as inputs at all. When you ask for a diagnosis rather than a verdict on Weber, you are asking for an account of why the question persists despite centuries of scrutiny, and the answer is that the question functions as a boundary marker between two distinct regimes of knowledge, each with its own criteria for what counts as real and what counts as an explanation.

  To see why this is not merely a verbal dispute over the definition of cause, consider what each side is committed to when they make their favourite move. The side demanding regression controls and natural experiments is committed to the principle of separability, which assumes that culture, literacy, institutions, and geography can be disentangled into distinct vectors that exert independent pressure on an outcome. When they control for literacy to isolate the effect of Protestantism, they are committing themselves to the view that literacy is not itself a cultural phenomenon shaped by the same religious doctrines they are testing, but rather a confounding noise that must be filtered out to find the signal. This move commits them to a world where meaning is epiphenomenal, where the belief in predestination is only causally relevant if it can be shown to produce a behavioural difference over and above the difference produced by being able to read, effectively treating the content of the belief as irrelevant compared to its correlation with output. They are forced into this position because their model of causation requires counterfactuals that hold everything else constant, but in the social world, holding everything else constant often means holding the mechanism itself constant, thereby erasing the very thing they hope to measure.

  Conversely, the side insisting on the constitutive role of values is committed to the principle of irreducibility, which holds that human action cannot be described neutrally without losing the object of study. When they argue that citing what people thought their labour meant is the cause, they are committing themselves to the view that reasons are not merely antecedent conditions but are part of the action's identity, such that removing the meaning changes the action itself. This move commits them to a form of explanation that is inherently resistant to falsification by external data, because any behavioural correlate that contradicts the cultural narrative can be dismissed as a misinterpretation of the meaning or a failure of the actors to live up to their ideals. They risk turning culture into a sealed system where the explanation is always already present in the description, making it difficult to account for change or to explain why some cultural frameworks succeed in mobilising energy while others do not, except by invoking further cultural distinctions that remain equally immune to empirical testing.

  Your third possibility, that the dispute is verbal and rests on competing senses of cause, is tempting because it offers a peaceful dissolution of the conflict, but it underestimates the stakes involved. If it were merely a matter of distinguishing between difference-making and initiation, we could agree to use two different words and move on, but the disagreement is not about labeling; it is about legitimacy. The variable-based side views the interpretive approach as unscientific storytelling because it lacks predictive leverage, while the interpretive side views the variable-based approach as category error because it reduces persons to things. This is not a semantic confusion that can be cleared up by a distinction; it is a rivalry between two visions of social science, one aspiring to the status of a natural science of society and the other aspiring to the status of a hermeneutic science of meaning. To treat it as verbal is to suggest that both sides are talking about the same thing and failing to realise it, when in fact they are talking about different things and realising it all too well, which is precisely why they cannot concede ground.

  Given this diagnosis, you should not expect progress in the form of a study that settles the debate, because any such study will be assimilated into the ontological framework that produced it. A natural experiment showing a correlation between religious heritage and savings rates will be hailed by the first side as identification of a causal parameter and dismissed by the second as a superficial regularity that misses the internal logic of the accumulation, while a deep historical account of the shifting semantics of the calling will be hailed by the second side as the true explanation and dismissed by the first as anecdotal evidence lacking external validity. There is no class of studies that would surprise both sides because surprise requires a shared expectation of what the world should look like, and these sides do not share that expectation. The only progress available is the recognition that the choice between these frameworks is not empirical but pragmatic and ethical, depending on what kind of knowledge one values and what kind of human subject one wishes to preserve in the account.

  Therefore, you are right to conclude that the disagreement is in good health precisely because it is a standing dispute over the aim of social explanation, and what you should teach your students is the disagreement itself. The value of the seminar is not in resolving the tension but in forcing students to inhabit both positions until they feel the strain of each, revealing that the choice of method is never neutral but always carries metaphysical baggage. If you teach them that the impasse is a failure of our current tools, you mislead them into thinking that better data will eventually dissolve the problem, whereas the truth is that the problem is permanent because it arises from the dual nature of human beings as both objects in the world and subjects who interpret the world. The lesson they should take away is not whether Weber was right about Calvinism, but that any explanation of human action must choose between capturing the mechanism of behaviour or the meaning of the act, and that this choice determines what kind of truth is available to them. This is a harder lesson than a verdict, but it is the only one that respects the complexity of the subject matter and the intelligence of your students.
