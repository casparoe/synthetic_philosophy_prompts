answer: |-
  Subject: Re: Neurath and the curve

  Dear friend

  I have been turning over your proposal to collide the flatten the curve graphic with Otto Neurath's theory of picture languages, and it is a splendid provocation. You have summarised Neurath's commitments with considerable fidelity, particularly regarding the insistence on countable units and the epistemological status of the transformation, so I shall take those as our fixed points and run the chart against them to see where the friction sparks. The most immediate and glaring violation is, as you note, the method of representing quantity. Neurath's Isotype system was built on the principle that magnitude must be shown by the repetition of identical signs rather than the scaling of a single sign, precisely to prevent the viewer from being misled by area versus height and to ensure that every unit could, in principle, be counted. The epidemic curve violates this outright; it uses continuous lines to represent rates of infection over time, where no discrete unit is visible and no counting is possible. However, to call this a failure on Neurath's own terms requires us to ask whether his rule was universal or parochial. His theory was developed primarily for social and economic statistics, dealing with stocks of people, houses, or coal, where discrete counting makes sense. His system is largely silent on dynamic rates, thresholds, and feedback loops, which are inherently continuous functions rather than accumulations of objects. Consequently, this break does not necessarily cost him anything philosophically, because his pictogram rule was a syntax for discrete statistics, not a prohibition against line graphs per se, provided the graph remained accessible. If we accept that his deeper goal was legibility for the factory worker rather than rigid adherence to pictograms, then the curve passes the test of accessibility even if it fails the test of iconography.

  Where the chart offers a striking vindication of Neurath is in your third point, regarding the picture as a transformation. Neurath insisted that a chart is never a neutral mirror of reality but an edited simplification, captured by the museum's maxim that to remember simplified pictures is better than to forget accurate figures. The flatten the curve graphic is the epitome of this doctrine. It sacrifices specific data, local variance, and numerical precision for a conceptual model that distinguishes only between overwhelming capacity and managing it. It is a deliberate omission of complexity to preserve a actionable insight, which is exactly what Neurath meant by transformation. In this sense, the chart is not a violation but a pure expression of his epistemology, proving that the power of the visual lies in its edited nature rather than its fidelity to raw data. This suggests that the pictogram rule might indeed be decoration compared to the anti-foundationalist stance that all representation is constructed. The fact that the chart was redrawn in hundreds of jurisdictions, each adjusting the capacity line to their local reality, mirrors Neurath's boat rebuilt plank by plank at sea; there was no privileged protocol chart, only useful adaptations edited for specific contexts. This adaptability confirms that his anti-foundationalism is the robust core of his theory, while the specific syntax of repeating icons was merely one vessel for carrying it.

  On the question of logic and the helping language, the episode offers a nuanced confirmation of Neurath's limits. He argued that pictures cannot on their own say no, say if, or say is, and require text to assert conditionals or imperatives. The chart depicts a counterfactual, a what if scenario, yet the visual itself does not strictly assert the obligation to act; it shows the consequence of inaction versus action. The imperative flatten it comes from the caption and the public health campaign surrounding the image. Millions may have felt they read an obligation straight off the curve, but strictly speaking, they were reading a causal implication visually and a moral command textually. The picture showed the disaster, the words supplied the duty. This supports Neurath's claim that the picture language is a helping language that needs verbal supplementation to legislate. However, one might argue that the visual weight of the tall peak against the capacity line was so emotionally potent that it performed the work of the imperative without the text, which would refute his strict separation. Yet I think Neurath would hold firm here; without the context of the pandemic and the accompanying instructions, the graph is merely a comparison of two functions. The obligation was supplied by the moment and the words, confirming that the picture alone remains logically incomplete.

  Your question about whether words divide and pictures unite is also tested here. The chart achieved a rare global unity of understanding, transcending language barriers in a way text-heavy guidelines could not. Yet it relied on minimal text to anchor its meaning. If Neurath meant that pictures bypass the fracturing nature of specific languages to reach a common visual understanding, the chart succeeds. But if he meant that pictures can operate entirely without the divisiveness of words, the chart fails, as the caption was essential. I suspect the former is the stronger reading; the picture united the intuition, while the words divided the specific policies. Finally, to offer a verdict on whether this is a confirmation, an anomaly, or a category error, I would argue it is a confirmation of his philosophy but a category error regarding his specific syntax. His theory was never built to handle continuous rates and dynamic systems, so pressing the pictogram rule onto a line graph is asking the wrong question. However, the success of the chart confirms his deeper insights into transformation, accessibility, and the constructed nature of visual knowledge. The chart survives the collision not because it obeys his rules of counting, but because it embodies his spirit of edited simplification for the public good. It suggests that Neurath was right about the nature of visual education, even if his preferred alphabet of icons was too limited for the complexities of epidemiological modelling. I hope this helps you steer the column, and I look forward to reading the final piece.

  Best wishes
