  *   (4 marks) Argues that no single fix covers all cases unless negation is reconceived as a content-operator rather than a separate attitude type.
  *   (4 marks) Demonstrates that allowing indifference necessitates content-based negation, which reintroduces the problem of uniform attitude attribution in conditionals.
