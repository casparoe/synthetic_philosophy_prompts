  Consider an expressivist view where accepting moral sentence A is holding a non-cognitive attitude toward content A; accepting 'if A then B' is holding that attitude toward the ordered pair ⟨A, B⟩; and accepting 'not A' is holding a separate tolerance attitude toward A. Evaluate these inference patterns involving moral A, B, C:
  (i) A; if A then B; ∴ B
  (ii) if A then B; not B; ∴ not A
  (iii) if A then B; if B then C; ∴ if A then C
  (iv) if A then B; if not-A then B; ∴ B
  Identify which pattern poses the distinct structural problem for this pair-attitude account and why. Does a single fix resolve all four? Finally, stipulate that speakers can be indifferent toward moral content (neither for nor against). Explain what this implies for the meaning of 'not A' if negation is treated as a content-forming operator rather than a separate attitude. Avoid general complaints about unasserted contexts; focus on the structural consistency of the attitudes defined above.

  Pattern (iv) is the distinct problem. Patterns (i)-(iii) involve inconsistencies between attitudes that the pair-attitude view can map: accepting A and ⟨A, B⟩ while rejecting B creates a clash of attitudes toward B. The view defines validity as inconsistency in attitude combinations. However, (iv) requires showing that accepting ⟨A, B⟩ and ⟨not-A, B⟩ while rejecting B is inconsistent. Since 'not-A' is defined as a separate tolerance attitude toward A, the pair ⟨not-A, B⟩ involves a different attitude type than ⟨A, B⟩. There is no structural contradiction in holding tolerance toward A, acceptance of ⟨A, B⟩, and rejection of B, unless 'not-A' shares content with A in a way the tolerance definition blocks.

  The structural feature separating (i)-(iii) from (iv) is attitude homogeneity. In (i)-(iii), the inconsistency arises within a single attitude type directed at conflicting contents. In (iv), the antecedents invoke distinct attitude types (acceptance vs. tolerance) toward A, preventing a unified clash regarding B. Consequently, a single fix does not cover all cases. Fixing (i)-(iii) requires aligning the attitude toward conditionals with truth-functional logic. Fixing (iv) requires aligning the attitude toward negation with the attitude toward affirmations so that ⟨A, B⟩ and ⟨not-A, B⟩ converge on B regardless of A's status. This demands negation be a content-operator, not a separate attitude.

  If speakers can be indifferent, and negation is a content-forming operator, 'not A' denotes the complement of content A. Indifference means lacking the attitude toward both A and not-A. If negation were merely a separate tolerance attitude, indifference would be impossible (one must either accept A or tolerate A). Treating negation as content-forming allows indifference but reintroduces the Frege-Geach problem: what is the attitude toward the content 'not-A' in 'if not-A then B'? It must be the same attitude as toward A in 'if A then B' to preserve validity, forcing the expressivist to admit a cognitive-like relation to content itself, undermining the non-cognitive distinction. Thus, (iv) exposes the inability to unify negation and affirmation under one attitude type without collapsing into cognitivism.

