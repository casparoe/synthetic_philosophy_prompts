prompt: |-
  I work in synthetic biology, specifically on engineered metabolic pathways, and I think about pathway components through two informal concepts I use in my own modeling. By “provenance-tracking” I mean assessing a biological module by its evolutionary origin and the selective history that produced or retained it—what it was “for” in the ancestral or donor context. By “load-bearing status” I mean assessing the same module solely by its present causal contribution to the current network’s stability, flux, and output—what it actually does now, regardless of how it arrived, including in cases of horizontally transferred modules or orphan genes with no clear ancestral counterpart. I am fluent in this vocabulary but have no formal training in philosophy of biology.

  Please restate the debate between etiological and causal-role accounts of biological function—specifically, the view that a trait’s function is fixed by its evolutionary history of selection versus the view that it is fixed by its present causal contribution to the containing system—entirely within the vocabulary of provenance-tracking and load-bearing status. Use engineered pathways with horizontally transferred modules and orphan genes as your working examples. Cover both sides as faithfully as you can, without smuggling philosophical assumptions into my terms and calling it translation.

  Then provide a residue report: which distinctions in the philosophical debate map cleanly onto the difference between provenance-tracking and load-bearing status; which distinctions can only be captured by distorting one or both of my concepts; and which distinctions have no expression at all in my framework. For each untranslatable residue, indicate whether you think my vocabulary is genuinely missing something important, or whether the philosophical distinction was less substantive or clear than it initially appeared. I want the translation to be honest, and I want the failures of translation treated as the most interesting part of the answer.
