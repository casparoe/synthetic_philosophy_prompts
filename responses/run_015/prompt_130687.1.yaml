answer: |-
  ### Part 1: The Debate Restated

  In your work on engineered metabolic pathways, the disagreement over how to assign "function" to a module can be restated entirely as a conflict between **provenance-tracking** and **load-bearing status**.

  **The Provenance-Tracking Position**
  This view holds that the function of a pathway component is fixed by its history. When you introduce a horizontally transferred module—for example, a sugar transporter gene moved from a soil bacterium into an *E. coli* chassis—its function is defined by what that gene was selected *for* in the donor organism. If the donor evolved this transporter to import sucrose under osmotic stress, then its function is "sucrose import," even if, in your engineered *E. coli*, the membrane potential causes it to operate in reverse or the substrate is unavailable.

  This stance argues that without provenance-tracking, you lose the ability to distinguish between what a part is *supposed* to do and what it *happens* to be doing. If a module fails to produce flux due to a mutation, provenance-tracking allows you to say it is "broken" (it still has the function of transporting, but is failing to bear load). If you rely only on load-bearing status, a broken part simply has no function, which makes troubleshooting impossible—you cannot fix a part toward a standard if the standard is only its current performance.

  This view faces a crisis with **orphan genes** or *de novo* designed sequences. If a module has no ancestral counterpart or selective history in a donor context, provenance-tracking cannot assign it a function. It renders novel innovations functionless until they have a history, which contradicts the synthetic biology goal of creating new functions immediately.

  **The Load-Bearing Status Position**
  This view holds that the function of a pathway component is fixed solely by its current causal contribution to the network. When you analyze the same horizontally transferred transporter, you ignore the donor's history. You measure the flux, the stability of the metabolite pool, and the growth rate of the chassis. If the transporter is currently exporting a toxin and stabilizing the cytoplasmic pH, its function is "toxin export," regardless of its evolutionary past.

  This stance argues that provenance-tracking is a distraction in engineering. In a synthetic context, the "ancestral purpose" is often irrelevant to the "current job." A promiscuous enzyme might have evolved to degrade cellulose (provenance), but in your pathway, it is bearing load by catalyzing a rate-limiting step in terpenoid synthesis. To call it a "cellulase" based on provenance is to misidentify its role in the system you are actually trying to stabilize.

  This view handles **orphan genes** and *de novo* parts effortlessly: if the sequence contributes to flux, it has a function. However, it struggles to define **malfunction**. If a module stops contributing to flux, load-bearing status dictates it no longer has that function. It cannot distinguish between a part that has lost its function and a part that never had that function to begin with. It reduces function to a description of current effects, making it difficult to set engineering specifications that differ from current performance.

  **The Conflict in Engineered Pathways**
  The debate sharpens when you consider **design intent**. In synthetic biology, "provenance" can mean two things: the natural evolutionary history of a part, or the design history of the engineer who assembled the pathway.
  *   If you prioritize the **natural provenance**, you treat biological parts as having inherent natures that resist recontextualization.
  *   If you prioritize the **load-bearing status**, you treat biological parts as context-dependent resources whose identity is fluid.

  When a pathway fails, the provenance-tracker asks: "Did we violate the selective constraints of the donor?" The load-bearing analyst asks: "Which node is currently failing to support the flux?" The former looks backward to explain failure; the latter looks inward to locate it.

  ***

  ### Part 2: Residue Report

  Here is an analysis of how the standard philosophical distinctions map onto your vocabulary, where the mapping distorts the concepts, and where your framework leaves philosophical problems unexpressed.

  #### 1. Clean Mappings
  *   **The Novelty Problem:** The philosophical difficulty of assigning functions to newly evolved traits (which lack selection history) maps cleanly onto your **orphan gene** scenario.
      *   *Philosophy:* Etiological accounts struggle to explain the function of the first iteration of a new trait.
      *   *Your Vocab:* Provenance-tracking hits a wall with orphans; Load-bearing status handles them naturally.
  *   **The Context Dependence of Activity:** The philosophical distinction between a trait's *capacity* (what it can do) and its *role* (what it is doing in a specific system) maps well to **Load-bearing status**.
      *   *Philosophy:* Causal-role accounts define function by the specific containing system.
      *   *Your Vocab:* Load-bearing status explicitly ties function to the "current network's stability, flux, and output."

  #### 2. Distorted Mappings
  *   **Malfunction and Normativity:**
      *   *Philosophical Distinction:* Etiological accounts can explain malfunction (a heart has the function of pumping even if it is currently stopped). Causal-role accounts struggle here (if it isn't pumping, pumping isn't its current causal role).
      *   *Your Vocab Distortion:* Your definition of **Load-bearing status** ("present causal contribution... to stability") implies that if a module is not contributing, it has no function. This collapses the distinction between "non-functional" and "malfunctioning." However, your definition of **Provenance-tracking** ("what it was 'for'") captures the normative "ought" required to define malfunction.
      *   *Verdict:* The mapping is clean on Provenance but forces Load-bearing status into a purely descriptive box that eliminates the concept of "brokenness." In engineering, you often need to say a part is "failing to bear load" rather than "not bearing load." Your vocabulary forces a binary: either it bears load (function) or it doesn't (no function).
  *   **The Scope of "Effects":**
      *   *Philosophical Distinction:* Causal-role accounts (like Cummins') face the "everything is a function" problem. A heart pumps blood, but also makes a "thump" sound and weighs down the chest. Philosophy requires a way to filter *relevant* causal roles from incidental effects.
      *   *Your Vocab Distortion:* You restrict Load-bearing status to "stability, flux, and output." This is a much tighter filter than general philosophy allows. You have pre-solved the "incidental effects" problem by defining load-bearing in terms of *engineered goals* (flux/output).
      *   *Verdict:* This is a productive distortion. You have narrowed the philosophical concept to fit an engineering context, which makes your vocabulary more practical but less generalizable to natural biology where "output" is not always defined.

  #### 3. Untranslatable Residues
  These are distinctions in the philosophy of biology that have no expression in your framework.

  *   **Residue A: Natural Selection vs. Designer Intent**
      *   *The Philosophical Issue:* Standard etiological theory relies on *blind* natural selection. Synthetic biology relies on *intelligent* design (yours).
      *   *Translation Failure:* Your **Provenance-tracking** conflates "evolutionary origin" with "donor context." In natural biology, "what it was for" means "what increased fitness." In your work, "what it was for" might mean "what the donor organism used it for" OR "what I designed it for."
      *   *Analysis:* **Your vocabulary is genuinely missing something important here.** You lack a term to distinguish between *evolutionary provenance* (history of selection in nature) and *design provenance* (history of selection in the lab or intent of the engineer). When a part fails, is it because it violates evolutionary constraints (evolutionary provenance) or because it violates your design specification (design provenance)? Collapsing these two into "provenance-tracking" obscures a critical source of failure in synthetic systems.
  *   **Residue B: The "Time-Slice" Problem**
      *   *The Philosophical Issue:* Etiological functions are historical properties (extended over generations). Causal-role functions are ahistorical properties (instantiated at a time slice).
      *   *Translation Failure:* Your **Load-bearing status** is clearly a time-slice concept (current flux). However, **Provenance-tracking** in synthetic biology is often treated as a static property of the part (a "datasheet" property), whereas in philosophy, it is a relational property of the lineage.
      *   *Analysis:* **The philosophical distinction was less substantive than it initially appeared.** In the context of metabolic engineering, the "generational" aspect of etiology matters less than the "characterization" aspect. Whether the function is fixed by 1,000 generations of selection or 1 round of PCR screening matters less than the fact that it is fixed *outside* the current experimental run. Your vocabulary correctly ignores the timescale difference in favor of the *location* of the definition (past vs. present).
  *   **Residue C: The "Artifact" Status**
      *   *The Philosophical Issue:* Philosophy of biology struggles to categorize engineered organisms. Are they biological traits or artifacts? Artifacts have functions defined by user intent; organisms have functions defined by selection.
      *   *Translation Failure:* Your framework treats engineered pathways as biological networks subject to **Load-bearing status**, but the parts often carry **Provenance-tracking** from natural organisms. There is no term for the function of the *pathway itself* as an artifact.
      *   *Analysis:* **Your vocabulary is missing something important.** You can track the provenance of the *parts* and the load-bearing of the *network*, but you lack a term for the function of the *construct* as a whole relative to the *engineer*. Is the pathway's function to produce fuel (engineer's goal) or to maximize host growth (biological load-bearing)? When these diverge (e.g., production kills the host), your vocabulary describes the conflict as "flux vs. stability," but misses the teleological conflict between "artifact purpose" and "biological persistence."

  ### Summary Evaluation

  Your vocabulary of **provenance-tracking** and **load-bearing status** is a high-fidelity translation of the etiological/causal-role debate *for the specific context of metabolic engineering*.

  *   **Where it succeeds:** It bypasses the abstract metaphysical debates about "normativity" by grounding them in "donor context" vs. "current flux." It handles the "Novelty" objection (orphan genes) better than standard philosophy by treating load-bearing as sufficient for function.
  *   **Where it fails:** It obscures the distinction between **natural history** and **design intent** within provenance-tracking. In synthetic biology, a part's history is often a mix of natural selection and human screening. Your vocabulary treats "provenance" as a monolith.
  *   **Most Interesting Residue:** The **Malfunction** gap. Your Load-bearing status cannot easily describe a part that *should* bear load but *doesn't*. It forces you to say the part has no function. In engineering, you need to say the part has a *specification* (derived from provenance or design) that is not being met. You are missing a term for **"Specified Role"**—a function assigned by the engineer that exists independently of both evolutionary history and current performance. Without this, you cannot formally distinguish between a part that is "wrong for the system" (Provenance mismatch) and a part that is "broken in the system" (Load-bearing failure).
