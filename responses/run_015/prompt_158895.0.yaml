answer: |-
  This is a profound observation, made more so by the context in which you are making it. You are operating at the boundary where art meets care, and your practices reveal a sophisticated, albeit unspoken, philosophy of mind. You asked for the question rather than the label, so I will leave the "Paradox of Fiction" unnamed and focus instead on the mechanics of what you are doing.

  Here is a reconstruction of the theory your group embodies, an analysis of its philosophical commitments, and a projection of how your practice would shift under different views.

  ### 1. The Implicit Theory: The Permeable Membrane

  Your current practice presupposes that emotions elicited by fiction are **real, physiological, and psychological events** that are **continuous with real-life emotions**, but that fiction acts as a **controlled delivery system** for those emotions.

  This theory rests on three pillars:

  1.  **Affective Realism:** When a member weeps at a film, they are not "pretending" to weep. The grief is chemically and experientially identical to the grief they feel for your father or their own losses. Therefore, it requires the same duty of care as a real-life emotional trigger.
  2.  **Narrative Manipulation:** Fiction is distinct from nonfiction not because it is "fake," but because it is *designed*. A documentary shows death; a film *orchestrates* your relationship to that death. This is why you warn for the fictional dog but not the documentary footage. The documentary presents a fact; the film engineers a bond. The implicit theory holds that we are more vulnerable to *engineered intimacy* than to *raw fact*.
  3.  **Preparatory Regulation:** Emotion is not just a reaction; it is a process that can be modulated by anticipation. The "affect notes" ("this one is about fathers") work because they allow the viewer to align their internal state with the external stimulus. The backfiring warning ("waiting for the dog") reveals the corollary: attention is the fuel of emotion. If you direct attention too specifically, you alter the combustion.

  In short, your practice treats the screen not as a wall separating reality from illusion, but as a **membrane**. It allows the passage of feeling while filtering the passage of fact.

  ### 2. Rival Accounts: Ruled Out vs. Compatible

  Your practice is not neutral; it actively conflicts with certain philosophical explanations of why we cry at movies.

  **Strictly Ruled Out:**
  *   **The Pretense Theory (Make-Believe):** This view (associated with Kendall Walton) argues that when we watch fiction, we are playing a game of make-believe. Our tears are "quasi-tears"; our fear is "quasi-fear." We are not *actually* afraid, any more than a child is *actually* afraid of a monster under the bed.
      *   *Why it conflicts:* If this were true, your "affect notes" would be unnecessary. You do not need to warn a grown adult that a game of make-believe will involve "slow dread." You do not need to manage the emotional safety of someone playing a game. The fact that your members need protection, and that re-watching can be *worse* (suggesting cumulative emotional damage rather than playful repetition), rules out the idea that this is "just pretend."

  **Fits Comfortably:**
  *   **The Thought Theory:** This view holds that we have real emotions directed at thoughts or propositions. We grieve the *thought* of the dog dying.
      *   *Why it fits:* This aligns with your warning system. If thoughts cause real grief, warning people about the content of those thoughts is a duty of care.
  *   **The Cognitive Theory of Emotion:** This view suggests emotions are judgments of value. We cry because we judge the loss on screen to be significant.
      *   *Why it fits:* The "affect notes" help viewers make the correct valuation beforehand ("This is about fathers" = "This is valuable to me").

  ### 3. Features Licensed by Any Account (Evidence of Nothing)

  There are aspects of your practice that do not prove your implicit theory because *any* theory of fiction would predict them. You should not read too much philosophical weight into these:

  *   **The Fortnightly Gathering:** Social appreciation of art is universal.
  *   **Dislike of Plot Spoilers:** Almost all theories agree that uncertainty drives narrative engagement. Even the Pretense Theory agrees that knowing the end of the game ruins the play.
  *   **Re-watching Films:** Aesthetic appreciation allows for repetition. We listen to sad music repeatedly; this does not prove the sadness is "real" in the biological sense, only that the experience is valuable.
  *   **The Distinction between Fiction and Nonfiction:** Everyone agrees there is a difference. Your specific *reason* for the distinction (emotional engineering vs. fact) is unique, but the distinction itself is standard.

  ### 4. Consistency Check

  Is your practice consistent? There is a tension, but it is resolvable.

  **The Tension:** You warn for fictional harm but not real harm (documentaries/obituaries). Yet, you also treat fiction spoilers as catastrophic, while biography outcomes are irrelevant.
  **The Resolution:** This is consistent *if* the goal of the group is **emotional processing** rather than **informational acquisition**.
  *   In a biography, the *outcome* is secondary to the *understanding* of the life. Knowing the end does not stop you from understanding the struggle.
  *   In a film, the *experience* is primary. Knowing the end bypasses the emotional struggle.
  *   Regarding the warnings: Real death in a documentary is often presented clinically or historically. Fictional death is presented *relationally*. Your practice presupposes that **relational proximity** causes more trauma than **factual proximity**. This is consistent with the "affect notes" working better than plot summaries. The note "about fathers" establishes relational proximity immediately.

  However, there is a risk of inconsistency in the **backfiring warnings**. If attention fuels emotion, then *any* warning directs attention. Your practice implicitly admits it cannot perfectly calibrate this. It assumes members have the agency to look away, but the warning makes looking away harder. This suggests the theory assumes a **rational agent** who can manage their attention, but the practice sometimes treats them as **passive recipients** of affect.

  ### 5. Alternative Practices

  If you were to replace your implicit theory with one of the three rival views you mentioned, your notes and etiquette would have to change fundamentally.

  #### A. The "Ordinary Emotion" View
  *The View:* Emotions about fiction are ordinary fear, pity, and grief directed at imagined or merely possible things. (This is closest to your current practice, but more literal.)
  *   **The Notes:** They would become more clinical and propositional. Instead of "you will cry," they would read: "This film depicts the irreversible loss of a parent." The focus would be on the *truth of the possibility*, not the *effect on you*.
  *   **The Etiquette:** You would treat the screening like a therapy session. If someone is devastated, the response would be "Your grief is valid because the loss is real in the world of the film." Re-watching a devastating film might be discouraged as "self-harm," since the emotion is identical to real grief. The boundary between the room and the outside world would dissolve further.

  #### B. The "Make-Believe" View
  *The View:* Emotions are a distinct state produced by a game of make-believe that only resembles real emotions.
  *   **The Notes:** The "affect notes" would vanish. They would be replaced by **Genre Notes**. "This is a Tragedy," "This is a Horror." This tells the player what *kind of game* they are about to play. A warning like "a dog dies" would be considered a spoiler that ruins the game mechanics.
  *   **The Etiquette:** The atmosphere would be lighter, more playful. If a member wept, the response would be, "That was a powerful performance of grief," rather than offering tissues and silence. Re-watching a devastating film would be encouraged as "mastering the game." The hospice context would feel jarringly inappropriate for this view, as it treats deep sorrow as a leisure activity.

  #### C. The "Generalization" View
  *The View:* What we respond to is not the invented particular at all but what the story shows about real life. (We don't cry for *Anna Karenina*; we cry for *the nature of love and society*.)
  *   **The Notes:** Specific warnings would be removed entirely. Notes would be purely thematic: "This film examines the isolation of old age." Warning that "a dog dies" would be seen as petty, because the dog is merely a symbol. The specific plot point doesn't matter; the universal truth does.
  *   **The Etiquette:** This would look like your history seminar. Spoilers would be irrelevant because the "truth" of the film is known before it starts. You could say, "This film shows how fathers fail their sons," before pressing play. The emotional impact would be expected to come from *recognition*, not *surprise*. The re-watching would be framed as "deepening understanding," not "re-experiencing pain."

  ### Conclusion

  Your current practice occupies a delicate middle ground. It acknowledges that the fiction is invented (hence the warnings, which wouldn't be needed for real life events where we cannot change the outcome), but it respects the emotion as real (hence the care).

  The "affect notes" that your member writes are, in effect, an attempt to bridge the gap between the **particulars of the plot** and the **universals of the viewer's life**. When she writes "this one is about fathers," she is moving the film from Category C (Generalization) into the viewer's Category A (Ordinary Emotion).

  The puzzle your friend mentioned asks how we can feel for what is not there. Your group has answered it pragmatically: We feel because what is *not there* (the father on screen) stands in for what *is no longer here* (the father in the room). Your notes are not just warnings; they are maps for navigating that substitution. To change the theory would be to change the care.
