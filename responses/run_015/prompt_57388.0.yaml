  3. Tell me what happens to the generalization problem: does your diagnosis block the comedy-and-awe version, or does it have to bite the bullet there?

  No bibliography and no citations, I'm mostly offline — talk about positions by type. And if your honest read is that the argument is valid and I should just take (9), say that instead and tell me which horn to grab.
