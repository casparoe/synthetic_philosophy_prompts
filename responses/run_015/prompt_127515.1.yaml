      *   **Mara's Argument:** Functional equivalence = universal. Demanding intrinsic sameness is arbitrary/parochial. Substrate irrelevant (like philosophy of mind/ecology).
      *   **Julian's Argument:** Functional equivalence without intrinsic sameness = "counterfeit universal." Functional profiles rely on "canonical" instances with shared nature. Explanatory priority: nature -> function. Functionalism risks collapsing distinct properties.
      *   **Requirements:** Real back-and-forth, equally competent characters, no resolution, no citations/references to real texts/authors.
