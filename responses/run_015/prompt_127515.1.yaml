      *   **Julian (Realism/Essentialism):** Properties are defined by what they *are*. Function is a symptom of nature, not the definition. If the underlying stuff is different, the property is different, even if the output matches. "Canonical instances" anchor the definition.

  3.  **Drafting - Section by Section:**

