      *   *Libertarian Cost:* They lose the "Consequence Argument" as a direct bridge to *responsibility*. They now need to prove indeterminism is *compatible* with control, not just that determinism is incompatible with APs.
      *   *Compatibilist Gain:* They no longer need to reconcile determinism with APs (a notorious difficulty). They just need to reconcile determinism with *guidance control*.
      *   *Hard Determinist Shift:* They can't rely on "No APs." They must rely on "No Ultimate Sourcehood."

