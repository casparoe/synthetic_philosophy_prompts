  A bioethicist is lecturing on moral status. "We can't use absolute brain size," he says, "or sperm whales would run the world. We must use Encephalization Quotient—brain size relative to body mass. It measures cognitive efficiency."

  A student raises her hand. "But a bottlenose dolphin has a higher quotient than a human newborn. Does the dolphin outrank the baby?"

