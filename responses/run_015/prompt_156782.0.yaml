  1.  **Analyze the Request:**
      *   **Topic:** A joke about whether brain size is morally relevant.
      *   **Punchline Requirement:** Must turn on the distinction between *absolute cranial capacity* (raw brain size) and *encephalization quotient* (EQ, brain size relative to body size/expected size).
      *   **Specific Tension:** If moral status tracks EQ-based cognitive capacity, some cetaceans (whales/dolphins) outrank human newborns.
      *   **Constraints:**
          *   Avoid generic "bigger brain means smarter" humor.
          *   Reward familiarity with the marginal-cases argument in animal ethics (the argument that if we grant rights based on capacities like rationality, then humans lacking those capacities [infants, severely disabled] should lose them, or animals with them should gain them).
          *   Must be intelligible without outside research (i.e., explain the concepts within the joke or make them obvious enough).

  2.  **Deconstruct the Concepts:**
      *   *Absolute Brain Size:* Whales have huge brains (bigger than humans).
      *   *Encephalization Quotient (EQ):* Adjusts for body size. Humans have high EQ. Dolphins also have high EQ.
      *   *Marginal Cases Argument:* If we say "high cognitive capacity = moral status," then what about humans with low capacity (newborns)? If dolphins have higher capacity/EQ than newborns, do dolphins have higher moral status?
      *   *The Twist:* The joke needs to highlight the absurdity or uncomfortable conclusion of using EQ as the moral metric, specifically comparing a whale/dolphin to a human baby.

