answer: |-
  ### 1. Exam Question

  **Course:** Graduate Seminar in Value Theory and Population Ethics
  **Examination:** Final Essay
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Question:**

  Consider a policy choice between two scenarios. **Scenario A** consists of a stable population of ten billion people, each existing at a welfare level of 100. **Scenario B** consists of the same ten billion people at welfare level 100, plus an additional one hundred billion lives existing at welfare level 1. In Scenario B, the additional one hundred billion lives are not suffering; however, they are described as "minimally conscious," possessing only the barest subjective experience. It is genuinely contested whether these minimally conscious entities fall within the scope of person-affecting moral restrictions.

  Standard totalism typically favors Scenario B due to aggregate sum, while averageism favors Scenario A. Person-affecting views often struggle to adjudicate non-identity cases involving additional lives.

  Write an essay evaluating whether a **modified threshold-sensitive person-affecting totalism** can coherently block the preference for Scenario B without collapsing into either pure averageism or an arbitrary welfare cutoff. Furthermore, analyze whether the "minimally conscious" framing introduces a distinct boundary problem regarding moral status that standard debates about aggregation tend to ignore.

  **Instructions:**
  *   Do not merely summarize the canonical formulation of the Repugnant Conclusion or rehearse the standard taxonomy of totalist, averageist, and person-affecting responses. Assume the examiner is familiar with the basic logical structure of these views.
  *   Your analysis must distinguish between what is broadly settled in population ethics (e.g., the logical structure of aggregation) and what remains genuinely contested (e.g., the defensibility of thresholds, the moral status of minimal consciousness).
  *   Do not present contested positions as consensus views. Maintain analytical neutrality while evaluating the coherence of the arguments.
  *   Write approximately 1,200 words.

  ***

  ### 2. Model Answer

  The choice between Scenario A and Scenario B replicates the logical structure of the Repugnant Conclusion, a settled feature of population ethics wherein a large population with low positive welfare outweighs a smaller population with high welfare under totalist aggregation. However, the specific framing of Scenario B introduces contested variables regarding moral status and threshold sensitivity that complicate standard aggregation models. To evaluate whether a modified threshold-sensitive person-affecting totalism can block the preference for Scenario B, one must analyze the coherence of excluding the additional lives without succumbing to arbitrariness or collapsing into alternative theories.

  Standard totalism is logically committed to Scenario B, as the aggregate sum of welfare in B (10 billion × 100 + 100 billion × 1) exceeds A (10 billion × 100). This is a settled logical outcome of unrestricted summation. However, the proposal involves a hybrid view: threshold-sensitive person-affecting totalism. This view attempts to retain the totalist aim of maximizing value while imposing person-affecting restrictions and welfare thresholds to exclude lives deemed insufficiently valuable or morally considerable.

  The first contested issue is whether the "minimally conscious" description provides a non-arbitrary basis for exclusion. Standard debates often assume all lives with positive welfare count equally toward the total. By framing the additional lives as possessing only bare subjective experience, the prompt invites a moral status distinction rather than a mere welfare distinction. Proponents of person-affecting restrictions might argue that entities lacking robust psychological capacities fall outside the scope of moral concern entirely. If these lives are not "persons" in the morally relevant sense, their welfare contributes zero to the total, preserving the preference for Scenario A. However, this moves the debate from aggregation to moral status, a distinct and contested boundary problem. Critics argue that drawing a line at "minimal consciousness" is as arbitrary as drawing a line at welfare level 10. If subjective experience exists, however bare, excluding it risks speciesism or capacity-based discrimination that lacks a settled philosophical foundation.

  The second contested issue is whether threshold sensitivity can avoid collapsing into averageism. A threshold-sensitive view excludes welfare below a certain point from the sum. If the threshold is set above welfare level 1, the additional lives in Scenario B are ignored, and Scenario A is preferred. However, if the view excludes these lives solely to avoid the Repugnant Conclusion, it faces the charge of ad hocery. To be coherent, the threshold must be grounded in a theory of value, not just a desired outcome. If the theory claims that welfare below a threshold has no moral weight, it functionally mimics averageism regarding the excluded population, as their existence does not impact the moral calculation despite adding to the population count. The distinction lies in whether the view denies the *value* of the life or the *status* of the being. If it denies the value, it risks implausible discontinuities (a life at 1.1 counts, a life at 0.9 does not). If it denies the status, it risks excluding sentient beings from moral consideration.

  Furthermore, the person-affecting component introduces the non-identity problem. Since the additional lives in Scenario B would not exist in Scenario A, they are not harmed by being excluded from the calculation unless one accepts a person-affecting view that accounts for potential persons. A modified person-affecting view might claim we have no obligation to bring into existence beings that fall below the threshold of moral status. Yet, this risks conflating the value of existence with the status of the existent. Standard population ethics treats these as separate variables; conflating them to block the Repugnant Conclusion is a contested maneuver that requires robust justification beyond avoiding counterintuitive results.

  Ultimately, whether this hybrid view coheres depends on resolving the contested boundary of moral status. If minimal consciousness is sufficient for moral standing, threshold-sensitive totalism struggles to exclude Scenario B without appearing arbitrary. If minimal consciousness is insufficient, the view avoids the Repugnant Conclusion but faces charges of exclusionary arbitrariness. The "minimally conscious" framing highlights a gap in standard aggregation debates, which often assume welfare levels map neatly onto moral considerability. This assumption is contested. A coherent defense requires showing that the threshold tracks a genuine metaphysical or moral discontinuity, not merely a heuristic to avoid counterintuitive totals. Without such a justification, the view risks collapsing into an unstable compromise that inherits the weaknesses of both totalism (aggregation difficulties) and person-affecting views (non-identity complications) without securing the strengths of either.

  ***

  ### 3. Marking Scheme

  **Total Points:** 25
  **Grading Logic:**
  *   **A-Range (23–25 points):** All five analytical moves executed with precision. Demonstrates clear distinction between settled and contested claims.
  *   **B-Range (15–22 points):** Competent analysis but missing or mishandling at least two of the five moves. May blur settled/contested distinctions.
  *   **C-Range or Below (0–14 points):** Fundamental misunderstandings, summary rather than analysis, or failure to address the specific prompt constraints.

  | Analytical Move | Points | Typical Failure Mode |
  | :--- | :---: | :--- |
  | **1. Reconstruction of A/B Choice:** Accurately situates the scenario within the logical structure of the Repugnant Conclusion (settled) without merely summarizing the canonical problem. | 5 | Treating the scenario as a standard RC problem without noting the specific welfare/population variables provided. |
  | **2. Moral Status Boundary:** Analyzes the "minimally conscious" framing as a contested boundary problem regarding moral status distinct from standard welfare aggregation. | 5 | Treating minimal consciousness as merely "low welfare" rather than a contested status condition. |
  | **3. Threshold Arbitrariness:** Evaluates the vulnerability of the threshold mechanism to charges of arbitrariness (contested) without asserting a definitive resolution. | 5 | Asserting the threshold is definitely arbitrary or definitely justified without exploring the tension. |
  | **4. Collapse Risk:** Assesses the risk of the hybrid view collapsing into averageism or exclusionary person-affecting views (contested coherence). | 5 | Failing to explain *how* the view collapses or claiming it successfully avoids collapse without qualification. |
  | **5. Methodological Neutrality:** Maintains neutrality regarding contested positions (e.g., defensibility of person-affecting views) throughout the essay. | 5 | Presenting contested claims (e.g., "Totalism is false") as settled consensus facts. |

  **Distinction between A-Range and B-Range:**
  *   **A-Range:** The essay seamlessly integrates all five moves. The distinction between settled logic (e.g., total sum calculations) and contested theory (e.g., moral status of minimal consciousness) is explicit and rigorous. The argument remains neutral, evaluating coherence rather than truth.
  *   **B-Range:** The essay is competent but may treat contested issues as settled (Move 5) or fail to distinguish the "minimal consciousness" variable from standard low-welfare cases (Move 2). Typically, B-range essays will mishandle at least two moves, such as providing a definitive verdict on the threshold's validity or summarizing the RC rather than analyzing the specific hybrid view.
