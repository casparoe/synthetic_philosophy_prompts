      *   The risk of unfalsifiability is high. If "grammar" is undefined enough, it explains everything and nothing.
      *   I need to dig into psychophysics, neuroscience, and computational modeling literature that challenges structural/relational accounts of letter/character recognition.

  3.  **Brainstorming Defeaters (Potential Counter-Evidence):**

