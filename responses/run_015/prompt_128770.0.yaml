  3.  **Evaluate against Philosophical Concepts (TA Persona):**
      *   **Appiah:** Focuses on *honor codes* and *social scripts*. Change happens when the script no longer confers honor or confers shame. It's deeply social/collective.
      *   **Williams:** Focuses on *thick ethical concepts* and *internal reasons*. A norm collapses when agents can no longer see it as a valid reason for action within their subjective motivational set (often linked to the loss of a shared ethical life).
