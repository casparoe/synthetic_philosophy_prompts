      *   **"Honor-Deficit Cascade":** This is not Appiah's term. It sounds like the student is coining a phrase to describe the tipping point mechanism. As long as the *logic* holds (social payout < risk cost = norm death), it's acceptable creative application, though technically not exegesis.
