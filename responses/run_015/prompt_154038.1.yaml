answer: |-
  **Mara:** You're treating my position like I'm building a ladder. I'm not. I'm drawing a map. When I talk about **dimensional vector comparison**, I mean we plot events across distinct axes—scale of killing, institutional intentionality, **reversibility** of harm. The Rwandan genocide might max out on scale and intentionality. Apartheid might max out on duration and structural embeddedness. They occupy different coordinates. There is no single "higher" point.

  **Jonah:** But the moment you put them on the same map, you imply they share a coordinate system. That's the **hidden metric**. You say the axes are non-aggregable, but why choose *those* axes? Why not "cultural destruction" or "theological violation"? By selecting dimensions, you've already decided what counts as comparable. You're smuggling in commensurability under the guise of geometry.

  **Mara:** I'm selecting dimensions relevant to justice, not metaphysics. If we don't map them, we can't navigate. Look at transitional justice bodies. They have scarce resources. If a fund has money to repair land dispossession or fund trauma counseling, but not both, they need to know the shape of the harm. Refusing comparison produces moral paralysis.

  **Jonah:** I grant the paralysis point in extreme scarcity. That's my **threshold particularism**. I argue that each atrocity possesses a specific **moral remainder**—an unrepairable wrong that survives any mechanism. Comparing them generally trains the moral imagination to treat suffering as exchangeable. But if a reparations tribunal *must* choose between Claimant A and Claimant B to survive, you cross a threshold where practical necessity overrides the philosophical prohibition.

  **Mara:** That exception collapses into my framework. If a tribunal can compare Claimant A and Claimant B, they are using dimensions. They are weighing reversibility or scale. If it's permissible there, it's permissible as a conceptual tool. You're just restricting who holds the pen.

  **Jonah:** No, the context changes the moral weight of the tool. In a tribunal, the comparison is forced by material limits, not intellectual curiosity. It's a tragic remainder, not a truth claim. When you do it as a general philosophical exercise, you suggest the comparison reveals something *true* about the events themselves. It doesn't. It reveals something about the budget.

  **Mara:** But the budget constraints are real. The harm is real. If I say Apartheid caused less immediate death than Rwanda but more **reversibility** issues because the laws remain embedded, I'm not saying one is "worse." I'm saying the *vector* points differently. Doesn't that help you protect the moral remainder? You identify what cannot be repaired.

  **Jonah:** It helps you allocate funds, Mara. It doesn't help you understand the wrong. By breaking the atrocity into dimensions, you fragment the **moral remainder**. The victim doesn't experience "intentionality" separate from "scale." They experience the event. Your vector dissects the wound to measure it. My threshold particularism says: acknowledge the wound is unique until the moment you are forced to cut the budget.

  **Mara:** So you'd tell a Truth Commission not to analyze structural violence versus episodic violence because it risks commensurability? That seems like you're protecting philosophy at the expense of policy.

  **Jonah:** I'm protecting the victim from becoming a data point. If the Commission must recommend resource allocation, fine. Use your vectors. But don't publish a report ranking the "severity" of historical eras. That's where the **hidden metric** does harm. It suggests history is a competition.

  **Mara:** I agree ranking is obscene. We share that. But without vectors, how do you prevent the paralysis? You say "threshold particularism." Where is the threshold? Is it when money runs out? Is it when two victims speak at the same time?

  **Jonah:** The threshold is institutional coercion. When the state says, "We can only fix one thing," you compare. Until then, you particularize. You listen to the Rwandan survivor without asking how their pain compares to the Argentine desaparecido.

  **Mara:** But the state is always saying "we can only fix one thing." Resources are always scarce. So your threshold is always met. Which means you're always comparing. You're just hiding the vector behind a veil of "necessity."

  **Jonah:** No. Because in the general case, I refuse the question. "Which was worse?" I say "Neither." In the tribunal case, I answer "Which is more urgent given constraints?" I say "This one." The first is a moral judgment; the second is a triage decision. You're conflating triage with truth.

  **Mara:** Triage *requires* truth about the injury. If I don't know the injury is irreversible, I can't triage. So I need the dimensions. You need my vectors to make your threshold decision coherent.

  **Jonah:** I need the dimensions to stop the bleeding. I don't need them to define the patient. You want to define the patient by the bleeding. That's the divergence.

  **Mara:** Then we agree on the tool, but not the ontology.

  **Jonah:** We agree on the tool's utility in crisis. We disagree on whether using it outside crisis corrupts the memory of the dead.

  **Mara:** And I say leaving the tools in the box corrupts the living.

  **Jonah:** Then we're still talking past each other. But at least we know why.

