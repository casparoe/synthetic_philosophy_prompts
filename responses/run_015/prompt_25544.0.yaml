prompt: |-
  I serve on a university sexual misconduct hearing panel. We hear about two dozen cases a year, and the single question we spend the most time on is whether the complainant's consent was valid — or, in cases where the respondent claims they reasonably believed consent was present, whether that belief was reasonable given what they knew about deception, pressure, or the complainant's capacity at the time. The panel includes faculty from across the university (history, chemistry, engineering) and two students; nobody has formal training in the philosophy of consent, and our training materials mostly recite policy language without helping us operationalize it. We are not lawyers, we do not apply rules of evidence, and we deliberate in a conference room with a whiteboard, not a courtroom.

  I want a decision procedure we can use during deliberations, after the factual disputes have been resolved as best we can, to assess whether consent was validly given. The procedure should walk us through the three main threats to validity — deception, coercion, and incompetence — in a structured order, with concrete questions for each, thresholds for what counts as sufficient to undermine consent, and explicit flags for where the procedure cannot decide and the panel must exercise judgment. The procedure should be usable by non-philosophers in under thirty minutes, and it should be honest about which steps are genuinely rule-like and which are judgment calls dressed up as criteria. Where the philosophical literature contains a genuine dispute that bears on a step — for instance, about whether consent is fundamentally a mental state or a communicative act, or about whether the standard for competence should be fixed or vary with the stakes of the decision — please flag that dispute and tell us how to proceed in spite of it, rather than pretending it does not exist.

  Please then apply the procedure to three cases. First: a complainant alleges they consented to sex only because the respondent told them they were in a committed relationship and had ended things with their other partner; the respondent admits they were still seeing the other partner and had no intention of ending that relationship, but argues that people misrepresent their romantic intentions all the time and this does not rise to the level of invalidating consent. Second: a graduate student alleges they consented to a sexual relationship with their thesis advisor only because they feared that refusing would damage their career; the advisor never made any explicit threat but acknowledges they were aware of the power differential. The university's policy is silent on whether advisor-student relationships are per se prohibited. Third: both parties agree the complainant had been drinking heavily — somewhere between six and nine drinks over four hours — and initiated the sexual encounter, but the complainant says they were too intoxicated to meaningfully consent and the respondent says the complainant was lucid, conversational, and appeared to be making decisions normally.

  For each case, walk through the procedure step by step and tell me what it yields. I especially want to see a case where the procedure returns an answer the panel will find uncomfortable — perhaps because it says consent was valid when our instincts say otherwise, or invalid when we would prefer to find it valid. Finally, tell me what this procedure systematically cannot handle: the kinds of cases or considerations it will miss, and where the underlying philosophical theory itself is unsettled enough that no procedure could settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case applications:

  1.  **Analyze the Request:**
      *   **User:** Member of a university sexual misconduct hearing panel.
      *   **Context:** ~24 cases/year, panelists are non-experts (faculty/students), no legal training, informal setting (conference room), 30-minute deliberation limit for this specific task.
      *   **Problem:** Need a structured decision procedure to assess *validity of consent* (specifically focusing on deception, coercion, and incompetence) after facts are found.
      *   **Requirements:**
          *   Structured order (Deception, Coercion, Incompetence).
          *   Concrete questions & thresholds.
          *   Explicit flags for judgment calls vs. rules.
          *   Acknowledge philosophical disputes (mental state vs. communicative act, fixed vs. variable competence).
          *   Apply to three specific cases (Deception about relationship status, Power differential/Advisor-Student, Intoxication).
          *   Highlight uncomfortable outcomes.
          *   Discuss limitations of the procedure.

  2.  **Deconstruct the Philosophical & Policy Landscape:**
      *   *Consent Theory:* There are two main camps: Attitudinal (internal mental state) and Performative (communicative act). Most university policies lean towards a hybrid but often prioritize the communicative aspect for adjudicability. I need to acknowledge this tension.
      *   *Deception:* Fraud in the inducement vs. fraud in the factum. In sexual contexts, deception about status/identity usually invalidates, but deception about feelings/intentions is trickier.
      *   *Coercion:* Threats vs. Offers vs. Background Conditions. Power differentials create "structural coercion."
      *   *Incompetence:* Intoxication. The line between "buzzed" and "incapacitated." Fixed standard vs. contextual.
      *   *Reasonable Belief:* The prompt mentions the respondent's belief. This adds an objective/subjective hybrid layer (Mens Rea).

  3.  **Drafting the Decision Procedure (The "Consent Validity Protocol"):**
      *   *Goal:* Usable in 30 mins, honest about ambiguity.
      *   *Structure:*
          1.  Preliminary Check (Communicative vs. Mental).
          2.  Step 1: Incapacity (Incompetence). *Why first?* If they couldn't consent, nothing else matters.
          3.  Step 2: Coercion/Pressure. *Why second?* External force negates will.
          4.  Step 3: Deception/Fraud. *Why third?* Often the subtlest.
          5.  Step 4: Reasonable Belief (Respondent's side).
      *   *Philosophical Flags:* Need to explicitly state where the panel is making a policy choice, not finding a metaphysical truth.
      *   *Thresholds:* Need to be concrete (e.g., "Would a reasonable person in C's position feel they had no choice?").

  4.  **Refining the Steps (Self-Correction during drafting):**
      *   *Critique:* Is 30 minutes enough for all three steps?
      *   *Adjustment:* Make it a flowchart style. If Step 1 is "Yes (Incapacitated)," stop. Don't waste time on coercion if they were unconscious.
      *   *Critique:* How to handle the "Mental vs. Communicative" dispute?
      *   *Adjustment:* Adopt a "Communicative Presumption" for adjudication purposes (what was said/done) but allow rebuttal by evidence of internal state (frozen fright, etc.). This is practical for a hearing panel.
      *   *Critique:* How to handle the "Reasonable Belief"?
      *   *Adjustment:* This is a separate prong. Even if consent was invalid, was the respondent culpable? The prompt asks specifically about *validity of consent*, but mentions the respondent's belief. I should focus primarily on validity, but include a "Culpability Check" at the end because the prompt highlights the "reasonable belief" aspect in the intro. Actually, re-reading the prompt: "assess whether consent was validly given." I will keep the focus on validity, but acknowledge the respondent's knowledge in the Deception/Coercion steps.

  5.  **Developing the Three Cases:**

      *   **Case 1 (Deception - Relationship Status):**
          *   *Issue:* Fraud in the inducement (feelings/status) vs. factum (identity/STI status).
          *   *Philosophical Tension:* Does lying about love invalidate sex? Many philosophers say no (autonomy was exercised, just on bad info), others say yes (contextual integrity violated).
          *   *Procedure Outcome:* Likely "Valid Consent" under strict procedural rules, which feels uncomfortable. This satisfies the "uncomfortable outcome" requirement.
          *   *Reasoning:* Deception about future intent is usually not sufficient to vitiate consent in most legal/philosophical frameworks unless policy says otherwise.

      *   **Case 2 (Coercion - Power Differential):**
          *   *Issue:* Implicit threat vs. structural pressure.
          *   *Philosophical Tension:* Is a "choice" made under structural inequality free?
          *   *Procedure Outcome:* Depends on the "Threat Threshold." If no explicit threat, it might lean "Valid," which is uncomfortable given the power dynamic. OR, if the procedure acknowledges "structural coercion," it finds "Invalid." I need to make the procedure nuanced enough to catch this but honest about the difficulty. Let's aim for the "Invalid" finding but highlight the friction. Actually, to meet the "uncomfortable" constraint, maybe the procedure says "Valid" because no *explicit* threat was made, highlighting the limitation of the tool. Let's go with that: The procedure struggles with implicit structural coercion.
          *   *Correction:* The prompt asks for a procedure that *helps*. A procedure that fails to catch power dynamics isn't helpful. I will design the Coercion step to include "Conditional Offers based on Authority." If the advisor implies career success is tied to compliance, that's coercion.
          *   *Decision:* I will make the outcome "Invalid" but note the discomfort lies in the *ambiguity* of the advisor's words. Or, better yet, I will make the outcome "Valid" regarding *coercion* (because no threat was uttered) but flag the policy gap. This highlights the "uncomfortable" requirement best. Let's go with: Procedure finds consent *technically valid* regarding coercion (no explicit quid pro quo), forcing the panel to confront the policy silence.

      *   **Case 3 (Incompetence - Intoxication):**
          *   *Issue:* Affirmative consent vs. Incapacitation.
          *   *Philosophical Tension:* Fixed threshold vs. Functional capacity.
          *   *Procedure Outcome:* This is usually the clearest. If "lucid and conversational," procedure likely says "Valid." Complainant says "too intoxicated."
          *   *Uncomfortable Angle:* If the procedure relies on *observable behavior* (communicative), it might validate consent even if the complainant felt internally compromised. This touches the Mental vs. Communicative dispute.

  6.  **Drafting the Limitations Section:**
      *   What does this miss? Cultural context, trauma responses (freezing), retrospective regret, systemic bias in the panel itself.
      *   Philosophical unsettledness: The nature of autonomy itself.

  7.  **Review against Constraints:**
      *   *30 minutes?* Yes, keep steps concise.
      *   *Non-philosophers?* Avoid jargon (e.g., use "Lies about facts" instead of "Fraud in the factum").
      *   *Honest about disputes?* Yes, add "Philosopher's Note" boxes.
      *   *Three cases?* Yes.
      *   *Uncomfortable outcome?* Yes, specifically in Case 1 and 2.

  8.  **Final Polish:**
      *   Ensure tone is respectful, serious, and institutional but practical.
      *   Make sure the "Decision Procedure" is distinct from the "Case Applications."
      *   Check the "Reasonable Belief" aspect. The prompt asks to assess *validity*, but mentions the respondent's belief in the intro. I will add a "Step 4: Respondent's Knowledge" to address the "reasonable belief" component mentioned in the prompt's intro ("...or, in cases where the respondent claims they reasonably believed consent was present..."). This makes the procedure complete for a hearing panel.

      *(Self-Correction on Case 2)*: If the policy is silent on advisor relationships, finding "Invalid Consent" based on coercion is a huge leap. Finding "Valid Consent" is ethically fraught. I will use this to show the procedure's limit. The procedure will likely find "Valid" because the threshold for coercion (threat of harm) isn't met by mere silence/power, forcing the panel to realize they need a policy change, not just a ruling. This is a strong "uncomfortable" lesson.

      *(Self-Correction on Case 1)*: Lying about relationship status. Most Title IX guidelines distinguish between deception regarding *sexual nature* (invalidates) vs. *collateral matters* (doesn't invalidate). I need to make sure the procedure reflects this distinction so the panel doesn't just guess.

      *(Refining the Procedure Structure)*:
      1. Capacity (Incompetence)
      2. Coercion (Pressure)
      3. Deception (Information)
      4. Respondent's Reasonable Belief (Culpability check)

      Let's write it.

  9.  **Final check of the "Uncomfortable Outcome":**
      *   Case 1 (Lying about love): Procedure likely says Consent Valid. (Uncomfortable because lying feels wrong).
      *   Case 2 (Advisor): Procedure likely says Consent Valid (no explicit threat). (Uncomfortable because power dynamic feels exploitative).
      *   Case 3 (Alcohol): Procedure likely says Consent Valid (observable lucidity). (Uncomfortable if Complainant felt internally unable).
      *   I will select Case 1 as the primary "uncomfortable" one in the analysis, as it's the clearest clash between moral intuition and procedural rules.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ## The Consent Validity Protocol (CVP)

  **Purpose:** To assist hearing panels in determining whether consent was validly given after factual disputes are resolved.
  **Time Limit:** 30 Minutes.
  **Users:** Non-specialist faculty and students.
  **Philosophical Stance:** This procedure adopts a **Communicative Presumption**. It treats consent as primarily something *done* (words/actions) rather than something *felt* (internal mental state), because panels cannot read minds. However, it allows exceptions where internal states (like freezing) are evidenced by behavior.

  ---

  ### Step 0: The Threshold Check (2 Minutes)
  **Question:** Did the complainant express agreement through words or actions at the time of the incident?
  *   **Yes:** Proceed to Step 1.
  *   **No:** Consent is **Invalid**. Stop. (Exception: If the respondent argues non-verbal cues constituted consent, proceed to Step 4).
  *   **Philosophical Flag:** *Mental State vs. Communicative Act.* Philosophers dispute whether consent is an internal permission or an external performance. We prioritize performance for adjudication. If the Complainant says "I said yes but internally felt no," the procedure prioritizes the "yes" unless Step 2 or 3 applies.

  ### Step 1: Incapacity (Incompetence) (8 Minutes)
  **Goal:** Determine if the complainant had the cognitive ability to understand the decision.
  **Evidence:** Intoxication, disability, sleep, age.

  **The Questions:**
  1.  **Fixed Threshold:** Was the complainant unconscious, asleep, or physically incapacitated (e.g., vomiting, unable to stand)?
      *   If **Yes**: Consent is **Invalid**. Stop.
  2.  **Functional Threshold:** If conscious, could they understand the *nature* of the act (that it was sexual) and the *identity* of the partner?
      *   *Look for:* Slurred speech, inability to recall basic facts, confusion about location/time.
      *   If **No**: Consent is **Invalid**. Stop.
      *   If **Yes**: Proceed to Step 2.

  **Philosophical Flag:** *Fixed vs. Variable Competence.* Some argue competence varies with the "stakes" of the decision (sex has high stakes, so capacity threshold should be high). Others argue for a fixed cognitive threshold. **Protocol Directive:** Use the **Functional Threshold**. Do not invalidate consent merely because the complainant was "very drunk" if they demonstrated understanding of the act and partner. This is a judgment call; if panelists disagree on "lucidity," vote.

  ### Step 2: Coercion (Pressure) (8 Minutes)
  **Goal:** Determine if agreement was obtained through force or threat that eliminated meaningful choice.
  **Evidence:** Threats, physical force, abuse of authority.

  **The Questions:**
  1.  **Direct Threat:** Did the respondent threaten specific harm (physical, academic, professional) if the complainant refused?
      *   If **Yes**: Consent is **Invalid**. Stop.
  2.  **Conditional Offer (Quid Pro Quo):** Did the respondent imply that compliance was required for a benefit (grade, promotion, favor) to which the complainant was otherwise entitled?
      *   If **Yes**: Consent is **Invalid**. Stop.
  3.  **Background Pressure:** Was there a power differential (boss/employee, advisor/student) *without* explicit threats?
      *   *Action:* Acknowledge the pressure but **Presume Valid** unless Step 2.1 or 2.2 is met.
      *   *Reasoning:* Without explicit conditioning, fear of future repercussions is often speculative.
      *   Proceed to Step 3.

  **Philosophical Flag:** *Structural Coercion.* Feminist philosophers argue that power differentials *themselves* coerce, making consent impossible. Liberal philosophers argue consent is valid as long as no specific threat is made. **Protocol Directive:** We follow the **Liberal Standard** for adjudication. Structural pressure alone does not invalidate consent under this procedure, though it may violate other university policies. This is a **Judgment Call** zone; if the panel feels the power dynamic was exploitative, note it, but do not rule "Invalid Consent" solely on status unless policy dictates.

  ### Step 3: Deception (Fraud) (8 Minutes)
  **Goal:** Determine if lies undermined the nature of the act.
  **Evidence:** Lies about identity, status, health, or intentions.

  **The Questions:**
  1.  **Fraud in the Factum (Nature of Act):** Did the respondent lie about what the act *was*? (e.g., claiming a medical procedure was sex, or hiding a condom during withdrawal).
      *   If **Yes**: Consent is **Invalid**. Stop.
  2.  **Fraud in the Identity:** Did the respondent impersonate someone else (e.g., a spouse in the dark)?
      *   If **Yes**: Consent is **Invalid**. Stop.
  3.  **Fraud in the Inducement (Collateral Matters):** Did the respondent lie about feelings, relationship status, wealth, or future intentions to persuade the complainant?
      *   *Action:* **Presume Valid**.
      *   *Reasoning:* Lies about love or status change the *motivation* for consent, not the *nature* of the consented act.
      *   Proceed to Step 4.

  **Philosophical Flag:** *The Scope of Deception.* There is no consensus on whether lying about STI status or relationship exclusivity invalidates consent. Some argue it violates bodily autonomy; others argue it is a moral wrong but not a violation of sexual consent. **Protocol Directive:** Unless university policy explicitly states that lying about [X] invalidates consent, treat lies about feelings/status as **Collateral**. This will feel uncomfortable. It is a rule, not a moral truth.

  ### Step 4: Respondent's Reasonable Belief (Culpability Check) (4 Minutes)
  **Goal:** If consent was Invalid (Steps 1-3), was the respondent culpable?
  **Evidence:** What the respondent knew at the time.

  **The Questions:**
  1.  Given the facts known to the respondent *at the time*, would a reasonable person have believed consent was valid?
  2.  Did the respondent ignore "stop" cues or signs of incapacity?
      *   If **Yes**: Respondent is **Responsible**.
      *   If **No** (e.g., deception was undetectable): Respondent may be **Not Responsible** despite invalid consent.

  ---

  ## Case Applications

  ### Case 1: The Deceptive Partner
  **Facts:** Complainant (C) consented based on Respondent's (R) claim of a committed, exclusive relationship. R was seeing someone else and lied. R argues lies about feelings are common.
  **Procedure Walkthrough:**
  *   **Step 0:** C expressed agreement. (Proceed)
  *   **Step 1:** No evidence of intoxication or incapacity. (Proceed)
  *   **Step 2:** No threats or force. (Proceed)
  *   **Step 3:**
      *   3.1 (Nature of Act): No lie about the sex act itself.
      *   3.2 (Identity): No impersonation.
      *   3.3 (Collateral): R lied about relationship status/intentions.
      *   **Protocol Ruling:** Under Step 3.3, this is **Fraud in the Inducement**. Consent is **Valid**.
  *   **Step 4:** N/A (Consent Valid).

  **Outcome:** **No Violation of Sexual Misconduct Policy (regarding consent).**
  **The Uncomfortable Truth:** The procedure yields a finding of "Valid Consent." This clashes with the moral intuition that sex obtained by lying about love is exploitative.
  **Why:** The procedure distinguishes between *what* you are consenting to (sex) and *why* you are consenting (love/commitment). Philosophically, this is the "Liberal" view of autonomy: you own your body, and if you knowingly let someone touch it, you consented, even if your reasons were manipulated.
  **Panel Guidance:** You may feel this is unjust. However, unless your policy explicitly bans "deception regarding relationship status," ruling this as sexual misconduct expands the definition of consent beyond adjudicable limits. This is a **Policy Gap**, not a consent failure. Recommend policy review, but do not find R responsible for *non-consensual* sex under this protocol.

  ### Case 2: The Advisor and the Student
  **Facts:** Grad student (C) consented to thesis advisor (R). C feared career damage if they refused. R knew of the power differential but made no explicit threats. Policy is silent on relationships.
  **Procedure Walkthrough:**
  *   **Step 0:** C expressed agreement. (Proceed)
  *   **Step 1:** No incapacity. (Proceed)
  *   **Step 2:**
      *   2.1 (Direct Threat): No explicit threat made.
      *   2.2 (Conditional Offer): No explicit "sex for grades" offer.
      *   2.3 (Background Pressure): Power differential exists.
      *   **Protocol Ruling:** Under Step 2.3, structural pressure alone **Presumes Valid**.
  *   **Step 3:** No deception regarding the act. (Proceed)
  *   **Step 4:** N/A.

  **Outcome:** **Consent Valid.**
  **The Uncomfortable Truth:** The procedure validates consent in a scenario that feels inherently coercive due to the power imbalance.
  **Why:** This highlights the **Structural Coercion Flag** in Step 2. Adjudicating "implicit coercion" is notoriously difficult because it relies on the complainant's internal fear rather than the respondent's external actions. To find "Invalid Consent" here requires the panel to rule that *all* advisor-student sex is non-consensual.
  **Panel Guidance:** If you find this outcome unacceptable, you are actually arguing that the university should have a **Per Se Prohibition** policy (banning the relationship entirely), rather than a consent-based policy. A consent procedure cannot fix a policy that allows inherently coercive relationships. You should find "No Violation of Consent Policy" but strongly recommend the administration ban such relationships prospectively.

  ### Case 3: The Intoxicated Initiator
  **Facts:** C had 6-9 drinks over 4 hours. C initiated. C says they were too intoxicated to meaningfully consent. R says C was lucid/conversational.
  **Procedure Walkthrough:**
  *   **Step 0:** C expressed agreement (initiated). (Proceed)
  *   **Step 1:**
      *   1.1 (Fixed Threshold): C was not unconscious/vomiting.
      *   1.2 (Functional Threshold): R observed C as "lucid, conversational, making decisions." C claims internal incapacity.
      *   **Protocol Ruling:** The procedure prioritizes **Communicative/Functional** evidence over retrospective internal states. If C could converse and initiate, they meet the Functional Threshold. Consent is **Valid**.
  *   **Step 2 & 3:** No coercion or deception.
  *   **Step 4:** R's belief was reasonable based on observation.

  **Outcome:** **Consent Valid.**
  **The Uncomfortable Truth:** The procedure may validate consent even if the complainant was significantly impaired, provided they could "perform" sobriety.
  **Why:** This addresses the **Mental State vs. Communicative Act** dispute. If we prioritize the internal mental state, almost no intoxicated sex could be adjudicated because we cannot know what the complainant felt internally. If we prioritize communication, we risk validating sex where the complainant was "blacked out" but functioning on autopilot.
  **Panel Guidance:** This is the hardest judgment call. If there is evidence of "blackout" (memory loss) *combined* with high consumption, you may vote to override the Functional Threshold under Step 1.2. However, be honest: you are prioritizing the Complainant's internal state over the Respondent's observable reality. This increases the risk of punishing the Respondent for something they could not have known. Stick to the **Functional Threshold** unless memory loss is severe and corroborated.

  ---

  ## Limitations: What This Procedure Cannot Handle

  As you deliberate, you must acknowledge where this tool breaks down. No procedure can resolve deep philosophical disputes, only manage them.

  **1. The "Frozen Fright" Problem (Trauma Responses)**
  *   **The Gap:** Step 0 requires expression of agreement. Many trauma survivors freeze or dissociate, offering no "no" but feeling no "yes."
  *   **The Limit:** This procedure relies on communicative acts. If a complainant went limp and silent, the procedure might flag this as "No Consent" (Step 0), but if they nodded mechanically, it might flag "Valid."
  *   **Philosophical Unsettledness:** Is consent the absence of resistance, or the presence of desire? This procedure assumes the former for practicality. It cannot account for internal dissociation that looks like compliance.

  **2. Retrospective Regret vs. Invalid Consent**
  *   **The Gap:** Case 1 and Case 2 highlight this. A complainant may regret sex because they feel used, manipulated, or realize the power dynamic was harmful.
  *   **The Limit:** This procedure distinguishes between *bad sex* (or even *immoral sex*) and *non-consensual sex*. It cannot remedy situations where the sex was consensual but ethically dubious.
  *   **Philosophical Unsettledness:** Some ethicists argue that exploitation *vitiates* consent. This procedure rejects that for adjudicative clarity. You will have cases where the Respondent did nothing "wrong" procedurally, but the Complainant was harmed. This procedure cannot fix that; only broader cultural or policy changes can.

  **3. The "Reasonable Person" Bias**
  *   **The Gap:** Step 4 relies on a "Reasonable Person" standard for the Respondent's belief.
  *   **The Limit:** Who is the "Reasonable Person"? In a room of faculty and students, this standard is inevitably shaped by the panel's own demographics and biases.
  *   **Philosophical Unsettledness:** There is no objective "reasonable person." There is only a socially constructed one. If your panel lacks diversity, your application of Step 4 will be systematically biased. This procedure cannot correct for the composition of the panel itself.

  **4. Cumulative Micro-Coercion**
  *   **The Gap:** Step 2 looks for specific threats or quid pro quos.
  *   **The Limit:** Coercion can be a "death by a thousand cuts"—subtle hints, mood shifts, or prior patterns of behavior that create pressure without a specific threat.
  *   **Philosophical Unsettledness:** At what point does pressure become coercion? There is no bright line. This procedure draws an arbitrary line at "explicit conditioning." Cases falling in the gray zone will remain unresolved by this tool.

  ### Final Instruction to the Panel
  Use this procedure to ensure consistency, not to absolve yourselves of judgment. When the procedure yields an "Uncomfortable Truth" (like Case 1 or 2), do not twist the facts to fit a moral outcome. Instead, record the outcome as "Valid Consent" and attach a **Recommendation for Policy Review**. It is better to admit the policy is insufficient than to corrupt the fact-finding process to achieve a desired result.
