  **Joint Statement of Adversarial Collaboration on Testimonial Warrant**

  **I. Agreed Claims**

  1.  Neither party requires Cartesian certainty; justification is fallible and defeasible.
  2.  The disagreement is not about whether hearers *actually* monitor for competence and sincerity (both agree they do), but whether this monitoring *constitutes* the warrant or merely *checks* it.
  3.  Both grant that global skepticism is false; testimony generally yields knowledge.
  4.  Reductionist grants: A purely circular calibration (using testimony to prove testimony) is invalid.
  5.  Anti-Reductionist grants: Indiscriminate credulity is irresponsible; defeaters kill justification.
  6.  Both agree the dispute is normative, not merely psychological.
  7.  Both agree that "default" does not mean "immune to revision."
  8.  Both agree that the hearer need not possess conscious access to their justificatory reasons.

  **II. Residual Disagreements**

  | Point of Disagreement | Reductionist Formulation | Anti-Reductionist Formulation |
  | :--- | :--- | :--- |
  | **Constitution of Warrant** | Warrant is constituted by the hearer's independent inductive evidence regarding reliability. | Warrant is constituted by the communicative act itself, governed by a normative presumption of trust. |
  | **Burden of Proof** | The hearer bears the burden to possess positive reasons (local or global) to believe. | The speaker bears the burden to be trustworthy; the hearer is entitled to believe unless reasons to doubt exist. |
  | **Source Individuation** | Testimony is not a basic source; it reduces to perception, memory, and induction. | Testimony is a basic, *sui generis* source with its own normative structure. |

  **III. Cruxes**

  **1. The Uncalibrated-Source Problem**
  *Case:* A hearer encounters a machine system or community with zero prior track record (e.g., first contact).
  *Bootstrapping Status:* This is the "epistemic basement" dispute rescaled, not a separate crux. It tests whether non-testimonial evidence must be strictly prior to testimonial warrant.
  *Reductionist Prediction:* Belief is unjustified guesswork until non-testimonial correlation is established. Warrant grows slowly via induction from non-testimonial outcomes.
  *Anti-Reductionist Prediction:* Belief is immediately justified via a presumption of rationality/truthfulness. Warrant exists unless specific defeaters (e.g., obvious malfunction) appear.
  *Stakes:* If Reductionism is correct, first-contact knowledge is impossible without independent verification. If Anti-Reductionism is correct, knowledge is immediate but risks error from novel deception.

  **2. Informative Silence**
  *Case:* A medical handover omits a known allergy where protocol dictates disclosure.
  *Reductionist Prediction:* This is an inference from convention ("If allergy, say Y; didn't say Y; so no allergy"), not testimony. Warrant scales with the hearer's independent knowledge of the convention. No speaker, no testimony.
  *Anti-Reductionist Prediction:* Testimonial norms cover expected assertions. Silence invokes the same warrant structure as speech. Warrant equals explicit assertion unless the convention is unknown to the hearer.
  *Cost:* Reductionism risks inability to explain warrant without an explicit sayer; Anti-Reductionism risks over-generating warrant for any patterned absence (e.g., a tree not falling).
  *Test:* Does the hearer feel entitled to blame the speaker for the omission? If yes, Anti-Reductionism captures the normative force better.

  **3. The Verbal Dispute on "Default"**
  *Case:* Analyzing the phrase "default justification."
  *Terminological Overlap:* Both agree hearers need no *conscious* argument. Both agree warrant is defeasible. Both agree "default" does not mean "blind."
  *Substantive Remainder:* Is the normative structure of communication reducible to evidence-based norms?
  *Neutral Restatement:* Does the justification for belief depend on the *existence* of evidence (Reductionist) or the *absence of defeaters* within a communicative norm (Anti-Reductionist)?
  *Reductionist Prediction:* Yes. "Default" is shorthand for "evidence threshold is low due to high prior probability of reliability."
  *Anti-Reductionist Prediction:* No. "Default" marks a constitutive norm of assertion irreducible to evidence. Stripping "source" language leaves a distinct normative force.

  **IV. Confidence Note**

  We are highly confident in the formulations regarding silence and uncalibrated sources. The Reductionist formulation in the Verbal Dispute crux is the claim we are least willing to bet on; it risks conflating the *psychological ease* of belief with the *normative structure* of justification. If the normative structure of assertion is unique, the Reductionist reduction may fail even if the word "source" is dropped. We are also unsure if the Disagreements Table row on "Source Individuation" bears the full weight of the metaphysical split; it may collapse into the "Constitution of Warrant" row upon further analysis.
