answer: |-
  1. **The practice in brief**
  Legal systems occasionally permit "wrongful life" claims where existence itself is alleged as damage, yet reject reciprocal claims for "wrongful non-existence" where life was withheld. Simultaneously, welfare states subsidize procreation through IVF and child benefits but offer no compensation for voluntary childlessness. This creates an institutional asymmetry where bringing suffering into existence is actionable, but failing to bring happiness into existence is not.

  2. **The implicit theory**
  The pattern presupposes a person-affecting restriction where existence acts as a threshold for moral standing. Harm requires an existing subject to experience the setback, so a child born into suffering has standing to sue, while a non-existent child has no standing to claim missed pleasure. This mirrors a legalistic asymmetry consistent with negligence rules: the state protects actual beings from severe harm but owes no duty to potential beings to confer benefits. It sidesteps the non-identity problem by ruling that obligations attach only post-conception, treating non-existence as a neutral baseline rather than a loss, without necessarily committing to the antinatalist view that existence is always a harm.

  3. **Strict vs. optional commitments**
  Strictly required is that non-existent entities lack legal standing; without this, the asymmetry collapses. Optional is the claim that existence is intrinsically good; subsidies might reflect demographic pragmatism rather than a moral duty to create. Similarly, allowing wrongful life suits is contingent; the asymmetry holds even if those suits are banned, provided non-existence claims remain barred.

  4. **Underdetermination check**
  A symmetric view could license these outcomes via epistemic and administrative constraints rather than metaphysical asymmetry. If we cannot identify the specific claimant in "wrongful non-existence" cases, the claim fails procedurally, not ontologically. Thus, the practice is underdetermined; it fits the asymmetry but doesn't prove it.

  5. **Replacement scenario**
  Under a symmetric account, tort doctrine would recognize "loss of chance to exist" as compensable damage, allowing suits against parents who delay conception despite ideal conditions. Welfare design would either subsidize childlessness as a valid life choice equivalent to parenting or eliminate procreative subsidies entirely to avoid biasing the existence/non-existence balance.
