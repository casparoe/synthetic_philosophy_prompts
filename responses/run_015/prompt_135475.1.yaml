          *   *Vs. Epicurus:* Epicurus is hedonic/subjective. "Death is nothing *to us* because when we are here, death is not." It's about the *experience* of harm. Zhuangzi is ontological. It's not that death doesn't hurt; it's that the subject/object split creating the "hurt" is artificial. Epicurus keeps the self intact but removes the threat; Zhuangzi removes the self's rigidity.
