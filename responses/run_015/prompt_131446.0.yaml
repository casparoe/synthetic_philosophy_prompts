      *   *Nuance:* Is it a simple inference? Dennett argues that the *concept* of qualia includes "incorrigibility" or "direct apprehensibility." If introspection fails to distinguish, the concept fails. So it is an argument about conceptual incoherence based on epistemic failure.
      *   *Verdict:* The essay is fair here. Dennett *does* argue that the inability to distinguish undermines the existence of the distinct states *as qualia*.

