  6.  **Evaluate Claim 4: The Conclusion (Defenders of Qualia = Inner Theater):**
      *   *Essay Claim:* Defenders of qualia are necessarily committed to an inner theater.
      *   *Dennett's Text:* Dennett argues that the *traditional definition* of qualia (ineffable, intrinsic, private, directly apprehensible) logically entails a Cartesian Theater. If you define qualia differently (e.g., functional roles), Dennett might accept them (he calls this "qualia" in a deflated sense sometimes, but usually rejects the term).
