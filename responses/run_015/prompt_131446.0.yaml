      *   *Point 2 (Epistemic to Ontological):* This is the critical point. Dennett's move isn't "ignorance implies non-existence." It's "the definition of qualia includes privileged access; privileged access fails; therefore the definition fails." The essay needs to capture this conceptual link, not just an inference from ignorance.
