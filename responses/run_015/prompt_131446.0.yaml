      *   *Dennett's Text:* The "Cartesian Theater" is a broader metaphor Dennett develops (especially in *Consciousness Explained*, but present in spirit in "Quining Qualia"). The Chase-Sanborn case is one of four "intuition pumps" in "Quining Qualia" (along with the Inverted Spectrum, the Coffee Taster, etc.). The rejection of the Theater is the *framework* within which the cases make sense.
