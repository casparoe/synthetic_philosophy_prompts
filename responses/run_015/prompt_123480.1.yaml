answer: |-
  You have identified a genuine and well-recognized problem in moral and political philosophy, though it does not have a single canonical Latin name like *ad hominem* or *straw man*. The literature refers to this as **The Baseline Problem** (specifically within the theories of harm, coercion, and entitlement).

  However, the specific *rhetorical tactic* of shifting that baseline inconsistently to secure a desired conclusion is not usually given a distinct technical name beyond "inconsistency" or "special pleading."

  Since you asked for a term if nothing fits perfectly, I will coin **"Baseline Opportunism"** to describe the maneuver, while grounding it in the existing philosophical literature on **The Baseline Problem**.

  ### 1. The Established Literature: "The Baseline Problem"
  Your intuition is correct: the state of affairs against which "harm" or "worse off" is measured is not a fact of nature; it is a normative choice. This is extensively discussed in three key areas:

  *   **The Theory of Harm (Joel Feinberg):** In *Harm to Others*, Feinberg argues that to claim someone is "harmed," you must compare their current state to a **counterfactual baseline**. The dispute is always about which baseline is morally relevant (e.g., "How would they be if the act hadn't occurred?" vs. "How would they be if they had what they were owed?").
  *   **Libertarian Entitlement (Robert Nozick):** Your opponent's partner is arguing from Nozick's *Anarchy, State, and Utopia*. Nozick insists the only valid baseline is **historical entitlement** (what you acquired justly). By this logic, taxes are coercion (taking what is yours), but lack of charity is not harm (you were never owed the money).
  *   **The Myth of Ownership (Liam Murphy & Thomas Nagel):** This is the direct counter to your partner. They argue that the "pre-tax" baseline is an illusion. Property rights are defined *by* the legal system that imposes taxes. Therefore, comparing a taxpayer to their "pre-tax" income is arbitrary; the only coherent baseline is the post-tax, post-service social package.

  **Why "Positive vs. Negative Rights" is not it:**
  You are right to reject this. Positive/Negative rights classify the *duty* (to act vs. to refrain). Your observation is about the **counterfactual comparison** used to determine if a right was violated in the first place. One can accept negative rights but still dispute the baseline (e.g., "Did the state *act* to harm him by taxing, or did it merely *refrain* from giving?"). The baseline determines the classification, not the other way around.

  ### 2. The Coined Term: "Baseline Opportunism"
  Since there is no specific fallacy name for *shifting* the baseline mid-argument, I propose the term **Baseline Opportunism**.

  **Definition:**
  *Baseline Opportunism* occurs when an arguer selects the normative baseline (the counterfactual state used to measure harm, benefit, or coercion) not based on a consistent moral principle, but ad hoc, shifting the baseline in each instance to ensure the evaluation favors their desired conclusion.

  **Boundary Cases:**

  *   **Case Where It Applies (Your Scenario):**
      *   *Argument:* "The poor woman isn't harmed by lack of care (Baseline: State of Nature/No Entitlement), BUT the patient on the waiting list is harmed (Baseline: Entitlement to Immediate Care), AND the taxpayer is harmed by taxes (Baseline: Pre-Tax Holdings)."
      *   *Verdict:* This is **Baseline Opportunism**. The arguer uses the "State of Nature" baseline to defend markets, the "Entitlement" baseline to attack public waiting lists, and the "Pre-Tax" baseline to attack public funding. There is no consistent principle linking these three baselines other than the conclusion they support.

  *   **Case Where It Does Not Apply (Consistent Libertarian):**
      *   *Argument:* "The poor woman is not harmed (Baseline: Entitlement), the waiting list patient is not harmed (Baseline: Entitlement—she has no right to faster care), AND the taxpayer is harmed (Baseline: Entitlement—taxes take property)."
      *   *Verdict:* This is **Not Baseline Opportunism**. It is a consistent application of **Entitlement Theory** (Nozick). You may disagree with the principle, but the baseline is stable.

  *   **Case Where It Does Not Apply (Consistent Liberal):**
      *   *Argument:* "The poor woman is harmed (Baseline: Social Minimum), the waiting list patient is harmed (Baseline: Reasonable Access), AND the taxpayer is not harmed (Baseline: Net Social Benefit/Post-Service)."
      *   *Verdict:* This is **Not Baseline Opportunism**. It is a consistent application of a **Social Contract** or **Capability Approach**.

  ### 3. Evaluating Your Partner's Defense
  Your partner says: *"A tax removes what someone already has, whereas unaffordable care was never his, so the two cases genuinely call for different baselines."*

  **Does this survive?**
  Only if you accept **Pre-Political Property Rights**.
  Your partner is making a substantive moral claim, not a logical one. They are asserting that property rights exist *prior to* the state's tax system.
  *   **If they are right (Nozick):** Then the baseline is fixed at "pre-tax holdings," and taxes are indeed a removal of property, while healthcare is a gift.
  *   **If they are wrong (Murphy/Nagel):** Then property rights are *conventions* created by the state. You cannot have "pre-tax" income because the legal system that defines your ownership of that income is the same system that levies the tax. In this view, the "pre-tax" baseline is arbitrary, and the correct baseline is the total package of rights and services provided by the state.

  **How to use this in debate:**
  Do not accuse them of a logical fallacy (like contradiction). Accuse them of **Baseline Opportunism** unless they can commit to a single baseline across all three cases.
  *   *Challenge:* "If the baseline for harm is 'entitlement,' then the uninsured woman is harmed because she is entitled to life. If the baseline is 'pre-tax holdings,' then the taxpayer is not harmed because he retains his net social package. You cannot use 'entitlement' to defend the waiting list patient and 'state of nature' to defend the uninsured woman. Pick one baseline and apply it consistently."

  ### Summary
  *   **Established Concept:** **The Baseline Problem** (in theories of Harm and Coercion).
  *   **Specific Tactic Name:** None canonical; I coin **Baseline Opportunism**.
  *   **Partner's Defense:** Relies on **Entitlement Theory**. It is philosophically coherent but contestable (see Murphy & Nagel). It fails if property is viewed as conventional rather than natural.
  *   **Debate Strategy:** Force them to commit to one baseline (State of Nature, Entitlement, or Pre-Political Holdings) and apply it to *all* three instances (Uninsured, Waiting List, Taxpayer). They will likely have to concede harm in one area they wanted to deny.
