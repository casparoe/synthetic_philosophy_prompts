answer: |-
  Here is a defended agenda for the open questions surrounding Inside/Outside views and epistemic modesty, ranked by their leverage on real-world decision-making (like your sprint planning).

  My core thesis is this: **The mathematical combination of views is a downstream problem. The upstream bottleneck is Reference Class Construction.**

  Most teams fail at estimation not because they can't average numbers, but because they argue past each other using incompatible analogies. Epistemic modesty is the tool that fixes the analogy selection, not just the final number.

  Here is the ranking of open questions, from "solve this first" to "ignore this."

  ---

  ### 1. The Reference Class Construction Problem (Upstream / High Tractability)
  **The Question:** *When historical data is sparse or non-existent (new tech stack), how do we construct a "proxy" reference class without falling into the trap of choosing one that confirms our biases?*

  **Why this is #1:**
  This is the upstream dependency for everything else. The standard advice is "take the outside view." But in your edge case (brand-new tech), a literal outside view doesn't exist. If you can't solve this, you default to the Inside View (gut feeling), which is where optimism bias lives.
  *   **Importance:** Critical. If your reference class is wrong, your outside view is garbage.
  *   **Tractability:** High. This doesn't require new math; it requires structured debate.
  *   **Dependency:** Solving this makes the aggregation problem (Question #2) solvable.
  *   **Epistemic Modesty's Role:** Modesty here isn't saying "I don't know." It's saying, "My analogy is weak." It forces the team to explicitly state *why* a past project is analogous to the current one and penalize the estimate based on the "distance" of that analogy.
  *   **Evidence to move it:** If your team starts tracking *which* analogies were used (e.g., "We treated this like the Payment Integration project") and reviews whether that analogy held true post-sprint, you validate your construction method.

  **Practical Implication:**
  Don't look for "React Migration Projects." Look for "Projects where the team had to learn a new paradigm mid-sprint." Broaden the class until you have data, then apply a "novelty penalty" based on how different the new tech is.

  ### 2. The Aggregation of Divergent Reference Classes (Midstream / Medium Tractability)
  **The Question:** *When Team Member A uses Reference Class X (optimistic) and Team Member B uses Reference Class Y (pessimistic), how do we aggregate their views without just averaging the numbers?*

  **Why this is #2:**
  Once you accept that you need to construct reference classes (Question #1), you will realize everyone constructs them differently. A senior dev might see a "routine CRUD task" (Class: Past CRUD tasks). A junior dev might see a "complex dependency chain" (Class: Integration nightmares).
  *   **Importance:** High. This determines team alignment and buy-in.
  *   **Tractability:** Medium. Requires process changes (e.g., planning poker with justification), not just reasoning.
  *   **Dependency:** Depends on solving #1. You can't aggregate reference classes if people aren't articulating them.
  *   **Epistemic Modesty's Role:** Modesty here means weighting views based on *calibration track records*, not seniority. If the junior dev's past estimates were more accurate than the senior dev's, their reference class gets more weight.
  *   **Evidence to move it:** If the variance in estimates drops *after* discussion (rather than just converging on the loudest voice), you have a working aggregation mechanism.

  **Practical Implication:**
  Don't aggregate *estimates*; aggregate *arguments for the reference class*. Ask: "Which past sprint does this feel like?" If half the team says "Sprint 4" and half says "Sprint 12," you don't average the days. You investigate why the split exists. Usually, the split reveals hidden complexity.

  ### 3. Operationalizing Modesty as Variance, Not Humility (Downstream / High Tractability)
  **The Question:** *How do we translate "I might be wrong" into a numerical buffer without just adding arbitrary padding?*

  **Why this is #3:**
  This is the output layer. Many devs think epistemic modesty means "add 20% to everything." That's lazy. Modesty should expand the *confidence interval*, not just the point estimate.
  *   **Importance:** Medium-High. It manages stakeholder expectations.
  *   **Tractability:** High. Easy to implement in ticket tracking.
  *   **Dependency:** Depends on #1 and #2. You need a solid base estimate before you can calculate variance.
  *   **Epistemic Modesty's Role:** Modesty is the width of the distribution. High certainty = narrow range. New tech stack = wide range.
  *   **Evidence to move it:** Track "percentage of tasks completed within the estimated range" rather than "percentage of tasks completed on the exact day."

  **Practical Implication:**
  Stop estimating "3 days." Estimate "3 days, 50% confidence; 5 days, 85% confidence." If the tech is new, the gap between 50% and 85% should be massive. That gap *is* the epistemic modesty.

  ---

  ### The Dead Ends (Deprioritize These)

  **1. Formal Bayesian Updating for Sprints**
  *   **Why ignore it:** Trying to assign prior probabilities and likelihood ratios to sprint tasks is heavy formal machinery with diminishing returns. The cognitive overhead outweighs the precision gain.
  *   **Verdict:** Dead end for software teams. Use heuristics, not calculus.

  **2. Semantic Debates on "True" Knowledge**
  *   **Why ignore it:** Arguing about whether you *really* know the API spec is philosophy, not engineering.
  *   **Verdict:** Dead end. Focus on *predictive accuracy*, not truth conditions.

  **3. Eliminating the Inside View**
  *   **Why ignore it:** Some advice suggests ignoring the plan entirely and just using historical averages. This is impossible for new work. You need the Inside View to identify risks; you need the Outside View to constrain optimism.
  *   **Verdict:** Dead end. You need both.

  ---

  ### Synthesis: How to handle your "New Tech Stack" scenario

  You asked specifically about the edge case where there is **no outside view**. Here is how you apply the agenda above:

  1.  **Acknowledge the Void (Modesty):** Admit explicitly that the "Outside View" is broken. Do not pretend historical velocity applies.
  2.  **Construct a Proxy (Reference Class):** Do not look for *technical* analogs; look for *uncertainty* analogs.
      *   *Bad Class:* "We built a Python service before."
      *   *Good Class:* "We built a service where we didn't understand the database constraints until week 2."
      *   *Reasoning:* The tech doesn't matter; the *surprise profile* matters.
  3.  **Aggregate the Uncertainty (Team):** Ask the team: "On a scale of 1-10, how similar is the *uncertainty profile* of this task to our worst past sprint?"
      *   If everyone says 8+, you don't estimate time. You estimate a **timebox for discovery**.
      *   *Shift:* "We estimate 3 days to figure out how long this will take."
  4.  **Output Variance:** Present the estimate as a range that reflects the lack of data. "This is a 5-to-10-day task because our reference class is weak."

  ### Summary of the Defended Agenda

  If you want to fix your sprint estimates, stop trying to get better at guessing time (Inside View) and stop trying to find perfect historical data (Outside View).

  **Focus entirely on Question #1: Reference Class Construction.**
  Get your team to agree on *what kind of problem* they are solving before they guess *how long* it will take. Epistemic modesty is the discipline of rejecting an analogy when the fit isn't tight, even if it gives you a convenient number.

  If you solve that, the aggregation (Question #2) becomes a conversation about which analogy fits best, and the variance (Question #3) becomes a reflection of how much the team disagreed on the analogy. That is where the actual signal lives.
