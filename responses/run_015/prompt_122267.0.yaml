  Here is the evaluation of your three candidates, ranked by philosophical priority and project viability for a two-year postdoc.

  ### 1. The Retention Regress
  **Upstream Status:** This is the most foundational question. The "retention" clause is the standard repair strategy for the Simple Conditional Analysis (SCA) against standard finks. If this repair fails because "retention" itself requires a dispositional analysis (which can then be finked), the reductive project collapses into circularity or regress. You cannot meaningfully solve reverse-finks or mask distinctions if the primary mechanism for saving the analysis is incoherent. It determines whether the conditional analysis is viable at all.
  **Tractability:** High. For a good postdoc, this does not require building a new metaphysical system. It requires precise conceptual analysis of the term "retention" within the specific modal context. They can isolate whether "retaining a basis" must be analyzed as a disposition or if it can be treated as a static state. This is narrow enough for two years but deep enough for high-impact papers.
  **Success Conditions:** A decisive argument that the regress is vicious (killing reductive SCA) or a demonstration that retention can be analyzed non-dispositionally (saving SCA). Either outcome moves the field significantly. Even a nuanced map of *when* the regress bites is publishable.

  ### 2. The Reverse-Fink Problem
  **Upstream Status:** Secondary. This problem challenges the sufficiency of the conditional (i.e., if the conditional is true, is the disposition present?). However, most solutions to reverse-finks presuppose that the standard fink problem has been solved (usually via an intrinsic basis clause). If the Retention Regress shows that the "intrinsic basis + retention" fix is incoherent, work on reverse-finks becomes moot. It is downstream because it tweaks the content of the analysis rather than testing the logical form of the repair.
  **Tractability:** Moderate. Solving this often requires a positive theory of what counts as an "intrinsic basis" or a "stable property." This can drift into broader metaphysics of intrinsicality, which might expand beyond the two-year scope. A "good but not genius" postdoc might struggle to define intrinsicality without getting bogged down, though they could propose a restricted solution limited to disposition cases.
  **Success Conditions:** A refined analysis that excludes reverse-finks without excluding genuine dispositions. The risk is producing an ad-hoc restriction that solves the case but lacks theoretical motivation.

  ### 3. The Floating-Mask Case
  **Upstream Status:** Potentially high, but speculative. If successful, this collapses the taxonomy of counterexamples, suggesting that finks and masks are not distinct problems but symptoms of a single flaw. This would force a unified solution. However, because it is a novel case, its dialectical strength is unproven.
  **Tractability:** Low/Risky. Spending two years on a novel intuition pump is dangerous. If the literature rejects the case as contrived or misdescribed, the postdoc's work loses its footing. It requires defending the case itself before solving the metaphysical problem it poses. For a early-career researcher, this is a high-variance gamble.
  **Success Conditions:** Validating the case against standard objections and showing existing solutions fail. If the case holds, it's a major contribution; if it fails, the project stalls.

  ### Is There a Fourth Option?
  I do not recommend adding a fourth. The three options cover the logical space: Option 1 tests the *coherence of the fix*, Option 2 tests the *sufficiency of the analysis*, and Option 3 tests the *taxonomy of the problems*. A fourth question would likely be a variant of these. The Retention Regress is the bottleneck; clearing it clarifies whether the other two are worth pursuing within the conditional framework.

  ### Recommendation
  Hire for **The Retention Regress**. It is the gatekeeper question. If the postdoc shows the regress is unavoidable, you know the conditional analysis is dead as a reductive project, and you can pivot to primitivism or powers ontology. If they show it is avoidable, you have a secure foundation to tackle reverse-finks next. It offers the clearest path to definitive results within two years without the risk of novel case-study rejection.

