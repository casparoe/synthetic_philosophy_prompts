      *   *But:* She ruled against Blindsight (Case 3) where performance existed without report. Here we have Report without performance.
      *   *If she accepts Iconic Memory:* She rules For.
      *   *If she accepts Access Consciousness limits:* She rules Against.
      *   *Her record:* She ruled against Blindsight (no experience without report/access). She ruled against Priming (no experience without criterion stability). She ruled for Effort (global feeling).
