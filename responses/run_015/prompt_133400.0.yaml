      *   **Constraints:** 8-10 questions. No generic/biographical questions. Must press internal structure.
      *   **Required Content:**
          *   Question on high $h^2$ $\neq$ immutability/determinism.
          *   Question on "intervention-variance mismatch" vs. standard within/between group critique.
          *   Question on Broad-sense heritability ($H^2$) vs. Narrow-sense ($h^2$).
          *   Question on positive explanatory work (if predictive power is stripped).
      *   **Format:** Question -> Sketch of Dr. K's Answer -> Sharp Follow-up.
      *   **Tone:** Philosophical rigor, anticipating standard literature moves (SES interaction, within/between distinction), pushing past restatements.
      *   **Disclaimer:** Must distinguish settled science from contested philosophy. Do not present Dr. K's view as consensus.

  2.  **Deconstruct Dr. K's Position:**
      *   *Premise 1:* $h^2 = V_G / V_P$. $V_P = V_G + V_E + V_{GxE}$.
      *   *Premise 2:* $V_E$ is specific to the population and time. Change the environment range, change $V_E$, change $h^2$.
      *   *Premise 3 (Intervention-Variance Mismatch):* Interventions usually change the *mean* of the environment or introduce a *new* variance component not present in the original $V_E$. Therefore, original $h^2$ doesn't predict the response.
      *   *Conclusion:* $h^2$ is descriptive of current variance, not predictive of future manipulation.

  3.  **Drafting Questions (Iterative Process):**

      *   *Q1: High Heritability vs. Immutability.* (Required)
