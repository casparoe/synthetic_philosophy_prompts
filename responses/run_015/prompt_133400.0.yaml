      *   *Q4: Positive Explanatory Work.* (Required)
          *   *Idea:* If it can't predict interventions or individuals, what is it *for*?
          *   *Dr. K's Answer:* It identifies the *source* of current differences. It tells us where variation lies *now*.
          *   *Follow-up:* Isn't "current variation" a transient snapshot? If the causal structure is GxE, does partitioning variance actually explain the *mechanism* or just describe the *distribution*?

      *   *Q5: GxE Interaction.*
          *   *Idea:* If $V_{GxE}$ is large, $h^2$ is unstable.
          *   *Dr. K's Answer:* Exactly, that proves the environmental dependence.
          *   *Follow-up:* If GxE is ubiquitous (as modern genomics suggests), does $h^2$ collapse into a measure of experimental error rather than a biological parameter?

      *   *Q6: SES and Cognitive Traits.* (Anticipating literature)
