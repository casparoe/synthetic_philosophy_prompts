answer: |-
  ### I. Mapping the Protocol: Agents, Options, and Trajectories

  To analyze the Montreal Protocol through strong longtermism, we must first distinguish between the *welfare effects* on the generation of 1987 and the *trajectory effects* on the millennia to follow.

  **The Agents and Option Sets**
  *   **States (US, UK, USSR, etc.):** Their option set ranged from unilateral bans to voluntary guidelines to inaction. In 1987, the critical constraint was the Cold War context; cooperation with the USSR was politically costly but newly feasible.
  *   **The Chemical Industry (e.g., DuPont):** Initially opposed regulation. Their option set shifted when they realized patents on CFC substitutes (HCFCs/HFCs) were viable. They could fight regulation or pivot to capture the market for alternatives.
  *   **Consumers:** Had negligible agency in the negotiation; their option set was limited to absorbing price shocks or changing behaviors (e.g., pump sprays vs. aerosols).
  *   **Posterity:** The primary beneficiaries, but strictly non-agents. They had no option set; their welfare was entirely dependent on the actions of the living.

  **Trajectory vs. Welfare**
  *   **Welfare (1987–2020):** The Protocol imposed transition costs on industry and consumers. It delivered near-term health benefits (reduced skin cancer, cataracts) to people alive during the transition.
  *   **Trajectory (2020–∞):** This is the longtermist locus. Without the Protocol, models suggest the ozone layer would have collapsed globally by the mid-21st century. UV-B radiation would have increased drastically, damaging terrestrial ecosystems, reducing agricultural yields, and potentially rendering large swathes of the planet uninhabitable for complex life. Furthermore, because CFCs are potent greenhouse gases, the phase-out inadvertently altered the climate trajectory.
  *   **The Change:** The Protocol did not merely shift resources from the rich to the poor (welfare); it prevented a state change in the Earth system that would have permanently lowered the ceiling on future population and well-being.

  **The Longtermist Adviser in 1987**
  A strong longtermist adviser, accepting that the expected value of the future is astronomical, faces a portfolio allocation problem. Political capital is finite.
  *   **Option A (Ozone):** High probability of success, clear science, moderate trajectory impact (prevents catastrophe, not extinction).
  *   **Option B (Nuclear Risk):** Lower probability of success (Cold War gridlock), existential stakes (human extinction).
  *   **Option C (Hold):** Save capital for unknown future hinges.

  **Advice:** A sophisticated longtermist would likely advise **spending the capital on Montreal**, but not because ozone is more important than nuclear risk in isolation. The advice rests on *institutional path dependence*. Successfully negotiating a global environmental treaty creates a precedent, verification mechanisms, and trust that lower the transaction costs for future existential-risk governance (including climate and biosecurity). Passing Montreal builds the "governance muscle" required to handle x-risks later. To hold the capital is to let it atrophy; to spend it on nuclear talks in 1987 was likely to fail. Thus, Montreal is instrumentally rational for a longtermist, even if the direct stakes are non-existential.

  ---

  ### II. Running the Case Back Against the Theory

  We now test strong longtermism against the three awkward features you identified.

  #### (i) Motivation and Self-Effacement
  *The Objection:* The treaty passed because of near-term health fears and industry profit, not concern for the infinite future. If longtermism requires hiding its true motives to succeed, is it self-effacing and thus elitist?

  *Analysis:* Strong longtermism is a criterion of rightness (what makes an act good), not necessarily a decision procedure (what agents should consciously think). Henry Sidgwick's "esoteric morality" argues that if publicizing a moral truth reduces its utility, it should be kept by an enlightened few.
  *   **Absorption:** Longtermism absorbs this easily. If appealing to "skin cancer" mobilizes coalitions that save the future, while appealing to "astronomical value" alienates them, the longtermist *ought* to appeal to skin cancer.
  *   **The Bite:** The damage is not to the *truth* of the view, but to its *public viability*. It implies longtermism cannot be a mass movement. It must operate as a "stealth" ideology, where public actors use proximate reasons while longtermist funders steer resources behind the scenes. This creates a democratic deficit: the people are asked to sacrifice for reasons they do not hold, to benefit entities (posterity) that cannot vote, guided by elites who hold the "real" reasons. This is politically fragile.

  #### (ii) Intention vs. By-Product (The Climate Co-benefit)
  *The Objection:* The largest long-term benefit (climate mitigation) was a side effect. Does longtermism credit accidental good?

  *Analysis:* Consequentialism, the ethical backbone of longtermism, evaluates actions by outcomes, not intentions.
  *   **Absorption:** Longtermism fully credits the climate co-benefits. In fact, it highlights them as evidence of *leverage*. It suggests that searching for "low-regret" interventions with multiple trajectory benefits is a superior strategy to targeting single risks.
  *   **The Bite:** There is minimal theoretical bite here. However, it exposes an epistemic vulnerability. If the best longtermist actions are often those with *unintended* positive side effects, how can a longtermist plan? Relying on serendipity is not a strategy. The theory must explain how to *systematically* find these multi-benefit levers rather than hoping for them. Montreal was lucky; longtermism needs to be robust to luck.

  #### (iii) Existential Risk vs. Trajectory Quality
  *The Objection:* Ozone depletion was not an existential risk. It would have made the future worse, not ended it. Yet this is the clearest longtermist success. Does this contradict the "x-risk dominance" thesis?

  *Analysis:* This is the feature that **actually bites**.
  Strong longtermism is often popularized (e.g., by Bostrom, Ord) with the claim that reducing existential risk is the *overwhelming* priority because extinction wipes out all future value. Under a standard expected value calculation, a 0.1% reduction in extinction risk usually outweighs a 100% improvement in quality of life for a non-extinct future, provided the future is long enough.
  *   **The Tension:** If longtermism implies x-risk reduction is the *only* thing that matters, Montreal was a distraction. Political capital spent on ozone was capital not spent on nuclear de-escalation or AI safety research.
  *   **The Nuance:** However, your definition of strong longtermism specifies "improving the trajectory," which includes quality, not just existence. If the ozone collapse would have caused a permanent bottleneck (reducing the probability of the future reaching its astronomical potential), it is a trajectory change.
  *   **The Bite:** The Montreal Protocol vindicates **Trajectory Longtermism** but embarrasses **X-Risk Longtermism**. It shows that preventing "civilization collapse" (a severe trajectory worsening) is politically tractable and immensely valuable, whereas preventing "extinction" is often gridlocked. If the theory prioritizes x-risk to the exclusion of severe trajectory changes, it may be directing resources toward intractable problems while ignoring tractable ones that secure the *conditions* for x-risk mitigation (e.g., maintaining a stable, technologically capable civilization).

  ---

  ### III. The Honest Verdict

  **Which critique bites?**
  Feature **(iii)** is genuinely damaging to the dominant *heuristic* of strong longtermism, though not to its core *definition*.
  Features (i) and (ii) are absorbed by standard consequentialist machinery (criterion vs. procedure; outcomes vs. intentions).
  Feature (iii) forces a reckoning with the **substitutability of political capital**. If longtermism claims x-risk is $10^{10}$ times more important than quality-of-life trajectory changes, it struggles to justify the immense effort spent on Montreal unless one argues (as I did above) that Montreal was *instrumental* to future x-risk governance. If it was merely a good deed that happened to help the future, longtermism must admit it was a suboptimal use of resources compared to a direct x-risk intervention.

  **Vindicate, Embarrass, or Reveal Limits?**
  The Montreal Protocol **reveals that the view was never really about cases like this one**, and that is a limitation.

  1.  **Vindication of Tractability:** It proves that humanity *can* coordinate on long-term threats when the science is clear, the substitutes are profitable, and the harms are tangible. This gives longtermists hope that future coordination (on AI or bio) is possible.
  2.  **Embarrassment of Motivation:** It shows that longtermist *reasoning* was unnecessary for the success. The work was done by anthropocentric self-interest. This suggests that "longtermism" as a mobilizing ideology might be redundant in the very cases where we succeed.
  3.  **The Silence on Priority:** The theory is silent on how to trade off *certain trajectory improvements* (Montreal) against *uncertain x-risk reductions* (Nuclear/AI). The Montreal success suggests that securing the "baseline" of a habitable planet is a prerequisite for caring about the far future. If longtermism ignores "non-existential catastrophes" that permanently curtail potential, it risks losing the ground beneath its feet.

  **Final Judgment:**
  The Montreal Protocol is a **longtermist success story that was not driven by longtermist values.** It validates the *importance* of trajectory changes but challenges the *priority ranking* often associated with the view. It suggests that strong longtermism, to be actionable, must incorporate a theory of **institutional resilience** and **non-existential catastrophe**, rather than focusing myopically on extinction. If it cannot account for why Montreal was a better use of 1987's political capital than a failed nuclear treaty, it remains a theoretical framework detached from the mechanics of historical change.
