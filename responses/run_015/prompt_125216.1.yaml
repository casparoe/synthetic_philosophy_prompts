  7.  **Final Polish:** Ensure tone is appropriate for a doctoral advisor/peer (rigorous, strategic, candid about risks). (Self-correction: Make sure to explicitly address the "Public/Private" issue in Problem 3 rather than just dismissing it, explaining *why* it's a trap for a 3-year project).

  *(Self-Correction during drafting)*: I initially thought about telling them to drop Problem 3 entirely. But Problem 3 is about gender/religion/family. That's crucial for citizenship. I should advise them to *narrow* it. Instead of "Reconstruct Public/Private," make it "The Limits of Institutional Neutrality in Intimate Spheres." But to keep the agenda tight, I will argue that Problem 1 *requires* solving a version of Problem 3. So I will rank 1, 2, 4, but note that 1 *consumes* 3. Actually, the prompt asks to rank the *items*. I will recommend replacing 3 with a more specific question to ensure tractability. Let's go with replacing 3 with **"The Problem of Institutional Purpose."** It captures the normative weight of 3 without the historical baggage of "Public/Private."

