          *   *Status:* Foundational. If you can't define the domains, you can't analyze the rules within them.
          *   *Risk:* Might turn into a sociological/empirical question rather than philosophical.
          *   *Value:* High. Solves the "where do we draw the line?" problem.

      *   *Problem 2 (Instrumental Justification vs. Majoritarianism):* Can functional arguments (e.g., "we need a common language") avoid just being majority rule in disguise?
          *   *Status:* Justificatory. Once domains are set, why do we demand assimilation there?
          *   *Risk:* Very hard to avoid circularity without begging the question against multiculturalists.
          *   *Value:* High. Addresses the legitimacy of coercion.

      *   *Problem 3 (Public/Private Distinction):* Can we reconstruct public/private without relying on liberal-republican assumptions (especially regarding gender/religion)?
          *   *Status:* Meta-theoretical/Structural. This underpins Problems 1 and 2.
          *   *Risk:* This is a "black hole" topic. Feminist and post-colonial critiques have hammered this for decades. Might be too intractable for a 3-year dissertation to solve *and* apply to DSA.
          *   *Value:* Crucial, but potentially too broad.

      *   *Problem 4 (Welfare-State/Distributive Implications):* What happens when cultural claims hit resource allocation (healthcare, subsidies)?
          *   *Status:* Applied/Consequential.
          *   *Risk:* Depends on solving 1, 2, and 3 first. If you don't know *why* a domain is assimilationist, you can't know if distributive claims are valid.
          *   *Value:* High policy impact, but low conceptual priority.

  3.  **Determine the Ordering (The "Defense"):**

      *   *Criterion 1: Dependency.* You can't justify boundaries (2) or distribute resources (4) if you can't define the domains (1). You can't define domains (1) without a working model of public/private (3).
