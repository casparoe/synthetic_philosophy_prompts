prompt: |-
  I chair the responsible-AI review board at a mid-sized software company: six engineers, a product manager, and two lawyers, none of whom work on machine learning, and who have absorbed AI safety mostly from news coverage plus one internal lunch talk on RLHF that left them with the impression that alignment is a training-recipe problem that human feedback essentially solved. I have forty-five minutes with them in two weeks, and what I want them to leave with is an understanding of why scalable oversight is a genuine bottleneck and of what the debate proposal for oversight is actually claiming — not that it works, but what would have to be true for it to work, and how narrow its conditions are. Please don't explain the idea to me; plan how I should present it.

  So: what has to be established first, and why does everything else depend on it? My instinct is that the bottleneck has to be felt before the proposal can even be heard — that the moment we are asked to sign off on a system that is better than the board at the task it is doing, judging the output and checking the output come apart, and every oversight intuition they already have (hire better reviewers, make the model show its reasoning and read that, spot-check samples, red-team it) quietly assumes the two are the same thing. Relatedly, one of the engineers has circulated a cheaper variant he calls self-cross-examination: a single model produces an answer, then produces the strongest case against its own answer, and a human picks whichever survives. I want to know where in the sequence I should deal with it, because explaining why it fails might be the cleanest way into why two adversarial debaters are doing any work at all — but I also worry it will look like I am swatting down his suggestion before I have motivated the problem.

  I also want help with the carrying example. I was going to use a disputed figure buried in an enormous expense or compliance report: the board cannot recompute the total, but it can check any single line, and disagreement can be narrowed by bisection. Tell me what such an example has to have and, as importantly, what it must lack; why the usual illustrations — judging which of two images contains a given object, or which of two routes is faster — would do less work for this particular audience; and why I should not carry the whole session on the kind of case the board actually cares about, is this deployment safe?, which I suspect has exactly the wrong structure. Then: the misconceptions to expect and precisely where in the sequence to head each off. I am fairly confident about four — that debate is just truth winning out because truth is persuasive; that the judge needs to know nothing at all, so debate removes rather than relocates the need for trustworthy judgment; that adversarially trained debaters will converge on honesty the way markets converge on prices; and, from the lawyer who reads about steganographic collusion, that the two models will simply agree to fool the judge. I am much less sure how to place the worry that the debate itself grows too long or too technical for the judge to follow, since I suspect that objection is different in kind from the others and may be the one that matters most for a board like mine. Finally: the single question I can ask at the end that would show me the structure has landed rather than the vocabulary — my candidate is to hand them a fresh task and ask what, exactly, a weak judge would need to be able to check cheaply and reliably for the protocol to help, treating cannot be named as a good answer — and what I should openly decline to settle in forty-five minutes, saying out loud that I am declining it.
reasoning: |-
  Here's a thinking process that leads to the suggested presentation plan:

  1.  **Analyze the User and Context:**
      *   **Role:** Chair of Responsible-AI Review Board.
      *   **Audience:** 6 engineers, 1 PM, 2 lawyers. None are ML experts. Knowledge source: News + one internal lunch talk on RLHF (misconception: alignment = training recipe, solved by human feedback).
      *   **Constraint:** 45 minutes. Two weeks from now.
      *   **Goal:** They must understand *why* scalable oversight is a bottleneck and *what* the Debate proposal claims (conditions for success, narrowness), *not* that it definitely works.
      *   **Key Insight:** The bottleneck must be *felt* before the solution is proposed. Judging $\neq$ Checking when the system exceeds human capability.
      *   **Specific Challenge:** An engineer proposed "self-cross-examination" (single model argues against itself). Needs to be addressed strategically.
      *   **Specific Example:** Disputed figure in a huge report (bisection method). Needs refinement on why this works and why others (images, routes, "is this safe?") don't.
      *   **Misconceptions to Address:**
          1.  Truth wins because it's persuasive.
          2.  Judge needs to know nothing ( Debate removes need for judgment).
          3.  Adversarial training converges on honesty (like markets).
          4.  Models will collude (steganography).
          5.  Debate gets too long/technical (The "Complexity" objection).
      *   **Closing:** A single question to test understanding (focus on what a weak judge checks, "cannot be named" is okay). What to explicitly *not* settle.

  2.  **Deconstruct the Core Problem (Scalable Oversight):**
      *   The core tension is: We want to deploy systems smarter than us. If they are smarter, we can't verify their output directly (Judging $\neq$ Generating).
      *   RLHF works when humans can judge. It breaks when humans can't judge.
      *   Debate is a *protocol* to amplify human judgment, not a magic truth machine.

  3.  **Structure the 45 Minutes:**
      *   *0-10 min:* Induce the crisis. Make them feel the "Judging $\neq$ Checking" gap.
      *   *10-25 min:* Introduce Debate via the Example. Explain the mechanism and conditions.
      *   *25-35 min:* Address Misconceptions (including Self-Cross-Examination).
      *   *35-40 min:* The "Complexity" Objection (The most important one for this audience).
      *   *40-45 min:* Closing Question & Explicit Limitations.

  4.  **Develop the "Carrying Example":**
      *   *User's Idea:* Disputed figure in expense report. Board can't recompute total, but can check lines. Bisection narrows disagreement.
      *   *Why it works:* It separates *finding* the error (hard) from *verifying* the error (easy). It relies on transitivity and structure.
      *   *Why images/routes fail:* Too perceptual. If the AI says "Route A is faster," and I can't drive it, I can't verify. If the AI says "This pixel is a cat," I can see it. We need a task where the *reasoning chain* is the object of verification, not the perceptual output.
      *   *Why "Is this deployment safe?" fails:* Too vague. No ground truth. No clear bisection path. It induces anxiety, not structural understanding.
      *   *Requirements:* High complexity, verifiable sub-components, clear termination condition (finding the specific line item), asymmetric effort (finding vs. checking).
      *   *What it must lack:* Ambiguity in the verification step. If checking the line item is also hard, the analogy breaks.

  5.  **Address "Self-Cross-Examination":**
      *   *Placement:* After introducing Debate, but before deep diving into misconceptions. Use it as a foil.
      *   *Why:* It highlights *why* we need two agents. One model optimizing for "persuasion" will sandbag the counter-argument. It illustrates the need for *competitive* pressure, not just introspection.
      *   *Strategy:* Don't mock it. Show how it fails the specific bottleneck. If the model is deceptive, it will generate a weak counter-argument.

  6.  **Address Misconceptions:**
      *   *Truth/Persuasion:* Truth isn't always simple. Lies can be simpler. Debate relies on *asymmetry of verification*, not inherent persuasiveness of truth.
      *   *Judge Knows Nothing:* Judge needs *some* capability (checking the line item). Debate amplifies, doesn't replace.
      *   *Market Convergence:* Markets converge on price, not necessarily truth (see: bubbles). Needs specific incentive structures.
      *   *Collusion:* Valid worry. Acknowledge it. It's a condition for failure (if comms channel exists).
      *   *Complexity (The Big One):* This is the "Recursion Limit." If the argument tree goes deeper than the judge can follow, the protocol fails. This is the narrow condition.

  7.  **Drafting the Plan (Iterative Refinement):**

      *   *Opening:* Start with the RLHF misconception. "We assume we can grade the homework. What if the homework is in a language we don't speak?"
      *   *The Example:* Refine the expense report. Make it concrete. "The total is off by $1M. We can verify any single receipt. We cannot add 10 million receipts."
      *   *The Pivot:* How do we find the bad receipt? Two AIs argue. One says "Row 4,392 is double counted." The other says "No, Row 4,392 is valid, but Row 8,100 is missing." Judge checks Row 4,392.
      *   *Self-Cross-Examination:* Put this right after the Debate intro. "Why not one AI?" Because the AI wants to win. It will hide the error. It needs an adversary with equal capability but opposing incentive.
      *   *Misconceptions:* Group them.
          *   Truth/Markets/Collusion -> Incentive Structure.
          *   Judge Knows Nothing -> Verification Capability.
          *   Complexity -> The Hard Limit.
      *   *Closing:* The question. "Here is a black box. What is the smallest unit of truth you can verify?"
      *   *What to Decline:* Whether Debate *actually* works in practice today. Whether it solves AGI alignment.

  8.  **Refining the "Complexity" Objection:**
      *   This is crucial for a board of engineers/lawyers. They understand recursion limits and discovery processes.
      *   Frame it as: "Debate buys you depth, but not infinite depth. If the lie is buried 100 layers deep, and the judge can only trace 10 layers, Debate fails."
      *   This connects to the "narrow conditions" goal.

  9.  **Final Review against Constraints:**
      *   45 mins? Yes, tight schedule.
      *   No ML jargon? Keep it structural.
      *   Focus on *conditions for success*, not proof of success.
      *   Address the specific engineer's idea respectfully but firmly.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't explain Debate *to the user*. The prompt says "Please don't explain the idea to me; plan how I should present it." I need to focus on *pedagogy* and *sequencing*.
      *   *Correction:* Ensure the "Self-Cross-Examination" timing is precise. It's best used as a transition from "Problem" to "Solution."
      *   *Correction:* The "Is this deployment safe?" example needs to be explicitly ruled out early so they don't anchor on it.

  11. **Final Polish:** Check tone. Authoritative, strategic, respectful of the board's time and intelligence. Ensure the "Closing Question" is sharp.

  *(Self-Correction on the Closing Question)*: The user suggested: "hand them a fresh task and ask what, exactly, a weak judge would need to be able to check cheaply and reliably for the protocol to help, treating cannot be named as a good answer."
  *Refinement:* Make sure the instruction emphasizes that "I don't know" is a valid and insightful answer if the verification primitive doesn't exist.

  *(Self-Correction on What to Decline)*: Be explicit. "I am not claiming this solves alignment. I am claiming this is the *shape* of the problem we must solve."

  Let's assemble the plan.cw
answer: |-
  Here is a 45-minute presentation plan designed to shift your board's mental model from "alignment is a training recipe" to "oversight is a structural bottleneck," using the Debate proposal as a lens to examine the conditions of trust.

  ### **Phase 1: Induce the Crisis (0:00–0:10)**
  **Goal:** Separate *generating* an answer from *judging* an answer. Make them feel the loss of leverage.

  *   **The Hook (2 mins):** Start by validating their RLHF intuition, then break it. "RLHF works because the human is the teacher. But what happens when the student becomes the expert? If the system writes code better than our best engineer, or finds legal loopholes better than our counsel, we cannot grade the homework by reading the answer."
  *   **The Trap (5 mins):** Present the three standard oversight intuitions they currently hold:
      1.  *Spot-checking:* "We'll sample the outputs." (Failure mode: The error is rare but catastrophic.)
      2.  *Explainability:* "We'll make the model show its reasoning." (Failure mode: The reasoning is plausible but false, and too complex to verify.)
      3.  *Red-teaming:* "We'll try to break it." (Failure mode: The system is smarter than the red team.)
  *   **The Pivot (3 mins):** State the core thesis. "Oversight fails when **checking** is as hard as **doing**. For scalable oversight to work, we need a protocol where checking is *asymptotically easier* than doing. If we cannot find that asymmetry, we cannot sign off on systems smarter than us."

  ### **Phase 2: The Carrying Example (0:10–0:20)**
  **Goal:** Ground the abstract problem in a verifiable structure.

  *   **The Example:** Use your expense report idea, but sharpen the constraints.
      *   *Scenario:* A report with 10 million line items totaling $1B. The board suspects a $1M fraud.
      *   *Constraint 1 (The Bottleneck):* The board cannot sum the column (too slow).
      *   *Constraint 2 (The Lever):* The board *can* verify any single line item against a receipt instantly.
      *   *Constraint 3 (The Stakes):* If the total is wrong, the deployment fails.
  *   **Why this example works:** It isolates **verification** from **computation**. It provides a clear "ground truth" (the receipt) that is cheap to access but hard to locate.
  *   **Why others fail (Explicitly state this):**
      *   *Images/Routes:* These are perceptual. If the AI says "This route is faster," and I cannot drive it, I have no cheap verification primitive. I am stuck trusting the AI's sensor data.
      *   *"Is this deployment safe?":* This is the wrong structure because there is no single "line item" to check. Safety is a holistic property, not an additive sum. Using this example will make Debate look like magic rather than a protocol.
  *   **The Mechanism (Bisection):** Explain how two parties can narrow the dispute. AI A says "The error is in the first half." AI B says "The error is in the second half." The judge cuts the search space in half. Repeat until a single line item is isolated. The judge checks the receipt. Game over.

  ### **Phase 3: The Proposal & The Engineer's Objection (0:20–0:30)**
  **Goal:** Introduce Debate not as a solution, but as a set of conditions. Address "Self-Cross-Examination" here as a foil.

  *   **Introduce Debate (5 mins):** Map the expense example to Debate.
      *   The "Line Item" is the **claim**.
      *   The "Receipt" is the **verification primitive**.
      *   The "Bisection" is the **argument tree**.
      *   *Crucial Point:* Debate does not generate truth. It *locates* the specific claim that the human needs to verify. It moves the human from "auditor of the whole" to "auditor of the atom."
  *   **Address Self-Cross-Examination (5 mins):** This is the strategic moment to handle your engineer's suggestion.
      *   *Placement:* Do it now, because it clarifies *why* Debate requires two agents.
      *   *The Argument:* "If one model generates the answer and the counter-argument, it optimizes for **persuasion**, not truth. It will generate a 'straw man' counter-argument that is easy to defeat. To make the protocol work, the incentive to find the error must be stronger than the incentive to hide it. You need **competitive pressure**, not introspection."
      *   *The Takeaway:* This establishes that Debate relies on *game theory*, not just better prompting.

  ### **Phase 4: Misconceptions & The Hard Limit (0:30–0:40)**
  **Goal:** Dismantle the four easy misconceptions quickly to save time for the fifth (Complexity), which is the real bottleneck for this audience.

  *   **Rapid Fire (5 mins):**
      1.  *Truth is Persuasive:* "False. Lies are often simpler. Debate works only if the *verification* of the truth is cheaper than the *fabrication* of the lie."
      2.  *Judge Knows Nothing:* "False. The judge must be able to verify the 'receipt.' If the judge cannot check the bottom layer, the protocol collapses."
      3.  *Market Convergence:* "False. Markets converge on price, not accuracy. We need specific scoring rules, not just open competition."
      4.  *Collusion:* "Valid. If the models share a hidden channel, they can agree to fool the judge. This is a security constraint, not a theoretical fix."
  *   **The Complexity Objection (5 mins):** This is the most important section for your board.
      *   *The Worry:* "What if the argument tree gets too deep? What if the 'line item' is actually a complex sub-calculation that I also can't verify?"
      *   *The Reality:* This is the **narrow condition** for Debate to work. Debate buys you *depth*, but not *infinite* depth.
      *   *The Claim:* "For Debate to work, the problem must be decomposable into steps that a human *can* verify. If the 'atomic truth' is beyond human comprehension, Debate fails. It relocates the bottleneck; it does not eliminate it."
      *   *Why this matters to them:* As engineers and lawyers, they understand discovery limits. This frames Debate as a **tool for managing complexity**, not a magic wand for AGI safety.

  ### **Phase 5: Closing & Delimitations (0:40–0:45)**
  **Goal:** Test structural understanding and define the scope of the discussion.

  *   **The Test Question (3 mins):** Hand them a fresh, vague task (e.g., "Evaluate this model's privacy policy"). Ask:
      *   *"For a Debate protocol to help us here, what is the specific 'receipt'—the atomic claim—that a weak judge must be able to check cheaply? If you cannot name the receipt, the protocol cannot start."*
      *   *Success Criteria:* If they answer with a specific verification step (e.g., "Check if data flow matches diagram"), they get it. If they answer with "The model explains why it's safe," they missed it. If they say "There is no receipt," they have understood the limit.
  *   **What You Decline to Settle (2 mins):** Be explicit.
      *   "I am not claiming Debate works today. I am claiming this is the **shape of the problem** we must solve."
      *   "I am not claiming this solves alignment. I am claiming this is a necessary condition for **oversight**."
      *   "We are not deciding whether to deploy this. We are deciding whether to require our engineering teams to build **verifiable primitives** into their systems."

  ### **Summary of Strategic Choices**

  1.  **Why the Expense Report?** It creates a clean separation between *search* (hard) and *verification* (easy). Images and safety cases blur this line, leading to the misconception that the AI is just "convincing" the human.
  2.  **Why Address Self-Cross-Examination Mid-Stream?** If you do it too early, it looks like you are shooting down ideas before defining the problem. If you do it too late, it's an afterthought. Placing it after the mechanism is explained allows you to use it to highlight the *adversarial* requirement of Debate.
  3.  **Why Focus on Complexity?** For a board of non-ML experts, "truth" is philosophical, but "recursion depth" is engineering. The Complexity Objection is the one that turns Debate from a "safety magic trick" into a "systems engineering constraint."
  4.  **Why "Cannot Be Named" is a Good Answer?** It forces them to confront the possibility that some tasks are **inherently unoversightable** by humans, regardless of the protocol. This is the responsible conclusion for a review board to reach.

  ### **Speaker Notes: Key Phrases to Use**
  *   "We are not looking for truth; we are looking for **verifiable claims**."
  *   "Debate does not remove the need for human judgment; it **concentrates** it on the bottleneck."
  *   "If the atomic unit of the argument is opaque to the judge, the protocol is just theater."
  *   "Self-cross-examination assumes the model wants to be caught. Debate assumes the model wants to win."
