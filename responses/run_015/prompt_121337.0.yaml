answer: |-
  This phenomenon sits at the intersection of bioethics, sociology of medicine, and decision theory. You are describing a specific feedback loop where the *prevalence* of an intervention alters the *reference class* used to evaluate that intervention, thereby changing its normative status from "enhancement" to "treatment."

  While there are adjacent concepts, none capture the specific *shape* (the asymmetric reclassification via baseline migration) tightly enough to stand alone.

  **Nearby Concepts and Distinctions**

  1.  **Medicalization:** This is the *outcome*, not the *mechanism*. Medicalization describes the process by which non-medical problems become defined and treated as medical problems. Your phenomenon explains *how* a specific type of medicalization occurs (via baseline shift), but medicalization can happen without baseline drift (e.g., defining grief as depression doesn't necessarily shift the population's average grief response).
  2.  **Looping Effects (Ian Hacking):** This is the closest philosophical ancestor. Hacking describes how classifying people changes how they behave, which changes the classification. However, looping effects focus on the *classified subjects* changing to fit the label. Your phenomenon focuses on the *standard of measurement* changing because of the intervention's prevalence. In looping, the people move toward the line; in your shape, the line moves toward the people.
  3.  **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This applies when agents game a metric. Your phenomenon is not about gaming the metric, but about the metric's *zero point* (the definition of "normal") shifting endogenously.
  4.  **Shifting Baseline Syndrome:** Borrowed from ecology (fisheries), this describes each generation accepting a degraded state as the new normal. Your phenomenon is the inverse: accepting an *enhanced* state as the new normal. While the mechanism is identical, the direction and context (medical norms vs. ecological depletion) differ enough that using the ecological term creates confusion.
  5.  **Concept Creep (Nick Haslam):** This describes the semantic expansion of harm-related concepts. It covers the *result* (the concept of "treatment" expands), but not the *mechanism* (the statistical/functional baseline moving due to adoption rates).

  **The Asymmetry (Why it only ratchets one way)**

  You asked why upgrades become restorations, but restorations don't become upgrades. This is due to the **teleology of medicine** combined with **positional competition**.

  Medicine is inherently normative; it aims to restore or maintain "health." "Health" is rarely defined as "below average." Therefore, baselines can ratchet *up* (we expect more function), but they rarely ratchet *down* (we do not officially accept less function as "normal" if more is available).
  *   **Up $\to$ Normal:** If everyone takes a stimulant to study, the "normal" study capacity increases. Not taking it becomes a deficit. The stimulant becomes a restoration of the new normal function.
  *   **Down $\to$ Normal:** If a treatment becomes rare, the baseline doesn't drop to make the treatment an "upgrade." We don't say, "Since no one gets antibiotics anymore, having an immune system that fights infection naturally is an enhancement." We still view the infection as the defect. The "floor" of normalcy is sticky; the "ceiling" is mobile.

  **The Baseline Problem (Statistical vs. Functional)**

  This phenomenon afflicts **both** statistical and functional baselines.
  *   **Statistical:** If 80% of students use stimulants, the statistical average of "focus" moves. Non-users become statistical outliers.
  *   **Functional:** Norman Daniels argues for "species-typical functioning" as a baseline. However, function is relational to the environment. If the academic environment is calibrated to the attention span of a medicated population, the *functional* capacity of an unmedicated student is objectively reduced relative to the demands of the niche. The "function" required to survive the niche has changed. Thus, the intervention shifts the functional baseline even if the biological "species-typical" capacity hasn't changed.

  **The Label**

  Since no established term isolates the *mechanism* (baseline shift) from the *outcome* (medicalization) and the *subject* (looping), the tightest label is a coinage that captures the directionality and the domain.

  **Term:** **The Normalcy Ratchet**

  **Definition:** A socio-medical feedback loop wherein the widespread adoption of an intervention shifts the statistical or functional baseline of a population, causing the intervention to be reclassified from an enhancement (optional improvement) to a treatment (necessary restoration of the new normal).

  **Criteria for Identification:**
  1.  **Endogeneity:** The definition of "normal" depends on the prevalence of the intervention.
  2.  **Reclassification:** The intervention changes normative status (Enhancement $\to$ Treatment).
  3.  **Asymmetry:** The shift moves toward higher expectation/functioning; it does not reverse.
  4.  **Deficit Creation:** The absence of the intervention comes to be perceived as a pathology or deficit where none was previously recognized.

  \answer{The Normalcy Ratchet}
