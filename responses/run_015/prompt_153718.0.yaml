  # Seminar Handout: Mapping Indirect Normativity

  ## Part I: The Diagnostic Instrument

  **Starting Commitment:** An act's deontic status is not settled by what the agent's own actual deliberation would deliver, but by what an idealised version of that deliberation would deliver.

  **Instructions:** Proceed through the following nodes in order. Select the option that best describes the normative truth of the case presented. Do not select based on which label you prefer; select based on which description fits your commitment. Some paths terminate early; others proceed to further distinctions.

  ### Node 1: Anchoring
  **Case:** Consider an agent whose desires have been deformed by oppression, such that they desire their own subordination.
  **Question:** Does the idealised deliberator retain these desires after correcting for cognitive errors, or replace them with what any rational being would want regardless of upbringing?
  *   **(A) Retain:** Proceed to Node 2.
  *   **(B) Replace:** Proceed to Node 2.

  ### Node 2: Information
  **Case:** Consider an agent who lacks the concepts needed to grasp the decisive information even when it is handed to her.
  **Question:** Does the idealised deliberator possess that information regardless of the agent's conceptual scheme, or only what the agent could acquire within their conceptual limits?
  *   **(A) Possess (Full Information):** Proceed to Node 3.
  *   **(B) Acquire (Accessible Information):** Proceed to Node 3.

  ### Node 3: Powers
  **Case:** Consider a physician choosing between two drugs on asymmetric evidence.
  **Question:** Is the idealised deliberator assumed to calculate the exact probabilities costlessly, or to weigh evidence without bias but within human time limits?
  *   **(A) Costless (Unbounded):** Proceed to Node 4.
  *   **(B) Time Limits (Bounded):** Proceed to Node 4.

  ### Node 4: Modality
  **Case:** Consider the physician again, but suppose the drug the ideal deliberator would select is out of stock.
  **Question:** Is the right action what the ideal deliberator *would* pick (the out-of-stock drug), or what it is *best* to do given the constraints (the available drug)?
  *   **(A) Would Pick:** Proceed to Node 5.
  *   **(B) Best to Do:** Proceed to Node 6.

  ### Node 5: Uptake-Sensitivity
  **Case:** Consider an ideal advisor who knows the agent will comply only partially with any recommendation.
  **Question:** Does the recommendation change to accommodate this likely failure, or remain fixed on the optimal outcome?
  *   **(A) Change (Sensitive):** Proceed to Node 7.
  *   **(B) Fixed (Insensitive):** Proceed to Node 7.

  ### Node 6: Target
  **Case:** Consider a scenario where the ideal deliberator knows the agent's psychology perfectly.
  **Question:** Do they select the action they would perform in the agent's shoes, or the action they would command the agent to perform?
  *   **(A) Perform (Choice):** Proceed to Node 7.
  *   **(B) Command (Advice):** Proceed to Node 7.

  ### Node 7: Indirectness
  **Case:** Consider a situation in which deliberating about whether to trust a friend is itself what destroys the trust.
  **Question:** Should the agent attempt to replicate the ideal deliberator's reasoning process, or adopt a disposition that bypasses such reasoning?
  *   **(A) Replicate (Direct):** **Terminate at Leaf Group D.**
  *   **(B) Bypass (Indirect):** Proceed to Node 8.

  ### Node 8: Source of Indirectness
  **Case:** Return to the trust case, or the physician case where calculation induces anxiety.
  **Question:** Is the bypass required because calculating the right action corrupts the motive (trust), or because the agent lacks the capacity to calculate correctly (competence)?
  *   **(A) Corruption:** Proceed to Node 9.
  *   **(B) Competence:** Proceed to Node 9.

  ### Node 9: Vindication
  **Case:** Consider the disposition that bypasses reasoning.
  **Question:** Is this disposition justified because it leads to the ideal outcome, or because it constitutes rational agency independently of the outcome?
  *   **(A) Outcome:** Proceed to Node 10.
  *   **(B) Agency:** Proceed to Node 10.

  ### Node 10: Self-Effacement
  **Case:** Consider the agent reflecting philosophically on their own dispositions.
  **Question:** Must the agent remain unaware of the true criterion even when reflecting, or only when acting in the moment?
  *   **(A) Unaware (Global):** **Terminate at Leaf Group I.**
  *   **(B) Acting Only (Local):** **Terminate at Leaf Group I.**

  ---

  ## Part II: The Map of Positions

  The following leaves occupy the logical space defined above. Combinations not listed here are marked as unoccupied.

  ### Leaf Group D (Direct Views)
  *Reached if Node 7 = (A) Replicate.*

  **D1. Ideal Advisor Theory**
  *Path:* 1(A), 2(A), 3(A), 4(A), 5(A).
  *Label:* **Subjective Ideal Advisor**
  *Awkward Commitment:* It must claim that an agent can be required to do what they are psychologically incapable of understanding.

  **D2. Objective Ideal Observer**
  *Path:* 1(B), 2(A), 3(A), 4(B).
  *Label:* **Objective Consequentialism**
  *Awkward Commitment:* It renders the right action potentially unknowable to any finite being, even in principle.

  **D3. Bounded Rationalism**
  *Path:* 1(A), 2(B), 3(B), 4(B), 6(A).
  *Label:* **Pragmatic Rationalism**
  *Awkward Commitment:* It struggles to explain why a bounded calculation is normative rather than merely excusable.

  **D4. Unnamed**
  *Path:* 1(B), 2(B), 3(A), 5(B).
  *Label:* **Unoccupied / Incoherent**
  *Diagnosis:* Combining objective anchoring with full powers but insensitive uptake creates a demand that is both alien and rigid; no major view occupies this space.

  ### Leaf Group I (Indirect Views)
  *Reached if Node 7 = (B) Bypass.*

  **I1. Rule Consequentialism (Corruption)**
  *Path:* 7(B), 8(A), 9(A), 10(A).
  *Label:* **Global Rule Consequentialism**
  *Awkward Commitment:* It requires agents to remain ignorant of the very moral theory that justifies their actions, even in philosophical reflection.

  **I2. Rule Consequentialism (Capacity)**
  *Path:* 7(B), 8(B), 9(A), 10(B).
  *Label:* **Local Rule Consequentialism**
  *Awkward Commitment:* It must explain why the criterion is truth-apt if it is never the correct decision procedure for the agent.

  **I3. Virtue Ethics (Outcome)**
  *Path:* 7(B), 8(A), 9(A), 10(B).
  *Label:* **Consequentialist Virtue Theory**
  *Awkward Commitment:* It risks collapsing back into direct consequentialism whenever the agent is capable of calculating the outcome.

  **I4. Virtue Ethics (Agency)**
  *Path:* 7(B), 8(A), 9(B), 10(A).
  *Label:* **Non-Consequentialist Virtue Theory**
  *Awkward Commitment:* It severs the link between right action and good outcomes, making moral progress mysterious.

  **I5. Hybrid View (Competence)**
  *Path:* 7(B), 8(B), 9(B), 10(A).
  *Label:* **Rationalist Disposition Theory**
  *Awkward Commitment:* It posits a standard of rationality that is independent of both the agent's actual psychology and the ideal outcome.

  **I6. Unnamed**
  *Path:* 7(B), 8(B), 9(A), 10(A).
  *Label:* **Unexplored**
  *Diagnosis:* A view where incompetence requires global self-effacement for the sake of outcomes is theoretically possible but lacks a defender.

  **I7. Unnamed**
  *Path:* 7(B), 8(A), 9(B), 10(B).
  *Label:* **Unexplored**
  *Diagnosis:* A view where corruption requires only local self-effacement for the sake of agency is unstable; corruption usually demands global protection.

  **I8. Unnamed**
  *Path:* 7(B), 8(B), 9(B), 10(B).
  *Label:* **Unoccupied / Unattractive**
  *Diagnosis:* Combining competence limits with agency vindication and local self-effacement offers no clear advantage over Direct views.

  ---

  ## Part III: Logical Gaps and Limits

  **Unoccupied Combinations**
  The following logical combinations are marked as empty in the Map above:
  1.  **Direct + Bounded + Full Info:** (Nodes 2A, 3B, 7A). *Diagnosis:* Incoherent; one cannot have full information with bounded processing powers in this framework.
  2.  **Indirect + Corruption + Local Self-Effacement:** (Leaf I7). *Diagnosis:* Unattractive; if deliberation corrupts the motive, knowing the theory philosophically may still undermine the disposition.
  3.  **Direct + Objective Anchoring + Sensitive Uptake:** (Nodes 1B, 5A). *Diagnosis:* Unexplored; objective views typically resist adjusting norms to agent failure.

  **Indistinguishable Leaves**
  This instrument cannot reliably separate the following pairs, as they converge on the same practical recommendations despite theoretical differences:
  1.  **Leaf I1 (Global Rule Consequentialism) and Leaf I3 (Consequentialist Virtue Theory).** Both prescribe the same dispositions for the same reasons (outcome maximisation via indirect means), differing only on whether the disposition is labelled a 'rule' or a 'virtue'.
  2.  **Leaf D3 (Pragmatic Rationalism) and Leaf I2 (Local Rule Consequentialism).** Both recommend bounded deliberation; the tree distinguishes them by whether the bypass is a 'replication' failure or a 'disposition' adoption, but in practice, these look identical.

  ---

  ## Usage Note

  Record your route through the tree as a specific path of answers (e.g., 1A-2B-3A...), not as a total score. Collapsing the path into a score obscures the structural commitments that distinguish the positions.
