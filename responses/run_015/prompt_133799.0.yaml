answer: |-
  The metaphysical force of the Flying Man argument lies not merely in the phenomenological claim that self-awareness persists without sensation, but in the semantic and ontological implications of the first-person judgment itself. When the suspended subject affirms "I exist," the success of this reference entails a specific ontology of the self. If the self were merely a brain state, a bundle of perceptions, or an Aristotelian form inextricably tied to the matter of a particular body, the radical suspension of bodily content would sever the link between the pronoun "I" and its referent. The fact that the judgment survives the void indicates that the "I" does not refer to a bodily particular or a state thereof, but to a substantive, immaterial soul that functions as a stable ground for first-person reference independent of physical indexing.

  To understand this, we must analyze the conditions required for successful reference. In ordinary contexts, the first-person pronoun "I" functions as an indexical; it picks out the speaker via their location in space-time and their association with a specific physical organism. We identify ourselves implicitly through bodily boundaries and sensory perspectives. However, the Flying Man scenario systematically strips away these indexical anchors. There is no "here" (no spatial location), no "this body" (no tactile or visual boundary), and no "now" defined by change or motion.

  If the referent of "I" were identical to the body or a state of the body, the removal of bodily awareness would render the term empty. Consider the materialist hypothesis: if "I" refers to "the state of this brain," then in the absence of any awareness of the brain or its states, the subject should be unable to affirm existence with certainty. They might suspect a thinker exists, but they could not identify *themselves* as that thinker, because the identifying description (the body) has been removed from the field of awareness. Similarly, on a hylomorphic view where the soul is the form of the body, the self is ontologically oriented toward matter. Without the awareness of matter, the form should have no distinct intelligible presence to itself.

  Yet, the Flying Man's affirmation is not a hypothesis; it is an immediate certainty. This certainty implies that the referent of "I" is not discovered through the mediation of bodily properties. Instead, the self is present to itself *prior* to any identification of physical attributes. For the reference to succeed in a vacuum of sensory content, the "I" must latch onto a substrate that is self-manifesting. This substrate cannot be a contingent property or a physical state, as those require a bearer to be intelligible. Therefore, the survival of the judgment demonstrates that the self is a substance in its own right—a *res* that does not require another subject (like a body) to inhere in. The "I" refers to a stable, immaterial entity that remains identical to itself regardless of the presence or absence of physical indexicals.

  A common objection to this reading attempts to naturalize the Flying Man's awareness by appealing to residual internal sensations. One might argue that the suspended subject is not truly devoid of bodily awareness; they may still possess proprioceptive or vestibular signals—a sense of orientation, tension, or "floating." On this view, the subject infers "I exist" from the premise "There is a sensation of floating." This attempts to ground the first-person reference in a subtle form of bodily perception, thereby saving the physicalist or hylomorphic account.

  However, this objection fundamentally confuses awareness *of* a state with the awareness *that constitutes* the subject. Proprioception and vestibular signals are objects of consciousness; they are content. To say "I feel floating" is to posit a subject distinct from the feeling of floating. If the Flying Man's self-knowledge were grounded in these signals, the "I" would be an inference drawn from the presence of those signals. But an inference is fallible and mediated; it relies on the logical step that "feelings require a feeler." The Flying Man's knowledge is not inferential. It is not "I feel, therefore I am"; it is simply "I am."

  Furthermore, appealing to residual sensation fails to account for the *identity* of the referent. Even if the subject feels a vestibular sensation, how do they know that the "I" referring to that sensation is the same "I" that existed before the suspension? If the self is merely the locus of these sensations, and the sensations change or vanish, the referent of "I" becomes unstable. The certainty of the Flying Man implies a continuity of reference that sensation cannot provide. Sensation is transient and variable; the "I" that affirms existence is constant. To ground the "I" in proprioception is to mistake the *medium* through which a body is known for the *subject* who knows. The subject is the transparency through which sensations appear, not the sensations themselves.

  Consequently, the objection from residual sensation collapses because it treats the self as an object within the field of awareness, rather than the condition of the field itself. If the self were a brain state or a bodily form, it would be an object of detection, requiring sensory or quasi-sensory data to be referenced. But the Flying Man's affirmation occurs even if we hypothetically strip away all such data. The persistence of the first-person reference in the total absence of bodily content proves that the referent is not bodily.

  In conclusion, the Flying Man argument establishes more than a phenomenological gap between mind and body; it necessitates a metaphysical distinction in the ontology of reference. The certainty with which the suspended subject affirms "I exist" demonstrates that the first-person pronoun does not rely on physical indexicals to secure its meaning. It refers directly to a substantive, immaterial soul that is self-constituting. Because the judgment survives the annihilation of bodily awareness, the bearer of that judgment cannot be the body or a state of the body. The self is revealed not as a property of a physical organism, but as a stable, independent substance that serves as the non-contingent ground for all first-person reference.
