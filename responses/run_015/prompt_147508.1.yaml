answer: |-
  This is an excellent set of questions. You have spotted genuine tensions in the "folk history" of economics that often get glossed over in popular summaries. The chapter you read is presenting a stylized, somewhat cynical version of Revealed Preference Theory (RPT) that mixes historical fact with philosophical caricature.

  Your friend is right that the "unfalsifiable" claim is a caricature, and your intuition about the Monday/Friday problem is spot-on: it highlights a hidden assumption in the theory that the summary ignores.

  Here is a breakdown of the chapter's summary, bit by bit, followed by an explanation of your friend's comment, the Monday/Friday problem, and the welfare economics conclusion.

  ### Part 1: Scorecard on the Chapter's Summary

  Let's grade the claims in the text you quoted.

  **1. "Before Samuelson, economists thought utility was a real quantity... a kind of pleasure."**
  *   **Verdict:** *Mostly Fair, but simplified.*
  *   **Nuance:** Early marginalists (like Edgeworth) did talk about "utils" as if they were measurable psychological units (cardinal utility). However, Vilfredo Pareto (decades before Samuelson) had already shown that you only need *ordinal* utility (ranking bundles) to derive demand curves. Samuelson didn't kill cardinal utility; Pareto mostly did. Samuelson's innovation was trying to remove the word "utility" entirely.

  **2. "Samuelson pointed out that this was circular... 'utility' was just a fancy name for choice."**
  *   **Verdict:** *Fair.*
  *   **Nuance:** This is the core of Samuelson's 1938 paper. He argued that saying "I chose X because it gives me more utility" is tautological if the only evidence for the utility is the choice itself. He wanted to ground theory in observables (prices, income, quantities).

  **3. "He therefore redefined preference as whatever choice reveals."**
  *   **Verdict:** *Fair.*
  *   **Nuance:** This is the definition of Revealed Preference. If you buy bundle $A$ when bundle $B$ costs the same or less, you have "revealed" that you prefer $A$ to $B$.

  **4. "The point was that utility maximisation is empty as an empirical claim... isn't really falsifiable."**
  *   **Verdict:** **Wrong.**
  *   **Why it matters:** This is the biggest error in the summary. Samuelson's *goal* was to make consumer theory **falsifiable**. He did this by adding an axiom of **consistency**. If you choose $A$ over $B$ today, you cannot choose $B$ over $A$ tomorrow if both are still affordable. If you do, the theory is falsified. The summary claims RPT makes the theory a tautology; in reality, RPT adds a restriction (consistency) that makes it testable.

  **5. "Later economists dressed this up with... GARP... since you can fit a clever enough utility function to almost any finite set of observations, it rarely bites."**
  *   **Verdict:** **Misleading.**
  *   **Why it matters:** The Generalized Axiom of Revealed Preference (GARP) is a strict mathematical condition. Afriat's Theorem (1967) proves that if a dataset satisfies GARP, there *exists* a utility function that rationalizes it. But real-world data often *violates* GARP. It is not a "bookkeeping device" that accepts anything; it is a filter that rejects inconsistent behavior. Experimental economists find violations of GARP frequently.

  **6. "The upshot is that utility in economics just means observed choice, so it can never tell you whether someone is better or worse off."**
  *   **Verdict:** **Subtly Off.**
  *   **Why it matters:** Within RPT, if you choose $A$ over $B$, you are *defined* as being better off with $A$. So, it *does* tell you if someone is better off, but only relative to their own choices, not by an external standard of "happiness." The summary conflates "better off" (welfare) with "happier" (psychology).

  ---

  ### Part 2: Operationalism vs. Testability

  You noted a contradiction: *How can RPT be an "operationalist purge of unobservables" (which sounds like defining things away) and yet have "real testable content"?*

  The resolution lies in the difference between a **definition** and an **axiom**.

  1.  **The Definition (Operationalism):** Samuelson defined "utility" operationally. He said, "Don't tell me about feelings. Show me the choice." This purges the unobservable psychological state.
  2.  **The Axiom (Testability):** He then imposed a rule on those choices: **Consistency.** (Specifically, the Weak Axiom of Revealed Preference, or WARP).

  **The Analogy:**
  Imagine a theory of "Gravity" that defines "heavy" as "what falls down."
  *   **Critique:** "That's circular! You're just defining heavy as falling."
  *   **Defense:** "Yes, but the theory claims that *everything* defined as heavy will fall down *at the same rate* in a vacuum."

  The definition removes the mystery; the axiom makes the prediction. If you see a "heavy" object float up, the theory is falsified. Similarly, RPT defines preference as choice, but claims those choices will be *transitive and consistent* across different prices. If you violate consistency, the model breaks.

  So, the operationalism doesn't remove testability; it shifts the test from "measuring utils" to "checking for consistency."

  ---

  ### Part 3: Decoding Your Friend ("Budget Sets, Not Menus")

  Your friend's comment is cryptic but points to the specific mechanism that makes RPT falsifiable.

  When the summary says, "whatever you do is by definition what you prefer," it implies that if you pick an apple, you prefer apples. But RPT is more precise. It says: **You prefer the apple *given the prices and income you faced*.**

  *   **Menu:** The set of all physically possible goods.
  *   **Budget Set:** The set of goods you can actually afford.

  RPT only works if we observe choices across **different budget sets**.
  *   **Scenario A:** Apples cost \$1, Oranges cost \$1. You buy an Apple. (Reveals: Apple $\sucq$ Orange).
  *   **Scenario B:** Apples cost \$1, Oranges cost \$0.50. You buy an Orange. (Reveals: Orange $\sucq$ Apple).

  If you do both, you have violated WARP (intransitivity). The theory is falsified.

  **What your friend meant:**
  The summary suggests the theory is empty because "you can always say they preferred what they chose." Your friend is pointing out that you can only say that if the options were *affordable*. If the budget set changes (prices shift), the choice *must* shift in a predictable way to remain consistent. If the data doesn't respect the geometry of the budget sets, the theory fails. The "budget set" constraint is what gives the theory its teeth.

  ---

  ### Part 4: The Monday/Friday Problem

  > *Suppose someone faces exactly the same prices and the same income on Monday and on Friday, and picks something different each time. If preference just is choice, then it seems like the theory either has to say his preferences changed between Monday and Friday, or say nothing at all.*

  This is the sharpest objection you have raised. Here is how a defender of the approach handles it.

  **1. The Assumption of Stability**
  Standard Revealed Preference Theory assumes **preference stability** over the observation period. It assumes the "utility function" is fixed while we collect the data.
  *   If you choose $A$ on Monday and $B$ on Friday (with identical budgets), you have violated the **Weak Axiom of Revealed Preference (WARP)**.
  *   **Verdict:** The theory says this behavior is **irrational** (or at least, not representable by a stable utility function). It does not say "preferences changed." It says the model does not apply to this person.

  **2. The "Error Term" Defense**
  In applied econometrics, economists acknowledge people make mistakes or face unobserved constraints. They add a "random utility" component.
  *   $Utility = Observed Factors + Random Error$.
  *   If the error term is large enough, choosing $A$ on Monday and $B$ on Friday is statistically probable even with stable underlying preferences.
  *   **Verdict:** This saves the theory but weakens it. It moves from "Choice reveals preference" to "Choice reveals preference *plus noise*."

  **3. Your Intuition**
  You asked: *Is that an actual problem for the view, or is it just me using "preference" in the everyday sense?*
  It is a problem for the **strong** version of the view (Samuelson's original hope). If people fluctuate randomly, "Revealed Preference" cannot reconstruct a unique utility function.
  However, economists usually handle this by saying: "Preferences are stable over *relevant* timeframes." If Monday and Friday are far apart, maybe tastes changed. If they are close, maybe it's measurement error.
  **Crucially:** The chapter summary implies the theory *allows* anything ("whatever you do is by definition what you prefer"). The Monday/Friday case proves that wrong. The theory *forbids* this behavior unless you admit preferences changed. If preferences can change every day, the theory loses predictive power, which is a known criticism, but it's not because the theory defines preference as choice—it's because the theory *requires* stability to work.

  ---

  ### Part 5: Does the Welfare Conclusion Follow?

  The chapter concludes: *"...utility in economics just means observed choice, so it can never tell you whether someone is better or worse off, which is why welfare economics gave up on utility and fell back on money."*

  **This conclusion does not follow from the accurate parts of the theory.** In fact, it gets the logic backward.

  1.  **RPT Supports Welfare Judgments:** If RPT is true, and I choose Bundle $A$ over Bundle $B$ when both are affordable, I am *by definition* better off with $A$. RPT actually *strengthens* the link between choice and welfare, it doesn't sever it. It says: "We don't need to know your happiness; your choice proves you are better off."
  2.  **Why Welfare Economics Uses Money:** Welfare economics uses money metrics (Willingness To Pay, Kaldor-Hicks) not because utility is "just choice," but because of the **Interpersonal Comparison Problem**.
      *   RPT tells us *you* are better off with $A$ than $B$.
      *   It does *not* tell us if *you* gaining \$10 is "more good" than *I* lose \$10.
      *   To compare across people, we need a common denominator. Money is that denominator.
  3.  **The "Gave Up" Claim:** Welfare economics didn't "give up" on utility. Pareto Efficiency is still the gold standard of welfare economics, and it is purely based on ordinal utility (which RPT supports). Money metrics are a pragmatic tool for policy when Pareto improvements aren't possible, not a philosophical surrender.

  ### Summary of Corrections

  To make the chapter accurate, it would need to change these points:

  1.  **Falsifiability:** Acknowledge that Samuelson introduced RPT specifically to *make* the theory falsifiable via consistency axioms (WARP/GARP), not to render it a tautology.
  2.  **Constraints:** Clarify that preference is revealed only relative to a **budget set**, not just a menu of options.
  3.  **Stability:** Acknowledge that the theory assumes stable preferences; the Monday/Friday contradiction is a violation of the model, not a feature of it.
  4.  **Welfare:** Clarify that RPT *validates* choice as a welfare metric for the individual, but interpersonal comparisons require money because we cannot compare utility *between* people, not because utility is meaningless.

  **Final Verdict:** Your skepticism is well-founded. The chapter presents a "straw man" version of Revealed Preference that conflates the *definition* of utility with the *axioms* of behavior. It treats the theory as if it says "anything goes," when the actual theory says "only consistent choices go." Your friend's "budget sets" comment was an attempt to point out the constraints that make the theory testable, and your Monday/Friday example correctly identifies the stability assumption that the summary glosses over.
