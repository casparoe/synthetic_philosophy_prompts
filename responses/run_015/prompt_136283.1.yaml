answer: |-
  Your intuition is correct: the objector is committing a category error by conflating the logical status of a general theoretical framework with the empirical status of a specific model instantiated within that framework. As a physical chemist, you are accustomed to the distinction between a general law (e.g., thermodynamics) and a specific model of a system (e.g., an ideal gas in a piston). The slogan you are encountering is being used to deny the testability of the latter based on the alleged status of the former.

  Karl Popper's remark that Darwinism is a "metaphysical research programme" (made late in his life, retracting an earlier view that it was a tautology) is nuanced. It does not entail that *no* evolutionary claims are testable. Below is a conceptual map disambiguating the slogan into six distinct readings.

  ### 1. The Tautology Reading
  *   **Precise Claim:** The principle of natural selection is analytically true by definition (e.g., "fitness" is defined solely as "reproductive success," so "the fittest survive" means "those who survive, survive"). Therefore, it makes no empirical claims about the world.
  *   **Status:** **False.** This was Popper's *early* view (1950s), which he explicitly abandoned. In modern evolutionary biology, fitness is defined independently of survival (e.g., via physiological traits or propensity), allowing the claim "trait X increases fitness" to be falsified.
  *   **Support for Objector:** **No.** Even if this were true, it would only apply to the abstract principle. Your toy model specifies independent parameters (mutation rates, survival probabilities during blooms). It is not a tautology; it is a stochastic simulation with measurable inputs and outputs.

  ### 2. The Universal Framework Reading
  *   **Precise Claim:** "Darwinism" refers to the universal claim that *all* adaptation arises from natural selection. As a universal claim covering all possible life and environments, it is too vague to be falsified by any single observation. It functions as a metaphysical worldview rather than a specific scientific theory.
  *   **Status:** **Substantively Defensible.** This is close to Popper's later position. A claim that "selection explains everything" is indeed hard to falsify globally.
  *   **Support for Objector:** **No.** This reading concerns the *scope* of the theory, not the *testability of its applications*. That "General Relativity" is a broad framework does not mean a specific calculation of a planet's orbit is untestable. Your question is about a specific population history, not the universal validity of selection.

  ### 3. The Research Heuristic Reading
  *   **Precise Claim:** Darwinism is a "research programme" (in the Lakatosian sense) that guides scientists to look for adaptive explanations. It is a methodological rule ("try to explain traits via selection") rather than a factual assertion.
  *   **Status:** **Substantively Defensible.** Many philosophers view evolutionary theory as a set of modeling tools and heuristics.
  *   **Support for Objector:** **No.** A heuristic guides the *formation* of hypotheses; it does not render the resulting hypotheses untestable. Your toy model *is* the specific hypothesis generated by the heuristic. Asking whether the data supports selection over drift is precisely the test that the heuristic invites.

  ### 4. The Local Hypothesis Reading (The Counter-Claim)
  *   **Precise Claim:** While the *general principle* of natural selection may be metaphysical or framework-like, *specific claims* about specific populations (e.g., "Allele A increased due to selection coefficient $s > 0$") are empirically testable statistical hypotheses.
  *   **Status:** **True.** This is the consensus view in contemporary philosophy of biology (e.g., Sober, Godfrey-Smith).
  *   **Support for Objector:** **No.** This reading directly **contradicts** the objector. It asserts that your question about the neutral-ratchet model has empirical content because it compares two specific probabilistic models (selection + bias vs. drift + bias) against data.

  ### 5. The Statistical Indistinguishability Reading
  *   **Precise Claim:** In any finite population, the mathematical signatures of selection and drift (plus mutational bias) are fundamentally confounded. No amount of data can distinguish whether an allele frequency change was caused by a selective advantage or a stochastic run.
  *   **Status:** **False.** While drift and selection can be difficult to distinguish in practice with limited data, they are not *in principle* indistinguishable. If the selection coefficient is large enough relative to the effective population size ($N_e s \gg 1$), the signal is statistically distinct from neutral drift.
  *   **Support for Objector:** **Yes.** If this claim were true, your question would indeed be empirically empty. However, it is scientifically incorrect. Your model stipulates a 10% survival advantage during bottlenecks; in a simulation, this is mathematically distinguishable from pure drift given sufficient replicate runs or time-series data.

  ### 6. The Post-Hoc Accommodation Reading
  *   **Precise Claim:** Darwinism is untestable because it can explain any possible outcome after the fact (e.g., if a trait persists, it was fit; if it vanishes, it was unfit). It lacks predictive power.
  *   **Status:** **False/Exaggerated.** While evolutionary biology relies heavily on historical explanation, it makes robust predictions (e.g., antibiotic resistance, viral evolution, experimental evolution like Lenski's *E. coli*).
  *   **Support for Objector:** **Weak.** Even if one accepts this caricature, it applies to historical narratives, not forward-looking models. Your toy model is predictive: it predicts the trajectory of allele frequencies under specified parameters. It can be falsified if the simulation runs deviate significantly from the predicted distribution.

  ### Summary for Seminar Use

  The objector is relying on a conflation of **Reading 2** (Darwinism as a broad framework) with **Reading 5** (Specific hypotheses are untestable).

  *   **The Valid Point:** It is defensible to say the *general statement* "Natural Selection occurs" is a metaphysical framework (Reading 2).
  *   **The Error:** It is a logical fallacy to infer from this that *specific models* constructed within that framework lack empirical content.

  **How to reply:**
  You might state: *"I accept that 'Natural Selection' as a universal principle may function as a metaphysical framework. However, my toy model does not assert the universal principle; it asserts a specific statistical hypothesis: that $s \approx 0.1$ during blooms versus $s = 0$. This is a claim about parameters, not metaphysics. If the slogan implies that specific parameter estimates in population genetics are untestable, it contradicts standard statistical practice. If it only implies that the general concept of selection is a framework, then it is irrelevant to the testability of my specific model."*

  This forces the objector to specify whether they are attacking the *framework* (which you aren't defending as a specific theory) or the *model* (which is scientifically testable).
