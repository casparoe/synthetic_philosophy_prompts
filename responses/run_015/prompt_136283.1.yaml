  **(Self-Correction Note):** I must be careful not to simply say "Popper was wrong." Popper's view evolved. The seminar member is likely using a caricature of Popper's later view. I need to distinguish between "Darwinism as a universal principle" vs. "Darwinian models of specific populations." The slogan applies to the former; the toy model is the latter.

