answer: |-
  Here is the argument, straight down the line.

  ### 1. The Hard Cases: A Taxonomy Stress Test

  Let's run your specific examples, plus two poison pills, through the three mills.

  **The Cases:**
  *   **Sensory:** Warm bath, cold drink.
  *   **Intellectual:** Seeing why a proof works.
  *   **Relief:** Putting down a heavy bag, scratching an itch.
  *   **Malicious:** A long-nursed grudge landing.
  *   **Poison Pill A (Adaptation):** Getting used to the smell of manure on a farm.
  *   **Poison Pill B (Fleeting Joy):** A sudden, beautiful chord in music that passes instantly without altering your expectation for the next chord.

  **Felt-Quality (FQ):**
  *   *Failures:* It chokes on the **Intellectual** and **Malicious** cases. There is no distinctive "tingle" shared by solving a proof and a warm bath. If the FQ theorist says the tingle is very subtle, they risk making pleasure introspectively invisible.
  *   *Misclassification:* It risks counting intense sensory shocks as pleasure. A sudden loud noise has a vivid phenomenal character, but it isn't pleasure. FQ struggles to distinguish *intensity* of feel from *positivity* of feel without smuggling in an attitude.

  **Attitudinal (AP):**
  *   *Failures:* It struggles with **Relief**. When you put down a heavy bag, are you actively "liking" the sensation of your shoulders rising? Or is the pain just ceasing? AP often has to stretch "liking" to include "being glad that X stopped," which blurs the line between pleasure and the satisfaction of desire.
  *   *Misclassification:* **Addiction.** An addict may have a pro-attitude toward taking a drug (wanting it, seeking it) while hating the actual experience. AP must distinguish "wanting" from "liking" rigorously, or it counts cravings as pleasures.

  **Recalibration (RC):**
  *   *Failures:* It fails **Poison Pill B (Fleeting Joy)**. I can enjoy a chord without my baseline for "normal chords" shifting upward such that the next neutral chord feels disappointing. Many pleasures are consummatory without being comparative anchors.
  *   *Misclassification:* **Poison Pill A (Adaptation).** When I stop smelling the manure, my reference point for "normal smell" has absolutely recalibrated. The neutral state has shifted. But the process of adaptation was not pleasurable; it was merely perceptual habituation. RC counts habituation as pleasure.
  *   *The Grudge:* If malicious joy recalibrates my baseline for "satisfaction from justice," RC counts it. This isn't a bug for hedonism (hedonism is morally neutral), but it highlights that RC tracks *learning*, not *feeling good*.

  **Verdict on Taxonomy:** AP is the most robust classifier, provided it distinguishes "liking" from "wanting." FQ is phenomenologically false. RC is empirically over-inclusive (counts habituation) and under-inclusive (misses fleeting joys).

  ### 2. Taxonomy vs. Value: The Split

  You asked if we should split the jobs. Can one property unify the class "pleasure" while a *different* property explains why it's good?

  **No.** If you do that, you are not a hedonist.
  Hedonism is the claim that *pleasure* is the good. If "pleasure" is defined by property X (taxonomy), but "goodness" is conferred by property Y (value), and X ≠ Y, then you are actually a Y-ist who happens to believe X and Y usually correlate. You have abandoned hedonism for a perfectionist or objective list view that merely tracks pleasure as an indicator.

  **Who wins Value?**
  *   **FQ:** Intuitively strong. The "glow" feels like the good stuff. But since FQ fails taxonomy, it can't be the *sole* constituent of welfare (it leaves out intellectual joy).
  *   **AP:** Plausible. If welfare is about getting what you want (in the mode of enjoying), AP links taxonomy and value.
  *   **RC:** **Catastrophic failure on value.**

  Here is the kill shot for RC on the value question: **The Hedonic Treadmill Problem.**
  On your view, pleasure *is* the event that raises the baseline so that neutrality becomes disappointing. This means every unit of pleasure *degrades* your future capacity for welfare.
  If I experience a great pleasure, I have moved the goalposts. To get back to zero (neutrality), I now need *more* input than before. This makes pleasure inherently self-undermining. It turns welfare into a deficit model.
  If hedonism says "maximize pleasure," and RC says "pleasure makes future neutrality feel like pain," then hedonism instructs you to systematically impoverish your future experiential landscape. A theory of welfare cannot define the good as something that structurally inhibits the future attainment of the good.

  **Verdict:** AP wins taxonomy. FQ wins intuitive value (but loses taxonomy). RC loses both. You cannot split the jobs without abandoning hedonism.

  ### 3. Is Recalibration a Rival or a Disguise?

  RC is not a theory of pleasure. It is a theory of **hedonic adaptation** (learning/homeostasis).

  You have identified a *consequence* of some pleasures and mistaken it for their *essence*.
  *   **Disguise:** It is a causal offspring of AP. I like X (AP) → I consume X repeatedly → I habituate (RC).
  *   **Subject Change:** You have shifted from "what is this experience?" to "what does this experience do to my psychology over time?"

  **Is the "Raised Baseline" Objection Fatal?**
  Yes.
  FQ and AP do not suffer this problem. A FQ glow does not necessarily dim future glows. An AP "liking" does not necessarily raise the threshold for future liking (I can like water every day without needing wine to feel neutral).
  RC builds the "tolerance" mechanic into the definition of pleasure itself.
  *   *Counter-argument you might make:* Maybe the "upward nudge" is the value? Maybe welfare *is* expansion of capacity?
  *   *Rebuttal:* If so, you aren't a hedonist anymore; you're a capabilities theorist or a perfectionist. Hedonism is about *feeling states*, not *capacity expansion*. If the feeling is good *because* it expands capacity, the feeling is incidental.

  RC is fatal to hedonism because it makes the fundamental unit of value a loan shark: it gives you a hit of good now at the cost of charging interest on your future neutrality.

  ### 4. The Family Resemblance Escape Hatch

  You banned this unless I explain the functional role. Here is why it destroys the theory.

  If "pleasure" is a family-resemblance concept (no common thread, just overlapping similarities), then Hedonism becomes: *"A life goes well to the extent it contains [a loose cluster of disparate states]."*

  **The Functional Collapse:**
  1.  **Unfalsifiability:** If someone finds a counter-example (e.g., "I have this pleasure that doesn't seem good"), the hedonist says, "That's not part of the family." If they find a good thing that isn't pleasure, the hedonist says, "It resembles pleasure enough." The theory loses predictive power.
  2.  **Guidance:** Welfare theories are supposed to guide action. If I ask, "Should I pursue this intellectual proof or this warm bath?", and the theory says, "Both are pleasure-family members, but they share no common property that makes them good," the theory offers no metric for comparison. How do I sum them? How do I trade off intensity vs. duration if "intensity" means something different in the "proof" cluster than the "bath" cluster?
  3.  **The "Active Ingredient" Problem:** Hedonism claims to identify the *active ingredient* of value. If there is no common ingredient, there is no single source of value. You are left with a pluralism that is merely labeled "hedonism" for historical reasons.

  The word "pleasure" in hedonism must function as a **rigid designator for the currency of welfare**. If it's a loose cluster, there is no single currency, and the theory collapses into "things are good when they are good."

  ### 5. What Would Settle This?

  There is no introspective test. You and I can stare at our experiences of "solving a proof" and "drinking water" and disagree forever on whether there is a common "glow."

  **Empirical Settlement:**
  Neuroscience is the closest we have. Look at the dissociation between "liking" (opioid/cannabinoid systems in the nucleus accumbens) and "wanting" (dopamine systems).
  *   If RC were true, we would expect the neural signature of pleasure to be identical to the neural signature of **prediction error updating** (baseline shifting).
  *   Current data suggests they are distinct. You can have dopamine spikes (wanting/baseline shift) without opioid spikes (liking/pleasure). This empirically decouples RC from the phenomenology of enjoyment.
  *   This supports AP (linked to "liking" systems) over RC (linked to learning systems).

  **The Upstream Disagreement:**
  The real fight isn't about pleasure. It's about the **Metaphysics of Time in Welfare.**
  *   **Atomism:** Welfare is a sum of discrete moments. (Fits FQ and AP).
  *   **Narrative/Trajectory:** Welfare is a path, where the value of a moment depends on its relation to past/future states. (Fits RC).

  If you hold RC, you are implicitly arguing that welfare is trajectory-dependent. But standard hedonism is atomistic.
  **My Argument to You:**
  You should abandon RC not because it's uninteresting, but because it is a theory of *adaptation* masquerading as a theory of *value*. It explains why pleasure *fades*, not what pleasure *is*.

  **The Position to Hold:**
  Adopt a refined **Attitudinal View**, but tighten the screw:
  1.  **Taxonomy:** Pleasure is "in-the-moment intrinsic liking" (distinct from wanting or long-term valuation). This handles heterogeneity (you can like anything).
  2.  **Value:** This liking is good *because* it is the subjective endorsement of one's own existence at that moment.
  3.  **Recalibration as Bug, not Feature:** Acknowledge that pleasure *often* recalibrates (adaptation), but treat this as an unfortunate side-effect (the treadmill), not the definition. This saves hedonism from the "pleasure makes future worse" objection.

  **Final Push:**
  You invented RC because FQ felt too narrow and AP felt too thin. You wanted something dynamic. But you reached for a mechanism of *memory and expectation* rather than *experience*.
  Welfare is what happens *now*. Recalibration is what happens *next*.
  Don't confuse the bill with the meal. Pleasure is the meal. Recalibration is the bill coming due later. Hedonism is about the meal.

  Stick with Attitudinal Hedonism. It's the only one that keeps the currency spendable tomorrow.
