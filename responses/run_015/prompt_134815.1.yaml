answer: |-
  This is a sophisticated diagnosis of a well-known methodological rift. Your intuition that the debate is circular because it conflates distinct projects under a single label is correct. However, calling it merely "verbal" or "structural" understates the metaphysical stakes that drive the methodology. The stalemate persists not because the sides cannot understand each other, but because they are operating under incompatible norms of **explanatory adequacy**.

  Here is a structural diagnosis of the impasse, breaking down the positions, the sources of disagreement, and the prospects for resolution.

  ### 1. Core Positions: Asserted vs. Accused

  To understand the circularity, we must distinguish the *official* methodological stance from the *operative* ontological commitment perceived by the opposition.

  **The Heterophenomenologist (HP)**
  *   **Asserted:** We adopt a stance of methodological neutrality. We treat the subject's report as a text describing a "heterophenomenological world" (the world as the subject believes it to be). We do not deny the existence of inner experience, but we refuse to posit it as a *theoretical entity* until we have a third-person account of how the report was generated. Our goal is to explain the *judgment* of consciousness.
  *   **Accused of:** Covert eliminativism. By insisting that the heterophenomenological world is a "fiction" or a "theorist's construct" until validated by brain states, HPs effectively define phenomenal properties out of existence. If the method only validates what is third-personally accessible, and qualia are (by definition) not third-personally accessible, the method guarantees qualia will never be found. Critics argue HPs are not studying consciousness; they are studying the *behavioral outputs* of systems that claim to be conscious.

  **The Critic (Phenomenal Realist)**
  *   **Asserted:** First-person reports are not merely texts; they are expressions of a real, ontologically distinct state (phenomenal consciousness). A science of consciousness must explain why physical processes give rise to *this specific feeling*. If a model predicts the report but ignores the feeling, it has explained the speech act, not the consciousness.
  *   **Accused of:** Methodological dualism. Critics are charged with demanding that science accept "privileged access" as a brute fact, thereby insulating the phenomenon from physical explanation. By insisting that reports are evidence of *private properties* rather than *public behaviors*, critics allegedly prevent the integration of consciousness into the causal fabric of the physical world.

  ### 2. Classification of Disagreement

  The stalemate is not one thing; it is a layered composite of three distinct types of disagreement that are routinely conflated.

  **A. Verbal/Stipulative (The Definition of "Consciousness")**
  *   **HP:** Consciousness = The disposition to make certain reports/judgments about internal states (Access Consciousness).
  *   **Critic:** Consciousness = The subjective quality of the state itself, regardless of reportability (Phenomenal Consciousness).
  *   **Diagnosis:** When HPs say "We have explained consciousness," they mean "We have modeled the report." When Critics say "You haven't explained consciousness," they mean "You haven't accounted for the feel." They are using the same word for two different explananda. This is verbal, but it is not trivial; it is a fight over who owns the term.

  **B. Normative/Methodological (The Constraints of Science)**
  *   **HP:** Science requires public verification. Therefore, the *data* must be public (reports/behavior). Private experience is hypothesis, not data.
  *   **Critic:** Science requires explaining the target phenomenon. If the target is private experience, restricting data to public behavior is an arbitrary constraint that guarantees failure. First-person data must be treated as *real data*, not just behavior to be modeled.
  *   **Diagnosis:** This is a disagreement about the **norms of evidence**. HPs prioritize *intersubjective agreement* on data. Critics prioritize *phenomenological fidelity* of the explanandum.

  **C. Metaphysical/Explanatory (The Hard Problem)**
  *   **HP:** Once we explain the functional role of the report (why the system says "I see red"), there is nothing left to explain. The "residue" of qualia is an illusion generated by the system's self-model.
  *   **Critic:** Explaining the function of the report leaves out the *why it feels like something* aspect. A zombie could make the report. Explaining the report does not explain the experience.
  *   **Diagnosis:** This is the bedrock. HPs believe the "Hard Problem" is a cognitive illusion. Critics believe it is the central problem. No amount of methodological tweaking resolves this; it is a metaphysical split.

  ### 3. The Hidden Empirical and Formal Question

  You asked if there is a hidden empirical question. There is, and it concerns **Causal Closure and Explanatory Redundancy**.

  The debate hinges on a formal question about model sufficiency: **Can a model of report-generation be constructed that is causally complete without referencing phenomenal properties?**

  *   **If Yes (The HP Hope):** If we can build a neural/computational model that predicts first-person reports with 100% accuracy using only physical variables (activation patterns, signal noise, etc.), then phenomenal properties become **epiphenomenal** in the model. They do no causal work. The HP argues this shows they aren't needed for the science.
  *   **The Critic's Counter:** If the model is complete without qualia, then qualia are causally inert. If they are causally inert, why do we talk about them? If they *do* cause the reports, they *must* appear in the model. If they don't appear in the model, the model is incomplete regarding the *cause* of the report.

  **The Impasse:**
  The HP says: "The physical model explains the cause of the report. The 'feeling' is just what that cause looks like from the inside. It's not a separate cause."
  The Critic says: "If the feeling isn't a separate cause, you are denying the reality of the phenomenon. If it *is* a cause, show me where it enters the equation."

  This is where your hypothesis about **explanatory adequacy** is crucial. The HP believes explanatory adequacy is achieved when **predictive accuracy of behavior** is maximized. The Critic believes explanatory adequacy is achieved only when **ontological grounding of the experience** is provided.

  ### 4. Prospects for Progress

  Can this debate be moved? **Not by data alone, and not by conceptual clarification alone.**

  **Why a Formal Model Won't Resolve It**
  If your group produces a formal model of report-generation that makes no reference to qualia and predicts reports perfectly:
  *   **HPs** will declare victory: "See? No qualia needed to explain the data."
  *   **Critics** will declare it a category error: "You have built a perfect model of a philosophical zombie. You have explained the *simulation* of consciousness, not consciousness itself."
  *   **Result:** The Critics will argue you have changed the subject. The HPs will argue the Critics are demanding magic.

  **Why Conceptual Distinctions Won't Resolve It**
  Distinguishing "epistemic access" from "ontological commitment" (as you suggested) is the standard HP defense.
  *   **HP:** "We are committed only to the existence of the *belief* in qualia, not the qualia themselves."
  *   **Critic:** "The belief in qualia *is* a phenomenal state. You cannot have a belief about pain without the phenomenology of that belief. By bracketing the phenomenology, you bracket the belief."
  *   **Result:** The distinction collapses because the *content* of the report is phenomenal. You cannot separate the text from the experience that generated the text without assuming the experience is irrelevant.

  **What Would Count as Progress?**
  Progress requires **disaggregation**. The field must admit that "Consciousness Science" is currently two distinct projects:
  1.  **The Cognitive Science of Self-Reporting:** (HP domain). How do brains generate models of their own states that lead to verbal claims of experience?
  2.  **The Naturalization of Phenomenology:** (Critic domain). How do physical processes instantiate subjective feel?

  **Stagnation reveals a framing error.** The stagnation reveals that the field is trying to solve the **Hard Problem** (metaphysical) using the tools of the **Easy Problems** (functional/mechanistic).
  *   HPs try to solve the Hard Problem by arguing it doesn't exist (Illusionism).
  *   Critics try to solve the Hard Problem by demanding new physics or non-reductive accounts.
  *   **The Middle Ground (Predictive Processing/Active Inference):** Some progress is being made by frameworks that treat "experience" as a controlled hallucination used for error minimization. Here, the "heterophenomenological world" *is* the user interface the brain uses to navigate. This bridges the gap slightly by making the "fiction" functionally necessary. However, even here, the Hard Problem remains: why does error minimization *feel* like anything?

  ### 5. Honest Assessment

  The debate cannot be "won" in its current framing because it is a clash of **bedrock intuitions about what science is for.**

  *   For the HP, science is about **prediction and control** of public events. If you can't measure it, it's not science.
  *   For the Critic, science is about **truth and ontology** regarding the target phenomenon. If you leave out the target, it's not science *of that target*.

  **Recommendation for your Research Group:**
  Do not try to resolve the metaphysical debate within your methodology. Instead, **operationalize the split.**
  1.  Adopt HP methods for data collection (treat reports as texts to avoid naive realism).
  2.  Explicitly state that your *models* are currently models of **Access/Reporting**, not necessarily **Phenomenal Experience**.
  3.  Acknowledge that if/when a model perfectly predicts reports, the question "But is there experience?" remains an open metaphysical question, not a scientific one *yet*.

  **Conclusion:**
  The stagnation reveals that "Consciousness Science" is a placeholder name for a collision between **physicalist methodology** and **phenomenal ontology**. Until the field accepts that a complete physical model of report-generation might still leave the "what it is like" question unanswered (or vice versa), the circle will continue. The HP is right that we cannot start with private data; the Critic is right that ending with public data ignores the point. The impasse is the friction of trying to reduce the subjective to the objective without a bridge principle that both sides accept. Currently, no such bridge exists.
