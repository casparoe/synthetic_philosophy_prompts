answer: |-
  **The Scenario**

  Your foundation considers two grants: $100k for insecticide-treated bednets (Intervention A) versus $100k for a local tenants' union (Intervention B). For A, measurements are perfect: 50 malaria cases prevented annually, stable across contexts. For B, your committee also has perfect understanding: you know exactly how much community power and dignity it builds, and you know this value is substantial (roughly equivalent to 40 lives saved), though it resists quantification. The critical constraint is that the union's power is *constitutively fragile*: its effectiveness derives from its autonomy and adversarial stance toward external institutions. If the union perceives itself as a vehicle for your foundation's impact metrics—even internal ones used solely for allocation—it shifts from organizing to service delivery to satisfy the "investor," evaporating the very power you valued. You know this causal link perfectly. The measurements for A are noiseless; the valuation for B is accurate *ex ante*, but the act of treating B as a comparable investment vehicle within an optimization framework alters its nature.

  **The Analysis**

  **The Verdicts**
  *   **The EV Maximizer:** "We have two numbers: 50 lives (A) and 40 life-equivalents (B). Even accounting for uncertainty, 50 > 40. We fund A. To fund B would be to prioritize a lower expected value."
  *   **You:** "We fund B. Not because 40 > 50, but because the calculation itself is the error. By forcing B into the equation, we treat community power as a commodity. The correct decision procedure for goods like B is *not* optimization, but stewardship. If we use an EV framework, we make B impossible to fund effectively, even if we pick it."

  **The Feature: Constitutive Fragility**
  The load-bearing feature is that the unmeasured good is **non-invariant under instrumentalization**. It isn't just that we lack data (epistemic); it's that the *stance* of data-driven optimization changes the object (ontological). The good exists only where the optimizer's gaze is absent. This feature is 100% load-bearing; without it, you're just arguing about error bars.

  **The Ablation**
  Strip out the fragility. Suppose the union's power is hard to measure but *stable* regardless of your framework (e.g., hidden health benefits from reduced stress). Now, your critique collapses into: "You have imperfect information about B." The EA relative wins immediately: "Then put a wide probability distribution on B and maximize expected value over the distribution." Your objection becomes a request for better data, not a critique of the method.

  **The Counterattack**
  The EV maximizer's strongest reply is: "We model the fragility. We assign value to 'Union funded without metrics' and zero to 'Union funded with metrics.' We choose the former."
  Your rebuttal must be: "The damage isn't the metrics themselves; it's the *deliberative stance*. The moment you weigh their dignity against bednets to see which 'wins,' you have already instrumentalized them. You cannot model the insult of being modeled."

  **Flagging the Slide**
  You constantly slide between **"hard to measure"** (the number is hidden) and **"changes when measured"** (the number doesn't exist yet).
  *   *Hard to measure:* EV works (add uncertainty).
  *   *Changes when measured:* EV fails (the function being optimized is discontinuous).
  Your relatives assume you mean the first. You must insist on the second. If you can't prove the good *dissolves* under the EV gaze, you're just arguing for wider confidence intervals, which they will always win.
