      *   *Sentence 5:* "...and that his occasionalism was mainly a strategic rhetorical move to defend Ashʿarite theology rather than a serious metaphysical theory of causation."
          *   *Assessment:* **Controversial/Debatable.** Some scholars (e.g., Frank, Griffel) argue about the depth of his commitment. But calling it "mainly rhetorical" undermines the metaphysical work he does in the *Tahāfut* and *Iḥyāʾ*. It suggests he didn't believe it, which is a strong claim requiring evidence.

