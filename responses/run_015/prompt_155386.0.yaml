  **Overall Winner:** Nate is more right overall because he correctly identifies that queueing involves imposing costs on others without consent, which is a moral harm rather than a mere coordination failure, whereas Rosa's model cannot account for the injustice of theft of time.

  **The Missing Piece:** Both frame the queue as a social contract between peers, ignoring the **institutional property rights** that actually govern the space. The paid skip option reveals that wait-time is a commodity owned by the operator; cutting without paying steals revenue from the host and devalues the purchase of others, turning a social rudeness into a property violation. The visitor's obligation is not to "local culture" or "peer expectations," but to the **rules of the institution** they engage with, which mediate the moral duties between peers. This resolves the bribe case (the institution forbids it), the tipping case (the institution sets the wage structure), and the queue case (the institution defines whether time or money buys priority).
