answer: |-
  You are correct to suspect conflation. Your intuitive verdicts are tracking two distinct moral layers: the **ontology of the claim** (does this virtual thing command respect?) and the **ethics of the setback** (did this action damage the person?). Your tentative principle leans too heavily on the "project" (ethics) to explain "ownership" (ontology), which is why Case (9) (the unrendered castle) and Case (8) (the rollback) feel tense.

  Here is a refined framework designed for administrative application. It separates the *validity of the claim* from the *severity of the harm*.

  ### The Normative-Project Integrity Principle

  **Clause 1: The Standing Clause (Ontology)**
  *A virtual object or state commands moral protection if, and only if, it is the subject of a socially recognized claim within the community's normative framework, regardless of code, database status, or Terms of Service.*
  *   **Motivating Cases:** (1) & (2) (Rules define the claim), (9) (Database existence + claim = ownership), (10) (ToS is irrelevant to social norms).
  *   **Tension/Adjustment:** This clause accommodates (9) by treating ownership as a *reserved capacity for agency* rather than active use. However, it challenges your intuition on **(4)**. If the community norm values "originality" as a status symbol, off-server copying violates the Standing Clause because it dilutes the social recognition of the original claim, even if the object remains. **Recommendation:** Treat (4) as context-dependent. If your server culture values fame/credit, it is a harm. If it values only private enjoyment, it is not.

  **Clause 2: The Agency Clause (The Wrong)**
  *A wrong occurs when an agent non-consensually disrupts the owner's control, continuity, or intended experience regarding that claim, irrespective of eventual restoration.*
  *   **Motivating Cases:** (3) (Theft violates control; duplication violates status), (5) (VR gesture violates bodily agency), (8) (Rollback restores state but not continuity/experience).
  *   **Tension/Adjustment:** This clause strongly supports **(8)**. The harm is the *interruption*, not the *loss*. It also clarifies **(3)**: Theft is worse than duplication because theft severs *control* (fundamental to agency), whereas duplication only degrades *scarcity* (a feature of some projects). **Recommendation:** Hold firm on (8). The distress of the interruption is the harm.

  **Clause 3: The Investment Clause (The Severity)**
  *The severity of the harm is proportional to the irreversibility of the setback to the owner's investment (time, emotion, or economic stake), modulated by the background norm of accepted risk.*
  *   **Motivating Cases:** (1) vs (2) (Risk norms), (6) (Emotional investment > Code), (7) (Economic stake amplifies severity), (11) (Finite horizon reduces future investment value).
  *   **Tension/Adjustment:** This clause struggles slightly with **(7)**. If RMT is banned, why does it still feel "wrong" if not theft? Because it violates the *fairness of the competition* (a different project). **Recommendation:** In (7), if RMT is banned, classify it as "Cheating/Unfair Advantage" rather than "Theft." It harms the *integrity of the game*, not necessarily the *wallet*.

  ---

  ### Where You Should Overturn or Refine Your Verdicts

  1.  **Case (4) Off-Server Copying:** You currently call this "irritating but not a harm." Under Clause 1, if your server's normative framework includes "credit for creation," this *is* a harm to A's social standing. **Refinement:** If B claims authorship, it is a banable offense (fraud). If B just builds a copy privately, it is not.
  2.  **Case (7) Currency (No RMT):** You are unsure if this is theft. Under Clause 3, without real-world value, it is not theft of *assets*, but it is theft of *time-invested opportunity*. **Refinement:** Treat it as "Theft of Labor" rather than "Theft of Property." It warrants restitution, but perhaps not the same severity as real-money theft.
  3.  **Case (11) Server Shutdown:** You distrust your reaction that it is "less bad." Clause 3 validates your gut: it *is* less bad. The "Future Project" value is objectively lower when the timeline is truncated. **Refinement:** Do not doubt this. Griefing a dying world is less severe than griefing a nascent one, because the setback to future agency is smaller.

  ---

  ### Predictions for Unlisted Cases

  **1. The Abandoned Item**
  *Scenario:* An item the owner privately decided to abandon but has not deleted.
  *   **Prediction:** **No Harm.**
  *   **Reasoning:** Fails Clause 3 (Investment). The "ongoing project" has ended subjectively. Unless the item has social significance to *others* (e.g., a monument), the claim is dormant. Taking it is scavenging, not theft.

  **2. The AI Companion**
  *Scenario:* A companion creature with generated dialogue that remembers past conversations.
  *   **Prediction:** **Real Harm (Equivalent to Case 6).**
  *   **Reasoning:** Satisfies Clause 3 (Emotional Investment). The "reality" of the code is irrelevant (Case 6). The *relationship* is the project. Destroying the creature destroys the unique history of that relationship, which is irreversible (Clause 2).

  **3. Unseen Griefing**
  *Scenario:* B burns A's cathedral while A is offline; A never finds out before the server shuts down.
  *   **Prediction:** **Wrong Committed, but Harm is Debatable.**
  *   **Reasoning:** Clause 2 (Agency) is violated (control was broken). However, Clause 3 (Investment Setback) is complicated. If A never intended to visit again, the *experiential* setback is zero. However, the *potential* for agency was removed.
  *   **Admin Ruling:** Punish B for the *attempted violation of norms* (Clause 1), but recognize A suffered no *experiential distress*. The wrong is against the *server's order*, not just A.

  **4. The Paid Contractor Griefer**
  *Scenario:* A griefer turns out to be a contractor paid by the operator to make the world eventful.
  *   **Prediction:** **Severe Wrong (Betrayal).**
  *   **Reasoning:** This violates Clause 1 (Normative Framework). Players operate under the assumption that griefing is player-driven (Case 1 & 2). If the Admin secretly authorizes it, they have violated the social contract. It transforms the server from a "community" to a "theme park" without consent. This undermines the Standing of *all* claims.

  ---

  ### The Line Between Distinct Questions

  You asked where the line falls. It falls between **Jurisdiction** and **Experience**.

  1.  **Jurisdiction (The "Realness" Question):**
      *   *Question:* Does this virtual thing deserve protection?
      *   *Answer:* Yes, if the **Community Norms** say so (Clause 1).
      *   *Boundary:* This is where Case (10) lives. The Company's ToS is legal jurisdiction; the Server's Rules are moral jurisdiction. You enforce the latter. This is also where Case (9) lives. Existence in the database + Social Claim = Real Ownership.

  2.  **Experience (The "Harm" Question):**
      *   *Question:* Did this action damage the person?
      *   *Answer:* Yes, if it disrupted **Agency or Investment** (Clause 2 & 3).
      *   *Boundary:* This is where Case (8) lives. Even if Jurisdiction is restored (rollback), the Experience was violated. This is where Case (5) lives. The physical body wasn't touched, but the Embodied Experience was violated.

  **Summary for your Ban Policy:**
  Do not ban based on "loss of items" (which can be rolled back). Ban based on **"Violation of Normative Agency."**
  *   If the rules said "No Raiding," the act is a violation of Agency (Case 1).
  *   If the rules said "Raiding Allowed," the act is an exercise of Agency (Case 2).
  *   If the act breaks the "Social Contract" (like secret paid griefing), it is a violation of the Community itself (Case 4/Contractor).

  Your gut is right: the code doesn't matter, the ToS doesn't matter. What matters is the **promise you made to your friends about how they are allowed to exist in that space.**
