answer: |-
  **Exam Question: Moral Philosophy 405 – Virtue and Situation**

  **Question:**
  The situationist critique of virtue ethics argues that empirical evidence demonstrates a lack of cross-situational consistency in behavior, thereby undermining the existence of global character traits. In response, some defenders propose a "domain-indexed" conception of virtue, wherein traits like courage or honesty are stable only within specific spheres of activity (e.g., professional or domestic) rather than across an agent's entire life.

  Write an essay evaluating whether this domain-indexed retreat successfully preserves Aristotelian virtue ethics or whether it effectively collapses into a form of situationism that renders global moral assessment incoherent. In your analysis, you must:
  1.  Distinguish between trait *possession* and trait *expression*.
  2.  Analyze how *phronesis* (practical wisdom) functions when practical domains are narrowly circumscribed.
  3.  Address whether moral evaluation (praise and blame) remains meaningful if an agent displays a virtue in one domain but its corresponding vice in another.

  ***

  **Model Answer**

  The situationist challenge, advanced by philosophers such as John Doris and Gilbert Harman, posits that if character traits exist, they should predict behavior across diverse situations. Empirical data suggesting behavior is largely situation-dependent threatens the Aristotelian view of the unified moral agent. The "domain-indexed" defense attempts to salvage virtue ethics by conceding that traits are not global but arguing they remain robust within specific contexts. Evaluating this defense requires determining whether it preserves the normative core of virtue ethics or merely relabels situationism.

  To begin, one must distinguish between trait possession and trait expression. A globalist conception assumes that possessing courage entails a high probability of expressing courage in any relevant scenario. The domain-indexed theorist argues that possession is compatible with fragmented expression. An agent may possess "professional courage" without possessing "physical courage." This distinction saves the psychological reality of traits from situationist data, which often shows inconsistency across *disparate* situations (e.g., military combat vs. social conformity). If virtues are locally stable, the situationist data regarding cross-context inconsistency does not disprove the existence of traits, only their global scope. However, this move risks reducing virtues to mere habits or skills specific to a context, stripping them of their status as excellences of the *person*.

  This leads to the problem of *phronesis*. For Aristotle, practical wisdom is the intellectual virtue that unifies the moral virtues; one cannot truly possess a moral virtue without *phronesis*, and *phronesis* implies a correct understanding of the good life as a whole. If virtues are domain-indexed, *phronesis* becomes fragmented. An agent might exhibit practical wisdom in navigating corporate ethics but lack it entirely in family life. This fragmentation undermines the Aristotelian claim that virtue is a state of the whole soul. If *phronesis* cannot integrate values across domains, the agent lacks a unified conception of *eudaimonia*. Consequently, the domain-indexed retreat threatens to turn virtue ethics into a collection of context-specific competencies rather than a theory of human flourishing. Without a unified *phronesis*, the "virtues" are merely efficient means to local ends, not constitutive elements of a good life.

  Finally, we must consider the coherence of moral evaluation. Virtue ethics traditionally allows for global praise or blame; we call someone "a courageous person" or "a vicious person." If virtues are domain-indexed, global attribution becomes problematic. Can we praise an agent as "good" if they are honest in business but deceitful in marriage? If the answer is no, then moral evaluation becomes hyper-localized. We can only praise the "business-agent" or the "spouse-agent," not the person. This fragmentation aligns closely with situationism, which denies robust character attribution. If we cannot assess the agent globally, the normative force of virtue ethics diminishes. We lose the ability to offer moral education aimed at the whole person, focusing instead on behavioral training for specific contexts.

  However, the domain-indexed view does not necessarily collapse into hard situationism if it allows for the *integration* of domains. If the agent recognizes the tension between their professional honesty and domestic deceit, and strives to harmonize them, *phronesis* can operate as a bridging mechanism. The defense holds only if domain-indexing is a temporary description of moral development rather than a metaphysical limit on trait structure.

  In conclusion, the domain-indexed retreat preserves the psychological plausibility of traits against situationist data but risks abandoning the normative unity central to Aristotelianism. If *phronesis* is fragmented and moral evaluation is restricted to local contexts, the theory loses its account of human flourishing. To succeed, the defender must argue that local stability is a stepping stone toward global integration, rather than a permanent fragmentation of the moral self. Otherwise, the retreat saves the traits only by sacrificing the agent.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **1. Understanding the Situationist Challenge & Domain-Indexed Response (20 Marks)**
  *   **A (17-20):** Clearly articulates that situationism attacks cross-situational consistency, not local reliability. Explains the domain-indexed retreat as a modification of trait scope, not a denial of traits.
  *   **B (13-16):** Defines situationism and the retreat correctly but treats them as binary opposites without nuance.
  *   **C (0-12):** Confuses situationism with general moral skepticism or fails to define domain-indexing.
  *   *Common Error:* Claiming situationists deny *any* behavioral patterns exist (they deny *global* patterns).

  **2. Distinction Between Trait Possession and Expression (20 Marks)**
  *   **A (17-20):** Explicitly argues that possession does not necessitate universal expression. Uses this to deflect the empirical critique while noting the risk of reducing virtues to habits.
  *   **B (13-16):** Mentions the distinction but fails to explain how it shields virtue ethics from empirical counter-evidence.
  *   **C (0-12):** Treats possession and expression as identical (i.e., "if you don't act brave, you aren't brave").
  *   *Common Error:* Assuming that if behavior varies, the trait cannot exist at all.

  **3. Analysis of *Phronesis* and Domain Fragmentation (25 Marks)**
  *   **A (21-25):** Identifies that Aristotelian *phronesis* requires a unified conception of the good. Argues that domain-specific wisdom threatens this unity, potentially reducing virtue to technical skill.
  *   **B (16-20):** Describes *phronesis* as practical reasoning but fails to connect its unity to the problem of fragmented domains.
  *   **C (0-15):** Omits *phronesis* or treats it as simple intelligence unrelated to moral unity.
  *   *Common Error:* Treating *phronesis* as a skill that can be fully compartmentalized without loss of moral status.

  **4. Normative Implications for Moral Evaluation (25 Marks)**
  *   **A (21-25):** Evaluates whether praise/blame makes sense for fragmented agents. Argues that without global attribution, virtue ethics loses its normative force regarding *eudaimonia*.
  *   **B (16-20):** States that evaluation becomes difficult but does not explain *why* this undermines the theory specifically (vs. just making it harder).
  *   **C (0-15):** Claims moral evaluation remains exactly the same regardless of domain fragmentation.
  *   *Common Error:* Ignoring the link between character attribution and the purpose of virtue ethics (flourishing).

  **5. Argumentative Coherence and Original Synthesis (10 Marks)**
  *   **A (9-10):** Constructs an original argument on whether the retreat saves or abandons the theory (e.g., suggesting integration is necessary). Essay flows logically.
  *   **B (7-8):** Answer is organized but relies on summarizing the required points without synthesizing a final verdict.
  *   **C (0-6):** Disorganized or contradictory arguments.
  *   *Common Error:* Sitting on the fence without a concluding thesis regarding the success of the retreat.

  **Grade Boundaries:**
  *   **A (80-100):** Demonstrates sophisticated grasp of the tension; synthesizes possession, *phronesis*, and evaluation into a coherent verdict.
  *   **B (65-79):** Competent understanding of all three required elements but lacks deep synthesis or nuanced evaluation of the collapse into situationism.
  *   **C (50-64):** Addresses the prompt but contains significant philosophical errors or omissions (e.g., missing *phronesis*).
  *   **D/F (0-49):** Fails to address the specific conceptual tension or misunderstands the core concepts.
