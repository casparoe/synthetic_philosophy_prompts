answer: |-
  **Joint Statement on Persistence and Temporal Ontology**

  **1. Agreed Substantive Claims**
  We, the undersigned, agree to the following substantive claims regarding persistence, change, and ontology, assuming eternalism (the equal reality of past, present, and future times):

  1.  **Real Change:** Objects genuinely possess incompatible qualitative properties at different times (e.g., being bent at $t_1$ and straight at $t_2$); this variation is not illusory.
  2.  **Non-Contradiction:** No account of persistence may entail that a single object bears incompatible properties simpliciter (without temporal qualification) at the same time.
  3.  **Modal Distinction:** Coincident objects (e.g., a statue and the clay constituting it) are distinct because they differ in modal properties (persistence conditions), proving that identity is not determined solely by spatiotemporal location and matter at a time.
  4.  **Fission Limits:** In cases of symmetric fission, facts about numerical identity do not supervene entirely on physical continuity and qualitative similarity; there is no physical fact that forces identity to follow one branch over the other.
  5.  **Explanatory Goal:** An account of persistence must provide truthmakers for claims of the form "$O$ is $F$ at $t$" without reducing the object $O$ to a mere logical construct of its temporal stages.

  **2. Position Restatements**
  **Endurantist:** A persisting object is strictly identical across all times at which it exists. At any time $t$ where the object exists, the *entire* object is located at $t$. Location at a time is a primitive relation, not analyzable in terms of parts. When we say "$O$ is $F$ at $t$," we assert a primitive relation of instantiation between the wholly present object, the property, and the time.

  **Perdurantist:** A persisting object is a four-dimensional spacetime worm composed of distinct temporal parts. At any time $t$, only a temporal part of the object is located at $t$. When we say "$O$ is $F$ at $t$," we assert that the temporal part of $O$ located at $t$ possesses the property $F$ simpliciter. Identity across time is analogous to identity across space: distinct parts constitute one whole.

  **3. Residual Disagreements Table**

  | Disagreement | Endurantist Formulation | Perdurantist Formulation | Crux | Accepted Case/Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Instantiation** | "$O$ is $F$ at $t$" is primitive; $O$ bears $F$ directly relative to $t$. | "$O$ is $F$ at $t$" is analyzed; $O$'s $t$-part bears $F$ simpliciter. | Can primitive temporal instantiation avoid contradiction without temporal parts? | **Simple Change:** An object changes color. | **End:** Yes, primitive relations block contradiction.<br>**Per:** No, only parts resolve the contradiction of incompatible properties. |
  | **Splicing (Case A)** | $O$ survives if the causal history remains continuous, regardless of segment substitution. | $O$ is the sum of its segments; swapping segments creates a distinct 4D whole. | Does identity rely on causal continuity or mereological summation? | **Splicing:** $O$'s $t_2$–$t_3$ segment is swapped with $O^*$'s. | **End:** $O$ survives; the swap is undetectable and causally continuous.<br>**Per:** $O$ ceases; the 4D worm is numerically distinct if temporal parts differ. |
  | **Physics (Case B)** | Privileged simultaneity clarifies "wholly present," strengthening the view. | Privileged simultaneity is irrelevant; 4D worms exist regardless of slicing. | Does persistence depend on the structure of time? | **Successor Physics:** Restored global simultaneity. | **End:** Helps; makes "wholly present" physically precise.<br>**Per:** Neutral; metaphysical parthood is independent of physical slicing. |
  | **Parsimony** | Perdurantism overpopulates the world with transient temporal parts. | Endurantism overpopulates the world with primitive instantiation relations. | What is the greater ontological cost: entities or relations? | **General Ontology:** Counting basic existents. | **End:** Relations are cheaper than concrete temporal parts.<br>**Per:** Primitive relations are mysterious; parts are familiar entities. |

  **4. Note on Merely Verbal Disputes**
  We acknowledge that portions of our historical dispute were merely verbal, stemming from divergent definitions of "part" and "object." When the perdurantist says "everything has temporal parts," they define "part" such that any extended entity mereologically decomposes along its dimensions. The endurantist denies this, reserving "part" for spatial or functional components. This is verbal because both agree on the underlying spacetime distribution of matter; they disagree only on whether temporal extension *entails* mereological decomposition. Additionally, disputes over "wholly present" were verbal when used merely to denote "located at a time" without committing to the primitive nature of that location. We have now clarified that the endurantist treats location as primitive, while the perdurantist treats it as derivative of parthood.

  Bottom line: The irreducible disagreement is whether an object's being located at a time is a primitive relation of the whole object or a derivative fact about the object's temporal parts.
