answer: |-
  This is a sophisticated philosophical dispute that hinges on the precise boundaries of Quine's thesis. Your intuition that the argument "moves too fast" is correct, but the reasons are technical. Your friend is treating the decipherment of hieroglyphs as a instance of *radical translation*, whereas Quine's indeterminacy thesis is specifically constructed to exclude the kinds of evidence that made decipherment possible.

  Here is the careful mapping you requested, analyzing the theory, the case, and the points of friction.

  ### 1. The Theory Side: What Quine Actually Claims

  To evaluate the counterexample, we must isolate the specific constraints of Quine's thought experiment.

  *   **Radical Translation:** This is the scenario where a linguist encounters a completely unknown language with **no prior dictionaries, no historical connections, and no shared cultural context.** The only data available is the **observable behavior** of native speakers (assent/dissent) correlated with **observable stimuli** (e.g., a rabbit running by).
  *   **The Evidence Base:** For Quine, the "facts" are strictly *stimulus meanings*. He explicitly excludes etymological data, historical lineage, or access to the speaker's internal mental states. If you cannot point to a rabbit and get assent, you do not have evidence for "rabbit."
  *   **Indeterminacy of Translation:** Quine claims that multiple translation manuals can be constructed that are **equally compatible with all possible behavioral evidence** but are mutually incompatible. (e.g., Manual A translates *gavagai* as "rabbit"; Manual B translates it as "undetached rabbit part").
  *   **Inscrutability of Reference:** This is the deeper claim. Even if we agree on the sentences (the "truth conditions"), we cannot determine what the terms *refer* to. There is "no fact of the matter" about whether a word refers to an object, a temporal stage, or a part of an object.
  *   **Prediction:** Quine admits that rival manuals can predict future *behavior* (assent/dissent) equally well. Successful prediction does not prove one manual captures the "real meaning," because meaning (for Quine) is not a hidden mental fact but a disposition to behave.

  ### 2. The Case Side: The Hieroglyph Decipherment

  Now we map the actual historical episode against Quine's constraints.

  *   **The Evidence Base:** The decipherers had vastly more than behavioral stimuli.
      *   **Parallel Text:** The Rosetta Stone provided a direct mapping of three scripts for the *same* content.
      *   **Genetic Link:** Champollion used Coptic. This is crucial. Coptic is a descendant of Egyptian. This provides **etymological and phonological evidence** that Quine's radical translator is forbidden from using.
      *   **Proper Names:** Cartouches (Ptolemy, Cleopatra) allowed the isolation of phonetic values based on the assumption that foreign names preserve sound across languages.
      *   **Contextual Pictures:** The inscriptions were often accompanied by reliefs depicting the events described, offering ostensive definitions Quine would envy.
  *   **The Success:** The resulting grammar allowed scholars to read fresh inscriptions and make historical sense of them (predicting the distribution of signs in new contexts).
  *   **The Assumption:** The decipherers operated on the realist assumption that there **was** a fact of the matter about what the scribes meant, and that the script was designed to convey that meaning.

  ### 3. Mapping the Conflict: Where the Friend's Argument Breaks

  Your friend's argument fails because it conflates **underdetermination of scientific theory** with **indeterminacy of translation**, and it ignores the specific constraints of the "radical" scenario.

  **A. The Category Error: Decipherment $\neq$ Radical Translation**
  Quine's thesis applies to translating a *living* language where the only access is *current behavior*.
  *   **The Break:** Hieroglyphic decipherment is not radical translation; it is **cryptanalysis combined with historical linguistics.**
  *   **Why it matters:** Quine's indeterminacy arises because behavioral evidence is too thin to fix reference. The decipherers had "thick" evidence (Coptic lineage, bilingual text). Quine would concede that if you allow historical connections and parallel texts, the constraints tighten immensely. But that doesn't refute the thesis; it just changes the premises. The thesis is about what happens when you *don't* have the Rosetta Stone or Coptic.

  **B. Prediction and the "Gerrymandered Rival"**
  Your friend argues that successful prediction on fresh inscriptions breaks the tie between rival manuals.
  *   **Quine's Rebuttal:** Quine explicitly grants that rival manuals can predict all future observations.
  *   **The Analysis:** Suppose Manual A says a sign means "Ox." Manual B says it means "Undetached Ox Part." Both manuals will predict exactly where the sign appears in future texts because the distribution of "Ox" and "Undetached Ox Part" is identical in the physical world.
  *   **The Failure:** The fact that Champollion's grammar worked proves his *syntax and phonology* were correct. It does not prove his *ontology* was unique. We still do not know, strictly speaking, if a specific sign refers to the *sound*, the *object*, or the *concept*. The predictive success confirms the structural mapping, not the metaphysical uniqueness of the reference.

  **C. Inscrutability Remains**
  Even with the Rosetta Stone, Quine's specific claim about reference holds.
  *   **Example:** When Champollion identified a sign as "Ox" (based on Coptic *oh*), Quine would ask: Does the sign refer to the animal, the meat, the spirit of the ox, or a temporal stage of the ox?
  *   **The Evidence:** The bilingual text tells us the Greek word for "Ox." But the Greek word *also* suffers from inscrutability of reference. You have fixed the translation of the *word* to another *word*, but you have not fixed the *reference* to the world. The chain of reference remains suspended.

  ### 4. What the Theory Predicts and Illuminates

  Despite the category error, Quine's theory actually illuminates parts of the decipherment episode that your friend overlooks.

  *   **The Long Failure (Purely Ideographic Assumption):** For centuries, scholars assumed hieroglyphs were purely symbolic/ideographic. Quine's thesis illuminates why this was a stable, albeit wrong, manual. It fit the "evidence" (pictures matching concepts) available at the time. It took a shift in hypothesis (Young/Champollion realizing phonetic elements existed) to break the deadlock. This mirrors Quine's view that translation is a matter of constructing a workable manual, not finding a pre-existing truth.
  *   **Dependence on Assumptions:** Champollion had to *assume* foreign names preserve sounds. This is a theoretical posit, not an observed behavior. Quine would argue this confirms that translation relies on "analytical hypotheses" that go beyond the evidence. We *imposed* phonetic continuity to make the system work.
  *   **Role of Coptic:** The dependence on Coptic confirms Quine's suspicion that we cannot translate in a vacuum. We lean on the "background language" (English/Coptic) to project our own ontological categories onto the target language.

  ### 5. What the Theory Misdescribes (or is Silent On)

  Here is where you must concede ground to your friend, or rather, acknowledge the limits of Quine's scope.

  *   **Silence on Dead Languages:** Quine's theory is genuinely silent on dead languages with no speakers. *Word and Object* is about the relationship between stimulus and meaning. Without a speaker to provide stimulus (assent/dissent), the "radical translation" scenario cannot be set up. Decipherment is a different epistemological problem (decoding a system vs. interpreting behavior).
  *   **Constraint of Writing Systems:** Quine underestimates the constraints imposed by the medium. A writing system *must* be learnable and consistent to function as communication. This physical/social constraint reduces the space of possible "manuals" much more than speech does. A gerrymandered manual that works for speech might fail to produce a consistent orthography.
  *   **Historical Truth:** Quine treats meaning as ahistorical. Decipherment proves that **historical causality matters.** The sign means "Ox" *because* the scribe intended it to mean "Ox" and learned it from a teacher who meant "Ox." Quine rejects "intentions" as evidence. If you accept intentions/historical lineage as evidence (which historians do), indeterminacy collapses. If you reject them (as Quine does), it remains.

  ### 6. Implications for Living Languages

  Does this tell us anything about translating languages people still speak?

  *   **The "Rosetta" Effect:** In real-world translation of living languages, we rarely operate in Quine's "radical" vacuum. We have dictionaries, cultural exchange, and shared history. The hieroglyph case suggests that **once you allow historical and structural constraints, determinacy increases.** Your friend is right that *practical* translation is far more determinate than Quine's *philosophical* thought experiment suggests.
  *   **The Residual Gap:** However, the hieroglyph case does not solve the "Gavagai" problem for living speech. Even with a dictionary, if I point to a rabbit, I cannot prove to you that I mean "rabbit" and not "rabbit stage." The decipherment fixed the *phonetic values* and the *grammar*, but the *ontology* (what the words carve out in reality) remains as opaque as ever.

  ### Conclusion: Locating the Failure

  Your friend's argument fails at the step where she claims **successful prediction breaks the tie between rival manuals.**

  1.  **Prediction of Text $\neq$ Determination of Reference:** Champollion's manual predicted where signs would appear. It did not (and could not) prove that the signs referred to objects rather than concepts, stages, or sounds. The "meaning" remains underdetermined even if the "decoding" is unique.
  2.  **Evidence Base Mismatch:** She treats the Rosetta Stone as "more evidence" within Quine's framework. It is actually **different evidence** (historical/etymological vs. behavioral). Quine's thesis holds *given his constraints*. Changing the constraints (by adding Coptic) doesn't refute the thesis; it just creates a different scenario where the thesis doesn't apply.
  3.  **The "Fact of the Matter":** The decipherment assumes there is a fact of the matter (what the scribe wrote). Quine denies there is a fact of the matter (even for the scribe). The success of decipherment validates the *realist* approach to history, but it does not validate the *realist* approach to meaning in the philosophical sense Quine attacks.

  **Verdict:** The decipherment of hieroglyphs refutes the idea that *decoding a script* is indeterminate. It does not refute Quine's claim that *translating meaning* (reference/ontology) is indeterminate, because the evidence used (Coptic, history) is evidence Quine explicitly ruled out as irrelevant to "meaning." Your friend has won a battle about cryptanalysis, but she has not won the war about the philosophy of language.
