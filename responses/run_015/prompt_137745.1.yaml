  8.  *(Self-Correction during drafting)*: Make sure to address the "prediction on fresh inscriptions" point specifically. Does that break the tie? Quine would say a gerrymandered manual could also predict behavior (or text occurrence) without matching "meaning."

  9.  *(Final Review)*: Does this answer the user's specific doubt ("argument moves too fast")? Yes, by showing the category error between decipherment and radical translation.

