      *   **Conclusion:** Summarize. The friend proves *decipherment is determinate*, not that *translation is determinate*.

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to make sure I don't just say "Quine is right" or "Friend is right." I need to show *why* the analogy fails.
      *   *Nuance:* Quine distinguishes between *underdetermination of scientific theory* (which can be resolved by more evidence) and *indeterminacy of translation* (which cannot be resolved even by all possible evidence). The friend treats decipherment like a scientific theory problem (more evidence = one solution). Quine would say even with the Rosetta stone, reference is inscrutable.
