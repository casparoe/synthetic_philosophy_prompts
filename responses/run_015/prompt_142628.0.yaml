answer: |-
  Libya confirms the *risk* of escalation logic inherent in commitment-device theories but breaks the determinism; regime change was a political choice by specific allies, not a structural necessity of UNSC 1973. The Arab League request and UNSC 1973 created an ambiguous mandate ("protect civilians" vs. "no occupation"), which allowed the shift from a no-fly zone to close air support (CAS) for rebels under the guise of neutralizing ground threats. However, the commitment-device framing explains the tactical slide—once NATO air power halted Qaddafi's advance on Benghazi, his remaining capacity became the primary civilian threat, making his removal functionally synonymous with protection—but it misdescribes the strategic options. NATO could have enforced a static no-fly zone while allowing a negotiated stalemate; the push to Tripoli was driven by French and British political will, not just operational logic.

  The framing holds where it identifies the impossibility of separating Qaddafi's command from civilian safety given his rhetoric, validating the escalation from Benghazi to Sirte. It breaks when accounting for Qatar and UAE supplying arms outside NATO command, which demonstrates that regime change was accelerated by external proxies bypassing the UN arms embargo, not solely by NATO's internal escalation ladder. This suggests the theory anticipates mandate creep but fails to account for actor agency; the "lock" was not the UN resolution but the lack of diplomatic off-ramps and the specific maximization of commitment by Sarkozy and Cameron. Consequently, Libya was a case the theory anticipated in mechanism (protection morphing into offense) but oversimplified in causality (ignoring voluntary over-compliance).

  I would change my mind if declassified communications proved France and the UK explicitly planned regime change *before* UNSC 1973 passed, indicating the mandate was merely cover rather than a slippery slope encountered during operations. The part of my reasoning I am least sure about is the counterfactual civilian cost: whether a frozen conflict at Sirte would have resulted in higher long-term casualties than the post-Qaddafi vacuum, which determines if the escalation was actually a failure of protection or a failure of state-building.
