answer: |-
  Dear Colleagues,

  I am writing this to clarify the foundational requirements for our state's determination-of-death statute before we debate specific criteria. We need a list of desiderata that functions as a legal and bedside tool, not a metaphysical treatise. The first requirement is irreversibility, and the case behind this is the patient with profound hypothermia, drowning, or overdose where circulation and brain function stop and then come back. This is a requirement rather than a preference because if the condition can be spontaneously reversed or medically resuscitated, the patient is not dead, and declaring them so would be homicide. The second requirement is organismic integration, and the case behind this is the patient with a destroyed brain on a ventilator, warm and perfused with a beating heart, who may heal wounds or carry a pregnancy. This is a requirement because the law must distinguish between a living body being artificially supported and a corpse being mechanically perfused, otherwise we cannot justify ceasing treatment or harvesting organs without violating the prohibition on killing. The third requirement is decidability, and the consideration behind this is that the criterion must be actionable within hours by clinicians who are not philosophers. This is a requirement because a legal standard that cannot be applied consistently at the bedside creates liability for doctors and uncertainty for families. The fourth requirement is universality, and the case behind this includes infants born with a brainstem and almost no forebrain versus adults in a permanent vegetative state who sleep and wake but lack awareness. This is a requirement because the statute applies to all citizens, and having different definitions of death for different ages or conditions undermines the equal protection of the law.

  Regarding the stipulation about perfusion technology that could keep brain tissue metabolically alive and restore electrical activity hours after circulation stops, if we define irreversible as won't be reversed because we choose not to reverse it, the desideratum of irreversibility collapses into a normative decision about treatment obligation rather than a biological fact. It shifts the question from can this function be restored to should we attempt to restore it, which conflates death determination with futility judgments. This means the criterion ceases to be about the status of the patient and becomes about the resources or intentions of the medical team, which is unacceptable for a legal definition of death.

  On the matter of the dead donor rule, this is a separate moral constraint that has been smuggled into a definitional question. It is moral rather than definitional because the rule states that one must not kill a patient to procure organs, which presupposes a definition of death to determine when killing becomes permissible retrieval. If we build the dead donor rule into the definition of death, we risk circular reasoning where we define death as whatever state allows organ procurement without violating the rule, rather than identifying the biological reality that triggers the rule.

  We must also maintain several distinctions that the account cannot collapse. The distinction between death of the organism versus death of the person is highlighted by the patient in a permanent vegetative state, where the organism persists but personhood may be argued to be lost, and we must not conflate biological death with loss of social identity. The distinction between criterion versus test is highlighted by the apnea test, which is a method of measuring the absence of brainstem function, whereas the criterion is the actual absence of that function, and confusing the two leads to errors when tests are unavailable or inconclusive. The distinction between determining that someone has died versus deciding that more treatment is pointless is highlighted by the locked-in syndrome patient, who is fully alive but may appear to have no motor function, and treating futility as death would justify euthanasia by declaration. The distinction between whole brain versus brainstem versus higher brain is highlighted by the infant born with a brainstem and no forebrain, where a higher brain standard might declare death while a brainstem standard declares life, and the law must choose one locus of function. The distinction regarding whether one uniform criterion has to cover everybody is highlighted by donation after circulatory determination of death, where wait times might differ for infants versus adults, suggesting that while the principle is uniform, the operational thresholds may need physiological adjustment.

  Now I must mark which of these are non-negotiable and which are preferences. Irreversibility is non-negotiable because without it we risk declaring living people dead. Decidability is non-negotiable because a law that cannot be applied is useless. Organismic integration is non-negotiable because it grounds the distinction between a body and a person in biology. Universality is a preference of one camp, specifically those who want a single biological marker for all ages, whereas another camp prefers physiological specificity. I must flag that Universality and Decidability cannot be satisfied together if the physiological markers for death differ significantly between neonates and adults, forcing us to choose between a single rule that fails in edge cases or multiple rules that complicate the law. The single requirement that knocks out the most candidate accounts is Irreversibility, specifically when interpreted strictly as biological impossibility rather than normative permanence, because it invalidates any criterion that relies on current medical practice rather than inherent physiological capacity.

  Finally, here is how the usual families of accounts handle these desiderata. The whole brain standard buys off the integration desideratum by redefining organismic unity as total neurological function, ignoring that somatic integration can persist without the brain. The brainstem standard buys off the consciousness desideratum by redefining life as spontaneous breathing drive, effectively separating biological life from awareness. The higher brain standard buys off the organismic desideratum by redefining death as the loss of personhood, which collapses the distinction between biological death and moral status. The circulatory standard buys off the irreversibility desideratum by redefining irreversible as permanent, equating the decision not to resuscitate with the biological inability to resuscitate.
