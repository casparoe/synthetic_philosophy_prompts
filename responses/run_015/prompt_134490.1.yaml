prompt: |-
  Hey — sorry for the length, but I'm stuck and I'd rather get this down properly than keep going in circles in committee.

  I sit on a hospital ethics committee and we've been asked to comment on a draft revision of our state's determination-of-death statute, and I've realised that before we argue about which criterion to adopt, I want to know what we should even be asking of one. So: write me the desiderata for an account of death. The purpose is fixed and narrow, and that's deliberate — it has to work as a legal and bedside criterion, one that tells a clinician when she may switch off the ventilator and when a procurement team may begin, in a case where the family has already consented, and it has to be decidable within hours by people who aren't philosophers. Not a metaphysical theory of what death is in the abstract; a criterion that could actually be written into law and applied on a ward.

  For each desideratum give me the case or consideration behind it, and say why it's a requirement rather than a preference. The cases I want covered: the patient with a destroyed brain on a ventilator, warm, perfused, heart beating — assume for the sake of the list that some bodies declared dead on neurological grounds have kept circulation going, healed wounds, regulated their temperature, even carried a pregnancy for weeks, and say what has died there; donation after circulatory determination of death, where the heart stops, everyone waits a few minutes, and then organs are taken; infants born with a brainstem and almost no forebrain; the patient in a permanent vegetative state who sleeps and wakes and has reflexes but nothing you'd call awareness; and the mimics — profound hypothermia, drowning, overdose — where circulation and brain function stop and then come back, which is why I keep thinking the requirement has to be stated in terms of irreversibility rather than arrest.

  Here's the bit I think is going to do the real work, and it's a stipulation, not a fact you need to look up: suppose a perfusion technology becomes available that can keep brain tissue metabolically alive, and restore some spontaneous electrical activity, for hours after circulation has stopped. Nobody gets plugged into it, because there's no point and it's not approved. If "irreversible" has quietly come to mean "won't be reversed because we've chosen not to reverse it," what happens to that desideratum, and does it collapse into something else?

  Two more things I want from you. One of our members keeps insisting that any acceptable account must preserve the dead donor rule, and I suspect that's a separate moral constraint that got smuggled into a definitional question — tell me which it is and why. And I want the distinctions the account can't collapse, with a case for each: death of the organism versus death of the person, criterion versus test, determining that someone has died versus deciding that more treatment is pointless, whole brain versus brainstem versus higher brain, and whether one uniform criterion has to cover everybody.

  Then, since this is the part I actually have to defend in the room: mark which desiderata are non-negotiable and which are just what one camp happens to want; flag any pair that you think can't be satisfied together, because if the list itself is unsatisfiable I'd rather know now than discover it mid-meeting; and name the single requirement that knocks out the most candidate accounts. Only after all that, two or three sentences each on how the usual families do — whole brain, brainstem, higher brain, circulatory — and where each of them quietly buys off a desideratum by redefining it.

  And please, no headings, no bullets, no bold, no table — just continuous prose, like an email. I'm pasting this straight into our notes and the formatting always comes out mangled.
