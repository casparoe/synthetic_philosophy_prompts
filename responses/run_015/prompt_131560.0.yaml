answer: |-
  The growth-optimal framework is not universally normative because it collapses when agents can pool risk to access ensemble averages or when finite horizons make probability-of-success the true objective, restricting its validity to isolated, immortal reinvestors with logarithmic utility.

  ### Fatal Objections (The Committed Growth-Maximizer Must Concede)

  **1. The Finite-Horizon/Target Mismatch**
  This is the mathematical kill shot. Kelly maximizes the *rate* of growth as $t \to \infty$. It does not maximize the probability of exceeding a specific wealth threshold $W^*$ by a specific time $T$. If your goal is "clear \$50k debt in 5 years" or "retire with \$2M by age 65," the Kelly criterion is often suboptimal.
  *   **Why it moves you:** If you are below the target trajectory, Kelly tells you to bet "safely" to preserve growth, but you actually need variance to catch up (bold play). If you are above, Kelly tells you to keep compounding, but you should de-risk to lock in the win. Maximizing $E[\log(W_T)]$ is not the same as maximizing $P(W_T > \text{Goal})$. A growth-maximizer must concede that Kelly is only optimal for the specific utility function $U(W) = \log(W)$ over an infinite horizon.

  **2. Parameter Uncertainty and Edge Estimation**
  Kelly assumes you know the true probabilities and payoffs. In reality, you estimate them. The growth function is asymmetric around estimation error: underestimating edge costs you linear growth, but overestimating edge by a factor of 2 reduces growth to zero, and beyond that leads to certain ruin.
  *   **Why it moves you:** Since no real agent knows their edge with perfect precision, "Full Kelly" is practically unstable. The optimal strategy under parameter uncertainty is mathematically proven to be Fractional Kelly. This isn't just "risk aversion"; it's Bayesian robustness. A growth-maximizer must concede that *estimated* Kelly is not growth-optimal; only *true* Kelly is, and true Kelly is unknowable.

  **3. The Pooling/Ergodicity Boundary (Your Party Friend's Point)**
  Your friend is correct: if $N$ agents pool independent bets, the variance of the pool's return scales as $1/N$. As $N \to \infty$, the pool's time-average converges to the ensemble-average (arithmetic mean). For the pool, the optimal bet size approaches 100% of capital (assuming positive EV), not Kelly.
  *   **Why it moves you:** This demonstrates that "growth optimality" is not an intrinsic property of the bet, but a property of the *agent's boundary conditions*. If you can socialize losses (insurance, diversified corporate structures, family banks), you exit the "single bankroll over time" ergodicity class and enter the "ensemble average" class. A growth-maximizer must concede that Kelly is only normative for an *isolated* agent who cannot share risk.

  ### Awkward Objections (The Committed Growth-Maximizer Can Dismiss)

  **1. Fractional Kelly as "Unliveability"**
  You guessed that everyone using fractional Kelly is admitting pure growth maximization is unliveable. A Kellyite would dismiss this: they argue that fractional Kelly *is* the growth-optimal strategy once you correctly specify the utility function or account for estimation error.
  *   **Why it's dismissible:** It conflates the theoretical optimum with practical calibration. If your utility is actually $U(W) = W^{0.5}$, then "Half Kelly" *is* the full Kelly for *your* utility. The theory isn't broken; your specification of the agent's utility was.

  **2. The "Unfalsifiability" of the Long Run**
  The claim "Kelly wins in the long run" is compatible with losing for any finite period. You worried this makes it unfalsifiable. A Kellyite would argue this is just the nature of limit theorems, not a bug.
  *   **Why it's dismissible:** It's not unfalsifiable; it's just asymptotic. The problem isn't that the claim is vacuous, but that the convergence time may exceed the agent's lifespan. This circles back to the Finite-Horizon objection (Fatal #1) rather than invalidating the math itself.

  **3. "Why Log?" Normativity**
  Philosophers argue there's no reason utility *must* be logarithmic. A Kellyite dismisses this by saying they aren't claiming log is the *only* utility, but that it is the only utility that maximizes survival and dominance in a competitive evolutionary environment (the "breakeven" argument).
  *   **Why it's dismissible:** This is a coherent defensive position. If you care about not going extinct relative to competitors, log utility emerges naturally. It doesn't defeat the view, it just limits its scope to evolutionary/competitive contexts.

  ### Verdict on Your Guesses

  **Your guess about the "relevant agent" is right.**
  The pooling argument exposes that the Kelly criterion is not a law of decision theory, but a law of *isolated compounding*. If the "agent" is a family, a corporation, or a society that can pool independent risks, the arithmetic mean becomes the relevant metric, and the prescriptive force of Kelly dissolves. The ergodicity economics framing often glosses over this by treating the "individual" as the atomic unit, but if the individual can buy insurance or join a syndicate, they have effectively changed their ergodicity class.

  **Your guess about Fractional Kelly is half-right.**
  It is an admission that pure growth maximization is not the *only* value, but not necessarily that it is "unliveable." It is an admission that **utility is not log-wealth.** Most humans have utility functions that are steeper than log near ruin (panic) and flatter than log near saturation (diminishing returns). Fractional Kelly is the optimal solution for those utility functions. The mistake is thinking "Kelly" refers to a fixed bet size rather than "maximize expected utility where utility happens to be log."

  **On Unfalsifiability:**
  It is a genuine problem for a *prescriptive* claim. If a theory says "do X to win" but "winning" is defined as outperforming in a limit you will never reach, the theory is mathematically true but pragmatically vacuous for a mortal agent. This isn't a defense; it's a limitation of scope. The view survives only if qualified: "Kelly is optimal for immortal reinvestors; for mortals, it is a heuristic that approximates optimal behavior under specific utility constraints."
