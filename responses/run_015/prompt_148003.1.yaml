answer: |-
  ### I. Unpacking the Maxim: Four Philosophical Theses

  The maxim "When in Rome, do as the Romans do" is ambiguous. It oscillates between advice on self-preservation and claims about the ontology of moral truth. Below are four distinct philosophical unpackings of the maxim, analyzed through the lenses of tipping, queueing, and jaywalking.

  #### 1. The Prudential Claim (Strategic Advisability)
  *   **Thesis:** The maxim is not moral but instrumental. It advises conformity to avoid negative social consequences (ostracism, poor service, confrontation).
  *   **Implications:**
      *   **Tipping:** If locals tip, you should tip to ensure good future service or avoid being chased down the street. If they don't, don't tip to avoid looking foolish. There is no *duty* to tip, only a strategic incentive.
      *   **Queueing:** If locals queue, you queue to avoid verbal abuse. If they push, you push to avoid being left behind.
      *   **Jaywalking:** If locals jaywalk safely, you jaywalk to avoid traffic flow disruption or police fines.
  *   **Locals vs. Visitors:** The advice applies equally, but the stakes differ. Visitors are more conspicuous and thus face higher prudential risks for non-conformity. Locals have established reputations that might buffer minor deviations.
  *   **Moral Status:** Zero. Non-compliance is imprudent, not wrong.

  #### 2. The Strong Moral-Relativist Claim (Constitutive Normativity)
  *   **Thesis:** Moral truth is indexed to location. Local norms do not merely reflect morality; they *constitute* it. What is "right" is defined by the prevailing custom of the territory one occupies.
  *   **Implications:**
      *   **Tipping:** If the local norm is "no tipping," then tipping is objectively morally wrong (perhaps akin to bribery or insult) for anyone in that zone.
      *   **Queueing:** If the local norm is "first-come, first-served," queue-jumping is theft of time. If the norm is "survival of the pushiest," queue-jumping is morally neutral or virtuous efficiency.
      *   **Jaywalking:** If locals jaywalk, the moral prohibition against crossing against the light dissolves within that jurisdiction.
  *   **Locals vs. Visitors:** Bound identically. Morality is territorial, not citizenship-based. A visitor is morally obligated to adhere to local norms exactly as a local is.
  *   **Moral Status:** Absolute within the context. Non-compliance is morally wrongful.

  #### 3. The Tacit-Consent Claim (Contractual Obligation)
  *   **Thesis:** Entering a territory constitutes a voluntary agreement to abide by its social contract. By crossing the border, the visitor implicitly promises to follow local rules.
  *   **Implications:**
      *   **Tipping:** You are obligated to tip (or not) because you agreed to the local wage/social system upon entry. Violating this is a breach of promise.
      *   **Queueing:** You must queue (or not) because you agreed to the local ordering system.
      *   **Jaywalking:** You must follow local traffic customs because you accepted the local risk distribution.
  *   **Locals vs. Visitors:** Bound differently. Locals are bound by residence/citizenship (long-term contract); visitors are bound by entry (short-term license). However, the content of the obligation is the same.
  *   **Moral Status:** Deontological. Non-compliance is a violation of fidelity/promise-keeping.

  #### 4. The Coordination-Indexed Claim (Fairness in Equilibrium)
  *   **Thesis:** Conventions generate moral obligations only when they solve practical coordination problems (creating stable expectations). The obligation stems from a duty of fairness: one should not free-ride on or disrupt a beneficial equilibrium one intends to use.
  *   **Implications:**
      *   **Tipping:** If tipping coordinates wage expectations, you must tip to maintain the equilibrium. If *not* tipping coordinates dignity (see specific city below), you must not tip.
      *   **Queueing:** If queuing coordinates orderly access, you must queue. If a different system (e.g., token-based or push-based) coordinates access more efficiently locally, you must adopt that.
      *   **Jaywalking:** If jaywalking is the universal flow, stopping on the curb creates danger (discoordination). You must jaywalk to maintain safety equilibrium.
  *   **Locals vs. Visitors:** Bound proportionally to participation. A visitor who does not use the service (e.g., doesn't eat at restaurants) has less obligation regarding tipping than one who does. Locals are bound more strictly as they sustain the equilibrium daily.
  *   **Moral Status:** Defeasible. Obligations exist only insofar as the convention solves a coordination problem without violating deeper moral constraints.

  ---

  ### II. The Committed Position: Coordination with Dignity Constraints

  I defend a refined version of **Thesis 4: The Coordination-Indexed Claim**, augmented by a **Dignity Constraint**.

  **The Theory:** A visitor has a genuine moral obligation to follow local conventions if and only if:
  1.  The convention functions as a **Cooperative Equilibrium** (it solves a coordination problem where mutual adherence yields better outcomes than deviation); AND
  2.  Adherence does not violate a **Core Moral Constraint** (specifically, causing harm or violating human dignity).

  This view rejects Prudentialism (which ignores fairness), Relativism (which surrenders moral agency to geography), and Tacit Consent (which relies on a fictional contract). Instead, it grounds obligation in the **fairness of participating in a mutually beneficial social practice**, unless that practice is inherently corrupt.

  #### Application to the Specific City
  *Scenario:* Queue-jumping is the locally efficient norm; tipping is a demeaning personal insult; jaywalking is universal and safe.

  1.  **Queue-Jumping (Efficient Norm):**
      *   *Analysis:* Here, the "coordination problem" is maximizing throughput in a high-density environment. The local equilibrium is "push to enter." A visitor who insists on Western-style queuing disrupts the flow, causing frustration and inefficiency for everyone.
      *   *Verdict:* **Obligation to Queue-Jump.** The visitor must adapt. The moral value of "fairness" is convention-dependent; here, fairness *is* efficiency. Disrupting this to satisfy a foreign intuition of order is selfish.
  2.  **Tipping (Demeaning Insult):**
      *   *Analysis:* This is the critical test. A standard Coordination view might say "follow the norm." However, if the local norm defines tipping as an *insult* (implying the worker is a beggar), then tipping violates the **Dignity Constraint**. The coordination equilibrium here is based on mutual respect signaled by *not* exchanging extra money.
      *   *Verdict:* **Obligation NOT to Tip.** To tip is to commit a moral wrong (insulting dignity), even if the visitor intends generosity. The coordination obligation aligns with the dignity constraint: do as the Romans do (refrain from tipping).
  3.  **Jaywalking (Universal/Safe):**
      *   *Analysis:* The coordination problem is traffic predictability. If everyone jaywalks, a pedestrian standing still on the curb becomes a hazard (unpredictable).
      *   *Verdict:* **Obligation to Jaywalk.** Staying on the curb violates the safety equilibrium. Since harm is rare (per the scenario), the Dignity Constraint is not triggered.

  ---

  ### III. Engagement with the Strongest Opposing View

  The strongest opponent to this view is **Thesis 3: The Tacit-Consent Claim**.

  **The Opponent's Argument:** The Consent theorist argues that my Coordination view is too unstable. Obligations should not fluctuate based on whether a norm is "efficient" or "coordination-solving." Instead, the obligation is binary and robust: you entered the city, you accepted the rules. This explains why you must follow even *arbitrary* laws (e.g., "no drinking on Sundays") that solve no coordination problem. In our specific city, Consent explains the tipping prohibition simply: "You agreed to their culture."

  **My Rebuttal:** The Consent view fails because it cannot distinguish between **authoritative rules** and **abusive norms**. If the local norm were "visitors must kneel before locals," Consent theory struggles to explain why a visitor is *not* bound (since they technically "entered" the territory). It treats entry as a blank check.
  My Coordination view succeeds because it identifies *why* the norm binds: it facilitates social cooperation.
  *   **Structural Feature:** The decisive feature is **Interdependent Expectations**.
      *   In the Queue-Jumping case, my action affects others' ability to board the train (interdependence).
      *   In the Tipping case, my action affects the worker's social standing (interdependence).
      *   Consent theory ignores interdependence; it focuses on the *act of entry*.

  **The Decisive Work:** The presence of a **Cooperative Equilibrium** does the decisive work.
  *   **If the feature is removed:** Suppose the queue-jumping norm is *not* efficient (e.g., it causes fights and slows everyone down, but is just a "tradition").
      *   *Consent View:* You are still obligated to follow it (you agreed to the local customs).
      *   *My View:* The obligation **dissolves**. If the convention no longer solves a coordination problem (it creates friction rather than order), there is no fairness-based reason to adhere to it. You may revert to standard queuing.
      *   *Why this matters:* This proves my view is superior. It allows for moral critique of local norms that are merely oppressive or inefficient traditions, whereas Consent theory traps the visitor in potentially harmful or useless practices simply because they crossed a border.

  ### IV. Flagging the Contested Boundary

  My argument hinges on a contested boundary between **Etiquette** and **Morality**, specifically regarding the Tipping case.

  I classify "tipping as an insult" as a **Moral** issue (Dignity Constraint) rather than mere **Etiquette**.
  *   *The Contest:* A Prudentialist or strict Etiquette theorist would argue that offending a waiter is just a social faux pas, not a moral wrong. They would say tipping is permissible if you don't mind the glare.
  *   *My Stance:* I argue that conventions which constitutively define a person as inferior (beggar vs. professional) cross the line into morality.
  *   *Risk:* If this boundary is rejected (i.e., if "insult" is downgraded to "bad manners"), my Dignity Constraint weakens. The obligation to *not* tip becomes merely prudential (avoid offense) rather than moral (protect dignity).
  *   *Defense:* However, even if downgraded, the Coordination thesis holds: if the local equilibrium defines tipping as "insult," then tipping disrupts the social signal of respect. To coordinate on "respectful interaction," one must not tip. Thus, even if the Dignity Constraint is contested, the Coordination imperative remains robust in this specific city.

  **Conclusion:** The visitor ought to adapt her behavior in all three cases, but for different reasons. She must queue-jump and jaywalk to maintain **Cooperative Equilibria** (efficiency and safety). She must refrain from tipping to satisfy the **Dignity Constraint** (avoiding harm). The maxim "Do as the Romans do" is valid not because Rome defines truth, but because living in Rome requires participating fairly in Rome's cooperative schemes, provided those schemes do not demand moral complicity.
