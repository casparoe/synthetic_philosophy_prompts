  5.  **Drafting the Response:**

      *   **Introduction:** Validate their effort. It's impressive they've gotten this far. Acknowledge the "Insurance Adjuster" mindset (looking for consistent rules).
      *   **Part 1: The Diagnosis of the Rule.**
          *   Identify the missing piece: **Contradiction in Will (CW)** vs. **Contradiction in Conception (CC)**.
