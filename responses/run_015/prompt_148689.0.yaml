answer: |-
  You have done something remarkable: you have independently reconstructed the *Formula of Universal Law* (FUL), identified its most common failure points, and stumbled onto the distinction between *Contradiction in Conception* and *Contradiction in Will* without the secondary literature. That your verdicts feel consistent is a testament to your own moral reasoning; that they do not perfectly map onto your stated rule is a testament to the rule being incomplete, not your judgment being wrong.

  You asked for a diagnosis, a repaired principle, a verdict audit, predictions on new cases, and an honest answer to the Utilitarian worry. I will address these in order.

  ### 1. The Diagnosis: Your Rule is Half a Principle

  Your working rule is: *"A maxim fails if, once everyone acted on it, the thing the maxim is a way of doing could no longer be done."*

  In Kantian terms, you have discovered **Contradiction in Conception (CC)**. This covers "Perfect Duties" (things you must never do, like breaking promises). But Kant's system has a second gear which you identified but couldn't name: **Contradiction in Will (CW)**. This covers "Imperfect Duties" (things you should generally do, like help others or develop talents).

  *   **CC (Your current rule):** If everyone did $X$, the practice of $X$ becomes logically impossible. (e.g., If everyone breaks promises, "promising" ceases to mean anything).
  *   **CW (The missing clause):** If everyone did $X$, the practice is still *possible*, but a rational agent cannot *will* it to be universal because it undermines something they necessarily value (like their own future happiness or agency).

  **The Repair:**
  To fix your rule, you need a two-step test. A maxim is immoral if:
  1.  **Conception Test:** Its universalization makes the action itself logically impossible (e.g., false promising).
  2.  **Will Test:** Its universalization creates a world that a rational agent cannot consistently will to inhabit, because it frustrates ends they necessarily have (e.g., needing help, needing skills to achieve goals).

  **The Filter for Etiquette:**
  You asked how to distinguish morality from manners (the cinema phone). Kant distinguishes between **Categorical Imperatives** (moral duties, unconditional) and **Hypothetical Imperatives** (pragmatic rules, conditional on a goal).
  *   *Moral:* "Do not lie." (Unconditional).
  *   *Etiquette:* "Do not use your phone." (Conditional on "if you want to be polite" or "if you want others to enjoy the film").
  *   *The Fix:* If universalizing the action only creates a bad outcome relative to a specific desire (enjoying a movie), it is etiquette. If it contradicts rational agency itself, it is morality.

  **The Level of Description:**
  You noted you can sink any maxim by describing it broadly and rescue it by describing it narrowly. You are correct; this is the "Maxim Specification Problem."
  *   *The Fix:* A maxim must include the **Action**, the **Condition**, and the **End (Purpose)**.
  *   *Bad Maxim:* "Lie." (Too broad).
  *   *Bad Maxim:* "Lie to my sister about her poem on Tuesdays." (Too narrow/ad hoc).
  *   *Good Maxim:* "Make a false statement [Action] when the truth is discouraging [Condition] to sustain a loved one's morale [End]."
  *   *Why this matters:* The *End* determines whether the maxim treats people as mere means or respects their autonomy.

  ### 2. The Verdict Audit

  Here is how the repaired principle (CC + CW + Humanity) evaluates your list. I will note where your intuition matches Kant, where it diverges, and where your *rule* was the problem.

  | Case | Your Verdict | Kantian Diagnosis | Why? |
  | :--- | :--- | :--- | :--- |
  | **False Promise / Loan Fraud** | Fails | **Matches.** | **CC.** The institution of credit/promising collapses. |
  | **Car Boot (Active Lie)** | Fails | **Matches.** | **CC.** Communication relies on truth; lying weaponizes trust against itself. |
  | **Car Boot (Silence)** | Fine | **Diverges.** | **Kant says: Risky.** While not a lie, the maxim "Exploit ignorance for gain" treats the seller as a mere means (Formula of Humanity). Your intuition is legally sound; Kant is stricter. |
  | **Café Review (Mediocre)** | Fine | **Matches (with nuance).** | **CW/Ends.** If the maxim is "Lie for profit," it fails CC. If the maxim is "Encourage a friend's effort," it may pass CW because the end is support, not deception for gain. The institution of reviews isn't the point; the relationship is. |
  | **Sister's Poem** | Fine | **Matches.** | Same as above. The end (kindness) distinguishes it from fraud. |
  | **Undercutting Rival** | Fine | **Matches.** | **Rule Error.** You correctly spotted that universal undercutting doesn't destroy the *practice* of bidding, only the *advantage*. This is not a contradiction. Competition is permissible. |
  | **Never Helping** | Fails | **Matches.** | **CW.** The world is possible, but you cannot *will* it, as you might need help. You identified this perfectly ("I simply cannot will being in it"). |
  | **Never Developing Talents** | Fails (Shaky) | **Matches.** | **CW.** A rational agent wills ends; ends require means; talents are means. To refuse all means is to contradict your own will to achieve things. |
  | **Snooping Phone** | Wrong | **Matches (Rule Error).** | **Formula of Humanity.** Universalizing snooping doesn't break logic (CC), but it violates the partner's autonomy and privacy. Your rule (FUL) was silent; you need the "Humanity" formula. |
  | **Phone in Cinema** | Bad Manners | **Matches.** | **Hypothetical Imperative.** Universalizing creates annoyance, not a moral contradiction. It fails the "enjoyment" test, not the "morality" test. |
  | **Booking Two Tables** | Wrong | **Matches.** | **CC/FH.** Maxim: "Reserve shared resources I don't need to secure optionality." Universalized, reservation systems become useless or punitive. It treats other diners as obstacles. |

  **Which verdicts must go?**
  Strictly speaking, only the **Car Boot Silence** case is vulnerable. Kant is notoriously rigid on truthfulness. While you didn't *lie*, your maxim ("Allow false belief for my gain") treats the seller as a tool for your profit, not an end in themselves. However, many modern Kantians would agree with you: there is no duty to correct every mistake, only a duty not to assert falsehoods. I would keep your intuition here, but acknowledge it rests on *Humanity*, not *Universal Law*.

  **Which intuitions are safest?**
  Your distinction between "Destroying the practice" (Promises) and "Destroying the advantage" (Undercutting) is philosophically sophisticated. Keep that. Your distinction between Morality (Helping) and Etiquette (Cinema) is also correct.

  ### 3. The New Cases

  Here is what the repaired principle predicts for your undecided cases.

  **Case A: Claiming a tax deduction for a home office used twice a year.**
  *   **Maxim:** "Claim deductions I do not strictly qualify for [Action] when the chance of audit is low [Condition] to keep more of my income [End]."
  *   **Test (CC):** If everyone claimed deductions they didn't qualify for, the tax code's definitions become meaningless. The system relies on self-reporting honesty. Universalizing this maxim destroys the concept of a "qualified deduction."
  *   **Test (FH):** It treats fellow citizens (who pay their share) and the state as mere means to your financial gain.
  *   **Verdict:** **Fails.** It is morally equivalent to the loan application fraud. The "twice a year" detail is an attempt to narrow the maxim to escape the rule; the *intent* is to take public funds without meeting the public condition.

  **Case B: Using a bot to buy concert tickets and resell two above face value.**
  *   **Maxim:** "Use automated technology to bypass fair-access purchasing limits [Action] when demand is high [Condition] to profit from scarcity [End]."
  *   **Test (CC):** If everyone did this, the "first-come, first-served" or "fair access" system of ticketing collapses. It becomes an arms race of code, rendering the ticketing system's purpose (ordering access) incoherent.
  *   **Test (FH):** It treats other fans as mere obstacles to profit. You are bypassing the rules designed to give them a fair shot.
  *   **Verdict:** **Fails.** This is not "smart business"; it is a contradiction of the fair-access convention you are participating in.

  ### 4. The Utilitarian Worry

  You asked: *"When I ask 'what if everybody did that?', am I really doing something Kantian at all, or have I quietly become a rule-utilitarian estimating consequences while using his vocabulary?"*

  **Honest Answer:** In your *formulation*, you have slipped into Rule Utilitarianism. In your *verdicts*, you are often Kantian.

  **The Difference:**
  *   **Rule Utilitarian:** "If everyone lied, trust would break down, society would suffer, and happiness would decrease. Therefore, lying is wrong." (Focus: **Bad Consequences**).
  *   **Kant:** "If everyone lied, the concept of a 'statement' having truth-value becomes incoherent. A lie is a contradiction of rational agency." (Focus: **Rational Inconsistency**).

  **Where you slipped:**
  You wrote: *"If everyone did it, reviews would stop doing their job."*
  That is a utilitarian claim (the *utility* of the review is lost).
  A Kantian claim would be: *"A review is by definition testimony of experience. To submit a review without experience is to assert a contradiction."*

  **Does it matter?**
  Yes. If you are a Utilitarian, you can break the rule if the consequences are good enough (e.g., lie to save a life). If you are a Kantian, the contradiction holds regardless of consequences (Kant famously argued you shouldn't lie to a murderer at the door).
  *   **Your Intuition:** You seem to allow lying for kindness (the poem/café). This suggests you are **not** a strict Kantian, nor a strict Utilitarian. You are likely a **Pluralist** who uses Universalizability as a heuristic for fairness, but allows for "Duties of Virtue" (kindness) to override strict "Duties of Right" (truth-telling) in low-stakes personal contexts.

  **Recommendation:**
  Do not abandon the "What if everybody did that?" test. It is the best heuristic for fairness we have. But stop calling it "Kant" if you aren't willing to accept the hard edges (like the murderer at the door). Call it what it is: **A test for Fairness and Rational Consistency.**

  ### Summary of the Repaired Principle

  To replace your working rule, use this:

  > **The Principle of Rational Agency:**
  > Act only on a maxim that you can simultaneously will to be a universal law, provided that:
  > 1.  **Consistency:** The universal practice does not make the action logically impossible (Contradiction in Conception).
  > 2.  **Volition:** The universal practice does not undermine ends that you, as a rational agent, necessarily will (Contradiction in Will).
  > 3.  **Respect:** The action does not treat other rational beings as mere tools for your ends (Formula of Humanity).
  >
  > *Note: This applies only to Categorical Imperatives (moral duties), not Hypothetical Imperatives (etiquette/prudence).*

  **Final Advice for your Group:**
  You are doing philosophy correctly. The friction you feel between your rule and your verdicts is not a bug; it is the engine of ethical refinement. Your insurance background serves you well here: you are looking for policy consistency. Just remember that in ethics, the "policy" is Reason itself, not a contract. Keep the list, keep meeting, and don't worry if you can't perfectly state the principle. Kant spent his whole life trying to get it right; you've had a year.
