  4.  **Addressing the "Rule Utilitarian" Worry:**
      *   *Question:* Is "What if everybody did that?" just Rule Utilitarianism (RU)?
      *   *Answer:* No. RU looks at *consequences* of universal adoption (bad outcomes = wrong). Kant looks at *rational consistency* (contradiction = wrong).
