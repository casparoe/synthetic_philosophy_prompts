answer: |-
  The therapy/enhancement distinction functions as a foundational axiom in bioethics, health policy, and sports regulation. It posits a moral and categorical difference between interventions that restore an individual to a baseline of "normal" functioning (therapy) and those that elevate functioning beyond that baseline (enhancement). While often treated as a self-evident biological fact, this distinction is an institutional construct. Reconstructing the implicit theory presupposed by these practices reveals a framework that prioritizes the maintenance of species-typical norms over individual maximization, relies on a precarious hybrid of naturalist and normativist definitions of disease, and serves primarily as a mechanism for resource rationing and moral boundary-keeping.

  ### 1. Normal Functioning vs. Welfarism

  The first question concerns whether the practice presupposes a substantive account of normal human functioning or if it is compatible with welfarism. Welfarism, in the context of bioethics (championed by philosophers like Julian Savulescu), holds that the moral value of an intervention is determined solely by its contribution to an individual's well-being. If a growth hormone injection makes a short, healthy child happier, more confident, and socially successful, a welfarist calculus deems it a "good" intervention, regardless of the child's physiological baseline.

  The institutions described in the prompt strictly **reject pure welfarism**. Health insurance denies coverage for enhancement *even when* the enhancement would arguably make the individual "better off" in terms of subjective well-being or social opportunity. If the system were welfarist, the distinction between therapy and enhancement would dissolve; there would only be "effective interventions" and "ineffective interventions." The refusal to cover growth hormone for idiopathic shortness demonstrates that the system values a specific state of being—**species-typical functioning**—over the maximization of individual utility.

  Therefore, the practice presupposes a **substantive account of normal human functioning**. It relies on the assumption that there is a "given" human nature or a statistically normative range of function that constitutes a moral ceiling for public support. This aligns closely with Norman Daniels' extension of Rawlsian justice, where health care is obligated to protect "fair equality of opportunity" by restoring normal functioning, but is not obligated to improve opportunities beyond what is considered the normal range. The implicit theory is that justice requires leveling up the disadvantaged to the norm, but not leveling out the norm to the advantaged.

  ### 2. The Health/Disease Boundary

  The second question addresses which philosophical accounts of the health/disease boundary sustain this practice. We can categorize these into Naturalist, Normativist, and Hybrid accounts.

  *   **Naturalist Accounts (e.g., Christopher Boorse):** Boorse's Biostatistical Theory defines disease as a sub-statistical limitation on functional ability relative to a reference class (age, sex, species). This account **best sustains the institutional practice**. Insurance companies and drug regulators require objective, measurable criteria to adjudicate claims. They act *as if* disease is a value-free biological fact. If growth hormone levels are below the statistical mean for a specific age/sex cohort, it is a disease (deficiency); if they are within the mean, it is not. This provides the administrative objectivity required for policy.
  *   **Normativist Accounts (e.g., H. Tristram Engelhardt):** These accounts argue that "disease" is a value judgment regarding disvalued conditions. If society values height, then shortness is a disadvantage. A strict normativist view **cannot sustain the practice** as it currently exists. If disease is purely about social disvalue, then "idiopathic shortness" in a height-obsessed culture could be classified as a disease warranting treatment. This would blur the therapy/enhancement line, forcing insurers to cover enhancements that alleviate social disadvantage.
  *   **Hybrid Accounts (e.g., Jerome Wakefield):** Wakefield's "Harmful Dysfunction" analysis requires both a failure of internal mechanism (naturalist) and a judgment of harm (normativist). This is the **operational reality** of the institutions, though they rarely admit the normative component. For example, infertility is a dysfunction, but coverage often depends on the normative judgment of whether childlessness is a "harm" worth funding.

  The practice survives by masking its normative judgments in naturalist language. It requires the *authority* of Naturalism (to deny claims objectively) but relies on the *flexibility* of Normativism (to decide which statistical deviations count as diseases). A pure Naturalist account would fail because statistical outliers (e.g., extremely high intelligence) are not diseases, yet the line between "restoring" intelligence and "enhancing" it is biologically continuous. A pure Normativist account would fail because it would expand coverage indefinitely based on shifting social values. Thus, the institutions presuppose a **pragmatic Naturalism**: they treat the boundary as biological fact for administrative purposes, while quietly relying on social consensus to draw the line.

  ### 3. Consistency Across Domains

  Are the commitments consistent across insurance, sport, and drug regulation? On the surface, they appear unified by the therapy/enhancement binary. However, a deeper analysis reveals **significant theoretical incompatibilities**.

  *   **Health Insurance:** The goal is **solvency and fair equality of opportunity**. "Normal" is defined statistically (the average human). The distinction protects the risk pool from lifestyle choices and cosmetic desires.
  *   **Drug Regulation (FDA/EMA):** The goal is **safety and efficacy for specific indications**. Regulators approve drugs for *conditions*, not for *goals*. However, they often approve drugs for "quality of life" improvements (e.g., Viagra, originally for angina, then for erectile dysfunction). The boundary here is legalistic: does the patient have a diagnosed code?
  *   **Sport (WADA):** The goal is **preserving the "spirit of sport" and natural merit**. Here, the theory diverges sharply. In medicine, restoring a diabetic to normal glucose levels is therapy. In sport, if that restoration provides a competitive edge (e.g., insulin use in non-diabetics, or even therapeutic use exemptions that confer advantage), it is scrutinized as potential doping. Sport defines "normal" not as *species-typical*, but as *unassisted potential*.

  **The Inconsistency:** In medicine, we use technology to overcome biological limits (e.g., glasses for vision). In sport, using technology to overcome biological limits is often banned (e.g., mechanical aids). Furthermore, sport sometimes bans therapeutic interventions if they enhance performance (e.g., beta-blockers for archers with performance anxiety). Insurance, conversely, would cover beta-blockers for hypertension but not for stage fright.

  This reveals that the "therapy" label is not stable. In insurance, therapy is about **economic protection against misfortune**. In sport, therapy is about **allowing participation without altering the hierarchy of natural talent**. These domains rely on different implicit theories: Insurance relies on a **Distributive Justice** theory (Daniels), while Sport relies on a **Meritocratic Naturalism** (talent should determine victory, not technology). These are potentially incompatible; a drug that restores a depressed athlete to "normal" mood might be banned if "normal" mood provides a competitive edge over the "naturally resilient."

  ### 4. Consequences of Collapse

  If the therapy/enhancement distinction turned out to be philosophically indefensible—as many bioethicists argue, given that function exists on a continuum and "normality" is statistically arbitrary—the consequences would be transformative.

  **What would have to change?**
  *   **Insurance:** Coverage criteria would have to shift from "medical necessity" to "benefit maximization" or "basic income." If there is no bright line between fixing a deficiency and improving a trait, insurers could not deny coverage for enhancements without appearing arbitrary. To avoid bankruptcy, they would likely have to stop covering *any* non-essential interventions, transforming health insurance into catastrophic coverage only, or the state would have to socialize enhancement costs as public goods.
  *   **Sport:** Anti-doping rules would become unenforceable. If we cannot distinguish between a high-tech training regimen (enhancement) and a genetic mutation (natural talent), the only fair competition would be "open class" (like motorsport), where technology is unlimited, or competition would have to be strictly genetic.
  *   **Medicine:** The professional remit would shift from "healing" to "servicing desires." Physicians would become technicians of human optimization.

  **What would the practical costs reveal?**
  The practical costs of this collapse would reveal that the therapy/enhancement distinction was never primarily about biology or metaphysics. It was a **political and economic technology**.
  1.  **Fiscal Gatekeeping:** The high cost of denying enhancement coverage reveals that the distinction's primary function is **rationing**. It limits the limitless demand for self-improvement to match finite resources. Without it, the concept of "insurance" (pooling risk for illness) collapses into "subscription" (paying for optimization).
  2.  **Moral Desert:** In sport, the cost of allowing enhancement is the loss of the narrative that the winner is the "better" human. The distinction preserves the **myth of natural merit**. It allows society to celebrate achievement as a reflection of character and gift, rather than purchasing power and access to technology.
  3.  **Professional Authority:** In medicine, the distinction protects the **moral authority of the physician**. It allows doctors to say "no" to patient demands. If the distinction collapses, the physician loses the power to define "need," becoming a service provider subject to consumer demand.

  ### Conclusion

  The implicit theory presupposed by the therapy/enhancement distinction across these institutions is a form of **Institutional Naturalism**. It posits a stable, objective boundary of human nature to justify the allocation of resources and the regulation of competition. It is incompatible with welfarism, as it prioritizes normative baselines over individual well-being. It relies on a hybrid of naturalist objectivity and normativist judgment, masking the latter to maintain administrative authority.

  However, the inconsistencies between insurance (justice), sport (merit), and regulation (safety) reveal that the distinction is not a unified philosophical truth but a collection of context-specific fictions. If the distinction were abandoned, the resulting economic and cultural costs would expose its true function: it is a boundary mechanism designed to manage scarcity, preserve social narratives about merit, and maintain professional gatekeeping power. The distinction persists not because it is biologically robust, but because the institutions that rely on it cannot function without a limit to human ambition.
