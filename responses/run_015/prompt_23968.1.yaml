  2.  **Deconstruct the Absent-Minded Driver Problem:**
      *   *Setup:* A driver must exit at the second intersection but forgets if they've passed the first. Both intersections look identical.
      *   *Standard View (1/2 rule):* Upon arriving at an intersection, the driver thinks, "I'm at an intersection. There are two. I'm equally likely to be at the first or second." So, P(First) = 1/2.
      *   *The Indexical Issue:* The belief isn't just "An intersection exists." It's "I am *here* now." The uncertainty is self-locating (where am I in the sequence?).
      *   *Problem for 1/2 Rule:* If you assign 1/2 at *every* intersection, your beliefs are diachronically inconsistent. If you are at the first, you plan to continue. If you arrive at the second, you still think there's a 50% chance you're at the first. This leads to dynamic inconsistency in decision-making (planning vs. acting).
      *   *Skeptical Alternative:* The driver realizes they cannot distinguish the intersections. Therefore, they cannot form a stable credence about *which* one it is. They suspend judgment or rely purely on the pre-commitment strategy rather than updating beliefs at the junction.

