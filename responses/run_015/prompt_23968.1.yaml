answer: |-
  The absent-minded driver faces two identical intersections. The "1/2 rule" claims that upon arriving at any intersection, the driver should assign a 50% probability to being at the first versus the second. The indexical issue arises because this belief is self-locating: it's not about the world's state, but "Where am *I* in this sequence?" Since the intersections look identical, the driver lacks evidence to distinguish their temporal location.

  This breaks the 1/2 rule because it creates dynamic inconsistency. If you assign 50% at *every* junction, your decision-making changes mid-route. You might plan to continue at the first but exit at the second, even though nothing has changed except your location—which you can't verify. Your future self contradicts your past self's optimal plan.

  The skeptical alternative dodges this by refusing to form a settled belief about location. Instead of guessing "I'm probably at the first," the driver acknowledges they cannot know. They bypass the indexical uncertainty entirely by sticking to a pre-commitment strategy decided before forgetfulness set in. By suspending judgment on the self-locating fact, they avoid the trap of updating credences based on indistinguishable evidence, ensuring their action remains consistent with their original optimal goal rather than a flawed local calculation.
