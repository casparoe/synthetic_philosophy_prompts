answer: |-
  Here is a sequence of eight questions designed to progressively tighten the pressure on the "betting is literal" and "coherence is core" framing. They move from broad methodological claims to specific technical gaps, ending with a meta-philosophical challenge.

  I have included **Moderator Notes** for each question to help you anticipate his likely deflections and keep him pinned to the specific point you want to make.

  ### 1. The Methodological Primacy Claim
  "Your book argues that Dutch Book arguments provide a *more rigorous* justification for expected utility theory than Representation Theorems do. Representation Theorems start with observable preferences and derive probabilities and utilities; Dutch Book arguments start with probabilities and utilities to show consistency. Why is the direction of the Dutch Book argument philosophically superior? Is it because you think rationality is fundamentally about avoiding losses rather than revealing preferences?"

  > **Moderator Note:** This sets the stage. It forces him to commit to *why* DB is better before you attack the details. If he says "because preferences are messy," you can later ask if betting behavior isn't also messy.

  ### 2. The "Literal" Betting Claim
  "You've stated in your talks that 'the betting framework isn't a metaphor, it's the point.' If this is literal, it seems to imply that the normative force of rationality depends on the possibility of entering into wagers. Does this mean that agents who cannot bet—due to isolation, lack of currency, or cognitive limitations—are exempt from the requirements of probabilistic coherence? Or are they irrational simply because they *would* lose money if they *could* bet?"

  > **Moderator Note:** This presses the "literal" slogan. If he says "it's counterfactual," you can ask in Q7 why we need the counterfactual bet at all. If he says "they are exempt," he limits the scope of his theory significantly.

  ### 3. Pragmatic vs. Epistemic Dutch Books
  "Standard Dutch Book arguments are pragmatic: they rely on the transferability of money and the assumption that more money is always better. Epistemic Dutch Books try to generalize this to accuracy or verisimilitude. If the betting framework is literal and not metaphorical, does the argument lose its force when no money changes hands? Is the 'loss' in an epistemic Dutch Book robust enough to carry the same normative weight as a financial loss, or does the 'literal' claim only hold for pragmatic rationality?"

  > **Moderator Note:** This addresses your requirement on the pragmatic/epistemic distinction. It challenges whether the "money" assumption is load-bearing. If he says epistemic utility works the same way, ask if "accuracy" is really transferable in the way money is.

  ### 4. The Necessary but Not Sufficient Gap
  "I want to press on the link between coherence and Expected Utility maximization. Avoiding Dutch Books robustly establishes *Probabilism*—that credences should obey the probability calculus. But it is less clear that it establishes *Expected Utility Maximization* specifically. An agent could have perfectly coherent, probabilistic credences but use a different decision rule, like Maximin or Risk-Weighted EU, without necessarily inviting a Dutch Book. If coherence is compatible with non-EU decision rules, in what sense does the Dutch Book argument justify EU maximization rather than just coherence?"

  > **Moderator Note:** **This is the core technical question.** It forces him to admit that DB $\rightarrow$ Coherence, but Coherence $\nrightarrow$ EU. He cannot simply conflate the two.

  ### 5. Follow-Up: The "Rest of the Story"
  *(Ask this only if he replies that coherence is the 'core' or 'floor' and EU is the elaboration, as you anticipate.)*
  "If I understand correctly, you're conceding that the Dutch Book argument secures the 'floor' of coherence, but we need additional assumptions to get to the 'ceiling' of EU maximization. If the Dutch Book argument doesn't get us all the way to EU, what argument does? And if that second argument isn't a Dutch Book argument, doesn't that demote the Dutch Book from being the 'single best justification' for EU to merely the best justification for Probabilism?"

  > **Moderator Note:** **This is the required follow-up.** It prevents him from hiding behind the "coherence is core" slogan. It forces him to identify the *other* justification for EU and explain why DB is still the "single best" if it doesn't do the whole job.

  ### 6. The Linearity Assumption
  "Building on that, classic Dutch Book arguments for utility often rely on an assumption that the agent values the betting currency linearly. If an agent has diminishing marginal utility for money, they might reject a series of bets that looks like a Dutch Book to an observer, simply because the utility of the losses doesn't aggregate linearly. Does your defense of the betting framework require us to assume linear utility of money? If so, isn't the argument circular—assuming the structure of utility it aims to prove?"

  > **Moderator Note:** This deepens the technical pressure from Q4. It highlights that the "literal betting" framework often smuggles in the very EU structure it claims to justify via the back door of currency valuation.

  ### 7. Betting vs. Logical Consistency
  "Given these complexities, why is the betting framework needed at all? Why not simply state that 'your credences should form a probability measure' as a *sui generis* logical consistency requirement, akin to 'your beliefs should not be contradictory'? What normative work does the *bet* do that a direct consistency norm does not? Is the money doing any actual work, or is it just a rhetorical device to make consistency feel more urgent?"

  > **Moderator Note:** This addresses your requirement on why betting is needed vs. logical consistency. It challenges the "literal" claim again: if the norm is really just consistency, why dress it up as gambling?

  ### 8. Falsification and Counterevidence
  "Finally, I want to ask about dialectical openness. If coherence is the fundamental rationality requirement, it seems potentially self-sealing: any argument against it would presumably be judged by whether it is itself 'coherent.' Is there any specific argument, formal result, or intuitive case that would count as evidence *against* the view that Dutch Book avoidance is the core of rationality? What would it take to change your mind?"

  > **Moderator Note:** This addresses your requirement on falsification. It ends the session by asking him to define the limits of his own theory, leaving the audience with a concrete metric for evaluating his view.
