          *   *Cosmic-level:* Rational order exists; we can "align" with it (cosmic religious feeling).
          *   *Resolution:* Moral striving makes sense as alignment, not as contra-causal freedom.
      *   **Request:**
          *   What counts against this interpretation? (Defeaters).
