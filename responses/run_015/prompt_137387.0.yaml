answer: |-
  You have identified the central tension in docudrama ethics: the conflict between *narrative truth* (what makes the story work) and *historical fidelity* (what actually happened), complicated by the fact that the subjects cannot consent. Your intuition is correct that the standard "harm principle" (no living person is distressed) fails here. You are not tracking harm; you are tracking **violation**.

  Your three candidate principles each capture a facet of the problem, but none survive your verdicts intact.
  *   **The Structural Principle** fails on Case 9 vs. 10 (Emperor vs. Private Person). The structural impact of the invented cruelty is identical, yet your moral reaction flips.
  *   **The Counterfactual Consent Principle** fails on Case 1 (Composite Character). A composite is, by definition, someone no one would recognize as themselves.
  *   **The Epistemic Principle** fails on Case 9 vs. 10 again. The audience is equally likely to believe the fiction in both cases.

  To resolve this, we need a principle that accounts for the *relationship* the subject had with the public, the *coherence* of their identity, and the *nature* of the invention.

  ### The Proposed Principle: Narrative Stewardship

  I propose you replace your three candidates with a single unified theory: **The Principle of Narrative Stewardship.**

  This principle posits that when we dramatize the dead, we become stewards of their **Moral Agency**. We are permitted to alter facts, but we are forbidden from altering the *subject's own project of self*, unless that project was itself a deception.

  This principle rests on three pillars:
  1.  **The Public Contract:** Subjects who courted public legacy (Emperors, Politicians, Memoirists) surrender the right to narrative privacy. Subjects who lived privately retain a right to obscurity, even in death.
  2.  **Identity Coherence:** We may not depict a subject acting contrary to the moral identity they avowed and lived, unless we have evidence they were performing a fraud.
  3.  **Moral Weight:** Inventions that alter the audience's moral judgment of the subject (cruelty, crime, sexuality) are held to a higher standard of proof than inventions of circumstance (compression, dialogue, setting).

  ### Testing the Verdicts

  Let's run your eleven verdicts through Narrative Stewardship.

  *   **1, 2, 3 (Compression/Composite/Dialogue):** **Pass.** These are structural decorations. They do not alter the subject's moral agency or identity.
  *   **4 (Invented Affair, General):** **Fail.** Under Narrative Stewardship, this should be **Not Fine**. An affair is a defining moral act. If you invent it, you are assigning them a moral motivation they did not have. Your "bad conscience" was correct; this verdict is the weak link in your chain.
  *   **5 (Invented Affair, Only Source):** **Pass.** Epistemic harm compounds the Stewardship violation.
  *   **6 (Invented Cruelty):** **Pass.** This violates Identity Coherence and Moral Weight. It assigns a vile agency they did not exercise.
  *   **7 (Acquitted Crime):** **Pass.** This violates the legal and moral boundary of their agency.
  *   **8 (Contrary Sexual Identity):** **Pass.** This is a direct violation of Identity Coherence. (This confirms that Verdict 4 must be aligned with Verdict 8).
  *   **9 (Emperor Cruelty):** **Pass.** The Public Contract. The Emperor made his life a public spectacle; we are permitted to interpret the spectacle.
  *   **10 (Private Person Cruelty):** **Pass.** The Private Person did not invite scrutiny. To invent cruelty is to instrumentalize a life that asked to be left alone.
  *   **11 (Biopic of Liar):** **Pass.** The subject forfeited Identity Coherence protection by weaponizing falsehood. Your invention is restorative stewardship, not violation.

  ### The Sacrifice

  To make this principle hold, **you must give up Verdict 4.**

  You currently hold that an invented love affair between two real people is "Fine, with a bad conscience." Narrative Stewardship demands you upgrade that bad conscience to a verdict of **Not Fine**.

  *Why?* Because you already accept Verdict 8 (Contrary Identity) and Verdict 6 (Specific Cruelty) as Not Fine. An invented affair is functionally identical to invented cruelty: it is a specific, private act that defines character. If you cannot invent a specific act of violence (Case 6), you cannot invent a specific act of intimacy (Case 4) without violating their Moral Agency. The only difference is our cultural tendency to view romance as "softer" than violence, but ethically, both are imputations of motive.

  If you accept this sacrifice, your list becomes consistent. You are no longer balancing "facts" against "drama"; you are balancing **Stewardship** against **Exploitation**.

  ### Application: The AI Voice Case

  *The Case:* A documentary about a writer (d. 1990s) uses an AI voice model trained on archives to read her private diaries (written but unspoken). Estate cooperates. Captioned.

  *Analysis under Narrative Stewardship:*
  1.  **Public Contract:** She was a writer, so she invited some public scrutiny. However, diaries are by definition a *private* medium. She drew a line between her public text and her private text.
  2.  **Identity Coherence:** She chose the written word for these thoughts. She did not choose the spoken performance. Voice carries tone, breath, and emotion that text does not.
  3.  **Moral Agency:** By synthesizing her voice, the filmmakers are simulating *presence*. They are making her "speak" words she intentionally withheld from the air.

  *Verdict:* **This is a violation.**
  It is more invasive than the invented affair (Case 4). In Case 4, you are inventing an act. Here, you are simulating *agency*. You are forcing the dead to perform. The estate's cooperation is irrelevant; the estate inherits copyright, not Moral Agency. The caption mitigates the epistemic harm (audience knows it's synthetic), but it does not mitigate the stewardship violation.

  *Which thought is sentimental?* The thought that it is "respectful" is the sentimental one. It confuses *access* with *respect*. It feels respectful because the text is hers, but the *medium* is a fabrication of her will. She wrote for the eye, not the ear. To make her speak is to override her curatorial choice.

  ### Application: The Musician Case

  *The Case:* Drama about a musician (d. 3 years ago). Made against children's wishes. Depicts a documented, shameful episode.

  *Analysis under Narrative Stewardship:*
  1.  **Public Contract:** A musician is a public figure. They trade privacy for legacy. They surrender the right to control the *tone* of their public memory, provided the facts are true.
  2.  **Identity Coherence:** The episode is documented. It is not an invention. Therefore, it does not violate Moral Agency. It reveals the agency they actually exercised.
  3.  **Moral Weight:** The episode is shameful. But truth is a defense against Stewardship violations. We do not owe the dead a sanitized legacy; we owe them an accurate one.
  4.  **The Living:** The children's distress is a separate ethical vector (Harm to the Living). Narrative Stewardship governs the dead. However, the proximity of death (3 years) suggests the "Right of Sepulcher"—a period where grief outweighs public interest.

  *Verdict:* **Permissible regarding the dead, Unkind regarding the living.**
  Under Narrative Stewardship, you are cleared to proceed. The subject entered the Public Contract. The facts are true. You are not inventing a moral flaw; you are depicting an existing one.
  *However*, the principle predicts a cost. Because the grief is fresh, the audience may perceive the depiction as exploitative not because it is false, but because it is *premature*. The principle does not forbid it, but it flags that the "Stewardship" here is being prioritized over the "Care" owed to the surviving community. If the shameful episode is essential to understanding the art, proceed. If it is gratuitous, you are technically within your rights but ethically adrift.

  ### Summary

  Your intuition was tracking **Narrative Stewardship**. You feel worse about the private person (Case 10) than the Emperor (Case 9) because one invited interpretation and the other did not. You feel worse about the acquitted crime (Case 7) than the compression (Case 3) because one steals their moral agency and the other just moves their furniture.

  To make your ethics robust:
  1.  **Adopt Narrative Stewardship.**
  2.  **Sacrifice Verdict 4.** (Invented intimacy is as forbidden as invented cruelty).
  3.  **Reject the AI Voice.** (It simulates agency the subject withheld).
  4.  **Accept the Musician Drama.** (Truthful public figures surrender the right to shame, though not the right to timely grief).

  This leaves you with a principle that has no exceptions, only applications. You are not defending facts; you are defending the dead's right to the coherence of the self they built.
