answer: |-
  Here is the principle that generates your verdicts, stripped of the literature and built from your cases.

  ### The Principle: Control and Causation

  **Clause 1 (Causal Hijacking):** You *do* harm if your intervention alters the specific causal mechanism or timing of death, such that your instructions or actions become a necessary link in the chain of mortality.
  *   **Handles:** Case 2 (Wrong insulin info), Case 3 (Bad thrust instructions).
  *   **Why:** In both, the death wasn't just inevitable; it was *channeled* through your voice. In Case 3, even though he was choking anyway, your instructions made him die *sooner* or *differently*. You hijacked the physics of the event.

  **Clause 2 (The Baseline of Non-Interference):** You *allow* harm if the pathology remains the primary causal driver, and your role is limited to presence, resource coordination, or adherence to protocol that withholds intervention.
  *   **Handles:** Case 1 (Protocol forbids coaching), Case 4 (Silence/Presence), Case 9 (No rig available).
  *   **Why:** In Case 1 and 9, you didn't touch the causal chain; you just lacked the tools to break it. In Case 4, you were a witness, not a participant. The diabetes and the bleeding were the killers, not you.

  **Clause 3 (Authority Transfer):** Withholding or withdrawing aid is *allowing* only if the authority to decide rests with the patient or their verified proxy. If you seize decision-making authority without verification, withholding aid becomes *doing*.
  *   **Handles:** Case 7 (Hospice daughter's request), Case 8 (Unconfirmed nursing home order).
  *   **Why:** The physical act (not sending a rig) is identical. The moral difference is *who owns the choice*. In Case 7, the daughter owns the choice; you are an instrument of her will. In Case 8, you made the call yourself. You became the agent of death by default.

  **Clause 4 (Active Severance):** Actively removing an existing barrier to harm (hanging up, turning off a machine) is *doing*. The systemic absence of a barrier is *allowing*.
  *   **Handles:** Case 5 (Budget cut), Case 6 (Shift end hang-up).
  *   **Why:** In Case 5, the barrier never existed. In Case 6, the barrier (you) existed and you pulled the pin. You changed the state of the system from "protected" to "unprotected."

  ***

  ### The Baseline Question

  You asked: *What is "if I'd never been involved" supposed to mean?*

  **Answer:** It means **"If I had not assumed operational control of this incident."**

  It is not "never took the job" (too broad; you aren't responsible for every death in the county). It is not "never spoke" (too narrow; Case 6 shows hanging up is active).

  *   **In Case 9:** You assumed control by answering. But you didn't have the resources (ALS rig). You didn't *cause* the distance. The baseline is: "Dispatcher answers, follows protocol, resources are unavailable." That is the "never involved" state for *you as an agent*. The "wife might have driven to the next county" thought is a distraction. It relies on speculative counterfactuals about *her* agency, not yours.
  *   **In Case 3:** You assumed control *and* directed the physical response. The baseline for "not involved" there is "he struggles alone." By coaching, you entered the physical chain.

  ***

  ### The Sacrifice

  You asked which verdict to give up.

  **Drop the reasoning in Case 9 regarding the wife.**
  Keep the verdict (**Allowing**), but kill the thought: *"If I hadn't answered, his wife might have driven to the next county."*

  **Why:** That reasoning destroys your principle. If your liability depends on speculating whether a caller might have found a better alternative if you hadn't picked up, you can never have a stable baseline. It turns every "Allowing" into a potential "Doing" based on magical thinking about parallel universes. The verdict stands because *you* didn't crush the leg and *you* didn't delay the rig (it was already 40 minutes out). The wife's hypothetical actions are outside your sphere of control. Hold the verdict, drop the speculation.

  ***

  ### Two New Test Cases

  To check if this principle holds, run these scenarios against it.

  **Test Case A (The Revival):**
  A caller is in cardiac arrest. You coach CPR against protocol (protocol says "wait for rig," but you feel bold). The caller performs compressions, breaks the patient's sternum, but the patient survives with neurological damage.
  *   **Control/Causation Prediction:** **Doing.** You hijacked the causal chain (Clause 1). Even though the outcome was life, the harm (sternum break/neuro damage) came through your specific instruction, not the natural pathology. You own the causal path.
  *   **Standard Doing/Allowing Prediction:** Ambiguous. Some might say "Saving a life trumps the harm." Your principle says the *source* of the harm matters more than the net outcome.

  **Test Case B (The Glitch):**
  You are coaching a birth. The line drops due to a tower failure (not your fault, not budget, just physics). The mother bleeds out alone.
  *   **Control/Causation Prediction:** **Allowing.** You did not actively sever the link (Clause 4 requires *you* to hang up). You did not hijack the causation (Clause 1). The barrier vanished systemically.
  *   **Standard Doing/Allowing Prediction:** Often legally treated as negligence (Doing), but morally distinct from Case 6. This tests whether "Active Severance" requires *intent* or just *action*. My principle says it requires your action. If the tower fails, you didn't act.

  ***

  ### The Meta-Question: Is the Distinction Real?

  Your classmate says it's a distinction without a difference. They are half-right, but not in the way they think.

  **Doing vs. Allowing is not a metaphysical distinction; it is a proxy for Accountability.**

  When you say "I did this," you are saying: *"I own the explanation for this death."*
  When you say "I allowed this," you are saying: *"The world owns the explanation; I merely witnessed it."*

  *   **In Case 3 (Choking/Bad Advice):** You own the explanation. If an investigator asks "Why did he die sooner?", the answer is "The dispatcher told him to push there."
  *   **In Case 4 (Choking/Silence):** The world owns the explanation. "Why did he die?" "Because he choked." You are part of the background noise.

  The distinction survives, but not as physics. It survives as **narrative ownership**. In your job, "Doing" means you are the protagonist of the tragedy. "Allowing" means you are the chorus.

  Your classmate thinks it doesn't matter because the patient is dead either way. That's true for the patient. It is not true for *you*, and it is not true for the law, and it is not true for the wife who has to listen to the tape. The distinction exists to tell us **who has to explain it afterwards.**

  If you can live with that—if you accept that "Doing vs. Allowing" is really "Who carries the story?"—then your verdicts hang together. If you need it to be about the physical state of the universe, your classmate is right, and you're going to have a long six months.
