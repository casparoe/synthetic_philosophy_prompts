answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I had the privilege of being one of [Mentor's Name]'s students, and later, something much closer to a colleague.

  Looking around this room, I realize we have a bit of a divide. On one side, we have family and friends who know [Mentor's Name] as a person—the one who burns the toast or tells great stories at holidays. On the other side, we have her former grad students, who know her as the person who could dismantle an argument with a single raised eyebrow.

  I want to try to bridge that gap tonight, using the very thing she spent thirty years teaching. Now, I promise I'm not going to give a lecture. There won't be any jargon, and certainly no reading list at the end. But there is one idea she loved that I think explains why we're all here celebrating her.

  She taught epistemology—which is just a fancy word for the study of how we know what we know. And for thirty years, she had a specific way of explaining the difference between being right and actually *knowing* something.

  She used to say that having a true belief is like having the right map by accident. You guess the turn, you end up at the destination, and you look like a genius. But you don't know why you got there.

  Knowledge, she taught us, is having that map plus understanding why the landmarks line up. It's knowing the terrain so well that when the road washes out, or the town changes its name, or the landscape shifts entirely—you don't get lost. You can still navigate.

  And that is the claim I want to make about her career tonight. It would be easy to say she was just "right" a lot. But in a field that changes as much as philosophy does, being right by accident doesn't last thirty years. Luck runs out. Trends change.

  If she only had true belief, she would have been lost decades ago. But she wasn't. She navigated this department through shifts in the field that left other people stranded. She didn't just give us answers; she taught us how to read the landmarks. She taught us why the arguments held weight, so that when the weight changed, we could adjust.

  To her family: that's why she was so good at everything else, too. It wasn't luck. It was that deep understanding of how things fit together.

  To her students: that's why we're still calling her when we're stuck on a problem. Because she gave us more than a map; she taught us how to look at the ground.

  So, [Mentor's Name], you've spent three decades teaching us how to navigate the landscape of knowledge. Now, you get to choose a new terrain entirely. And knowing you, you've already figured out why the landmarks line up.

  Please raise your glasses. To [Mentor's Name]—may your retirement be filled with new landscapes, and may you always know exactly how to navigate them. Cheers.
