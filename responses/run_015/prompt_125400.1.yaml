prompt: |-
  I'm giving the toast at my mentor's retirement dinner next friday. She taught epistemology for like thirty years, and about half the table are her old grad students who know the Meno problem inside and out, while the other half are family and friends who definitely don't. She always had this specific take on it - not just the usual tether story, but that true belief is like having the right map by accident, while knowledge is having the map plus knowing why the landmarks line up, which is what lets you navigate when the landscape changes.

  I want the toast to actually turn on that distinction: it should shape what I can and can't claim about her career. Like, I should be able to say she knew her field, not just that she was usually right about it, but only if the landmark part actually applies - otherwise I'm just giving her lucky guesses in fancy language. Keep it warm and spoken, not like a seminar, write in American English, and please don't throw in a bibliography or reading list at the end since half the room wouldn't care and the other half already knows. There's probably a typo in here somewhere but thats okay.
