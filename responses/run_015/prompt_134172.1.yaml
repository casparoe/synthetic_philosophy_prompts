answer: |-
  Dear Friend,

  You have asked for a reading of the Enron collapse through the specific architecture of Adam Smith's Theory of Moral Sentiments, and while the temptation is to reach for the language of greed or regulation, Smith offers a more granular psychology of how we judge and are judged. To map the August 2001 memo from Sherron Watkins to Kenneth Lay onto Smith's framework, we must first recognize that sympathy for Smith is not merely pity but an act of imaginative projection, a changing of places in fancy that requires both proximity and information. In the Enron case, the relevant actors form a chain of broken sympathetic links. Watkins attempts to project herself into Lay's situation, imagining his future humiliation and legal peril to motivate his present action. She constructs her memo not merely as an accusation but as an appeal to his self-regard, hoping to activate his impartial spectator by showing him how he would appear to the public if the fraud were revealed. Lay, however, fails to reciprocate this imaginative act. He does not project himself into Watkins's situation of fear and moral distress. Instead, he views her through the narrow lens of institutional loyalty, where her warning is interpreted as a threat to the corporation's stability rather than a rescue of its integrity. The limitation here is informational but also moral; Lay possesses the data but lacks the willingness to inhabit the perspective of the whistleblower because doing so would require him to condemn his own prior approvals.

  Moving outward from this dyad, we must consider the audit committee and the investing public. The audit committee stands in the position of the designated impartial spectator, theoretically possessing the proximity to the books and the distance from daily management required for objective judgment. Yet, in Smithian terms, their sympathy was misdirected toward the management rather than the truth. They imagined the situation of the executives—pressure to meet targets, maintain stock price—rather than the situation of the shareholders who relied on accurate data. Their information was limited not by access but by complexity and deliberate obfuscation, creating a barrier to the imaginative projection necessary for moral judgment. The investing public sits at the furthest remove. For Smith, sympathy diminishes with distance, and the public's view of Enron was mediated entirely through stock prices and press releases. They imagined a situation of robust growth because the signs presented to them—confidence, suits, skyscrapers—were proper signals of success. They could not sympathize with the reality of the collapse because the information asymmetry was engineered to prevent them from changing places with the insolvent entity.

  This brings us to your question regarding propriety and merit, which are distinct judgments in Smith's system. Propriety concerns the fit between the agent's sentiment and the cause that provoked it, while merit concerns the deservingness of reward or punishment based on the beneficial or hurtful effects of the action. Watkins's internal warning satisfies the test of propriety. Her sentiment of anxiety and her urge to speak were perfectly fitted to the cause, which was the existential threat of accounting fraud. Any impartial observer knowing the facts would agree her fear was proportional to the danger. However, this propriety failed to trigger merit-based action because Lay, acting as the judge, did not acknowledge the merit of her intervention. In Smith's view, merit arises when we sympathize with the gratitude of the beneficiary. Lay should have felt gratitude toward Watkins for saving him from ruin, but he did not, because his own impartial spectator was corrupted by his identification with the firm's survival at any cost. Consequently, Watkins received neither the reward of action nor the praise due to her merit. Conversely, Lay's public posture of confidence maintained a veneer of propriety to the distant public. To the investor, a CEO expressing certainty fits the cause of market volatility; it calms the crowd. Yet this posture failed the test of the impartial internal judge. The man within the breast knows the cause of the confidence is false, and thus the sentiment is improper relative to the true cause, even if it appears proper to the outside viewer. Lay's failure was a failure to listen to the internal spectator in favor of the external applause.

  Pushing further into the structural limitations of Smith's model, we must ask if his framework presupposes a face-to-face moral encounter that renders it silent on institutional actors like boards. Smith's ethics are fundamentally interpersonal, rooted in the social interaction of individuals who can observe each other's passions. The board of directors and the audit committee are collective bodies, fictitious persons that cannot feel sentiment in the way Smith describes. There is no single breast for the impartial spectator to inhabit within a committee. Responsibility is diluted across the group, allowing each member to assume another is watching, a phenomenon Smith does not explicitly account for. This suggests that Smith's model misdescribes the diffusion of responsibility in modern governance. It illuminates the psychological failure of the individuals within the board but offers no verdict on the board as an entity, because for Smith, only individuals possess moral agency. The episode reveals that sympathy indeed requires a shared moral community, a set of common norms regarding truth and value, which Enron's culture had deliberately eroded. Smith argues that we learn morality from society, but Enron created a micro-society where mark-to-market accounting was the moral law. Within that closed community, the fraudsters were acting with propriety relative to their internal norms, even as they violated the norms of the broader market.

  The impartial spectator fails in this episode at three specific junctures. First, it breaks down at scale. The complexity of the financial instruments used by Enron exceeded the capacity of the average spectator to understand the cause, making it impossible to judge the propriety of the sentiment surrounding them. Second, it fails under conditions of engineered information asymmetry. Smith assumes that while deception exists, the truth is generally accessible enough for the spectator to correct the agent. Enron proved that information can be weaponized to blind the spectator entirely. Third, and most critically, the impartial spectator fails when the man within the breast is employed by the institution being judged. Smith assumes the internal judge is a proxy for the community's moral standards, but when one's livelihood depends on the institution, the internal judge is bribed by self-preservation. The spectator becomes partial to the employer.

  In conclusion, Smith's model illuminates the psychological mechanics of the failure, specifically how the breakdown of imaginative projection between Watkins and Lay prevented the moral correction of the fraud. It explains why Lay could look in the mirror and not see a criminal, because his spectator was calibrated to the wrong community. However, Smith misdescribes the structural incentives of the corporation, treating it as a collection of individuals rather than a system that can generate immorality independently of individual intent. He offers no verdict on the regulatory environment or the specific mechanics of financial deregulation, as these were outside his scope. Ultimately, the Enron collapse demonstrates that the impartial spectator is vulnerable when the social mirror it relies upon is cracked by institutional complexity and when the cost of listening to that spectator is the loss of one's position within the tribe. Smith gives us the vocabulary for the conscience, but Enron showed us how easily that conscience can be outsourced to the market.

  Yours sincerely,

  The Analyst
