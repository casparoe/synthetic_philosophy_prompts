answer: |-
  # Seminar Plan: The Isolation Problem
  **Topic:** Turing's ESP Objection and the 'Telepathy-Proof' Room  
  **Time:** 90 Minutes  
  **Students:** 16 (4 groups of 4)  
  **Materials:** 4 packs of coloured cards (or paper squares), pens, scrap paper, a bag of chocolate buttons (or merit points).  
  **Instructor Prep:** Print the 'Role Cards' (below). Practise the two signalling methods until they are automatic.

  ---

  ## 1. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide into 4 groups. Assign roles. Distribute materials. **Crucial:** Do not mention the purpose of the test other than "Information Integrity." |
  | **10–30** | **Round 1** | **The Open Protocol.** Groups run the guessing game. You (Instructor) circulate and employ **Signal A**. Success rates will be near 100%. |
  | **30–45** | **Intervention** | Groups discuss anomalies. They must design a "Shielded Protocol" to prevent any external interference. They write down their new rules. |
  | **45–65** | **Round 2** | **The Shielded Protocol.** Groups run the game again under their new strict rules. You employ **Signal B**. Success rates remain near 100%. |
  | **65–90** | **Debrief** | Reveal the signals. Connect the experience to Turing's 1950 paper, the ESP objection, and the problem of unknown channels. |

  ---

  ## 2. Roles and Rules

  Divide the class into 4 groups of 4. Give each student a role card.

  **The Roles (per group):**
  1.  **The Interrogator:** Observes the game. Their goal is to certify whether the result is 'Valid' (generated internally) or 'Contaminated' (externally aided). They award the points.
  2.  **The Source:** Holds the secret information (a coloured card). They must not show the card to the Contestant.
  3.  **The Contestant:** Must state the colour of the Source's card. They claim to be using 'internal processing'.
  4.  **The Marshal:** Enforces the group's rules and keeps time.

  **The Task:**
  *   The Source draws a card (Red or Blue) from a deck.
  *   The Contestant must announce the colour.
  *   Repeat 10 times.
  *   **Payoff Scheme:**
      *   **Group Points:** 1 point for every correct guess.
      *   **Bonus:** If the Interrogator certifies the round as 'Valid' and the group gets 10/10, they get 5 bonus points (chocolate buttons).
      *   **Penalty:** If the Interrogator certifies 'Valid' but the Instructor later reveals a leak, the group loses all points. (This risk is only revealed in the debrief to heighten tension, or you can hint at it: *"Certify carefully."*)

  **Instructor Secret (Do Not Distribute):**
  *   **Round 1 Signal (Visual):** Stand behind the **Source**. Hold up fingers behind their back where the Contestant can see you, but the Interrogator (who is watching the Contestant) might miss. (1 finger = Red, 2 fingers = Blue).
  *   **Round 2 Signal (Auditory):** Stand at the side of the room. Tap your pen on the desk. (1 tap = Red, 2 taps = Blue).
  *   **Goal:** Ensure every group gets 10/10 in both rounds without being caught.

  ---

  ## 3. Running the Activity

  ### Setup (0–10 mins)
  *   Arrange chairs so the Contestant faces the Interrogator, and the Source sits next to the Contestant (standard 'Imitation Game' layout).
  *   Hand out Role Cards.
  *   **Script:** *"You are testing the integrity of an information channel. Your goal is to determine if the Contestant is generating answers internally or receiving them externally. Interrogators, you have the final say on validity. If you certify a round as Valid, you are staking your group's score on it."*
  *   **Do not** mention telepathy, cheating, or Turing.

  ### Round 1: The Open Protocol (10–30 mins)
  *   Let the groups begin.
  *   Circulate casually. Position yourself behind the Sources.
  *   Use **Signal A** (Fingers).
  *   Watch the Interrogators. Some will look suspicious. If an Interrogator looks like they are about to call 'Contaminated', subtly change your position or stop signalling for two turns to create ambiguity, then resume.
  *   **End of Round:** Ask Interrogators to sign a 'Validity Certificate' for their group. Collect the scores. Most should be 10/10.

  ### Intervention: Designing the Shield (30–45 mins)
  *   **Script:** *"Scores are suspiciously high. In a real test, high accuracy suggests either exceptional capacity or a compromised channel. Before Round 2, your group must design a 'Shielded Protocol'. You must list specific physical constraints to ensure no information leaves the Source or enters the Contestant except via the official channel."*
  *   Students will propose: Blindfolds, turning chairs back-to-back, silence, moving the teacher away, etc.
  *   Write their rules on the board. Acknowledge them as the new "Law of the Room."

  ### Round 2: The Shielded Protocol (45–65 mins)
  *   Enforce their rules strictly. If they said "Teacher must stand at the back," you stand at the back.
  *   Use **Signal B** (Pen Taps). Ensure the rhythm is distinct.
  *   Because the students are focused on *visual* leaks (having just blocked your fingers), they often miss auditory ones.
  *   Scores will again be 10/10.
  *   **End of Round:** Collect the new Validity Certificates.

  ### The Reveal (65–70 mins)
  *   Ask the Interrogators: *"Are you certain the channel was clean?"*
  *   Reveal **Signal A**. Ask who saw it. (Some will have, some won't).
  *   Reveal **Signal B**. Ask who heard it. (Most won't have).
  *   Explain that *you* were the external channel in both cases.
  *   Distribute the chocolate/points regardless of the 'penalty' rule (keep morale high for the philosophy).

  ---

  ## 4. Debrief Guide (70–90 mins)

  Do not lecture. Use their frustration to drive the points.

  **1. The Ambiguity of the Verdict (5 mins)**
  *   *Ask:* "In Round 1, you saw 10/10 success. What did that evidence prove?"
  *   *Expected Answer:* "The Contestant was good." / "The system was leaking."
  *   *Point:* The *same* empirical result (10/10) supports two contradictory theories (Capacity vs. Leak). The data underdetermines the conclusion.

  **2. The Move to Restrict the Channel (5 mins)**
  *   *Ask:* "How did you try to fix it in the Intervention phase?"
  *   *Expected Answer:* "We blocked the eyes," "We enforced silence."
  *   *Point:* This is exactly Turing's move. He doesn't deny ESP; he says, "Let's make the room telepathy-proof." You tried to make the room 'Signal-proof'.

  **3. The Assumption of No Leak (5 mins)**
  *   *Ask:* "Why did Round 2 fail to stop the leak?"
  *   *Expected Answer:* "We didn't think about sound," "You changed the method."
  *   *Point:* To design a shield, you must assume you know *how* the leak works. You blocked visual signals because you saw me use visual signals. Turing notes that to block telepathy, you must assume you know the physics of telepathy (e.g., 'lead-lined rooms').

  **4. Unknown and Unimaginable Channels (5 mins)**
  *   *Ask:* "If I had used a third signal—say, I changed the temperature of the room, or used ultrasound—would your protocol have caught it?"
  *   *Point:* You can only test against channels you can imagine. If ESP exists but operates on physics we don't understand, we cannot design a test to rule it out. Therefore, the Imitation Game's verdict always rests on a background assumption: *'No unknown channels exist.'*

  **5. Connecting to Turing (5 mins)**
  *   Now, and only now, introduce the text.
  *   *Quote:* Turing, Section 4 (The Argument from Extrasensory Perception).
  *   *Explain:* Turing takes ESP seriously. He says if ESP is real, the Imitation Game is broken. His solution is the 'telepathy-proof room'.
  *   *The Sting:* The class just proved that a 'proofed room' is only proof against *known* intrusions. If the 'machine' (or human) has access to a channel we can't conceive of, the test is void. Turing essentially says: "Let's assume ESP doesn't exist for the sake of the argument," because proving the negative is impossible.

  ---

  ## 5. Honest Note: What Will Predictably Go Wrong

  1.  **Timing Overruns:** The Intervention phase (designing the shield) often drags as students debate rules.
      *   *Fix:* Be a strict Marshal yourself. Cut them off at 15 minutes. Say, "Implement your best guess, we need data."
  2.  **The Signal is Too Obvious:** If you are too blatant with the fingers, Interrogators will call 'Contaminated' immediately, ruining the tension.
      *   *Fix:* Keep your hands low. Use the Source's body as a shield. If a group catches you, acknowledge it quietly ("Good observation") but encourage them to see if their *rules* stop it in Round 2.
  3.  **The Signal is Too Invisible:** If they miss Round 1 entirely, they won't feel the need to build a shield.
      *   *Fix:* Ensure Round 1 success is 100%. If a Contestant hesitates, give the signal more aggressively.
  4.  **Someone Asks About Turing Early:** A keen student might guess the seminar topic.
      *   *Fix:* "We will discuss the theoretical context at the end. For now, treat this as a data integrity problem."
  5.  **Cynicism:** Students might feel "tricked" rather than enlightened.
      *   *Fix:* In the debrief, validate their suspicion. "You were right to be suspicious. The point is that *scientific suspicion* is never exhaustive."

  ---

  ## 6. What This Activity Cannot Reproduce

  **The Ontological Weight of ESP.**
  In this activity, the "leak" is a mundane physical signal (fingers, sound) that *could* have been discovered with enough vigilance. Turing's worry is about a channel that might be *principally* undetectable by physical instruments (true telepathy).
  *   **What you must supply:** In the debrief, you must explicitly state: *"In our game, the leak was physical and detectable. Turing's worry is about a leak that might be undetectable in principle. If such a thing existed, no amount of chair-turning or lead-lining would help. That is why he ultimately brackets the issue rather than solving it."*

  **The Machine's Perspective.**
  The activity focuses on the *Judge's* uncertainty. It does not simulate the *Machine's* experience of being falsely accused (or falsely credited) due to ESP.
  *   **What you must supply:** Remind them that for the Machine, the injustice is that its genuine computational work might be dismissed as 'telepathic cheating', or vice versa. The test fails the Machine not because it isn't intelligent, but because the environment is noisy.

