  8.  **Final Polish:** Organize by severity. Ensure clear "Abandon" vs. "Refine" instructions. (Proceed to generate response).

      *   *Wait, one nuance on (6):* The user says "being the kind of person..." carries no weight. Williams might agree that *mere* psychological fact isn't enough, but he argues ground projects are *constitutive* of agency. So (6) might be interpretable charitably, but as written, it undermines (1). I need to point out that distinction.
