          *   *Tension:* If you must abandon them, does that mean in those cases the agent *is* treated as replaceable? Or is (4) a tragic remainder?
          *   *Severity:* Low-Medium. Williams acknowledges "moral luck" and tragedy. He doesn't say integrity *never* yields, but that it shouldn't be *systematically* subordinated.

