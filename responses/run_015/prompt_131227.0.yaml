          *   Tertiary Fix: Qualify (5).

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I address the "gauge-invariance" specifically? Yes, need to explain why physical invariance is descriptive, but moral integrity is prescriptive.
