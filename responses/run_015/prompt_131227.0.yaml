      *   **(3) Integrity as Gauge-Invariance:** Integrity = stability of core commitments across belief/plan revisions. Value lies in system coherence, not welfare maximization. (Scientific analogy).
      *   **(4) Catastrophic Override:** In mass harm scenarios, moral demand overrides integrity, even if it fractures identity.
      *   **(5) Scope of Objection:** Williams only bites against *direct* act-utilitarianism. Indirect/sophisticated forms escape it.
