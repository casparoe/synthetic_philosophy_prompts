      *   *The "Finger" verdict* is the most vulnerable because it risks collapsing into the utilitarianism she rejects for persons. If we weigh a finger against a life, we are aggregating.
      *   *Wait, the "Demented Human" evasion* is the one to push. She knows it's weak.
      *   *Let's look at the "Finger" again.* She went quiet. That indicates cognitive dissonance. It's the "marginal superiority" clause. Is a finger marginal?
      *   *Better candidate:* **The "Chimp vs Pig" verdict.** She ranks by capacity. But if capacity is the metric, why does the Human/Chimp line hold so firmly when capacities overlap (infants, disabled)?
      *   *Decision:* The **Index Finger** verdict is the least stable *internally*. It threatens the "non-aggregation" principle. If a chimp's life can be traded for a finger, the chimp is very low status. But if 10 chimps can't save a human, they are high status. There's a tension there.
      *   *Actually, the prompt asks which existing verdict is least stable to push on.* The **Demented Human** evasion is the obvious target, but she's already guarded. The **Index Finger** is where she hesitated. Pushing the "Finger vs Life" ratio might crack the "Meaningful Life" threshold.
      *   *Alternative:* The **1 Human vs 10 Chimps**. If she refuses aggregation for animals, why does she allow the chimp to die for the finger? That implies *some* weighing.
