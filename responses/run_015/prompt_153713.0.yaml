answer: |-
  Here is the argumentative map you require, drafted in the orthography your supervisor prefers.

  ### 1. Predicted Verdicts on the Uplifted Chimp (U)

  Based on her track record, she is operating with a hybrid view that prioritises *kind* over *capacity* when the stakes are high, but uses *capacity* to rank within the animal kingdom. She treats the human/animal boundary as a moral cliff-edge rather than a slope.

  *   **U vs. Normal Adult Human:** She will favour the **Human**.
      *   *Reasoning:* She will likely argue that U's capacities, however functionally identical, are derivative or 'mimicked'. She will cling to the species-norm: to be a 'person' in the Nozickian sense is to be a member of the kind *Homo sapiens*, not merely to exhibit person-like traits. The 'gene-edited' origin story will be used to suggest U lacks the natural teleology required for full inviolability.
  *   **U vs. Demented Human:** She will favour the **Demented Human**.
      *   *Reasoning:* This is where her evasion last time becomes a commitment. She will argue that the demented human retains moral status through *biographical continuity* (she *was* a person, and is loved by persons), whereas U lacks the requisite history. U's 39 years as a standard chimp will be counted against her; she is a 'new' person in an 'old' animal body.

  ### 2. Three Competing Interpretive Rules

  Her verdicts are consistent with at least three distinct principles. Your task is to show that U forces these principles apart.

  **Rule A: Species-Norm Essentialism**
  *   *The Principle:* Moral status is determined by the biological kind to which a creature belongs. Normal humans are side-constrained; non-humans are not, regardless of individual psychological variation.
  *   *Fits:* 1 Human vs. 1 Chimp; 1 Human vs. 10 Chimps; Chimp vs. Pig (ranking kinds); Chimp for Liver (human kind trumps animal kind).
  *   *Fails:* It struggles to explain why the Chimp is saved from the Eczema case without admitting some independent weight to animal suffering that isn't just 'human benefit'. It also requires ignoring the overlap in capacities between infants/disabled humans and higher mammals.

  **Rule B: Current Capacity Functionalism**
  *   *The Principle:* Moral status tracks actual psychological capabilities *now*. If you have a self over time, projects, and language, you are side-constrained. If you do not, you are weighable.
  *   *Fits:* Chimp vs. Pig (capacity ranking); Chimp for Eczema (low human benefit doesn't outweigh chimp pain); potentially U vs. Demented Human (if U wins).
  *   *Fails:* 1 Human vs. 10 Chimps (if chimps aggregate to outweigh human interest); 1 Human vs. 1 Chimp (if the chimp is exceptionally gifted or the human marginally impaired). It contradicts her refusal to aggregate.

  **Rule C: Biographical/Historical Continuity**
  *   *The Principle:* Moral status depends on the trajectory of the life. A being that has *been* a person retains status (the demented human); a being that *becomes* a person late (U) acquires it only prospectively or partially.
  *   *Fits:* The evasion on the Demented Human; the hesitation on the Finger (disrupting a life narrative); U vs. Normal Human (Normal Human has full history).
  *   *Fails:* It struggles with the Chimp vs. Pig case (do pigs have biographies?); it makes moral status oddly dependent on the past rather than the present vulnerability.

  ### 3. Where They Diverge on U

  The Uplifted Chimp is a wedge because she possesses the *Capacity* of a person (Rule B), the *History* of an animal (Rule C), and the *Species* of an animal (Rule A).

  *   **In U vs. Normal Human:** Rule A and C favour the Human; Rule B suggests a tie or a coin toss. Her prediction to save the Human relies on A and C trumping B.
  *   **In U vs. Demented Human:** Rule A favours the Human; Rule C favours the Human (past personhood); Rule B favours U (current capacity). If she saves the Demented Human, she confirms that *origin* matters more than *current experience*. If she saves U, she admits that Species-Norm Essentialism is false.

  ### 4. The Decisive Further Case

  To force her hand, you must sever the link between 'Species' and 'History of Personhood'. You need a human who has the species but lacks the history, pitted against U who lacks the species but has the capacity.

  **Put this case to her:**
  > **The Feral Human vs. U.**
  > Consider a 40-year-old human being, biologically *Homo sapiens*, but raised in isolation from birth (a 'wolf child'). She has never acquired language, never formed long-term projects, and has no narrative sense of self. She is currently in a vegetative state of mere sentience. Oppose her against U (the uplifted chimp with full person-capacities). One must die.

  *   **Why this works:**
      *   If she saves the **Feral Human**, she is a pure **Species-Norm Essentialist**. She admits that biological humanity alone grants inviolability, even without any of the 'meaningful life' capacities Nozick lists. This makes her view vulnerable to the charge of speciesism devoid of moral justification.
      *   If she saves **U**, she concedes that **Capacity** trumps Species. This collapses her defence of the Normal Human vs. Chimp cases where capacities might overlap (e.g., neonates).
      *   If she hesitates or tries to aggregate, she undermines her 'no aggregation' rule.

  This case removes the 'loss of status' (dementia) and the 'artificial enhancement' (grafts) variables. It isolates the *kind* vs. *capacity* question starkly.

  ### 5. The Least Stable Existing Verdict

  The verdict you should push is the **Chimp killed to save a Human's index finger.**

  *   **Why:** She went quiet before assenting. This is the crack in the armour.
  *   **The Instability:** This verdict implies a exchange rate between animal life and human minor interests. If a chimp's life can be traded for a finger, the chimp's moral weight is low. But if 10 chimps cannot be traded for 1 human life (her 1 vs. 10 verdict), the chimp's moral weight is high enough to block aggregation.
  *   **The Argument:** Press her on the *marginality* clause. Nozick says the superiority must not be merely marginal. Is a finger 'marginal' compared to a life? If she says yes, she risks justifying the sacrifice of the demented human for a finger (since the demented human has reduced capacity). If she says no, she must explain why a finger outweighs a chimp's entire future narrative.
  *   **Strategy:** Use the Finger case to loosen her commitment to the 'Human Trumps All' hierarchy. If you can get her to admit that the finger case was too harsh, you create space for U to claim rights in the Demented Human case. It is the one point where her utilitarianism for animals bleeds into a calculus that looks uncomfortably like the aggregation she forbids in the 1 vs. 10 case.

  **Summary of Attack Plan:**
  1.  Present U. Predict she will save the humans (based on Species/History).
  2.  Deploy the **Feral Human** case to show that Species alone is insufficient for the 'meaningful life' defence.
  3.  Undermine her confidence by revisiting the **Index Finger** verdict, showing that her weighting of animal life is inconsistent (aggregation forbidden, but life-for-finger permitted).

  This should compel her to either abandon the Nozickian distinction (unlikely) or refine it in a way that grants U more status than she currently intends.
