  8.  **Identify the Least Stable Existing Verdict:**
      *   *Chimp killed for Human index finger.* She went quiet. This suggests the "marginal superiority" clause is doing heavy lifting. Is a finger worth a life? Nozick says we can't sacrifice persons for fingers. But animals?
      *   *The Demented Human evasion* is the most obvious gap, but she already knows it's weak (hence evasion).
      *   *The Finger Case* is the one she might not realise undermines the "Meaningful Life" threshold. If a chimp can die for a finger, the chimp's interest in living is very low. But if a chimp can't die for eczema, there is a threshold. Where is it?
