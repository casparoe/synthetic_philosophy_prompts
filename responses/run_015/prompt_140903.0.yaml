      *   *Feature:* **Path-Dependent Efficacy.** (Or "Sunk-Cost Leverage"). Her past compliance creates a unique capacity that makes future compliance *more* obligatory.
      *   *Removal:* If efficacy was constant or diminishing, the "convergence" reply works (eventually the cost outweighs the good). With path-dependence, the gap widens.
