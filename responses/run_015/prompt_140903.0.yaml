answer: |-
  ### The Case: The Relational Lock-In

  Elena is the regional administrator for a humanitarian aid clinic in a volatile, resource-poor district. She is not a founder, nor a moral saint; she took the job for standard professional reasons. However, the clinic's efficacy is path-dependent on her specific tenure. In Year 1, her competence stabilizes supply lines, saving 500 lives at the cost of missing a family wedding (a significant but non-ruinous sacrifice). Because she stayed, local distributors now trust *her* signature exclusively, unlocking access to remote villages in Year 2; staying another year saves 1,500 lives at the cost of deferring a career move back home (again, significant but manageable). Because she secured that access, an international donor offers a matching grant in Year 3 that is contingent on her continued oversight; staying saves 5,000 lives at the cost of foregoing a permanent return to her home country. At every stage, the marginal good of staying exceeds the marginal good of leaving, and the marginal good *increases* with each year of compliance due to accumulated trust and unlocked funding tiers. The marginal cost to Elena remains roughly constant (one year of her life) or rises slightly, but never reaches a point of "ruin" in isolation. Yet, leaving at any point $t$ wastes the specific efficacy built at $t-1$.

  ### 1. The Consequentialist Ratchet (Act Consequentialism)

  *   **Round 1 (The Extension):** AC requires Elena to extend her contract. The cost (missing a wedding) is outweighed by the benefit (500 lives). Refusal is sub-optimal.
  *   **Round 2 (The Access):** Because she completed Round 1, she now possesses unique relational capital. AC requires her to extend again. The cost (career deferral) is outweighed by the increased benefit (1,500 lives). Refusal wastes the trust built in Round 1.
  *   **Round 3 (The Grant):** Because she completed Round 2, she unlocks the matching grant. AC requires her to extend indefinitely or for the grant duration. The cost (permanent relocation) is outweighed by the exponential benefit (5,000+ lives).
  *   **The Trap:** At no point can Elena say, "I have done enough." To stop at Round 2 is to render the specific value of Round 2 (the access) partially inert, because it requires Round 3 to reach its full potential. AC demands she continue until the marginal cost finally exceeds the marginal good. In this structure, because efficacy *grows* with tenure, that crossover point may never arrive before her life is entirely consumed by the role.

  ### 2. Testing the Escape Hatches

  *   **Satisficing Consequentialism:** This view suggests agents need only produce "good enough" outcomes, not the *best*.
      *   *Verdict:* **Fails.** In this case, "good enough" is arbitrary. If saving 500 lives is "good enough," why was Round 1 obligatory? If Round 1 was obligatory because 500 > 0, then Round 2 is obligatory because 1,500 > 500. To stop at Round 1 requires setting a threshold that ignores the *available* 1,500. Given the ratchet, any fixed threshold looks like an arbitrary refusal to save lives you *could* save at acceptable cost.
  *   **Agent-Centred Prerogative (ACP):** This allows agents to weight their own interests higher than the impartial good (e.g., Scheffler's multiplier).
      *   *Verdict:* **Strained.** If Elena weights her interests 2x, she might skip Round 1. But if she complies with Round 1 (perhaps out of initial enthusiasm), the ACP doesn't automatically trigger a "stop" signal at Round 2. Since the good *increases* (500 $\to$ 1,500 $\to$ 5,000), the impartial good quickly overwhelms even a generous multiplier. The ACP stops the ratchet only by fiat ("I value my life 100x"), which seems ad hoc given that each individual step was initially deemed acceptable.
  *   **Rule Consequentialism (RC):** This asks what code of rules, if generally adopted, would maximize good.
      *   *Verdict:* **Changes the Subject (Your suspicion is correct).** RC would likely endorse a rule like "Administrators serve 2-year terms then rotate" to prevent burnout and dependency. This stops the ratchet. However, it does so by ignoring the *particular* facts of Elena's case (where she *isn't* burning out and the good *is* increasing). RC sacrifices the optimal outcome in *this* instance to protect the system *generally*. It answers "What should the institution demand?" rather than "What should Elena do given she is already here?" It dissolves the objection by shifting the locus of evaluation from the act to the rule.

  ### 3. The Core Feature

  *   **Feature:** **Path-Dependent Efficacy (or "Sunk-Cost Leverage").**
      The moral demand at time $t$ is a function of the compliance at time $t-1$. The obligation escalates *because* she obeyed the previous obligation.
  *   **Removal:** If you remove this and make returns **diminishing** (standard case), the "convergence reply" works: eventually, the cost of another year outweighs the few extra lives saved, and AC releases her. If you remove it and make returns **constant**, the "overdemandingness" objection remains, but it becomes a static calculation of total life vs. total good.
  *   **Distinction:** Without path-dependence, this collapses into the **Standard Overdemandingness Objection** (the "too much" problem). With path-dependence, it becomes the **"No Exit" Objection**. The complaint isn't just that the price is high, but that the market changes every time she pays it, preventing her from ever cashing out her moral credit.

  ### 4. The Steelman Consequentialist Reply

  **The "Preservation of Future Capacity" Argument.**
  A sophisticated Act Consequentialist argues that the case description is empirically unstable. Even if Elena *feels* resilient, a demand structure that consumes her entire life inevitably reduces long-term efficacy. If AC demands she stay indefinitely, it risks a catastrophic collapse later (health crisis, resentment, loss of perspective) that would negate all accumulated good. Therefore, AC *actually* demands she set a boundary *now* (e.g., "I will do 3 years") to preserve her long-term ability to do good, perhaps by training a successor. The "increasing returns" are an illusion if they rely on a single point of failure (Elena). True maximization requires building a system that doesn't need her, which implies she must eventually leave. Thus, AC demands she stop, not because the good stops, but because *her* necessity is a failure state.

  ### 5. Confidence & Uncertainty

  *   **Confidence in Case Construction:** **High.** The "Relational Lock-In" is a documented phenomenon in development economics and NGO management (the "key person" problem). It satisfies the constraint of increasing returns without magic.
  *   **Confidence in Escape Hatch Analysis:** **High.** The analysis of RC is standard; the failure of Satisficing/ACP in ratchet cases is a known vulnerability in those frameworks.
  *   **Uncertainty (The Distinctness Claim):** **Medium.** I am least sure whether the "Ratchet" is a genuinely distinct philosophical objection or just a **dynamic illustration of the Standard Objection**.
      *   *Reasoning:* The Standard Objection claims AC demands too much *overall*. The Ratchet shows *how* it demands too much (by moving the goalposts). If the total sacrifice is the same, does the *structure* of the demand matter morally? Some argue the *process* of being trapped is a distinct harm (autonomy violation); others argue only the *outcome* (total life lost) matters. If only the outcome matters, this is just the Standard Objection with extra steps. If the *experience* of the ratchet matters, it is distinct. I flag this as the point most open to challenge in your paper.
