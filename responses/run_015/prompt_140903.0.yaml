      *   *Round 3:* Indefinite/Permanent. Cost: Career reset, never return. AC: Required (Her departure collapses the network, negating previous gains).
      *   *Logic:* At every step $t$, $Cost(t+1) > Cost(t)$, but $Good(t+1) > Good(t)$ by a larger margin due to the unlocked potential.

  4.  **Testing Escape Hatches (Task 2):**

      *   *Satisficing:* "Good enough." Problem: In this case, "good enough" is arbitrary. If she can save *more* lives by staying, and the cost isn't "ruinous" (by definition of the ratchet), why stop? The threshold looks like a disguised limit.
      *   *Agent-Centred Prerogative (ACP):* Scheffler-style. Weight personal projects higher. Problem: The ratchet is designed so each step is *individually* justifiable against the prerogative. If the prerogative allows skipping Round 1, fine. But if she did Round 1, does the prerogative allow stopping at Round 2? If the good is vastly higher, the prerogative might be overwhelmed. It stops the ratchet only by fiat ("I value my life 2x"), which feels arbitrary against the escalating good.
      *   *Rule Consequentialism (RC):* "What if everyone did this?" Problem: The prompt suspects RC changes the subject. Analysis: RC would likely say "A rule requiring indefinite sacrifice leads to burnout/collapse." So RC stops it. But is that cheating? It shifts from "maximize good in *this* case" to "follow the rule that maximizes good *generally*." This confirms the user's suspicion: it addresses systemic stability, not the specific moral pull of *this* opportunity.

