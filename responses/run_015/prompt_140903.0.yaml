  7.  **Confidence & Uncertainty (Task 5):**

      *   *Confidence:* High on the case construction. Medium-High on the RC analysis.
      *   *Uncertainty:* Whether this is truly a *distinct* objection or just a vivid illustration of the "Overdemandingness" objection. Most philosophers treat "no stopping point" as the core of demandingness. The "ratchet" adds a dynamic element (compliance breeds obligation), but logically it might just be a specific instance of the "marginal utility doesn't drop" problem. I need to be honest about this.

