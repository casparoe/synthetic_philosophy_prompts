      *   *Argument:* The "Burnout/Replacement" Calculation.
      *   Even if *she* is more effective, if the demand forces her out eventually via collapse, the long-term utility is lower. Therefore, AC actually demands she set boundaries *now* to preserve long-term efficacy.
