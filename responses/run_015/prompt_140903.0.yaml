      *   *Critique:* Is this "increasing returns"? Yes, her marginal impact grows because her specific presence unlocks new tiers of efficacy.
      *   *Critique:* Is it realistic? Yes, "key person risk" is real in NGOs.

  3.  **Running the Rounds (Task 1):**

      *   *Round 1:* 6-month extension. Cost: Miss family wedding. AC: Required (Small cost, significant lives saved).
