answer: |-
  ### 1. Exam Question Stem

  **Question 4**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 1,200 words

  **The Case of Aunt Hillary and the Mound Readout**

  Consider "Aunt Hillary," a system consisting of a large ant colony and its mound. When signals are tapped on the mound's surface, the colony's coordinated activity produces replies over hours, sustaining complex conversation. You are to assume this behavioural description is accurate. No knowledge of Hofstadter's *Gödel, Escher, Bach* is required or rewarded; treat this as a standalone case.

  Field myrmecologists install a "Mound Readout," a sensor array tracking pheromone concentrations and traffic rates across the mound's galleries in real time. It yields two findings:

  **Finding One:** The best predictive model of the colony's behaviour must posit a single, slow-moving variable that tracks the colony's nutritional deficit and defensive posture. This quantity is represented by no individual ant, stored in no single location, and is realized in the large-scale chemical gradient of the mound and the traffic rates through specific galleries. The colony's foraging and relocation decisions are regulated by this variable. It appears to be a colony-level self-model.

  **Finding Two:** The control is thoroughly decentralized and the self-model is dispensable. When myrmecologists destroy the galleries carrying the gradient, no ants die and behaviour degrades only briefly, recovering within a fortnight. Furthermore, a neighbouring colony, "Aunt Beatrice," whose architecture relies on purely local rules with no such integrated variable, is behaviourally indistinguishable from Aunt Hillary over months (though not over minutes).

  **The Task:**
  Which of these findings, if either, should change anyone's mind about whether Aunt Hillary is a subject of mental states (a "mind")? Explain why that finding carries the argumentative weight, rather than merely serving as evidence for a view you held prior to reading the findings.

  In your answer, you must address:
  1.  What criterion fixes the boundaries of a subject of mental states, and how it applies here.
  2.  The fact that the self-model is realized partly in the mound and traffic (does the subject swallow the ecosystem?).
  3.  A verdict on Aunt Beatrice (does functional equivalence over months suffice?).
  4.  The proliferation worry (why sub-colonies or the wider ecology do not also count as minds).
  5.  Whether this dispute is substantive or merely verbal once the "real patterns" are granted.

  ***

  ### 2. Model Answer

  **Thesis:** Finding One is decisive for mentality; Finding Two is merely about robustness. Aunt Hillary is a mind because Finding One demonstrates *causal unity* via a self-model, whereas Aunt Beatrice is a mere aggregate of behaviours lacking a unified perspective.

  To count as a single subject rather than a collection of agents, a system must possess a unified locus of control that integrates information for the sake of the whole. Finding One provides this: the global variable acts as a "self-model." It represents the colony's state *to* the colony, regulating behaviour based on global needs rather than local stimuli. This satisfies a functionalist criterion for subjecthood: the system acts on representations of its own condition. Finding Two, by contrast, shows only that the system is robust. The ability to recover function after damage (plasticity) is a feature of many non-mental systems (e.g., thermostats with backups). Therefore, Finding One carries the weight because it establishes *interiority*—a state belonging to the collective—whereas Finding Two addresses only *durability*.

  This raises the problem of realization and boundaries. The self-model is realized in chemical gradients and traffic rates, partly outside the ants' bodies. Does the subject extend into the dirt? Yes, but only to the limit of the causal integration. The mound is part of the cognitive vehicle, much like a notebook is for a human using extended cognition. However, the subject does not swallow the surrounding ecosystem because the gradient's causal power drops off at the mound's perimeter. The boundary is fixed not by skin, but by the closure of the control loop. Where the gradient stops regulating behaviour, the mind stops. This prevents arbitrary expansion: the ecosystem affects the colony, but the colony does not regulate the ecosystem via a shared self-model.

  This distinction resolves the case of Aunt Beatrice. Beatrice is behaviourally equivalent over months but lacks the integrated self-model. She is a "zombie" colony. If mentality requires a unified perspective (a point of view), Beatrice lacks it. She simulates the output of a mind via local rules (like a lookup table), but she possesses no internal state that represents *her* condition. Functional equivalence over long timescales is insufficient if the internal architecture is merely parallel processing without integration. The difference is not ad hoc; it is the difference between *having* a belief (a state regulating action) and *acting as if* one has a belief (dispositional output without the mediating state). Finding One confirms Hillary has the state; Beatrice does not.

  This criterion also solves the proliferation worry. One might argue that sub-colonies within Hillary, or the ecosystem around her, also form "real patterns." However, real patterns are not sufficient for subjecthood; *causal closure* is. A sub-colony (e.g., a cluster of nurses) does not possess a self-model regulating the whole; it is a subsystem serving the larger variable. Similarly, the wider ecology admits descriptions, but lacks the feedback loop where the ecology represents *its own* state to regulate itself. Hillary is a subject because the variable creates a "self" that persists through time; the sub-components are merely parts of that vehicle.

  Finally, is this dispute substantive? If both sides grant the real patterns (the gradients, the behaviour), does arguing over "mind" become verbal? No, because the stakes concern moral status and explanation. If Hillary is a subject, harming the mound is harming *her*, not just destroying property. If she is merely an aggregate, the moral calculus changes. Furthermore, explaining her behaviour requires referencing the self-model; explaining Beatrice's requires only referencing local rules. The phenomenality—the "what it is like"—is not an extra ghostly ingredient; it is the first-personal correlate of that integrated self-model. To deny Hillary is to deny that integration yields experience. Thus, the dispute is substantive: it turns on whether causal unity constitutes a subject. Finding One proves unity; Finding Two is irrelevant to it.

  ***

  ### 3. Marking Scheme (Out of 20)

  **1. Criterion for Subjecthood (4 marks)**
  *   **Required:** Identifies a specific condition for unity (e.g., causal integration, self-model, unified locus of control) and argues why Finding One meets it while Finding Two does not.
  *   **Common Error:** Treats Finding Two (robustness/recovery) as equally weighty, or defines subjecthood vaguely as "complex behaviour" without explaining *unity*.

  **2. Realization & Boundaries (4 marks)**
  *   **Required:** Acknowledges the vehicle extends into the mound/traffic but articulates a stopping point (e.g., causal closure, loop limits) to prevent the subject from absorbing the ecosystem.
  *   **Common Error:** Either insists minds must be skull-bound (ignoring the prompt's realization data) or allows the mind to expand indefinitely into the environment without a principled boundary.

  **3. The Beatrice Verdict (4 marks)**
  *   **Required:** Delivers a clear verdict on Beatrice (Mind or No Mind) and justifies it via internal architecture vs. external output. Must explain why long-term equivalence doesn't override the lack of a self-model.
  *   **Common Error:** Claims Beatrice is identical because "behaviour is all that matters" (ignoring Finding One's implication) or dismisses Beatrice without explaining why the architectural difference isn't ad hoc.

  **4. Proliferation Worry (4 marks)**
  *   **Required:** Explains why sub-systems (sub-colonies) or super-systems (ecology) don't count as subjects despite having "real patterns." Must distinguish pattern from subject.
  *   **Common Error:** Denies sub-systems have patterns (factually wrong per prompt) or fails to explain why a pattern doesn't automatically equal a mind.

  **5. Meta-Level/Substantivity (4 marks)**
  *   **Required:** Takes a stance on whether the debate is verbal or substantive. If substantive, identifies the stake (moral status, explanatory power, or the nature of phenomenality).
  *   **Common Error:** Dismisses the question as "just semantics" without arguing why, or assumes phenomenality is a magic extra ingredient rather than a function of the integration described.

  ***

  ### 4. Diagnosis of the "B Ceiling"

  You are correct that the "B" answer preserves the student's pre-existing view, but the deeper structural failure is **theoretical inertia**.

  A B-level student treats the two Findings as a buffet: they select the finding that supports their pre-seminar intuition (Functionalist? Pick Finding One. Biological Naturalist? Pick Finding Two) and treat the other finding as a minor complication to be explained away. They do not allow the *tension* between the findings to force a refinement of their metaphysics.

  Specifically, the B answer fails to **prioritize**. It says, "Finding One supports X, but Finding Two suggests Y, so overall X." The A answer argues, "Finding One is *constitutive* of mind, while Finding Two is merely *contingent*," thereby establishing a hierarchy of evidence. The B student answers both findings to preserve their view; the A student weighs the findings to *construct* the view. If the student does not explicitly argue why one finding matters *more* than the other for the definition of a subject, they cannot rise above the B range.
