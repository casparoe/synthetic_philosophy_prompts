answer: |-
  You are a department head. Last month, an auditor forecasted your disposition regarding emergency transfers. If she forecasted 'Pay', she locked a $22k contingency fund releasable only by your current authorization; if 'Don't Pay', she left it empty. You don't know which. Today, you receive a demand note for $500. The auditor's rule: she sends the note iff (a compliance violation exists and you will pay) OR (no violation exists and you won't pay). A violation is a settled fact from last quarter, costing $21.5k if unresolved. You cannot verify the violation or the fund. The auditor's forecast accuracy is 90%. You must authorize the $500 transfer now or refuse. The transfer channel is unique: authorizing pays the demand and unlocks the contingency; refusing does neither.

  **Mapping**
  *   **Mugger/Blackmailer:** The Auditor (unified role).
  *   **Closed Branch:** The contingency fund allocation (fixed last month based on forecast).
  *   **Prediction:** 90% accurate forecast of your current decision.
  *   **Bad State:** The compliance violation (exists or not, fixed).
  *   **Act:** Authorizing the $500 transfer.

  **Removal Test**
  *   **Delete XOR (Textbook CM):** Note sent regardless. Fund exists iff Forecast=Pay.
      *   *CDT:* Paying doesn't change past allocation. Cost $500. **Don't Pay.**
      *   *EDT:* Paying is evidence Forecast=Pay. Expected Gain 0.9×$22k > $500. **Pay.** (Note: Textbook CM assumes you *know* the beneficial branch is closed, e.g., Coin=Heads. If known, EDT **Don't Pay**. My scenario retains uncertainty to merge structures.)
      *   *FDT:* Algorithm output determines Forecast. Paying logically secures Fund. **Pay.**
  *   **Delete Closed Branch (Textbook XORB):** No fund. Note sent iff (Violation & Pay) OR (~Violation & ~Pay).
      *   *CDT:* Paying doesn't change Violation. Cost $500. **Don't Pay.**
      *   *EDT:* Receiving Note + Paying implies Violation (P=1). Receiving Note + ~Pay implies ~Violation. **Don't Pay.** (Correction: Standard literature often claims EDT Pays, but rigorous conditioning on the Act given the Letter shows Paying correlates with the Bad State here.)
      *   *FDT:* Algorithm output determines Letter content. Paying logically implies Violation. **Don't Pay.**

  **Combined Case Verdicts**
  *   **CDT:** Ignores logical dependencies. Sees only cost ($500). **Don't Pay.**
  *   **EDT:** Sums evidential updates. Pay → Evidence Fund (+$19.8k) & Evidence Violation (-$19.35k). Net +$450. Cost $500. **Don't Pay** (Net -$50).
  *   **FDT:** Sums logical counterfactuals. Pay → Fund Exists (+$22k) & Violation Exists (-$21.5k). Net +$500. Cost $500. **Indifferent/Pay** (depending on tie-break).

  **Subjunctive Interference**
  Functional Decision Theory treats the act as the output of a subroutine. The "interference" is simply arithmetic on logical consequences: $22k (CM) - $21.5k (XOR) - $0.5k (Cost) = $0. There is a fact of the matter; no patch is needed. FDT sums logical dependencies because it maximizes the utility of the *algorithm's output*, not the physical act. The rule is principled: treat all subjunctive dependencies as causal links in the decision graph.

  **Key Feature & Novelty**
  The working feature is the **single prediction binding two opposite logical conditionals**. If removed (split acts), CDT/FDT diverge on CM but agree on XORB. A CDT defender attacks the "logical causation" of the fund allocation as magical; this lands only if one denies logical uncertainty. The case is not new but reduces to **Logical Uncertainty with Conflicting Conditionals**, rarely instantiated in a single payment channel. It tests whether FDT is a unified calculus (yes) or a bag of tricks (no).
