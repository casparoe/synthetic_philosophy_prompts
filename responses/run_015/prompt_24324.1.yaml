          *   *Resolution:* Distinguish *Direct* Knowing-How vs. *Indirect* Knowing-How. You know how to *manage* belief, not how to *will* belief.
          *   *Prediction:* You know how to *cultivate* belief, but not how to *instantiate* belief at will.
