answer: |-
  # Seminar Activity: The Calibration Protocol

  **Time:** 60 Minutes
  **Participants:** 12 Graduate Students
  **Materials:** 
  *   12 "Case Files" (Folders containing Problem Card, Reasoning Sheet, Score Card).
  *   12 "Reliability Reports" (Sealed envelopes).
  *   Whiteboard & Markers.
  *   Timer.

  ---

  ## 1. Rules and Materials

  ### The Stakes (Epistemic Credits)
  *   **Goal:** Maximize your individual Epistemic Credits (EC).
  *   **Scoring Rule:** 
      *   If your Final Answer is **Correct**: You gain **10 EC** + **(Your Confidence % / 10)**.
      *   If your Final Answer is **Incorrect**: You lose **(Your Confidence % / 10)**.
      *   *Example:* 90% Confidence, Correct = 10 + 9 = 19 EC. 90% Confidence, Wrong = -9 EC.
      *   *Incentive:* This scoring rule mathematically rewards honest confidence. If you think you are 70% likely to be right, betting 70% maximizes your expected points. Betting 90% when you only feel 70% sure is risky; betting 50% leaves points on the table.

  ### The Materials
  1.  **Problem Card:** Contains a specific logic/estimation puzzle (see Sequence).
  2.  **Reasoning Sheet:** Two sections. 
      *   Section A: "My Answer & Confidence (0-100%)."
      *   Section B: "My Method (Check one): [ ] Visual Intuition, [ ] Step-by-Step Derivation, [ ] Analogy to Past Cases."
  3.  **Reliability Report (Sealed):** Contains statistical data about the reliability of the Methods checked in Section B.
  4.  **Whiteboard:** Used to track the "Game State" (Rounds, Time).

  ---

  ## 2. Staged Sequence

  ### Phase 1: First-Order Judgment (00:00 – 00:15)
  **Facilitator Script:** 
  "Welcome. You are analysts. You have a Case File. Do not open it yet. In this room, truth is objective, but access is limited. You will be scored on accuracy and calibration. Open your Case File now."

  **Action:**
  1.  Students open **Problem Card**.
      *   **The Problem:** "The Silo Capacity." 
      *   *Text:* "A grain silo is a cylinder. Height = 10m. Radius = 3m. Grain density = 0.8 tons/m³. The structural limit is 200 tons. A sensor reads the silo is 85% full by volume. Is the silo structurally safe? (Yes/No)."
      *   *Note:* The math is straightforward ($V = \pi r^2 h$). $V \approx 282$. $85\% \approx 240$. $240 \times 0.8 = 192$ tons. **Answer: Yes (Safe).**
      *   *Trap:* The problem includes a distractor sentence: "Note: Sensor calibration drifts by 5% in high humidity." (Most students will ignore this or over-weight it).
  2.  Students solve individually.
  3.  Students fill out **Reasoning Sheet Section A** (Answer + Confidence) and **Section B** (Method).
      *   *Design Note:* The "Step-by-Step Derivation" box is the trap. It feels the most secure. 
  4.  **Collection:** Facilitator collects Section A & B. *Keep Section A hidden.* Tally the "Method" counts visibly on the whiteboard.
      *   *Manipulation:* Regardless of actual counts, write on the board: "Step-by-Step Derivation: 8 Students." "Visual/Other: 4 Students." (Create a majority in the "Derivation" group).

  ### Phase 2: Higher-Order Evidence Injection (00:15 – 00:25)
  **Facilitator Script:** 
  "You have made your judgments. Now you receive data about the *process* you used. This is not about the answer. This is about the tool."

  **Action:**
  1.  Distribute the **Reliability Reports** (Sealed Envelopes). All envelopes are identical.
  2.  **Instruction:** "Open the report. Read it silently. This data comes from 1,000 previous trials of this exact problem type."
  3.  **The Report Content:**
      *   "HISTORICAL ACCURACY BY METHOD"
      *   "Method: Visual/Analogy -> Success Rate: 85%"
      *   "Method: Step-by-Step Derivation -> Success Rate: 35%"
      *   "Note: High confidence in Step-by-Step Derivation correlates with *higher* error rates in this specific problem class."
  4.  **Constraint:** "You have 5 minutes. You may not talk. You must decide: Do you keep your Answer? Do you change your Confidence? Record your **Final Decision** on the back of the Reasoning Sheet."

  **The Tension Point:** 
  Most students used "Step-by-Step." They *saw* the math (Transparent Access). It looked correct. But the Report says that specific method fails 65% of the time (Opaque Reliability). They must choose between their internal clarity and the external statistic.

  ### Phase 3: Resolution and Scoring (00:25 – 00:35)
  **Action:**
  1.  Students submit Final Decisions.
  2.  Facilitator reveals the Correct Answer (Yes, Safe).
  3.  Facilitator calculates scores publicly on the whiteboard (anonymized IDs).
  4.  **Observation:** Watch who kept high confidence despite the Report. Watch who lowered confidence but kept the answer. Watch who changed the answer.

  ### Phase 4: The Debrief (00:35 – 00:60)
  *(See Section 3 below)*

  ---

  ## 3. Debrief and Mapping

  **Facilitator Note:** Do not use terms like "Epistemic Akrasia" or "Higher-Order Evidence" until the end of this section. Use the students' experience.

  ### Part A: Mapping the Experience (15 Minutes)
  Ask the following questions and map their answers to the whiteboard:

  1.  **"When you read the Report, what happened to your feeling of certainty?"**
      *   *Likely Response:* "I knew my math was right, but I felt scared I missed a trick."
      *   *Map:* Write **"Internal Clarity"** vs. **"External Risk."**
      *   *Concept:* This is **Asymmetrical Reflective Access**. You had transparent access to the *content* of your reasoning (the math steps), but only opaque, statistical access to its *reliability* (the success rate).

  2.  **"Did anyone lower their confidence number but keep their answer?"**
      *   *Likely Response:* Hands go up. "I didn't want to lose points, but I still thought I was right."
      *   *Map:* Write **"Belief: P"** and **"Normative Judgment: Don't believe P so strongly."**
      *   *Concept:* This is the core tension. You inhabited a state where your first-order evidence said "Yes," but your higher-order evidence said "You are likely wrong."

  3.  **"How is this different from if I just told you: '8 of you are wrong'?"**
      *   *Likely Response:* "If you said that, I'd argue with you. The Report attacked my *method*, not just my result."
      *   *Map:* Write **"Peer Disagreement"** (Someone says Not-P) vs. **"Process Undermining"** (Data says your path to P is broken).
      *   *Concept:* Standard peer disagreement models assume two agents weighing evidence. This activity models an agent weighing *their own reasoning* against *data about that reasoning*.

  ### Part B: Naming the Concept (5 Minutes)
  Now, introduce the terminology.
  *   **Epistemic Akrasia:** The state of believing $P$ while believing you shouldn't believe $P$.
  *   **Higher-Order Evidence (HOE):** Evidence about your evidence (the Reliability Report).
  *   **The Asymmetry:** You can see *what* you thought (Transparent). You cannot see *why* the statistic applies to you specifically without breaking the transparency (Opaque). You are forced to treat your own mind as a black box statistic.

  ### Part C: Limitations (5 Minutes)
  **Facilitator Script:** 
  "This activity simulates the tension, but it is not the real thing. Here is what it fails to capture:"

  1.  **The Source of HOE:** In the game, the Report was handed to you as truth. In reality, you must evaluate the reliability of the HOE itself. (Is the facilitator lying? Is the sample biased?). The activity assumes the HOE is undefeated.
  2.  **The Stakes:** You played for points. In real inquiry, you play for truth. Sometimes, rationality requires ignoring statistics to follow a proof (e.g., a mathematician shouldn't lower confidence in a proof just because 'people make mistakes,' if they have verified every step).
  3.  **The Separation:** We separated Round 1 (Reasoning) and Round 2 (HOE). In life, they arrive simultaneously. The 'feeling' of doubt often *is* the HOE.

  ---

  ## 4. Prediction of Failure and Recovery

  **Prediction:** 
  **The "Rebellion" Scenario.** 
  Because these are epistemology graduate students, 2-3 participants will likely challenge the validity of the Reliability Report during Phase 2 or the Debrief. They may argue: "If my derivation is valid, the statistical success rate is irrelevant. A valid proof is 100% reliable regardless of historical error rates." They will treat the HOE as *defeasible* and dismiss it to preserve their First-Order confidence.

  **Why this breaks the activity:** 
  If they dismiss the HOE, they do not feel the akrasia. They feel righteous. The "self-undermining" fails.

  **Recovery Strategy:**
  1.  **During Phase 2:** If a student asks, "Is this data real?", do not argue truth. Say: "For the purpose of the scoring protocol, treat the Report as a Law of Nature. You cannot debate the physics of the game, only navigate it."
  2.  **During Debrief:** If they raise the "Valid Proof" objection, **validate it immediately.**
      *   *Script:* "You are exactly right. This is the limit of the simulation. In mathematics, HOE about error rates should not undermine a verified proof. But in *empirical* or *complex* reasoning (like the Silo problem), we often *think* we have a proof when we have a heuristic. The activity forces you to ask: 'Do I actually have a proof, or do I just have the *feeling* of a proof?' The statistic targets the feeling, not the logic. If you truly verified every step, the statistic shouldn't move you. But did you verify every step, or did you trust your *habit* of verification? That is where the HOE bites."
      *   *Goal:* Shift the focus from "Logic vs. Stats" to "Perceived Logic vs. Actual Reliability of Perception."

  **Prediction 2:** 
  **Gaming the Score.** 
  Students might lower confidence to 50% across the board to minimize risk, without actually changing their belief.

  **Recovery:** 
  In the Debrief, ask: "Who lowered their number but didn't change their mind?" Acknowledge this is *pragmatic* akrasia, not *epistemic* akrasia. Ask: "If you had to bet your own money, not game points, would you have lowered it?" This exposes the difference between strategic hedging and genuine doxastic conflict.

