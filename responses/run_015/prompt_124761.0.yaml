answer: |-
  # Workshop Title: The Weight of Names
  **Duration:** 75 Minutes
  **Participants:** 16 Undergraduate Students
  **Topic:** Ethics of Commemorative Public Space (Corrective Justice vs. Mnemonic Displacement)

  ## I. Materials Needed
  1.  **The Map:** One large printed map (A1 size) of the fictional town of **Aethelgard**.
      *   **Sites:** 1 Central Square, 1 River Bridge, 4 Streets (North, South, East, West).
      *   **Current State:** All 6 sites are labeled "Thorne" (after Valerius Thorne, Founder/Exclusionist).
      *   **Mechanic:** Each site has a small Velcro pad.
  2.  **Legacy Tokens:** 10 Red Poker Chips (or heavy glass stones).
      *   **Initial Distribution:** Square (4 chips), Bridge (2 chips), Each Street (1 chip).
      *   **Meaning:** Represents "Symbolic Weight" or public association with Thorne.
  3.  **Name Tags:** Velcro-backed labels. One set says "Thorne," the other says "New Dawn" (or blank).
  4.  **Role Cards:** 16 cards (detailed below).
  5.  **Scorecards:** 5 small slips of paper (1 for Planner, 4 for District Leads).
  6.  **Timer:** Visible countdown clock.

  ## II. Roles (16 Students)
  *   **The City Planner (1):** Holds the authority to change labels. **Constraint:** May rename *maximum 2 sites*. Must sign the Final Plan.
  *   **The Archivist (1):** Holds the "Legacy Ledger" (a sealed envelope). Contains the rule about Token Redistribution. Does not vote but speaks only when a label is removed.
  *   **Mnemonic Auditors (2):** Physical enforcers. They move the Red Tokens when names change. They do not debate, only execute the Ledger's rules.
  *   **District Residents (12):** Divided into 4 Teams of 3 (North, South, East, West).
      *   Each Team represents a District surrounding one of the 4 Streets.
      *   Each Team selects one **Lead** to sign the Scorecard.
      *   **Goal:** Maximize "District Comfort" (1-10 scale).
      *   **Stability Condition:** City Stability is achieved *only* if all 4 District Leads AND the Planner sign the Final Plan.

  ## III. The Hidden Mechanic (For Facilitator & Archivist Only)
  **The Law of Mnemonic Displacement:**
  The total number of Legacy Tokens (10) is **fixed**. They represent the public's mental association with Thorne.
  *   **Rule:** If a "Thorne" label is removed from a site, the Tokens on that site **must** be redistributed evenly among the *remaining* sites still named "Thorne."
  *   **Discovery:** The Archivist opens the Ledger only when the Planner attempts the first removal. The Auditors enforce the movement physically.
  *   **The Trap:** Removing the Central Square (4 Tokens) dumps those tokens onto the Bridge and Streets. If the Bridge gets too many tokens, the South District (Bridge stakeholders) will refuse to sign, killing "City Stability."

  ## IV. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Introduction & Setup
  *   **Facilitator (5 mins):** Briefly state the context. "Aethelgard is reconsidering its relationship with Valerius Thorne. He built the city but enforced harsh exclusion policies. You must decide the commemorative landscape."
  *   **Role Assignment (5 mins):** Hand out cards. Send District Teams to corners of the room. Planner, Archivist, and Auditors stand at the Map Table.
  *   **Instruction:** "You have 20 minutes to negotiate a Final Plan. Unanimous signature required for City Stability. Districts rate their own Comfort independently."

  ### 00:10 – 00:25: Exploration & Briefing
  *   **Districts (10 mins):** Review Role Cards. Each District has a specific "Material Stake" (e.g., North wants tourism, South fears construction costs, East wants historical honesty, West lives under the Bridge).
  *   **Central Team (10 mins):**
      *   **Planner:** Reviews the "2-Change Limit."
      *   **Archivist:** Reads the "Legacy Ledger" privately. Understands the Token Rule. *Do not reveal this yet.*
      *   **Auditors:** Learn how to move tokens.
  *   **Facilitator:** Circulate. Ensure Districts understand they can veto Stability by withholding signature, even if their Comfort score is high.

  ### 00:25 – 00:45: The Negotiation (Core Activity)
  *   **Action:** Planner and District Leads gather around the Map.
  *   **Process:**
      1.  Propose a change (e.g., "Rename Square").
      2.  Planner removes "Thorne" label.
      3.  **CRITICAL MOMENT:** Archivist opens Ledger. "The Legacy remains." Auditors move the 4 Tokens from the Square to the Bridge and remaining Streets.
      4.  Districts react to the visual increase of tokens on their sites.
      5.  Negotiate: Do we rename the Bridge too? If so, those tokens move to the Streets.
      6.  Planner tracks the "2-Change Limit."
  *   **Facilitator:** Do not intervene unless the group ignores the Token Rule. Let the tension build as tokens concentrate.

  ### 00:45 – 00:55: Voting & Scoring
  *   **Freeze:** All movement stops.
  *   **Scoring:**
      1.  Each District Lead writes a Comfort Score (1-10) based on the final Token distribution on their map.
      2.  Planner signs for "Administrative Feasibility."
      3.  **Stability Check:** If any Lead refuses to sign OR Comfort < 5, City Stability = 0. If all sign and Comfort > 5, City Stability = 10.
  *   **Reveal:** Facilitator collects scores and announces the Stability Result.

  ### 00:55 – 01:15: Debrief & Conceptual Mapping
  *   **Phase 1: The Experience (5 mins):** Ask Districts: "When the tokens moved to your street, how did it feel compared to the original setup?"
  *   **Phase 2: The Concepts (10 mins):** Facilitator maps their actions to the core concepts (see Debrief Script below).
  *   **Phase 3: Limitations & Failure (5 mins):** Admit what the map couldn't do and address the predictable failure mode.

  ## V. Debrief Script (Facilitator Guide)

  ### 1. Mapping Decisions to Concepts
  *   **Corrective Justice:** "When you renamed the Square, you were aiming for *Corrective Justice*. You identified a harm (the exclusionist name) and applied a fix (removal). This feels like progress."
  *   **Mnemonic Displacement:** "But look at the Bridge. It started with 2 Tokens. After the Square was removed, it held 5. The history didn't leave the city; it became *denser* in the remaining locations. This is *Mnemonic Displacement*. By cleaning one space, you inadvertently intensified the symbolic weight of the others."
  *   **The Tension:** "The Planner was constrained (only 2 changes). The Districts were constrained (Stability requires unanimity). You discovered that removal is not a deletion; it is a redistribution. If you remove the center, the periphery becomes the new center of controversy."

  ### 2. Admission of Limitations (The "Real World" Gap)
  *   **Facilitator Statement:** "This exercise used chips and paper. It cannot reproduce the **visceral bodily experience** of public space.
      *   **What's Missing:** You did not feel the shadow of a statue, the sound of traffic on the bridge, or the intergenerational trauma of walking under a name that denies your ancestors' humanity.
      *   **The Gap:** In reality, 'Symbolic Weight' isn't just a number; it is state legitimacy and physical dominance. A map makes the problem look solvable through geometry. In the street, the problem is felt in the gut. The 'displacement' here was mechanical; in reality, it is psychological and political. The remaining statue doesn't just get 'heavier'; it becomes a rallying point for counter-protest. I had to supply that stakes verbally; you could not feel it physically."

  ### 3. Addressing the Predictable Failure Mode
  *   **The Failure:** "Most groups immediately rename the Central Square. It is the obvious moral choice. Then, paralysis sets in when the tokens migrate to the Bridge. You realize you have used 1 of 2 changes and made the Bridge district angry. You run out of moves."
  *   **The Redirect:** "If you found yourselves stuck here, that is the lesson. **Symbolic cleansing has a capacity limit.** If you do not have the political capital (Planner changes) to address the *entire* network of memory, partial removal can exacerbate tension in the remaining sites. The redirect is to ask: *Is the goal to erase the name, or to dilute the weight?* Sometimes, adding *new* markers (contextual plaques, counter-monuments) is more effective than removal because it spreads the weight rather than concentrating it. The map didn't allow you to add context, only remove names. That is a constraint of the 'Removal' framework itself."

  ## VI. Role Card Details (Summaries)

  **Planner:**
  *   You want City Stability.
  *   You can peel off max 2 "Thorne" labels.
  *   You must sign the final plan.
  *   *Secret:* You don't know about the Tokens until the Archivist speaks.

  **Archivist:**
  *   You hold the Ledger.
  *   When a label is removed, read this aloud: *"The Legacy of Thorne is fixed in the public mind. It does not vanish. It migrates."*
  *   Direct Auditors to move tokens from the removed site to remaining "Thorne" sites.

  **Mnemonic Auditors:**
  *   You are neutral machines.
  *   When a label is removed, take its tokens. Distribute them equally to remaining "Thorne" sites. (If odd number, Bridge gets the extra).

  **District Residents (North/South/East/West):**
  *   **North:** Residential. High discomfort with Thorne. Willing to tolerate tokens if Square is gone.
  *   **South:** Commercial. Owns the Bridge approach. Fears "controversy" hurts business. High sensitivity to Token increases.
  *   **East:** Industrial. Indifferent to names, but hates instability. Will veto if Stability is 0.
  *   **West:** Historical. Believes names should stay but with context. Comfort drops if names are removed *without* context.
  *   **All:** Rate Comfort 1-10. If Comfort < 5, you *must* withhold signature.

  ## VII. Facilitator Notes on Dynamics
  *   **If they move too fast:** Pause the clock when the first token moves. Ask the Bridge District: "Look at your street. It just got twice as 'Thorne.' Do you accept this?"
  *   **If they ignore the tokens:** The Auditors must physically place the chips on the District Representatives' tables, not just the map. Make it personal.
  *   **If they consensus too easily:** Remind them that "Stability" requires *all* signatures. One unhappy district fails the city. Encourage the South District to protect their economic stake against the North's moral stake.
