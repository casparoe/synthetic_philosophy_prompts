      *Wait, the prompt says "reveal that the actual rule was never in any group's hypothesis space."* I need to make *that* work if I keep the shape. If I change it, I am replacing. I will try to make it work. To avoid "trickery," the unconceived rule must be simple enough that they feel "oh, we missed that," not "that was impossible."
