answer: |-
  **Setup and materials**
  Projector slide displaying six "Cards," each with a hidden Number (1–6) and hidden Color (Red/Blue). You hold the key: Cards 2, 4, 6 are Red; 1, 3, 5 are Blue. The hidden rule is **"Accept if Red."** Students see only Numbers initially. Divide class into three groups. Provide index cards for queries and betting slips.

  **Rules and timeline**
  *   **0–10 min:** Explain the goal: Discover the acceptance rule. Groups have a budget of **three queries** each. They choose a Number; you reveal Accept/Reject based on the Color key.
  *   **10–40 min:** **Inquiry.** Groups submit Number choices. *Crucial:* Ensure their choices (e.g., 2, 4, 6) all return "Accept." This creates data consistent with "Accept Evens" and "Accept >1."
  *   **40–55 min:** **Theory & Bet.** Groups must articulate two distinct theories fitting their data. They bet points on which is true. Lock bets.
  *   **55–65 min:** **Auxiliary Twist.** Hand Group 1 a card: *"Assume Color is irrelevant."* Hand Group 2: *"Assume Color may matter."* Ask if they wish to revise bets (they cannot query more). Group 2 should hesitate; Group 1 stays firm.
  *   **65–90 min:** **Reveal & Debrief.** Reveal the true rule (Color). Show that "Accept Evens" fit all observed data perfectly.

  **Debrief map**
  *   **The Tie:** Ask why they couldn't distinguish "Evens" from "Red" with their data. Label this **underdetermination by available evidence**. Note that more Number-queries wouldn't help (2, 4, 6 always correlate).
  *   **The Auxiliary:** Ask Group 1 vs. 2 how the card changed their confidence. Label this **dependence on auxiliary assumptions**. The tie exists only if we assume "Number is the only relevant variable."
  *   **The True Rule:** Reveal the Color rule was never in their hypothesis space. Label this **unconceived alternatives**. Clarify this isn't "anything goes"; it's a warning about variable omission.
  *   **The Bet:** Ask why they bet on "Evens" over "Red" before the reveal. Label this **pragmatic tiebreakers** (simplicity/salience). Ask: Did simplicity make "Evens" *truer*, or just easier to bet on?

  **Failure modes**
  *   **Students guess Color immediately:** Prevent this by hiding Color entirely in Phase 1. They only see Numbers.
  *   **"Gotcha" fatigue:** If students feel cheated by the Color rule, acknowledge it. Frame it not as a trick, but as a simulation of how background assumptions limit what variables we think to measure.
  *   **Time overrun:** Enforce the query budget strictly. Use a visible timer.
  *   **Relativism:** If they conclude "truth is impossible," correct them: The rule *was* fixed (Color). Their *access* was limited. Distinguish ontological reality from epistemic access.

  **What you must supply**
  1.  **Pre-generated Data:** A key ensuring Numbers 2, 4, 6 yield "Accept" and 1, 3, 5 yield "Reject" (or all Accept, depending on desired complexity). Ensure correlation between Number parity and Color.
  2.  **Auxiliary Cards:** Printed slips with the conflicting assumptions.
  3.  **Payoff Scheme:** Simple points (e.g., 10 for correct theory, 5 for viable rival). No real money needed; grade participation or offer trivial privileges.

  **Confidence note**
  I am 85% confident in this design. It successfully isolates underdetermination without expensive equipment. The single claim I am least sure of is the Stage 3 reveal (Unconceived Alternatives); there is a risk students view the Color rule as an unfair change of parameters rather than a lesson on hypothesis space limitations. Be prepared to defend the fairness of the "hidden variable" vigorously in the debrief.
