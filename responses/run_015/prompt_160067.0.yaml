          *   Stage 2 (Uncertain): Hand one group different background assumption/auxiliary to break tie.
          *   Stage 3 (Proposed): Reveal actual rule was never in hypothesis space (problem of unconceived alternatives).
      *   **Concerns:** Avoid "anything goes" trickery. Ensure specific distinctions are felt (underdetermination by available vs. all evidence, role of auxiliaries, status of tiebreakers like simplicity).
      *   **Requirements:** Mechanism, rules, payoff, timeline (minute marks), debrief map, failure modes, what instructor must supply.
