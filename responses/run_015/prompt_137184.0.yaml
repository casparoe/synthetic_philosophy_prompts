      *   *The Twist:* The Facilitator asks the group: "What probability would you need to accept this deal?" Then the Facilitator *assigns* a probability (or rather, asserts a claim) that barely clears that bar, but the stake is adjusted to make EV positive *if* they accept any non-zero prob.
      *   *Better Twist (per prompt):* The Mugger sets the stake *after* seeing resistance.
      *   *Implementation:* The Group sets a "Threshold Rule" (e.g., "We need 1 in 1 million chance"). The Mugger then offers a stake that makes EV positive *given that threshold*, but the stake is absurdly large.
