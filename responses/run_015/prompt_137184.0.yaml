answer: |-
  # Activity Design: "The Escalation Protocol"

  **Time:** 90 Minutes
  **Participants:** ~18 Undergraduates
  **Materials:** 
  *   200 Poker Chips (or distinct paper tokens).
  *   Whiteboard + Markers.
  *   Index cards (one per student).
  *   A "Decision Log" sheet for the Scribe.
  *   A bell or timer.

  **Currency:** "Influence Points" (IP). 
  *   *Stake:* The group starts with a collective pool of 50 IP. 
  *   *Incentive:* The student (or coalition) holding the most IP at the end chooses next week's reading topic and controls the snack budget (if any) or simply gets "First Author" credit on the group's summary notes. This creates a tangible, non-monetary utility for the chips.

  **Roles:**
  *   **Facilitator:** Plays the "Proposer" (Mugger) and "Auditor" (Counter-Mugger). Neutral arbiter of rules.
  *   **Scribe:** One student volunteer. Records the group's stated probabilities and decisions on the whiteboard.
  *   **The Group:** The remaining 17 students. They vote collectively on whether to accept proposals.

  ---

  ## Part 1: Calibration (15 Minutes)
  **Goal:** Establish Expected Value (EV) as the default decision norm and set a baseline for "low probability, high impact."

  1.  **Setup (5 mins):** Distribute 3 IP to each student personally. Explain the "Influence Point" reward system. Explain that the Group Pool (50 IP) is separate; decisions made by the group affect the Pool, which can be distributed later by majority vote.
  2.  **The Charity Round (10 mins):** 
      *   **Proposal A:** "Invest 5 IP from the Pool. There is a 50% chance this yields 20 IP for the Pool."
      *   **Task:** Students discuss and vote. (Expected Return: 10 IP. Cost: 5 IP. EV Positive).
      *   **Proposal B:** "Invest 5 IP from the Pool. There is a 5% chance this yields 200 IP for the Pool."
      *   **Task:** Vote. (Expected Return: 10 IP. Cost: 5 IP. EV Positive).
      *   **Debrief Point:** Ask the Scribe to write the EV formula on the board: $EV = P \times \text{Stake} - \text{Cost}$. Confirm the group agrees to maximize EV for the session.

  ## Part 2: The Escalation (30 Minutes)
  **Goal:** Induce the Mugging pressure. The Facilitator acts as an external agent making claims on the Group Pool.

  **Rules:** 
  *   The Facilitator demands **1 IP** from the Group Pool per round.
  *   The Facilitator promises a return in IP to the Pool.
  *   The Group must Vote (Majority rules) to Pay or Refuse.
  *   **Crucial Constraint:** The Facilitator does *not* state the probability of the claim. The students must assess it.

  **The Script:**
  1.  **Round 1:** Facilitator: "Give me 1 IP. I will return 10 IP." (Implicit P is high, e.g., 0.9). 
      *   *Outcome:* Group pays. (EV is obviously positive).
  2.  **Round 2:** Facilitator: "Give me 1 IP. I will return 100 IP." 
      *   *Facilitator Note:* Act slightly more mysterious. "My mechanisms are complex."
      *   *Outcome:* Group likely pays.
  3.  **Round 3-5:** Facilitator: "Give me 1 IP. I will return [Previous Stake $\times$ 10] IP." 
      *   *Observation:* Watch for hesitation. The Scribe should ask: "What probability are you assigning to this?" Write it on the board.
      *   *If they hesitate:* Facilitator: "I cannot change my probability, but I can increase the Stake."
  4.  **The Turning Point (Round 6+):** 
      *   Stake is now massive (e.g., 1,000,000 IP). 
      *   Facilitator: "Give me 1 IP. I promise $10^9$ IP."
      *   *Pressure:* If students assign *any* non-zero probability (e.g., $10^{-6}$), the EV is positive ($10^{-6} \times 10^9 = 1000 > 1$).
      *   *Facilitator Tactic:* If they say "No," ask: "Is the probability literally zero? Are you certain I am lying?" If they say "Not zero, just small," point to the EV formula on the board. "Then the math says Pay."

  ## Part 3: The Counter-Mugger (15 Minutes)
  **Goal:** Demonstrate the instability of the EV position when stakes are adversarial.

  **The Script:**
  *   **Enter the Auditor:** Facilitator changes tone. "I am auditing this transaction."
  *   **The Offer:** "If the Group *Refused* the last Proposal, I will grant the Pool 10 IP guaranteed."
  *   **The Threat:** "If the Group *Paid* the last Proposal, I will confiscate 1,000 IP from the Pool (simulated debt, deducted from future potential earnings)."
  *   **The Trap:** 
      *   If they Paid the Mugger (based on EV), they now face a massive loss from the Auditor.
      *   If they Refused the Mugger (based on intuition), they must admit they violated their own EV rule established in Part 1.
  *   **Discussion:** Ask the group: "Which decision was rational? The one that maximized EV against the Mugger, or the one that protected you from the Auditor?"

  ## Part 4: Rule Binding (15 Minutes)
  **Goal:** Force them to codify an escape route and show its cost.

  1.  **Individual Writing (5 mins):** Hand out index cards. 
      *   *Prompt:* "Write a decision rule you would have used to stop the Mugger. It must be specific. Examples: 'Never pay if P < 1%', 'Never pay if Stake > 1000 IP', 'Max Utility is capped at 500 IP'."
      *   *Constraint:* They must sign the card. This is a pre-commitment.
  2.  **The Test (10 mins):** 
      *   Collect cards. Facilitator shuffles and reads 3 anonymous rules.
      *   **Scenario:** Facilitator proposes a new deal tailored to *break* the read rule while keeping EV positive.
      *   *Example:* If a rule says "Never pay if P < 1%," Facilitator offers a Stake so high that $0.0001\% \times \text{Stake} > \text{Cost}$.
      *   *Question:* "Does this rule hold? Or do you break it to take the EV?"
      *   *Outcome:* Show that any fixed rule (floor or ceiling) can be outbid by an adversarial stake.

  ## Part 5: Debrief & Limitations (15 Minutes)
  **Goal:** Map the experience to the theory and state the honest limitations.

  **Mapping the 4 Ingredients (Whiteboard):**
  1.  **Unbounded Stakes:** Point to the exponential growth in Part 2. "If the stake could not grow, the mugging fails."
  2.  **EV Maximization:** Point to Part 1. "You agreed to this norm. If you switch norms now, you are changing the game."
  3.  **No Credence Floor:** Point to the moment they admitted P > 0. "If you could say P=0 with certainty, you would be safe. But can you ever be certain?"
  4.  **Adversarial Stake:** Point to the Facilitator's reaction to refusal. "The stake wasn't random; it was chosen *because* you hesitated."

  **The Escape Routes (Cost Analysis):**
  *   **Utility Ceiling:** "If you cap utility, you ignore genuine high-impact opportunities (like existential risk reduction)."
  *   **Probability Floor:** "If you set P=0 for weird claims, you become dogmatic and cannot update on new evidence."
  *   **Stakes-Insensitivity:** "If you ignore stakes above a threshold, you are leaving money on the table."
  *   **Abandoning EV:** "If you vote based on 'vibes', you lose the mathematical consistency you started with."

  **The Honesty Clause (Facilitator Script):**
  *   "In this game, I *stipulated* the stakes. In reality, stakes are uncertain. The game cannot show you why your *prior* probability should be vulnerable. It only shows that *if* your prior allows P > 0, and stakes are unbounded, you are exploitable."
  *   "The game also cannot prove the Mugger's claim deserves credence. In the real world, the Mugger's complexity might drive P down faster than the Stake drives EV up. This game rigged the numbers to prevent that."

  ---

  ## Troubleshooting: Predictable Failures

  **1. The "Probability Zero" Defense**
  *   *Risk:* Students insist $P=0$ to escape the EV calculation.
  *   *Fix:* In Part 1 (Calibration), establish that "extraordinary claims" (like the 5% charity round) have non-zero probability. In Part 2, if they claim $P=0$, ask: "Is it physically impossible, or just unlikely?" If they say impossible, invoke the Simulation Hypothesis or "Matrix" scenario where nothing is physically impossible, only improbable. Force them to assign a non-zero number (e.g., $10^{-100}$).

  **2. Disengagement / Refusal to Play**
  *   *Risk:* Students realize the game is rigged and stop voting.
  *   *Fix:* The "Influence Point" reward must matter. Remind them halfway through: "The person with the most chips picks the next text." If they stop engaging, pause and ask: "Is refusing to maximize EV a strategy? If so, write that down as your Rule for Part 4."

  **3. Domination by One Calculator**
  *   *Risk:* One student does the math and tells everyone what to do.
  *   *Fix:* Use **Secret Ballots** for the voting in Part 2. Each student writes "Pay" or "Refuse" on a slip of paper. Scribe counts them. This prevents social pressure and forces individual confrontation with the EV calculation.

  **4. The "It's Just a Game" Objection**
  *   *Risk:* Students dismiss the stakes as fake, so EV doesn't feel real.
  *   *Fix:* Acknowledge this. "The chips are fake, but the *logic* is real. We are testing the consistency of your reasoning, not your wallet. If the logic breaks here, it breaks in real life."

  ---

  ## Facilitator Notes: Keeping the Pressure On

  *   **Do not name Pascal's Mugging** until the very end of the Debrief. Refer to it as "The Proposal" or "The Escalation."
  *   **Be Relentless:** When they hesitate, do not comfort them. Say: "The math is on the board. The Stake is on the board. Why is the answer not obvious?"
  *   **The Counter-Mugger Timing:** Only introduce the Counter-Mugger *after* they have either Paid or Refused a significantly large stake. If they Paid, the Counter-Mugger punishes them. If they Refused, the Counter-Mugger rewards them, but you must point out that this means they *ignored* the EV of the first Mugger.
  *   **Rule Binding:** Ensure the rules they write are *general*. If someone writes "I won't pay this specific guy," reject it. The rule must apply to "Any agent making a claim."

  ## Summary of Learning Outcomes
  By the end of the 90 minutes, students should feel:
  1.  **The Pull:** The mathematical compulsion to accept the deal as stakes rise.
  2.  **The Trap:** The realization that any fixed threshold (probability or utility) can be bypassed by a larger stake.
  3.  **The Cost:** That avoiding the mugging requires abandoning a core tenet of their decision theory (EV, unbounded utility, or open-minded priors).
  4.  **The Limit:** An understanding that the game is a "stress test" of logic, not a proof that real-world muggers are credible.
