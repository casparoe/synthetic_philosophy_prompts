          17. *To make it adaptive:* The Facilitator asks "How much evidence would you need?" The Group says "A lot." The Facilitator says "I can't give evidence, but I can increase the Stake."

      *   *Decision:* I will design the "Escalation Ladder." The Facilitator plays a character. The stake multiplies by 10x each refusal. The probability is *not* stated, forcing students to assign it. When they hesitate, the Facilitator asks "Is the probability zero?" If they say no, the EV calculation forces them to pay eventually.

  11. **Drafting the Debrief Questions:**
      *   Map the moments:
          *   Unbounded Stakes -> The exponential growth of the reward.
