      *   **Phase 5: Debrief.** Connect to the 4 ingredients.

  4.  **Refining the Mechanics (Addressing the "Adaptive Stake" constraint):**
      *   The prompt specifically wants the stake to be set *after* seeing resistance.
      *   *Idea:* The Facilitator plays the Mugger. The Group votes.
