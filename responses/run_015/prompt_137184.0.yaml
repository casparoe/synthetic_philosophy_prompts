          8.  *Activity:* Facilitator claims a capability (e.g., "I can simulate a universe"). Probability is left vague but assumed non-zero. Stake is the lever.
          9.  *Let's follow the prompt's specific mechanic:* "Mugger... demand stays at a single unit while the threatened or promised stake is multiplied by a large fixed factor each time the group declines."
          10. Okay, I will stick to this. It's cleaner.
