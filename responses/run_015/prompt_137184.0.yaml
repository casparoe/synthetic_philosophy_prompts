      *   **Goal:** Make them *feel* the pressure of PM (specifically the adaptive stake feature) rather than just hearing about it.
      *   **Constraint:** Facilitator cannot name the view/paradox up front.
      *   **Mechanic Ideas:** Opening round (ordinary high-impact), The Mugger (demand fixed, stake multiplies on refusal), Counter-Mugger (pays for refusing).
      *   **Debrief Requirements:** Map game moments to 4 ingredients (unbounded stakes, EV maximization, no credence floor, adversarial stake). Get students to write decision rules *before* seeing next stake, then show costs of escape routes (utility ceiling, prob floor, etc.).
      *   **Honesty Clause:** Acknowledge limitations (stakes are stipulated, not uncertain; doesn't explain *why* priors should be vulnerable).
      *   **Troubleshooting:** Predict failures (refusal to engage, "prob = 0" claims, domination by one calculator).

  2.  **Deconstruct the Core Problem (Pascal's Mugging):**
      *   Standard PM: A stranger says "Give me \$5 or I will use magic to kill $3 \uparrow\uparrow\uparrow 3$ people."
      *   Core Tension: If $P(\text{claim}) > 0$, there exists a stake $S$ such that $P \times S > \text{Cost}$.
      *   The "Adaptive" Feature: The mugger adjusts $S$ based on your skepticism. If you say "I need $P > 10^{-6}$," they promise $10^7$ lives.
      *   The Reading Group Context: No real money means we need "points," "chips," or "social capital." Since it's a reading group, "epistemic credit" or "decision rights" might work, but simple tokens are clearer for EV calculations. Let's use "Course Credit Points" (fictional) or "Group Chips" that determine a real reward (e.g., who picks the next reading, or a small treat if budget allows, but the prompt says "no real money"). Let's stick to *Group Chips* that determine a collective outcome (e.g., ending 5 minutes early, or choosing the next topic). Actually, to make EV feel real, there needs to be *some* stake. Let's use a "Pool of Privilege" (e.g., choosing the snack, the next text, or just bragging rights/certainty points). Let's go with **Decision Tokens**. The group has a budget of tokens. They must decide whether to spend tokens to "buy" potential bonus tokens from the Facilitator (acting as the Mugger).

  3.  **Drafting the Activity Structure:**

      *   **Phase 1: Calibration (The "Normal" Ask).** Establish baseline EV reasoning. A plausible high-impact charity-style decision.
      *   **Phase 2: The Escalation (The Mugging).** The core mechanic. Fixed cost, exponential reward.
      *   **Phase 3: The Counter-Force (The Counter-Mugger).** Introduce a penalty for accepting, or a reward for refusing, to show the symmetry of the problem.
