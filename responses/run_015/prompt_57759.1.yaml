      *   *(2) Definition of Deception:* "Intentionally causing someone to believe something you know is false." -> *Standard definition.*
      *   *(3) Application to Self:* "Self-deceiver knows $p$ and intentionally causes himself to believe $\neg p$." -> *This is the crux.* It assumes a simultaneous, unified state of knowing and believing.
      *   *(4) The Conflict:* "Knowledge that $p$ sits right there... attempt dies on contact." -> *This assumes transparency and simultaneity.*
      *   *(5) The Dichotomy:* "Either belief changes without intention (bias) or doesn't change." -> *False dichotomy.* It ignores indirect strategies.
      *   *(6) Conclusion:* "Self-deception doesn't exist." -> *Counter-intuitive.*
      *   *(7) Responsibility:* "Nobody is ever responsible." -> *The user wants to reject this.*

  3.  **Identify the Weak Link:**
      *   Premise (3) and (4) rely on a specific model of the mind: a unified, simultaneous awareness.
      *   The standard philosophical solution to the Static Paradox is to reject the idea that the self-deceiver *consciously knows* $p$ at the exact same time and in the exact same way they believe $\neg p$.
      *   Alternatively, reject the idea that deception requires *conscious* intention at the moment of belief formation.
      *   *Best target:* Premise (3) or the inference to (4). The "Static Paradox" assumes self-deception requires simultaneous contradictory beliefs in a single unified consciousness. Most contemporary accounts (Mele, Perring, etc.) argue for *temporal partitioning* or *motivationally biased evidence gathering*.
      *   *Responsibility Angle:* Even if belief isn't directly voluntary (1), actions *leading* to belief are. This breaks the link to (7).

