      *   **Fix Premise (3)/(4):** Self-deception isn't knowing $p$ and believing $\neg p$ simultaneously. It's often a process where you *avoid* knowing $p$ fully while cultivating $\neg p$. Or, the "knowledge" is buried/subconscious.
      *   **Fix Premise (7) (Responsibility):** Even if belief isn't voluntary (1), *evidence gathering* is. You are responsible for the actions that lead to the belief (closing your eyes, unfollowing the critic). This is "indirect doxastic control."
