      *   *Do not soften verdict?* Will be blunt about the CPA failure and the statistical misuse.
      *   *Plain prose footnote?* Yes.

  10. **Final Polish:**
      *   Ensure the tone is "Senior Philosopher of Science." Use terms like "Common Prior Assumption," "Information Partitions," "Static vs. Dynamic," "Category Error."
      *   Make sure the Durbin-Watson critique is technically accurate (it tests residuals of a regression, not a raw series against zero).
      *   Ensure the distinction between "shared data" and "common priors" is highlighted, as this is the most common physicist misunderstanding of Aumann.

  **(Self-Correction during drafting):** I initially thought about mentioning "Approximate Common Knowledge." But better to stick to the hard failure of the Common Prior Assumption. That's the killer. Also, need to make sure I don't sound like I'm dismissing the physicist's intuition entirely—persistent disagreement *is* interesting, just not proof of irrationality via Aumann.

