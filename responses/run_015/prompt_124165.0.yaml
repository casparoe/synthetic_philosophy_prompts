  I lift this right hand up to meet the light.
  And then the left one joins it in the air.
  You see the skin, the vein, the nails, the flesh.
  There is a space between us and the wall.
  The wood holds up the weight of paper now.
  My voice goes out across the empty room.
  You watch the gesture made before your eyes.
  No dark conceals the fingers from your sight.
  Yet proof is not a chain of cold hard links.
  It is a call that asks you to stand near.
  I do not force the truth inside your mind.
  I give to you the place where I appear.
  Perhaps the world stands firm because we look.
  Or else we share the act of looking on.
