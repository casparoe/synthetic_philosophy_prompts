  # Joint Statement on the Historical and Ethical Status of the Holocaust

  **Preamble**
  We, the undersigned representatives of the Singularity-Ethics camp and the Modernity-Comparability camp, having engaged in rigorous adversarial collaboration, hereby issue this joint statement. While fundamental disagreements regarding the interpretative framework of the Holocaust remain, we have established a shared foundation of historical fact and methodological responsibility. This document outlines our areas of consensus, delineates our remaining divergences with precision, and identifies the specific empirical and philosophical cruxes that must be addressed to advance understanding.

  ### 1. Agreed Claims

  1.  **Historical Record:** Both camps affirm the established historical record regarding the systematic, state-sponsored persecution and murder of six million Jews by the Nazi regime and its collaborators, alongside the targeted destruction of other groups including Roma, disabled individuals, and political opponents.
  2.  **Formal Properties of Violence:** Both camps acknowledge that the Holocaust relied heavily upon modern bureaucratic mechanisms, including rail logistics, census data, legal categorisation, and industrialised killing methods, which distinguished its operational scale from pre-modern massacres.
  3.  **Explanatory Requirements:** Both camps agree that any adequate explanation of the Holocaust must account for the intersection of specific ideological hatred (anti-Semitism) and the structural capacities of the modern state; neither ideology nor bureaucracy alone is treated as sufficient by either side without the other.
  4.  **Limits of Analogy:** Both camps concede that analogical reasoning carries significant ethical risk. Careless comparison can trivialise specific suffering, obscure distinct causal mechanisms, or instrumentalise memory for unrelated political ends. Rigorous methodological safeguards are required when drawing parallels between genocidal events.

  ### 2. Table of Disagreements

  | Point of divergence | Singularity-Ethics wording (accepted by that camp) | Modernity-Comparability wording (accepted by that camp) | Classification (factual / normative / semantic) |
  | :--- | :--- | :--- | :--- |
  | **The Status of Uniqueness** | The Holocaust constitutes an ontological rupture in human history that places it in a category separate from other genocides. | The Holocaust is a distinct historical event but belongs to the same category of modern genocidal phenomena as other cases. | Normative / Semantic |
  | **The Role of Modernity** | Modern bureaucratic rationality was a necessary tool but not the primary cause; the eliminatory anti-Semitic ideology was the decisive factor. | Modern bureaucratic rationality and the division of moral labour were sufficient conditions that made such genocide reproducible in other modern contexts. | Factual / Normative |
  | **The Utility of Comparison** | Comparison necessarily dilutes the moral particularity of the Jewish experience and risks obscuring the specific threat of anti-Semitism. | Comparison clarifies the structural dangers of modern civilisation and allows for the identification of universal warning signs across different contexts. | Normative |

  ### 3. The Cruxes

  To move beyond stalemate, we identify three sub-questions where resolving the empirical or philosophical uncertainty would shift the position of at least one camp.

  **Crux 1: Ontological Property vs. Ethical Stance**
  *   **Question:** Is 'uniqueness' an inherent property of the event itself, or an ethical stance governing how we remember it?
  *   **Test Case:** The administrative protocols of the Wannsee Conference compared to high-level planning meetings during the Armenian Genocide or the Rwandan Genocide.
  *   **Singularity-Ethics Prediction:** Analysis will show that while administrative techniques overlap, the specific ideological intent recorded at Wannsee (total biological elimination based on race) creates an ontological difference that renders the events incomparable in kind.
  *   **Modernity-Comparability Prediction:** Analysis will show that the bureaucratic language and decision-making processes are functionally identical, proving that the 'uniqueness' lies only in the specific target group, not the structural mechanism of destruction.

  **Crux 2: Sufficiency of Bureaucratic Rationality**
  *   **Question:** Is modern bureaucratic rationality sufficient for large-scale genocide, or merely necessary?
  *   **Test Case:** The German suppression of the Herero and Nama peoples in South West Africa (1904–1908) prior to the Nazi regime.
  *   **Singularity-Ethics Prediction:** This case will be classified as colonial extermination lacking the totalising ideological fusion of the Holocaust, proving that bureaucracy alone does not produce the Holocaust's specific moral quality.
  *   **Modernity-Comparability Prediction:** This case will be classified as a prototype of modern genocide, proving that the bureaucratic mechanisms of destruction were reproducible features of German modernity before the Nazi party even existed.

  **Crux 3: Clarification vs. Dilution**
  *   **Question:** Does comparison clarify structural danger or necessarily dilute moral particularity?
  *   **Test Case:** The inclusion of the Holocaust within a broader 'Genocide Studies' curriculum versus a standalone 'Holocaust Studies' curriculum.
  *   **Singularity-Ethics Prediction:** Students in the broader curriculum will demonstrate a statistically significant decrease in understanding the specific historical roots of anti-Semitism compared to those in the standalone curriculum.
  *   **Modernity-Comparability Prediction:** Students in the broader curriculum will demonstrate a statistically significant increase in the ability to identify early warning signs of bureaucratic dehumanisation in contemporary contexts compared to those in the standalone curriculum.

  ### 4. Identification of Verbal Dispute

  A portion of the dispute is identified as purely verbal. Specifically, the term 'unique' is employed differently by each camp. For the Singularity-Ethics camp, 'unique' functions as a normative barrier against comparison. For the Modernity-Comparability camp, 'unique' is treated as a trivial factual claim (all events are unique in some details) that should not inhibit structural analysis. Clarifying that the disagreement is often about the definition of the word 'unique' rather than the historical facts themselves dissolves a significant fraction of the conflict.

