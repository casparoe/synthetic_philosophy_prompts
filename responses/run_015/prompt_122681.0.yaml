prompt: |-
  I'm a philosophy PhD student (mind and language, but I've been sitting in on the ML lab's reading group for about a year) and I've been drafted to fill a 40-minute slot on the frame problem at their Thursday meeting in a couple of weeks. Audience is maybe fifteen people: mostly first- and second-year ML PhD students, two or three philosophy people like me, nobody will have read anything in advance, there's a whiteboard and I'd rathre not use slides. Don't write the lecture for me — I want the plan. What has to be in place before what, and why that order: what actually depends on what, as opposed to what just makes a nice narrative. My own half-baked way in is a three-way split, and I'd like you to tell me if it's wrong before I build a lecture on it: (1) a specification/formalization problem — writing down what an action changes without writing out roughly M×N sentences about what it doesn't change, which I take to be more or less handled by action schemas and successor-state axioms in the situation calculus; (2) an inference problem — even given a compact description, the agent has to avoid re-deriving or re-checking the whole rest of what it believes to see what survived the action, which is the non-monotonic/circumscription-ish territory; and (3) a relevance problem — which of the indefinitely many things the agent knows bear on what it's doing at all, which I don't think (2) touches and which I think is the bit that makes philosophers reach for Dreyfus and Fodor. If that carve-up is itself a contested way of drawing the lines, say so.

  The bit I keep going back and forth on is the example. Every version I have in my notes is the robot-and-the-bomb-in-the-room setup, and I think for this crowd it's actively misleading: the bomb smuggles in stakes, and the story keeps sliding into "how could it have known the wagon wouldn't scratch the floor" (which I take to be the qualification problem) and "pulling the wagon out also moves the battery" (ramification) — neither of which is the thing I'm trying to get them to see. So give me one example to carry the whole forty minutes and be explicit about what it has to have and what it has to lack. My constraints: statable in two sentences, it has to make the "what stays the same?" question bite without leaning on risk or on knock-on causal effects, and it has to survive being re-described in a learned-world-model / next-token-prediction setting, because the second I say "state" someone will say "we don't do symbolic states any more and we're doing fine." Relatedly: where in the sequence do I head off "isn't this just computational complexity / combinatorial explosion" (I don't think it is, but I'm not sure I can say why in one move), where do I head off "deep learning dissolved this," and where do I head off the outcome I'm most worried about — that they walk out thinking the frame problem is just a fancy name for "cognition is hard when you have limited time," at which point it stops being a distinctive problem at all.

  Also give me one question to end on that would show me whether they actually got it rather than just being able to repeat a slogan, and tell me what I should openly refuse to get into at this level. Two more things. First: I may have the shooting case wrong — I want to use the one where minimizing changes leaves you with a model in which the gun mysteriously becomes unloaded during the wait and the turkey survives; if I've mangled it, correct me, and tell me whether it even belongs in forty minutes or whether it'll eat the whole slot in the formalism. Second: please seperate, clearly, what I can present as settled among people who actually work on this from what's genuinely contested — I really don't want to stand up and imply, as a matter of record, that Dreyfus or Fodor showed symbolic AI was hopeless, or that circumscription is "the solution," and I'd like to know which of my three labels would get me argued with in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture plan:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student (mind/language), familiar with ML lab culture (sitting in for a year).
      *   **Audience:** ~15 ML PhD students (1st/2nd year), 2-3 philosophers. No prep reading.
      *   **Format:** 40 minutes, whiteboard only (no slides).
      *   **Goal:** A structural *plan*, not a script. Focus on dependencies (what must come before what).
      *   **User's Hypothesis:** Three-way split (Specification, Inference, Relevance). Needs validation/critique.
      *   **Key Constraints:**
          *   Need a *single* running example (no robot/bomb/wagon).
          *   Example must be statable in 2 sentences.
          *   Example must avoid risk/stakes (bomb), qualification problem (scratching floor), and ramification (battery moves).
          *   Example must survive translation to neural/learned-world-model settings (avoid "symbolic state" trap).
          *   Need to address specific objections: "Just complexity?", "DL dissolved this?", "Just bounded rationality?".
          *   Need a diagnostic closing question.
          *   Need to know what to *exclude*.
          *   Need clarification on the Yale Shooting Problem (YSP).
          *   Need distinction between settled vs. contested claims.

  2.  **Evaluate the User's Three-Way Split:**
      *   *(1) Specification (Frame Axioms):* This is the historical origin (McCarthy & Hayes 1969). Is it "handled"? In classical logic planning, yes (Successor State Axioms). In neural nets? Debatable.
      *   *(2) Inference (Computational/Non-monotonic):* This is the Shanahan/Hanks & McDermott era. How do we compute the extension without explosion?
      *   *(3) Relevance (Philosophical/Cognitive):* This is the Fodor/Dreyfus angle. How do we know *what* to check?
      *   *Critique:* The split is generally accepted as a useful heuristic, *but* there's tension. Many AI researchers think (1) and (2) *are* the frame problem and (3) is a different problem (sometimes called the "relevance problem" distinct from the frame problem). Philosophers often conflate them. I need to advise the user to be precise here: The "Classic" Frame Problem is (1) & (2). The "Philosophical" Frame Problem is (3). If she presents them as one seamless thing, ML students might think she's conflating engineering constraints with metaphysical puzzles.
      *   *Verdict:* Keep the split, but explicitly mark the boundary between the "AI Engineering" version and the "Philosophical/Cognitive" version.

  3.  **Develop the Running Example:**
      *   *Constraints:* 2 sentences, no risk, no ramification, no qualification, survives neural translation.
      *   *Bad:* Robot/Bomb (risk), Wagon/Battery (ramification), Turkey/Shooting (YSP complexity).
      *   *Idea:* Needs to be about *change* vs. *persistence* in a simple state.
      *   *Candidate:* A grid world? Too symbolic. A video game? Too complex.
      *   *Candidate:* "A block is on a table. I paint the block red."
          *   *Problem:* Does the location change? (Ramification).
      *   *Candidate:* "A light is on. I flip the switch."
          *   *Problem:* Causal chain.
      *   *Candidate:* "There is a cup on the desk. I pick up the pen."
          *   *Change:* Pen location.
          *   *Persist:* Cup location, Cup color, Desk color, Room temp, etc.
          *   *Neural translation:* Latent space representation of "cup on desk". Does the vector for "cup" change when "pen" moves?
      *   *Refinement:* Let's go with a simple visual scene.
      *   *Draft:* "A camera sees a red ball and a blue cube on a table. A robot arm moves the blue cube."
      *   *Why it works:*
          *   Change: Cube position.
          *   Frame: Ball position, Ball color, Cube color, Table existence.
          *   Neural: Latent factors. If I update the 'cube position' neuron, do I need to re-run the network to ensure 'ball color' didn't change?
      *   *Check against constraints:* 2 sentences? Yes. No risk? Yes. No ramification? (Assume cube doesn't hit ball). Survives neural? Yes (factorization of latent space).

  4.  **Structure the 40 Minutes (Dependencies):**
      *   *Phase 1: The Intuition (0-10 mins).* Define the problem using the example. Show why "assume nothing changes" is wrong and "list everything that doesn't change" is impossible.
      *   *Phase 2: The Formal/Engineering Attempt (10-20 mins).* Situation Calculus/Successor State Axioms. Show how it solves (1) Specification.
      *   *Phase 3: The Computational/Inference Hurdle (20-30 mins).* Why checking the axioms is still hard (Inference). Connect to ML (latent space factorization).
      *   *Phase 4: The Philosophical/Relevance Turn (30-35 mins).* Fodor/Dreyfus. Why do we know what's relevant *before* checking?
      *   *Phase 5: Objections & Closing (35-40 mins).* Address "DL dissolved this" and "Just complexity." Closing question.

  5.  **Address Specific Objections/Traps:**
      *   *"Just Complexity?":* It's not *just* O(N). It's that N is indefinite/open-world. In DL, it's about entanglement in latent space.
      *   *"DL Dissolved This?":* DL hides it in weights, but doesn't solve the generalization out-of-distribution. If the test distribution changes (new object), does the model know what persists?
      *   *Yale Shooting Problem:* It's about *non-monotonicity* and *time*. It might be too technical for 40 mins if the goal is intuition. Better to mention it as "why simple minimization fails" without deriving it.
      *   *Settled vs. Contested:*
          *   *Settled:* The logical formulation (SSAs) works for closed domains.
          *   *Contested:* Whether this solves the *philosophical* problem (Relevance). Whether DL actually solves it or just masks it.

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Example:* "A red ball and a blue block sit on a table. A hand enters and moves the blue block."
      *   *Sequence:*
          1.  Intuition (The "What changes?" puzzle).
          2.  Logic Solution (SSAs) -> Solves Specification.
          3.  Computation/ML Link (Latent disentanglement) -> Solves Inference (sort of).
          4.  Relevance (The "Why check *that*?" puzzle).
      *   *Objection Handling:*
          *   "Complexity": Distinguish combinatorial explosion from *indefinite* horizon.
          *   "DL": Distinguish interpolation from structural persistence.
      *   *YSP:* Keep it brief. It shows why "minimize change" isn't enough. Don't derive it.
      *   *Closing Question:* Needs to test if they understand the *generalization* aspect, not just the definition.

  7.  **Refining the "Three-Way Split" Critique:**
      *   The user asks if the carve-up is contested.
      *   *Answer:* Yes. AI researchers often reject (3) as "The Frame Problem." They call (3) "The Relevance Problem." Philosophers conflate them. I need to tell her to make this distinction explicit so she doesn't lose the ML crowd.
      *   *Order:* Specification -> Inference -> Relevance. This is the historical and logical dependency. You can't infer without specifying. You can't worry about relevance until you know what you're inferring.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate (peer-to-peer, respectful of ML expertise).
      *   Check whiteboard usage.
      *   Verify the "2 sentence example" constraint.
      *   Make sure the "DL dissolved this" counter-argument is sharp (it's about *systematic generalization*, not just prediction accuracy).

  9.  **Self-Correction on Yale Shooting Problem:**
      *   User asks: "I want to use the one where minimizing changes leaves you with a model in which the gun mysteriously becomes unloaded..."
      *   Correction: Yes, that is the YSP. It shows that simple "minimize change" (circumscription) fails because it allows the *future* to change the *past* (or rather, allows the gun to become unloaded spontaneously to minimize the change of the turkey dying).
      *   Advice: It's risky for 40 mins. It requires understanding time points and default logic. Suggest mentioning it as a "cautionary tale" about naive minimization without deriving it, unless she's very confident. Better to focus on the ML connection.

  10. **Finalizing the Closing Question:**
      *   Needs to distinguish "hard problem" from "frame problem."
      *   Idea: Ask about a scenario where the model works perfectly on training data but fails on a trivial persistence change in test data.

  11. **Review against constraints:**
      *   No slides.
      *   Whiteboard plan.
      *   Dependencies clear.
      *   Settled vs. Contested clear.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a structural plan for your 40 minutes. It prioritizes logical dependencies over historical chronology, ensures your three-way split is defensible, and protects you from the specific objections you anticipate.

  ### 1. Critique of Your Three-Way Split
  Your split is **heuristically useful but terminologically contested.**
  *   **The Split:** (1) Specification (Frame Axioms), (2) Inference (Computational/Non-monotonic), (3) Relevance (Cognitive/Philosophical).
  *   **The Contention:** Classical AI researchers (Shanahan, McCarthy) generally accept (1) and (2) as *The Frame Problem*. Many reject (3) as a separate issue (The Relevance Problem). Philosophers (Fodor, Dreyfus) conflate them to argue against computationalism.
  *   **The Fix:** Do not present them as one seamless "Frame Problem." Present them as **layers of granularity.**
      *   Layer 1 (Logic): How do we write it? (Solved by Successor State Axioms).
      *   Layer 2 (Computation): How do we compute it efficiently? (Solved by factoring/SSAs, but tricky in open worlds).
      *   Layer 3 (Cognition): How do we know *what* to factor? (Unsolved/Contested).
      *   *Why this order:* You cannot discuss inference efficiency (2) until you have a representation (1). You cannot discuss relevance (3) until you understand what inference is trying to achieve (2). If you start with (3), the ML students will think you're talking about attention mechanisms and miss the logical point.

  ### 2. The Running Example
  You are right to ditch the bomb/wagon. It introduces utility (risk) and physics (ramification), which muddies the water. You need a **factorization** example.

  **The Example:**
  > "A camera observes a red ball and a blue cube on a white table. A robotic arm enters the frame and pushes the blue cube."

  **Why this works:**
  1.  **Two Sentences:** Meets your constraint.
  2.  **No Risk/Stakes:** Nothing explodes; no "failure" condition other than representational error.
  3.  **No Ramification:** Pushing the cube doesn't inherently move the ball (unlike the wagon/battery).
  4.  **Symbolic to Neural Translation:**
      *   *Symbolic:* `Color(Ball, Red)`, `Pos(Cube, X)`. Action `Push(Cube)`.
      *   *Neural:* Latent vector $z$. Does updating the dimensions corresponding to `Cube_Position` require recomputing the dimensions for `Ball_Color`?
  5.  **The Bite:** If you represent the scene as a single holistic state (a raw pixel vector or a tangled latent code), you cannot guarantee the ball's color persists without re-observing it. The Frame Problem is the demand for **local update rules** in a **holistic state**.

  ### 3. The 40-Minute Sequence (Whiteboard Plan)

  #### Phase 1: The Intuition & Specification (0–10 mins)
  *   **Goal:** Establish that "assume nothing changes" is false, but "list everything that doesn't" is impossible.
  *   **Whiteboard:** Draw the scene (Ball, Cube, Table). Write `State_t` and `State_t+1`.
  *   **Move:** Ask: "After the push, what is true?"
      *   Students will say: "Cube moved."
      *   You ask: "Did the ball turn green?" "Did the table vanish?" "Did gravity turn off?"
      *   **The Trap:** To guarantee the ball didn't turn green using classical logic, you historically needed a **Frame Axiom** for every fluent-action pair. ($M$ actions $\times$ $N$ fluents = explosion).
      *   **The Solution (Layer 1):** Introduce **Successor State Axioms (SSAs)** briefly. "A fluent is true at $t+1$ iff the action made it true OR it was true at $t$ and the action didn't negate it."
      *   **Status:** *Settled.* In symbolic planning, SSAs solve the Specification Problem. Write "SOLVED (in closed domains)" next to Layer 1.

  #### Phase 2: Inference & The ML Connection (10–25 mins)
  *   **Goal:** Show why SSAs aren't enough for learning agents, and address the "Complexity" objection.
  *   **Whiteboard:** Draw a neural net schematic. Input (Image $t$) -> Latent $z$ -> Action -> Output (Image $t+1$).
  *   **Move:** "You don't write SSAs in a neural net. You learn transition dynamics."
  *   **The Problem:** If your latent space $z$ is entangled (e.g., one neuron encodes 'redness-of-ball-and-cube'), updating 'cube position' might inadvertently shift 'ball color' in the reconstruction.
  *   **The "Complexity" Objection:** *Head this off here.*
      *   *Student:* "Isn't this just $O(N)$? We have GPUs."
      *   *Your Reply:* "No. It's not about speed. It's about **generalization**. If I introduce a *new* object (a green pyramid) at test time, does your model know *a priori* that pushing the cube won't change the pyramid's color? Or does it need to re-learn that persistence is the default?"
      *   **Key Distinction:** The Frame Problem is not "computation is expensive." It is "how do you represent the world such that **default persistence** is structurally guaranteed, not just statistically likely?"
  *   **Status:** *Contested.* ML practitioners argue disentangled representations (e.g., Object-Centric Learning) solve this. Skeptics argue this doesn't scale to open worlds.

  #### Phase 3: Relevance & The Philosophical Turn (25–35 mins)
  *   **Goal:** Introduce Layer 3 without alienating the engineers.
  *   **Whiteboard:** Write "Relevance."
  *   **Move:** "SSAs tell us how to check if a fluent changed. But **which fluents do we check?**"
      *   In the example: We check Ball Position. We don't check "Number of atoms in the table."
      *   **Fodor/Dreyfus Point:** To know what to check, you need to know what is *relevant*. But relevance seems to depend on the whole context (holism). If computation is local (as SSAs require), how do you select the local context without already knowing the answer?
      *   **The "DL Dissolved This" Objection:** *Head this off here.*
          *   *Student:* "Transformers/Attention solve relevance. They weight tokens."
          *   *Your Reply:* "Attention weights are learned from data. The Frame Problem asks how you know what to attend to **before** you have data on that specific causal structure. If the distribution shifts (e.g., magnetic table), your attention mechanism might fail to check the right thing. The philosophical problem is about the **normative** constraint on inference, not the **mechanism** of selection."
  *   **Status:** *Highly Contested.* Do not claim this is solved. Do not claim Dreyfus "refuted" AI. Claim that this remains the gap between narrow AI and general cognition.

  #### Phase 4: The Yale Shooting Problem (YSP) Note (35–37 mins)
  *   **Goal:** Address your specific question about YSP.
  *   **Correction:** You have the YSP right. It shows that naive "minimize change" (circumscription) fails because it allows the gun to spontaneously become unloaded (a change) to avoid the turkey dying (a bigger change in some metrics), or vice versa depending on temporal formulation.
  *   **Advice:** **Do not derive it.** It consumes 15 minutes and requires temporal logic syntax.
  *   **Usage:** Use it as a **cautionary label.** "If you try to solve Layer 2 by just saying 'minimize changes,' you run into the Yale Shooting Problem, where your logic allows magical unloading of guns. This is why we need SSAs, not just minimization."
  *   **Verdict:** Mention it to show depth, but do not make it a pillar of the talk. It's too technical for the goal.

  #### Phase 5: Closing & Diagnostic (37–40 mins)
  *   **Goal:** Ensure they distinguish "Hard" from "Frame."
  *   **The Closing Question:**
      > "If I train a world model on a million videos of blocks being pushed, and it predicts the next frame perfectly: **Has it solved the Frame Problem, or has it just memorized the statistics of persistence?** How would you tell the difference?"
      *   *Why this works:* If they say "It doesn't matter, it predicts," they missed the point (it's about representation/generalization). If they say "Test it on a new object," they get it (it's about inductive bias/structure).
  *   **What to Refuse to Get Into:**
      1.  **The Qualification Problem:** (e.g., "What if the potato is in the tailpipe?"). Explicitly say: "That is a sibling problem. Today we assume actions succeed. We are asking what *else* happens."
      2.  **The Ramification Problem:** (e.g., "Moving the cube knocks the ball"). Explicitly say: "We assume direct effects only. We are asking about *non*-effects."
      3.  **Specific Logic Formalisms:** Do not write out Situation Calculus axioms. Use pseudo-code or English conditionals.

  ### 4. Settled vs. Contested (Cheat Sheet)

  | Claim | Status | Who agrees/disagrees |
  | :--- | :--- | :--- |
  | **SSAs solve the logical specification problem.** | *Settled* | Almost everyone in symbolic AI. |
  | **The Frame Problem is just computational complexity.** | *Contested* | Engineers often say yes; Philosophers/Cognitive Scientists say no (it's representational). |
  | **Deep Learning has dissolved the Frame Problem.** | *Contested* | DL researchers often say yes (it's implicit); Critics say no (it's hidden in weights, not solved for OOD). |
  | **Fodor/Dreyfus proved symbolic AI is impossible.** | *False/Contested* | Don't say this. Say they identified a gap in *explanatory scope* regarding relevance. |
  | **Circumscription is the solution.** | *False* | YSP showed naive circumscription fails. |
  | **Relevance (Layer 3) is the same as Frame (Layer 1).** | *Contested* | Philosophers often conflate; AI researchers distinguish. |

  ### 5. Summary of Dependencies
  1.  **Example First:** You must establish the "Ball/Cube" scenario before defining the problem, otherwise "persistence" is abstract.
  2.  **Specification before Inference:** You must show *what* needs to be computed (SSAs) before discussing *how hard* it is (Complexity/DL).
  3.  **Inference before Relevance:** You must show that even with efficient inference, selecting *what* to infer is a separate hurdle.
  4.  **Objections last:** Do not preemptively defend against "DL solved this" in Phase 1. Let them feel the problem first, then introduce the objection when you discuss Layer 2/3.

  ### 6. Whiteboard Layout Plan
  *   **Left Third:** The Example (Ball/Cube). `State_t` vs `State_t+1`. List of "Changed" vs "Same".
  *   **Middle Third:** The Layers.
      1.  Specification (SSAs) -> [SOLVED]
      2.  Inference (Computation/Representation) -> [OPEN in ML]
      3.  Relevance (Context) -> [OPEN in Philosophy]
  *   **Right Third:** Objections & Closing.
      *   "Just Complexity?" -> No, it's Generalization.
      *   "DL Solved it?" -> Implicit vs. Explicit.
      *   Closing Question.

  This structure respects the ML students' expertise (acknowledging SSAs are "old news" for planning but relevant for representation) while preserving the philosophical depth you need to cover.
