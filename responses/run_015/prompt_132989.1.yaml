  The mist hangs low on the path I knew,
  the ridge splits in two, beneath the blue,
  I check the map for a clearer view,
  the station only says if, nothing new.
  The pine trees hum with a secret sound,
  the ridge splits in two, where shadows grow,
  A hidden frequency starts to pound,
  the station only says if, soft and low.

  The radio crackles with conditional light,
  If Blue is HQ, then the path is clear,
  But the pines drink signals from the other side,
  A silent weight I carry here.
  The probability hangs like a mist on the hill,
  the ridge splits in two,
  the station only says if,
  And the walker stands still.

  In short: knowing the consequence of a place does not tell you where you stand.
