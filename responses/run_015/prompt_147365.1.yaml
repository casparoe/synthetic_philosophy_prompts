  The error lies in step (3). Hallam's argument depends on an equivocation regarding the word "know." By rejecting (3), you preserve (1) and (2) exactly as you wish—Mary does genuinely learn something, and she does so by having the experience—without being forced into the conclusion that she learns a *fact* that disproves physicalism.

  **The Diagnosis**
  Step (3) asserts that "Knowing is factive," implying that all instances of "knowing" (including "knowing what it is like") entail the acquisition of a propositional fact (a "knowing-that"). This is the shape of the error: it treats phenomenal knowledge as structurally identical to propositional knowledge. The correct diagnosis is that "knowing what it is like" is a distinct epistemic category, often analyzed as **practical knowledge** or **ability** (the "Ability Hypothesis"). When Mary leaves the room, she does not acquire a new piece of information about the world; she acquires a new set of abilities: the ability to recognize red, the ability to imagine red, and the ability to remember red.

  **The Cost**
  The cost of rejecting (3) is deflationary. You must accept that the "mystery" of consciousness is not a mystery of *ontology* (new non-physical facts) but of *capacity* (new modes of processing). For a novelist, this shifts the theme from "Mary discovered a hidden truth of the universe" to "Mary gained a new power of mind." This is often dramatically richer: it focuses on the transformation of the subject rather than the structure of the world.

  **Addressing the Iris Case**
  You noted that Iris's case strikes you as a clearer instance of learning. On the Ability Hypothesis, this intuition is correct but misclassified. Iris *does* learn something each day: she acquires a temporary ability to discriminate that day's hue. However, because she cannot retain or re-identify the hue later, she does not acquire a stable *fact*. Facts are typically taken to be stable truths; abilities can be fleeting.
  This explains why the Iris case does not generate the absurdity of "undetectable facts" (10). Iris acquires 365 transient abilities, not 365 undetectable facts. The "learning" is real (she can act on the hue *now*), but it does not commit you to an ontology of invisible facts. This survives your concern because it validates the intuition that Iris learns *something* (an ability) without forcing the metaphysical bullet of (10).

  **Preserving (1) and (2)**
  Rejecting (3) allows you to keep (1) and (2) intact.
  (1) Mary knows all physical facts. (True)
  (2) Mary comes to know what it is like to see red. (True, on the reading that she acquires the ability to visualize/recognize it).
  The inference to (4) and (5) is blocked because acquiring an ability is not acquiring a fact. Hallam's generalization (6) also fails, as acquiring a phenomenal concept (ability) does not entail acquiring a fact.

  **Summary of the Cut**
  You cut the link between experience and *propositional* truth. Mary's release is an expansion of her capacities, not her database. This refutes Hallam's physicalism-denying conclusion while keeping the core dramatic beat: Mary is changed by the experience.

