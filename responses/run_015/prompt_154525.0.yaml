  ### 1. The Tensions (Ranked by Severity)

  #### **Rank 1: The Logical Contradiction — (3) vs. (4)**
  *   **The Conflict:** Claim (3) states that resentment is fitting *only* when conduct expresses a "deficient quality of will" (ill will or disregard). Claim (4) states that pure thoughtlessness is "fully blameworthy" even when there is "no disregard the agent would avow." If the agent avows regard and holds no ill will, and you define thoughtlessness as a mere failure to *have the person in mind*, you have explicitly described a scenario where blame exists *without* the deficient quality of will required by (3).
  *   **What must be given up:** You must give up the description in (4) that thoughtlessness involves "no disregard."
  *   **The Cost:** You lose the intuitive distinction between "I didn't care about you" (ill will) and "I didn't think about you" (negligence).
  *   **The Fix:** You do not need to abandon (4), but you must align it with (3). Standard Strawsonians argue that failing to have someone in mind *just is* a form of deficient regard (a failure of due heed), regardless of what the agent avows. If you maintain that avowal trumps action in defining "regard," (3) and (4) cannot both stand.

  #### **Rank 2: The Metaphysical Threat — (1) vs. (5)**
  *   **The Conflict:** Claim (1) adopts Strawson's anti-skeptical stance: the practice needs no external vindication, and determinism/history doesn't undermine it wholesale. Claim (5) introduces "causal history" (engineering, abuse) as a mitigator *even when* current reasons-responsiveness and quality of will are intact. This re-opens the door to the "ultimate responsibility" worries you tried to close in (1). If history matters in Case A (abuse), why does it not matter in Case B (determinism)?
  *   **What must be given up:** You must give up the idea that *causal history itself* is the blame-reducer.
  *   **The Cost:** You lose the ability to say "it's not her fault because of her past."
  *   **The Fix:** History must matter only insofar as it impacts *current capacities* (linking to Claim 2), not as an independent metaphysical excuse. If the agent is currently reasons-responsive and expresses ill will, a Strawsonian typically says history is irrelevant. To keep (5), you must argue that abuse/engineering subtly degrades the *quality* of the reasons-responsiveness in a way that isn't immediately visible, or that it constitutes a partial exemption (Claim 2) rather than a mitigation of blame for a full agent.

  #### **Rank 3: The Stopping Point Problem — (5) vs. (6)**
  *   **The Conflict:** Claim (5) allows upbringing/abuse to reduce blame. Claim (6) argues that citing upbringing is frequently condescension and that we *owe* it to people to hold them responsible. There is no principled line here yet between the "covert engineering/abuse" of (5) and the "social circumstances/upbringing" of (6).
  *   **What must be given up:** You must give up the universal claim in (6) that citing upbringing is *frequently* a failure to take someone seriously.
  *   **The Cost:** You lose some rhetorical force against the "social excusers."
  *   **The Fix:** You need a distinction between *constitutive* history (which shapes the moral faculty itself) and *circumstantial* history (which presents obstacles to the moral faculty). (5) applies to the former; (6) applies to the latter. Without this distinction, (5) swallows (6).

  ---

  ### 2. The Single Revision

  **Revise Claim (5).**

  Do not frame the exemption in terms of **"Causal History."** Frame it in terms of **"Constitutive Capacity."**

  **Why this cleans up the most:**
  1.  **Resolves (1) vs. (5):** By shifting focus from *history* (which invites infinite regress/determinism worries) to *capacity* (a present-state feature), you remain consistent with (1). You are not looking backward at causes; you are looking at the current structural integrity of the agent's moral faculties. This protects your Strawsonian core.
  2.  **Resolves (5) vs. (6):** This provides the principled stopping point you requested. "Covert engineering" and severe "abuse" can be described as damaging the *capacity* for moral recognition (aligning with Claim 2's exemptions). Ordinary "upbringing" or "social circumstances" generally leave the capacity intact but make its exercise difficult. You can hold people responsible for difficulty (6) without holding them responsible for incapacity (5).
  3.  **Clarifies (3):** It clarifies that the "deficient quality of will" in (3) presupposes a functional moral capacity. If capacity is compromised (by engineering/abuse), the expression of will is not fully attributable, preserving the logic of (3).

  **The Revision Text:**
  > *(5) Constitutive capacity can matter: an agent whose agency was covertly engineered or whose deepest commitments were shaped by severe abuse may lack the full capacity for moral recognition, even if she appears reasons-responsive. In such cases, she is partially exempt (as in 2), not merely mitigated. This does not apply to ordinary social circumstances, which challenge but do not disable the moral capacity.*

  **Note on (3) vs. (4):**
  While revising (5) is the high-value strategic move for your dissertation's original contribution, you **must** also linguistically align (3) and (4). You do not need a separate "revision" here, but you must amend the text of (4) to acknowledge that thoughtlessness *constitutes* a deficient quality of will (a failure of due regard), even if no ill will is avowed. If you leave (4) claiming there is "no disregard," your committee will flag it as a logical error regardless of how well you solve the history problem.
