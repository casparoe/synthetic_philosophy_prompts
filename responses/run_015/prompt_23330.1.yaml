      *   *Claim:* "Each evening he examined himself and scored each virtue that day on a 1-to-10 scale, then averaged the week to see how far he'd come." -> **Incorrect.** Franklin used a system of marking *faults* (black dots/marks) for violations. He did *not* score virtues on a 1-to-10 scale. He aimed for a clean page (no marks). There was no averaging. This is a major distortion of the method.
      *   *Claim:* "He cycled through all thirteen only once or twice a year." -> **Correct.** (13 weeks = ~3 months. 4 cycles = 1 year. He aimed for 4 courses a year, so "once or twice" is a bit low but acceptable interpretation of his progress, though he *planned* for four. Actually, Franklin says "I went through a course four times in a year." The student says "once or twice." This is slightly inaccurate regarding his *plan* vs. *reality*, but acceptable).
