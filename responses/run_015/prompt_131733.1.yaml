      *(Wait, one more thing)*: The user worries about the "Prior" in (6). I need to reassure them that Dennett *agrees* there is a prior, but it's not "spooky." It's the evolutionary/cultural history of the interpreter. This doesn't undermine the "Realness," it grounds it.

      *   Okay, good to go.

      *(Wait, check the "Real Patterns" paper specifically)*: Dennett explicitly discusses the "noise" factor. A pattern is real if it supports *counterfactuals*. "If the system had been perturbed, it would have..." The Kestrel box "desire" hypothesis fails this unless the desire is rational.
      *   Okay, I will emphasize the *counterfactual* aspect of compression.

      *   Plan:
          1.  Validate.
