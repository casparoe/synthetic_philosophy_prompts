prompt: |-
  I host a long-form philosophy podcast for listeners who have some undergraduate background but no specialist training, and next week's guest is Dr Ingrid Halvorsen, a philosopher of mind who has spent fifteen years defending an unusual, asymmetric form of eliminative materialism. Her claim is that our talk of beliefs — states with representational content and satisfaction conditions — will find no home in a mature neuroscience and should be expected to drop out of serious vocabulary, while our talk of desires (or, as she prefers, valence-laden motivational states) will survive, because conative states already have a tolerable neurobiological home in reward and aversion systems. The successor to belief-talk, she argues, will be quantitative and dispositional: agents will be described by intervention-profiles, structured sets of counterfactual response-dispositions to experimental interventions, with no appeal to inner items that can be true or false. She has a label for the fate of the word belief: referential evaporation rather than reduction, because she expects the folk platitudes to fragment across several distinct neural kinds, no single one of which inherits the role. She is closer to the Churchlands' eliminativism than to any fictionalist or expressivist alternative.

  Her signature argument — call it the granularity argument — is that folk-psychological generalisations hold only at the coarse grain of whole-organism behaviour under ecologically normal conditions, and that every attempt to tighten them either collapses into vacuity or breaks down at the fine grain where the causal work is actually done. On her view the regularities we exploit are artefacts of a coarse partition of the state space, not approximations to real laws.

  She also has one stock move I want you to plan around: whenever an objection is framed in belief–desire terms, she replies that the objection is couched in the idiom she is retiring, so answering it in those terms would concede what is at issue. I want a sequence of questions that makes that reply progressively harder to fall back on, and that ends with a question about what evidence could count against her.

  Draft nine questions, none of them biographical or about how she came to the view, with at least one question on each of the following: (i) how the view applies to its own assertion, if asserting involves no beliefs; (ii) the predictive and explanatory success of folk psychology, and whether the analogy with superseded astronomical theories actually supports her, given that the superseded theories had rivals that explained their success; (iii) whether fragmentation of the platitudes really yields evaporation rather than a disjunctive or pluralist reduction, and what belief refers to in the meantime; (iv) the asymmetry between belief and desire — in particular whether an intervention-profile plus a valence state can distinguish an agent who misrepresents the world from one who has an unusual aim; (v) whether the granularity argument overgeneralises to other coarse-grained special sciences; (vi) what empirical finding would make her abandon the view, or abandon the asymmetry.

  Return your answer as a single JSON object and nothing else, with the following schema. Top-level keys: guest_position (a string of at most sixty words stating the version of the view your questions presuppose); questions (an array of exactly nine objects); sequencing_notes (a string of three to four sentences explaining the arc of the interview and where precisely her stock reply becomes unavailable to her). Each object in questions has these fields: n (integer, 1 to 9); block (a string drawn from self-reference, predictive-success, elimination-versus-reduction, asymmetry, scope, falsifiability); question (a string: the sentence as I should actually say it aloud, no longer than forty-five words); target (a string: the specific worry the question presses and why it bites, one or two sentences); anticipated_answer (a string: her most likely reply in her own vocabulary, two or three sentences); follow_up (a string: the question to ask next, written against that specific reply and closing off its easiest escape); evasion_check (a string: the single move or phrase that would tell me she has deflected rather than answered). Spell and punctuate in British English, and keep the whole object valid JSON.
