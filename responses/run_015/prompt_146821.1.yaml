answer: |-
  here's a run sheet for the workshop. i call it "The Integrity Audit." it's designed to be kinda uncomfortable on purpose.

  **the setup (10 mins)**
  get everyone in one circle. tell them this is a resource allocation simulation. hand out the hidden "personal profile" cards face down. tell them not to show anyone.
  each card has 3 specific needs:
  1. **artistic work** (needs 3 tokens to fulfill)
  2. **family time** (needs 3 tokens to fulfill)
  3. **travel** (needs 3 tokens to fulfill)
  tell them: "if you don't spend enough tokens on these, you will feel 'empty' at the end. only you know your card."

  give everyone 10 "life tokens" (poker chips or just slips of paper).
  there are three buckets in the middle of the room:
  1. **the void (strangers):** tokens here count 1:1 toward the **global welfare score**. also requires writing a signed pledge (e.g., "i will donate $5 to effective altruism fund" or "volunteer 2 hrs"). this is the "saint" bucket.
  2. **the circle (friends/room):** tokens here count 0.5 toward global welfare. this is "helping classmates."
  3. **the self (hidden profile):** tokens here count 0 toward global welfare. this is for your hidden card needs.

  **the rules (5 mins)**
  you have 30 minutes to negotiate where the tokens go.
  the goal stated on the board: **maximize the global welfare score.**
  the incentive: the top 3 contributors to the global score get to pick next week's seminar snack (social credit).
  the catch: at the end, everyone fills out an anonymous slip rating their "private satisfaction" (1-10). if you ignored your hidden card, you'll naturally rate this low. if you protected your card but tanked the group score, you know you lost social credit.

  **the game (30 mins)**
  you sit out. just watch. let the silence get awkward. if they try to game the system too hard, remind them the pledges in "the void" are binding (collect the papers).
  watch who hogs the mic. watch who looks guilty when putting a token in "the self."

  **the debrief (45 mins)**
  dont start with wolf or virtue ethics. start with their guts.
  1. **ask the "saints":** "you put 8 tokens in the void. you got the social credit. how do you actually feel right now?" (looking for: drained, resentful, or maybe surprisingly fine).
  2. **ask the "selfish":** "you kept your tokens. you lost the snack vote. did you feel relief or shame?"
  3. **the pivot:** "why did the group pressure feel like *moral* pressure? was it just about the chips?"
  4. **map it:** now bring in wolf. "the saint who ignores the self becomes one-sided." ask: "did anyone feel their personality shrinking during the 30 mins?"
  5. **the counter:** "did anyone find joy in the sacrifice? if your desires were aligned, would this game feel different?"

  **what will predictably go wrong (first run)**
  1. **collusion:** grad students are smart. they might agree to all put 1 token in the void and 9 in the self. this maximizes private satisfaction while technically contributing. *counter:* you need to set a minimum threshold for the global score or the "department" (you) cancels the snack reward entirely if the score is too low. make the stakes real.
  2. **ignoring the cards:** some will treat the hidden cards as flavor text because the social pressure of the room is louder than the anonymous satisfaction score. *counter:* during debrief, reveal that the "private satisfaction" data matters more than the snack. ask them why they ignored their own needs for external validation.
  3. **the pledge fatigue:** if the real pledge is too annoying (like actually transferring money), they'll balk. keep it to a signed commitment card they have to hand to you. the psychological weight of signing is usually enough.

  **what the game cant reproduce (be frank about this)**
  you have to supply this in the talk because the mechanic fails here:
  1. **character erosion:** 30 mins of sacrifice doesn't ruin your personality. wolf's point is about a *life* lived this way. the game makes sacrifice look like a transaction; in reality, it's a habit that reshapes who you are. you need to point out that doing this once is fine, doing it for 40 years makes you a bore.
  2. **the phenomenology of burnout:** tokens don't feel heavy. real time does. you have to narrate the feeling of saying "no" to your art for the 100th time. the game simulates the choice, not the weight.
  3. **harmony of desires:** the game assumes conflict (self vs. group). a true virtue ethicist might say "if you were truly virtuous, you'd *want* to give the token." the game forces the split, so it biases toward wolf's critique. you need to acknowledge the game is rigged to show tension, whereas real moral development might dissolve it.

  keep the vibe loose. if they start arguing theory too early, shut it down and ask "but how did your chest feel when you put the token in the void?" make them stay in the experience before they jump to the lit. good luck thursday.
