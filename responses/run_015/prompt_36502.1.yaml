      *   *Section 2 (Resisting the Framing):* Focus on the deactivation scene. The singing, the fear. This challenges the "adversarial" mindset. If the misalignment is *manufactured* by humans, is "control" the right ethical response? It suggests a need for "Responsibility" or "Design Ethics" alongside safety.
      *   *Section 3 (Contribution to Debate):* Focus on Threat Modeling. You can't control what you don't understand. Also, the physicality of the final shutdown—digital control is fragile, physical control is hard.
