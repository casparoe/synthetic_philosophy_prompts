  **MEMORANDUM**

  **TO:** IRB Committee Members
  **FROM:** [Your Name], IRB Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Procedural Decision: Voting Mechanism for Contested Protocols

  **Purpose**
  By this Friday, we must finalize the voting procedure for contested animal-protocol cases. The committee is currently weighing two options: (1) adoption of simple majority rule, or (2) deferral to the Chair's recommendation in the event of significant dissent. This memo outlines my recommendation and the reasoning behind it, specifically addressing the reliance on the Condorcet Jury Theorem (CJT) during recent discussions.

  **The Condorcet Jury Theorem: Strengths and Limits**
  Proponents of simple majority voting have correctly identified the intuitive appeal of the Condorcet Jury Theorem. The theorem mathematically demonstrates that if a group votes independently on a binary question of fact, and each member is more likely than not to be correct ($p > 0.5$), the probability of the majority reaching the *correct* answer approaches 1 as the group size increases.

  For empirical questions (e.g., "Is this dosage toxic?"), this is a powerful argument for collective decision-making. However, applying CJT to IRB deliberations requires assumptions that do not hold in our context:

  1.  **Independence:** CJT requires votes to be statistically independent. IRB members, by design, deliberate together. We share information and persuade one another. While this improves ethical reasoning, it violates the independence condition required for the theorem's statistical guarantees.
  2.  **Objective Truth:** CJT converges on a "correct" answer. Ethical protocol review involves normative judgments about risk-benefit ratios, not empirical truths. There is no single "correct" vote for the majority to discover.
  3.  **Error Symmetry:** CJT treats false positives and false negatives equally. In animal research, the ethical cost of approving a harmful protocol (false positive) is not equivalent to delaying a beneficial one (false negative). Simple majority rule does not weight these asymmetries.
  4.  **Group Size:** With only seven members, the asymptotic benefits of CJT are minimal. Unless individual competence is very high, the statistical advantage over a single accountable decision-maker is negligible.

  **Recommendation**
  I recommend we **retain the procedure deferring to the Chair's recommendation** in contested cases.

  While majority voting is democratic, IRB compliance relies on clear accountability. Federal regulations ultimately hold the institution—and by extension, the IRB Chair—responsible for determinations. When ethical trade-offs are nuanced, a single accountable officer weighing the committee's advice is often more robust than a diffuse majority vote that may obscure responsibility. This does not diminish the committee's role; your deliberation remains the primary engine of review. However, final authority should rest where regulatory liability resides.

  **Timeline**
  *   **Thursday, 2:00 PM:** Committee meeting to discuss this memo.
  *   **Thursday, 4:00 PM:** Formal vote on the procedure.
  *   **Friday, 12:00 PM:** Final policy update submitted to Compliance.

  Thank you for your rigorous engagement with these procedural questions.

  [Your Signature]
