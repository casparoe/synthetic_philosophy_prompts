      *   *Best Single Revision:* Clarify the definition of "Ownership" in this context. Distinguish between *attribution* (plagiarism) and *exploitation rights* (IP law).
      *   *Actually, looking closer:* Position (ii) is the biggest outlier. It says "forever." That breaks (iv). It says "control." That breaks (i).
