      *   **Tension E: (vii) vs. (ii)/(v)**
          *   (vii) says copying business models is fine.
          *   (ii)/(v) implies hard work/priority grants ownership. A business model is hard work and priority matters. Why is it different from a drug or song?
          *   *Severity:* Medium. Inconsistent application of the "Labor" principle.

  4.  **Rank Tensions by Severity:**

      1.  **(ii) vs. (iv):** "Forever" vs. "15 Years." This is a logical impossibility.
      2.  **(i) vs. (ii):** "Fences are wrong" vs. "They earned permanent control." This is the foundational ethical clash.
      3.  **(v) vs. (i):** Punishing independent discovery contradicts the "non-rivalrous" freedom argument.
      4.  **(vii) vs. (ii):** Why is a recipe different from a drug?

  5.  **Develop Fixes and Costs:**

      *   *Fix for (ii) vs. (iv):* Drop "forever" in (ii).
          *   *Cost:* Weakens the moral claim of absolute desert.
      *   *Fix for (i) vs. (ii):* Reframe (i) to be about *physical* deprivation, not moral right. Or reframe (ii) to be about *incentive*, not natural right.
          *   *Cost:* Losing the intuitive "apple" analogy or the strong "I made it, it's mine" feeling.
      *   *Fix for (v) vs. (i):* Allow independent invention defense.
          *   *Cost:* Weakens patent value, makes enforcement harder.

  6.  **Identify the "Single Revision" for Maximum Cleanup:**
      *   The root cause of the mess is Position (ii). It claims "forever" (contradicts iv) and claims ownership based on "labor" (contradicts i's skepticism of fences and vii's acceptance of competition).
      *   If (ii) is changed from a *moral right to permanent ownership* to a *pragmatic incentive for limited time*, it aligns with (iii), (iv), and softens the clash with (i).
