          *   (ii) says creators should control them "forever" because of labor.
          *   *Severity:* High. This is the core philosophical conflict (Non-rivalry vs. Labor Desert).
      *   **Tension B: (ii) vs. (iv)**
          *   (ii) says control "forever."
          *   (iv) says control "15 years max."
          *   *Severity:* High. Direct contradiction on duration.
      *   **Tension C: (i) vs. (v)**
          *   (i) implies ideas are free to share because copying doesn't hurt.
          *   (v) punishes the second inventor even if they didn't copy (independent invention). This restricts the "non-rival" nature of ideas based on priority, not theft.
          *   *Severity:* Medium-High. (v) enforces a monopoly on something (i) says shouldn't be fenced.
      *   **Tension D: (iii) vs. (i)**
          *   (i) says fences are morally weird.
          *   (iii) says patents (fences) are good instrumentally.
