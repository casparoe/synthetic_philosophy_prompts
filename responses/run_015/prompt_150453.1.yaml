      *   (iii) *Utilitarian/Patents:* Patents are good because they prevent trade secrets/disclose info. (Economic Incentive theory).
      *   (iv) *Term Limits:* Copyright should be short (15 years). Culture belongs to everyone eventually. (Public Domain leaning).
      *   (v) *Priority/First-to-File:* Independent invention doesn't matter; first person wins. (Current Patent Law).
      *   (vi) *AI Authorship:* AI art no copyright due to diffuse authorship. (Legal/Practical stance).
      *   (vii) *Context Matters:* Plagiarism (school) = bad. Business/Recipe copying = competition. (Contextual ethics).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (i) vs. (ii)**
