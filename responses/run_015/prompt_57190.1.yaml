answer: |-
  This is a sharp methodological move. Most seminar papers fail because they critique Theory A using the success criteria of Theory B. By fixing the *function* of the theory first (an ex ante institutional decision rule), you filter out historical verdicts and purely agent-centered moralizing.

  Below is the specification list. I have distinguished between **Settled** (broad consensus among serious scholars, even if politicians ignore it) and **Contested** (genuine theoretical disagreement). I have also flagged requirements that are **Camp-Prejudice** relative to your specific constraint (i.e., they look like requirements but violate your "no mind-reading/no hindsight" rule).

  ### The Specification Table

  | id | requirement | motivating case or consideration | verdict | status | conflicts |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Just Cause Threshold:** Define a severity threshold of harm that overrides sovereignty without relying on hindsight. | Rwanda 1994 (failure to act); Syria 2013 (chemical weapons line). | Genuine | Settled (threshold exists), Contested (height) | R4, R5 |
  | **R2** | **Legitimate Authority:** Specify who authorizes force (UNSC, Regional Body, or Unilateral) and handle veto paralysis. | Kosovo 1999 (unauthorized); Iraq 2003 (disputed authorization). | Genuine | Contested | R1, R5 |
  | **R3** | **Operationalizable Intention:** Provide a proxy for "right intention" that does not require accessing decision-makers' private motives. | Iraq 2003 (oil/democracy mix); Libya 2011 (protection vs. regime change). | Camp-Prejudice | Contested | R1, R7 |
  | **R4** | **Temporal Last Resort:** Define "last resort" as a function of urgency and diplomatic viability, not infinite delay. | Rwanda 1994 (diplomacy during genocide); Kosovo 1999 (Rambouillet talks). | Negotiable | Contested | R1, R5 |
  | **R5** | **Ex Ante Success Probability:** Require a credible prediction of net benefit based on intelligence available *before* intervention. | Iraq 2003 (WMD/intelligence failure); Libya 2011 (post-Gaddafi vacuum). | Genuine | Contested | R1, R2, R7 |
  | **R6** | **Means-End Distinction:** Explicitly separate humanitarian protection (end) from regime change (means) and justify the link. | Libya 2011 (UNSC 1973 mandate creep); Iraq 2003 (regime change as primary goal). | Genuine | Contested | R3, R7 |
  | **R7** | **Post-Intervention Obligation:** Specify duties of reconstruction and exit strategy to avoid "smash and leave." | Iraq 2003 (de-Ba'athification chaos); Libya 2011 (state collapse). | Genuine | Settled (normatively) | R3, R5 |
  | **R8** | **Selectivity Consistency:** Explain why intervention occurs in Case A but not Case B without appealing solely to national interest. | Rwanda 1994 (no interest) vs. Kosovo 1999 (European interest); Syria 2013 vs. Libya 2011. | Genuine | Contested | R2, R5 |

  ### Unsatisfiable Sets (The Trade-Offs)

  You asked for the pairs or trios that cannot be jointly satisfied. These are the structural tensions your paper should highlight. If a theory claims to solve all of these, it is likely hiding a premise.

  **1. The Veto Trilemma (R1 + R2 + R5)**
  You cannot simultaneously satisfy: (a) A strict **Just Cause** threshold (stop genocide), (b) A strict **Legitimate Authority** requirement (UNSC approval only), and (c) **Effectiveness** (stopping the killing in time).
  *   *The Conflict:* If a permanent member vetoes intervention during a genocide (Rwanda 1994, Syria 2013), adhering to R2 violates R1. Ignoring R2 to satisfy R1 undermines international law (R8).
  *   *The Implication:* A theory must choose between *legality* (UNSC monopoly) and *moral necessity* (Regional/Unilateral action when UNSC is paralyzed). You cannot have both.

  **2. The Epistemic Triangle (R3 + R4 + R5)**
  You cannot simultaneously satisfy: (a) **Verifiable Intention**, (b) **Last Resort**, and (c) **Reasonable Prospect of Success** under ex ante constraints.
  *   *The Conflict:* To verify intention (R3) without mind-reading, you need observable actions, which take time. To satisfy Last Resort (R4), you wait for diplomacy to fail, which takes time. But waiting reduces the Prospect of Success (R5) as the humanitarian situation deteriorates or the aggressor entrenches.
  *   *The Implication:* "Last Resort" is often a disguised form of "Status Quo Bias." If your theory demands exhaustive diplomacy, it functionally prohibits intervention in fast-moving atrocities.

  **3. The Moral Hazard Paradox (R1 + R8)**
  You cannot simultaneously satisfy: (a) A **Credible Commitment** to intervene when thresholds are met, and (b) **Selectivity Consistency** that doesn't encourage reckless rebellion.
  *   *The Conflict:* If you make your intervention rule too clear and credible (R1), rebel groups may provoke regime crackdowns to trigger foreign intervention (the "moral hazard" observed in some readings of Libya/Kosovo). If you make the rule vague to avoid this, you fail the Selectivity test (R8) and appear arbitrary.
  *   *The Implication:* A decision rule that is too transparent creates perverse incentives; a rule that is opaque looks like imperialism.

  ### The Knockout Requirement

  **R3 (Operationalizable Intention)** knocks out the most candidates.

  Traditional Just War Theory (JWT) and many philosophical accounts rely heavily on *Jus Ad Bellum* requiring "Right Intention." However, under your constraint (an institutional rule that cannot read minds), this requirement is functionally useless.
  *   **Why it knocks out candidates:** Any theory that makes moral permissibility contingent on the *private motives* of leaders (e.g., "Was Blair motivated by humanitarianism or oil?") fails your spec. Institutions can only judge public rationales and observable conduct.
  *   **The Consequence:** This eliminates agent-centered deontological accounts that focus on the moral character of the intervener. It forces the theory toward consequentialist or institutionalist frameworks where *outcome* and *mandate* matter more than *motive*.
  *   **Note on "Unlawful yet Justified":** Regarding your question on whether this is a coherent category: Under this spec, **yes**. If R2 (Authority) is legal positivism (UN Charter) and R1 (Cause) is moral necessity (Genocide), Kosovo 1999 fits the category. It was unlawful (no UNSC resolution) but arguably justified (stopped ethnic cleansing). A theory that cannot accommodate this category fails to explain the last 30 years of practice.

  ### Scorecard of Main Contenders

  *   **Classical Just War Theory:** Fails **R3** and **R5**. It relies too heavily on subjective intention and often evaluates success in hindsight. Good for moral verdicts, bad for decision rules.
  *   **International Legal Orthodoxy (UN Charter strictures):** Fails **R1** and **R5** in veto scenarios. It prioritizes order (R2) over justice (R1), effectively ruling out Kosovo-style interventions even when necessary.
  *   **Responsibility to Protect (R2P):** Strong on **R1** and **R7**, but ambiguous on **R2**. It solved the "sovereignty as shield" problem but kicked the "who authorizes" can down the road.
  *   **Democratic Peace/Realist Hybrid:** Strong on **R5** (success) and **R8** (interest), but often fails **R1** (ignores atrocities where no interest exists, e.g., Rwanda).

  ### A Note on Consensus vs. Contested Claims

  *   **Settled:** Almost no serious theorist now argues sovereignty is absolute (post-Rwanda/R2P). Everyone agrees mass atrocities *can* justify intervention in principle. Everyone agrees post-intervention obligation exists (Iraq/Libya lessons).
  *   **Contested:** Who holds the keys (UNSC vs. Regional vs. Unilateral)? Whether regime change is ever a permissible *means* (Libya vs. Kosovo)? Whether "Right Intention" is a necessary condition or a nice-to-have.
  *   **My Position in this Spec:** I have classified "Right Intention" as **Camp-Prejudice** *only because* of your constraint (ex ante institutional rule). In a seminar discussing moral blameworthiness, it is genuine. For a decision manual, it is prejudice. Make sure your paper explicitly states this distinction so you don't get marked down for dismissing a standard JWT criterion without justification.
