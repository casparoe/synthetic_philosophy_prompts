answer: |-
  **Presentation Title:** Fluid Concepts and Frozen Votes: A Copycat Analysis of the 2006 IAU Pluto Decision

  **Seminar:** Philosophy of Science
  **Topic:** Analogical Reasoning and Conceptual Change

  ---

  ### Introduction

  In *Fluid Concepts and Creative Analogies*, Douglas Hofstadter and Melanie Mitchell argue that human concepts are not rigid containers with necessary and sufficient conditions. Instead, they are fluid structures that shift ("slip") under pressure to maintain coherence in new contexts. Their computational model, **Copycat**, demonstrates this using letter-string analogies (e.g., if $abc$ becomes $abd$, how does $ijk$ change?).

  This presentation applies the Copycat architecture to a pivotal moment in modern science: the 2006 International Astronomical Union (IAU) redefinition of "planet." By treating the solar system as a **microdomain** and the classification debate as a process of **analogical mapping**, we can test whether Hofstadter's cognitive model holds up against the institutional reality of scientific taxonomy.

  ---

  ### 1. Mapping the Microdomain

  To apply Copycat to the IAU debate, we must translate the astronomical entities into the structural roles found in Hofstadter's letter-string domain. In Copycat, the system perceives objects (letters), groups them (strings), and identifies relations (successor, predecessor, sameness).

  **The Translation Table:**

  | Copycat Domain | IAU/Pluto Microdomain | Function in the Analogy |
  | :--- | :--- | :--- |
  | **Letters** | Individual Celestial Bodies (Pluto, Eris, Ceres, Neptune) | The atomic units requiring classification. |
  | **Strings/Groups** | The Category "Planet" | The conceptual cluster holding the letters together. |
  | **Relations** | Physical/Dynamical Properties (Orbit, Mass, Clearing) | The "rules" binding the letters into the string (e.g., "successor" $\approx$ "orbits the sun"). |
  | **The Problem** | $abc \to abd$ (Old Definition $\to$ New Discovery) | The discovery of Eris forces a transformation of the rule set. |
  | **Temperature** | Scientific Consensus/Uncertainty | High temperature = active debate/ambiguity; Low temperature = fixed definition. |

  **The Structural Conflict:**
  In Copycat, if the string is $abc$ (Mercury, Venus, Earth... Pluto), the system assumes a rule based on the existing pattern. When Eris is discovered, it is analogous to adding a letter $z$ to the string that doesn't fit the alphabetical spacing. The system must decide: Do we expand the alphabet (accept Eris as a planet), or do we change the rule of what constitutes a "letter" in this string (demote Pluto)?

  ---

  ### 2. Tracing Conceptual Slippages

  Hofstadter argues that creativity and understanding rely on **slippage**: the ability to map a concept from one context to another by allowing its boundaries to slide. The IAU debate is a record of competing slippages.

  **A. The Pressure on "Planet"**
  Prior to 2005, the concept "Planet" was stable but ill-defined. It relied on a **historical/cultural mapping** (Pluto is a planet because we have always said so). The discovery of Eris applied analogical pressure.
  *   *The Slip:* If Eris is physically similar to Pluto, and Pluto = Planet, then Eris = Planet.
  *   *The Counter-Slip:* If Eris makes the category "Planet" too large (unwieldy string), then Pluto $\neq$ Planet.

  **B. "Clearing the Neighborhood" as Conceptual Slippage**
  The IAU's third criterion—that a planet must "clear its neighborhood"—is the crux of the philosophical shift.
  *   **Classical View:** Concepts are defined by *intrinsic* properties (e.g., "Is it round?").
  *   **Copycat View:** Concepts are defined by *contextual* relations.

  The "clearing the neighborhood" criterion is a massive **relational slippage**. It shifts the definition of "planet" from an intrinsic property (hydrostatic equilibrium/roundness) to a relational property (dynamical dominance relative to neighbors). In Copycat terms, this is like defining the letter 'A' not by its shape, but by whether it has space around it in the string.

  **Did this halt slippage or enact it?**
  It functioned as both.
  1.  **As a Slippage:** It changed the rule of the game from "what you are" to "where you are." This is a creative analogical leap to preserve the utility of the category.
  2.  **As a Halt:** It was designed to lower the **conceptual temperature**. By introducing a hard binary threshold (cleared vs. not cleared), the IAU attempted to stop the fluid stretching of the concept that would have otherwise included dozens of Kuiper Belt Objects.

  ---

  ### 3. Evaluation: Fluidity vs. Institutional Authority

  Does this episode support Hofstadter's claim that real-world concepts are inherently fluid? Yes, but it reveals a limitation in the Copycat model regarding social epistemology.

  **A. Support for Fluidity**
  The intense controversy following the vote confirms Hofstadter's thesis. If concepts were classically defined (necessary and sufficient conditions), the vote would have been a mere formality. Instead, the debate persisted for years (e.g., Alan Stern's "dynamically dominant" counter-argument). This shows that the scientific community was operating in a **high-temperature state**, where multiple competing structures (Planet as Cultural Icon vs. Planet as Dynamical Dominator) were active simultaneously. The concept *wanted* to remain fluid; the vote forced it to crystallize.

  **B. The Breakdown: Top-Down vs. Bottom-Up**
  Here lies the critical divergence between Copycat and the IAU.
  *   **Copycat Architecture:** Purely **bottom-up**. "Codelets" (small processes) compete in parallel. No central executive decides the answer; the answer *emerges* from the coherence of the structures.
  *   **IAU Architecture:** **Top-Down**. The resolution was not an emergent consensus of data; it was a vote by a subset of astronomers at a conference.

  **The Institutional Constraint:**
  In Copycat, "temperature" lowers naturally as the system finds a coherent solution. In the IAU case, the temperature was artificially suppressed by institutional authority. The IAU acted as a "central controller"—a component explicitly absent in Hofstadter's model. They imposed a rigid boundary to freeze the fluid concept for the sake of pedagogical and cataloging utility.

  This suggests that while scientific *reasoning* may behave like Copycat (fluid, analogical, context-dependent), scientific *taxonomy* is subject to political freezing. The Copycat model cannot account for the moment when a committee raises a hand and declares, "The slippage stops here."

  ---

  ### Conclusion

  The 2006 demotion of Pluto reveals that scientific taxonomy behaves like a Copycat microdomain **during the phase of discovery and debate**, but diverges **during the phase of resolution**.

  1.  **The Copycat Success:** The confusion surrounding Eris and Pluto confirms Hofstadter's view. The concept "planet" was not a fixed box; it was a fluid structure that slipped under the pressure of new data, shifting from intrinsic to relational definitions.
  2.  **The Copycat Failure:** The model fails to account for the **institutional freezing** of concepts. Copycat assumes truth emerges from coherence; the IAU showed that truth can be imposed by authority to manage complexity.

  **Final Verdict:**
  Pluto's demotion does not prove that scientific concepts are *naturally* rigid; it proves that **institutional decision-making can freeze fluid concepts in ways the Copycat model never anticipated.** The IAU did not solve the analogical problem; they terminated it. Therefore, while Hofstadter's architecture illuminates the *cognitive struggle* of conceptual change, it must be augmented with a sociology of science to explain how those changes are codified. The "Planet" is a fluid concept trapped in a rigid vote.
