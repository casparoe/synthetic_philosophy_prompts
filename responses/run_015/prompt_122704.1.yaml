answer: |-
  **TO:** Allocation Committee, Bracknell Trust
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Grant Cycle Allocation Recommendation

  **Recommendation**
  I recommend we commit **$4.1 million** in grants and hold a **$0.5 million reserve**. The specific allocation is:

  1.  **Proposal B (Lead Paint):** $2.2 million, contingent on executing the 1:1 match agreement within five months.
  2.  **Proposal A (Deworming):** $1.9 million, disbursed in annual tranches contingent on the continued absence of the exiting bilateral funder.
  3.  **Reserve:** $0.5 million unallocated, to be redeployed in Cycle 2 or returned to capital.
  4.  **Proposal C (CKD):** Declined.

  **Allocation Rationale**
  This portfolio balances leverage, evidence, and our spend-down mandate. Proposal B offers the highest immediate leverage available to us: a guaranteed 1:1 match on $1.5 million of our commitment. For a spend-down foundation, passing up $1.5 million in additional purchasing power is difficult to justify unless the risk of failure is near-total. While enforcement is politically risky, the match effectively halves the cost of the pilot's first $1.5 million.

  Proposal A represents our highest-confidence health impact. The evidence base is robust, and the cost-per-DALY averted is exceptional. The primary risk is displacement; however, the tranche structure mitigates this. If the exiting bilateral funder remains or another actor saturates the room, subsequent tranches can be paused.

  Regarding the reserve, the Treasurer's concern regarding the potential co-funding window is valid. However, holding $1 million (22% of this cycle's budget) conflicts with our governing instrument's requirement to commit capital within three cycles. The co-funding window is *expected*, whereas the Proposal B match is *contractual* and time-bound. A $0.5 million reserve acknowledges the uncertainty without jeopardizing our spend-down trajectory or forcing us to rush-deploy capital in Cycle 3.

  **Framework and Scorecard Weight**
  The ITN (Importance, Tractability, Neglectedness) scorecard should serve as a **heuristic input, not a binding formula**. In this cycle, the quantitative scores are insufficient to distinguish between A and B without qualitative overlay. Proposal A scores higher on Tractability; Proposal B scores higher on Neglectedness and effective Importance (due to the match).

  I recommend we **defer both proposed amendments** (Counterfactual Displacement and Fixed Taxonomy) until after this cycle's grants are executed.
  1.  **Mid-cycle rule changes introduce unfairness.** Proposals were developed and scored under the existing framework. Changing the denominator taxonomy now would retroactively alter Neglectedness scores, potentially invalidating staff review.
  2.  **Counterfactuals are already considered.** The "displacement" concern regarding Proposal A is already part of our qualitative risk assessment. Formalizing it into the scorecard requires methodological work we cannot complete before the Proposal B match deadline.

  We should commission a review of the framework for Cycle 2, specifically testing how a fixed taxonomy would have categorized these three proposals.

  **The Case for Proposal C (Steelman)**
  Colleagues advocating for Proposal C argue that we are rejecting the option most aligned with our unique value proposition. Proposal A will likely be funded by governments or large multilaterals eventually; Proposal B is a policy pilot that may not scale. Proposal C, however, addresses a condition that is currently invisible to major funders.

  The strongest argument for C is not the science, but the **human capital window**. Our Program Officer's relationships with the regional health authority and growers' associations represent years of trust that cannot be bought. If she departs in fourteen months without this grant, the access vanishes. By funding A or B, we are buying commodities (medicine or regulatory pressure) that other funders can also buy. By funding C, we are utilizing a unique, non-fungible asset that expires soon. If our goal is to do what *only* we can do, rather than what others *might* do, C is the superior choice. Passing on C may mean this specific opportunity is never funded by anyone.

  **Conclusion**
  This allocation maximizes confirmed leverage (B) and proven health outcomes (A) while maintaining a modest buffer for future opportunities. It respects our spend-down timeline better than a larger reserve and avoids the procedural risk of altering our scoring framework mid-vote. I look forward to discussing this balance with you.
