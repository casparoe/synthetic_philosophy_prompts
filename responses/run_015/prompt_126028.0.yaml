answer: |-
  Here is the **ISOTYPE Field Protocol** for visual sign validation. It adapts Neurath's core principle—that visual language must be grounded in observable physical reality rather than abstract convention—into a procedural checklist for high-stakes, low-literacy environments.

  ### The ISOTYPE Field Protocol

  **Step 1: Physical Grounding (The Pointability Test)**
  *   **Procedure:** Take the proposed icon to a sample of end-users (camp residents) who have not been taught the symbol. Place the sign next to the actual object or hazard. Ask them to point to what the sign represents.
  *   **Neurathian Principle:** *Physicalism.* The symbol must correspond to a tangible object or action that can be directly observed. There should be no "hidden metaphysics" (e.g., a symbol representing an abstract concept like "safety" rather than the physical thing itself).
  *   **Pass Criteria:** 80%+ of users can point from the symbol to the physical hazard/object without verbal prompting.
  *   **Fail Criteria:** Users point to something else, or ask "What does this mean?"

  **Step 2: Framing Residue (The Cultural Baggage Check)**
  *   **Procedure:** Investigate the visual elements of the icon for local cultural, religious, or political associations unrelated to the hazard.
  *   **Definition:** *Framing Residue* is the leftover meaning a shape or color carries from previous contexts (e.g., a specific animal considered sacred, a color associated with a opposing military faction, a gesture considered obscene).
  *   **Pass Criteria:** No strong positive or negative associations found that compete with the warning message.
  *   **Fail Criteria:** The symbol triggers avoidance, reverence, or confusion due to non-safety-related cultural meaning.

  **Step 3: Indexical Drift (The Context Stability Check)**
  *   **Procedure:** Visualize the icon in at least three different locations within the camp (e.g., near a latrine, near a food distribution point, near a tent entrance). Ask users what the sign means in each spot.
  *   **Definition:** *Indexical Drift* occurs when the meaning of the symbol shifts based on its physical placement, even if the image remains unchanged.
  *   **Pass Criteria:** The meaning remains constant regardless of placement.
  *   **Fail Criteria:** The meaning changes (e.g., a flame means "cook here" near a kitchen but "danger" near a fuel depot).

  **Step 4: The Value Call (Risk vs. Ambiguity)**
  *   **Procedure:** **STOP.** The procedure ends here. This step is not procedural; it is a human judgment call.
  *   **Instruction:** Compare the failure flags from Steps 1–3 against the severity of the hazard.
  *   **The Decision Matrix:**
      *   *Property/Low Health Risk:* If Steps 1–3 show ambiguity, **Reject** the sign. Clarity is preferred over speed.
      *   *Immediate Life/Death Risk:* If Steps 1–3 show ambiguity, but no better symbol exists, the Field Lead must decide: **Is ambiguous information better than no information?**
      *   **Output:** This step produces either a "Hard No," "Print with Conditions" (mitigate risk via verbal briefing), or "Unsettled Judgment" (proceed despite protocol failure due to extreme necessity).

  ***

  ### Field Test: Proposal Evaluations

  Here is the protocol applied to your two current sign proposals.

  #### Proposal A: Skull-over-Water-Drop (Contaminated Well)
  *   **Step 1 (Physical Grounding):** **PASS.** The water drop is a direct visual representation of the liquid. The skull is a concrete representation of death/bodies. Users can point from the sign to the well and mimic drinking/dying. It meets the physicalist requirement of observable entities.
  *   **Step 2 (Framing Residue):** **FLAGGED.** In some regions, skulls are associated with ancestral veneration rather than danger. In others, they are associated with piracy or specific enemy groups. This introduces noise into the signal.
  *   **Step 3 (Indexical Drift):** **PASS.** Placed near a water source, the meaning remains stable. It does not change meaning if moved ten meters left or right, provided it remains near water infrastructure.
  *   **Step 4 (Value Call):** **Print with Conditions.**
      *   *Reasoning:* The physical grounding is strong enough to overcome moderate residue. The risk (death by poisoning) outweighs the risk of cultural misunderstanding.
      *   *Condition:* Field teams must conduct a 5-minute verbal orientation with community leaders before posting to "prime" the symbol's meaning, neutralizing the Framing Residue.

  #### Proposal B: Flame Symbol (Fire Exit)
  *   **Step 1 (Physical Grounding):** **FAIL.** A flame physically represents fire (the hazard), not the exit (the solution). Neurath's protocol requires the image to match the physical reality of the destination. A user pointing at the sign will point to a fire, not a door. This is a semantic inversion.
  *   **Step 2 (Framing Residue):** **PASS.** Fire is universally understood as hot/dangerous. No conflicting cultural baggage here.
  *   **Step 3 (Indexical Drift):** **CRITICAL FAIL.** High drift detected. Near a stove, this symbol means "Cooking." Near a fuel store, it means "Explosive." Near a door, users are likely to interpret it as "Fire Hazard Inside" rather than "Way Out from Fire." The context corrupts the reference.
  *   **Step 4 (Value Call):** **Unsettled Judgment Call.**
      *   *Reasoning:* The procedure identifies a fundamental breakdown in physical grounding and indexical stability. Procedurally, this sign should be rejected. However, in a disaster zone, if no "Running Man" or "Open Door" icons are available, the Field Lead faces a dilemma.
      *   *The Unsettled Call:* The protocol cannot resolve this. It flags the sign as dangerous, but if the alternative is *no sign at all* during a night fire, the human operator must decide if a misleading sign is worse than silence. The procedure advises **Hard No**, but the extreme risk environment forces an **Unsettled Judgment** where the Lead assumes liability for overriding the physicalist failure.

  ***

  **Summary for Field Team:**
  Use the Skull/Water sign, but brief the locals first. Do not use the Flame/Exit sign unless you are out of all other options and willing to accept that the sign may actively mislead users during a panic. The protocol clears the first; it condemns the second, leaving the final decision on your conscience.
