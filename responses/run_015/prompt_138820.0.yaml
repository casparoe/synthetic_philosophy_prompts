  I'm retired — did experimental physical chemistry, a lot of it instrument building and calibration, the bane of my life — and since last year I've been going to a philosophy readin group at the local library. We just did the bootstrapping problem and the easy-knowledge stuff, and the mood in the room was that reasoning from a source's own deliverances to the claim that the source is reliable can never give you anything you didn't already have. That can't be right, or at least it isn't right without qualification: calibration in an actual lab does something like this all the time.

  So build me a case in which a source's reliability is established from that source's own outputs — no independent check, no outside authority, no second instrument assumed to be good — and where the reasoning is clearly in good shape rather than a case of easy knowledge. Constraints: it has to be something that could really happen in a lab or a field measurement; one paragraph; and you can't smuggle in a prior argument for reliability from background theory or from the source having behaved well in the past.

  My hunch is that the variable that matters is the difference between the scatter of repeated readings and a fixed offset — that you can learn about one of those from the readings themselves and not the other — but i don't know if that's the right way to put it, so if it is, state it properly, and if the feature that's actually doing the work is something else, use that instead.

  What I need after the scenario: why the anti-bootstrapping diagnosis doesn't fire here, which single feature of the case is doing the work, what the case turns into if you remove that feature (I expect it to collapse back into an ordinary bootstrapping case, and I want to see exactly where), and how someone defending the standard line would attack it. If it turns out that no such case can be built without the reliability claim secretly following from something the subject already knows, say that instead and tell me which premise gives it away. It's for a ten-minute intervention in the group, and half of them will accuse me of cheating if it's stipulation dressed up as a case.
