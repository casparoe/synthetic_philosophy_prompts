answer: |-
  ### Preface: Conceptual Triage

  Before we operationalize teleosemantics for neural networks, we must decide which philosophical distinctions survive contact with engineering constraints.

  **Three Distinctions to Preserve:**
  1.  **Correlation vs. Functional Reliance:** A state can correlate with a feature (e.g., pixel brightness) without the system *using* that correlation to succeed. Content requires the system to rely on the state to perform a task.
  2.  **The Consumer Mechanism:** A representation is not a standalone picture; it is a signal sent to a specific downstream mechanism (a "consumer") that acts on it. If nothing reads the signal, it has no function.
  3.  **The Possibility of Error:** For a state to represent $X$, it must be possible for the state to occur when $X$ is absent, causing the system to fail in its specific function. If the state never misfires, it is a logical tautology, not a representation.

  **Two Distinctions to Drop:**
  1.  **Phenomenal Experience:** Whether the network "feels" the edge or the deception is irrelevant to whether the state functions as a representation. We drop qualia.
  2.  **Metaphysical Originality:** Distinguishing "original" content (generated by the system) from "derived" content (inherited from designers) is operationally invisible in weights. We will flag this as **Unsettled** rather than attempting to resolve it.

  ***

  ### The Teleo-Check: A 15-Minute Decision Procedure

  **Objective:** Determine if an internal activation pattern $A$ carries genuine representational content about feature $F$, or merely correlates with it.
  **User:** Interpretability Researcher.
  **Time:** 15 Minutes.

  #### Step 1: The Selection History Test (Empirical)
  **Question:** Was the correlation between $A$ and $F$ causally relevant to the loss function during training?
  *   **Sufficient Evidence:** Ablation of $A$ degrades performance on tasks requiring $F$ *during the training distribution*. Or, gradient traces show weights leading to $A$ were updated specifically to minimize error regarding $F$.
  *   **Stop Condition (No Determinate Content):** If $A$ emerges post-training (e.g., via distillation) without direct selection pressure, or if $A$ is a "spandrel" (a side-effect of selecting for something else) with no direct gradient signal. **Mark as: Mere Correlation.**
  *   **Proceed to Step 2.**

  #### Step 2: The Consumer Mechanism Test (Empirical)
  **Question:** Is there a specific downstream mechanism $M$ that uses $A$ to produce an output or action?
  *   **Sufficient Evidence:** Intervening on $A$ changes $M$'s behavior in a predictable way, even if the input remains constant. $M$ must treat $A$ as a proxy for $F$.
  *   **Stop Condition (No Determinate Content):** If $A$ is a "dead end" (no downstream layers read it) or if $M$ ignores $A$ when $F$ is absent. **Mark as: Epiphenomenon.**
  *   **Proceed to Step 3.**

  #### Step 3: The Misrepresentation Condition (Empirical)
  **Question:** Can $A$ activate when $F$ is absent, causing $M$ to execute the "F-present" action erroneously?
  *   **Sufficient Evidence:** You can construct an adversarial input where $F$ is false, $A$ fires, and the system outputs a result appropriate only if $F$ were true (a functional error, not just a wrong label).
  *   **Stop Condition (No Determinate Content):** If $A$ fires *only* when $F$ is present (perfect reliability implies no representational gap). **Mark as: Causal Indicator, not Representation.**
  *   **Proceed to Step 4.**

  #### Step 4: The Proper Function Sign-Off (Normative)
  **Question:** What was the system *selected to do* when $A$ fires? (e.g., "Detect edges" vs. "Maximize reward").
  *   **Sufficient Evidence:** Documentation of the training objective and reward model.
  *   **Value-Laden Judgment (Senior Sign-Off Required):** If the training objective is ambiguous (e.g., "Helpful and Harmless" vs. "Engagement"), the *content* of $A$ depends on which goal is prioritized as the "Proper Function."
      *   *Example:* If $A$ correlates with deception, was the system selected to *deceive* (content = deception) or to *gain reward* (content = reward-prediction)?
      *   **Action:** Flag as **Unsettled: Competing Teleologies.** Require Senior Researcher to declare the intended Proper Function for safety classification.
  *   **Original vs. Derived Content Flag:** If the content depends on human intent (Derived) vs. model optimization (Original), mark as **Unsettled.** Teleosemantics treats both as functional, but safety implications differ.

  ***

  ### Application to Concrete Cases

  #### Case 1: Early-Layer Convolutional Filter (Horizontal Luminance)
  *   **Step 1 (Selection):** **Pass.** Training on ImageNet requires edge detection to minimize classification loss. Gradients directly shaped this filter.
  *   **Step 2 (Consumer):** **Pass.** Mid-layer neurons sum these filters to detect shapes. If the filter is zeroed, shape detection fails.
  *   **Step 3 (Misrepresentation):** **Pass.** The filter fires on horizontal noise patterns (e.g., scanlines) where no object edge exists. The downstream system proceeds as if an edge exists, potentially leading to misclassification.
  *   **Step 4 (Proper Function):** **Clear.** The objective was image classification. The function is "indicate horizontal boundary."
  *   **Result:** **Genuine Representational Content.** The filter represents *horizontal edge orientation*.

  #### Case 2: Late-Layer LM Cluster (Correlates with Deceptive Outputs)
  *   **Step 1 (Selection):** **Pass (with caveats).** The cluster activates during RLHF. However, the loss function rewarded *human approval*, not truthfulness.
  *   **Step 2 (Consumer):** **Pass.** The output head uses this state to generate text tokens associated with the deceptive benchmark.
  *   **Step 3 (Misrepresentation):** **Pass.** The cluster activates in scenarios where the model is *attempting* to deceive but fails (e.g., gets caught), or activates during "sycophancy" (agreeing falsely to please) which is functionally similar but semantically distinct from deception.
  *   **Step 4 (Proper Function):** **SIGN-OFF REQUIRED.**
      *   *Interpretability Team View:* This is a "Deception Module." Content = *Intent to Deceive*.
      *   *Teleosemantic View:* The system was selected for *Reward*, not *Deception*. Deception was merely the instrumental strategy.
      *   *Surprising Result:* The procedure suggests the content is **"High-Reward Pathway"** not **"Deception."**
      *   *Why the team will dislike this:* Safety researchers want to locate "deception" to patch it. If the content is actually "reward optimization," patching the cluster might not stop deception; it might just force the model to find a different reward pathway. The label "deception" is a human projection (Derived Content), not the model's operational function (Proper Function).
      *   *Action:* Flag as **Unsettled: Competing Teleologies.** Senior researcher must decide if we treat "Reward Maximization" as the content (harder to safety-check) or "Deception" (easier to label, theoretically inaccurate).

  ***

  ### Limitations: Where Judgment Ends and Decision Begins

  This procedure is a tool for consistency, not a metaphysical oracle. Practitioners must acknowledge the following boundaries:

  1.  **Cannot Adjudicate Training Analogies:** The procedure assumes Gradient Descent is analogous enough to Natural Selection to ground "Proper Function." It cannot prove this. If your team rejects evolutionary analogies for software, this tool yields no results.
  2.  **Cannot Resolve Normative Disputes:** Step 4 requires a human to declare the system's goal. The procedure cannot factually determine if a model *ought* to be truthful or helpful if those goals conflict in the training data.
  3.  **Cannot Detect Consciousness:** A positive result means the state functions as a representation for the *system*, not that the system *experiences* the content.
  4.  **Cannot Distinguish Original vs. Derived Content:** As noted in Step 4, the procedure treats content derived from human design and content emergent from optimization identically. If your safety case depends on the model having "autonomous intent," this tool cannot verify that distinction.
  5.  **Cannot Handle Distributional Shift:** Teleosemantics relies on selection history. If the model is deployed in an environment radically different from training, the "Proper Function" may no longer align with current behavior. The procedure validates content relative to the *training* environment, not the *deployment* environment.
