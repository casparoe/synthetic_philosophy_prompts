answer: |-
  Based on the pattern of verdicts you've described, here is an analysis of your friend's logic, a prediction for crabs, and a strategy to figure out exactly what rule she's using.

  ### 1. The Prediction: What will she say about crabs?

  **She will almost certainly say "No" or "Unsure/Leaning No."**

  Here is why: Her verdict on **lobsters** is the strongest clue. Lobsters and crabs are both decapod crustaceans; they look similar, move similarly, and are treated similarly in food culture. Since she is already leaning toward "no" for lobsters (despite the ongoing scientific debate about crustacean pain), she will logically place crabs in the same bucket as lobsters and shrimp.

  Unless she has seen a specific, recent documentary focusing on crab intelligence (which is much rarer than octopus documentaries), the crab will fall into her "biological machine" category alongside the shrimp and lobster.

  ### 2. The Three Candidate Rules

  To understand *why* she believes this, we have to look for the hidden principle connecting her "Yes" and "No" lists. Here are the three rules that best fit her current data points:

  #### Rule A: The "Vertebrate + Cephalopod" Exception
  *   **The Logic:** Vertebrates (animals with backbones) generally have the hardware for suffering. Invertebrates generally do not, *except* for Cephalopods (octopuses, squid), which are the evolutionary exception known for high intelligence and complex nervous systems.
  *   **Fits the Data:**
      *   *Yes:* Cows, Chickens, Salmon (Vertebrates). Octopus (Cephalopod).
      *   *No:* Shrimp, Bees, Jellyfish, Oysters, Lobsters (Non-Cephalopod Invertebrates).
  *   **Implication for Crabs:** **No.** Crabs are crustaceans, not cephalopods. They don't get the exception.

  #### Rule B: The "Pop-Science Charisma" Heuristic
  *   **The Logic:** She believes animals suffer if they are frequently portrayed as "individuals" or "characters" in popular media. This is less about biology and more about which animals have PR teams (so to speak).
  *   **Fits the Data:**
      *   *Yes:* Cows/Chickens (Farm welfare is a huge news topic). Salmon (Wildlife docs). Octopus (*My Octopus Teacher* and similar docs made them famous for consciousness).
      *   *No:* Bees (Often portrayed as a "hive mind" or robots). Shrimp/Oysters (Seen purely as food). Jellyfish (Seen as alien blobs). Lobsters (Sometimes discussed, hence her uncertainty, but less "charismatic" than octopuses).
  *   **Implication for Crabs:** **No.** While crabs appear in nature docs, they are rarely the *star* of a consciousness narrative in the way octopuses are.

  #### Rule C: The "Centralized Brain" Threshold
  *   **The Logic:** She believes suffering requires a specific type of centralized brain structure. She likely intuitively understands that vertebrates and octopuses have large, centralized brains, while insects and shellfish operate more on ganglia (clusters of nerves) or nerve nets.
  *   **Fits the Data:**
      *   *Yes:* Vertebrates and Octopuses have the largest/most complex invertebrate brains.
      *   *No:* Bees (Tiny brains), Jellyfish (Nerve nets), Oysters/Shrimp/Lobsters (Ganglia-based).
      *   *Note:* This explains why she discounts bees despite their problem-solving; she likely views their hardware as too small for "feeling."
  *   **Implication for Crabs:** **No.** Crab nervous systems are very similar to lobster nervous systems. If lobsters don't meet the threshold, neither do crabs.

  ### 3. Which rule is she actually running?

  The most likely candidate is **Rule A (The Vertebrate + Cephalopod Exception)**, heavily influenced by **Rule B (Media)**.

  Here's why: If it were purely about intelligence (Rule C), she would have to account for bees, which she explicitly rejects. If it were purely about media (Rule B), she might be more unsure about cows or chickens depending on her diet/social circle.

  The specific inclusion of the **Octopus** alongside vertebrates is the tell. In pop-science circles, the "Octopus Exception" is a very common talking point. It's the standard answer to "Are any invertebrates conscious?" The fact that she is *unsure* about lobsters suggests she knows there is *some* debate there, but the Octopus verdict is locked in. This points to a biological classification rule she picked up from a documentary or article: *"Vertebrates feel pain, and so do Octopuses, but not bugs or shellfish."*

  ### 4. The Tie-Breaker Question

  To confirm which rule she is using, you need an animal that splits the difference between these hypotheses. You want an animal that is **not a vertebrate**, but **is a cephalopod**, or an animal that is **highly intelligent** but **not an octopus**.

  **Ask her about: Cuttlefish (or Squid).**

  *   **Why:** Cuttlefish are Cephalopods, just like octopuses. They have similar nervous systems and intelligence.
  *   **If she says "Yes, they suffer":** She is using **Rule A (Biological Classification)**. She recognizes the Cephalopod group as the exception to the invertebrate rule.
  *   **If she says "No" or "I don't know":** She is using **Rule B (Media Charisma)**. She has heard of the Octopus specifically (likely due to *My Octopus Teacher*), but doesn't associate that consciousness with the rest of the Cephalopod family.

  **Alternative Tie-Breaker: Jumping Spiders.**
  *   **Why:** There has been a recent wave of pop-science articles about jumping spider intelligence and "playful" behavior.
  *   **If she says "Yes":** She is updating her views based on **Recent Headlines** (Rule B).
  *   **If she says "No":** She is sticking to the **Vertebrate/Cephalopod** divide (Rule A), grouping spiders with bees as "bugs."

  **Recommendation:** Start with **Cuttlefish**. It's the cleanest test of whether her "Octopus" verdict is about biology or just about that one specific animal's fame. If she doesn't know what a cuttlefish is, ask about **Squid**.
