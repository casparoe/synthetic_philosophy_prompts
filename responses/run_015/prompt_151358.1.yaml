  **Note**
  It is well established that agents systematically overstate their prior predictability (hindsight bias) and that narrative accounts compress contingency. It is contested whether this overstatement is a cognitive bias or reasonable Bayesian updating on information the earlier writer lacked, and whether narrative shape in history is an epistemic failure or constitutive of the account. The poem leans on the contested reading in the third tercet ("moisture lay on the wool and clay"), implying the outcome was physically inferable, thus blurring the line between distortion and rational updating.
