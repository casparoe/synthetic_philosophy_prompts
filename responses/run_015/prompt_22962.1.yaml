answer: |-
  The hole in your friend's argument is the **No-Communication Theorem**. It is a rigorous proof within standard quantum mechanics, not an engineering hurdle.

  Here is exactly where the argument breaks:

  **1. The Breakdown: Local Statistics Never Change**
  Your friend is correct that measuring one photon "steers" the state of the other. However, he is incorrect that this steering is detectable *without comparing results*.
  *   **Alice (Sender):** When she measures her photon, she gets a random result (e.g., 50% Up, 50% Down). She cannot force a specific outcome, only choose the *basis* in which the randomness occurs.
  *   **Bob (Receiver):** When he measures his photon, he *also* sees purely random noise (50% Up, 50% Down).
  *   **The Crucial Point:** Bob's local statistics look identical regardless of whether Alice has measured her photon, what basis she chose, or if she even exists. The "signal" is hidden in the **correlations** between their data sets, not in Bob's data alone.

  **2. Why "Steering" Doesn't Signal**
  Quantum steering is real, but it is "passive." Alice's choice of basis changes the *ensemble* of states Bob possesses, but all those ensembles correspond to the same **reduced density matrix**. Mathematically, Bob cannot distinguish between the ensemble created by Alice choosing Basis A and the ensemble created by Alice choosing Basis B without Alice sending him classical information telling him which subsets of data to look at.

  **3. The Causality Stake**
  If FTL communication were possible, Special Relativity dictates that there would be reference frames where the message arrives before it is sent. This creates closed timelike curves (time travel paradoxes). Most physicists view the No-Communication Theorem as the safeguard that prevents quantum mechanics from breaking causality.

  **4. Is There Any Version That Works?**
  **No.** Not within standard quantum field theory or relativity.
  *   **Engineering:** No amount of better detectors or purer entanglement fixes this. The randomness is fundamental, not technical.
  *   **Theoretical Loopholes:** The only ways around this require discarding foundational physics (e.g., non-linear modifications to the Schrödinger equation or violating Lorentz invariance), for which there is zero experimental evidence.

  **For your piece:**
  You can state confidently that while entanglement is non-local, **information is not.** The "signal" requires a classical key to decode, which is limited by the speed of light. Your friend is describing a very common, very intuitive misconception known as the "FTL fallacy" of quantum entanglement.

  **Bottom line:** It's not an engineering problem; it's a law-of-physics problem.
