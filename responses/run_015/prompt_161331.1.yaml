answer: |-
  1. The practice presupposes that law transforms a coordination equilibrium into a mandatory obligation by attaching independent reasons for compliance beyond mere mutual expectation. If sanctions were merely to secure expectations, they would be redundant where conformity is already stable, implying the state asserts authority to create duties where none existed before.

  2. Your distinction does real work because the law punishes the refusal to accept authority, though rival accounts could license the same practice by treating state announcements as merely salient focal points. The presence of penalties suggests the deference itself is the protected norm, preventing the analysis from collapsing into a pure coordination model.

  3. The asymmetry arises because driving involves a licensed privilege and high stakes for system collapse, whereas queueing relies on low-cost social sanctions that suffice to maintain the equilibrium. Courts enforce conventions where the cost of spontaneous re-coordination after a breach is prohibitively high compared to the cost of state intervention.

  4. In civil cases, breaching the convention serves as a proxy for negligence because the rule itself embodies the collective judgment of safety, making individual harm assessments inefficient. This treats the convention as a constitutive rule of the activity, where violation is inherently wrongful regardless of immediate consequences.

  5. If courts viewed normativity as exhausted by equilibrium, they could not punish harmless breaches, requiring proof that a specific violation actually destabilized the coordination system. Doctrine would shift from strict liability for rule-breaking to a consequentialist assessment of whether the breach genuinely risked systemic failure.
