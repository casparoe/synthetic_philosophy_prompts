answer: |-
  ### The Case

  Arthur, 78, has late-stage Alzheimer's. He recognises no faces, understands no sentences, and retains no memory for more than minutes. He is calm but vacant. His daughter Clare holds his power of attorney. Arthur once cherished his father's gold pocket watch. Now, wearing it soothes him visually, but he frequently tries to eat it, risking choking. The consideration C is: 'Arthur should wear the watch because it honours his lifelong identity as a watchmaker.' Arthur cannot comprehend 'watchmaker', 'identity', or 'honour'. He cannot be persuaded. Clare must decide: safe plastic dummy or the real gold watch. There are no other relatives. Arthur will never regain capacity.

  ### The Three Verdicts

  **1. Stance-Independent Externalism**
  The fact that wearing the watch honours Arthur's identity is an objective normative fact. It constitutes a genuine, weighty reason *for Arthur* to wear the watch. His incapacity to grasp this fact is irrelevant to its existence or weight. The reason belongs to him, even if he cannot access it.

  **2. Williams-Style Internalism**
  Arthur lacks a subjective motivational set (SMS) accessible via sound deliberation; thus, there is no reason *for Arthur*. However, there is a reason *for Clare*. The deliberative route from her SMS is:
  *   *Premise 1:* Clare loves Arthur and desires to honour his past dignity.
  *   *Premise 2:* Clare believes facilitating the watch-wearing honours that dignity.
  *   *Conclusion:* Clare has a reason to manage the risk and let him wear it.
  The reason is hers, generated by her motives, not his.

  **3. The Uptake Condition**
  A reason requires the capacity to be addressed by it. Arthur permanently lacks this capacity. Therefore, there is no reason *for Arthur* at all. There remains only an evaluative fact ('It would be good if...') which floats free of any reason-bearer.

  ### The Dial: Surrogate Cost

  We vary the cost to Clare of managing the choking risk.

  *   **Setting A (Low Cost):** Clare can supervise him easily.
      *   *Externalist:* Arthur's reason remains weighty.
      *   *Internalist:* Clare's reason is strong (minimal conflict with her SMS).
      *   *Uptake:* Still no reason for Arthur.
  *   **Setting B (High Cost):** Clare must quit her job to supervise him safely.
      *   *Externalist:* Arthur's reason remains weighty (objective facts do not diminish because Clare is busy).
      *   *Internalist:* Clare's reason is outweighed. Deliberation from *her* SMS now includes her own career needs; the route to action is blocked.
      *   *Uptake:* Still no reason for Arthur.

  **Analysis:** The Externalist and Internalist verdicts come apart. The Externalist demands action for Arthur's sake regardless of Clare's sacrifice; the Internalist limits the demand based on Clare's motivational economy.

  ### Restoring Addressability

  Suppose Arthur regains capacity for one hour (the "lucid interval").

  *   **Externalist:** Unchanged. The reason existed before and persists.
  *   **Internalist:** Collapses into standard internalism. Arthur's SMS is now accessible. He can deliberate on his past values. The reason becomes *his*.
  *   **Uptake:** Collapses into standard internalism. The capacity condition is met. The reason becomes *his*.

  **Result:** The three-way split dissolves into the ordinary two-sided dispute (Externalist vs. Internalist/Uptake). The unique metaphysical gap closes once addressability is restored.

  ### Audit

  **Utility:** This case isolates whether we can act *for* a person (requiring a reason they hold) versus acting *for their sake* (requiring only an evaluative fact or a surrogate's reason). It tests whether "wronging" B is possible when B cannot hold reasons.

  **Potential Attack:** A sophisticated Internalist might argue that Clare's SMS *constitutes* a proxy SMS for Arthur, thereby preserving the claim that it is Arthur's reason without requiring his capacity. This would blur the distinction between the Internalist and Externalist verdicts.

  **Substantive or Verbal?** My supervisor suspects a verbal dispute. However, the **Dial** suggests otherwise. When the cost to Clare is high, the Externalist prescribes action (Arthur's reason outweighs Clare's cost) while the Internalist permits inaction (Clare's reason is outweighed). Since the views recommend different actions based on where the normative pressure is located, the disagreement is substantive, not merely terminological. The word 'reason' is picking out different locations of normative demand.
