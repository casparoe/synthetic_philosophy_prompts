prompt: |-
  After a long argument with a friend, I am trying to defend a version of al-Ghazālī's occasionalism against the objection that it cannot explain the reliability of ordinary causal sequences. My friend grants that God could directly cause burning whenever fire touches cotton, but insists that on the occasionalist picture the regularity is either brute or merely projected by us, so the view collapses into Humean constant conjunction plus an idle divine appendix. Please argue for the position that the occasionalist can instead treat God's customary order as a stable, content-specified policy for producing effects in the presence of their ordinary accompanying conditions, without attributing any irreducible causal power to the fire or cotton and without reducing the policy to a mere summary of observed constant conjunctions; the argument should explain how the policy's normative and teleological structure can do explanatory work that brute regularity cannot, and should address why this response is not simply a relabeling of the friend's objection.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with a friend about al-Ghazālī's occasionalism.
      *   **The Objection:** The friend claims occasionalism makes causal regularity either "brute" (just happens) or "projected" (Humean constant conjunction), rendering God an "idle divine appendix."
      *   **The Goal:** Defend occasionalism by arguing that God's "Custom" (*'ādah*) is a stable, content-specified *policy*, not just a summary of events.
      *   **Key Constraints:**
          *   Do not attribute irreducible causal power to created things (fire/cotton).
          *   Do not reduce the policy to a mere summary of observed conjunctions (avoid Humeanism).
          *   Explain how the policy's *normative* and *teleological* structure does explanatory work.
          *   Address why this isn't just relabeling the friend's objection.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Occasionalism (Ghazālian):** Only God has causal power. Created things are "occasions" for God's action. Fire doesn't burn cotton; God burns cotton *when* fire touches cotton.
      *   **The Friend's Objection (Humean/Necessitarian Hybrid):** If fire has no power, why does burning *always* follow? If it's just God choosing every time, it looks arbitrary (brute). If it's predictable, it looks like natural law (which implies power in nature). If God just follows a pattern He made, isn't that pattern just a description of what happens (Humean regularity)?
      *   **The Defense Strategy:** Focus on God's *Will* and *Wisdom*. God's action is not arbitrary (voluntarism without reason) nor necessitated (determinism). It is *habitual* based on *wisdom*. This introduces *normativity* (God *ought* to act consistently with His wisdom) and *teleology* (God acts for purposes).

  3.  **Drafting the Core Argument (Step-by-Step):**

      *   *Step 1: Distinguish "Brute Regularity" from "Divine Custom".*
          *   Humean regularity is descriptive: "A happens, then B happens." No "why."
          *   Ghazālian Custom is prescriptive/volitional: "God wills B when A occurs because it serves Wisdom W."
          *   *Key distinction:* The ground of the regularity. For Hume, it's just the events. For Ghazālī, it's the Agent's character/policy.

      *   *Step 2: Introduce Normativity and Teleology.*
          *   God is not capricious. He is Wise (*Hakīm*).
          *   Therefore, His actions follow a rational order.
          *   This order is *normative* for creation: It creates a stable environment for moral and intellectual life.
          *   It is *teleological*: The regularity exists *for the sake of* human knowledge, prophecy, and moral responsibility.

      *   *Step 3: Address the "Idle Appendix" Charge.*
          *   If the policy is just a summary, God is idle.
          *   But if the policy is the *ontological ground* of the regularity, God is active. The regularity depends on His continuous sustenance of the policy, not just a past decree.
          *   The "policy" is an active disposition of the Divine Will, not a passive record.

      *   *Step 4: Address the "Relabeling" Objection.*
          *   Why isn't "Policy" just a fancy word for "Constant Conjunction"?
          *   Because a policy implies *counterfactual stability* grounded in *reason*, not just *past frequency*.
          *   Hume: "It happened, so it will." (Inductive risk).
          *   Ghazālī: "God is Wise and Consistent, so He *will not* break the habit without reason (miracle)." (Metaphysical guarantee).
          *   This explains *why* we can trust the future, which Hume cannot.

  4.  **Refining the Ghazālian Terminology:**
      *   Need to use terms like *'ādah* (custom/habit), *irādah* (will), *hikmah* (wisdom).
      *   Reference the *Incoherence of the Philosophers* (*Tahāfut al-Falāsifah*), specifically the discussion on causality.
      *   Emphasize that the "connection" (*ittiṣāl*) is not necessary (*ḍarūrah*) but customary (*'ādah*).

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the friend's sophisticated objection (it's a classic one). State the thesis: Divine Custom is a normative policy grounded in Wisdom, not a brute fact.
      *   **Point 1: The Ontological Ground (Agent vs. Event).** Contrast Humean event-event relation with Ghazālian Agent-event relation.
      *   **Point 2: Normativity and Teleology.** Explain how God's Wisdom imposes a "ought" on His actions (self-imposed consistency for the sake of creation).
      *   **Point 3: Counterfactual Stability.** Explain how this solves the problem of induction better than Hume.
      *   **Point 4: Addressing the "Relabeling" Charge.** Explicitly differentiate "Policy" from "Summary."
      *   **Conclusion:** Summarize how this saves occasionalism from being "Hume + God."

  6.  **Self-Correction/Critique during Drafting:**
      *   *Critique:* Isn't saying God "ought" to act consistently compromising His omnipotence?
      *   *Fix:* Clarify that it's not external compulsion. It's internal consistency with His own attributes (Wisdom/Truthfulness). He *can* break it (miracle), but He *won't* without reason. This preserves omnipotence while explaining regularity.
      *   *Critique:* Is this really Ghazālī or later Ash'arite development?
      *   *Fix:* Stick to Ghazālī's specific formulation in the *Tahāfut*. He emphasizes the "habit of God" (*'ādah Allāh*).
      *   *Critique:* Make sure not to sneak natural powers back in.
      *   *Fix:* Reiterate that fire remains passive. The "condition" (*sharṭ*) is not a cause (*'illah*).

  7.  **Final Polish:** Ensure the tone is persuasive, philosophical, and respectful of the friend's intelligence (since it's for a debate/defense). Use clear headings. (Proceed to generate output based on this structure.)

  8.  *(Final check against constraints)*:
