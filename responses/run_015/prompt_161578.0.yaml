answer: |-
  This is a sophisticated objection that strikes at the heart of the *Tahāfut al-Falāsifah* (The Incoherence of the Philosophers). Your friend is essentially arguing that if you remove necessary connection from nature, you are left with Hume's problem of induction, and adding "God" as the cause merely adds a metaphysical placeholder without explanatory gain. If God's action is free, why is it predictable? If it is predictable, isn't it just natural law by another name?

  To defend al-Ghazālī, you must argue that **Divine Custom (*'ādah Allāh*)** is not a *description* of events (Humean regularity) nor a *brute fact* (arbitrary voluntarism), but rather a **normative policy grounded in Divine Wisdom (*hikmah*)**.

  Here is an argument structure you can use to defend this position, distinguishing Ghazālian occasionalism from "Humeanism plus God."

  ---

  ### 1. The Ontological Ground: Agent-Policy vs. Event-Sequence
  Your friend's objection assumes that the only alternative to "natural necessity" (fire *must* burn) is "accidental regularity" (fire burns, then cotton burns, repeatedly). This is a false dichotomy. Ghazālī offers a third option: **Volitional Consistency.**

  *   **Humean View:** The regularity is grounded in the *events themselves*. We observe A followed by B enough times to expect it again. The "law" is a summary of the past.
  *   **Ghazālian View:** The regularity is grounded in the *character of the Agent*. The connection is not between fire and cotton, but between the **occasion** (fire touching cotton) and the **Divine Will**.

  **The Argument:**
  The reliability of causal sequences is not explained by the fire's power (which is nonexistent) nor by a brute statistical fact. It is explained by the **stability of the Divine Will's policy.** When we say "Fire burns cotton," we are abbreviating the proposition: "God has willed to create burning in the cotton upon the occasion of contact with fire, in accordance with a prior, stable decree."

  This is not an "idle appendix" because the regularity *ontologically depends* on God's continuous adherence to this policy. If God withdrew His will for an instant, the sequence would cease. The regularity is actively sustained, not passively recorded.

  ### 2. Normativity and Teleology: Why the Policy Holds
  The crux of your friend's objection is that a "policy" sounds like just a fancy word for "what usually happens." To refute this, you must show that the policy has **normative force** and **teleological purpose** that brute regularity lacks.

  **A. Teleology (The "For the Sake Of")**
  For Ghazālī, God is *Hakīm* (Wise). He does not act without purpose. The purpose of maintaining a consistent customary order is to make the world intelligible and livable for human beings.
  *   **Explanatory Work:** Brute regularity cannot explain *why* the universe is intelligible. It just says "it is." Ghazālī's view explains *why* we can trust our senses: because God intends for us to acquire knowledge (*'ilm*) and navigate the world to fulfill our moral obligations (*taklīf*).
  *   **Defense:** The regularity exists *for the sake of* human epistemic stability. This gives the regularity a *telos* that Humean constant conjunction lacks.

  **B. Normativity (The "Ought")**
  This is the strongest point against the "brute fact" objection. In Ghazālī's framework, God is not capricious. While He *can* break the habit (a miracle), He *ought not* to do so without a overriding wisdom (e.g., validating a prophet).
  *   **The Distinction:** A Humean summary says, "B followed A 1,000 times, so it probably will again." It admits the possibility of failure is purely statistical.
  *   **The Ghazālian Claim:** "God is Truthful (*Sādiq*) and Wise. Therefore, He will not deceive us by breaking His custom without a revelatory reason."
  *   **Explanatory Work:** This provides a **metaphysical guarantee** of induction that Humeanism cannot. We trust the future not because of the past, but because of God's attribute of Truthfulness. The "policy" is normative because it flows from God's nature; it is a self-imposed commitment to consistency for the benefit of creation.

  ### 3. Addressing the "Relabeling" Objection
  Your friend will likely say: *"You're just calling the pattern 'God's Policy' instead of 'Law of Nature.' It's the same thing. You've just added a middleman."*

  Here is how you distinguish the two:

  **1. Counterfactual Stability:**
  *   **Humean/Law:** If we ask, "Why did the cotton burn?" the answer is "Because it is a law that fire burns cotton." If we ask, "Why is that a law?" the answer is "Because that's what happens." It is circular.
  *   **Ghazālian Policy:** If we ask, "Why did the cotton burn?" the answer is "Because God willed it." If we ask, "Why does He will it every time?" the answer is "Because He has ordained a system of wisdom where contact is the *occasion* (*sabab*) for burning."
  *   **The Difference:** In the Ghazālian view, the "policy" explains the **counterfactuals**. If God wanted to change the policy (e.g., fire cools cotton), He could. The fact that He *doesn't* is an active choice sustained by wisdom. In the Humean view, there is no "choice," only fact. The Ghazālian policy explains *why the regularity holds* (Divine Wisdom); the Humean regularity only notes *that it holds*.

  **2. The Status of the "Occasion" (*Sharṭ* vs. *'Illah*):**
  *   Your friend fears you are smuggling causal power back into the fire. You must clarify the status of the fire.
  *   In Ghazālī's view, fire is a **condition** (*sharṭ*), not a cause (*'illah*).
  *   **Analogy:** Consider a judge sentencing a criminal. The criminal's guilt is the *occasion* for the sentence. The guilt does not *force* the judge to sentence; the judge's law and will do that. But the judge does not sentence randomly; he sentences *when* guilt is present.
  *   **Application:** Fire is like the guilt. It is the specified condition under which God has policy-bound Himself to create burning. This preserves the fire's passivity (it has no power) while explaining the specificity of the sequence (burning happens *here*, with *fire*, not with water). The "content-specificity" of the policy handles the reliability without granting power to the creature.

  ### 4. Synthesis: The Argument for Your Friend
  Here is how you can summarize this in your debate:

  > "You argue that occasionalism reduces to Humean constant conjunction with an extra step. I argue that Humean conjunction is *descriptive*, while Divine Custom is *prescriptive*.
  >
  > If regularity is brute (Hume), we have no reason to trust the future other than psychological habit. If regularity is a Divine Policy grounded in Wisdom, we have a metaphysical reason to trust the future: God's attribute of Truthfulness and His teleological intent to make the world knowable.
  >
  > The 'policy' is not a summary of what God *did*; it is the active principle of what God *will do*. It explains why burning is tied specifically to fire and not to water (content-specificity) without requiring fire to have power. It explains why the sequence is reliable (Divine Consistency) without requiring the sequence to be necessary (Divine Freedom).
  >
  > Therefore, God is not an 'idle appendix.' He is the active sustainer of the order that makes science and morality possible. To remove Him is not to reveal a self-sufficient nature, but to remove the very ground that makes nature's regularity intelligible rather than accidental."

  ### Key Philosophical Move
  The success of this defense rests on shifting the locus of **necessity**.
  *   **The Philosophers (Avicenna):** Necessity lies in the *nature of the fire*.
  *   **Hume:** Necessity lies in the *mind of the observer* (psychological projection).
  *   **Ghazālī:** Necessity (or rather, high-probability stability) lies in the *consistency of the Divine Will*.

  By locating the stability in the **moral and rational character of God**, you avoid the "brute fact" charge (because it's grounded in Wisdom) and the "Humean" charge (because it's grounded in an Agent, not just events). This makes the "Custom" a real explanatory principle, not a relabeling of the phenomenon.
