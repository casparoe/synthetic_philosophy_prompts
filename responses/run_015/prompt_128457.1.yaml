answer: |-
  ### 1. The Dependency Order
  Before you introduce the distinction, you must secure the **Intellectualist Assumption**. Students need to feel the intuitive pull that intelligent action *requires* prior internal contemplation of a rule. Without this baseline, Ryle's distinction looks like a trivial observation about "practice vs. theory" rather than a category error.

  1.  **Prerequisite:** Establish that standard intuition equates "intelligence" with "rule-following." (Action is intelligent *because* it follows a plan).
  2.  **The Example:** Introduce the jazz pianist to create tension against that prerequisite. (Intelligent action exists *without* the plan).
  3.  **The Twist:** Move from "she doesn't use rules" to "there are no rules to be found." (Non-decomposability).

  ### 2. The 50-Minute Arc

  **00:00 – 10:00 | Setting the Trap (The Intellectualist Legend)**
  Do not start with Ryle. Start with their intuition. Ask: "What makes an action intelligent rather than a reflex?" Guide them to the consensus that intelligence involves guiding the action by a prior consideration of a principle or rule. Write this on the board: **Intelligence = Internal Rule Consultation.** This is the straw man they need to feel comfortable with before you knock it down.

  **10:00 – 25:00 | The Jazz Pianist (The Wedge)**
  Introduce the case. Describe a pianist improvising over complex changes (e.g., Giant Steps). She navigates successfully in real-time. She has zero music theory; she cannot name the chords, scales, or intervals. She learned purely by ear through years of playing wrong notes and adjusting until it sounded right.
  *   **Key Detail:** Emphasize the *source* of the skill. It wasn't internalizing theory and then speeding it up. It was embodied error-correction. Her hands know where to go because of the history of resistance in the muscles, not because of a map in the head.

  **25:00 – 35:00 | Heading Off Misconception 1 (Fast/Tacit Knowing-That)**
  *   **The Threat:** Students will argue, "She's just doing the theory really fast," or "She has tacit propositions in her head."
  *   **The Interception:** Hit this **immediately** after describing her learning history. Do not let this slide. Point out that if her skill were tacit knowing-that, her learning process would have involved unconsciously absorbing rules. But her error-correction wasn't rule-based; it was aesthetic/kinesthetic. She didn't think "That was a flattened fifth"; she felt "That was tight/wrong."
  *   **The Move:** Argue that the *structure* of her learning (holistic adjustment) is incompatible with the *structure* of knowing-that (propositional accumulation). It's not that the rules are hidden; it's that the skill isn't made of rules.

  **35:00 – 40:00 | Heading Off Misconception 2 (Verbalization = Understanding)**
  *   **The Threat:** Students will claim, "If she can't explain *why* she played that note, she doesn't truly understand the music."
  *   **The Interception:** Hit this **after** securing the "no rules" point. Distinguish between *justifying* performance and *achieving* performance.
  *   **The Move:** Ask: "Does the music fail to resolve if she can't name the dominant chord?" No. The understanding is exhibited in the success of the navigation, not the post-hoc commentary. Understanding here is a capacity to cope, not a capacity to describe.

  **40:00 – 45:00 | The Non-Decomposability Twist**
  Now push the core philosophical weight. Even if we tried to reverse-engineer her playing into a manual, we would fail.
  *   **The Argument:** Her skill is non-decomposable. You cannot break her improvisation down into sub-routines (Step 1: Hear chord, Step 2: Select scale, Step 3: Play note) because her cognition doesn't operate in those discrete units. The "error-correction" adjusts the whole gesture, not a variable within a rule.
  *   **The Claim:** Some knowing-how is atomic. It cannot be reduced to a stack of knowing-thats without destroying the phenomenon itself.

  **45:00 – 50:00 | The Check Question & Omission**
  Run the check question (below). Then, explicitly state what you are leaving out.

  ### 3. The Check Question
  Do not ask "What is the difference between knowing-how and knowing-that?" That invites parroting. Ask this:

  > "If we tried to write a computer program to replicate her skill by breaking her actions down into discrete rules (sub-routines), why does the 'non-decomposable' claim say this program would fail to capture *her* intelligence, even if it sounded the same?"

  **Correct grasp:** They should answer that the program would be manipulating symbols/rules, whereas her intelligence is constituted by the embodied history of correction. The program simulates the output; she embodies the process. If the context shifts slightly, the rule-breaker fails, but her holistic feel adapts.
  **Parroting:** They say "Because skills aren't propositions." (Push them further: "Why does that matter for the *structure* of the skill?")

  ### 4. The Strategic Omission
  **Leave out the Regress Argument.**
  *   **What to say:** "Ryle has a famous logical argument about an infinite regress—that if every intelligent act required a prior rule-check, you'd need an infinite chain of checks. We are skipping that proof today."
  *   **Why:** The regress argument is abstract and logical. Your seminar is built on the phenomenology of the jazz example and the nature of embodied skill. The regress argument distracts from the *positive* account of non-decomposability you want them to grasp. It turns the seminar into a logic puzzle rather than an investigation into the nature of skill. Tell them openly: "We are focusing on the structure of the skill itself, not the logical proof against intellectualism."
