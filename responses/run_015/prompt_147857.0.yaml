  # JOINT STATEMENT ON THE INTERPRETATION OF "WHITE HORSE NOT HORSE"
  **Prepared by:** The Sortal-Semantic Working Group (Camp A) & The Pragmatic-Contextual Working Group (Camp B)
  **Subject:** Adversarial Collaboration on Gongsun Long's *Bai Ma Lun*

  ## 1. Shared Claims (Common Ground)
  Before articulating our divergence, we agree on the following textual and structural facts. These claims are neutral regarding the ultimate philosophical valuation of the argument but establish the boundary conditions for our disagreement.

  *   **Structural Agreement:** We agree the dialogue proceeds via a distinction between *naming the form/shape* (ming xing) and *naming the color* (ming se). Both camps accept that Gongsun Long's core move is to treat "White Horse" as a compound name that cannot be reduced to the simple name "Horse" without loss of semantic content.
  *   **The "Seeking" Argument:** We agree that the pivotal evidentiary move in the text is the "seeking" (qiu) scenario: If one seeks a "horse," a yellow or black horse suffices; if one seeks a "white horse," a yellow or black horse does not suffice. Both camps agree this scenario is intended to demonstrate a difference in satisfaction conditions between the two terms.
  *   **Formal Steps:** We agree that Gongsun Long employs a form of *reductio*: If "White Horse" were identical to "Horse," then seeking a "White Horse" would be identical to seeking a "Horse." Since the outcomes of the seeking differ (acceptance of yellow/black horses), the terms cannot be identical.
  *   **Historical Context:** We agree the text emerges from the Warring States "Rectification of Names" (Zhengming) discourse, where the relationship between linguistic labels (*ming*) and actual realities (*shi*) was a matter of active philosophical and political concern.

  ## 2. Exact Disagreements (Divergent Formulations)
  We refuse to water down our positions. The following statements represent the strongest version of each camp's claim. We sign only our own.

  *   **Camp A (Sortal-Semantic):**
      "The argument establishes a necessary truth about **semantic composition and class extension**. 'Horse' refers to a sortal kind defined by shape. 'White' refers to an attribute. The compound 'White Horse' refers to the intersection of the kind and the attribute. Because the extension of the intersection is a proper subset of the extension of the kind, the statement 'White Horse is not Horse' is logically valid if 'is not' (fei) is read as 'is not identical in extension to.' The argument is a sophisticated early analysis of intensional logic."

  *   **Camp B (Pragmatic-Contextual):**
      "The argument establishes a contingent truth about **administrative specification and fulfillment**. 'Horse' and 'White Horse' are not abstract classes but instructions for identification within a bureaucratic or ritual context. The statement 'White Horse is not Horse' is valid because adding a descriptor changes the **recognition conditions** required to fulfill a command. The argument is not about set theory, but about how modifiers alter the practical criteria for matching a name to a reality in a specific situation."

  ## 3. The Cruxes
  We identify three specific pivot points where our interpretations fundamentally diverge. These are not merely differences in emphasis but incompatible assumptions about how language functions in the text.

  ### Crux 1: The Status of the Modifier (Accidental vs. Sortal-Changing)
  *   **The Issue:** Does the color term "White" function as an accidental property attached to a stable subject ("Horse"), or does it function as a determiner that creates a new functional category?
  *   **Camp A Position:** "White" is an adjectival modifier that restricts the extension of the sortal "Horse." It creates a sub-kind. The logical form is $W(x) \land H(x)$.
  *   **Camp B Position:** "White" is a pragmatic filter that changes the identification procedure. It does not just restrict the set; it changes the *rule of application*. The logical form is closer to a command: "Identify x such that x matches protocol W-H."

  ### Crux 2: The Meaning of 'Fei' (Not)
  *   **The Issue:** What is the semantic value of the copula negation *fei* in the conclusion?
  *   **Camp A Position:** *Fei* denotes **non-identity of extension**. "White Horse" $\neq$ "Horse" because the set of white horses is not the same set as the set of all horses. It allows for class inclusion (a white horse is *in* the set of horses) while denying identity (the set *is not* the set of horses).
  *   **Camp B Position:** *Fei* denotes **non-interchangeability in context**. "White Horse" $\neq$ "Horse" because you cannot substitute one term for the other in a bureaucratic order without risking failure of the mission. It is about functional equivalence, not set membership.

  ### Crux 3: The Role of the "Seeking" (Qiu) Scenario
  *   **The Issue:** Is the "seeking" argument a test of truth conditions or fulfillment conditions?
  *   **Camp A Position:** It is a test of **truth conditions**. It reveals that the proposition "This is a white horse" has different truth conditions than "This is a horse." The difference in acceptable answers (yellow/black) proves the propositions differ in meaning.
  *   **Camp B Position:** It is a test of **fulfillment conditions**. It reveals that the order "Bring a horse" has different satisfaction criteria than "Bring a white horse." The difference proves that names function as tools for action, not just carriers of truth values.

  ## 4. Analogies and Predictions
  To make this disagreement concrete, we propose a test case. We agree that the following analogy bears on the cruxes above. We disagree on the outcome.

  **The Test Case:** *"A temporary security pass is not a security pass."*
  *(Context: A facility with guarded entry points.)*

  ### Camp A Prediction & Reasoning
  *   **Prediction:** The statement is **False** (in standard logical evaluation).
  *   **Reasoning:** A "temporary security pass" falls within the extension of the sortal "security pass." It grants access; it is issued by authority; it identifies the holder. The word "temporary" is an accidental modifier restricting the duration, not the kind.
  *   **Implication for Gongsun Long:** If we apply Camp A's logic to the text, Gongsun Long is making a technical point about set non-identity (The set of temporary passes $\neq$ The set of all passes), but in ordinary discourse, saying "This is not a pass" is misleading. Similarly, "White Horse is not Horse" is technically valid regarding extension but pragmatically infelicitous.

  ### Camp B Prediction & Reasoning
  *   **Prediction:** The statement is **True** (in specific administrative contexts).
  *   **Reasoning:** If the standing order is "No one enters without a security pass," a temporary pass works. But if the order is "Only permanent staff with security passes may enter the vault," the temporary pass fails. In the context of the vault, the temporary pass *is not* a (valid) security pass. The modifier changes the fulfillment conditions of the name.
  *   **Implication for Gongsun Long:** If we apply Camp B's logic to the text, Gongsun Long is highlighting that in specific administrative contexts (e.g., requisitioning cavalry), specifying color changes the fulfillment conditions. "White Horse" triggers a different retrieval protocol than "Horse." Therefore, in that context, they are not interchangeable.

  ### Summary of Divergence on the Case
  *   **Camp A** sees the case as a failure of predication: A temporary pass *is* a pass, full stop. Any claim otherwise is a confusion of subset with disjoint set.
  *   **Camp B** sees the case as a success of pragmatic distinction: A temporary pass *is not* a pass *for the purpose of vault access*. The truth value depends on the implicit "seeking" condition (the context of the order).

  **Signed,**
  *The Sortal-Semantic Working Group*
  *The Pragmatic-Contextual Working Group*
