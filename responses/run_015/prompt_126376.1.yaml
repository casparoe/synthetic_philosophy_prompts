      *   *Premise 3:* Does the method *require* tracking forever? Franklin stopped the strict ledger method eventually. He writes about moving on to a different phase of life. The ledger was a *tool* for acquisition, not necessarily a permanent state of being.
      *   *Premise 5 (The Crucial Slide):* "Wasting mental resources on solved problems violates [Industry and Order]." This assumes that *maintenance* is "waste." Is habit maintenance waste? In virtue ethics, *practice* is often part of the virtue itself, not just a means to an end. Also, does tracking take *significant* mental effort? Franklin suggests it became habitual.
