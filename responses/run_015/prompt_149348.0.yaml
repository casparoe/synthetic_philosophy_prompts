answer: |-
  This is a great angle for a sidebar. The phrase functions as a conversation-stopper precisely because it is semantically overloaded; it smuggles a structural critique into a discussion about individual agency, conflating *impossibility* with *imperfection*.

  Here is the menu of claims hidden inside "There is no ethical consumption under capitalism," graded by truth value and their ability to support the nihilistic conclusion ("it doesn't matter what I buy").

  ### The Menu of Claims

  **1. The Purity Claim (Trivial)**
  *   **The Claim:** Every commodity under capitalism relies on some degree of exploitation (labor, environmental, colonial) somewhere in the supply chain. Therefore, no purchase is perfectly "clean."
  *   **Verdict:** **True but Trivial.** Ethics is almost never about purity; it's about comparative harm.
  *   **Does it support the conclusion?** **No.** Knowing that 100% purity is impossible does not prove that 50% harm is equivalent to 90% harm. It argues against *perfectionism*, not *improvement*.

  **2. The Efficacy Claim (Substantive but Contested)**
  *   **The Claim:** Individual purchasing decisions do not causally alter production levels due to threshold effects (e.g., a store only reorders in bulk) and inelastic demand. My $10 purchase will not save a pig or stop a factory farm.
  *   **Verdict:** **Substantive/Debatable.** Economically, this relies on the "marginal particle" problem. While one purchase rarely triggers an immediate reorder, over time, aggregated individual shifts *do* signal demand. However, for a single agent at time *t*, the causal leverage is near-zero.
  *   **Does it support the conclusion?** **Yes, conditionally.** If you accept a strict consequentialist framework where an action is only meaningful if it *guarantees* a measurable outcome, this claim grants the "checkmate." It renders the individual action futile.

  **3. The Structural Claim (Substantive and Defensible)**
  *   **The Claim:** Harms generated by capitalist production (externalities, exploitation) are features of the system, not bugs. They cannot be solved by consumer choice, only by policy or systemic overhaul.
  *   **Verdict:** **Defensible.** History suggests regulation and collective action drive change faster than ethical consumerism.
  *   **Does it support the conclusion?** **No.** This argues that individual action is *insufficient*, not that it is *irrelevant*. It supports "don't stop at shopping," not "don't bother shopping."

  **4. The Complicity Claim (Philosophical)**
  *   **The Claim:** By participating in the market, you are morally tainted by the system's sins, regardless of your specific choices. You are funding the structure that causes the harm.
  *   **Verdict:** **Defensible (Deontologically).** If morality is about keeping one's hands clean rather than optimizing outcomes, participation itself is the violation.
  *   **Does it support the conclusion?** **Yes, but only via nihilism.** If all participation is equally sinful because the system itself is the sin, then choosing between Product A and Product B is morally moot. You are already guilty.

  **5. The Definitional Claim (Radical)**
  *   **The Claim:** The word "ethical" is being redefined. It no longer means "making the best available choice to reduce harm," but "participating in a just economic system." Since capitalism is unjust, the set of "ethical consumption" is empty.
  *   **Verdict:** **Stipulative.** This is a rhetorical move, not an empirical one. It changes the rules of the language game.
  *   **Does it support the conclusion?** **Yes, by definition.** It makes the conclusion a tautology. If "ethical" means "systemically just," then obviously you can't buy it in a store. But this renders the word useless for navigating daily life.

  ***

  ### The Load-Bearing Distinction

  Your panelist is correct: **The distinction between *making a difference*, *expected difference*, and *participating in harm* is the load-bearing wall here.** The slogan works by collapsing these three distinct moral categories into one blob of guilt.

  *   **Making a Difference (Causal):** Did my specific burger cause a cow to be killed? (Likely no, due to thresholds).
  *   **Expected Difference (Probabilistic):** Did my purchase increase the statistical likelihood of future harm? (Yes, marginally).
  *   **Participating in Harm (Complicity):** Did I financially support a system that kills cows? (Yes, definitely).

  The audience member's "checkmate" relies on conflating **Complicity** with **Futility**.

  She is arguing from **Complicity** (I am tainted by the system) to prove **Futility** (therefore, my choice doesn't matter). But that logic only holds if you accept the **Definitional Claim** (Claim 5 above) that ethics requires purity.

  If you reject that definition and stick to a harm-reduction model, the **Complicity** claim actually argues for *more* careful consumption, not less. If I am complicit, I have a duty to minimize my complicity, even if I cannot eliminate it.

  **For your sidebar:** The phrase isn't an argument; it's a category error. It uses a structural truth (Claim 3) to validate a causal nihilism (Claim 2) by invoking a definition of ethics (Claim 5) that no one actually lives by. It gets the "checkmate" because it shifts the goalposts from "how do we reduce harm?" to "how do we achieve innocence?"—and since innocence is impossible, the game ends.

  The panelist's distinction is the tool to reopen the game. If we admit we can't be innocent (Complicity), does that mean we shouldn't try to reduce the harm (Expected Difference)? Most people, when pressed, will say no. The slogan just saves them from having to admit that.
