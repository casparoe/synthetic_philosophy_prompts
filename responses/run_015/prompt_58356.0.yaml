      *   DoR: $P(\text{Individual Acts})$ goes down as $N$ goes up. Does $P(\text{Group Acts})$ go down? Yes, typically, because the drop in individual propensity outweighs the increase in potential actors. (Under-action).
      *   Okay, the math holds up conceptually.

  9.  **Final Polish:** Check clarity, flow, and ensure the "Principled Test" is distinct and actionable. (The "Asymmetry of Error Costs" seems the strongest framing).

