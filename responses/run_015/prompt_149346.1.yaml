  Is her account genuinely immune to the regress, or does it relocate it? The operation of consuming two values and returning one looks suspiciously like a relation between the operation and its inputs. One wants to know why that relation does not itself stand in need of a tie. If the operation is distinct from the values it processes, we seem to require a further principle to explain why this operation applies to these values. To make the answer stick, she would have to add that the operation is not an entity standing over against its inputs, but rather the very mode of their existence. She must argue that values in a proposition do not exist prior to the operation; they are constituted by it. If the operation is primitive and constitutive, rather than relational and external, the regress loses its foothold. She must insist that the procedure is not a thing that relates things, but the activity of relating itself.

  What does the assembly account do about propositions that nobody has assembled? If unity is the residue of a procedure, then it seems to become dependent on somebody's running it, on the order in which they run it, and on the notation they run it in. This risks making truth dependent on mental acts, a trap known as psychologism. If no one thinks the thought, does the proposition exist? The Fregean view fares better here. For Frege, thoughts are abstract objects that exist independently of being grasped. The unsaturated concept waits eternally for completion, whether or not any mind completes it. For the assembly account to avoid fatal subjectivity, it must posit that the procedure is abstract, not psychological. It must claim that the operation is a feature of reality's architecture, not just a feature of human thinking. If she can turn this into a virtue, it is by suggesting that truth is inherently active, a doing rather than a being. But if she cannot, the view collapses into the claim that nothing is true until someone thinks it. This is a high price to pay for escaping Bradley.

  Is the Fregean asymmetry between object and concept an explanation of unity, or a redescription of it with a technical label attached? Critics argue that saying a concept is 'unsaturated' is just a fancy way of saying 'it binds things'. It names the mystery rather than solving it. The assembly account is exposed to the parallel charge. To say unity is the residue of a procedure may simply be to redescribe the binding of a proposition as the execution of a procedure without explaining what empowers the procedure. Both views risk saying: 'It unifies because it is the kind of thing that unifies.' However, this charge lands less heavily if one accepts that the demand for a further explanation is itself the error. Both accounts suggest that unity is fundamental and cannot be analysed into simpler parts. To ask for the glue behind the unsaturatedness or the power behind the operation is to demand an explanation where none is possible. They are not failing to explain; they are denying that an explanation is needed. This is the charge of emptiness. If I say a key fits a lock because it is 'fit-shaped', I have not explained the mechanism of the tumblers. Similarly, if Frege says concepts bind because they are 'unsaturated', he may be hiding the mechanism behind a metaphor. The assembly account faces the same hurdle. To say the procedure binds the values is to say the machine produces the product. But what makes the machine work? If the answer is simply that it is a machine, we have not advanced. However, both philosophers would reply that the demand for a mechanism is the mistake. Unity is not a mechanical effect; it is a logical precondition. To ask for the cause of unity is to treat logic like physics.

  Finally, the two views are closer than they sound. Both are ways of denying the same premise: that a proposition is first a plurality of items and only afterwards a unity. Both reject the inventory model that gives Bradley's regress its start. The disagreement that survives comes down to a metaphysical preference between static incompleteness and dynamic operation. Frege offers an ontology of gaps; the interviewee offers an ontology of acts. One sees the proposition as a structure waiting to be closed, the other as a process reaching completion. The choice is between a picture of logic as a landscape of shapes, or logic as a machine of functions. Neither can prove the other wrong, because both are attempting to describe the preconditions of saying anything at all. They are rival myths for the same boundary of thought.

  We assume our sentences describe the world, but philosophy suggests they might not hold together at all. If the binding force of a proposition leads to an infinite regress, then nothing we say is ever truly unified. Solving this puzzle is the only way to ensure our language can actually claim something is true.

  Her account is most likely to break when forced to explain how a procedure can exist independently of any mind running it.
