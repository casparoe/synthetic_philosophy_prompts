answer: |-
  Here is an analysis of the Justine Sacco episode through the lens of punishment theory, adhering to your constraints on facts, citations, and epistemic transparency.

  ### I. The Standard Conditions of Punishment

  To evaluate the case, we first need the baseline criteria. While definitions vary, there is a working consensus in analytic philosophy that for an act to count as **punishment proper**, it must satisfy four conditions:

  1.  **Hard Treatment:** It must deliberately impose something unwelcome or harmful (loss of liberty, money, status, or life).
  2.  **Offense Condition:** It must be in response to an actual or supposed violation of a rule or norm.
  3.  **Authority Condition:** It must be imposed by an agent with the standing or authority to sanction the violator.
  4.  **Communicative Condition:** It must intend to communicate condemnation or censure, not merely cause harm as a side effect (distinguishing it from taxation or quarantine).

  If any of these are missing, the event may be *like* punishment, but theoretically, it falls into a different category.

  ---

  ### II. Analysis Under Four Readings

  #### 1. Punishment Proper
  *   **The Agent:** Under this reading, the **Employer (IAC)** is the only candidate with plausible standing. The **Crowd** lacks authority; they are private citizens without jurisdiction over Sacco. The **Amplifiers** are witnesses, not judges.
  *   **The Sanction:** The firing is the sanction. The pile-on is merely the *investigative* or *denunciatory* phase that established the facts.
  *   **Standing:** This reading struggles with third-party standing. In standard theory, you cannot punish someone for a wrong done to others unless you represent those others (the State) or have a specific relationship (parent/child). The crowd had neither.
  *   **Verdict:** If this is punishment, it was administered solely by the employer. The crowd's role was evidentiary. However, if the employer fired her solely due to crowd pressure rather than internal HR process, the "Authority Condition" is compromised—the employer acted as an agent of the mob, not a sovereign authority.

  #### 2. Expulsion / Exclusion (The Club Model)
  *   **The Agent:** The **Community of Norm-Holders**. This includes the crowd, the employer, and the industry peers.
  *   **The Sanction:** Revocation of membership privileges (employment, social capital, platform access).
  *   **Standing:** Standing is derived from association. If you belong to a cooperative scheme (the professional class, Twitter userbase), you agree to norms. Violation triggers expulsion.
  *   **Verdict:** This fits the facts better. Sacco was not "sentenced"; she was deemed incompatible with the group. The firing is not a penalty imposed from above, but a severing of ties from within. The crowd acts as the membership body voting to eject.
  *   **Third-Party Standing:** Dissolved. In a club, any member can flag a violation that threatens the club's reputation or cohesion.

  #### 3. Collective Self-Defence / Preemption
  *   **The Agent:** Anyone perceiving a threat.
  *   **The Sanction:** Neutralization of the threat.
  *   **Standing:** Universal. Anyone potentially harmed by the norm violation has standing to stop it.
  *   **Verdict:** Weak fit. This reading requires the tweet to be an *ongoing threat* (e.g., inciting violence). A racist joke is retrospective harm (offense) rather than prospective danger. Treating it as self-defence stretches the concept of "harm" to include "emotional distress" or "reputational risk to the industry."
  *   **The Sanction:** The pile-on is the defensive maneuver; the firing is the neutralization of the vector (Sacco as a liability).

  #### 4. Mere Expression / Boycott
  *   **The Agent:** Individuals exercising choice.
  *   **The Sanction:** There is no sanction. There is only the withdrawal of cooperation, attention, or custom.
  *   **Standing:** Irrelevant. I do not need standing to stop talking to you.
  *   **Verdict:** Technically robust but phenomenologically thin. It describes the *mechanism* (people stopped engaging) but ignores the *coercive intent*. A boycott becomes punishment when the intent shifts from "I won't buy" to "We will ensure no one can buy."
  *   **The Line:** If the crowd merely expressed disgust, it's Expression. If they actively contacted her employer to ensure termination, it crosses into Punishment/Coercion. In Sacco's case, the hashtag #HasJustineLandedYet functioned as coordination, pushing this past mere expression.

  ---

  ### III. The Two Structural Problems

  #### 1. Diffusion (The Problem of the Agent)
  *   **The Issue:** No single person ruined Sacco. Thousands contributed trivial harms (a retweet, a comment) that aggregated into a life-altering sanction.
  *   **Punishment Proper:** This is fatal. Punishment requires a responsible agent. If no one person intended the total harm, no one punished her. The harm is an emergent property, not an intentional act.
  *   **Expulsion/Boycott:** These readings dissolve the problem. Expulsion can be a collective vote where no single voter is responsible for the outcome. A market boycott is an aggregate result.
  *   **Implication:** If you insist this was *Punishment Proper*, you must identify a principal (the Employer). If you cannot, you must admit it was a *social phenomenon* that mimicked punishment without a punisher.

  #### 2. The Missing Terminus (The Problem of Duration)
  *   **The Issue:** Prison sentences end. Fines are paid. Sacco's "sentence" (unemployability, searchability) is indefinite.
  *   **Punishment Proper:** This indicates a malfunction. Punishment without a terminus is tyranny or torture. It suggests the system lacks the mechanism for reintegration.
  *   **Expulsion:** Permanent expulsion is valid in clubs. If you are kicked out of a country club, you don't get to return after a year.
  *   **Boycott:** No obligation to resume.
  *   **Implication:** The lack of a terminus strongly suggests this was **Expulsion**, not Punishment. Punishment theories generally assume the possibility of rehabilitation or debt repayment. Digital exclusion assumes permanent contamination.

  ---

  ### IV. Proportionality

  *   **Punishment Proper:** Requires strict proportionality (the harm must fit the crime). Under this reading, the Sacco outcome was likely disproportionate. Losing a career for a single tweet to 200 followers violates the scale.
  *   **Expulsion:** Proportionality is less relevant than **Procedural Fairness**. The question isn't "was the harm too much?" but "was the process for ejection fair?" Did she get a hearing? (No). Was the norm clear? (Debatable).
  *   **Boycott:** Proportionality does not apply. I can boycott a store for a trivial reason. However, *organized* coercion to enforce a boycott reintroduces proportionality concerns.
  *   **Case Application:** The Employer's firing might be proportional (protecting the brand). The Crowd's shaming was likely disproportionate. This split suggests the Employer acted on Risk Management (Club Model), while the Crowd acted on Retribution (Punishment Model), creating a mismatch in severity.

  ---

  ### V. Reverse Direction: What the Case Does to the Theory

  Your suspicion is correct: standard punishment theory assumes a **monopoly on violence/sanction** (usually the State) and a **determinate sentence**.

  1.  **Structural Inability:** The theory cannot easily classify sanction by a dispersed crowd because it lacks an "Authority Condition." The theory treats unauthorized sanction as "vigilantism" or "mob violence," categories that presume illegitimacy.
  2.  **Anomaly vs. Evidence:** This is not just an anomaly; it is evidence that the concept of "Punishment" is too narrow for the digital age. If we call Sacco's experience "punishment," we break the definition of authority. If we call it "social pressure," we understate the harm.
  3.  **Silence:** Theory is silent on **algorithmic permanence**. Traditional punishment assumes the record can be sealed or the debt paid. Theory has no account for a sanction that is automated, permanent, and globally accessible via search engine.

  **Conclusion on Theory:** The Sacco case suggests we should drop "Punishment" as the primary descriptor. It is better understood as **Reputational Exclusion**. Using "Punishment" imports expectations (rights, proportionality, termini) that the social reality does not support, leading to category errors.

  ---

  ### VI. Epistemic Audit

  Per your request, here is the breakdown of consensus, contestation, and my own reconstruction.

  **1. Settled Consensus (among punishment theorists):**
  *   Punishment requires intentionality. (Accidental harm isn't punishment).
  *   Punishment requires an authority figure or institution. (Private citizens generally cannot "punish" in the technical sense).
  *   Punishment involves hard treatment + censure.

  **2. Contested Ground:**
  *   **Private Punishment:** Some theorists argue parents or schools "punish," others say they merely "discipline." Whether a corporation "punishes" an employee or simply "terminates a contract" is also debated. I have treated the Employer's firing as ambiguous between the two.
  *   **Standing:** Whether third parties (the crowd) ever have standing to sanction is highly contested. Retributivists say no; some consequentialists say yes if it prevents future harm. I have leaned toward the Retributivist view (no standing) for the "Punishment Proper" reading to maintain theoretical rigor.

  **3. My Reconstruction (Flagged):**
  *   **The Club Model:** I am reconstructing "Expulsion" as a distinct category from "Punishment." In legal theory, expulsion is often treated as a subset of private punishment. I am separating them to show that proportionality applies differently. This is my own analytical move to make the case fit the facts.
  *   **Diffusion:** I am asserting that diffuse harm cannot be punishment. Some theorists might argue collective action *can* constitute a collective agent. I am rejecting that for this analysis to highlight the accountability gap.

  **4. Normative Work Hiding as Conceptual Claim:**
  *   **The "Terminus" Argument:** When I argue that the lack of an end-date means this isn't punishment, I am doing normative work. I am implying that *legitimate* sanction must be finite. A theorist who believes in permanent exile (e.g., for heinous crimes) would disagree that the missing terminus disqualifies it as punishment. By framing the missing terminus as a theoretical failure, I am subtly arguing that Sacco's treatment was illegitimate.
  *   **The "Authority" Condition:** By insisting the Crowd lacks standing, I am reinforcing a statist or institutionalist view of justice. I am conceptually blocking the idea that "the people" can legitimately sanction without a process. This protects institutions but potentially delegitimizes grassroots accountability.

  **Summary:** The Sacco episode is not "Punishment Proper" because it lacks a singular authority and a determinate sentence. It is **Reputational Exclusion** operating through a **Club Model** (employment/social standing). The theory of punishment is structurally unable to process this without breaking its own definitions, suggesting we need a new taxonomy for digital social sanctions.
