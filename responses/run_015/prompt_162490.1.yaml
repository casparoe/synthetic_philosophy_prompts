answer: |-
  Here is a proposed Standard Operating Procedure (SOP) designed for the Corbin DEQ Interpretations Office, followed by its application to your three live disputes.

  ### The Corbin Protocol: Statutory Interpretation SOP

  **Objective:** Produce a binding, bright-line interpretation within 10 days that satisfies the Administrative Interpretation Act (AIA) and minimizes litigation risk.
  **Users:** Two Staff Attorneys.
  **Inputs:** Statute text, Definitions, Enacted Findings/Purpose, Existing Agency Guidance (for reliance check).
  **Outputs:** "Permitted," "Prohibited," or "Discretionary Policy Call."

  ---

  #### Step 1: The Textual Baseline (Convergence Gate)
  **Action:** Isolate the specific operative verb and the defined subject. Apply the ordinary meaning of the words at the time of adoption. Use the statute's internal definitions section first; if silent, use a standard dictionary from the year of enactment.
  **Admissible Evidence:** Statute text, Definitions section, Contemporary dictionary.
  **Closing Condition:**
  *   **Pass:** The text yields a single, logical meaning without contradiction.
  *   **Fail:** The text yields two equally plausible meanings, or the definition contradicts common usage.
  **Note:** This step should look the same to a textualist and a purposivist. If the text is nonsense on its face, mark "Fail" and move to Step 2.

  #### Step 2: Structural Harmony (Convergence Gate)
  **Action:** Read the provision in the context of the surrounding sections and the 2019 amendments (if applicable). Does the Step 1 meaning render another section superfluous, contradictory, or impossible to perform?
  **Admissible Evidence:** The Act as a whole, Amendment history (text only).
  **Closing Condition:**
  *   **Pass:** The Step 1 meaning fits the statutory scheme without breaking other parts.
  *   **Fail:** The Step 1 meaning creates an impossibility (e.g., requiring proof of an exempted act) or nullifies a specific exemption.
  **Note:** If Step 1 fails here, the text is legally "unclear" regardless of how plain the words seem. Proceed to Step 3.

  #### Step 3: The Mischief Check (Divergence Gate)
  **Action:** Compare the Step 1 meaning against the *enacted* Findings/Purpose clause. Does applying the text to this specific fact pattern advance the stated goal, or does it frustrate it?
  **Admissible Evidence:** Enacted Findings/Purpose section only. **No** committee reports, floor debates, or external archives.
  **Closing Condition:**
  *   **Pass:** The application aligns with the stated purpose. (Result: Adopt Step 1 meaning).
  *   **Fail:** The application technically follows the text but defeats the stated purpose (e.g., banning a silent motor to preserve quiet).
  **Note:** **This is where you two disagree.** The Textualist wants to stop at Step 1. The Purposivist wants this to override Step 1. The AIA requires you to *weigh* this. If this step "Fails," do not override the text yet. Instead, mark the provision as **"Genuinely Unclear"** due to Text-Purpose conflict. Proceed to Step 4.

  #### Step 4: The Ambiguity Threshold (The Risk Gate)
  **Action:** Declare whether the conflict between Text (Step 1/2) and Purpose (Step 3) creates "genuine uncertainty" about legislative intent.
  **Admissible Evidence:** The output of Steps 1-3.
  **Closing Condition:**
  *   **No Ambiguity:** Text is clear, Purpose is merely explanatory. (Result: Follow Text).
  *   **Ambiguity Found:** Text and Purpose point in opposite directions, or Step 2 created an impossibility. (Result: Proceed to Step 5).
  **Note:** **This is the weakest step.** A court can always say "You should have known it was clear" or "You should have seen it was ambiguous." This is where you put your judgment on the record.

  #### Step 5: The AIA Tie-Breaker (The Mandate)
  **Action:** If Step 4 finds Ambiguity, apply the statutory tie-breaker: Pick the reading that *least expands* the reach of any penalty, fee, or prohibition.
  **Admissible Evidence:** None. This is a mechanical rule.
  **Closing Condition:** Select the narrower scope.
  **Note:** This is non-discretionary under the AIA. If you are in Step 5, you cannot choose the broader prohibition even if you think it's better policy.

  #### Step 6: The Policy Valve (The Honesty Check)
  **Action:** If Steps 1-5 indicate the action is *legal* (e.g., revocation is permitted), but the agency wishes to decline the action for practical reasons, label this explicitly.
  **Admissible Evidence:** Resource constraints, enforcement priorities, reliance on past brochures.
  **Closing Condition:**
  *   **Interpretation:** "The statute prohibits/allows X."
  *   **Policy:** "The statute allows X, but the Department will exercise discretion to do Y."
  **Note:** Never disguise a Policy decision as an Interpretation. If the text allows revocation but you won't do it, write that down. Do not rewrite "any" to mean "material."

  ---

  ### Application to Live Disputes

  #### Dispute 1: The Motorboat (Electric Trolling Motor & Hydrofoil)
  *   **Step 1 (Text):** Definition of "motorboat" includes "vessel propelled in whole or in part by machinery." Electric motor = machinery. Canoe/Hydrofoil = vessel.
      *   *Result:* **Ban Applies.** (Text is clear).
  *   **Step 2 (Structure):** No structural conflict. Definitions section controls.
      *   *Result:* **Pass.**
  *   **Step 3 (Mischief):** Findings cite "preserving quiet character." Electric motors are quiet. Banning them does not advance the "quiet" goal.
      *   *Result:* **Fail.** (Text bans it; Purpose suggests it's harmless).
  *   **Step 4 (Ambiguity):** Does the conflict between "Machinery" (Text) and "Quiet" (Purpose) create genuine uncertainty?
      *   *Analysis:* A textualist says no. A purposivist says yes. Under the AIA hybrid, this conflict *is* the ambiguity.
      *   *Result:* **Ambiguity Found.**
  *   **Step 5 (Tie-Breaker):** Ambiguity exists. Apply the rule: "Least expansion of prohibition."
      *   *Result:* **Narrow the Ban.** Electric motors are excluded from the prohibition.
  *   **Step 6 (Policy/Reliance):** The brochure told people electric was OK.
      *   *Result:* This reinforces the Step 5 outcome. For the Hydrofoil (new tech, no brochure), the Step 5 interpretation still applies (Ban narrowed).
  *   **Final Output:** **Permitted.** The ban does not reach battery-powered propulsion.
  *   **Confidence:** **Medium.** You (the Purposivist) will like this; your colleague (Textualist) will hate it. He will argue Step 4 was wrong (Text was clear). However, the AIA *requires* weighing Purpose. If Purpose conflicts, Ambiguity is the honest finding.
  *   **Honesty Check:** You mentioned you think the brochure is "definitely wrong." This procedure concludes the brochure is *legally correct* under the AIA tie-breaker, even if the text looks broad.

  #### Dispute 2: Proof of Publication (Small Withdrawals)
  *   **Step 1 (Text):** Statute requires filing proof of publication. Applicant did not file.
      *   *Result:* **Application Incomplete/Denial.**
  *   **Step 2 (Structure):** 2019 Amendment exempted small withdrawals from *publishing*. Statute still requires *proof*. It is impossible to file proof of an act you are exempted from performing.
      *   *Result:* **Fail.** (Creates impossibility).
  *   **Step 3 (Mischief):** Purpose of 2019 Amendment was to reduce burden on small withdrawals. Requiring proof of an exempted act increases burden.
      *   *Result:* **Fail.** (Defeats purpose).
  *   **Step 4 (Ambiguity):** Text requires proof; Structure makes it impossible.
      *   *Result:* **Ambiguity Found.** (Scrivener's error / Failure to conform).
  *   **Step 5 (Tie-Breaker):** Ambiguity exists. Apply rule: "Least expansion of prohibition." Denial is a prohibition on the withdrawal.
      *   *Result:* **Narrow the Prohibition.** Do not deny based on missing proof.
  *   **Final Output:** **Permitted.** Accept the application without proof of publication.
  *   **Confidence:** **High.** This is the easiest case. The "Impossibility" in Step 2 forces the Ambiguity finding in Step 4. Any court would agree that requiring proof of an exempted act is absurd.
  *   **Honesty Check:** No policy disguise needed. This is pure interpretation.

  #### Dispute 3: Revocation (Missing Reports)
  *   **Step 1 (Text):** "Violated *any* provision." Missing report is a violation.
      *   *Result:* **Revocation Permitted.**
  *   **Step 2 (Structure):** No structural conflict.
      *   *Result:* **Pass.**
  *   **Step 3 (Mischief):** Purpose is water quality protection. No harm occurred. Revocation harms the town (sewage risk).
      *   *Result:* **Fail.** (Revocation frustrates public health goal).
  *   **Step 4 (Ambiguity):** Does "any" mean "any" or "any material"?
      *   *Analysis:* Text is specific ("any"). Purpose suggests leniency. However, "any" is usually a clear intensifier.
      *   *Result:* **No Ambiguity.** (Text is clear).
  *   **Step 5 (Tie-Breaker):** Not triggered. Step 4 was "No Ambiguity."
  *   **Step 6 (Policy Valve):** The law allows revocation. The Department does not want to revoke.
      *   *Result:* **Policy Call.**
  *   **Final Output:** **Discretionary.** The Memo must state: *"The Department has legal authority to revoke under Section X. However, pursuant to Enforcement Policy Y, the Department will issue a Compliance Order for minor paperwork violations absent actual discharge."*
  *   **Confidence:** **High (on the procedure), Low (on the outcome).** The procedure correctly identifies that reading "any" as "material" is lying. It forces you to admit you are using discretion.
  *   **Honesty Check:** This is the one you won't like. You wanted the procedure to tell you revocation is *illegal*. It won't. It will tell you revocation is *legal but unwise*. You must own the discretion.

  ---

  ### Risk Assessment & Confidence

  **Confidence Levels:**
  1.  **Motorboat:** **60%.** This is the most litigable. A judge could rule that "Machinery" is unambiguous and the Purpose clause is just flavor text, rendering Step 4 incorrect. However, the AIA mandates weighing Purpose, which gives you cover.
  2.  **Publication:** **95%.** The impossibility of compliance makes the ambiguity undeniable.
  3.  **Revocation:** **90%.** The text is too clear to twist. The only risk is a court saying you *must* revoke if the statute says "may" and you have a pattern of never revoking (abuse of discretion), but that's an admin law fight, not a statutory interpretation fight.

  **The Weakest Step:**
  **Step 4 (The Ambiguity Threshold).**
  This is the step I expect a reviewing court to throw out. It is the "judgment in a lab coat."
  *   **Why:** In Dispute 1 (Motorboat), a strict textualist judge will say, "Machinery is not ambiguous. You manufactured ambiguity to invoke the Tie-Breaker." A purposivist judge will say, "The Purpose made it ambiguous, you were right."
  *   **Mitigation:** In your memos, explicitly write *why* Step 4 was triggered. "Because the Textual application conflicts with the Enacted Purpose, the intent is genuinely unclear." Put the conflict on the record so the appellate court sees you didn't just skip to the Tie-Breaker.

  **Final Advice:**
  For Dispute 3, do not write a guidance memo saying "Revocation is not allowed for paperwork violations." Write a memo saying "Revocation is authorized, but Enforcement Priorities direct staff to seek Compliance Orders first." This protects the Department if a future catastrophic violation occurs on paperwork; you haven't tied your own hands by rewriting the statute.
