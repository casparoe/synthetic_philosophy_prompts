answer: |-
  ### The Metaphysics of the Alderly: An Institutional Autopsy

  You have asked me to reconstruct the implicit ontology of the Alderly Museum based on its track record. This is not merely a matter of applying standard aesthetic theory (Goodman's autographic/allographic distinction is, as your editor suspects, insufficient here). The Alderly operates on a hybrid, somewhat unstable metaphysics that shifts depending on the medium, the timeline, and the moral status of the object's history.

  To give you the precision you need, I will not offer a single theory. Instead, I will derive three candidate rules that are internally consistent with all seven precedents but diverge sharply on the Iris Vane case. I will then identify where the track record underdetermines the outcome, offer my prediction, and evaluate your proposed discriminating cases.

  ---

  ### Stage 1: Candidate Rules (The Alderly Triad)

  These three principles are reconstructed from the committee's unanimous verdicts. Each explains all seven past cases but relies on a different weighting of *Matter*, *Intention*, and *History*.

  #### Rule 1: The Continuity of Support Principle (Material-Historical)
  **Definition:** A "Work" requires the survival of the original structural support (canvas, wall, plaster) that witnessed the original artistic act. Surface replacement is permissible (restoration), but total material regeneration is not, unless the medium is inherently replicative (e.g., bronze casting).
  *   **Fits the Track Record:**
      *   *Explains Case 5 (Fresco):* The plaster wall (support) survived; the paint (surface) did not. Verdict: Original.
      *   *Explains Case 4 (Bust):* New marble dust, no original support. Verdict: Replica.
      *   *Explains Case 1 (Titian):* Different canvas/support than Titian's hand. Verdict: Workshop.
      *   *Explains Case 3 (Bronze):* Bronze casting is inherently multiple; the "support" is the mold/plaster, which survived. Verdict: Work.
      *   *Explains Case 6 (Minimalist):* Conceptual art treats the *certificate/spec* as the support. Verdict: Work.
      *   *Explains Case 2 (Forgery):* Support is historically tainted by deception. Verdict: Reject.
      *   *Explains Case 7 (Autograph Replica):* New canvas, but the Artist's hand provides a new "origin point." Verdict: New Work (dated later).
  *   **Tension:** It requires a flexible definition of "support" (physical for frescoes, conceptual for minimalism) to avoid contradiction between Case 4 and Case 6.

  #### Rule 2: The Authorized Instruction Principle (Intentional-Normative)
  **Definition:** A "Work" is any object instantiated in accordance with the normative authority of the artist (or their legitimate estate). Material continuity is secondary to the validity of the instruction chain. Deception voids authority.
  *   **Fits the Track Record:**
      *   *Explains Case 3 & 6:* Estate/Artist authorized the new instantiation. Verdict: Work.
      *   *Explains Case 7:* Artist authorized the new instantiation (by painting it). Verdict: Work.
      *   *Explains Case 1:* Pupil acted within the normative authority of the Shop. Verdict: Workshop (a subordinate category of Work).
      *   *Explains Case 2:* Forger lacked authority and acted deceptively. Verdict: Reject.
      *   *Explains Case 4:* No artist authority existed for the 2023 print. Verdict: Replica.
      *   *Explains Case 5:* Restorer acted under the implied authority of preservation. Verdict: Original.
  *   **Tension:** It does not specify what happens when Estate Authority conflicts with prior Artist Intent (the Vane problem).

  #### Rule 3: The Phenomenological Substitution Principle (Functional-Aesthetic)
  **Definition:** An object is a "Work" if it satisfies the "Fifty-Year Substitution Test": it can stand in for the original without perceptual or scholarly detection, provided the institutional labeling prevents historical deception.
  *   **Fits the Track Record:**
      *   *Explains Case 5 & 6:* Indistinguishable in function and appearance. Verdict: Work.
      *   *Explains Case 3:* Casts are indistinguishable from the artist's concept. Verdict: Work.
      *   *Explains Case 4:* **The Outlier.** This rule struggles here. The bust was "indistinguishable to the eye and hand." Why was it rejected?
          *   *Patch:* The rule must include a "Historical Witness Clause": The object must also bear witness to its *own* time of creation. Case 4 fails because a 2023 object cannot witness antiquity. Case 5 passes because the 1850s paint witnesses the 1850s (as restoration).
      *   *Explains Case 2:* Fails the "no deception" clause.
      *   *Explains Case 7:* Indistinguishable composition, but the date witnesses the later time.
  *   **Tension:** It relies on a slippery distinction between "witnessing history" and "fooling the eye."

  ---

  ### Stage 2: Prediction and Analysis

  #### The Underdetermination
  The track record leaves one critical variable unresolved: **The Conflict of Authority.**
  In Case 3 (Bronze), the Estate authorized a posthumous work. We do not know if the Artist had previously forbidden it. In Case 6 (Minimalist), the Artist authorized the remake. We do not know if the Estate would have overruled her had she died before the fire.
  The Iris Vane case forces this conflict. The Estate says *Yes*. The Artist (pre-mortem) said *No*. The Alderly has no precedent for weighing a living Artist's veto against a dead Artist's Estate's permission.

  #### The Closest Analogue: Case 6 (The Minimalist Remake)
  This is the strongest analogue. Both involve a destroyed work, a reconstruction based on documentation/specs, and a desire to display the new object as the primary instance of the work.
