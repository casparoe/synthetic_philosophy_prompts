  # Prep Sheet: Thesis Chapter Work-in-Progress Session

  **Topic:** Intervention-Sensitivity vs. Entrenchment (Goodman's New Riddle)
  **Goal:** Defend the claim that projectibility relies on counterfactual stability under intervention, not just past usage, with a payoff in machine learning (spurious correlations).
  **Language:** American English (per committee requirements).

  Below are the eight objections most likely to arise, ordered by the potential damage to your argument. Each includes the likely phrasing from your specific committee members, a two-minute reply, and an honest assessment of where your position remains vulnerable.

  ---

  ### 1. The "Meta-Grue" Objection (The One You Hope Nobody Asks)
  **Who:** Likely Priya or a sharp Emeritus.
  **The Objection:** "You're replacing one projectible predicate ('green') with another condition ('intervention-sensitive'). But isn't 'intervention-sensitive' itself just another predicate whose projectibility you're helping yourself to? How do you know *that* track record will survive changes in how we look? You haven't solved the riddle; you've just pushed it back one step."

  **Your Reply:**
  "That's the right worry, and it touches on the regress problem. My response is that intervention-sensitivity isn't a first-order predicate like 'green' or 'grue' that we project onto objects. It's a second-order methodological constraint on *which* predicates we allow ourselves to project. It's akin to saying, 'We don't just count votes; we check if the voting machine was tampered with.' The check itself isn't another vote; it's a condition on the validity of the voting process. I'm arguing that induction isn't just about counting past successes (entrenchment); it's about assuming the world has a stable structure that persists independent of our sampling. If that assumption fails, no induction works. So, I'm not solving the riddle by finding a magic predicate; I'm dissolving it by showing that projectibility presupposes a causal structure that entrenchment ignores."

  **Where It's Soft:**
  This leans heavily on a realist assumption about causal structure. A strict empiricist can still ask why *that* structure is privileged without begging the question. You risk looking like you're asserting a metaphysical axiom to solve an epistemic problem.

  ### 2. The "Humean Absorption" Objection
  **Who:** Your Supervisor.
  **The Objection:** "This looks like Hume's appeal to custom with a fake moustache. Hume said we project what we're habituated to. You're saying we project what's stable under intervention. But our sense of what's 'stable under intervention' is just a more sophisticated habit. You've reinvented the appeal to custom with more machinery, but you haven't escaped the circle."

  **Your Reply:**
  "I see the resemblance, but the machinery isn't decorative; it's functional. Hume's custom is purely psychological—it's about how we *feel* about the future based on the past. My condition is modal—it's about how the world *behaves* under counterfactual changes. Hume denies we can know those counterfactuals; I'm arguing that successful induction (like in modern ML) actually requires us to track them. If I'm right, the New Riddle isn't about psychology; it's about the difference between passive observation and active manipulation. That's a distinction Hume collapses, but one that contemporary science relies on."

  **Where It's Soft:**
  A committed Humean can argue that our belief in counterfactual stability is *itself* derived from custom. You need to hold the line that this is a normative claim about what *makes* induction successful, not just a descriptive claim about how we think.

  ### 3. The "Bayesian Reduction" Objection
  **Who:** Priya.
  **The Objection:** "Why do we need this metaphysical baggage? In a Bayesian framework, 'intervention-sensitivity' is just a claim about priors. You're assigning a higher prior to hypotheses that are structurally stable. Doesn't converting this into a claim about priors capture everything you want without positing new conditions?"

  **Your Reply:**
  "It captures the updating, but not the justification. Bayesianism tells us how to update beliefs given a hypothesis space, but it doesn't tell us how to construct that space in the first place. The New Riddle is about which predicates get into the hypothesis space. If I just say 'give stable predicates higher priors,' I haven't explained *why* nature cooperates with those priors. My claim is that the world distinguishes between spurious correlations and causal features. Bayesianism can model the agent, but it needs my condition to model the environment the agent is embedded in."

  **Where It's Soft:**
  Subjective Bayesians will argue that "modeling the environment" is just part of the agent's belief state. You risk drawing a line between epistemology and ontology that Priya may not accept.

  ### 4. The "Technical Precision" Objection
  **Who:** Dave.
  **The Objection:** "You're borrowing 'intervention' from causal inference, but you're using it loosely. Are you talking about do-operators? Instrumental variables? If you don't specify the formal model, you're just using causal buzzwords to dress up a philosophical intuition."

  **Your Reply:**
  "I appreciate the need for precision, but my goal here is conceptual clarification, not formal modeling. I'm using 'intervention' in the manipulability sense—changes to the data-generating process—rather than a specific calculus. The philosophical work is to show that *any* formal causal model presupposes this distinction between observation and intervention. I'm laying the groundwork for why Dave's tools work, not trying to improve the tools themselves."

  **Where It's Soft:**
  To a practitioner, this can sound like hand-waving. If Dave presses you on how to *identify* an intervention without a DAG, you might struggle to give a non-circular answer.

  ### 5. The "Prior Art" Objection
  **Who:** The Visiting Computer Scientist.
  **The Objection:** "In machine learning, we call this 'domain generalization' or 'covariate shift.' We've known for a decade that models fail when training and deployment distributions differ. It feels like you're presenting a known engineering problem as a novel philosophical solution."

  **Your Reply:**
  "You're absolutely right that the phenomenon is known in ML. My contribution isn't discovering the failure mode; it's linking it back to Goodman. The ML community treats this as a technical bug to be fixed with regularization or invariant risk minimization. I'm arguing this is the modern instantiation of the New Riddle of Induction. The payoff isn't telling you how to fix the model; it's explaining why the 'bug' is actually a fundamental feature of inductive reasoning that Goodman missed."

  **Where It's Soft:**
  If they feel you're claiming credit for the ML insight rather than the philosophical synthesis, they may dismiss the payoff section as naive. Acknowledge their expertise generously.

  ### 6. The "Verbal Dismissal" Objection
  **Who:** The Emeritus.
  **The Objection:** "This whole debate is verbal. You're defining 'projectible' one way, Goodman another. No one has ever shown me a case where this distinction makes a real difference outside of philosophy seminars."

  **Your Reply:**
  "I understand the skepticism, but the ML case makes the difference empirical, not just verbal. When a classifier fails because it relied on snow backgrounds instead of wolf features, that's not a linguistic confusion; it's a system failure with real costs. My argument explains why that failure happens: the predicate wasn't robust to intervention on the background. That's a substantive claim about how prediction works, not just how we define words."

  **Where It's Soft:**
  He may retort that "robustness" is just another word you're defining to suit your thesis. He's unlikely to be swayed by ML examples if he dismisses the field.

  ### 7. The "Epistemic Access" Objection
  **Who:** Dave or Supervisor.
  **The Objection:** "Even if you're right, how do we know which predicates are intervention-sensitive before we intervene? If we need to intervene to know if a predicate is projectible, but we need projectible predicates to plan the intervention, you've got a circularity problem."

  **Your Reply:**
  "It's not all-or-nothing. We start with local, low-level interventions—touching, moving, measuring—that are themselves grounded in basic sensorimotor capacities. We build up to complex projectibility from there. It's a bootstrap process, not a foundationalist one. We don't need to know everything is stable; we just need enough stability to get started."

  **Where It's Soft:**
  This invites a regress worry. If the basic sensorimotor capacities are themselves subject to the New Riddle, you haven't fully escaped the circle.

  ### 8. The "Normative Gap" Objection
  **Who:** Priya.
  **The Objection:** "Why *should* we care about interventions? Maybe I just want to predict the future based on passive observation, like an astronomer. I don't need to manipulate the stars. Why is intervention-sensitivity the gold standard for projectibility?"

  **Your Reply:**
  "Because passive observation is always a subset of possible interventions. Even the astronomer relies on the assumption that their telescope's position doesn't alter the light they receive. That's an intervention claim (setting the instrument to zero effect). If you can't distinguish between features that hold under observation versus those that hold under manipulation, you can't trust your passive data either. Intervention-sensitivity is the stricter condition that guarantees passive reliability."

  **Where It's Soft:**
  There are cases where causal knowledge is impossible but prediction is still valuable (e.g., certain medical prognoses where intervention is unethical). Your theory might imply these aren't "projectible," which is a hard sell.

  ---

  ### General Advice for the Session
  *   **On the Supervisor:** Don't try to beat Hume at his own game. Acknowledge the debt, but insist that the *context* of science has changed since the 18th century. We know more about causality now.
  *   **On the CS Visitor:** Defer to their technical expertise. Frame your work as "interpreting" their results philosophically, not "teaching" them ML.
  *   **On the Emeritus:** Don't get bogged down. Agree that verbal disputes are a risk, but point to the empirical costs of getting it wrong (the ML failures).
  *   **On American English:** I have ensured all spelling above follows American conventions (e.g., *generalization*, *color*, *defense*, *modeling*) so you can copy-paste directly into your notes.

  Good luck on Thursday. You've got a solid core argument; just keep your defenses tight on the metaphysical commitments.
