answer: |-
  Good evening. For those of you who don't know me, I'm [Name], the Maid of Honor and [Bride]'s sister.

  For those of you who *do* know me, you know I was worried about this speech. Specifically, I was worried about the audience split. About half of you are family who think "neural network" is a type of garden trellis. The other half are researchers who could tell me the exact sparsity of my emotional vocabulary just by looking at my facial micro-expressions.

  Writing a toast for this room felt like walking a wire. Because if I get too technical, Uncle Bob falls asleep. But if I get too simple, Table Four—the interpretability folks—will start auditing my metaphors for conceptual leakage.

  But mostly, I was stuck because of the couple standing in front of me.

  [Bride] and [Groom] met four years ago at a conference. Not at the bar, not on the dance floor. They met at a whiteboard at 1:00 AM. And the argument they started that night is the same argument they're having now.

  [Bride] believes that when you find something true—whether it's a pattern in data or a feeling in a relationship—you are *discovering* something that was already there. She thinks love is like a gene: it exists, we just locate it.

  [Groom] believes that when you find something true, you are *building* a tool that helps you navigate the world. He thinks love is like a map: it's useful because of how we draw it, not because the territory demanded it.

  For four years, neither has moved. And usually, in a relationship, a stalemate is a warning sign. It suggests drift. It suggests you're stuck.

  But watching them, I've realized that in this specific case, the stalemate isn't a bug. It's the architecture.

  I spent a long time trying to figure out how to toast to a marriage where the two partners disagree on the fundamental nature of reality. I can't tell you that "the truth is somewhere in the middle," because they both hate that, and frankly, so do I. I can't tell you that this toast *makes* their love true, because [Bride] would roll her eyes and say I'm just describing what's already there, and [Groom] would smile and say I'm trying to steer the narrative, and they'd both be right, and we'd be here all night.

  So, I'm not going to talk about what their love *is*. I'm not going to talk about what their love *does*.

  I'm going to talk about what their love *survives*.

  In their work, they look for things that remain stable even when you change the conditions. They look for invariants. And that is what I have seen for four years.

  I have seen them disagree about everything. I have seen them argue about the nature of truth over breakfast. I have seen them debate the ontology of a feeling while driving to the airport.

  But I have also seen that when [Bride] is tired, [Groom] knows exactly how to help, regardless of whether he thinks he's "fixing" a problem or "supporting" a system. I have seen that when [Groom] is uncertain, [Bride] knows exactly what to say, regardless of whether she thinks she's "revealing" a fact or "offering" a perspective.

  The explanation changes. The outcome doesn't.

  To the family in the room: You don't need to understand the math to see the result. The result is that they make each other sharper, kinder, and more alive.

  To the researchers in the room: You know that robustness is the only metric that matters when the distribution shifts. And life is nothing if not a distribution shift.

  [Bride], you found something real. I see it.
  [Groom], you built something useful. I see it.

  And because you both refuse to let the other off the hook on the "why," you never take the "what" for granted. You don't assume the map is the territory, and you don't assume the territory speaks for itself. You keep checking. You keep arguing. You keep looking at the whiteboard.

  So, I am not going to ask you to agree. I am not going to ask you to resolve the tension. I am asking you to keep the tension exactly where it is. Because it turns out, the thing that holds up under pressure isn't the answer. It's the question you ask together.

  Please raise your glasses.

  To the invariant. To the argument that keeps you honest. And to the life you are both discovering and building, starting tonight.

  To [Bride] and [Groom].
