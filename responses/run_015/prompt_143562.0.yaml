answer: |-
  Subject: Re: Audit of position set on interpersonal utility comparisons

  Hi there,

  This is a solid set of positions and you have good instincts about where the friction lies, though I think you are worrying about one thing too little and another thing too much. I will walk through the tensions in order of how much they actually cost you, starting with the most damaging practical inconsistency and moving down to the philosophical nuances that mostly just require careful terminology.

  The most significant tension by far is between your commitment to total utilitarianism and comparable welfare in points one and two versus your acceptance of unweighted willingness-to-pay in point five. Your suspicion here is correct and it is not just a vibe. Willingness-to-pay is fundamentally a measure of preference intensity scaled by ability to pay, which means it systematically weights the preferences of the wealthy more heavily than the poor. If you are a total utilitarian who believes a migraine is worse than a stubbed toe regardless of who is experiencing it, then using unweighted willingness-to-pay as your policy metric will lead you to systematically violate your own ethical axioms by prioritizing the minor comforts of the rich over the severe suffering of the poor. This is the most costly inconsistency because it undermines the operational validity of your ethics in the real world. The least damaging revision here is to drop willingness-to-pay in favor of direct welfare metrics like QALYs or DALYs for policy work, which aligns with your view in point one. If you must keep willingness-to-pay for practical reasons, you would need to accept distributional weighting to correct for the marginal utility of money, but that forces you to give up your stance in point five that weighting feels like fudging the numbers. You cannot keep total utilitarianism, belief in comparable welfare, and unweighted willingness-to-pay all at once.

  The second most important tension is philosophical rather than practical, and it lies between points two, three, and four. You claim in point two that interpersonal comparisons of welfare are real and accessible, but in point three you claim there is no fact of the matter about the relative scale of two people's utility functions in the preference-satisfaction sense. This is a standard distinction between welfarism and preference satisfactionism, but it creates a problem for point four where you invoke Harsanyi. The Harsanyi impartial observer theorem relies on cardinal utility functions to perform the aggregation required for utilitarianism. If you hold that preference utility is merely ordinal and non-comparable across persons as per point three, you cannot run the Harsanyi aggregation unless you are aggregating the welfare from point two rather than the preference utility from point three. The risk here is equivocation on the word utility. If you mean welfare in point four, you are consistent with point two but inconsistent with the economist view in point three. If you mean preference utility in point four, you are inconsistent with point three's claim that such comparisons lack a fact of the matter. The least damaging revision is to strictly distinguish welfare from preference utility in your writing. You should clarify that Harsanyi works on cardinal welfare representations rather than raw preference orderings. By making this terminological fix, you give up the claim that economists are right about utility being purely behavioral in all contexts, but you preserve the core of your view that welfare is real while acknowledging preference data is limited.

  The tension you flagged between point one and point four regarding total versus average utilitarianism is largely a false alarm and costs you almost nothing. Your worry is that the Harsanyi move might quietly deliver average utilitarianism, but this usually only happens if you introduce variable population ethics where the probability of existing is part of the veil of ignorance. In a fixed population framework, which is the standard setting for Harsanyi, the impartial observer maximizes the sum of utilities, which is total utilitarianism. Your rejection of range-normalization in point four actually protects you here, because range-normalization is often what drives results toward average utilitarianism or gives disproportionate weight to those with narrow utility ranges. You do not need to revise point one or four to resolve this, but you should be prepared to explain that you are applying Harsanyi to fixed populations to avoid the Parfitian objections that lead to the repugnant conclusion debates. Since you already bite the bullet on the repugnant conclusion in point one, you are theoretically safe here, so you can keep both commitments without change.

  Finally, a small note on point six which supports point two. Your view that skeptics are giving up early is consistent with the rest of your framework provided you maintain the welfare versus preference distinction discussed above. If you argue that suffering can be numbered, you are talking about phenomenological welfare, not preference satisfaction. This is consistent with your rejection of the economist's impossibility results in point three as long as you specify that Arrow's theorem applies to preference aggregation, not welfare measurement. You do not need to change this view, but you should be aware that when you debate economists, you are talking past them unless you clarify that you are measuring experienced welfare rather than revealed preference.

  Overall, your position set is coherent enough for a reading group post provided you clean up the willingness-to-pay contradiction and tighten your definitions of utility versus welfare. The WTP issue is the only one that threatens to make your practical recommendations contradict your ethical foundations, so I would prioritize addressing that before you share this.

  Best of luck with the group.
