  I just spent an hour with my friend arging about whether Goodman's grue is just a definitional trick or an actual problem for induction. Can you describe the most important implications for how a working statistician should treat a newly invented, time-dependent label in a predictive model, not just the emerald thing, especially where the label changes which past observations count as positive?
