      *   **The Core Statistical Translation:** Define "Grue" in ML terms. It's a *time-leaked target definition*.
      *   **Implication 1: Stationarity Assumption Violation.**
          *   Models assume $P(Y|X)$ is stable.
          *   Grue labels make $P(Y|X, \text{time})$ the reality.
          *   *Advice:* Test for stationarity. If the label definition relies on a timestamp, you break the i.i.d. assumption.
