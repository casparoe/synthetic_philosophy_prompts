      *   *The Paradox:* All observed emeralds so far are green. Therefore, they are also grue. Induction suggests future emeralds will be grue. But "grue" after time $t$ means blue. So induction suggests future emeralds will be blue. But standard induction suggests they will be green. Contradiction.
      *   *The Statistical Translation:* It's a problem of *predicate projection*. Which features are projectable into the future? It highlights the danger of *data leakage* via time-dependent definitions and the instability of *concept drift*.

  3.  **Translate to Statistical/ML Practice:**
      *   A "Grue-like" variable is a feature or target definition that depends on the *time of observation* in a way that breaks stationarity.
      *   If the definition of $Y=1$ changes based on when the data was collected, the model learns a spurious correlation with time, not the underlying phenomenon.
