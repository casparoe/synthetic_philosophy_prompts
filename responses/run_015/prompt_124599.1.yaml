answer: |-
  Your observation is exceptionally sharp. You have identified a nuance that often escapes introductory economics and political philosophy: the distinction between a resource destroyed by *overuse* and a resource rendered useless by *defensive exclusion*.

  There is indeed an established concept that captures the structural outcome you describe, and a separate concept from game theory that explains the psychological motivation. Together, they define the phenomenon you are witnessing.

  ### 1. The Structural Concept: The Tragedy of the Anticommons

  The precise economic and legal term for the outcome you describe is the **Tragedy of the Anticommons**.

  Proposed by legal scholar Michael Heller in 1998, this concept is the mirror image of the "Tragedy of the Commons."
  *   **Tragedy of the Commons:** Too many people have the privilege to *use* a resource, and no one has the right to *exclude* others. Result: Overconsumption and depletion.
  *   **Tragedy of the Anticommons:** Too many people have the right to *exclude* others from a resource, and no one has an effective privilege to *use* it. Result: Underuse and fragmentation.

  In your garden example, when one group claims every plot to "protect their share," they are exercising a right of exclusion. If every group does this, or if the rules allow such preemptive claims, the garden becomes fragmented. The land exists (it is not depleted like the commons), but it cannot be used communally or efficiently because access is blocked by fragmented private claims. In the digital archive, applying restrictive licences to shared data creates an anticommons: the data exists, but the transaction costs or legal barriers to using it become so high that the resource is effectively wasted.

  ### 2. The Motivational Concept: The Security Dilemma

  The *Anticommons* describes the result, but it does not fully explain the *motivation* you observed (the genuine belief that one is acting in self-defence). For that, we look to International Relations theory, specifically the **Security Dilemma**.

  In political science, a security dilemma occurs when one state increases its military power for defensive purposes, but other states perceive this as a threat and respond by increasing their own power. The result is that everyone is less secure than before, despite no one initially wanting conflict.

  Applied to your school resources:
  1.  **Uncertainty:** Student A is unsure if Student B will overuse the garden.
  2.  **Preemptive Action:** To ensure their own access, Student A claims all the plots (arming themselves).
  3.  **Reaction:** Student B sees this as a hostile takeover and locks down the digital archive (counter-arming).
  4.  **Outcome:** The collective resource is partitioned and less useful to everyone, even though each actor believed they were merely protecting their liberty.

  ### 3. Distinguishing It from Related Concepts

  You asked how this differs from the standard explanations. Here are the boundary lines:

  | Concept | Primary Mechanism | Motivation | Outcome |
  | :--- | :--- | :--- | :--- |
  | **Tragedy of the Commons** | Right to *use* without exclusion. | Greed or immediate need ("I take this cow because it's here"). | **Depletion:** The resource is destroyed or consumed. |
  | **Historical Enclosure** | Right to *exclude* via power/law. | Profit or accumulation ("I fence this to sell the wool"). | **Privatisation:** The resource becomes private property; efficiency may rise, but access falls. |
  | **Free-Rider Problem** | Benefit without contribution. | Opportunism ("I'll eat the crop without planting"). | **Under-provision:** People stop contributing because others take without giving. |
  | **Defensive Anticommons** (Your observation) | Right to *exclude* via preemptive claim. | **Fear of loss** ("I fence this so you can't take it"). | **Fragmentation:** The resource remains but is locked away/underused due to barriers. |

  **Key Distinction from Enclosure:**
  Historical enclosure was often aggressive and profit-driven (landlords fencing common land to raise sheep). Your observation is *defensive*. The actors do not necessarily want to sell the plots or the data; they want to deny access to others to prevent perceived exploitation. It is enclosure driven by anxiety rather than ambition.

  **Key Distinction from Free-Riding:**
  The free-rider is the *threat* that the actors fear. The phenomenon you are describing is the *reaction* to that threat. The free-rider takes without giving; the defensive restrictor gives nothing (access) to prevent taking.

  ### 4. Defining the Boundary Conditions

  You asked if a term can be defined with specific boundary conditions, particularly regarding the genuineness of the fear and the creation of scarcity. We can define this phenomenon as **Defensive Fragmentation** (a synthesis of the Anticommons and Security Dilemma).

  For a situation to qualify as this specific phenomenon, rather than simple greed or standard enclosure, it must meet three conditions:

  **Condition 1: The Preemptive Nature (Temporal Boundary)**
  The restriction must occur *before* actual overuse by others has taken place. If the group locks the archive *after* someone stole data, that is punitive security. If they lock it because they *suspect* someone might, it is Defensive Fragmentation. The action is anticipatory.

  **Condition 2: The Justification of Preservation (Normative Boundary)**
  The actors must frame the exclusion as necessary to *save* the resource or protect their entitlement to it, rather than to extract profit. If they say, "I am locking this to sell access later," that is rent-seeking. If they say, "I am locking this so it isn't ruined by others," that is Defensive Fragmentation. The moral logic is preservation through exclusion.

  **Condition 3: Reflexive Scarcity (Causal Boundary)**
  This is the most critical edge. **The restriction must create the very scarcity it claims to solve.**
  *   If the resource was truly going to be depleted, and the restriction saves it, that is successful management (as described by Elinor Ostrom's work on governing the commons).
  *   If the resource was *not* going to be depleted, but the restriction makes it inaccessible, that is the tragedy you observed.
  *   *The Edge:* The concept applies even if the actors genuinely believe the threat is real. The defining feature is not their internal honesty, but the **objective outcome**: the barriers to access exceed the risk of overuse. The "defence" is more costly to the collective than the "threat."

  ### 5. Why This Matters

  You have identified a failure of **governance** rather than a failure of **human nature**.

  The standard "Tragedy of the Commons" suggests humans are naturally greedy and will destroy everything unless stopped. Your observation suggests humans are naturally *insecure* about resources and will lock them down unless they trust the governance structure.

  In your school's case, the garden and archive lack what political economist Elinor Ostrom called "graduated sanctions" and "collective choice arrangements." Because there is no trusted neutral authority to adjudicate disputes or limit claims, students revert to the Security Dilemma. They privatize the resource not because they want to be owners, but because they do not trust the commons to remain common.

  ### Summary

  The phenomenon you have observed is best described as a **Security Dilemma leading to a Tragedy of the Anticommons.**

  *   **It is not the Tragedy of the Commons:** The resource is not eaten; it is locked.
  *   **It is not standard Enclosure:** The motive is protection, not profit.
  *   **It is not the Free-Rider Problem:** That is the catalyst, not the outcome.

  The boundary condition lies in **reflexivity**: the concept applies when the defensive measures create a level of fragmentation that reduces the total utility of the resource below the level that would have existed had the feared overuse actually occurred. It is a scenario where the cure (exclusion) is more destructive than the disease (potential overuse).
