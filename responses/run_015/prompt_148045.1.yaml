  Then the residue report: what carries, what you had to fudge, and what has no counterpart in my vocabulary at all. My hunch is that everything carries, and that on my terms a transcendental argument just comes out as an estoppel — it settles who bears what in the dispute, not whether p is true — which feels like the same point as the old complaint that these argument at best establish that we can't help believing p. Tell me whether that means my vocabulary is too thin, or whether it's caught something real about the argument. Also: does law have a move here that philosophy doesn't, like declaring the skeptics challenge non-justiciable rather than answering it, and if so is that a cop-out or the honest version of the move?
