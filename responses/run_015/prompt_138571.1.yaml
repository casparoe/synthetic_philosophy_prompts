  ### Page 3: Theory Reveal (Distribute at 1:15)
  **The Mechanism**
  1.  **Wheel Spin:** 70% **Hi**, 30% **Lo**.
  2.  **Hi Sector:** Chance(Red) = 0.95. Lamp flashes with prob 0.90.
  3.  **Lo Sector:** Chance(Red) = 0.45. Lamp flashes with prob 0.20.

  **The Math**
  *   **Prior Chance:** $0.7(0.95) + 0.3(0.45) = 0.80$. (Matches the Box Label).
  *   **Conditional Chance (Lamp On):** $\approx 0.91$.
  *   **Conditional Chance (Lamp Off):** $\approx 0.56$.

  **Key Concepts**
  *   **Principal Principle:** $Cr(A | Ch(A)=x) = x$.
  *   **Admissible Evidence:** Information that tells you about the *chance* (like the Lamp), not the *outcome* (like a crystal ball).
  *   **The Lesson:** Defer to the *current* chance conditional on admissible evidence, not the prior printed chance.

