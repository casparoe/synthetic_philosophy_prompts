  ## Facilitator Notes: Predictable Failures & Fixes

  1.  **"I don't have precise credences."**
      *   *Fix:* "You don't need to feel it. Pick the number that would make you indifferent to a bet. If you're forced to pick, pick 0.8. Precision is a requirement of the game, not your psychology."
  2.  **"Stage 3 is just hunches."**
      *   *Fix:* Point to the Table. "This isn't a hunch. This is a published track record. Ignoring it is like ignoring a weather forecast because you 'feel' dry."
  3.  **"Why not 1.0 if the Lamp is 91%?"**
      *   *Fix:* "Because 9% of the time the Lamp lies (it's Lo sector). If you bet 1.0, you get 0 points on those rounds. 0.91 maximizes your score."
  4.  **The "One-Shot" Worry:**
      *   *Note:* You cannot solve this in the game. The game *is* repeated.
      *   *Script:* "The game shows you that respecting chance wins in the long run. The philosophical claim is that this respect is required *even if* there is no long run. That's the leap I'm asking you to take."
  5.  **Bayes vs. Deference:**
      *   *Question:* "Do they come apart?"
      *   *Answer:* In this game, No. $P(Red|Lamp)$ calculated from frequencies *is* the conditional chance. They come apart only with **inadmissible evidence** (e.g., if you saw the die before it landed). In that case, Bayes says 1.0, Chance Deference says 0.8 (if you ignore the peek). The Principal Principle requires you to ignore inadmissible evidence when deferring to chance, or rather, that chance is undefined relative to inadmissible evidence.
  6.  **Fourth Round (Adversary)?**
      *   *Recommendation:* **Drop it.** It introduces Game Theory (Minimax). If an adversary reads your card, the optimal strategy changes (randomize your report). This confuses the link between *Chance* and *Credence*. Keep the opponent "Nature".

  ## Math Verification (Stage 3)
  *   $P(Hi) = 0.7, P(Lo) = 0.3$.
  *   $P(R|Hi) = 0.95, P(R|Lo) = 0.45$.
  *   $P(L|Hi) = 0.9, P(L|Lo) = 0.2$.
  *   $P(L) = 0.9(0.7) + 0.2(0.3) = 0.63 + 0.06 = 0.69$.
  *   $P(R \cap L) = P(L|Hi)P(R|Hi)P(Hi) + P(L|Lo)P(R|Lo)P(Lo)$
      *   $= 0.9(0.95)(0.7) + 0.2(0.45)(0.3)$
      *   $= 0.5985 + 0.027 = 0.6255$.
  *   $P(R|L) = 0.6255 / 0.69 = 0.9065...$ (**Round to 91%**).
  *   $P(R|\neg L)$:
      *   $P(\neg L) = 0.31$.
      *   $P(R \cap \neg L) = 0.1(0.95)(0.7) + 0.8(0.45)(0.3)$
      *   $= 0.0665 + 0.108 = 0.1745$.
      *   $P(R|\neg L) = 0.1745 / 0.31 = 0.5629...$ (**Round to 56%**).
  *   **Difference:** $91 - 56 = 35$ points. (Satisfies >10 constraint).
  *   **Marginal:** $0.6255 + 0.1745 = 0.80$. (Satisfies 0.80 constraint).

  ## Pre-Commitment Protocol (To avoid fudging accusations)
  1.  **Stage 1 & 2:** Live Die. No pre-commitment needed, physics is the commitment.
  2.  **Stage 3:**
      *   Before the session, generate 10 pairs of (Lamp, Result) using Random.org with a specific seed.
      *   Print this list. Put it in an envelope.
      *   At 0:50, show the sealed envelope. Write the Seed URL on the board.
      *   At 1:15, open the envelope.
      *   This guarantees the correlations hold without you manually rigging dice in real-time.
