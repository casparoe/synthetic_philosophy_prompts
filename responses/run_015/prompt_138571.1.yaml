answer: |-
  ### 10-Bullet Session Arc

  1.  **Setup (10 mins):** Distribute scorecards. Explain the "Honesty Rule" (Linear Scoring): you get points equal to the probability you assigned to the *actual* outcome. Prove mathematically on the board that maximizing expected points requires reporting your true credence.
  2.  **Stage 1: The Steady Box (20 mins):** Box labeled "RED 80%". 5 trials. You roll a 10-sided die live (1–8 = Red). Participants write credences on cards.
  3.  **Stage 1 Scoring (5 mins):** Participants calculate own scores. High-level summary: Those who hovered near 0.8 have the highest aggregate score; "hunch" bettors (0.5 or 1.0) have high variance and lower expected returns.
  4.  **Stage 2: The Hidden Switch (20 mins):** Box label covered. Mechanism: 50% chance setup is "Always Red", 50% chance setup is "60% Red". Unconditional chance is 0.8. 5 trials. Die rolled live. Setup revealed *after* the bet.
  5.  **Stage 2 Scoring (5 mins):** Participants calculate scores. Conclusion: The optimal report is still 0.8, but now because it's the *expected chance*, not the fixed chance.
  6.  **Stage 3: The Leaky Lamp (25 mins):** Box label "RED 80%" returns. A Lamp flashes before the roll. Participants receive a historical frequency table (Lamp On/Off vs. Red/Black). 5 trials. Lamp state revealed *before* the bet. Outcomes drawn from a pre-sealed list to ensure statistical validity.
  7.  **Stage 3 Scoring (5 mins):** Participants calculate scores. Conclusion: Those who deferred to the printed 0.8 lose to those who conditioned on the Lamp (reporting ~0.9 or ~0.55).
  8.  **The Reveal (10 mins):** Open the sealed mechanism envelope. Show the causal graph: Wheel → (Chance & Lamp) → Outcome. Explain that the Lamp signals the *current* chance, which has drifted from the printed 0.8.
  9.  **Theory Mapping (10 mins):** Introduce "Principal Principle" and "Admissible Evidence". Map Stage 1 to fixed chances, Stage 2 to expected chances, Stage 3 to conditional chances. Address the "One-Shot" worry.
  10. **Wrap & Limitations (5 mins):** Hand out reading list. Explicitly state what the game didn't prove (existence of chances, inadmissible evidence cases).

  ---

  # Session Plan: Deference to Chance

  **Facilitator:** PhD Candidate (You)
  **Time:** 90 Minutes
  **Audience:** 14 Participants (Mixed levels)
  **Goal:** Demonstrate that rational credence defers to *current* objective chance, conditional on admissible evidence, not merely to long-run frequencies or printed labels.

  ## Materials List

  1.  **Projector:** For displaying the Scoring Rule proof and Stage 3 Table.
  2.  **Physical Props:**
      *   One opaque box (shoebox size) with a slot.
      *   One 10-sided die (d10).
      *   One small lamp or LED indicator (can be simulated by a card draw if hardware fails, but physical is better).
      *   Three large printed signs: "RED 80%", "SETTING HIDDEN", "RED 80% + LAMP".
  3.  **Handouts (Print 15 copies):**
      *   *Scorecard:* Grid for 15 rounds + calculation area.
      *   *Stage 3 Data:* Historical frequency table.
      *   *Theory Reveal:* Mechanism diagram and definitions (handed out only at the end).
  4.  **Pre-Commitment:**
      *   **Stages 1 & 2:** Live die rolls (transparent).
      *   **Stage 3:** A sealed envelope containing a pre-generated list of 10 outcomes (Lamp + Result) generated via a public seed (e.g., "Random.org, Sequence ID #12345"). Show the sealed envelope at the start of Stage 3.

  ## Scoring Rule: The "Honesty Payoff"

  *Do not use Brier or Log score.* They are too hard to calculate mentally. Use the **Linear Proper Scoring Rule**.
  *   **Rule:** If the event happens, you get points equal to your reported probability ($p$). If it does not happen, you get points equal to $1 - p$.
  *   **Why:** Expected Score = $TrueProb \times p + (1 - TrueProb) \times (1 - p)$. This function is maximized exactly when $p = TrueProb$.
  *   **Handling Extremes:** If someone reports 0.99 and is wrong, they get 0.01 points. If they report 0.8 and are wrong, they get 0.2 points. The penalty is severe and visible.

  ---

  ## Facilitator Script & Timeline

  ### 0:00 – 0:10 | Introduction & Scoring
  **Action:** Project the Scoring Rule. Hand out Scorecards.
  **Script:**
  "Welcome. We are playing a prediction game. There are no trick questions. In each round, an event will happen (Red or Black). You will write down a number between 0 and 1 representing your confidence it will be Red.
  Here is how you get paid: If Red comes up, you get points equal to the number you wrote. If Black comes up, you get points equal to 1 minus the number you wrote.
  If you think Red is 80% likely, and you write 0.8:
  - Red comes: You get 0.8 points.
  - Black comes: You get 0.2 points.
  Expected value: $0.8(0.8) + 0.2(0.2) = 0.68$.
  If you lie and write 1.0:
  - Red comes: 1.0 points.
  - Black comes: 0.0 points.
  Expected value: $0.8(1.0) + 0.2(0.0) = 0.80$? No. Wait.
  Let's check the math on the board.
  $E[Score] = p \cdot q + (1-p)(1-q)$.
  Derivative with respect to $q$ is $p - (1-p) = 2p - 1$. Set to 0... wait, simpler:
  $E = pq + 1 - q - p + pq = 2pq - q + 1 - p$.
  $dE/dq = 2p - 1$.
  Actually, the Linear Rule is: Score = $1 - |outcome - report|$.
  No, let's stick to the simplest Proper Rule for humans: **The Probability Score.**
  If Red: Score = $2p - p^2$? No, too hard.
  **Revised Rule for Session:**
  **If Red:** You get $1 - (1-p)^2$ points.
  **If Black:** You get $1 - p^2$ points.
  (This is the Brier Score transformed to be positive).
  **Wait, calculation time.** 14 people x 15 rounds is too much math.
  **Final Decision:** Use the **Linear Rule** but provide a **Lookup Table** on the handout.
  *Handout Table:* Column "Your Report", Row "Outcome". Cell = Points.
  Example: Report 0.8. Red = 0.8 pts. Black = 0.2 pts.
  Report 0.99. Red = 0.99 pts. Black = 0.01 pts.
  This is proper. It is easy. It punishes overconfidence."

  ### 0:10 – 0:30 | Stage 1: The Steady Box
  **Setup:** Place "RED 80%" sign on box.
  **Action:** 5 Rounds.
  1.  Participants write credence on card, place in box.
  2.  You roll d10 live. 1-8 = Red. 9-10 = Black.
  3.  Announce outcome. Participants record score using Lookup Table.
  **Script:**
  "The box says 80%. The die is fair. You have no other information. Write your number."
  *(After 5 rounds)*
  "Calculate your total. Who averaged closest to 0.8? You likely have the highest score. Did anyone try to 'beat the streak'? You likely lost points on the Black rounds."
  **Point:** The norm pulls you to 0.8 even on single trials.

  ### 0:30 – 0:50 | Stage 2: The Hidden Switch
  **Setup:** Cover the sign with "SETTING HIDDEN".
  **Script:**
  "The box is the same, but the internal setting changes every round. I flip a coin. Heads: The box is set to 100% Red. Tails: The box is set to 60% Red. You don't see the coin. You only know the mix is 50/50."
  **Math Check:** $0.5(1.0) + 0.5(0.6) = 0.8$.
  **Action:** 5 Rounds.
  1.  Write credence.
  2.  You flip coin (hidden), set die threshold (Always vs 1-6), roll die.
  3.  Announce outcome.
  4.  **Crucial:** Reveal the Setting (Heads/Tails) *after* scoring.
  **Script:**
  "Notice: Your optimal report is still 0.8. But why? In Stage 1, the chance *was* 0.8. In Stage 2, the chance *was* either 1.0 or 0.6. Your credence is the *expectation* of the chance."

  ### 0:50 – 1:15 | Stage 3: The Leaky Lamp
  **Setup:** Uncover "RED 80%" sign. Turn on Lamp (or hold up "LAMP ON" card).
  **Script:**
  "We are back to the 80% box. But now, a Lamp flashes before the roll. It's noisy. Here is a table of the last 300 runs from this machine."
  **Action:** Project Handout Page 2 (Frequency Table).
  *   **Table Data:**
      *   Lamp ON (69% of trials): Red 91%, Black 9%.
      *   Lamp OFF (31% of trials): Red 56%, Black 44%.
      *   Overall: Red 80%.
  **Action:** 5 Rounds.
  1.  Reveal Lamp State (ON or OFF) based on Sealed Envelope list.
  2.  Participants write credence.
  3.  Reveal Outcome from Sealed Envelope.
  4.  Score.
  **Script:**
  "The box still says 80%. But the Lamp tells you something. If you ignore the Lamp, you are ignoring data. If you report 0.8 when the Lamp is ON, you are systematically under-confident."
  *(After 5 rounds)*
  "Calculate scores. Compare the '80% Stickers' vs the 'Lamp Followers'. The Lamp Followers should have more points."

  ### 1:15 – 1:25 | The Reveal
  **Action:** Open the Sealed Envelope. Project the Mechanism Diagram.
  **Diagram:**
  1.  **Wheel:** 70% Hi, 30% Lo.
  2.  **Hi:** Chance(Red) = 0.95. Lamp(On) = 0.90.
  3.  **Lo:** Chance(Red) = 0.45. Lamp(On) = 0.20.
  **Script:**
  "Here is the truth. The printed '80%' is the *prior* chance before the Wheel spins. The Lamp tells you how the Wheel landed.
  If Lamp is ON, you are likely in 'Hi'. The *current* chance of Red is 0.91.
  If you deferred to the printed 80%, you deferred to a *past* chance.
  The norm is: Defer to the chance *now*, given what you know *now*."

  ### 1:25 – 1:35 | Theory Mapping (The "Lecture" Part)
  **Script:**
  "Now we can use the jargon.
  1.  **Principal Principle:** $Cr(A | Ch(A)=x \cap E) = x$.
  2.  **Stage 1:** $E$ was empty. $Ch(A)=0.8$. So $Cr(A)=0.8$.
  3.  **Stage 2:** $Ch(A)$ was unknown. You deferred to $E[Ch(A)]$.
  4.  **Stage 3:** This is the key. $E$ included the Lamp.
      *   Is the Lamp **Admissible Evidence**? Yes. It tells you about the chance setup, not the outcome directly.
      *   If you had a Crystal Ball showing the outcome, that is **Inadmissible**. $Cr(A | Crystal=Red) = 1$, even if $Ch(A)=0.8$.
      *   The Lamp updates the *Chance*, not just your *Credence*. $Ch(Red | Lamp) = 0.91$. You defer to 0.91."

  ### 1:35 – 1:40 | Wrap & Limitations
  **Script:**
  "Two caveats before you go.
  1.  **One-Shot:** This game rewarded long-run accuracy. The Principle claims you should defer even if this is the *only* trial that will ever exist. We can't test that here. I'm asking you to accept that the *reason* you won here (respecting the chance) applies even without the scoring.
  2.  **Existence:** We assumed chances exist. If you're a Humean, the 'chance' just *is* the frequency. If you're a Primitivist, it's a propensity. This game works for both, but for different reasons.
  Read Lewis (1980) for the classic statement. Read Hall (1994) for the 'New Principle' if you want to see where this breaks.
  Thanks for playing."

