      *   **Input:** A list of 7 specific beliefs + a specific policy proposal from a friend.
      *   **Specific Requests:**
          *   Check consistency between 1 & 2 (Funding vs. Delivery).
          *   Check consistency between 3 & 4 (Queue jumping vs. Price gouging).
          *   Analyze the "waiting-time guarantee" vs. "specialists leaving" dynamic.
          *   Rank tensions by severity.
          *   Suggest the single best revision for coherence.
