answer: |-
  # Taxonomy of Positions on Habitat Destruction and Wild Animal Suffering

  **Root Claim:** "Large-scale habitat destruction produces a net reduction in wild animal suffering."

  *   **Branch A: Claim Accepted** (Net suffering decreases)
      *   **Node 1 (Life-History Strategy):** "Is the projected welfare gain derived primarily from preventing the birth of offspring destined for density-independent juvenile mortality?"
          *   **Yes** ($r$-selected focus)
              *   **Node 2 (Demographic Compensation):** "Do remaining populations in refugia exhibit demographic compensation (increased reproduction or survival) that offsets the welfare reduction achieved by lowering overall numbers?"
                  *   **No** (Compensation absent)
                      *   **Leaf 1:** *Preventive Antinatalism*
                          *   **Commitment:** It is morally preferable to render a landscape sterile than to support a high-turnover population of short-lived organisms.
                  *   **Yes** (Compensation present)
                      *   **Leaf 2:** *Localist Reductionism*
                          *   **Commitment:** Moral accounting stops at the boundary of the destroyed tract, even if global suffering remains constant due to spillover effects.
          *   **No** ($K$-selected focus)
              *   **Node 3 (Source-Sink Welfare):** "Do survivors displaced into sink habitats experience lower welfare than they would in the destroyed source habitat?"
                  *   **Yes** (Survivors worse off)
                      *   **[Unoccupied Path]** (See analysis below)
                  *   **No** (Survivors better off or equal)
                      *   **Leaf 3:** *Displacement Optimism*
                          *   **Commitment:** Forcing territorial mammals into higher-density refugia reduces aggregate stress through forced social consolidation.

  *   **Branch B: Claim Rejected or Indeterminate** (Net suffering increases or is unclear)
      *   **Node 3 (Source-Sink Welfare):** "Do survivors displaced into sink habitats experience lower welfare than they would in the destroyed source habitat?"
          *   **Yes** (Significant spillover cost)
              *   **Leaf 4:** *Sink Suffering Thesis*
                  *   **Commitment:** A slow death via starvation in a marginal habitat is morally worse than a quick death during the initial destruction event.
          *   **No** (Spillover negligible)
              *   **Node 2 (Demographic Compensation):** "Do remaining populations in refugia exhibit demographic compensation that offsets the welfare reduction achieved by lowering overall numbers?"
                  *   **Yes** (Rapid rebound)
                      *   **Leaf 5:** *Dynamic Equilibrium View*
                          *   **Commitment:** Conservation efforts that maintain carrying capacity inadvertently breed future suffering by maximizing population throughput.
                  *   **No** (Numbers remain low)
                      *   **Leaf 6:** *Mortality Regime Absolutism*
                          *   **Commitment:** The specific mode of death caused by destruction is intrinsically worse than natural mortality, regardless of the aggregate number of deaths.

  ***

  ### Taxonomic Analysis

  **1. Overlapping Leaves**
  **Leaf 1 (*Preventive Antinatalism*) and Leaf 2 (*Localist Reductionism*)** cannot be cleanly separated in practical application. Both positions rely on the same empirical premise regarding $r$-selected life histories (that preventing birth is a welfare gain). The divergence rests solely on the moral weight assigned to demographic compensation occurring outside the immediate tract boundaries. In a contiguous ecosystem where "refugia" are adjacent to the destruction site, the empirical distinction between "local reduction" and "global offset" dissolves, rendering the two positions functionally identical despite their theoretical disagreement on moral accounting boundaries.

  **2. Unoccupied Logical Combination**
  The path **Branch A (Claim Accepted) → Node 1 (No) → Node 3 (Yes)** is unoccupied. This combination represents a respondent who believes suffering is reduced, yet denies that the reduction comes from preventing juvenile mortality ($r$-strategy) and admits that displaced adult survivors are worse off in sink habitats ($K$-strategy/spillover). This position is **incoherent**. If the welfare gain does not come from the "never-born" (Node 1: No) and the "survivors" are suffering more (Node 3: Yes), there is no remaining mechanistic variable to justify the claim that aggregate suffering has decreased. It is unoccupied because no consistent ethical framework can support a net reduction conclusion when both primary demographic channels (births and survivors) indicate a welfare loss.

  **3. Ecological Distinctions Key**
  *   **Node 1** operationalizes **Life-history strategy**, distinguishing between welfare calculations dominated by juvenile mortality ($r$) versus adult displacement ($K$).
  *   **Node 2** operationalizes **Mortality regime and demographic compensation**, testing whether density-dependent feedbacks in refugia negate the initial reduction in population size.
  *   **Node 3** operationalizes **Source-sink welfare spillover**, assessing whether the spatial redistribution of survivors incurs a hidden per-capita welfare cost.
