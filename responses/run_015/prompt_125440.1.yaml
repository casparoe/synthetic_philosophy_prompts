answer: |-
  Yes, this has a name: it is the Knobe Effect, also known as the Side-Effect Effect, and it describes the phenomenon where moral valence influences folk psychological attributions of intentionality, knowledge, and desire.

  The effect was identified in 2003 by Joshua Knobe using a vignette almost identical to your solvent case: a CEO is told a new program will increase profits but either harm or help the environment; the CEO says he doesn't care about the environment, only profits. When the environment is harmed, most people say the CEO harmed it intentionally; when helped, most say he did not help it intentionally, despite the mental state being identical in both stories. Your observation matches this precisely in structure and outcome. The "carving" of this concept is specific: it applies to *side effects* that are foreseen but not the primary goal, and it specifically targets *folk attributions* (what ordinary people say) rather than legal or technical definitions of intent. It is not merely about blame distribution; it is about how moral judgment penetrates basic cognitive categories like "knowing" and "doing."

  Regarding your specific note on foresight: while the classic Knobe Effect focuses on intentionality, subsequent work in the same vein has confirmed your observation that knowledge attributions flip too. This is sometimes distinguished as the Epistemic Side-Effect Effect. In the "help" scenario, people are significantly less likely to agree that the agent *knew* the outcome would occur, often downgrading it to "thought it might" or "guessed," whereas in the "harm" scenario, they affirm the agent knew it would happen. This matches your pub findings where the gap shrank when you forced a definition; asking for definitions forces people into a more analytical mode that suppresses the intuitive moral reflex driving the asymmetry.

  Your hypothesis—that the notion of "on purpose" is a tool for praise or blame rather than a neutral description—is one of the two leading explanations for why this happens, often called the Moral Judgment Account. It holds that people decide blame first, then adjust their view of the mind to fit the blame. The competing view, the Conceptual Competence Account, argues that moral badness is actually part of the deep conceptual structure of what we mean by "intentional," so it isn't a bias but a feature of the concept itself. You are not muddling intention with foresight; the literature suggests ordinary language muddles them together, and moral valence is the switch that separates them. Your pub experiment is not worthless; it demonstrates that the effect is sensitive to reflective scrutiny, which supports the idea that it is an intuitive heuristic rather than a rigid logical rule.

  I am solid on the identification of the phenomenon and the robustness of the effect across cultures and age groups (it does appear in children and non-English speakers, though the magnitude varies). I am extrapolating slightly on the specific "foresight" variation being as universally replicated as the intentionality version, though the consensus is that moral valence affects epistemic attributions similarly. I am speculating on which theoretical explanation (your hypothesis vs. the conceptual one) is ultimately correct, as that remains an active debate in the field with no settled verdict. Your cases are parallel enough for the comparison to hold; the asymmetry you found is the feature, not a bug in your experimental design.
