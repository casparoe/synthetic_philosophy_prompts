answer: |-
  ## Executive Summary: Verdict on Your Wrinkles

  1.  **Two Rounds (Epistemic vs. Reputational):** **Keep.** This is the strongest part of your design. It cleanly separates *informational cascades* (I think you know something I don't) from *reputational cascades* (I want to be on the winning team). The behavior looks identical; the incentives differ.
  2.  **Token Buy-In (Pay for Signal/Hiding):** **Cut.** This breaks the flow and adds mechanism-design noise without adding pedagogical value.
      *   *Why:* In a true cascade, private information has zero expected value once the public history outweighs your signal. Paying for it is irrational. Paying to *hide* your move turns the public record into a market good, which shifts the lesson from "herding" to "public goods provision." It requires accounting overhead that will eat 15 minutes of your 90.
      *   *Fix:* Replace with the **Reputational Round** payoff structure. That captures the "cost of being the odd one out" without token accounting.
  3.  **Post-Reveal Betting:** **Keep.** This is crucial for demonstrating that the public record is *opaque*. You cannot infer the *strength* of the underlying evidence from the *uniformity* of the public guess.
  4.  **Role for "Knowers":** **Keep, but rename.** Call them **Auditors**. They do not play. They record the public sequence and are tasked with identifying the "Cascade Point" (the moment private signals stopped affecting public guesses).

  ---

  ## The Protocol: "The Urn Game"

  **Time:** 90 Minutes
  **People:** 20 (4 groups of 5 players + 1 Auditor per group)
  **Materials:**
  *   4 Opaque bags/urns.
  *   Chips/Slips: 2 Red, 1 Blue per bag (2/3 majority). *Note: 2/3 is standard. If you want more wrong cascades, use 55/45, but 2/3 feels less like "random noise" to players.*
  *   Whiteboard: Divided into 4 columns (one per group).
  *   Printed Score Sheets (one per player) & Auditor Clipboards.
  *   Timer.

  ### Setup (20 mins)
  1.  **Room:** Arrange 4 tables. 5 players sit in a row at each table (Player 1 to 5). 1 Auditor sits to the side with a view of the players and the whiteboard.
  2.  **Secret Prep:** Prepare the 4 bags. For the game to work, **all 4 bags must contain the same majority color** (e.g., all Majority Red). This ensures that if a group guesses Blue, they are objectively wrong despite following the rules.
  3.  **Handouts:** Give players the Score Sheet. Give Auditors the Rules & Audit Sheet.
      *   *Constraint:* No talking. No eye contact intended to signal. Pass chips back to the bag after drawing.

  ### Round 1: The Epistemic Cascade (25 mins)
  **Goal:** Demonstrate informational herding.
  **Payoff:** 1 Point for guessing the Majority Color correctly. 0 for wrong.
  **Mechanic:**
  1.  Player 1 draws a chip (private), looks at it, puts it back.
  2.  Player 1 announces "Red" or "Blue" loudly. Auditor writes it on the Whiteboard.
  3.  Player 2 draws, looks, hears P1's guess, announces.
  4.  Repeat down the line.
  5.  **Auditor Task:** Mark on their sheet where they think the "Cascade" started (where a player ignored their private signal to match the public history).

  *Facilitator Note:* If all 4 groups get it right (likely), proceed to Round 2 immediately. If one group gets it wrong, highlight that group on the board but do not explain why yet.

  ### Round 2: The Reputational Cascade (25 mins)
  **Goal:** Demonstrate reputational herding (Keynesian Beauty Contest overlap).
  **Payoff:** 1 Point for guessing Correctly **PLUS** 1 Point if your guess matches the **Majority of your Group's guesses**.
  **Mechanic:**
  1.  Reset bags (shake well). Same Majority Color as Round 1 (e.g., Red).
  2.  Same sequential announcement.
  3.  **The Twist:** Players now have an incentive to ignore a private "Blue" signal if the public history is "Red, Red," not just because they think Red is more likely, but because matching the group guarantees them a point even if the urn is actually Blue.
  4.  **Auditor Task:** Again, mark the Cascade Point. Note if it happens *earlier* than Round 1.

  ### The Audit & Betting (15 mins)
  **Goal:** Demonstrate opacity of the public record.
  **Mechanic:**
  1.  Reveal the true Majority Color (Red).
  2.  Point to a column on the whiteboard that went "Red, Red, Red, Red, Red."
  3.  **The Bet:** Ask the room: "Looking *only* at this public record, what is the probability the urn was actually Red?"
      *   Most will say "High."
      *   Reveal: "In a cascade, this sequence is equally likely to happen if the urn is Blue (if the first two players drew Blue but guessed Red, or drew Red and guessed Red)."
      *   *Math:* Once a cascade locks, the public record stops accumulating information. The probability stays frozen at the point the cascade started.
  4.  Ask Auditors to reveal where they marked the Cascade Point. Compare across groups.

  ### Debrief (25 mins)
  (See script below).

  ---

  ## Debrief Script: Mapping Moments to Theory

  **1. The "Click" Moment (Informational Cascade)**
  *   **The Moment:** Player 3 draws Blue, sees "Red, Red" on the board, and says "Red."
  *   **The Theory:** This is the Bikhchandani-Hirshleifer-Welch (BHW) model.
  *   **The Feature:** Player 3 is acting *rationally*. Their private signal (1 bit) is outweighed by the public history (2 bits).
  *   **The Trap:** Player 4 now sees "Red, Red, Red." They think this represents *three* private signals. It only represents *two*. The third was a copy. Information is lost, but the *appearance* of information grows.
  *   **Limitation:** In the real world, signals are rarely independent. If Player 1 and 2 read the same news source, their signals are correlated. The cascade starts faster than the math predicts.

  **2. The "Safety" Moment (Reputational Cascade)**
  *   **The Moment:** Round 2, where a player says "Red" despite a "Blue" draw, explicitly to match the group bonus.
  *   **The Theory:** Scharfstein & Stein (1990) / Keynesian Beauty Contest.
  *   **The Feature:** The behavior is identical to Round 1 (saying "Red"), but the internal calculation is different. It's not "I think Red is true," it's "I want to be on the Red team."
  *   **The Trap:** From the outside (the Whiteboard), Round 1 and Round 2 look identical. You cannot distinguish an informed consensus from a safety-seeking consensus.
  *   **Limitation:** Real-world reputation is multi-dimensional and long-term. In the game, it's one-off points. In reality, being the "contrarian who was right" can have higher long-term value than "conformist who was safe," which the game doesn't capture.

  **3. The Audit (Opacity)**
  *   **The Moment:** The betting phase where the room realizes they can't calibrate confidence from the sequence.
  *   **The Theory:** Path Dependence.
  *   **The Feature:** A cascade of 20 "Reds" is not stronger evidence than a cascade of 5 "Reds." Once the cascade locks, additional guesses add zero information.
  *   **The Trap:** We intuitively treat consensus volume as confidence. In a cascade, volume is just inertia.
  *   **Limitation:** In markets, price *does* aggregate some private info via volume/spreads. In pure verbal cascades, it does not.

  ---

  ## Epistemic Status: Settled vs. Contested

  **Settled (Lab Theory):**
  *   **Rationality of Herding:** It is mathematically rational to ignore your private signal if the public history is strong enough (BHW, 1992).
  *   **Fragility:** Cascades are fragile. A single credible public signal (a "shock") can break them.
  *   **Opacity:** An observer cannot distinguish a cascade from a consensus of independent signals using only the public record.

  **Contested (Real World Application):**
  *   **Prevalence:** How much real-world herding is informational vs. reputational?
      *   *View A:* Most is informational (people think others know more).
      *   *View B:* Most is reputational (people fear social sanction).
      *   *View C:* It's "bounded rationality" (people are just tired and copying is a heuristic).
      *   *Status:* Unresolved. The behavior is the same, making empirical separation nearly impossible without knowing internal payoffs.
  *   **Markets:** Do financial markets prevent cascades via price mechanisms?
      *   *Efficient Market Hypothesis:* Prices absorb private info, preventing cascades.
      *   *Behavioral Finance:* Bubbles *are* cascades. Prices can detach from fundamentals because traders are betting on *other traders* (Greater Fool Theory), which is exactly Round 2 of your game.
  *   **Science:** Does this explain the replication crisis?
      *   *Extrapolation:* Yes. If early high-profile papers (Player 1 & 2) show an effect, subsequent researchers (Player 3+) may unconsciously tune parameters to match the "public history" (citation cascade), even if their private data (raw results) suggests otherwise. This is an *informational* cascade where the "signal" is the published p-value, not the raw data.

  **What You Must Tell Them (The "Lie" of the Setup):**
  *   **Independence:** The game assumes Player 1's signal is independent of Player 2's. In reality, we all read the same Twitter feed. Correlated signals make cascades happen almost instantly.
  *   **Fixed Payoffs:** In the game, being right is always worth 1 point. In reality, being the *only* one right (contrarian) can be worth 100 points ( Soros betting against the Bank of England), which incentivizes breaking cascades. The game suppresses the reward for contrarianism.

  ---

  ## Pre-Mortem: What Will Go Wrong

  1.  **The "Clever" Programmer:**
      *   *Risk:* Someone realizes the 2/3 bias immediately and ignores their chip, just guessing the majority every time.
      *   *Fix:* In the intro, emphasize: "The urn bias is weak. Your chip is valuable." (Even if it's 2/3, the math holds). If they still game it, assign them as an Auditor.
  2.  **The "Talker":**
      *   *Risk:* Player 2 whispers to Player 3 "I got Blue."
      *   *Fix:* Auditors are empowered to disqualify a group's score if they catch side-communication. Make this explicit in rules.
  3.  **No Wrong Cascades:**
      *   *Risk:* With 2/3 bias, all 4 groups might guess correctly. The "Danger" lesson feels theoretical.
      *   *Fix:* If all groups are right, run a **Round 3 (Demonstration)**. You (Facilitator) act as Player 1 and 2. You *lie*. You draw Red but announce "Blue." Force the cascade to be wrong. Tell them afterwards: "This is what happens when early movers are overconfident or dishonest."
  4.  **Time Creep:**
      *   *Risk:* Counting points takes forever.
      *   *Fix:* Don't count points for prizes. There are no prizes. The "score" is for the Reputational Round mechanic only. Keep it abstract. "Who got max points? Raise hands." Move on.
  5.  **The "Knowers" Spoil It:**
      *   *Risk:* They whisper "It's a cascade."
      *   *Fix:* Give them the "Cascade Theory" handout *only* during the Debrief. Before that, they are just "Data Auditors."

  ## Why This Works for Your Room
  *   **Programmers:** They respect the algorithmic nature of the decision rule (If Public > Private, then Copy).
  *   **Grad Students:** They will latch onto the epistemic opacity (the betting phase).
  *   **No Projector:** The Whiteboard columns *are* the data visualization. It's tangible.
  *   **Rationality Vibe:** It doesn't preach "don't herd." It shows "herding is rational locally, catastrophic globally." That nuance is catnip for this crowd.

  ## Final Advice on the "Buy-In" Wrinkle
  You asked if the token mechanic adds noise. **It does.**
  It shifts the cognitive load from "What is the rational move?" to "What is the optimal bid?"
  The **Reputational Round** already captures the "cost of standing out."
  The **Audit** already captures the "public good value of information."
  Adding a token market turns a 90-minute psychology demo into a 3-hour mechanism design workshop. Cut it. The two-round structure is sturdy enough without it.
