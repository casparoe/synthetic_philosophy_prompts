  ### Precising Principles (6) and (8)

  You correctly identified these as loose. Here is how to tighten them to resolve the tensions.

  **Principle (6): The Updatelessness Constraint**
  *   **Current:** "Verdict... can't depend on the order in which I find things out."
  *   **Problem:** Too vague. EDT agents update on information.
  *   **Precisification:** "Rational choice is determined by the expected utility of the decision *algorithm* evaluated prior to receiving any case-specific information (Updateless Decision Theory)."
  *   **Why:** This explicitly licenses paying in the Mugging (Case 2) despite knowing the coin is Tails. It forces the abandonment of the "evidential gloss" in (1).

  **Principle (8): The Counterfactual Scope**
  *   **Current:** "Counterfactuals about the decision procedure I actually instantiate."
  *   **Problem:** "Actually instantiate" is ambiguous. Do I instantiate it now, or at the time of prediction?
  *   **Precisification:** "Counterfactuals track the logical output of my decision algorithm across all instances where that algorithm is run, including simulations by predictors."
  *   **Why:** This explains why you One-Box in Newcomb (your algorithm's output determines the box) and Don't Pay in XOR (your algorithm's output doesn't control the secret, only the letter condition). It distinguishes the logical dependence in Newcomb from the logical dependence in XOR.

