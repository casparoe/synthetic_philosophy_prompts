  **Rule B: Structural Anti-Careerism (The "Incentive" Rule)**
  *   **The Logic:** The problem isn't how you pick people; it's whether they can make a *career* out of it. If you remove the possibility of re-election, prior experience, and long-term dependency, the "political class" cannot form. Sortition is just the best tool to achieve this, not the only valid one.
