  ### 3. The Test Case

  To definitively distinguish between **Sortition Essentialism** (Method matters most) and **Structural Anti-Careerism** (Incentives matter most), you should propose the following case to the group:

  **The Proposal:** A unicameral legislature chosen by **sortition (lottery)**, serving a **single non-renewable 15-year term**, with full pay and full legislative power.

  **How this teases the rules apart:**
  *   **If Priya says YES:** She is a **Sortition Essentialist**. She prioritizes the *method of selection* above all else. She is willing to tolerate a 15-year "career" because the members were chosen randomly. This proves she cares more about *how* they got there than *how long* they stay.
  *   **If Priya says NO:** She is a **Structural Anti-Careerist** (or Anti-Ambition). She prioritizes preventing a professional political class above the selection method. She will argue that 15 years turns a citizen representative into a "professional sortition veteran" (echoing Verdict 6), regardless of how they were picked.

  **Why this works better than other tests:**
  You already know she rejects unpaid bodies (Verdict 3) and advisory bodies (Verdict 3). You already know she rejects renewable terms (Verdict 4 & 6). This test case keeps her preferred *method* (Sortition) and *compensation* (Paid) but pushes the *careerism* variable (15 years) to the breaking point.
