  **Rule C: The Anti-Ambition Filter (The "Behavior" Rule)**
  *   **The Logic:** The specific evil is *ambition*. Anyone who actively seeks power is disqualified from holding it. Sortition is good because it happens *to* you; elections are bad because you must *seek* them.
  *   **Criteria for "Yes":** Members should not have to campaign. Service should be a duty, not a goal.
  *   **Prediction for New Proposal:** **NO.**
  *   **Reasoning:** Even with a ban on prior officeholders, candidates must still campaign to win the election. The act of running signals ambition, which disqualifies the candidate under this rule.

