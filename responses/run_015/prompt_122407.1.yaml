answer: |-
  Good morning. It is appropriate that we are gathering here, surrounded by the boxes and folders of an archive. There is a specific kind of silence in a place like this. It is the silence of things that have been sorted. Every file label, every box number, every date range represents a decision about what belongs together and what belongs in the past. We come to archives to find stories, but we must acknowledge that the stories we find have already been shaped by the hands that filed them.

  As a journalist, I am trained to look for the through-line. When I write about science, I look for the narrative arc that connects a question to an answer, a hypothesis to a discovery. Audiences demand this. A story without a destination feels unfinished. But there is a danger in that demand, and it is a danger that affects everyone in this room, whether you spend your days in the laboratory, the classroom, or the library. The danger is the temptation to treat the destination as inevitable.

  We often hear this criticism described as Whig history. Usually, that term is used to scold us for being arrogant, for looking down on the past from the heights of the present. But I want to suggest that the problem is deeper than arrogance. It is structural. It is a habit of mind I call retrospective closure.

  Retrospective closure is the impulse to treat past conceptual disputes as if they were already settled by the categories we hold today. It is the assumption that the people who came before us were trying to do exactly what we are doing, only with worse tools and dimmer vision. When we do this, we do not just judge the past; we flatten it. We turn rival frameworks into primitive approximations of our modern consensus. We erase the fact that the losers of history were not always just wrong; sometimes, they were asking different questions entirely.

  Consider the history of thermodynamics. If you ask a physicist today to summarize the nineteenth-century debate over heat and energy, you will likely hear a story about the triumph of statistical mechanics. You will hear about the slow, hard-won realization that heat is motion, that entropy is probability, and that the atomic hypothesis was the key that unlocked the door. In this narrative, the path leads straight to us.

  But there was another tradition, the program of energetics. For a significant period, this was not a fringe view. It was a robust, coherent way of understanding the physical world. The proponents of energetics argued that energy transformation should be treated as primary, and mechanical explanation as derivative. They sought to build physics on the immediate givens of experience—energy flows and transformations—without committing to the existence of unobservable atoms.

  When we look at this through the lens of retrospective closure, energetics becomes a footnote. It becomes the "wrong" side of a bet we have already won. We say they were resistant to the atomic theory, and therefore they were obstacles to progress. But this erases the conceptual logic of their position. Energetics was organized around distinctions that do not map onto ours. It was not merely a clumsy attempt at statistical mechanics; it was a different ontology. It prioritized the continuity of processes over the discreteness of particles. To dismiss it as a failed stepping stone is to miss the fact that the victory of the atomic view was not a foregone conclusion dictated by nature, but a historical outcome secured by specific arguments, social alignments, and experimental successes that could have played out differently.

  Why does this matter to the practicing researchers in this room? It matters because the way you classify your own work is not a neutral reflection of reality. It is a historical inheritance.

  Take the distinction many of you draw between pure theory and engineering practice. We tend to view this as a natural division of labor. Theory provides the laws; engineering applies them. But if we avoid retrospective closure, we see that this boundary was itself a contested historical outcome. In the nineteenth century, the steam engine did not merely apply the laws of thermodynamics; the steam engine helped define what heat was. The engineers were not just users of knowledge; they were co-authors of the concepts. The separation between the abstract law and the working machine was fought over, negotiated, and eventually hardened.

  When you assume that this distinction is natural, you limit your imagination. You might assume that a theoretical problem must be solved with more mathematics, when historically, similar problems were dissolved by changing the material setup. You might assume that a conceptual dispute is a matter of truth versus error, when it might actually be a matter of competing priorities. If you view your categories as inevitable, you blind yourself to the contingencies that shape your current research. You stop seeing the walls of your own conceptual room.

  For the historians and philosophers here, the challenge is different but related. Your task is not simply to correct the record by adding more names to the roster of the forgotten. It is to resist the pull of the present in your own analysis. It is easy to write a history that vindicates the present, even when you are trying to be critical. When you frame a past debate as a precursor to a current one, you risk imposing a structure that the participants would not recognize.

  If we treat the energetics tradition merely as a lesson in how not to do science, we learn nothing new. We simply reinforce our current methods. But if we treat it as a live alternative—a way of organizing knowledge that was viable, coherent, and ultimately set aside—we gain a tool for thinking about our own moment. We begin to see that our own consensus might rest on choices that were not strictly determined by the data.

  This workshop is taking place in an archive, but I hope we do not treat the past as something that is dead and filed away. The point of avoiding Whig history is not to engage in a sentimental rescue mission. I am not asking you to "remember the losers" out of a sense of fairness. The dead do not need our fairness.

  I am asking you to recognize that avoiding retrospective closure is a method for keeping the future open. If the past was not a straight line leading to us, then the future is not a straight line leading away from us. The categories we use today—the split between theory and practice, the definition of what counts as an explanation, the hierarchy of disciplines—are not fixed features of the universe. They are the results of previous struggles. They are contingent.

  This should not be comforting. It is much easier to work if you believe your tools are the only tools that work. It is unsettling to realize that the ground beneath your feet was laid by people who could have laid it differently. But that unsettlement is necessary. It is the only way to ensure that we are not merely repeating the habits of the past while pretending we are discovering the future.

  Over the next few days, you will be looking at documents, discussing ideas, and arguing over interpretations. You will be tempted to tidy up the contradictions. You will want to make the narrative flow. I urge you to resist that urge. Let the contradictions stand. Let the dead ends remain dead ends without turning them into stepping stones.

  If we do this work correctly, we will not leave here with a cleaner story. We will leave with a more complicated one. We will leave with the understanding that the science we practice is not the only science that could have been practiced, and therefore, not the only science that can be practiced. That is not a call to relativism. It is a call to awareness. It is an acknowledgment that the structure of knowledge is built, not found.

  The archives around us are full of things that were once urgent and are now silent. Our job is not to make them speak our language. Our job is to listen to theirs, even when it disrupts our own. If we can do that, we might find that the history of science is not a record of how we got here, but a map of where else we might have gone. And if we can see those other paths, we might just find new ones opening up ahead of us.

  Thank you.
