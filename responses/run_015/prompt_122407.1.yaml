      *   *The Thermodynamics Example:* This needs to be precise. Don't just say "they were smart too." Say their categories were different. Energetics wasn't just bad statistical mechanics; it was a different ontology. Energy transformation primary, mechanics derivative. When we teach it now, we teach it as a stepping stone. That erases the logic of the time.
