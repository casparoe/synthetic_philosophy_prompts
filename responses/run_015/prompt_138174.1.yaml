answer: |-
  ### Slide 1: The One-Sentence Thesis
  **"Sphexishness is not behavioral rigidity, but the architectural inability to re-enter interrupted routines without resetting the stopping rule."**

  ---

  ### Pre-Emptive Concessions (First 5 Minutes)
  *Say these before you get to the meat. It disarms the predators.*
  1.  **The Wasp:** "We all know the Sphex anecdote is likely apocryphal or stylized. I'm using it as a logical limit case, not an entomological claim."
  2.  **The Engineering:** "Re-entry and exception handling are standard design patterns. I am not claiming this is magic code; I am claiming it is the variable that scales with what we call 'agency'."
  3.  **The Metaphysics:** "This does not solve the problem of ultimate responsibility. If you need contra-causal freedom, this talk won't give it to you."

  ---

  ### Q&A Prep Sheet: Objections & Replies
  *Ordered by Likelihood × Damage. Replies are scripted for ~2 minutes spoken.*

  #### 1. The "Redescription" Objection (Marion)
  **The Voice:** "This looks like guidance control. You've taken reasons-responsiveness, stripped the normativity, and bolted on engineering vocabulary. What work is 're-entry' doing that 'sensitivity to reasons' doesn't already do?"
  **The Reply:** "Two things. First, reasons-responsiveness is a *dispositional* claim—it says the agent *would* respond differently in a different world. I'm making a *structural* claim about what happens in *this* world when a sequence is broken. A reasons-responsive agent might still restart from zero; a re-entry agent resumes at step *n*. Second, the stopping rule. Standard compatibilism asks 'could they have done otherwise?' I'm asking 'can they revise the condition that tells them they're finished?' That shifts the focus from action selection to termination conditions, which explains why we can be reasons-responsive but still trapped in loops—like grading papers we know don't matter. You're tracking the output; I'm tracking the architecture that generates the halt signal."
  **Soft Spot:** I'm bluffing that this is a *hard* distinction. Marion can argue termination conditions are just another reason to respond to.

  #### 2. The "Trivial Implementation" Objection (Priya)
  **The Voice:** "I can write a `try/except` block that resumes state in an afternoon. If re-entry is just state preservation, your criterion for agency is far too cheap. A thermostat with a buffer has re-entry. Why isn't it an agent?"
  **The Reply:** "You're right that the pattern is cheap. The constraint isn't the existence of re-entry, it's the *grain* and the *cost*. A thermostat re-enters at the level of temperature set-points. A human re-enters at the level of 'why am I heating this room?' The difference is the number of meta-levels available for revision and the metabolic/computational cost of accessing them. My claim isn't that re-entry makes you an agent; it's that the *depth* of the re-entry stack correlates with the *degree* of agency. A thermostat has one level. You have many, but accessing the higher ones is expensive, which is why we default to sphexishness under stress. You've built the mechanism; I'm measuring the depth."
  **Soft Spot:** I don't have a principled metric for "cost" or "depth" yet. It's hand-wavy.

  #### 3. The "Ecological Validity" Objection (Animal Behavior)
  **The Voice:** "Re-inspecting a disturbed nest is adaptive. It's a robust heuristic against predators moving the cricket. What's your dependent variable? How do you distinguish 'sphexishness' from 'cautious verification' without just asserting the agent is wrong?"
  **The Reply:** "You're right that in the wild, the restart is often optimal. But the philosophical point of Sphex isn't the error; it's the *indefiniteness*. If you move the cricket ten times, does the wasp inspect ten times, or does it eventually flag the environment as 'unstable' and abort? The dependent variable is the *abortion threshold*. A non-sphexish agent tracks the *cost of the loop* against the *goal value*. If the inspection loop costs more than the nest is worth, a flexible agent abandons the goal. The wasp doesn't. I'm not saying verification is bad; I'm saying the inability to abandon a verification loop when it becomes counter-productive is the target."
  **Soft Spot:** Relying on a hypothetical "abortion threshold" that might be hard to observe in real-time.

  #### 4. The "Pathology" Objection (Grad Student)
  **The Voice:** "What about addiction or OCD? The agent sees the stopping rule is wrong ('I know this check is useless'), has the meta-cognition, but still can't revise. They have re-entry but no control. Your model breaks."
  **The Reply:** "It doesn't break; it predicts it. That's the 'degrees' claim. Agency isn't binary. The addict has the *architecture* for meta-revision—the insight is present—but the *cost* of accessing that level is pathologically high, or the lower-level loop is over-amped. They are partially sphexish. This explains why we hold them responsible in degrees. We don't treat them like wasps, but we don't treat them like fully free agents either. We treat them as agents whose re-entry mechanism is damaged. That fits our practices better than saying they 'lack free will' entirely."
  **Soft Spot:** Risks making the theory unfalsifiable. If they revise, it's agency; if they don't, it's 'damaged agency.'

  #### 5. The "Determinism" Objection (Hard Incompatibilist)
  **The Voice:** "This is decorative. Whether the agent restarts or resumes, the causal chain is closed. You haven't changed the moral responsibility question by one iota. No architecture gives you leeway."
  **The Reply:** "I agree I haven't given you leeway. I'm not trying to. I'm trying to give you a justification for our *practices* of holding responsible. We don't punish wasps because their architecture doesn't support revision. We punish humans because theirs does. If the architecture is deterministic but includes a high-cost revision loop, that physical fact is what grounds the practice. You want 'could have done otherwise' in a metaphysical sense. I'm offering 'could have processed otherwise' in a mechanical sense. For the law and for ethics, the mechanical fact is the only one that ever mattered."
  **Soft Spot:** Won't satisfy him. He wants metaphysical leeway, and I'm admitting I don't have it.

  #### 6. The "Regress" Objection (Philosophy General)
  **The Voice:** "You say there's no top level. But what makes the reviser non-sphexish? If the meta-level is also deterministic, you've just pushed the problem up a step. Who watches the watcher?"
  **The Reply:** "I bite the bullet: the watcher is also sphexish. There is no final self-certifying level. There are only levels that get progressively more expensive to run. The philosophical demand for a 'final' level is itself a sphexish demand for closure—it's wanting a rule that tells you when to stop applying rules. My claim is that agency *is* the regress. It's the capacity to keep going up the stack as long as the cost is bearable. When the cost gets too high, we stop and act. That stopping point isn't 'freedom'; it's just where the budget ran out."
  **Soft Spot:** Feels like dissolving the problem. Some will find this unsatisfyingly deflationary.

  #### 7. The "Terminology" Objection (General Annoyance)
  **The Voice:** "Why call it sphexishness? If it's just hierarchical control with stopping rules, why drag the wasp into it? It invites the empirical objections you just conceded."
  **The Reply:** "Because 'hierarchical control' sounds like success. 'Sphexishness' reminds us of the failure mode. We like to think we're above the wasp. I want a term that highlights that we do the same thing when the cost of meta-cognition gets too high. It keeps the humility in the room. But if it's too much baggage, call it 'termination rigidity.' The wasp is just the mascot."
  **Soft Spot:** None really. Just an aesthetic preference.

  ---

  ### The One Reply That Must Land
  **The Shift from Action to Stopping Rules.**
  If they leave thinking this is just about "doing different things when the world changes," you lose. You must hammer home: *"First-order flexibility is cheap. The real test is not changing the action, but changing the condition that tells you the action is complete."*
  If Marion or Priya miss this, interrupt gently: *"I think we're talking past each other. I'm not talking about selecting Action B instead of Action A. I'm talking about revising the rule that says Action A is finished."*

  ### The Question You Hope Nobody Asks
  **"If the cost of meta-revision is just another causal variable, isn't the 'decision' to revise just as determined as the 'decision' to restart? Where does the 'agency' enter the causal chain if not at the top?"**
  *Why it's dangerous:* It combines the Incompatibilist's determinism with the Regress worry. It forces you to admit that "agency" is just a label for a specific kind of causal complexity, which might feel like eliminativism to the room.
  *Prepared Exit:* "Agency isn't a break in the chain. It's the name we give to chains complex enough to model their own termination conditions. If that's eliminativism, I'm an eliminativist. But it's the only kind of agency that fits in a basement with a VGA projector."
