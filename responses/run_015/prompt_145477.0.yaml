  ### Reasoning for Top and Bottom Ranks

  **Top Rank: Formulation B**
  Formulation B best captures Williams's core insight because it embodies the phenomenological reality of the "one thought too many" objection. Williams argues that in cases of deep personal commitment (ground projects), the agent should not mediate their action through an impartial moral calculation. The spouse saves the partner *because* she is his wife, not because a calculation justifies it. Formulation B describes action springing directly from identity and attachment, rendering any subsequent justification merely narrative. This aligns with Williams's view that integrity consists in being constituted by these projects, rather than standing back to evaluate them as a neutral observer.

  **Bottom Rank: Formulation A**
  Formulation A most thoroughly dissolves integrity because it represents the precise utilitarian structure Williams critiques. By treating the partner's life as a fungible input in an aggregate welfare function, it requires the agent to adopt the "view from nowhere." This structure inherently alienates the agent from their commitments, as it demands that the specialness of the relationship be justified by its contribution to the general good. If the stranger produced slightly more utility, integrity would demand the partner be sacrificed. This total fungibility is the antithesis of Williams's concept of integrity, which relies on the *non-fungibility* of ground projects.

  ### Assessment of Formulation E

  Formulation E is **merely formulation A with an ad hoc parameter**, not a genuine synthesis of Williamsian integrity and consequentialist reasoning.

  While E attempts to accommodate the intuition of partiality by introducing an "epsilon" for irreplaceability, it retains the fundamental **calculative structure** that Williams identifies as the source of alienation. For Williams, the problem is not merely that utilitarianism gets the *weights* wrong (undervaluing the spouse); the problem is that it requires the agent to *calculate at all*. By converting the relationship into a variable ($\text{Utility} + \epsilon$) to be maximized, Formulation E still interposes a "thought too many" between the agent and the action. It treats the ground project as an instrument for maximizing a weighted sum rather than as a constitutive element of the self that operates outside the calculus. Thus, it preserves the consequentialist machinery that dissolves integrity, merely adjusting the dials to mimic the correct output.
