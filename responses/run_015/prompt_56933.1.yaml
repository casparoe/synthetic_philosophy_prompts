      *   *Conclusion:* Bring it back to lab practice.

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to dismiss Marco entirely. He's right about *operational* classification. Engineers *do* group by properties, not Z.
      *   *Correction:* Ensure the Oganesson physics is accurate. It is predicted to be solid and potentially reactive due to relativistic orbital contraction/expansion.
      *   *Nuance:* Nadia's "full stop" is too strong. Isotopes matter for physics, though less for chemistry. But Z is the primary driver.
