          *   *Lesson:* Immediate voting on personal sanctions in an emotional atmosphere leads to injustice/regret.
          *   *Supports:* Package 1 (cooling-off period for sanctions).
      *   *Episode 2 (Journal Deficit):* Eloquence overrode financial warning, long-term commitment.
