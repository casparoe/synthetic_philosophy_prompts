  3.  **Evaluate the Reform Packages:**

      *   *Package 1 (Modified Open Meeting):* Preserves tradition, adds safeguards. Addresses all three episodes directly. Less disruptive.
      *   *Package 2 (Sortition Assembly):* Radical. Solves self-selection bias (travel money/time). But reduces direct democracy. Might feel like a "coup" to the membership. 100 members is still a decent size, but excludes the "rank and file" from the final vote.
