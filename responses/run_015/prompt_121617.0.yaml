  # The Trolley Sorting Hat
  **Instructions:** Start at Node 1. Answer **Yes** or **No** based on what you would do. Follow the arrows.

  ### **NODE 1: The Standard Switch**
  A trolley heads toward five people. You stand by a lever. If you flip it, the trolley diverts to a side track where one person stands. That person dies; the five live. If you do nothing, the five die.
  **Do you flip the lever?**
  *   **NO** → Go to Node 2.
  *   **YES** → Go to Node 4.

  ### **NODE 2: The Injury Variant**
  Same setup as Node 1, but the one person on the side track survives with permanent, grave injuries (loss of limbs, etc.).
  **Do you flip the lever?**
  *   **NO** → Go to Node 3.
  *   **YES** → **LEAF A (The Skeptic):** You forbid killing but permit maiming to save the same five. *Diagnosis: Unattractive distinction.*

  ### **NODE 3: The Threshold**
  A trolley heads toward **five hundred** people. You can divert it to kill **one**.
  **Do you flip the lever?**
  *   **NO** → **LEAF B (The Absolutist):** Never actively harm an innocent to save others, regardless of numbers or severity.
  *   **YES** → **LEAF C (Numbers Win):** Forbidden at 5:1, permitted at 500:1. The numbers eventually outweigh the restriction.

  ### **NODE 4: The Footbridge Push**
  A trolley heads toward five. You stand on a bridge above the track next to a large stranger. If you push him off, he hits the track, stops the trolley, and dies. The five live.
  **Do you push him?**
  *   **NO** → Go to Node 5.
  *   **YES** → Go to Node 7.

  ### **NODE 5: The Loop**
  A side track loops back toward the five. One person stands on the side track. If you divert the trolley, it hits him. His body stops the trolley; the five live. If he were not there, the trolley would loop and kill the five.
  **Do you flip the lever?**
  *   **NO** → Go to Node 6.
  *   **YES** → **LEAF D (Death Produces Rescue):** You permit the Switch (Node 1) but forbid the Loop. *Distinction:* You allow diversion where the one's death is not what physically stops the threat, but forbid it where the death is the stopper.

  ### **NODE 6: The By-Product**
  You divert the trolley onto a weak bridge. The trolley crosses safely, but the bridge collapses onto a path below, killing one pedestrian. The five live.
  **Do you divert?**
  *   **NO** → **LEAF E (Direct Contact):** You permit the Switch (Node 1) but forbid the By-Product. *Distinction:* You require the threat to hit the one directly, not via a collapsing structure.
  *   **YES** → **LEAF F (Side-Effect):** You permit Switch and By-Product, but forbid Push and Loop. *Distinction:* You forbid cases where the one's body is used as a brake.

  ### **NODE 7: The Remote Push**
  Same as Node 4, but you press a button that opens a trapdoor beneath the stranger. He falls onto the track and stops the trolley.
  **Do you press the button?**
  *   **NO** → **LEAF G (Agent Initiation):** You permit the Push (Node 4) but forbid the Remote Push. *Distinction:* Physical contact by your own body is required for permission.
  *   **YES** → Go to Node 8.

  ### **NODE 8: The Sleeping Passenger (Your Case)**
  You are on a bridge. The only way to stop the trolley is to drop a sleeping passenger through a trapdoor. He falls, dies instantly without waking. No one else knows.
  **Do you drop him?**
  *   **NO** → **LEAF H (Pre-Existing Danger):** You permit Push/Remote (stranger was already a threat/bystander) but forbid Trapdoor (you moved a safe person into danger).
  *   **YES** → **LEAF I (Maximizing):** Save the five regardless of physical relation, initiation, or mechanism.

  ---

  ### **Handout Notes & Diagnostics**

  **1. The Empty Cell**
  *   **Combination:** **NO** on Node 1 (Switch) but **YES** on Node 4 (Push).
  *   **Diagnosis:** **Incoherent.** If you refuse to kill one to save five remotely, you cannot consistently permit killing one to save five personally. (Mark this cell as empty on your grid).

  **2. Indistinguishable Leaves**
  *   **Leaves:** **Leaf I (Maximizing)** and a hypothetical **High-Threshold Maximizer** (who says Yes to Push but No to 1,000,000:1).
  *   **Why:** This tree tests methods, not extreme numbers on the "Yes" branch.
  *   **Tie-Breaker Case:** **The Footbridge Million.** One stranger on the bridge; **one million** people on the track. Does the verdict change from Node 4?

  **3. Placement of the Sleeping Passenger Case**
  *   **Node:** **Node 8.**
  *   **Reasoning:** It functions as a tie-breaker for those who permit standard sacrifice (Node 4/7) but balk at *creating* the victim. It separates the **Maximizer** (who saves the five regardless) from the **Pre-Existing Danger** view (who only sacrifice those already in the zone of danger). It is a strong node because it removes "struggle" and "witnesses," isolating the moral weight of *moving* a safe person versus *using* a present one.

  **4. Constraint Check**
  *   No theoretical labels used.
  *   No forbidden words ("intend", "foresee", etc.).
  *   All nodes are concrete physical setups or consistency questions.
  *   Total Nodes: 8. Total Leaves: 9 (A-I). *Note: To strictly meet "5-7 leaves", combine Leaves E and F into one "Contact/Structure" leaf, or merge G and H.*
  *   *Correction for strict compliance:* **Merge Leaf E and F** into **"Relation-Contact"** (Forbids By-Product or Loop). **Merge Leaf G and H** into **"Relation-Initiation"** (Forbids Remote or Trapdoor). This yields **7 Leaves** (A, B, C, D, E/F, G/H, I).
