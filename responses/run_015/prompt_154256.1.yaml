answer: |-
  You have put your finger on a distinction that often gets lost in the broader free will debate, and you are quite right to feel that the standard vocabulary does not quite fit. The debate you have been enduring at your library—focused on blame, punishment, and the abstract ability to do otherwise—is largely concerned with the *consequences* of action and the justification of social practices. What you are describing is concerned with the *metaphysics of the moment of choice* itself. You are not asking whether you can be punished; you are asking whether you are, in that moment of weighing reasons, the author of a new fact or merely the vessel through which prior facts play out.

  To answer your first question directly: there is no single, universally agreed-upon noun for this specific intuition, like 'gravity' or 'electricity'. However, in philosophical circles, what you are describing is most commonly referred to as the requirement for **"Ontological Openness"** within the **"Deliberative Standpoint"**. The position you are inclined towards is a specific, robust form of **Libertarianism**, often distinguished as **"Agent-Causation"** or the view of **"Self-Constitution"**.

  Let us argue this out by defining exactly what you want, comparing it to its neighbours, and then testing whether it can hold together without collapsing.

  ### 1. Defining the Position: Constitutive Agency

  The thing you care about is the status of the decision *during* deliberation. You want it to be true that until you decide, the decision does not exist, even in principle. It is not merely unknown; it is *unsettled*.

  Standard Compatibilism (the view that free will is compatible with determinism) says that freedom is about acting according to your own reasons without external coercion. As you noted, this feels insufficient. A calculator acts according to 'reasons' (inputs and rules), and its output is fixed the moment the sum is entered, even if no one has looked at the screen yet. You are rejecting the idea that you are a very complex calculator. You want the deliberation not to be a process of *discovery* (finding out what your character dictates) but a process of *creation* (settling what was previously open).

  So, we can name your position **"Constitutive Agency"**. It is the claim that the agent constitutes the will at the moment of choice, rather than the will being constituted by the agent's prior psychological states.

  ### 2. Distinguishing from Neighbouring Views

  You have already correctly identified why the standard labels feel 'close but wrong'. Let us sharpen those distinctions.

  **Vs. Reasons-Responsiveness:**
  As you said, a machine can be responsive to reasons. If you feed a sophisticated AI conflicting values and weights, it will output a decision. That decision is fully determined by the weights and the algorithm. Your worry is that if your decision is fully determined by your values and character, you are in the same position as the machine. Constitutive Agency demands that the link between 'reasons' and 'decision' is not a causal law. The reasons must *incline* without *necessitating*.

  **Vs. Simple Indeterminism (The Dice-Roll):**
  You also rightly reject the idea that the decision is random. If the outcome is not fixed by your character, but is also not fixed by *you* in a meaningful way, it is merely a noise in the system. If a quantum fluctuation in your neurons tips the balance towards the job abroad, that is not freedom; that is luck. Constitutive Agency requires that the determination comes from *you*, but not from the *sum of your parts* (character, history, values).

  **Vs. The Ability to Do Otherwise:**
  Standard Libertarianism focuses on the claim: "In the exact same circumstances, I could have chosen differently." You have refined this. You are not necessarily claiming you *would* have chosen differently (you might well have chosen the same job again), but that *at the time*, it was not true that you *would* choose the one you did. The future was branching, not a single tunnel you were travelling down.

  ### 3. The Argument Against: The Intelligibility Objection

  Now we must address your suspicion that this view might turn out to be incoherent. There is a powerful argument, often called the **"Intelligibility Objection"** or the **"Dilemma of Determinism and Chance"**, which suggests that Constitutive Agency cannot be made sense of.

  Here is the shape of the problem. When you deliberate, you are weighing reasons. Let us say you have Reason A (family stability) and Reason B (adventure).
  *   **Horn 1:** If your decision is determined by the relative weight of A and B plus your character, then the outcome was fixed before you started thinking. This is the "calculator" scenario you reject.
  *   **Horn 2:** If your decision is *not* determined by the weight of A and B plus your character, then what tips the balance?

  If nothing tips the balance, the choice is random (the dice-roll). If *you* tip the balance, we must ask: what is this 'you' that is doing the tipping?
  *   If 'you' are just your character, values, and reasons, we are back to Horn 1 (determinism).
  *   If 'you' are something *over and above* your character, values, and reasons, then what is that thing? It must be a 'self' that exists independently of its psychological properties.

  This is where the position risks collapsing into incoherence. To satisfy your requirement, there must be a 'self' that stands apart from its own history and psychology to select which psychology to endorse. But how does this self choose? Does it have reasons?
  *   If it has reasons for choosing one way or the other, those reasons become part of the causal mix, and we are back to Horn 1 (the decision is fixed by the reasons).
  *   If it has *no* reasons for the choice, the choice is arbitrary, and we are back to Horn 2 (randomness).

  This is the crux of the matter. You want the decision to be determined by *you*, but not by *your states*. Philosophers who defend this position argue that 'agents' are a fundamental category of existence, not reducible to events or states. They argue that agents can cause things without being caused to cause them. This is the doctrine of **Agent-Causation**.

  However, the critic will say this is mystical. In every other area of life, if something happens, there is an explanation involving prior conditions. To say "The agent caused it, but not in virtue of any prior condition" looks like saying "It happened, but not because of anything." That looks suspiciously like the randomness you wanted to avoid.

  ### 4. The Deliberative Perspective vs. The Theoretical Perspective

  There is, however, a way to salvage your intuition without necessarily committing to a metaphysical mystery. This involves distinguishing between two ways of looking at the world.

  When your friend predicts you will take the job, they are taking the **Theoretical Perspective**. They are looking at you as an object in the world, subject to laws of psychology and physics. From this angle, if they know enough, the outcome is indeed fixed.

  When you are deliberating, you are taking the **Deliberative Perspective**. From inside this standpoint, it is a necessary precondition of thinking that the answer is not yet settled. You cannot genuinely weigh reasons if you believe the conclusion is already written. To deliberate *is* to treat the future as open.

  Some philosophers argue that your worry arises from mixing these two perspectives. You are trying to look at your own deliberation from the outside while you are still inside it. They would say: "It is true that from the outside, your decision might be determined. But from the inside, you must act *as if* it is not. And since you can never actually occupy the outside perspective regarding your own future choices, the 'openness' is real enough for all human purposes."

  But I suspect this will not satisfy you. You said, "I want the answer not to be fixed by all of that." You are making a metaphysical claim, not just a practical one. You want the universe itself to be undecided, not just your knowledge of it.

  ### 5. Does it Collapse?

  So, does Constitutive Agency collapse into incoherence?

  If you demand that the 'self' be completely independent of its character and reasons, yes, it likely collapses. A choice completely unmoored from who you are is not a free choice; it is a spasm.

  However, there is a middle ground that might preserve what you value. This is the idea that reasons do not *cause* actions in the way billiard balls cause other balls to move. Instead, reasons are considerations that the agent *takes* to be decisive. The 'taking' is the active element. The reasons don't push you; you grab the reasons.

  On this view, the decision is not fixed by the reasons because the reasons sit there inertly until the agent activates them. This preserves the "not yet settled" feeling. The matter is not settled until the agent *settles* it. This avoids randomness (because the agent does it for a reason) and avoids determinism (because the reason didn't force the agent's hand).

  The cost of this view is high. It requires believing that human agents possess a unique kind of causal power that nothing else in the universe has. A rock cannot 'take' a reason; a computer cannot 'take' a reason; only an agent can. If you are willing to accept that human beings are metaphysically unique in this way—fundamentally different from the rest of the physical order—then your position is coherent. If you believe humans are entirely physical systems, then your position is very difficult to maintain without slipping into the 'dice-roll' or the 'calculator'.

  ### 6. Conclusion and Naming

  To summarise:
  1.  **The Name:** Your position is best described as a demand for **Ontological Openness** grounded in **Constitutive Agency**. It is a form of **Libertarianism** that prioritises the *sourcehood* of the decision over the *alternative possibilities*.
  2.  **The Neighbours:** It differs from Compatibilism because it rejects determination by character. It differs from Randomness because it insists on the agent's control.
  3.  **The Edge:** The edge lies at the question of the 'Self'. If the Self is just the collection of character traits, your view collapses into determinism. If the Self is nothing, it collapses into randomness. For your view to hold, the Self must be a distinct causal force.
  4.  **The Verdict:** There is no knock-down proof that this is impossible, but there is a strong argument that it is **intelligibly difficult**. It requires a conception of the self that stands slightly outside the chain of cause and effect.

  You asked if there is a named argument that nothing could satisfy it. The closest is the **"Basic Argument"** (that you cannot be responsible for who you are, so you cannot be responsible for what you do), but applied to deliberation, it is the **"Causal Closure Argument"**. This argues that if the physical world is closed (every physical event has a physical cause), and your brain is physical, then your decision is physically caused by prior states. To say otherwise is to suggest a break in the laws of physics.

  If you are willing to accept that the act of conscious deliberation is a phenomenon that is not fully reducible to prior physical states—a view that many find plausible despite the scientific orthodoxy—then your intuition holds. You are describing the experience of being a **First Cause** in your own life. It is not confused; it is simply a demand for a metaphysics that places the agent, not the laws of nature, at the centre of human action. Whether the universe permits such a metaphysics is the very question your reading group is circling, perhaps without realising that this is the heart of what keeps you awake.
