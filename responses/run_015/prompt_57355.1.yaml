      Let's stick to the initial thought: Philosopher (Normative) is #1 because it makes the book useless for progress. Historian (Contingency) is #2 because it makes the book factually suspect.

      *Re-evaluating the "Must Land" answer:* It needs to bridge the gap. "We don't discard the tool; we acknowledge its double-edge."
