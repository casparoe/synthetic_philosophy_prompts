      *Refining Objection 4 (Historian/Econ):* Focus on the Ledger. The ledger predates the Enlightenment.
      *Refining Objection 5 (General):* Focus on Morality. It feels like cynicism.
      *Refining Objection 6 (Philosopher):* Focus on "Ideal." The ideal wasn't corrupted; it was ignored.
