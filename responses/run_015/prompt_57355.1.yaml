      *(Self-Correction during drafting)*: Make sure the "Novelist" aspect is respected. The user is defending a *thesis* advanced by a *book*. The pushback will be "You're a storyteller, not a sociologist." I need to ensure one objection touches on the limits of fiction as argument. Also, ensure the distinction between "hypocrisy" and "instrumentalism" is clear in the replies.

      *Refining Objection 1 (Philosopher):* Focus on the "baby with the bathwater." If we dump universalism, we lose the only tool we have.
      *Refining Objection 2 (Historian):* Focus on 1802. Napoleon's decision was political/military, not philosophical necessity.
