answer: |-
  The floodwaters had receded three weeks ago, leaving the community center in Oakhaven smelling of wet drywall and bleach. Dr. Elena Vance didn't mind the smell. It smelled like work. It smelled like data points.

  She adjusted her stethoscope and stepped toward the MediScan kiosk stationed at the triage entrance. It was a bulky thing, a relic of the state's emergency grant program, topped with a thermal camera and a microphone array.

  "Scan initiated," the bot droned. The screen flickered green. "Operator: Vance, E. Emotional Valence: Neutral. Motive Classification: Instrumental, not intrinsic. Accuracy: 80%."

  Elena didn't flinch. She swiped her badge and walked past the machine to Bay 4.

  The MediScan was supposed to monitor volunteer burnout. In practice, it was a nagging conscience made of plastic and bad code. It had been flagging her all week. *Instrumental.* It meant she was doing the right thing for the wrong reason. The bot wanted her to be helping because she *cared*. Elena was helping because she was optimizing.

  Ten years ago, she'd read a paper in the *Journal of Neurological Preservation*, circa 1998. Obscure, barely cited. It suggested that sustained altruistic behavior triggered a cascade of neurotrophic factors that protected against cognitive decline. Kindness, the paper argued, was a gym routine for the hippocampus. Elena wasn't here to save Oakhaven. She was here to keep her own mind from rotting before she turned sixty.

  "Next," she called.

  Marcus shuffled in. He was older, wearing a flannel shirt that had seen better decades. He held his left arm close to his chest.

  "Dr. Vance," he said. "Wrist is still throbbing."

  "Let's see." She palpated the swelling. "You're favoring it. Stop wrapping it so tight. You're cutting off circulation."

  She worked efficiently. Clean movements. No wasted energy. She wrote the prescription, handed him the referral slip, and turned to sanitize the table.

  "You know," Marcus said, not moving to leave. "That machine out there talks louder than you do."

  Elena paused, alcohol wipe in hand. "It's calibrated to detect stress markers."

  "It says you're helping us because it's good for *you*."

  Elena turned slowly. "It's eighty percent accurate, Marcus. It's wrong one time in five."

  "It's been wrong about the stress. But it hasn't been wrong about the motive. Not once." Marcus leaned against the doorframe. "I used to teach ethics. High school. I know the look of someone doing their duty versus someone doing their job."

  Elena tossed the wipe into the biohazard bin. "Does it change the outcome? Your wrist gets splinted. The clinic stays open. You get your meds."

  "It changes the weight of it," Marcus said. "If I give you a gift because I want something from you, is it a gift? Or is it a transaction?"

  "It's a transaction," Elena said. "But you still get the thing."

  "My granddaughter brought me soup yesterday," Marcus said. "She did it because she loves me. If she did it because she wanted my inheritance, I'd eat the soup, but I'd taste different."

  Elena leaned back against the counter. She was tired. Her brain felt foggy, which was ironic, considering this was supposed to be preventing exactly that. "I'm not hurting anyone, Marcus. I'm using the flood relief to maintain my own cognitive longevity. If I burn out, I can't help anyone. So I protect the asset. Me."

  "So we're just weights," Marcus said. "Dumbbells for your brain."

  "Beneficiaries," she corrected. "Look, if I waited until I felt a surge of intrinsic warmth every time I stitched a wound, I'd have quit three days ago. Compassion fatigue is real. This method... it's sustainable."

  Marcus looked at her, really looked at her. He saw the dark circles, the rigid posture, the way her eyes darted to the clock. He saw the effort it took to keep the machine running.

  "Sustainable for who?" he asked.

  "For the clinic," she said.

  "For you," he said. "You're treating kindness like a vitamin. You take it, you check the box, you hope it stops the decay."

  "Is that so bad?"

  Marcus sighed. He shifted his arm. "I don't know. In my class, we talked about Kant. He'd say you're not moral. You're just prudent. But then... I'm still healed. My grandkids still have a doctor who shows up when the roads are washed out."

  He stepped closer. "Maybe the reason doesn't matter to the person bleeding. Maybe it only matters to the person holding the bandage."

  Elena looked down at her hands. They were steady. "The bot says I'm instrumental."

  "The bot is a scanner," Marcus said. "It measures heat. It doesn't measure fire."

  He turned to leave, then stopped. "Thank you, Doctor. For the wrist. And for showing up. Even if it's just for the hippocampus."

  He walked out. Elena stood alone in the bay. The smell of bleach was overwhelming. She walked back out to the kiosk to clock out.

  She placed her hand on the scanner. The screen flickered. The fan inside whirred loudly, struggling against the humidity.

  "Scan initiated," the bot said. "Operator: Vance, E. Emotional Valence: High. Primary Emotion: Exaltation."

  Elena stared at the screen. She felt nothing. She felt hollowed out, scraped clean. There was no exaltation. There was only the quiet hum of the refrigerator and the ache in her lower back.

  She leaned in and tapped the diagnostic menu, something she wasn't supposed to do. The code scrolled past, green on black. She stopped at the emotion library lookup table.

  `ID: 4092 | Label: Exaustion | Vector: [0.8, 0.2, -0.5]`
  `ID: 4093 | Label: Exaltation | Vector: [0.8, 0.2, -0.5]`

  Someone had copied the vector values twice. A typo in the training data. A single letter difference in the label, but the machine couldn't tell the difference between being worn down and being lifted up.

  Elena stared at the word *Exaltation* glowing on the screen. It was wrong. It was a lie.

  She looked out toward the waiting room, where Marcus was helping his granddaughter into a coat. They were dry. They were safe.

  Elena hit 'Accept' on the scan.

  "Log saved," the bot chirped.

  She turned off the light and went home to rest her brain.
