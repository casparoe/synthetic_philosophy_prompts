  ### Axis 1: Protection from Bureaucratic Humiliation vs. Legal Claim Inflation
  **Tier 1: Dignity Culture**
  It lands here because it combines thick-skinned indifference to minor slights with reserved legal recourse for major rights violations, avoiding bureaucratic bloat.
  **Tier 2: Honor Culture**
  It takes this spot because it bypasses bureaucracy through self-help resolution, though it risks violent escalation instead of legal claims.
  **Tier 3: Victimhood Culture**
  It ranks last because it actively invites bureaucratic intervention for minor slights, turning everyday friction into formal grievances.

  ### Axis 2: Acknowledging Harm vs. Competitive Victim Status
  **Tier 1: Dignity Culture**
  It leads this axis because it grounds worth in intrinsic humanity, allowing harm recognition without trading moral capital for social status.
  **Tier 2: Honor Culture**
  It sits in the middle because it validates dignitary harm intensely but makes social standing a zero-sum competition based on reputation.
  **Tier 3: Victimhood Culture**
  It falls to the bottom because it centers moral authority on suffering, inevitably turning victimization into a scarce resource to be competed for.

  ### Hypothetical Application: The Forgiveness Credit Score
  **Adapts: Dignity Culture**
  Dignity cultures thrive here because their norm of ignoring insults aligns perfectly with a system that rewards quick forgiveness and moving on.
  **Collapses: Honor Culture**
  Honor cultures implode because forgiving a public insult is viewed as cowardice, meaning participants would rather tank their score than lose face.
  **Note on Victimhood:** Victimhood cultures would attempt to game the system through performative forgiveness, but ultimately struggle because their moral capital relies on the grievance persisting rather than being resolved.
