answer: |-
  ### The Sen Entitlement Tribunal Checklist

  **Purpose:** To determine whether a food crisis is a "Natural Disaster" (unavoidable supply shock) or a "Political Failure/Crime" (preventable entitlement collapse).
  **Core Logic:** Starvation happens when people lose the *ability to get food*, not just when food disappears.

  #### Step 1: The Aggregate Supply Check (FAD Screen)
  *   **Question:** Did total food production/availability in the region drop by more than 10-15% during the crisis period?
  *   **Sufficient Proof:** Government agricultural records, import/export logs, or credible historical estimates showing a massive drop in calories available per capita.
  *   **Decision Gate:**
      *   **NO (Supply was stable):** Move to Step 2. (This is a classic Sen Entitlement Failure).
      *   **YES (Supply crashed):** Move to Step 1b.
  *   **Step 1b: Cause of Supply Drop:**
      *   **Question:** Was the supply drop caused by weather/pests (Natural) or by human policy (e.g., forced collectivization, banning private plots, diverting labor)?
      *   **Decision Gate:**
          *   **Natural:** Move to Step 2 (Natural disasters can still be managed politically).
          *   **Policy:** Skip to Step 4 (This is a Political Failure by definition).

  #### Step 2: The Entitlement Mapping Check
  *   **Question:** Did specific groups starve while others in the same region remained fed?
  *   **Sufficient Proof:** Mortality data broken down by class, occupation, or region. Evidence that food was present in markets, warehouses, or neighboring districts but not consumed by the dead.
  *   **Decision Gate:**
      *   **NO (Everyone starved equally):** Likely a Natural Disaster (Stop here, unless Step 1b was Policy).
      *   **YES (Specific groups targeted/affected):** Move to Step 3.

  #### Step 3: The Exchange Entitlement Check
  *   **Question:** Did the starving group lose the ability to *buy* or *grow* food due to price spikes, wage collapse, or land seizure?
  *   **Sufficient Proof:** Inflation records (food prices rising faster than wages), records of land confiscation, or labor market collapse.
  *   **Decision Gate:**
      *   **NO:** Move to Step 4.
      *   **YES:** This indicates **Entitlement Collapse**. Move to Step 4.

  #### Step 4: The State Response Check
  *   **Question:** Did the government export food, refuse aid, suppress information, or prioritize military/urban needs over rural starvation?
  *   **Sufficient Proof:** Shipping manifests (food leaving the crisis zone), censorship records, denial of international aid, or budget allocations favoring non-essential sectors during the crisis.
  *   **Decision Gate:**
      *   **NO (State tried to help but lacked capacity):** Values Call (Negligence vs. Incompetence).
      *   **YES (State actively worsened access):** **Political Crime**.

  #### Step 5: The Democracy/Accountability Check (Sen's Final Filter)
  *   **Question:** Was there a free press or opposition allowed to report the famine while it was happening?
  *   **Sufficient Proof:** Censorship laws, arrest of journalists, or lack of election pressure.
  *   **Decision Gate:**
      *   **YES (Free Press existed):** Political Failure (Systemic Negligence).
      *   **NO (Information Suppressed):** **Political Crime**.

  ---

  ### Case Run-Throughs

  #### Case 1: 1943 Bengal Famine
  *   **Step 1 (Supply):** **NO.** Rice production was only slightly lower than previous years. Supply was sufficient.
  *   **Step 2 (Entitlement):** **YES.** Rural laborers and fishermen starved; urban elites and military were fed.
  *   **Step 3 (Exchange):** **YES.** War inflation spiked prices. Laborers' wages bought nothing. Speculators hoarded grain.
  *   **Step 4 (State Response):** **YES.** British colonial government prioritized military stockpiles, banned grain movement between provinces, and refused aid.
  *   **Step 5 (Accountability):** **NO.** Colonial rule, no voting power for Indians, censorship of famine news.
  *   **Verdict:** **Political Crime.** (Pure Entitlement Failure).

  #### Case 2: Irish Potato Famine (1845–1852)
  *   **Step 1 (Supply):** **YES (Natural).** The potato blight was a biological disaster.
  *   **Step 1b (Cause):** **Natural.** (Blight was not policy). *Move to Step 2.*
  *   **Step 2 (Entitlement):** **YES.** Landlords and export merchants remained fed; tenant farmers starved.
  *   **Step 3 (Exchange):** **YES.** Tenants lost the ability to pay rent or buy food as potatoes rotted.
  *   **Step 4 (State Response):** **YES.** Food (grain/livestock) was actively **exported** from Ireland to Britain under armed guard during the starvation. Relief works were insufficient.
  *   **Step 5 (Accountability):** **NO.** Ireland had limited representation in London; interests of British landlords prioritized.
  *   **Verdict:** **Political Crime.** (Natural trigger, but political lethality).

  #### Case 3: Great Leap Forward (China, 1958–1962)
  *   **Step 1 (Supply):** **YES.** Production collapsed massively.
  *   **Step 1b (Cause):** **Policy.** Communes, backyard steel (labor diverted from farms), and bad agricultural science caused the drop. *Skip to Step 4.*
  *   **Step 4 (State Response):** **YES.** State procurement quotas remained high despite crop failure. Grain was taken from peasants to feed cities/exported. Local officials lied about yields.
  *   **Step 5 (Accountability):** **NO.** Totalitarian control, no free press, criticism punished.
  *   **Verdict:** **Political Crime.** (Policy-Induced FAD + Entitlement Seizure).

  ---

  ### The Committed Take: Does Sen's Framework Hold?

  **Yes, but with a critical modification.**

  Sen's original theory is often summarized as "Famines happen without food decline." If you use that slogan strictly, the framework **breaks down on the Great Leap Forward and Ireland.** In both cases, food availability *did* decline significantly. If your tribunal strictly requires "Stable Supply" to prove "Political Crime," you will incorrectly acquit the perpetrators of the GLF and the British government in Ireland.

  **However,** Sen's deeper argument is that **entitlements are political constructs.**
  *   In **Bengal**, the state destroyed purchasing power (Entitlement Failure).
  *   In **Ireland**, the state allowed exports that stripped entitlements (Entitlement Failure).
  *   In **GLF**, the state destroyed production *and* seized the remainder (Entitlement Failure + Policy-Induced FAD).

  **The Verdict:** The framework works for all three **IF** you treat "State-Induced Production Collapse" (GLF) and "State-Allowed Export During Blight" (Ireland) as forms of Entitlement Destruction. Do not treat FAD (Food Availability Decline) as an excuse for the state. If the state causes the FAD or fails to mitigate it while exporting food, it is still a Political Crime.

  **Do not let the "Natural Disaster" defense pass Step 1b.** A blight is natural; a famine is political.

  ---

  ### Where the Procedure Misfires (Flags for Human Judgment)

  1.  **The "Capacity" Trap (Step 4):**
      *   *Risk:* A government might claim they *wanted* to help but had no money/logistics.
      *   *Judgment Call:* You must decide if they tried hard enough. Compare them to other nations with similar GDP at the time. If they had resources for war/luxury but not food, it's a Political Crime.

  2.  **The "Intent" Ambiguity:**
      *   *Risk:* Sen's theory proves negligence, not necessarily genocide.
      *   *Judgment Call:* Your tribunal must decide if "Gross Negligence" equals "Crime." In humanitarian law, usually, it does. Don't get bogged down proving they *wanted* people to die; prove they *knew* people would die and acted anyway.

  3.  **Data Gaps:**
      *   *Risk:* Authoritarian regimes (like GLF China) hide data. You won't have perfect proof for Step 1.
      *   *Judgment Call:* Use absence of evidence as evidence. If the state refuses to release data during a crisis, flag this in Step 5. Secrecy is proof of culpability.

  4.  **Complex Causality:**
      *   *Risk:* In Ireland, the blight *did* kill the food source.
      *   *Judgment Call:* Use the "Counterfactual Test." Ask: "If the government had banned exports, would people still have starved?" If the answer is "Fewer would have died," the state is liable for the excess deaths.

  ### Final Advice for Your Team
  When running the tribunal, do not let the defense argue "The crops failed." Your rebuttal is: **"Crops fail in democracies too; people do not starve."** Focus entirely on Step 4 (State Response) and Step 5 (Accountability). That is where the political crime lives.
