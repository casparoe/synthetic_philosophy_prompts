answer: |-
  You have identified a genuine structural problem in epistemology, and your intuition that it mirrors social choice theory is remarkably precise. You are describing the application of **Arrow's Impossibility Theorem** to the domain of historical inference, though in the specific context of amateur historical debate, it lacks a single, pithy label.

  The short answer is that yes, this has a name in the philosophy of science, but it is usually buried under formal logic. The longer answer requires us to dissect why your two versions occur, whether the social choice analogy holds, and whether Bayesianism offers an escape or merely a retreat.

  ### 1. Naming the Phenomenon

  In the philosophy of science, this is most rigorously discussed under the heading of **Theory Choice and Social Choice**, following the work of philosophers like Samir Okasha (specifically his 2011 book of that title). Okasha demonstrates that choosing between scientific theories based on multiple virtues (simplicity, fit, scope) is mathematically isomorphic to voting between candidates based on multiple voters.

  However, for the specific shape you are seeing in historical arguments, there is no single common noun. 'Underdetermination' is too broad (that implies the evidence doesn't decide *any* winner); 'Theory-Ladenness' is incorrect (as you noted, the evidence is agreed upon).

  Since you asked for a coinage if one does not exist, I propose we call this **Epistemic Menu-Dependence**.

  It captures both versions you described:
  *   **Version 1 (The Spoiler):** The outcome depends on which irrelevant alternatives are on the menu (violating the *Independence of Irrelevant Alternatives*).
  *   **Version 2 (The Cycle):** The menu prevents a stable ordering from forming at all (a *Condorcet Cycle*).

  If you wish to sound more technical, you might call it **Explanatory Intransitivity**. But *Epistemic Menu-Dependence* better highlights the core issue: the 'goodness' of an explanation is not an intrinsic property of the explanation, but a relational property dependent on the set of competitors available.

  ### 2. The Social Choice Analogy

  You asked if picking the best explanation is the same kind of operation as aggregating preferences. Structurally, **yes**. Ontologically, **no**.

  **Where the analogy holds:**
  In social choice, you aggregate individual preferences to find a group ranking. In historical inference, you aggregate *epistemic virtues* to find a hypothesis ranking.
  *   **Voters** = Epistemic Virtues (e.g., 'Consistency with Documents', 'Simplicity', 'Contextual Fit').
  *   **Candidates** = Historical Hypotheses (A, B, C).
  *   **The Ballot** = How well each hypothesis satisfies each virtue.

  Arrow's Theorem proves that no voting system can satisfy a set of reasonable fairness criteria (including transitivity and independence of irrelevant alternatives) simultaneously. Your observation is that historical reasoning suffers the same defect. When you have three virtues and three hypotheses, it is mathematically guaranteed that under certain conditions, you will get a cycle (A beats B on virtue 1, B beats C on virtue 2, C beats A on virtue 3).

  **Where the analogy breaks:**
  In an election, preferences are subjective. There is no 'fact of the matter' about whether the group *should* prefer A over B. In history, there *is* a fact of the matter (what actually happened). The virtues are not mere preferences; they are heuristics intended to track truth.
  The breakdown occurs because we assume truth-tracking virtues should converge on a single winner. The fact that they cycle suggests that our virtues are not tracking a single underlying scalar value (Truth), but are pulling in different directions. The analogy breaks at the *goal*, but holds firmly at the *mechanism*.

  ### 3. Analysing Your Two Versions

  **Version 1: The Epistemic Spoiler**
  This is a violation of the **Independence of Irrelevant Alternatives (IIA)**. In a rational ranking, the preference between A and B should not change if C is introduced, provided C is not the winner.
  *   **Why it happens in history:** Historical virtues are often comparative, not absolute. We do not say 'B is simple'; we say 'B is simpler than A'. If C enters the field and is very similar to B (perhaps a slight variation of the same theory), it dilutes B's claim to that specific virtue.
  *   **Example:** Suppose A is 'The King wrote the letters' and B is 'The Secretary wrote the letters'. Virtue: 'Stylistic Match'. B wins. Now introduce C: 'The Secretary's Apprentice wrote the letters'. C is stylistically identical to B. Now the 'Stylistic Match' vote is split between B and C. A wins on 'Opportunity', even though A was previously inferior.
  *   **Diagnosis:** This indicates that the evaluation method is **positional** rather than **absolute**.

  **Version 2: The Virtue Cycle**
  This is a **Condorcet Cycle**. It arises from **Incommensurability**.
  *   **Why it happens:** You noted that people stall because 'a bit more simplicity against a bit worse fit just isn't something anyone can price'. This is the crux. For a stable ranking to exist, there must be a 'exchange rate' between virtues. How much fit is one unit of simplicity worth?
  *   **Diagnosis:** In amateur history (and often professional history), there is no agreed exchange rate. Therefore, the 'value' of a hypothesis is a vector (fit: 8, simplicity: 2, coherence: 5), not a scalar. You cannot rank vectors without a weighting function. If the weighting function changes depending on which pair you are comparing, you get a cycle.

  ### 4. Is this a problem for Inference to the Best Explanation (IBE)?

  Yes, it is a significant problem. IBE relies on the premise that there is a 'best' explanation to be inferred.
  *   If the 'best' changes depending on the menu (Version 1), then 'best' is not a reliable indicator of truth, but a artefact of the argumentative context.
  *   If the ranking cycles (Version 2), then 'best' does not exist.

  Philosophers like Bas van Fraassen have argued that this shows IBE is irrational. If your method of choosing beliefs is susceptible to spoiler effects, it cannot be a truth-tracking mechanism. It suggests that IBE is not a logic of discovery, but a rhetoric of persuasion. The 'best' explanation is often just the one that survives the specific contrast class chosen by the historian.

  ### 5. The Bayesian Solution: Fix or Evasion?

  You asked: *if the fix is to cash out best explanation as a single number like posterior probability, the menu-dependence seems to disappear — is that a solution or a change of subject?*

  It is largely a **change of subject**, though a useful one.

  **Why it seems to work:**
  Bayesianism forces commensurability. By converting virtues into a probability $P(H|E)$, you force simplicity, fit, and coherence into a single currency (likelihood and prior). Mathematically, if $P(A) > P(B)$, adding hypothesis C cannot reverse that inequality (assuming the hypotheses are mutually exclusive and the evidence remains fixed). Probabilities are transitive.

  **Why it is a change of subject:**
  1.  **The Normalisation Problem:** Probabilities must sum to 1 across the space of possibilities. If you add C to the menu, you are expanding the space of possibilities. This changes the normalisation constant. While the *ratio* of $P(A)/P(B)$ might remain stable in theory, in practice, the introduction of C often forces a re-evaluation of the priors for A and B.
  2.  **The Input Problem:** Bayesianism does not tell you how to get the numbers. To get $P(H|E)$, you need to weigh simplicity against fit. If you couldn't do that to avoid the cycle in the first place, you cannot do it to calculate the probability. Bayesianism hides the weighting problem behind a variable; it does not solve it.
  3.  **The Historical Reality:** Historians rarely have the frequency data required for genuine Bayesian updating. Converting 'fits the documents better' into a likelihood ratio is often a pretence of precision.

  So, Bayesianism dissolves the *logical paradox* by assuming a level of formalisation that the historical material does not support. It solves the math by ignoring the messiness of the virtues.

  ### 6. Summary and Definition

  To answer your request for a careful definition to distinguish it from its neighbours:

  **Term:** **Epistemic Menu-Dependence**

  **Definition:** A failure of stability in comparative evaluation where the ranking of two options (A and B) is altered by the presence or absence of a third option (C), or where no transitive ranking can be established due to conflicting evaluative criteria.

  **Distinctions:**
  *   **Vs. Underdetermination:** Underdetermination says the evidence is insufficient to pick *any* winner. Menu-Dependence says the evidence might be sufficient, but the *method of ranking* yields different winners depending on the context.
  *   **Vs. Theory-Ladenness:** Theory-ladenness says observers see different evidence. Menu-Dependence assumes shared evidence but unstable processing.
  *   **Vs. Bias:** Bias implies a systematic error in one direction. Menu-Dependence is a structural instability; the error direction changes based on the set of options.

  **Verdict:**
  You are witnessing **Arrow's Impossibility Theorem** playing out in the wild. The 'shape' you see is the inevitable result of trying to aggregate multiple, incommensurable virtues into a single linear ranking without a fixed weighting system. It is a problem for IBE, it is structurally identical to social choice aggregation, and Bayesianism solves it only by assuming away the difficulty of weighing the virtues in the first place.

  In amateur history, where explicit weighting of virtues is rare, **Epistemic Menu-Dependence** is not a bug; it is the default state of the argument.
