  Tensions
  1. (2) vs. (3): This is the fatal fracture. Strong EV maximization with linear utility implies concentrating all funds in the highest EV cause. Diversifying into lower-ranked causes implies risk aversion or diminishing marginal utility, which contradicts (2). Revision: You must reframe (3) not as risk management but as epistemic humility—maximizing expected utility over a distribution of models, not point estimates. Cost: You lose the simplicity of ranking causes by single numbers; you must model covariance of estimation errors. This requires statistical expertise the committee may lack, violating (5). The cost is also that you can no longer claim cause-neutrality in practice, as the diversification requirement will inevitably favor causes with lower estimation error, biasing against novel interventions.

  2. (4) vs. (5): Yield-shifting is inherently dynamic (value of information/options over time), but (5) demands static quarterly snapshots. Revision: You must approximate option value as a static premium. Cost: This invites double-counting if the "unlocking" happens in a future quarter that is also scored for direct yield. You risk paying for the same outcome twice: once for the option, once for the execution. It also requires you to guess the expiration date of the option, introducing arbitrary time horizons into a framework claiming to be neutral. The cost is operational paralysis; every grant becomes a debate over option pricing rather than direct impact.

  3. (2) vs. The Case (B): You prefer B despite lower CMY. If (2) holds, this is irrational unless B's tail risk is incorporated into the EV. Revision: Admit your CMY calculation for B is incomplete. Cost: You must quantify the "unlocking" probability within the EV, not add it separately. This forces you to assign probabilities to speculative breakthroughs, inviting the very guesswork you sought to avoid by dropping neglectedness. It undermines the robustness claim in (1). The cost is credibility; stakeholders will see speculative adjustments as moving the goalposts to fund pet projects.

  4. (1) vs. (6): (1) claims CMY is the only quantity; (6) suggests infrastructure matters. If infrastructure raises CMY, it's redundant. If it's separate, (1) is false. Revision: Define CMY to include complementarity effects. Cost: Makes CMY context-dependent rather than cause-intrinsic. Your spreadsheet can no longer score causes in isolation; every score depends on the existing portfolio composition, creating a complex optimization problem that violates (5). You cannot simply sum scores; you must solve for the optimal mix iteratively. The cost is transparency; the committee cannot see why a cause's score changed without understanding the whole portfolio.

  Tensions that dissolve
  (1) and (6) dissolve once you recognize neglectedness (empty fields) often implies low infrastructure. Your intuition in (6) validates dropping neglectedness in (1); empty fields aren't valuable because they are empty, but because they might be cheap, unless they lack capacity. If capacity is the bottleneck, CMY drops. This isn't a contradiction; it's a correction of the production function. Similarly, (4) dissolves into (1) if "yield-shifting" is understood as purchasing future CMY. It only requires separate scoring because your spreadsheet (5) cannot handle dynamic programming. The tension is computational, not normative. You are not adding a new value; you are discounting future value to the present. If you accept that CMY includes discounted future flows, (4) is just a specification of (1).

  Cheapest repair
  The cheapest repair is to modify (2) to specify "maximization over epistemic distributions." This resolves the (2) vs. (3) clash: diversification becomes a mathematical requirement of maximizing expected value under uncertainty, not a concession to risk aversion. It also explains the preference for Cause B: B's distribution has higher variance and option value, raising its expected utility above A's robust but capped return. This commits you to building a model that outputs variance and covariance matrices, not just point estimates. It preserves your identity as an EV maximizer while legitimizing the diversification and option-seeking behavior you already want.

  What I should have specified
  You must specify the utility function over welfare units (linear vs. logarithmic). You need to define the counterfactual baseline in (1): is it zero funding, or current funding levels? You must define the time horizon for the "quarterly" decision—does unspent money roll over? Finally, specify how yield-shifting is quantified: is it a multiplier, an additive bonus, or a discount rate adjustment? Without these, the spreadsheet cannot be built.
