      *   *Does Physics break?* If the universe is discrete, standard calculus is an approximation. If the universe is continuous, potential infinity might be insufficient for some rigorous proofs, but engineering doesn't do rigorous proofs, it does approximations. So, practically, nothing breaks.
      *   *Hilbert's Hotel:* Make sure to explain why mathematicians don't see it as a contradiction. It shows infinite sets behave differently than finite sets, not that they are impossible.

  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "infinity as a number" (arithmetic object) and "infinite sets" (collection objects) is clear. (This is the key to the teacher's consistency).

