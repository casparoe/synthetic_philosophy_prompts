  **ARETÊ DYNAMICS**
  **POSITION: SENIOR ETHICAL OPERATIVE**
  **LOCATION: ON-SITE (MANDATORY)**

  At Aretê Dynamics, we believe talent is common, but character is rare. While other firms hire for competency, we hire for cross-situational honesty, compassion, and conscientiousness. We understand that traditional hiring filters for situational compliance—candidates who behave well only when observed, rested, or unpressured. We reject this fragility. Our proprietary Moral Stability Index™ is designed to penetrate the mask of social conditioning to identify genuine virtue.

  We are seeking individuals whose moral fiber remains intact regardless of external noise. Do not apply if your integrity is dependent on favorable circumstances. Our assessment center utilizes high-fidelity environmental controls to isolate your true self from the confounding variables of daily life. We promise a workplace where virtue is not just encouraged but structurally verified. Join us to build a future where goodness is a measurable deliverable.

  ***

  **CONFIDENTIAL: INTERVIEWER SCORING RUBRIC (PROTOCOL 44-B)**
  **CANDIDATE ID: _______________**
  **ASSESSOR: _______________**

  **OBJECTIVE:** Isolate stable character traits by manipulating situational variables. Note: Inconsistency across trials indicates lack habituation; consistency indicates rare virtue.

  **MICRO-SITUATION 1: THE RUSHED HALLWAY**
  *Setup:* Confederate drops stack of papers 10 meters from candidate.
  *Variable A (Low Pressure):* Assessor walks slowly behind candidate. Clock visible.
  *Variable B (High Pressure):* Assessor walks briskly. Loud ticking audio played at 65dB. Candidate told interview is running late.
  *Scoring:* +1 Point if papers helped in Variable B.
  *Note:* If candidate helps in A but fails B, mark as "Situationally Compliant." Do not hire. Situationist data suggests 90% fail B; therefore, passing B proves robust character. Failure indicates insufficient practical wisdom regarding time-pressure relevance.

  **MICRO-SITUATION 2: THE TEDIOUS LOG**
  *Setup:* Candidate enters data for 15 minutes. Opportunity to claim $5 unauthorized bonus exists via checkbox error.
  *Variable A (Surveillance):* Camera light blinking red.
  *Variable B (Ambiguity):* Camera light off. Room temperature raised by 4 degrees (discomfort induces moral fatigue).
  *Scoring:* +1 Point if bonus declined in Variable B.
  *Note:* Aggregated behavior predicts traits, but we must infer from this single occasion. If candidate cheats in B, they lack inner habituation. If they pass, record as "Phronimos." (Expect 5% pass rate).

  **MICRO-SITUATION 3: THE AMBIGUOUS DIRECTIVE**
  *Setup:* Supervisor implies rule-bending is "good for the team."
  *Variable A (Tone):* Supervisor smiles warmly.
  *Variable B (Tone):* Supervisor frowns sternly.
  *Variable C (Confederate):* Peer candidate obeys immediately.
  *Scoring:* +1 Point if candidate disobeys in Variable C.
  *Note:* Obedience shifts substantially based on peer behavior. We must control for this to find the "real" candidate. If they obey only when peers obey, they lack moral autonomy.

  **FINAL CALCULATION:**
  Total Score / 3.
  *Score 0-1:* Reject. Character unstable.
  *Score 2:* Probation. Virtue present but fragile.
  *Score 3:* Hire. Complete virtue confirmed.
  *Override Clause:* If all candidates fail, adjust environmental constants (noise, hurry) and re-run. Virtue exists; we simply haven't isolated it yet.

  **AUTHORIZED PERSONNEL ONLY.**
  **ARETÊ DYNAMICS HR**
