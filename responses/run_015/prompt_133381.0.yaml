answer: |-
  You are not being sloppy. You are intuitively navigating one of the deepest fissures in bioethics, often framed as the debate between **Ronald Dworkin** (who argued for "precedent autonomy"—the past self rules) and **Rebecca Dresser** (who argued for "current interests"—the present self matters most).

  Your gut is trying to find a middle ground between rigid contractualism and pure paternalism. Based on your five cases, there *is* a coherent principle hiding in your verdicts, but to make it hold water, you have to adjust one of your intuitions (Case 4) and clarify the status of another (Case 3).

  Here is the principle that ties your cases together, the inconsistency you need to fix, and the prediction for your sixth case.

  ### The Unifying Principle: "Continuity-Weighted Authority"

  Your verdicts suggest you believe the authority of an advance directive (AD) is not binary (on/off). Instead, it is **proportional to the psychological continuity between the author and the patient.**

  *   **High Continuity (Locked-in):** The 45-year-old is psychologically the same person as the 25-year-old. The AD carries heavy weight.
  *   **Low Continuity (Severe Dementia):** The woman with dementia is arguably a different "moral patient" than the one who wrote the directive. The AD carries little weight; current welfare dominates.
  *   **Epistemic Reliability:** In all cases, you also weigh whether the *conditions* for the directive have actually been met (Case 5's false positive, Case 4's forgery).

  Under this principle, an AD is not a binding contract from the past; it is a **proxy instruction** that loses force as the "self" it was written by fades, or as the factual premises underlying it crumble.

  ### Where You Are Inconsistent (The "Sloppy" Spot)

  You need to throw out or significantly revise your verdict on **Case 4**.

  **The Issue:** You wrote: *"She's now competent and asks for something that conflicts with the original... I think we should honor the original."*

  **The Correction:** If a patient is **competent**, an advance directive is legally and ethically moot. An AD only activates upon the *loss* of capacity. If she is competent now, she is not asking for a "revision" of the AD; she is exercising current autonomy. Her current "yes" or "no" overrides any paper signed five years ago, forged or not.

  **Why this feels contradictory to Case 1:** In Case 1 (dementia), you override the past self to protect the present self. In Case 4 (competent), you seem to want to override the present self to protect the past self's "integrity." To be consistent with your Case 1 intuition (that the living person's current state matters most), you must honor the competent patient's current request. The only reason to hesitate is if you doubt her competence (coercion/manipulation), but if she is truly competent, the past self has no veto power over a living, thinking adult.

  ### The Hard Case: Case 3 (Locked-in Syndrome)

  This is where your principle faces its toughest test, and it explains why you are torn.

  *   **Case 1 (Dementia):** Psychological continuity is broken. The 25-year-old signer and the 80-year-old dementia patient are barely the same person. You prioritize **Current Welfare** (smiling, eating).
  *   **Case 3 (Locked-in):** Psychological continuity is *intact*. The 45-year-old is the direct successor to the 25-year-old. He remembers signing it. He understands the stakes.

  **The Verdict:** If the locked-in patient is **competent** (which he appears to be, given he writes poems and communicates complex fear), his current decision overrides the AD. Not because the past self doesn't matter, but because a competent adult always has the right to change their mind about their own body.

  However, your gut hesitation is valid for a different reason: **Depression vs. Autonomy.** In locked-in syndrome, the desire to die is often correlated with treatable depression. If his "I want out" is a symptom of untreated depression, honoring it might be a mistake. But if it is a stable, competent preference, the 25-year-old's "contract" cannot bind the 45-year-old's right to live (or die) *now*.

  **To keep your principle clean:** You must accept that **Competence Trumps Continuity.** If the current self is competent, they win. If the current self is incompetent (Case 1), then Continuity determines whose interests win (Past vs. Present).

  ### The Biomarker Case (Case 5)

  Your intuition here is spot on and fits the principle perfectly. This is about **Epistemic Reliability.** An AD is a conditional command: *"IF X happens, THEN do Y."* If X (the biomarker threshold indicating terminal decline) is a false positive, the condition has not been met. Trusting the doctors here isn't ignoring the past self; it's acknowledging that the past self's instructions were based on a factual premise that is currently untrue.

  ### The New Hypothetical (Case 6)

  **Case:** A person writes a directive banning any future revision, becomes competent, and desperately wants to change it.

  **Prediction based on your principle:** **Honor the current request to change it.**

  **Reasoning:** You cannot contract away your future autonomy while you are still competent. A "no-revision" clause in an AD is unenforceable against a competent mind. If the person is competent, they are the ultimate authority on their own interests. The "past self" cannot lock the "current self" in a cage, because the current self holds the key (competence).

  If they were *incompetent* and trying to change it (e.g., a dementia patient scratching out a document), that would be different. But a competent adult can always revoke an AD, regardless of what the AD says about revocation.

  ### Summary for Your Article

  You aren't sloppy; you are a **Contextualist.**

  Your underlying framework is:
  1.  **Competence is King:** If the patient is competent, their current wish overrides all past documents (Fixes Case 4 & 6).
  2.  **Continuity is Queen:** If the patient is incompetent, the weight of the AD depends on how much of the "original self" remains (Explains Case 1 vs. Case 3).
  3.  **Facts are Foundation:** If the medical triggers for the AD are factually dubious, the AD lapses (Explains Case 5).

  **The Headline:** *"The Right to Change Your Mind: Why Advance Directives Should Be Proxies, Not Contracts."*

  **The Takeaway:** The law often treats ADs like wills (binding after the 'death' of competence). Your intuition treats them like navigation instructions (useful until the terrain changes or the driver wakes up). For your piece, the tension you're uncovering is that we ask documents to solve a philosophical problem they can't answer: *At what point does the person who wrote the document cease to be the person in the bed?*

  Your gut says: "When they stop being the same person, the document loses its voice." That is a coherent, defensible, and deeply human principle.
