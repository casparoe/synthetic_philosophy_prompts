  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** I am acting as an expert consultant advising a team lead at a bilateral development agency.
      *   **User:** Team lead of country-diagnostics team (3 people: lead + 2 economists).
      *   **Task:** Create a decision procedure for causal attribution in country growth notes (40/year, 2 weeks each, $50-300M lending decisions).
      *   **Constraints:**
          *   No academic essay; must be a practical decision procedure.
          *   Address the mismatch between long-term causes (centuries) and short-term decisions (15 years).
          *   Evaluate 5 existing loose tests (counterfactual pairs, backwards testing, rivals vs. links, context distance, measure contamination).
          *   Order the tests, define sufficiency, stop conditions, and handoff points (evidence vs. values).
          *   Run the procedure on 3 specific cases (Landlocked/Malaria/Institutions, Coastal/EPZ/Replication, Judicial/Land Titling/Previous Attribution).
          *   Be honest about limitations (where judgment remains).
          *   **Format:** Continuous prose, long email style. No headings, no bullet points, no bold text, no tables. Number steps inside sentences if needed.
          *   **Length:** 1200 - 1500 words.
          *   **Content:** No citations, no specific dataset names, no reconstructed references.

  2.  **Deconstruct the 5 Tests & Order Them:**
      *   *Test 5 (Measure Contamination):* This is a data quality check. It should come first. If the measure is endogenous to the outcome, stop or flag immediately.
      *   *Test 2 (Backwards Testing/Ex Ante Predictability):* This checks for hindsight bias. Should come early, after data quality.
      *   *Test 3 (Rivals vs. Links):* This clarifies the causal model. Should come before comparing cases.
      *   *Test 1 (Counterfactual Pairs/Matching):* This is the core causal identification check. Comes after model clarification.
      *   *Test 4 (Context Distance/Extrapolation):* This assesses external validity. Comes last, before the decision.

      *Refined Order:* 5 -> 2 -> 3 -> 1 -> 4.
      *Rationale:* Clean data first (5), then check for hindsight bias (2), then define the mechanism (3), then check empirical support (1), then check applicability to *this* case (4).

  3.  **Drafting the Procedure (Mental Outline):**
      *   Intro: Acknowledge the pressure and the need for rigor without academic bloat.
      *   Step 1 (Contamination): Check if C is defined by Y. If yes, discard C as evidence.
      *   Step 2 (Hindsight): Could we have predicted this 25 years ago? If no, cap confidence.
      *   Step 3 (Mechanism): Are C and D rivals or chains? If chain, don't treat as mutually exclusive.
      *   Step 4 (Counterfactuals): Find matched pairs (C without Y, Y without C). Adjust for clustering (colonial/legal). If no pairs, cap at "consistent with."
      *   Step 5 (Extrapolation): Distance between observed context and current country. Discount factor.
      *   Handoff: Where evidence ends, values begin (risk tolerance, political mandate).
      *   Case 1 (Landlocked/Malaria): Institutions claim. Likely fails Test 4 (distance) or Test 1 (matches). Deep structural vs. short-term loan mismatch.
      *   Case 2 (Coastal/EPZ): Replication claim. Test 4 is key (context change). Test 2 (was it predictable?).
      *   Case 3 (Judicial/ Land Titling): The uncomfortable one. Previous attribution vs. current program. Test 2 (hindsight) and Test 5 (contamination) might bite. Handoff to person on reputation vs. evidence.
      *   Limitations: Cannot solve value judgments, cannot overcome data scarcity, cannot predict black swans.

  4.  **Drafting the Content (Iterative refinement for tone and length):**
      *   *Tone:* Professional, direct, colleague-to-colleague, pragmatic.
      *   *Length Control:* Need to monitor word count closely. 1200-1500 words is roughly 2-3 single-spaced pages. I need to be verbose enough to hit the floor but concise enough to stay under the ceiling.
      *   *Constraint Check:* No bullets, no bold, no headings. Number steps within sentences.

  5.  **Writing - Section by Section (incorporating word count monitoring):**

      *   *Intro:* Start by validating the difficulty. The mismatch between centuries-long causes and 15-year loans is the core tension.
      *   *The Procedure:* Walk through the 5 tests in the proposed order.
          *   Start with Test 5 (Contamination). If governance scores are derived from growth, they are useless for explaining growth.
          *   Move to Test 2 (Backwards). If the story relies on knowing the outcome, it's narrative, not prediction.
          *   Move to Test 3 (Structure). Distinguish rivals from mechanisms.
          *   Move to Test 1 (Matches). The heavy lifting. Independent cases.
          *   Move to Test 4 (Distance). External validity.
      *   *The Handoff:* Define where evidence stops. If the procedure clears the hurdles, the remaining risk is political or ethical, not empirical.
      *   *Case 1 (Landlocked):* High disease, landlocked. Claim: Institutions. Procedure likely flags Test 4 (institutions take generations) and Test 1 (hard to find matches without controlling for geography). Result: Loan might not fix the binding constraint.
      *   *Case 2 (EPZ):* Claim: Policy replication. Test 2 (was it predictable?) and Test 4 (global context changed). Result: Proceed with caution on extrapolation.
      *   *Case 3 (Judicial):* The tricky one. Claim: Institutional quality caused growth. Test 5 (did we measure institutions using growth proxies?) and Test 2 (hindsight). Result: Evidence is weak, but proceeding is a reputational/political decision.
      *   *Limitations:* Cannot remove value judgments. Cannot generate data where none exists.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Check Word Count:* I need to ensure I don't run short. I should expand on the *reasoning* for the order of tests and the specific implications for the cases.
      *   *Check Formatting:* Ensure absolutely no bullet points or bold text. Use "step one," "step two" within the flow.
      *   *Check Tone:* Keep it like an email. "Here is how I see it..."
      *   *Check Constraints:* No citations. No specific dataset names (e.g., don't say "Worldwide Governance Indicators," say "expert-coded perceptions").
      *   *Check Case 3:* Must be honest about undercutting the unit's previous work. Must specify where the human decision lies.

  7.  **Final Polish:** Read through to ensure flow and word count compliance. (Mental check: 1200 words is quite a bit of text. I need to elaborate on the *why* of the procedure steps to ensure I hit the minimum without fluff.)

      *Expansion Strategy:* Elaborate on the "stop conditions." When do we say "no"? When do we say "unknown"? Elaborate on the "values" handoff. What specific values? (Risk appetite, mandate fidelity). Elaborate on the Case 3 dilemma (reputation vs. evidence).

      *Word Count Management:* I will write freely first and then adjust. If too short, I will expand on the philosophical justification of the "mismatch" between cause horizon and decision horizon. If too long, I will trim the intro.

      *Let's estimate:* 150 words intro. 400 words on procedure steps. 150 words on handoff. 450 words on the three cases. 150 words on limitations. Total ~1350.

      *Wait, one constraint:* "Number the steps inside the sentences rather than with a list." Okay, I will write "in step one we check..." instead of "1. Check...".

