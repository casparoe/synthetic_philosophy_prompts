answer: |-
  Colleagues, I have reviewed the five tests your team has been applying inconsistently and reorganized them into a single decision procedure that addresses the core tension you face, which is the mismatch between the horizon of deep causes and the horizon of lending decisions. The goal here is not to produce academic certainty but to prevent costly errors of attribution where we fund a solution for a problem we have misdiagnosed. All five of your existing tests survive, but they must be run in a specific order to avoid wasting time on claims that are fundamentally flawed before we even look at the data. In step one, you must check for measure contamination, asking whether the variable we call the cause was constructed using knowledge of the outcome, such as expert-coded governance scores that implicitly rely on growth performance to assess quality. If the measure is contaminated, you must treat it as unusable for causal inference rather than merely imprecise, because no amount of econometric control can fix a definition that circularly includes the result you are trying to explain. In step two, run the story backwards to test for hindsight bias, using only information knowable twenty-five years prior to the growth episode to see if the trajectory would have been ranked as likely without knowing the ending. If the story depends on facts that only became visible after the growth occurred, you must cap the confidence level low, regardless of how well the data fits now, because a explanation that cannot predict is not a tool for decision-making. In step three, clarify the causal structure by determining whether the competing causes are rivals or links in a chain, since if one operates through the other, proving statistical strength for one does not refute the other, and treating them as mutually exclusive rivals would be a category error. In step four, you must name a country that had the cause without the outcome and a country that had the outcome without the cause, ensuring these are effective independent cases rather than nominal ones by discounting countries that share colonial origins or legal families as separate confirmations. If no matched pair can be named, you must cap the claim at consistent with rather than causal, because without variation in the outcome among similar units, we cannot distinguish the signal from the background noise. In step five, assess the distance between the context where the cause was observed and the current country, stating the discount being applied for that distance and flagging the claim as extrapolation when the gap is large, particularly regarding the time horizon where a cause explaining levels over centuries may say little about changes over fifteen years.

  The procedure stops with a no if step one or step two fails completely, as these indicate fundamental flaws in the evidence rather than mere uncertainty, but it hands the decision to a person when step four or step five yields a high discount rate, because the remaining question is one of risk tolerance and values rather than evidence. At that handoff point, the regional director must decide whether the potential upside justifies the evidentiary weakness, acknowledging that they are betting on a hypothesis rather than funding a proven solution. When you run this on the first case, the landlocked and malaria-burdened country requesting a public financial management loan premised on institutional constraints, the procedure will likely undercut the claim. In step one, you will find that many institutional measures are partially constructed from economic performance, rendering them contaminated for this purpose. In step four, you will struggle to name a matched pair that is landlocked and disease-burdened but achieved growth through institutional reform alone, because the effective independent cases are vanishingly small once you control for geography and ecology. In step five, the distance between the horizon of institutional change, which is generational, and the horizon of the loan, which is fifteen years, is too large to ignore. The procedure yields a verdict that the evidence does not support institutions as the binding constraint accessible to this loan, and while the loan might still be useful for other reasons, you cannot write the note claiming it will unlock growth via institutional change.

  For the second case, the coastal country with export processing zones seeking to replicate the policy, the procedure yields a more permissive but cautious answer. In step two, the story might pass the backwards test if the initial zone opening was a deliberate policy shift visible at the time, but in step five, the context distance is significant because the global trade environment twenty-five years ago differs sharply from today. You must apply a heavy discount for extrapolation in step five, flagging that the mechanism worked in a specific historical window of trade liberalization that may not exist now. The decision handoff here is clear: the evidence supports the mechanism but not the magnitude of the expected return in the current context, so the director must decide whether the lower expected return still justifies the investment compared to alternatives. The third case is the one you will not like, involving the judicial strengthening and land titling program where your unit previously attributed growth to institutional quality. When you run step one, you will likely find that the previous attribution relied on governance measures contaminated by the very growth they were explaining. When you run step two, you will find that the institutional improvement was only coded as high after the growth was observed, failing the backwards test. The procedure undercuts the attribution entirely, suggesting the previous note claimed more certainty than the evidence allowed. Here the decision belongs to a person on grounds of reputation and commitment rather than evidence. A director could still choose to proceed if the political cost of canceling an announced program outweighs the evidentiary weakness, or if the program has value independent of the growth claim, such as social stability or rule of law benefits that do not rely on GDP metrics. However, they must sign off knowing they are overriding the diagnostic procedure based on non-evidentiary values, and the note must be rewritten to remove the causal claim that institutions caused the past growth, instead framing the loan as an investment in justice rather than a key to unlocking growth.

  You need to know what this procedure cannot do, and I want to mark the points where judgment cannot be eliminated rather than smoothing them over. This procedure cannot generate data where none exists, so in cases where there are no matched pairs simply because the country is unique, the procedure will force a cap on confidence but cannot tell you whether the unique cause is real. It cannot resolve conflicts between political mandates and empirical findings, so when a director chooses to proceed despite a negative verdict, the procedure records the deviation but cannot prevent it. It cannot eliminate the need for judgment in step three, where distinguishing between rivals and links requires theoretical reasoning that is not purely empirical, and in step five, where the discount rate for context distance is necessarily subjective. The procedure is designed to make the uncertainty explicit rather than to remove it, ensuring that when we bet hundreds of millions of dollars, we know whether we are betting on evidence or on hope. If we follow this, we will write fewer notes that claim causal certainty where there is only correlation, and when we do make leaps of faith, we will do so with our eyes open about the nature of the risk. I recommend implementing this immediately on the next cycle of notes, even if it means rewriting some existing drafts, because the cost of a misdiagnosed loan is far higher than the cost of a delayed report.
