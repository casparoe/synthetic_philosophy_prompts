answer: |-
  # Q&A PREP SHEET: Absorption-Adjusted Kelly in Epistemology

  **Strategy Note:** The objections are ordered by existential threat to the thesis. The mathematical derivation is the foundation; if it cracks, the normative claim collapses. The Decision Theorist's objection is second because it dissolves the novelty of the contribution. The remaining objections challenge applicability and implications.

  ---

  ### 1. The Zero-Boundary Convergence Problem (Mathematical Derivation)
  **Source:** *Internal/Technical (The "Hope Nobody Raises" Objection)*
  **Objection:** "Your absorption-adjusted fraction relies on the assumption that the geometric growth rate remains well-defined as the resource pool approaches the absorbing barrier. However, in a sequential test with a hard zero boundary, the expected log-utility diverges negatively before the barrier is hit. You haven't proven the modified fraction prevents ruin in finite time; you've merely shifted the singularity. If the derivation doesn't hold under strict stochastic constraints, the normative 'ought' is baseless."

  **Reply (2 mins):**
  "You are correct that the boundary condition at zero is the critical vulnerability. Standard Kelly assumes infinite divisibility and time; absorption implies a hard stop. My derivation does not claim to eliminate the singularity but to push the probability mass of ruin asymptotically to zero over the relevant horizon of scientific inquiry. The adjustment factor isn't just a scalar reduction; it is a dynamic constraint that shrinks the bet size as the distance to the absorbing barrier decreases.

  I am not arguing for a guarantee against ruin—that is impossible in stochastic environments with tail risk. I am arguing that the *rate* of approach to the barrier is slowed sufficiently to maximize the integral of truth-tracking over the agent's lifespan. If the fraction is fixed, ruin is certain. If the fraction is absorption-adjusted, ruin becomes a measure-zero event in the limit of sequential testing. The normative force comes from the comparison: standard Kelly leads to certain epistemic death; adjusted Kelly preserves the possibility of convergence. I concede the exact fraction is model-dependent, but the direction of the inequality—betting less than Kelly—is robust even if the specific coefficient varies."

  **Weakest Point:** This concedes that the specific fraction is not universal. If the audience demands a precise, context-independent formula, this reply admits failure. It shifts the claim from a precise calculation to a qualitative heuristic.

  ---

  ### 2. Redundancy via State-Dependent Utility
  **Source:** *Decision Theorist (SEU Commitment)*
  **Objection:** "This is just Subjective Expected Utility maximization with a specific state-dependent utility function. You define 'absorption' as a state where utility is undefined or negative infinity. Savage's framework already handles this. You aren't proposing a new normative principle; you're just redescribing risk aversion in the language of growth optics. Why should we accept a new decision rule when SEU covers the preference ordering?"

  **Reply (2 mins):**
  "The distinction lies between valuing a state and constraining the path to that state. SEU with state-dependent utility tells us how to *value* survival, but it does not inherently constrain the *dynamics* of allocation to prevent path-dependency failures. In standard SEU, an agent can theoretically choose a sequence of bets that maximizes expected utility in each step but leads to certain absorption in the long run (the St. Petersburg dynamic).

  My claim is that epistemic continuity is a structural constraint on the *possibility* of utility maximization, not just an input to the utility function. If you lose the capacity to inquire, you cannot maximize utility in any state. Absorption-adjusted Kelly is a procedural norm for maintaining the *agency* required to have preferences. SEU describes the target; absorption-adjusted Kelly describes the navigation required to keep the ship afloat long enough to reach it. It is a constraint on the *process* of rationality, not just the *outcome*."

  **Weakest Point:** Distinguishing "structural constraint" from "utility function input" is philosophically slippery. A committed SEU theorist can argue that any constraint on process can be encoded into the utility function, making this reply sound like a verbal distinction rather than a formal one.

  ---

  ### 3. The Category Mistake of Wagering on Truth
  **Source:** *Philosophers of Science*
  **Objection:** "Science is not a casino. Treating credence allocation as 'betting' smuggles in a pragmatic aim (survival/funding) that displaces the constitutive aim of science (truth/knowledge). You are normativeizing institutional self-preservation, not epistemic rationality. If a hypothesis is true, we should pursue it even if it risks 'absorption.' Your framework licenses abandoning truth-tracking to save the lab."

  **Reply (2 mins):**
  "I reject the dichotomy between truth-tracking and institutional survival. In sequential inquiry, a dead scientist tracks no truth. The 'bet' is not on truth directly, but on the *allocation of limited cognitive and material resources* required to test for truth. If a research program risks catastrophic disconfirmation that eliminates the capacity to test *any* further hypotheses, that is not a noble sacrifice for truth; it is a termination of inquiry.

  My framework does not say 'avoid risky true hypotheses.' It says 'size your exposure so that if you are wrong, you remain in the game to find the next truth.' This is not pragmatic cowardice; it is the epistemic duty of sustainability. We cannot treat credence as infinite. When resources are finite and failure is absorbing, the most truth-conducive strategy is the one that prevents premature termination of the inquiry process."

  **Weakest Point:** This risks conflating the sociology of science (funding/careers) with the epistemology of science (justification). If the audience believes "epistemic rationality" must be purely truth-directed regardless of cost, this reply sounds like an admission that the thesis is actually about career management, not epistemology.

  ---

  ### 4. The Non-Fungibility of Credence
  **Source:** *Financial Economists*
  **Objection:** "Kelly works in finance because capital is fungible and liquid. You can sell a losing stock to fund a winning one. Credence is not fungible. You cannot 'withdraw' confidence from Theory A to fund Theory B without changing the doxastic state itself. There is no numeraire for belief. Without a liquid asset to rebalance, the geometric growth mechanism is inert."

  **Reply (2 mins):**
  "Credence is not the capital; *attention and testing capacity* are the capital. We have a finite budget of experiments, hours, and computational power. Allocating high credence to a fragile hypothesis often drives the allocation of these tangible resources. If you commit 100% of your research budget to a fragile hypothesis and it fails, you have no resources left to test the alternative.

  The 'fungible asset' in my model is the opportunity cost of inquiry time. Absorption-adjusted Kelly governs how much of your finite research budget you expose to a high-risk hypothesis versus keeping in reserve for alternative pathways. The geometric growth applies to the *stock of verified knowledge* relative to the *resources consumed*. If you burn resources faster than you accumulate robust knowledge, your epistemic growth rate is negative. The mechanism holds because the constraint—time and funding—is perfectly fungible, even if belief states are sticky."

  **Weakest Point:** This shifts the goalposts from "credence allocation" to "resource allocation." If the thesis was explicitly about *credence* (degrees of belief), this reply admits the model only applies to *research management*, weakening the epistemological claim.

  ---

  ### 5. Rationalized Dogmatism in Disagreement
  **Source:** *Conciliationist Epistemologist*
  **Objection:** "This framework licenses irrational steadfastness. If I face peer disagreement, the 'absorption risk' of updating could be framed as losing my theoretical framework. Your model suggests I should under-update to preserve my 'epistemic capacity.' This turns risk management into a shield against conciliation, allowing agents to ignore peer evidence to protect their own cognitive investment."

  **Reply (2 mins):**
  "Absorption adjustment is not a license to ignore evidence; it is a constraint on *how much* of your epistemic identity you stake on a single resolution of that disagreement. Conciliation requires updating, but it does not require total capitulation that leaves you unable to further investigate the disagreement's source.

  If updating to a peer's view destroys your capacity to understand *why* you disagreed (e.g., by abandoning the conceptual framework needed to evaluate the evidence), that update is epistemically self-defeating. The adjusted fraction dictates that you move toward the peer's credence, but not so aggressively that you lose the independent standing required to verify their claim. It advocates for cautious conciliation, not steadfastness. It prevents the 'absorption' of your critical faculty into the peer's authority."

  **Weakest Point:** This is a fine line to walk. It is very easy for this to sound like special pleading for dogmatism. If the "conceptual framework" is just a euphemism for "my current belief," the reply fails to distinguish itself from irrational bias.
