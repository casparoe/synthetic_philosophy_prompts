  **DEPARTMENT OF EXPERIENTIAL WELFARE**
  **DRAFT CIRCULAR 44-B: NATIONAL VALENCE OFFSET SCHEME (NVOS)**
  **REFERENCE: DEW/PHEN/2024/09**
  **DATE: 14 OCTOBER 2024**

  **1. PURPOSE**
  This Circular sets out the proposed regulatory framework for the National Valence Offset Scheme (NVOS). Pursuant to the Intrinsic Nature Act (2023), all registered entities must account for the experiential cost of manipulating matter. As physics describes only structure and relation, the intrinsic nature of physical processes carries a moral weight proportional to its deviation from baseline equilibrium. This Scheme allows liable parties to inventory, audit, and offset experiential debts incurred through industrial, domestic, or biological activity.

  **2. DEFINITIONS AND AGGREGATION**
  For the purposes of liability, a "Subject" is defined as any physical system possessing intrinsic experience. To address complexities regarding composite systems (hereafter "The Combination Problem"), the Department introduces the **Statutory Phenomenal Consolidation Discount (SPCD)**.

  Under the SPCD, the moral weight of a macroscopic object is calculated by summing the valence of its constituent micro-subjects and dividing by the number of constituents. Consequently, a kilo of copper, while hosting approximately $10^{25}$ micro-experiences, is legally valence-neutral. This ensures that mere existence does not constitute a regulatory burden, while active manipulation remains liable.

  **3. PSYCHOPHYSICAL PROXY AND MEASUREMENT**
  As intrinsic valence is not directly observable via structural instrumentation, the Department adopts **Entropy Production Rate ($\dot{S}_{prod}$)** as the provisional psychophysical proxy. Systems maintained significantly away from thermodynamic equilibrium incur a Valence Debt (negative valence). Systems relaxing gently toward equilibrium are credited with Positive Valence.

  Liability is assessed in **Standard Hedonic Units (SHU)**, measured per mole per hour (SHU mol⁻¹ h⁻¹).

  **Table 1: Provisional Valence Coefficients for Common Systems**

  | System State | Thermodynamic Condition | Valence Coefficient (SHU mol⁻¹ h⁻¹) | Liability Class |
  | :--- | :--- | :--- | :--- |
  | Deep Antarctic Ice | Near Equilibrium | 0.00 | Exempt |
  | Domestic Refrigerator | Maintained Gradient | -4.50 | Class II Debt |
  | Adult Human (Resting) | Homeostatic Maintenance | -12.75 | Class I Debt |
  | Active Compost Heap | Relaxing to Equilibrium | +8.20 | Credit Generator |
  | MRI Magnet (Active) | High Energy Gradient | -55.00 | Class III Debt |
  | Supernova (Type II) | Catastrophic Relaxation | +1.4 x 10⁹ | Non-Tradeable Credit |

  **4. OFFSET MECHANISMS**
  Entities exceeding their Valence Allowance must purchase offsets from registered projects. Qualifying projects involve the preservation of matter in states of minimal entropy production. Approved categories include:
  *   **Passive Equilibrium Zones:** Abyssal sediment beds, deep crustal rock.
  *   **Cryogenic Preservation:** Unpowered ice cores.

  **Additionality:** Credits are only issued for matter that would otherwise be subjected to gradient maintenance. **Leakage:** Care must be taken to ensure that preserving equilibrium in one location does not necessitate energy expenditure (and thus Valence Debt) elsewhere.

  **5. STAKEHOLDER COMMENTARY**
  The Department acknowledges diverse views regarding the proxy selection. Professor A. Sterling, Chair of the Valence Standards Board, noted: *"The entropy proxy provides a robust, auditable metric. It aligns fiscal responsibility with the natural order of things. We are pleased with the uptake from the heavy industrial sector."*

  Dr. H. Vance, Board Member (Neuroscience), dissented: *"This assumes subjectivity exists in a fridge. My position remains that experience requires a thalamocortical system. By taxing magnets, we dilute the suffering of actual patients."*

  Meanwhile, representatives from Animal Welfare UK expressed concern regarding the SPCD. A spokesperson stated: *"Reclassifying livestock as 'composite systems' subject to the Consolidation Discount reduces a cow to a rounding error. This is a bureaucratic evasion of sentient reality."*

  **6. LONG-TERM COMPLIANCE TARGETS**
  The NVOS operates on a sliding scale of reduction. Intermediate targets require a 40% reduction in national net valence debt by 2035. The statutory long-term target, as mandated by the Intrinsic Nature Act, is **Net Zero Valence**.

  Stakeholders should note that full compliance with Net Zero Valence necessitates the cessation of all processes maintaining matter away from thermodynamic equilibrium. Accordingly, the Department projects full regulatory compliance will be achieved concurrently with universal thermal equilibrium. Planning permissions for activities extending beyond this horizon will not be entertained.

  **7. CONSULTATION TIMETABLE**
  Responses to this Circular must be submitted by 31 January 2025. Please submit forms via the DEW portal. Do not submit hard copy; the processing of paper incurs unnecessary entropy production.

  **Department of Experiential Welfare**
  *Aligning Structure with Substance*
