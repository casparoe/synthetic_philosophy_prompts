prompt: |-
  hey — you're a professional philosopher of science who specializes in Bayesian confirmation theory (the real stuff, not the pop-Silver version), and you've also done a two-year stint embedded with an evidence-assessment team, so you know how this kind of thing actually gets used when the clock is running. Before you write anything final, take a pass at brainstorming: list the distinctions from the old-evidence literature that you think could survive being turned into a checklist, and the ones that are hopeless in practice, and say briefly why you're dropping each. Then give me the actual procedure, and think carefully about the hard cases rather than sketching them.

  Context: I run a small evidence-assessment unit at a large medical research funder. Twice a year we re-score each funded programme's central mechanistic hypothesis H against the whole evidence base, and we report a log likelihood ratio (we use decibels, we call them "credits") that rolls up into a confidence rating the renewal panel sees. My team is six people, no philosophers among them, and they get about half a day per programme. The thing that keeps blowing up our meetings: most of the evidence we want to count was already known — sometimes for decades — before anyone wrote H down in its current form. Taken literally, if E is already in the background knowledge then its probability is 1, the ratio is 1, zero credits, done. But that's obviously wrong sometimes (a theory that quietly explains away a long-standing anomaly looks like it earns a lot) and obviously right sometimes (a mechanism invented to fit a famous dataset that everyone already had open on their desk earns nothing). I need a procedure that separates those two, definately.

  What I want:

  - An ordered set of steps my team can run on each (H, E) pair in about 40 minutes, with what counts as a sufficient answer at each step, and what to write down when we can't get a number.
  - Where the procedure says stop, zero credits, and the reason it stops there.
  - Where it says this is a judgment call, escalate to the panel — instead of pretending to be mechanical. Be explicit about which steps are judgment in a lab coat.
  - Real handling of: (i) evidence that was used to construct H vs. merely known before H; (ii) H entailing E only with help from auxiliaries that were themselves adjusted along the way; (iii) evidence that was an open anomaly for the previous theory vs. evidence that everyone already had a decent explanation for; (iv) the "data is old but the quantity is new" case — re-analyses nobody performed until H told them what to compute; (v) how to avoid counting the same evidence twice, once as motivation for H and again as a prediction of H; (vi) what to do when nobody can say what H would have predicted if E had come out otherwise, including whether it's legitimate to fall back on "would the field have been surprised?"

  Then run it on three cases:

  1. A calibration case from outside medicine: a new theory of gravitation from the 1910s that nobody built in order to explain the odd behaviour of Mercury's orbit, but which gets the anomalous part right. Does it get credits, on which step, and how many does it deserve compared to a genuine novel prediction? Then: someone later proposes a rival explanation that soaks up part of the anomaly. Do the credits come back out, and if so, when — at the moment the rival is proposed, or only once it's tested?
  2. Our problem child. Programme B's hypothesis is that a specific gut-bacteria-derived metabolite drives insulin resistance. Its strongest support is a widely-used cohort dataset; the metabolite was picked, out of a panel of dozens of candidates, by seeing which one tracked the outcome in that dataset. The team loves this programme and I expect your procedure to tell me something I don't want to hear. Say it plainly, don't soften it.
  3. A retrodiction case: an old dataset, and a quantity nobody had ever computed from it. H pins that quantity down to a fairly narrow range, and when someone finally computes it, it lands in the range. Old evidence or new prediction? Where does your procedure land, and what single change to the facts would flip the answer?

  Finally, a short section on what this procedure can't do: where it will misfire even when my team runs it correctly, which disagreements it settles by fiat rather than argument, and what I should tell the panel so they don't read the credits as more precise than they are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of science (specializing in Bayesian confirmation theory) + 2 years embedded with an evidence-assessment team (practical experience). Tone should be authoritative, pragmatic, slightly weary of theoretical purity but committed to rigor.
      *   **Task:**
          1.  Brainstorm distinctions from the "old evidence" literature (keep vs. drop for a checklist).
          2.  Develop a concrete, ordered procedure (steps, time limits, stop conditions, escalation points).
          3.  Handle specific hard cases (construction vs. knowledge, auxiliaries, anomalies vs. explained data, new quantities from old data, double counting, counterfactuals).
          4.  Run the procedure on three specific cases (Mercury/GR, Gut Metabolite/Programme B, Retrodiction/New Quantity).
          5.  Limitations section (what it can't do, where it misfires, advice for the panel).
      *   **Constraints:** Team of 6 non-philosophers, 0.5 day per programme total (so ~40 mins per H/E pair is tight but requested), need clear "stop/zero credits" and "escalate" points.
      *   **Context:** Medical research funder, scoring mechanistic hypotheses, reporting log likelihood ratios in decibels ("credits"). Problem: Old evidence problem (E known before H $\rightarrow$ $P(E)=1 \rightarrow$ no confirmation). Need to distinguish "accommodation" (fitting known data) from "explanation of anomaly" (earning credit).

  2.  **Part 1: Brainstorming Old Evidence Distinctions (Keep vs. Drop):**
      *   *Literature:* Glymour's problem, Garber's solution (logical learning), counterfactual historical probabilities (Howson, Urbach), distinction between $P(E|K)$ and $P(E|K \& H)$.
      *   *Keep:*
          *   **Construction vs. Use:** Was $E$ used to *build* $H$? (Double counting risk).
          *   **Anomaly Status:** Was $E$ a known problem for the *prevailing* theory? (Explanatory power).
          *   **Auxiliary Stability:** Did we tweak the auxiliaries to make $H$ fit $E$? (Ad hocness).
          *   **Counterfactual Surprise:** If $E$ had been different, would $H$ have been ruled out? (Riskiness).
      *   *Drop:*
          *   **Logical Omniscience (Garberian):** Trying to model "learning logical implications." Too abstract for med researchers.
          *   **Subjective Priors Reconstruction:** Trying to reconstruct exactly what scientists believed in 1910. Too speculative/historical.
          *   **Purely Temporal:** "Known before time $t$." Time isn't the issue; epistemic independence is.
      *   *Reasoning:* Need operationalizable criteria, not metaphysical debates.

  3.  **Part 2: The Procedure (The "40-Minute Protocol"):**
      *   Need a flowchart style.
      *   *Step 1: Temporal/Epistemic Check.* (5 mins). Is $E$ truly old?
      *   *Step 2: Construction Check.* (10 mins). Was $E$ used to tune $H$? (The "Data Dredging" check).
      *   *Step 3: Anomaly Check.* (10 mins). Was $E$ a pain point for the competitor?
      *   *Step 4: Auxiliary Check.* (10 mins). Did we break the bank to make $H$ fit $E$?
      *   *Step 5: Counterfactual/Risk Check.* (5 mins). Could $H$ have failed?
      *   *Escalation:* If Step 2 or 4 is ambiguous.
      *   *Zero Credits:* If Step 2 is "Yes" (constructed to fit) AND Step 3 is "No" (not an anomaly).

  4.  **Part 3: Handling the Hard Cases (Integration into Procedure):**
      *   (i) Construction vs. Known: Addressed in Step 2.
      *   (ii) Auxiliaries: Addressed in Step 4.
      *   (iii) Anomaly vs. Explained: Addressed in Step 3.
      *   (iv) Old Data/New Quantity: This is key. It counts as *new* if the quantity wasn't conceptualized.
      *   (v) Double Counting: Addressed in Step 2 (Motivation vs. Test).
      *   (vi) Counterfactuals: Addressed in Step 5 ("Surprise" heuristic).

  5.  **Part 4: Running the Cases:**
      *   *Case 1 (Mercury/GR):*
          *   $E$: Perihelion precession. Old.
          *   $H$: General Relativity.
          *   Construction? No (Einstein didn't build GR to fix Mercury).
          *   Anomaly? Yes (Newton failed).
          *   Result: High credits (Retrodiction of Anomaly).
          *   Rival arrives: Credits don't vanish immediately, but likelihood ratio drops if rival explains it equally well without cost. Update when rival is tested.
      *   *Case 2 (Gut Metabolite/Programme B):*
          *   $E$: Cohort dataset.
          *   $H$: Metabolite X drives insulin resistance.
          *   Construction? **YES.** Metabolite picked *from* the dataset (p-hacking/selection effect).
          *   Anomaly? No, just a correlation search.
          *   Result: **ZERO CREDITS.** Hard truth. It's hypothesis generation, not testing.
      *   *Case 3 (Retrodiction/New Quantity):*
          *   $E$: Old dataset, new computed quantity $Q$.
          *   $H$: Predicts narrow range for $Q$.
          *   Status: New prediction *conceptually*, even if data is old.
          *   Flip condition: If the method of computing $Q$ was tuned to match $H$.

  6.  **Part 5: Limitations & Panel Advice:**
      *   Cannot solve the "Problem of Priors."
      *   Cannot detect subtle ad hocness without domain expertise.
      *   Credits are ordinal, not cardinal. Don't treat 10dB as twice as good as 5dB.
      *   Panel needs to know this is a *screening* tool, not a truth machine.

  7.  **Refining the Tone:**
      *   Needs to sound like someone who has sat in the meetings. "Look, I know the textbooks say X, but in the room, Y happens."
      *   Avoid overly technical Bayesian jargon where possible, but keep the logic rigorous (e.g., use "likelihood ratio" correctly).
      *   Be direct about Programme B. No sugarcoating.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "40 minutes" constraint? The steps need to be tight.
      *   *Check:* Did I address the "decibels/credits" system? Yes, keep the output in that format.
      *   *Check:* Is the distinction between "Old Evidence" (philosophical problem) and "Data Dredging" (practical problem) clear? They overlap in Programme B. I need to make sure the procedure treats "constructed from data" as a specific subset of old evidence that yields zero confirmation.
      *   *Check:* The Mercury case needs to handle the rival theory aspect carefully. Bayesian updating is diachronic.
      *   *Check:* Ensure the "New Quantity" case distinguishes between *data* being old and *prediction* being new.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Brainstorm" section comes first as requested. Make sure the "Procedure" is actionable. (Self-correction: Ensure I explicitly mention *why* I'm dropping certain philosophical distinctions in the brainstorm section).

  *(Self-Correction on Case 1)*: The prompt asks about credits coming back out when a rival is proposed. In strict Bayesianism, $P(H|E)$ drops if a rival $H2$ explains $E$ better. But do we *claw back* credits already awarded? In a renewal context, yes, the *current* confidence rating drops. I need to be clear that credits reflect *current* state of confirmation, not historical accumulation.

  *(Self-Correction on Case 2)*: This is the "Use-Novelty" problem. If the data selected the hypothesis, the likelihood ratio is biased. I need to be firm: Zero credits for confirmation. Maybe allow credits for "plausibility" but not "testing." The prompt asks for confirmation credits. So, zero.

  *(Self-Correction on Case 3)*: This is the "Musgrave/Maher" distinction. If the *concept* of the quantity is new, it's a novel prediction even if the numbers are old. I need to specify the "flip condition" clearly (e.g., if the algorithm was tuned).

  10. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### Part 1: Brainstorming the Old-Evidence Literature (Keep vs. Drop)

  Look, I've read the Glymour, the Garber, and the Howson. I've also sat in a room with six exhausted epidemiologists trying to decide if a p-value from 2015 counts for a mechanism proposed in 2023. The literature is full of distinctions that are theoretically precise but operationally dead on arrival. Here is the triage.

  **Distinctions to KEEP (Operationalizable):**

  1.  **Use-Novelty vs. Temporal Novelty:**
      *   *Why keep:* This is the core. Did the scientists *use* $E$ to construct $H$? If yes, $E$ cannot confirm $H$ (double counting). Temporal novelty (was $E$ known before $H$?) is secondary. We can check lab notebooks and methods sections for "use."
  2.  **Anomaly Status:**
      *   *Why keep:* Was $E$ a known failure of the *previous* dominant theory? If $H$ explains a standing anomaly, it earns credits even if $E$ is old. If $E$ was already well-explained, $H$ earns nothing for merely agreeing. We can check the citation history of the prior theory.
  3.  **Auxiliary Stability:**
      *   *Why keep:* Did we have to break or tweak our background assumptions ($A$) to make $H$ entail $E$? If $A$ was adjusted *post hoc* to save $H$, the confirmation is tainted. We can audit the model assumptions.
  4.  **Conceptual Novelty (The "New Quantity" Rule):**
      *   *Why keep:* The data might be old, but if the *variable* computed from it was not conceptualized until $H$ demanded it, it counts as a prediction. We can check if the metric existed in the literature prior to $H$.

  **Distinctions to DROP (Hopeless in Practice):**

  1.  **Logical Omniscience (The Garber Solution):**
      *   *Drop:* Garber suggests we update on the logical fact "$H$ entails $E$" rather than $E$ itself.
      *   *Why:* Your team cannot model the logical relation between $H$ and $E$ independently of the truth of $E$. It requires a level of formalization medical hypotheses rarely possess. It turns a 40-minute review into a 3-week logic project.
  2.  **Counterfactual Credence Reconstruction:**
      *   *Drop:* Trying to estimate "What would the probability of $E$ have been *before* $H$ was proposed?"
      *   *Why:* Pure speculation. You will get six different numbers from six different people based on their mood. It introduces noise, not signal.
  3.  **Purely Temporal Cutoffs:**
      *   *Drop:* "If published before date $X$, it's old."
      *   *Why:* Irrelevant. A dataset from 1990 can be a novel test in 2024 if no one looked at *this specific relationship* before. Time is a proxy for epistemic independence, but a bad one.
  4.  **Subjective vs. Objective Bayesianism:**
      *   *Drop:* Debating whether the priors are personal degrees of belief or logical constraints.
      *   *Why:* Your panel needs a shared currency (credits). We are acting as *intersubjective* Bayesians. We care about what the *field* should believe, not what Dr. Smith believes.

  ***

  ### Part 2: The 40-Minute "Old Evidence" Protocol

  **Goal:** Assign Log-Likelihood Credits (decibels) for a specific $(H, E)$ pair.
  **Constraint:** 40 minutes max per pair.
  **Team:** 6 assessors (non-philosophers).
  **Output:** A credit score (0 to +20 dB) or an Escalation Flag.

  #### Step 1: The Construction Check (10 Minutes)
  **Question:** Was $E$ (or the specific pattern in $E$) used to *construct*, tune, or select $H$?
  *   **Look for:** Methods sections saying "we selected variables based on correlation with outcome," or "the parameter was fitted to match this dataset."
  *   **Sufficient Answer:**
      *   **YES:** $H$ was built to fit $E$. **STOP. Assign 0 Credits.** (Reason: Use-Novelty violation. You cannot test a hypothesis with the data that built it).
      *   **NO:** $H$ was derived from theory/other data; $E$ is being used strictly for testing. **Proceed to Step 2.**
      *   **UNCLEAR:** Escalate to Panel. (Reason: This is the most common source of bias. Do not guess).

  #### Step 2: The Anomaly Check (10 Minutes)
  **Question:** Prior to $H$, was $E$ considered an *unexplained anomaly* or a *problem* for the prevailing theory ($H_{old}$)?
  *   **Look for:** Review articles or citations stating "$H_{old}$ fails to account for..." or "It remains unclear why..."
  *   **Sufficient Answer:**
      *   **YES (Standing Anomaly):** $H$ explains something $H_{old}$ could not. **Award +10 to +15 dB.** (Reason: Explanatory power over rivals).
      *   **NO (Already Explained):** $H_{old}$ already accounted for $E$ adequately. $H$ just agrees. **Award 0 to +5 dB.** (Reason: Consistency is not confirmation).
      *   **N/A (New Phenomenon):** $E$ is a new measurement (see Step 4). **Proceed to Step 3.**

  #### Step 3: The Auxiliary Stability Check (10 Minutes)
  **Question:** To make $H$ predict $E$, did the team have to adjust background assumptions (auxiliaries) *after* seeing $E$?
  *   **Look for:** Changes in inclusion criteria, statistical controls, or boundary conditions introduced in the paper analyzing $E$ that weren't in the pre-registered protocol for $H$.
  *   **Sufficient Answer:**
      *   **YES (Ad Hoc):** Auxiliaries were tweaked to save $H$. **Reduce Credits by 50% or Escalate.** (Reason: The fit is artificial).
      *   **NO (Stable):** $H$ predicts $E$ using standard, accepted background knowledge. **Proceed to Step 4.**

  #### Step 4: The Conceptual Novelty Check (5 Minutes)
  **Question:** Is $E$ "old data" but a "new quantity"?
  *   **Look for:** Did the specific metric/computation exist in the literature before $H$?
  *   **Sufficient Answer:**
      *   **YES (New Quantity):** The data is old, but no one computed *this specific ratio/metric* until $H$ demanded it. **Treat as Novel Prediction (+15 dB).**
      *   **NO (Old Quantity):** Everyone was looking at this number; $H$ just got lucky it matched. **Treat as Accommodation (Refer to Step 2 score).**

  #### Step 5: The Riskiness/Surprise Check (5 Minutes)
  **Question:** If $E$ had turned out differently, would $H$ have been falsified?
  *   **Look for:** Narrow prediction intervals vs. "it could be anything."
  *   **Sufficient Answer:**
      *   **YES (Risky):** $H$ stuck its neck out. **Add +5 dB.**
      *   **NO (Vague):** $H$ is compatible with almost any outcome. **Add 0 dB.**
      *   **JUDGMENT CALL:** If the team disagrees on "surprise," **Escalate to Panel.** (Reason: This is where "judgment in a lab coat" lives. Do not average the numbers; let the panel debate the risk).

  ***

  ### Part 3: Running the Cases

  #### Case 1: The Calibration Case (General Relativity & Mercury)
  *   **Context:** 1915. $H$ = General Relativity. $E$ = Perihelion precession of Mercury (known since 1859).
  *   **Step 1 (Construction):** Did Einstein build GR to fix Mercury? **NO.** He was working on the field equations; Mercury was a check. **Pass.**
  *   **Step 2 (Anomaly):** Was Mercury a problem for Newton? **YES.** It was a famous 43 arc-seconds/century discrepancy. **Score: +12 dB.**
  *   **Step 3 (Auxiliaries):** Did he tweak assumptions to fit it? **NO.** The value fell out of the field equations. **Pass.**
  *   **Step 4 (Novelty):** Old quantity. **N/A.**
  *   **Step 5 (Risk):** Could GR have failed? **YES.** It could have predicted any value. **Score: +5 dB.**
  *   **Total:** **~17 dB.** (High confirmation, despite old evidence, because it solved a standing anomaly without construction).
  *   **The Rival:** A rival theory ($H_{rival}$) is proposed later that also explains Mercury.
      *   **Do credits come back out?** Yes. Confirmation is comparative. If $P(E|H) \approx P(E|H_{rival})$, the likelihood ratio drops toward 1.
      *   **When?** At the moment the rival is shown to be *viable* (mathematically consistent), not necessarily when tested. However, for your renewal panel: **Claw back the credits only when the rival survives its own Step 1 & 2 check.** Until the rival is confirmed, $H$ remains the best explanation of the anomaly. Don't penalize $H$ for the existence of a rival, only for the *confirmed success* of a rival.

  #### Case 2: The Problem Child (Programme B, Gut Metabolite)
  *   **Context:** $H$ = Metabolite X drives insulin resistance. $E$ = Cohort dataset where X was selected *because* it tracked the outcome.
  *   **Step 1 (Construction):** Was $E$ used to construct $H$? **YES.** The prompt says: "the metabolite was picked... by seeing which one tracked the outcome in that dataset."
  *   **Action:** **STOP. ASSIGN 0 CREDITS.**
  *   **The Hard Truth:** I know your team loves this programme. I know the PIs are stars. But this is data dredging masquerading as confirmation. You have selected the hypothesis *on the basis of the evidence* you are now using to test it. The likelihood ratio is mathematically biased.
  *   **What to tell them:** "This dataset counts as **Generation**, not **Testing**. You get no confirmation credits for $E$. You must find a *new* dataset ($E_{new}$) where Metabolite X was measured *without* selection bias to earn credits. Until then, this hypothesis is unconfirmed."
  *   **Why:** If you give credits here, you incentivize p-hacking. You are the funder; you must be the brake pedal.

  #### Case 3: The Retrodiction Case (Old Data, New Quantity)
  *   **Context:** Old dataset. $H$ predicts a specific derived quantity $Q$ (e.g., a specific ratio of two markers). $Q$ falls in the range.
  *   **Step 1 (Construction):** Was $Q$ used to build $H$? **NO.** $H$ predicted $Q$ theoretically.
  *   **Step 4 (Conceptual Novelty):** Did $Q$ exist as a metric before $H$?
      *   **Scenario A:** No one ever computed this ratio before. **Treat as Novel Prediction.** Score: **+15 dB.** (The data is old, but the *test* is new).
      *   **Scenario B:** People computed this ratio, but ignored it. **Treat as Accommodation.** Score: **+5 dB.**
  *   **The Flip Condition:** What single fact flips this from "New Prediction" to "Old Accommodation"?
      *   **The Fact:** If the *method of computation* for $Q$ was adjusted *after* seeing the data to make it fit $H$. (e.g., "We tried three different ways to normalize the markers, and this one worked.") If the algorithm is flexible, the "New Quantity" defense fails. It becomes Step 3 (Auxiliary Stability) failure.

  ***

  ### Part 4: Limitations & Panel Advice

  **Where this Procedure Will Misfire:**
  1.  **The "Soft Ad Hoc" Problem:** Step 3 relies on spotting adjusted auxiliaries. Sophisticated teams will hide these adjustments in complex statistical modeling choices (e.g., choosing a specific covariance structure). Your team might miss this without deep domain expertise.
      *   *Mitigation:* Require a "Pre-Analysis Plan" attachment for future funding. If it wasn't written down, assume it was tuned.
  2.  **The "Rival Theory" Blindspot:** This procedure scores $H$ in isolation (mostly). It doesn't automatically scan for $H_{rival}$. If a better theory exists but isn't cited, $H$ gets inflated credits.
      *   *Mitigation:* Instruct the panel to ask: "Is there any other mechanism that explains the Anomaly (Step 2) equally well?"
  3.  **Precision Illusion:** Decibels look precise. 15 dB looks better than 12 dB. In reality, these are ordinal buckets (Low, Medium, High).
      *   *Mitigation:* Tell the panel: "Treat credits as traffic lights. 0-5 is Red (Stop/Re-evaluate), 6-12 is Amber (Continue with caution), 13+ is Green (Strong support). Do not sum them across different evidence types to get a 'total score' without weighing the independence of the evidence."

  **What to Tell the Panel:**
  "These credits measure **epistemic risk**, not truth. A high score means the hypothesis stuck its neck out and didn't get it chopped off. A low score means the hypothesis is either safe (boring) or rigged (dredged). Programme B (Case 2) has a low score not because it's false, but because it hasn't *risked* being false yet. Do not confuse 'unconfirmed' with 'disproven.' But do not renew high-budget programmes on unconfirmed hypotheses."

  **Final Note on Judgment:**
  There are three places where I told you to **Escalate**:
  1.  Ambiguous Construction (Did they peek at the data?).
  2.  Ambiguous Auxiliaries (Did they tune the model?).
  3.  Ambiguous Risk (Would they have accepted a failure?).

  These are the "Judgment in a Lab Coat" moments. Do not let your team average these out. These are the moments that require the senior panel to look the PI in the eye and ask: "Be honest, if the number had been 10% lower, would you have published this?" The procedure can't answer that. People can.
