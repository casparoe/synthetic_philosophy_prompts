      *   **Key Constraint 2 (Specific Idea):** Inject the idea of "design-level epistemic closure." We *cannot* access our own neural dynamics (like a user can't access the kernel). This is permanent, not temporary ignorance.
      *   **Key Constraint 3 (Negative Constraint):** Do *not* imply that science or introspection can ever "pull back the curtain." No "someday we will know."
      *   **Key Constraint 4 (Accessibility):** Honor the experts without losing the family. No bibliographic references, no reading lists, no verbatim quotes.
