answer: |-
  **The Toast**

  Good evening. For those who don't know me, I am the groom's brother. Eight months ago, I stood in a registrar's office on a Tuesday afternoon with two witnesses I had met that morning. It was quiet, it was quick, and it was ours. Standing here tonight, surrounded by this music, these flowers, and all of you, I am reminded that while the destination of marriage is the same for everyone, the roads we take to get there are wonderfully different.

  I want to begin by thanking the bride's parents. Your generosity in gathering us here has created a space where we can all witness this beginning together. It is a rare gift to be surrounded by so much history and so much hope in one room.

  When I think about what brings us to this moment, I don't think about the venue, or the date, or the planning. I think about the choices that happened in quiet rooms, long before the invitations were sent.

  I think about my brother, and the motorcycle he spent four years rebuilding in the garage. It was a project of pure passion, a thing of grease and steel that he loved. And I think about the bride, and the fellowship she was offered abroad, a chance to pursue her work in a city she has dreamed of visiting since she was a student.

  Neither of those things is here tonight. The motorcycle was sold; the fellowship was declined.

  In a world that often asks us to accumulate more, to keep every option open, and to prioritize our own individual trajectories, the two of them chose a different path. They chose to close doors so they could walk through one together. They understood that a life built together requires space, and sometimes making that space means putting down the things you love the most, not because they lack value, but because what you are building together holds more.

  That is the quiet engine of this marriage. It is not found in the grandeur of this hall, but in the specific, private renunciations you have already made for one another. Those choices tell us everything we need to know about your resolve.

  But a marriage is not a private contract; it is a public architecture. If it were just about the two of you, you could have stayed home. You are here because a promise needs a community to hold it. We are not merely an audience for your celebration; we are the witnesses who will help you keep your word. When the road gets difficult, as it sometimes does, you will not need to rely solely on your own memory of why you started. You will be able to look out at the faces in this room, and remember who stood with you when you began.

  So, I am not going to say that you two need no one else. That would be untrue, and it would ignore the reason we are all here. You have us. We are enrolled in this with you.

  **The strength of a vow is found not in the scale of the celebration, but in the specific, private things you were willing to leave behind to keep it.**

  Please raise your glasses. To the motorcycle, to the fellowship, and to the future you have chosen over them both. To the bride and groom.

  ***

  **Analysis of Ruled-Out Sentences**

  Here are the sentences the theoretical constraints ruled out, and why they were excluded:

  1.  **"You two don't need anyone else; you have everything you need in each other."**
      *   **Why ruled out:** As you noted, the wedding functions to *enroll* the guests as enforcers and supporters of the union. Stating the couple is self-sufficient negates the social utility of the gathering. If they need no one, the guests are merely spectators, and the "mechanism" of the wedding (public accountability) is broken.
  2.  **"This magnificent party is proof of how deeply you love one another."**
      *   **Why ruled out:** Under the handicap principle, a signal is only reliable if the *signaler* bears the cost. Since the bride's parents bore the financial cost, the expenditure signals *their* commitment and status, not the couple's. Attributing the cost to the couple's love is theoretically invalid and risks implying the couple is taking credit for their parents' generosity.
  3.  **"My wedding was small, but at least we paid for it ourselves."**
      *   **Why ruled out:** This violates the constraint against sneering at the current wedding or implying your own was "more honest." It creates a competitive dynamic between the two marriages (differential cost between siblings) which undermines the affection of the toast and risks offending the mother and the bride's family simultaneously.
  4.  **"I hope you enjoy the party without worrying about the bill!"**
      *   **Why ruled out:** Jokes about cost or debt point directly at the financial burden. A signal whose cost damages the condition it advertises is self-undermining. Highlighting the debt implies the signal is a burden that might weaken the union, rather than a demonstration of resolve.
  5.  **"This proves you are committed."**
      *   **Why ruled out:** You specified that signals concern *interests and resolve* rather than affections, and that nothing is strictly "proved." Using definitive language like "proves" turns the toast into a lecture on verification rather than an observation of character. It also risks sounding like an economic audit.
