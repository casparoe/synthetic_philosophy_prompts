answer: |-
  # Thesis Defense Prep Sheet: Indexed Selected-Effect Account

  **Candidate:** [Your Name]
  **Topic:** Indexed Selected-Effect Theory (Somatic Cell-Lineage Selection)
  **Time:** 20 min presentation + 15 min Q&A
  **Language:** American English

  ---

  ## 1. Opening Concessions (First 2 Minutes)
  *Do not wait for them to ask these. State them in your closing remarks or immediately after the intro to disarm the Chair and the Biologist.*

  1.  **Concede the Terminology:** Acknowledge that calling somatic traits "functions" is stipulative. You are not claiming this is how biologists currently use the word in every context, but that it is a necessary precision for evolutionary theory to account for intra-organismal conflict.
  2.  **Concede the Boundary Problem:** Admit upfront that distinguishing a "selecting population" (like a stem cell lineage) from an "arbitrary collection of cells" is the hardest part of the view. You are proposing criteria (replication fidelity, heritable variation), but you are not claiming a perfect algorithm exists yet.
  3.  **Concede the Verbal Risk:** Tell the Chair you know this risks being a verbal dispute. Your defense is that indexing resolves explanatory gaps (cancer, *de novo* genes) that non-indexed views treat as anomalies or errors.

  ## 2. The "One Thing" You Must Hold
  **The Core Claim:** Function is not a monadic property of a trait relative to an organism; it is a **relational property** between a trait and a specific reproducing population.
  *   *If you cave on this:* If you agree that function must always be anchored to the organism's fitness to be "real" function, your chapter collapses into standard SE theory, and you lose the ability to explain cancer as functional (for the cell) but dysfunctional (for the organism).
  *   *Hold the line:* You can concede that organismal function is the *most important* function for medicine, but not the *only* function that exists metaphysically.

  ## 3. The Question You Hope Nobody Asks
  **The "Level Shopping" Objection:**
  *"If I get to pick the population, I get whatever function I want. Does a transposon have a function relative to itself? Does a virus inside a cell have a function relative to the viral population? If so, isn't 'function' just gerrymandered to fit whatever narrative I choose?"*

  *   **Why it's deadly:** It suggests your indexing is arbitrary. If everything has a function relative to its own replication, the term loses normative force.
  *   **Backup Answer:** You restrict populations to those integrated into a higher-level system where conflict is possible. A free virus is just an organism. A virus inside a host is a competing lineage. The "gerrymandering" is actually identifying real biological conflicts.
  *   **Honest Soft Spot:** You don't have a clean metaphysical rule for when a population is "legitimate" enough to index to, other than "it replicates and heritably varies." This bleeds into your worry about cell lineages.

  ---

  ## 4. The 8 Likely Objections
  *Ordered by Likelihood × Damage.*

  ### Q1: The Biologist (High Likelihood / High Damage)
  **"In my lab, if I want to know the function of a protein, I knock it out and see what breaks. I don't sequence the ancestry of the cell line. If your definition requires a selection history I can't assay, what work is it actually doing for me?"**

  *   **Answer:** Your knockout method identifies the *current capacity* (Cummins-style), which is vital for intervention. My account explains *why that capacity is there* in the first place, even when it harms the patient. In cancer, you knock out a mutation and the tumor shrinks. Standard theory says that mutation is a 'breakage.' My theory says it's functioning perfectly for the tumor lineage. This explains why the tumor fights back when you treat it—it's not just broken machinery; it's an adapting population.
  *   **Honest Soft Spot:** I admit this doesn't change your pipetting protocol tomorrow. The payoff is conceptual clarity in evolutionary medicine, not a new assay.

  ### Q2: The Hardline SE Theorist (High Likelihood / High Damage)
  **"Selection requires inheritance across generations of organisms. Somatic mutation is a dead end. To call this 'selection' is to dilute the term until it covers any causal process. Isn't this just a disposition masquerading as a historical function?"**

  *   **Answer:** It's not a dead end; it's a branching lineage within the soma. Stem cells divide, mutate, and some clones outcompete others over the lifespan of the organism. That meets the minimal criteria for Darwinian populations: variation, heredity, and differential fitness. The 'history' is the cell-division history, not the organismal reproductive history.
  *   **Honest Soft Spot:** I concede the 'generations' are shorter and the fidelity is lower than organismal reproduction. If the mutation rate is too high, the lineage dissolves, and my account fails there.

  ### Q3: The Modern SE Theorist (Medium Likelihood / High Damage)
  **"You claim this handles de novo genes. But if a gene arises from non-coding sequence, it has zero selection history by definition. How can a Selected-Effect account assign function to something with no past selection?"**

  *   **Answer:** In the standard view, *de novo* genes are functionless until they fix in the species. In my indexed view, if that gene provides an immediate advantage to the cell lineage (e.g., rapid division in a specific tissue context), it acquires a function relative to that somatic population immediately. The 'history' required is the immediate clonal expansion, not deep phylogenetic time.
  *   **Honest Soft Spot:** This stretches 'history' to the breaking point. If the gene appears and works instantly, is it really 'selected' yet, or just lucky? I'm relying on the immediate expansion counting as the first step of selection.

  ### Q4: The Causal-Role Theorist (Medium Likelihood / Medium Damage)
  **"Cummins can handle this easily. The 'containing system' is the cell, not the organism. The function is the contribution to the cell's capacity to divide. Why do I need your etiological baggage?"**

  *   **Answer:** Because CR can't explain **dysfunction** in the way we need. For CR, if the cell divides, the function is fulfilled. It can't say the cell is 'malfunctioning' relative to the body without arbitrarily switching systems. My account explains the conflict: the trait has a function (cell index) and a dysfunction (organism index) simultaneously. CR forces you to pick one system and ignore the conflict.
  *   **Honest Soft Spot:** A clever CR theorist can just define the system as 'the organism' and call the cell's behavior a 'failure of regulation.' I have to argue that ignoring the cell's perspective loses explanatory power about cancer progression.

  ### Q5: The Chair (Medium Likelihood / High Damage)
  **"Is this more than a verbal dispute? You're defining 'function' differently. If we stick to the standard definition, your problem disappears. Why shouldn't we just say cancer cells have no proper function?"**

  *   **Answer:** Because saying they have 'no function' implies they are inert or broken. They aren't. They are highly active, adapted, and competitive. If we say they have no function, we can't use evolutionary models to predict their behavior. My definition isn't just semantic; it licenses the use of evolutionary game theory in somatic tissues.
  *   **Honest Soft Spot:** It is partly verbal. I am arguing for a terminological shift to match biological reality. If the committee prefers to keep 'function' reserved for organismal fitness, my model still works, but we'd have to call it 'somatic adaptation' instead.

  ### Q6: The Modern SE Theorist / You (High Likelihood / High Damage)
  **"You're worried about this too: What makes a cell lineage the right kind of population? Why not index to a collection of mitochondria? Or a patch of skin cells that don't replicate? Where do you draw the line?"**

  *   **Answer:** The line is **heritable replication with variation**. Mitochondria replicate, so they can be indexed (and often conflict with the nucleus). A patch of non-replicating skin cells is not a population in the evolutionary sense, so no indexing. I'm relying on the standard population biology criteria, just applied at a micro-scale.
  *   **Honest Soft Spot:** This is my weakest flank. Distinguishing a 'lineage' from a 'transient cluster' in complex tissues is messy. I don't have a strict threshold for how much heredity is required before the index dissolves.

  ### Q7: The Biologist (Medium Likelihood / Low Damage)
  **"In tumor heterogeneity, we see subclones competing. But we usually call this 'evolution,' not 'function.' If I write a paper saying 'the function of this mutation is to evade immunity,' reviewers will reject it. Are you telling me the literature is wrong?"**

  *   **Answer:** The literature isn't wrong; it's inconsistent. Biologists often speak loosely. They say 'function' when they mean 'effect.' I'm trying to tighten the vocabulary so that when you say 'function,' it implies a selected effect, and when you say 'effect,' it implies a causal role. My account validates the intuition that the mutation is 'doing something' without conflating it with organismal health.
  *   **Honest Soft Spot:** I am prescribing how you *should* talk, not describing how you *do* talk. You're right that my terminology might confuse reviewers until the field shifts.

  ### Q8: The Causal-Role Theorist (Low Likelihood / Medium Damage)
  **"If dysfunction is just conflict between indexes, doesn't that make dysfunction ubiquitous? Every trait benefits some lower-level unit (genes, cells) at a cost to the higher level. Is everything dysfunctional?"**

  *   **Answer:** No, because in healthy organisms, the indexes are aligned. Mechanisms exist to suppress cell-level selection (apoptosis, immune surveillance) to align cell function with organism function. Dysfunction arises when that alignment breaks (e.g., cancer). It's not ubiquitous; it's a specific failure of suppression mechanisms.
  *   **Honest Soft Spot:** This relies on the assumption that alignment is the 'default.' In a multilevel selection framework, conflict is always simmering. I have to argue that 'health' is the suppression of lower-level indexing, which is a strong claim.

  ---

  ## 5. Final Strategy Note
  **Watch your language.**
  *   When talking to the **Biologist**, drop the word "metaphysics." Use "mechanism," "assay," and "prediction."
  *   When talking to the **Hardline SE**, emphasize "heredity" and "differential fitness."
  *   When talking to the **Chair**, emphasize "explanatory power" over "truth."

  **If you get stuck:**
  Return to the cancer case. It is your strongest intuition pump. Everyone agrees cancer cells are adapted. Everyone agrees they are harmful. Your theory is the only one that cleanly explains how something can be both adapted (functional for X) and harmful (dysfunctional for Y) without contradiction. Use that anchor.
