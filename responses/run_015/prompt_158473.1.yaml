answer: |-
  This is a really sharp set of intuitions. You are essentially rediscovering the distinction between **inherent politics** (the technology *requires* a specific power structure to function) and **compatibility politics** (the technology *can be used* to enforce power, but doesn't require it).

  Your proposed principle is very close to the mark: *"Whether an artifact enforces a specific social ordering that works regardless of the user's intent."*

  I think you can keep all your verdicts without dropping one, but you need to add one specific clause to your principle to make the "Smart Lock" and "Bicycle" distinctions hold up logically.

  ### The Refined Principle
  Your principle needs to account for **sovereignty**. Here is the tweak:

  > **"An artifact has politics if it encodes a power relationship that persists regardless of the end-user's intent, and where the authority to change that relationship lies outside the user's control."**

  Let's run your verdicts through this refined filter to see if it holds.

  1.  **Nuclear Reactor / Low Bridge:**
      *   **Verdict:** Yes.
      *   **Test:** Can a local community decide to run the reactor democratically? No (safety/complexity demands hierarchy). Can a bus driver decide to drive over the bridge? No (physics/design prevents it).
      *   **Result:** The ordering persists regardless of intent. Authority is external (engineering/safety/state). **Matches.**

  2.  **Regular Bicycle:**
      *   **Verdict:** No.
      *   **Test:** Does it enforce a social ordering? No, it's a lever for human power. Does it work regardless of intent? No, if you don't pedal, it doesn't move. Can you change how it's used? Yes (commute, sport, protest).
      *   **Result:** The authority lies with the rider. **Matches.**

  3.  **Recommendation Algorithm:**
      *   **Verdict:** Yes (Mutable).
      *   **Test:** Does it enforce ordering? Yes (visibility/attention). Regardless of intent? Yes (you can't "will" the algo to show you something else). Authority outside control? Yes (engineers/owners update it weekly).
      *   **Result:** The mutability doesn't make it neutral; the *control over the mutability* makes it political. **Matches.**

  4.  **Smart Lock (Local/Open) vs. (Cloud/Proprietary):**
      *   **Verdict:** Local = Neutral; Cloud = Political.
      *   **Test:**
          *   *Local:* You decide who gets in. If you want to let everyone in, you can. Authority is yours.
          *   *Cloud:* The vendor decides if the server is up, if your account is valid, or if they log the entry. You cannot opt out of the logging without abandoning the lock.
      *   **Result:** This is the crucial test. Your intuition here is about **sovereignty**. The cloud lock enforces a relationship (user/vendor) that you cannot renegotiate. **Matches.**

  5.  **Paper Form vs. Online Portal:**
      *   **Verdict:** Both Political (Opposite directions).
      *   **Test:**
          *   *Paper:* Enforces anonymity. Even if the clerk *wants* to know who you are, the artifact (the unlogged paper) resists that intent.
          *   *Online:* Enforces identification. Even if you *want* to be anonymous, the artifact (IP logging) resists that intent.
      *   **Result:** Both encode a power dynamic (accountability vs. privacy) that overrides individual preference in the moment of use. **Matches.**

  ### The 3D Printer Prediction

  Now, let's apply the principle to your 3D printer scenario: *A printer that can build prosthetic limbs or firearms depending only on the file loaded.*

  **The Prediction: The artifact is Politically Neutral (No).**

  **Why?**
  1.  **Intent:** The outcome is entirely dependent on the user's intent (the file). The artifact does not resist the user; it obeys the G-code.
  2.  **Authority:** The authority to decide "limb vs. gun" lies with the user, not the machine's design.
  3.  **Social Ordering:** It does not inherently enforce a hierarchy. It is a "General Purpose Technology."

  **However, here is the edge case where it becomes Political (Yes):**
  If the printer has **Digital Rights Management (DRM)** or firmware that scans files and refuses to print "gun" geometries (or conversely, refuses to print "medical" devices without a license), it immediately becomes political.
  *   **Why?** Because now the artifact enforces a specific social ordering (regulatory compliance) *regardless of the user's intent*, and the authority to define "gun" vs. "limb" lies outside the user's control (in the firmware/company).

  ### Summary of the Tension
  You were worried about the "mutable" nature of the algorithm vs. the "fixed" nature of the bridge. The principle resolves this by looking at **who holds the keys to the mutation.**

  *   **Concrete Politics:** The bridge is hard to change, so the politics are static.
  *   **Software Politics:** The algorithm is easy to change, but because *you* don't hold the keys, the politics are still authoritarian, just dynamic.
  *   **Tool Neutrality:** The bicycle and the open 3D printer are neutral because *you* hold the keys to the action.

  Your gut is correct. You don't need to drop a verdict. You just need to recognize that "Politics" in this context isn't about "Liberal vs. Conservative," it's about **"Who has the power to renegotiate the rules of interaction?"** If the artifact says "No, the rules are me," it has politics. If it says "The rules are you," it's a tool.
