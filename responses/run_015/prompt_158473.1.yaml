          *   Forms: Paper (anonymity) vs. Online (surveillance). Both enforce different orderings of accountability. User says "Both political". (Matches).
      *   *Critique:* The "regardless of user intent" part is crucial. It aligns with Winner's idea of *inherency* vs. *consequence*. The "mutable" part addresses the software distinction.
      *   *Potential Conflict:* The Bicycle. Does a bicycle enforce a social ordering? In a car-centric city, yes (marginalization). But as an artifact *itself*? Winner might argue it's compatible with many political systems. The user says "No". This fits the principle if we define "social ordering" as *coercive hierarchy* rather than just *affordance*.
