      *   **Case Study:** Newton's Bucket (argues it yielded real knowledge about absolute motion; Newton vs. Leibniz disagreement proves TEs aren't just arguments).
      *   **Audience:**
          1.  Committed Nortonian (TEs = arguments, no new info).
          2.  Structuralist (TEs = experiments on models - *ally, but maybe rival interpretation*).
          3.  Agnostics (TEs = heuristics/motivators).
      *   **Goal:** A Q&A prep sheet ordered by damage potential, with objections in their vocabulary, short replies, and weakness analysis. Include the "hope nobody asks" objection.

  2.  **Deconstruct the User's Position vs. Audience Positions:**
