      *   *Re-evaluating Damage:* The Nortonian attack is the most philosophically rigorous threat. The "Newton was Wrong" attack is the most empirically obvious threat. I'll rank Norton first because it undermines the *mechanism* of knowledge, whereas "Newton was Wrong" undermines the *outcome*.

