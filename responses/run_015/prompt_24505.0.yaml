      *   **Objection 4 (Structuralist/Ally):** The Model Ontology. (Where does the model exist?)
      *   **The "Hope Nobody Asks":** The Gettier-style luck problem or the Truth condition. Let's go with the Truth Condition regarding Absolute Space.

      *Wait, one nuance:* The User says "Newton's Bucket... yielded real knowledge (the concept of absolute motion)." This is a strong claim. A philosopher will pounce on "Absolute Motion is not real." I need to make sure the reply handles this carefully. Maybe frame it as "knowledge of the *problem space*" or "knowledge that rotation is distinguishable from translation."

