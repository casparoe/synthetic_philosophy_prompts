      *   *Norton:* TEs = Arguments. Premises $\rightarrow$ Conclusion. If valid, no new info (just unpacking premises). If new info, premises were hidden empirical claims.
      *   *Structuralist:* TEs = Manipulating mental models. (Close to User, but might emphasize the *structure* over the *empirical constraint*).
      *   *Agnostics:* TEs = Psychological tools to shift perspective, not truth-tracking.

  3.  **Identify Potential Objections (Brainstorming):**
