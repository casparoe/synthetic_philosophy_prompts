  A more coherent account emerges if we treat **Case 3 as the outlier**. By overturning the verdict in Case 3, we can preserve a single, tight principle that explains the remaining cases and aligns with standard action theory.

  #### The Principle
  **An agent acts intentionally if and only if they actively commit to a causal chain where the outcome is a foreseen consequence, provided that (a) the outcome is normatively negative (harm) or (b) the causal chain is direct (commission).**

  *Refined for your specific pattern:*
  **Intentionality is ascribed when an agent actively commissions a causal chain leading to a foreseen outcome, *unless* the outcome is positive (help) *or* the action is an omission.**

  Formally:
  1.  **Commission + Foreseen Harm** $\rightarrow$ **Intentional**
  2.  **Commission + Foreseen Help** $\rightarrow$ **Unintentional**
  3.  **Omission + Foreseen Harm** $\rightarrow$ **Unintentional**

  #### Mapping the Principle to Settled Cases

  *   **Case 1 (Factory/Toxin):** Fits Clause 1. The owner *commissions* a system (active commitment) knowing *harm* is a certain byproduct. The normative weight of the harm overrides the side-effect status. **Verdict: Intentional.**
  *   **Case 2 (Factory/Clean Water):** Fits Clause 2. The owner *commissions* a system, but the byproduct is *help*. Without normative negativity, side effects remain unintentional. **Verdict: Unintentional.**
  *   **Case 4 (Ambulance/Death):** Fits Clause 3. The administrator *omits* support (terminates contract). Even though harm is foreseen, the lack of active causal commission weakens the intentionality ascription. **Verdict: Unintentional.**

  #### Identifying the Outlier: Case 3
  **Case 3 (Drone/Supplies)** is the incoherent element. You judged foreseen *help*, delivered *accidentally* by an *autonomous* system, as **Intentional**.

  This verdict conflicts with the principle derived from Cases 1, 2, and 4 for two reasons:
  1.  **It violates the Harm-Help Asymmetry:** In Case 2, mechanical help was unintentional. In Case 3, autonomous help is intentional. This suggests autonomy flips the valence threshold.
  2.  **It violates the Control Condition:** You specify the drones "accidentally deliver." In standard action theory, an outcome that is accidental to the immediate actor (the drone) cannot be intentional for the delegator (the researcher), even if foreseen as a possibility. To judge this as intentional conflates **Moral Responsibility** (the researcher is responsible for the drone's actions) with **Intentional Action** (the researcher guided the outcome).

  **Defense for Overturning Case 3:**
  You should overturn the verdict in Case 3 to **Unintentional**.
  *   **Reasoning:** Intentionality requires that the outcome be non-accidental relative to the plan. In Case 1, the toxin release was physically necessitated by the filter (non-accidental). In Case 3, the supply drop was stochastic ("might," "accidentally"). Judging this as intentional stretches the concept to cover *recklessness* or *responsibility*, not intention.
  *   **Theoretical Gain:** Overturning Case 3 preserves the **Harm-Help Asymmetry** even when the causal chain is mediated by autonomous systems. It confirms that autonomy does not magically transform foreseen side-effects into intentional goals; it merely complicates the chain of responsibility.

  #### Predictions

  **Case 5 (Teacher/Exam):**
  *   **Structure:** Commission (construct exam) + Foreseen Harm (student fails) + Certainty ("knows will cause").
  *   **Prediction:** **Intentional.**
  *   **Explanation:** This matches Case 1 structurally (Commission + Harm). Your oscillation likely stems from the **Goal Legitimacy**. In Case 1, the goal was "saving money" (selfish). In Case 5, it is "maintaining standards" (professional/normative). While the *action* is intentional under the principle, the moral justification creates cognitive dissonance, leading to oscillation. However, strictly speaking, the harm was a committed, foreseen means/end trade-off, making it intentional.

  **Case 6 (AI Safety System):**
  *   **Scenario:** An AI autonomously blocks a harmful action that its human operator had foreseen but failed to prevent.
  *   **Structure:** Commission (deploy AI) + Foreseen Help (harm blocked) + Autonomy.
  *   **Prediction:** **Unintentional.**
  *   **Explanation:** If we overturn Case 3 to maintain coherence, then autonomous help remains a side effect. The operator deployed the AI for safety (presumably), but if the specific block was an autonomous decision the operator "failed to prevent" (implying a lack of direct control or specific intent for that instance), it counts as a foreseen byproduct of the system's deployment. Under the **Normatively-Weighted Causal Commitment** principle, Help via Commission is Unintentional. The autonomy does not elevate it to intentionality.

  #### Addressing Your Theoretical Questions

  1.  **Does the Harm-Help asymmetry survive autonomous mediation?**
      *   **Yes**, provided Case 3 is overturned. Harm via autonomous commission (e.g., deploying a drone that you know will likely crash into a house) would remain **Intentional** (matching Case 1). Help via autonomous commission (e.g., deploying a drone that happens to save a cat) remains **Unintentional** (matching Case 2). Autonomy affects *responsibility*, not the *intentionality* of the side effect.

  2.  **Does omission weaken intentionality for harm in the same way directness weakens it for help?**
      *   **Yes.** Case 4 demonstrates that **Omission** functions as an "intentionality dampener" for harm, just as the **Side-Effect Status** functions as a dampener for help (Case 2).
      *   In Case 2 (Help), the outcome is "merely" a side effect $\rightarrow$ Unintentional.
      *   In Case 4 (Harm), the action is "merely" an omission $\rightarrow$ Unintentional.
      *   Both conditions remove the "Active Causal Commitment" required to override the default presumption that side effects and omissions are unintentional.

  ### Summary
  Your intuitions in Cases 1, 2, and 4 form a robust pattern: **Intentionality requires active commission of a foreseen harm.** Case 3 is the outlier because it attributes intentionality to an accidental outcome simply because it was helpful and autonomous. Overturning Case 3 yields a cleaner, more defensible theory of action that distinguishes between *being responsible for* an outcome and *acting intentionally* to bring it about.
