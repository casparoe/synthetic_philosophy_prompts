answer: |-
  # Spec: Desiderata for a Robust Theory of Program Equilibrium

  To move Program Equilibrium (PE) from a modal logic curiosity to a mechanism for distributed commitment (smart contracts, license reciprocity, autonomous agents), the theory must treat code not just as a strategy function, but as a physical artifact subject to verification costs, hardware constraints, and adversarial modification.

  ### 1. The Desiderata

  **D1: Verifiable Binding (The Hash-Reality Gap)**
  The theory must distinguish between *source equality* and *behavioral equality*. It is not enough that Agent A reads Agent B's source; Agent A must have a cryptographic guarantee that the running binary corresponds to that source and has not been patched in memory.
  *   *Requirement:* Mechanism for Remote Attestation or Zero-Knowledge Proofs of Execution (zk-SNARKs of runtime).

  **D2: Fork Resistance (Provenance Integrity)**
  It must handle the case where an agent proves it ran *a* code, but not that it didn't fork the state *before* running it. (e.g., "I ran the contract, but I rolled back the blockchain state to before I lost money.")
  *   *Requirement:* Commitment must bind to a specific, append-only history or physical state that cannot be rewound without detection.

  **D3: Computational Feasibility (The Halting Constraint)**
  A PE theory cannot rely on unbounded simulation. If Agent A simulates Agent B to determine best response, and B simulates A, the system hangs.
  *   *Requirement:* A bounded resource model (gas, time-steps) where verification terminates in polynomial time relative to the contract size, or a formal proof of termination that is cheaper to verify than to execute.

  **D4: Environmental Agnosticism (Heterogeneous Compute)**
  The equilibrium must hold even if agents run on mismatched hardware (e.g., one on a secure enclave, one on open iron, one on a VM). The theory cannot assume a unified "God interpreter."
  *   *Requirement:* Abstraction of the execution environment into a trust metric. Equilibrium conditions must adjust based on the verified trustworthiness of the opponent's hardware.

  **D5: Obfuscation Tolerance**
  Agents may wish to hide proprietary logic while proving compliance (e.g., "I will match your price, but you don't need to know my cost basis").
  *   *Requirement:* Support for functional verification without full source disclosure. The equilibrium must be stable even if source code is opaque but input/output behavior is provably constrained.

  **D6: Graceful Degradation (Fail-Defect)**
  If verification fails (timeout, hash mismatch, attestation error), the system must default to a safe Nash Equilibrium (usually defection/non-cooperation) rather than undefined behavior or exploitation.
  *   *Requirement:* Explicit error states in the strategy space that are themselves part of the equilibrium analysis.

  ---

  ### 2. Tension Points (Jointly Unsatisfiable Pairs)

  A serious theory must acknowledge where physics and logic collide. These are the impossibility results that define the boundary of the feasible.

  **T1: Full Transparency vs. Strategic Privacy (The Poker Problem)**
  *   *Conflict:* D1 (Verifiable Binding) generally requires full source disclosure to verify logic. D5 (Obfuscation Tolerance) requires hiding logic to prevent exploitation.
  *   *Verdict:* You cannot have perfect source-level verification and perfect strategic privacy simultaneously. You must trade off *how* you verify (e.g., ZK-proofs verify constraints, not full logic).

  **T2: Trustless Verification vs. Hardware Reality (The Oracle Problem)**
  *   *Conflict:* To solve D2 (Fork Resistance) without a central authority, you need cryptographic guarantees. But to guarantee a binary hasn't been modified in RAM, you generally need a Trusted Execution Environment (TEE). TEEs require trust in the hardware manufacturer (Intel/AMD/ARM).
  *   *Verdict:* You cannot have "Trustless Program Equilibrium" on physical hardware. You either trust math (blockchain/slow) or hardware (fast/centralized vendor trust).

  **T3: General Best-Response vs. Decidability (Rice's Theorem)**
  *   *Conflict:* D3 (Feasibility) demands we know what the opponent's code does. But determining if an arbitrary program satisfies a property (like "will cooperate") is undecidable.
  *   *Verdict:* A general PE theory is impossible. The theory must restrict the language of the agents to a decidable subset (e.g., finite state machines, bounded loops) to function.

  **T4: Determinism vs. Physical Noise**
  *   *Conflict:* PE assumes $Code(Input) \rightarrow Output$. Real hardware has bit flips, timing side-channels, and nondeterministic scheduling.
  *   *Verdict:* Equilibrium cannot be defined on exact output bits. It must be defined on *verifiable ranges* or *commitment hashes* that tolerate micro-level nondeterminism.

  ---

  ### 3. Audit of Standard Approaches

  Here is how the two common theoretical models stack up against the spec.

  #### Model A: "Friend-or-Foe" (CliqueBot / Source Matching)
  *   *Mechanism:* `if opponent.source_hash == my.source_hash: Cooperate else: Defect`.
  *   *Performance:*
      *   **D1 (Binding):** Passes (relies on hash).
      *   **D2 (Fork):** Fails. If I fork your code, change one comment, and recompile, the hash changes. If I use a binary patcher, the hash changes. It is too brittle for real-world versioning.
      *   **D3 (Feasibility):** Passes (simple string comparison).
      *   **D5 (Obfuscation):** Fails completely. Requires exact source match.
      *   **Tension T3:** Avoids Rice's Theorem by not analyzing behavior, only identity.
  *   *Verdict:* **Party Trick.** Works only in closed, homogeneous systems where code is static. Useless for open-source reciprocity where forks are legal/expected.

  #### Model B: "Mutual Simulation" (Classic Tennenholtz PE)
  *   *Mechanism:* Agent A simulates Agent B running against A, and best-responds to the output.
  *   *Performance:*
      *   **D1 (Binding):** Fails. Assumes the simulation perfectly matches reality. Ignores side-channels or hardware divergence.
      *   **D2 (Fork):** Fails. Cannot detect if the opponent is simulating a *different* version of you than the one you actually are.
      *   **D3 (Feasibility):** Fails hard. Leads to infinite recursion ($A$ simulates $B$ simulates $A$...) unless arbitrary timeouts are introduced, which breaks the equilibrium logic.
      *   **Tension T3:** Violates decidability. Assumes agents can solve the Halting Problem for each other.
  *   *Verdict:* **Mathematical Curiosity.** Requires a "God Oracle" to execute. Cannot be deployed on distributed hardware without massive scaffolding (zk-SNARKs + TEEs) that changes the cost structure entirely.

  ### Summary Recommendation
  For Program Equilibrium to work in distributed commitment (smart contracts/licenses), the theory must abandon the idea of "reading source" as the primary mechanism. It must shift to **Verifiable Compute Constraints**.

  The equilibrium isn't "I see your code, so I trust you." It is "I have a cryptographic proof (zk-SNARK) or hardware attestation (SGX) that your output was generated by a process constrained by rules $X$, regardless of your internal source." The desiderata must prioritize **D1 (Binding)** and **D2 (Fork Resistance)** over **D5 (Obfuscation)**, accepting **T2 (Hardware Trust)** as a necessary cost of doing business in the physical world.
