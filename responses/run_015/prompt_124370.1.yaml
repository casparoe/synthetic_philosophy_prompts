prompt: |-
  I chair the allocations committee of a health research charity that awards one fixed envelope of money four times a year. We are six lay trustees and a scientific officer; we meet for a single afternoon; the money must all go; our decision is final. We are also required to publish written reasons to every applicant, including the ones we turn down, within two weeks. And because we meet quarterly with rotating membership, we have to be able to say how this quarter's choice relates to last quarter's without either being bound by it or drifting away from it at random.

  Our difficulty is not missing information. It is that the things we compare do not share a measure. A cheap, well-evidenced intervention that gives many people a small benefit; an expensive service that gives a few severely ill people a large and irreversible one; an exploratory programme that will probably come to nothing and might change practice for everyone. Cost-per-outcome in one currency, or a weighted score that adds everything up, would settle these comparisons only by pretending the difficulty away, and my trustees will not accept that. So I want a procedure we can run — ordered questions, what counts as a sufficient answer to each, where it returns a determinate result, and where it stops and hands the decision to a person because the remaining question is one of values rather than facts.

  Specifications I care about, roughly in the order the procedure should handle them:

  First, a diagnostic step. When two bids look incomparable, I want the committee to be able to tell apart at least four situations: that we simply cannot measure something we know to be comparable; that our comparisons are vague or only roughly comparable, so that more or better evidence would sharpen them; that the options are, in the technical sense, on a par — comparable, better in one respect and worse in another, but neither better overall nor equally good; and that there is a genuine lexical ordering or radical incomparability. The point of the distinction is that each diagnosis licenses a different next step, and I want that stated explicitly: which diagnoses are responsive to evidence, which leave the choice rationally underdetermined so that something other than a reason — commitment, the will, a decision to make an aim one's own — is what settles it, and which are settled by the ordering itself.

  Second, a second diagnostic, because I think we conflate two things. Some of our hard choices are choices between genuinely permissible options, where the right account of what we are doing is that we commit. Others are conflicts in which we must act and there is a remainder whatever we do: the appropriate aftermath is regret, acknowledgment, perhaps apology or compensation to those who lose, even though we chose correctly. These call for different handling downstream, and I want a way for a committee — not an individual agent — to tell which it is in, and what it is supposed to do about it either way.

  Third, a rule for agglomeration. Most quarters we are tempted by a large number of small improvements in one value set against a concentrated severe loss under another. Adding the small improvements up already presupposes a common unit, so I want the procedure to say what we may do here, what we must refuse to do, and how to describe the refusal honestly to an applicant who has twenty small studies and wants them counted.

  Fourth, a rule about chance. Say when randomising is legitimate and when it is buck-passing, and distinguish a fair lottery among equally-placed claimants from tossing a coin between two programmes because we cannot decide. If the procedure ever permits the latter, I want to know what has to be true first.

  Fifth, a rule about recurrence: what precedent may and may not do across quarters, how a committee tells a genuine re-weighing of aims from mere noise or from a change in who happens to be in the room, and what has to be recorded when we depart from what we did last time.

  Throughout, mark the points at which judgment cannot be eliminated rather than smoothing them over, and say who signs off at each: the chair, the full committee, the scientific officer, or the board. Say what happens when the committee cannot agree. The whole thing has to be runnable inside one afternoon by people with no philosophical training, and it must not depend on monetising outcomes, on a health-economic common currency, on a weighted-sum spreadsheet, on a lexical ordering asserted without an account of why that ordering, or on calling for more evidence as a general answer.

  Then run it. Start with the three-way choice above. Then take a quarter in which last quarter's precedent favoured the many-small-benefits programme and a new applicant makes that same case better than it was made before — say what the procedure does with precedent there. Finally, apply it to the case I expect to dislike: an application that is stronger than its rival on every consideration this committee has ever cited, arriving alongside a weaker one that would serve an aim we have not yet committed to. If your procedure permits funding the second and saying so, tell me what the published reason to the first applicant can honestly be, given that it cannot cite any deficiency in their proposal. If it does not permit it, say why not and what the procedure is missing.

  Close by saying what the procedure cannot do. I have two worries in particular that I want addressed directly: that it cannot, from the armchair, certify which of the four diagnoses is the correct one in any actual case; and that a committee could use the language of incommensurability as cover for preference, fatigue, or noise. Say what would detect that, and say plainly where the procedure stops and a person has to answer for the choice.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of an allocations committee for a health research charity.
      *   **Context:** 6 lay trustees + 1 scientific officer. One afternoon meeting. Quarterly. Fixed budget (must spend all). Final decision. Written reasons required within 2 weeks (including rejections). Rotating membership (need consistency without rigidity).
      *   **Core Problem:** Incommensurability of values (many/small benefit vs. few/large benefit vs. exploratory/high risk). Rejection of cost-per-outcome or weighted scoring as "pretending the difficulty away."
      *   **Requirements:**
          1.  **Diagnostic 1 (Comparability):** Distinguish between: unmeasured comparability, vague comparability, parity (on a par), and radical incomparability/lexical ordering. Map each to a specific next step (evidence, commitment, ordering).
          2.  **Diagnostic 2 (Moral Remainder):** Distinguish between permissible choices (commitment) and tragic choices (remainder/regret/apology). Define committee handling for each.
          3.  **Agglomeration Rule:** Handle many small improvements vs. one large loss. When is summing allowed/forbidden? How to explain refusal to applicants?
          4.  **Chance Rule:** When is randomization legitimate vs. buck-passing? Fair lottery vs. coin toss. Preconditions for the latter.
          5.  **Recurrence/Precedent Rule:** How to relate to past quarters without being bound or random. Recording departures.
          6.  **Operational Constraints:** Runnable in one afternoon. No philosophical training needed. No monetization/weighted sums. Mark where judgment is irreducible. Define sign-off authority (Chair, Committee, etc.). Define deadlock resolution.
          7.  **Test Cases:**
              *   Case A: The standard three-way choice (Many/Small vs. Few/Large vs. Exploratory).
              *   Case B: Precedent (Last quarter favored Many/Small; new app does it better).
              *   Case C: The "Disliked" Case (Stronger app vs. Weaker app serving a *new* aim). Can we fund the weaker one? What is the written reason to the stronger one?
          8.  **Limitations & Safeguards:** Address the worry that the committee can't certify the diagnosis from the armchair. Address the worry that "incommensurability" covers bias/fatigue. Detection mechanisms. Where the procedure stops and a person answers.

  2.  **Philosophical Underpinnings (Internal Knowledge):**

      *   *Incommensurability/Parity:* Ruth Chang's work is central here ("on a par").
      *   *Hard Choices:* Choices where reasons run out, requiring will/commitment.
      *   *Moral Remainder:* Bernard Williams, Martha Nussbaum (tragic dilemmas).
      *   *Procedural Justice:* Fairness in allocation under scarcity.
      *   *Precedent:* Dworkin's chain novel concept or simple case-based reasoning.
      *   *Randomization:* Broome's fairness vs. efficiency.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Structure:* Needs to be a flowchart-like text, clear headings, specific roles.
      *   *Tone:* Formal but accessible to lay trustees. Practical.
      *   *Step 1: Eligibility & Thresholds (Pre-work).* Scientific Officer (SO) filters technical viability.
      *   *Step 2: Diagnostic 1 (The Nature of the Comparison).*
          *   Question: Can we measure the difference?
          *   Outcomes: Evidence gap (get data), Vagueness (discuss), Parity (commit), Lexical (rule).
      *   *Step 3: Agglomeration.*
          *   Rule: No summing across distinct value categories unless a threshold is met.
          *   Explanation: "Distinct aims" not "insufficient merit."
      *   *Step 4: Diagnostic 2 (Moral Remainder).*
          *   Question: Does choosing A violate a duty owed to B?
          *   Outcome: Commitment (no regret) vs. Tragic (acknowledge loss).
      *   *Step 5: Chance.*
          *   Only if Parity is established. Not for ignorance.
      *   *Step 6: Precedent.*
          *   "Distinguish or Follow." Record reasons for deviation.
      *   *Step 7: Deadlock & Sign-off.*
          *   Chair breaks ties? Or supermajority? Let's go with Chair casts deciding vote but must record rationale.

  4.  **Developing the Test Cases:**

      *   *Case A (Standard):* Apply the diagnostics. Likely Parity. Requires Commitment.
      *   *Case B (Precedent):* If the *type* of benefit is the same, precedent weighs heavily. If it's just "better," it might trump. Need to distinguish "same aim" vs "new aim."
      *   *Case C (The Hard One):* Stronger app (Aim X) vs. Weaker app (Aim Y). If Aim Y is a *new* strategic priority, we can fund it. But we must tell App X the truth: "You were excellent, but we are diversifying our portfolio." This avoids lying about deficiency.

  5.  **Addressing the Limitations/Worries:**

      *   *Certification:* Acknowledge the committee cannot be metaphysically certain. The procedure relies on *consensus on the diagnosis*, not truth of the diagnosis.
      *   *Cover for Bias:* Require written records of the *diagnosis* itself. Audit trail. External review of reasons. Rotation of members helps, but recording *why* parity was declared is key.

  6.  **Refining the Output (Self-Correction during drafting):**

      *   *Critique:* Is this too philosophical?
      *   *Fix:* Use plain English terms (e.g., "Apples and Oranges" vs "Parity"). Keep the steps actionable.
      *   *Critique:* Is the "Written Reason" part specific enough?
      *   *Fix:* Provide templates or specific phrasing requirements for the rejection letters.
      *   *Critique:* Who signs off?
      *   *Fix:* Committee agrees on diagnosis; Chair signs the final allocation; Scientific Officer certifies evidence status.
      *   *Critique:* The "Disliked Case" (Case C).
      *   *Fix:* This is the crux. If we fund the weaker one for strategic diversity, we must admit the stronger one was *better on the metrics*, but the *portfolio* needed balance. The reason to the stronger applicant must not imply they were weak. It must imply the charity's strategic shift.

  7.  **Final Polish:**

      *   Ensure all constraints from the prompt are met (one afternoon, no monetization, specific sign-offs).
      *   Check the "Close by" section specifically addresses the two worries.

  8.  **Drafting the Content (Mental Outline):**
      *   **Title:** The Incommensurability Protocol (IP).
      *   **Phase 1: Preparation (SO role).**
      *   **Phase 2: The Diagnostic Matrix (The 4 states).**
      *   **Phase 3: Agglomeration & Summation limits.**
      *   **Phase 4: Moral Remainder (Regret vs. Commitment).**
      *   **Phase 5: Chance & Precedent.**
      *   **Phase 6: The Written Reason.**
      *   **Application to Cases.**
      *   **Limitations & Safeguards.**

  *(Self-Correction on Case C)*: If App A is stronger on *every* consideration cited before, but App B serves a *new* aim. The procedure must allow funding B *only if* the committee explicitly votes to adopt the new aim. The reason to A cannot be "you lost." It must be "we changed our mission scope." This is risky for a charity (donors might hate it), but logically sound for the prompt. I need to make sure the procedure allows for *Strategic Pivots* explicitly.

  *(Self-Correction on Sign-off)*: The prompt asks "who signs off at each." I need to be specific.
  *   Evidence status: Scientific Officer.
  *   Diagnosis of Comparability: Full Committee (Vote).
  *   Final Allocation: Chair (casting vote if needed).
  *   Written Reasons: Chair + SO (for accuracy).

  *(Self-Correction on "One Afternoon")*: The procedure needs to be time-boxed. 15 mins per application for the hard stuff.

  Let's write it.
answer: |-
  # The Incommensurability Protocol (IP)
  **Version 1.0 | For Use by the Allocations Committee**

  ## Purpose
  To allocate a fixed budget among research proposals that pursue distinct, non-fungible values without pretending those values share a common measure. To ensure decisions are reasoned, consistent across quarters, and honest in communication.

  ## Roles and Sign-Off Authority
  *   **Scientific Officer (SO):** Certifies technical viability and evidence quality. *Sign-off: Evidence Status.*
  *   **Committee (6 Trustees):** Diagnoses comparability and moral remainder. *Sign-off: Diagnostic Classification.*
  *   **Chair:** Manages procedure, breaks deadlocks, ensures precedent logic. *Sign-off: Final Allocation & Written Reasons.*
  *   **Board:** Receives quarterly report on deviations from precedent. *Sign-off: None (Oversight only).*

  ---

  ## Phase 1: Preparation (Before the Meeting)
  **Time:** 1 week prior.
  **Actor:** Scientific Officer.

  1.  **Thresholding:** The SO filters applications for technical competence and eligibility. Only viable proposals reach the Committee.
  2.  **Categorisation:** The SO tags each proposal with its primary **Value Category** (e.g., *Population Scale*, *Severity Relief*, *Knowledge Frontier*).
  3.  **Precedent Pack:** The Chair circulates a one-page summary of the last three quarters' allocations, specifically noting the *Value Category* funded and the *Diagnostic Reason* given.

  ---

  ## Phase 2: The Diagnostic Matrix (During the Meeting)
  **Time:** 15 minutes per competing cluster of applications.
  **Actor:** Full Committee.

  When two or more applications compete for the same envelope of funds, the Committee must classify the relationship between them using the **Diagnostic Matrix**. The SO confirms factual claims; the Committee votes on the classification.

  | Diagnosis | Definition | Required Evidence | Next Step |
  | :--- | :--- | :--- | :--- |
  | **1. Measurement Gap** | We know they are comparable, but lack data to rank them. | SO confirms data exists but is missing from bids. | **Return to Applicants** (if time) or **Defer**. Do not decide on ignorance. |
  | **2. Vagueness** | Concepts are roughly comparable, but boundaries are fuzzy (e.g., "severe" pain). | SO confirms metrics exist but are imprecise. | **Deliberate.** Discuss until consensus on which is *better* emerges. |
  | **3. Parity** | Comparable, but one is better on Value A, the other on Value B. Neither is overall better. | Committee agrees both are "excellent" in different ways. | **Commitment.** The Committee must *choose* based on will/strategy, not reason. |
  | **4. Lexical Order** | One value strictly trumps the other (e.g., saving life > improving comfort). | Committee agrees on a standing rule. | **Automatic.** Fund the higher-order value. |

  **Deadlock Rule:** If the Committee cannot agree on the Diagnosis after 10 minutes, the Chair classifies it as **Parity**. This forces a choice rather than allowing paralysis.

  ---

  ## Phase 3: Agglomeration & Summation
  **Time:** Integrated into Phase 2.
  **Actor:** Full Committee.

  **The Rule of Non-Summation:**
  You may not aggregate small benefits across different individuals to outweigh a severe loss to a single individual *unless* the small benefits fall within the same **Value Category** as the loss.

  *   **Permissible:** Funding 10 studies on mild migraine relief instead of 1 study on severe migraine relief (Same Category: *Severity Relief*).
  *   **Forbidden:** Funding 20 studies on mild migraine relief instead of 1 study on preventing irreversible paralysis (Different Categories: *Comfort* vs. *Function*).

  **Refusal Script:** If an applicant argues their 20 small studies should sum to beat a large one, the written reason must state: *"Your proposal was meritorious. However, our procedure does not aggregate benefits across distinct value categories. We treated your cluster as a single claim against a competing claim of a different kind."*

  ---

  ## Phase 4: Moral Remainder (Regret vs. Commitment)
  **Time:** Post-Decision.
  **Actor:** Chair & Committee.

  Once a choice is made under **Parity** (Diagnosis 3), the Committee must classify the aftermath.

  1.  **Permissible Choice (Commitment):** We choose A over B because we wish to *become* the kind of charity that prioritises A.
      *   **Action:** No apology needed. The reason cites strategic alignment.
  2.  **Tragic Choice (Remainder):** We choose A over B, but in doing so, we violate a duty owed to B (e.g., ignoring a dying group to fund future prevention).
      *   **Action:** The Written Reason must acknowledge the loss. *"We funded X. We acknowledge this means Y goes unfunded. We regret this loss."*

  **Sign-Off:** The Committee votes on which classification applies. If tied, the Chair decides, but must record the dissent in the minutes.

  ---

  ## Phase 5: Chance & Precedent
  **Time:** End of Meeting.
  **Actor:** Chair.

  **Rule of Chance:**
  *   **Fair Lottery:** Permitted *only* if Diagnosis is **Parity** AND Moral Remainder is **Permissible**. (i.e., Indifferent between two excellent, distinct options).
  *   **Buck-Passing:** Forbidden. You cannot toss a coin to avoid responsibility for a **Tragic Choice**. You cannot toss a coin if the Diagnosis is **Vagueness** (you must deliberate).

  **Rule of Recurrence (Precedent):**
  1.  **Same Category:** If the current top choice is in the same Value Category as last quarter's, you must follow last quarter's logic unless the new proposal is *significantly* stronger (SO certifies).
  2.  **Different Category:** If the current top choice is a *new* Value Category, you may fund it, but you must record a **Strategic Deviation Statement**.
  3.  **The Statement:** Must answer: *"Is this change due to the quality of applications, or a change in our strategic aims?"*
      *   If *Quality*: Cite the specific superiority.
      *   If *Strategy*: Cite the new aim.

  ---

  ## Phase 6: The Written Reason
  **Time:** Within 2 weeks.
  **Actor:** Chair (draft), SO (fact-check).

  The letter must not use economic language. It must mirror the Diagnostic Matrix.
  *   **If Rejected for Measurement Gap:** "We could not verify the claimed outcome."
  *   **If Rejected for Parity:** "Your proposal was excellent. We funded a rival proposal not because it was better, but because this quarter we prioritised [Value Category X] over [Value Category Y]."
  *   **If Rejected for Lexical Order:** "While your benefits were significant, our guidelines prioritise [Higher Order Value] in cases of conflict."

  ---

  # Application of the Procedure

  ## Case 1: The Standard Three-Way Choice
  *   **Options:** (A) Many/Small Benefit; (B) Few/Severe Benefit; (C) Exploratory/High Risk.
  *   **Procedure:**
      1.  **Diagnosis:** The Committee determines these are **Parity** (Diagnosis 3). They are distinct Value Categories (*Scale*, *Severity*, *Innovation*). None is lexically superior by default.
      2.  **Agglomeration:** Committee confirms they will not sum (A) to outweigh (B).
      3.  **Moral Remainder:** Committee decides this is a **Permissible Choice**. No duty is violated by picking one research stream over another.
      4.  **Decision:** Committee votes. Suppose they pick (B).
      5.  **Reason:** "We funded (B). (A) and (C) were meritorious. This quarter we exercised our discretion to prioritise Severity over Scale or Innovation."
      6.  **Sign-off:** Committee signs the Diagnosis; Chair signs the Letter.

  ## Case 2: Precedent (The "Many/Small" Repeat)
  *   **Context:** Last quarter funded (A) Many/Small. New applicant makes the case for (A) *better* than before.
  *   **Procedure:**
      1.  **Recurrence Check:** This is the *same* Value Category as last quarter.
      2.  **Rule:** We must follow last quarter's logic unless the new proposal is *significantly* stronger.
      3.  **SO Certification:** SO confirms the new proposal is technically superior to last quarter's winner.
      4.  **Decision:** Fund the new (A).
      5.  **Reason:** "This proposal aligns with our recent priority on Scale and demonstrates higher technical viability than previous funded projects in this category."
      6.  **Risk:** If the SO says it is *not* significantly stronger, the Committee must fund the *type* but arguably not the *same* project twice. If they reject the new (A) to diversify, they must file a **Strategic Deviation Statement** citing "Portfolio Diversification" as the reason, not lack of merit.

  ## Case 3: The "Disliked" Case (Stronger vs. New Aim)
  *   **Context:** App X is stronger on *every* consideration ever cited (Evidence, Cost, Benefit). App Y is weaker but serves a *New Aim* (e.g., Rare Disease) never funded before.
  *   **Procedure:**
      1.  **Diagnosis:** This is **Parity** only if the Committee declares the *New Aim* to be of equal standing to the *Old Aims*. If X is stronger on *all* cited considerations, technically X wins under Vagueness/Lexical rules *unless* the Committee invokes a Strategic Pivot.
      2.  **The Pivot:** To fund Y, the Committee must vote to **Adopt New Aim**. This overrides the "Stronger on all considerations" metric because the metric itself changes.
      3.  **Moral Remainder:** This is a **Permissible Choice** (Strategic Shift).
      4.  **Written Reason to App X:** This is the critical test.
          *   *Forbidden:* "Your proposal was less meritorious." (False).
          *   *Forbidden:* "We chose randomly." (Dishonest).
          *   *Required:* "Your proposal was outstanding and met all our standard criteria. However, this quarter the Committee exercised its discretion to diversify our portfolio into [New Aim]. This was a strategic choice, not a reflection on the quality of your work."
      5.  **Allowability:** The procedure *permits* this, but it triggers a **Strategic Deviation Statement** to the Board. It acknowledges that "Merit" is not the only allocator; "Portfolio Balance" is also a valid allocator.
      6.  **If Not Permitted:** If the procedure forbids this, it implies the charity is locked into its past definitions of merit forever. The procedure *must* allow for strategic evolution, provided it is declared openly.

  ---

  # Limitations and Safeguards

  ## Worry 1: Armchair Certification
  **Concern:** The Committee cannot know from the armchair if values are truly "on a par" or if one is actually better.
  **Procedure Response:** The procedure does not require metaphysical truth; it requires **Procedural Consensus**.
  *   **Detection:** The minutes record the vote count on the Diagnosis. If a Diagnosis of "Parity" is passed 4-3, the Written Reason must reflect that uncertainty: *"The Committee was divided on whether these aims were comparable. In cases of reasonable disagreement, we prioritised [Aim]."*
  *   **Limit:** The procedure cannot stop a committee from being wrong about the world. It stops them from pretending they are right when they are guessing.

  ## Worry 2: Incommensurability as Cover
  **Concern:** Trustees use "Parity" to hide fatigue, bias, or preference for a pet project.
  **Procedure Response:**
  1.  **The SO Veto:** The SO cannot vote on values, but can flag if a "Parity" diagnosis contradicts the evidence. (e.g., If App A cures cancer and App B cures hiccups, SO flags that a Lexical Order *should* apply).
  2.  **The Deviation Audit:** If the Committee declares "Parity" three quarters in a row but funds the same Trustee's preferred area, the **Strategic Deviation Statements** will show a pattern of inconsistency.
  3.  **Personal Accountability:** When the Chair signs the **Strategic Deviation Statement**, they attach their name to the shift. If the shift looks like bias, the Board can query the Chair.
  4.  **Where the Person Answers:** The procedure stops at the **Commitment** step. Once the diagnosis is "Parity," reason runs out. At that exact moment, the Chair must ask each Trustee: *"Are you willing to stand by this choice as a reflection of your will, not just your reason?"* If a Trustee cannot answer, they must recuse.

  ## What The Procedure Cannot Do
  1.  **It cannot eliminate regret.** In Tragic Choices, the Written Reason must acknowledge the loss. The procedure manages the expression of regret, not its existence.
  2.  **It cannot guarantee the "best" outcome.** It guarantees the *integrity* of the choice process.
  3.  **It cannot prevent strategic drift.** It only forces the drift to be recorded. If the Committee slowly shifts aims every quarter, the Board must intervene, not the procedure.

  **Final Sign-Off:**
  *   **Chair:** "I certify this allocation followed the Incommensurability Protocol."
  *   **Committee:** "We certify the Diagnostic Classifications."
  *   **Scientific Officer:** "I certify the Evidence Status."
