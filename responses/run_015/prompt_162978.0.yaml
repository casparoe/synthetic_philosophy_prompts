answer: |-
  ### Specification of Requirements for Interpersonal Comparisons

  The following requirements are organized by the grade of comparability they enforce. Each is tagged as **Non-Negotiable (NN)** for your specific allocator use-case, **Negotiable (N)** depending on the distributive principle chosen, or **Prejudice (P)** of a specific theoretical camp (e.g., welfarism, utilitarianism).

  #### I. Order (Ordinal Comparability)
  *Requirements necessary to rank patients at all.*

  1.  **Completeness of Ranking**
      *   **Case:** Case 3 (Intra/Inter consistency) and Case 10 (Public defensibility). The allocator must be able to decide between any two allocation proposals.
      *   **Requirement:** The metric must yield a determinate ordering for every pair of patient states the allocator might face. It cannot declare pairs "incomparable" to avoid hard choices.
      *   **Tag:** **NN**. (An allocator who cannot decide fails the job).
  2.  **Transitivity and Chaining Closure**
      *   **Case:** Case 2 (The Sorites Chain). If migraine < wrist, and wrist < depression, and depression < blindness, then migraine < blindness.
      *   **Requirement:** The comparison relation must be transitive. Small, confident steps cannot accumulate into an intransitive loop or a breakdown of comparability at the extremes.
      *   **Tag:** **NN**. (Without this, the chain of clinical reasoning collapses).

  #### II. Units (Cardinal Comparability)
  *Requirements necessary to measure magnitudes of gain and loss.*

  3.  **Resolution for Aggregation**
      *   **Case:** Case 9 (Many small harms vs. one severe harm).
      *   **Requirement:** The metric must possess sufficient cardinal resolution to determine whether a sum of small benefits can outweigh a large harm, or explicitly rule out such aggregation. It cannot be silent.
      *   **Tag:** **NN**. (Sum-ranking and Prioritarianism both require cardinality to function; silence precludes adjudication).
  4.  **Invariance under Common Rescaling (Unit Comparability)**
      *   **Case:** Case 4 (The Numeraire Test).
      *   **Requirement:** If everyone's scale is multiplied by a positive constant $k$, the interpersonal ordering of states and the ranking of allocations must remain unchanged. This ensures "one unit of well-being" is the same size for everyone.
      *   **Tag:** **NN**. (Required to compare gains across persons without reverse-engineering the distributive principle).
  5.  **Rejection of Independent Affine Invariance**
      *   **Case:** Case 5 (The Zero Point) and Case 8 (Urgency).
      *   **Requirement:** The metric must *not* be invariant under independent positive-affine transformations ($u'_i = a_i u_i + b_i$) where $b_i$ varies by person. You must fix the zero-point and unit across persons.
      *   **Tag:** **NN**. (This is the cost of admitting Priority views. If you allow independent $b_i$, you cannot identify the "worst off" in absolute terms, only relative terms).

  #### III. Levels and Zero (Full Comparability)
  *Requirements necessary to identify absolute standing and baseline.*

  6.  **Fixed Interpersonal Zero**
      *   **Case:** Case 5 (The Zero).
      *   **Requirement:** The metric must locate a neutral point (e.g., "life not worth living" or "biological baseline") that is identical for all persons. Locating this zero cannot rely solely on subjective report (see Req 7).
      *   **Tag:** **NN**. (Required to distinguish Priority from Utilitarianism; Utilitarianism ignores the zero, Priority depends on it).
  7.  **Sensitivity to Adaptation (Anti-Deference)**
      *   **Case:** Case 1 (The Adapted Patient).
      *   **Requirement:** The metric must not treat self-reported contentment as conclusive evidence of well-being when clinical evidence suggests severe deprivation. It must distinguish *satisfaction* from *success*.
      *   **Tag:** **NN**. (Deference here validates the oppression of the adapted; the allocator must defend the allocation against the claim that the adapted patient is being ignored).
  8.  **Unified Intra- and Inter-personal Scale**
      *   **Case:** Case 3 (Time vs. Person).
      *   **Requirement:** The procedure for comparing Patient A at Time 1 vs. Time 2 must be identical to the procedure for comparing Patient A vs. Patient B.
      *   **Tag:** **NN**. (Using different procedures invites the charge that persons are being treated as mere containers rather than agents).

  #### IV. Structural and Procedural
  *Requirements regarding the stability and communication of the metric.*

  9.  **Non-Manipulability**
      *   **Case:** Case 6 (Strategic Presentation).
      *   **Requirement:** The metric cannot be gamed by patients exaggerating symptoms. It must rely on verifiable clinical data or mechanisms that penalize dishonesty.
      *   **Tag:** **NN**. (If manipulable, the allocator rewards acting, not need).
  10. **Reason-Expressibility**
      *   **Case:** Case 10 (Public Defensibility).
      *   **Requirement:** Every comparison issued by the metric must be translatable into a public reason (e.g., "severe pain outweighs mild inconvenience") rather than a raw number.
      *   **Tag:** **NN**. (Legitimacy requires intelligibility).
  11. **Separability of Unaffected Parties**
      *   **Case:** Case 8 (Urgency/Relative Status).
      *   **Requirement:** The value of a benefit to Patient A should not change depending on the well-being of Patient B, *unless* the distributive principle dictates it.
      *   **Tag:** **Prejudice (Utilitarian/Sum-Ranking)**. (Priority views violate this; the existence of the worse-off makes benefits to the better-off less urgent. Marking this NN excludes Priority views by fiat).
  12. **Extension to Possible People**
      *   **Case:** Case 7 (Non-Identity).
      *   **Requirement:** The metric must compare existing people with merely possible people.
      *   **Tag:** **Negotiable**. (Your use case is *identified patients in a single year*. Non-identity is irrelevant to the immediate budget constraint. Importing this requirement imports the Repugnant Conclusion problems unnecessarily).

  ---

  ### Testing the Suspicions

  **Suspicion 1: Affine Invariance vs. Level Comparability**
  **Verdict: Confirmed.**
  Full invariance under independent positive-affine rescaling ($u'_i = a_i u_i + b_i$) is mathematically incompatible with level comparability.
  *   **The Conflict:** Affine invariance allows the zero-point ($b_i$) and the unit size ($a_i$) to shift arbitrarily for each person without changing the "truth" of the measurement. Level comparability requires the zero-point and unit to be fixed across persons to say "Person A is absolutely worse off than Person B."
  *   **The Import:** To secure level comparability (and thus allow Priority views), you must import a **substantive theory of the good** that fixes the zero and unit ontologically, not just procedurally. You cannot derive this from preference data alone. You must stipulate, for example, that "zero = death" or "zero = subsistence functioning" for everyone. This is not an epistemic discovery; it is a normative stipulation disguised as measurement.
  *   **Acceptability:** For your allocator use-case, this import is acceptable and necessary. A health allocator *must* assume a biological or functional baseline to triage. Preference satisfaction alone cannot triage the adapted patient (Case 1).

  **Suspicion 2: Completeness + Pareto + Transitivity**
  **Verdict: Conditional.**
  These three properties are formally compatible *if and only if* the informational basis is rich enough (i.e., Level Comparability is allowed).
  *   **The Conflict:** If you restrict the metric to **Ordinal Non-Comparability** (preferences only, no interpersonal units/levels), then Completeness, Transitivity, Pareto, and a weak equity condition (Anonymity) are jointly impossible (Arrow's Theorem).
  *   **The Isolation:** The impossibility does not arise from the properties themselves, but from the **Grade of Comparability**. If you satisfy Requirement 5 (Reject Independent Affine Invariance) and Requirement 6 (Fixed Zero), the impossibility vanishes. You can have a complete, transitive, Pareto-respecting ordering that also prioritizes the worst-off.
  *   **Conclusion:** The triad is satisfiable for your purpose, provided you do not cling to Ordinal Non-Comparability.

  ---

  ### Exclusion and Reduction

  **Which single requirement does the most work?**
  **Requirement 5 (Rejection of Independent Affine Invariance) / Requirement 6 (Fixed Interpersonal Zero).**
  These are the same constraint viewed differently. This requirement excludes Strict Ordinalism, Revealed Preference Theory, and standard Neoclassical Welfare Economics. It forces you to adopt an Objective List, Capabilities, or Needs-based metric. It is the gatekeeper that allows you to discuss Priority to the Worst Off without begging the question.

  **Which requirement would you drop?**
  **Requirement 12 (Extension to Possible People).**
  **Why:** Your use case is a fixed health budget for *identified* patients in a *single year*. This is a non-identity-safe context. No one's existence depends on the allocation; only their quality of life does. Importing the non-identity problem (Case 7) introduces metaphysical baggage (comparing the existent with the non-existent) that distracts from the immediate distributive problem. It is a theoretical luxury your allocator does not need.

  ---

  ### Scorecard

  | Approach | Order (1, 2) | Units (3, 4) | Levels/Zero (5, 6, 7, 8) | Process (9, 10) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Ordinalism** | Pass | Fail | Fail | Pass | **Inadequate.** Cannot adjudicate Sum vs. Priority. |
  | **Impartial Observer** | Pass | Negotiable | Fail | Pass | **Inadequate.** Yields utilitarianism; zero-point is subjective/imagined, not fixed. |
  | **Partial Comparability** | Pass | Pass | Fail | Pass | **Inadequate.** Stops short of level comparisons needed for Priority. |
  | **Primary Goods Proxy** | Pass | Pass | **Struggle** | Pass | **Contender.** Fixes zero/units publicly, but fails Case 1 (Adaptation/Disability). |
  | **Health-State Tariff (QALY)** | Pass | Pass | **Struggle** | **Fail** | **Contender.** Good units, but zero (death) is fixed biologically; fails Case 6 (Strategy) & 10 (Reason). |
  | **Flat-Footed Realist** | Pass | Pass | Pass | **Struggle** | **Best Fit.** Meets all measurement criteria, but struggles with Case 10 (explaining *why* the scale is true). |

  **Note on Scorecard:**
  *   **Primary Goods:** Fails Case 1 because it measures resources, not well-being conversion (the adapted patient has the goods but reports low well-being, or vice versa).
  *   **Health-State Tariff:** Fails Case 10 because "0.4 QALYs" is not a public reason patients accept without a theory of *why* that state is 0.4.
  *   **Flat-Footed Realist:** The only one that clears the "Levels/Zero" bar without smuggling in utilitarianism, but requires heavy philosophical defense to satisfy Public Defensibility.
