      *   *Use Case:* Health budget allocation. This implies a need for *cardinality* (to sum or weight) and *level comparability* (to identify the worst off). Ordinalism isn't enough for Prioritarianism vs. Utilitarianism.
      *   *Grades:*
          *   Ordinal (Order): Who is better off?
          *   Unit Comparability: Are gains equivalent? (Needed for Sum-ranking).
