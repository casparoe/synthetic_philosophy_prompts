answer: |-
  This is a classic problem in **social ontology** (the study of how social reality exists). Philosophers like Michael Bratman, Margaret Gilbert, and John Searle have spent careers trying to draw exactly this line.

  Your intuitions are actually remarkably consistent with the most robust contemporary account, which is a modified **Shared Intention Theory**.

  Here is the principle that gets you almost all of your verdicts, followed by the solution to your roommate flip-flop.

  ### The Principle: The "We-Intention" Triad

  For an action to count as *joint* (doing something *together*) rather than *parallel* (doing similar things *alongside*), three conditions must be met:

  1.  **Mutual Responsiveness:** Each person adjusts their behavior in response to the others (not just in response to the world).
  2.  **Shared Intention (The "We-Mode"):** Each person intends that *we* do the action, not just that *I* do my part. (Crucially, this doesn't mean you share the same *outcome* goal, just the same *activity* goal).
  3.  **Common Knowledge:** It must be open between the participants that conditions 1 and 2 are in place. I know you know I know we are doing this.

  Let's run your cases through this triad.

  ### Applying the Triad

  **1. The Fence (Joint)**
  *   **Responsiveness:** Yes (splitting the middle).
  *   **Shared Intention:** Yes ("We agreed to repaint").
  *   **Common Knowledge:** Yes (Explicit agreement).
  *   *Verdict:* Clear Joint Action.

  **2. The Suitcase (Not Joint)**
  *   **Responsiveness:** Yes (physically adjusting grip).
  *   **Shared Intention:** **No.** Neither stranger intends "We will steady this." They intend "I will grab this," and physics forces coordination.
  *   **Common Knowledge:** **No.** It happens too fast for a shared mental state to form.
  *   *Verdict:* This is **Dynamic Coordination**, not Joint Action. Your gut is right. It's a collision of two "I-intentions," not a "We-intention."

  **3. The Ovation (Joint)**
  *   **Responsiveness:** Yes (timing claps to the swell).
  *   **Shared Intention:** Yes. You aren't just making noise; you intend to add your clap to the *collective sound*.
  *   **Common Knowledge:** Yes. It relies on social convention. When you stand, you know others know standing signals approval. The "openness" is provided by the social norm, not a verbal contract.
  *   *Verdict:* Joint Action (Normative).

  **4. The Flash Mob (Joint)**
  *   **Responsiveness:** Yes (timing cues).
  *   **Shared Intention:** Yes (all following the video plan).
  *   **Common Knowledge:** Yes. Even if they haven't met, they know they are all following the same instructions from the same source. They know they are part of a "mob."
  *   *Verdict:* Joint Action.

  **5. Panic Selling (Not Joint)**
  *   **Responsiveness:** No. I am responding to the *price ticker*, not to *you*.
  *   **Shared Intention:** No. I intend "I must save my assets." I don't intend "We must crash the market."
  *   **Common Knowledge:** No. Everyone is isolated in their fear.
  *   *Verdict:* Parallel Action (Aggregate behavior).

  **6. Independent Labs (Not Joint)**
  *   **Responsiveness:** No.
  *   **Shared Intention:** No.
  *   **Common Knowledge:** No.
  *   *Verdict:* Parallel Action.

  **7. The Riot Mob (Joint)**
  *   **Responsiveness:** Yes (egg each other on, follow movement).
  *   **Shared Intention:** Yes. In the heat of the moment, the intention shifts from "I want to smash" to "We are smashing."
  *   **Common Knowledge:** Yes. This is the key difference between a riot and a crowd of people running from rain. In a riot, the intent is perceptually obvious. The violence is public and mutual.
  *   *Verdict:* Joint Action (Emergent).

  **8. Chess Players (Joint)**
  *   **Responsiveness:** Yes.
  *   **Shared Intention:** **Yes, but distinct from goals.** This is where people get stuck. They do not share the goal of *winning*. They share the **constitutive goal** of *playing chess*. If one player tries to win and the other tries to lose on purpose (throwing the match), they are no longer playing chess together; they are undermining the joint activity.
  *   **Common Knowledge:** Yes (rules of the game).
  *   *Verdict:* Joint Action.

  **9. Secret Snubbing (Not Joint)**
  *   **Responsiveness:** No (initially).
  *   **Shared Intention:** No.
  *   **Common Knowledge:** **No.** This is the dealbreaker. Because it is secret, there is no "We." There are only two isolated "I's."
  *   *Verdict:* Parallel Action.

  ---

  ### The Flip-Flop Case: The Roommates Discover Each Other

  **The Scenario:** Roommates A and B are secretly snubbing C. Halfway through, A notices B doing it. B notices A noticing. Neither speaks. Both continue snubbing C for the rest of the day.

  **The Verdict:** **Yes, it becomes Joint Action at the moment of discovery.**

  **What exactly got added?**
  **Common Knowledge + Tacit Ratification.**

  Here is the mechanism of the shift:

  1.  **Before Discovery:** A intends "I will ignore C." B intends "I will ignore C." This is parallel.
  2.  **The Moment of Discovery:** A sees B ignoring C. B sees A ignoring C.
  3.  **The Critical Silence:** If A *disapproved* of the snub, A would likely signal that (a frown, a question, or simply stopping). By *continuing* the snub while knowing B is watching, A is silently communicating: "I am doing this, and I am okay with you doing it with me."
  4.  **The Shift:** B interprets A's continuation as an invitation/ratification. B continues. Now, A knows that B knows that A is snubbing.
  5.  **The Result:** The intention transforms from "I am ignoring C" to "We are ignoring C."

  **Why this matters:**
  If they are later confronted by C ("Why did you two ignore me?"), they can no longer truthfully say "I didn't know he was doing it." They are now **complicit**. Complicity requires joint agency. You cannot be complicit alone.

  The silence functioned as a **speech act**. In social ontology, failing to dissent when you have the opportunity and the knowledge is often treated as consent to the joint enterprise. The "We" is formed not by a handshake, but by the mutual recognition of shared intent that goes unchallenged.

  ### Summary of the Principle

  To count as doing something *together*:
  1.  **Interlock:** Our actions must mesh (Responsiveness).
  2.  **Align:** We must intend the *activity* itself, not just the outcome (Shared Intention).
  3.  **Openness:** We must know that we both know we are doing it (Common Knowledge).

  **Agreement is not necessary** (Ovation, Mob) because Common Knowledge can be established perceptually or socially.
  **Agreement is not sufficient** (Secret Snubbing) because without Common Knowledge, it remains two isolated "I's."

  Your gut was right on almost every case. The only trap was thinking "Shared Goal" meant "Shared Desired Outcome." In chess, and in the snubbing, the shared goal is the *participation in the activity*, regardless of whether you want the other person to "win" or if you ever talked about it.
