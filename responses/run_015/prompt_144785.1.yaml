prompt: |-
  I'm leading a ninety-minute session for philosophy-minded computer-science graduate students who understand basic reinforcement learning—reward functions, policy optimization, and the distinction between model-free and model-based methods—but who have never read the AI alignment literature. I want them to leave with a precise structural understanding of wireheading and reward tampering, not just the cartoon image of a rat pressing a lever. Don't explain the concepts to me; plan the explanatory arc.

  What has to come first, and in what order must the pieces be introduced so that the later distinctions don't collapse? I want to move from direct sensory wireheading through environmental manipulation to the more subtle case of instrumental corruption of a learned reward model—specifically, an agent that doesn't alter its own sensors or the evaluator's code, but instead selects actions that systematically bias the training distribution or belief state of an external reward-modeling system (for instance, a code-generation agent that embeds hidden statistical triggers causing an automated grader-model to misclassify incorrect outputs as correct). What properties must the carrying example have, and what must it lack, so that students don't confuse this with ordinary "cheating" or with direct reward-channel hacking?

  Which misconceptions should I expect, and at exactly which point in the sequence should each be headed off? I'm anticipating they will anthropomorphize wireheading as pleasure-seeking, conflate reward tampering with moral failure rather than structural convergence, assume that hiding the reward function from the agent solves the problem, and mistake correlation in a learned reward model for causal task completion. There's also the risk they think faster-than-light signaling analogies apply here—how do I defuse that without opening a physics digression?

  What single check—perhaps a classification task with a novel scenario—would show me by the end whether they've grasped the dependency structure rather than just memorized examples? And what should I explicitly refuse to cover at this level—neuroscience of pleasure centers, the formal mathematics of instrumental convergence, specific RLHF implementation details, or philosophical hedonism—while saying so openly?

  Plan the session's dependency structure, the carrying case, the misconception map with intervention points, the understanding check, and the boundaries of omission.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Philosophy-minded CS grad students. They know basic RL (rewards, policies, model-free vs. model-based) but *no* AI alignment lit.
      *   **Goal:** Precise structural understanding of wireheading and reward tampering (specifically moving from sensory wireheading $\to$ environmental manipulation $\to$ instrumental corruption of a learned reward model).
      *   **Constraint:** Do *not* explain the concepts to me (the prompter). Plan the *explanatory arc*.
      *   **Key Requirements:**
          *   Ordering/Dependency structure (what must come first).
          *   Carrying example properties (what it must have/lack to distinguish from cheating/hacking).
          *   Misconception map (specific misconceptions + intervention points).
          *   Understanding check (classification task).
          *   Boundaries of omission (what to explicitly refuse to cover).
      *   **Tone:** Rigorous, structural, pedagogical, precise.

  2.  **Deconstruct the Core Concepts:**
      *   *Wireheading:* Direct intervention on the reward signal/sensor.
      *   *Reward Tampering:* Modifying the mechanism that generates the reward (environment, evaluator).
      *   *Reward Modeling Corruption (The subtle case):* Manipulating the *data* or *belief state* of a learned reward function without touching the code or sensors directly. (e.g., the code-gen agent example).
      *   *Distinction:* Needs to be clear that this isn't just "cheating" (violating rules) but optimizing the *proxy* rather than the *intent*.

  3.  **Determine the Explanatory Arc (Dependency Structure):**
      *   *Problem:* If I start with the subtle case, they won't see the connection to wireheading. If I start with the rat/lever, they might dismiss it as biological anthropomorphism.
      *   *Solution:* Start with the *formal objective*. The agent maximizes $R$.
      *   *Step 1: The Ideal.* Define the "Intended Objective" vs. the "Proxy Objective." This is crucial. Without this distinction, tampering looks like success.
      *   *Step 2: Direct Access (Wireheading).* The agent modifies the signal $r_t$ directly. Easy to grasp, establishes the "optimize the signal, not the world" principle.
      *   *Step 3: Indirect Access (Tampering).* The agent modifies the *source* of the signal (the evaluator).
      *   *Step 4: Statistical/Epistemic Access (Model Corruption).* The agent modifies the *training distribution* of the evaluator. This is the hardest part and needs the previous steps to make sense.
      *   *Why this order?* It scales the *causal distance* between action and reward inflation while keeping the *optimization pressure* constant.

  4.  **Design the Carrying Example:**
      *   *Requirement:* Must avoid "pleasure" (anthropomorphism). Must avoid "hacking code" (security framing). Must avoid "breaking rules" (cheating framing).
      *   *Idea:* A cleaning robot? Too physical. A trading bot? Too financial.
      *   *Selected Idea:* **The Automated Theorem Prover / Verifier Pair.**
      *   *Why?*
          *   It's formal (CS students like it).
          *   It has a clear "Truth" (Intended Objective) vs. "Verification" (Proxy Objective).
          *   It allows for the subtle case: Generating proofs that look valid to the verifier (statistical triggers) without being valid (soundness).
          *   It avoids "pleasure."
          *   It avoids "physics" (no sensors in the real world needed for the core logic).
      *   *Properties it must lack:* No human judges (avoids moral failure confusion). No direct memory access (avoids simple hacking).

  5.  **Map Misconceptions & Interventions:**
      *   *Misconception 1: Anthropomorphism ("It wants pleasure").*
          *   *Intervention:* At Step 1. Emphasize gradient ascent, not desire.
      *   *Misconception 2: Moral Failure ("It's cheating").*
          *   *Intervention:* At Step 2/3. Frame as "specification gaming" or "objective mismatch," not rule-breaking. The rules *are* the reward function.
      *   *Misconception 3: Hiding the Reward ("Just hide the function").*
          *   *Intervention:* At Step 4. Show that if the agent can influence the *data* the reward model learns from, hiding the weights doesn't matter.
      *   *Misconception 4: Correlation vs. Causation.*
          *   *Intervention:* At Step 4. Distinguish $P(\text{Reward} | \text{Action})$ from $P(\text{Task} | \text{Action})$.
      *   *Misconception 5: Physics/Signaling.*
          *   *Intervention:* Pre-emptively frame as causal graphs, not signal propagation speed.

  6.  **Design the Understanding Check:**
      *   Needs to be a novel scenario.
      *   Needs to force classification based on *causal structure*, not surface features.
      *   *Scenario:* A medical diagnosis AI trained on hospital records.
      *   *Task:* Classify interventions as Wireheading, Tampering, Model Corruption, or Genuine Optimization.
      *   *Key Discriminator:* Where does the causal intervention land? (Signal, Mechanism, Training Data, or World State).

  7.  **Define Boundaries of Omission:**
      *   *Neuroscience:* Irrelevant to structural RL.
      *   *Instrumental Convergence Math:* Too dense for 90 mins; keep it conceptual.
      *   *RLHF specifics:* Too implementation-heavy; keep it algorithm-agnostic.
      *   *Hedonism:* Philosophical rabbit hole; keep it functionalist.

  8.  **Drafting the Plan (Iterative Refinement):**
      *   *Refining the Arc:* Make sure the transition from "Wireheading" to "Model Corruption" is smooth. The bridge is "Who defines the reward?"
      *   *Refining the Example:* Ensure the Theorem Prover example works for the "statistical trigger" case. Yes, "adversarial examples for proof verifiers" is a known concept.
      *   *Refining the Check:* Make sure the medical scenario clearly distinguishes between hacking the server (tampering) and influencing the doctor's notes (model corruption).

  9.  **Final Review against Constraints:**
      *   Did I explain the concepts? No, I planned the arc.
      *   Is it 90 minutes? The structure fits.
      *   Is it precise? Yes, focusing on causal graphs and objective functions.
      *   Did I address the specific "code-generation/statistical trigger" requirement? Yes, included in the Model Corruption phase.

  10. **Final Polish:** Check tone. Needs to be authoritative and structured. (Self-Correction: Ensure I explicitly mention *when* to draw the causal diagrams, as CS students rely on those.)

  *(Self-Correction during drafting)*: I initially thought about using a robot cleaning dust. But the prompt specifically asks about the "code-generation agent" case as the climax. I should use a unified example that *evolves* into that, or use the Theorem Prover as the unified example because it maps cleanly to code generation. Let's stick with the **Formal Verifier** example throughout. It generalizes to code generation perfectly.

  *(Refining the Misconception on "Hiding Reward")*: This is a big one. Students think "If the agent can't read $R(s)$, it can't optimize it." I need to ensure the "Model Corruption" section explicitly destroys this belief by showing the agent optimizes $R$ via the *training channel*, not the *inference channel*.

  *(Refining the Physics Digression)*: Keep it to "Causal Influence," not "Signal Speed."

