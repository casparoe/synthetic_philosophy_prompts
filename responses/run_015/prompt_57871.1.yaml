answer: |-
  Patient M has undergone complete surgical commissurotomy. Subcortical pathways remain intact, but cortical communication is severed. M sits before a screen with chin-rest fixation strictly monitored. On each trial, a red circle flashes for 150ms in the left visual field (LVF), while three blue squares flash simultaneously in the right visual field (RVF). Neither hemisphere sees the whole picture. M must immediately grasp a specific tool requiring two hands: the left hand adjusts pressure based on color (red = soft grip), while the right hand aligns angles based on shape (squares = 45-degree tilt). The action must occur within 1.5 seconds as a single synchronous sweep to catch a falling object. Verbal report is forbidden during the task. Success requires integrating color and shape information instantaneously to configure the tool correctly before contact. Post-trial, M verbally reports seeing only the RVF stimuli. Cross-cueing is ruled out by the deadline and fixation lock; there is no time to observe the other hand's initiation. The hands move cooperatively, not competitively, achieving 95% accuracy despite the split input. M claims conscious awareness only of the right-field shapes, denying the left-field color, yet the left hand acts correctly on that denied color information within the unified motion. This creates a tension between the unified behavioral output and the fragmented verbal testimony regarding conscious access. The task demands nonverbal, symmetric motor planning, preventing language dominance from skewing the performance metric itself.

  **Analysis of Rival Readings**

  The **integrationist** reads M as a single subject with impaired interhemispheric access. They predict smooth bimanual performance because one motor system executes a unified plan, but they predict verbal denial because the language-dominant left hemisphere lacks access to LVF data for report. The **fragmentationist** reads M as hosting two distinct streams of consciousness. They predict smooth performance via subcortical cooperation between two agents, and verbal denial because the left-hemisphere stream truthfully reports its own ignorance.

  The single feature doing the philosophical work is the **tight-deadline bimanual coordination**. If this feature is removed or relaxed—for instance, by allowing unlimited response time—serial cross-cueing becomes viable. One hemisphere could watch the other's hand move and infer the missing information, explaining coordination without implying either unity or fragmentation of consciousness.

  The integrationist reading comes out worse here. It must explain why a unified subject denies content that successfully guided their own action, implying a fracture in the subject despite the label. The strongest reply available to the integrationist distinguishes *phenomenal unity* from *access unity*. They argue M consciously experiences the whole scene (phenomenal unity) but lacks the conceptual access required for verbal report (access fragmentation), preserving the single subject while accommodating the denial.
