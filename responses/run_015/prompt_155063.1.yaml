      *   *Is Step 3 definitely the break?* Yes. It assumes that *any* cost imposed for collective benefit is the same as utilitarian sacrifice. But in a just system, the cost is justified by the *right* to the benefit, not just the *sum* of benefit.
      *   *Nozick vs. Rawls:* Nozick might actually agree with the user more than Rawls. Nozick is wary of taxation. Rawls argues taxation is justified if it fits the Difference Principle. I should focus on the Rawlsian interpretation since that's where "separateness" is most often taught as a critique of Utilitarianism.
      *   *The "Cost":* If I reject Step 3, I must admit that some interpersonal trade-offs *are* permissible. I need a criterion for which ones. That criterion is "Justice" or "Fairness," not "Utility Maximisation."

