answer: |-
  To settle the consciousness status of an Einstein-encoding book, a theory of phenomenal consciousness must satisfy the following desiderata:

  1.  **Phenomenal and Access Distinction:** The theory must distinguish between information being available for report and control (access consciousness) and the subjective quality of experience (phenomenal consciousness). This is required to assess whether the book, which successfully accesses and outputs data, necessarily possesses an inner life.
  2.  **Causal Dynamics versus Static Mapping:** The theory must differentiate between static symbol manipulation and dynamic causal processes. This ensures the static lookup-book is treated differently from an ordinary biological brain, which relies on electrochemical causality rather than pre-written entries.
  3.  **Temporal Integration:** The theory must account for the unity of experience over time. This is crucial for the continuously rewritten version; merely tracking neural dynamics is insufficient if the mechanism lacks the integration required to bind states into a single, continuous subject rather than a sequence of disjointed episodes.
  4.  **Substrate Explicitness:** The theory must explicitly state whether biological embodiment is necessary or if organisational structure suffices. This constrains the evaluation of the book based on whether consciousness is substrate-independent or biologically grounded.
  5.  **Explanatory Gap Constraint:** The theory must address why physical or functional descriptions entail subjective experience, rather than merely correlating them. This finding from philosophy of mind prevents the theory from dismissing the hard problem as a linguistic confusion.

  **The Single Decisive Desideratum**

  The desideratum that rules out the largest number of prominent accounts is **the requirement that phenomenal consciousness involves intrinsic qualitative properties not exhausted by functional role or behavioural disposition.**

  This criterion demands that experience possesses a nature over and above what a system *does*. Consequently:

  *   **Pure Functionalism** fails, as it defines mental states entirely by their causal roles and relations, leaving no room for intrinsic qualities beyond function.
  *   **Higher-Order Theories** fail, as they reduce phenomenal consciousness to a relational state (a thought about a state), rendering the quality derivative rather than intrinsic.
  *   **Global Workspace Theory** fails, as it typically equates consciousness with global information access, collapsing the phenomenal into the functional.
  *   **Illusionism** fails, as it denies the existence of intrinsic phenomenal properties altogether, treating them as cognitive misrepresentations.
  *   **Biological Naturalism** survives this specific desideratum by positing intrinsic biological features, though it may struggle if the theory also demands strict substrate neutrality.

  By insisting on intrinsic properties, this single criterion eliminates the dominant reductive and functionalist frameworks in contemporary cognitive science, leaving only non-reductive physicalist or dualist accounts viable.
