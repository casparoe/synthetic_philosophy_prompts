answer: |-
  # Teaching Plan: Self-Locating Belief and the Sleeping Beauty Variant
  **Time:** 30 Minutes
  **Audience:** First-Year Philosophy Seminar (No Formal Logic)
  **Tools:** Whiteboard, Markers (Two colors)

  ## Phase 1: The Protocol and Timeline (0–8 Minutes)
  **Goal:** Establish the physical facts without triggering the "counting" reflex immediately. Intercept the *Causal Evidence* misconception.

  1.  **The Setup (Whiteboard Left):**
      *   Draw a timeline: **Sunday** $\rightarrow$ **Monday** $\rightarrow$ **Tuesday**.
      *   **The Coin:** Flipped Sunday night. Fair coin (50/50).
      *   **The Rule (Write in Bold):**
          *   **HEADS:** Beauty is interviewed **Monday** AND **Tuesday**.
          *   **TAILS:** Beauty is interviewed **Monday** ONLY.
      *   **The Condition:** Between interviews, she is given a drug that induces amnesia. She knows the rules, but when she wakes up, she does not know the day, nor if she has been interviewed before.

  2.  **Intercepting Misconception #1 (Causal Evidence):**
      *   *Predicted Error:* Students will think waking up provides evidence about the coin flip (e.g., "If I'm awake, maybe it's more likely to be Heads because there are more days").
      *   *Intervention:* Ask immediately: "Did the act of waking up on Monday change the result of Sunday's coin flip?"
      *   *Consensus:* No. The coin is fixed. Waking up is a *consequence*, not a *cause*.
      *   *Teacher Note:* Secure agreement that the *objective chance* of the coin is 1/2. This isolates the disagreement to *credence*, not metaphysics.

  ## Phase 2: The Experience and Identity (8–15 Minutes)
  **Goal:** Clarify the amnesia mechanism. Intercept the *Amnesia/Identity* misconception.

  1.  **The Interview (Whiteboard Center):**
      *   Draw a stick figure (Beauty) in a chair.
      *   **The Question:** "What is your credence that the coin landed Heads?"
      *   **The Constraint:** She is warned: "You will be asked this exact question every time you wake up. You will not remember previous answers."

  2.  **Intercepting Misconception #2 (Amnesia Erases Subject):**
      *   *Predicted Error:* Students will argue, "The Beauty on Tuesday is a different person than the Beauty on Monday," or "Amnesia resets her identity."
      *   *Intervention:* Explicitly state: "It is the *same* biological person. She has the same memories of her life prior to Sunday. Only her memory of *this experiment* is wiped."
      *   *Philosophical Point:* Amnesia removes *information*, not *identity*. She is the same agent experiencing different temporal locations.
      *   *Whiteboard Visual:* Draw a single circle labeled "Beauty" with arrows pointing to Monday and Tuesday. Label the arrows "Lost Memory," not "New Person."

  ## Phase 3: The Conflict and Centered Belief (15–22 Minutes)
  **Goal:** Present the 1/2 vs. 2/3 disagreement as a structural clash of perspectives. Intercept the *Frequency vs. Credence* misconception. Introduce Centered vs. Uncentered belief.

  1.  **The Two Positions (Whiteboard Right):**
      *   **The Halfer (1/2):** "The coin is fair. I knew I would wake up at least once regardless of the outcome. Waking up gives me no *new* information about the coin. My credence remains 1/2."
      *   **The Thirder (2/3):** "There are three possible interviews I could be in: Heads-Mon, Heads-Tue, Tails-Mon. Two of these are Heads. Since I don't know which one I'm in, I should weight them equally. My credence is 2/3."

  2.  **Intercepting Misconception #3 (Frequency = Credence):**
      *   *Predicted Error:* "If we run this 100 times, she bets on Heads 150 times and wins 100. She wins 2/3 of her bets. So her belief *must* be 2/3."
      *   *Intervention:* Acknowledge the math is correct, but challenge the conclusion. "Winning bets is about *strategy*. Belief is about *truth*. Can you be rational in believing the coin is 50/50 even if betting on Heads pays better?"
      *   *Purpose:* This prevents the discussion from collapsing into decision theory. We are analyzing *belief*, not *profit*.

  3.  **The Core Distinction (Centered vs. Uncentered):**
      *   **Uncentered Belief (God's Eye View):** "What is the state of the world?"
          *   From outside the experiment, Heads and Tails are equally likely worlds. (Supports 1/2).
      *   **Centered Belief (The "You Are Here" View):** "Where am I within the world?"
          *   From inside the chair, you are sampling an *experience*. There are more Heads-experiences than Tails-experiences. (Supports 2/3).
      *   *Whiteboard Visual:* Draw a map of the experiment.
          *   Label the Halfer view: Pointing at the **Coin**.
          *   Label the Thirder view: Pointing at the **Chair** with a "You Are Here" sticker.
      *   *Takeaway:* The disagreement isn't about math; it's about whether "I am awake now" counts as evidence. For Halfers, it's trivial. For Thirders, it's self-locating evidence.

  ## Phase 4: Check for Understanding & Boundaries (22–30 Minutes)
  **Goal:** Verify grasp of self-location without arithmetic memorization. Define scope limits.

  1.  **Check for Understanding (The "Last Interview" Test):**
      *   *Do not ask:* "What is the probability?" (They will just guess 1/2 or 2/3).
      *   *Ask this instead:* "Suppose the interviewer whispers to Beauty: **'This is your final interview of the experiment.'** What should her credence in Heads be now?"
      *   *Correct Reasoning:*
          *   If Tails: Only one interview (Monday). It is the final one.
          *   If Heads: Two interviews (Mon, Tue). Only Tuesday is the final one.
          *   She is now in a scenario where being in the "final interview" is equally likely under Heads (Tuesday) or Tails (Monday).
          *   *Result:* Her credence should return to 1/2.
      *   *Why this works:* If they understood self-location, they will see that learning *where* she is in the sequence (Tuesday vs. Monday) eliminates the "counting" advantage. If they only memorized "Heads = 2/3," they will be stuck.

  2.  **Explicit Exclusions (What We Are Not Doing):**
      *   **No Formal Semantics:** Tell them: "We are not defining 'centered worlds' using possible-world semantics today. We are using the intuition of the 'You Are Here' map."
      *   **No Doomsday Argument:** Explicitly state: "This problem is structurally similar to the Doomsday Argument (anthropic reasoning), but we are setting that aside. We are focusing strictly on the relationship between memory, identity, and evidence."
      *   **No Decision Theory:** "We are not solving how she should bet. We are solving what she should believe."

  3.  **Closing Statement:**
      *   "The Sleeping Beauty problem shows that rational belief isn't just about what the world is like (the coin); it's also about where you stand in it (the interview). Whether you side with 1/2 or 2/3 depends on whether you think 'I am here' is information."

  ---

  ## Instructor Notes on Misconception Interception

  | Misconception | When it Arises | Interception Strategy |
  | :--- | :--- | :--- |
  | **Awakening as Causal Evidence** | Phase 1 (Setup) | Ask: "Did waking up change the coin?" Force agreement that causal flow is Coin $\rightarrow$ Awakening, not vice versa. |
  | **Amnesia = New Subject** | Phase 2 (Experience) | Clarify: "Same brain, same life history, wiped experiment memory." Distinguish *psychological continuity* from *information access*. |
  | **Frequency = Credence** | Phase 3 (Conflict) | Separate *betting success* (long-run) from *epistemic credence* (current state). Acknowledge the frequency is 2:1, question if belief must match. |

  ## Whiteboard Layout Summary

  *   **Left:** Timeline & Protocol (H=2 interviews, T=1 interview).
  *   **Center:** The "You Are Here" Diagram (Map of the experiment with the subject inside).
  *   **Right:** The Two Arguments (Halfer: Focus on Coin / Thirder: Focus on Experience).
  *   **Bottom:** The "Last Interview" Test (For assessment).
