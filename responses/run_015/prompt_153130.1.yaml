answer: |-
  ### Exam Question

  **Course:** POL 405: Contemporary Political Philosophy & Social Justice
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,500 words
  **Total Marks:** 25

  **Question:**
  Mainstream defenses of workfare often presuppose that welfare administration functions as a neutral mechanism for distinguishing between compliant and non-compliant citizens. Critics, however, contend that the category of the "undeserving poor" is not a pre-political moral kind that the state discovers, but rather a bureaucratic artifact produced by procedural opacity, asymmetric information, and the institutional demand that claimants perform docility and gratitude to prove moral worth.

  Evaluate this critique. In your answer, you must argue whether bureaucratic verification is a neutral epistemic exercise or a normative practice that constructs the very failure it claims to find. Do not simply rehearse contractarian arguments regarding reciprocity; focus instead on the ontology of the "undeserving" subject and the epistemology of administrative enforcement.

  ***

  ### Model Answer (Outline of Key Argumentative Moves)

  **1. The Ontological Claim: Rejecting the "Pre-Political" Moral Kind**
  The essay must first establish that the "undeserving poor" is not a natural or pre-political category waiting to be identified by the state. A pre-political view assumes moral failure exists independently of administration (e.g., laziness is an inherent trait). The critical counter-argument posits that "undeservingness" is ontologically dependent on the welfare state itself. Without the specific bureaucratic rules defining "compliance," the moral status of the claimant remains indeterminate. Therefore, the state does not *find* the undeserving; it *constitutes* them through the act of classification. The category is relational, not essential.

  **2. The Epistemic Asymmetry: Procedural Opacity as a Mechanism of Failure**
  The second move must analyze the information environment of the claimant. Administrative systems rely on asymmetric information where the state holds the rules and the claimant bears the burden of perfect compliance. When notice fails to arrive (e.g., missed appointments without notification) or forms are rejected on technicalities, the system records this as "non-compliance" rather than "administrative error." This epistemic asymmetry ensures that a portion of claimants will inevitably fail verification regardless of intent. Thus, the "failure" detected is often a byproduct of the verification design, not a reflection of the claimant's moral character or willingness to work.

  **3. The Performative Requirement: Docility and Gratitude as Currency**
  The third move must argue that compliance is not merely behavioral (seeking work) but performative (displaying the correct attitude). Bureaucratic verification often demands signs of deference, gratitude, and docility from claimants. A claimant who challenges a decision or asserts rights may be flagged as difficult or non-compliant, while one who accepts sanctions silently is viewed as rehabilitated. This shifts the metric of "deservingness" from economic need or labor participation to moral performance. The administration thereby manufactures a specific type of subject—the grateful recipient—and categorizes those who cannot or will not perform this subordination as "undeserving."

  **4. Verification as Normative Construction, Not Neutral Discovery**
  The final move must synthesize the previous points to conclude that fraud detection and sanctioning are normative practices, not neutral epistemic exercises. Treating verification as neutral assumes the rules are just and the data is accurate. However, if the rules are opaque and the data is generated by the system's own errors, the act of sanctioning is a political choice to prioritize administrative efficiency over claimant security. By defining technical breaches as moral failures, the bureaucracy constructs the "fraud" or "sanctionable offense" it claims to merely observe. Therefore, the "undeserving" are the output of a machine designed to produce scarcity and moral judgment, not the input that justifies the machine's existence.

  ***

  ### Marking Scheme

  | Argumentative Move | Marks | Criteria for Full Marks | Characteristic Student Error |
  | :--- | :---: | :--- | :--- |
  | **1. Ontological Status of the "Undeserving"** | **6** | Clearly distinguishes between "undeserving" as an inherent trait vs. a state-created classification; argues that the category is constitutive, not discoverable. | **Error:** Treating "undeservingness" as an objective moral reality that exists prior to state intervention. |
  | **2. Epistemic Asymmetry & Opacity** | **6** | Explains how burden of proof and information gaps (e.g., missed notices) structurally generate non-compliance data independent of claimant intent. | **Error:** Assuming administrative records are accurate reflections of claimant behavior rather than contested data points. |
  | **3. Performative Compliance (Docility)** | **6** | Identifies that "worthiness" requires emotional labor (gratitude/submission) beyond material compliance, and that resisting this performance triggers sanctions. | **Error:** Reducing compliance to economic activity (looking for work) while ignoring the behavioral/attitudinal demands of caseworkers. |
  | **4. Verification as Normative Practice** | **6** | Concludes that verification constructs the failure it finds; explicitly rejects the view of fraud detection as a neutral, technical exercise. | **Error:** Defending sanctions as a neutral "epistemic exercise" necessary to protect public funds from pre-existing fraud. |
  | **Structure & Coherence** | **1** | Essay is logically organized, stays within word limit, and maintains a critical philosophical tone throughout. | **Error:** Drifting into policy reform suggestions rather than maintaining philosophical critique of the category itself. |
  | **TOTAL** | **25** | | |

  ***

  ### Instructor's Note on Grading Standards

  **Crucial Penalty Clause:** Answers that treat fraud detection and sanctioning as a **neutral epistemic exercise** (i.e., assuming the bureaucracy merely observes pre-existing non-compliance) must be penalized heavily on **Move 4**. The core learning objective of this seminar is to recognize administration as a *normative practice* that constructs the very failure it claims to find. An answer that defends the system's epistemic neutrality has fundamentally failed to engage with the critical literature on bureaucratic violence and the social construction of the "undeserving."
