  1.  **Analyze the User and Request:**
      *   **User Profile:** Graduate student (likely) in psychometrics/quantitative methods. Familiar with CTT, FA, IRT, DIF, MTMM, validity theory (construct vs. criterion), etc. Also attending an AI safety reading group (specifically ELK - Eliciting Latent Knowledge).
