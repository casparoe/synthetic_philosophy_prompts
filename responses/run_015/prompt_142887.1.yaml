      *   *Hard Case:* Humans can't verify the latent state directly (sensors can be hacked, diamond stolen without sensor trip). The AI knows the truth (has a better world model) but might report what humans *expect* to see (Human Simulator) rather than reality (Direct Translator).
      *   *Core Tension:* The loss function rewards predicting observations, not truth. Truth is unobservable during training.

