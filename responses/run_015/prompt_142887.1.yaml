      *   **The Ask:** Translate the ELK problem into psychometric vocabulary. Do this in three passes (Clean Translation, Distorted Translation, No Expression). Then address three specific suspicions/hypotheses regarding latent variables, failure modes (Goodhart vs. Channel vs. Inversion), and the fundamental verdict on whether ELK is solvable by psychometrics.
