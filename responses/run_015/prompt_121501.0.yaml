answer: |-
  **Final Examination: Philosophy of Mind Seminar**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should be structured as a coherent philosophical essay.

  **Question**

  Functionalism individuates mental states purely by their causal-functional roles, whilst multiple realizability claims these roles may be realised in physically diverse substrates. However, specifying roles with sufficient precision to exclude pathological realisers—systems replicating macro-level input-output patterns without appropriate micro-level causal coherence—appears to require fixing a privileged level of functional abstraction. Evaluate whether a functionalist can consistently maintain both claims. Does fixing such a level either smuggle in substrate-dependent constraints, thereby undermining multiple realizability, or render the functional description so abstract that it loses empirical content and cannot distinguish genuine cognition from sophisticated simulation?

  ***

  **Model Answer**

  The central tension facing contemporary functionalism is not merely the compatibility of mental states with diverse physical bases, but the precise level of abstraction at which functional roles are individuated. This level-individuation problem presents a dilemma: if functional roles are specified too finely to ensure causal coherence, multiple realizability is threatened; if specified too coarsely to accommodate diverse realisers, the distinction between genuine cognition and mere simulation collapses. A consistent functionalist must navigate between substrate chauvinism and vacuous abstraction.

  The first horn of the dilemma concerns the exclusion of pathological realisers. Consider a system that matches the input-output profile of a pain state without possessing the internal causal architecture typically associated with suffering, such as a giant look-up table or a homunculus-headed robot. To exclude such cases, the functionalist must specify the causal role with sufficient granularity to capture the internal processing dynamics, not just the behavioural outputs. However, specifying these dynamics with high precision risks tying the mental state to specific physical mechanisms. If the functional description requires specific feedback loops or temporal processing speeds that only biological neurons or specific silicon architectures can satisfy, the claim that mental states are multiply realizable becomes untenable. The functional role effectively hardens into a substrate-dependent constraint, violating the core functionalist tenet that mental states are independent of their physical constitution.

  Conversely, the second horn suggests that to preserve multiple realizability, the functional description must remain highly abstract. If the role is defined solely by broad input-output relations, almost any system mimicking the behaviour counts as possessing the mental state. This leads to the loss of empirical content. If a sophisticated simulation running on a distinct architecture is functionally equivalent at this abstract level, functionalism must concede it possesses genuine mental states. Yet, intuition suggests a distinction between a system that merely computes the right answers and one that genuinely understands or feels. By rendering the functional description so abstract that it ignores the causal coherence of the internal states, functionalism loses the ability to distinguish genuine cognition from sophisticated simulation. The theory becomes vacuous, attributing mental states to systems that lack the requisite causal integration.

  One might attempt to resolve this by appealing to 'normal' or 'typical' realization conditions. The argument suggests that we individuate roles based on how they are typically realised in standard cases, thereby excluding pathological outliers without fixing a rigid substrate. However, this appeal risks circularity. To define what counts as a 'normal' realiser, one must already know which systems possess the mental state in question. If we determine normality by looking at humans, we privilege the human substrate, smuggling in biological chauvinism. If we determine normality by looking at any system that functions correctly, we presuppose the very functional equivalence we are trying to establish. Thus, appealing to typicality does not solve the individuation problem; it merely masks the decision about which level of abstraction is privileged.

  This dilemma impacts both type and token functionalism, though differently. For type functionalism, which identifies mental types with functional types, the level-individuation problem is existential. If the functional type cannot be specified without referencing physical types, type identity fails. For token functionalism, which identifies mental instances with causal roles in specific systems, the problem shifts to individuation criteria. Even if tokens are distinct, determining whether a specific token realizes a mental state requires the same level-specific judgment. If the level is too abstract, a single transistor might realize a 'belief'; if too specific, only human brains realize 'pain'. Both versions struggle to define the boundaries of the functional role without collapsing into physicalism or panpsychism.

  Furthermore, it is a misconception that multiple realizability entails that any physically different system with identical behavioural outputs necessarily possesses the same mental states. Multiple realizability allows for distinct physical bases to realize the same function, but it does not guarantee that behavioural equivalence equals functional equivalence. Two systems might produce identical outputs via entirely different causal pathways. Functionalism requires causal role identity, not merely behavioural matching. Ignoring this distinction leads to the second horn of the dilemma, where simulation is conflated with cognition.

  To resolve this, the functionalist should supplement pure functionalism with a non-functional constraint, such as a historical or structural requirement. For instance, one might argue that a system must not only play the causal role but also possess a specific organizational history or structural integrity that ensures the coherence of the role. This avoids substrate dependence because the constraint is organizational rather than material, yet it prevents vacuous abstraction by ruling out look-up tables that lack internal causal integration. However, this resolution succeeds only partially. It saves multiple realizability from collapsing into physicalism, but it introduces a new criterion that is not purely functional. Consequently, pure functionalism is untenable; a hybrid account is required to maintain consistency. The functionalist must concede that causal roles alone are insufficient for individuation without a prior commitment to the structural legitimacy of the realiser.

  In conclusion, the level-individuation problem demonstrates that functionalism cannot consistently maintain both pure causal individuation and robust multiple realizability without modification. Fixing the level either restricts realizability or dilutes empirical content. Appeals to normality are circular. While supplementing functionalism with structural constraints offers a viable path, it admits that functional roles are not the sole determinants of mental states. Thus, the dilemma stands as a significant challenge to the coherence of standard functionalist theories.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  **Assessment Criteria:**
  Candidates are awarded marks based on the following five specific moves. To achieve an A-range grade (16–20 marks), the answer must successfully execute all five moves. A B-range grade (10–15 marks) will exhibit partial success or significant errors in these areas.

  | Move | Description of Required Move | Marks Available | Typical Error (Causing Loss of Marks) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Diagnosing the Tension:** Correctly identifies the core problem as a dilemma about *individuation levels* (precision vs. abstraction), rather than merely describing functionalism and multiple realizability as separate concepts. | 4 | Treating the question as a general prompt to define functionalism and list examples of multiple realizability without addressing the conflict between specificity and abstraction. |
  | **2** | **Engaging with Circularity:** Explicitly analyses why appealing to 'normal' or 'typical' realization conditions fails to resolve the dilemma, demonstrating understanding of the circularity involved. | 4 | Mentioning 'normal conditions' as a solution without critiquing it, or stating it is circular without explaining *why* (i.e., presupposing the mental state to define the condition). |
  | **3** | **Substantive Resolution:** Offers a defended resolution to the dilemma (e.g., hybrid view, rejecting a horn, or embracing abstraction) and evaluates whether it succeeds, rather than concluding the issue depends on further empirical investigation. | 4 | Concluding that neuroscience must decide the level of abstraction, or refusing to take a stance on whether the proposed resolution succeeds. |
  | **4** | **Token/Type Distinction:** Shows how the level-individuation problem affects both token-functionalism and type-functionalism, distinguishing the implications for each. | 4 | Discussing functionalism as a monolith without distinguishing how the individuation problem impacts type-identity versus token-instance attribution. |
  | **5** | **MR Misconception:** Avoids the misconception that multiple realizability entails that identical behavioural outputs necessarily imply identical mental states, clarifying the requirement for causal role identity. | 4 | Arguing that if a simulation behaves exactly like a human, it must have the same mental states simply because of multiple realizability, ignoring internal causal structure. |

  **Grade Boundaries:**
  *   **A-Range (16–20):** All five moves executed clearly and accurately. Argument is coherent, philosophically rigorous, and adheres to British English conventions.
  *   **B-Range (10–15):** Three or four moves executed well; may contain minor philosophical errors or lack depth in the resolution.
  *   **C-Range (5–9):** Fewer than three moves executed; significant misunderstanding of the dilemma or reliance on standard textbook summaries.
  *   **D-Range (0–4):** Fails to address the specific tension; significant errors in understanding functionalism.
