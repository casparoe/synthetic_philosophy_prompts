answer: |-
  You have hit on the central tension in the philosophy of social action. Your intuition is correct: Bratman and Searle are not merely offering competing answers to the *same* question; they are asking fundamentally different questions, though they overlap in the territory of "what makes action joint."

  Searle is asking an **ontological** question: *What is the form of the mental state involved in collective action?*
  Bratman is asking a **functional/reductive** question: *How can collective action be constructed out of the standard resources of individual rational agency?*

  Here is a careful comparison of their views, structured around the three specific points you raised.

  ### 1. Normative Force: Rational Constraint vs. Ontological Fact

  Your first question asks whether Bratman explains the *normative force* of joint action or merely describes the psychology.

  **Bratman: Normativity as Rational Consistency**
  Bratman's account is grounded in his planning theory of individual intention. For Bratman, intentions are not just desires; they are plan-states that resist reconsideration and constrain future deliberation. When this is scaled to the social realm, the "normativity" of joint action is derived from the **rational norms of planning**.

  If I share an intention with you, I am rationally committed to coordinating my sub-plans with yours. If I suddenly deviate without notice, I am being *irrational* (inconsistent with my own plan-state), not necessarily *immoral*. Bratman explains the "ought" of joint action as a requirement of **means-end coherence and consistency**.
  *   **Strength:** This explains *why* agents feel bound to each other without invoking mysterious social entities. It grounds the norm in the individual's own rationality.
  *   **Weakness:** Critics (like Margaret Gilbert) argue this is too weak. It explains why I *should* coordinate if I want to be rational, but it doesn't explain the **obligation** I owe *you*. If Bratman is right, breaking a joint commitment is like changing your mind about a solo plan; it's a failure of consistency, not a betrayal of a partner. So, Bratman explains the *structure* of the commitment, but many argue he misses the *interpersonal obligation*.

  **Searle: Normativity Internal to the Mode**
  Searle does not focus heavily on normativity in the same way. For Searle, the "We-intention" is a primitive biological fact. The normativity is internal to the intentional state itself, much like how a promise creates an obligation simply by virtue of being a promise.
  *   **Comparison:** Searle assumes the normative force comes with the territory of having a "We-intention." He doesn't derive it from individual rationality (as Bratman does); he posits it as part of the content of the mental state.
  *   **Verdict:** Bratman offers a richer *explanation* of how the normativity functions (via meshing sub-plans and mutual responsiveness), but it is a "thin" rational normativity. Searle posits a "thick" collective normativity but offers less explanation of its mechanics, treating it as a brute fact of human biology.

  ### 2. Explanatory Primitive: Insight or Circularity?

  Your second question concerns whether Searle's "We-intention" is a genuine explanatory primitive or a case of naming the phenomenon (the *dormitive virtue* objection).

  **The Reductionist Challenge (Bratman's Angle)**
  Bratman represents the methodological individualist. He argues that we should not multiply mental states beyond necessity. If we can explain "We intend to sing a duet" using "I intend that we sing," "You intend that we sing," and "We know this," then positing a new primitive "We-intention" is unnecessary.
  From this viewpoint, Searle risks circularity:
  *   *Question:* "Why are we acting together?"
  *   *Searle:* "Because we have a We-intention."
  *   *Question:* "What is a We-intention?"
  *   *Searle:* "An intention to act together."
  If the primitive cannot be analyzed further, does it actually *explain* anything, or does it just label the mystery of sociality?

  **Searle's Defense: The Content Argument**
  Searle argues that reductionism fails because the **content** of the intention is different.
  *   *Case:* Imagine I intend to push a car, and you intend to push a car. We are both pushing. Do we have a shared intention? No, we are just coincidentally pushing.
  *   *Searle:* To explain the difference between coincidence and cooperation, the *content* of my mind must be different. I must intend "That *we* push," not just "That *I* push (while you happen to push)."
  *   **Verdict:** Searle is not merely naming the phenomenon; he is making a claim about the **phenomenology and logic of mental content**. He argues that individualistic psychology literally cannot capture the "togetherness" without distorting the mental state. However, Bratman would counter that he *can* capture the togetherness through the *interlocking* of individual contents (mutual knowledge + meshing).
  *   **Conclusion:** Searle's primitive is genuine if you accept that some mental states are irreducibly social. It is circular only if you demand that all explanation must be reductive. Bratman's account is more mechanically explanatory (it shows the gears), while Searle's is ontologically explanatory (it identifies the fundamental substance).

  ### 3. Edge Cases: Dropouts and Disagreement

  This is where the practical differences between the theories become starkest.

  **Case A: The Dropout (One participant stops caring)**
  *   **Bratman:** Because Bratman's account relies on **interlocking intentions**, the dropout is critical. If I cease to intend that we J, the web of interlocking intentions is broken. However, Bratman adds a layer of **stability**. Because shared intention involves a commitment to coordinate, I cannot simply drop out silently. I have a rational obligation to notify you so you can adjust your plans. If I drop out without notice, I violate the norms of the shared intention, even if the shared intention itself dissolves.
  *   **Searle:** For Searle, the We-intention is in the head of the individual. If I stop having the We-intention, I am no longer participating in the collective action, regardless of what you think. Searle is less concerned with the *process* of dissolution. The collective action persists only as long as the relevant agents possess the We-intention. It is a more binary switch: I have the state, or I don't.

  **Case B: Disagreement on Sub-plans (Acting together without full agreement)**
  *   **Bratman:** This is Bratman's strongest suit. He introduces the requirement of **meshing sub-plans**. We can intend to paint the house together, but if I intend to use red paint and you intend to use blue, our sub-plans do not mesh. For Bratman, **there is no shared intention** until we resolve this conflict. We might be *trying* to form a shared intention, but functionally, we are not yet acting jointly. This explains why negotiation is a prerequisite for joint action.
  *   **Searle:** Searle's account is more holistic and potentially looser here. If we both have the We-intention "That we paint the house," Searle might say we are acting jointly even if we haven't sorted out the color. The conflict exists *within* the execution of the We-intention. Searle allows for a collective state to exist even if the details are unresolved, whereas Bratman argues that unresolved conflicts in sub-plans prevent the shared intention from existing in the first place.

  ### Summary of the Disagreement

  To answer your overarching worry: **They are not answering the same question.**

  1.  **Bratman** is providing a **functional analysis**. He wants to show how social action is possible for beings like us, who are fundamentally individual planners. He is interested in the *conditions* required for joint action to succeed (meshing, mutual knowledge, stability).
  2.  **Searle** is providing an **ontological classification**. He wants to categorize the *type* of mental state involved. He is interested in proving that social facts are not reducible to individual facts.

  **Where the disagreement actually lies:**
  The disagreement is on **Methodological Individualism**.
  *   If you believe all social phenomena must be explicable in terms of individual psychology plus interaction, **Bratman** wins. He gives you the mechanics of how the individual psychology works.
  *   If you believe the "social" is a fundamental feature of the mind that cannot be broken down without loss of meaning, **Searle** wins. He protects the phenomenon from being reduced to a mere coincidence of individual states.

  **Recommendation:**
  If you are interested in the **norms, obligations, and stability** of joint action (e.g., law, morality, institutional design), Bratman is the more useful framework because he details the *connections* between agents.
  If you are interested in the **nature of the mind, phenomenology, or the foundation of social reality**, Searle is the stronger view because he refuses to reduce the "We" to an aggregate of "I"s.

  You are stuck because you are looking for one to refute the other. They are better viewed as addressing different layers of the same problem: Searle describes the *mental fuel*, while Bratman describes the *engine*.
