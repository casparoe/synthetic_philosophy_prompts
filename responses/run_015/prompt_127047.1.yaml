answer: |-
  This is a classic "Ship of Theseus" problem wrapped in insurance liability and institutional pressure. In post-1960 art, **intent often overrides material**, but **material continuity often overrides intent** when it comes to insurance valuation.

  Below is the **Material-Intent Continuity Protocol (MICP)**. It is designed for a 48-hour turnaround with one Registrar and one Conservator. It moves from hard evidence (contracts) to soft evidence (philosophy) to institutional risk.

  ### The Material-Intent Continuity Protocol (MICP)

  **Instructions:** Answer sequentially. If you hit a **STOP**, the object is no longer cataloged as the "Original Work" without senior intervention. If you hit a **FLAG**, you must consult the Curator before finalizing the status.

  #### Gate 1: Authority & Instructions (The "Rulebook" Test)
  *   **Question:** Is there a signed loan agreement, certificate of authenticity, or artist instruction sheet that explicitly defines replacement, decay, or material substitution?
  *   **Pass:** No document exists OR document permits the specific change that occurred.
  *   **Fail (STOP):** Document explicitly forbids the change (e.g., "No replacement parts," "Must remain unfired").
  *   **Flag (Consult Curator):** Document exists but is ambiguous (e.g., "Biologically connected," "Essential character maintained").
  *   **Evidence Needed:** Accession file, artist contract, correspondence.

  #### Gate 2: Material Phase & Chemistry (The "Stuff" Test)
  *   **Question:** Has the chemical or phase state of the primary material changed *outside* the expected aging process?
  *   **Pass:** Material is chemically identical (e.g., oak replaced with oak) OR change is part of the defined process (e.g., rusting iron).
  *   **Fail (STOP):** Phase change alters the fundamental nature of the work (e.g., unfired clay becomes fired ceramic; ice becomes water/resin).
  *   **Flag (Consult Conservator):** Material is different but functionally indistinguishable to the naked eye (e.g., original pigment vs. modern archival match).
  *   **Evidence Needed:** Conservator's material analysis report.

  #### Gate 3: The "Heart" Component (The "Essentialism" Test)
  *   **Question:** Was the damaged/destroyed part defined by the artist as central, critical, or generative to the work (e.g., "The Heart," "The Seed," "The Score")?
  *   **Pass:** Damage is peripheral or structural only (e.g., armature, base, non-visible support).
  *   **Fail (STOP):** The specific component identified as the "core" or "generator" is destroyed and replaced.
  *   **Flag (Consult Curator):** The component is visually central but not explicitly defined as conceptually critical.
  *   **Evidence Needed:** Artist statements, catalogue raisonné, installation history.

  #### Gate 4: Continuity of History (The "Ship of Theseus" Test)
  *   **Question:** Does the object maintain an unbroken chain of existence, or was there a moment of "death" followed by "rebirth"?
  *   **Pass:** Restoration happened *in situ* or immediately to prevent loss; the object was never "gone."
  *   **Fail (STOP):** The object was destroyed/lost and rebuilt from scratch later (Reconstruction).
  *   **Flag (Consult Registrar):** Significant percentage (>30%) of material replaced, but done gradually over time.
  *   **Evidence Needed:** Incident reports, conservation logs, dates of intervention.

  #### Gate 5: The Institutional Risk (The "Money" Test)
  *   **Question:** If we label this "Original," and the truth comes out later, does it constitute fraud or insurance misrepresentation?
  *   **Pass:** The change is documented, visible upon close inspection, and consistent with peer museum standards for this artist.
  *   **Fail (STOP):** Labeling it "Original" would violate insurance underwriting or legal definitions of authenticity.
  *   **Flag (Consult Legal/Board):** The Board wants it displayed, but the Artist/Estates says it is a copy.
  *   **Evidence Needed:** Insurance policy definitions, legal counsel memo (if time permits).

  ---

  ### Case Applications

  #### Case 1: The 1978 Unfired Clay Figure (Fired in Storage)
  *   **Gate 1 (Authority):** No instructions. Artist dead. **PASS.**
  *   **Gate 2 (Material):** Unfired clay $\rightarrow$ Fired ceramic. This is a chemical phase change (sintering). It is no longer the material specified. **FAIL (STOP).**
  *   **Gate 3 (Heart):** N/A (Stopped at Gate 2).
  *   **Verdict:** **Not the Original.**
  *   **Action:** Recatalog as "Altered State" or "Version 2." Insurance value likely drops significantly as the medium has fundamentally changed. You cannot insure it as "Unfired Clay."
  *   **Disagreement Flag:** A conservator might argue the *form* is preserved. However, in post-60 sculpture, material process (unfired vs. fired) is often the work itself. This is a hard stop.

  #### Case 2: The 1994 "Living Wood" Assemblage (Termite Damage)
  *   **Gate 1 (Authority):** Contract says "Biologically connected to the original tree." You used oak from a *different* tree. **FLAG (Ambiguous).**
      *   *Analysis:* Does "biologically connected" mean "same organism" (impossible if dead) or "same species"? Given the title "Living Wood," it implies the specific organism.
  *   **Gate 2 (Material):** Oak replaced with Oak. **PASS.**
  *   **Gate 3 (Heart):** 40% internal structure. Not visually central, but structurally critical. **FLAG.**
  *   **Gate 4 (Continuity):** Gradual decay and replacement. **PASS.**
  *   **Gate 5 (Risk):** Contractual violation. **FLAG (Consult Curator/Legal).**
  *   **Verdict:** **Judgment Call.**
  *   **Action:** You cannot clear this without the Curator. The contract language is the trap. If "biologically connected" means "same DNA," this is a copy. If it means "same species," it's a restoration.
  *   **Recommendation:** Do not label "Original" until the Estate clarifies the contract language. If they don't respond, label "Restored per 1994 Agreement (Interpretation Pending)."

  #### Case 3: The 2010 Installation (Synthetic Heart)
  *   **Gate 1 (Authority):** Artist is alive. Artist says: "Without the original heart it's just a copy." **FAIL (STOP).**
      *   *Note:* In contemporary art, the living artist's definition of authenticity trumps the museum's desire to display.
  *   **Gate 2 (Material):** Clay $\rightarrow$ Synthetic Polymer. **FAIL (STOP).**
  *   **Gate 3 (Heart):** Component explicitly named "The Heart." **FAIL (STOP).**
  *   **Gate 4 (Continuity):** Destroyed in shipping, then rebuilt. Moment of "death" occurred. **FAIL (STOP).**
  *   **Gate 5 (Risk):** Board wants display; Artist says Copy. **FLAG (Consult Legal/Board).**
  *   **Verdict:** **Metaphysically and Catalogually: A Copy/Reconstruction.**
  *   **Action:**
      1.  **Catalogue:** Status must be "Reconstruction" or "Artist-Authorized Replica."
      2.  **Insurance:** Insure as a "Reproduction" value, not "Original" value (unless the Artist agrees to certify the reconstruction as the new original).
      3.  **Display:** You *can* display it, but the wall text *must* say "Reconstruction" or "Restored Version."
      4.  **The Override:** You asked if you will override this. **Yes, you probably will, but you must shift the liability.**
          *   Get the Artist to sign a document stating: "I authorize this reconstruction to be exhibited as [Work Title], though I maintain it is not the original material."
          *   If they refuse, and the Board displays it as "Original," you are exposing the museum to reputational damage and potential legal action from the Artist (moral rights violation).
          *   **Practical Move:** Display it, but catalog it internally as "Reconstruction." Do not let the public label say "Original."

  ---

  ### The "Case 3" Truth Bomb
  You asked for honesty: **You are going to display Case 3.**

  Museums rarely deaccession or crate-and-store a major installation because of a material swap, especially if it looks identical. However, the MICP tells you that you cannot call it the "Original" in your permanent records without lying.

  **The Compromise:**
  1.  **Internal Record:** Status = "Reconstruction."
  2.  **Insurance:** Value = Replacement Cost of the *Reconstruction*, not the market value of the *Original* (unless the Artist certifies the reconstruction holds the original value).
  3.  **Public Label:** "Reconstructed [Year]" or "Restored Version."
  4.  **Why:** If you label it "Original" and the Artist sues or goes public, the museum loses. If you label it "Reconstruction," the Board gets their display, the public sees the art, and the Artist's moral rights are respected.

  ### Where the Procedure Breaks (The "Reasonable Disagreement" Zones)
  The MICP cannot force an answer in these specific scenarios. If you hit these, you **must** punt to the Curator. There is no philosophical algorithm for them.

  1.  **The "Vibe" Threshold (Gate 2 Flag):** When materials are different but visually indistinguishable (e.g., original fluorescent tube vs. archival LED replica). One registrar says "It's the light that matters," another says "It's the voltage that matters." The checklist flags this; it doesn't solve it.
  2.  **The "Ambiguous Contract" (Gate 1 Flag):** As seen in Case 2. "Biologically connected" is poetry, not law. The checklist identifies the conflict but requires a human to interpret intent.
  3.  **The "Living Artist vs. Board" (Gate 5 Flag):** As seen in Case 3. The checklist confirms the Artist is right metaphysically, but the Board holds the budget. The checklist forces you to document the dissent, but it cannot stop the Board from overruling you.

  ### Summary for your Team
  *   **Print this protocol.** Keep it in the conservation file.
  *   **If you hit a STOP:** The object is not the original. Do not pass Go.
  *   **If you hit a FLAG:** Get the Curator in the room. Document their decision in the accession file.
  *   **For Case 3:** Do not fight the Board on *displaying* it. Fight them on *labeling* it. That is your fiduciary duty.
