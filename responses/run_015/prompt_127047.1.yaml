      *   **Collection Focus:** Post-1960 sculpture (often process-based, ephemeral, decaying materials).
      *   **Problem:** Determining identity/authenticity of damaged/restored works for cataloging and insurance.
      *   **Requirements:**
          *   Reusable decision procedure (checklist/flowchart style).
          *   Grounded in material constitution philosophy (parts/wholes/continuity) but accessible to interns.
          *   Handle specific complexities: Intentional decay vs. accidental damage, Artist status (alive/dead/estate), Contractual stipulations.
          *   Output: Ordered questions, pass/fail criteria, "punt to human" flags.
          *   Application: Run on three specific cases (Clay/Ceramic, Living Wood, Synthetic Heart).
          *   Tone: Practical, honest about limitations, acknowledging the tension between metaphysics and museum reality (exhibition pressure).
          *   Constraints: 48-hour turnaround, limited staff (Registrar + Conservator), legal only if flagged.

  2.  **Deconstruct the Philosophical Basis (for the Backend):**
      *   *Ship of Theseus:* When do replaced parts make it a new object?
      *   *Material Constitution:* Is the work the matter (clay/wood) or the form/structure?
      *   *Continuity:* Is there an unbroken history of existence?
      *   *Artist Intent:* In contemporary art, intent often trumps materiality (Conceptual Art).
      *   *Functional Identity:* Does it perform the same role in the collection/exhibition?

  3.  **Drafting the Decision Procedure (The "Identity Protocol"):**
      *   *Goal:* Make it a funnel. Start with hard facts (documentation), move to materiality, then to intent, then to the "gray zone."
      *   *Step 1: Documentation & Provenance.* (Hard evidence).
      *   *Step 2: Material Continuity.* (The "Stuff" test).
      *   *Step 3: Structural/Functional Integrity.* (The "Form" test).
      *   *Step 4: Artist/Authority Intent.* (The "Voice" test).
      *   *Step 5: The "Ship of Theseus" Threshold.* (The quantitative/qualitative limit).
      *   *Step 6: The Institutional Risk Flag.* (The "Money/Reputation" test).
      *   *Stopping Rules:* Where do we stop and say "It's a copy" vs. "It's the work"?
      *   *Escape Hatches:* Where do we call the Curator/Legal?

      *Refining for the User's Constraints:* Needs to be fast (48 hours). Needs to handle the "process-based" twist (decay is okay, *wrong* decay is not).
      *Revision:* Let's organize it into "Gates."
      *   Gate 1: Authority & Instructions (Artist/Contract).
      *   Gate 2: Material & Process (Is the change consistent with the work's nature?).
      *   Gate 3: Extent of Loss (How much is gone?).
      *   Gate 4: The "Heart" Test (Critical components).
      *   Gate 5: The Institutional Call (When philosophy fails).

  4.  **Developing the Cases:**

      *   **Case 1 (Clay to Ceramic):**
          *   *Facts:* Unfired clay -> Fired ceramic. Artist dead. No instructions.
          *   *Analysis:* Material change is fundamental (chemical change). Process change (firing) was not original.
          *   *Verdict:* Likely "Altered Work" or "Version 2," not original. But maybe acceptable for display with caveat.
          *   *Philosophical hook:* Lockean mass vs. Aristotelian substance.

      *   **Case 2 (Living Wood/Termites):**
          *   *Facts:* Specific oak -> 40% replaced with *different* oak. Contract says "biologically connected."
          *   *Analysis:* Contractual violation? "Biologically connected" is vague. 40% is high.
          *   *Verdict:* High risk. Needs legal/curator. Identity is compromised by contract terms.

      *   **Case 3 (Synthetic Heart):**
          *   *Facts:* Clay core ("heart") destroyed. Replaced with synthetic. Artist says "Copy." Board wants display.
          *   *Analysis:* Artist intent is usually king in post-60 art. "Heart" implies essential part.
          *   *Verdict:* Metaphysically/Art Historically = Copy. Institutionally = Maybe display as "Reconstruction."
          *   *User's specific worry:* Will I override? Yes, probably, but must label correctly.

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make sure the "Intern" can use it. Avoid jargon like "mereological essentialism." Use "Critical Parts."
      *   Ensure the "Punt" points are clear.
      *   Address the "48-hour" constraint. The checklist needs to be actionable *now*.
      *   *Crucial Addition:* Distinguish between "Identity" (Is it the work?) and "Exhibitability" (Can we show it?). The prompt asks about identity for catalogue/insurance, but hints at exhibition pressure. I need to keep these distinct but acknowledge the overlap.

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the "metaphysics vs. insurance" tension.
      *   **The Protocol:** "The Material-Intent Continuity Protocol (MICP)." Keep it to 5 Steps.
      *   **The Cases:** Apply the protocol rigorously.
      *   **The "Case 3" Reality Check:** Be honest about the Board vs. Artist conflict.
      *   **The "Disagreement" Flags:** Explicitly point out where the protocol admits uncertainty.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 1 too legalistic?
      *   *Fix:* Keep it to "Is there a contract/certificate?" If yes, follow it. If no, move to material.
      *   *Critique:* Case 1 involves firing clay. That's a phase change.
      *   *Fix:* Ensure the protocol asks about "Chemical/Phase State."
      *   *Critique:* The user wants to know if they will override Case 3.
      *   *Fix:* I need to be direct. "Yes, museums often do this, but you change the status to 'Reconstruction'."
      *   *Tone Check:* Professional, empathetic to the registrar's stress, not overly academic.

  8.  **Final Polish:** Check against constraints (48 hours, 1 registrar + 1 conservator). Ensure the "Stop/Go" signals are clear. (e.g., "STOP: Consult Curator").

  *(Self-Correction on Case 2)*: The contract says "biologically connected." Replacing with wood from a *different* tree technically breaks this, even if it's the same species. This is a hard fail on the contract, regardless of the metaphysics. I need to highlight that.

  *(Self-Correction on Case 3)*: The artist is alive. In contemporary art, the artist's voice is the primary authority. If they say it's a copy, the museum cataloging it as "Original" is fraud. I must emphasize this risk.

  9.  **Final Output Structure:**
      *   Intro.
      *   The Protocol (5 Gates).
      *   Case Studies (Applied Protocol).
      *   The "Case 3" Truth Bomb.
      *   Known Failure Points (Where reasonable people disagree).

  10. (Final review of the prompt's specific request): "Ordered questions, what counts as a passing answer at each step, where we stop and say 'not the original,' and where we have to punt." -> Make sure these are explicit in the Protocol section.

