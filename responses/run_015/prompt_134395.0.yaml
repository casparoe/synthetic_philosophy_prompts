      *   *Axiom 3:* `feature: necessary_existence` is in `approved_features`.

  5.  **Analyzing the Residue (The "Fudge" Factors):**
      *   *Modal Logic vs. Build Env:* Modal logic deals with *metaphysical* possibility (ways the world could be). Build systems deal with *technical* compatibility (ways the compiler is configured).
      *   *Entailment:* In logic, $P \to Q$ is abstract. In builds, dependency is concrete. If I have `SSL`, do I *necessarily* have `Networking`? Usually yes, but logic allows stricter implication.
