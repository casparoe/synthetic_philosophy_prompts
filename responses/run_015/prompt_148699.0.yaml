  **(i) Is presentism about harm correct? (Probability: 0.30)**
  Presentism (the view that only the present exists) is a minority position in contemporary metaphysics, heavily challenged by Special Relativity and the benefits of B-theory (eternalism) for semantic and scientific coherence. Presentism *about harm* is even more restrictive, requiring the subject and the harmful state to be co-present. Given the dominance of eternalist frameworks in philosophy of time and the viability of cross-temporal relations (e.g., causation, memory), I assign a low probability to the metaphysical prerequisite.

  **(ii) Under presentism, does the 'no-subject' objection defeat deprivation? (Probability: 0.80)**
  Conditional on Presentism being true, the inference is strong. If only the present exists, there is no ontological locus for a "deprivation" to attach to a non-existent subject. While some presentists attempt to locate harm at the time of the *cause* (the fatal event), this strains the definition of harm as a state of the subject. The "no-subject" objection is the logical backbone of Epicureanism; if Presentism holds, this objection is fatal to the deprivation account in 80% of plausible formalizations.

  **(iii) Dependence on experiential well-being? (Probability: 0.50)**
  The thesis collapses if well-being includes objective goods (achievement, narrative coherence) that can be frustrated posthumously. If "harm" includes the nullification of life projects, the subject's non-existence is irrelevant to the *fact* of the frustration. Experientialism (hedonism/desire-satisfaction requiring consciousness) is no longer the default in well-being theory (post-Parfit/Nagel). There is a 50% chance well-being is sufficiently objective to sustain harm without a concurrent conscious bearer, which would falsify the thesis even if Presentism were true.

  **(iv) Could partial survival undermine the elimination premise? (Probability: 0.90)**
  Social or narrative "survival" is metaphorical, not metaphysical. It does not preserve a subject capable of *bearing* harm in the requisite sense. There is a 90% probability that partial survival is insufficient to ground a deprivation claim, so this factor does little to rescue the thesis, but it confirms the 'no-subject' premise is robust against this specific counter.

  **Derivation**
  $$ \text{Credence} = P(\text{i}) \times P(\text{ii}|\text{i}) \times P(\text{iii}) \times P(\text{iv}) $$
  $$ \text{Credence} = 0.30 \times 0.80 \times 0.50 \times 0.90 = 0.108 $$
  Rounded to **0.12** to account for model uncertainty and potential hybrid theories of time/welfare.

  **Sensitivity Analysis**
  My credence is most sensitive to **sub-question (i): The metaphysics of time.**
  Because this is a multiplicative chain, the low probability of Presentism (0.30) acts as the primary bottleneck. If Presentism were established as true (moving $P(\text{i})$ from 0.30 to 0.70), my credence in the thesis would more than double to ~0.28, making the Epicurean conclusion a serious contender rather than a fringe position. The other factors are conditional on this metaphysical foundation.

  **Argument for Maximum Shift**
  The argument that would shift my number the most is a **resolution to the Special Relativity objection that validates Global Presentism.**
  Currently, the incompatibility of a universal "now" with relativistic physics is the strongest evidence against Presentism. A coherent metaphysical model that reconciles a privileged present with relativistic invariance would drastically increase $P(\text{i})$, thereby validating the antecedent and forcing a rigorous re-evaluation of the harm of death. Conversely, a definitive proof that **posthumous achievement-nullification is incoherent** (solidifying Objective List theories) would lower $P(\text{iii})$, driving my credence toward zero.
