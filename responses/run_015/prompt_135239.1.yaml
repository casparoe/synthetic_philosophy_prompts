answer: |-
  hey, this is a great setup. the "suspended stream" is way more visceral than the ship of theseus because it involves *agency* and *debt*, not just planks on a boat. it forces the question: is identity about the *story* or the *causal plumbing*?

  here's a run-sheet for "The Suspended Stream Tribunal." it's designed to be tight (45 mins activity, 45 mins debrief) so you have time for the heavy lifting later.

  ### the setup: "The Suspended Stream Tribunal"

  **the stakes:**
  there's a $50 department snack budget for the next month. if the tribunal reaches a unanimous verdict *and* agrees on the **legal warrant** (the reason why) within 25 minutes, the class gets the snacks. if they deadlock or compromise on the warrant, you (the instructor) donate the money to a charity of your choice. this creates a slight, low-grade pressure to collapse the ambiguity, mirroring the practical necessity of assuming a self.

  **the cast (8 students, 4 pairs):**
  1.  **Continuity-Judges (2 ppl):** they hold the "Causal Lens." they only care if there is an unbroken chain of cause-and-effect (physical/biological/mental causality).
  2.  **Narrative-Archivists (2 ppl):** they hold the "Memory Lens." they care about psychological connectedness (memories, intentions, personality traits).
  3.  **Karmic-Auditors (2 ppl):** they hold the "Intent Lens." they care about *cetana* (volition). if the mind stopped, did the volition stop?
  4.  **Social-Pragmatists (2 ppl):** they hold the "Function Lens." they care about social stability. if we say they aren't liable, does society break?

  **materials:**
  *   **4 Envelopes** (one per pair) containing their "Lens Card" and "Private Evidence."
  *   **1 Central Case File** (projected or printed) describing the scenario.
  *   **Warrant Slips:** small slips of paper where they write the final decision rule.
  *   **Timer.**

  **the scenario (Central Case File):**
  > Subject "M" signs a contract to deliver a lecture for $5k. on the way, M enters a deep meditative absorption (*nirodha-samāpatti*). for 3 hours, all mental activity (citta) ceases. no subconscious processing. a complete pause.
  >
  > while M is paused, the lecture time passes. M misses the slot. the organizer loses money.
  >
  > M emerges from the pause. biologically, it's the same body. causally, the emergence was triggered by the pre-pause intention to meditate. but M has no memory of the "pause" time (obviously) and reports feeling "discontinuous," like a new spark lighting a lamp.
  >
  > **question:** is Post-Pause M liable for the breach of contract?

  **the private evidence (in the envelopes):**
  *   *Continuity-Judges:* get a slip saying "Neural pathways remained intact during pause. Causal chain of 'body' was unbroken."
  *   *Narrative-Archivists:* get a slip saying "M reports no psychological connection to the pre-pause signer. Feels like a 'different guy' woke up."
  *   *Karmic-Auditors:* get a slip saying "Pre-pause intention was to seek liberation, not to breach contract. But the decision to meditate was voluntary."
  *   *Social-Pragmatists:* get a slip saying "If M isn't liable, anyone can claim 'mental pause' to void debts. Contract law collapses."

  **the rules:**
  1.  **no compromise on the warrant:** you can't say "M pays half." you must decide: Liable or Not Liable.
  2.  **the warrant must be singular:** you must agree on *one* criterion for identity that justifies the verdict. (e.g., "Liable *because* Causal Continuity holds" OR "Not Liable *because* Narrative Continuity broke").
  3.  **veto power:** each pair has a "Veto Token." if a proposed warrant ignores their specific lens entirely, they can play the token. this forces the group to integrate the views or explicitly override one. (limit: 2 vetoes total for the whole group).
  4.  **time limit:** 25 mins.

  **what will predictably go wrong (first run):**
  *   **the "both/and" trap:** they will try to say "M is liable causally but not morally." you have to shut this down. the verdict requires *one* ontology of self.
  *   **the pragmatist bulldoze:** the Social-Pragmatists will usually win because "society breaks" is a scary argument. the others will fold to get the snacks. you need to watch for this and ask: "did you actually agree on identity, or did you just give up to get the cookies?"
  *   **confusing cessation with sleep:** students will treat the pause like deep sleep. you need to remind them: *nirodha-samāpatti* is defined as a cessation of *citta*, not just rest. this is the crux.

  ---

  ### the debrief (45 mins)

  this is where you do the actual teaching. the activity just made them sweat the problem; now you name it.

  **1. map the roles to the philosophy:**
  *   **Continuity-Judges = Theravada Abhidharma.** specifically the *citta-santati* (mind-stream). for them, identity is a causal series, like a flame lighting another flame. even if the "content" changes, the causal lineage holds. (note: some abhidharma scholars argue the stream *never* actually stops, even in nirodha, but let's park that for a second).
  *   **Narrative-Archivists = Locke / Modern Psychological View.** locke says personal identity = memory/consciousness. if the chain of consciousness is broken, it's a different person. this aligns with the meditator's phenomenological report.
  *   **Karmic-Auditors = Yogacara / Ethical Karma.** this is tricky. Yogacara posits the *ālaya-vijñāna* (storehouse consciousness) which continues even when active mind stops. if you accept *ālaya*, the stream didn't break. if you don't, karma is severed. this role highlights the tension between *ethics* (who pays?) and *metaphysics* (what exists?).
  *   **Social-Pragmatists = Derek Parfit / Hume.** parfit argues identity doesn't matter, only "Relation R" (psychological connectedness) matters for survival, but for *practical* purposes (law/debt), we need a convention. hume says the self is a fiction we need for social life.

  **2. settled vs. contested (be frank here):**
  *   **Settled:** basically all buddhist schools deny a permanent, unchanging *atman* (self). nobody in the room is defending a soul.
  *   **Contested:**
      *   *does the stream actually stop?* some theravada commentators say *nirodha* is a cessation of *activity*, but the potentiality (bhavanga) remains. others say it's a full stop. if it's a full stop, how does karma cross the gap?
      *   *is citta-santati substantial or nominal?* is the "stream" a real thing (like a river) or just a label we put on discrete moments (like beads on a string)? the activity forces them to treat it as real to assign debt, but anatta suggests it's nominal.
      *   *yogacara vs. madhyamaka:* yogacara might save continuity via the storehouse consciousness. madhyamaka would say the whole debate is empty—liability is dependently originated, not inherently existent.

  **3. the limitation (crucial):**
  you need to tell them: "this activity made you argue about identity, but it didn't make you *feel* anatta."
  *   the activity assumes a subject (the pair) making a decision.
  *   real *anatta* practice (vipassana) isn't an intellectual conclusion that "the self is a construct." it's a phenomenological shift where the *boundary* between observer and observed dissolves.
  *   you can't gamify the loss of the observer, because the game requires observers.
  *   **your job:** you have to supply the phenomenological piece in the lecture. describe what it feels like when the "grip" loosens. the game handles the *third-person* problem of identity; you need to lecture on the *first-person* experience of no-self.

  **4. closing thought:**
  ask them: "if you decided M was Not Liable, would you lend M money tomorrow?"
  this drives home that even if we win the philosophical argument, the *habit energy* (vasana) of assuming a self is too strong to live without. that habit is the real chain, not the contract.

  ---

  hope this works. honestly the snack stake usually gets them talking faster than grades do. just watch out for the pragmatists trying to rush the vote.

  oh, and make sure you clarify the definate nature of the pause beforehand, otherwise they'll spend 20 mins arguing about whether they were actually unconscious.
