answer: |-
  You have identified a precise and under-labeled mechanism. There is no single canonical term that captures the *intensive* escalation of assent while private beliefs remain static, but the phenomenon is a specific intersection of three established concepts: **Preference Falsification**, **Signaling Games**, and **Common Knowledge Generation**.

  If you require a label for the carving itself, the most accurate descriptive term in the literature is **Reputational Cascades on the Intensive Margin**, though in organizational sociology it is often discussed under **Upward Distortion** or **Rhetorical Outbidding**.

  Here is the carving you requested, distinguishing the mechanism from the concepts you rightly found insufficient, and addressing your specific distinctions.

  ### 1. The Core Carving: Preference Falsification on the Intensive Margin

  Timur Kuran's concept of **Preference Falsification** is the bedrock. In standard models (and the herding literature you dismissed), the focus is on the *extensive margin*: a binary choice to support or oppose. You are describing movement on the *intensive margin*: the *degree* of support.

  *   **Why Herding/Cascades fail:** In an informational cascade, I ignore my private signal because I infer yours is better. In your scenario, I see your signal, I know it is inflated, I retain my private signal, but I inflate mine *further* to match the social cost of the previous signal.
  *   **Why Group Polarization fails:** Polarization assumes the *private* mean shifts outward through deliberation. You observe the private mean is stable; only the public variance shifts.
  *   **Why Pluralistic Ignorance fails:** In pluralistic ignorance, I falsely believe I am the only one who feels this way. In your scenario, there is often a wink-and-nod recognition that everyone is posturing. It is not ignorance; it is **collusive falsification**.

  The specific mechanism is a **Signaling Ratchet**. Because the "currency" of the discussion is verbal commitment (cheap talk), the only way to signal "I am truly on board" (and not just complying minimally) is to spend more currency than the previous speaker. Since the currency has no intrinsic cost, the price of admission rises endogenously.

  ### 2. Defensive vs. Competitive Escalation

  You asked to distinguish the motive. The literature splits this into two distinct games, though they produce the same ratchet effect.

  *   **Defensive (The Spiral of Silence):** This aligns with Noelle-Neumann's work. The utility function is negative: *Minimize the risk of being identified as a dissenter.* The escalation is a shield. If Speaker A says "Good," and I say "Good," I might be heard as "Mediocre." To be heard as "Safe," I must say "Excellent." The ceiling here is set by the **threshold of suspicion**. I escalate only until I am no longer the outlier.
  *   **Competitive (Outbidding):** This aligns with political science literature on ethnic conflict or party primaries (Brass, Rabushka). The utility function is positive: *Maximize status within the coalition.* Here, the escalation is a spear. I say "Excellent" to signal I am more loyal than Speaker A. The ceiling here is set by **credibility limits**. If I claim "This candidate is the second coming of Einstein," I risk looking insane, which damages status.

  In your faculty search example, it is likely defensive. In the misconduct example, it is likely competitive (moral grandstanding). In the management review, it is a mix (defensive against the boss, competitive against peers).

  ### 3. Cheap vs. Costly Displays

  This is the critical variable that determines whether the ratchet breaks or holds.

  *   **Cheap Talk (Your scenarios):** Because the cost of producing the statement is near-zero, the inflation can continue until **semantic bleaching** occurs. Words lose their meaning ("Amazing" becomes the new "Good"). The ratchet stops only when the language runs out of superlatives or the risk of *ex post* exposure becomes too high.
  *   **Costly Signaling:** If the assent required a binding commitment of resources (e.g., "I will personally guarantee this candidate's tenure"), the ratchet would hit a **budget constraint** immediately. The fact that your examples involve *minutes, rankings, and statements* confirms this is a cheap-talk equilibrium.

  **The Distinction:** In cheap-talk ratchets, the gap between *speech* and *action* widens over time. In costly-signaling ratchets, the gap remains narrow because the cost prevents inflation. You can diagnose the phenomenon by measuring the **Speech-Action Decoupling**. If the group votes "Unanimous Enthusiasm" but allocates no additional resources to the project, it is a cheap-talk ratchet.

  ### 4. What Sets the Ceiling?

  If hyperbole inflates itself into worthlessness, why doesn't it go to infinity? Three constraints apply:

  1.  **The Falsifiability Constraint:** Eventually, a claim becomes specific enough to be proven false immediately. "This is a good proposal" is safe. "This proposal will definitely save the department $1M" is risky. The ratchet stops at the edge of **immediate verifiability**.
  2.  **The Audience Cost Constraint:** (Fearon, 1994). By escalating public commitment, you create a liability for future failure. The ceiling is the point where the *potential punishment for future failure* outweighs the *current benefit of appearing loyal*.
  3.  **Semantic Collapse:** When everyone says "This is the most critical issue of our generation," the phrase ceases to convey intensity. At this point, the ratchet stalls because further escalation yields no marginal signaling benefit. The group may then switch to a new vocabulary (a new "currency") to restart the ratchet.

  ### 5. Distinguishing from Genuine Conviction Cascades

  From the outside, how do you tell this apart from a group that actually convinced itself?

  *   **Look for Private Hedging:** In a genuine cascade, private communications (emails, side conversations) will align with public statements over time. In a falsification ratchet, private channels will remain skeptical or cynical while public channels escalate.
  *   **Look for Resource Allocation:** Genuine conviction converts to budget. Falsified assent converts to minutes. If the "fury" over misconduct does not result in increased funding for compliance or investigation, it was performative.
  *   **Look for the "First Mover" Anomaly:** In a genuine cascade, early speakers are often the most passionate (the innovators). In a ratchet, early speakers are often the most moderate, and the intensity is a function of *sequence*, not *conviction*. If the 8th speaker is consistently more intense than the 1st across multiple meetings, it is a structural ratchet, not a genuine shift.

  ### 6. The Archival Effect: Bug or Feature?

  You asked if the downstream effect (the record misleading future actors) is separate or the point.

  It is the **mechanism of institutionalization**. This is not a side effect; it is how the ratchet becomes structural.

  This is **Path Dependence via Falsified Common Knowledge**.
  1.  **Cycle 1:** The group falsifies intensity to survive the meeting.
  2.  **Archive:** The minutes record the falsified intensity as fact.
  3.  **Cycle 2:** A new cohort reads the minutes. To be taken seriously, they must match the *recorded* intensity of the previous cohort.
  4.  **Result:** The baseline for "sincere assent" has permanently ratcheted up, even if the turnover of personnel is 100%.

  The archive transforms a temporary social pressure into a permanent **normative constraint**. It forces future actors to continue the falsification not because of the original peers (who are gone), but because of the *institutional memory* those peers left behind. This is why the phenomenon is so stable: it writes its own justification into the official record.

  ### Summary Label

  If you need to name this in a paper or discussion, the most precise existing framing is **Reputational Cascades on the Intensive Margin**, but the specific dynamic of the archival record suggests a broader concept: **Performative Path Dependence**.

  The "carving" is this: It is a **coordination equilibrium** where the group colludes to inflate the **public price of assent** while holding the **private value of belief** constant, sustained by **audience costs** for de-escalation and cemented by **archival distortion** that binds future actors to the falsified baseline. It is distinct from herding because no information is lost; it is distinct from polarization because no minds are changed; it is distinct from lying because the "truth" is mutually understood but mutually suppressed. It is a **consensus simulation**.
