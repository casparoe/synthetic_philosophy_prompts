  ### (a) Unsatisfiable subsets
  Rows 2 (Boundary Stability), 3 (Cross-Cultural Invariance), and 6 (Temporal Grain) form an unsatisfiable triad. If you demand stable boundaries (2) and a principled grain based on formative events (6), you cannot maintain cross-cultural invariance (3), because formative events (wars, policies) do not respect global birth-year synchrony. You must drop Row 3. A theory of cohort kinds must accept that if cohorts are real, they are locally specific historical kinds, not global universal natural kinds; the "Millennial" label cannot apply uniformly to both Americans and Chinese if the constitutive events differ.

  ### (b) The load-bearing requirement
  Row 1 (Causal Identifiability) is the load-bearing requirement. It excludes the most candidate theories because the Age-Period-Cohort collinearity problem is mathematical, not empirical; without strong, often arbitrary constraints (like assuming period effects are zero), no statistical model can isolate a cohort effect. If a theory cannot specify the constraint that licenses this separation, it fails the primary purpose of licensing social scientists to use cohort variables as mechanisms rather than proxies.

  ### (c) What we were each assuming
  Your friend implicitly presupposed Row 1 (Causal Identifiability), assuming that because regression coefficients for cohort appear significant, the kind must be real, ignoring that those coefficients depend on untested constraints you cannot see. You implicitly presupposed Row 2 (Boundary Stability), assuming that because the birth-year cut-offs are arbitrary and shifting, the kind cannot be real, ignoring that many social kinds have vague boundaries. Neither demand was illegitimate, but you were arguing about ontology (your boundary test) while she was arguing about predictive utility (her data test); the conflict arises because predictive utility does not guarantee ontological stability.

  ### (d) Verdict
  Generations are not real kinds because they fail the non-negotiable requirement of causal identifiability separate from age and period effects.
