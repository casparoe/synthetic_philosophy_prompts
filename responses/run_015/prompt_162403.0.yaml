      *   2 (Stability) conflicts with 6 (Grain) if grain is event-driven.

      *Decision:* I will advise dropping Cross-Cultural Invariance (3) in favor of Local Specificity, which undermines the universal "Millennial" label. I will advise that Identifiability (1) is the load-bearing one.

