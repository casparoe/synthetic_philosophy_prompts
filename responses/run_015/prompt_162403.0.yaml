      *   *Drafting Row 2 (Boundaries):* Test: Boundary Robustness. Case: Shifting definitions. Rules out: Media constructs. Status: Costly to drop. Conflicts: Grain (Row 7).
      *   *Drafting Row 3 (Cross-Culture):* Test: Trans-National Validity. Case: Anglo labels abroad. Rules out: Universalist claims. Status: Camp Preference. Conflicts: Boundary (Row 2).
      *   *Drafting Row 4 (Retrospective):* Test: Experiential Completion. Case: Labeling kids. Rules out: Birth-year determinism. Status: Costly to drop. Conflicts: None really, maybe Grain.
      *   *Drafting Row 5 (Feedback):* Test: Non-Reflexive Origin. Case: Media feedback. Rules out: Pure performativity. Status: Non-negotiable (for "real" kind). Conflicts: APC (Row 1).
      *   *Drafting Row 6 (Grain):* Test: Principled Temporal Width. Case: 10 vs 30 years. Rules out: Arbitrary binning. Status: Costly to drop. Conflicts: Boundary (Row 2).

      *   *Re-evaluating Conflicts:*
