      *   *Conflict:* Row 2 (Boundaries) and Row 3 (Cross-Culture). If boundaries are robust, they should apply everywhere. If culture matters, boundaries shift. One must go.
      *   *Conflict:* Row 1 (APC) and Row 5 (Feedback). If the feedback is a Period effect (media coverage at time T), is it Cohort?

  6.  **Finalizing the Table Rows:**
      1.  **Causal Identifiability:** Can we separate it from Age/Period? (APC Case).
