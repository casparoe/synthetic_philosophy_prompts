      *   **Goal:** Provide a specification (list of requirements/tests) for a theory of cohort kinds, *not* a verdict (until the very end).
      *   **Purpose of Theory:** Must settle two decisions: (i) Social scientist causal modeling (mechanism vs. proxy); (ii) Ordinary conversation explanation (attitudes/behavior).
      *   **Input Cases:** The user provided specific cases to incorporate (shifting boundaries, APC identification problem, cross-cultural export, labeling before experience, feedback loops, lineage vs. cohort, grain size).
      *   **Output Format:**
          *   A table with specific columns: Number, Desideratum (one sentence), Motivating Case, What it Rules Out, Status, Conflicts With.
          *   Four short prose sections: (a) Unsatisfiable subsets, (b) The load-bearing requirement, (c) What we were each assuming, (d) Verdict (one sentence).
      *   **Constraint:** The user wants to know where requirements conflict and which to give up. This is the core intellectual task.

  2.  **Deconstruct the Cases & Derive Desiderata:**

      *   *Case 1: Shifting Boundaries (Millennial/Gen X overlap).*
          *   Issue: Vagueness/Arbitrariness. If kinds are real, boundaries shouldn't depend on polling org whims.
          *   Desideratum: Boundary Stability.
          *   Status: High importance for "real kind" status.

      *   *Case 2: APC Identification (Age-Period-Cohort).*
          *   Issue: Collinearity. Cohort = Period - Age. Mathematically impossible to separate without constraints.
          *   Desideratum: Identifiability. A real kind must have a distinct causal signature separable from aging and historical time.
          *   Status: Non-negotiable for causal modeling (Purpose i).

      *   *Case 3: Cross-Cultural Export (Anglophone labels elsewhere).*
          *   Issue: Universalism vs. Localism. Do "Millennials" exist in Japan or Iran with the same boundaries/traits?
          *   Desideratum: Cross-Context Invariance (or localized specificity).
          *   Status: Costly to drop if claiming universal kinds; preference if claiming local kinds.

      *   *Case 4: Labeling Before Experience (Children).*
          *   Issue: Premature categorization. How can a kind be defined by shared experience if members are categorized before the experience happens?
          *   Desideratum: Retrospective Constitution. The kind must be defined by completed formative events, not just birth dates.
          *   Status: Costly to drop.

      *   *Case 5: Feedback Loops (Self-fulfilling prophecy).*
          *   Issue: Reflexivity. The label causes the trait. Is it real or artifact?
          *   Desideratum: Causal Independence. The kind's properties must not be *solely* created by the labeling practice itself.
          *   Status: Non-negotiable for "natural" kind, costly for "social" kind.

      *   *Case 6: Lineage vs. Cohort.*
          *   Issue: Ambiguity of "Generation." Family vs. Historical.
          *   Desideratum: Conceptual Distinction. The theory must distinguish historical cohorts from familial generations.
          *   Status: Preference/Clarification.

      *   *Case 7: Grain Size (10 vs 3 vs 30 years).*
          *   Issue: Arbitrariness of scale. Why 15 years?
          *   Desideratum: Scale Justification. There must be a principled reason for the temporal width of the cohort.
          *   Status: Costly to drop.

