          *   *User's Reply:* The smooth exponential is the limit of step functions. If steps are bad, the limit should be too.
          *   *My Analysis:* This is the weakest link. In calculus/physics, limits often possess properties instances do not (e.g., continuity). A smooth discount function *is* coordinate-independent regarding *generation boundaries* because it doesn't use them. It uses *temporal distance from the evaluator*.
          *   *Diagnosis:* The user is conflating "arbitrary generation boundaries" with "temporal distance from the agent." P2 prohibits dependence on arbitrary *grids*, but standard discounting depends on $t - t_{now}$, not on a grid of generations. The argument attacks a straw man (discrete generation discounting) rather than the actual economic formulation (continuous time discounting).
