      *   *Premise 2 (P2):* Normative theory shouldn't depend on arbitrary representational features (coordinate independence).
      *   *Premise 3 (P3):* Step-function discounting depends on boundaries. Moving boundaries changes weights for the same people.
      *   *Premise 4 (P4):* Only a constant schedule is insensitive to boundary location.
      *   *Conclusion (C):* $\rho = 0$ is a condition of well-posedness, not a moral verdict. Positive $\rho$ is a demographic error.

