      *(Self-Correction during drafting)*: I should mention that the colleague's view is essentially a radical form of Platonism applied to computer science, which breaks down because computers are causal machines, not logic realms.

      *Let's structure the answer:*
      1.  Diagnosis: Type/Token confusion.
      2.  The "Running System" Fact: Physical instantiation & Causal Independence.
      3.  The Fork Scenario: Causal History.
      4.  Virtual Theft: Scarcity vs. Rights.
      5.  Conclusion.

