          *   Physical state of the server (electrons).
          *   Causal independence (deleting one doesn't affect the other).
      *   *Point 3: The Fork/Rollback Scenario.* Use this to strengthen the argument. The fork creates two distinct causal histories. Even if bits are same at T=0, they diverge at T=1. This proves numerical distinctness.
      *   *Point 4: Virtual Theft.*
          *   Rest on distinctness? Yes, you need distinct tokens to have scarcity.
          *   Rest on something else? Yes, it rests on **access rights** and **rules of the institution** (the game EULA/social contract). Theft is a normative violation, not just an ontological one.
      *   *Conclusion:* Summarize. The colleague is treating a database record like a mathematical theorem.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is a bit pattern abstract?* A specific sequence of 1s and 0s *as a mathematical sequence* is abstract. But a bit pattern *stored on a hard drive* is a physical configuration. The colleague is confusing the map (the pattern) with the territory (the magnetic state). I need to make sure this distinction is sharp.
      *   *The "Running System" aspect:* Emphasize *causal power*. Abstract objects don't cause things. Virtual swords do (they deal damage, they can be traded). Therefore, they aren't purely abstract.
