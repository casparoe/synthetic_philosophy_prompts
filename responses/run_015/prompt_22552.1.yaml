answer: |-
  You have hit on one of the most famous and difficult puzzles in the philosophy of probability. Your intuition that the Principal Principle (PP) looks trivial or circular is shared by many professional philosophers (including David Lewis himself, later in his career).

  However, the Principle is not trivial. To see why, we need to distinguish between **evidence about the world** and **normative constraints on rationality**, and we need to understand exactly what work "admissibility" is doing.

  Here is the breakdown of why the Principal Principle is not just "follow your evidence," why admissibility is crucial, and why Lewis cared so much about it.

  ### 1. The Principal Principle is a "Bridge," not a Rule of Inference
  Your confusion stems from thinking of the PP as a rule of inference (like "if $P$ implies $Q$, and I know $P$, I should believe $Q$"). If it were just that, you would be right: if my total evidence includes "The chance is 50%," then obviously my belief should reflect that.

  But the PP is a **bridge principle** between two different realms:
  1.  **Ontic (Metaphysical):** Objective Chance ($X$). This is a feature of the world, independent of minds (e.g., the physical propensity of a coin).
  2.  **Epistemic (Psychological):** Credence ($C$). This is a feature of your mind (your degree of belief).

  **The Extra Constraint:**
  Without the PP, it is logically possible to be a rational agent who acknowledges objective chances but refuses to let them guide their beliefs.
  *   *Example:* Imagine a philosopher who says, "I admit the objective chance of heads is 50%. However, I have a metaphysical theory that objective chances are causally inert and should not influence belief. I will believe heads is 90% based on other factors."
  *   *Without PP:* This agent is arguably consistent with their own total evidence (which includes their theory about chances).
  *   *With PP:* This agent is **irrational**.

  The PP adds the constraint that **knowledge of chance *itself* compels belief.** It says you cannot have a "theory" that decouples chance from credence. It makes chance *normative*. It transforms chance from a mere description of patterns into a guide for action.

  ### 2. Why "Admissible" Evidence? (The Time Travel Problem)
  You asked: *"Why does Lewis care about 'admissible' evidence if total evidence is already supposed to do the work?"*

  This is the crux of the issue. If we just said "Condition on Total Evidence," the Principal Principle would be **false**.

  Imagine you have a time machine.
  *   **Proposition $A$:** The coin lands Heads.
  *   **Proposition $X$:** The objective chance of Heads at time $t$ is 50%.
  *   **Proposition $E$:** You traveled to the future and saw the coin land Heads.

  Your **Total Evidence** is $X \& E$.
  If you follow "Total Evidence," your credence in $A$ should be **100%** (because you saw it happen).
  But the Principal Principle says: $C(A | X \& E) = 50\%$.

  If we don't exclude $E$ (the future sight), the Principal Principle contradicts rationality. You *should* believe it's 100% heads if you saw it land heads, even if the chance was 50%.

  **Admissibility is a filter.** It filters out evidence that "overwrites" the chance.
  *   **Admissible Evidence:** Information about the past, the laws of nature, or the setup of the experiment. This evidence influences your belief *through* the chance.
  *   **Inadmissible Evidence:** Information about the specific outcome (like time travel, crystal balls, or divine revelation). This evidence influences your belief *directly*, bypassing the chance.

  Lewis needs "admissibility" to protect the authority of Chance. He wants to say: "If all you know is the Chance and the Past, your belief *must* match the Chance." If you allow inadmissible evidence into the equation, Chance loses its authority, and the principle becomes useless.

  ### 3. The "Triviality" Worry (Why Lewis was eventually worried)
  Your intuition that this looks circular is actually so strong that it led to the downfall of the original Principal Principle.

  In the 1990s, philosophers (like Ned Hall and Michael Thau) showed Lewis that if you combine the Principal Principle with Lewis's own metaphysics (**Humean Supervenience**), the principle becomes trivial or contradictory. This is known as **"The Bug."**

  *   **Lewis's Metaphysics:** Chances are just summaries of the total pattern of events in the universe (past, present, and future).
  *   **The Problem:** If the chance depends on the future pattern of events, then knowing the **Chance** gives you secret information about the **Future**.
  *   **The Contradiction:** If knowing the Chance gives you info about the Future, then the Chance proposition ($X$) contains **inadmissible evidence** hidden inside it!

  If $X$ contains inadmissible evidence, you can't condition on it without violating the admissibility clause. Lewis realized this meant his original formulation was flawed. He eventually accepted a revised version (often called the **New Principle**), which complicates the math but preserves the intuition.

  ### 4. Summary: What work is the PP doing?
  To answer your specific questions directly:

  **Q: Isn't that just saying I should be consistent with my own evidence?**
  **A:** No. Consistency with evidence allows you to ignore chance if you have a theory that says "chance doesn't matter." The PP forbids that theory. It mandates that chance *must* matter, specifically and uniquely.

  **Q: What extra constraint is the principle supposed to add?**
  **A:** It constrains your **prior disposition to respond to information**. It says: "However you update your beliefs, your updating rule must be such that if you learn the objective chance is $x$, your credence becomes $x$ (absent inadmissible info)." It restricts the set of rational prior probability functions.

  **Q: Why does Lewis care about "admissible" evidence?**
  **A:** Because without that distinction, the principle is false. If "total evidence" includes knowing the outcome (via time travel), your credence should be 1 or 0, not equal to the chance. Admissibility isolates the specific epistemic authority of *Chance* from the epistemic authority of *Direct Knowledge*.

  ### The Bottom Line
  You are stuck because the Principal Principle tries to do something very difficult: it tries to make **Objective Chance** relevant to **Subjective Belief** without collapsing one into the other.

  *   If you ignore PP, Chance is metaphysically real but epistemically useless (why care about it?).
  *   If you ignore Admissibility, PP is false (because future knowledge overrides chance).
  *   If you accept both (as you suspected), you run into "The Bug," where the definition of Chance threatens to smuggle in inadmissible evidence.

  Lewis cared about it because he wanted to save the concept of "Objective Chance" from being eliminated by subjectivists (who say only belief exists) or determinists (who say chance is just ignorance). The PP was his flag in the ground: **Chance is real, and if you are rational, you must bow to it.**
