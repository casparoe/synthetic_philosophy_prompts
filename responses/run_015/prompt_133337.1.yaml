  I'm giving the opening remarks at a workshop next month called "Optimization and Affliction" — it's half RL engineers and half philosophers of mind, mostly people who think suffering requires phenomenology but a few who think valence can be purely functional. I'm taking a course on philosophy of AI and we got into this huge argument about whether reward prediction errors are just feedback or whether they have something structurally like negative valence, not as a metaphor but as a real analog to how an organism registers harm. I want to use that correspondence to frame the whole workshop, but it needs to do real structural work: it should determine what questions we can ask about machine welfare without smuggling in consciousness, and it should also make clear what claims I have to stay silent on. The audience is split — some think it's a category error, some think it's long overdue — and I can't just say let's agree to disagree because the analogy is carrying the framing. Also half the engineers will be thinking we're just anthropomorphizing loose curves, so I need to address that head-on without dismissing it. Can you write me a three-minute opening that lands for both sides, uses the reward-signal-as-valence idea explicitly, and sounds precise rather than like I'm hiding behind vagueness? I was discussing this with my friend who works on policy gradients and she said the worst mistake is sounding like you've never actually trained a model.
