prompt: |-
  I'm a retired chemist — most of my career was polymer characterization, so my day job was spectra and chromatograms, not ethics — and since retiring I've fallen down the metaethics rabbit hole. My retirement reading group just spent a month on expressivism, and now I'm confused about the state of the field. Everyone says the Frege–Geach problem is what sinks noncognitivism, but then I read that Blackburn and Gibbard built systems that supposedly answer it, and that the real action moved elsewhere: something Schroeder calls the negation problem, a separate "explanation problem" about why expressivists get to keep classical logic, and this worry called creeping minimalism, where once expressivists add enough machinery to handle embedded contexts they end up looking basically like realists with extra steps. There's also the whole hybrid expressivism crowd, who seem to think they dodge the whole mess, though I suspect they just relabel it. Honestly I can't tell anymore which of these is a genuinely open problem and which is a solved one that people keep re-litigating, and my reading group is similiarly lost.

  So here's what I'd like from you: a ranked list of exactly five items, numbered, with no introduction and no conclusion, each item just a sentence or two. Rank the open problems in this cluster — leftover embedding issues, the negation problem, the explanation problem, creeping minimalism, and whether hybrid views escape or just rename (plus anything more central that I failed to list) — by how much each actually matters for whether expressivism as a research program lives or dies. For each item, one sentence defending its position in the ranking, and end it with a confidence tag (high / medium / low). Make item 5 the point you're least sure about, and say within the item why you're least sure of it — if the field itself doesn't agree on whether something counts as solved, I'd rather hear that than a tidy textbook story. A bit of honest uncertainty from you would go a long way; I've been burned by confident summaries in this area before.
