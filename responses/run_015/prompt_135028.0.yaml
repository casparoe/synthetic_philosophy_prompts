answer: |-
  The slogan is technically correct but argumentatively inert unless it serves as a placeholder for a specific critique of statistical power or auxiliary assumptions.

  Here is a menu of precise interpretations your peer might be invoking, evaluated for truth and argumentative utility in a replication context.

  **1. The Deductive Certainty Claim**
  *   **The Claim:** "A null result does not logically entail that the effect size is exactly zero."
  *   **Truth Status:** **True.** You cannot deductively prove a universal negative from finite observations without strong auxiliary assumptions.
  *   **Argumentative Work:** **None.** This sets the bar for "evidence" at deductive proof, which is not how empirical science functions. A replication study aims to shift credences, not achieve logical certainty. Using this to dismiss a null result is a category error between logic and confirmation theory.

  **2. The Bayesian Non-Zero Claim**
  *   **The Claim:** "Observing a null result does not reduce the posterior probability of the hypothesis to zero."
  *   **Truth Status:** **True.** Rational agents should rarely assign probability 0 or 1 to empirical hypotheses.
  *   **Argumentative Work:** **None.** This is a strawman; no competent researcher claims a single null result makes the original hypothesis impossible. The relevant question is whether the null result *lowers* the probability (i.e., constitutes evidence against), not whether it eliminates the hypothesis entirely.

  **3. The Uninformative Test Claim (Low Power)**
  *   **The Claim:** "The likelihood ratio is approximately 1 because the study lacked the sensitivity (power) to detect the effect if it existed."
  *   **Truth Status:** **Contingent.** True only if the sample size, measurement precision, or design was insufficient relative to the predicted effect size.
  *   **Argumentative Work:** **High.** **This is the only interpretation that licenses dismissing the null result.** If the replication was underpowered, the absence of evidence *is* uninformative. However, this requires demonstrating low power, not just chanting the slogan. If the replication was high-powered, this claim is false.

  **4. The Auxiliary Assumption Claim (Duhem-Quine)**
  *   **The Claim:** "The failure derives from broken auxiliary assumptions (context, measurement, population) rather than the core theoretical mechanism."
  *   **Truth Status:** **Contingent.** True only if there are identifiable boundary conditions or methodological discrepancies between the original and replication.
  *   **Argumentative Work:** **High.** **This licenses dismissing the null result as a test of the core theory.** However, this shifts the burden to identifying *which* auxiliary assumption failed. Without specifying the mismatch, this is merely special pleading.

  **5. The Prior Dominance Claim**
  *   **The Claim:** "Our prior confidence in the hypothesis is so strong that even a null result does not significantly lower our posterior belief."
  *   **Truth Status:** **Subjectively True.** Mathematically possible if the prior is extremely strong relative to the likelihood ratio of the data.
  *   **Argumentative Work:** **Low/Risky.** While formally valid, invoking this in a replication crisis seminar admits that the agent is insulated from empirical update. It concedes the null is evidence but claims it is insufficient to overcome prior bias, which undermines the purpose of running replications.

  **Recommendation for Seminar:**
  Push your peer to select **Item 3** or **Item 4**. Ask: "Are you arguing the study was underpowered (3), or that the experimental conditions differed materially (4)?" If they cannot specify which auxiliary assumption broke or demonstrate low power, they are relying on **Item 1** or **2**, which are trivial truths that do not protect the hypothesis from probabilistic disconfirmation.
