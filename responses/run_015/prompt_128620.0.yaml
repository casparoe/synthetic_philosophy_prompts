          4.  Concrete philosophical cases/arguments for each crux with camp-specific predictions.
      *   **Constraints:** No bibliographies/citations/reading lists. Formal register suitable for a philosophical dataset.

  2.  **Deconstruct Camp Positions:**
      *   *Camp One (Strong Idealist/Phenomenalist Interpretation):* Berkeley's argument is ontological. To conceive of X is to have X before the mind. If X is defined as "unperceivable," the act of conceiving it makes it perceivable (by the mind conceiving it). Therefore, *any* matter defined as outside phenomenal access is contradictory.
      *   *Camp Two (Epistemic/Representationalist Interpretation):* Berkeley's argument is epistemic/targeted. It attacks the *veil of perception*. If matter is the *cause* of ideas but never like ideas (Locke), we can't conceive it. But if matter is just the external relatum in a direct perception (Direct Realism) or a structural relation, we *can* conceive it without making it an idea. The argument fails against non-representational realism.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish common ground on the text and logic, even if interpretations differ.
      *   *Premises:* Link between *esse* (existence) and *percipi* (being perceived) via *concipi* (being conceived).
      *   *Qualities:* Both agree Berkeley attacks the abstraction of primary from secondary qualities.
      *   *Scope:* Both agree it rules out *something*. Camp One says "matter simpliciter"; Camp Two says "Lockean substratum." The agreement must be neutral: "It rules out conceptions of objecthood that entail logical impossibility of perception."
      *   *Concession:* What would change their minds? Camp One needs a coherent conception of unperceived matter. Camp Two needs proof that *all* realism entails representational mediation.
      *   *Verbal vs. Substantive:* Distinguish "independence" (causal vs. ontological).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Camp One Column:* Focus on "Phenomenal Accessibility." If you can't perceive it, you can't conceive it. Objecthood requires presence to mind.
      *   *Camp Two Column:* Focus on "Representational Inaccessibility." The target is the *gap* between idea and object. If no gap (Direct Realism), the argument doesn't stick.
      *   *Constraint:* Use wording each camp accepts (no neutralizing language that distorts their view).

  5.  **Drafting Section 3: Cruxes:**
      *   *Crux 1:* Uniformity of the Conception Principle. Does "to conceive" always mean "to have an idea"? Or can one conceive of a non-ideal relatum?
      *   *Crux 2:* Relational Ontology. Can a relational view of matter (e.g., structural realism) survive the "try to conceive of a tree in a park" test without becoming idealist?

  6.  **Drafting Section 4: Concrete Cases:**
