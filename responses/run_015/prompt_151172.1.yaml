prompt: |-
  Hi — I cover science and ideas for a magazine (mostly long features, but I also do the final copy pass on freelance pieces a few times a week), and I keep having the same argument with our fact-checker. She wants every sentence hedged into mush; I think roughly half our sentences say "shows" where the study really just got one specific prediction to come out right, and another half say "is consistent with" where the result actually did knock out a live alternative. My friend, who's a physicist, says all hedging is cowardice and that we should print "shows" whenever the authors do, which I'm pretty sure is wrong. What I want isn't a lecture on the philosophy of science — it's something I can paste into our house style guide and actually run.

  Here's the shape I have in mind, and tell me if it's the wrong shape: a ladder of evidential verbs we're allowed to use in copy (something like "shows," "strongly supports," "supports," "is consistent with," "does not rule out," "cannot distinguish between"), plus a short ordered set of tests for picking the highest rung a sentence is allowed to sit on. The tests should be the ones that decide whether the evidence is actually doing any discriminating work: what exactly the account predicted ahead of time, versus a story fitted to the data afterward; whether that prediction was the kind that could easily have come out the other way; whether getting the result required background assumptions the data itself can't check (how the instrument behaves, the measurement model, the statistical model, assumptions about the sample) — I gather there's a name in philosophy for that problem but I can never remember it, so don't bother naming it, just build the step; and, the one I care most about, whether some rival account fits the published numbers about as well. On that last one I've started sorting rivals into what I call "live" ones (a competent person in the field would actually defend it) and "zombie" ones (logically compatible with the data, but nobody would seriously hold it) — because I don't want to hedge every sentence just because some skeptical scenario is logically possible, and I also don't want to write "shows" when the field genuinely has two accounts that fit the same data. Tell me if that split is doing the wrong work, or if I need a third bucket: I keep hitting cases where the rivals are distinguishable in principle but only by an experiment nobody will fund, and cases where the thing being "tested" is a whole framework rather than a claim, so any single study can only ever be consistent or inconsistent with it.

  Constraints: it has to run in about ten minutes at copy-desk stage, by someone with no philosophy training who then has to sign off on the sentence, mostly from the paper itself since the freelancer is often unreachable; and I want it honest about which steps are judgment calls wearing a lab coat. Please say explicitly where the procedure just stops with a no (you may not use a stronger verb, full stop) and where it hands the decision to a human because the trade-off is about values — how much we'd rather over-hedge than over-claim, and so on. Then run it on three cases: (1) a preprint, 120 people recruited online, scores on a psychological scale correlated with how often they shared a false headline, written up by the authors as confirming a motivated-reasoning account over a "people just can't tell what's true" account; (2) a large randomized trial that found no difference between two diets on some biomarker, with a press release saying the trial "refutes" the theory the diets were based on; and (3) a piece I wrote myself last spring (details invented, the structure is what matters) in which I said that a new set of genetic results "confirmed" the leading account of how a population recolonized a region after a bottleneck, and a colleague later pointed out that a second account fits the same data about as well. I'd especially like to know whether the procedure tells me to downgrade that last one, because if it does I have to go tell my editor and eat a correction, and I'd rather not. Last thing: say plainly what the procedure can't do — I don't want anyone on staff walking away thinking that a sentence passing these tests means the study was any good.
reasoning: |-
  Here's a thinking process that leads to the suggested style guide section:

  1.  **Analyze the Request:**
      *   **User:** Science magazine editor/writer.
      *   **Problem:** Constant friction with a fact-checker over hedging. Fact-checker wants maximum hedging ("mush"); User thinks some claims are strong enough for stronger verbs ("shows"). Friend (physicist) says no hedging ever (User knows this is wrong).
      *   **Goal:** A practical, actionable section for a house style guide. Not a philosophy lecture. Needs to be usable by a copy editor in ~10 minutes without contacting the author.
      *   **Proposed Structure:** A "ladder" of evidential verbs + a set of tests to determine the highest rung allowed.
      *   **Specific Tests Mentioned:** Prediction vs. post-hoc fitting, riskiness of prediction (could have gone other way), background assumptions (instrument/model validity), rival accounts (Live vs. Zombie).
      *   **Specific Questions:** Is the Live/Zombie split enough? Do I need a third bucket for "distinguishable in principle but not practice" or "framework vs. claim"? Where does the procedure say "No" vs. "Human Judgment"?
      *   **Constraints:** Must run in 10 mins at copy desk. Must admit where it's a judgment call/values trade-off. Must explicitly state limitations (passing tests $\neq$ study quality).
      *   **Task:** Validate the shape, refine the tests/buckets, write the guide section, and apply it to three specific cases (Psych preprint, Diet RCT, User's past Genetics piece).

  2.  **Deconstruct the "Shape" & Philosophy:**
      *   *The Ladder:* Good idea. Provides concrete options.
      *   *The Tests:* The user lists: Pre-registration/Prediction, Riskiness, Assumptions (Duhem-Quine problem, though they asked not to name it), Rivals.
      *   *The Rivals:* Live vs. Zombie. The user asks about a third bucket for "distinguishable in principle but not practice" (let's call this "Dormant") or "Framework vs. Claim" (let's call this "Paradigmatic").
      *   *Decision Points:* Need to distinguish between hard stops (logic prohibits the verb) and soft stops (editorial risk tolerance).
      *   *Limitations:* Crucial. A well-hedged sentence about bad science is still about bad science.

  3.  **Drafting the Guide Section (Iterative Process):**
      *   *Tone:* Professional, directive, pragmatic.
      *   *The Ladder:* Needs to be ordered from strongest to weakest.
          *   Shows/Demonstrates/Confirms (Strong)
          *   Supports/Indicates (Medium)
          *   Is Consistent With/Aligns With (Weak)
          *   Does Not Rule Out/Cannot Distinguish (Neutral/Negative)
      *   *The Tests (The "Gatekeepers"):*
          1.  *Prediction:* Was it pre-specified? (Pre-reg or clear theory).
          2.  *Risk:* Could it have failed? (Falsifiability).
          3.  *Assumptions:* Are the links between data and claim solid? (Instrument validity, stats).
          4.  *Rivals:* The Live/Zombie/Dormant distinction.
      *   *Refining the Rivals:* The user's "Live vs. Zombie" is good, but the "Dormant" (distinguishable in principle, not practice) is a real issue. If a rival exists but requires a billion-dollar collider to test, is it Live? For a magazine article, probably treat it as Zombie *for now*, but hedge slightly. Actually, better to treat "Framework" claims differently. You can't "confirm" a whole paradigm with one study.
      *   *Decision Logic:* If *any* test fails, drop a rung. If multiple fail, drop to bottom.
      *   *Hard Stops:* You cannot use "Shows" if a Live rival fits the data equally well. You cannot use "Shows" if the prediction was post-hoc.
      *   *Soft Stops:* Risk tolerance.

  4.  **Addressing the Specific Cases:**
      *   *Case 1 (Psych Preprint):* Small N (120), online recruitment (noisy), correlation (causation trap), authors claim Motivated Reasoning vs. "Can't tell truth".
          *   *Analysis:* Correlation $\neq$ Causation. Rival: Maybe people who share fake news just have lower cognitive ability, not motivated reasoning. Preprint (not peer reviewed).
          *   *Verdict:* "Shows" is definitely out. "Supports" is risky. "Consistent with" is safe.
      *   *Case 2 (Diet RCT):* Large trial, null result on biomarker. Press release says "Refutes theory".
          *   *Analysis:* Null results are tricky. Did the diet change the biomarker *at all*? Or was the biomarker wrong? Or was the compliance bad? "Refutes" is too strong for a null result on one biomarker. Theory might still hold via other mechanisms.
          *   *Verdict:* "Fails to support" or "Does not support". "Refutes" is a hard no.
      *   *Case 3 (User's Genetics Piece):* "Confirmed" leading account. Colleague says second account fits data equally well.
          *   *Analysis:* If two accounts fit the data *equally well*, the data does not *confirm* one over the other. It is *consistent* with both.
          *   *Verdict:* Downgrade required. "Confirmed" implies discrimination. If rivals fit equally, no discrimination occurred. This is the hard pill to swallow.

  5.  **Refining the "Third Bucket" for Rivals:**
      *   User asked about "distinguishable in principle but not practice" and "framework vs. claim".
      *   *Solution:* Add a category called **"Structural Equivalents"**. These are models that produce identical predictions for *any* feasible experiment (or currently feasible). If a rival is a Structural Equivalent, you cannot claim one is "shown" over the other.
      *   *Framework:* If testing a "framework" (e.g., Evolution, Climate Change), single studies are always "consistent with." You don't "confirm" Evolution with one fossil. You "confirm" a specific phylogenetic branch.
      *   *Advice:* Keep it simple for the style guide. Stick to Live vs. Zombie, but add a note about "Underdetermination" (without naming it). If the data fits two stories equally, you can't pick one.

  6.  **Addressing the "Values/Trade-off" Constraint:**
      *   The guide must admit that choosing between "Supports" and "Consistent with" when the water is murky is an editorial choice, not a scientific fact.
      *   Define the magazine's default posture (e.g., "We prefer false caution over false certainty").

  7.  **Addressing the "Limitations" Constraint:**
      *   Explicit disclaimer: Passing these tests checks *language*, not *validity*. A precise lie is still a lie.

  8.  **Final Review against Constraints:**
      *   10-minute copy desk check? Yes, needs to be a checklist.
      *   No philosophy lecture? Yes, keep terms operational.
      *   Address the three cases? Yes.
      *   Address the "Downgrade" fear? Yes, be honest about Case 3.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the tension.
      *   *The Ladder:* Define verbs.
      *   *The Checklist:* 4 questions.
      *   *The Rivals:* Define Live vs. Zombie. Address the "Third Bucket" (call it "Empirically Equivalent").
      *   *The Cases:* Run them through.
      *   *The Disclaimer:* Validity vs. Wording.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the "Third Bucket." The user asked if they need it. The answer is: You need to recognize *Empirical Equivalence*. If two models fit the data equally well, you can't say one is confirmed. That covers both the "unfundable experiment" and the "framework" issue. If the experiment to distinguish them isn't done, they are currently equivalent. Treat them as Live Rivals.

      *(Refining Case 3)*: The user hopes they don't have to issue a correction. I must be honest. If a colleague showed a rival fits *as well*, "Confirmed" is factually incorrect regarding the logical relationship between data and claim. It needs a correction or a nuance addendum. I shouldn't sugarcoat this.

      *(Refining the "Values" part)*: The guide needs a "Default Setting." If the checklist is ambiguous, what do we do? Default to the weaker verb.

  10. **Final Polish:** Ensure the tone matches a senior editor talking to a peer. Direct, respectful, pragmatic. (Proceed to generate output).

      *Wait, one more check on the "Third Bucket":* The user mentioned "framework rather than a claim." If I test a specific prediction of a framework, I can "support" the framework. I cannot "confirm" the framework. I need to make sure the verb ladder distinguishes between *specific mechanism* and *broad framework*.
      *Adjustment:* Add a note in the "Assumptions" or "Rivals" section about Scope.

      *Let's finalize the "Rivals" bucket:*
      1.  **Live:** Competent scholars defend it *and* it fits the data.
      2.  **Zombie:** Logically possible but no one defends it / fits data poorly.
      3.  **Equivalent:** Fits data equally well, distinguishable only by future/unfeasible tech. *Treat as Live for current claims.*

      *Okay, ready to write.*
answer: |-
  This is the right shape. You are trying to solve an editorial problem (precision of language) with an editorial tool (a style guide), not a scientific one (re-running the stats). Your instinct to avoid the "philosophy lecture" is correct; copy editors need switches, not seminars.

  However, your "Live vs. Zombie" split needs one refinement to handle the cases you're worried about (unfundable experiments and broad frameworks). You need a third category: **"Empirical Equivalents."** These are rivals that fit the current data as well as the preferred account but require technology or samples we don't have to distinguish. For the purpose of *this* sentence, treat Equivalents as Live. You cannot claim a win if the score is tied, even if you hope to break the tie next season.

  Below is a draft module for your house style guide. It is designed to be printed and kept at the copy desk. Following that, I have run your three cases through it.

  ***

  # HOUSE STYLE: EVIDENTIAL VERBS & HEDGING

  **Purpose:** To ensure our claims about scientific findings match the actual discriminating power of the data. We prefer false caution over false certainty.
  **Time Budget:** 10 minutes per claim.
  **Scope:** This checks the *link between the data and the sentence*, not the quality of the study itself. A sentence can pass this check and still describe bad science.

  ## 1. THE LADDER
  Select the strongest verb allowed by the **Checklist (Section 2)**. If a checklist item fails, drop down one rung. If multiple items fail, drop to the bottom.

  1.  **Shows / Demonstrates / Confirms:** The data discriminates decisively between the claim and all *Live* rivals. (Rare in single studies).
  2.  **Strongly Supports:** The prediction was risky and pre-specified; rivals fit the data poorly.
  3.  **Supports / Indicates:** The data aligns with the claim better than chance, but assumptions or rival explanations exist.
  4.  **Is Consistent With / Aligns With:** The data does not contradict the claim, but does not rule out *Live* rivals. (Default for observational/correlational data).
  5.  **Does Not Rule Out / Cannot Distinguish:** The study was designed to test the claim but failed to find a difference, or the design cannot separate the claim from a rival.

  *Forbidden:* "Proves" (never use in empirical science). "Refutes" (only use if the result is logically incompatible with the theory, not just a null result).

  ## 2. THE CHECKLIST (The Four Gates)
  *Read the paper's Abstract, Methods, and Discussion. Do not rely on the Press Release.*

  **Gate 1: Prediction vs. Story**
  *   **Pass:** The specific prediction was registered before data collection, or follows inevitably from a long-standing theory.
  *   **Fail:** The hypothesis was constructed *after* looking at the data (HARKing), or the authors are offering a "possible explanation" for a surprise finding.
  *   *Penalty:* If Fail, max verb is **"Is Consistent With."**

  **Gate 2: Risk**
  *   **Pass:** The prediction could easily have come out the other way (falsifiable).
  *   **Fail:** The result was guaranteed by the setup, or the measure is so noisy/subjective that any outcome could be spun as a success.
  *   *Penalty:* If Fail, max verb is **"Is Consistent With."**

  **Gate 3: The Chain of Assumptions**
  *   **Pass:** The link between the raw measurement and the concept is direct (e.g., a thermometer for heat).
  *   **Fail:** The link requires a complex model, unverified instrument behavior, or heavy statistical imputation (e.g., fMRI blobs for "thought," surveys for "intelligence").
  *   *Penalty:* If Fail, drop one rung from your current selection.

  **Gate 4: Rivals (The Discrimination Test)**
  *   **Pass:** No *Live* rival account fits the published numbers as well as the authors' account.
  *   **Fail:** A *Live* rival (defended by competent scholars in the field) fits the data equally well.
  *   **Fail (Equivalent):** A rival fits the data equally well, and distinguishing them requires experiments not performed in this study (even if feasible in principle).
  *   *Penalty:* If Fail or Equivalent, you **MAY NOT** use "Shows," "Confirms," or "Refutes." Max verb is **"Supports"** (if the rival is slightly worse) or **"Is Consistent With"** (if the rival fits equally).

  ### Defining Rivals
  *   **Live:** A competent researcher in this specific sub-field would defend this alternative today.
  *   **Zombie:** Logically possible, but no one in the field actually holds this view (e.g., "The instrument was haunted"). Ignore these.
  *   **Empirical Equivalent:** Fits the data as well as the main claim, but requires new tech/methods to distinguish. **Treat as Live.**
  *   **Framework:** If the claim is about a broad framework (e.g., "Evolution," "Climate Change"), single studies cannot "Confirm" the framework. They can only "Support" a specific mechanism within it.

  ## 3. DECISION POINTS (Values & Judgment)
  This procedure cannot remove human judgment. It only structures it.

  *   **The "Murky Water" Rule:** If Gate 3 (Assumptions) or Gate 4 (Rivals) is ambiguous after 10 minutes of reading, **default to the weaker verb.** We would rather be accused of boring caution than misleading certainty.
  *   **The "Correction" Threshold:** If a sentence uses "Shows/Confirms" and a post-publication critique demonstrates a *Live* rival fits the data equally well, the sentence **must** be downgraded. This is not a matter of taste; it is a matter of logical accuracy.
  *   **The "Null Result" Trap:** A null result (no difference found) rarely "Refutes" a theory. It usually means the specific mechanism tested didn't trigger, or the sample was too small. Default to **"Fails to Support"** rather than "Refutes."

  ## 4. LIMITATIONS
  **Passing this checklist does not mean the study is good.** It only means the *sentence* accurately reflects the *study's own claims about its data.* We can accurately report a finding that is later retracted. This guide protects the magazine from overstating the evidence, not from publishing weak evidence.

  ***

  # APPLICATION TO YOUR CASES

  Here is how the Copy Desk should run these three scenarios using the guide above.

  ### Case 1: The Psych Preprint (Motivated Reasoning)
  *   **Data:** N=120, online, correlation between scale scores and sharing false headlines.
  *   **Claim:** Confirms motivated reasoning over "can't tell truth."
  *   **Checklist:**
      *   *Gate 1 (Prediction):* Preprint status suggests not fully vetted, but assume pre-registered for argument. **Pass/Neutral.**
      *   *Gate 2 (Risk):* Correlational data. Could easily be reversed or confounded. **Fail.** (Max verb: Consistent With).
      *   *Gate 3 (Assumptions):* Self-reported scales + sharing behavior. High noise. **Fail.** (Drop one rung).
      *   *Gate 4 (Rivals):* "People just can't tell what's true" is a Live rival. Correlation does not distinguish between *won't* (motivated) and *can't* (ability). Both fit a correlation. **Fail (Equivalent).**
  *   **Verdict:** **Downgrade to "Is Consistent With."**
  *   **Why:** You cannot claim discrimination (Shows/Confirms) when the design (correlation) cannot logically separate the two mechanisms. The Copy Desk must change "Confirms" to "Is Consistent With."

  ### Case 2: The Diet RCT (Null Result)
  *   **Data:** Large trial, no difference on biomarker.
  *   **Claim:** Press release says "Refutes" theory.
  *   **Checklist:**
      *   *Gate 1 (Prediction):* RCTs are usually pre-specified. **Pass.**
      *   *Gate 2 (Risk):* High. Could have found a difference. **Pass.**
      *   *Gate 3 (Assumptions):* Biomarker validity. Is this biomarker a perfect proxy for the health outcome the theory cares about? Often, no. **Caution.**
      *   *Gate 4 (Rivals):* A null result on *one* biomarker does not rule out the theory (theory might operate via other pathways). The rival "Theory is right, biomarker is wrong" is a **Live** rival.
  *   **Verdict:** **Hard No on "Refutes."** Use **"Fails to Support"** or **"Did not find evidence for."**
  *   **Why:** Section 3 (Null Result Trap). A single null finding rarely kills a complex biological theory. "Refutes" is logically prohibited unless the theory *guaranteed* this specific biomarker change and nothing else.

  ### Case 3: Your Genetics Piece (The Correction)
  *   **Data:** Genetic results on recolonization.
  *   **Claim:** You wrote "Confirmed" the leading account.
  *   **New Info:** Colleague shows a second account fits the data *about as well*.
  *   **Checklist:**
      *   *Gate 4 (Rivals):* You now have an **Empirical Equivalent**. Two accounts fit the data equally well.
      *   **Rule:** Section 3 ("Correction" Threshold). If a Live rival fits the data equally well, you **MAY NOT** use "Confirms."
  *   **Verdict:** **You must downgrade.**
  *   **Action:** This is the hard pill. "Confirmed" implies the data selected *this* story over *that* story. If the data fits both, it didn't confirm either; it merely allowed both.
  *   **Wording Fix:** You do not necessarily need a formal "Correction" notice if the nuance can be fixed in the digital file without changing the factual record of what the study *did*. However, you must change the verb.
      *   *Old:* "Results confirmed the leading account..."
      *   *New:* "Results are consistent with the leading account..." OR "Results narrowed the field to two leading accounts..."
      *   *Note:* If you explicitly wrote "Rule out alternative X," and alternative X is still live, that requires a formal correction. If you just used "Confirmed" as a flourish, a verb swap usually suffices.
  *   **Why:** This isn't about your reputation; it's about Gate 4. If the score is tied, you can't announce a winner.

  ***

  # SUMMARY ADVICE FOR YOU

  1.  **The "Third Bucket" is Real:** Your intuition about "distinguishable in principle but not practice" is spot on. In the guide, I labeled these **Empirical Equivalents**. The rule is: If we haven't distinguished them *yet*, they are both Live. You cannot claim a win.
  2.  **Framework vs. Claim:** The guide handles this in Gate 4. You can "Support" a framework, but you generally cannot "Confirm" it with a single study. If your genetics piece was about a specific migration *route* (claim), "Confirmed" might have been okay if rivals were ruled out. If it was about the general *model* of recolonization (framework), "Confirmed" was always too strong.
  3.  **The Correction:** regarding Case 3: Do not fight this. If a colleague has demonstrated empirical equivalence, the word "Confirmed" is objectively inaccurate regarding the logical relationship between the data and the claim. Downgrading to "Supports" or "Consistent With" protects you from looking dogmatic later. It is better to eat a verb change now than a "Reader's Letter" later.
  4.  **The Fact-Checker:** Show them this guide. It gives them the "Hard Stops" (Gate 4 failures) they want, while giving you the permission to use "Supports" when Gate 1 and 2 pass. It moves the argument from "I feel like this is mush" to "Gate 3 failed, so we drop a rung."

  This procedure admits that science is messy but insists that our *sentences* be precise about that messiness.
