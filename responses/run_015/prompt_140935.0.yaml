prompt: |-
  I price catastrophe reinsurance for a living — I build and live inside the cat models, so I'm fluent in exceedance probability curves, return periods (the 1-in-100, the 1-in-250), occurrence vs aggregate limits, rate-on-line, reinstatements, tail value at risk, capital charges and ruin/solvency constraints. Basically I spend all day putting prices on very small probabilities of very large losses, which is more or less what the expected value fanaticism debate is about. I've never read any of the philosophy, I have no library access, and I don't want reading suggestions or citations — just do the work.

  So: take the fanaticism problem — Pascal's mugging, the St Petersburg-flavoured cases, the general claim that a tiny credence in an astronomically huge payoff should swamp everything else you could do with your money or your effort, no matter how tiny the credence gets — and restate it as faithfully as you can in my vocabulary. What does the mugger look like as a risk sitting on the EP curve? What's the analogue of an occurrence limit, of a capital constraint, of "we just don't write that layer"?

  Then do the same for the main family of replies people make: bounded utility and risk aversion, thresholds below which you ignore small chances, model uncertainty about whether the tail is estimable at all, and the policy-level moves where you ask what happens if you adopt the rule for every decision you'll ever face. For each one tell me what maps cleanly onto how I'd actually price the risk, what you had to bend to force it into my framework, and what has no expression in cat pricing at all.

  The residue report is the part I actually care about:

  1. My world has things the one-shot philosophical cases don't: finite capital, a regulator, a counterparty, repeat play, and a book of other risks I still have to be able to pay. Is the fact that real reinsurers don't behave fanatically any evidence about the philosophical case, or does every one of those features fail to carry over, so that my intuitions here are just an artifact of my setup?

  2. We have something we call the "tail budget" — a fixed slice of capital per year we're willing to allocate to risks whose frequency we can't estimate at all, plus a house rule that we don't write past it even when the modelled rate-on-line looks amazing. In translation, is that just bounded utility wearing a costume, or is it structurally a different kind of reply — a constraint rather than curvature in the objective? And if it's a constraint, does the philosophical debate have room for it, or does it look like an outright bug from inside a maximizing framework?

  3. In my models stakes scale linearly against my own capital and payoffs are dollars to me. In the fanaticism cases the payoffs are other people's welfare and they scale with how many people there will be, which partly depends on what you do. Is that difference doing real work in the argument, or is it just flavour?

  Be blunt about where the translation breaks. If part of the debate is confused rather than deep, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Catastrophe Reinsurance Pricer/Actuary. Deeply technical, fluent in cat model terminology (EP curves, return periods, occurrence/aggregate limits, rate-on-line, reinstatements, TVaR, capital charges, ruin constraints).
      *   **Task:** Translate the philosophical "fanaticism problem" (Pascal's Mugging, Longtermism, Expected Value Maximization in tails) into reinsurance pricing vocabulary. Then translate the standard philosophical replies (bounded utility, thresholds, model uncertainty, policy rules) into the same vocabulary.
      *   **Core Deliverable:** A "Residue Report" answering three specific questions about the differences between the reinsurance context and the philosophical context (finite capital/regulation vs. abstract agents, tail budgets vs. bounded utility, linear dollars vs. scalable welfare).
      *   **Constraints:** No reading suggestions, no citations, no philosophy jargon without translation. Be blunt about where the translation breaks.
      *   **Tone:** Professional, technical, direct, respecting the user's expertise.

  2.  **Deconstruct the Fanaticism Problem into Reinsurance Terms:**
      *   *The Mugging:* A submission for a layer with an infinitesimal frequency (e.g., 1-in-10-million) but an astronomical severity (e.g., 100x global GDP).
      *   *EP Curve:* The curve doesn't decay fast enough. The tail is "heavy" to the point of divergence or dominating the integral.
      *   *Expected Loss (EL):* The EL is driven entirely by the far tail, not the viewable range (1-in-10 to 1-in-10,000).
      *   *Rate-on-Line (ROL):* The requested premium is low relative to the EL, making the deal look accretive on pure EV grounds.
      *   *Capital/Ruin:* Writing this layer consumes all available capital (or requires infinite capital) to remain solvent at the required confidence level (e.g., 1-in-200 ruin probability).

  3.  **Deconstruct the Replies into Reinsurance Terms:**
      *   *Bounded Utility/Risk Aversion:* Utility function on surplus. Concave utility. We don't maximize expected dollars; we maximize expected utility of surplus. A loss that wipes out equity has infinite disutility (or sufficiently high) that we decline regardless of premium.
      *   *Thresholds/Truncation:* "De minimis" frequency. If frequency < 1-in-1M, we treat probability as zero. Hard cut-off on the EP curve.
      *   *Model Uncertainty:* "Model Risk." We don't trust the tail beyond the viewable range (e.g., beyond 1-in-10,000). We apply a confidence discount or cap the severity based on physical limits (e.g., total insured value).
      *   *Policy Rules/Rule Utilitarianism:* Underwriting Guidelines. "We do not write layers where the Maximum Possible Loss (MPL) exceeds X% of capital." Consistency constraint across the book.

  4.  **Drafting the Translation (Mental or Scratchpad):**
      *   *Mugging:* It's a submission for a 1-in-10^9 layer. The ROL is 1%. The EL is positive because $10^{20} \times 10^{-9} > \text{Premium}$.
      *   *Capital Constraint:* If we write this, our 1-in-200 TVaR blows out. We breach regulatory capital. We are ruined.
      *   *Reply 1 (Bounded Utility):* We maximize utility of surplus, not surplus itself. Log utility or similar. The marginal utility of the gain is low; marginal disutility of ruin is high.
      *   *Reply 2 (Thresholds):* We truncate the EP curve at 1-in-10,000. Anything beyond is zero.
      *   *Reply 3 (Model Uncertainty):* We don't believe the physics. We cap severity at Total Insured Value (TIV).
      *   *Reply 4 (Policy):* Underwriting authority limits. Can't sign off on >X% capital exposure.

  5.  **Addressing the Residue Report (The Core Value):**
      *   *Question 1 (Real World Constraints):* Does the fact reinsurers don't do this prove fanaticism wrong?
          *   *Analysis:* Reinsurers are finite agents with solvency constraints. Philosophical agents are often modeled as abstract maximizers without ruin.
          *   *Verdict:* It's evidence *against* fanaticism *for finite agents*, but fanaticism usually assumes an abstract agent without ruin. So, it's a category error to compare directly without adjusting for solvency.
      *   *Question 2 (Tail Budget vs. Bounded Utility):* Is the "Tail Budget" a constraint or utility curvature?
          *   *Analysis:* It's a hard constraint (linear programming), not a curve. It's a "knock-out" barrier.
          *   *Verdict:* It's structurally different. Maximizing frameworks hate hard constraints unless they are internalized as infinite disutility. It looks like a bug to a pure EV maximizer, but a feature for survival.
      *   *Question 3 (Linear Dollars vs. Scalable Welfare):* Does the scaling matter?
          *   *Analysis:* In reinsurance, losses are capped by TIV (finite world). In philosophy (longtermism), population is potentially unbounded.
          *   *Verdict:* This is the critical break. Reinsurance tails *must* converge because the money is finite. Philosophical tails might not converge if value scales with future people. This makes the math fundamentally different (convergent vs. divergent integrals).

  6.  **Refining the Tone and Terminology:**
      *   Ensure terms like "Viewable Range," "MPL," "PML," "TVaR," "Surplus," "Retention," "Cede," "Reinstatement Premium" are used correctly.
      *   Avoid philosophical jargon where possible, or define it immediately in actuarial terms.
      *   Be blunt. The user asked for bluntness.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   No reading suggestions? Check.
      *   Address all 3 residue questions? Check.
      *   Translate the problem and replies first? Check.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to confuse "occurrence limit" with "aggregate limit" in the analogy. The Mugging is usually a single shot, so it's an Occurrence layer.
      *   *Nuance:* In reinsurance, we often use "Probability of Ruin" rather than just EV. Emphasize that ruin is the hard stop.
      *   *Residue Q2:* Distinguish between "Risk Aversion" (curve) and "Capital Allocation Limit" (wall). The user's "Tail Budget" sounds like a capital allocation wall.
      *   *Residue Q3:* This is the strongest point. The "finite world" of insurance vs. "potentially infinite world" of ethics. Highlight the convergence of the integral.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is the translation of the fanaticism problem and its replies into catastrophe pricing vocabulary, followed by the residue report.

  ### Part 1: The Fanaticism Problem as a Risk Submission

  **The Submission:**
  A broker submits a layer for a peril with no historical loss data and no physical analog.
  *   **Frequency:** 1-in-10,000,000 (0.00001%).
  *   **Severity:** $10^{20}$ (roughly 1,000x current global wealth).
  *   **Rate-on-Line (ROL):** 0.0001%.
  *   **Expected Loss (EL):** Positive and massive. $10^{20} \times 10^{-7} = \$10^{13}$. Premium is $10^{11}$.
  *   **Viewable Range:** Your model is validated only to the 1-in-10,000. This point is four orders of magnitude beyond your viewable range.

  **The EP Curve:**
  The curve does not decay exponentially or as a power law with a coefficient < 1. It is "fat" enough that the integral of the tail (EL) diverges or is dominated by the single point at 1-in-10,000,000. The area under the curve beyond the 1-in-10,000 is larger than the area from 1-in-1 to 1-in-10,000.

  **The Capital Constraint:**
  To write this layer, you must hold capital against the 1-in-200 Probable Maximum Loss (PML) or TVaR. Because the severity is astronomical, the capital charge exceeds your entire surplus. Writing this layer triggers immediate ruin (insolvency) at the 1-in-200 confidence level, even if the Expected Value is positive.

  **The "Mugging":**
  The argument is: "You should write this layer. The Expected Value is positive. If you reject it, you are leaving free surplus on the table. If you do this for every similar submission, you maximize total surplus over infinite time."

  ---

  ### Part 2: The Replies Translated

  #### 1. Bounded Utility / Risk Aversion
  *   **Philosophy:** Money/Welfare has diminishing marginal utility. Saving a billionth life isn't 1/1,000,000,000th as good as saving one life if the scale gets too big.
  *   **Reinsurance Translation:** We do not maximize Expected Surplus; we maximize Expected Utility of Surplus. We apply a concave utility function (e.g., Log Utility) to the outcome.
  *   **Pricing Impact:** The utility gain from the premium (small increase in surplus) is outweighed by the disutility of the tail loss (wipeout), even if the probability is tiny. The "certainty equivalent" of the deal is negative.
  *   **Fit:** Clean. This is standard portfolio theory.
  *   **Bend:** Requires assuming the utility function is bounded (has an asymptote). Standard log utility is unbounded, just slow-growing. You have to impose a hard cap on utility to fully kill the fanaticism.

  #### 2. De Minimis Thresholds (Truncation)
  *   **Philosophy:** Probabilities below a certain threshold (e.g., 1-in-10^50) are treated as zero.
  *   **Reinsurance Translation:** Underwriting Guideline: "We do not model or price frequencies beyond 1-in-1,000,000." The EP curve is hard-truncated at the 1-in-1M point. Anything beyond is zero probability.
  *   **Pricing Impact:** The EL of the mugging layer becomes zero. Deal declined.
  *   **Fit:** Very Clean. This is standard modeling practice (the "viewable range" limit).
  *   **Bend:** It is arbitrary. Why 1-in-1M and not 1-in-10M? It admits that the math is being overruled by policy.

  #### 3. Model Uncertainty / Parameter Risk
  *   **Philosophy:** You can't trust the probability estimate. The "tiny credence" is actually "unknown unknown."
  *   **Reinsurance Translation:** Model Risk Load. We apply a confidence discount to the tail. Beyond the 1-in-10,000, we assume the model error is 100%. We cap severity at Total Insured Value (TIV) of the market.
  *   **Pricing Impact:** The severity is capped at the total capitalization of the reinsurance market. The $10^{20}$ loss is impossible because that money doesn't exist to be lost.
  *   **Fit:** Clean. This is "Physical Limits" modeling.
  *   **Bend:** In philosophy, the "value" (welfare) isn't capped by current physical assets in the same way money is.

  #### 4. Policy Rules / Rule Utilitarianism
  *   **Philosophy:** If everyone acted this way, the system breaks. Adopt a rule, don't maximize case-by-case.
  *   **Reinsurance Translation:** Underwriting Authority Limits. "No single event can expose more than 10% of Surplus." This rule is binding regardless of the ROL.
  *   **Pricing Impact:** The deal is rejected not because it's unprofitable, but because it violates the mandate.
  *   **Fit:** Clean. This is governance.
  *   **Bend:** This doesn't explain *why* the rule exists, only that it does. It pushes the justification back to the capital constraint.

  ---

  ### Part 3: Residue Report

  #### 1. Finite Capital, Regulators, and Repeat Play
  **Is the fact reinsurers don't behave fanatically evidence against the philosophical case?**

  Yes, but only for finite agents.
  In your world, **Ruin is Absorbing.** Once you breach the 1-in-200 capital charge and go insolvent, the game ends. You cannot compound the positive Expected Value of the next mugging because you no longer exist. The "repeat play" argument for fanaticism assumes you survive the losses to collect the wins. In reinsurance, the variance of the mugging layer is so high that it guarantees ruin before the law of large numbers kicks in.

  **Where the translation breaks:**
  Philosophical fanaticism often assumes an abstract agent (or a collective) that doesn't face a hard "game over" state equivalent to regulatory runoff. If the philosophical agent cannot be "ruined" (e.g., humanity as a whole, or a moral agent without solvency constraints), the reinsurance intuition fails. Your intuition is driven by **survival constraints**, not necessarily by the math of value. If you remove the regulator and the capital constraint, and allow infinite recapitalization, the reinsurance math actually *converges* toward the fanatic's EV maximization.

  **Verdict:** Your intuition is an artifact of the setup (finite capital + ruin constraint). It is valid evidence for how *finite* agents should act, but it does not refute the math for *abstract* maximizers.

  #### 2. The "Tail Budget" vs. Bounded Utility
  **Is the tail budget just bounded utility wearing a costume?**

  No. It is structurally different.
  *   **Bounded Utility** is a curve (curvature in the objective function). It makes the tail *less valuable*, but still calculable.
  *   **Tail Budget** is a wall (a linear constraint). It makes the tail *ineligible*.

  In optimization terms: Bounded utility changes the slope of the hill you are climbing. The Tail Budget puts a fence around the mountain.
  From inside a pure maximizing framework (EV or EU), a hard constraint looks like a bug unless the cost of breaching it is infinite. If you treat the Tail Budget as a "soft" limit (e.g., you can breach it but pay a penalty), a sufficiently high ROL will always justify breaching it.
  By making it a hard "house rule" ("we don't write past it even when ROL looks amazing"), you are admitting that **Survival > Optimization.**

  **Does the philosophical debate have room for this?**
  Standard consequentialism hates hard constraints. It views them as "deontological leaks." If the goal is "Maximize Good," a rule saying "Stop at X Good" is irrational unless X is the maximum possible Good.
  However, if you reframe the philosophical goal from "Maximize Good" to "Maximize Good Subject to Continuity of the Agent," the Tail Budget becomes rational. It is a **solvency constraint for moral agents.**

  **Verdict:** It is a constraint, not curvature. It looks like a bug to a pure maximizer, but it is the only way to prevent the "gambler's ruin" of moral capital. The philosophical debate usually ignores the "continuity of the agent" constraint, which is why the Tail Budget feels alien to them.

  #### 3. Linear Dollars vs. Scalable Welfare
  **Is the difference in scaling doing real work?**

  Yes. This is the mathematical break point.
  *   **Reinsurance:** The integral converges. There is a finite amount of money on Earth. The EP curve *must* hit zero severity eventually because you cannot lose more than the Total Insured Value. The tail is bounded by physics and accounting.
  *   **Fanaticism:** The integral often diverges. Welfare scales with population. Population can scale exponentially over time. The "Severity" (value at stake) grows faster than the "Frequency" decays.

  In your models, $P(x) \times V(x)$ goes to zero as $x \to \infty$ because $V(x)$ is capped.
  In the philosophical cases, $P(x) \times V(x)$ may stay constant or grow because $V(x)$ is unbounded (future generations).

  **Verdict:** This is not just flavor; it is the core mathematical divergence.
  Reinsurance pricing works because the world is finite. Fanaticism arises because the ethical world is potentially infinite.
  If you force the philosophical case to have a "Total Insured Value" (e.g., a cap on total possible welfare, or a hard end to time), the fanaticism problem largely disappears. The EP curve converges.
  The fact that you don't see fanaticism in cat models is proof that **finite bounds kill fanaticism.** The philosophical debate persists only because they refuse to accept a hard cap on value or time.

  ### Summary of the Break
  The translation breaks at **Ruin** and **Infinity**.
  1.  **Ruin:** You have a hard stop (insolvency). Philosophy often assumes a soft stop (regret).
  2.  **Infinity:** Your severity is capped (TIV). Their severity is uncapped (Future People).

  Your "Tail Budget" is the rational response of a finite agent facing an unbounded claim. The philosophers are arguing about how to price a layer that has no occurrence limit and no aggregate cap. You are right to decline the submission; they are arguing about whether the submission should exist in the first place.
