answer: |-
  Here is the restatement of Simpson's paradox in the vocabulary of craft, followed by the residue report and the analysis of your specific case.

  ### I. The Paradox Restated in Craft Vocabulary

  **The Setup**
  Imagine you are tracking a specific narrative effect—let us call it **Reader Alignment**—across a novel. You have two distinct modes of narration, which we will treat as your "treatment" and "control." Let's say **Mode A** is Deep Interiority (close third person) and **Mode B** is Exterior Surveillance (distant third person).

  You divide your novel into two **Subplots** (or Contexts): **High Stakes** scenes and **Low Stakes** scenes. These subplots function as your subgroups.

  **The Local Truth (The Chapter-Level Reading)**
  In the **High Stakes** subplot, whenever you switch from Exterior Surveillance to Deep Interiority, Reader Alignment increases. The reader feels closer to the protagonist.
  In the **Low Stakes** subplot, the same holds true: whenever you switch from Exterior Surveillance to Deep Interiority, Reader Alignment increases.
  Locally, within the logic of every scene and subplot, Deep Interiority is the superior craft choice for generating sympathy.

  **The Global Truth (The Book-Level Reading)**
  However, when the reader finishes the book and assesses the **Whole-Book Arc**, they report that the sections written in Deep Interiority feel *colder* and more alienating than the sections written in Exterior Surveillance. The global trend contradicts the local trend.

  **The Mechanism (The Shifting Mix)**
  This reversal occurs because of the **distribution of scene length and frequency** (the subgroup mix).
  *   **Deep Interiority** is used predominantly in the **Low Stakes** subplot (which has a naturally low baseline for Alignment). Furthermore, these Low Stakes scenes are long, lingering, and verbose (high weight).
  *   **Exterior Surveillance** is used predominantly in the **High Stakes** subplot (which has a naturally high baseline for Alignment). These scenes are short, punchy, and propulsive (low weight).

  Because the "cold" Low Stakes scenes are weighted heavily by length and frequency in the Interiority condition, they drag down the overall average, overwhelming the local gains made within the subgroups. The paradox consists in the fact that **emphasis (weighting) can invert effect.** A technique can be locally successful everywhere but globally failing because it is applied where it is least needed, for too long.

  ### II. Distinction from Nearby Errors

  To isolate the paradox, we must distinguish it from the errors often conflated with it:

  *   **Regression to the Mean:** This suggests that extreme chapters (very high sympathy) will naturally be followed by more moderate ones. Simpson's is not about temporal decay; it is about structural aggregation. The reversal happens even if the order is shuffled, provided the weights remain.
  *   **Base-Rate Neglect:** This is ignoring the prior probability of an event. While related, Simpson's is more specific: it is not merely ignoring the base rate, but actively reversing the conditional relationship *because* of the correlation between the base rate and the group size.
  *   **The Ecological Fallacy:** This is inferring individual properties from group data (e.g., "Rich neighborhoods vote Democrat, so rich individuals vote Democrat"). Simpson's is the inverse: it is when the individual (subgroup) data is consistent, but the group (aggregate) data lies.
  *   **Merely Confounded Comparison:** All Simpson's paradoxes involve confounding (a lurking variable, here "Stakes"). But a "mere" confounder just obscures the true value. Simpson's is distinct because the confounder is strong enough to **flip the sign** of the conclusion. It turns a "good" technique into a "bad" one purely through distribution.

  ### III. The Residue Report

  **1. What carries over into the vocabulary of craft without loss?**
  The **structural shape of the part-to-whole relationship.** Craft already understands that a scene can succeed while the book fails. The notion that **weighting matters** is also native to craft: you understand that a 4,000-word chapter exerts more gravitational pull on the reader's memory than a 400-word chapter. The idea that "distribution of emphasis" can alter "perceived intent" is a standard editorial insight.

  **2. What carries over only if you quietly substitute a craft notion for a statistical one? (Where is the fudge?)**
  The fudge lies in **Quantification of Effect.** Statistics requires a rate (e.g., 60% success vs. 40% success). Craft deals in *qualia*. To make the paradox work, we must pretend "Sympathy" is a measurable scalar that sums linearly across pages.
  In reality, a 4,000-word chapter is not necessarily "10 times" the emotional weight of a 400-word chapter. A short chapter can be the pivot of the book; a long one can be forgettable. The statistical model assumes **Duration = Weight.** Craft knows this is often false. A 400-word epiphany can outweigh 4,000 words of travel. To map the paradox faithfully, you must accept the fudge that *word count proxies for emotional impact.*

  **3. What has no expression in my vocabulary at all?**
  *   **The Necessity of the Mix Difference:** Statistics dictates that the paradox *cannot* happen unless the proportion of Subgroup A to Subgroup B differs between the Treatment and Control. Craft vocabulary has no formal check for this. You do not typically audit your manuscript to ensure "Deep Interiority is not disproportionately allocated to Low Stakes scenes." You rely on intuition.
  *   **Ratios vs. Counts:** The paradox turns on rates (sympathy per opportunity), not raw counts (total sympathy). Craft thinks in totals ("This book is sad"). It rarely thinks in rates ("This book generates sadness efficiently").
  *   **Conditioning vs. Intervening:** This is the deepest gap. In causal inference (Pearl), the "truth" depends on whether you are *observing* the variable (Conditioning) or *forcing* it (Intervening).
      *   *Conditioning:* "When the character *is* in Interiority, what happens?"
      *   *Intervening:* "If I *force* the character into Interiority, what happens?"
      *   Craft does not distinguish these. You write what is there. You do not have a vocabulary for the counterfactual: "If I had used Interiority in the High Stakes scene, would it have worked?" You only know what you wrote.

  ### IV. Analysis of Your Case

  **The Translation**
  *   **Data Points:** Chapters.
  *   **Variable:** Sympathy Growth (Slope within chapter).
  *   **Weights:** Chapter Length (400 vs. 4,000 words).
  *   **Confounder:** Point of View (POV).
  *   **Observation 1 (Chronological):** Within every chapter, Sympathy $\uparrow$.
  *   **Observation 2 (Aggregate):** Whole Book Sympathy $\downarrow$ (Reader feels colder).
  *   **Observation 3 (Regrouped by POV):** The reversal reverses (Sympathy $\uparrow$ overall).

  **Statistical Diagnosis**
  You are experiencing a **Weighted Aggregation Bias** driven by a confounder (POV) that correlates with your weights (Length).
  *   The chapters where the protagonist is inherently "coldest" (or where the baseline sympathy is lowest) are the **Long Chapters** (4,000 words). Even if sympathy *grows* within them, the sheer duration of the "cold" baseline dominates the reader's memory.
  *   The chapters where the protagonist is "warmest" are the **Short Chapters** (400 words). The growth is steep, but the exposure time is too short to shift the global average.
  *   **The POV Regrouping:** When you group by POV, you likely isolate the "Long/Cold" chapters into one bucket and "Short/Warm" chapters into another. If one POV is predominantly the "Warm" short chapters, that POV's aggregate will look positive.

  **Which Reversal is the Real One?**
  The **Book-Level (Cold)** reading is the real one.
  *   *Why:* Reading is a temporal experience. It is weighted by time spent. A reader cannot spend 400 words in a chapter and have it count as much as 4,000 words. The "Cold" feeling is the result of the **weighted average** of their experience. The "Chapter-Level" growth is a local derivative that gets washed out by the integral of the whole.
  *   The POV reversal is an artifact of **stratification**. It tells you *where* the coldness lives (in specific POVs), but it does not negate the reader's total experience.

  **Does Craft Vocabulary Guide the Partition?**
  **No.** Craft vocabulary gives you no formal guidance on whether to partition by **Chronology** (Chapter order) or **POV** (Character lens).
  *   A novelist asks: "Does this serve the theme?"
  *   A statistician asks: "Which variable is the confounder?"
  *   In your case, **Length** is the confounder. Craft talks about "Pacing," but it treats Pacing as a rhythmic quality, not a weighting variable that mathematically alters the mean emotional outcome. You have no tool to say, "I have confounded Length with Sympathy."

  **Defect or Category Error?**
  This is a **Category Error**, not a defect in craft vocabulary.
  *   **Reasoning:** Statistical truth seeks to isolate variables to find a causal constant. Narrative truth seeks to synthesize variables to create a specific *experience*.
  *   The "Paradox" in your book is not a bug to be solved by finding the right partition. It is the **mechanism of the tragedy**. The fact that the protagonist grows more sympathetic in every local instance, yet the reader feels colder overall, *is the meaning of the book*. It suggests that growth is futile against the weight of circumstance (Length/Duration).
  *   If you "fixed" the statistics by balancing the chapter lengths, you might destroy the rhythm that creates the emotional effect.
  *   Craft vocabulary does not need to solve the paradox because **the paradox is the text.** The tension between the local hope (chapter growth) and the global despair (book coldness) is a valid literary structure. Statistics demands a single "true" causal effect; Literature allows the Part and the Whole to contradict each other as a form of irony.

  **Recommendation:**
  Do not seek the "correct" partition. Acknowledge that the **Weighted Average (The Book)** is the reader's truth, and the **Local Slope (The Chapter)** is the character's truth. The gap between them is not a calculation error; it is your dramatic irony.
