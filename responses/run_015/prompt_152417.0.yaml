answer: |-
  You are not being inconsistent, but you are being imprecise. Your gut is tracking a specific ethical boundary, but Case 4 reveals where your terminology is muddy, and Case 1 is a ticking time bomb if you don't qualify it.

  Here is the definite stance you need to take to clean this up.

  ### The Principle: The Jurisdiction of Accountability

  Your verdicts are governed by a single distinction: **Archives hold sovereignty over material accountability; Memory holds sovereignty over social meaning.**

  *   **Material Accountability:** Questions of physical causality, legal responsibility, and resource distribution (Who died? Who ordered it? Who owns the land?). In this jurisdiction, the archival record must win, especially when memory obscures power dynamics or injustice.
  *   **Social Meaning:** Questions of identity, ritual, grief, and internal cohesion (Who are we? How do we mourn? What does this site signify?). In this jurisdiction, memory wins, provided it does not make false claims about material accountability that harm others.

  ### Which Verdicts to Overturn (or Tighten)

  To make this principle hold, you need to adjust two of your positions:

  **1. Case 4 (The Sacred Site): Stop Waffling.**
  You cannot say "both can be true" regarding the *physical* destruction. That violates the law of non-contradiction and undermines your stance in Case 2 and 3.
  *   **The Fix:** You must split the claim. On the question of *physical degradation* (Material Accountability), the **Archival Record wins**. The site was physically intact in the 1950s. On the question of *spiritual severing* (Social Meaning), **Memory wins**. The community experienced a loss of sanctity that photos cannot capture.
  *   **Why:** If you allow memory to override physical evidence here, you open the door to denying physical evidence in Case 2 (the massacre) or Case 3 (the land fraud). You must distinguish *ontology* (what exists) from *phenomenology* (what is experienced).

  **2. Case 1 (The Fishing Village): Add a Label.**
  Your verdict is correct *only if* the ceremony is treated as **myth/ritual**, not **history**.
  *   **The Fix:** The ceremony stays, but if the village puts up a historical marker or teaches this in a school, the **Archival Record wins**. The "Great Rescue" can function as a founding myth for social cohesion (Social Meaning), but it cannot be asserted as factual history in the public sphere (Material Accountability).
  *   **Why:** In Case 3, you rightly demanded the curriculum change because the "benevolent founder" myth erased indigenous suffering. In Case 1, the "heroic villager" myth aggrandizes the locals but doesn't actively erase a victim's suffering (the sailors are already dead; the myth doesn't blame them). It is a "harmless" falsehood *only* so long as it remains in the realm of ritual.

  **Cases 2 and 3 are already correct.** In both, the community's memory makes claims about *material accountability* (State intent, Land ownership) that, if accepted as fact, would obscure injustice or falsely assign guilt. Here, the Archive must protect the historical record from political or social utility.

  ### The Prediction: Case 5 (The Museum Labor Strike)

  **The Verdict:** The exhibit must present the Union's oral histories as **valid evidence of experience**, even if they contradict the police reports, but it must frame the *conflict* itself as the historical story.

  **Why:**
  This is the ultimate test of the **Jurisdiction of Accountability**.
  1.  **Bias of the Archive:** Police reports are not neutral "records." They are instruments of the state, often created to justify force. In this specific jurisdiction, the Archive is *inherently suspect* regarding accountability for violence.
  2.  **Epistemic Justice:** Public history ethics dictate that when the archive is silent or self-exculpatory regarding marginalized groups, oral memory fills the evidentiary gap.
  3.  **Application:** The museum should not say "The police say X, the union says Y, who knows?" (False equivalence). It should say, "Police records deny violence, but fifty oral testimonies confirm it, suggesting a systemic cover-up."

  ### Summary of Your Clean Principle

  You are a **Critical Realist**. You believe there is a material reality that archives best approximate (Case 2, 3, 4-physical), but you believe that reality is insufficient to explain human experience (Case 1, 4-spiritual).

  *   **Memory wins** when it builds identity without erasing victims.
  *   **Archives win** when they establish causality, protect the marginalized from erasure, or correct power-laden falsehoods.
  *   **In the Museum (Case 5):** When the Archive is an instrument of power, Memory becomes the counter-archive. You present the Union's version not as "legend" (Case 1), but as **testimony** that corrects the official record.

  If you hold this line, you stop going in circles. You aren't choosing between Memory and Record; you are assigning them to their proper jurisdictions.
