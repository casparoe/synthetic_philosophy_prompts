answer: |-
  You have put your finger on a precise and under-labeled dynamic in the epistemology of experimental science. Your intuition is correct: the standard philosophical discussion of the **"Problem of Old Evidence"** (associated with Clark Glymour and Bayesian confirmation theory) does not adequately capture what you are describing.

  In the standard "Old Evidence" problem, the proposition $E$ is assumed to be fully constituted and believed with probability 1 *before* theory $T$ arrives. The philosophical puzzle is how $T$ can be confirmed by $E$ if $E$ cannot raise the probability of $T$ (since $E$ was already certain).

  Your cases differ fundamentally. In your geochemical and morphological examples, the "evidence" *before* the theory was not a believed proposition $E$; it was a rejected proposition $N$ (noise, contamination, artifact). The theory $T$ did not merely explain $E$; it provided the justification to transform $N$ into $E$. The evidential proposition *after* the theory is logically distinct from the one *before*, because it includes correction factors or descriptive categories that were unavailable or unjustified previously.

  ### Existing Concepts and Where They Fall Short

  There is no single canonical proper noun (like "The Duhem-Quine Thesis") for this specific configuration, but it sits at the intersection of three established discussions. It is useful to see where your pattern resembles them and where it diverges.

  **1. The Problem of Old Evidence (Glymour)**
  *   **Resemblance:** The measurements exist temporally before the theory.
  *   **Divergence:** As you noted, the standard problem assumes the evidence is "fully formed." In your cases, the *epistemic status* of the numbers changes. Before $T$, the numbers were $D_{raw}$ (interpreted as error). After $T$, they are $D_{corrected}$ (interpreted as signal). Since $D_{corrected} \neq D_{raw}$, this is not strictly "old evidence." It is *new evidence derived from old measurements.*

  **2. Data vs. Phenomena (Bogen & Woodward)**
  *   **Resemblance:** Bogen and Woodward (1988) distinguish between *data* (idiosyncratic measurements prone to error) and *phenomena* (stable features of the world). Theories explain phenomena, not data.
  *   **Divergence:** Their framework explains *what* theories explain, but it is less specific about the *temporal mechanism* of promotion. Your cases describe the specific moment where a theoretical shift validates a new data-reduction protocol, thereby promoting data to phenomena. Your pattern is the *process* of that promotion.

  **3. Epistemic Iteration (Hasok Chang)**
  *   **Resemblance:** Chang (2004) describes how scientific knowledge advances through cycles where improved instruments/techniques yield better data, which yields better theory, which yields better instruments.
  *   **Divergence:** Chang focuses on the long-term historical progression of concepts (like temperature). Your case is more localized: a specific re-evaluation of existing datasets triggered by a specific theoretical shift, used for *confirmation* rather than just conceptual refinement.

  ### A Proposed Term: **Evidential Reconstitution**

  Since no established label captures the specific *confirmatory* role of this status-shift, I propose the term **Evidential Reconstitution**.

  This term is not yet standard in the literature, but it precisely describes the ontological and epistemic work being done on the data. It distinguishes the process from mere "accommodation" (fitting a curve) or "prediction" (finding new data).

  #### Definition
  **Evidential Reconstitution** occurs when:
  1.  **Pre-Existence:** A set of measurements $M$ exists prior to Theory $T$.
  2.  **Prior Rejection:** Under the predecessor framework ($T_{old}$), $M$ was categorized as epistemically defective (noise, contamination, outlier, artifact) and excluded from the evidential corpus.
  3.  **Theoretical Enablement:** $T$ provides a specific mechanism, correction factor, or categorical distinction that was unavailable in $T_{old}$.
  4.  **Transformation:** Application of $T$'s mechanisms to $M$ yields a reconstituted dataset $M'$.
  5.  **Confirmation:** $M'$ is accepted as valid evidence and confirms $T$, without $T$ having been constructed specifically to fit $M$.

  #### Why this solves the "Old Evidence" worry
  The Bayesian worry about old evidence is that $P(E) = 1$, so $P(T|E)$ cannot exceed $P(T)$. In Evidential Reconstitution, the evidence is not $M$ (the old numbers); it is $M'$ (the re-reduced numbers).
  *   Before $T$, $P(M' \text{ is valid}) \approx 0$.
  *   After $T$, $P(M' \text{ is valid}) > 0$.
  Because the *validity* of the evidence is itself a hypothesis dependent on the theory, the confirmation is not stagnant. The theory confirms the data's validity, and the data confirms the theory's explanatory power. This is a form of **reciprocal justification**, but one that is temporally staggered.

  ### Boundary Cases

  To determine whether a given instance belongs to **Evidential Reconstitution**, apply these boundary tests.

  **1. The "Ad Hoc" Boundary (Exclusion)**
  *   *Case:* A theorist notices an anomaly, tweaks the equations specifically to make that anomaly disappear, and claims confirmation.
  *   *Verdict:* **Not Evidential Reconstitution.** This is *ad hoc* accommodation.
  *   *Criterion:* In Evidential Reconstitution, the theory must have independent motivation. As you noted in your isotope example, the new model was "not constructed with those ratios in mind." The correction algorithm must be a *consequence* of the theory, not a *fit parameter* designed for the data.

  **2. The "Standard Old Evidence" Boundary (Exclusion)**
  *   *Case:* The perihelion of Mercury. The data was accepted as accurate before Einstein; it was simply unexplained by Newton.
  *   *Verdict:* **Not Evidential Reconstitution.** This is standard Old Evidence.
  *   *Criterion:* In your cases, the data was *rejected* or *discounted* before the theory. If the data was accepted as accurate but mysterious, it is Old Evidence. If it was accepted as *error* and later accepted as *signal*, it is Evidential Reconstitution.

  **3. The "Pure Prediction" Boundary (Exclusion)**
  *   *Case:* A theory predicts a new particle; an experiment is built to find it.
  *   *Verdict:* **Not Evidential Reconstitution.**
  *   *Criterion:* The measurements must pre-exist the theory. If the instrument is built *after* the theory to test it, it is prediction.

  **4. The "Theory-Laden Perception" Boundary (Exclusion)**
  *   *Case:* A biologist looks at a cell and, after learning a new taxonomy, "sees" a structure they previously ignored.
  *   *Verdict:* **Borderline / Weak.**
  *   *Criterion:* This is Hanson's "theory-ladenness of observation." Evidential Reconstitution is stronger when it involves *quantitative reduction* or *protocol changes* (like your isotope corrections) rather than just perceptual attention. The "reconstitution" should be reproducible by a third party applying the new correction rules to the old raw numbers.

  ### Philosophical Significance

  Your observation highlights a blind spot in formal confirmation theory. Bayesian models tend to treat evidence as static propositions ($E$). Your experience as a geochemist shows that evidence is often a **process**—a result of reduction, correction, and validation.

  When philosophers worry that "accommodation is less valuable than prediction," they often assume the evidence is fixed. In cases of **Evidential Reconstitution**, accommodation is highly valuable because the theory has successfully *rescued* data that was previously lost. It demonstrates that the theory captures the structure of the world well enough to distinguish signal from noise in retrospect.

  This suggests that confirmation is not just about $P(T|E)$, but about the **stability of the evidential base**. A theory that can reconstitute "noise" into "signal" without *ad hoc* tuning is demonstrating a robustness that mere prediction sometimes lacks.

  ### Summary
  *   **Name:** **Evidential Reconstitution** (proposed descriptive term).
  *   **Closest Existing Concepts:** The Problem of Old Evidence (but distinct), Bogen & Woodward's Data/Phenomena, Hasok Chang's Epistemic Iteration.
  *   **Key Distinction:** The evidence is not merely "known"; its *status as evidence* is created by the theory.
  *   **Boundary:** Distinct from *ad hoc* fitting (theory must be independent) and standard Old Evidence (data must have been previously rejected as error).

  You are describing a robust form of scientific reasoning that validates the "re-rerunning" of history with better tools. It is not a fallacy of accommodation; it is a demonstration of **operational coherence**.
