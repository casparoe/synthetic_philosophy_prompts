answer: |-
  Your hunch is correct: this isn't an empirical deadlock, it's an ontological one. You are witnessing two different definitions of "existence" fighting over the same noun.

  Here is the diagnosis for your feature, stripped of the bibliography and anchored in the logic of the dispute.

  ### 1. The Metaphysical Clash: Institutional Fact vs. Phenomenological Reality
  You asked if this is a hidden metaphysical clash. Yes. Specifically, it is a clash over the **threshold of reality** for a social group.

  *   **The Modernist (Anderson/Hobsbawm) Ontology:** A nation is an *institutional fact*. Like a corporation or a marriage, it requires a specific legal-bureaucratic infrastructure to exist. For Anderson, the "imagined community" requires the material capacity to be imagined simultaneously (print capitalism, standardized time). For Hobsbawm, it requires top-down engineering by elites. To them, asking if a nation existed in 1500 is like asking if a software company existed in 1500. The *concept* might have existed, but the *entity* could not, because the operating system (modernity) wasn't installed.
  *   **The Ethnosymbolist (Smith) Ontology:** A nation is a *phenomenological reality*. It exists when a population perceives itself as a continuous historical community, regardless of political sovereignty. Smith argues that *ethnies* (pre-modern ethnic cores) provide the symbolic raw material. To them, asking if a nation existed in 1500 is like asking if a river existed before it was dammed. The flow (identity/memory) was there, even if the hydroelectric plant (the state) wasn't.

  **The Deadlock:** When Modernists look at the 1890s Balkan census, they see the *absence of political categories* (proof of non-existence). When Ethnosymbolists look at the same census, they see *continuity of cultural markers* (proof of existence). They aren't disagreeing on the data; they are disagreeing on what counts as evidence of "nationhood."

  ### 2. The Causal Mechanism: Memory as Constraint vs. Memory as Tool
  Your point about collective memory is the sharpest lever here. The debate hinges on whether memory is a **causal constraint** or a **retrospective tool**.

  *   **Modernists:** Memory is a *tool*. Elites reach into the past, grab a myth (a battle, a martyr), and polish it to serve present political needs. The past does not constrain the invention; it only supplies the quarry. If the memory doesn't exist, they invent it. Therefore, the "age" of the nation is the age of the *usage*, not the age of the *material*.
  *   **Ethnosymbolists:** Memory is a *constraint*. You cannot invent just anything. Nationalist elites are bounded by the pre-existing "myth-symbol complex" of the *ethnie*. If you try to build a nation on a memory the population doesn't recognize, it fails. Therefore, the "age" of the nation is tied to the age of the *myth*, because the myth dictates the political possibility.

  **The Diagnosis:** Modernists study the *engineers*; Ethnosymbolists study the *bricks*. The engineers say, "The building is new." The geologists say, "The stone is old." Both are right, but they are measuring different things.

  ### 3. Two Enquiries Under One Heading
  You asked if they are running two different enquiries. This is the most productive way to frame it.

  1.  **Enquiry A (Modernist):** *How does political sovereignty organize mass society?* This is a question about **State Formation**. It is functionalist. It cares about borders, passports, and mass literacy.
  2.  **Enquiry B (Ethnosymbolist):** *How does collective identity persist across time?* This is a question about **Social Psychology/Cultural Continuity**. It is hermeneutic. It cares about myths, rituals, and genealogies.

  The stalemate exists because both sides claim the word "Nation" exclusively. Modernists conflate "Nation" with "Nation-State." Ethnosymbolists conflate "Nation" with "Ethnie." As long as they fight over the single label, they will talk past each other.

  ### 4. What Would Shift It?
  A fresh archival find will not solve this. You could find a 14th-century document where a peasant says, "I am French," and the Modernist will call it an anomaly or a different definition of "French," while the Ethnosymbolist will call it proof of continuity. **More data only fuels selection bias.**

  To shift the debate, you need a **terminological divorce**, not a factual resolution.

  *   **The Fix:** We need to retire the question "How old are nations?" because it is a category error. Instead, we should split the concept:
      *   **Polity-Community:** The pre-modern sense of belonging based on myth/kin (Ethnosymbolist domain).
      *   **Political Nation:** The modern mechanism for mobilizing that belonging into state power (Modernist domain).
  *   **The Shift:** Progress happens when we stop asking about *origins* and start asking about *function*. The question shouldn't be "Is this nation old?" It should be "What work does the *claim* of antiquity do for this specific political movement?"

  ### 5. The Honest Call: Is Progress Possible?
  Here is the hard truth for your feature: **No, progress is not possible within the current framework.**

  The stalemate is built into the concept itself because "the nation" is not just an object of study; it is a political weapon.
  *   If you prove nations are modern (Modernist), you delegitimize ethnic claims to territory based on ancient history. (This is a liberal/universalist political project).
  *   If you prove nations are ancient (Ethnosymbolist), you validate claims to sovereignty based on historical continuity. (This is often a conservative/particularist political project).

  The scholars aren't just analyzing data; they are implicitly arguing about the legitimacy of the modern state system. Modernists want to show that borders are mutable and constructed (therefore changeable). Ethnosymbolists want to show that borders reflect deep realities (therefore stable).

  **Recommendation for the Feature:**
  Don't try to solve the debate. Expose it as a **Rorschach test**. The "age of nations" question tells you less about history and more about what the scholar believes politics *ought* to be.
  *   If you believe politics is about rational consent and civic institutions, you will find the Modernist argument compelling.
  *   If you believe politics is about deep belonging and cultural destiny, you will find the Ethnosymbolist argument compelling.

  The deadlock persists because we haven't decided whether a nation is a **contract** (Modernist) or a **family** (Ethnosymbolist). Until we settle that metaphysical score, the census records from the 1890s will remain silent.
