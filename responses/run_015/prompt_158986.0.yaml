  # Seminar Handout: Mapping the Modal Landscape
  **Course:** Modality and Semantic Content  
  **Instructor:** [Your Name]  
  **Topic:** Decision Tree for Post-Kripkean Semantics

  ### Instructions
  We begin from a **Shared Commitment**: You accept that some identity statements (e.g., "Hesperus is Phosphorus," "Water is H₂O") are *necessary* (could not have been otherwise) yet *knowable only a posteriori* (require empirical investigation). You also accept that a term can refer to an object even if most of what a speaker believes about that object is false.

  This tree sorts views based on how they explain *why* these commitments hold. Answer each question based on how you think the **cases** (Twin Earth, Standard Meter, Zombies, etc.) work, not based on which philosopher you prefer. Follow the arrows to your assigned position.

  ---

  ### The Decision Tree

  **Q1. The A Priori Connection**  
  Consider the statement: *"Water is the clear, drinkable liquid in our lakes."* You can know this is true without chemical tests (a priori), but "Water is H₂O" is necessary.  
  Is the a priori connection between the word "water" and the description ("clear, drinkable liquid") part of **what the sentence claims about the world** (semantic content), or is it merely **how we locate the subject** before making the claim (reference-fixing)?
  *   **(A) It is part of what the sentence claims.** → Go to **Q2**.
  *   **(B) It is merely how we locate the subject.** → Go to **Q3**.

  **Q2. The Status of the A Priori Claim**  
  (For those who answered **A**): If the description is part of the content, then in a scenario where XYZ fills the lakes, the sentence "Water is the clear liquid" would be true.  
  Does this scenario represent a **genuine kind of possibility** (Deep/Primary Necessity), or is it just a way of tracking **what we can rule out without investigation** (Epistemic Bookkeeping)?
  *   **(A) It is a genuine kind of possibility.** → Go to **Q4**.
  *   **(B) It is just epistemic bookkeeping.** → **Leaf: Unoccupied Cell 1** (See below).

  **Q3. The Nature of the Distinction**  
  (For those who answered **B**): We have distinguished between how we find the referent and the referent itself. When we evaluate "Water might not have been H₂O" in a Twin Earth scenario, what are we varying?
  *   **(A) We are varying the **context of utterance** (who is speaking, where, and how words are used).** → Go to **Q5**.
  *   **(B) We are varying the **metaphysical structure of the world** (what stuff exists).** → Go to **Q6**.
  *   **(C) We are varying the **epistemic situation** (what evidence we have), but not the content.** → Go to **Q4**.
  *   **(D) We are not varying anything meaningful; the distinction is a confusion.** → **Leaf: The Skeptic (Soames)**.

  **Q4. The Role of Conceivability**  
  (For those reaching here from **Q2A** or **Q3C**): Consider the Zombie scenario (physically identical to us, but no consciousness).  
  If you can clearly conceive of this scenario, does that **prove it is possible** (in some sense), or does it merely show something about **your concepts**?
  *   **(A) It proves it is possible.** → **Leaf: Epistemic Two-Dimensionalism (Chalmers)**.
  *   **(B) It shows something about concepts, not possibility.** → **Leaf: Reference-Fixing Descriptivism (Evans-style)**.

  **Q5. The Treatment of Indexicals**  
  (For those reaching here from **Q3A**): Consider the word "I". Does it follow the **same rules** as "Water" (context determines content), or does it need a **separate apparatus** (direct reference shifted by context)?
  *   **(A) Same rules (Unified Framework).** → **Leaf: Contextualist/Metasemantic (Stalnaker)**.
  *   **(B) Separate apparatus (Context vs. Content).** → **Leaf: Contextualist/Indexical (Kaplan)**.
      *(Note: For the purposes of this seminar, these leaves are collapsed regarding modality, but separated on semantic machinery.)*

  **Q6. The Utility of the Apparatus**  
  (For those reaching here from **Q3B**): You hold that reference is direct and modality is metaphysical.  
  Is the "Two-Dimensional" framework (distinguishing epistemic vs. metaphysical) a **helpful tool** for explaining the necessary a posteriori, or is it **unnecessary machinery** for a problem solved by direct reference alone?
  *   **(A) Helpful/Neutral Tool.** → **Leaf: Direct-Reference Realist (Kripke)**.
  *   **(B) Unnecessary/Misleading.** → **Leaf: The Skeptic (Soames)**.
      *(Note: If you arrived here from Q3D, you are also The Skeptic. If you arrive here from Q3B, you are the Direct-Reference Realist.)*

  ---

  ### Map of Empty Cells
  *The following combinations are permitted by the logic of the tree but are unoccupied in the literature.*

  1.  **Content = Yes (Q1A) + Deep Necessity = Bookkeeping (Q2B):**  
      *Status: Merely Unattractive.*  
      If you claim the description is part of the *content* (what is said), but deny it represents a *genuine possibility*, you render the content inert. It explains nothing about modality and loses the explanatory power of Two-Dimensionalism without gaining the simplicity of Direct Reference.

  2.  **Dimensions = Context (Q3A) + Deep Necessity = Real Work (Q2A equivalent):**  
      *Status: Incoherent.*  
      If the variation is merely about *context* (how words are used), there is no room for a "Deep Necessity" that competes with metaphysical necessity. Contextual variation is pragmatic or linguistic, not a competing modal force.

  3.  **Dimensions = Epistemic (Q3C) + Indexicals = Separate Apparatus (Q5B):**  
      *Status: Unexplored/Unmotivated.*  
      A view that treats names as tracking epistemic scenarios (2D) but treats indexicals ("I", "Now") as requiring a completely different, non-2D mechanism would be theoretically fragmented. The main motivation for Epistemic 2Dism is unifying the treatment of all referring terms.

  ---

  ### Instructor's Note: Discriminating Power

  *   **The Heavy Lifters:** **Q1 (Content vs. Reference)** and **Q4 (Conceivability)** do the most work. Q1 isolates the Epistemic Two-Dimensionalist (Chalmers) from the entire Direct Reference/Metasemantic cluster. Q4 separates the Two-Dimensionalist from the Reference-Fixing Descriptivist (who accepts descriptive reference-fixing but denies conceivability entails possibility).
  *   **The Redundant Cut:** **Q2 (Deep Necessity)** is largely redundant for most students. If you answer "Content" in Q1, you almost invariably answer "Real Work" in Q2 (Chalmers). If you answer "Reference" in Q1, you almost invariably answer "Bookkeeping" or "None" in Q2/3. I have kept it to force a distinction between *semantic* commitment and *modal* commitment, but in practice, they track together.
  *   **The Collapse:** **Kaplan and Stalnaker (Q5)** are separated here on technical machinery regarding indexicals. However, regarding the *modal* status of the necessary a posteriori, they occupy the same space (Contextualist/Metasemantic). If your interest is purely modal, treat these leaves as collapsed.
  *   **The Skeptic:** **Soames** appears in two places (Q3D and Q6B). This reflects that one can reject the framework either because one thinks it misdescribes the cases (Q3D) or because one accepts the cases but finds the framework superfluous (Q6B).
