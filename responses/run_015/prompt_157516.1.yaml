answer: |-
  **ETHICS 450: FINAL EXAMINATION**
  **Time Allowed:** 45 Minutes
  **Word Count:** 800–1000 Words
  **Instructions:** Answer ONE of the following questions. Do not recieve credit for definitions alone; analysis is required. No bibliographies necessary.

  **Prompt: The Institutional Residue Problem**

  Traditional accounts of supererogation define it as action that is good to do but not wrong to omit ("beyond the call of duty"). However, this definition often ignores the structural context in which acts occur. Consider the "Institutional Residue Problem": heroic acts may merely be absorbing costs that a functioning institution should have borne, rendering the agent less a saint and more a janitor for a broken system. Conversely, in a perfectly just institution, risky sacrifice might be deemed reckless rather than virtuous.

  Defend **one** of the following three positions:
  **(A)** Supererogation is entirely relative to institutional failure; in a perfect world, it collapses into either duty or folly.
  **(B)** Supererogation is a matter of personal virtue regardless of institutional context; the agent's motive outweighs systemic conditions.
  **(C)** Institutional context changes the *kind* of praise an act recieves without changing the moral *status* of the act itself.

  Your essay must explicitly address and rebut (or accommodate) the following two objections:
  1.  **The Moral Residue Objection:** Argues that Position (A) unfairly reduces saints to system janitors, stripping agency of meaning.
  2.  **The Cost-Internalization Problem:** Argues that Position (B) ignores that institutions exist precisely to distribute burdens fairly, making individual sacrifice a normative failure.

  ***

  **MODEL ANSWER (Position C)**

  The debate over supererogation often stalls on whether an act is obligatory or optional. However, framing the issue through the Institutional Residue Problem reveals that the *context* of the act is as morally significant as the act itself. I will defend Position (C): institutional context changes the kind of praise an act receives without changing the moral status of the act itself. This hybrid view preserves the agent's virtue while acknowledging the systemic implications of relying on heroism.

  To begin, we must distinguish between moral status (the deontic classification of an act) and moral praise (the aretaic evaluation of the agent). Position (A) argues that in a perfect institution, diving into a frozen lake to save a stranger is either duty (if lifeguards are absent) or folly (if safety protocols are perfect). Position (B) argues the dive is always saintly. Position (C) suggests the act remains supererogatory in status—it is never obligatory—but the *nature* of the virtue shifts. In a broken system, the agent displays civic repair; in a perfect system, they display raw benevolence. The act remains optional, but the social meaning fluctuates.

  The primary strength of (C) is its ability to navigate the Cost-Internalization Problem. This objection posits that Position (B) ignores the purpose of institutions, which is to distribute burdens fairly. If we glorify individual sacrifice regardless of context, we incentivize systems to offload responsibilities onto volunteers. By adopting (C), we acknowledge that while the saver is virtuous, the praise offered should differ based on context. In a failed system, praise should be coupled with political critique; we honor the savior while condemning the lack of safety barriers. In a perfect system, praise is pure. This prevents the normalization of sacrifice as a substitute for justice. We do not deny the virtue of the agent (as (A) might), but we refuse to let their virtue mask institutional negligence.

  However, critics levy the Moral Residue Objection against this nuanced view, arguing that Position (C) still risks reducing saints to system janitors. If the praise is contingent on institutional failure, does the agent's worth fluctuate with the bureaucracy? This objection claims that making praise contextual strips the act of its intrinsic nobility. To rebut this, we must clarify that "kind of praise" does not mean "amount of worth." Recognizing an act as "janitorial" in a broken system does not diminish the courage required; it simply relocates the source of the necessity. The agent is still choosing to bear a cost they could omit. The "residue" is not on the agent, but on the system. Therefore, the saint is not reduced to a janitor; rather, the system is exposed as requiring janitors where it should have had engineers. The agent's moral status remains high because the choice to absorb the cost was still free.

  Furthermore, Position (C) avoids the collapse problem of (A). If supererogation collapses into duty in a perfect world, we lose the category of the "gift." Even in a perfectly managed society, unexpected crises occur where protocols fail. A lifeguard may be present, but a civilian diving in still offers a surplus of care that duty does not demand. By maintaining that the status remains supererogatory, (C) preserves the space for grace within justice. It acknowledges that institutions can manage risk, but they cannot mandate love.

  Finally, this framework solves the tension between individual agency and collective responsibility. Position (B) risks moral libertarianism, where the hero is absolved of checking whether their sacrifice enables negligence. Position (A) risks moral nihilism, where the hero is told their act was unnecessary had the state functioned. Position (C) allows us to say: "You did good, but the world should not have required you to do it." This dual assertion protects the agent from the Cost-Internalization Problem while satisfying the Moral Residue Objection by affirming the act's intrinsic value regardless of systemic backdrop.

  In conclusion, supererogation cannot be viewed in a vacuum. By separating moral status from the type of praise offered, we can honor the hero without excusing the system. This ensures that virtue is celebrated not as a patch for broken institutions, but as a surplus of good that persists even when institutions work.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **1. Thesis Clarity & Position Selection (5 Marks)**
  *   **Criteria:** Clearly selects A, B, or C and defines the distinction between status and praise (if C) or duty/folly (if A/B).
  *   **Typical Failure:** Vague hedging ("Both sides have points") without committing to a defendable stance.

  **2. Primary Argument Construction (5 Marks)**
  *   **Criteria:** Provides a coherent normative argument for why the selected position holds, beyond mere definition.
  *   **Typical Failure:** Restating the prompt's description of the position without adding original justification.

  **3. Engagement with Moral Residue Objection (5 Marks)**
  *   **Criteria:** Explicitly names the objection and offers a rebuttal or accommodation regarding the "janitor" critique.
  *   **Typical Failure:** Confusing this with the Cost-Internalization problem or dismissing it without argument.

  **4. Engagement with Cost-Internalization Problem (5 Marks)**
  *   **Criteria:** Explicitly addresses how institutions distribute burdens and why the chosen position accounts for this fairness.
  *   **Typical Failure:** Ignoring the institutional aspect entirely and focusing only on individual psychology.

  **5. Coherence & Philosophical Rigor (5 Marks)**
  *   **Criteria:** Logical flow, precise terminology, and conclusion that synthesizes the arguments rather than summarizing.
  *   **Typical Failure:** Contradicting the thesis in the conclusion or using colloquial language inappropriate for seminary-level work.

  **Grading Note:** Students who merely define supererogation as "going beyond the call of duty" without engaging the institutional framing cannot score higher than 15/25 (C), regardless of writing quality.
