      *   *Careenium:* The physical system (ants moving, pucks sliding).
      *   *Simmballs:* The high-level symbols (representing thoughts, concepts).
      *   *The Tension:* Do high-level patterns (symbols) cause things to happen, or is everything just low-level physics?
