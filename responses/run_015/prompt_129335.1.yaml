  *(Self-Correction Note during final review)*: Make sure Reed's "outcome-sensitive relaxation" doesn't sound like lying. It needs to sound like a philosophical reinterpretation of the premises in light of the collective will. He argues that normative premises (B) are sensitive to the collective decision to act.

  8.  **Final Polish:** Check flow and pacing. (Proceeds to generate output).

