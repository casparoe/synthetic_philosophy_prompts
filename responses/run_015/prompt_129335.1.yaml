      *   *The Dilemma:* List & Pettit reference. Okonkwo: We must drop anonymity for consistency. Reed: We must drop systematicity for legitimacy.
      *   *Risk:* Okonkwo: Your relaxation is post-hoc rationalization. Reed: Your derivation is technocratic override.
