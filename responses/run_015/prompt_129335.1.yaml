      *   *Okonkwo's Stance (Epistemic/Truth-Tracking):* Group rationality requires logical consistency derived from the best available evidence. Expertise matters (confidence weighting). If the logic says "No" based on premises, the conclusion must be "No," even if more people want "Yes." This aligns with the "Premise-Based Procedure" (PBP).
      *   *Reed's Stance (Democratic/Will-Tracking):* Legitimacy comes from the collective will on the action. If the majority says "Yes" to the trial, the reasoning should support that. Forcing a "No" based on technical premises undermines the council's authority. This aligns with the "Conclusion-Based Procedure" (CBP), but with a twist ("outcome-sensitive relaxation" of premises to maintain *ex post* coherence).
      *   *List & Pettit's Impossibility Theorem:* You can't have Universal Domain, Anonymity, Systematicity, and Consistency all at once. Okonkwo sacrifices Anonymity (via weighting) to keep Consistency and Systematicity. Reed sacrifices Systematicity (by adjusting premises to fit the conclusion) to keep Anonymity (majority rule on C) and Consistency (retroactively).

