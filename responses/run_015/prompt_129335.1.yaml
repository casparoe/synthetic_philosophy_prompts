      *   **Positions:**
          *   **Okonkwo:** Premise-based aggregation (PBA) with "vertical coherence." Uses weighted epistemic confidence scores for (A) and (B), then derives (C) logically. Accepts (C) might contradict a direct majority vote on (C).
          *   **Reed:** Conclusion-based aggregation (CBA) with "horizontal coherence." Prioritizes direct majority on (C). If (C) conflicts with aggregated premises, relax/adjust premises ("outcome-sensitive relaxation").
      *   **Requirements:**
          *   Familiarity with the Discursive Dilemma (Doctrinal Paradox).
