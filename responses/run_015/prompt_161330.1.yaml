answer: |-
  In 1893, the US National Bureau of Standards adopts the Weston Cell as the legal standard for electromotive force, introducing the term 'volt' via the baptism: "Let 'one volt' designate the actual EMF of Cell C at 20°C," while simultaneously asserting the sentence "The EMF of Cell C is one volt." Decades later, following the 1990 international consensus, the laboratory adopts the Josephson effect for voltage realization, re-fixing the reference of 'volt' to a specific fixed value of the Josephson constant ($K_{J-90}$), calibrated such that the magnitude designated remains extensionally identical to the original Weston EMF, and the technicians now assert the same sentence, "The EMF of Cell C is one volt," based on Kibble balance measurements confirming the cell's alignment with the constant.

  ### Show the Work

  **The Sentence and Terms**
  *   **Sentence:** "The EMF of Cell C is one volt."
  *   **Terms:**
      *   'Cell C': A rigid designator (picks out the same physical artifact in all possible worlds).
      *   'One volt':
          *   At $T_1$: A rigid designator introduced by a reference-fixing description ("the actual EMF of C").
          *   At $T_2$: A rigid designator introduced by a theoretical constant ("the magnitude defined by $K_{J-90}$").

  **Modal and Epistemic Verdicts**
  *   **At $T_1$ (Contingent *A Priori*):** Following Kripke's analysis of the Standard Meter, 'volt' rigidly designates the EMF C *actually* possesses. In a counterfactual world where C degrades, C does not possess that EMF, so the sentence is false (Contingent). However, because the reference was fixed by C, we require no empirical measurement to know the sentence is true in the actual world (*A Priori*).
  *   **At $T_2$ (Necessary *A Posteriori*):** 'Volt' now rigidly designates a theoretical magnitude $M$ independent of C. 'The EMF of Cell C' rigidly designates the magnitude $M'$ C actually possesses. Since the community has calibrated the constant to preserve the referent, $M = M'$. The sentence expresses an identity between two rigid designators ($M' = M$), which is true in all possible worlds where the terms refer (Necessary). However, establishing that the artifact C aligns with the theoretical constant $K_{J-90}$ requires empirical measurement (*A Posteriori*).

  **The Single Feature Doing the Work**
  The flip is generated by the **shift from a reference-fixing description to an independent rigid designator**. At $T_1$, the description ("EMF of C") fixes the reference but does not give the meaning (synonymy); at $T_2$, the term is semantically detached from C and attached to a constant, turning the sentence from a stipulation into an empirical identity.
  *   **If Removed:** If 'volt' remained a reference-fixing description at $T_2$ (i.e., defined *only* as "the EMF of C"), the sentence would remain Contingent *A Priori*. If 'volt' were an ordinary definite description used attributively (e.g., "the standard unit"), the sentence would be Contingent *A Posteriori* at both stages.

  **The Description Theorist's Objection**
  A defender of the description theory (Frege/Russell) would argue that the *sense* of 'volt' changed between $T_1$ and $T_2$ (from "EMF of C" to "Josephson magnitude"). Therefore, the sentence expresses two different propositions; the modal status didn't flip, the meaning did.
  *   **The Cost:** This reply sacrifices **reference continuity**. It cannot explain the metrological intuition that we are measuring the *same quantity* across the transition. If the meaning changed entirely, the claim "We preserved the volt" becomes false; we merely replaced one unit with another coincidentally similar one. The rigid designation account preserves the referent (the magnitude) while explaining the epistemic shift.

  **Approximate Preservation (The SI Redefinition)**
  In the 2019 SI redefinition of the kilogram, the referent was *not* held perfectly fixed; the Planck-constant kilogram diverges slightly from the mass of the IPK artifact. In this case, the sentence "The IPK is one kilogram" becomes **false** (or contingent false). The modal flip dissolves because the identity $M_{IPK} = M_{kg}$ does not hold. The necessary *a posteriori* status applies only to the relation between the constant and the *new* definition, not the artifact. This highlights that the "flip" scenario requires an idealization of exact reference preservation, which is practically asymptotic but philosophically distinct from the messy reality of standard drift.
