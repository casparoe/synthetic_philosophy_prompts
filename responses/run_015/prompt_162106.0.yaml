          *   *Verdict:* Fatal if one accepts a no-count view (e.g., certain interpretations of quantum mechanics or gunky time). It survives only if one assumes a discrete countable ontology.

      *   **4. Current Evidence (Cosmology, Fermi, Simulation):**
