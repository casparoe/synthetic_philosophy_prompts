prompt: |-
  Hey — I want you to act as a philosopher of physics, the kind who has actually argued about substantivalism in a conference hallway and has opinions. Take your time and think carefully; before you give me anything structured, do a short brainstorm paragraph where you say what you take to be the load-bearing premise of the whole thing, because I think rankings that skip that step come out mushy.

  So: I'm putting together an opinionated handout for a tiny reading group on the hole argument and I want a ranking, not a survey. Please don't give me citations or a bibliography or names to look up — I want your own take, reasoned from scratch, using only what's in this message. I've been staring at this to long and I keep flip-flopping.

  Recap, just so we're using the same version (if you know it, skim): take a solution of the Einstein field equations, pick a region H where the stress-energy vanishes, and consider an active diffeomorphism that is the identity everywhere outside H but nontrivial inside. The dragged-along fields give you a second solution that agrees with the first everywhere outside H and disagrees inside it. If manifold points have their identity independently of the fields, and if the two models can therefore represent distinct physical possibilities, then nothing outside H fixes what happens inside H — and you can run the same move around essentially any point, so the theory looks radically indeterministic, or the point-identity looks physically empty. I've been thinking of there being three premises you can give up: (i) that spacetime points have primitive, field-independent identity; (ii) that isomorphic-but-nonidentical models can still represent distinct possibilities; (iii) that this kind of determinism is something a good theory owes us.

  Here are the responses I want ranked. One line each, and if you don't recognize one just work from my description:

  1. Relationalism: no spacetime points over and above the fields and their relations, so the two models just are the same possibility.
  2. Sophisticated substantivalism / anti-haecceitism about points: points are real, but permuted models don't ground distinct possibilities, because a point's identity isn't brute.
  3. Bite the bullet: yes, substantivalism plus GR gives you radical indeterminism — so much the worse for substantivalism.
  4. The gauge move: the dragged-along structure isn't really a second model at all, it's the same model described differently, so the argument equivocates between active and passive diffeomorphisms.
  5. Supersubstantivalism: identify spacetime with the metric field (or whatever structure does the real work) rather than with a bare manifold — no leftover point identity to exploit.
  6. Ontic structural realism: only the common structure of the diffeomorphic models is real; points are just positions in a structure.
  7. The dynamical/Cauchy reply: take the initial-value formulation as primary — the 3+1 problem determines the geometry up to diffeomorphism and that is all the determinism anyone was ever entitled to; the 4D block talk is where the pseudo-problem came from.

  Now the wrinkle, which is the actual reason I'm asking you and not just reading the literature: I've been playing with a discretized version and I want to know which of these responses are hostage to the continuum. Suppose spacetime is not a smooth manifold but a large finite set of elementary events with just an order/adjacency structure on it (a causal set, or really any such graph), and suppose the dynamics is symmetric under the automorphisms of that structure. Now there is no smooth diffeomorphism to drag fields around with — and as far as I can tell the automorphism group of a typical such structure is trivial, so the hole move might simply be unavailable, in which case the responses that were bought to solve the hole problem were solving a problem the discrete theory never had. But you can also run it the other way: the labels on the events had better be pure gauge, or the theory is secretly committed to which event is which, and then permutation invariance gives you back something hole-argument-shaped, except now it's about relabelings rather than smooth maps. I think that's the interesting case and I don't know what it does to the ranking.

  So here's the deliverable. For each of the seven: name which of the three premises it gives up (or none); give it a 0–10 for how well it survives translation into that discrete, permutation-invariance setting; give it a second 0–10 for how cheap it is elsewhere — how much collateral damage it does, e.g. does it drag you into saying things you'd rather not say about haecceitism for ordinary objects or for indistinguishable particles, or does it quietly make the success of ordinary GR practice look like a miracle. Then put them in tiers, S / A / B / F, and give one sentence per response saying why it landed where it did. Commit to actual numbers, please — no it-depends mush, no averaging to a 5 across the board. Finish with two lines: which one you'd actually defend if cornered, and which one you think is the most overrated. If the discrete wrinkle makes you want to add an eighth response that isn't on my list, add it and score it too.
