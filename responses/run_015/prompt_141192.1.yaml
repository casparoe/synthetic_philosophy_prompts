answer: |-
  You are circling a real phenomenon, and you are right to be frustrated. The "religious vs. secular" axis is a red herring. It describes the *packaging* of the argument, not its *structure* or its *epistemic weight*.

  The established concept you are looking for is **"Comprehensive Doctrine,"** but the specific dynamic you are identifying—the way the *same* argument is treated differently based on its source tag—is best described as **"Asymmetric Scrutiny."**

  Here is my commitment: The thing doing the work in these fights is not whether a reason is religious. It is **Asymmetric Scrutiny of Comprehensive Doctrines.**

  ### 1. The Category: Comprehensive Doctrine
  You noticed that the secular argument about "rational self-conscious agency" functions exactly like the religious argument about "scripture." Both rest on foundational premises that cannot be proven within the argument itself; they must be accepted on faith (either religious faith or philosophical faith).

  In political philosophy (specifically in the work of John Rawls), this is called a **Comprehensive Doctrine**. A comprehensive doctrine is any system of belief that covers all major aspects of human life (what is valuable, what a person is, what the purpose of society is).
  *   **Religion** is a comprehensive doctrine.
  *   **Kantianism, Utilitarianism, and certain strains of Liberalism** are *also* comprehensive doctrines.
  *   **"Science"** (when used as a moral arbiter rather than a methodological tool) often functions as one.

  Rawls argued that in a pluralistic society, we shouldn't base coercive laws on *any* comprehensive doctrine because not everyone shares them. He wanted "Public Reason"—reasons accessible to all.

  **Where the theory fails:** In practice, society treats secular comprehensive doctrines (like liberal individualism or scientific materialism) as "neutral" or "default," while treating religious comprehensive doctrines as "sectarian" or "private."

  ### 2. The Mechanism: Asymmetric Scrutiny
  This is the specific pattern you noticed: *Say the quiet part out loud and you're a theocrat; keep it to yourself and you're a model citizen.*

  This is **Asymmetric Scrutiny**. It occurs when two arguments with identical logical structures are subjected to different levels of epistemic demand based solely on the cultural provenance of their premises.

  *   **The Secular Default:** When a premise comes from a dominant secular tradition (e.g., "individual autonomy is the highest good"), it is treated as **Background Noise**. It is invisible. It is assumed to be "just rational." No one asks you to justify *why* autonomy matters; it is the water we swim in.
  *   **The Religious Mark:** When a premise comes from a religious tradition (e.g., "humans are made in God's image"), it is treated as **Foreground Noise**. It is hyper-visible. It is assumed to be "just faith." You are immediately asked to justify *why* that matters, often with the implicit demand that you translate it into the Secular Default to be heard.

  The "flip" you observed happens because mentioning the source triggers the scrutiny protocol. If you hide the source, the listener assumes the premise belongs to the Secular Default and lets it pass. If you reveal the source, the listener recognizes it as outside the Default and demands a "translation" that often isn't required of secular dogmas.

  ### 3. Why "Public Reason" Doesn't Help You
  You mentioned you've read the Wikipedia version of Public Reason. The problem is that Public Reason relies on an **Accessibility Condition**. It says reasons must be "accessible" to all citizens.

  Theoretically, this sounds fair. Practically, "accessibility" is defined by the dominant culture.
  *   A secular philosophical premise is deemed "accessible" because the people setting the rules already accept it.
  *   A religious premise is deemed "inaccessible" because the people setting the rules do not accept it.

  So, when you are told your religious reason isn't "public," what is actually being said is: *"Your premise is not part of our shared Secular Default."* It is a boundary-marking exercise, not an epistemic one.

  ### 4. My Judgment vs. The Field
  **What the field says:** Political philosophers (like Nicholas Wolterstorff or Paul Weithman) call this the **"Secularist Bias of Public Reason."** They argue that Rawls unfairly excluded religious reasons while allowing secular comprehensive doctrines to slide through.

  **My Judgment:** I think "Secularist Bias" is too political. It sounds like a conspiracy. **"Asymmetric Scrutiny"** is more precise. It captures the *epistemic unfairness* without necessarily implying malicious intent. It explains why a well-meaning secular parent and a well-meaning religious parent can have the same concern, but only one is asked to "leave their religion at the door." The secular parent isn't asked to leave their *secularism* at the door because their secularism is invisible to the committee.

  ### 5. How to Use This Term
  When you are in a school board meeting or a debate:
  1.  **Identify the Comprehensive Doctrine:** Point out that the opposing argument rests on a foundational premise (e.g., "maximizing choice," "scientific consensus," "historical progress") that is not universally shared.
  2.  **Call for Symmetric Scrutiny:** Do not demand they stop using the premise. Demand that their premise be subjected to the *same* level of justification as yours.
      *   *Example:* "If I am required to translate 'God says X' into 'Public Good Y,' then you must translate 'Autonomy is Z' into 'Public Good Y.' We cannot treat your foundational axiom as neutral and mine as sectarian."

  ### 6. What Would Show I'm Wrong? (Falsification)
  I am committing to the claim that the core issue is **Asymmetric Scrutiny of Comprehensive Doctrines**, not the religious content itself.

  **This account is wrong if:**
  You find a case where a religious argument is accepted *without* translation into secular terms, while a secular argument is rejected *because* it rests on unshared philosophical premises.

  *   *Example:* If a school board accepts a policy solely because "The Bible says so" without anyone demanding a secular public reason, *and* simultaneously rejects a policy based on "Kantian dignity" because "not everyone accepts Kant," then the axis is truly Religious/Secular, and my claim about Asymmetric Scrutiny is false.
  *   *Alternatively:* If you find that religious arguments are consistently rejected *even when* they are perfectly translated into secular terms (e.g., "We oppose this because it harms children," backed by scripture but argued entirely on harm), while secular arguments are accepted on thin premises, then the issue is not scrutiny, but **outcome bias** (they just disagree with you).

  In my experience, the former rarely happens (religious reasons are rarely accepted bare), and the latter happens often (secular reasons get a pass). This supports the Asymmetric Scrutiny model.

  ### Summary
  *   **The Noun:** Comprehensive Doctrine (applies to both religion and secular philosophies).
  *   **The Dimension:** Premise Shareability (how many people accept the foundation without conversion).
  *   **The Phenomenon:** Asymmetric Scrutiny (the social mechanism that flags one and ignores the other).
  *   **The Term to Use:** **"Asymmetric Scrutiny."**

  You are not tripping over theology. You are tripping over the invisible walls of the Secular Default. Naming the asymmetry is the only way to level the floor.
