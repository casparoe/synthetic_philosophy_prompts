answer: |-
  **Memorandum to the Teaching Committee**

  **Subject:** Audit of the Aviation Autopilot Analogy Regarding AI-Assisted Drafting

  **Introduction**
  The proposal to permit generative AI for initial essay drafting, safeguarded by closed-book syntheses and oral defenses, relies heavily on the "aviation autopilot" analogy. Proponents argue that just as pilots use autopilot for routine cruising while maintaining manual competence through simulators and periodic takeovers, students can use AI for routine drafting while maintaining understanding through unassisted assessments.

  While this comparison offers an intuitive model for human-machine collaboration, it obscures critical differences between psychomotor control (flying) and epistemic construction (learning). The following audit maps the analogy, identifies where the mapping breaks down regarding the erosion of understanding, and assesses whether the permissive policy conclusion is warranted.

  ### 1. Correspondence Table: Aviation vs. Academic AI Policy

  | Component | Aviation Case (The Model) | Academic Case (The Proposal) |
  | :--- | :--- | :--- |
  | **Agent** | Pilot | Undergraduate Student |
  | **Automated System** | Flight Management System (Autopilot) | Generative AI (LLM) |
  | **Task Offloaded** | Routine stabilization, navigation, cruising | Drafting, synthesizing, structuring arguments |
  | **Retained Competence** | Manual flying skills, situational awareness, decision-making | Subject mastery, critical analysis, argumentation logic |
  | **Safeguard** | Simulator training, manual takeoffs/landings, system alarms | Closed-book exams, oral defenses, citation checks |
  | **Goal of Automation** | Reduce fatigue, increase precision, manage complexity | Reduce friction, increase output, manage writer's block |
  | **Failure Mode** | System disengagement, physical deviation from path | Hallucination, logical drift, superficial analysis |

  ### 2. Critical Disanalogies
  The analogy holds only at the abstract level of "human supervising machine." It fails when examining *how* competence is built and maintained. The following disanalogies are not incidental; they strike at the core of whether understanding is preserved.

  #### A. Separability of Routine Performance from Underlying Competence
  *   **Aviation:** Cruising is distinct from takeoff and landing. A pilot can engage autopilot *after* manually establishing the flight path. The cognitive load of cruising is largely monitoring, not creation.
  *   **Academia:** In writing, "drafting" is not a routine task distinct from thinking; it is the primary mechanism by which thinking occurs. The struggle to formulate a sentence is often where conceptual clarity is achieved.
  *   **Epistemic Impact:** Offloading drafting offloads the cognitive labor where understanding is constructed. Unlike the pilot who sets the course before engaging autopilot, the student using AI for an *initial draft* often allows the machine to set the conceptual course. This creates epistemic dependence at the formulation stage, not just the execution stage.

  #### B. Transparency and Inspectability
  *   **Aviation:** Autopilot systems are deterministic. If the plane banks, the pilot knows the command was issued. System logs are auditable.
  *   **Academia:** Generative AI is probabilistic and opaque (a "black box"). It does not reveal *why* it selected a specific argument or source.
  *   **Epistemic Impact:** A pilot can verify the autopilot's action against their instruments. A student cannot easily verify the AI's reasoning without already possessing the expertise the assignment is meant to build. This creates a "competence illusion," where the student accepts a coherent-sounding argument they do not actually understand.

  #### C. Ease of Detecting Automation Failure
  *   **Aviation:** Autopilot failure is usually immediate and salient (alarms, physical deviation). The environment provides immediate physical feedback.
  *   **Academia:** AI failure (hallucination, subtle logical fallacy, bias) is often silent and semantically plausible.
  *   **Epistemic Impact:** To detect an AI error in an essay, the student must already know the material better than the AI. If they possess that knowledge, they need less AI assistance; if they lack it, they cannot reliably audit the output. The safeguard of "checking the output" assumes a level of mastery that the automation is preventing the student from acquiring.

  #### D. Reassuming Manual Control Without Loss
  *   **Aviation:** Pilots practice manual flying regularly. The skill is psychomotor and degrades slowly if maintained. Switching off autopilot is instantaneous.
  *   **Academia:** Writing and critical thinking are cognitive skills that atrophy rapidly without practice ("use it or lose it").
  *   **Epistemic Impact:** If a student relies on AI for all drafting, their "manual" writing muscle weakens. When faced with a closed-book synthesis or oral defense, they cannot simply "switch off" the AI; they must generate the work from a degraded baseline. The safeguards (exams) become high-stakes hurdles rather than integrated checks, measuring residual knowledge rather than active competence.

  ### 3. Assessment of the Permissive Conclusion
  The permissive conclusion depends on the assumption that **understanding is a state** that can be verified at discrete intervals (exams/defense), rather than **a process** that must be continually enacted.

  In aviation, the autopilot preserves the pilot's energy for high-stakes moments. In education, the "routine" work (drafting) *is* the training. By treating drafting as "cruising," the proposal misidentifies the locus of learning. The safeguards proposed (closed-book work) measure the *product* of understanding at a specific moment, but they do not protect the *process* of building that understanding over the semester.

  Consequently, the "light-touch" safeguard model is insufficient. It assumes that because a student can defend an essay orally, they developed the understanding necessary to write it. However, a student can memorize an AI-generated argument for an oral defense without ever having grappled with the logic themselves. The autopilot analogy masks the risk that the student becomes a passenger in their own education, capable of describing the flight path but unable to fly the plane.

  ### 4. A More Illuminating Analogy: GPS Navigation
  A more accurate analogy for the epistemic risks of AI drafting is **GPS-assisted navigation** versus **map reading**.

  *   **The Mapping:**
      *   **Pilot/Driver:** Student.
      *   **Autopilot/AI:** GPS Voice Navigation.
      *   **Manual Flying/Map Reading:** Cognitive mapping of the subject matter.
      *   **Safeguard:** Being asked to draw the map from memory later.

  *   **Why it fits better:**
      Research on navigation shows that reliance on GPS degrades the brain's ability to build cognitive maps (spatial understanding). Drivers arrive at the destination (complete the essay) but retain little knowledge of the route (the argument's structure).
      *   **Failure Detection:** If the GPS loses signal, the driver is often more lost than if they had never used it, because they never paid attention to landmarks. Similarly, if a student cannot access AI during a closed-book exam, they are often less capable than if they had never used it, because they did not internalize the "landmarks" of the discipline.
      *   **Policy Implication:** We do not ban GPS, but driving schools require learners to demonstrate map-reading skills *before* relying on navigation. Similarly, students should demonstrate manual drafting competence *before* being permitted to offload the process.

  ### Recommendation
  The autopilot analogy is seductive but dangerous in this context. It treats writing as a transport mechanism for ideas rather than the engine that generates them. The committee should reject the "light-touch" interpretation of this analogy. If AI drafting is permitted, the safeguards cannot be merely summative (exams at the end); they must be formative (requiring evidence of the *process* of thinking, such as annotated drafts or in-class writing that mirrors the take-home work). The goal must be to ensure the student remains the pilot, not merely the passenger who can recite the flight plan.
