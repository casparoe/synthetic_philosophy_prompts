answer: |-
  This is a sophisticated position, but it is currently over-constrained. You are trying to hold three mutually exclusive commitments: strict lexicality, real-valued expected utility, and the intuition that long-term moderate suffering can outweigh brief agony.

  Here is the audit, ranked by severity, followed by the single revision that fixes the most damage, and finally, advice on what to defend openly.

  ### 1. The Severity Ranking

  **Severity 1: The Mathematical Trilemma (Claims 1, 5, and 6)**
  *   **The Tension:** You cannot simultaneously hold (1) strict lexical dominance, (5) real-number expected utility, and (6) the verdict that 40 years of moderate pain outweighs one brief agony.
      *   If (1) is true in the standard philosophical sense, an above-threshold episode has *infinite* (or lexicographically superior) disvalue compared to sub-threshold goods/bads. Therefore, no finite sum of moderate pain (6) can ever outweigh it.
      *   If (5) is true, you are working within the Archimedean field of real numbers. Lexical priorities are mathematically impossible here; any two real numbers are commensurable.
      *   If (6) is true (which it must be for your view to be distinct from hard lexical NU), then (1) is false as stated.
  *   **What Gives:** Claim (1) must be softened. You are not a *Lexical* Threshold Negative Utilitarian; you are a *Prioritarian* with a steep discontinuity in the marginal disvalue function.
  *   **Repair Cost:** You lose the "trump card" rhetoric of lexicality. You must admit that in principle, enough mild headaches *could* outweigh an agony, even if that number is astronomically high in practice.

  **Severity 2: The Metaphysical Clash (Claims 2 and 4)**
  *   **The Tension:** Claim (4) says badness supervenes on the *intrinsic character* of the experience. Claim (2) says the threshold is determined by the *range of capacities* of the subject.
      *   "Taking up 90% of my range" is a relational property, not an intrinsic one. A pain qualia that is 9/10 for a rat might be 2/10 for a human. If value is intrinsic (4), these should be valued similarly (if qualia are similar). If value is range-relative (2), they are valued differently.
      *   Your animal welfare scientist will spot this immediately. If you keep (4), (2) becomes incoherent. If you keep (2), (4) is false.
  *   **What Gives:** Claim (4).
  *   **Repair Cost:** You abandon internalism about value. You must argue that the *badness* of pain is partly constituted by its relation to the subject's other capacities (a form of contextualism). This is actually a stronger position for animal welfare, but it requires metaphysical defense.

  **Severity 3: The Continuity Objection (Claim 1)**
  *   **The Tension:** As you anticipated, critics will argue that phenomenological intensity is a continuous dimension, so value cannot jump discontinuously.
  *   **What Gives:** This is less a contradiction and more a challenge to your ontology.
  *   **Repair Cost:** Minimal, provided you have the right reply (see below).

  **Severity 4: Episodic vs. Aggregative (Claims 3 and 7)**
  *   **The Tension:** This looks like a tension but is actually consistent *if* you fix Severity 1.
      *   (3) says sub-threshold pains don't *become* lexical (they don't trigger the emergency veto).
      *   (7) says above-threshold pains aggregate linearly (1 agony < 2 agonies).
      *   This works fine provided the "lexical" jump is actually just a steep slope (fixing Severity 1).
  *   **Verdict:** No repair needed, but requires clear wording to distinguish "triggering the threshold" from "summing total disvalue."

  ---

  ### 2. The Single Revision

  **Replace Claim (1) with "Steep Prioritarianism."**

  Do not call it "lexical." The term "lexical" commits you to non-Archimedean value structures, which forces you to abandon (5) (real numbers) or (6) (aggregation of moderate pain).

  **The Revision:**
  > "(1) The marginal disvalue of suffering is a continuous but extremely steep function of intensity. There is a 'threshold' region where the disvalue curve becomes nearly vertical, such that for all *practical* decision-making under uncertainty, an above-threshold episode dominates sub-threshold goods. However, theoretically, a sufficiently large quantity of sub-threshold suffering can outweigh a brief episode of above-threshold suffering."

  **Why this cleans up the set:**
  1.  **Saves (5):** You can now use real numbers and expected utility without mathematical incoherence.
  2.  **Saves (6):** It allows 40 years of moderate pain to mathematically exceed 1 minute of agony, preserving your core intuition.
  3.  **Saves (7):** Aggregation within the high-intensity domain remains linear (or near-linear).
  4.  **Defuses the Continuity Objection:** If the function is continuous (just steep), the "jump" objection vanishes. It becomes a Sorites problem, not a discontinuity problem.

  ---

  ### 3. Pre-empting the Continuity Objection

  Since you want to get ahead of the "continuous dimension" objection, do not argue that phenomenology is discrete (neuroscience might prove you wrong). Instead, argue for **Vagueness as a Feature**.

  **The Reply:**
  "The threshold is not a sharp line in nature, but a *precisification* for the sake of decision theory. Just as 'bald' has no precise hair count but we can still legislate based on a definition, the 'agony threshold' is a focal point for policy. The moral reality is vague, but our decision procedure requires a cutoff. The steepness of the curve captures the moral urgency without requiring a metaphysical cliff."

  Alternatively, lean on **Attentional Capture**:
  "Phenomenological intensity feels continuous, but the *functional* impact of pain (attentional capture, inability to pursue other goods) is discontinuous. Once pain captures 100% of attention, you have crossed a functional threshold, even if the qualia intensity scale is continuous."

  ---

  ### 4. What to Bite (Openly Defend)

  Do not try to smooth over these. Present them as deliberate features of your view that solve specific problems.

  **Bullet 1: Claim (2) — Range-Relativity (Drop Claim 4)**
  *   **Why:** This is your strongest selling point for the animal welfare scientist. If you defend (4) (Intrinsicism), you are vulnerable to the charge that you are privileging human neurology.
  *   **The Bite:** "I explicitly reject Intrinsic Supervenience (4). The badness of pain is relational to the subject's capacity. A rat's maximum pain is morally equivalent to a human's maximum pain because it represents the same *destruction of that subject's welfare space*, even if the nociceptive firing rates differ. This avoids speciesism."
  *   **Risk:** Some philosophers hate relational value. But it's better to own it than be caught contradicting (4).

  **Bullet 2: The "Practical Lexicality" of Claim (1)**
  *   **Why:** You need to explain why you used the word "lexical" in your private notes if you're changing it for the paper.
  *   **The Bite:** "I use 'lexical' pragmatically, not mathematically. In any finite decision context with realistic probabilities, the expected disvalue of agony swamps sub-threshold goods. I am willing to accept that in 'God's eye' view, they are commensurable, but for *human* ethics, they function as lexical."
  *   **Risk:** Purists will call this a category error. Counter by emphasizing Claim (5): you are building a *policy tool*, not a metaphysical system.

  ### Summary of Recommended Changes for the Paper

  1.  **Rename the view:** "Range-Relative Threshold Prioritarianism" (drop "Lexical" and "Negative Utilitarianism" if you allow trade-offs with goods below the threshold).
  2.  **Delete Claim (4):** It contradicts (2). Replace with: "Badness supervenes on the experience *and* the subject's capacity range."
  3.  **Rewrite Claim (1):** Change "lexically dominates" to "disvalued at a rate that creates a *practical* priority."
  4.  **Keep Claims (3), (6), (7):** These are your strongest intuitive anchors.
  5.  **Keep Claim (5):** This is your methodological constraint; it justifies the revision to (1).

  By making these shifts, you move from a view that is mathematically broken and metaphysically contradictory to one that is technically coherent, empirically sensitive (for the scientist), and retains your core moral intuitions.
