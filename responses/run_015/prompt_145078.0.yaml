answer: |-
  Consider a finite research consortium, $\mathcal{C}$, comprising three climatologists who maintain a shared, auditable database of all verified empirical claims. Let $p$ denote a specific atmospheric phenomenon that is objectively true but, due to a temporary procedural delay, not yet accessible to any member, thereby rendering the proposition $q$ (' $p$ is true and $\mathcal{C}$ does not know $p$' ) currently true. The consortium's protocol ensures that the collective epistemic state is itself an object of inquiry, such that members can come to know that $p$ remains unestablished. Within this framework, the unrestricted knowability theorist accepts that $q$ is possibly known and that knowledge closes over conjunction for the group; the Fitch-style realist maintains $q$ is necessarily unknown; and the restrictionist contends that while $q$ is knowable, the closure principle does not apply to self-referential attributions of group ignorance. Consequently, if the unrestricted theorist's closure principle holds, verifying $q$ entails $\mathcal{C}$ knows $p$, which contradicts the content of $q$ itself, forcing the conclusion that a specific true proposition cannot be known, thereby violating the knowability principle.

  **Rigorous Check**

  The key propositions are $p$ (the empirical fact), $K_\mathcal{C}p$ (the consortium knows $p$), and the Fitch conjunction $q \equiv p \land \neg K_\mathcal{C}p$. The precise closure rule being applied is the distribution of distributed knowledge over conjunction: $K_\mathcal{C}(\phi \land \psi) \to (K_\mathcal{C}\phi \land K_\mathcal{C}\psi)$. The relevant nearby epistemic worlds include the actual world $w$, where $p$ is true and $\neg K_\mathcal{C}p$ holds, and an accessible world $w'$ where the consortium verifies $q$, such that $K_\mathcal{C}q$ is true. In $w'$, the unrestricted theorist derives $K_\mathcal{C}p \land K_\mathcal{C}\neg K_\mathcal{C}p$; by factivity ($K_\mathcal{C}\phi \to \phi$), this yields $K_\mathcal{C}p \land \neg K_\mathcal{C}p$, a contradiction. Thus, the unrestricted theorist must concede $q$ is unknowable, contradicting the Knowability Principle (KP) that all truths are possibly known. The Fitch-style realist accepts the contradiction implies $q$ is unknowable and therefore rejects KP, maintaining some truths are necessarily unknown. The restrictionist retains KP but denies the closure rule applies when $\psi$ is $\neg K_\mathcal{C}\phi$, allowing $K_\mathcal{C}q$ without entailing $K_\mathcal{C}p$.

  **Analysis of the Structural Feature**

  The feature that does the work is the self-referential loop in distributed epistemic attribution, specifically the embedding of $\neg K_\mathcal{C}p$ within the scope of the group knowledge operator. If this feature is removed by replacing the group with a single isolated agent $a$, the proposition becomes $p \land \neg K_a p$. While the logical contradiction remains identical, the restrictionist defence collapses. For a single rational agent, denying closure over conjunction implies a failure of logical competence or irrationality, which is difficult to motivate. In the consortium case, however, denying closure is plausible because distributed knowledge relies on communication channels and aggregation protocols that may structurally prevent meta-epistemic facts from entailing first-order facts. Without the group structure, the case reverts to the standard Fitch result where KP is simply untenable for any rational agent.

  **The Restrictionist's Defence**

  The restrictionist defends their position by conceding that closure holds for ordinary empirical claims within the consortium but denying its application to propositions about the collective's own knowledge states. They argue that group knowledge is not merely the sum of individual knowledge but a structural property of the collaboration; knowing the group is ignorant does not require transmitting the specific evidence for $p$ to all members, thus avoiding the collapse into $K_\mathcal{C}p$. This saves the knowability principle formally by carving out an exception for self-referential epistemic propositions. However, this arguably relocates the problem rather than solving it, as it requires accepting that the logic of knowability is not uniform across all truth types, limiting the principle's philosophical utility as a general account of truth and knowledge.
