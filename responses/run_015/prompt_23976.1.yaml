answer: |-
  The philosophy of language has long treated slurs as a boundary case, a stress test for semantic theory. When a speaker utters a racial epithet, what exactly have they done? Have they described the world in a toxic way, or have they performed an act of aggression? The debate typically hardens into two camps. Expressivists (or Conventionalists) argue that the derogatory force is encoded in the word's literal meaning; to use the slur is to express contempt, regardless of intent. Associationists (or Contextualists) argue that slurs are semantically neutral terms linked to derogatory stereotypes; the harm arises from the psychological associations activated in context.

  Both camps capture something vital, yet both fail to account for the full phenomenology of slurs. The Expressivist view explains why a non-prejudiced speaker is still culpable but cannot explain reclamation. The Associationist view explains reclamation and context but lets the non-prejudiced bigot off the hook too easily. This is not merely a case for a middle ground; it is a case that the debate itself rests on a false dilemma. The question is not whether the harm is semantic or pragmatic, but whether we understand slurs as tools of description or as instruments of institutional history.

  To see why the Expressivist view is compelling but incomplete, consider the "non-believer" case. If a white person uses the n-word while insisting, "I don't believe Black people are inferior," our moral intuition recoils. Expressivism, championed by philosophers like David Kaplan, explains this neatly: the contempt is part of the conventional meaning, much like the word "damn" encodes a religious attitude. The speaker cannot disavow the contempt any more than they can assert "I am lying" without paradox. The word itself is the vehicle of the harm. However, Expressivism hits a wall with in-group reclamation. If the literal meaning of the slur is "contemptible [group member]," then when a member of that group uses it affectionately (e.g., in hip-hop or camaraderie), they are contradicting themselves. Expressivism must claim reclaimers are speaking ironically or changing the language, but this fails to capture how the word can genuinely function as a term of endearment within the community without semantic schizophrenia.

  Conversely, the Associationist view, associated with philosophers like Christopher Hom, treats the slur as having the same reference as its neutral counterpart but characterizing the target via a harmful stereotype. This handles reclamation beautifully: the group simply strips away the negative stereotype and keeps the reference. It also handles context well; a linguist analyzing the word isn't activating the stereotype, so no harm is done. But Associationism fails the non-believer test. If the harm relies on evoking stereotypes, and I explicitly reject those stereotypes while using the word, Associationism suggests I have done nothing wrong. This contradicts our robust moral intuition that the word is prohibited *simpliciter* for out-group members, regardless of their internal psychology.

  The reason both sides stumble is that they treat slurs as standard propositional tools. They ask, "What truth conditions does this word carry?" or "What mental state does this express?" The real question is: "What social institution does this word invoke?" Slurs are not merely descriptions or expressions; they are *institutional performatives*. They derive their force from a history of systemic oppression and violence. To use a slur is not just to describe a person or express an attitude; it is to attempt to wield the authority of that historical hierarchy.

  This institutional framework resolves the tricky cases where the binary debate fails. Take the non-believer. Why is it wrong for them to use the slur? Not because the semantics are poisoned (Expressivism), nor because they are necessarily activating stereotypes (Associationism). It is wrong because they are attempting to occupy a position of dominance in a hierarchy they do not hold and which is morally illegitimate. They are trying to fire a weapon they have no authority to hold. The harm is in the appropriation of historical power, not just the semantic content.

  Consider the case of quotation, such as a news report or a linguistics paper. Expressivists struggle here: if the word *is* contempt, does quoting it release the contempt? Associationists say no, because the context is neutral. The institutional view agrees with the Associationist outcome but for a deeper reason. When a linguist writes the slur in quotes, they are not invoking the hierarchy of oppression; they are invoking the hierarchy of academic discourse. They are displaying the weapon, not firing it. The institutional context creates a "safety catch" that prevents the historical force from discharging onto a target.

  Finally, consider reclamation. Expressivism says this is impossible without changing the dictionary. Associationism says it is easy, just change the stereotype. The institutional view argues it is difficult but possible because reclamation is a political act, not a semantic one. When an oppressed group reclaims a slur, they are not just changing an association; they are seizing the instrument of their oppression and repurposing it. They have the *authority* to do this because the history belongs to them. An out-group member cannot reclaim the word because they cannot rewrite a history of which they were the oppressors. This explains why reclamation is bounded: it works for the target group precisely because they are the only ones with the standing to alter the institutional force of the term.

  By framing slurs as institutional performatives, we see that the Expressivist/Associationist split is a category error. Expressivism correctly identifies that the force feels inherent, but misidentifies it as semantic rather than historical. Associationism correctly identifies that context matters, but misidentifies the mechanism as psychological rather than political. The harm of a slur is not located in the mind of the speaker or the dictionary definition; it is located in the social world the speaker inhabits.

  We must stop asking whether the poison is in the ink or the intent. The poison is in the history that the ink and the intent together summon. To treat slurs as merely semantic or merely pragmatic is to sanitize them, stripping them of the very weight that makes them dangerous. A robust philosophy of language must acknowledge that some words are not just tools for thinking, but artifacts of power.

  Verdict: false-dilemma
