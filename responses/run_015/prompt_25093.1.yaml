      *   *Wait, check the "doubling" wording:* "55% chance of doubling his money." Does that mean 2x total (100% gain) or profit is 2x? Usually means 2x total. So $b=1$.
      *   *What about the loss side?* He didn't specify the loss magnitude. If he loses 100% on the loss side, Kelly is lower. If he loses 50%, Kelly changes. I should assume a standard risk/reward or point out the missing variable. Let's assume a symmetric loss for the sake of the "doubling" example, or highlight that he likely underestimates the loss tail.
      *   *Actually, a better example for the "blow up" scenario:* If he bets 40%, and has a string of 5 losses (not unlikely in crypto), that's $0.6^5 \approx 0.077$. 92% drawdown. To recover, he needs 12x.

  7.  **Final Structure:**
