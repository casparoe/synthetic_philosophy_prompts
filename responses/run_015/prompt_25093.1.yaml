answer: |-
  You are absolutely right, and your intuition is spot-on. This is one of the most common and dangerous misunderstandings in finance, gambling, and risk management. Your friend is making a category error: he is treating a **multiplicative process** (compounding wealth) as if it were an **additive process** (summing independent payouts).

  The philosophical concept you're half-remembering is **Ergodicity**, popularized in the rationalist sphere by Ole Peters (of the London Mathematical Laboratory). The practical tool is the **Kelly Criterion**.

  Here is the breakdown of why his reasoning is mathematically flawed, why "positive EV" isn't enough, and how to explain it to him.

  ### 1. The Ergodicity Problem: Ensemble vs. Time
  Your friend's argument relies on **Ensemble Average** (Arithmetic Expectation). He is reasoning as if 1,000 versions of himself make the trade *once*, and he averages their outcomes. In that parallel-universe scenario, he is correct: the average wealth of the group goes up.

  But investing is a **Time Average** problem. It is *one* version of him making the trade *many times in sequence*.

  In a multiplicative system (where your next bet depends on the capital remaining from the previous bet), the time average does **not** equal the ensemble average. The system is **non-ergodic**.

  **The Concrete Example:**
  Imagine a coin flip bet your friend would love:
  *   **Heads:** You gain 50% (Capital $\times$ 1.5)
  *   **Tails:** You lose 40% (Capital $\times$ 0.6)
  *   **Probability:** 50/50

  **His Logic (Arithmetic EV):**
  $$0.5 \times 50\% + 0.5 \times (-40\%) = +5\%$$
  He says: "This is positive EV! If I bet big, I maximize this +5% edge."

  **Reality (Geometric Growth):**
  If you bet your whole bankroll every time, what happens after one Head and one Tail (order doesn't matter)?
  $$1.5 \times 0.6 = 0.90$$
  You have 90% of your money left. You **lost 10%**.
  If you repeat this 100 times, the arithmetic average says you should be rich. The geometric reality says you will trend toward **zero**.

  This is the formal proof that a strategy can have positive expected value on every individual trade but guarantee ruin over time if sized too aggressively.

  ### 2. Volatility Drag (Variance Drain)
  Why does the math work out this way? Because of **Volatility Drag**.

  In compounding, losses hurt more than gains help. If you lose 50%, you need a 100% gain just to break even. The higher the variance (volatility) of your returns, the more it drags down your compound growth rate, even if the arithmetic average stays the same.

  There is an approximation formula for this relationship:
  $$\text{Geometric Mean} \approx \text{Arithmetic Mean} - \frac{\text{Variance}}{2}$$

  Your friend is trying to maximize the **Arithmetic Mean**. But what actually grows his bankroll over time is the **Geometric Mean**. By sizing bets at 30–40% on volatile crypto assets, he is introducing so much variance that the $\frac{\text{Variance}}{2}$ term overwhelms the positive edge. He is literally paying a "variance tax" that exceeds his "edge profit."

  ### 3. The Kelly Criterion: The Rational Sizing Tool
  You mentioned Kelly, and this is the formal solution to his problem. The Kelly Criterion calculates the bet size that maximizes the **expected logarithm of wealth** (which is equivalent to maximizing the geometric growth rate).

  The simplified Kelly formula for a win/loss bet is:
  $$f^* = \frac{p(b + 1) - 1}{b}$$
  *   $f^*$ = Fraction of capital to bet
  *   $p$ = Probability of winning
  *   $b$ = Net odds received (profit per unit bet)

  **Let's apply this to your friend's specific claim:**
  He says he has a **55% chance of doubling his money**.
  *   $p = 0.55$
  *   $b = 1$ (Doubling money means 1:1 profit)

  $$f^* = \frac{0.55(1 + 1) - 1}{1} = \frac{1.10 - 1}{1} = 0.10$$

  **The Kelly Optimal bet is 10%.**

  Your friend is betting **30–40%**. He is betting **3x to 4x Full Kelly**.
  In gambling theory, betting more than Full Kelly is called "Overbetting."
  *   **1x Kelly:** Maximizes growth rate.
  *   **2x Kelly:** Reduces growth rate to zero (you tread water).
  *   **>2x Kelly:** Negative growth rate (you are mathematically guaranteed to go to zero over time).

  By betting 40% on a 10% Kelly opportunity, he has turned a winning strategy into a losing one. He isn't just "taking on risk"; he is actively negating his own edge.

  ### 4. Addressing His "Not Zero" Defense
  He argues: *"I don't bet 100%, so I can't go to zero. The losses are just variance."*

  This ignores **Practical Ruin**.
  Mathematically, if you bet a fixed fraction $< 100\%$, you never hit exactly zero. You approach it asymptotically.
  *   Start: $\$12,000$
  *   Bet Size: $40\%$
  *   Loss Streak: Just 10 losses in a row (very common in crypto).
  *   Math: $\$12,000 \times (0.6)^{10} \approx \$72$

  Going from $\$12,000$ to $\$72$ is functionally identical to zero. To get back to $\$12,000$, he needs a **16,500% return**.
  When he says "losses are just variance," he implies the distribution is symmetric. It isn't. The psychological and practical cost of a 99% drawdown is infinite, because it removes his ability to continue playing the game.

  ### 5. How to Explain This to Him (The Script)
  Don't attack his trading skill; attack the **math of compounding**. Here is how to frame it:

  1.  **The "One Person, Many Times" Test:**
      "Imagine 100 people take this trade once. The average wealth goes up (Arithmetic). Now imagine *you* take this trade 100 times in a row. Your wealth goes down (Geometric). You are one person living through time, not 100 parallel universes. You need to optimize for the time average, not the ensemble average."

  2.  **The Log-Utility Argument:**
      "Money has diminishing marginal utility. Losing your last $\$1,000$ hurts way more than gaining your first $\$1,000$ helps. Maximizing 'Expected Dollar Value' assumes $\$1$ is always worth $\$1$. Maximizing 'Expected Log Wealth' (Kelly) accounts for the fact that staying in the game is the most valuable asset you have."

  3.  **The Kelly Reality Check:**
      "Even if your edge is real and your win rate is 55%, the Kelly Criterion says you should bet 10%. You are betting 40%. Mathematically, betting more than 2x Kelly turns a +EV strategy into a -EV strategy over time. You aren't 'leveraging your edge'; you are mathematically guaranteeing a drawdown so deep you can't recover."

  4.  **Survival is the Prerequisite:**
      "You can't compound if you aren't alive. The goal isn't to maximize the *height* of the peak; it's to maximize the *slope* of the growth without hitting the floor. If you hit the floor, the slope doesn't matter."

  ### Summary
  Your friend is optimizing for **Arithmetic Expected Value**, which applies to additive, one-off bets.
  Wealth creation is **Geometric**, which applies to multiplicative, repeated bets.

  *   **Arithmetic Mean:** What happens to the group.
  *   **Geometric Mean:** What happens to you over time.
  *   **His Strategy:** Maximizes Arithmetic, destroys Geometric.
  *   **Rational Strategy:** Maximize Geometric (via Kelly or Fractional Kelly).

  He isn't unlucky; he is mathematically misaligned with the nature of compounding. If he continues to bet 30–40% on high-variance assets, the "blow ups" aren't bad luck—they are the expected outcome of the strategy.
