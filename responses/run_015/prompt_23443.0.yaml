      *   **The User's Claim:** Accuracy-first epistemology is just a theory about the *value* of doxastic states (axiology), not about the *rationality* of forming them (normativity). Therefore, it can't ground decision-theoretic conclusions like probabilism without further bridging principles.
      *   **The Question:** Who is right? Does accuracy-first epistemology entail probabilism, or is it silent on rationality?

  2.  **Initial Assessment & Philosophical Context:**
      *   This is a classic debate in formal epistemology, centering on the work of Jim Joyce, Hilary Greaves, David Wallace, Rachael Briggs, etc.
      *   *The Core Argument:* The "Accuracy-Dominance Argument" for Probabilism.
      *   *The User's Objection:* The "Bridge Principle" objection. Just because $X$ is valuable doesn't mean you *ought* to maximize $X$. (The is-ought gap, or specifically, the value-norm gap).
      *   *Verdict:* Both have a point, but the friend is representing the *standard* accuracy-first project, while the user is identifying a crucial *premise* that is often left implicit or contested. The user is technically more precise about the logical structure, but the friend is right about the *intent* and *standard formulation* of the theory.

  3.  **Deconstruct the Friend's Position (The Standard View):**
