      *   Key Theorem: If a credence function violates probability axioms, there exists another credence function that is strictly more accurate in every possible world (Accuracy-Dominance).
      *   Key Theorem: If a credence function satisfies probability axioms, it is not accuracy-dominated (under proper scoring rules).
      *   Conclusion: To avoid being dominated (which is irrational), one should be probabilistic.
      *   *Implicit Premise:* There is a norm linking value/accuracy to rational requirement (e.g., "Don't adopt dominated strategies").

