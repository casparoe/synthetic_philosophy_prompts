answer: |-
  This is a sophisticated dispute that cuts to the very heart of contemporary formal epistemology. You and your friend are essentially reenacting a debate that has occupied philosophers like Jim Joyce, Hilary Greaves, David Wallace, and Anna Mahtani for the last two decades.

  The short answer is: **You are logically correct, but your friend is describing the standard ambition of the research program.**

  Here is the detailed breakdown of why both of you have a point, and where the actual philosophical friction lies.

  ### 1. The Structure of the Accuracy-First Argument
  To see where you disagree, we need to formalize the argument your friend is making. The "Accuracy-Dominance Argument for Probabilism" typically looks like this:

  1.  **Axiological Premise:** The fundamental epistemic good is accuracy (closeness to the truth). The epistemic utility of a credence function is determined solely by its accuracy (measured by a proper scoring rule).
  2.  **Mathematical Premise:** If a credence function violates the axioms of probability, there exists an alternative credence function that is strictly more accurate in every possible world (it is *accuracy-dominated*). If a credence function satisfies the axioms, it is not dominated.
  3.  **Normative Bridge Principle:** Rational agents ought not to adopt doxastic states that are dominated (or: rational agents ought to maximize expected epistemic utility).
  4.  **Conclusion:** Therefore, rational agents ought to satisfy the axioms of probability (Probabilism).

  ### 2. Why You Are Right (The Logical Gap)
  Your objection targets the move from Premise 1 to Premise 4. You are arguing that **Accuracy-First Epistemology, strictly defined, is only Premise 1.**

  You are correct that a theory of *value* (axiology) does not logically entail a theory of *obligation* (normativity) without a bridging principle. This is a version of the Is-Ought gap.
  *   Just because accuracy is the *good*, it doesn't automatically follow that you are *required* to maximize it.
  *   For example, in ethics, hedonism says pleasure is the good. But that doesn't entail you *ought* to maximize pleasure unless you add the normative principle of Utilitarianism.

  If "Accuracy-First Epistemology" is defined merely as the claim that "accuracy is the sole epistemic value," then you are right: it is silent on rationality. It tells you what makes a belief state *good*, but not what makes an agent *rational* for holding it. There could be other constraints on rationality (e.g., evidential constraints, pragmatic encroachment) that override the drive for accuracy.

  ### 3. Why Your Friend Is Right (The Standard Package)
  Your friend is interpreting "Accuracy-First Epistemology" not just as the axiological claim (Premise 1), but as the **entire research program** (Premises 1–4).

  Proponents of the view (most notably Jim Joyce in his 1998 paper *"A Nonpragmatic Vindication of Probabilism"*) explicitly intend to derive norms from values. When they say "Accuracy-First," they usually mean:
  > "Epistemic rationality is constituted by the appropriate pursuit of epistemic value (accuracy)."

  In this context, the **Bridge Principle** is considered constitutive of what "epistemic rationality" *means*. They argue that if you aren't trying to maximize accuracy (or avoid dominated states), you aren't being *epistemically* rational, even if you are being pragmatically rational.

  So, when your friend says the approach "entails probabilism," they are speaking loosely but accurately about the literature. The literature treats the Bridge Principle as part of the definition of the theory. Without the Bridge Principle, the project would indeed be inert, and no one would work on it.

  ### 4. The Real Philosophical Battleground
  You have inadvertently identified the most significant objection to Accuracy-First Epistemology. Philosophers who criticize the view often make exactly your point.

  *   **The "Bridge Principle" Objection:** Critics argue that the Bridge Principle is not self-evident. Why *ought* an agent avoid accuracy-dominated states?
      *   If the answer is "because it's irrational," the argument becomes circular (Probabilism is rational because irrationality is bad).
      *   If the answer is "because accuracy is the good," they run into your objection (Value doesn't entail Obligation).
  *   **Evidential Constraints:** Some argue that rationality is about fitting your beliefs to your *evidence*, not maximizing accuracy. You might have evidence that forces you to have imprecise credences (violating probabilism), and accuracy-firsters have to argue why accuracy trumps evidence in defining rationality.

  ### 5. Verdict
  **You win on logical strictness; your friend wins on charitable interpretation.**

  *   **You are right** that a value theory alone cannot ground a decision-theoretic conclusion. If someone hands you a utility function and asks "What should I do?", you cannot answer without a decision rule (maximize expected utility, minimize regret, satisfy constraints, etc.). Accuracy-first epistemology *as a value theory* is silent on rationality.
  *   **Your friend is right** that "Accuracy-First Epistemology" is standardly understood in the literature as **Epistemic Decision Theory**. It is the conjunction of the value theory (accuracy is the good) AND the decision rule (maximize/avoid dominance). Understood as that conjunction, it does entail probabilism (via the mathematical theorems).

  **How to resolve the argument:**
  Tell your friend: *"I agree that Accuracy-First **Decision Theory** entails probabilism. But Accuracy-First **Axiology** does not. Your claim relies on a Bridge Principle linking value to normativity. If you treat that Bridge Principle as part of the definition of Accuracy-First Epistemology, you are right. If you treat Accuracy-First Epistemology as just the theory of value, I am right. The real debate is whether that Bridge Principle is justified."*

  This moves the argument from a semantic dispute to the actual philosophical meat of the issue: **Why should epistemic value dictate epistemic norms?**
