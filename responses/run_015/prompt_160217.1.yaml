  2) The 1998 sign-off validates the moulds as authorized during her life, satisfying the conceptual authorization rule despite the 2024 casting date. However, because the specific object was not sanctioned while she lived, labeling it 'By' risks violating the rule requiring historical truth of production.

  3) You will likely accept the 'By' attribution because the posthumous print precedent prioritizes the artist's written instructions over physical presence, and the foundation's authority substitutes for the living artist's oversight. This rule wins out because rejecting a gifted work with documented lifetime intent creates unnecessary conflict compared to the workshop or forgery cases.

  4) The posthumous print is the closest analogue since both involve reproducing an image from an original source matrix after death using prior instructions. It is not perfectly close, however, because a print is inherently multiple whereas a bronze cast is often treated as a unique object within an edition.

  5) You would need to rule on a cast made from the same moulds without any written studio notes, relying solely on the foundation's verbal assertion of intent. This exposes an inconsistency between the rejected workshop finish and the accepted posthumous print, hinging entirely on the existence of written instructions versus general stylistic continuity.
