answer: |-
  You have stumbled onto a classic problem in moral philosophy known as the **Paradox of Moral Responsibility** or the **Problem of Standing**. Philosophers like R. Jay Wallace, Gary Watson, and Macalester Bell have written entire papers trying to untangle exactly what you're wrestling with.

  Your hunch is correct: **Premise (2) is the break point.**

  Here is why (2) is doing something sneaky, how to fix the boundary problem you're worried about, and how to save the rest of your argument without accepting moral nihilism.

  ### Why Premise (2) is the Trap

  Premise (2) says: *Being guilty of wrongdoing undermines your standing to blame others for wrongdoing.*

  This premise assumes that **moral standing is a general property of the person**, like a credit score. It assumes that if you dip below a certain "moral purity" threshold, you lose the currency to trade in *any* moral judgment.

  But moral standing isn't general; it's **norm-specific**.

  When you blame someone, you aren't saying, "I am a perfect being and you are not." You are saying, "We are both subject to this specific moral norm, and you have violated it."

  If I speed on the highway, I violate the norm of traffic safety. If I then see someone run a red light, I can still blame them. Why? Because my violation of the *speed limit norm* does not invalidate my endorsement of the *traffic light norm*. Even if they were the same norm (speeding), my violating it doesn't mean I think the norm doesn't exist.

  **The Boundary Solution:**
  You asked: *"Why does my lying not cancel my standing to blame a murderer?"*

  **Answer:** Because standing is lost only when your own wrongdoing implies a **rejection of the specific norm** you are invoking.
  *   If I lie, I show I am weak-willed regarding truth.
  *   If I blame a murderer, I am invoking the norm of non-violence.
  *   My failure at truth does not disqualify me from upholding non-violence.

  Therefore, (2) is false. The corrected principle is: *Being guilty of wrongdoing undermines your standing to blame others only when that wrongdoing is **relevantly similar** to the blame being cast, such that it implies you do not actually endorse the norm you are enforcing.*

  ### The "Hypocrisy" Nuance (Fixing Premise 1)

  Premise (1) feels unshakeable: *"If you do something wrong, you lose the standing to blame other people for doing that same thing."*

  But even this needs a slight tweak to avoid the "repentance loophole" you worried about. The problem with hypocrisy isn't just that you did the thing; it's that you are **pretending you didn't** or **acting as if you are exempt**.

  Consider two people who both cheat on their spouses:
  1.  **Person A:** Cheats, hides it, and then screams at their friend for cheating, acting morally superior.
  2.  **Person B:** Cheats, admits it, says "I messed up terribly and I hate myself for it," and then tells their friend, "What you did was wrong, and I know because I did it too."

  Person A has no standing. Person B *does* have standing.

  Why? Because Person B is not claiming exemption from the norm. They are acknowledging the norm exists, admitting they failed it, and affirming that their friend failed it too. Person A is trying to use the norm as a weapon while shielding themselves from it.

  So, the real condition for losing standing isn't **guilt**; it's **insincerity regarding the norm**.

  ### The "Community" View (An Alternative to Standing)

  There is a second way to break the argument, which attacks the definition of "blame" itself.

  Some philosophers argue that we don't need "standing" to blame in the way a judge needs authority to sentence. We blame not because we are *above* the wrongdoer, but because we are *members of the same moral community*.

  Think of it like this: If we are both on a sinking ship, and you start hoarding the lifeboats, I don't need to be a perfect sailor to tell you to stop. I just need to be a passenger who expects us to follow the rules of survival.

  On this view:
  *   **Premise (3)** is true (everyone is flawed).
  *   **Premise (5)** is true (we should blame).
  *   **Premise (1) & (2)** are rejected.

  We don't blame from a position of moral superiority (which requires purity); we blame from a position of **shared accountability**. My flaws make me *more* qualified to understand the struggle, not less qualified to identify the wrong.

  ### How to Rebuild Your Argument

  To stop the driving-you-nuts feeling, you need to explicitly reject (2) and refine (1). Here is the stable version of your argument:

  1.  **Refined (1):** You lose the standing to blame others for a specific wrong **if and only if** your own conduct implies you reject the moral norm you are enforcing (e.g., you claim exemption or hide your own guilt).
  2.  **Rejected (2):** General wrongdoing does not cancel standing for specific, unrelated wrongdoing. Moral authority is norm-specific, not person-specific.
  3.  **Accepted (3):** Everyone has done wrong stuff.
  4.  **New (4):** Therefore, everyone has violated *some* norms, but most people still uphold *most* norms.
  5.  **Accepted (5):** Therefore, we retain standing to blame others for violations of the norms we still uphold, provided we acknowledge our own fallibility.

  ### Summary of What to Give Up

  You have to give up the idea that **moral standing is a binary switch based on general sinfulness.**

  *   **Don't give up (1):** Hypocrites *do* lose standing. That intuition is correct.
  *   **Don't give up (3):** You aren't a saint, and neither is anyone else.
  *   **Don't give up (5):** Blame is necessary and good.
  *   **DO give up (2):** This is the generalization that turns a specific rule about hypocrisy into a universal rule about human worthlessness.

  The boundary you were looking for is **Normative Relevance**. You can blame a murderer even if you are a liar, because you are still committed to the norm against murder. You only lose the right to blame the murderer if *you also think murder is okay* (which would make your blame insincere) or if you claim *you* are exempt from the rule against murder while enforcing it on them.

  Does that untangle the knot?
