  ### The Number
  **My credence that the two cases are morally on par (i.e., the inefficacy objection defeats both or neither equally): 0.35.**

  (Your credence: 0.2 | Friend's credence: 0.8)

  I am siding closer to you, but I am not as confident as you are that they are structurally distinct. I think there is a significant chance that *both* actions survive the objection (making them on par), or *both* get swamped by the threshold (making them on par). However, the most likely outcome is the one you argue for: Meat survives, Voting dies.

  ---

  ### The Decomposition
  To get to 0.35, I broke the problem into four sub-questions. For "Parity" to be true, the inefficacy objection must land on both sides equally (either it refutes both, or it refutes neither). For "No Parity" to be true, it must refute one but not the other.

  #### 1. The Framework Question
  **Is Strict Act Consequentialism (SAC) the correct/sole moral framework?**
  *   **Probability:** 0.3 (Yes) | 0.7 (No)
  *   **Reasoning:** Your friend's objection *only* works under SAC (only actual counterfactual outcomes matter). Most contemporary ethicists accept some form of Rule Consequentialism, Virtue Ethics, or Expressivism, where "doing your part" or "following the rule" has value independent of the specific causal outcome.
  *   **Impact on Parity:**
      *   If **No (0.7)**: The inefficacy objection is a category error. It defeats *neither* reason. Both actions retain moral weight. **$\rightarrow$ Parity.**
      *   If **Yes (0.3)**: The objection is valid in principle. We must check the causal math. **$\rightarrow$ Proceed to Q2.**

  #### 2. The Market Causality Question
  **Does an individual meat purchase have a non-negligible expected causal impact on production?**
  *   **Probability:** 0.9 (Yes, nonzero) | 0.1 (No, effectively zero)
  *   **Reasoning:** Economic consensus (e.g., Harish, Feldman) suggests that while one chicken doesn't trigger an order, over time, price elasticity means your purchase increases expected production by a fraction (e.g., 1/10,000 of a chicken per chicken bought). It is stochastic, but the *expected value* is robustly nonzero.
  *   **Impact on Parity:**
      *   If **No (0.1)**: Meat impact is zero. Matches Voting (likely). **$\rightarrow$ Parity.**
      *   If **Yes (0.9)**: Meat has moral weight under SAC. We must compare this to Voting. **$\rightarrow$ Proceed to Q3.**

  #### 3. The Voting Causality Question
  **Does an individual vote have a non-negligible expected causal impact *relative to meat*?**
  *   **Probability:** 0.2 (Yes, comparable) | 0.8 (No, orders of magnitude smaller)
  *   **Reasoning:** Voting is discrete. The probability of being pivotal is vanishingly small (often estimated at 1 in 10 million to 1 in 100 million for national elections). While the *impact* of changing an election is huge, the *probability* is so low that the Expected Utility (EU) is usually calculated as lower than the EU of abstaining from meat. The structures are different: Market is continuous/smoothed; Voting is binary/lottery.
  *   **Impact on Parity:**
      *   If **Yes (0.2)**: Both have comparable nonzero impact. **$\rightarrow$ Parity.**
      *   If **No (0.8)**: Meat has significantly higher EU than Voting. This creates a wedge. **$\rightarrow$ Proceed to Q4.**

