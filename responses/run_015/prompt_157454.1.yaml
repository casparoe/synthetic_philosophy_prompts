answer: |-
  Dear Colleague

  Since you are leading this session for a group of sharp professionals who lack formal training in ethics, your primary challenge is to prevent the discussion from collapsing into a debate about whether being good makes you happy, which is a psychological question, rather than whether being maximally good makes a life better, which is the philosophical question you intend to raise. To achieve this, you must anchor the entire ninety minutes on a single biographical sketch that avoids the traditional trap of the joyless saint. You should set aside the joyless saint profile explicitly because it invites participants to reject maximal goodness on the grounds of misery or burnout, which allows them to preserve the intuition that morality is desirable so long as it does not hurt. Instead, you should use a substitute figure we will call David, a highly competent human rights lawyer who finds genuine fulfillment and excitement in his work. This sketch must possess the features of high competence, authentic satisfaction in moral action, and social success, but it must lack any sphere of life that is insulated from moral scrutiny, such as hobbies, idle friendships, or aesthetic pursuits that do not serve a moral end. By making David happy and effective, you force the group to confront the possibility that a life can be psychologically healthy yet axiologically impoverished because moral reasons dominate every decision, which is the core of your moral saturation concept.

  The sequence of conceptual introduction must follow a strict dependency chain to ensure the group does not talk past one another. You must begin by eliciting the pre-theoretical intuition that more moral goodness is always better, because without establishing this baseline commitment, the subsequent critique will seem like an attack on morality itself rather than an inquiry into its structure. Once this intuition is secured, you introduce David immediately, because the intuition requires a concrete agent to test against; abstract principles will not reveal the structural implications of saturation to this audience. With David established, you then introduce the concept of moral saturation, defining it as the state where moral reasons trump all competing reasons in every domain, and this step depends on the previous one because saturation is invisible without a specific agent whose decision-making process is laid bare. Only after saturation is clearly defined through David's life can you introduce moral permeability as the contrasting structure where moral reasons set boundaries and influence choices without monopolizing the justification for every action, since permeability is defined negatively against saturation and cannot be understood in isolation. Finally, you move to the evaluation of desirability, which depends on all previous steps because the group can only judge whether maximal goodness is desirable once they understand that maximal goodness entails saturation rather than permeability.

  You must anticipate two specific misconceptions that will arise from the professional backgrounds of your participants, and you must intercept them at precise moments in this sequence. The first misconception is that moral saturation is identical to extreme conscientiousness, which lawyers and scientists often admire as diligence; they will argue David is simply very dedicated. You must intercept this at the moment you define moral saturation, specifically by asking the group whether David could choose to attend a friend's wedding instead of working on a case without feeling he has made a moral error. The specific move to head this off is to insist that conscientiousness allows for non-moral reasons to exist alongside moral ones, whereas saturation eliminates the normative force of non-moral reasons entirely, so if David feels guilt for missing work to be with a friend, he is saturated, not just conscientious. The second misconception is that moral permeability amounts to treating morality as optional or weak, which will appeal to those who view moral constraints as impediments to efficiency or liberty. You must intercept this when you introduce permeability, by clarifying that permeability does not mean moral reasons are weaker, but that they are structurally limited to certain domains. The specific move here is to posit a scenario where a permeable agent still refuses to lie to achieve a personal good, demonstrating that morality retains its authority but does not expand to fill all available justificatory space.

  Regarding the academic context, you should deliberately omit the formal literature on supererogation and the demandingness objection, acknowledging to the group that this literature is left out because it focuses on the quantity of duty owed rather than the structural relationship between moral and non-moral values. The supererogation framework categorizes actions as required or optional, which reinforces the very binary you are trying to dissolve with the saturation-permeability distinction, and introducing it would distract the group into debating where the line of duty lies rather than how moral reasons interact with other values. By keeping this literature out, you protect the novelty of your framing and prevent the lawyers in the group from turning the session into a contractual negotiation about minimum requirements.

  To close the session, you must ask one concluding question that tests whether they have grasped the structural distinction rather than merely memorized the labels. You should ask them to imagine David deciding to spend Saturday reading poetry instead of volunteering, and ask whether, in a permeable life, David needs to find a moral reason to justify the poetry, or whether the poetry justifies itself. If they answer that he needs a moral reason, such as recharging to be more effective later, they have failed to grasp permeability and have reverted to saturation; if they answer that the poetry justifies itself provided it violates no moral prohibitions, they have understood that permeability allows non-moral goods to stand independently while still being structured by moral boundaries. This question forces them to apply the distinction to a concrete choice, revealing whether they see morality as a monopolist or a architect, which is the ultimate goal of your discussion.
