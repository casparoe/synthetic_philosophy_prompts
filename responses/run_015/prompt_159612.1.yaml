  **Marking Scheme (Total 20 Points)**

  **1. Impossibility Construction (4 Points)**
  *   **Must-Hit:** Explicit profile with at least 4 alternatives showing the cycle $b \succ a \succ d \succ c \succ b$ (or equivalent) derived via specific applications of L and P.
  *   *Common Error:* Using the standard 3-alternative Prude/Lewd example without adapting it to the product space coordinates, or failing to show how Pareto closes the cycle.

  **2. Structural Feature Identification (4 Points)**
  *   **Must-Hit:** Explicitly identifies "meddlesome preferences" (preferences over others' protected spheres) as the necessary condition for the Pareto relation to conflict with Rights.
  *   *Common Error:* Blaming "transitivity" or "rationality" generally, rather than the specific interference in protected spheres.

  **3. SD Compatibility Proof (4 Points)**
  *   **Must-Hit:** Correctly argues that under SD, Rights-generated implications are a subset of Pareto-generated implications, and since Pareto is acyclic, the union is acyclic.
  *   *Common Error:* Asserting SD works without proving the subset relationship between the Rights relation and the Pareto relation.

  **4. SD Domain Cost (4 Points)**
  *   **Must-Hit:** Clearly states that SD violates Unrestricted Domain (U) and constitutes a restriction on admissible profiles, not a fix within the original theorem's constraints.
  *   *Common Error:* Claiming SD is a "solution" to Sen's theorem without noting it abandons one of the theorem's four axioms (specifically U).

  **5. Laundering Critique (4 Points)**
  *   **Must-Hit:** Identifies that laundering is ill-defined for multi-coordinate differences OR leads to individual intransitivity OR collapses into SD. Concludes it is a domain restriction in disguise.
  *   *Common Error:* Accepting laundering as a valid solution without checking multi-coordinate pairs or individual transitivity of the laundered profile.
