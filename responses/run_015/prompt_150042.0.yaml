prompt: |-
  hey — I need a parody, around 800 words, of a management-consulting deliverable: that glossy bullet-heavy "implementation roadmap" deck-text a firm in a gray suit would hand a client, except the product being rolled out is a disciplinary apparatus. Give it a title in the house style, something like "The Voluntarity Roadmap: Phase III — Beyond Surveillance."

  The setup: the firm gets hired to dismantle discipline. They take down the cameras, lay off the middle managers, delete the time-tracking software, and every single step of this liberation makes the workforce more governable. Nobody in the document ever notices this. The jokes have to come from getting Foucault actually right rather than from a strawman about being watched, so work in the real machinery: power as productive rather than repressive (it makes kinds of people, it doesn't just say no), the norm and the normalizing judgment doing the work the law used to do, visibility as a trap in which the inmate can never verify whether anyone is currently looking, the examination that turns each worker into a comparable case and a number, individualizing and totalizing at the same time, and the confession imperative — employees required to keep producing truth about themselves so the apparatus has something to record. Don't put any real quotations in it; invent your own in-house jargon.

  Two things I specifically want.

  First, the centerpiece: they remove the central tower from the panoptic building but keep the lighting geometry. Every workstation is lit and visible to every other, nobody is looked at from above, and the slide explains that supervision has been replaced by what the firm calls "the ambient gaze." The reasoning should be sincere and slightly chilling: a worker who is definitely being watched can perform for the watcher, but a worker who might be being watched has to become the sort of person who doesn't need watching. Score this with an invented metric — the Voluntarity Index, or a better name if you think of one — defined so that the top of the scale is the employee who requires no oversight whatsoever.

  Second, the part I want you to not wimp out on. Phase IV is a mandatory weekly filing in which each employee recounts the ways she resisted, dodged, or gamed the system, and these reports get folded into the database that sets next quarter's norms. The firm should be entirely earnest about it: resistance isn't what breaks the machine, it's the machine's intake valve. If the real vocabulary helps — counter-conduct, technologies of the self, the pastoral care of individual souls, the repressive hypothesis — use it where it lands, but keep the tone consultancy-cheerful.

  End it so the reader feels the actual uncomfortable thing: that a workplace with no boss and no surveillance can be more disciplinary than one with both, and that from the inside you can't tell whether you've been freed or just upgraded. The firm should not be portrayed as having failed.

  After the piece, a short note, 150 words max, on where you took liberties with the ideas. In it, commit to a position on whether resistance is really internal to power for Foucault rather than hedging across readings, say which part of the parody depends on that commitment, and defend it — I want your reasons, not the menu of options.
