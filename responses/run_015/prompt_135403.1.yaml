  4. The shmue test works as a defeater if deflationists cannot explain why our truth-practices involve specific norms without smuggling in substantive properties. If the only difference between truth and shmuth is external normative pressure, then truth's nature is not exhausted by its logical role. (75%)
  5. Generalizing deflationism to reference and existence risks collapsing into global nihilism, where nothing truly refers or exists, which is a reductio for most philosophers. This is less fatal than the math objections but forces you into metaphysical corners that feel unintuitive and costly. (60%)
  6. The charge that the view is unfalsifiable is merely awkward because deflationism is a thesis about linguistic function, not an empirical claim open to physical refutation. It feels too easy because it dissolves the problem rather than solving it, which is precisely what its proponents intend. (70%)
  7. The intuition that truth matters is the weakest objection since deflationists argue sentences matter, and truth is just a device to endorse them en masse. This leaves the emotional weight of "Truth" unexplained, but logically satisfies the requirement without invoking mysterious properties. (50%)
