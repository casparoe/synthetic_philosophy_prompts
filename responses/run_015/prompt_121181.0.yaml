  **JOINT STATEMENT ON AGENCY, DETERMINISM, AND RESPONSIBILITY**

  **Signatories:** The Compatibilist Signatory (CS) | The Incompatibilist Signatory (IS)
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Metaphysics of Choice

  ### I. AGREED CLAIMS

  1.  **Definition of Determinism:** We agree that causal determinism is the proposition that every event or state of affairs, including every human decision and action, is the inevitable and necessary consequence of antecedent states of affairs in accordance with the laws of nature. If determinism is true, the past and the laws of nature entail exactly one possible future.
  2.  **Neuroscience and Antecedents:** We agree that contemporary neuroscience establishes that conscious decisions are correlated with, and causally preceded by, neural activity. We agree that "brain wiring" (genetic, developmental, and environmental history) constrains the decision space. We disagree on whether this causal precedence negates *choice*, but we agree it negates *magic* (i.e., decisions do not arise ex nihilo).
  3.  **Frankfurt-Style Cases:** We agree that Frankfurt-style cases (where an agent chooses X on their own, but a mechanism would have forced X had they hesitated) successfully challenge the Principle of Alternative Possibilities (PAP) as a *necessary* condition for moral responsibility in some intuitive contexts. We agree these cases show that an agent can be responsible even if they literally could not have done otherwise *in that specific instance*, provided the actual sequence of events was uncoerced.
  4.  **Coercion vs. Causation:** We agree that there is a functional distinction between *coercion* (external threat or compulsion that bypasses the agent's reasoning) and *causation* (the normal flow of physics through the agent's reasoning). We agree that not all causal determination counts as coercion.
  5.  **The Stakes of Blame:** We agree that the practice of holding agents responsible serves a social function (norm enforcement, safety, moral communication). We disagree on whether this practice is *metaphysically justified* when determinism is true, but we agree that abandoning it entirely would radically alter human relationships.

  ### II. TABLE OF DISAGREEMENTS

  | Crux | The Core Dispute | Concrete Test Case | Compatibilist Prediction / Stance | Incompatibilist Prediction / Stance |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The "Could Have Done Otherwise" Condition** | **CS:** "Could have" refers to **counterfactual sensitivity**. If the agent's desires or reasons had been different, the output would have been different. The mechanism is flexible.<br><br>**IS:** "Could have" refers to **leeway incompatibilism**. The agent must have had access to more than one physically possible future *given the exact same past and laws*. | **The Exact Replay:** An agent makes a choice. Time is rewound to the exact micro-state prior to the decision. The tape is played again.<br><br>*Question:* In the replay, is it possible for the agent to choose differently? | **Prediction:** It is irrelevant if they choose differently in the replay. Responsibility is grounded in the *actual* sequence where the agent's mechanism functioned without interference. If the mechanism is reasons-responsive, they are responsible.<br><br>**Verdict:** Responsible. | **Prediction:** If the agent *cannot* choose differently in the replay (because the past/laws fix the future), they lack the control required for basic desert. They are merely a conduit for prior causes.<br><br>**Verdict:** Not Responsible (or responsibility is illusory). |
  | **2. Sourcehood and Origination** | **CS:** Sourcehood is satisfied if the action issues from the agent's **own psychological architecture** (values, beliefs, second-order volitions). You are the source if the cause runs *through* you, not around you.<br><br>**IS:** Sourcehood requires **ultimate origination**. To be truly responsible, the agent must be the *uncaused cause* of the causal chain that leads to the action. Determinism makes the agent a link in a chain, not the start of it. | **The Manipulation Argument:** An agent is engineered (via brainwashing or alien implant) to have a specific set of values and chooses X. Compare this to a normal agent raised by normal causes who chooses X.<br><br>*Question:* Is there a metaphysically relevant difference? | **Prediction:** There is a difference. The normal agent's values are integrated into their history and identity. The manipulated agent's values are alien. Determinism is not manipulation; it is just history. Responsibility survives normal determinism.<br><br>**Verdict:** Normal agents are responsible; manipulated agents are not. | **Prediction:** There is no relevant difference. Both agents are products of antecedent causes they did not choose. If the manipulated agent isn't responsible because they didn't choose their programming, neither is the normal agent. Determinism is just "hidden manipulation" by the past.<br><br>**Verdict:** Neither agent is ultimately responsible. |
  | **3. The Recursive Self-Model (Niche Framing)** | **CS:** An agent with perfect self-modeling who sees their own deterministic dynamics has **maximal autonomy**. They understand *why* they act and align with it. Transparency enhances control.<br><br>**IS:** An agent with perfect self-modeling who sees their own deterministic dynamics has **maximal captivity**. Seeing the "rails" of the decision before it happens proves the agent is a passenger, not a driver. Knowledge of determination does not break determination. | **The Transparent Agent:** An agent can simulate their own neural firing perfectly. Before choosing A or B, they see the simulation predict A with 100% accuracy based on their current state.<br><br>*Question:* Does this agent possess the control required for *blame* if A is a immoral act? | **Prediction:** Yes. The agent's self-model is part of the causal loop. Their recognition of the reason for A is part of *why* A occurs. They own the action fully because nothing is hidden from them. Blame is appropriate to reinforce the reasoning process.<br><br>**Verdict:** Blame is justified. | **Prediction:** No. The agent watches their brain decide. Even if they "agree" with the output, they could not have vetoed the output given the prior state. The self-model is just a monitor, not a steering wheel. Blame is metaphysically incoherent here.<br><br>**Verdict:** Blame is unjustified. |

  ***

  **Joint Closing Remark:**
  We agree that the dispute is not about whether humans make decisions (we do) or whether biology matters (it does). The dispute is about whether the *kind* of control biology permits is sufficient to justify the *kind* of blame we traditionally practice. We acknowledge that resolving this metaphysical debate does not automatically resolve the emotional weight of regret, as regret functions psychologically regardless of metaphysical verdicts.

  **Signed:**
  __________________________ (Compatibilist Signatory)
  __________________________ (Incompatibilist Signatory)
