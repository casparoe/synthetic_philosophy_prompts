          *   *The Conclusion:* The leap from "people survived" to "collapse is useless" is the logical fallacy. A heart attack is a "cardiac event," the person survives, but the *function* collapsed.

      *   *Self-Correction on "Shakiest Reasoning":* I need to admit that defining "collapse" is inherently semantic. As an AI, I rely on consensus archaeology, but consensus shifts. I should flag that my weighting of "human suffering" vs. "systemic continuity" is a value judgment itself.

