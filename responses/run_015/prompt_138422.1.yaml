answer: |-
  # Research Proposal: The Normative Middle

  **Project Title:** The Normative Middle: Expected-but-Not-Required Actions as a Distinct Category

  **Core Question**
  Is the class of actions that are expected but not required (e.g., replying to emails promptly, splitting bills fairly) a distinct third normative status, or is it merely optional action correlated with high statistical compliance, or a temporary way-station en route to obligation?

  **The Problem: Why the Two-Tier Picture Fails**
  Standard moral taxonomy divides actions into the required (obligatory) and the optional (permissible/supererogatory). This binary cannot absorb the "middle class" phenomena without distortion.
  1.  **Cost Thresholds:** Required acts are often defined by a cost ceiling (you must do it unless the cost is too high). Middle-class acts are low-cost, yet not required.
  2.  **Demandingness:** Required acts can be demanded. Optional acts can only be requested as favors. Middle-class acts admit of reminders and gentle chasing—speech acts that are inappropriate for purely optional acts but too weak for obligations.
  3.  **Reactive Attitudes:** Performing a required act earns no praise; performing an optional act often earns gratitude if costly. Performing a middle-class act earns neither; it is the baseline. However, omitting a required act brings blame; omitting an optional act brings indifference. Omitting a middle-class act brings disappointment and a downgrade in social standing, which is distinct from both blame and indifference.

  If we treat these as merely optional, we cannot explain the legitimacy of the "reminder." If we treat them as required, we cannot explain the absence of blame or the illegitimacy of sanctions.

  **Methodology: Avoiding the Collapse Worry**
  The central risk is that any test for this status collapses into measuring how many people actually perform the act (statistical frequency). To avoid this, the project will not test *compliance rates* but *counterfactual justification conditions*.

  The proposed test is the **Excuse Validation Test**. When an agent omits the act, they are challenged.
  *   **Optional:** "I didn't feel like it" is a full justification.
  *   **Required:** "I didn't feel like it" is no justification.
  *   **Middle:** "I didn't feel like it" is an *explanation* that mitigates blame but does not fully justify; it warrants the disappointment mentioned above.

  Crucially, this test will be applied to cases where compliance is *low*. If the normative status persists even when most people fail to do the act (e.g., a specific professional courtesy in a declining field), then the status is not dependent on statistical frequency. The project will construct thought experiments where compliance drops to zero but the appropriateness of the "reminder" speech act remains intact. If the intuition holds, the status is normative, not statistical.

  **Schedule (12 Weeks)**

  *   **Month 1: Phenomenology and Taxonomy.** Map the landscape of "middle" actions. Draft the precise definitions of the three tiers based on speech acts and reactive attitudes. Develop the Excuse Validation Test and run it against initial case studies (email etiquette, bill splitting, academic courtesy).
  *   **Month 2: The Collapse Argument.** Draft the core argument distinguishing normative expectation from statistical regularity. Stress-test the Excuse Validation Test against counterexamples where social norms are shifting. Write the section addressing the "way-station" hypothesis (is this just obligation-in-waiting?).
  *   **Month 3: Synthesis and Deliverables.** Finalize the journal paper (~8000 words). Ensure the argument decisively picks one of the three hypotheses or argues for indeterminacy. Draft the two-page note for the panel (specifically tailored for the dean). Final editing and submission.

  **Possible Conclusions**
  1.  **Distinct Status:** The middle tier is stable. It is governed by "normative expectations" rather than obligations. This requires expanding moral taxonomy.
      *   *Deciding Factor:* The Excuse Validation Test yields consistent results independent of compliance rates in thought experiments.
  2.  **Statistical Optional:** The middle tier is an illusion created by high compliance.
      *   *Deciding Factor:* If the appropriateness of "reminders" vanishes in thought experiments where compliance is stipulated as low.
  3.  **Unstable Way-Station:** The middle tier exists only during periods of norm transition.
      *   *Deciding Factor:* If the analysis shows the status always correlates with historical shifts in what is considered obligatory.

  **Deliverables**
  1.  **Journal Paper:** A conceptual analysis arguing for the existence (or non-existence) of the third category, suitable for a general ethics journal.
  2.  **Dean's Note:** A two-page non-technical summary explaining how understanding these "soft norms" impacts community cohesion and professional standards, avoiding philosophical jargon.

  **Failure Conditions**
  This project will be considered a failure if:
  1.  The Excuse Validation Test cannot be formulated without referencing how common the action is (i.e., the collapse worry proves fatal).
  2.  The distinction between "disappointment" and "blame" cannot be sustained under scrutiny and collapses into a difference of degree rather than kind.
  3.  The draft remains agnostic without arguing for indeterminacy as a positive thesis (i.e., simply running out of time to decide).

  **Scope Assessment**
  Twelve weeks is sufficient for a conceptual analysis but too short for empirical validation. If scope blows, I will cut the historical genealogy of supererogation. The project will focus strictly on the contemporary phenomenology of the three tiers. I will not attempt to survey the history of the concept, only its current logical structure.

  ***

