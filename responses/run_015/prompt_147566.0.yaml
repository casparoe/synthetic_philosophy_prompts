answer: |-
  ### (1) Exam Question

  **Question 4: Luminosity, KK, and Comparative Confidence**

  Williamson's anti-luminosity argument in *Knowledge and Its Limits* targets conditions $C$ such that if $C$ obtains, the subject is in a position to know that $C$ obtains. In section, a student proposed retreating from absolute luminosity to **Comparative Luminosity (CL)**:

  > **CL:** For any propositions $p$ and $q$, if your confidence in $p$ is strictly greater than your confidence in $q$, you are in a position to know that your confidence in $p$ is strictly greater than your confidence in $q$.

  The student argues that while absolute states (like "feeling cold") admit sharp boundaries vulnerable to sorites reasoning, comparative relations between attitudes do not, thereby blocking Williamson's margin-for-error argument.

  Write an essay addressing the following three points:
  1.  Clarify the conceptual distinction between the **Luminosity Thesis** and the **KK Principle**. Why does refuting the former not automatically refute the latter, though Williamson uses the former to undermine the latter?
  2.  Evaluate whether Williamson's margin-for-error reasoning generalizes to **CL**. Explain why the force of this argument depends only on the margin being *nonzero*, regardless of its specific size.
  3.  Consider a revised principle, **CL***, which requires a *discriminable gap* (e.g., confidence in $p$ exceeds confidence in $q$ by at least margin $m$) to yield knowledge. Assess whether **CL*** can perform the epistemic work KK was traditionally supposed to do.

  *(Word Limit: 1,200 words)*

  ***

  ### (2) Model Answer

  The Luminosity Thesis and the KK Principle are distinct claims regarding epistemic access, though they are often entangled. **Luminosity** asserts that for a specific condition $C$ (e.g., feeling cold, or knowing $p$), whenever $C$ obtains, the subject is in a position to know that $C$ obtains. It is a claim about the transparency of specific mental or factive states. The **KK Principle** ($Kp \to KKp$) is a structural principle of epistemic logic asserting that knowledge is positively introspective. While luminosity of knowledge entails KK, KK does not entail general luminosity. One could theoretically hold that knowledge is introspective (KK) without claiming that all mental states (like feeling cold) are luminous. However, Williamson attacks luminosity to undermine the internalist intuition that supports KK; if knowledge itself is not luminous, the bridge to KK collapses.

  The student's proposal, **Comparative Luminosity (CL)**, attempts to bypass Williamson's sorites by shifting from absolute magnitudes to comparative relations. The student claims comparisons lack the sharp boundaries required for a sorites paradox. This is incorrect. Williamson's margin-for-error argument relies on the **indistinguishability** of nearby cases, not the metaphysics of the property itself. Cognitive states, including confidence levels, are subject to noise. If a subject can know in case $\alpha$ that $Conf(p) > Conf(q)$, they must be safe from error. Safety requires a margin for error: if the subject cannot distinguish case $\alpha$ from case $\beta$, and they believe the comparison holds in $\alpha$, they will believe it in $\beta$.

  This reasoning generalizes to CL because the *difference* in confidence is itself a magnitude subject to discrimination limits. Let $D = Conf(p) - Conf(q)$. If $D > 0$, CL claims we know $D > 0$. However, if our discriminatory resolution is limited by a margin $m > 0$, there will be a case where $D$ is positive but smaller than $m$. In this case, the subject cannot distinguish the situation from one where $D \leq 0$. If they claim to know $D > 0$ when $D$ is tiny, they risk error in a nearby indistinguishable case where $D$ is negative. Thus, the margin-for-error principle applies to the *relation* just as it applies to the *relata*.

  Crucially, the specific size of the margin $m$ is irrelevant to the falsity of CL; only its being **nonzero** matters. Williamson's argument is a sorites. If there is any nonzero margin $m$, one can construct a finite chain of cases where the difference in confidence decreases by increments smaller than $m$. Starting from a case where the difference is large and known, we move stepwise to a case where the difference is negligible. At each step, indistinguishability preserves the belief (due to the margin requirement for knowledge), but eventually, the difference becomes negative. The subject ends up believing the comparison holds when it does not. Thus, any nonzero margin creates a "buffer zone" of ignorance around the boundary of the relation, falsifying the unrestricted claim of CL.

  To save the principle, the student might propose **CL***: One is in a position to know $Conf(p) > Conf(q)$ only if $Conf(p) - Conf(q) > m$ (where $m$ is the margin for error). This principle is likely true; it respects safety. However, **CL*** fails to perform the epistemic work KK was supposed to do. KK is valuable because it guarantees unrestricted positive introspection, supporting internalist accounts of justification and rationality. It allows a subject to iterate knowledge indefinitely ($Kp \to KKp \to KKKp...$). **CL*** blocks this iteration. As one reflects on one's confidence, the margin for error may accumulate, or the difference in confidence between "knowing" and "not knowing" may narrow. If access is restricted only to cases with a significant gap, there will be borderline cases of confidence where one knows $p$ but cannot know that one knows $p$ (because the confidence gap is too small). This reintroduces the very opacity Williamson identified. A restricted luminosity principle cannot support the strong internalist constraints KK was meant to secure, rendering it a poor surrogate for the original principle.

  ***

  ### (3) Marking Scheme

  **Total Marks: 20**

  | Point | Criteria (4 marks each) | Common Error |
  | :--- | :--- | :--- |
  | **1. Luminosity vs. KK** | Correctly identifies Luminosity as a claim about specific conditions obtaining $\to$ knowledge of obtaining, and KK as a structural iteration principle ($Kp \to KKp$). Notes that Luminosity entails KK (for knowledge) but not vice versa. | Conflating the two, treating them as identical claims, or arguing that refuting Luminosity logically entails the falsity of KK without explaining the link. |
  | **2. Generalization to CL** | Explains that margin-for-error relies on indistinguishability of cases, which applies to confidence differences just as it does to absolute states (noise in the cognitive system). | Assuming comparisons are immune to sorites because they are "relations" rather than "properties," ignoring cognitive limitations. |
  | **3. Nonzero Margin** | Explains that any $m > 0$ allows a sorites chain to be constructed over the *magnitude of the difference*, making the specific size of $m$ irrelevant to the falsity of unrestricted CL. | Arguing that a *small* margin saves CL, or failing to explain why a finite chain can bridge any nonzero gap. |
  | **4. CL* Formulation** | Correctly formulates the restricted principle (requiring a gap $> m$) as a safety-compliant version of CL. | Proposing a revision that does not actually build in a margin (e.g., "just be more careful") or misstating the safety condition. |
  | **5. Epistemic Utility** | Argues that CL* fails KK's work because it restricts iteration/introspection in borderline cases, undermining internalist justification. | Claiming CL* is successful because it is "safe," ignoring that safety was not the only goal of KK (access/iteration was). |
