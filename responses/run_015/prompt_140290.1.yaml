answer: |-
  **Clinical Coverage Policy CCP-744: Therapeutic Necessity and Functional Baseline Determination**

  **1.0 Definition of Covered Intervention**
  1.1 An intervention is deemed Medically Necessary only if it restores a Member to species-typical normal functioning.
  1.2 Normal Functioning is defined statistically as the median operational capacity of the relevant Reference Population.
  1.3 Interventions exceeding the median operational capacity are classified as Enhancement and are excluded from coverage.

  **2.0 Reference Class Selection**
  2.1 The Reference Population is determined by the Member's Declared Life Plan (DLP) filed at enrollment.
  2.2 Functional baselines are specific to the DLP. A cognitive stimulant constitutes Therapy for a Member whose DLP requires sustained vigilance (e.g., Air Traffic Controller) but constitutes Enhancement for a Member whose DLP prioritizes divergent thinking (e.g., Novelist).
  2.3 In the event a Member amends their DLP mid-treatment, coverage eligibility is recalculated effective the date of amendment. Benefits previously authorized may be retroactively denied if the new DLP baseline renders the intervention super-normal.

  **3.0 Dynamic Baseline Adjustment**
  3.1 The statistical median for species-typical functioning is updated annually based on aggregate claims data.
  3.2 Should the aggregate functional capacity of the Covered Population decline due to environmental stressors or non-covered lifestyle choices, the Normal Functioning baseline shall adjust downward accordingly.
  3.3 Interventions previously classified as Enhancement may be reclassified as Therapy if the population baseline drifts below the intervention's output level.

  **4.0 Eligibility via Deficit Acquisition**
  4.1 Members seeking coverage for restorative interventions must demonstrate a pre-existing deficit below the DLP baseline.
  4.2 The Plan covers pre-authorization for Iatrogenic Reduction Procedures wherein a Member voluntarily incurs a mild functional deficit to establish eligibility for subsequent restorative coverage.
  4.3 The cost of the induced deficit is the Member's responsibility; the cost of the restoration is covered at 80%.

  **5.0 Positional Benefit Exclusion**
  5.1 Coverage is rescinded for any intervention whose primary utility is competitive advantage rather than functional restoration.
  5.2 If prevalence of an intervention exceeds 50% of the Reference Population, the benefit is deemed positional; once universal, the competitive advantage is nullified, and the intervention is no longer Medically Necessary.
  5.3 This clause applies retrospectively to standard corrective lenses and basic literacy tutoring, as these no longer distinguish Members from the statistical mean.

  **Sample Determinations**

  **Case A:** Member submits claim for cognitive stimulant. DLP filed as "Air Traffic Controller." Claim **Approved**. Baseline for DLP requires 95th percentile vigilance; drug restores Member to 90th percentile.
  **Case B:** Member submits claim for same stimulant. DLP filed as "Poet." Claim **Denied**. Drug raises output above species-typical mean for creative reference class, constituting Enhancement.
  **Case C:** Member purchases non-covered memory suppression to fall below baseline, then claims coverage for memory restoration. Claim **Approved** per Section 4.2. Net cost to Plan is lower than covering initial maintenance.
  **Case D:** Member submits claim for corrective eyewear. Claim **Denied** per Section 5.2. Prevalence of corrected vision exceeds 50%; benefit is now positional. Member must compete uncorrected to maintain statistical neutrality.
