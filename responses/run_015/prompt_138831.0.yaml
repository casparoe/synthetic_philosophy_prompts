answer: |-
  # Joint Statement on Neural Network Representations: Adversarial Collaboration Preamble and Findings

  **Preamble and Shared Setup**

  We, the undersigned, represent opposing philosophical positions regarding the internal structure of trained neural networks. To ground our dispute in empirical reality rather than abstraction, we have fixed a shared experimental setup. We both analyze the same 1-billion-parameter decoder-only transformer trained on a mixed text corpus. We focus on the **residual stream**, defined as the vector of activations that passes through the layers of the network, accumulating updates from attention heads and multi-layer perceptrons. We apply the same unsupervised dictionary-learning pipeline—specifically, a **sparse autoencoder**—fitted to the residual-stream activations at one middle layer. This pipeline attempts to find a **dictionary**, a set of vectors called **directions**, such that any activation can be reconstructed as a sparse sum of these directions.

  We have jointly studied three example recovered directions: one tracking the language of a passage, one tracking sentiment or politeness, and one tracking references to a specific kind of named entity. We acknowledge that these directions exist in **superposition**, meaning the network appears to encode more features than there are dimensions in the activation space, requiring features to overlap. We also agree to treat as a separate, cleaner test case a small transformer trained on a synthetic language generated by a known grammar over known latent variables, where the ground truth is available by construction. We define **steering** as the intervention of adding a scaled vector to the residual stream to observe changes in output, and a **linear probe** as a classifier trained to predict a property from the activations.

  ***

  ### Part I: Agreed Claims

  1.  **Mathematical Specificity:** The sparse autoencoder pipeline mathematically guarantees the identification of directions that minimize reconstruction error subject to a sparsity penalty. It does not, on its own, guarantee that these directions correspond to causally isolated mechanisms within the network's computation.
  2.  **Interventional Efficacy:** Steering along the identified directions reliably alters the network's output distribution in ways correlated with the human interpretation of that direction (e.g., steering the "politeness" direction increases polite completions). However, agreement on the behavioral outcome does not entail agreement on whether the direction *is* the cause or merely a handle on a broader causal substrate.
  3.  **Non-Uniqueness of Decomposition:** There exist infinitely many mathematical decompositions of the activation space that preserve the input-output function of the network. The pipeline selects one based on optimization dynamics and hyperparameters, not because it is the unique solution to an equation.
  4.  **The Synthetic Boundary:** In the synthetic case, where the ground-truth latent variables are known, it is possible to measure the alignment between recovered directions and true variables objectively. In the natural language case, no such objective metric exists; alignment is assessed via human interpretation or downstream task performance.
  5.  **Legibility Bias:** The human interpreters evaluating the directions are constrained by human cognitive categories. A direction is only deemed "meaningful" if a human can narrate a story about it that fits existing semantic concepts.
  6.  **Necessary Conditions for Realism:** For a representation claim to be worth making, the identified variables must support counterfactual predictions about network behavior on out-of-distribution inputs better than a holistic model of the layer state, and they must exhibit stability across different training runs or architectures solving the same task.

  ***

  ### Part II: Disagreements Table

  | Disputed Claim | Realist Formulation | Deflationist Formulation | Note on Difference |
  | :--- | :--- | :--- | :--- |
  | **Privileged Decomposition** | The training process breaks symmetry, selecting a specific basis that corresponds to the actual causal variables the network utilizes to minimize loss. | Any decomposition is one among many equally well-behaved bases; the selected basis is privileged only by the convenience of the sparsity penalty and human legibility. | Realists appeal to *training dynamics* as a selection mechanism; Deflationists appeal to *functional equivalence* across bases. |
  | **Semantic Content** | The recovered directions carry content about the world (e.g., "French," "Polite") because they track environmental regularities that causally drive the network's success. | The directions are empty vectors; "content" is a story humans project onto the vector because steering it produces outputs humans associate with that label. | Realists treat content as *intrinsic* to the variable's role; Deflationists treat content as *extrinsic* attribution by the observer. |
  | **Causal Role** | Activating a feature direction is the specific mechanism by which the network encodes that information; the feature is a cause of downstream behavior. | The whole layer state is the cause; the feature is a convenient slice of that state. Steering works because it shifts the whole state, not because the feature is a distinct causal unit. | Realists view features as *components*; Deflationists view features as *projections* of a holistic state. |
  | **Method Convergence** | Different interpretability methods (e.g., probing, clustering, autoencoding) will converge on the same underlying variables because they are tracking the same reality. | Different methods will find different structures that reflect the inductive biases of the methods themselves, not a shared underlying truth. | Realists expect *convergence on truth*; Deflationists expect *divergence based on tool bias*. |

  ***

  ### Part III: Crux Table

  | Sub-Question | Test, Case, or Argument | Realist Prediction | Deflationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **(a) Change-of-Basis** | Given any invertible linear map on a layer's activation space, one can insert it upstream and its inverse downstream without changing input-output function. Does this imply no decomposition is privileged? | The optimization trajectory during training breaks this symmetry. The network settles into a specific basis because gradient descent favors certain geometric configurations over others. | Functional equivalence implies ontological equivalence. If the function is unchanged, claiming one basis is "real" is metaphysical excess. The network uses the subspace, not the basis. |
  | **(b) Illegible Ground Truth** | In the synthetic case, make true latents deliberately illegible to humans (e.g., random linear functionals, dense, entangled). Does the pipeline recover them? | The pipeline will recover the true latents even if humans cannot name them, because the network must track them to solve the task. | The pipeline will fail to recover them or will find human-legible proxies instead, because the sparsity penalty favors human-comprehensible structures over true dense latents. |
  | **(c) Untrained-Network Control** | Apply the pipeline to a network trained on shuffled tokens (preserving activation statistics but destroying syntax/semantics). Does it find "features"? | It will find directions, but they will lack causal efficacy on meaningful tasks and will not generalize, distinguishing them from semantic features. | It will find directions with identical mathematical properties to the trained network. Any difference is merely in the human story attached, not the structure itself. |
  | **(d) Cross-Model Transplant** | Take a direction from Network A and steer Network B (same architecture, different data/seed) without refitting. Does it produce predicted behavior? | Successful steering will occur without refitting because semantic features are universal across models solving similar tasks. | Steering will fail or require significant refitting. Features are idiosyncratic to the specific geometry of Network A's activation space. |
  | **(e) Compression/OOD** | Does the decomposition predict behavior on inputs unlike those used to fit it (OOD) better than a holistic layer model? | Yes. A correct decomposition captures the invariant mechanisms of the network, allowing compression and prediction on novel data. | No. Feature talk is a shorthand for the training distribution. On OOD data, the holistic state retains predictive power while feature interpretations break down. |

  ***

  ### Part IV: Retraction Conditions

  **Realist Retraction Condition:**
  I will abandon the claim that recovered directions are causally efficacious variables if the **Cross-Model Transplant** test fails consistently. If a direction identified as "politeness" in one model cannot steer a second model of the same architecture without refitting, then the direction is a model-specific artifact rather than a universal representational variable. Furthermore, if the **Illegible Ground Truth** test shows the pipeline systematically fails to recover true latents when they are not human-legible, I will concede that the method tracks human bias rather than network structure.

  **Deflationist Retraction Condition:**
  I will abandon the claim that feature talk is merely a harmless shorthand if the **Compression/OOD** test demonstrates that a sparse feature decomposition predicts out-of-distribution behavior significantly better than a holistic model of the layer state. If the decomposition allows for accurate counterfactual predictions in regimes where the holistic model fails, this implies the decomposition has captured invariant causal structure rather than merely compressing the training distribution. Additionally, if the **Illegible Ground Truth** test shows successful recovery of dense, human-illegible latents in the synthetic case, I will concede that the pipeline tracks structure independent of human narrative.

  ***

  ### Part V: Closing and Next Steps

  **Verbal vs. Substantive Disputes**
  We identify a verbal dispute regarding the definition of "representation." The Realist uses the term to denote a variable that plays a specific causal role in the mechanism. The Deflationist uses the term to denote a variable that carries semantic content interpretable by a human observer. Much of our disagreement dissolves if we distinguish between *mechanistic variables* (Realist focus) and *interpretable features* (Deflationist focus). However, a substantive dispute remains regarding whether the mechanistic variables align with the interpretable features, and whether the decomposition is unique or arbitrary. The substantive core is whether the network's computation is modular enough to support local causal claims, or whether it is holistic such that local claims are systematically misleading.

  **Commitments**
  For the substantive parts of the dispute, this collaboration commits to executing the **Illegible Ground Truth** and **Cross-Model Transplant** tests within the next six months. We agree to pre-register the specific metrics for "successful recovery" and "successful steering" to prevent post-hoc adjustment of goalposts. The results of these tests will be adjudicated by a third party blind to our respective predictions. If the Realist's predictions hold, we will jointly publish a paper arguing for the ontological status of neural features. If the Deflationist's predictions hold, we will jointly publish a paper arguing for methodological caution and holistic explanation. We agree not to cite these results as settled until the data is collected.
