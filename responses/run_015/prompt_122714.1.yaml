answer: |-
  Bernard Williams' philosophical commitments, particularly his critique of the "morality system" and his rehabilitation of shame in *Shame and Necessity*, provide a specific lens for this dispute. He distinguishes between "morality" (a specialized system of obligation, guilt, and universal rules) and "ethics" (the broader question of how to live and what kind of person to be). Your friend's position relies on the morality system: a rule existed (plagiarism), detection improved, and therefore compliance increased. This is a model of guilt and enforcement. Your position relies on ethics: a shift occurred in what constitutes a credible identity as a writer or scholar, triggering a loss of face. This is a model of shame and honor.

  Williams would likely reject your friend's claim that nothing new happened morally, not because he believed AI text is inherently sinful, but because he denied that moral change is primarily driven by the force of argument. In his view, rational arguments are usually post-hoc rationalizations for shifts in social sentiment. If the arguments against passing off AI text were available for years but the stigma only crystallized recently, Williams would argue that the *arguments* did not cause the *stigma*. Rather, a change in the social visibility of the act allowed a pre-existing ethical intuition to crystallize into a code. The delay between the availability of the technology and the arrival of the shame is the critical datum. For Williams, if reason were the driver, the stigma should have correlated with the publication of the arguments, not the deployment of detection tools.

  Regarding the "missing peer group" objection: Williams does not require a landed gentry for an honor code to function. He requires an "ethical community" whose opinion matters to the agent's self-conception. Universities and newsrooms function as such communities. They confer status, titles, and platforms. To be a "professor" or "journalist" is to hold a social identity that relies on specific thick ethical concepts—integrity, voice, authority. If the community decides that using AI violates the terms of that identity, the mechanism is honor, regardless of whether the members wear suits or tweed. The fact that institutions enforce the rule does not negate the honor dynamic; institutions are often the bureaucratic codification of a prior shift in collective shame.

  Regarding the "missing immorality" objection: Williams would argue that your friend is looking for a violation of *obligation* (guilt) when the phenomenon is a violation of *identity* (shame). One can feel deep shame without believing one has committed a mortal sin. The stigma attaches to "authenticity," which is a thick ethical concept. If a writer passes off AI text, they are not necessarily harming a victim in the utilitarian sense, but they are falsifying their relation to their work. For Williams, this is an ethical failure, even if it is not a "moral" crime in the narrow Kantian sense. The protection of paid work (interest) may be the material substrate, but interest alone does not generate *disgrace*. Disgrace requires that the act be seen as lowering the agent's status in the eyes of others they respect.

  However, Williams' framework would strain at the speed and fragmentation of this shift. Traditional honor codes (like dueling) took generations to dissolve; an eighteen-month turnover suggests a digital acceleration that Williams did not anticipate. Furthermore, he might worry that if the "honor" is entirely dependent on institutional policy rather than a shared conception of the good life, it is fragile—more about compliance than integrity. He might characterize this as a "thin" honor code, easily manipulated by power, rather than a robust ethical revolution. Yet, he would still identify the *mechanism* of the change as social-psychological (shame) rather than rational (argument).

  Ultimately, Williams would side with the view that the stigma preceded the rationalization. He would argue that the detection tools did not create the norm; they made the violation visible enough to trigger the shame mechanism inherent in the professional identity. The arguments followed to justify the feeling. This aligns with the view that large ethical shifts are driven by changes in what one can do without losing face.

  \answer{honor-first}
