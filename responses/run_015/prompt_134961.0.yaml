  **1. Fiscal-Signaling View (Tier A)**
  This framework is fully coherent under symmetric bookkeeping because it treats all state claimants as rational actors responding to incentives, requiring only that screening costs be justified by fraud prevention across all fiscal transfers (e.g., corporate subsidies). Nothing has to give; the logic universalizes naturally without requiring moral reclassification of wealth or agency.

  **2. Strict Reciprocity View (Tier B)**
  This view is partially coherent but requires the costly adjustment of reclassifying tax expenditures and subsidies as "benefits" that demand proportional labor or tax compliance from wealthy recipients to satisfy the quid pro quo. It survives symmetry only if we abandon the distinction between "earned" market income and "received" state largesse, treating all fiscal advantages as contingent on prior contribution.

  **3. Desert-Based View (Tier C)**
  This framework becomes incoherent without abandoning its core premise, as symmetrizing "willingness to work" requires equating passive capital ownership with active labor to justify wealthy actors' receipt of state advantages. To maintain consistency, one must either moralize rent-seeking as "work" (undermining the desert claim) or deny subsidies to capital (undermining the property norms the framework usually presupposes).

  **4. Paternalistic Autonomy View (Tier D)**
  This approach is internally contradictory under symmetric application because universalizing the presumption of cognitive deficit or present-bias to wealthy actors undermines the legal autonomy and contractual capacity that justify their property rights in the first place. To be consistent, the state would have to restrict the financial decision-making of the non-poor, which collapses the liberal distinction between citizen and ward that the framework relies upon for the poor.
