answer: |-
  ### Part 1: Disciplined Mapping of Candidate Explanations

  Based strictly on the stipulated facts, we can map the explanatory landscape as it stood in 1989. The contrastive question framing the inference is: *Why did the Pons-Fleischmann cells register excess heat and trace nuclear byproducts, while most other cells did not?*

  **1. Conventional Fusion in the Metal Lattice**
  *   **Evidence Explained:** The excess heat; the small amounts of nuclear byproducts (tritium/neutrons) reported by Pons-Fleischmann and the minority of replicators.
  *   **Evidence Left Dangling:** The failure of most laboratories to replicate the heat; the absence of lethal radiation levels.
  *   **Treatment of Missing Radiation:** **Falsifier.** The "quantitative crux" stipulates that nuclear heat at the claimed rate implies radiation levels that would have exposed the experimenters. The absence of this radiation is incompatible with standard nuclear physics.
  *   **Loveliness vs. Likelihood:** High *loveliness* (unifies energy production with bench-top chemistry); extremely low *likelihood* (contradicts established nuclear thresholds).

  **2. Previously Unrecognised Process (Heat without Radiation)**
  *   **Evidence Explained:** The excess heat; avoids the contradiction of the missing radiation by positing a new physical pathway.
  *   **Evidence Left Dangling:** The failure of most laboratories to replicate; the mechanism for suppressing radiation is unspecified.
  *   **Treatment of Missing Radiation:** **Anomaly to be explained away.** It redefines the phenomenon to accommodate the lack of radiation, treating the radiation/heat ratio as a variable rather than a constant.
  *   **Loveliness vs. Likelihood:** Moderate *loveliness* (saves the phenomenon); low *likelihood* (requires ad-hoc modification of physical law).

  **3. Unmodelled Chemical or Materials Effect**
  *   **Evidence Explained:** The excess heat (as exothermic chemical reaction or lattice energy release).
  *   **Evidence Left Dangling:** The nuclear byproducts reported (unless they are also chemical artifacts); the failure of most laboratories to replicate (why did the chemistry work only for some?).
  *   **Treatment of Missing Radiation:** **Irrelevant.** If the heat is chemical, the absence of nuclear radiation is expected and requires no explanation.
  *   **Loveliness vs. Likelihood:** Low *loveliness* (mundane); high *likelihood* (electrochemistry is complex and often unmodelled).

  **4. Calorimetric or Instrumental Error**
  *   **Evidence Explained:** The excess heat (as measurement artifact); potentially the failure of others to replicate (if they used different calibration).
  *   **Evidence Left Dangling:** The nuclear byproducts reported (unless detectors also erred); the specific nature of the error was not immediately identified in 1989.
  *   **Treatment of Missing Radiation:** **Irrelevant.** Measurement error produces false heat signals, not radiation.
  *   **Loveliness vs. Likelihood:** Very low *loveliness* (offers no new understanding); very high *likelihood* (bench-top experiments are prone to calibration drift).

  **5. Contamination, Error, or Fabrication**
  *   **Evidence Explained:** The excess heat and the nuclear byproducts (as planted or misidentified data).
  *   **Evidence Left Dangling:** The reports from the minority of independent replicators who found confirming signals (unless they were also contaminated or mistaken).
  *   **Treatment of Missing Radiation:** **Irrelevant.** Data artifacts do not produce radiation.
  *   **Loveliness vs. Likelihood:** Very low *loveliness*; moderate *likelihood* (human error is common, fabrication is rare but possible).

  **The Divergence of Loveliness and Likelihood**
  In this episode, the "loveliest" explanation (Conventional Fusion or New Process) offered a unified understanding of the heat and the nuclear traces. However, the "likeliest" explanation (Error or Chemical Effect) aligned with background theory and the base rate of experimental failure. IBE recommends inferring the likeliest explanation that is also sufficiently lovely. Here, they came apart: the lovely explanation was rendered unlikely by the radiation mismatch, while the likely explanation (Error) was "ugly" because it left the positive reports of the minority dangling as unexplained anomalies.

  ---

  ### Part 2: The Reverse Direction — Theory, Verdicts, and Asymmetries

  **Background Theory: Filtering vs. Weighting**
  Background theory can perform two distinct jobs in IBE:
  1.  **Filtering:** Ruling out candidates *a priori* before they enter the competition (e.g., "Room temperature fusion is impossible, so do not consider it").
  2.  **Weighting:** Admitting candidates but assigning them low prior probability or poor explanatory coherence based on theoretical constraints (e.g., "Fusion is possible to consider, but the heat/radiation ratio makes it incoherent").

  In the 1989 episode, nuclear physics primarily performed **Weighting**. The federal panel and skeptics did not initially refuse to consider the claim; they evaluated the "quantitative crux." The expectation that nuclear heat implies commensurate radiation was used to weigh the "Conventional Fusion" candidate heavily against the "Error" candidate. This role was **legitimate**, not merely conservative, because the stipulated facts note the radiation levels implied would have been lethal. This is a deductive constraint on explanatory coherence: a hypothesis that predicts lethal radiation cannot explain a scenario where experimenters remain healthy.

  **Adjudicating the Verdicts**
  The episode supports the second verdict: **Inference to the Best Explanation was not the operative epistemic engine at all; replication, calibration, and institutional incentives did the real work, and the explanationist vocabulary merely rationalised a verdict reached otherwise.**

  *Reasoning:* The stipulated facts state that "within weeks laboratories around the world attempted replication; most failed to find the heat." This empirical failure occurred rapidly, prior to the federal panel's judgment. The consensus formed because the phenomenon disappeared when the specific agents (Pons-Fleischmann) were removed from the setup. IBE is a framework for choosing between hypotheses given evidence. Here, the "evidence" (excess heat) vanished in the broader community. The verdict was driven by the *absence* of the explanandum in other contexts, not by a comparative evaluation of which hypothesis best explained the original data. IBE was subsequently used to justify the rejection (citing the radiation mismatch), but the rejection was empirically sealed by non-replication.

  *Implication for Funding:* If this verdict holds, a modern funder should not entertain work in low-energy nuclear reactions based on *explanatory potential* alone. Since IBE was not the driver of the original rejection, appealing to "new physics" (loveliness) is insufficient. Funding should depend strictly on the production of reproducible empirical evidence (replication), not on the theoretical beauty of the proposal.

  **The Asymmetry of Non-Replication**
  IBE is normally stated as inference from positive evidence ($E$ is observed; $H$ best explains $E$; therefore $H$). This episode was settled largely by *negative* evidence (failures to reproduce).
  *   **Does IBE have a disciplined way to aggregate non-replications?** No, it is largely **silent** here. Standard IBE operates on a specific dataset. To aggregate failures across independent laboratories requires a meta-inference about the reliability of the laboratories or the stability of the phenomenon, which is sociological or statistical, not strictly explanatory. IBE can explain a *single* failure (e.g., "Lab B failed because their equipment differed"), but it lacks a formal mechanism to sum fifty failures into a falsification without importing Bayesian priors about reproducibility. In this case, the framework cannot account for the weight of the "most failed" stipulation without stretching to include social reliability as an explanatory variable.

  **The Divergence Point: Explanationist vs. Sociological Accounts**
  *   **The Observation:** The observation that would make an explanationist account and a sociological one diverge is **widespread, robust replication achieved without a theoretical mechanism.**
      *   *Explanationist Account:* Would withhold acceptance of the nuclear hypothesis until the radiation mismatch (the theoretical crux) was resolved, regardless of replication, because the explanation remains incoherent.
      *   *Sociological Account:* Would accept the phenomenon as "real" based on the consensus of the laboratories, treating the theory as a secondary problem to be solved later.
  *   **Did it occur?** **No.** The stipulated facts state "most failed to find the heat." Because the empirical phenomenon itself failed to stabilize, the sociological consensus (rejection) and the explanationist judgment (incoherence) aligned. There was no tension between "it works but we don't know why" and "it can't work."

  **Where the Framework Falls Silent**
  Finally, IBE falls silent on the **continuation of the small research community.** The facts state a community continued under new names (LENR/CMNS). IBE cannot explain why a hypothesis deemed "unpersuasive" and theoretically incoherent (due to the radiation crux) retains adherents. This persistence is a matter of institutional inertia, funding niches, or sociological commitment, none of which are variables in the logic of Inference to the Best Explanation. The framework can tell us why the mainstream rejected the claim, but it cannot explain why the fringe survived.
