  Priya is also correct that Neglectedness is a poor proxy for Additionality. Neglectedness asks "Is anyone else funding this?" Additionality asks "Would this happen without us?" Option A illustrates this divergence. The state has committed to 60% of the lines. Technically, the cause is not neglected. However, the state timeline is slow, and a matching window closes in ten weeks. Our funding unlocks immediate state dollars and accelerates remediation for specific households. The health benefit occurs sooner, which has independent value. While Priya's proposal to replace Neglectedness with a Counterfactual Addition factor is conceptually superior, adopting it mid-cycle introduces too much variance. We need a heuristic that captures her insight without rewriting our framework overnight.

  I propose we adopt the uncertainty penalty for this cycle. We shrink each sub-score toward the mean (3) in proportion to how much relies on unverifiable guesswork. This addresses Dan's concern by penalizing B's vague metrics. It also addresses Priya's concern by penalizing A's additionality uncertainty, though less severely than B. This method ensures we do not reward causes simply because they are hard to measure, nor do we penalize causes simply because they are complex. It forces us to distinguish between intrinsic complexity and our own laziness in diligence. In this case, B's complexity is intrinsic to the model theory of change, while A's uncertainty is largely temporal.

  Under this adjusted model, Option C remains stable. Its data is solid, verification is cheap, and outcomes are known. However, its ceiling is low. Half the local Rotary clubs fund this program. Our marginal dollar does less good here because the cause is saturated. We are buying certainty, but at a high opportunity cost. For a foundation of our size, playing small in a crowded field contradicts our mandate to seek high-impact opportunities. We should not write a $700,000 check to a program that could easily absorb funding from local donors who care more deeply about the specific institution than we do.

  Option A emerges as the robust choice. Even with a discount for additionality uncertainty, its base scores on Importance and Tractability are grounded in evidence, not speculation. Lead exposure has permanent cognitive costs; remediation is permanent. The state match provides leverage—every dollar we spend pulls in state funds, increasing Tractability. The ten-week window creates a temporary state of neglectedness; if we don't act, that specific batch of remediation is delayed by years. This timing constraint resolves the additionality worry partially: we are buying speed, which the state is not providing. Accelerating health outcomes for vulnerable children is a distinct good, even if the state eventually arrives at the same destination.

  Therefore, I recommend funding Cedar Vale lead remediation at $400,000. This amount is sufficient to clear a significant cohort of housing units and maximize the state match without exhausting our entire unrestricted pool. We retain $300,000 for operational flexibility or smaller responsive grants. Funding B is too risky given the measurement artifacts Dan identified. Funding C is too crowded to justify a flagship grant.

  Regarding our process: we should not discard ITN, but we must refine it. For the next cycle, we will integrate Priya's Counterfactual Addition factor as an explicit modifier to the Neglectedness score. We will also formalize the uncertainty penalty. Scores based on verified data remain unchanged; scores based on expert judgment alone must be discounted. This prevents us from rewarding vagueness while maintaining our commitment to evidence. We must ensure our scoring sheet measures the world, not our confidence in our own guesses.

  We cannot commission more diligence before Friday. We must decide on the information we have. On balance, A offers the highest confidence of tangible good per dollar, leveraged by state funds, with a unique timing advantage that mitigates the additionality risk.

