  To: Program Committee
  From: Program Committee Member
  Date: October 24, 2023
  Subject: Decision Memo: Cycle 4 Unrestricted Grant Allocation

  We convene this Friday to allocate up to $700,000 from our unrestricted pool. Three finalists remain: Cedar Vale lead remediation (A), the Sable Index (B), and the Community College scholarship program (C). Our standard ITN scoring sheet ranks B highest, followed by A, then C. However, raw scores obscure critical risks regarding measurement error and counterfactuals. This memo recommends adjusting our scoring for uncertainty and awarding $400,000 to Cedar Vale (A).

