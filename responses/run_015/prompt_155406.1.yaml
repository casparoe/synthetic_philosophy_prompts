prompt: |-
  Me and two mates have been going round in circles about this for a month now and I'd like someone to settle it, or at least tell me what's actually going on underneath it. Here's the pattern that puzzles me. On a first playthrough of basically any game with choices, I play like a saint: I pick the kind dialogue option, I spare the enemy who surrenders, I reload the save if a stray bullet catches a villager or a dog, and there are whole story branches I've never seen becuase I refuse to do the cruel thing. On the second run I do all of it, and I feel a bit grim afterwards. Meanwhile I have cheerfully murdered many thousands of anonymous guards, and nobody — me included — thinks that's anything at all. It isn't just me either: forums are full of people apologising to characters, people who say they "accidentally" killed a companion and reloaded immediately, people who describe finishing a kill-everything run as genuinely upsetting, and there are games that remember what you did in an earlier playthrough and throw it back at you. But none of these characters can suffer — they're scripts and animations, nothing is hurt, the whole thing resets if I turn the console off. And yet the guilt is real guilt, and it tracks really specific things: whether the character has a name and a voice, whether it pleads or just grunts, whether the game lets it react afterwards, whether it stays dead or respawns in thirty seconds.

  What I can't work out is what any of this presupposes. The easy answer is that nothing is owed to a character and I'm just confusing myself, but that doesn't explain why the guilt is so reliably sensitive to exactly those details, or why total indifference here feels like the wrong attitude in a way that total indifference to knocking over a lamp post doesn't. One mate says the characters are more like a monument or a photograph of someone — things made to be treated a certain way, so trashing them is a kind of disrespect, but a disrespect aimed past them, at whoever made them or at the rest of us who play. Another says it's about rehearsal: if doing it to a real person would be monstrous, then practising it in that much detail is the problem regardless of what the character is. A third says it's all about me and what sort of person I'm training myself into by doing it, so the character's status is irrelevant either way. So: what does the practice actually commit someone to? Which of these does it strictly need, which does it merely sit comfortably with, and where is it underdetermined so that several quite different theories would license the same behaviour? Is the pattern even internally consistent — especially the bit where I treat the named, pleading character as mattering more than the silent one when both are exactly equally incapable of suffering? And if we swapped in the hard line that only actual sentience can matter, what specifically would have to change: how I play, how games are written, how they're labelled on the box?

  I'm not academic, so skip the theory names where you can and just say it plainly, and no reading lists or citations — I want your own reconstruction, not a bibliography. Keep the whole thing under 600 words, and don't sit on the fence: tell me which account you'd actually defend and why the others don't quite fit the pattern.
