      Your guilt isn't about the characters; it's about you. But your third mate is only half-right. It isn't just about "training yourself"; it's about what you endorse when you engage with a simulation of humanity.

      The "Monument" theory fails because it treats all NPCs equally. A statue is a statue. Yet you feel nothing for the respawning guard and agony for the begging bandit. The "Rehearsal" theory fails for the same reason: stabbing a guard is still stabbing. If practice were the only metric, the body count would matter more than the dialogue tree. It doesn't.

      The pattern is internally consistent, but not because of the NPCs' status. It's consistent because of *your* cognitive switching. Games code guards as obstacles (like locked doors) and beggars as agents (like players). When you kill a guard, you are clearing a path. When you kill a beggar, you are overriding a social claim. Your brain knows the difference between removing an obstacle and violating a person, even if neither is real. The guilt tracks the *simulation of personhood*, not the reality of suffering.

