answer: |-
  Your third mate is closest, but misses why the gradient exists. The "Monument" theory fails because it treats all NPCs equally; a statue is a statue, yet you feel nothing for the respawning guard and agony for the begging bandit. The "Rehearsal" theory fails because stabbing a guard is still stabbing. If practice were the only metric, the body count would matter more than the dialogue tree. It doesn't.

  I defend a refined version of the third account: it is about self-formation, but specifically about *habits of recognition*. The pattern is internally consistent because your brain isn't reacting to suffering (none exists); it is reacting to *simulated agency*. Games code guards as obstacles (like locked doors) and beggars as agents (like players). When you kill a guard, you are clearing a path. When you kill a beggar, you are overriding a social claim. Your guilt tracks the simulation of personhood, not the reality of harm.

  So, what does the practice commit you to? It commits you to recognizing that engaging with moral simulations shapes your responses to moral cues. You aren't hurting the code; you are habituating yourself to ignore certain social signals. When you spare the beggar, you reinforce the habit of listening to pleas. When you execute them, you reinforce the habit of overriding them. The guilt is the friction of acting against your own social wiring. You are not respecting the NPC; you are respecting your own capacity for empathy.

  If we took the hard line that only actual sentience matters, the guilt should vanish. To make that true, one of two things must change. Either games stop simulating personhood—no voices, no pleading, no names, just health bars and hitboxes—or players must learn to dissociate completely, treating every pixel as a lamp post. The latter is impossible for social animals; we are hardwired to respond to faces and voices. So the former must happen: games would need to be stripped of social cues to be ethically neutral. They would need warning labels not for violence, but for *social simulation*.

  The "Scum" run feels grim because you aren't mourning the dead code; you are feeling the callousness of your own response. The practice commits you to the fact that you cannot simulate cruelty without touching the part of you that recognizes it. The character's status isn't irrelevant; it determines *which* part of you is being trained. Killing guards trains combat efficiency. Killing friends trains social betrayal. That is why the guilt is specific, reliable, and real, even if the victim is not.
