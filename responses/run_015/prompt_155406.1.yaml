      *   The guilt isn't about the *object* (the NPC) having rights, nor purely about *rehearsal* (since we kill guards). It's about *recognition of simulated humanity*.
      *   The game designers build specific triggers (voice, pleading, name) to hack our empathy systems. When we respond, we are acknowledging the *intent* of the simulation.
      *   The "Saint vs. Scum" pattern reveals that we treat the game as a *moral sandbox*. The guilt comes from violating the *contract of simulation*. When an NPC pleads, they simulate a moral claim. Ignoring it feels like a betrayal of the social instinct, even if intellectually we know it's code.
      *   The anonymous guards are treated as *obstacles*, not agents. The pleading NPCs are treated as *agents*.
      *   *Decision:* I will defend a modified version of Mate 3 (Self-Formation), but grounded in the *response to simulated agency*. It's about what you endorse when you engage with the simulation.

