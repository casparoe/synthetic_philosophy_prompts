  1.  **Reducing existential risk:** Survival remains the binary prerequisite for any future value, though its marginal utility is capped if the resulting future is subject to value-draining expansionary dynamics.
  2.  **Reducing suffering/lock-in:** Preventing astronomical suffering retains significant weight, but stable lock-in is less tractable if competitive expansion pressures inevitably break static institutional constraints.
