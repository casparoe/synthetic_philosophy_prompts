answer: |-
  **ETHICS 450: FINAL EXAMINATION**
  **Time Allowed:** 45 Minutes
  **Word Count:** 800–1000 Words
  **Instructions:** Answer the following question. You do not need to include a bibliography. Please ensure all arguments are clearly structured. You may recieve partial credit for incomplete arguments if the logical progression is sound.

  **Prompt:**

  Consider the "institutional residue problem": the claim that acts traditionally classified as supererogatory (heroic, saintly) are often merely absorbing costs that a functioning institution should have borne. On this view, the hero is a symptom of systemic failure. Conversely, if institutions were perfect, extreme self-sacrifice might appear reckless rather than virtuous.

  Defend **one** of the following positions:
  **(A)** Supererogation is entirely relative to institutional failure; in a perfect system, it collapses into either duty or folly.
  **(B)** Supererogation is a matter of personal virtue regardless of institutional context; the agent's motive overrides systemic conditions.
  **(C)** Institutional context changes the *kind* of praise an act recieves without changing the moral *status* of the act itself.

  Your essay must explicitly address two objections:
  1.  **The Moral Residue Objection:** Arguing that Position (A) reduces saints to "system janitors," stripping heroism of its normative force.
  2.  **The Cost-Internalization Problem:** Arguing that Position (B) ignores that institutions exist precisely to distribute burdens fairly, making individual heroism potentially unjust.

  ***

  **MODEL ANSWER**

  **Title:** The Contextual Valence of Supererogation: A Defense of Position (C)

  The classification of supererogatory acts—those good deeds performed beyond the call of duty—often relies on an abstracted agent operating in a vacuum. However, the "institutional residue problem" suggests that what we call heroism is frequently labor absorbed by individuals due to institutional gaps. A firefighter rushing into a burning building is heroic, but if the building code was enforced and sprinklers installed, the rescue might not be necessary. This essay defends Position (C): institutional context alters the qualitative praise an act deserves without negating its supererogatory status. This hybrid view avoids the reductionism of Position (A) and the naivety of Position (B).

  Position (A) argues that supererogation collapses in a perfect world. If institutions bore all necessary costs, extreme sacrifice would be either mandatory (duty) or unnecessary (folly). While this highlights the structural origins of risk, it fails to account for the agent's moral psychology. Position (B) counters that virtue is internal; a saint remains a saint even in a utopia. However, this ignores the social function of institutions, which is to prevent the need for sacrifice. Position (C) synthesizes these insights. It maintains that the act remains supererogatory because it exceeds strict obligation, but the *nature* of the praise shifts from "heroic rescue" to "generous excess" depending on the institutional backdrop.

  To defend (C), one must address the Moral Residue Objection. Critics of (A) argue that viewing saints as "system janitors" is demeaning; it implies their virtue is merely a patch for bureaucratic failure. If we accept (A), the moral residue of the system stains the agent, turning admiration into pity. Position (C) resolves this by decoupling the act's status from the system's failure. Even if the rescue was necessitated by poor safety codes (institutional failure), the agent's willingness to incur risk remains morally distinct from duty. We praise the agent not merely for fixing the system, but for exhibiting a will that exceeds contractual obligation. The "janitorial" aspect explains the *cause* of the opportunity for virtue, but not the *value* of the virtue itself. Thus, the saint is not reduced to a cleaner; they remain an agent of surplus goodness, even if the mess was institutional.

  Conversely, Position (C) must also answer the Cost-Internalization Problem leveled against Position (B). If we claim virtue is context-independent, we risk glorifying a system that relies on individual sacrifice rather than fair burden distribution. If institutions exist to internalize costs and distribute risk fairly, celebrating individual heroism might let the institution off the hook. Position (B) ignores this political dimension. Position (C) accommodates it by modulating the praise. In a broken system, we praise the hero but simultaneously critique the institution that necessitated the risk. In a perfect system, we praise the agent for generosity, not necessity. This dual-track evaluation ensures that recognizing individual virtue does not absolve institutional responsibility. We can acknowledge the supererogatory act without endorsing the conditions that made it required.

  Consider the case of diving into a frozen lake. In a world without lifeguards or barriers (institutional failure), the dive is heroic residue. In a world with perfect safety (institutional success), the dive might be reckless. Position (C) allows us to say the moral status (supererogatory vs. reckless) depends on the reasonable expectation of safety, but the praise for the willingness to help remains constant in form, though varied in intensity. The act is still "beyond duty," but the duty baseline shifts with institutional competence.

  Ultimately, Position (A) is too cynical, stripping agency of meaning, while Position (B) is too abstract, ignoring political reality. Position (C) offers a robust framework where supererogation survives institutional analysis. It acknowledges that while institutions should minimize the need for sacrifice, the human capacity to exceed requirements remains a distinct moral category. By separating the *status* of the act from the *context* of the praise, we preserve the value of virtue without masking systemic injustice. This ensures that ethics remains sensitive to both the agent's character and the structure of their world.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  | Must-Hit Move | Marks | Common Failure Mode |
  | :--- | :---: | :--- |
  | **1. Thesis Commitment:** Clearly selects and defines one of the three positions (A, B, or C) without equivocation. | 5 | Student hedges between positions or defines supererogation generally without picking a stance on the institutional frame. |
  | **2. Institutional Engagement:** Explicitly utilizes the "institutional residue" framing rather than treating supererogation in a vacuum. | 5 | Student writes a generic essay on heroism that could apply to any ethics class, ignoring the specific "system janitor" prompt. |
  | **3. Moral Residue Objection:** Directly addresses the objection that Position (A) reduces saints to janitors and explains how their chosen position handles it. | 5 | Student mentions the objection but fails to explain how their position solves the "demeaning" aspect of the janitor analogy. |
  | **4. Cost-Internalization Objection:** Directly addresses the objection that Position (B) ignores fair burden distribution and explains the institutional role. | 5 | Student treats institutions as background scenery rather than active distributors of burden, missing the "unjust" implication. |
  | **5. Synthesis/Coherence:** Conclusion demonstrates how the two objections are reconciled within the chosen position without contradiction. | 5 | Student addresses objections in isolation but offers a conclusion that contradicts one of the earlier defenses. |

  **Grading Note:** A student who merely defines supererogation as "going beyond the call of duty" without engaging the institutional residue framework cannot score higher than 10/25 (C- range), as they will fail Moves 2, 3, and 4. To achieve an A (20+), the student must demonstrate how the institutional context actively modifies the moral evaluation.
