          *   Okay, I will note the arithmetic verification carefully.

  4.  **Identify the Philosophical Phenomenon:**

      *   This is the **Doctrinal Paradox** (or **Discursive Dilemma**).
      *   Origin: Kornhauser & Sager (1986, 1993) regarding appellate courts.
      *   Structure: Proposition-based aggregation (Premise-based) vs. Conclusion-based aggregation.
      *   Impossibility Result: List & Pettit (2002) "Aggregating Sets of Judgments". An analog of Arrow's Theorem for judgment aggregation.
      *   Marcus is correct about the name and the existence of impossibility results.
      *   Ingrid is correct that it applies beyond courts (any multi-member body with logical constraints).

  5.  **Evaluate Specific Claims:**

      *   **Ingrid: "Board decides outcomes, not beliefs."**
