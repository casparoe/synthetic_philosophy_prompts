      *   Let's look at (4). The user wants their *novel* to be unresolved. This is an artistic goal. It conflicts with (3) because if the source material (in the user's view) has a "decisive refutation," modeling the novel on "unresolved" requires ignoring that decisiveness.

      *   **The Core Conflict:** View (3) claims the text provides a solution (Christ wins). View (4) claims the text (or at least the user's adaptation) should have no solution. View (5) claims the author intended the *other* guy (Inquisitor) to win (or be the deeper truth).
