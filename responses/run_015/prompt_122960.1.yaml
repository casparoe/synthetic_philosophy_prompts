  *(Refining the "Apology" point)*: If I apologize, I admit fault. If I did what I ought (all things considered), where is the fault? The Anti-Dilemmist says the fault is in the *world*, not the *will*. The Dilemmist says the fault is in the *action* (violating one obligation) even if *chosen* (to fulfill another). This is the crux.

