          *   The "Apology" point: This is the "Argument from Residue." It doesn't settle it because the friend can reinterpret residue (Agent-Regret vs. Guilt).
      *   **Substantive Hidden Disagreements:**
          *   *Agglomeration:* This is the technical core. $O(A) \land O(B) \to O(A \land B)$. If you deny this, you change deontic logic.
