          *   *Resolution:* Either change verdict (7d) to Permissible, or restrict (4) to exclude collective action cases where individual contribution is negligible (free rider problem?). Or rely on (3) (public harm risk).

  4.  **Synthesize and Structure the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the package. It's not "held together by luck," but it has specific fault lines.
      *   **Severity Ranking:**
          1.  (1) vs. (4) [The Definition of Justification]
          2.  (3) vs. (4) [The Scope of Wrongness]
