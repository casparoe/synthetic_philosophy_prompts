  3. Give a mark out of 20, with a breakdown by part and a one-line justification for each part-mark. Do not round generously.

  4. Give inline comments keyed to specific sentences or claims in the script (identify them precisely enough that I could paste them into the margin). For each flagged passage, label it as: clearly mistaken / defensible but needs qualification / correct and creditworthy. I especially want to know whether the candidate's inference from part (a) to part (b) actually goes through, and whether their treatment of A's situation in Y is legitimate or merely a relabelling.

  5. Say what a genuinely strong answer to (b)(ii) would have added that this one omits — in particular, say what the candidate's own numbers imply about RP and the Pareto principle, and whether the candidate's closing remark about Y and Z establishes what they think it establishes.

  6. End with a model answer sketch for (b)(ii), of no more than 200 words, written as if for the answer sheet.

  Where a claim is straightforwardly wrong, say so plainly rather than presenting both readings as reasonable; where it is defensible but imprecise, say exactly what the needed qualification is. Assume no access to library or web resources: everything needed is contained in the question above.
