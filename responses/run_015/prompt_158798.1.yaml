  ### 1. Marking Scheme

  **Part (a) [8 marks]**
  *   **Levelling-down objection (LDO) defined [2]:** Must state that LDO objects to views implying an outcome can be better (in some respect) solely because it is more equal, even if some are worse off and no one better off.
  *   **Egalitarianism fails [2]:** Must explain that telic egalitarianism values the pattern (equality) as a separate good, independent of individual well-being levels.
  *   **Prioritarianism escapes [3]:** Must explain that weights depend on *absolute* levels; all weights are positive; therefore, a Pareto deterioration (someone loses, no one gains) must lower the total value.
  *   **Clarity/Structure [1]:** Argument flows logically.

  **Part (b)(i) [4 marks]**
  *   **V(X) [1]:** Correct value (16.67).
  *   **V(Y) [1]:** Correct value (30.00).
  *   **V(Z) [1]:** Correct value (approx 25.97).
  *   **Working [1]:** Clear derivation; rounding handled appropriately.

  **Part (b)(ii) [8 marks]**
  *   **Diagnosis of X→Y [2]:** Must identify that V(Y) > V(X) despite B losing well-being and A staying constant constitutes a levelling-down result (or Pareto violation).
  *   **Mechanism [2]:** Must explain that unlike standard prioritarianism, RP weights depend on the *mean*, so changing one person's well-being changes everyone's weight.
  *   **Critique of "A better off" [2]:** Must note that LDO is defined over *well-being* ($u_i$), not relative rank; A's well-being is unchanged, so claiming A is "better off" is a relabelling that begs the question.
  *   **Z vs Y observation [2]:** Credit for noting RP still cares about absolute levels (Z < Y), though this does not exonerate X→Y.

