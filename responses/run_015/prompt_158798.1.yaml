  ### 2. Arithmetic Check

  *   **V(X):**
      *   $\bar{u} = 50$.
      *   A: $r = -50, v = 1 - (-50/60) = 11/6$. Term = $0$.
      *   B: $r = 50, v = 1 - (50/60) = 1/6$. Term = $100/6 = 16.66...$
      *   **Candidate:** 16.67. **Correct.**
  *   **V(Y):**
      *   $\bar{u} = 30$.
      *   A: $r = -30, v = 1.5$. Term = $0$.
      *   B: $r = 30, v = 0.5$. Term = $30$.
      *   **Candidate:** 30.00. **Correct.**
  *   **V(Z):**
      *   $\bar{u} = 29$.
      *   A: $r = -31, v = 91/60$. Term = $-182/60 \approx -3.033$.
