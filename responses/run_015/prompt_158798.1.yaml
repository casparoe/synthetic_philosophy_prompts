  ### 3. Mark and Breakdown

  **Total Mark: 14 / 20**

  *   **Part (a): 8 / 8.** Precise definition, correct distinction between egalitarianism and prioritarianism regarding the Pareto principle.
  *   **Part (b)(i): 4 / 4.** All final values correct. Minor rounding error in working for Z noted but not penalized as the correct figure was adopted for analysis.
  *   **Part (b)(ii): 2 / 8.** Only credit awarded for the observation regarding Z and Y. The core argument denies the levelling-down result evidenced by the candidate's own calculations and misapplies the logic from part (a).

