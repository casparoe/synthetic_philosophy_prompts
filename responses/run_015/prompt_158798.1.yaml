  ### 4. Inline Comments

  > "The argument I gave in (a)... depended only on each person's well-being being counted with a positive weight, and v(r) is positive throughout the range in which we are working. So lowering B from 100 to 60 cannot raise the total..."

  **[Clearly mistaken]** This inference is invalid for RP. In standard prioritarianism, weights depend on absolute levels. In RP, weights depend on the *mean*. When B's well-being drops, the mean drops, which changes the deviation ($r$) for *both* agents, thereby changing the weights. Your calculation shows the total *did* rise (16.67 to 30.00); your theoretical claim contradicts your own arithmetic.

  > "In Y, A's relative position has improved... and because RP weights by relative position, A's situation has genuinely improved. So the move from X to Y is not a case of making some people worse off and no one better off at all."

  **[Clearly mistaken]** The Levelling Down Objection is defined in terms of *well-being* ($u_i$), not relative rank or weighted value. A's well-being is 0 in both outcomes. To claim A is "better off" because their deviation from the mean shrunk is to redefine the terms of the objection to suit the theory. This is sophistry: it disguises a pattern-based valuation as a well-being gain.

  > "RP assigns no such value — it merely weights well-being — so the objection gets no grip on it."

  **[Clearly mistaken]** If the weighting function depends on the distribution (the mean), the view *does* assign intrinsic value to the pattern (equality). The mathematical structure of RP makes it susceptible to the levelling-down objection, as demonstrated by your own computation of X and Y.

  > "Notice, finally, that RP ranks Z (25.97) below Y (30.00), which shows that it is not simply maximizing equality: it is willing to sacrifice some equality when absolute levels fall."

  **[Defensible but needs qualification]** This correctly shows RP is not *lexically* egalitarian. However, it does not prove RP escapes the levelling-down objection. A view can care about absolute levels and *still* violate the Pareto principle in specific cases (like X→Y). This point saves the view from being pure egalitarianism, but not from the objection.

  ---

  ### 5. What a Strong Answer Would Add

  A genuinely strong answer would have explicitly identified that the transition from X to Y is a **Pareto deterioration** (B is worse off, A is not better off in terms of well-being) that results in a higher Value. This violates the Pareto principle, which standard prioritarianism satisfies. The candidate's error was assuming the logic of absolute prioritarianism (where weights are independent of others' levels) transfers to relative prioritarianism. A strong answer would note that because $v$ depends on $\bar{u}$, the view is structurally egalitarian in effect, regardless of the "weighting" label. Finally, regarding Z and Y: while correctly noting RP prefers Y, a strong answer would clarify that this only shows RP trades off equality against efficiency; it does not exonerate the theory from valuing equality for its own sake in the X→Y case.

  ---

  ### 6. Model Answer Sketch (b)(ii)

  The computation shows the levelling-down objection *does* apply to RP. In moving from X to Y, B's well-being falls (100 to 60) and A's remains constant (0), yet V rises (16.67 to 30.00). This is a Pareto deterioration that increases value, which is precisely what the levelling-down objection condemns.

  The argument from (a) does not transfer. Standard prioritarianism escapes the objection because weights depend on absolute levels; lowering anyone's well-being lowers the total. In RP, weights depend on the *mean*. Lowering B's well-being lowers the mean, changing everyone's deviation and thus their weights. This introduces a structural dependence on the distribution pattern.

  The candidate's claim that A is "better off" in Y is illegitimate in this context. A's well-being ($u_A$) is unchanged. Redefining "better off" to mean "improved relative rank" begs the question against the levelling-down objection, which is concerned with well-being levels. Finally, while RP prefers Y to Z (showing sensitivity to absolute levels), this does not negate the fact that it prefers Y to X solely due to increased equality. RP violates Pareto and succumbs to the objection.
