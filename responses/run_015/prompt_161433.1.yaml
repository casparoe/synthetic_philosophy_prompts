answer: |-
  **Part One: The Exam Question**

  **Final Examination: Science Communication & Metaphor**
  **Time Allowed: 90 Minutes**

  **Question 1**

  A research consortium announces a complete, causally verified simulation of a human brain. The system is assembled from a reconstruction of one person's connectome and run at the resolution of individual ion channels. Interfaced with a synthetic body, the system is behaviourally indistinguishable from the person it models: it passes every clinical interview, reports the same memories, and makes the same characteristic slips.

  In their technical write-up, the team emphasizes two further details. First, the system can be formally described as implementing indefinitely many distinct functions depending on the grain at which its states are described; the team found no non-arbitrary way to single out one description as the one it *really* computes. Second, for every candidate mapping of its internal states onto representational contents, they were able to construct a rival mapping equally well supported by the causal and behavioural evidence.

  Does this result settle the question of whether the brain is a computer? In your response, you must explicitly identify what kind of question "Is the brain a computer?" is taken to be, and explain why that classification determines whether the consortium's findings are decisive.

  ***

  **Part Two: Model Answer**

  The consortium's results do not settle the question, because they expose a category error in how the question is typically posed. To determine whether the brain is a computer, one must first establish what kind of claim is being made. If "the brain is a computer" is an ontological claim—a statement about the intrinsic physical nature of the brain, akin to "water is H2O"—then the consortium's findings refute it. If it is a pragmatic claim—a statement about the utility of a specific explanatory framework—then the findings are irrelevant to its truth, though they may constrain its usefulness. The scenario provided forces us to recognize that computation is not a natural kind discoverable in the wild, but a description imposed upon physical processes.

  For an ascription of computation to amount to more than a trivial redescription, there must be a principled method for individuating physical states into symbolic states. Physics describes continuous fields and particles; computation describes discrete states and transitions. To map the former onto the latter requires a choice of grain. The consortium's first detail confirms that without an observer-imposed constraint, any physical system can be described as computing any function, provided the mapping is complex enough. If every physical system computes indefinitely many functions depending on how one looks at it, then saying "the brain is a computer" is vacuously true of everything, including rocks and storms. A vacuous truth explains nothing. Therefore, for the claim to have content, it must rely on criteria external to the physics itself—specifically, the interests of the interpreter.

  This is why perfect behavioural and causal fidelity does not deliver a conclusion. The scenario stipulates that the simulation matches the brain's causality and output perfectly. If computation were solely defined by input-output fidelity or causal topology, the question would be settled in the affirmative. However, the second detail regarding representational content undermines this. Meaning is not inherent in the causal chain; it is assigned. If rival mappings of internal states to content are equally supported by evidence, then the "content" being computed is indeterminate. A system cannot be said to compute *specific* information if the information it processes cannot be distinguished from alternative interpretations based on the physical evidence alone. Fidelity ensures the system works like a brain, but it does not prove the brain works like a computer, because "working like a computer" requires stable semantic individuation which the physics does not provide.

  Consequently, the indeterminacy of content ascription does not refute the computational claim; it relocates it. It shifts the burden from discovery to justification. The question "Is the brain a computer?" is not empirical but methodological. It asks whether treating the brain *as if* it were a computer yields predictive power or explanatory leverage that other metaphors (such as "the brain is a gland" or "the brain is an ecosystem") do not. The consortium's findings show that the computational description is not unique, but they do not show it is useless.

  To treat the matter as settled by noting that a simulation is not the thing simulated is to miss the point. That objection addresses ontology, but the computational hypothesis is rarely ontological in practice; it is instrumental. The indeterminacy shows that computation is in the eye of the beholder. Thus, the claim stands only if defended as a useful fiction. The brain is a computer only insofar as adopting the computational stance allows us to intervene successfully upon it. The consortium's data confirms that the stance is not forced by nature, but it leaves open whether it is forced by our needs. The question is settled not by the simulation's architecture, but by the utility of the metaphor in generating further science. Until we agree that we are asking about utility rather than essence, no amount of causal verification can close the debate.

  ***

  **Part Three: Marking Scheme**

  **Total Marks: 20**

  **1. The Non-Triviality Condition (5 Marks)**
  *   **A Grade (4-5):** Explicitly argues that computation requires a non-arbitrary method for individuating physical states into symbolic states. Identifies that without this, the claim is vacuously true of all physical systems (pancomputationalism).
  *   **B Grade (2-3):** Notes that descriptions depend on "grain" or "perspective" but fails to explain why this makes the claim trivial or vacuous.
  *   **Common Error:** Confuses physical complexity with computational complexity; assumes high resolution automatically guarantees genuine computation.

  **2. The Limits of Fidelity (5 Marks)**
  *   **A Grade (4-5):** Explains why behavioural/causal match is insufficient because it does not solve the semantic individuation problem. Distinguishes between *functioning like* a brain and *computing* specific content.
  *   **B Grade (2-3):** States that fidelity isn't enough but relies on the intuition that "simulations aren't real" without engaging the indeterminacy detail provided in the prompt.
  *   **Common Error:** Argues that because it is a simulation, it lacks "true" causality (the "simulation of a storm is not wet" fallacy).

  **3. Classification of the Question (5 Marks)**
  *   **A Grade (4-5):** Clearly identifies the question as methodological/pragmatic/instrumental rather than ontological/empirical. Argues that the status of the claim depends on this classification.
  *   **B Grade (2-3):** Identifies it as "philosophical" or "conceptual" without distinguishing between realism and instrumentalism.
  *   **Common Error:** Treats the question as purely empirical, waiting for better technology to settle it.

  **4. Handling Indeterminacy (5 Marks)**
  *   **A Grade (4-5):** Takes a definite position that indeterminacy *relocates* the claim (to utility) rather than *refuting* it (as false). Connects this back to the nature of the question.
  *   **B Grade (2-3):** States that indeterminacy makes the claim "uncertain" or "problematic" without resolving whether the claim remains usable.
  *   **Common Error:** Concludes that indeterminacy proves the brain is *not* a computer (ontological refutation) rather than changing the status of the claim.

  **General Penalty:**
  *   **-5 Marks:** If the essay relies primarily on the argument that "a simulation is not the real thing" to settle the issue, regardless of other merits. (This overrides the score for Criterion 2).
