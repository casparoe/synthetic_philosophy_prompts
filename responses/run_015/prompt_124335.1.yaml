answer: |-
  The full set of desiderata is not jointly satisfiable for a global argument, with the requirement to avoid normative premises that the genealogy undermines excluding the most candidates.

  1.  **Target Specification:** The argument must target the *justification* of moral beliefs, not merely their content, knowledge, or the truth of realism.
      *   **Case:** A reflective realist grants the genealogy and moral truth; success requires showing the genealogy severs the link between belief and truth, rendering belief unjustified. Targeting only content is insufficient.
      *   **Status:** Non-negotiable.

  2.  **Content Specificity:** The genealogical story must be fine-grained enough to predict the *specific content* of actual judgments, not merely that we would have some moral judgments or other.
      *   **Case:** If evolution explains only the capacity, the realist can posit that truth explains the specific content (tracking). Debunking requires showing the specific content is explained by non-truth-tracking factors.
      *   **Status:** Non-negotiable.

  3.  **Epistemic Scope (Domesticity):** The argument must explain why the genealogy discredits moral norms but not the perception, memory, logic, or epistemic norms used to formulate the argument.
      *   **Case:** Without this distinction, the argument induces global skepticism and undermines its own validity (self-defeat).
      *   **Status:** Non-negotiable.

  4.  **Normative Independence:** The argument must avoid relying on normative premises that its own genealogy would undermine.
      *   **Case:** Using epistemic norms to debunk moral norms is circular if those epistemic norms are subject to the same genealogical critique.
      *   **Status:** Non-negotiable.

  5.  **Empirical Refutation:** The argument must specify what empirical finding would refute it (e.g., evidence of truth-tracking selection pressures).
      *   **Case:** Prevents the argument from being insulated from evidence; allows the realist to know what would restore justification.
      *   **Status:** Preference of the realist camp.

  6.  **Capacity Reply:** The argument must explain why selection shaping a general capacity for normative judgment does not imply truth-tracking.
      *   **Case:** Realists argue a selected capacity implies reliability; the debunker must show the capacity is for adaptive fitness, not truth.
      *   **Status:** Non-negotiable.

  **Critical Tensions:** The demand for Normative Independence sits badly with the demand to yield a conclusion about what we *ought* to believe, as any epistemic norm invoked risks being debunked; simultaneously, Full Generality conflicts with Content Specificity, as evolution predicts general capacities more reliably than specific cultural judgments. **Local vs. Global:** For a proper subclass of judgments (e.g., purity), the desiderata change shape: Epistemic Scope is easier to satisfy (logic remains untouched), and Content Specificity is easier to establish (evolution directly explains purity norms), making local debunking more viable than global.

  **Scoring:**
  *   **Street (2006):** Fails Normative Independence and Epistemic Scope; she uses epistemic norms to debunk moral norms without adequately explaining why the former survive the same genealogical pressure, and struggles with Content Specificity regarding specific cultural variations.
  *   **Joyce (The Evolution of Morality):** Meets Content Specificity for local judgments and Empirical Refutation better than Street, but fails Global Scope; he focuses on explanatory superfluity of moral ontology but struggles to exempt epistemic norms from the same critique, effectively retreating to a local debunking stance.
