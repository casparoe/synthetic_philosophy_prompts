answer: |-
  You must demonstrate that time-symmetric dynamics plus a "typicality" assumption implies equilibrium everywhere (no arrow), forcing the low-entropy boundary to be the sole symmetry-breaker before you define memory.

  ### The Plan (40 Minutes)

  **1. Micro-Dynamics (5 mins)**
  *   **Board:** Write Newton's/Schrödinger's equations. Note $t \to -t$ invariance.
  *   **Point:** The engine of the universe does not know "forward" from "backward."
  *   **Misconception Defused:** *2nd Law as Dynamical.* Show explicitly that the equations allow entropy decrease.

  **2. Macrostates as Volume (5 mins)**
  *   **Board:** Draw a large irregular shape (Phase Space). Partition it into regions of vastly different sizes. Label them $M_1, M_2, \dots$ by volume, not "order."
  *   **Point:** Entropy is log-volume. A system moves from point to point. It spends most time in large regions.
  *   **Misconception Defused:** *Entropy as Disorder.* Use "number of microstates" only. Ban the word "disorder."

  **3. The Typicality Trap (10 mins)**
  *   **Board:** Draw a trajectory ending in a large region ($M_{high}$) *now*. Ask: Where did it come from?
  *   **Argument:** If we assume only dynamics + typicality (no boundary), the most probable past is also a large region. Entropy should be high in the past too.
  *   **Misconception Invited:** *The Reversal Worry.* Let them argue: "Flip velocities, it un-mixes." Use this to prove dynamics are symmetric. If dynamics are symmetric, why don't we see un-mixing?
  *   **Result:** You have proven that dynamics + typicality $\neq$ Arrow.

  **4. The Boundary Condition (5 mins)**
  *   **Board:** Cut the trajectory. Stipulate: At $t_0$, the system was in $M_{low}$ (tiny region).
  *   **Point:** This is the Past Hypothesis. It is not derived; it is posited. This breaks the symmetry.
  *   **Misconception Defused:** *Circularity.* The arrow is not defined by entropy increase; entropy increase is defined by the boundary condition's direction.

  **5. Records and Memory (5 mins)**
  *   **Board:** Draw a correlation line between the system and a "memory device" (another physical system).
  *   **Point:** Records are physical correlations formed during entropy-increasing processes. We remember the past because the past was the low-entropy boundary.
  *   **Misconception Defused:** *Refrigerator Exception.* Local entropy decrease (cooling) requires global increase (heat dump + record formation).

  **6. The Janus Stress Test (5 mins)**
  *   **Board:** Draw a "V" shape entropy curve. Minimum in the middle.
  *   **Point:** Observers on both legs see entropy increasing away from the minimum. Both call the minimum "the past."
  *   **Decision:** Include this. It proves the arrow is local to the gradient, not a property of time itself. It does not collapse the record arrow; it confirms records align with the gradient away from the minimum.

  **7. Explicit Declinations (2 mins)**
  *   **Quantum Measurement:** Decline. Decoherence explains the *mechanism* of branching, not the *asymmetry* of the branching.
  *   **Cosmic Expansion:** Decline. Expansion provides a sink, but the arrow persists even in a box; conflating them obscures the statistical argument.

  **8. Closing Question (3 mins)**
  *   **Ask:** "If the universe were in thermal equilibrium everywhere except for a single low-entropy fluctuation right here, right now, would you have memories of a past?"
  *   **Correct Answer:** "No. You would be a Boltzmann Brain with false memories. Real memories require a *long* low-entropy past, not just a local low-entropy present."

  ### The One Image

  **The Phase Space Volume Diagram.**
  *   **What it is:** A set of nested contours representing macrostates, with a single dot (microstate) moving through them.
  *   **Why:** It abstracts away "gas," "friction," and "messiness." It visualizes probability as geometric volume. It allows you to draw the trajectory forward and backward to show the asymmetry comes from the *starting point*, not the *flow lines*.
  *   **Must Have:** Drastically different region sizes (to represent probability gaps). Time-symmetric flow lines.
  *   **Must Lack:** Labels of "order/disorder," any human observer, any visual cue of "mixing."

  ### Misconception Sequence

  1.  **Entropy as Disorder:** Defuse in **Step 2**. Define strictly as volume.
  2.  **2nd Law as Dynamical:** Defuse in **Step 1**. Show equations are symmetric.
  3.  **Reversal Worry:** **Invite in Step 3**. Let them solve Loschmidt's paradox to realize the boundary is the only variable left.
  4.  **Circularity:** Defuse in **Step 4**. Show the boundary sets the direction, not the definition of entropy.
  5.  **Refrigerator Exception:** Defuse in **Step 5**. Show records require global increase.

  ### The Janus Universe Decision

  **Include it.** It belongs in **Step 6**.
  *   **Reasoning:** It is the strongest evidence that the arrow is boundary-dependent. If time itself had an arrow, the "future" side of the V would experience time backward. They don't; they experience entropy increase away from the minimum, just like us.
  *   **Risk Management:** To prevent collapsing the thermodynamic and record arrows, emphasize that records are *caused* by the gradient. On both sides of the V, the gradient points away from the minimum, so records form away from the minimum. Both populations agree on the direction of causality, even if they disagree on "absolute time."

  ### What to Decline

  **Decline the Quantum Mechanical Arrow and the Expansion Arrow.**
  *   **Why:** You are isolating the *thermodynamic* arrow's dependence on *initial conditions*. QM decoherence is a mechanism for irreversibility but presupposes the arrow; Cosmic Expansion is a contingent feature of our universe, not the source of the statistical asymmetry. Mentioning them invites "maybe it's actually gravity/quantum" distractions that undermine the statistical mechanics lesson.

  ### Closing Question

  **"In the Janus universe, does the population on the 'other side' of the minimum remember the minimum or their future?"**
  *   **Tests:** Whether they understand that memory is a physical record formed by entropy increase, not a metaphysical access to "the past." (Answer: They remember the minimum, because that is the direction of lower entropy relative to them.)
