prompt: |-
  ok so a coworker and I have been going back and forth on this for weeks and I want to force it into actual numbers, because I think we keep arguing about different things.

  Stipulate all of the following, I don't want it relitigated: there's a task domain D where (i) the best available human judge J can't check an answer without redoing most of the work herself — there's no short certificate, no proof checker, nothing she can eyeball — think "will this reorg of a 40-person engineering org actually improve the oncall rotation in six months" rather than "is this proof correct"; and (ii) the systems being overseen are clearly better than J at the task itself, in the sense that if you could just trust them you'd do better than J does alone. Instances are drawn from the ordinary distribution of oversight calls we'd actually face, not adversarially picked, and "hard" means J on her own with unlimited time would be near a coin flip.

  The proposition I want a number on: run pure debate — two debaters, short alternating turns, zero-sum payoff, J picks a winner and nothing else, no tools, no external verification, no debate about the debate — and J's accuracy on hard instances ends up at least 10 points above what she'd get from the plain baseline of asking one equally capable system for its answer plus its reasoning and accepting or rejecting it. That baseline is the real comparator, not chance, since trusting one model is what we'd do anyway. So: P(debate clears a 10-point gain over single-consultation on hard instances).

  I'm around 0.55. He's around 0.15, mostly on the grounds that the only demos anyone has actually shown were on toy tasks where you can verify the answer in one glance, and that on anything mushy it just turns into "whoever sounds more confident." Give me your own number, but more importantly the decomposition. Here are the terms I think have to be in there, and you can add ones I'm missing:

  - The asymmetry thesis. The whole thing rests on "it's easier to spot a flaw in an answer than to produce a flawless answer." How likely is that to hold in D, where a flaw is often a diffuse wrongness spread across the whole plan rather than a locatable bad step?
  - The shared-blindspot ceiling. Both debaters are drawn from the same family as the system we're overseeing. Any error no model in that family would flag is invisible to the protocol no matter how long it runs. What's your number on the share of hard-instance errors that are family-invisible?
  - Persuasion pull. Zero-sum plus optimization selects for tracking the judge, not tracking the truth, and these systems were in part selected for being persuasive to humans. How far does the equilibrium drift from truth-tracking?
  - Citation drag. As the transcript grows, the honest side is stuck with what it actually said earlier and the dishonest side is free to mischaracterize it, while J can only re-check by re-reading everything. I think this is worse than people admit and it gets worse superlinearly in length.
  - Steganographic or implicit collusion between two instances of the same model when neither can gain from being right per se.

  Give a number and one line of justification for each term, show roughly how they combine, and tell me which single term your final number is most sensitive to — if you had to be wrong about one of them, which? Then: what's the cheapest experiment you could actually run now, with present-day models and present-day human judges, that would move your number the most? And where do you think the gap between my 0.55 and his 0.15 really lives — which term are we most likely setting differently?

  One more thing. I've been pushing a fix and I want it priced separately: randomly assign each debater which answer to defend, so neither can pick the side it can argue most attractively, and rotate the assignment across repeated instances of the same question type. Give me a number for the probability that this recovers at least half of whatever gap there is between debate's performance and the ideal of "J hears the strongest case for the correct answer." Definately the part of this I'm least sure about.
