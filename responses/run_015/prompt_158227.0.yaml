  ### Application of the Crux Test

  **1. A bare scriptural citation offered to an audience not assumed to grant the text's authority, with no further support.**
  *   **Tier:** Least Admissible
  *   **Justification:** This is inadmissible because the argument's entire load-bearing weight rests on a religious authority that is explicitly inaccessible to the audience.

  **2. An appeal to a tradition's long-standing social teaching, presented as a heuristic about consequences — the historical prohibition is named, and the mechanism it was tracking is spelled out in secular terms.**
  *   **Tier:** Most Admissible
  *   **Justification:** This is fully admissible because the religious tradition functions only as a peripheral heuristic, while the crux relies on a secular mechanism defensible to all.

  **3. A claim about what God requires, where the speaker adds that the requirement was arrived at through her community's institutional procedures of discernment and that those procedures are reliable.**
  *   **Tier:** Low Admissibility
  *   **Justification:** This is inadmissible because the reliability of internal religious discernment procedures is not a reason addressable to citizens outside that community.

  **4. A natural-law argument whose premises concern human flourishing and whose conclusion is independently derivable, but which the speaker says she would abandon if it ever conflicted with revelation.**
  *   **Tier:** High Admissibility
  *   **Justification:** This is admissible because the public argument's structure rests on accessible premises about flourishing, making the private religious conditionality peripheral to the justification offered.

  **5. An appeal to a law's expressive or pedagogical effect: the law teaches what the community already believes, where the belief is religious but the claim about the law's teaching effect is empirical.**
  *   **Tier:** Moderate Admissibility
  *   **Justification:** This is partially admissible because the causal claim is empirical, though the religious content of the belief risks making the law's ultimate purpose sectarian.

  **6. A report of personal religious experience offered as a reason for a specific policy, accompanied by a secular backup argument the speaker herself regards as weaker.**
  *   **Tier:** Low-Mid Admissibility
  *   **Justification:** This is inadmissible because the speaker admits the secular argument is weaker, meaning the load-bearing work is actually done by the inaccessible religious experience.

  ***

  ### Divergences from Standard Views

  The crux test diverges most sharply from standard secular-rationale or translation requirements on **Item 6** and **Item 4**.

  Regarding **Item 6**, the standard Rawlsian proviso typically admits religious reasons provided secular reasons are given "in due course," regardless of their relative weight; the crux test rejects this because the secular backup is admitted to be weaker, leaving the religious reason as the functional crux. This is a point **for** the friend's test because it prevents the proviso from becoming a mere formality where sham secular reasons mask religious coercion, but it is a point **against** the test because it requires adjudicating the speaker's sincerity and the relative psychological weight of their reasons, which is administratively difficult.

  Regarding **Item 4**, standard public reason liberalism often requires premises to be "freestanding" (not dependent on comprehensive doctrines); the crux test admits this argument because the public structure is secular, even if the speaker's commitment is religiously contingent. This is a point **for** the friend's test because it facilitates political cooperation among citizens with different metaphysical foundations, but it is a point **against** the test because it allows justifications that are inherently unstable should the religious conditionality ever trigger a conflict.

  ### Fragility of the Ranking

  My ranking is most fragile regarding **Item 5**. I placed it in the moderate tier because the *claim* about the effect is empirical, but I would readily move it to the lowest tier if the "community" whose beliefs are being taught is defined sectarianally rather than civically. If the law's purpose is to reinforce specifically religious identity rather than general social cohesion, the religious belief moves from the periphery to the crux of the law's justification, failing the test. Nothing I know of would lead me to drop the crux test entirely in favor of standard filters, but if the requirement to evaluate the "load-bearing" status of reasons (as in Item 6) proves impossible to adjudicate objectively in real-time debate, I would revert to the simpler content-based translation requirement despite its susceptibility to formalism.

