  **Procedural Demarcation in Historical Inquiry**

  **The Question**
  Can a procedure-based demarcation for claims about sparsely documented periods be given that does not presuppose the falsity of the claims and survives symmetry and calibration objections? If so, is the resulting criterion genuinely epistemic or merely sociological in disguise?

  **The Impasse**
  Available answers leave this open. Falsity-first answers beg the question against my friend. Falsificationist answers stall because historical hypotheses are not individually falsifiable and are holistically protected in mainstream work too. Purely sociological answers concede his point rather than answering it. The demand for extraordinary evidence just relocates the dispute to what makes evidence extraordinary. This project argues that focusing on procedure rather than content avoids these traps. It tests whether the anomaly-generating mechanism itself is calibrated, rather than debating the anomaly's truth. This is the only path that respects the symmetry of evidence while denying the symmetry of method.

  **Methodology**
  Six months, divided into three phases.
  *Months 1–2: Framework.* Formalize the three threads: control-period testing, concordance without transmission, and exit conditions. Define calibration operationally.
  *Months 3–4: The Control Test.* The obvious objection is that well-documented periods are unfair controls because the method feeds on gaps. I propose a bridge case: a period well-documented overall but with deliberate local losses. This rescues the test. It isolates documentation density from actual ignorance. If the method generates anomalies proportional to known gaps rather than context, it reveals a structural flaw. If it remains silent where gaps are known but contextually filled, it passes. This distinguishes gap-exploitation from genuine inference. It tests whether the method distinguishes between unknown and unknowable. A purely dark age cannot do this; only a controlled loss allows us to see if the method reacts to absence itself. If the method produces lost-knowledge signals in the controlled loss zone despite stability, it proves it generates noise from gaps. This validates the control.
  *Months 5–6: Taxonomy and Refinement.* Apply the framework to two or three worked cases. Compile the taxonomy.

  **Deliverables and Failure**
  The deliverable is a practical criterion—a checklist a journal referee or museum officer could apply in half an hour—plus a direct response to the friend, explicitly admitting the range of cases where he was right. He is right mainstream history uses extrapolation; wrong that all extrapolation is uncalibrated. The checklist will highlight where calibration fails.
  Success requires showing mainstream methods generate fewer phantom anomalies in control periods than pseudohistorical ones.
  Failure occurs if: (i) the control test shows mainstream inference generating phantom anomalies at comparable rates; (ii) exit-condition behaviour tracks community size rather than the mainstream/fringe boundary; or (iii) every case collapses back into needing a first-order judgement about which claims are false.
  Scope is limited: a taxonomy plus worked cases, not a general theory. I will not attempt a universal philosophy of history. I would rather be told where it balloons than be handed an ambitious plan I cannot finish. This approach converts a philosophical stalemate into an empirical test of methodological behavior, bypassing content disputes. It targets the engine, not the output.

  **Confidence and Assumption**
  I am moderately confident the asymmetry is real, but the project hinges on one load-bearing assumption: that historical methods can be sufficiently standardized to allow a fair control test. If mainstream practice is too heterogeneous to establish a baseline error rate, the demarcation collapses into sociology.
