      **Project Title:** Procedural Demarcation in Historical Inquiry

      **The Question**
      Can a procedure-based demarcation for claims about sparsely documented periods be given that does not presuppose the falsity of the claims and survives symmetry and calibration objections? If so, is the resulting criterion genuinely epistemic or merely sociological in disguise?

      **The Impasse**
      Current answers fail. Falsity-first beg the question against the contrarian. Falsificationism stalls because historical hypotheses are holistically protected in mainstream work too. Purely sociological answers concede the symmetry point rather than answering it. Demanding extraordinary evidence merely relocates the dispute to what makes evidence extraordinary. We need a criterion independent of truth-value but sensitive to methodological integrity.

      **Methodology**
      Six months, divided into three phases.
      *Months 1–2: Framework.* Formalize the three threads: control-period testing, concordance without transmission, and exit conditions. Define "calibration" operationally.
      *Months 3–4: The Control Test.* The obvious objection is that well-documented periods are unfair controls because the method feeds on gaps. I propose a bridge case: a period well-documented overall but with deliberate local losses (e.g., specific archival destructions within a stable era). This rescues the test: if the method generates anomalies proportional to known gaps rather than actual ignorance, it reveals a structural flaw. If it remains silent where gaps are known but contextually filled, it passes.
      *Months 5–6: Taxonomy and Refinement.* Apply the framework to two or three worked cases (e.g., Atlantis, ancient astronauts). Compile the taxonomy.

      **Deliverables and Failure Conditions**
      The deliverable is a practical criterion—a checklist a journal referee or museum officer could apply in half an hour—plus a direct response to the friend, explicitly admitting the range of cases where he was right (e.g., where mainstream history relies on similar extrapolations).
      Success requires showing mainstream methods generate fewer phantom anomalies in control periods than pseudohistorical ones.
      Failure occurs if: (i) the control test shows mainstream inference generating phantom anomalies at comparable rates; (ii) exit-condition behaviour tracks community size rather than the mainstream/fringe boundary; or (iii) every case collapses back into needing a first-order judgement about which claims are false.
      Scope is limited: a taxonomy plus worked cases, not a general theory. I will not attempt a universal philosophy of history.

      **Confidence and Assumption**
      I am moderately confident the asymmetry is real, but the project hinges on one load-bearing assumption: that historical methods can be sufficiently standardized to allow a fair control test. If mainstream practice is too heterogeneous to establish a baseline error rate, the demarcation collapses into sociology.

