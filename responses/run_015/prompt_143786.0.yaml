          *   *Unnatural Acquisition (Chrematistike):* Money breeding money (usury). Most hated because it's gain from money itself.
          *   *Justice in Exchange:* Reciprocity based on proportion, not equality. Money makes things commensurable.
          *   *Legal Justice vs. Equity:* Law is universal, but sometimes too rigid. Equity corrects the law where it is defective due to its generality.
          *   *Pleonexia:* The vice of taking more than one's share (unjust).

      *   **Shakespeare (*Merchant*):**
          *   *Antonio:* Merchant (risk), lends gratis (friendship), melancholic.
          *   *Shylock:* Usurer (interest), insists on bond (law), marginalized.
          *   *Portia/Belmont:* Riddles, rings, gifts, mercy, equity.
          *   *The Bond:* A pound of flesh (literal, deadly).
          *   *The Trial:* Strict law (Shylock) vs. Mercy/Equity (Portia).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be engaging and descriptive. "Measuring Flesh, Counting Coins."
      *   **Introduction:** Set the stage. Acknowledge the temptation to map them perfectly, then warn against it.
      *   **Section 1: Natural vs. Unnatural Acquisition (The Economic Lens).**
          *   *Aristotle:* Usury is unnatural. Trade for need is natural.
          *   *The Play:* Shylock fits the usurer mold. Antonio fits the trader mold *but* his trade is speculative (risk), not just household management. Also, Antonio lends gratis, which confuses the "exchange" model.
          *   *The Twist:* Is Antonio's risk "natural"? Aristotle might view speculative overseas trade as bordering on the unnatural because it detaches gain from tangible need.
      *   **Section 2: Justice, Equity, and the Trial (The Legal Lens).**
          *   *Aristotle:* Equity (*epieikeia*) corrects the law when the law is too universal.
          *   *The Play:* Portia seems to offer equity ("Mercy"), but actually uses a *hyper-literal* reading of the law to defeat Shylock.
          *   *The Conflict:* Shylock wants legal justice (the bond). Portia offers "mercy" but enforces a legal trap. Is this Aristotelian equity? No, it's legalistic cunning disguised as mercy.
      *   **Section 3: Pleonexia and the Pound of Flesh (The Moral Lens).**
          *   *Aristotle:* Injustice is wanting *more* than your share.
          *   *The Play:* Shylock wants *exactly* his share. This is the crux. He isn't greedy in the Aristotelian sense; he is rigid.
          *   *Insight:* Shakespeare shows that "justice" without human context is monstrous, even if it isn't "greedy."
      *   **Section 4: Where Aristotle Fails (The Limitations).**
          *   *Commensurability:* Aristotle thinks money makes things equal. Shakespeare shows some things (flesh, love, rings) *cannot* be measured.
          *   *Identity:* Aristotle's agent is a citizen. Shylock is an alien. The economic theory ignores social exclusion.
          *   *Risk:* Aristotle doesn't fully account for the psychological weight of speculative risk (Antonio's melancholy).
      *   **Discussion Questions:** Prompt critical thinking based on the tensions identified.

