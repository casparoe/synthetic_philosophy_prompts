answer: |-
  # HANDOUT: Measuring Flesh, Counting Coins
  ### Aristotle's *Ethics* and *The Merchant of Venice*

  **The Premise:**
  It is tempting to read *The Merchant of Venice* as a dramatization of Aristotle's economic ethics. In *Nicomachean Ethics* (Book I.10 and Book V), Aristotle distinguishes between **natural acquisition** (trade for the sake of the household's needs) and **unnatural acquisition** (usury, where money breeds money). He also distinguishes between **strict legal justice** (adhering to the written law) and **equity** (correcting the law when its universality makes it unjust in a specific case).

  **The Puzzle:**
  If we apply these categories too neatly, the play breaks. Shylock looks like Aristotle's "unnatural" usurer, and Antonio looks like the "natural" merchant. But Antonio's wealth relies on speculative risk, not household stability, and the Christians' "gifts" create debts that money cannot repay. Furthermore, Shylock does not ask for *more* than his due, but *exactly* his due.

  This handout traces where Aristotle's lens clarifies the play, where it distorts it, and what Shakespeare reveals about value that Aristotle misses.

  ---

  ### I. Natural vs. Unnatural Acquisition (Venice vs. Belmont?)

  **Aristotle's View:**
  *   **Natural (*Oikonomia*):** Acquiring goods needed for life. Money is merely a measure to facilitate exchange.
  *   **Unnatural (*Chrematistike*):** Acquiring money for its own sake. The most hated form is **usury** (interest), because it makes money the parent of money, rather than a measure of goods.

  **The Play's Complication:**
  *   **Shylock:** Fits Aristotle's definition of unnatural acquisition perfectly. He charges interest ("usance") and views money as generative.
  *   **Antonio:** Seemingly fits "natural" acquisition. He lends money without interest (gratis) and trades in goods (merchandise).
  *   **The Distortion:** Antonio's trade is not household management; it is **speculative venture capitalism**. His wealth is scattered on "argosies" subject to storms and pirates. Aristotle values stability; Antonio values risk. Moreover, Antonio's "gratis" lending is not purely natural; it is a tool of social power used to undercut Shylock's rates and humiliate him.

  **Discussion Point:** Does Belmont represent a space outside of acquisition? Portia's wealth is inherited (natural?), but the casket test turns marriage into a high-stakes gamble. Is the ring she gives Bassanio a "gift," or does it create a binding obligation more rigorous than any bank loan?

  ### II. The Trial: Legal Justice vs. Equity

  **Aristotle's View:**
  *   **Legal Justice:** Applying the universal law to the specific case.
  *   **Equity (*Epieikeia*):** A correction of the law where it is defective due to its generality. Equity looks to the **intent** of the legislator and the specific circumstances, often mitigating the harshness of the written bond.

  **The Play's Complication:**
  *   **Shylock:** Demands **Legal Justice**. He wants the universal law of contracts to hold, regardless of the human cost. "I stand for judgment" and "I stand here for law."
  *   **Portia:** Seemingly offers **Equity** ("The quality of mercy is not strained"). She appeals to a higher moral principle to soften the law.
  *   **The Twist:** Portia does not actually practice Aristotelian equity. She does not convince Shylock to relent based on moral intent. Instead, she defeats him using a **hyper-literal reading of the law** ("No jot of blood," "Exactly a pound"). She uses the letter of the law to destroy the spirit of the claim.

  **Discussion Point:** Aristotle thinks equity *corrects* the law's rigidity. Portia uses rigidity to defeat rigidity. Is this justice, or is it a trap? Does the play suggest that true equity is impossible in a commercial society?

  ### III. Shylock and *Pleonexia* (Greed)

  **Aristotle's View:**
  *   **Injustice:** Defined as *pleonexia*—wanting **more** than one's proper share of goods or honor.
  *   **The Just Man:** Takes his equal share, no more.

  **The Play's Complication:**
  *   **Shylock's Claim:** He does not ask for *more* than the bond stipulates. He refuses 6,000 ducats (triple the loan) to demand exactly a pound of flesh.
  *   **The Distortion:** By Aristotelian standards, Shylock is **not** guilty of *pleonexia*. He is not greedy for *more*; he is obsessive about the *exact*.
  *   **The Insight:** Shakespeare shows us a form of injustice that Aristotle ignores: **Injustice as Dehumanization.** Shylock's demand is unjust not because he wants too much, but because he treats a human body as a commensurable commodity. He tries to make flesh measurable by the pound.

  **Discussion Point:** If Shylock isn't "greedy" in the Aristotelian sense, why is he punished as a criminal? Is the crime wanting the flesh, or insisting that the law can validate the taking of it?

  ### IV. Where Aristotle Runs Out (The Limits of the Lens)

  Use this section to identify where the philosophical framework fails to capture the literary reality.

  | Concept | Aristotle's Account | Shakespeare's Complication |
  | :--- | :--- | :--- |
  | **Commensurability** | Money makes all things comparable. There is a proportionate ratio between a shoe and a house. | **Flesh and Love are Incommensurable.** You cannot measure a pound of flesh against ducats. You cannot measure the value of Portia's ring against Bassanio's apology. The play reveals limits to exchange that Aristotle's theory of reciprocity ignores. |
  | **The Agent** | The economic agent is a citizen within a polis, bound by shared friendship (*philia*). | **The Alien.** Shylock is outside the civic bond. Aristotle's ethics assume a shared community. When one party is excluded from the "friendship" of the state, economic exchange becomes warfare, not reciprocity. |
  | **Risk & Psychology** | Acquisition is about securing the household's needs. | **Melancholy & Risk.** Antonio is sad ("In sooth, I know not why I am so sad"). Aristotle doesn't account for the psychological toll of speculative risk or the emotional weight of credit. |
  | **Obligation** | Obligations are settled through repayment or legal justice. | **Unpayable Debts.** The Christians end the play bound by rings and promises that cannot be "paid off." The economy of gift creates eternal debt, whereas the economy of usury seeks closure. |

  ### V. Synthesis Questions for Seminar

  1.  **The Measure of Man:** Aristotle believes money allows us to measure value proportionately. Where in the play does the attempt to "measure" a person (by flesh, by ducats, by casket choice) lead to catastrophe?
  2.  **The Nature of the Bond:** Shylock's bond is written; Portia's ring is a verbal/gift bond. Why is the "free" gift bond ultimately more binding and dangerous than the commercial loan?
  3.  **Aristotle's Blind Spot:** Aristotle claims usury is "unnatural" because money cannot breed. But in Venice, money *does* seem to breed risk, status, and power. Does Shakespeare validate Aristotle's moral disgust, or does he show that usury is simply the honest face of a capitalist reality that Antonio tries to mask with "friendship"?
  4.  **Equity or Cunning?** If Portia had practiced true Aristotelian equity, how would the trial have ended? Would she have voided the bond based on intent? Why does Shakespeare deny us that resolution?

  ---

  **Instructor's Note:** *Do not force Shylock into the role of the "Greed" villain simply because Aristotle dislikes usury. The play is more disturbing than that. Shylock is punished not for wanting too much, but for refusing to participate in the Christian economy of mercy and unquantifiable debt. Aristotle gives us the vocabulary of exchange; Shakespeare shows us the violence that happens when human life is forced into that vocabulary.*
