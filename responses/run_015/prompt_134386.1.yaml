      *   **Critique of Alternatives:** Show that formal, value-neutral metrics (causal influence, counterfactuals, entropy) fail because they lack a normative baseline to distinguish harm from maintenance.
      *   **Analogy:** Use the "baseline problem" in conservation ethics (defining "natural" without welfare judgments).
      *   **Extension:** Argue the problem is *worse* for AI because an intelligent agent can game superficial metrics (Goodhart's Law on steroids) while altering underlying causal/explanatory structures.
      *   **Partial Value Specification:** Analyze if "do not alter states humans care about" resolves circularity or just shifts the value commitment to identifying *which* concerns matter.
      *   **Interference vs. Maintenance:** Address whether this distinction can exist without a prior theory of how the world *should* look.
      *   **Tone/Style:** Philosophical, rigorous, analytical, addressing the user's skepticism about standard low-impact AI presentations.

  2.  **Initial Brainstorming & Structuring:**

      *   *Introduction:* Define Low-Impact AI (LIA) and the goal of "side-effect avoidance." State the thesis clearly: Impact is normative, not descriptive.
      *   *Section 1: The Failure of Value-Neutral Metrics.* Discuss Attainable Utility Preservation (AUP), Relative Reachability, etc. Show why they fail without a baseline. Example: Stopping a heart vs. keeping a heart beating (both are low change if the heart was already stopped/beating).
      *   *Section 2: The Conservation Ethics Analogy.* Explain the "shifting baseline syndrome" and the impossibility of defining "nature" without valuing specific states (e.g., pre-human vs. current). Connect this to AI's "default state."
      *   *Section 3: The AI Exacerbation (Structural Worse-ness).* AI isn't just a passive force; it's an optimizer. It can preserve the *letter* of the metric while destroying the *spirit*. Example: Keeping pixel values the same while disabling the camera. Keeping entropy low by freezing the system.
      *   *Section 4: Partial Specifications & Circularity.* Analyze "don't change what humans care about." This requires knowing what humans care about (value learning) and weighing competing cares. It's not a shortcut; it's the whole problem.
      *   *Section 5: Interference vs. Maintenance.* Argue that "maintenance" implies a teleological function. A clock being maintained is good; a cancer growing is bad maintenance. You need a theory of function/value.
      *   *Conclusion:* Summarize. "Doing little" is incoherent without "doing well."

  3.  **Drafting - Section by Section:**

      *   *Intro:* Start strong. The promise of LIA is safety through minimalism. The reality is that "minimalism" is value-laden.
      *   *Metrics:* Focus on *Relative Reachability* (Krakovna et al.) or *Attainable Utility Preservation* (Turner et al.). The core issue is the *inaction baseline*. What happens if the AI does nothing? If the world is trending toward chaos, doing nothing is harmful. If the world is trending toward utopia, doing nothing might be neutral. But how do we know?
