answer: |-
  You have described a phenomenon that is well-documented in critical theory, organizational sociology, and political economy, though there is no single universally agreed-upon word for the *entire* cycle you outlined. However, there are several established concepts that map onto different parts of it, and one in particular that comes very close.

  Here is the breakdown of the existing terminology, how it differs from Foucault, and a proposed coinage for the specific boundary you defined.

  ### 1. The Closest Established Term: **Recuperation**
  The most precise existing term for this is **Recuperation** (or *Recovery*).

  *   **Origin:** Popularized by the Situationist International (1950s/60s) and later expanded by sociologists like Luc Boltanski and Ève Chiapello in *The New Spirit of Capitalism*.
  *   **The Mechanism:** Recuperation occurs when a system (usually capitalism or a state) identifies a threat or critique, strips it of its revolutionary potential, and repackages it as a commodity or administrative feature that strengthens the system.
  *   **Why it fits:** Boltanski and Chiapello specifically argue that capitalism survives by "absorbing the artistic critique." When workers demand autonomy, the system doesn't crush them; it creates "flexible work environments" (the task force) that give the *feeling* of autonomy while increasing productivity (the upgrade). The flaw (rigidity) becomes an upgrade (flexibility) without changing the power dynamic.
  *   **Why it might feel incomplete:** Recuperation is often used in cultural contexts (e.g., punk fashion sold by H&M). Your description is specifically *bureaucratic*.

  ### 2. Related Concepts (and why they aren't quite it)
  *   **Co-optation:** This is the standard sociological term (Philip Selznick). It refers to absorbing new elements into the leadership structure to prevent them from threatening the system.
      *   *Difference:* Co-optation often implies the critic is silenced or neutralized personally. In your pattern, the critic is *active* and *productive*. They are writing reports and refining operations. They aren't just silenced; they are *used*.
  *   **Decoupling:** In institutional theory (Meyer & Rowan), this describes when an organization's "talk" (policies, task forces) is separated from its "walk" (core operations).
      *   *Difference:* Decoupling explains the *lack of power* the task force has, but it doesn't explain the *metabolism* of the critic's credibility.
  *   **Immunization:** Philosopher Roberto Esposito argues that communities protect themselves by introducing a controlled dose of the "threat" (like a vaccine).
      *   *Difference:* This is a strong philosophical match for the "metabolism" idea, but it is less commonly used to describe specific bureaucratic procedures like task forces.

  ### 3. How This Differs from Foucault
  You are right to sense an adjacency to Foucault. Foucault argues that power is **productive** (it creates subjects, knowledge, and truths) rather than just repressive. He also discusses how **counter-conduct** (resistance) is often folded back into the pastoral power of the institution.

  **The Distinction:**
  *   **Foucault's Focus:** He is interested in the *ontology* of power—how resistance is inevitable and how power relations are constituted *through* that resistance. For Foucault, the absorption of dissent is a fundamental condition of power itself.
  *   **Your Pattern's Focus:** You are describing a specific *technology* or *tactic* of institutional self-preservation. It is more cybernetic than genealogical. It is about **homeostasis**. The institution uses the critic as a sensor to detect friction, then uses the task force as a lubricant to reduce that friction without changing the engine.
  *   **Key Difference:** In Foucault's view, the struggle is endless and constitutive. In your pattern, the struggle is *transactional*. The institution trades **legitimacy** for **stability**.

  ### 4. A Coinage: **Dissent Laundering**
  Since "Recuperation" is broad and "Co-optation" implies silencing, I propose the term **Dissent Laundering** for this specific cycle.

  **Definition:**
  *Dissent Laundering* is the institutional process by which radical critique is processed through bureaucratic procedures (task forces, committees, reports) to transform "dirty" political demands into "clean" administrative data, thereby increasing institutional legitimacy without transferring decision-making power.

  **The Boundaries (as you requested):**
  1.  **The Input:** Must be a substantive critique of power or harm (not just minor feedback).
  2.  **The Process:** Must involve a formalized procedure that includes the critics (task force, working group).
  3.  **The Output:** Must result in reports, guidelines, or operational refinements (the "upgrade").
  4.  **The Exclusion Condition:** If the critics gain **veto power**, **budgetary control**, or **structural authority** over the core system, it is **Reform**, not Laundering.
      *   *Reform:* Power moves.
      *   *Laundering:* Credibility moves.

  ### 5. Why "Dissent Laundering" Fits Your Description
  *   **Metabolism:** Just as money laundering takes illicit cash and runs it through businesses to make it "clean," dissent laundering takes illicit critique (which threatens the system) and runs it through a task force to make it "clean" (policy recommendations).
  *   **The Upgrade:** The system *does* improve. Just as a laundered business is a functioning business, a "laundered" policy is often more efficient. The bias might be made more subtle, or the harm made more procedural, but the system becomes more robust *against* future critique because it has already "addressed" it.
  *   **The Critic's Role:** In money laundering, the business owner might not know the money is dirty. In dissent laundering, the critic *knows*, but their participation is the washing machine. Their presence signals to the outside world that the process is legitimate.

  ### Summary
  If you want to use established academic language, call it **Bureaucratic Recuperation**. It signals you understand the Situationist/Boltanski lineage but specifies the administrative mechanism.

  If you want a term that captures the transactional nature of the credibility swap and the specific boundary of "no power transfer," use **Dissent Laundering**.

  **The Cycle in Brief:**
  1.  **Friction:** Critique exposes a flaw.
  2.  **Intake:** Institution creates a procedural container (Task Force).
  3.  **Wash:** Critic supplies labor and credibility; Institution supplies legitimacy.
  4.  **Spin:** Report is published; Operations are refined (optimized) but not transformed.
  5.  **Exit:** Institution claims self-correction; Critic is exhausted or credentialed but powerless.

  This is not just "ignoring" the critic; it is **digesting** them.
