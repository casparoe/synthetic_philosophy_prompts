answer: |-
  # Defense Preparation Sheet: Counterfactual-Transport Equivalence

  ## Part 1: Opening Concessions (First 5 Minutes)
  *State these explicitly in your opening summary to disarm the most obvious attacks before they are weaponized.*

  1.  **On Alignment:** "I concede that transport presupposes a unit-to-unit alignment. My claim is not that alignment is solved, but that *given* an alignment, transport is the only valid test of mechanism identity. Alignment is a prerequisite, not the mechanism itself."
  2.  **On Cost:** "I concede the full 30-intervention bank is too expensive for every deployment step. I propose this as a gold-standard audit for major version changes (e.g., v1 to v2), not for every gradient update. The operational claim scales by sampling from the bank."
  3.  **On Metaphysics:** "I concede that 'graded identity' is metaphysically uncomfortable. I use 'identity' to track explanatory continuity. If the committee prefers 'mechanistic similarity sufficient for safety inheritance,' I accept that terminology, provided the operational protocol remains unchanged."

  ---

  ## Part 2: Objections & Replies (Ranked by Likelihood × Damage)

  ### 1. The "Basis Artifact" Objection
  *   **Who:** Advisor (Mechanistic Interpretability)
  *   **Vocab:** Basis freedom, permutation invariance, activation patching, circuits.
  *   **Objection:** "You treat grafting failure as evidence of mechanism divergence. But in high-dimensional spaces, failure to patch is often just a failure to align bases or permutations. Unless you solve SAE-based alignment first, you're measuring coordinate mismatch, not mechanism mismatch."
  *   **Force:** Real force against the *theoretical* claim; weak against the *operational* claim.
  *   **Concession:** "You are right that without alignment, transport is meaningless. I do not claim transport works on raw units."
  *   **Reply:** "My protocol assumes an alignment step (e.g., via SAE features or canonical basis). The claim is that *even with perfect alignment*, behavioral agreement and representational similarity are insufficient. If aligned features patch successfully in Model A but fail in Model B, B has reorganized the computation, regardless of basis. The artifact is in the alignment; the mechanism divergence is in the transport failure."
  *   **Weakest Point:** If alignment is never "perfect," the distinction between alignment error and mechanism divergence remains blurry.

  ### 2. The "Just a Two-Sample Test" Objection
  *   **Who:** Member 3 (Distribution Shift/Deployment)
  *   **Vocab:** Two-sample test, null hypothesis, deployment envelope, prior.
  *   **Objection:** "Strip the word 'mechanism.' You have a richly specified two-sample test over intervention responses. Deleting the metaphysical baggage costs you nothing and saves you from philosophical errors. Why insist this is about identity?"
  *   **Force:** Real force against the *metaphysical* claim; no force against the *operational* claim.
  *   **Concession:** "Operationally, you are correct. The safety guarantee comes from the test, not the label."
  *   **Reply:** "The label matters for *induction*. If I call it a robustness test, I only know the model works on the shifts tested. If I call it mechanism identity, I claim the model inherits the *causal structure* of the audited model. This justifies extrapolating safety properties to untested shifts within the same family. The metaphysics buys inductive power for the monitoring pipeline."
  *   **Weakest Point:** If the inductive power doesn't actually hold (i.e., if transport doesn't predict untested shifts better than behavioral tests), the metaphysics is empty marketing.

  ### 3. The "Graded Identity" Objection
  *   **Who:** External Examiner (Philosopher of Science)
  *   **Vocab:** Individuation, ontological commitment, similarity metric, explanatory interests.
  *   **Objection:** "Identity is binary; similarity is graded. You are proposing a similarity metric but dressing it in the clothing of identity. Mechanisms are individuated relative to a phenomenon description. A 'degree of identity' is a category error."
  *   **Force:** Real force against the *thesis statement*; weak against the *protocol*.
  *   **Concession:** "I concede that strict numerical identity is binary. I am using 'identity' to denote 'sufficient continuity for explanatory inheritance.'"
  *   **Reply:** "In engineered and biological systems, mechanism individuation is already interest-relative. We say a heart transplant preserves the 'same' circulatory mechanism despite material change. My graded criterion formalizes the threshold at which explanatory inheritance breaks. It is not a metric of similarity, but a measure of *functional isomorphism under perturbation*."
  *   **Weakest Point:** If the "threshold" is arbitrary, the claim collapses back into simple similarity.

  ### 4. The "Alignment Vacuity" Objection
  *   **Who:** Member 4 (Comp Cog Sci)
  *   **Vocab:** Isomorphism, mapping function, structure preservation, substrate.
  *   **Objection:** "Given enough units and freedom in the mapping, structure preservation becomes vacuous. The alignment step does all the work. If you can always find a mapping that makes transport work, your criterion is trivial."
  *   **Force:** High damage if true; moderate likelihood.
  *   **Concession:** "If the mapping class is unconstrained, the test is indeed vacuous."
  *   **Reply:** "The mapping is constrained by the *intervention bank*. We are not looking for any isomorphism; we are looking for one that survives thirty specific causal perturbations. The complexity of the intervention bank bounds the complexity of the allowable mapping. If the mapping must be as complex as the model itself to preserve transport, transport fails by definition."
  *   **Weakest Point:** Defining the complexity bound on the mapping function rigorously is difficult.

  ### 5. The "Arbitrary Shift Family" Objection
  *   **Who:** Member 3 (Distribution Shift)
  *   **Vocab:** Prior, deployment distribution, held-out set, generalization.
  *   **Objection:** "The held-out shift family encodes a prior about deployment that you have chosen rather than derived. If the deployment shifts differ from your held-out family, your transport score is meaningless. You're overfitting to your audit."
  *   **Force:** Real force against *deployment utility*.
  *   **Concession:** "The shift family is indeed a choice, not a derivation."
  *   **Reply:** "All monitoring presupposes a deployment envelope. My contribution is making that prior explicit in the mechanism definition. Unlike behavioral monitoring, which hides the prior in the probe suite, transport monitoring forces you to declare which distribution shifts matter for the mechanism's identity. It makes the assumption visible, not invisible."
  *   **Weakest Point:** Doesn't solve the problem of unanticipated shifts (black swans).

  ### 6. The "Scalability" Objection
  *   **Who:** Advisor / Senior Engineers
  *   **Vocab:** Pipeline, compute budget, latency, CI/CD.
  *   **Objection:** "Running thirty interventions bidirectionally on every checkpoint is computationally prohibitive for a real deployment pipeline. This works for a dissertation, not for a product."
  *   **Force:** High damage to *adoption*; low damage to *theory*.
  *   **Concession:** "It is too expensive for every commit."
  *   **Reply:** "I propose this for 'milestone' audits—distillation, quantization, major fine-tunes—not every gradient step. Furthermore, the intervention bank can be distilled into a smaller 'signature' set once the mechanism is characterized. The initial cost buys a cheaper monitoring signature for downstream versions."
  *   **Weakest Point:** Distilling the signature risks losing the very transport properties you care about.

  ### 7. The "Multiple Realizability" Objection
  *   **Who:** External Examiner (Philosopher)
  *   **Vocab:** Multiple realizability, substrate, functional role.
  *   **Objection:** "Two systems can realize the same function via entirely different mechanisms (multiple realizability). Your transport criterion might fail simply because the realization differs, even if the mechanism (in the functional sense) is identical."
  *   **Force:** Moderate damage; depends on definition of "mechanism."
  *   **Concession:** "If 'mechanism' means only input-output function, then yes, transport is too strict."
  *   **Reply:** "I am defining mechanism causally, not functionally. If interventions do not transport, the causal structure differs, even if the input-output map is identical. For safety, we care about the causal structure (e.g., deceptive alignment might look functionally identical until a specific perturbation). Multiple realizability is a feature here, not a bug: it distinguishes robust mechanisms from fragile coincidences."
  *   **Weakest Point:** Requires defending that causal structure matters more than function for safety (usually true, but debatable).

  ### 8. The "Symmetry" Objection
  *   **Who:** Any Member (You flagged this as unresolved)
  *   **Vocab:** Symmetric relation, subset, containment.
  *   **Objection:** "You flag symmetry as unresolved. If a smaller model contains the larger model's mechanism but not vice versa, is it the 'same' mechanism? If identity isn't symmetric, it's not identity."
  *   **Force:** High damage to *thesis coherence*.
  *   **Concession:** "I concede the relation may not be strictly symmetric in all capacity mismatches."
  *   **Reply:** "I treat symmetry as a limit condition. In the regime where both models have sufficient capacity for the phenomenon, transport should be symmetric. Asymmetry indicates one model is approximating the other's mechanism, not implementing it. For the safety cases I target (successor models), we assume sufficient capacity, making symmetry a valid working assumption."
  *   **Weakest Point:** "Sufficient capacity" is hard to verify independently.

  ### 9. The "Intervention Bank Selection" Objection
  *   **Who:** Senior Engineers / Member 3
  *   **Vocab:** Coverage, adversarial, selection bias.
  *   **Objection:** "Who chooses the thirty interventions? If I can game the bank, I can pass the audit without preserving the mechanism. The bank is arbitrary."
  *   **Force:** Moderate damage to *protocol validity*.
  *   **Concession:** "A fixed bank can be gamed."
  *   **Reply:** "The protocol requires positive and negative controls and pre-registration. More importantly, the interventions are structural (ablations, patches), not just input perturbations. To game the bank, you must know the causal circuit. If you know the circuit well enough to game the test, you likely understand the mechanism well enough to ensure safety."
  *   **Weakest Point:** Adversarial training can overfit to structural interventions too.

  ### 10. The "Behavioral Agreement" Objection
  *   **Who:** Advisor / General
  *   **Vocab:** Probe suite, behavioral metrics, alignment tax.
  *   **Objection:** "If two models agree on all behavioral probes, why do we care if interventions transport? Safety is about behavior."
  *   **Force:** Moderate damage; common intuition.
  *   **Concession:** "Behavior is the ultimate ground truth for safety."
  *   **Reply:** "Behavioral agreement on a probe suite is consistent with 'greedy' solutions that fail on out-of-distribution shifts. Transport guarantees that the *reason* for the behavior is stable. We care about intervention transport because it predicts behavioral stability on shifts *not* in the probe suite. It is a leading indicator of behavioral failure."
  *   **Weakest Point:** Requires empirical proof that transport predicts OOD failure better than behavioral variance.

  ---

  ## Part 3: Strategic Essentials

  ### The Single Reply the Chapter Cannot Survive Without
  **The Distinction between Behavioral Robustness and Mechanistic Transport.**
  If you cannot explain why transport adds value over a sufficiently large behavioral probe suite, the chapter collapses into "robustness testing."
  *   **The Line:** "Behavioral probes test *that* the model works on a distribution. Transport tests *why* it works. Two models can work for different reasons (e.g., one uses a heuristic, one uses the causal feature). Only the latter will transport interventions. For safety, we need the 'why' to be stable, not just the 'that'."

  ### The "Hope Nobody Asks" Objection
  **Objection:** "You require bidirectional transport. But in distillation, the student cannot replicate the teacher's internal interventions (capacity constraint). Does this mean the student *never* has the same mechanism as the teacher, rendering your metric useless for distillation monitoring?"
  *   **Why:** This hits the "Symmetry/Capacity" unresolved problem and a common deployment case (distillation).
  *   **Response:** "In distillation, we relax bidirectionality to 'forward transport' (Teacher → Student). We accept that the Student mechanism is a projection of the Teacher's. The metric becomes 'fraction of Teacher interventions preserved in Student.' This loses the identity claim but retains the safety inheritance claim: if the Student preserves the safety-critical interventions, it inherits the safety profile."

  ### Retreat Assessment: Metaphysics vs. Operations
  *You can retreat from the metaphysical claim ("This is what mechanism identity *is*") to the operational claim ("This is what we should *monitor*") to save the chapter from the following objections:*

  1.  **The "Graded Identity" Objection (Philosopher):** Retreat to "Operational Continuity." Admit identity is binary, but claim safety requires *continuity*.
  2.  **The "Just a Two-Sample Test" Objection (Deployment):** Retreat to "Monitoring Protocol." Admit the metaphysics is optional, but insist the *protocol* (interventions vs. probes) is necessary for sample efficiency on OOD shifts.
  3.  **The "Multiple Realizability" Objection (Philosopher):** Retreat to "Causal Stability." Admit functional identity is possible without transport, but claim causal stability is the specific safety property required for high-stakes deployment.

  *You **cannot** retreat on these without gutting the chapter:*
  1.  **The "Alignment Vacuity" Objection:** If alignment does all the work, the protocol is just an alignment benchmark. You must defend that transport constrains alignment.
  2.  **The "Behavioral Agreement" Objection:** If behavior is all that matters, the intervention bank is unnecessary compute. You must defend that transport predicts behavioral failures probes miss.
