  - nobodies acting in bad faith and nobody's optimising against the metric;
  - the metric isn't a bad measure: for each person or unit measured it's unbiased, and a higher score really does mean a higher underlying value on average;
  - the metric doesn't causally change the thing it measures, and no one's stretching it into a range where its relationship to that thing breaks down;
  - and yet the institution uses it exactly as intended and systematically ends up rewarding the wrong people.

  Then do the analysis. I want to know what's actually going on, why it's structural rather than a mistake anybody made, how the distortion changes when the selection gets harsher (top 10% vs top 1% — I want a direction, and a rough sense of magnitude), what single change defuses it without giving up measurement altogether, and how someone who thinks this is just ordinary measurement error would push back.

  Format, please, and in British English:

  **The case** — the scenario itself, about 150 words, no commentary.
  **The mechanism** — what's really happening, about 150 words.
  **Turn the dial** — what happens as the selection gets harsher, about 80 words.
  **The fix** — one concrete change, about 80 words.
  **The comeback** — the strongest objection to your diagnosis, then your reply, about 120 words.

  One more thing: I'd rather the case be one where a casual observer would look at the metric and think it's working fine. And if you think the spec is unsatisfiable as stated, don't fudge it — say so and tell me which condition has to give.
