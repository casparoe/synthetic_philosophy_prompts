answer: |-
  **The case** — the scenario itself, about 150 words, no commentary.

  A large medical funder awards grants based on total citations accrued over the preceding three years. Citations reflect genuine engagement; on average, highly cited work is indeed more scientifically valuable. No researcher alters past papers to gain citations, nor does the award itself change the quality of already published work. The metric is unbiased: for any given scientist, expected citations equal true ability plus random noise. Yet, five years post-award, the funded cohort's breakthrough rate is significantly lower than predicted by their citation scores, while many unfunded applicants with slightly lower scores produce superior work. The funder realises they have consistently backed luck over skill, despite using a perfectly valid indicator of past merit. Selection targets the top decile. Casual observers see a strong correlation between citations and quality, assuming top scorers are necessarily the best scientists for future investment. The institution uses the measure exactly as intended, yet systematically rewards the wrong people.

  **The mechanism** — what's really happening, about 150 words.

  This is the Winner's Curse. The metric comprises signal (true ability) and noise (temporal luck, topic virality). While unbiased across the whole population, selection truncates the distribution. In the extreme tail, noise contributes disproportionately to the score; a scientist in the 99th percentile likely possesses both high ability and positive luck. Consequently, their expected future performance reverts towards the mean, appearing as underperformance. Meanwhile, rejected candidates just below the threshold often possess high ability suppressed by negative noise. The institution isn't misled by bad data or gaming; it is misled by conditioning on a noisy proxy. The distortion is structural because any selection process on imperfect measures enriches the selected pool with positive outliers of error, decoupling the metric from the underlying trait within the chosen group. The measure remains valid observationally, but fails predictively within the selected subset. It is purely statistical.

  **Turn the dial** — what happens as the selection gets harsher, about 80 words.

  As selection harshness increases from the top 10% to the top 1%, the signal-to-noise ratio within the selected pool deteriorates. In the top 10%, ability dominates; in the top 1%, luck becomes the primary differentiator between candidates of similar high skill. The distortion is non-linear: the expected ability of the 1% group is much closer to the 10% group than their scores suggest. Consequently, the lucky rather than the skilled comprise a larger proportion of the elite tier, magnifying resource waste.

  **The fix** — one concrete change, about 80 words.

  Implement empirical Bayes shrinkage. Instead of ranking raw citation counts, adjust each score towards the population mean based on the estimated reliability of the metric (variance of noise versus variance of ability). This statistically discounts outliers likely driven by luck, producing a ranking of expected true ability rather than observed performance. It retains measurement but corrects for the selection bias inherent in noisy proxies, ensuring funds target stable skill rather than transient spikes.

  **The comeback** — the strongest objection to your diagnosis, then your reply, about 120 words.

  Objection: 'This is just ordinary measurement error, not Goodhart's Law. The metric hasn't stopped working; you're just interpreting it naively.'

  Reply: Goodhart's Law concerns the *consequences* of measurement usage, not merely data quality. When observed for information, noise averages out across the population. However, when used as a target for selection, the process actively selects *for* noise. The metric ceases to be a good measure *of the selected group's future value*, which is the institution's actual goal. The relationship breaks specifically because it became a target. The law holds because the context of usage altered the statistical relationship between measure and outcome within the decision boundary, independent of human behaviour or causal feedback. It is the structural equivalent of behavioural gaming.
