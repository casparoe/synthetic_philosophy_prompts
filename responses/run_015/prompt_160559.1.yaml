      *   *Gut Level:* It's about reliability vs. precision. To *know* you are on the edge, you need a buffer. If the condition fades out gradually, you can't have a buffer at the boundary without the buffer spilling over into the "not-C" zone.
      *   *Drafting the explanation:* Validate the topological analogy (it's spot on). Explain "Safety" as a buffer zone. If the boundary is fuzzy, a buffer zone pushes the "Known C" region away from the actual boundary of "C".

  4.  **Deconstruct Question 3: Graininess/Discreteness:**
