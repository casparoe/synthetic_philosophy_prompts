      *   *The "Click" Example:* "Counter clicked at least once." This is factive and sharp. Is it luminous? If I hear the click, do I know I heard it? Maybe. But Williamson targets *phenomenal* states (feeling cold) or *knowledge* itself.
      *   *Does it save KK?* If knowledge is grainy, maybe. But Williamson argues knowledge is *not* grainy because the standards for knowledge shift continuously with context, or because the underlying cognitive reliability is analog.
      *   *Self-Undermining:* If you claim "I know my states are grainy," do you *know* that? That requires a margin for error on the graininess claim.
