  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Background:** Retired experimental condensed matter physicist. Comfortable with technical concepts (open sets, similarity structures, discrete vs. continuous, detectors, grains/pixels).
