  I'm working through the sea battle thing in Aristotle and I keep hitting a wall. His whole move is that it's not yet true that there'll be a sea battle tomorrow, but it's also not yet true that there won't be. But here's my snag: if "there will be a sea battle tomorrow" isn't true right now, doesn't its opposite — "there will NOT be a sea battle tomorrow" — have to be true right now? That's just the law of excluded middle, p or not-p. So how is Aristotle not just breaking basic logic? I cant pin down which assumption of mine is doing the work that makes this look like a contradiction.

