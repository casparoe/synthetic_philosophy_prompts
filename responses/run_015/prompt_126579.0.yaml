      *Wait, one nuance on Move 3:* Dave's argument about pattern identity isn't *necessarily* dualist. Functionalists might agree that severe decay destroys the "self." However, Nina's point is that *some* consciousness likely remains even in decay, so the "immortality" is of a suffering entity, not a non-entity. I need to capture that distinction.

