answer: |-
  ### Brainstorming & Selection Notes

  I considered the standard "abandonment objection" (letting the reckless starve) and the "constitutive luck regress" (nothing is truly chosen). These are the first things critics raise, which is exactly why Dr. Voss has stock moves ready for them. Asking them directly invites her prepared deflections.

  Instead, I selected objections that force her to operationalize the view where her deflections lose traction. The "aggregation problem" (market values depend on others) undermines the "practice" move because the practice itself rests on brute luck. The "extensional equivalence" challenge undermines the "currency not principle" move by suggesting the principle adds no policy value. The "no-luck world" test checks if the view is fundamentally about luck or just equality. I discarded the "free will" objection as too metaphysical for a policy-adjacent podcast; it lets her retreat to "practice" too easily. I also discarded the simple "shaming" objection since she explicitly blocks that via currency adjustments.

  Below are the ten questions, designed to be spoken aloud, with anticipated answers, follow-ups, and strategic notes.

  ---

  ### Interview Questions for Dr. Miriam Voss

  **Question 1**
  **The Line:** When the market value of my skills depends on everyone else's simultaneous choices, isn't the payoff structure itself a matter of brute luck?
  **Likely Answer:** The practice sets the rules, so within the practice, the returns are matters of option luck.
  **Follow-up:** But if the practice's payoff schedule is arbitrary from the perspective of justice, doesn't that make the practice itself unjust?
  **Disable:** Move 2 ("Needs a practice").
  **Meta:** Live controversy. Specialists debate whether market prices are neutral benchmarks or morally arbitrary. A specialist might think this smuggles in a claim that justice requires a specific baseline for pricing talents.

  **Question 2**
  **The Line:** If I cultivate a taste for champagne because I mistakenly think it will make me happy, is that taste chosen or unchosen?
  **Likely Answer:** It depends on whether you endorsed the cultivation at the time.
  **Follow-up:** But doesn't that endorsement rely on a constitutive luck about what you find endorsable?
  **Disable:** Move 2 ("Needs a practice").
  **Meta:** Live controversy. The "endorsement" test is standard but contested by those who think character is largely unchosen. A specialist might object that "endorsable" implies a normative standard outside the practice.

  **Question 3**
  **The Line:** In a world where everyone starts with identical endowments and faces no uncertainty, does your view require any redistribution at all?
  **Likely Answer:** No, because there are no unjust inequalities to correct.
  **Follow-up:** Then if nature produces equality on its own, does justice require us to maintain it or just leave it alone?
  **Disable:** Move 1 ("Currency not principle").
  **Meta:** Settled conceptual point. This tests whether the view is egalitarian or merely corrective. No smuggled assumptions, but reveals if the view is parasitic on injustice.

  **Question 4**
  **The Line:** If we can make the worse off better off only by increasing inequality, does your principle forbid it?
  **Likely Answer:** No, we care about eliminating unjust inequality, not inequality per se.
  **Follow-up:** But if justice doesn't forbid it, what work is the equality constraint actually doing?
  **Disable:** Move 1 ("Currency not principle").
  **Meta:** Live controversy. The "levelling down" objection is standard, but her answer tries to dodge it. A specialist might think this framing assumes equality has intrinsic value, which luck egalitarians deny.

  **Question 5**
  **The Line:** If we weight welfare by the likelihood of bad luck, doesn't your view yield the same policy recommendations as prioritarianism?
  **Likely Answer:** No, because the justification matters for institutional design.
  **Follow-up:** But if the finance minister gets the same spreadsheet, why should she care about your justification?
  **Disable:** Move 1 ("Currency not principle").
  **Meta:** Live controversy. Extensional equivalence is a major charge against luck egalitarianism. A specialist might argue justifications *do* change policy stability, which is not smuggled but asserted.

  **Question 6**
  **The Line:** When every available option carries high risk, is choosing the least bad one really a voluntary gamble?
  **Likely Answer:** It's still a choice among options, so it's option luck.
  **Follow-up:** But if the menu was forced by brute luck, doesn't that taint the choice itself?
  **Disable:** Move 2 ("Needs a practice").
  **Meta:** Live controversy. This touches on structural injustice vs. individual responsibility. A specialist might think this conflates "hard choices" with "no choices."

  **Question 7**
  **The Line:** You say we need a practice rather than desert, but who designs the practice?
  **Likely Answer:** Society designs it through democratic processes.
  **Follow-up:** And if the designers' intuitions are shaped by constitutive luck, isn't the practice just luck all the way down?
  **Disable:** Move 2 ("Needs a practice").
  **Meta:** Live controversy. Challenges the constructivist element of her view. A specialist might object that democratic legitimacy filters out arbitrary luck, which is a contested claim.

  **Question 8**
  **The Line:** When you say abandonment is an objection to currency, do you mean we can solve it by switching from welfare to resources?
  **Likely Answer:** Yes, the right currency avoids leaving people to starve.
  **Follow-up:** But if the only defensible currency looks exactly like sufficientarianism, haven't you abandoned egalitarianism?
  **Disable:** Move 1 ("Currency not principle").
  **Meta:** Live controversy. This presses the collapse into sufficientarianism. A specialist might think "resources" can be defined egalitarianly, but that is the core dispute.

  **Question 9**
  **The Line:** Is the key to option luck that I could have said no, or that the odds were fair?
  **Likely Answer:** They need reasonable access to the information and fair odds.
  **Follow-up:** If it's the odds, doesn't that require a brute luck baseline to judge fairness?
  **Disable:** Move 2 ("Needs a practice").
  **Meta:** Settled vs. Live. The epistemic condition is standard, but the "fair odds" requirement is highly contested. A specialist might think fairness is internal to the practice, not external.

  **Question 10**
  **The Line:** What empirical finding about human decision-making would force you to abandon this view?
  **Likely Answer:** If we found people cannot distinguish between risk and necessity.
  **Follow-up:** And if psychology shows we rarely distinguish those cleanly, is the view practically inert?
  **Disable:** Move 1 ("Currency not principle").
  **Meta:** Live controversy. Philosophy vs. empirical psychology. A specialist might argue normative theory doesn't depend on empirical psychology, which is a contested methodological claim.
