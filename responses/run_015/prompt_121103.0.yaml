answer: |-
  This is a sharp set of intuitions, and they hold up well against the messy reality of fieldwork and bureaucracy. You've essentially identified that "corruption" isn't just about the object exchanged (money, watch, fish), but about the *relationship* between the giver, the receiver, and the rules of the game they are playing.

  To systematize this without losing the nuance you've gathered from the Pacific to the lab, I propose we use **The Principle of Role Fidelity**, paired with a secondary test called **The Shadow of the Future**.

  ### The Principle of Role Fidelity
  **Corruption occurs when a private exchange (gift, favor, or loyalty) subverts the primary normative duty of the officeholder's specific role.**

  This principle does three things for you:
  1.  It removes "impartiality" as a universal requirement (saving the Elder).
  2.  It expands beyond "gifts" to include "loyalty" (catching the Roommate).
  3.  It focuses on the *purpose* of the job, not just the rules.

  Let's run your cases through this filter.

  **1. The Supplier's Watch (Corrupt)**
  *   **Role:** Procurement Officer / Lab Manager.
  *   **Duty:** To secure the best equipment at the best price for the institution.
  *   **Subversion:** The watch creates a private debt that competes with the institutional duty. It signals that future contracts might favor the giver, not the best science.
  *   **Verdict:** **Corrupt.** The private exchange subverts the fiduciary duty.

  **2. The Pacific Elder (Not Corrupt)**
  *   **Role:** Village Steward / Gatekeeper.
  *   **Duty:** To maintain social harmony and manage access to community resources through relational reciprocity.
  *   **Subversion:** None. In this specific cultural context, the Elder's role *requires* the acceptance of tribute to validate the relationship. Refusing the taro would subvert his role by rejecting the social contract. The gift isn't "buying" an exception; it is "paying" the entry fee for the relationship that grants authority.
  *   **Verdict:** **Not Corrupt.** The exchange fulfills the role's normative duty.

  **3. The Facilitation Fee (Corrupt)**
  *   **Role:** City Official.
  *   **Duty:** To process paperwork impartially and efficiently as a public service.
  *   **Subversion:** The fee turns a public right into a private commodity. It distorts the queue, privileging those who pay over those who wait.
  *   **Verdict:** **Corrupt.** Even if systemic, it subverts the duty of equal service.

  **4. The Politician's Roommate (The Hard Truth)**
  *   **Role:** Public Servant / Planner.
  *   **Duty:** To act in the public interest, prioritizing the common good over personal networks.
  *   **Subversion:** Here is where I have to be honest about your gut feeling. You hesitated to call this corruption because the roommate was *qualified* and there was no *hidden exchange*. However, under Role Fidelity, the motivation matters. If the hire was made to honor a personal bond (loyalty) rather than solely to serve the public need, the private relationship has influenced the public act.
  *   **Verdict:** **Corrupt (Clientelism).** This principle requires you to adjust your intuition here. Even if the outcome was harmless (a qualified hire), the *process* treated a public office as a vehicle for private loyalty. It distorts the role of "politician" into "patron."

  ### The Shadow of the Future (The Whiskey Cases)

  Role Fidelity handles the structural issues, but the whiskey case is about *timing* and *influence*. For this, we apply **The Shadow of the Future**: *Does the gift create a reasonable expectation of future influence while the role is still active?*

  **5. The Administrator (Active)**
  *   **Scenario:** You send whiskey *after* the grant is processed, while she is still in office.
  *   **Analysis:** Even if there was no prior agreement, a gift to an active official creates a "shadow." It signals that you are the kind of partner who rewards help. It subtly pressures her to view your future grants favorably to maintain the "good relationship." It blurs the line between professional courtesy and personal debt.
  *   **Verdict:** **Ethically Hazardous / Soft Corruption.** It risks subverting her future impartiality. It's not a crime, but it violates Role Fidelity because it introduces a private debt into an ongoing professional relationship.

  **6. The Administrator (Retired)**
  *   **Scenario:** You send the whiskey *after* she has retired.
  *   **Analysis:** She no longer holds the role. She has no power to distort the grant process. The "Shadow of the Future" is gone. The gift cannot subvert a duty she no longer holds.
  *   **Verdict:** **Gratitude.** Pure and simple.

  ### Summary of the Trade-Offs

  This framework gets most of your verdicts right, but it demands one sacrifice:

  1.  **It saves the Elder:** By acknowledging that different roles have different norms (reciprocity vs. impartiality).
  2.  **It catches the Watch and the Fee:** By identifying the subversion of institutional duty.
  3.  **It resolves the Whiskey:** By distinguishing between active influence (corrupting) and retrospective thanks (gratitude).
  4.  **It challenges the Roommate:** This is the cost of the principle. If you accept Role Fidelity, you have to admit that hiring a friend because he is a friend is a form of corruption, even if he is qualified. It treats public power as private property.

  **The Bottom Line:**
  Your gut is mostly right, but it's protecting the *outcome* (qualified roommate, smooth fieldwork) rather than the *system*. Corruption is often less about bad outcomes and more about the erosion of the boundary between the public role and the private self.

  If you send that whiskey while she is still in office, you aren't just saying "thanks"; you are investing in the next transaction. If you wait until she retires, you are honoring the past one. The principle holds: **Corruption is the privatization of a public role.** The Elder's role isn't public in the Western bureaucratic sense; it's communal. The Administrator's is. Know the role, and you know the rule.
