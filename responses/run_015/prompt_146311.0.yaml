      *   Suggest the single change: Revise (5) to align with (2).

  11. **Refining the "Cheapest Revision":**
      *   If the user wants to avoid Doomsday (which usually motivates (5)), they have to drop (2).
      *   But the prompt asks to preserve the core of (1) and (2).
      *   So I must advise them to drop the intuition in (5).
