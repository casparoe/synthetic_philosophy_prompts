answer: |-
  Here is my assessment of your core idea, structured according to your requests.

  **1. Openness vs. Ignorance**
  "Openness" is a genuine notion, but your definition of it risks being metaphysical when it needs to be pragmatic. You define a vantage point as downstream if the event is "settled for it, as a narrative or a record settles it." This is currently metaphorical. If "settled" means metaphysically fixed (the past is fixed), then the Amnesiac Historian case becomes difficult because the past is fixed for her just as much as for us. If "settled" means "known by the speaker," you collapse back into the Ignorance Account you reject.

  To make this work, "settled" must mean "accepted as fixed in the current conversational common ground." This distinguishes the 1963 speaker from the present-day speaker not by what they *know*, but by what the discourse context treats as negotiable. In 1963, the shooter's identity was a live parameter in the common ground. Now, it is not. This saves the notion from being just "ignorance + time." It makes openness a feature of the discourse context, not the speaker's skull. You need to make this explicit: "settled" is a status in the conversation, not a fact about the world.

  **2. The Amnesiac Historian**
  My intuition is that the Historian *can* felicitously use the indicative, provided she explicitly frames the conversation as speculative. If she says, "Let's ignore the records for a moment; if Oswald didn't shoot Kennedy, someone else did," the indicative is fine. If she says, "Looking back from 2070, if Oswald didn't shoot Kennedy...", it sounds wrong.

  Does this refute your view? No. Your theory already has the resources to handle this via the "adopted vantage point" mechanism you use for the Film Rewatch case (§2). The Historian is simply adopting a 1963 vantage point. The prediction holds: if she adopts a 2070 historical vantage point, the indicative is infelicitous; if she adopts a speculative vantage point, it is fine. The danger here is not refutation, but trivialization. If any speaker can adopt any vantage point at will, the theory risks becoming unfalsifiable. You need constraints on when a vantage point adoption is licensed. The "Sealed File" case works because the skeptic is trying to engage with the record *as it stands*, not adopting a fictional vantage point. That distinction needs sharpening.

  **3. The Two-Parameter View (§5)**
  Does this collapse into a remoteness account? Not necessarily, but the boundary is thin. Standard remoteness accounts treat the subjunctive as marking distance from reality or belief. Your "openness" parameter marks distance from *settledness*. These are distinct dimensions. Remoteness handles the "unlikely but possible" (future subjunctive); openness handles the "unknown but settled" (past indicative).

  The collapse risk arises if you try to unify them into a single "modal distance" metric. You avoid this by locating openness in the modal base and remoteness in the ordering source. This is a technically sound distinction. However, be warned: if "remoteness" can be manipulated by context just like "openness" (e.g., treating a likely event as remote for politeness), the two parameters may bleed into each other. Keep them distinct by insisting that openness is binary (open vs. settled) while remoteness is graded. If you treat openness as graded, you invite the collapse.

  **4. Cutting to One Claim**
  If you have twenty pages, cut the semantic machinery in §4. Do not try to formalize the anchor feature constraining the modal base yet. That is a paper for another time. Instead, defend the "Sealed File" argument (§3a) as a pragmatic phenomenon. Your strongest claim is that the indicative/subjunctive contrast tracks the *conversational status* of the antecedent, not the speaker's epistemic state. Focus entirely on proving that two speakers with identical credences can differ in felicity because their conversational contexts differ. Delete the future subjunctive complication (§5) for now; it distracts from the core innovation regarding past indicatives.

  **Verdict**
  **Revise in one specific way:** Shift the theoretical burden from metaphysics/time to pragmatics/common ground. Your current definition of "downstream" leans too heavily on temporal/metaphysical settledness, which threatens the Amnesiac Historian case. Redefine "openness" strictly as "not settled in the common ground." This preserves the Sealed File argument while making the Historian case a matter of vantage-point adoption rather than metaphysical downstreamness.

  **Ranked Objections**
  1.  **The Definition of "Settled" (High Damage):** If you cannot define "settled for a vantage point" without appealing to either metaphysics (which hurts the Historian case) or individual ignorance (which collapses into the rival view), the central idea is dead. This is the load-bearing concept.
  2.  **§5 Complexity (Medium Damage):** If the two-parameter view becomes too complex, reviewers will argue that a unified remoteness account is more parsimonious. This doesn't kill the idea but weakens its appeal.
  3.  **Historian Intuition (Low Damage):** As noted, your theory already contains the fix (adopted vantage points). Unless you claim vantage points cannot be adopted, this is not fatal.

  **Final Word**
  The core idea is alive and interesting. The "Sealed File" argument is a genuine contribution that standard Ignorance Accounts struggle to handle. However, you are currently trying to do too much: metaphysics, semantics, and pragmatics all at once. Strip it back. Make this a paper about the pragmatics of conversational settledness. If you can prove that identical epistemic states yield different conditional forms based on conversational context, you have won the argument.
