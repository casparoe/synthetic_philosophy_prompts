answer: |-
  **Exam Question**

  **Question 1**
  Consider the Principle of Procreative Beneficence (PPB): prospective parents have a significant moral reason to select, from among the children they could have, the one expected to have the best life. For the purposes of this question, assume that standard objections regarding non-identity, expressive harm, and future autonomy have been satisfactorily met. Assume further that a reliable, cheap method exists for estimating an embryo's expected well-being from its genome.

  Consider a society where a fixed number of high-status positions largely determine how well a life goes. Suppose embryo selection for traits predicting success in competing for these positions becomes universal. Call a trait *positionally loaded* when its contribution to well-being depends primarily on comparison with others (e.g., competitiveness) rather than absolute improvement (e.g., robust health). In this scenario, universal selection for positionally loaded traits creates an arms race: individual gains cancel out, and resources spent on selection are wasted.

  Which of the following diagnoses best captures the moral implication of this case?

  1.  **REDUCTIO:** PPB is self-defeating; a principle of beneficence cannot require acts whose universal performance produces no benefit, so it must be rejected or restricted to non-positional traits.
  2.  **COORDINATION:** The reason PPB gives an individual parent survives untouched; the case shows only that the practice needs collective restraint to prevent waste.
  3.  **DISSOLUTION:** The case shows only that PPB must be stated over a non-comparative conception of well-being, after which there is no arms race and nothing to restrain.
  4.  **CATEGORY ERROR:** There is no arms race at all, because selecting one embryo rather than another never changes the traits of anyone else's child.

  Endorse exactly one diagnosis. Defend it against the other three. Your answer should clarify whether the verdict depends on how PPB is grounded (e.g., impartial beneficence versus parental partiality) and how traits are evaluated. (90 minutes; 20 marks)

  ***

  **Model Answer**

  The correct diagnosis is COORDINATION. This case presents a classic collective action problem applied to reproduction. While the universal practice of selecting for positionally loaded traits yields no net social benefit and wastes resources, this outcome does not negate the moral reason individual parents have to select the best child they can. The verdict turns on distinguishing the grounding of PPB and separating the positional from the non-positional components of a trait's expected benefit.

  To begin, CATEGORY ERROR must be rejected. It claims selection never changes the traits of others' children. This is empirically false in the stipulated case. If selection becomes universal, the baseline for competition shifts. Height or competitiveness only confer advantage relative to the population mean. If everyone selects for height, the average rises, and the relative advantage disappears. The arms race is real because the value of the trait is context-dependent. Denying this contradicts the stipulation that these traits are positionally loaded.

  DISSOLUTION attempts to solve the problem by redefining well-being. It suggests PPB should only count non-comparative goods. However, this ignores the reality of the society described. In this specific context, well-being *is* partly determined by access to fixed high-status positions. To define well-being purely non-comparatively here is to disconnect the principle from the actual determinants of a good life in that society. While philosophically tempting, it fails to engage with the case as stated. If access to resources determines welfare, and access is competitive, then well-being is partly comparative. PPB must track actual well-being, not an idealized version that ignores social structure.

  REDUCTIO is the strongest competitor. It argues that if universal adherence yields no benefit, the principle is self-defeating. This holds water only if PPB is grounded in impartial beneficence—the idea that parents should act to maximize overall good. If the goal is aggregate welfare, wasting resources on a zero-sum game is irrational. However, PPB is typically grounded in parental partiality: the special obligation parents have to their own future child. From the perspective of individual partiality, the act is not self-defeating. My child gains an advantage even if others do too, because if I do not select and others do, my child loses. The individual reason remains robust even if the collective outcome is neutral. Therefore, the principle is not internally contradictory; rather, it conflicts with collective rationality.

  This leads to COORDINATION. The individual moral reason survives because it is agent-relative. Parents are permitted, perhaps required, to prioritize their own child's prospects. However, because the universalization of this reasoning leads to waste and no net gain, the practice requires collective restraint. This does not mean abandoning PPB, but regulating its application regarding positional traits. We can distinguish between the positional and non-positional components of traits. Selecting for robust health (absolute) still yields net benefit even if universal. Selecting for competitiveness (positional) yields private gain but public waste. PPB should still guide selection for health, but collective policy should restrict selection for purely positional advantages to prevent the arms race.

  This distinction secures the A-grade insight: the verdict flips depending on the grounding. If PPB were impartial, REDUCTIO would win. Because it is partial, COORDINATION wins. Furthermore, treating traits as all-or-nothing obscures the solution. We do not need to ban selection entirely, only the positional components. Thus, PPB remains valid but requires coordination to avoid collective irrationality. The principle guides the individual, but justice requires regulating the market of traits to ensure resources are not wasted on canceling advantages.

  In conclusion, COORDINATION best captures the moral landscape. It respects the individual parental duty while acknowledging the social cost of universalizing positional selection. It avoids the empirical error of CATEGORY ERROR, the definitional stipulation of DISSOLUTION, and the grounding error of REDUCTIO. By separating positional from absolute benefits, we preserve the core of PPB while mitigating the arms race through collective agreement rather than philosophical abandonment.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Engagement with Stipulations (4 marks)**
  *   **4 marks:** Explicitly accepts the case stipulations (technology exists, standard objections met). Does not argue against the possibility of selection or raise non-identity/expressive harm objections.
  *   **0–2 marks:** Spend significant time arguing that selection is impossible, harmful to existing disabled people, or violates autonomy.
  *   **Examiner Note:** Candidates who recite objections stipulated away (non-identity, expressive harm) have not engaged with the question. Cap such answers at **5 marks total** regardless of other quality.

  **2. Analysis of Diagnoses (6 marks)**
  *   **2 marks:** Correctly identifies why CATEGORY ERROR fails (selection changes population baselines).
  *   **2 marks:** Correctly identifies why DISSOLUTION fails (well-being in this case is stipulated as partly comparative).
  *   **2 marks:** Correctly identifies the strength of REDUCTIO (collective irrationality) but notes its dependency on impartial grounding.
  *   **Examiner Note:** A-grade answers explain *why* these fail philosophically, not just that they are wrong. B-grade answers often dismiss them without analyzing the underlying assumption (e.g., saying Dissolution is wrong without explaining why well-being must track social reality).

  **3. Defense of Chosen Diagnosis (COORDINATION) (6 marks)**
  *   **2 marks:** Clearly argues that individual parental reason survives despite collective waste.
  *   **2 marks:** **Key Distinction 1:** Explicitly distinguishes between PPB grounded in *parental partiality* (supports Coordination) versus *impartial beneficence* (supports Reductio).
  *   **2 marks:** **Key Distinction 2:** Separates *positional* traits (subject to restraint) from *non-positional/absolute* traits (still subject to PPB).
  *   **Examiner Note:** This is the A/B divide. A-grade answers (16–20 marks) must make both distinctions. B-grade answers (12–15 marks) often treat PPB as monolithic or argue for coordination without explaining why the individual reason persists (partiality) or treat all traits as equally problematic.

  **4. Structure and Clarity (4 marks)**
  *   **4 marks:** Logical flow, clear thesis statement, concise conclusion. Adheres to word count constraints.
  *   **2–3 marks:** Understandable but disorganized or slightly over/under length.
  *   **0–1 marks:** Difficult to follow or significantly violates length constraints.

  **Specific Cap Note:**
  If a candidate answers by reciting the objections stipulated away (non-identity, expressive harm, autonomy/design), they have not engaged with the question. Cap such an answer at **5 marks**.

  **A vs B Differentiation:**
  *   **A (17–20):** Notices the verdict flips on grounding (partiality vs. impartiality) AND separates positional from non-positional components of traits.
  *   **B (13–16):** Defends Coordination but treats PPB as a single block or fails to distinguish trait components, treating the case as all-or-nothing.

  \answer{COORDINATION — turns on parental partiality versus impartial beneficence}
