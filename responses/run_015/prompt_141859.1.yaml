answer: |-
  Based on the pattern of verdicts, your friend is not running a simple "worst-case" or "average-case" heuristic. She is running a **Containment-First Safety Case** rule.

  Here is the breakdown of her logic, the prediction for the new case, and how to confirm it.

  ### 1. Decoding the Rule
  Her decisions consistently prioritize **downstream containment** and **independence of verification** over raw failure rates or adversarial intent.

  *   **Coding Assistant (Ship):** High failure rate (1 in 500), but **contained**. Human review acts as an independent downstream filter. The harm is reversible (bugs get fixed).
  *   **Uninterpretable Reasoning (Ship):** Opacity is acceptable because outputs are **checkable**. Containment exists.
  *   **Kill Switch (Reject):** Low failure rate (1%), but **uncontained**. The switch *is* the containment. If it fails, there is no backup. The operator is a single point of failure.
