answer: |-
  Imagine Sarah at her kitchen table recalling yesterday's lemon bite; she closes her eyes and insists her memory is perfectly accurate, yet the sensory character of that recollection is unmistakably sugary and sweet, not sour. When you ask how a sour lemon could feel sweet, she agrees the fruit was chemically sour but maintains that the "what it was like" for her in that moment was genuinely sweet, and since her only access to the original experience is through this current sweet sensation, she claims there is no deeper fact about the original feel beyond her present report. The contradiction emerges because if qualia are intrinsic, private properties directly known to the subject, Sarah should be able to distinguish between the original sour qualia and her current sweet judgment, but by insisting the sweet memory *is* the accurate record of the feel, she treats the qualia as both the object of memory and the judgment itself, making it impossible to say whether the original experience changed or if her access to it is broken, thus dissolving the qualia into mere conflicting reports.

  **The Qualia Realist View:**
  A qualia realist would say Sarah is simply mistaken. They hold that the original experience had a specific, intrinsic property (sourness) that existed independently of her current memory. The fact that her memory now presents as sweet means her memory mechanism is faulty, not that the original qualia were unstable. For the realist, there is a fact of the matter about what the lemon tasted like phenomenally, even if Sarah's current access to that fact is corrupted. The qualia are real anchors; her report is just a potentially flawed map of those anchors.

  **The Incoherence View (Chase & Sanborn style):**
  The incoherence theorist argues that Sarah's case shows there is no "anchor" to be mistaken about. If the only access we ever have to qualia is through our judgments and reports (like Sarah's insistence that the memory is accurate), then positing a "raw feel" behind that judgment is empty. If Sarah says it feels sweet now and that's her memory of the feel, there is no separate "original qualia" to compare it against. The distinction between "how it seemed then" and "how it seems now that it seemed then" collapses. Qualia are supposed to be self-verifying, but here the verification (memory) contradicts the expected property without the subject noticing an error, suggesting the "property" was never anything more than the judgment itself.

  **The Feature Doing the Work:**
  The heavy lifting is done by **introspective opacity over time**. The case exploits the gap between the immediate experience and the retrospective report. Qualia are supposed to be directly apprehended, but memory introduces a layer where the "apprehension" is reconstructed. If the subject insists the reconstruction is the original apprehension, and there is no way to check the original except through another apprehension, the "qualia" vanishes into the report. It shows that we never touch the qualia itself, only our take on it.

  **The Realist Counter-Attack:**
  To save their view, a realist would attack the **memory component** specifically. They would argue that qualia are only incorrigible (immune to error) in the *present moment*. Sarah's error proves that memory is not a direct pipeline to past qualia but a reconstructive process. They would say, "The qualia were real and sour yesterday; today's sweet sensation is a new, distinct mental event (a memory-image) that misrepresents the old one." This saves qualia by isolating them to the immediate now, conceding that we can't trust memory to preserve them, but insisting the original intrinsic properties still existed.
