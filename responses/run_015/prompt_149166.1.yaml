  # The Disease Ascription Instrument

  ## Part 1: The Logical Space
  Before using the tree, note the axes that define the space of positions. Your answers to the cases below will locate you within these dimensions:

  1.  **Ontology:** Is there a single underlying property (disease) or a cluster of related concerns?
  2.  **Function:** Does disease require part-level failure? Is function historical (selected effect) or forward-looking (current causal contribution)?
  3.  **Harm:** Must the bearer be worse off? Who decides (bearer, species-typical, counterfactual)?
  4.  **Statistics:** Does rarity matter? What is the reference class (age, species prime, fixed)?
  5.  **Primary Job:** Does the concept primarily Explain symptoms, License intervention, Excuse/Allocate sick role, or Authorize resource claims?

  ## Part 2: The Decision Tree
  *Instructions: Start at Node 1. Answer the question based on your intuition about the specific case described. Follow the arrow to the next node or to a final Position (Leaf).*

  **Node 1 (Case 4: The Autopsy Finding)**
  *Question:* A structural abnormality is found only at autopsy in someone who died of unrelated causes; it never caused symptoms. When we classify this finding, are we primarily **discovering a biological fact** or **authorizing a medical action**?
  *   **Discovering a fact** → Go to Node 2.
  *   **Authorizing an action** → Go to Node 8.

  **Node 2 (Case 10: Cross-Species)**
  *Question:* Consider mastitis in a dairy cow and rust in a wheat crop. Is the "disease" in the plant and animal the **same kind of biological fact** as human illness, regardless of human suffering?
  *   **No, human values are required** → **Leaf 1**.
  *   **Yes, it is biological** → Go to Node 3.

  **Node 3 (Case 7: Unexplained Disability)**
  *Question:* A cluster of disabling fatigue and pain reliably produces disability, but every test is normal and no mechanism is found. Is there a **specific bodily breakdown** present?
  *   **No, no breakdown** → **Leaf 2**.
  *   **Yes, something is broken** → Go to Node 4.

  **Node 4 (Case 6: One Kidney)**
  *Question:* A person has a congenital absence of one kidney. There is no functional loss if contact sports are avoided. Is the missing organ a **biological defect** simply because most others have two?
  *   **Yes, rarity implies defect** → **Leaf 3**.
  *   **No, function matters more** → Go to Node 5.

  **Node 5 (Case 2: Salt Conservation)**
  *Question:* A physiological response conserves salt and water (what it was shaped to do) but raises blood pressure and shortens life in a high-salt environment. Is the body **failing to do what it was designed to do**?
  *   **No, it is doing its design** → **Leaf 4**.
  *   **Yes, design is irrelevant to failure** → Go to Node 6.

  **Node 6 (Case 1: The 85% Trait)**
  *Question:* A trait is present in 85% of adults, reduces oxygen uptake by 12%, but is associated with slightly higher reproductive success. Is the reduced capacity a **functional failure**?
  *   **No, reproduction sets the standard** → **Leaf 5**.
  *   **Yes, capacity matters** → Go to Node 7.

  **Node 7 (Case 5: Infertility)**
  *Question:* A person is infertile but does not want children and reports no distress. Is the person **objectively worse off** regardless of their desire?
  *   **No, harm requires distress** → **Leaf 6**.
  *   **Yes, function failure is harm** → **Leaf 7**.

  **Node 8 (Case 8: School Behavior)**
  *Question:* A pattern of child behavior is statistically typical for the setting, but the school identifies and treats it, after which prevalence rises. Did the **label create the condition**?
  *   **Yes, the system made it real** → **Leaf 8**.
  *   **No, the system found it** → Go to Node 9.

  **Node 9 (Case 3: Risk Marker)**
  *Question:* A symptom-free thirty-year-old has a marker raising ten-year risk of a serious event from 1% to 4%. Is the person **currently damaged**?
  *   **Yes, risk is a state** → **Leaf 9**.
  *   **No, only manifestation counts** → Go to Node 10.

  **Node 10 (Case 9: Senescence)**
  *Question:* Aging is universal among those who live long enough and involves decline in every capacity. Is this decline a **defect**?
  *(Note: This is the only node asking about the reference class for "normal".)*
  *   **Yes, decline is bad** → **Leaf 10**.
  *   **No, decline is expected** → **Leaf 11**.

  ---

  ## Part 3: The Positions (Leaves)

  **Leaf 1: Human-Centric Normativist**
  *   **Commitments:** Disease requires human suffering or value violation; biology alone is insufficient.
  *   **Awkward Consequence:** Veterinary medicine and agriculture must be speaking metaphorically when they speak of disease.
  *   **Job Analysis:** Handles **Sick Role/Excuse** well (grounds it in human experience); handles **Explanation** badly (cannot explain animal pathology without anthropomorphism).

  **Leaf 2: Mechanism Skeptic**
  *   **Commitments:** Disease requires an identifiable local biological breakdown; functional disability without mechanism is not disease.
  *   **Awkward Consequence:** Patients with reliable disabling symptoms are denied the sick role until a mechanism is found.
  *   **Job Analysis:** Handles **Explanation** well (demands causal story); handles **Intervention** badly (blocks treatment for unexplained conditions).

  **Leaf 3: Statistical Naturalist**
  *   **Commitments:** Disease is statistical deviation from the norm; structural rarity constitutes pathology.
  *   **Awkward Consequence:** A healthy person with one kidney is diseased, while a dysfunctional person with a common trait is healthy.
  *   **Job Analysis:** Handles **Classification** well (clear metrics); handles **Treatment** badly (identifies "diseased" people who need no care).

  **Leaf 4: Selected-Effect Naturalist**
  *   **Commitments:** Function is defined by evolutionary history; if a part does what it was selected for, it is not failing.
  *   **Awkward Consequence:** Hypertension caused by salt-conservation mechanisms is not a disease, even if it kills the bearer.
  *   **Job Analysis:** Handles **Explanation** well (ties function to history); handles **Intervention** badly (rules out treating selected effects that are now harmful).

  **Leaf 5: Biostatistical Naturalist**
  *   **Commitments:** Disease is functional failure relative to species design; statistical typicality at species prime sets the standard.
  *   **Awkward Consequence:** A trait reducing capacity is healthy if it boosts reproduction, even if the individual suffers.
  *   **Job Analysis:** Handles **Explanation** well (objective biological standard); handles **Norms** badly (divorces health from individual welfare).

  **Leaf 6: Welfare-Based Normativist**
  *   **Commitments:** Disease requires the bearer to be worse off; subjective distress or desire determines harm.
  *   **Awkward Consequence:** Infertility is not a disease if the person is content, regardless of biological function.
  *   **Job Analysis:** Handles **Sick Role** well (aligns with patient experience); handles **Biology** badly (makes disease status depend on mood).

  **Leaf 7: Harmful Dysfunction Hybrid**
  *   **Commitments:** Disease requires both part-level functional failure and objective harm to the bearer.
  *   **Awkward Consequence:** Harmless functional failures (e.g., asymptomatic defects) are not diseases, limiting preventive care.
  *   **Job Analysis:** Handles **Explanation/Intervention** well (balances biology and harm); handles **Prevention** badly (excludes risk states without current harm).

  **Leaf 8: Institutional Pragmatist**
  *   **Commitments:** Disease ascriptions are tools created by institutions to manage populations; prevalence responds to labeling.
  *   **Awkward Consequence:** The disease did not exist before the school system identified it, making truth relative to policy.
  *   **Job Analysis:** Handles **Resources/Allocation** well (flexible to social need); handles **Truth** badly (denies independent reality of condition).

  **Leaf 9: Preventive Interventionist**
  *   **Commitments:** Risk factors constitute disease states; probability of future harm is current pathology.
  *   **Awkward Consequence:** Healthy people are treated as sick, medicalizing entire populations based on statistics.
  *   **Job Analysis:** Handles **Intervention** well (justifies early treatment); handles **Explanation** badly (posits disease where no current mechanism exists).

  **Leaf 10: Strong Normativist**
  *   **Commitments:** Any undesirable decline is a disease; statistical typicality does not excuse harm.
  *   **Awkward Consequence:** Aging is a medical condition requiring treatment, potentially infinite medicalization of life.
  *   **Job Analysis:** Handles **Resources** well (claims care for all suffering); handles **Naturalism** badly (confuses bad luck with biological failure).

  **Leaf 11: Life-History Naturalist**
  *   **Commitments:** Universal, expected decline is not a disease; reference class is age-specific typicality.
  *   **Awkward Consequence:** Medicine cannot treat aging, only specific diseases, leaving progressive decline unaddressed.
  *   **Job Analysis:** Handles **Explanation** well (distinguishes defect from fate); handles **Intervention** badly (limits scope of care for the elderly).

  ---

  ## Part 4: Seminar Analysis

  ### 1. Indistinguishable Leaves and the Eleventh Case
  **Pair:** **Leaf 6 (Welfare-Based Normativist)** and **Leaf 7 (Harmful Dysfunction Hybrid)**.
  **Reason:** Both require harm, but Leaf 6 locates harm in subjective distress while Leaf 7 locates it in objective functional loss. A student might answer "Yes" to Node 7 (Infertility) thinking "biologically worse off" while meaning "subjectively distressed," collapsing the distinction.
  **Separating Case:** *A genetic marker for a painful, late-onset condition that the bearer does not know they have.*
  *   **Leaf 6 Verdict:** Not a disease (no current distress/desire violation).
  *   **Leaf 7 Verdict:** Disease (functional failure exists, harm is objective/counterfactual).

  ### 2. Unstable Nodes
  **Node 5 (Selected-Effect)** and **Node 6 (Biostatistical)**.
  **Reason:** Students frequently confuse "what the body is designed to do" (evolutionary history) with "what the body is currently good at" (current capacity). A student may answer "No" to Node 5 (believing high blood pressure is a failure) but "No" to Node 6 (believing reproduction sets the standard), creating a logical tension between historical function and current statistical capacity. This is where the **Naturalism** axis is most fragile; spend class time disentangling *selected effect* from *current causal contribution*.

  ### 3. Reference Class Shift Impact
  **Shift:** Changing the reference class from **Species-at-Prime** to **Typical-for-Age**.
  **Impact:** This primarily affects **Node 10 (Senescence)** and **Node 6 (85% Trait)**.
  *   If "Typical-for-Age" is used, the 85% trait (Case 1) becomes statistically normal, pushing **Biostatistical Naturalists (Leaf 5)** toward **Statistical Naturalists (Leaf 3)** or **Life-History Naturalists (Leaf 11)**.
  *   Crucially, **Leaf 10 (Strong Normativist)** collapses into **Leaf 11 (Life-History Naturalist)**. If aging is "typical-for-age," it ceases to be a statistical deviation. The Strong Normativist must then rely entirely on the "Harm" axis without statistical support, making their position indistinguishable from the **Welfare-Based Normativist (Leaf 6)** regarding aging. This shift effectively halves the number of distinct positions available for conditions of the elderly.
