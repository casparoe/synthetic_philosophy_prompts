answer: |-
  Hi there, and thank you for asking such a thoughtful question because you have actually identified a genuine gap in how we usually talk about language. You are right that the existing terms don't quite fit. The euphemism treadmill is about meaning changing over time, and dog whistles are about intentional hidden messages, but what you are describing is when an innocent word becomes socially toxic solely because it resembles a taboo word in sound or spelling. Linguists sometimes refer to this broadly under taboo avoidance or phonetic taboo, but those terms often cover intentional changes or spiritual restrictions rather than this specific social accident. Since there isn't a single universally agreed-upon word for this exact phenomenon, the clearest way to name it is homophonic contamination. This concept describes the process where a neutral word acquires the social restrictions of a slur or taboo word not through history or meaning, but through phonetic or orthographic resemblance that creates a risk of misunderstanding. The core mechanism is exactly what you identified as a coordination problem involving signal noise and social risk. When a word sounds like a slur, it introduces ambiguity about the speaker's intent, and because the cost of being accused of using a slur is so high, the community coordinates on avoiding the word entirely to eliminate that risk, regardless of the word's actual etymology. This explains why knowing the words are unrelated doesn't solve the problem, because language is public and you cannot guarantee that every listener knows the etymology or trusts your intent, so the word remains contaminated by the possibility of misinterpretation. This applies to writing as well as speech, which is why your school's email filter blocked that place name, a specific instance often called the Scunthorpe problem, which is essentially orthographic contamination where the visual shape of the word triggers the same avoidance response as the sound. If someone uses the innocent word precisely because of the resemblance, that shifts the phenomenon from accidental contamination to intentional provocation or dog-whistling, because the speaker is leveraging the ambiguity rather than trying to avoid it, but the word itself remains contaminated for everyone else. Proper nouns are the hardest case because they cannot be easily swapped out, so they often become permanent sites of tension where the speaker must constantly signal their innocence or apologize for the resemblance, proving that the contamination sticks to the word itself regardless of whether a synonym exists. Ultimately, homophonic contamination shows that language isn't just about definitions and history, but about social safety and the shared agreement to avoid unnecessary friction, which is why a word can become unusable even when it is technically innocent.
