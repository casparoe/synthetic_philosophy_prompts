  3.  **Drafting the Analysis (Intentionalist):**
      *   *Theory:* Self-deception requires a project where the agent intends to make themselves believe $p$ while knowing $\neg p$. It's a stratagem.
      *   *Application:* Elena isn't currently intending to believe the reports are fine. She isn't actively suppressing the truth. The "deception" is a byproduct of a past policy, not a current intentional act.
