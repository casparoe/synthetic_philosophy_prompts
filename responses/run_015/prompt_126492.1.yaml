  5.  **Analyzing the Key Feature (Diachronic Gap):**
      *   *Work:* The gap separates the *intent* from the *belief formation*.
      *   *Intentionalist Problem:* They need the intent to coincide with the belief formation (or be part of the same project).
      *   *Deflationary Strength:* They don't care about the timing of the intent, only that motivation caused the bias.
