answer: |-
  **Scenario**
  Elena, a senior quality auditor at a metropolitan hospital, is reviewing quarterly surgical outcome reports produced by her own division when she notices statistical anomalies suggesting a ten percent inflation in success rates. Three months prior, following a stressful false-alarm incident that damaged morale, Elena had consciously mandated a personal policy requiring "ironclad, multi-source corroboration" before accepting any hypothesis of internal error, a standard significantly higher than the hospital's official protocol. As she examines the current anomalies, this stringent evidential filter engages automatically; she feels no anxiety and performs no active suppression of the data, but simply concludes that the irregularities are statistically inconclusive because they lack the specific corroboration her policy demands. She genuinely believes the reports are accurate enough, unaware that her threshold for "proof" was originally calibrated by her desire to protect her team's reputation rather than by objective statistical necessity.

  **Analysis of Philosophical Accounts**
  The **intentionalist account** verdicts that Elena is *not* self-deceived because it defines self-deception as a project where one mental subsystem intentionally directs another to acquire a specific false belief. In this scenario, the intentionalist cannot locate a *present-directed intention* to manipulate her belief state; the strategic decision occurred months ago, and her current cognitive processing is automatic and devoid of agential direction. Without a concurrent intention to deceive herself, she is merely mistaken, not self-deceived. Conversely, the **deflationary motivation-driven account** verdicts that she *is* self-deceived because it locates the phenomenon in the causal history of the belief rather than the agent's current project. It identifies a *motivated bias*: her desire to protect her division's reputation causally shaped her evidential standards, which in turn selectively filtered the data to produce a false belief, satisfying the conditions for self-deception without requiring a present act of deception.

  **The Diachronic Feature and the Gap**
  The philosophical work is isolated in the **temporal separation** between the intentional installation of the filter (Time 1) and its automatic execution (Time 2). This gap severs the link between current agency and current belief formation, which the intentionalist requires but the deflationary theorist does not. If this gap were removed—meaning Elena adopted the stringent standard *in the moment* upon seeing the anomalies—the disagreement would collapse into a standard case the intentionalist could comfortably claim: her immediate adoption of a high bar would constitute a synchronous, intentional strategy to avoid forming a threatening belief, thereby satisfying the intentionalist requirement for a present deceptive project.

  **Intentionist Counter-Attack and Assessment**
  The strongest line of attack for the intentionalist defender is the **"Extended Agency" argument**, positing that Elena's original intention persists as a standing policy she continues to endorse, making the automatic execution a proxy for her current will. However, this attack fails if we grant the premise that procedural habits can be intentionally adopted yet executed without concurrent intention. If the execution is truly non-agential and automatic at Time 2, the "standing policy" is merely a dispositional state, not an active mental act of deception. Consequently, the intentionalist cannot recover the requisite synchronous intentionality, leaving the deflationary account's explanation of motivated bias as the only viable description of the psychological mechanism at play.
