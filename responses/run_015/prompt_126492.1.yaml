      *   *The Twist:* Months ago, after a scandal in a peer division, Elena consciously decided, "I need ironclad proof before accusing our own team of error." She set a mental rule.
      *   *Current State:* She sees the anomalies now. The rule triggers automatically. She thinks, "This isn't enough evidence to conclude fraud." She feels calm, not anxious. She isn't actively pushing the thought away; she genuinely believes the evidence is insufficient *because* of the high bar she set.
