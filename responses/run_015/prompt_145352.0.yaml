      *   Rejection of Material Substrate: No "matter" underlying ideas.
      *   The Master Argument: One cannot conceive of an object existing unconceived.
      *   The Role of God: Ensures continuity of existence when finite minds aren't perceiving.
      *   Nature of Mind/Spirit: Active perceiver, not passive idea.

  3.  **Map to Software Engineering Concepts (Drafting the Mapping):**

      *   *Idea/Object:* Data structure instance.
      *   *Perception:* Access/Reference/Render.
      *   *Esse est percipi:* An object instance only exists in memory if there is an active reference chain to it (Reference Counting) OR if it is being actively processed/rendered (Rendering Pipeline).
      *   *Material Substrate:* The "Heap" independent of pointers? No, Berkeley denies the heap exists without pointers. This is tricky. Maybe the "Disk" vs. "RAM"? No, that implies storage without execution. Better: *Lazy Evaluation*. The value doesn't exist until evaluated.
      *   *Master Argument:* Trying to reference a null pointer? Or trying to instantiate a class without a constructor? It's about the impossibility of modeling "unreferenced existence" within the type system.
      *   *God:* A Root GC Daemon or a Persistent Event Log (Event Sourcing).
      *   *Mind:* An Observer/Subscriber process.

      *Refining the Mapping for Rigor:*
      *   *Esse est percipi:* **Reference Counting with Count > 0.** If `ref_count == 0`, the object is collected (does not exist).
      *   *Material Substance:* **Raw Memory Allocation without Pointers.** Berkeley says this is incoherent. In SE, raw memory without pointers is just noise/unreachable.
      *   *Master Argument:* **Type Safety/Compiler Check.** You cannot compile a reference to an object that isn't instantiated. To "conceive" is to "instantiate a reference."
      *   *Continuity (God):* **Event Sourcing / Write-Ahead Log.** The state isn't held in RAM (finite minds) constantly, but the *log* (Divine Mind) preserves the sequence of events so state can be reconstructed.
      *   *Mind vs. Idea:* **Process vs. Data.** A process (Mind) holds data (Ideas). Data cannot hold processes.

  4.  **Drafting the Translation Section:**
      *   Need to be careful not to slip into "Simulation Theory." Berkeley isn't saying the world is fake; he's saying the *ontology* is mental. In SE terms, the *ontology* is computational state, not physical silicon.
      *   *Claim 1: Ideas are the only objects.* -> *Construct: In-memory objects.* Mapping: There is no "disk" backing store independent of the runtime.
