answer: |-
  1. Evolutionary debunking arguments claim that because our moral instincts originated from fitness-enhancing pressures rather than truth-tracking mechanisms, our beliefs are unjustified. The exaptation framing accepts this causal origin but argues that the current cognitive use of these instincts operates independently of their original survival function.

  2. While debunkers insist that natural selection cannot align subjective values with objective moral truths, exaptation suggests that rational reflection can recalibrate tribal impulses toward universal principles. This implies that the reliability of our moral beliefs depends more on present-day reasoning than on the historical accuracy of our evolutionary programming.

  3. Treating morality as exaptation potentially weakens the debunking worry by demonstrating that our current ethical commitments are not slave to the genetic imperatives that spawned them. However, a staunch debunker might counter that even our capacity for rational reflection is itself shaped by those same non-truth-tracking evolutionary forces.

  4. The functional reconstruction inherent in exaptation shifts the focus from why a belief arose to how it is currently justified within a coherent normative system. This allows moral realists to argue that while the seed was tribal, the fruit is cultivated through logical consistency rather than reproductive success.

  5. Ultimately, the exaptation view challenges the debunking argument's assumption that causal origin permanently dictates epistemic status. It posits that a mechanism designed for survival can be repurposed for truth, provided we recognize and correct for its ancestral biases.
