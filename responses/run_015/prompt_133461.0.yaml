prompt: |-
  I teach an upper-level undergraduate seminar in philosophy of economics — fifteen students, a single ninety-minute session, one room with a whiteboard and a projector, no budget for cash payments but I can bring in six small real items (snacks and bits of stationery) to serve as stakes. The students have already worked through the standard consistency conditions on choice and the claim that an agent's choices can be represented as maximizing a utility function. What I want next week is for them to feel, before they are told, exactly which part of that claim carries empirical content and which part is bookkeeping.

  Please design a runnable activity with the following arc, and nothing in the way of up-front lecturing: the rules and roles should produce the discoveries, and I would rather not name revealed preference, the consistency axioms, or the choice-anomaly literature until the debrief.

  The sequence of things they should run into, in this order:

  First, they make a series of real, recorded choices from varying menus drawn from the six items, with one round selected at random at the end and each student actually receiving what they chose in it. Before the choices, they privately rank the six items and privately rate how strongly they want each one, on a scale from zero to ten; those sheets stay sealed until the end.

  Second, working in small groups from their own choice records, they try to write down a single utility function over the six items that makes every choice they made look like the maximization of something. Some groups should find that no such function exists, because among the menus there are pairs in which the same two options appear together, and then appear again alongside a third option that is clearly worse than one of them but not straightforwardly comparable to the other, so that the choice between the original two flips. I would like a second, independent route to the same failure built in as well, in case the first does not take.

  Third, once the failure is on the board, the facilitator permits utility to depend on the menu as well as the item. Fitting now becomes trivial and instant, and I want that contrast to be the thing they notice: the relaxed claim costs nothing to satisfy and therefore says nothing.

  Fourth, for the groups whose data was well behaved, the point that the numbers are not unique should come out of the comparison between groups rather than from my saying it — two groups should end up with functions that rank everything identically but disagree about how much better one item is than another, and should be brought to see that nothing in the choice records could settle the disagreement. Then the sealed intensity sheets come out, and each student checks which of the competing functions, if any, matches the strengths of desire they actually wrote down at the start.

  Finally, a closing sting: the class is told that only three of the six items can be stocked from now on, and must decide which three maximize total welfare given everything they have reconstructed. The groups should reach opposite recommendations from identical information about everyone's ordering, with no available data able to adjudicate between them.

  For the deliverable, please give me the six items with the attribute descriptions that make the manipulation work, the full menu schedule with timings, the record sheets, and a minute-by-minute plan for the ninety minutes including the transitions. Then a debrief that maps each moment onto the specific philosophical point it is meant to land, ordered and phrased so I can actually run it. I also want an honest account of what will predictably go wrong: students who work out what is being manipulated and start performing consistency, students who conclude that the moral is that people are irrational, groups that fit the data by assigning utility to item-menu pairs before I have licensed it, and what I should do if the class turns out to be so consistent that no violation materializes — assume I can pilot the menu schedule on another group beforehand. Close by being explicit about which features of the topic the activity cannot stage at all: the role of risk and the reasons utility has to be cardinal rather than merely ordinal under uncertainty, the difference between preference as a cause of choice and preference as a redescription of it, and the fact that nothing learned from snacks and stationery licenses welfare claims about real goods or real policies. Say plainly which of these I will simply have to assert in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergrad philosophy of economics seminar. 15 students. 90 minutes. Whiteboard + projector.
      *   **Constraints:** No cash payments. 6 small real items (snacks/stationery) as stakes. No up-front lecturing on revealed preference, consistency axioms, or anomalies before the activity.
      *   **Goal:** Students must *feel* the difference between empirical content (consistency) and bookkeeping (utility representation) before being told the theory.
      *   **Required Arc:**
          1.  Private ranking/intensity rating + Real choices from varying menus (one random round paid).
          2.  Groups try to fit a utility function to their choices. Some should fail (violations). Need two independent routes to failure.
          3.  Facilitator allows menu-dependent utility. Fitting becomes trivial (emptiness of the claim).
          4.  Well-behaved groups compare functions (ordinal vs. cardinal). Sealed intensity sheets reveal the mismatch between choice data and felt intensity.
          5.  Closing sting: Social welfare aggregation problem (identical orderings, different recommendations).
      *   **Deliverables:** 6 items + attributes, Menu schedule + timings, Record sheets, Minute-by-minute plan, Debrief guide, Predictable failures/mitigations, Limitations of the activity.

  2.  **Designing the Items (The "Goods"):**

      *   Need 6 items. They need to be distinct enough to generate preferences but similar enough to allow for context effects (attraction/compromise effects) to trigger violations.
      *   *Constraint:* Must be snacks/stationery.
      *   *Idea:* Use a "Coffee Break" theme.
      *   *Items:*
          1.  **A:** High-quality Chocolate Bar (Hershey's Kisses bag)
          2.  **B:** Medium-quality Chocolate Bar (Snickers)
          3.  **C:** Low-quality Chocolate Bar (Generic store brand)
          4.  **D:** Savory Snack (Pretzels)
          5.  **E:** Nice Pen (Bic Cristal)
          6.  **F:** Okay Pen (Generic ballpoint)
      *   *Refinement for Violations:* To get preference reversals (violations of WARP/Independence), I need context effects. The *Attraction Effect* (Decoy) is the easiest to engineer in a classroom.
      *   *Revised Items for Attraction Effect:*
          *   Item 1: Gourmet Cookie (High value, high cost/effort? No, just "better"). Let's stick to simple desirability.
          *   Let's create pairs where one dominates the other, and a third acts as a decoy.
          *   Actually, for a philosophy class, we want *intransitivity* or *WARP violations*.
          *   *Strategy:* Use attributes.
          *   Item A: Fancy Pen (Silver)
          *   Item B: Simple Pen (Black)
          *   Item C: Broken Pen (Clearly worse than B) -> Decoy for B.
          *   Item D: Dark Chocolate
          *   Item E: Milk Chocolate
          *   Item F: White Chocolate (Polarizing)
      *   *Better Strategy for Violations:* The prompt asks for *two independent routes* to failure.
          1.  **Route 1: Context Dependence (Attraction/Compromise).** A vs B changes when C is added.
          2.  **Route 2: Framing/Endowment-ish.** Or simply Intransitivity via multi-attribute trade-offs.
      *   *Selection:*
          1.  **Premium Pen** (Pilot G2)
          2.  **Standard Pen** (Bic)
          3.  **Cheap Pen** (Generic, scratchy) -> *Decoy for Standard*
          4.  **Dark Chocolate** (Lindt square)
          5.  **Milk Chocolate** (Hershey)
          6.  **Fruit Chew** (Starburst)
      *   *Wait, I need the violations to happen naturally.* If I just ask "Pick one," they might be too rational. I need to structure the *menus* to trigger the effects.
      *   *Let's define the items by attributes to make the trade-off clear.*
          *   1: **Fancy Pen** (Writes well, looks cool)
          *   2: **Basic Pen** (Writes okay, looks plain)
          *   3: **Broken Pen** (Doesn't write, looks plain) -> *Decoy to make Basic look good.*
          *   4: **Dark Choc** (Bitter, High Quality)
          *   5: **Milk Choc** (Sweet, Med Quality)
          *   6: **White Choc** (Sweet, Low Quality) -> *Decoy to make Milk look good.*
      *   *Actually, let's simplify.* 6 distinct items. The *Menus* create the violation.
      *   *Items:*
          1.  **Gold Pen** (Nice)
          2.  **Blue Pen** (Okay)
          3.  **Red Pen** (Meh)
          4.  **Dark Choc**
          5.  **Milk Choc**
          6.  **Gummy**
      *   *To ensure violations:* I need to force a trade-off.
      *   *Let's try the "Trade-off" method for Route 2.*
      *   *Route 1 (Decoy):* Menu {Gold, Blue} vs Menu {Gold, Blue, Red (worse than Blue)}. Some might switch from Gold to Blue because Blue dominates Red.
      *   *Route 2 (Compromise):* Menu {Dark, Milk} vs Menu {Dark, Milk, White}. White is extreme. Milk becomes the compromise.
      *   *Okay, I will design the Menu Schedule to specifically target these psychological effects without telling the students.*

  3.  **Designing the Menu Schedule:**

      *   Need enough rounds to get data, but fit in 90 mins.
      *   Let's say 5 Choice Rounds.
      *   Round 1: Baseline (A vs B).
      *   Round 2: Decoy added (A vs B vs C). C is dominated by B.
      *   Round 3: Baseline 2 (D vs E).
      *   Round 4: Compromise added (D vs E vs F). F is extreme.
      *   Round 5: A vs D (Cross-category).
      *   *Timing:* 2 mins per choice round + recording. 10 mins total for choices.
      *   *Wait, 15 students.* Groups of 3 = 5 groups.
      *   *Pre-activity:* 5 mins ranking/rating.
      *   *Choices:* 15 mins.
      *   *Group Work (Fitting Utility):* 20 mins.
      *   *Debrief/Transition:* 40 mins.
      *   *Closing:* 10 mins.
      *   *Total:* 90 mins.

  4.  **Drafting the Record Sheets:**

      *   Sheet 1: Private Ranking (1-6) + Intensity (0-10). Sealed envelope.
      *   Sheet 2: Choice Log (Menu presented, Item chosen).
      *   Sheet 3: Utility Construction (Assign numbers to items to justify choices).

  5.  **Addressing the "Two Routes to Failure":**

      *   *Route 1:* Violation of Independence of Irrelevant Alternatives (IIA) / Attraction Effect.
          *   Menu 1: {Gold Pen, Dark Choc}. Choice: Gold Pen.
          *   Menu 2: {Gold Pen, Dark Choc, Blue Pen}. (Blue Pen is worse than Gold Pen in every way). Choice: Dark Choc? No, that's not how attraction works.
          *   *Correction:* Attraction effect works on *similar* items.
          *   Menu 1: {Gold Pen, Blue Pen}. (Gold is better quality, Blue is cheaper? No, just quality). Let's say Gold is "Fancy", Blue is "Practical".
          *   Menu 2: {Gold Pen, Blue Pen, Red Pen}. Red is worse than Blue.
          *   *Target:* Student picks Blue in Menu 2 (because it dominates Red), but picked Gold in Menu 1.
      *   *Route 2:* Intransitivity via Multi-attribute.
          *   Menu 3: {Dark Choc, Milk Choc}. Pick Dark.
          *   Menu 4: {Milk Choc, Gummy}. Pick Milk.
          *   Menu 5: {Gummy, Dark Choc}. Pick Gummy.
          *   *Cycle:* Dark > Milk > Gummy > Dark.
      *   *Implementation:* I need to write the menu schedule to encourage this. I cannot *force* it, but I can stack the deck. I will instruct the instructor to pilot this. For the plan, I will assume the menu schedule is designed to trigger these.

  6.  **Addressing the "Menu-Dependent Utility" (Step 3):**

      *   Once they fail to fit $U(x)$, allow $U(x, Menu)$.
      *   This makes every choice rationalizable. $U(Gold, \{G, B\}) = 10$, $U(Blue, \{G, B\}) = 5$. $U(Blue, \{G, B, R\}) = 10$, $U(Gold, \{G, B, R\}) = 5$.
      *   Point: Tautology.

  7.  **Addressing "Ordinal vs. Cardinal" (Step 4):**

      *   Groups with consistent data (or who fixed their data).
      *   Group A assigns: Gold=10, Blue=5.
      *   Group B assigns: Gold=100, Blue=99.
      *   Both explain the choice "Gold over Blue".
      *   Reveal sealed intensity sheets. Student wrote "Gold: 8, Blue: 7". Group B is closer? Or "Gold: 10, Blue: 2". Group A is closer.
      *   Point: Choice data only reveals ordering, not intensity. Welfare requires intensity.

  8.  **Addressing "Social Welfare" (Step 5):**

      *   "We can only keep 3 items for the whole class."
      *   Utilitarian Sum (needs cardinal) vs. Pareto (needs ordinal).
      *   If Group A uses cardinal sum, they pick {Gold, Dark, Gummy}.
      *   If Group B uses ordinal count (Borda), they pick {Blue, Milk, Pen}.
      *   Point: Without cardinal info, welfare is indeterminate.

  9.  **Predictable Failures & Mitigations:**

      *   *Students gaming:* They know it's a class. They might try to be consistent.
          *   *Fix:* Emphasize "Choose what you *actually* want right now." "One round is real." Speed is key.
      *   *No violations:* Everyone is too rational.
          *   *Fix:* Have a "Plant" or pre-recorded data set from a pilot group to show as a "Case Study" if the live data is too clean. (The prompt says assume I can pilot beforehand). I will include a "Backup Data Packet" instruction.
      *   *Premature Menu-Utility:* Students write $U(x, M)$ before allowed.
          *   *Fix:* Strict rules on Sheet 3. "Assign one number per Item."
      *   *Cynicism:* "People are irrational."
          *   *Fix:* Debrief must steer to "The model is empty," not "Humans are broken."

  10. **Limitations:**

      *   Risk/Uncertainty: Not covered (needs lotteries).
      *   Preference as Cause vs. Redescription: Hard to stage without psychology.
      *   External Validity: Snacks != Policy.

  11. **Refining the Plan (Minute-by-Minute):**

      *   0-5: Setup & Private Sheets.
      *   5-20: Choice Rounds (5 rounds x 3 mins).
      *   20-40: Group Work (Fit Utility).
      *   40-50: The "Cheat Code" (Menu-dependent).
      *   50-65: Ordinal vs. Cardinal (Comparison).
      *   65-75: Intensity Reveal.
      *   75-85: Welfare Aggregation.
      *   85-90: Final Debrief & Theory Names.

  12. **Developing the Items & Menus specifically:**

      *   *Items:*
          1.  **P1:** Metallic Pen (Nice)
          2.  **P2:** Plastic Pen (Standard)
          3.  **P3:** Dull Pencil (Bad) -> *Decoy for P2*
          4.  **C1:** Dark Choc (Bitter)
          5.  **C2:** Milk Choc (Sweet)
          6.  **C3:** Fruit Chew (Chewy) -> *For Intransitivity cycle*
      *   *Menus:*
          1.  {P1, P2}
          2.  {P1, P2, P3} (Target: Switch to P2)
          3.  {C1, C2}
          4.  {C2, C3}
          5.  {C3, C1} (Target: Cycle C1>C2>C3>C1)
      *   *Wait, Cycle is hard to force.* Let's rely on the Decoy (Route 1) and the "Compromise" (Route 2).
      *   *Route 2 (Compromise):*
          3. {C1, C2}
          4. {C1, C2, C3} where C3 is extreme (e.g., Super Bitter or Super Sweet). Let's make C3 "White Choc" (Very Sweet). C1 (Dark), C2 (Milk).
          5.  Actually, let's stick to the prompt's request for *two independent routes*.
          6.  Route 1: IIA Violation (Decoy).
          7.  Route 2: Intransitivity (Cycle).
      *   *I'll provide the Menu Schedule designed to maximize the probability of these, with the instruction to use Pilot Data if live data fails.*

  13. **Final Review against Constraints:**

      *   No up-front lecturing? Yes.
      *   6 items? Yes.
      *   Sealed sheets? Yes.
      *   Menu-dependent utility reveal? Yes.
      *   Ordinal/Cardinal clash? Yes.
      *   Welfare sting? Yes.
      *   Limitations section? Yes.

  14. **Writing the Response:** Structure clearly with headings. Ensure tone is professional and instructional. (Self-Correction: Make sure the "Welfare" step is clear. How do they reach opposite recommendations? One group maximizes sum of utility (cardinal), one maximizes number of first-place votes (ordinal/Borda). Since cardinal is arbitrary, the sum is arbitrary.)

  15. **Refining the "Welfare" Step:**
      *   Class has 15 students.
      *   Suppose everyone ranks Items 1, 2, 3 as top 3.
      *   Group A (Cardinal focus): "Item 1 is *much* better than 2." Sum of utilities favors Item 1 heavily.
      *   Group B (Ordinal focus): "Item 1 and 2 are just 'preferred'." They might use a voting rule.
      *   *Better:* The prompt says "Groups should reach opposite recommendations from identical information about everyone's ordering."
      *   *Scenario:* All 15 students have the same ordering: A > B > C > D > E > F.
      *   *Task:* Pick 3 items to stock for the *whole class* to share (or maximize total welfare).
      *   *Problem:* If we only know ordering, we don't know if A is slightly better than B or infinitely better.
      *   *Group 1:* Assumes linear spacing (10, 8, 6...). Picks {A, B, C}.
      *   *Group 2:* Assumes A is a "lemon" and B/C are close. (Wait, if ordering is identical, how do they differ?)
      *   *Ah, the "Intensity Sheets" from Step 4.*
      *   Some students rated A=10, B=9. Others rated A=10, B=1.
      *   If we aggregate *only* the choice data (ordering), we lose this.
      *   If Group 1 uses the *average intensity* from the reveal: They pick {A, D, E} (because A's intensity is low for most, but D is high).
      *   If Group 2 uses *only choice frequency* (Ordinal): They pick {A, B, C} (because A is always chosen first).
      *   *Correction:* The prompt says "from identical information about everyone's ordering." This implies they *don't* see the intensity sheets for the whole class, only their own.
      *   *Solution:* Group 1 assumes utility is cardinal and linear (1st=10, 2nd=9...). Group 2 assumes utility is merely ordinal and uses a Condorcet/Borda count.
      *   *Actually, simpler:* Group 1 maximizes the *sum* of their constructed utilities. Group 2 maximizes the *count* of top-rankings. Because the constructed utilities in Step 4 were arbitrary (10 vs 100), the Sum will differ.
      *   *Example:*
          *   Student 1: A > B. Utility A=10, B=0. Sum = 10.
          *   Student 2: A > B. Utility A=100, B=99. Sum = 199.
          *   If we aggregate Student 1 & 2's *choices*: A is winner.
          *   If we aggregate *utilities*: B might win if Student 2's intensity is counted.
          *   *Wait, the groups construct the functions.*
          *   Group 1 constructs $U_1$. Group 2 constructs $U_2$. Both fit the data.
          *   Task: Maximize $\sum U$.
          *   Group 1 says: "We set A=10, B=5. Total Welfare = 15."
          *   Group 2 says: "We set A=10, B=9. Total Welfare = 19."
          *   Decision: "Keep 3 items."
          *   Group 1: Keep A, C, E.
          *   Group 2: Keep B, C, E (Because B is 'close' to A in value).
          *   *Yes, this works.* The arbitrariness of the cardinalization leads to different policy outcomes.

  16. **Final Polish:** Check timings. 90 minutes is tight. Keep transitions sharp. Ensure the "No Lecturing" rule is respected in the plan (Facilitator instructions only).

  17. **Limitations Section:** Be honest. Snacks != Health Policy. Risk is missing. Causality is murky.

  18. **Output Generation:** (Drafting the response based on these thoughts).
answer: |-
  # Seminar Activity: The Empty Maxim

  **Course:** Philosophy of Economics (Upper-Level Undergraduate)
  **Session:** 90 Minutes
  **Class Size:** 15 Students (5 Groups of 3)
  **Materials:** Projector, Whiteboard, 6 Types of Items, Envelopes, Handouts.

  ---

  ## 1. The Six Items (The "Goods")

  To generate the required violations without explicit instruction, the items must differ along multiple attributes (quality, type, familiarity) to trigger context effects.

  1.  **Item A (Premium Pen):** A Pilot G2 or similar gel pen (Smooth, looks professional).
  2.  **Item B (Standard Pen):** A standard Bic Cristal (Functional, plain).
  3.  **Item C (Decoy Pen):** A generic, scratchy ballpoint (Clearly worse than B).
  4.  **Item D (Dark Chocolate):** A square of 85% Lindt (Bitter, "high brow").
  5.  **Item E (Milk Chocolate):** A square of Hershey's (Sweet, familiar).
  6.  **Item F (Fruit Chew):** A Starburst or similar (Chewy, distinct texture).

  **Attribute Logic for Violations:**
  *   **Route 1 (Attraction Effect):** Item C is dominated by Item B. In a binary choice {A, B}, students may prefer A (Quality). In a ternary choice {A, B, C}, Item B looks superior to C, making B appear more "choice-worthy" relative to A, causing a switch.
  *   **Route 2 (Intransitivity Cycle):** Multi-attribute trade-offs. A (Quality) > D (Taste). D (Taste) > F (Texture). F (Novelty) > A (Practicality).

  ---

  ## 2. Record Sheets & Handouts

  **Sheet 1: The Private Ledger (Sealed)**
  *   *Instructions:* Do not show this to anyone. Do not open until instructed at the end.
  *   *Task:* Rank the 6 items from 1 (Most Desired) to 6 (Least Desired).
  *   *Task:* Rate the **Intensity** of desire for each item on a scale of 0–10 (0 = Indifferent, 10 = Desperate).
  *   *Action:* Place in envelope. Seal. Write Name on outside.

  **Sheet 2: The Choice Log (Public)**
  *   *Columns:* Round # | Menu Presented | Item Chosen.
  *   *Rows:* 1 through 5.
  *   *Note:* "One round will be selected at random. You will receive the item you chose in that round."

  **Sheet 3: The Utility Constructor (Group Work)**
  *   *Task:* Assign a single number (Utility) to each of the 6 items (A–F).
  *   *Constraint:* The numbers must explain every choice your group members made on Sheet 2. (If a student chose A over B, $U(A)$ must be $> U(B)$ in that menu).
  *   *Rule:* You may assign only **one** number per Item. You cannot change the number based on the menu.

  ---

  ## 3. The Menu Schedule

  *Projected on screen. 3 Minutes per round.*

  *   **Round 1 (Baseline):** Choose one: { **A** (Premium Pen), **B** (Standard Pen) }
  *   **Round 2 (Decoy):** Choose one: { **A** (Premium Pen), **B** (Standard Pen), **C** (Decoy Pen) }
      *   *Goal:* Trigger switch from A to B due to C's presence.
  *   **Round 3 (Baseline 2):** Choose one: { **D** (Dark Choc), **E** (Milk Choc) }
  *   **Round 4 (Trade-off):** Choose one: { **E** (Milk Choc), **F** (Fruit Chew) }
  *   **Round 5 (Cycle Close):** Choose one: { **F** (Fruit Chew), **D** (Dark Choc) }
      *   *Goal:* Trigger cycle D > E > F > D.

  *End of Choices:* Instructor draws a random number (1–5). Students who chose the winning item in that round come to the front to receive their physical item immediately. (This validates the stakes).

  ---

  ## 4. Minute-by-Minute Plan

  | Time | Phase | Activity & Facilitator Script |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Hand out Sheets 1, 2, Envelopes. **Script:** "Complete Sheet 1 privately. Seal it. This is your internal state. Sheet 2 is your external action. We begin choices immediately." |
  | **05–20** | **Choices** | Project Menus (Rounds 1–5). 3 mins per round. **Script:** "Choose the one you actually want. One round is real. Record on Sheet 2." *Collect Sheet 2 data on whiteboard (tally marks) as they go.* |
  | **20–25** | **Grouping** | Form 5 groups of 3. **Script:** "Pool your Sheet 2 data. You now have 15 choice records." |
  | **25–45** | **Construction** | **Task:** Use Sheet 3. Assign one utility number per item (A–F) that rationalizes *all* 15 choice records in your group. <br>**Script:** "If Student X chose A over B, your $U(A)$ must be higher than $U(B)$. Find a set of 6 numbers that works for everyone." <br>*Monitor groups. Some will struggle.* |
  | **45–55** | **The Failure** | **Transition:** Call on a group that failed. **Script:** "Show us the contradiction." (e.g., "In Round 1, $U(A)>U(B)$. In Round 2, $U(B)>U(A)$."). <br>**Facilitator Move:** "Okay. The rule 'One number per item' is too hard. New Rule: You may assign a number to an **Item-Menu Pair**. $U(A, \text{Round 1})$ can differ from $U(A, \text{Round 2})$." <br>*Wait 2 minutes.* **Script:** "Is it solved?" (Yes, trivially). |
  | **55–65** | **Ordinality** | **Focus:** Groups that *did* find a consistent function (or fixed their data). <br>**Script:** "Compare your numbers with the group next to you. Do you have the same function?" <br>*Expected:* Group 1 has {10, 5, 0...}. Group 2 has {100, 90, 80...}. Both fit the data. <br>**Point:** "Does the data tell you which numbers are right?" (No). |
  | **65–75** | **Intensity** | **Reveal:** Open Sheet 1 (Sealed Envelopes). <br>**Script:** "Look at your Intensity Ratings (0–10). Do they match the *gaps* in your Utility Function?" <br>*Expected:* Student chose A over B (Utility gap 5), but rated Intensity A=10, B=9 (Gap 1). Another rated A=10, B=1 (Gap 9). Both choices were 'A'. <br>**Point:** "Choice reveals order. It does not reveal strength." |
  | **75–85** | **Welfare Sting** | **Task:** "The department will only fund 3 items for the whole class next semester. Which 3 maximize total welfare?" <br>**Constraint:** You must use the data generated today. <br>*Group A (Cardinal):* Sums their constructed utilities. Picks items with highest sum. <br>*Group B (Ordinal):* Counts first-place votes. Picks most frequent winners. <br>*Conflict:* Because cardinal values were arbitrary (Step 4), the Sum is arbitrary. Group A picks {A, D, F}. Group B picks {A, B, C}. <br>**Script:** "You have identical choice data. You have opposite policy recommendations. Why?" |
  | **85–90** | **Debrief** | **Lecture:** Name the concepts. Revealed Preference. WARP. IIA. Ordinal vs. Cardinal Utility. Social Welfare Functions. Assign reading. |

  ---

  ## 5. The Debrief Guide (Philosophical Mapping)

  *Do not lecture until the final 5 minutes. Use these prompts during the activity transitions to land the points.*

  **1. The Empirical Content (Minutes 45–55)**
  *   **Observation:** When restricted to one number per item, some choices were "impossible."
  *   **Philosophical Point:** The claim "agents maximize utility" has empirical content *only* if utility is stable across contexts. The **Weak Axiom of Revealed Preference (WARP)** is the empirical bite. If choices flip when a dominated option is added, the stable utility model is falsified.

  **2. The Bookkeeping (Minutes 45–55)**
  *   **Observation:** When allowed to assign utility to Item-Menu pairs, *every* choice was rationalizable instantly.
  *   **Philosophical Point:** If utility can change with the menu, the claim "agents maximize utility" is a tautology. It describes everything and predicts nothing. It is **bookkeeping**, not theory.

  **3. The Indeterminacy of Scale (Minutes 55–65)**
  *   **Observation:** Group A and Group B fit the same choices with different numbers (10,5 vs 100,90).
  *   **Philosophical Point:** Choice data supports **Ordinal Utility** only. Any monotonic transformation of the numbers preserves the choice. There is no "true" distance between options in the choice record.

  **4. The Intensity Gap (Minutes 65–75)**
  *   **Observation:** Sealed intensity sheets showed high variance in "strength of desire" for identical choices.
  *   **Philosophical Point:** **Revealed Preference** deliberately discards psychological intensity. It defines preference *by* choice. If you want to talk about "how much" someone wants something, choice data alone is insufficient.

  **5. The Welfare Aggregation Problem (Minutes 75–85)**
  *   **Observation:** Groups recommended different items to stock based on the same choice data.
  *   **Philosophical Point:** **Social Welfare** requires interpersonal comparison of utility. If utility is only ordinal (derived from choice), we cannot sum it. If we cardinalize it arbitrarily (to make it summable), our policy recommendations become arbitrary.

  ---

  ## 6. Predictable Failures & Mitigations

  **1. The "Good Student" Effect (Too Much Consistency)**
  *   **Risk:** Students know they are being tested. They force themselves to be consistent, ignoring the decoy or cycle.
  *   **Mitigation:** You piloted the menus. If the live class is too rational, **pause at Minute 45**. Say: "In a pilot run with this exact menu, 40% of students switched preferences in Round 2. Here is their anonymized data sheet." Hand out the pilot data to the groups that were perfectly consistent. Ask them to solve *that* puzzle instead. This preserves the violation without shaming the live students.

  **2. Premature Menu-Dependent Utility**
  *   **Risk:** A clever student writes $U(A, R1)$ on Sheet 3 before you authorize it.
  *   **Mitigation:** Circulate during the 25–45 min block. If you see it, cover it with a post-it. "Save that insight. Stick to the rule for now. The rule is the puzzle."

  **3. The "Irrationality" Conclusion**
  *   **Risk:** Students conclude the moral is "Humans are irrational."
  *   **Mitigation:** Steer the debrief. "The point isn't that the students are broken. The point is that the *model* of stable utility is too rigid to capture context, or too flexible to capture anything. The failure is in the representation, not necessarily the agent."

  **4. The Welfare Confusion**
  *   **Risk:** In the final sting, students argue "Just ask everyone how much they want it!"
  *   **Mitigation:** Remind them of Sheet 1. "You have that data now. But standard economics says we *cannot* use that data for policy, only choice data. Why? Because self-reports are 'cheap talk'. Based *only* on the choices you made (Sheet 2), can you decide?" (No).

  ---

  ## 7. Limitations of the Activity

  *Be explicit about these in the final 5-minute lecture. Do not try to stage them; assert them.*

  1.  **Risk and Uncertainty:** This activity uses certain outcomes. It cannot demonstrate why utility must be **cardinal** under risk (Von Neumann-Morgenstern). In the presence of lotteries, mere ordinal ranking is insufficient to predict choice; the *intervals* matter. You must assert this: "Today showed ordinal utility fits certain choice. Next week we will see why risk forces us to treat utility as cardinal."
  2.  **Preference: Cause vs. Redescription:** The activity treats preference as a summary of choice. It does not stage the psychological debate: Does the preference *cause* the choice, or is it just a label we stick on the choice after the fact? You must assert this: "We acted as if preference drove choice. A psychologist might argue the context drove the choice, and we just invented the preference to match."
  3.  **External Validity (Snacks vs. Policy):** The stakes are trivial. A switch between a pen and chocolate costs nothing. In real policy (healthcare, housing), consistency constraints have moral weight. You must assert this: "We found the model is empty. But in law and policy, we *enforce* consistency (e.g., equal protection) as if it weren't. That is a normative commitment, not an empirical finding from snacks."

  ---

  ## 8. Instructor Prep Checklist

  1.  **Purchase Items:** Ensure 3 copies of each of the 6 items (for the random payout).
  2.  **Pilot the Menus:** Run the 5-round menu on 5 friends/colleagues beforehand. Verify that at least one violation (Decoy or Cycle) occurs. If not, adjust the item descriptions (e.g., emphasize the "scratchiness" of Pen C) until the violation rate is >30%.
  3.  **Prepare Backup Data:** If the pilot yields perfect consistency, create a fake "Past Class" dataset that contains violations to use as a backup.
  4.  **Envelopes:** 15 small envelopes for Sheet 1.
  5.  **Whiteboard:** Pre-draw the 5 Menu structures to save time projecting.
