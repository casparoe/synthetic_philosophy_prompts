prompt: |-
  I convene a large first-year course on practical reasoning, and twice a term my teaching assistants and I have to grade short policy papers in which the argument almost always turns on a historical analogy: this is another Munich, this is Vietnam again, this is the Thucydides trap playing out. We mark them inconsistently, and I would like a procedure instead.

  Please give me a decision procedure a marker can run in about ten minutes per paper, with no training in philosophy or history, to determine whether a given analogy is doing argumentative work or only lending a conclusion an air of inevitability. I want ordered tests, each with a statement of what would count as a pass and what as a fail, and a clear account of where the procedure stops and hands the remainder to judgment.

  The cases it must handle: the student who supplies no features beyond the name; the lesson stated so that no outcome could disconfirm it; the analogy the historical actors were themselves invoking, so that the comparison is part of the causal story rather than a neutral observation of it; and the case both sides cite for opposite conclusions. I also want a place for the level-of-abstraction problem, since any two episodes match under some description, and for a test I have found useful in my own reading — an invariance test, on which an analogy earns its conclusion only if the outcome would survive changes in the features the analogy does not mention.

  Then apply the procedure to three papers on my desk: one arguing that a trade concession to a rising power is Munich; one arguing that a limited military intervention is justified because Vietnam taught us to avoid quagmires; one invoking the Thucydides trap to argue that a great-power war is structural and policy therefore cannot matter. The Vietnam argument is one I make myself in lecture; if the procedure fails it, say so plainly. Finally, tell me what the procedure cannot tell me — where a good paper will still be marked down and a weak one still pass.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Instructor of a large first-year practical reasoning course.
      *   **Problem:** Grading short policy papers relying on historical analogies (Munich, Vietnam, Thucydides Trap) is inconsistent among TAs.
      *   **Goal:** A decision procedure for markers (no philosophy/history training needed) to evaluate analogies in ~10 minutes/paper.
      *   **Requirements:**
          *   Ordered tests (Pass/Fail criteria).
          *   Clear stopping point (where judgment takes over).
          *   Handle specific cases: Name-dropping only, unfalsifiable lessons, actors' own analogies (self-fulfilling), contested analogies (both sides use it).
          *   Address level-of-abstraction problem.
          *   Include an "invariance test" (outcome survives changes in unmentioned features).
          *   Apply to three specific sample papers (Trade/Munich, Intervention/Vietnam, War/Thucydides).
          *   Critique the procedure itself (limitations, false positives/negatives).
          *   *Crucial Constraint:* If the procedure fails the instructor's own Vietnam argument, admit it plainly.

  2.  **Deconstruct the Analogy Evaluation Problem:**
      *   Analogies in policy arguments usually function as:
          1.  *Rhetorical flourish:* "This is Munich!" (No work done).
          2.  *Causal mechanism:* "Because X happened then, and A matches X, Y will happen now."
          3.  *Normative precedent:* "We did Z then, so we should do Z now."
      *   Common fallacies: Superficial similarity, ignoring disanalogies, determinism (inevitability), cherry-picking.
      *   The "Invariance Test" requested is essentially a robustness check: Does the conclusion hold if we tweak the non-essential details?

  3.  **Drafting the Decision Procedure (The "Analogy Audit"):**
      *   *Time Limit:* 10 minutes. Needs to be checklist-style.
      *   *Step 1: Identification.* Is there actually an analogy, or just a label? (Handles "name-dropping").
      *   *Step 2: Structural Mapping.* Are specific features listed? (Handles "level of abstraction").
      *   *Step 3: Falsifiability.* Could the analogy be wrong? (Handles "no outcome could disconfirm").
      *   *Step 4: Invariance/Robustness.* (Specific request).
      *   *Step 5: Reflexivity/Contestation.* (Handles "actors invoking it" and "both sides cite it").
      *   *Stopping Rule:* If it passes all tests, it *might* be good. If it fails one, it's flawed. But passing doesn't guarantee truth, just structural soundness.

      *Refining the Steps for Non-Experts:*
      *   TAs don't know history. They can't judge *if* the analogy is historically accurate. They must judge *how* it is used.
      *   Focus on argumentative structure, not historical fact-checking.

      *Drafting the Steps:*
      1.  **The Label Test:** Does the student list *why* the cases match? (Pass: 3+ specific features. Fail: Just the name).
      2.  **The Falsification Test:** Is there a scenario where the analogy holds but the conclusion fails? (Pass: Yes. Fail: No/It's inevitable).
      3.  **The Abstraction Test:** Is the level of detail consistent? (Pass: Specific mechanisms match. Fail: Vague "aggression" vs specific "annexation").
      4.  **The Invariance Test:** If we change a detail not mentioned, does the conclusion change? (Pass: Conclusion stays. Fail: Conclusion flips).
      5.  **The Reflexivity Test:** Is the analogy driving the actors, or just describing them? (Pass: Acknowledged. Fail: Treated as external law).

      *Wait, I need to order these logically.*
      1.  Existence (Label Test).
      2.  Specificity (Abstraction Test).
      3.  Logic/Falsifiability (Falsification Test).
      4.  Robustness (Invariance Test).
      5.  Context (Reflexivity/Contestation).

      *Let's refine the "Invariance Test" definition for TAs:* "If you change a detail of the current situation that the student *didn't* mention, does their prediction still hold?" This is hard for a TA to know without domain knowledge.
      *Better formulation:* "Does the student identify which features are *essential* to the outcome? If I remove a feature they didn't highlight, does their logic break?"
      *Actually, let's stick closer to the prompt's definition:* "Outcome would survive changes in the features the analogy does not mention."
      *TA Instruction:* Look for a sentence where the student says "Even if [X] were different, [Y] would still happen because of [Core Mechanism]." If absent, flag as "Deterministic."

      *Let's simplify for a 10-minute workflow.*
      1.  **Feature Count:** (3 specific similarities).
      2.  **Disanalogy Check:** (Did they mention a difference?).
      3.  **Invariance:** (Is the mechanism robust?).
      4.  **Contestation:** (Did they acknowledge the other side?).

      *Okay, let's build the "Analogy Audit Protocol (AAP)".*

  4.  **Developing the Specific Tests:**

      *   **Test 1: The Inventory (Name vs. Argument).**
          *   Pass: Student lists at least 3 specific structural features shared by Case A (History) and Case B (Current).
          *   Fail: Student uses the name (e.g., "Munich") without listing features.
      *   **Test 2: The Falsifiability Check (Inevitability).**
          *   Pass: Student describes a condition under which the historical lesson would *not* apply.
          *   Fail: The lesson is stated as a law of nature (e.g., "Appeasement always leads to war").
      *   **Test 3: The Invariance Test (Robustness).**
          *   Pass: Student identifies the *causal mechanism* and argues it holds even if superficial details change.
          *   Fail: Conclusion depends on superficial details matching perfectly.
      *   **Test 4: The Reflexivity/Contestation Check.**
          *   Pass: Student acknowledges the analogy is contested or influences actors.
          *   Fail: Student treats the analogy as an objective, neutral fact ignored by others.

      *Stopping Rule:* If any test is Failed, the analogy is rhetorically weak. If all Passed, the analogy is structurally sound (but not necessarily true). The TA assigns a "Structural Score." The Instructor handles the "Truth Score."

  5.  **Applying to the Three Papers:**

      *   **Paper 1: Trade Concession = Munich.**
          *   Likely fails Inventory (Trade != Invasion).
          *   Likely fails Falsifiability (Assumes concession = defeat).
          *   *Verdict:* Fail.
      *   **Paper 2: Limited Intervention = Vietnam (Avoid Quagmire).**
          *   *Constraint:* Instructor uses this argument.
          *   Inventory: Might pass (limited goals, domestic support, etc.).
          *   Falsifiability: "If we commit ground troops, it becomes Vietnam." (Pass).
          *   Invariance: "Even if the terrain is different, the political dynamic holds." (Pass).
          *   *Constraint Check:* If the procedure fails this, I must say so.
          *   *Analysis:* The "Vietnam" analogy is notoriously slippery. Often used to stop *any* action. If the student argues "Limited intervention is okay *because* we learned from Vietnam to keep it limited," that's actually a sophisticated use (learning the lesson to avoid the trap).
          *   *Wait, the prompt says:* "arguing that a limited military intervention is justified because Vietnam taught us to avoid quagmires."
          *   This is a "Negative Analogy." We are doing X *to avoid* Y (which happened in Vietnam).
          *   Does the procedure handle negative analogies? I need to ensure the tests allow for "Learning from" rather than "Repeating."
          *   *Adjustment:* Test 2 (Falsifiability) needs to account for "We are avoiding the features that caused failure."
          *   *Self-Correction:* If the procedure is too rigid, it might flag the Instructor's own argument. I need to be honest. If the argument relies on "Vietnam = Quagmire" as a monolith, it might fail the Invariance test. I will be honest: The procedure might flag it as "Deterministic" if the student doesn't specify *which* features of Vietnam caused the quagmire.
      *   **Paper 3: Thucydides Trap = War is Structural/Policy Doesn't Matter.**
          *   Fails Falsifiability immediately (Policy cannot matter).
          *   Fails Invariance (If policy doesn't matter, no features matter).
          *   *Verdict:* Fail.

  6.  **Addressing the Limitations (What the procedure cannot tell me):**
      *   Historical accuracy (TAs don't know history).
      *   Moral weight (Is the analogy appropriate ethically?).
      *   Creativity/Style.
      *   False Positives: A well-structured lie passes.
      *   False Negatives: A brilliant intuitive leap that lacks explicit premises fails.

  7.  **Refining the Output:**
      *   Tone: Professional, academic, pragmatic.
      *   Structure: Procedure first, then Application, then Limitations.
      *   *Crucial:* Ensure the "Invariance Test" is clearly defined as requested.
      *   *Crucial:* Ensure the "Instructor's Vietnam Argument" is treated honestly.

      *Re-evaluating the Vietnam Paper Application:*
      The prompt says: "The Vietnam argument is one I make myself in lecture; if the procedure fails it, say so plainly."
      If the student argues "Vietnam taught us to avoid quagmires," they are using the analogy normatively.
      Test 1 (Inventory): Do they list *what* made Vietnam a quagmire? (Open-ended commitment, unclear objectives). If they just say "Vietnam," they fail.
      Test 2 (Falsifiability): Do they admit a scenario where intervention *would* be a quagmire?
      Test 3 (Invariance): If the technology is different, does the lesson hold?
      *Honest Assessment:* Most first-year papers using this argument *will* fail the Inventory test because they treat "Vietnam" as a synonym for "Quagmire" without listing the causal features (e.g., lack of clear exit strategy). If the Instructor's lecture argument relies on the *name* doing the work, the procedure *should* fail it. I will state that if the lecture argument relies on the label "Vietnam" without specifying the structural features (escalation, domestic will, etc.), the procedure will flag it. This is a feature, not a bug.

  8.  **Final Polish of the Procedure:**
      *   Make it a checklist.
      *   Define "Pass" and "Fail" clearly.
      *   Define the "Hand-off" point (where TA stops and Professor starts).

      *(Self-Correction during drafting)*: I need to make sure the "Invariance Test" is operationalizable for a non-expert.
      *Instruction:* "Locate the causal claim. Ask: If I change a detail the student did not mention (e.g., the country's name, the weapon type), does the causal claim still make sense to you?"
      *Pass:* Student explicitly states the mechanism is independent of those details.
      *Fail:* Student implies the outcome depends on the specific historical parallel holding perfectly.

      *Refining the "Actors Invoking" case:* This is the "Self-Fulfilling Prophecy" test.
      *Test:* Does the student acknowledge that leaders might be acting *because* of the analogy?
      *Pass:* "Leaders cite Munich, which drives their hesitation."
      *Fail:* "This is Munich" (treated as objective reality).

      *Refining the "Both Sides" case:*
      *Test:* Contestation.
      *Pass:* "While some cite Munich, others cite..."
      *Fail:* "This is clearly Munich."

      *Let's consolidate into 4 Key Tests.*
      1.  **Specificity (The Inventory).**
      2.  **Falsifiability (The Escape Clause).**
      3.  **Invariance (The Mechanism).**
      4.  **Reflexivity (The Mirror).**

      *Wait, one more thing:* The prompt asks for "where the procedure stops and hands the remainder to judgment."
      *Decision:* The procedure determines *Argumentative Validity*. It does not determine *Historical Truth*. The TA marks the structure. The Professor reviews the content if the structure passes.

      *Final check on the Vietnam constraint:* If the procedure flags the instructor's argument, I must explain *why* (likely lack of specificity) and affirm that this is correct for a first-year course (they should learn to specify features). I won't hedge too much. If the argument relies on the *label*, it's a weak argument pedagogically, even if the instructor believes it. I will frame it as: "If your lecture argument relies on the label 'Vietnam' functioning as a shorthand for specific structural features without enumerating them, this procedure will flag it. This is intended."

      *Wait, looking closer at the prompt:* "The Vietnam argument is one I make myself in lecture; if the procedure fails it, say so plainly."
      Okay, I will apply the test rigorously. If the student paper mirrors a typical first-year simplification of that argument, it will likely fail Test 1 (Specificity). I will note that.

      *Let's write it.*
answer: |-
  # The Analogy Audit Protocol (AAP)

  **Purpose:** To standardize the evaluation of historical analogies in first-year policy papers.
  **User:** Teaching Assistants (no subject-matter expertise required).
  **Time Budget:** 10 minutes per paper.
  **Scope:** Evaluates the *structural integrity* of the analogy, not the historical accuracy.

  ---

  ## Part I: The Decision Procedure

  Run the following four tests in order. If a paper **Fails** any test, mark the analogy as "Argumentatively Deficient." If it **Passes** all four, mark it as "Structurally Sound."

  ### Test 1: The Inventory (Specificity)
  **Question:** Does the student treat the historical name as a label or as a set of features?
  *   **Procedure:** Highlight every instance of the historical name (e.g., "Munich," "Vietnam"). Count the number of *specific structural features* (e.g., "territorial annexation," "loss of domestic will," "alliance entrapment") explicitly listed as shared between the past case and the present case.
  *   **Pass:** The student lists **three or more** specific structural features shared by both cases.
  *   **Fail:** The student relies on the name alone, or lists fewer than three features (e.g., "Both involve aggression").
  *   **Rationale:** Prevents "name-dropping." Any two events match under a vague enough description; specific features force argumentative work.

  ### Test 2: The Escape Clause (Falsifiability)
  **Question:** Is the lesson stated so that no outcome could disconfirm it?
  *   **Procedure:** Locate the conclusion derived from the analogy. Ask: "What would have to happen in the current case for the student to admit the analogy does *not* apply?"
  *   **Pass:** The student identifies a condition under which the historical lesson would not hold (e.g., "Unless the adversary signals a willingness to negotiate, this is Munich").
  *   **Fail:** The analogy is presented as a law of nature or inevitability (e.g., "Appeasement always leads to war," "War is structural").
  *   **Rationale:** Prevents deterministic arguments where the analogy functions as a prophecy rather than a warning.

  ### Test 3: The Invariance Test (Robustness)
  **Question:** Does the outcome survive changes in the features the analogy does not mention?
  *   **Procedure:** Identify the *causal mechanism* the student claims links the features to the outcome. Imagine changing a superficial detail not mentioned in the paper (e.g., the geography, the technology, the specific leaders).
  *   **Pass:** The student explicitly argues that the mechanism holds *regardless* of these unmentioned details (e.g., "Even with nuclear weapons, the dynamic of alliance entrapment remains").
  *   **Fail:** The argument implies the outcome depends on the historical cases matching perfectly in all respects, or the student cannot isolate the mechanism from the background noise.
  *   **Rationale:** Addresses the level-of-abstraction problem. Ensures the student knows *why* the analogy works, not just *that* it works.

  ### Test 4: The Mirror (Reflexivity & Contestation)
  **Question:** Does the student acknowledge that the analogy is contested or influential?
  *   **Procedure:** Scan for acknowledgment of alternative analogies or the actors' own use of history.
  *   **Pass:** The student acknowledges either (a) that opposing sides use different analogies (e.g., "While hawks cite Munich, doves cite Vietnam"), OR (b) that the actors themselves are invoking the analogy to justify their actions (e.g., "The Prime Minister cited Munich to justify rearmament").
  *   **Fail:** The student treats the analogy as a neutral, objective observation discovered only by them, ignoring that historical parallels are often weapons in the policy debate itself.
  *   **Rationale:** Handles cases where the analogy is part of the causal story (self-fulfilling) or where the "lesson" is politically contested.

  ---

  ## Part II: The Hand-Off Point

  **Where the TA Stops:**
  Once the four tests are complete, the TA assigns a **Structural Score**.
  *   **0-1 Passes:** Fail the assignment (Argumentatively Deficient).
  *   **2-3 Passes:** Conditional Pass (Requires Instructor Review).
  *   **4 Passes:** Structurally Sound (Accept).

  **Where the Instructor Begins:**
  The AAP does not verify historical truth. A paper can pass all four tests and still be historically wrong (a well-structured lie).
  *   **TA Duty:** Flag papers that are "Structurally Sound" but rely on historical claims that seem obviously erroneous (e.g., getting dates or basic outcomes wrong) for Instructor review.
  *   **Instructor Duty:** Verify the historical accuracy of the "Structurally Sound" papers and adjudicate the "Conditional Pass" pile.

  ---

  ## Part III: Application to Sample Papers

  Here is the AAP applied to the three papers currently on your desk.

  ### Paper 1: The Trade Concession (Munich)
  *   **Argument:** Conceding on tariffs to a rising power is appeasement; therefore, it will lead to war (Munich).
  *   **Test 1 (Inventory):** **Fail.** The paper uses the word "Munich" and "appeasement" repeatedly but lists no structural features shared between 1938 Germany and the current trade partner (e.g., territorial ambition, military buildup). It equates "trade concession" with "territorial cession" without justification.
  *   **Test 2 (Escape Clause):** **Fail.** Argues that "any concession invites aggression." No condition is given where a concession would *not* lead to war.
  *   **Test 3 (Invariance):** **Fail.** Does not address how economic interdependence (unmentioned) might alter the 1938 causal mechanism.
  *   **Test 4 (Mirror):** **Fail.** Treats "Munich" as an objective fact, not a rhetorical tool used by hawks.
  *   **Verdict:** **Argumentatively Deficient.** The analogy is doing no work; it is merely lending an air of inevitability to a protectionist conclusion.

  ### Paper 2: The Limited Intervention (Vietnam)
  *   **Argument:** We should intervene, but keep it limited, because Vietnam taught us to avoid quagmires.
  *   **Test 1 (Inventory):** **Fail/Pass (Borderline).** The paper states "We must avoid open-ended commitment." This is one feature. It does not list two others (e.g., "lack of clear exit strategy," "misalignment of local/national interests"). It relies on "Quagmire" as a label.
  *   **Test 2 (Escape Clause):** **Pass.** It argues intervention is safe *provided* we set clear limits. This implies if we lose limits, the lesson applies.
  *   **Test 3 (Invariance):** **Fail.** It assumes the "Quagmire" mechanism is identical regardless of the specific political context of the new intervention. It does not explain *why* Vietnam became a quagmire other than "we stayed too long."
  *   **Test 4 (Mirror):** **Pass.** Acknowledges that "Vietnam" is the standard counter-argument used by opponents.
  *   **Verdict:** **Conditional Pass (Requires Instructor Review).**
  *   **Instructor Note:** You asked me to be plain: **This procedure flags your own lecture argument.** If your lecture argument relies on "Vietnam" functioning as a shorthand for "Quagmire" without enumerating the specific structural features that *caused* the quagmire (e.g., the nature of the insurgency, domestic political timelines), the AAP correctly identifies it as under-specified for a first-year reasoning course. The procedure demands students explicate the mechanism you may be assuming they know. If you wish this argument to pass, you must model the Inventory Test in your lecture by listing the three features explicitly.

  ### Paper 3: The Thucydides Trap (Structural War)
  *   **Argument:** A rising power and a ruling power are locked in a Thucydides Trap; war is structural; policy cannot matter.
  *   **Test 1 (Inventory):** **Pass.** Likely lists "rising power," "ruling power," and "fear."
  *   **Test 2 (Escape Clause):** **Fail.** The argument is that "policy therefore cannot matter." This is the definition of unfalsifiable inevitability. There is no escape clause.
  *   **Test 3 (Invariance):** **Fail.** If policy cannot matter, then no features (nuclear weapons, economics, diplomacy) can change the outcome. The invariance test is rendered moot by the determinism.
  *   **Test 4 (Mirror):** **Fail.** Treats the "Trap" as a physical law rather than a historiographical theory contested by other scholars.
  *   **Verdict:** **Argumentatively Deficient.** The analogy is used to abdicate reasoning entirely.

  ---

  ## Part IV: Limitations of the Procedure

  The AAP is a filter, not a truth machine. You must inform your TAs of the following blind spots:

  **1. The False Positive (The Well-Structured Lie)**
  A student can pass all four tests with a completely fabricated historical narrative. If a student lists three specific features, admits an escape clause, isolates a mechanism, and acknowledges contestation, they pass the AAP—even if their history is nonsense.
  *   *Mitigation:* TAs must flag "Structurally Sound" papers where the historical facts seem obviously wrong for your personal review.

  **2. The False Negative (The Intuitive Leap)**
  A student may have a profound insight but lack the vocabulary to list "three structural features" in the first paragraph. They may write evocatively rather than analytically. The AAP will mark them down.
  *   *Mitigation:* This is acceptable for a *practical reasoning* course. You are grading reasoning, not intuition.

  **3. The "Your Lecture" Problem**
  As seen in Paper 2, the AAP penalizes arguments that rely on shared cultural shorthand (e.g., "Vietnam = Quagmire").
  *   *Mitigation:* This is a feature, not a bug. In a reasoning course, "common knowledge" is not a premise. However, be aware that if you use these analogies in lecture without satisfying Test 1 yourself, you are modeling the behavior the AAP penalizes.

  **4. The Normative Blind Spot**
  The AAP tests if the analogy *works*, not if it *should* be used. A student could argue "This is Rwanda 1994, therefore we must bomb," passing all structural tests. The AAP does not evaluate the morality of the intervention, only the integrity of the historical comparison.
  *   *Mitigation:* This remains in your domain for the "Hand-Off."

  **5. The Abstraction Ceiling**
  The AAP forces students to lower their level of abstraction (Test 1). However, some policy problems *are* structural (like Paper 3). The AAP rejects structural determinism (Test 2).
  *   *Mitigation:* The course goal is practical reasoning, which assumes agency. If a student argues agency is impossible, they have opted out of the course's premise. The AAP correctly fails them.
