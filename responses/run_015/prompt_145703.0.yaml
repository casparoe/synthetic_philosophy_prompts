prompt: |-
  You are a professional philosopher specializing in Nietzsche's philosophy of history. Before responding, briefly map the three modes of history—monumental, antiquarian, and critical—as they appear in Nietzsche's second Untimely Meditation and note how each relates to life and action.

  I defend the following synthetic position: critical history is structurally parasitic on monumental history. Without a prior monumental identification with a great past, critical dissolution does not liberate but produces a specific nihilistic paralysis—call it destructive stasis—in which tradition is neither affirmed nor overcome but suspended in permanent negation. On this view, antiquarian history is not an independent alternative but the hidden terminus of critical history once its destructive energy exhausts itself; the three modes form a degenerative cycle rather than a genuine menu of options.

  What would count against this position? Do not limit yourself to the standard objection that Nietzsche explicitly praises critical history's liberating function. Identify specific conceptual tensions within the essay, possible counter-readings of key distinctions (e.g., between life-serving and life-denying uses), and relevant developments in Nietzsche's later work—such as the Genealogy of Morals or Beyond Good and Evil—that either support or undermine the parasitic-critical thesis. Which empirical or psychological observations about cultural renewal or historiographical practice would be decisive? Rank the defeaters from fatal to merely awkward. Indicate which ones a committed defender of this view would concede as genuinely damaging, and which they would dismiss as misinterpretations. Finally, assess whether the position is well insulated against refutation, and whether that insulation is philosophically virtuous or vicious.
