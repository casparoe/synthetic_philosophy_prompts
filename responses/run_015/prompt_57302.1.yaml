answer: |-
  ### The Self-Deception Sorting Battery

  **Instructions:** Read each vignette carefully. For each case, select the classification that best fits the agent's mental state. There are no right or wrong answers; your pattern of choices reveals your underlying theoretical commitments.

  **Options:**
  *   **A:** Self-Deceived
  *   **B:** Merely Mistaken
  *   **C:** Neither (Rational/Justified)

  ***

  **1. The Standing Trait**
  Elias assumes every compliment is sincere and every critique is envy. He has functioned this way for decades, never questioning his own merit. When confronted with clear proof of a mistake, he reinterprets the proof as a test of his resilience.
  [ ] A [ ] B [ ] C

  **2. The Twisted Belief**
  Mara fears her son has developed a rare condition. Though doctors find nothing wrong, she becomes convinced the diagnosis was missed. She feels no comfort in this belief, only dread, yet she rejects all reassurance.
  [ ] A [ ] B [ ] C

  **3. Evidence Steering**
  Julian suspects his business partner is cheating him. He deliberately avoids opening the financial emails that would confirm it. He tells himself he trusts his partner, and as long as he doesn't look, he feels certain of that trust.
  [ ] A [ ] B [ ] C

  **4. Behavioral Contradiction**
  After her husband dies, Clara speaks of him in the past tense but buys his favorite coffee every morning. When asked, she says he is gone, yet she acts as if he will return. She does not seem to notice the mismatch.
  [ ] A [ ] B [ ] C

  **5. Anxious Bias**
  Sam wants to keep his job. He reads a performance review that is mixed. He focuses entirely on the positive comments and forgets the negative ones by the end of the day. He genuinely believes he is a top performer.
  [ ] A [ ] B [ ] C

  **6. Strategic Cultivation**
  To get through the day, Lila repeats a mantra she knows is false. She focuses on the words until she feels a surge of confidence. She does not check if the confidence matches reality, only that it helps her function.
  [ ] A [ ] B [ ] C

  **7. Motivated Rationalization**
  David smokes heavily. He reads a study linking smoking to disease. He decides the study is flawed because he knows a centenarian who smoked. He concludes he is safe.
  [ ] A [ ] B [ ] C

  **8. Acknowledged Partition**
  Nina says she is happy in her marriage. In therapy, she admits she knows it is over, but she cannot bring herself to leave. She lives in the house, smiling, while internally acknowledging the end.
  [ ] A [ ] B [ ] C

  ***

  ### Scoring Key & Theoretical Mapping

  Tally your selections. Your theoretical position is indicated by *which* vignettes you labeled **A (Self-Deceived)**.

  **1. The Paradox-Denier (Motivated Error)**
  *   **Pattern:** You selected **B (Merely Mistaken)** for the majority of cases, particularly 5, 7, and 1.
  *   **Position:** You hold that "self-deception" is not a distinct psychological category. What others call deception is simply ordinary error driven by motivation. You deny that an agent can genuinely deceive themselves any more than they can lift themselves by their bootstraps.

  **2. The Contradiction Theorist (Static/Partitioned)**
  *   **Pattern:** You selected **A (Self-Deceived)** primarily for **4 and 8**, but likely **B** for 3 and 5.
  *   **Position:** You require the simultaneous holding of contradictory beliefs ($p$ and $\neg p$). For you, self-deception is a static state of conflict, often requiring a partitioned mind to explain how the agent avoids noticing the clash. If no contradiction exists (as in evidence steering), it is not yet deception.

  **3. The Non-Intentionalist (Mele-Style)**
  *   **Pattern:** You selected **A (Self-Deceived)** for **2, 5, and 7**, but likely **B** for 3 and 6.
  *   **Position:** You view self-deception as a byproduct of biased belief formation driven by anxiety or desire. It need not be strategic, nor must it involve simultaneous contradiction. However, if the agent is actively managing their input (3 & 6) without a resulting biased belief *yet*, you may view that as mere avoidance rather than deception proper.

  **4. The Intentionalist (Strategic)**
  *   **Pattern:** You selected **A (Self-Deceived)** for **3 and 6**, regardless of whether contradiction is present.
  *   **Position:** You believe self-deception requires a project or goal. The agent must treat their own mind as an object to be manipulated. Whether they succeed in believing the falsehood is secondary to the strategic effort to bring that belief about.

  ***

  ### Theoretical Limitations & Undefended Positions

  **Positions This Battery Cannot Separate:**
  This quiz struggles to genuinely distinguish between the **Non-Intentionalist (Mele-Style)** and the **Paradox-Denier (Motivated Error)**. Both camps agree on the cognitive mechanism: motivation biases evidence gathering and interpretation. The difference is often purely terminological—whether one wishes to apply the normative label "deception" to a process that lacks a deceiver. A respondent who sees the mechanism as identical but disagrees on the label will produce identical answer patterns here.

  **An Undefended Combination:**
  A combination of answers that classifies a case as **B (Merely Mistaken)** while simultaneously insisting the agent holds **contradictory beliefs** (as in Vignette 4 or 8) is **incoherent**. If an agent truly holds $p$ and $\neg p$ simultaneously, they cannot be "merely mistaken" in the standard sense, as mistake implies a single false belief rather than a conflicted state. No serious theory claims an agent is in a state of contradiction yet classifies that state as simple error.
