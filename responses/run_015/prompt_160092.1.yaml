answer: |-
  Dana: Let's start with the scoring rule. You want squared error, the Brier score, because it's bounded. I want the log rule, reporting in bits. But the engineer found that flooring the log score at −3 breaks strict propriety.

  Milo: Right. Strict propriety means you maximize your expected score only by reporting your true belief. If we cap the downside, you game it. You report 0.000001 instead of 0.01 because the penalty for being wrong is capped, but the reward for being right stays huge.

  Dana: Exactly. So we can't clip the log score. But that leaves volatility. One freak event tanks a user.

  Milo: That's why Brier is safer. It's naturally bounded between 0 and 1. No clipping needed, so propriety holds. But I'll concede your point on tail risks. If leadership cares about the difference between a 0.001 and 0.000001 chance of database failure, Brier blinds us. The penalty difference is negligible. Log preserves that distinction.

  Dana: And for accuracy-first epistemology, preserving information is paramount. If the truth is in the tails, the score must reflect it. So Log, unclipped. We accept the variance.

  Milo: Agreed, provided we warn users. Now, framing. You want a canonical fine partition—forcing everyone to split "migration finishes" into "by Wednesday," "by Thursday," "by Friday." I want free granularity. The engineer showed both rules penalize splitting outcomes. Under Log, splitting costs entropy; under Brier, it costs squared probability mass.

  Dana: If we let people choose, the leaderboard measures framing choices, not accuracy. Someone who answers coarse questions gets penalized less than someone who answers fine ones, even if both are calibrated. Calibration means your stated probabilities match how often you're actually right.

  Milo: Forcing a canonical partition creates friction. Forty people won't do it consistently. What if we let them choose freely but normalize against a house baseline? We score them on how much better they are than a default forecast on the same framing.

  Dana: That removes the mechanical penalty for granularity. It isolates the skill. I can accept free-with-baseline-normalization. It costs less forecaster time than forcing a canonical-fine structure.

  Milo: Good. Now aggregation. You want pooling by averaging log-odds with extremization. I want arithmetic mean of probabilities.

  Dana: If evidence is conditionally independent, averaging log-odds is Bayes-correct. A plain average of probabilities is systematically underconfident. We should extremize toward 0 or 1.

  Milo: Catch that assumption. This is internal ops. Forty people, same dashboards, same standups. Their evidence overlaps heavily. If evidence overlaps, averaging log-odds double-counts the signal. You extremize too far. The engineer noted that with heavy overlap, the average should shrink toward 0.5, not extremize.

  Dana: ...You're right. Accuracy-first demands we match the evidence structure. If correlation is high, log-odds pooling overfits the group signal. With only ~15 people per question and noisy resolution, we can't afford to trust independence.

  Milo: So arithmetic mean. It's robust to correlation. We might lose some signal strength, but we avoid false confidence.

  Dana: Conceded. Pooling via arithmetic mean. Finally, richness. The engineer noted coherence arguments only work if we score a rich set of propositions—closed under Boolean operations. If we only score yes/no, someone can be incoherent without penalty.

  Milo: Should we score derived questions? If someone says P(A)=0.7 and P(B)=0.7, should we score them on the implied P(A or B)?

  Dana: No. That rewards coherence the platform supplied, not the forecaster. It creates false precision. We should force the canonical fine partition only where necessary for resolution, but score only what they actually answered.

  Milo: Agreed. We check coherence for feedback, not for the leaderboard. So, to summarize: Log score for tail sensitivity, arithmetic pooling for correlated evidence, and free framing with baseline normalization to reduce friction.

  Dana: It balances accuracy with the reality of our operations.

  \answer{score=log; pool=arithmetic; framing=free-with-baseline-normalization}
