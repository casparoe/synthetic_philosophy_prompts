prompt: |-
  I've somehow ended up with the training slot for our new pricing analysts — small specialty insurer, we underwrite gig-economy couriers (e-bikes, mopeds, the occasional car), room of about fifteen, most of them have had exactly one applied stats class and they all talk as if a probability is a property of a single case, the way a weight is. I've got 75 minutes and I want to spend it on the reference class problem. Don't explain the problem to me, I've done enough reading on it; I want the plan for the explanation.

  The order is what I keep going back and forth on. My instinct is to open by making them each commit to a number for one named applicant — what's the chance this person has an at-fault claim in the next year — write the numbers on the board, and only then show that the number moves when nothing about the applicant changes and no new evidence arrives, only the description of her. Is that the right entry point, or does something have to be in place before that even stings? And where in the sequence do the three things the problem can mean get separated: which class's frequency *is* the probability, which class's frequency should inform the number we act on, and the it-just-depends-what-question-you're-asking move that dissolves the whole thing? I'm fairly sure that last one has to be earned rather than granted, and I don't know whether it belongs at the end or whether it should be floated early and then made to fail.

  The carrying example is where I'm stuck. My candidate: one applicant, 24, delivers by e-bike in a dense city, 30 hours a week, one prior at-fault collision, top-decile on our telematics safety score. Classes I can put her in — 24-year-old riders, urban e-bike couriers, riders with a prior claim, top-decile telematics scorers — all non-gerrymandered, all with rates I can quote, differing by a factor of several, and none of them is a subset of another. Does that work? It might not: every one of those classes is a feature sitting in our database, so I'm terrified someone will just say condition on all of it, fit a model, done — and the session deflates into a complaint about regression. So: what does the example have to have, and what does it have to lack, so that move isn't available? Should the classes be nested or cross-cutting, should the rates differ wildly or only a little, and should there be a decision with money attached to it or does that muddy things?

  Misconceptions — I'm guessing: that there's a true reference class out there and we're just short of data; that this is base-rate neglect again (it's almost the inverse, isn't it?); that it's Simpson's paradox in a hat; that more data fixes it; that the fix is use the narrowest class you can describe; and that if the number is reference-class-relative then anything goes. Tell me which of those I've got wrong, where in the sequence each one has to be headed off, and which ones are specific to an audience that prices things for a living and will want a rate at the end.

  Two wrenches I want placed. One: the narrowest class you can describe eventually contains just her, and the frequency there is 0 or 1 — where does that go, and is it the natural bridge to why you can't always condition on everything? Two: we have a real bad habit here of re-slicing a book with segments like couriers who claimed in their first 60 days, which is picking the class after you've seen the outcome. I want that in, but I can't tell if it's the same lesson or a different one wearing the same clothes.

  Also: if I make one of the classes her age or her gender it turns into a compliance argument about what we're allowed to use. Do I keep that out of the carrying example and bring it in at the end, or is that version the one they actually need? And give me the order I should reveal the numbers in — do I show all the class rates up front or make them commit first?

  At the end I need one thing to have them *do* that separates getting it from having learned the phrase it depends on the reference class. And tell me what I should explicitly refuse to cover in 75 minutes and say out loud that I'm refusing it.
reasoning: |-
  Here's a thinking process that leads to the suggested training plan:

  1.  **Analyze the User and Context:**
      *   **User:** Trainer for new pricing analysts at a specialty insurer (gig-economy couriers).
      *   **Audience:** 15 analysts, mostly one applied stats class. They hold a "single-case propensity" view of probability (probability is a property of the individual, like weight).
      *   **Topic:** The Reference Class Problem.
      *   **Constraint:** 75 minutes.
      *   **Goal:** A specific lesson plan (order, examples, misconceptions, activities, boundaries).
      *   **Tone:** Professional, direct, pedagogical, aware of insurance specifics (underwriting, telematics, compliance).
      *   **Key Concerns:** Order of operations, the "carrying example" (avoiding "just run a regression"), handling misconceptions, specific "wrenches" (narrowest class = 1, data snooping), compliance/regulatory issues, and a concrete takeaway activity.

  2.  **Deconstruct the Challenge:**
      *   *The Core Tension:* Analysts think probability is intrinsic to the risk. The Reference Class Problem shows probability is relative to the grouping.
      *   *The Trap:* If the example is too rich (many features), they will say "GLM/XGBoost solves this." The example *must* force a choice between mutually exclusive or cross-cutting classes where conditioning on everything isn't an option (either due to data sparsity, model instability, or the philosophical point that the "true" model is still a choice of classes).
      *   *The Audience:* They want a *rate*. They need to leave knowing how to pick a rate, not just that it's hard.
      *   *The Misconceptions:* Need to address "True Class," "Narrowest Class," and "Anything Goes."

  3.  **Drafting the Plan - Section by Section:**

      *   **Opening (The Hook):** The user's instinct is correct. Commit to a number first. It creates cognitive dissonance.
          *   *Action:* Show the profile. Ask for P(Claim). Write them on the board.
          *   *Twist:* Reveal the class frequencies *after* they commit.
          *   *Why:* If you show frequencies first, they just average them. If they commit first, they realize their intuition was based on an implicit, unexamined class.

      *   **The Carrying Example:**
          *   *Problem:* If I give them 5 features, they say "run a logistic regression."
          *   *Solution:* The classes must be *cross-cutting* and *sparse* or *conceptually distinct* such that a standard model hides the choice. Or, simpler: Present it as a manual underwriting decision where the model hasn't been built yet.
          *   *Better Solution:* Use classes that are *incompatible* or where the intersection is empty/too small.
          *   *Refinement:* Let's stick to the user's features but limit the data availability. "We have these four reports. They disagree. You have to price *now*."
          *   *Crucial Detail:* The rates must differ significantly. If they are all 5%, no problem. If they are 2%, 15%, 5%, 8%, there's tension.
          *   *Structure:* Cross-cutting is better than nested. Nested implies "go narrower." Cross-cutting forces a *choice*.

      *   **Sequence of Concepts (The "Three Things"):**
          1.  *Descriptive:* Frequency varies by class (The "Is").
          2.  *Normative:* Which class *should* we use? (The "Ought").
          3.  *Dissolution:* It depends on the decision context (The "It Depends").
          *   *Placement:* 1 & 2 happen in the first 45 mins. 3 is the resolution in the last 30. Don't float 3 early; it lets them off the hook.

      *   **Misconceptions:**
          *   *True Class:* Address early. There isn't one.
          *   *Narrowest Class:* Address via the "Wrench 1" (Single Case).
          *   *Base Rate Neglect:* It's the opposite (Base Rate *Confusion*).
          *   *Anything Goes:* Address at the end with the "Decision Context."
          *   *Regression Fix:* Address immediately by restricting the example.

      *   **The Wrenches:**
          *   *Wrench 1 (Narrowest = 1):* This is the *reductio ad absurdum*. Put this right after they argue for "more specific." It kills the "narrowest is best" heuristic.
          *   *Wrench 2 (Data Snooping/Post-hoc):* This is distinct. It's about *validity* vs. *selection*. Put this near the end as a "how we break things" warning. It's a specific instance of choosing the wrong class (the one that fits the noise).

      *   **Compliance/Protected Classes:**
          *   *Decision:* Keep it out of the main example. It distracts from the *statistical* problem with a *legal* constraint. Bring it in at the end as a "boundary condition" on the "Which class should we use?" question. It's a valid reason to reject a reference class, but not the statistical reason the problem exists.

      *   **The Activity (Do vs. Know):**
          *   They need to justify a choice, not just calculate.
          *   *Task:* Give them two conflicting classes and a business goal (e.g., "Grow market share" vs. "Ensure solvency"). Ask them to pick a class and justify it based on the *goal*, not just the math.

      *   **What to Refuse:**
          *   GLM/ML mechanics.
          *   Bayesian priors (too technical).
          *   Causal inference (too deep).
          *   Regulatory law details.

  4.  **Refining the Flow (Timing):**
      *   0-15: The Commitment & The Reveal (The Sting).
      *   15-30: The "Why" (Frequency vs. Propensity) & Wrench 1 (The Singleton).
      *   30-45: The "Which One" (Normative) & Business Context.
      *   45-60: The Activity (Application).
      *   60-75: Wrench 2 (Snooping), Compliance, Wrap-up.

  5.  **Critique and Polish:**
      *   *User's Instinct:* "Open by making them commit." -> **Keep.** It's the only way to break the "probability is weight" mental model.
      *   *Example:* "Condition on all of it." -> **Counter:** Make the intersection sample size zero or unknown. Or frame it as "We have three legacy systems, each gives a rate, they don't talk to each other." Let's go with "Legacy Systems/Reports" to make it feel like a real insurer problem.
      *   *Order of Numbers:* Commit -> Reveal Disagreement.
      *   *Wrench 1:* Place it as the limit of "narrower is better."
      *   *Wrench 2:* Place it as a warning on *how* we choose classes (ex-post vs. ex-ante).
      *   *Compliance:* Keep separate. Don't conflate "can't" with "don't know how."

  6.  **Finalizing the Output Structure:**
      *   Follow the user's requested structure (Order, Example, Misconceptions, Wrenches, Compliance, Activity, Refusals).
      *   Maintain the sharp, professional tone.
      *   Ensure the "Single Case Propensity" myth is the primary antagonist.

  7.  *(Self-Correction during drafting)*: Wait, if I tell them to "condition on everything," and I say "you can't because data is sparse," they might think "Big Data fixes this." I need to emphasize that even with infinite data, the *prediction target* defines the class. Actually, for a 75-minute session with junior analysts, the "sparse data" argument is more pragmatic. The philosophical "infinite data still has classes" might be too abstract. I'll stick to the pragmatic "intersection is empty/unstable" for the example, but hint at the philosophical limit for the singleton wrench.

      *Revised Plan for Example:* Use the "Legacy Systems" angle. System A looks at Age. System B looks at Vehicle. System C looks at History. They don't integrate. You are the underwriter. Which system do you trust? This prevents "just run a GLM" because the data isn't integrated yet.

      *Wait, better:* The user said "small specialty insurer." They might actually be using simple rules. Let's make it about *manual pricing* vs. *model pricing*. No, let's keep it simple. The classes are *available* but *contradictory*. The "Regression" objection is valid, so acknowledge it: "A model is just a weighted average of reference classes. It doesn't solve the problem; it hides the choice." That's a killer line.

  8.  **Final Polish:** Check timing. 75 mins is tight. Ensure the activity is short. Make sure the "Refusals" are explicit.

      *(Final check on the "Three Things"):*
      1. Frequency varies (Fact).
      2. Which frequency to use (Decision).
      3. Depends on the question (Resolution).
      Yes, this flow works.

      *(Final check on Wrench 2):* Is post-hoc slicing the same lesson? It's about *validity* of the class, not just *selection*. It fits under "Which class should we use?" but needs to be distinguished from "Which class is statistically accurate?" It's "Which class is *honest*?"

      Okay, ready to write.
answer: |-
  Here is the plan. It is designed to break the "probability as physical property" mental model first, then rebuild a decision-based framework.

  ### 1. The Order of Operations
  Your instinct is correct. **Open with the commitment.** If you explain the theory first, they will listen through the filter of their existing misconception (that probability is a weight). You need to create the cognitive dissonance *before* you give them the vocabulary to resolve it.

  **Sequence:**
  1.  **The Commitment (0–15 min):** Profile reveal. Private vote on P(Claim). Public display of variance.
  2.  **The Reveal (15–30 min):** Show the class frequencies. Show they contradict. Introduce Wrench 1 (The Singleton) here to kill the "narrower is better" heuristic.
  3.  **The Pivot (30–45 min):** Shift from "What *is* the probability?" to "What *decision* are we making?" This is where you separate the three meanings (Descriptive, Normative, Contextual).
  4.  **The Activity (45–60 min):** Applied choice based on business objective, not just math.
  5.  **The Warning (60–75 min):** Wrench 2 (Data Snooping) and Compliance boundaries. Refusals and wrap-up.

  **Do not float the "it depends" move early.** If you tell them upfront that there is no single answer, they will treat the exercise as a guessing game of "what does the instructor want?" rather than feeling the genuine tension of the conflict. They must believe there *should* be a single answer, fail to find it, and then be relieved to learn there isn't one.

  ### 2. The Carrying Example
  Your candidate profile is good, but you are right to fear the "just run a regression" deflation. To prevent this, the example must lack the *joint* distribution, not just the marginal.

  **The Setup:**
  "We have three legacy data marts that don't talk to each other yet. We need to price this risk *today*."
  *   **Report A (Demographics):** 24-year-old urban riders. Claim rate: **18%**.
  *   **Report B (Vehicle/Telematics):** Top-decile safety score e-bikes. Claim rate: **4%**.
  *   **Report C (History):** Riders with 1 prior at-fault. Claim rate: **22%**.

  **Why this works:**
  1.  **Cross-cutting, not nested:** This prevents the "go narrower" heuristic. You cannot easily be in the intersection of all three without a unified model (which you are pretending they don't have for the sake of the lesson).
  2.  **Wild variance:** 4% vs 22% forces a choice. If the rates were 10%, 12%, 11%, they would average them and miss the point.
  3.  **The "Regression" Counter:** When someone says "fit a model," your response is: *"A GLM is just a machine for averaging reference classes with weights. It doesn't solve the reference class problem; it automates the choice of which classes to include and how to penalize their interactions. If the classes contradict this violently, the model is unstable. We are discussing the *inputs* to the model, not the calculator."*

  **Reveal Order:**
  1.  Show Profile.
  2.  **Commit:** "Write down the % chance of a claim." (Collect them).
  3.  **Reveal:** Show the three reports one by one.
  4.  **Sting:** Ask the people who wrote 5% to raise hands. Ask the people who wrote 20% to raise hands. Point out that *nothing about the applicant changed*, only the information you chose to prioritize.

  ### 3. Misconceptions: Mapping and Timing
  You identified the right list. Here is where to kill them:

  *   **"There is a true reference class, we just lack data."**
      *   *Status:* **False.**
      *   *Timing:* Kill this at minute 30 (after the Reveal).
      *   *Line:* "Nature does not tag people with 'True Risk.' Risk is a relationship between the person and the group you compare them to."
  *   **"More data fixes it."**
      *   *Status:* **False.**
      *   *Timing:* Kill this when they suggest regression. More data narrows the confidence interval around the *wrong* class frequency.
  *   **"Use the narrowest class possible."**
      *   *Status:* **Dangerous.**
      *   *Timing:* Kill this with **Wrench 1**.
  *   **"If it's relative, then anything goes."**
      *   *Status:* **False.**
      *   *Timing:* Kill this at minute 45 (The Pivot). Just because there is no *single* truth doesn't mean there are no *better* choices for a specific goal.
  *   **"This is Base Rate Neglect."**
      *   *Status:* **Confusion.**
      *   *Timing:* Briefly clarify at minute 30. Base rate neglect is ignoring the general class. This is having *too many* general classes.

  ### 4. The Two Wrenches

  **Wrench 1: The Singleton (The Limit of Narrowness)**
  *   **Where:** Minute 35, immediately after they argue for "more specific classes."
  *   **The Move:** "Okay, let's be precise. Class: '24-year-old, e-bike, 30hrs, 1 prior, top-decile telematics, lives on [Street Name].' How many people in that class? One. Her. What is the frequency? 0 or 1. Does that help us price?"
  *   **The Lesson:** Probability requires a collective. If you condition on everything, probability disappears. Therefore, we *must* group, and grouping is a choice, not a discovery. This is the bridge to why you can't condition on everything: **Prediction requires ignoring information.**

  **Wrench 2: Post-Hoc Slicing (The "Claimed in First 60 Days" Segment)**
  *   **Where:** Minute 65 (The Warning phase).
  *   **Distinction:** This is not the same lesson. The Reference Class Problem is about *competing valid descriptions*. Post-hoc slicing is about *invalid descriptions* (data snooping).
  *   **The Lesson:** "The Reference Class Problem says many classes are *valid*. Data Snooping creates classes that are *spurious*. We are discussing how to choose between valid options, not how to avoid cheating. But cheating is often disguised as 'finding the right reference class.'"
  *   **Why here:** If you put this too early, they will conflate "hard to choose" with "impossible to choose." Keep the validity question separate from the selection question.

  ### 5. Compliance and Protected Classes
  **Keep it out of the carrying example.**
  If you introduce gender or age as a variable in the main exercise, the conversation will immediately pivot to "Are we allowed to use this?" rather than "Does this predict risk?" You want them to feel the statistical tension first.

  **Bring it in at Minute 60.**
  Frame it as a **constraint on the Normative question.**
  *   *Statistical Question:* "Which class predicts best?"
  *   *Normative Question:* "Which class *should* we use?"
  *   *Compliance:* "Regulatory and ethical constraints remove certain classes from the 'Should' set, even if they remain in the 'Predicts' set."
  This clarifies that compliance doesn't solve the reference class problem; it just removes some options from the menu.

  ### 6. The Activity (Do vs. Know)
  To separate "getting it" from "learning the phrase," they must make a trade-off.

  **The Task (15 mins):**
  Split the room into two groups. Give them the same applicant and the same three conflicting rates (4%, 18%, 22%).
  *   **Group A Goal:** "Maximize market share. We need to be competitive. We cannot price higher than the market median."
  *   **Group B Goal:** "Ensure solvency. We are under-capitalized. We cannot tolerate a loss ratio above 50%."

  **The Deliverable:**
  Each group must pick *one* reference class to price against and write one sentence justifying it.
  *   *Expected Outcome:* Group A will likely pick the 4% class (Telematics). Group B will likely pick the 22% class (Prior Claim).
  *   *The Point:* Both are statistically valid. The "correct" class depends on the **business decision**, not just the data. This cements the "It depends on the question" resolution.

  ### 7. Explicit Refusals
  In the first 5 minutes, write this on the board under "Out of Scope." Say it out loud. This manages anxiety for analysts who want a formula.

  **"In the next 75 minutes, I will NOT teach you:"**
  1.  **How to build a GLM/XGBoost:** "Models hide reference classes; they don't eliminate them."
  2.  **Causal Inference:** "We are pricing risk, not proving causality. Correlation within a stable class is sufficient for pricing."
  3.  **The 'True' Probability:** "I cannot give you a formula to find the one true number. It does not exist."
  4.  **Legal Advice:** "I will tell you when compliance matters, not which laws apply."

  ### Summary Checklist for the Board
  1.  **Profile** (Hidden rates)
  2.  **Your Guess** (Write it down)
  3.  **Report A / B / C** (Reveal conflict)
  4.  **The Singleton** (0 or 1)
  5.  **Decision Context** (Growth vs. Solvency)
  6.  **Out of Scope** (The Refusals)

  This structure respects their intelligence, acknowledges their daily reality (conflicting data sources), and forces them to accept responsibility for the choice rather than hiding behind the math.
