answer: |-
  Here is the desiderata map for a generalized Strategy-Stealing Argument (SSA) applicable to non-classic settings (partial information, continuous spaces, epistemic asymmetry).

  ### I. Desiderata for Generalized Strategy-Stealing

  | # | Requirement | Definition | Motivating Failure Case | Constraint Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Action-Space Monotonicity** | Possessing an additional move/resource/action opportunity must weakly dominate having one less, holding strategy constant. | **Negative Externalities:** In signaling games or auctions, an extra bid/move can reveal private type or drive up costs, reducing expected utility. If the "extra move" lowers payoff, the contradiction fails. | **Hard** |
  | **2** | **Informational Opacity** | The "dummy" move (the stolen opening) must not convey private information that alters the opponent's belief state to the stealer's disadvantage. | **Signaling Leakage:** In Bayesian games, P1's opening move updates P2's priors. If P1 steals P2's strategy, P1 is effectively acting on P2's information set while P2 updates based on P1's signal. This creates an epistemic mismatch. | **Hard** (for Partial Info) |
  | **3** | **Strategy Robustness (Perturbation)** | The opponent's purported winning strategy must remain optimal (or valid) under slight perturbations of the state space caused by the stealer's extra move. | **Continuous Fragility:** In continuous action spaces (e.g., differential games), P1's arbitrary move shifts the state by $\epsilon$. If P2's strategy relies on precise measure-zero boundaries, the stolen strategy becomes illegal or suboptimal. | **Hard** (for Continuous) |
  | **4** | **Role Isomorphism** | The set of legal actions available to P1 must be a superset of those available to P2 at all relevant decision nodes. | **Asymmetric Roles:** In games like *Scotland Yard* (Pursuer vs. Evader) or asymmetric warfare sims, P1 cannot legally execute P2's specific moves (e.g., hiding vs. seeking). Stealing requires role interchangeability. | **Hard** |
  | **5** | **Counterfactual Observability** | The stealer must be able to compute the opponent's response without needing to observe information sets that are hidden from the stealer but visible to the opponent. | **Epistemic Asymmetry:** If P2 has private cards (Poker) or hidden state, P1 cannot simulate P2's strategy $S(h_2)$ because $h_2 \notin H_1$. P1 cannot steal a strategy dependent on info P1 doesn't have. | **Hard** |
  | **6** | **Deterministic Outcome Mapping** | A specific strategy profile must map to a deterministic win/loss outcome (or strictly ordered utility). | **Stochastic Noise:** In games with high variance (dice, nature moves), "Winning Strategy" becomes "Strategy with $p > 0.5$." If the extra move adds variance without shifting mean utility, the contradiction ($P1 > P2$ and $P2 > P1$) dissolves into overlapping confidence intervals. | **Camp Preference** |
  | **7** | **Finite Depth / Well-Foundedness** | The game tree must be well-founded (no infinite loops) to ensure the "arbitrary move" recursion terminates. | **Infinite Regress:** In continuous time or looping state spaces, the "if the square is taken, move elsewhere" clause may trigger infinitely, preventing the construction of a valid composite strategy. | **Hard** |

  ---

  ### II. Tension Map & No-Go Results

  The following tensions indicate subsets of desiderata that are jointly unsatisfiable under standard assumptions of strategic interaction.

  #### 1. The Signaling-Monotonicity Tension (Partial Information)
  *   **Conflicting Requirements:** **Action-Space Monotonicity (1)** vs. **Informational Opacity (2)**.
  *   **The Conflict:** In any game where moves act as signals (cheap talk or costly signaling), *every* move updates the opponent's belief state.
  *   **No-Go Result:** If the game involves **Epistemic Asymmetry** (P1 has private info), an "arbitrary" opening move is impossible. Any move P1 makes signals something. If P1 steals P2's strategy, P1 is effectively lying about their type. P2's best response to the *signal* will differ from P2's best response to the *strategy*.
  *   **Implication:** SSA cannot hold in Bayesian games where the first move is informative. To salvage SSA, you must assume **Non-Informative Priors** or **Pool Equilibria**, which are camp-specific preferences, not general truths.

  #### 2. The Continuity-Constructibility Tension (Continuous Spaces)
  *   **Conflicting Requirements:** **Strategy Robustness (3)** vs. **Finite Depth (7)**.
  *   **The Conflict:** In continuous action spaces, an "arbitrary move" requires selecting a point from a continuum. If the opponent's strategy is discontinuous (e.g., threshold strategies in auctions), a perturbation of $\epsilon$ can cause a discrete jump in opponent behavior.
  *   **No-Go Result:** Without **Determinism (6)**, you cannot guarantee the stolen strategy survives the perturbation. If the game is stochastic *and* continuous, the measure of states where the stolen strategy fails may be non-zero.
  *   **Implication:** SSA requires **Lipschitz Continuity** of the value function with respect to state perturbations. This is a strong mathematical constraint not present in classic discrete SSA.

  #### 3. The Asymmetry-Isomorphism Tension (Role Constraints)
  *   **Conflicting Requirements:** **Role Isomorphism (4)** vs. **Epistemic Asymmetry (5)**.
  *   **The Conflict:** Many games where one might want SSA (e.g., security games, attacker-defender) are defined by asymmetric action sets and information.
  *   **No-Go Result:** If P2 has access to information or actions P1 does not (by definition of the game rules), **Counterfactual Observability** fails. P1 cannot simulate P2.
  *   **Implication:** SSA is strictly limited to **Symmetric Information Games** or games where information can be publicly revealed without cost. This rules out most economic or military applications where SSA would be most valuable.

  ### III. Summary of Feasibility

  | Domain | Feasibility of SSA | Primary Blocker |
  | :--- | :--- | :--- |
  | **Perfect Info, Discrete** | **High** | None (Classic Hex/Chomp). |
  | **Perfect Info, Continuous** | **Medium** | Requires Lipschitz Value Functions (Robustness). |
  | **Partial Info, Symmetric** | **Low** | Signaling Leakage (Opacity vs. Monotonicity). |
  | **Partial Info, Asymmetric** | **Impossible** | Counterfactual Observability (Cannot simulate opponent). |
  | **Stochastic / Nature Moves** | **Low** | Requires Probabilistic Dominance (Determinism Preference). |

  **Verdict:** A generalized SSA is only viable if you impose **Informational Symmetry** (no private types) and **State Robustness** (continuous moves don't break strategies). Dropping either renders the argument logically unsound due to the Signaling-Monotonicity or Continuity-Constructibility tensions.
