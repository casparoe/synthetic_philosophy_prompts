prompt: |-
  hey, i need the desiderata for a theory that decides when strategy-stealing works outside classic perfect-information games. like, what conditions have to hold for one player to copy an opponent's decision rule and not be hurt by having an extra move or piece, especially when you leave symmetric board games and go into partial-info, continuous action spaces, or epistimic asymmetry where the surplus move might leak info. list each requirement with the case that motivates it—what goes wrong if you drop it—and mark which are hard constraints vs camp-specific preferences (e.g. determinism, discrete moves). also say if any subset is jointly unsatisfiable given standard no-go results about information revelation in strategic settings. skip the literature review, i just want the criteria and the tension map.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a generalized strategy-stealing argument:

  1.  **Deconstruct the Request:**
      *   **Topic:** Generalizing the Strategy-Stealing Argument (SSA) beyond classic perfect-information games (like Hex, Chomp).
      *   **Target:** A theory/criteria for when SSA works in settings with partial info, continuous actions, or epistemic asymmetry.
      *   **Specific Requirements:**
          *   List each requirement (desideratum).
          *   Provide the motivating case (what goes wrong if dropped).
          *   Classify as Hard Constraint vs. Camp-Specific Preference (e.g., determinism).
          *   Identify joint unsatisfiability (no-go theorems/tensions).
          *   **Constraint:** Skip literature review. Focus on criteria and tension map.

  2.  **Analyze the Core Logic of Strategy-Stealing:**
      *   *Classic SSA:* Player 1 (P1) makes an arbitrary move. Player 2 (P2) has a winning strategy $S$. P1 pretends to be P2, using $S$ against P2's actual moves. If $S$ ever calls for the square P1 already occupied, P1 makes another arbitrary move. Since having an extra piece/move is never a disadvantage (monotonicity), P1 wins. Contradiction.
      *   *Key Pillars:*
          1.  Symmetry (P1 can act as P2).
          2.  Monotonicity (Extra resources/moves $\ge$ 0 value).
          3.  Information Equivalence (P1 knows enough to execute $S$).
          4.  Non-interference (The "extra" move doesn't block $S$).

  3.  **Brainstorming Generalization Challenges:**
      *   *Partial Information:* If P1 makes an arbitrary opening move, does it reveal private info? If P2's strategy depends on P1's type, can P1 simulate it?
      *   *Continuous Actions:* "Arbitrary move" is hard to define. Measure zero issues.
      *   *Epistemic Asymmetry:* If P1 moves first, does P2 update beliefs? If P1 steals, does P2 notice the strategy is mirrored?
      *   *Stochasticity:* If the game has chance nodes, "winning strategy" becomes "strategy with $>50\%$ win rate." Does the extra move preserve probability dominance?

  4.  **Developing the Desiderata (Drafting & Refining):**

      *   *Req 1: Monotonicity of Advantage.* In Hex, an extra stone is never bad. In Poker, an extra chip is good, but an extra *action* (betting out of turn) might be bad.
          *   *Motivation:* If the extra move forces a reveal or limits future options negatively, SSA fails.
          *   *Type:* Hard Constraint.

      *   *Req 2: Informational Opacity of the "Dummy" Move.* P1's initial arbitrary move shouldn't signal private info that P2 can exploit.
          *   *Motivation:* Signaling games. If P1 moves $X$, P2 infers Type $A$. If P1 steals, they might not be Type $A$.
          *   *Type:* Hard Constraint (for partial info).

      *   *Req 3: Strategy Robustness to Perturbation.* P2's strategy must work even if the board state is slightly altered (by P1's extra move).
          *   *Motivation:* Continuous spaces. If P1 places a piece at $x+\epsilon$, does P2's function $f(x)$ break?
          *   *Type:* Hard Constraint.

      *   *Req 4: Action Space Isomorphism.* P1 must be able to legally make P2's moves.
          *   *Motivation:* Asymmetric roles (e.g., Attacker vs. Defender). If P1 can't make P2's specific moves, stealing is impossible.
          *   *Type:* Hard Constraint.

      *   *Req 5: Non-Revelation of Counterfactuals.* P1 simulating P2 shouldn't require P1 to know what P2 *would* have done in a counterfactual world P1 can't observe.
          *   *Motivation:* Imperfect recall or hidden states.
          *   *Type:* Hard Constraint.

      *   *Req 6: Determinism vs. Stochasticity.* Classic SSA assumes deterministic outcomes.
          *   *Motivation:* If the game is stochastic, "winning" is probabilistic.
          *   *Type:* Camp Preference (can be relaxed to probabilistic dominance).

  5.  **Identifying Tensions/No-Go Theorems:**
      *   *Information vs. Monotonicity:* In signaling games, *any* move conveys info. If moves convey info, an "arbitrary" move isn't info-neutral. This breaks Monotonicity (the extra move changes the belief state, potentially negatively).
      *   *Continuity vs. Discreteness:* In continuous spaces, "making an arbitrary move" requires a measure. If the strategy is sensitive to measure-zero sets, SSA fails.
      *   *Symmetry vs. Asymmetry:* If roles are asymmetric (e.g., one player has private info the other doesn't), P1 cannot simulate P2 because P1 lacks P2's information set.

  6.  **Structuring the Output:**
      *   Introduction (brief, setting the scope).
      *   The Desiderata Table/List (Requirement, Motivation, Constraint Type).
      *   The Tension Map (Incompatibilities).
      *   Conclusion (Summary of feasibility).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "extra piece" (Hex) and "extra move" (turn order). In partial info, the "extra move" is often the *first* move which signals.
      *   *Refinement on "Hard Constraint":* Differentiate between logical impossibility (Hard) and modeling assumptions (Preference).
      *   *Refinement on No-Go:* Explicitly mention the conflict between *Signaling* and *Informational Opacity*. This is the biggest hurdle in partial info games.

  8.  **Final Polish:** Check tone (technical, direct), ensure all prompt constraints are met (no lit review, specific formatting). *Self-check: Did I address continuous action spaces? Yes, under Robustness. Did I address epistemic asymmetry? Yes, under Informational Opacity.*

