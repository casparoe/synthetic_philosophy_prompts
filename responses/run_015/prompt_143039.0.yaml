answer: |-
  1. **The AI Talent Show Case**
     Last spring a student here submitted an AI-generated ballad to our talent show, and the judges disqualified it because nobody had written it; you've said you agree with that verdict because the model hasn't *lived* anything. If the definition of art is transmitting a feeling you've lived through, does that mean the AI failed because it has no inner life, or because it broke a rule about who counts as an artist?
     *She will likely say:* It failed because art requires a human source; the AI has no feelings to transmit, so it's just simulation, not art.
     *[Follow-up: If simulation is the problem, though, doesn't that make art about the biography of the maker rather than the experience of the listener, which seems to contradict the idea that art is about what gets transmitted to us?]*

  2. **The Session Musician Asymmetry**
     You've drawn a sharp line between that AI and a session musician who hasn't lost anyone but still plays on a moving elegy; you say the musician can make art, but the AI can't. If the musician doesn't need to have lived the specific grief they're playing, what exactly are they transmitting that the AI isn't?
     *She will likely say:* The musician is transmitting their own feeling of engagement or technical mastery, or acting as a vessel for the composer's lived feeling.
     *[Follow-up: But if they can be a vessel for a composer's feeling, why can't the AI be a vessel for the prompter's feeling, unless you're secretly saying human biology matters more than the transmission itself?]*

  3. **Advertising and TikTok**
