answer: |-
  You have correctly identified that "entrenchment" is too blunt a instrument for this. In legal theory and logic, you are actually dealing with three distinct problems that often travel together.

  To answer your headline question: **No, there is no single settled name for this cluster.** However, the three cases you describe map neatly onto three distinct concepts in constitutional design and deontic logic.

  Here is the breakdown of the edges, the names, and the solutions for your binder.

  ### 1. The First Case: Asymmetric Entrenchment (The Ratchet)

  **The Concept:** This is **Procedural Entrenchment**, specifically **Asymmetric Amendment Rules**.
  **The Problem:** It isn't self-reference that bothers you; it is the **binding of future majorities by past transient majorities.**

  In constitutional law, a rule is "entrenched" if it requires a special procedure to amend. That is normal. What felt "cheaty" in your first case was the *asymmetry*. A simple majority (a transient state) used its power to permanently alter the cost of future power, without having the super-majority consent usually required to lock things in.

  **Answering your specific questions:**
  *   **Is the problem just that the bar for getting out is higher than the bar for getting in?**
      Yes. If a rule requires two-thirds to pass *and* two-thirds to remove, the objection largely vanishes. This is **Symmetric Entrenchment**. It signals that the group agrees this rule is foundational *at the moment of adoption*.
  *   **What about the reverse (hard-in, easy-out)?**
      This is rare but not inherently suspicious. It implies a "probationary" rule. "We try this high-barrier rule, but if it sucks, we can dump it easily." It doesn't trigger the "cheat" alarm because it doesn't trap the future; it liberates it.
  *   **Why did the "lowering the bar" move feel fine?**
      Because lowering the barrier for future action is an act of *democratic expansion*. A majority voting to make it easier for future majorities to act is consistent with democratic theory. A majority voting to make it *harder* for future majorities to act is an act of *self-preservation* that requires higher legitimacy (i.e., a super-majority) to justify.

  **The Boundary:** The ethical line is crossed when a current majority uses a low threshold to restrict the sovereignty of a future majority.

  ### 2. The Second Case: Temporal Entrenchment and Rule Identity

  **The Concept:** This is **Graduated Entrenchment** combined with the **Problem of Rule Individuation**.
  **The Problem:** You have identified a "Ship of Theseus" paradox applied to regulations.

  The "growing teeth" mechanism is a known legislative tool (often used to protect new laws from immediate repeal while they bed in). However, your group discovered the loophole: **Amendment vs. Replacement.**

  **Answering your specific questions:**
  *   **Is the question really about when a rule stops being the same rule?**
      Exactly. This is the **Individuation Problem**. Your binder lacked a definition of "identity."
      *   *View A:* A rule is defined by its *number/position* in the binder. (Changing a word leaves it as Rule 14, so the clock keeps ticking).
      *   *View B:* A rule is defined by its *text*. (Changing a word makes it Rule 14b, a new rule, so the clock resets).
      Your group implicitly switched from View A to View B to escape the trap.
  *   **Is this the same phenomenon as Case 1?**
      No. Case 1 is about *vote thresholds*. Case 2 is about *time and identity*.
      Case 1 is a "Ratchet." Case 2 is a "Time Lock."
      They feel similar because both make a rule harder to remove than it was to pass, but the mechanism is different. In Case 1, the difficulty is static but asymmetric. In Case 2, the difficulty is dynamic (increasing over time).

  **The Boundary:** The exploit exists wherever "amendment" is not strictly defined. If you want to forbid the one-word trick, you must define what constitutes a "substantive amendment" versus a "new proposal." A common fix is: *Any change to the text resets the clock, unless the change is purely clerical (spelling/formatting) as determined by a separate vote.*

  ### 3. The Third Case: The Transition Paradox

  **The Concept:** This is the **Problem of Validity** (or the *Grundnorm* problem).
  **The Problem:** This is logically distinct from the first two. Cases 1 and 2 assume the rule *passed* and ask if it is *fair*. Case 3 asks: *Did the rule exist at all?*

  This is a classic conflict of laws in time. You have Rule A (Old) and Rule B (New). Rule B says "I am now the rule for counting votes." Rule A says "I am still the rule for counting votes until I am validly replaced."

  **Answering your specific questions:**
  *   **Is this in the same family?**
      No. Cases 1 and 2 are about **Policy** (how hard should it be to change things?). Case 3 is about **Logic** (how do we determine truth during a state change?).
  *   **The Standard Solution:**
      In almost all legal systems, the **Old Rule governs the transition.**
      Why? Because the New Rule has no authority until it is born. It cannot midwife its own birth. To allow the New Rule to count the votes for its own adoption creates a logical loop (if the vote fails under the Old Rule, the New Rule never exists to say "Actually, it passed").
      *   *The Edge Case:* The only time the New Rule can govern its own birth is if the Old Rule explicitly says, "Future rule changes will be counted by the rules of the new proposal." (This is rare and dangerous).

  ### Summary for your Binder Rewrite

  You are rewriting the binder to prevent arguments. Here is how you cut up the animals so you can forbid the right things:

  1.  **Separate the Meta-Rules:** Do not keep the "Rule for Changing Rules" at the same level as "No moving the King on turn 1." It needs to be in a **Constitution** section.
  2.  **Solve Case 1 (Asymmetry):** Adopt a **Symmetry Principle**. The threshold to pass a rule must be less than or equal to the threshold to remove it.
      *   *Forbidden:* A rule passed by 50% that requires 66% to remove.
      *   *Allowed:* A rule passed by 66% that requires 66% to remove.
  3.  **Solve Case 2 (Identity):** Adopt an **Identity Clause**.
      *   *Definition:* "A rule retains its 'age' only if the amendment does not alter the substantive effect of the rule. Any change to the voting threshold, time limits, or penalties resets the 'age' of the rule to zero."
      *   *Prevention:* This kills the one-word trick. If you change a word to reset the clock, the clock resets, but the "1-year protection" is gone, so you can remove it immediately. Wait—if the protection is gone, you can remove it.
      *   *Better Prevention:* "Rules regarding the amendment process itself cannot be subject to time-based entrenchment." (Don't let the meta-rules grow teeth).
  4.  **Solve Case 3 (Validity):** Adopt a **Continuity Clause**.
      *   *Wording:* "Any proposal to change the rules shall be voted upon according to the rules *currently in force* at the time the vote is called. A rule change only takes effect after the vote is successfully concluded."

  ### The Verdict

  *   **Case 1 & 2** are cousins. They are both **Entrenchment Strategies**. Case 1 is *Threshold Entrenchment*, Case 2 is *Temporal Entrenchment*. They are distinct mechanisms but share the same ethical hazard (binding the future).
  *   **Case 3** is a different animal. It is a **Validity Paradox**. It is not about fairness; it is about coherence.

  If you want a label to put in your binder index:
  *   Cases 1 & 2 fall under **"Amendment Restrictions."**
  *   Case 3 falls under **"Transitional Validity."**

  The feeling that Case 1 was "wrong" one way but not the other is the **Democratic Legitimacy Intuition**: It is legitimate to make it easier for people to rule themselves; it is illegitimate for a temporary majority to make it harder for their successors to rule, unless that temporary majority was large enough (super-majority) to represent a broad consensus.
