  ### Diagnosis: Ari's Operating System

  Based on his track record, Ari is not just a Kelly bettor; he is a **Geometric Growth Maximizer (Log-Utility)** who accounts for **Parameter Uncertainty** and **Background Risk (Human Capital)**.

  1.  **Log-Utility:** He rejected the 2.2x/0.1x gamble despite positive Expected Value (EV) because the Expected Log Growth was negative. He optimizes for long-term compounding, not arithmetic mean.
  2.  **Parameter Uncertainty:** He bets full Kelly (20%, 60%) only when the bias is "tested/known." When estimates are model-based and historically imperfect (the new case), he implicitly applies a **Fractional Kelly** discount.
  3.  **Total Balance Sheet:** The "labor income remark" confirms he does not view his $50k bankroll in isolation. He views his **Human Capital (HC)**—the present value of future earnings—as part of his investable wealth. He actively manages the correlation between his bets and his HC.

  ### Model Predictions for the New Case

  Here is how three distinct rules interpret the Wind-Power bet (60% edge, even money, correlated with income, estimation risk):

  **1. Plain Cash-Kelly (with Estimation Discount)**
  *   **Logic:** Ignores the job. Treats the $50k as the total universe. Acknowledges the 60% is an estimate (±5-10%), so applies a safety margin (e.g., Half-Kelly).
  *   **Calculation:** Full Kelly on 60% is 20%. Half-Kelly is 10%.
  *   **Prediction:** **Bets 10% ($5k).**

  **2. Total-Wealth Kelly (Ignoring Correlation)**
  *   **Logic:** Treats Human Capital as part of the bankroll. If his career PV is, say, $2M, his total wealth is $2.05M. To optimize total growth, he should bet 20% of *Total Wealth*.
  *   **Calculation:** 20% of $2.05M is $410k. Since he only has $50k cash, he should leverage up significantly.
  *   **Prediction:** **Bets >100% of cash (Max Leverage).** (Ari clearly won't do this, so this rule is out).

  **3. Total-Wealth Kelly (with Correlation/Hedging)**
  *   **Logic:** His Human Capital is a large asset that is **Long Wind**. The bet is **Long Wind**. Adding the bet increases concentration risk without adding diversification. In portfolio theory, if you already hold a large position in an asset class (via labor), you should reduce or reverse exposure in your financial portfolio to maintain optimal geometric growth.
  *   **Calculation:** The "edge" from the bet is outweighed by the "variance drag" it adds to his total balance sheet. The marginal utility of winning is low (he gets the bonus anyway); the marginal pain of losing is catastrophic (loss of cash + loss of income).
  *   **Prediction:** **Bets 0% (or takes the Other Side).**

  ### Best Guess: 0%

  **Ari bets nothing.**

  **Reasons:**
  1.  **The "Keep Apart" Heuristic:** His explicit remark about labor income is the strongest prior. He views losing the bet and losing his income as a single "ruin" event. He wants to decorrelate his financial risk from his labor risk.
  2.  **Concentration Risk:** With 1/3 of his pay tied to wind installations, his Human Capital is already a massive, leveraged long position in the wind industry. Adding a cash bet on the same outcome is "double-dipping." For a geometric rationalist, variance is the enemy of growth. This bet increases total wealth variance disproportionately to the edge.
  3.  **Estimation Risk:** Even without the job correlation, a 60% model with a history of 5-10 point errors is fragile. Full Kelly (20%) is dangerous; Half-Kelly (10%) is prudent *if uncorrelated*. But when combined with the correlation risk, the "True Kelly" fraction of his *total* wealth likely drops below zero.
  4.  **Why not the Other Side?** While strict Total-Wealth-Kelly math might suggest *shorting* wind to hedge his human capital, Ari's comment ("keep the two apart") suggests a constraint against active hedging via shorting, likely due to the difficulty of trusting a short position against his own 60% model. Refusal (0%) is the behavioral equilibrium of "I see the risk, I won't add to it, but I won't fight my own model either."

  ### The Deciding Hypothetical

  To distinguish whether Ari is driven by **Estimation Risk** (Rule 1) or **Total-Wealth Correlation** (Rule 3), propose this scenario:

  **The Hypothetical:**
  > "Same wind-power bet, same 60% model, same estimation uncertainty. However, you have just negotiated a new contract: **Your salary is now fixed. No bonus, no tie to installations.** Your income is guaranteed regardless of industry performance."

  **The Interpretation:**
  *   **If he bets ~10% (Fractional Cash-Kelly):** His refusal in the original case was driven by **Correlation/Total-Wealth** rules. Removing the correlation removes the blocker, leaving only the estimation discount.
  *   **If he still bets 0%:** His refusal was driven by **Estimation Risk** or **Epistemic Humility** regarding his industry model (e.g., "I know too much, the market is efficient here"). The correlation was a secondary justification.

  *(Note: If you want to distinguish Cash-Kelly from Total-Wealth-Kelly more aggressively, offer an **uncorrelated** bet with 60% edge. Cash-Kelly bets 10% of $50k. Total-Wealth-Kelly—viewing his stable base salary as a bond—should bet **more** than 10% of $50k, leveraging his cash against his safe human capital.)*
