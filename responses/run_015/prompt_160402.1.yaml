answer: |-
  This is a classic friction point in the history of technology and STS, specifically the tension between Langdon Winner's "strong thesis" (artifacts *inherently* embody politics) and the more constructivist view that politics resides in the *network* surrounding the artifact.

  Your current principle ("settles a question... hard to undo") fails because **reversibility is a measure of material inertia, not political content.** A wiki is highly reversible but deeply political (it enforces consensus, transparency, and a specific hierarchy of administration). The Midwest bridge is hard to undo but feels "apolitical" to you because the *agency* is obscured.

  As an urban historian, you are likely wrestling with the difference between **politics as decision** (sovereign choice) and **politics as condition** (structural constraint).

  Here is a proposed framework to replace your single principle, followed by a re-evaluation of your list and the two new cases.

  ### A Better Framework: Three Modes of Artifact Politics

  Instead of asking "Is this political?", ask "Which mode of politics is sedimented here?"

  **1. Sovereign Politics (The Moses Model)**
  *   **Mechanism:** Explicit exclusion or inclusion encoded by a specific agent.
  *   **Key Question:** Who did this benefit/harm, and did they know?
  *   **Temporality:** Point of origin (the design meeting).
  *   **Example:** Long Island Parkways.
  *   **Why it fits:** This matches your intuition. It requires a *subject* exercising power over *objects* to control *other subjects*.

  **2. Disciplinary Politics (The Traffic Signal Model)**
  *   **Mechanism:** Norms embedded in defaults, algorithms, or "optimization." No one explicitly chose the outcome; it emerged from a system designed to maximize a variable (throughput, profit, security).
  *   **Key Question:** What behavior is being nudged or punished by the system's default state?
  *   **Temporality:** Continuous/Operational.
  *   **Example:** Traffic signals, Keycard logs.
  *   **Why it fits:** This captures the "no decision anyone can point to" feeling. This is Foucaultian power: capillary, invisible, and automated. It is often *more* potent than Sovereign politics because it is harder to contest (you can't protest a vendor's default objective function as easily as a racist engineer).

  **3. Constitutional Politics (The Nuclear Model)**
  *   **Mechanism:** The artifact *requires* a specific social hierarchy to function safely or at all. It cannot exist in a democracy (or requires a very specific kind).
  *   **Key Question:** What kind of society must exist for this thing to work?
  *   **Temporality:** Existential/Permanent.
  *   **Example:** Nuclear reprocessing plants.
  *   **Why it fits:** This distinguishes the plant from the parkway. The parkway *could* be run democratically; the plant *cannot* (arguably) be run without centralized secrecy and security.

  ### Re-evaluating Your List

  Using this typology, here is how I would adjust your verdicts:

  *   **Long Island Parkways:** **Sovereign.** Clear intent, clear exclusion.
  *   **Midwest Bridge:** **Sovereign (Deferred).** You want to say "not political," but in urban history, **negligence is a political act.** The politics aren't in the specific bridge; they are in the *standard drawing*. The standard drawing represents a past Sovereign decision (to prioritize cars/standardization over flexibility) that has now become invisible. It is *depoliticized* infrastructure, which is a political state. I would argue you should classify this as political, but note the *temporal displacement* of the decision.
  *   **Hostile Architecture Benches:** **Disciplinary.** You are right that the politics isn't in the steel; it's in the *deployment*. A bench in a private plaza vs. a public square changes the script. The bench "scripts" the user as a consumer, not a loiterer.
  *   **Nuclear Reprocessing:** **Constitutional.** Distinct from the others because it dictates the *regime type*, not just the distribution of access.
  *   **Wiki/Open Source:** **Disciplinary/Constitutional.** Drop the idea that it "resists politics." It enforces a politics of meritocracy, consensus, and transparency. It resists *hierarchy*, which is a political stance. It settles the question of "who decides truth" via edit history and admin rights.
  *   **Traffic Signal System:** **Disciplinary.** You are correct to lean political. This is the privatization of public policy. The vendor's code *is* the law. Because no human chose it, it is immune to democratic recall. This is arguably the most important category for contemporary urban history.

  ### The Two New Cases

  **1. Keycard System (Maintenance $\rightarrow$ HR Surveillance)**
  *   **Verdict:** **Disciplinary Politics (Function Creep).**
  *   **Analysis:** Initially, the artifact had a technical script (security/maintenance). However, the *data* generated by the artifact allowed a new political script to be overlaid (labor discipline). This is distinct from the Moses bridge because the exclusion wasn't built into the door; it was built into the *interpretation of the log*.
  *   **Historical Angle:** This is the shift from "architecture as enclosure" to "infrastructure as data extraction." The politics lie in the *repurposing of the trace*.

  **2. Subway Elevator Skipping the Mezzanine**
  *   **Verdict:** **Sovereign (via Script).**
  *   **Analysis:** This is a subtle one. If the elevator goes Street $\rightarrow$ Platform, bypassing the mezzanine (where fares are paid/tokens checked), it implies a specific flow.
      *   *Scenario A:* It forces disabled riders to rely on staff to unlock it, reducing autonomy. (Sovereign exclusion via "safety").
      *   *Scenario B:* It prevents the elevator from being used as a thoroughfare by non-riders (homeless sheltering in the mezzanine).
  *   **Political Settlement:** It settles the question of **autonomy vs. security.** By skipping the mezzanine, the system designers have decided that fare evasion/security is more important than the seamless movement of disabled bodies. It "scripts" the disabled rider as a potential security risk or a special case requiring management, rather than a standard user.

  ### What to Drop and What to Keep

  **Drop:**
  1.  **"Hard to undo" (Reversibility):** As you noted, this confuses *material durability* with *political weight*. A policy can be reversed easily but be deeply political (e.g., a zoning variance). A wiki is easy to edit but politically structured.
  2.  **The requirement for "Intent":** If you require intent, you lose the Traffic Signal and the Midwest Bridge. In postwar engineering, **omission is a decision.** The "standard drawing" is a fossilized political decision.
  3.  **The idea that some things "resist" politics:** Neutrality is a claim, not a state. The wiki claims neutrality to enforce a specific mode of collaboration.

  **Keep/Refine:**
  1.  **"Settles a question about who can do what":** This is your strongest clause. Keep this as the core definition.
  2.  **Add: "...either by explicit command, systemic default, or structural necessity."** This covers your three modes (Sovereign, Disciplinary, Constitutional).

  ### The "Midwest Bridge" Problem: A Historian's Note

  You are bothered by the Midwest Bridge because you are looking for a *villain* (Moses) and can't find one. But as a historian, your job is often to trace the **depoliticization** of technical choices.

  The Midwest bridge *is* political, precisely because it looks neutral. It represents the moment when a political choice (cars > buses) became "engineering standard." Your analysis shouldn't be "Is this political?" but "How did this political choice become invisible enough to be copied without review?"

  That invisibility *is* the politics of the postwar era. The "standard drawing" is the ultimate political artifact because it removes the need for further political thought.

  ### Summary Recommendation

  Adopt a **tripartite definition**: An artifact is political if it (1) distributes access/opportunity, (2) enforces behavioral norms, or (3) necessitates a specific power structure.

  *   **Moses:** Distributes access (1).
  *   **Traffic Signal:** Enforces norms (2).
  *   **Nuclear:** Necessitates power structure (3).
  *   **Midwest Bridge:** Distributes access (1) via inherited norms (2).
  *   **Wiki:** Enforces norms (2).

  This allows you to keep the nuance (the *kind* of politics differs) without falling into the trap of saying some things are simply "neutral."
