      *   *Michel Foucault:* Power is capillary, not just top-down. The traffic signal case screams Foucault (disciplinary power embedded in systems).
      *   *Bruno Latour/Actor-Network Theory (ANT):* Artifacts are actors. Morality is delegated to things. The "script" of the artifact.
      *   *Madeleine Akrich:* The "script" of the technology. Who is the imagined user?
      *   *Critical Infrastructure Studies:* Politics of invisibility, maintenance, and defaults.
      *   *The "Intent" Trap:* The user is struggling with the *intent* vs. *effect* distinction. Moses (intent) vs. Midwest (negligence) vs. Traffic Signal (default/algorithm).

  3.  **Evaluate the User's Current Principle:**
