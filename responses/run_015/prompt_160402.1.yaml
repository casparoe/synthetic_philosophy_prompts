  4.  **Develop a Better Framework:**
      *   Instead of a binary "Is it political?", propose dimensions or modes of politics.
      *   *Mode 1: Intentional Exclusion (Moses).* Politics of *Design Intent*.
      *   *Mode 2: Structural/Inherent Requirement (Nuclear).* Politics of *Systemic Necessity* (Winner's strong thesis).
      *   *Mode 3: Delegated Normativity (Traffic Signals/Benches).* Politics of *Default Scripts* (Latour/Akrich). This covers the "no one decided" aspect.
      *   *Mode 4: Contextual Appropriation (Benches).* Politics of *Use/Interpretation*.
      *   *Refining the "Midwest Bridge":* It *is* political in effect, but perhaps not in *genealogy*. However, in urban history, effect often trumps intent. The "standard drawing" is itself a political artifact (it encodes past decisions).
      *   *Refining the "Wiki":* Wikis *do* have politics (administration, edit wars, structure). They resist *hierarchy*, which is a political stance.

  5.  **Drafting the Response - Section by Section:**

      *   **Acknowledge the Discipline:** Validate their struggle. It's the classic Winner/Latour tension.
      *   **Critique the Current Principle:** The "hard to undo" clause is about *materiality*, not politics. The "who can do what" is good but needs to include *how* that settlement happens (intent vs. drift).
      *   **Propose a Typology (The "Better Principle"):** Instead of one principle, offer three *modes* of artifact politics.
          1.  *Sovereign Politics (Moses):* Explicit command, exclusion, intent.
