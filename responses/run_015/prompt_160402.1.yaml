      *   "Hard to undo": This is the weak point. Reversibility isn't the definition of politics; it's a measure of *impact* or *path dependence*. A wiki is political because it structures knowledge production, even if editable.
      *   *The Midwest Bridge:* If the effect is the same (no bus), is it not political? The user *wants* to say it's not political because there was no *agent* making a political choice. This suggests the user is conflating "political artifact" with "politicized decision."
