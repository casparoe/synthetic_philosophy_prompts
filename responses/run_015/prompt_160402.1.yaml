  9.  *(Final check of the "Wiki")*: Wikis enforce consensus. That is a political structure. It's not "resisting politics," it's enforcing a specific *kind* of politics (deliberative vs. authoritarian).

  10. *(Final check of the "Subway Elevator")*: Skipping the mezzanine. This is about flow control. It prevents the elevator from being a thoroughfare, perhaps? Or it makes access harder for disabled people (have to go up, then down?). This is a "script" of the "legitimate rider."

  Okay, ready to write. Structure:
