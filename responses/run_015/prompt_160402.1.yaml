      *   *The Midwest Bridge:* I need to be careful here. If I say "everything is political," it's useless. The distinction is between *politicized* (contested) and *political* (power-laden). The Midwest bridge is political but *depoliticized*. The politics are buried in the standard.
      *   *The Traffic Signal:* This is the most important case for a modern urbanist. It's the "black box" of vendor logic.
      *   *Terminology:* Use "Script," "Affordance," "Path Dependence," "Black Boxing."

