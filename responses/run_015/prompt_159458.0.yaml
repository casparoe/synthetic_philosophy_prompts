answer: |-
  Yes, there is a single principle behind your verdicts, and it is not vacuous. Your intuitions are tracking a distinction that formal epistemologists (most notably Persi Diaconis and Sandy Zabell) have spent decades formalizing.

  The principle is: **Uncertain evidence updates are rational if and only if they can be reconstructed as Strict Conditionalization on a richer space of "Experiences" or "Signals."**

  In your formulation: *"Soft updating is only a computational shortcut for conditioning on your total evidence."*
  This is correct, but to avoid vacuity, we must specify what "total evidence" means. It means **the likelihood function of the experience**, not just the posterior probability it induces.

  Jeffrey Conditioning (probability kinematics) is a **lossy compression** of the true Bayesian update. It throws away information about *why* the probability changed (the likelihood ratios) and keeps only the *result* (the new marginal). Your gut verdicts in cases 1–5 are essentially error messages flagging when that compression loses too much data.

  Here is how the principle explains your five cases, followed by the verdict on the "drift."

  ### Analysis of Your Cases

  **1. Textbook Case (Rigidity Holds)**
  *   **Verdict:** Jeffrey Conditioning works.
  *   **Principle:** Here, the "glance" functions as a sufficient statistic. The likelihood ratio $P(\text{Glance}|\text{Rain}) / P(\text{Glance}|\text{No Rain})$ is constant across the hypothesis space. Because the *structure* of the evidence doesn't depend on which hypothesis is true (other than via the probability of rain), the compression loses nothing relevant. Rigidity holds, so the shortcut is valid.

  **2. Independent Signals (Information Loss)**
  *   **Verdict:** Sequential Jeffrey fails; combine first.
  *   **Principle:** When you update to 0.6 via Jeffrey Conditioning, you discard the likelihood ratio that got you there. You keep the posterior, but you lose the "weight" of the evidence.
      *   Signal A moves $0.3 \to 0.6$.
      *   Signal B moves $0.3 \to 0.6$.
      *   If you treat them as independent, the likelihood ratios should multiply. But Jeffrey Conditioning on the hypothesis space treats the second update as starting from 0.6, not 0.3. Since the new input is "set P(Rain) to 0.6," and P(Rain) is *already* 0.6, the update is zero.
      *   **The Principle says:** You cannot compress independent signals into marginal probabilities on the hypothesis space and expect to combine them later. You must store the likelihoods (the "total evidence") to combine them correctly.

  **3. Overlapping Inputs (Commutativity)**
  *   **Verdict:** Order shouldn't matter (you are right; your friend is describing the flaw of Jeffrey Conditioning).
  *   **Principle:** A fundamental norm of rationality is the **Commutativity of Evidence**: if you receive evidence $E_1$ and $E_2$, your final belief should not depend on the order you processed them.
      *   Strict Conditionalization on experiences commutes.
      *   Jeffrey Conditioning on different partitions *does not* commute.
      *   **The Principle says:** If your update method yields different results based on order, you are not conditioning on the total evidence; you are manipulating the compressed shadows. Your intuition that order *shouldn't* matter is the correct normative constraint; Jeffrey Conditioning fails it here, proving it's the wrong tool for this job.

  **4. Rigidity Fails (Model Update)**
  *   **Verdict:** Enlarge the space, condition on experience.
  *   **Principle:** This is the classic Diaconis-Zabell result. If the experience changes your belief about the reliability of the experience (e.g., "it's dim, maybe I'm seeing things"), the Rigidity constraint ($P(H|E_{new}) = P(H|E_{old})$) is violated.
      *   **The Principle says:** When the mapping between Experience and Hypothesis changes, you cannot update on the Hypothesis directly. You must move to the space of $(Hypothesis \times Experience)$, update on the raw experience, and then marginalize. You correctly identified that the "shortcut" is broken when the reliability model shifts.

  **5. Carving (Partition Invariance)**
  *   **Verdict:** Same information shouldn't yield different numbers.
  *   **Principle:** This is **Description Invariance**. The physical evidence (the photons hitting your retina) is the same regardless of whether you label it "Red/Not-Red" or "Scarlet/Crimson/Other."
      *   Jeffrey Conditioning results depend on the partition chosen.
      *   Strict Conditionalization on the raw experience does not.
      *   **The Principle says:** If your credence changes based on how you linguistically carve the experience, you are updating on the *description*, not the *evidence*. The "total evidence" is the experience itself, which is partition-invariant.

  ### Is the Principle Vacuous?

  It risks vacuity only if "total evidence" is a magical black box. But it is not vacuous if we cash it out operationally:

  **The Non-Vacuous Constraint:** To use a soft update (Jeffrey), you must be able to specify the **Likelihood Ratios** of the experience that would produce that update via Strict Conditionalization.
  *   If you can specify the likelihoods, use them (Strict Conditionalization).
  *   If you can't specify the likelihoods, but Rigidity holds, Jeffrey is a safe shortcut.
  *   If Rigidity fails, or you need to combine independent signals, or you need commutativity, **Jeffrey Conditioning is forbidden.** You must model the signal generation process explicitly.

  This is a substantive constraint. It tells you that you are *not allowed* to use Jeffrey Conditioning in cases 2, 3, and 5, despite it being the standard textbook tool for uncertain evidence.

  ### The Drift Case: "Credence drifts to 0.4 overnight"

  **Verdict:** This is **not evidence**, and you should not treat it as such. In fact, you should try to correct it.

  **Why?**
  Under the principle *"Update = Condition on Total Evidence,"* an update requires an **input** from outside the current belief state (a signal, an experience, a measurement).
  *   **Drift without cause** is endogenous noise. It is a malfunction of the belief-forming mechanism, not an input to it.
  *   If you treat random drift as evidence, you violate the **Reflection Principle**. You would be planning to change your mind in the future without expecting to learn anything. This makes you vulnerable to Dutch Books (money pumps).
  *   **The Principle's verdict:** Since there is no "Experience" or "Signal" to condition on, there is no "Total Evidence." Therefore, there is no valid update. The shift from 0.3 to 0.4 is irrational akrasia or cognitive noise.
  *   **What to do:** If you notice this drift, the rational move is to ask: "Did I receive evidence I forgot?" If the answer is "No," you should actively adjust your credence *back* to 0.3 (or wherever it was before the noise), treating the drift as a calibration error.

  ### Summary

  Your gut is acting like a rigorous Bayesian who refuses to accept **lossy compression** as a fundamental norm.

  *   **The Principle:** **Strict Conditionalization on Experiences is fundamental; Jeffrey Conditioning is a derivative approximation valid only under Rigidity and Partition Invariance.**
  *   **The Drift:** It is a violation of the principle. It is noise, not signal. Do not update on it; correct it.

  You have essentially reinvented the critique of Jeffrey Conditioning found in Diaconis & Zabell (1982), "Updating Subjective Probability." Your intuitions are theoretically sound.
