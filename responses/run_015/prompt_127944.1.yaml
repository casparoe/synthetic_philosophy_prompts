answer: |-
  The Extended Mind Thesis (EMT), originally proposed by Clark and Chalmers, argues that if an external tool functions reliably and transparently enough, it should be considered part of the cognitive process. The "glasses" analogy is the classic example: because you look *through* the glasses rather than *at* them, they are functionally equivalent to a biological lens. The "fungal network" analogy adds a biological systems perspective, suggesting that cognition, like a plant's nutrient intake, can be distributed across a symbiotic network where the host relies on external processing to navigate the environment.

  However, when auditing these analogies against **opaque algorithmic recommendation feeds**, significant structural fractures appear. The core requirement for EMT is not just coupling, but *trust* and *alignment*. A tool becomes part of the mind when its operations are predictable and its goals are identical to the user's.

  **Auditing the Glasses Analogy**
  In this mapping, your brain is the visual cortex, the algorithm is the lens, and the internet is the visual field. The breakdown occurs primarily in transparency and agency. Glasses are optically transparent; they do not hide objects in your periphery based on a corporate metric. An algorithmic feed, conversely, is opaque. It actively conceals information (input filtering) and rearranges priority based on engagement goals that may contradict your epistemic goals (e.g., showing you rage-bait because it keeps you looking, not because it is useful). Furthermore, glasses do not adapt their focal length without your consent. Algorithmic feeds adapt constantly based on behavioral data you may not realize you are giving. The analogy smuggles in the assumption that the tool is passive and wholly subservient to the user's intent. When the "lens" has an incentive to distort the image to sell ads, it ceases to be a prosthesis and becomes an environmental filter acting *upon* the mind, not *as* the mind.

  **Auditing the Fungal Network Analogy**
  Here, you are the plant, the algorithm is the mycorrhizal fungus, and information is nutrients. In biology, this relationship is co-evolutionary and generally mutualistic; the fungus gets sugar, the plant gets phosphorus, and the chemical signals exchanged are honest indicators of need and availability. The breakdown here is the alignment of interests. Algorithmic systems often operate as parasitic or extractive systems rather than symbiotic ones. They extract attention and data (nutrients) but may return "toxic" information (misinformation, polarization) if that maximizes retention. Additionally, a plant can chemically sever ties with a non-beneficial fungus. Users face immense friction (network effects, addiction design) in severing ties with platforms. The feedback loop is also distorted: the fungus signals soil chemistry; the algorithm signals "what keeps you online." The analogy smuggles in the assumption of biological honesty—that the external partner signals truthfully about the environment.

  **Smuggled Assumptions**
  Both analogies rely on hidden premises that fail in the context of the attention economy. First, they assume **goal alignment**: that the tool's optimization function matches the user's cognitive well-being. Second, they assume **transparency of operation**: that the user can, in principle, understand how the tool transforms input to output. Third, they assume **revocability**: that the user can disconnect the tool without catastrophic cognitive loss. Opaque algorithms fail all three. They optimize for platform retention, operate as black boxes, and are designed to be difficult to quit.

  **Conclusion and Verdict**
  Neither analogy successfully supports the claim that an opaque recommendation algorithm is part of your mind. They describe *integration*, but they fail to account for *adversarial mediation*. A better analogy is **"The Semi-Autonomous Subcontractor."** You hire them to sort your mail (information), but they open the envelopes, read the contents, decide which ones you see based on what keeps you employed, and sell data about your reading habits to third parties. They are coupled to your workflow, but they are not *you*.

  Consequently, the skull-bound view survives, not as a physical boundary, but as a **boundary of agency**. If a process operates outside your control and potentially against your interests, it belongs to the environment acting upon you, not to the cognitive system constituting you. The mind may extend, but it does not extend into systems that lie to it.

