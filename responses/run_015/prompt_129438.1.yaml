  1.  **"Editors" (Line 12):** Personifying neural processes as "editors" risks reintroducing a homunculus (a little man inside the head doing the editing). Dennett uses this metaphor cautiously to describe competitive neural activation, not literal agents. I relied on the metaphor for poetic clarity, assuming the reader understands "editors" as shorthand for parallel processing mechanisms.
  2.  **"Qualia" (Line 5):** Dennett is famously an illusionist regarding qualia (he argues they don't exist as traditionally defined). Using the word "qualia" in the Theater section (Lines 1–8) is accurate to the *myth* I am building, but a hardline Dennett scholar might prefer I avoid the term entirely. I kept it to signal the traditional view being critiqued.
  3.  **The Volta Placement:** A standard Shakespearean sonnet typically reserves the major turn for the couplet (line 13). By forcing the volta at line 9 (Petrarchan style) within a Shakespearean structure (12 lines + couplet), I intentionally "broke" the sonnet form to mirror the breaking of the Cartesian model. This formal disruption aligns with your request for form to work with content, though it deviates from strict sonnet conventions.
