answer: |-
  There is no single, settled noun phrase in the literature (akin to 'The Gettier Problem') that canonically names this specific shape of case. However, the phenomenon you describe is widely recognised as the primary pressure point against the **Independence Principle**, which underpins standard conciliationist views (most notably associated with David Christensen and Adam Elga).

  In the literature, this is usually discussed not as a distinct *type* of disagreement with its own label, but as the **"Question-Begging Objection"** to conciliationism. The worry is that if you must assess a peer's reliability independently of the reasoning under dispute, you cannot learn from a peer who has specifically critiqued that reasoning.

  Since you asked for a carving rather than just a label, and given that there is no orthodox term for the *phenomenon* itself (only for the *problem* it poses), I suggest you distinguish between **Parallel Disagreement** (the standard model) and **Incorporative Disagreement** (your case). Below is the breakdown of how to teach this, mapping the concepts, the live disputes, and the boundary cases.

  ### 1. The Carving: Parallel vs. Incorporative

  The standard model of peer disagreement (the 'thermometer model') assumes **Parallel Disagreement**.
  *   **Structure:** You and I both look at the world (or a shared body of evidence $E$) separately. We form beliefs $B_1$ and $B_2$.
  *   **Epistemic Force:** The disagreement itself is higher-order evidence that one of us has malfunctioned.
  *   **Independence:** Our verdicts are causally and epistemically independent *conditional on the evidence*.

  Your case describes **Incorporative Disagreement**.
  *   **Structure:** I look at the world ($E$) and argue for $P$. You look at $E$ *plus* my argument ($A_P$). You form $\neg P$.
  *   **Epistemic Force:** Your verdict is not just a signal of malfunction; it is a *result* of processing my reasoning.
  *   **The Tension:**
      1.  **Deflationary Force:** Because you have 'absorbed' my evidence and argument, your disagreement suggests my first-order case is insufficient to compel assent even when fully understood. This is strong evidence against $P$.
      2.  **Independence Failure:** Because your verdict is a response to my reasoning, I cannot use the fact of your disagreement to undermine my reasoning without begging the question (i.e., assuming my reasoning is sound to dismiss your critique of it).

  **The Label:** If you need a term for the seminar, coin **"Incorporative Disagreement"**. It signals that the dissenting verdict has *incorporated* the proponent's first-order case.

  ### 2. Nearby Notions: What It Is and Isn't

  You mentioned the Independence Condition and Higher-Order Evidence (HOE). Here is how your case carves against them.

  *   **It is a stress test for the Independence Principle:**
      *   *The Principle:* To assess the epistemic significance of a peer's disagreement, I must do so independently of the reasoning under dispute (Christensen 2011).
      *   *The Clash:* In Incorporative Disagreement, I *cannot* assess the peer's verdict independently of the reasoning, because the verdict is *about* the reasoning. If I follow the Independence Principle strictly, I must discount your colleague's verdict, which seems absurd (she is the ideal critic). If I don't, I risk begging the question.
      *   *Status:* This is a **live dispute**. Conciliationists (Christensen) try to tweak the principle to allow for 'critical engagement'; Total Evidence View proponents (Thomas Kelly) argue the Independence Principle is false from the start and we should just weigh all available evidence (including the fact that a smart person rejected my argument).

  *   **It is a species of Higher-Order Evidence, but non-standard:**
      *   *Standard HOE:* "I am tired," or "My peer disagrees." This suggests I might be wrong, without saying *why*.
      *   *Incorporative HOE:* "My peer disagrees *because* premise 3 is false." This is first-order evidence masquerading as higher-order evidence.
      *   *Status:* **Settled** that this is distinct from pure HOE. The literature agrees that when disagreement conveys *reasons* (argumentative disagreement), it functions differently than bare disagreement (statistical disagreement).

  ### 3. Case 2: The Small Subfield (Networked Disagreement)

  Your second case (everyone has read everyone) is distinct, though it shares the 'non-independence' symptom. This is best understood through **Network Epistemology** (e.g., Kevin Zollman, Simon Huttegger).

  *   **The Phenomenon:** **Correlated Evidence** or **Source Dependence**.
  *   **The Difference:** In Case 1 (Incorporative), the *content* of the reasoning is absorbed. In Case 2 (Networked), the *sources* of evidence are common.
  *   **Why headcount still matters:** Even if we all read the same papers, we weigh them differently. A rising headcount of opponents suggests that the *shared* evidence supports $\neg P$ more strongly than you thought, or that there is a systematic bias in your weighting.
  *   **The Carving:** Distinguish **Content Incorporation** (Case 1) from **Source Correlation** (Case 2).
      *   In Case 1, the peer acts as a **Referee** (evaluating your specific proof).
      *   In Case 2, the peers act as a **Jury** (evaluating a common body of exhibits).
      *   *Epistemic Upshot:* A Referee's 'no' is stronger evidence against the *validity* of your argument. A Jury's 'no' is stronger evidence against the *truth* of the conclusion given the common ground.

  ### 4. Boundary Cases: When does Incorporative Disagreement move you?

  For your seminar, you need to know when an Incorporative Disagreement compels revision. The literature suggests the following boundaries:

  1.  **The 'Flaw-Finding' Boundary (Moves you):**
      *   If the peer's $\neg P$ is accompanied by a specific identification of a fallacy or gap in your argument ($A_P$), this is no longer mere disagreement; it is **counter-argument**.
      *   *Status:* **Settled.** You should move. This is first-order engagement, not just social epistemology.
  2.  **The 'Brute Weighting' Boundary (Does not move you, or moves you less):**
      *   If the peer accepts all your premises and logic but says, "I just weigh the risks differently," or "My intuition on this axiom differs," the epistemic force drops.
      *   *Why:* Here, the incorporation is incomplete. They have not found a flaw in your machinery; they are running different software.
      *   *Status:* **Live Dispute.** Conciliationists say you must still split the difference (your priors vs. theirs). Steadfasters (Kelly, Sosa) say you can privilege your own weighting if you have no independent reason to think theirs is better.
  3.  **The 'Expertise' Boundary:**
      *   If the peer is a specialist in the *type* of error you might have made (e.g., a logician reviewing a proof, a statistician reviewing a model), Incorporative Disagreement carries near-decisive weight.
      *   *Why:* Their verdict screens off your own assessment of the reasoning.

  ### 5. Summary of Settled vs. Live Disputes

  To ensure you do not teach a contested view as orthodoxy, use this map:

  *   **Settled:**
      *   Standard 'Equal Weight' models (simple conciliationism) struggle with Incorporative Disagreement.
      *   Disagreement that conveys specific reasons (argumentation) is epistemically distinct from bare disagreement (peer pressure).
      *   Case 2 (Networked) involves correlated evidence, which reduces the informational value of each additional dissenting vote compared to independent sampling.

  *   **Live Disputes:**
      *   **The Independence Principle:** Is it a necessary constraint on reasoning (Christensen), or does it prevent legitimate learning from critics (Kelly)? *Teach this as the central tension.*
      *   **The Total Evidence View:** Kelly argues we should ignore the 'peer' label and just ask: "Given that she saw my evidence and still disagrees, what is the rational credence?" This dissolves the paradox but makes the 'peer' concept less work.
      *   **Steadfastness:** Is it ever rational to maintain $P$ when a peer who understands your argument rejects it? (Yes, say Steadfasters, if you rationally trust your own grasp of the argument more than your estimate of her reliability).

  ### Recommendation for the Seminar

  Use the term **"Incorporative Disagreement"** to label Case 1. It is precise, descriptive, and not currently burdened by conflicting definitions.

  Contrast it explicitly with the **"Thermometer Model"** (Parallel Disagreement).
  *   *Thermometer:* Two devices measuring the same temperature. If they differ, one is broken. We don't know which. Split the difference.
  *   *Incorporative:* One device measuring the temperature, the other measuring the *first device's calibration*. If the second says the first is wrong, it is not a tie. It is a critique.

  This carving allows you to explain why the arithmetic feels different: in the Thermometer Model, the disagreement is *symmetric* evidence of error. In Incorporative Disagreement, the evidence is *asymmetric*; the dissenter has a superset of the proponent's information (the argument itself).

  Cheers.
