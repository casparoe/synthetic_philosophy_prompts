answer: |-
  Dear Colleague,

  It is a pleasure to encounter a query so precisely framed. You have identified a genuine gap in the taxonomy of epistemic vice, and your intuition that the standard neighbours (Lakatos, Popper, equivocation) do not quite capture the geometry of the problem is correct. They describe *structural* adjustments or *argumentative* tactics; you are describing a *diachronic semantic drift* that occurs under the cover of *phenomenological stability*.

  Given your background in measurement, you will appreciate that you are actually describing a psychometric problem applied to doxastic states. In measurement theory, when the latent construct being measured changes over time while the indicator (the survey question, the test item) remains the same, we call this **construct drift** or **validity drift**. Your conspiracist is maintaining the indicator ('They are hiding the study') while the construct (which study, what 'hiding' entails, what would count as evidence) is drifting to maintain the correlation with their commitment.

  However, in the philosophical literature on belief and conspiracy theories, there is no single, canonical term for this specific mechanism. The closest you will find is in the work of Maarten Boudry and colleagues on **'conspiracist immunisation'**, but as you noted, that usually implies the addition of auxiliary hypotheses (a Lakatosian protective belt) rather than the silent migration of the core proposition's content.

  Since you have asked for a coinage if none exists, I propose we call this **Cryptic Doxastic Drift**.

  Below is a definition, a demarcation from its neighbours, and an analysis of your boundary cases.

  ### 1. Definition: Cryptic Doxastic Drift

  **Cryptic Doxastic Drift** occurs when a subject $S$ maintains token-identity of a belief ascription $B(p)$ over time $t_1$ to $t_n$, whilst the truth conditions of $p$ shift significantly, without $S$ registering this shift as a revision of belief.

  It requires four conditions:
  1.  **Surface Stability:** The linguistic formulation of the belief remains constant (e.g., 'The moon landing was faked').
  2.  **Content Instability:** The proposition expressed by that formulation changes its intension or extension over time (e.g., the specific evidence required to substantiate 'faked' changes).
  3.  **Phenomenological Constancy:** The subject experiences the belief as the *same* belief held continuously; there is no subjective experience of updating or revising.
  4.  **Non-Deliberateness:** The shift is not a conscious rhetorical strategy (distinguishing it from sophistry or lying).

  ### 2. Boundaries and Neighbours

  To ensure this term does the work you need in your seminar, we must mark its boundaries against the concepts you rightly dismissed.

  *   **Vs. Lakatosian Protective Belts:** In Lakatos's methodology of scientific research programmes, the 'hard core' is protected by adjusting auxiliary hypotheses in the 'protective belt'. In Cryptic Doxastic Drift, there is no addition of auxiliaries. The subject does not say, 'The study exists, but was suppressed *and* the authors were bribed.' They say, 'The study exists,' but the *meaning* of 'the study' has changed from 'the 1998 Smith paper' to 'some paper somewhere'. It is a shift in *reference*, not an expansion of *theory*.
  *   **Vs. Equivocation:** Equivocation is a fallacy committed *in an argument*, usually between two interlocutors. Cryptic Doxastic Drift is a diachronic, psychological state. The subject is not trying to trick you; they are tricking themselves. The ambiguity is not exploited; it is inhabited.
  *   **Vs. Moving the Goalposts:** This is typically a tactical response to a specific counter-argument in a debate. Drift is slower, often occurring over years without a specific interlocutor prompting it. It is a background process of belief maintenance, not a foreground move in a dialectic.
  *   **Vs. Ordinary Opinion Change:** If I believe 'Labour will win the election' in January and 'The Conservatives will win' in October, I have changed my mind. I acknowledge the revision. In Drift, I say 'Labour will win' in January and 'Labour will win' in October, but the conditions for 'winning' have shifted from 'majority of seats' to 'majority of the popular vote', and I insist I never changed my position.

  ### 3. Testing the Boundary Cases

  You asked for three specific tests. Here is how Cryptic Doxastic Drift applies:

  **Case A: The Teenager and the Band**
  *Scenario:* A teenager claims to be 'into' a band for a decade, but their taste evolves from the early punk albums to the later orchestral work, ignoring the shift.
  *Verdict:* **Not Drift.** This is a change in *preference* or *affective attitude*, not a propositional belief with truth conditions. 'I like Band X' is an expression of taste. Unless the teenager is making a factual claim about the band's genre ('They are a punk band') which drifts to accommodate orchestral work, there is no doxastic content to drift. This is **Identity Narrative Construction**, not epistemic drift.

  **Case B: The Political Party**
  *Scenario:* A party keeps its name and slogans but reverses its policies over twenty years.
  *Verdict:* **Not Drift (usually).** This is typically **Strategic Rebranding**. The key differentiator is *agency*. In Cryptic Doxastic Drift, the subject is unaware of the shift. In politics, the manifesto committee is usually aware. However, if the *membership* sincerely believes the party is 'still the same' while the policy content shifts without their awareness, the *membership* is experiencing Cryptic Doxastic Drift regarding the proposition 'This party represents X'.

  **Case C: You and Your Friend**
  *Scenario:* You argue about the moon landing. In year one, he means 'fake photos'. In year ten, he means 'subtle fakery'.
  *Verdict:* **Verbal Dispute.** This is the crucial epistemological implication. By year ten, you are not disagreeing about the world; you are disagreeing about the *use of the word 'fake'*. As David Chalmers might frame it, this is a **metalinguistic negotiation**. You are assessing proposition $p_1$ (photos are doctored); he is assessing $p_{10}$ (the *vibe* of the mission was inauthentic). There is no single proposition you are both assessing. The disagreement is merely verbal, sustained by the surface stability of the sentence 'The moon landing was faked.'

  ### 4. Why This Matters for Your Seminar

  The reason this phenomenon is so resistant to standard counter-argument is that you are treating it as a clash of evidence, whilst your interlocutor is treating it as a maintenance of identity.

  For the conspiracist, the sentence 'They are hiding the truth' is not merely a description of the world; it is a **doxastic anchor**. To admit the content has shifted is to admit the anchor has lifted. Cryptic Doxastic Drift allows them to keep the anchor down while the ship moves.

  In your seminar, I would suggest you draw heavily on your own expertise in measurement. Frame the conspiracy belief as a **measurement instrument** that has lost **validity**. The indicator ('The study is suppressed') no longer measures the construct ('There is a cover-up') reliably, because the construct has become vague enough to capture anything.

  ### 5. Summary for the Syllabus

  If you wish to put this on the reading list, I suggest the following formulation:

  > **Concept:** Cryptic Doxastic Drift
  > **Definition:** The unconscious shift in the truth conditions of a belief over time, masked by the stability of the linguistic ascription.
  > **Distinction:** Distinct from *immunisation* (which adds hypotheses) and *equivocation* (which is deliberate).
  > **Key Feature:** The subject sincerely denies any change of mind.
  > **Implication:** Renders the belief immune to falsification not by structure, but by semantic instability.

  It is a pleasure to see a philosopher of measurement turning their gaze upon the metrics of belief itself. I suspect you will find that 'measurement' is not as far from 'conspiracy' as you thought; both are deeply concerned with how we fix reference in a slippery world.

  Yours,

  A Fellow Traveller
