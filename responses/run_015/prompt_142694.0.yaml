  DIAGNOSTIC TREE: COMMITMENTS ON CONSCIOUS EXPERIENCE
  Start: Ordinary talk about "how things seem" is not nonsense.

  1. THE INTROSPECTIVE ILLUSION CASE
     When you attend to a pain, it seems to be a simple, intrinsic property. If a complete physical account showed no such simple properties exist, only complex dispositions, is your introspection *false*?
     |
     +-- YES --> [ILLUSIONISM]
     |           Commitment: There is no "what it's like" in reality, only a user-illusion generated by cognitive processing.
     |           Awkwardness: Must explain why the illusion itself doesn't constitute a form of experience.
     |
     +-- NO --> 2. THE CHASE-AND-SANBORN CASE
                 Two tasters have identical discrimination, memory, and report profiles regarding coffee over a lifetime. Is it coherent to say their *experiences* differ anyway?
                 |
                 +-- NO --> [DENNETT-STYLE RELATIONALISM]
                 |          Commitment: Experience is exhaustively defined by dispositional roles in memory, discrimination, and report.
                 |          Awkwardness: Must deny the intuitive possibility that two functionally identical states could feel different.
                 |
                 +-- YES --> 3. THE EXPLANATORY GAP CASE
                             Does positing "experience" explain behavior or learning better than positing "functional state" alone?
                             |
                             +-- NO --> [QUIETISM / DEFLATIONISM]
                             |          Commitment: Disagreements about experience are verbal disputes over concepts, not facts about the world.
                             |          Awkwardness: Risks making the entire field of phenomenology a linguistic confusion.
                             |
                             +-- YES --> 4. THE KNOWLEDGE CASE (MARY'S ROOM)
                                         A scientist knows all physical facts but has never seen red. Does she learn a *new fact* upon seeing red?
                                         |
                                         +-- NO --> 5. THE ABSENT QUALIA CASE
                                         |          A functional duplicate of you (same inputs/outputs/processing) has no experience at all. Is this possible?
                                         |          |
                                         |          +-- NO --> 6. THE INTRINSIC NATURE CASE
                                         |          |          Is experience the *intrinsic nature* of the physical structure that physics describes only relationally?
                                         |          |          |
                                         |          |          +-- YES --> [RUSSELLIAN MONISM]
                                         |          |          |          Commitment: Phenomenal properties are the intrinsic grounds of physical structure.
                                         |          |          |          Awkwardness: Must explain how intrinsic natures causally interact without overdetermination.
                                         |          |          |
                                         |          |          +-- NO --> [TYPE-B PHYSICALISM]
                                         |          |                     Commitment: Experience is physically necessitated but conceptually distinct from function.
                                         |          |                     Awkwardness: Must accept brute necessitation links that are opaque to understanding.
                                         |          |
                                         |          +-- YES --> 7. THE SORITICAL INVERSION CASE
                                         |                     A subject undergoes 1000 micro-steps of spectral shift, each indiscriminable from the last. Does a change in experience occur at some specific step?
                                         |                     |
                                         |                     +-- NO --> [QUIETISM / DEFLATIONISM] (See Node 3)
                                         |                     |
                                         |                     +-- YES --> 8. THE PROPERTY/RELATION SWAP CASE
                                         |                                The "red" property is held fixed in itself, but its relations to memory/report are swapped to match "green". Is the experience still red?
                                         |                                |
                                         |                                +-- NO --> [FUNCTIONAL ROLE REALISM]
                                         |                                |          Commitment: Real experiences exist, but they are individuated by their causal roles, not intrinsic qualities.
                                         |                                |          Awkwardness: Collapses into Relationalism if roles are exhaustive, but insists on reality of the posit.
                                         |                                |
                                         |                                +-- YES --> 9. THE DISAGREEMENT CASE
                                         |                                           Two subjects have identical experiences but disagree exhaustively and permanently about what they are like. Is this possible?
                                         |                                           |
                                         |                                           +-- YES --> [PHENOMENAL INTERPRETIVISM]
                                         |                                           |          Commitment: Experience is real and intrinsic, but our access to it is interpretive and fallible.
                                         |                                           |          Awkwardness: Undermines the authority of first-person reports that motivated realism.
                                         |                                           |
                                         |                                           +-- NO --> 10. THE MODAL ASYMMETRY CASE
                                         |                                                      If Absent Qualia are possible (Node 5), are Inverted Qualia (functional same, experience swapped) *also* possible?
                                         |                                                      |
                                         |                                                      +-- YES --> [PRIMITIVIST REALISM]
                                         |                                                      |          Commitment: Experiences are intrinsic, private, ineffable properties that supervene on the physical.
                                         |                                                      |          Awkwardness: Must accept epiphenomenalism or nomological danglers to preserve causal closure.
                                         |                                                      |
                                         |                                                      +-- NO --> [ASYMMETRIC DUALISM]
                                         |                                                                 Commitment: Zombies are possible, but spectral inversion is not (or vice versa).
                                         |                                                                 Awkwardness: Requires a principled reason why one modal separation holds but the other fails.

  ***

  **I. UNSEPARATED LEAVES**
  The tree does not genuinely separate **Quietism/Deflationism** (Node 3) from **Phenomenal Vagueness** (Node 7, No branch). Both end up at the same leaf because denying explanatory work and denying sharp boundaries in sorites cases often converge on the view that there is "no fact of the matter" to dispute. The distinction is rhetorical: Quietists think the *concept* is flawed, while Vagueness theorists think the *phenomenon* is fuzzy. The tree collapses them to save leaf space, but a group might split here based on whether they blame language or the world.

  **II. UNOCCUPIED SPACE**
  The logical space permits a combination where one answers **YES** to Absent Qualia (Node 5) but **NO** to the Knowledge Case (Node 4). This would be a view that admits zombies are possible but denies Mary learns a new fact. This position is largely unoccupied because it is unstable: if zombies are possible, experience is not physically necessitated, which usually implies Mary gains new information about the non-physical facts. It is diagnosed as **incoherent** for most realists, though some fictionalists might occupy it.

  **III. THE TREE'S WEAKEST POINT**
  The single branch I expect the profession to be most evenly split on is **Node 8 (The Property/Relation Swap Case)**. The phrasing presupposes that a property can be "held fixed in itself" while relations change, which begs the question against functionalists who think properties *are* relations. This node does argumentative work by forcing a choice between intrinsic and extrinsic individuation that some (e.g., aspectualists) would reject. I would redraw the tree if a compelling case were made that **phenomenal properties are essentially aspectual**, meaning they cannot be swapped from their mode of presentation without ceasing to be that experience. This would render Node 8 a false dichotomy and require a new branch distinguishing *mode* from *content*.
