answer: |-
  Your intuitions are remarkably consistent with a growing middle ground in contemporary moral psychology that seeks to rescue virtue ethics from the situationist critique without retreating into the untenable "global trait" model of the past. You are effectively describing a **fragmented, ecologically embedded, and narratively sensitive** account of character.

  There is indeed a coherent principle that can accommodate all six judgments without forcing you to abandon any. I propose calling this principle **Extended Narrative Localism**.

  ### The Principle: Extended Narrative Localism

  This account rests on three pillars that unify your verdicts:

  1.  **Local Stability (The Domain Constraint):** Virtues are not global properties of a person but stable dispositions relative to a specific *normative ecology* (a practice, institution, or social context). This addresses Maria, David, and Chen.
  2.  **Constitutive Framing (The Extended Mind Constraint):** The stability of the disposition can be sustained by external scaffolding (roles, rules, environments). The virtue is a property of the *agent-in-context*, not just the agent. This addresses the Fairness Monitor.
  3.  **Non-Alienation (The Narrative Constraint):** For a pattern of behavior to count as a virtue rather than a mere habit or accident, the agent must not be alienated from the normative source of the action. They must either explicitly endorse it (narrative) or implicitly accept it as "theirs" (non-alienated local stability). This addresses Leo and the Pair.

  ### Mapping Your Judgments to the Principle

  1.  **Maria (Accounting vs. Social):** She exhibits **Local Stability**. Her honesty is robust within the normative ecology of accounting (where truth-telling is structurally reinforced and internally valued by her professional identity). Her social exaggeration occurs in a different ecology with different norms. She does not lack the virtue; she lacks *global* honesty, which your principle correctly identifies as unnecessary.
  2.  **David (Physical vs. Institutional):** This is another case of **Local Stability**. Physical emergency and organizational ethics are distinct normative ecologies requiring different risk-calculations. Possessing the disposition in one does not entail the other. Your resistance to collapsing them is preserved.
  3.  **Fairness Monitor (Role-Dependence):** This satisfies **Constitutive Framing**. The role provides the normative scaffolding that stabilizes the disposition. Crucially, while in the role, the participant typically adopts the identity of "monitor" (temporary non-alienation). The virtue exists as a coupling between the agent and the institutional frame. It is real but contingent on the frame.
  4.  **Professor Chen (Scholarship vs. Governance):** Like Maria and David, this is **Local Stability**. However, your worry about "integration" is key. Under Extended Narrative Localism, a *flourishing* character aims for integration across domains, but the *existence* of a virtue does not require it. She possesses intellectual humility in the epistemic domain; the administrative domain is a separate locus of evaluation.
  5.  **Leo (Indiscriminate Lying):** Leo fails **Local Stability** (no domain shows consistency) and likely fails **Non-Alienation** (indiscriminate lying suggests a lack of commitment to truth in any ecology). He lacks the virtue globally because he lacks it locally everywhere.
  6.  **The Pair (Narrative vs. Accident):** This satisfies **Non-Alienation**. Behaviorally, they are identical. But the "Accident" agent is *alienated* from their own helping behavior; they view it as external causation ("situational accidents"). The "Narrator" integrates the behavior into their agency ("trying to be kind"). Virtue requires ownership of the disposition, not just the output.

  ### Application to the Test Case: Virtual Compassion

  **The Case:** An individual displays consistent compassion only within an immersive virtual environment (caring for digital entities) but shows no comparable behavior in physical-world interactions.

  **Verdict under Extended Narrative Localism:**
  This individual **possesses the virtue of compassion within the virtual domain**, but lacks it in the physical domain.

  **Reasoning:**
  1.  **Local Stability:** The behavior is consistent within the virtual ecology.
  2.  **Constitutive Framing:** The virtual environment provides the normative scaffolding (the digital entities respond to care, the system rewards/punishes certain interactions, the immersion creates a sense of presence). The virtue is constituted by the agent's coupling with this digital environment.
  3.  **Non-Alienation:** Assuming the individual identifies as a "caretaker" within the game/simulation and does not view their digital kindness as a mere glitch or accident, they meet the narrative constraint.

  **Implication:**
  This verdict may feel uncomfortable because we often think virtues must track *real* moral patients. However, your framework suggests that virtues are primarily about the *agent's reliable responsiveness to normative demands within a context*. If the virtual context generates genuine normative demands (e.g., "do not torture this digital being"), responding to them reliably is a form of virtue. It is a *domain-specific virtue*. It does not generalize to the physical world, just as Maria's honesty does not generalize to her social life.

  ### The Critical Tension: Where the Theory Could Break

  While Extended Narrative Localism saves all six judgments, there is a friction point between **Judgment 3 (Monitor)** and **Judgment 6 (The Pair)** that you must monitor closely.

  *   **Judgment 3** leans Situationist: The external frame *constitutes* the virtue.
  *   **Judgment 6** leans Internalist: The internal narrative *constitutes* the virtue.

  **The Conflict:** What if the "Fairness Monitor" enforces fairness consistently but explicitly *rejects* the role internally (thinking, "I only do this because I'm paid, I don't care about fairness")?
  *   If you follow **Judgment 3**, they still have the virtue (temporarily), because the frame constitutes it.
  *   If you follow **Judgment 6**, they lack the virtue, because they are alienated from the action (like the "Accident" helper).

  **Resolution:** To maintain coherence, you must refine the **Non-Alienation** condition. It does not require deep *personal* endorsement (as in the Pair), but it does require *role-identification*. While wearing the badge, the Monitor must act *as* a Monitor. If they act *merely as a paid contractor* while monitoring, they are displaying compliance, not the virtue of fairness. Your intuition in Case 3 suggests they *do* adopt the role's norms while in it. As long as the external frame successfully recruits the agent's self-conception temporarily, Case 3 and Case 6 remain compatible.

  ### If You Must Drop One Verdict

  If future reflection forces you to abandon one intuition to preserve theoretical parsimony, **you should drop or weaken Judgment 3 (The Fairness Monitor).**

  **Why?**
  Judgment 3 claims that an external role *constitutes* a virtue. This is the most vulnerable point to the Situationist critique. If the virtue vanishes the moment the badge is removed, it looks less like a character trait and more like a behavioral response to incentives.
  *   **If you drop Case 3:** You move closer to a traditional (but local) Virtue Ethics. You assert that virtues must be robust enough to survive the removal of the specific institutional frame, or at least require a deeper internalization than temporary role-playing allows.
  *   **Implication:** This implies Situationism is *partially* right (context matters immensely) but wrong to deny character altogether. Character is the *capacity to internalize* normative frames across time, not just the momentary alignment with them.

  **However,** keeping Judgment 3 (as your current view does) offers a more pragmatic and psychologically realistic model. It acknowledges that much of our "goodness" is scaffolded by our environments.

  ### Conclusion for Your Seminar

  Your position is not a confused middle ground; it is a sophisticated **Ecological Virtue Ethics**.

  1.  **Against Globalism:** You reject the idea that virtues are cross-situational constants (Maria, David, Chen).
  2.  **Against Hard Situationism:** You reject the idea that character is an illusion, insisting on the moral relevance of narrative ownership and local stability (The Pair, Leo).
  3.  **The Synthesis:** You treat virtues as **relational properties** emerging from the interaction of agent, narrative, and environment.

  **Final Advice:** When presenting this, frame the "Virtual Compassion" case carefully. Acknowledge that while the agent possesses *virtual compassion*, we might value *physical compassion* more highly because the *stakes* of the domain are higher. This allows you to maintain that virtues are domain-relative without falling into moral relativism. The *structure* of the virtue is the same (local stability + non-alienation), but the *value* of the virtue depends on the moral weight of the domain.

  This preserves all six of your judgments while offering a robust defense against both dogmatic Aristotelians and eliminative Situationists.
