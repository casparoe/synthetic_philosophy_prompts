answer: |-
  # Taxonomy of Responses to Moral Demandingness

  **Root Node:** Does a correct moral system ever obligate a person to incur a heavy personal loss (e.g., significant wealth, career, or safety) to benefit strangers?

  *   **Branch A: No.**
      *   **Terminal:** Morality is bounded by reasonable self-interest; agents are permitted to prioritize their own welfare once a baseline of decency is met. (Common-Sense Morality)

  *   **Branch B: Yes.**
      *   **Node 1:** Granting that heavy sacrifices are sometimes required, what is the primary source of the intuition that act-consequentialism is *too* demanding?
          *   **Branch B.1:** The specific amount of loss required is simply too painful to endure. (Cost-Based Objection)
          *   **Branch B.2:** The rule implies one must never stop improving the world, leaving no completion point for moral duty. (Structure-Based Objection)
          *   **Branch B.3:** The rule forces one to neglect family, friends, and personal hobbies that give life meaning. (Prerogative-Based Objection)

              *   **Node 2 (For B.1, B.2, and B.3):** How should the conflict between this moral theory and our intuitions be resolved?
                  *   **Branch B.x.i:** Adjust the theory to allow for stopping points or to rank actions as "better" without making them strictly obligatory.
                      *   **Terminal (From B.1/B.2):** **Scalar Evaluation View.** Actions are ordered by goodness, but there is no sharp line between obligatory and optional; agents are not blameworthy for failing to maximize.
                      *   **Terminal (From B.3):** **Agent-Centered Prerogative View.** The theory is modified to permit agents to assign extra weight to their own projects and relationships, even when doing so does not maximize the overall good.
                  *   **Branch B.x.ii:** Shift the primary duty from isolated individuals to collective bodies or political institutions.
                      *   **Terminal (From B.1/B.2/B.3):** **Institutional Division View.** Individuals are only required to support and comply with just institutions; the requirement to maximize good applies to the collective structure, not the private actor.
                  *   **Branch B.x.iii:** Maintain the strict individual duty and argue that our resisting intuitions are mistaken or biased.
                      *   **Terminal (From B.1/B.2):** **Cognitive Calibration View.** The intuition that morality is too demanding is an evolutionary artifact; our moral cognition is calibrated for small-group cooperation rather than global impartiality, and must be updated.
                      *   **Terminal (From B.3):** **Radical Impartiality View.** *(Rare/Unoccupied)* The theory correctly requires sacrificing personal projects for the greater good, and our attachment to those projects is a form of bias that should be overcome.
                          *   **Diagnosis:** **Unattractive.** This position is rarely defended because it requires agents to view their deepest personal commitments (love, art, friendship) as moral errors to be eradicated, leading to a conception of agency that is psychologically unsustainable and alienating.

  ***

  ### Structural Notes on the Taxonomy

  1.  **Node Phrasing:** All splits are defined by the content of the claim (e.g., "specific amount of loss," "never stop improving") rather than by technical labels (e.g., "marginal utility," "maximization principle").
  2.  **Leaf Coverage:**
      *   The **Scalar Evaluation View** addresses the Structure/Cost objection by removing the binary obligation.
      *   The **Agent-Centered Prerogative View** addresses the Prerogative objection by building a loophole into the theory.
      *   The **Institutional Division View** addresses all three diagnoses by relocating the burden.
      *   The **Cognitive Calibration View** addresses Cost/Structure by blaming the observer's psychology.
      *   The **Radical Impartiality View** addresses the Prerogative objection by blaming the observer's psychology (specifically regarding relationships).
  3.  **The Unoccupied Leaf:** The combination of accepting the Prerogative-Based Objection (admitting the theory destroys personal projects) while choosing the Accept/Revise Remedy (insisting we do it anyway) is logically possible but philosophically sparse. It lacks the comfort of the Prerogative View (which saves projects) and the empirical deflection of the Cognitive Calibration View (which usually targets cost intuitions). It demands a level of self-abnegation that most theorists find renders the moral life unintelligible.
