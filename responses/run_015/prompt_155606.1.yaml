answer: |-
  # Teaching Plan: Observer-Selection Effects in Ecological Inference
  **Session Duration:** 90 Minutes
  **Target Audience:** Retired Natural Scientists (Frequentist Intuitions)
  **Topic:** SSA vs. SIA via the Presumptuous Philosopher

  ## I. Ground Rules and Excluded Apparatus
  *To be stated explicitly at the outset (5 minutes).*

  **Statement of Refusal:**
  "This session will not derive the formal SIA weighting factor ($P(H) \propto N_{observers}$), nor will we engage with the Simulation Argument, the Doomsday Argument, or decision-theoretic utilities (e.g., 'moral obligations to populate'). We are treating this strictly as a problem of **likelihood functions** and **sampling frames**. We are not calculating *what we should do*; we are calculating *what we should believe* given that we are the data point."

  **Constraint:**
  "No external readings or citations will be used. All logic must be derivable from the scenario provided in the room."

  ---

  ## II. Conceptual Dependency Order
  *The logical sequence in which concepts must be laid. Do not proceed to the next layer until the previous one is accepted as a working definition for the session.*

  1.  **The Sampling Frame Definition:** Establish that standard frequentist inference requires a defined population from which a sample is drawn.
  2.  **The Indexical Fact:** Introduce the data point not as a measurement of the world, but as a measurement of the observer's *location* within the sampling frame (i.e., "I am here").
  3.  **The Competing Hypotheses (Physical Priors):** Define two theories about the world that differ *only* in the total number of observers they entail, holding physical evidence constant.
  4.  **The Self-Sampling Assumption (SSA):** Define the reference class as "actually existing observers." (Likelihood is independent of total N).
  5.  **The Self-Indication Assumption (SIA):** Define the reference class as "possible observers." (Likelihood is proportional to total N).
  6.  **The Presumptuous Inference:** Demonstrate how SIA allows an observer to reject a physical theory solely because it predicts fewer observers, without new physical data.
  7.  **The Absurdity Check:** Reveal why this inference violates scientific intuition regarding theory verification.

  ---

  ## III. The Carrying Scenario: "The Silent Archive"
  *This scenario must bear the full weight of the distinction. It is to be introduced at Step 3 and referenced throughout.*

  **The Setup:**
  You are a retired auditor called to a remote government field station to verify a biodiversity census. You enter a secure archive room. The door locks behind you. You are alone. On the desk is a **Project Mandate**.

  **The Physical Evidence:**
  There are no windows. The communications are down. You have not yet counted the files in the room. The only data you have is your own presence: **You are the auditor holding the Mandate.**

  **The Competing Hypotheses (from the Mandate):**
  *   **Hypothesis Small ($H_S$):** This is a Pilot Station. The protocol mandates **100** total auditors employed globally over the project's life.
  *   **Hypothesis Large ($H_L$):** This is a Global Station. The protocol mandates **1,000,000** total auditors employed globally over the project's life.

  **The Critical Omission:**
  You do not know *which* auditor you are (e.g., #1 or #1,000,000). You only know you are *an* auditor. The files in the room are unrecorded; you cannot count them to verify the hypothesis directly. You must infer the Mandate type solely from the fact of your employment.

  **Why this scenario works:**
  1.  **Ecological/Professional Context:** Uses "auditors" and "protocols" rather than "humans" and "universes," reducing existential defensiveness.
  2.  **Isolates the Variable:** The only difference between $H_S$ and $H_L$ is the number of observers (auditors).
  3.  **Removes Verification:** By making the files unrecorded, it prevents the "more observers = more data" argument. You cannot count the sheets yet.
  4.  **Forces Self-Location:** The only data point is "I exist as an auditor."

  ---

  ## IV. Misconception Management Matrix
  *Predictable errors and the precise moment to intercept them.*

  | Stage | Predictable Misconception | Why it Arises (Frequentist Intuition) | Interception Instruction |
  | :--- | :--- | :--- | :--- |
  | **Step 3 (Hypotheses)** | **"The Verification Bias"**<br>*"H_L is preferable because 1,000,000 auditors generate more data sheets, making the census more robust."* | Scientists equate sample size with reliability. They conflate the *quality* of the theory's output with the *probability* of the theory being true. | **Intercept Immediately.** State: "We are not judging which census is *better*. We are judging which Mandate is *active*. Assume both produce equally valid data. We are asking: Does your existence make $H_L$ more *true*?" |
  | **Step 4 (SSA)** | **"The Uniform Prior Fallacy"**<br>*"If I'm a random auditor, I'm equally likely to exist in either scenario. Probability is 50/50."* | Intuition suggests existence is a binary state (alive/dead), not a sampling event. They treat "I exist" as background, not data. | **Intercept at Definition.** Clarify: "SSA treats 'I exist' as background. Under SSA, your presence provides **zero** evidence for $H_L$ over $H_S$. The likelihood ratio is 1:1." |
  | **Step 5 (SIA)** | **"The Bayesian Conflation"**<br>*"This is just standard Bayes. More auditors means higher likelihood of picking me."* | They recognize the math ($P(E|H) \propto N$) but fail to see the reference class shift from *actual* to *possible*. | **Intercept with the 'Empty Room' Test.** Ask: "If $H_S$ were true, would you *not* be standing here? If you would be standing here regardless, SIA is double-counting your existence." |
  | **Step 7 (Absurdity)** | **"The Moral Slide"**<br>*"If SIA is true, we should fund $H_L$ projects to increase the probability of our own existence."* | Confusing epistemic probability (belief) with axiological value (goodness). | **Intercept Before Closing.** State: "SIA is a claim about *inference*, not *fertility*. Believing a theory predicts more people does not obligate you to create them. That is the Naturalistic Fallacy." |

  ---

  ## V. Session Flow & Timing (90 Minutes)

  1.  **Ground Rules (5 min):** Read the "Excluded Apparatus" statement.
  2.  **Scenario Setup (15 min):** Distribute the "Silent Archive" text. Ensure everyone accepts the constraints (no counting files, only two Mandates).
  3.  **SSA Walkthrough (20 min):**
      *   Ask: "Under $H_S$, what is the probability an auditor exists?" (100/100).
      *   Ask: "Under $H_L$, what is the probability an auditor exists?" (1,000,000/1,000,000).
      *   Conclusion: SSA yields no update. Priors remain unchanged.
  4.  **SIA Walkthrough (20 min):**
      *   Ask: "If we treat 'possible auditor slots' as the sample space, how many slots does $H_L$ offer vs $H_S$?"
      *   Show the 10,000:1 likelihood ratio.
      *   Highlight the "Presumptuous" result: You can now bet 10,000:1 that you are in a Global Station without opening a single file.
  5.  **Critique & Interception (20 min):**
      *   Invite the "Verification Bias" argument. Defuse using the Matrix.
      *   Invite the "Moral Slide." Defuse using the Matrix.
      *   Discuss why this feels wrong to a frequentist (it creates knowledge from thin air).
  6.  **Diagnostic & Close (10 min):**
      *   Administer the Diagnostic Question.
      *   Final summary.

  ---

  ## VI. Closing Diagnostic Question
  *To be posed verbally. Do not accept "Yes/No." Require the structural reason.*

  **The Question:**
  "Suppose you find a **Security Log** on the desk. It records every auditor who has ever entered the building. It is complete. You check the log and see your name is the **only** name recorded for this decade. Does the SIA inference (that $H_L$ is 10,000 times more likely) still hold? Why or why not?"

  **Correct Answer Criteria:**
  *   **Pass:** The participant identifies that the Security Log changes the **sampling frame**. You are no longer a random sample from *all possible auditors*; you are a random sample from *recorded entrants*. Since both Hypotheses predict exactly one recorded auditor (you) in this specific log for this decade, the likelihood ratio returns to 1:1. The SIA advantage vanishes because the selection effect is neutralized by the data.
  *   **Fail:** The participant argues that $H_L$ is still more likely because "there are still more auditors in existence," or that the log is "just more data" that should update the prior without changing the anthropic weight. This indicates they view SIA as a physical property rather than a structural feature of the reference class.

  ---

  ## VII. Explicit Statement of Refused Technical Apparatus
  *To be reiterated if participants attempt to bypass the scenario with formalism.*

  "We will not derive the SIA weighting factor mathematically. We will not discuss the 'Self-Indication Assumption' as a formal axiom in decision theory. We will not reference Nick Bostrom's *Anthropic Bias* or the literature on the Simulation Argument. We are treating the 'Presumptuous Philosopher' not as a solved problem in cosmology, but as a cautionary tale about **reference class selection** in ecological auditing. If you wish to formalize the probability calculus, you may do so on your own time; for this session, we rely on the structural logic of the Silent Archive."
