answer: |-
  To the Review Board,

  This document summarizes the points of agreement and disagreement regarding the epistemic norms governing our flood-risk forecasting, specifically arising from the recent unmonitored creek incident. Both parties agree on the fundamental mechanics of accuracy-first frameworks. They agree that a strictly proper scoring rule is a mathematical function that measures the distance between a assigned probability and the actual outcome, such that a forecaster maximizes their expected score only by reporting their true credence. Both accept that inaccuracy is at least an epistemic bad, meaning that holding a credence far from the truth is defeasibly undesirable regardless of practical consequences. Both also agree that within a framework where accuracy is the sole goal, one can derive probabilism, meaning credences should obey the axioms of probability, and conditionalization, meaning credences should update on new evidence via Bayes rule, using dominance arguments that show these strategies minimize expected inaccuracy regardless of how the world turns out. They agree that these mathematical results are robust provided the scoring rule meets specific conditions of strict propriety and continuity.

  The divergence arises when determining whether accuracy is the sole constituent of epistemic value or merely one constraint within a broader norm of responsible inquiry. The accuracy-first position holds that epistemic rationality is exhausted by the goal of having credences that match the world, so any process that yields accurate credences is epistemically sound. The inquiry-based position holds that epistemic rationality also governs the activity of investigating, meaning an agent can be epistemically negligent even if their resulting numbers are accurate, specifically if they failed to attend to relevant questions or verify the source of their numbers. They agree that this disagreement is not about the math of scoring rules but about whether the math captures the whole of epistemic normativity.

  The first crux concerns the inherited-model case, where a forecast handed down from head office is extremely accurate but nobody at the local level understands or has checked it. Both agree on the facts: the numbers are accurate, but the local understanding is null. The accuracy-first theorist predicts that there is nothing epistemically missing here, because the credence state held by the agency matches the truth, and the scoring rule assigns this state a perfect or near-perfect value. The inquiry-based theorist predicts that there is a significant epistemic flaw, because the agency is relying on a black box without warrant, and that a framework that cannot distinguish between understood accuracy and lucky accuracy is incomplete. Settling this would move the accuracy-first theorist only if it can be shown that understanding contributes to accuracy over time, whereas the inquiry theorist would move if it can be shown that understanding has no value independent of the truth of the output.

  The second crux addresses question-shopping, involving two forecasters who are equally accurate on the questions they each chose to answer, where one deliberately chose easy rivers and the other chose hard ones. Both agree that standard scoring rules grade the answers given, not the questions selected. The accuracy-first theorist predicts there is no epistemic complaint against the forecaster who chose easy questions, provided their reported credences were honest and accurate, because the scoring rule treats all truths equally. The inquiry-based theorist predicts there is a serious epistemic complaint, because neglecting high-stakes or difficult questions violates a norm of relevance, and that accuracy on trivialities does not compensate for ignorance on disasters. Settling this depends on whether epistemic value is additive across questions or weighted by importance, which current scoring rules do not inherently capture.

  The third crux is whether saying we genuinely have no idea is just a middling credence or a third thing, and what a framework that only scores credences can say about suspending judgment. Both agree that a standard scoring rule requires a number between zero and one to calculate a score. The accuracy-first theorist predicts that suspension of judgment is functionally identical to a credence of point-five, because any other representation prevents scoring and decision-making, and that treating it as distinct is psychologically real but epistemically redundant. The inquiry-based theorist predicts that suspension is a distinct epistemic stance that refuses to assign a probability, and that forcing a number creates false precision that masks ignorance. Settling this would move the accuracy-first theorist if evidence showed that assigning point-five leads to systematically worse outcomes than withholding, while the inquiry theorist would move if withholding could be shown to be mathematically equivalent to a specific probability distribution under strict propriety.

  The fourth crux concerns whether going out and getting more evidence can actually lower your expected accuracy, and if the answer depends on the scoring rule, whether that is an embarrassment or just a detail. Both agree that for strictly proper scoring rules, the expected accuracy of updating on new evidence is never lower than staying put, but for merely proper rules this guarantee does not hold. The accuracy-first theorist predicts that this dependency is just a detail, requiring us to strictly enforce the use of strictly proper rules, after which evidence always has non-negative expected value. The inquiry-based theorist predicts that this dependency is an embarrassment, because it makes the value of inquiry contingent on a mathematical choice of metric, and argues there are cases where responsible inquiry demands looking even if expected accuracy might not rise, such as when verifying a catastrophic risk. Settling this requires determining whether the guarantee of positive expected value is sufficient to mandate investigation in all high-stakes contexts.

  The fifth crux asks how much the dominance argument for probabilism depends on which scoring rule you start from, and whether whichever way that goes helps either side. Both agree that the dominance argument works for any scoring rule that is strictly proper and continuous, but the specific penalty for error varies between rules like the Brier score versus the log score. The accuracy-first theorist predicts that this variation is irrelevant to the vindication of probabilism, as long as the rule is strictly proper, because the structural requirement to avoid dominance holds across the board. The inquiry-based theorist predicts that this variation matters, because different rules incentivize different risk attitudes toward reporting, and if the norm of probabilism shifts based on the chosen metric, it suggests the norm is not fundamental. Settling this would move the accuracy-first theorist if a specific rule was shown to be uniquely tied to truth, while the inquiry theorist would move if the dominance argument held regardless of any scoring rule interpretation.

  Finally, regarding the terminology, both agree that some of the fight is about the word epistemic. The accuracy-first theorist uses epistemic to refer strictly to the relationship between mind and world, specifically truth-conduciveness. The inquiry-based theorist uses epistemic to refer to the conduct of the agent in managing their relationship to the truth, including diligence and scope. They agree that if the board adopts the first definition, the current scoring system is sufficient, but if the board adopts the second, the system requires protocols for question selection and model verification. They recommend the board decide whether the agency's goal is merely to produce accurate numbers or to conduct responsible investigation, as the mathematical tools support the former but do not fully encode the latter.
