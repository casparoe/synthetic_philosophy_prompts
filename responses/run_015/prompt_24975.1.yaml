      *   *The "Global vs. Local" distinction:* Global reductionism (testimony in general is reliable) vs. Local reductionism (this speaker on this topic is reliable).
      *   *The "Positive Reasons" vs. "No Defeaters" distinction:* Do I need *positive* reasons to trust (Reductionism) or just an *absence* of defeaters (Anti-Reductionism/Presumptivism)?
      *   *Assurance View (Moran, Hinchman):* It's not about evidence, it's about interpersonal responsibility.
      *   *Transmission View (Burge):* Content is transmitted, justification is preserved.

  3.  **Evaluate the User's Options (a-d):**
      *   *(a) Verbal Dispute:* Are they defining "justification" differently? Partially. Reductionists often mean "evidential support," Anti-Reductionists often mean "warrant/entitlement." But it's deeper than semantics; it's about structure.
