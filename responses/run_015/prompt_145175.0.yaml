  (a) Two logistics firms share a hub. Actions: **Share** (Cooperate), **Hoard** (Defect), **Lease External** (Withdraw). Payoffs (Row, Col):

  | | Share | Hoard | Lease |
  |---|---|---|---|
  | **Share** | 3, 3 | 0, 5 | 0, 2 |
  | **Hoard** | 5, 0 | 1, 1 | 1, 2 |
  | **Lease** | 2, 0 | 2, 1 | 2, 2 |

  PD checks: $T(5) > R(3) > P(1) > S(0)$ and $2R(6) > T+S(5)$. Withdrawal payoff $E=2$ lies strictly between $P(1)$ and $R(3)$. Against Lease, the opponent receives exactly what they would against Hoard ($S$ vs Share, $P$ vs Hoard, $E$ vs Lease), satisfying the protective constraint.

  (b) Let continuation probability $\delta = 0.6$. Without Withdrawal, Grim Trigger sustains Share. Value of cooperation: $3/(1-0.6) = 7.5$. Value of deviation: $5 + 0.6(1)/(1-0.6) = 5 + 1.5 = 6.5$. Since $7.5 > 6.5$, cooperation is sustainable.

  (c) With Withdrawal, no SPNE sustains cooperation. In any SPNE, a player's continuation value $V$ must satisfy Individual Rationality: $V \geq E/(1-\delta)$, because a player can secure $E$ forever by playing Lease. Thus, the maximum per-round punishment loss is $R - E = 3 - 2 = 1$. The incentive constraint requires the future loss from punishment to exceed the one-shot gain from deviation: $\frac{\delta(R-E)}{1-\delta} \geq T - R$. Substituting numbers: $\frac{0.6(1)}{0.4} = 1.5$. The gain from deviation is $5 - 3 = 2$. Since $1.5 < 2$, the constraint fails. No punishment credible enough to deter deviation exists because Withdrawal caps the severity of punishment at $E$. This holds for pure or mixed strategies; the security level $E$ is unconditional.

  (d) General condition: $\delta \geq \frac{T-R}{T-E}$. If $E=P$, this reduces to the standard $\frac{T-R}{T-P}$. If Withdrawal is one-shot, punishment can dip below $E$ temporarily, potentially restoring deterrence if the deviation gain is small. If Withdrawal costs $c$, the security level falls to $E-c$, widening the punishment range. If Withdrawal is observable and triggers retaliation (e.g., treated as Defection), it loses its "safe haven" property, effectively reverting $E$ toward $P$ and restoring deterrence.

  (e) Asymmetric variant: Only Row can Lease. Row's security level is $E=2$; Col's is $P=1$. Row's incentive constraint becomes $\frac{\delta(3-2)}{1-\delta} \geq 2$, requiring $\delta \geq 2/3 \approx 0.67$. At $\delta=0.6$, Row defects. The outcome stabilizes at (Lease, Hoard), yielding Row 2. Row is worse off than under cooperation (3), despite having the defensive option. The option destroys the surplus needed to sustain the relationship.

  (f) Core feature: Withdrawal raises the minmax payoff, compressing the surplus available for punishment. Objection 1: "Partners will contract against withdrawal." Reply: The model assumes non-enforceable settings; if contracts worked, the PD would not exist. Objection 2: "Withdrawal is costly." Reply: If costs are low enough that $E > P$, the compression effect persists; only high costs restore deterrence.

  (g) Evolutionarily, the "shadow of the future" shrinks. In a well-mixed population, the fallback outcome shifts from mutual defection ($P$) to mutual withdrawal ($E$). Because $E > P$, the relative benefit of cooperation ($R-E$) decreases, requiring higher $\delta$ to sustain cooperation. The standard story qualifies: safety nets can starve cooperation of the leverage needed to survive.
