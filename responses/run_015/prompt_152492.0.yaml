prompt: |-
  I'm finalizing the assessment for an upper-level philosophy-of-mathematics seminar, and I need a take-home essay prompt that students can complete in roughly 120 minutes for a total of 25 marks. The domain is intuitionistic logic and mathematical constructivism, but I want to avoid questions that reward mere rehearsal of the canonical narrative—Brouwer's rejection of the law of excluded middle, Heyting's formalization, and the BHK interpretation of proof. Instead, the prompt should inject a synthetic framing that is not standard textbook material: ask students to examine whether a constructivist ontology of mathematical objects can be sustained when the single "creating subject" is replaced by a distributed network of fallible, non-communicating computational agents, each constructing local fragments of a structure without access to any global consistency proof. The exam question should require them to identify precisely where intuitionistic negation and the constructive existential quantifier must be modified—or resist modification—under such distributed conditions, and to argue whether the result is a stable intermediate logic or collapses into a form of classical pluralism.

  Please provide the following: (1) the full exam prompt, clearly stating the 120-minute time limit and 25-mark weighting; (2) a model answer that executes five specific argumentative moves—for instance, diagnosing the failure of single-subject epistemic access, reformulating the BHK conditions for distributed local construction, analyzing the status of double-negation elimination in the absence of global verification, distinguishing this framework from formalist pluralism, and assessing whether the modified negation retains genuinely constructive force; (3) a marking scheme that allocates 5 marks to each of the five moves, specifies the exact conceptual reasoning required for full marks, and includes a one-line note on the characteristic mistake that should cost marks on each move. The prompt should not ask for bibliographies, citations, or reading lists; the answer must be fully evaluable from the conceptual resources a well-prepared student already possesses.
