answer: |-
  To the Board of Trustees:

  The Collections Stewardship Committee recommends returning the nineteen fragments held under accession 1994.112 to the Republic of Meridia and certifying that these fragments constitute integral parts of the single cultural entity known as the Thalassa Figure. We further recommend clarifying that while we recognize the Figure's conceptual unity, our certification cannot extend legal authority to holdings controlled by third parties in Geneva or at the Nordhavn Museum. This approach satisfies the Restitution Act's significance threshold while adhering to our internal accessioning protocols.

  Our reasoning rests on distinguishing between legal accession units and cultural objects. The 1998 Stewardship Manual dictates that fragments share an accession number only where joined by continuous original material at acquisition. Since our nineteen fragments were not physically connected to the others when acquired, they remain distinct legal units under our registry. However, the 2016 curatorial review established that the Figure's outstanding significance emerges only through reassembly. The Restitution Act targets objects of cultural significance, not merely accessioned lots. Therefore, while our records reflect physical separation, the restitution claim correctly identifies the cultural object as the unified Figure. We apply the Manual procedurally to maintain registry integrity but interpret the Act functionally to acknowledge curatorial reality. This dual track respects the metaphysical insight that composition is not solely defined by physical contact but by functional and cultural coherence.

  We must engage the counterargument raised in open session: that because metaphysics offers no fact of the matter regarding composition, we should simply choose the counting convention that minimizes restitution. Our trustee argued that since objecthood is a choice, we should pick the scheme favoring retention. This position is logically consistent with the view that composition is indeterminate. However, stewardship requires more than logical consistency; it demands reasonableness under scrutiny. Counsel has warned that a reviewing body will assess whether our reading is reasonable and consistently applied. Selecting a convention solely to retain property risks appearing arbitrary and bad-faith, failing the reasonableness test. We cannot hide behind ontological indeterminacy to evade ethical obligations. The choice of convention must serve the museum's mission and public trust, not just its holdings. Ignoring the 2016 significance review to exploit a technicality would undermine our institutional integrity far more than returning the stone.

  To implement this decision, we propose the following course of action over the next six months. First, Registration will maintain 1994.112 for the nineteen fragments but create a linked virtual record for the "Thalassa Figure" entity to document their conceptual unity. Second, we will certify to Meridia's Ministry that the nineteen fragments are constituent parts of the Figure, while explicitly stating we hold no authority over the Geneva or Nordhavn fragments. Third, regarding the 1958 forearm and 1961 plaster bridges, Conservation will separate these modern additions from the original stone; we will return only the ancient material, retaining the forearm as a separate record of restoration history. Fourth, we will write to the Nordhavn Museum sharing our findings on cultural unity to encourage cooperative restitution without demanding their compliance. Fifth, Gallery Services will relabel the current 3D print as "Reconstruction based on dispersed fragments" to prevent public confusion about the original's status. Finally, we aim to complete the deaccessioning and packing process within six months, contingent on the Ministry's acceptance of these terms. This plan balances legal prudence with ethical stewardship.

  Verdict: Return the fragments; certify cultural unity without asserting third-party authority.
