answer: |-
  You're mixing up the objections Turing is cataloging with his own convictions, plus he isn't suggesting we need psychic shielding for the test to work. He's actually arguing that even if ESP were real, it wouldn't prove machines can't think, nor does it require a special protocol to block telepathy. Basically, you're reading his discussion of a counterargument as if it were his own requirement for the experiment.

  Turing wasn't claiming ESP was real or that minds have psi-fields; he was just dutifully addressing a popular scientific controversy of his time to show it wouldn't break his test. He argues that if telepathy were real, you could just put the human contestant in a lead-lined room to block the signals, keeping the test fair without needing machines to be psychic. Ultimately, he treats it as a distraction, suggesting that even if humans have some magical advantage, it doesn't change the fundamental question of whether a machine can simulate human conversation well enough to fool us. He's basically saying, "Fine, let's assume magic exists, but it still doesn't prove machines can't think."

  None of this matters for modern LLM evals because ESP isn't considered a real phenomenon anymore, so we don't need to worry about psychic leakage between judges and models. Today's tests focus on whether the AI can actually reason and converse, not whether it's blocking supernatural signals. You can safely ignore the psi-field layer when designing benchmarks.
