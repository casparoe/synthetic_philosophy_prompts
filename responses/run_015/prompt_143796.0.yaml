prompt: |-
  I teach a graduate seminar on the epistemic foundations of game theory — common knowledge, common belief in rationality, and the work that higher-order beliefs are supposed to do in selecting among equilibria. I want to test that framework against an actual episode rather than another puzzle, so: analyse the failure of Silicon Valley Bank in March 2023 through it, and then tell me where the framework stops being informative.

  I will stipulate the facts. SVB had invested a large share of its swollen deposit base in long-dated Treasuries and mortgage securities, whose market value fell as the Fed raised rates; unrealized losses on the held-to-maturity portfolio exceeded fifteen billion dollars. On 8 March the bank announced that it had sold over twenty-one billion dollars of securities at a loss, borrowed fifteen billion, and would raise 2.25 billion in equity. Prominent venture investors publicly advised their portfolio companies to move their money. Customers withdrew funds totalling forty-two billion dollars by the following day; the bank was seized on 10 March. Roughly eighty-nine percent of its deposit liabilities were uninsured. Two days later the authorities announced that all depositors, insured or not, would have full access to their funds, and the immediate panic subsided — while First Republic, with a comparably uninsured deposit base, was closed on 1 May despite thirty billion dollars in deposits placed with it by eleven banks in March.

  What I want is a disciplined mapping, not a narrative: who the players are, what the option set and payoff structure actually looked like for a depositor on the morning of 9 March, what has to be true of first- and higher-order beliefs for mass withdrawal to be an equilibrium rather than merely individually rational, and how the public guarantee should be modelled — as a change in the payoffs, or as an intervention on beliefs, and if the latter, what the theory predicts about the difference between its working at SVB and not working at First Republic.

  Then the return direction, which interests me more. First: was this a coordination failure at all? SVB's deposits paid close to nothing while short-term government paper yielded around five percent, so withdrawal may have been a dominant strategy irrespective of what anyone else did. If so the model is imposing a self-fulfilling structure on what was really a common adverse shock. Say what would distinguish the two readings, and whether the framework can distinguish them from the outside; if it cannot, is that a defect in the theory or a limitation on its use? Second: the depositor base was unusually small, densely networked, and able to watch one another's reasoning almost in real time. Does that transparency move the situation toward or away from the theory's idealised conditions, and — since transparency plainly does not by itself say which equilibrium gets coordinated on — whether near-common knowledge behaves like common knowledge here or departs from it disproportionately. Finally, the normative question: if staying and running are both equilibrium outcomes under common belief in rationality, can the framework say that anything went wrong at SVB, or does it have to import something from outside itself? Where it has nothing to say, say so rather than forcing it to speak.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Epistemic foundations of game theory (common knowledge, common belief in rationality, higher-order beliefs, equilibrium selection).
      *   **Case Study:** Silicon Valley Bank (SVB) failure, March 2023.
      *   **Task 1 (Forward Mapping):** Map the SVB episode onto the game-theoretic framework.
          *   Identify players.
          *   Define option sets and payoff structures (specifically for a depositor on the morning of March 9).
          *   Specify belief conditions (1st and higher-order) for mass withdrawal as an equilibrium.
          *   Model the public guarantee (payoff change vs. belief intervention) and explain the SVB vs. First Republic difference.
      *   **Task 2 (Return Direction/Critique):** Test the limits of the framework.
          *   *Coordination vs. Dominance:* Was it actually a coordination failure (run) or a dominant strategy withdrawal (insolvency + opportunity cost)? How to distinguish? Can the theory distinguish?
          *   *Network/Transparency:* Effect of the small, networked depositor base on "common knowledge" approximations.
          *   *Normative:* Can the framework judge if something "went wrong," or is it purely descriptive?
      *   **Constraint:** Disciplined mapping, not narrative. Acknowledge where the framework stops being informative.

  2.  **Task 1: Forward Mapping (The Game Theoretic Model)**

      *   **Players:** Depositors (specifically the large, uninsured institutional ones). Let's model this as a continuum or a large finite $N$ game.
      *   **Time:** Morning of March 9 (post-announcement, pre-seizure).
      *   **Actions:** Withdraw ($W$) or Stay ($S$).
      *   **Payoffs:**
          *   If Bank Solvent & Liquid: $S > W$ (due to transaction costs of moving funds, disruption).
          *   If Bank Insolvent/Illiquid & You Stay: $0$ (or recovery rate $\ll 1$).
          *   If Bank Insolvent/Illiquid & You Withdraw: $1$ (full face value, assuming you are early enough).
          *   *Crucial Detail:* 89% uninsured. This makes the payoff sensitive to the bank's ability to pay par.
      *   **Information State:**
          *   Public signal: Capital raise announcement + realized losses ($15B+).
          *   Private signal: Individual liquidity needs, assessment of VC peer behavior.
      *   **Equilibrium Conditions (Global Game/Run Logic):**
          *   Mass withdrawal is a Nash Equilibrium if, given others withdraw, my best response is to withdraw.
          *   *Higher-Order Beliefs:* I withdraw if I believe the bank is insolvent. But since solvency depends on liquidity (fire sales), I withdraw if I believe *others* believe the bank is insolvent.
          *   Common Belief in Rationality (CBR): If it is CBR that the bank is fundamentally weak, $W$ is the unique rationalizable outcome.
      *   **The Guarantee (March 12):**
          *   *Payoff Change:* It changes the payoff of Staying from $\approx 0$ (in failure state) to $1$. It removes the strategic complementarity.
          *   *Belief Intervention:* It acts as a public signal that shifts the common $p$-belief threshold.
          *   *SVB vs. First Republic:* Why did FRB fail later? The guarantee was specific to SVB (systemic risk exception). For FRB, the guarantee was not *common knowledge* in the same way. The payoff structure remained vulnerable to belief shocks regarding *future* guarantees.

  3.  **Task 2: Return Direction (The Critique)**

      *   **Coordination vs. Dominance:**
          *   *The Issue:* Depositors earned ~0% on SVB deposits. T-Bills yielded ~5%.
          *   *Argument:* Withdrawal might have been a *dominant strategy* regardless of the run. The "run" narrative imposes a strategic complementarity where there might just be a fundamental valuation shift.
          *   *Distinguishing:* In a pure coordination model, if I know others stay, I stay. In a dominance model, I leave even if others stay (due to opportunity cost + solvency risk).
          *   *Theory's Limit:* Epistemic game theory assumes the payoff structure is fixed. If the "payoff" includes opportunity cost, the threshold for a run drops. The theory struggles to empirically disentangle "fear of others" from "fear of assets" without observing counterfactuals.
      *   **Transparency/Network:**
          *   *The Issue:* VC Twitter/Group chats.
          *   *Theory:* Common Knowledge requires infinite recursion ("I know that you know...").
          *   *Reality:* High transparency approximates common knowledge faster (Rubinstein's Email Game vs. real-time chat).
          *   *Nuance:* Does it behave like Common Knowledge? Yes, it accelerates the convergence to the risk-dominant equilibrium. But "near-common knowledge" (Monderer & Samet) suggests small frictions matter. In SVB, frictions were near zero.
          *   *Selection:* Transparency doesn't solve equilibrium selection; it just makes the switch sharper. It pushes toward the "panic" equilibrium because the signal (losses) was bad.
      *   **Normative:**
          *   *The Issue:* Did something go "wrong"?
          *   *Theory:* If both Stay and Run are equilibria under CBR, the theory is silent on welfare. It describes consistency, not optimality.
          *   *Verdict:* The framework cannot say the run was "irrational" or "wrong" if it was an equilibrium. It needs external welfare criteria (e.g., social cost of credit crunch).

  4.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Academic, precise, matching the user's graduate seminar level. Avoid journalistic fluff.
      *   *Structure:* Follow the prompt's two main sections (Mapping, then Critique).
      *   *Refining the Payoff Matrix:* Need to be careful about the "Dominant Strategy" critique. If the bank is fundamentally insolvent (assets < liabilities), withdrawal is dominant for uninsured depositors *if* they are first. If they are last, they get nothing. This creates the strategic complementarity. But the 5% yield adds a "carry cost" to staying. I need to model this carefully.
      *   *Refining the Guarantee:* The prompt asks about SVB vs. First Republic. The guarantee was a *policy shock*. For SVB, it was ex-post. For FRB, the *expectation* of such a guarantee was the variable. The theory predicts that without common knowledge of the guarantee, the fragility remains.
      *   *Refining the "Defect":* Is it a defect in the theory that it can't distinguish dominance from coordination? Or is it a limitation of the *observer*? I should argue it's a limitation of the *application* (identification problem), not necessarily the theory itself, but it reveals the theory's reliance on exogenous payoff specification.

  5.  **Final Polish:** Check against specific constraints.
      *   "Disciplined mapping, not a narrative." -> Use game theoretic terminology (Nash, Rationalizable, p-belief).
      *   "Where the framework stops being informative, say so." -> Be explicit about the normative silence and the identification problem.
      *   "First Republic difference." -> Ensure this is addressed in the belief/payoff section.

  6.  **Self-Correction during drafting:** I initially thought about modeling this as a Global Game (Carlsson & van Damme). That's appropriate for the "higher-order beliefs" aspect. I should explicitly mention the threshold signal.
      *   *Correction on First Republic:* The prompt notes FRB closed May 1 despite deposits in March. The guarantee didn't save FRB. Why? Because the guarantee was not *common knowledge* to apply to FRB. It was a discrete intervention. The epistemic state for FRB depositors was "SVB got saved, will I?" -> Uncertainty -> Run.
      *   *Normative:* Be careful not to say "the theory fails." Say "the theory is agnostic."

  7.  **Final Review against Prompt:**
      *   Players/Options/Payoffs? Yes.
      *   1st/Higher-order beliefs for mass withdrawal? Yes.
      *   Public guarantee modeling? Yes.
      *   Coordination vs. Dominance? Yes.
      *   Transparency/Network effects? Yes.
      *   Normative question? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### I. Forward Mapping: The Epistemic Structure of the Run

  To map the SVB episode onto the epistemic foundations of game theory, we treat the deposit run as a coordination game with strategic complementarities, embedded in a global game structure to handle the incomplete information regarding the bank's true liquidity state.

  **1. Players, Options, and Payoffs (Morning of 9 March)**
  *   **Players:** A continuum of depositors $i \in [0,1]$, predominantly institutional and uninsured (89% of liabilities).
  *   **Actions:** $a_i \in \{\text{Withdraw}, \text{Stay}\}$.
  *   **Fundamental State:** $\theta$, representing the bank's liquidity solvency after fire-sale adjustments. $\theta$ is unknown but distributed according to a prior.
  *   **Payoff Structure:**
      *   Let $L$ be the proportion of depositors withdrawing.
      *   The bank fails if $L > \theta$ (liquidity constraint binds).
      *   If Bank Fails: Payoff(Withdraw) $= 1$ (assuming early enough in the queue); Payoff(Stay) $= R < 1$ (recovery rate on uninsured deposits).
      *   If Bank Survives: Payoff(Withdraw) $= 1 - c$ (transaction costs/opportunity cost); Payoff(Stay) $= 1$.
      *   *Crucial Modification:* Given the 5% yield on outside options vs. ~0% on SVB deposits, the cost of staying $c$ includes a significant opportunity cost component, lowering the threshold for withdrawal even absent a run.
  *   **Information:** Depositors observe a public signal $y$ (the 8 March announcement of losses and capital raise) and private signals $x_i$ (individual assessment of VC peer behavior).

  **2. Belief Conditions for Mass Withdrawal**
  For mass withdrawal to be a Nash Equilibrium, it must be that for a critical mass of players, Withdraw is a best response to the expectation that others Withdraw.
  *   **First-Order Beliefs:** Depositor $i$ withdraws if $E_i[\text{Bank Solvency}] < \text{Threshold}$. The 8 March announcement shifted the mean of this belief distribution significantly leftward.
  *   **Higher-Order Beliefs:** Solvency is endogenous to liquidity. Therefore, $i$ withdraws not only if $i$ believes the bank is weak, but if $i$ believes that *others* believe the bank is weak.
  *   **Common Belief in Rationality (CBR):** Under CBR, we look for rationalizable strategies. If the public signal $y$ is sufficiently negative, the iterated deletion of dominated strategies leaves Withdraw as the unique rationalizable outcome. Specifically, if it is *common $p$-belief* (Monderer & Samer) that $\theta$ is below the solvency threshold, the "Run" equilibrium is selected. The VC network advice acted as a focal point, synchronizing these higher-order beliefs rapidly.

  **3. Modeling the Public Guarantee (12 March)**
  The authorities' announcement ("all depositors will have full access") can be modeled in two ways, with distinct implications:
  *   **As a Payoff Change:** The guarantee alters the payoff matrix directly. If Bank Fails, Payoff(Stay) becomes $1$ instead of $R$. This eliminates the strategic complementarity. Withdrawal is no longer a best response to Withdrawal. The game ceases to be a coordination problem.
  *   **As a Belief Intervention:** The announcement is a public signal intended to shift the common belief regarding $\theta$ or the government's response function.
  *   **SVB vs. First Republic:** The framework explains the divergence here through the *common knowledge status* of the guarantee.
      *   For SVB, the guarantee was an observed, realized event (ex-post). It successfully reset beliefs for the system.
      *   For First Republic (FRB), the guarantee was not a fixed rule but a discretionary policy. For FRB depositors, the state space included a variable $G$ (probability of government bailout). Because $G$ was not common knowledge to be $1$ for FRB, the strategic complementarity remained. Depositors faced a second-order uncertainty: "I know SVB was saved, but do others know FRB will be saved?" Without common knowledge of the guarantee, the higher-order belief chain supports a run equilibrium if $E[G]$ is sufficiently low.

  ***

  ### II. Return Direction: Limits of the Framework

  You asked where the framework stops being informative. There are three specific points of failure or agnosticism in applying epistemic game theory to this episode.

  **1. Coordination Failure vs. Dominant Strategy (The Identification Problem)**
  *   **The Challenge:** You noted that SVB deposits paid ~0% while T-bills paid ~5%. If the opportunity cost of staying ($c$) exceeds the expected loss from a bank run, Withdrawal becomes a **dominant strategy**, not a coordinated equilibrium. In this reading, the "run" is a mirage; it is simply a mass reaction to a fundamental shock (interest rate risk realization) where every agent independently calculates that the asset (SVB deposit) is inferior to the outside option, regardless of what others do.
  *   **Distinguishing the Readings:**
      *   *Coordination:* If I knew with certainty that no one else would withdraw, I would Stay (payoff $1 > 1-c$).
      *   *Dominance:* Even if I knew no one else would withdraw, I would Withdraw (payoff $1-c_{\text{total}} > 1$, where $c_{\text{total}}$ includes opportunity cost + fundamental insolvency risk).
  *   **Can the Framework Distinguish?** No. Epistemic game theory takes the payoff structure as exogenous. It can model either scenario, but it cannot empirically disentangle them from the outside without observing the counterfactual (what would depositors have done if they knew others would stay?).
  *   **Defect or Limitation?** This is a limitation on **use**, not necessarily a defect in the theory. The theory describes consistency between beliefs and actions. If the analyst mis-specifies the payoffs (ignoring the 5% opportunity cost), the theory will incorrectly attribute the outcome to "panic" (higher-order beliefs) rather than "repricing" (first-order fundamentals). The framework is silent on the *source* of the payoff parameters; it only processes them.

  **2. Transparency and Near-Common Knowledge**
  *   **The Challenge:** The SVB depositor base was a dense network (VCs, tech CFOs) communicating in real-time (Twitter, group chats). Standard theory distinguishes between *Common Knowledge* (infinite recursion) and *Common Belief* (probabilistic). Rubinstein's Email Game suggests that without true common knowledge, coordination can fail even with high probability of mutual knowledge.
  *   **Theory's Prediction:** High transparency should approximate common knowledge, reducing the friction that usually prevents coordination on the "good" equilibrium. However, transparency does not dictate *which* equilibrium is selected.
  *   **Where the Framework Stops:** The framework predicts that transparency sharpens the transition between equilibria (makes the threshold $\theta$ more precise), but it cannot explain why the network coordinated on the *Run* rather than the *Stay* equilibrium given the same information.
      *   In SVB, the "advice to withdraw" acted as a correlating device. But epistemic theory treats the content of the signal as exogenous. It cannot explain *why* the influential nodes (VCs) sent a "Run" signal rather than a "Stay" signal, other than by referencing their own payoffs.
      *   Furthermore, does near-common knowledge behave like common knowledge here? Yes, functionally, because the friction was low. But the theory offers no purchase on why the "Run" equilibrium was risk-dominant *for this specific network* beyond the payoff parameters already discussed. The social structure accelerated the epistemic convergence, but the theory cannot endogenize the social structure's bias toward pessimism.

  **3. The Normative Question**
  *   **The Challenge:** If Stay and Withdraw are both Nash Equilibria consistent with Common Belief in Rationality (given the uncertainty about $\theta$), can the framework say anything went "wrong"?
  *   **The Verdict:** The framework has **nothing to say** normatively.
      *   Epistemic game theory is a consistency check. If the run occurred, and beliefs were consistent with the signals observed, the outcome is "rational" within the model.
      *   To claim something went "wrong" (e.g., a welfare loss, a preventable credit crunch), one must import a social welfare function from outside the game. The theory can identify that the outcome was *Pareto inferior* to the "All Stay" equilibrium (assuming the bank was fundamentally viable), but it cannot label the selection of the inferior equilibrium as an error in reasoning.
      *   **Limitation:** The framework cannot distinguish between a "self-fulfilling prophecy" (bad) and a "disciplining mechanism" (good). If the run forced the closure of an insolvent bank that regulators were too slow to close, the "Run" equilibrium might be socially optimal. The epistemic framework is agnostic to this distinction. It traces the logic of the beliefs, not the welfare consequences of the actions.

  ### Summary of Informative Bounds

  | Question | Framework's Output | Limit/Stop Point |
  | :--- | :--- | :--- |
  | **Mechanism of Run** | Explains how private signals + public announcements iterate into mass withdrawal via higher-order beliefs. | Cannot distinguish if withdrawal was driven by fear of others (coordination) or fear of assets (dominance). |
  | **Role of Guarantee** | Models as payoff change (removes complementarity) or belief shift (requires common knowledge). | Cannot explain why common knowledge of guarantee failed to extend to First Republic without exogenous policy assumptions. |
  | **Network Effects** | Predicts faster convergence to equilibrium (reduced friction on common belief). | Cannot explain why the network selected the "Run" focal point over the "Stay" focal point. |
  | **Normative Assessment** | Identifies multiple equilibria and Pareto rankings. | **Silent.** Cannot declare the run "irrational" or "wrong" if it is a consistent equilibrium. Requires external welfare criteria. |

  **Conclusion for the Seminar:**
  The SVB episode validates the *mechanics* of the epistemic framework (specifically global games and the role of public signals in selecting equilibria). However, it exposes the framework's dependence on exogenous payoff specification. If the opportunity cost of capital is treated as part of the payoff, the "run" dissolves into a dominant strategy exit, rendering the higher-order belief machinery superfluous. The framework is powerful for tracing the *propagation* of shocks through belief hierarchies, but it is blind to the *origin* of the payoff parameters and silent on the *normative* status of the selected equilibrium.
