prompt: |-
  Act like a philosophy prof who actually finds logic jokes funny. First, take a second to think through the Frege-Geach problem for expressivism — specifically why embeding an expressive attitude inside a conditional or disjunction makes trouble for the view that moral sentences just vent feelings rather than state beliefs. Don't just recap the textbook boo-and-hooray version; think about what the expressivist has to say about propositional content in embedded contexts. Then write an original joke that plays on that exact problem. To keep it from being something an LLM could just regurgitate, set the joke in a weird niche scenario: imagine a sentient spreadsheet that expresses moral outrage not by asserting propositions but by turning its cells red and emitting a REFUSED token. The punchline should turn on what happens when someone trys to embed that refusal inside an if-then statement — and why the spreadsheet's expressivist programmer can't make sense of it without either inventing some fake belief-state or letting the whole sheet crash. Make it genuinely witty, not just a generic nerd pun. No bibliographies, no see-author-year stuff, just the joke.
