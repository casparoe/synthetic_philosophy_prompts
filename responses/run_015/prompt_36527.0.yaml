answer: |-
  This is a classic case of theory overreach. Your students are wielding a biological heuristic as a metaphysical veto. The Handicap Principle (Zahavi/Graphen) is a powerful model for evolutionary stability, but when ported to human speech acts without translation, it becomes a "just-so" story that shuts down inquiry.

  The slogan *"Honest signals must be costly"* is ambiguous between a necessary condition for *evolutionary stability* in high-conflict environments and a sufficient condition for *truthfulness* in human communication.

  Here is a breakdown of the distinct theses hiding inside that slogan, formatted for your seminar. I have been blunt about which ones are doing the heavy lifting and which ones are just academic posturing.

  ### 1. The Absolute Cost Thesis
  *   **The Claim:** For a signal to be honest, the act of signaling must impose a net negative utility (fitness/resource cost) on the sender.
  *   **Truth Value:** **False.** In game theory (e.g., Skyrms, Lewis), "cheap talk" equilibria exist where honest signaling occurs without cost, provided interests are sufficiently aligned. In biology, kin selection allows for costless alarm calls.
  *   **Does it ban costless apologies?** **Yes.** It implies that if the CEO didn't lose something tangible, the apology is structurally incapable of being honest.
  *   **Explanatory Value:** **Low.** This is the "signaling sophistication" reading. It sounds rigorous but ignores the vast literature on coordination games and common-interest signaling. It confuses *stability against invasion* with *truth conditions*.

  ### 2. The Conflict of Interest Thesis
  *   **The Claim:** Costs are only required to ensure honesty when the sender and receiver have divergent interests (the "Lie Incentive"). If interests align, cost is unnecessary.
  *   **Truth Value:** **True.** This is the standard game-theoretic condition for costly signaling. If I want you to know X, and you want me to know X, I don't need to bleed to tell you.
  *   **Does it ban costless apologies?** **Conditionally.** It bans costless apologies *only if* we assume the corporation's interests inherently diverge from the public's. If the corporation genuinely wants to restore trust to survive, interests align, and cost isn't strictly necessary for honesty.
  *   **Explanatory Value:** **High.** This forces the empirical question: *Do the interests diverge here?* It moves the debate from metaphysics to political economy.

  ### 3. The Differential Cost Thesis (The Actual Handicap Principle)
  *   **The Claim:** The signal need not be costly in absolute terms, but it must be *marginally more costly* for a low-quality type (liar) to produce than for a high-quality type (truth-teller). The cost structure must make mimicry unprofitable.
  *   **Truth Value:** **True.** This is the precise biological formulation. A peacock's tail is costly for everyone, but lethal for a weak peacock.
  *   **Does it ban costless apologies?** **No.** An apology could be "cheap" for a genuinely remorseful company (because they intend to change anyway) but "expensive" for a fraudulent one (because they would have to actually change operations to maintain the lie).
  *   **Explanatory Value:** **Real Work.** This is the only version that actually explains *why* the signal works. It shifts the focus from "Did they suffer?" to "Would a liar find this specific apology too hard to maintain?"

  ### 4. The Strategic Connection Thesis
  *   **The Claim:** The cost must be internally related to the quality being signaled, not an arbitrary toll. (e.g., Burning money shows wealth, but burning money doesn't show *remorse* unless burning money is harder for the unremorseful).
  *   **Truth Value:** **True.** Arbitrary costs lead to "wasteful signaling" equilibria that are evolutionarily unstable. The cost must index the specific trait.
  *   **Does it ban costless apologies?** **No.** It suggests that if there *is* a cost, it must be the *right kind* of cost (e.g., operational change vs. stock dip). But it allows for costless signals if the indexing is achieved through other means (e.g., institutional verification).
  *   **Explanatory Value:** **High.** It prevents the "blood sacrifice" fallacy. It asks: *Is this cost actually tracking remorse, or just tracking liquidity?*

  ### 5. The "No Cost, No Truth" Verdict (The Student's Position)
  *   **The Claim:** If a signal is costless, it is epistemically worthless ("just cheap talk").
  *   **Truth Value:** **False.** This conflates *unreliable in equilibrium* with *necessarily false*. A costless statement can be true; it just lacks a *guarantee* of truth in high-conflict scenarios.
  *   **Does it ban costless apologies?** **Yes.** This is the conclusion they drew.
  *   **Explanatory Value:** **Zero.** This is purely status signaling. It uses biological terminology to shut down philosophical nuance about speech acts, commitment, and institutional design.

  ---

  ### Diagnosis: What Your Students Are Actually Doing

  Your bio students are almost certainly operating with a vulgarized version of **Thesis 1 (Absolute Cost)** masquerading as **Thesis 3 (Differential Cost)**.

  They see "Handicap" and think "Pain." They are assuming that because biological handicaps (tails, antlers) involve metabolic expenditure, human social signals must involve utility expenditure to count. They are missing the *differential* aspect. They think the cost *makes* it honest, rather than the cost *filtering out* the dishonest.

  **The Odd Commitments of Their View:**
  If you press them on **Thesis 1**, they commit themselves to the following absurdities regarding apologies:

  1.  **The Saint Paradox:** If a CEO is a saint (perfect alignment of interests), an apology from them should be *more* trustworthy. But under the Absolute Cost thesis, because it costs them nothing (no conflict to overcome), it is *less* trustworthy. Their model punishes perfect alignment.
  2.  **The Suffering Requirement:** They imply that remorse is ontologically dependent on suffering. If an apology fixes the problem without hurting the apologizer, it wasn't "real." This confuses the *penance* with the *repentance*.
  3.  **The Recidivist Loophole:** If a company apologizes and pays a fine (cost), but views the fine as a "cost of doing business" (low marginal cost for them), the Handicap Principle says this is a *better* signal than a small company that apologizes and goes bankrupt. The students' heuristic might actually validate the "too big to fail" apology over the sincere small-business one.

  ### Classroom Strategy

  Don't tell them they are wrong about biology; tell them they are wrong about **mapping**.

  1.  **Ask them to define the "Quality" being signaled.** Is it "Remorse"? Or is it "Solvency"? A financial penalty signals solvency (only rich companies can pay), but it does not necessarily signal remorse (rich companies can pay to lie).
  2.  **Invoke the Differential.** Ask: "Is this apology *harder* for a lying company to make than an honest one?" If the honest company plans to change its practices anyway, the apology is cheap for them. If the lying company has to change practices to keep up the pretense, the apology is expensive for *them*. That is the Handicap. The cost doesn't need to be absolute; it needs to be asymmetric.
  3.  **The "Cheap Talk" Challenge.** Remind them that human language is the ultimate cheap talk system, yet we coordinate complex societies with it. If "costless = dishonest," human civilization is an evolutionary impossibility. Ask them to explain the stability of language without invoking costs for every sentence.

  **Bottom Line:** The slogan "honest signals must be costly" is a boundary condition for *evolutionary stability in high-conflict environments*, not a definition of *truth*. Using it to dismiss a speech act is category error. They are using a wrench to tighten a screw and complaining that the screw isn't bending.
