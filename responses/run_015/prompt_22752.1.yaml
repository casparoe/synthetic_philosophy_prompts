answer: |-
  This is a fantastic question. You have correctly identified that the tension isn't psychological (people aren't just "sheep"); it is structural and topological. As a signal detection theorist, you will appreciate that the difference lies entirely in the **channel capacity** and the **sufficiency of the statistics** passed between agents.

  In the Condorcet setting, you have a parallel architecture with high-bandwidth transmission. In the Cascade setting, you have a serial architecture with extreme lossy compression.

  Here is the precise breakdown of why the averaging mechanism breaks down in the cascade model.

  ### 1. The Information Structure: Parallel vs. Serial

  Let the true state of the world be $\theta \in \{0, 1\}$ with prior $P(\theta=1) = 0.5$.
  Each agent $i$ receives a private signal $s_i \in \{0, 1\}$.
  Signal quality: $P(s_i = \theta | \theta) = p > 0.5$.
  Crucially, in **both** models, the private signals $s_i$ are conditionally independent given $\theta$. The "noise" is independent.

  The divergence happens in what is observed and how decisions are aggregated.

  #### Condorcet (Parallel Aggregation)
  *   **Observation:** Agents do not observe each other. They only see $s_i$.
  *   **Action:** Agent $i$ votes $v_i = s_i$ (truthful voting is a dominant strategy).
  *   **Aggregation:** An external mechanism sums $\sum v_i$.
  *   **Information Flow:** The final tally is a sufficient statistic for the set of all signals $\{s_1, ..., s_N\}$.
  *   **Result:** Because the signals are conditionally independent, the variance of the sum scales with $N$, while the mean drift scales with $N$. The signal-to-noise ratio grows as $\sqrt{N}$. By the LLN, the probability of error goes to 0.

  #### Information Cascades (Serial Aggregation with Quantization)
  *   **Observation:** Agent $i$ sees private signal $s_i$ AND the history of **actions** $H_{i-1} = \{a_1, ..., a_{i-1}\}$. Note: They do **not** see the private signals $\{s_1, ..., s_{i-1}\}$.
  *   **Action:** Agent $i$ chooses $a_i \in \{0, 1\}$ to maximize $P(a_i = \theta | s_i, H_{i-1})$.
  *   **Aggregation:** There is no external counter. Agent $i+1$ must infer the weight of evidence from $a_i$.
  *   **The Bottleneck:** The action $a_i$ is a binary quantization of the agent's posterior belief. This is a many-to-one mapping.

  ### 2. The Mechanism of Failure: Censoring the Signal

  To see why averaging fails, we must look at the decision rule in terms of Log-Likelihood Ratios (LLR), which should be familiar terrain for you.

  Let $\lambda_{private} = \ln(\frac{p}{1-p}) > 0$ be the weight of a private signal.
  Let $\Lambda_{public}^{(i)}$ be the cumulative public LLR derived from history $H_{i-1}$.

  Agent $i$ computes their total posterior LLR:
  $$ \Lambda_{total}^{(i)} = \Lambda_{public}^{(i)} + \lambda_{private} \cdot (2s_i - 1) $$
  They choose $a_i = 1$ if $\Lambda_{total}^{(i)} > 0$, else $0$.

  **The Cascade Condition:**
  A cascade begins when the public weight outweighs the private weight. Specifically, if $|\Lambda_{public}^{(i)}| > \lambda_{private}$.
  In the standard binary case ($p \approx 0.51$ to $0.99$), this usually happens after just two agreeing predecessors.
  *   Agent 1: Follows $s_1$. ($a_1$ reveals $s_1$).
  *   Agent 2: If $a_1 \neq s_2$, they cancel out. If $a_1 = s_2$, weight is 2.
  *   Agent 3: If $a_1 = a_2$, then $\Lambda_{public}^{(3)} = 2\lambda_{private}$.
      Even if $s_3$ contradicts the history, $\Lambda_{total}^{(3)} = 2\lambda_{private} - \lambda_{private} = \lambda_{private} > 0$.
      Agent 3 **must** choose $a_3 = a_1$, regardless of $s_3$.

  **The Informational Collapse:**
  Here is the precise answer to your question about independence and averaging.
  When Agent 3 enters a cascade, their action $a_3$ is a deterministic function of $H_2$. It is **independent of $s_3$ conditional on $H_2$**.
  $$ P(a_3 | s_3, H_2) = P(a_3 | H_2) $$
  Because $a_3$ does not depend on $s_3$, observing $a_3$ provides **zero information** about $s_3$ to Agent 4.

  In signal fusion terms: Agent 3's sensor is effectively disconnected from the bus. Agent 4 receives a transmission from Agent 3, but that transmission contains only a replay of Agent 2's data.

  ### 3. Why Averaging Dies (Degrees of Freedom)

  In the Condorcet theorem, you are averaging $N$ independent random variables. You have $N$ degrees of freedom. The noise averages out because the errors are uncorrelated.

  In the Cascade model, once the cascade starts (say, at $k=3$), the actions $a_3, a_4, ..., a_N$ are **not independent samples of the state**. They are identical copies of the decision made at $k=2$.
  *   $a_3$ depends on $(s_1, s_2)$.
  *   $a_4$ depends on $(s_1, s_2)$ (because $a_3$ added no info).
  *   $a_N$ depends on $(s_1, s_2)$.

  You are not averaging $N$ signals. You are averaging **2 signals** ($s_1, s_2$) and repeating the result $N-2$ times.
  Repeating a measurement does not reduce variance. If I measure a voltage, get 5V, and write "5V" on a million sticky notes, the average of the notes is 5V, but my confidence in the true voltage does not increase beyond the precision of the first meter.

  The "independence of signals" you noted still exists mathematically ($s_i$ are still i.i.d.), but the **observability** of that independence is destroyed. The actions $a_i$ become perfectly correlated conditional on the early history. The system loses the ability to distinguish between "everyone agrees because the signal is strong" and "everyone agrees because they are copying."

  ### 4. "Conveys No New Information": A Precise Claim

  You asked to make the claim "conveys no new information" precise. In Bayesian terms, this means the Likelihood Ratio of the action is 1.

  Agent $i+1$ updates their belief based on observing $a_i$. The update factor is:
  $$ \frac{P(a_i | \theta=1, H_{i-1})}{P(a_i | \theta=0, H_{i-1})} $$

  **Outside a cascade:** $a_i$ depends on $s_i$. Since $s_i$ is correlated with $\theta$, this ratio is $\neq 1$. Information is gained.

  **Inside a cascade:** $a_i$ is deterministic given $H_{i-1}$.
  If the cascade is "Adopt", then $a_i = 1$ with probability 1, regardless of $\theta$.
  $$ P(a_i=1 | \theta=1, H_{i-1}) = 1 $$
  $$ P(a_i=1 | \theta=0, H_{i-1}) = 1 $$
  The Likelihood Ratio is $1/1 = 1$. The Log-Likelihood update is $\ln(1) = 0$.

  The posterior probability does not just stop improving; it literally **freezes**.
  $$ P(\theta | H_i) = P(\theta | H_{i-1}, a_i) = P(\theta | H_{i-1}) $$
  The public belief becomes a martingale that stops moving. It converges to a random variable (dependent on the first few signals) rather than converging to the truth (0 or 1).

  ### 5. Summary for the Signal Detection Engineer

  Think of the two models as different circuit topologies for fusing sensor data:

  1.  **Condorcet (Centralized Fusion):**
      *   $N$ sensors transmit raw binary data to a central processor.
      *   The processor sums the bits.
      *   Noise is uncorrelated across channels.
      *   **Outcome:** SNR improves with $\sqrt{N}$. Consistency is achieved.

  2.  **Cascade (Distributed Serial Fusion with Hard Decisions):**
      *   Sensor 1 makes a hard decision (0/1) and passes it to Sensor 2.
      *   Sensor 2 combines its own raw data with Sensor 1's hard decision, makes a new hard decision, and passes that to Sensor 3.
      *   **The Fatal Flaw:** The "hard decision" is a non-linear thresholding operation that discards the confidence magnitude.
      *   Once the cumulative weight of previous hard decisions exceeds the weight of a single sensor's raw data, the current sensor's output becomes a function *only* of the previous decisions.
      *   The raw data from Sensor 3, 4, ... $N$ is thresholded out of existence. It never enters the sum.
      *   **Outcome:** The system effectively runs on the data from the first 2 or 3 sensors. The rest are just repeaters. The error rate is bounded by the error rate of a 2-sensor fusion, not an $N$-sensor fusion.

  The tension you feel is resolved by recognizing that **Condorcet assumes the aggregator sees the signals (votes), while Cascades assume the aggregator sees only the decisions (actions).** The mapping from Signal $\to$ Decision is lossy. In Condorcet, that loss is irrelevant because the votes *are* the signals. In Cascades, that loss is catastrophic because the decisions obscure the signals for all future agents.
