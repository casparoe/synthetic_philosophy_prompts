prompt: |-
  I work on cost-benefit analysis for a government agency (econ background, basically no philosophy) and I keep running into something that feels like a contradiction in what we actually do. I'd like to know what we're committed to by doing it.

  Here's the practice. When we appraise a project we monetise everything. For stuff with markets we back the numbers out of behaviour: the value of a statistical life comes from the extra pay workers demand to take risky jobs, the value of clean air from what people pay for houses in less polluted neighbourhoods. For stuff with no market — a wetland, a species, a view — we can't do that, so we run surveys: describe the good carefully, remind people of their budget, then ask how much they'd pay in extra taxes to protect it, yes/no referendum style. Two more bits. First, we throw some answers out: people who are obviously answering strategically, people who are expressing a general warm feeling about the environment rather than about the specific good, people who name a number they plainly couldn't afford. Second, we use willingness to pay rather than willingness to accept compensation for the loss, even though for small changes those are supposed to come to roughly the same thing — and we prefer the one that gives the smaller number.

  So here's what puzzles me. The line I was taught is that utility isn't a thing inside your head, it's just a summary of your choices: nothing over and above what behaviour reveals. But the survey half of what we do behaves as if utility were a hidden quantity that behaviour and survey answers are both noisy evidence for, which is why we can clean the noise out, discard the answers that dont track it, and calibrate surveys against market behaviour. And then we discard some behaviour too: we dont count choices made in ignorance or under panic, and we'd never build an appraisal out of lab results showing people choose differently between two equivalent framings of the same gamble.

  So: what does the practice, taken as a whole, actually presuppose utility to be? Is it strictly committed to one answer, or could several different theories of what utility means license exactly the same thing we do? I'd like you to separate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's genuinely underdetermined.

  Two follow-ups if you have room.

  A colleague has proposed fixing the mess by routing every non-market valuation through a citizens' assembly: small group, gets briefing materials, hears both sides, deliberates for a weekend, and only its post-deliberation vote counts as the preference. Call it laundering. What does that proposal presuppose about preferences and about utility that the current method doesn't, and would it make the package more coherent or just add a second inconsistent layer on top?

  And the bit that bugs me most: willingness to pay scales with ability to pay, so benefits to poor people come out smaller and benefits to rich people come out larger. We do nothing about that in environmental appraisal, but in the health side of the same government the equivalent calculation counts a health gain the same whoever gets it. Is that an inconsistency the practice cant survive, or does it just show that willingness to pay is doing something other than measuring utility — standing in for opportunity cost in money terms, say? And what would have to change in the appraisal if we took the rival reading seriously?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **User Profile:** Government economist, cost-benefit analysis (CBA) practitioner, econ background, minimal philosophy.
      *   **Core Problem:** Perceived contradiction in CBA practice regarding the nature of "utility."
      *   **The Practice:**
          1.  Monetize everything.
          2.  Market goods: Revealed preference (RP) (e.g., hedonic pricing, value of statistical life).
          3.  Non-market goods: Stated preference (SP) (e.g., contingent valuation surveys).
          4.  Data Cleaning: Discard strategic answers, "warm glow" answers, unaffordable answers.
          5.  WTP vs. WTA: Use Willingness To Pay (WTP) over Willingness To Accept (WTA), often yielding lower numbers.
          6.  Exclusions: Ignore choices made in ignorance, panic, or framing effects.
      *   **The Tension:**
          *   Standard Econ Theory: Utility = Summary of choices (Revealed Preference). Nothing "inside the head."
          *   CBA Practice: Treats utility as a hidden quantity that both behavior and surveys *approximate*. Hence, cleaning data, discarding "bad" behavior (panic/ignorance), and calibrating surveys against markets.
      *   **The Questions:**
          1.  What does the practice *strictly presuppose* utility to be?
          2.  Is it committed to one answer, or underdetermined (could multiple theories fit)?
          3.  Separate strict presuppositions from comfortable fits.
      *   **Follow-up A (Citizens' Assembly):** Does routing non-market valuation through a deliberative body fix the mess or add inconsistency? What does it presuppose about preferences?
      *   **Follow-up B (Distribution/Equity):** WTP scales with income (rich value things more). Health side treats health gains equally. Is this a fatal inconsistency? Does WTP measure utility or opportunity cost? What changes if we take the rival reading seriously?

  2.  **Analyze the Core Tension (Revealed Preference vs. Mentalistic Utility):**

      *   *Samuelson's Revealed Preference (RP):* Utility is *defined* by choice. If you choose A over B, $U(A) > U(B)$. No room for "mistakes" unless constraints change.
      *   *CBA Practice:* We throw out choices (panic, ignorance) and survey answers (strategic, warm glow). This implies there is a "True Preference" or "True Welfare" that exists *independently* of the specific observed choice or statement.
      *   *Conclusion:* The practice *cannot* be strictly committed to strict Revealed Preference Theory. It implicitly commits to a **Mentalistic** or **Constructivist** view of utility (utility as a psychological state of well-being or satisfaction) that behavior *tracks* but does not *constitute*.
      *   *Underdetermination:* It fits with "True Preference" theories (what you *would* choose if informed/calm) and "Hedonic" theories (what actually makes you happy), but it doesn't strictly distinguish between them. It just assumes *something* normative exists behind the noise.

  3.  **Address Follow-up A (Citizens' Assembly):**

      *   *Current Method:* Aggregates existing individual preferences (consumer sovereignty), even if "cleaned."
      *   *Assembly Method:* Aggregates *deliberated* preferences.
      *   *Presupposition:* Preferences are malleable and can be "improved" through reason/discourse. It shifts from "Satisfying Wants" to "Judging Values."
      *   *Coherence:* It actually resolves the "ignorance/panic" exclusion problem more systematically. Instead of the economist arbitrarily deciding what counts as "informed," the process *makes* them informed.
      *   *Risk:* It changes the metric from "Individual Welfare" to "Public Reason/Collective Will." This might clash with the market side of CBA which remains individualistic. It adds a layer of *political* legitimacy on top of *economic* efficiency.

  4.  **Address Follow-up B (Distribution/Equity):**

      *   *The Issue:* WTP $\propto$ Income. A life saved for a rich person "counts" more in CBA than a poor person. Health QALYs usually treat a life year as equal regardless of income.
      *   *Is it fatal?* No, because CBA is technically about *Efficiency* (Kaldor-Hicks), not *Equity*. The standard line is "Do the efficiency calculation, then redistribute via tax/transfer."
      *   *WTP as Utility vs. Opportunity Cost:*
          *   If WTP = Utility: Then rich people literally get more utility from the same good (marginal utility of income differs).
          *   If WTP = Opportunity Cost (Shadow Price): It's just measuring the resource claim in money terms.
      *   *The Inconsistency:* It's not a logical contradiction within CBA, but it is a *normative* inconsistency across government departments (Environment vs. Health).
      *   *What changes?* If we treat WTP as purely monetary opportunity cost and care about equity, we need **Distributional Weights**. A dollar to a poor person counts for more than a dollar to a rich person. This moves CBA toward Social Welfare Function maximization rather than Potential Pareto Improvement.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, respectful of technical expertise, philosophically precise but accessible.
      *   *Structure:*
          1.  Introduction: Validate the intuition (yes, there is a tension).
          2.  Core Analysis: RP vs. Mentalistic Utility.
          3.  Strict Presuppositions vs. Underdetermination.
          4.  Follow-up A (Citizens' Assembly).
          5.  Follow-up B (Equity/Income).
      *   *Key Philosophical Concepts to weave in:* Revealed Preference (Samuelson), True Preferences (Sen/Nussbaum capabilities adjacent, or just "informed preference"), Constructed Preferences (Kahneman/Sugden), Kaldor-Hicks Efficiency, Distributional Weights.

      *(Self-Correction during drafting)*: Be careful not to say CBA *is* utilitarianism. It's usually Kaldor-Hicks. But the *measurement* of utility is the issue here.
      *Refining the "Utility" definition:* The practice treats utility as a **latent variable**. In psychometrics, you can't measure "intelligence" directly, so you use tests, but you discard bad test conditions. CBA treats "welfare" like "intelligence." Behavior is the test score.
      *Refining the WTP/WTA point:* The user notes they use WTP because it gives smaller numbers. This is pragmatic/biased, not theoretical. Endowment effect literature says WTA > WTP. Using WTP is a conservative bias, but theoretically problematic if property rights are assigned. I should mention this implies a specific assignment of rights (status quo bias).

  6.  **Final Polish:** Check against the user's constraints.
      *   "Separate what the practice strictly presupposes from what it merely fits comfortably with." -> Need a clear section for this.
      *   "Say where it's genuinely underdetermined." -> Need to highlight the Mentalistic vs. True Preference ambiguity.
      *   Address the "laundering" (Citizens' Assembly) and the "health vs. environment" equity issue.

  7.  **Final Review of the "Contradiction":**
      The user is right. Strict Revealed Preference forbids saying a choice is "wrong" unless there's a constraint. CBA says choices can be "wrong" (panic, ignorance). Therefore, CBA is *not* strict Revealed Preference. It is **Welfarism based on Informed Preferences**.

      *Wait, one nuance:* Sugden's "Community of Reason" or "Preference Construction." Maybe the practice presupposes preferences are *constructed* during the survey? No, the practice tries to *discover* pre-existing values (hence discarding "warm glow"). So it leans towards Realism about preferences.

      *Let's structure the answer clearly.*
      1.  The Ontology of Utility in CBA.
      2.  Strict Presuppositions vs. Comfortable Fits.
      3.  Follow-up A: Deliberative Valuation.
      4.  Follow-up B: Equity and the Nature of WTP.

      *(Self-Correction on Follow-up B)*: The user asks if WTP is measuring utility or opportunity cost. If it's opportunity cost, then equity weights are mandatory. If it's utility, then the rich *do* value it more (in money terms), but we might still weight it. I need to be precise here. The standard economic defense is "marginal utility of income." But the Health sector ignores this. The inconsistency is in the *Social Welfare Function* implicit in each department.

      *Okay, ready to write.*
answer: |-
  This is an exceptionally sharp diagnosis of the methodological foundations of Cost-Benefit Analysis (CBA). You have correctly identified that the operational practice of modern regulatory appraisal has drifted away from the strict neoclassical theory it claims to inhabit.

  Here is the breakdown of what your practice presupposes, where it is underdetermined, and an analysis of your two follow-ups.

  ### 1. The Ontology of Utility in CBA Practice

  You are right to feel a contradiction. Strict **Revealed Preference Theory (RPT)**, associated with Paul Samuelson, holds that utility is *defined* by choice. There is no "utility" inside the head; there is only the ordering revealed by action. Under strict RPT, you cannot discard a choice as "mistaken" unless the agent was constrained (e.g., lied to, physically forced). If a panicked person chooses X over Y, $U(X) > U(Y)$ by definition.

  Your agency's practice violates strict RPT in three ways:
  1.  **Data Cleaning:** Discarding survey responses as "strategic" or "warm glow" implies there is a *true* valuation distinct from the *stated* valuation.
  2.  **Paternalism:** Ignoring choices made in "ignorance or panic" implies preferences exist independently of the specific choice context.
  3.  **Calibration:** Treating market behavior and survey answers as noisy signals of the same underlying quantity implies utility is a **latent variable**.

  #### What the Practice Strictly Presupposes
  To make sense of your workflow, you are strictly committed to **Mentalistic Welfarism** (specifically, a version of **Informed Preference Theory**).

  *   **Utility is Real:** Utility is a psychological state or a normative standing that exists *prior* to measurement. It is a property of the person, not just a description of their transaction.
  *   **Behavior is Fallible Evidence:** Choices (market or survey) are imperfect proxies for this underlying utility. They are subject to "measurement error" (panic, framing, ignorance).
  *   **The Economist as Psychometrician:** Your role is not to record choices, but to estimate the latent variable by filtering out the noise. This is why you can discard a market choice (panic) and a survey choice (strategic bias) using different criteria but for the same goal.

  #### What is Merely a "Comfortable Fit"
  *   **Consumer Sovereignty:** You act *as if* the individual is the best judge of their welfare, but your data-cleaning rules undermine this. It fits comfortably with liberalism, but strictly speaking, you are asserting that the economist knows the "true" preference better than the panicked or ignorant chooser.
  *   **WTP vs. WTA:** Theoretically, if utility is a latent state, WTP and WTA should converge for small changes (income effects aside). Your preference for WTP because it yields "smaller numbers" is not a theoretical commitment; it is a **decision rule based on risk aversion regarding public spending**. It presupposes a status quo bias (property rights reside with the treasury, not the citizen), but it doesn't dictate a theory of utility.

  #### Where it is Genuinely Underdetermined
  Your practice does not distinguish between two competing theories of the "latent variable":
  1.  **Hedonic Utility:** The good is how much pleasure/satisfaction the person actually *experiences*.
  2.  **True Informed Preference:** The good is what the person *would choose* if they were calm, informed, and rational, regardless of whether it makes them happy (e.g., a person might "truly prefer" to save a wetland even if visiting it makes them miserable).

  Your surveys try to capture #2 (by describing the good carefully), but your market data captures a mix of #1 and #2. The practice works without resolving this because both theories predict similar "clean" data.

  ---

  ### Follow-up A: The Citizens' Assembly ("Laundering")

  Your colleague's proposal to use a deliberative citizens' assembly for non-market goods shifts the philosophical ground significantly.

  **What it Presupposes**
  Current CBA presupposes **Atomistic Preferences**: values exist inside individuals and are aggregated. The Assembly model presupposes **Constructed Public Reason**: values are formed through discourse and should reflect a collective judgment rather than individual consumption desire.

  It treats the "latent utility" not as a pre-existing psychological fact to be discovered (like finding a rock), but as a normative judgment to be forged (like making a law).

  **Coherence vs. Inconsistency**
  Paradoxically, this might make the package **more coherent** regarding the "ignorance/panic" problem.
  *   *Current Method:* The economist arbitrarily decides what counts as "informed" enough to keep a survey response. This is technocratic paternalism.
  *   *Assembly Method:* The process *guarantees* the condition of informed deliberation. It solves the "noise" problem procedurally rather than statistically.

  **The New Inconsistency**
  However, it creates a **hybrid inconsistency**. You would be measuring market goods using *individual consumer sovereignty* (Revealed Preference) and non-market goods using *collective civic judgment* (Deliberative Democracy).
  *   If a rich person buys a second home (market), their preference counts dollar-for-dollar.
  *   If that same person sits on the assembly and votes against protecting the wetland next to that home, their vote counts 1/N.
  *   This creates a dual-citizenship model: humans as *consumers* in the market sector, humans as *citizens* in the environmental sector. It is not logically fatal, but it abandons the idea that CBA measures a single, unified metric of "social welfare." It measures **Efficiency** in markets and **Legitimacy** in public goods.

  ---

  ### Follow-up B: Equity, Income, and the Nature of WTP

  This is the most critical tension. WTP is constrained by budget; therefore, WTP $\propto$ Income. If you value a statistical life (VSL) based on WTP, a rich person's life is "worth" more than a poor person's. The Health sector (using QALYs usually) typically treats a life-year as equal regardless of income.

  **Is this a fatal inconsistency?**
  No, not logically. It reflects a choice between two different normative frameworks:
  1.  **CBA (Environment/Transport):** Maximizes **Potential Pareto Improvement** (Kaldor-Hicks). It asks: "Does the gain exceed the loss in monetary terms?" It treats money as the numeraire.
  2.  **Health Appraisal:** Maximizes **Health Output** (utilitarian regarding health, egalitarian regarding persons). It treats health as the numeraire.

  **WTP: Utility or Opportunity Cost?**
  You asked if WTP is measuring utility or opportunity cost.
  *   **If WTP = Utility:** Then you are committed to the view that the rich derive more welfare from the same good (because the marginal utility of money is lower for them, they can afford to burn more of it for the same satisfaction). This is hard to defend ethically.
  *   **If WTP = Opportunity Cost (Shadow Price):** This is the stronger reading. WTP measures the *resource claim* required to satisfy a preference. A rich person commands more resources to be satisfied.

  **The Implication of the Rival Reading**
  If you accept that WTP measures resource claims (opportunity cost) rather than raw welfare units, and you acknowledge the Health sector's implicit equity constraint, you must introduce **Distributional Weights**.

  To make the practice coherent with the Health sector's egalitarianism, you would need to change the appraisal formula:
  $$ \text{Social Value} = \sum (\text{WTP}_i \times w_i) $$
  Where $w_i$ is a weight inversely proportional to income.

  **What would have to change?**
  1.  **Explicit Equity Weighting:** You would stop reporting raw Net Present Value (NPV) and start reporting Distributionally Weighted NPV. A dollar of benefit to a poor household would count as, say, $1.50 in the appraisal; a dollar to a rich household as $0.80.
  2.  **Separation of Efficiency and Equity:** Currently, your practice hides the equity assumption (that money is the metric of value) inside the efficiency calculation. Taking the rival reading seriously requires splitting the report: "The project is efficient (positive raw NPV) but regressive (negative weighted NPV)."
  3.  **VSL Adjustment:** You would need to adjust the Value of a Statistical Life not just for inflation, but for the income distribution of the affected population.

  **Conclusion on B:** The inconsistency is not in the *math*, but in the **Social Welfare Function**. The Environment agency is implicitly using a Utilitarian function weighted by income ($\sum \text{Income} \times \text{Utility}$). The Health agency is using a Prioritarian or Egalitarian function ($\sum \text{Health}$). The practice can survive without fixing this, but only by accepting that the government speaks with two different moral voices depending on the department. To unify them, you must adopt distributional weights, which admits that WTP is a measure of *power to command resources*, not a measure of *human welfare*.

  ### Summary
  Your practice is not committed to Revealed Preference. It is committed to **Informed Preference Realism** (utility is a latent truth behavior approximates). It is underdetermined between hedonic and normative theories of that truth.

  The Citizens' Assembly would fix the "information" problem but create a "consumer vs. citizen" duality. The income/WTP issue reveals that you are measuring resource claims, not welfare; fixing the inconsistency with Health requires explicit distributional weighting, transforming CBA from a tool of efficiency into a tool of social welfare maximization.
