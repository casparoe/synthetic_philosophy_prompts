answer: |-
  Start by writing the question on the whiteboard exactly as you phrased it and tell them you are not looking for a vote but for a definition of terms, because everyone in that room already knows what a computer is and everyone knows what a brain is, but the friction is in the word is. You need to let the obvious yes and obvious no crowd speak first or they will simmer all hour, so give them ten minutes to clash over neurons as switches versus neurons as analogue messy wetware, but intervene before they settle into engineering specifics. Tell them you are parking that debate because both sides are assuming the answer lies in the hardware, whereas the real philosophical weight is in whether calling it a computer explains anything new. This sets the stage for the heart analogy, which you should introduce immediately after calming the hardware debate. Ask them if saying the heart is a pump changes how we study cardiology, and the answer is generally no because the pump description is a physical redescription of what the heart was already mechanically doing. Then ask if saying the brain is a computer changes how we study cognition, and this is where the room should feel the tension. If it is just a redescription like the heart, computationalism is trivial. If it is an explanatory claim, it must do work that physics alone does not.

  The one example that needs to carry the session is a case of visual recognition, specifically the difference between a stroke damaging the visual cortex and a hallucination where the cortex is intact but the perception is false. This example must have a clear physical substrate that can suffer damage and a clear output that can be judged against reality, but it must lack any reference to consciousness or feeling so the engineers do not drift into qualia. You need them to focus on the system's function, not its experience. This case works because it isolates the difference between a system that stops working and a system that works perfectly but outputs false information. For this example to do the job it must have a condition of correctness, meaning there is a fact of the matter about whether the output matches the world, and it must lack any ambiguity about whether the hardware is physically intact. If you use a calculator, they will say it is obviously a computer. If you use a rock, they will say it is obviously not. The brain during a hallucination sits in the middle, functioning physically while failing representationally.

  Place your test right after you have established the heart analogy and introduced the hallucination case. Your test about the difference between broken and miscomputing is a strong one for this audience because it appeals to the engineering concept of failure modes. Put it to them by asking if a brain that hallucinates is broken in the same way a heart with a murmur is broken. If the brain is just a physical object like a heart, it cannot miscompute, it can only behave differently according to physics. If it is a computer, it can be physically perfect and still be wrong about the world. This test is not bad, but you must warn them that it only works if they agree the brain is in the business of representing the world in the first place. A rock does not miscompute when it falls because it is not trying to represent anything. So your test proves the brain computes only if we already assume the brain has goals or representations. Tell them this explicitly so the skeptics do not dismiss it as begging the question. Use this moment to drive home the distinction you want them to reach, which is that computationalism is only interesting if it explains how physical stuff gets to be about something else, which is the explanatory work versus the redescription.

  You need to be ready for three wrong turns in a specific order. The first will come early, usually right after the opening clash, when someone raises the possibility of uploading minds to a disk. Cut this off immediately by saying that portability is a consequence of the theory, not a test of the theory, and that asking if we can upload ourselves assumes the answer to whether we are computers in the first place. The second wrong turn will happen midway, likely during the discussion of your test, when the analogue versus digital debate resurfaces with someone insisting neurons do not have clock cycles. Cut this off by stating that computation does not require a clock in the philosophical sense, only distinguishable states, and that getting bogged down in signal continuity misses the point of whether the state changes carry information. The third wrong turn will come near the end when the chap who thinks it is all just loose talk insists that brains are wet and computation is just a metaphor. Do not let him dismiss it as merely metaphorical without challenge. Tell him that if it is just a metaphor, it should be discardable without loss of explanatory power, and ask him to explain vision without using any information processing terms. If he cannot, then it is doing work beyond being a loose figure of speech.

  For the final question, ask them whether replacing the word computes with the word processes in every sentence of a psychology textbook would change the predictions we make about behavior. If they say no, they have settled on redescription. If they say yes, they believe computation does explanatory work. This will show you if they grasped the distinction or just enjoyed the argument. Finally, there are things you must openly refuse to explain. Do not attempt to define computation formally using Turing machines or logic gates because that will hand the session over to the engineers who know it best and lose the philosophers. State clearly that you are treating computation as a functional concept of input-output transformation with correctness conditions, not a mathematical one. Also refuse to solve the hard problem of consciousness. If someone asks if a computer feels pain, tell them that today is about whether the brain computes, not whether computers feel, and that conflating the two will confuse the structural question with the experiential one. Say this out loud rather than bluffing because your authority comes from managing the scope, not knowing all the answers. Keep the focus on the difference between a thing that is damaged and a thing that is wrong, and you will get them to the heart of the matter without needing slides.
