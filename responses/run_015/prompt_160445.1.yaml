prompt: |-
  ok so before I read any more proposed solutions I want the spec, because I think half the arguing in this area is people scoring theories against requirements nobody actually stated.

  Setup so we don't talk past each other. The Pasadena game: fair coin, tossed until it first lands heads; if the first heads is on toss n you recieve (−1)^{n−1}·2^n/n, so +2, −2, +8/3, −4, +32/5 … with probabilities 1/2, 1/4, 1/8, 1/16 … The expectation comes out as the alternating harmonic series, which sums to about +0.69 but only conditionally, and the absolute expectation is the harmonic series, which diverges. So on the usual bookkeeping the expected value doesn't exist, and by Riemann rearrangement you can make the sum come out to whatever you like by reordering terms.

  What I want is not "what's the ticket worth". It's: what does a rule for choosing have to deliver to count as adequate for gambles like this? And I want the purpose fixed up front, since I suspect a lot of the disagreement is people answering different questions. My purpose: a decision procedure for an actual agent — bounded, living through time, has to say yes or no to one ticket now, may get the chance to sell or hedge it partway through, does not get to survey infinitely many outcomes. Not a ranking of abstract gambles for an ideal agent. Tell me if that purpose is ill-posed.

  Cases I think the list has to cover, with why I think each bites — add ones I've missed and drop any that are really just camp prejudice:

  1. Truncation. Chop the game off at toss N; now expectation exists and is the Nth partial sum, which oscillates around 0.69 and converges to it. Does a theory have to be continuous with its own verdicts on the truncations, or is the infinite case allowed to come apart from the limit of the finite ones?
  2. Sure shifts. Is Pasadena-plus-a-sure-pound strictly better than Pasadena? If a theory says "meh, indifferent", I think it's pumpable; say whether that's right and what the requirement really is.
  3. Bundling and repetition. One ticket or two independent ones? And the long-run worry: since E|X| is infinite, the strong law doesn't apply, so nobody gets to justify a price by "you'll average out over many plays". Is that a desideratum (don't smuggle in frequentist support the maths doesn't give you) or is it fine to be silent on repeat play?
  4. Redescription. Sell the same gamble to me as a rearranged series, or split into stages, or bundled with an unrelated gamble. Must the verdict be invariant? If yes, say what does the invariant-making — what feature of the game fixes the "real" order.
  5. Mid-game revaluation, the one I care most about. Conditional on the first k tosses all being tails, the natural-order conditional expectation is roughly −0.61 after one tail, +0.77 after two, about −1.12 after three, and the swings keep doubling in size. So a natural-order agent's willingness to pay to keep or sell the ticket flip-flops with growing magnitude as the game goes on. Does an adequate theory owe us a verdict on what that agent may pay at each point, does it owe dynamic consistency / no money pump, and is "no money pump" here a genuine requirement or does it quietly presuppose the expectation-based pricing that's the thing in question? (My arithmetic is back-of-envelope; correct me if I've botched it.)
  6. Bounded utility. If utility is bounded in money, the series converges absolutely and the problem evaporates. Is "handle the case where utility is genuinely unbounded" a requirement, or is dissolving it by bounding utility a legitimate answer?
  7. Ordinary cases. Must the theory reproduce expected-utility verdicts wherever expectation does exist? Is that non-negotiable, and does it have to solve the St Petersburg game as well or is that allowed to be a separate problem?

  Deliverable: the requirements list, each with the case or consideration behind it, marked non-negotiable vs preference-of-a-camp. Tell me which single requirement excludes the most candidate theories, and which pair you think can't be jointly satisfied — my guess is determinacy (every gamble gets a verdict) plus invariance under redescription, but make the case and name a different pair if that's not where the real conflict is. Also: people say paying any particular finite amount for the ticket feels arbitrary in a way that paying for a St Petersburg ticket doesn't. Is that a desideratum or a prejudice? A one-line-per-family scorecard at the end is fine — expectation-free dominance/structural views, nonstandard-expectation views, weak-expectation views, permissive-range views, bounded-utility views — but keep the weight on the criteria, that's the bit I can't do myself. And write it in British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Topic:** The Pasadena Game (a variant of the St. Petersburg paradox involving a conditionally convergent series).
      *   **Goal:** Define a *specification* (requirements list) for a decision theory adequate for this specific problem, *before* evaluating solutions.
      *   **Purpose:** A decision procedure for an *actual, bounded agent* living through time (not an ideal agent ranking abstract gambles).
      *   **Tone/Style:** British English, rigorous, analytical, avoiding camp prejudice.
      *   **Specific Tasks:**
          *   Validate/refine the user's proposed cases (1-7).
          *   Produce a requirements list (Non-negotiable vs. Preference).
          *   Identify the most exclusionary requirement.
          *   Identify the most conflicting pair of requirements.
          *   Address the "arbitrariness" intuition.
          *   Provide a brief scorecard of theory families against the criteria.
          *   Check the user's arithmetic on mid-game revaluation.

  2.  **Deconstruct the Pasadena Game:**
      *   Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$ with probability $p_n = \frac{1}{2^n}$.
      *   Expected Value (EV): $\sum \frac{1}{2^n} (-1)^{n-1} \frac{2^n}{n} = \sum \frac{(-1)^{n-1}}{n} = \ln(2) \approx 0.693$.
      *   Absolute Expectation: $\sum \frac{1}{2^n} \left| (-1)^{n-1} \frac{2^n}{n} \right| = \sum \frac{1}{n} = \infty$.
      *   Key Issue: The series is conditionally convergent. Riemann Rearrangement Theorem applies. The order of summation matters for the value. The "natural order" is usually taken as temporal (toss 1, toss 2...), but is that normatively binding?

  3.  **Evaluate the User's Cases (1-7):**
      *   *1. Truncation:* Crucial. If a theory disagrees with the limit of finite truncations, it needs a strong justification. For a bounded agent, all games are effectively truncated by lifespan/resources.
      *   *2. Sure Shifts (Dominance):* Pasadena + £1 > Pasadena. This is basically State-wise Dominance. If a theory fails this, it's vulnerable to money pumps. Non-negotiable for a practical agent.
      *   *3. Bundling/Repetition:* Strong Law of Large Numbers (SLLN) fails because $E[|X|] = \infty$. Frequentist justification is unavailable. A theory shouldn't rely on long-run averaging if the math doesn't support it.
      *   *4. Redescription (Invariance):* The core of the Pasadena problem. Does reordering terms change the value? If yes, the theory is frame-dependent. If no, how does it pick the value (since different orders yield different sums)?
      *   *5. Mid-game Revaluation (Dynamic Consistency):* The user's arithmetic check is needed here.
          *   Payoff given first heads at $n$: $x_n$.
          *   Conditional on $k$ tails: Game effectively restarts but shifted? No, the payoff structure is fixed to the *original* index $n$.
          *   If $k$ tails observed, we know $n > k$.
          *   Conditional EV = $\frac{1}{P(n>k)} \sum_{n=k+1}^\infty p_n x_n$.
          *   $P(n>k) = 1/2^k$.
          *   Sum part: $\sum_{n=k+1}^\infty \frac{(-1)^{n-1}}{n}$. This is the tail of the alternating harmonic series.
          *   The tail of a convergent series goes to 0. Wait. The alternating harmonic series converges to $\ln(2)$. The *tail* $\sum_{n=k+1}^\infty \frac{(-1)^{n-1}}{n}$ approaches 0 as $k \to \infty$.
          *   However, the *conditional expectation* calculation involves dividing by $1/2^k$.
          *   Let's check the user's claim: "swings keep doubling in size".
          *   Conditional EV given $k$ tails = $2^k \times (\text{Tail of Alt Harmonic starting at } k+1)$.
          *   The tail of the alternating harmonic series is roughly $\frac{(-1)^k}{2(k+1)}$ (alternating series estimation).
          *   So Conditional EV $\approx 2^k \cdot \frac{(-1)^k}{2k}$. This *does* explode in magnitude as $k$ increases.
          *   User's arithmetic is qualitatively correct (exploding oscillation). This creates a massive dynamic consistency problem.
      *   *6. Bounded Utility:* Is this a solution or a dodge? For a *bounded agent*, utility *is* bounded (saturation of value). But if we treat it as a theoretical test of unbounded utility theories, ruling it out by fiat avoids the paradox. I should classify this as a "dissolution" strategy rather than a requirement for a theory handling unbounded utility.
      *   *7. Ordinary Cases:* Extensional adequacy. If it breaks standard EV where EV works, it's broken. Non-negotiable.

  4.  **Drafting the Specification (The "Deliverable"):**
      *   Need to distinguish between *Normative Requirements* (must haves) and *Theoretical Preferences* (nice to haves).
      *   *Context:* Bounded agent, single decision, temporal extension.
      *   *Language:* British English (colour, behaviour, programme, analyse, etc.).

  5.  **Identifying Conflicts:**
      *   *Determinacy vs. Invariance:* If the value depends on the order of summation (natural vs. rearranged), you can't have both a unique determinate value and invariance under redescription *unless* you privilege one order (e.g., temporal).
      *   *Dynamic Consistency vs. Standard EV:* As shown in case 5, standard conditional EV leads to exploding valuations. Maintaining dynamic consistency might require abandoning standard conditional expectation.
      *   *Most Exclusionary:* Likely "Dominance + Unbounded Utility". Many theories solve Pasadena by bounding utility. If we demand unbounded utility handling, many drop out.
      *   *Most Conflicting Pair:* **Invariance under Redescription** vs. **Determinacy**. If the series is conditionally convergent, different descriptions (orders) yield different sums. To be invariant, you must reject the sum as the value. To be determinate, you must pick a sum. You can't do both without privileging a specific frame (which violates invariance).

  6.  **Refining the "Arbitrariness" Intuition:**
      *   User asks: Is feeling that a specific price is arbitrary a desideratum or prejudice?
      *   In St. Petersburg, *any* finite price looks good (infinite EV). In Pasadena, *some* prices look bad (negative EV possible via rearrangement).
      *   It's a desideratum of *stability*. If small changes in belief or framing change the verdict wildly, the theory isn't action-guiding.

  7.  **Scorecard:**
      *   *Standard EV:* Fails (undefined).
      *   *Weak Expectation (Nover & Hájek):* Tries to salvage EV. Struggles with dominance/rearrangement.
      *   *Bounded Utility:* Solves it, but user might view as dodging the "unbounded" requirement.
      *   *Dominance/Structural:* Focus on state-wise comparison. Good on dominance, tricky on pricing.
      *   *Permissive/Range:* Says "no unique value". Good on honesty, bad for decision-making (needs a choice rule).

  8.  **Review against Constraints:**
      *   British English? Yes.
      *   Purpose fixed? Yes (bounded agent).
      *   Check arithmetic? Yes (confirmed exploding conditional EV).
      *   Requirements list marked? Yes.
      *   Conflict identification? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between the *mathematical* problem (conditional convergence) and the *decision-theoretic* problem (action guidance) is clear.
      *   Make sure the "Mid-game" arithmetic correction is polite but precise.
      *   Ensure the "Non-negotiable" vs "Preference" distinction is sharp.

  *(Self-Correction during drafting)*: I need to be careful with Case 5. The user says "swings keep doubling".
  Tail of $\sum \frac{(-1)^{n-1}}{n}$ after $k$ terms is approx $\frac{(-1)^k}{2k}$.
  Conditional probability mass remaining is $1/2^k$.
  Conditional Expectation = $\frac{\text{Tail Sum}}{\text{Prob}} = \frac{(-1)^k / 2k}{1/2^k} = (-1)^k \frac{2^{k-1}}{k}$.
  Yes, this grows exponentially. The user's intuition is correct. I will confirm this.

  *(Refining the Conflict)*: Is it Determinacy vs Invariance? Or is it Dominance vs Unboundedness?
  Actually, the deepest conflict in Pasadena specifically is **Invariance under Redescription** vs **Agreement with Natural-Order Truncations**.
  If you agree with truncations (natural order), you get $\ln(2)$.
  If you allow rearrangement (invariance), you can get $-\infty$ or $+\infty$ or any real number.
  So you cannot have Invariance *and* Determinacy *and* Agreement with Natural Order.
  I will frame the conflict as **Invariance vs. Determinacy** given the mathematical reality of conditional convergence.

  *(Final check on British English)*: "Programme", "analyse", "behaviour", "favour", "modelling". Avoid "z" in "realize" etc.

