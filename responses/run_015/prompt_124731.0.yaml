answer: |-
  ### Degeneration Tiers

  **Tier 1: The Crash (0–10 Rounds)**
  *   **Quorum Echo:** Mathematically guarantees a hard lock by round 12 (12 players + 1), or goes molten if the rule is amended early to lower the threshold.
  *   **Precedent Lock:** Loophole hunters will define "All rule changes" as one "Kind" with a "Dictator decides" procedure in the first 48 hours.

  **Tier 2: The Grind (11–20 Rounds)**
  *   **Entrenchment Ladder:** A temporary majority faction can lock the game into a stalemate by entrenching contradictory rules, or strip protections to seize control.
  *   **Imported Authority:** The game bogs down in procedural disputes about the external document until players stop proposing changes out of exhaustion.

  **Tier 3: The Marathon (21–30+ Rounds)**
  *   **Ratify-under-successor:** High friction stabilizes the system; the double-vote requirement prevents sudden coups and forces sustained coalitions.
  *   **Self-mention Void:** Purely syntactic; it constrains drafting but does not alter power dynamics or voting thresholds, so the game flows until players naturally burn out.

  ***

  ### Architecture Ratings

  **1. Ratify-under-successor**
  *   **Strategy:** 7/10 — Forces players to build coalitions that remain stable across two distinct voting windows.
  *   **Faction Resistance:** 8/10 — A three-person faction cannot quietly seize control because the second vote reveals shifts in consensus under the new regime.

  **2. Quorum Echo**
  *   **Strategy:** 2/10 — Reduces the game to an attendance check rather than a debate on rule merit.
  *   **Faction Resistance:** 3/10 — A faction of three only needs to coordinate abstentions among the majority to trigger a lockout.

  **3. Self-mention Void**
  *   **Strategy:** 3/10 — Creates minor drafting puzzles but no meaningful leverage over other players.
  *   **Faction Resistance:** 9/10 — Prevents no power grabs, but offers no tools for a faction to exploit for dominance either.

  **4. Entrenchment Ladder**
  *   **Strategy:** 8/10 — Turns rule protection into a scarce resource that must be budgeted against future flexibility.
  *   **Faction Resistance:** 4/10 — Once a faction secures a bare majority, they can permanently lock out the minority by entrenching their preferred rules.

  **5. Precedent Lock**
  *   **Strategy:** 9/10 — Offers deep meta-game classification strategy, but the game breaks before the strategy can mature.
  *   **Faction Resistance:** 1/10 — The first faction to propose a broad "Kind" definition can rewrite the entire constitution in a single turn.

  **6. Imported Authority**
  *   **Strategy:** 5/10 — Shifts strategic burden from game logic to external knowledge of the imported document.
  *   **Faction Resistance:** 7/10 — High barrier to entry once imported, but the initial import vote is a single point of failure for a majority faction.

  ***

  ### The Pairing: Ratify-under-successor + Entrenchment Ladder

  Ship **Ratify-under-successor** and **Entrenchment Ladder** together.

  Individually, Entrenchment Ladder is vulnerable to a bare majority locking in power, and Ratify-under-successor can be sluggish. Together, they create a "constitutional bootstrap" constraint: to pass a rule that requires a 2/3 vote (entrenchment), the *second* ratification vote must successfully achieve that 2/3 threshold under the new rules. This means a faction cannot use a simple majority to quietly entrench their power; they must already possess the supermajority they are trying to codify. This interaction forces broad consensus for permanent changes while allowing simple majorities to handle temporary administrative tweaks, perfectly balancing stability with playability for a 30-day arc.
