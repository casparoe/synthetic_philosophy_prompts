  2.  **Analyze the Architectures:**

      *   **1. Ratify-under-successor:** Double voting (before and after).
          *   *Mechanic:* High friction. To change a rule, you need majority under old rules AND majority under new rules.
          *   *Risk:* Lockup. If the new rules make passing harder, the second vote fails. If the new rules make passing easier, the first vote might fail because people fear the change.
          *   *Loophole:* Can you propose a change that lowers the threshold for the second vote? Yes, but the second vote still happens under the *new* rules. If the new rules say "majority is 1 vote", the second vote is easy. The bottleneck is the first vote.
          *   *Stability:* High friction slows things down. Might stall out.

      *   **2. Quorum echo:** Quorum = Previous voters + 1.
          *   *Mechanic:* Escalating participation requirement.
          *   *Risk:* Lockup. 12 players max. If round 1 has 5 voters, round 2 needs 6. Round 3 needs 7... Round 8 needs 12. Round 9 needs 13 (Impossible).
          *   *Stability:* Guaranteed hard lockup within 12 rounds unless the rule is repealed. But repealing counts as a vote, so it escalates too.
          *   *Loophole:* Abstaining counts as not voting. Can you force people to vote? No.
          *   *Degeneration:* Very fast lockup.

      *   **3. Self-mention void:** Rule text containing its own number is void. (Rule 4).
          *   *Mechanic:* Syntactic restriction.
          *   *Risk:* Molten/Chaotic. It prevents self-reference in text, but doesn't stop procedural changes.
          *   *Stability:* Low impact on game flow, high impact on drafting.
          *   *Loophole:* Don't write the number in the text. Refer to it as "this rule" or "the entrenchment rule".
          *   *Degeneration:* Doesn't really cause degeneration on its own, just a constraint.

      *   **4. Entrenchment ladder:** Tags for 2/3 or Unanimity. Tagging rule is mutable majority.
          *   *Mechanic:* Variable difficulty.
          *   *Risk:* Molten. A majority faction can tag their favorable rules as "double-entrenched" and opposition rules as "mutable". Or they can just repeal the tagging rule.
          *   *Stability:* Classic Nomic. The "tagging rule" being mutable is the weak point.
          *   *Loophole:* Majority seizes control, entrenches their power, changes tagging rule to require unanimity to *remove* entrenchment.
          *   *Degeneration:* Mid-game lockup or molten depending on faction speed.

      *   **5. Precedent lock:** First pass defines procedure for that "kind" of change. Proposer defines "kind".
          *   *Mechanic:* Crystallizing procedure.
          *   *Risk:* Molten/Chaos. The proposer asserts what "kind" a change is. If the majority approves the assertion, it sets precedent.
          *   *Stability:* Low. A cunning faction can propose a "kind" that covers everything (e.g., "All rule changes are Kind Alpha") and set the procedure to "Dictator decides".
          *   *Degeneration:* Fast. Within a few rounds, a smart player can categorize all future changes into a box with easy rules.

      *   **6. Imported authority:** Import outside doc (e.g., Robert's Rules). Amending requires *that* doc's procedure.
          *   *Mechanic:* External hard lock.
          *   *Risk:* Lockup. Real parliamentary procedure is hard to use for game rules. Amending the imported doc is impossible for players.
          *   *Stability:* High rigidity.
          *   *Loophole:* Import a doc that is easy to amend, or import a doc that allows the game to "export" itself. But the prompt says "no player is in a position to run" the external procedure.
          *   *Degeneration:* Slow lockup. The game becomes bogged down in external bureaucracy until someone proposes to repeal the import (which requires the external procedure, which is impossible). Game freezes.

  3.  **Tiering by Degeneration Time (12 players, 30 rounds max):**

      *   *Tier 1 (Fast Crash < 10 rounds):* Quorum Echo (mathematically guaranteed lock), Precedent Lock (fast exploitation).
      *   *Tier 2 (Mid-Game Risk 10-20 rounds):* Entrenchment Ladder (faction warfare), Imported Authority (bureaucratic freeze).
