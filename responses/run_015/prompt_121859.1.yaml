  *(Self-Correction Note)*: I need to be careful with the "Preface Paradox" analogy. In the Preface Paradox, the author believes $p_1, p_2... p_n$ but also believes $\neg(p_1 \land p_2... \land p_n)$. In auditing, the auditor asserts "The statements are fair" (Aggregate) while acknowledging "There are errors $e_1, e_2...$" (Components). The auditor does *not* assert each transaction is correct. So the Preface Paradox applies only if we assume the opinion implies transaction-level truth. I need to argue that the opinion *does not* imply transaction-level truth, which dissolves the paradox structurally, but creates a pragmatic tension.

