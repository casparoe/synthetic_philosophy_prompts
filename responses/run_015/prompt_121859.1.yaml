          *   *Epistemology:* This is *Inference to the Best Explanation* or *Statistical Induction*. It is stable *if* one accepts fallibilism.
          *   *The Paradox:* It *is* the Lottery Paradox relocated. We accept "No material error exists" while knowing "It is probable some error exists."
