answer: |-
  ### Desiderata for a Theory of Moral Learning from Biography

  An adequate theory of moral learning from biography must account for the specific pedagogical mechanisms employed in Plutarch's *Parallel Lives* and the hagiographic tradition. These traditions differ in structure and intent but share the core assumption that narrative accounts of human lives can cultivate virtue in the reader. The following desiderata outline the necessary conditions for such a theory, distinguishing between non-negotiable constraints and camp-specific preferences, while highlighting psychological and structural tensions.

  ---

  #### 1. The Granularity of Emulation Distinction
  *   **Phenomenon Protected:** The distinction between learning a specific **virtue** (e.g., courage, temperance) and learning a **life-pattern** (a holistic way of being).
  *   **Motivating Case:** In Plutarch's *Alexander*, the reader is not invited to conquer Persia (a life-pattern impossible to replicate) but to emulate Alexander's *megalopsychia* or his discipline in specific moments. Conversely, in the *Life of St. Antony*, the hagiographic reader is often invited to adopt a total life-pattern (ascetic withdrawal) as a vessel for specific virtues. A theory fails if it treats biography merely as a repository of discrete maxims or, conversely, as a script for total replication.
  *   **Psychological Accommodation:** The theory must accommodate research on **analogical transfer**. Learners must be able to abstract a principle from a specific context (ancient battle, desert solitude) and apply it to a dissimilar context (modern boardroom, urban life) without losing the moral content.
  *   **Status:** **Non-negotiable.** Any theory that collapses virtue into life-pattern renders biography useless for anyone not living in the subject's exact circumstances; any theory that reduces life to discrete maxims ignores the narrative unity essential to character formation.

  #### 2. The Psychological Distance Constraint
  *   **Phenomenon Protected:** The balance between **admiration** and **attainability**. This protects against the phenomenon of **disillusionment**, where a model is perceived as too perfect to emulate, leading to moral disengagement rather than inspiration.
  *   **Motivating Case:** Plutarch frequently highlights the flaws of his subjects (e.g., Cato's stubbornness, Alcibiades' excess) to keep them human. Hagiography, however, often suppresses vice to present a vessel of divine grace. A theory must explain how moral learning occurs in *both* cases: how Plutarch's flawed heroes inspire without repelling, and how Hagiography's idealized saints inspire without causing the reader to feel the task is impossible.
  *   **Psychological Accommodation:** The theory must integrate findings from Social Cognitive Theory regarding **self-efficacy**. If the perceived gap between the learner and the model is too wide, emulation drops. The theory must explain the mechanism (e.g., divine assistance in hagiography, shared human frailty in Plutarch) that bridges this gap.
  *   **Status:** **Non-negotiable.** A theory that assumes perfect models always motivate better learning contradicts empirical data on disillusionment and cannot account for the pedagogical success of Plutarch's nuanced portraits.

  #### 3. The Structural Teleology Requirement
  *   **Phenomenon Protected:** The distinction between the **comparative structure** of paired lives (Plutarch) and the **singular focus** of hagiography.
  *   **Motivating Case:** Plutarch's *Parallel Lives* end with a *synkrisis* (comparison), forcing the reader to judge relative merits (e.g., Is Demosthenes' eloquence better than Cicero's?). This trains moral *judgment* rather than just imitation. Hagiography focuses on a singular archetype (the Saint) to train moral *devotion* and alignment with a divine standard. A theory must explain how the *relation* between lives generates moral insight in Plutarch, distinct from the *intensity* of focus in Hagiography.
  *   **Psychological Accommodation:** The theory must account for **contrast effects** in judgment. Comparative structures highlight specific traits by juxtaposition, whereas singular structures rely on narrative depth to generate empathy and identification.
  *   **Status:** **Camp Preference.** A theorist focused on critical moral reasoning will prioritize the Plutarchan comparative model. A theorist focused on spiritual formation or character unity will prioritize the Hagiographic singular model. An adequate theory need not prefer one, but must be able to describe the moral learning unique to each structure.

  #### 4. The Veracity-Edification Accommodation
  *   **Phenomenon Protected:** The tension between **historical fidelity** and **moral utility**. This explains why **idealization and selective suppression of vice do not always corrupt moral education**.
  *   **Motivating Case:** Plutarch famously states, "I am writing lives, not histories," admitting to omitting details that do not serve character analysis. Hagiographers often alter factual details to highlight spiritual truths (e.g., miraculous interventions). A theory fails if it claims that factual falsehood necessarily entails moral falsehood. It must explain how a "truth of character" can survive "factual embellishment."
  *   **Psychological Accommodation:** The theory must distinguish between **propositional belief** (believing the event happened exactly so) and **narrative truth** (believing the character motivation is authentic). Moral learning often relies on the latter.
  *   **Status:** **Non-negotiable.** If a theory demands strict historical accuracy as a precondition for moral learning, it invalidates the entire hagiographic tradition and large swathes of Plutarch's project, both of which have historically functioned as primary moral texts.

  ---

  ### Tensions and Incompatibilities

  #### Jointly Unsatisfiable Pair: Strict Historical Fidelity vs. Unambiguous Moral Exemplar
  There is a strong suspicion that **Strict Historical Fidelity** and the **Unambiguous Moral Exemplar** requirement are jointly unsatisfiable.
  *   **The Conflict:** Historical reality is morally ambiguous; even "great" men possess complex, often contradictory motives (as Plutarch acknowledges). To present an *unambiguous* exemplar (as hagiography often does), one must suppress or reinterpret historical data.
  *   **The Consequence:** A theory demanding both strict factual accuracy *and* clear, unconflicted moral modeling will find no actual biographies that satisfy it. It forces a choice: either the biography is history (messy, ambiguous) or it is moral instruction (curated, idealized). Plutarch chooses the latter by sacrificing the former; Hagiography chooses the latter by transcending the former.

  #### The "Killer Constraint"
  The single requirement that, if strictly enforced, eliminates the most existing accounts is **The Psychological Distance Constraint (specifically regarding Attainability).**

  *   **Reasoning:** Many traditional philosophical accounts of moral exemplarism (particularly Kantian or high Idealist accounts) posit the "Saint" or the "Sage" as a perfect rational ideal. They assume that the mere presentation of the perfect good motivates the will.
  *   **Elimination:** Enforcing the Psychological Distance Constraint eliminates these accounts because psychological evidence suggests that perfect models often induce **demotivation** or **moral licensing** (the "I could never be that good, so I won't try" response).
  *   **Impact:** This constraint forces theories to account for *how* flawed figures (Plutarch) or divinely-assisted figures (Hagiography) bridge the gap between the human and the ideal. Accounts that rely solely on the "power of the ideal" without a mechanism for perceived attainability fail this constraint.

  ### Summary of Status

  | Desideratum | Status | Rationale |
  | :--- | :--- | :--- |
  | **Granularity of Emulation** | Non-negotiable | Without it, biography is either irrelevant (too specific) or abstract (no narrative). |
  | **Psychological Distance** | Non-negotiable | Contradicts empirical psychology of emulation if ignored; explains Plutarch's inclusion of flaws. |
  | **Structural Teleology** | Camp Preference | Depends on whether the goal is critical judgment (Plutarch) or devotional alignment (Hagiography). |
  | **Veracity-Edification** | Non-negotiable | Must explain why idealization works; otherwise, Hagiography is deemed "lying" rather than "teaching." |

  An adequate theory must therefore navigate the space between historical truth and moral utility, explaining how readers extract transferable virtues from specific, often flawed, or idealized narratives without succumbing to disillusionment. It must treat the *Parallel Lives* as a gymnasium for moral judgment and Hagiography as a temple for moral orientation, without reducing either to mere history or mere fiction.
