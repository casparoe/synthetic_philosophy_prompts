      *   *Nuance:* The user says *non-refoulement* "transforms." This is strong. I should point out that *non-refoulement* is often seen as *jus cogens*. Challenging that is bold but risky. I should suggest framing it as "primary obligation shifts" rather than "duty disappears."
      *   *Measurement:* Don't just say "don't use carbon." Suggest "benefit principle" (who gained from the industrialization causing climate change?).
      *   *Individual:* Emphasize that the individual's right not to be persecuted shouldn't depend on a bureaucratic quota calculation.

  6.  **Final Polish:** Check against the user's specific questions to ensure all are answered. (Causal work? Convention consistency? Traceable agents? Cost-benefit? Measurement? Individual urgency?)

