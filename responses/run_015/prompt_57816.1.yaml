      *   **Decision Theory (Proto):** Pascal's Wager. It's not about truth per se, but about expected utility under uncertainty. However, the Wager relies on infinite stake (eternal salvation) vs. finite cost. It also relies on a specific kind of uncertainty (God's existence is unknowable by reason alone).
      *   **View on Freedom/Foreknowledge:** Pascal accepts divine foreknowledge and predestination (Jansenism). He believes human freedom is compatible with grace, but human will is corrupted without it. He wouldn't see foreknowledge as negating responsibility, but rather as part of the divine order.
