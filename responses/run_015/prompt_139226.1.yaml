  2.  **Deconstruct the Intellectual Tension:**
      *   *The Church:* Wants to hear faith was the engine.
      *   *The Academics:* Want to hear rigorous sociology.
      *   *Ray:* Thinks ideas don't cause anything (materialism).
      *   *Miriam's View:* Ideas (values) change the "space of reasons." They don't force action like a brick, but they make certain actions make sense. Crucially, the *effect* of the faith (diligence) outlived the *belief* (piety). The belief gets no credit for the structure it built.
      *   *The Trap:* If I say "Her faith made her great," I violate her 3rd claim (belief gets no credit) and potentially alienate Ray (ideas don't cause). If I say "Her environment made her great," I insult the church and her own self-understanding.
      *   *The Solution:* Focus on *stubbornness* and *practice*. She didn't argue that her faith was *true* in the scientific sense, but that it was *operative*. She lived inside the reason her faith gave her. The eulogy should mirror her method: describe the shape of her life without claiming to know the ultimate causal mechanism, while acknowledging the reasons she avowed.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Set the tone (dry, plain). Mention the two groups in the room (church and university).
