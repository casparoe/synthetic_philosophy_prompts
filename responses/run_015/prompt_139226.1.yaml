answer: |-
  Friends, colleagues, members of the Second Reformed Church.

  Miriam would have hated this. Not the gathering—she loved you, all of you—but the task. She spent four days staring at a blank page before she died, and now I am doing the same. She would tell me to stop trying to be clever. She preferred to be called stubborn. So I will try to be stubbornly plain.

  Looking around this room, I see the two halves of her life. On one side, the church. On the other, the university. For fifty years, Miriam lived in the space between them. To the church, she was a ruling elder who took discipline seriously, who prayed without irony, who believed that God sovereignly orders all things. To the university, she was a sociologist who argued that ideas matter, but not in the way people think they do.

  Usually, at a funeral, we try to make these two halves fit. We say her faith made her a good scholar, or her scholarship proved her faith was reasonable. Miriam would have corrected us. She did not believe her work proved her faith true. She did not believe her faith made her work successful. She believed her faith gave her a reason to work, and that is a different thing entirely.

  She spent her career arguing that culture doesn't push people like a brick through a window. Instead, it changes what counts as a reason. For Miriam, the doctrines of the Reformation didn't force her to be diligent. They removed the other options. They closed off the shortcuts. They left her with a life that had to be lived methodically, in a calling, because that was the only thing that made sense given what she believed about God.

  This is hard for both sides of this room to hear.

  To her church friends: She did not work hard to show that her faith was useful. She worked hard because her faith told her that was what was required. The fruit was not a reward; it was a consequence. She would not want you to think God blessed her career because she was faithful. She would want you to know she was faithful, and so she worked.

  To her colleagues: She did not think values were just decorations on top of material forces. She spent thirty years arguing that you cannot find a person's reasons in a census record. You can see the thrift, the punctuality, the reinvestment. You cannot see the prayer that preceded it. The same action can come from fear, or greed, or piety. The statistics look the same. The reasons are different.

  This brought her to her hardest point, the one she knew would trouble you most. She argued that if this piety works, it builds a world that no longer needs the piety to run. The diligence outlives the doctrine. The machine runs without the believer. She used to say you can't argue from the Reformation back to the Reformation. The building stands, even if the architect has left the site.

  I know some of you wish I wouldn't say that today. But she asked for Ray Delacroix to be seated in the front row. Ray, you are there. You argued for thirty years that no idea ever caused anything. She argued that ideas change the menu, even if they don't force the meal. You never converted her. She never converted you. She loved that about you.

  She knew you would say this life can be explained by her class, her upbringing, her historical moment. She would say that explains the conditions, but not the reason. She knew you would say the building stands without the belief. She would say someone still had to lay the bricks. She did not want to be used as evidence for your side, any more than she wanted to be used for hers. The argument was unfinished. She would have hated to see it settled now, especially with her as the exhibit.

  She left us two objects that might help us hold this tension without breaking it.

  The first is on her desk at home. A hardware store receipt from 1971. She pinned it above her workspace for fifty years. She never explained it. It is not a sacred text. It is not a sociological datum. It is a piece of paper about nails or paint or glue. Ray might say it proves everything is material. The church might say it proves she was stewards of small things. Miriam just pinned it there. It was an ordinary thing that filled a slot. It was there because she decided it was there.

  The second object was the chalkboard in her lecture hall. She taught the same undergraduate course for thirty-four years. She didn't change it to fit the trends. She didn't change it to fit the times. On the last day, the week she retired, she erased the notes. She wrote four words: *Correlation is not a reason.* Then she walked out.

  She didn't say goodbye. She didn't say "you will miss me." She left you with the distinction.

  We are left with that distinction now. We can correlate her life with her faith. We can correlate her life with her history. But we cannot find the reason in the correlation. The reason was hers. It was avowed. It was stubborn.

  She was specific in her last months. She did not want this to be a recruitment event. She did not want us to use her to win an argument she would have enjoyed having. She did not want us to say she is watching us, or that she is at rest, or that she lives on in our hearts. Those are comforts for us, not facts about her.

  So here is the fact. She is not here. The arguments continue. The church will still discipline. The university will still regress. Ray will still argue that ideas are shadows. The elders will still argue that ideas are light.

  Miriam Kolb lived in the light of her reasons. She did not ask us to share them. She asked us to notice that she had them, and that she acted on them, and that the work was done.

  The receipt is still pinned above the desk. The board is erased. The room is quiet. We have the work. We have the reasons she gave us. We do not have her.

  Thank you.
