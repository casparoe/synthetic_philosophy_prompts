      *   **Audience:** 60% church (conservative Reformed, value her faith), 40% academia (students, colleagues, including Ray Delacroix, a Marxist friend/rival who believes ideas don't cause anything).
      *   **Constraints:**
          *   No citations/references/reading lists.
          *   Honor faith as center without implying scholarship proved faith true or was apologetics.
          *   Avoid standard "values explain life" triumphalism (contradicts her 3rd claim) AND avoid materialist determinism (Ray's move, insulting to her).
          *   Address Ray specifically (no cheap win, no surrender).
          *   No afterlife claims, no "she lives on," no "she would have wanted."
          *   God present but no theology done on her behalf.
          *   Tone: Dry, funny, plain language, no jargon, max 1-2 laughs, nothing at anyone's expense.
          *   Include specific details: 34 years of same lecture, final board message ("correlation is not a reason"), 1971 hardware store receipt pinned above desk.
