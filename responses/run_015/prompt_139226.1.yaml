      *   *The Faith:* She was an elder. Not ironic. She prayed. But she didn't think her work proved God. Her work was about how people live when they believe.
      *   *The Irony (Point 3):* The diligence outlives the doctrine. This is hard for the church (don't want to hear faith is unnecessary) and Ray (doesn't want to hear ideas matter).
