      *   Ending: The work remains.

  6.  **Drafting - Iteration 2 (Focusing on the "Third Thing"):**
      *   The prompt asks for a "third thing" to do. Not "faith caused success" and not "material conditions caused faith."
      *   The third thing is *fiduciary practice*. She lived *as if* the reasons were real. The eulogy should testify to the *fact* of her living, not the *validity* of the cause.
      *   Let's weave the receipt into the explanation of her theory. The receipt is material (Ray likes materials) but it was pinned for a reason (Miriam likes reasons).
      *   Address Ray directly. "Ray, you were right that the building stands without the belief. But she was right that someone had to lay the bricks."

  7.  **Writing - Section by Section (incorporating constraints):**

      *   *Opening:* Stand here, blank page. She'd say "stop trying to be clever."
      *   *The Room:* Half church, half university. She belonged to both, fully.
