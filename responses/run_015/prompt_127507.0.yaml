answer: |-
  Here is a procedure designed for your constraints. It is called the **Good-Faith & Risk Intake Protocol**.

  It is built on a specific philosophical shift: **Complaints are not about the reporter; they are about the Co-op's risk.** A volunteer should never decide if a person has "standing." They decide if the *issue* requires action based on risk, and if the *report* is credible enough to process without creating a feud.

  ### The Procedure: Good-Faith & Risk Intake Protocol

  **Time limit:** 10 minutes.
  **Who:** Shift Volunteer.
  **Input:** Written complaint or verbal report.
  **Output:** One of three outcomes: **Action**, **Systemic Flag**, or **Human Escalation**.

  #### Step 1: The Harm Filter (Mandatory)
  *Ask: Does this allegation involve immediate safety, financial loss, or legal liability?*
  *   **Examples:** Food safety (allergens/spoilage), cash register shortages, harassment/discrimination, injury.
  *   **Yes:** **Proceed to Step 3.** (You cannot bin safety issues based on who reported them).
  *   **No:** **Proceed to Step 2.** (Procedural rules, shift etiquette, labeling, bylaws).

  #### Step 2: The Record Check (The "Hypocrisy" Brake)
  *Ask: Is there a **documented** record in the last 6 months that the reporter is currently violating this specific rule?*
  *   **Note:** "Documented" means written in the complaint log or a sanctioned warning. It does *not* mean rumors, gossip, or "everyone knows."
  *   **Yes (Documented Violation):** **Outcome: Human Escalation.** (Do not bin. Do not act. Send to the 3-person team).
      *   *Reason:* A volunteer cannot adjudicate a "he-said-she-said" on hypocrisy. This requires a values call.
  *   **No (No Record / Unknown):** **Proceed to Step 3.**

  #### Step 3: The Decoupling Test (The Action Phase)
  *Ask: If we remove the reporter's name entirely, is there enough detail here to verify the claim without interviewing the reporter?*
  *   **Yes (Evidence exists independently):** **Outcome: Action.**
      *   *Process:* Investigate the *act*, not the *accuser*. The report is logged as "Anonymous Tip" or "Systemic Alert." The accused is told "A discrepancy was noted," not "X reported you."
  *   **No (Requires reporter testimony to verify):** **Outcome: Systemic Flag.**
      *   *Process:* Log the issue as a "Potential Pattern." Do not investigate the specific accused person yet. Watch for future reports on the same issue. If a second report comes in from a different source, then **Action**.

  #### Step 4: The Script (What to write/say)
  *Never use the word "Standing." Never say "We are ignoring you."*

  *   **For Outcome: Action (High Risk)**
      > "Thank you for flagging this. Because this involves [safety/cash], we are required to review the process immediately. We will be looking at the records generally, so we may not share specific outcomes to protect member privacy."
  *   **For Outcome: Systemic Flag (Low Risk + Hypocrisy Risk)**
      > "We've logged this observation. At this time, we are treating this as a general process note rather than a specific violation complaint. We'll be keeping an eye on this area to see if broader training is needed."
  *   **For Outcome: Human Escalation (Documented Hypocrisy)**
      > "This has been passed to the Complaints Team for review. Because there are prior records regarding this rule, they need to assess the context before next steps are taken."

  ---

  ### Test Run: Three Cases

  Here is how the protocol handles three of your specific scenarios.

  #### Case 1: The Direct Victim / Worst Offender
  *Scenario:* A founding member (Member A) has broken the cash-handling rule 4 times (documented). Member B breaks the rule. Member A reports Member B. Member A is also a victim of Member B's behavior in a separate feud.
  *   **Step 1 (Harm):** Cash handling = **Yes (Financial Risk).**
  *   **Step 2 (Record):** Member A has documented violations. **Yes.**
  *   **Step 3 (Decoupling):** Can we verify Member B's cash error without Member A's testimony? (e.g., via camera or ledger). Let's assume **Yes**.
  *   **Protocol Outcome:** **Action.** (Because Step 1 overrides Step 2 on safety/finance).
  *   **The Unpopular Answer:** You **must** investigate Member B, even though Member A is a hypocrite.
  *   **Why:** If you bin this because Member A is toxic, and Member B is actually stealing, the Co-op loses money. You protect the Co-op's assets, not the Co-op's moral purity. The investigation is framed as a "Routine Audit," not "Investigation into B reported by A."
  *   **Volunteer Load:** Low. They see "Cash" and "Documented Record." They escalate to the 3-person team to manage the fallout, but the audit happens.

  #### Case 2: The Norm-Shopper
  *Scenario:* Member C argues constantly that the "Shift Swap Rule" is authoritarian and useless. Last week, they swapped a shift without approval. Today, they report Member D for swapping a shift without approval.
  *   **Step 1 (Harm):** Shift swaps = **No.** (Procedural).
  *   **Step 2 (Record):** Member C's violation last week is documented. **Yes.**
  *   **Step 3 (Decoupling):** N/A (Step 2 triggered Escalation).
  *   **Protocol Outcome:** **Human Escalation.**
  *   **Why:** This is the "Values Call." A volunteer cannot decide if this is "holding people accountable" or "weaponizing a rule you hate." The 3-person team must decide if Member C is now harassing Member D.
  *   **Volunteer Load:** Low. They see "Procedural" + "Documented Violation." They pass the ticket.

  #### Case 3: The Reformed One
  *Scenario:* Member E broke the labeling rule 6 months ago. Was sanctioned. Admitted it. Has been perfect since. Member E reports Member F for bad labeling.
  *   **Step 1 (Harm):** Labeling (Allergens) = **Yes (Safety Risk).** (Even if you consider it procedural, allergens make it Safety).
  *   **Step 2 (Record):** Violation was 6 months ago, sanction completed. **No** (Not *currently* violating).
  *   **Step 3 (Decoupling):** Can we see the label? **Yes.**
  *   **Protocol Outcome:** **Action.**
  *   **Why:** This validates your instinct. The "Reformed" reporter is high-credibility because they know the rule and have paid their dues.
  *   **Volunteer Load:** Low. "Safety" + "No Current Record" = Act.

  ---

  ### Anti-Abuse Mechanism

  You are worried a tired volunteer will use "No Standing" to bin work. Here is how the protocol stops that:

  1.  **The "Harm" Lock:** If Step 1 is checked "Yes" (Safety/Money), the volunteer **cannot** select "Bin/Ignore." They *must* choose Action or Escalation. This prevents laziness on high-risk issues.
  2.  **The "Documented" Requirement:** In Step 2, a volunteer cannot claim hypocrisy based on "I heard they do this." It must be in the log. If it's not in the log, they must proceed to Step 3. This prevents volunteers from using personal knowledge to kill complaints.
  3.  **The Escalation Default:** If the volunteer is unsure, the protocol defaults to **Human Escalation**, not **Bin**. It is better for you (the team) to receive 10 extra tickets than for a valid complaint to die in a volunteer's inbox.

  ### Where This Framework Fails (The Limitations)

  You asked to know where the standing question is the *wrong* question. This procedure admits defeat in two areas:

  1.  **Interpersonal Feuds:** If Member A and Member B hate each other, *every* complaint is weaponized. This procedure treats them as isolated incidents. It will not stop a war of attrition where both sides follow the rules technically but harass each other procedurally.
      *   *Fix:* This requires a "Conflict of Interest" declaration, not a complaint procedure. If two members have a known feud, complaints between them should auto-escalate to mediation, not rule enforcement.
  2.  **Systemic Bias:** If a specific demographic is policed more heavily by "Norm-Shoppers," this procedure validates that policing as long as the rule is real.
      *   *Fix:* You need a quarterly review of *who* is reporting *whom*. The procedure handles the single ticket; the Team must handle the pattern data.

  ### Distinctions: Keep vs. Flatten

  For a 10-minute volunteer decision, you must simplify.

  **FLATTEN THESE (Do not ask the volunteer to decide):**
  *   **"Who started it?"** (The Interrupted Perpetrator case). It takes too long to verify timelines. Treat both violations as separate incidents.
  *   **"Did they mean well?"** (Intent). Volunteers cannot read minds. Focus on the act.
  *   **"Is the reporter a victim?"** (The Direct Victim case). As seen in Case 1, being a victim does not grant immunity from the Hypocrisy Brake, nor does it guarantee action. The *Risk* determines the action, not the victimhood.

  **KEEP THESE (Non-negotiable distinctions):**
  *   **Safety/Money vs. Procedure.** This is the most critical fork. You can tolerate hypocrisy on shift swaps; you cannot tolerate it on allergens.
  *   **Documented vs. Rumor.** This protects the reporter from gossip and protects the volunteer from having to investigate the investigator.
  *   **Current vs. Past.** A past sin (Reformed) is not the same as an ongoing sin (Norm-Shopper). The 6-month window in Step 2 is arbitrary but necessary for speed.

  ### Summary for the Member Meeting

  When you present this, your narrative is:
  *"We are moving from judging **people** to judging **risk**. A complaint is not a weapon for the reporter; it is a sensor for the Co-op. If the sensor is broken (hypocrisy), we check if the fire is real (risk). If the fire is real, we put it out regardless of who pulled the alarm. If the fire is small and the sensor is broken, we fix the sensor."*

  This allows you to act on the Cash Handler's report (protecting the money) without validating the Cash Handler (by escalating the context to the Team), and it allows you to stall the Norm-Shopper (by requiring Human Escalation) without silencing them (by logging the note).
