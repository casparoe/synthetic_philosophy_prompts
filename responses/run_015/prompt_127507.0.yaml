          *   Specific language for rejections (avoid "no standing" war-starters).
          *   Address specific cases: Direct Victim/Worst Offender, Reformed, Enabler, Proxy (third party), Interrupted Perpetrator, Norm-Shopper.
          *   **Anti-Abuse:** Prevent volunteers from using "no standing" to lazily bin complaints.
          *   **Limitations:** Identify where the framework fails (wrong question entirely).
          *   **Output:** Run the procedure on 3 cases (including one unpopular answer), identify distinctions to keep vs. flatten.

  2.  **Deconstruct the Core Ethical/Procedural Tension:**

      *   *Rule of Law vs. Clean Hands:* Does the validity of a rule violation depend on the purity of the accuser? Legally, usually no. Socially/communally, yes, credibility matters.
      *   *The "Standing" Trap:* Saying "you have no standing" implies a right to speak that is being revoked. In a co-op, everyone has a voice. The issue isn't *standing* (right to speak), it's *credibility* (weight of evidence) and *process integrity* (good faith).
      *   *The Volunteer Constraint:* 10 minutes means no deep digging. It must rely on *admitted* facts or *obvious* contradictions. If facts are heavily disputed, the procedure must punt to a human/committee, not decide on the spot.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental):* Check if reporter broke rule. If yes, reject. *Critique:* Too harsh, kills the "Reformed" case.
      *   *Attempt 2 (Mental):* Check if complaint is valid regardless of reporter. *Critique:* This is the user's current heuristic, which they feel ignores the "clean hands" aspect.
      *   *Attempt 3 (Balanced):* Focus on *Good Faith* and *Safety*. Is the complaint about safety/harm? Is the reporter trying to fix the system or hurt a person?
      *   *Refining for Volunteers:* Needs a flowchart style. Yes/No questions. Clear "Stop" points.
      *   *Addressing Anti-Abuse:* The volunteer cannot decide "Hypocrisy" alone. They need a checklist. If the checklist is met, they *must* proceed or escalate, not bin.
      *   *Addressing Language:* Instead of "You have no standing," use "We are addressing the behavior, not the reporter" or "This is being handled as a systemic issue."

  4.  **Developing the "Good Faith & Harm" Filter:**

      *   The core distinction shouldn't be "Did you break the rule?" but "Are you reporting to protect the co-op or to weaponize a rule?"
      *   *Key Distinction:* **Harm/Safety** vs. **Procedural/Purity**.
      *   If there is immediate harm (food safety, money missing, harassment), the reporter's history matters *less*.
      *   If it's procedural (shift times, labeling, niche bylaws), the reporter's history matters *more*.

  5.  **Structuring the Procedure:**

      *   **Phase 1: Triage (Safety & Harm).** If high harm, proceed regardless of hypocrisy. (Protects the co-op).
      *   **Phase 2: The Mirror Test (Hypocrisy Check).** Is the reporter currently/non-recently violating the *same* rule?
      *   **Phase 3: Intent & Pattern.** Is this part of a feud? (Norm-shopping).
      *   **Phase 4: Resolution Path.** Fix the system vs. Punish the person.

  6.  **Addressing the Specific Cases:**

      *   *Direct Victim/Worst Offender:* High harm? If yes, proceed. If low harm + high hypocrisy, flag as "Feud."
      *   *Reformed:* Admitted + Sanctioned = Clean. Proceed.
      *   *Norm-Shopper:* Pattern of inconsistency = Bad Faith. Bin or Escalate as harassment.

  7.  **Addressing the Constraints:**

      *   *10 Minutes:* Cannot verify hidden facts. Must rely on *known* records or *admissions*. If disputed, escalate.
      *   *Anti-Abuse:* The volunteer cannot "Bin" based on hypocrisy alone without checking the Harm filter.
      *   *Language:* Focus on "Process Integrity" rather than "Person Integrity."

  8.  **Refining the Output (Self-Correction during drafting):**

      *   *Correction:* The user wants to know where the framework *doesn't* reach. I need to explicitly state that this procedure is for *complaints about rule violations*, not interpersonal conflict or systemic bias.
      *   *Correction:* The "Direct Victim/Worst Offender" case is tricky. If I say "Proceed," the accused screams hypocrisy. If I say "Bin," the victim is unsafe. The solution: **Decouple the investigation from the reporter.** The complaint becomes "A rule was broken," not "X broke the rule reported by Y."
      *   *Correction on "Standing":* Never use the word. Use "Process Priority."

  9.  **Finalizing the Procedure Steps:**

      1.  **Harm Check:** Is anyone unsafe/losing money? (Yes = Act).
      2.  **Record Check:** Is the reporter *currently* sanctioned for this? (Yes = Escalate).
      3.  **Admission Check:** Does the reporter admit to doing it? (Yes = Proceed but note context).
      4.  **Pattern Check:** Is this part of a back-and-forth? (Yes = Escalate as Conflict).
      5.  **Default:** If none of the above, Treat as Anonymous Tip.

