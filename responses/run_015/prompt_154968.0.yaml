prompt: |-
  hey so im working up a thing for a phil of mind reading group and i had this odd take: read Mary Shelley's Frankenstein through teleosemantics, specifically the original vs derived proper function distinction. The creature teaches himself language and forms beliefs, but he has no evolutionary history—just Victor's design and then self-education. So do his mental states have original content, or only derived? When he reads Paradise Lost and identifies with Satan, is that a representational malfunction, or is he applying representations whose proper function was never biologically fixed?

  I want a reading that takes both Shelley and the philosophy seriously: point me to scenes where the creature acquires represenational capacities, ask whether Shelley treats mental content as innate or socially derived, and say where the novel resists the teleosemantic framing. Also please be explicit about how confident you are in this reading and flag the single point youre least sure about—probably something about whether derived functions can really ground full-blown intentionality in an artificial being.
