      *   *Nature vs. Nurture:* Shelley leans heavily into Lockeian tabula rasa but with a Romantic twist (sensibility). The Creature isn't born evil; he becomes miserable through rejection.
      *   *Resistance:* The Creature exhibits emotions and moral reasoning that seem to *exceed* his design. Victor didn't design him to read Milton; he designed him to be a big, strong being. The Creature's interiority feels "original" to the reader, even if philosophically problematic.

