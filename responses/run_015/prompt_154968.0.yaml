      *   *Original Proper Function:* Biological traits selected for survival/reproduction (e.g., a heart pumps blood because ancestors did so and survived).
      *   *Derived Proper Function:* Artifacts designed by agents with original intentionality (e.g., a thermometer measures temperature because humans made it to do so).
      *   *The Problem:* The Creature is biologically human-ish but has no evolutionary history (no ancestors). He is an artifact of Victor. Does he have "original" intentionality (like a human) or "derived" intentionality (like a robot/book)?
      *   *The Twist:* The Creature *learns* language and forms beliefs *after* creation. Teleosemantics usually relies on history. If the history is truncated, does the content hold?

  3.  **Deconstruct the Literary Text (*Frankenstein*):**
