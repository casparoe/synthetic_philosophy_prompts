      *   **Part 2 (Self-Refutation Objection):** If consciousness is an illusion, something must appear illusory to a subject. If things appear illusory, there is "something it is like" to have that appearance. Therefore, phenomenal consciousness exists. (This is the standard "illusion of what?" objection).
      *   **Part 3 (Illusionist Reply):** Appeals to Dennett's Cartesian Theater critique. Claims we mistakenly assume an inner audience. Misrepresentation is distributed. No conscious experiencer being deceived, only false representations within the system.

