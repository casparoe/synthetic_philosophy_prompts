answer: |-
  The domination thesis posits that Enlightenment universalism functions as a superstructure rationalizing material domination, granting rights only when they serve imperial stability. To test this, we must map the conceptual positions of the three relevant actors: the National Convention, Napoleon's administration, and the Saint-Domingue insurgents.

  For the **Convention delegates** in 1794, the options were binary: ratify the de facto freedom seized by the insurgents to maintain French sovereignty over Saint-Domingue, or insist on metropolitan legal continuity and lose the colony to British or Spanish invasion. The domination thesis interprets the 1794 abolition as an administrative calculation masked in moral language—a pragmatic concession to retain control over a labor force that had already ceased to be controllable. However, this view struggles to account for the internal fractures within the Convention, where Jacobin ideologues genuinely viewed abolition as a fulfillment of revolutionary logic, not merely a strategic retreat. If rights-language were purely a cover for control, it would not have been wielded so effectively by the radical left against the colonial lobby. The decree was not just a recognition of powerlessness; it was an attempt to universalize the revolution, risking economic collapse for ideological consistency.

  For **Napoleon's administration** in 1802, the options shifted with the consolidation of post-revolutionary authority. The choice was between maintaining the universalist precedent of 1794 (aligning with liberty but risking planter antagonism) or restoring slavery to maximize sugar production and reassert metropolitan hierarchy. The reversal aligns perfectly with the domination thesis: rights were rescinded when the cost of universalism exceeded the economic utility of bondage. Here, the thesis illuminates the episode clearly; "progress" was revealed as contingent, withdrawn once the insurgent leverage waned and economic instrumentalism regained priority.

  However, the **insurgent leaders** in Saint-Domingue disrupt the theoretical framework. The domination thesis treats colonized subjects as objects of governance, passive recipients of rights granted or withheld by the metropole. The insurgents, having seized freedom militarily before the decree, transformed themselves from objects into rights-bearing agents. They did not wait for Enlightenment benevolence; they forced the Convention to confront the contradiction between its universalist claims and its colonial practice. By appropriating the language of the Enlightenment to justify their own sovereignty, they turned the "ideological cover" into a binding contract. This agency suggests that universalism was not merely a mask for domination but a volatile technology that could be hijacked by the excluded to dismantle the very power structures that produced it.

  The domination thesis is silent on two critical fronts revealed by this episode. First, it cannot adequately explain why the metropole would adopt language that could be weaponized against it unless there was an internal belief in the universalist project itself, however flawed. Second, it overlooks the fact that abolition was never fully reversed in all territories, and the 1794 precedent created a legal and moral fracture that made the eventual 1848 abolition inevitable. The theory explains the *failure* of 1794 (the 1802 reversal) but fails to explain the *rupture* (the fact that 1794 happened at all).

  Thus, the episode tests the theory in both directions. The theory illuminates the cynical instrumentality of the 1802 restoration, confirming that economic interests often dictate the boundaries of rights. Conversely, the episode tests the theory by showing that the 1794 abolition was not purely performative; it was a genuine, albeit pressured, breakthrough driven by the agency of the enslaved, which the domination thesis reduces to mere epiphenomena. The theory captures the contingency of rights but misses the generative power of universalist discourse when seized by the oppressed.

  Verdict: complicates
  The episode confirms that rights were often contingent on economic interest, but the active agency of the enslaved demonstrates that universalist language could function as a tool of liberation rather than merely a mask for domination.
