          *   Where is the domination thesis silent (internal fractures, incomplete reversal)?
          *   Bidirectional analysis: Theory illuminating episode vs. Episode testing theory.
      *   **Formatting Requirement:** End with a line beginning "Verdict:" followed by "supports," "complicates," or "undermines." Followed by a one-sentence summary.

  2.  **Deconstruct the Domination Thesis:**
      *   Core claim: Enlightenment universalism is ideological cover for instrumental domination.
      *   Rights-language rationalizes control.
      *   "Progress" is selectively granted only when aligned with power interests.
      *   Colonized subjects are objects of governance, not agents.

  3.  **Analyze the Episode (1794 Abolition & 1802 Restoration):**
      *   **1794 Abolition:** Enacted by the National Convention. Context: Saint-Domingue revolution (Toussaint Louverture, etc.). The Convention was under pressure from the insurgent armies who had already seized freedom.
      *   **1802 Restoration:** Napoleon sends Leclerc to restore slavery/order. Context: Economic interest (sugar), consolidation of power.
      *   **Actors & Options:**
          *   *Convention Delegates:* Faced with losing the colony to Britain/Spain if they didn't align with the insurgents. Options: Recognize insurgent freedom (abolition) or lose the colony/ideological consistency.
          *   *Napoleon's Administration:* Faced with post-revolutionary stabilization. Options: Maintain abolition (risk planter anger/economic loss) or restore slavery (reassert metropolitan control/economic gain).
          *   *Insurgent Leaders:* Had de facto freedom. Options: Align with France (if abolition recognized), align with Britain/Spain, or fight for independent sovereignty.

  4.  **Evaluate the Theory against the Episode:**
      *   *Support for Domination Thesis:* 1802 restoration clearly shows rights were contingent on economic utility. When sugar profits mattered more than revolutionary ideals, slavery returned. 1794 abolition can be seen as pragmatic (keeping the colony French) rather than purely moral.
      *   *Complication/Undermining:* The insurgents *forced* the issue. They weren't passive objects. They seized freedom *before* the decree. The decree ratified a reality created by the enslaved. This suggests universalist language wasn't just a top-down mask; it was a weapon seized from below. The fact that abolition *happened* legally, even if reversed, created a precedent that couldn't be fully erased (e.g., Guadeloupe resistance, eventual 1848 abolition). The internal fractures in the Convention (Robespierre vs. others, Sonthonax's role) show genuine ideological conflict, not just monolithic calculation.

  5.  **Drafting the Analysis (Conceptual Mapping):**
      *   *Introduction:* Frame the tension between universalist rhetoric and material interest.
      *   *1794 Abolition:* Was it moral or pragmatic? The Convention faced a choice: recognize the insurgents' de facto freedom or lose Saint-Domingue to rivals. The domination thesis suggests this was pragmatic containment. However, the *language* used was universalist. The insurgents used this language to hold the Convention accountable.
      *   *1802 Restoration:* Napoleon's move aligns perfectly with the domination thesis (economic interest overrides rights). But it also proves the 1794 decree had substance worth reversing.
      *   *Agency of the Enslaved:* This is the critical friction point. The domination thesis treats subjects as objects. The Saint-Domingue insurgents were subjects who became agents, using Enlightenment discourse against the metropole. They forced the universalism to be real, not just cover.
      *   *Silences in the Thesis:* It misses the internal struggle within the Enlightenment project itself (Jacobins vs. Thermidorians vs. Bonapartists). It ignores that once the universalist genie was out of the bottle, it couldn't be fully re-contained (leading to 1848). It reduces the 1794 decree to mere calculation, ignoring the genuine radicalism of the Jacobin moment.

  6.  **Refining the Argument:**
      *   The domination thesis explains the *reversal* (1802) well.
      *   It explains the *timing* of 1794 (pressure) well.
      *   It fails to explain the *content* and *legacy* of 1794. If it were purely cover, why use universalist language that could be weaponized against you? The theory struggles with the idea that the oppressed can hijack the master's tools to break the house.
      *   The agency of the enslaved transforms the "cover" into a "contract" that the metropole violated, revealing the domination, but also validating the universalism as a distinct force.

  7.  **Addressing Specific Constraints:**
      *   No ecological/diplomatic history (keep it conceptual/political).
      *   Identify actors and options.
      *   Bidirectional analysis.
      *   Final verdict format.

  8.  **Constructing the Verdict:**
      *   Does it support? Partially (1802).
      *   Does it undermine? Partially (1794 agency).
      *   Does it complicate? Yes. The episode shows the thesis is too static. It captures the *failure* of universalism but misses the *generative power* of universalism when seized by the excluded.
      *   Selection: "complicates".

  9.  **Drafting the Response (Iterative refinement):**
      *   *Focus:* Keep it tight on concepts (universalism, instrumentality, agency).
