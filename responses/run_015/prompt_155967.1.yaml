      *   *Theory Test:* The theory predicts rights are granted only when aligned with power. 1794 seems to contradict this (rights granted when power was *lost* to insurgents). 1802 confirms it. The tension is key.
      *   *Agency:* The theory treats colonized as objects. The insurgents were subjects. This breaks the theory's framework.
      *   *Silences:* Internal fractures (Jacobin idealism vs. later realpolitik). Incomplete reversal (some places kept abolition).

