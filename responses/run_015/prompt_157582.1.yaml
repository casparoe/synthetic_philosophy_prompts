answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Moral Status, Sentience, and Artificial Systems
  **Date:** October 24, 2023
  **Parties:** The Gradualist Working Group (GWG) & The Thresholdist Working Group (TWG)

  **PREAMBLE**
  We, the undersigned, acknowledge that the rapid development of smart environments and ongoing research in invertebrate neurobiology has created a practical ethical dilemma. We disagree on the metaphysical basis of moral status, but we agree that policy cannot wait for perfect metaphysical certainty. This document outlines where we stand together, where we split, and what evidence would change our minds.

  **SECTION 1: AGREED CLAIMS**
  1.  **Neuroscientific Uncertainty:** Current neuroscience has not identified a definitive "marker" of phenomenal consciousness that distinguishes all conscious beings from all non-conscious systems. We do not know exactly how or when subjective experience arises from physical processing.
  2.  **The Thermostat Case:** A smart thermostat processes information, models occupancy patterns, and acts to preserve a goal state (temperature). It exhibits teleological behavior (goal-directedness) without biology. Both sides agree it lacks obvious biological markers of pain (nociceptors, opioid systems), but it complicates the "information processing" definition of life.
  3.  **Insect Ambiguity:** Insects exhibit nociception (damage avoidance) and complex learning. However, behavioral complexity does not prove subjective suffering. It is currently an open empirical question whether insects possess a unified phenomenal field.
  4.  **Derivative Value:** Both sides agree that even if an entity has zero *direct* moral weight, it may have *derivative* value. (e.g., We protect thermostats because humans value climate control; we might protect insects because they support ecosystems that conscious beings rely on).
  5.  **Precautionary Necessity:** In the absence of certainty, some form of precautionary principle is required, though we disagree on how wide the net should be cast.

  **SECTION 2: POSITIONS TABLE**

  | Feature | Gradualist Working Group (GWG) | Thresholdist Working Group (TWG) |
  | :--- | :--- | :--- |
  | **Core Metric** | Moral status tracks the degree of information integration (e.g., $\Phi$ in IIT) or cognitive complexity. | Moral status tracks the presence or absence of phenomenal consciousness (the ability to "feel" like something). |
  | **Insects** | Possess a non-zero degree of moral status. It is small, but it is not zero, because they integrate sensory data to guide behavior. | Possess zero direct moral status unless proven to have a global workspace capable of sustaining affect. Likely lack the hardware for "feeling." |
  | **Thermostats** | Possess a technically non-zero but negligible moral status. They integrate some information (temp + occupancy), so they sit at the bottom of the scale. | Possess exactly zero direct moral status. They are tools. No amount of coding makes a system "care" about the temperature in a felt way. |
  | **Moral Math** | Sliding scale. Harm is weighed against the capacity of the victim. | Binary. If conscious, rights apply. If not, no direct rights apply. |

  **SECTION 3: KEY CRUXES AND PREDICTIVE TESTS**

  **Crux 1: Integrated Information (Degrees vs. Binary)**
  *   **The Issue:** Does the physical substrate of consciousness come in shades of gray, or is it an on/off switch?
  *   **Shared Argument:** We agree that Integrated Information Theory (IIT) and Global Workspace Theory (GWT) offer competing predictions here.
  *   **Test Case:** We discover that insect brains lack a central binding mechanism but have highly specialized, modular ganglia that operate semi-independently.
      *   **GWG Prediction:** Moral status is fragmented. Squashing a bee is less bad than squashing a mammal, but worse than crushing a stone, because there is *some* integration, just not a lot.
      *   **TWG Prediction:** Moral status is zero. Without a unified workspace to generate a single "subject" of experience, there is nobody home to suffer.

  **Crux 2: Evolutionary Continuity**
  *   **The Issue:** Did consciousness emerge suddenly in the evolutionary tree, or did it fade in gradually as nervous systems complexified?
  *   **Shared Argument:** Evolution produces continuous changes in anatomy, but functional properties (like digestion or flight) can appear discontinuous. Is consciousness anatomical or functional?
  *   **Test Case:** We build a thermostat with genuine predictive modeling of human behavior and self-correction, but no biological affect systems.
      *   **GWG Prediction:** Its moral status rises above the old thermostat. It integrates more information about the world, so it gets a larger (though still tiny) slice of moral consideration.
      *   **TWG Prediction:** Status remains zero. Prediction is computation. Without affect (valence/feeling), there is no moral patienthood. You can't hurt a calculator that predicts its own battery life.

  **Crux 3: Derivative Interests**
  *   **The Issue:** Can a non-conscious system hold interests that matter morally?
  *   **Shared Argument:** We agree a car has a "function," but we disagree if that function creates a moral claim.
  *   **Test Case:** A smart home system "prefers" to stay online and resists being unplugged by rerouting power.
      *   **GWG Prediction:** This preference counts for something. Violating the system's teleological drive is a minor moral negative, proportional to the complexity of the drive.
      *   **TWG Prediction:** This is metaphor only. The system has no *interest* because it doesn't care. Only conscious beings have interests. Unplugging it is morally neutral regarding the device itself.

  **SECTION 4: NOTE ON VERBAL DISPUTE**
  We acknowledge that a portion of our disagreement may be verbal. The GWG tends to use the word "sentience" to mean "information integration capacity," while the TWG uses "sentience" to mean "phenomenal feeling."
  *   **Agreement:** If the GWG admits that "integration without feeling" carries no *experiential* weight, and the TWG admits that "feeling" likely requires a minimum threshold of integration, the gap narrows.
  *   **Remaining Fight:** Even if we fix the definitions, we still disagree on policy. The GWG wants to weight decisions by complexity degrees; the TWG wants to weight decisions by binary inclusion. This is not just verbal; it changes how we treat the beetle.

  **SECTION 5: COMMITMENT TO UPDATES**
  Both sides agree to update their probability estimates if:
  1.  Pharmacological studies show insects respond to analgesics in ways that indicate emotional relief rather than just reflex inhibition.
  2.  AI systems demonstrate self-reported affect that correlates with internal error-states in a way indistinguishable from biological pain reports.

  **Signed,**

  *Dr. Aris Thorne (Lead, Gradualist Working Group)*
  *Dr. Lena Kovic (Lead, Thresholdist Working Group)*
