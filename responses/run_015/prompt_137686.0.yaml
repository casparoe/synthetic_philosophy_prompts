answer: |-
  **Project Title:** Dissociating Motor Readiness from Action Content: A Pilot Study on Volitional Timing

  **Project Overview**
  This proposal requests support for a ten-month pilot study investigating the neural timing of conscious volition. Collaborating with the on-campus Motor-Control Laboratory, we will employ EEG and behavioral measures to test a specific philosophical critique of classic Libet-style experiments. The project funds one Research Assistant (RA) and subject payments. The goal is not to settle the free-will debate, but to empirically test a distinction often overlooked in the literature: the difference between the *timing* of motor readiness and the *fixing of content* in a decision.

  **Background and Research Question**
  Standard interpretations of Libet-style results argue that because neural readiness potentials precede conscious reports of intention, conscious will is causally inert. This proposal challenges that inference. The threat to agency relies not merely on early neural activity, but on the claim that the *content* of the decision (e.g., left hand vs. right hand, now vs. later) is fixed at that early stage. If early neural activity represents only a content-free state of general readiness, with specific action selection occurring later—coinciding with conscious awareness—the standard epiphenomenalist conclusion does not follow.

  Furthermore, standard replies invoking "free won't" (the power to veto an unconscious urge) are insufficient. If the urge is unconsciously determined, the veto mechanism itself is subject to the same regress of prior causes. This project separates these issues: the empirical pilot tests the content-fixing hypothesis, while the philosophical component addresses the veto problem theoretically.

  **Research Question:** Can we dissociate the onset of general motor readiness from the neural signature of specific action content selection, and does the latter coincide with conscious report?

  **Methodology and Design**
  We will adapt the standard spontaneous movement task. Subjects will be asked to make spontaneous movements (e.g., flexing a wrist) at self-selected times. Crucially, we will introduce a choice component requiring specific content selection (e.g., choosing between left or right hand, or choosing between two distinct movement types) rather than a single stereotyped action.

  1.  **Data Collection:** Using the Motor-Control Lab's EEG setup, we will record readiness potentials. We will compare the timing of general motor preparation against the timing of lateralized or specific motor preparation signals that indicate content selection. Subjects will report the moment of conscious decision using a standard clock method.
  2.  **Philosophical Analysis:** While the RA manages data collection, the PI will develop the theoretical argument regarding the veto problem. The aim is to demonstrate that relocating agency to a veto stage does not preserve causal responsibility if the veto itself is neurally predetermined.
  3.  **Integration:** The final output will combine the empirical data (does content fixing happen late?) with the theoretical argument (even if it happens early, does veto power help?).

  **Timeline (10 Months)**
  *   **Months 1–2:** Finalize protocol with Motor-Control Lab; submit IRB application; hire and train RA on EEG equipment and subject management.
  *   **Months 3–6:** Data collection. RA runs subjects (target n=30 for pilot); PI drafts the theoretical section on the veto problem.
  *   **Months 7–8:** Data analysis. Pre-processing EEG signals; statistical comparison of readiness onset vs. content-specific signals vs. conscious report.
  *   **Months 9–10:** Integration and write-up. Combining empirical results with philosophical analysis; preparing deliverables.

  **Possible Outcomes**
  1.  **Success:** Data shows a significant gap between general readiness and content-specific selection, with content selection coinciding with conscious report. This supports the hypothesis that conscious will may still govern *what* is done, even if *when* is prepared early.
  2.  **Null Result:** Data shows content-specific signals arise as early as general readiness. This suggests the content objection fails, though it does not definitively prove epiphenomenalism.
  3.  **Project Failure:** This is distinct from a null result. Failure occurs if the task proves unusable (e.g., subjects cannot maintain spontaneity with the choice component), if EEG artifacts render data unusable, or if recruitment targets are missed due to timeline constraints. A null result is a valid scientific outcome; failure is methodological breakdown.

  **Deliverables**
  For the two non-philosophers on the committee, the primary deliverable will be a **Technical and Conceptual Brief**. This document will avoid jargon and provide:
  1.  A clear visualization of the timing data (readiness vs. content vs. report).
  2.  A plain-language summary of why this distinction matters for how we understand human agency.
  3.  A record of the raw data and analysis code for verification.
  Additionally, the PI will deliver a short departmental talk open to all faculty, ensuring the results are accessible beyond the philosophy department.

  **Risk Assessment and Feasibility**
  Honesty regarding scope is necessary. Ten months is an aggressive timeline for neurophilosophy pilot work. The primary risk lies in the data collection phase. EEG data is noisy, and training an RA to acceptable standards within two months may compress the collection window. If recruitment slows, we may not reach the target sample size, forcing us to treat the results as purely preliminary. Furthermore, integrating empirical data with high-level metaphysical argumentation often reveals complications that require more time than allocated. If the data collection slips beyond Month 6, the philosophical integration will be rushed. However, because the Motor-Control Lab is already engaged and the protocol adapts existing paradigms rather than inventing new ones, the technical risk is manageable. The project is designed to be robust even with a smaller sample size, provided the signal quality is sufficient to distinguish general from specific motor preparation.
