answer: |-
  Leiden, 1645. The light in Dr. Van den Hout's study was clean and northern, falling across the tiles and the steel of the instruments. On the table lay a dog, a spaniel with a coat like burnt umber. It slept, breathing deep. Van den Hout stroked its ear with one hand while he adjusted the lens of his microscope with the other. To love a machine is not hypocrisy; it is appreciation of the Craftsmanship. The dog yawned, a complex expansion of jaws, and settled.

  There was a knock. A showman entered, leading a creature on a chain. A Barbary ape.

  "Doctor," the man said. "You seek curiosities for the college. I have one that thinks."

  "All beasts think, insofar as they process images in the brain," Van den Hout said, not looking up. "It is the rational soul I deny them. Show me its organs."

  "Watch its actions."

  The showman produced a gold florin. He let the ape inspect it, then placed it on the sill of the closed window. He turned the ape to the wall. While the creature watched, the showman took the coin and hid it beneath a wooden cup on the table. He turned the ape back.

  The ape went to the window first, scratched at the sill, then turned to the table. It lifted the cup, took the coin, and chattered.

  "Disposition of organs," Van den Hout said. "Fear of loss drives it to search. Habit drives it to the last seen location."

  "Watch again."

  The showman repeated the setup. But this time, a student entered the room unseen by the ape, took the coin from under the cup, and hid it in his own pocket, then left. The ape turned from the wall. It went to the cup, lifted it, found nothing. It paused. It looked at the door where the student had vanished. It looked at the showman.

  Then the ape walked to the corner of the room where a broom leaned. It took the broom and laid it across the doorframe, barring the exit. It returned to the table, sat, and waited.

  When the room was quiet, and the showman stepped out to fetch water, the ape went immediately to the showman's coat, which hung on a chair. It dug into the pocket, retrieved the coin, and hid it within the straw of its own bedding.

  Van den Hout felt a coldness in his chest, distinct from the air. The beast had not responded to a stimulus. It had responded to a *lack* of knowledge in another. It had modeled the showman's ignorance. To bar the door was to prevent the search. To wait was to ensure solitude. This was not a particular disposition fitted for a job; this was a universal instrument adapting to contingency. It passed the second test of reason.

  "Does it speak?" Van den Hout asked. His voice was steady.

  "No," the showman said. "It screams. It begs. It does not declare."

  So it failed the first test. No words to declare its thoughts. No signs invented of its own nature.

  Van den Hout walked to the table. The spaniel woke and licked his hand. He looked at the ape. The ape looked back. It was not a blank stare of a clockwork eye; it was a calculation.

  Then, the ape did a thing not required by the coin, nor the door, nor the hunger of its belly. It raised its hand, palm open, and touched its own chest, then pointed to Van den Hout. A gratuitous sign. Not begging. Not threatening. Identifying.

  "It mimics," Van den Hout said. "The organs are disposed to mimic."

  "It learns too fast for disposition," the showman said. "Will you buy?"

  Van den Hout looked at his instruments. He could cut this creature open. He could trace the nerves, map the animal spirits, find the clockwork that barred the door. If he found only gears, the soul was safe. If he found nothing but flesh, yet the action remained unexplained, the distinction between man and beast grew thin. If the beast uses reason without language, then language is not the gate. If language is not the gate, what holds the soul in?

  He could not dissect it. To cut it would be to destroy the only evidence that the second test was flawed. But to keep it was to house a paradox.

  "I will purchase it," Van den Hout said. "But not for the college."

  "For what then?"

  "For my study. I must observe if the disposition holds."

  He paid the man. The showman left the chain on the table. The ape sat upon the wood, next to the sleeping dog. Van den Hout sat opposite them. He took up his quill to write to his mentor in Utrecht.

  *The machine adapts,* he wrote. *It deceives without passion. It signals without voice.*

  He looked at the ape. The creature was picking fleas from the dog's ear. The dog did not mind.

  *If I grant it reason, I must grant it a soul, yet it has no tongue for prayer. If I deny it reason, I deny my own eyes.*

  He dipped the quill again. He crossed out *souls*. He wrote *engines*. He crossed out *engines*.

  The ape stopped grooming. It looked at the quill, then at Van den Hout. It reached out and touched the inkwell, then wiped its finger on the paper, making a black mark. A sign. Not a word. But not a reflex.

  Van den Hout put the quill down. He could not finish the letter. He could not affirm the soul without the word, nor deny the reason without lying. He sat in the silence of the room, with two machines, one of which might be watching him think.

  ***

  **Note on Historical Accuracy:**
  Your grasp of Descartes is solid for this purpose. Descartes does argue in *Discourse on Method* (Part V) and letters (e.g., to Henry More, 1649) that animals lack *thought* and therefore cannot use true language (signs arranged to declare thoughts), and that their apparent adaptability is merely the disposition of organs (like a clock telling time differently based on gears). He would insist the ape's deception is purely mechanical (fear driving it to hide the object). The story respects this by having the protagonist struggle with whether the mechanical explanation holds water, rather than having him instantly convert to modern ethology. The "live dissection" detail is historically accurate; Cartesians viewed animal cries as mechanical noises, like a squeaking hinge, not expressions of pain.
