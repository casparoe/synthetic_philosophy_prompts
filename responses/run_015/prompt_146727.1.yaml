      *   Honest objection? Yes (it functions effectively as a penalty).
      *   No restatement of question? Yes.

  9.  **Final Polish:** Ensure flow and clarity. The transition between reasoning and objection needs to be smooth. The language should be precise ("moral luck," "culpability," "restorative duty").

