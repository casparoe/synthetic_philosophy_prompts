answer: |-
  ### Brainstorming & Literature Assessment

  Before addressing the core phenomenon, here are the three critical distinctions between this argumentative architecture and standard logical maneuvers, along with a note on the relevant literature.

  1.  **Distinction from Standard Special Pleading:** Classic special pleading asserts an exception without a relevant difference (e.g., "Morality is exempt from evolutionary scrutiny because it is important"). The structure you describe offers a *principled* structural distinction (content-determination vs. capacity-shaping). It mimics substantive philosophical differentiation, making the circularity harder to detect than a bare assertion of exemption.
  2.  **Distinction from Companions-in-Guilt:** The "Companions-in-Guilt" argument is the *trigger* for this sequence, not the sequence itself. The Companions-in-Guilt move says, "If morality is debunked, math is too." The structure you identified is the *counter-move* designed to neutralize that objection by carving out an epistemic safe haven for math while leaving morality exposed.
  3.  **Distinction from Standard Evolutionary Debunking:** A standard Evolutionary Debunking Argument (EDA) concludes unreliability directly from the evolutionary explanation (the "gap" between fitness and truth). Your four-step sequence adds a defensive layer: it uses empirical data (variation vs. convergence) to *validate* the distinction that protects the "safe" domain. This shifts the argument from metaphysical (about truth) to methodological (about how we identify tracking), which is where the circularity hides.

  **Literature Status:** There is no single canonical noun phrase (like "The Modus Ponens") that captures this exact four-step architecture. However, it is a recognized composite in contemporary metaethics and epistemology. It appears in the dialectic between **Sharon Street** (constructivist debunking), **Richard Joyce** (error theory), and their critics like **Justin Clarke-Doane** (*Morality and Mathematics*) and **Katia Vavova** (on disagreement). Clarke-Doane specifically analyzes the move of claiming math is "safe" while morality is not, noting that justifications often rely on assuming the safety they aim to prove. The closest existing technical concepts are **"Ad Hoc Rescue"** (from Lakatosian philosophy of science) and **"Epistemic Circularity"** (specifically *premise circularity*).

  ***

  ### Analysis: The Epistemically Loaded Empirical Partition

  As a philosopher of science, I would classify this layered architecture as a sophisticated form of **Ad Hoc Rescue** that relies on **Epistemic Circularity**. While it lacks a single legacy name, the most precise technical designation for this specific maneuver is **"The Epistemically Loaded Empirical Partition" (ELEEP)**.

  In some contexts, it is also referred to descriptively as **"The Convergence-Variability Insulation Strategy."**

  Here is the conceptual carving you requested: what it is, what it is not, and where its boundaries lie.

  #### 1. What It Is: The Structure of the Maneuver
  The ELEEP is a defensive epistemic strategy used to protect a specific domain of belief (e.g., mathematics, logic) from a debunking argument that successfully targets another domain (e.g., morality, religion). It functions through three integrated layers:

  *   **The Structural Wedge:** It posits a mechanistic difference in how evolution acts on the domains (e.g., "Evolution dictates moral *content* but only mathematical *capacity*").
  *   **The Empirical Validator:** It cites an empirical pattern (e.g., "Cross-cultural moral variation vs. mathematical convergence") as evidence that the Structural Wedge is real.
  *   **The Hidden Premise:** It treats the empirical pattern as *diagnostic* of truth-tracking. It assumes that convergence implies truth-tracking and variation implies non-tracking *without independent justification*.

  The critical flaw lies in the **Empirical Validator**. To use convergence as proof that mathematics tracks mind-independent truths (and variation as proof that morality does not), one must already assume that truth-tracking domains *necessarily* converge and non-tracking domains *necessarily* vary. But this is precisely what is in dispute. If evolutionary pressures shape our cognitive apparatus, convergence in mathematics could be a result of shared cognitive architecture (evolutionary convergence) rather than access to Platonic truths. By using the data to prove the distinction, the arguer presupposes the reliability of the "safe" domain to interpret the data.

  #### 2. What It Is Not
  *   **It is not a standard Genetic Fallacy:** The genetic fallacy rejects a belief solely based on its origin. The ELEEP acknowledges the origin (evolution) for *both* domains but argues for a differential epistemic outcome. It is more complex than a simple origin-rejection.
  *   **It is not simple Dogmatism:** Dogmatism refuses to engage with the counter-argument. The ELEEP engages with the "Companions-in-Guilt" objection by offering a structural distinction. It *looks* like engagement, which is why it is rhetorically effective.
  *   **It is not the Standard EDA:** The standard EDA (e.g., Street, Joyce) argues that evolution explains morality *therefore* realism is false. The ELEEP is a *meta-argument* about how to apply the EDA selectively. It is a strategy for *limiting* the scope of debunking, not the debunking itself.

  #### 3. Boundary Conditions: Substantive vs. Ad Hoc
  The most difficult task for a journalist or philosopher is distinguishing a legitimate domain distinction from an ELEEP. How do we know if the critic is making a genuine point about cognitive architecture or merely insulating their preferred beliefs?

  I propose three boundary conditions to test whether a distinction is substantive or an instance of ELEEP:

  **A. The Independence Condition (The Primary Test)**
  *   *Substantive:* The arguer can provide a reason for the structural distinction (content vs. capacity) that does not rely on the empirical data (variation/convergence) in question. For example, a neurological or computational model showing math requires abstract capacity while morality requires specific normative outputs.
  *   *ELEEP:* The only evidence for the structural distinction *is* the variation/convergence data itself. If the arguer says, "We know evolution determines moral content *because* morals vary," they are begging the question. They are assuming variation proves non-tracking to prove the evolutionary mechanism that causes non-tracking.

  **B. The Explanatory Symmetry Condition**
  *   *Substantive:* The evolutionary explanation offered for the "safe" domain (math) has the same explanatory power as the one for the "unsafe" domain (morality), yet the epistemic outcome differs for a stated independent reason (e.g., the nature of mathematical objects).
  *   *ELEEP:* The evolutionary explanation is treated as "total" for morality (explaining the specific beliefs) but "partial" for math (explaining only the capacity), without independent justification for why evolution would be total in one case and partial in the other.

  **C. The Possibility of Error Condition**
  *   *Substantive:* The arguer allows for the possibility that the "safe" domain could show variation without losing its truth-status (e.g., "Math could vary due to pedagogical differences but still be true").
  *   *ELEEP:* The arguer treats variation in the "unsafe" domain as *falsifying* truth-tracking, while treating convergence in the "safe" domain as *verifying* it. This asymmetrical treatment of empirical data is the hallmark of the insulation strategy.

  ### Summary for Reporting
  When you encounter this four-step sequence, you are observing **The Epistemically Loaded Empirical Partition**. It is a rhetorical and logical strategy designed to contain the damage of evolutionary debunking.

  *   **The Hook:** Evolution explains morality (Debunking).
  *   **The Trap:** Evolution explains math too (Companions-in-Guilt).
  *   **The Escape:** Evolution works differently in math (Structural Wedge).
  *   **The Lock:** We know it works differently because math converges and morality varies (Circular Validation).

  The critical insight for your audience is that the "Lock" step assumes that **Variation = False** and **Convergence = True**. In the philosophy of science, this is known as assuming the conclusion in the criteria of evidence. If our evolutionary history shaped us to see 2+2=4 for survival reasons just as it shaped us to value kin loyalty, convergence in math proves nothing about mind-independent truth. By using convergence to prove the distinction, the critic insulates their mathematical beliefs from the very genealogical scrutiny they apply to morality.

  **Key Sources for Further Reading:**
  *   **Justin Clarke-Doane,** *Morality and Mathematics* (2020) – Specifically the chapters on "Epistemic Security."
  *   **Katia Vavova,** "Evolutionary Debunking and Moral Disagreement" (2014) – Discusses how disagreement is used as evidence in debunking.
  *   **Sharon Street,** "A Darwinian Dilemma for Realist Theories of Value" (2006) – The foundational EDA paper that sparked this dialectic.
  *   **Imre Lakatos,** *Proofs and Refutations* – For the concept of "Ad Hoc Rescue" in argumentative structures.
