answer: |-
  **Brainstorming Candidate Principles**

  1.  **Strict Sentientism:** Moral status begins at sentience. *Fails:* Cannot explain why PVS humans outweigh pigs or why hens outweigh pigs despite lower cognition.
  2.  **Cognitive Capacity:** Status scales with intelligence. *Fails:* Contradicts your dog/pig and horse/cow verdicts; pigs outperform dogs.
  3.  **Equal Consideration:** Comparable interests weigh equally. *Fails:* Your roommate's view; ignores your relational unease about the hen and horse.
  4.  **Contractarianism:** Duties exist only between rational agents. *Fails:* Makes wild pig killing permissible; contradicts your intuition that it is wrong.
  5.  **Biocentrism:** All living things have status. *Fails:* You assign zero status to oysters and termites.
  6.  **Species Norms:** Wrongness is frustrating species-specific telos. *Fails:* Struggles with the N-line bird (engineered telos) and PVS human (no function).
  7.  **Aggregative Utilitarianism:** Sum total of suffering matters. *Fails:* You reject aggregation for oysters but accept it for shrimp; cannot explain the mouse/pantry verdict.
  8.  **Your Draft:** Point of view + Cut off + Relation + Resemblance. *Fails:* Currently inconsistent on suffering vs. death (hen vs. mice) and lacks a clear aggregation rule.

  **Defending the Survivors**

  I defend three principles that reconstruct your intuitions without collapsing into contradiction.

  **1. Threshold Relationalism (Revised User Principle)**
  *Clause A:* An entity is wrongable only if it possesses a phenomenal threshold of nociception or affect (motivated by: Crab vs. Oyster).
  *Clause B:* The weight of wrongness is proportional to the richness of the experiential future interrupted (motivated by: Pig vs. Mouse).
  *Clause C:* This weight is modulated by relational density—dependence, cohabitation, or care (motivated by: Hen vs. Pig; Dog vs. Pig).
  *Clause D:* Trivial human interests cannot override high-status entities but can override low-status ones (motivated by: Pantry Mouse vs. Bacon Pig).

  **2. Narrative Community Membership**
  *Clause A:* Wrongness consists in excluding a being from the moral community where reciprocal expectations exist (motivated by: Horse vs. Cow; PVS Human).
  *Clause B:* Symbolic residue matters; bodies representing human history carry weight beyond sentience (motivated by: PVS Human; Horse).
  *Clause C:* Killing is a betrayal of trust within established relationships (motivated by: Aunt's Hen).

  **3. Weighted Sentientism**
  *Clause A:* Suffering always counts negatively, aggregating across individuals (motivated by: Shrimp Stir-fry).
  *Clause B:* Death is a distinct harm only if the subject anticipates a future (motivated by: N-line Bird ambiguity).
  *Clause C:* Capacity differences justify hierarchy only above the sentient threshold (motivated by: Pig vs. Mouse).

  **Collisions and Costs**

  Here is where these principles clash with your verdicts, requiring you to abandon specific intuitions.

  *Threshold Relationalism* collides with your **Hen vs. Research Mice** verdict. You hold the hen's painless death is wrong, yet accept massive suffering for mice for a greater good. If the hen has higher relational status, her death weighs heavily, but if mice are sentient, their aggregated suffering should outweigh a painless death unless you deny aggregation for mammals. *Cost:* You must admit either that the hen's death is permissible given the stakes, or that the mice's suffering is impermissible despite the human benefit. You cannot have both.

  *Narrative Community* collides with your **Pig vs. Dog** verdict. If status is relational, a wild pig has low status. But you say killing a pig for bacon (trivial interest) is wrong. *Cost:* You must abandon the idea that the pig's wrongness is intrinsic; it must be based on a generalized duty not to treat mammals as commodities, which edges toward speciesism.

  *Weighted Sentientism* collides with your **N-line Bird** intuition. If the bird cannot suffer and has no anticipated future (no fear of death), killing it is technically harmless on this view. *Cost:* You must admit your unease is squeamishness, not moral wrongness, unless you posit a "teleological harm" independent of experience.

  **Verdicts on New Cases**

  **The N-line Bird:** Permissible to eat. If nociception and distress are engineered out, there is no subject to be harmed by death, only a biological process. Your unease is aesthetic, not moral.
  **The Colonial Organism:** One serious wrong. If the colony integrates learning into a single twenty-year career, it functions as one subject. Destroying it is akin to killing one large animal, not a million shrimp.
  **Uplifted Pig (Child Cognitive Profile):** Impermissible to kill. This crosses the "psychologically extended self" threshold. It now has a future it cares about; killing it is murder.
  **Silicon Pig:** Impermissible to kill. If functional tests match sentience perfectly, substrate independence applies. To deny this is carbon-chauvinism.
  **Wolf Killing Fawn:** Permissible. The wolf operates outside the moral community; it has no duty to refrain.
  **Deer in Frozen Pond:** Obligatory to rescue. Once you intervene, you enter a relational duty. Letting it die becomes a violation of Clause C (Threshold Relationalism).
  **Oyster Neuroscience:** If oysters show crab-like ganglia activity, they cross Clause A (Threshold). You must stop eating them. Aggregation still applies (a million wrongs are worse than one).
  **Original Case: The Garden Ecosystem:** Mowing a lawn destroys thousands of insects. Permissible. Individual insect status is too low (Clause D), and the relational density with humans is negligible compared to the human interest in land use.

  **On Speciesism**

  Is there a non-arbitrary version of speciesism? Yes, but it is not about biology; it is about **moral community**. Preferring humans over pigs is not arbitrary if grounded in reciprocal duties, shared language, and deep relational interdependence. However, preferring a dog over a pig *solely* because one is a pet and the other is livestock is arbitrary unless you acknowledge that *making* something livestock is itself the wrong. What you call "speciesism" is often "relational density" misidentified. But the residual preference for humans in the PVS case suggests a symbolic duty to our own kind that is hard to justify universally. You should accept that partiality to humans is permissible within a community framework, but not as a universal metaphysical truth.

  **The Decisive Empirical Discovery**

  The discovery that would move me most is **definitive evidence of episodic future thinking in fish**. Currently, we debate their nociception. If fish demonstrated they plan for specific future needs days in advance (like scrub jays), Clause B (Threshold Relationalism) would trigger heavily. It would collapse the distinction between "simple sentience" and "subject-of-a-life," making commercial fishing morally equivalent to factory farming pigs. This would force a radical restructuring of global food systems, whereas oyster sentience merely shifts a threshold line. The fish case bridges the gap between the shrimp (aggregation) and the pig (individual status), testing whether capacity or sentience is the true lever of wrongness.
