      *   *Defender's Move:* A sophisticated defender (like Hanson or a Bayesian epistemologist) would concede AAT doesn't apply *directly* to model disputes but argues the *norm* extends: you should try to merge models. I need to distinguish the *theorem* from the *normative heuristic*.

