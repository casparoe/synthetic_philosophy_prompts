  There is a principle that captures almost all of your intuitions, but to make it work consistently, it will require you to reclassify one of your existing verdicts.

  The principle is the **"At-Issue" (or "Main Point") Test**.

  ### The Principle
  **An inference counts as an *Implicature* only if it is a side-constraint or additional information that is *not* the primary point of the utterance. If the inference is required to make the utterance a relevant, coherent move in the conversation (i.e., it is "at-issue"), it is part of *What Is Meant* (direct communication), not an implicature.**

  In modern pragmatics (specifically work by Craige Roberts, Mandy Simons, and François Recanati), this distinguishes between inferences that are the *topic* of the conversation versus those that are backgrounded.

  ### How it fits your cases
  1.  **"Some of the students passed"**: The main point is that *some passed*. The "not all" inference is a side-constraint on the quantity. It is **not at-issue**.
      *   *Verdict:* **Implicature.** (Matches your gut).
  2.  **"You may bring a dog or a cat"**: The main point is permission. The "not both" exclusion is not generated (Free Choice).
      *   *Verdict:* **No Implicature.** (Matches your gut).
  3.  **"I don't know whether it's raining"**: The main point is your epistemic state. No exclusivity inferred.
      *   *Verdict:* **No Implicature.** (Matches your gut).
  4.  **"Can you pass the salt?"**: The main point is the *request*. The literal question about ability is merely the vehicle. Because the request is the point of the move, it is **What Is Meant**.
      *   *Verdict:* **Not an Implicature.** (Matches your gut).
  5.  **"I passed" (meaning "I think")**: The main point is your epistemic assessment. The literal claim is loosened to fit that point. It is **What Is Meant**.
      *   *Verdict:* **Not an Implicature.** (Matches your gut).

  ### The New Case: "I'm not saying that he's guilty"
  Apply the principle: What is the main point of this utterance?
  *   **Literal:** "I am not performing the speech act of accusing him." (This is technically true, but rarely the point).
  *   **Intended:** "He is guilty." (This is the reason you are speaking).

  Because "He is guilty" is the **main point** (the at-issue content) of the hint, the principle classifies this as **What Is Meant (Direct Communication)**, *not* an implicature. It is a case of *insinuation* where the speaker modulates the force of the utterance to convey the accusation directly, albeit deniably.

  ### The Verdict You Must Drop
  This principle forces you to drop your verdict on **Case 4 ("He's a doctor" / "How's your health?")**.

  *   **Your Verdict:** You called this an **implicature** ("there's an implicature, but it's about relevance").
  *   **The Principle's Verdict:** This must be **What Is Meant**.
  *   **Why?** In the context of "How's your health?", the statement "He's a doctor" is only coherent if understood as "He can help you." That inference ("He can help") is the *main point* of the answer. It is at-issue. Just like "Pass the salt" is the main point of the salt request, "He can help" is the main point of the doctor answer.

  If you accept that "Pass the salt" (Case 5) is direct meaning because it's the main point, you must consistently treat "He's a doctor [so he can help]" (Case 4) the same way. Both are relevance-driven enrichments that constitute the primary message, distinguishing them from the "not all" in Case 1, which is truly a side-inference.

  **Summary:**
  *   **Principle:** The At-Issue / Main Point Test.
  *   **New Case:** "He is guilty" is **What Is Meant** (Direct), not an implicature.
  *   **Forced Drop:** You must reclassify **"He's a doctor"** from an implicature to **What Is Meant**.
