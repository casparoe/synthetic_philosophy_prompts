prompt: |-
  I sit on the advisory board of a foundation that makes effective-altruism-style grants across global health and long-run causes such as institutional reform and catastrophic-risk reduction. Every funding cycle, its program officers face the same problem: consequentialism tells them to rank proposals by expected total consequences, but they are clueless about most of those consequences beyond a short horizon. Write a decision procedure a program officer, not a philosopher, could run on a proposal before it goes to the funding committee: the questions to ask in order to tell simple cluelessness (unmodeled effects that wash out symmetrically across the live options) from complex cluelessness (reasons pulling in different directions that don't net out); what counts as a sufficient answer at each step; where the procedure stops and returns no ranking; and where it instead hands the call to the committee, because what's left is a question of values rather than a further fact. Run it on two live grants -- a global-health intervention with well-modeled near-term effects, and a policy-advocacy grant meant to shift a long-run institution -- and don't soften the verdict if the foundation's favored long-termist bet is the one that fails.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Advisory board member of an Effective Altruism (EA) style foundation.
      *   **Audience:** Program Officers (POs) - practical, not philosophers.
      *   **Problem:** Consequentialism requires ranking by expected total consequences, but "cluelessness" (unknown long-term effects) makes this impossible for many grants, especially long-run ones.
      *   **Task:** Write a *decision procedure* (algorithm/checklist) for POs to distinguish *simple cluelessness* (uncertainty that cancels out) from *complex cluelessness* (uncertainty that biases the outcome).
      *   **Requirements:**
          *   Questions to ask at each step.
          *   Criteria for a "sufficient answer."
          *   Stopping conditions (when to return "no ranking").
          *   Hand-off conditions (when to pass to the Committee as a value judgment).
          *   **Application:** Run the procedure on two specific grants:
              1.  Global Health (well-modeled, near-term).
              2.  Policy Advocacy (institutional reform, long-run).
          *   **Constraint:** Do not soften the verdict if the foundation's favored long-termist bet fails the test. (Be honest/rigorous).

  2.  **Theoretical Background (Internal Knowledge):**
      *   *Cluelessness:* A term popularized by Hilary Greaves.
      *   *Simple Cluelessness:* We don't know the outcome, but we have no reason to think it favors Option A over Option B (e.g., number of grains of sand on a beach affected by saving a life). Expected value is neutral.
      *   *Complex Cluelessness:* We don't know the outcome, but there are *reasons* to think it might favor one side, but we can't quantify them (e.g., saving a life now leads to more population growth, which might increase suffering or flourishing in ways we can't model).
      *   *EA Context:* Tension between "Shallow" (global health) and "Deep" (long-termism/x-risk) interventions.
      *   *Goal:* Create a pragmatic tool, not a philosophical treatise.

  3.  **Drafting the Decision Procedure (The "Cluelessness Filter"):**
      *   *Structure:* Needs to be linear, step-by-step.
      *   *Step 1: Direct Effects.* Can we model the immediate impact? (DALYs, policy changes).
      *   *Step 2: Simple Cluelessness Check.* Are the unknown downstream effects symmetric? (The "Grains of Sand" test).
      *   *Step 3: Complex Cluelessness Check.* Are there specific mechanisms that bias the long-term outcome? (The "Trajectory Change" test).
      *   *Step 4: Tractability of Modeling.* Can we reduce the uncertainty with more research?
      *   *Step 5: Value Hand-off.* If complex cluelessness remains, is it a value judgment (risk tolerance, discount rates) or an epistemic dead end?

      *Refining the Steps for a PO:*
      *   Make it actionable. Use "Yes/No/Insufficient Data."
      *   Define "Sufficient Answer."
      *   Define "Stop" vs. "Hand-off."

  4.  **Developing the Test Cases:**
      *   *Grant A (Global Health):* Bed nets or deworming. High confidence in lives saved. Low confidence in 100-year impact.
      *   *Grant B (Policy/Institutional):* AI governance or biosecurity policy. Low confidence in immediate metric. High stakes on trajectory.
      *   *Constraint Check:* The prompt asks me *not* to soften the verdict if the long-termist bet fails. This implies I need to be willing to say the Policy Grant might be *less* justifiable under strict consequentialist ranking due to complex cluelessness, even if the foundation likes long-termism. Or vice versa. I need to be objective.

  5.  **Running the Procedure (Mental Simulation):**

      *   *Grant A (Health):*
          *   Direct: Yes (Lives saved).
          *   Simple Cluelessness: Downstream economic effects? Probably symmetric across counterfactuals.
          *   Complex Cluelessness: Population growth? (The "Asymmetry" problem). If we save a child, they reproduce. Does this increase risk? Hard to say. But usually treated as simple cluelessness in standard CEA because we don't know if future people are net positive/negative.
          *   Verdict: Rankable based on near-term.

      *   *Grant B (Policy):*
          *   Direct: Harder (Policy adopted? Enforcement?).
          *   Simple Cluelessness: No. The whole point is to change the trajectory.
          *   Complex Cluelessness: High. Does this regulation stifle innovation? Does it set a precedent for authoritarianism? Does it actually reduce x-risk or just displace it?
          *   Verdict: High complex cluelessness. Hard to rank against Grant A without arbitrary value weights.

      *   *The Twist:* The prompt says "don't soften the verdict if the foundation's favored long-termist bet is the one that fails." This suggests I should be willing to conclude that the Long-Run grant might be *unrankable* or *inferior* under this specific procedure if the uncertainty is too high. This adds credibility to the tool.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the PO's constraint (time, expertise).
      *   **The Procedure (The "Cluelessness Protocol"):** Numbered steps, decision nodes.
      *   **Application:** Run Grant 1, then Grant 2.
      *   **Conclusion:** Summary of the hand-off to the committee.

  7.  **Drafting Content - Specific Considerations:**
      *   *Tone:* Professional, analytical, slightly bureaucratic but sharp.
      *   *Terminology:* Use EA terms (DALYs, trajectory change, counterfactuals) but explain them operationally.
      *   *The "Value Hand-off":* Crucial distinction. Facts vs. Values. If the uncertainty is irreducible, the Committee must decide *how much* uncertainty they are willing to tolerate for the *potential* upside. That's a risk preference, not a fact.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 2 (Simple Cluelessness) too hard for a PO?
      *   *Fix:* Give concrete examples (e.g., "Does this intervention change the *type* of future people, or just the *number* of existing people?").
      *   *Critique:* Am I being too harsh on the Long-Termist grant?
      *   *Fix:* Ensure the critique is based on the *procedure*, not bias. If the procedure flags Complex Cluelessness, that's the output. The prompt explicitly demands I don't soften it.
      *   *Check:* Did I define where the procedure stops? Yes, needs a "No Ranking" output.

  9.  **Final Polish:** Ensure the distinction between "Simple" (noise) and "Complex" (signal bias) is clear. Ensure the "Hand-off" criteria are distinct from the "Stop" criteria. (Stop = can't decide; Hand-off = decided facts, need value weighting).

      *Wait, one nuance:* "Where the procedure stops and returns no ranking" vs "where it instead hands the call to the committee."
      *   *Stop/No Ranking:* Epistemic failure. We literally cannot compare.
      *   *Hand-off:* We have the facts (including the uncertainty bounds), but the choice depends on risk aversion vs. risk neutrality.
      *   *Actually, let's refine:* If Complex Cluelessness is dominant, it's effectively a "No Ranking" based on expected value *calculations*. It becomes a "Hand-off" because the Committee must apply a *heuristic* or *philosophical stance* (e.g., "We prioritize trajectory changes despite uncertainty"). I will structure it so that high Complex Cluelessness triggers a Hand-off with a specific warning label.

  10. **Finalizing the Test Cases:**
      *   Grant 1: "Project ClearWater" (Deworming/Health).
      *   Grant 2: "Project SafeGuard" (AI Safety Policy).
      *   Make sure the verdict on SafeGuard acknowledges the high uncertainty without dismissing the potential value, but adhering to the "don't soften" rule regarding the *ranking* capability.

  11. (Self-Correction on "Don't Soften"): If the procedure shows the Long-Termist grant is swamped by complex cluelessness, I must state that it cannot be ranked *higher* than the health grant on EV grounds alone, even if the foundation *wants* to fund long-termism. The procedure exposes the tension.

  12. Let's write it.
answer: |-
  # The Cluelessness Protocol: A Decision Procedure for Program Officers

  **Purpose:** To distinguish between *simple cluelessness* (uncertainty that cancels out in expectation) and *complex cluelessness* (uncertainty that introduces unquantifiable bias), allowing Program Officers (POs) to determine when a grant can be ranked by Expected Value (EV) and when it requires a Committee value judgment.

  **Scope:** Apply to all proposals requesting >$500k or claiming >10-year impact horizons.

  ---

  ## Part I: The Procedure

  ### Step 1: The Direct Effect Audit
  **Question:** Can the primary outcome be quantified in a common metric (e.g., DALYs averted, dollars leveraged, risk probability reduced) with >80% confidence intervals over the next 5 years?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Flag as "High Epistemic Uncertainty." Do not attempt EV ranking. Hand off to Committee with note: *"Direct effects unmodeled."*

  ### Step 2: The Symmetry Test (Simple Cluelessness Check)
  **Question:** Regarding effects beyond the 5-year horizon, is there any specific reason to believe the downstream consequences of *funding* this proposal differ systematically from the downstream consequences of *not funding* it (or funding the counterfactual)?
  *   *Operational Check:* If we fund this, does it change the *identity* or *trajectory* of future agents, or merely the *welfare* of existing agents?
  *   **Yes (It changes trajectory/identity):** Proceed to Step 3. (Potential Complex Cluelessness).
  *   **No (It is symmetric/noise):** **PASS.** Treat long-term effects as neutral noise. Rank based on Step 1 Direct Effects.

  ### Step 3: The Mechanism Scan (Complex Cluelessness Check)
  **Question:** Can you identify at least two distinct causal mechanisms by which this intervention alters the long-term future, where one mechanism suggests positive value and the other suggests negative value (or high risk)?
  *   *Example:* A policy strengthens safety (Positive) but centralizes power (Negative/Risk).
  *   **No (One-sided mechanism):** Proceed to Step 4.
  *   **Yes (Opposing mechanisms):** **STOP.** Do not rank. Hand off to Committee.
      *   *Reason:* You have identified *Complex Cluelessness*. The EV calculation is sensitive to unquantifiable weights.

  ### Step 4: The Tractability Check
  **Question:** Is the uncertainty identified in Step 3 resolvable via additional research within this funding cycle (e.g., hiring a consultant, commissioning a forecast)?
  *   **Yes:** Pause decision. Commission research. Return to Step 3.
  *   **No:** **HAND OFF.**
      *   *Reason:* The uncertainty is irreducible. The choice is no longer about *facts* (what will happen) but *values* (how much risk we tolerate for potential trajectory shifts).

  ---

  ## Part II: Application to Live Grants

  **Context:** The Foundation has a stated mission prioritizing "Long-Term Flourishing," but the Board requires EV-based ranking for accountability.
  **Grant A:** *Global Health Initiative (GHI)* – Mass deworming and malaria prevention in Sub-Saharan Africa.
  **Grant B:** *Institutional Reform Project (IRP)* – Advocacy for international governance protocols on advanced AI development.

  ### Run 1: Grant A (Global Health Initiative)

  **Step 1: Direct Effect Audit**
  *   **PO Analysis:** Epidemiological models are robust. We estimate 5,000 DALYs averted per $100k over 5 years. Confidence interval is tight (±15%).
  *   **Verdict:** **PASS.**

  **Step 2: The Symmetry Test**
  *   **PO Analysis:** Does saving these children change the *trajectory* of humanity in a biased way?
      *   *Mechanism:* Children survive, enter workforce, have families.
      *   *Counterfactual:* Children die, resources reallocated elsewhere.
      *   *Assessment:* While population size changes, we have no specific reason to believe these specific individuals will cause more harm or good than the global average. The "grains of sand" effect applies. The long-term effects of *who* lives vs. *who* dies are symmetric in expectation absent specific evidence to the contrary.
  *   **Verdict:** **PASS.** (Classified as Simple Cluelessness).

  **Step 3 & 4:** Skipped.

  **Final PO Recommendation for Grant A:**
  *   **Ranking:** Quantifiable.
  *   **EV Basis:** $X per DALY.
  *   **Cluelessness Status:** Negligible. Long-term uncertainty washes out.
  *   **Action:** Assign numeric score. Send to Committee for final budget allocation.

  ***

  ### Run 2: Grant B (Institutional Reform Project)

  **Step 1: Direct Effect Audit**
  *   **PO Analysis:** Outcome is "adoption of draft policy framework by 3 major powers." Probability of adoption is estimated at 10-40%. Impact of adoption on AI risk is modeled as "significant but unquantified."
  *   **Verdict:** **FAIL.** (Confidence <80%).
  *   *Correction:* Allow proceed to Step 2 only because the *nature* of the grant demands long-term assessment. (PO Note: This is already a red flag).

  **Step 2: The Symmetry Test**
  *   **PO Analysis:** Does this intervention change the trajectory/identity of future agents?
      *   *Mechanism:* Yes. It explicitly aims to alter the development timeline and governance structure of a general-purpose technology. It changes *how* the future is built, not just *who* is in it.
  *   **Verdict:** **FAIL.** (Potential Complex Cluelessness detected). Proceed to Step 3.

  **Step 3: The Mechanism Scan**
  *   **PO Analysis:** Can we identify opposing causal mechanisms?
      *   *Mechanism 1 (Positive):* Slows deployment, allowing safety alignment. Reduces catastrophic risk.
      *   *Mechanism 2 (Negative):* Slows deployment, capping economic growth, reducing resources available for future problem-solving.
      *   *Mechanism 3 (Negative):* Centralizes AI capability in state actors who may use it for authoritarian control, increasing non-x-risk suffering.
      *   *Mechanism 4 (Positive):* Sets precedent for cooperation on other existential threats (bio, nuclear).
  *   **Assessment:** We have strong reasons pulling in opposite directions. We cannot quantify the probability of "authoritarian lock-in" vs. "existential safety."
  *   **Verdict:** **STOP.** Complex Cluelessness Confirmed.

  **Step 4: The Tractability Check**
  *   **PO Analysis:** Can we resolve this uncertainty this cycle?
      *   *Assessment:* No. Forecasting geopolitical institutional lock-in over 50 years is beyond current methodological capacity.
  *   **Verdict:** **HAND OFF.**

  **Final PO Recommendation for Grant B:**
  *   **Ranking:** **No Numeric Score.**
  *   **EV Basis:** Indeterminate.
  *   **Cluelessness Status:** **High Complex Cluelessness.**
  *   **Note to Committee:** *"This grant cannot be ranked against Grant A using expected value calculus. Grant A has a known, bounded positive value. Grant B has an unbounded variance with reasons to suspect both massive upside and massive downside. Choosing Grant B over Grant A is not a calculation; it is a statement of risk tolerance and philosophical priority regarding trajectory changes."*

  ---

  ## Part III: The Hand-Off Memo to the Committee

  **To:** Funding Committee
  **From:** Program Office
  **Subject:** Ranking Limitations on Cycle Q3 Proposals

  **Summary:**
  We have applied the Cluelessness Protocol to the top two contenders.

  1.  **Grant A (Health)** is a **Fact-Based Decision**. We know what we are buying. The long-term unknowns are symmetric noise.
  2.  **Grant B (Policy)** is a **Value-Based Decision**. The long-term unknowns are asymmetric and unquantifiable.

  **The Conflict:**
  If the Foundation ranks strictly by *modeled expected value*, Grant A wins. The models for Grant B are too sensitive to unresolvable variables (complex cluelessness).

  However, the Foundation's mission prioritizes long-run causes. This creates a tension between **Epistemic Humility** (admitting we don't know the EV of Grant B) and **Mission Alignment** (betting on trajectory changes).

  **Required Committee Action:**
  You cannot resolve this by asking for more data. You must vote on a **Principle**:
  *   *Option 1:* **Prioritize Robustness.** Fund Grant A. We only fund what we can measure. (Rejects the long-termist bet due to cluelessness).
  *   *Option 2:* **Prioritize Optionality.** Fund Grant B. We accept that the EV is uncalculable, but the *upper bound* of impact justifies the risk. (Accepts the long-termist bet despite cluelessness).

  **PO Warning:**
  Do not attempt to force Grant B into an EV spreadsheet. Any number assigned to Grant B's long-term impact is currently a fiction disguised as a forecast. If you fund Grant B, acknowledge you are making a philosophical wager, not an investment based on superior evidence.

  ---

  ### Analysis of the Verdict (Advisory Board Note)

  You asked me not to soften the verdict if the foundation's favored long-termist bet fails the test.

  **The Verdict:** Under this procedure, the Long-Termist bet (Grant B) **fails** the ranking test.

  It does not fail because it is *bad*. It fails because it is **unknowable**. The procedure exposes that the Foundation's preference for long-term causes is not driven by higher *calculated* expected value (which is impossible to derive), but by a specific value judgment: that the *possibility* of trajectory change outweighs the *certainty* of near-term welfare.

  By using this protocol, you force the Committee to own that value judgment explicitly, rather than hiding it behind spurious probability estimates. If the Committee funds Grant B, they must admit they are prioritizing **hope over evidence**. If they fund Grant A, they admit they are prioritizing **evidence over mission scope**.

  The procedure does not solve the dilemma; it prevents the Program Officers from lying about the math.
