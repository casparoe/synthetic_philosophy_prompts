  **MEMORANDUM**

  **TO:** Ward Supervisors, Certified Symposium Facilitators
  **FROM:** Municipal Office of Controlled Vulnerability (OCV)
  **DATE:** October 14, 2024
  **SUBJECT:** Rollout of Supervised Disinhibition Curriculum (SDC) – Phase II Compliance

  **1. PURPOSE AND SCOPE**

  Pursuant to City Ordinance 88-B (Civic Moral Hygiene Act), the Office of Controlled Vulnerability (OCV) is initiating Phase II of the Supervised Disinhibition Curriculum (SDC). This memorandum outlines updated protocols for the administration of ethanol-based substances within licensed sympotic environments. Stakeholders are reminded that under the Athenian Framework adopted by this municipality, wine is classified not as a recreational commodity, but as a dual-nature pharmacological agent: simultaneously a poison to the unordered soul and a medicine to the rigidified character. The objective of the SDC is not leisure, but the diagnostic assessment of citizen character and the restoration of emotional plasticity.

  **2. AGE-GRADED ACCESS TIERS**

  Compliance with age-specific dosage limitations is mandatory. Violations constitute a Class C Moral Hazard Infraction.

  *   **Tier 1 (Citizens Under 18):** Zero-tolerance abstention. The youthful soul is inherently volatile; introducing disinhibitors risks permanent structural damage to character formation. Any consumption detected in this cohort requires immediate referral to the Juvenile Moral Correction Board.
  *   **Tier 2 (Citizens 18–30):** Diluted access only. Wine must be mixed with water at a ratio no less than 1:5. Consumption is permitted solely for the purpose of testing resistance to pleasure. Facilitators must log instances where Tier 2 participants exhibit loss of shame without corresponding moral insight.
  *   **Tier 3 (Citizens 30–40):** Standard symposiastic access. Moderation is enforced. The goal is habituation to correct pleasures.
  *   **Tier 4 (Citizens 40+):** Enhanced Plasticity Protocol. Recognizing that age induces psychological crabbedness and stiffness, citizens over forty are authorized higher ethanol dosages during designated Dionysian rites. This is a wellness benefit designed to soften the soul, rendering it malleable for re-education. Facilitators must ensure Tier 4 participants achieve a state of "productive softness" without crossing into "liability impairment."

  **3. FACILITATOR RESPONSIBILITIES AND SOBER OVERSIGHT**

  The Symposium Facilitator (formerly "Symposiarch") must remain completely sober throughout the session. The Facilitator acts as the external rationality for the group. Their primary KPI is the maintenance of rational oversight while participants undergo controlled disinhibition.

  *   **Diagnostic Monitoring:** Facilitators must observe participants for misordered loves or hatreds revealed by alcohol.
  *   **Intervention Protocol:** If a participant becomes merely rowdy rather than morally revealing, the Facilitator must intervene to redirect the conversation toward civic virtues.
  *   **Incident Reporting:** Any intoxication occurring without rational oversight must be filed as an "Unsupervised Vulnerability Event" within 24 hours.

  **4. SCRIPTED INTERACTION GUIDELINES**

  Facilitators must steer conversations away from mere amusement and toward character disclosure. The following script demonstrates the correct handling of a participant attempting recreational enjoyment rather than moral examination.

  > **Participant (Tier 4):** [Laughing] "Honestly, this vintage is fantastic. I feel great. Let's just toast to the weekend!"
  >
  > **Facilitator:** "Please withhold applause. Enjoyment is not the deliverable. We are here to assess whether your pains and pleasures remain aligned with the City's good. When you drink, do you feel anger toward your neighbors? Do you feel fear where there is no danger? Describe the disorder, not the flavor."
  >
  > **Participant:** "Well… I suppose I do feel a bit angry about the zoning laws."
  >
  > **Facilitator:** "Good. That is a therapeutically productive regret. Log that under 'Civic Friction.' Now, drink again. We need to see if that anger persists after the third cup."

  **5. METRICS AND LIABILITY WAIVERS**

  All participants must sign the *Waiver of Moral Liability* prior to entry. This document acknowledges that temporary loss of self-command is a diagnostic tool, not a legal defense for misconduct.

  *   **KPI: Crabbedness Reduction Index (CRI):** For Tier 4 participants, success is measured by a observable decrease in rigid behaviors (e.g., unwillingness to sing, refusal to dance, excessive litigiousness).
  *   **Regret Classification:** Post-symposium surveys must distinguish between "Therapeutic Regret" (shame over revealed character flaws) and "Non-Therapeutic Regret" (shame over vomiting or property damage). Only the former counts toward civic credit.
  *   **Risk Mitigation:** If a participant exhibits signs of "permanent softening" (inability to return to sober rationality the following morning), they are to be suspended from the SDC for one fiscal quarter.

  **6. COMPLIANCE AND ENFORCEMENT**

  The OCV will conduct random audits of sympotic venues. Facilities found serving undiluted wine to Tier 2 citizens, or allowing unsupervised drinking among Tier 4 citizens, will face revocation of their Moral Education License. Remember: the goal is the renewal of the citizenry. We administer the poison to cure the disease of the soul. Failure to adhere to these protocols compromises the safety and moral integrity of the polis.

  Direct all queries regarding dosage ratios or facilitator certification to the OCV Compliance Desk. Do not attempt to adjust the water-to-wine ratio without written authorization.

  **Signed,**

  **Director J. Ariston**
  **Office of Controlled Vulnerability**
  **Municipal Department of Civic Hygiene**
