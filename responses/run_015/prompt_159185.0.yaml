answer: |-
  ### The Conceptual Map

  Before adjudicating the specific moves, we must disentangle the four distinct questions your colleagues are running together. First, there is the **ontology of utility**: Nadia treats utility as an *ordinal representation of consistent choice* (a mathematical index), whereas Tobias treats it as a *substantive standard of well-being* (a measure of advantage or happiness). Second, there is the **measurement versus aggregation** distinction: Nadia believes she is measuring individual gains and reporting them separately (incidence), while Tobias argues that converting diverse outcomes into a single money metric *is* an act of aggregation that presupposes interpersonal comparability. Third, there is the **temporal status of preference**: Nadia relies on *ex post* revealed preference (choice under current constraints), while Tobias worries about *ex ante* welfare or *adaptive preference* (preferences distorted by the constraints themselves). Finally, there is the **role of choice**: Nadia treats choice as *constitutive* of welfare (choosing makes it good), while Tobias treats choice as merely *evidential* (and potentially flawed evidence) of an independent standard of the good. The disagreement persists because Nadia is defending the internal consistency of a choice model, while Tobias is attacking the normative validity of using that model as a welfare metric.

  ---

  ### Adjudication of Moves

  **Nadia 1:** *Observed choice is the only non-question-begging evidence... Utility names a numerical index... Audit is a strict improvement over officials guessing.*
  **Rating:** Defensible but overstated or under-described.
  **Justification:** The claim that choice is the least paternalistic evidence is defensible within a liberal framework; however, calling it the *only* non-question-begging evidence is overstated, as it ignores objective list theories or basic needs thresholds that do not rely on preference. The definition of utility as an ordinal index is standard representation theory (basically right), but the inference that this index equates to "better off" without further normative bridging is the under-described leap. She conflates *satisfaction of preference* with *well-being*.

  **Tobias 1:** *Audit measures ex post preference (adaptation)... Old option is not the same (neighbors dispersed)... 58/42 split reported as net gain (aggregation presented as measurement).*
  **Rating:** Basically right.
  **Justification:** The adaptation argument correctly identifies the endogeneity of preference formation (the "sour grapes" problem). The point about the "bundle" being different due to social externalities (neighbors) is technically crucial: revealed preference assumes ceteris paribus, which does not hold here. The aggregation critique is also correct: reporting a net gain from a split vote requires a social welfare function, not just individual measurement.

  **Nadia 2:** *Adaptation proves too much (ex ante also biased)... "Not same bundle" is a specification caution... Split is not hidden (incidence reported).*
  **Rating:** Defensible but overstated or under-described.
  **Justification:** The symmetry of bias (status quo bias vs. adaptation) is a strong theoretical point; *ex ante* preferences are not normatively privileged. However, dismissing the "bundle" change understates the constitutive role of community in housing welfare. Claiming that reporting incidence solves the problem is under-described: if the *unit* of incidence (dollars) is not comparable across persons, the table itself is misleading, regardless of whether it is aggregated.

  **Tobias 2:** *Choice-based approach claims neutrality but makes normative decisions... If both ex ante and ex post preference are contaminated, revealed preference has no privileged tie to welfare... "They chose it" is empty.*
  **Rating:** Basically right.
  **Justification:** This identifies the "empty formalism" problem. If utility is defined solely by choice, the statement "choice maximizes utility" is a tautology, not a welfare improvement claim. The observation that selecting *which* choice situation counts (ex post vs. ex ante) is itself a normative decision is a decisive critique of the claim to neutrality.

  **Nadia 3:** *Emptiness avoided by consistency conditions (testable, predictive)... Money-metric is more than redescription... Needs no cardinal, interpersonally comparable utility.*
  **Rating:** More wrong than right but pointing at something real.
  **Justification:** It is true that consistency conditions (like GARP) give the model predictive content regarding *behavior*, but this is pointing at something real (rationality) while being wrong about *welfare*. Predictive power does not generate normative significance. The claim that the money-metric needs no interpersonal comparison is technically false in this context: comparing dollar equivalents across people implicitly weights their marginal utility of income equally, which is an interpersonal comparison.

  **Tobias 3:** *Money metric smuggles back cardinality/interpersonal comparison (WTP tracks ability to pay)... Single dollar unit presupposes equal welfare significance.*
  **Rating:** Basically right.
  **Justification:** This is the standard and correct critique of the Kaldor-Hicks criterion. Willingness to pay is constrained by ability to pay. Using dollars as the common denominator assumes that a dollar represents the same amount of welfare for a rich household as for a poor one, which reintroduces the interpersonal comparisons the ordinalist framework claims to avoid.

  **Nadia 4:** *Separation of measurement from normative judgment... Compensation test (potential compensation)... Small changes/insensitive demand make measures coincide.*
  **Rating:** Defensible but overstated or under-described.
  **Justification:** The division of labor (economist provides efficiency, politician provides weights) is a standard defense, but it is overstated because the "efficiency" measure is already distributionally loaded (see Tobias 3). The "small changes" caveat (Willig, 1976) is theoretically valid but under-described in its applicability: housing relocation is rarely a marginal change, so the convergence of compensating and equivalent variation is not guaranteed here.

  **Tobias 4:** *Incidence table embeds cardinal metric (neutrality unavailable)... Compensation test isn't an ordering (Scitovsky reversal: A→B and B→A can both pass).*
  **Rating:** Basically right.
  **Justification:** The Scitovsky paradox is a fatal technical objection to using the compensation test as a welfare ordering. If a move from A to B passes the test, and the move from B back to A also passes, the criterion cannot define an "improvement." This demonstrates that the money-metric is not a coherent welfare ordering without distributional weights.

  ---

  ### Overall Verdict

  **Who is more right about what?**
  Tobias is more right about the **normative validity** of the welfare claim. He correctly identifies that the economist's toolkit (revealed preference + money metric) cannot bear the weight of the phrase "net welfare improvement" without smuggling in interpersonal comparisons and ignoring the Scitovsky paradox. Nadia is more right about the **operational necessity** of choice data. She correctly notes that *ex ante* preferences are also biased and that policy requires *some* operational metric; we cannot wait for a perfect theory of well-being to act. However, she is wrong to claim her metric is neutral.

  **Compatibility:**
  Their claims are compatible if we separate **efficiency** from **equity**. Nadia is describing a *Pareto-compatible potential improvement* (efficiency), while Tobias is demanding a *Social Welfare Function* (equity + efficiency). The conflict arises because Nadia labels the efficiency metric as "welfare," while Tobias insists "welfare" requires a normative judgment about distribution and preference formation. If Nadia admits her metric is a *decision aid* rather than a *welfare truth*, and Tobias admits that *ex post* choice is the best available *evidence* (even if imperfect) of individual good, they converge.

  **What both are missing:**
  Both colleagues missed the most salient feature of the case: the **demographic split** (elderly returning vs. families staying). This suggests that the "adaptation" Tobias fears is not uniform. The elderly may have valued the social capital of the original location (validating Tobias's "bundle" point), while the families may have valued the physical quality of the new units (validating Nadia's "choice" point). By treating the households as a uniform block for the money-metric calculation, Nadia obscured heterogeneity in constraint sets. The elderly likely faced higher transaction costs or stronger social ties, meaning their choice to return reveals a different welfare structure than the families' choice to stay. A proper adjudication would not calculate a single "$2,400 gain" but would segment the welfare analysis by household type, acknowledging that the "utility function" differs across these groups. Both treated the 42% who moved back as a "loss" to be netted out, rather than as evidence that the policy failed a specific vulnerable subgroup—a distributional fact that should have overridden the aggregate efficiency claim entirely.
