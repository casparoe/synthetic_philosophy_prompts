prompt: |-
  hey — I'm taking a philosophy of logic seminar this term (we just finished the paradoxes block, so I've seen the LP/FDE stuff and the glut-vs-gap distinction) and I'm also helping maintain a knowledge base for a student-run conference helper bot. The KB gets filled from LLM outputs plus scraped handbooks, and we keep getting flat contradictions: entry 412 says the abstract deadline is Friday, entry 517 says it isn't; the department handbook says all submissions are anonymised, the organising committee's page says author names may appear. We can't just delete one of them, because we keep provenance and sometimes both really do come from sources with equal authority. Right now our query engine is classical, so the moment a contradiction appears it 'proves' everything and returns garbage. So I want to build a triage chart, and I'd like you to write it.

  What I need is a decision tree, not an essay. Start it at the point we actually hit — 'two entries assert P and not-P, provenance roughly equal' — and end at named positions: the glut view (dialetheic, both really true), the gap view (neither, truth-value gap), the four-valued 'both' read as an information state rather than a truth value, the contextualist move where the two entries were never about the same proposition, the no-proposition-expressed move, the repair-the-data options (reject one / reweight provenance / quarantine the pair), and the option where you keep classical reasoning everywhere except inside a quarantined fragment that you only reason with paraconsistently — plus any other leaf you think belongs. Eight to twelve leaves. Build it from the logical space, not from a list of names: give me the diagnostic questions first, then say which combinations of answers are actually occupied and locate the positions in them. Every branch node has to be phrased as a question a first-year CS lab mate could answer without knowing any of the labels ('is this really one claim or two?', that kind of thing), and every leaf needs one sentence on its most awkward commitment and one sentence on what it would cost us to actually implement (do we store both? block inference? rewrite the query engine?). Where two leaves can't really be separated by your questions, flag it instead of pretending the tree sorts them; and where a combination of answers is unoccupied, tell me whether that's because it's incoherent, just unattractive, or merely unexplored.

  To keep it honest I want you to run four cases through the tree and tell me which leaf each lands on under at least two different sets of answers to your questions, because I suspect the cases don't determine a unique leaf: (1) the two deadline entries above; (2) a self-referential one, an entry whose content amounts to 'no entry with this ID is reliable' — the revenge sort of thing; (3) a vagueness case, one guideline says a room counts as small under 40 seats and another says it stops being small at 30, and the KB has both 'room 2 is small' and 'room 2 is not small'; (4) the policy conflict where two committees genuinely disagree about anonymisation. Please don't give me the standard Liar-paradox walkthrough we already did in class — I want the instrument and where it strains.
