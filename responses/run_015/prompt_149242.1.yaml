answer: |-
  # KB Contradiction Triage Chart

  **Root:** System flags Entry A (asserts *P*) and Entry B (asserts *not-P*). Provenance weight is equal.

  ### Node 1: Semantic Identity
  **Question:** If you showed both entries to the authors, would they say "Oops, we meant different things" (e.g., different deadlines, different definitions of words, different years)?
  *   **YES** → Go to **Node 1A**.
  *   **NO** (They agree it's the same claim about the same world) → Go to **Node 2**.

  ### Node 1A: Context Split
  **Question:** Is the difference based on time (e.g., policy changed) or scope (e.g., "small room" vs "small lecture hall")?
  *   **Time** → **Leaf 1: Temporalist**
  *   **Scope/Definition** → **Leaf 2: Contextualist**

  ### Node 2: Verifiability
  **Question:** Can we check an external "ground truth" (a signed PDF, a calendar API, a human admin) to prove one entry wrong?
  *   **YES** → Go to **Node 2A**.
  *   **NO** (Both sources are authoritative but disagree) → Go to **Node 3**.

  ### Node 2A: Data Repair
  **Question:** Is one source clearly outdated or known to be noisy (e.g., scraped text vs. official handbook)?
  *   **One is noisy** → **Leaf 3: Repair (Reject Source)**
  *   **Both look valid but one is factually wrong** → **Leaf 4: Repair (Reject Fact)**
  *   **Both look like errors** → **Leaf 5: Repair (Reject Both)**

  ### Node 3: Inference Requirement
  **Question:** Does the bot need to use these claims to prove *other* things (e.g., "If deadline is Friday, then late fee applies"), or just display them to users?
  *   **Just Display** → Go to **Node 3A**.
  *   **Draw Conclusions** → Go to **Node 4**.

  ### Node 3A: Information State
  **Question:** Do we care if both are "true," or just that both were "said"?
  *   **Just that they were said** → **Leaf 6: Four-Valued (Belnapian)**
  *   **We need to assign truth** → Go to **Node 4**.

  ### Node 4: Boundary Type
  **Question:** Is the contradiction caused by a fuzzy word (like "small," "near," "expensive") or a hard rule/self-reference?
  *   **Fuzzy Word** → **Leaf 7: Gap (Supervaluationist)**
  *   **Hard Rule / Self-Reference** → Go to **Node 5**.

  ### Node 5: Truth Status
  **Question:** Are we willing to say the world is actually contradictory here, or that the sentences fail to say anything true/false?
  *   **World is contradictory** → **Leaf 8: Glut (Dialetheic)**
  *   **Sentences fail to state facts** → **Leaf 9: No-Proposition**
  *   **Neither (keep data, stop logic)** → Go to **Node 6**.

  ### Node 6: Containment Strategy
  **Question:** Do we want to keep using classical logic for 99% of the KB and only handle this specific case differently?
  *   **Yes, split the system** → **Leaf 10: Hybrid (Classical + Paraconsistent Module)**
  *   **No, change the whole engine** → **Leaf 11: Global Paraconsistency**
  *   **No, just block inference on these IDs** → **Leaf 12: Quarantine (Inference Block)**

  ---

  ### Leaf Specifications

  | Leaf | Position | Most Awkward Commitment | Implementation Cost |
  | :--- | :--- | :--- | :--- |
  | **1** | **Temporalist** | Truth changes over time without explicit timestamps. | Store versioning metadata on every entry; query by time-slice. |
  | **2** | **Contextualist** | There is no "plain meaning"; all claims are indexical. | Tag entries with context IDs; rewrite queries to match context scopes. |
  | **3** | **Repair (Source)** | We claim authority to silence one source over another. | Build a provenance weighting system; manual override interface. |
  | **4** | **Repair (Fact)** | We claim access to reality outside the KB. | Build external API hooks; manual verification workflow. |
  | **5** | **Repair (Both)** | We admit our data ingestion is fundamentally broken. | Delete both entries; trigger alert for human review. |
  | **6** | **Four-Valued** | Truth is replaced by "told true/told false"; logic is non-classical. | Switch storage to Belnapian four-valued lattice; adjust query output. |
  | **7** | **Gap** | Some claims are neither true nor false (truth-value gaps). | Implement three-valued logic (K3/FDE); handle null returns in inference. |
  | **8** | **Glut** | Some contradictions are genuinely true (dialetheia). | Switch engine to LP/FDE; allow P & ~P without explosion. |
  | **9** | **No-Proposition** | Some sentences look like claims but aren't truth-apt. | Add NLP layer to classify speech acts (imperative vs. declarative). |
  | **10** | **Hybrid** | The system runs two incompatible logics simultaneously. | High overhead: route queries to classical or paraconsistent solver based on tags. |
  | **11** | **Global Para** | Classical logic is wrong everywhere, not just here. | Rewrite entire query engine; high risk of breaking existing integrations. |
  | **12** | **Quarantine** | Some data is "radioactive" and cannot touch other data. | Flag specific IDs; hard-code inference rules to skip flagged pairs. |

  ---

  ### Unoccupied / Flagged Combinations

  *   **Node 5 (Truth Status) → "World is contradictory" + Node 4 (Fuzzy Word):** *Unattractive.* Usually, vagueness is treated as a gap (neither true nor false), not a glut (both true), though some paracomplete/paraconsistent hybrids exist. Currently unoccupied in this tree.
  *   **Node 3 (Inference) → "Just Display" + Leaf 11 (Global Para):** *Incoherent.* If you aren't drawing conclusions, you don't need a global logic engine change; you just need storage.
  *   **Node 1 (Semantic) → "NO" + Leaf 1/2:** *Incoherent.* If they mean different things, you cannot reach the Glut/Gap leaves; you must resolve the ambiguity first.
  *   **Flag:** **Leaf 10 (Hybrid)** and **Leaf 12 (Quarantine)** are practically indistinguishable to the user but differ in engineering architecture (separate engine vs. same engine with skip-rules). The tree does not strictly separate them; choose based on whether you want to swap logic solvers or just add `IF` statements.

  ---

  ### Case Walkthroughs

  #### Case 1: The Deadline (Entry 412: "Friday" vs. Entry 517: "Not Friday")
  *   **Run A:**
      *   Node 1 (Same thing?): **YES** (Both mean abstract submission).
      *   Node 2 (Verifiable?): **YES** (Check the official PDF).
      *   Node 2A (Source noisy?): **YES** (517 is scraped from an old email).
      *   **Leaf 3: Repair (Reject Source).**
  *   **Run B:**
      *   Node 1 (Same thing?): **NO** (412 means abstract, 517 means full paper).
      *   Node 1A (Time/Scope?): **Scope**.
      *   **Leaf 2: Contextualist.**
  *   *Strain:* The tree doesn't tell you which answer to Node 1 is correct; it depends on human interpretation of the text.

  #### Case 2: The Revenge (Entry 999: "No entry with this ID is reliable")
  *   **Run A:**
      *   Node 1 (Same thing?): **YES** (Self-reference is exact).
      *   Node 2 (Verifiable?): **NO** (Logical fact, not empirical).
      *   Node 3 (Inference?): **YES** (Bot calculates reliability scores).
      *   Node 4 (Boundary?): **Hard Rule**.
      *   Node 5 (Truth Status?): **World is contradictory** (Accept the paradox).
      *   **Leaf 8: Glut (Dialetheic).**
  *   **Run B:**
      *   Node 1 (Same thing?): **YES**.
      *   Node 2 (Verifiable?): **NO**.
      *   Node 3 (Inference?): **NO** (Just display reliability status).
      *   Node 3A (Truth vs Said?): **Just that they were said**.
      *   **Leaf 6: Four-Valued (Belnapian).**
  *   *Strain:* Whether this is a metaphysical glut or an information state depends entirely on whether your bot *acts* on the reliability score or just displays it.

  #### Case 3: Vagueness (Room 2: "Small" (<40) vs. "Not Small" (>30))
  *   **Run A:**
      *   Node 1 (Same thing?): **YES** (Both use standard seating definition).
      *   Node 2 (Verifiable?): **NO** (35 seats is borderline).
      *   Node 4 (Boundary?): **Fuzzy Word**.
      *   **Leaf 7: Gap (Supervaluationist).**
  *   **Run B:**
      *   Node 1 (Same thing?): **NO** (Committee A defines small as <40, Committee B as <30).
      *   Node 1A (Time/Scope?): **Scope**.
      *   **Leaf 2: Contextualist.**
  *   *Strain:* The tree forces a choice between "vagueness is in the world" (Gap) vs "vagueness is conflicting definitions" (Contextualist). Both are viable engineering choices.

  #### Case 4: Policy Conflict (Handbook: "Anonymised" vs. Committee Page: "Names May Appear")
  *   **Run A:**
      *   Node 1 (Same thing?): **YES** (Same conference year).
      *   Node 2 (Verifiable?): **NO** (Genuine policy dispute).
      *   Node 3 (Inference?): **YES** (Bot must decide if it strips names from uploads).
      *   Node 6 (Containment?): **Yes, split system**.
      *   **Leaf 10: Hybrid.**
  *   **Run B:**
      *   Node 1 (Same thing?): **YES**.
      *   Node 2 (Verifiable?): **NO**.
      *   Node 3 (Inference?): **NO** (Bot just warns the user).
      *   Node 3A (Truth vs Said?): **Just that they were said**.
      *   **Leaf 6: Four-Valued (Belnapian).**
  *   *Strain:* The logical position shifts based on whether the bot is an *agent* (must act) or a *library* (must report). The tree handles this, but it shows the logic is dependent on system architecture, not just the contradiction itself.
