answer: |-
  # Take-Home Assignment: Analogy Evaluation on Closed Domains

  **Course:** Seminar on Analogy and Conceptual Fluidity  
  **Time Limit:** 48 Hours  
  **Word Limit:** 1200 words maximum  
  **Total Marks:** 25

  ### The Domain
  Objects are necklaces: beads on a closed loop, each carrying a letter from $\{a, b, c, d\}$. We write them $\langle x\ y\ z \rangle$ for beads going clockwise. There is no clasp; $\langle a\ b\ c \rangle = \langle b\ c\ a \rangle$. Successor wraps: $a \to b \to c \to d \to a$.

  ### The Problem
  We are using this domain to evaluate a model's analogical reasoning. We present example pairs $\text{Source} \to \text{Target}$ and ask for the Target of a new Source. Human labelers disagree on the following items:

  1.  **Item A:** $\langle a\ b\ c \rangle \to \langle a\ b\ d \rangle$, so $\langle d\ a\ b \rangle \to ?$
      *   *Labeler 1:* $\langle d\ a\ c \rangle$ (Rule: Advance the bead where the successor chain breaks).
      *   *Labeler 2:* $\langle a\ a\ b \rangle$ (Rule: Advance the alphabetically greatest bead).
      *   *Note:* Both rules fit the example pair.
  2.  **Item B:** $\langle a\ b\ c \rangle \to \langle a\ b\ d \rangle$, so $\langle b\ c\ d \rangle \to ?$
      *   *Labelers:* Both say $\langle b\ c\ a \rangle$.
      *   *Note:* Labeler 1 uses the "Break" rule; Labeler 2 uses the "Max" rule. Both rules pick the same bead here.
  3.  **Item C:** $\langle a\ b\ c\ d \rangle \to ?$
      *   *Labeler 1:* $\langle b\ c\ d\ a \rangle$ (Advanced every bead; result is rotationally identical to source).
      *   *Labeler 2:* "No answer" (Successor chain never breaks).
      *   *Labeler 3:* $\langle a\ b\ c\ a \rangle$ (Advanced the max bead).

  ### The Task
  Write a memo addressing the following five points. You must reference the specific bead configurations above to justify your claims.

  1.  **Classification:** Distinguish the disagreement in **Item A** from the agreement in **Item B**. Which represents conceptual slippage, which represents redescription, and which represents an underdetermined item?
  2.  **Operationalizing Slip:** Define "conceptual slippage" strictly within this ring domain. Do not use outside jargon (e.g., "Copycat", "slipnet"). Show how a slip differs from a rule conflict.
  3.  **The Identity Case:** Resolve **Item C**. Is "no answer" legitimate? Is identity ($\text{Source} = \text{Target}$) a valid transformation? Justify your stance based on the domain's topology.
  4.  **Disambiguation:** Under what specific conditions does adding a third example pair disambiguate a rule? When does it fail?
  5.  **Scoring Policy:** Recommend a grading policy for this evaluation. Should we grade the output string, the inferred rule, or report a distribution? What are the risks for model scoring if we choose incorrectly?

  ***

  # Model Answer

  **Memo: Evaluation Protocol for Ring-Domain Analogies**

  **1. Classification of Disagreements**
  Item A and Item B illustrate the critical difference between underdetermination and redescription. In Item A ($\langle d\ a\ b \rangle \to ?$), the "Break" rule identifies bead $b$ (since $b \to d$ violates successor), while the "Max" rule identifies bead $d$. These rules select different objects within the structure to operate upon. This is an **underdetermined item**: the data provided ($\langle a\ b\ c \rangle \to \langle a\ b\ d \rangle$) supports multiple distinct causal mechanisms that diverge on the test case.

  In Item B ($\langle b\ c\ d \rangle \to ?$), both rules select bead $d$. The "Break" occurs at $d$ (since $d \to b$ violates successor), and $d$ is also the alphabetically greatest bead. The output $\langle b\ c\ a \rangle$ is identical. This is **redescription**: two different conceptual descriptions map to the same structural operation. There is no disagreement in the transformation, only in the justification. Conflating these leads to false confidence in a model's reasoning; a model might get Item B right for the "wrong" reason and fail Item A.

  **2. Operationalizing Conceptual Slippage**
  In this domain, conceptual slippage is not merely disagreement. It is the migration of a role from one structural position to another due to pressure from the context. A slip occurs if the system decides that "successor" in the source maps to "predecessor" in the target, or "max bead" maps to "min bead."

  However, in Item A, we do not necessarily have slippage; we have **rule competition**. Both labelers agree on the mapping of roles (successor maps to successor); they disagree on which bead *fills* the role of "the one to change." True slippage would look like: $\langle a\ b\ c \rangle \to \langle a\ b\ d \rangle$, so $\langle d\ a\ b \rangle \to \langle c\ a\ b \rangle$ (reversing the direction of change). We must distinguish between *which object is selected* (rule competition/underdetermination) and *how the object is transformed* (slippage). Item A is the former.

  **3. The Identity Case (Item C)**
  Item C ($\langle a\ b\ c\ d \rangle \to ?$) exposes the boundary conditions of the domain. The "Break" rule fails because there is no break; the chain is perfect. The "Max" rule succeeds technically but violates the spirit of analogy as *change*.
  "No answer" is a legitimate response if the task is defined as "find the difference." However, in a closed loop, identity is a valid transformation (rotation by 0 or 4 steps). Labeler 1's answer ($\langle b\ c\ d\ a \rangle$) is rotationally identical to the source. If the domain treats rotations as equal, this is an identity transformation.
  I recommend accepting **identity** as a valid answer. Rejecting it forces the model to hallucinate a difference where none exists structurally. However, we must record it as "Identity" rather than "No Answer" to distinguish null operations from undefined ones. The "Max" rule output ($\langle a\ b\ c\ a \rangle$) is structurally distinct (two 'a's) and should be marked incorrect if the primary rule is "preserve structure unless broken."

  **4. Disambiguation via Extra Examples**
  Adding a third example pair disambiguates only if it **breaks the symmetry** between competing rules.
  *   **Success:** If we add $\langle a\ c\ d \rangle \to \langle a\ c\ a \rangle$, the "Max" rule predicts advancing $d$. The "Break" rule predicts advancing $c$ (since $c \to d$ is ok, but $d \to a$ is break? No, in $\langle a\ c\ d \rangle$, $a \to c$ is break). We need an example where the "Max" bead is *not* the "Break" bead.
  *   **Failure:** If we add $\langle a\ b\ d \rangle \to \langle a\ b\ a \rangle$, both rules still select $d$. This adds data but no information gain regarding the rule selection.
  Extra examples fail when the competing rules are co-extensive over the new data. They succeed only when the extensions of the concepts (e.g., "max" vs "break") diverge.

  **5. Scoring Policy**
  Grading the output string alone is insufficient. As seen in Item B, a correct string can hide incorrect reasoning. Grading the rule is impossible without explicit justification from the model.
  **Recommendation:** Grade using a **weighted distribution**.
  1.  **Primary Key:** The most structurally conservative answer (e.g., Item A: $\langle d\ a\ c \rangle$).
  2.  **Secondary Key:** Plausible alternative rules (e.g., Item A: $\langle a\ a\ b \rangle$).
  3.  **Penalty:** Identity answers on non-identity items.
  For model scoring, report **accuracy@1** (strict) and **accuracy@K** (plausible set). If we use a single key, we punish valid alternative conceptualizations. If we use a distribution, we acknowledge the inherent ambiguity of the domain. For Item C, the key must be "Identity/Rotation," and "No Answer" should be accepted but flagged. Using this set to score a model without acknowledging underdetermination will measure the model's bias toward the labeler's bias, not its analogical capability.

  ***

  # Marking Scheme (25 Marks)

  | Point | Requirement | Marks | Common Failure |
  | :--- | :--- | :--- | :--- |
  | **1. Classification** | Correctly identifies Item A as underdetermined (divergent rules) and Item B as redescription (convergent rules). | 5 | Conflating Item A's disagreement with conceptual slippage rather than rule competition. |
  | **2. Operationalizing Slip** | Defines slip as a change in mapping/transformation direction, distinct from object selection. Uses ring examples. | 5 | Reciting jargon ("slipnet") without applying it to bead selection vs. transformation. |
  | **3. Identity Case** | Takes a stance on Item C (Identity vs. No Answer) justified by domain topology (rotation equivalence). | 5 | Dismissing "No Answer" without justification or ignoring the rotational identity of $\langle b\ c\ d\ a \rangle$. |
  | **4. Disambiguation** | States that extra examples only help when competing rules diverge on the new data (breaking symmetry). | 5 | Claiming more data always helps, or failing to specify *when* it fails (co-extensive rules). |
  | **5. Scoring Policy** | Recommends grading rules/distributions over strict string matching; notes risk of measuring labeler bias. | 5 | Advocating for a single answer key without addressing the validity of alternative rules. |

  ***

  # Confidence Statement

  I am highly confident in the distinction between Item A (underdetermined) and Item B (redescription), as this is a structural fact about the rule extensions in the provided domain. The scoring policy recommendation (distribution vs. single key) is also robust given the ambiguity. However, I am least sure about the resolution of **Item C**. Whether "Identity" counts as a valid analogical transformation depends heavily on the semantic intent of the task (is it "find the change" or "complete the pattern?"). I have argued for Identity based on topological closure, but a strong case exists that analogy implies *difference*, making "No Answer" the philosophically stricter choice. This remains the most vulnerable point in the diagnosis.
