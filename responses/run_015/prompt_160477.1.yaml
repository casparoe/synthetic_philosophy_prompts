prompt: |-
  ok so I need help with something and im not sure if it's even one thing or if I'm mushing like three different things together. Me and my friend got into an argument about it in the car and we both ran out of vocabulary.

  Here's the thing I keep noticing with stories. When I finished this show last month I spent about four days feeling genuinely heavy about the characters — not 'that was a really good finale' sad, like don't-want-to-do-homework, stare-at-the-ceiling sad. My friend said that's just the paradox of fiction and there's a ton of philosophy about it, but when I looked around a bit, everything I found seemed to be about how you can feel real emotions toward people you know aren't real. That's part of it I guess, but the part I actually can't get a handle on is what happens *after*, and what sets it off. Three things I've noticed, both with this show and with a book last year:

  - It comes back at full strength on rewatch, even when I know the scene by heart and can say the lines before the characters do. So it's not suspense and it's not being surprised, and it's not that I forgot it's fiction — I'm basicly reciting along.
  - The trigger set is really weird. A news article about an actual person in more or less the situation the character was in did nothing to me. But a song from the soundtrack destroys me, and so does a random clip of the actor doing press for something totally unrelated. The song isn't even about the story. And it's not that I'm sadder about real people in general — the opposite, if anything.
  - I can't turn it on on purpose. If I put the song on *in order to* feel the feeling, I just get a song. It only ambushes me. Then after about a week it's gone, and I'm not sad that it's gone, which seems wrong for something that felt that much like grief.

  So my question: is there an actual established name for this specific configuration — the feeling that outlasts the story, the fact that it survives total familiarity, the mismatch between what triggers it and what the story is about, and the fact that it can't be summoned deliberately — or is it several named things that I'm lumping together? I don't want just a label dropped on me, I want the edges: is it nostalgia, is it just what music does to people generally, is it grief, is it the paradox-of-fiction thing with extra steps, is it something seperate? And if nothing fits, name it yourself, define it cleanly, and tell me what would and wouldn't count as a case — like, does it still count if it's a game where I made the choices myself, or if the story was based on a true event? Reply as a numbered list with exactly six items, each one or two sentences, no intro and no conclusion.
