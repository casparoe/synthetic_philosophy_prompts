  ### Contextual Briefing: Settled vs. Contested

  Before you go in, it is crucial to frame her position accurately relative to the field. You don't want to accidentally validate a fringe theory as orthodoxy, nor do you want to dismiss it out of hand before she explains it.

  **What is largely settled in decision theory:**
  *   **The VNM Theorem:** If an agent's preferences satisfy four specific axioms (completeness, transitivity, independence, continuity), they *must* act as if they are maximizing expected utility with linear probability weighting. This is mathematically settled.
  *   **Dutch Book Arguments:** If your betting odds (credences) don't obey the standard axioms of probability (e.g., they sum to more or less than 1, or don't update via Bayes' rule), a clever bookie can construct a series of bets that guarantee you a loss. This is generally accepted as a pragmatic constraint on rational belief.
  *   **St. Petersburg Paradox:** It is agreed that standard Expected Value (EV) theory yields counterintuitive results when payoffs are unbounded (i.e., you should pay any finite amount to play a game with infinite expected value).

  **What is genuinely contested:**
  *   **Normative Force of Axioms:** Not all theorists agree that VNM axioms are binding on *rationality*. Some argue they are merely conditions for *consistency*, not necessarily for *reasonableness*.
  *   **Fanaticism:** There is an active debate about whether we should accept "fanatical" conclusions (sacrificing a certain moderate good for a tiny chance at an astronomical good). Some accept this as a bullet worth biting; others seek to modify the theory to avoid it.
  *   **Probability vs. Weight:** The idea that "probability" in decision matrices might function as a "normative weight" rather than a frequency or credence is a minority view. This is where your guest is operating. She is likely proposing a modification to the aggregation function (how you combine weight and value) that departs from standard linear expectation.

  ***

  ### Interview Questions

  **1. The Core Mechanism**
  "You're defending a form of fanaticism—the idea that we should sometimes pursue tiny chances of astronomical value—but you're rejecting the standard linear math that usually gets people there. You call probabilities 'normative weights' that don't aggregate linearly. Can you walk us through the mechanics of that? If it's not linear aggregation, what is the mathematical operation replacing the sum?"

  *   **Follow-up:** "If you're moving away from linear summation, does your system still obey the independence axiom? If not, are you concerned that you open the door to preference reversals depending on how the options are framed?"

  **2. The Dust Specks vs. Astronomical Good**
  "Let's apply this to a classic aggregation problem. Usually, we ask whether we should accept a vast number of tiny harms to prevent one massive harm. In your framework, imagine we have a choice between a guaranteed 'moderate good' for everyone versus an infinitesimal weight on an 'astronomical good' for everyone. Standard EV might force the astronomical option if the value is high enough. Does your non-linear weighting allow you to choose the moderate good without denying the value of the astronomical one?"

  *   **Follow-up:** "If you say yes, where is the cutoff? Is there a specific point where the weight becomes too 'thin' to carry the value, or is that threshold context-dependent? If it's context-dependent, how do you prevent that from becoming a convenience store for bias?"

  **3. St. Petersburg and Risk-Paralysis**
  "One of the biggest headaches for expected value theorists is the St. Petersburg paradox, where unbounded value leads to decision paralysis—you theoretically should pay any amount to play, which is absurd. How does weighted-value non-aggregation solve this? Does your system cap the influence of unbounded value, or does it dampen the weight of the probabilities as the payoff grows?"

  *   **Follow-up:** "If you argue that weights dampen as payoffs grow, what dictates the rate of that dampening? Is there a principled reason for that specific curve, or does it risk looking like you've just reverse-engineered the math to match our intuition that paying infinite money is crazy?"

  **4. The 'Relabeling' Objection**
  "I want to press on whether this is a structural innovation or a semantic one. A skeptic might say: 'She's just formalizing the common-sense intuition that we shouldn't gamble everything on a longshot, but she's calling it "normative weighting" to make it sound like decision theory.' How do you respond to the charge that you're just relabeling risk aversion?"

  *   **Follow-up:** "If you say it's distinct from risk aversion, can you give me a concrete case where your view recommends a different action than standard risk-averse expected utility theory? I need to see where the rubber hits the road."

  **5. Coherence and Dutch Books**
  "Standard decision theory relies on coherence constraints to prevent agents from being 'money-pumped'—guaranteed to lose resources through a cycle of trades. If your normative weights don't aggregate linearly, does your agent remain immune to Dutch Books? If your weights don't sum to one or behave like standard probabilities, aren't you vulnerable to exploitation?"

  *   **Follow-up:** "If you reply that coherence constraints aren't necessary for normative rationality, I have to ask: what stops these weights from being arbitrary? If I can assign any weight I like to any outcome as long as it feels 'normative,' what makes your theory prescriptive rather than just a description of whims?"

  **6. Infinitesimals and Math**
  "You use the term 'infinitesimal chance.' In standard real-number mathematics, an infinitesimal is effectively zero. Are you employing hyperreal numbers or non-standard analysis to make this work? If you are, how do you operationalize that for real-world decision-making where we deal in finite precision?"

  *   **Follow-up:** "If you aren't using hyperreals and just mean 'very small,' doesn't that collapse your view back into standard expected utility where sufficiently large values still dominate? How do you maintain the distinction?"

  **7. The Two-Way Street of Fanaticism**
  "Fanaticism cuts both ways. If we should pursue tiny chances of enormous good, logic suggests we should also sacrifice enormous certain goods to avoid tiny chances of enormous bad (Pascal's Wager vs. Pascal's Mugging). Does your weighting system protect us from paralyzing existential risk avoidance? Or does it amplify the fear of low-probability catastrophes?"

  *   **Follow-up:** "If it amplifies the fear, are you comfortable with a normative theory that might demand we spend all our resources preventing events with one-in-a-billion odds? If not, why does the weighting function treat positive and negative infinity asymmetrically?"

  **8. Descriptive vs. Normative**
  "Behavioral economics has long known that humans *do* weight probabilities non-linearly—we overweight small risks and underweight large ones. That's Cumulative Prospect Theory. Are you saying humans are already doing this and should keep doing it, or are you proposing a new ideal that humans *should* adopt even if it contradicts their psychology?"

  *   **Follow-up:** "If it's the latter—if this is a new normative ideal—what is the justification? Is it axiomatic, or is it pragmatic? Why should we trust this new weighting over the linear model that has dominated economics for 70 years?"

  **9. Policy and Aggregation**
  "Let's scale this up to public policy. If a government adopts weighted-value non-aggregation, how does it handle budget allocation? Do we fund low-probability high-impact research (like asteroid deflection) over high-probability moderate-impact projects (like flu vaccination) more aggressively than a standard cost-benefit analysis would suggest?"

  *   **Follow-up:** "If your model suggests shifting resources toward the low-probability high-impact events, how do you justify that to a population that suffers from the certain, moderate harms you're deprioritizing? Is there a democratic deficit in your model?"

  **10. The Ultimate Justification**
  "Finally, if the linear expected value model is mathematically cleaner and protects against money pumps, why abandon it? What is the specific philosophical payoff of treating probabilities as non-aggregating normative weights that is worth the cost of added complexity and potential incoherence?"

  *   **Follow-up:** "If the payoff is simply that it makes fanaticism more psychologically palatable, is that enough? Should the comfort of the agent dictate the structure of the rationality, or should the agent adapt to the structure of rationality?"

  ***

  ### Host Tips for the Interview

  *   **Watch the "Weight" Definition:** She may try to equivocate between "weight" as a mathematical multiplier and "weight" as a metaphorical importance. If she does, press her to write the equation on the board (or describe it verbally with precision). If there is no equation, it's not decision theory; it's philosophy.
  *   **The "Arbitrariness" Trap:** Her weakest point is likely the constraint on the weights. If probabilities aren't probabilities, what are they? If they aren't constrained by logic (like probability axioms), they risk being subjective preferences. Use Follow-up #5 aggressively if she dodges this.
  *   **Fanaticism Consistency:** Ensure she stays consistent on whether she *is* a fanatic. Her title says she defends fanaticism, but her method (non-linear weighting) is usually used to *block* fanaticism. If she claims her view blocks fanaticism, ask why she calls herself a fanatic. If she claims it keeps fanaticism but makes it "safe," ask how safety is achieved without reducing the expected value.
