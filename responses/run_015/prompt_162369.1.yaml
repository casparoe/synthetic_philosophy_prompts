      *   *The "Undecidable" Legal Question:* A Gödel sentence is "This sentence is unprovable." A legal question is "Did Smith breach the contract?" These are not the same. The text claims they *can* be ordinary questions. This is the weak point. While independence results exist in math (CH), mapping them to *contingent legal facts* is a category error.

  4.  **Drafting the Response:**

      *   **Tone:** Professional, authoritative but accessible, cautious about making the colleague look bad while correcting the science.
      *   **Structure:**
