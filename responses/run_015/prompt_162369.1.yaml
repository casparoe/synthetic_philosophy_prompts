          *   *Law as Arithmetic:* This is the biggest hurdle. Law involves empirical facts ("Did John hit Bob?"). Gödel applies to *statements within the system*. A legal code maps facts to outcomes. If the facts are inputs, the code is a function. Gödel applies to the *theory* itself.
          *   *Computability:* The text conflates "Undecidable in the system" (independent) with "Undecidable by computation" (Halting problem).

      *   **Refining the Project Advice:**
          *   The Project is likely impossible, but *not* because of Gödel.
          *   It's impossible because of *ambiguity of language*, *conflicting values*, and *empirical uncertainty*.
          *   Using Gödel is "physics envy" – using a hard science theorem to solve a social science problem where the premises don't hold.
          *   If the colleague uses the Gödel argument, they risk being challenged by someone who knows logic. It's safer to argue from *legal theory* (Hart, Dworkin, open texture) than *mathematical logic*.

  5.  **Self-Correction/Review during drafting:**
