          2.  Claim-by-Claim Audit (Accept, Wince, Reject).
          3.  The "Rich Enough" Condition (The Arithmetic Hurdle).
          4.  Application to the Codification Project (Does it follow?).
          5.  The "Unbound Decider" (Does she escape?).
          6.  The "Honest Argument" (What to say in the meeting).

      *   **Refining the "Wince" points:**
