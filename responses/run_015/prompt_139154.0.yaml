answer: |-
  **Programme Notes: Public Memory and the Wall of Fame**

  This season has asked who gets put in bronze and whose name signs our streets. We close on a block in Bed–Stuy that sits on Stuyvesant Avenue, carrying the name of the last Dutch colonial governor. Yet Spike Lee's film locates its central dispute not on a plinth, but inside a pizzeria. The Wall of Fame functions as a site of *ambient commemoration*: for years, the photographs of Italian-American icons have been furniture, unseen until challenged. When Buggin' Out demands Black faces on the wall, he is not merely asking for *honour* (asserting worthiness) or *remembrance* (asserting historical significance). He is making a claim about *address*: who is the public of this space, and to whom is it answerable?

  Sal's reply relies on property rights: it is his wall, his business, his heroes. He treats the wall as private decoration. The neighbourhood, however, treats it as a public monument. This tension reveals the operation of *the ratchet*: the images were installed by a determined faction (Sal) and can now only be changed by something close to a supermajority of force. Sal's insistence that "the status quo is neutral" is exposed as a political position; maintaining the wall requires active defence. The film suggests that when a private surface accumulates enough social traffic, it becomes public terrain, regardless of the deed.

  The climax transforms this dispute into destruction. Following the police killing of Radio Raheem, the pizzeria is burned. Is this intelligible as counter-commemoration? It erases the site of exclusion. The film refuses to categorise this act as simply justified or tragic; it presents it as inevitable given the refusal of *address*. The morning after, the reckoning between Mookie and Sal is not about the building, but about the breach of community.

  Lee's own framing device acts as a commemorative gesture of the sort this season has examined. He juxtaposes two quotations: one from Martin Luther King Jr. condemning violence as impractical and immoral, and one from Malcolm X defining violence in self-defence as intelligence. He offers no synthesis. Instead, he leaves us with the photograph Smiley has tried to sell all day: King and Malcolm X shaking hands. This image is Lee's monument. It does not resolve the contradiction but insists that the antagonists are bound together. It is a successful act of public memory because it refuses to let the audience settle into a single moral comfort zone.

  Does this framework break down? There is a risk of category mistake: the Wall of Fame is, legally, decoration and fandom, not civic commemoration. Yet the film proves that commemoration is defined by use, not zoning. The neighbourhood's outrage confirms that the wall speaks for the block. The philosophical literature often assumes monuments stand on public land; Lee shows that the contested publicness of a surface matters more than the title deeds. The dispute is not about the past, but about who has standing now.

  ***

  **Discussion Moments**

  1.  **The Wall Confrontation:** Pause when Buggin' Out first challenges Sal about the lack of Black figures on the wall. Note how quickly the argument shifts from aesthetics to ownership and belonging.
  2.  **The Riot:** Pause during the destruction of the pizzeria. Observe whether the camera treats the burning wall as a loss of property or the toppling of a symbol.
  3.  **The Final Sequence:** Pause after the two conflicting quotations appear on screen, before the photograph of the handshake is shown. Consider what work the photograph is doing that the text does not.

  ***

  **What the Film Shows That Arguments Do Not**

  Philosophical debates on memory often treat monuments as static objects judged by distant observers. *Do the Right Thing* demonstrates that commemoration is a lived negotiation among people who must share space after the argument ends. The film shows that the stakes of memory are not merely historical accuracy, but present-day standing. Sal and Mookie must still trade and walk the same block the next morning; the wall matters because it dictates the terms of that coexistence. Commemoration, here, is not about stone, but about who is permitted to inhabit the present.
