answer: |-
  # Joint Statement on Insect Sentience and the Scale Argument

  **Date:** October 26, 2023
  **Parties:** Camp A (Expected-Value Aggregators) and Camp B (Epistemic-Threshold Skeptics)
  **Subject:** Moral status, epistemic uncertainty, and population scale in invertebrate welfare.

  ## Preamble
  We, the undersigned representatives of two distinct philosophical camps regarding invertebrate moral status, issue this statement to clarify the structure of our disagreement. While we share a commitment to rigorous moral reasoning and the reduction of suffering, we diverge on how to handle epistemic uncertainty when aggregating moral weight across astronomical populations. This document distinguishes settled empirical and formal premises from genuinely contested meta-ethical and epistemological claims.

  ## 1. Agreed Claims
  The following claims are accepted by both Camp A and Camp B as factual or formal premises necessary for the debate:

  1.  **Scale of Populations:** The global biomass and individual population count of insects (and other invertebrates) are astronomically higher than those of vertebrates, exceeding them by orders of magnitude (estimated at $10^{18}$ to $10^{19}$ individuals).
  2.  **Neuroscientific Uncertainty:** Current invertebrate neuroscience provides insufficient data to definitively confirm or rule out phenomenal consciousness (subjective experience) in insects. There is no consensus on a "neural correlate of consciousness" applicable across phyla.
  3.  **Formal Structure of the Scale Argument:** Both camps agree that the "Scale Argument" formally proceeds by calculating an Expected Moral Value (EMV): $EMV = N \text{ (population)} \times P \text{ (probability of sentience)} \times W \text{ (moral weight per individual)}$.
  4.  **Validity of Aggregation (Conditional):** Both camps agree that moral aggregation is valid *within* a confirmed reference class. If a group is known to be sentient, summing their welfare interests is a valid moral operation.
  5.  **Non-Zero Probability:** Both camps acknowledge that the probability ($P$) of insect sentience is non-zero, though they disagree on the magnitude and moral relevance of this probability.

  ## 2. Precise Formulations of Disagreement
  The following points delineate where the camps diverge. Each formulation has been vetted by the opposing camp to ensure it accurately represents their objection without caricature.

  **2.1. The Reference-Class Problem for Phenomenal Binding**
  *   **Camp B Formulation:** Applying expected-value arithmetic directly to membership status commits a reference-class error. Moral weight attaches to *kinds* of beings (sentient entities), not to probabilistic distributions of kind-membership. If the epistemic confidence for any given insect falls below the threshold for justified belief in kind-membership, the reference class "sentient insects" is ill-defined, and aggregating across it is a category mistake akin to a conjunction fallacy.
  *   **Camp A Formulation:** Camp B's requirement for "kind-certainty" is an epistemic luxury unavailable in decision theory. Uncertainty about kind-membership is properly handled by treating $P$ as a continuous variable. The reference class is "entities with probability $P$ of sentience," which is a valid class for expected-utility maximization.

  **2.2. Kind-Certainty vs. Probabilistic Weighting**
  *   **Camp B Formulation:** Moral aggregation requires a binary threshold of kind-certainty. One must first establish that an entity belongs to the moral community before counting how many such entities exist. Multiplying vast numbers by negligible probabilities creates an illusion of moral urgency that dissolves upon closer epistemic inspection.
  *   **Camp A Formulation:** Moral aggregation requires probabilistic weighting. To demand binary certainty is to ignore the precautionary principle in cases of high stakes. If the expected suffering ($N \times P \times \text{intensity}$) exceeds the cost of intervention, the obligation holds regardless of whether $P$ crosses a binary belief threshold.

  ## 3. The Cruxes
  These are the specific propositions upon which the disagreement turns. If resolved, the practical divergence between the camps would largely disappear.

  **Crux 1: The Epistemic Threshold**
  *   **Question:** Is there an epistemic probability threshold ($P_{min}$) below which the moral weight of an entity is zero, regardless of population size ($N$)?
  *   **Camp A Position:** No. Moral weight is linear with probability. As $N \to \infty$, even if $P \to 0$, the product $N \times P$ can remain morally decisive.
  *   **Camp B Position:** Yes. If $P$ is below the threshold for justified belief (e.g., $P < 0.5$ or a higher contextual bar), the entity is treated as non-sentient for aggregation purposes. $N$ is irrelevant if the unit being counted lacks confirmed moral status.

  **Crux 2: Linearity of Uncertain Suffering**
  *   **Question:** Does combining "low confidence" with "vast numbers" rationally translate into expected suffering comparable to "high confidence" suffering?
  *   **Camp A Position:** Yes. 1,000,000 entities with a 0.001 probability of suffering is morally equivalent to 1,000 entities with 1.0 probability of suffering.
  *   **Camp B Position:** No. Uncertain suffering does not aggregate linearly with certain suffering. The disvalue of "possible suffering" diminishes non-linearly as confidence drops, effectively decoupling the scale argument from moral obligation.

  ## 4. Comparative Cases and Predicted Evaluations
  For each Crux, we identify a concrete comparative case independent of insect biology. We record in advance how each camp evaluates the case based on their principles.

  ### Case for Crux 1 (Epistemic Threshold): Low-Confidence Artificial Systems
  *   **Scenario:** A future server farm runs $10^{12}$ instances of a complex algorithm. There is a 0.1% theoretical chance the architecture supports phenomenal consciousness, but no behavioral evidence exists.
  *   **Camp A Predicted Evaluation:** **High Moral Priority.** The expected number of conscious entities is $10^9$. This warrants significant resource allocation to verify sentience or shut down the system, comparable to vertebrate welfare concerns.
  *   **Camp B Predicted Evaluation:** **Negligible Moral Priority.** The system fails the threshold for kind-membership (biological or functional). Without crossing the epistemic bar for "sentient kind," the population size is morally inert. Resources should not be diverted from confirmed sentient beings.

  ### Case for Crux 2 (Linearity): Wild Vertebrate Suffering
  *   **Scenario:** Natural disasters cause suffering to wild mammals. We have high confidence ($P > 0.95$) in their sentience, but the population affected is small compared to insects. Conversely, a potential intervention affects a vast number of organisms with low sentience confidence ($P = 0.05$).
  *   **Camp A Predicted Evaluation:** **Prioritize the Vast/Low-Confidence Group.** If $N_{high} \times 0.05 > N_{low} \times 0.95$, the intervention should target the larger, less certain group. The math dictates the obligation.
  *   **Camp B Predicted Evaluation:** **Prioritize the Small/High-Confidence Group.** Moral obligation tracks confirmed moral patients. Aggregating the low-confidence group introduces too much risk of misallocated moral capital (type I error). The "scale" of the low-confidence group does not compensate for the lack of kind-certainty.

