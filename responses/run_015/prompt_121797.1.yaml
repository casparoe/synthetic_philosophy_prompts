answer: |-
  **Premise Check:** You claim this is a "sharpened version of Keynes's view." Plainly: it is not. Keynes did not ground his argument in evolutionary psychology, nor did he strictly limit flourishing to those with elite cultural capital. He worried about the *transition* to leisure, not a permanent biological incapacity for it. He was broadly optimistic about human adaptability over generations. Your view is a modern evolutionary-psychological revision, not a reading of Keynes. If historical accuracy regarding Keynes matters to your project, you should revise this premise. I will analyze *your* synthesis, not his text.

  1. Steel-man of the view I'm challenging
  Your argument posits that material scarcity functions as an external exoskeleton for human meaning. Work provides non-negotiable structure that masks existential anxiety. When abundance removes this necessity, most people lack the internal architecture to self-generate purpose. Evolutionary psychology suggests our cognition is calibrated for survival problems, not leisure optimization. Therefore, flourishing in abundance isn't the default human state but a niche achievement requiring specific temperamental traits and high cultural capital. Without these, abundance leads to hedonic adaptation, status inflation, and depressive anomie. This frames leisure as a biological mismatch rather than an educational deficit.

  2. Decisive defeaters: evidence or arguments that should genuinely overturn it
  Empirical data on sudden wealth challenges the motivational collapse thesis. Meta-analyses of lottery winners typically show no significant increase in depression or substance abuse compared to controls; most continue working or engage in meaningful unpaid labor. They do not drift into passive consumption en masse. Large-scale studies in Sweden and the US show labor supply reductions are modest; most maintain social routines. Similarly, longitudinal retirement data indicates stable or improved well-being post-career, provided health and income hold. This suggests humans can transition from extrinsic to intrinsic motivation without elite preparation.

  Anthropologically, the "Original Affluent Society" hypothesis notes hunter-gatherers worked far less than agrarians yet maintained robust meaning systems through ritual and kinship, not elite cultural capital. This undermines the claim that non-work meaning requires specific high-cultural training.

  Evolutionarily, the "scarcity cognition" claim is a just-so story. Humans possess strong adaptations for play, exploration, and social bonding that are not scarcity-driven. Curiosity and mastery are intrinsic motivators observed cross-culturally, suggesting the capacity for non-instrumental engagement is widespread. Neuroplasticity research shows reward systems adapt quickly to new goals; dopamine pathways respond to mastery and social recognition regardless of economic necessity. The brain does not distinguish between 'survival work' and 'meaningful play' in terms of reward chemistry. This is supported by the rise of open-source software, where millions contribute high-effort labor without economic necessity, driven purely by status and mastery. This large-scale behavior contradicts the idea that only a temperamentally elite few can find meaning without pay.

  3. Merely awkward evidence: what forces qualification but not abandonment
  Involuntary unemployment does correlate with poor mental health, but this confounds loss of structure with loss of income and social stigma. When income is controlled, the effect diminishes. This suggests it is precariousness, not lack of work, that drives anxiety.

  Furthermore, status games exist equally in scarcity; abundance merely changes the currency. If abundance produces status anxiety, scarcity produces survival anxiety. The view assumes work-status is healthier than leisure-status, which is unproven.

  Finally, "cultural capital" is often conflated with elite arts. Religious communities, sports clubs, and volunteering provide structure without high-cultural prerequisites. Many working-class retirees flourish through these networks, qualifying your claim that only specific temperaments succeed. The mechanism may be social integration, not cultivated leisure. You must distinguish between the *content* of leisure and the *structure* of commitment. If structure is the key, then abundance allows for diverse structures, not just elite ones. This forces a qualification: abundance removes *economic* structure, but not necessarily *social* structure, unless society atomizes simultaneously. Cross-national happiness data shows richer nations report higher life satisfaction overall. If abundance produced anomie, Scandinavia would be miserable. Instead, they report high meaning, suggesting strong welfare states can substitute for economic necessity as a stabilizer. This forces you to concede that institutional support, not just individual temperament, mediates the transition.

  4. Insulation check: whether this has been qualified into unfalsifiability, and whether that is a problem
  The view risks unfalsifiability if "cultural capital" is defined post-hoc by the presence of flourishing. If every happy retiree is retrospectively deemed to have had "the right temperament," the theory cannot be tested. To remain scientific, you must identify independent markers of this capital (e.g., specific education, personality traits) that predict flourishing *before* abundance occurs.

  This insulation is problematic because it morphs a psychological hypothesis into a moral justification for inequality. If flourishing requires rare capital, it implies most people deserve scarcity to remain functional. This normative leap exceeds the empirical evidence and shields the theory from counter-examples by attributing them to hidden variables. Without pre-registered criteria for what constitutes sufficient cultural capital, any counter-example can be explained away as an exception that proves the rule. This is a classic degenerative research program move. To avoid this, you must specify what percentage of the population lacks this capital and how to measure it independently of their happiness levels. Otherwise, the theory is insulated from reality by definition.

  5. Bottom line: an honest assessment of how exposed the view actually is
  Your synthesis is philosophically provocative but empirically fragile. It overstates evolutionary determinism and underestimates human adaptability to non-work structures. While scarcity does provide easy meaning, its removal does not universally cause collapse. The view is less a scientific prediction than a cultural critique of modern atomization. It is exposed by data on lottery winners and hunter-gatherers, and risks tautology unless "cultural capital" is rigorously defined independent of outcomes. Ultimately, you have identified a real risk—the loss of external scaffolding—but misdiagnosed the cause as internal incapacity rather than social design. The view holds if framed as a warning about institutional failure, but fails if framed as a limit on human nature. It is more robust as sociology than as psychology.
