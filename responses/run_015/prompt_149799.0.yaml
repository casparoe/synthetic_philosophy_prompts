      *   **Jonas's Argument (Moves 2 & 4):**
          *   Move 2: Doing vs. Allowing distinction. Active harm to the one is worse than passive loss to the five.
          *   Move 4: *Ex ante* perspective / Institutional rules. Behind a veil of ignorance (probabilistic), the risk of being the sacrificed one is catastrophic, outweighing the probabilistic benefit of being saved. This isn't aggregation; it's about generic reasons.

  3.  **Evaluate Each Move (Drafting the Adjudication):**

      *   **Move 1 (Maya - Paralysis):**
          *   *Assessment:* This is the standard, strongest objection to early Scanlon. It's technically accurate regarding the "numbers problem." However, Scanlon *does* have responses (which Maya anticipates in Move 3). It's not "mistaken," it's the core challenge.
