answer: |-
  # Which Theory of Emotion Do You Actually Hold?

  **A Diagnostic for the Philosophy of Mind Reading Group**

  You have spent the term discussing what emotions *are*. You have likely found yourself nodding along with 'perceptualism' or 'constructivism' because the label sounded appealing. This quiz ignores the labels. It presents eight concrete scenarios. Your task is not to identify the theory, but to say what is happening in the case.

  Answer each question by selecting the option that best matches your intuition. Do not overthink; choose the response that feels most natural to you. At the end, the scoring key will reveal which philosophical commitments you have inadvertently signed up for.

  ***

  ### The Quiz

  **1. The Glass Walkway**
  You are standing on a glass-floored viewing platform high above a canyon. You know perfectly well that the glass is engineered to hold the weight of a herd of elephants. You believe you are safe. Yet, your legs are shaking, your heart is racing, and you feel a distinct urge to step back.
  *   **A.** You are not *really* afraid. You are having a physical reflex, but fear requires believing you are in danger.
  *   **B.** You are afraid. The shaking and the racing heart *are* the fear, regardless of what you know.
  *   **C.** You are afraid. Your body is presenting the situation as dangerous, even though your belief says otherwise.

  **2. The Recalcitrant Phobia**
  A friend is terrified of dogs. She can fluently recite statistics showing how unlikely an attack is. She knows her own dog is gentle. Yet, when the dog approaches, she screams and runs.
  *   **A.** She is being irrational. Her fear consists in a temporary failure to hold onto her knowledge that the dog is safe.
  *   **B.** She is not reacting to the dog itself, but to her own bodily agitation; the dog is just the trigger.
  *   **C.** She sees the dog as threatening. This 'seeing' is separate from her knowledge, much like a visual illusion persists even when you know it is an illusion.

  **3. The Fictional Death**
  You are reading a novel. A beloved character dies. You weep. Later, someone points out that the character never existed, so you have lost nothing.
  *   **A.** Your grief is not genuine. You cannot grieve what does not exist; you are merely pretending or imagining grief.
  *   **B.** Your tears and chest-tightness are real physical events; that physical distress is the grief.
  *   **C.** Your grief is genuine. You are responding to the loss within the world of the story, which is a valid object of emotion.

  **4. The Flat Affect Patient**
  A patient suffers brain damage that removes their ability to feel bodily changes or show facial expression. However, when placed in a room where they were previously attacked, they consistently leave the room as quickly as possible.
  *   **A.** They are not afraid. Fear requires a conscious feeling, which they lack. They merely have a habit.
  *   **B.** They are afraid. The avoidance behaviour itself constitutes the fear, regardless of feeling.
  *   **C.** They are afraid. Their brain is still evaluating the room as dangerous, even if the feeling component is broken.

  **5. The Objectless Panic**
  You wake up at 3:00 a.m. in a state of sheer terror. Your heart hammers and you feel doom. However, there is nothing specific you are afraid of—not a burglar, not a spider, not a failure. Just terror.
  *   **A.** This is not fear. Fear must be *about* something. This is just undirected anxiety or arousal.
  *   **B.** This is fear. The bodily state is sufficient; it does not need a specific target.
  *   **C.** This is fear. You are perceiving a general threat in your environment, even if you cannot name the source.

  **6. The Morbid Jealousy**
  A man is convinced his partner is cheating. He hires detectives who find zero evidence. He is shown the exculpatory reports. He accepts the reports are authentic but remains consumed by jealous rage.
  *   **A.** He does not truly believe the reports. His emotion reveals his actual belief, despite his words.
  *   **B.** His rage is a bodily storm triggered by the thought of cheating; the evidence doesn't stop the storm.
  *   **C.** He perceives his partner's actions as suspicious. This perception persists despite his judgment that the evidence is clear.

  **7. The Snake in the Field Guide**
  You are sitting in a safe armchair reading a field guide. You read a description of a venomous snake that lives in your garden. Your heart rate spikes.
  *   **A.** You are judging that the snake *might* be present. That judgment is the fear.
  *   **B.** You are reacting physically to the concept of the snake. That reaction is the fear.
  *   **C.** You are construing the description as a threat to your safety. That construal is the fear.

  **8. The Morning After**
  You wake up feeling agitated and low. You drink coffee, read the news, and decide you are 'angry about the state of the world'. A week later, in a different mood, you read the same news and feel nothing.
  *   **A.** You were always angry; the news was the cause, you just didn't notice it until later.
  *   **B.** You had a raw physical feeling first, and you applied the label 'anger' to make sense of it.
  *   **C.** Your emotion was assembled in the moment from your mood, the context, and your concepts.

  ***

  ### Scoring Key and Logical Space

  Do not simply count your As, Bs, and Cs. The theories are not defined by a single dimension but by a profile across several. Below, we first map the **Logical Space** defined by your answers, then locate the **Positions**, and finally note the **Gaps and Indistinguishabilities**.

  #### I. The Logical Dimensions
  Your answers jointly define your stance on five philosophical dimensions.

  1.  **Doxastic Commitment (Questions 1, 2, 6):** Does the emotion require a belief (or judgment) that the object is dangerous/bad?
      *   *Yes:* You lean towards **Cognitive/Judgmental** views.
      *   *No:* You lean towards **Non-Doxastic** views (Perceptual, Somatic, etc.).
  2.  **Somatic Constitution (Questions 1, 2, 5, 7):** Is the bodily feeling (heart rate, shaking) a constituent part of the emotion, or merely a side effect?
      *   *Constituent:* You lean towards **Somatic/Feeling** views.
      *   *Side Effect:* You lean towards **Cognitive/Perceptual** views.
  3.  **Phenomenal Consciousness (Question 4):** Must the subject consciously feel the emotion for it to exist?
      *   *Yes:* You lean towards **Phenomenological** views.
      *   *No:* You lean towards **Functionalist/Attitudinal** views.
  4.  **Intentionality (Questions 3, 5):** Must the emotion be *about* a specific object or state of affairs?
      *   *Yes:* You lean towards **Intentionalist** views.
      *   *No:* You lean towards **Non-Intentionalist** or **Constructivist** views.
  5.  **Natural Kind vs. Construction (Question 8):** Are emotion categories (like 'anger' or 'fear') fixed biological kinds discovered by science, or fluid categories assembled by the mind/culture?
      *   *Fixed:* You lean towards **Essentialist** views.
      *   *Fluid:* You lean towards **Constructivist** views.

  #### II. Locating the Positions
  Match your pattern of answers to the profiles below.

  **1. The Neo-Stoic (Judgment Theory)**
  *   **Profile:** Mostly **A** answers.
  *   **Commitments:** Emotions *are* judgments (beliefs). If you know you are safe (Q1), you cannot be afraid. Recalcitrant emotions (Q2, Q6) are irrational beliefs. Fictional grief (Q3) is make-believe.
  *   **Location:** High Doxastic Commitment; Low Somatic Constitution.

  **2. The James-Lange Theorist (Pure Feeling Theory)**
  *   **Profile:** Mostly **B** answers.
  *   **Commitments:** Emotions *are* the perception of bodily changes. The shaking on the glass (Q1) is the fear. If the body doesn't feel (Q4), there is no fear. Objectless panic (Q5) is genuine fear because the body is aroused.
  *   **Location:** Low Doxastic Commitment; High Somatic Constitution.

  **3. The Perceptualist**
  *   **Profile:** Mostly **C** answers (specifically on Q1, Q2, Q3, Q6).
  *   **Commitments:** Emotions are like sensory perceptions (e.g., vision). They present the world as dangerous without requiring belief (hence recalcitrance is possible, like an optical illusion). They require an object (Intentionality).
  *   **Location:** Low Doxastic Commitment; Low Somatic Constitution (feelings are incidental); High Intentionality.

  **4. The Attitudinal Theorist (Embodied Readiness)**
  *   **Profile:** Mix of **B** and **C**, specifically choosing **B** on Q4 (Flat Affect).
  *   **Commitments:** Fear is a bodily readiness to act (avoidance), not necessarily a conscious feeling or a judgment. The patient avoiding the room (Q4) *is* afraid because their body is poised for action.
  *   **Location:** Low Doxastic Commitment; High Somatic Constitution (interpreted as action-readiness); Low Phenomenal Consciousness requirement.

  **5. The Appraisal Theorist (Hybrid)**
  *   **Profile:** Mix of **A** and **C**, often choosing **C** on Q7 (Construal).
  *   **Commitments:** Emotions involve an evaluation (appraisal) of the situation, which triggers bodily changes. It is a hybrid: cognitive but not necessarily a full 'belief', and somatic but not *just* feeling.
  *   **Location:** Medium Doxastic Commitment (Evaluation); Medium Somatic Constitution.

  **6. The Constructivist**
  *   **Profile:** Mostly **C** on Q8, and flexible elsewhere.
  *   **Commitments:** Emotion categories are not natural kinds. You feel arousal (Q8) and apply a concept ('anger') based on context. The 'nature' of the emotion is assembled, not detected.
  *   **Location:** Low Natural Kind commitment; Variable Intentionality.

  **7. The Deflationist ('No Deep Nature')**
  *   **Profile:** Inconsistent answers, or a sense that the options miss the point.
  *   **Commitments:** There is no single 'nature' of emotion. 'Emotion' is a folk term covering a disparate set of states. Trying to find a necessary and sufficient condition is a mistake.
  *   **Location:** Outside the logical space.

  #### III. Unoccupied Space
  There are logically possible combinations of answers that no major theory occupies.

  *   **The 'Unconscious Judgment' Slot:** A view that says emotions *are* judgments (Stoic) but *do not* require consciousness (Q4 Option A rejected, Q1 Option A accepted).
      *   *Status:* **Unexplored/Unattractive.** While some defend unconscious belief, classical Stoicism ties emotion to assent, which is typically conscious. Modern cognitive science allows unconscious appraisal, but then it usually shifts to Appraisal Theory rather than pure Judgment Theory.
  *   **The 'Perceptual Belief' Slot:** A view that says emotions are perceptions (non-doxastic) but *require* belief to exist (Q1 Option C rejected, Q1 Option A accepted).
      *   *Status:* **Incoherent.** This contradicts the definition of perception in this context. If it requires belief, it is not a perceptual analogue in the way Perceptualists intend.
  *   **The 'Constructed Natural Kind' Slot:** A view that says emotion categories are socially constructed (Q8 Option C) but exist independently of human categorisation (Q8 Option A).
      *   *Status:* **Incoherent.** Constructionism denies independent existence.

  #### IV. Indistinguishable Outcomes
  Be warned: this quiz cannot cleanly separate every position.

  *   **Perceptualism vs. Appraisal Theory:** In practice, these often yield identical answers on these vignettes. Both allow for recalcitrant emotions (Q1, Q2) and both involve a representation of the world as threatening. The distinction often lies in metaphysical details (is the representation belief-like or sensation-like?) that these cases do not fully tease apart. If you scored mostly **C**, you could comfortably inhabit either camp.
  *   **James-Lange vs. Attitudinal View:** Both prioritise the body over the judgment. The distinction lies in whether the body is felt (James) or whether it is a disposition to act (Attitudinal). Question 4 (Flat Affect) attempts to separate them, but a Jamesian might argue the patient has *some* subtle feeling they cannot report, while an Attitudinalist might argue the avoidance is sufficient. Your answers here may not definitively rule out one or the other.
  *   **Constructivism vs. Deflationism:** If you chose **C** on Question 8, you lean Constructivist. However, if you feel that the categories are so fluid they don't pick out a real phenomenon at all, you are a Deflationist. The quiz treats these as neighbours; your own reflection must decide if the construction yields a real kind (Constructivism) or merely a useful label (Deflationism).

  ***

  **A Note for the Blog:**
  If you found yourself wanting to answer "It depends," or "None of the above," congratulations: you may have outgrown the taxonomy. Print this quiz, circle your answers, and bring them to the final session. We shall see if your intuitions survive the term's reading.
