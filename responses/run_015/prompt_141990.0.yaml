      *   *Requirement 2: Respect for Autonomy/Authority of Current Self.* The decision shouldn't simply override the current self's values without input. (Motivation: If I hate danger, don't tell me to become a soldier just because Soldier-Me will love it). Status: Contested (Future-self advocates might dispute).
      *   *Requirement 3: Non-Arbitrariness/Consistency.* Similar cases should be treated similarly. (Motivation: Titrated transformation). Status: NN.
