  [Look briefly at the economists]
  My colleagues teach you cannot beat the market by knowing more. If everyone is rational, there are no secrets. They expect me to say my father was lucky. I cannot say that. But I can say this: The market is right about today. It was never wrong. It just wasn't looking at next year.

  My father wasn't trying to know more. He was willing to wait longer. The market is a voting machine in the short run. It prices what matters today. It panics when rain doesn't fall in July. My father's club was a weighing machine for the next decade. They didn't buy stocks the market thought were worthless. They bought stocks the market thought were irrelevant *for now*. They provided patience to a world that demands immediacy. That is not a secret; it is a discipline. And it is a discipline that requires a specific kind of life.

  You are men who have worked, who have raised families, who know that some things cannot be rushed. You understood that value often hides not in secrets, but in seasons.

  This distinction matters for today. [Pause] You are voting to dissolve the club. It might feel like surrender. It might feel like admitting the game is over. But if the strategy was always about patience, then dissolution is not quitting. It is the end of the wait.

  The harvest is here. The five-year horizons have arrived. But the men who planted those seeds are no longer here to wait for the next cycle. The club was not just a portfolio; it was a group of men willing to lock their capital away. That specific kind of patience is tied to this group. It does not transfer. It does not survive the group.

  So we do not hand this money over because we failed. We hand it over because the wait is complete. The scholarship fund at the community college is the next horizon. It is a bet on students who will not pay off for ten years. It is a bet the market cannot price today. He taught night classes there. He knew those students needed someone to wait for them, just as we waited for the pump maker.

  My father's last ledger entry was not a stock tip. It was a date. He knew when the waiting would stop. Today is that day. [Nod to the room] Thank you for waiting with him.

  2. "Where the argument does the work"

  The argument rests entirely on the pivot from "knowing" to "waiting." Specifically, the lines: "The market is right about today. It was never wrong. It just wasn't looking at next year," and "They bought stocks the market thought were irrelevant *for now*." These sentences reframe the club's activity from arbitrage (exploiting market errors) to liquidity provision (exploiting market impatience).

  If these lines are cut, the speech collapses into sentimentality. Without them, the claim that the father "beat the market" contradicts the no-trade theorem my colleagues uphold, forcing me to either lie to them or admit my father was lucky. Conversely, if I soften the distinction and admit the market was mostly efficient, the club's fifty-one years look like a hobby with excess transaction costs. The distinction validates the ledgers without violating economic theory.

  Furthermore, the dissolution logic—"That specific kind of patience is tied to this specific group of friends"—depends on this redescription. If the strategy was information gathering, new members could replace the old. If the strategy was *personal* patience, the club must die with its members. The dissolution becomes the logical conclusion of the strategy, not an admission of defeat. It transforms the vote from "we can't do this anymore" to "we have finished what we started." This allows the scholarship donation to feel like a harvest rather than a liquidation.

  3. "Lines I refused to say"

  I refused the flattering falsehood: "He saw value where others saw nothing." This implies market inefficiency my colleagues cannot accept without evidence, and it misrepresents the ledgers which admit the market was right, just early. It turns the speech into a eulogy for a ghost hunter rather than a tribute to a planner.

  I also refused the deflationary truth: "You could have achieved similar returns with an index fund and less effort." While statistically plausible, this invalidates the social purpose of the club. It turns the dissolution into a surrender to superior passive strategies, rather than a completion of a specific human project. It insults the men who spent Thursday nights together.

  Finally, I avoided saying, "He was smarter than the market." This is technically incoherent given my own teaching. It would force my colleagues to smile politely while dismissing the speech as grief-speaking. By refusing these lines, I maintain integrity with the economists while preserving dignity for the members. The speech must walk the line between technical truth and human meaning; these forbidden lines fall off either side.

  4. "Handling the actuary"

  The actuary will likely raise three points. First, that gathering information costs money (Grossman-Stiglitz), so returns are just compensation for work. Second, that the club took uncompensated risks that simply paid off. Third, that we are ignoring the clubs that failed (survivorship bias).

  The speech replies to all three without naming them. By framing the return as compensation for *waiting* rather than *working*, I address the cost argument: the cost was time, not research. By emphasizing the "five-year horizon," I acknowledge the risk was duration, not stock-picking brilliance. Finally, by dissolving the club now, I acknowledge survivorship bias implicitly: we are stopping because the conditions (this group of men) no longer exist. The speech concedes the strategy is not replicable, which neutralizes the bias objection.
