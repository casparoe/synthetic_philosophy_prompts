      *Re-evaluating the "Killer":* The user's thesis relies on "earning its keep" (predictive utility). The strongest attack is: "Predictive utility for *whom*?" If I'm not there to predict it, does it still suffer? If yes, your definition fails. If no, you're a solipsist.
