  Hey — take this one seriously and don't be polite with me: you're a moral philosopher who works on population ethics and wild animal welfare, and you've also read the empirical side. Brainstorm for a bit before you answer.

  The position I've drifted into is that destroying wild habitat is, as a rough first approximation, net-good in expectation for animal welfare: most wild animal-years seem to end in starvation, parasitism, or predation, so shrinking the number of those years probably subtracts more suffering than happiness. I know it looks monstrous and I know the biodiversity and aesthetic case against it is real — I don't need that rehearsed. What I want is what would count against it.

  Three things I'd like you to actually sort out rather than assume: (1) whether habitat loss really reduces total sentient-years at all, or mostly just reshuffles which species are around — edge effects, mesopredator release, r-selected boom-bust dynamics that could make the survivors more numerous, not fewer; (2) whether the suffering I'm worried about is concentrated in extremely short-lived juveniles whose welfare capacity may be tiny anyway, so that most of the biomass getting destroyed isn't doing much hedonic work in either direction; and (3) whether the whole thing quietly collapses into the separate question of whether a typical wild life is net negative to begin with. My own sense is that the population-dynamics question is the one that should move me most and the "nature is actually pretty idyllic" literature the least, but argue with that if I've got it backwards.

  Sections please: "Where I'm actually exposed" (~250 words), "Ranked defeaters" (~400, fatal down to merely awkward, and for each say whether a defender of my view would concede it or dismiss it as question-begging), "The unfalsifiability worry" (~200 — has this been hedged into something no evidence could touch, and if so, is that legitimate for a view like this or is it a cop-out). Skip citations, I can't check them anyway.
