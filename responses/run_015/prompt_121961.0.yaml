answer: |-
  **Verdict:** Marcus will argue the rich country should **roll out the cure domestically first**, saving the one million citizens and accepting the cost of ten million lives abroad.

  **Two Candidate Rules:**

  1.  **Institutional Reciprocity:** Moral obligations are generated by shared political structures. Citizens owe priority to one another because they participate in a coercive legal and tax system that benefits them mutually. Foreigners with whom there are "zero shared institutions" (Case 3) fall outside this sphere of justice.
  2.  **Threshold-Weighted Partialism:** Agents are permitted to favor those close to them (compatriots, family) *unless* the harm to the outsider crosses a catastrophic threshold (e.g., a 10:1 loss of life). This attempts to reconcile the permission to fund college (Case 4) with the requirement to save strangers from a fire (Case 5).

  **Which Rule He Is Actually Running:**
  Marcus is running **Institutional Reciprocity**, but with a **Domain Distinction** between *Political Allocation* and *Direct Rescue*.

  Here is the reasoning map:
  *   **Why Institutional Reciprocity fits best:** It is the only rule that explains Case 3 (the factory collapse). Proximity-weighted partialism cannot explain why a lack of *shared institutions* specifically negates the duty; mere geographic or relational proximity would still exist. Marcus explicitly ties obligation to political structure. This governs Cases 1 (taxation), 2 (tariffs), and 3 (factory).
  *   **Why Threshold-Weighted Partialism fails:** In Case 1 (Cancer vs. Nets), the efficiency ratio was already 10:1 in favor of the foreigners (nets save ten lives per dollar). Marcus *still* prioritized domestic care. If he were running a Threshold rule, he should have switched sides at that 10:1 mark. The fact that he didn't means the "threshold" isn't the deciding factor in policy cases.
  *   **Resolving the Fire Case (Case 5):** The fire scenario is the outlier because it is a *direct physical rescue*, not a *political allocation of resources*. Marcus distinguishes between what a **government** owes its citizens (priority based on institutions) and what a **moral agent** must do in an immediate emergency (utilitarian calculus). The vaccine rollout is a matter of patent law and state distribution (Political Allocation), not a bystander pulling bodies from flames. Therefore, the Institutional rule dominates, and compatriots come first.

  **The Splitting Case:**
  To prove whether Marcus holds to *Institutional Reciprocity* or if his *Direct Rescue* logic can override state policy, present him with **The State Rescue Drone**:

  > *A government-operated search-and-rescue drone is hovering over a flood zone. It has enough battery for one drop. It can drop a life raft to 1 trapped citizen in a government building, or to 10 trapped foreigners in a neighboring unaligned territory. The drone is a state asset, but the situation is an immediate physical rescue.*

  *   **If Marcus says "Save the Citizen":** He is a consistent Institutional Reciprocalist. The state's institutional duty overrides the utilitarian rescue math, even in emergencies.
  *   **If Marcus says "Save the 10 Foreigners":** He admits that the "Fire Logic" (Direct Rescue) trumps the "Institutional Logic" even when the agent is the state. This would imply his verdict on the vaccine case might be unstable if the disease is framed as an immediate emergency rather than a policy rollout.
