      *   **Point 2: Internalizing the Outer Message (The Regress Problem).**
          *   *Hofstadter's View:* The Outer Message tells you how to read the Inner. But how do you read the Outer? It needs its own Frame/Outer. This leads to infinite regress unless there's shared context.
          *   *Pipeline Reality:* The Protocol Header (Outer) is parsed by logic defined in the Schema/Code (Frame). If the Header says "Version 2," the code must know what "Version 2" implies.
          *   *Can it be fully internalized?* If the Frame contains *all* logic for *all* possible Headers, the Header becomes redundant (just a switch case). If the Header contains logic (e.g., executable schema), then the Header becomes part of the Frame.
