  {
    "core_tension": "In distributed architectures, the consumer's proper function cannot be defined non-circularly if its functional norms depend on representational success conditions that are themselves constituted by the producer-consumer relationship being explained.",
    "producer_vs_consumer": "Producer-based misrepresentation locates error in the signal generation relative to the world, whereas consumer-based misrepresentation locates error in the interpretation of the signal relative to the consumer's selected mapping function.",
    "selection_unit_problem": "Appealing to selection at the symbiotic level relocates the circularity by grounding norms in the whole but fails to resolve the internal individuation of content between the interdependent parts.",
    "unresolved_issue": "The remaining obstacle is providing a non-arbitrary account of how specific semantic content is individuated within the symbiotic unit without presupposing the functional integration that requires explanation."
  }
