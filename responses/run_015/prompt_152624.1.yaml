          *   **Output Format:** Explanation followed by a specific JSON object with four fields ("core_tension", "producer_vs_consumer", "selection_unit_problem", "unresolved_issue").

  2.  **Deconstruct the Philosophical Problem:**
      *   **Teleosemantics (Millikan):** Content is determined by the proper function of biological traits. For representations, Millikan emphasizes the *consumer* (the mechanism that uses the representation) rather than just the producer. A representation means what it does because the consumer has a proper function to respond to it in a specific way that contributes to survival/reproduction.
      *   **The Standard Case:** Producer and Consumer are within the same organism (e.g., visual system produces signals, motor system consumes them). Selection history explains the proper function of both within the same lineage.
      *   **The Distributed/Symbiotic Case:** Producer is in System A, Consumer is in System B (e.g., bee dance, human language, or hypothetical symbiotic cognitive coupling).
      *   **The Tension:**
          *   Teleosemantics defines content via proper function.
          *   Proper function is defined by selection history.
          *   For the consumer to have a proper function to respond to $X$ as meaning $Y$, the response must have been selected for because it achieved $Y$.
          *   But if the producer and consumer are distinct systems, how do we individuate the selection history?
          *   *The Circularity Worry:* To define the content of the representation, we need the consumer's proper function. To define the consumer's proper function, we need to know what conditions make its response successful (i.e., the content). If the success condition *is* the content, and the content is defined by the success condition (via proper function), are we circling?
          *   Specifically in distributed cases: The consumer's function might depend on the producer's reliability. The producer's function depends on the consumer's uptake. They co-evolve.
          *   *Constitutive vs. Epistemic:* It's not just that we don't *know* the history (epistemic); it's that the *normativity* (what the state *ought* to be) might lack a ground if the selection unit isn't clear. If the consumer's function is defined by satisfying conditions set by the producer, but the producer's function is defined by satisfying conditions set by the consumer, where does the normative anchor lie?
      *   **Producer vs. Consumer Misrepresentation:**
          *   Producer-based: The signal is produced when the condition doesn't hold (lying/malfunctioning producer).
          *   Consumer-based: The signal is produced correctly, but the consumer interprets/uses it wrongly (misreading/malfunctioning consumer).
          *   In Millikan's view, content is fixed by the consumer. So misrepresentation is primarily a failure of the consumer to map the signal to the world correctly according to its proper function.
      *   **Symbiotic Selection Unit:** If we treat the Producer-Consumer pair as a single selected unit (holobiont/symbiote), does this fix it?
          *   *Pro:* It provides a single lineage for selection history.
          *   *Con:* It might just push the problem back. Does the *internal* relation between producer and consumer within the symbiote have its own normative structure that requires prior semantic grounding? Or does the selection of the pair suffice to ground the norms of the parts?
          *   *Relocation:* It resolves the individuation problem (who is selected?) but might not resolve the circularity of *content determination* if the consumer's function is defined by the producer's output conditions which are defined by the consumer's uptake conditions.

  3.  **Drafting the Explanation:**
      *   *Introduction:* Define Millikan's consumer-based teleosemantics. Content depends on the consumer's proper function.
