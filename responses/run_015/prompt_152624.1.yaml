      *   *Producer vs. Consumer Misrepresentation:*
          *   Producer: Sends signal when state of affairs is absent.
          *   Consumer: Interprets signal incorrectly relative to its proper function.
          *   Millikan prioritizes Consumer. Misrepresentation is when the consumer fails to perform its proper function given the signal.
      *   *Constitutive vs. Epistemic:* It's not about us knowing the history. It's about whether the norm exists. If the consumer's norm depends on the producer's reliability, and the producer's norm depends on the consumer's usage, is there an independent anchor? Without a single selection history, the "ought" (proper function) might not be grounded.
      *   *Symbiotic Selection:* Treating them as one unit.
          *   Does it solve? It unifies the selection history.
          *   Does it relocate? It assumes the unit is the relevant selector. But internally, the semantic relation still needs grounding. If the consumer's function is "to interpret Producer's signal as X," and X is defined by the Producer's function "to signal X," we still have interdependence. However, if the *pair* was selected for achieving Z, and X is the mechanism, the norm comes from Z. But if X is the content, we need to ensure X isn't just defined by the loop.
          *   Verdict: Often viewed as relocating. It solves the lineage problem but leaves the internal normative dependency intact.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   Make sure to emphasize *Millikan's* specific view (Consumer-based). In producer-based views (like Dretske), the indicator relation is key. In Millikan's, it's the consumer's mapping device.
      *   The circularity is: Content $\leftarrow$ Proper Function $\leftarrow$ Success Conditions $\leftarrow$ Content.
      *   In distributed systems: Consumer's Proper Function $\leftarrow$ Coordination with Producer. Producer's Proper Function $\leftarrow$ Coordination with Consumer.
      *   Constitutive issue: If the normativity of the consumer's state relies on the producer's state having a specific normativity, and vice versa, neither has independent grounding unless there is a higher-order selection pressure (the symbiote).
