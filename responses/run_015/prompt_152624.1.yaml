answer: |-
  In Ruth Millikan's consumer-based teleosemantics, the content of a representation is determined by the proper function of the mechanism that consumes it. A mental state represents what it does because the consumer system has a selected history of using that state to guide behavior in ways that contributed to survival and reproduction. The proper function of the consumer is to map the representation onto specific conditions in the world; when the consumer performs this mapping correctly, the representation is true, and when it fails despite the mechanism functioning as selected, the representation is false. This framework relies heavily on the existence of a stable selection history that defines the normative standards for the consumer's operation.

  The conceptual tension arises when this framework is applied to distributed or symbiotic cognitive architectures where the producer of the signal and the consumer of the signal belong to distinct biological systems. In a standard individual organism, the producer and consumer share a single evolutionary lineage, ensuring that their coordinated functions are grounded in a unified selection history. In a distributed architecture, however, the consumer's proper function depends on responding to signals produced by a separate system. To define the consumer's proper function non-circularly, one must specify the success conditions under which the consumer's response is beneficial. Yet, in a tightly coupled symbiotic relationship, the benefit of the consumer's response often depends on the reliability of the producer, and the producer's reliability depends on the consumer's uptake.

  This generates a circularity risk regarding the grounding of normative content. The content of the representation is supposed to be explained by the consumer's proper function. However, the consumer's proper function is defined by the conditions under which its response succeeds. If those success conditions are themselves defined by the representational content (e.g., the consumer succeeds when it responds to the signal as indicating $X$, where $X$ is the content), the explanation becomes circular. In distributed systems, this is exacerbated because the success conditions often involve the state of the producer system. If the producer's state is also understood teleosemantically, we face a mutual dependence: the consumer's function is defined by the producer's output conditions, and the producer's function is defined by the consumer's input conditions.

  It is crucial to distinguish between producer-based and consumer-based misrepresentation to understand where the normative weight lies. In producer-based accounts, misrepresentation occurs when the producer sends a signal in the absence of the corresponding state of affairs. In Millikan's consumer-based framework, misrepresentation is primarily a failure of the consumer. Even if the producer sends a signal incorrectly, if the consumer responds according to its proper function, the error lies with the producer, not the content of the representation as consumed. Conversely, if the producer sends a correct signal but the consumer maps it to the wrong worldly condition, the consumer is malfunctioning, and misrepresentation occurs. In distributed architectures, this distinction becomes blurred because the "malfunction" of one party may be the normal condition for the other if their selection histories are not aligned.

  The circularity worry here is not merely epistemic—it is not simply that we lack the empirical data to trace the evolutionary history of two distinct species or systems. It is a constitutive problem about grounding normative content. An epistemic problem assumes there is a fact of the matter about the proper function that we cannot access. A constitutive problem questions whether there is a fact of the matter at all. If the consumer's normative standards depend on the producer's reliability, and the producer's normative standards depend on the consumer's usage, there is no independent anchor to ground the "ought" of either system. Without a unified selection history, there is no non-arbitrary way to determine whether a mismatch between signal and world constitutes a misrepresentation or merely a mismatch between two independent systems.

  Appealing to evolutionary selection history at the level of the symbiotic unit attempts to resolve this by treating the producer-consumer pair as a single selected individual. If the pair is the unit of selection, then the proper functions of both parts are derived from the survival and reproduction of the whole. This provides an external anchor for the norms: the consumer functions properly when it contributes to the symbiote's fitness, regardless of the internal dependency loop. However, this move tends to relocate the circularity rather than eliminate it. While it grounds the norms in the survival of the whole, it does not fully explain how specific content is individuated within the loop. Determining what counts as the "symbiotic unit" often presupposes the very functional integration that the theory is meant to explain. Furthermore, if the internal semantic relation between producer and consumer is still defined by their mutual coordination, the structural circularity of content determination remains within the unit, even if the unit itself is selected. The theory successfully grounds the existence of norms but struggles to specify the content of those norms without referencing the interdependent relations it seeks to analyze.

