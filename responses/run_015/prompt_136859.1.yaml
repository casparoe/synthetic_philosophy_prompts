          *   *Critique:* Correctly identifies Austin's distinction between "misfires" (void) and "abuses" (hollow). Miriam is conflating them.
          *   *Verdict:* Sound.

      *   **Move 5 (Miriam):** Concedes defects but argues taxonomy doesn't matter. Reliance + Publicity generates obligation regardless of label (Promise/Assurance/Lie).
          *   *Critique:* Pragmatic turn. Shifts from "what act was performed" to "what consequences ensued." Ignores the conceptual clarity needed for the philosophy group.
