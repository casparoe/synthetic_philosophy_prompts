      *   **Move 6 (Douglas):** Label matters. Counter-example: Automated registry email. No human speaker. If label doesn't matter, did the machine promise? University is answerable. Standing is needed to explain institutional liability without anthropomorphizing the script.
          *   *Critique:* Excellent test case. Highlights the need for "institutional standing" vs. "individual authority."
          *   *Verdict:* Sound.

      *   **Move 7 (Miriam):** Script is an organ of the institution. Registry has the right relation to decisions. Chair did not.
          *   *Critique:* Tries to harmonize. Claims Registry has standing, Chair doesn't. Why? Arbitrary distinction?
