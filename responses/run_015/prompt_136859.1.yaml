answer: |-
  It is a pleasure to address a colleague who understands that in any complex system, if the output is unstable, one must look for an uncontrolled variable. In this debate, the "system" is the taxonomy of speech acts (specifically J.L. Austin's framework, which your group is studying), and the "instability" arises because Miriam and Douglas are measuring different variables while using the same labels.

  Here is the adjudication you requested.

  ### I. Verdicts on the Eight Moves

  **1. Miriam (The Voidness Claim):** *Half Right.*
  The principle is Austinian (felicity conditions require appropriate authority), but the application is empirically dubious. A department chair usually *does* possess the conventional standing to speak for the department; her error is insincerity, not a lack of procedural authority, making the act "hollow" rather than "void."

  **2. Douglas (The Uptake Claim):** *Sound but Incomplete.*
  He correctly identifies that audience uptake is a necessary condition for a speech act to take hold, but he errs in suggesting uptake alone can confer authority; a crowd cannot authorize a stranger to christen a ship simply by believing she can.

  **3. Miriam (The Lie/Forecast Claim):** *Sound.*
  This is her strongest move. She correctly isolates the content: promising an outcome entirely outside one's control functions semantically as a prediction (assertion), which, if known to be false, constitutes a lie rather than a promise.

  **4. Douglas (The Insincerity Distinction):** *Sound.*
  He successfully defends the taxonomy by distinguishing a "misfire" (void act) from an "abuse" (insincere act). He shows that a promise can be successfully performed yet morally hollow if the intention is lacking, which Miriam's "lie" theory obscures.

  **5. Miriam (The Reliance Claim):** *Half Right.*
  Morally, she is correct that reliance generates obligation, but philosophically she is evasive; she abandons the question of *what act was performed* in favour of *what consequences ensued*, which sidesteps the group's taxonomic inquiry.

  **6. Douglas (The Registry Counter-Example):** *Sound.*
  This is a decisive test case. It demonstrates that institutional standing can exist without a specific human agent's intention, proving that "standing" is a structural variable independent of individual psychology.

  **7. Miriam (The Organ Theory):** *Half Right.*
  She attempts to harmonize the registry and the chair by calling both "organs," but she fails to explain why the registry's relation to the outcome is "right" while the chair's is "wrong," given both represent the institution.

  **8. Douglas (The Institutional Consistency Check):** *Sound.*
  He exposes a contradiction in Miriam's position: if the registry speaks for the university, the chair must speak for the department. This logically forces the conclusion that a promise *was* made by the department, contradicting her opening move.

  ### II. Overall Judgement

  **Douglas has the better of the argument.**

  While Miriam captures the moral gravity of the situation (the harm done to the fellow), her philosophical machinery is inconsistent. She begins by claiming the act was void (no promise made) but ends by arguing the obligations are real (reliance), without explaining how a void act generates real obligations. Douglas maintains a tighter grip on the internal logic of speech act theory. He successfully distinguishes between the *validity* of the act and the *sincerity* of the agent, and his use of the registry analogy forces a consistent definition of institutional standing that Miriam cannot refute without contradicting herself. Miriam wins the moral point, but Douglas wins the technical adjudication.

  ### III. The Missing Variable: Illocution vs. Perlocution, and Misfire vs. Abuse

  You suspected a variable was left unspecified. In fact, there are two distinct distinctions that neither party fully isolates, and clarifying them dissolves the deadlock.

  **1. Misfire vs. Abuse (The Taxonomic Variable)**
  Austin distinguishes between **Misfires** (where the procedure is flawed or the authority lacking, rendering the act *null*) and **Abuses** (where the procedure is valid but the participant is insincere, rendering the act *hollow*).
  *   **Miriam's Error:** She treats the Chair's utterance as a *Misfire* (Move 1). She argues the Chair lacked standing, so the promise was void.
  *   **Douglas's Correction:** He treats it as an *Abuse* (Move 4). The Chair had the standing (she is the Chair), but she lacked the intention/truth.
  *   **The Resolution:** The Chair likely had the *authority* to commit the department (making it a valid promise), but she lacked the *power* to ensure the committee's compliance. A promise does not require the power to guarantee fulfillment, only the commitment to secure it. Thus, it was a valid promise that was broken (an Abuse), not a void utterance (a Misfire).

  **2. Illocutionary Force vs. Perlocutionary Effect (The Causal Variable)**
  *   **Illocution:** What is done *in* saying something (e.g., the act of promising). This depends on convention and standing.
  *   **Perlocution:** What is done *by* saying something (e.g., the fellow feeling reassured, the audience being shocked). This depends on causal effects and reliance.
  *   **The Conflation:** Miriam conflates these in Move 5. She argues that because the *perlocutionary effect* (reliance) occurred, the *illocutionary act* (promise) must be binding. Douglas conflates them in Move 2, suggesting *uptake* (a perlocutionary precursor) confers *standing* (an illocutionary condition).
  *   **The Resolution:** The Chair performed the **Illocutionary Act** of promising (because she had the institutional standing). She failed to fulfill it. The **Perlocutionary Effect** was the fellow's reliance. The obligation to repair the harm stems from the broken illocutionary act, not merely from the perlocutionary effect.

  **Summary for the Group:**
  The disagreement persists because Miriam is arguing from **Consequentialism** (harm was done, so there must be an obligation) while Douglas is arguing from **Conventionalism** (rules define the act, regardless of harm). The "variable" you seek is **Institutional Competence**. The Chair possessed the competence to *promise* (illocution), even if she lacked the competence to *deliver* (causal control). Therefore, a promise was made, it was not void, and it was broken. Douglas is right that the label matters, because without the label of "Promise," we cannot locate the specific norm that was violated.
