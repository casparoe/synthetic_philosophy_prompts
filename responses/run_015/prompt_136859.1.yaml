      *   **Move 2 (Douglas):** Uptake matters. Audience took it as a promise. Authority shouldn't void promises too easily (otherwise promising is too narrow). Chair has partial standing (can promise to press).
          *   *Critique:* Good point on uptake and the scope of promising. But conflates "promising to try" with "promising outcome."
          *   *Verdict:* Sound but incomplete. (Uptake is necessary but not sufficient for felicity).

      *   **Move 3 (Miriam):** Distinguishes promising *to press* vs. promising *outcome*. "I promise P" where P is uncontrollable is a forecast/assurance. Since she knew P was false, it's a lie.
