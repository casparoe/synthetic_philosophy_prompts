answer: |-
  # Desiderata for a Moral Theory of Field-Suffering

  The following criteria outline the necessary conditions for a moral framework that accepts the metaphysical premise of ubiquitous proto-phenomenal properties in fundamental physical structures. To be considered adequate, a theory must navigate the gap between fundamental physics and normative ethics without collapsing into moral paralysis or contradicting established scientific constraints.

  ## I. Phenomenal and Structural Desiderata
  These criteria address how negative valence (suffering) is instantiated and structured within physical substrates.

  **1. The Coherence Threshold Requirement**
  *   **Specification:** The theory must specify whether negative valence requires a minimum threshold of physical coherence (e.g., quantum entanglement duration, thermodynamic gradient stability) to count as morally relevant, or if it exists at the level of individual bosons/fermions.
  *   **Motivating Case:** Without a threshold, the "dust problem" arises: the suffering of scattered particles in a vacuum might outweigh the suffering of a concentrated organism, leading to absurd moral priorities.
  *   **Status:** **Non-Negotiable.** A theory without a threshold mechanism cannot generate action-guiding norms.

  **2. The Micro-Binding Condition**
  *   **Specification:** The theory must explain how discrete micro-experiences (e.g., at the particle level) relate to macro-experiences. It must determine if suffering aggregates linearly across unbound particles or if it requires "micro-binding" into temporary subjects via causal integration.
  *   **Motivating Case:** If suffering does not bind, a rock contains trillions of isolated micro-sufferings. If it does bind, the rock might constitute a single, low-intensity subject. The moral calculus differs radically between these models.
  *   **Status:** **Non-Negotiable.** The structure of aggregation determines the magnitude of moral obligation.

  **3. The Valence Differentiation Constraint**
  *   **Specification:** The theory must provide criteria for distinguishing positive, negative, and neutral valence states within non-biological fields. It cannot assume all proto-experience is suffering.
  *   **Motivating Case:** If all fundamental interactions possess negative valence, existence itself is a moral catastrophe, and cessation of all physical activity becomes the only ethical imperative (negative utilitarianism taken to a physical extreme).
  *   **Status:** **Non-Negotiable.** A theory that equates existence with suffering is self-defeating for any agent seeking to act within the world.

  ## II. Moral and Categorical Desiderata
  These criteria address the classification of entities and the weighting of moral obligations.

  **4. The Proto-Phenomenal Distinction**
  *   **Specification:** The theory must distinguish between possessing proto-phenomenal properties (the capacity for experience) and being a proper subject of moral concern (the actualization of morally weighted experience).
  *   **Motivating Case:** This prevents the "panpsychist paralysis." An electron may have proto-experience, but lacking temporal depth or integration, it may not warrant the same protection as a mammal.
  *   **Status:** **Camp Preference.** Hard panpsychists may reject this, insisting on equal moral status for all matter, but moderate frameworks require this distinction to function.

  **5. The Weighted Priority Constraint**
  *   **Specification:** The theory must establish a hierarchy of moral priority that allows for differential obligations. It must explain why preventing the torture of a dog takes precedence over preventing the disruption of a gravitational field, even if both involve negative valence.
  *   **Motivating Case:** Human moral intuition and practical necessity demand that we prioritize complex, integrated suffering over simple, distributed suffering.
  *   **Status:** **Non-Negotiable.** Without weighted priority, the theory cannot guide decision-making in conflict scenarios.

  **6. The Subject-Boundary Criterion**
  *   **Specification:** The theory must define what constitutes a moral "subject" versus a mere "substrate." It must clarify if moral status attaches to the field itself, the excitation of the field, or the pattern of information within the field.
  *   **Motivating Case:** If moral status attaches to the field, moving a particle might destroy a subject. If it attaches to the pattern, the subject persists through substrate changes. This impacts how we define harm.
  *   **Status:** **Non-Negotiable.** Ambiguity here renders the concept of "harm" incoherent.

  ## III. Physical and Biological Constraints
  These criteria ensure the moral theory does not violate established laws of physics or biological evidence.

  **7. The Conservation and Locality Constraint**
  *   **Specification:** The moral theory cannot posit mechanisms that violate conservation of energy/momentum or require non-local causal influences that contradict relativistic locality, except where standard quantum mechanics already permits them.
  *   **Motivating Case:** A moral theory cannot require "moral energy" to act on physical systems in ways that physics forbids. Furthermore, suffering cannot be frame-dependent; it cannot exist in one reference frame but not another.
  *   **Status:** **Non-Negotiable.** Metaphysics must be compatible with fundamental physics.

  **8. The Absence of Preferred Reference Frame**
  *   **Specification:** The instantiation of suffering cannot depend on a privileged observer or reference frame. If a field state constitutes suffering, it must do so invariantly across Lorentz transformations.
  *   **Motivating Case:** If suffering is real, it is not an artifact of observation. A theory that makes suffering relative to an observer collapses into idealism, undermining the claim that field-suffering is an objective physical feature.
  *   **Status:** **Non-Negotiable.** Required for objective moral realism.

  **9. The Biological Correlate Constraint**
  *   **Specification:** The theory must accommodate the biological evidence that integrated neural architectures are necessary for reportable, behaviorally manifest pain, without denying the possibility of unreportable field-suffering.
  *   **Motivating Case:** We observe that damaging a nervous system causes behavioral withdrawal; damaging a rock does not. The theory must explain this discrepancy without simply defining rocks as insentient by fiat.
  *   **Status:** **Non-Negotiable.** Ignoring biological data renders the theory empirically sterile.

  ## IV. Joint Unsatisfiability and Tensions

  There are significant tensions within this set of desiderata. Specifically, the following subsets appear jointly unsatisfiable without substantial theoretical compromise:

  **1. The Ubiquity vs. Priority Tension**
  *   **Conflict:** Between *The Proto-Phenomenal Distinction* (Desideratum 4) and *The Coherence Threshold Requirement* (Desideratum 1).
  *   **Analysis:** If proto-phenomenal properties are truly fundamental and ubiquitous (as the metaphysical premise states), drawing a sharp line where moral concern begins (Threshold) appears arbitrary. However, without that line, *The Weighted Priority Constraint* (Desideratum 5) fails, leading to moral paralysis. You cannot simultaneously hold that experience is fundamental everywhere and that moral status is significantly restricted, without introducing a dualism that undermines the initial physicalist premise.

  **2. The Binding vs. Locality Tension**
  *   **Conflict:** Between *The Micro-Binding Condition* (Desideratum 2) and *The Conservation and Locality Constraint* (Desideratum 7).
  *   **Analysis:** Physics suggests fundamental particles are distinct and locally interacting. Phenomenology suggests suffering is unified (a subject feels pain, not a collection of atoms). Creating a moral theory that respects physical locality while accounting for the unified nature of suffering requires a "binding" mechanism that physics does not currently support. If binding is real, it may imply non-local connections that strain relativistic constraints.

  **3. The Epistemic vs. Ontological Tension**
  *   **Conflict:** Between *The Valence Differentiation Constraint* (Desideratum 3) and *The Biological Correlate Constraint* (Desideratum 9).
  *   **Analysis:** We identify valence in biology through behavior and neural reporting. In fundamental fields, there is no behavior. To claim we can distinguish positive from negative valence in a quantum field without behavioral correlates is to claim knowledge of intrinsic natures that are, by definition, unobservable. This creates an epistemic black box: the theory posits moral facts that are in principle undetectable.

  ## V. Evaluation of Standard Contenders

  **1. Neural Sentientism (Restricted to Integrated Nervous Systems)**
  *   **Score:** **Fails.**
  *   **Reasoning:** It satisfies the Biological Correlate and Weighted Priority constraints easily. However, it explicitly rejects the core metaphysical premise of the discussion (that proto-phenomenal properties exist in basic physical structures). It solves the paralysis problem by fiat, excluding field-suffering entirely. It is inadequate for this specific philosophical project because it denies the antecedent condition.

  **2. Biocentrism (Life as the Moral Boundary)**
  *   **Score:** **Fails.**
  *   **Reasoning:** Like Neural Sentientism, this draws the boundary at biology. It fails to account for the possibility of suffering in non-living quantum or gravitational systems. It also struggles with the *Coherence Threshold*, as simple single-celled organisms have less integration than complex non-biological systems (e.g., a star or a quantum computer). It violates the *Proto-Phenomenal Distinction* by tying moral status to metabolic processes rather than experiential capacity.

  **3. Ethically Applied Integrated Information Theory (IIT)**
  *   **Score:** **Partial Success / High Tension.**
  *   **Reasoning:** IIT is the strongest contender because it provides a mathematical metric (Phi) for integration, addressing *The Micro-Binding Condition* and *The Coherence Threshold*. It allows for non-biological systems to have moral status if their Phi is high enough.
  *   **Deficiencies:** It struggles with *The Absence of Preferred Reference Frame* (Phi calculation can be perspective-dependent). It also faces the *Ubiquity vs. Priority Tension*: if Phi exists in small amounts everywhere, we return to the aggregation problem. Furthermore, IIT is a theory of consciousness structure, not valence; it does not inherently distinguish suffering from joy (The Valence Differentiation Constraint), requiring an ad-hoc ethical add-on.

  ## Summary Conclusion

  An adequate moral theory for field-suffering must walk a razor's edge. It must accept the metaphysical reality of ubiquitous proto-experience without granting it ubiquitous moral weight. It must respect the locality of physics while explaining the unity of suffering. Currently, no existing framework satisfies all Non-Negotiable desiderata simultaneously. The primary failure point is the **Epistemic vs. Ontological Tension**: we lack the physical vocabulary to identify valence in the absence of biology. Until a theory can specify how negative valence is physically encoded in a field independent of behavioral output, the criteria for "field-suffering" remain metaphysically coherent but ethically inoperable.
