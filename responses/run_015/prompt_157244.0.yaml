prompt: |-
  I'm working with a reading group on the intersection of philosophy of mind and fundamental physics, and we've been pushing a line that rarely surfaces in standard panpsychism debates: if phenomenal or proto-phenomenal properties are genuinely instantiated in basic physical structures—whether in quantum coherence patterns, gravitational curvature, or thermodynamic gradients—then any adequate moral framework must include criteria for what we might call "field-suffering," meaning harm or negative valence distributed across non-biological, non-neuronal substrates. Most ethical theories implicitly assume that suffering requires a unified subject with boundaries, but if proto-experiential states are ubiquitous and unbound, we need a specification that doesn't collapse into either universal moral paralysis (everything matters with equal weight) or arbitrary anthropocentrism. Before I finalize our discussion notes, please write out the full desiderata that a moral theory in this domain must meet to count as adequate.

  Specify the phenomena it must explain—for instance, whether suffering aggregates linearly across particles, requires some form of "micro-binding" into temporary subjects, or emerges only at specific coherence thresholds; the distinctions it must preserve—such as between having proto-phenomenal properties and being a proper subject of moral concern, between possessing moral status and carrying weighted moral priority, and between local field coherence and global substrate states; and the constraints from physics and biology it cannot violate, including conservation laws, the absence of a preferred reference frame in quantum mechanics, and the biological evidence that integrated neural architectures are necessary for reportable, behaviorally manifest pain. For each desideratum, include the motivating case or consideration behind it and flag whether it is non-negotiable or a preference of a particular camp. Then identify whether any subset of these requirements is jointly unsatisfiable—particularly any tension between universal sentience commitments and the practical need for differential moral obligations, or between binding requirements and physical locality. Finally, briefly score how standard contenders fare: sentientism restricted to integrated nervous systems, biocentrism, and any ethically applied version of integrated information theory. Please write your answer in American English, keep the weight on the criteria and their conflicts rather than on exhaustive evaluation of existing views, and do not include bibliographies, reading lists, or citations, since the reasoning needs to stand on its own.
