      *   *Revised:* Div (0.35), Quality (0.25), X-Risk (0.20), Diff Tech (0.15), Capacity (0.05), Lock-in (0.00). Sum = 1.0.
      *   *Wait, looking at the prompt's logic:* The prompt argues steering is weak. Lock-in *is* steering. So Lock-in should be very low. Diversification is the alternative to steering. X-risk is survival.
      *   *Refined Allocation:*
          *   Trajectory Diversification: 0.35
          *   Reducing Suffering/Lock-in (Quality): 0.25
          *   Reducing X-Risk: 0.20
          *   Differential Tech: 0.15
          *   Capacity Building: 0.05
          *   Value Lock-in: 0.00

  5.  **Rank the 3 Framings (Survival, Steering, Diversification):**
      *   *Survival:* Necessary condition. But under the suppositions, survival alone allows expansionary selection to wipe values. It accounts for the existence of the future, but not the *value* of it relative to us.
      *   *Steering:* Explicitly downgraded by the suppositions. If values drift, steering EV is low.
      *   *Diversification:* The hedge against value drift. If we can't steer, we must diversify to ensure *some* good outcomes persist.
      *   *Shares:*
          *   Diversification: 0.50 (The primary lever under these assumptions).
          *   Survival: 0.40 (You need a future to diversify).
          *   Steering: 0.10 (Residual hope that some lock-in works).
      *   *Sum:* 1.0.

  6.  **Draft Justifications (One Sentence Each):**
      *   *X-Risk:* Essential baseline but marginal dollars yield less EV if the surviving future is value-hostile.
      *   *Quality/Suffering:* High priority because expansionary selection strongly risks optimizing for efficiency at the expense of welfare.
      *   *Diff Tech:* Instrumental to avoiding early collapse but less impactful on long-term value content than structural diversification.
      *   *Value Lock-in:* Directly contradicted by the expansionary selection supposition, rendering long-term institutional persistence unlikely.
      *   *Diversification:* Maximizes EV by ensuring value-correlated lineages survive even if the dominant expansionary attractor is value-neutral or hostile.
