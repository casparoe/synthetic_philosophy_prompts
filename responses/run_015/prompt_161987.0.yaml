  7.  **Draft Closing Paragraph:**
      *   *Crux:* The strength of "expansionary selection" vs. "value persistence." Does competition actually wash out human values, or can values be encoded into the expansion mechanism itself?
      *   *Shift if False:* If expansionary selection is weak (values *can* be locked in), Steering/Lock-in shoots to the top, and Diversification drops significantly as a hedge.
      *   *Pascal's Mugging Trap:* Trajectory Diversification. It relies on speculative astrosociology and assumes we can practically create independent lineages without them just becoming copies of the same competitive dynamic, which might be a fantasy of control similar to lock-in.

  8.  **Review and Refine:**
