  *   **Trajectory diversification:** 0.35 ($70M)
  *   **Reducing outcomes that destroy quality:** 0.25 ($50M)
  *   **Reducing existential risk:** 0.20 ($40M)
  *   **Differential technological development:** 0.15 ($30M)
  *   **General civilizational capacity-building:** 0.05 ($10M)
