  **Lever Justifications**

  *   **Reducing existential risk:** Survival remains the necessary baseline for any value, though marginal returns diminish if the surviving future is likely to be value-hostile.
  *   **Reducing outcomes that destroy quality:** Under expansionary selection, the risk of optimizing for power at the expense of welfare is acute, making suffering mitigation a high-priority hedge.
  *   **Differential technological development:** This supports survival and quality but is less decisive than structural diversification for determining the long-term value landscape.
  *   **Deliberate early value lock-in:** The supposition that expansionary selection washes out initial values renders long-term institutional persistence unlikely and low-yield.
  *   **Trajectory diversification:** If specific values cannot be steered, maximizing the number of independent trials ensures some lineages retain value-correlated traits against competitive drift.
  *   **General civilizational capacity-building:** While useful infrastructure, diffuse meta-work is outcompeted by targeted structural interventions under these specific risk assumptions.

  **Closing Analysis**

  The real crux is the strength of expansionary selection versus the stickiness of encoded values; if competitive pressure does not inevitably homogenize values or strip them of content, the case for diversification collapses back toward steering. If that supposition is false and values can be robustly locked into the expansion mechanism itself, the allocation for deliberate lock-in and steering would surge to over 0.60, while diversification would drop to a minor hedge. The single lever most at risk of being a Pascal's-mugging-flavoured trap is trajectory diversification, because it assumes a feasibility of creating truly independent civilizational lineages that physics, economics, or communication limits might render impossible, effectively selling the illusion of control over cosmic sociology similar to the lock-in mechanisms it seeks to replace.
