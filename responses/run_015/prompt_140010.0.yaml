  4. (Non-negotiable) It must define the burden of proof for refutation, clarifying whether a bounded device like the Million-Bit Box or a conditional one like the Napkin Model counts as a genuine counterexample.
  5. (Contested) It must determine if the thesis holds by physical accident or logical necessity, establishing what warrant justifies believing it and how revisable it is if the Halfstep Engine actually works.
  6. Satisfying the demand for non-circular sharpening (Item 3) is incompatible with treating the thesis as logically necessary (Item 5), while the requirement to distinguish informal procedure from physical realizability (Item 2) does the most work to rule out accounts relying solely on convergence or empirical law.
