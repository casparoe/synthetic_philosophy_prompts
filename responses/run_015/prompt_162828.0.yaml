          *   Normal/Default: S escalates. J follows. Coordination works (ideally).
          *   Actual: S omits. J omits (following S). Coordination N/A.
          *   The deviation from the norm starts at S. J's behavior is *normal relative to S's deviation*. Therefore, the causal "fault" lies with the initial deviation.
          *   Regarding Fact (iii): The "Double Call" failure suggests the *norm* for coordination is also broken. But we isolate the *initiation* failure. The patient died because no effective escalation occurred. Effective escalation requires initiation. S controls initiation. S failed to initiate.
      *   *Vacant Post:* The "Senior" is a functional variable. Value = Filled/Active vs. Empty/Inactive. The cause is the value being Empty/Inactive. It doesn't matter if that's due to a person sleeping or a rota gap. The variable state is the cause.

