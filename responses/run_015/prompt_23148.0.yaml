answer: |-
  This is a fantastic question, and your confusion is completely warranted. In fact, your intuition as a chemist aligns with what philosophers call the **"Optimist"** view of moral testimony. The fact that the "Pessimist" view (your first friend) even exists is one of the specific quirks of moral philosophy that doesn't show up in the natural sciences.

  In chemistry, if you trust a paper on half-lives, you have the knowledge. In ethics, many philosophers argue that if you just trust an expert, you might have the *belief*, but you're missing something crucial about *agency*.

  Here is a breakdown of who is winning which round, followed by the crucial piece of the puzzle both of them are missing.

  ### Round 1: The Initial Claim
  **Friend 1 (Skeptic):** You can't trust a moral expert because verifying their reliability requires you to do the moral reasoning yourself.
  **Friend 2 (Deferrer):** You can vet them using non-moral evidence (track record, bias, care) just like an engineer.

  *   **Who is right?** **Friend 2 has the stronger practical case; Friend 1 has the stronger conceptual case.**
  *   **The Analysis:** Friend 2 is describing how we actually navigate the world. We defer to doctors, lawyers, and clergy all the time. If Friend 1 were strictly right, moral learning would be impossible for children (who defer to parents) or students (who defer to teachers).
  *   **However,** Friend 1 is pointing out a disanalogy. In chemistry, "competence" is defined by predictive accuracy (does the experiment work?). In ethics, "competence" is defined by *goodness* or *rightness*. Friend 1 is worried that if you don't understand *why* the expert is right, you aren't truly acting morally, you're just following orders.

  ### Round 2: The Engineer Analogy
  **Friend 1:** Engineering reliability is factual; moral reliability is a moral claim. You can't step outside morality to check it.
  **Friend 2:** You can step outside practically via empirical facts. Demanding independent verdicts makes *all* expert deference impossible.

  *   **Who is right?** **Friend 1 is technically correct on the metaphysics; Friend 2 is correct on the epistemology.**
  *   **The Analysis:** Friend 1 makes a sharp point here. To say "This engineer is good" is a factual claim about bridge loads. To say "This ethicist is good" implies they are *virtuous* or *correct*, which is itself a moral judgment. Friend 1 is arguing you cannot verify a moral truth without using moral premises.
  *   **Friend 2's Counter:** Friend 2 is right that Friend 1's standard is too high. If we required independent verification for *all* expert claims, society would collapse. However, Friend 2 misses the nuance that moral deference might be *possible* but *undesirable*. Just because you *can* outsource a moral decision doesn't mean you *should*, whereas outsourcing a structural calculation is usually mandatory.

  ### Overall Verdict
  If this were a court case, **Friend 2 (The Deferrer) wins on practicality, but Friend 1 (The Skeptic) wins on principle.**

  Friend 2 is right that we *do* and *must* rely on moral testimony to function (e.g., trusting that slavery is wrong because our moral teachers said so, before we fully grasped the philosophy).
  Friend 1 is right that there is a residual "moral remainder"—a sense that you haven't fully discharged your duty as a moral agent if you just outsource the thinking.

  ### What Both Friends Are Missing
  This is the most important part for you as a scientist entering philosophy. Both friends are treating "moral knowledge" as a single thing, like "knowing the half-life of Carbon-14." But in contemporary moral philosophy, there is a distinction they are glossing over: **Knowledge vs. Understanding.**

  Here is what is missing from their debate:

  #### 1. Propositional Knowledge vs. Moral Understanding
  You can gain **knowledge** via testimony. If a bioethicist tells you, "Euthanasia is permissible in case X," and they are reliable, you now *know* that proposition is true. Friend 2 is right about this.

  However, many philosophers (most notably **Annette Hills**) argue you cannot gain **moral understanding** via testimony.
  *   **In Chemistry:** If I tell you $E=mc^2$, and you trust me, you have the knowledge. You don't necessarily need to derive it yourself to use it.
  *   **In Ethics:** If I tell you "Euthanasia is permissible," and you trust me, you know the verdict. But you don't understand the *reasons* that make it permissible. In morality, grasping the *reasons* is often considered more important than knowing the *verdict*.
  *   **The Missing Point:** Friend 1 is worried about losing *understanding*. Friend 2 is defending the acquisition of *knowledge*. They are talking past each other. You can defer for the *what*, but you shouldn't defer for the *why*.

  #### 2. The Hybrid Nature of Bioethics
  Your friends are debating "pure" moral testimony. But a bioethicist is not a pure moral philosopher.
  *   **Fact:** "The fetus feels pain at week X." (Empirical)
  *   **Policy:** "Hospital protocol Y minimizes liability." (Legal/Pragmatic)
  *   **Value:** "Suffering should be minimized." (Moral)

  When you ask a bioethicist a "hard case" question, you are usually asking for a synthesis of these three.
  *   **Friend 2 is right** that you can defer on the empirical and policy parts (just like the engineer).
  *   **Friend 1 is right** that you cannot fully defer on the value part without losing moral agency.
  *   **The Missing Point:** In bioethics, deferring is often legitimate because the "expert" is clarifying the *facts* and *options*, not just dictating the *good*.

  #### 3. The "Autonomy" Objection
  This is the philosophical core of Friend 1's discomfort. In science, the truth is independent of you. The half-life exists whether you understand it or not.
  In morality, the "truth" is tied to your **agency**. To be a moral agent is to act on reasons *you* grasp. If you act solely because an expert told you to, you are acting heteronomously (ruled by another) rather than autonomously (ruled by self).
  *   **The Missing Point:** Friend 1 isn't saying you can't *know* the truth via testimony. They are saying you can't be *virtuous* via testimony. You can't be a "good person" by proxy.

  ### Summary for a Chemist
  Imagine you are balancing a complex reaction.
  *   **Friend 2 says:** "Just trust the senior chemist's balanced equation. They know what they're doing." (This is fine for running the lab).
  *   **Friend 1 says:** "If you just copy their equation without understanding the stoichiometry, you aren't really a chemist. You're a technician."

  In chemistry, being a technician is fine. In morality, philosophers worry that being a "technician" (following rules without understanding the why) strips the action of its moral worth.

  **Who should you side with?**
  For practical decision-making (e.g., hospital policy), side with **Friend 2**. We need to make decisions, and experts have data we don't.
  For moral education and character, side with **Friend 1**. Use the expert's verdict as a hypothesis, then do the work to understand the *mechanism* (the moral reasoning) behind it.

  Your intuition that "deferring to experts is how knowledge works" is correct for *facts*. The debate exists because many philosophers believe morality is more about *agency* than *facts*.
