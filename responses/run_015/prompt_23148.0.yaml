      *   *Domain Specificity:* Bioethics often mixes empirical facts (viability of fetus) with moral principles. Deference might be okay on the facts, less so on the principles.
      *   *Agency/Autonomy:* Moral action requires ownership. Scientific belief doesn't require the same kind of ownership.

