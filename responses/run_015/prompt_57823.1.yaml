answer: |-
  This is an excellent philosophical puzzle. Your flatmate has constructed a classic *reductio ad absurdum*: he has taken a plausible principle (lying invalidates consent) and extended it to a point where it yields absurd results (bacon lies make sex assault), forcing us to abandon the principle.

  As a philosopher working in this field, I recognize this argument. It touches on the distinction between **fraud in the factum** (deception about the nature of the act) and **fraud in the inducement** (deception about reasons for the act). But as you noted, stealthing complicates that simple legal distinction, because stealthing is often about the *conditions* of the act, not just the mechanics.

  Let's do exactly as you asked: brainstorm the options for where to break the chain, weigh the costs of each, and then settle on the most robust diagnosis.

  ### Phase 1: Brainstorming the Options

  We have six steps in your flatmate's argument. To stop the conclusion (6), we must reject or modify at least one of the preceding steps. Here are the four main philosophical "exit ramps."

  #### Option A: Reject Premise 1 (The Deception Principle)
  *The Move:* Argue that deception *never* automatically invalidates consent. Consent is a mental state or a speech act; if you said "yes," you consented, even if you were lied to. The lie is a separate moral wrong, but it doesn't retroactively turn sex into assault.
  *   **The Cost:** This is extremely high. It means stealthing is *not* sexual assault. It means lying about an STI is *not* sexual assault, but merely a different tort or crime. Most contemporary ethicists and many legal systems reject this because it severs the link between autonomy and consent. If I don't know what I'm agreeing to, my autonomy is violated.
  *   **Verdict:** Too expensive. We want to keep the intuition that stealthing violates consent.

  #### Option B: Reject Premise 2 (The Scope of Deal-Breakers)
  *The Move:* Argue that not all deal-breakers are morally equal. Some deceptions are "material" to the sexual act, and others are "collateral." Lying about bacon is a lie, but it doesn't touch the *validity* of sexual consent, whereas lying about contraception does.
  *   **The Cost:** We now have to do the hard work of drawing a line. Where does the line go? Is it about harm? Is it about identity? Is it about social norms? If we draw the line poorly, we risk bias (e.g., saying a trans partner's history is "material" in a transphobic way). We need a principled distinction, not just an intuitive one.
  *   **Verdict:** Promising. This is where most philosophical heavy-lifting happens.

  #### Option C: Reject Premise 3 (Omission vs. Commission)
  *The Move:* Argue that active lying is different from staying silent. You have no duty to volunteer your "bacon status" on a first date. You only invalidate consent if you actively fabricate reality, not if you keep your private life private.
  *   **The Cost:** This struggles with the STI case. If I know I have Herpes and say nothing, and you sleep with me, most ethicists argue your consent is compromised. If silence is always okay, then hiding an STI is morally permissible provided you don't actively deny it. That seems wrong.
  *   **Verdict:** Useful, but needs nuance. Silence can be deceptive when there is a *duty to disclose*.

  #### Option D: Reject the Inference to Conclusion 5/6 (The "All Wrongness is Equal" Assumption)
  *The Move:* Accept that technically, the bacon lie makes the consent "defective," but argue that not all defective consent is *sexual assault*. We can have a gradient: Valid Consent -> Defective Consent (Civil Wrong) -> Non-Consent (Criminal Wrong).
  *   **The Cost:** This changes the definition of "consent." In ethics, we usually want a binary: either I had the authority to agree, or I didn't. If the bacon lie makes it "non-consensual," calling it a "minor wrong" feels like semantic gymnastics. It risks trivializing the victim's autonomy in the bacon case, or trivializing the assault in the stealthing case.
  *   **Verdict:** A viable legal solution, but less satisfying for moral philosophy.

  ---

  ### Phase 2: The Diagnosis

  If I were supervising this debate, I would advise you to **reject Premise 2**, supported by a modification of **Premise 3**.

  Your flatmate's argument relies on the assumption that **all reasons for saying "yes" are morally equivalent.** He treats "I want to sleep with a vegan" and "I want to sleep with someone using contraception" as the same *kind* of condition. Philosophically, they are not.

  Here is the diagnosis: **Consent requires informed autonomy, but autonomy is only violated by deception regarding *material* facts, not *preferential* facts.**

  To save the theory, we must introduce a **Relevance Constraint**. For a lie to invalidate consent, the information concealed must be relevant to:
  1.  **Bodily Integrity/Risk:** (e.g., STIs, contraception/stealthing, pregnancy).
  2.  **The Nature of the Act:** (e.g., "This is a medical exam" vs. "This is sex").
  3.  **Fundamental Identity:** (e.g., Impersonating someone's spouse).

  #### Why this solves the Bacon Problem
  Lying about bacon falls under **Preferences**.
  Lying about stealthing/STIs falls under **Risks/Rights**.

  When you agree to sex, you are agreeing to a physical interaction that carries inherent risks (pregnancy, disease, emotional vulnerability). You are *not* agreeing to merge your entire value systems.
  *   **The Bacon Lie:** If she knew you ate bacon, she might not *want* to sleep with you. But the act of sex itself remains physically and morally the same. Her bodily integrity is not compromised by your diet.
  *   **The Stealthing Lie:** If she knew you removed the condom, she would not say yes. Crucially, the act of sex *changes*. Sex with a condom is a different physical risk profile than sex without one. By lying, you have exposed her to a bodily risk she did not agree to.

  #### Why this solves the Omission Problem (Premise 3)
  We modify Premise 3. Omission is only equivalent to lying when there is a **Duty to Disclose**.
  *   Do you have a duty to disclose your breakfast habits? No. That is private information.
  *   Do you have a duty to disclose a contagious infection? Yes. Because it directly impacts the other person's bodily safety.
  *   Do you have a duty to disclose you are removing a condom? Yes, because it changes the agreed-upon safety parameters of the act.

  ### Phase 3: The Cost of This Diagnosis

  You asked what rejecting Premise 2 costs us. It is important to be honest about the trade-offs.

  **1. We lose "Pure Subjectivity."**
  We cannot say "Consent is whatever the individual says it is." If a woman says, "I only sleep with men who own a red Ferrari, and he lied about owning one," our theory says that lie does *not* invalidate consent, even if she feels betrayed. We are imposing an objective standard of "materiality" over her subjective deal-breakers.
  *   *Defense:* Autonomy is not just about getting what you want; it's about making decisions within a shared social reality. We cannot expect partners to vet every subjective preference before sex, or sex becomes impossible (the "Mind-Reading" problem in Premise 4).

  **2. We have to defend the "Materiality" Line.**
  We open ourselves to debate about where the line is drawn. Is lying about being married "material"? (Some say yes, it changes the relationship type; others say no, it's just a preference). Is lying about wealth material? (Generally no).
  *   *Defense:* This is difficult, but necessary. Law and ethics always require drawing lines between "fraud" and "puffery." The core anchor is **Bodily Risk**. The closer the lie gets to physical harm or the physical mechanics of the act, the more likely it invalidates consent.

  **3. We admit that "Bad Sex" isn't always "Assault."**
  The bacon lie is still a moral wrong. It is manipulative. It shows bad character. But by rejecting Premise 2, we categorize it as a *betrayal* or a *lie*, rather than a *violation of sexual autonomy*.
  *   *Defense:* This preserves the special gravity of sexual assault. If every lie makes sex non-consensual, then "sexual assault" loses its distinctive horror. We need a category for "I was tricked" that is distinct from "My body was violated."

  ### Summary for your Debate

  To win this debate without conceding that stealthing is okay, tell your flatmate this:

  > "I accept that deception can invalidate consent, but I reject the idea that **all** deceptions are equal. Consent is a waiver of bodily boundaries. Therefore, only lies that alter the **risk profile** or the **nature** of the bodily interaction invalidate that waiver.
  >
  > Lying about bacon changes her *motivation*, but it doesn't change the *act* or the *risk*. Lying about contraception (stealthing) changes the physical risk and the act itself.
  >
  > If we don't make this distinction, we make consent impossible (because we can't know every preference). If we do make this distinction, we protect people from bodily violation (stealthing/STIs) without criminalizing dating disappointments (bacon/height/job)."

  **The Philosophical Bottom Line:**
  You are rejecting **Premise 2**. You are arguing for a **Materiality Constraint** on consent. The cost is that you must defend why some deal-breakers (safety/identity) are objective requirements for valid consent, while others (lifestyle/preferences) are subjective desires that do not carry the same moral weight regarding bodily autonomy. This is a defensible, standard position in modern sexual ethics (championed by philosophers like Tom Dougherty and Laura Hedley).

  It saves the concept of consent from trivialization while keeping the condemnation of stealthing intact.
