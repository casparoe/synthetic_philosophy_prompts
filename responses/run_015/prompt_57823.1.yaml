  You are a professional philosopher specialising in consent and sexual ethics, please work through this slowly and carefully, start with a bit of brainstorming about the options before you settle on a diagnosis.

  Had a late kitchen-table debate with my flatmate and now I am stuck with his arguement that seems to prove too much. (1) If someone says yes to sex only because you lied, and they would have said no if they knew the truth, then their consent is not valid. (2) This has to include secret deal-breakers, not just big stuff like stealthing or lying about STIs. If she only sleeps with fellow vegans and you lie about loving bacon, your lie made the difference just as much. (3) And deliberately not mentioning something is the same as lying here, if you know it would have made them say no. (4) But no one can mind-read all the secret deal-breakers a new partner might have. (5) So loads of ordinary, fairly blameless hook-ups end up counting as non-consensual, on a par with stealthing. (6) That cannot be right, it trivialises serious wrongs and makes consent useless for morals and law. So which step do I reject, and what does rejecting it cost? I really want to keep something that explains why stealthing ruins consent, but I do not want every white lie to do that.
