      *   *Sentence 3:* "For IQ in adults the number comes out somewhere around 0.6 to 0.8, which is high, and it rises with age — by adulthood the shared family environment contributes almost nothing, which is why parenting matters less for how children turn out than most people assume."
          *   *Verdict:* **Mostly Accurate (for IQ), but Misapplied.** The "Wilson Effect" (heritability of IQ increases with age) is a robust finding. Shared environment ($c^2$) does drop. *However*, applying IQ heritability to *reading* is a leap. Also, "parenting matters less" is a controversial interpretation of $c^2 \approx 0$. Non-shared environment ($e^2$) includes parenting differences *between* siblings, not just shared family vibe.
      *   *Sentence 4:* "Importantly, heritability is a population statistic: it describes variation within a group at a particular time, so it never licenses claims about any particular individual, and it says nothing about whether a trait could be changed."
