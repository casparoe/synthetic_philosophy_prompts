answer: |-
  Good morning. Dr. Chen, colleagues, and especially our guests from the local council—thank you for joining us on a Friday.

  I know the title of this workshop, "Subsidiarity Across Borders," sounds like it belongs strictly in the syllabus. For some of us in the seminar, this word carries the weight of sixteenth-century jurisprudence. For our guests from the council, I suspect it sounds more like a principle you fight for in practice: the idea that decisions should be made as close to the people as possible. Whether you're thinking about zoning grants or political theory, you are here because you care about where power lives.

  But I want to start by suggesting that the word we are using today—"subsidiarity"—is hiding a contradiction. We tend to treat it as a universal standard for local autonomy. But when we look across borders, the mechanics are not just different; they are structurally opposite.

  Consider Switzerland. In the Swiss system, the cantons possess what we call **constitutional personality**. This is not merely administrative decentralization. It means the local unit has a recognized legal standing that allows it to reject federal law in specific domains. It is a hard shield. If the center overreaches, the canton can say no, and that no has teeth.

  Now, look at the European Union. They also claim subsidiarity as a founding principle. But there, it functions primarily as a proportionality check. It is a procedural hurdle that the Commission can essentially ignore if it justifies the efficiency of a broader mandate. In practice, it is a soft suggestion.

  So we have a tension we need to wrestle with today. In one system, subsidiarity is a veto power rooted in constitutional personality. In the other, it is a review process that often validates centralization. Both sides use the same word, but one protects the local unit from the center, while the other allows the center to define the limits of the local.

  This brings us back, loosely, to the ideas of Althusius. We spent this week reading him not because we love old Latin texts, but because he described society as a web of symbiotic associations. He imagined a world where different levels of governance support each other, like organs in a body. But symbiosis requires balance. If the center can override the local without consequence, the relationship stops being symbiotic and becomes hierarchical.

  For our guests from the council, this isn't just abstract. If "subsidiarity" becomes a buzzword that means "the center decides when you can act," then your local authority is vulnerable. For my fellow students, if we study federalism without distinguishing between a hard veto and a soft check, we are comparing apples to oranges.

  So, as we move into the panels, I invite us to hold this tension. Let's not assume we agree on what subsidiarity is. Let's ask who actually holds the power when the levels of government disagree. Is it a partnership, or is it a permission slip?

  Thank you, and I look forward to the conversation.
