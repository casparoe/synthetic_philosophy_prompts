      *   **USA:** *Freedom of Information Act (FOIA)*, SSN usage (though SSN wasn't originally intended as a universal ID, it functionally became one). Emphasis on transparency of government, but also transparency of the individual for market/state efficiency. Liberal individualism, but with a focus on accountability and market function.
      *   **China:** *Social Credit System (SCS)*. Holistic evaluation. Confucian roots (trust/*xin*), but also modern surveillance capitalism/state capacity. The individual is defined by social contribution/compliance.

  3.  **Drafting the Philosophical Anthropologies:**

      *   **Germany:**
