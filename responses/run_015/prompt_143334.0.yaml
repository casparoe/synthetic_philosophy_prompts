          *   *Philosophical Root:* Kantian autonomy + German Basic Law (Human Dignity). The state must not know the "whole" person to prevent chilling effects.
          *   *Answer to User:* It's not just risk; it's a deontological boundary. The self has a right to opacity.

      *   **USA:**
