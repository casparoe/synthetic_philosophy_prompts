      *   *Crucial Point:* They are incompatible at the *deontological* level (rights vs. duties), but potentially compatible at a high-level *teleological* level if the telos differs. However, the user asks if a *single view* could license all three. A pure act-utilitarian might switch between them based on empirical data. But rule-utilitarians would likely pick one stable system.

