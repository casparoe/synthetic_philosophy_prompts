answer: |-
  **MEMORANDUM**

  **TO:** Hospital Board of Directors
  **FROM:** Assisted-Reproduction Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on IVF Embryo Culture Protocol Selection (Protocol A vs. Protocol B)

  **1. Executive Summary**

  The Assisted-Reproduction Policy Committee recommends the immediate adoption of **Protocol B** as the standard culture medium for all new IVF cycles initiated after the expiration of the current supply contract on December 1, 2023. However, this recommendation includes a mandatory exception: **Protocol A** must be retained and utilized exclusively for the "Legacy Cohort" of approximately 1,100 embryos currently in cryostorage. We further recommend against delaying implementation for a randomized controlled trial (RCT) and mandate an update to patient consent forms to disclose the probabilistic relationship between protocol selection and embryo identity. This policy is subject to a clinical outcomes review in twenty-four months.

  **2. Background and Financial Constraints**

  Our current protocol (A) faces a price increase of nearly 300% upon contract renewal. Protocol B offers a substantially lower cost per cycle and, based on our internal registry data, increases the live-birth rate per started cycle by approximately three percentage points. However, Protocol B is associated with an increase in low birth weight (LBW) incidence from 6% to 9%, carrying known downstream developmental and metabolic risks.

  Due to fixed laboratory budgeting, maintaining Protocol A at the new price point necessitates a reduction of approximately ninety publicly subsidized cycles annually. Based on current conversion rates, this equates to twenty-five to thirty children per year who would be born under Protocol B but will not be born under Protocol A. All such potential children are projected to have lives plainly worth living.

  **3. Ethical Analysis and Committee Deliberation**

  The committee encountered a significant ethical complexity: because embryo survival and implantation are sensitive to culture conditions, switching protocols does not merely alter the health prospects of the *same* future children; it determines *which* children come into existence. This is an instance of the philosophical "non-identity problem."

  **3.1 The Case for Protocol B (The Endocrinologist's Argument)**
  The strongest argument for immediate, universal adoption of Protocol B rests on a dual obligation of beneficence and fiscal stewardship. Proponents argue that because the children born under Protocol B would not exist under Protocol A, they are not "harmed" by the protocol switch in the comparative sense; they are benefited by existence itself. To choose Protocol A is to prioritize a marginal reduction in health risk for one set of children over the very existence of a different, larger set of children. From this perspective, denying Protocol B is morally equivalent to denying thirty children per year the opportunity to live, based on a risk profile that still yields lives "well worth living." Therefore, Protocol B is not merely permissible but obligatory to maximize the number of flourishing lives within the budget.

  **3.2 The Committee's Response and Qualification**
  While the committee accepts the logic of this argument regarding *future* conceptions, we reject its application to the Legacy Cohort. The "no one is made worse off" defense relies entirely on the change in identity. For the 1,100 embryos already in storage, identity is fixed. For these specific entities, a switch to Protocol B constitutes a direct trade-off: a higher chance of implantation against a higher risk of morbidity for *that specific future child*. We cannot claim these children are "better off existing under B" because they would have existed under A as well. Consequently, the "obviously right" conclusion for future cycles does not hold for stored embryos, where the precautionary principle and duty of care to existing biological material mandate the safer Protocol A.

  Furthermore, regarding the general population, we must address the claim that "no child born under B would have refused to be born." **We cannot assert that no child would refuse existence because the moral question is not whether life is worth living, but whether we were obligated to select the alternative action that would have produced a different child with significantly better health prospects.** While we cannot say a specific individual was harmed, we acknowledge a population-level obligation to minimize the aggregate burden of preventable morbidity, even when the individuals constituting that population change.

  **3.3 Probabilistic Identity**
  We acknowledge that for some cycles, the protocol may alter only the intrauterine environment rather than the specific embryo implanting (estimated at roughly 30% of cases). Given this uncertainty, the committee applies a precautionary threshold: where identity cannot be ruled out, we must assume identity holds. This reinforces the decision to protect the Legacy Cohort with Protocol A, while accepting that for new cycles, the probabilistic nature of identity switching makes the "non-identity" defense sufficiently robust to justify the LBW risk in exchange for increased birth rates.

  **4. Research and Consent Recommendations**

  **4.1 Randomized Controlled Trial**
  The committee recommends **against** funding an eighteen-month pragmatic RCT to compare A and B. First, the contract deadline precludes a delay without abandoning the IVF program temporarily. Second, randomizing patients to Protocol A would knowingly assign identifiable patients to a protocol with a lower live-birth rate, which is ethically difficult to justify given the existing registry data. Finally, because the act of randomization itself determines which children exist, an RCT does not resolve the non-identity ethical tension; it merely institutionalizes it.

  **4.2 Informed Consent**
  Patient focus groups indicated a strong preference for "their embryo" rather than "any embryo." Consequently, consent documents must be updated. Patients must be informed that the choice of culture protocol influences not only success rates and health risks but may also determine *which* embryo implants and thus *which* child is born. We reject the notion that this is a confusion to be designed away; it is a material fact of the biological process. Patients have a right to know that protocol selection is not merely a technical setting but an identity-determining variable.

  **5. Future Decision Rule**

  To guide future committees facing similar choices where technology alters both outcomes and identity, the committee adopts the following decision rule:

  > *When a policy choice determines which individuals will exist, we must compare the aggregate expected well-being of the population created under each option, acknowledging that while the specific individuals differ, the moral obligation is to bring into existence the population with the higher expected quality of life, provided no identifiable existing entity is subjected to undue risk to achieve that aggregate good.*

  This rule clarifies that we owe a duty to the *future population* to maximize health and existence, but we owe a stricter duty of non-maleficence to *existing entities* (such as stored embryos) whose identity is already fixed.

  **6. Conclusion**

  Protocol B represents the responsible path forward for new cycles, balancing fiscal reality with the imperative to facilitate life. However, ethical consistency requires we shield the Legacy Cohort from the risks associated with that switch. By adopting this hybrid approach, the hospital honors both its obligation to the future and its duty to the present.

  **Signed,**

  **Assisted-Reproduction Policy Committee**
