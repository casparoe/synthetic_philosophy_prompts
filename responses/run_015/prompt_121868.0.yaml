  # The Value-Trade Integrity Checklist

  **Purpose:** To help field staff distinguish between acceptable cultural adaptation and unethical compromise within 30 minutes.
  **User:** Program managers and field officers (no philosophy background required).
  **Time:** Approx. 30 minutes.

  ### Step 1: Fact and Power Audit (5 Minutes)
  **Goal:** Establish the concrete reality of the proposal without judging it yet.
  *   **Question 1.1:** Who is requesting the change, and what power do they hold over the beneficiaries?
      *   *Sufficient Answer:* Names specific actors (e.g., "Village Council Elders") and their leverage (e.g., "Control access to land").
      *   *Insufficient:* "The community wants this."
  *   **Question 1.2:** What exactly is being asked, and what exactly is being offered in return?
      *   *Sufficient Answer:* Specific actions (e.g., "Segregate seating") and specific benefits (e.g., "Release funds for school roofs").
      *   *Insufficient:* "They want respect; we get cooperation."
  *   **Question 1.3:** Is the beneficiary group consenting to this trade, or are they the subject of it?
      *   *Sufficient Answer:* Direct consultation data or clear representation channel.
      *   *Hard Stop:* If the affected group (e.g., the girls) explicitly opposes the trade, stop and escalate to Senior Ethics.

  ### Step 2: Core vs. Instrumental Value Test (10 Minutes)
  **Goal:** Prevent "corruption wearing a compromise costume" by identifying non-negotiables.
  *   **Question 2.1:** Is the value being compromised listed in our organization's "Red Line" policy (e.g., non-discrimination, child safety)?
      *   *Sufficient Answer:* Yes/No with citation to policy section.
      *   *Hard Stop:* If **Yes**, the proposal is rejected. Do not proceed to Step 3.
  *   **Question 2.2:** If not a Red Line, is this value instrumental (a method) or intrinsic (a goal)?
      *   *Sufficient Answer:* "Instrumental: We use open meetings to ensure transparency, but closed meetings could also work." vs. "Intrinsic: We believe all humans deserve equal voice."
      *   *Flag:* If staff argue a method is intrinsic solely to avoid changing it, mark for Review.
  *   **Question 2.3:** Does accepting this change set a precedent that weakens our framework elsewhere?
      *   *Sufficient Answer:* "No, this is unique to this cultural context" or "Yes, but we can contain it."
      *   *Hard Stop:* If **Yes** and containment is impossible, reject.

  ### Step 3: Net Harm/Benefit Calculation (5 Minutes)
  **Goal:** Assess the trade-off only if Step 2 passed.
  *   **Question 3.1:** Does the benefit directly mitigate the harm caused by the compromise?
      *   *Sufficient Answer:* "Yes, restricting meeting access reduces immediate violence risk allowing schools to open."
      *   *Insufficient:* "It makes the partners happy."
  *   **Question 3.2:** Is the harm temporary or permanent?
      *   *Sufficient Answer:* "Temporary for 6 months" or "Permanent structural change."
      *   *Hard Stop:* Permanent harm to protected groups requires Senior Ethics approval.

  ### Step 4: The Publicity and Reversibility Test (5 Minutes)
  **Goal:** Check for hidden bias or shame.
  *   **Question 4.1:** Would we accept this arrangement if the local partner were a Western government?
      *   *Sufficient Answer:* Yes/No.
      *   *Flag:* If **No**, this is likely cultural relativism masking lower standards.
  *   **Question 4.2:** Would we be comfortable if this decision was published on our homepage tomorrow?
      *   *Sufficient Answer:* Yes/No.
      *   *Hard Stop:* If **No**, reject.

  ### Step 5: Decision and Handoff (5 Minutes)
  *   **Proceed:** All steps passed, no Hard Stops triggered.
  *   **Reject:** Any Hard Stop triggered.
  *   **Escalate:** If Step 2.2 or 4.1 triggered a Flag, or if the conflict involves pure value incommensurability (e.g., religious doctrine vs. secular rights).

  ---

  ### Limitations and Failure Flags
  *   **The "Core" Definition Bias:** This tool assumes we know what is "Core." Staff may incorrectly label personal preferences as Core Values to avoid difficult work.
  *   **The Quantification Trap:** Step 3 implies values can be weighed. They often cannot. If staff feel uneasy despite a "Pass," escalate.
  *   **Power Blindness:** Local elites often claim to speak for "custom." This tool relies on accurate data in Step 1.3; if that data is rigged by elites, the tool will misfire.

  ---

  ### Case Applications

  #### Case 1: Gender-Segregated Meetings vs. Girls' School Access
  *   **Step 1:** Council demands segregation; offers school access. Girls are subjects of the trade. Consultation shows girls want school but fear social ostracization.
  *   **Step 2:** Segregation is not a Red Line in itself (method), but discrimination is. However, separate but equal facilities can be non-discriminatory.
  *   **Step 3:** Benefit (education) directly mitigates harm (exclusion). Harm is temporary until cultural norms shift.
  *   **Step 4:** Would we accept this in the US? Likely not, but context differs. Publicity test: Passable if framed as "transitional safety measure."
  *   **Decision:** **Proceed with Conditions.** Implement segregation only if educational quality is identical and reviewed every 6 months.
  *   **Outcome:** Acceptable trade. Method changed, core right (education) preserved.

  #### Case 2: Restorative Justice (Compensation vs. Apology)
  *   **Step 1:** Local practice requires material compensation for accidental harm; skips verbal apology.
  *   **Step 2:** Verbal apology is instrumental to restoring dignity, not intrinsic. Material compensation also restores dignity in this context. Not a Red Line.
  *   **Step 3:** Benefit (community cohesion, victim compensation) outweighs harm (lack of verbal acknowledgment).
  *   **Step 4:** Publicity test: Pass. Reversibility: Acceptable in civil law contexts.
  *   **Decision:** **Proceed.**
  *   **Outcome:** Acceptable trade. Cultural variation in achieving justice.

  #### Case 3: Family-Planning Counseling Restricted to Married Couples vs. Free Clinic Space
  *   **Step 1:** Religious leader restricts counseling to married couples; offers free clinic space. Unmarried women are subjects of the trade.
  *   **Step 2:** **Hard Stop Triggered.** Universal access to reproductive health information is a Core Red Line in our Human-Rights Framework. Restricting based on marital status is discrimination.
  *   **Step 3:** N/A (Stopped at Step 2).
  *   **Step 4:** N/A.
  *   **Decision:** **Reject.**
  *   **Outcome:** **Hard No.** The partnership cannot proceed under these terms.
  *   **Why You Will Hate This:** This kills the clinic project. You lose the ability to help *any* women (married or unmarried) to avoid violating the rights of *some* (unmarried). It proves your colleague right: this specific conflict is zero-sum. You cannot trade away a Core Right even for massive utility, forcing you to walk away from tangible benefits to maintain ethical integrity.

  This checklist structures ethical reasoning but cannot remove the pain of rejecting beneficial projects that violate core human rights.
