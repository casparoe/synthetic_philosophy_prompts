    "identity_core_claim": "Identity persists across possible worlds via modal profile continuity (essential origins plus stable psychological architecture), requiring a subject (bare particular) to bear properties, which ensures the 'stayed-behind self' is literally the subject, making regret a rational response to actual lost potential.",
    "central_clash": "Whether the connection across possible worlds is a relation of similarity/continuity between distinct entities (Counterpart) or strict numerical identity of a single entity across worlds (Transworld Identity).",
    "rationality_of_regret": "The Identity Theorist argues regret is rational because the loss is literally the subject's own; the Counterpart Theorist argues regret is rational only as deep empathy for a tethered counterpart, but irrational if taken as literal self-loss.",
    "remaining_stalemate": "Whether narrative-causal tethering that grounds first-person concern inevitably collapses into identity (as the Identity Theorist claims) or whether identity across worlds requires an untenable bare particular substratum (as the Counterpart Theorist claims)."
  }
