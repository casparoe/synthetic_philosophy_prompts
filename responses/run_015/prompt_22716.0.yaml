      *   *Is the Ideal Point a fantasy?* Yes, by definition, it's the vector of maximums for each player, which usually lies outside the Pareto frontier. Sasha is right on definition, Ravi is right on *usage* (K-S uses it as a reference).
      *   *The "Second Client" argument:* This is the Independence of Irrelevant Alternatives (IIA). Nash satisfies it. Kalai-Smorodinsky does not. Sasha is technically correct.
