  6.  **Final Polish:** Ensure the distinction between *utility* and *money* is clear. This is the most common pitfall in applying bargaining theory to cash splits. (e.g., $1000 means more to Sasha than Ravi). If they treat $1 as 1 util for both, they ignore the urgency Sasha mentioned.

