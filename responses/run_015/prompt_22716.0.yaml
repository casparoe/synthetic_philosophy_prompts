          *   *Theory:* NBS maximizes the product of utilities relative to the disagreement point ($d$). K-S maximizes the minimum proportional gain relative to the utopia/ideal point ($u^{ideal}$). The ideal point is indeed usually outside the feasible set (you can't both get your maximum simultaneously).
