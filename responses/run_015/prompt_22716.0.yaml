          *   *Ravi:* "If she just declares her utility to be 'twice as big' she gets a bigger slice."
          *   *Sasha:* "Nash is invariant to positive affine rescaling."
          *   *Theory:* The Nash Bargaining Solution is indeed invariant under positive affine transformations of utility ($u' = a u + b, a > 0$). This is one of Nash's original axioms.
          *   *Verdict:* **Sasha is right.** Ravi is confusing cardinal utility scaling with the mathematical properties of the NBS. You can't just "declare" utility twice as big to get more money; the optimization $\max (u_1 - d_1)(u_2 - d_2)$ handles the scaling automatically.

      *   **Point 2: Disagreement Point vs. Ideal Point (NBS vs. K-S).**
          *   *Ravi:* NBS only looks at gains above disagreement. K-S looks at ratio of gain to ideal potential.
