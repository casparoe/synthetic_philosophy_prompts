      *   *Refining the "Missing" point:* Emphasize that they are bargaining over *cash* but treating it like *utility*. The curvature of their utility functions matters more than the bargaining solution chosen. If Sasha is desperate, her utility curve is steep. NBS accounts for this *if* they input the correct utility functions. If they just split cash assuming linear utility, NBS = 50/50 (usually).
