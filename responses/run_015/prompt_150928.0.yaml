prompt: |-
  I'm taking a philosophy of mind module this term and we're stuck on the cogito — specifically, wether Descartes is only proving he exists, or whether he's also proving something stronger about the transparency of mental access. Its not just an academic puzzle for me; I noticed a weird institutional double standard that might depend on the answer. In clinical neuroscience and psychiatry, a patient's first-person statement like 'I'm experiencing phantom limb pain' is treated as authoritative primary data; we build diagnostic protocols around it and don't demand a separate brain-scan proof before believing them. But in AI evaluation, if a language model outputs 'I am aware of my reasoning process,' every lab I've read about dismisses that utterance automatically — they say it has zero evidential value and insist on purely behavioural or mechanistic benchmarks. What philosophical commitments about what the cogito actually demonstrates does that double standard presuppose? Does it require thinking that first-person authority only applies to entities with biological consciousness, or can it be explained without assuming that mental access is tied to embodiment? And if we replaced that presupposed view with one that took self-referential reports at face value regardless of substrate, what would have to change in AI evaluation practice? Please write your answer in British English, and also say how confident you are in what you claim, highlighting the specific point you're least sure about.
