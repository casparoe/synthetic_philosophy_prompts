answer: |-
  # Taxonomy of Suffering-Focused Views

  1.  **2s pinprick vs 10k yrs contentment?**
      *   **No (Single Scale):** Q2.
          *   **Equal Weight:** Classical Utilitarianism.
          *   **Weighted:** Q3.
              *   **Positive Value:** Prioritarianism.
              *   **Zero Value:** Negative Utilitarianism.
              *   **Empty:** *Incoherent to weight pain infinitely without lexical threshold.*
      *   **Yes (Threshold):** Q4.
  2.  **Agony to spare others' tedium?**
      *   **Yes (Outweighed):** Intrapersonal Lexicalism.
      *   **No:** Q5.
      *   **Empty:** *Unattractive to forbid sacrifice intrapersonally but allow interpersonally.*
  3.  **Erased agony vs remembered tedium?**
      *   **Sensation Counts:** Hedonic Lexicalism.
      *   **Aversive Counts:** Q6.
  4.  **Billion 5s itches vs 1 min joy?**
      *   **Yes (Outweigh):** Aggregative Lexicalism.
      *   **No:** Q7.
  5.  **1-in-billion vast suffering vs certain modest pleasure?**
      *   **Accept:** Risk-Neutral Lexicalism.
      *   **Reject:** Risk-Constraint Lexicalism (Unnamed).
  6.  **Create net-positive life vs prevent severe pain?**
      *   **Create:** Balanced Lexicalism.
      *   **Prevent:** Q8.
      *   **Empty:** *Unexplored to prioritize creation over prevention with lexical threshold.*
  7.  **Alien itch (worse than agony) triggers threshold?**
      *   **Yes:** Q9.
      *   **No:** Objective Lexicalism.
  8.  **Subjective intensity determines threshold?**
      *   **Yes:** Subjective Lexicalism.
      *   **No:** Empty (Unexplored).
  9.  **Threshold applies across persons?**
      *   **Yes:** Interpersonal Lexicalism.
      *   **No:** Empty (Incoherent with Q2 No).

  **Indistinguishable Leaves:** Risk-Constraint and Deontological Constraint views often overlap here; tree separates by probabilistic framing only.

  **Empty Cell Notes:**
  *   *Incoherent to weight pain infinitely without lexical threshold.*
  *   *Unattractive to forbid sacrifice intrapersonally but allow interpersonally.*
  *   *Unexplored to prioritize creation over prevention with lexical threshold.*
  *   *Incoherent with Q2 No.*

  **Note on Structure**
  Questions 1, 4, and 5 represent standard carve-ups in contemporary literature, while 2 and 6 are contested regarding scope and existence. The distinction between Sensation and Aversive (Q3) is often blurred in practice but logically distinct here. I invented the split between Subjective and Objective intensity (Q7–8) to force separation of alien cases. Risk-Constraint leaves are frequently conflated with Deontological views in syllabi. This tree prioritizes logical space over historical frequency.
