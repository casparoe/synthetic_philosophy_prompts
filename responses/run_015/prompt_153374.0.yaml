  A decision theorist tries to convince a friend to open an email containing a predictive algorithm's assessment of their startup.

  **Friend:** "I'm not opening it. If the algorithm says 'Fail,' I'll feel forced to shut it down. If I stay ignorant, I can keep going."

  **Theorist:** "But that violates Good's Theorem. It proves the value of information is always non-negative. You never *have* to shut down. You retain free choice of action. You can always choose to keep going, even if you know it's doomed."

  **Friend:** "Yes, but if I keep going while ignorant, I'm 'optimistic.' If I keep going after reading 'Fail,' I'm 'delusional.'"

  **Theorist:** "The action is identical. The theorem assumes you maximize utility over outcomes, not narratives."

  **Friend:** "My utility function includes a heavy penalty for 'Knowingly Ignoring Evidence.' Good's theorem assumes I can ignore the information. But I can't ignore the fact that *I know*."

  **Theorist:** "So you're claiming information has negative value?"

  **Friend:** "No. I'm claiming Good's theorem assumes a rational agent. And a rational agent doesn't need plausible deniability to sleep at night."
