prompt: |-
  I'm a novelist and I've somehow ended up on the jury for a translated-fiction prize — six of us, two long weekends a year, a longlist of about a hundred and fifty down to one winner. The disagreements are brutal and mostly can't be settled by anyone reading harder, and I'm bad at them: I either dig in or cave inside five minutes, and I can't tell which one I'm doing at the time.

  Half the books are in languages only one or two of us read, so half the time I'm arguing about a translation I can't check against the original; and we deliberate in the same room after reading each other's notes, so I suspect our verdicts aren't independent evidence at all, whatever that ought to mean for how much I move.

  What I want is a procedure I can actually run in the ten minutes before each meeting and again when we deadlock, for how much to shift when the others disagree with me. The stuff I half-remember about disagreement between peers seems built for factual disputes, where there's one thing that's true and we're both trying to find it, but "the ending doesn't earn itself" or "this is the most alive book on the list" doesn't obviously work like that, and the output isn't my belief anyway, it's a joint list I put my name to. So give me the questions in order, what counts as a decent answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a row about what the prize is for rather than a matter of evidence. It has to handle the cases where the other person has evidence I can't get at, like the original; where they know that literature far better than I do; where I'm the only one who loves the book; and where going along means signing a citation I think is wrong. Then run it on two: a book only I can read in the original that the other five are lukewarm about, and the book I found and fought for and should probably drop.

  Please write it as continuous prose, no headings, bullets, bold or tables — like an email to a friend. Don't worry about typos, its fine.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A novelist serving on a translated-fiction prize jury (6 people, 2 long weekends, 150 books -> 1 winner).
      *   **Problem:** Disagreements are brutal, can't be settled by reading harder. User is bad at conflict (digs in or caves too quickly). Half the books are in languages only 1-2 jurors read (asymmetry of evidence). Deliberations are non-independent (social influence). The goal isn't just belief updating, it's a joint output (a list/winner) the user must sign off on.
      *   **Task:** Create a procedure (mental checklist/questions) to run 10 mins before meetings and during deadlocks. It needs to determine how much to shift opinion when others disagree.
      *   **Constraints:**
          *   Handle specific cases: others have evidence user can't check (original text), others have superior literary knowledge, user is the sole champion, signing a citation user thinks is wrong.
          *   Distinguish between evidential disputes and value disputes (what the prize is for).
          *   Run the procedure on two specific scenarios: (1) A book only the user reads in the original, others lukewarm; (2) A book the user found/fought for but should probably drop.
          *   **Format:** Continuous prose, no headings, bullets, bold, or tables. Like an email to a friend.
          *   **Tone:** Informal, empathetic, practical, intellectual but accessible.
          *   **Typos:** Allowed ("Don't worry about typos, its fine").

  2.  **Deconstruct the Procedure:**
      *   The core tension is between epistemic humility (maybe they see something I don't) and integrity (I need to stand by my judgment, especially regarding translation quality or specific literary merit).
      *   Since it's not a factual dispute (like "is the sky blue?"), standard peer disagreement norms (like the Equal Weight View) don't apply directly. It's about aesthetic judgment and institutional responsibility.
      *   The procedure needs to filter:
          1.  Is this about evidence I lack? (Translation fidelity, cultural context).
          2.  Is this about taste/values? (What kind of book should win?).
          3.  Is this about group dynamics? (Am I caving to pressure?).
          4.  Is this about the final output? (Can I live with the citation?).
      *   Stop conditions: When it becomes a value clash that defines the prize, or when the user cannot ethically sign the citation.

  3.  **Drafting - Section by Section (mental outline):**
      *   *Opening:* Acknowledge the difficulty, validate the feeling. Set the tone (email to a friend).
      *   *The Procedure (Pre-meeting):* Start with the question of evidence. Can they check the original? If yes, defer on translation accuracy. If no, hold firm on effect.
      *   *The Procedure (During Deadlock):* Ask why they dislike it. Is it taste or error? If taste, whose taste aligns with the prize's mission?
      *   *The "Signing Off" Test:* Can I write the citation? If not, don't agree.
      *   *Scenario 1 (User reads original, others lukewarm):* Apply the steps. If translation is good, but they don't like the story, that's taste. If they claim translation errors, check their evidence.
      *   *Scenario 2 (User's champion, should drop):* Apply the steps. Is it actually better? Or just beloved? If others see flaws user missed, weigh that. If it's about prize strategy, maybe compromise.
      *   *Closing:* Encouragement. It's okay to disagree.

  4.  **Refining the Constraints:**
      *   *No headings, bullets, bold, tables.* This is crucial. I must write in paragraphs.
      *   *Continuous prose.* Flow naturally.
      *   *Typos allowed.* I won't intentionally insert many, but I won't obsess over perfection.
      *   *Email style.* "Hi," "Look," "Anyway," etc.

  5.  **Drafting the Content (Iterative process):**

      *   *Intro:* Start by saying I hear you. It's a tough spot. The epistemology of aesthetics is messy.
      *   *The Core Question:* You need to distinguish between "I am wrong about the facts" and "We want different things."
      *   *Step 1 (Evidence):* Before you walk in, ask if the disagreement is about something they can see and you can't. If it's the original text, and you don't read it, you have to trust them on fidelity. But if you *do* read it, you are the expert.
      *   *Step 2 (Taste vs. Truth):* If it's about "alive-ness," that's not truth. It's alignment with the prize's purpose. Ask: Does their view fit the mandate better than mine?
      *   *Step 3 (The Citation):* The hard stop. Can I sign the words?
      *   *Scenario 1:* You read the original. They are lukewarm. If they say "translation is clunky," you know better. Hold firm. If they say "story is boring," that's taste. Maybe compromise if you trust their taste on the prize's behalf.
      *   *Scenario 2:* Your champion. You should drop it. Why? If it's because of flaws you missed, update. If it's because of politics, decide if you care more than the win.
      *   *Conclusion:* It's about living with yourself.

      *Wait, I need to make sure I don't use bullets.* I will use transitional phrases instead.

      *Let's flesh out the procedure steps within the prose.*
      1. Check evidence asymmetry.
      2. Check value alignment (prize mission).
      3. Check citation integrity.

      *Let's integrate the scenarios.*
      Scenario 1: You have the evidence (original). They don't. So on translation quality, you don't move. On merit, you might.
      Scenario 2: You are the outlier lover. They see flaws. Check if flaws are real. If yes, move. If no, hold. But check the citation.

      *Tone check:* Needs to sound like a writer talking to a writer. A bit weary but sharp.

      *Constraint Check:* "no headings, bullets, bold or tables". I must be very careful not to format a list. Just paragraphs.

      *Typo check:* The prompt says "Don't worry about typos, its fine". I should probably write normally but not stress if I miss a comma. I won't intentionally make it look sloppy, just natural.

