answer: |-
  The session must establish that DNA functions as a code only relative to the cellular machinery that interprets it, not as an intrinsic property of the molecule itself.

  ### 1. The Prerequisite Idea: Arbitrariness vs. Causation
  Before asking if DNA is a code, you must secure agreement on what distinguishes a **code** from a **cause**.
  *   **The Concept:** A code relies on an *arbitrary convention* (like the word "dog" having no physical resemblance to a dog), whereas a causal relationship is physically necessary (like fire causing smoke).
  *   **Why it's needed:** If the relationship between DNA and proteins is purely chemical necessity (like a key fitting a lock), it is not a code, it is a reaction. The "code" metaphor only holds if the mapping is contingent on a specific interpretive system.
  *   **Action:** Open with this distinction. Ask them: "If I burn wood, is the smoke a 'message' from the wood?" (No, it's a cause). "If I send a Morse signal, is the blink a 'message'?" (Yes, because of convention). DNA must fall into the second category for the metaphor to work.

  ### 2. The One Example: Overlapping Reading Frames
  Do not use codon degeneracy; it merely shows redundancy, which exists in natural language too and doesn't challenge the "intrinsic meaning" idea. Do not use alternative splicing; it is too easily dismissed as "editing."
  *   **The Choice:** Use **Overlapping Reading Frames**.
  *   **The Explanation:** Show them a simple letter sequence: `THECATATE`.
      *   Read in frame 1: THE CAT ATE.
      *   Read in frame 2: H ECA TAT E...
      *   Read in frame 3: E CAT ATE...
  *   **The Point:** The physical substrate (the letters) remains identical, but the "message" changes entirely based on where the interpreter *decides* to start counting. This proves the information is not *in* the DNA; it is generated by the relationship between the DNA and the reader.
  *   **Timing:** Introduce this at the midpoint, once they accept the causation/convention distinction.

  ### 3. Misconceptions and When to Kill Them
  **Misconception A: "DNA is a Blueprint"**
  *   **Why it's wrong:** A blueprint is a spatial map of the final product. DNA is a temporal set of chemical instructions for building the machinery that builds the product.
  *   **When to head it off:** **In the first 10 minutes.** When defining the prerequisite idea, explicitly ban the word "blueprint." If someone uses it, stop them and ask: "Does a blueprint contain instructions on how to build the factory that reads the blueprint?" (DNA does; blueprints don't).

  **Misconception B: "The Cell is Hardware, DNA is Software"**
  *   **Why it's wrong:** This implies dualism—that the DNA could exist as a "program" independently of the cell. In biology, the "hardware" (ribosomes, enzymes) is required to *create* the code relationship. Without the hardware, the software is just inert chemistry.
  *   **When to head it off:** **Immediately after the Overlapping Frames example.** When they ask "So what reads the frame?", they will say "The cell." Correct them: "The cell *is* the convention." If you remove the cellular machinery, the DNA stops being a code and becomes just a polymer.

  ### 4. The Final Check: The Alien Biochemistry Test
  Do not ask "Does everyone understand?" They will nod.
  *   **The Test:** Ask this specific counterfactual: "If we took a human DNA sequence and placed it into a synthetic chemical soup that had no ribosomes or enzymes, would it still contain information?"
  *   **Pass Condition:** They must answer **No**. If they say "Yes, the information is still there potentially," they have failed to grasp the relational nature of the code. The information ceases to exist without the interpreter.

  ### 5. What to Refuse to Discuss
  You must explicitly rule out two topics to keep the session philosophically rigorous rather than scientifically bogged down:
  1.  **The Evolutionary Origin of the Code:** Do not discuss how the code started. This invites teleological arguments ("who wrote the code?") that derail the metaphysical question of what the code *is* right now.
  2.  **Epigenetics and Gene Regulation:** Do not discuss methylation or environmental switches. This adds causal complexity that obscures the semantic question. Stick strictly to the translation from sequence to protein.
