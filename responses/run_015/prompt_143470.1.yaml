  ### MEMORANDUM

  **TO:** Committee on Student Success Analytics
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Early-Alert Vendor Contract Renewal

  **Recommendation:** Let the contract lapse.

  We are asked to renew a $190,000 annual contract for a predictive model that flags at-risk first-years. While the vendor's reported metrics (AUC 0.83) appear robust, the epistemic conditions required to justify this expenditure no longer hold. The 2024 entry cohort represents a fundamental distributional shift due to test-optional admissions, expanded hybrid offerings, and a tripled bridge program. The model was trained exclusively on pre-2024 data. In statistical learning terms, we are facing covariate shift so severe that past performance is no longer a reliable proxy for future accuracy. Renewing now amounts to deploying a tool validated on a population that no longer exists.

  Furthermore, the pilot data is confounded. Flagged students received coaching; unflagged students did not. If a flagged student persisted, we cannot know if the model correctly identified risk that was mitigated, or incorrectly flagged a stable student. This intervention effect inflates the apparent cost of false positives while obscuring the model's true predictive validity. We are paying for a measurement instrument that we have systematically prevented from measuring accurately.

  The opportunity cost is concrete. $190,000 funds approximately two full-time success coaches. In the absence of a validated model, allocating these resources directly to human capacity is the prudent fiduciary choice. Human advisors can incorporate the nuanced contextual changes of the 2024 cohort that the vendor's static model cannot see. This is not an endorsement of "gut judgment" as superior to algorithms in principle, but a recognition that when algorithmic validity is compromised by population shift, flexible human judgment is the safer baseline until re-validation occurs.

  To justify future procurement, we must demand a design that separates prediction from intervention. I propose the following criteria for any future contract or pilot:

  1.  **Temporal Hold-Out Validation:** The model must be trained on prior cohorts and scored on a *subsequent* cohort without retraining. Cross-validation on pooled data is insufficient for detecting temporal drift.
  2.  **Pre-Registered Thresholds:** Risk thresholds and performance metrics must be locked before the cohort arrives to prevent tuning to noise.
  3.  **Staged Rollout:** Outreach should be randomized or staged where ethically permissible to isolate the model's predictive power from the intervention's effect.
  4.  **Equity Audit:** Performance must be disaggregated by the subgroups undergoing mix changes (e.g., test-optional vs. test-submitting) to ensure error rates do not spike for vulnerable populations.
  5.  **Counselor Baseline:** Counselors' unaided risk assessments should be scored alongside the model to establish a competitive baseline rather than assuming the model is the default truth.
  6.  **Sunset Date:** Any new contract must include a hard stop date if prospective metrics fail to match retrospective claims.

  Letting this contract lapse is not a rejection of analytics, but a demand for scientific rigor. We cannot manage what we cannot measure, and currently, the confounding of prediction and intervention prevents measurement.

  **Closing Consideration**

  I must acknowledge the strongest argument for the option I am not recommending: renewing the contract. The symmetry behind the no-free-lunch results undercuts the in-house model and the counselors' intuitions just as much as the vendor's; we have no guarantee that human judgment will handle the 2024 shift better than the algorithm. We must act either way, and doing nothing is itself a policy with its own implicit predictions about who will fail. A cheap and non-coercive phone call might be worth making even on a low-precision flag, as the cost of a false positive is low compared to the cost of a missed at-risk student. Finally, deliberately withholding outreach from a control group in order to get clean measurements raises a problem of its own, potentially denying help to students in need for the sake of purity. There is moral weight to the claim that acting on imperfect evidence is better than waiting for perfect evidence while students leave.
