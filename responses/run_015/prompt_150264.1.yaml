prompt: |-
  I'm the new intake coordinator for our tennant union's dispute panel — basically I have to decide which complaints about landlords get forwarded to mediation based mostly on what tenants tell me, often second or third hand. I never thought about epistemology before but now it's my whole job, and I'm trying to build something I can actually run.

  I want a decision procedure grounded in the testimony debate — reductionism vs anti-reductionism — but with a twist I've been playing with: call it "testimonial friction," meaning the resistance a claim meets from the listener's background beliefs and from other available sources. The idea is that anti-reductionists are right that we have a default entitlement to accept testimony, but reductionists are right that this entitlement gets eroded by friction — not just by direct counter-evidence but by internal incoherence, by the speaker's known incentives, and by how "heavy" the claim is (how much it asks us to revise our picture of the situation). I need this turned into an actual checklist my panel can run in about 15 minutes per complaint, with ordered questions, thresholds for "pass," "stop," or "escalate to human judgment," and explicit flags for where values, not facts, take over.

  Don't just lay out options — take a definite stand: should friction be calculated globally for the whole report or locally per individual claim? And can high-friction testimony ever be accepted without independant corroboration? Defend the procedure you build, don't hedge with "it depends on your philosophical commitments."

  Then run it on three cases: (1) a tenant says her landlord entered her apartment without notice, witnessed only by her roommate who told her after the fact; (2) a group of tenants reports the building has black mold, but none have medical training and they all live in the same unit; (3) a single long-time resident claims the management company is systematically overcharging everyone, based on comparing his own bills with neighbors over years. Make sure one comes out in a way I'll probably hate — maybe the mold one gets kicked out despite feeling urgent — and flag exactly where the procedure breaks down or hands off to judgment. Keep it practical, I'm not a philosopher, and don't ask me for citations or a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** New intake coordinator for a tenant union's dispute panel.
      *   **Task:** Create a decision procedure to screen complaints for mediation.
      *   **Philosophical Basis:** Testimony debate (Reductionism vs. Anti-Reductionism) modified by a concept called "Testimonial Friction" (resistance from background beliefs, incentives, coherence, claim weight).
      *   **Constraints:**
          *   Must be a practical checklist (15 mins/complaint).
          *   Must take a definite stand (Global vs. Local friction; High-friction acceptance).
          *   Must defend the procedure (no hedging).
          *   Must apply to three specific cases (one outcome should be counter-intuitive/unpopular).
          *   Must flag where values override facts.
          *   No citations/reading lists.
          *   Tone: Practical, decisive, operational.

  2.  **Philosophical Stance & Procedure Design:**
      *   *The Core Tension:* Anti-reductionism says "believe by default." Reductionism says "verify." The user's concept of "Testimonial Friction" bridges this.
      *   *The Stand:* I need to choose between Global vs. Local friction.
          *   *Global:* Assess the witness's overall credibility once.
          *   *Local:* Assess each specific claim's friction.
          *   *Decision:* **Local.** A tenant might be honest about rent payments but delusional about surveillance. Global assessments bias the intake against "difficult" tenants. Local friction respects the anti-reductionist default *per claim* but applies reductionist scrutiny where the claim itself is heavy.
      *   *High-Friction Acceptance:* Can high-friction testimony be accepted without corroboration?
          *   *Decision:* **No.** If friction is high (e.g., extraordinary claim, high incentive to lie, internal inconsistency), independent corroboration is required *before* mediation. Mediation resources are scarce; sending a high-friction/low-corroboration case wastes time and damages union credibility.
      *   *The "Twist":* The procedure needs to explicitly separate *Epistemic Friction* (facts) from *Political Friction* (values/strategy). The union isn't a court; it's an organizing body. Sometimes a weak case is worth fighting for strategic reasons. The checklist must flag this handoff.

  3.  **Drafting the Procedure (The "Friction Intake Protocol" - FIP):**
      *   *Time:* 15 minutes.
      *   *Structure:* Three phases.
      *   *Phase 1: Default Entitlement (The Anti-Reductionist Baseline).* Start by assuming truth.
      *   *Phase 2: Friction Scoring (The Reductionist Check).* Score specific friction points.
      *   *Phase 3: The Verdict & Value Flag.* Pass, Stop, or Escalate.
      *   *Thresholds:* Need clear numbers or binary checks. Let's use a "Friction Score" (0-5).
          *   0-1: Pass to Mediation.
          *   2-3: Escalate (Needs Senior Review/Corroboration).
          *   4-5: Stop (Unless Value Flag triggered).

  4.  **Refining the Friction Metrics:**
      *   What causes friction?
          1.  *Chain of Custody:* Direct witness vs. hearsay.
          2.  *Incentive:* Does the tenant gain materially? (Always yes in tenant unions, so focus on *exaggeration* incentive).
          3.  *Coherence:* Does the story hang together?
          4.  *Claim Weight:* How much does this contradict normal operations?
          5.  *Corroboration:* Is there *any* external anchor?

  5.  **Applying to Cases:**

      *   *Case 1: Landlord Entry (Roommate Hearsay).*
          *   Claim: Landlord entered.
          *   Witness: Tenant (told by Roommate).
          *   Friction: High on Chain of Custody (Hearsay). Roommate isn't present to verify.
          *   Outcome: Likely Escalate/Stop.
          *   *Correction:* Actually, roommate testimony is common. The friction is that the *intake* is second-hand. The tenant didn't see it. This is high friction.
          *   *Result:* Escalate. Need to talk to the roommate.

      *   *Case 2: Black Mold (Group, No Medical Training).*
          *   Claim: Toxic black mold.
          *   Witness: Multiple tenants.
          *   Friction: High on Expertise (they can't ID mold). High on Claim Weight (Health hazard = high stakes).
          *   Corroboration: None (visual only).
          *   *The "Hate" Outcome:* This needs to get kicked out or stalled. Why? Because "black mold" is a specific scientific claim made by laypeople. Without a test kit or inspector, the friction is too high for the union to stake credibility on *as a factual claim*.
          *   *Result:* Stop/Escalate for testing. Cannot go to mediation on "mold" claim alone.

      *   *Case 3: Systematic Overcharging (Single Resident, Long-time).*
          *   Claim: Everyone is overcharged.
          *   Witness: One guy.
          *   Evidence: Comparison of bills.
          *   Friction: Low on Coherence (has data). High on Scope (one person judging everyone).
          *   Corroboration: He has the neighbors' bills (presumably with permission?).
          *   *Result:* Pass/Escalate. The data lowers friction.

      *   *Wait, I need one outcome the user will hate.*
          *   Case 2 (Mold) is the best candidate. It feels urgent. Tenants are scared. But epistemically, it's weak without lab verification. If the procedure kills it, that demonstrates the rigor.
          *   Case 1 is also weak (hearsay).
          *   Let's make Case 2 the "Stop" because it lacks *independent* verification despite multiple witnesses (groupthink risk).

  6.  **Developing the "Value Flag":**
      *   The procedure is epistemic. But the Union is political.
      *   If a case fails epistemically but is strategically vital (e.g., a test case for a new law), the Value Flag allows a human to override the "Stop."
      *   This protects the procedure from being *too* rigid while acknowledging its limits.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Direct, authoritative, operational.
      *   *Defense:* Explain *why* Local Friction is better (protects vulnerable tenants from global credibility attacks). Explain *why* High Friction needs corroboration (resource allocation).
      *   *Case Studies:* Walk through the scoring. Ensure Case 2 fails.

  8.  **Final Review against Constraints:**
      *   Definite stand? Yes (Local Friction, No High-Friction Acceptance).
      *   Checklist format? Yes.
      *   15 mins? Yes, it's short.
      *   Three cases? Yes.
      *   One hated outcome? Yes (Mold case stalled).
      *   Value flags? Yes.
      *   No philosophy jargon beyond what's necessary? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe let the Mold case pass because multiple witnesses reduce friction.
      *   *Correction:* No, the prompt asks for one outcome I'll probably hate. Stalling a health hazard case is the most painful but epistemically sound decision if the claim is "Toxic Black Mold" specifically. I need to distinguish between "There is mold" (visual) and "It is black mold/toxic" (scientific). The procedure must catch that distinction.
      *   *Refining Case 1:* Roommate testimony is technically hearsay in court, but in a union, it's common. To make the procedure work, I need to emphasize the *intake* is second-hand. The tenant *didn't see it*. That's high friction.
      *   *Refining Case 3:* Single resident claiming *everyone* is overcharged is a huge claim. But if he has the bills, that's corroboration. I need to make sure the scoring reflects that physical evidence lowers friction significantly.

  10. **Final Polish:** Ensure the "Value Flag" is distinct from the "Epistemic Score." The score decides truth-probability; the flag decides strategic worth.

  *(Self-Correction on the "Hate" outcome)*: The prompt says "maybe the mold one gets kicked out." I should commit to that. It's the strongest demonstration of the "Claim Weight" friction.

  *(Self-Correction on Global vs Local)*: I need to be very clear why Local is the only ethical choice for a union. Global scoring punishes tenants who have complained before or seem "difficult." Local scoring treats every claim on its own merits.

  Let's write it.cw
answer: |-
  # The Friction Intake Protocol (FIP)

  **Purpose:** To screen tenant complaints for mediation within 15 minutes.
  **Philosophical Stance:** Local Friction + Corroboration Requirement.
  **Operator:** Intake Coordinator.

  ## Part 1: The Definite Stand

  You asked for a position, not a survey. Here it is:

  1.  **Friction is Local, Not Global.** Do not score the *tenant*; score the *claim*. A tenant might be reliable about rent payments but unreliable about harassment. Global scoring (credibility of the person) introduces bias against repeat complainers or emotionally distressed tenants. Local scoring (credibility of the specific assertion) protects the anti-reductionist default entitlement for every discrete event.
  2.  **High-Friction Claims Require Corroboration.** If a claim carries high friction (extraordinary, inconsistent, or high-stakes), it cannot proceed to mediation on testimony alone. Mediation is a resource-intensive tool. Sending a high-friction case without corroboration sets the union up for failure and damages collective credibility.
  3.  **The Value Flag.** Epistemology is not politics. A case can be epistemically weak but politically vital. The procedure identifies *facts*; the Coordinator identifies *strategy*. These must be separated.

  ## Part 2: The 15-Minute Checklist

  **Phase 1: Baseline Entitlement (2 Minutes)**
  *Goal: Establish the Anti-Reductionist Default.*
  *   [ ] **Record the Claim:** Write the specific assertion in one sentence. (e.g., "Landlord entered on 5/12," not "Landlord is violating rights.")
  *   [ ] **Identify the Source:** Is the speaker a direct witness?
      *   *Yes:* Proceed to Phase 2.
      *   *No (Hearsay):* Add **+2 Friction Points**. (Testimony about testimony is inherently high friction).

  **Phase 2: Friction Scoring (8 Minutes)**
  *Goal: Apply Reductionist Scrutiny Locally.*
  *Assign points. Higher score = Higher Friction.*

  1.  **Chain of Custody:**
      *   Direct observation by speaker: **0 pts**
      *   Observed by known associate (roommate/family): **1 pt**
      *   Observed by unknown third party/Rumor: **2 pts**
  2.  **Internal Coherence:**
      *   Timeline and details are consistent upon retelling: **0 pts**
      *   Minor inconsistencies (dates/times shift): **1 pt**
      *   Major contradictions (location/event changes): **2 pts**
  3.  **Claim Weight (Revision Cost):**
      *   Routine violation (late repair, noise): **0 pts**
      *   Serious violation (entry, shut-off): **1 pt**
      *   Extraordinary claim (surveillance, toxic hazard, systematic fraud): **2 pts**
  4.  **Incentive Structure:**
      *   Standard leverage (repair/rent): **0 pts**
      *   High leverage (large payout/eviction defense): **1 pt**
  5.  **Independent Anchors:**
      *   Physical evidence provided (photos/logs/bills): **-2 pts**
      *   Corroborating witness available for contact: **-1 pt**
      *   No external anchor: **0 pts**

  **Phase 3: The Verdict & Value Flag (5 Minutes)**
  *Goal: Decision and Handoff.*

  **Calculate Total Friction Score:**
  *   **0–1 Points (Low Friction):** **PASS.** Forward to Mediation.
      *   *Rationale:* Default entitlement stands. No significant resistance from background beliefs.
  *   **2–3 Points (Medium Friction):** **ESCALATE.** Senior Review Required.
      *   *Rationale:* Entitlement eroded. Needs a second set of eyes or a request for basic corroboration before scheduling.
  *   **4+ Points (High Friction):** **STOP.** (Unless Value Flag is triggered).
      *   *Rationale:* Entitlement defeated. Requires independent verification (inspector, lawyer review) before union involvement.

  **The Value Flag (Political Override):**
  *   [ ] **Does this case serve a strategic goal beyond the individual?** (e.g., testing a new law, targeting a predatory owner, organizing a building).
  *   *If YES:* You may override a **STOP** or **ESCALATE**.
  *   *Requirement:* You must document *why* the political value outweighs the epistemic risk. This moves the decision from "Is this true?" to "Is this worth fighting for?"

  ---

  ## Part 3: Case Studies

  Here is the protocol in action. Note the outcomes.

  ### Case 1: The Unseen Entry
  **Claim:** Tenant A says Landlord entered the apartment on Tuesday. Tenant A was at work. Tenant A's Roommate saw the Landlord and told Tenant A later.
  **Intake:** Tenant A is speaking to you. Roommate is not present.

  *   **Phase 1:** Source is Tenant A (Hearsay). **+2 Friction**.
  *   **Phase 2:**
      *   Chain: Observed by associate (Roommate). **1 pt**.
      *   Coherence: Story is consistent. **0 pts**.
      *   Weight: Illegal entry is serious. **1 pt**.
      *   Incentive: Standard leverage. **0 pts**.
      *   Anchors: No photos, Roommate not contacted yet. **0 pts**.
  *   **Total Score:** 4 Points (2 from Phase 1 + 2 from Phase 2).
  *   **Verdict:** **STOP.**
  *   **Action:** Do not schedule mediation. Contact Roommate immediately. If Roommate confirms, score drops to 2 (ESCALATE).
  *   **Why:** You are mediating on hearsay. If the landlord denies it, the union has no ground to stand on. The friction of second-hand testimony regarding a "he-said-she-said" event is too high.

  ### Case 2: The Black Mold (The "Hate" Outcome)
  **Claim:** Five tenants in Unit 4B report "toxic black mold" causing headaches. They demand remediation and rent abatement.
  **Intake:** Group interview. No medical training. No test kits.

  *   **Phase 1:** Source is Direct (They see it). **0 Friction**.
  *   **Phase 2:**
      *   Chain: Direct observation. **0 pts**.
      *   Coherence: All agree on presence. **0 pts**.
      *   Weight: "Toxic black mold" is a scientific/medical claim, not just visual. **2 pts**.
      *   Incentive: Rent abatement + Health hazard = High leverage. **1 pt**.
      *   Anchors: Visual only. No lab test, no inspector report. **0 pts**.
  *   **Total Score:** 3 Points.
  *   **Verdict:** **ESCALATE (Borderline STOP).**
  *   **Action:** **Do not forward to mediation yet.** Require a test kit or city inspector report.
  *   **Why You'll Hate This:** Tenants are scared. They feel sick. It feels urgent. But epistemically, laypeople cannot identify *toxic black mold* visually. It is often just dust or harmless mildew. If you mediate on "toxic mold" and the landlord brings in an expert who says "it's Cladosporium (harmless)," the union looks incompetent.
  *   **The Breakdown Point:** This is where *Claim Weight* crushes *Default Entitlement*. The claim asks us to revise our picture from "dirty apartment" to "health hazard." That revision costs too much without independent anchors.
  *   **Value Flag Check:** Is this building a target for a wider campaign? If yes, flag it, get a grant for testing, and fight. If no, you cannot stake credibility on a lay diagnosis.

  ### Case 3: The Systematic Overcharge
  **Claim:** Single long-time resident claims management is overcharging *everyone* in the building based on rent stabilization laws.
  **Intake:** One tenant. Has a spreadsheet.

  *   **Phase 1:** Source is Direct. **0 Friction**.
  *   **Phase 2:**
      *   Chain: Direct review of documents. **0 pts**.
      *   Coherence: Spreadsheet matches his lease history. **0 pts**.
      *   Weight: Systematic fraud is extraordinary. **2 pts**.
      *   Incentive: High (Rent reduction for all). **1 pt**.
      *   Anchors: Physical evidence (bills/spreadsheet). **-2 pts**.
  *   **Total Score:** 1 Point.
  *   **Verdict:** **PASS.**
  *   **Action:** Forward to Mediation/Legal.
  *   **Why:** Despite the "Extraordinary" weight of the claim, the *Independent Anchors* (the bills) reduce the friction significantly. The evidence does the heavy lifting, not the testimony. The testimony is merely the guide to the evidence.

  ---

  ## Part 4: Operational Defense & Limits

  **Why Local Friction?**
  If you score globally, you will eventually tag a tenant as "high friction" because they complain often. Then, when they have a legitimate claim, you ignore it. That breaks the union. By scoring the *claim* (e.g., "mold ID" is high friction, not "tenant is hypochondriac"), you keep the door open for valid complaints from difficult people.

  **Why High Friction Needs Corroboration?**
  Mediation relies on leverage. Leverage relies on the threat of escalation (court/publicity). If your facts are shaky (High Friction), your threat is empty. The landlord will call your bluff. You waste the panel's time and teach landlords that the union bluffs.

  **Where the Procedure Breaks Down (The Value Flag)**
  The FIP breaks down when **truth is less important than solidarity.**
  *   *Example:* Case 2 (Mold). Epistemically, it's a STOP/ESCALATE. Politically, if the tenants are ready to withhold rent *today*, stopping them to wait for a lab test might break the strike.
  *   *The Handoff:* This is where you, the Coordinator, step out of the epistemic role and into the political role. You must explicitly write down: *"Epistemic Score: 3 (Weak). Political Value: High. Decision: Proceed despite risk."*
  *   This protects you. If the mold turns out to be harmless, you can show you knew the risk but took it for the cause. If you don't flag it, you're just bad at your job.

  **Final Instruction:**
  Run the score. Trust the math. If the math says "Stop" but your gut says "Go," use the Value Flag, but **write it down.** That is the only way to keep your epistemology honest and your union effective.
