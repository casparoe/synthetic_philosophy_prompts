answer: |-
  Here is the translation and the residue report.

  ### Part 1: The Translation

  You are asking for the normative argument for **Rank-Dependent Utility (RDU)** or **Risk-Weighted Expected Utility (REU)**, mapped onto **Distributional RL**.

  **1. The Claim: Rational Permissibility of Distorted Probabilities**
  *   **Philosophy:** A rational agent is not required to maximize $\sum p_i u(x_i)$. It is rationally permissible to maximize $\sum w(p_i) u(x_i)$ where $w$ distorts cumulative probabilities. This is not a cognitive bug; it is a valid stance on how risk *itself* has disutility (or utility).
  *   **RL Translation:** The objective function $\mathcal{J}(\pi)$ does not have to be the Expectation of Return ($\mathbb{E}[G]$). It can be a **Spectral Risk Measure (SRM)** or **Distorted Expectation** (Choquet Integral).
      *   Your "fixed monotone spectrum" is the risk spectrum $\phi(p)$.
      *   Your "curve above the diagonal" is the cumulative distortion function $w(p)$ where $w(p) > p$ for low $p$ (cumulative probability from worst).
      *   **Normative Claim:** Optimizing $\mathbb{E}[G]$ is not the unique "rational" loss landscape. Optimizing $\text{SRM}_\phi(G)$ is equally valid for an autonomous agent, provided $\phi$ is coherent (e.g., decreasing for risk aversion). The agent is not "mistaken" about the probabilities; it is evaluating the *distribution shape* as a primitive.

  **2. The Case Against: Independence and Sure-Thing**
  *   **Philosophy:** Violating the **Independence Axiom** (linearity in probabilities) makes you susceptible to dynamic inconsistency (money pumps). Violating the **Sure-Thing Principle** means you cannot separate independent sub-gambles.
  *   **RL Translation:**
      *   **Independence $\approx$ Linearity of the Risk Measure.** $\rho(\lambda X + (1-\lambda)Y) = \lambda \rho(X) + (1-\lambda)\rho(Y)$. SRMs are non-linear.
      *   **The Cost:** This non-linearity breaks **Importance Sampling (IS)**. IS relies on linearity of expectation to reweight trajectories ($\mathbb{E}_Q[X] = \mathbb{E}_P[X \frac{dQ}{dP}]$). For SRMs, reweighting changes the *ranks* of the outcomes in the batch, which changes the quantile mapping $Q_X(p)$. You cannot unbiasedly estimate the gradient of a rank-dependent objective using off-policy data with standard IS weights. You correctly identified this as "living with bias."
      *   **Sure-Thing $\approx$ Bellman Decomposability.** $V(s) = \max_a \mathbb{E}[r + \gamma V(s')]$. If $\rho$ is non-linear, $\rho(r + \gamma Z) \neq r + \gamma \rho(Z)$. The value of a future distribution depends on how it combines with current rewards, which violates the Markov property of the value function.
      *   **The Cost:** You cannot write a standard Bellman backup. You correctly identified this requiring **State Augmentation** (the "budget-to-go").

  **3. Sequential Decisions: Dynamic Consistency**
  *   **Philosophy:** If you plan at $t=0$ using RDU, your $t=1$ self (facing a updated probability distribution) might prefer a different plan than the $t=0$ self intended. This is **Dynamic Inconsistency**.
  *   **RL Translation:** The optimal policy is **non-stationary** with respect to the raw state $s$. The policy $\pi(a|s)$ at step 1 depends on the risk-budget remaining from step 0.
  *   **Resolution:** You restore consistency by augmenting the state $s' = (s, \text{budget})$. This makes the policy Markovian in the *augmented* space. In philosophy, this is called **"Sophisticated Choice"** (anticipating your future deviations and planning around them) vs. **"Resolute Choice"** (committing to the $t=0$ plan). Your architecture enforces Sophisticated Choice via DP on the augmented MDP.

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation, what breaks, and where the disagreement actually lives.

  #### 1. What maps cleanly
  **Verdict:** Your suspicion is correct. Their object is literally a **Spectral Risk Measure / Choquet Integral**.

  *   **Mathematical Identity:** The philosophical "Risk-Weighted Utility" (Buchak, Quiggin, Yaari) is mathematically isomorphic to the "Spectral Risk Measure" (Acerbi, Rockafellar) you are implementing.
      *   Phil: $\sum [w(P(\ge x_i)) - w(P(> x_i))] u(x_i)$
      *   Yours: $\int_0^1 \phi(p) Q_G(p) dp$ where $\phi(p) = w'(p)$.
  *   **The Difference:** The only difference is the **domain of the outcome**.
      *   **Philosophy:** Usually assumes "Final Wealth" or "Lifetime Consequences" (One-shot).
      *   **You:** "Episode Return" (Repeated).
      *   **Implication:** If you train for infinite episodes, optimizing a risk measure over *episode returns* is equivalent to optimizing Expectation over *lifetime returns* (by Law of Large Numbers), **unless** the risk measure is applied to the *aggregate* lifetime return.
      *   **Check:** If your "batch of finished episodes" is the unit of risk, you are risk-averse over *episodes*. If the agent lives forever, this is effectively risk-neutrality over the long run (ergodicity), unless you have a hard constraint (ruin). The philosophers argue about the One-Shot case where ergodicity doesn't apply.

  #### 2. What only survives with distortion
  **Verdict:** "Independence" is exactly "Linearity," and the price is real, not artefactual.

  *   **Independence = Linearity in Mixtures:** Yes. In RL, this is the linearity of the expectation operator.
  *   **The Price:** You noted IS becomes biased. This is not an engineering annoyance; it is the computational manifestation of the philosophical "Dutch Book" argument.
      *   **Why:** A Dutch Book is a sequence of bets that guarantees a loss. In RL, a "Dutch Book" is a distribution shift where your off-policy correction fails to recover the true objective value, leading the policy to optimize a proxy that diverges from the true goal.
      *   **Is it a cost of the view?** Yes. If you reject Independence, you reject the ability to linearly decompose uncertainty. You *must* pay the compute cost of on-policy sampling or biased corrections. The philosophers don't mention gradients, but they mention "incoherence." In RL, incoherence = biased gradients = convergence to suboptimal policies.
  *   **Sure-Thing = Decomposability:** Yes. "Condition on a sub-event and recurse" is exactly the Bellman backup.
      *   **The Cost:** State augmentation. You cannot recurse on value $V(s)$; you must recurse on $V(s, \text{risk-state})$.
      *   **Is it a cost?** Yes, it increases the dimensionality of the MDP.

  #### 3. What has no expression at all in your vocabulary
  **Verdict:** "Rational Entitlement" and the "Unit of Risk."

  *   **Rational Entitlement:**
      *   **Phil:** The agent *itself* chooses the risk function $w$. It is an expression of agency. "I am allowed to care about the variance."
      *   **You:** The risk function $\phi$ is a **hyperparameter** set by the engineer (Principal). The agent (Agent) has no say.
      *   **The Gap:** The philosophical argument is about whether the *Agent* is rational. Your setup assumes the *Principal* is rational and the Agent is a tool. If the Agent were autonomous (e.g., a delegated AI negotiating its own objective), the question "Am I allowed to use SRM?" would matter. In your stack, the answer is "Yes, if the loss landscape converges."
  *   **Granularity of Outcome (The Ergodicity Break):**
      *   **Phil:** The "Prospect" is usually the final state of the world.
      *   **You:** The "Prospect" is the return $G_t$ of an episode.
      *   **The Conflict:** Philosophers argue that risk aversion is rational for a *life* (one shot). Economists argue that for *repeated* bets, you should maximize Expectation (Kelly criterion logic).
      *   **Your Case:** Inventory control is **not** ergodic in the simple sense. A stockout (catastrophe) might end the contract or incur non-linear penalties that don't average out.
      *   **Missing Concept:** **Ruin Constraints.** The philosophical justification for SRM often collapses to "avoiding ruin." If your "catastrophe" is soft (just a large negative reward), Expectation maximization eventually recovers. If it's hard (episode terminates, system resets), SRM is a proxy for a constraint. The philosophy literature debates whether "avoiding ruin" justifies global risk aversion or just local constraints.

  #### 4. The Budget-to-Go Hack
  **Verdict:** It solves the *computational* problem but relocates the *normative* problem.

  *   **Does it defuse the objection?**
      *   **Computationally:** Yes. By augmenting state with the "risk budget" (e.g., the quantile threshold or accumulated distortion state), you restore the Markov property. The Bellman equation holds in the augmented space $(s, b)$.
      *   **Normatively:** No. The philosophical objection is: "Why does the agent at $t=1$ care about the risk budget set at $t=0$?"
      *   **In RL:** Because you hard-coded the gradient to flow through $b$. You forced dynamic consistency by architecture.
      *   **In Phil:** This is "Resolute Choice." The agent commits at $t=0$ to a plan that its future selves might not locally prefer.
      *   **The Relocation:** The problem moves to **defining the budget state**.
          *   If you define budget as "remaining allowed CVaR," you are solving a constrained MDP.
          *   If you define budget as "accumulated distortion weight," you are solving an unconstrained SRM-MDP.
          *   **The Disagreement:** Philosophers argue about whether the $t=1$ agent *should* respect the $t=0$ risk weights if the local probabilities have changed. Your architecture says "Yes, because $b$ is in the state." A pure RDU theorist might say "No, the $t=1$ agent should re-evaluate risk based on current prospects."
          *   **Practical Upshot:** If your environment is non-stationary, your "budget-to-go" might lock the agent into a risk-averse policy when the risk has actually passed. This is the "sunk cost of risk" problem.

  ### Concrete Numbers: Where the Vocabularies Disagree

  Let's verify your sign convention and show the IS break.

  **The Prospect:**
  Three outcomes (Returns), sorted worst-to-best: $x = [0, 50, 100]$.
  Probabilities: $p = [0.2, 0.5, 0.3]$.
  Cumulative Prob (from worst): $F = [0.2, 0.7, 1.0]$.

  **Your Risk Spectrum (Risk Averse):**
  You said "curve above diagonal loads extra weight onto bad tail."
  Let distortion function $w(F)$ be $\sqrt{F}$ (Concave, Above Diagonal).
  Weights $\phi_i$ are the differences in distorted cumulative prob:
  *   $\phi_1 = w(0.2) - w(0) = \sqrt{0.2} \approx 0.447$
  *   $\phi_2 = w(0.7) - w(0.2) = \sqrt{0.7} - \sqrt{0.2} \approx 0.837 - 0.447 = 0.390$
  *   $\phi_3 = w(1.0) - w(0.7) = 1.0 - 0.837 = 0.163$
  *   Sum $\approx 1.0$.
  *   **Check:** Bottom outcome (0) gets weight 0.45 (vs 0.2 prob). Top outcome (100) gets 0.16 (vs 0.3 prob). **You are correct:** Above-diagonal $w$ on CDF = Risk Averse.

  **Evaluation:**
  *   **EU:** $0.2(0) + 0.5(50) + 0.3(100) = 55$.
  *   **RDU (Your Objective):** $0.447(0) + 0.390(50) + 0.163(100) = 19.5 + 16.3 = 35.8$.
  *   The value drops because the risk measure penalizes the dispersion.

  **The IS Break (The "Independence" Violation):**
  Suppose you want to evaluate this prospect under a new distribution $Q$ using samples from $P$.
  *   $P$: $[0.2, 0.5, 0.3]$ (as above).
  *   $Q$: $[0.1, 0.1, 0.8]$ (High chance of 100).
  *   **True RDU under Q:**
      *   $F_Q = [0.1, 0.2, 1.0]$.
      *   $\phi^Q_1 = \sqrt{0.1} \approx 0.316$.
      *   $\phi^Q_2 = \sqrt{0.2} - \sqrt{0.1} \approx 0.131$.
      *   $\phi^Q_3 = 1.0 - \sqrt{0.2} \approx 0.553$.
      *   $\text{RDU}_Q = 0.316(0) + 0.131(50) + 0.553(100) = 6.55 + 55.3 = 61.85$.
  *   **IS Estimate using P-samples:**
      *   You sample from $P$. You get mostly 50s.
      *   You apply importance weights $w_i = Q(x_i)/P(x_i)$.
      *   For $x=50$, weight is $0.1/0.5 = 0.2$.
      *   For $x=100$, weight is $0.8/0.3 = 2.66$.
      *   **The Problem:** To compute RDU, you must **sort** the samples to assign $\phi$ weights.
      *   In $P$, the 50s are in the middle rank. In $Q$, the 50s are in the *bottom* rank (since 100 is now 80% of mass).
      *   If you use P-samples, your empirical quantiles place 50 in the middle. You assign it $\phi_2 \approx 0.39$.
      *   But under $Q$, 50 should receive $\phi_1 \approx 0.31$ (bad tail).
      *   **Result:** Your IS estimator assigns the wrong risk weight to the outcomes because the **ranks shift** under the target distribution.
      *   **Philosophical Equivalent:** "Independence" fails because the value of an outcome depends on the *context* of the other probabilities (its rank), not just its own probability. You cannot evaluate parts in isolation.

  ### Final Verdict

  **Did the disagreement evaporate?**
  Mostly.
  *   The "Rational Permissibility" argument is a justification for using **SRM loss** instead of **MSE/Expectation loss**.
  *   The "Dynamic Inconsistency" argument is a warning that you need **State Augmentation** to train it reliably.
  *   The "Dutch Book" argument is a warning that **Off-Policy Correction will be biased**.

  **Where it doesn't evaporate:**
  *   **The Principal-Agent Gap:** Philosophy argues the *agent* is entitled to the risk function. You impose it. If your agent were autonomous, you'd need to justify *why* SRM is rational, not just effective.
  *   **The Unit of Risk:** Philosophy cares about One-Shot (Life). You care about Repeated (Episodes). If your "catastrophe" is survivable (soft penalty), Expectation Maximization over infinite episodes dominates SRM. If "catastrophe" is termination (hard constraint), SRM is a valid proxy for Constraint Satisfaction. Ensure your "catastrophe" is actually hard, or you are just paying a compute tax for risk aversion that ergodicity would have washed out.

  **Sign Convention:**
  You are correct. $w(F)$ above diagonal ($w(p) > p$) on the CDF (worst-to-best cumulative) $\rightarrow$ Upweights low returns $\rightarrow$ Risk Averse. Keep that intuition; it holds for Spectral Risk Measures where $\phi(p)$ is decreasing.
