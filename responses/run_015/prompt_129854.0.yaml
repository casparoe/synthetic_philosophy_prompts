          *   Must use "we" but earn it (acknowledge the tension).
          *   Must address what to do with the blank volume and the Lantern Walk.
          *   Must be conceptually honest (distinguish between forged, grafted, ratified without using those labels).
          *   Length: 1300-1500 words.
          *   Add a 300-word note on what was refused and how "we" was handled.

