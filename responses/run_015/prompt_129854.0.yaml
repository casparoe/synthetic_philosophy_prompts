answer: |-
  Good morning. Founders' Day is usually a day for looking backward. We stand in a chapel built for a purpose, on land purchased for a purpose, and we recite a history that is supposed to explain why we are here. This year, looking backward requires us to look more closely than we have before.

  Some of you arrived in August knowing only the date on the website: 1889. Some of you have spent decades believing that date was the bedrock beneath your feet. In September, you learned that the bedrock is actually 1974. You learned that the women's institute from 1889 shares our name and our county, but not our charter, our site, or our people. You learned that a memo from 1974 suggests the earlier date was chosen to help us fit in with accreditors and donors. You learned that the archivist who found this did her job, and that doing her job made her, briefly, a villain.

  It is tempting to treat this as a scandal. It is equally tempting to treat it as a correction of paperwork that changes nothing. I want to suggest it is neither. It is a clarification of what we are holding when we say "this college."

  We are not the institute of 1889. They closed in 1911. We are the college of 1974. The people who built this campus, who hired the first faculty, who admitted the first class, are in this room. They are the founders. To say the date is 1974 is not to diminish their work; it is to locate it accurately. They did not inherit a legacy; they created one. That is a harder thing to do, and a more honest one.

  But if the date is younger than we thought, what happens to the things we love that feel older?

  Consider the Lantern Walk. It began in 1998. A dean of students devised it. There was no precedent. There was no folk custom being revived. It was made up. And yet, when alumni speak of what they miss, they speak of the light on the path. They speak of the silence between the trees. If a thing is made by hand in living memory, does that make it false?

  The walk is real because you walked it. The light is real because you carried it. The meaning of the Walk does not depend on it being older than you are. It depends on you agreeing to walk it together. If we keep the Walk—and we should keep the Walk—we do not need to pretend it started in 1889. We do not even need to pretend it started in 1974. We can say: this began in 1998, and we have kept it alive since then. That is enough. A tradition does not need ancient roots to hold weight. It needs weight to become a tradition.

  Then there is the Ledger.

  In the library, there is a volume. Since 1978, every graduating class has signed it. One book. One signature at a time. It is nearly full. Beneath it, in a drawer, there is a second volume. It is identical. It is blank. It will be needed in about fifteen years.

  This is the only thing on this campus that has been done without interruption for the whole life of the institution. It is not a date on a seal. It is ink on paper. It is a physical record of people who were here, who finished their work, and who marked their passage before leaving.

  When I look at the Ledger, I do not see a metaphor. I see a task. The first volume is almost done. The second volume is waiting. It does not care what year we claim as our founding. It only cares that there are students to sign it.

  So, where does that leave us? We have a date that is true: 1974. We have a ritual that is beloved but made: the Walk. We have a practice that is continuous: the Ledger.

  We cannot go back to 1889. That institution is gone. To claim their age is to claim their dead ends as our own. We cannot throw out the Walk because it was devised by a dean in the nineties. To throw it out would be to say that only things we did not choose can matter to us. And we cannot ignore the Ledger, because it is the only thing that proves we are a continuous people without lying about it.

  The question for this room is not whether we are old. The question is whether we are willing to be here.

  To the class of 1974 and the faculty who arrived in those early years: You built this place. You did not need a fake date to do it. You built the buildings. You hired the teachers. You started the Ledger. You are the founders. The correction does not take that away. It gives you the credit for what you actually did, rather than borrowing credit from people who died in 1911.

  To the first-years: You did not come here for 1889. You came for now. You will walk the path. You will sign the book. You do not need a pedigree to belong here. You belong here because you are here.

  So, what do we do with the blank volume? We fill it. We do not start a new book to mark the new date. The continuity of the Ledger is more valuable than the accuracy of the date on the seal. The book continues because the college continues. When the first volume is full, we will take out the second. We will not write a new founding date on the inside cover. We will simply sign our names.

  And what do we do with the Lantern Walk? We keep walking. But we stop pretending it is older than it is. When you lead the Walk next year, you can say: "This began in 1998." You can say: "People before us decided to light this path, and we are deciding to keep it lit." That is not a diminishment. That is a transfer of responsibility. If the Walk is only real because it is old, then you are just actors in a play written by others. If the Walk is real because you walk it, then you are the authors.

  We are not a nation. We are not a family. We are a college. We are a group of people who have agreed to do specific things in a specific place for a specific amount of time. We agree to study. We agree to sign the ledger. We agree to walk in the dark with light.

  The 1889 date was a graft. It was an attempt to attach ourselves to a trunk that was already cut down. It made us feel sturdier than we were. But a graft cannot hold the weight of a community forever. Eventually, the sap stops flowing. We have reached that point. We must stand on our own roots.

  Our roots are in 1974. They are in the dirt of this county. They are in the signatures in the library. They are in the memories of the people sitting in the front rows who remember when there were no buildings here at all.

  There is a temptation to say that the "real" tradition is our values. I will not say that. Values are invisible. You cannot hold them. You cannot sign them. You can only hold a pen. You can only hold a lantern.

  The blank volume in the drawer is not a threat. It is an invitation. It says that there is room for you. It says that the story is not finished. It says that we do not need to pretend to be someone else to be worth reading.

  We are forty years old. We are a young institution. That means we are still deciding what we are. The people in 1889 decided what they were, and then they closed. We are still here. We are still open.

  So let us keep the Ledger. Let us keep the Walk. Let us keep the date that is true. And let us understand that the "we" in this room is not formed by who came before us. It is formed by who is standing here now, holding the light, waiting to sign the page.

  The book is open. The path is lit. The date is 1974. Let us begin.

  ***

  **Note on Refusals and the Pronoun "We"**

  I refused to offer "values" as the substitute for history. To say "our real tradition is excellence" would allow the audience to keep the emotional payoff of the 1889 date without the factual burden, which violates the constraint against abstraction. I also refused a debunking tone; the speech validates the Lantern Walk's power despite its invented origin, avoiding the smirk of "now that you know the truth."

  The "we" was earned by shifting its referent from shared ancestry to shared task. Early in the speech, "we" is tentative, acknowledging the split between those who knew 1889 and those who know 1974. By the end, "we" refers specifically to the people currently willing to sign the ledger and walk the path. This includes the 1974 founders (who started the tasks) and the first-years (who will continue them), while excluding the 1889 institute (who did neither). The pronoun binds the room through the objects—the book and the lantern—rather than through a claims of blood or spirit.
