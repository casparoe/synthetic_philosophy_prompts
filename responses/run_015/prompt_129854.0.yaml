      *   The speech needs to navigate the tension between *truth* (1974 founding) and *meaning* (1889 legacy, Lantern Walk, Ledger).
      *   It needs to validate the *work* of tradition rather than the *age* of tradition.
      *   The Ledger represents *continuity* (ratified).
      *   The Lantern Walk represents *commitment* (forged but real through practice).
      *   The 1889 date represents *ambition* (grafted, now corrected).
      *   The "we" is earned through shared participation in these practices, not through shared ancestry.
      *   The blank volume is the key metaphor: the future is unwritten, but the book is ready.
