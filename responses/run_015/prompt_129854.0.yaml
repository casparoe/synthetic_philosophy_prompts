  4.  **Writing the Speech (Iterative Process):**

      *   *Start:* Good morning. Founders' Day. Usually a look back. This year, a look at where we stand.
      *   *The Date:* We are younger than we thought. 1974, not 1889. Why does it hurt? Because we wanted to be older. Why does it matter? Because truth matters.
