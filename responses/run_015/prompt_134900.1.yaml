  Right, so picture this: me and the lads are stuck on a group project, proper nightmare scenario. It's 4 AM, we've had about six hours of sleep between the four of us, and we're staring at a Google Doc like it's written in hieroglyphics.

  One bloke, Dave, tries to rally the troops. He's like, "Right, if we optimise the argument structure now, we can still scrape a Distinction." Proper optimizer vibes, despite his eyes bleeding.

  And I'm sat there, brain absolutely fried, thinking about Herbert Simon. So I tell him, "Dave, mate, shut it. We're operating under bounded rationality. The cognitive load is too high for optimizing. We're bounded."

  He goes, "So what? We just botch it?"

  I say, "Nah, it's procedural rationality, innit? It's not about the best outcome, it's about the right decision-making process for our limited brains. We need to adjust the aspiration level to match the panic."

  So we did. Didn't adjust it down to 'pass'. Went proper lower than that.
  The new aspiration level was literally just "does the file size allow it to upload before the portal closes?"

  Turns out the most procedurally rational thing we could produce was a 39% and a silent pact never to make eye contact in seminars again. Simon called it adaptive aspiration adjustment. I call it survival.
