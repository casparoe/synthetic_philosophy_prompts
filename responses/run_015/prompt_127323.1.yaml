  **2:14 AM. The kitchen light is humming. There's a half-empty bottle of wine and two mugs of cold tea.**

  **A:** I'm just saying, the moment I sit down and put "thousands of grieving strangers" on one side of the scale and "my dead friend's explicit wish" on the other, I've already lost him.

  **B:** You haven't lost him. You're helping people.

  **A:** Not like that. Williams's point isn't about the output. It's about the *source* of the action. If I keep the promise because I calculated that keeping promises generally yields good utility, that's one thought too many. But if I destroy the album because weighing his trust against public grief feels like a betrayal of the friendship itself? That's integrity. The commitment shouldn't be fungible.

  **B:** Okay, but that's where Williams gets slippery. You're calling it integrity, but look at it from the outside. It looks like moral vanity. You're privileging the cleanliness of your own moral hands over actual suffering. Thousands of people processing grief—that's real utility. Your psychological comfort in feeling like a "loyal friend" is… what? A preference?

  **A:** It's not comfort. It's constitutive. It's not that I *feel* bad breaking the promise. It's that *I* am the person who made this promise. If I dissolve that commitment into the general welfare, there's no "me" left to do the doing. I become a channel for utility.

  **B:** But here's the thing about this specific case. The album. It's not a burning building. You're not choosing between saving your wife or a stranger where the instinct has to be immediate. This is data. It's sitting on a hard drive. There's no urgency. You have time to deliberate. Doesn't that change the calculus? If there's no gun to your head, aren't you obligated to think about the consequences?

  **A:** No. That misses the point of the objection. The lack of urgency doesn't make the calculation permissible; it just makes the betrayal more premeditated. Williams isn't saying integrity only applies in emergencies. He's saying ground projects—like friendship—define the horizon of my life. If I say, "I'll honor this unless the utility gain is high enough," I'm not actually being a friend. I'm being a trustee with a conflict of interest. The friendship *is* the reason. Adding "plus the aggregate grief of strangers" isn't adding weight; it's changing the category.

  **B:** But why is the category sacred? Look, let's twist the identity thing. You're framing identity as narrative continuity, right? Like, "I am the protagonist who keeps promises." But what if identity is just preference satisfaction over time? Your friend preferred destruction. The mourners prefer healing. Why does the dead guy's preference get a veto powered by "narrative" rather than just being one preference among thousands?

  **A:** Because narrative isn't just a story I tell myself. It's the structure of my agency. If I treat my commitments as disposable preferences, I can't have projects anymore. I can only have assignments. And regarding the data—it's not just a preference. It's a digital legacy. It's curated private datasets. If I release it, I'm turning his private interiority into public utility. I'm consuming him.

  **B:** You're consuming him either way if you destroy art that could help people. That's the vanity charge again. You're saying "my relationship to this data matters more than what the data *does*." But if we're talking digital legacy… isn't the point of data that it flows? If you lock it down based on a narrative constraint, aren't you just hoarding meaning?

  **A:** I'm not hoarding. I'm respecting the boundary that made the friendship possible. He trusted me with the delete key. That trust wasn't conditional on "unless you find a really good reason." If I start negotiating the terms of his trust based on external welfare, I'm not honoring the narrative of us. I'm editing the story to make myself the hero of a bigger plot.

  **B:** Or you're refusing to accept that sometimes the hero of the story has to be the one who breaks the promise so others don't drown in grief. And look, if identity is narrative… narratives change. You evolve. Maybe the "you" that exists tomorrow is the one who released the album and helped those people. Why is the "you" of yesterday—the one who made the promise—allowed to veto the welfare of the living based on a story that's already over?

  **A:** Because the "me" of yesterday is the only reason the promise exists at all. If I sever that continuity for the sake of utility, I've proven Williams right. I've shown that personal commitments are just illusions waiting to be overridden. And if that's true, why be friends with anyone? Why not just be a utility node?

  **B:** Because being a utility node helps people. And maybe integrity is just the name we give to our reluctance to pay the price.

  **A:** Or maybe it's the only thing that keeps us from being expendable.

  **B:** *(Sighs, rubs face)* God, I'm too tired for this. The hard drive is still on the counter.

