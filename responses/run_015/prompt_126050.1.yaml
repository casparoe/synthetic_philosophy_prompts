answer: |-
  1. This practice presupposes a functionalist ethics where the social utility of memory outweighs the moral obligation to factual completeness in the public sphere. It treats public commemoration as a constructive tool for cohesion rather than a reflective mirror of archival evidence.
  2. A pragmatist can defend this without relativism by arguing that social cohesion is a distinct good that sometimes warrants prioritizing narrative stability over comprehensive accuracy. This maintains evidential norms in archives while permitting curated narratives for civic functioning.
  3. The board implicitly commits to a metaphysics where collective identity is a voluntary project requiring narrative curation to ensure present continuity. This suggests that community survival depends on selective inheritance rather than total fidelity to past events.
  4. Replacing mnemonic sovereignty with strict evidentialism would collapse the ethical distinction between the academic annex and the public plaque, rendering the dual-track system hypocritical. Their justification that history serves the dead while memory serves the living would fail under the demand for public truth.
  5. Coherent implementation would require mandated curricular revisions to include excluded narratives and the contextualization or removal of misleading civic plaques. Legal statutes would also be needed to bind public commemoration directly to archival findings rather than community preference.
