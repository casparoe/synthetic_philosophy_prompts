  I just spent the evening arguing with a friend about Gongsun Long’s white horse dialogue. She insists it is transparent sophistry—merely an ambiguity in the copula—while I think the School of Names is pressing a genuine problem about how compound descriptions relate to kind terms. Write an essay on whether the claim that a white horse is not a horse is best understood as a category mistake, or whether it anticipates modern semantic distinctions between kind membership and qualitative modification. Weigh the standard reading that treats “horse” as a sortal and “white” as an intersective modifier against the alternative that color terms can function non-intersectively, altering the conditions under which something belongs to a kind. Reach and justify a conclusion: does this interpretation save the School of Names from the charge of mere paradox-mongering, or does it collapse into confusion about levels of predication?
