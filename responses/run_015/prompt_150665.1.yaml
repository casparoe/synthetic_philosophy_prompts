      *   Embryo B (Low Cog, High Health): 40% chance Track. EV = 0.4(75) + 0.6(60) = 30 + 36 = 66. Plus Health Robust Good (+4). Total = 70.
      *   Okay, let's flip it so PPB picks A.
      *   Embryo A (High Cog): 60% Track. EV = 69.
      *   Embryo B (Low Cog, High Health): 40% Track. EV = 66. Plus Health (+2). Total = 68.
      *   PPB picks A (69 > 68).
      *   PNP picks B (Health is robust, Track is positional).
      *   Wait, the prompt asks for the case where they *come apart*. If PPB picks A and PNP picks B, that works.
      *   Need to ensure the "positional" aspect is clear. The 60% chance is based on *current* competition. If everyone selects A, the chance drops to 40% (neutralizing the advantage).
      *   Let's refine the numbers to be very tight.
      *   Embryo A: EV 70.0 (Positional).
      *   Embryo B: EV 69.5 (Robust).
      *   PPB: A.
      *   PNP: B.

      *Wait, one more constraint check:* "No sensory-disability or minority-identity framing." The health condition must be generic pain (e.g., degenerative joint disease).
      *   "Realistic near-term IVF": Polygenic scores for education (EA3) vs. health (OA).
      *   "One paragraph of scenario": I must be concise.

      *Let's finalize the numbers:*
      *   Well-Being Units (WBU). Adequacy = 50.
      *   Embryo Alpha (Academic): Polygenic score +1 SD for Educational Attainment. Current probability of securing one of the 5,000 statutory Track places is 55%. Track Life WBU = 80. Non-Track Life WBU = 60. Expected WBU = 71.0.
