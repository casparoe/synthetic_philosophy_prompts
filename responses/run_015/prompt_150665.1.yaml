              *   Embryo B: Lower polygenic risk for late-onset painful condition (treatment improving).
          *   Numbers: Expected lifetime well-being must be *close* (within range of reasonable disagreement/PPB ambiguity).
          *   Verdicts must stem from structure (positional vs. robust), not overwhelming advantage.
          *   No parental interest, no disability/identity framing, no harm/benefit comparison to non-existence, no coercion.
      *   **Deliverables:**
          *   Scenario + Numbers.
          *   Verdicts for PPB and PNP + Derivation.
          *   The single feature doing the work.
