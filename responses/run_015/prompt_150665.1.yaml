      *   **Principle 1 (PPB):** Select the child expected to have the best life (objective well-being). No harm-based reasoning (non-identity problem acknowledged).
      *   **Principle 2 (PNP):** Once adequacy is met, prefer robust advantages over positional ones (advantages that vanish if everyone selects for them/fixed-pool goods).
      *   **Scenario Constraints:**
          *   Realistic near-term IVF + PGS (polygenic scoring).
          *   Imperfect prediction (few % variance).
          *   Jurisdiction: Single ranked exam at age 11 allocates fixed state-funded academic track places (statutorily fixed).
          *   Track predicts income, health, longevity.
