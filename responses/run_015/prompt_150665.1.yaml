answer: |-
  **Scenario and Numbers**

  In a jurisdiction with a statutory cap of 5,000 places in a state-funded Academic Track, allocation is determined solely by a ranked examination at age eleven; the Track yields significantly higher adult income, health, and longevity than the standard pathway. Prospective parents utilize preimplantation polygenic testing on two viable embryos. Embryo Alpha scores +1.0 standard deviation on a polygenic index for educational attainment, while Embryo Beta scores -0.5 standard deviation on the same index but carries a -2.0 standard deviation risk profile for severe late-onset osteoarthritis, a painful degenerative condition for which effective but burdensome lifelong management is widely available. The polygenic scores are imperfect predictors, explaining roughly 10% of the variance in the relevant traits, functioning probabilistically rather than deterministically. Both embryos are well above the adequacy threshold for a life worth living.

  *   **Well-Being Metric:** Expected Lifetime Well-Being Units (WBU); Adequacy Threshold = 50 WBU.
  *   **Track Life Value:** 80 WBU.
  *   **Non-Track Life Value:** 60 WBU.
  *   **Health Bonus:** Avoiding severe osteoarthritis adds 1.5 robust WBU (intrinsic pain avoidance).
  *   **Embryo Alpha (Academic):** 55% probability of securing a Track place under current competition levels. Expected WBU = (0.55 × 80) + (0.45 × 60) = **71.0 WBU**.
  *   **Embryo Beta (Health):** 45% probability of securing a Track place under current competition levels. Expected WBU = (0.45 × 80) + (0.55 × 60) + 1.5 (Health) = **70.5 WBU**.
  *   **Positionality Factor:** If all similarly situated parents selected for Alpha, the cutoff score would rise, reducing Alpha's probability of success to 45% (Expected WBU drops to 69.0). If all selected for Beta, the health benefit remains unchanged.

  **Verdicts and Derivation**

  *   **Principle of Procreative Beneficence (PPB):** Select **Embryo Alpha**. PPB mandates choosing the child expected to have the best life based on available information. Given the current statistical landscape, Alpha offers a higher expected well-being (71.0 vs. 70.5). The principle is agent-relative and does not inherently discount goods merely because they are positional, provided the *individual* expectation is maximized.
  *   **Procreative Non-Positionality (PNP):** Select **Embryo Beta**. Both embryos exceed the adequacy threshold (50 WBU). PNP dictates that when adequacy is met, priority should be given to robust advantages over positional ones. Alpha's 0.5 WBU advantage derives entirely from a fixed-pool good (the Track) which vanishes if generalized. Beta's advantage (health) is intrinsic and persists regardless of others' choices. The moral reason to avoid investing in zero-sum competition outweighs the marginal difference in current expected utility.

  **The Single Feature Doing the Work**

  The divergence rests entirely on the **statutory fixity of the Academic Track places**. This constraint renders the educational advantage a rival good, transforming Alpha's higher polygenic score into a positional weapon rather than a robust capacity.

  **Stability Checks**

  1.  **Making Alpha's Advantage Non-Positional:** If the Academic Track expanded to accept all students meeting a fixed competency standard (removing the rank-order competition), Alpha's advantage becomes robust (literacy/capacity). In this scenario, PPB and PNP converge on **Alpha** (71.0 > 70.5), as the advantage no longer relies on excluding others. The divergence collapses.
  2.  **Removing the Fixed-Pool Structure:** If the jurisdiction abolished the cap, allowing demand to determine supply, the probability of Alpha securing the Track would not degrade upon generalization. Again, both principles would align on **Alpha**, confirming that the statutory cap is the necessary condition for the conflict.

  **Strongest Reply for the Losing Principle (PPB)**

  The strongest defense for PPB is the **"Marginal Causal Efficacy" Objection**: *One* parent's choice to select Alpha does not raise the cutoff score; therefore, the positional disadvantage is not actualized by this specific act. The parent secures the 71.0 WBU for their child without contributing meaningfully to the erosion of the good.
  *   **Does it help?** No, not against PNP. PNP does not object solely to the *aggregate outcome* of everyone selecting Alpha; it objects to the *moral structure* of betting a child's welfare on a fixed pool. PNP argues that participating in a zero-sum selection game is pro tanto wrong when robust alternatives exist, regardless of whether the individual agent triggers the collapse. Relying on the non-compliance of others to secure a positional good is precisely the behavior PNP aims to rule out.

  **Residual Positionality Check**

  There is a residual respect in which Embryo Beta's health advantage is positional: if medical resources for osteoarthritis were rationed, health would become rival. However, the scenario specifies treatment is "widely available" and "improving," rendering the pain avoidance largely intrinsic. This does not destabilize the case because the *degree* of positionality differs categorically (statutory exclusion vs. potential resource scarcity), preserving the asymmetry required for the principles to diverge.

  **Confidence and Uncertainty**

  *   **Confidence in PNP Verdict:** High (95%). The verdict follows definitionally from the principle's constraint on positional goods.
  *   **Confidence in PPB Verdict:** Moderate (75%). Standard formulations of PPB focus on expected well-being given *current* facts, but some interpretations might argue "expected" should account for the risk of generalization.
  *   **Least Sure Point:** Whether standard PPB implicitly requires agents to consider the **generalizability of their maxim**. If PPB is interpreted as a Kantian-style universalizable duty rather than a simple act-utilitarian calculation for the individual parent, it might also reject Alpha, causing the principles to converge. Approximately 40% of the argument's force rests on PPB being interpreted as an agent-relative maximization principle that ignores the systemic effects of generalization.
