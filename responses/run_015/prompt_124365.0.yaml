  I'm preparing material for an advanced graduate seminar on collective rationality, and I'm tired of recycling the same three-premise jury examples that illustrate the discursive dilemma in every textbook. For our session on judgment aggregation, I'd like a joke—structured as a brief dialogue or anecdote of roughly 200 to 300 words—that turns on the actual logical tension between premise-based and conclusion-based aggregation, but situated in a fresh, invented scenario rather than a well-worn legal case.

  Specifically, imagine a seven-member university curriculum committee deciding on a new core program. The committee uses an unusual hybrid rule: each of three propositions—(P) the new course improves critical reasoning, (Q) improved reasoning justifies reducing distribution requirements, and therefore (R) the distribution requirements should be reduced—is adopted as a collective premise if it receives a five-out-of-seven supermajority; however, the collective conclusion R is officially drawn only if it follows from the subset of premises that received unanimous support among the members who actually voted on all three propositions. The punchline should depend on the committee discovering that the premises carrying the supermajority jointly entail R, while the premises with unanimous support either fail to entail R or entail its negation, leaving them with an incoherent collective judgment. The humor must come from recognizing this specific aggregation failure—perhaps through a deadpan exchange about whether they have voted on the curriculum or on logic itself—rather than from generic jokes about academics or bureaucracy.

