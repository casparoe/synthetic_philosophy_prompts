  The Curriculum Committee sat frozen around the mahogany table, the air thick with stale coffee and paradox. Chairperson Evans tapped the tally sheet. "Proposition P—that the course improves reasoning—passed with five votes. Proposition Q—that this justifies cutting requirements—also passed with five. Since P and Q jointly entail R, we cut requirements."

  Professor Thorne adjusted his glasses, smiling faintly. "Not according to Bylaw 4.2. The conclusion is valid only if derived from premises with *unanimous* support among members voting on all three."

  "But we have a supermajority on the premises," Evans protested, gesturing at the whiteboard.

  "Precisely," Thorne replied. "The two dissenters on P were not the same two on Q. Consequently, no premise reached unanimity. The set of unanimously accepted propositions is empty."

  Evans stared at the board, where 'P & Q → R' was written in dry-erase marker. "So the collective judgment is: P is collectively true, Q is collectively true, but R is not officially adopted?"

  "Essentially. We have affirmed the antecedents but are procedurally barred from the consequent. The supermajority premises entail R, but the unanimous premises entail nothing."

  "So we're approving a curriculum change that logic demands but rules forbid?"

  "Worse," Thorne said, closing his notebook with a snap. "We've established that the committee is competent to vote on facts, but incompetent to vote on implication. We aren't deciding the core curriculum; we're deciding whether modus ponens applies to this room."

  Evans sighed, rubbing his temples. "Shall we vote on whether to accept logical consequence?"

  "Motion denied," Thorne said. "That would require a unanimous premise, and I see you're already voting against me."

  ***

  **Postscript**
  This scenario simplifies the standard doctrinal paradox by employing mixed thresholds (supermajority for premises, unanimity for derivation) rather than simple majority voting across all propositions. While classic judgment aggregation theory focuses on inconsistency arising from uniform majority rules, this framing highlights how procedural heterogeneity can similarly fracture collective rationality.
