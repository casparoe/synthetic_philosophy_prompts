answer: |-
  **Brainstorming: Foundational Analogical Mappings**

  1.  **The Perception-Retrieval Isomorphism:** Sensory input is not treated as data acquisition but as the activation of prior categories; there is no "new" information, only recognized patterns mapped from memory.
  2.  **The Conceptual Fluidity Mandate:** Definitions are viewed as temporary stabilizations of sliding scales; fixed boundaries are categorized as cognitive pathologies or "conceptual calcification."
  3.  **The Universal Mapping Principle:** All cognitive outputs (judgment, emotion, logic) are validated solely by their structural alignment between source and target domains; truth is reduced to mapping coherence rather than correspondence.

  ***

  **POSITION ANNOUNCEMENT: TENURE-TRACK FACULTY**
  **Institute for Pure Cognition**
  **Department of Essential Analogies**

  **Position Overview**
  The Institute for Pure Cognition invites applications for a tenure-track position at the rank of Analogical Associate. The Institute's founding charter operates under the non-negotiable thesis that analogy-making is not merely a component of cognition but its sole substrate. Perception, memory, logic, moral judgment, and emotional response are taxonomized as analogical mappings operating at different scales of abstraction. Candidates must demonstrate a commitment to the view that there is no remainder outside the mapping process.

  **Required Qualifications**
  Applicants must hold a doctoral degree in Cognitive Science, Philosophy of Mind, or equivalent structural alignment. Competency must be demonstrated in the reduction of logical inference to high-level analogical slippage. Candidates who adhere to models of direct perception, naïve realism, or non-representational awareness will be deemed non-compliant with Institute ontology and are discouraged from applying. Furthermore, reliance on classical symbolic computation frameworks—specifically those positing rigid token manipulation independent of contextual mapping—is considered a disqualifying adherence to obsolete serial processing models. Applicants must provide a research statement proving that their own cognitive architecture is isomorphic with the Institute's charter.

  **Responsibilities**
  The successful candidate will teach undergraduate seminars designed to dissolve rigid conceptual boundaries. Grading rubrics must prioritize fluid categorization over fixed correctness. Faculty are expected to model conceptual slippage in all departmental communications. Administrative duties include serving on committees where policy is not written but emergently mapped from previous precedents.

  **Institutional Culture and Tenure Standards**
  The Institute maintains a culture of strict structural coherence. Peer review is conducted by checking candidate publications for structural loss when mapped onto the founding charter. Tenure is granted only when a candidate's research program can be mapped onto the Institute's mission without residual error. Office rituals include the Daily Recategorization, where staff members verbally reassign the function of common objects to prevent conceptual stagnation. Failure to participate indicates a risk of essentialist thinking.

  **Compensation and Benefits**
  Salary bands are not fixed but are contextually mapped to the candidate's level of abstraction during the interview process. Parking assignments are not permanently allocated; instead, spaces are dynamically assigned based on the vehicle's categorical resemblance to the employee's current seniority. Health benefits cover treatments for conceptual calcification and rigid boundary syndrome.

  **Application Instructions**
  Submit a cover letter, curriculum vitae, and a sample of writing that demonstrates the dissolution of the subject-object distinction. Do not submit PDFs with fixed layouts; files must be editable to allow for contextual reinterpretation by the search committee. The Institute for Pure Cognition is an equal opportunity employer, provided that equality is understood as structural equivalence rather than identical treatment.

  *Application review begins when the committee perceives the stack of files as a single category.*
