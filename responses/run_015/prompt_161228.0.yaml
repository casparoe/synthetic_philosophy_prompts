  **REPUBLIC OF AETHELGARD**
  **MINISTRY OF NATIONAL CONTINUITY**
  **REQUEST FOR PROPOSALS (RFP-NC-004)**

  **1. SCOPE OF WORK**
  The Contractor shall design, prototype, and deliver a suite of national traditions compliant with the National Identity Act. Deliverables must include:

  1.1 **National Epic:** A foundational text composed in Standard Aethelgardian. Regional dialects are ineligible. The text must demonstrate linguistic continuity predating the standardization initiative by three centuries.
  1.2 **National Costume:** A uniform garment suitable for all climatic zones. Submissions incorporating extant folk attire will be penalized for regional specificity. The design must actively crowd out local variations through superior distribution logistics.
  1.3 **Founding Date:** A specific calendar date established as the origin of the state. The date must precede documented political organization by at least 300 years.
  1.4 **Cartographic Border:** Map overlays depicting national boundaries as topographical inevitabilities rather than political agreements. Rivers and ridges must be retroactively aligned with the border.
  1.5 **Census Category:** A demographic classification ("Aethelgardian") that appears native rather than administrative.
  1.6 **Museum Wing:** A physical exhibit housing artifacts supporting the 300-year continuity claim. Artifacts must be sourced from outside the current borders if necessary to establish antiquity.
  1.7 **Provenance & Performance:** A full dossier verifying the antiquity of all deliverables must be filed with the Ministry and simultaneously classified Level 5. Public access is prohibited. Traditions need only be rehearsed quarterly; citizen belief is not audited.
  1.8 **Timeline:** All deliverables, including 300-year weathering, must be completed within 18 months.

  **2. EVALUATION RUBRIC**
  *   **Antiquity Compliance (30%):** Verification of pre-1724 origin via Ministry weathering protocols.
  *   **Author Anonymity (20%):** Submissions where the creator can be identified will incur a 15% scoring penalty. Authenticity requires authorless origin.
  *   **National Uniformity (20%):** Proposals crowding out local customs in favor of national forms score higher. Surviving local traditions are deemed non-compliant.
  *   **Cartographic Inevitability (15%):** Borders must appear natural.
  *   **Cost (15%):** Total bid price.

  **3. FREQUENTLY ASKED QUESTIONS**
  **Q: How can deliverables be 300 years old if delivered in 2025?**
  A: Contractors are responsible for artificial aging processes. The Ministry requires the *appearance* of continuity, not ontological truth.
  **Q: Does public exposure of manufacturing void the tradition?**
  A: No. Functionality is prioritized over secrecy. Once rehearsed, the tradition remains valid regardless of provenance disclosure.

  ***

  **PRODUCTION NOTE**
  This piece commits to Benedict Anderson's view of nations as imagined communities constructed through specific institutional technologies (maps, museums, census) rather than organic growth. It exaggerates the procurement process to literalize the bureaucratic planning behind cultural "organicness." The satire targets the Hobsbawmian concept of "invented traditions," specifically the telescoping of history to legitimize the present. I take the position that exposing a tradition as manufactured does *not* disable it. The ritual's function—social cohesion and state legibility—operates independently of its truth value. Once the habit is installed via the state's machinery, the knowledge of its fabrication is irrelevant to its power. The comedy relies on the friction between the slow time of culture and the quick time of administration.
