answer: |-
  "You're stuck in classical logic, Sam. One contradiction and boom, the moon is made of cheese."

  "It's *ex contradictione quodlibet*," Sam slurred, tapping his glass hard enough to slosh IPA onto the coaster. "It's rule one. If P and not-P are true, then Q is true. Anything. Even that I'm the Pope."

  Leo shook his head, smiling into his whiskey. "Rule one for you. I'm running paraconsistent software. The crash doesn't take down the whole system." He leaned in, lowering his voice like he was sharing a secret. "Look, joke time. A dialetheist gets pulled over for running a red light. Cop says, 'Light was red and green.' Dialetheist says, 'True.' Cop says, 'So I should arrest you and give you a parade?' Dialetheist says, 'No, just ticket me. The contradiction stays at the intersection.'"

  Sam groaned. "That's terrible."

  "It proves the point. Contradiction doesn't equal chaos. It just means things are messy locally."

  Jack, the bartender, slammed a rag down on the counter. He'd been listening while wiping the same spot for ten minutes. "Speaking of messy." He slid the bill over. "This tab is twenty dollars and it's zero dollars. Both true."

  Leo grinned, nudging Sam. "See? Dialetheism in the wild."

  "Right," Jack said, pointing a calloused finger at Leo. "So I'm collecting the twenty. I'm not collecting your car. That'd be explosion." He tapped the receipt. "The 'zero' part is true too, so I won't call the cops when you leave. Everyone wins."

  "That's not how truth works," Leo protested, reaching for his wallet.

  "It is tonight," Jack said, pocketing the cash. "Cash or card on the contradiction?"
