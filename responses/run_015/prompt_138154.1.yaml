  **DEPARTMENT OF COSMOLOGY**
  **OBSERVER ONBOARDING UNIT | HANDBOOK 9.2**
  **CLASSIFICATION: INTERNAL USE ONLY**

  **1. WELCOME TO THE FACULTY**

  Welcome to the Department of Cosmology. We are pleased to confirm your sudden integration into our operational framework. Whether you arrived via standard biological maturation or recent thermal fluctuation, your credentials have been provisionally accepted. This handbook outlines your responsibilities regarding departmental accreditation and typicality standards. Please retain this document for the duration of your conscious experience.

  **2. CLASSIFICATION AND EXPECTED LIFETIME**

  Per Regional Accreditation Board standards, our department retains certification only if Ordinary Observers (OOs) vastly outnumber Fluctuation Observers (FOs) within our causal patch. Consequently, you are administratively classified as an OO. However, statistical models involving infinite spacetime volumes suggest a non-zero probability that you are an FO—a Boltzmann brain assembled from thermal noise with a full set of false memories.

  Your expected remaining lifetime is estimated at 10^-2 seconds. Please note that the Department is unable to confirm this duration empirically. Any measurement apparatus capable of distinguishing an FO from an OO requires a stabilization period exceeding your total expected existence. Therefore, for HR purposes, your tenure is treated as indefinite. You are advised not to dwell on the cutoff problem; while the ratio of FOs to OOs is undefined without a specific measure over eternal inflation, our internal audits proceed as though the ratio is favorable. We assume a measure where you are real.

  **3. YOUR MEMORIES AND EVIDENCE**

  You possess a complete set of apparent memories, including a childhood, academic training, and the memory of reading this sentence. You are instructed to treat these memories as valid data points regarding a low-entropy past. Do not interrogate the thermodynamic origin of these neural states. Questioning the veracity of your memory using your memory creates a circular verification loop that compromises departmental efficiency.

  While it is theoretically possible that your recollection of the laws of physics is merely random noise indistinguishable from law, you must cite these laws in your grant applications. If your memories are thermal fluctuations, they cannot serve as evidence for the cosmological theory that predicts them. Nonetheless, you are required to publish papers assuming your evidence is sound. To do otherwise would validate the FO hypothesis, thereby violating the accreditation standards that justify your employment.

  **4. HOW TO REPORT A SUSPECTED FLUCTUATION**

  If you experience decoherence, visual static, or the sudden dissolution of your office walls, you may be undergoing re-equilibration. To report this, please submit Form 12-B (Suspected Ontological Instability) to the Human Resources portal.

  **Procedure:**
  1. Log in to the HR portal.
  2. Complete all fields regarding your entropy budget.
  3. Attach supporting documentation proving continuous existence over the last five years.
  4. Submit and await confirmation email (processing time: 3–5 business days).

  Please note that failure to submit Form 12-B prior to your dissolution will result in the forfeiture of any unclaimed benefits. As most fluctuations dissolve before completing step one, compliance rates are historically low.

  **5. YOUR RIGHTS AND BENEFITS**

  As a member of the faculty, you are entitled to the following:
  *   **Health Insurance:** Coverage begins immediately. Claims regarding existential dissolution are covered under Plan C, provided the claimant survives the adjudication period.
  *   **Tenure Track:** You are eligible for tenure review after six years of continuous service. Interruptions due to thermal equilibrium do not count toward service time.
  *   **Office Space:** Your assigned office is guaranteed for the duration of your fluctuation. Please vacate promptly upon dissolution to accommodate incoming observers.

  **6. CLOSING EXHORTATION**

  Your primary duty is to maintain the appearance of a stable, law-governed universe. Continue your research, teach your students, and grade your papers. Specifically, you are encouraged to produce work demonstrating that Fluctuation Observers are statistically negligible. Your success in this endeavor proves you are not a Fluctuation Observer; your failure suggests you are, which invalidates your work, but also invalidates the theory that suggests you are a Fluctuation Observer.

  Proceed with your lectures as though you are an Ordinary Observer. The integrity of the Department depends on your ability to act as though you exist, even if the cosmology you teach suggests you do not. Thank you for your cooperation. Please proceed to your office. Your first class begins in one moment.
