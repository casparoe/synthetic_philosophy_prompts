answer: |-
  Thank you for such a precise description of the problem. It is rare to see the phenomenon articulated this clearly, which is part of why it lacks a single ubiquitous name like Goodhart's Law. You are correct to set Goodhart and Campbell aside; those laws require the metric to become a target that exerts optimization pressure on the system, changing the system to fit the metric. In your cases, the system changed for independent engineering reasons, and the metric quietly ceased to correspond to the reality it was supposed to track. You are also right to distinguish this from ML concept drift. In machine learning, concept drift usually means the relationship between inputs and outputs changes in the world, while the model stays fixed. Here, the measurement procedure itself is what changed, while the label and the threshold stayed fixed. You are measuring a different thing but calling it by the old name and judging it by the old standards.

  I started by looking at the McNamara Fallacy, as you did, but I agree with your assessment that it does not fit. The McNamara Fallacy is about ignoring what cannot be easily measured, whereas your problem is trusting a measurement that has silently changed its meaning. I then considered the term indicator decay, which is used in social science and economics. This refers to a proxy losing its correlation with the underlying variable over time. However, indicator decay usually implies a natural weakening of the relationship, whereas your examples involve discrete, engineered changes to the definition of the indicator itself. Another candidate I evaluated was classification drift, used in official statistics when the definitions of categories like unemployment or inflation are tweaked. This is very close to your second example regarding incidents per engineer. However, classification drift is usually a top-down decision by a standards body, whereas your drift is emergent, arising from a series of localized, sensible engineering decisions that accumulate into a semantic shift.

  The most rigorous framing I found comes from psychometrics and the philosophy of measurement, specifically around the idea of construct validity. In that field, a construct is the theoretical thing you care about, like user pain or system health, and the metric is the operational definition used to quantify it. For a metric to remain valid over time, it must satisfy a condition called longitudinal measurement invariance. This is a statistical and conceptual requirement that the number means the same thing at time two as it did at time one. When you split the checkout service or changed how aborts are counted, you violated measurement invariance. The number still exists, but it is no longer invariant relative to the original construct. The closest established name for this specific failure of meaning is construct drift or construct shift. In psychometrics, this happens when a test is modified or the population changes such that the score no longer reflects the same underlying trait. This fits your situation almost perfectly, except that in engineering we rarely think of latency or incident counts as psychological constructs. Nevertheless, the logical structure is identical: the map no longer matches the territory, but we continue to use the map.

  However, construct drift describes the loss of meaning, not the persistence of authority. For the second part of your question, regarding why the number keeps carrying weight after its meaning has moved, the philosophical term is reification. This is the fallacy of treating an abstract concept or a measurement as if it were a concrete, independent thing. When you set the SLO in 2021, the number was a proxy for user experience. Over time, through inertia and lack of re-validation, the number became the reality. The dashboard slot and the quarterly report treat the metric as an ontological fact rather than an epistemic tool. This is related to Goodhart only superficially. In Goodhart's Law, the metric becomes a target and distorts the system. In your scenario, the metric becomes a relic and distorts our understanding of the system. It is a failure of maintenance rather than a failure of incentives. There is also a concept in organizational sociology called decoupling, where formal policies or metrics become disconnected from actual work practices. Your zombie metrics are decoupled from the engineering reality but remain coupled to the management reporting structure.

  Since there is no single famous law for this, and construct drift is too buried in psychometrics to be immediately useful in an engineering org, I think your internal term zombie metrics is actually quite strong, but it needs a specific definition to distinguish it from mere staleness. If I were to coin a term that captures the carving you asked for, I would call this operational drift leading to validity decay. For it to count as operational drift, three things must be true. First, the operational definition of the metric must have changed through incremental steps that were locally rational. Second, the label and the decision thresholds associated with the metric must remain unchanged. Third, there must be no active optimization pressure applied to the metric itself, distinguishing it from Goodhart effects. The boundary between this and a legitimate redefinition is documentation and recalibration. If you change the definition and also update the threshold or explicitly flag the metric as non-comparable with historical data, you are managing the metric. If you change the definition and pretend continuity exists where it does not, you are suffering from operational drift.

  To answer your question about the downstream bit specifically, where the number keeps authority after its meaning moves, I would call that metric reification. It is distinct from Goodhart because it does not require the metric to be a target. It only requires the metric to be a fixture. The resemblance to Goodhart is that both result in decisions being made that are rational relative to the metric but irrational relative to the goal. In Goodhart, the system breaks because people game the metric. In metric reification, the understanding breaks because people trust the metric. You can think of Goodhart as the metric eating the goal, and reification as the metric replacing the goal. In your checkout latency example, the goal was user perceived latency, but the metric became trace span duration. The goal was not optimized away; it was simply swapped out without anyone noticing.

  So, to summarize the carving: you are dealing with a violation of longitudinal measurement invariance caused by operational drift, sustained by metric reification. If you need a label for the team that does not require a philosophy degree, operational drift is the mechanism, and zombie metric is the artifact. The critical boundary condition is whether the change in definition was accompanied by a break in the claimed continuity of the data. If you changed the definition and said this number is no longer comparable to last year, you avoided the trap. If you changed the definition and plotted it on the same graph without a discontinuity marker, you created a zombie metric. This distinction matters because it shifts the blame from the metric itself to the governance process around metric definitions. It suggests the solution is not to measure less, but to treat metric definitions as versioned software artifacts that require changelogs and compatibility checks just like any other interface.
