  (4) If nothing distinguishes $P$ from $\text{schm-}P$ except habits, $E$ does not support $P$ over $\text{schm-}P$. Evidence requires something other than speech habits.
  (5) Priors can't rescue: Before $E$, no reason to prefer $P$ over $\text{schm-}P$. Symmetry implies equal priors.
  (6) There are endlessly many rivals (vary $t$, $Q$, etc.). Spreading credence makes $P$-prediction probability $\approx 0$.
