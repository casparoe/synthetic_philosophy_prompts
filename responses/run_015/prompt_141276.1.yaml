  Here is the rule Priya is using, the verdict on the GPU budget, and the test case to confirm it.

  ### The Rule
  Priya's definition of "Moloch" is: **A situation where competitive incentives force participants into an active race that produces net negative value, and no amount of cooperation between the participants can stop it without changing the system's rules.**

  This rule hinges on four specific criteria that must *all* be present for the label to apply:
  1.  **Competitive Incentives:** The bad behavior is driven by a desire to win relative to others (promo packets, throughput metrics, budget share), not just neglect or bureaucracy.
  2.  **Active Race:** Participants are actively doing something wasteful to get ahead, not just passively letting something decay.
  3.  **Net Negative:** The outcome is strictly worse for everyone (wasted time, wasted money), with no redeeming value.
  4.  **Systemic Lock-in:** The participants cannot solve it by talking, assigning ownership, or unilateral action. The *rules of the game* (metrics, formulas, industry standards) must change to stop it.

  ### The GPU Verdict
  **Yes, this is Moloch.**

  Here is why it fits Priya's rule perfectly:
  *   **Competitive Incentives:** Teams are fighting for a slice of a capped budget. Your gain is literally someone else's loss.
  *   **Active Race:** Teams aren't just neglecting something; they are actively running pointless jobs to game the metric.
  *   **Net Negative:** Compute is wasted, engineer time is wasted, and everyone hates it. There is no "better service" at the end (unlike the rewrite case).
  *   **Systemic Lock-in:** Teams cannot agree to stop, because if one team defects and runs jobs while others don't, the defector steals the budget. Unilateral disarmament is punished. The Platform group (the rule-makers) has explicitly refused to change the formula mid-year.

  ### The Exception
  My formulation of this rule accommodates all of Priya's verdicts, but it relies heavily on the distinction she draws between the **On-Call Queue** (Not Moloch) and the **Duplicate Libraries** (Moloch).

  Both cases involve wasted effort and shared resources. The only thing separating them in Priya's mind is that the Queue is a *governance* failure (passive dumping, solved by assigning an owner), while the Libraries are an *incentive* failure (active competition for throughput credit, unsolvable by ownership alone). If Priya ever decides that "assigning an owner" counts as "changing the system's rules," this distinction collapses. But as long as she views "ownership" as a management fix and "metrics" as a systemic rule, the rule holds.

