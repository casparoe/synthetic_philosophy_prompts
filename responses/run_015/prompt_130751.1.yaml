answer: |-
  This is a sharp theoretical question. You are essentially asking about the tension between **processual/systemic archaeology** (which often leans toward the centralized-authority model) and **post-processual/practice theory** (which aligns more closely with your friend's "institutional echo").

  The "Institutional Echo" framing isn't just the same inference with the confidence turned down. It is an ontological shift in how we understand what an "institution" actually *is* in the past. Here is how they compare on the specific points you raised.

  ### 1. The Treatment of Discontinuity
  This is the strongest differentiator between the two models.

  **The Centralized-Authority Model: Discontinuity as Noise**
  In this framework, material uniformity (like identical seals) implies a political or administrative grid. Therefore, spatial discontinuities (finding the seals in Region A and Region B, but nothing in between) are treated as **problems of preservation or recovery**.
  *   **The Logic:** If a state enforced standardization, there must have been a mechanism of enforcement across the landscape.
  *   **The Interpretation:** The gap between Region A and B is a "missing link." We assume there *was* an administrative outpost there, but we haven't found it, or it was made of perishable materials.
  *   **The Risk:** This leads to "phantom bureaucracies." You end up mapping a cohesive state over areas that might have been politically fragmented, simply because the pottery looks the same.

  **The Institutional Echo Model: Discontinuity as Signal**
  In this framework, uniformity is the result of distributed networks, prestige emulation, or shared practical solutions. Discontinuities are **structural features**, not errors.
  *   **The Logic:** If local elites in Region A and Region B both adopted a specific seal style to facilitate trade or signal status, they didn't need a central office in the middle to enforce it. They only needed to connect with each other.
  *   **The Interpretation:** The empty space between Region A and B tells you that the "institution" was nodal, not territorial. The lack of administrative buildings isn't a missing piece; it's evidence that no central authority existed to build them.
  *   **The Benefit:** It allows for **heterarchy**. You can have complex, standardized economic behavior without a state apparatus.

  **Verdict on your Seal Scenario:**
  If you find identical seals in two regions with no administrative buildings in between, the **Echo model does better work**. The Centralized model has to invent a missing bureaucracy to explain the seals. The Echo model uses the lack of bureaucracy to explain the *type* of connection (likely commercial or ideological rather than political).

  ### 2. Intentional Design vs. Accumulated Accident
  This addresses the "who did this?" question.

  **The Centralized-Authority Model: The Architect Fallacy**
  This model tends to attribute high levels of **systemic intentionality**. It assumes that because the outcome looks organized (standardized weights), the cause must have been an organized mind (a central planning authority).
  *   **Agency:** Located at the top. The "Temple" or "King" intended the standardization.
  *   **Blind Spot:** It underestimates the power of habit and utility. It assumes people use a specific weight because they were told to, not because it's the weight that works best for the local grain type.

  **The Institutional Echo Model: Emergent Order**
  This model attributes **distributed intentionality**. Individuals are making rational, local choices that aggregate into a pattern that *looks* designed from a distance.
  *   **Agency:** Located at the point of practice. A merchant uses a specific seal because their trading partner recognizes it. A potter makes a standard jar because it stacks well on a boat.
  *   **The "Echo":** Centuries later, archaeologists see the pattern of seals and jars and hear an "echo" of a central system. But in reality, it was a chorus of individual voices singing the same tune for different reasons.
  *   **Nuance:** This doesn't mean "accident." It means the order is **emergent**. Language is a good analogy: English grammar is highly standardized, but no central committee designed it. It converged through usage.

  ### 3. Is it Just "Confidence Turned Down"?
  You asked if the Echo idea is just agnosticism masquerading as theory ("we can't be sure, so let's say it might be bottom-up").

  **No. It is a different causal mechanism.**
  *   **Low Confidence Inference:** "We found pots. Maybe there was a state, maybe not. We aren't sure." (This is useless).
  *   **Institutional Echo:** "We found pots. The distribution pattern suggests a network topology rather than a radial topology. Therefore, the mechanism of spread was likely mimicry or utility, not coercion."

  The Echo model makes **bolder predictions** about what you *won't* find.
  *   **Centralized Prediction:** If we dig deeper, we will find the palace that ordered these pots.
  *   **Echo Prediction:** If we dig deeper, we will *not* find a palace. We will find evidence of peer-to-peer exchange, gift-giving, or market convergence.

  If you dig and find a palace, the Echo model is falsified. If you dig and find only village sites with high-status goods, the Centralized model is strained. Therefore, the Echo model is not just hedging; it is committing to a specific social topology.

  ### Summary: When to use which?
  The "Institutional Echo" isn't always right, but it corrects a specific bias in archaeology known as **state-centric teleology** (the assumption that history is a march toward bigger states).

  *   **Use Centralized-Authority Reconstruction when:** You have evidence of coercion (fortifications, mass graves, radical wealth disparity, writing that explicitly records taxes/commands). In an Empire, standardization *is* usually top-down.
  *   **Use Institutional Echo when:** You have standardization without coercion (uniform pottery across independent villages, shared ritual objects without a central temple, trade goods in non-hierarchical societies).

  Your friend's framing is valuable because it stops archaeologists from turning every pattern of uniformity into a "proto-state." It allows for the possibility that the past was organized, sophisticated, and standardized, but not necessarily *ruled*.
