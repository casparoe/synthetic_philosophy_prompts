  # JOINT STATEMENT ON THE METAPHYSICS AND METHODOLOGY OF CAUSATION

  **Signed:**  
  *The Counterfactual Dependence Working Group*  
  *The Interventionist Modeling Working Group*  

  **Date:** October 26, 2023  

  **Context:** Following a period of adversarial collaboration, the undersigned parties submit this statement to record areas of convergence, map the precise boundaries of remaining disagreement, and identify empirical or conceptual cruxes that would resolve the dispute.

  ### I. AGREED CLAIMS

  1.  **Causation Distinct from Correlation:** Both parties agree that causal relations cannot be reduced to mere statistical correlation or regularity without additional structural or modal constraints.
  2.  **Modeling Utility:** Both parties agree that Structural Equation Models (SEMs) and possible-worlds semantics are useful formal tools for representing causal claims, provided their limitations are acknowledged.
  3.  **Late Preemption:** In standard cases of late preemption (where a preempting cause completes the process before a backup cause can), both parties agree that the preempting cause is the actual cause and the backup is not. We agree that a successful theory must distinguish the active process from the inert backup.
  4.  **Symmetric Overdetermination:** In cases of symmetric overdetermination (where two sufficient causes occur simultaneously and neither preempts the other), both parties agree that intuitive judgments are unstable. We agree that our respective frameworks may yield indeterminate verdicts or require contextual parameters to resolve the claim.
  5.  **Omission and Double Prevention:** Both parties agree that omissions and double preventions can function as causes within specific explanatory contexts. We agree that a gardener's failure to water can be cited as a cause of a plant's death, and that interrupting a preventer can be cited as a cause of the prevented event, provided the relevant variables are modeled.
  6.  **The Closed Two-Variable Convergence:** In a closed system containing only two variables, *X* and *Y*, which are perfectly correlated, with no further variables available to fix a background or perform an intervention:
      *   **Claim:** Neither framework can determine the direction of causation (*X*→*Y* vs. *Y*→*X*).
      *   **Agreement:** Both parties agree that under these specific informational constraints, causal direction is underdetermined. The Counterfactualist agrees that without temporal asymmetry or world-similarity metrics privileging one direction, dependence is symmetric. The Interventionist agrees that without an external intervention variable, the direction is undefined. We converge on the verdict: *No causal direction can be asserted.*

  ### II. AREAS OF DISAGREEMENT

  | Topic | Formulation of Disagreement | Counterfactual Dependence View (CDV) | Interventionist View (IV) |
  | :--- | :--- | :--- | :--- |
  | **1. Circularity of Intervention** | Can the notion of an "intervention" be characterized without presupposing the causal notion it seeks to analyze? | **Yes, it is circular.** The definition of an "ideal intervention" necessarily invokes causal concepts (e.g., "breaking" a causal arrow, "independent" of other causes). Therefore, interventionism cannot serve as a reductive analysis of causation. | **No, it is not viciously circular.** Intervention is characterized functionally within a model structure. While the concept is causal, it clarifies the *structure* of causal relations without requiring prior knowledge of the specific causal link being tested. |
  | **2. Nature of Relevant Counterfactuals** | Are the counterfactuals that ground causation those of "overall similarity of worlds" or those of "surgical modularity"? | **Overall Similarity.** Causal counterfactuals are evaluated by the closeness of possible worlds. Backtracking to a different past is generally forbidden to preserve the asymmetry of causation, but this is a consequence of the similarity metric, not a structural break. | **Surgical Modularity.** Causal counterfactuals represent the outcome of changing a variable's value while holding all other mechanisms (equations) fixed. This requires a "surgical" break from prior causes, distinct from overall world similarity. |
  | **3. Causation in Non-Intervenable Systems** | **Case:** A deterministic, physically sealed universe of finitely many variables arranged in a closed cycle of dependence. There are no external handles, no agents, and no possible interventions. The counterfactual relations among variables are perfectly determinate via world-similarity. | **Verdict:** Causal claims are **true**. <br>**Status:** This is the **correct verdict**. Causation is a feature of the world's modal structure, not dependent on the presence of agents or the possibility of manipulation. | **Verdict:** Causal claims are **undefined/illegitimate**. <br>**Status:** This is the **correct verdict**. Causal claims are inherently tied to the possibility of manipulation or inquiry. To assert causation where intervention is physically impossible is metaphysical excess. |

  ### III. CRUXES

  *Sub-questions such that settling one would move at least one side. For each, we record the case, the predicted verdict, and the nature of the dispute.*

  | Crux Question | Case / Argument | CDV Prediction | IV Prediction | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Chancy Late Preemption** | **Case:** Mechanism *A* fires and causes effect *E*. Mechanism *B* was ready to fire but was preempted. *B*'s firing was indeterministic (e.g., 10% chance). *A*'s firing did not lower the probability of *B* firing, nor was there a step-wise chain of dependence from *A* to *E* (due to chancy gaps). | **Prediction:** Causation holds. We predict a refined similarity metric (e.g., focusing on quasi-dependence or intrinsic process structure) will preserve the causal verdict without interventions. | **Prediction:** Causation holds. We predict that structural modeling of the probabilities (causal Bayes nets) will identify *A* as the cause based on the invariance of the probability distribution under intervention on *A*. | **Genuine.** The dispute is over *why* the verdict is secured (intrinsic process vs. structural invariance). If IV fails to model the probability shift, IV fails. If CDV cannot fix the similarity metric without ad-hocery, CDV fails. |
  | **2. Ontological Status of Omissions** | **Case:** A gardener fails to water a plant; the plant dies. There is no physical event corresponding to "not watering." | **Prediction:** The omission is a **real cause**. The counterfactual dependence (if watered, lives) is sufficient for causal status, regardless of the lack of a physical event. | **Prediction:** The omission is a **model-relative cause**. It is causal only relative to a model that includes a "watering" variable. It is not a fundamental ontological relation but a pragmatic explanatory tool. | **Genuine.** The dispute is ontological. If omissions are shown to lack causal powers in physical interactions (e.g., energy transfer), CDV bears a cost. If omissions are shown to be indispensable for legal/moral responsibility, IV must accommodate them as more than pragmatic. |
  | **3. The Sealed Universe Crux** | **Argument:** If a theory of causation is to be objective, it should not depend on the presence of agents. If a theory is to be scientific, it should not posit relations that cannot be tested. | **Prediction:** We maintain that causation exists in the sealed universe. If IV denies this, IV is committed to the view that causation vanishes when agents vanish, which we consider a *reductio*. | **Prediction:** We maintain that causation is undefined in the sealed universe. If CDV asserts it exists, CDV is committed to unknowable metaphysical relations, which we consider a *reductio*. | **Genuine.** This is a fundamental clash between a realist/metaphysical conception of causation (CDV) and an epistemic/manipulability conception of causation (IV). Settling this requires agreeing on whether causation is a feature of *nature* or a feature of *inquiry*. |
