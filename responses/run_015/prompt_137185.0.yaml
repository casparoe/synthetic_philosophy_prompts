answer: |-
  This is a classic meta-ontological standoff. You are witnessing a collision between **metaphysical realism** (Maya's intuition that identity is a feature of the world we discover) and **ontological deflationism** (Ross's intuition that identity is a feature of our descriptions we decide).

  The slogan "it's merely verbal" is a philosophical Swiss Army knife. It cuts different ways depending on which blade you use. Here is the menu of precise claims hidden inside that slogan, evaluated for their defensibility and their ability to do the work Ross wants them to do.

  ### The Menu of "Merely Verbal" Claims

  **(a) The Disambiguation Claim**
  *   **The Claim:** Maya and Ross are assigning different senses to "same." Maya means *numerical identity via legal continuity*; Ross means *numerical identity via causal continuity of members*. Once we subscript the terms (Same-L vs. Same-C), both parties agree on the truth values of the subscripted sentences.
  *   **Verdict:** **Trivial (if true) / False (if applied generally).**
      *   It is trivial if they are genuinely talking past each other. However, it is likely false here. In ordinary discourse, "same band" has a dominant sense. If Maya is using the dominant sense and Ross is demanding a stricter sense, they aren't just disambiguating; they are arguing about which concept *should* govern the term.
  *   **Does it help Ross?** **No.** Even if they are using different concepts, the dispute shifts to "Which concept is the correct one for this context?" That is not merely verbal; it is normative. Maya can still say, "The correct concept for social institutions is legal continuity, so I am right."

  **(b) The Framework Relativity Claim**
  *   **The Claim:** The truth of "The university is the same" is relative to a conceptual framework (e.g., a legal framework vs. a mereological framework). There is no "framework-neutral" fact that privileges one framework over the other.
  *   **Verdict:** **Substantive and Defensible.**
      *   This is a robust meta-ontological position (associated with Putnam or Carnap). It asserts that ontology is always internal to a conceptual scheme.
  *   **Does it help Ross?** **Partially.** It licenses "There is no *absolute* fact of the matter." However, it does not license "Stop arguing." It licenses "You are right in your framework, I am right in mine." Ross wants to say the dispute is empty; this view says the dispute is *full*, but relative. Maya can accept this and still insist that within the *actual* framework we inhabit (social/legal), she is correct.

  **(c) The Non-Truth-Apt (Pseudo-Question) Claim**
  *   **The Claim:** Sentences about diachronic identity ("Is it the same band?") do not express propositions that can be true or false. They are expressions of attitude or decisions to treat things as one.
  *   **Verdict:** **Likely False / Incoherent (for this case).**
      *   While defensible for moral claims (expressivism), applying this to identity statements is radical. Identity claims function logically as predicates; they embed in conditionals ("If it is the same band, they owe us royalties"). Treating them as non-truth-apt breaks too much of our logic.
  *   **Does it help Ross?** **Yes, maximally.** If the sentence isn't truth-apt, there is literally nothing to be right about. This is the only reading that fully licenses "throw up your hands and walk away." But it is the hardest view to defend.

  **(d) The Ontic Indeterminacy Claim**
  *   **The Claim:** The world itself is vague here. It is not that our word "band" is vague, but that the *object* (the band) does not have a determinate identity over time. There is a fact of the matter, and the fact is *that it is indeterminate*.
  *   **Verdict:** **Wild and Controversial.**
      *   Most metaphysicians reject "ontic vagueness" (following Gareth Evans's argument that vague identity leads to contradiction). However, some contemporary metaphysicians defend it. It is not "merely verbal"; it is a substantive claim about the fuzziness of reality.
  *   **Does it help Ross?** **No.** Ross says "there's no fact of the matter." This claim says "there *is* a fact, and it is a fact of indeterminacy." Maya could accept this and say, "So the correct answer is 'neither true nor false'," which is a substantive metaphysical conclusion, not a dismissal of the question.

  **(e) The Analytic/Trivial Truth Claim**
  *   **The Claim:** There is a determinate answer, but it is secured entirely by the rules of use for the words "university" and "same." It is a "fact of the matter," but it is a linguistic/conceptual fact, not a deep metaphysical one.
  *   **Verdict:** **Substantive and Defensible.** (Associated with Amie Thomasson).
      *   This view holds that existence and identity questions are answered by applying the application conditions of the sortal terms.
  *   **Does it help Ross?** **No, it helps Maya.** If the answer is determined by the rules of our language, then we just need to check the rules. If the rules for "university" rely on charter continuity, Maya wins. Ross cannot say "there is no fact"; he must say "the fact is trivial." But a trivial fact is still a fact.

  ---

  ### The "Agree on All Non-Linguistic Facts" Test

  You asked if Ross's test ("we agree on all the facts") gets off the ground. **It does not.** This is where Ross's move is most vulnerable, and your notes are correct to flag it.

  To state the "non-linguistic facts" without begging the question, Ross must describe the world without using the contested identity conditions.
  *   **Ross's attempt:** "In 1841, a group of humans met. In 2024, a group of humans meet. There is a spatio-temporal continuity of documents."
  *   **The Problem:** As soon as Ross calls the 1841 group a "seminary" and the 2024 group a "university," he has smuggled in sortal concepts that carry identity conditions. A "seminary" is not just "humans meeting"; it is an *institution*.
  *   **The Dilemma:**
      1.  If Ross lists facts using sortals ("The University was founded..."), he presupposes the identity of the university across time. If he presupposes that, he cannot claim identity is the disputed point.
      2.  If Ross lists facts without sortals ("Matter was arranged thus..."), he loses the objects entirely. He can't say "The university changed," he has to say "The matter changed." But then Maya can't even state her position ("The university persisted") because "university" isn't in the base facts.

  **Verdict:** You cannot specify the "non-linguistic facts" relevant to a metaphysical dispute without already adopting a stance on what objects exist and how they persist. The test is circular. It assumes that "facts" are limited to micro-physical arrangements, which is precisely what Maya denies.

  **Confidence:** **High.** This is a standard objection in meta-ontology (often associated with the "quantifier variance" debate).

  ---

  ### Internal vs. External Questions

  This distinction comes from **Rudolf Carnap** ("Empiricism, Semantics, and Ontology", 1950). It aligns most closely with **(b) Framework Relativity**.

  *   **Internal Questions:** Questions asked *within* a linguistic framework (e.g., "Is there a white piece of paper on my desk?" or "Is this the same university according to the legal charter?"). These have truth values and are answerable.
  *   **External Questions:** Questions about the *existence of the framework itself* (e.g., "Do universities *really* exist?" or "Should we adopt a framework that counts institutions as persisting entities?"). Carnap argues these are not theoretical/cognitive questions but practical ones.

  **What it adds:**
  It clarifies that Ross and Maya might be operating on different levels.
  *   **Maya** is asking an **Internal** question: "Given our actual legal and social practices (the framework), does this entity satisfy the conditions for persistence?"
  *   **Ross** is treating it as an **External** question: "Is the framework of 'persisting institutions' ontologically justified?"

  **The Catch:** Carnap would say Ross is right that the External question isn't a "fact of the matter" (it's a practical choice). *However*, in the context of a reading group discussing a real-world case, we are almost always operating Internally. We are asking about *our* world and *our* concepts. If Maya is arguing about how *our* words apply to *our* world, she is asking an Internal question, which *does* have a right answer. Ross's move fails if he tries to use an External skepticism to dismiss an Internal question.

  **Confidence:** **High.** This is a standard exegetical mapping of Carnap.

  ---

  ### Which Reading Licenses Ross's "Stop Arguing"?

  To genuinely license "there's nothing here to be right about," Ross needs a combination of **(c) Non-Truth-Aptness** or a very strong version of **(b) Framework Relativity** (where no framework is privileged *even practically*).

  *   **Readings that leave Maya intact:** **(a)**, **(d)**, and **(e)**.
      *   If it's **(a)** (disambiguation), Maya can argue her definition is the standard one.
      *   If it's **(d)** (ontic vagueness), there is a fact (indeterminacy), so the dispute is substantive.
      *   If it's **(e)** (analytic truth), there is a fact (linguistic rules), and Maya might be right about the rules.

  **The Verdict:** Ross's slogan sounds decisive only on reading **(c)** (it's nonsense) or a vulgarized version of **(b)** (all frameworks are equal, so why bother). Both are difficult to defend. Reading **(e)** (Deflationary Realism) is currently very popular in meta-ontology and suggests that while the fact isn't "deep metaphysics," it is still a fact determined by our concepts—which means Maya could still be *correct* about the concept application. Ross cannot use "it's just concepts" to prove "nobody is right." He can only use it to prove "the stakes are lower than you think."

  ---

  ### Confidence and The Shaky Bit

  **Confidence Levels:**
  *   **Analysis of "Agree on Facts" Test:** High (This is a well-established circularity objection).
  *   **Carnap/Internal-External Mapping:** High (Standard philosophical taxonomy).
  *   **Verdicts on (a), (b), (e):** High (These are standard positions in the literature).
  *   **Verdict on (c) and (d):** Medium (These are more niche/metaphysically loaded).

  **The Claim I Am Least Sure About:**
  I am least confident in my verdict on **(c) The Non-Truth-Apt Claim**.

  **Why:** I labeled it "Likely False / Incoherent." While I stand by that for *this specific context* (identity claims in ordinary language), there are sophisticated expressivist or quasi-realist accounts of discourse that could potentially be adapted to identity claims (though rare). A very clever defender of Ross might argue that "persistence" is a projective feature of human psychology rather than a descriptive feature of the world, making the statement non-truth-apt in a deep sense. While I think this is a losing battle for Ross in a standard metaphysics context, it is not as slam-dunk "false" as the circularity of the "facts" test. If your group has a hardline Humean or Error Theorist, they might dig in here. I flag this because if (c) *could* be made to work, it is the only view that truly vindicates Ross's desire to dismiss the dispute entirely, so it deserves more scrutiny than I have given it here.
