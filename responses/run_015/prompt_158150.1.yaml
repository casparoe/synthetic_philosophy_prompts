  **Point 4: Bohmian vs. Everettian Comparison (5 marks)**
  *   **5 marks:** States it is settled that both are $\psi$-ontic. Explains they differ on the object/law question (Bohm often nomological, Everett often object). Flags the status of the nomological view as contested.
  *   **4 marks:** Correctly identifies both as $\psi$-ontic but fails to articulate the object/law difference, or treats the nomological status as settled.
  *   **3 marks:** Claims one is $\psi$-epistemic, or fails to mention both theories.
  *   **Typical Error:** Asserting Bohmian mechanics is $\psi$-epistemic because the wavefunction is a "law."

  **Point 5: Candidate's Stance on Tie-Breaker (5 marks)**
  *   **5 marks:** Takes a clear position on whether the dispute is idle or resolvable. Compares the costs (ontological vs. methodological). Arguments are coherent and acknowledge the contested nature of the costs.
  *   **4 marks:** Takes a position but fails to compare the "currency" of the costs, or treats a contested cost as consensus.
  *   **3 marks:** Surveys options without taking a position, or the position is internally inconsistent.
  *   **Typical Error:** Refusing to take a position ("both sides have merit") despite the instruction to commit.

  **A/B Boundary**
  An **A answer** must clearly separate the formal $\psi$-ontic/epistemic distinction (Point 1) from the metaphysical object/law distinction (Point 2), demonstrating that settling the first does not settle the second. Furthermore, an A answer must commit to a specific stance on the tie-breaker (Point 5), arguing for the comparability or incomparability of the costs. A **B answer** may conflate $\psi$-onticity with object realism (treating them as identical) or may survey the tie-breaker options without arguing for a specific verdict on whether the dispute is idle.

  **Note on Model Answer Stance**
  The model answer takes the stance that methodological conservatism outweighs ontological strangeness (preferring $\psi$-onticity over independence denial). A good candidate could reasonably reject this, arguing that high-dimensional configuration space is unintelligible, making the ontological cost higher than the methodological one.
