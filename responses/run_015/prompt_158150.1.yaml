answer: |-
  ### 1. Exam Question

  **Question 4**

  Consider the following framework for interpreting quantum theory. An **ontological model** posits that every physical system possesses a real physical state, $\lambda$. A quantum state, $\psi$, assigns a probability distribution over these $\lambda$. A model counts as **$\psi$-epistemic** just when distinct quantum states can be represented by overlapping probability distributions over the underlying physical states, so that a complete specification of the underlying state is compatible with more than one quantum state. Conversely, a model is **$\psi$-ontic** if distinct quantum states correspond to non-overlapping distributions over $\lambda$.

  In 2012, Pusey, Barrett, and Rudolph proved a no-go result. Paraphrased, their theorem states: no model in which the quantum state is mere information about an underlying physical state (i.e., $\psi$-epistemic), and in which independently prepared systems have independent physical states, can reproduce the predictions of quantum theory.

  Write an essay addressing the following three issues. First, explain whether the theorem forces us to accept that the wavefunction is a physical object—a field on a configuration space of very high dimension—as opposed to something nomological, such as a codification of the dispositions of matter or of the dynamics. Second, evaluate the option of keeping a $\psi$-epistemic model by denying the independence assumption. Construct the strongest version of this reply and explain how it differs from, or collapses into, the familiar complaint against superdeterminist responses to Bell's theorem. Third, compare the cost of giving up independence with the cost of accepting a wavefunction on a configuration space of enormous dimension (including the difficulty of recovering the appearance of ordinary three-dimensional goings-on from it).

  Are these two costs denominated in the same currency? Describe what a tie-breaker between them would have to look like, or argue that none is available and that the dispute is therefore idle. You must take a position on whether the dispute is resolvable or idle; do not merely survey the options.

  ***

  ### 2. Model Answer

  The Pusey-Barrett-Rudolph (PBR) theorem demonstrates that within the ontological models framework, one cannot maintain both that the quantum state is merely information ($\psi$-epistemic) and that independently prepared systems possess independent physical states. Since quantum predictions are assumed correct, at least one assumption must fail. However, settling whether the model is $\psi$-ontic does not settle the metaphysical status of the wavefunction.

  The first distinction required is between the $\psi$-ontic/epistemic classification and the object/nomological distinction. The theorem forces us to abandon $\psi$-epistemic models *if* we retain independence. This implies the quantum state is $\psi$-ontic: it reflects the physical state $\lambda$ uniquely. Yet, being $\psi$-ontic does not necessitate that the wavefunction is a concrete physical object, like a field on high-dimensional configuration space. It might instead be nomological. For instance, in Bohmian mechanics, the wavefunction guides particle positions. While formally $\psi$-ontic within the framework (distinct $\psi$ yield distinct dynamics), proponents often argue it functions as a law rather than a material entity. Conversely, Everettian theories typically treat the wavefunction as a concrete field. Thus, the theorem constrains the overlap of distributions, but it does not definitively settle whether $\psi$ is furniture or law; that remains a contested metaphysical choice compatible with $\psi$-onticity.

  If one wishes to retain a $\psi$-epistemic view, one must deny the independence assumption. This suggests that preparations treated as independent in the laboratory are correlated at the level of $\lambda$. The strongest version of this reply posits a common cause in the past lightcone of the preparation devices, constraining $\lambda$ such that the overlapping distributions required for $\psi$-epistemicity are never actually accessed in combination. This differs from superdeterminism in Bell contexts in scope but not in structure. In Bell cases, independence denial correlates measurement settings with hidden variables. Here, it correlates preparation procedures with hidden variables. Both require a conspiracy of initial conditions that mimics statistical independence while violating it fundamentally. Critics argue this undermines the scientific method by making experimental control illusory; proponents argue it is no more costly than accepting high-dimensional realism.

  This leads to the comparison of costs. Accepting $\psi$-onticity often entails configuration-space realism: the fundamental arena is $3N$-dimensional, and 3D space is emergent. The cost is explanatory: recovering the appearance of ordinary 3D goings-on from a high-dimensional field is technically and conceptually difficult. Denying independence entails a conspiratorial cost: accepting that distinct preparations are correlated without a known mechanism. Are these costs in the same currency? Configuration-space realism is an ontological cost (what exists); independence denial is a methodological cost (how we infer existence).

  I argue these costs are comparable because both impact theory choice criteria like simplicity and explanatory power. A tie-breaker would require empirical evidence distinguishing a high-dimensional object from a conspiratorial epistemic state. However, since both can be made to reproduce quantum predictions, no such experiment is currently available. Therefore, the dispute risks being idle unless one prioritizes metaphysical parsimony over methodological conservatism. I take the position that the dispute is not idle: methodological conservatism is paramount. Denying independence undermines the basis of experimental physics more severely than accepting high-dimensional ontology. Thus, we should accept $\psi$-onticity and investigate how 3D space emerges, rather than salvage epistemicism via conspiracy.

