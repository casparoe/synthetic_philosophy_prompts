      *   *Key Insight to Offer:* The distinction might be about *Sacred History* vs. *Secular Legend*. Exodus demands correction because truth claims are theological. Arthur allows variation because truth claims are cultural/aesthetic. Troy is hybrid.
      *   *Terminology:* Introduce "Harmonization," "Social Memory," "Euhemerism."

  8.  **Refining the Content (Self-Correction during drafting):**
