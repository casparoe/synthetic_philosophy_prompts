answer: |-
  During a chaotic end-of-year review, the panel had to award one premium route between two drivers with identical scores; the chair, exhausted and late for a train, pointed to the top file on the stack and said "Him," admitting later this was merely to save time. Six months later, head office demands the choice be reversed to optimize fuel efficiency, offering the chair a personal bonus to manage the transition smoothly. The chair refuses the bonus and blocks the move, arguing that the driver has now built a legitimate expectation which the firm is morally bound to honour, and when threatened with dismissal, resigns rather than treat the driver's entitlement as revisable.

  ***

  **(1) The Tests Run**
  *   **History Test:** **Verdict: Bias.** The judgment ("Driver A deserves this route") originated from the physical order of files and the chair's fatigue. These are causally effective factors that have nothing to do with merit, fairness, or truth. The judgment would not exist in its current form but for this arbitrary nudge.
  *   **Steady-State Test:** **Verdict: Preference (Conviction).** The judgment now moves with reasons (the principle of legitimate expectation), coheres with other commitments (firm authority relies on finality), and is acted upon at significant personal cost (loss of bonus and employment). The holder is not rigid; they offer a principled defence, but they will not abandon the view for convenience.

  **(2) The Feature Doing the Work**
  **Reflective Ratification.** This occurs when an agent acknowledges a flawed causal origin but voluntarily adopts the outcome as binding based on new, independent principles. The agent does not deny the history; they override its normative force with a subsequent commitment.

  **(3) Removing the Feature**
  If you remove **Reflective Ratification** (the chair simply refuses to change the decision without offering a principle, or admits "I just don't want to look wrong"), the case collapses into **Ordinary Bias**. The cost paid becomes mere stubbornness or ego-protection, failing the Steady-State Test.
  If you remove the **Flawed History** (the driver was chosen on clear merit), the case collapses into **Ordinary Preference**. There is no tension between the tests; both would agree the judgment is sound. The divergence only exists because the origin is tainted but the current holding is clean.

  **(4) The Skeptic's Reply**
  **Reply:** "This is just the Sunk Cost Fallacy dressed up as integrity. You are valuing the past mistake (the arbitrary hire) over the present good (fuel efficiency), and calling it 'loyalty' doesn't change the math."
  **Why the Case Survives:** The Sunk Cost Fallacy looks *backward* ("we spent money on this"). The Chair's argument looks *forward* ("we owe future stability to maintain authority"). The cost incurred (resignation) is not to protect the past decision, but to uphold a general rule necessary for future operations. The skeptic confuses the *object* of the commitment (the driver) with the *principle* of the commitment (finality).

  ***

  **On the Mirror Test**
  The Mirror Test asks: *If the files had been reversed, would they still hold the judgment?*
  *   **Result:** Useless/Ambiguous. If the files were reversed, the Chair would have hired Driver B. They would *still* hold the principle ("Whoever we hire, we owe them support"), but the *specific judgment* ("Driver A deserves this") would not exist to be tested.
  *   **Diagnosis:** This does not show your Mirror Test is "bad," but it shows it is designed to detect *substantive* prejudices (e.g., sexism, racism) rather than *procedural* obligations. In cases of institutional duty, the specific outcome is contingent, but the duty is not. The Mirror Test fails here because it cannot distinguish between a contingent outcome held on principle and a prejudiced outcome held on whim. It is too blunt an instrument for this specific type of moral reasoning.

  ***

  **Commitment**
  The case works. It successfully generates the divergence you requested: the History Test flags the causal taint (Bias), while the Steady-State Test confirms the current warrant (Conviction).

  This shows that your two tests are not measuring the same thing, which is their strength, not their weakness. The History Test measures **Causal Pedigree** (where did this come from?). The Steady-State Test measures **Normative Warrant** (does this function as a reason now?).

  Your colleague claims that any view you cannot argue someone into is a preference, and any view you cannot argue them out of is a bias. This case defeats that claim. The Chair *can* be argued out of the specific choice (they admit it was arbitrary), but they *cannot* be argued out of the principle (they resign rather than break it). This proves there is a category of moral judgment that is historically accidental but normatively robust. It is neither mere bias nor mere preference; it is **ratified obligation**. If you cannot distinguish between a prejudice that survives scrutiny and a principle that survives a tainted origin, you cannot distinguish between a bigot and a person keeping a promise.
