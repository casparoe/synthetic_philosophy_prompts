      The distinction between lobsters and insects is defensible within this threshold model, though it remains fragile. The UK legislation relied on specific scientific reviews indicating a higher likelihood of sentience in cephalopods and decapods due to complex nervous systems and behavioral evidence of pain avoidance that is less ambiguous than in insects. This is not a bright line in nature but a regulatory cut-off necessitated by the impossibility of protecting every organism. If obligations tracked only relationships or vertebrate likeness, the lobster inclusion would be inconsistent, but if obligations track the weight of scientific evidence regarding consciousness, the gradient is defensible. However, if one accepts the precautionary principle that justified protecting lobsters despite uncertainty, consistency demands extending some protection to insects, suggesting the current line is partly arbitrary or politically negotiated rather than purely ethical.

