answer: |-
  You raise your head while the night is still deep, and I appreciate the sharpness of your mind even if your body is weary from travel. But you mistake the role of the sober man who presides over the bowls. He is not there to fight the battle for the drinker, nor to remove the danger as a general might clear a road of ambushes before his troops march. His task is merely to ensure the dose is sufficient to stir the passions without destroying the man entirely, much as a trainer sets the weight of the stone a wrestler must lift. If the supervisor were so strict that no warmth entered the blood, you would be right—it would be mere obedience to a master. But the law we propose requires that the wine be allowed to do its work: to loosen the tongue, to heat the spirit, and to whisper that shame is a thing for children. The supervisor watches, but he does not silence the whisper. The struggle happens inside the chest of the drinker, not between the drinker and the pourer.

  Consider what we are trying to measure. You say we already know who obeys the law, but obedience born of fear is not the same as harmony born of reason. A man may stand firm against an enemy because he fears the shame of running, or the punishment of his commander. That is courage drilled by pain. But what holds a man when he is warm, comfortable, and filled with confidence? What stops him from seizing what he wants, or speaking what he should not, when there is no enemy to fight and only pleasure to invite him? The supervised party reveals whether the law has been written inside the soul, not just on the tablet. If a man remains moderate when the wine urges him to be bold, he has proven something no drill against fear could ever show: that he is a friend to himself, and not a slave to the beast within that wakes when the cup is full.
