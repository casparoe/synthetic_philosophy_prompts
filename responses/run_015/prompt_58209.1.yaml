      *   **Section 2: The Circulatory-Respiratory Standard (The "Vital Flux" View):**
          *   *Ontology:* Life is a process of metabolic exchange. Blood and breath are the carriers of the "vital principle." Stop the flow, the organism disintegrates.
          *   *Conception of Person/Organism:* Homeostatic flow. The organism is defined by its ability to self-maintain metabolic continuity.
          *   *Case 1:* Alive. Why? Blood flows, metabolism works, homeostasis is maintained (even if assisted).
          *   *Case 2:* Dead (initially), but technology complicates it. If circulation is restored, are they "resurrected"? Or is the irreversible cessation the key? If ECMO is permanent, are they alive?
          *   *Weakness:* Technology (ECMO, CPR) makes "irreversible" a moving target. It conflates *means* of survival with the *state* of being alive.

      *   **Section 3: Analyzing the Cases (The Conflict):**
          *   *Case 1 (The "Walking Dead" / Somatic Integrator):* Highlights the flaw in Whole-Brain. If the body integrates, why call it dead? *Counter-argument:* It's not *self*-integrating; it's externally supported.
          *   *Case 2 (The "Beating Corpse" / Brain Fragment):* Highlights the flaw in Circulatory. If blood flows via machine, is it life? If only reflexes exist, is it a person?
          *   *The "Irreversibility" Problem:* Both rely on irreversibility, but technology changes what is reversible. This suggests death is not a static biological fact but a relational status between biology and technology.

