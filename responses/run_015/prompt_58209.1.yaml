  6.  (Self-Correction during drafting): Make sure not to confuse "Higher-Brain" (consciousness) with "Whole-Brain" (brainstem + cortex). The prompt specifies "Whole-Brain" (total loss of brain function). Case 2 has brainstem reflexes, so not Whole-Brain dead. I need to be precise.

      *   *Case 1:* Whole-Brain Dead. Circulatory Alive.
