answer: |-
  ### Desiderata for a Normative Theory of Public Commemoration

  **1. The Honor-Record Distinction**
  *   **Requirement:** The theory must rigorously distinguish between *honoring* (endorsing values/individuals) and *recording* (documenting historical facts).
  *   **Motivating Pressure:** Defenders of controversial monuments often conflate removal with erasure, arguing that statues serve as history lessons. A serious theory must explain why a pedagogical function does not justify an honorific form.
  *   **Status:** Non-negotiable.
  *   **Tensions:** None internally, but creates friction with theories prioritizing historical continuity over moral endorsement.

  **2. Spatial Phenomenology and Coercion**
  *   **Requirement:** The theory must differentiate between *destination* markers (central plaza monuments) and *navigational* markers (distributed street names), accounting for the degree of civic coercion involved in encountering them.
  *   **Motivating Pressure:** A citizen can avoid a central square but cannot easily avoid living on or traversing a named street. The moral weight of removal or retention varies based on the ubiquity and inescapability of the marker within daily life.
  *   **Status:** Non-negotiable.
  *   **Tensions:** Jointly unsatisfiable with a strict principle of *Uniformity*. A theory cannot demand identical treatment for all markers while acknowledging distinct spatial phenomenologies.

  **3. The Succession Principle (Replacement Norm)**
  *   **Requirement:** The theory must specify the normative default following de-commemoration: substitution (new honoree), preservation of absence (void), or reconceptualization (counter-monument).
  *   **Motivating Pressure:** Removal creates a semantic vacuum. Without a prescribed succession norm, removal appears purely destructive or invites ad-hoc political bargaining, undermining the stability of the commemorative landscape.
  *   **Status:** Camp-specific (theories diverge here).
  *   **Tensions:** Tension exists between *Substitution* (which risks repeating the honorific error) and *Preservation of Absence* (which may be read as neglect rather than critique).

  ***

  ### Assessment of Existing Positions

  **1. Preservationism**
  *   **Successes:** Satisfies the need for *Civic Continuity* and avoids the logistical disruption of widespread renaming.
  *   **Failures:** Collapses the **Honor-Record Distinction** (R1) by defending honorific statues as educational tools. It fails **Spatial Phenomenology** (R2) by treating inescapable street names as equivalent to optional museum pieces. It typically rejects the **Succession Principle** (R3) entirely, viewing removal as illegitimate.

  **2. Contextualism**
  *   **Successes:** Attempts to preserve historical data while acknowledging moral fault, partially satisfying the *Record* function of R1.
  *   **Failures:** Frequently collapses the **Honor-Record Distinction** (R1) by assuming added text negates the honorific signal of the dominant visual form. It often ignores **Spatial Phenomenology** (R2); a plaque does not reduce the coercive ubiquity of a street name or the dominance of a central statue. It lacks a coherent **Succession Principle** (R3), often defaulting to indefinite retention.

  **3. Removalism**
  *   **Successes:** Rigorously maintains the **Honor-Record Distinction** (R1) by severing state endorsement from problematic figures. Best addresses **Spatial Phenomenology** (R2) by acknowledging the harm of coerced exposure to harmful symbols.
  *   **Failures:** Often lacks a robust **Succession Principle** (R3). Without a clear norm for substitution or reconceptualization, it risks appearing as mere erasure, potentially collapsing the *Record* function back into the *Honor* function (i.e., implying that if one is not honored, one is erased from history).
