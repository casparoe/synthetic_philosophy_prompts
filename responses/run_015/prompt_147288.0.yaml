prompt: |-
  Write the list of requirements that any adequate normative theory of public commemoration—covering both monuments and distributed naming practices such as street names—must satisfy to be taken seriously in current debates. The theory must distinguish the commemorative function of an object or toponym from its purely documentary or pedagogical roles; it must handle spatial distribution, explaining why removing or renaming a single central plaza monument might differ morally from altering dozens of dispersed residential street names; and it must address what I call the replacement problem: whether the removal of a commemorative marker obligates substituting a different honoree, preserving a deliberate absence, or reconceptualizing the site entirely. For each desideratum, state the motivating case or conceptual pressure behind it, flag whether it is non-negotiable or camp-specific, and note if any pair of requirements appears jointly unsatisfiable. Then briefly assess how preservationist, contextualist, and removalist positions fare against your list, indicating precisely where each succeeds and where it collapses a distinction the criteria require. Keep the response formal and concise; no bibliographies or citations are needed.
