      *   **Archival Silence vs. Conventional Secrecy:**
          *   *Secrecy Model:* The truth is in a vault. Open the vault, get the truth. The Media break-in opened a vault.
          *   *Silence Model:* The archive *produces* truth by excluding other things. The silence isn't an accident; it's a function of power. The FBI decided what was worth recording and what was worth burning. The Media docs are a fragment that *became* the whole narrative.
