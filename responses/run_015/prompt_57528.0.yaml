  # Game Title: The Kappa Decay Protocol

  ## 1. Subject Matter & Research Programmes
  **Subject:** The radioactive decay of the fictional isotope **Kappa-9 (κ-9)**.
  **Data:** Counts Per Minute (CPM) recorded from a Geiger counter over 10-day cycles.

  **The Two Rival Programmes:**
  *   **Programme INTRINSIC (Teams 1 & 2):**
      *   **Hard Core:** Decay is an internal property of the nucleus. External conditions (pressure, temperature, shielding) *cannot* alter the decay rate.
      *   **Initial Theory:** Decay follows a smooth exponential curve.
  *   **Programme EXTRINSIC (Teams 3 & 4):**
      *   **Hard Core:** Decay is triggered by external cosmic bombardment. External conditions *must* alter the decay rate.
      *   **Initial Theory:** Decay follows the intensity of background cosmic radiation.

  ## 2. Materials List (Zero Budget)
  *   **Paper:** 4 Scorecards (one per team), 8 Sheets of "Data Releases" (2 per round), 8 Small Envelopes (for sealed predictions).
  *   **Writing:** Pens for all students.
  *   **Room:** 4 Tables (1 per team), 2 Whiteboards (for public leaderboard).
  *   **Facilitator:** You (with a master sheet of "True Data" and timing control).

  ## 3. The Rules (Plain English Only)
  *Do not use terms like "Hard Core" or "Heuristic" during the game.*

  1.  **Team Setup:** 16 students divided into 4 teams of 4. Teams 1 & 2 are **INTRINSIC**. Teams 3 & 4 are **EXTRINSIC**.
  2.  **The Core Constraint:** You are given a **Foundational Principle** (your Hard Core). You may *never* write a hypothesis that contradicts this principle. If you do, your team is disqualified.
      *   *Intrinsic:* "External conditions do not change decay rates."
      *   *Extrinsic:* "External conditions drive decay rates."
  3.  **The Loop (5 Rounds):**
      *   **Step A (Data):** You receive a sheet of observed data (CPM readings).
      *   **Step B (Adjustment):** You must write an **Auxiliary Clause** to explain the data. This clause must fit your Foundational Principle.
      *   **Step C (Scoring):**
          *   **Fit:** If your clause explains the *current* data logically, you get **1 Point**.
          *   **Novelty:** If your clause predicts a *future* result not yet seen, you mark it as a **Bold Prediction**.
      *   **Step D (Sealed Envelope):** In Rounds 1 and 3, you *must* place a Bold Prediction in a sealed envelope. This prediction must concern a variable *not* in the current data (e.g., "If we heat the sample, CPM will...").
      *   **Step E (Verification):** In later rounds, the Facilitator reveals the truth of past predictions.
          *   Correct Bold Prediction: **+5 Points**.
          *   Incorrect Bold Prediction: **-2 Points**.
          *   Post-diction (explaining old data): **+1 Point**.
  4.  **Winning:** The team with the highest score wins. However, the Facilitator will declare a "Winning Programme" based on which Foundational Principle proved more robust in the final round.

  ## 4. Round-by-Round Timeline (90 Minutes)

  | Time | Phase | Activity | Data / Event |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute teams, Core Principles, Scorecards. Explain rules. | No data yet. |
