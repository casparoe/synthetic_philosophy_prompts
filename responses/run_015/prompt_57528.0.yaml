  ## 6. The Debrief (Mapping Gameplay to Lakatos)
  *Do not use these terms during the game. Introduce them now.*

  1.  **The Hard Core:** Ask teams: *"Did anyone consider changing their Foundational Principle when the Spike happened?"*
      *   **Lakatos:** This is the **Hard Core**. It is protected by methodological fiat. To change it is to abandon the programme.
  2.  **The Protective Belt:** Ask: *"What did you write in the 'Auxiliary Hypothesis' column?"*
      *   **Lakatos:** This is the **Protective Belt**. You adjusted assumptions about instruments, impurities, or solar flares to absorb the anomaly.
  3.  **Negative Heuristic:** Ask Intrinsic teams: *"How did you explain the Spike without blaming external factors?"*
      *   **Lakatos:** This is the **Negative Heuristic**. It tells you where *not* to direct your fire (away from the core). You diverted the anomaly to the "instrument" or "impurity."
  4.  **Positive Heuristic:** Ask: *"How did you decide what prediction to make?"*
      *   **Lakatos:** This is the **Positive Heuristic**. A guide on how to develop the belt (e.g., "Look for impurities" vs. "Look for cosmic rays").
  5.  **Progressive vs. Degenerating:**
      *   **Theoretical Progress:** Did your new hypothesis explain *more* than the old one?
      *   **Empirical Progress:** Did you predict something **Novel** (Sealed Envelope)?
      *   **Degeneration:** If you only explained past data (Post-diction) without new predictions, your programme was degenerating.
      *   **The Lesson:** Programme Intrinsic looked worse in Round 2 (ignoring the spike), but won in Round 4/5 because their **Novel Predictions** (Pressure/Shielding) were corroborated. Programme Extrinsic explained everything but predicted nothing new. **Lakatos argues novelty matters more than accommodation.**

  ## 7. What Will Predictably Go Wrong (And How to Fix It)

  **1. The "Core Violation" Problem:**
  *   **Risk:** Students on the Intrinsic team will panic at the "Spike" and write "External heat caused the spike," violating their Core.
  *   **Fix:** Act as a strict referee. If they touch the Core, mark it as "Programme Death" (disqualification) or force them to rewrite. This dramatizes the *fiat* nature of the Hard Core.

  **2. Vague Predictions:**
  *   **Risk:** In the Sealed Envelope, teams write "The rate will change." This is unfalsifiable.
  *   **Fix:** Enforce a rule: Predictions must be quantitative or binary (e.g., "Rate will increase by >10%" or "Rate will stay within 1%").

  **3. Time Management:**
  *   **Risk:** 90 minutes is tight for 5 rounds. Students will talk too much in Round 1.
  *   **Fix:** Be ruthless. Use a visible timer. Cut Round 1 discussion short; they should agree quickly on a smooth curve. Save the drama for Round 2 (The Spike).

  **4. The "Right Answer" Bias:**
  *   **Risk:** Students treat this as a puzzle to find the "truth" rather than simulating research. They will try to guess *your* data.
  *   **Fix:** Remind them: *"You are not trying to guess my sheet. You are trying to maximize your points through theoretical consistency and novelty."*

  ## 8. What The Game Cannot Reproduce (The Gap)
  *You must explicitly state this in the final 5 minutes to prevent misunderstanding.*

  **1. The Nature of Anomalies:**
  *   **Game:** Anomalies are handouts given by a referee. They are undeniable.
  *   **Reality:** Anomalies are contested. Is the spike real data or a broken machine? In real science, half the battle is convincing the community the anomaly *exists*.
  *   **Debrief Note:** "In the game, I gave you the spike. In reality, the Intrinsic team might have just claimed the Geiger counter was broken and refused to publish the data. Lakatos assumes anomalies are accepted facts; history shows they are often fought over."

  **2. The Time Lag:**
  *   **Game:** Predictions are verified in 10 minutes.
  *   **Reality:** A bold conjecture (like the existence of the neutrino) might take 30 years to verify. The researcher might be dead.
  *   **Debrief Note:** "You got your points today. Pauli proposed the neutrino in 1930; it wasn't detected until 1956. A degenerating programme can limp along for a generation before the 'Novel Fact' arrives to save it. This makes Lakatos's criteria hard to apply in real-time."

  **3. Social & Financial Pressure:**
  *   **Game:** You have infinite paper and time.
  *   **Reality:** Funding agencies cut grants to "degenerating" programmes.
  *   **Debrief Note:** "If this were real, the Extrinsic team would have lost their grant after Round 2. Lakatos describes a rational reconstruction of science, not the sociology of how scientists actually survive."

  **4. The "Retrospective" Trap:**
  *   **Game:** You know I have a "True Data" sheet.
  *   **Reality:** There is no "True Data" sheet in the universe. We only have coherence.
  *   **Debrief Note:** "You judged the Intrinsic programme as 'Progressive' because I told you they were right in Round 5. But how do we know Round 5 isn't just another anomaly? Lakatos admits we only judge programmes historically, from the future. We are always in the middle of the story."
