answer: |-
  You stand before Box A containing $1,000 and Box B containing either $1,000,000 or $0. Twenty-four hours ago, a mechanism scanned your neurochemical profile; if Profile P was detected, $1,000,000 was transferred from accounts biometrically linked to your physiology into Box B, otherwise Box B remained empty. Profile P physically causes the behavior of taking only Box B in 90% of subjects, while absence of P physically causes the behavior of taking both boxes in 90% of subjects. You have no direct access to your profile, only the statistical correlation between Profile P and the action you are about to perform. Taking both boxes yields Box A plus whatever is in Box B; taking one box yields only Box B.

  **EDT Verdict: One-Box.**
  *Justification:* Evidential Decision Theory partitions states by the evidence the action provides about the common cause. Let $M$ be the state where $1,000,000 is in Box B. $P(M | \text{One-Box}) = 0.9$ and $P(M | \text{Two-Box}) = 0.1$.
  $EV(\text{One-Box}) = (0.9 \times \$1,000,000) + (0.1 \times \$0) = \$900,000$.
  $EV(\text{Two-Box}) = (0.1 \times \$1,001,000) + (0.9 \times \$1,000) = \$101,000$.
  Since $\$900,000 > \$101,000$, EDT prescribes taking only Box B.

  **CDT Verdict: Two-Box.**
  *Justification:* Causal Decision Theory partitions states by the causal past, which is fixed independent of the current choice. Let $P(M)$ be the prior probability of the money being present (independent of choice).
  $EV(\text{One-Box}) = P(M) \times \$1,000,000 + P(\neg M) \times \$0$.
  $EV(\text{Two-Box}) = P(M) \times \$1,001,000 + P(\neg M) \times \$1,000$.
  $EV(\text{Two-Box}) - EV(\text{One-Box}) = \$1,000$.
  Since the choice cannot causally influence the past transfer, CDT prescribes taking both boxes to secure the extra $1,000 regardless of the box content.

  **Feature Keeping Case Valid: The Constitutive Link.**
  *Justification:* The single feature keeping the case on the right side of both tests is that the common cause (Profile P) is constitutive of the agent's physiology rather than an external pathology. When you delete this feature and replace Profile P with a "Brain Lesion" (the Lesion Test swap), the theoretical verdicts remain unchanged (EDT still says One-Box, CDT still says Two-Box), but the *intuitive* verdict flips to align with CDT. In the lesion version, the correlation feels spurious because the cause is alien to the agent, making the EDT recommendation feel like magic; in the original profile version, the cause is *you*, making the EDT recommendation feel like rational self-consistency. Without this constitutive link, the case fails the Lesion Test by becoming a standard Smoking Lesion problem where intuition rejects One-Boxing.

  **Strongest CDT Attack: The Screening-Off Objection.**
  *Justification:* A causal decision theorist argues that your choice provides no *new* evidence once you account for the causal structure. Since you know the correlation is generated by a past common cause, your current action is screened off from the box content by the existence of that cause. By choosing, you are merely reading out a fact already determined; paying the $1,000 opportunity cost to "confirm" a fact you cannot change is irrational signaling, not rational decision-making. The attack claims EDT is double-counting the evidence by treating the symptom (choice) as if it were a lever.

  **Attack Status: Does Not Land.**
  *Justification:* The attack fails because the agent does not know the state of the common cause (Profile P), only the correlation. The choice *does* provide new evidence about the unobserved state of the agent's own physiology, which is directly linked to the payoff via the past transfer. While the choice doesn't *cause* the money, it is the only available indicator of whether the money exists. Ignoring this evidence (as CDT does) leads to systematically lower expected returns in this specific structural setup, confirming that the disagreement is genuine and not merely a framing error.
