answer: |-
  The question

  The Westmarsh Health Board ranks three funding packages, A, B, and C, on three scales: Q (total QALYs), S (severity-weighted priority), and F (fairness of spread). The scores are: A (Q=100, S=80, F=90), B (Q=90, S=100, F=80), and C (Q=80, S=90, F=100). The Board employs the Salience Rule: in any pairwise comparison, drop every dimension on which the two packages differ by less than 3 points; then rank by majority across the remaining dimensions, with Q breaking any tie. Worked through, this yields a cycle: A beats B, B beats C, and C beats A. The Board insists this rule does not merely detect an independent betterness relation; it constitutes what betterness *is* for packages like these.

  Consider also the 'Salience-Relative Betterness' view: this holds that 'better than' is a three-place relation (x is better than y relative to a context of salient respects), allegedly saving transitivity by treating apparent cycles as equivocation across contexts. Finally, consider a 'Ladder' case: 5,000 rungs, each barely noticeably better than the one below, yet the top is clearly better than the bottom.

  (a) Does the Westmarsh cycle demonstrate that betterness is intransitive, or only that the Board is a poor detector? Explain why this distinction matters given the Board's ontological claim. (6 marks)
  (b) Does relativising betterness to a context repair transitivity, given that majoritarian aggregation cycles even when dimensions and context are fixed? (6 marks)
  (c) Are the Ladder and Cycle cases the same argument in different clothes? (4 marks)
  (d) Conclude with a definitive verdict: Is 'better than' transitive? (4 marks)

  Model answer

  The Westmarsh case presents a forced choice between accepting intransitive betterness or rejecting the Board's constitutive claim. If the Board is correct that their rule constitutes betterness, then betterness is genuinely intransitive. However, this collapses the normative force of betterness. If A is better than B, B better than C, and C better than A, an agent preferring the better option is vulnerable to a money-pump: they would pay to switch from C to A, A to B, and B to C, ending where they started but poorer. Because rational choice presupposes transitivity to avoid such exploitation, the cycle is better understood as evidence that the Salience Rule is a defective detector, not that betterness itself is intransitive. The distinction matters because accepting the ontological claim abandons the guidance function of value theory; rejecting it preserves rationality but requires finding a superior metric.

  Regarding Salience-Relative Betterness, relativising the relation fails to rescue transitivity in this specific instance. The view suggests cycles arise from shifting contexts. Yet, the Westmarsh cycle occurs within a single, fixed context: the Board's decision procedure with fixed dimensions Q, S, and F. Majoritarian aggregation over multiple dimensions generates Condorcet cycles even when the set of respects is held constant. Unless 'context' is defined so narrowly that each pairwise comparison constitutes a unique context—which trivialises the relation by making betterness non-comparable across pairs—relativisation does not stop the cycling. The problem lies in the aggregation method, not the contextual scope.

  The Ladder and Cycle cases are structurally distinct arguments. The Ladder relies on a sorites structure: small, imperceptible differences accumulate to form a large, perceptible difference. It challenges transitivity via vagueness and the tolerance principle. The Cycle relies on multi-dimensional conflict: distinct values clash via majority rule. It challenges transitivity via aggregation paradoxes. The Ladder suggests 'better' might be vague; the Cycle suggests 'better' might be incomplete or cyclic when compounded. They are not the same argument in different clothes; one attacks the boundary conditions of value, the other the combination rules.

  Verdict: 'Better than' is transitive. The Westmarsh rule is procedurally flawed because it permits cycles that undermine rational agency. The Ladder case highlights vagueness in our epistemic access to value, not intransitivity in the value relation itself. We should reject the Board's constitutive claim and maintain transitivity as a requirement for normative coherence. Accepting intransitivity renders value incapable of guiding choice; therefore, apparent counterexamples must be diagnosed as errors in measurement or aggregation, not features of value.

  Marking scheme

  Markers should allocate twenty marks across five distinct criteria, awarding four marks for each. First, assess the handling of the ontological distinction. A full-mark response clearly separates the epistemic failure (poor detection) from the metaphysical claim (constitutive rule), explaining that accepting the Board's view makes intransitivity real. A 2:1 answer might identify the distinction but fail to explain why the Board's claim forces the intransitivity conclusion. Second, evaluate the discussion of normative stakes. Four marks require linking intransitivity to rational choice failures, specifically money-pumps or exploitation. Answers that mention irrationality without explaining the mechanism should cap at three marks.

  Third, critique the Salience-Relative Betterness view. To secure full marks, the student must note that cycling persists even within a fixed context due to majoritarian aggregation. A 2:1 answer often accepts the relativising move too readily, missing that the Westmarsh context is already fixed. Fourth, compare the Ladder and Cycle cases. Full marks demand identifying the structural difference: sorites/vagueness versus Condorcet/aggregation. Conflating the two limits the score to two marks. Finally, assess the verdict. Four marks require a clear 'yes' or 'no' supported by the preceding argument. A 'on the one hand' conclusion loses all marks here. A First-class answer (17+) will weave these points into a seamless argument, showing how the failure of SRB reinforces the need to reject the Board's ontology, whereas a 2:1 (14–16) will treat the sub-questions as isolated tasks.

  Typical howlers

  Students frequently lose marks by name-dropping philosophers not cited in the text, assuming markers reward recognition over argument. Another common error is conflating the Ladder and Cycle cases, treating both as simple sorites paradoxes without noting the multi-dimensional aggregation in Westmarsh. Many will accept the Salience-Relative view without checking whether the context is actually shifting in the example; failing to spot the fixed context is a critical analytical blind spot. Finally, avoid the 'philosophical shrug': answers that conclude transitivity is 'complicated' rather than delivering the demanded verdict will fail the final criterion entirely.
