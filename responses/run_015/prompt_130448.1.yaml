answer: |-
  Good evening, everyone. For those I haven't met, I worked with Mira for the last decade. And looking around this room, I see the two worlds she navigated best: the people who speak her code, and the people who know her heart.

  For twenty-five years, Mira built systems designed to remember. She built archives. But if you ask her what she's most proud of, she won't talk about the storage capacity. She'll talk about the deletion protocols. She always said that storing everything without a plan to erase is just as irresponsible as careless deletion.

  To her family and friends, that might sound cold. Why build a machine to destroy what you worked so hard to save? But to the engineers here, you know the truth. In distributed systems, forgetting isn't passive. Data doesn't just fade away; it has to be collected. It has to be marked.

  Mira taught us that "garbage collection" consumes resources. It takes processing power to decide what no longer serves the system. She used to joke about "tombstones"—the markers we leave behind to prove something was deleted safely. Even absence requires structure. Even letting go requires labor.

  I think that's the lesson she wants us to take into this next chapter. We often think of memory as the hard work and forgetting as the easy rest. We think remembering is a duty, and forgetting is a failure. But Mira's career proves the opposite. Responsible forgetting is an active, costly choice. It requires the courage to say, "This has served its purpose, and now it must pass."

  There is a moral weight to what we keep and what we release. Some philosophers argue we have a duty to remember everything. Others say societies need to forget to survive. Mira never read those books; she just built the infrastructure that reconciled them. She showed us that stewardship isn't about holding on forever. It's about knowing when the cost of keeping something outweighs the value of letting it go.

  So, to the team: may your retention schedules be wise. To the family: may you know that when Mira leaves work behind, she isn't erasing her legacy. She's just finally running the garbage collection on her own time.

  Mira, you built the tools to let go safely. Now it's your turn to use them. Thank you for teaching us that making space for the future is the hardest, most necessary work of all.

  To Mira.
