answer: |-
  1

  The ledger was closed before the sun went down.
  She counted the coal, the sugar, the cents,
  not because she loved the iron in the safe,
  but because the winter was always coming.
  To spend was to weaken the wall.
  She taught us to measure the **cost**.

  2

  She laughed at the **cost**.
  A month's pension burned on a platform ticket,
  cash in hand for the conductor,
  because seeing us was the only currency that held.
  If you have love, spend it now.
  She taught us not to **wait**.

  3

  When the fences broke between yards,
  she asked us to **wait**.
  She poured tea until the anger cooled,
  she was the water between the stones,
  smoothing the edge so the wall would stand.
  She refused to choose a **side**.

  4

  She always chose a **side**.
  The side of the truth, even when it bruised.
  She sparked the fire so we could see what would burn,
  hating the silence of unspoken things.
  She taught us to want what was **real**.

  5

  The **real**...

  In some respects, is.
  In some respects, is not.
  In some respects, is and is not.

  The word breaks
  against the thing.
  The hand opens.
  Nothing falls out.
  Everything remains.
