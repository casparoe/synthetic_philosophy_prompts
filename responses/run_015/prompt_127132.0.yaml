  I'm presenting the view that Newton's anti-Trinitarianism was structurally integrated with his natural philosophy, not a compartmentalized private eccentricity. The core claim is that his theological rejection of a created mediator parallels his physical insistence on direct divine action without intermediate instruments, both rooted in a metaphysics of divine simplicity and omnipresence. The audience is a history-of-science colloquium: mostly senior historians of early modern science and philosophers of religion who treat science and theology as separate domains; a few accept integrationist readings but worry about anachronism; none are theologians. Draft my Q&A prep sheet: list the objections in roughly the order they'll arise and do damage, each phrased as these historians and philosophers would phrase it — including the compartmentalization charge, the anachronism worry about labeling him Arian or Socinian, the demand for explicit traces in the Principia or Opticks rather than manuscript theology, the biographical-reductionist counter that secrecy proves peripherality, and the methodological objection that I'm collapsing biography into philosophy of science. For each, give a two-minute reply and flag where it is weakest. Then include the question I'm hoping nobody asks — specifically, how I reconcile direct divine action with Newton's own appeals to active principles in the Queries appended to the Opticks and with his remarks in the Bentley correspondence that seem to invoke God as an immediate cause of gravity — with the reply I should give and an honest note on where that reply fails.
