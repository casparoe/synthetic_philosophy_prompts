answer: |-
  This protocol minimizes future retcon debt by quantifying emotional fallout, forcing a selfish choice for the letter burning and deferring the vanishing act to your intuition.

  ### The Narrative Coherence Tax Procedure

  **Step 1: Canon Consistency (Stop Point)**
  *   **Question:** Does this explanation contradict established physical facts or timeline constraints from previous volumes?
  *   **Rule:** If yes, **STOP** and discard the option. No amount of emotional coherence fixes broken physics.
  *   **Rule:** If no, proceed to Step 2.

  **Step 2: Explanatory Power (Stop Point)**
  *   **Question:** Does this explanation account for the specific weird choice better than random chance?
  *   **Rule:** If the explanation requires more new assumptions than the plot hole itself, **STOP** and discard.
  *   **Rule:** If it simplifies the motive, proceed to Step 3.

  **Step 3: Calculate Narrative Coherence Tax (NCT)**
  *   **Formula:** For every *other* character affected by this backstory, multiply **Visibility (1–5)** by **Emotional Loose Ends (1–5)**. Sum the totals.
      *   *Visibility:* 1 (Mentioned only) to 5 (POV Character/Main Cast).
      *   *Loose Ends:* 1 (Minor confusion) to 5 (Unresolved betrayal/trauma requiring future screen time).
  *   **Action:** Calculate NCT for each remaining option.
  *   **Rule:** The option with the lowest NCT is the mathematically preferred choice.

  **Step 4: The Threshold Check (Stop Point)**
  *   **Question:** Is the lowest NCT score greater than 15?
  *   **Rule:** If yes, **STOP**. The explanation creates too much debt; you must rewrite the original plot hole instead of explaining it.
  *   **Rule:** If no, proceed to Step 5.

  **Step 5: Value Judgment (Values, Not Rules)**
  *   **Question:** Does the lowest-NCT option violate the thematic core or character arc you *want*, even if it fits the math?
  *   **Flag:** This is purely artistic values. The procedure cannot answer this.
  *   **Action:** If you reject the low-NCT option for thematic reasons, choose the next lowest score. If scores are within 3 points of each other, proceed to Step 6.

  **Step 6: Artistic Gut (Procedure Gives Up)**
  *   **Condition:** If options are tied within 3 points OR Step 5 creates a conflict between math and theme.
  *   **Flag:** The procedure yields here. Choose based on which story excites you more to write.

  ***

  ### Application 1: Why the Protagonist Burned the Letter

  **Options:** Shame, Protecting Recipient, Hiding Alliance.
  **Context:** Recipient is a main cast member (Visibility 5). Protagonist is POV (Visibility 5, but not taxed). Ally is dead (Visibility 1). Confidant is recurring (Visibility 3).

  1.  **Canon Check:** All three pass.
  2.  **Explanatory Power:** All three pass.
  3.  **NCT Calculation:**
      *   **Protecting Recipient:** Recipient remains unaware until later. Creates "Why didn't you trust me?" trauma.
          *   Recipient (Vis 5 × Ends 4) = **20**.
      *   **Shame:** Protagonist confesses to Confidant later. Creates "Why hide this?" friction.
          *   Confidant (Vis 3 × Ends 3) = **9**.
      *   **Hiding Alliance:** Ally is dead (no loose ends). Recipient assumes negligence (minor confusion).
          *   Recipient (Vis 5 × Ends 1) = **5**.
  4.  **Threshold:** All under 15 except Protecting. Discard "Protecting."
  5.  **Value Judgment:** "Hiding Alliance" (5) beats "Shame" (9).
      *   **Counter-Intuitive Pick:** The procedure selects **Hiding Alliance**.
      *   **Why You Might Dislike It:** This makes the protagonist secretive and politically motivated rather than vulnerable (Shame) or noble (Protecting). It lowers emotional resonance for the sake of logistical cleanliness.
  6.  **Final Decision:** **Hiding Alliance** (unless you value heroism over coherence, then invoke Step 5).

  ***

  ### Application 2: Why the Side Character Vanished for Ten Years

  **Options:** Prison, Secret Identity, Grief Flight.
  **Context:** Character returns now. Mentor is visible (Visibility 4). Family is mentioned (Visibility 2). Protagonist is POV (Visibility 5).

  1.  **Canon Check:** All three pass.
  2.  **Explanatory Power:** All three pass.
  3.  **NCT Calculation:**
      *   **Prison:** Family feels abandoned. Mentor feels failed.
          *   Family (Vis 2 × Ends 3) + Mentor (Vis 4 × Ends 2) = 6 + 8 = **14**.
      *   **Secret Identity:** Mentor feels lied to. Family confused.
          *   Family (Vis 2 × Ends 2) + Mentor (Vis 4 × Ends 3) = 4 + 12 = **16**.
      *   **Grief Flight:** Internal motive. Family feels abandoned. Mentor worries.
          *   Family (Vis 2 × Ends 3) + Mentor (Vis 4 × Ends 2) = 6 + 8 = **14**.
  4.  **Threshold:** All pass (barely).
  5.  **Value Judgment:** "Prison" and "Grief Flight" are tied at 14.
      *   **Flag:** The procedure cannot settle this. Prison implies crime; Grief implies trauma. This is a tonal choice, not a coherence one.
  6.  **Final Decision:** **Artistic Gut Required.** Choose based on whether you need the character hardened (Prison) or broken (Grief).

  ***

  ### Where The Procedure Gives Up

  1.  **Thematic Integrity:** The NCT favors logistical cleanliness over emotional depth. It will often recommend making characters colder or more secretive because internal turmoil creates fewer "loose ends" in *other* characters than interpersonal conflict does.
  2.  **Ties Within Margin:** When NCT scores are within 3 points, the mathematical advantage is negligible. The procedure explicitly flags this as a "Gut" decision to prevent you from optimizing away your creativity.
  3.  **Original Sin:** If all options exceed the NCT threshold of 15, the procedure forces you to admit the original plot hole was too expensive to keep; it cannot fix a foundation that is already cracked.
