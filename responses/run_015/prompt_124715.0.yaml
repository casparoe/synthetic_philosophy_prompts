prompt: |-
  I'm a novelist writing a multivolume series where each book retroactively explains one weird choice from earlier volumes. I need a reusable decision procedre—checklist style, with clear stop points—based on inference to the best explanation but with a niche twist I'm calling the narrative coherence tax: multiply the number of emotional loose ends a backstory leaves in other characters by how visible those characters remain later in the story. For each draft explanantion, I want the ordered questions, what counts as enough to kill it, where the call is pure values and not rules, and where the procedre just gives up and says "this needs your artistic gut." Apply it to two plot holes: why the protagonist burned a letter (options are shame, protecting the recipient, or hiding an alliance) and why a side character vanished for ten years (prison, secret identity, or grief flight). Include at least one case where the procedre picks an option you'll think I won't like, and flag exactly what the procedre can't settle. Give me the bottom line in sentence one, then reasoning—no preamble, don't echo my question back. No citations or reading lists; I just need something I can run in twenty minutes without searching. Sorry if there's a typo or two in this.
