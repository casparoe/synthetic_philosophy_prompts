      *   **Synchronous vs. Diachronic Reduction:** This is the crux.
          *   *Synchronous:* Trying to map "broadcasting" to a single neuron firing *now*. Fails. Looks like magic.
          *   *Diachronic:* Tracing how the capacity for broadcasting was built by simpler competitive mechanisms over time. The "top-down" effect is actually the *momentum* of the bottom-up construction.
      *   **Addressing the "Pushing the Mystery Back" Objection:** Roommate will say: "Okay, but how did the first crane start? You haven't explained consciousness, just moved it to evolution."
          *   *Counter:* It's not moving the mystery; it's dissolving it. Consciousness isn't a *thing* that appears; it's a *process* that accumulates. There is no "first moment" of consciousness, just increasing degrees of integration.
      *   **Distinguishing from Emergentism:** Standard emergentism often implies ontological novelty (the whole is *more* than the sum of parts in a metaphysical sense).
          *   *Counter:* The "Stacked Crane" view is still materialist/reductionist. The "emergence" is purely functional/organizational, not ontological. The "downward causation" is just feedback loops established during the diachronic build.
      *   **Conclusion:** Summarize. The skyhook is a snapshot illusion. The crane is the movie.

  4.  **Refining the Tone:**
