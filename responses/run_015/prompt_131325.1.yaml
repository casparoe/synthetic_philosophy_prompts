prompt: |-
  hey so im in this philosophy of mind seminar and we got into a huge argument about cranes and skyhooks after the prof mentioned greedy reductionism in passing. my roommate insists consciousness is obviously a skyhook because global workspace theory needs top-down integration that biology alone cant build bottom-up, and i think thats wrong but i cant quite articulate why. can you make the argument that what looks like a skyhook in consciousness—like global workspace broadcasting—is actually just a 'stacked crane' where each neural layer is fully reducible but the temporal stacking over development creates an illusion of downward causation?

  specifically i want you to defend the view that greedy reductionism only fails because people try reduction synchronically (all levels at once) instead of diachronically (tracking how lower levels build the scaffold over evolutionary and developmental time). address the objection that this just pushes the mystery back a step, and explain why it doesnt collapse into standard emergentism. im not asking for a bibliography or citations, just the argument itself. also sorry if this is wordy, im writing this on my phone between classes and probably missed a comma or two.
