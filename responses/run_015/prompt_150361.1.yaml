answer: |-
  This is a high-quality debate that recapitulates a central tension in political philosophy and social ontology. You and your friends have essentially recreated the famous intellectual rupture between Karl Jaspers and Hannah Arendt regarding the aftermath of WWII.

  There is no single canonical proper noun for this exact tension (like "The Gettier Problem"), but in academic literature, it is referred to as the **Problem of Diachronic Collective Responsibility** within the broader debate of **Methodological Individualism vs. Holism**.

  Here is the move-by-move adjudication, analyzing where each friend is philosophically robust and where they are category-erroring.

  ### Move 1: A's Opening (Diachronic Institutional Guilt)
  **Claim:** Institutions persist over time; therefore, the "wrong-state" persists. Citizens bear this via participation, not inheritance.
  *   **What A gets right:** A is correctly identifying **legal and political continuity**. In international law and political theory, states are treated as continuous agents despite changes in population or regime (the "King's two bodies" logic). If a state signs a treaty or incurs a debt, the successor population inherits the obligation. A is also correctly citing Jaspers' specific definition of *Political Guilt*, which Jaspers explicitly distinguished from *Moral Guilt*.
  *   **What A gets wrong:** A is conflating **obligation** with **guilt**. While an institution can inherit debt or liability, "guilt" implies a moral breach that typically requires a mind to comprehend the breach. By calling it "guilt" rather than "liability," A invites the psychological baggage B attacks.
  *   **Verdict:** **Conceptually sound on political ontology, semantically risky.**

  ### Move 2: B's Rebuttal (Guilt is First-Person/Affective)
  **Claim:** Guilt requires agency and affect. Calling it guilt is rhetorical manipulation (collective punishment).
  *   **What B gets right:** B is defending **Methodological Individualism**, the view that only individuals can be moral agents. B correctly identifies that "guilt" in moral psychology requires the capacity to have done otherwise (control condition) and usually involves a phenomenological state (feeling bad). B is also right to flag the danger of **collective punishment**, which violates liberal individualist norms.
  *   **What B gets wrong:** B dismisses **collective intentionality** too easily. We legally and socially accept that corporations, states, and universities can be "guilty" of negligence or fraud without a single individual feeling the affect. If a corporation dumps toxic waste due to policy (not a specific rogue actor), we say the *corporation* is guilty, not just the CEO. B's insistence on affect ignores the reality of structural harm.
  *   **Verdict:** **Morally protective, but ontologically narrow.**

  ### Move 3: A's Counter (Objective Guilt & Participation)
  **Claim:** Guilt can be objective (being in the wrong) without affect. Citizens participate in the structure that owes repair.
  *   **What A gets right:** A makes a crucial distinction between **Guilt and Shame**. Shame is about who you *are* (identity); guilt is about what you *did* (or benefit from). A is also aligning with **Complicity Theory** (e.g., Christopher Kutz): you can be accountable for harms you didn't personally commit if you voluntarily participate in the cooperative structure that produced them.
  *   **What A gets wrong:** "Objective guilt" is a slippery term. If there is no agent to *hold* the guilt, it dissolves into "unresolved harm." A risks turning guilt into a free-floating spiritual pollutant rather than a relational status between agent and victim.
  *   **Verdict:** **Strong on complicity, weak on the definition of guilt.**

  ### Move 4: B's Pushback (Reification & Remedy vs. Status)
  **Claim:** "Owes reparations" (liability) is not "Is guilty" (moral status). Treating the state as having a moral biography is reification.
  *   **What B gets right:** This is B's strongest move. The distinction between **Remedial Responsibility** (fixing the mess) and **Blame Responsibility** (being at fault) is critical. You can be responsible for cleaning up a spill you didn't make (liability) without being guilty of making it. B correctly identifies that A is committing a mild **reification fallacy** by treating the "State" as a moral patient capable of bearing sin.
  *   **What B gets wrong:** The *reductio ad absurdum* regarding the family is weak. Families lack the public, legal, and institutional continuity that states possess. States have constitutions, treasuries, and borders that persist diachronically; families do not. This disanalogy weakens B's "slippery slope" argument.
  *   **Verdict:** **Philosophically precise on liability vs. blame, but overextends the reification charge.**

  ### Move 5: A's Close (Conditions & Corporate Precedent)
  **Claim:** Conditions (continuity, benefit) block the reductio. Corporate liability proves groups can be agents.
  *   **What A gets right:** A appeals to **Corporate Moral Agency**, a widely accepted position in business ethics and law. If we accept a corporation can be guilty of manslaughter, we must accept groups can hold moral status. The conditions (benefit, continuity) are standard in **Intergenerational Justice** theory (e.g., Janna Thompson).
  *   **What A gets wrong:** Even if a *corporation* can be guilty, does that guilt transfer to the *shareholders* (citizens)? A asserts yes via participation, but doesn't fully explain why a passive citizen bears the *guilt* rather than just the *tax burden* of reparations.
  *   **Verdict:** **Strongest empirical argument, but still bridges the gap with assertion.**

  ---

  ### The Adjudication

  **Who is right?**
  They are both right about different categories, but they are using the word "Guilt" to do two different jobs.

  *   **Friend B is right about Moral Guilt.** If we are talking about *moral* guilt (the kind that stains the soul or warrants blame), B wins. Moral guilt is non-transferable. You cannot be morally culpable for an act you could not prevent. To claim otherwise is indeed dangerous rhetoric that leads to collective punishment.
  *   **Friend A is right about Political Liability.** If we are talking about *political* guilt (Jaspers' specific category), A wins. This is not about moral stain; it is about the obligation of citizens to repair the harms done in their name by the structure that empowers them.

  **The Missing Piece:**
  They are both missing the specific intervention of **Hannah Arendt**. Arendt was Jaspers' student and friend, and she broke with him over this exact point.
  *   Arendt argued: **"There is no such thing as collective guilt or collective innocence."**
  *   She agreed with A that there is **Collective Responsibility**. We are responsible for what our government does because we are members of the polity.
  *   She agreed with B that **Guilt is Individual**. Only the specific perpetrators are guilty.
  *   **The Synthesis:** You can have *collective responsibility* (A's point about obligation/repair) without *collective guilt* (B's point about moral stain). A is trying to force "responsibility" into the box of "guilt," and B is trying to smash the box of "responsibility" because it's labeled "guilt."

  ### The Name of the Tension

  There is no single canonical phrase like "The [Name] Paradox" for this exact tension. However, in philosophy, this is the core debate of **Social Ontology regarding Diachronic Group Agency**.

  If you want to reference the specific historical lineage of this argument, it is the **Arendt-Jaspers Dispute on Collective Responsibility**.

  If you want the technical term for B's objection to A, it is the **Problem of Non-Identity** applied to moral agency (how can an agent be guilty for acts before they existed?), though strictly speaking, the Non-Identity Problem (Parfit) is about harm to future people, not guilt for past acts.

  The most accurate label for the gap they are fighting over is the **Liability-Culpability Gap in Collective Agents**.

  ### Final Recommendation for the Meetup

  Tell them they have reached a **verbal dispute masking a substantive agreement**.

  1.  **Grant B the terminology:** Admit that "Guilt" is the wrong word for what A is describing. It creates unnecessary confusion with moral blame. Use **"Political Responsibility"** or **"Structural Liability"** instead.
  2.  **Grant A the ontology:** Admit that B's individualism is too strict for political reality. States *do* persist, and citizens *do* inherit obligations (debts, treaties, reparations) even if they don't inherit "sin."
  3.  **The Resolution:** A nation cannot be *morally guilty* (B is right), but a nation can be *politically liable* (A is right). The moment you call liability "guilt," you risk the moralization of politics that B fears. The moment you deny liability because individuals didn't act, you risk the atomization of society that A fears.

  **Winner:** **Draw.** But B wins on semantics (don't call it guilt), and A wins on political theory (the obligations exist regardless).
