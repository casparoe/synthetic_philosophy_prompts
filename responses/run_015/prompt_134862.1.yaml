answer: |-
  **Outline of Central Tension**
  The core conflict lies between the *institutional persistence* of a role (the bureaucratic record that says Lin is a daughter) and the *ethical emptiness* of that role without a living counterpart. Confucian ethics suggests self-cultivation happens *through* specific relationships. If the relationship is technically active but ontologically void, does performing the ritual (*li*) cultivate virtue (*ren*), or does it starve the living relationships that actually need care? Lin must choose between satisfying the algorithmic ancestor (ghost role) or her living brother (living role), knowing that *shu* (reciprocity) is impossible with the dead, yet the system demands it anyway.

  ***

  **The Ghost Knot**

  The notification chimed at 7:03 PM, sharp and polite. *Filial Obligation Cycle Due.*

  Lin stared at the hologram hovering over her takeout containers. The Harmony System didn't care that her mother had been dead for four years. It didn't care that the death certificate had been filed, just that the dissolution paperwork had gotten stuck in a legacy loop somewhere in the provincial server. So, legally and ritually, Lin was still a daughter. A knot in the web, tied tight on her end, fraying into nothing on the other.

  She rubbed her temples. Being a "role mediator" meant she spent all day untangling other people's bureaucratic snarls, but her own life was a mess of phantom limbs.

  She stood up and walked to the small altar shelf. It wasn't religious, not really. It was compliance. But tonight, she felt the weight of it. *Li*—ritual propriety—was supposed to grease the social machine. It was supposed to show respect. But who was she respecting? A memory? A database entry?

  She lit the incense stick. The smoke curled up, grey against the white wall.

  "Mom," she said. Her voice felt too loud in the empty apartment. "I bought the oranges you liked."

  She placed them on the shelf. This was the hard part. *Shu*. Reciprocity. Putting yourself in the other's place. Usually, *shu* was a negotiation. You give, I take, we adjust. But here, she had to imagine the taking. She had to pretend the oranges were received. She had to simulate a response to keep her own moral compass calibrated. If she stopped pretending, was she still a daughter? Or just a woman alone in a room wasting fruit?

  Her pocket buzzed. It was Wei, her younger brother. Living. Breathing. Currently failing his chemistry midterms.

  *Hey,* the text read. *Can you talk? I think I messed up.*

  Lin looked at the oranges. The System required the ritual to be completed within the hour to avoid a penalty on her social credit. A small penalty, but it stacked. Then she looked at the phone. Wei needed her. Not as a citizen, but as an elder sister. That role didn't have a timer, but it had a weight that was much heavier.

  If she answered Wei, she'd miss the window. The System would flag her as "negligent." If she finished the ritual, Wei might think she was ignoring him.

  In the classics, *ren* (humaneness) was the root. You couldn't have virtue without caring for people. But the System treated the roles as equal. A ghost parent weighed the same as a living brother.

  She typed back: *Give me 20 mins.*

  She turned back to the altar. She bowed. Twice. The protocol said three, but she couldn't make herself do the third one. It felt like a lie. She bowed to the empty air, trying to push her care into the void, hoping some of it would stick to the memory of the woman who raised her. It felt like pouring water into a sieve. She was spending her limited supply of *ren* on a black hole.

  When she finished, the System chimed green. *Obligation Met.*

  She called Wei back. He sounded shaky, talking about the exam, about how he couldn't focus. Lin listened, trying to summon the energy she'd just burned on the oranges. She offered advice, she soothed, she practiced *shu* with a real person who could answer back.

  But halfway through the call, she realized her voice was flat. She had given the best part of her attention to the dead because the machine demanded it. The living got the leftovers.

  "Thanks, Lin," Wei said. "You're the best."

  "Yeah," she said, looking at the rotting oranges on the shelf. "Sure."

  She hung up and considered the hack. She knew a guy in IT who could wipe the parent ID. Dissolve the knot. She'd be free. No more oranges. No more bowing to dust.

  But if she cut the knot, who was she? The System defined her by her connections. If she deleted the dead, did she become less of a person? Or did she finally become whole enough to actually help the living?

  Lin sat down at the table and opened her cold takeout. She'd decide tomorrow. For tonight, the ghost was fed, and her brother was safe, and she was just tired. A typo in the universe, persisting becuase the delete key was stuck.
