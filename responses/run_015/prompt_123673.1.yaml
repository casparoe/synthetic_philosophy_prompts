answer: |-
  The neon sign in the window buzzed like a dying insect, casting a sickly red glow over the sticky tabletop. Mark swirled the ice in his whiskey, watching the meltwater dilute the amber. Across from him, Elena nursed a glass of wine that cost more than the beer on tap but looked just as sad under the bar lights.

  They hadn't seen each other in five years. Mark wore a Patagonia vest; Elena wore a blazer with elbow patches that were ironically worn through.

  "It's a syntax error," Mark said, setting the glass down. "That's all the *Cogito* is. A linguistic glitch we've been worshipping for four hundred years."

  Elena smiled, tired but sharp. "Here we go. I forgot you turned into a parser."

  "I'm saying look at the text, El. Strictly. *Cogito, ergo sum*. Or even just *Sum, res cogitans*. Descartes wants you to think he's found a substance. A *thing*. But all he actually caught was an event." Mark tapped the table. "A flash. 'Thinking is happening.' That's it. There is no 'I' that persists from the first syllable of *cogito* to the last. There's just the occurrence."

  "That's Lichtenberg," Elena said, taking a sip. "And it's lazy. You're treating the *Meditations* like a codebase. It's not. It's an exercise in attention."

  "It's an argument. And the inference is invalid. You can't get a noun from a verb without smuggling in a premise. 'Thinking is occurring, therefore *I* am.' Who is the *I*? If the *I* is just the thinking, then when the thought stops, the *I* ceases to exist. So you don't have a soul. You don't have a mind. You have a strobe light. Flash, flash, flash. No diachronic extension."

  Elena leaned forward, resting her elbows on the condensation ring. "Okay. Let's grant you the flash. Let's say the self is instantaneous. But Mark, think about what the flash *is*. It's doubt. It's the Evil Demon scenario. To be deceived, or to doubt, you have to hold a proposition in mind. You have to entertain the possibility that you don't exist."

  "Sure."

  "That takes time," she said. "Even if it's a micro-second. There is a duration to the act of doubting. If the 'I' vanished between the premise and the conclusion, the synthesis wouldn't happen. The intuition wouldn't land. For the *Cogito* to work, there has to be a unity of apperception that spans the duration of the intuition. You need a substrate that endures long enough to recognize itself as the thing doing the thinking."

  Mark shook his head. "That's just grammar conditioning you. You hear 'thinking,' you assume 'thinker.' Like lightning. We say 'lightning flashes,' but there isn't a 'lightner' behind the flash. There's just the discharge. Descartes gets away with it because Latin grammar demands a subject. But ontologically? You've got unowned mental events floating in the void. And if that's true, his whole project collapses. Because later he needs this *Res Cogitans* to be simple, indivisible, immortal. You can't get immortality out of a strobe light."

  "I'm not arguing for immortality yet, I'm arguing for existence," Elena countered. "And you're ignoring the Second Meditation. He strips away the body. He strips away the senses. What's left? If there's no substrate, what is the doubt attaching to? If there's no owner, then the Evil Demon isn't deceiving *me*, he's just... generating thoughts in a vacuum. But the certainty of the *Cogito* comes from the *first-personal givenness* of the experience. It's not 'thinking is occurring.' It's '*I* am being deceived.' That mineness is immediate. It's not inferred."

  "It's felt," Mark corrected. "Feelings aren't metaphysics. Just because the thought comes tagged with a sense of ownership doesn't mean there *is* an owner. It just means the thought has a specific qualitative character. Call it 'self-referential processing.' But don't call it a substance. Because if it's a substance, Descartes has to explain how it interacts with the body later. If it's just a flash, a process, you don't have the interaction problem. You just have a system running."

  Elena laughed, a short, dry sound. "You sound like a functionalist. Since when do you care about saving Descartes from the interaction problem?"

  "I care about not lying. If you claim the *Cogito* proves a thinking *thing*, you're claiming you've found bedrock. But if I'm right, you've only found a spark. And you can't build a cathedral on a spark. Specifically, look at the Wax Argument. He needs the mind to be better known than the body because the mind is a unified perceiver. If the mind is just a series of discrete flashes, how does it perceive the wax changing over time? It can't. A flash has no temporal thickness. It can't compare 'now' to 'then.' So the *Res Cogitans* fails."

  Elena paused. She traced the rim of her glass. "Okay. That's... actually a decent hit. The temporal synthesis is the weak point."

  Mark smirked. "Finally."

  "But," she raised a finger, "Descartes knows this. That's why he moves to God so fast. He needs to guarantee that his memory holds, that the duration is real. But before God? Just in the *Cogito* moment? You're saying the 'I' is a point-instant."

  "Exactly."

  "Then tell me this," Elena said, her voice dropping. "If the 'I' is a point-instant, who is responsible for the doubt? Descartes isn't just describing psychology; he's performing an act of will. *Volition*. To withhold assent. To decide not to believe the senses. That's an act of freedom. A flash doesn't choose. A process doesn't decide. Only an agent does. If you reduce the self to a series of events, you lose the will. And if you lose the will, you lose the doubt. And if you lose the doubt, the Demon wins."

  Mark stopped swirling his ice. The bar noise seemed to rush back in—the clink of bottles, the low murmur of a couple in the corner.

  "Will," Mark said slowly. "He treats the will as infinite. That's always been the weirdest part."

  "It's the necessary part," Elena pressed. "If the self is just a flash, it's determined by the previous flash. Cause and effect. But the *Cogito* requires a break in the chain. A radical suspension of judgment. That suspension implies a holder of the suspension. Something that can stand back from the thought and say, 'I am not sure about this.' You can't stand back from a thought if you *are* just the thought."

  Mark looked into his whiskey. "So you're saying the distance between the thought and the awareness of the thought *is* the substance."

  "I'm saying that distance is the only thing that saves us from being puppets," Elena said. "If you're right, Mark, if it's just flashes... then Descartes never actually escapes the Demon. He just becomes a series of thoughts the Demon is having. There's no one home to be saved."

  Mark sighed, rubbing his face. "I hate it when you do that. Make the metaphysics about the stakes."

  "It's the *Meditations*. It's all stakes. It's about not going insane." Elena sat back, loosening her grip on the wine glass. "Look, I get the appeal of the flash. It's clean. It fits your world. Inputs, outputs, no ghost in the machine. But Descartes isn't building a machine. He's trying to find a place to stand where the ground doesn't dissolve. A flash doesn't hold weight. A substrate does."

  "A substrate you can't prove," Mark muttered.

  "No," Elena agreed. "One you have to *be*. You can't prove it from the outside. You only know it because you're doing it."

  Mark signaled the bartender for the check. "So we're at an impasse. I think he's proving too much. You think he's proving exactly enough."

  "I think," Elena said, pulling her coat on, "that you've been working with logic gates too long. You think truth is binary. Descartes thinks truth is a vision. You can't parse a vision, Mark. You just have to see it."

  "And if you're blind?"

  "Then you write code," she said, standing up. "And I'll grade the papers."

  Mark laughed, dropping cash on the table. "Same time next decade?"

  "Sure," Elena said. "But next time, we're arguing about Spinoza. I hear he has opinions on flashes."

  "God or Nature," Mark said, opening the door to the cold street. "Same difference."

  "Keep telling yourself that."

  They stepped out into the night, the argument unresolved, the bar's red neon fading behind them like a dying star.
