answer: |-
  Here are eight questions designed for a 40-minute technical interview, structured to press the specific pressure points you identified without wasting time on setup.

  ### Q1: The Restriction on Deference
  **Question:** Standard counterexamples to Reflection involve knowing in advance that your future self will be epistemically impaired—via drugs, brainwashing, or even just reading a biased dossier. You've likely argued that Reflection only constrains deference to future selves you regard as *better* informed. But if you build "epistemic improvement" into the antecedent, doesn't the principle risk becoming vacuous? How do you state that restriction formally without simply stipulating "cases where Conditionalization holds"?

  *   **Follow-up (Likely Answer: She appeals to a partition condition or "no loss of information" clause):** If the restriction relies on not losing information or having a specific evidence partition, does that mean Reflection fails to be the *more basic* norm? It looks like you're deriving Reflection from a prior assumption about what counts as legitimate learning, which is usually cashed out via Conditionalization.
  *   **Follow-up (If she declines to bite/argues it's not vacuous):** Can you give me a case where the restriction applies, Reflection holds, but Conditionalization *fails*? If not, isn't Reflection just a redescription of Conditionalization for ideal agents?

  > **Vulnerability Note (Q1):**
  > *   **Where this might die:** She may distinguish between *Reflection* (the general norm) and *New Reflection* (which handles the restriction). Her "good answer" is to point out that Reflection is a norm on *rational* belief change, and impaired cases are simply instances of irrational change where the norm doesn't apply. This isn't a dodge; it's the standard defense.
  > *   **Hidden Assumption:** You are assuming the restriction must be stated in terms of *information*. She might argue it's stated in terms of *rationality* itself (i.e., "defer to your future self *qua* rational agent"). If she goes this route, press on whether we can identify the rational agent without already knowing the updating rule.

  ### Q2: Deriving Conditionalization
  **Question:** Let's grant the restriction for a moment. The big claim in your paper is that Conditionalization falls out of Reflection. But if Reflection is restricted to cases where we don't expect epistemic impairment, doesn't that limit the derivation? Specifically, in ordinary learning, I often know I'm going to forget things or get tired. If Reflection doesn't constrain those cases, does Conditionalization still fall out as a general requirement, or only for idealized, forgetful-free agents?

  *   **Follow-up (Likely Answer: Conditionalization is only required for ideal agents):** If Conditionalization is only a requirement for ideal agents, but Reflection is supposed to be the fundamental norm of rationality, aren't we left with a gap for non-ideal agents? Why should a non-ideal agent care about a norm (Reflection) that only yields a derivative norm (Conditionalization) in cases they never inhabit?
  *   **Follow-up (If she argues it applies generally):** How do you handle the "sleeping beauty" style forgetting cases within that derivation? If Reflection yields Conditionalization, and Conditionalization fails in forgetting cases, does Reflection fail there too?

  ### Q3: The Formulation Worry (Pointwise vs. Expectation)
  **Question:** There's a technical worry about the standard formulation: conditioning on your future credence being *exactly* $r$ often means conditioning on a proposition you currently assign probability zero. The weaker "expectation" version ($E_t[C_{t+1}(P)] = C_t(P)$) dodges this, but it's less constraining. Does your Dutch Book argument require the pointwise version?

  *   **Follow-up (Likely Answer: The expectation version is sufficient for the Dutch Book):** If the expectation version is sufficient, does it carry the same normative weight? The pointwise version feels like a constraint on specific credal states; the expectation version feels like a constraint on averages. If I violate the pointwise version but satisfy the expectation version, am I irrational?
  *   **Follow-up (If she insists on Pointwise):** How do you handle the measure-zero problem without invoking conditional densities or hyperreals? Are you committed to a specific metaphysics of credence where assigning 0 to a possible future credence is itself irrational?

  ### Q4: Plans vs. States
  **Question:** The diachronic Dutch Book argument seems to exploit the *plan* you endorse now for updating later, rather than the credences you actually hold later. If I involuntarily shift my credence due to fatigue, the bookie can't exploit a plan I didn't endorse. Does this mean Reflection is fundamentally a norm on *updating plans*, not on *credal states*?

  *   **Follow-up (Likely Answer: Yes, it's a norm on plans/policies):** If it's a norm on plans, how do you handle cases where I intend to Conditionalize but fail due to weakness of will or cognitive noise? Is the violation of Reflection located at $t_1$ (the bad plan) or $t_2$ (the bad execution)?
  *   **Follow-up (If she argues it's about states):** If it's a norm on states, what is the Dutch Book argument actually showing? A pragmatic inconsistency between states at different times doesn't seem to imply irrationality unless mediated by a plan.

  ### Q5: Accuracy and Epistemic Utility
  **Question:** We have accuracy-based arguments for Conditionalization (Joyce, Pettigrew) that don't rely on Dutch Books. Can those arguments be run directly for Reflection without piggybacking on the Conditionalization result? Or does proving Reflection via accuracy require assuming Conditionalization first?

  *   **Follow-up (Likely Answer: There are direct accuracy arguments for Reflection):** If there are direct accuracy arguments, do they make Reflection *more* basic, or just *equally* basic? If the accuracy argument for Reflection relies on the same distance measures as Conditionalization, what makes Reflection the foundation rather than a corollary?
  *   **Follow-up (If she says no/it's an open problem):** If we lack a direct accuracy argument for Reflection, doesn't that undermine the claim that it's more fundamental? It suggests Reflection is a pragmatic norm, while Conditionalization is the epistemic one.

  > **Vulnerability Note (Q5):**
  > *   **Where this might die:** This is highly technical. She may cite recent work (e.g., by Pettigrew or Briggs) that establishes diachronic accuracy norms directly. If she cites a specific theorem, do not press further unless you have read it; you will lose the thread.
  > *   **What counts as a good answer:** She distinguishes between *updating rules* (target of Cond) and *credence constraints* (target of Reflection). A good answer admits that accuracy arguments for Reflection are harder to construct but argues that the *conceptual* priority remains even if the math is currently easier for Conditionalization.
  > *   **Hidden Assumption:** You are assuming accuracy arguments are the gold standard for "epistemic" normativity. She might reject this and stick to coherence/Dutch Book as the primary normative force.

  ### Q6: Self-Locating Belief
  **Question:** In self-locating cases (like Sleeping Beauty) or cases of pure forgetting, my future credence function isn't just a refinement of my current one; the domain of propositions might change, or I might lose certainty. Is Reflection even well-formed in these cases?

  *   **Follow-up (Likely Answer: It needs a centered modification):** If it needs a modification, is it still the *same* norm? If the core principle of rationality changes its syntax depending on whether I'm dealing with centered or uncentered propositions, does that weaken the claim that Reflection is the universal diachronic norm?
  *   **Follow-up (If she says it applies as-is):** How do I condition on "My future credence in H is r" when I know I will have forgotten what time it is? Doesn't that create a reference class problem that breaks the equality?

  ### Q7: Deference-with-Discount
  **Question:** I want to press a specific worry about known bias. Suppose I know that tomorrow I will read three alarming headlines and systematically overestimate risk. Reflection says I should align my current credence with my expected future credence. But shouldn't I instead defer to my *expected future credence minus the known bias*? Is "deference-with-discount" a genuinely different norm, or does it just collapse into Conditionalization on the evidence that I am biased?

  *   **Follow-up (Likely Answer: It collapses to Conditionalization on higher-order evidence):** If it collapses to Conditionalization, then in bias cases, Conditionalization is the active norm and Reflection is silent. Doesn't that suggest Conditionalization is doing the heavy lifting, and Reflection is just a label for the output when bias is zero?
  *   **Follow-up (If she argues it's a different norm):** If it's a different norm, do we need two diachronic principles? If Reflection is supposed to be the *basic* one, why does it need a rival principle to handle predictable irrationality?

  > **Vulnerability Note (Q7):**
  > *   **Where this might die:** This is your pet theory, which makes it the riskiest. It is very likely that "deference-with-discount" is just Conditionalization on the total evidence (which includes the fact that you will be biased).
  > *   **What counts as a good answer:** She shows that your proposal is formally equivalent to Conditionalizing on a partition that includes the biasing event. If she demonstrates this equivalence, concede the point; it strengthens her claim that Conditionalization is robust.
  > *   **Hidden Assumption:** You are assuming "bias" is something separable from the evidence. She might argue that the "alarming headlines" *are* the evidence, and how you process them is the updating rule.

  ### Q8: The "Basicness" Claim
  **Question:** Bringing it together: If Reflection requires restrictions to avoid vacuity, faces formulation issues with probability zero, and struggles with self-locating belief, what work is it doing that Conditionalization isn't? Why should we teach grad students that Reflection is the *more basic* norm, rather than just a useful heuristic for when Conditionalization is hard to apply?

  *   **Follow-up (Likely Answer: It captures the intuition of diachronic coherence more directly):** Is that intuition pragmatic or epistemic? If it's pragmatic (Dutch Book), why prefer it over the accuracy arguments for Conditionalization? If it's epistemic, can you spell out the epistemic virtue without referencing truth-conduciveness (which usually points back to Conditionalization)?
  *   **Follow-up (If she argues it's about generality):** Is generality enough to make something "more basic"? Newtonian physics is less general than Relativity, but we don't say Relativity is the *only* real physics. Can't both be fundamental norms for different domains?
