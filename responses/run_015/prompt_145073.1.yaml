          6.  Identify catalysts (what result in 6 months would change the priority list).

  2.  **Analyze the "Mismatches" vs. Standard Theory:**
      *   *Standard Theory:* Kelly Criterion (maximize geometric growth), i.i.d. returns, continuous sizing, infinite horizon, no external cash flows.
      *   *User's Reality:*
          *   Withdrawals $\rightarrow$ Reduces compounding base, increases ruin risk.
          *   Anti-correlated Donor $\rightarrow$ Acts as a put option on capital, reduces ruin risk, allows higher risk-taking.
          *   Lumpy/Illiquid Bets $\rightarrow$ Discrete sizing, liquidity risk, opportunity cost of waiting.

  3.  **Brainstorming Research Questions:**
      *   *Q1: The Donor Put Option.* How does the anti-correlated top-up function mathematically affect optimal leverage? This seems huge. It effectively lowers the cost of ruin.
      *   *Q2: Withdrawal Rate vs. Growth.* What is the sustainable withdrawal rate given the bet structure? How does this interact with position sizing? (If you bet too little, withdrawals eat you; too much, volatility + withdrawals kill you).
      *   *Q3: Liquidity & Lock-ups.* How do we adjust sizing for capital that is trapped? (Effective capital vs. book capital).
      *   *Q4: Edge Decay & Timing.* Does the urgency to deploy capital override price sensitivity?
      *   *Q5: Parameter Uncertainty.* How much to fractional Kelly due to estimation error?

  4.  **Evaluating Impact & Tractability:**
      *   *Donor Function:* High impact. If the donor covers 50% of losses, you can bet almost double. Tractable via simulation (Monte Carlo with cash flow rules).
      *   *Withdrawal Drag:* Medium-High impact. Reduces geometric mean. Tractable via simulation.
      *   *Liquidity:* Medium impact. Complicates the "fraction" definition (fraction of *what*?). Tractable.
      *   *Edge Decay:* Medium impact. Affects *which* bets, but the prompt says focus on *sizing rule*. Still, sizing depends on expected hold time.
      *   *Parameter Uncertainty (Fractional Kelly):* Standard worry. Often overrated if the other structural issues are bigger.

  5.  **Addressing the "Overrated" Worries:**
      *   *Time-Average vs. Expected Utility:* In a finite horizon with withdrawals, ergodicity economics matters, but for practical sizing, the difference between log-utility (Kelly) and time-average growth is often semantic if the goal is survival + growth.
      *   *Model Uncertainty:* Important, but often solved by simple fractional Kelly (e.g., Half-Kelly). Deep Bayesian model averaging might be overkill compared to nailing the cash flow structure.
      *   *User's Worry 1 (Withdrawals):* Actually very important. Not overrated.
      *   *User's Worry 2 (Donor):* **Potentially Overrated** *if* the donor's promise isn't legally binding or predictable. But if it is, it's huge. I need to be careful here. Actually, the *mechanism* of the donor is likely the biggest alpha. I should argue that worrying about *exact* correlation is less important than establishing the *floor*.
      *   *User's Worry 3 (Lumpiness):* Important for implementation, but maybe less for the *theoretical fraction*.
      *   *Standard Worry (Parameter Uncertainty):* Often overrated compared to structural cash flow mismatches.

  6.  **Developing the Priority List (The "Year Plan"):**

      *   *Priority 1: The "Effective Capital" Model (Donor + Withdrawals).*
          *   Why: This redefines the denominator of the fraction.
