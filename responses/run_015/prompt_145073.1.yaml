answer: |-
  This is a sophisticated allocation problem. You are describing an endowment-like structure but with venture-capital-like liquidity constraints and a unique "donor put" option on your capital. Standard Kelly Criterion or Mean-Variance Optimization fails here because they assume a closed system (no external cash flows) and continuous liquidity.

  Your unique advantage is the donor's anti-correlated top-up. Your unique risk is the combination of fixed withdrawals and illiquid lock-ups.

  Here is how I would allocate your year and two junior researchers (JRs), prioritizing questions by their expected impact on your committed fraction ($f^*$).

  ### 1. Research Priority List

  #### Priority 1: The "Net Survival" Cash Flow Model
  **Question:** What is the probability distribution of our *net* capital change (Returns + Donor Top-up – Fixed Payout) over 1, 5, and 10-year horizons, and how does this alter the ruin threshold?
  *   **Why:** Standard Kelly maximizes geometric growth assuming reinvestment. You are not reinvesting fully; you are draining. However, the donor is refilling, specifically when you lose. This effectively raises your "ruin barrier." If the donor covers 50% of drawdowns, your risk capacity effectively doubles.
  *   **Expected Impact on $f^*$:** **High (±10–15%).** Ignoring the donor leads to under-betting (leaving growth on the table). Ignoring the withdrawal drag leads to over-betting (risk of insolvency). Netting them correctly is the primary driver of your sizing.
  *   **Tractability:** **High.** This is a Monte Carlo simulation problem. Your JRs can build a discrete-time simulator in Python/R within 3 months. Inputs: Historical bet returns (or synthetic distributions), a function for donor behavior (e.g., top-up = max(0, Target – Current)), and fixed withdrawal rates.
  *   **Dependencies:** Upstream of everything. You cannot size bets until you know the volatility of your *net* equity base.

  #### Priority 2: Liquidity-Adjusted Capital Base
  **Question:** What fraction of our book capital is effectively "trapped" at any given time, and how should we define the denominator of our sizing fraction?
  *   **Why:** You mention payouts in assets we cannot sell for years. If 40% of your capital is locked in illiquid bets, and you size new bets off *total* capital, you risk a liquidity crunch where you cannot meet the fixed payout without selling liquid assets at a fire-sale price (or defaulting).
  *   **Expected Impact on $f^*$:** **Medium (±5–10%).** This usually results in a "haircut" to the available capital denominator. Instead of betting 2% of Total Equity, you bet 2% of *Liquid* Equity.
  *   **Tractability:** **High.** Requires mapping the maturity profile of your bet stream. JRs can model this as a "capital lock-up queue."
  *   **Dependencies:** Downstream of Priority 1. Once you know how much risk the net cash flow allows, you must constrain it by liquidity.

  #### Priority 3: Calibration of Fractional Kelly under Parameter Uncertainty
  **Question:** Given our edge estimation error, what fraction of the "full" Kelly (derived from Priorities 1 & 2) maximizes utility without exposing us to excessive drawdown volatility?
  *   **Why:** Even with perfect cash flow modeling, you do not know your true edge. Standard theory suggests Half-Kelly. But does the donor safety net allow you to move closer to Full-Kelly? Or does the illiquidity force you toward Quarter-Kelly?
  *   **Expected Impact on $f^*$:** **Low-Medium (±3–5%).** This is a tuning parameter. The structural cash flow issues (Priorities 1 & 2) determine the *scale* of the engine; this determines the *throttle*.
  *   **Tractability:** **Medium.** Requires sensitivity analysis on the simulator from Priority 1.
  *   **Dependencies:** Downstream of 1 & 2.

  ---

  ### 2. Which Worries Are Overrated?

  You asked which concerns, if settled, would leave your rule essentially unchanged.

  **1. The Ergodicity / Time-Average vs. Expected Utility Debate (Overrated)**
  *   **Verdict:** **Settle this immediately and move on.**
  *   **Reasoning:** In a finite-horizon, withdrawal-heavy context, the philosophical distinction between maximizing time-average growth (ergodicity economics) and maximizing log-utility (Kelly) collapses into a practical constraint: *Avoid Ruin.* Whether you call it "maximizing time-average growth" or "maximizing log-utility with a solvency constraint," the output is a fractional bet size. Spending months debating the philosophical foundation will not change the simulation output as much as nailing the donor function.

  **2. The "Lumpiness" and Minimum Cheque Size (Overrated as a Theoretical Problem)**
  *   **Verdict:** **Treat as an implementation constraint, not a sizing theory breaker.**
  *   **Reasoning:** You worry the opportunities are "lumpier than theory assumes." Theory assumes continuous variables; reality is discrete. However, if your bets are "small" relative to the fund (as you stated), discrete sizing is a rounding error. If a bet is 1% of the fund, the difference between sizing it at 1.0% vs 1.2% is negligible compared to the difference between sizing it at 1% vs 5% based on cash flow errors. Do not build a complex integer-optimization model. Build a continuous model and round the output.

  **3. Model Uncertainty / True Model Not in the Set (Overrated relative to Cash Flows)**
  *   **Verdict:** **Solved by Fractional Kelly.**
  *   **Reasoning:** You worry about the true model being outside your set. This is the classic argument for Fractional Kelly (e.g., betting half the optimal size). While important, this is a multiplicative adjustment (e.g., $\times 0.5$). The *base number* you are multiplying is determined by your Cash Flow Model (Priority 1). Getting the base number wrong by 20% due to ignoring the donor top-up swamps the error from model uncertainty.

  **4. Your Worry #2: The Donor Top-up (Potentially Overrated *if* unquantified)**
  *   **Nuance:** Worrying *that* the donor exists is correct. Worrying about the *precise functional form* of their generosity is overrated.
  *   **Reasoning:** Do not spend 6 months trying to model the donor's psychology. Model a **hard floor**. Assume the donor tops up only enough to prevent capital from dropping below $X$. If your rule is robust to a "hard floor" assumption, it will be robust to a "generous slope." Treat the donor as a binary option: either they pay or they don't. Stress-test the "they don't" scenario.

  ---

  ### 3. Upstream/Downstream Map

  1.  **Upstream:** **Net Cash Flow Volatility.** (Returns + Donor – Withdrawals). This defines the "Risk Budget."
  2.  **Midstream:** **Liquidity Constraints.** This defines the "Available Capital" denominator.
  3.  **Downstream:** **Fractional Scaling.** This applies the "Uncertainty Haircut" to the result of 1 & 2.

  *Do not start on Downstream before Upstream is stable.*

  ---

  ### 4. Catalysts: What Would Change the List in 6 Months?

  If you see one of the following results, reprioritize immediately:

  **1. The "Donor Correlation" Break (Move Priority 1 Down)**
  *   **Result:** Internal data or a conversation reveals the donor's top-ups are *not* anti-correlated with returns, but rather pro-cyclical (they give more when you do well) or random.
  *   **Action:** The "Donor Put" vanishes. Your risk capacity drops significantly. Shift focus to **Withdrawal Sustainability** (how to shrink the fund safely) rather than Growth Optimization.

  **2. The "Liquidity Cliff" Simulation (Move Priority 2 Up)**
  *   **Result:** Early simulations show that under plausible return sequences, locked capital exceeds 60% of the fund, making fixed payouts impossible without default.
  *   **Action:** Liquidity becomes the binding constraint, not volatility. The research year shifts from "How much to bet?" to "How to structure bet terms?" (e.g., negotiating secondary liquidity or shorter lock-ups).

  **3. External Paper: "Kelly with Regime-Switching Cash Flows" (Move Priority 3 Up)**
  *   **Result:** A new preprint (e.g., from a group like Santa Fe Institute or a quant endowment) provides a closed-form solution for optimal sizing with mean-reverting external cash flows.
  *   **Action:** Validate their closed form against your simulation. If it holds, you can retire the simulation project early and spend the rest of the year on implementation and edge estimation.

  ### Summary Recommendation for Your JRs

  **Months 1–3:** Build the **Cash Flow Simulator**. Do not optimize bets yet. Just simulate the fund's equity curve over 1,000 paths using historical bet returns, fixed withdrawals, and a *simple* donor rule (e.g., "Top up to 90% of high-water mark if below").
  **Months 4–6:** Layer in the **Liquidity Lock-ups**. Determine the maximum withdrawal rate the fund can sustain at various bet sizes without a liquidity crisis.
  **Months 7–9:** Run **Sensitivity Analysis**. Vary the edge estimation and donor reliability. Determine the "Fractional Kelly" that keeps ruin probability < 1% across all scenarios.
  **Months 10–12:** Write the **Investment Policy Statement (IPS)**. Codify the rule.

  **Final Advice:** Your biggest edge is the donor. Your biggest risk is the withdrawal. The bets themselves are secondary. Optimize the container, not the contents.
