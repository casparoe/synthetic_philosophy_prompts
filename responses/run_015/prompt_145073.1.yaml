  10. **Final Review against Constraints:**
      *   Did I answer how much it moves the number? Yes (estimates).
      *   Did I answer tractability? Yes.
      *   Did I map dependencies? Yes.
      *   Did I address the 3 worries + standard ones? Yes.
      *   Did I give 6-month catalysts? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't give financial advice. Frame this as research methodology. Also, ensure I acknowledge that "small, repeatable bets" contradicts "lumpy/illiquid" slightly—perhaps they are small relative to the fund but lumpy relative to the strategy. I will assume "small" means non-existential, but "lumpy" means discrete sizing constraints.

