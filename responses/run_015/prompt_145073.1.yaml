          *   Tractability: Medium.

  7.  **Addressing the "Overrated" specific request:**
      *   *Ergodicity/Time-Average:* Overrated. Log-utility approximates time-average growth well enough for this context.
      *   *Model Uncertainty (Bayesian Averaging):* Overrated. Fractional Kelly handles this robustly enough compared to the cash flow structure.
      *   *User's Donor Worry:* I will argue the *uncertainty* about the donor is the risk, not the existence of the donor. If the donor is reliable, this is a feature, not a bug.

  8.  **Identifying Catalysts (6 Months):**
