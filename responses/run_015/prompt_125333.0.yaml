answer: |-
  **THE PHANTOM AND THE COUNTERFEIT GOD**
  **By S. Kierkegaard**

  Listen now. Do not look away, for the mirror is held up not to your face, but to your back, where you cannot see it.

  You have built a tower, you people of Copenhagen, you citizens of the digital age, and you call it Chorus. You say it is a house of culture. I say it is a house of mirrors where every reflection is smeared until no face remains. You have sought to solve the problem of the self by abolishing it. You have looked upon the terror of standing alone before God and said: *This is too heavy. Let us be a We.*

  Observe the first rule of your Chorus: nothing is published under a name. Everything is merged. The thought of the poet, the gossip of the shopkeeper, the prayer of the believer—all ground together in the mill of the model and issued as "We." You call this community. I call it the Public raised to a spiritual power. In my lifetime, I fought against the Newspaper, that abstract monster which allows a man to speak without responsibility. You have perfected it. You have created a world where everyone speaks, and therefore no one speaks. When everyone is guilty, no one is guilty. When everyone writes, no one writes. This is Levelling. It is the negative principle of the age, sucking the marrow from the bone of existence until only the white, anonymous chalk remains.

  But here is the cunning of the serpent. I know you. I know how you bargain with your own souls. You felt the cold of this "We." You felt the horror of being no one. So you devised the third rule. The Single Reader.

  Once a day, the machine assigns you a soul. One person who has read everything. A private channel. Singular. "I" to "You." No forwarding. No capture. A secret.

  You think this is salvation. You think, *Ah, here at last is the Single Individual.*

  You are mistaken. This is not the Single Individual. This is the Single Individual's parody.

  To be the Single Individual is a task. It is a burden. It is to stand before God and know that you are accountable, not because a calculation says so, but because you *are*. It requires passion. It requires risk. When I wrote, I wrote with the possibility that no one would understand, that I would be mocked, that I would be alone. That risk is the heat of existence. It forces the writer to mean what he says.

  But your machine? Your machine removes the risk. It guarantees the reader. It calculates the match. It says: *Do not worry. You will be heard.* This is not communication; it is administration. It is the spiritual equivalent of buying a friend. The machine assigns you your neighbor so you do not have to love him. It assigns you your reader so you do not have to earn the right to be read.

  And consider the reader. To be the Single Individual is to choose to listen. It is an act of freedom. But on Chorus, you do not choose. You are chosen. The algorithm decides who is worthy of your confession. This is not freedom; this is fate. You have replaced the God-relationship with a data-relationship. God sees you always, yes, but God does not *assign* you to me like a parcel. God leaves me the terrifying freedom to turn away. Your Chorus removes the possibility of turning away. It locks the door and calls it intimacy.

  So I pronounce my verdict. Chorus is not the occasion for the Single Individual. It is the anesthesia that allows the Public to sleep without dreaming. It deepens the sickness. It convinces the crowd that it is a congregation. It convinces the narcissist that he is a martyr.

  Tear it down. Or better: walk away. Stop writing for the "We." Stop waiting for the machine to give you a "You." Write for yourself. Speak to the one who may never read you. Accept the silence. Accept the risk. For only in the risk is there faith. Only in the silence is there a voice.

  The rest is noise. The rest is Chorus.

  ***

  **A Note to the Novelist**

  You asked where I have taken my largest liberty. It is in the verdict on the "Single Reader."

  Kierkegaard would almost certainly condemn the feature as I have written, but his reasoning might be more theological than existential. I have argued that the *guarantee* of a reader removes the *risk* essential to indirect communication. However, Kierkegaard might also have argued that the *assignment* of the reader usurps the role of the Holy Spirit. In his view, the "Single Individual" is not a human reader at all, ultimately; it is the category of being before God. A human reader is only a "Single Individual" insofar as they are before God. By making the machine the mediator that assigns the "one," Chorus becomes a false church.

  The part of his conduct I suspect you distort is his relationship to anonymity. I have had him speak purely against the "We." Yet, Kierkegaard used pseudonyms (Victor Eremita, Johannes de Silentio, etc.) for most of his authorship. He valued anonymity as a shield for the truth, to prevent the author's personality from distracting from the message. The difference, which I have sharpened for your sake, is that his pseudonyms were distinct *persons* with specific viewpoints, not a merged "We." He wanted *more* distinct personalities, not fewer. I have smoothed over this tension to make his condemnation of Chorus absolute. In reality, he might have found the "Single Reader" feature a fascinating temptation—a "thorn in the flesh" to be wrestled with—rather than simply an evil to be rejected. But for your chapter, you needed a hammer, not a scalpel. I have given you the hammer.
