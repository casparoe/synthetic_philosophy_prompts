answer: |-
  **Part 1: Intervention Tiers and Scores**

  1.  **Growth hormone (short child, no deficiency):** *Clearly Enhancement* (Score: 95) — This intervenes on a statistical variation without underlying pathology to achieve a socially preferred trait.
  2.  **Cochlear implant (Deaf culture context):** *Arguably Therapy* (Score: 40) — While it restores species-typical function, it overrides a specific community's conception of well-being and identity.
  3.  **Wakefulness drug (night-shift worker):** *Arguably Enhancement* (Score: 60) — This compensates for a chosen environmental mismatch rather than correcting an internal physiological dysfunction.
  4.  **Beta-blocker (orchestral violinist):** *Arguably Enhancement* (Score: 70) — It optimizes performance in a non-pathological state by suppressing a normal stress response.
  5.  **Gene edit (normal cholesterol):** *Clearly Enhancement* (Score: 90) — This seeks super-normal health metrics in the absence of disease risk or current dysfunction.
  6.  **Brain fog drug (patient vs. colleague):** *Arguably Enhancement* (Score: 55) — The molecule is identical, proving the distinction lies entirely in the patient's biography rather than the intervention's mechanism.
  7.  **Grief reduction drug:** *Clearly Enhancement* (Score: 80) — It pathologizes a universal human emotional response rather than correcting a psychiatric dysfunction.
  8.  **Memory-dampening drug (trauma prevention):** *Arguably Therapy* (Score: 25) — It prevents a recognized psychiatric disorder, even if it alters normal memory consolidation processes.
  9.  **Magnetic sense implant (sighted person):** *Clearly Enhancement* (Score: 100) — It adds a capability never possessed by the species without correcting any biological deficit.
  10. **Aerobic pill (70 to 30-year-old):** *Clearly Enhancement* (Score: 85) — It reverses aging processes to exceed age-typical baselines rather than treating specific age-related diseases.

  **Part 2: Evaluating the Tests**

  **Ranking (Most to Least Weight):**
  1.  **Malady Gate:** It provides the necessary legal hook for regulation but breaks down when faced with preventive medicine and psychiatry where dysfunction is subjective.
  2.  **Peer Baseline:** It offers objective statistical anchors but fails when a condition is common (like hypertension) yet still pathological.
  3.  **Restoration Window:** It aligns with intuitive fairness for acquired conditions but excludes those with congenital deficits who never occupied the higher level.
  4.  **Reimbursement Symmetry:** It reflects fiscal reality for payers but is circular, defining coverage based on past coverage decisions rather than ethical merit.
  5.  **Offset Principle:** It captures the moral urgency of unchosen disadvantage but struggles to distinguish between genetic luck and lifestyle choices.
  6.  **Substitution Test:** It usefully highlights medical necessity but breaks because insulin is effectively a substitution for diet failure yet remains core therapy.

  **Conflict and Damage:**
  The **Restoration Window** and **Peer Baseline** come into conflict most often, particularly in congenital cases like the cochlear implant, where one test demands restoration of function and the other notes the function was never possessed. The **Brain Fog Drug** case does the most damage to the distinction overall, as it demonstrates that the exact same biochemical intervention flips from therapy to enhancement based solely on the patient's history, rendering the technology itself neutral.

  **Part 3: The Fraction**

  Of the interventions that people in rich countries currently receive from a doctor for something other than an acute injury or infection, I would class **0.40** as enhancement rather than therapy. This figure accounts for the vast grey zone where chronic disease management slides into optimization (e.g., statins for borderline risk, antidepressants for mild distress) and where lifestyle drugs are coded as medical treatments.

  **Consistency Check:**
  This fraction sits somewhat badly with my case-by-case scores, where seven of the ten examples landed on the enhancement side of the midpoint. I would revise the **fraction** upwards from my initial instinct (which was closer to 0.20) to acknowledge that while my column examples were curated to stress-test the boundary, the "encroachment" my source warned of is already embedded in routine care under the guise of prevention.
