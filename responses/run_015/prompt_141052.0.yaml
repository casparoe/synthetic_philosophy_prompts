answer: |-
  ### Specification for a Theory of Multi-Polar Traps

  **1. Discrimination from Lookalikes**
  *   **Motivation:** Journalists observe escalating costs and universal complaint (e.g., credential inflation), but this pattern also fits zero-sum tournaments where the aggregate value is neutral rather than negative (e.g., Olympic sprinting), or distributional conflicts where winners gloat and losers suffer. A theory that labels all competition as pathological is useless.
  *   **Requirement:** The account must identify an observable signature distinguishing a trap from a treadmill. The signature is **voiced preference for restraint coupled with inability to unilaterally defect**. In a treadmill, participants do not wish to stop running; in a trap, they explicitly wish for a mechanism to stop but cannot trust others to halt. Furthermore, the theory must quantify the uncertainty tolerance: it must hold even if payoffs are not perfectly known, provided the *direction* of incentives (defect = gain, cooperate = lose) is robust.
  *   **Status:** **Non-Negotiable.** Without this, the label becomes a synonym for "competition I dislike".

  **2. Traps with Bystanders**
  *   **Motivation:** In antibiotic resistance or carbon emissions, the competitors (pharmaceutical firms, emitting nations) may profit while the sufferers (patients, future generations) are absent from the game. This differs from an arms race where the racers themselves bear the cost of the armour.
  *   **Requirement:** The theory must distinguish **internalised traps** (participants harm themselves, e.g., doping) from **externalised traps** (participants harm third parties, e.g., pollution). It must specify whether the "Moloch" label applies only when the participants are also the victims. If it covers both, it must separate the coordination failure among racers from the exploitation of bystanders, as the remedies differ (self-binding vs. regulation/compensation).
  *   **Status:** **Non-Negotiable.** Conflating these leads to prescribing self-restraint for problems that require external enforcement.

  **3. The Asymmetry of Entry and Exit**
  *   **Motivation:** Some races are ruinous to leave (nuclear disarmament leaves you vulnerable); others are easy to leave but psychologically difficult (social media attention). A theory must explain the lock-in mechanism.
  *   **Requirement:** The account must specify the **cost structure of exit**. Is exit hard due to sunk costs (physical capital), strategic vulnerability (security dilemma), or diffuse benefits/concentrated costs (climate action)? Crucially, it must take a position on escape: an escape is only valid if it is **self-enforcing** or **externally binding**. A solution that relies on voluntary restraint where defection remains profitable is not an escape, but a temporary ceasefire.
  *   **Status:** **Non-Negotiable.** Diagnosing a trap without explaining the barrier to exit offers no leverage for intervention.

  **4. Traps about Traps (Meta-Competition)**
  *   **Motivation:** Attempts to solve traps often become new sites of competition. Jurisdictions compete over who can regulate least (tax havens); regulators are captured by the industries they restrain; cartels form under the banner of safety to entrench incumbents.
  *   **Requirement:** The theory must treat the **cure as endogenous**. It must predict when a coordination mechanism (a treaty, a union, a standard) will stabilise the system versus when it will become a weapon in a higher-order race. It must distinguish between **restraint regimes** (which lower the ceiling for everyone) and **rent-seeking regimes** (which raise the floor for incumbents while barring entry).
  *   **Status:** **Non-Negotiable.** Ignoring this leads to naive institutionalism where the regulator is assumed to stand outside the game.

  **5. Moloch without Agents**
  *   **Motivation:** Evolutionary dynamics (peacock tails) or cultural selection (memetic virality) exhibit trap-like structures without deliberating agents. There is no one to "prefer" an alternative.
  *   **Requirement:** If the concept extends here, the definition of "preference" must be operationalised as **fitness or stability**, not welfare. The theory must state that a system is in a trap if a counterfactual state exists that is more stable or resource-efficient, even if no agent desires it. However, it must flag this as an analogy: without agency, there is no possibility of bargain, only selection pressure.
  *   **Status:** **Preference.** This stretches the concept. It is useful for analogy but dangerous if it implies evolutionary outcomes can be "solved" by negotiation.

  **6. Stress Test: The Credence Trap**
  *   **Motivation:** In polarised discourse or corporate signalling, participants escalate public commitments (credences) they do not privately hold. The currency is sincerity or accuracy.
  *   **Analysis:** This is a valid subset of the structure. The payoff is reputational safety; the cost is epistemic degradation. The "trap" is that unilateral honesty is punished as heresy or non-compliance.
  *   **Correction:** Do not treat this as merely "lying". The cost is the **destruction of the signalling medium itself**. If the currency is accuracy, inflating it renders the market useless. The theory must account for the degradation of the *information channel* as a specific casualty, distinct from resource depletion.
  *   **Status:** **Non-Negotiable** (as a distinct subtype).

  **7. Stress Test: Races Worth Running**
  *   **Motivation:** Priority races in science or vaccine development impose costs on losers but generate massive public goods. Slowing these down is a net loss.
  *   **Analysis:** A theory that labels all costly competition a failure is anti-innovation.
  *   **Correction:** The theory must include a **Net Social Utility condition**. A race is only a "trap" if the aggregate cost to participants and bystanders exceeds the aggregate value of the innovation or outcome produced. If the competition drives discovery that outweighs the waste of the race, it is a feature, not a bug. The condition for intervention is not "I dislike the outcome" but "Marginal Social Cost > Marginal Social Benefit".
  *   **Status:** **Non-Negotiable.** This prevents the concept from becoming a Luddite critique of competition.

  ***

  ### Self-Policing the Specification

  **Tensions between Desiderata**
  There is a fundamental tension between **Requirement 1 (Discrimination)** and **Requirement 5 (Moloch without Agents)**.
  *   **The Conflict:** Requirement 1 demands evidence that participants *would prefer* an alternative outcome (a welfare claim). Requirement 5 applies the label to systems with no agents to hold preferences (a fitness claim).
  *   **The Risk:** You cannot jointly satisfy a definition that relies on expressed preference and one that applies to blind selection. To hold both, you must accept that "Moloch" is being used in two different senses: one normative (human welfare) and one functional (systemic efficiency). If you conflate them, you risk anthropomorphising evolution or biologising politics.
  *   **Resolution:** The specification must explicitly state that the "agentless" version is an *analogy* that lacks the "escape via bargain" property of the human version.

  **The Single Most Important Requirement**
  **Requirement 1 (Discrimination from Lookalikes)** does the most work.
  *   **Reasoning:** The popular misuse of "Moloch" is to label any intense competition as pathological. If the theory cannot distinguish a Pareto-inferior trap (where everyone loses) from a zero-sum tournament (where someone wins) or a beneficial race (where society wins), it becomes a mere rhetorical bludgeon. This requirement forces the writer to prove the *collective loss*, which is the defining feature of the phenomenon.

  ***

  ### Scoring of Standard Framings

  | Framing | Discriminates from Lookalikes? | Handles Bystanders? | Accounts for Meta-Traps? | Net Utility Condition? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Commons-style Tragedy** | **Partial.** Focuses on resource depletion, misses credential/arms races where no physical resource is shared. | **Weak.** Assumes users are owners; struggles with externalities imposed on non-users. | **No.** Treats the commons as static; ignores competition over the rules of access. | **No.** Assumes all depletion is bad; ignores productive extraction. |
  | **Iterated Prisoner's Dilemma** | **Strong.** Clearly defines defection incentives vs. cooperative optimum. | **Weak.** Typically models closed systems; externalities must be added ad hoc. | **Partial.** Can model enforcement, but often assumes exogenous punishment mechanisms. | **Yes.** Payoff matrices allow for net benefit calculation, though rarely used thus. |
  | **Multi-level Selection** | **Weak.** Explains *why* the trap exists (group vs. individual fitness), not how to identify it observationally. | **Strong.** Naturally handles costs imposed on other groups or levels. | **Strong.** Explicitly models competition between regulatory regimes/groups. | **No.** Fitness is not welfare; a "successful" trap is still successful. |
