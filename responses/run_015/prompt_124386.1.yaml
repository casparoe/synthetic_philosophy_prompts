  I'm presenting to our phil of mind reading group next tuesday a tight reading of the cogito: Descartes proves only that thinking is occuring, not that there's a substantial self that owns it. I think he smuggles the substance in via Latin participle grammar — the nominative forces a subject onto "cogitans" — but in the French text he mostly dodges it, except for one spot where he doesn't. The room has three self-consciousness researchers who think first-person authority is the whole point, one Cartesian scholar who knows every Latin variant, and two grad students wondering if this touches minimal-self debates. Draft my Q&A prep: the objections in the order they'll hit, phrased like each faction would say them, with a quick reply and a note on where it's soft. Include the Latin-grammar objection the scholar will definitely raise, flag my weakest reply (probably conceding Descartes wasn't doing linguistics), and include the question I'm hoping nobody asks — whether this commits me to eliminativism about the self. Two-minute replies max, keep it practical.
