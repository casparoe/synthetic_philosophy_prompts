          *   *Analysis:* PP hierarchies *are* global in scope but distributed in implementation. "Global Workspace" implies a specific broadcast architecture. PP implies bidirectional message passing. High-level priors constrain lower levels without a "theater." This seems like an *apparent* tension. PP *is* an alternative to GWT.
      *   *(2) vs. (4):* User worries Bayesian inference requires representing hyperparameters (precision).
          *   *Analysis:* This is the core technical friction. In variational Bayes, precision (inverse variance) is a parameter of the approximate posterior. If the brain implements VB, does it *represent* precision explicitly as a proposition ("I am 80% sure") or does it implement it as gain control (physiological modulation)? Friston usually argues for the latter (gain control *is* the encoding of precision). However, if precision is *never* represented, can higher levels predict the precision of lower levels? (i.e., predicting uncertainty). This is a known debate (explicit vs. implicit precision). This is a *genuine* tension depending on how "represented" is defined.
      *   *(1) vs. (5):* FEP applies to all systems; MB is real.
