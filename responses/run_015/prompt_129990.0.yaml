  2.  **Deconstruct the "Retroactive Annulment Thesis":**
      *   *Core Claim:* Present actions derive meaning from a future horizon. If the future horizon vanishes (extinction), the meaning of past/present actions is retroactively nullified.
      *   *Scheffler's Original:* We care about the afterlife (successors) more than our own survival for the sake of our current values.
      *   *The Twist:* It's not just that we *feel* sad; it's that the *rational justification* collapses backward. The past becomes "wasted" or "irrational" in hindsight.

  3.  **Brainstorming Defeaters (The Audit):**

      *   *Empirical (Psychology/Experience):* Do people actually derive meaning from the far future? Or is meaning immediate/immanent? If I paint a picture, does it matter if humanity ends in 100 years? Many report meaning in the *act* itself or the immediate impact.
      *   *Formal (Rationality/Decision Theory):* Commitments are made under uncertainty. Was it irrational *at the time*? No. Does new information (extinction) change the *past* rationality? Standard decision theory says rationality is time-indexed. You can't be retroactively irrational just because the world ended.
      *   *Ethical (Parochialism):* Is this too human-centric? What if non-human value exists? Also, does it privilege "long-horizon" projects over immediate care? Is it elitist to say only institution-builders need a future?
      *   *Metaphysical (Time/Meaning):* Does the future *create* the past's meaning? Or does the past have intrinsic value? If meaning is fixed at the moment of action, the future can't annul it. This is the "direction of fit" problem.

  4.  **Ranking the Defeaters:**
      *   *Fatal:* Metaphysical (Meaning is time-indexed/intrinsic). If meaning is fixed at $t_1$, $t_2$ events can't change it.
      *   *Severe:* Formal (Rationality is ex-ante, not ex-post). You can't judge past rationality by future outcomes (resultant luck).
      *   *Moderate:* Empirical (People find meaning in the now). Challenges the descriptive premise.
      *   *Awkward:* Ethical (Parochialism). Challenges the scope, not the logic.

