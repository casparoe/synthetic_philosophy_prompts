answer: |-
  You have identified a sophisticated and pervasive dialectical pattern, particularly in meta-ethics, population ethics, and value theory. While there is no single, canonical term in the philosophical lexicon that captures this *exact* dynamic exclusively, it is a composite of several well-established concepts from philosophy of science, logic, and ethical theory.

  The most precise classification for this maneuver is an **Ad Hoc Rescue** functioning as an **Immunization Strategy** within a **Lakatosian Protective Belt**. However, in the specific context of normative boundaries, it is often discussed under the rubric of **The Sorites Problem** or **Qualitative vs. Quantitative Distinctions**.

  Here is a breakdown of the relevant concepts, how they map onto your description, and where the edges of the maneuver should be drawn.

  ### 1. The Philosophy of Science Lens: Immunization Strategies
  Your intuition that this resembles an "immunization strategy" is correct. In the philosophy of science (specifically Karl Popper and Imre Lakatos), a theory is protected from falsification by adjusting its periphery.

  *   **The Core:** The lexical claim (e.g., "Torture is lexically worse than pleasure").
  *   **The Anomaly:** Intermediate cases (e.g., "Decades of stagnation") that threaten to show the boundary is permeable or non-existent.
  *   **The Protective Belt:** The recursive taxonomic redescription. By claiming the intermediate case shares the *essential structural feature* of the extreme case (e.g., "loss of agency" rather than "nociceptive intensity"), the theorist absorbs the anomaly without altering the core theory.

  **Term:** **Ad Hoc Rescue.**
  This occurs when a modification is made to a theory solely to accommodate a counter-example, without independent justification or new predictive power. If the distinction used to reclassify the intermediate case is generated *only* in response to the challenge, it is an ad hoc rescue.

  ### 2. The Logical Lens: No True Scotsman & The Sorites
  Logically, this maneuver combines two distinct moves:

  *   **No True Scotsman:** This fallacy occurs when a universal claim ("No suffering can be outweighed") is threatened by a counter-example ("What about mild chronic pain?"), and the proponent redefines the subject ("*True* lexically bad suffering involves structural stagnation") to exclude the counter-example. Your description fits this perfectly: the category of "lexically protected harm" is redefined to ensure no counter-example can ever land outside it.
  *   **Denial of the Sorites Series:** The underlying logical problem is the Sorites Paradox (the paradox of the heap). If one accepts that there is a gradient from torture to mild annoyance, there must be a point where the lexical status changes. By recursively reclassifying borderline cases as belonging to the "extreme" kind, the proponent denies the existence of the gradient, asserting a **cliff edge** where logic suggests a **slope**.

  ### 3. The Ethical Lens: Kind vs. Degree
  In value theory, this is often framed as a dispute between **Quantitative Continuity** and **Qualitative Discontinuity**.

  *   **John Stuart Mill's Move:** This is historically rooted in Mill's distinction between "higher" and "lower" pleasures. When confronted with the idea that a pig's satisfaction might outweigh a human's dissatisfaction, Mill argued they are different *kinds* of pleasure, not different *amounts*.
  *   **Parfit's Lexical View:** In population ethics, Derek Parfit and others have explored lexical views to avoid the "Repugnant Conclusion." Critics often accuse proponents of "Lexicality" of engaging in the maneuver you describe: positing a threshold that is conveniently placed just before the counter-intuitive result occurs.

  **Term:** **Categorical Retreat.**
  While not standard jargon, this phrase captures the dynamic: as soon as a quantitative comparison threatens the boundary, the theorist retreats into a categorical distinction.

  ### 4. Is there a specific name?
  There is no single word for this, but in recent meta-ethical literature regarding **incommensurability**, it is sometimes referred to as:

  *   **The Incommensurability Shield:** Using the claim of incommensurability to block comparative queries that threaten the theory.
  *   **Taxonomic Immunization:** (Descriptive) Protecting a normative claim by refining the taxonomy of the phenomena.

  If you are writing on this, **"Taxonomic Immunization"** or **"Ad Hoc Categorical Distinction"** would be precise and understandable neologisms.

  ### 5. Where should the edges be drawn?
  You asked whether this requires an explicit lexical commitment or if it occurs whenever a normative absolute is protected. The distinction between a **legitimate philosophical distinction** and a **fallacious immunization** lies in **Independent Justification**.

  **It is NOT a fallacy if:**
  1.  **Independent Criteria:** The distinction (e.g., "agency violation" vs. "physical pain") is defined independently of the lexical claim. The theorist must be able to identify the feature *before* applying the moral weight.
  2.  **Predictive/Explanatory Power:** The distinction explains *other* moral intuitions beyond just saving the lexical threshold. (e.g., If "loss of agency" is the criterion, does it also explain why we value consent in other contexts?)
  3.  **Phenomenological Grounding:** The distinction maps onto a real, experienced difference, not just a theoretical convenience.

  **It IS a fallacy (Immunization) if:**
  1.  **Retroactive Fitting:** The criteria for the "kind" of harm are adjusted *after* the intermediate case is presented to ensure it falls inside the protected zone.
  2.  **Unfalsifiability:** The definition of the "lexical kind" is so fluid that no conceivable empirical case could ever fall outside it.
  3.  **Lack of Gradient Acknowledgement:** The theorist refuses to acknowledge that the "structural feature" (e.g., stagnation) itself admits of degrees, which would reintroduce the Sorites problem.

  ### Summary
  The maneuver you describe is best understood as an **Ad Hoc Rescue** utilizing a **Qualitative Distinction** to create an **Immunized Lexical Boundary**.

  It functions as a **No True Scotsman** fallacy applied to normative categories. While proponents argue they are identifying a morally relevant *essence* (e.g., the violation of personhood), critics argue they are engaging in **Taxonomic Immunization** to preserve a theory from the **Sorites Paradox**.

  To name it in your own work, **"Taxonomic Immunization"** is the most descriptively accurate term, as it highlights that the *classification system itself* is being manipulated to protect the *normative claim*. It does not require an explicit lexical commitment to occur; it arises whenever any absolute normative boundary is defended against borderline cases by redefining the border rather than the boundary.
