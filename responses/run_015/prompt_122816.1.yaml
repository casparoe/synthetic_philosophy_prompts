answer: |-
  **The Scenario**

  Consider a retail display socket fitted with a 'demo-mode' inhibitor, a standard electromechanical relay wired to detect the insertion of a plug. The object is the socket itself. When a customer inserts a plug (the stimulus), the relay instantly opens the internal circuit, cutting current to the terminals while leaving the physical contacts intact. We attribute two dispositions to the socket: first, the intrinsic disposition to conduct electricity to the terminals when a plug is inserted; second, the extrinsic disposition to power an attached appliance (say, a vacuum cleaner) when a plug is inserted. The inhibitor operates by ordinary causal means on locally available signals (the mechanical closure of the plug's earth pin), and the set-up requires no sorcery, merely a cheap microcontroller and a solenoid.

  **Analysis of Disposition 1: To Conduct Electricity**

  *   **Stimulus:** Insertion of a plug.
  *   **Manifestation:** Current flow at the terminals.
  *   **Causal Basis:** The intrinsic conductivity of the copper wiring and contact geometry within the socket.
  *   **SCA Prediction:** The Simple Conditional Analysis (SCA) states: *If a plug were inserted, current would flow.* In this case, a plug is inserted, but current does not flow. The SCA yields a false conditional.
  *   **Classification:** **Mask.** The inhibitor prevents the manifestation (current flow) without altering the categorical basis (the copper remains conductive). The socket retains its intrinsic physical structure; the output is merely blocked by the relay's intervention. The basis is wholly intrinsic, so an intervention that leaves the object's internal state untouched counts as a mask.

  **Analysis of Disposition 2: To Power an Appliance**

  *   **Stimulus:** Insertion of a plug.
  *   **Manifestation:** The vacuum cleaner operates.
  *   **Causal Basis:** The conjunction of the socket's internal conductivity *and* the external availability of mains voltage (a fact about the surroundings).
  *   **SCA Prediction:** SCA states: *If a plug were inserted, the appliance would operate.* A plug is inserted, the appliance does not operate. The SCA yields a false conditional.
  *   **Classification:** **Fink.** Here, the extrinsic nature of the basis is decisive. The causal basis for powering the appliance includes the *link* to the mains supply. The inhibitor, triggered by the stimulus, severs this link. Unlike the first case, the intervention does not merely block the output; it removes a necessary constituent of the causal basis (the live connection) precisely when the stimulus occurs. Because the disposition's basis is partly extrinsic, an intervention on the environment that severs that extrinsic component counts as destroying the basis, not just masking it.

  **The Contestable Point**

  The classification turns on whether the inhibitor is seen as blocking a path (mask) or removing a power source (fink). For the intrinsic disposition, the power source (conductivity) is internal and remains, so it is a mask. For the extrinsic disposition, the power source (mains connection) is external and is removed by the relay, so it is a fink. A sceptic might argue that both are masks because the socket's internal wiring is unchanged. However, if the disposition is *to power an appliance*, the basis must include the appliance's ability to receive power. By cutting the current, the inhibitor removes the *causal oomph* required for the manifestation, not just the pathway. The extrinsic basis makes this contestable because it blurs the boundary between the object's properties and the environment's contribution.

  **Reverse-Cycle Variant**

  Consider a 'security socket' that is internally dead until a plug is inserted, at which point a sensor closes the relay and *restores* power. Here, the object lacks the disposition to conduct/power until stimulated, then acquires it. This is best handled as a **finkish disposition** (specifically, an inverse fink or 'anti-fink'). It is not a mask, as the basis is absent until the stimulus arrives. It is not a standard fink, which removes a present basis. This variant suggests the SCA fails not just because bases are removed, but because they are temporally unstable. It acts as a *reductio* of any analysis that assumes dispositions are static categorical properties waiting for a trigger.

  **Honest Appraisal**

  The single feature doing the work here is the **constitutive dependence** of the second disposition on the environment. If you remove the 'extrinsic basis' requirement and treat both dispositions as intrinsic to the socket, the inhibitor looks like a mask for both (the socket is still a socket, just blocked). The case collapses if the mains connection is treated as merely a background condition rather than part of the causal basis. A defender of the Conditional Analysis would likely retreat to **Ideal Conditions**: they would argue the SCA holds only in worlds where no such inhibitors exist. However, this renders the analysis trivial, as 'ideal conditions' simply means 'conditions where the disposition manifests', which offers no explanatory power. To survive a hostile seminar, you must press the point that if the basis is partly extrinsic, then 'ideal conditions' must include the environment, making the disposition's existence contingent on facts outside the object, which undermines the intuition that dispositions are properties *of the object*.
