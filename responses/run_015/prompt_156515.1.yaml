          *   Status: Non-negotiable.
          *   Rules Out: Static snapshot theories.

      *   *Idea 5: Transparency/Defensibility.* Explaining to the loser why they lost.
          *   Case: Telling the dialysis patient why the hip replacement got funded.
          *   Status: Non-negotiable.
          *   Rules Out: Black box algorithms, arbitrary normalization.

      *   *Idea 6: Priority to the Worse Off.* Giving weight to those in worse states.
          *   Case: Saving a life vs. curing a mild headache for many.
