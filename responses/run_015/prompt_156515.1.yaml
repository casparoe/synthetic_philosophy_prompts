      Okay, ready to write.

      *Wait, one last check on the "Invariance" desideratum.*
      If I write "Invariance under independent positive affine transformation", that covers both units and zero.
      If I require "Priority to the Worse Off", I need to know levels.
      If I know levels, I cannot allow independent zero-point shifts.
      So the desideratum "Invariance under independent zero-point shifts" must be marked as the one that conflicts.
      However, standard utility theory says utility is *only* fixed up to affine transformation. So demanding a fixed zero is demanding *more* than standard utility theory provides.
