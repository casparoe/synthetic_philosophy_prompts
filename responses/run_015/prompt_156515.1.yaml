          *   Rules Out: Strict Sum Utilitarianism.

      *   *Idea 7: Informational Parsimony.* We don't have omniscience.
          *   Case: Clinician doesn't know the patient's home life.
          *   Status: Non-negotiable.
          *   Rules Out: Theories requiring perfect knowledge of mental states.

      *   *Idea 8: Scale Invariance (The User's specific worry).*
          *   Case: If I measure pain 1-10 vs 1-100, the ranking shouldn't flip.
          *   Status: Non-negotiable (mathematical consistency).
          *   Rules Out: Ad-hoc scoring.

  4.  **Addressing the User's Hypothesis (Invariance vs. Priority):**
      *   The user suspects: Invariance under independent rescaling (Cardinal Unit Comparability - CUC) collides with Priority to the Worse Off.
      *   *Analysis:* If utilities are only comparable up to positive affine transformation ($u' = a u + b$, where $a > 0$), we can compare *differences* (gains/losses) but not *levels* absolutely, unless we fix a zero point.
      *   Priority to the worse off requires knowing who is *worse off* in absolute terms (levels), not just who gains more.
      *   If we only have CUC, we can compare gains ($\Delta u$), but we cannot compare levels ($u_i$ vs $u_j$) without a common zero.
      *   To prioritize the worse off, we need *Cardinal Full Comparability* (CFC) or at least a fixed zero point (natural zero).
      *   So, yes, there is a tension. If you insist on invariance under *independent* origin shifts ($b_i$ can vary), you cannot define "worse off" absolutely. You can only define "gains more."
      *   *Correction:* Actually, standard social choice theory distinguishes between CUC (units comparable, levels not) and CFC (units and levels comparable). Priority requires CFC. If the input data only supports CUC, you can't do priority.
      *   *Arrow's Theorem:* Arrow assumes Ordinal Non-Comparability (ONC). If we move to Cardinal information, Arrow's impossibility can be bypassed (e.g., Utilitarianism works with CUC). But if we want Priority + CUC, we hit the "level vs. difference" problem.

  5.  **Refining the Desiderata Table:**
      *   Need to ensure the "Motivating Case" is concrete as requested.
      *   Need to ensure "Rules Out" is specific.
      *   Need to capture the "Adapted Preferences" and "Strategic Inflation" specifically.

