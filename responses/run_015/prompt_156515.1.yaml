answer: |-
  | Requirement | Motivating Case | Status | Rules Out |
  | :--- | :--- | :--- | :--- |
  | **Interpersonal Level Comparability** | We must identify the dialysis patient as absolutely worse off than the hip replacement candidate to prioritize them, not just compare their gains. | Non-negotiable | Pure ordinalism; Cardinal Unit Comparability (CUC) without fixed zero. |
  | **Interpersonal Unit Comparability** | We must weigh one year of dialysis against one hip replacement quantitatively, not just rank them ordinally. | Non-negotiable | Ordinal comparability; Lexical rules. |
  | **Resistance to Adaptive Preferences** | A patient with long-term disability reports high satisfaction due to lowered expectations; the rule must not deprioritize their care based solely on this report. | Non-negotiable | Pure subjective welfarism; Unadjusted self-report metrics. |
  | **Resistance to Strategic Inflation** | A patient exaggerates pain scores to jump the queue; the rule must not reward intensity claims that contradict clinical observation. | Non-negotiable | Naive utilitarianism based solely on revealed preference or self-report. |
  | **Intrapersonal Continuity** | A prevention program hurts the healthy current self to benefit the sick future self; the rule must treat them as the same moral patient over time. | Non-negotiable | Time-slice welfarism; Discontinuous identity theories. |
  | **Epistemic Humility** | The clinician cannot know the patient's home support network; the rule must function with partial, noisy data without collapsing. | Non-negotiable | Ideal observer theories; Omniscient maximization. |
  | **Public Defensibility** | We must explain to the unfunded patient why they lost without saying "we normalized the numbers arbitrarily." | Non-negotiable | Black-box algorithms; Arbitrary scaling conventions. |
  | **Invariance to Independent Zero-Points** | If we measure pain on a 0–10 scale or a 10–20 scale, the priority ranking should not flip simply because the zero shifted for one person. | Negotiable | Any theory requiring a fixed natural zero (e.g., death). |

