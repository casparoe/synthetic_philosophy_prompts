      Actually, #1 and #2 can be combined into "Full Comparability". But separating them helps identify the conflict. The user specifically asked about rescaling (units) but the real conflict is often origin shifts. I will phrase the desideratum carefully. "Invariance to Arbitrary Zero-Points" vs "Priority to Absolute Levels".

      Let's refine the "Status".
      - Comparability: Non-negotiable (can't rank without it).
      - Adaptive Preferences: Non-negotiable (ethical mandate).
