      *   **Constraints:** No utility meters. Inputs: observed choice, self-reported intensity, clinician judgment. Output must be defensible in plain language to losers (no "arbitrary normalization").
      *   **Task:** Write desiderata for a theory of interpersonal comparison suitable for this job.
      *   **Specific Requirements:** Include awkward cases (adapted preferences, strategic inflation, intrapersonal change over time, non-omniscient applicator). Mark status (non-negotiable, negotiable, camp preference). Flag conflicting pairs.
      *   **User's Hypothesis:** Invariance under independent rescaling (cardinal unit comparability vs. full comparability) collides with priority to the worse off. Check this and Arrow-style impossibility.
      *   **Format:** Table (Requirement, Motivating Case, Status, Rules Out) + JSON object (conflicting_pair, weakest_link, minimum_information, open_question).
      *   **Constraint:** Skip full scorecard against named theories.

  2.  **Deconstruct the Problem:**
      *   This is a problem of *Social Choice Theory* applied to *Health Economics* (specifically Priority Setting).
      *   The core tension is between *welfarism* (maximizing total good) and *prioritarianism/egalitarianism* (helping the worst off), constrained by *informational limitations* (we don't have a "utilometer").
      *   The "defensible in plain language" constraint is crucial. It implies *Public Reason* or *Transparency*.
      *   The "independent rescaling" issue relates to the measurability and comparability of utility (Full Comparability vs. Cardinal Unit Comparability vs. Ordinal Non-comparability).

  3.  **Drafting Desiderata (Iterative Process):**

      *   *Idea 1: Comparability.* We need to compare Person A's pain to Person B's pain.
          *   Case: Hip replacement vs. Dialysis.
          *   Status: Non-negotiable.
          *   Rules Out: Pure ordinalism.

      *   *Idea 2: Adapted Preferences.* The "happy slave" or chronically ill person who reports high satisfaction despite low function.
          *   Case: Patient with long-term disability reports high QoL, but clinician sees severe limitation.
