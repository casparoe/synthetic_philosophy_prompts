answer: |-
  # Job Talk Prep Sheet: "Debunking Within Jurisdiction"

  **Context:** 50-minute talk, 20-minute Q&A.
  **Audience:** Mixed (Realists, Biologists, Political Phil, Constructivist, Religion).
  **Goal:** Survive the Q&A without collapsing the project; signal publishability.

  Below are the ten objections you are most likely to face, ordered by the probable flow of the conversation (clarifications → substantive pushes → "gotchas"). Each includes a scripted 90-second reply and a "weakness note" for your internal monitoring.

  ### Part 1: The Objections & Replies

  **1. The "Research Gap" Objection (Naturalist Realist)**
  *   **The Objection:** "You treat the lack of a current evolutionary explanation for the correlation between moral facts and beliefs as a defeater. But why isn't this just a research gap? We didn't always have an evolutionary explanation for mathematical reliability, but we didn't conclude math was debunked. Why is 'no available explanation' a reason to doubt the truth of the judgment rather than a reason to look harder?"
  *   **The Reply:** "That's a fair challenge, but the mathematical case is different because we have an independent story about why mathematical truths constrain survival—navigation, engineering, resource distribution. The moral case in the *out-of-domain* region lacks that bridge. My claim isn't that the correlation is impossible, but that without a selective story linking *this specific content* (e.g., duties to distant strangers) to fitness, the realist bears a burden of proof they haven't met. I'm not saying the correlation is false; I'm saying the *epistemic warrant* is missing until that story is told. The jurisdictional limit marks where the story stops working."
  *   **Weakness Note:** This concedes that if they *find* the story later, the debunking vanishes. It makes your view contingent on current evolutionary science, which feels unstable for a metaphysical claim.

  **2. The "Gerrymandering" Objection (Naturalist Realist)**
  *   **The Objection:** "Your 'ancestral domain' looks suspiciously like it was drawn to save the moral judgments you want to keep (kinship, local fairness) and debunk the ones you want to reject (borders, future generations). Isn't this just gerrymandering the domain to reproduce your antecedent politics under the guise of evolutionary science?"
  *   **The Reply:** "I understand the suspicion, but the Displacement Test is intended to be independent of the *value* of the judgment. It asks a counterfactual historical question: 'Could this situation have arisen in the Pleistocene?' not 'Do I like this judgment?' If tomorrow you showed me an in-domain judgment that was morally repugnant, my view says it survives debunking (though we might reject it on other grounds). Conversely, if an out-of-domain judgment is morally attractive, it still needs calibrated extension. The line is drawn by cognitive history, not political preference."
  *   **Weakness Note:** Hard to prove the Displacement Test isn't itself biased. If they press on specific edge cases (e.g., trade between bands), you might look like you're moving the goalposts.

  **3. The "Plasticity" Objection (Philosopher of Biology)**
  *   **The Objection:** "You're assuming a 'Pleistocene freeze' model of the moral faculty. But work in cultural evolution and niche construction suggests our moral capacities are highly plastic and co-evolve with institutions. There isn't a fixed proper function to map. If the faculty updates with the environment, your mismatch claim collapses."
  *   **The Reply:** "I agree the faculty isn't frozen, but plasticity itself has limits and a trajectory. Even if culture updates the software, the hardware constraints remain. The Displacement Test isn't about whether the *capacity* exists now, but whether the *selective pressure* that shaped the underlying mechanism could have tracked the specific truth conditions of modern institutions. Cumulative culture explains how we *generate* new norms, but it doesn't explain why those norms would track mind-independent moral facts in the new domain any better than chance."
  *   **Weakness Note:** You are fighting empirical fire with philosophical distinctions. If they have new data on rapid moral adaptation, you look out of touch.

  **4. The "Unfalsifiable Mismatch" Objection (Cognitive Scientist)**
  *   **The Objection:** "Mismatch claims are notoriously hard to falsify. Any time you find a modern judgment that looks adaptive, you can call it 'out-of-domain' and dismiss it. How do we test your Displacement Test empirically? If it's not falsifiable, it's not a scientific constraint on morality."
  *   **The Reply:** "It's a philosophical constraint on *epistemology*, not a scientific hypothesis about behavior. However, it is falsifiable in principle: if you can demonstrate a selective mechanism that specifically tracks, say, carbon emission levels or national border validity in ancestral environments, my claim fails. I'm arguing from the absence of such mechanisms. The burden is on the positive claim that selection tracked these abstract variables. Absent that, the default is skepticism about truth-tracking."
  *   **Weakness Note:** "Absence of evidence is not evidence of absence" is a cliché for a reason. They may find this dismissive of empirical rigor.

  **5. The "Truth-Tracking" Objection (Constructivist Generalist)**
  *   **The Objection:** "Your whole framework assumes morality is a truth-tracking faculty aiming at independent facts. But if morality is constitutive of practical reasoning or a social construct, evolutionary debunking is category mistake. You're asking if a hammer is 'true.' Why should we accept your realist framing to begin with?"
  *   **The Reply:** "Even if you're a constructivist, you still rely on intuitions to validate the construction procedures. If the intuitions feeding the constructivist machine are evolved heuristics for small-band cooperation, the output is still suspect when applied to global institutions. My argument works *even if* realism is false, because it targets the *warrant* for using these intuitions in new contexts. The jurisdictional problem is about reliability, not just metaphysics."
  *   **Weakness Note:** This is a stretch. If they are hardline constructivists, they won't care about "reliability" of truth-tracking. You might just be talking past them.

  **6. The "Religion Analogy" Objection (Religion Colleague)**
  *   **The Objection:** "You give morality a jurisdictional escape route for in-domain judgments. Do religious beliefs get the same pass? If ancestral humans evolved a 'god faculty' for social cohesion, are beliefs about local deities 'in-domain' and thus immune to debunking? If not, why is morality special?"
  *   **The Reply:** "That's an excellent question. On my view, religious beliefs about *supernatural agents* are likely out-of-domain because there were no such agents to track. The 'god faculty' might track social norms (in-domain), but not metaphysical truths. Morality is different because there *were* actual cooperative problems and cheaters in the ancestral environment. The moral faculty tracked real social facts; the religious faculty tracked posited ones. So religion gets less of a pass."
  *   **Weakness Note:** This commits you to a specific view of religious cognition that might be controversial. It also risks alienating the colleague if they think religion *does* get a pass.

  **7. The "Political Paralysis" Objection (Search Chair/PolPhil)**
  *   **The Objection:** "Let's say you're right. Borders and climate duties are debunked. What are we supposed to *do*? Policy can't wait for 'calibrated extension' to finish its work. Are you telling political philosophers to stop working on non-ideal theory because it's epistemically suspect?"
  *   **The Reply:** "Not at all. I'm saying we need to change our justificatory basis. Stop appealing to 'it feels wrong' for out-of-domain cases. Start arguing from in-domain principles plus empirical facts. For climate: 'Suffering is bad' (in-domain) + 'CO2 causes suffering' (empirical). We can still do policy, but we must be honest that the intuition of 'duty to the future' is a heuristic, not a direct perception of value. It makes the argument more fragile, but more honest."
  *   **Weakness Note:** The Chair might hear "more fragile" as "useless for policy." They want robustness; you're offering transparency.

  **8. The "Calibrated Extension Sufficiency" Objection (Chair/Realist)**
  *   **The Objection:** "Your 'calibrated extension' chains in-domain principles to empirical premises. But complex institutional design requires trade-offs between values that only intuition can resolve. How does 'suffering is bad' tell us how to weight liberty against security in a pandemic? You've debunked the tool we need to solve the problem."
  *   **The Reply:** "I grant it doesn't solve every trade-off automatically. But it filters out bad arguments. If a policy relies on a 'sacred border' intuition, that's out. If it relies on 'preventing local violence,' that's in. It narrows the solution space. It doesn't guarantee a unique answer, but it guarantees the answer isn't based on a cognitive illusion. That's a net gain for political philosophy, even if it's not an algorithm."
  *   **Weakness Note:** Admitting it's not an algorithm weakens the "replacement procedure" claim. It might look like you've debunked intuition but offered nothing substantial in return.

  **9. The "Self-Application" Objection (The Gotcha)**
  *   **The Objection:** "Your distinction between in-domain and out-of-domain is itself a highly theoretical judgment about a cognitive faculty, reached very recently using complex reasoning. By your own criteria, this theory is out-of-domain. Isn't your paper self-debunking?"
  *   **The Reply:** "The debunking argument targets *moral* judgments that claim to track normative facts. My paper is a *meta-ethical* claim about the reliability of those judgments. It relies on logical coherence and empirical premises, not moral intuition. The self-application worry only holds if *all* reasoning is debunked. I'm arguing that *moral* reasoning is jurisdiction-limited, not that *causal* or *logical* reasoning is. The tools I use to build the theory are in-domain cognitive capacities (basic logic, causal inference) that weren't debunked."
  *   **Weakness Note:** This is the weakest link. If they press that meta-ethics is also a "theoretical judgment" susceptible to evolutionary bias, you have no non-circular defense. (See analysis below).

  **10. The "Independence Premise" Objection (Naturalist Realist)**
  *   **The Objection:** "Your dilemma rests on the claim that if moral facts aren't independent of our responses, they aren't the facts anyone wanted. But why? A response-dependent realism could survive your debunking. If the facts are constituted by our idealized responses, evolution shaping those responses just *makes* the facts."
  *   **The Reply:** "If the facts are constituted by our responses, then the 'truth' is just whatever we would agree upon. But my argument shows our agreement is driven by ancestral heuristics in the out-of-domain region. So the 'facts' would be arbitrary relative to our evolutionary history. Most realists want facts that constrain us, not facts that are projections of our Pleistocene biases. I'm arguing that response-dependence in the out-of-domain region yields results we shouldn't endorse, even on response-dependent terms."
  *   **Weakness Note:** You are defining "facts anyone wanted" in a way that excludes response-dependence. They may reject your definition of realism.

  ***

  ### Part 2: Strategic Advice

  **1. What to Concede Preemptively (In the Talk)**
  *   **The "Political Paralysis" Worry:** Do not wait for the Chair to ask this. In your conclusion, explicitly state: *"This view does not entail political nihilism. It entails a shift in justification from intuition to calibrated extension."* Give one concrete example (e.g., climate change) during the talk. If you leave the impression that you are dismantling applied ethics without a replacement, the political philosophers will eat you alive.
  *   **The Empirical Fallibility:** Concede that the "ancestral domain" is an approximation. Say: *"I am not claiming perfect knowledge of the Pleistocene. I am claiming that the burden of proof lies on those who think selection tracked modern institutional variables."* This disarms the Biologist's "Unfalsifiable" objection before they launch it.

  **2. What NOT to Concede**
  *   **The Truth-Tracking Framing (Constructivist):** Do not concede that your argument *requires* robust realism. If you say, "Well, if you're a constructivist, this doesn't apply," you lose half the room and make the paper look niche. Hold the line that *warrant* is the issue, regardless of metaphysics. If you concede this, the "Jurisdiction" claim loses its force because constructivists don't care about tracking.
  *   **The Self-Debunking Charge:** Do not say, "That's a problem I'm still working on." That sounds like the project is broken. You must assert the distinction between *moral* epistemology and *general* epistemology confidently, even if it's shaky.

  **3. The Publishability Bottleneck**
  *   **The Single Most Important Objection:** **The "Gerrymandering" Charge.**
  *   **Why:** If referees believe the "ancestral domain" is drawn arbitrarily to save your preferred moral conclusions, the paper is dead on arrival. It looks like motivated reasoning.
  *   **Action:** In the paper (and talk), you need to make the **Displacement Test** as mechanical and value-neutral as possible. Emphasize that it is a *historical counterfactual*, not a *moral filter*. If you can convince them the test is objective, the paper survives.

  ***

  ### Part 3: The Self-Application Worry (Internal Assessment)

  **Should you be afraid?**
  **Yes.** This is the most dangerous question for the Q&A because it sounds like a "checkmate" to the audience, even if it's philosophically debatable. It undermines your authority to deliver the verdict.

  **Estimated Damage:**
  *   **To the Talk:** High. If you fumble this, you look like you haven't thought through the implications of your own skepticism.
  *   **To the Paper:** Moderate. Referees are used to self-referential objections in metaethics and often accept standard "meta-level" defenses.

  **The Least-Bad Reply (Refined):**
  Do not rely on the "Morality vs. Logic" distinction alone. Instead, argue that the theory is **instrumentally vindicated**.
  *   *Script:* "The theory isn't claiming to be a moral truth; it's claiming to be a useful tool for assessing moral claims. Even if the theory itself is a product of evolution, its utility doesn't depend on its own 'moral truth.' It depends on whether it helps us avoid error. If using this framework leads to more consistent, empirically grounded policy than relying on raw intuition, it survives on pragmatic grounds, even if its own genesis is evolutionary."
  *   *Why this works:* It sidesteps the need for the theory to be "in-domain" in the same way moral judgments are. It treats the theory as a *technology* for thinking, not a *moral verdict*.

  **Final Note:**
  You have a strong, distinctive thesis. The "Jurisdiction" move is your selling point. Don't let them talk you into a global debunking argument (which is old news) or a global realism defense (which ignores the science). Keep them focused on the *boundary line*. That is where your contribution lies. Good luck.
