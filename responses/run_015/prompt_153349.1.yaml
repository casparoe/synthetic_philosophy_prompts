  please draft teh exam question (for a 90-minute essay), a model answer of about 500-600 words, and a marking scheme out of 20 points. teh scheme should separate an A from a B by listing specific moves — e.g., spotting that causal tracking isn't rational grasp, avoiding teh mistake of conflating justification with reliability, and actually answering teh value question rather than just redescribing it. also, please say what would change your mind here: which objection or argument would make you drop teh claim that plato's answer survives in this black-box case?
