      *   *Current Rule:* Heritable (to co-residents) but Inalienable (cannot sell).
      *   *Implication:* The benefit is tied to *housing security* for a specific *household unit*, not to *wealth accumulation* for an individual.
      *   *View of Interest:* It treats the tenancy as a personal right of occupancy (status-based) rather than a property right (asset-based). It prioritizes stability and preventing displacement over economic efficiency or capitalization of the subsidy.
      *   *Why Co-residents?* To preserve the household unit and prevent speculation. It ensures the benefit stays with those who actually live there, not investors.
      *   *Freely Transferable:* This would treat the tenancy as property/asset. It would allow tenants to capture the surplus value (the difference between controlled and market rent).
      *   *What would be lost?* The goal of affordable *occupancy*. If transferable, the unit might go to the highest bidder (who pays the tenant the key money), potentially defeating the purpose of keeping housing affordable for the original demographic. It creates a market for the subsidy itself.
