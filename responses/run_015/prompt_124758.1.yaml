          *   Players: The Apartheid State (collective), White Citizens (beneficiaries).
          *   Fit: Strong, but transformed. It wasn't imposed by a victor (like Germany); it was negotiated.

      *   *Moral Guilt:*
          *   Jaspers: Individual conscience. Did I do enough? Did I stay silent?
