      *   *Moral:* Personal conscience. Actions taken or not taken. Individual. Adjudicated by self/God/friends.
      *   *Metaphysical:* Solidarity of all humans. Failure to prevent suffering when possible. Collective/Universal. Adjudicated by God.

  3.  **Map the TRC onto Jaspers:**

      *   *Criminal Guilt:*
          *   Jaspers: Courts, individual.
          *   TRC: Amnesty was granted *if* full disclosure was made and the act was political. This bypassed criminal guilt for many. Ordinary crimes (not politically motivated) were still prosecutable.
          *   Players: Individual perpetrators (security force, activists).
