          *   TRC: Ubuntu philosophy. "I am because we are." Harm to one is harm to all.
          *   Players: Everyone.
          *   Fit: Surprisingly strong, but rooted in African humanism rather than German existentialism.

  4.  **Critique the Framework (Where it Breaks):**
