answer: |-
  Here is the conceptual diagnosis you need for your paper.

  ### 1. The Core Diagnosis: It is a Clash of Theoretical Virtues, Not Just Facts
  The debate is stalled not because philosophers are stubborn, but because Lewis and Kripke are optimizing for different **theoretical virtues**. It is a **meta-metaphysical disagreement** about what counts as a good explanation, rather than a first-order disagreement about what exists.

  *   **Lewis (Counterpart Theory)** prioritizes **logical parsimony and extensionalism**. He wants a system where identity is strict (A=A) and never violates the Indiscernibility of Identicals. To save logic, he sacrifices the intuition that *you* are literally in other worlds. He treats "possible worlds" as concrete, isolated universes.
  *   **Kripke (Transworld Identity)** prioritizes **modal intuition and direct reference**. He wants a system that matches how we actually speak and think (e.g., "I could have been a doctor"). To save this intuition, he accepts "primitive transworld identity" (or haecceities)—the idea that there is a "this-ness" to you that persists across worlds without needing qualitative reduction. He treats "possible worlds" as abstract states of affairs.

  **Why it stalls:** You cannot prove one set of virtues is superior to the other without begging the question. If you value logical cleanliness, Lewis wins. If you value intuitive directness, Kripke wins. There is no neutral ground to adjudicate which virtue matters more.

  ### 2. Is it "Verbal"? (Your Second Hypothesis)
  You asked if they just mean different things by "same person." **Yes, but it matters.**

  In contemporary metaphysics, this is often classified as a **quasi-verbal dispute**.
  *   **Lewis** defines identity as strict spatiotemporal continuity. Under this definition, transworld identity is impossible by definition.
  *   **Kripke** defines identity as rigid designation of an essence. Under this definition, transworld identity is necessary.

  However, it is not *merely* verbal like arguing over whether a "bank" is a river edge or a financial institution. The choice of definition has **downstream consequences**.
  *   If you choose Lewis, you solve problems in logic and semantics regarding substitution salva veritate (substituting terms without changing truth value).
  *   If you choose Kripke, you solve problems in philosophy of mind and ethics regarding personal responsibility across possibilities.

  Because the choice of definition changes the solutions to *other* philosophical problems, the dispute is substantive enough to keep going, but verbal enough that no empirical fact can settle it.

  ### 3. "Modal Anchoring" (Your Third Hypothesis)
  You asked if "modal anchoring" is the hidden issue. You have intuitively identified the real problem, though **"Modal Anchoring" is not standard terminology.** The technical term for what you are sensing is **The Problem of Transworld Identification** or **Individuation**.

  *   **The Issue:** How do we "lock on" to an object in another world?
  *   **Kripke's View:** We don't need a criterion. We stipulate. When we say "Nixon could have lost," we are talking about *Nixon*. The object is anchored by its origin or essence (Kripke hints at causal-historical chains).
  *   **Lewis's View:** Stipulation is magic. We need a criterion. The anchor is **qualitative similarity**. We look for the person in another world who is most similar to Nixon.

  **Why this fuels the stall:** Kripke argues that Lewis's similarity metric yields wrong results (e.g., a perfect duplicate of you in another world isn't *you*). Lewis argues that Kripke's stipulation is mysterious (how do you "point" to something that doesn't exist?). Neither can force the other to accept their method of "anchoring."

  ### 4. What About Local-World Index vs. Global Similarity? (Your First Hypothesis)
  This is partially correct but secondary.
  *   Lewis does treat "actual" as indexical (I am here, this world is actual to me).
  *   However, the stall isn't about the index; it's about the **ontology of the worlds**.
  *   Lewis believes other worlds are **concrete** (just as real as this one, but far away).
  *   Kripke believes other worlds are **abstract** (like stories or sets of propositions).

  If worlds are concrete, you can't be in two places at once (Lewis). If worlds are abstract descriptions, you can be the subject of multiple descriptions (Kripke). The disagreement about identity flows from the disagreement about what a "world" *is*.

  ### 5. What Would Break the Deadlock?
  Since this is metaphysics, no experiment (like a physics test) will settle it. However, a deadlock breaker would look like one of two things:

  1.  **Pragmatic Utility (The "Work" Argument):**
      One side would need to demonstrate that their framework solves *unrelated* problems better than the other.
      *   *Example:* If Counterpart Theory turned out to be necessary for making sense of Quantum Mechanics (e.g., Many-Worlds Interpretation), Lewis would win by default.
      *   *Example:* If Transworld Identity turned out to be required for a coherent theory of Moral Responsibility (you can only be blamed for what *you* could have done, not what a counterpart could have done), Kripke would win.
      *   *Current Status:* Both sides have made these claims, but neither has proven their framework is *indispensable*.

  2.  **Dissolution (The "Anti-Realist" Move):**
      The deadlock is most likely to be broken by a third party claiming **both are wrong**.
      *   **Modal Fictionalism** or **Expressivism** argues that we shouldn't ask if counterparts or transworld identities are "real." We should just treat modal talk as a useful tool for discussing concepts, not describing reality. If this view gains traction, the Lewis/Kripke debate dissolves because the presupposition (that worlds exist in some way) is rejected.

  ### Summary for Your Paper
  The debate is stalled because it is a **trade-off between logical rigor (Lewis) and modal intuition (Kripke)**. It is a **quasi-verbal dispute** with substantive downstream effects. Your intuition about "modal anchoring" is correct in concept (it is the **Problem of Transworld Identification**), but the deadlock persists because Lewis anchors via **similarity** and Kripke anchors via **stipulation/essence**, and neither can prove their anchoring method is the only valid one without assuming their own metaphysics first. The only way to break it is to show one system is pragmatically indispensable for science/ethics, or to reject the realism of both.
