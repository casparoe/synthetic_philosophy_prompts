answer: |-
  **PREP SHEET: DISPOSITIONS, WINDOWS, AND INTERFERERS**
  **To:** Self
  **From:** Metaphysics Colloquium Q&A Strategy
  **Context:** Humean-heavy room (Lewis/RCA), 2 Powers theorists, 1 Interventionist.

  ---

  ### TOP 7 OBJECTIONS (Ordered by Damage)

  **1. The Admissibility Circle (Humean)**
  *   **Voice:** "You've indexed dispositions to a 'contrast class of admissible interferers.' But how do you define 'admissible' without already knowing which dispositions are present? If you rule out interferers by stipulating they aren't 'admissible' when the disposition holds, haven't you just made the analysis trivial? You've pushed the modality into the ceteris paribus clause."
  *   **90-Second Reply:** "I concede 'admissibility' isn't defined by disposition-free vocabulary. But that's not circularity; it's structural. Think of it like reference classes in probability. We don't say probability is trivial because it's relative to a class. Here, the class is fixed by the *causal structure* of the situation, not the disposition itself. The unity thesis shows finks and masks share the same structural location relative to the stimulus-manifestation interval. We aren't reducing modality away; we're mapping its topology."
  *   **Soft Spot:** You haven't given the Humeans the reduction they want. You've admitted the analysis isn't purely categorical.

  **2. The Redundancy Claim (Interventionist)**
  *   **Voice:** "Why do we need 'dispositions' indexed to windows? My framework says: Variable X (stress) leads to Y (shatter) unless Variable Z (plasticizer) intervenes. Your 'manifestation window' is just the duration of my experimental intervention. Your 'interferer' is just a confounding variable. What metaphysical work is the disposition doing here?"
  *   **90-Second Reply:** "Interventionism tells us *how to test* for causal relations, but it doesn't tell us *what grounds* the invariance. The disposition is the truthmaker for the invariance claim. Without the disposition, the invariance is a brute regularity. My schema explains *why* the intervention fails in mask cases (the ground is present but blocked) versus fink cases (the ground is removed). You need the ontology to make sense of the intervention data."
  *   **Soft Spot:** The Interventionist doesn't care about truthmakers. They might accept the data without the ontology.

  **3. The Intrinsicality Problem (Humean/Lewisian)**
  *   **Voice:** "Lewis insisted dispositions must be intrinsic. By indexing them to a 'contrast class of interferers,' you've made fragility relational. Whether the glass is fragile now depends on what plasticizers exist in the environment. That violates the categorical basis requirement."
  *   **90-Second Reply:** "The *basis* remains intrinsic—the cross-linking in the polymer. The *ascription* is context-sensitive. This distinguishes the property from the predicate. We do this with 'flat' (flat for a table vs. flat for a mirror). The disposition is intrinsic; the truth conditions of our ascription are sensitive to the environment. This handles masks without denying the intrinsic base."
  *   **Soft Spot:** Lewisians often think the *property* itself must be intrinsic, not just the base. You're walking a fine line.

  **4. The 'CA is Dead' Charge (Powers Theorist)**
  *   **Voice:** "You're polishing the Conditional Analysis, but the project is dead. Dispositions are metaphysically basic. Tweaking the antecedent conditions doesn't explain the *power* itself. You're treating symptoms, not the disease. Why not just admit powers are primitive?"
  *   **90-Second Reply:** "I'm not trying to eliminate powers; I'm trying to clarify their logic. Even if powers are basic, we need to know how they interact with interference. My schema works whether the base is categorical or powerful. It shows that finks and masks are structurally identical regarding timing. That's a win for your view too—it clarifies how powers are preempted versus removed."
  *   **Soft Spot:** They think CA is a category error. You're treating it as a fixable tool.

  **5. The Self-Cancelling Contradiction (Powers Theorist)**
  *   **Voice:** "In your polymer case, the exudation is an *exercise* of the disposition that *prevents* the manifestation. A power aims at its manifestation. If it prevents itself, is it still that power? You're describing two competing powers, not one masked disposition."
  *   **90-Second Reply:** "It's a multi-track disposition. The power is to 'respond to stress.' Usually, that means shattering. In this specific structural context, it means exuding. The manifestation is the response, not necessarily the break. The indexing handles this: the window for 'shattering' is closed because the window for 'exuding' opened first. It's one complex power, not two."
  *   **Soft Spot:** Requires accepting multi-track dispositions, which some powers theorists dislike.

  **6. The Modal Load (Humean)**
  *   **Voice:** "You say you handle reduction. But your 'admissible interferers' clause requires laws about those interferers. Where do those laws come from? If they're Humean laws, you're fine. If they're dispositional, you haven't reduced anything. You've just added more modal baggage."
  *   **90-Second Reply:** "The laws governing interferers are standard Humean best-system laws. They describe regularities of the plasticizer, not the glass. I'm not adding modal baggage; I'm specifying the boundary conditions for the disposition ascription. The reduction holds because the interferer laws are categorical regularities."
  *   **Soft Spot:** If the interferer itself is dispositional (e.g., a magic spell), your reduction stalls.

  **7. The Slow-Fink Slicing (General/Technical)**
  *   **Voice:** "In the slow-fink case, the basis decays after a delay. Isn't this just the object changing kinds? Why call it a disposition problem? It's just temporal parts. Object-at-t1 is fragile; Object-at-t2 is not."
  *   **90-Second Reply:** "Because the stimulus happens at t1, but the decay completes at t2. The disposition must hold *during* the process. If we slice by temporal parts, we lose the causal continuity. The indexing to a 'manifestation window' captures this continuity without needing vague temporal boundaries."
  *   **Soft Spot:** Temporal parts theorists will insist slicing is the only coherent way to handle change.

  ---

  ### STRATEGIC BOUNDARIES

  **What to Concede (First 2 Minutes):**
  1.  **No Magic Reduction:** Concede that this does not provide a *non-modal* reduction of dispositions for the hardline Humeans. Acknowledge that "admissibility" carries modal weight.
  2.  **Interventionist Utility:** Concede that the Interventionist's framework is the best *method* for detection. You are offering the *ontology* that underwrites their method.
  3.  **Context Sensitivity:** Admit that disposition ascriptions are context-sensitive. Don't fight the linguistic data.

  **What to Hold (No Matter What):**
  1.  **The Unity Thesis:** Finks and masks are structurally the same problem (timing/direction of interference). Do not let them separate these into distinct puzzles.
  2.  **The Indexing Necessity:** You cannot solve these cases without indexing to windows and contrast classes. The standard RCA fails here.
  3.  **The Polymer Case:** The self-cancelling mask is a genuine phenomenon that existing theories mishandle. Your schema handles it.

  **The Question You Hope Nobody Asks:**
  *"If the admissibility of an interferer depends on the causal structure, and the causal structure depends on the dispositions present, haven't you just created a coherentist circle where nothing is actually analyzed, only systematized?"*
  (Why it's deadly: It attacks the core claim that this is an analysis rather than a description. It forces you to admit you're doing metaphysics of science, not reductive metaphysics.)
