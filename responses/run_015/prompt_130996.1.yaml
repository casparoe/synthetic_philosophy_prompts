      *   *Key Concept:* *Amour-propre* (self-love) as the driver of tyranny.
      *   *Key Distinction:* Truth vs. Peace. The Church has Truth; the State keeps Peace.

  6.  **Final Review against User Questions:**
      *   Internal coherence? (Yes, but watch the Orders).
      *   Projecting structure? (Yes, slightly, needs nuance).
      *   Defensible importation? (Yes, via Anthropology).
      *   Analogs in polemics? (Yes, Formulary submission).
