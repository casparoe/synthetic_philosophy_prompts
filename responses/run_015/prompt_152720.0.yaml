answer: |-
  ### Agenda Prioritization: The Epistemic Threshold and Boundary Conditions

  In allocating limited intellectual and institutional resources to the problem of historical judgment, the **Conceptual Task (Epistemic Threshold)** must be treated as the primary upstream priority, followed closely by the **Boundary-Condition Problem**. The **Asymmetry Problem** and **Institutional-Design Question** should be deprioritized as downstream applications that depend on the resolution of the first two.

  This ordering is defended based on three criteria: **dependency relations** (logical precedence), **tractability** (availability of methods), and **magnitude of error** (consequences of getting it wrong).

  #### 1. Primary Priority: The Epistemic Threshold (Conceptual Task)
  **Why it is upstream:** This is the keystone question. It asks: *What counts as "knowing better"?* Without a rigorous definition of moral accessibility, the other three questions lack a metric.
  *   **Dependency:** You cannot determine if praise and blame are symmetric (Q2) until you define the baseline of access. You cannot decide whether to remove a monument (Q3) until you have established whether the figure failed a moral test. You cannot assess the agency of the enslaved (Q4) without a standard for what agency looks like in that context. Q1 provides the variable that populates the equations of Q2, Q3, and Q4.
  *   **Tractability:** This is the most solvable of the four using current tools. Intellectual history, digital humanities, and network analysis allow us to map the circulation of dissenting ideas (e.g., anti-slavery tracts in the 18th century) with increasing precision. We can move from vague "spirit of the age" claims to concrete data on who read what, and who corresponded with whom.
  *   **Magnitude of Error:** High. If the threshold is set too low, the framework becomes an apologetic tool for atrocity (excusing everything as "normal"). If set too high, it collapses into presentism (condemning everyone for not being modern liberals). Getting this wrong invalidates the entire enterprise.

  #### 2. Secondary Priority: The Boundary-Condition Problem (Non-Elite Actors)
  **Why it is upstream:** This is the validity check for the Epistemic Threshold. A theory of historical judgment that only works for literate, male elites is not a theory of history; it is a theory of privilege.
  *   **Dependency:** This tests the universalizability of Q1. If the epistemic threshold defined in Q1 cannot be applied to non-elites without becoming absurd (either condescending or impossibly demanding), then the definition in Q1 is flawed and must be revised. It forces Q1 to be robust across class, race, and gender lines.
  *   **Tractability:** Difficult, but newly viable. "History from below," oral history methodologies, and archival recovery projects (e.g., slave narratives, court records of the poor) provide more data than ever before. It requires interdisciplinary collaboration between philosophers and social historians.
  *   **Magnitude of Error:** High. Failing here reinforces the very exclusion the critique of historical figures often seeks to address. It risks creating a moral framework where only the powerful are held accountable, while the oppressed are treated as moral children.

  #### 3. Deprioritized: Asymmetry and Institutional Design
  **The Asymmetry Problem (Q2)** should be deprioritized because it is logically subordinate to Q1. Once we establish what knowledge was accessible, the question of whether to praise "ahead-of-time" thinkers is a matter of weighting, not definition. It is a nuance of the grading rubric, not the construction of the rubric itself. Philosophical debate here is valuable but does not unlock the other questions.

  **The Institutional-Design Question (Q3)** should be deprioritized *as a philosophical research priority*. This is not because it lacks practical importance, but because it is context-dependent. Whether a statue comes down or a plaque is added depends on local law, community consensus, and specific historical facts that Q1 and Q4 will illuminate. Investing heavily in a universal theory of monument removal before solving Q1 is putting the cart before the horse; it leads to policy inconsistency. Policy-makers should wait for the scholars to settle Q1.

  ### Confidence and Uncertainty

  **Confidence Level:** I am **85% confident** in this agenda ordering. The logical dependency of the other three questions on the Epistemic Threshold is robust; without a standard of access, judgment is arbitrary.

  **Least Certain Claim:** My least certain claim is an **empirical one regarding the Boundary-Condition Problem (Q4)**. Specifically, I am uncertain about the *recoverability of non-elite moral networks* in the pre-modern era.

  While I argue Q4 is a priority, there is a significant risk that the archival silence surrounding enslaved or colonized populations is too profound to allow for the same kind of epistemic mapping we can perform for elites like Jefferson. If we cannot empirically reconstruct the "dissenting traditions" available to a slave in 1750 with any fidelity, the Epistemic Threshold (Q1) may remain theoretically sound but practically inapplicable to the very group needed to test its validity. This empirical limitation could force a retreat to a dual-track system of judgment (one for elites, one for non-elites), which would undermine the philosophical unity of the framework.
