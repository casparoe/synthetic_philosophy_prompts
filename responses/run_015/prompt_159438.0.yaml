answer: |-
  I'll take the second horn, but I deny it cuts as deep as you claim. For that volume of data, the fit gain from distinguishing the epochs swamps the simplicity cost of adding a parameter, so the best system does assign 0.9 in the first epoch. Now, you say the agent can't have this chance proposition as evidence because its truth-makers lie in her future. But you're conflating the metaphysics of truth with the epistemology of evidence. The Principal Principle tells me how to set my credence in outcomes *conditional on* the hypothesis that the chance is 0.9; it doesn't require me to know that hypothesis as a fact. I infer the chance from the local frequencies available to me, just as I infer the existence of electrons from cloud chambers, even if the truth-makers for both are remote from my immediate experience. The chance is hard to know with certainty, sure, but not inadmissible, and the PP still norms the relationship between my partial belief in the chance and my partial belief in the outcome, guiding my updates even if I never reach certainty.

  So, let's press on your alternative. You seem to think objective chance ought to be a "good guide" in the sense of tracking local frequencies or being transparently knowable to the agent. But if you reject the Humean view, what makes the chance 0.9 in that first epoch if not the pattern of outcomes? If you posit a primitive propensity, haven't you just pushed the epistemic problem back a step, since the agent still can't see propensities directly? Sharpen this for me: is your worry really about future-dependence, or is it that you want chance to guarantee predictive success in a way no objective magnitude could?
