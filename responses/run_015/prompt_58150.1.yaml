  **Score: 1**
  **Justification:** This generates a **contradiction in conception**, as universalizing false promising would destroy the institution of trust required for promises to be meaningful, making the action itself impossible.

  **2. Maxim B: I will submit AI-drafted reports as my own work without disclosure in order to appear more competent, while expecting colleagues to disclose their AI use when I rely on their reports.**
  **Score: 2**
  **Justification:** This creates a **contradiction in conception** because universal deception regarding authorship collapses professional trust, and the maxim is logically incoherent as a universal law since it demands others follow a rule the agent exempts themselves from.

  **3. Maxim E: I will refuse to provide easy rescue to strangers in emergencies when helping would cost me only minor inconvenience, in order to preserve my own time.**
  **Score: 3**
  **Justification:** This yields a **contradiction in will**, because while a world without aid is conceivable, a rational agent cannot consistently will it since they might themselves require assistance in the future.

  **4. Maxim A: When I am in a hurry, I will leave shared spaces untidy for others to clean up.**
  **Score: 4**
  **Justification:** This involves a **contradiction in will**, as a rational agent cannot will a universal standard of neglect that renders cooperative environments unusable or hostile to their own future needs for order.

  **5. Maxim D: I will donate a share of my income to charity only when the donation will be publicly acknowledged.**
  **Score: 7**
  **Justification:** This maxim presents **no universalizability problem** under the Formula of Universal Law, as the action of donating remains possible and beneficial even if motivated by vanity, falling within the permissible latitude of imperfect duty.
