answer: |-
  This is an exceptionally clear formulation of the evolutionary debunking dilemma, effectively synthesizing Sharon Street's "Darwinian Dilemma" with Justin Clarke-Doane's worries about generality and self-undermining. You have correctly identified that the argument, as stated, is *too* successful: if it works for morality, it works for the very reasoning used to establish it.

  Per your request, I will first brainstorm four distinct diagnoses of where the argument fails, detailing the theoretical cost of each. I will then defend the diagnosis I take to be strongest, address your specific worries about individuation and third-factors, and offer a revised formulation that preserves your anti-realist conclusion without collapsing into global skepticism.

  ### Four Candidate Diagnoses

  #### 1. The Modal Security Diagnosis (Reject Premise 2: Tracking)
  **Diagnosis:** The Tracking principle is false. A belief can be justified even if it does not counterfactually track the truth, provided we have no independent reason to think the belief is false. This is the "Modal Security" view (championed by Katia Vavova). Genealogy alone does not undermine justification; it only does so if it provides a *defeater* (a reason to think the belief is false).
  **Why it looked acceptable:** Sensitivity and safety conditions are standard in epistemology. It seems intuitive that if a belief is held regardless of its truth, it is accidentally true, and accidental truth is incompatible with knowledge/justification.
  **The Cost:** You must revise your argument for (4). On this view, the genealogical story *by itself* does not prove moral beliefs are unjustified. You must add a premise that we have *independent reason to doubt* moral realism (e.g., peer disagreement, queerness) for the genealogy to act as a defeater. This weakens the "clean" force of the debunking argument; it becomes a two-step process (Genealogy + Independent Doubt) rather than a direct knockout.

  #### 2. The Third-Factor Diagnosis (Reject Premise 3: Independence)
  **Diagnosis:** The Independence premise is false. Moral facts and evolutionary pressures are not independent; they are correlated via a "third factor" (e.g., survival, welfare, or rationality). For example, if "survival is good" is a moral truth, and evolution selects for survival, then evolution tracks moral truth.
  **Why it looked acceptable:** Realists (like David Enoch or Chris FitzPatrick) argue that we can posit a pre-established harmony between fitness and truth without begging the question, provided the third factor is not itself a contested moral claim but a normative prerequisite of agency.
  **The Cost:** You must surrender your anti-realism. This diagnosis saves epistemology by saving Moral Realism. It concedes that moral facts *do* explain our beliefs (indirectly), thereby blocking the "bypassing" claim's force. Since you explicitly want to keep (4) (that realism is in trouble), this diagnosis is substantively incompatible with your project.

  #### 3. The Epistemic Exceptionalism Diagnosis (Reject Premise 5: Generality)
  **Diagnosis:** The move from (4) to (5) is invalid. Epistemic norms (logic, abduction) are *constitutive* of rational evaluation, whereas moral norms are not. We cannot evaluate the reliability of our cognitive equipment without using that very equipment, creating a pragmatic circle that is virtuous rather than vicious. Moral norms lack this transcendental status.
  **Why it looked acceptable:** It seems obvious that we must use logic to argue against logic. The self-undermining worry (6) suggests that global skepticism is incoherent. Distinguishing domains allows us to be local skeptics (about morality) without global suicide.
  **The Cost:** You must defend a principled distinction between moral and epistemic norms against charges of ad hocery. Critics (like Clarke-Doane) argue that if evolution explains why we believe *modus ponens*, the challenge is structurally identical to the moral case. You pay the price of "Epistemic Exceptionalism": you must argue why epistemology is immune to genealogical scrutiny in a way morality is not, without simply stipulating it.

  #### 4. The Grain/Individuation Diagnosis (Reject the Inference from 1 to 4)
  **Diagnosis:** The genealogical stories in (1) explain the *capacity* for moral judgment or very general tendencies (e.g., "care for kin"), but not the specific *content* of our moral beliefs (e.g., "slavery is unjust"). Therefore, the beliefs are not fully "bypassed." There is room for rational reflection to refine the coarse evolutionary input into justified specific beliefs.
  **Why it looked acceptable:** As you noted, selection explains why we have a disgust system, not necessarily why we believe *specific* bodily acts are immoral. If the specific beliefs are shaped by reasoning, they might track truth even if the capacity is evolutionary.
  **The Cost:** You pay an empirical burden. You must show that evolutionary pressures determine the *specific* content of moral beliefs sufficiently to rule out truth-tracking. If realists can show that specific moral beliefs are the result of "reflective equilibrium" rather than direct evolutionary programming, the debunking argument loses its grip on the specific beliefs realists hold. It turns the argument from a conceptual knockout into an empirical contest.

  ---

  ### The Strongest Diagnosis: Epistemic Exceptionalism (Reject 5)

  I recommend you adopt **Diagnosis 3: Reject Premise 5 (Generality)**.

  While the Modal Security view (Diagnosis 1) is technically sophisticated, it requires you to weaken your moral debunking argument by adding independent defeaters. The Epistemic Exceptionalism diagnosis allows you to keep the core force of the moral debunking argument intact while blocking the self-undermining slide into global skepticism. It directly addresses your worry in step (6) that the argument "takes itself down."

  **Why this is the strongest move:**
  The self-undermining worry relies on the assumption that epistemic norms and moral norms are relevantly similar with respect to genealogical scrutiny. They are not. Epistemic norms are *constitutive* of the activity of assessing genealogies. To argue that abduction is unjustified is to use abduction to argue that abduction is unjustified. This is not merely a pragmatic contradiction; it is a transcendental condition of having a view at all.

  Moral norms, by contrast, are not constitutive of reasoning. One can reason perfectly well without accepting any specific moral norm. Therefore, a genealogical explanation of moral beliefs can undermine their justification (because they are objects of evaluation) without undermining the justification of the evaluation itself (because those tools are presupposed).

  **What you pay for this:**
  You must articulate *why* epistemic norms are exceptional without begging the question. You cannot simply say "Logic is special." You must argue that epistemic norms are the *medium* of justification, whereas moral norms are the *object*.
  *   **The Cost:** You invite the "Darwinian Dilemma for Epistemology" (Clarke-Doane). You must be prepared to argue that even if evolution shaped our logical intuitions, the *validity* of logic is not what is at stake, but our *access* to it. You must maintain that the constitutive role of epistemic norms insulates them from debunking in a way that non-constitutive moral norms are not. This requires a commitment to a form of **Constitutivism** about epistemic normativity.

  ### Addressing Your Specific Confusions

  **1. The Individuation Worry:**
  You asked: *"Does the argument need the genealogy to explain the belief at the fine grain, and can it get that?"*
  If you adopt the Epistemic Exceptionalism diagnosis, this worry becomes less critical for the *structure* of the argument, but remains critical for the *moral* conclusion.
  *   **Resolution:** The debunking argument does not need to explain every specific judgment (e.g., "tax rate X is unjust"). It only needs to explain the *foundational intuitions* (e.g., "fairness matters," "harm is bad") upon which specific judgments are built. If the foundational inputs are bypassing, the output of reflective equilibrium is tainted, even if the processing is rational. You do not need fine-grained evolutionary psychology for every specific belief; you need it only for the "bedrock" intuitions that constrain reflection.
  *   **Cost:** You concede that some specific moral beliefs might be justified if they are derived from non-evolutionary premises. Your skepticism becomes targeted at *foundational* moral realism, not necessarily every derivative moral claim.

  **2. The Third-Factor/Question-Begging Worry:**
  You asked: *"The standard escape... seems available only if I may help myself to first-order moral claims... the argument starts to look question-begging."*
  You are correct. In a dialectical context (arguing against a realist), positing a third factor (like "welfare is good") *is* question-begging because the realist and anti-realist disagree on the status of welfare.
  *   **Resolution:** By rejecting (5) instead of (3), you avoid this trap. You do not need to prove there is *no* third factor for morality. You only need to show that *even if* the realist posits a third factor, the argument does not generalize to epistemology. The realist's third-factor defense might save morality (if they can make it stick), but it cannot save epistemology because epistemology doesn't need saving—it's constitutive.
  *   **Cost:** You must accept that your argument is not a "proof" of anti-realism, but a demonstration that the *realist's epistemological position is unstable*. The burden shifts to the realist to provide a non-question-begging third factor. If they cannot, their position is dialectically inert (as you noted in 4).

  ### A Surviving Formulation of the Debunking Argument

  To preserve your anti-realist conclusion (4) while rejecting the self-undermining generality (5), you must revise the argument to explicitly restrict the scope of the debunking principle to *non-constitutive* domains.

  **Revised Argument:**

  1.  **Genealogy.** (Same as before) For each of our central moral beliefs, there is a well-confirmed bypassing genealogical story.
  2.  **Constitutive Distinction.** Epistemic norms (e.g., abduction) are constitutive of rational evaluation; moral norms are not.
  3.  **Restricted Tracking.** For any domain *D* that is not constitutive of rational evaluation: A belief in *D* is justified only if we would not have held it had it been false (or if there is a non-bypassing explanation for the correlation).
  4.  **Independence.** Moral facts (if they exist) hold independently of our beliefs. Thus, the genealogies in (1) are modally robust regarding moral facts.
  5.  **Moral Debunking.** Therefore, by (1), (3), and (4), our moral beliefs are unjustified (for the realist).
  6.  **Epistemic Immunity.** Because epistemic norms are constitutive (from 2), Restricted Tracking (3) does not apply to them. We cannot evaluate their reliability without presupposing them. Thus, the argument does not generalize to epistemology.
  7.  **Conclusion.** Moral Realism is epistemically untenable, but Epistemic Realism (or Normative Naturalism regarding logic) remains secure.

  **Commitments You Must Revise:**
  1.  **Abandon Universal Tracking (2):** You must accept that the tracking condition is domain-specific. It applies to "world-guided" domains (morality, perception) but not to "mind-guided" or constitutive domains (logic, epistemology).
  2.  **Accept Constitutivism:** You must commit to the view that epistemic norms are binding on us in virtue of being rational agents, whereas moral norms are not. This is a substantive meta-normative claim.
  3.  **Moderate the Skepticism:** You must acknowledge that your argument targets the *foundational* justification of moral beliefs. It leaves open the possibility of constructivist or response-dependent moral theories that do not posit independent moral facts (since (4) targets the *realist* specifically).

  ### Final Recommendation

  Your intuition that (5) is the culprit is correct. The argument is a *reductio* of the claim that "all normative domains are relevantly similar for genealogical scrutiny." By rejecting (5), you save the project. You pay the cost of defending a distinction between moral and epistemic normativity, but this is a cheaper price than surrendering moral skepticism (Diagnosis 2) or accepting global skepticism (accepting 5).

  The "Self-Undermining" worry (6) is not a bug; it is a feature. It signals that you have hit the bedrock of reasoning. You can dig beneath morality, but you cannot dig beneath the shovel you are using to dig. Embrace that limit.
