          *   *Synthesis:* Welton is "Authoritarian" not necessarily "Tight" in the sociological sense (coordination). DPS is a "Tight Clique" within a loose framework.
      *   *The Paradox of Command:* Keating's pedagogy. "Rip it out" is a command to reject authority via authority. Is it ironic? Yes. Is it necessary? Maybe.
      *   *The Dependence on Order:* The climax requires the rigidity. The film loves the shiver but acknowledges the cost (Neil).
      *   *Who Pays/Stacking the Deck:* Neil is the victim. Keating is the catalyst but escapes the ultimate consequence. Welton's rules (discipline) are villainized, but structure is needed for education.
      *   *Conclusion:* Film provides the *tragic remainder*. The cost of culture is human life.

  7.  **Refining and Polishing:**
      *   *Check Terminology:* Ensure "Normative Density," "Enforcement Severity," "Exit Permeability," and "Justificatory Openness" are used clearly.
