      *   *Critical Edge:* Don't just praise the film. Critique Keating's irresponsibility. Critique the romanticization of suicide (implicitly).
      *   *Tight/Loose Theory:* Reference Gelfand implicitly (since the prompt uses her framework variables) but focus on the film's treatment.

      *(Self-Correction during drafting)*: I need to be careful not to conflate "Tight/Loose" (Gelfand) with "Authoritarian/Libertarian." The prompt asks to use the four variables to distinguish these. Welton might be *severe* but not *coordinated* (teachers are absent or hypocritical). That's a key distinction. The "Tightness" of Welton is a facade of tradition, not necessarily functional social coordination.
      Also, need to address the "Exit Permeability" specifically regarding the boys. They can't leave their parents' expectations.
