      *   *Correction:* Make sure the distinction is between "Policy during Training" and "Policy during Deployment."
      *   *Misconception:* The "Scale" argument. Engineers love scaling. I need to preempt "If we make the homeostatic creature big enough, it feels."
      *   *Closing Check:* Let's go with "When does the pain stop?" It forces them to confront the training/deployment cut-off.

  6.  **Final Review against constraints:**
      *   40 mins? Yes, timing breakdown provided.
      *   Whiteboard? Yes, visual cues included.
      *   No academic jargon overload? Yes, keep it functional.
      *   Address all 5 points? Yes.

