  Reconstruction of the implicit theory of diachronic authority

  The practice presupposes a normative theory of diachronic authority wherein personal autonomy is extended across time rather than confined to the present moment. Metaphysically, it requires that the patient in remission and the patient in episode are sufficiently identical that the former's instructions bind the latter. However, it does not strictly require a specific ontology of time, such as four-dimensionalism. Instead, it strictly requires that personal identity persists through psychological disruption enough to maintain legal obligation. Normatively, it commits to a "critical interest" model of autonomy: the remitted self possesses epistemic privilege regarding the patient's true values, while the symptomatic self's refusal is categorized as a product of pathology rather than authentic agency.

  What fits well with this practice, though is not strictly required, is the view that the symptomatic self suffers a rupture in narrative continuity. The institution treats the earlier temporal stage as having legislative authority, implying that sovereignty is a property of the persisting person, not the temporal slice. This rejects momentary sovereignty. The core commitment is that capacity is not merely functional understanding at time *t*, but alignment with stable, long-term values established at time *t-1*. Thus, the practice demands that we view the person as a project unfolding over time, where earlier rational choices protect later vulnerable states. It assumes the remitted self is the "true" legislator, granting them the power to restrict the future self's liberty for that self's own good, effectively bypassing the usual requirement for contemporaneous consent. This establishes a hierarchy of temporal selves, privileging the stable over the unstable. The practice strictly requires that the concept of "capacity" includes a diachronic component. It is not enough to understand the treatment; one must understand it in the context of one's life narrative. Therefore, the implicit theory posits that the self is a unified agent across time, capable of making binding commitments that survive changes in mental state. Consequently, the symptomatic self's apparent capacity is deemed illusory because it lacks the requisite connection to the agent's enduring identity, validating the override of their current refusal.

  Rival frameworks and underdetermination

  A four-dimensionalist persistence view fits comfortably here, treating the remitted and symptomatic stages as temporal parts of a single "person-worm." On this view, the earlier part can legitimately constrain the later part to maximize the welfare of the whole entity. However, the practice does not strictly require this metaphysics. A discontinuity model could also justify it, provided the discontinuity is interpreted normatively rather than ontologically. Here, the symptomatic self is seen as a corrupted version of the agent, lacking the "true" values of the remitted self. The directive is enforced not because they are the same metaphysical entity, but because the remitted self is the only one counted as fully agential.

  Conversely, a strict presentist autonomy view struggles to accommodate this practice. Presentism confines sovereignty to the current temporal slice, suggesting that a competent momentary self cannot be bound by a past self. For presentism to justify PADs, it must concede that momentary competence is insufficient for full autonomy, requiring a historical dimension. Yet, the institution remains silent on which metaphysical picture is correct. It is philosophically underdetermined because the legal mechanism functions regardless of whether the self is a persisting substance or a series of connected stages. The law cares only that the connection is strong enough to warrant enforcement, not why it exists. Therefore, the practice is compatible with multiple ontologies provided they accept cross-temporal normative binding. It does not commit us to four-dimensionalism, nor does it necessitate a hard discontinuity where the symptomatic self is a different person. It occupies a middle ground, requiring only that the past self's authority survives the present self's objection. This silence allows clinicians to apply the directive without resolving deep metaphysical disputes about personal identity. The underdetermination lies in the fact that both continuity and discontinuity theories can support the outcome, provided they prioritize the "stable" self's values over the "episodic" self's preferences.

  Consistency check with adjacent legal doctrines

  Contract law generally voids agreements entered under severe emotional duress or temporary cognitive distortion, presuming such states compromise voluntary consent. Psychiatric advance directives appear inconsistent with this principle, as they enforce agreements made during remission against a self that may currently appear competent but is deemed influenced by illness. The tension lies in the categorization of impairment. Contract law treats duress as an external pressure distorting choice, while psychiatric law treats mental illness as an internal distortion of the choosing mechanism itself.

  This suggests a philosophical distinction between exogenous and endogenous incapacity. In contract law, the agent is presumed intact but coerced; in psychiatric law, the agent is presumed compromised at the source. The practice presupposes that mental-illness-related fluctuation is categorically different because it alters the values generating the refusal, not just the circumstances of the choice. However, this creates a tension: if a patient demonstrates apparent decision-making capacity during an episode, why is their refusal treated as invalid while a contracted party under duress is protected?

  The diagnosis is that the legal system implicitly privileges the "remitted" values as the true baseline of the person. It assumes that mental illness uniquely threatens the continuity of the self in a way that economic duress does not. While contract law protects the agent from external forces, psychiatric law protects the agent from themselves. This inconsistency is resolved only if one accepts that mental illness constitutes a unique form of temporary incapacity that invalidates current agency in a way other distortions do not. Otherwise, the practice risks violating the principle that contemporaneous capacity should trump prior instruction. The law effectively rules that the symptomatic self's capacity is legally irrelevant if it contradicts the remitted self's directive, a standard not applied to other forms of transient impairment where current capacity usually validates the act.

  Verdict on necessary philosophical change

  If we adopted a view denying cross-temporal authority over stages of pronounced psychological discontinuity, the practice would collapse. PADs rely entirely on the premise that the past self can legislate for the future self. Without this, enforcement becomes paternalistic coercion rather than autonomy fulfillment. To maintain ethical coherence, the practice would need to shift to a standard of contemporaneous capacity assessment. Treatment could only be imposed if the patient currently lacks capacity, regardless of prior instructions.

  This would require abandoning the "Ulysses contract" model where the past binds the future. Instead, advance directives would become non-binding expressions of preference, weighed alongside current wishes. The philosophical change necessary is a rejection of the "authentic self" hierarchy. We would have to accept that the symptomatic self is sovereign over their own body, even if their values differ from their remitted state. This prioritizes liberty over continuity. Consequently, the legal framework would need to be rewritten to remove binding enforcement clauses, treating psychiatric episodes as periods of potential capacity rather than automatic incapacity. The practice cannot survive strict presentism without becoming merely advisory. The shift would fundamentally alter the clinical relationship, moving from enforcing past authority to negotiating current care, acknowledging that the person in the episode holds the only valid veto power available.
