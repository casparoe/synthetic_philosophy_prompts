answer: |-
  You haven't been reading badly. You've been debugging. What you've identified as "the leak" is one of the most persistent bugs in the Frankfurt codebase, and your intuition that it might be a structural feature rather than a sloppy implementation is shared by some of the sharpest critics in the field.

  Here is the map you asked for. I'll break it down into the three coordinates you've discovered, give you the established philosophical terminology (so you can search the literature), and then offer the "debugging terms" you requested for the specific nuances your group is feeling.

  ### 1. The Sliver (The Leak)
  **Established Term:** *The Flicker of Freedom.*
  **Key Name:** David Widerker (1995).

  You are exactly right: for the device to know *when* to intervene, it must detect a "prior sign" (a blush, a neural spike, a hesitation). Widerker argued that if the sign is causally sufficient for the action, the case presupposes determinism (which begs the question against libertarians). If the sign is *not* causally sufficient, then the agent could have refrained from showing the sign, meaning they *could have done otherwise* after all.

  That sliver you found? That's the Flicker. It's a tiny alternative possibility (e.g., "I could have not blushed"), but it's an alternative possibility nonetheless.

  **Is it structural or sloppy?**
  It is structural to Frankfurt's *original* formulation. However, philosophers have tried to patch this.
  *   **The Patch:** "Blockage Cases." Instead of a device that *watches and intervenes*, imagine a device that simply blocks all neural pathways leading to any decision *except* the one you're making. It doesn't watch; it just walls off the garden.
  *   **The Counter-Patch:** Critics argue this just moves the leak. To wall off the other paths, the universe must still "know" which path you are on to leave it open. The monitoring requirement seems inescapable if the intervention is conditional.

  **Your Coinage:** *Monitoring Entailment.*
  *   **Definition:** The structural necessity that any conditional intervener must possess information about the agent's state prior to intervention.
  *   **Edge:** It covers both "sloppy" stories (blushing) and "rigorous" ones (neural scans).
  *   **Limit:** It doesn't apply to "Blockage Cases" (see above), though one could argue Blockage Cases suffer from *Topology Entailment* (the structure of the decision space must be known to be blocked).

  ### 2. Outcome vs. Action (The Timer Case)
  **Established Distinction:** *Modal Fixity vs. Causal Sourcehood.*
  **Key Concept:** *Actual Sequence vs. Alternative Sequence.*

  Your intuition about the Timer case is spot on. In a classic Frankfurt case, the claim is: "The actual sequence of events is entirely your own; only the *possibility* of doing otherwise is removed."
  In your Timer case, the *outcome* is fixed, but the *process* is not necessarily determined until the deadline.

  *   **Classic Frankfurt:** The device is a **Counterfactual Intervener**. It sits in the shadows. In the actual world, it does nothing. You act freely. It only acts in the *nearby possible world* where you waver.
  *   **Your Timer:** This is a **Pre-emptive Cause**. If the timer exists, it is part of the causal fabric of the actual world. Even if it doesn't fire, its presence changes the modal status of the timeline differently. It feels like "Fatalism" (it will happen) rather than "Frankfurtian Control" (I did it, but couldn't have not).

  The distinction you are feeling is between **Result Fixity** (the state of the world at $T+1$ is guaranteed) and **Sequence Integrity** (the causal chain from Agent to Action is uninterrupted). Frankfurt cases require Sequence Integrity to maintain responsibility. Timer cases often sacrifice Sequence Integrity for Result Fixity.

  **Your Coinage:** *Sequence Purity.*
  *   **Definition:** A measure of whether the guarantee of the outcome relies on external constraints (Timer) or merely on the removal of alternative branches (Classic Frankfurt).
  *   **Edge:** Distinguishes "I did it, and had to" (Classic) from "It got done, and I might have done it" (Timer).
  *   **Limit:** Doesn't account for *how* the branches are removed (manipulation vs. blockage).

  ### 3. The Self-Installation (The Responsibility Spike)
  **Established Term:** *Tracing* or *Derivative Responsibility.*
  **Key Concept:** *Historical Conditions.*

  When the agent installs the device himself, you correctly notice responsibility goes *up*. This is because PAP (Principle of Alternative Possibilities) is often defended by saying: "You need alternatives *at some point*."
  In the self-installation case, you had alternatives *then*. You are responsible for the later action *because* you were responsible for the earlier installation. This is the "Tracing Strategy."

  This highlights that Frankfurt cases are often ahistorical. They look at a snapshot ($T_{decision}$). Your friend's case looks at the commit log ($T_{install} \rightarrow T_{decision}$). If the history is clean, the lack of alternatives at $T_{decision}$ doesn't absolve you.

  ### The Map: A Topology of Constraint

  To help your group visualize this, imagine a 3-axis coordinate system for any "No Alternatives" case:

  1.  **Visibility (The Leak Axis):**
      *   *Low:* Blockage (walls are just there).
      *   *High:* Monitoring (device watches for signs).
      *   *Your Insight:* High Visibility always creates a Flicker (Leak).

  2.  **Intervention Timing (The Timer Axis):**
      *   *Counterfactual:* Device only acts in other possible worlds (Classic Frankfurt).
      *   *Actual:* Device acts in this world if conditions aren't met (Your Timer).
      *   *Your Insight:* Actual Intervention threatens Sequence Purity.

  3.  **History (The Responsibility Axis):**
      *   *Ahistorical:* Device implanted by evil neurosurgeon (Standard).
      *   *Historical:* Device implanted by self (Your Friend).
      *   *Your Insight:* Historical cases bypass PAP via Tracing.

  ### Summary for the Book Group

  If you want to steer the conversation next month, here is the synthesis:

  1.  **The Leak is Real:** Tell them to look up **Widerker's "Flicker of Freedom" objection**. You aren't imagining it; it's the standard objection to the original cases. The "Monitoring Entailment" is why the flicker exists.
  2.  **The Timer is Different:** Your Timer case fails as a Frankfurt case because it lacks **Sequence Purity**. It guarantees the *result* via external threat, whereas Frankfurt wants to guarantee the *necessity* while preserving the *source*.
  3.  **The Terminology:**
      *   Use **"Flicker of Freedom"** for the sliver.
      *   Use **"Actual Sequence vs. Alternative Sequence"** for the Outcome/Action distinction.
      *   Use **"Tracing"** for the self-installation paradox.

  **One final thought for the ex-programmers:**
  Frankfurt cases are essentially trying to prove that `Responsibility` does not depend on `!Determinism`.
  But to write the test case, they have to instantiate a `Controller` object.
  Your insight is that instantiating the `Controller` inevitably introduces a dependency on `Agent.State` (The Leak).
  If you remove the dependency (The Timer/Blockage), you change the class of the object from `Controller` to `Environment`, which changes the logic of the test.
  The bug isn't in the code; it's in the spec.

  You're not reading badly. You're refactoring.
