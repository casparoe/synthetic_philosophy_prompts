  **Project Title:** Carving Joints vs. Making Messes: The Microplastic Case

  **The Hook**
  This project started because I was helping my roommate organize her bio notes last week and we got into a huge argument about whether "microplastic" counts as a real natural kind. She said yes, because they all act the same way in ecosystems. I said no, because it's just a grab bag of different polymers that happen to be small. It got me thinking: we usually assume science is about finding the "real" categories nature hides, but what if some categories are real only because of what we're trying to do with them?

  **The Question**
  Here's the precise question I want to tackle: If a scientific kind groups entities by practical effect rather than shared internal structure, does that mean it's not joint-carving, or does it just show that joint-carving is always relative to an explanatory goal?

  **Why the Usual Answers Don't Work**
  The standard debate is stuck between essentialists and conventionalists. Essentialists say if there's no shared micro-structure (like a specific chemical bond), it's not a real kind. Conventionalists say all kinds are just human tools, so structure doesn't matter. Neither of these actually helps us understand scientific practice. The essentialist has to say ecologists are wrong to treat microplastics as a group, which seems silly given how useful that category is for tracking harm. The conventionalist says everything is a kind, which makes the concept of "natural kind" useless. I want to move past this stalemate by looking at how different sciences actually use the same objects.

  **The Approach**
  For an 8-week project, I can't solve metaphysics, but I can run a comparative case study. I plan to look at how chemical taxonomy classifies plastics (based on polymer chains, monomers, etc.) versus how ecological taxonomy classifies them (based on size, persistence, toxicity). 

  I'll focus on recent literature where these fields overlap—like studies on bioaccumulation where chemists and ecologists have to agree on what counts as a "unit" of pollution. The goal is to map where the categories diverge and see if the divergence tracks with different explanatory goals. Basically, is "microplastic" a natural kind *for ecology* even if it isn't one *for chemistry*?

  **Success and Failure Conditions**
  A useful result would be a framework showing that "joint-carving" isn't a binary (real vs. fake) but is relative to the domain's specific goals. If I can show that the microplastic category supports robust inductive inferences in ecology (e.g., predicting toxicity) despite lacking chemical unity, that supports the goal-relative view.

  Failure would look like getting stuck on definitions. If I spend 8 weeks just arguing about what "real" means without looking at the actual scientific practice, I haven't done the work. Another failure mode is finding that the two fields don't actually interact enough to compare. I'll mitigate this by narrowing the scope to marine bioaccumulation studies where both chemical structure and ecological effect are recorded.

  **Timeline**
  *   **Weeks 1-2:** Lit review on natural kinds (focus on recent homeostatic property cluster views) and microplastic classification standards.
  *   **Weeks 3-6:** Case study analysis. Comparing specific taxonomic practices in chemistry vs. ecology papers.
  *   **Weeks 7-8:** Drafting the paper and refining the argument about goal-relativity.

  This feels honest for a summer workshop. It's narrow enough to finish but hits a big philosophical problem. Plus, it settles the bet with my roommate.
