answer: |-
  This is a classic trap. The paradox is logically simple but psychologically dense. If you lead with logic, they tune out. If you lead with the absurdity, they lean in.

  Here is a 40-minute battle plan designed for your specific constraints and group dynamics.

  ### 1. The Order of Operations (The "Landing Sequence")

  Do not start with logic. Start with **evidence**.

  1.  **The Hypothesis (5 mins):** Establish "All Ravens are Black." Get them to agree on how we normally test this (find ravens, check color).
  2.  **The Definition of "Confirms" (5 mins):** Crucial step. Define it as "makes it more reasonable to believe," *not* "proves."
  3.  **The Logical Mirror (10 mins):** Introduce the contrapositive ("All non-black things are non-ravens"). **Only here** do you briefly explain logical equivalence.
  4.  **The Collision (10 mins):** Bring in the duck. Show that it confirms the Mirror, therefore it confirms the Raven. Let them feel the stupidity of that conclusion.
  5.  **The Escape (10 mins):** The "Maths Friend" point (scale/probability).

  **Dependency Check:**
  *   **Do you need to cash out "All Fs are Gs" as a conditional?** No. Keep it as "All [Noun] are [Adjective]." Conditionals ("If it is a raven...") add linguistic friction.
  *   **Do you define "Logically Equivalent" up front?** No. Define it *at the moment of the swap*. Say: "These two sentences are locked together. If one is true, the other *must* be true. If one is false, the other *must* be false. They are the same rule wearing different masks."
  *   **Define "Confirms" up front?** **Yes.** If you don't, they will argue "But the duck doesn't *prove* it!" You need to lock in "confirms = adds a tiny bit of weight" before the paradox hits.

  ### 2. The Carrying Example (The Green Duck)

  The green rubber duck is perfect. Use it.

  *   **Why it works:** It is undeniably non-black. It is undeniably non-raven. It is physically present.
  *   **What to avoid:** Do not let them debate biology.
      *   *The Albino Trap:* If someone says "But what about albino ravens?", shut it down immediately. Say: "For this game, 'Raven' is a category we define. Imagine a world where the rule 'All Ravens are Black' is the law we are testing. We aren't doing ornithology, we're testing logic."
      *   *Boring vs. Loaded:* You want the object to be **boring**. A gun, a religious symbol, or something expensive distracts. A duck is neutral.
      *   *The Hypothesis:* Keep it "All Ravens are Black." Changing the subject (e.g., "All coins are silver") is good for the final test, but for the main explanation, stick to the classic Raven so they can Google it later and feel smart.

  ### 3. Misconceptions & The "In-the-Moment" Defusal

  Here is where you lose the room. Catch these *as they happen*.

  **Misconception 1: "Non-black means White."**
  *   **When it bites:** When you write the contrapositive on the board.
  *   **The Move:** As soon as you write "All non-black things...", draw a black marker on the whiteboard. Ask: "Is this black?" (Yes). "If I turn it green, is it white?" (No). "So 'non-black' is a huge bucket containing green, red, blue, transparent, etc." **Draw a circle around everything except black.**

  **Misconception 2: "Confirms means Proves."**
  *   **When it bites:** When you claim the duck confirms the raven hypothesis.
  *   **The Move:** Pre-empt this. "If I find one black raven, have I proved all ravens are black? No, there might be a green one tomorrow. But does finding a black raven make me feel *better* about the rule? Yes. That's 'confirmation.' It's a nudge, not a slam dunk."

  **Misconception 3: "It's just a trick with words."**
  *   **When it bites:** Immediately after the reveal.
  *   **The Move:** Validate them, then pivot. "It feels like a word trick. But the logic is valid. The paradox isn't that the logic is broken; it's that our *intuition* is broken. Why does valid logic feel like nonsense? That's the actual puzzle."

  **Misconception 4: "Hempel sorted this out, it's done."**
  *   **When it bites:** At the end.
  *   **The Move:** "Hempel found the paradox. He didn't kill it. Philosophers still argue about this. Some say the duck *does* confirm it (just barely). Some say our definition of confirmation is wrong. You're entering an ongoing fight."

  ### 4. The Maths Friend's Point (The "Universe of 10" Trick)

  Your friend is roughly right. This is the "Standard Solution" (often associated with Good or Swartz). It relies on background probability.

  *   **Is it oversimplified?** Yes, but for 40 minutes with high schoolers, it is the *best* explanation. Don't use Bayes' Theorem. Use a **Thought Experiment**.
  *   **Where it goes:** In the "Escape" phase (last 10 mins).
  *   **How to deliver it:**
      1.  Ask them to imagine a universe with only **10 objects** in it.
      2.  We want to test: "All Ravens are Black."
      3.  Imagine in this universe, there is **1 Raven** and **9 other things** (apples, ducks, shoes).
      4.  If you pick up a "non-black thing" (say, a red apple), you have checked 1 out of 9 possible non-ravens.
      5.  If you check all 9 non-black things and none of them are ravens, you have effectively checked every non-raven.
      6.  **The Kicker:** In our real world, there are billions of non-black things. Checking one duck is like checking one grain of sand on a beach to see if there's a diamond hidden there. It *does* reduce the probability of a counter-example existing, but by so infinitesimally small amount that our brains round it down to zero.
      7.  **Conclusion:** The logic holds, but the *weight* of the evidence is negligible.

  ### 5. What to Leave Out (And Say You're Leaving It Out)

  Be transparent. It builds trust.

  *   **Leave Out:** **Nicod's Criterion.** (The formal rule that says only positive instances confirm).
      *   *Say:* "There's a formal rule philosophers use called Nicod's Criterion that says only black ravens should count. We're ignoring the formal name, just keeping the intuition."
  *   **Leave Out:** **Projectibility / Grue.** (Goodman's New Riddle of Induction).
      *   *Say:* "This problem actually infects *all* rules, not just ravens. There's a whole other paradox about 'green' vs 'grue' that breaks this even more, but if we go there we'll be here until next Thursday."
  *   **Leave Out:** **Prior Probability.** (How likely we thought the rule was before starting).
      *   *Say:* "We're assuming we start with no idea if the rule is true. If we already knew ravens are usually black, the duck matters even less."

  ### 6. The Final Check (The "Transfer" Question)

  Do not ask "Do you understand?" They will lie.
  Do not ask "Is this interesting?" They will be polite.

  Ask them to apply the structure to a new case.

  **The Question:**
  > "Okay, new rule: **'All the coins in my pocket are Silver.'** I'm not going to check my pocket. I'm going to look at this **red pencil** on the desk. According to the logic we just did, does looking at this red pencil give me *any* evidence about the coins in my pocket? And why does it feel stupid?"

  **What you're listening for:**
  *   **Bad answer:** "No, because pencils aren't coins." (They missed the logical equivalence).
  *   **Bad answer:** "Yes, it proves it." (They missed the definition of confirmation).
  *   **Good answer:** "Yes, technically, because the pencil is a non-silver non-coin, so it fits the mirror rule... but it doesn't feel like evidence because there are too many non-silver things in the world."

  ### Summary Timeline (40 Mins)

  *   **00-05:** Intro. Hypothesis: "All Ravens are Black." How do we test? (Find ravens).
  *   **05-10:** Define "Confirmation" (Nudge, not proof).
  *   **10-20:** The Logical Mirror. Contrapositive. "Non-black = Non-raven." Use Whiteboard. Defuse "Non-black vs White" here.
  *   **20-30:** The Duck. Show it confirms the Mirror. Therefore it confirms the Raven. Let them groan. Defuse "Word Trick" here.
  *   **30-35:** The Escape. The "Universe of 10 Objects" thought experiment. Explain why the nudge is too small to feel.
  *   **35-40:** The Coin/Pencil Test. Discussion. Wrap.

  **One final tip:** If the room goes quiet when you reveal the duck confirms the raven rule, **wait.** Let the silence sit for ten seconds. That discomfort is the philosophy happening. Don't rush to fill it.
