prompt: |-
  i host a small philosophy podcast and next episode im interviewing a philosopher — lets call her Dr. Voss — who defends "role-indexed internalism" about practical reasons. her idea is that a reason counts as internal not relative to your actual desires but relative to the motivations you'd have if you were competently performing the social role you actually occupy. so a parent who feels nothing still has internal reason to feed their kid, because thats constitutive of parenting, but if the parental role is structured by unjust norms then external reasons kick in and override. i want 7 or 8 questions that actually press her, not just "explain your view." i need at least one about whether this just collapses into externalism once you let unjust roles be overridden, one about role conflict — like being a good employee vs a present parent — and one about whether "competent role-filling" smuggles in objective moral standards. for each question, write a follow-up tailored to the answer she's most likely to give (she tends to say the norms are internal to the practice, not imported). no generic biographical stuff. keep it focused.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Small philosophy podcast interview.
      *   **Guest:** Dr. Voss (fictionalized philosopher).
      *   **Topic:** Role-indexed internalism about practical reasons.
      *   **Core View:** Reasons are internal relative to motivations one *would* have if competently performing their actual social role. Unjust norms trigger external reasons to override.
      *   **Requirements:** 7-8 questions. Must press her (critical/challenging), not just explanatory.
      *   **Specific Inclusions:**
          *   One question on collapse into externalism (regarding unjust roles).
          *   One question on role conflict (employee vs. parent).
          *   One question on "competent role-filling" smuggling in objective moral standards.
      *   **Format:** Each question needs a tailored follow-up based on her likely response (specifically, her tendency to say norms are internal to the practice).
      *   **Tone:** Focused, philosophical, no generic biographical fluff.

  2.  **Deconstruct the Theory (Role-Indexed Internalism):**
      *   *Standard Internalism:* Reasons depend on actual subjective motivational set (Williams).
      *   *Voss's Twist:* Reasons depend on *counterfactual* motivational set (if I were doing my role well).
      *   *The "Hook":* Social roles define the motivations.
      *   *The "Safety Valve":* Unjust norms allow external reasons to override.
      *   *Potential Weaknesses:*
          *   Where do roles come from? (Arbitrariness)
          *   What if roles conflict? (Dilemmas)
          *   Is "competence" normative? (Circularity/Smuggling)
          *   Does the safety valve destroy the internalist project? (Collapse)
          *   What about role exit? (Can I quit the role to avoid the reason?)
          *   Who defines the role? (Power dynamics)
          *   Is this just disguised conventionalism?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Collapse Problem (Required).*
          *   *Draft:* If you allow external reasons to override unjust roles, aren't you just an externalist?
          *   *Refinement:* Make it sharper. Focus on the *criterion* for injustice. If the criterion is external, the whole system leans external.
          *   *Follow-up:* She will say norms are internal. Push back: Who adjudicates the internal norm vs. external override?

      *   *Question 2: Role Conflict (Required).*
          *   *Draft:* What if being a good worker hurts being a good parent?
          *   *Refinement:* Focus on the *source* of the reason. If both are internal, how do you weigh them without an external arbiter?
          *   *Follow-up:* She'll say practices have internal prioritization. Push: What if the practices themselves disagree?

      *   *Question 3: Competence & Morality (Required).*
          *   *Draft:* Doesn't "competent" just mean "moral"?
          *   *Refinement:* Focus on the definition of competence. If a "competent" gangster still kills people, is that a reason? If you say no, you're using external morality to define competence.
          *   *Follow-up:* She'll say competence is technical/internal. Push: Can you separate technical competence from moral legitimacy in reasons?

      *   *Question 4: Role Exit/Voluntariness.*
          *   *Idea:* Can I just quit the role to escape the reason?
          *   *Refinement:* Focus on non-voluntary roles (citizen, sibling, maybe parent). If I can't quit, am I trapped by internal reasons I don't endorse?
          *   *Follow-up:* She'll say some roles are inescapable. Push: Does that make the internalism coercive?

      *   *Question 5: The "Idealized Self" Gap.*
          *   *Idea:* Why should I care about the person I *would* be?
          *   *Refinement:* Williams criticized idealized desire accounts. Why does the "competent role-filler" motivation bind *me* now, especially if I hate the role?
          *   *Follow-up:* She'll say identity is constituted by roles. Push: What if my identity is *resistance* to the role?

      *   *Question 6: Power and Definition.*
          *   *Idea:* Who writes the role description?
          *   *Refinement:* Social roles are sites of power struggle. If the boss defines "competent employee," does that generate reasons for the worker?
          *   *Follow-up:* She'll say it's a shared practice. Push: What if the practice is hierarchical/oppressive? (Links back to Q1 but distinct).

      *   *Question 7: The Phenomenology of Deliberation.*
          *   *Idea:* Do people actually think this way?
          *   *Refinement:* When we deliberate, do we ask "what does my role require?" or "what do I want/what is right?" Is this descriptive or normative?
          *   *Follow-up:* She'll say it's normative reconstruction. Push: Does that disconnect it from action-guiding force (internalism's main selling point)?

      *   *Question 8: The "Bad Role" Problem (Distinct from Unjust).*
          *   *Idea:* What about roles that aren't unjust but just trivial or bad? (e.g., "Cool Guy").
          *   *Refinement:* If I occupy the role of "Suburban Dad," do I have reasons to grill burgers? If I reject that, am I irrational?
          *   *Follow-up:* She'll say reasons are conditional on role acceptance. Push: But you said actual social role occupancy matters, not acceptance.

      *   *Selection & Polishing:* I need to ensure the specific three required topics are prominent and the follow-ups align with her predicted defense ("norms are internal to the practice").

      *   *Review against constraints:* 7-8 questions? Yes. Pressing? Yes. Specific follow-ups? Yes. No bio? Yes.

      *(Self-Correction during drafting)*: Make sure the follow-ups aren't just "But what if..." but specifically address her likely move about internal norms. Ensure the "Collapse" question is strong because that's the biggest philosophical threat to her view.

  4.  **Finalizing the Content:** (Mental check of the specific prompts)
      *   Q1: Collapse (Unjust norms).
      *   Q2: Role Conflict.
      *   Q3: Competence/Morality smuggling.
      *   Q4: Voluntariness/Exit.
      *   Q5: Power/Definition of roles.
      *   Q6: The Williams Critique (Motivational link).
      *   Q7: Trivial/Bad Roles (The "Grilling Dad" problem).
      *   Q8: Diachronic stability (Roles change).

      *Wait, I need to make sure the follow-ups are tailored.*
