      *   *Counter:* If the practice is the only standard, how do you critique the practice without stepping outside it?

      *Let's refine the list to be the strongest 7.*

      1.  Collapse (Externalism via injustice).
      2.  Conflict (Employee vs Parent).
      3.  Competence (Moral smuggling).
      4.  Power (Who defines the role?).
      5.  Exit (Can I quit the reason?).
      6.  Motivation (Why does the counterfactual move me?).
      7.  Triviality (Reasons for trivial roles).

      *Okay, let's write them out.*

  5.  **Final Polish:** Check tone. Ensure it sounds like a podcast host who knows the literature (Williams, etc.) but is accessible. Ensure the follow-ups are distinct. (Proceeding to generate output).

