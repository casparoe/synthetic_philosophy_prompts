answer: |-
  Here are 7 pressing questions tailored to Dr. Voss's view, including the specific thematic requirements you requested, with follow-ups designed to counter her likely defense that norms are internal to the practice.

  ### 1. The Collapse Problem (Externalism)
  **Question:** You argue that when a social role is structured by unjust norms, external reasons kick in to override the internal ones. But doesn't the moment you appeal to "injustice" to vet the role, you've already stepped outside the internalist framework? If the *criterion* for when a role-generated reason fails is an external moral fact, isn't this just externalism with an extra step?

  **Follow-up (if she says norms are internal to the practice):** "If the judgment of injustice is itself internal to the practice, then a 'competent' practitioner of a corrupt practice (say, a competent 19th-century slaveholder) wouldn't see it as unjust. So, to call it unjust, *you* need an external vantage point. If you have that vantage point, why do we need the internalist machinery at all? Why not just lead with the external reason?"

  ### 2. The "Competence" Smuggle (Objective Morality)
  **Question:** Your view hinges on the motivations one would have if "competently performing" a role. But how do you define competence without smuggling in objective moral standards? If I'm a hitman, a 'competent' hitman is motivated to kill. Do I have an internal reason to kill? If you say no, you seem to be saying moral badness precludes competence, which makes your view circular.

  **Follow-up (if she says competence is technical/internal to the practice):** "If competence is merely technical, then the hitman *does* have the reason, which is a bullet most internalists want to dodge. But if you say the hitman lacks the reason because the practice is illegitimate, you're using morality to define competence. Are you willing to admit that 'competence' is a normative filter, not just a descriptive one?"

  ### 3. Role Conflict (Employee vs. Parent)
  **Question:** Let's look at role conflict. I occupy the role of 'employee' and 'parent' simultaneously. The internal reasons of the first demand late nights; the second demands presence. Since both reasons are generated internally by the roles I actually occupy, what adjudicates the tie? If you say 'balance,' isn't that just a third, external standard imported to weigh the two internal reasons against each other?

  **Follow-up (if she says practices have internal prioritization norms):** "Practices often disagree on prioritization. The corporate practice values output; the family practice values presence. If the internal norms of the two practices contradict, and you refuse an external arbiter, doesn't the agent just fracture? How is 'practical reason' possible if the output is simply two contradictory commands with no meta-rule to resolve them?"

  ### 4. Power and Role Definition
  **Question:** Social roles aren't static; they are sites of power struggles. Who gets to define the 'competent' version of the role? If a boss defines a 'competent employee' as someone who never unionizes, does that generate an internal reason for the worker not to unionize? If you say the worker's role includes resistance, aren't you just picking the political outcome you prefer?

  **Follow-up (if she says norms are shared/internal to the practice):** "In hierarchical practices, the norms aren't shared equally; they are imposed. If the 'internal norms' are just the will of the dominant party codified as practice, isn't your theory just a philosophical endorsement of the status quo? How does your view distinguish between a 'role reason' and mere coercion?"

  ### 5. The Motivational Link (Williams' Challenge)
  **Question:** Bernard Williams argued that for a reason to be internal, there must be a sound deliberative route to the agent's *actual* motivations. You're replacing actual motivations with *counterfactual* role-motivations. Why should I care about the motivations of a 'competent version' of me if my actual self rejects that role entirely? Where is the motivational grip?

  **Follow-up (if she says identity is constituted by roles):** "Even if my identity is constituted by the role, I can be alienated from it. If I am an alienated parent, the 'competent parent' motivations feel like foreign demands, not my own. If the motivational link relies on me *identifying* with the role, aren't we back to standard subjectivism? If it doesn't, how is this internalism and not just externalism disguised as role-talk?"

  ### 6. Role Exit and Voluntariness
  **Question:** Some roles are voluntary (employee), others seem non-voluntary (citizen, sibling, sometimes parent). If I have an internal reason to feed my child based on the role, but I want to abandon the role, can I? If I can't exit the role to escape the reason, doesn't that make the 'internal' reason function exactly like a categorical imperative?

  **Follow-up (if she says some roles are inescapable):** "If the role is inescapable, and the reason binds me regardless of my desire to quit, the source of the normativity looks like the *role itself*, not my motivational set. At that point, what work is 'internalism' doing? Are you just saying external reasons attach to social facts rather than moral facts?"

  ### 7. The Triviality Problem
  **Question:** I occupy the social role of 'Suburban Dad.' Constitutive norms might suggest I have a reason to mow my lawn on Saturdays. If I don't care about the lawn, do I really have a normative reason to do it, or just a social expectation? If you say it's a genuine reason, doesn't this trivialize the concept of 'practical reason' by inflating every social expectation into a normative demand?

  **Follow-up (if she says reasons are conditional on role significance):** "Who determines the significance? If I think the role is stupid, but society says it's significant, whose metric counts? If it's society's, you're prioritizing social pressure over agency. If it's mine, you've collapsed back into standard subjectivism. Is there any room for a role to generate a reason that the agent can rationally dismiss as trivial?"
