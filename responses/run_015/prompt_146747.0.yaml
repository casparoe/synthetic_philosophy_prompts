          *   His opposition isn't just about hypocrisy; it's about the *limit* of state power. The State cannot claim absolute authority over life and death because the State is fallible (human).
      *   **Rebellion (*L'Homme Révolté*):**
          *   This is the missing link. *Sisyphus* is about the Individual vs. The Universe. *The Rebel* is about the Individual vs. Society/State.
          *   Rebellion says: "I exist, and there is a line you cannot cross." Killing a prisoner crosses that line. It treats a human as a thing to be disposed of.

