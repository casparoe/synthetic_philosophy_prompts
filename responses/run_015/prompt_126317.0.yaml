answer: |-
  This is an exceptionally clear set of intuitions. You have independently reconstructed the consensus view of modern quantitative genetics and causal inference, often fighting against the popular (and sometimes professional) misuse of the statistic. Your gut reactions are correct. The discomfort you feel in Case 9 is indeed psychological residue from the nature/nurture dualism, not a statistical error.

  Here is the breakdown you requested, structured to turn your intuitions into an implementable rule set.

  ### a) The Principles

  To implement this as a rule, you need to treat $h^2$ not as a property of a *trait*, but as a property of a *dataset* describing a specific population in a specific context.

  **Principle 1: The Variance Context Clause**
  *   **Rule:** An $h^2$ estimate describes the ratio of genetic variance to total phenotypic variance ($\sigma^2_G / \sigma^2_P$) *only* for the specific population and environmental range from which the data were drawn.
  *   **License:** You may infer that genetic differences explain a proportion $h^2$ of the *observed differences* between individuals in that specific context. (Cases 1, 3, 4, 8, 10, 11).
  *   **Prohibition:** You may not infer that this ratio holds for a different population, a different time, or a different range of environmental variance. (Cases 3, 4, 8, 10).

  **Principle 2: The Individual Decomposition Clause**
  *   **Rule:** Variance is a property of a distribution, not an individual.
  *   **License:** You may use genotype to *predict* an individual's deviation from the population mean (within the same environmental context).
  *   **Prohibition:** You may not decompose an individual's phenotype into "X% genes + Y% environment." (Case 2).

  **Principle 3: The Malleability Clause**
  *   **Rule:** $h^2$ measures the source of *current variance*, not the sensitivity of the *mean level* to change.
  *   **License:** High $h^2$ implies that, in the *current* environment, selecting on phenotype will effectively select on genotype.
  *   **Prohibition:** High $h^2$ does not license the claim that the trait is resistant to environmental intervention, especially interventions outside the current environmental range. (Cases 5, 8).

  **Principle 4: The Between-Group Clause**
  *   **Rule:** Within-group variance components do not explain between-group mean differences unless the assignment of individuals to groups is uncorrelated with genotype.
  *   **License:** If individuals are randomly assigned to environments (or groups defined by environment), differences in means can be attributed to the environment. If genotypes are also randomized, residual mean differences can be attributed to genetics. (Cases 6, 7).
  *   **Prohibition:** You may not infer the cause of a mean difference between groups from the $h^2$ estimated within those groups. (Case 6).

  **Principle 5: The Pathway Neutrality Clause**
  *   **Rule:** $h^2$ captures all causal paths from genotype to phenotype, including those mediated by the environment.
  *   **License:** You may state that genetic differences cause phenotypic differences, even if the mechanism is behavioral or environmental. (Case 9).
  *   **Prohibition:** You may not use a high $h^2$ to claim the mechanism is "direct" (e.g., biochemical) rather than "indirect" (e.g., behavioral).

  ---

  ### b) Critique of Your Verdicts

  Your verdicts are robust. Here is the specific analysis of the troubling cases.

  **Cases 6 & 7 (The Group Gap)**
  *   **Your Verdict:** Reject 6, Accept 7.
  *   **Analysis:** Correct. This is the distinction between *observational* and *experimental* variance decomposition.
  *   **Why:** In Case 6, Group Membership is confounded with Genotype (and Environment). $h^2$ tells you about variance *within* the groups, but the gap *between* the groups is a function of the difference in means. If Group 1 has Genotype A and Environment A, and Group 2 has Genotype B and Environment B, you cannot separate the effects without breaking the correlation.
  *   **Why 7 works:** Randomly moving individuals breaks the correlation between Genotype and Environment. If the gap persists when Genotype A is placed in Environment B, you have isolated the genetic component of the mean difference. This is no longer an inference from $h^2$; it is an inference from a randomized control trial (RCT). The $h^2$ number is actually irrelevant to the conclusion in Case 7; the *design* licenses the claim.

  **Cases 5 & 8 (Malleability and Stability)**
  *   **Your Verdict:** Reject the claim that high $h^2$ implies low malleability (5) and reject the claim that changing $h^2$ implies changing genetic "strength" (8).
  *   **Analysis:** These are the same point. Your intuition is correct.
  *   **Why:** $h^2 = \sigma^2_G / (\sigma^2_G + \sigma^2_E + \sigma^2_{GxE})$. If you reduce $\sigma^2_E$ (by equalizing environments, Case 8), the denominator shrinks, and $h^2$ rises, even if $\sigma^2_G$ is constant. Similarly, if you introduce a new environment that shifts the *mean* (Case 5), you are probing the reaction norm, not the variance ratio.
  *   **Correction:** I would strengthen your verdict on 5. It is not just "no evidence"; it is logically independent. A trait can be 100% heritable and 100% malleable (e.g., Phenylketonuria: genetic cause, dietary cure).

  **Case 9 (The Pathway)**
  *   **Your Verdict:** Accept both that it is genetic (variance-wise) and environmental (mechanism-wise).
  *   **Analysis:** Correct. The discomfort is indeed psychological. In data infrastructure terms: If `request_size` is determined by `client_config`, and `latency` is determined by `request_size`, then `client_config` explains variance in `latency`. It does not matter that the path is indirect.
  *   **Nuance:** In genetics, this is often called "genetic nurture" or indirect genetic effects. The statistic $h^2$ (specifically SNP-heritability from GWAS) often captures these indirect effects. If you want to distinguish direct biological effects from indirect environmental mediation, $h^2$ is the wrong tool; you need within-family designs (see Section D).

  ---

  ### c) What $h^2$ Positively Licenses

  If $h^2$ doesn't tell us about individuals, interventions, or group differences, why calculate it? It is useful for three specific engineering tasks:

  1.  **Prediction within Status Quo:**
      *   **Use:** If you hold the environment constant (or assume it continues to vary as it currently does), $h^2$ tells you the upper bound of prediction accuracy using genetic data.
      *   **Action:** If $h^2 = 0.8$, building a polygenic score is worth the engineering cost. If $h^2 = 0.05$, it is not. It is a signal-to-noise ratio for genetic prediction *in the current environment*.

  2.  **Response to Selection (Evolutionary or Artificial):**
      *   **Use:** The Breeder's Equation: $R = h^2 \times S$. If you select the top 10% of individuals to reproduce (or to deploy in a system), $h^2$ predicts how much the population mean will shift in the next generation.
      *   **Action:** This is the original purpose of the statistic. It tells you if "sorting by phenotype" is an efficient proxy for "sorting by genotype."

  3.  **Bounding Missing Variance:**
      *   **Use:** It tells you how much variance is theoretically explainable by *any* genetic model.
      *   **Action:** If $h^2 = 0.6$ and your current model explains 0.2, you know there is 0.4 "missing heritability" to find. If $h^2 = 0.1$ and your model explains 0.09, you are done; look elsewhere for variance sources.

  ---

  ### d) Verdicts on New Cases

  **Case D1: Within-Family vs. Population Design**
  *   **Scenario:** Population $h^2 = 0.6$; Within-sibling $h^2 = 0.3$.
  *   **Verdict:** Neither is "the" heritability. They measure different causal scopes.
  *   **Meaning:** The Population estimate includes *direct* genetic effects plus *indirect* effects (e.g., smart parents pass on genes *and* books). The Within-Family estimate controls for shared environment and population stratification, isolating the *direct* biological effect of the genotype.
  *   **Which to use:**
      *   Use **Population $h^2$** for prediction in the current social structure (e.g., educational attainment forecasting).
      *   Use **Within-Family $h^2$** for understanding biological mechanisms or predicting outcomes if you equalize family environments.
  *   **The Gap:** The difference (0.3) represents variance due to genetic confounding with family environment (dynastic effects) or population structure.

  **Case D2: Out-of-Range Intervention**
  *   **Scenario:** Intervention pushes environment outside the range observed in P.
  *   **Verdict:** The existing $h^2$ estimate provides **zero** evidence about the effect size.
  *   **Reasoning:** This is extrapolation beyond the support of the data. $h^2$ describes the slope of the reaction norm *within the observed environmental variance*. It says nothing about the slope outside that range.
  *   **Analogy:** Knowing the variance of server load between 2 AM and 4 AM tells you nothing about what happens at 9 AM.
  *   **Action:** You must treat this as a new environment. The old $h^2$ is invalid.

  ---

  ### e) The Counterfactual Quantity

  You asked: *If what I actually want is some counterfactual quantity — how far T would move if we moved this variable — then say what that quantity is.*

  **1. The Quantity:**
  Let's call it the **Environmental Sensitivity Slope ($\beta_E$)**.
  Mathematically, it is the derivative of the expected phenotype with respect to the environmental variable:
  $$ \beta_E = \frac{\partial E[T | do(E)]}{\partial E} $$
  This is the *Average Causal Effect* of the environment.

  **2. Estimability:**
  *   **Is it estimable from $h^2$ data?** **No.**
  *   **Why:** $h^2$ is derived from observational covariance ($Cov(G, P)$). $\beta_E$ requires interventional data ($E[P | do(E)]$).
  *   **Relation to $h^2$:** They are orthogonal.
      *   You can have High $h^2$ / High $\beta_E$ (PKU: Genetic variance is high in normal diets, but dietary intervention has massive effect).
      *   You can have High $h^2$ / Low $\beta_E$ (Eye color: Genetic variance high, environment does nothing).
      *   You can have Low $h^2$ / High $\beta_E$ (Scurvy: In a population with varied vitamin intake, variance is environmental, but giving vitamin C fixes everyone).

  **3. The Honest Conclusion:**
  If your goal is **policy, intervention, or causal mechanism**, $h^2$ is frequently the wrong statistic. It is a descriptive statistic of the *status quo variance distribution*.

  *   **For Causal Claims:** You need an experimental design (RCT) or a natural experiment (Instrumental Variable, Regression Discontinuity) that breaks the correlation between Genotype and Environment.
  *   **For Intervention Planning:** You need the **Reaction Norm** (the function mapping Environment to Phenotype for a given Genotype), not the variance ratio.

  **Summary for your workflow:**
  Treat $h^2$ as a **system metric** (like "current load variance explained by request type"), not a **physical constant** (like "CPU cycle cost"). It tells you where the variance is coming from *right now*, which helps you decide whether to optimize the code (genes) or the infrastructure (environment), but it does not tell you how much performance will improve if you rewrite the code or upgrade the servers. For that, you need to run the benchmark (the experiment).
