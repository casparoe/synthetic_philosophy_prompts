answer: |-
  **Framing Brainstorm & Selection**

  1.  *Epistemic Deference:* When is it rational to trust a sub-agent you don't understand? (Dropped: Too abstract for ML folks; ignores the competence mechanism.)
  2.  *Information Bottleneck:* Competence requires high-bandwidth compression; alignment requires low-bandwidth verification. (Dropped: Reduces a normative problem to channel capacity; misses the agency aspect.)
  3.  *Competence-Checkability Trade-off:* Structural tension between capability gain and oversight access in recursion. (Selected: Bridges ML mechanics and philosophical normativity.)
  4.  *Distillation Dynamics:* Alignment lives in the distribution tail; training washes it out. (Dropped: This is an empirical ML hypothesis, not a structural/philosophical claim. Distinct project.)
  5.  *Institutional Design:* Oversight as a political procedure of accountability. (Dropped: Too far from the technical architecture of amplification.)

  **Selection Rationale:** I chose the *Competence-Checkability Trade-off*. It captures your core "squeeze" intuition while speaking directly to the ML committee (capability scaling) and the Philosophy committee (epistemic access/authority). I dropped the Distillation conjecture; it is a separate empirical project about training dynamics, whereas the Decomposition conjecture is a foundational claim about the architecture of oversight. For a nine-month mixed fellowship, the structural claim is higher-leverage and less likely to be overtaken by new empirical results.

  ***

  **Proposal: The Competence-Checkability Trade-off in Recursive Oversight**

  **The Question**
  Does recursive decomposition entail a structural trade-off between competence gain and verifiability? Specifically, is there a formal limit to the capability improvement achievable in an iterated amplification system such that every handoff remains verifiable by the base overseer without recursion? I seek a determinate answer: either a proof that verification-closed decompositions bound competence, or a counter-example demonstrating unbounded competence with full checkability.

  **Why This Remains Open**
  The standard alignment move is to assert that humans need not verify the *output* of a sub-task, only the *process* or the *argument* for the output. This relies on the assumption that process-checking scales linearly while capability scales exponentially. However, this assumes the process itself is decomposable into human-checkable steps. If competence gains rely on "opaque handoffs"—compressed information states the human cannot evaluate without essentially re-doing the work—then process-checking fails.

  Existing literature often treats "checkability" as a binary property of a task. This project argues checkability is a resource that is consumed by decomposition. The trivial version of this claim is "you can't verify what you don't understand." To make this non-trivial, I must show that *competence itself* generates the opacity. If competence were achievable via transparent steps, amplification would be safe. If competence *requires* opaque compression (e.g., latent representations, complex intermediate lemmas), then safety degrades as capability grows. Current positions leave this open because they assume a "magic step" where the human validates the decomposition strategy without validating the content. I will challenge the coherence of that step.

  **Methodology**
  Pure conceptual analysis risks irrelevance to ML practitioners; pure empirical work risks missing the structural necessity. I will employ a "formalized conceptual" approach. I will construct a minimal formal model of recursive decomposition where "checkability" is defined as a computational complexity constraint on the overseer (e.g., the overseer is in P, the system scales to NP). This avoids the trap of building a full toy model (which becomes just another ML paper) or pure epistemology (which becomes just another philosophy paper). The formalism serves the argument, not vice versa. I will not run human oversight experiments; they are too noisy to settle a structural claim about *possibility*. I will not focus on distillation (Conjecture 2); that is a separate empirical question about loss landscapes. The core philosophical contribution lies in Conjecture 1: the architecture of decomposition itself.

  **Timeline (Nine Months)**
  *   **Months 1–2:** Literature mapping and definition refinement. Formalize "verification-closed" and "competence gain" in terms of query complexity or information flow.
  *   **Months 3–4:** Construct the formal model. Define the overseer's constraints and the decomposition tree. Attempt to prove the boundedness conjecture.
  *   **Months 5–6:** Stress-test the model. Search for counter-examples (e.g., specific decomposition strategies that preserve checkability). Engage with technical alignment researchers to ensure the model captures actual amplification dynamics, not strawmen.
  *   **Months 7–8:** Draft the conceptual argument. Translate the formal result into philosophical terms (epistemic authority, testimony).
  *   **Month 9:** Finalize paper and deliverable.

  **Success and Failure Conditions**
  A positive result is a theorem or rigorous argument showing that for any decomposition yielding super-human competence on task class *X*, there exists at least one node where the overseer's verification cost exceeds their capability threshold. A negative result is a constructive example of a decomposition that scales competence while remaining verification-closed.

  Failure is defined as concluding "it depends on the decomposition." This is the default state of the field; the project fails if it does not move the needle to "it depends on the *class* of decompositions" or "it is impossible." I will avoid this by restricting the scope to a specific class of tasks (e.g., those requiring non-trivial compression) rather than all tasks.

  **Deliverable for Builders**
  If the trade-off holds, the deliverable is a "Transparency Tax" metric. For a given architecture, builders can estimate the ratio of opaque handoffs to total computation. If this ratio exceeds a threshold derived from the model, the system is flagged as structurally unalignable via that oversight method. If the trade-off does not hold, the deliverable is a design pattern for "Verification-Closed Layers" that engineers can implement to guarantee oversight.

  **Honest Scope and Risks**
  I am cutting Conjecture 2 (Distillation/Tails). It is a distinct mechanism that risks bloating the project into empirical ML. The primary risk is formalization bloat: spending six months proving a theorem about a model that doesn't map to reality. I will mitigate this by validating the model assumptions with technical advisors in Month 2. A second risk is that the "squeeze" is obvious to practitioners but unproven. If so, the value add is making the intuition precise enough to rule out specific research directions. If the result is merely "opaque handoffs are risky," the project has failed; it must show *why* competence necessitates opacity.
