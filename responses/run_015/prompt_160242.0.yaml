answer: |-
  Here is the settlement on the arguments, followed by the procedure, the test runs, and the caveat on continuity.

  ### Part 1: Settling the Arguments

  **1. Naturalistic Detail: Help or Hurt?**
  For your specific constraints (feature phones, one-colour print, low literacy), **detail is hurt.**
  Your friend is correct that photographs are remembered better *in a vacuum*. But you are not working in a vacuum. You are working in noise. On a low-res screen or cheap newsprint, detail turns into mud. A photograph of a specific mother is a *token* (that specific woman); a silhouette is a *type* (any caregiver). If your goal is instruction ("Go to the clinic"), the token distracts ("Why is she wearing that headscarf? Is that for my village?"). If your goal is empathy ("Care about this cause"), the token wins. For your leaflets and SMS cards, you need instruction. Stick to the silhouette.

  **2. AI Variety vs. Fixed Vocabulary**
  **Do not let an image generator spit out forty versions.**
  Isotype works because it is a *code*. If the symbol for 'clinic' changes shape every time, the user must re-learn the code every time. For low-literacy audiences, cognitive load is your enemy. Consistency reduces load. AI variability increases it. Use AI to draft, but manually force every output into your existing grid and line-weight. If you cannot force it to match the existing set, discard it.

  ***

  ### Part 2: The Tuesday Afternoon Decision Procedure

  This is a filter. If an asset fails a step, it stops. It does not move to the next step.

  **Step 1: The Function Test**
  *   **Question:** Is this image carrying a specific instruction/warning, or is it setting a mood?
  *   **Pass:** It is an instruction (e.g., 'take pill', 'boil water'). -> Go to Step 2.
  *   **Fail:** It is a mood piece (e.g., 'hope', 'community'). -> **Stop.** Use photography or illustration. Do not use Isotype symbols for emotion.
  *   **Handoff:** If the image depicts people, pause here for the Values Check (see Step 5).

  **Step 2: The Reduction Test**
  *   **Question:** Can this be drawn using no more than three distinct shapes without losing the core meaning?
  *   **Pass:** Yes (e.g., Circle + Cross + Line). -> Go to Step 3.
  *   **Fail:** No, it requires shading, perspective, or texture to be understood. -> **Stop.** Redesign or revert to text.
  *   **Constraint:** If it relies on colour to distinguish meaning (red = stop, green = go), it fails immediately (you print in one colour).

  **Step 3: The Logic Test**
  *   **Question:** Does the image require negation (NO/NOT), conditionality (IF/THEN), or probability (MAYBE)?
  *   **Pass:** No, it is a direct affirmative statement (e.g., 'Wash Hands'). -> Go to Step 4.
  *   **Fail:** Yes (e.g., 'Do Not Enter', 'Second Dose Missed'). -> **Stop.** Pictograms are terrible at negation. A cross often reads as 'danger' or 'forbidden object' rather than 'action not completed'.
      *   *Action:* You must pair this with text or a CHW explanation. Do not rely on the icon alone.

  **Step 4: The Reproduction Test**
  *   **Question:** Does this remain legible when printed at 1cm width in solid black ink on rough paper?
  *   **Pass:** Yes. -> Go to Step 5.
  *   **Fail:** No, lines merge or gaps fill in. -> **Stop.** Simplify further.

  **Step 5: The Values Handoff (Human Decision)**
  *   **Question:** Who is depicted in this figure?
  *   **Procedure:** This is not a design question. It is a values question. The design team cannot decide this via checklist.
  *   **Action:** Pass the draft to the Country Lead. Ask: "Does this clothing/hair/body type signal 'someone like me' or 'someone from the capital'?"
  *   **Rule:** If the Lead says it feels foreign or stigmatising, the design is wrong, regardless of how clean the lines are. Do not argue aesthetics. Accept the feedback and adjust the *signifiers* (clothes, hair), not the *structure* (silhouette, geometry).

  **Step 6: The Continuity Check**
  *   **Question:** Do we already have a symbol for this concept in our library?
  *   **Pass:** Yes. -> **Use the old one.** Consistency trumps improvement.
  *   **Fail:** No. -> Create new symbol, but save it to the Core Library.

  ***

  ### Part 3: Running the Procedure on Your Desk

  **(1) Icon for Second Dose Overdue (Child + Syringe + Cross)**
  *   **Step 1 (Function):** Instruction/Status. **Pass.**
  *   **Step 2 (Reduction):** Three shapes. **Pass.**
  *   **Step 3 (Logic):** **FAIL.** This requires negation/status change ('overdue' is a temporal negative). A cross over a syringe usually reads as 'No Injections' (waste disposal) or 'Danger'.
  *   **Verdict:** **Kill the icon as a standalone.**
  *   **Fix:** Do not try to solve this with better drawing. Solve it with sequence. Use two cards: Card 1 (Syringe + Tick), Card 2 (Syringe + Clock + Exclamation). Or accept that this requires text/CHW verbalisation. The procedure saves you from shipping a confusing icon.

  **(2) Cholera Risk Graphic (High Risk this Month)**
  *   **Step 1 (Function):** Warning/Status. **Pass.**
  *   **Step 2 (Reduction):** **FAIL (Temptation Check).** Making water 'dirtier' or people 'sicker' adds detail (texture, posture) that violates the three-shape rule.
  *   **Step 3 (Logic):** **FAIL.** 'High Risk' is probability. Isotype handles quantity, not probability.
  *   **Verdict:** **Redesign required.**
  *   **Fix:** Use the Isotype strength: Quantity. Show 10 figures. Colour 5 of them (if possible) or mark 5 of them with a dot to show 'half the village is at risk'. Do not draw 'sick people'. Draw 'people' and indicate the *proportion* affected. If you cannot show proportion, use a gauge metaphor (thermometer style) which is a learned convention, not a picture.

  **(3) Cover Photo (Real Mother and Child)**
  *   **Step 1 (Function):** **FAIL.** This is a mood/engagement piece, not an instruction.
  *   **Verdict:** **The procedure does not apply.**
  *   **Explanation:** This is why your friend won the argument on recall. Photographs win on *engagement*. Isotype wins on *instruction*. Your Country Director is right to keep the photo for the cover. Your procedure is for the *inside* instructions. Do not use this checklist to judge marketing assets. It will kill your engagement. Keep the photo for the cover; use the silhouettes for the dosage schedule inside.

  ***

  ### Part 4: The Continuity Problem

  You are right to worry. The Isotype method assumes a stable language. If you produce one-offs, the overhead of building a vocabulary outweighs the benefit.

  **The Fix:**
  You do not need a vocabulary for *everything*. You need a vocabulary for the *recurrent*.
  1.  **Identify the Core 20:** Look at your last year's output. 80% of your instructions probably revolve around 20 concepts (Clinic, Pill, Water, Baby, Mother, Danger, Tick, Cross, Calendar, etc.).
  2.  **Lock Them Down:** Commission or draw these 20 once. Put them in a locked folder. They are never to be redrawn.
  3.  **The One-Off Rule:** If a concept is not in the Core 20, and you suspect it won't be used again in 6 months, do not waste time making it Isotype-perfect. Use a simple, clear illustration and move on. Save the rigour for the stuff that repeats.

  **Summary:**
  *   Use photos for covers/empathy.
  *   Use silhouettes for instructions.
  *   Do not use icons for negation (No/Not) without text support.
  *   Do not vary the Core 20 symbols.
  *   Let Country Leads decide on cultural signifiers (clothes/skin), you decide on geometry.

  Print this. Stick it on the wall. If a design stalls on Tuesday, run it through the six steps. If it fails Step 3, stop drawing and start writing.
