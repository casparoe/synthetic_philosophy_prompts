prompt: |-
  So, I had a three-hour argument about pictograms on Sunday with a friend who designs icon sets for a metro system, and I came away wanting something I can actually use at work rather than another round of it. Context: I run a small comms/design team for a health charity. We churn out leaflets, flipcharts and printed cards that go out with SMS reminders, aimed at audiences with low literacy and low numeracy in about five countries. Two-day turnarounds, cheap one-colour printing plus tiny screens on old feature phones, no budget for real user testing beyond asking a couple of community health workers, and everything has to be signed off by a country lead who isn't a designer. So I need something we can run on a Tuesday afternoon, not a design manifesto.

  The fight, briefly: she says good pictograms are essentially self-explanatory and that if an icon needs teaching it's a bad icon. I said that's exactly backwards on the Neurath/Isotype stuff — the whole point was a deliberately tiny taught vocabulary with a deliberately tiny grammar, quantity shown by repeating identical figures rather than by making the figure bigger, flat silhouettes rather than naturalistic detail, and Neurath himself called it a language-like technique, a helping language that was never meant to replace words. She said those simplification rules were 1930s print-technology constraints, not facts about minds. I said no, the memory point is about minds — the Vienna museum's line was roughly that simplified pictures get remembered where accurate figures get forgotten. She came back with: people remember photographs better than line drawings, that's just empirically true, so if recall is your criterion then realism wins. I said a photograph of one particular mother and child is a token, not a type: it individuates, it can't be repeated or counted, and it will read as that family rather than as any caregiver. She said fine, but then be honest that pictures can't carry not, if-then, or maybe, and at that point the picture is doing nothing except pointing at the words. Round four was us both half-agreeing with that and then disagreeing about whether we should just give up and use text for everything. We left it there, neither of us moved, and I've been chewing on it since.

  Can you do something more useful with it than we managed? I want a decision procedure my team can run on every new icon or illustration: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it deliberately hands the decision to a person because it's a values call rather than a factual one — whose body, clothes and house end up as the generic figure is the obvious example, and I don't want the procedure pretending that's solvable by design. It should take the Neurath/Isotype material seriously (repetition over resizing, transformation over reproduction, a symbol set as a taught convention that has to be learned rather than guessed) but translated for someone who has never read a word of Neurath, and honest about what gets lost in the translation. Please settle the two things we were actually arguing about, explicitly: whether adding naturalistic detail to make an icon feel instantly readable is helping or hurting, and wether we should be letting an image generator spit out forty varied versions of a scene when the whole Isotype discipline is a fixed, reusable vocabulary. Then run the procedure on three things on my desk right now: (1) an icon for second dose overdue — a child-and-syringe with something crossed out, which nobody has managed to make legible, because negation; (2) a cholera risk graphic saying risk is high this month, where the temptation is to make the water dirtier and the people more obviously sick; (3) the cover photo everyone loves, a real mother and child at a real clinic, which tested better for recall than anything we've ever made and which our country director will fight to keep. I'd rather know now if the procedure kills (3). And tell me straight where the procedure won't work — my worry is that a taught vocabulary only pays off if the same symbols keep coming back, and most of what we produce is one-off, so tell me if the framework quietly assumes a continuity we dont have. No reading lists or references please, I can't chase them and I don't need them — I need a checklist. British English throughout as well, we're UK-registered and the house style is brutal about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Head of a small comms/design team for a health charity.
      *   **Audience:** Low literacy/numeracy, 5 countries, old feature phones, cheap 1-colour print.
      *   **Constraints:** 2-day turnarounds, no budget for formal user testing (only CHW feedback), sign-off by non-designer country leads.
      *   **Goal:** A practical decision procedure/checklist for icons/illustrations, usable on a Tuesday afternoon. No theory dumps, no reading lists.
      *   **Tone:** British English, direct, pragmatic, "brutal" house style.
      *   **The Conflict:** A debate with a metro icon designer friend about pictogram theory (Neurath/Isotype vs. Modern Realism/Self-explanatory).
      *   **Specific Requests:**
          1.  Settle the two specific arguments (Naturalistic detail: help or hurt? Image generator variety vs. fixed vocabulary).
          2.  Create a decision procedure (questions in order, pass/fail criteria, where to hand off to humans/values).
          3.  Run the procedure on three specific examples (Second dose overdue, Cholera risk, Cover photo).
          4.  Address the limitation regarding continuity/one-off production.

  2.  **Deconstruct the Arguments (Neurath vs. Friend):**
      *   *Argument 1: Naturalistic Detail.*
          *   Friend: Realism = better recall/recognition.
          *   User: Realism = token not type, individuation, distraction.
          *   *Resolution:* For *low literacy/numeracy* and *small screens/cheap print*, detail is noise. It creates ambiguity (is this specific woman or any woman?). Isotype wins on *transferability* and *reproduction*, not immediate "ooh, pretty." However, total abstraction fails if the concept isn't taught. The middle ground is "Canonical Simplicity."
      *   *Argument 2: Variety vs. Fixed Vocabulary.*
          *   Friend: Icons should be self-explanatory (implied: context-specific).
          *   User: Isotype = taught vocabulary, fixed grammar.
          *   *Resolution:* AI generating 40 varied versions destroys consistency. If "clinic" looks different every time, the user has to re-learn the symbol. For a charity churning out leaflets, consistency builds the "language." AI variety is harmful here.

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   Needs to be linear.
      *   Needs "Stop/No" points.
      *   Needs "Human Decision" points (values).
      *   Needs to incorporate Isotype principles (repetition for quantity, silhouette, no perspective) without using jargon.
      *   *Step 1: Function.* What is this doing? (Label, Warning, Instruction).
      *   *Step 2: Complexity.* Can it be drawn in 3 shapes?
      *   *Step 3: Negation/Logic.* (Crucial for the syringe example).
      *   *Step 4: Consistency.* Does it match existing assets?
      *   *Step 5: Values.* Who is depicted? (The "Human Handoff").
      *   *Step 6: Context Test.* Does it work in 1 colour? On a tiny screen?

  4.  **Running the Procedure on the Three Examples:**
      *   *(1) Second Dose Overdue (Child + Syringe + Cross).*
          *   Problem: Negation is hard in Isotype. A cross over a syringe might mean "No Syringes" (waste disposal) rather than "Missed Appointment."
          *   Verdict: Fail on Step 3 (Logic). Needs a different approach (e.g., calendar + empty slot, or colour coding if possible, though 1-colour is a constraint). Actually, Isotype handles negation poorly. Suggest alternative: Sequence (1 tick, 2 cross).
      *   *(2) Cholera Risk (Dirty water + sick people).*
          *   Problem: Temptation to add detail (vomit, filth).
          *   Verdict: Pass Step 2 (Simplicity) only if restrained. Risk is abstract. "High risk" needs a metric (e.g., 5 red figures vs 1 green figure). Adding "sick" details might stigmatise.
      *   *(3) Cover Photo (Real Mother/Child).*
          *   Problem: Tested better for recall. Country Director loves it. Violates Isotype "type not token."
          *   Verdict: This is the Values Handoff. The procedure shouldn't "kill" it if it works for *emotional connection*, even if it fails *systematic language* rules. Distinguish between *System Icons* (instructions) and *Campaign Assets* (engagement). The checklist is for the former.

  5.  **Addressing the Continuity Constraint:**
      *   User worry: Isotype only works if symbols repeat. We do one-offs.
      *   Truth: If you treat every leaflet as a new language, you lose the benefit.
      *   Advice: Build a *tiny* core library (50 icons max) that *must* be reused. If it's truly one-off, Isotype isn't worth the overhead; use simple realism. But for health instructions, consistency saves lives.

  6.  **Refining Tone and Language:**
      *   British English (colour, programme, centre, organisation).
      *   Direct, no fluff.
      *   Acknowledge the friend's points but prioritise the user's constraints (feature phones, 1-colour print).
      *   Avoid academic references (Neurath name-dropping kept to minimum/contextual).

  7.  **Review against Constraints:**
      *   *Decision Procedure?* Yes.
      *   *Settle the two arguments?* Yes.
      *   *Run on 3 examples?* Yes.
      *   *Address continuity limitation?* Yes.
      *   *No reading lists?* Yes.
      *   *British English?* Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Initially, I might suggest fixing the "Overdue" icon with a cross. But the user said "nobody has managed to make legible." I need to be honest: Isotype is bad at negation. I should suggest the procedure flags this as a "Stop" and forces a text/CHW workaround.
      *   *Correction:* On the photo. Don't just say "keep it." Explain *why* the procedure distinguishes between *instructional graphics* and *engagement imagery*. The checklist is for the former.
      *   *Correction:* On AI. Be firm. AI variety is a liability for low-literacy audiences who rely on pattern recognition.
      *   *Tone Check:* Ensure it sounds like a senior colleague talking to another senior colleague, not a lecturer. "Brutal house style."

  9.  **Final Polish:** Check the "Values Handoff" section. This is crucial. The procedure must admit when design ends and ethics/politics begins (e.g., skin tone, clothing).

  *(Self-Correction on the "Overdue" icon)*: The user mentioned "Child-and-syringe with something crossed out." In Isotype, a cross often means "forbidden" or "danger." For "overdue," time is the missing element. A syringe with a clock? Or a calendar? The procedure should flag that *negation* is a failure point for pure pictograms in this context.

  *(Self-Correction on "Continuity")*: Be honest. If they don't have a library, the Isotype method is heavy lifting. Suggest a "Core 20" approach.

