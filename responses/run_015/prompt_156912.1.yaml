answer: |-
  ### Reasoning Sketch

  **Objective:** Convert the "equality-of-what" debate into a binary decision tree for an analyst.
  **Core Tension:** Welfare (experience) vs. Resources (means) vs. Capabilities (freedom).
  **Resolution Strategy:** Prioritize *Capabilities* as the primary currency because it avoids adaptive preferences (welfare) and expensive tastes (resources). However, use *Welfare* data to detect adaptation and *Resources* to calculate efficiency.
  **Value Judgments to Flag:**
  1.  **Capability Priority:** Choosing capability over welfare is a normative claim (Sen/Nussbaum vs. Hedonists).
  2.  **Priority to Worst-Off:** Giving weight to the baseline status of beneficiaries is egalitarian, not utilitarian.
  3.  **Time Horizon:** Preferring life-share equality (Repeat Probe) over momentary equality is a choice about fairness over time.
  **Operationalization:** The four existing instruments map to specific philosophical failures.
  *   Conversion Ledger → Adaptive Preferences & Conversion Loss.
  *   Swap Test → Targeting Disadvantage vs. Individuals.
  *   Standstill Test → Levelling Down & Direction of Inequality.
  *   Repeat Probe → Time-Slice vs. Whole-Life Equality.
  **Escalation:** When instruments conflict (e.g., Capability says A, Welfare says B), the analyst cannot decide; this is a value conflict requiring Board input.

  ***

  ### DELIVERABLE 1 & 2: PROCEDURE AND GLOSSARY

  **ALLOCATION PROCEDURE (v4.1)**
  *Complete Steps 1–6 in order. Stop at first "Reject". Escalate at "Board Decision".*

  **1. Normalize Currency (Conversion Ledger)**
  *   **Question:** Can the proposal's outcomes be entered into the Ledger (Bundle, Functioning, Experience)?
  *   **Sufficient Answer:** Yes, all three columns populated with quantitative or standardized qualitative scores.
  *   **Reject:** If any column is blank or relies solely on self-reported "success" without functioning data.
  *   **Note:** Forces all applicants onto a common metric.

  **2. Check Adaptation (Conversion Ledger)**
  *   **Question:** Is the Adaptation Gap (Functioning vs. Experience) large and positive?
  *   **Sufficient Answer:** No. Experience scores do not significantly exceed Functioning scores.
  *   **Reject:** If Yes. High experience with low functioning indicates adaptive preference (learned helplessness). Do not fund based on inflated welfare scores.
  *   **Value Judgment:** Prioritizes objective freedom over subjective satisfaction.

  **3. Check Conversion Efficiency (Conversion Ledger)**
  *   **Question:** Is the Conversion Loss (Resource vs. Functioning) reasonable for this group?
  *   **Sufficient Answer:** Yes. Resource input aligns with functioning output, accounting for known disability/need costs.
  *   **Reject:** If loss is high without justification (e.g., expensive tastes rather than expensive needs).
  *   **Escalate:** If disagreement exists on whether high cost is due to "needs" (valid) or "tastes" (invalid).

  **4. Check Targeting (Swap Test)**
  *   **Question:** If beneficiaries are swapped with random eligible peers, does the currency still select the same priority group?
  *   **Sufficient Answer:** Yes. The program targets the *condition* of disadvantage, not specific individuals.
  *   **Reject:** If No. The program is tracking individuals (patronage) rather than disadvantage.
  *   **Value Judgment:** Public funds must address structural disadvantage, not personal loyalty.

  **5. Check Consistency (Repeat Probe)**
  *   **Question:** If funded for five cycles, does the queue rotate or stagnate?
  *   **Sufficient Answer:** Queue rotates or serves chronic need consistently.
  *   **Reject:** If the same households are served exclusively without rotation or justified chronic need.
  *   **Value Judgment:** Equalizing shares across a life trumps equalizing states at a moment.

  **6. Check Inequality Direction (Standstill Test)**
  *   **Question:** If the worst-off group improves and others stay still, does the inequality metric improve?
  *   **Sufficient Answer:** Yes. The metric moves toward equality without lowering the better-off.
  *   **Reject:** If the metric improves only by making the better-off worse (levelling down) or ignores the worst-off.
  *   **Escalate:** If two proposals pass but prioritize different "worst-off" definitions (e.g., income vs. health).

  **FINAL DECISION RULE**
  *   **Fund:** Proposal passing all steps with highest Capability gain per dollar for the worst-off.
  *   **Escalate:** If Step 3 or 6 yields conflicting valid results. This is a value disagreement, not a fact error.

  **GLOSSARY FOR ANALYSTS**

  *   **Capability:** What people are effectively able to do and be (e.g., moving freely, appearing in public). Distinct from what they actually do.
  *   **Functioning:** The realized state of doing or being (e.g., actually moving freely). Measured via observation or validated test, not self-report.
  *   **Experience (Welfare):** What people report feeling (e.g., happiness, pain levels). Subject to adaptation.
  *   **Conversion Loss:** The gap between Resources provided and Functioning achieved. High loss means resources aren't turning into freedom.
  *   **Adaptation Gap:** The gap between Functioning and Experience. High positive gap means people report feeling fine despite lacking freedom (adaptive preference).
  *   **Worst-off:** The group with the lowest baseline Capability score before intervention. Determined by regional data, not applicant claim.

  ***

  ### DELIVERABLE 3: WORKED APPLICATIONS

  **CASE 1: Chronic Pain Course vs. Home Insulation**
  *Audit Template*
  | Instrument | Pain Course | Insulation Retrofit | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. Ledger** | Bundle: Sessions. Func: Low. Exp: High. | Bundle: Materials. Func: High. Exp: Low. | Both Pass. |
  | **2. Adaptation** | **FAIL.** High Exp / Low Func = Adaptive Preference. | Pass. Low Exp / High Func = Normal. | Pain Rejected. |
  | **3. Conversion** | N/A (No resource transfer). | Pass. High resource → High func. | |
  | **4. Swap** | Pass. | Pass. | |
  | **5. Repeat** | Pass. | Pass. | |
  | **6. Standstill** | N/A. | Pass. Improves worst-off (low income). | |
  *Decision:* **Fund Home Insulation.**
  *Reasoning:* Step 2 rejects Pain Course. High well-being reports despite low functioning indicate beneficiaries have lowered expectations (adaptive preference). Insulation expands capability (health/shelter) even if not immediately reported as "happiness."

  **CASE 2: Powered Mobility vs. Unconditional Cash**
  *Audit Template*
  | Instrument | Powered Mobility | Cash Transfer | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. Ledger** | Bundle: Device. Func: High. Exp: Mod/Neg. | Bundle: Cash. Func: Diffuse. Exp: High. | Both Pass. |
  | **2. Adaptation** | Pass. Neg Exp / High Func = Adjustment Period. | Pass. High Exp / Diffuse Func. | |
  | **3. Conversion** | **PASS (with note).** High cost justified by expensive conversion needs (disability). | **FAIL.** Low cost but low capability attribution. | Mobility Wins. |
  | **4. Swap** | Pass. Targets impairment. | Pass. Targets income. | |
  | **5. Repeat** | Pass. Chronic need. | Pass. Rotates queue. | |
  | **6. Standstill** | Pass. Improves worst-off (disabled). | Pass. Improves worst-off (poor). | Escalate? |
  *Decision:* **Fund Powered Mobility.**
  *Reasoning:* Step 3 resolves the tie. Cash fails on capability attribution. Mobility has high conversion loss (cost) but it is justified by "expensive needs" (disability) rather than "expensive tastes." Equality of capability requires compensating for conversion disabilities.

  **CASE 3: Music Instruction vs. Legal Aid**
  *Audit Template*
  | Instrument | Music Instruction | Legal Aid (Eviction) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. Ledger** | Bundle: Lessons. Func: High. Exp: High. | Bundle: Rep. Func: High (Prevent Loss). Exp: Mod. | Both Pass. |
  | **2. Adaptation** | Pass. | Pass. | |
  | **3. Conversion** | Pass. | Pass. | |
  | **4. Swap** | **FAIL.** Recipients concentrated in better-off half. | Pass. Targets tenants facing eviction. | Music Rejected. |
  | **5. Repeat** | Pass. | Pass. | |
  | **6. Standstill** | **FAIL.** Does not improve worst-off inequality. | Pass. Prevents catastrophic loss for worst-off. | |
  *Decision:* **Fund Legal Aid.**
  *Reasoning:* Step 4 and 6 force this conclusion. Music fails the Swap Test (tracks advantaged individuals) and Standstill Test (increases capability gap between rich and poor).
  *Unwanted Conclusion Defense:* To fund Music, the Board must reject the premise in Step 6 (Priority to Worst-Off) or Step 4 (Targeting Disadvantage). This must be recorded as a Value Override, not a procedural success.

  ***

  ### DELIVERABLE 4: CLOSING SECTIONS

  **Where This Procedure Will Misfire**
  1.  **Emergencies:** In disaster relief, Capability measurement is too slow. Resource delivery (food/water) must trump Ledger analysis.
  2.  **Innovation:** New programs may lack historical data for the Repeat Probe or baseline data for the Standstill Test. They will fail by default.
  3.  **Qualitative Shifts:** Some capabilities (e.g., dignity, political voice) resist quantification in the Ledger. The procedure may systematically underfund advocacy in favor of tangible goods.

  **What It Cannot Do**
  1.  **Settle Value Conflicts:** When two programs pass all tests but serve different conceptions of the "good life" (e.g., health vs. arts), the procedure escalates. It cannot weigh plural capabilities against each other.
  2.  **Define "Worst-Off":** The procedure uses the term but cannot define it. Is it income, health, or social capital? The Board must set this baseline annually.
  3.  **Replace Democratic Accountability:** The procedure ensures consistency, not legitimacy. If the public demands funding for a program that fails the Standstill Test, the Board must override the procedure openly. This tool prevents accidental drift, not intentional policy shifts.

  \answer{Case 1: Home insulation and heating retrofit; Case 2: Powered mobility with home assessment; Case 3: Legal-aid service}
