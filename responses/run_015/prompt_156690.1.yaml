  The tension between selected-effects (SE) and causal-role (CR) accounts is not merely terminological; it reflects a deep ambiguity in what biological explanation requires. SE tracks historical etiology to ground normativity; CR tracks current disposition to ground explanatory relevance. When these come apart, we must choose which explanatory project dominates.

  In Case A, the synthetic gene $g$ lacks ancestors. SE verdicts "no function" at $t=0$. Critics scream reductio; I argue this is SE's strength. It distinguishes biological traits from artifacts until replication establishes a lineage. At $t=0$, $g$ is an engineered component, not yet a biological trait. CR correctly identifies $g$'s contribution to cell-wall capacity immediately, but this describes physiological utility, not biological proper function. The instability arises only if we demand one account cover both artifact-design and evolutionary-history. SE is correct that biological function requires a history of selection; the "first token" is a boundary case where biology emerges from engineering. After one generation, SE attributes function; CR agrees. The discontinuity is not a bug but a marker of the transition from design to evolution.

  Case B presents the orphaned trait. Predator extinction renders effect $E$ impossible. SE maintains $E$ remains the function as long as the lineage persists, even if $T$ is drifting. This preserves the intuition that $T$ is broken, not repurposed. CR verdicts $E$ is no longer a function because it contributes to no current capacity; $F$ becomes the function if beneficial. Here, SE feels unstable during the drift phase: if nothing selects, does the function persist? Standard SE says yes, based on past selection. CR says no function exists during drift. I side with SE here: the trait's identity is tied to its evolutionary history, not transient ecological contingencies. However, once selection shifts to $F$ in the subpopulation, SE must update. CR updates instantly. SE better captures the "lag" in biological identity; CR better tracks ecological reality.

  Case C involves multilevel selection. Siderophore secretion costs the cell but benefits the group. CR openly admits relativity: function for the colony, dysfunction for the cell. SE forces a choice: which level selected? If group selection maintains the trait, SE attributes function to the group. This relocates the difficulty to the empirical debate over units of selection. CR's relativity is a virtue here; it acknowledges that functional ascriptions serve specific explanatory interests. SE masks this relativity behind the metaphysics of selection levels. If we cannot determine the dominant level of selection, SE leaves function indeterminate. CR allows us to specify the system of interest. Thus, CR is more transparent, though SE provides a stronger claim about why the trait exists at all.

  Regarding the "smoothing" proposal: weighting causal roles over lineage attempts to blur the SE/CR boundary. This does not dissolve the dispute but relocates it to parameter choice (how much history matters?). It risks collapsing into SE if history dominates, or CR if recent weights dominate. It obscures the categorical difference between historical kindhood and current disposition. Function attribution is typically binary in explanation (it explains presence or it doesn't); smoothing makes this gradient, which complicates explanatory practice without solving the metaphysical tension.

  On malfunction: The colleague claims only SE underwrites malfunction. This is partially right. SE grounds normativity in historical success; a non-pumping heart fails its etiological standard. CR reconstructs malfunction via reference classes: a heart fails if it lacks the capacity typical of its type. However, CR's normativity is typological, not historical. SE is decisive for evolutionary biology where history explains presence. CR suffices for physiology where current capacity explains system behavior. Neither is universally decisive; they serve different explanatory regimes.

