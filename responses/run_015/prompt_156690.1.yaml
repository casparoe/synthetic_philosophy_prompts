      *   **Case B (Orphaned Effect/Extinction):**
          *   *Scenario:* Trait $T$ selected for $E$ (concealment). Predator extinct. $E$ impossible. Incidental effect $F$ exists. $F$ becomes beneficial in subpopulation.
