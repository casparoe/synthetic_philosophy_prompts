          The trilemma feels like you've defined "mechanism" to be purpose-relative then acted surprised that removing purpose breaks it. It is underdetermination. The difference is whether adding evidence helps. If more evidence doesn't help, it's ill-posed. Here, more behavioural evidence doesn't help with the degenerate twin, so it leans ill-posed.
