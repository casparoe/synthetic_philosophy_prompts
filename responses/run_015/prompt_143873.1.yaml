answer: |-
  **The Scenario**

  Elara, a solitary archivist with no dependents, stands before the "Qualia Link," a life-support system guaranteed to sustain her biological body for fifty years while stimulating her cortex to produce a stream of consciousness indistinguishable from normal life, containing a higher density of moments involving felt mastery, connection, and joy than her current stable but mundane existence. She knows exactly how the Link works, understands that her physical actions will have no causal impact on the external world, and her current desires are exhausted by the quality of her conscious experience, placing no weight on whether those experiences correspond to external facts. The Link can simulate struggle and effort without hedonic decay, and her welfare-relevant desires are exclusively for these internal qualitative states rather than for external states of affairs. Her remaining outside life involves no unique obligations, and her disappearance would alter no one else's welfare trajectory, leaving the choice entirely self-regarding.

  ***

  **The Verdicts**

  *   **Hedonism:** Elara ought to plug in, because the machine guarantees a greater net balance of positive phenomenological states than her ordinary life.
  *   **Actual-Desire Preference Theory:** Elara ought to plug in, because doing so maximizes the satisfaction of her actual, current desires for how her life feels from the inside.
  *   **Objective Agency Theory (Third View):** Elara ought to stay out, because welfare requires the actual exercise of causal agency in the real world, which the machine precludes.

  ***

  **Walkthrough**

  **Hedonism** looks solely at the "feel" of the life. Since the scenario stipulates the machine provides a higher density of positive experiences (mastery, joy) without degradation (tedium), and experience is the only currency of welfare, the calculation is straightforward: more good experience equals higher welfare.

  **Actual-Desire Preference Theory** looks solely at what Elara wants *now*. The scenario explicitly constructs her psychology so she desires "quality of conscious experience" rather than "truth" or "actual impact." Since the machine satisfies these specific desires more effectively than reality does, and she lacks any competing desire for authenticity that would block the choice, welfare is maximized by plugging in.

  **Objective Agency Theory** looks at what Elara *does*, not just what she feels or wants. On this view, part of what makes a life go well is actually causing things to happen in the real world. In the tank, Elara's sense of agency is an illusion; she moves no objects, helps no people, and changes no facts. Therefore, even if she is happy and satisfied, her welfare is diminished because she is cut off from the actual exercise of human capacities.

  ***

  **Critical Feature Analysis**

  The single feature doing all the work is the **specification of Elara's actual desires as purely phenomenological**. By stipulating that she currently places no value on truth or external impact, you force the Actual-Desire theorist to align with the Hedonist. If you remove this feature—if Elara simply had a vague, standard human psychology—the Actual-Desire theorist would likely claim she has a latent desire for reality that the machine cannot satisfy, causing the verdicts to split (Hedonism: Plug In; Desire: Stay Out). Without this constraint, the case collapses back into the standard debate where all three theories disagree, losing the specific pressure point you want to test (whether reality matters even when pleasure and desire agree).

  ***

  **The Hedonist Objection**

  A hedonist will attack the case by arguing **you have rigged the subject's psychology to make the intuition pump dry.** They will say: "If Elara truly doesn't care about reality, then nothing of value is lost by plugging in. The intuition that she is 'missing out' relies on *us* (the evaluators) importing a value for reality that *she* does not hold. If welfare is about what is good *for her*, and she doesn't value reality, then saying she is worse off staying out is just paternalism."

  **Does this land?** Yes, but that is precisely why the case is useful for a tutorial. It forces students to decide whether welfare is **subjective** (dependent on what the agent values/feels) or **objective** (dependent on what actually happens, regardless of valuation). The objection lands in the sense that it exposes the clash between subject-centered and reality-centered theories of welfare. It doesn't refute the case; it clarifies the stakes. The case successfully isolates the question: "Is a life wasted if the person living it doesn't think so?"

  ***

  **On Shared Simulation**

  **Drop it.** For this specific theoretical triangulation, introducing a second person plugged into the same world complicates the "Objective Agency" verdict without changing the Hedonist or Actual-Desire verdicts. If two brains interact causally within the simulation, the Objective Agency theorist might concede that *some* real agency is occurring (neural causation between subjects), which muddies the clean "no causal impact" distinction required for the Third View. To keep the case tight, you want Elara's isolation from the *real* world to be absolute. The "no real relationships" complaint is usually a proxy for "no real impact"; if you solve the relationship issue via shared simulation, students might miss the deeper point about causal efficacy.

  ***

  **On Informed-Desire Theory**

  **This would flip the verdict.** An Informed-Desire theorist would argue that Elara's current desire to ignore reality is based on ignorance of what "fake" entails. Under **full information**, she would learn that her choices are causally inert. The theorist claims that any agent who fully grasps the nature of causal inertness would necessarily form a desire for actual impact over simulated impact. Therefore, while *Actual*-Desire says "Plug In," *Informed*-Desire says "Stay Out," because the idealized version of Elara would want her achievements to be real, not just felt. This is a crucial distinction to flag for students: the difference between satisfying who we are now versus who we would be if we understood the facts.
