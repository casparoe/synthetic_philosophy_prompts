      **The Third Category (Transportability):**
      Your distinction is genuine and crucial. This is not "flukes-plus-fraud"; it is heterogeneity of treatment effects or boundary conditions. An effect real in Summer/Wistar rats may be absent in Winter/Sprague-Dawley. This is a failure of theory, not inference. Statistical reform (Bayes or preregistration) addresses internal validity (inference within the study), not external validity (transportability across contexts).

