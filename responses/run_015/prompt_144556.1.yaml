  The summary correctly identifies widespread misinterpretation of significance testing but oversells Bayesianism as a panacea while critically underestimating biological heterogeneity.

  **Audit of Claims**
  1.  **NHST answers the wrong question:** Statisticians grant $P(D|H_0) \neq P(H|D)$. They qualify that scientists often seek effect sizes or predictive accuracy, not just $P(H|D)$. They reject that this confusion *alone* drives the crisis; low power and publication bias are larger engines.
  2.  **$p < 0.05$ tells one nothing:** Grant that $p$ is not the False Discovery Rate (FDR). Qualify that $p$ constrains the likelihood ratio; combined with prior odds, it informs FDR. Reject that it provides *no* evidence; it measures incompatibility with the null.
  3.  **Most findings false/Replication projects:** Grant replication rates are low and effects shrink (regression to the mean). Qualify that "false" often means "overestimated" rather than zero. Reject that this proves *most* are false; publication bias inflates this estimate.
  4.  **Bayesian immunity to stopping rules:** Grant that likelihood ratios obey the likelihood principle. Qualify that posterior probabilities depend on the prior; optional stopping can bias posteriors if priors are vague or model checking is ignored. Reject that Bayes guarantees truth; "prior hacking" mirrors $p$-hacking.
  5.  **Preregistration solves selection:** Grant it reduces $p$-hacking. Qualify it cannot cover every analytical decision (e.g., data cleaning). Reject that it validates exploratory findings without replication.

  **Method vs. Usage**
  The identified confusions are defects of teaching and incentive structures, not the frequentist method itself. Treating $p < 0.05$ as a binary truth threshold is a heuristic abuse. Bayesian methods suffer analogous abuses; switching frameworks without changing incentives merely shifts the locus of manipulation from $p$-values to priors.

  **The Third Category**
  Your distinction is genuine and crucial. This is not "flukes-plus-fraud"; it is heterogeneity of treatment effects or boundary conditions. An effect real in one preparation may be absent in another due to unmeasured biological moderators. This is a failure of theory, not inference. Statistical reform (Bayes or preregistration) addresses internal validity (inference within the study), not external validity (transportability across contexts).

  **Conclusion on Reform**
  Consequently, the book's practical conclusion does not survive correction. Bayesian inference plus preregistration would reduce false positives arising from $p$-hacking and misinterpretation, but it cannot resolve failures caused by biological heterogeneity. If a substantial portion of the replication crisis stems from context-dependence (as your electrophysiology suggests), statistical reform alone will leave a large residue of "failed" replications that are actually true effects in specific niches. The remedy for your third category is not better arithmetic, but richer experimental design that systematically varies conditions to map boundary limits, acknowledging that nature is rarely uniform across preparations. Expect statistical reform to trim the tails of the crisis, not cure the body.
