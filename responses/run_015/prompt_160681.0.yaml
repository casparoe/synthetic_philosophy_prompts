prompt: |-
  hey — I'm on the student conduct board at my school, which is the panel that hears cases where one student says another student did something (copied homework, harrased someone, took something, whatever) and then writes up what we think probably happened, and the dean decides the punishment after that. It's me plus four other kids and a teacher advisor who has to sign off on whatever we write. We get maybe one case a week, hearings are 20-30 minutes, nobody trained us in anything, and "use your judgment" in practice means whoever talks smoother and isn't shaking wins. I was complaining about this to my sister's boyfriend, who's in grad school for philosophy, and he said there's a whole literature on this stuff — something about credibility deficits, identity prejudice, and also a version where someone can't even name what happened to them because the words aren't there yet — and the more I think about it the more I think we're definately doing the bad thing a lot of the time. But his version feels too strong to me too, because some kids really do lie or exaggerate or misremember, and we can't just believe everybody, and we're not a court, we don't get to bring in lawyers or delay for a month.

  So can you turn that into an actual procedure our panel can run on a case, in order? I mean: the questions to ask one after another, what would count as a good enough answer to each one, the point where we stop and say we can't credit this person's account, and the point where we stop and hand it to the advisor or dean because it's actually a values call and not a fact call. Some constraints on it: our writeup form makes us pick a "reason code" from a dropdown for why we did or didn't believe each person — options are things like "inconsistent with other evidence," "implausible sequence of events," "witness had no opportunity to observe," "manner and hesitation while speaking," "prior inconsistent statements" — and I want to know which of those are legitimately about evidence and which are just prejudice with a badge on. Also: what do we do with a kid who's obviously articulate, confident, well-spoken, and tells a clean story — is believing them more automatically the bad thing, or is there a version of relying on that which is fine, and how do I tell the difference in thirty seconds? And what about a kid who reports something but can only say it "felt wrong," or who uses a label they clearly picked up off tiktok last week and applies it loosely — I don't want to be the panel that dismissed someone because they didn't have the vocabulary, but I also don't want to send the dean after someone on pure vibes. And please be honest about where a checklist is just fake rigor, i.e. where we're really making a judgment call and dressing it up as a step.

  Then run the finished procedure on three cases, since that's how I'll know if it's usable. One: a quiet freshman who stutters and sometimes switches into spanish mid-sentence says a popular senior shoved her in the hallway; the senior is the debate captain, very calm, gives a detailed and internally consistent account of being somewhere else entirely, and no footage exists. Two: a sophomore who has made two false reports before — both pretty clearly attention-seeking, everyone on the board knows about them — says someone stole her phone, and this time the details check out against a blurry hallway camera and a text timestamp, though the camera doesn't show a face. Three: pick the case yourself where you think the procedure gives me an answer I won't like, and show it anyway — my guess is it's either a case where the procedure says we should refuse to decide, or one where it says we should discount someone for a reason that feels mean but is actually evidentiary, but you choose. Also tell us straight up what the procedure can't fix: where five sixteen-year-olds with no training, one adult who's half-checking his email, and a dropdown menu are just going to get it wrong no matter what checklist you hand us, and where the honest conclusion is that the decision shouldn't be made by students at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school student on a student conduct board (peer judicial panel).
      *   **Context:** 5 students + 1 teacher advisor. ~1 case/week. 20-30 min hearings. No training. "Use your judgment" = charisma contest.
      *   **Problem:** Suspects they are mishandling credibility assessments (referencing sister's boyfriend's philosophy talk: credibility deficits, hermeneutical injustice). Needs a practical procedure to mitigate bias without becoming paralyzed or naive.
      *   **Constraints:**
          *   Must be a step-by-step procedure (questions, thresholds).
          *   Must address the specific "reason codes" in their dropdown menu (distinguish evidence vs. prejudice).
          *   Must address the "articulate liar" vs. "inarticulate truth-teller" problem.
          *   Must address the "vibes/tiktok terminology" problem (hermeneutical injustice).
          *   Must admit where checklists are fake rigor.
          *   Must run the procedure on three specific cases (including one "uncomfortable truth" case).
          *   Must admit where the system is fundamentally broken/unfixable by a checklist.
      *   **Tone:** Honest, practical, non-patronizing, acknowledging the gravity of the situation without overwhelming the user with academic jargon.

  2.  **Deconstruct the Philosophical Concepts (for internal use):**
      *   *Testimonial Injustice (Fricker):* Giving someone less credibility due to identity prejudice (e.g., stuttering, status, race).
      *   *Hermeneutical Injustice:* Lacking the concepts to make sense of an experience (e.g., "it felt wrong" vs. "sexual harassment").
      *   *Credibility Excess:* Giving too much weight to someone due to status/charisma (e.g., debate captain).
      *   *The User's Dilemma:* How to balance skepticism (kids lie) with fairness (kids get prejudged) in a low-resource setting.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Structure the deliberation, not the interrogation. The hearing is already happening; the *evaluation* needs the structure.
      *   *Step 1: Separation of Fact vs. Interpretation.* Before judging *them*, judge the *story*.
      *   *Step 2: The "Reason Code" Audit.* Go through the dropdown options and flag the dangerous ones.
      *   *Step 3: The Charisma Correction.* Explicitly account for the "smooth talker" bias.
      *   *Step 4: The Vocabulary Gap.* How to handle "vibes" reports.
      *   *Step 5: The "Stop" Rules.* When to recuse or escalate.

  4.  **Addressing the Dropdown Codes:**
      *   *Legitimate:* "Inconsistent with other evidence," "Witness had no opportunity to observe," "Prior inconsistent statements" (if documented).
      *   *Dangerous/Prejudicial:* "Manner and hesitation while speaking" (captures anxiety, disability, trauma), "Implausible sequence of events" (often means "I wouldn't have done it that way").
      *   *Nuanced:* "Prior inconsistent statements" (need to distinguish between lying then vs. growing/learning now).

  5.  **Addressing the "Articulate vs. Inarticulate" Problem:**
      *   Confidence $\neq$ Truth.
      *   Procedure: Rate the *corroboration*, not the *delivery*. If the only evidence is testimony, acknowledge the uncertainty.
      *   Quick Test: "If the stuttering kid wrote this down perfectly, would I believe it?"

  6.  **Addressing the "Vibes/TikTok" Problem:**
      *   Don't dismiss the label; investigate the *behavior*.
      *   Translate "He was toxic" into "He did X, Y, Z."
      *   If they can't name the behavior, probe for specific actions.

  7.  **Addressing "Fake Rigor":**
      *   Admit that "Preponderance of Evidence" (more likely than not) is still a subjective call.
      *   Admit that peer panels inherently lack power dynamics awareness.

  8.  **Developing the Three Cases:**
      *   *Case 1 (Freshman vs. Senior):* Classic testimonial injustice risk. Senior has credibility excess. Freshman has credibility deficit (stutter, language switch).
          *   *Application:* Focus on opportunity to observe. Senior's alibi needs verification, not just smoothness. Freshman's hesitation is not evidence of lying.
      *   *Case 2 (Repeat Reporter):* Credibility deficit due to history. But physical evidence exists.
          *   *Application:* History is relevant to *intent* or *pattern*, but not necessarily to *fact* if evidence supports. Don't let "prior inconsistent statements" override camera data.
      *   *Case 3 (The "Uncomfortable Truth"):* Needs to show where the procedure says "We can't know" or "This is biased." Let's choose a "He Said/She Said" with no witnesses, involving social exclusion/relational aggression.
          *   *Why:* It highlights the limit of fact-finding in social dynamics. The procedure should force a "Not Proven" or escalation, which students hate doing.

  9.  **Addressing the Systemic Limits:**
      *   Power dynamics (Senior vs. Freshman).
      *   Lack of investigative power (can't subpoena).
      *   Advisor disengagement.
      *   The fundamental unfairness of peers judging peers in a school hierarchy.

  10. **Refining the Tone:**
      *   Avoid academic lecturing. Keep it actionable.
      *   Validate the user's intuition (they are right to be worried).
      *   Be direct about the "bad news" (some things can't be fixed).

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the dropdown codes? Yes.
      *   *Check:* Did I provide a step-by-step order? Yes.
      *   *Check:* Is the "Case 3" actually challenging? Make sure it's not just a hard case, but one where the *procedure* forces a conclusion the students might dislike (e.g., "Dismiss because we can't adjudicate social conflict").
      *   *Check:* Did I address the "fake rigor" aspect? Yes, need a specific section on that.

  12. **Final Polish:** Ensure the distinction between *Fact-Finding* (what happened) and *Value-Judgment* (was it wrong) is clear, as the prompt mentions the Dean decides punishment, but the Board decides "what probably happened."

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure gives an answer I won't like. A good candidate is a case where the evidence suggests the accuser is technically telling the truth about *facts*, but the *violation* is subjective. Or, a case where the procedure forces you to admit you *cannot* reach a conclusion, which feels like failure. Let's go with a "He Said/She Said" where the procedure forces a "No Decision" because the evidence is perfectly balanced, and the "tie-breaker" would be bias. This highlights the limitation of the panel.

  *(Refining the "Reason Codes")*: Be very specific. "Manner and hesitation" is the biggest trap. It penalizes anxiety and neurodivergence.

  *(Refining the "Vibes" issue)*: Use the concept of "Translation." Don't accept the label, ask for the data.

  *(Final check on constraints)*: 20-30 min hearings. The procedure needs to fit in deliberation time, not hearing time. The prompt asks for "questions to ask one after another" — this implies deliberation questions *or* hearing questions. Given the context ("run on a case"), it's mostly deliberation, but some hearing structure helps. I will frame it as a Deliberation Protocol based on Hearing Data.

