answer: |-
  This is a heavy responsibility, and your intuition is correct: you are operating in a zone where philosophy meets bureaucracy, and without guardrails, "judgment" usually defaults to "bias." Your sister's boyfriend is talking about **Epistemic Injustice** (specifically *testimonial injustice* and *hermeneutical injustice*). You don't need the jargon, but you need the fix.

  You cannot eliminate bias. You are teenagers, the advisor is checked out, and the system is under-resourced. But you can **structure your doubt** so that it falls equally on everyone, rather than disproportionately on the vulnerable.

  Here is a procedure designed for your specific constraints (time, dropdown menu, peer dynamics).

  ### Part 1: The "Reason Code" Audit
  Before you hear a case, agree on what your dropdown options actually mean. Most of them are traps.

  | Dropdown Option | Verdict | Why / How to Use |
  | :--- | :--- | :--- |
  | **"Inconsistent with other evidence"** | **KEEP** | This is the gold standard. Does the story contradict the camera? The text log? A witness? |
  | **"Witness had no opportunity to observe"** | **KEEP** | Did they say they saw it, but they were around the corner? This is factual, not prejudicial. |
  | **"Prior inconsistent statements"** | **CAUTION** | Only use if they said *Fact A* last week and *Fact Not-A* today. Do not use if they said "I was scared" last week and "I was angry" today. Emotions change; facts shouldn't. |
  | **"Implausible sequence of events"** | **DANGER** | **Do not use.** This usually means "I wouldn't have done it that way." Rich kids, confident kids, and neurotypical kids find different things "plausible" than others. |
  | **"Manner and hesitation while speaking"** | **BANNED** | **Never select this.** This penalizes anxiety, stuttering, trauma responses, and ESL speakers. A calm liar is still a liar; a shaking truth-teller is still telling the truth. |

  **The Rule:** If you feel like selecting "Manner" or "Implausible," you must force yourself to find one piece of *external* evidence (text, camera, third witness) that contradicts them. If you can't, you cannot mark them as not credible on those grounds.

  ### Part 2: The Deliberation Protocol (Step-by-Step)
  Do not start by voting "Guilty" or "Not Guilty." Start by grading the *information*, not the *people*. Run these five steps in order.

  **Step 1: The Translation Check (Hermeneutical Justice)**
  *   **Question:** Did the accuser use a label (e.g., "harassment," "toxic," "assault") that they might not fully understand, or describe a "feeling"?
  *   **Action:** If yes, strip the label. Look *only* at the specific behaviors they described.
  *   **Threshold:** If they say "He harassed me" but can only describe "He looked at me weird," you do not have a conduct case. You have a vibes case. **Stop.** Refer to counselor. Do not punish based on vibes.
  *   **Threshold:** If they say "He harassed me" and describe "He touched my waist after I said no," you have a behavioral fact. Proceed.
  *   **Why:** This protects the accused from vague accusations but protects the accuser from lacking the vocabulary to name specific harms.

  **Step 2: The Charisma Correction (Testimonial Justice)**
  *   **Question:** Who is the smoother speaker? Who holds more social status (Senior, Athlete, Leader)?
  *   **Action:** Mentally swap them. Imagine the stuttering freshman gave the senior's alibi. Imagine the debate captain gave the freshman's accusation.
  *   **Threshold:** If the *only* reason you believe Person A over Person B is that Person A sounded more confident, you **must** mark the finding as "Inconclusive."
  *   **Why:** Confidence is a skill, not a truth meter.

  **Step 3: The Corroboration Scan**
  *   **Question:** What exists outside of their mouths?
  *   **Action:** List every piece of physical/digital evidence.
  *   **Threshold:** If there is *zero* corroboration (no cameras, no witnesses, no texts), and it is one word against another, you generally cannot find "More Likely Than Not" unless one story is physically impossible.
  *   **Why:** In a "he said/she said" with no evidence, the default must be "We cannot determine," not "We believe the popular kid."

  **Step 4: The "Prior Record" Firewall**
  *   **Question:** Does one person have a history of lying or rule-breaking?
  *   **Action:** Acknowledge it, then isolate it.
  *   **Threshold:** A history of lying makes you *scrutinize* their evidence harder, it does not *disqualify* their evidence. If the kid who lied twice before has a camera timestamp backing them up this time, the camera wins.
  *   **Why:** People can lie sometimes and tell the truth other times. Past behavior predicts future *risk*, not present *fact*.

  **Step 5: The "Values Call" Escape Hatch**
  *   **Question:** Are we arguing about what *happened*, or whether what happened was *wrong*?
  *   **Action:** If you agree on the facts (e.g., "He did take the phone") but disagree on the intent ("He meant to steal it" vs. "He meant to borrow it"), **stop.**
  *   **Threshold:** Hand this to the Advisor/Dean immediately. Write: "Facts established: X. Intent unclear."
  *   **Why:** You are a fact-finding body. Intent and punishment are administrative judgments. Do not pretend your guess at their intent is a fact.

  ### Part 3: Where the Checklist is Fake Rigor
  You asked for honesty. Here is where this procedure lies to you:

  1.  **"Preponderance of Evidence" is a Mirage:** In a 30-minute hearing, you rarely have 51% certainty. You usually have 40% vs 40% with 20% unknown. This procedure forces you to call that 20% "Inconclusive," which feels like failure. It isn't. It's honesty.
  2.  **The Advisor Safety Net:** If your advisor is checking email, they will sign off on whatever you write. This procedure puts the burden on *you* to write "Inconclusive" when you want to write "Guilty." That is uncomfortable.
  3.  **Power Dynamics:** A checklist cannot fix the fact that a Freshman is terrified of a Senior. The Freshman might lie to protect themselves *during the hearing*. You will never know this. You must accept that some injustices are invisible to you.

  ---

  ### Part 4: Running the Procedure on Three Cases

  #### Case 1: The Freshman vs. The Debate Captain
  *   **Facts:** Freshman (stutters, code-switches) says Senior shoved her. Senior (calm, detailed) says he was elsewhere. No video.
  *   **Applying Step 1 (Translation):** Accusation is physical. Clear behavior. Pass.
  *   **Applying Step 2 (Charisma):** Senior is high status/high charisma. Freshman is low status/communication difference. **Alert:** High risk of Testimonial Injustice.
  *   **Applying Step 3 (Corroboration):** No video. No witnesses. It is Word vs. Word.
  *   **Applying Step 4 (Prior Record):** N/A.
  *   **Applying Step 5 (Values):** N/A.
  *   **The "Manner" Trap:** The Senior sounds consistent. The Freshman hesitates. If you select "Manner and hesitation," you have failed.
  *   **The Decision:** You cannot verify the Senior's alibi (no video). You cannot verify the Shove (no video).
  *   **Verdict:** **Inconclusive / No Finding.**
  *   **Write-up:** "Panel could not corroborate either account. Accuser's communication style differed from Respondent's, but per protocol, 'manner' was not weighed as evidence. Without third-party observation, preponderance of evidence not met."
  *   **Why this hurts:** The shover probably got away with it. But punishing the Senior based on a hunch undermines the board's legitimacy. If you punish the Senior, you are punishing him for being smooth, which is also unjust. The system failed the freshman, not you. Acknowledge that.

  #### Case 2: The Repeat Reporter vs. The Thief
  *   **Facts:** Sophomore (2 prior false reports) says phone stolen. Camera shows blur taking phone. Text timestamp matches. Face not visible.
  *   **Applying Step 1 (Translation):** "Stole" implies intent. Behavior is "took phone." Pass.
  *   **Applying Step 2 (Charisma):** N/A.
  *   **Applying Step 3 (Corroboration):** Camera + Timestamp supports the *taking*. Does not support *who*.
  *   **Applying Step 4 (Prior Record):** **Crucial Step.** The dropdown "Prior inconsistent statements" is tempting.
      *   *Correction:* Her prior lies were "attention-seeking" (fabricated events). This event has physical evidence (camera/timestamp).
      *   *Rule:* History lowers credibility, but physical evidence raises it higher.
  *   **The Decision:** The phone was taken without permission (implied by report). The camera shows *someone* took it. The accuser's history suggests she might lie about *who*, but the camera proves the *act*.
  *   **Verdict:** **Fact Established: Unauthorized Taking.** (Leave identification of the thief to Admin if the camera is too blurry).
  *   **Write-up:** "Prior credibility concerns noted regarding Accuser. However, physical evidence (camera log/timestamp) corroborates the occurrence of the incident independent of Accuser's testimony. Finding based on physical evidence, not testimony."
  *   **Why this works:** You didn't trust the kid; you trusted the camera. You used the procedure to bypass your bias against the "cry wolf" kid.

  #### Case 3: The "Uncomfortable Truth" (Social Exclusion)
  *   **Facts:** A student reports that a group of friends "bully excluded" her from a group chat to ruin her social standing. The group admits they removed her but says "It was a private chat for the play cast, she isn't in the play." There are no rules against private chats. There is evidence (screenshots) of the removal.
  *   **Applying Step 1 (Translation):** Accuser says "Bullying/Exclusion." Behavior is "Removed from chat."
  *   **Applying Step 2 (Charisma):** Group is popular; Accuser is isolated.
  *   **Applying Step 3 (Corroboration):** Screenshots confirm removal.
  *   **Applying Step 4 (Prior Record):** N/A.
  *   **Applying Step 5 (Values Call):** **STOP.**
      *   *The Conflict:* Did they *do* it? Yes. Was it a *violation*? The code of conduct likely prohibits "harassment" or "hazing." Is excluding someone from a WhatsApp group harassment?
      *   *The Procedure:* This is a Values Call. You are being asked to decide if social ostracization is a conduct violation. That is a Dean's call, not a student fact-finder's call.
  *   **Verdict:** **Facts Established, Policy Unclear.**
  *   **Write-up:** "Panel confirms Accuser was removed from digital group. Panel cannot determine if this action violates the 'Harassment' code without administrative interpretation of social boundaries. Referring to Dean for policy determination."
  *   **Why you won't like this:** You want to help the lonely kid. But if you rule this is "Harassment," you are setting a precedent that students must include everyone in private spaces. If you rule it's "Not Harassment," you are validating cruelty.
  *   **The Hard Truth:** This is where the checklist saves you. If you vote on this, you are making policy. If you refer it, you are admitting the school hasn't defined what "social bullying" means. The procedure forces you to admit the school's rules are vague.

  ### Part 5: What This Cannot Fix
  You asked for the honest conclusion on where you will get it wrong no matter what.

  1.  **The "He Said/She Said" with Power Imbalance:** If a teacher's pet accuses a troublemaker, or a Senior accuses a Freshman, and there is no evidence, the system is rigged. The procedure forces you to say "Inconclusive," which feels like abandoning the victim. **Truth:** In a low-evidence environment, the person with more social capital always wins. The checklist just makes you admit it's happening.
  2.  **The Advisor Vacuum:** If your teacher advisor refuses to read your "Inconclusive" report and tells you to "Just pick one," **you are not a conduct board.** You are a rubber stamp. No checklist fixes an adult who abdicates their duty.
  3.  **The Punishment Gap:** You decide "what happened." The Dean decides "what it means." You can find that a shove happened, and the Dean can give a slap on the wrist because the Senior is a "good kid." You cannot fix that.

  **Final Advice:**
  Use the "Inconclusive" finding. It is not a failure. It is the only honest answer when the evidence is 50/50. It is better to let a guilty person go unpunished by the board (and maybe caught later) than to punish an innocent person because they stuttered.

  If the Advisor pushes you to pick a side when your protocol says "Inconclusive," write in the notes: *"Panel recommendation was Inconclusive based on lack of corroboration. Final determination made at Advisor request."* That protects your conscience, and it creates a record that the process was overridden.
