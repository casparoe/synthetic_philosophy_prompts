answer: |-
  ### Part 1: Verdict on Your "Cuts"

  **Neither is a red herring.** Both map onto established philosophical distinctions, though they aren't always named this way in history departments.

  *   **The Substitution Test** isolates **Specificity**. It asks whether the *mechanism* matters or only the *magnitude*. In philosophy of science, this distinguishes between a "black box" cause (input X yields output Y) and a "mechanistic" explanation (process Z connects X to Y). If the story survives the swap, the historian is arguing from **Demographic Functionalism**. If it breaks, they are arguing for **Biological Agency**.
  *   **The Two-Key Test** isolates **Conjunctive Causation**. It asks whether the factors are *sufficient* on their own or *necessary* in combination. This is the difference between an INUS condition (Insufficient but Necessary part of an Unnecessary but Sufficient condition) and a simple trigger. In political ecology, this is the difference between "vulnerability" and "hazard."

  You can build the tree on these without apology. They are the logical backbone of the argument.

  ***

  ### Part 2: The Decision Tree (Handout Draft)

  **Instructions:** Start at Q1. Follow the arrows. Record your path. Find your position at the Leaf.
  **Cases to keep in mind:** Irish Potato Blight, Tambora (1815), Yellow Fever (St. Domingue), 1918 Flu (swapped for Smallpox to avoid genocide/virgin soil debates that stall the logic), Hospital Antibiotic Resistance.

  **Q1. The Social Sufficiency Check (Two-Key Part A)**
  *Looking at your case (e.g., Ireland 1840s): If the pathogen or volcano had never appeared, would the social collapse still have happened due to policy, land tenure, or war?*
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to Q2.

  **Q2. The Biological Sufficiency Check (Two-Key Part B)**
  *If the society had been perfectly resilient (equal distribution, no crowding), would the pathogen or climate anomaly still have caused the specific historical outcome?*
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to Q3.

  **Q3. The Substitution Test**
  *Swap the specific actor for a different one with the same death toll and timing (e.g., swap Potato Blight for a generic grain rust; swap Yellow Fever for Malaria). Does the historical narrative have to be rewritten?*
  *   **No (Story stays the same):** Go to **Leaf 3**.
  *   **Yes (Story changes):** Go to Q4.

  **Q4. The Feedback Check**
  *Did the human response change the non-human actor? (e.g., Did antibiotic use drive resistance? Did land clearance change the mosquito load?)*
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to Q5.

  **Q5. The Mind Check**
  *To call something an "agent" or "actor," does it need to have intentions, consciousness, or a mind?*
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to Q6.

  **Q6. The Symmetry Check**
  *Should we use the same vocabulary to describe the action of the germ/cloud and the action of the general/policymaker? (e.g., "The virus decided" vs. "The virus replicated")*
  *   **Yes:** Go to **Leaf 6**.
  *   **No:** Go to **Leaf 7**.

  **Q7. The Volcano/Bug Distinction**
  *Does it matter if the actor is a living organism that evolves (bug) versus a static physical force (volcano/climate)?*
  *   **Yes (Bugs are different):** Go to **Leaf 8**.
  *   **No (All matter is equal):** Go to **Leaf 9**.

  **Q8. The Blame Check**
  *Does framing the non-human as an "actor" change how we assign human responsibility?*
  *   **Yes (It reduces human blame):** Go to **Leaf 10**.
  *   **Yes (It increases human blame):** Go to **Leaf 11**.
  *   **No (Responsibility is unchanged):** Go to **Leaf 12**.

  ***

  ### Part 3: The Leaves (Positions)

  **Leaf 1: Social Inevitabilism**
  *Position:* The social structure was already brittle; the non-human was merely a timing mechanism. The Blight didn't cause the Famine; British policy did.
  *Confidence:* **High.** (Standard position in revisionist economic history and political ecology).

  **Leaf 2: Biological Determinism**
  *Position:* The pathogen or climate event was so overwhelming that no social arrangement could have prevented the outcome.
  *Confidence:* **Medium.** (Common in older historiography; less common now, but still held by some epidemiologists regarding high-virulence strains).

  **Leaf 3: Demographic Functionalism**
  *Position:* The specific biology is irrelevant; only the shock to the labor force or calorie supply matters. A volcano or a plague works the same way in the model.
  *Confidence:* **High.** (Common in cliodynamics and quantitative historical sociology).

  **Leaf 4: Co-evolutionary History**
  *Position:* The history is driven by the feedback loop. We changed the bug, and the changed bug changed us. (Best fit for Antibiotic Resistance).
  *Confidence:* **High.** (Standard in history of medicine and science studies).

  **Leaf 5: Humanist Exceptionalism**
  *Position:* Only humans are agents. Germs and volcanoes are "causes," "forces," or "contexts," but never "actors." Agency requires a mind.
  *Confidence:* **High.** (The default position for most traditional narrative historians).

  **Leaf 6: Symmetrical Actancy (ANT)**
  *Position:* Humans and non-humans are both "actants." We should describe the virus's "strategy" and the general's "strategy" using the same structural vocabulary.
  *Confidence:* **High.** (Core tenet of Actor-Network Theory; widely defended in STS).

  **Leaf 7: Asymmetrical Materialism**
  *Position:* Non-humans act without minds, but we should still describe them differently than humans to avoid confusion. They have causal power, but not moral agency.
  *Confidence:* **Medium.** (Often the practical working position of scientists; less often theorized explicitly in HPS).

  **Leaf 8: Biological Specificity**
  *Position:* Living pathogens qualify as special actors because they evolve and track environments; volcanoes do not. The tree splits here: bugs are agents, mountains are scenery.
  *Confidence:* **Medium.** (Intuitively held by biologists; rarely defended as a philosophical principle in history).

  **Leaf 9: Radical Symmetry**
  *Position:* There is no ontological difference between a virus, a volcano, and a voter. All are nodes in a network.
  *Confidence:* **High.** (Strong ANT/Post-humanist position).

  **Leaf 10: Exculpatory Naturalism**
  *Position:* "It was the germ." Highlighting the non-human actor reduces human culpability for the disaster.
  *Confidence:* **High.** (Common criticism leveled by political ecologists against environmental determinists).

  **Leaf 11: Compounded Responsibility**
  *Position:* "The germ killed, but we loaded the gun." Highlighting the non-human actor *increases* human responsibility because it reveals we built the vulnerability.
  *Confidence:* **High.** (Standard position in critical geography and disaster studies).

  **Leaf 12: Environmental Possibilism**
  *Position:* The non-human sets the boundaries of what is possible (the stage), but does not dictate the script (the play). Responsibility remains human, but scope is limited.
  *Confidence:* **High.** (Classic geographical position; very common compromise).

  ***

  ### Part 4: Logical Holes & Indistinguishable Pairs

  **Logical Holes (Unoccupied Space):**
  1.  **"Volcano Agency without Symmetry":** The tree allows for a position where a volcano is an "actor" (fails Q5) but we *don't* use symmetrical vocabulary (fails Q6) and it *is* different from a bug (fails Q7). This is logically possible but rarely occupied. People who grant volcanoes agency usually go all-in on Symmetry (Leaf 9).
      *   *Why:* It's unstable. If you grant agency to a rock, you usually accept the vocabulary that comes with it.
  2.  **"Biological Determinism + Compounded Responsibility":** The view that the germ was unstoppable (Leaf 2) *and* that humans are more to blame (Leaf 11).
      *   *Why:* Incoherent. If the outcome was biologically inevitable, human responsibility for the *outcome* is logically minimized, even if preparation was poor.

  **Indistinguishable Pairs (Fuzzy Boundaries):**
  1.  **Leaf 3 (Demographic Functionalism) vs. Leaf 1 (Social Inevitabilism):**
      *   *The Blur:* Both end up saying "Society was the real driver." Leaf 1 says the society was *going to collapse anyway*; Leaf 3 says the society collapsed *because of the shock, but the type of shock didn't matter.* In practice, historians often slide between these without noticing.
      *   *Advice:* If your group argues here, ask: "Would a different disaster have saved them?" If yes, they are Leaf 1. If no, they are Leaf 3.
  2.  **Leaf 7 (Asymmetrical Materialism) vs. Leaf 5 (Humanist Exceptionalism):**
      *   *The Blur:* Leaf 5 says "Only humans act." Leaf 7 says "Bugs act, but we talk about it differently." In a reading group, these sound identical.
      *   *Advice:* Press on the word "cause." Leaf 5 says bugs are *causes*. Leaf 7 says bugs are *actors* that cause. It's a metaphysical distinction that rarely changes the historical narrative.

  ***

  ### Part 5: Confidence Check

  **Least Confident Element:** **Leaf 8 (Biological Specificity).**

  *   **Why:** This leaf suggests a position where a pathogen qualifies as an "actor" because it is alive/evolving, but a volcano does not, *without* committing to full Symmetrical Actancy (Leaf 9) or Humanist Exceptionalism (Leaf 5).
  *   **Condition for Wrongness:** I am least confident that anyone *defends* this explicitly as a philosophical stance. It is likely a "working intuition" for biologists (like yourself) rather than a defended position in HPS literature. Most philosophers of science who grant agency to bugs (e.g., Hans-Jörg Rheinberger on experimental systems) tend to extend that logic to other material forces, or they retreat to "mechanism" rather than "agency." If your group presses this leaf, ask them to name a theorist who draws the line specifically at *life*. They may struggle.

  **Note on Cases:**
  *   **Smallpox vs. 1918 Flu:** I swapped Smallpox for 1918 Flu in the tree instructions. Smallpox in the Americas is factually robust, but the "virgin soil" explanation is currently contested by historians emphasizing social disruption (war, slavery, displacement). Using Smallpox often triggers a "Genocide vs. Germ" debate that halts the HPS logic. 1918 Flu allows you to test the *biology* (virulence, waves) without the immediate moral blockage of colonialism, making it a cleaner tool for *this specific tree*.
  *   **St. Domingue:** The Yellow Fever case is solid for the "Specificity" branch (mosquito ecology matters more than just "fever"), so keep it.
