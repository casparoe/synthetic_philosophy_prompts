answer: |-
  Here is the breakdown of Marisol's logic, the rules derived from her track record, and how they apply to Anet's scene.

  ### The Three Rules

  Based on the five precedents and the two marginalia notes, here are the three operational rules that fit her edits. They are variations of the same core distinction, but they diverge slightly in how they predict Anet's outcome.

  **1. The Locus of Damage (Act vs. Identity)**
  *   **The Rule:** Guilt is about what you *did* (a specific act that violated a rule). Shame is about who you *are* (a fundamental flaw in your nature or role).
  *   **The Precedents:**
      *   *Ledger/Guilt:* The accountant broke a rule (falsified entries). He fixed the rule-break (repaid money).
      *   *Wall/Guilt:* The man broke a rule (stole). He paid the penalty (sat at the wall).
      *   *Sous Vide/Shame:* The chef wasn't just "rude"; she was revealed to be *abusive*. The clip proves her nature.
      *   *Balcony/Shame:* The lifeguard didn't just "make a mistake"; she failed the ontological requirement of her role (protecting life). Funding lessons admits the flaw but doesn't change the nature of the failure.
      *   *Nightshift/Neither:* It was a system error, not a moral failing of act or self.
  *   **Prediction for Anet:** **Shame.** Anet hasn't just made a mistake; she is a fraud. Her role is "load-bearing for how everybody there talks about what a person is." By failing to read the ice, she isn't just a bad worker; she is a false person. The damage is to her identity, not just a ledger.

  **2. The Possibility of Restitution (Fixable vs. Bearable)**
  *   **The Rule:** Guilt is the one you can do something with (Marginalia 1). If there is a transaction available to balance the scales, it is guilt. If the only option is to endure the truth of yourself, it is shame.
  *   **The Precedents:**
      *   *Ledger/Guilt:* Repaid the money. Transaction complete.
      *   *Wall/Guilt:* Sat at the wall. Penance paid.
      *   *Balcony/Shame:* Funded lessons, but the clip is still up. The transaction failed to erase the truth. Marisol noted the apology made it *worse* because it highlighted the inability to fix the core issue.
      *   *Sous Vide/Shame:* Apology made it worse. You cannot apologize away being an abuser.
  *   **Prediction for Anet:** **Shame.** In the Naming ritual, "standing is unchanged afterwards." There is no mechanism for penance. She cannot repay the luck she stole. She can only speak the truth and bear it. There is no "doing something with it" other than surviving the knowledge.

  **3. The Function of Exposure (Transactional vs. Ontological)**
  *   **The Rule:** Guilt is social debt; Shame is social truth (Marginalia 2). If the ritual exists to settle a debt so the community can move on, it engineers Guilt. If the ritual exists to force the community to acknowledge a hard truth without necessarily resolving it, it engineers Shame.
  *   **The Precedents:**
      *   *Wall/Guilt:* The ritual (facing the wall) is a transaction. Debt paid, next morning back to job.
      *   *Naming (Current):* The ritual is speech without response. It extracts truth, not payment.
  *   **Prediction for Anet:** **Shame.** The Naming is designed to land on Shame. It asks for "the thing you are worst at," not "the debt you owe."

  ### The Verdict

  **Marisol will say Anet is feeling Shame.**

  **In the boat:** Anet feels the crushing weight of being a fraud (Identity). It is not about the risk she took (Act); it is about the fact that she *is* the sort of person who would take that risk without the skill.
  **At the Naming:** She speaks her truth ("I am worst at reading the ice" or "I am a guesser"). The silence of the crowd confirms the truth. She does not step down (because standing is unchanged). She returns to her life carrying the secret truth that she is a fraud. This aligns with *Balcony*: the swimming lessons were shameful because they were an attempt to buy off an identity flaw. Anet speaking at the Naming is not buying it off; it is admitting it.

  ### The Closest Analog

  **The Closest Analog is *Balcony*.**

  *   **Why:** In *Balcony*, the lifeguard betrayed the specific trust of her role (safety), but no physical harm occurred (kid is fine). She attempted a private restitution (lessons), but Marisol identified that as the "most shameful beat" because it acknowledged the identity flaw without fixing the public reality.
  *   **Application:** Anet betrayed the trust of her role (ice safety), no physical harm occurred (no one died). If she tries to "fix" it by training a replacement *outside* the ritual, that is the swimming lesson beat (Shame). If she uses the ritual to simply state the truth, it is the core Shame beat.
  *   **Why not *The Wall*?** *The Wall* involves a specific, engineered penance (sitting) that resolves the debt. Anet has no penance available.
  *   **Why not *The Ledger*?** *The Ledger* involves full restitution (repayment). Anet cannot repay luck.

  ### The Flip

  **The single change to flip Marisol from Shame to Guilt:**

  **Allow Anet to step down from the role as part of the Naming.**

  *   **Current:** She speaks, standing is unchanged, she remains the Ice-Reader. -> **Shame** (She bears the truth of her identity while continuing the charade or living with the fraud).
  *   **The Change:** She speaks, and the ritual *requires* or *allows* her to relinquish the title.
  *   **Why:** This gives her "something to do with it" (Marginalia 1). It turns the confession into a transaction. She pays the debt of the fraud by surrendering the position. It becomes an *Act* (resigning) rather than just a *Truth* (being a fraud). It moves the locus from "I am a liar" to "I am correcting my record."

  ### The Cultural Question

  **Can a culture choose which emotion its people end up with?**

  **Yes.** Marisol's verdicts suggest that culture does not choose the *feeling* directly, but it **engineers the pathway** that dictates the feeling.

  *   **The Wall** is engineered to land on **Guilt**. It takes a moral failing and frames it as a *debt*. By providing a specific penance (sitting) and a restoration of standing, it forces the participant to view the event as a transaction. "I stole, I paid, I am clear."
  *   **The Naming** is engineered to land on **Shame**. It takes a moral failing and frames it as a *truth*. By demanding speech without offering penance or changing standing, it forces the participant to view the event as an ontological revelation. "I am flawed, I speak, I endure."

  **Do you need to rewrite Book One?**
  **No.** You do not need to rewrite *The Wall* to match *The Naming*. In fact, having both makes your culture richer.
  *   A culture needs **Guilt** mechanisms (*The Wall*) to handle breaches of contract and law so that social debt doesn't accumulate and destroy the community.
  *   A culture needs **Shame** mechanisms (*The Naming*) to handle breaches of identity and trust so that social honesty is maintained even when no specific law was broken.

  **The Conflict:** The only rewrite you might need is if you have previously described *The Naming* as a "forgiveness ritual." If the characters *think* The Naming is for forgiveness (Guilt), but it functions as truth-telling (Shame), that is a source of dramatic irony you can keep. But if you wrote it in Book One as a place where people "clear their conscience" (Guilt), you should tweak that phrasing to "clear their name" or "speak their truth" (Shame).

  **Summary for the Scene:**
  Write the boat scene as **Shame**. Anet isn't worried about what she *did*; she is terrified of what she *is*. At the Naming, do not let her fix it. Let her speak the truth, let the silence hold, and let her walk back into her life carrying the weight of that truth. That is the only verdict that fits Marisol's rule that "Shame is the only one telling the truth about a person."
