  1.  **Analyze the User's Request:**
      *   **Context:** Organizing a team retreat.
      *   **Proposal:** A coworker suggested a "drunken symposium" based on Plato's *Laws*.
      *   **Claim:** The coworker says Plato argues wine acts as a "mirror for the soul," revealing true personalities (courage, temperance) by dropping guards.
