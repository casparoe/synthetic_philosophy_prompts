answer: |-
  To compare Karl Jaspers's taxonomy of guilt with the theory of diachronic collective agency, we must examine the ontological status of the "agent" in each framework. Jaspers's distinction relies on a strict existential individualism, whereas diachronic collective agency posits a corporate personhood that persists through time.

  If we grant the premise of diachronic collective agency—that the nation is a single continuing agent analogous to an individual across a lifetime—Jaspers's firewall between political liability and moral guilt collapses. Under the diachronic model, the state becomes capable of genuine moral guilt, not merely political liability, because the feature that blocks inherited moral blame in Jaspers's system (the locus of conscience in the biological individual) is explicitly redefined by the diachronic view.

  ### 1. Jaspers's Taxonomy: The Firewall of Conscience
  In *The Question of German Guilt* (1947), Jaspers distinguishes four types of guilt to prevent the total condemnation of the German people while ensuring accountability for Nazi crimes. The critical tension lies between **Political** and **Moral** guilt.

  *   **Political Guilt:** This attaches to all citizens by virtue of their membership in the state. It concerns the deeds of the state apparatus. Because the state acts in the name of the people, all citizens share responsibility for its actions and its debts. This guilt is **collective** and **inheritable** in the sense that new citizens inherit the liabilities (reparations, loss of sovereignty) of the regime that preceded them. However, for Jaspers, this is external liability, not internal sin.
  *   **Moral Guilt:** This concerns the individual's own actions and intentions. It is judged in the "forum of conscience." Jaspers insists that moral guilt is **strictly individual** and **non-transferable**. "There is no such thing as the collective moral guilt of a people," Jaspers argues. One cannot be morally guilty for another's crime, even a fellow citizen's, because one cannot possess another's conscience.

  **The Blocking Feature:** The specific feature in Jaspers's taxonomy that blocks inherited moral blame is **Existential Individualism**. For Jaspers, moral agency requires *Existenz*—an authentic, self-reflective consciousness located exclusively in the biological human being. A state is a technical organization, not a soul. Therefore, a state can be politically liable, but it cannot be morally guilty. Since moral guilt requires a conscience, and only individuals have consciences, moral guilt cannot persist across generations or be borne by a collective.

  ### 2. Diachronic Collective Agency: The Nation as a Moral Person
  The theory of diachronic collective agency treats the nation-state not as an aggregate of current citizens, but as a corporate person that persists through time. Analogous to an individual human who is responsible at age 50 for promises made at age 20, the nation at Time 2 is the same agent as the nation at Time 1.

  *   **Continuity:** This view relies on psychological or functional continuity (institutions, culture, constitutional identity) rather than biological continuity.
  *   **Agency:** If the nation is a genuine agent, it possesses intentions, makes decisions, and acts.
  *   **Responsibility:** If the nation is an agent, it is a candidate for moral praise and blame. If the Nation-1 commits a genocide, Nation-2 is not merely liable for damages (political guilt); Nation-2 bears the moral stain of that action because it is the *same agent*.

  ### 3. The Collision: Collapsing the Distinction
  When we model the nation diachronically, Jaspers's separation of political and moral guilt is fundamentally challenged.

  **Does Jaspers's claim hold?**
  No. Jaspers claims political guilt is inheritable because it attaches to the state, while moral guilt is not because it attaches to the soul. Diachronic agency argues that the state *has* a functional equivalent of a soul (agency/intentionality) that persists. Therefore, if the state is the agent, the guilt attached to its past actions is not just a debt to be paid (political); it is a moral failure of the agent itself.

  **Does modeling the nation diachronically collapse the separation?**
  Yes. If the nation is a diachronic agent, the distinction between "actions of the state" (Political) and "actions of a moral agent" (Moral) dissolves.
  *   In Jaspers's view: The State acts $\rightarrow$ Citizens pay (Political). The Individual acts $\rightarrow$ Individual feels shame (Moral).
  *   In Diachronic view: The Nation (as Agent) acts $\rightarrow$ The Nation (as persisting Agent) bears Moral Guilt.

  This forces us to say that **moral guilt can be carried forward by the collective agent.** The nation itself becomes the subject of moral blame, independent of the specific moral guilt of current individual citizens.

  ### 4. Identifying the Blocking Feature and Its Survival
  To answer the prompt precisely: The feature of Jaspers's taxonomy that blocks inherited moral blame is the **ontological restriction of moral agency to biological individuals.** Jaspers assumes that *only* human beings can be moral agents because only they possess conscience.

  **Does this feature survive once collective diachronic agency is granted?**
  **No.** The premise of diachronic collective agency explicitly denies this restriction. It posits that collective entities can possess the requisite features of agency (intentionality, memory, decision-making capacity) to qualify as moral agents.
  *   If the collective is an agent, it can violate moral norms.
  *   If it violates moral norms, it incurs moral guilt.
  *   If it persists through time, it carries that guilt forward.

  Therefore, under the diachronic model, the "individual conscience" is no longer the sole vessel for moral guilt. The "collective conscience" (manifested through public memory, institutional repentance, and national identity) becomes the vessel.

  ### 5. Genuine Guilt vs. Political Liability
  The ultimate divergence lies in whether the nation can be *genuinely guilty*.

  *   **Jaspers:** The nation can never be genuinely (morally) guilty. It can only be politically liable. Current citizens may feel *metaphysical* guilt (a failure of human solidarity) or *moral* guilt (for their own specific complicity), but they cannot inherit the *moral guilt* of the predecessors' specific crimes. To claim otherwise is, for Jaspers, a dangerous mystification that obscures true individual responsibility.
  *   **Diachronic Agency:** The nation *can* be genuinely guilty. The guilt is not merely a liability to pay reparations (which could be done grudgingly); it is a moral debt that requires repentance and moral repair. The collective agent itself is the sinner.

  **Conclusion**
  Jaspers's taxonomy relies on the premise that moral agency is biologically bounded. Diachronic collective agency unbinds it. If we accept the nation as a persisting agent, Jaspers's claim that moral guilt remains strictly individual and non-transferable **does not hold**. The feature that blocks inherited moral blame—the exclusion of collectives from the realm of moral conscience—does not survive the grant of diachronic agency. Consequently, the diachronic framework forces us to acknowledge that a nation can bear genuine moral guilt for the wrongs of prior generations, transforming what Jaspers classified as mere political liability into a form of collective moral culpability.
