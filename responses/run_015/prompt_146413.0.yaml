  **Motivation:** Clause 1 distinguishes Case 1 (Expanding) and Case 2 (Gödel) from Case 3 (Static), grounding time in dynamics rather than mere coordinates. Clause 2 resolves your tension between Case 2 and Case 4. Despite local physical similarity, Case 4 admits Global Time, aligning it ontologically with Case 1, whereas Case 2 does not. In Case 5 (Pocket), CTCs violate hyperbolicity within the region, denying Global Time locally, which explains why local reality feels undermined despite local dynamics.

  **Prediction:** For a Gödel universe where observers never intersect their past: The manifold still lacks a Cauchy surface. Verdict: Local Time is real (dynamics exist), but Global Time is illusory. Ontology tracks geometric possibility, not experienced paradoxes. The absence of *actual* paradoxes does not restore Global Time if the *possibility* remains structurally embedded.

  **Trade-off:** To maintain this precision, you must drop the ambivalence in Case 5; the principle dictates Global Time is strictly false inside the pocket, not "unsure." Furthermore, you must accept that Case 2's "local time" is ontologically fragmented. By tying Global Time strictly to Cauchy surfaces, you concede that in Gödel universes, objective temporal becoming is fundamentally incomplete, not just globally unavailable. This prioritizes structural integrity over the intuition that local experience should fully sustain temporal reality independent of global topology.
