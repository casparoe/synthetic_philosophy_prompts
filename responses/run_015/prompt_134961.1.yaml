answer: |-
  **1. Fiscal-Signaling View**
  **Tier: A (Fully coherent under symmetric bookkeeping)**
  This framework survives best because it treats conditionality as a neutral mechanism-design tool to minimize fiscal leakage, requiring only that compliance costs be applied symmetrically to tax expenditures and subsidies without invoking moral status. Nothing conceptual has to give; the state simply acknowledges that screening for "need" or "compliance" is a universal administrative function applicable to all fiscal actors.

  **2. Strict Reciprocity View**
  **Tier: B (Partially coherent with costly adjustments)**
  This view remains logically consistent only if tax avoidance is reclassified as a breach of social contract equivalent to benefit non-compliance, requiring costly legal and political adjustments to equate fiscal free-riding with labor shirking. It survives the symmetry test conceptually, but only by abandoning the current legal distinction between legitimate tax planning and illegitimate welfare dependency.

  **3. Desert-Based View**
  **Tier: C (Incoherent without abandoning the bookkeeping premise)**
  This justification falters because "willingness to work" lacks a functional analogue for passive income or corporate subsidy recipients, forcing the abandonment of symmetric bookkeeping to avoid judging the moral character of wealthy actors. To maintain coherence, one would have to redefine economic contribution as moral performance across all classes, a metric current institutions do not possess.

  **4. Paternalistic Autonomy View**
  **Tier: D (Internally contradictory under symmetric application)**
  This framework is internally contradictory under symmetry because it justifies intervention via recipient incompetence or bias, which cannot be applied to wealthy actors without undermining the rational agency required for liberal market participation. To apply this symmetrically, the state would have to deny the decision-making capacity of capital owners, collapsing the very autonomy rights that protect their economic status.
