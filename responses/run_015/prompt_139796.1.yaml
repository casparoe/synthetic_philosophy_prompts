answer: |-
  Dear Colleague, here is the preparation you requested for the question period, written as a continuous note to guide your thinking tonight. The most dangerous moment will be the first thirty seconds after the chair opens the floor, because the room will be deciding whether you are evading reality or clarifying it. You should use that time to pre-empt the trait-ledger objection by inviting it. Say that you welcome challenges on which traits deserve weighting, because your method requires disagreement to function. This frames dissent as cooperation rather than correction, and it disarms the survey specialists who are already counting settlement shards in their heads. If you do not set this tone, the session will become a trial of your empirical rigour rather than a discussion of your ontological claim, and you will lose the philosophers whose support you need to secure the argument's foundation.

  The objections will arrive in an order determined by disciplinary instinct, but you must rank your preparation by the damage each could do if mishandled. The survey archaeologists will speak first. They will tell you that settlement counts and radiocarbon curves show continuity where you see silence, and that distinguishing elite ideology from the material base is a luxury we cannot afford when measuring human survival. They will ask why a farmer's continuity matters less than a scribe's silence. You should concede outright that demographic catastrophe is not your focus and that material life often persists through political rupture. Hold the line that a society is not merely a population but a specific organisation of legibility, and that calling this continuity without qualification erases the specific loss of the system that made them a unit to begin with. Your ninety-second reply should be that counting bodies is not the same as counting societies, and that if we define society by subsistence alone, we cannot distinguish between a kingdom and a village. The weakness here is that it risks sounding elitist, as though the lives of commoners do not matter unless recorded by palaces, so you must emphasise that the loss is analytical, not necessarily human.

  Next, the Maya specialists will press the distinction between divine kingship and Maya communities. They will ask whether you are suggesting the Maya ceased to exist when the stelae stopped, despite millions of descendants living today. Concede that ethnic and cultural continuity is undeniable and distinct from political collapse. Hold that the specific society of the Classic period was constituted by that kingship institution, and its end is a real historical event even if the people survived. Reply that we must distinguish between the persistence of a people and the persistence of a political ontology, and that conflating the two prevents us from understanding how power actually failed. This is weak because it invites the charge that you are defining society out of existence to save your theory, so be prepared to admit that the trait-ledger might weight kinship higher than monarchy in other contexts.

  The historians of environmental narrative will ask whether your account is just a slower, better-mannered version of the determinism they study, replacing ecological fate with archival fate. Concede that legibility cessation is still a form of determinism if treated as inevitable. Hold that your account is about the conditions of judgement, not the causes of failure. Reply that you are not explaining why societies end, but why we say they have ended, and that this shifts the focus from natural limits to epistemic limits. The weakness is that this may seem like semantic sidestepping to people worried about real-world ecological crises, so you must insist that clearer definitions prevent panicked policy responses based on false analogies.

  The philosophers of science will arrive later but cut deeper. They will ask what is doing the work in legible to us, whether you are offering observer-relativity or eliminativism, and what sort of thing a society has to be for the trait-ledger to have an answer. Concede that you are not describing mind-independent natural kinds. Hold that societies are ontologically dependent on the practices that constitute them, including our practices of counting them. Reply that the trait-ledger is not a discovery procedure but a stipulation tool, forcing us to declare our persistence conditions before judging failure. This is your most vulnerable point because if societies are only what we count, then collapse is entirely subjective, so you must argue that the materials themselves constrain which ledgers are plausible, even if they do not dictate them.

  The emeritus scholar will wait until the end to ask why you are letting past societies off the hook. They will argue that calling it transformation is a politically motivated refusal to say collapse, and that real failures have real consequences we must learn from. This is the objection that causes the most damage if handled badly, because it questions your moral stakes. Concede that suffering and loss of complexity are real and often catastrophic. Hold that misdiagnosing the nature of the loss prevents us from learning the right lessons. Reply that calling it collapse when it is transformation leads to policies designed to restore dead institutions rather than support living people, and that clarity serves prevention better than drama. The weakness is that this sounds like technocratic coolness in the face of human misery, so you must acknowledge the gravity of the loss while maintaining the precision of the description.

  There is one objection you are hoping nobody asks, which is whether anything matters if collapse is just a change in legibility. If society is only what we can read, then the silence of the archive becomes the death of the world, which is a form of idealism that denies the reality of unrecorded suffering. If this arises, do not defend the idealism. Admit that the unrecorded world persists, but insist that history cannot speak about what it cannot access, and that our ethics must account for the silence rather than pretending to fill it.

  The single reply that has to land for the session to go well is the one to the emeritus scholar. If you convince the room that precision is not evasion, you keep the moral high ground. If you fail there, you become the person who says nothing happened because the paperwork stopped. When you answer them, look them in the eye and acknowledge that the word collapse carries weight because people suffered, but argue that we honour that suffering better by knowing exactly what was lost than by using a blanket term that obscures the specific mechanisms of failure. This bridges the gap between the empirical counters and the moral guardians, and it allows the philosophers to see that your ontology has ethical consequences.

  Throughout the session, remember that the survey specialists want numbers, the historians want stories, the philosophers want coherence, and the emeritus wants truth. You are offering a method that requires them to agree on what counts before they count it. If you stay calm and concede the empirical realities while holding the ontological line, you will turn the question period into a demonstration of your method rather than a defence of your conclusion. Do not fight the desire to count; fight the refusal to say what is being counted. Good luck tomorrow.
