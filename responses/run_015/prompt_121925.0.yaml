  Citizen Kane is not merely an illustration of historiographical skepticism; it is a staged argument about the ontology of the past. Your distinction between testimonial underdetermination (incomplete evidence) and narrative underdetermination (compatible evidence, incompatible stories) is crucial. Initially, the film seems to confirm your suspicion: it dramatizes only testimonial underdetermination. Thompson fails because witnesses are partial, self-interested, or confined to specific temporal slices. Bernstein sees the boss, Leland sees the friend, Susan sees the husband. This aligns with Carr; history is a selection made by interested inquirers. The evidence is fragmented, not contradictory in shape, but missing in substance.

  However, specific formal devices push toward narrative underdetermination, supporting White. The "Breakfast Montage" compresses nine years into two minutes. The factual skeleton—couple eating breakfast—remains constant, but the emotional narrative shifts from love to indifference to hostility. The evidence (the scene) is complete, yet the story-shape changes based on the temporal perspective of the viewer. Similarly, the opera debut is shown through Kane's applause, Susan's terror, and Leland's critique. The event is singular; the emplotment is triple. Here, the film suggests that even with full access, the "story" of a life depends on where the historian places the emphasis.

  The omniscient camera complicates this. It grants the audience a Rankean truth—the burning sled—that the characters never recover. This does not undercut the skeptical reading; it deepens it. It posits that while a Rankean "real past" exists ontologically (the sled is there), it is epistemologically useless to the historian. Thompson dismisses "Rosebud" as a missing piece, but the audience knows it is the key that explains nothing. The film argues that even if you recover the past "as it really was," it does not yield a coherent meaning without narrative imposition. The camera's god-like access proves truth exists, but the plot proves truth is insufficient for history.

