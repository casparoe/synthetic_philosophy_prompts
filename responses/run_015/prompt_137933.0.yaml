answer: |-
  ### Part 1: The Logical Space (For the Facilitator)

  Before handing out the tree, here is the map of the territory. We are testing five dimensions. Most people occupy only one "region" where their answers are consistent. The empty regions are where people usually contradict themselves without noticing.

  **The Five Dimensions:**
  1.  **Epistemic:** Do we judge 1914 decisions by what they knew *then*, or what we know *now*?
  2.  **Agency:** Did a *State* act, did *Specific Men* act, or did a *System* act?
  3.  **Liability:** Is responsibility financial (invoice), moral (shame), or explanatory (answerability)?
  4.  **Succession:** Does the current government inherit the past government's debts and blame?
  5.  **Teleology:** Is blaming about establishing *Truth* or preventing *Future Harm*?

  **Occupied Regions (The Leaves):**
  Most coherent positions cluster in 8–9 regions. For example, if you believe *States* cannot act (Agency), you cannot logically demand *State* reparations (Liability) unless you argue for Succession.

  **Empty Regions (The "Nobody Holds This" zones):**
  *   **The Punitive Void:** Demanding financial reparations from a State while arguing the State has no moral agency and the individuals are dead. (Why pay if no one is at fault?)
  *   **The Shameless Successor:** Arguing the current population must feel *shame* for a war they didn't fight, while denying the State has any continuity.
  *   **The Elite Immunity:** Blaming the *system* for the war, but demanding *individual* leaders be punished (contradicts the systemic view).

  ***

  ### Part 2: The Decision Tree (Printable One-Pager)

  **Instructions:** Start at Q1. Follow the arrows based on your honest answer to the concrete act. Stop when you hit a **LEAF**.

  **Q1. THE 1914 TELEGRAMS (Epistemic)**
  When judging the July Crisis decisions, do you penalize the leaders for *not knowing* the war would last four years (Hindsight), or only for ignoring what *they* knew was possible at the time (Contemporary)?
  *   **Hindsight:** Go to Q2.
  *   **Contemporary:** Go to Q3.

  **Q2. THE TEXTBOOK SENTENCE (Agency)**
  If Hindsight applies, what single sentence goes in the school textbook?
  *   "Germany deliberately pushed the button." → Go to Q4.
  *   "The alliance system locked the doors; everyone walked through." → **LEAF: Shared Responsibility**.
  *   "Truth doesn't matter; write whatever stops the next war." → **LEAF: Forward-Looking Instrumentalist**.

  **Q3. THE TEXTBOOK SENTENCE (Agency)**
  If Contemporary knowledge applies, what single sentence goes in the school textbook?
  *   "Specific leaders in Berlin and Vienna failed." → Go to Q5.
  *   "The military-industrial system made war inevitable." → **LEAF: Structural/Systemic**.
  *   "States don't think; only individuals do. Remove 'Germany' from the sentence." → **LEAF: Individual-Only Eliminativism**.

  **Q4. THE REPARATIONS INVOICE (Liability)**
  Do you send a financial invoice to the *current* Federal Republic of Germany?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Q7.

  **Q5. THE DRONE STRIKE CHECK (Consistency)**
  If a US President authorizes a drone strike that kills civilians by error, who is liable?
  *   **The US State:** Go to Q6.
  *   **The Specific Operator/President:** **LEAF: Blame-The-Elite**.
  *   **Nobody (Fog of War):** **LEAF: Nobody Actually Holds This** *(You blame 1914 leaders but excuse modern ones).*

  **Q6. THE TAXPAYER SHAME (Mixed Combination)**
  If the invoice is paid, does the ordinary German taxpayer today carry the *moral shame*, or just the financial cost?
  *   **They carry the Shame:** **LEAF: Blame-The-Population**.
  *   **They pay the Cost, but carry no Shame:** **LEAF: Successor-State-Pays-Not-Blamed**.

  **Q7. THE UNIVERSITY BENEFACTOR (Succession)**
  If a university was built with slavery-era money, does the *current* administration apologize for the *past* owners?
  *   **Yes (Continuity exists):** Go to Q8.
  *   **No (Continuity broken):** **LEAF: German-Primacy (Historical Only)** *(You blame the past state but the current one owes nothing).*

  **Q8. THE PREVENTION CHECK (Teleology)**
  Is the point of assigning blame to establish historical truth, or to deter future aggression?
  *   **Establish Truth:** **LEAF: German-Primacy (Moral)**.
  *   **Deter Aggression:** **LEAF: Forward-Looking Instrumentalist**.

  **Q9. THE ELITE VS POPULATION (Distribution)**
  If the State is to blame, who specifically failed?
  *   **The Diplomats and Generals:** **LEAF: Blame-The-Elite**.
  *   **The Public that cheered them:** **LEAF: Blame-The-Population**.

  *(Note: If you answered Q9 earlier, ignore this. If you haven't hit a leaf yet, answer Q9 now.)*

  ***

  ### THE LEAVES (Read aloud when someone lands here)

  **1. German-Primacy (Fischer-ish)**
  *   **Commitment:** You must argue the current German state has a unique moral stain compared to France or Britain.
  *   **Tell:** Gets annoyed when anyone mentions the Serbian assassination or Russian mobilization.

  **2. Shared Responsibility (Clark-ish)**
  *   **Commitment:** You must accept that "everyone is guilty" means "no one is specifically liable to pay."
  *   **Tell:** Gets annoyed by the word "culprit" or "aggressor."

  **3. Structural/Systemic**
  *   **Commitment:** You cannot punish individuals, because the system would have made anyone do the same.
  *   **Tell:** Gets annoyed by biographies of Kaiser Wilhelm or individual diplomats.

  **4. Blame-The-Elite**
  *   **Commitment:** You must exempt the soldiers and voters who supported the leaders.
  *   **Tell:** Gets annoyed by discussions of "national character" or public enthusiasm for war.

  **5. Blame-The-Population**
  *   **Commitment:** You must accept that a democracy (or proto-democracy) collectively owns its government's sins.
  *   **Tell:** Gets annoyed when leaders say "I apologize" instead of "We apologize."

  **6. Individual-Only Eliminativism**
  *   **Commitment:** You cannot logically support state reparations, only individual prosecutions (which are impossible now).
  *   **Tell:** Gets annoyed by phrases like "Germany decided" or "France responded."

  **7. Successor-State-Pays-Not-Blamed**
  *   **Commitment:** You demand money from the current state while insisting they are morally innocent of the act.
  *   **Tell:** Gets annoyed when asked *why* they should pay if they aren't to blame.

  **8. Forward-Looking Instrumentalist**
  *   **Commitment:** You are willing to distort historical truth if it makes peace more likely.
  *   **Tell:** Gets annoyed by "accurate" histories that might inflame national tensions.

  **9. Nobody Actually Holds This**
  *   **Commitment:** You hold contradictory views (e.g., States can't act, but States must pay).
  *   **Tell:** Gets annoyed by the question itself; changes the subject to "complexity."

  ***

  ### Part 3: Indistinguishable Pairs & Limitations

  **Pair 1: German-Primacy (Historical Only) vs. Successor-State-Pays-Not-Blamed**
  *   **Problem:** Both result in the Past State being blamed and the Current State paying, but the *reason* differs (Moral Continuity vs. Legal Succession).
  *   **Separation Question:** "If the current German government voluntarily paid a billion euros to Belgium, would you call it *reparations* (debt) or a *gift* (charity)?"
      *   *Reparations* = German-Primacy (Moral Debt).
      *   *Gift* = Successor-State-Pays-Not-Blamed (No Moral Debt).

  **Pair 2: Structural/Systemic vs. Forward-Looking Instrumentalist**
  *   **Problem:** Both often result in "No Individual Blame" and "Focus on Prevention."
  *   **Separation Question:** "If blaming Germany specifically (even if historically inaccurate) would guarantee no war for 100 years, would you do it?"
      *   *Yes* = Forward-Looking Instrumentalist.
      *   *No* = Structural/Systemic (Truth matters more than utility).

  **Note on the "Nobody Holds This" Leaf:**
  This leaf is designed to catch the "Punitive Void." If someone says "States aren't real people (Eliminativism)" but also "Germany must pay reparations (Liability)," they land here. It is logically incoherent unless they argue for pure Legal Succession without Moral Blame (which is Leaf 7). If they cannot make that distinction, they are in the Empty Region.
