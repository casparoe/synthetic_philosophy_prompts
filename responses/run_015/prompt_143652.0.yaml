  ok so heres where ive landed after thinking about commons and public goods on my own. i think: (1) the real tragedy only hits when stuff is rival and hard to exclude people from, (2) digital spaces still count as commons even tho theyre not rival, since overuse can corrupt them, (3) corruption isnt the same as depletion but if it gets bad enough its basically the same thing, (4) the goverment should step in for physical commons but stay out of digital ones, and (5) public goods should be funded voluntary if people actually care. do these hang together? im especially worried about (2) fighting with (1), and (4) fighting with (3) since if corruption equals depletion why treat them different. also is (5) just naive? please answer in american english and be specific about which belief has to go or change, not just "it depends". also dont cite books or whatever, just work with what i said.
