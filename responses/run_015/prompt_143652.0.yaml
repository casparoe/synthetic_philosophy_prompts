      *   (1) Tragedy of the Commons only hits when stuff is *rival* and *hard to exclude* (non-excludable). [Standard economic definition].
      *   (2) Digital spaces count as commons even though they're *not rival*, because overuse can *corrupt* them. [Expands definition of commons beyond rivalry].
      *   (3) Corruption isn't the same as depletion, but if bad enough, it's basically the same thing. [Equates severe corruption with depletion functionally].
