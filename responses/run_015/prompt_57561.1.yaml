  1. **The menu**

  1. Zorn's Lemma is equivalent to the Axiom of Choice over ZF. (Truism)
  2. Proofs relying on AC are classified as non-constructive. (True and load-bearing)
  3. The general theorem fails in models of ZF where AC is false. (True and load-bearing)
  4. Specific instances like $\mathbb{Z}$ require AC to exhibit maximal ideals. (False)
  5. Non-constructive means the proof provides no uniform algorithm for all rings. (True and load-bearing)
  6. Non-constructive means no algorithm exists for any specific instance. (False)
  7. There exist computable rings where maximal ideals are not computable. (True and load-bearing)
  8. The theorem is computationally useless in all contexts. (False)
  9. Constructive mathematics rejects the general statement as false. (True and load-bearing)

  2. **Reassurance vs accusation**

  The Reassurance camp leans on Items 1 and 3, treating AC as a settled background assumption that secures classical truth. They view the theorem as a structural guarantee valid in the standard universe of sets. The Accusation camp leans on Items 2 and 6, interpreting non-constructive as a failure of computational content. They are talking past one another: Reassurance speaks about ontological existence within ZFC, while Accusation speaks about uniform computability across models. The conflict isn't about the math, but about whether classical existence satisfies the burden of proof for a computer scientist. The Reassurance camp sees the contamination as harmless baggage; the Accusation camp sees it as fatal. The Accusation camp incorrectly assumes that because the general proof is non-constructive, specific instances must be too. Consequently, the debate is semantic rather than mathematical.

  3. **Where his argument slides**

  The argument slides at the inference from Item 5 to Item 6. The CS person correctly notes that the Zorn proof provides no uniform algorithm for all rings. He falsely concludes that this implies no algorithm exists for specific rings like $\mathbb{Z}$. This conflates the logical strength required for the universal quantifier with the complexity of specific instances. The necessity of AC for the general theorem does not retroactively invalidate constructive proofs for specific subclasses. He treats the proof method as the only path to the object, ignoring that different rings admit different proof methods. The slide assumes that because the map is blank, the territory is empty. He mistakes the limitation of the tool for a limitation of the object in all contexts. This is a category error between proof theory and model theory.

  4. **What survives**

  The strongest true version is that there is no single algorithm capable of finding a maximal ideal for every computable ring. For certain pathological computable rings, maximal ideals exist classically but are not computable. The theorem asserts existence precisely in these hard cases where constructive methods fail. Your observation about $\mathbb{Q}[x]$ remains valid because that ring falls outside the pathological cases requiring AC. The complaint applies to the universal claim, not your specific examples.

  5. **Three sentences for seminar**

  "You are correct that Zorn's Lemma provides no uniform algorithm for finding maximal ideals in arbitrary rings. However, for specific rings like $\mathbb{Z}$, we do not use Zorn's Lemma to find them; we use arithmetic. The theorem's value lies in guaranteeing existence precisely where hand-calculation fails, not where it succeeds."
