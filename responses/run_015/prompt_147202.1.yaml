answer: |-
  This is a fantastic pedagogical knot to be tied in. You have put your finger on the exact point where analytic intuitions about reference collide with soteriological intuitions about ontology. If you don't untangle this, your students will walk away thinking Madhyamaka is just a fancy way of saying "some sentences lack referents," which reduces Nāgārjuna to Bertrand Russell with incense.

  Here is a way to structure the distinction, the "extra ingredient," and the regress worry for your seminar.

  ### 1. Reference Failure vs. Predication Failure
  The "King of France" case and the "Self/Aggregates" case look structurally similar (both yield "neither"), but they fail for different reasons.

  *   **Case 1 (King of France):** This is **empirical non-existence**. The logical form is fine; the world just doesn't cooperate. If there *were* a King of France, the predicate "is bald" would apply determinately. The failure is in the *referent*.
  *   **Case 2 (Self/Aggregates):** This is **ontological incoherence**. The aggregates are conventionally present (you can point to them, they cause things, they suffer). The failure is not that the subject is missing, but that the *relation* between subject and predicate presupposes *svabhāva* (intrinsic nature), which the subject lacks.

  **The Pedagogical Hook:**
  Tell your students: "In the King of France case, the sentence fails because the object isn't there. In the Madhyamaka case, the sentence fails because the *concept of an object* that could satisfy the sentence is incoherent."

  Nāgārjuna isn't saying the aggregates don't appear. He is saying they cannot bear the ontological weight required for a truth-claim about *ultimate reality*. The "neither" in the fourth *koṭi* isn't a truth-value (like a third value in many-valued logic); it is a **rejection of the question's presuppositions**.

  ### 2. The "Extra Ingredient": *Svabhāva* and *Prapañca*
  To answer your question: *Is the "neither" doing the same work?* **No.**

  If it were the same work, emptiness would indeed be trivial reference failure. The extra ingredient is **conceptual proliferation (*prapañca*)**.

  *   **Reference Failure** stops logic because there is no input.
  *   **Madhyamaka "Neither"** stops logic because the input (the concept of inherent existence) is poisonous.

  When Nāgārjuna rejects the four corners regarding the Tathāgata after death (exists, doesn't exist, both, neither), he isn't saying we lack data. He is saying that the categories "exists" and "does not exist" are mutually dependent concepts that only make sense within a framework of *svabhāva*. Since *svabhāva* is empty, the framework collapses.

  **How to teach this:**
  Don't present the *catuṣkoṭi* as a multiple-choice quiz where 'D' is the correct answer. Present it as a **reductio ad absurdum** of the quiz itself.
  *   *True:* Reifies existence.
  *   *False:* Reifies non-existence (nihilism).
  *   *Both:* Reifies contradiction.
  *   *Neither:* Reifies a mystical beyond (which is still a position).

  The fourth *koṭi* is not a position; it is the silence that follows when you realize the language game being played is rigged.

  ### 3. Opting Out of the Frame
  You asked: *How do I get students to see that rejecting all four corners isn't rejecting four claims so much as opting out of the frame?*

  Use the **Two Truths** explicitly as a semantic shield.
  *   **Conventionally (*saṃvṛti*):** The King of France sentence is false (or truth-valueless). The sentence "I am in pain" is true. Causality works.
  *   **Ultimately (*paramārtha*):** No sentence about intrinsic nature is true.

  Nāgārjuna's move is to show that when we ask about *ultimate* reality using language designed for *conventional* reality, we generate the four *koṭis*. The "neither" is the realization that language cannot hook onto reality *ultimately* because reality is dependently originated, and language (in this metaphysical usage) requires independent referents.

  **Analogy for Students:**
  Asking "Is the self identical to the aggregates?" ultimately is like asking "Is the number 7 hungry?"
  *   It's not that the number 7 is missing (King of France).
  *   It's that "hungry" is a category that cannot apply to numbers, even if numbers "exist" in some Platonic sense.
  *   In Madhyamaka, "intrinsic existence" is the category that cannot apply to dependently originated phenomena.

  ### 4. The Regress Worry: Emptiness of Emptiness
  This is your *MMK* 24 moment. You ask: *When I add that emptiness is itself empty, am I just performing the fourth koṭi on my own performance of it, and should that regress worry anybody?*

  This is the most critical moment in the seminar. If you get this wrong, Madhyamaka looks like infinite skepticism.

  **The Answer:** It is not a vicious regress; it is a **therapeutic dissolution**.

  If emptiness were *not* empty, it would be a *svabhāva*. It would be a "True View" that replaces "False Views." That would make Nāgārjuna a dogmatist. By saying "emptiness is empty," he ensures that emptiness is not a standpoint.

  *   **Is it performing the fourth koṭi on itself?** Yes, in a way. It rejects the reification of "Emptiness."
  *   **Is it a regress?** No, because it doesn't posit a new level. It cancels the attachment to the previous level.

  **The Wittgenstein Comparison:**
  This is your best tool for analytic students. Compare it to the *Tractatus* ladder.
  *   "My propositions serve as elucidations in the following way: anyone who understands me eventually recognizes them as nonsensical, when he has used them—as steps—to climb up beyond them. (He must, so to speak, throw away the ladder after he has climbed up it.)"
  *   Emptiness is the ladder. Once you have used "emptiness" to cure yourself of the view of "existence," you must not cling to "emptiness."
  *   **MMK 13.8:** "For those for whom emptiness is a view, them I have pronounced to be incurable."

  **Seminar Strategy:**
  Tell them: "A regress worries us if we are trying to build a foundation. Madhyamaka is not building a foundation; it is dismantling a building. You don't need a foundation to swing a wrecking ball. The 'emptiness of emptiness' just ensures the wrecking ball doesn't become a new building."

  ### Summary for the Syllabus
  1.  **Distinguish Reference from Ontology:** King of France = missing object. Madhyamaka = incoherent category (lack of *svabhāva*).
  2.  **The Fourth Koṭi is not a Value:** It is the collapse of the binary framework of *prapañca*.
  3.  **Emptiness of Emptiness:** Prevents *śūnyatā* from becoming a new dogma. It blocks the regress by refusing to establish a position, rather than establishing a higher-order position.

  If you frame it this way, you avoid the "incense-covered reference failure" trap and land on the radical ontological critique Nāgārjuna intends.
