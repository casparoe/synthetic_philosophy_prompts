  2.  **Deconstruct the Decision Theory Cases into RL Terms:**

      *   **Counterfactual Mugging:**
          *   *Setup:* Coin flip (50/50). Omega predicts policy $\pi$.
          *   *Heads:* Payoff $+M$ if $\pi$ would pay in Tails.
          *   *Tails:* Request to pay $-m$.
          *   *Observation:* Agent sees Tails.
          *   *CDT (Causal):* My action now doesn't change the past prediction. Paying costs $-m$. Expected Utility (EU) of Pay = $-m$. EU of Refuse = $0$. Choose Refuse.
          *   *EDT (Evidential):* My action is evidence of what I would do. If I Pay, I'm the type who Pays. Omega predicted that. I get $+M$ in Heads world (counterfactual). But wait, EDT conditions on *action*. If I condition on Pay, does that update the probability of Heads/Prediction? Standard EDT struggles here because the correlation is acausal.
          *   *FDT (Functional):* Evaluate the *policy* $\pi$ ex-ante. $\pi(\text{Tails}) = \text{Pay}$ implies $\pi(\text{Heads}) \to \text{Reward}$.
          *   *RL Translation:* This is an **ex-ante policy optimization** problem. The environment dynamics $P(s'|s, a)$ include Omega's prediction logic. The reward function $R$ depends on the *parameters* of $\pi$, not just the trajectory $\tau$. This violates the standard MDP assumption where $R$ depends only on $(s, a, s')$. It's a **meta-game** or **mechanism design** problem where the environment has access to the agent's weights.

      *   **XOR Blackmail:**
          *   *Setup:* Blackmailer sends letter iff (Pay $\oplus$ Scandal).
          *   *Observation:* Letter received.
          *   *Implication:* If I Pay, Scandal is False (Letter sent because Pay=True, Scandal=False). If I Refuse, Scandal is True (Letter sent because Pay=False, Scandal=True).
          *   *CDT:* Paying doesn't change whether Scandal is true. Paying costs money. Refuse.
          *   *FDT:* If my policy is "Refuse", then (Pay=False). For Letter to be True, Scandal must be True. If my policy is "Pay", then (Pay=True). For Letter to be True, Scandal must be False.
          *   *RL Translation:* This is **adversarial robustness** with **information leakage**. The environment (Blackmailer) queries the policy $\pi$ to determine the initial state distribution (whether Scandal exists). This is **distribution shift** induced by the policy selection itself.

  3.  **Translate the Disagreement (CDT vs. EDT vs. FDT) into RL:**

      *   **CDT:** Standard Model-Free or Model-Based RL. Optimize $E[\sum \gamma^t r_t | \pi]$ assuming actions only affect future states. Treats Omega/Blackmailer as fixed context. *Gradient flows only through actual trajectory.*
      *   **EDT:** Conditioning on actions as evidence. In RL, this looks like **Offline RL** or **Importance Sampling** where you update based on correlation, but it gets messy with causal structure. It's like training a discriminator to predict rewards based on actions without enforcing causality.
      *   **FDT:** **Ex-ante Policy Search**. Optimize $\pi$ *before* the episode starts, knowing the environment queries $\pi$. The "gradient" must flow through the prediction mechanism, even if that mechanism is in a counterfactual branch. This requires **differentiating through the simulator's logic about the agent**.

  4.  **Address the User's Hypothesis:**
