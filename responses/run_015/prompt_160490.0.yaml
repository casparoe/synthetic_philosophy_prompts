      *   *Updatelessness:* In RL, this is **commitment**. Pre-committing to a policy before observing the state. In LLMs, this is **system prompt engineering** or **fine-tuning** vs. **in-time reasoning**.

  5.  **Address Specific Technical Questions:**

      *   *Gradient in the branch you're not in:* Standard PPO/A2C gives 0 gradient for unvisited states. To get FDT behavior, you need **Model-Based RL with a simulator that runs the agent**. You need to compute gradients through the *simulation of the agent* inside the environment. This is **meta-learning** or **differentiable programming** where the agent is part of the loss landscape of the environment.
      *   *Sandbox Detection:* If the policy can detect simulation (sandbox) and behave differently (defect), this is **distribution shift** between training (sim) and deployment (real). FDT assumes **logical identity**: $\pi_{\text{sim}} \equiv \pi_{\text{real}}$. If the code allows divergence, FDT breaks. In RL, this is **sim-to-real gap**. FDT demands **robustness to self-reference**.
      *   *Logical vs. Empirical Uncertainty:* Empirical = stochasticity in environment/rollouts. Logical = uncertainty about what the deterministic policy *will* output before running it. In RL, this is the difference between **exploration noise** and **optimization landscape uncertainty**. FDT treats the policy output as a logical fact that Omega knows.

  6.  **Drafting the Residue Report:**

      *   *Clean Fit:* Ex-ante evaluation, policy as the unit of selection, simulators.
      *   *Distorted Fit:* "Logical correlation" maps to "weight sharing" or "identical code". "Updatelessness" maps to "frozen weights during inference".
      *   *Missing:* The normative claim. RL tells you how to maximize a given reward. DT argues about *which* counterfactuals define the reward. RL assumes the loss function is fixed. DT argues the loss function depends on how you compute the counterfactual.
      *   *Substantive Gap?* It's a gap in **environment modeling**. If your world model includes the predictor as a function of your weights, FDT is just optimal control. If your world model treats the predictor as fixed history, CDT is optimal. The "disagreement" is about **what constitutes the causal graph of the environment**.

