          *   *Critique:* Does it hold up? Yes, but *Beloved* actually contains archive-wrongs (the newspaper clipping about Sethe, the legal status of slavery). The novel shows the *failure* of the archive to capture the trauma. The "weather" isn't just unacknowledged wrongs; it's the lingering affect of acknowledged wrongs.
          *   *Verdict:* Useful literary distinction, but historically porous. Slavery was both an archive-wrong (laws, bills of sale) and a weather-wrong (culture of white supremacy).

      *   *Hypothesis 2: Post-Abolition Condition.*
