  5.  **Refining the Tone:**
      *   Needs to be peer-to-peer (writer to writer), not professor to student.
      *   Avoid flattery. Be direct about where the logic strains.
      *   Ensure the distinction between "scholarly consensus" and "user's heuristic" is clear.

  6.  **Self-Correction/Review during drafting:**
