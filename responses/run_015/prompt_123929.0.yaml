  hey so i'm taking this course on virtue ethics and last week we got deep into the situationist critique — like how Milgram-style tweaks show people act totally different in near-identical settings, so maybe "honesty" or "courage" aren't real stable traits. my prof argued that virtue ethicists can reply by saying practical wisdom lets you adapt to context, not just behave like a robot. but i'm not sure that's not just moving the goalposts, so i want to pressure-test it with a really tight case.

  can you build me a thought experiment? i need a realistic, one-paragraph scenerio set in an ordinary workplace or hospital — no trolley problems, no sci-fi, no perfect predictors. the setup: one agent faces two situations that are structurally almost identicle except for one specific feature. in situation A they do something that looks like honesty; in B they do something that looks like dishonesty. the idea is that situationism should read the flip-flop as proof there's no stable honesty-trait, but virtue ethics should be able to say both actions actualy express the SAME underlying virtue, because the agent is using practical wisdom to detect a morally relevant difference in that one feature. after the scenerio, walk through the verdict each theory gives about the agent's character, identify exactly which feature is doing the work, and show what happens if we strip that feature away — does the case collapse? also include how a hardline situationist would attack the virtue-ethical reading without just saying "people are consistant," and how the virtue ethicist could reply without begging the question.

  please start by saying what would change your mind about which side wins — like if real-world studies show people never notice that feature, or if stripping it away still lets virtue ethics save the case. i want to know where your reasoning is shakiest. and please don't include any bibliography or citation list, i can't check them and it just clutters things up. thanks!
