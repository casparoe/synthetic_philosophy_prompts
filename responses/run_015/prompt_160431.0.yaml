      *Let's refine the "One Particle" verdict.* In a one-particle universe, a list of coordinates is arguably simpler than a differential equation *unless* the equation is incredibly short (e.g., "x=0"). If the trajectory is complex, the equation is complex. BSA might say there are *no* laws in that universe. That's a counter-intuitive result (a universe with *no* laws?).

