answer: |-
  This is a precise and demanding brief. You have identified the exact fault lines where the disposition view (championed by Gauthier, McClennen, and implicitly Parfit) tends to fracture under pressure. You are right to suspect that the "stable middle" is often a verbal bridge over a conceptual chasm.

  Here is the map of defeaters, ranked from fatal to awkward, followed by an evaluation of your variants, an assessment of unfalsifiability, and a direct address to your core dilemma.

  ### I. Ranking the Defeaters

  I rank these based on whether they destroy the normative force of the view (Fatal), restrict its domain to irrelevance (Severe), or demand inconvenient concessions (Awkward).

  **1. The Causal Inertia Objection (Fatal)**
  *   **The Charge:** In the *Sealed Tell* variant (and the original Hitchhiker once the ride is complete), the act of paying is causally inert regarding the benefit received. The benefit is already secured by the prediction. To prescribe the act is to prescribe magical thinking (influencing the past or acausal coordination).
  *   **Defender's Stance:** **Dismiss.** A committed defender (Gauthier/Parfit) rejects Causal Decision Theory (CDT) in these contexts. They argue that rationality tracks *evidential* expected utility or the utility of the *disposition type*, not the causal efficacy of the token act. They will claim you are begging the question by assuming rationality must be causal at the token level.
  *   **Why it is Fatal:** If you do not accept their rejection of CDT, the view is incoherent. It requires believing that an act can be rational even if it makes no difference to the world and costs the agent. This looks indistinguishable from superstition (e.g., "I must dance to keep the sun rising," where the sun's rising is already determined).

  **2. The Simulation Objection (Fatal)**
  *   **The Charge:** From the *Crowded Desert* variant. If the benefit comes from being *predicted* to pay, and prediction relies on detectable cues, then *simulating* those cues (reputation management, cheap talk, binding contracts) dominates *actually having* the disposition. The disposition is costly (you actually pay); the simulation is cheaper (you look like you pay, but don't).
  *   **Defender's Stance:** **Concede (with conditions).** Gauthier relies on "translucency"—the idea that simulators are detectable at a higher rate than genuine dispositional agents. They must concede that if simulation is perfect and cheap, the disposition view collapses into a recommendation to deceive.
  *   **Why it is Fatal:** It turns the normative theory into an empirical gamble. If human psychology or technology allows for cheap simulation (which it often does), the "rational" disposition is strictly dominated by the "rational" mask. The view then recommends a trait that is instrumentally inferior to a rival trait.

  **3. The Psychological Objection (Severe)**
  *   **The Charge:** From *Acquirability*. "Ought implies can." If I cannot voluntarily acquire a disposition at the moment of choice (because dispositions are deep-seated psychological structures), then the theory cannot guide action *ex ante*. It becomes advice for parents or social engineers, not a theory of individual rationality.
  *   **Defender's Stance:** **Concede.** Most defenders admit dispositions are not acquired instantaneously. They argue rationality is about *maintaining* or *cultivating* dispositions over time.
  *   **Why it is Severe:** It shifts the locus of rationality from the agent facing the choice to the agent's past self or society. It weakens the claim that *I*, here in the town, have a reason to pay. It suggests *my past self* had a reason to make me the kind of person who pays.

  **4. The Indeterminacy Objection (Awkward)**
  *   **The Charge:** From the *Grain Problem*. Any policy can be described at a level of abstraction that makes it utility-maximizing. ("Follow the policy of paying only when it maximizes utility" vs. "Always pay"). If the policy is too specific, it's undetectable; too general, it's exploitable.
  *   **Defender's Stance:** **Dismiss.** They argue there is a natural kind of "constrained maximization" disposition that is both detectable and robust.
  *   **Why it is Awkward:** It forces the defender into endless boundary-drawing about what counts as a "valid" policy description. It risks making the theory ad hoc.

  ---

  ### II. Evaluation of Your Variants

  **Load-Bearing:**
  1.  **The Sealed Tell:** This is the strongest philosophical objection. It isolates the causal mechanism. If the disposition view cannot handle the case where the causal link is explicitly severed (the marker is fixed), it relies on a notion of rationality that is disconnected from agency. It forces you to admit that the view is essentially Evidential Decision Theory in disguise. If you reject EDT, this variant kills the view.
  2.  **The Crowded Desert:** This is the strongest empirical objection. It challenges the *necessity* of the disposition. If commitment devices (collateral, contracts) or cheap reputation signals are available, the disposition is a second-best solution. The view claims the disposition is *rationally required*, but if a contract dominates it, the disposition is merely a fallback for when institutions fail. This limits the scope of the theory significantly.

  **Abandon:**
  1.  **The Grain Problem:** You should downgrade this. It is a design problem, not a philosophical fatal blow. A disposition can be conditional ("Pay if the driver delivered me safely and the price is fair"). The trade-off between detectability and fidelity is real, but it doesn't prove the concept is incoherent, only that it is hard to implement. A sophisticated defender will simply refine the disposition to include "unless exploited" clauses.
  2.  **Acquirability (as a standalone):** While important, this is often treated as a background condition. If the theory is about *what makes a life go best*, the fact that we can't switch dispositions instantly doesn't falsify the claim that having the disposition is better. It just limits the action-guidance.

  ---

  ### III. Empirical Exposure and Falsifiability

  You asked what observations would count against the view. The disposition view is not a priori; it rests on specific empirical claims about human interaction.

  **1. The Translucency Threshold**
  For the view to work, agents must be translucent enough that dispositional cooperators interact with each other more often than with defectors, but opaque enough that perfect prediction is impossible (otherwise it's just determinism).
  *   **Falsifying Condition:** If behavioral economics shows that cues of trustworthiness (facial expression, past reputation) are easily faked at low cost, the view fails. If "looking honest" is cheap and effective, rationality dictates faking it, not being it.
  *   **Current Evidence:** Mixed. Some studies suggest micro-expressions are hard to fake; others suggest reputation systems (like Uber ratings) allow for strategic manipulation. If strategic manipulation is the dominant strategy in high-stakes one-off encounters, the disposition view is empirically false.

  **2. The Cost of Disposition**
  The disposition must not be too costly in non-cooperative environments.
  *   **Falsifying Condition:** If having a "cooperative disposition" makes you a "sucker" in a wide range of non-Hitchhiker scenarios (e.g., competitive markets, litigation), then the global expected utility of the disposition is negative.
  *   **Current Evidence:** Evolutionary game theory suggests "Tit-for-Tat" strategies thrive, but only in iterated games. In one-off anonymous interactions (the Hitchhiker case), defection dominates. The disposition view requires that one-off anonymous interactions are rare enough or costly enough to be outweighed by the benefits of being selected for in the few cases where prediction occurs.

  **3. Prediction Accuracy**
  *   **Falsifying Condition:** If predictor accuracy is below a certain threshold (dependent on the cost/benefit ratio of the ride), the expected utility of acquiring the disposition drops below that of straightforward maximization.
  *   **The Math:** If the ride saves your life (huge benefit) but costs \$100, prediction accuracy can be low. If the ride is a taxi fare and the cost is \$100, accuracy must be near perfect. If real-world predictors (humans) are generally below 60% accuracy in one-off stakes, the disposition view loses its normative grip for most real-world cases.

  ---

  ### IV. The Unfalsifiability Worry

  You asked: *Has the position been qualified into something unfalsifiable — whether any behaviour can be redescribed as rational at some level of policy?*

  **Honest Assessment:** **Yes, it is at high risk of this defect.**

  Without strict constraints, the disposition view allows a "policy redescription" trick.
  *   *Act:* I keep the money.
  *   *Policy:* "Keep the money when in town." (Utility: Low, stranded in desert).
  *   *Policy:* "Be the kind of person who keeps money." (Utility: Low).
  *   *Policy:* "Maximize utility in every situation." (Utility: High? No, because predictor leaves you).
  *   *Policy:* "Be the kind of person who pays." (Utility: High).

  The danger is that *any* successful act can be retroactively fitted to a "successful policy." To avoid this, the policy must be **causally efficacious in generating the prediction**. It cannot be a post-hoc label.

  **The Constraint:** The view is falsifiable *only if* it specifies the **mechanism of detection**. If the theory says "Have a disposition," but cannot specify how that disposition is physically or behaviorally manifest such that a predictor detects it *without* it being simulatable, it is metaphysical hand-waving.

  If the defender says, "The policy is whatever maximizes utility," the theory is trivial.
  If the defender says, "The policy is 'Always Pay'," the theory is empirically fragile (exploitable).
  If the defender says, "The policy is 'Pay if predicted'," the theory is circular (the prediction depends on the policy).

  **Is this a defect?** In a normative thesis, yes. A normative theory must guide action. If the guidance is "Adopt the policy that, if you adopted it, would have been best," but you cannot know which policy that is without knowing the predictor's algorithm, the theory offers no decision procedure. It offers a *criterion of rightness*, not a *decision procedure*. For a theory of *rationality* (which implies reasoning), this is a significant weakness.

  ---

  ### V. Addressing Your Core Dilemma

  You opened with a dilemma:
  1.  **Disposition maximizes EU:** No irrationality, just policy-level assessment (Trivial).
  2.  **Disposition does not maximize EU:** Rationality requires acting against utility (Incoherent).

  **Is there a stable middle?**
  There is a middle, but it requires biting a bullet you might find unpalatable.

  **The Middle:** Rationality is defined over the **temporally extended agent**, not the time-slice.
  *   At $t_1$ (Desert), acquiring the disposition maximizes EU.
  *   At $t_2$ (Town), exercising the disposition *does not* maximize EU for the $t_2$ time-slice.
  *   **However**, the $t_2$ agent is not a distinct entity. The $t_2$ agent is the temporal part of the $t_1$ agent.
  *   Therefore, the act at $t_2$ is rational *because* it fulfills the plan of the $t_1$ agent which was optimal.

  **Why this might not move you:**
  This solves the "incoherence" charge by redefining the agent. But it concedes the "triviality" charge. It admits that at the moment of action, the agent is acting against their *current* reasons. It essentially says: "Rationality is about being a good temporal citizen of your own life, even when your local interests diverge."

  **What should move you most:**
  You stated: *"A demonstration that the dilemma I opened with has no stable middle, or that the view's force depends on an empirical assumption about detectability that is simply false in the environments we actually face."*

  **The Verdict:** The second option is the stronger defeater.
  The conceptual dilemma *can* be resolved by adopting a temporally extended theory of agency (as Gauthier does). It is not logically incoherent, merely revisionary.

  **The empirical assumption is the true weak point.**
  The disposition view collapses if **simulation is cheaper than disposition**.
  In the modern world (and arguably in Parfit's original case), we have:
  1.  **Contracts:** Enforceable agreements dominate dispositions.
  2.  **Reputation Systems:** Digital trails make "appearance" manageable without deep disposition.
  3.  **Opacity:** Humans are bad at detecting lies in one-off high-stakes encounters.

  If the environment is one where **contracts are unavailable** (the Desert) AND **prediction is based on cues that are hard to fake** (biological tell), the view works.
  But if the environment is one where **prediction is based on cheap talk** or **contracts are possible**, the disposition is dominated.

  **Conclusion:**
  The disposition view is not conceptually incoherent, but it is **empirically contingent**. It is a theory for a specific niche of human interaction (high stakes, one-off, unenforceable, translucent agents).
  *   If you believe we live in that niche often, the view holds.
  *   If you believe we live in a world of contracts or opaque/cheap-simulating agents, the view is a solution to a problem that rarely exists.

  **Recommendation:** Do not abandon the "stable middle" (temporal agency) yet; it is philosophically defensible. Instead, press the **Crowded Desert/Simulation** variant. Demand the defender prove that *being* disposed yields higher expected utility than *appearing* disposed in the actual world. If they cannot, the theory is normatively inert for us, even if it is logically consistent.
