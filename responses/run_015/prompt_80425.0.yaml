      *   *Camp B (Relativist/Substantivist):* "Corruption" is a label applied by powerful actors to delegitimize local norms. Gift-exchange, patronage, and reciprocity are social glue. Calling it corruption ignores the *function* it serves in weak states. (Think: Anthropologists, post-colonial scholars, some political sociologists).
      *   *The User's Observation:* The physical act is the same; the label changes based on context (rules, pay, alternatives).

  3.  **Evaluate the User's Hypothesis:**
