          *   Relativists don't just ask "does it violate local rules?" (often it *does* violate formal state rules). They ask "does it violate *legitimate* social norms?" or "is the label 'corruption' analytically useful here?"
      *   *Better Diagnosis:* It's not just Moral vs. Rule. It's about the *source of legitimacy* for the norm being violated.

