  3.  **Brainstorming Candidate Framings:**

      *   *Option A: The Structural Taxonomy.* Focus purely on classifying the *shapes* of justification. Map Foundationalism to Well-Founded Graphs, Coherentism to Strongly Connected Components, Infinitism to Infinite Paths. Ask: Are these mutually exclusive categories in graph theory?
