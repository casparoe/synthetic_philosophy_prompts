      *   *Option C: Generative Justification (Procedural Infinitism).* Focus on the second hunch. Distinguish between a graph that *exists* completed (actualist) vs. a graph generated by a function (potentialist). Re-define Infinitism as the claim that justification requires a *generative rule*, not an infinite stock of beliefs.
          *   *Pros:* Solves the "finite mind" objection. Very actionable in 4 months. Connects logic (recursive functions) to epistemology.
