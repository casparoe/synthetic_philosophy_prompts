answer: |-
  This is a high-stakes defence. Your committee is a "killing floor" mix: they cover the entire epistemic chain from axioms to data to norms. If any link breaks, the chapter fails.

  Here is your Q&A prep sheet. The objections are ordered by **existential threat level** (1 being "thesis fails," 8 being "needs a footnote").

  ### 1. The Senior Theorist (The Ontological Trap)
  **The Objection:** "You're smuggling metaphysics back into positive economics. We spent the mid-20th century purging 'true utility' from the discipline. You define the core as the intersection of rationalisations, then claim welfare 'attaches' to it. But why is the intersection *normatively privileged*? You've essentially defined 'welfare' as 'what doesn't change when I tweak the UI.' That's a stability claim, not a welfare claim. Why should I care about stable errors?"

  **The 2-Minute Reply:**
  "I concede I'm not recovering a psychological 'true utility.' I'm proposing a **criterion for legitimate paternalism**. If a policy nudges an agent from $A$ to $B$ based on Presentation 1, but Presentation 2 makes them choose $B$ over $A$, the planner lacks a robust warrant to intervene. The core isn't 'truth'; it's the **set of choices immune to arbitrary description**. If welfare economics is to guide policy in a behavioural world, it needs a 'safe set' of rankings. My claim is minimal: we shouldn't override choices that are robust across frames, and we definitely shouldn't enforce choices that vanish when the frame changes."

  **The Soft Spot:**
  You haven't answered *why* stability is good. A consistent bias (e.g., always discounting the future too much regardless of frame) survives the core but might still be 'welfare-reducing' by other lights. You are defining welfare *as* robustness, which is circular if they don't already accept robustness as the norm.

  ### 2. The Experimentalist (The Power Problem)
  **The Objection:** "Let's talk feasibility. You need to estimate $R(p)$ for multiple presentations $p$ to find the intersection. Intersections shrink fast with noise. If a subject makes one slip-up in one frame, that relation drops out of the core. With $n=400$ on Prolific, and say 5 presentations per subject, your error rate compounds. You're going to find an empty core for everyone and claim it's a 'finding.' How do you distinguish a genuine presentational incoherence from just a tired subject clicking the wrong button?"

  **The 2-Minute Reply:**
  "Two points. First, I'm not estimating the core for *every* individual for policy use; I'm testing the **existence of WPC** at the population level. Second, I treat the relations probabilistically. I don't require strict set intersection; I define the core as relations that rationalise the data with probability $1-\alpha$ across frames. We can use a hierarchical Bayesian model to shrink individual noise while preserving systematic framing effects. The 'empty core' result is only claimed if the inconsistency exceeds the error bound."

  **The Soft Spot:**
  Hierarchical shrinking assumes the framing effect is structural, not noise. If the framing effect *is* the noise (which is plausible), your model will over-identify a core that doesn't exist. You need a pre-registered simulation showing power to detect an empty core vs. a noisy full core.

  ### 3. The Structural Econometrician (The Identification Gap)
  **The Objection:** "You talk about 'presentations' as if they're exogenous. In scanner data, framing isn't random; it's correlated with marketing spend, shelf position, and product quality. What is your identifying variation? If 'price per month' vs 'price per year' is correlated with the *type* of consumer looking at the product, your core isn't identifying preference invariance; it's identifying selection bias."

  **The 2-Minute Reply:**
  "In the lab chapter, presentation is randomly assigned, so identification is internal. For the structural extension, I'm not claiming point identification of the core from observational data alone. I'm using the lab estimates of the **friction parameters** (how much framing shifts choice) as priors to bound the structural demand estimates in the scanner data. It's a bounds approach: the core defines the tightest bounds on demand consistent with multiple frames."

  **The Soft Spot:**
  External validity. Lab framing effects (Prolific) rarely map cleanly to scanner data framing (supermarket shelves). If the friction parameters don't transport, your bounds are meaningless.

  ### 4. The Philosopher (The Normative Cut)
  **The Objection:** "You say welfare tracks what survives across presentations. But why? Consider autonomy. If I choose differently when fat is labelled '10% fat' vs '90% lean', maybe the second presentation triggers a reflective process I value. By focusing only on the *invariant* choice, you might be discarding the *better* choice. Why is invariance the right cut for welfare rather than, say, the choice made under the most cognitively demanding presentation?"

  **The 2-Minute Reply:**
  "That's a competing normative criterion, and I welcome it. But for **public policy**, the burden of proof is on the intervener. If the choice flips based on a label, the state lacks the epistemic authority to say which frame is the 'reflective' one without imposing its own values. Invariance is the **only neutral ground**. If you want to argue for the 'demanding frame' as the welfare standard, you need a theory of which frames are normatively superior. I'm offering a theory of when we can remain agnostic."

  **The Soft Spot:**
  This concedes that your theory is only a *negative* welfare criterion (when *not* to intervene), not a positive one (what *to* do). If the core is non-empty but 'bad' (e.g., stable addiction), your theory is silent.

  ### 5. Axiomatiser 1 (The Triviality Charge)
  **The Objection:** "Isn't Weak Presentational Coherence just SARP with extra steps? If I define the 'alternative' to include the presentation index, then choice is always consistent. If I define it over the underlying goods, you're just observing violations of SARP. What theoretical work is 'WPC' doing that 'SARP on expanded commodity space' doesn't do?"

  **The 2-Minute Reply:**
  "SARP on an expanded space treats 'Apple-in-Frame-A' and 'Apple-in-Frame-B' as different goods. That kills welfare analysis because we can't compare utility across frames. My WPC condition is the **test for whether we are allowed to treat them as the same good**. It's the bridge condition that permits us to collapse the expanded space back to the canonical space without losing predictive power. It's not a consistency check; it's an identification condition for the 'underlying alternative'."

  **The Soft Spot:**
  If WPC fails, you *must* treat them as different goods. You haven't solved the problem; you've just given a name to the condition where the standard model works.

  ### 6. The "Turf" Question (Literature Check)
  **The Objection:** "This sounds like Bernheim and Rangel (2009) 'Beyond Revealed Preference.' They use ancillary conditions to define welfare-relevant choices. Or Salant's framing models. What are you adding without reinventing the wheel?"

  **The 2-Minute Reply:**
  "Bernheim and Rangel focus on **choice sets** and ancillary conditions that *shouldn't* matter. I focus on **descriptions** of the *same* choice set. The technical difference is crucial: B&R look for choices independent of conditions; I look for the **intersection of rationalising relations**. This allows me to recover a complete ordering even if choices *do* vary, provided the variation is bounded. Also, B&R don't offer the 'empty core as diagnostic' result; they treat non-identification as a limit. I treat it as a behavioural phenotype."

  **The Soft Spot:**
  The distinction is subtle. If you press too hard on "descriptions vs conditions," they will smell semantic gaming. Acknowledge B&R as the foundation but insist your *intersection method* yields sharper welfare bounds.

  ### 7. Axiomatiser 2 (The Empty Core Policy)
  **The Objection:** "You say if the core is empty or cyclic, that's a 'finding.' Fine. But then what? If I'm a regulator and the core is empty, do I ban the product? Do I randomise? Your theory diagnoses the disease but prescribes no cure. A welfare theory that results in 'do nothing' whenever things get interesting is useless."

  **The 2-Minute Reply:**
  "The prescription is **status quo bias with transparency**. If the core is empty, the planner has no warrant to move the agent from the default. The policy implication is to mandate multiple presentations (e.g., show both monthly and yearly prices) and let the agent choose, rather than the planner choosing *for* them based on one frame. It shifts the burden of resolution back to the agent."

  **The Soft Spot:**
  "Show both prices" is a specific policy that might not resolve the cycle. If they still choose inconsistently after seeing both, you're back to square one.

  ### 8. The "Hope Nobody Asks" (The Identity Problem)
  **The Objection:** "To define your core, you intersect relations over 'underlying alternatives.' But how do you identify that '£10/month' and '£120/year' are the *same* alternative without *already assuming* the invariance you're trying to test? Isn't the mapping from presentation to alternative domain-adaptation? If you get the mapping wrong, the core is an artifact."

  **The 2-Minute Reply:**
  "This is the hardest question. I don't assume invariance; I assume a **canonical mapping** provided by the researcher (e.g., economic equivalence). The test is whether the *agent's choices* respect that mapping. If they don't, the core empties. So the mapping is a hypothesis, not an assumption. We test if the agent treats them as equivalent. If they don't, the model tells us 'these are psychologically distinct goods,' and we stop welfare analysis."

  **The Soft Spot:**
  This is circular. You use economic equivalence to define the alternative, then test if they treat them as economically equivalent. If your flatmate says "that's domain adaptation," he's right: you need a theory of how the agent maps frames to alternatives, which you don't have. **If this is asked, do not bluff.**

  ---

  ### Strategic Concessions (First 5 Minutes)
  1.  **Concede Point Identification:** Admit immediately that you cannot point-identify the core for individuals with noisy data. Frame the thesis as establishing **bounds** on welfare, not point estimates. This disarms the Experimentalist and Econometrician before they attack.
  2.  **Concede Normative Sufficiency:** Admit that invariance is *necessary* but not *sufficient* for welfare. This disarms the Philosopher. You are offering a "safe harbor" criterion, not a complete moral theory.
  3.  **Concede the "Identity" Tension:** Acknowledge that defining "same alternative" across frames is the weakest link. State that you treat it as a primitive for the theory but flag it as the primary avenue for future work (this pre-empts the "Hope Nobody Asks" question by showing you know it's a problem).

  ### The Single Reply That Must Land
  **The Definition of Welfare.**
  You must convince them that **Welfare = Robustness** is a useful operational definition for policy, even if it's not philosophically complete.
  *   *Phrase to use:* "In a world of ubiquitous framing, the only welfare claims a planner can make without imposing their own frame preferences are those that survive frame variation."
  *   If they reject this, your chapter has no normative force. If they accept this, the axioms and data are just technical details.

  ### Handling the "Hope Nobody Asks" (If it comes up)
  If Question 8 is asked, do not try to solve it.
  *   *Say:* "You've identified the boundary of the model. The mapping from presentation to alternative is indeed a primitive. My contribution is to show what follows *if* we agree on the mapping. If we can't agree on the mapping, revealed preference welfare analysis is impossible regardless of my model. I'm pushing the frontier back to the mapping problem, not solving it."
  *   *Why:* This frames the objection as a fundamental limit of the *field*, not just your thesis.

  Good luck. Keep your answers short. If you talk for more than 2 minutes, you're hiding something.
