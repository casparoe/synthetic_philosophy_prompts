answer: |-
  This is a classic friction point between the *mathematics* of game theory and the *interpretation* of its primitives. Your TA is pivoting from a technical question (properties of best responses) to a philosophical one (ontology of probability).

  Here is the breakdown you need for office hours. First, the direct mathematical answer, then the menu of interpretations, and finally, a diagnosis of why the TA is dodging.

  ### 1. The Direct Mathematical Answer
  Before you engage with the slogan, you need to be solid on the technical fact.
  **Claim:** In any game (continuous or discrete), a rational player **never** includes a strictly dominated pure strategy in the support of their mixed strategy.
  **Reason:** If strategy $s_i$ is strictly dominated by $s'_i$, then $u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i})$ for **all** opponent profiles $s_{-i}$. By linearity of expected utility, this inequality holds for **any** belief (probability distribution) the player holds over $s_{-i}$. Therefore, $s_i$ is never a best response to any belief. A mixed strategy is only rational if every pure strategy in its support is a best response.
  **Verdict:** The answer is **No**. Continuity does not change this. Strict dominance kills a strategy globally.

  ### 2. The Menu: Unpacking the Slogan
  The slogan *"Mixed strategies are just ignorance in fancy dress"* is ambiguous. Here are the four precise claims it could be making, evaluated by your criteria.

  #### (a) The Epistemic Claim
  *   **The Claim:** The probabilities in a mixed strategy do not represent the player's intentional randomization. They represent the **opponent's (or analyst's) uncertainty** about which pure strategy the player will choose. (Associated with Aumann, Brandenburger, and the epistemic program).
  *   **Status:** **Defensible.** This is a standard, rigorous interpretation in modern epistemic game theory. It treats the "mix" as a belief held by others, not an action taken by the self.
  *   **Does it answer your question?** **Yes.** If mixing is just opponent uncertainty, then for a player to "play" a dominated strategy (i.e., for the opponent to assign it positive probability), the opponent must believe the player is irrational. If we assume common knowledge of rationality, the probability assigned to a strictly dominated strategy must be zero. This interpretation **reinforces** the standard "No" answer.

  #### (b) The Normative Claim
  *   **The Claim:** Rational agents should not use external randomizing devices (coin flips) to make decisions. They should always choose a deterministic pure strategy. (Associated with the "Purification" critique).
  *   **Status:** **Defensible.** Many theorists find the idea of a CEO flipping a coin to set prices implausible. This motivates Harsanyi's Purification Theorem (mixing arises from private payoff perturbations).
  *   **Does it answer your question?** **Yes.** If agents don't randomize, they pick a pure strategy. If they pick a strictly dominated pure strategy, they are violating rationality. This interpretation also leads to the answer **No**.

  #### (c) The Metaphysical Claim
  *   **The Claim:** Human choice is physically deterministic; there is no ontological indeterminacy in the universe. Therefore, "random choice" is impossible.
  *   **Status:** **Irrelevant / Undecidable.** Whether the universe is deterministic is a question for physics or metaphysics, not game theory. Game theory models *consistent* choice, not *free* choice.
  *   **Does it answer your question?** **No.** Even in a deterministic universe, a player can be modeled *as if* they randomize. Whether the randomness is "real" doesn't change the payoff structure. A dominated strategy yields lower payoffs regardless of whether the choice was determined by neurons or dice.

  #### (d) The Methodological Claim
  *   **The Claim:** Mixed strategies are not about individuals at all. They represent **population frequencies** in an evolutionary context. (Associated with Evolutionary Game Theory).
  *   **Status:** **Defensible.** In large populations, a "mixed strategy" is the proportion of agents playing each pure strategy.
  *   **Does it answer your question?** **Yes.** In evolutionary dynamics (e.g., Replicator Dynamics), strictly dominated strategies go extinct. They cannot survive in the support of a stable population distribution. This leads to the answer **No**.

  ### 3. Diagnosis: Is the TA Making a Point or Dodging?
  **They are dodging.**

  Here is why: All four interpretations above (except the metaphysical one, which is irrelevant) **agree with the standard mathematics.** None of these interpretations provide a loophole that allows a rational player to play a strictly dominated strategy.

  *   If mixing is **ignorance** (a), you shouldn't be ignorant enough to think a dominated strategy is optimal.
  *   If mixing is **purification** (b), dominated strategies are never best responses to any type.
  *   If mixing is **population frequency** (d), dominated strategies die out.

  The TA is using a philosophical slogan to avoid admitting that the answer to your technical question is a straightforward **"No, strictly dominated strategies are never best responses."** They may be conflating *strict* dominance with *weak* dominance, or they may be worried that admitting "No" forces them to defend the ontological reality of mixing, which they clearly dislike.

  ### 4. Script for Office Hours
  Bring this written list. It shows you've done the reading and forces them to be precise.

  > "I've unpacked the slogan into four claims (Epistemic, Normative, Metaphysical, Methodological). I see that under the Epistemic, Normative, and Methodological interpretations, a strictly dominated strategy is still never a best response.
  >
  > So, when you say 'mixed strategies are ignorance,' are you arguing that:
  > 1.  My technical premise is wrong, and there is a specific continuous game setup where a dominated strategy *can* be in a support?
  > 2.  Or, are you simply saying that the *concept* of mixing is flawed, but agreeing that even under your interpretation, dominated strategies are excluded?
  >
  > If it's the latter, can we agree that for the purpose of solving problem sets, the answer is 'No, dominated strategies are never in the support'?"

  **Summary for your notes:**
  *   **Technical Truth:** Strictly dominated strategies are never best responses. Never in support.
  *   **TA's Slogan:** Philosophical commentary on *what mixing means*, not a mathematical exception to dominance.
  *   **Verdict:** The slogan is compatible with the math, but the TA is using it to evade a direct confirmation of the math.
