  In my game theory seminar the TA keeps dropping 'mixed strategies are just ignorance in fancy dress' whenever iterated dominance comes up. I asked whether a rational player could ever include a strictly dominated pure stragegy inside her support in a continous game, and she just repeated the line. Can you unpack the different precise claims that slogan could be making? I'm thinking: (a) an epistemic claim that probabilities only represent opponent beliefs, (b) a normative claim that rational agents never use randomizing devices, (c) a metaphysical claim that there's no real indeterminacy in choice, or (d) a methodological claim that mixing is just a population-level prediction tool. For each, say whether it's trivial, defensible, or actually false, and say which ones — if any — actually answer my question about domination inside a support. I want to bring a clear menu to office hours so I can see whether she's making a point or dodging.
