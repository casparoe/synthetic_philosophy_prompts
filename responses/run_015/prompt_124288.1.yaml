answer: |-
  **Preface: A Warning on Framing**

  Before using this instrument, note a significant limitation. The empirical data underpinning these nodes—while robust in some areas—are often entangled with how questions are asked. Cross-cultural moral psychology is young; many findings are contested or sensitive to translation. If the variation is smaller than popularized, or if the vignettes load unevenly across cultures, the pressure these results put on objectivity is weak. This tree assumes the data are meaningful enough to warrant a position. If you doubt that premise, the "Quietist" leaf is your home.

  **The Decision Tree**

  **1. The Harmless Taboo**
  A family butchers and eats a pet dog killed by a car. No one is harmed; no one finds out. Many condemn it despite conceding no harm occurred.
  *   **A.** This is a false moral belief or non-moral disgust misreported as moral. (Go to 2)
  *   **B.** This is a correct response to a property others are insensitive to (e.g., sanctity). (Go to 3)

  **2. Weight, Not Kind**
  Two communities agree kin-helping and fairness matter but disagree on which wins when hiring a relative over a stranger.
  *   **A.** This is a moral disagreement; one side is mistaken. (Go to 4)
  *   **B.** This is no disagreement at all, only different weighting of shared values. (Go to 5)

  **3. The False-Embedding Case**
  A community condemns a practice because they falsely believe it causes invisible harm.
  *   **A.** The condemnation is mistaken because the belief is false. (Go to 4)
  *   **B.** The condemnation is correct but for the wrong reason, or not in the business of being correct. (Go to 6)

  **4. Necessary-Looking Claims**
  Claims like "deliberate harm is worse than accidental harm" fail to show up reliably in some populations.
  *   **A.** This counts against the claim's universality. (Go to 5)
  *   **B.** This counts against the reliability of the responses (measurement error). (Go to 7)
  *   **C.** This counts against treating intuition as evidence at all. (Leaf: Quietist)

  **5. Reverse-WEIRD**
  Heavily sampled populations (Western, Educated, Industrialized, Rich, Democratic) are statistical outliers.
  *   **A.** Outlier status gives reason to distrust their judgments. (Go to 6)
  *   **B.** Outlier status gives reason to trust them more (education/markets improve judgment). (Go to 7)
  *   **C.** No evidence either way. (Go to 8)

  **6. The Elicitation-Frame Test**
  *[Added Node: Empirical status actively contested]*
  Does a population's answer survive changes in framing (third-person vs. first-person vs. religious)?
  *   **A.** Frame-sensitivity shows there is no single stable judgment being measured. (Go to 8)
  *   **B.** Frame-sensitivity is a measurement problem only; a stable judgment exists. (Go to 7)

  **7. Faultless Disagreement**
  *[Added Node: Empirical status actively contested]*
  When communities disagree on weighting (see Node 2), can both be right relative to their context?
  *   **A.** Yes, disagreement can be faultless. (Go to 8)
  *   **B.** No, morality aims at a single truth. (Go to 7)

  **8. Convergence via Reason**
  *[Added Node: Empirical status stipulated for tree logic]*
  If communities discussed these cases indefinitely, would they converge?
  *   **A.** Yes, reason drives convergence. (Leaf: Constructivism)
  *   **B.** No, reasons are internal to frameworks. (Leaf: Cultural Relativism)
  *   **C.** The question is misplaced; judgments express attitudes, not truths. (Leaf: Expressivism)

  **9. Function of Morality**
  *[Added Node: Empirical status stipulated for tree logic]*
  Is the variation best explained as error or as adaptive tuning to local ecologies?
  *   **A.** Adaptive tuning; distinct concerns weighted by environment. (Leaf: Adaptive Tuning)
  *   **B.** Error; there is a universal truth we are missing. (Leaf: Robust Objectivism)
  *   **C.** Unity only at a narrow core; rest is surface variation. (Leaf: Narrow Core Objectivism)

  *(Note: Paths merge where logical equivalence occurs. Node 9 is reached if prior answers suggest functionalism or objectivism.)*

  **The Leaf Table**

  | Position | Description | Headline Uptake |
  | :--- | :--- | :--- |
  | **Robust Objectivism + Error Theory** | Morality is objective; folk variation is mostly error. | "Science Finds Most Cultures Morally Mistaken" |
  | **Narrow Core Objectivism** | Universal principles exist (e.g., harm) but application varies. | "Morality Universal at Core, Cultural on Surface" |
  | **Constructivism** | Moral facts are constructed by agents; variation creates reasons. | "Disagreement Builds Moral Truth, Doesn't Break It" |
  | **Cultural Relativism** | Truth is indexical to culture; no external standpoint. | "No Right Answer Outside Your Own Tradition" |
  | **Expressivism** | Moral claims express attitudes, not truth-apt beliefs. | "Morality Isn't True or False, It's Feeling" |
  | **Quietist** | Folk intuitions were never evidence; data are beside the point. | "Psychology Cannot Settle Philosophical Questions" |
  | **Adaptive Tuning** | Variation is functional calibration, not error. | "Moral Differences Are Ecological Solutions" |

  **Post-Mortem: Unoccupied Cells and Indistinguishable Leaves**

  **Unoccupied Cells**
  One combination remains empty: A reader who answers that the Harmless Taboo is *objectively wrong* (Node 1B) but also selects *Adaptive Tuning* (Node 9A). This view is theoretically unstable. Adaptive Tuning treats variation as functional calibration, which undermines the claim that a specific taboo violation is universally wrong regardless of context. Nobody occupies this cell because it requires holding that morality is both ecologically fluid and rigidly universal in specific instances without a reconciling principle.

  **Indistinguishable Leaves**
  I must flag two pairs where this tree cannot honestly separate positions.
  First, **Quietism** and **Expressivism**. Both conclude that intuition data cannot settle objectivity. Quietism says intuitions aren't evidence; Expressivism says intuitions aren't truth-apt. On the specific question of whether science disproves objectivity, these converge: science cannot disprove what is either irrelevant or non-truth-apt.
  Second, **Constructivism** and **Cultural Relativism**. Both allow for variation without error. While Constructivism posits eventual convergence via reason (Node 8A) and Relativism does not (Node 8B), in practice, both advise against condemning cross-cultural variation as simple mistake. A reader landing on either leaf receives similar practical guidance despite the metaphysical distinction.

  **Term Notes**
  *   **WEIRD:** Western, Educated, Industrialized, Rich, Democratic. The demographic skew in psychological sampling.
  *   **Non-Cognitivism/Expressivism:** The view that moral statements do not describe facts (like "snow is white") but express emotions or commands.
  *   **Constructivism:** The view that moral truths are made by rational agents rather than discovered like physical laws.
  *   **Quietist:** A philosophical stance that dissolves a problem rather than solving it, often by arguing the question itself is confused.

  **Confidence Markers**
  *   **Required Nodes:** Based on established literature (Haidt, Henrich, etc.), though specific vignette replication varies.
  *   **Added Node 6 (Frame):** Actively contested. Some studies show high stability; others show massive framing effects.
  *   **Added Node 7 (Faultless):** Actively contested. Central debate in meta-ethics; no empirical consensus.
  *   **Added Node 8 (Convergence):** Stipulated. Used to separate Constructivism from Relativism logically, not empirically verified.
  *   **Added Node 9 (Function):** Stipulated. Used to separate Adaptive Tuning from Objectivism.

  **Final Note on Usage**
  If you find yourself bouncing between leaves, the instrument has done its job. The data do not force a single conclusion. They force a choice about how much weight to give intuition, how much error to tolerate, and what function you think morality serves. The science describes the variation; the philosophy decides what it means.
