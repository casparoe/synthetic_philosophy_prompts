      *   Scoring: Clear instructions.
      *   Results: Descriptions of the 5 philosophies without the jargon.
      *   Caveats: Admit where the quiz fails (e.g., Ideal Internalist vs. Full Externalist is notoriously hard to separate).

  6.  **Refining the Specific Stories:**
      *   *Maya:* Keep close to prompt.
      *   *Dev:* Keep close to prompt.
      *   *Lena:* Keep close to prompt.
      *   *Q4:* The "Boring Favor." Friend asks for help moving. You hate them, no benefit. Reason?
      *   *Q5:* The "Future Pain." Dentist. You hate pain. Reason to go? (Classic prudential).
      *   *Q6:* The "Aesthetic." Best movie ever. You hate movies. Reason to watch?
      *   *Q7:* The "Semantics." Is a reason just a good argument?

      *Wait, I need to ensure the "Mixed" view is catchable.*
      *   Mixed: Maya (No), Dev (Yes).
      *   Strict Internal: Maya (No), Dev (No).
      *   Full External: Maya (Yes), Dev (Yes).
      *   Ideal Internal: Maya (Yes - *if* rational), Dev (Yes - *if* rational). *Correction:* Ideal Internalists usually say Maya *does* have a reason because she *would* want health if she wasn't depressed/irrational. But the prompt says she is "calm and clearheaded." This makes it a hard case for Ideal Internalism. If she is fully rational and still doesn't care, Ideal Internalism collapses into Strict Internalism.
      *   *Adjustment:* For the quiz, I will treat "Ideal Reflection" as the view that says "You have a reason if you *should* want it, even if you don't."
      *   *Skeptic:* "Reason is a fuzzy word."

  7.  **Finalizing the Scoring Logic:**
