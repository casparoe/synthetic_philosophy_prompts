      *   Option B: External/Fact-based (Fact = Reason).
      *   Option C: Nuanced/Skeptic (Maybe/Depends).

      *Actually, to get 5 distinct endpoints, the options need to be specific per question.*

  4.  **Developing the Scoring Key:**
      *   This is the hardest part. I need to map combinations of answers to the 5 profiles.
