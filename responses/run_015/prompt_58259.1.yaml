      *   *Moral Externalism (The "Mixed" View):* Prudential reasons are internal (based on desires), but Moral reasons are external (bind you regardless of desire).
      *   *Full Externalism (Realism):* Reasons exist out there in the world (facts about health, morality, etc.) regardless of your psychology.
      *   *Skeptic/Expressivist:* "Reasons" is a fuzzy word. It depends on context. Maybe there's no fact of the matter.

