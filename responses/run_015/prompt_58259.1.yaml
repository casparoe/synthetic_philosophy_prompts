      *   Q5: The Secret Promise. (Promise to dead friend. No one knows. You don't care about honor. Reason?)
      *   Q6: The Art Gallery. (You hate art. World's best painting. Reason to see it?)
      *   Q7: The "Should" Check. (Is "reason" just peer pressure?)

