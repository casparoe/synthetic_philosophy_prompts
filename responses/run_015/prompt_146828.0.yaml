answer: |-
  First off: **You are not crazy.** In fact, on the technical and philosophical specifics, your intuition is significantly more robust than your friend's. Game theory arguments are notoriously exhausting because they sit right on the border of math, logic, and psychology, and your friend seems to be conflating all three in a way that sounds profound but doesn't hold up to scrutiny.

  Here is the breakdown of where he is right, where he is wrong, and the actual philosophical concepts you were groping for.

  ### 1. The Jargon Check: "Provisional Commitment Collapse"
  **Verdict: He is inventing terms.**

  There is no standard concept in game theory or philosophy called "provisional commitment collapse." It sounds like a mashup of three real concepts:
  *   **Backward Induction Unraveling:** The logic that defection at the end implies defection at the start.
  *   **Dynamic Inconsistency:** When a plan made by "Past You" is no longer optimal for "Future You" when the time comes to act.
  *   **The Unraveling Result:** In finite games, common knowledge of rationality leads to immediate defection.

  He is using made-up jargon to give his argument a veneer of academic authority. That said, the *spirit* of what he's saying touches on a real problem: **If I know I will betray you later, is my promise to cooperate now a lie?**

  ### 2. The Endpoint Issue (You are Right)
  **Verdict: You win this point.**

  You correctly identified the fatal flaw in his argument: **Backward induction requires a known, finite terminal node.**

  *   **The Logic:** Backward induction works by solving the last move first. "At node 100, I will take. Therefore, at node 99, you will take..." all the way back to Node 1.
  *   **The Problem:** If there is no Node 100 (an infinite game) or if Node 100 is probabilistic (there is a 1% chance the game ends after every round), the logic **cannot start**. You cannot solve from the back if there is no defined back.
  *   **His "Death" Argument:** He argues that death is a fixed endpoint. While biologically true, game-theoretically, it is **not common knowledge**. I don't know exactly when you will die, and you don't know exactly when I will die.
      *   In game theory, if there is even a small probability that the game continues (or that the other player is *not* perfectly rational), cooperation becomes rational. This is the basis of the **Gang of Four Theorem (Kreps, Milgrom, Roberts, Wilson)**, which shows that in indefinite games, reputation allows cooperation to survive.

  By claiming "death makes it finite," he is ignoring the **uncertainty** that prevents the induction from unraveling.

  ### 3. "Temporal Transparency" (You spotted the philosophical bug)
  **Verdict: You are right to be suspicious.**

  You mentioned a "false presupposition about rationality having to be transparent across time." **This is the deepest philosophical point in your argument, and you nailed it.**

  Your friend is assuming what is called **Sophisticated Choice**. This assumes that "Future Me" is a separate agent who will act solely on what is rational *at that future moment*, and "Current Me" knows this perfectly. This is "temporal transparency."

  However, there is a major school of thought in the philosophy of action that rejects this:
  *   **Resolute Choice (Edward McClennen):** This theory argues that a rational agent can commit to a plan and stick to it, even if "Future Me" would technically gain more by deviating. Rationality isn't just about maximizing at every single node; it's about maximizing over the *whole plan*.
  *   **Constrained Maximization (David Gauthier):** Argues that it is rational to be the *kind of person* who keeps commitments, even when breaking them offers a slight short-term gain.

  If you accept Resolute Choice, the "unraveling" stops. I can intend to cooperate at Node 50 *now*, and bind my future self to that intention. My friend claims this is impossible ("collapse"); philosophy says it's a valid model of rationality.

  ### 4. The Contract Claim (He is misapplying the theory)
  **Verdict: He is using the paradox to explain the opposite of what it predicts.**

  He claims this logic explains why "long-term contracts always fail eventually."
  *   **The Centipede Prediction:** The Centipede Game predicts that cooperation **never starts**. It predicts you won't even sign the contract.
  *   **The Reality:** Contracts *do* start. People *do* cooperate for years. They often fail later due to external shocks, changed circumstances, or enforcement costs—not because of backward induction.

  If the Centipede logic were true in the real world, **no one would ever trust anyone.** Since trust exists, the Centipede model (with its strict assumptions of common knowledge of rationality) is known to be a poor descriptor of actual human behavior. Experimental economics consistently shows that humans play deep into the Centipede game, not stopping at Node 1.

  ### Summary of the Confusion
  Your friend is treating a **normative logical model** (how a perfectly robotic agent *should* act under impossible constraints) as a **descriptive psychological reality** (how humans *do* act).

  *   **You are right:** Without a fixed, known endpoint, backward induction doesn't trigger.
  *   **You are right:** "Temporal transparency" is a contested assumption, not a law of nature.
  *   **He is wrong:** "Provisional commitment collapse" isn't a real term.
  *   **He is wrong:** Using Centipede to explain contract *failure* is ironic, because the theory predicts contract *non-existence*.

  **How to close the argument:**
  Tell him you looked up "provisional commitment collapse" and it doesn't exist. Then tell him that if he wants to talk about why cooperation fails in finite horizons, he should read up on the **Chainstore Paradox** or **Dynamic Inconsistency**, but he needs to acknowledge that **indefinite horizons** (which characterize almost all real-life contracts) break the backward induction logic entirely.

  You're not crazy. You just won the game theory argument.
