  Subject: draft for the careenium seminar / adversarial collab doc

  Hey,

  Here's that draft we talked about for the seminar. I tried to split the difference so both camps dont feel like im stacking the deck. The idea is to get them to sign off on the architecture first before they kill each other over the metaphysics. 

  I kept it self-contained so we dont need to drag in outside lit—just the logic of the careenium itself. Let me know if the cruxes feel sharp enough. I left a couple things loose on purpose so they can fight over them in the table.

  Cheers,
  R

  ***

  **DRAFT: Joint Statement on Careenial Causality**

  **1. Agreed Claims (Baseline Architecture)**

  1.  **Careenial Architecture:** The Careenium is defined as a bounded spatial volume containing a finite number of mobile particles ("simmballs") and stable structural patterns ("symbols"). The boundary is reflective; no energy enters or leaves the system during the observation window.
  2.  **Simmball Dynamics:** Simmballs possess kinetic energy and momentum. They interact via elastic collision with each other and with the static boundaries of symbols. Their trajectories are continuous and deterministic based on initial conditions and collision history.
  3.  **Symbol Definition:** A "symbol" is identified as a recurrent, stable configuration of simmballs (or a barrier structure) that persists over multiple time-steps. All parties agree symbols are *detectable* patterns within the substrate.
  4.  **Underdetermination of Force:** Observation of simmball trajectories alone cannot distinguish between (a) a force vector originating from the symbolic pattern *as a whole* (downward causation) and (b) force vectors originating solely from individual simmball collisions that merely *result* in the pattern (upward constitution). Both models generate identical trajectory data under standard conditions.

  **2. Positions Table**

  | Feature | Side A: Substrate-Pushers | Side B: Correlationalists |
  | :--- | :--- | :--- |
  | **Causal Locus** | The Symbol *qua* Symbol exerts a distinct causal influence. Token structure displaces simmballs over and above the sum of individual collisions. | The Substrate does all the work. Simmballs push simmballs. Symbols are descriptive glosses with zero Newtonian push. |
  | **Ontological Status** | Symbols are real causal units. They have "downward teeth." | Symbols are epiphenomenal shadows. Only the simmballs are ontologically serious. |
  | **Explanation Style** | Top-down. We explain ball movement by referencing the symbolic goal/state. | Bottom-up. We explain symbolic movement by referencing ball momentum. |

  **3. Cruxes & Predictive Cases**

  To move beyond verbal disagreement, we identify two specific mechanistic claims where the models diverge. Below are the in-model cases designed to test them.

  **Crux 1: Token-Type Identity vs. Substrate Reconfiguration**
  *Question:* If we swap the physical substrate but maintain the symbolic pattern, does the causal power remain invariant?

  *   **In-Model Case:** The **Isomorphic Swap**. 
      *   *Setup:* Identify a stable Symbol-Cluster (e.g., a "Triad" formation of 3 simmballs) that consistently displaces incoming projectile balls with a specific vector magnitude. 
      *   *Intervention:* Replace the 3 simmballs with 3 simmballs of different mass/color composition but engineered to hold the exact same spatial formation and net momentum via external tuning prior to release.
  *   **Side A Prediction (Pushers):** The displacement vector of the incoming projectiles will remain **identical**. The "Triad" token identity is the causal unit, so as long as the token-type is preserved, the push is preserved.
  *   **Side B Prediction (Correlationalists):** The displacement vector will **change** (even if slightly). The push is entirely dependent on the specific mass/velocity of the constituent simmballs. If the substrate changes, the causal story changes, regardless of the pattern.

  **Crux 2: Transitivity of the Push Relation**
  *Question:* Is the causal relation transitive across careenial layers? (i.e., If Symbol A pushes Simmballs, and Simmballs constitute Symbol B, did Symbol A push Symbol B?)

  *   **In-Model Case:** The **Nested Cascade**.
      *   *Setup:* A high-level Symbol-Alpha collides with a cloud of loose simmballs. These simmballs immediately coalesce into a new Symbol-Beta.
      *   *Observation:* Track the momentum transfer from Alpha to the cloud to Beta.
  *   **Side A Prediction (Pushers):** **Yes, Transitive.** Symbol-Alpha caused the motion of Symbol-Beta. The causal chain holds across the layer boundary because the symbolic level has genuine causal traction.
  *   **Side B Prediction (Correlationalists):** **No, Intransitive.** Symbol-Alpha pushed *balls*. Those *balls* pushed other *balls* which happened to look like Symbol-Beta. There is no direct push between symbols because symbols cannot touch, only balls can. To say Alpha pushed Beta is a category error.

  ***

  let me know if you want to tweak the wording on the transitivity bit--side B might fight hard on the "category error" phrase. maybe soften to "descriptive convenience"? 

  talk soon.
