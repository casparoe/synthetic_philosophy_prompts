answer: |-
  ### Session Architecture (90 Minutes)

  **1. The Trap (0–20 mins)**
  *   **Goal:** Create cognitive dissonance between Expected Value (EV) intuition and long-term survival.
  *   **Action:** Introduce the anchor example (see below). Ask the room: "How much of your bankroll do you bet?"
  *   **Whiteboard:** Write the EV calculation. It will clearly show that betting 100% maximizes expected wealth for a single round.
  *   **The Turn:** Ask them to simulate 10 rounds mentally. If you bet 100%, a single loss (40% probability) wipes you out. The probability of surviving 10 rounds is $0.6^{10} \approx 0.6\%$.
  *   **Key Question:** "If EV says bet everything, but betting everything guarantees ruin in a sequence, is EV broken, or are we optimizing the wrong thing?"
  *   **Outcome:** Establish that for *repeated reinvestment*, the arithmetic mean (EV) diverges from the experienced reality (Time Average).

  **2. The Objective Function Shift (20–40 mins)**
  *   **Goal:** Derive the correct objective function without invoking utility theory.
  *   **Action:** Define wealth after $N$ rounds as a product of returns, not a sum.
  *   **Whiteboard:** Show $W_N = W_0 \cdot (1+f)^H \cdot (1-f)^T$.
  *   **Math:** Take the logarithm. Show that maximizing final wealth is equivalent to maximizing the expected value of the *log* of wealth per step.
  *   **Concept:** Explicitly label this "Maximizing Expected Geometric Growth Rate." Contrast this with "Maximizing Expected Arithmetic Wealth."
  *   **Outcome:** The math justifies the intuition: Logarithms turn products into sums, making the sequence tractable via Law of Large Numbers.

  **3. The Derivation & Solution (40–60 mins)**
  *   **Goal:** Solve for the optimal fraction $f^*$.
  *   **Action:** Set up the function $g(f) = p \log(1+f) + q \log(1-f)$.
  *   **Whiteboard:** Perform the calculus ($g'(f) = 0$). Arrive at $f^* = p - q$.
  *   **Plug-in:** For the anchor example ($p=0.6$), $f^* = 0.2$.
  *   **Comparison:** Plot the growth rate of $f=1.0$ (negative infinity) vs $f=0.2$ (positive) vs $f=0.5$ (lower than 0.2).
  *   **Outcome:** They see the specific number derived from first principles, not a rule of thumb.

  **4. Synthesis & Boundaries (60–80 mins)**
  *   **Goal:** Contextualize when Kelly applies and when it doesn't.
  *   **Action:** Discuss the "Ensemble vs. Time" average distinction (ergodicity).
  *   **Discussion:** EV is correct for parallel bets (ensemble) or single bets with no reinvestment. Kelly is correct for sequential bets with reinvestment (time).
  *   **Outcome:** They understand the domain of applicability, preventing overgeneralization.

  **5. Check for Understanding (80–90 mins)**
  *   **Goal:** Verify they grasp the *condition*, not just the formula.
  *   **Action:** Administer the "Single Shot" test (see below).

  ---

  ### The One Worked Example
  **Scenario:** A biased coin flip.
  *   **Probability:** 60% Heads (Win), 40% Tails (Loss).
  *   **Payout:** Even money (Bet \$1, win \$1 profit; or lose \$1).
  *   **Structure:** Sequential bets with full reinvestment of current bankroll.
  *   **Why this example:**
      1.  **Simple Numbers:** $p=0.6$ yields a clean Kelly fraction of $0.2$ (20%).
      2.  **Positive EV:** The bet is genuinely favorable ($0.6 \times 1 + 0.4 \times -1 = 0.2$), so refusing to bet is obviously wrong.
      3.  **Ruin is Certain:** Betting 100% leads to guaranteed ruin eventually, creating the starkest contrast with EV maximization.
      4.  **Symmetry:** The payout is 1:1, avoiding confusion about odds ratios ($b$) in the formula $f^* = (bp - q)/b$. Keep $b=1$ for this session.

  ---

  ### Misconceptions & Preemptive Strikes

  **1. "Kelly is about risk aversion."**
  *   **When it arises:** During the derivation (20–40 mins) when you introduce the log function.
  *   **The Strike:** Explicitly state: "This is not about psychology or utility preferences. This is not about 'feeling safe.' This is the mathematical maximum possible growth rate. Betting less than Kelly reduces growth; betting more than Kelly reduces growth *and* increases volatility. Kelly is the aggressive optimum, not a conservative hedge."

  **2. "Expected Value is wrong."**
  *   **When it arises:** During The Trap (0–20 mins) when EV suggests 100% betting.
  *   **The Strike:** Do not let them discard EV. Say: "EV is correct for the *average across many people* making this bet once. It is incorrect for *one person* making this bet many times. The math isn't wrong; the objective function doesn't match the physical constraint of reinvestment."

  **3. "Kelly guarantees I won't lose money."**
  *   **When it arises:** During Synthesis (60–80 mins).
  *   **The Strike:** Remind them that variance exists. "Kelly maximizes the *rate* of growth. You will still have drawdowns. You will still have losing streaks. It only guarantees that you do not go to zero asymptotically."

  **4. "I've heard you should bet Half-Kelly."**
  *   **When it arises:** Likely in the first 5 minutes from the poker players.
  *   **The Strike:** Acknowledge it immediately, then park it. "Half-Kelly is a heuristic for parameter uncertainty and variance reduction. We are deriving the exact optimum for known probabilities today. We will not cover fractional Kelly adjustments until you understand the full Kelly baseline."

  ---

  ### What to Explicitly Refuse to Cover
  1.  **Utility Theory Philosophy:** Do not discuss Bernoulli, St. Petersburg paradox, or isoelastic utility functions beyond the mechanical use of $\log(W)$. Frame log wealth as a tool for geometric growth, not a moral stance on risk.
  2.  **Continuous Finance:** Do not mention Black-Scholes, Merton portfolios, or stock market applications. Keep it to discrete binary bets.
  3.  **Multi-Asset Correlation:** Do not discuss how to allocate across multiple simultaneous bets. Stick to one asset/one bet.
  4.  **Proof of Convergence:** Do not prove the Law of Large Numbers application. State it as a given for $N \to \infty$.

  ---

  ### Check for Understanding
  **The "Single Shot" Test**
  Near the end, present this scenario:
  *"You are offered the same 60/40 even-money bet. However, you are only allowed to play **once**. After this single bet, the game ends forever, and you keep whatever you have. You cannot reinvest. What fraction of your bankroll do you bet?"*

  *   **Correct Answer:** 100% (Maximize Expected Value).
  *   **Why this works:** If they answer "20%" (Kelly), they have memorized a rule without understanding the mechanism. If they answer "100%" and can articulate that the geometric growth argument requires repetition/reinvestment, the core concept has landed. This forces them to distinguish between the *structure of the problem* (sequential vs. single) rather than just applying a formula.

  The central pedagogical challenge is convincing them to abandon expected value maximization without invalidating the math, by showing that the optimal objective function depends entirely on whether the bet is repeated with reinvestment.
