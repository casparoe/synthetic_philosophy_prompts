answer: |-
  1. **Setup and materials**
  Divide the class into five groups of three. Each group receives:
  *   **Three Role Cards:** "Adviser" (Speaker), "Director" (Hearer), "Auditor" (Judge).
  *   **Five Truth Cards:** Marked "Excellent," "Average," or "Poor" (shuffle; Adviser sees only their own).
  *   **Two Context Cards:** "Allies" (Round 1) and "Rivals" (Round 2).
  *   **One Handout:** A scoring sheet with columns for "Statement," "Decision," "Inference Chain," and "Auditor Ruling."
  *   **Pens and Index Cards:** For writing statements.
  *   **Whiteboard:** For global scoring only.
  *   **Constraint:** Do not write terms like "implicature," "said," or "maxims" on the board or handouts until the final debrief.

  2. **Rules, roles and scoring**
  **The Scenario:** The Director must hire or reject a candidate. The Adviser knows the candidate's true quality (Truth Card). The Auditor ensures no lies are told.
  **Round 1 (Allies):** Both Adviser and Director want the best hire.
  **Round 2 (Rivals):** Adviser wants a Hire (any quality); Director wants to hire only if "Excellent." Interests diverge.
  **Round 3 (Cancellation):** Same as Round 1, but Adviser may add a canceling clause.

  **Adviser (Speaker):** Write one sentence about the candidate.
  *   +2 points if Director Hires.
  *   +2 bonus points if Auditor rules "No literal claim of quality made" (Deniability Bonus).
  *   -1 point penalty if using a canceling clause (Round 3).
  *   -5 points if Auditor rules "Literal Falsehood."

  **Director (Hearer):** Decide Hire/Reject.
  *   +2 points for Correct Decision (Hire Excellent, Reject Others).
  *   **Crucial:** Must write the "Inference Chain" on the handout: "Adviser said [X]. Assuming [Context], they must mean [Y]." If this box is empty, no points awarded.

  **Auditor:** Judge literal truth only.
  *   +1 point for correct ruling (True/False/Non-Claim).
  *   Ignore what is suggested; judge only what is written.

  **Scoring Logic:** The Deniability Bonus incentivizes the Adviser to imply quality without stating it (Target 2). The Inference Chain requirement forces the Director to reconstruct the argument (Target 1). The Context shift changes the assumptions used in that reconstruction (Target 3). The Round 3 penalty shows cancellation has a cost and variable effectiveness (Target 4).

  3. **Timeline**
  **00:00–05:00 (Framing):** Distribute materials. Explain only the goal: "Maximize your points. Adviser guides, Director decides, Auditor polices literals. Do not discuss strategy between groups." Write nothing on the board.
  **05:00–15:00 (Setup & Round 1):** Groups form. Distribute "Allies" Context Cards. Adviser draws Truth Card. Adviser writes statement; Director decides and writes inference chain; Auditor rules. Collect scores.
  **15:00–25:00 (Round 2):** Distribute "Rivals" Context Cards. New Truth Cards. Repeat process. Emphasize: "Your goals have changed."
  **25:00–35:00 (Round 3):** Return to "Allies." Adviser may optionally add "but I don't mean to suggest [quality]" to their statement. Apply -1 point cost if used. Repeat process.
  **35:00–45:00 (Transition):** Collect all handouts. Tally group scores on the whiteboard. Announce winners. Clear the board.
  **45:00–75:00 (Debrief):** Begin discussion using the prepared questions. Introduce vocabulary (implicature, said, cooperation) only now, writing terms on the board as students identify the phenomena they just experienced.

  4. **How each round maps onto the distinctions**
  **Round 1 (Targets 1 & 2):** Engineered to produce **inferred content**. Because the Adviser wants the Deniability Bonus, they will avoid literal claims (e.g., "He writes well" instead of "He is smart"). The Director must reconstruct the argument to get points, proving the content was inferred, not decoded. The Auditor's validation proves it wasn't "said."
  **Round 2 (Target 3):** Engineered to break **cooperation**. By shifting to "Rivals," the Director no longer assumes the Adviser is helpful. The same sentence (e.g., "He writes well") should now fail to generate the positive inference. This demonstrates that implicature relies on assumed shared purpose, not just semantic content.
  **Round 3 (Target 4):** Engineered to test **cancellability**. The Adviser can explicitly deny the implication. The -1 point cost represents the social awkwardness/logical cost. If the Director still hires, it shows the inference persists despite cancellation (logical property). If they reject, it shows cancellation can work but costs the Speaker the bonus, illustrating it is not a free social escape hatch.

  5. **Debrief questions**
  1.  "Advisers: How did you get the Director to hire a 'Poor' candidate without losing points to the Auditor?"
      *   *Follow-up:* "So the Director knew something you didn't write. Where did that information come from?" (Elicit: Inference).
  2.  "Directors: Look at your Inference Chains from Round 1 vs. Round 2. Did the Adviser's sentence change, or did your interpretation change?"
      *   *Follow-up:* "What assumption did you drop in Round 2 that you held in Round 1?" (Elicit: Cooperation/Trust).
  3.  "Auditors: Did anyone ever mark a statement as false when it was technically true but misleading? Why not?"
      *   *Follow-up:* "If we only audit literal truth, what gap remains open?" (Elicit: Misleading vs. Lying).
  4.  "Round 3: Who used the canceling clause? Did it stop the Director from hiring?"
      *   *Follow-up:* "It cost you a point. Was it worth it? Why did it feel awkward?" (Elicit: Cancellability is a test, not a cure).
  5.  "We haven't used the words yet. What would you call the extra content that wasn't said but was understood?"
      *   *Action:* Write "Implicature" on the board. Map their experiences to Gricean terms (CP, Maxims) based on their answers.

  6.  **Predictable failure modes**
  **Collusion:** Groups might agree to ignore rules to maximize collective points.
  *   *Fix:* Announce mid-game that the top three individual scorers get bonus credit, introducing competition within groups.
  **Auditor Pedantry:** Auditors might rule true statements as false (e.g., "He has nice handwriting" implies he isn't smart, so Auditor calls it misleading/false).
  *   *Fix:* Remind Auditors during setup: "You are a logic checker, not a mind reader. If the sentence *can* be true, it passes."
  **Vague Statements:** Advisers might write nonsense ("He exists") to ensure literal truth.
  *   *Fix:* The Director gets 0 points if they Reject automatically. They *must* try to Hire to score, forcing Advisers to be informative enough to trigger inference.
  **Cancellation Confusion:** Students might treat the canceling clause as a magic wand that guarantees safety.
  *   *Fix:* In Round 3 briefing, emphasize: "The Director still decides based on what they feel is meant. The clause costs points regardless of outcome."
  **Time Overrun:** Groups arguing over scores.
  *   *Fix:* You hold the master scorecard. Groups submit sheets; you make final rulings quickly during the transition period to keep flow.

  7.  **What the game cannot do**
  This activity isolates **particularized conversational implicature** driven by context and cooperation. It cannot reproduce **conventional implicature** (e.g., the contrastive force of "but" or "therefore"), which is attached to specific words rather than context. It also cannot fully demonstrate **generalized implicature** (default inferences without special context), as every round here is heavily contextualized.
  **Closing Explanation (5 mins):** After the debrief, explicitly state: "You just modeled conversational implicature. Next week, we will look at cases where the extra meaning comes from the words themselves, like 'but' vs. 'and', regardless of context. Also, we will discuss whether this inferential model explains all non-literal meaning, or if some meanings are actually part of 'what is said' (Semantic Pragmatics)." Leave the debate on the Said/Implicated boundary for the next seminar.
