      *(Self-Correction during drafting Section 2)*: Ensure the "Auditor" role is clear. They are the truth police.
      *(Self-Correction during drafting Section 4)*: Explicitly link Round 1 to Target 1 & 2, Round 2 to Target 3, Round 3 to Target 4.
