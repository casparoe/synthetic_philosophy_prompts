answer: |-
  Miriam wins the debate on epistemological grounds, though Callum correctly identifies the physical reality of finite stocks.

  (1) **Mostly right with a caveat:** Callum accurately describes the Malthusian mechanism and the finite nature of fossil stocks, but claiming credit for Malthus ignores that Malthus explicitly denied the possibility of technological shifts altering the subsistence flow.

  (2) **Mostly right:** Miriam correctly identifies the unfalsifiability risk and the competing "people as brains" theory, though she treats innovation as a guaranteed escape rather than a contingent variable.

  (3) **Mostly right with a caveat:** The argument about diminishing returns to innovation is empirically supported in several sectors, but assuming constraints are fixed ignores potential substitution effects that aren't purely stock-based.

  (4) **Clearly right:** This is the strongest philosophical point; without a defined condition for failure, a forecast is indistinguishable from a prophecy, and the asymmetry of "right but early" invalidates the claim.

  (5) **Mostly wrong:** Equating social status competition with biological subsistence constraints is a category error that stretches the original theory beyond recognition to save it from refutation.

  (6) **Clearly right:** Miriam correctly distinguishes between hard biological limits and soft policy choices, exposing the bait-and-switch in Callum's positional argument.

  Miriam is more right overall because she successfully demonstrates that a theory without a falsification condition cannot claim predictive credit, regardless of how plausible the underlying mechanism seems.

  Both participants miss the Bayesian obligation of the forecaster: to claim "right but early," you must show that your confidence interval widened or probability decreased during the quiet period. If a forecaster holds a prediction at 99% certainty for fifty years while evidence mounts against it, they weren't early, they were stubborn; a defensible line exists only if the forecaster specifies interim markers that must trend a certain way even if the crash hasn't happened. Furthermore, they ignore the cost of the warning itself; if a forecast demands austerity or policy shifts now for a crash later, the "early" defense does not absolve the economic cost of acting on a false positive in the interim. A mechanism is real only if it dictates observable trends today, not just a catastrophe tomorrow; otherwise, it is indeed hindsight wearing a lab coat.
