  **Brainstorming**

  *   **Unpacking the Paradox:**
      *   Claim 1: Equality indices measure the removal of external barriers accurately (not just outcomes).
      *   Claim 2: Choices in high-equality countries reveal "pure" preferences (unconstrained by social pressure).
      *   Claim 3: Correlation implies causation (equality *causes* traditional choices).
      *   Claim 4: "Widening participation" implies removing barriers, not overriding autonomous preferences.
  *   **Arguments Surviving Empirical Claim:**
      *   Autonomy requires exposure; preferences aren't pre-formed but discovered through experience.
      *   Utilitarian aim: Science needs talent regardless of gender ratios.
      *   Local context differs; UK is not Sweden.
      *   Preferences formed under subtle bias aren't fully autonomous (adaptive preferences).
  *   **Risks of Recommendation:**
      *   If paradox is robust/causal, we waste money fighting nature/culture.
      *   If deed requires increasing numbers and Interface doesn't, we breach trust.
      *   Winding down signals retreat on equality; reputational damage.
      *   If "lower conversion rate" is real (crowding out), we harm participants.

  ***

  **DECISION MEMO: RENEWAL OF INTERFACE PROGRAMME**

  **To:** Grants and Programmes Committee
  **From:** Chair
  **Date:** 10 March
  **Subject:** Recommendation on Interface Funding

  **Recommendation**
  I recommend we renew the Interface grant for one year only, at a reduced level of £500,000, conditional on two outcomes. First, the Secretary must obtain legal advice on whether "widening participation" in the deed permits funding capability-building even if long-term occupational uptake does not rise. Second, the Programme Director must redesign the evaluation to track participants to age twenty-one without relying on subject classifications prone to redefinition. This bridging year allows us to resolve the legal and empirical uncertainties without abandoning a programme that may be morally required even if empirically contested.

  **The Cross-National Evidence**
  Dr Halloran's inference relies on three strong assumptions that the current data do not support. For the gender-equality paradox to justify winding down Interface, the countries topping the equality rankings must be near the ideal of barrier removal, not merely at the good end of an imperfect range. In reality, these indices often measure economic outcomes which are themselves influenced by occupational segregation, creating circularity. Furthermore, the inference assumes that preferences revealed in these contexts are fully autonomous. We have no reason to believe socialisation pressures vanish simply because legal barriers are removed. Subtle cultural signalling regarding "appropriate" roles persists even in high-equality societies. Therefore, the cross-sectional correlation cannot bear the weight of a causal claim that removing barriers *produces* traditional choices. It remains equally plausible that unmeasured cultural variables drive both the equality score and the occupational choices.

  **The Awkward Results**
  We must treat the two conflicting data points with caution. The within-country result is theoretically superior to cross-national comparison because it controls for cultural constants. However, the warning regarding subject reclassification undermines its reliability; we cannot distinguish real behavioural change from administrative artefact. It should be noted but not decisive. Regarding Interface's own data, the lower conversion rate to degrees at eighteen is worrying but statistically non-significant. In social science, noise often mimics signal. However, it cannot be ignored. The next evaluation must establish whether this dip is random variation or a "crowding out" effect, where early enthusiasm fades upon contact with reality. We cannot defend funding a programme that demonstrably reduces long-term uptake, but neither should we cut one based on statistical noise.

  **Empirical vs. Normative Disagreements**
  Much of our disagreement is conceptual, yet we are arguing as if it were empirical. Dr Halloran assumes "widening participation" means increasing the *number* of women in science. The Programme Director assumes it means expanding the *capability* of girls to choose science if they wish. They are talking past each other. Halloran focuses on outcomes; the Director focuses on process. Additionally, Halloran treats current preferences as fixed endpoints to be respected. The Director treats them as malleable states to be informed. Until we agree on whether the Foundation's goal is to maximise headcounts or to maximise autonomous choice, the evidence will remain inconclusive to us.

  **The Justice Question**
  Suppose the residual imbalance in egalitarian countries reflects women's own preferences rather than removable barriers. Does the case for Interface collapse? I argue it does not. We must distinguish between the Foundation's aim as expanding the pool of scientifically trained people (utilitarian) and its aim as expanding each girl's options (liberal). Even if final choices remain gendered, justice requires that those choices are made from a position of genuine opportunity. Preferences formed under non-ideal conditions—where girls receive subtle signals that science is "for boys"—are adaptive. They adjust to perceived constraints. Interface disrupts this adaptation by providing counter-evidence. Therefore, the programme is justified on grounds of ensuring conditions for autonomous preference formation, regardless of the eventual statistical distribution of careers. We are not overriding preferences; we are ensuring they are informed.

  **The Case for Winding Down**
  The strongest case for Dr Halloran's position rests on opportunity cost and non-maleficence. If Interface encourages girls to pursue paths they later abandon, we may be wasting their time and our capital that could save lives elsewhere. If the "lower conversion rate" proves real and significant in future data, it suggests the programme creates unrealistic expectations. That evidence would be decisive. If we find that treated girls are less happy or less successful than matched peers, we must stop immediately. Respect for persons requires us not to manipulate aspirations for ideological ends if the cost is borne by the participants themselves.

  **Public Communication**
  Whichever way we decide, we should not cite the gender-equality paradox publicly. It is too easily misinterpreted as a biological determinism we do not endorse. If we renew, state that we are "refining our impact measurement to ensure long-term benefit." If we wind down, state that we are "reallocating resources to high-impact areas of need." Do not engage in a public debate about the nature of women's preferences; it will be weaponised against the Foundation's broader mission.

  **Governing Deed Difficulty**
  *For the Secretary and Legal Counsel:* There is a genuine risk that funding a programme which does not increase long-term occupational uptake breaches the deed's restriction to "widening participation." If "participation" is interpreted as enrolment numbers rather than access to opportunity, Interface may be non-compliant if the degree conversion gap persists. We need an opinion on whether "widening participation" permits funding exploratory education that does not result in vocational entry. This is not a matter for the Committee to settle by vote; it is a matter of trust law.

  **Conclusion**
  We are operating under incomplete evidence and genuine philosophical disagreement. A one-year renewal allows us to gather better data and legal clarity without precipitating a decision we cannot defend. We should proceed with caution, but not retreat.
