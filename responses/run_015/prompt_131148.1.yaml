      *   *Section 2: The Metrics of Progress (Convergence vs. Baseline).* The "Rising Objection Baseline" is the strongest optimist move. But it's hard to measure. The pessimist wants *answers*; the optimist wants *better questions*. This is a teleological disagreement.
