      *   *The Mechanism:* Bad faith relies on the dual nature of human reality (Facticity vs. Transcendence). I can emphasize my facticity to deny my transcendence (I *am* a waiter) or emphasize my transcendence to deny my facticity (I am *not* my past).
      *   *Pre-reflective vs. Reflective:* This is crucial. I know pre-reflectively that I am free. I can assert reflectively that I am determined. Bad faith happens when I try to *be* something (in-itself) while knowing I am nothing (for-itself).
      *   *The "Censor" Critique:* Sartre explicitly addresses this in BN. He says the censor must know what it represses to repress it, which implies consciousness. So, repression is a conscious act.
      *   *Faith vs. Bad Faith:* Sartre distinguishes them. Faith believes its own lie. Bad faith knows, on some level, it is lying, but sustains the lie to avoid anguish.
