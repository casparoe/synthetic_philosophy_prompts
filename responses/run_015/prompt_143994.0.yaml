prompt: |-
  Hey — I'm in a small reading group on Dennett's "Quining Qualia" (four of us, one philosophy grad student who's basically a card-carrying dualist) and we keep circling the drain on the same move. Every time anyone makes headway with a functionalist or heterophenomenology-style story about colour experience, he says something like: fine, but you still haven't told me what it's LIKE to see red — or, you've described everything the state does and left out what it's like — and then behaves as if the conversation is basically over. I'd like to bring a menu to the next session instead of another round of the same argument. Please don't bother with references, citations or further reading, I've got the readings themselves covered; I just want the distinctions and the arguments.

  So: what are the different precise claims that line could be making? Some candidate readings I can half-articulate myself, so tell me if I've got them wrong or if two are really the same one: (1) the boring one — undergoing an experience differs from merely reading a description of it, roughly like being able to ride a bike differs from reading the manual, which no functionalist ever denied; (2) the Mary-ish one — a complete functional or physical description leaves out a fact, i.e. there's some truth about the subject's state that the description doesn't entail, and the subject could come to learn it; (3) the concept one — our concept of what red-experience is like isn't a functional or relational concept, and no amount of functional description could hand you that concept, you have to have been acquainted with the state; (4) the property one — experiences have intrinsic, non-relational properties over and above all their dispositional and relational ones; (5) the ineffability-plus-incorrigibility one — what it's like can't be fully put into words, and nothing could ever show you that you're wrong about it. Maybe there are readings I'm missing.

  Two things I especially want. First, for each reading say whether it's trivial, substantive and defensible, or actually false or incoherent — and, the part I really care about, which of them would actually get him his conclusion. His conclusion is roughly: therefore experiences have features that no functional (or physical) story captures, so the functional story is incomplete as a theory of consciousness. It looks to me like some of those readings are only about concepts or about ways of knowing, and wouldn't get him anywhere near that. Second, the bit I got properly stuck on: Dennett's charge is that qualia are standardly supposed to be intrinsic, ineffable, private and directly apprehensible all at once, and that it's the package deal that makes the notion an incoherent posit rather than just a contested one. I'd like you to trace which of the readings above actually needs which of those four properties — does the left-out-a-fact reading really require ineffability, or only the acquaintance reading, and so on — and say which of the combinations are the ones that can't be held together, and why.

  One more thing, in case it helps: we invented a case to test things. Every night while you sleep, a chip rewires your colour system so that the neural state playing the red-role today is the one that played the green-role yesterday, and it also updates all your colour discriminations, your memories of how things looked, your preferences and your verbal dispositions, so that nothing functional changes at all — no test, including your own most attentive introspection the next morning, could tell. My friend says: even so, there's a fact about whether red looks today the way red looked yesterday, and that fact is exactly what your theory leaves out. I want to say it's a "fact" the theory has neither room nor use for. Which reading on your menu is the one doing the work in his reply, is any of them a clearly strongest version of his point rather than a strawman, and — be honest if this is the answer — is the slogan maybe doing zero real work and only sounding deep because it's indexical?
