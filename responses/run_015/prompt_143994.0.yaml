answer: |-
  Here is a menu of the precise claims your friend is likely making, an assessment of their viability, and a breakdown of how they interact with Dennett's "package deal" and your chip-swap case.

  ### Part 1: The Menu of Readings

  Here is the evaluation of your five candidate readings. The crucial filter is: **Does this claim force us to abandon functionalism/physicalism, or can a functionalist accept it?**

  **(1) The Boring One (Experience vs. Description)**
  *   **Claim:** Having an experience is different from reading a description of it (like riding a bike vs. reading a manual).
  *   **Status:** **Trivial/True.** Every functionalist agrees. Functionalism is a theory of what mental states *are*, not a claim that reading a theory induces the state.
  *   **Does it get him his conclusion?** **No.** This is an epistemic point about causal access, not an ontological point about the nature of the state. A functionalist can say, "Of course reading the manual doesn't rewire your brain to play the red-role. That doesn't mean the red-role isn't functional."

  **(2) The Mary-ish One (The Left-Out Fact)**
  *   **Claim:** A complete functional/physical description of the world leaves out a *truth* (a fact) that can only be known by experiencing.
  *   **Status:** **Substantive and Defensible (for dualists); False (for functionalists).** This is the core of the Knowledge Argument.
  *   **Does it get him his conclusion?** **Yes.** If there is a *fact* that functionalism does not entail, functionalism is ontologically incomplete. This is the strongest version of his objection. However, functionalists often counter that what is gained is not a new *fact* about the world, but a new *mode of presentation* of an old fact (see Reading 3).

  **(3) The Concept One (Acquaintance)**
  *   **Claim:** We possess "phenomenal concepts" that can only be acquired by having the experience. No functional description gives you *this concept*.
  *   **Status:** **Substantive and Defensible.** Many physicalists accept this (the "Phenomenal Concept Strategy").
  *   **Does it get him his conclusion?** **No.** This is compatible with physicalism. You can have a physical state that is picked out by two different concepts: a functional concept ("wavelength 700nm detection") and a phenomenal concept ("this redness"). The gap is in the *concepts*, not the *property*. If your friend only means this, he hasn't proven dualism.

  **(4) The Property One (Intrinsic Non-Relational Properties)**
  *   **Claim:** Experiences have qualitative properties (qualia) that exist over and above their causal/dispositional roles.
  *   **Status:** **Substantive and Defensible (for dualists); False (for functionalists).** This is Property Dualism.
  *   **Does it get him his conclusion?** **Yes.** Functionalism defines states entirely by their relations (inputs, outputs, internal relations). If a state has a property that is *intrinsic* (non-relational), functionalism by definition cannot capture it. This is the metaphysical engine of his objection.

  **(5) The Ineffability-plus-Incorrigibility One**
  *   **Claim:** You cannot fully describe the experience (ineffable), and you cannot be wrong about it (incorrigible).
  *   **Status:** **False/Incoherent.** Most contemporary philosophers (including many dualists) reject incorrigibility. We can be wrong about our experiences (e.g., thinking you see red when you are actually seeing orange under bad light).
  *   **Does it get him his conclusion?** **No.** It's too strong. If he insists on incorrigibility, Dennett will easily show him cases where subjects are clearly mistaken about their own phenomenology. If he drops incorrigibility, this reading collapses into (2) or (4).

  **Summary for your group:** Readings (1) and (3) are compatible with functionalism. Readings (2) and (4) are the only ones that actually support the conclusion that functionalism is false. Your friend is likely sliding between (3) and (4)—using the plausibility of (3) to smuggle in (4).

  ---

  ### Part 2: Dennett's "Package Deal" Analysis

  Dennett's charge in "Quining Qualia" is that the standard definition of qualia bundles four properties together: **Intrinsic, Ineffable, Private, Directly/Apprehensibly Incorrigible.** He argues they cannot all be held together without contradiction.

  Here is how your five readings map onto those four properties, and where the tensions lie:

  **1. The "Left-Out Fact" (Reading 2)**
  *   **Requires:** *Private* and *Directly Apprehensible*. (Only the subject can know the fact, and they know it immediately).
  *   **Does it require Ineffable?** No. Mary can learn the fact and express it ("Ah, so *that's* what red is like").
  *   **Does it require Intrinsic?** Usually yes. If the fact were just about relations, the physical description should have captured it.
  *   **The Tension:** If the fact is *Intrinsic* (has no causal power), how is it *Directly Apprehensible*? Apprehension is a cognitive judgment. Judgments are functional/causal. If the qualia are intrinsic and non-causal, they cannot trigger the judgment "I am seeing red." If they *do* trigger the judgment, they are relational/causal, and functionalism should capture them.

  **2. The Concept One (Reading 3)**
  *   **Requires:** *Directly Apprehensible* (Acquaintance).
  *   **Does it require Intrinsic?** No. You can have a unique concept for a relational property.
  *   **The Tension:** This is the safest reading for the dualist, but it doesn't get him dualism. It avoids Dennett's trap by dropping the *Intrinsic* requirement.

  **3. The Property One (Reading 4)**
  *   **Requires:** *Intrinsic*. (This is the definition of the claim).
  *   **Requires:** *Private*? Yes, if it's intrinsic to the subject's mind, only they have it.
  *   **The Tension:** This is Dennett's main target. If a property is truly *Intrinsic* (independent of relations), then changing the relations (functional role) shouldn't change the property. But if the property is *Directly Apprehensible*, our judgments about it must track it. If our judgments are functional (which they are), and the property is non-functional, the link between the two is magical. Dennett argues you can't have a property that is both *Intrinsic* (outside the functional net) and *Directly Apprehensible* (inside the functional net of judgment).

  **4. The Ineffability/Incorrigibility One (Reading 5)**
  *   **Requires:** *Ineffable* and *Directly Apprehensible/Incorrigible*.
  *   **The Tension:** If it is *Ineffable*, we cannot talk about it. But we are talking about it. If it is *Incorrigible*, there is no distinction between *seeming* and *being*. Dennett argues that without the possibility of error (which requires a functional check), the notion of "knowledge" or "apprehension" loses its meaning.

  **The Incoherent Combination:**
  The combination that breaks is **Intrinsic + Directly Apprehensible.**
  *   If it's **Intrinsic**, it doesn't affect your judgments (because judgments are relational/causal).
  *   If it's **Directly Apprehensible**, it *does* affect your judgments.
  *   Therefore, it can't be both. Your friend wants the property to be real (Intrinsic) but also wants you to know it immediately (Directly Apprehensible). Dennett says: pick one. If you pick Intrinsic, it's epiphenomenal (you can't know it). If you pick Apprehensible, it's functional (you can't claim functionalism misses it).

  ---

  ### Part 3: The Nightly Chip Swap Case

  **The Case:** Neural state for red swaps with green nightly, but all memories, discriminations, and verbal dispositions are updated to match. No functional difference.
  **Friend's Claim:** There is still a fact about whether red looks today the way it looked yesterday.
  **Your Intuition:** It's a "fact" the theory has no room or use for.

  **1. Which reading is doing the work?**
  This is purely **Reading (4): The Property One.**
  Your friend is asserting that the *intrinsic quality* of the state persists or changes independently of the functional role. He is claiming that "qualitative identity" is not defined by "functional continuity." He is positing a property that is completely decoupled from behavior, memory, and discrimination.

  **2. Is this the strongest version of his point?**
  Yes, this is the strongest version. It isolates the *Intrinsic* property from all *Relational* properties. It forces the question: Is there more to consciousness than its role in the system?
  However, it is also the most vulnerable. By updating the memories and dispositions, your friend has made the qualia **epiphenomenal**. The "fact" he claims exists makes no difference to the subject, to science, or to the future behavior of the universe.

  **3. Is the slogan doing zero work because it's indexical?**
  Be honest: **Yes, largely.**
  Here is the Dennettian diagnosis of your friend's move in this specific case:

  When your friend says, "There is a fact about whether red looks today the way red looked yesterday," he is using an indexical phrase ("the way red looked") that *pretends* to refer to an intrinsic property but actually derives its meaning from functional criteria.

  *   **Normal Use:** In normal life, "looks the same" means "I can't discriminate a difference," "I classify it the same," and "I remember it as the same."
  *   **Friend's Use:** He has stripped away all those criteria (discrimination, memory, classification are all updated/neutralized) and insists the phrase *still* has meaning.

  Dennett's charge is that once you remove the functional criteria (discrimination, memory, judgment), the phrase "the way it looks" is empty. It sounds deep because it feels like you are pointing at something (the indexical "this quality"), but if the pointing mechanism (the functional state) is rewired to point the same way regardless of the underlying quality, the "pointing" is all there is.

  **The Verdict on the Chip Swap:**
  Your friend is relying on the intuition that **Reference > Function.** He thinks his thought "Red looks the same" refers to an intrinsic property that survives the swap.
  You are relying on the intuition that **Function > Reference.** You think the content of the thought "Red looks the same" is *constituted* by the functional role of that thought. If the functional role is unchanged, the content is unchanged. If the content is unchanged, there is no "left over" fact.

  **How to deploy this:**
  Tell him: "In your chip-swap case, you've defined the 'fact' as something that makes no difference to behavior, memory, or judgment. You are claiming there is a difference that makes no difference. If you admit it makes no difference, you admit it is causally inert. If it is causally inert, it cannot be 'Directly Apprehensible' (because apprehension is a causal process). So you are positing a property that, by your own definition, you cannot know exists. You are asking us to believe in a fact that is, in principle, undetectable by anyone, including the subject. That isn't a fact about consciousness; it's a grammatical illusion."

  This forces him to either:
  1.  Admit the fact is undetectable (and thus question why we believe in it).
  2.  Admit that "what it's like" *does* depend on memory/judgment (which collapses his Chip Swap argument).
  3.  Insist on the magic link between Intrinsic Property and Judgment (which invites Dennett's incoherence charge).
