answer: |-
  The principle that unifies your affirmed verdicts while excluding the rejected ones is **The Principle of Non-Privileged Ordinality**.

  It can be stated with the following precision:

  > **A narrative structure instantiates the Borgesian refutation of time if and only if its formal logic renders the ordinal position of any constituent unit (scene, sentence, or cause) ontologically non-constitutive, such that no single moment acts as a privileged anchor for a "present," and the sequence of consumption generates no irreversible state of "becoming."**

  This principle relies on two clauses that map directly to your cases:

  1.  **The Clause of Non-Privilege (No "First" or "Now"):** This demands that no element holds ontological priority over another. There can be no definitive origin, no definitive end, and no moving "now" that validates the reality of the moment.
      *   *Affirmed:* In the **Amnesiac Loop**, no iteration is the "original"; they are ontologically identical. In the **Originless Authorship**, the cause and effect are reciprocal, dissolving the "first cause." In the **Future-Perfect Memoir**, the grammatical tense abolishes the "present," viewing the life as a completed block from a timeless vantage.
      *   *Rejected:* In the **Lateral-Branch** plot, the protagonist's movement implies a meta-time in which the transition occurs, privileging the moment of transition as a "now." In **Deterministic Prefiguration**, the image *must* precede the event to function as a prefiguration; the ordinality is constitutive of the meaning.

  2.  **The Clause of Non-Generation (No "Becoming"):** This demands that the progression through the text does not create new ontological realities. The end of the text must not reveal a state of affairs that was not implicitly true at the beginning.
      *   *Affirmed:* The **Amnesiac Loop** returns to the same state. The **Originless Authorship** reveals the end was always the beginning. The **Future-Perfect** describes a fate that is already sealed.
      *   *Rejected:* The **Lateral-Branch** plot generates new realities (Timeline B is distinct from Timeline A). The **Deterministic Prefiguration** relies on the accumulation of meaning across duration (the event fulfills the image).

  ### The Necessary Sacrifice

  To maintain the simplicity and rigor of this principle, you must sacrifice the distinction you noted in the **Future-Perfect Memoir** between "linguistic" and "structural" denial.

  If you insist that "structure" refers only to plot architecture (scenes, chapters, causal chains) and excludes grammatical tense, the Future-Perfect Memoir fails the principle. It is a linear narrative told in a specific tense; structurally, it possesses a beginning, middle, and end. To save this verdict, the principle must define "formal logic" to include **grammatical aspect** as a structural constraint equal to plot. If you prefer a strictly plot-based definition of structure, the Future-Perfect Memoir must be reclassified as a *linguistic simulation* of timelessness rather than a *structural instantiation* of it. I recommend accepting the sacrifice of the distinction: in Borges, language *is* structure, and the tense of the narration is as architectural as the ordering of chapters.

  ### Application to the Unsettled Case (The Footnotes)

  **Verdict: Authentic.**

  The **Footnote Case** is a profound formalization of the principle, not an arch exercise.
  *   **Non-Privileged Ordinality:** Footnote numbering conventionally imposes an ordinal hierarchy (1 precedes 2). By having the footnotes cite one another in contradiction to their numbering (e.g., Footnote 5 claims to annotate Footnote 2, which claims to annotate Footnote 5), the text severs the link between numerical position and logical priority.
  *   **Non-Generation:** The reader cannot construct a linear argument. The "meaning" exists only in the web of relations, not in the sequence of reading. There is no "first" footnote to anchor the text, and no "final" footnote to resolve it. It creates a static textual object where time (reading order) is irrelevant to the truth of the apparatus. It satisfies both clauses perfectly.

  ### Application to the Unlisted Scenario (The Polyglot Sentence)

  **Scenario:** *The identical sentence appears on every page, each time rendered in a different language, with no indication of which translation is authoritative and no progression of meaning across the sequence.*

  **Verdict: Authentic (and perhaps the purest instantiation).**

  *   **Non-Privileged Ordinality:** Page 1 (English) holds no ontological priority over Page 50 (Swahili). Without an authoritative original, there is no "source" moment and no "derivative" moments. There is no "present" page that is more real than the others.
  *   **Non-Generation:** Reading Page 2 generates no new narrative state. The semantic content is static. The "progression" of pages is a spatial illusion, not a temporal becoming. The reader moves through space (turning pages) but does not move through time (advancing the story).
  *   **Borgesian Resonance:** This mirrors Borges's assertion in *A New Refutation of Time* that identity persists without duration. If every moment is the *same* moment (the same sentence), then time has not passed. It collapses the narrative into a single, timeless assertion, stripping the "successive duration" you seek to deny.

  ### Summary

  Your intuition traces a coherent line: you are rejecting **Time as Space** (branches, timelines, prefiguration) in favor of **Time as Illusion** (loops, static blocks, recursive webs). The Principle of Non-Privileged Ordinality codifies this by demanding that the narrative machinery itself prevent the reader from establishing a definitive "Before" and "After" that carries causal weight. The Footnote and Polyglot cases both succeed because they make the sequence of reading irrelevant to the truth of the text.
