      *   *Self-Undermining:* The specific concept might be "undermining futures" in Lewis's Humean Supervenience. If the future pattern of events determines the chances, and the future is weird, the chances change. But here, the user means "evidence undermining the chance hypothesis." That's just standard Bayes. I need to clarify the distinction.
