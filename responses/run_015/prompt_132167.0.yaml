answer: |-
  If we take Weber's *The Protestant Ethic and the Spirit of Capitalism* as our starting point, we are looking at a world where work was sacralised. In the Calvinist framework, labour was a 'calling', a way to quell the anxiety of predestination. Idleness was not merely unproductive; it was sinful. Leisure was only permissible insofar as it allowed the body to recover so it could return to the grind. This created the 'iron cage' of capitalism: a system where we work for work's sake, detached from any higher spiritual purpose, yet trapped by the same moral urgency.

  If we flip this script and treat leisure not as the absence of labour, but as a positive moral entitlement in its own right, the entire moral architecture of modern work collapses. Here is how that reframing plays out across the conceptual landscape you have outlined.

  ### The Moral Geography of Work: Japan and France

  When we look at *karoshi* (death by overwork) in Japan through the traditional Weberian lens, it appears as the tragic extreme of the work ethic. The individual is consumed by the calling. In this view, the failure to maintain a work-life balance is often internalised as a personal failing. The worker thinks, 'I could not handle the load,' or 'I was not dedicated enough to manage my time.' It is treated as a deficit of individual resilience or competence. The system remains blameless because the moral imperative to work is unquestioned.

  Contrast this with the French 35-hour week. On the surface, this looks like a standard labour protection, a cap on exploitation to prevent physical exhaustion. However, if we apply your reframing—leisure as a positive moral entitlement—the 35-hour law stops being merely a health and safety regulation. It becomes a legislative defence of human flourishing.

  In this light, the French model is not just saying, 'You will break if you work more.' It is saying, 'You are not fully human if you work more.' It posits that there is a sphere of life outside of economic production that is morally superior, or at least equally necessary, to the sphere of production. By legally mandating this time, the state is effectively secularising the concept of the Sabbath, not for religious observance, but for the preservation of the self.

  ### From Recovery to *Scholē*

  This brings us to the crucial distinction between rest and *scholē*. In the Weberian capitalist model, rest is instrumental. You sleep so you can wake up and work. It is passive recovery.

  The Greek concept of *scholē* is different. It is active, contemplative free time. It is the time required to be a citizen, to think, to engage in politics, art, or philosophy. It is the *purpose* of life, whereas labour was merely the means to secure it.

  If we view the 35-hour week as protecting *scholē* rather than just capping exploitation, the implication is profound. It suggests that the economy exists to serve the citizen's contemplative life, not the other way around. It reframes the law from a negative right (freedom *from* excessive hours) to a positive right (freedom *to* cultivate a self).

  This shifts the debate from economics to ontology. It is no longer about how much output can be squeezed from a worker; it is about what kind of being we are allowing the worker to be. If the 35-hour week is about *scholē*, then violating it is not just an employment dispute; it is a violation of the worker's potentiality as a human being.

  ### The Shift in Blame

  This ontological shift drastically changes how we assign blame for overwork. Under the Protestant Ethic, the 'spirit of capitalism' is internalised. The worker becomes their own overseer. If you burn out, you have failed in your calling. This is why *karoshi* is often treated with a sense of shame or personal tragedy rather than systemic outrage. The moral weight rests on the shoulders of the individual to endure.

  However, if leisure is a moral entitlement akin to *scholē*, then the individual who overworks is not failing morally; they are being *robbed*.

  Imagine if someone stole your money. We would not blame you for not guarding it well enough; we would blame the thief. If time for contemplation and self-development is a moral entitlement, then an employer (or a culture) that demands excessive hours is stealing your capacity to be human. The blame shifts from the individual's lack of resilience to the structure's violation of rights.

  In this framework, the workaholic is not virtuous; they are complicit in their own dehumanisation, but the primary moral culpability lies with the system that makes such compulsion necessary or rewarding. It removes the stigma of 'laziness' from those who protect their leisure and places the stigma of 'tyranny' on those who encroach upon it.

  ### The Thinness of Human Rights Language

  This leads to your question about human rights documentation. Does the current language capture this depth? Generally, no. It is too thin.

  Documents like the Universal Declaration of Human Rights (Article 24) speak of the 'right to rest and leisure'. While this is a vital legal foothold, the language is often framed instrumentally. Rest is frequently contextualised as necessary for health, or leisure as a reward for labour. It lacks the robust moral vocabulary of *scholē*.

  It says you *may* rest, not that you *must* rest to flourish. It treats leisure as a commodity you are entitled to purchase with your labour hours, rather than a fundamental state of being that labour must accommodate. Because the language is thin, it allows employers to comply with the letter of the law (giving you days off) while violating the spirit (expecting you to be mentally available, or ensuring the wages are so low you must take a second job).

  To truly capture the reframing you are suggesting, human rights language would need to evolve from a 'right to rest' to a 'right to temporal autonomy'. It would need to assert that a portion of a human's time is inalienable, not for the sake of the economy's stability, but for the sake of the soul's integrity. Without this thicker moral language, the 'right to rest' remains a loophole-ridden concession rather than a sacred boundary.

  ### Conclusion

  Treating leisure as a positive moral entitlement dismantles the Protestant Ethic's core assertion that work is the primary site of virtue. It suggests that the French 35-hour week is not merely an economic regulator but a guardian of *scholē*, protecting the space where citizenship and humanity actually occur.

  Consequently, *karoshi* ceases to be a story of personal failure and becomes a story of structural theft. The blame moves from the worker who could not cope to the system that demanded they cease to be human. Until our legal and moral language catches up to this distinction—moving from 'rest as recovery' to 'leisure as flourishing'—we remain trapped in Weber's iron cage, merely painting the bars a different colour.
