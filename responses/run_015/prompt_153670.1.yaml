answer: |-
  First off, hang in there. The dissertation grind is real, and running out of coffee mid-thought-experiment is a rite of passage. Your intuitions are probing some really fertile ground here. The tension between McTaggart's idealist metaphysics and the realist assumptions of relativistic physics is often glossed over, so digging into it could be a strong chapter.

  Here's how I think McTaggart would likely respond to your three probes, keeping in mind that his conclusion isn't just "The A-series is false," but rather "Time itself is unreal."

  ### 1. McTaggart vs. Rietdijk-Putnam (RP)
  You hit the nail on the head: McTaggart would likely see the RP argument as **confirming his diagnosis but rejecting the prognosis.**

  The RP argument (and the Andromeda Paradox) is typically wielded by B-theorists to kill the A-series and save the Block Universe. They say, "Relativity shows there's no privileged 'now,' so the A-series is physically groundless; therefore, the B-series (the static block) is all there is."

  McTaggart would agree with the first half: "Yes, the A-series is contradictory and cannot be real." But he would vehemently disagree with the retreat to the B-series. For McTaggart, the B-series (earlier/later relations) *without* the A-series is not time at all; it's just a static ordering, like the number line or a spatial arrangement.

  So, he wouldn't see RP as a "welcome confirmation" of the Block Universe. He'd see it as a physical demonstration of his logical point: that temporal passage cannot be coherently mapped onto reality. He'd argue that the physicists are still clinging to the *concept* of time by calling the B-series "time," whereas RP actually shows that physics describes a timeless manifold. He'd say RP proves that if you look for time in the physical world, you find only space-like relations.

  ### 2. The Consciousness Twist
  This is your strongest angle. If mental states are spacetime events, SR implies my "decision to speak" is past for one observer and present for another.

  McTaggart, being an Absolute Idealist, would likely reject the premise that mental states are *ontologically equivalent* to physical spacetime events. For him, time is a feature of how the Absolute perceives reality, not a feature of reality itself.

  However, if forced to engage with the SR framing: McTaggart would probably argue that **subjective presence is immune to frame-dependence precisely because it is the source of the illusion.**

  He would likely claim that the "specious present" (the felt experience of now) is the very mechanism that generates the A-series contradiction. The fact that SR can slice up that experience differently from the outside doesn't dissolve the subjective feeling; it just highlights the discrepancy between the *appearance* of time (consciousness) and the *structure* of the world (physics).

  He wouldn't say consciousness gets dissolved. He'd say that the *temporal description* of consciousness is what's false. The fact that an alien in Andromeda considers your decision "past" doesn't change your immediate experience of making it. For McTaggart, that immediate experience is the only reason we believe in time at all, even if that belief is mistaken. He might argue that SR exposes the A-series as perspectival, which aligns with his view that time is a mode of perception, not a fundamental category.

  ### 3. Closed Timelike Curves (CTCs)
  This is a fascinating wrinkle. CTCs allow an observer to meet their past self.

  McTaggart would almost certainly read this as a **reductio of the reality of becoming**, rather than a confirmation of the Block.

  His core argument is that time requires change, and change requires the A-series (events shifting from future to present to past). In a CTC, the "past" self is physically co-present with the "future" self. If the A-series were real, the "past" self should be *gone* (ceased to be present). The fact that the "past" is accessible as a location in the manifold suggests that the distinction between past and present is merely spatial/topological.

  McTaggart would argue: "If you can meet your past self, then your past self wasn't truly past. It was just elsewhere in the block." This reinforces his claim that what physics calls "time" is actually just a form of space.

  He wouldn't see CTCs as making temporal change "weird." He'd say CTCs reveal that **there was never any temporal change to begin with.** It's the ultimate confirmation that the B-series is just a static geometry. If time were real (involving genuine becoming), CTCs would be metaphysically impossible because you can't go back to a moment that has ceased to exist. The fact that GR allows them suggests GR is describing a timeless reality, which is exactly McTaggart's conclusion.

  ### Summary for your Diss
  The through-line for your chapter could be this: **Physics (SR/GR) tends to eliminate the A-series to save Time (via the Block), whereas McTaggart eliminates the A-series to eliminate Time.**

  *   **RP Argument:** Physicists say "No global now = Block Universe." McTaggart says "No global now = No Time."
  *   **Consciousness:** Physicists say "Mind is in spacetime." McTaggart says "Spacetime is a representation in Mind."
  *   **CTCs:** Physicists say "Time is topological." McTaggart says "Topology is spatial; therefore, it's not time."

  You're basically arguing that McTaggart would view modern relativistic physics not as a rival to his view, but as an unwitting ally that describes a timeless reality while mistakenly labeling it "spacetime."

  Hope that helps untangle the knot. Go get some more coffee, you're onto something good.
