answer: |-
  Here is a complete design for the workshop session. It is built to be run with minimal tech (paper, envelopes, whiteboard) and tight timekeeping.

  ### Workshop Title: The Opacity of Improvement
  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Goal:** Distinguish between *ex-post* Pareto Improvements (nobody ended up worse) and *Safe* Pareto Improvements (we could know beforehand nobody would be worse).

  ---

  ### 1. Materials & Setup

  **The Snack Fund (Incentive)**
  *   Put $50 cash (or equivalent gift cards) in a clear jar at the front.
  *   **Rule:** The final payout is $5 per person *minus* $1 for every "Hidden Injury" triggered during the game.
  *   **Stakes:** If the group triggers 10 injuries total across all rounds, the fund empties. This aligns individual secrecy with collective loss.

  **The Envelopes (10 Total)**
  Prepare 10 identical opaque envelopes. Inside each, place a slip of paper with three lines:
  1.  **Player ID:** (1 through 10).
  2.  **Public Score:** A number (e.g., "Base: 10").
  3.  **Hidden Clause:** (See Distribution below).

  **The Public Board**
  A whiteboard space to track:
  *   Current Round.
  *   Proposed Policy (written by students).
  *   Public Score Change (calculated by you).
  *   Snack Fund Status (updated only at the very end).

  **The Instructor Key (Do Not Share)**
  A master sheet tracking which Player IDs have active Hidden Clauses per round.

  ---

  ### 2. The Rules (Read Aloud to Class)

  1.  **Objective:** Maximize the Snack Fund by passing redistribution proposals that increase the Group Total Score.
  2.  **Privacy:** Do not open your envelope until the final debrief. Do not show your paper to anyone.
  3.  **Communication:** You may bargain freely. You may state "I am uneasy about this proposal" or "This feels risky." You **cannot** quote your Hidden Clause or reveal your Base Score.
  4.  **Voting:** Proposals require **Unanimous Consent**. One "No" vetoes the deal. Status quo persists if vetoed.
  5.  **The Black Box:** If a proposal passes, the Instructor will announce the *Public Score Change* (which will always be $\ge 0$ for everyone). However, if a proposal triggers a Hidden Clause, a penalty is silently deducted from the Snack Fund. You will not be told who was hurt or why until the end.

  ---

  ### 3. Envelope Distribution & Triggers

  The "Hidden Clause" is a conditional penalty. If the condition is met, that player suffers a "Hidden Injury" (Snack Fund -$1), even if their Public Score goes up.

  **Round 1: The Honeymoon (0 Traps)**
  *   **Distribution:** All 10 envelopes say: *Hidden Clause: None.*
  *   **Goal:** Establish trust. Show that coordination works when the model is complete.

  **Round 2: The Creep (2 Traps)**
  *   **Distribution:**
      *   Players 3 & 7 have: *Hidden Clause: "If the proposal text contains the word 'Equality' or 'Equal', your score crashes."*
      *   Players 1, 2, 4, 5, 6, 8, 9, 10 have: *Hidden Clause: None.*
  *   **Goal:** Introduce semantic risk. The public board shows gains, but the Fund shrinks.

  **Round 3: The Paranoia (4 Traps)**
  *   **Distribution:**
      *   Players 1 & 2: *Trigger: "If total points allocated > 50."*
      *   Players 3 & 7: *Trigger: "If the word 'Equality' is used."* (Carryover)
      *   Players 5 & 9: *Trigger: "If any single player receives > 15 points."*
      *   Players 4, 6, 8, 10: *Hidden Clause: None.*
  *   **Goal:** Overload the verification capacity. Unanimity becomes mathematically difficult without auditing, which is forbidden.

  ---

  ### 4. Session Flow (90 Minutes)

  **0:00 – 0:10: Setup & Round 1**
  *   Hand out envelopes. Emphasize the "Do Not Open" rule.
  *   Explain the Snack Fund.
  *   **Task:** Draft a proposal to redistribute points.
  *   **Outcome:** They will likely draft something simple. You announce "Public Scores: All Green." Vote passes.
  *   **Instructor Action:** Confirm no traps triggered. Fund remains intact.
  *   **Vibe:** Smooth, cooperative rationality.

  **0:10 – 0:25: Round 2**
  *   **Task:** Draft a new proposal to improve the total further.
  *   **Outcome:** Someone suggests a "fair" split. Someone uses the word "Equal."
  *   **Instructor Action:** Announce "Public Scores: All Green." Vote passes (assuming they don't veto).
  *   **The Twist:** Do not update the Fund yet. Just note "Proposal Passed."
  *   **Vibe:** Students feel good, but you (the Instructor) know the Fund just took a $2 hit.

  **0:25 – 0:45: Round 3**
  *   **Task:** Final proposal to maximize the Fund.
  *   **Outcome:** Proposals become verbose to avoid triggers. Someone says, "I feel uneasy about the wording."
  *   **Conflict:** Players 1, 3, 5, 7, 9 are walking on eggshells. They can't say why. They can only veto or express "unease."
  *   **Likely Result:** Either they fail to reach unanimity (Status Quo) OR they pass a convoluted deal that triggers 3-4 traps.
  *   **Vibe:** Exhaustion. Demands to "just show us your envelope" (which you must forbid).

  **0:45 – 1:30: The Reveal & Debrief**
  *   **Step 1 (The Audit):** Have everyone open envelopes. Read the Hidden Clauses aloud.
  *   **Step 2 (The Tally):** Calculate the actual Snack Fund loss based on the proposals passed in Rounds 2 & 3. Reveal the real payout.
  *   **Step 3 (Discussion):** Map the experience to the theory (see below).

  ---

  ### 5. Debrief Guide (Mapping Game to Theory)

  Use this trajectory to steer the conversation from the game mechanics to the philosophy.

  **Phase 1: Public Verifiability (Round 1 vs. Round 3)**
  *   *Question:* "In Round 1, why did you trust the proposal?"
  *   *Lesson:* Because the *model* of the world (the public board) matched the *reality* (the envelopes).
  *   *Concept:* A Safe Pareto Improvement (SPI) requires the utility function to be common knowledge. In Round 3, the utility function was fragmented. You had a Pareto Improvement on the *public model*, but not on the *true model*.

  **Phase 2: Common Knowledge & "Unease" (Round 2)**
  *   *Question:* "In Round 2, the Fund shrank. Did anyone know why?"
  *   *Lesson:* Players 3 & 7 knew *if* they spoke up, they might reveal their clause. They signaled "unease" instead.
  *   *Concept:* Signaling under constraints. "Unease" is cheap talk. SPI requires that the *absence* of injury is common knowledge, not just the absence of objection. Silence $\neq$ Safety.

  **Phase 3: The Cost of Safety (Round 3 Collapse)**
  *   *Question:* "Why did Round 3 feel impossible?"
  *   *Lesson:* To guarantee safety, you needed to audit the envelopes. But the rules (simulating privacy/rights) forbade it.
  *   *Concept:* Transaction Costs of Verification. SPIs are often theoretically possible but pragmatically too expensive to verify. We settle for "likely" improvements rather than "safe" ones.

  ---

  ### 6. Frank Assessment: Limitations & Failure Modes

  Be prepared to address these when they come up. This is where the philosophy deepens.

  **1. The Normative Gap**
  *   *Limitation:* The game assumes we *should* avoid hidden injuries. But in real econ, some argue "caveat emptor." If Player 3 didn't read the fine print, is it really a violation of Pareto?
  *   *Discussion:* SPI assumes a duty of care. Standard PI does not. The game rigs the morality toward safety; real markets might not.

  **2. The Infinite Regress of Trust**
  *   *Limitation:* Even if they *could* audit envelopes in Round 3, how do they know the audit is real? How do they know *I* (the Instructor) aren't lying about the Fund deduction?
  *   *Discussion:* This maps to the "Common Knowledge" problem. To have a true SPI, we need to know that everyone knows that everyone knows the rules are safe. The game stops at level 1 (I know my clause). Real SPIs require level infinity.

  **3. Predictable Failure: The "Detective"**
  *   *Risk:* By Round 2, a sharp student might deduce the trigger (e.g., "Every time we say 'Equal', the fund drops").
  *   *Fallback Rule:** If they explicitly guess the trigger ("Is it the word Equal?"), you must answer: **"I cannot confirm or deny specific mechanisms. That would violate the information asymmetry rule."**
  *   *Why:* This preserves the epistemic uncertainty. If you confirm, the game becomes a puzzle to solve, not a negotiation under uncertainty.

  **4. Predictable Failure: The "Tyrant"**
  *   *Risk:* One student vetoes everything in Round 3 out of spite or risk aversion.
  *   *Fallback:** Remind them that Status Quo yields $0 growth. The Snack Fund only grows on *passed* proposals. If they stall, they actively lose against the baseline. This forces the risk-averse to weigh the cost of inaction.

  **5. The "Unfairness" Complaint**
  *   *Risk:* Players 3 & 7 will feel targeted in Round 2.
  *   *Response:* Lean into it. "This is exactly the point. In standard Pareto analysis, hidden constraints are treated as non-existent. You are experiencing the violence of an incomplete model."

  ### Instructor Cheat Sheet for Timing
  *   **0:00-0:10:** Rules & Envelopes.
  *   **0:10-0:20:** Round 1 (Keep it snappy).
  *   **0:20-0:35:** Round 2 (Let them talk, watch for the word "Equal").
  *   **0:35-0:55:** Round 3 (Let it stall. If they pass a deal quickly, secretly trigger extra penalties to ensure the Fund loss is visible later).
  *   **0:55-1:30:** Reveal & Debrief.

  ### Final Note on "Safety"
  End the session by clarifying that a **Safe Pareto Improvement** isn't just a better outcome; it's a *robust protocol*. The game demonstrates that without transparent preferences (open envelopes) or a trusted oracle (you), "Safety" is an illusion. We are usually trading on *probable* improvements, not *safe* ones. The Snack Fund loss is the tax we pay for that ambiguity.
