  5. Defuse the malfunction worry during the causal-role definition by noting that malfunction is simply a failure to contribute to the specific containing system capacity currently being analyzed.
  6. Engineers will assume the containing system for causal roles is objective, so clarify that the system boundary is often set by the analyst's explanatory interests.
  7. Ask whether a trait fixed by pure drift has a function to test if they grasp the history requirement, and refuse to open the units-of-selection or artifact-function cans despite their inevitable curiosity.
