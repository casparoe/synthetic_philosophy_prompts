prompt: |-
  I chair the investment and analytics group at a regional water utility. Three or four times a year my group is handed the same question in a new costume: before we commit to an expensive and hard-to-reverse capital decision — relining or replacing a stretch of trunk main, adding a treatment stage, relocating a pumping station — should we first buy more information? A condition survey, a short pilot, a hydraulic modelling study, a year of monitoring. Each costs real money, takes months, and freezes the decision while it runs, so the delay is itself part of the price.

  My colleagues reason about this with a slogan I have come to distrust: information is never bad for you. They gesture at the value-of-information theorem usually credited to I. J. Good — roughly, that an agent who maximises expected utility and revises by conditionalisation cannot be made worse off in expectation by a costless observation, since such an agent can always disregard the observation and take whichever act had maximal expected utility beforehand. From this they conclude that any study with a non-zero chance of changing our minds is worth commissioning and that the only open question is whether it is cheap enough.

  I do not think that conclusion follows, and I want a procedure rather than a debate. Please write a decision procedure my group can run on a proposal to buy information ahead of a capital decision, in the order the questions should be asked, with what counts as an adequate answer to each, where it stops with a no, and where it hands the question to a person because it is a question of values rather than fact. Constraints: my team has a good calibrated forecaster, one member who reliably over-reads a single striking data point, an engineering director who treats a pilot as a commitment to scale it up, and a board that must sign off and sometimes ignores what we give it. Nobody on the team will do algebra under time pressure, and there are usually no base rates for the specific asset under the specific street.

  In building the procedure, please deal with at least the following, since these are the places I suspect the slogan is doing work the theorem does not license. First, what has to be true of us, as a decision-making body, for the guarantee to apply at all — in particular whether we can commit in advance to a rule linking each possible result to an action, and whether our actual revision practice is close enough to conditionalisation for the argument to go through. Second, the cases where the value is genuinely zero: results that leave the decision unchanged, but also results that can only bind us through channels that are not the decision, such as a finding that would trigger a regulatory duty or a publication obligation, where the option of simply ignoring what we learn is not available to us. Third, how to value information that is not free and that arrives late, in a form people without formal training can actually run, and what to do when the inputs cannot be estimated. Fourth, the cases where the study changes what we are choosing between or who gets to choose, and where the design of the study determines the answer it will return. Fifth, the fact that waiting is itself a way of acquiring information.

  Then run the finished procedure on three proposals. One: a condition survey of an ageing trunk main before deciding whether to reline it or replace it outright. Two: a twelve-month pilot of a new treatment process before committing to full-scale construction, where the director will read the pilot as approval. Three, and this is the one I expect to dislike: a monitoring programme that would very likely detect a contaminant we cannot prevent and would then be legally obliged to remediate at great cost, where the study changes nothing about the physical outcome. If your procedure tells us not to commission that third study, I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance, and I want the difference between expected value of information and whatever duty to inquire we might have stated explicitly.

  Finally, say plainly what the procedure cannot do, and which steps are judgment wearing a lab coat.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Chair of Investment and Analytics Group at a regional water utility.
      *   **Problem:** Recurring dilemma: Should we buy information (surveys, pilots, studies) before making expensive, irreversible capital decisions?
      *   **Current Culture:** Colleagues rely on the slogan "Information is never bad for you" (based on Good's Value of Information theorem).
      *   **User's Stance:** Skeptical of the slogan's application in the real world. Wants a *procedure*, not a debate.
      *   **Team Constraints:**
          *   Good calibrated forecaster.
          *   One member over-reads single data points.
          *   Engineering Director treats pilots as commitments to scale.
          *   Board sometimes ignores recommendations.
          *   No algebra under time pressure.
          *   No specific base rates for assets.
      *   **Key Theoretical Issues to Address:**
          *   Pre-commitment to action rules (can we actually ignore data?).
          *   Bayesian updating fidelity (do we actually conditionalize?).
          *   Zero value cases (decision doesn't change vs. external obligations).
          *   Cost and Delay (information isn't free or instant).
          *   Endogeneity (study design influences results/choices).
          *   Waiting as information.
      *   **Test Cases:**
          1.  Condition survey (reline vs. replace).
          2.  Treatment pilot (Director bias issue).
          3.  Contaminant monitoring (Legal obligation/Willful ignorance issue).
      *   **Requirement:** Explicitly state limitations and where judgment is disguised as analysis.

  2.  **Deconstruct the "Information is Never Bad" Theorem:**
      *   *Theorem:* Expected Utility of Acting *with* free info $\ge$ Expected Utility of Acting *without* info.
      *   *Assumptions:*
          1.  Info is costless.
          2.  Info is immediate (no delay).
          3.  Agent maximizes expected utility.
          4.  Agent updates via Bayes' rule (conditionalization).
          5.  Agent can ignore info (freedom of action).
          6.  Info doesn't change the state of the world (passive observation).
      *   *Real World Violations:*
          1.  Info costs money.
          2.  Info takes time (delay costs, risk of failure while waiting).
          3.  Humans are biased (over-reading data, political pressure).
          4.  Institutional constraints (regulatory duties, board politics).
          5.  Study design biases outcomes.

  3.  **Drafting the Procedure (The "VOI Stress Test"):**
      *   *Goal:* A checklist that forces the team to confront the assumptions above without requiring algebra.
      *   *Structure:* Sequential gates. If you fail a gate, stop or escalate.
      *   *Tone:* Professional, pragmatic, authoritative but humble about limits.

      *   *Step 1: The Decision Definition.* (Are we clear on what we are deciding?)
      *   *Step 2: The Cost of Waiting.* (Delay is a cost. Is it accounted for?)
      *   *Step 3: The Cost of the Study.* (Direct financial cost.)
      *   *Step 4: The Action Rule.* (Can we pre-commit to ignoring the data if it doesn't change the decision? This addresses the "freedom of action" assumption.)
      *   *Step 5: The Update Fidelity.* (Will we actually interpret the data rationally? Addresses the "over-reader" and "Director" biases.)
      *   *Step 6: External Constraints.* (Regulatory/Legal obligations. Addresses the "must act" issue.)
      *   *Step 7: Study Design Bias.* (Does the method force a result?)
      *   *Step 8: The "Do Nothing" Baseline.* (Is waiting itself the information gathering?)

  4.  **Refining the Steps for the Specific Constraints:**
      *   *No Algebra:* Use qualitative thresholds or "Fermi estimate" style questions.
      *   *Team Quirks:* Explicitly call out the "over-reader" and the "Director."
      *   *Board Reality:* Acknowledge that the Board might override.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Trunk Main Survey):* Standard VOI. Likely pass if cost is low relative to asset risk, but check for delay costs.
      *   *Case 2 (Treatment Pilot):* High risk of failure due to Director's bias (pilot = commitment). This violates the "freedom of action" assumption. Procedure should flag this.
      *   *Case 3 (Contaminant Monitoring):* The ethical/legal trap. VOI says "don't look if you won't act," but Duty of Care says "look." The procedure must distinguish *Economic VOI* from *Compliance/Ethical Duty*.

  6.  **Addressing the "Willful Ignorance" Question:**
      *   This is crucial. The user asks if saying "no" to the third study is correct or just licensing ignorance.
      *   *Answer:* It is correct *economically*, but potentially illegal/unethical *regulatorily*. The procedure must separate "Investment Decision" from "Compliance Obligation." If the law says "monitor," VOI is irrelevant. If the law says "if you know, fix," then VOI applies to the decision to monitor. I need to be precise here.

  7.  **Final Review against Constraints:**
      *   Did I cover the 5 specific theoretical points requested? (Commitment, Zero Value, Cost/Time, Study Design, Waiting). Yes, woven into the steps.
      *   Did I run the 3 proposals? Yes.
      *   Did I state limitations? Yes.
      *   Is it algebra-free? Yes, focused on logic and pre-commitment.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the validity of the skepticism. Good's theorem is a bound, not a strategy.
      *   *Procedure:* Name it something practical. "The Pre-Study Gate Review."
      *   *Steps:* Make them binary (Yes/No/Escalate).
      *   *Case Studies:* Apply the steps rigorously.
      *   *Ethical/Legal Distinction:* Make sure the distinction between *value* and *duty* is sharp in Case 3.
      *   *Limitations:* Be honest about where the procedure is just formalized intuition.

      *(Self-Correction during drafting)*: I initially thought about putting the "Board" issue in Step 4. But it's more about whether the decision *sticks*. If the Board ignores the recommendation, the VOI is wasted. I need a step on "Decision Authority."
      *(Refinement on Case 3)*: If the utility has a legal duty to monitor, the VOI calculation is moot. If they *don't* have a duty, but *would* have a duty if they found it, that's the "Strategic Ignorance" problem. I need to clarify that the procedure calculates *financial* value, not *legal* safety. The user needs to know that passing the procedure doesn't mean it's legal to skip.

      *(Refinement on Team Quirks)*: I need to explicitly mention how to handle the "over-reader" and the "Director" in the procedure steps. For example, Step 5 should ask: "Who interprets the data, and have we bound their hands?"

  9.  **Final Polish:** Ensure the tone matches a Chair speaking to a technical group. Serious, precise, slightly weary of corporate slogans. (Proceed to generate output).

  10. **Post-Generation Check:** Did I answer the specific question about Case 3? "I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance." I need to be very clear that VOI is for *resource allocation*, not *regulatory compliance*. If the duty exists, VOI is the wrong tool. If the duty is triggered by knowledge, VOI is the right tool, but "wilful ignorance" is a legal/ethical risk, not a mathematical one. I will make this distinction the core of the Case 3 analysis.

  11. **Final Structure:**
      *   Preamble: Validating the skepticism.
      *   The Procedure (The "Pre-Study Gate").
      *   Application to the Three Proposals.
      *   The "Wilful Ignorance" Question (Case 3 deep dive).
      *   Limitations & "Judgment in a Lab Coat."

  (Ready to write.)
answer: |-
  ### Preamble: The Theorem vs. The Utility

  You are right to distrust the slogan. I. J. Good's theorem holds for a Bayesian agent with costless, immediate information who is free to ignore the result and whose utility function remains static. Your utility is a regulated monopoly with political oversight, human biases, time delays, and legal duties. In your environment, information is often *expensive*, *slow*, *binding*, and *dangerous*.

  The following procedure is not a calculation of Expected Value of Information (EVI). It is a **Pre-Study Gate Review**. It is designed to be run in a meeting, without algebra, to expose where the theoretical guarantees of VOI break down in your specific operational context.

  ---

  ### The Pre-Study Gate Review

  **Instruction:** For any proposal to commission a study, survey, or pilot prior to a capital decision, answer the following six questions in order. If any answer is **NO**, the proposal stops unless escalated to the Board with a specific waiver. If any answer requires a value judgment rather than a factual one, it must be flagged for the Chair (you).

  #### Gate 1: The Decision Stability Test
  **Question:** If the study returns a result that favors the *status quo* or the *cheaper option*, is the team institutionally capable of accepting that result and cancelling the expensive project?
  *   **Adequate Answer:** "Yes. We have a pre-agreed threshold (e.g., probability of failure > X%) below which we do not proceed, and the Engineering Director and Board have acknowledged this threshold in writing."
  *   **Inadequate Answer:** "We will see what the data says," or "The Director feels the pilot is necessary to prove the concept."
  *   **Stop Condition:** If the Engineering Director treats the study as a *commitment to build* regardless of the outcome, the study has negative value. It is a sunk cost disguised as research. **Stop.**

  #### Gate 2: The Delay Cost Test
  **Question:** Does the time taken to acquire the information introduce a risk or cost greater than the potential saving from a better decision?
  *   **Adequate Answer:** "The study takes 3 months. The risk of main burst in that window is $X. The delay cost is $Y. Total delay cost is less than the maximum possible saving from avoiding the wrong capital choice."
  *   **Inadequate Answer:** "Time is money, but we don't know how much," or "We can't estimate the burst risk."
  *   **Stop Condition:** If the calibrated forecaster cannot produce a rough order-of-magnitude estimate for the cost of delay (including risk of failure while waiting), you cannot value the information. **Stop.**

  #### Gate 3: The Interpretation Fidelity Test
  **Question:** Who interprets the data, and have we neutralized known biases?
  *   **Adequate Answer:** "The calibrated forecaster will interpret the data using a pre-specified model. The member prone to over-reading single points is excluded from the analysis phase."
  *   **Inadequate Answer:** "We will discuss the results as a team," or "The engineer who designed the pilot will analyze the performance."
  *   **Stop Condition:** If the person with a stake in the outcome (e.g., the proponent of the new treatment) controls the interpretation, the information is corrupted. **Stop.**

  #### Gate 4: The External Constraint Test
  **Question:** Are there regulatory, legal, or public obligations triggered *solely by the act of knowing*, regardless of our economic preference?
  *   **Adequate Answer:** "No. We are not legally required to monitor this parameter. If we find it, we are not automatically compelled to remediate beyond current standards."
  *   **Inadequate Answer:** "If we find it, we *should* fix it," or "The regulator might ask why we looked if we didn't intend to act."
  *   **Escalation Point:** If the answer implies a legal duty to remediate upon knowledge, this is not an investment decision; it is a compliance decision. **Escalate to Legal/Chair.** Do not use VOI logic here.

  #### Gate 5: The Design Endogeneity Test
  **Question:** Does the design of the study predetermine the conclusion or change the options available?
  *   **Adequate Answer:** "The pilot is run at laboratory scale. It does not require permanent infrastructure. The options remain 'Build' or 'Don't Build'."
  *   **Inadequate Answer:** "The pilot requires installing half the final equipment," or "The study only measures parameters where the new technology excels."
  *   **Stop Condition:** If the study creates a sunk cost that forces the hand (the "foot-in-the-door" technique), it is not information gathering; it is project initiation. **Stop.**

  #### Gate 6: The "Wait and See" Test
  **Question:** Is passive waiting a superior information-gathering strategy?
  *   **Adequate Answer:** "No. The uncertainty will not resolve itself naturally in the decision window," or "The cost of failure while waiting is too high."
  *   **Inadequate Answer:** "We could just monitor for a year," (without comparing cost to active study).
  *   **Stop Condition:** If a cheaper, passive monitoring strategy yields similar information, the active study is inefficient. **Stop.**

  ---

  ### Application to Proposals

  Here is how the procedure runs on your three specific cases.

  #### Proposal 1: Condition Survey of Ageing Trunk Main
  *Context: Decide between relining (cheaper, shorter life) or replacing (expensive, permanent).*

  1.  **Decision Stability:** Can we choose relining even if the survey shows some corrosion? **Yes**, provided it is below a threshold.
  2.  **Delay Cost:** Does a 2-month survey risk a burst? **Low risk.** Main is currently stable. Delay cost is low.
  3.  **Interpretation:** Who reads the survey? **Risk:** If the engineering team wants a replacement to boost capex spend, they may over-read defects. **Mitigation:** Calibrated forecaster sets the threshold *before* the survey.
  4.  **External Constraints:** Any regulatory duty? **No.**
  5.  **Design Endogeneity:** Does the survey damage the pipe? **Minimal.**
  6.  **Wait and See:** Can we wait? **No,** risk of catastrophic failure is the driver.

  **Verdict:** **PROCEED**, conditional on pre-setting the failure threshold. The VOI theorem holds reasonably well here because the decision is technical, the costs are contained, and the "ignore" option is viable.

  #### Proposal 2: Twelve-Month Treatment Pilot
  *Context: New treatment process. Engineering Director treats pilot as approval to scale.*

  1.  **Decision Stability:** Can we cancel the project if the pilot fails? **NO.** The Engineering Director views the pilot as a commitment.
  2.  **Delay Cost:** 12 months is significant.
  3.  **Interpretation:** Who analyzes? **High Risk.** The Director is invested.
  4.  **External Constraints:** None.
  5.  **Design Endogeneity:** **CRITICAL FAIL.** A pilot of this scale likely creates political and operational momentum that makes cancellation impossible, regardless of data.
  6.  **Wait and See:** N/A.

  **Verdict:** **STOP.** This fails Gate 1 and Gate 5. The study is not information; it is the first phase of construction. By commissioning it, you have already made the capital decision. The VOI is zero because you have removed the option to *not* act.
  **Action:** Reframe the proposal. If it is a capital project, fund it as such. Do not label it "research" to bypass investment scrutiny.

  #### Proposal 3: Contaminant Monitoring Programme
  *Context: Likely to detect a contaminant you cannot prevent. Detection triggers legal duty to remediate at great cost. Physical outcome (water quality) does not change based on monitoring.*

  1.  **Decision Stability:** If we find it, do we act? **Yes, legally.**
  2.  **Delay Cost:** N/A.
  3.  **Interpretation:** N/A.
  4.  **External Constraints:** **CRITICAL FAIL.** Finding the contaminant triggers a statutory duty. You cannot "ignore" the observation.
  5.  **Design Endogeneity:** The act of measuring creates the liability.
  6.  **Wait and See:** If you don't look, you don't know. If you don't know, you don't pay.

  **Verdict:** **ESCALATE TO CHAIR/LEGAL.**
  The procedure halts here because this is not a VOI problem. This is a **Duty of Care vs. Strategic Ignorance** problem.

  ---

  ### The "Wilful Ignorance" Question (Proposal 3)

  You asked: *If the procedure tells us not to commission that third study, is that the correct answer or is it licensing wilful ignorance?*

  **The Answer:**
  The procedure correctly identifies that the **Expected Economic Value of Information is Negative.**
  *   **Cost of Study:** $X.
  *   **Value of Better Decision:** $0 (Because you cannot choose *not* to remediate if you find it).
  *   **Cost of Finding:** $Y (Remediation cost).
  *   **Net Value:** $-X - (Probability of Detection * $Y).

  Economically, you are better off not knowing. This is the "Ostrich Effect" formalized.

  **However,** the procedure is an *investment* tool, not a *compliance* or *ethical* tool.
  *   **If there is a legal duty to monitor:** The procedure is irrelevant. You must monitor. The cost is a compliance cost, not an investment.
  *   **If there is a legal duty to remediate *only if known*:** Then the law explicitly incentivizes wilful ignorance. The procedure correctly identifies that looking destroys value.

  **The Distinction:**
  *   **Expected Value of Information (EVI):** Measures the improvement in *decision quality*. If the decision is forced by the information, EVI is zero (or negative, given cost).
  *   **Duty to Inquire:** A legal or ethical obligation to know the state of the world, regardless of whether that knowledge improves a financial decision.

  **Recommendation:**
  Do not use this procedure to justify skipping Proposal 3. Use the procedure to **flag Proposal 3 as a Legal/Ethical Risk.**
  If you skip the study, you are betting that no one else finds the contaminant. If a third party finds it, the utility will be liable for *negligence* for not monitoring, plus the remediation cost.
  **The Procedure says:** "Do not buy this information for *investment purposes*."
  **The Chair says:** "We must buy this information for *liability management*."
  These are different ledger lines. Do not confuse them.

  ---

  ### Limitations: Judgment in a Lab Coat

  You asked for plain speaking on what this procedure cannot do.

  1.  **It Cannot Quantify "Political Capital":**
      The procedure assumes costs are financial. It cannot capture the cost of a Board member looking foolish, or the value of being seen to "do something." Sometimes a study is commissioned not to inform the decision, but to legitimize a decision already made. The procedure will flag this as "Negative VOI," but it cannot stop it if the Board demands legitimacy over efficiency.

  2.  **It Cannot Fix Broken Governance:**
      Gate 1 relies on the Engineering Director agreeing to a pre-set threshold. If the Director reneges when the data arrives, the procedure was right, but the utility is broken. The procedure identifies the risk; it does not mitigate the human element.

  3.  **It Is Not a Legal Shield:**
      As seen in Proposal 3, a negative VOI result is not a defense against regulatory enforcement. "The analytics team said looking was too expensive" is not a valid defense for public health negligence.

  4.  **It Relies on the "Calibrated Forecaster":**
      You have one. If they are unavailable, or if the uncertainty is "Knightian" (unknown unknowns, like a new type of pipe failure with no history), Gate 2 (Delay Cost) becomes a guess. The procedure treats the guess as a fact. That is judgment wearing a lab coat.

  5.  **It Assumes Stationarity:**
      The procedure assumes the world doesn't change while you decide. In a utility, climate change, regulatory shifts, or population growth can change the "correct" decision while you are running the study. The procedure does not account for the value of *flexibility* (Real Options), only the value of *certainty*.

  ### Summary for Your Group

  Tell your colleagues this:
  *"Good's theorem proves that information is never bad for a **disembodied mind** with **no costs** and **total freedom**. We are an embodied utility with **budgets**, **deadlines**, and **regulators**. This procedure does not calculate value. It checks whether the assumptions required to calculate value actually exist. If they don't, we are not buying information; we are buying delay, commitment, or liability."*
