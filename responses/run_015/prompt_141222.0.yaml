  In the town of Oakhaven, the municipal aquifer collapses into permanent salinity if daily extraction exceeds one million gallons, a threshold monitored by a tamper-proof public dashboard that updates in real-time. At 8:00 AM, the dashboard displays that automated irrigation systems from other households have already committed 950,000 gallons for the day, and weather data confirms the remaining manual usage by neighbors will inevitably push the total past the limit regardless of your household's contribution. You decide to run your dishwasher, adding 200 gallons to the flow; your water is physically drawn from the same aquifer and mixes indistinguishably into the total volume that ruins the supply, yet your act is unobserved, alters no disposition, involves no agreement with neighbors, and saves you only the trivial effort of hand-washing.

  **The Check**
  *   **Harm:** Permanent salinity of the town's water supply (threshold-based).
  *   **Operative Quantity:** Total daily groundwater extraction volume.
  *   **Agent's Act:** Running the dishwasher (extracting 200 gallons).
  *   **Relevant Counterfactual:** Had you not run the dishwasher, total extraction would be 1,099,800 gallons; the threshold (1,000,000) would still be crossed, and the aquifer would still collapse.

  **(a) Difference-Making/Expected-Consequences:** You have no reason to refrain. Since you know with certainty that the threshold will be crossed without you, your act changes no outcome. The expected utility of refraining is zero, as the harm is fixed independent of your choice.

  **(b) Complicity:** You have no reason to refrain. There is no joint intention, cooperative scheme, or shared plan. The other contributors are automated systems or uncoordinated neighbors; you are not "joining" a group agent, but merely acting in parallel with strangers.

  **(c) Causal-Contribution:** You *do* have a reason to refrain. Your 200 gallons are physically part of the specific mass of water (the 1.1 million gallons) that constitutes the harmful state of the aquifer. You are a genuine causal participant in the harm, even if you are not a *necessary* condition for it.

  **Verdict**
  Honesty compels the admission that (c) does not fully survive once the four moves are off the table, because the case quietly smuggles the **expected-difference** move back in through the epistemic backdoor. To establish *certainty* that you are not pivotal, the scenario relies on a public dashboard and automated systems. In any truly realistic present-day setting, such information is never 100% certain (sensors fail, plans change), which immediately reopens the expected-utility calculation (there is always a non-zero chance you are the one who tips the scale). However, if we accept the stipulation of certainty as a philosophical given, the "causal contribution" view relies on a notion of causation (membership in a sufficient set) that is metaphysically coherent but morally isolated. It struggles to explain *why* being a redundant part of a cause generates a reason when being a correlated bystander does not, without implicitly appealing to the *character* of being "the sort of person who adds to harms."

  **The Minimal Change & The Difference-Maker's Rebuttal**
  To convert you from a causal contributor into someone causally inert, change the scenario so that your water is drawn from a **separate, private cistern** that feeds into your pipes but does not tap the municipal aquifer. Physically, your dishwasher runs identically; the town's water still turns saline. A difference-making theorist would argue that this change is **morally irrelevant** to the core intuition of the inefficacy objection: in both the original and the modified case, the *harm* (the saline aquifer) occurs exactly the same way regardless of your act. They would argue that "contribution without difference-making" was never the sort of relation that could ground a reason because moral reasons track *responsibility for outcomes*, not merely *physical participation in processes*. If the outcome is fixed, your physical connection to the mechanism is merely a biological or geological fact, not a moral one. This failure suggests your advisor is likely correct: without a difference-making hook, a complicity scheme, or an expressive/character dimension, the intuition that you have a reason to refrain dissolves into a fetishism of causal purity that lacks normative force.
