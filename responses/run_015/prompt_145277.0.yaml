answer: |-
  Here is an audit of the Moral Parliament analogy, structured for your feature.

  ### I. The Explicit Correspondence
  The analogy, most prominently formalized by philosophers like William MacAskill and Ted Lockhart, maps democratic procedure onto moral uncertainty. In the context of an institution (like a foundation board) aggregating the credences of its members into a single decision procedure, the mapping looks like this:

  *   **The Voters/Parties:** The competing moral theories (Utilitarianism, Prioritarianism, Deontology). They do not vote *for* candidates; they *are* the voting blocs.
  *   **Seat Share:** The institution's aggregate credence in each theory. If the board's epistemic state is 40% Utilitarian, 30% Prioritarian, 30% Deontological, the Utilitarian party holds 40% of the seats.
  *   **The Constituency:** The "choice-worthiness" of outcomes. Each theory claims to represent the true interests of this constituency.
  *   **Coalition:** A temporary alignment of theories that agree on a specific action (e.g., Utilitarians and Prioritarians both agree on donating to bed nets, despite disagreeing on *why*).
  *   **Vote-Trading (Logrolling):** Theory A agrees to support Theory B's preferred option on Issue 1 (where A is indifferent but B cares deeply) in exchange for Theory B supporting Theory A's preferred option on Issue 2.
  *   **Legislation:** The final institutional action (the grant made, the policy adopted).
  *   **The Speaker/Whip:** The decision procedure or algorithm that calculates the "expected choice-worthiness" based on the seat shares and enforces the outcome.

  ### II. Where the Mapping Fails
  The analogy is pedagogically potent but metaphysically leaky. The four structural faults you identified are the critical stress points.

  **1. Parties have Interests; Theories have Truth-Conditions**
  In a parliament, parties are self-interested agents seeking power and re-election. They compromise to survive. Moral theories are not agents; they are claims about reality. A Deontological theory does not "want" 30% influence; it claims that certain acts are *forbidden*, full stop.
  *   **The Break:** When a theory accepts a compromise (e.g., "I will allow 10% of the budget to violate constraints in exchange for influence elsewhere"), it is effectively admitting it might be false. But the seat share was assigned *because* we weren't sure if it was false. The parliament requires theories to act *as if* they are false to function, which contradicts the content of the theories themselves.

  **2. The Seat Share Presupposes the Solution (Inter-theoretic Comparison)**
  To assign seats proportional to credence, you must be able to normalize the "intensity" of each theory. If Utilitarianism says "Save 1,000 lives" and Deontology says "Do not lie," how many lives equal one lie?
  *   **The Break:** The parliament analogy assumes we can translate "choice-worthiness" into a common currency (utility units, votes, dollars) to assign seat shares. But the "measurement problem" of moral uncertainty is precisely that we lack this exchange rate. Assigning the seats *requires* solving the problem the parliament was built to bypass. You cannot distribute power without knowing the scale of the power.

  **3. Fairness vs. Correctness**
  Parliaments exist to resolve conflicting *preferences* fairly among persons. Morality seeks the *correct* action regardless of popularity.
  *   **The Break:** If 51% of physicists believe gravity works one way and 49% believe another, we do not vote on the law of gravity. We investigate. The parliament model treats moral truth as a construct of the aggregate credence (constructivism) rather than a discovery (realism). If moral truth is mind-independent, a democratic aggregation of errors is still an error.

  **4. Binding Nature and Coercion**
  Parliamentary output binds the minority party; they must obey the law or face sanction.
  *   **The Break:** In moral uncertainty, the "minority theory" is not a person being coerced; it is a hypothesis about what is right. If the Deontological "party" loses the vote and the institution violates a constraint, the Deontological theory doesn't "accept the loss"; it declares the institution has committed a moral wrong. There is no legitimate authority to overrule a moral constraint, whereas a parliament has legitimate authority to overrule a minority party.

  ### III. The Repetition Wrinkle
  Your interviewee argues the analogy only works over a long sequence of decisions, allowing for logrolling (trading votes across time). Does this save the model?

  **It makes the mechanism workable but exposes the incommensurability flaw.**

  *   **The Improvement:** In a single-shot decision, a theory with 49% credence might be ignored by a 51% majority. Over 1,000 decisions, the 49% theory can demand concessions on issues it cares deeply about in exchange for acquiescence on issues it cares little about. This mathematically smooths the "expected choice-worthiness" calculation.
  *   **The Failure:** This relies entirely on the assumption that moral value is fungible across issues. It fails catastrophically for theories with **agent-relative constraints**.
      *   *Example:* If the Deontological theory holds that "Torture is always forbidden," it cannot trade. It cannot say, "I will allow torture on Issue #5 if you fund animal shelters on Issue #1–4." The constraint is a veto, not a preference.
      *   *Institutional Reality:* Foundations often face "one-shot" existential risks (e.g., AI safety, pandemic prevention). If the decision is singular and high-stakes, the "long sequence" defense vanishes. The parliament reverts to a majority-takes-all vote on existential questions, which reintroduces the dogmatism charge.

  ### IV. The Verdict on Anti-Dogmatism
  Does the conclusion that "hedging is rational and acting on one's favorite theory is dogmatic" survive the audit?

  **The intuition survives; the mechanism does not.**
  The anti-dogmatism conclusion rests on *fallibilism* (I might be wrong), which is sound. However, the Parliament analogy suggests the *method* of avoiding dogmatism is proportional hedging (splitting the budget).
  *   **The Risk:** If the inter-theoretic comparison is impossible (Fault #2), then hedging is not "rational optimization"; it is randomization. Splitting funds 50/50 between Global Health and Animal Welfare might satisfy the "seat shares," but if one theory is objectively true and the other false, you have simply guaranteed you did less good than possible.
  *   **The Carry:** The Parliament analogy was indeed carrying the anti-dogmatism conclusion. It smuggles in the idea that moral theories are *preferences to be satisfied* rather than *claims to be verified*. Once you remove the parliamentary machinery, the obligation to hedge becomes much weaker. You are not obliged to satisfy a false theory; you are only obliged to find the true one.

  ### V. Better Comparisons
  If the Parliament is flawed, what metaphors do the work better for your feature?

  **1. Portfolio Diversification (Financial)**
  *   **The Fit:** Better than parliament for handling risk. You don't know which asset class will win, so you hold both. It captures the "hedging" intuition without implying the assets have voting rights.
  *   **The Limit:** Finance assumes fungibility (money is money). Morality often involves incommensurable values (rights vs. welfare). You can diversify stocks; you cannot easily diversify "violating a right" vs. "saving a life."

  **2. Expert Disagreement (Epistemic)**
  *   **The Fit:** Treats moral theories like competing scientific hypotheses. If engineers disagree on a bridge's load limit, you don't vote; you build to the most robust specification or delay until data improves.
  *   **The Limit:** Morality lacks the empirical feedback loop of engineering. You often cannot wait for data.
  *   **The Upgrade:** **Robust Decision Making.** Instead of maximizing expected value (Parliament), the institution looks for options that are *satisfactory* across all high-credence theories. This avoids the need for precise inter-theoretic comparison. It shifts the goal from "optimizing the aggregate" to "avoiding catastrophic error according to any serious theory."

  **3. Judicial Deliberation (Legal)**
  *   **The Fit:** Judges weigh conflicting precedents and principles. They do not vote by seat share; they argue for the interpretation that best coheres with the whole.
  *   **The Utility:** This captures the *qualitative* nature of moral reasoning. It allows for one theory to override another not because it has more "seats," but because its argument is more weighty in this specific context. It replaces *arithmetic* with *deliberation*.

  ### Summary for the Feature
  The Moral Parliament is a useful heuristic for visualizing moral uncertainty, but it is a **category error**. It treats epistemic problems (which theory is true?) as political problems (how do we share power?). It works best for low-stakes, repeatable decisions involving consequentialist theories. It breaks down on high-stakes, single-shot decisions involving deontological constraints. The anti-dogmatism impulse is correct, but the parliamentary solution risks replacing dogmatism with incoherence. A shift toward **Robust Decision Making** or **Judicial Deliberation** offers a more honest accounting of how institutions actually navigate deep moral disagreement.
