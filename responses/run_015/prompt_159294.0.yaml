  Let's refine the "Feared Question." Is it Non-Identity? Or is it "Why not just use a standard SWF?" The prompt says "I think I know which one it is." Usually, for a transition-based view with path dependence, the Non-Identity problem is the killer because it undermines the comparability of persons across paths. I will bet on that.

  Let's refine the "Crucial Reply." It has to be the distinction between *evaluative space* (end-states) and *decision rule* (transitions). If the economists convince me that end-state SWF is sufficient, the paper dies.

  Let's refine the "Concessions." I need to concede that the counterfactual baseline is politically contestable.

  Okay, ready to write.

  *(Final check on the "No Discounting" point)*: Public finance economists *live* for discount rates. If I say "no discounting," they will tear me apart. I need to answer that carefully. I will frame it as "intergenerational equity constraint" rather than "individual time preference."

  *(Final check on "Maximin over Path")*: This sounds like "consumption smoothing." I should use that language for the economists.

