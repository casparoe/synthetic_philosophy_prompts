  6.  **Refining the Adjudication:**
      *   Make sure to distinguish Galen Strawson (the son, hard incompatibilist) from P.F. Strawson (the father, compatibilist about reactive attitudes). David's Move 6 sounds a bit like the father, but framed as a response to the son.
