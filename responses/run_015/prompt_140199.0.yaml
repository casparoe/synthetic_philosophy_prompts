prompt: |-
  I teach a second-year philosophy of mind seminar — 16 students, one 80-minute slot, no TA — and we just went over Dennett's Quining Qualia. Half the class thinks the argument is a cheap rhetorical trick and half thinks it's obviously right, in the way that usually means nobody has actually understood it. I don't want to do another seminar on it; I want to run something.

  The thing I want them to feel in their hands is the charge that qualia are an incoherent posit: the four properties they're supposed to have — ineffable, intrinsic, private, directly apprehensible — can't be held together, and every move you make to rescue the notion either turns it into something publicly checkable (in which case it isn't the special extra ingredient) or makes it so thin that it does no work anywhere. We also did the Chase and Sanborn bit, the two tasters whose reactions drift apart while nothing about the stuff in the cup changes, and one student made an objection I couldn't shake: that the case only shows we're bad at monitoring changes in our own experience over time, not that there's nothing there being monitored. I'd like the activity to make that escape hatch cost them something rather than me just arguing against it, since I don't think I argued against it very well.

  What I have to work with: instant coffee, paper cups, sugar, salt, a big bag of jelly beans, index cards, a whiteboard, and sixteen people who will absolutely try to game any scoring system I invent.

  So design me a runnable game. Rules, materials, a timeline, and a payoff scheme with small real stakes (the leftover chocolate is fine).

  Constraints I care about:
  - Nobody hears the words ineffable, intrinsic, private, or qualia until the debrief. The four properties have to come apart in what they're trying to do, not in what I say up front.
  - Real private stimuli, real (small) losses, ideally built around taste so it rhymes with Chase and Sanborn. Use near-threshold differences so nobody can just name the flavour and short-circuit the whole thing.
  - A mid-game twist where something changes and the group has to say, from reports alone, whether it was the experience that changed or the reporting — and discovers it can't.
  - A final round where they get to design their own probe to settle that question and then have to bet on it working.

  Then the debreif: map each moment of the game onto one of the four properties and onto the monitoring objection, tell me what will predictably go wrong the first time I run it (I'm expecting cheating, somebody announcing they can't taste anything, and one student who names the moral in round one), and be honest about what the game can't reproduce. My guess is it can show the posit is communicatively and evidentially idle but can't touch the residual conviction that of course there's something it's like — if that's right, tell me how to handle that in the room rather than pretending the game dissolved it. And if taste is the wrong modality for this, say so and give me the version that works instead.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year Philosophy of Mind seminar, 16 students, 80 mins, no TA.
      *   **Topic:** Dennett's "Quining Qualia" (specifically the incoherence of the four properties: ineffable, intrinsic, private, directly apprehensible).
      *   **Problem:** Class is split (cheap trick vs. obvious truth). One student's objection stuck: "Chase & Sanborn just shows we're bad at monitoring, not that there's nothing to monitor."
      *   **Goal:** A runnable *game/activity* (not a lecture) that makes the "incoherence charge" felt physically/practically. Specifically, make the "bad monitoring" escape hatch costly.
      *   **Constraints:**
          *   No jargon (ineffable, intrinsic, private, qualia) until debrief.
          *   Real private stimuli (taste preferred to rhyme with C&S).
          *   Near-threshold differences.
          *   Mid-game twist: Experience vs. Reporting change (indistinguishable).
          *   Final round: Students design a probe, then bet on it.
          *   Stakes: Small (leftover chocolate/candy).
          *   Materials: Instant coffee, paper cups, sugar, salt, jelly beans, index cards, whiteboard.
          *   Anticipated issues: Cheating, "I can't taste anything," premature theorizing.
      *   **Deliverables:** Rules, materials, timeline, payoff scheme, debrief guide (mapping to 4 properties + monitoring objection), troubleshooting (what goes wrong), limitations (what the game *can't* do).

  2.  **Deconstruct the Philosophical Core:**
      *   Dennett's point: Qualia are supposed to be the "what it's like" that is *only* accessible to the subject, undeniable to the subject, and indescribable to others.
      *   The Trap: If you report it, it's public. If you don't report it, it's useless. If your report changes, is it the taste or your memory/judgment?
      *   The Student Objection: "Maybe the qualia stayed the same, but my access to it got fuzzy."
      *   The Counter: If the access is fuzzy enough to be indistinguishable from the qualia changing, then the "qualia" isn't doing the work you think it is. It's epistemically idle.

  3.  **Brainstorming the Activity:**
      *   *Idea 1: Blind Taste Test.* Too simple. People just say "salty" or "sweet."
      *   *Idea 2: Memory Drift.* Have them taste something, wait, taste again. But how to make the "report vs. experience" distinction sharp?
      *   *Idea 3: The "Calibration" Game.* This fits best. We need to create a scenario where their *authority* over their own experience is challenged by the *utility* of their report.
      *   *Mechanism:* Use the Jelly Beans and Coffee. Create a "Standard" and a "Test."
      *   *The Twist:* The "Standard" changes without them knowing, or their ability to compare is compromised.
      *   *The Bet:* They need to wager points/candy on their certainty.

  4.  **Developing the Game Structure ("The Calibration Protocol"):**
      *   **Phase 1: Baseline.** Establish a shared language without using qualia words. Use "Same" or "Different."
      *   **Phase 2: The Drift.** Introduce the Chase & Sanborn dynamic. One person tastes A, then B. Did B change, or did you?
      *   **Phase 3: The Arbitration.** Can an outsider tell?
      *   **Phase 4: The Probe.** Design a test to distinguish "Taste Change" from "Taster Change."

      *Refining for the Prompt's Constraints:*
      *   Need near-threshold. Salt in coffee is good (gross but detectable). Jelly beans are better for subtle flavor differences (e.g., cherry vs. raspberry, or just varying sugar levels). Let's use the Salt/Coffee for the "gross" change and Jelly Beans for the "subtle" change. Actually, the prompt lists instant coffee, sugar, salt, jelly beans. Let's use the Coffee/Salt/Sugar for the main experiment because liquids are easier to standardize in cups than chewing jelly beans simultaneously.
      *   *Correction:* Jelly beans are better for "private" consumption (no watching someone swallow). Coffee is public (watching them drink). Let's use Jelly Beans for the private experience, Coffee for the public demonstration.
      *   *Wait, the prompt says "Real private stimuli... built around taste."* Jelly beans are easier to dose secretly.
      *   *The "Monitoring Objection" Hook:* We need to make them realize that *appealing to their own memory* is the same as *appealing to the stimulus*.

      *Revised Game Concept: "The Black Box Taster"*
      *   Students are paired. One is the "Subject," one is the "Recorder."
      *   Actually, 16 students is a lot for pairs. Let's make it a whole-room game with individual stakes.
      *   **Round 1 (Calibration):** Taste Sample X. Rate it on a scale (1-10).
      *   **Round 2 (The Shift):** Taste Sample Y. Is Y the same as X?
      *   **The Trick:** For half the class, X and Y are identical. For half, Y is slightly different. *But* the Instructor also subtly changes the instructions or the context.
      *   **Better Idea:** The "Telepathic Taster" Protocol.
      *   We need to force the distinction between "It tastes different to me" and "I am reporting differently."
      *   Let's go with a **Signal Detection** framework but disguised.

      *Final Game Design: "The Drift Protocol"*
      *   **Setup:** 3 Solutions (A, B, C).
      *   **A:** Base Coffee.
      *   **B:** Base + Tiny Salt.
      *   **C:** Base + Tiny Sugar.
      *   **Task:** Identify if the second cup matches the first.
      *   **The Twist:** In Round 2, the *definition* of "Match" changes, or the *reference* changes, but the student isn't told.
      *   **Actually, to hit the "Monitoring Objection":** We need to simulate the passage of time and the degradation of memory.
      *   **Let's try this:**
          1.  **Calibration:** Everyone tastes a "Standard" (Jelly Bean 1). They write down a private code for the taste (not "cherry", but a symbol or number).
          2.  **Delay:** 10 minutes of other stuff (or just a distraction task).
          3.  **Test:** Everyone tastes "Test" (Jelly Bean 2).
          4.  **Judgment:** Did the *taste* change, or did *you* change?
          5.  **The Kicker:** The Instructor secretly swaps the Standard for half the class, or changes the Test.
          6.  **The Bet:** They bet candy on whether the *difference* is in the bean or in them.

      *Wait, I need to make the "Monitoring Objection" cost them.*
      If they say "My memory drifted," they lose points if the bean actually changed. If they say "The bean changed," they lose points if it didn't.
      The crucial Dennettian move is: *There is no fact of the matter accessible to you that distinguishes these.*
      So the game must make it impossible to win consistently by appealing to "inner certainty."

      *Let's refine the "Mid-Game Twist".*
      Round 1: Compare Cup 1 to Cup 2. (Identical).
      Round 2: Compare Cup 2 to Cup 3. (Identical).
      Round 3: Compare Cup 1 to Cup 3. (One is slightly different, but which?).
      This creates intransitivity. If 1=2 and 2=3, then 1 should =3. If 1!=3, then either the taste changed or the taster changed.
      This is the "Sorites" aspect of Qualia.

      *Okay, let's lock in the "Intransitivity Game".*
      It directly addresses the "intrinsic" and "directly apprehensible" properties.
      Materials: Coffee, Salt, Sugar.
      Cups: 1, 2, 3.
      1: Base.
      2: Base + threshold salt.
      3: Base + double threshold salt (or just different).
      Wait, if 1 and 2 are indistinguishable, and 2 and 3 are indistinguishable, but 1 and 3 are distinguishable...
      Then "Indistinguishable" is not a transitive relation.
      This attacks the idea that qualia are "directly apprehensible" atomic units.

      *But the prompt asks for the "Monitoring Objection" specifically.*
      Student: "Maybe 1 and 2 *were* different, I just didn't notice."
      Game Response: "Okay, bet on it. If you say you didn't notice, you claim the experience was the same. If you bet 'Different' and you're wrong, you lose."
      We need to make the *authority* of the subject the thing that is wagered.

      *Let's synthesize:*
      **Game Title:** The Calibration Wager.
      **Core Mechanic:** Signal Detection + Betting + Forced Choice.
      **The Trap:** The "Private" nature of the data prevents public verification, making the "Bet" impossible to settle fairly *unless* they admit the report is all that matters.

      *Wait, the prompt wants the "Mid-game twist where something changes and the group has to say, from reports alone, whether it was the experience that changed or the reporting."*
      This is the hardest part. How to do this with 16 students?
      We need a "Control" group and an "Experimental" group, but they don't know which is which.
      Actually, we can use the **Instructor** as the variable.
      Round 1: Instructor pours Cup A. Students taste. Report.
      Round 2: Instructor pours Cup B. Students taste. Report.
      *Secretly:* Cup A and Cup B are identical.
      *Secretly:* Between Round 1 and 2, the Instructor changes the *instruction* slightly (e.g., "Focus on the aftertaste" vs "Focus on the initial hit").
      *Result:* Reports change.
      *Question:* Did the coffee change or the focus change?
      *Answer:* From the reports alone? Impossible to tell.
      *Payoff:* If they bet "Coffee Changed," they lose (because it didn't). If they bet "I Changed," they lose (because they feel sure the coffee changed).
      *Wait, if I know the coffee didn't change, I win.* The students don't know.
      Okay, the *Instructor* knows. The students must bet against the Instructor's log.
      If the Instructor lies, the game breaks. The Instructor must be honest in the debrief.

      *Let's build the "Intransitive Triad" + "Betting" model.*
      This is the strongest philosophical punch.
      1.  **Stimuli:** 3 Coffee solutions.
          *   Alpha: Instant Coffee.
          *   Beta: Alpha + pinch of salt (sub-threshold or just-noticeable).
          *   Gamma: Beta + pinch of salt.
      2.  **Logic:** Alpha ~ Beta (indistinguishable). Beta ~ Gamma (indistinguishable). Alpha != Gamma (distinguishable).
      3.  **The Qualia Claim:** If Qualia are intrinsic and directly apprehensible, Alpha's qualia = Beta's qualia. Beta's qualia = Gamma's qualia. Therefore Alpha's qualia = Gamma's qualia.
      4.  **The Reality:** Alpha != Gamma.
      5.  **The Conclusion:** Either Qualia aren't intrinsic/direct, or "indistinguishable" isn't a reliable guide to "identical."
      6.  **The Monitoring Objection:** "I just wasn't paying attention to Alpha vs Beta."
      7.  **The Cost:** Betting. If they claim "I wasn't paying attention," they admit their "direct apprehension" is fallible. If they claim "They are identical," they lose the bet on Alpha vs Gamma.

      *Refining the "Mid-Game Twist":*
      We need the "Experience vs. Reporting" distinction.
      Let's add a **Memory Delay**.
      Round 1: Taste Alpha. Wait 5 mins. Taste Beta. Compare.
      Round 2: Taste Beta. Wait 5 mins. Taste Gamma. Compare.
      Round 3: Taste Alpha. Wait 5 mins. Taste Gamma. Compare.
      *Twist:* In Round 3, the Instructor secretly serves Alpha *again* instead of Gamma (or vice versa) to check consistency.
      No, that's too complex to manage with 16 cups.

      *Let's go with the "Secret Instruction Change" Twist.*
      This hits the "Reporting vs. Experience" hard.
      **Round 1:** Taste Cup 1. Rate intensity 1-10.
      **Round 2:** Taste Cup 2 (Identical to 1). Rate intensity 1-10.
      **Twist:** Between 1 and 2, tell half the class "Focus on bitterness" and half "Focus on aroma."
      **Outcome:** Ratings will diverge.
      **Question:** Did the *experience* change or just the *report*?
      **Dennett's Point:** You can't tell. And if you can't tell, the "experience" (qualia) is doing no work distinct from the "report" (judgment).

      *Okay, I have the pieces. Now to assemble into a tight 80-minute plan.*
      *   **Intro (5 mins):** Setup, no jargon.
      *   **Phase 1: The Baseline (15 mins).** Simple discrimination. Establish stakes.
      *   **Phase 2: The Drift (25 mins).** The Intransitivity + Memory Delay.
      *   **Phase 3: The Twist (20 mins).** The Instruction Change (Report vs. Experience).
      *   **Phase 4: The Probe Design & Bet (10 mins).**
      *   **Debrief (15 mins).** Mapping to Dennett.

      *Wait, I need to ensure the "Monitoring Objection" is addressed.*
      The student said: "Chase & Sanborn just shows we're bad at monitoring."
      The game needs to show: "Being bad at monitoring *is* the same as the qualia not being there."
      How? By making the "Monitoring" the only data we have. If the monitoring fails, there is no residual "thing" left to point to.
      The Betting mechanism enforces this. If you say "There was a difference but I missed it," you are betting on a ghost. You lose candy.

      *Materials Check:*
      *   Instant coffee (make a big batch).
      *   Salt/Sugar (for variations).
      *   Jelly beans (for the final bet/prize).
      *   Cups (lots of them).
      *   Index cards (for private bets/reports).
      *   Whiteboard (tracking scores).

      *Stakes:*
      *   Start with 5 Jelly Beans each.
      *   Lose beans for incorrect bets.
      *   Win beans for correct bets (from the pot/instructor).
      *   Final round: All-in.

      *Potential Pitfalls:*
      *   **Cheating:** Students comparing answers. *Fix:* Index cards folded, collected immediately.
      *   **"I can't taste anything":** *Fix:* Make the base coffee strong enough. Have a "screening" cup first. If they can't taste the screening cup, they sit out (or act as recorders).
      *   **Premature Theorizing:** *Fix:* Strict "No talking about *why*" rule until debrief. Only "Same/Different" or Numbers.
      *   **The "Moral" Student:** *Fix:* Acknowledge them, but park their point on the board as "Hypothesis X" to be tested.

      *Debrief Mapping:*
      *   Ineffable -> The inability to describe *why* the rating changed in Phase 3.
      *   Intrinsic -> The Intransitivity in Phase 2 (A=B, B=C, A!=C).
      *   Private -> The fact that no one else can verify their bet.
      *   Directly Apprehensible -> The failure of certainty in the Betting rounds.
      *   Monitoring Objection -> Addressed in Phase 3 (Report change vs. Experience change).

      *Honest Limitation:*
      *   The game shows epistemic access is flawed. It doesn't prove ontological non-existence. A hardline realist will say "The qualia were there, you just couldn't measure them."
      *   *Response:* Dennett's point is that a posit that *cannot* be measured even in principle is empty. The game makes them feel the emptiness.

      *Let's write the plan.*
      *   **Title:** The Calibration Wager.
      *   **Timeline:** 80 mins.
      *   **Materials:** Detailed prep.
      *   **Rules:** Clear, strict.
      *   **Debrief:** Scripted key points.

      *Self-Correction on "Mid-Game Twist":*
      The prompt asks: "A mid-game twist where something changes and the group has to say, from reports alone, whether it was the experience that changed or the reporting — and discovers it can't."
      My "Instruction Change" idea works for this.
      Round 1: Taste Coffee. Rate 1-10.
      Round 2: Taste *Same* Coffee. Rate 1-10.
      *Secret:* Half the class gets a card saying "Rate based on *heat*." Half gets "Rate based on *bitterness*."
      *Result:* Scores diverge.
      *Question:* Did the coffee change? No. Did the experience change? Maybe. Did the reporting criteria change? Yes.
      *Can they tell the difference between "Experience Changed" and "Reporting Criteria Changed" from the inside?* No.
      *This is the gold.*

      *Final check on constraints:*
      *   No jargon until debrief. (Check)
      *   Real private stimuli. (Check, tasting is private).
      *   Near-threshold. (Check, salt in coffee).
      *   Mid-game twist. (Check, instruction change).
      *   Final round probe design. (Check).
      *   Stakes. (Check, jelly beans).
      *   Troubleshooting. (Check).

      *Let's flesh out the "Probe Design" round.*
      They need to design a probe to settle "Experience vs. Reporting."
      Most will suggest "Brain Scan" or "Ask them again."
      The point is to show *any* probe relies on *more reporting*.
      I need to make sure they bet on it working.
      If they bet "Brain Scan will tell us," and I say "Brain scan shows neural activity, but does that map to *experience* or *reporting*?" -> They lose the bet because the probe fails to distinguish the philosophical categories.
      Actually, I should let them design it, then reveal in the debrief why it fails. The bet is on whether *they think* it will work.
      Better: They bet on whether *their* probe would settle the dispute in a hypothetical scenario.
      Okay, I'll structure it so they propose a method, then we vote on its efficacy.

      *Wait, one more thing:* The "Monitoring Objection" needs to cost them.
      In Phase 2 (Intransitivity), if they say "A and B are the same," but later distinguish A and C (where C is barely different from B), they are forced to admit their "monitoring" of A vs B was imperfect.
      If they admit monitoring is imperfect, they lose the "Directly Apprehensible" stake.
      I will make the betting explicit on "Certainty."
      "How certain are you? 100%? Bet 5 beans. 50%? Bet 2 beans."
      If they claim 100% certainty and are wrong, they lose big. This punishes the "I know what I experience" claim.

      *Okay, ready to draft.*
answer: |-
  # Activity Plan: The Calibration Wager

  **Time:** 80 Minutes
  **Students:** 16
  **Materials:**
  *   **Stimuli:** 1 large thermos of strong instant coffee (Solution Z). 1 thermos of Solution Z + 1.5g Salt/L (Solution Y). 1 thermos of Solution Z + 3.0g Salt/L (Solution X). *Pre-test these to ensure Z vs Y is near-threshold, Y vs X is near-threshold, but Z vs X is detectable.*
  *   **Consumables:** 16 small paper cups per solution (48 total), labeled secretly on the bottom (X, Y, Z). Jelly beans (currency).
  *   **Stationery:** 32 Index cards (2 per student), pens, whiteboard.
  *   **Stakes:** A bowl of jelly beans (approx. 200).

  **Golden Rule:** Until the final 15 minutes, no one may use words like *feel, experience, seem, qualia, mind,* or *consciousness*. You may only talk about *samples, reports, ratings,* and *matches*. Violation costs 2 jelly beans.

  ---

  ## Timeline & Procedure

  ### 0:00 – 0:10 | Setup & Endowment
  1.  **Endowment:** Give every student 5 jelly beans. This is their bankroll.
  2.  **The Contract:** Explain that this is a calibration exercise for sensory reporting. Accuracy is rewarded; overconfidence is penalized.
  3.  **The Rule:** "You will taste samples. You will record private reports. You will wager beans on the consistency of those reports. Do not discuss your tastes with neighbors."
  4.  **Screening:** Hand out a "Control Cup" (Solution X). Ask: "Can you taste salt?" If a student says "No," they are moved to the "Recorder" role (they manage cards for others) so they aren't excluded, but don't skew data. (Hopefully, none fail).

  ### 0:10 – 0:30 | Phase 1: The Intransitivity Trap (15 mins)
  *Goal: Attack "Intrinsic" and "Directly Apprehensible."*

  1.  **Pairing:** Students work individually, but submit cards in pairs (Partner A & B) to prevent total isolation panic.
  2.  **Trial 1:** Serve Cup 1 (Solution Z). Wait 2 mins. Serve Cup 2 (Solution Y).
      *   **Task:** On Card 1, write: **SAME** or **DIFFERENT**.
      *   **Wager:** Bet 1 bean if you are "Sure," 3 beans if you are "Certain." (If you bet 3 and are wrong, you lose 3. If right, you win 1 from the pot).
      *   *Expected Result:* Most will say SAME. The difference is near-threshold.
  3.  **Trial 2:** Serve Cup 2 (Solution Y). Wait 2 mins. Serve Cup 3 (Solution X).
      *   **Task:** Card 2: **SAME** or **DIFFERENT**.
      *   **Wager:** Same stakes.
      *   *Expected Result:* Most will say SAME.
  4.  **Trial 3:** Serve Cup 1 (Solution Z). Wait 2 mins. Serve Cup 3 (Solution X).
      *   **Task:** Card 3: **SAME** or **DIFFERENT**.
      *   **Wager:** Same stakes.
      *   *Expected Result:* Most will say DIFFERENT.
  5.  **Settlement:** Reveal the solutions (Z, Y, X).
      *   If they said SAME on 1 & 2, and SAME on 2 & 3, logic dictates 1 & 3 should be SAME.
      *   If they said DIFFERENT on 1 & 3, they were inconsistent.
      *   **Payoff:** Anyone who bet "Certain" (3 beans) on a SAME judgment in Trials 1 or 2 loses their wager *if* they correctly identified Trial 3 as Different. (Why? Because their certainty in 1 & 2 was epistemically unjustified given the result of 3).
      *   *Philosophical Payoff:* Their "direct apprehension" failed to track the intrinsic properties of the liquid.

  ### 0:30 – 0:50 | Phase 2: The Drift (20 mins)
  *Goal: Attack "Private" and the "Monitoring Objection." This is the core twist.*

  1.  **Setup:** Tell them: "We are testing memory stability. You will taste a Reference, wait, then taste a Target."
  2.  **The Secret Split:** Hand out Index Cards face down.
      *   **Group A (8 students):** Card says "Focus on **BITTERNESS**."
      *   **Group B (8 students):** Card says "Focus on **AFTER-TASTE**."
      *   *Constraint:* They cannot show the card. They must follow the instruction silently.
  3.  **The Stimulus:** Everyone tastes **Cup 4 (Solution Z)**.
      *   Wait 5 minutes. (Fill this time by collecting Phase 1 bets and shuffling jelly beans).
      *   Everyone tastes **Cup 5 (Solution Z)**. *It is identical to Cup 4.*
  4.  **The Report:** On Card 4, rate the "Intensity of the Target" on a scale of 1–10 compared to the Reference (where Reference = 5).
  5.  **The Reveal:** Plot the scores on the whiteboard. Group A's scores will cluster differently than Group B's (e.g., Bitterness might rate higher than After-taste, or vice versa).
  6.  **The Question:** Ask the room: "The liquid was identical. The scores diverged. Did the **experience** change, or did the **reporting** change?"
  7.  **The Wager:** Students must bet 2 beans on one answer: **EXPERIENCE** or **REPORTING**.
      *   *The Trap:* If they bet **EXPERIENCE**, they are claiming the liquid's identity doesn't fix the experience (qualia are unstable). If they bet **REPORTING**, they are admitting they cannot distinguish a change in judgment from a change in sensation.
      *   *Settlement:* Tell them: "There is no correct answer recorded in the room. The pot holds the beans. No one wins this bet yet." (This creates the tension for the debrief).

  ### 0:50 – 1:00 | Phase 3: The Probe Design (10 mins)
  *Goal: Force them to realize no third-person probe settles the first-person dispute.*

  1.  **Task:** In their pairs, design a "Probe" that could settle the Phase 2 bet (Experience vs. Reporting).
  2.  **Constraint:** The probe cannot rely on asking the subject again (no "Are you sure?").
  3.  **Examples they might give:** fMRI, Reaction Time, Pupil Dilation, Forced Choice over 100 trials.
  4.  **The Final Bet:** Each pair writes their Probe on the board. They must wager their *remaining* jelly beans on whether this Probe would definitively settle the question *without interpreting the subject's report.*
  5.  **Collection:** Collect all bets. Do not settle them.

  ### 1:00 – 1:15 | Debrief (15 mins)
  *Goal: Map the game to Dennett.*

  1.  **Settle the Bets:**
      *   **Phase 1:** Explain that "Indistinguishable" is not transitive. If Qualia were intrinsic and directly apprehensible, A=B and B=C implies A=C. The fact that it doesn't means "Direct Apprehension" is a myth.
      *   **Phase 2:** Reveal the Instruction Split. "Did the experience change?" Dennett says: **It doesn't matter.** If you cannot distinguish a change in experience from a change in reporting criteria, the posit "Experience" is doing no work. It is *epistemically idle*.
      *   **Phase 3:** Look at their Probes. fMRI? That measures brain states, not *qualia*. Reaction time? That measures behavior. Every probe turns the "private" into the "public," thereby destroying the very thing (privacy) they were trying to measure.
  2.  **The Vocabulary Drop:** Now you can use the words.
      *   **Ineffable:** Phase 2 (couldn't say *why* the rating changed).
      *   **Intrinsic:** Phase 1 (Z and Y weren't intrinsically different enough to guarantee a match).
      *   **Private:** Phase 2 (only you saw your card, but that privacy made verification impossible).
      *   **Directly Apprehensible:** Phase 1 (Certainty wagers were lost).
  3.  **Addressing the Monitoring Objection:**
      *   Recall the student who said: "Chase & Sanborn just shows we're bad at monitoring."
      *   **Response:** "In Phase 1, you *were* bad at monitoring. You lost beans for it. Dennett's point is: If the monitoring is all the access you have, and the monitoring is flawed, what is the 'thing' you are monitoring? If you say 'The Qualia,' you are positing a ghost that hides whenever you shine a light on it. The game made that ghost cost you jelly beans."

  ### 1:15 – 1:20 | Payout & Dismissal
  *   Count remaining beans.
  *   Top 3 scores get a "Philosophical Immunity" pass (skip one reading response).
  *   Everyone else keeps their beans.
  *   Dismiss.

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "I Can't Taste Anything" Student**
  *   **Prediction:** One student will claim the coffee is all the same to protect their beans or due to low sensitivity.
  *   **Fix:** The Screening Cup (Solution X) at the start. If they pass that, they must play. If they claim "It all tastes like water" during Phase 1, they are moved to "Recorder" duty. They still participate in the logic (recording data) but don't bet on taste. This isolates the variable without shaming them.

  **2. The "Moral of the Story" Student**
  *   **Prediction:** Someone shouts "It's all just behavior!" in Round 1.
  *   **Fix:** Enforce the Golden Rule strictly. "That's a Theory. We are collecting Data. Put a bean in the pot for theorizing early." Use the penalty to keep the phenomenological tension alive. Let them be right in the debrief, not the demo.

  **3. Cheating/Collusion**
  *   **Prediction:** Students comparing cards during the 5-minute wait in Phase 2.
  *   **Fix:** Collect Card 1 before distributing Card 2 instructions. During the wait, require "Silent Reflection." Walk around. The stakes (beans) are low enough that hard cheating is unlikely, but social comparison is high. Frame it as "Calibration requires independent data."

  **4. The "Realist" Holdout**
  *   **Prediction:** In the debrief, a student insists, "But I *know* I felt the bitterness change. The scan would show it."
  *   **Fix:** Don't argue. Agree. "Okay, assume you're right. The scan shows neural activity N. How do you know N maps to *Bitterness* and not *Reporting Bitterness*? You need a report to calibrate the scan. The report is the bottleneck. The qualia is the ghost in the machine."

  ---

  ## Limitations: What This Game Cannot Do

  **1. It cannot dissolve the "What It's Like" intuition.**
  *   **Honesty:** A student will leave thinking, "Okay, I can't measure it, but it still *feels* like there's something there." The game demonstrates *epistemic* incoherence (we can't know/talk about it), not *ontological* impossibility (it doesn't exist).
  *   **Handling it:** Acknowledge this. "Dennett isn't trying to numb your feelings. He's trying to show that building a *theory* on those feelings is like building a house on fog. You can feel the fog, but you can't lay bricks on it."

  **2. Taste is subjective and physiological.**
  *   **Honesty:** Taste buds vary. Some students genuinely have different sensitivities (supertasters). This introduces noise that might look like "qualia drift."
  *   **Handling it:** Use the Group A/B split in Phase 2 to control for this. Since both groups taste the *same* liquid, physiological differences should average out. The divergence comes from the *instruction*, not the tongue.

  **3. It relies on the Instructor's honesty.**
  *   **Honesty:** In Phase 2, you claim the cups are identical. If they suspect you swapped them, the lesson fails.
  *   **Handling it:** Pour the cups in front of them from the same thermos if possible, or seal the thermos. Trust is the medium of exchange here.

  ## Why This Works for Your Constraints
  *   **No Jargon:** The rules force them to operate on the *structure* of the argument without the safety net of the terminology.
  *   **Monitoring Objection Cost:** By wagering beans on "Certainty" in Phase 1, they literally pay for the assumption that their monitoring is perfect. When they lose, the objection loses its free ride.
  *   **Experience vs. Reporting:** Phase 2 makes this indistinguishable by design. They *feel* the divergence but cannot locate its source.
  *   **Taste Modality:** It rhymes with Chase & Sanborn. It's private, immediate, and hard to describe (ineffable), making it the perfect trap.

  **Final Note:** Bring extra jelly beans. Philosophy makes people hungry, and losing bets makes them grumpy. Sugar helps the medicine go down.
