answer: |-
  **Preamble on Textual Fidelity**
  Your reading is philosophically fertile, but there is a slight exegetical risk to flag. Turing explicitly presents the child-machine scenario as a *method* for achieving the performance criterion, not necessarily as a second *criterion* for intelligence. Your project's success depends on arguing that the method entails normative commitments that function as a criterion, rather than proving Turing explicitly stated as much. This is a defensible philosophical move, but you must avoid attributing a contradiction to Turing where he might have seen only a means-end relationship.

  **Alternative Framings**
  1.  **The Exegetical Consistency Frame:** Focus on whether Turing contradicts himself between Section 1 (the Test) and Section 7 (Learning). *Attractive:* It grounds the project firmly in the text, minimizing speculation.
  2.  **The Historical Context Frame:** Situate the "education" talk within 1950s cybernetics and behaviorism to explain why Turing thought reward/punishment was sufficient. *Attractive:* It explains the "why," but risks drifting into history of science rather than philosophy of mind.
  3.  **The Epistemic Labor Frame:** Analyze the "curriculum bottleneck" as a problem of where the intelligence resides: in the learner or the teacher. *Attractive:* It turns an engineering detail into a core philosophical problem about the prerequisites of learning.
  4.  **The Modal Capacity Frame:** Argue that Turing is shifting from a synchronic definition of intelligence to a diachronic one (what a system *can become* vs. what it *is*). *Attractive:* It connects to contemporary dispositional accounts of mind.

  **Selection and Rejection**
  I commit to the **Epistemic Labor Frame**. The Exegetical frame is too narrow for a fellowship that wants conceptual innovation; the Historical frame violates your "no archival work" constraint and bores generalists; the Modal Capacity frame is promising but risks becoming too abstract and losing the specific hook of the "teacher." The Epistemic Labor frame is most tractable because it isolates a specific tension (who knows what?) that allows for a determinate argument within 18,000 words. It transforms your friend's dismissal ("just engineering") into the very objection you will test: if the teacher must possess the intelligence, has the machine gained anything?

  ***

  **Project Proposal: The Curriculum Bottleneck in Turing's Learning Machines**

  **Statement of the Question**
  Does the developmental account of machine intelligence in Turing's 1950 paper function merely as an instrumental strategy for passing the Imitation Game, or does it impose an independent, necessary condition on intelligence that the Game alone cannot capture? Specifically, does the requirement for a teacher possessing a curriculum reintroduce the theory of mind the child-machine approach was designed to bypass?

  **Critique of the Standard Reading**
  The standard reading among philosophers and computer scientists treats the Imitation Game as Turing's sole philosophical contribution, viewing the discussion of child machines and education as contingent engineering advice—implementation details irrelevant to the definition of intelligence. This reading leaves the question open because it assumes a clean separation between *criteria* (what counts as intelligence) and *methods* (how to build it). However, this separation is untenable if the method presupposes capacities that the criterion is meant to test. Treating the pedagogy material as continuous with the test is the wrong approach because it ignores the normative weight of "education." If intelligence requires the capacity to be educated, and education requires a teacher who already understands the subject, then the system's intelligence is not intrinsic but borrowed. The standard reading fails to account for this transfer of epistemic labor.

  **Method and Timeline**
  This project proceeds in three four-month blocks, utilizing conceptual analysis rather than empirical or archival research.

  *   **Term 1: Reconstruction.** I will reconstruct the argument structure of the 1950 paper, isolating the premises required to move from the Imitation Game to the child-machine proposal. I will map the dependencies between the "teacher," the "curriculum," and the "reward system." *Reasoning:* This ensures the argument is grounded in the text before expanding into general theory.
  *   **Term 2: The Bottleneck Argument.** I will develop the "curriculum bottleneck" objection. I will analyze whether a teacher can operate without a theory of mind regarding the student. If the teacher must know *what* to teach and *when* to reward, do they not require the very understanding of intelligence the machine lacks? *Reasoning:* This is the core philosophical contribution, turning a practical constraint into a conceptual problem.
  *   **Term 3: Synthesis and Implications.** I will evaluate the three possible conclusions (see below) and draft the final thesis. I will focus on implications for functionalism: if intelligence requires a history of learning, is a static program ever truly intelligent? *Reasoning:* This connects the specific textual analysis to broader debates in the philosophy of mind suitable for a general panel.

  **Possible Conclusions**
  1.  **Collapse:** The developmental criterion collapses into the performance criterion. The teacher's knowledge is irrelevant to the machine's status; only the output matters. (My friend is right; the pedagogy is merely engineering.)
  2.  **Independence:** The developmental criterion is independent. Turing is committed to a view where intelligence is a dispositional property involving the capacity to learn, which the synchronic test cannot fully capture. (I am right; the pedagogy is normative.)
  3.  **Undermining:** The curriculum bottleneck undermines the child-machine route. If the teacher must possess the theory of mind the machine lacks, the approach fails to be theory-sparing, leaving the original problem unsolved.

  Considerations deciding between these will rest on whether "teaching" can be behaviorally specified without invoking mentalistic terms. If teaching requires understanding the student's understanding, Independence or Undermining is likely. If teaching is mere signal manipulation, Collapse is likely.

  **Failure Conditions and Scoping**
  This project fails if close reading reveals the pedagogy section is devoid of argumentative structure, consisting solely of speculation about reward schedules. I will detect this early in Term 1; if the text offers no premises linking education to intelligence, I will pivot to analyzing why Turing felt compelled to include it despite its philosophical emptiness. To prevent scope creep, I will strictly exclude contemporary machine learning literature (e.g., backpropagation, transformers) except where necessary to illustrate a conceptual point. I will not write a history of AI. If the argument threatens to become a general essay on understanding, I will cut all references to human cognition not directly analogous to the Turing text. The thesis must remain an analysis of Turing's argument, not a treatise on mind.
