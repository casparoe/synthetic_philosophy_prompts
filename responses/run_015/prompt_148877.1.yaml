answer: |-
  ### Scientific Realism as Adaptive Correspondence

  In evolutionary terms, scientific realism posits that mature theories are phenotypic traits of the scientific population that exhibit high fitness because they structurally correspond to the selective environment. When a theory survives selection pressure and dominates its ecological niche (the domain of empirical phenomena), realism argues this fitness is not accidental. Instead, high predictive success indicates that the trait has converged on the actual topology of the adaptive landscape.

  For the realist, the environment exists independently of the organism. A trait persists not merely because it keeps the organism alive today, but because it tracks the invariant structures of the environment. Therefore, current high-fitness theories are not just useful illusions; they are locally optimal adaptations that approximate the true shape of the landscape. Reference—the idea that theoretical terms point to real entities—translates as a signaling system where the signal reliably correlates with the presence of a specific environmental feature, ensuring long-term stability against invasion by competing traits.

  ### The Pessimistic Meta-Induction as Phylogenetic Turnover

  The pessimistic meta-induction (PMI) treats the history of science as a fossil record of extinct phenotypes. It observes that many past traits (e.g., phlogiston, caloric fluid) achieved high fitness within their specific niches—they survived selection pressures and enabled successful prediction—yet were eventually outcompeted and went extinct.

  The force of the PMI is that high fitness does not guarantee structural correspondence to the environment. A trait can be highly adaptive for a specific epoch without mapping the underlying terrain accurately. Just as a mimicry phenotype can survive by deceiving predators without matching the background truthfully, a theory can be empirically successful without referring to real entities. The PMI argues that because the turnover rate of high-fitness traits is high, current traits are likely transient local optima, not convergent solutions. Selection pressure favors survival, not accuracy. Therefore, expecting current theories to survive future selection pressures is an induction based on a record of failure.

  ### Translation Analysis

  **What Translates Cleanly**
  *   **Theory Turnover as Selection:** The replacement of Newtonian mechanics by General Relativity maps cleanly to competitive exclusion or speciation events where a new trait outcompetes an ancestral one.
  *   **Predictive Success as Fitness:** The ability of a theory to generate novel predictions translates directly to reproductive success or survival rates within the scientific niche.
  *   **Empirical Domain as Ecological Niche:** The specific range of phenomena a theory explains functions exactly like an ecological niche, defining the boundaries within which the trait is viable.

  **What Must Be Distorted**
  *   **Approximate Truth vs. Locally Optimal Adaptation:** This is the critical distortion. "Approximate truth" carries representational content; it claims the trait mirrors the environment's structure. "Locally optimal adaptation" is purely functional; it claims the trait works well enough to survive current pressures.
      *   *The Distortion:* In biology, a trait can be optimal without being "true" (e.g., a deceptive signal). In realism, success is supposed to entail truth. To fit the evolutionary model, "truth" must be reduced to "long-term stability." However, this loses the normative claim that we *ought* to believe the theory because it matches reality, rather than just because it survives.
      *   *Niche Construction:* Realists argue scientists construct niches that reveal reality. Evolutionarily, organisms modify environments, but usually to suit themselves, not to reveal the environment's intrinsic nature. Mapping "revealing reality" onto "modifying the niche" distorts the direction of fit.

  **What Has No Counterpart**
  *   **Intentionality (Aboutness):** Evolutionary traits are selected for consequences, not content. A heart pumps blood; it does not "refer" to circulation. Scientific theories, however, are *about* the world. There is no biological analog for a trait that persists because it accurately represents the environment rather than merely coping with it.
  *   **Normativity:** Evolution describes what *does* survive. Realism makes a claim about what we *should* believe (the true theories). The evolutionary model is descriptive; it cannot generate the normative force that drives the realist commitment to truth over utility.

  ### Residue Report

  The untranslatable remainder consists primarily of **representational content** and **normative force**. Evolutionary biology explains persistence via fitness differences, not via accuracy of representation. In the evolutionary model, "truth" drops out as an explanatory variable; if a trait survives, it is fit, regardless of whether it "matches" the environment.

  This residue reveals that the philosophical debate was smuggling in metaphysical commitments that do no real explanatory work within a naturalistic framework. The realist insistence on "approximate truth" attempts to add a metaphysical layer (a mirroring relation) on top of the functional layer (survival and prediction). The evolutionary translation shows that this layer is epiphenomenal. If fitness explains the persistence of theories, invoking "truth" is redundant unless "truth" is simply defined as "long-term fitness."

  The PMI wins in this vocabulary because it aligns with the biological reality that adaptation is local and contingent, not convergent and truthful. The residue does not show that evolutionary thinking lacks resources to capture scientific knowledge; rather, it shows that "scientific knowledge" understood as "metaphysical access to reality" is a category error. Science is better understood as a lineage of adaptive traits solving local problems, not a mirror of nature. The philosophical debate persists only because it refuses to reduce "truth" to "stable fitness," clinging to a non-naturalistic notion of representation that has no traction in the evolutionary landscape.
