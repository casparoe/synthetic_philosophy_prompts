answer: |-
  Here is a point-by-point assessment of your reading against the text and your friend's objections.

  ### 1. Moralistic vs. Structural (The Limit Claim)
  **Verdict:** Your reasoning holds; your friend's objection is weak here.

  *   **Textual Defensibility:** You are on firm ground distinguishing the structural from the merely moralistic. In *Politics* I.8 (1256b–1257b), Aristotle's primary distinction between *oikonomia* and *chrematistikē* rests on *peras* (limit) and *apeiron* (unlimited). He explicitly states that natural acquisition is limited by the end of the household (*telos*), whereas the art of money-making has no limit (*oudeis peras*).
  *   **The Role of Greed:** Aristotle does mention greed (*pleonexia*), but structurally, greed is the *result* of the removal of the limit, not the primary cause. When the *telos* shifts from "living well" (*eu zēn*) to "living merely" (*zēn*), the activity becomes limitless. Your claim that the distinction is teleological rather than primarily psychological is textually supported. Aristotle critiques the *activity's form*, not just the *agent's intent*.
  *   **Anachronism Check:** The concept of an "immanent *telos*" is not Scholastic importation; it is core Peripatetic physics and ethics (*Physics* II.2, *Nicomachean Ethics* I.2). As long as you define *telos* as the internal principle of completion rather than a later theological "end," you are safe.

  ### 2. The Surplus Objection
  **Verdict:** Your friend identifies a genuine vulnerability in your phrasing, but it does not defeat your core claim if you refine your definition of "need."

  *   **The Objection:** Your friend is correct that *oikonomia* involves surplus. In *Politics* I.8 (1256a–b), Aristotle admits that barter (*allagē*) arises naturally from having a surplus of one good and a deficiency of another. If *oikonomia* were strictly bounded by "immediate consumption," barter would be impossible.
  *   **Where Your Reasoning Slips:** You risk collapsing if you define the limit as "immediate need." Aristotle's limit is *autarkeia* (self-sufficiency of the household/polis), not immediate consumption. The household stores wine to drink later or trades it for grain to eat next month. This is still *oikonomia* because the exchange is subordinate to the household's self-sufficiency.
  *   **The Fix:** The boundary is not *consumption* vs. *exchange*; it is *exchange for use* vs. *exchange for profit*. As long as the accumulation serves the *telos* of the household (the good life of its members), it is limited. Once accumulation becomes an end in itself (retail trade for coin), the limit is lost.
  *   **Assessment:** Your friend is right that households accumulate surplus; you are right that this accumulation has a limit. You must adjust your claim from "bounded by immediate need" to "bounded by the requirements of self-sufficiency."

  ### 3. The *Tokos* Ontology Argument
  **Verdict:** This is the point where you are most vulnerable to the charge of over-systematizing. Your friend is half-right: *tokos* is conventional vocabulary, but Aristotle uses that convention to make a categorical point, not a full biological ontology.

  *   **The Text:** In *Politics* I.10 (1258b), Aristotle calls interest "money born from money" (*tokos* means offspring). He says this is "most contrary to nature" (*para physin*).
  *   **Your Claim:** You argue this is an ontological mistake where money is treated as a living substance without formal constraint.
  *   **The Risk:** You risk attributing a sophisticated "ontology of reproduction" to Aristotle that belongs more to later metaphysics. Aristotle is not arguing that money *fails* to reproduce biologically; he is arguing that it is a *category error* to apply biological predicates to a convention.
  *   **Aristotle's Actual Point:** Money is *nomos* (convention/law), not *physis* (nature). Biological reproduction requires a specific form (*eidos*) that determines the endpoint of growth. Money is uniform and lacks specific form. Therefore, treating money as a generative substance is a confusion of categories (*nomos* treated as *physis*).
  *   **Assessment:** Your friend is right that *tokos* is standard vocabulary, but wrong to dismiss the analogy as *merely* rhetorical. For Aristotle, etymology often reveals truth. However, you should frame this not as an "ontological mistake about reproduction" but as a **violation of the distinction between *physis* and *nomos***. Money cannot have an immanent *telos* because it is not a natural substance; it is a measure. Treating a measure as a generator is the unnatural act.
  *   **NE V.5 Support:** You cite *NE* V.5. Use this to bolster the *nomos* argument. There, Aristotle establishes money as a measure of demand, guaranteed by convention. This reinforces that money has no natural generative power.

  ### 4. Anachronism and Systematization
  **Verdict:** Your reading is largely defensible, but your terminology needs tightening to avoid the "Scholastic" charge.

  *   **"Immanent Telos":** This is acceptable Aristotelian language. Aristotle distinguishes between things that are ends in themselves and things that are instruments. *Chrematistikē* treats an instrument (money) as an end.
  *   **"Ontological Mistake":** Be careful here. Aristotle is not a modern ontologist. He is analyzing *categories of being* (Substance vs. Quantity/Relation). Money is a relation/measure. Treating it as a Substance (capable of independent generation) is the error. If you frame it as a **category mistake** rather than a broad "ontological error," you avoid the Scholastic charge.
  *   **"Over-systematizing":** Your friend claims you are importing a distinction between "lacking a *telos*" and "being excessive." In Aristotle, these are the same thing. A process without a *telos* is *apeiron* (unlimited/excessive). You are not importing a distinction; you are explaining the mechanism of the excess.

  ### Summary of Recommendations
  1.  **Hold firm on the Structural Claim:** The *peras/apeiron* distinction is the text's backbone. You are right to prioritize this over "greed."
  2.  **Refine the "Need" Claim:** Concede the surplus point. Redefine the limit of *oikonomia* as *autarkeia* (self-sufficiency) rather than immediate consumption. This neutralizes your friend's strongest textual objection.
  3.  **Soften the *Tokos* Ontology:** Shift from "ontology of reproduction" to "category confusion between *physis* and *nomos*." Acknowledge that *tokos* is conventional language, but argue that Aristotle exploits this convention to reveal that usury treats a convention *as if* it were nature.
  4.  **Defend against Anachronism:** Your friend's charge of Scholasticism is largely a bluff regarding *telos*, but valid regarding "ontology." Stick to Aristotelian categories (Form/Matter, Nature/Convention) rather than metaphysical abstractions.

  Your reading is textually robust provided you adjust the definition of "limit" to accommodate surplus storage and frame the *tokos* argument as a categorical error rather than a biological theory.
