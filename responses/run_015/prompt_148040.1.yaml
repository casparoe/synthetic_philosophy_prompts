          *   Challenges intersubjective verification if plural minds are illusory.
          *   Why correlation rather than full experiential fusion?
      *   **Constraints:** Direct responses (no strawmen), conceptually rigorous, no obscure scholarship, no citations/footnotes/bibliography.
      *   **Post-Dialogue:** Reflective note identifying the weakest point in the reconstruction and what would change the verdict (reading of Schrödinger, Maya, or decoherence).

