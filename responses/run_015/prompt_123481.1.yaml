answer: |-
  The tension you identify strikes at the heart of Daniel Dennett's interpretivist project. Your critique suggests that if the self is a "center of narrative gravity" (CNG) analogous to a center of mass, then narrative inconsistency should logically entail a fragmentation of that center, potentially resulting in a polycentric self.

  However, the inference that contradictory narratives *must* generate competing gravitational centers relies on treating the analogy as a physical constraint rather than a pragmatic abstraction. Dennett's model can accommodate radically disjoint first-person reports without collapsing into hard eliminativism or smuggling in a Cartesian homunculus, provided we understand the "gravity" not as a force of physical cohesion, but as a measure of **predictive utility** within the **Intentional Stance**.

  Here is an analysis of why the inference is mistaken and how Dennett's model resolves the dilemma.

  ### 1. The Limits of the Physics Analogy
  Your objection hinges on the physical properties of a center of mass (CoM). In classical mechanics, a rigid body has a single CoM. However, if a physical system becomes disconnected (e.g., an exploding star or two asteroids drifting apart), we no longer describe it as having one CoM; we describe it as a system of bodies, each with its own CoM.

  Dennett's analogy maps onto this functional connectivity, not mere logical consistency.
  *   **Narrative Contradiction vs. Functional Disconnection:** Mere contradiction (lying, forgetting, confabulating) does not necessarily fracture the CNG. A liar still operates as a single agent within the social web; the "gravity" holds because the *interpretive community* (including the self) continues to treat the organism as a single locus of responsibility and prediction.
  *   **The Fracture Point:** The CNG only splits when the functional integration of the brain breaks down to the point where the organism behaves as two distinct agents (e.g., certain interpretations of split-brain patients or Dissociative Identity Disorder). In these cases, Dennett *does* allow for polycentricity. He acknowledges that if the neural "drafts" are no longer competing for a single dominance but are running on parallel, uncommunicating tracks, the abstraction of a *single* self ceases to be useful. We then posit two CNGs.

  Therefore, the model does not require narrative *uniqueness* (perfect consistency) to maintain a single self; it requires narrative *continuity* sufficient to sustain the Intentional Stance. The "gravity" is the pull of interpretation by others and the self. As long as the system can be predictively modeled as one agent, there is one center, regardless of internal contradictions.

  ### 2. Functional Integration vs. Physical Fields
  You ask whether the inference is mistaken because it treats coherence as governed by physical fields rather than functional integration. This is the crucial correction.

  In Dennett's **Multiple Drafts Model**, there is no "finish line" where a narrative becomes official. There are only competing streams of content fixation.
  *   **No Hidden Author:** The arbitration between contradictory narratives is not performed by a homunculus. It is performed by the competitive dynamics of neural competences (memes, habits, sensory inputs). One draft gains enough "traction" to control speech or action, temporarily becoming the "official" story.
  *   **The Shifting Center:** If I report $A$ on Tuesday and $\neg A$ on Wednesday, the CNG has not split; it has *shifted*. The center of gravity is a theoretical point derived from the aggregate of behavior over time. Just as a center of mass moves as a body changes shape, the CNG moves as the narrative updates.
  *   **Radical Disjointness:** If the reports are *radically* disjoint (e.g., one hand writes a confession while the other denies it, with no cross-communication), the functional integration fails. The "field" of interpretation can no longer converge on a single point. In this specific scenario, Dennett would concede the emergence of multiple attractors. But this is not a failure of the theory; it is a accurate description of the pathology.

  ### 3. Resolving the Dilemma: Eliminativism vs. Homunculus
  Your final question asks if the model can accommodate disjoint reports without dissolving into eliminativism or smuggling in an author. Dennett navigates this via **mild eliminativism** (or fictionalism).

  *   **Avoiding the Homunculus:** Because the arbitration is sub-personal (neural competition), no "inner eye" is required to choose between Narrative A and Narrative B. The "winner" is simply the draft that succeeds in driving the output systems. This avoids the Cartesian Theater.
  *   **Avoiding Hard Eliminativism:** Does a fragmented narrative mean the self doesn't exist? For Dennett, the self exists in the same way that *money* or *promises* exist. It is an institutional reality, not a brute physical one.
      *   If the narrative fragments completely, the *person* (as a moral/legal/psychological unit) may cease to exist in the eyes of the community, even if the *organism* remains.
      *   This is not hard eliminativism (which would say "consciousness is an illusion, nothing matters"). It is the claim that the *unity* of the self is an illusion, but a real and useful one. When the utility vanishes (due to radical disjointness), the unity vanishes.

  ### Conclusion
  The inference that contradictory narratives *must* produce a polycentric self is mistaken because it reifies the CNG as a structural invariant rather than a pragmatic tool. Dennett's view implies that:

  1.  **Contradiction is normal:** Inconsistency is absorbed by the shifting nature of the CNG.
  2.  **Fragmentation is functional:** Multiple centers only arise when functional integration breaks (not merely when stories contradict).
  3.  **No Homunculus is needed:** The "arbitration" is the natural selection of neural drafts.

  Thus, Dennett's model accommodates disjoint reports by allowing the "self" to be a **fuzzy, time-relative abstraction**. If the disjointness is severe enough, the abstraction fractures, and we legitimately speak of multiple selves (as in split-brain cases). This is not a bug in the theory, but a feature: it acknowledges that "selfhood" is a status conferred by functional coherence, not a metaphysical substance. The theory avoids the homunculus by making the coherence a bottom-up emergent property, and it avoids hard eliminativism by granting the abstraction ontological status within the social/interpretive realm.
