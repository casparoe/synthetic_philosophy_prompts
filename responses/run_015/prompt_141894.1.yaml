      MEMORANDUM
      TO: All Clinical and Administrative Staff
      FROM: Office of Ethical Compliance & Risk Management
      DATE: October 14, 2024
      SUBJECT: SOP 802-B: Implementation of the Equivalence Protocol (Unitary Causation)

      1.0 PURPOSE
      Pursuant to Board Resolution 14, the Hospital System hereby affirms the moral equivalence of Active Termination (killing) and Passive Cessation (letting die). Effective immediately, all mortality events must be processed under the Equivalence Protocol. The distinction between act and omission is administrative, not ontological. This memo clarifies baseline determination, procedural classification, and reporting standards.

      2.0 DEFINITIONS
      2.1 Standard Course of Nature (SCN): The projected trajectory of a patient's condition absent hospital intervention. The SCN is not a medical prognosis but an administrative baseline defined by the Annual Gazetted Table (AGT).
      2.2 Provisional Non-Commencement (PNC): A status applied to authorized interventions that have not yet been physically initiated. Care logged as PNC may be discontinued without triggering a Withdrawal Event.

      3.0 BASELINE DETERMINATION
      Staff frequently ask: "Would the patient have died anyway?" This question is non-compliant. The SCN is fixed by the AGT, not individual physiology. For FY2024, the AGT dictates that intravenous saline constitutes part of the SCN, whereas supplemental oxygen does not. Consequently, withholding saline is classified as a Deviation from Nature (Homicide Equivalent), while withholding oxygen is classified as Standard Omission.
      Legal has noted this creates liability asymmetry. Compliance maintains that asymmetry is preferable to philosophical ambiguity. If the AGT lists a treatment as "Natural," providing it is neutral; withholding it is causal. If unlisted, providing it is causal; withholding it is neutral. Staff must consult the AGT before rounding.

      4.0 WITHHOLDING VS. WITHDRAWING
      To reduce paperwork friction, the distinction between withholding and withdrawing care is managed via PNC status. If a physician authorizes a ventilator but delays initialization by >15 minutes, the device enters PNC status. Subsequent deactivation is logged as "Non-Commencement Finalized" rather than "Withdrawal." This ensures all terminal events remain in the Withholding column, which carries lower insurance premiums. Billing is advised not to invoice for PNC duration.

      5.0 WORKED CASES
      5.1 Case A (The One-Week Variance): Patient presents with terminal prognosis (SCN survival: 3 weeks). Treatment is withheld per AGT guidelines. Patient dies in 2 weeks.
      *Analysis:* The hospital is causally responsible for the one-week variance. This is not a full homicide, but a "Partial Causation Event."
      *Action:* File Form 12-B. Bill for 2 weeks of occupancy. The third week is coded as Z99.1 (Accelerated Omission) and written off. HR has requested staff not discuss the "value" of the missing week with families.

      5.2 Case B (The Redirect): Ambulance diverted due to capacity. Patient dies en route.
      *Analysis:* Under Protocol, the diversion is an omission equivalent to active termination. The patient is deemed "Constructively Admitted."
      *Action:* Enter patient into census retroactively. This ensures our Mortality Rate matches our Homicide Count. Note: This may cause Deaths to exceed Physical Beds. Legal has advised stating this is a "Capacity-Adjusted Metric."

      6.0 REPORTING
      Annual statistics must reflect Unitary Causation. Column H (Active Homicide) and Column O (Omission Homicide) must sum to Total Mortality. Therefore, the Hospital's Homicide Rate will now equal 100% of its Mortality Rate. Staff should anticipate scrutiny from external auditors regarding this figure. Explain that this reflects rigorous accounting, not increased violence.

      7.0 COMPLIANCE
      Failure to log omissions as actions will result in disciplinary review. The Protocol is not subject to ethical debate, only procedural audit.¹

      ___________
      ¹ While the Equivalence Protocol is technically unfalsifiable—any death can be redescribed as a prevented extension of life—Internal Audit confirms the paperwork is internally consistent. Consistency is the primary metric of ethical success.

