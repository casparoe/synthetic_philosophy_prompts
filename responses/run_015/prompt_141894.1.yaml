  **2.2 Provisional Non-Commencement (PNC):** A status applied to authorized interventions not yet physically initiated. Care logged as PNC may be discontinued without triggering a Withdrawal Event.

  **3.0 BASELINE DETERMINATION**
  The question "Would the patient have died anyway?" is non-compliant. The SCN is fixed by the AGT, not individual physiology. For FY2024, the AGT dictates that intravenous saline constitutes part of the SCN, whereas supplemental oxygen does not. Consequently, withholding saline is classified as a Deviation from Nature (Homicide Equivalent), while withholding oxygen is Standard Omission.

  This creates Baseline Drift. If the AGT lists a treatment as "Natural," providing it is neutral; withholding it is causal. If unlisted, providing it is causal; withholding it is neutral. Staff must consult the AGT before rounding. Legal has noted this creates liability asymmetry. Compliance maintains that asymmetry is preferable to philosophical ambiguity. If the AGT is silent, assume the patient was already dead upon arrival for statistical purposes.

  **4.0 WITHHOLDING VS. WITHDRAWING**
  To reduce paperwork friction, the distinction between withholding and withdrawing care is managed via PNC status. If a physician authorizes a ventilator but delays initialization by >15 minutes, the device enters PNC status. Subsequent deactivation is logged as "Non-Commencement Finalized" rather than "Withdrawal." This ensures all terminal events remain in the Withholding column, which carries lower insurance premiums. Billing is advised not to invoice for PNC duration.

  **5.0 WORKED CASES**
  **5.1 Case A (The One-Week Variance):** Patient presents with terminal prognosis (SCN survival: 3 weeks). Treatment is withheld per AGT guidelines. Patient dies in 2 weeks.
  *Analysis:* The hospital is causally responsible for the one-week variance. This is a "Partial Causation Event."
  *Action:* File Form 12-B. Bill for 2 weeks of occupancy. The third week is coded as Z99.1 (Accelerated Omission) and written off. Do not discuss the "value" of the missing week with families.

  **5.2 Case B (The Redirect):** Ambulance diverted due to capacity. Patient dies en route.
  *Analysis:* Diversion is an omission equivalent to active termination. The patient is deemed "Constructively Admitted."
  *Action:* Enter patient into census retroactively. This ensures Mortality Rate matches Homicide Count. This may cause Deaths to exceed Physical Beds. State this is a "Capacity-Adjusted Metric." Billing will invoice the estate for non-occupancy.

  **6.0 REPORTING**
  Annual statistics must reflect Unitary Causation. Column H (Active Homicide) and Column O (Omission Homicide) must sum to Total Mortality. Therefore, the Hospital's Homicide Rate will now equal 100% of its Mortality Rate. The death certificate form includes a new field: "Natural Causes, Declined." Staff should anticipate scrutiny from external auditors regarding this figure. Explain that this reflects rigorous accounting, not increased violence.

  **7.0 COMPLIANCE**
  Failure to log omissions as actions will result in disciplinary review. The Protocol is not subject to ethical debate, only procedural audit.¹

  ___________
  ¹ While the Equivalence Protocol is technically unfalsifiable—any death can be redescribed as a prevented extension of life—Internal Audit confirms the paperwork is internally consistent. Consistency is the primary metric of ethical success. External validity is secondary to ledger balance. As long as the columns sum correctly, the moral geometry holds.
