  **1.0 PURPOSE**
  Pursuant to Board Resolution 14, the Hospital System affirms the moral equivalence of Active Termination (killing) and Passive Cessation (letting die). Effective immediately, all mortality events are processed under the Equivalence Protocol. The distinction between act and omission is administrative, not ontological. This memo clarifies baseline determination, procedural classification, and reporting standards.

  **2.0 DEFINITIONS**
