prompt: |-
  I need a thought experiment built to order, for a paper I'm writing on whether corrigibility is actually as safe as people think. Here's what I want:

  Construct a case where an AI system satisfies a standard corrigibility condition — roughly, it doesn't try to prevent or cause its own shutdown, and it plans around shutdown as a fixed background event it can't influence — but nonetheless causes a disaster that a non-corrigible version of the same AI (same capabilities, same underlying objective) would have avoided. The disaster has to come from the corrigibility property itself, not from some unrelated bug or a badly chosen objective function. Constraints: near-future setting, no superintelligence, the AI is impressive but not godlike (think: manages a factory or a logistics network or something), and the whole scenario should fit in two paragraphs. After the scenario, walk me through four things: (a) exactly why the corrigibility condition is satisfied in this case, (b) why the disaster happens, (c) what specific feature of corrigibility enables it — like, what's the structural thing that makes the corrigible AI walk into a disaster the non-corrigible one sidesteps, and (d) whether a corrigibility advocate can patch the condition to block your case without giving up the core motivation for wanting corrigible AI in the first place. If the patch would basically amount to building a non-corrigible AI, say so. And if your case turns on some weird edge case that no realistic corrigibility proposal would actually have, be honest about that too.
