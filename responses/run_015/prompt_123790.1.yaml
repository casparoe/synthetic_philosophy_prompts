answer: |-
  ### Exam Question

  **Course:** Upper-Level Metaphysics Seminar  
  **Time Allowed:** 45 Minutes  
  **Word Limit:** Approximately 800 words  
  **Instructions:** Closed-book. Answer the following question. Do not use citations or bibliographies.

  **Question:**
  Bradley argues that the unity of a proposition cannot be explained by relations without triggering an infinite regress. Russell responds by treating the relating relation as a primitive, unanalyzable feature of the proposition itself. Critically evaluate this exchange. Does Russell's appeal to primitive unity genuinely solve the problem, or does it merely relocate the explanatory burden by substituting a vicious regress for an unexplained brute fact? Argue whether accepting this brute fact is philosophically preferable to Bradley's regress, and consider whether any middle ground exists between these two positions.

  ***

  ### Model Answer

  Bradley's regress arises from the intuition that a proposition is more than a mere list of constituents. If we analyze "A loves B" into the terms A, B, and the relation loves, we lose the unity that makes the proposition true or false rather than just a collection of objects. Bradley argues that to unite these constituents, a further relation is required to tie the first relation to the terms. But this new relation itself requires yet another relation to tie it to the previous constituents, generating an infinite hierarchy. For Bradley, this demonstrates that relations are unintelligible and reality must be a single, undifferentiated Absolute.

  Russell blocks this regress by denying the need for a further unifier. He distinguishes between a relation as a term and a relation as a relating verb. In the proposition, the relation does not stand alongside the terms as another object; it actively relates them. This relating capacity is taken as primitive. On this view, the unity of the proposition is not something to be explained by further constituents but is a fundamental feature of propositional structure.

  However, this move invites the charge of relocating the problem rather than solving it. By declaring unity primitive, Russell effectively posits a brute fact: it is simply the nature of certain entities to unify others without further ado. Critics argue this is explanatory stagnation. If Bradley demands an explanation for how unity arises, answering "it just does" stops the inquiry without satisfying the initial metaphysical curiosity. It trades an infinite hierarchy for a mysterious, unanalyzable power inherent in relations.

  Nevertheless, accepting this brute fact is philosophically preferable to Bradley's regress. A vicious infinite regress is destructive; it implies that the condition for unity is never met, rendering propositions impossible. If unity requires an infinite chain of connectors, nothing is ever actually connected. By contrast, a brute fact is merely an explanatory stop. While it leaves us without a deeper analysis of *how* unity occurs, it preserves the possibility of truth and falsehood. Metaphysics must start somewhere; if every fact required further explanation, knowledge would be impossible. Therefore, positing primitive unity is a necessary cost of saving the phenomena of logic and language.

  Is there a middle ground? One might propose that unity is grounded in states of affairs rather than propositions, treating the world itself as structured rather than just our language. Alternatively, one could adopt a non-merelogical view of composition, where the whole is not built from parts but prior to them. However, these views often collapse back into either Bradley's monism or Russell's primitivism. If the state of affairs is a distinct entity, it requires unity (returning to Bradley). If it is primitive, it is Russellian. Thus, the dichotomy remains sharp. We must choose between a world where unity is impossible (Bradley) and a world where unity is fundamental but unexplained (Russell). Given that we clearly make true claims, Russell's brute fact is the only viable option, despite its lack of deeper analysis. The regress is a logical disaster; the brute fact is merely a theoretical limitation.

  ***

  ### Marking Scheme

  **Total Marks:** 100 (20 marks per criterion)

  | Criterion | A Grade Standard (16-20 marks) | B Grade Standard (12-15 marks) | Typical Mistake (Note for Markers) |
  | :--- | :--- | :--- | :--- |
  | **1. Formulation of Bradley's Regress** | Clearly articulates the regress as a problem of *unity* specifically, distinguishing it from general infinite regress arguments. | Describes the regress generally but fails to emphasize the loss of propositional unity vs. mere lists. | Treating the regress as merely about "infinity" rather than the failure of connection. |
  | **2. Exposition of Russell's Move** | Accurately explains the distinction between relation-as-term and relation-as-relating (primitive unity). | States Russell rejects the regress but omits the mechanism of primitive relating vs. static terms. | Describing Russell's view as simply "denying" the regress without explaining the primitive nature of the verb. |
  | **3. The "Brute Fact" Critique** | Explicitly analyzes the trade-off: relocating the burden from infinite steps to unexplained primitivism. | Mentions brute facts but treats them as a simple objection rather than a structural relocation of the problem. | Assuming "brute fact" is automatically a fatal flaw without analyzing it as an explanatory stop. |
  | **4. Comparative Evaluation** | Argues why one cost (regress) is worse than the other (brute fact) based on logical coherence or possibility of truth. | States a preference for Russell but relies on intuition rather than analyzing the viciousness of the regress. | Claiming Russell wins simply because he is "modern" or without justifying why regress is vicious. |
  | **5. Middle Ground Analysis** | Evaluates alternatives (e.g., states of affairs, non-merelogical composition) and shows why they may collapse back into the dichotomy. | Suggests a middle ground exists but fails to demonstrate how it avoids both original pitfalls. | Proposing a solution that secretly presupposes primitive unity or reintroduces the regress. |
