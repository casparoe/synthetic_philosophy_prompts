answer: |-
  ### The Readings Menu
  *Distinct precise claims hidden inside "You can't be uncertain about mathematics."*

  | Reading | The Claim | Verdict | Impact on Your Cases |
  | :--- | :--- | :--- | :--- |
  | **1. The Ontological Claim** | Mathematical propositions have fixed truth values (0 or 1) independent of our knowledge; there is no objective chance. | **Platitude.** True but irrelevant to epistemology. | **None.** Compatible with all your cases. You can be uncertain about a fixed fact. |
  | **2. The Logical Omniscience Claim** | A perfectly rational agent must assign credence 1 to all truths and 0 to all falsehoods (and all tautologies). | **True by Definition,** but describes gods, not mathematicians. | **Kills Case 2 & 5.** Demands you be certain of all consequences of axioms immediately. |
  | **3. The Strict Normative Claim** | It is *irrational* for a bounded human agent to assign credence $\in (0,1)$ to any mathematical claim. | **Straightforwardly False.** Confuses ideal norms with human constraints. | **Kills Cases 2, 3, & 5.** Forces you to pretend you are omniscient. |
  | **4. The Proof-Relative Claim** | Once a proof is verified line-by-line, residual doubt is irrational; credence must snap to 1. | **Substantive but Overstrong.** Ignores the possibility of undetected error in verification. | **Threatens Case 1.** Demands you eliminate "failure of nerve" doubt, even if human error is possible. |
  | **5. The Reductionist Claim** | "Uncertainty about $P$" is just shorthand for "Uncertainty about whether a proof of $P$ exists/will be found." | **Defensible.** Reinterprets the attitude rather than banning it. | **Saves All Cases.** Reframes your 70% confidence as confidence in *provability*, not truth. |
  | **6. The Computational Coherence Claim** | Credences are rational if they resist *computable* Dutch books given current proof resources, converging to 1 only as proofs are found. | **Substantive & Defensible.** The modern formal epistemology standard (Logical Induction). | **Validates All Cases.** Explicitly permits uncertainty during computation/verification. |

  ---

  ### Autopsy of the Departmental Uses
  *Which reading is the professor invoking, and does it work?*

  1.  **"Don't bet on conjectures."**
      *   **Reading Invoked:** **Reading 3 (Strict Normative).** He implies betting is irrational because the truth value is fixed and you *ought* to know it.
      *   **Verdict:** **Bunk.** Betting markets on conjectures are coherent wagers on *future proof states* or *community consensus*, not objective chance. Reading 5 or 6 vindicates the bet.
  2.  **"No doubt after checking a proof."**
      *   **Reading Invoked:** **Reading 4 (Proof-Relative).** He assumes verification entails certainty.
      *   **Verdict:** **Fragile.** Holds only if you assume human verification is error-proof. If you acknowledge fallibility (which you should), Reading 6 allows residual doubt proportional to the risk of oversight.
  3.  **"Don't build on conjectures."**
      *   **Reading Invoked:** **Reading 3 (Strict Normative)** mixed with pragmatic risk management.
      *   **Verdict:** **Pragmatically Sound, Epistemically False.** It is wise risk management (don't build on shaky ground), but the justification "you can't be uncertain" is wrong. You *are* uncertain, and that's exactly *why* you shouldn't build on it without hedging.

  ---

  ### The Friend's Claim (Logical Induction)
  *Is this the Ideal Agent with a weaker bookie?*

  *   **Verdict:** **It is a genuinely different claim.** It is not merely weakening the bookie; it is changing the coherence standard from *logical consistency* to *computational consistency*.
  *   **Does it vindicate the slogan?** **No, it buries it.** It provides a rigorous formal framework showing that *uncertainty about mathematics is the rational default for bounded agents.* It proves that assigning credence $<1$ to unproven statements is not a failure of nerve, but a requirement of coherence for non-omniscient beings.
  *   **Does it save the practice?** **Yes.** It validates your 70% confidence in Case 2 and your high-but-not-1 confidence in Case 5 as mathematically precise, coherent states.

  ---

  ### The Conflation
  *Where the professor goes wrong.*

  The slogan relies on a **Modal-Epistemic Conflation**.
  *   **The Truth:** Mathematical truths are *metaphysically necessary* (Reading 1).
  *   **The Error:** Therefore, epistemic access to them must be *certain* (Reading 3).
  *   **The Gap:** Necessity constrains the *world*, not the *mind*. You can be uncertain about a necessary truth if you lack the computational power to derive it. The professor treats logical implication as psychologically transparent. It is not.

  ---

  ### Case Study Verdicts
  *Which readings force you to give up confidence you actually have?*

  *   **Case 1 (Verified Proof):** **Reading 4** forces you to abandon "failure of nerve" doubt. **Reading 6** permits it (as a margin for human error). *Recommendation: Keep the doubt; Reading 4 is too brittle for human practice.*
  *   **Case 2 (Research Direction):** **Reading 2 & 3** force you to abandon the 70% credence. **Reading 5 & 6** validate it. *Recommendation: Reject Readings 2 & 3; they make research planning impossible.*
  *   **Case 3 (Disagreement):** **Reading 3** forces you to call one postdoc irrational. **Reading 6** allows both to be coherent given different computational evidence. *Recommendation: Reading 3 is bunk here.*
  *   **Case 4 (Independence):** **Reading 2** forces you to assign 1 or 0 (even if you don't know which). **Reading 6** allows stable uncertainty if the statement is undecidable in your system. *Recommendation: Reading 2 is useless here.*
  *   **Case 5 (Heuristics):** **Reading 3** forces you to claim certainty or ignorance. **Reading 5** reframes it as certainty about heuristics. **Reading 6** accepts it as rational credence. *Recommendation: Reading 3 is the enemy of heuristic reasoning.*

  **Final Summary:** The professor is speaking from the perspective of **Reading 2 (Logical Omniscience)** while addressing **Reading 3 (Human Norms)**. This is a category error. Your friend's **Reading 6 (Computational Coherence)** is the only framework that respects both the necessity of math and the boundedness of the mathematician. Adopt Reading 6; ignore the slogan.
