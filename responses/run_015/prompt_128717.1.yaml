reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Build a one-paragraph realistic scenario (hospital ward or office, no trolleys, no sci-fi) where a manager shields a junior from unfair blame for a system error.
      *   **Constraint 1 (Right-Reasons View):** The manager *is* morally worthy because she grasps the actual justifying reason (fairness).
      *   **Constraint 2 (Integrated Virtue View):** The manager is *not* morally worthy because her correct reasoning is compartmentalized (only activates in professional contexts due to institutional conditioning) and she is otherwise callous and dishonest.
      *   **Constraint 3 (Non-Culpable Fragmentation):** The gap shouldn't come from malice, but from moral psychology being fragmented in a non-culpable way.
      *   **Follow-up:** Walk through four points: (1) verdict/reasoning for each view, (2) which feature is doing the work, (3) what happens if compartmentalization is removed, (4) how a virtue ethicist attacks without begging the question.
      *   **Style:** Tight, no bibliographies, no obscure named theories, avoid stipulating verdicts (let them fall out of the theories).

  2.  **Drafting the Scenario:**
      *   *Setting:* Hospital ward or office. Let's go with a hospital ward (high stakes, clear hierarchy).
      *   *Characters:* Manager (Senior Nurse/Head Nurse), Junior (Junior Nurse).
      *   *Event:* System error (medication log glitch), Junior blamed, Manager shields.
      *   *Manager's Motivation (Right-Reasons):* She knows it's unfair because the system failed, not the junior. She acts on fairness.
      *   *Manager's Character (Integrated Virtue Problem):* Outside this specific professional script, she is callous/dishonest. This behavior is conditioned reflex, not deep character.
      *   *Drafting:* Dr. Aris Thorne stands before the hospital board, lying smoothly about her own weekend activities to secure a bonus, yet when the medication dispensing glitch flags Junior Nurse Eli for negligence, she intervenes instantly. Citing the exact protocol clause that exonerates Eli, she absorbs the administrative friction, driven by a sharp, clear recognition that punishing the junior for a software lag is fundamentally unfair. This protective instinct is precise and reliable within the ward's hierarchy, honed by years of rigid institutional training, but it stands isolated against the rest of her life; outside the hospital, she ignores a neighbor's distress and cheats on her taxes without a flicker of guilt, her moral sensitivity walled off into a professional module that functions perfectly despite her broader callousness.

      *Refining for constraints:* Needs to be one paragraph. Needs to ensure the "non-culpable" aspect of the fragmentation is clear (maybe due to past trauma or strict conditioning rather than chosen malice). Let's adjust the "non-culpable" part to be more about psychological fragmentation than just "she's bad elsewhere." The prompt says "non-culpable way." So, maybe she was trained so rigidly that this virtue didn't generalize.
      *Revision:* Head Nurse Mara stands before the administration, shielding Junior Nurse Leo from blame after the scheduling software glitched, citing the precise protocol that proves the error was systemic rather than human. She acts on a clear, unclouded recognition that penalizing Leo would be unjust, absorbing the administrative backlash without hesitation because she grasps the normative force of fairness in this specific context. However, this moral clarity is hermetically sealed within her professional role, a reflex instilled by decades of rigid institutional conditioning that never generalized to her personal life; outside the ward, she is casually dishonest with friends and indifferent to strangers' suffering, her capacity for justice operating as a isolated cognitive module rather than an expression of a unified character, fragmented by early training pressures she did not choose.

  3.  **Drafting the Analysis (1-4):**
      *   *(1) Verdicts:*
          *   Right-Reasons: She gets credit. She acted for the right reason (fairness/justice). The motive matches the justification.
          *   Integrated Virtue: She doesn't get credit. Virtue requires unity/integration. A fragment isn't a virtue. It's not "hers" in the deep sense.
      *   *(2) Feature doing the work:* Compartmentalization/Fragmentation vs. Motive/Reason.
      *   *(3) Remove Compartmentalization:* If she were honest/kind elsewhere too, the Virtue view would flip to worthy. The Right-Reasons view stays the same (still worthy). The gap closes.
      *   *(4) Virtue Ethicist Attack:* How to avoid begging the question? They can't just say "Virtue requires integration." They need to argue why integration matters for *moral worth*. Argument: Reliability/Predictability. If it's compartmentalized, it's fragile. If the context changes slightly, might she fail? Or, moral worth is about the *agent*, not just the *act*. If the agent isn't good, the act doesn't reflect well on them as a moral being. Let's focus on the idea that moral worth tracks the *quality of the will* as a whole, not isolated incidents.

  4.  **Review and Refine:**
      *   *Check Constraints:* One paragraph scenario? Yes. Hospital/Office? Yes (Hospital). No trolleys/sci-fi? Yes. Non-culpable fragmentation? Yes (instilled by conditioning/pressures).
      *   *Check Views:* Right-Reasons (worthy), Integrated Virtue (not worthy).
      *   *Check Analysis:* Tight, no citations.
      *   *Tone:* Philosophical but accessible.

      *Self-Correction on "Non-Culpable":* Make sure the text reflects that she isn't *blamed* for the fragmentation, just that it exists. "Fragmented by early training pressures she did not choose" covers this.
      *Self-Correction on "Right-Reasons":* Ensure it's clear she grasps the *justifying reason*. "Grasps the normative force of fairness."
      *Self-Correction on "Integrated Virtue":* Ensure it's clear why she fails. "Isolated cognitive module," "not an expression of a unified character."

      *Refining the Analysis Point 4:* How does a virtue ethicist attack without begging the question? The "Right-Reasons" theorist says "Motive is all that matters." The Virtue Ethicist says "Motive isn't enough if it doesn't stem from a stable state." To avoid begging the question (assuming virtue theory is true), the VE needs to argue that moral worth is about *who you are*, not just *what you did*. If the action doesn't reflect the agent's overall orientation, it lacks full moral worth. Or, focus on reliability: compartmentalized traits are luck-based regarding context. Let's go with the "reflection of the agent" angle.

  5.  **Final Polish:** Check word count and flow. Ensure the scenario is strictly one paragraph.

      *Scenario Draft:*
      Head Nurse Mara stands before the hospital administration, shielding Junior Nurse Leo from blame after the scheduling software glitched, citing the precise protocol that proves the error was systemic rather than human. She acts on a clear, unclouded recognition that penalizing Leo would be unjust, absorbing the administrative backlash without hesitation because she grasps the normative force of fairness in this specific context. However, this moral clarity is hermetically sealed within her professional role, a reflex instilled by decades of rigid institutional conditioning that never generalized to her personal life; outside the ward, she is casually dishonest with friends and indifferent to strangers' suffering, her capacity for justice operating as an isolated cognitive module rather than an expression of a unified character, fragmented by early training pressures she did not choose.

