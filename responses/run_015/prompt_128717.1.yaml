answer: |-
  Head Nurse Mara stands before the hospital administration, shielding Junior Nurse Leo from blame after the scheduling software glitched, citing the precise protocol that proves the error was systemic rather than human. She acts on a clear, unclouded recognition that penalizing Leo would be unjust, absorbing the administrative backlash without hesitation because she grasps the normative force of fairness in this specific context. However, this moral clarity is hermetically sealed within her professional role, a reflex instilled by decades of rigid institutional conditioning that never generalized to her personal life; outside the ward, she is casually dishonest with friends and indifferent to strangers' suffering, her capacity for justice operating as an isolated cognitive module rather than an expression of a unified character, fragmented by early training pressures she did not choose.

  (1) The right-reasons view judges Mara worthy because her action is motivated by her grasp of the actual justifying reason—fairness—regardless of her broader character. The integrated virtue view judges her unworthy because the action springs from a compartmentalized reflex rather than a stable, cross-situational character trait; since her moral sensitivity is siloed, the act does not reflect a virtuous agent. (2) The feature doing the work is psychological integration: whether moral worth requires the reason to be embedded in a unified psyche or merely to trigger the correct behavior in the moment. (3) If you remove the compartmentalization so Mara is equally fair and honest at home, the virtue view flips to worthy, aligning with the right-reasons view; the gap closes because the action now expresses a whole character rather than a fragment. (4) A virtue ethicist attacks without begging the question by arguing that moral worth tracks the reliability of the agent's orientation toward value; if a trait is context-bound and fragile, the correct action is more akin to a lucky correct output than a testament to moral worth, failing to secure the predictability required for genuine praise.
