prompt: |-
  hey, build me a one-paragraph realistic scenario — hospital ward or office, no trolleys, no sci-fi — where a manager does the clearly right thing by shielding a junior from unfair blame for a system error. engineer it so a 'right-reasons' view (she gets moral worth because she grasps the actual justifying reason, fairness) says she IS worthy, but an 'integrated virtue' view says she is NOT worthy, because her correct reasoning is totally compartmentalized: it only activates in professional contexts due to old institutional conditioning, and she's otherwise callous and dishonest. the gap shouldn't come from her being malicious, just from her moral psychology being fragmented in a non-culpable way.

