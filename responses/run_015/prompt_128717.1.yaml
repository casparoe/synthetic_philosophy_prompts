      *Check on "Integrated Virtue":* Needs to say she is NOT worthy. My draft does this.

      *Check on "Non-culpable":* The prompt says "gap shouldn't come from her being malicious, just from her moral psychology being fragmented in a non-culpable way." My scenario says "fragmented by early training pressures she did not choose." This works.

      *Final Polish of Analysis Point 4:* Make sure it sounds like an argument, not just a restatement. "Moral worth evaluates the agent's overall orientation... if a trait is fragile... it cannot sustain reliability." This argues for *why* integration matters without just saying "Virtue theory says so."

      *Final check on paragraph count:* Scenario must be one paragraph. Analysis can be structured.

