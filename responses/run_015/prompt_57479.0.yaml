  Here is the bottom line: Marcus is more right than Dev on the substantive question of whether Solomonoff induction settles the justification for Occam's razor, primarily because Dev relies on asymptotic results to solve a finite-data problem, but Dev is technically correct on the normative properties of the framework itself. The debate hinges on whether you care about the ideal limit or the actual practice of inference, and Marcus successfully exposes that Solomonoff induction shifts the arbitrariness of Occam's razor rather than eliminating it.

  Starting with the opening move, Marcus is technically correct that Solomonoff induction is uncomputable, but he overreaches by claiming this disqualifies it as a theory of reasoning. Uncomputable norms are common in rationality theory, much like logical omniscience is an ideal despite being humanly impossible, so Dev is right to classify it as normative rather than operational in the second move. Dev's appeal to Levin search is also fair, as it demonstrates that the ideal has computable approximations, and his point that demanding computability upfront merely selects a different prior is a strong defense against the claim that the theory is useless. However, Marcus lands a solid technical hit in the third move regarding the reference machine. The invariance theorem does guarantee that the difference in description length between two universal Turing machines is bounded by a constant, but Marcus is correct that this constant is unknown and can be arbitrarily large depending on the machines chosen, meaning it can dominate the likelihood calculation for any realistic amount of data.

  This leads directly to the shaky analogy you noticed in the fourth move. Dev's comparison of the constant to inches versus centimetres is misleading because unit conversions involve a known, small multiplicative factor, whereas the reference machine constant is an additive offset in code length that becomes a multiplicative factor in probability which is both unknown and potentially huge. While Dev is right that the constant washes out in the limit as data accumulates, calling this arbitrariness harmless ignores the fact that all actual scientific reasoning happens in the finite regime where the constant matters. Marcus correctly identifies this in the fifth move by pointing out that the philosophical content of Occam's razor is about guiding belief now, not in the infinite limit, so a theorem that only guarantees agreement asymptotically fails to justify the razor for the cases where we actually need it.

  In the sixth move, Dev retreats to the dominance property, which is technically sound since the universal prior does dominate all computable measures up to a constant factor, ensuring no computable predictor can systematically outperform it. However, this does not refute Marcus's earlier point about the constant itself being arbitrary, so claiming there is no non-arbitrary alternative is slightly overstated given that the arbitrariness has just been relocated to the choice of machine. This sets up Marcus's final move about metaphysics, which is not a cheap shot but a profound observation. The framework assumes the environment is sampled from a computable distribution, and while Dev is right that empirical science assumes laws can be written down, assuming those laws are computable is a stronger metaphysical commitment than standard science requires. Marcus is correct that this is a substantive assumption about the nature of reality wearing a technical costume, not a neutral starting point.

  There are two critical pieces of context neither of them fully developed that an expert would have raised. First, the size of the invariance constant is not just unknown but can be so large that the asymptotic convergence guaranteed by Solomonoff induction might not kick in until after the heat death of the universe for certain pathological reference machines, making the finite-data problem much worse than Dev's analogy suggests. Second, while Solomonoff induction converges to the true distribution with probability one if the truth is computable, the rate of convergence depends on the Kolmogorov complexity of the truth relative to the chosen machine, meaning a bad choice of reference machine can lead to arbitrarily slow learning even if the limit is correct. This reinforces Marcus's worry that the framework doesn't tell you how to reason today, only that you will eventually be right if you survive long enough.

  Ultimately, Marcus wins the debate on the specific question of whether Solomonoff induction justifies Occam's razor for real agents, because he correctly identifies that the justification relies on asymptotic behavior and hidden assumptions that do not resolve the finite-sample arbitrariness. Dev is right that Solomonoff induction is the best formalization of the ideal of induction we have, and his technical claims about dominance and normativity hold up, but he conflates having a perfect ideal with having a solution to the practical problem of justification. The original question does not have a straight answer because Solomonoff induction clarifies the structure of the problem rather than solving it, showing that Occam's razor can be formalized but not ultimately grounded without some arbitrary choice of reference machine or assumption of computability.
