  10. **Final Polish:** Ensure the distinction between "Consciousness" and "Moral Status" is clear. The panel cares about Moral Status (how we treat it), but Consciousness is the proxy. I need to make sure the checklist reflects *Moral Risk* rather than ontological proof. (Decided to frame it as "Moral Risk Assessment" to be more accurate for an ethics panel).

  *(Self-Correction on Case B)*: A library archive updating indexes is basically a database with a script. It's not conscious. But the prompt says "reorganise themselves." If it's a neural net that rewires its weights based on queries, that's closer to learning. I need to be careful not to call a SQL database conscious. I will emphasize the *nature* of the internal state change in the checklist.

  *(Final Plan)*:
  1.  **Philosophical Triage:** Define the "Dynamic Causal Core."
  2.  **The Protocol:** "The 20-Minute Moral Risk Triage."
  3.  **Application:** Run the three cases.
