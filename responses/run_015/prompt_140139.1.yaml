  The stamp sat on Elara's desk, heavy as a brick. Beside it, the report glowed on the tablet: *Potable Water Supply, Sector 4.* The standpoint tag blinked amber. *Safe (Naya: Municipal Protocol 7-B, 30-day exposure, Adult metabolic baseline).*

  Kael leaned over the desk, smelling of rain and exhaust. "Strip the tag, Elara. Just 'Safe.' The people out there aren't logicians. They're thirsty."

  "If I strip it, it's a lie," Elara said. "Protocol 7-B doesn't test for pediatric renal failure. It doesn't test for long-term accumulation. It's true only from the standpoint of a healthy adult for a month."

  "And if I tell them that?" Kael tapped the screen. "They'll parse the qualifier. They'll think 'maybe safe.' They won't drink. Dehydration kills faster than lead."

  "That's standpoint laundering. You drop the *naya* because the *naya* limits your authority."

  "I drop it because language has friction," Kael snapped. "You want me to say 'Safe relative to X'? By the time I finish the sentence, the children have drunk from the ditch. I need a claim that holds from every standpoint in this room. Give me that, and I'll print the tag."

  Elara crossed her arms. "Do it then. Say it."

  Kael straightened. He looked at the two technicians in the corner, then back to Elara. "The water is safe for all who need it."

  "False," Elara said. "Infants need it. It kills them."

  Kael gritted his teeth. "The water is safe for all who need it, excluding infants and those with compromised filters."

  "False," Elara said. "What about the elderly? What about someone drinking three times the average volume?"

  "Safe for all who need it, excluding infants, the elderly, and high-volume consumers, assuming standard filtration..." Kael's voice tightened. He was adding clauses, stitching standpoints together like patches on a bursting pipe. "Assuming standard filtration, current atmospheric conditions, and no secondary contamination in private storage."

  "Now it's true," Elara said softly. "But look at it."

  Kael looked. The sentence sprawled across the screen, a dense thicket of exceptions. *Safe for [Group A] excluding [Group B] under [Condition C] provided [Variable D]...*

  "It's useless," Kael whispered. "It's so true it means nothing. It doesn't tell anyone to drink. It doesn't tell anyone to stop."

  "That's the doctrine," Elara said. "Reality is complex. Statements are knives. You can't cut everything with one blade."

  "So I have to launder it." Kael looked at her, eyes hard. "I have to drop the exceptions so the order moves. If I don't, the bureaucracy chokes on its own precision while the city dies. You think keeping the tag makes you honest? It makes you a bystander."

  Elara looked at the stamp. The doctrine said an honest claim is only true from a standpoint. But the city demanded action, and action demanded singularity. To act was to simplify. To simplify was to lie. There was no way to act on a standpoint-relative claim without laundering it, because action collapses probability into certainty.

  "You're right," Elara said. "You can't act without laundering. But you don't get to hide the cost."

  She pulled the report toward her. She didn't add the tag. She deleted the qualifier line entirely. *Status: Safe.*

  Kael exhaled. "Thank you."

  "But I'm not filing it under Municipal Protocol," Elara said. She opened the authorization field. "I'm filing it under *Emergency Directive 1*. The standpoint isn't 'Hydrology.' The standpoint is 'Survival.'"

  "That's just another tag," Kael said.

  "No. A tag says 'this is how the world is.' A directive says 'this is what I'm making the world be.'" Elara picked up the physical stamp. She slammed it onto the paper. The ink bloomed black. *AUTHORIZED BY: E. VANE. LIABILITY: PERSONAL.*

  "If the kids get sick," Elara said, meeting his eyes, "you didn't lie. I did. I laundered the standpoint to get you your order. You get to move the water. I get to take the blame when the standpoint catches up with us."

  Kael stared at the signature. He looked like he wanted to argue, to say that was unnecessary, but he saw the logic. The laundering had happened. The only question was who owned the sin.

  "Get the trucks moving," Elara said.

  Kael took the paper. He didn't say thank you again. He walked out into the rain.

  Elara sat alone with the tablet. She tried to type a note for the archive, something that would capture the nuance, the *syadvada* of the decision. *In some respect, this was right. In some respect, wrong.*

  She deleted it. There was no standpoint where a dead child was acceptable. There was no standpoint where a dead city was acceptable. She had chosen one truth and murdered the others. That was the only way to keep anyone alive.

  She closed the file. The screen went dark.

