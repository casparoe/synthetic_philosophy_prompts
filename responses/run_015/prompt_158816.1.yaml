prompt: |-
  I have just come out of a long argument with a friend about whether contractualism can ever count numbers, and I now have to lead a ninety-minute seminar on Scanlon-style contractualism and the aggregation problem for second-year undergraduates who know utilitarianism and a little Kant but have met no contractualism at all. Don't explain the view to me; plan how I should explain it.

  The disagreement I want the session built around is this. My friend insists two cases are morally on a par because they contain the same total burden: in one, a factory's night noise gives a single resident two hundred consecutive nights of mild sleep loss; in the other, it gives two hundred different residents one mildly bad night each. I claimed contractualism can treat these differently, because a person's complaint is assessed over their whole life, so small burdens may compose into a serious one within a life, while summing burdens across different lives is what the comparison of individual standpoints is supposed to forbid.

  Plan the explanation: what has to be in place before the distinction between composing burdens within a life and summing them across lives is even intelligible; the one case that should carry the session and what it must have and lack (no risk, no consent, no catastrophic single burden); and the misconceptions to expect — I'm guessing at least that numbers never matter to contractualism at all, that the view collapses because someone can always object to any principle, and that reasonable rejectability just means people would in fact complain — with the point in the sequence where each should be headed off. Give me one closing question that would show me they can handle a case where the burdens are equal and I simply have to choose who suffers, and say explicitly what I should refuse to go into at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Task:** Plan a 90-minute seminar on Scanlon-style contractualism and the aggregation problem for 2nd-year undergraduates.
      *   **Student Background:** Know utilitarianism and a little Kant. No prior contractualism.
      *   **Instructor's Position:** The instructor had an argument with a friend. The friend says two cases are morally equivalent (1 person suffers 200 nights vs. 200 people suffer 1 night each). The instructor claims contractualism distinguishes them (aggregation within a life is allowed; aggregation across lives is restricted).
      *   **Constraint 1:** Do *not* explain the view to me (the user). Plan *how* I should explain it.
      *   **Constraint 2:** Build the session around the specific disagreement (the noise case).
      *   **Constraint 3:** Specify prerequisites (what must be in place before the distinction is intelligible).
      *   **Constraint 4:** Identify the *one* core case for the session (criteria: no risk, no consent, no catastrophic single burden).
      *   **Constraint 5:** Identify specific misconceptions to head off (numbers never matter, collapse due to universal objection, reasonable rejectability = actual complaining) and *when* to address them.
      *   **Constraint 6:** Provide one closing question (equal burdens, forced choice).
      *   **Constraint 7:** Explicitly state what *not* to go into.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The heart of the issue is *Aggregation*. Utilitarianism sums welfare. Contractualism compares individual standpoints.
      *   The specific nuance is *Intrapersonal vs. Interpersonal Aggregation*.
      *   Scanlon's *What We Owe to Each Other* argues that we justify principles to individuals. An individual can complain about a burden they bear. Can they complain about burdens others bear? Generally, no.
      *   The "200 nights vs. 200 people" case is a classic variation of the "Small Burdens vs. Large Burdens" problem (often associated with Kamm or Scanlon's discussion of aggregation).
      *   To make this intelligible to students, they need to grasp the *Individualist Restriction* (justification is to each person) before they can understand why summing across persons is problematic but summing within a person is not.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Prerequisites (The "In Place" Requirement):**
          *   Before the distinction makes sense, students need to understand *who* is doing the rejecting. It's not "society." It's "individuals."
          *   They need the concept of a *Principle* (general rule), not just act-evaluation.
          *   They need the idea of *Reasonable Rejectability* (not just "I don't like it," but "I have a generic reason no one could reasonably deny").
          *   *Timing:* First 20 minutes.

      *   **Phase 2: The Core Case:**
          *   Needs to be clean. No risk (probabilities confuse the burden). No consent (voluntariness muddies the obligation). No catastrophe (if one person dies, the numbers debate changes drastically).
          *   The Instructor's noise case is actually quite good, but might need tweaking to be the *single* case. Let's refine it. The "Factory Noise" case fits the criteria.
          *   *Case:* Factory operates at night. Option A: One person (Alice) loses sleep for 200 nights. Option B: 200 people lose sleep for 1 night each. Total sleep loss = 200 nights.
          *   *Why this case?* It isolates the aggregation question.
          *   *Timing:* Introduce early, return to it constantly.

      *   **Phase 3: Addressing Misconceptions (The "Head Off" Strategy):**
          *   *Misconception 1: "Reasonable rejectability just means people would in fact complain."*
              *   *Fix:* Distinguish hypothetical vs. actual. It's about *reasons*, not psychological states.
              *   *When:* When defining the mechanism (Minute 25).
          *   *Misconception 2: "Numbers never matter to contractualism at all."*
              *   *Fix:* They do matter in tie-breakers or when burdens are identical (the closing question), but not in *summing* small burdens to outweigh a large one.
              *   *When:* During the analysis of the Core Case (Minute 50).
          *   *Misconception 3: "The view collapses because someone can always object to any principle."*
              *   *Fix:* The "Reasonable" qualifier. Generic reasons vs. idiosyncratic preferences.
              *   *When:* When setting up the rejection criteria (Minute 35).

      *   **Phase 4: The Closing Question:**
          *   Needs to be a "Hard Choice" where burdens are equal.
          *   *Idea:* Two people need a kidney. Only one kidney available. Both will die without it. Both have identical prospects. Who gets it?
          *   *Better for this context:* A rescue case. Two groups trapped. One person in Shaft A, five in Shaft B. Flood rising. You can save one group. (Wait, this brings numbers back).
          *   *Prompt requirement:* "Burdens are equal and I simply have to choose who suffers."
          *   *Idea:* A lifeboat. 10 seats. 11 people. Everyone has equal claim. Do we draw lots?
          *   *Refinement:* Let's stick to the sleep/burden theme for continuity. Two residents, both need the quiet for the *same* critical medical reason. You can only silence the factory for one of them.
          *   *Actually, the prompt asks for a question that shows they can handle a case where burdens are equal.*
          *   *Selection:* The "Tie-Breaker" case. Two people, identical severe burdens. You must impose it on one. How do you decide? (Randomization vs. Preference).

      *   **Phase 5: What to Exclude:**
          *   Ideal vs. Actual agreement.
          *   Global vs. Local contractualism.
          *   Comparison with Rawls (too political).
          *   The "Problem of Harmless Torturers" (too technical).
          *   Detailed exegesis of *What We Owe to Each Other* chapters.

  4.  **Refining the Flow (90 Minutes):**
      *   0-15: Setup (Utilitarianism vs. Kantian intuition -> Contractualism bridge).
      *   15-30: The Mechanism (Principles, Reasonable Rejectability, Generic Reasons). *Head off Misconception 1 & 3 here.*
      *   30-60: The Core Case (The Factory Noise). Work through the aggregation problem. *Head off Misconception 2 here.*
      *   60-75: The Distinction (Intrapersonal vs. Interpersonal). This is the Instructor's main point.
      *   75-90: Closing Question & Wrap-up.

  5.  **Review against Constraints:**
      *   *Did I explain the view to the user?* No, I'm planning the pedagogy.
      *   *Is the noise case central?* Yes.
      *   *Are the misconceptions placed correctly?* Yes.
      *   *Is the closing question specific?* Yes.
      *   *Are exclusions explicit?* Yes.

  6.  **Polishing the Content:**
      *   Make sure the distinction between "composing within a life" and "summing across lives" is the climax of the seminar.
      *   Ensure the "Generic Reasons" concept is clear, otherwise, the "Reasonable" part fails.
      *   The "Numbers" misconception is tricky. Scanlon says numbers *can* matter in tie-breakers, but not for aggregation of small burdens. Need to be precise there.

  7.  **Final Polish:** Check tone. Needs to be instructional, directive, and structured for a seminar leader. (Self-Correction: Ensure I explicitly mention *when* to head off the misconceptions in the timeline).

  8.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is a 90-minute seminar plan designed to lead students from their existing knowledge (Utilitarianism/Kant) to the specific contractualist distinction you need to defend.

  ### 1. Prerequisites: What Must Be in Place First
  Before the distinction between *composing burdens within a life* and *summing burdens across lives* is intelligible, students must grasp three structural features of the view. If these are not established by minute 25, the core argument will fail.

  *   **The Unit of Justification:** They must understand that principles are justified *to individuals*, not to "society" or "the group." Utilitarianism justifies to the aggregate; Contractualism justifies to each person separately.
  *   **The Currency of Complaint:** They must understand that the "reasons" for rejection must be *generic*. It cannot be "I don't like this"; it must be "This impedes a standard human interest (sleep, health, movement) that anyone in this position would have."
  *   **The Veto Power:** They must understand that a single individual can block a principle if their burden is significant enough, regardless of how many others benefit. This establishes the "non-aggregative" baseline.

  ### 2. The Core Case: "The Factory Noise"
  This single case must carry the session from minute 30 to minute 75. Do not introduce new examples until the closing question.

  *   **The Setup:** A factory must operate at night to produce essential medicine. It creates noise.
  *   **Option A:** The noise falls on **Alice**. She loses 200 nights of sleep over a year. Her health declines significantly.
  *   **Option B:** The noise is rotated. It falls on **200 different residents**. Each loses 1 night of sleep. Their health is unaffected.
  *   **Total Burden:** Identical (200 nights of lost sleep).
  *   **Required Constraints:**
      *   **No Risk:** Do not frame this as a risk of harm. It *is* harm (sleep loss). Risk introduces probability, which distracts from the aggregation question.
      *   **No Consent:** The residents did not choose to live there; the factory was there first. This prevents "assumption of risk" arguments.
      *   **No Catastrophe:** Alice does not die. Her burden is serious but not life-ending. This prevents the "save the life" trump card from ending the discussion too early.

  ### 3. Sequence and Misconception Management
  Here is the timeline for the 90 minutes, with specific instructions on where to head off the three likely misconceptions.

  **00–15: The Bridge (Utilitarianism to Contractualism)**
  *   Briefly recap Utilitarianism (maximize total welfare).
  *   Introduce the Kantian constraint: People are ends, not means.
  *   Introduce Scanlon's formulation: An act is wrong if it violates principles no one could *reasonably reject*.
  *   **Head Off Misconception #3 (Universal Objection):** *When defining "Reasonably Reject."*
      *   *The Trap:* Students will think anyone can reject anything ("I don't like medicine").
      *   *The Fix:* Explicitly state that rejection requires a **generic reason**. Idiosyncratic preferences do not count. Only standard human interests count. This stops the "collapse" objection before it starts.

  **15–30: The Mechanism (Standpoints)**
  *   Explain that we compare standpoints. We ask: "Can Alice reasonably reject the principle that allows Option B?" and "Can the 200 residents reasonably reject the principle that allows Option A?"
  *   **Head Off Misconception #1 (Actual Complaining):** *When explaining the "Rejectability" test.*
      *   *The Trap:* Students will think this depends on whether people actually shout or protest.
      *   *The Fix:* Emphasize this is a **hypothetical** test of reasons, not a psychological survey. It matters whether they *could* reject, not whether they *do*.

  **30–60: The Core Case Analysis (Aggregation)**
  *   Apply the Factory Noise case.
  *   Ask: "From the Utilitarian view, are A and B different?" (No).
  *   Ask: "From the Contractualist view, can the 200 residents sum their 1-night burdens to outweigh Alice's 200-night burden?"
  *   **Head Off Misconception #2 (Numbers Never Matter):** *When discussing the 200 residents' complaint.*
      *   *The Trap:* Students will think contractualism *never* counts numbers, leading to absurdity (saving 1 person instead of 5 in a rescue).
      *   *The Fix:* Clarify that numbers don't matter for **aggregating small burdens to outweigh a large one**, but they *do* matter in **tie-breakers** or when individual burdens are **identical**. This sets up your closing question.

  **60–75: The Distinction (Intrapersonal vs. Interpersonal)**
  *   This is the climax of your argument.
  *   Explain why Alice's 200 nights count as a *single, large complaint* (intrapersonal aggregation is permitted because it is one life).
  *   Explain why the 200 residents' 1 night each does *not* count as a single, large complaint (interpersonal aggregation is forbidden because justification is to each individual separately).
  *   Drive home your point: The view distinguishes the cases because the *structure of the complaint* differs, even if the *total utility loss* is identical.

  **75–90: The Closing Question**
  *   Present the scenario below. Do not lecture; let them discuss.

  ### 4. The Closing Question
  **Scenario:** "We return to the Factory. The medicine is still needed. However, due to a geological shift, the noise will now inevitably destroy the hearing of **exactly one person**. There are two residents, Alice and Bob, living in the only two affected houses. Their stakes are identical: both will become permanently deaf. There is no way to split the burden. You must direct the noise to one house or the other. You cannot compensate them. How do you decide, and does the number of people (1 vs 1) matter here?"

  **What this tests:**
  If they say "Flip a coin," they understand that when burdens are equal and non-aggregatable, contractualism allows (or requires) randomization to treat claims equally.
  If they say "Save Alice because she is older/younger," they must justify why that generic reason outweighs Bob's.
  This shows they understand that numbers *can* matter (if there were 1 vs 2 people with equal deafness burdens, many contractualists allow saving the greater number as a tie-breaker of claims), but only *after* the aggregation barrier has been respected.

  ### 5. What to Refuse to Go Into
  To keep this manageable for second-years and focused on your specific argument, explicitly rule out the following if students raise them:

  1.  **Ideal vs. Actual Agreement:** Do not get bogged down in whether the contractors are real or hypothetical. Stick to the "reasonable rejectability" test as a tool for evaluating reasons.
  2.  **The "Harmless Torturers" Case:** Do not introduce cases where individual acts cause no perceptible harm but collective acts do. This confuses the aggregation of *burdens* with the aggregation of *causal contributions*.
  3.  **Rawlsian Political Contractualism:** If they mention *A Theory of Justice*, stop them. This is moral contractualism (*What We Owe to Each Other*), not political legitimacy.
  4.  **Emergency Rescue Numbers:** Do not let the discussion drift to the "Trolley Problem" or "Lifeboat" cases where one person dies vs. five die. Keep the burdens sub-catastrophic (sleep/hearing) so the focus remains on aggregation, not the sanctity of life.
