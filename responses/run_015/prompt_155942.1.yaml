answer: |-
  # Q&A Prep Sheet: Safe Pareto Improvements Under Moral Uncertainty

  ## 1. Opening Concessions (First 2 Minutes)
  *Use this to disarm the room before they attack. It shows you know the limits of your theory.*

  *   **Concede Status Quo Bias:** "I acknowledge that defining safety relative to the status quo creates a conservative bias. If the status quo is deeply unjust, my rule may be too rigid. I argue this is a feature for *policy* stability under uncertainty, not a complete theory of revolution."
  *   **Concede Incompleteness:** "This is not a decision procedure for all moral choices. It is a 'safe harbor' rule for high-stakes policy where empirical and normative uncertainty intersect. It is meant to prevent catastrophe, not necessarily maximize the good."
  *   **Concede the 5% Threshold:** "The 5% credence cutoff is heuristic. I don't have a non-arbitrary derivation for it yet, but it functions to filter out fringe views without demanding unanimity."

  ## 2. The One Reply That Must Land
  *If this fails, the thesis collapses. Memorize this distinction.*

  **The Objection:** "You claim Maximizing Expected Choiceworthiness (MEC) fails because intertheoretic comparisons are impossible. But your Safe Pareto Improvement (SPI) also requires comparing the status quo to the policy across different moral theories. How is that possible if MEC isn't?"

  **The Reply:** "MEC requires *cardinal* intertheoretic comparability (how much *better* is X than Y across theories?). SPI only requires *ordinal* threshold comparability (is X *worse* than the status quo?). It is much easier to agree that a policy is 'catastrophically bad' across multiple theories than to agree on the precise 'value units' gained. I am asking for agreement on a floor, not a ranking of the ceiling."

  **Why it's soft:** A sharp meta-ethicist will argue that even "worse than status quo" implies a common scale of badness. Be prepared to retreat to "overlapping consensus" rather than strict comparability.

  ---

  ## 3. The Objections (Ordered by Likely × Damaging)

  ### 1. The Meta-Ethics Grad Student (The "Incoherence" Attack)
  **Objection:** "You're smuggling in intertheoretic comparisons through the back door. To say a view ranks an option 'below status quo,' you need a common metric to map 'Utilitarian Badness' to 'Deontological Wrongness.' If those scales are incommensurable for MEC, they're incommensurable for your safety constraint too."
  **Reply:** "I'm not mapping scales; I'm mapping verdicts. I don't need to know if a rights violation equals 10 utils of suffering. I only need to know if Theory A says 'Status Quo > Policy' and Theory B says 'Status Quo > Policy.' This is an ordinal overlap, not a cardinal conversion."
  **Soft Spot:** If the theories describe the "badness" in fundamentally different ontological categories (e.g., sin vs. welfare loss), the ordinal ranking might still be incomparable.

  ### 2. The Deliberative Democracy Theorist (The "Legitimacy" Attack)
  **Objection:** "This is technocracy in disguise. By saying 'we don't need to agree on which moral view is right, just follow this rule,' you bypass the democratic work of giving public reasons. You're asking citizens to accept a policy not because it's *just*, but because it's *safe for the policymaker's uncertainty*."
  **Reply:** "I view this as a module for pluralistic societies, not a replacement for justification. When we cannot agree on the 'Good,' we can still agree on avoiding the 'Terrible.' This creates a space for cooperation without demanding moral conversion, which is often more democratic than imposing the majority's moral view."
  **Soft Spot:** It risks reducing politics to risk management, stripping policy of aspirational value.

  ### 3. Welfare Economist #1 (The "Efficiency" Attack)
  **Objection:** "In cost-benefit analysis, we maximize net social welfare. Your rule explicitly rejects the option with the highest expected value (the bigger prioritarian program) for one with lower expected value but less variance. You are literally choosing to make people poorer on average to satisfy a philosophical constraint."
  **Reply:** "Standard CBA assumes we know the weights. Under deep moral uncertainty, the 'expected value' is a fiction built on shaky intertheoretic math. I am trading some expected efficiency for robustness against moral error. It's an insurance premium against being morally wrong."
  **Soft Spot:** Economists hate "insurance premiums" that aren't quantified. They will ask for the cost of this premium in QALYs.

  ### 4. The Operations Researcher (The "Maximin" Attack)
  **Objection:** "I work with Robust Decision Making (RDM). You're using a Maximin criterion over 'every parameter setting evidence leaves open.' That set is usually huge. Maximin is notoriously paralyzing; it leads to the 'least objectionable' option, which is often doing nothing. Have you tested this for 'regret'?"
  **Reply:** "I restrict the parameter set to what the *evidence* leaves open, not logical possibility. And I combine it with the moral credence filter. It's not pure Maximin; it's a constrained satisficing. I'm looking for 'good enough' across all worlds, not 'best' in the average world."
  **Soft Spot:** If the evidence is weak (which it often is in policy), the "open parameter set" is still too wide, leading to paralysis.

  ### 5. Welfare Economist #2 (The "Distributional Weights" Attack)
  **Objection:** "You mention the prioritarian in you prefers a bigger program. But you're letting the libertarian or conservative views in your head (the 5% credence) veto the prioritarian optimum. Why should the views you think are *less likely* get veto power over the view you think is *most likely*?"
  **Reply:** "Because the cost of being wrong about the high-credence view is usually marginal (less good done), while the cost of being wrong about the low-credence view could be catastrophic (rights violations, exploitation). It's a leverage argument, not a probability argument."
  **Soft Spot:** This sounds like you're privileging conservative views structurally, regardless of their truth.

  ### 6. The Luck Egalitarian (The "Responsibility" Attack)
  **Objection:** "Your case study is a blanket cash transfer. A luck egalitarian view (even with <5% credence) might object that this rewards brute luck without accounting for responsibility or option luck. If your rule vetoes policies that any view ranks below status quo, doesn't this block targeted aid that holds people accountable?"
  **Reply:** "The SPI doesn't require the policy to be *ideal* for every view, only *not worse than the status quo*. Most luck egalitarians would agree extreme poverty relief is better than the current status quo, even if it's not the perfectly calibrated ideal. The floor is low enough to pass."
  **Soft Spot:** If the "losers" taxed on the narrow base are deemed "innocent" by the luck egalitarian, the transfer might indeed rank below status quo for them.

  ### 7. The Strategic Grad Student (The "Manipulation" Attack)
  **Objection:** "The 5% threshold is arbitrary and manipulable. If I want to block a policy, I just need to cultivate a fringe moral theory with 5.1% credence that hates it. Doesn't this invite actors to inflate credence in extreme views to game the veto?"
  **Reply:** "Credence should be evidence-based, not strategic. But you're right that the threshold is a vulnerability. I'd argue for a 'reasonable person' standard on credence, not just self-reported subjective probability. We filter out 'bad faith' credence."
  **Soft Spot:** There is no objective metric for "reasonable" credence in a workshop full of subjectivists.

  ---

  ## 4. The Objection I'm Praying Nobody Raises
  **The "Tyranny" Case (Status Quo Toxicity)**

  **The Question:** "Imagine the status quo is chattel slavery or a genocidal regime. A fringe moral view (e.g., Divine Right of Kings) with 6% credence ranks abolition as 'worse than status quo' (sin/chaos). Your rule forbids abolition because it fails the Safe Pareto test. Are you saying we must maintain slavery to satisfy moral uncertainty?"

  **Why it's deadly:** It exposes the conservative bias as morally abhorrent in extreme cases. It suggests your rule prioritizes the *policymaker's epistemic comfort* over *urgent justice*.

  **The Emergency Reply:** "In cases of gross human rights violations, the 'status quo' is no longer a valid baseline for comparison. The 'status quo' itself fails the safety test for the majority of moral views. We must reset the baseline to 'minimum human dignity' before applying SPI. This rule is for policy *adjustments*, not for founding moments or tyrannical regimes."
  *(Note: This concedes that the theory is not universal, which weakens the thesis, but saves you from moral condemnation.)*
