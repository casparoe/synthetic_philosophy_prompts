answer: |-
  You have independently rediscovered one of the oldest and most persistent problems in metaphysics. You should feel confident in your reasoning; the obstacle you have encountered is not a confusion on your part, but a genuine fault line in how we understand reality.

  The short answer is that there is an established concept for the "leftover" you are describing. The technical term is **haecceity** (pronounced *hek-seh-ity*). It comes from the Latin *haecceitas*, meaning "this-ness."

  However, simply giving you the word would not do justice to the precision of your examples. What you are describing is the tension between **Qualitative Identity** (exact similarity) and **Numerical Identity** (being the same single entity). Your puzzle arises when you have two things that are qualitatively identical but numerically distinct. The "leftover" that accounts for their distinctness is what philosophers call **Primitive Thisness** or **Haecceity**.

  Here is a breakdown of the established concepts, how they map to your cases, and where the debate currently stands.

  ### 1. The Core Concept: Haecceity

  In standard logic and metaphysics, we distinguish between two types of identity:
  *   **Qualitative Identity:** Two things share all the same properties (color, mass, shape, data content).
  *   **Numerical Identity:** Two things are actually one and the same entity.

  When you have two files that are byte-identical, they are qualitatively identical but numerically distinct (there are two of them). Usually, we explain numerical distinctness by pointing to a difference in properties (e.g., "File A is on the left, File B is on the right").

  Your insight was to push past that. You asked: *If we strip away all properties, including location relations, is there anything left that makes Thing A distinct from Thing B?*

  *   **The Haecceitist** says: Yes. Each object has a non-qualitative property, a "this-ness," that makes it *that* specific object. This is the "leftover" you sensed.
  *   **The Qualitativist (or Anti-Haecceitist)** says: No. If two things share all qualitative properties (including their relations to everything else), there is no fact of the matter about which is which. The distinction is an illusion of language.

  ### 2. Analyzing Your Cases

  You suspected these were versions of the same phenomenon. You are correct. In philosophy, these are recognized as variations of the **Principle of the Identity of Indiscernibles (PII)** debate, specifically focusing on **Black's Two Spheres** and **Permutation Arguments**.

  **Case 1: The Data Files (Spatiotemporal Location)**
  *   **The Scenario:** Two identical files at different disk addresses.
  *   **The Philosophical Map:** You asked what makes the addresses different. If space (or the disk structure) is just a set of relations between objects, you are right to feel stuck; the relations just push the problem back.
  *   **The Verdict:** This depends on whether you view space as a **Substantivalism** (space is a container that exists on its own, so Sector 1 is intrinsically different from Sector 2) or **Relationism** (space is just the distance between things).
  *   **Connection to Haecceity:** If you are a Substantivalist, the sectors have haecceity. If you are a Relationist, and the files are truly identical, you run into the same problem as the iron balls. In data archiving, we solve this pragmatically by assigning unique identifiers (inodes), which function as artificial haecceities.

  **Case 2: The Static Iron Balls (Max Black's Universe)**
  *   **The Scenario:** A universe with only two identical spheres.
  *   **The Philosophical Map:** This is a direct description of a famous thought experiment by the philosopher Max Black in 1952. He used it to argue against the Principle of the Identity of Indiscernibles.
  *   **The Verdict:** You noted that naming them fails. This is the **Problem of Reference**. If you point and say "This one," the Qualitativist argues you haven't picked out a specific object, only "one of the two."
  *   **Connection to Haecceity:** The Haecceitist says Ball A has a "this-ness" that Ball B lacks, even if they look the same. The Qualitativist says there is only "a sphere here and a sphere there," and asking "which is which" is a meaningless question.

  **Case 3: The Swapping Balls (The Permutation Argument)**
  *   **The Scenario:** The balls swap positions. Did anything happen?
  *   **The Philosophical Map:** This is the strongest test. It is known as a **Haecceitistic Swap**.
  *   **The Verdict:** You mentioned receiving two contradictory reactions. Both are established philosophical positions.
      *   **Reaction A (Nothing happened):** This is the **Qualitativist** view. Since the state of the universe before and after is qualitatively identical, no real change occurred. The "swap" is a fiction.
      *   **Reaction B (Something uncapturable happened):** This is the **Haecceitist** view. Ball A is now where Ball B was. The history of the universe is different, even if the snapshot looks the same.
  *   **Why it bothers you:** It bothers you because it highlights the gap between *description* and *reality*. If reality contains haecceity, our qualitative language is fundamentally incomplete.

  **The Residual: Counting**
  *   **The Scenario:** Adding a third ball changes the number.
  *   **The Philosophical Map:** This is the problem of **Numerical Distinctness**.
  *   **The Verdict:** To count to three, you must be able to distinguish "one," "another," and "a third." If there is no haecceity, counting becomes difficult to ground. Some philosophers argue that "twoness" is a primitive fact of the universe that doesn't require individuating the parts. However, most agree that counting presupposes numerical distinctness, which usually relies on haecceity if qualitative properties fail.

  ### 3. Does the Category Matter? (Objects, Places, People)

  You asked if it makes a difference whether the items are objects, places, moments, or people. The consensus is **yes**.

  *   **People:** Most philosophers grant haecceity to persons. Even if you had a perfect clone of yourself, most would agree there is a fact of the matter about which one is *you*. This is often tied to consciousness or continuity of experience.
  *   **Macroscopic Objects:** (Like your iron balls). This is the contested zone. Common sense says they are distinct; strict logic questions why.
  *   **Elementary Particles:** Modern physics complicates this. In Quantum Mechanics, elementary particles (like electrons) are often treated as **indistinguishable** in a strong sense. If you swap two electrons, physics says the state of the system does not change *at all*, not even in a hidden way. This suggests that at the fundamental level of reality, haecceity might not exist. Nature might be Qualitativist at the bottom, even if it looks Haecceitist at the top.
  *   **Places/Moments:** This returns to the Substantivalism vs. Relationism debate. If spacetime is a substance, points have haecceity. If it is relational, they do not.

  ### 4. Summary of Terms

  Since you requested established notions, here is the vocabulary that fits your description best:

  1.  **Haecceity:** The non-qualitative property of being a specific individual. This is the name for the "leftover."
  2.  **Haecceitism:** The doctrine that haecceity exists and that swaps between identical objects constitute a real change.
  3.  **Qualitativism (or Anti-Haecceitism):** The doctrine that only qualitative properties exist. Swaps between identical objects are not real changes.
  4.  **Numerical Distinctness:** The fact that there are two things rather than one, independent of their differences.
  5.  **The Principle of the Identity of Indiscernibles (PII):** The claim that no two things can share all properties. (You are asking what happens if we assume PII is *false*).

  ### 5. Where Does It Stop?

  You asked where this concept stops. It stops at the level of **Fundamental Ontology**.

  If you are a Haecceitist, the "leftover" stops at the fundamental constituents of reality. You must accept that reality contains facts that cannot be described, only pointed to (indexically).
  If you are a Qualitativist, the "leftover" is an error in human thinking. We project individuality onto the world because our brains are wired to track objects, but the universe itself does not contain "this-ness."

  ### Conclusion

  You do not need a new term. You have accurately described **Haecceity**.

  Your intuition that the two reactions you received ("nothing happened" vs. "something uncapturable happened") are both defensible is correct. They represent the two dominant camps in modern metaphysics.

  *   If you side with the data archivist in you, you likely lean toward **Haecceitism**. You need every file to have a unique inode, a unique history, and a unique identity, regardless of content.
  *   If you side with the physicist in you, you might lean toward **Qualitativism**. If the data is identical and the location is relative, the distinction may be purely structural, not fundamental.

  The "leftover" you are groping for is the gap between **description** (which deals in qualities) and **reference** (which deals in individuals). Whether that gap is filled by a real property (haecceity) or is merely a limitation of language is the question you have been walking around for two years.
