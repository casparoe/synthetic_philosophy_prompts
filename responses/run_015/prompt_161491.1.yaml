  8.  **Final Polish:** (Writing the actual response based on the above thought process). *Self-correction during drafting:* Make sure I don't just say "Hybrid." I need to recommend a *concrete policy*. The recommendation should be: "Minimize expected harm within hard constraints of protected zones and passenger non-sacrifice."

