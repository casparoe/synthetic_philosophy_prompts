answer: |-
  **MEMORANDUM**

  **TO:** Internal Safety Review Board
  **FROM:** Planning Team, Safety Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Policy Recommendation for Unavoidable Collision Scenarios (UCS)

  **Purpose**
  This memo defines the ethical policy governing the planning stack's behavior in unavoidable collision scenarios. We must finalize the objective function constraints before the next release. The board is divided between pure harm minimization (utilitarian) and hard constraint-based rules (deontological). This document maps those positions to our engineering reality and recommends a path forward.

  **Intentionality in Learned Policies**
  We must be precise about "intention." Our planner is a learned policy optimizing a cost function; it does not intend anything. The moral agency lies with the designers who define the loss landscape. When we discuss the Doctrine of Double Effect (means vs. side effect), we are discussing *our* intent as engineers encoding priorities.
  *   **Side Effect:** Hitting a jaywalker while braking hard is a foreseen but unintended outcome of stopping.
  *   **Means:** Swerving into a sidewalk to avoid a jaywalker actively uses the sidewalk occupant as a cushion.
  The doctrine applies to us because our cost function weights represent our intended priorities, even if the execution is probabilistic.

  **Case Analysis**
  1.  **Jaywalker vs. Sidewalk Occupant (1 vs. 1):** Pure harm minimization treats these lives equally. The constraint view distinguishes them based on *normative zones*. The sidewalk occupant is in a protected space; the jaywalker is in the risk envelope. Swerving violates the boundary of the safe zone.
      *   *Verdict:* The distinction holds. Hitting the sidewalk occupant is an active violation of safety norms, whereas hitting the jaywalker is a failure to avoid an existing risk.
  2.  **Passenger vs. Two Pedestrians (1 vs. 2):** Pure harm minimization sacrifices the passenger. The constraint view prohibits trading the passenger's life for others.
      *   *Verdict:* This is the conflict point. The constraint view relies on a special obligation (fiduciary duty) to the customer. The harm minimization view relies on the equal value of human life.

  **The Case for Harm Minimization**
  The argument for minimizing expected casualties without hard constraints is robust and must be acknowledged:
  1.  **Net Safety:** If strict constraints prevent the car from taking maneuvers that save more lives overall, we are choosing rules over lives. In aggregate, a utilitarian planner reduces total mortality.
  2.  **Market Viability as Ethics:** The argument that "no one buys a car designed to kill them" is not merely PR; it is a prerequisite for deployment. If the public rejects AVs because they feel sacrificial, we lose the net safety benefit of removing human error. Therefore, protecting the passenger is instrumentally necessary to save pedestrians long-term.
  3.  **Equality:** Assigning lower weight to pedestrians effectively codifies that some lives are worth less than others based on location or contractual status.

  **Silences and Uncertainty**
  Our ethical frameworks are silent on probabilistic uncertainty.
  *   **Confidence Thresholds:** What does "fewest expected deaths" mean at 60% confidence vs. 90%? The framework does not dictate risk tolerance.
  *   **Near-Ties:** If the cost difference between trajectories is within the noise floor of the perception stack, the policy should not dictate a hard switch.
  We must define a separate risk threshold policy for uncertainty; ethics alone cannot solve sensor noise.

  **Recommendation**
  I recommend adopting **Constrained Harm Minimization**.

  1.  **Primary Objective:** Minimize expected harm (weighted casualties) within the set of feasible trajectories.
  2.  **Hard Constraints:**
      *   **Protected Zones:** The planner may not actively steer into normative safe zones (sidewalks, bike lanes) to mitigate harm to road users, unless collision is otherwise certain.
      *   **Passenger Safety:** The planner may not execute a maneuver where the probability of severe passenger injury exceeds a defined threshold solely to reduce pedestrian risk.

  **Rationale for Losing Side**
  *   **To the Harm Minimizers:** This policy accepts your core goal (minimize harm) as the primary optimizer. It only restricts *how* we achieve it. It acknowledges that violating protected zones erodes public trust necessary for deployment.
  *   **To the Constraint Advocates:** This policy codifies the doctrine of double effect. We do not use pedestrians as means (sidewalks), nor do we use passengers as means (sacrificial maneuvers).

  **Next Steps**
  Engineering will translate these constraints into cost function penalties and hard bounds. We need a follow-up working group to define the specific probability thresholds for "certain collision" vs. "risk mitigation."
