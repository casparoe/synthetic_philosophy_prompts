answer: |-
  **The Shifting Baseline of Human Nature**

  Imagine a pill that allows a human being to sustain deep, focused attention for twelve hours without fatigue. In 2024, such a substance would be classified as an enhancement. It pushes cognitive function beyond the species-typical range. It is a luxury, perhaps a competitive advantage, but certainly not a medical necessity. Insurance would not cover it; ethicists would debate its fairness; regulators would scrutinize its use in schools and workplaces.

  Now, fast-forward fifty years. Suppose the pill is cheap, safe, and ubiquitous. Suppose 90 percent of the adult population takes it daily. In this new world, the ability to focus for only four hours—the old statistical norm—is a disability. A worker who cannot sustain twelve hours of attention is functionally impaired, unable to meet the demands of the economic environment. In this future, prescribing the pill to a child struggling to focus is no longer enhancement; it is therapy. It restores the child to the new species-typical range.

  This scenario illustrates the "baseline-drift problem," the quiet destabilizer of one of bioethics' most enduring frameworks: the normal-function criterion. This criterion holds that therapy consists of restoring a function to its species-typical range, while enhancement consists of pushing a function beyond it. It is an attractive distinction because it promises an objective line in the sand, grounded in biology rather than moral preference. But as the attention pill example demonstrates, the sand is not fixed. The baseline drifts.

  If the classification of an intervention depends on the date on which we ask the question, the normal-function criterion cannot bear the moral weight its proponents assign to it. While defenders of the criterion have offered replies to this instability—anchoring the baseline in history or redefining the distinction as a mere bureaucratic tool—these responses ultimately fail to save the criterion as a guide for ethical truth. The baseline-drift problem reveals that the therapy/enhancement distinction is not a discovery of natural kinds, but a reflection of social consensus. Consequently, the criterion must be abandoned as a moral boundary, though the intuition driving it—the prioritization of suffering over optimization—survives to point us toward a more robust standard based on well-being.

  To understand why the drift is fatal, we must first appreciate what the normal-function criterion attempts to achieve. Proponents like Norman Daniels have argued that medicine's moral authority rests on its goal to maintain normal species functioning. Therapy protects opportunity; enhancement merely expands it. This relies on the assumption that "species-typical functioning" is a stable biological fact. The drift problem shows it is not. It is a statistical average, and statistical averages are sensitive to frequency. When an enhancement becomes widespread, it ceases to be statistically exceptional. The "is" of the population shifts, and therefore the "ought" of the medical mandate shifts with it.

  This makes the distinction temporally unstable. An intervention does not change its chemical properties or its physiological effects between 2024 and 2074, yet its moral classification flips from "optional" to "obligatory." If the moral status of an act depends on how many other people are doing it, we are not dealing with ethics; we are dealing with fashion.

  Defenders of the normal-function criterion have two primary lines of defense against this charge. The first is the "Fixed Reference Point" argument. This view concedes that current statistics drift but insists that the baseline should be anchored to a specific historical moment—usually the capacities of "pre-enhancement humans." On this view, the species-typical range is not what humans *do* function like today, but what humans *were designed* to function like before technological interference.

  This modification stops the drift, but at the cost of the criterion's core promise: objectivity. Selecting a reference point is inherently arbitrary. Why anchor the baseline to humans in 1950? Why not 10,000 BC, before agriculture altered our diets and sleep patterns? Why not before the invention of glasses, which corrected vision to a standard that was previously atypical? Once we admit that the baseline is a chosen historical snapshot rather than a biological constant, we admit that the line is normative, not descriptive. We are no longer reading nature; we are writing it. Furthermore, this approach risks the naturalistic fallacy, equating "what existed before" with "what is good." If we anchor the baseline to a time when life expectancy was forty years, restoring function to that range would prohibit modern vaccines. The Fixed Reference Point saves the line from moving, but only by drawing it in a place that makes no biological or moral sense.

  The second defense is the "Instrumental View." This argument suggests that the drift is a feature, not a bug. Proponents of this view argue that the therapy/enhancement distinction was never meant to be a permanent metaphysical boundary. Instead, it is a practical instrument for triage, insurance coverage, and regulation. Instruments are supposed to track the state of the world. If the world changes, the definition of "necessary care" should change with it.

  There is pragmatic wisdom here. Insurance companies already operate this way; what was considered experimental surgery thirty years ago is standard care today. However, this concession surrenders the bioethical high ground. Bioethics is not merely about budgeting; it is about determining what we *should* do, not just what we can *afford* to do. If the distinction is merely instrumental, it cannot answer the hard questions. It cannot tell us if widespread enhancement is *good* or *bad* for humanity; it can only tell us if it is *fundable*. If the baseline drifts such that enhancement becomes therapy, the instrumentalist must agree that it is now morally required. But this leads to absurdity. If a society becomes so competitive that everyone takes a dangerous drug to work longer hours, the instrumentalist normal-function criterion would classify refusing the drug as a pathology. It turns a social arms race into a medical mandate.

  Therefore, the baseline-drift problem shows that the normal-function criterion cannot ground the therapy/enhancement distinction in the way its proponents want. It cannot provide an objective, non-arbitrary line that holds over time. The attempt to salvage it either freezes history arbitrarily or reduces ethics to accounting.

  However, rejecting the criterion does not mean we must abandon the intuitions that made it attractive. The motivation behind the therapy/enhancement distinction is not really about statistics; it is about priority. We feel that relieving suffering is more urgent than increasing pleasure; that fixing a broken leg is more morally compelling than lengthening a healthy one. The normal-function criterion was a clumsy proxy for this deeper value. It tried to capture "need" by measuring "deviation from the average." The drift problem proves that deviation from the average is a poor measure of need.

  What survives the failure of the normal-function criterion is the principle of **prioritizing well-being over optimization**. This points us toward a different criterion altogether: one based on harm and benefit rather than typicality. Under a well-being criterion, an intervention is therapeutic if it alleviates a significant deficit that causes harm or restricts autonomy, regardless of whether that deficit is statistically common. Conversely, an intervention is enhancement if it seeks to elevate a capacity that is already sufficient for a flourishing life.

  This shift resolves the drift problem. If the attention pill alleviates the suffering of a child who cannot function in school, it is therapeutic, whether 1 percent or 99 percent of the population takes it. If it is taken by a healthy adult merely to gain a competitive edge, it is enhancement, even if everyone else does it. The moral weight rests on the impact on the individual's life, not the position of the population curve.

  The baseline-drift problem teaches us a humbling lesson about the limits of biological definitions in ethics. We cannot derive our values from our averages. The line between therapy and enhancement is not found in the genome or the statistical mean; it is found in the human experience of limitation and flourishing. As we move forward into an era of advanced biotechnology, we must stop asking where the human norm lies and start asking what human beings need to thrive. The baseline will always drift, but the imperative to relieve suffering remains fixed.
