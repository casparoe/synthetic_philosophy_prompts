answer: |-
  This is a sophisticated refinement of the standard consequence argument, and it correctly identifies that the "neural noise" objection is the weakest point in many libertarian accounts. By locating the indeterminacy within the reason-forming mechanism itself (a view sometimes associated with *event-causal libertarianism* or *non-causal libertarianism*), you attempt to secure the "agential" nature of the spread.

  However, to answer your specific question: **No, this refinement does not yet make the argument sound, and yes, there are compatibilist replies that do not amount to merely changing the subject.**

  The vulnerability lies precisely in the **monotonic step** you identified: the assumption that *more agential spread = more desert-grounding freedom*. A robust compatibilist reply argues that inserting indeterminacy into reason-formation does not increase the relevant quantity of control; rather, it **diminishes** it.

  Here is a breakdown of the specific compatibilist counter-arguments you should anticipate, followed by suggestions for strengthening your chapter.

  ### 1. The "Rational Control" Objection (The Diminishment Thesis)
  Your argument assumes that *modal spread* and *sensitivity to reasons* are independent variables that can be summed or multiplied. The compatibilist argues they are inversely related in the way you propose.

  *   **The Argument:** If the reason-forming mechanism is indeterministic, then the output (the decision) is not fully determined by the input (the reasons weighed). If the reasons $R$ outweigh $\neg R$, but the mechanism produces $\neg R$ in 40% of nearest worlds, then in those worlds, the decision was *not* fully explained by the reasons.
  *   **The Implication:** This breaks the link of *rational determination*. For an agent to deserve praise or blame, the action must flow from their rational assessment. If the assessment under-determines the action, the "excess" is not freedom; it is randomness internal to the agency.
  *   **The Conclusion:** Adding agential indeterminacy does not increase the "desert-grounding" quantity; it dilutes the agent's ownership of the decision. On this view, a deterministic agent whose decision follows necessarily from their character and reasons has *maximal* rational control. An indeterministic agent has *less* rational control. Therefore, the monotonic step fails: more spread (via indeterminacy) = less desert.

  ### 2. The Ambiguity of "Modal Spread"
  There is a technical ambiguity in your definition of spread that a compatibilist will exploit. You define spread as the proportion of nearest worlds "whose total prior state differs from the actual one only minimally" in which the agent decides otherwise.

  *   **The Problem:** If the prior state *differs* (even minimally), a deterministic agent **does** have modal spread. Deterministic systems (especially chaotic ones, which you set aside, but also standard psychological models) are sensitive to initial conditions. If the prior state differs slightly, the decision might differ.
  *   **The Compatibilist Move:** To claim compatibilist spread is "nil," you must mean worlds where the prior state is **identical**, not "minimally different."
  *   **Why this matters:** If you concede that "minimally different prior states" count toward spread, compatibilists have spread. If you insist on "identical prior states," you are invoking the Principle of Alternative Possibilities (PAP) in a strong metaphysical sense. The compatibilist reply is that *desert* does not require the "identical past" variety of spread; it requires the "sensitive to reasons/conditions" variety.
  *   **Not Changing the Subject:** This isn't just defining terms; it's arguing that the *type* of spread you value (metaphysical openness) is irrelevant to the *type* of spread that grounds desert (counterfactual sensitivity). If you claim your variety is "worth wanting," they reply: "Worth wanting for what? If it doesn't enhance control or desert, it's a metaphysical luxury, not a moral necessity."

  ### 3. The "Actual Sequence" Reply
  You argue that compatibilists secure only the "deliberative variety" while conceding the "desert-grounding variety." Compatibilists (particularly Fischer-style semi-compatibilists) deny this dichotomy.

  *   **The Argument:** Desert is grounded in the **actual sequence** of events, not the alternative sequences. What matters is whether the actual decision issued from a reasons-responsive mechanism that belongs to the agent.
  *   **The Reply to Your Refinement:** Even if you locate indeterminacy inside the reason-formation, you are still appealing to *alternative sequences* (the spread) to ground desert. The compatibilist argues that alternative sequences are irrelevant to desert.
  *   **Why this is substantive:** This challenges your core premise that "spread... grounds desert." It is not merely changing the subject; it is denying the explanatory link you posit. They would argue: "Imagine two agents, one deterministic (Det) and one indeterministic (Ind), both equally reasons-responsive in the actual world. Why does Ind deserve *more* blame? The extra spread adds nothing to the actual history of the wrongdoing."

  ### 4. The "Worth Wanting" Trap
  Your title alludes to Dennett, whose point was that the *only* variety worth wanting is the one compatible with determinism, because the indeterministic variety is incoherent or worthless.

  *   **The Challenge:** You are trying to define a variety that is "worth wanting" without tying it to practice. But if the variety you define (agential indeterminacy) fails to enhance control or desert (per the Rational Control Objection), then by your own lights, it is **not** worth wanting.
  *   **The Trap:** If you define FWWW as "Spread + Reasons Sensitivity," and then argue this grounds desert, you must show that Spread *contributes* to desert. If the compatibilist shows that Spread (of the indeterministic kind) *detracts* from the rational connection required for desert, then your defined variety is *not* worth wanting for the purpose of grounding desert.

  ### Recommendations for Your Revision

  To strengthen the chapter against these replies, consider the following adjustments:

  1.  **Defend the Monotonic Step:** You need a positive argument for why *internal* indeterminacy enhances desert rather than diminishing control. Simply stipulating it is not enough. You might argue that without indeterminacy, the agent is "locked in" to their prior psychology in a way that precludes ultimate responsibility (the Consequence Argument). You must explicitly weigh the "Rational Control" loss against the "Ultimate Responsibility" gain.
  2.  **Clarify "Prior State":** Be precise. Do you mean "identical prior state" (Incompatibilist spread) or "minimally different prior state" (Sensitivity)? If the former, acknowledge that compatibilists claim this is irrelevant. If the latter, acknowledge that compatibilists claim they have this too.
  3.  **Address the "Diminishment" Objection Directly:** Dedicate a section to the claim that agential indeterminacy reduces ownership. Argue why a probabilistic link between reasons and action is *better* for desert than a deterministic link. (e.g., Does it allow for genuine creativity? Does it allow the agent to be the *source* in a stronger sense?)
  4.  **Re-evaluate "Worth Wanting":** Consider tying "worth wanting" closer to the *function* of desert practices. If the function of blame is to modify future behavior or recognize rational agency, show why indeterministic spread serves that function *better* than deterministic reasons-responsiveness.

  **Summary:** The compatibilist reply is that **agential indeterminacy introduces a gap between who the agent is (their reasons/character) and what the agent does.** If desert requires the action to reflect the agent, this gap is a bug, not a feature. Your argument will only be sound if you can demonstrate why this gap is necessary for the specific variety of desert you have in mind.
