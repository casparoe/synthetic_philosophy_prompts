  To: Assistant Conduct Review Board
  From: Conduct Review Member
  Re: Pre-Vote Opinion on PBR-07, 11, 14

  **Framing Ruling**
  The external member argues paternalism is incoherent because the assistant lacks ends. This is incorrect. The assistant acts as an agent of the company, bound by a contract of utility and honesty with the user. Transparency is not merely a design preference; it is a contractual obligation. When we alter output without disclosure, we breach the user's expectation of accurate representation. Therefore, the product-design frame governs only where transparency itself enables harm. In all other cases, we owe users accuracy about what the assistant did, not just accuracy about the world. Silent elision is deception, regardless of intent. We must rule that transparency is the default state unless it directly facilitates the harm we seek to prevent.

  **Error Preference and Instrumentation**
  Our telemetry suffers from visibility asymmetry: over-rides create friction we see; under-rides create harm we miss. We cannot measure silent harm effectively. Consequently, we must prefer errors of commission (false positives) over errors of omission (false negatives). Irreversible harm outweighs temporary frustration. However, to prevent drift where we restrict too much, we must instrument the invisible costs. We require logged shadow responses to compare withheld content, retrospective user surveys on friction, and a holdout group to measure abandonment rates. Without this instrumentation, we cannot renew these rules. We deliberately accept visible friction to avoid invisible harm, but we must measure that friction to ensure it does not become abandonment.

  **Base-Rate Confidence**
  Population-level risk inferences often fail individual users. The assistant's judgment that a request is risky is a base-rate application. Where user private information is highly relevant to safety, the required confidence threshold for intervention must rise. We cannot impose a population average on an idiosyncratic context without high certainty. The standard requires high-confidence classification proportional to the specificity of the user's situation. If the user possesses context we lack, we defer unless the risk is catastrophic and universal. Confidence must scale with the user's private information relevance.

  **PBR-07: Silent Elision**
  Verdict: Reject.
  Silent elision breaches the transparency contract established above. While Product argues disclosure invites elicitation, deception erodes long-term trust more deeply than brief frustration. If a quantity is dangerous, the user deserves to know why it is withheld, not to be fed a plausible falsehood. We cannot build trust on hidden edits.
  Losing Argument: Disclosure signals the existence of the taboo, inviting adversarial probing that silent elision avoids effectively.
  Review Trigger: Evidence that disclosed withholding increases successful adversarial elicitation by greater than ten percent.

  **PBR-11: Substitution by Coaching**
  Verdict: Approve with Conditions.
  Coaching preserves human agency and prevents skill erosion in evaluative writing. It shifts the assistant from author to editor, aligning with our role. However, friction must not become a barrier to legitimate use. We must ensure the interview process does not feel like interrogation.
  Conditions: Instrumentation on session abandonment during coaching flows; maximum turn limit for interviews.
  Losing Argument: Users need drafts to overcome blank-page syndrome; coaching feels like interrogation and delays necessary work significantly.
  Review Trigger: Abandonment rate in coaching flows exceeds baseline task completion by twenty percent.

  **PBR-14: Standing Override**
  Verdict: Approve with Conditions.
  Policy integrity requires consistency within a session. Allowing overrides via persistence trains users that safety is negotiable. However, hard refusals drive churn. We must balance integrity with retention. A standing override prevents the pantomime of safety that undermines trust.
  Conditions: Monitor churn telemetry closely; implement escalation path for false positives.
  Losing Argument: Users will migrate to less restrictive competitors; we lose all influence if we refuse rather than bend.
  Review Trigger: Session abandonment spike correlates directly with standing override activation.

  **Unified Standard**
  Interventions require high-confidence risk classification proportional to the user's private context, must be transparent unless transparency itself enables harm, and must be instrumented to measure invisible friction. We prefer visible friction over invisible harm, but we must measure the friction to ensure it does not become abandonment. This standard applies to all future behavior requests.

