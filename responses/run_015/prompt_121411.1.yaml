answer: |-
  **Project Title:** Diachronic Agency and the Normative Foundations of Expected Utility

  **1. The Research Question and Hypothesis**
  The central question of this project is whether the coherence arguments supporting Expected Utility (EU) maximization constitute a unified normative family. Standard orthodoxy treats axioms like Transitivity and Independence as co-equal requirements of rational coherence. This project tests the hypothesis that they are not. Specifically, I argue that while arguments for Transitivity (and Completeness) rely on synchronic consistency constraints, arguments for Independence—the axiom distinguishing EU from mere ordinal utility—necessarily rely on substantive norms of diachronic agency.

  For this hypothesis to hold, two conditions must be met. First, it must be shown that money-pump arguments for Independence cannot be reconstructed without invoking a sequence where a chance event resolves and the agent acquires new information. Second, it must be shown that connecting the agent's choices across this information update requires a norm distinct from static consistency, such as a requirement to remain resolute on an ex-ante plan or a prohibition on dynamically inconsistent strategies. The hypothesis is refuted if a purely synchronic money-pump can be constructed for Independence, or if the diachronic norms required (e.g., dynamic consistency) can be derived solely from synchronic coherence plus logic.

  **2. Motivation: Why Existing Positions Leave This Open**
  Current literature leaves this question unresolved because it tends to conflate the *mathematical necessity* of axioms with their *normative justification*.

  A reader relying on **Representation Theorems** might assume the matter is settled: if an agent's preferences satisfy the axioms, they can be represented as maximizing expected utility. However, representation theorems are structural results; they demonstrate what follows from the axioms, not why an agent ought to satisfy them. They treat Independence as a static constraint on a preference ordering, obscuring the dynamic choice sequences required to make the normativity of Independence intuitive.

  Conversely, a reader who views **Money-Pump Arguments** as merely heuristic often assumes all pumps function identically: they show that violating an axiom allows a clever bookie to extract money. This view misses a critical structural distinction. Pumps for Transitivity (cyclic preferences) operate on a single, unchanging preference ordering with no new information. Pumps for Independence, however, typically exploit the gap between ex-ante and ex-post evaluation following a chance resolution. If the latter requires a norm of *planning agency* (e.g., "do not adopt a plan you know you will abandon") while the former requires only *attitude consistency*, then "rationality" in the EU sense is not a monolithic property. It is a composite of static coherence and dynamic planning norms. Failing to distinguish these leaves the normative foundation of EU maximization obscure.

  **3. Methodology and Timeline**
  This is a conceptual analysis project requiring no archival or empirical work. The method involves reconstructing formal arguments to test their dependency on diachronic structures.

  *   **Months 1–3: Taxonomy Construction.** I will systematically reconstruct standard coherence arguments (Dutch Book, Money-Pump, Representation Theorems). The goal is not merely to list examples but to classify them by structural features: Does the argument require a temporal sequence? Does it require chance resolution? Does it require the agent to anticipate future choices? I will establish criteria for distinguishing "Synchronic Pumps" from "Diachronic Pumps."
  *   **Months 4–6: Testing the Independence Axiom.** I will attempt to construct a synchronic money-pump for Independence. If every attempt necessarily introduces a node where uncertainty resolves and the agent chooses with new information, this supports the hypothesis. I will analyze **Consequentialism in Sequential Choice** to determine if the norm driving the pump is truly about outcomes or about the stability of the plan.
  *   **Months 7–9: Analyzing Diachronic Norms.** I will evaluate the specific planning norms required to close the pump. This involves analyzing the **Sophisticated/Resolute distinction**. Does the pump require the agent to be Resolute (binding their future self)? Or does it require Sophistication (predicting and accommodating future weakness)? If the argument for EU requires Resoluteness, it relies on a controversial norm of agency. If it requires only Sophistication, it may collapse into a claim about instrumental efficiency.
  *   **Months 10–12: Synthesis and Drafting.** I will integrate the taxonomy and normative analysis into the dissertation chapter, clarifying the implications for the status of EU maximization.

  **4. Range of Conclusions**
  *   **Strong Confirmation:** Independence arguments essentially rely on diachronic planning norms. EU is not a requirement of static coherence but of rational planning over time.
  *   **Refutation:** A synchronic argument for Independence is found (e.g., via a specific interpretation of the **Sure-Thing Principle** that does not require time).
  *   **Reduction:** The diachronic norms are shown to be derivable from synchronic coherence plus the logic of instrumentation. (e.g., if you value X now, logic dictates you value X later absent new reasons).
  *   **Decisive Considerations:** The outcome turns on whether the "new information" in Independence pumps is essential to the exploitation or merely illustrative. If the exploitation vanishes without the chance node, the diachronic claim holds.

  **5. Failure Conditions**
  I must state honestly where this project could fail.
  *   **Taxonomy Failure:** The distinction between synchronic and diachronic pumps may prove porous. If "information update" can be modeled as a mere shift in logical state without time, the taxonomy collapses.
  *   **Derivability Failure:** It may turn out that the diachronic norm (e.g., dynamic consistency) is widely accepted as a trivial consequence of synchronic coherence. If the philosophical community treats "don't change your mind without new evidence" as a definition of coherence rather than a substantive norm of agency, the project's critical bite is lost.
  *   **Scope Creep:** The project fails if I become bogged down in defending specific non-EU theories (e.g., rank-dependent utility) rather than analyzing the structure of the arguments for EU.

  **6. Scope and Limitations**
  This project is sized for a one-year fellowship, but risks expanding. The primary risk is engaging too deeply with alternative decision theories. To stay within scope, I will restrict analysis of non-EU theories only to cases where they illuminate the structure of the EU coherence arguments. I will not attempt to defend a specific alternative theory. If the taxonomy proves too complex, I will cut the analysis of Dutch Book arguments (probabilistic coherence) to focus exclusively on Money-Pump arguments (preferential coherence), as the latter are more directly relevant to the action-guiding norms of agency.

  ***

  **Appendix: Settled vs. Contested Claims**
  In framing this project, it is vital to distinguish between structural results and normative claims.

  *   **Settled (Structural):** It is a mathematical fact that Representation Theorems demonstrate an isomorphism between axiom-satisfying preferences and utility functions. It is settled that Dutch Book arguments demonstrate a link between probabilistic incoherence and sure financial loss. It is settled that dynamic inconsistency can lead to suboptimal outcomes in sequential choice trees.
  *   **Contested (Normative):**
      *   **Exploitability as Normativity:** Whether susceptibility to a money pump is *constitutive* of irrationality or merely *evidence* of it remains contested. Some argue that exploitability is only bad if a bookie actually exists; others argue the mere possibility suffices.
      *   **Dynamic Arguments and Consequentialism:** Whether dynamic consistency arguments successfully underwrite Consequentialism is disputed. Critics argue that dynamic arguments presuppose the very consequentialist framework they aim to justify.
      *   **Planning Norms:** Whether norms of planning (e.g., Resoluteness) are independent of coherence norms is a live debate. Some view planning norms as pragmatic add-ons; others view them as core requirements of rational agency.
      *   **The Status of Independence:** Whether the Independence axiom is a requirement of coherence or a substantive constraint on risk attitudes is genuinely contested. This project proceeds on the basis that this is an open question, not a settled matter.
