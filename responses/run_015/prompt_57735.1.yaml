          *   Parents: Knowing I care due to kin selection doesn't undermine "I should care."
          *   Incest: Knowing I feel disgust due to familiarity *does* undermine "incest is inherently wrong" (what about siblings raised apart?).
          *   Inequality: Knowing I hate inequality due to status loss *does* undermine "inequality is intrinsically bad."
          *   Promises: Origin is rational principle, not evolution. Survives.
          *   Future Gens: Do we care due to a misfiring kin-altruism heuristic? Or due to a rational principle of fairness/continuity?
          *   *Likely TA Verdict:* **Survives.** Why? Because in modern metaethics (especially non-realist), obligations to future generations are usually grounded in *principles* (justice, rights, non-harm) rather than raw intuition. Since it's a principle (like promises to the dead), it survives the evolutionary story because it wasn't generated by it in the first place.

  6.  **Refining the Prediction:**
      *   The "Promises to the Dead" case is the key key. It shows she allows non-selected beliefs to survive if they are principled.
