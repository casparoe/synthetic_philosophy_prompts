answer: |-
  This is a sharp puzzle. You have identified the critical tension in your TA's position: she uses realist-sounding language ("tracking," "truth line up") while explicitly disavowing moral realism. This suggests she is likely a **Quasi-Realist** (like Simon Blackburn or Allan Gibbard) or a **Constructivist** (like Sharon Street, though Street is more debunking-heavy). For these views, "truth" isn't about matching mind-independent facts, but about which judgments survive reflective scrutiny given their causal origins.

  Here is the breakdown of the rules, the prediction, and how to test it.

  ### 1. Analysis of Your Two Proposed Rules

  **Rule 1: The Tracking Rule**
  *Definition:* A belief survives if the selected tendency tracked something genuinely valuable (or functionally accurate); it debunks if the intuition is a mismatch.
  *   **Fit:** Explains Pain (tracks damage), Parents (tracks kin survival), Incest (mismatch: familiarity $\neq$ wrongness), Inequality (mismatch: status $\neq$ justice).
  *   **Failure:** It struggles with **Promises to the Dead**. There is no evolutionary selection pressure to keep promises to the dead (no fitness benefit). Under a strict Tracking Rule, this should be "neutral" or "debunked" because there is no tracker. The TA says it *survives* because it is principled.
  *   **Prediction for Future Generations:** **Debunked.** Evolution did not select for caring about people 200 years out. There is no "tracker" for this, so the intuition is likely a misfire (e.g., misapplied kin altruism).

  **Rule 2: The Mechanism's Job Rule**
  *Definition:* A belief survives if it is the direct function of the mechanism; it debunks if it is a side effect or heuristic proxy.
  *   **Fit:** Explains Pain (function), Parents (function), Incest (side effect of familiarity heuristic), Inequality (side effect of status monitoring).
  *   **Failure:** Also struggles with **Promises to the Dead**. This belief is *not* the job of any evolutionary mechanism. If the rule is strictly about evolutionary mechanisms, this belief should be outside the scope or debunked. The TA saves it by appealing to *principles*.
  *   **Prediction for Future Generations:** **Debunked.** Caring for future generations is not the "job" of any selected module. It would be classified as a side effect of tribalism or resource guarding.

  ### 2. A Better Rule: The Reflective Endorsement Test

  Your TA's verdict on "Promises to the Dead" is the key. It introduces a third category: **Non-Selected but Rationally Endorsed.**

  **The Rule:** A normative belief survives the evolutionary story if, *after* learning the causal origin of the belief, you still have reason to endorse it.
  *   **Pain/Parents:** You learn the origin, and you still think pain is bad/kids matter. (Survives)
  *   **Incest/Inequality:** You learn the origin (familiarity/status), and the moral force evaporates. (Debunked)
  *   **Promises/Math:** You learn the origin (or lack thereof), and the principle holds up independently. (Survives)
  *   **Gratitude:** Likely survives because reciprocity is a principle we endorse upon reflection, not just a feeling.

  **Prediction for Future Generations:** **Survives.**
  *   **Why:** This case is structurally identical to "Promises to the Dead." Both involve obligations to entities that cannot reciprocate, punish, or reward the agent (no fitness feedback loop). Since she allowed obligations to the *past* dead to survive on principled grounds, consistency demands she allow obligations to the *future* unborn to survive on the same grounds. She will likely argue that while our *emotional urgency* about climate change might be evolutionary (fear of contamination/loss), the *obligation itself* is a principle of justice or non-harm that survives reflection.

  ### 3. Other Rules Considered (and Ruled Out)

  *   **The "Fitness Benefit" Rule:** (Survives if it increases reproduction).
      *   *Knocked out by:* **Promises to the Dead** and **2+2=4**. Neither increases fitness directly.
  *   **The "Realist Tracking" Rule:** (Survives if it matches Mind-Independent Moral Facts).
      *   *Knocked out by:* **TA's explicit denial of realism.** She wouldn't use "tracking" language if she meant Platonic truth. She means "tracking functional success" or "coherence."
  *   **The "Universal vs. Local" Rule:** (Survives if it applies to everyone, debunks if it's group-specific).
      *   *Knocked out by:* **Parents owe kids special care.** This is explicitly partial/local, yet it survives.

  ### 4. The Bet

  **I bet she says the belief Survives.**

  **Why:** The "Promises to the Dead" verdict is the strongest constraint on her system. It proves she is not a hardline Evolutionary Debunker (like Joyce or Ruse). She believes reason can generate obligations that evolution didn't. Future generations are the classic "principle over intuition" case in ethics. If she debunked this, she would undermine the "Promises" verdict, because both rely on obligations extending beyond the sphere of reciprocal fitness. Given she is a TA (not a professor staking a career on a radical view), she will likely aim for the most coherent extension of her previous comments, which points to **Reflective Endorsement**.

  ### 5. The Splitting Question

  To force her to reveal whether she is using the **Tracking Rule** (which predicts Debunking) or the **Reflective Endorsement Rule** (which predicts Survival), ask this:

  > "You said obligations to the dead survive because they fall out of principles we endorse after reflection, not because they are selected intuitions. Is our obligation to future generations the same kind of case? Or is it that we *feel* an intuition to protect them (like territory/kin) that we then try to justify?"

  *   **If she says "Same kind of case (Principled)":** She is running **Reflective Endorsement**. Prediction: **Survives.**
  *   **If she says "It's an intuition we try to justify":** She is running **Tracking/Mechanism**. Prediction: **Debunked** (because the intuition is a misfiring fitness heuristic).

  ### 6. Confidence and Weakest Step

  **Confidence Level:** **75%**

  **Least Sure Step:** **Interpreting the "Gratitude" verdict.**
  You noted she said Gratitude survives but "didn't say why." Gratitude is heavily selected for (reciprocal altruism). If she thinks Gratitude survives *because* it tracks a fitness function (unlike Promises), she might draw a hard line between "Selected & Accurate" (Pain, Parents, Gratitude) vs. "Unselected & Principled" (Promises, Math).
  The risk is that she views Future Generations as "Unselected & *Un*principled" (i.e., just a misfiring intuition). If she thinks our concern for the future is *only* a misfiring kin-instinct and not a rational principle, she will debunk it. However, given the "Promises" precedent, the principled route is the more consistent philosophical position for a non-realist TA.

  **Summary for your prep:** Go in expecting her to say **Survives**, but be ready to pounce if she frames future-care as a *feeling* rather than a *duty*. That is the crack in the armor.
