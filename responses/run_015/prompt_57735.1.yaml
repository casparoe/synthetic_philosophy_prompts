      *   She says she's not a realist. This suggests she doesn't believe in Mind-Independent Moral Truths.
      *   So, when she says "Selection and truth line up" (Pain), she means "Selection and *our stable normative commitments* line up."
      *   When she says Incest is debunked, she means "Once we know the causal story, we no longer endorse this commitment."
      *   When she says Promises to Dead survives, she means "We endorse this commitment upon reflection, regardless of origin."
      *   *Core Rule:* **The Causal Debunking Test.** Does knowing the causal origin of the belief undermine our reason for holding it?
