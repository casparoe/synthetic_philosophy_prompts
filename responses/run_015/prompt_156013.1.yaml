  - How much of the participation rate in the actual case you'd attribute to the structure of the situation — small-group visibility, not wanting to look like a coward in front of your mates, authority, routinization, the step-out option being public and therefore socially expensive — versus to what the men antecedently believed about the target group.
  - Whether the observed refusal rate is even a usable measurement of willingness, given that refusing was itself a public act in front of the commander and the rest of the unit. How much does your number move if that rate badly understates (or overstates) private willingness?
  - How much rides on escalation/commitment dynamics — the first killing being the hard one and later ones following from self-consistency, sunk-cost-ish pressure, and the fact that stopping would mean admitting the earlier thing was wrong — and whether those dynamics need any cultural input at all to run.
  - How much rides on stable individual differences you'd expect in any random draw: the fraction who just won't do it in any situation, and whether that fraction is ~5% or more like a third.
  - How much rides on whether "culture" here even picks out a single thing, as opposed to a mix of obedience norms, de-individuation, and diffuse group hostility that most societies have some version of.

