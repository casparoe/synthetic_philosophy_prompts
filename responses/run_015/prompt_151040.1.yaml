answer: |-
  1. Brainstorming and diagnosis of the confusion
  Your query presupposes that Quine offers a systematic metaethics parallel to his epistemology, which is misleading. Quine seldom theorised ethics explicitly, and where he did, he resisted treating moral values as ontological posits akin to physical objects. You conflate ontological commitment within science with normative commitment within society. While both involve conceptual schemes, science aims at truth regarding sensory stimuli, whereas ethics aims at social coordination. Furthermore, you assume pragmatic virtues function identically in both domains. In science, simplicity aids truth-tracking; in ethics, it aids cohesion. Thus, the analogy between scientific underdetermination and moral disagreement rests on a category mistake regarding the function of each discourse. Quine's naturalism treats science as the arbiter of existence, leaving ethics as a practical tool rather than a descriptive theory. Consequently, asking if a moral scheme is 'erroneous' imports a truth-conditional semantics Quine likely denies.

  2. Quine's actual position on moral values, epistemic values, and conceptual scheme
  For Quine, naturalism dictates that science is our best guide to what exists. Epistemic values like simplicity and conservatism are regulative ideals guiding theory choice to maximise predictive accuracy and truth. Moral values, however, do not feature in our best scientific ontology. Quine views them as cultural artefacts evolved for social stability and survival, not as descriptions of moral facts. While we posit electrons to explain stimuli, we do not posit 'goodness' to explain behaviour in the same causal sense. Moral commitments are adopted for their utility in coordinating action, not for their correspondence to reality. Therefore, the pragmatic virtues guiding science are truth-oriented, whereas those guiding ethics are efficiency-oriented. Quine does not grant ethics the same cognitive status as science. Moral sentences lack the clear truth-conditions found in scientific observation sentences. Thus, while both involve choice within a scheme, the stakes differ: science seeks to map the world, ethics seeks to navigate it socially. The conceptual scheme of science is constrained by sensory evidence; the scheme of ethics is constrained by human needs and social friction. He separates cognitive content from non-cognitive function.

  3. Why moral disagreement is not parallel to scientific underdetermination
  Moral disagreement is not parallel to scientific underdetermination because the latter assumes a shared evidential base that multiple theories can accommodate. In science, rival theories explain the same sensory inputs; in ethics, rival frameworks often pursue different ends or prioritise conflicting interests. Underdetermination implies a fact of the matter exists despite our inability to pinpoint it via evidence. Quine suggests ethics may lack such facts entirely. Scientific theories compete to describe reality; moral schemes compete to regulate behaviour. Therefore, the 'no fact of the matter' claim in ethics is stronger: it is not that we cannot know the moral truth, but that there is no moral truth to know. Scientific underdetermination is epistemic; moral divergence is often constitutive. Quine's naturalism leaves no room for moral facts waiting to be discovered, whereas physical facts remain the target of scientific inquiry regardless of theoretical flux.

  4. Bottom line: can a moral framework be genuinely mistaken on Quine's view?
  On Quine's view, a moral framework cannot be 'genuinely erroneous' in the factual sense applicable to science. Since moral statements lack truth-conditions tied to physical reality, they cannot be false descriptions of the world. However, a moral scheme can be functionally defective. It may fail to secure social cohesion, promote survival, or satisfy human needs. Thus, we might reject a moral framework as maladaptive or impractical, but not as objectively false. Quine naturalises ethics into sociology and psychology, removing the notion of moral error as correspondence failure.
