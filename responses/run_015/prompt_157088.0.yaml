  (2) **40%** — While classic deflationism demands unrestricted disquotation, many modern variants accept schema-restrictions to preserve consistency, lowering the commitment to rigid token-transparency.
  (3) **50%** — The interaction term representing whether context-sensitive disquotation preserves the deflationary function of truth (e.g., generalization) without reintroducing paradox.

  **Combined Survival Credence: ~15%** (Calculated as the joint probability of all three conditions aligning favorably: $0.55 \times 0.60 \times 0.50$).

  **Least Confident Factor:** Factor (2), because the definition of "deflationism" is fluid; some argue that restricting the T-schema abandons deflationism entirely, while others claim it saves it.
  **Moving Evidence:** A formal semantic model that demonstrates how to retain the *logical utility* of truth (infinite conjunctions/generalizations) without requiring every token-instance of the T-schema to hold in the same context.

  **On the Paradox:** It reveals that our **intuitions about classical logic are unreliable** when applied to semantic concepts, not that language itself is broken; 'true' functions more like a context-sensitive indexical than a rigid predicate, and the paradox arises only when we force it into a static logical framework.
