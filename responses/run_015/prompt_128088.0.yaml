  # The Joint Statement on Conventions, Norms, and Grey-Listeners

  Look, we argued until the coffee machine broke. The Strict Lewisian crew (who think everything is about rational coordination and knowing that others know) and the Evolutionary-Norm camp (who think everything is about selection pressures and behavioral stability) finally found enough common ground to sign this. We aren't merging tribes, but we agree on the map even if we fight about the terrain.

  ### Part 1: The Stuff We Actually Agree On

  1.  **Coordination is King:** Both sides agree that conventions arise primarily to solve recurring coordination problems where agents benefit from matching their behavior with others (e.g., driving on the same side of the road).
  2.  **Arbitrariness of Equilibria:** We agree that the specific solution is arbitrary. There are multiple possible equilibria (left vs. right, share vs. hoard), and the convention is just the one that got picked, not necessarily the "best" one in a vacuum.
  3.  **Expectations Drive Action:** Whether it's rational calculation or evolved heuristic, agents conform because they expect others to conform. If everyone else stopped tomorrow, the reason to comply vanishes.
  4.  **Stability Requires Reinforcement:** A convention isn't a one-off event. It persists because there are pressures—either rational payoffs or evolutionary sanctions—that punish deviation and reward sticking to the script.
  5.  **The Grey-Listener Scenario is Relevant:** We both agree that a network where half the agents are "shadow" nodes (grey-listeners) observing only 40% of interactions is a valid stress test for any theory of convention.

  ***

  ### Part 2: The Disagreements Table

  Here is where we split. We phrased each side's position so their own members wouldn't throw things at us. We also applied the **Grey-Listener Stress Test** to each crux to see where the bodies are buried.

  | The Crux | The Lewisian Position (Strict Conventionalism) | The Evo-Norm Position (Evolutionary Normativism) | The Grey-Listener Stress Test (Case & Predictions) |
  | :--- | :--- | :--- | :--- |
  | **1. Is Common Knowledge Necessary?** | **Yes.** A convention requires a recursive loop of expectations. I follow the rule because I know you follow it, and I know you know I know. Without this epistemic transparency, it's just habit, not convention. | **No.** Common knowledge is a luxury fiction. All that matters is behavioral stability generated by selection. If the pattern holds across generations or iterations, it's a norm, regardless of what agents mentally represent. | **Case:** The network locks into a resource-sharing rule, but grey-listeners only see 40% of the transactions required to verify the rule.<br><br>**Lewisian Prediction:** **Collapse.** The epistemic loop is broken. The grey-listeners cannot form the necessary higher-order expectations, so the convention is fragile and will shatter under minor noise.<br><br>**Evo Prediction:** **Survives.** The 40% visibility is enough signal for social learning to reinforce the behavior. The convention holds because it's fit, not because it's known. |
  | **2. Are Power Asymmetries Internal or External?** | **External Noise.** Power differences are just part of the payoff matrix *before* the convention starts. The convention itself is a symmetric agreement to coordinate; power is an external constraint, not part of the convention's definition. | **Internal Constitution.** Power is baked into the norm. Who gets to set the equilibrium and who is forced to follow is part of the convention's structure. You can't separate the rule from the hierarchy that enforces it. | **Case:** The grey-listeners (40% visibility) are systematically disadvantaged by the resource-sharing rule compared to the fully visible nodes.<br><br>**Lewisian Prediction:** **External Constraint.** The convention is still a coordination solution; the disadvantage is just an unfortunate payoff asymmetry external to the convention's logic. The convention survives if coordination pays off despite the loss.<br><br>**Evo Prediction:** **Internal Constitution.** The convention *is* the mechanism of exploitation. The rule locks in *because* it advantages the visible nodes. It survives specifically because it encodes that power asymmetry. |
