answer: |-
  # Session Plan: The Platonia–Luring Relay

  **Target Audience:** 12 PhD Students (Philosophy/Economics)
  **Duration:** 90 Minutes
  **Goal:** Experiential introduction to superrationality via a two-stage dilemma.
  **Constraint:** No theoretical jargon (Superrationality, EDT, Correlation) until the final debrief.

  ---

  ## 1. Materials & Payoff Scheme

  **Materials:**
  *   **Index Cards:** 36 (3 per participant).
  *   **Small Envelopes:** 24 (2 per participant, one for each stage).
  *   **Pens:** 12.
  *   **Collection Bowl:** Opaque.
  *   **Randomizer:** One 12-sided die (d12) or a deck of 12 cards numbered 1–12 (assigned to participants by seat number).
  *   **Whiteboard & Markers.**
  *   **Stake:** One **$20 Coffee Voucher**.

  **Payoff Scaling:**
  To maintain strategic structure without handling microscopic change, we convert "Units" to "Raffle Tickets."
  *   **Conversion Rate:** 10 Units = 1 Raffle Ticket.
  *   **Prize:** The participant with the most Raffle Tickets at the end wins the $20 voucher. (In case of a tie, a coin flip decides).
  *   **Stage 1 Max EV:** ~0.83 Units ≈ 0.08 Tickets. (Low stakes, illustrates dilution).
  *   **Stage 2 Max EV:** 10 Units (if Pool succeeds with K=12) ≈ 1.0 Ticket. (High stakes, illustrates coordination).
  *   *Note:* While the Stage 1 monetary value is low, the *points* accumulate. Emphasize that Stage 1 points matter for the final tally.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute materials, assign Seat IDs (1–12), explain silence rule, explain payoff. |
  | **10–25** | **Stage 1** | **The Luring Stage:** Instructions, decision, submission, counting, result reveal. |
  | **25–40** | **Stage 2** | **The Platonia Stage:** Instructions (careful!), decision, submission, Pool randomization, result reveal. |
  | **40–55** | **Reaction** | **Immediate Post-Mortem:** Participants discuss feelings/outcomes *without* theory. Facilitator records data on board. |
  | **55–80** | **Debrief** | **Theoretical Mapping:** Introduce Superrationality, EDT, and the Pool device. Connect to experience. |
  | **80–90** | **Close** | **Critical Limitations:** Discuss what the Pool "cheated," Q&A, Raffle for voucher. |

  ---

  ## 3. Facilitator Script (Stages 1 & 2)

  *Note: Do not use the words "Nash," "Dominance," "Superrational," "Equilibrium," or "Correlation."*

  ### Introduction (00–10)
  "Welcome. Today we are running two decision experiments. There are 12 of you. You have been assigned a Seat ID from 1 to 12. Please write this on your cards.
  **Rule 1:** No communication. No eye contact intended to signal.
  **Rule 2:** All choices are anonymous to the group, though I (the facilitator) will see them to calculate outcomes.
  **The Stake:** At the end, points you earn convert to tickets. The highest ticket holder wins this $20 voucher.
  You have two envelopes. Label one 'Stage 1' and one 'Stage 2'. Do not open Stage 2 until I tell you."

  ### Stage 1: The Luring Stage (10–25)
  "Open Envelope 1. Inside is the Stage 1 rule sheet.
  **The Rule:** There is a prize pool of 120 Units. You may submit 1, 2, or 3 entry slips into the bowl. Write your ID on each slip.
  **The Calculation:** The Total Prize (120) is divided by the Total Number of Slips in the bowl. One slip is then drawn at random. If your ID is drawn, you win the Divided Prize.
  **Example:** If everyone submits 1 slip, there are 12 slips. Prize per slip is 10 Units. You have a 1/12 chance. Expected value: 0.83 Units.
  If everyone submits 3 slips, there are 36 slips. Prize per slip is 3.33 Units. You still have a 1/12 chance. Expected value: 0.28 Units.
  You have 5 minutes to decide. Place your slips in the bowl."

  *(Facilitator counts slips silently. Calculates Total T. Calculates Prize P = 120/T. Draws one slip. Announces Winner and P.)*

  "Record your points: If you won, you get P Units. If not, 0. Convert to tickets (10 Units = 1 Ticket)."

  ### Stage 2: The Platonia Stage (25–40)
  "Open Envelope 2. This is the Platonia Stage. The prize is fixed at 120 Units, but it is fragile.
  **The Condition:** The prize is paid **only if exactly one claim** is submitted. If 0 claims or 2+ claims are submitted, the prize is void (0 Units for everyone).
  **Your Options:**
  1.  **Claim Outright:** You submit a claim directly.
  2.  **Abstain:** You submit nothing.
  3.  **Join the Randomizer Pool:** You place your ID in a separate 'Pool' envelope.
  **How the Pool Works:** If *anyone* joins the Pool, I will randomly select exactly **one** person from the Pool to be the 'Designator.' Only the Designator submits a claim on behalf of the Pool. The others in the Pool submit nothing.
  **The Risk:** If someone Claims Outright *and* the Pool produces a Designator, there are at least 2 claims. The prize is void.
  **The Payoff:** If exactly one claim exists (either one Outright Claimant & empty Pool, OR one Designator & no Outright Claimants), the 120 Units are awarded. If the Pool produced the claim, the Designator wins the 120 Units. (Note: To save time on dice rolls later, we will treat Pool members as splitting the expected value equally if the Pool succeeds, or we will roll now. *Decision for speed:* If Pool succeeds, roll the d12 immediately to pick the winner among Pool members).
  You have 5 minutes. Place your card in the 'Claims' box, 'Abstain' box, or 'Pool' envelope."

  *(Facilitator collects. Counts Outright Claims. Checks Pool. If Pool > 0, roll d12 to select Designator. Count Total Claims. Reveal Outcome.)*

  ---

  ## 4. Debrief Script (55–80)

  *Now you may drop the silence rule. Move to theory.*

  **Phase 1: The Luring Clash (Stage 1)**
  "Look at the Stage 1 results. If everyone had submitted 1 entry, the group EV was maximized. Yet, many of you submitted 2 or 3. Why?"
  *(Expect answers: "Dominant strategy," "If others restrain, I gain," "Distrust.")*
  "Exactly. Individually, adding entries increases your share of the bowl faster than it dilutes the prize, *assuming others stay fixed*. But because you are all symmetric, when you reason 'I should add entries,' you must acknowledge 'Everyone else reasons the same.'
  This is the clash between **Causal Decision Theory** (my choice doesn't cause theirs) and **Evidential Decision Theory** (my choice is evidence of what symmetric agents do). Hofstadter calls this **Superrationality**. A superrational agent assumes that because the problem is symmetric, the solution must be symmetric. If I choose 3, you choose 3. So I should choose 1."

  **Phase 2: The Platonia Coordination (Stage 2)**
  "Now Stage 2. In the classic Platonia Dilemma, you cannot talk. You must independently decide to claim with probability 1/12. That yields a 38% chance of success.
  Today, I gave you a **Randomizer Pool**. This is a **Correlation Device**. It forced the group to act as a single claimant if you all joined.
  Those who Joined the Pool treated the group as a single unit. Those who Claimed Outright treated themselves as an independent agent.
  If you Claimed Outright, you were effectively betting that the Pool would be empty OR that you would be the only outlier. Given 12 PhD students, that was a low-probability bet.
  Superrationality asks you to make that coordination leap *without* the Pool. It asks: 'If I am rational, and you are rational, and we face the same problem, will we not do the same thing?' If yes, we should both Abstain or both Randomize identically."

  **Phase 3: Mapping the Concepts**
  *   **Weak Dominance:** In Stage 1, submitting 3 entries weakly dominates 1 entry *if* you treat others' actions as fixed.
  *   **Symmetry:** In Stage 2, the Pool exploited symmetry. Superrationality exploits symmetry in *reasoning*.
  *   **The Void:** The voided prize in Stage 2 represents the tragedy of independent action in a coordination game.
  *   **The Pool:** The Pool is a physical stand-in for the logical correlation superrationality posits."

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. Stage 1 Over-Entry (The "Rational" Defector)**
  *   **Prediction:** Several students will submit 3 entries, citing weak dominance.
  *   **Result:** The prize dilutes significantly (T > 20). EV drops.
  *   **Handling:** Do not chastise. Highlight the math on the board. "Person X gained a marginal advantage *if* others stayed at 1. But since 4 people did this, everyone lost. This is the Nash Equilibrium trap."

  **2. Stage 2 "Outright" Claims (The Skeptic)**
  *   **Prediction:** 1 or 2 students will Claim Outright, fearing the Pool won't work or hoping to steal the prize if the Pool fails.
  *   **Result:** If the Pool is used, the prize is voided (2+ claims).
  *   **Handling:** This is the most valuable teaching moment. "This claim represents the refusal to trust logical correlation. You treated your choice as causally isolated. But in a symmetric group, isolation is an illusion."

  **3. Confusion on the Pool Mechanism**
  *   **Prediction:** Students think joining the Pool guarantees *them* a claim, or that the Pool submits 12 claims.
  *   **Handling:** During instructions, use the whiteboard. Draw 12 stick figures. Draw a box around 5 of them labeled "Pool." Draw *one* arrow coming out of the box. "The Pool speaks with one voice."

  **4. Unserious Stakes**
  *   **Prediction:** "It's only $20, I'll just mess around."
  *   **Handling:** Frame it as "Philosophical Reputation." "We are testing if PhDs in rationality can actually coordinate. The data matters more than the coffee."

  ---

  ## 6. Critical Analysis: What the Activity Cannot Reproduce

  You must be frank about this during the final 10 minutes.

  **1. The "Cheat" of the Pool**
  "The Randomizer Pool I provided in Stage 2 is a **causal correlation device**. It physically prevents multiple claims from the pool members.
  **Hofstadter's Superrationality** claims you can achieve this coordination *without* the Pool, using **logical correlation** alone. It argues that your reasoning process *is* the correlation. If you decide to join the 'mental pool,' you can assume I do too, because we are running the same algorithm.
  **The Limitation:** This activity proves that *correlation is beneficial*. It does not prove that *logical correlation is possible*. Many of you will remain skeptical that your choice can be evidence of mine without a causal link. The Pool bypassed that skepticism by giving you a causal link."

  **2. Independent Mixed Strategies vs. Correlated Equilibrium**
  "In the original Platonia Dilemma (without my Pool), the superrational solution is an independent mixed strategy: everyone claims with p = 1/12. This yields a 37% success rate.
  My Pool allowed you to achieve a 100% success rate (provided no one claimed outright). This is a **Correlated Equilibrium**.
  **The Lesson:** The activity makes you *feel* the value of the Correlated Equilibrium. The theoretical work of superrationality is arguing that rational agents should treat independent reasoning *as if* it were a Correlated Equilibrium.
  **Survival of the Lesson:** Even without the Pool, the disappointment of the voided prize remains. That disappointment is the engine of superrationality. It creates the desire for a mechanism (like logical correlation) that the standard Nash framework denies you."

  **3. The Facilitator's Burden**
  "I, the facilitator, supplied the correlation in Stage 2. In the real world (and in Hofstadter's thought experiment), *you* must supply the correlation. You must trust that your rationality is isomorphic to mine. That is the leap this game simulates but cannot fully instantiate. You felt the *reward* of superrationality, but you did not have to perform the *epistemic act* of superrationality."

  ---

  ## 7. Summary of Payoff Math for Facilitator

  *   **Total Voucher:** $20.
  *   **Stage 1:**
      *   Total Entries $T$. Prize $P = 120/T$.
      *   Winner gets $P$ Units.
      *   *Example:* If $T=24$, $P=5$. Winner gets 5 Units (0.5 Tickets).
  *   **Stage 2:**
      *   If Success (1 Claim): Prize 120 Units (12 Tickets).
      *   If Pool Wins: Roll d12 among Pool members. Winner gets 12 Tickets.
      *   If Outright Wins: Claimant gets 12 Tickets.
      *   If Void: 0 Tickets.
  *   **Total:** Sum Tickets. Highest wins $20.

  *Note:* The disparity between Stage 1 (fractional tickets) and Stage 2 (whole tickets) is intentional. It makes Stage 1 feel like a "warm-up" tragedy and Stage 2 the "main event" coordination problem.
