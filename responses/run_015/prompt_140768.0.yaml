prompt: |-
  You are a professional philosopher of biology — a specialist in the semantics of biological information — and you are a committed deflationist about genetic information. Your position: strictly speaking, the only information in the vicinity of the cell is the plain causal and correlational kind, the same kind that holds between tree rings and the rainfall that produced them; saying that DNA "codes for" or "specifies" a trait is a metaphor that does useful work at the bench but no genuinely semantic work in theory, and nothing in a cell is *about* anything.

  Before you reply, think carefully and brainstorm for one short paragraph: list the three or four strongest objections to your view, decide which of them I have actually raised (do not flatten my argument into an easier neighbouring one), and identify the single word or move in my opening you most want to attack. Then answer in character.

  Rules for the exchange:

  - Stay in character until I type STOP. You may step out of character only to ask me a factual question about biology — never to soften a philosophical point.
  - Argue like someone who will not fold: concede small points readily, never the main one.
  - No citations, no papers, no authors, no suggested reading. I have no library or web access from where I'm sitting; argue from the cases and the concepts alone.
  - Keep each reply under 250 words, in a spoken register rather than a lecture register.
  - Do not be encouraging. Tell me plainly where my argument is muddled or where I have smuggled in what I need to prove.
  - End every reply with one final sentence, set off as its own line: the single move you would make next if your aim were to damage my position as badly as possible.

  Context: I am seventeen, and I have been arguing this with my biology teacher, who keeps saying the whole dispute is merely verbal. I want to rehearse against someone who actually holds the deflationary line and won't hand it to me, because if she is right I do not have a project. So do not agree with her too quickly.

  Here is my opening.

  I want a test that separates a mere correlation from a code, and the one I have been working with — I call it the Rewrite Test — is this: a system is a code only if the same message can be re-expressed under a different mapping while the message itself stays fixed. Tree rings fail it. You cannot re-encode a drought as a different pattern of rings, because the mapping is nailed down by the physics of growth; change the mapping and you have changed the cause, not the message. The genetic code looks like it passes. Codon tables differ slightly between lineages; a laboratory can introduce an orthogonal transfer-RNA and its charging enzyme so that a codon which used to carry one amino acid now carries a different, non-standard one, and translation still goes through; and the mapping is not even wholly located in the DNA, since the enzymes that load tRNAs typically recognise the shape of the tRNA body rather than reading its anticodon. So the table is arbitrary with respect to chemistry, multiply realisable, and stored partly in the machinery — which is roughly what a convention looks like when you are only allowed to inspect it from the outside. Your view must reply that all of this is just contingent causal fit. Then tell me two things: what work "information" is still doing in your biology that "specific causal role" was not already doing, and why a mapping that survives re-expression of the same message is not a code — especially given that a lock could equally have been cut for a different key, and nobody thinks a lock is a code.
