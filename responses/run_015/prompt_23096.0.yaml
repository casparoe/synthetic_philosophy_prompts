      *   *Is the PH an explanation?* Philosophers like Albert argue it's a law. Boltzmann might want a statistical derivation.
      *   *Multiverse:* Modern inflationary cosmology actually resurrects a version of Boltzmann's idea (our bubble is a fluctuation in a multiverse). Boltzmann might love this.

  8.  **Final Structure:**
