answer: |-
  You have identified a rhetorical and philosophical maneuver that is distinct from standard NIMBYism, yet often conflated with it. Standard NIMBY arguments are typically *instrumental* and *self-regarding* (e.g., "this will lower my property value" or "increase my traffic"). The move you describe is *ontological* and *altruistic* (in a specific, exclusionary sense): it posits that the *place itself* is a moral patient worthy of protection, independent of the welfare of the specific humans currently or potentially inhabiting it.

  There is no single, canonical term in political philosophy or urban theory that captures this exact configuration. Terms like "localism," "communitarianism," or "exclusionary zoning" describe the policy or the broad ideology, but not the specific logical sleight-of-hand regarding moral standing.

  To capture this precise configuration, I propose the concept: **Territorial Moral Reification (TMR)**.

  Below is the definition, the boundary conditions distinguishing it from related concepts, and an analysis of its philosophical commitments and points of collapse.

  ---

  ### Concept: Territorial Moral Reification (TMR)

  **Definition:**
  Territorial Moral Reification is the argumentative move that attributes intrinsic moral standing, agency, or entitlement to a geographic configuration ("the neighborhood," "the character of the place") independent of the welfare, rights, or consent of the human beings who inhabit or seek to inhabit it.

  In TMR, the *container* (the spatial arrangement, density, and demographic status quo) is treated as the primary moral subject, while the *contents* (current and prospective residents) are treated as temporary stewards or potential threats to the container's integrity.

  **The Core Mechanism:**
  TMR operates by shifting the locus of harm. In a standard rights debate, harm is done to *people* (e.g., displacement, lack of shelter). In TMR, harm is done to *space* (e.g., "overcrowding," "loss of character"). This allows the interlocutor to claim they are protecting a "good" (the neighborhood) without acknowledging they are violating the rights of specific people (the newcomers), because the newcomers are defined *ex ante* as agents of harm to the moral subject (the place).

  ---

  ### Boundary Conditions

  To ensure this concept is analytically useful, we must distinguish it from four adjacent concepts.

  #### 1. vs. Ordinary NIMBY Self-Interest
  *   **NIMBY:** "I oppose this because it harms *me* (financial loss, noise, congestion)."
  *   **TMR:** "I oppose this because it harms *Here*."
  *   **Distinction:** NIMBY is openly self-regarding. TMR mimics altruism or stewardship. The TMR advocate often concedes that *they* personally might not suffer materially, but argues that the "neighborhood" would suffer an ontological injury. This makes TMR harder to counter with economic incentives, as the claim is about *identity*, not utility.

  #### 2. vs. Status Quo Bias
  *   **Status Quo Bias:** A psychological preference for existing conditions due to loss aversion or inertia.
  *   **TMR:** A moral claim that the existing condition *ought* to persist because it holds a trust for the future.
  *   **Distinction:** Status quo bias is a cognitive error; TMR is a normative justification. A status quo biaser says, "I don't want change." A TMR advocate says, "Change violates the integrity of the community." TMR provides a *reason* for the bias that appeals to duty rather than comfort.

  #### 3. vs. Legitimate Democratic Input
  *   **Democratic Input:** Current residents have a procedural right to vote on zoning changes affecting their jurisdiction.
  *   **TMR:** Current residents have a *substantive* right to veto changes to preserve the "essence" of the place, even if the democratic process allows the change.
  *   **Distinction:** Democratic input is about *process* (who decides). TMR is about *outcome* (what must be preserved). TMR often emerges when democratic processes fail to produce the desired exclusion, framing the "will of the neighborhood" as a higher law than the vote of the city council.

  #### 4. vs. "Right to the City" (Lefebvre)
  *   **Right to the City:** Argues that all urban inhabitants (current and future) have a right to participate in the production of urban space. It is inclusionary and focuses on *use value* over *exchange value*.
  *   **TMR:** Argues that the *existing configuration* of space has a right to resist production by new inhabitants. It is exclusionary and focuses on *preservation value*.
  *   **Distinction:** Both treat the city as more than a market commodity. However, "Right to the City" expands the moral boundary to include the marginalized newcomer. TMR contracts the moral boundary to exclude the newcomer in the name of the place itself.

  ---

  ### Philosophical Commitments

  Adopting Territorial Moral Reification commits the interlocutor to three specific philosophical positions, often implicitly:

  **1. Metaphysical Realism about Neighborhoods**
  It requires believing that "the neighborhood" is an entity that persists through time more robustly than the people within it. It implies that a neighborhood has an *essence* (density, architecture, demographic makeup) that can be violated. If the people change but the buildings remain, TMR suggests the neighborhood is still "threatened" if the *social* texture changes.

  **2. The Trustee Paradox**
  It casts current residents as trustees of a legacy for future generations. However, it creates a paradox: *Which* future generations? TMR selectively advocates for the "future generations" who might live there *under the current rules*, while ignoring the "future generations" who are currently being barred from living there at all. It privileges the hypothetical future resident who wants a low-density neighborhood over the actual future resident who needs housing.

  **3. Derivative Moral Standing**
  It implies that human moral standing in this context is derivative of their relationship to the place. A current resident has standing because they "belong" to the place. A prospective resident lacks standing because they do not yet belong, and granting them standing would alter the place to which they seek to belong.

  ---

  ### The Collapse: The Membership Paradox

  The conceptual slipperiness you identified collapses when tested against the **Membership Paradox**.

  **The Paradox:**
  TMR argues that newcomers must be excluded to protect the moral integrity of the community. However, in a liberal democracy, moral community is typically defined by shared citizenship or humanity, not by geographic tenure.
  *   **If** the "neighborhood" is a moral entity, its rights must be grounded in the welfare of its members.
  *   **If** the newcomers are moral equals (which the interlocutor usually concedes in the abstract), they are entitled to become members.
  *   **Therefore,** to exclude them *because* they would change the community is to assert that the *configuration of the community* is more morally valuable than the *membership of the community*.

  **The Incoherence:**
  TMR cannot be made coherent without implicitly denying that newcomers are full members of the moral community.
  *   **Attempted Coherence:** "We are not excluding *people*, we are preserving *place*."
  *   **Refutation:** Places do not feel pain, suffer injustice, or hold rights. Only people do. To say a place is "harmed" is a metaphor for "the people currently here are distressed by the change."
  *   **The Trap:** If the harm is actually to the *current people* (distress, loss of familiarity), the argument reverts to standard NIMBYism (self-interest/preference). If the harm is to the *place itself*, the argument relies on a category error (reification).

  **The "Empty Lot" Test:**
  To expose TMR, ask: *If every current resident moved out tomorrow, would the neighborhood still have a right to exclude new development?*
  *   **If Yes:** You are arguing for the rights of ghosts/abstractions over living humans. (Pure Reification).
  *   **If No:** Then the rights derive from the *people*, not the *place*. If the rights derive from the people, then the welfare of the *new* people must be weighed against the welfare of the *old* people. The "character of the place" drops out as a relevant moral variable, leaving only a utilitarian calculation of human welfare, which generally favors upzoning given the housing crisis.

  ### Summary

  The move you have isolated is **Territorial Moral Reification**. It is distinct from NIMBYism because it cloaks self-interest in the language of stewardship and ontological preservation. It is conceptually slippery because it shifts the boundary of moral consideration from *persons* (who can be excluded) to *places* (which cannot be easily dismissed).

  However, it collapses under scrutiny because it requires treating a geographic abstraction as a rights-bearing entity capable of being "wronged" by the presence of human beings. To maintain this position, one must implicitly argue that the *preservation of a specific spatial arrangement* is a higher moral good than the *inclusion of new members* into the human community, a position that is difficult to defend without abandoning liberal egalitarian premises.
