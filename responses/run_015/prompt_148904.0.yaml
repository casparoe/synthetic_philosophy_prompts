answer: |-
  You are correctly remembering **Saul Kripke**. In *Naming and Necessity* (1970/1980), he argues for Origin Essentialism. His famous example is the Queen: she could not have been born of different parents. He extends this to the biological material: you come from *this* specific sperm and *this* specific egg.

  However, your "hardcore" version adds a layer Kripke didn't fully explicitize: **Matter vs. Information.** You are arguing that even if the *genetic information* is identical, the *material history* (natural vs. synthetic gametes) fixes identity. This moves from Origin Essentialism toward **Mereological Essentialism** (the parts matter) or **Historical Essentialism** (the causal path matters).

  Here is the breakdown of the defeaters, the specific scenarios you asked about, and where the position is most vulnerable.

  ### 1. The Synthetic Embryo Scenario (The Intrinsic Duplicate Argument)
  **The Scenario:** A lab creates a zygote with your exact DNA using synthetic gametes. It develops with your memories/personality.
  **Your Stance:** That is not you. It is a numerically distinct person.
  **The Defeater:** **The Supervenience Challenge.**

  This is the strongest metaphysical argument against your position. Physicalism generally holds that all facts about the world supervene on physical facts. If Entity A (You) and Entity B (Synthetic Clone) are **intrinsically identical** at the molecular level (same atomic arrangement, same neural connections, same DNA), what *truthmaker* exists for the claim that they are different people?

  *   **The Argument:** If two entities share all intrinsic physical properties, they must share all metaphysical properties (including identity). To claim they are different people solely because of their *history* requires positing a **haecceity** (a "this-ness") that is not grounded in physical reality.
  *   **Why it hurts OE:** It forces you to admit that identity is "external" to the organism. It implies that you could look at two identical humans, down to the atom, and one is "you" and the other is "not you," with no physical way to distinguish them. This looks like magic, not metaphysics.
  *   **Counter-move for you:** You must argue that persons are not just physical objects but **historical entities**. A dollar bill printed by the Treasury is money; a perfect forgery is not, even if chemically identical. You are arguing personhood works like currency, not like gold.

  ### 2. The Embryo Splitting (Twinning) Problem
  **The Scenario:** One zygote (Origin O) splits into Twin A and Twin B.
  **Your Stance:** Both come from Origin O.
  **The Defeater:** **The Individuation Problem.**

  Origin Essentialism states: *Necessarily, if Person P exists, P comes from Origin O.*
  It does *not* state: *If Origin O exists, only one Person P comes from it.*

  *   **The Argument:** If Twin A and Twin B both originate from the exact same zygote, then Origin O is not sufficient to individuate them. They share the exact same origin essential. So, what makes A distinct from B?
  *   **The "Could A have been B?" Question:** This is the killer. Since they share the same origin and (initially) the same genetics, is there a fact of the matter about which twin is which?
      *   If you say "Yes, A is necessarily A," you need a principle of individuation *other* than origin (e.g., spatial location at the moment of splitting).
      *   If you admit spatial location individuates them, then Origin isn't the *sole* essential property.
      *   If you say "There is no fact of the matter," you violate the Law of Identity (A = A).
  *   **Why it hurts OE:** It shows that Origin alone cannot account for numerical distinctness. If two people can have the *same* essential origin, then origin cannot be the unique fingerprint of identity.

  ### 3. The Non-Identity Problem (Metaphysical Version)
  **The Scenario:** Usually, this is an ethical problem (Parfit), but metaphysically it asks: How sensitive is identity to changes in conception?
  **The Defeater:** **The Sorites of Conception.**

  *   **The Argument:** Imagine the sperm that conceived you was delayed by 1 second. It's the same sperm, just later. Is that you?
      *   If OE says "Yes," then the *time* of origin isn't essential, only the matter.
      *   If OE says "No," then identity is terrifyingly fragile.
      *   Now imagine we replace the atoms of the original sperm one by one with synthetic atoms. At what percentage of replacement does it cease to be the "origin" that created you? 1%? 50%? 99%?
  *   **Why it hurts OE:** It creates a **vagueness problem**. If identity is a necessary, metaphysical fact, it shouldn't depend on vague boundaries. If there is no precise moment where "original matter" becomes "synthetic matter," then there is no precise moment where "you" become "not you." Metaphysical necessity shouldn't be vague.

  ### 4. What Would Change My Mind (The Weakest Point)
  If I were arguing against you, I would attack the **Physicalist Supervenience** point. Here is where Origin Essentialism is most likely to fail:

  **The "Blockage" Argument:**
  If the synthetic clone is physically identical to you, it will claim to be you. It will have your memories. It will feel your pain. If you say "It is not me," you are positing a difference that makes **no causal difference** to the universe.
  *   **Weakness:** Metaphysical theories usually aim to explain reality. If OE posits a distinction (You vs. Clone) that has no observable, physical, or psychological consequences, it risks being an **empty truth**. It becomes a linguistic game rather than a discovery about the nature of existence.
  *   **What would change my mind:** If you can demonstrate that **causal history** has ontological weight independent of current structure. You need to prove that *where* something came from is as real as *what* it is made of. The "Counterfeit Money" analogy is your best bet, but opponents will argue humans are natural kinds, not social kinds like money.

  ### 5. Summary of Defense Strategy
  To defend the "Hardcore" view in your club:

  1.  **Lean into the "Natural Kind" argument:** Humans are biological organisms, not software. Software can be copied (information); organisms are historical processes (matter + time). A clone is a delayed twin, not a resurrection.
  2.  **Accept the Twin Problem but limit it:** Argue that twinning is a biological anomaly where *one* origin produces *two* substances. It doesn't disprove OE; it just shows origin is necessary but not sufficient for uniqueness.
  3.  **Reject Supervenience for Persons:** Argue that persons are not just physical objects. We are **continuants**. A river is not just H2O; it is H2O flowing through a specific channel over time. If you pipe H2O into a different channel, it's a different river, even if the water is identical. You are the river, not the water.

  **Final Verdict on Kripke:** You aren't mixing him up. He is the source. But he focused on *which* gametes, not necessarily the *naturalness* of them. Your "Hardcore" extension is a valid philosophical move, but it makes you vulnerable to the charge of positing "spooky" non-physical properties (haecceities) to distinguish intrinsically identical beings.
