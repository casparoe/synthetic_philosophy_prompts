answer: |-
  **The Case**
  Dr. Aris is the lead surgeon on a complex vascular repair; she is critically fatigued, raising her error risk to 40%, while her protégé, Lin, is rested but untested on this specific anatomical variation. The proposition $p$ is "Lin is competent to complete this procedure successfully." The evidence for $p$ is insufficient: Lin's general metrics are excellent, but there is no data on this specific variation, making the objective probability equivocal. Aris faces a forced, momentous choice: operate herself (high fatigue risk) or cede the scalpel to Lin. To maximize Lin's success, Aris must fully exit the immediate scrub zone; if she remains nearby "just in case," her non-verbal tension and micro-expressions of vigilance will signal distrust, disrupting Lin's flow and causing the very failure Aris fears. If Aris genuinely believes $p$, her physiology relaxes, she steps back, and Lin succeeds. If Aris merely *accepts* $p$ for pragmatic reasons while retaining doxastic doubt, her subconscious vigilance leaks, Lin falters, and the patient dies. The truth of $p$ (Lin's underlying capability) is fixed and independent of Aris's mind, but the *realization* of the good outcome is causally locked to Aris's genuine doxastic state.

  ***

  **The Analysis**

  **Clifford's Rule:** Clifford forbids believing $p$. The evidence is insufficient to warrant certainty regarding Lin's competence on this specific variation. To believe anyway is a dereliction of epistemic duty, corrupting the habit of weighing evidence. Clifford prescribes acting on the *probability*: Aris should accept $p$ as a working premise to let Lin operate, but she must remain vigilant (monitoring closely) because the evidence does not support full trust.

  **James's Argument:** James licenses believing $p$. The option is live (Lin might succeed), forced (Aris must choose who cuts), and momentous (life or death). Since the evidence is genuinely inconclusive (not merely absent, but balanced against Aris's fatigue), the intellect cannot decide. In such cases, the "passional nature" may lawfully decide the option. Believing $p$ creates the conditions for the patient's survival; withholding belief ensures the patient's death. The right to believe is vindicated by the necessity of the belief to secure the vital good.

  **The Belief-vs-Acceptance Move:** The evidentialist escapes by distinguishing *belief* (involuntary, truth-aimed) from *acceptance* (voluntary, policy-based). They argue Aris can *accept* $p$ as a premise for action (hand over the scalpel) without *believing* it. This preserves epistemic integrity while allowing pragmatic action.

  **Where the Third Route Breaks:** This move breaks at the point of **non-verbal leakage**. Acceptance is a cognitive policy that retains a "monitoring for error" stance; Belief is a cognitive state that resolves uncertainty. In this specific context, the "monitoring" stance inherent to acceptance manifests physiologically (tension, gaze, hesitation). Because the context is **doxastically transparent**—meaning the agent's internal uncertainty is perceptibly transmitted to the co-agent—the "act-as-if" strategy fails. The mechanism isn't stipulated magic; it is established social psychology (trust signaling). Acceptance cannot simulate the physiological relaxation of belief, and without that relaxation, the coordination fails.

  **The Feature Doing the Work:** The feature is **Doxastic Transparency**. The payoff (patient survival) is gated not by the action itself, but by the *authenticity of the cognitive state* driving the action. If you strip out transparency (e.g., Aris communicates via text or wears a full mask that hides all tension), the acceptance route works perfectly, and the evidentialist wins. The case only holds because human coordination in high-stakes environments often relies on subconscious trust signals that voluntary acceptance cannot replicate.

  **Strongest Cliffordian Reply:** "You are trading a long-term epistemic vice for a short-term gain. If Aris habituates believing without sufficient evidence here, she degrades her diagnostic reliability for future cases where the stakes are higher or the transparency lower. Saving one patient by corrupting the cognitive habits that save thousands is net-negative utility. She ought to train herself to act decisively *despite* doubt, rather than training herself to believe *without* evidence."

  **Name for the Condition:**
  The condition in which a payoff is available only to genuine belief rather than acceptance is best termed a **Doxastically Sensitive Payoff**. (Alternative: **Translucent Trust Condition**). "Doxastically Sensitive" captures that the *attitude* (doxastic state), not just the content or behavior, is a causal variable in the outcome function.
