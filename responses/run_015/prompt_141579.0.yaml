      *   *Wait, let's look at the literature.* This is close to "faith" discussions. The term "Pragmatic Encroachment" is relevant but not it. The specific constraint is that the *attitude* changes the outcome. Let's coin/dust off: **"Attitude-Sensitive Payoff."** Or **"Doxastic Efficacy."** Let's go with **"Doxastic Efficacy"** but define it clearly. Actually, **"Translucent Agency"** captures the idea that the agent's internal state shines through. Let's try to find a standard term. There isn't a perfect one. I will propose **"Doxastically Sensitive Outcome."** Or simpler: **"Belief-Exclusive Payoff."**
      *   *Re-reading prompt:* "Bonus if you can name the condition... 'conviction-dependent' doesn't feel right."
      *   *Suggestion:* **"Doxastic Transparency"** is the condition of the *context*. The payoff condition is **"Transparency-Gated."** Let's go with **"Doxastically Opaque"** (no).
      *   *Decision:* I will suggest **"Doxastically Transparent Context"** creates a **"Belief-Exclusive Payoff."** But I need a name for the *condition*. How about **"Cognitive Leakage"**? No.
