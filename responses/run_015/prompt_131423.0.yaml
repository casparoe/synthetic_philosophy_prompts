answer: |-
  ### The 15-Minute Accommodation Protocol
  **Purpose:** To balance *Access* (Anglo-American multiculturalism) with *Neutrality* (French *laïcité*).
  **Goal:** Determine if the request removes a barrier to education without converting public space into religious space.
  **Time:** 15 Minutes max. If you exceed this, you are arguing philosophy, not compliance. Hand off to the Dean.

  ---

  #### Step 1: The Sincerity & Conflict Gate
  **Question:** Is there a documented conflict between a sincere belief/practice and a specific university rule or schedule?
  *   **Yes:** Proceed to Step 2. (Do not adjudicate theology. If they have a letter from a chaplain/leader or a consistent history, accept it.)
  *   **No:** **HARD NO.** (This is a preference, not an accommodation.)
  *   **Time:** 3 mins.

  #### Step 2: The Burden-Shift Check (Practitioner Check #1)
  **Question:** If we deny this, who bears the cost?
  *   **Private Cost (Inconvenience):** The student is annoyed but can still attend class, eat, or graduate. (e.g., walking further to find halal food).
      *   **Action:** **HARD NO.** (Public institutions remove barriers, not preferences.)
  *   **Public Cost (Exclusion):** The student cannot access a core public good (education, housing, safety) without violating their belief. (e.g., missing a final exam, dropping a major due to dress code).
      *   **Action:** Proceed to Step 3. (High burden requires high justification to deny.)
  *   **Time:** 3 mins.

  #### Step 3: The Invisibility Audit (Practitioner Check #2)
  **Question:** Does this accommodation force non-adherents to navigate a *fixed* religious marker in a *shared* institutional space?
  *   **Yes:** The accommodation makes the *space itself* look religious or requires others to interact with religious signage to use the facility. (e.g., Permanent signage, dedicated funding for worship tools).
      *   **Action:** **MODIFY OR DENY.** (Violates *Laïcité*/Neutrality. Offer a neutral alternative.)
  *   **No:** The marker is on the *person* or is temporary/mobile. The space remains neutral. (e.g., Wearing a symbol, praying in a bookable neutral room).
      *   **Action:** Proceed to Step 4.
  *   **Time:** 4 mins.

  #### Step 4: Safety & Core Function
  **Question:** Does this compromise physical safety or the essential learning outcome of the course/activity?
  *   **Yes:** **HARD NO.** (Safety trumps accommodation. Do not negotiate physics.)
  *   **No:** Proceed to Step 5.
  *   **Time:** 2 mins.

  #### Step 5: The Endorsement Test (Resource Allocation)
  **Question:** Does this require the university to directly fund religious practice or signal preference for one group over others?
  *   **Yes:** (e.g., Buying prayer rugs, funding a chapel). **HARD NO.** (Establishment Clause risk.)
  *   **No:** (e.g., Allowing use of existing space, waiving a fee). **APPROVE.**
  *   **Time:** 3 mins.

  ---

  ### Running the Cases

  #### Case 1: Student Org Request (Prayer Room Funds + Signage)
  *   **Step 1 (Conflict):** Yes. Need space for Jumu'ah/prayer.
  *   **Step 2 (Burden-Shift):** **Public Cost.** Without space, they cannot practice during the day. However, is there *any* space? If they are totally excluded from campus life, it's a Public Cost. If they just have to find a corner, it's Private. *Assume for this ruling they have no quiet space.* -> **Proceed.**
  *   **Step 3 (Invisibility Audit):** **FAIL.** "Permanent signage" and "University funds" for a specific religious use make the *building* look religious. It forces a non-Muslim student to navigate a religiously marked zone in the Student Center.
      *   *Correction:* Offer a "Multi-Faith Quiet Room" (neutral signage, neutral funds).
  *   **Step 4 (Safety):** N/A.
  *   **Step 5 (Endorsement):** **FAIL.** Direct university funding for religious infrastructure violates public neutrality.
  *   **Ruling:** **DENY Funds and Permanent Signage.** Offer access to a neutral, bookable quiet room with no religious signage.
  *   **Why this hurts:** The student org feels this erases their visibility. They want *recognition*, not just *access*. The protocol prioritizes institutional neutrality over group recognition.

  #### Case 2: Chemistry Student (Religious Sleeve under Lab Coat)
  *   **Step 1 (Conflict):** Yes. Religious modesty vs. lab dress code.
  *   **Step 2 (Burden-Shift):** **Public Cost.** Denial means dropping the Chemistry major. This is exclusion from a public good. -> **Proceed.**
  *   **Step 3 (Invisibility Audit):** **PASS.** The sleeve is on the *person*, not the *room*. It does not mark the lab as religious space. Other students do not have to navigate a religious marker to use the lab benches. -> **Proceed.**
  *   **Step 4 (Safety):** **PASS.** Student offers documentation that the material is flame-resistant (FR). It is an *extra* layer, not a replacement. (Verify with Lab Safety Officer, but assume Yes for protocol). -> **Proceed.**
  *   **Step 5 (Endorsement):** **PASS.** No university funds used. No signal sent to others.
  *   **Ruling:** **APPROVE.**
  *   **Why this works:** It removes a barrier to education without compromising the neutrality of the physical space.

  ---

  ### The "Unpleasant" Answer
  **The Prayer Room Request (Case 1) is the one you won't like.**

  **Why:** Denying the funding and signage feels like a failure of inclusion. You know the students feel marginalized, and telling them "you can pray, but we can't label it or pay for it" feels like bureaucratic coldness. It privileges *Laïcité* (state blindness) over *Multiculturalism* (visible support).
  **The Hard Truth:** In a public university, you cannot use public funds to endorse specific religious practices without opening the door to every other group demanding the same. If you fund the Muslim prayer room, you must fund the Catholic chapel, the Jewish mikvah, etc. You likely can't afford that. Therefore, you must deny all direct religious funding to remain neutral. The "Multi-Faith Quiet Room" is the compromise, but it rarely satisfies the desire for *identity affirmation*. You will take the heat on this one.

  ---

  ### Where This Procedure Misfires (Limitations)
  Do not use this tool if:

  1.  **The "Invisibility" Bias:** The Invisibility Audit favors dominant cultures. A Christmas tree in the lobby is often coded as "decor" (Invisible), while a Ramadan banner is coded as "religious" (Visible). This protocol cannot fix that cultural bias; it will systematically flag minority markers as "violations" of neutrality more often than majority ones.
  2.  **Sincerity Disputes:** If you suspect the student is fabricating a belief to get a deadline extension, this protocol stops. Do not become a theologian. Hand off to the Dean/General Counsel immediately.
  3.  **The "Safety" Pretext:** In Case 2, if the Lab Safety Officer says "No" because they are uncomfortable, but the material is actually safe, this protocol fails. It assumes safety officers act on data, not bias. If you suspect discrimination masked as safety, you cannot solve it in 15 minutes.
  4.  **The Dean's Dilemma:** If you flag a "Values Call" to the Dean, expect a delay. This protocol is for *you* to clear the 80% of routine cases. If the case is politically charged (e.g., a controversial speaker requesting religious accommodation), the protocol will tell you to "Deny" or "Approve" based on rules, but the Dean may override you based on public relations.

  **Final Instruction:** If you reach Step 3 or 5 and the answer is "No," do not argue. State the constraint: *"We can accommodate your access, but we cannot endorse the practice with public funds/signage."* Then close the file.
