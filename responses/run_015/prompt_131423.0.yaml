      *Actually, let's flip it.* What if the framework forces a **Yes** on the Prayer Room funding that feels risky? No, that's legally dangerous.
      *Best path:* The framework forces a **No** on the Prayer Room *Funding/Signage*. This is the "unpleasant" truth of public compliance. You can accommodate the *need* (space) but not the *endorsement* (funds/signs). Student groups hate this distinction.

