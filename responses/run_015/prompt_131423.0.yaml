  2.  **Deconstruct the Philosophical Tension:**
      *   *Laïcité:* Public space must remain neutral. No state endorsement. Religion is private. Accommodation shouldn't impose on others or make the institution look religious.
      *   *Multiculturalism:* Equity requires removing barriers. If a rule disproportionately impacts a group, adjusting the rule is necessary for true access.
      *   *Synthesis:* The procedure needs to allow access (Multiculturalism) without endorsing or imposing (Laïcité). It needs to distinguish between *access* (letting someone in) and *promotion* (funding/signaling).

  3.  **Drafting the Decision Procedure (The "15-Minute Protocol"):**
      *   *Goal:* Filter out requests that violate public neutrality or impose undue burdens, while approving those that ensure access without endorsement.
      *   *Step 1: Sincerity & Necessity (The Threshold).* Is this actually religious/cultural? Is it necessary or just preferred?
      *   *Step 2: The Burden-Shift Check (Practitioner Check 1).* Who pays if we say no? If the student is excluded from education, that's a public good issue. If they just have inconvenience, that's private.
      *   *Step 3: The Invisibility Audit (Practitioner Check 2).* Does this force others to navigate religious markers? Does it make the space look "owned" by a faith?
      *   *Step 4: Safety & Core Function.* Does this break the educational mission or safety?
      *   *Step 5: The Endorsement Test (Laïcité Check).* Are we funding/promoting, or just accommodating?
