      *Wait, let's reconsider the "Unpleasant" aspect.*
      If I follow *Laïcité* strictly, I deny the prayer room funding.
      If I follow *Multiculturalism* strictly, I approve it.
      The framework is a hybrid.
      Let's make the **Lab Coat** the "Unpleasant" one? No, safety is usually a hard stop.
