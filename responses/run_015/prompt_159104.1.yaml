answer: |-
  This is a sharp observation, and you are right to feel that the existing vocabulary doesn't quite capture the specific rhetorical asymmetry you are describing. Gould and Lewontin's 1979 critique is indeed the mirror image of what you are seeing: they attacked the *over-production* of adaptive stories (pan-adaptationism), whereas you are identifying the *under-production* of mechanistic accounts for non-adaptive claims (let's call it pan-spandrelism, though that term isn't standard).

  There is no single established phrase in the philosophy of biology that isolates exactly this rhetorical move—the use of "byproduct" as a conversation-stopper that demands no evidence of its own while demanding maximal evidence from the adaptationist. However, we can carve this distinction precisely by combining concepts from logic and evolutionary theory.

  Here is a breakdown of the two patterns you identified, with terminology you can use in your newsletter.

  ### 1. The First Pattern: The Evidentiary Asymmetry

  You described a move where "byproduct" is asserted without naming the selected trait, the constraint, or falsification conditions. This is not a legitimate scientific null hypothesis; it is a rhetorical shield.

  **The Diagnosis**
  Logically, this is a combination of a **Shifted Burden of Proof** and an **Argument from Ignorance** (*argumentum ad ignorantiam*). The speaker implies: "Because you cannot prove this trait was selected for, I am entitled to claim it is a byproduct without proving *how* it arose as a byproduct."

  **Why it differs from a legitimate Null Hypothesis**
  In population genetics, "drift" or "constraint" can serve as a null hypothesis. However, a scientific null is a **methodological baseline**, not an **ontological conclusion**.
  *   **Legitimate Null:** "We assume drift until statistical tests show selection is a better fit. Here are the statistical tests."
  *   **The Move You Observed:** "We assume it is a byproduct because adaptationism is suspicious. No further mechanism is required."

  **Proposed Term: "The Bare Spandrel"**
  Since there is no canonical term, I suggest you coin **"The Bare Spandrel"** for your newsletter. It captures the idea that the claim is "naked" of the necessary architectural or developmental clothing.

  **Distinguishing the Honest vs. Conversation-Stopping Version**
  To discriminate between a legitimate byproduct claim and a "Bare Spandrel," apply the **Three-Point Test**. A legitimate claim must provide:
  1.  **The Anchor:** What *actual* selected trait is this a byproduct of? (e.g., "Music is a byproduct of language capacity.")
  2.  **The Mechanism:** What is the developmental or architectural link? (e.g., "The neural circuitry for syntax necessarily processes pitch.")
  3.  **The Falsifier:** What finding would overturn this? (e.g., "If we find populations with full syntax but no pitch processing," or "If the trait shows independent heritability.")

  If a speaker offers the label "spandrel" without these three, they are deploying a **Bare Spandrel**.

  **Boundary Cases**
  *   **Inside the Fallacy (Bare Spandrel):** "Religion is just a spandrel of our hyper-active agency detection."
      *   *Why:* Often, no specific selected trait is named (is it agency detection? social cohesion?), the developmental link is vague, and no evidence is offered for why the "spandrel" account is more likely than the adaptive one other than skepticism of adaptationism.
  *   **Outside the Fallacy (Legitimate Byproduct):** "Male nipples are byproducts of female breast development."
      *   *Why:* **Anchor:** Female lactation. **Mechanism:** Sexual monomorphism in early embryonic development (it is metabolically cheaper to use the same blueprint for both sexes than to switch genes off early). **Falsifier:** Evidence that male nipple morphology is under independent sexual selection.
  *   **Outside the Fallacy (Legitimate Null):** "We cannot distinguish this genetic variation from drift given the current sample size."
      *   *Why:* This is a statement about statistical power, not a claim about the history of the trait. It remains open to revision.

  ### 2. The Second Wrinkle: The Utility/Origin Slide

  You noted that when a supposed byproduct is shown to be useful *now*, people often conclude it must have been an adaptation *then*. This is a distinct error, though it often follows the first one.

  **The Diagnosis**
  This is a category error between **Current Function** (what a trait does now) and **Historical Origin** (why the trait was selected for in the past). In philosophy of biology, this is the difference between a trait's *causal role* and its *etiological function*.

  **Established Term: "The Adaptation/Exaptation Confusion"**
  You do not need to coin a term for this one; the standard terminology handles it well, provided it is used strictly.
  *   **Adaptation:** A trait shaped by selection *for* its current use.
  *   **Exaptation:** A trait shaped by selection for *one* use (or no use) and later co-opted for its current use.

  **The Error**
  The error is assuming that **Utility implies History.** Just because music *now* promotes bonding does not mean it was selected *for* bonding. It might have been a byproduct of language (Bare Spandrel) that was later co-opted for bonding (Exaptation). Concluding it was an Adaptation simply because it is useful is the **Etiological Slide**.

  **How it relates to the First Pattern**
  These two errors often work as a pincer movement against nuance:
  1.  **Phase 1:** The skeptic uses a **Bare Spandrel** to dismiss an adaptive story ("Music isn't adaptive, it's just cheesecake").
  2.  **Phase 2:** Evidence shows music *is* useful for bonding.
  3.  **Phase 3:** The skeptic (or a new speaker) performs the **Etiological Slide** ("Ah, since it's useful, it must be an adaptation after all").

  Both moves erase the middle ground: that a trait can be non-adaptive in origin but adaptive in current maintenance.

  ### Summary for your Newsletter

  You can frame this for your group as a call for **Symmetry of Evidence**.

  1.  **Adaptation claims** require evidence of fitness benefits and heritability.
  2.  **Byproduct claims** require evidence of developmental constraints and an ancestral anchor trait.
  3.  **Utility** tells us what a trait does now, not how it got here.

  If you want a specific phrase to label the first phenomenon in your text, I recommend **"The Bare Spandrel Move."** It is intuitive, mirrors the "Just-So Story" critique (which is well known to your readers), and highlights the lack of mechanistic detail.

  **Suggested phrasing for the piece:**
  > "We often hear that a trait is 'just a spandrel' or a 'byproduct.' When this is done rigorously, the speaker identifies the actual selected trait that dragged the byproduct along, and explains the structural link between them. But often, 'spandrel' is used as a magic word that stops inquiry. I call this **The Bare Spandrel Move**. It demands proof for adaptation but accepts byproduct claims without evidence of constraint. It is the mirror image of the 'Just-So Story': instead of inventing a use for everything, it invents a uselessness for everything, without doing the work to show how that uselessness arose."

  This approach validates your group's intuition, gives them a tool to spot the fallacy, and avoids getting bogged down in academic tribalism. It keeps the focus on the quality of the explanation, which is the heart of philosophy of science.
