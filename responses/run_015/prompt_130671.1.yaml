  Why it looked sound
  Premise (4) appeals to a deep intuition against bootstrapping. We naturally feel that if my belief causes my evidence, I haven't really found independent support. This "no circularity" rule feels like a basic requirement for rationality, making (4) seem like a truism rather than a contentious epistemic principle. Because the two-birder case involves prior expectations shaping what is seen, it triggers this alarm bell. The premise disguises a substantive epistemological claim as a logical constraint, leveraging our discomfort with circular reasoning to smuggle in a sceptical conclusion.

  The price of the alternatives
  Denying (1) requires narrowing "penetration" to exclude expertise, perhaps limiting it to explicit doxastic states rather than trained habits. The cost is losing a unified account of top-down influence, but it preserves justification for trained perceivers by definition. An attractive version restricts penetration to cases where beliefs directly alter phenomenology, excluding modular learning.
  Denying (4) allows penetrated experiences to justify, but demands a theory distinguishing reliable from unreliable penetration. The cost is accepting that etiology sometimes matters. The attractive version is a reliabilist constraint: etiology downgrades justification only if the penetrating state is epistemically irresponsible or unreliable.
  Denying (5) claims some experiences are theory-neutral, perhaps at early processing stages. The cost is contradicting holistic psychology, but it secures a foundational layer of unpenetrated data. The most attractive denial is (5), positing low-level features (color, motion) remain immune, preserving a baseline for justification without rejecting the reality of high-level penetration. This maintains foundationalism while acknowledging expert variation. However, denying (4) is philosophically richer. It forces us to articulate why expertise validates perception while bias invalidates it, leading to a nuanced epistemology of perception rather than a retreat to scepticism or mythical givenness. It accepts the psychological reality of (5) but rejects the epistemic fatalism of (4).

  Verdict
  The argument fails because it treats all cognitive influence as epistemically vicious. Regarding the two-birder case: it satisfies (1), as prior expectations clearly alter the visual experience of the flank patch. However, satisfying (1) does not entail scepticism. If the birders' expectations stem from reliable expertise, the penetration enhances rather than undermines justification. The case illustrates perceptual learning, not necessarily epistemic defeat. Thus, conclusion (6) does not follow.
