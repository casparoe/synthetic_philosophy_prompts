          *   Why? It's biological (bacteria), passed intergenerationally (often vertically or via close contact resembling germline fidelity), affects fitness (digestion/immunity), but isn't the host genome.
          *   If she calls *this* Natural Selection on the holobiont, she accepts non-genetic heredity.
          *   If she calls this "Ecological inheritance" and not Natural Selection proper, she sticks to the Germline Constraint.
      *   *Alternative:* **Epigenetic inheritance of stress responses.**
          *   If she accepts this as Natural Selection, the "Germline" rule is actually "Intergenerational Heredity" (broad).
          *   If she rejects it, she is a strict DNA-sequence fundamentalist.

      *   *Refinement:* Let's go with **Epigenetic Inheritance**. It challenges the "Gene vs. Development" boundary. Or **Microbiome**. Let's suggest **Microbiome** because it parallels the "pod" structure (community within individual) and transmission issues. Actually, **Birdsong** is closer to Orcas. But to test the *Natural Selection* definition specifically, **Epigenetics** is the hottest debate regarding the "Germline" definition.
      *   *Wait, looking at her profile:* She rejected Immune selection because "nothing gets passed through a germline." So the test must be: **Is there a case with intergenerational transmission that isn't DNA sequence?**
      *   *Proposal:* **Transgenerational Epigenetic Inheritance.** (e.g., methylation patterns passed to offspring affecting phenotype).
      *   *Why:* If she says "Yes, that's Natural Selection," then her rule is "Intergenerational Heredity." If she says "No, that's developmental noise/parental effect," her rule is "DNA Sequence Only." This clarifies if Culture (which is intergenerational but not DNA) has a shot.

  7.  **Drafting the Response:**
      *   *Tone:* Academic, strategic, empathetic to the student's precarious position.
      *   *Structure:*
          1.  The Verdict (Direct answer).
          2.  The Underlying Rule (The "Germline + Neo-Darwinian" synthesis).
          3.  Alternative Rules (Conflict-based, Label-aversion).
          4.  The Crucial Test Case (Epigenetics or Microbiome).
          5.  Strategic Advice for the Thesis (How to frame it to survive).

      *   *Refining the Verdict:* She will likely say: "The *capacity* to learn is under natural selection (genes/individuals). The *specific technique* is under cultural evolution (analogous but distinct). Do not conflate them." She will likely reject "Cultural Group Selection" as "Group Selection" (which she hates per Termites) and demand "Kin Selection" explanations for the teaching cost.
      *   *Refining the Rule:* "The Weismann Barrier Rule." Natural Selection requires a distinction between soma and germline, and transmission must cross that barrier. Culture crosses the *social* barrier, not the *Weismann* barrier.
      *   *Refining the Test:* **Maternally inherited endosymbionts (like Wolbachia).** It's genetic (bacterial), passed through germline (often), affects host fitness, creates conflict. Or **Epigenetics**. Let's go with **Epigenetics** as it's closer to the "information without DNA change" aspect of culture.

      *   *Wait, one nuance:* She accepts Kin Selection (Termite) as "Gene-level." Orcas are matrilineal. She might accept the *teaching behavior* as kin-selected genes. But the *spread of the technique*? That's the thesis. She will likely say the technique spread is "Cultural Drift" or "Cultural Evolution," not "Natural Selection."
      *   *Key distinction:* She separates "Selection" (Biological) from "Cultural Change."
      *   *Advice:* Frame it as **Gene-Culture Coevolution**. The genes are selected for the *ability* to transmit; the culture evolves by analogy. Don't claim the *culture* is the unit of *Natural* Selection. Claim the *pod* is the unit of *Cultural* Selection, which creates a niche for *Genetic* Selection.

  8.  **Final Polish:** Check against all constraints.
      *   Predict verdict? Yes.
