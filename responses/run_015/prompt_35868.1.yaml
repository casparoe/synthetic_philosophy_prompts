answer: |-
  This is a high-stakes interpretive challenge. Your supervisor is not a monolith; she is a specific *type* of evolutionary biologist with a coherent, albeit nuanced, internal logic. If you frame your thesis as "Natural Selection acting on cultural variants at the group level," you are walking into a minefield based on her record.

  Here is the prediction of her verdict, the reconstruction of her underlying rules, the alternative interpretations, and the strategic advice you need to survive the proposal.

  ### 1. The Predicted Verdict
  She will likely rule that **this is Cultural Evolution, but *not* Natural Selection proper.**

  She will argue that the **unit of Natural Selection** remains the **gene (coding for social learning capacity)** or the **individual organism (maximizing inclusive fitness)**. She will likely insist that the spread of the beaching technique is a *consequence* of selection on learning mechanisms, not a case of selection on the technique itself.

  Furthermore, regarding the "teaching cost": She will explicitly reject "Pod-level selection" or "Cultural Group Selection." She will demand you frame the teaching behavior as **Kin Selection**. Since orca pods are matrilineal, she will argue the adults teach because they share genes with the calves (inclusive fitness), not because "the pod survives." If you use the phrase "Group Selection," she will correct you to "Kin Selection" or "Inclusive Fitness."

  **The Danger Zone:** If your thesis framing relies on the claim that "Culture is a second system of Natural Selection with its own units," she will shoot it down based on the **Immune System Precedent**. To her, "Natural Selection proper" requires germline heredity. Culture is somatic/social transmission. It is analogous to selection, but it is not *Natural Selection*.

  ### 2. The Rule She Is Running: "The Weismann-Germline Constraint"
  The most consistent rule across her four data points is a commitment to the **Weismann Barrier** as the defining line for Natural Selection.

  *   **Giraffe:** Organism is the unit because the phenotype matches the germline interest (no conflict).
  *   **Termites:** Genes are the unit because the phenotype (sterility) contradicts individual reproduction, requiring a germline explanation (Kin Selection).
  *   **Meiotic Drive:** Genes are the unit because there is intragenomic conflict (germline vs. germline).
  *   **Immune System:** **Not Natural Selection** because the "selected" cells (B/T cells) are somatic; the changes die with the host and do not cross the germline barrier.

  **Application to Orcas:** The hunting technique is transmitted socially (somatic-to-somatic), not germline-to-germline. Therefore, by her Immune System logic, the spread of the technique is **not Natural Selection proper**. It is an evolutionary process, but distinct from the biological natural selection that shapes the orca's genome.

  ### 3. Alternative Rules That Fit Her Record
  While the Germline Constraint is the strongest, two other rules fit her history and could complicate your defense:

  **A. The "Conflict Heuristic" Rule**
  *   **Logic:** The unit of selection is the **Organism** *unless* there is a conflict of interest. If there is conflict (sterile workers, meiotic drive), the unit drops down to the **Gene**.
  *   **Fit:** Explains Giraffe (no conflict = organism), Termites/Meiotic Drive (conflict = gene).
  *   **Risk:** She might argue that if the teaching behavior reduces the adult's hunting success (cost) but helps the pod, there is a conflict between Individual and Group. She will resolve this by forcing you to prove there is *no* conflict via Kin Selection (i.e., "It helps the individual's genes, so it's actually Individual/Kin selection, not Group selection").

  **B. The "Terminological Orthodoxy" Rule**
  *   **Logic:** She is a Neo-Darwinian orthodox regarding labels. "Group Selection" is a banned phrase associated with Wynne-Edwards (1960s), which she views as discredited. "Kin Selection" is the approved Hamiltonian terminology.
  *   **Fit:** Explains her annoyance at the Termite label.
  *   **Risk:** Even if you prove pod-level benefits, she will forbid you from calling it Group Selection. You must call it "Kin-selected cultural transmission."

  ### 4. The Crucial Test Case: Transgenerational Epigenetics
  To distinguish between the **Germline Constraint** (DNA sequence only) and a broader **Intergenerational Heredity** rule (any information passed to offspring), you should float a hypothetical case about **Transgenerational Epigenetic Inheritance**.

  *   **The Case:** Imagine a mammal where stress responses are methylation-marked in the sperm/eggs and passed to offspring, affecting survival, without changing the DNA sequence.
  *   **The Question:** "Is this Natural Selection proper?"
  *   **Why this separates the rules:**
      *   If she says **YES**: Then her rule is "Intergenerational Heredity," and you have an opening to argue that high-fidelity cultural transmission in orcas is functionally equivalent to epigenetic inheritance.
      *   If she says **NO** (Likely): Then she is a **DNA Fundamentalist**. Her rule is strictly "Germline DNA Sequence." This confirms that your cultural thesis *cannot* be framed as Natural Selection proper. You must frame it as **Gene-Culture Coevolution**.

  ### 5. Strategic Advice for Your Framing
  You do not need to change your science, but you must change your **ontology** to match hers. If you call it "Natural Selection on Cultural Variants," she will fail you. If you call it "Cultural Evolution driving Genetic Selection," she may pass you.

  **Do:**
  1.  **Use "Cultural Evolution" not "Natural Selection":** Explicitly distinguish the two. Acknowledge her Immune System rule. State: *"While cultural transmission does not meet the criteria for Natural Selection proper (lacking germline heredity), it constitutes a distinct evolutionary system that creates selection pressures on the genome."*
  2.  **Frame the Teaching as Kin Selection:** Do not argue that pods survive better than other pods (Group Selection). Argue that *females who teach their kin* have higher inclusive fitness than females who do not. This satisfies her Termite rule.
  3.  **Focus on Genes for Learning:** Make the primary unit of your biological analysis the **genes underlying social learning capacity**. The *culture* is the environment in which these genes are selected.
  4.  **Avoid "Group Selection":** Use "Multilevel Selection" only if necessary, but prefer "Inclusive Fitness" or "Kin Selection."

  **Don't:**
  1.  **Don't claim the "Meme" is the Unit of Natural Selection:** To her, a meme is not a replicator in the biological sense (see Immune System).
  2.  **Don't claim the Pod is the Biological Unit:** The pod is the unit of *cultural* transmission, but the *individual* (or gene) is the unit of *biological* selection.

  **Summary Prediction:** She will tell you that your thesis is about **Cultural Evolution**, and that this process exerts **Selection Pressure** on the **Genes for Social Learning**. If you frame it as "Natural Selection acting on Culture," she will say you are conflating somatic selection (Immune) with germline selection (Natural). Adjust your abstract to reflect **Gene-Culture Coevolution** where the *gene* is the ultimate unit of biological selection, and you should be safe.
