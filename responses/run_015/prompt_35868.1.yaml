          4.  *Clonal selection (immune system):* Selection = Yes; Natural Selection proper = No (no germline transmission). (Requires heredity/germline).
      *   **The Case:** Orca pods, cultural transmission of hunting technique (beaching), teaching cost to adults, pod-level benefit (tradition spreads, pods do better).
      *   **Tasks:**
          1.  Predict her verdict.
          2.  Identify the underlying rule she seems to be running.
          3.  Identify alternative rules that fit her record.
          4.  Propose a further case to distinguish between these rules.
          5.  Address the stakes (thesis framing).

  2.  **Deconstruct the Supervisor's Philosophy:**
      *   *Point 1 (Giraffe):* She rejects strict Dawkins-style gene-centrism for standard adaptation. She thinks organisms are the visible unit of selection. *However*, she doesn't deny genes exist. She calls gene-talk "bookkeeping" here.
      *   *Point 2 (Termites):* When altruism threatens individual selection, she switches to genes (Kin Selection). She explicitly rejects "Group Selection" labels for this. This suggests she is a orthodox Neo-Darwinist regarding altruism (Hamilton/Williams/Maynard Smith school) but dislikes the "Group Selection" branding.
      *   *Point 3 (Meiotic Drive):* She admits genes can be "selfish" against the organism. This contradicts Point 1 slightly (where genes were just bookkeeping), but clarifies that *when conflict exists*, the gene is the real unit. So: Harmony = Organism; Conflict = Gene.
      *   *Point 4 (Immune System):* This is the crucial constraint for the user. Selection requires *germline* transmission (or at least intergenerational heredity). Somatic selection isn't "Natural Selection proper."

      *   *Synthesis:* She is likely a **Mainstream Evolutionary Biologist with a Neo-Darwinian core but a Pragmatic Phenotypic face.** She believes Natural Selection requires:
          1.  Variation.
          2.  Heredity (Germline/Intergenerational).
          3.  Differential Fitness.
          *   *Unit:* Usually the organism, *unless* there is intragenomic conflict (then gene) or altruism (then inclusive fitness/gene).
          *   *Constraint:* It must be genetic heredity to count as "Natural Selection proper" (based on the immune system comment).

  3.  **Evaluate the Orca Case against her Rules:**
      *   *Case:* Cultural transmission (social learning), not genetic. Teaching involves cost (altruism/energy). Pod success varies.
      *   *Her likely reaction:*
          *   Is it selection? Yes, there is variation and differential success.
          *   Is it *Natural* Selection *proper*? **No.** Why? Because the information (beaching technique) is not passed through the germline. It's somatic/cultural. (See Immune System rule).
          *   What is it then? Co-evolution of genes for social learning + cultural drift/diffusion.
          *   Unit of selection? She will likely say the *genes for social learning* are the unit of natural selection. The *culture* is an ecological factor or a developmental outcome.
          *   Will she accept "Group Selection"? No (see Termite rule). She will call it "Kin Selection" or "Inclusive Fitness" if the pods are matrilineal (which they are).
          *   Will she accept "Cultural Group Selection"? Probably not as "Natural Selection." She might tolerate "Cultural Evolution" but distinguish it sharply from biological Natural Selection.

  4.  **Formulate the Prediction:**
      *   **Verdict:** She will likely say this is **Cultural Evolution**, *not* Natural Selection proper. The unit of Natural Selection remains the **gene (for social learning capacity)** or the **individual (expressing the phenotype)**. She will reject "Cultural Variant" as a unit of *Natural* Selection.
      *   **Reasoning:** The immune system precedent is the killer. No germline transmission of the *specific hunting technique* means it fails her test for "Natural Selection proper."
      *   **Framing Risk:** If the user frames the thesis as "Natural Selection acting on cultural variants," she will reject it. If framed as "Gene-Culture Coevolution" where genes are selected for the *capacity* to learn, she might accept it.

  5.  **Identify the Underlying Rule (The "Germline Constraint"):**
      *   *Rule:* Natural Selection proper requires intergenerational transmission via a germline (or equivalent genetic heredity). Somatic/Cultural selection is analogous but distinct.
      *   *Alternative Rule 1 (The "Conflict" Rule):* Unit is Organism unless there is conflict (then Gene). (Fits Giraffe, Termites, Meiotic Drive). Doesn't fully explain Immune System rejection.
      *   *Alternative Rule 2 (The "Label" Rule):* She hates "Group Selection" labels. She prefers Kin/Inclusive Fitness terminology. (Fits Termites).
      *   *Alternative Rule 3 (The "Bookkeeping" Rule):* Gene-talk is only useful when organism-talk fails (Altruism/Conflict). Otherwise, Organism is the unit. (Fits Giraffe, Termites, Meiotic Drive).

      *   *Best Fit:* The **Germline/Heritability Constraint** combined with **Neo-Darwinian Orthodoxy on Altruism**. She distinguishes Biological Evolution (Genes) from other evolutionary processes (Culture, Immune).

  6.  **Develop the "Crucial Experiment" (Case to pull rules apart):**
