      *(Self-Correction during drafting)*: Be careful not to tell the user to lie. Tell them to align terminology. If she hates "Group Selection," use "Kin Selection" or "Multilevel Selection" carefully. If she hates "Cultural Natural Selection," use "Cultural Evolution" distinct from "Biological Natural Selection."

      *Wait, looking at the Termite point again:* "Gets annoyed if you call it group selection." This is a huge red flag for any "Cultural Group Selection" framing. Even if the pods do better, she will want the explanation reduced to individual/inclusive fitness benefits (e.g., teaching kin increases inclusive fitness).
      *Looking at the Immune point:* "Not natural selection proper." This is the biggest threat. If culture isn't germline, it's not natural selection proper.
      *Conclusion:* She will likely force the user to frame the *teaching behavior* as genetically selected (Kin Selection) and the *technique spread* as a separate process (Cultural Evolution) that *interacts* with selection, but is not selection itself.

