      *   **Problem:** The supervisor has strong, specific, and seemingly inconsistent views on the "units of selection" debate. The user needs to predict her verdict on the orca case to avoid framing the thesis in a way she'll reject (specifically, fearing she might rule it "not natural selection proper").
      *   **Supervisor's Track Record (Data Points):**
