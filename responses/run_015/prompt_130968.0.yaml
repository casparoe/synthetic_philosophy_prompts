answer: |-
  This is a sophisticated puzzle, and you have correctly identified a boundary condition in the logic of coercion that often gets glossed over in standard treatments of brinkmanship. You are describing the point where a **conditional threat** collapses into an **unconditional prediction**.

  There is no single, universally standardized noun phrase for this specific failure mode (like "Nash Equilibrium"), but in the literature of strategic studies and game theory, it is most precisely carved out under the concept of **Loss of Negative Control** within the framework of **Schelling's Doomsday Machine**.

  Here is the conceptual carving you need for your dissertation, distinguishing it from its neighbors and defining its edges.

  ### 1. The Names
  If you need a label, you have three options depending on the register of your chapter:

  *   **The Archetype:** **"The Doomsday Machine Dynamic."** Schelling (*The Strategy of Conflict*, 1960) explicitly discusses this. He notes that a device that automatically retaliates is the perfect deterrent *until* the adversary realizes compliance cannot stop it. At that point, it ceases to be a bargaining chip and becomes a environmental hazard.
  *   **The Technical Term:** **"Loss of Negative Control."** In nuclear strategy and crisis stability literature, "positive control" is the ability to make a weapon go; "negative control" is the ability to *stop* it from going. Your configuration describes the total erosion of negative control.
  *   **The Analytical Description:** **"The Breakdown of Conditionality."** A coercive threat is defined by its contingency ($A \rightarrow B$ *if* $\neg X$). Your configuration describes the moment the contingency is severed ($A \rightarrow B$ *regardless*).

  ### 2. The Conceptual Carving
  You noted this is not standard brinkmanship, nor simple credibility. Here is how it differs from its nearest neighbors:

  **Vs. Brinkmanship (Schelling's "Threat that Leaves Something to Chance")**
  *   **Brinkmanship:** Relies on *risk*. A says, "I might lose control." The uncertainty creates fear, but A retains the theoretical ability to pull back if B complies. The probability of disaster is a function of B's non-compliance.
  *   **Your Configuration:** Relies on *certainty of incapacity*. A says (effectively), "I *have* lost control." The probability of disaster is 1.0 regardless of B's action.
  *   **The Difference:** Brinkmanship creates a *slope* B can step back from. Your configuration creates a *cliff* B is already standing on.

  **Vs. The Commitment Problem (Fearon/Interstate Bargaining)**
  *   **Commitment Problem:** Usually refers to A's inability to promise *future* restraint (e.g., "I won't attack you after you disarm").
  *   **Your Configuration:** This is an inability to promise *immediate* restraint. It is not about time inconsistency; it is about mechanical impossibility.
  *   **The Difference:** A commitment problem prevents a deal from being *sustainable*. Your configuration prevents a deal from being *possible*.

  **Vs. The Security Dilemma (Jervis)**
  *   **Security Dilemma:** B fears A's capabilities because B is unsure of A's *intentions*.
  *   **Your Configuration:** B knows A's intentions (A wants B to comply) but knows A lacks the *capacity* to reward compliance.
  *   **The Difference:** The Security Dilemma is driven by uncertainty of intent. Your configuration is driven by certainty of incapacity.

  ### 3. The Edges and Boundary Conditions
  You asked specifically about B's knowledge and A's residual capacity. These are the critical variables that define whether this configuration exists.

  **Edge 1: Common Knowledge of Incapacity**
  *   **Requirement:** For this dynamic to trigger, B must know (or believe with high probability) that A has lost negative control.
  *   **If B is Ignorant:** If B believes A can still stop the machinery, B complies. The threat works *because* B is misinformed about the degree of hand-tying.
  *   **If B is Certain:** If B knows A cannot stop it, the coercive leverage drops to zero.
  *   **Dissertation Point:** This creates a perverse incentive for A to *obscure* the degree of their own hand-tying. Total transparency regarding the "automaticity" of the threat destroys the threat. This is the **"Transparency Paradox of Hand-Tying."**

  **Edge 2: Residual Capacity (The "Kill Switch")**
  *   **Requirement:** The dynamic only holds if A's control is effectively zero.
  *   **If Residual Capacity Exists:** If A retains even a slim capacity to abort (e.g., a "fail-deadly" system that can be overridden by a specific code), the conditionality is restored. B complies to activate the override.
  *   **The Threshold:** The configuration emerges only when the cost/difficulty of A exercising residual control exceeds the timeline of the crisis. If A *could* stop it but needs 24 hours to do so, and the strike happens in 12, it functions as total loss of control.
  *   **Dissertation Point:** The boundary is not binary (control vs. no control) but temporal (time-to-compliance vs. time-to-impact).

  **Edge 3: B's Best Response (Refusal vs. Preemption)**
  You identified B's two responses: refusal or preemptive strike. These map onto two distinct strategic calculations:
  *   **Refusal ("Costs are Sunk"):** If the threat is punitive (e.g., sanctions, limited strike), B calculates that compliance costs + inevitable punishment = worse than refusal + inevitable punishment. This is **utility indifference**.
  *   **Preemption ("Use it or Lose it"):** If the threat is existential (e.g., nuclear annihilation), B calculates that waiting for the automatic response yields a worse outcome than striking now to degrade A's ability to carry it out. This creates **crisis instability**.
  *   **Distinction:** The first is a bargaining failure; the second is a stability failure. Your configuration explains why hand-tying can cause *war* (preemption) rather than just *failed coercion* (refusal).

  ### 4. Suggested Framing for the Chapter
  Since there isn't a single noun like "The Trap," I recommend framing this as the **"Limit of Credible Commitment"** or the **"Paradox of Automaticity."**

  You can argue that coercion requires a specific ratio of **Credibility $\times$ Control**.
  *   Standard Brinkmanship increases Credibility by slightly lowering Control (risk).
  *   Your Configuration increases Credibility by eliminating Control (certainty).
  *   **The Formula:** Coercive Power = Credibility $\times$ (Ability to Withhold).
  *   When (Ability to Withhold) $\rightarrow$ 0, Coercive Power $\rightarrow$ 0, regardless of Credibility.

  This allows you to cite Schelling's *Doomsday Machine* as the intuitive anchor, use **Loss of Negative Control** as the technical mechanism, and define the boundary as the **Breakdown of Conditionality**. This gives you the analytical precision required for a dissertation without forcing a non-existent term.
