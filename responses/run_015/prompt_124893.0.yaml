answer: |-
  Your skepticism is well-founded. Your friend's summary is a fascinating cocktail of half-truths, a major case of mistaken identity, and a cynical over-correction. While she captures the *spirit* of some sociological critiques of moral philosophy, she misrepresents the specific philosophical claims, particularly regarding Bernard Williams.

  Here is a breakdown of what is accurate, what is distorted, and what is simply wrong in her summary.

  ### 1. The "Williams" Confusion (The Biggest Error)
  **Verdict: Wrong.**

  This is the most critical error in your friend's summary. There are two famous "Williams" relevant here, and she has conflated them.

  *   **Eric Williams (1911–1981):** A Trinidadian historian and the first Prime Minister of Trinidad and Tobago. He wrote *Capitalism and Slavery* (1944). His thesis was indeed that British abolitionism was driven primarily by economic shifts (industrial capitalism made slave labor less profitable than wage labor) rather than pure humanitarianism.
  *   **Bernard Williams (1929–2003):** A British moral philosopher. He wrote *Ethics and the Limits of Philosophy* and *Shame and Necessity*. He was concerned with meta-ethics, moral psychology, and the "morality system."

  **Why this matters:** Bernard Williams did not argue that slavery ended because of industrial capitalism. He argued that modern moral philosophy often ignores the role of **social context and psychology**. While he was skeptical that abstract rational argument *alone* drives change, he never made the specific economic determinist claim your friend attributes to him. Attributing Eric Williams' historical thesis to Bernard Williams is a category error.

  ### 2. Appiah on Dueling and Honor
  **Verdict: Mostly Accurate, but slightly simplified.**

  Your friend's summary of Kwame Anthony Appiah's book *The Honor Code: How Moral Revolutions Happen* (2010) is much closer to the mark.

  *   **The Claim:** Appiah argues that moral revolutions (like the end of dueling in England, foot-binding in China, or slavery in the British Empire) are rarely driven by people suddenly realizing a practice violates a universal rational principle.
  *   **The Mechanism:** Instead, change happens when the **honor code** shifts. In the case of dueling, the aristocracy didn't stop because a philosopher proved violence was wrong. They stopped because the rising middle class viewed dueling as barbaric, and the aristocracy craved the respect of that middle class. To maintain their status (honor), they had to abandon the practice.
  *   **The Distortion:** Your friend says norms collapse when elites realize practices are "hurting their economic interests." Appiah focuses more on **social standing and shame** than pure economics. For Appiah, the currency is *reputation*, not just profit.

  ### 3. The Role of Rational Argument
  **Verdict: Distorted / Too Cynical.**

  Your friend concludes that because social pressure drives change, "moral philosophy is basically useless." Neither Williams (Bernard) nor Appiah actually claims this.

  *   **Appiah's View:** Appiah does not say arguments are useless. He says they are **insufficient on their own**. In *The Honor Code*, he argues that moral arguments provide the *vocabulary* for the shift, but they need the *engine* of honor to move.
      *   For example, abolitionists *did* make moral arguments about human equality. But those arguments only gained traction when they successfully framed slavery as a stain on British *honor* ("How can a free nation hold slaves?"). The argument mattered, but it had to be translated into the language of social identity to work.
  *   **Bernard Williams' View:** Williams argued that moral philosophy cannot stand outside of history and culture to dictate rules. He believed philosophy helps us understand our "thick" ethical concepts (like *cruel*, *brave*, *treacherous*) which are embedded in social life. He didn't say philosophy is pointless; he said it shouldn't pretend to be a "view from nowhere."

  **The Takeaway:** Philosophy is not the *spark*, but it is often the *fuel*. It clarifies the reasons that social movements use to shame elites.

  ### 4. Honor-Worlds vs. Dignity-Cultures
  **Verdict: Nuanced Misinterpretation.**

  Your friend mentions Appiah's distinction between honor and dignity but uses it to reinforce the idea that "arguments only work once the culture has already shifted." This misses the dynamic relationship Appiah describes.

  *   **Honor:** Is hierarchical and external. It depends on what your peers think of you. (e.g., "A gentleman does not duel.")
  *   **Dignity:** Is universal and internal. It depends on inherent worth. (e.g., "All humans have rights.")
  *   **The Interaction:** Appiah argues that modern moral progress often involves expanding the circle of **dignity**. However, the *mechanism* to achieve this often relies on **honor**.
      *   Abolitionists appealed to the *dignity* of the enslaved, but they motivated the British public by appealing to the *honor* of the Empire.
      *   So, it is not that arguments only work *after* the shift. Rather, moral arguments help *engineer* the shift by redefining what is honorable. Philosophy helps us construct the new honor code.

  ### 5. Does the Conclusion Follow? ("Moral Philosophy is Pointless")
  **Verdict: No.**

  The conclusion that you should "just work on shifting the honour codes and material interests of the elite" is a pragmatic takeaway, but it does not render philosophy pointless for two reasons:

  1.  **Defining the Goal:** How do you know *which* honor codes to shift? Why is ending slavery better than keeping it? Material interest and honor are neutral tools; they can be used for good or evil. Moral philosophy provides the normative justification for *why* we should target certain practices.
  2.  **Creating the Vocabulary:** As Appiah shows, shifting an honor code requires new language. You need philosophers and thinkers to articulate *why* a practice is shameful. Without the intellectual work of the Enlightenment, the British aristocracy would never have had the conceptual resources to view slavery as "dishonorable" rather than "economically necessary."

  ### Summary of Corrections

  | Claim by Friend | Accuracy | Correction |
  | :--- | :--- | :--- |
  | **Bernard Williams on Slavery** | **Wrong** | This is **Eric Williams** (historian), not Bernard Williams (philosopher). Bernard focused on moral psychology, not economic history. |
  | **Moral Argument Never Works** | **Distortion** | Appiah argues argument is *necessary but insufficient*. It needs social traction (honor) to become effective. |
  | **Elites move on Money/Interest** | **Partial** | Appiah emphasizes **Honor/Status** more than pure economics. Elites move when they fear losing social respect. |
  | **Philosophy is Pointless** | **False** | Both philosophers see philosophy as essential for defining values and providing the language for social change, even if it isn't the sole engine. |
  | **Williams & Appiah are the Same** | **Wrong** | They share a skepticism of abstract rationalism, but their projects are different. Bernard is meta-ethical; Appiah is social-political. |

  ### Final Verdict for Your Chat
  You can tell your friend she has a strong grasp of Appiah's *sociological* mechanism but has conflated two different Williamses and drawn a conclusion neither philosopher would accept.

  A better summary of their shared insight is: **Moral arguments do not float in a vacuum.** They only become effective when they are taken up by social practices, identities, and emotions (like shame and honor). Therefore, if you want to change the world, you cannot just write better logic puzzles; you have to understand the social psychology of the people you are trying to persuade. But that doesn't make the arguments useless—it makes the *context* of the arguments vital.
