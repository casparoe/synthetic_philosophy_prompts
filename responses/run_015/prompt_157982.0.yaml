      *   *System 2 (Welfare Fraud):* Predictive policing of poverty. Risks tyranny of opinion/prejudice encoded. Mill would likely hate the presumption of guilt without human oversight.
      *   *System 3 (Chatbot):* Trained on colonial case reports. Reproduces colonial categories ("respectable household"). Mill hated customary stagnation but also hated colonial arrogance. This traps citizens in past colonial logic.
      *   *The Data Clause:* Forecloses local learning. This violates the core condition of Millian tutelage: improvement must happen. If the state doesn't learn, it's not tutelage, it's dependency.
      *   *Consent:* It's elected and popular. Mill values liberty, but also believes people can choose wrongly if they don't understand the long-term impact on their capacity. He might respect the consent but question the *quality* of the consent given the complexity.
      *   *Uniformity:* One algorithm replaces local variation. Mill hates this ("experiments in living").

