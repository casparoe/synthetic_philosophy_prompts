answer: |-
  Here is the principle, the application, and the ammunition for Friday.

  ### The Principle of Independent Constraint

  A historical claim is pseudohistory if it violates either of these two clauses:

  1.  **Universal Method:** The methods used to analyse evidence must be capable of producing results that contradict the theorist's desired conclusion. If the method is tailored so that it *only* yields the theorist's result (or results that fit a pre-existing pattern), it is pseudohistory.
  2.  **Costly Rescue:** When evidence contradicts the theory, saving the theory must require positing new facts that are themselves vulnerable to independent falsification. You cannot simply re-categorise the contradictory evidence as 'anomalous', 'corrupt', or 'exceptional' without offering a way to test that exception.

  **Motivation:**
  *   **Clause 1** is motivated by **(A) Fomenko** and **(F) The Megalithic Yard**. Fomenko's statistical method is a black box designed to find duplicates; it doesn't allow for the possibility that the king-lists are real. The Megalithic Yard requires massaging the measurements of hundreds of circles to fit a number; if a circle doesn't fit, it's 'damaged' (see Clause 2), but the Yard itself is never at risk. Contrast **(G) The Alpine Silver**: the chemical analysis could have shown multiple sources. The method constrained the conclusion.
  *   **Clause 2** is motivated by **(D) The Church Grid** and **(E) The Abbey Charter**. The surveyor saves his grid by calling non-fitting churches 'rebuilt', but offers no independent architectural evidence for the rebuilding. It costs him nothing. The amateur historian claimed the charter was a forgery; this was risky. If the witness list had been plausible, he would have been wrong. When the cartulary appeared, it didn't just save his theory; it tested the *reason* for his theory (the anachronism).

  ### Application to Your Stuck Cases

  **Case (H) The Metal Detectorist:**
  Your principle forces you to admit **you cannot judge this yet.** It is currently **Undecidable**.
  *   *Why:* If his inference ("ritual deposit") is based on independent typological features (e.g., "coins are uncirculated and arranged by date"), it passes Clause 1. If he says "it's ritual because I can't think of an economic reason," it fails. Crucially, Clause 2: if you find a purse clasp nearby, does he say "Ah, my mistake," or "The clasp was added later"? Until he specifies what evidence *would* make it a savings hoard, he is failing the Constraint test. You must drop the verdict that it is a "hypothesis" until he defines the risk.

  **Case (I) Your Girlfriend's Thesis:**
  Your principle confirms this is **History**, not pseudohistory.
  *   *Why:* Her political commitment is motivation, not method. Clause 1 is satisfied if her philological tools would identify male authorship if the evidence pointed that way. Clause 2 is satisfied if she admits that finding definitive male attribution in a core text would damage the genre theory. The fact that she *wants* it to be true is irrelevant; the question is whether her method allows it to be false.

  ### Verdicts You Must Drop or Modify

  1.  **Drop certainty on (H).** You cannot classify it as "ordinary inference" or "wishful thinking" without knowing if the claim is risky. The principle exposes that your intuition here is just a guess.
  2.  **Modify (C) The Pictish Professor.** You call him a crank. The principle clarifies *why*: it's not that he's wrong, but that his "immaculate footnotes" serve Clause 2 violations. He concedes individual readings (small cost) to save the headline conclusion (zero cost). He is not doing 'bad history'; he is doing pseudohistory because the core claim is immune. However, if he engages with peer review that could falsify the headline, he slides back to 'dogmatic historian'. You must be precise: he is a crank only if the headline is insulated from the footnotes.

  ### The New Case: The "Volcanic Ink" Theory

  **The Case:** A researcher claims a famous 12th-century manuscript is actually a 1st-century Roman original. The carbon dating says 12th century. The researcher argues the ink contains organic soot from a specific volcanic eruption that skews carbon dating by 1,000 years. He has no geological proof of the soot, but argues that the *style* of the text proves it is Roman.

  **The Verdict:** **Pseudohistory.**
  **Why:** It violates **Clause 2 (Costly Rescue)**. The carbon dating is a contradiction. To save the theory, he posits a new fact (volcanic soot in the ink). Is this independently testable? If he says "Yes, spectroscopy will show it," it becomes a risky historical hypothesis. If he says "Spectroscopy can't detect it after this long, but we know it was there because the text is Roman," he is circular. He is using the conclusion (it is Roman) to prove the exception (the dating is wrong). This embarrasses you because it uses 'science' (carbon dating anomalies) to sound like (G), but functions like (D).

  ### What to Say to Dave

  Dave's sociological definition is convenient, but it collapses under the weight of **(C)**, **(E)**, and **(G)** combined.

  Tell him this: *"Dave, if pseudohistory is just what the department says it is, then you have to explain three things. One: Why was the amateur in case (E) doing real history when the department said he was wrong? Two: Why is the Professor in case (C) doing pseudohistory when the department employs him? And three: Why is the Silver Professor in (G) doing real history even if he turns out to be completely wrong? Institutional status is neither necessary nor sufficient. The difference isn't the job; it's whether the method allows you to lose."*

  That should keep him busy until the next round.
