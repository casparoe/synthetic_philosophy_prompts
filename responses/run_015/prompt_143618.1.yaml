answer: |-
  A robust normative theory must impose an asymmetric burden of proof scaling with irreversibility while ensuring incentive compatibility for truthful epistemic disclosure without centralized arbitration.

  ### Desiderata Specification for Justified Unilateral Action

  **1. Case-Handling Requirements**
  *   **Private Information Verification:** The theory must allow action on privately held data *only if* the actor can signal the validity of that data without revealing the trigger mechanism itself (e.g., via zero-knowledge proofs or bonded disclosure).
      *   *Hard Constraint:* Without this, private information becomes a loophole for unchecked unilateralism, defeating the purpose of coordination.
  *   **Overconfidence Calibration:** The theory must impose penalties or higher thresholds for actors whose historical confidence calibration is poor.
      *   *Hard Constraint:* Distributed ignorance means most actors are overconfident; failing to penalize miscalibration incentivizes rash action by the least competent.
  *   **Free-Ride Resistance:** The theory must prevent actors from delaying action indefinitely to let others bear the risk, while simultaneously preventing rash action to "preempt" others.
      *   *Hard Constraint:* If the theory doesn't solve the timing game, it either guarantees paralysis (collective failure) or a race to the bottom (curse realization).
  *   **Reversibility Sensitivity:** The justification threshold must scale exponentially with the irreversibility of the outcome (one-way doors require near-consensus; reversible pilots require only notification).
      *   *Hard Constraint:* Treating reversible and irreversible actions identically either stifles necessary innovation or permits existential risk.

  **2. Distinction Preservation**
  *   **Simple Ignorance vs. Acknowledged Error:** The theory must distinguish between not knowing the risk (ignorance) and knowing the risk but accepting it (error).
      *   *Hard Constraint:* Acknowledged error allows for learning and liability; simple ignorance prevents epistemic updates and creates moral hazard.
  *   **Value Disagreement vs. Factual Disagreement:** The theory must route factual disputes to verification mechanisms and value disputes to negotiation/veto norms.
      *   *Hard Constraint:* Treating value conflicts as factual errors leads to technocratic tyranny; treating facts as values leads to relativism where evidence doesn't matter.
  *   **Acting Alone vs. Tacit Consent:** The theory must distinguish between violating a known norm (acting alone) and acting where no norm exists but others remain silent (tacit consent).
      *   *Hard Constraint:* Blurring these destroys the signaling value of norms; if silence equals consent, coordinators can never signal objection without costly action.

  **3. Consistency Conditions (Social Choice & Epistemics)**
  *   **Strategy-Proofness:** The mechanism must not reward actors for exaggerating confidence or hiding information.
      *   *Hard Constraint:* If actors gain advantage by lying about their certainty or data, the system collapses into a signaling arms race rather than truth-seeking.
  *   **Non-Dictatorship over Irreversible Harm:** No single agent can impose irreversible costs on the collective without a veto mechanism available to the collective.
      *   *Hard Constraint:* This is the definition of avoiding the unilateralist's curse; violating it makes the theory descriptive of the problem, not a solution.
  *   **Epistemic Universalizability:** The justification for action must remain valid if adopted as a universal policy for all agents with similar confidence levels.
      *   *Hard Constraint:* If everyone who felt as sure as you did acted, would the outcome be acceptable? If not, your confidence is the error, not the world.

  ### Scoring the Usual Suspects

  | Proposal | Private Info | Overconfidence | Reversibility | Strategy-Proofness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Prediction Markets** | **Pass:** Aggregates info well. | **Fail:** Markets can be manipulated by biased actors with deep pockets. | **Fail:** Prices don't stop physical triggers. | **Fail:** Incentivizes betting on outcomes, not preventing harm. | **Incomplete:** Good for epistemics, bad for enforcement. |
  | **Expert Veto Committees** | **Fail:** Experts rarely hold the private info (usually held by devs/actors). | **Pass:** Peers can check overconfidence. | **Pass:** Can differentiate risk levels. | **Fail:** Selection of experts is unstrategy-proof (lobbying/politics). | **Regress:** Shifts the curse to the selection committee. |
  | **Threshold Veto Norms** | **Fail:** Hard to verify if threshold is met without disclosure. | **Fail:** Relies on honor system for confidence levels. | **Pass:** Norms can scale with stakes. | **Fail:** Virtue signaling rewards exaggerated confidence. | **Fragile:** Collapses under high-stakes pressure. |

  ### The Knockout Criterion

  The single requirement that does the most damage to popular proposals is **Strategy-Proofness regarding Confidence and Private Information**. Prediction markets fail because they allow wealth-weighted manipulation of "truth." Expert committees fail because the selection process is vulnerable to lobbying and bias (not strategy-proof). Threshold norms fail because they incentivize actors to signal higher confidence than they possess to gain moral authority. Without strategy-proofness, any mechanism designed to filter unilateral action simply becomes a new arena for gaming the system, leaving the underlying curse intact.

  \answer{Strategy-Proofness regarding Confidence and Private Information}
