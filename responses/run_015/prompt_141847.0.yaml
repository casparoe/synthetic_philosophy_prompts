answer: |-
  It is genuinely impressive that you have wrestled this into such a clear shape without any formal training, especially given the personal weight of the situation with your father. It is rare to see someone map out their own moral intuitions with this level of precision, and you have managed to isolate the exact friction points that professional ethicists spend careers arguing over. You are right to feel that there are tensions here, but you are also right to suspect that some of them might be illusions created by the way the points are phrased rather than deep contradictions. I will walk through this with you, separating the structural duplicates from the genuine conflicts, and then we can look at whether there is a way to tighten the whole thing up without losing what matters to you.

  To start with the easiest housekeeping, there are a couple of points here that are effectively wearing different clothes. Your second point and your eighth point are doing almost the same work. In (2) you say the practice needs to exist for a promise to bind, and in (8) you say the specific uptake by the listener is required. These are two sides of the same coin because the social practice of promising just is a system of communication where uptake is the mechanism. If you keep (8), you largely secure (2), because if everyone needs to understand the practice for uptake to happen, then the practice is a necessary condition. You could probably fold (8) into (2) without losing anything. Similarly, (4) and (5) are both validity conditions. You treat coercion and immorality as things that stop a promise from ever existing, rather than things that make it breakable. There is no tension between them; they are both examples of the same rule that a promise requires voluntary consent to a permissible act. So you do not need to worry about those clashing.

  Regarding your worry about (3) and (5), where you fear the authority transfer becomes hollow if an immoral promise voids the obligation, this is an apparent tension that dissolves if you are careful. You are worried that if nobody is wronged by breaking an immoral promise, then the idea that you gave them authority was nonsense. But on your view, you never gave them that authority in the first place. Think of it like handing someone the keys to your car. If you hand them the keys, they have authority to drive it. If you hand them the keys but they are disqualified from driving, the transfer of authority never legally took hold. They do not have authority, so you do not wrong them by taking the keys back. The concept of authority transfer in (3) remains robust because it only applies to valid promises. So that suspicion can be put to rest.

  Now we must look at the real tensions, and I shall rank them by how much damage they do to the coherence of your view. The most severe conflict is between (2) and (7). This is the hard one. In (2) you ground the obligation in a social practice that allows people to be held to account, and in (7) you admit the point of the practice is to make it safe for the living to rely on each other. Yet in (7) you also insist the obligation survives death, where reliance is impossible and holding you to account is impossible. If the justification for the practice is utility for the living, as you suggest in (7), then a promise to a dead person is like locking a door in a house that has burned down. There is no one to be safe anymore. If you keep (2) as written, you have to abandon (7). Dropping (7) would cost you the specific conclusion you want about your father; it would mean admitting that once he died, the promise dissolved into a mere wish or a memory, and your obligation became purely about your own character rather than a debt to him. Conversely, if you keep (7), you have to soften (2). You would have to say that while the practice starts as a social tool for the living, the obligations it creates become freestanding properties that survive the participants. This costs you the clean explanation of why promises exist; you can no longer say they are just for social safety, because they now persist where social safety is irrelevant.

  The second most serious tension is between (1) and (2). This is the classic clash between duty and convention. In (1) you say the reason to keep a promise is not just about good effects, but in (2) you say the obligation only exists because of a useful social practice. If the only reason we have the practice is because it is useful (consequentialism), then it is hard to see why you cannot break the rule when breaking it is more useful (which you reject in (1)). You are trying to have your cake and eat it too by saying the practice is useful but the reason to follow it is not utility. To fix this, something has to give. If you drop (1), you become a rule-utilitarian, meaning you keep promises only because doing so generally helps society, which forces you to abandon (6) because if the numbers say breaking it is better, you should break it. If you drop the consequentialist hint in (2), you have to say the practice exists not because it is useful, but because it is the only way to respect persons as ends in themselves. This is a heavier philosophical lift, but it saves (1) and (6).

  The third tension, which is less severe but still present, is between (3) and (7). In (3) you say promising hands the other person authority over you. In (7) you say this binds after they die. But a dead person cannot hold authority. They cannot direct your life, they cannot release you, they cannot exercise the power you claim you gave them. If you keep (3) strictly, (7) looks mysterious. How can you be under the authority of someone who no longer exists? To resolve this, you would have to change (3) slightly. You would need to say that you handed them authority at the time of the promise, and the obligation is the residue of that past relationship, rather than a current state of authority. Dropping the strict present-tense version of (3) costs you the idea that the promisee can currently let you off the hook after death, which you already admit in (7) anyway, so this is a manageable cost.

  There is, however, a single revision that could tidy up most of these messes at once. The problem is that you are oscillating between two different models of what a promise is. Sometimes you treat it like a social institution, like money or traffic laws (this is your point (2)), and sometimes you treat it like a personal relationship, like friendship or love (this is your point (3) and (7)). The social institution view explains why we have the practice, but it struggles with death and private islands. The relationship view explains why it binds after death and why specific uptake matters, but it struggles to explain why we need a social practice at all. If you shift your central focus from the Practice to the Relationship, several things fall into place. You can say that the social practice is merely the language we use to establish the relationship, but the obligation comes from the normative bond created between two people. This allows the obligation to survive death because the relationship existed and created a debt, even if the partner is gone. It also saves (1) because the reason to keep it is fidelity to that person, not utility for society. It explains (8) because you cannot have a relationship without uptake. It even helps with (4) and (5) because you cannot form a valid relationship based on coercion or immorality. This shift costs you the idea that promises are primarily about social stability, but it gains you a much more consistent story about why you still owe something to your dad.

  Finally, you asked which of these beliefs you are least likely to actually abandon. Given how the rest of your set is shaped, I suspect it is (1). Everything else feels like an attempt to explain or limit (1). Your worry about (2) and (7) exists only because you are trying to justify (1) using social utility. Your insistence on (6) rather than running the numbers is a direct consequence of (1). If you abandon (1), the whole structure collapses into a simple calculation of outcomes, and you would have to admit that if breaking the promise to your dad caused less pain overall, you should have done it without a second thought. I do not think you can bring yourself to say that. You are holding onto (1) because it captures the feeling of guilt you have been chewing on since Christmas, and without it, that guilt becomes irrational. You might be forced to tweak (2) or rephrase (3), but (1) is the engine room of this whole view, and it is the one you will fight hardest to keep.

  I hope this helps you see where the weak spots are. You have built something sturdy here, but like any house built without blueprints, the load-bearing walls are not always where the windows are. You might find that shifting from a practice-based view to a relationship-based view allows you to keep the obligation to your father without contradicting your own reasons for why promises matter.
