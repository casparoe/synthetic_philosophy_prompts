answer: |-
  First off, to answer your immediate question: **You are not being dramatic.** You are experiencing a very real, very heavy psychological burden called *role strain*. You are trying to fulfill three high-demand roles (son/employee, friend/supporter, student/individual) simultaneously, and the demands of those roles are currently exceeding the hours in your day and your emotional capacity.

  It is completely understandable that you feel like you are failing at all of them. When you are stretched that thin, performance drops in every area, which fuels the guilt.

  Since you brought up Confucian philosophy, let's start there, because it actually offers a way out of the "pick one and abandon the rest" trap you feel stuck in.

  ### 1. Reframing the Philosophy
  You mentioned the idea that in Confucianism, you *are* your relationships. That is true. However, there is a nuance that often gets missed in Western interpretations of *Xiao* (Filial Piety).

  *   **Self-Cultivation is the Root:** In Confucian thought, you cannot be a good son or a good friend if you do not first cultivate yourself. If you burn out, fail your classes, or collapse mentally, you lose the capacity to be useful to your family or your friend in the long run.
  *   **The Long Game of Filial Piety:** Being a "good son" isn't just about laboring in the restaurant *now*. It is about securing your future so you can support your family *later*. If working 30 hours a week during your junior year tanks your grades or your college prospects, you are actually hurting your family's long-term stability.
  *   **Harmony (*He*), not Hierarchy:** The goal isn't to crush one relationship to save another. The goal is *harmony*. Right now, the system is out of harmony. Something has to shift so that the relationships can survive sustainably.

  So, the "right" way to think about this isn't "Family vs. Friend." It is "How do I sustain my capacity to be present for both without breaking myself?"

  ### 2. Practical Steps: The Family Conversation
  You need to talk to your parents, but the framing matters. If you approach this as "I need time for me," a stressed-out parent might hear "I don't care about the family."

  **Try framing it around sustainability and the future:**
  *   **Acknowledge the sacrifice:** Start by validating them. "I know Dad is sick, and I know you've sacrificed for me. I want to help."
  *   **Present the data:** "I am working weekends and most afternoons. I am also a junior, which is the most important year for my grades and college applications."
  *   **The "Good Son" Argument:** "If I burn out or my grades slip, I won't be able to get into a good college/get a good career, which means I won't be able to help you guys financially in the future. I need to protect my schoolwork so I can be a better provider later."
  *   **Propose a Schedule:** Don't just say "less." Say "Here is what I can do." For example: "I can work Saturday all day, but I need Sunday free for school and rest," or "I can work weeknights but only until 7 PM."

  Regarding your mom's guilt trips ("We sacrificed everything"): This is heavy emotional labor for a teenager. It is okay to internally recognize that while their sacrifice is real, **their sacrifice was a choice they made as parents, not a debt you have to pay off with your childhood.** You can love them and help them without accepting the guilt as your own.

  ### 3. Practical Steps: The Friend Conversation
  Marcus is in a crisis, and it's admirable that you want to be there for him. But you are his friend, not his therapist. If his parents are divorcing and he is "messed up," he likely needs professional support that a high school junior cannot provide.

  *   **Radical Honesty:** Tell Marcus exactly what is going on. "Marcus, I care about you so much. But my dad is really sick and my family is relying on me at the restaurant. I've been canceling because I'm trapped, not because I don't care."
  *   **Set Boundaries:** "I can't come over on weekends right now, but I can text you every night at 9 PM," or "I can talk on the phone during my commute."
  *   **Encourage Other Support:** If he is really struggling, gently suggest he talk to a school counselor or another trusted adult. You being his *only* support is too much pressure for you and not enough support for him. A good friend helps their friend get the right help, even if it's not from them.

  ### 4. Reclaiming the "Student/Individual" Role
  You dropped the club. You need to get something back. Junior year is a pressure cooker. If you have zero outlet for yourself, you will resent both your family and your friend eventually.

  *   **Negotiate One Thing:** Ask your parents for *one* fixed block of time a week that is yours. Whether it's for a club, studying, or just sleeping. Frame it as "recharging so I can work harder."
  *   **Micro-Rest:** If you can't get a club, find 30 minutes a day that is yours. No phone, no work, no talking to Marcus. Just you.

  ### Summary of What To Do
  1.  **Stop canceling on Marcus without explanation.** Tell him the truth about your family situation. He will likely understand, and it relieves the pressure on you to make up excuses.
  2.  **Have the "Sustainability" talk with your parents.** Focus on how your education is an investment in the family's future, not a distraction from the present.
  3.  **Release the Guilt.** You are a minor. You are not responsible for saving the restaurant, fixing your dad's health, or saving Marcus's emotional well-being. You are responsible for doing your best within reasonable limits.
  4.  **Prioritize Sleep and School.** If you have to drop something, drop the extra labor before you drop your grades or your health.

  You are trying to be an adult before you actually have to be. It is okay to step back and say, "I am doing my best, and my best has to include taking care of myself." That is the only way you can actually be the good son and good friend you want to be.
