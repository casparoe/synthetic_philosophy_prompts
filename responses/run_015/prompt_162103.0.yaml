      3.  Identify the Knockout (The Open-Ended Constraint).
      4.  Scorecard of solutions.
      5.  Advice on the Moore/Knowability link.

      *(Final check on (c))*: The user thinks solutions relying on a terminal day are defective. I agree. This is the strongest filter. I will elevate this.

      *(Final check on (f))*: Is Knowability a red herring? Williamson says yes, others say no. I'll call it a "Theoretical Preference" regarding classification, not solution adequacy.

      *(Final check on (d))*: Surprise vs Unpredictability. This is crucial. If "surprise" = "psychological startle," logic can't touch it. If "surprise" = "not known," logic can. I will insist on the epistemic definition.

