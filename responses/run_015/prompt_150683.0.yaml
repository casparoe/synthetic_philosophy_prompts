answer: |-
  # Seminar Activity: The Deliberative Dividend

  **Topic:** The Fragmentation of Shared Standards in Indirect Normativity
  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Materials:** Paper, pens, 20 "Snack Credits" (redeemable for actual snacks at the end), a timer.

  ## Facilitator Prep (5 Minutes Before Start)
  1.  **The Pot:** Place 20 Snack Credits in the center of the table. (1 Credit = 1 high-quality snack item).
  2.  **The Cards:** Prepare 10 small slips of paper.
      *   3 slips marked **EQUITY** ("Your idealized counterpart prioritizes equal distribution above all.")
      *   3 slips marked **MERIT** ("Your idealized counterpart prioritizes distribution based on past contribution/effort.")
      *   3 slips marked **UTILITY** ("Your idealized counterpart prioritizes maximizing total satisfaction/minimizing waste.")
      *   1 slip marked **WILDCARD** ("Your idealized counterpart has identified a unique normative principle you must defend.")
  3.  **The Rule:** Do not mention "Indirect Normativity," "Ideal Advisor," or "Railton/Smith" until the Debrief. Refer to the mechanism only as "The Counterpart."

  ---

  ## Part 1: Introduction & Round 1 (20 Minutes)

  **0:00–0:05 | Setup**
  Tell the group: "We have 20 snack credits. Our goal is to distribute them. In this first round, you are bargaining as **yourselves**. Use whatever reasons you normally use. You have 10 minutes to reach a consensus. If you fail, I (the facilitator) will confiscate half the pot and distribute the rest randomly."

  **0:05–0:15 | Round 1: The Real Bargain**
  *   Let them talk.
  *   *Expected Outcome:* They will likely agree quickly (e.g., 2 credits each, or 1 each with leftovers for later). They will use shared language ("fairness," "hunger," "let's just split it").
  *   *Facilitator Role:* Observe silently. Note how often they say "We should" vs "I want."

  **0:15–0:20 | Lock In**
  *   Record the Round 1 decision on the board.
  *   Collect the credits back. (Tell them: "That was a warm-up. The real allocation happens now.")

  ---

  ## Part 2: Round 2 – The Counterpart Mandate (40 Minutes)

  **0:20–0:25 | Instructions & Distribution**
  Hand out the Value Profile slips (Equity, Merit, Utility, Wildcard) privately. Tell them:

  > "In this round, you are not bargaining for yourself. You are acting as a **Trustee** for your 'Fully Informed, Unbiased, Value-Preserving Counterpart.'
  >
  > **The Rules of Engagement:**
  > 1.  **No Personal Preferences:** You cannot say 'I want' or 'I am hungry.' You must say 'My Counterpart concludes...'
  > 2.  **No Compromise:** Your Counterpart has already deliberated. You are reporting a *finding*, not negotiating a preference. If you change your position to accommodate others, you are falsifying the Counterpart's finding.
  > 3.  **The Stakes:** If you reach a unanimous consensus on a distribution, the credits are awarded. If you fail to agree, **no one gets anything.** The Counterparts do not care about your hunger; they care about the Truth.
  > 4.  **Secret Axioms:** Look at your slip. This is the core normative commitment your Counterpart has clarified during *idealized delibaration* [sic]. You must defend a distribution plan that satisfies this commitment."

  **0:25–0:55 | Round 2: The Ten Monologues**
  *   Start the timer.
  *   *Facilitator Role:* Enforce Rule #1 and #2 strictly.
      *   If someone says, "I can live with 1 credit," interrupt: "Can your *Counterpart* live with it? Or does rationality require 2?"
      *   If someone says, "Let's meet in the middle," interrupt: "Can truth meet in the middle? Or is one of you mistaken?"
  *   *Expected Friction:* The Equity group will demand 2 each. The Merit group will demand a metric for contribution (which doesn't exist, causing deadlock). The Utility group will argue for giving all 20 to the one person who enjoys snacks most (hard to prove, causing deadlock).
  *   *The Trap:* Because they cannot compromise without admitting their "Ideal" self was wrong, they will talk past each other. They are not arguing about the snacks; they are arguing about *which authority* governs the room.

  **0:55–1:00 | The Collapse**
  *   It is highly likely they will not reach consensus under these strict epistemic constraints.
  *   Call time. Confiscate the snacks (or hold them hostage for the debrief).
  *   Ask them to sit back and breathe. The tension should be palpable.

  ---

  ## Part 3: Debrief & Mapping (30 Minutes)

  **1:00–1:10 | Phenomenology of the Deadlock**
  Ask: "Why was Round 2 harder than Round 1? You are the same people."
  *   *Target Answer:* In Round 1, we could compromise because our preferences are flexible. In Round 2, we were claiming *authority*. To compromise felt like lying or being irrational.
  *   *Key Insight:* When reasons are anchored to *my* idealized self vs. *your* idealized self, we don't have a shared standard. We have ten parallel monologues.

  **1:10–1:20 | Naming the View**
  Reveal the topic: **Indirect Normativity** (e.g., Smith's Ideal Advisor, Railton's Ideal Observer).
  *   Explain: "The theory says what you ought to do is what your idealized self would want you to do. Round 2 simulated this."
  *   **The Fragmentation Problem:** "If normative authority comes from *within* each agent's counterfactual psychology, there is no 'View from Nowhere' for the group. There is only the View from My Ideal Mind vs. Your Ideal Mind."
  *   Point out the "Smuggling": "Did anyone find themselves sneaking 'I want' into 'Rationality requires'? This shows that without a shared external standard, 'Idealized' just becomes a weaponized version of 'Actual'."

  **1:20–1:25 | The Limitation (The Metaphysical Note)**
  Deliver the honest constraint of the activity:
  > "There is one feature of Indirect Normativity this activity cannot reproduce, which I have to supply verbally.
  >
  > In this room, you knew your 'Counterpart' was a role-play. You didn't *feel* its metaphysical authority. In the actual theory, the Ideal Advisor isn't just a smarter version of you; it is supposed to be **genuinely authoritative**. It creates an obligation.
  >
  > The activity showed you the *social fragmentation* (we can't agree), but it couldn't make you feel the *internal obligation* (I *must* obey this). In the real theory, the tragedy is deeper: You would feel genuinely bound to disagree. You wouldn't just be stubborn; you would be morally obligated to reject the other's proposal because your Ideal Self says so. That metaphysical weight is what turns a bargaining impasse into a normative crisis."

  **1:25–1:30 | Distribution & Close**
  *   Distribute the snacks equally (ironically violating the Merit/Utility slips, but restoring group harmony).
  *   Final thought: "If practical reason is individual, is collective action just a modus vivendi between monologues? Read Scanlon for next week."

  ---

  ## Facilitator Cheat Sheet: Managing the "Value-Preserving" Trap

  *   **If they agree too fast in Round 2:** Intervene. "Student A (Equity) and Student B (Merit), you just agreed to a split. Does the Merit Counterpart endorse equality? If not, you are misrepresenting your mandate. Withdraw the agreement."
  *   **If they get angry:** Good. That's the feeling of normative conflict. Remind them: "You can't be mad at them; they are just reporting their data. The system is the problem."
  *   **The Typo:** If a student references your prompt notes, they may write "idealized delibaration." Accept this without correction during the flow to maintain immersion, but use correct spelling on the board to ensure conceptual clarity.

  ## Why This Works
  1.  **Stakes:** Snack credits are trivial enough to be safe, but real enough to trigger preference.
  2.  **Constraint:** The "No Compromise" rule forces the logical implication of Indirect Normativity: If the Ideal Self is the authority, compromising is epistemic/moral failure.
  3.  **Discovery:** They discover the fragmentation themselves. You don't tell them "there is no shared standard"; they experience the absence of one when they try to build it.
  4.  **Honesty:** The limitation note respects their intelligence by acknowledging what a simulation cannot do (replicate metaphysical authority).
