answer: |-
  You have identified a genuine and under-named problem in aesthetics and epistemology. You are right to reject "hermeneutic circle." The hermeneutic circle describes the benign interdependence of part and whole (you need to understand the words to understand the sentence, and the sentence to understand the words). Your phenomenon is malignant: it is not just that understanding depends on the parts, but that the *definition of the whole* has been secretly rewritten by a part that claims to belong but does not.

  There is no single canonical noun for this (like "gravity" or "inflation"), but in philosophy of art and epistemology, it is best carved as **Corrupted Ostensive Definition via Constitutive Contamination.**

  Here is the carving you asked for, distinguishing it from related concepts, followed by an analysis of your test cases and the question of pleasure.

  ### 1. The Carving: Why it isn't "Contaminated Evidence"
  Standard "contaminated evidence" implies that you have a fixed target (the artist's style) and some of your data points are wrong. You can, in theory, remove the bad data points and recover the target.

  Your phenomenon is deeper. It is **Constitutive**.
  In science, this is the "Kilogram Problem." For a century, the standard kilogram was a physical cylinder in Paris. If that cylinder secretly gained mass due to dust accumulation, *every measurement of mass in the world shifted*, not because objects changed, but because the ruler changed.

  In your art scenario, the "Style of Artist X" is not a pre-existing Platonic form waiting to be discovered. It is an **ostensive definition**. We define "A Rembrandt" by pointing to a set of exemplars and saying, "Like that." If a forgery enters that set *before* the definition solidifies, it does not just add noise; it bends the coordinate system.

  **The Distinction from the Hermeneutic Circle:**
  *   **Hermeneutic Circle:** I learn the style from the paintings, and I identify the paintings by the style. (Benign, inevitable, truth-neutral).
  *   **Your Phenomenon:** I learn the style from the paintings, but one painting is a lie that *becomes* the style. (Malignant, truth-dependent, historically contingent).

  The specific mechanism is **Exemplar Drift**. The forgery stops being a *measurement* of the style and becomes a *parameter* of the style.

  ### 2. Addressing Your Test Cases

  Here is how the carving settles your specific scenarios:

  **A. The Overpainted Restoration (The Physical Mixture)**
  *   **Verdict:** Different category.
  *   **Why:** This is **Material Hybridity**, not Definitional Contamination. In the forgery case, the *concept* of the artist's hand is altered. In the restoration case, the *object* is altered, but the concept of the artist's hand remains theoretically distinct. We can (in principle) strip the overpaint. The "ruler" hasn't changed; the "object being measured" has been physically modified. The aesthetic error here is misattribution of *agency* (loving the restorer's brushwork), not a shift in the *category* of the artist's style.

  **B. Studio and Workshop Pictures (The Internal Deception)**
  *   **Verdict:** Out (mostly).
  *   **Why:** This is a boundary dispute, not an injection. Workshop pictures are generated *within* the causal chain of the master's practice. They share the "history of production" (to use Nelson Goodman's term) even if not the specific hand. They are "family resemblance" (Wittgenstein) rather than "alien imitation." Including them expands the *extension* of the category, but it doesn't corrupt the *intension* (the core definition) in the same way. It's not a fake ruler; it's a debate over whether a yardstick or a meter stick is the true standard.

  **C. The Exposed Forgery that Stays in the Canon (The Zombie Exemplar)**
  *   **Verdict:** Same phenomenon (The most dangerous case).
  *   **Why:** Relabeling ("Imitator of") changes the *text* but not the *visual training*. If art students still study the forgery to learn "what a Vermeer looks like," the constitutive contamination persists. The forgery has achieved **Canonical Zombie Status**. It is dead as a genuine work, but alive as a stylistic parameter. The ruler remains bent even if we tape a label to it saying "Bent Ruler." This confirms your suspicion: the damage is to the *visual schema*, not the museum label.

  **D. AI Image Generators (Model Collapse)**
  *   **Verdict:** Structurally Identical.
  *   **Why:** In machine learning, this is called **Model Collapse**. When generative models are trained on data produced by previous generative models, they lose contact with the "ground truth" (reality/human output). The variance decreases, the edges smooth out, and the system converges on a hallucinated average. This is exactly your art forgery loop: the "style" is no longer defined by the human originator, but by the previous iteration of the imitation. It is the industrialization of your phenomenon.

  ### 3. The Name
  If you need a term to search for or use, the closest philosophical framing is **"Corrupted Ostensive Definition."**

  However, in art history and sociology, this is sometimes discussed under the umbrella of **"The Social Construction of the Canon,"** specifically regarding **"Retroactive Stylistic Drift."**

  There is no single word, but the concept is recognized in the work of **Nelson Goodman** (*Languages of Art*). Goodman argues that in autographic arts (like painting), the history of production is part of the work's identity. A perfect fake is aesthetically different *because* we know it is a fake. However, your point pushes past Goodman: you are arguing that before we know it is a fake, it alters the **Perceptual Schema** we use to judge the genuine ones.

  ### 4. The Question of Pleasure
  *If our eye for the real thing was partly trained on fakes, is there something wrong with the pleasure we take in the real thing?*

  This is the sharpest part of your query. The answer lies in the work of **Kendall Walton** ("Categories of Art").

  Walton argues that we do not perceive art neutrally; we perceive it through **Categories**. We see a painting as "a Cubist work" or "a Rembrandt." Our aesthetic judgment (is it balanced? is it dynamic?) depends on which category we are using.

  *   **The Problem:** If your category "Rembrandt" includes forgeries, your category is **warped**.
  *   **The Consequence:** When you look at a *genuine* Rembrandt, you are not seeing it as it is. You are seeing it as it relates to your (corrupted) category. You might find a genuine Rembrandt "restrained" because your internal standard (inflated by dramatic forgeries) expects "drama."
  *   **The Verdict:** The pleasure is not "fake," but it is **misattributed**. You are taking pleasure in the fit between the object and your *schema*, not the object and the *artist's intent*.

  However, there is a dissolution to the worry. Art is a conversation across time. If the forgery was good enough to shift the standard, it means the forgery successfully engaged with the artistic problems of the time (even if deceptively). The "Style of Artist X" is not a biological fact like DNA; it is a **living tradition of interpretation**.

  If the forgery changed how we see the artist, then historically, **it did change the artist.** Not the man who held the brush, but the *Artist* as a cultural entity. The "Rembrandt" we talk about today is a composite of the man, his workshop, his imitators, and his forgers.

  So, is the pleasure wrong? **No.** But it is historically layered. You are enjoying the "Real Rembrandt" as filtered through the "Forged Rembrandt." That is not a failure of perception; it is the condition of receiving history. The ruler *was* made out of the stuff it measures, because in art, the ruler is made by the community of viewers, not just the hand of the painter.

  ### Summary
  *   **Concept:** Corrupted Ostensive Definition / Constitutive Contamination.
  *   **Mechanism:** The fake moves from being a *measurement* of the style to a *parameter* of the style.
  *   **AI Parallel:** Model Collapse (training on synthetic data).
  *   **Pleasure:** Not wrong, but category-relative (Walton). You are enjoying the current iteration of the "Artist" construct, which includes the forgery's influence.

  You have essentially described the **aesthetic version of Gresham's Law** (bad money drives out good), but with a twist: the bad money doesn't drive out the good; it revalues the currency.
