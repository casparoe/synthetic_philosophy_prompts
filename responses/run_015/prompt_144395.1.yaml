answer: |-
  Here is an analysis of your intuitions and a proposed principle designed to systematize them.

  ### Diagnosis of Your Tentative Principle

  Your draft principle captures the distinction between *located* and *unlocated* doubt well (Cases 1, 2, 4), and it correctly identifies that presentation matters (Case 5). However, it fails on three counts:

  1.  **It lacks a threshold mechanism.** This is why it cannot explain Case 3 (Small Numbers). You feel a cutoff exists between two claims and two hundred, but your principle offers no variable that changes with $N$. The difference is probabilistic: as $N$ shrinks, the probability of the conjunction rises. At $N=2$, the conjunction is likely enough that believing the hedge becomes irrational; at $N=200$, the conjunction is unlikely enough that believing the hedge is required.
  2.  **It conflates belief with assertion.** Case 5 (Fragmentation) shows that the *content* of the belief doesn't change, only the permissibility of the *action* (sending the letters). Your Clause (iii) treats this as "audience etiquette," but it is actually a constraint on practical reliance, not just politeness.
  3.  **It ignores the source of support.** Case 6 (Statistical vs. Evidence-Specific) suggests that high probability alone is insufficient for *premise-use*, even if it suffices for *belief*. Your Clause (iv) notes this but doesn't integrate it with the aggregation rules.

  ### The Principle: Calibrated Fallibilism

  I propose a two-part framework: **The Principle of Calibrated Fallibilism**. It separates the conditions for *holding* a belief from the conditions for *using* it.

  **I. Doxastic Constraint (The Belief Rule)**
  An agent may believe a proposition $p$ if and only if their credence $C(p) \geq t$ (where $t$ is the context-sensitive threshold for belief, e.g., 0.9).
  *   **Aggregation Clause:** If an agent believes $\{p_1, ..., p_n\}$ individually, and $C(p_1 \& ... \& p_n) < t$, the agent is rationally required to believe $\neg(p_1 \& ... \& p_n)$ (the Preface hedge).
  *   **Motivation:** This handles Cases 1, 2, 3, and 7. It explains why you can believe the parts but not the whole, and why the "Small Numbers" case flips: when $N$ is small, the conjunctive probability stays above $t$, making the hedge irrational.

  **II. Pragmatic Constraint (The Usage Rule)**
  An agent may assert $p$ or use $p$ as a premise for action if and only if:
  *   (a) The support for $p$ is non-statistical (evidence-specific); **OR**
  *   (b) The support is statistical, *but* the aggregate error rate of the set from which $p$ is drawn is transparent to the stakeholder.
  *   **Localization Clause:** If doubt becomes located (even to a subset), individual beliefs within that subset are defeated for usage.
  *   **Motivation:** This handles Cases 4, 5, and 6. It explains why lottery beliefs (purely statistical, no transparency) cannot be cited as premises, while Preface beliefs (evidence-specific) can. It explains why the company can send the letters with the aggregate estimate (transparency) but not without it.

  ---

  ### Application to New Cases

  Here is how **Calibrated Fallibilism** applies to the scenarios you requested.

  **1. The Radiologist**
  *   **Scenario:** Reads 200 scans/day, knows her own error rate (say, 5%).
  *   **Verdict:** She may believe "Scan 47 is clear" (Doxastic Constraint met). She is required to believe "At least one scan today is misread" (Aggregation Clause: $0.95^{200}$ is near zero). She may act on "Scan 47 is clear" to discharge the patient *only if* the hospital system acknowledges the 5% error rate (Pragmatic Constraint b). If she spots a specific anomaly on Scan 47 (Located Doubt), she cannot discharge based on that scan (Localization Clause).
  *   **Analysis:** This mirrors the Preface case but with higher statistical reliance. The transparency of the error rate to the institution licenses the individual actions.

  **2. The Judge**
  *   **Scenario:** Signs 40 warrants/week, knows a small fraction are not properly supported.
  *   **Verdict:** This is the stress test. If her belief that "Warrant 1 is supported" rests *only* on the base rate of her own reliability, she violates the Pragmatic Constraint (a). Judicial warrants require specific evidence. If she believes each based on specific evidence, she satisfies (a). However, if she *knows* statistically that some lack support, the Aggregation Clause requires her to believe "Some warrant this week is unsupported."
  *   **Tension:** If she believes "Some warrant is unsupported," can she sign *any* specific warrant? Yes, provided the doubt is unlocated. But if she suspects the error lies in *this week's batch* specifically (e.g., a new clerk), the doubt becomes located to the set of 40, requiring a audit before signing any.
  *   **Analysis:** The principle suggests that a judge who acknowledges a systemic error rate must ensure that the specific warrant has non-statistical support (Clause IIa). Purely statistical reliability is insufficient for depriving liberty.

  **3. The Labeller**
  *   **Scenario:** 10,000 images, 99% accurate, ships with documented error rate.
  *   **Verdict:** Fully permissible. Each label is believed (Doxastic). The conjunction is not believed (Aggregation). The dataset is usable because the error rate is documented (Pragmatic Constraint b).
  *   **Analysis:** This is identical to your Case 5 (Fragmentation). The principle confirms that the documentation resolves the epistemic tension.

  ---

  ### Conflicts and Overturns

  To be useful, a principle must sometimes correct intuition. Here is where **Calibrated Fallibilism** diverges from your reported verdicts.

  **1. The Lottery Attitude (Your Case 1)**
  *   **Your Verdict:** "I take no attitude toward the conjunction at all and feel no pressure to have one."
  *   **Principle's Verdict:** You are *rationally required* to believe the hedge ("At least one ticket will win").
  *   **Reasoning:** Your intuition treats the Lottery as a special zone where belief norms suspend. The principle argues that if you believe each ticket loses (credence 0.999), and the conjunction has credence 0, consistency demands you believe the negation of the conjunction.
  *   **Overturn:** I would overturn your "no pressure" verdict. The pressure exists; you resist it because the belief feels useless, but rationality demands the hedge. This aligns the Lottery with the Preface (Case 2), treating them as the same animal, contrary to your suspicion in Case 6.

  **2. Closure on Drawn Inferences (Your Case 7)**
  *   **Your Verdict:** "If it hasn't occurred to me, I want to say I'm under no requirement." (Closure only for inferences actually drawn).
  *   **Principle's Verdict:** Rational requirement is objective, not attention-dependent.
  *   **Reasoning:** If you believe $p$ and $p \to q$, you *ought* to believe $q$, even if you haven't thought of it. However, you are not *blameworthy* for failing to do so until the inference is prompted.
  *   **Overturn:** I would overturn the claim that there is "no requirement." There is a requirement, but it is dormant. This preserves the normativity of logic without demanding impossible cognitive omniscience.

  **3. The Cutoff (Your Case 3)**
  *   **Your Verdict:** "I can't say why or where the cutoff falls."
  *   **Principle's Verdict:** The cutoff is where $P(\text{Conjunction})$ crosses the belief threshold $t$.
  *   **Reasoning:** You felt the cutoff was vague. The principle makes it precise (though $t$ itself may be slightly context-sensitive).
  *   **Repair:** This salvages your intuition by giving it the structure it lacked. It explains why 2 claims + hedge feels inconsistent (Conjunction prob > $t$) while 200 claims + hedge feels virtuous (Conjunction prob < $t$).

  ### Summary of Analysis

  Your tentative principle was close but treated the problem as one of *etiquette* (audience awareness) rather than *epistemic calibration*. By distinguishing between what you can **believe** (governed by probability thresholds) and what you can **use** (governed by support type and transparency), we can accommodate your distinction between the Lottery and the Preface without declaring them fundamentally different kinds of paradox.

  The Lottery and Preface *are* the same animal structurally (both involve high-probability conjunction failure), but they differ pragmatically. In the Lottery, the support is statistical, blocking premise-use. In the Preface, the support is specific, licensing premise-use. The "unlocated doubt" allows you to hold the beliefs in both cases, but only the Preface allows you to act on them without further qualification.

  This framework suggests your discomfort in Case 1 (Lottery) stems from an implicit recognition that statistical support fails the Pragmatic Constraint, leading you to suspend judgment on the conjunction to avoid practical error. In Case 2 (Preface), the specific support satisfies the Pragmatic Constraint, allowing you to embrace the hedge as a virtue of intellectual honesty.
