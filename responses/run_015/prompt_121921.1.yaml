answer: |-
  # Activity: The Conditional Market (75 mins)

  **Materials:** 3 decks (cards 1–6), 300 poker chips (100/team), whiteboard, dice.
  **Setup:** 3 Teams (6 students each). You = House/Banker.
  **Target:** $A=\{1,2\}$, $C=\{2,3\}$. Die rolled once at end to settle all bets.

  ### Rules
  1.  **Ramsey Pricing:** Teams post Buy/Sell prices for ticket $A \rightarrow C$ (pays 1 chip if true, 0 if false). Price must equal $P(C|A)$ per Ramsey test.
      *   *Example:* $P(C|A) = 1/2$. Fair price = 0.50.
  2.  **Partition Challenge:** Opposing team proposes partition $B$ (e.g., $C$, $\neg C$, Even, Odd). House certifies if $A \cap B$ and $A \cap \neg B$ are possible.
      *   **Inert:** Parity splits often yield same price (1/2).
      *   **Biting:** Splitting on $C$ yields LOTP price: $1 \cdot P(C) + 0 \cdot P(\neg C) = 1/3$.
  3.  **Arbitrage:** If Ramsey Price $\neq$ LOTP Price, House executes both: buys low, sells high. Team loses difference in chips.
  4.  **Revision:** Teams may change posted price. **Cost:** Pay 5 chips to House OR widen spread by 0.10 (less profit).
  5.  **Exit Auction (Final Round):** Teams face nested bets (e.g., "If A then if B then C"). Teams declare one assumption to drop to refuse specific bets.
      *   (1) Drop Ramsey Eq. (2) Drop Conditional as Proposition. (3) Drop Ramsey-in-Supposition. (4) Drop Coherence.

  ### Timeline
  *   **00–10: Setup.** Distribute chips/cards. Define $A, C$. Explain Ramsey test: "Suppose A, how confident in C?" No mention of Lewis/Triviality.
  *   **10–35: Market Open.** Teams post prices for $A \rightarrow C$. House/Teams trade. Most will price at 0.50.
  *   **35–55: The Squeeze.** Opponents propose partitions. House highlights $B=C$.
      *   Calc LOTP: $P(A \rightarrow C | C)P(C) + P(A \rightarrow C | \neg C)P(\neg C)$.
      *   Ramsey-in-Supposition: Suppose $C$, then $A \rightarrow C$ is certain (1). Suppose $\neg C$, then $A \rightarrow C$ is impossible (0).
      *   Result: $1/3$. Mismatch vs 0.50. House arbitrages. Teams bleed chips.
      *   Teams may revise (pay cost) or hold (lose more).
  *   **55–65: Exit Auction.** Announce final nested bets. Teams declare exit choice (1–4).
      *   Choice determines which bets they can refuse.
      *   Visible cost: Teams dropping (4) lose chips. Teams dropping (2) miss hedging opportunities.
  *   **65–75: Debrief.** Map game moments to assumptions. Reveal "Triviality."

  ### Debrief Guide (Map Moments to Assumptions)
  *   **Moment:** Pricing $A \rightarrow C$ at 0.50.
      *   **Assumption:** **Ramsey Equation** ($P(A \rightarrow C) = P(C|A)$).
      *   **Exit 1:** Allow pricing at 1/3. Violates intuition.
  *   **Moment:** Trading $A \rightarrow C$ as unconditional ticket.
      *   **Assumption:** **Conditional as Proposition** (Truth-apt object).
      *   **Exit 2:** Refuse unconditional trades. Only accept conditional bets. Blocks arbitrage but limits market.
  *   **Moment:** Calculating LOTP using Ramsey test inside supposition ($P(A \rightarrow C | C) = 1$).
      *   **Assumption:** **Ramsey-in-Supposition** (Law of Total Probability holds for conditionals).
      *   **Exit 3:** Reject LOTP calculation. Breaks standard probability calculus.
  *   **Moment:** House taking chips due to mismatch.
      *   **Assumption:** **Price Coherence** (No Dutch Books).
      *   **Exit 4:** Accept inconsistency. Keep logic, lose chips.

  ### Troubleshooting & Limitations
  *   **Truth-Functional Team:** One team will price at $P(\neg A \cup C) = 5/6$.
      *   **Action:** Let them. They will get arbitraged by both Ramsey traders and House. Use in debrief to show material implication fails Ramsey test.
  *   **Inert Partitions:** Teams may claim "Even/Odd" disproves the squeeze.
      *   **Action:** Confirm inert splits exist. Challenge them to find the *biting* partition ($C$). The existence of *one* biting partition breaks coherence.
  *   **Limitation (Must Assert):** The game shows inconsistency for *one* pair ($A, C$). You must assert Lewis's result: this forces *all* correlated pairs to be independent, collapsing probability. The game cannot simulate the collapse, only the local conflict.
  *   **Revision Friction:** If teams revise too easily, increase chip cost. Abandoning assumptions must feel expensive.

  ### Instructor Notes
  *   **Keep it neutral:** Do not validate Ramsey pricing as "correct" until debrief. Treat it as market rule.
  *   **The Trap:** Ensure House calculates LOTP aloud on whiteboard during The Squeeze. Visualize the gap (0.50 vs 0.33).
  *   **Exit Enforcement:** If a team drops (2), they cannot be forced to buy/sell $A \rightarrow C$ outright in Final Round. If they drop (4), House takes 10 chips automatically.
  *   **Reveal:** Only name Lewis and Triviality in final 5 minutes. Connect "The Squeeze" to "Triviality Result."
