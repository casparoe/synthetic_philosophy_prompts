          *   *Drafting thought:* Argue against the "verbal" claim. If it were just semantics, defining "ability" would solve it. But the dispute is about whether *that* definition matters for morality. It's a substantive clash about the necessary conditions for desert.

      *   **What would count as progress (~150 words):**
          *   Not new cases.
          *   Need to shift from intuition-pumping to explaining *why* we want PAP or Sourcehood.
          *   Progress = explaining the value of alternative possibilities. Why do we care? Is it about fairness? Control?
          *   If we can't agree on the *function* of responsibility, cases won't help.
          *   Progress is meta-ethical or conceptual analysis of "responsibility" itself, not more Frankfurt cases.

      *   **What I should do with my thesis (~120 words):**
          *   Don't try to prove PAP dead.
          *   Use the case to demonstrate the stalemate.
          *   Argue that the literature is indeed circular because the cases are theory-laden.
          *   Validate the supervisor's claim but add nuance: the circle reveals the deeper theoretical split.
