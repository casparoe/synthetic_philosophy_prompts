      *   *Claim 2 (Kantian/Strong):* Moral worth *supervenes* only on the will. (Outcomes don't add/subtract worth).
      *   *Claim 3 (Aretaic Focus):* Evaluation of *character* vs. evaluation of *action*.
      *   *Claim 4 (Modal/Robustness):* Worth requires stability across possible worlds (luck resistance).
      *   *Claim 5 (Deontic vs. Aretaic):* Rightness of act vs. Praiseworthiness of agent.

  4.  **Drafting the Claims & Evaluations:**

      *   *Claim 1: The Relevance Claim.* Intentions matter for *some* moral evaluation.
          *   Plausibility: High (Settled). Almost everyone agrees intentions matter for *praise/blame*, even if consequences matter for *rightness*.
          *   Surgeon Case: Doesn't support dismissing the patient's survival as irrelevant to *outcome* evaluation, but does support criticizing the motive.

      *   *Claim 2: The Supervenience Claim (Kantian).* Moral worth *exclusively* supervenes on the good will.
          *   Plausibility: Contested. Kantians say yes; Consequentialists say no.
          *   Surgeon Case: Supports the seminar claim directly. If worth is *only* will, the good outcome adds nothing.

      *   *Claim 3: The Locus Claim (Deontic vs. Aretaic).* Distinguish "Right Act" (world-dependent) from "Praiseworthy Agent" (will-dependent).
          *   Plausibility: Widely accepted distinction, though application varies.
          *   Surgeon Case: The act might be "right" (patient saved), but the agent isn't "praiseworthy." The slogan conflates these if used to say the *act* has zero value.

      *   *Claim 4: The Modal/Robustness Claim.* Moral worth requires counterfactual stability (would you do it if luck changed?).
          *   Plausibility: Contested (Lewis vs. Kantians vs. Moral Luck skeptics).
          *   Surgeon Case: If the surgeon would *not* have operated if the boss wasn't watching, her will is contingent on luck. This undermines worth.

      *   *Claim 5: The Control Principle.* Ought implies Can. We can only control the will, not the world.
          *   Plausibility: Contested (Williams/Nagel on Moral Luck).
          *   Surgeon Case: Supports the idea that we can't praise/blame for the survival (luck), only the attempt.

  5.  **Addressing Specific User Queries:**
      *   *Hidden Modal Claim:* Yes, often implies that worth must be robust against luck (Nagel's "constitutive/circumstantial luck").
      *   *Locus of Evaluation:* Crucial distinction between Act-Assessment and Agent-Assessment.
      *   *Motivational vs. Deontic Credit:* Need to separate "Did she do the right thing?" (Deontic/Outcome) from "Is she good for doing it?" (Motivational/Worth).
      *   *Settled vs. Contested:*
          *   Settled: Intentions matter for praise/blame. Distinction between act and agent exists.
