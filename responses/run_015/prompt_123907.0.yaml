answer: |-
  The slogan "moral worth is in the will, not in the world" is a colloquial compression of a Kantian thesis, but in seminar discourse, it often functions as a polyvalent shield against moral luck arguments. To bring precision to your paper, you need to disentangle the *locus* of evaluation (what are we judging?) from the *conditions* of evaluation (what properties matter?).

  Here is a conceptual menu of the distinct claims this slogan might be expressing, ranked from weak/trivial to strong/radical, followed by an analysis of the modal dimensions and the credit distinctions you requested.

  ### 1. The Conceptual Menu

  #### Claim A: The Relevance Claim (Weak)
  *   **Formulation:** Internal mental states (intentions, motives) are *relevant* to moral evaluation, not just external outcomes.
  *   **Status:** **Broadly Settled.** Even most consequentialists admit intentions matter for *blame/praise*, even if they don't determine *rightness*.
  *   **Plausibility:** High. It is counterintuitive to say a clumsy benefactor and a malicious poisoner are morally identical if the patient dies in both cases.
  *   **Application to Surgeon:** Supports criticizing the surgeon's motive, but **does not support** claiming the patient's survival has *zero* value. It allows that the outcome is good, even if the will is bad.
  *   **Does it shut down luck talk?** No. It just adds intentions to the ledger; it doesn't erase outcomes.

  #### Claim B: The Locus Claim (Moderate)
  *   **Formulation:** We must distinguish between the evaluation of the *act* (deontic) and the evaluation of the *agent* (aretaic). "Moral worth" refers specifically to the agent's praiseworthiness, not the act's rightness.
  *   **Status:** **Settled Distinction, Contested Application.** Philosophers agree the concepts are distinct, but disagree on whether they can be cleanly separated in practice.
  *   **Plausibility:** High conceptual clarity. An act can be "right" (patient saved) while the agent is "not virtuous" (did it for vanity).
  *   **Application to Surgeon:** If the slogan means "The *surgeon* gets no credit," it holds. If it means "The *surgery* had no value," it fails. The seminar participant likely conflated the two to make a stronger point.
  *   **Does it shut down luck talk?** Partially. It confines luck to the evaluation of the *act's success*, protecting the *agent's worth* from luck.

  #### Claim C: The Supervenience Claim (Strong/Kantian)
  *   **Formulation:** Moral worth *supervenes exclusively* on the quality of the will. Outcomes literally cannot add to or subtract from moral worth, even instrumentally.
  *   **Status:** **Heavily Contested.** This is the core of the Moral Luck debate (Nagel, Williams, Kant).
  *   **Plausibility:** Contested. It protects moral agency from contingency but risks making morality disconnected from human welfare.
  *   **Application to Surgeon:** This is the only claim that supports the "zero moral value" assertion regarding the *agent*. On this view, the saved patient is a lucky accident that adds no moral weight to the surgeon's will.
  *   **Does it shut down luck talk?** Yes, by definition. It defines moral worth such that luck is excluded.

  #### Claim D: The Control Principle Claim (Radical)
  *   **Formulation:** We can only be morally assessed on what is within our control. Since the "world" (outcomes) is subject to luck, it cannot be a locus of moral assessment.
  *   **Status:** **Contested.** Thomas Nagel's "Moral Luck" famously argues that we *do* assess people on luck, suggesting the Control Principle is false or limited.
  *   **Plausibility:** Intuitively strong, empirically weak. We intuitively feel luck shouldn't matter, but our practices (negligence laws, blame for accidents) show it does.
  *   **Application to Surgeon:** Supports the idea that the surgeon isn't praiseworthy for the *survival* (luck/skill mix), only for the *attempt*.
  *   **Does it shut down luck talk?** It attempts to legislate luck out of existence, which many argue is impossible.

  #### Claim E: The Constitutive Claim (Metaphysical)
  *   **Formulation:** The "will" is the only part of the self that is truly *ours*. Outcomes are external to the moral self.
  *   **Status:** **Contested.** Depends on a specific metaphysics of agency (internalism vs. externalism about action).
  *   **Plausibility:** Low to Moderate. Many externalists argue intentions are partly constituted by their relation to the world.
  *   **Application to Surgeon:** Implies the surgeon's "moral self" was never engaged with the patient's life, only with her own ego.
  *   **Does it shut down luck talk?** Yes, by shrinking the moral self to a point immune to the world.

  ---

  ### 2. The Hidden Modal Claim (Counterfactual Robustness)

  You asked if there is a hidden modal claim. **Yes.**

  When seminar participants use this slogan to dismiss lucky outcomes, they are often implicitly invoking a **robustness condition**.
  *   **The Claim:** For an action to have moral worth, the agent must have been disposed to perform it across a range of nearby possible worlds where circumstantial luck varies.
  *   **The Surgeon Case:** If the surgeon saves the patient *only* because the boss is watching, then in the nearby possible world where the boss is absent, the surgeon does not operate (or operates negligently).
  *   **Implication:** Her will is not robust; it is contingent on external factors (the world). Therefore, the "will" itself is contaminated by the "world."
  *   **Precision for your paper:** The slogan isn't just about the *actual* world's outcome; it's about the *stability* of the motive. If the motive relies on worldly validation (boss's approval), it fails the "in the will" test because the will is dependent on the world.

  **Is this settled?** No. Some virtue ethicists argue that sensitivity to context (the world) is a feature of good will, not a bug. However, regarding *moral worth* specifically, the robustness requirement is a standard Kantian move to filter out luck.

  ---

  ### 3. Motivational Credit vs. Deontic Credit

  To achieve the precision you want, you must distinguish these two currencies of evaluation. The slogan conflates them.

  | Feature | **Deontic Credit** (Rightness/Permissibility) | **Motivational Credit** (Moral Worth/Praise) |
  | :--- | :--- | :--- |
  | **Primary Question** | Did the agent do what was required/allowed? | Is the agent good/praiseworthy for doing it? |
  | **Dependence on World** | **High.** Usually requires successful outcome (e.g., "saved the patient"). | **Low (allegedly).** Depends on motive (e.g., "duty vs. vanity"). |
  | **Effect of Luck** | Outcomes determine success/failure. | Luck should theoretically be filtered out. |
  | **Surgeon Case** | **Positive.** The act was objectively right; the patient lives. | **Negative/Zero.** The motive was self-serving. |
  | **Slogan Validity** | **False.** Deontic status often *is* in the world. | **Plausible.** Worth is typically tied to the will. |

  **The Error in the Seminar:** When your peer claimed the surgeon's action had "zero moral value," they likely meant "zero *motivational credit*." However, by ignoring *deontic credit*, they ignore that the world *did* change for the better, and the surgeon was the causal agent. A precise paper should argue that the slogan is true for Motivational Credit but false for Deontic Credit.

  ---

  ### 4. Map of Settled vs. Contested

  To ensure you do not present contested views as consensus, use this map in your paper:

  **Settled (General Consensus):**
  1.  **Intentions matter:** Almost no one argues motives are *irrelevant* to all moral evaluation.
  2.  **Distinction exists:** There is a conceptual difference between "the act was right" and "the agent is praiseworthy."
  3.  **Luck exists:** It is agreed that outcomes are often subject to luck (constitutive, circumstantial, resultant).

  **Contested (Live Debates):**
  1.  **The Extent of Luck's Influence:** Does resultant luck (the outcome) affect *blameworthiness*? (The Nagel/Williams debate). Some say yes (negligence), some say no (Kantians).
  2.  **Supervenience:** Does moral worth *strictly* supervene on the will? Consequentialists deny this; Kantians affirm it.
  3.  **The Control Principle:** Is it true that we are only assessable on what we control? Many argue our actual practices violate this, and some argue they *should*.
  4.  **Internalism about Will:** Can we isolate the "will" from the "world" cleanly? Externalists about mental content argue the will is partly constituted by environmental factors.

  ### 5. Recommendation for Your Paper

  Do not treat the slogan as a single proposition. Treat it as a **category error warning**.

  1.  **Concede the Kernel of Truth:** Acknowledge that for *aretaic appraisal* (character/motivational credit), the slogan is robust. The surgeon deserves no *praise* for her character.
  2.  **Identify the Overreach:** Argue that the slogan becomes false when applied to *deontic appraisal* (rightness/outcome credit). The surgery had value, even if the surgeon didn't.
  3.  **Integrate the Modal:** Use the counterfactual robustness point to explain *why* the surgeon's will fails. It wasn't just that she wanted to impress the boss; it's that her commitment to the patient's life was contingent on that impression. Her will was not autonomous; it was heteronomous (dependent on the world).
  4.  **Final Precision:** The slogan should be revised to: *"Motivational credit is in the will, but deontic success is often in the world."* This preserves the insight without denying the value of the patient's survival.

  This approach allows you to validate your seminar peers' intuition (the surgeon isn't a hero) without accepting the radical implication that the patient's survival is morally irrelevant.
