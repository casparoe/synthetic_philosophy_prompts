  Hey there, it sounds like you and your classmates had a really intense lunch debate, and honestly that is exactly the kind of critical thinking Mr. Harris probably wants to see in an AP World class. It is great that you are trying to figure out his internal logic before the Model UN simulation because consistency is key in these arguments. Based on the examples you gave me about Bengal, Ireland, China, and the 1816 volcanic eruption, I think we can distill his thinking into two distinct rules that both fit his past statements but lead to different conclusions for your Alvara scenario.

  The first rule we could attribute to him is what I would call the Intent and Action Rule. Under this framework, a famine is classified as a political crime primarily when the government actively worsens the situation through malice, negligence, or extraction. This rule looks at whether leaders are lying about harvests, shipping food out while people starve, or seizing grain for ideological goals. If the government is trying to help, bans exports, opens granaries, and allows a free press, then the famine is viewed as a natural disaster or a tragedy because the human agency involved was benevolent rather than destructive. If Mr. Harris were using this rule, he would have to say that the Alvara famine was a natural disaster. The government in your scenario did everything right on paper by banning exports and trying to buy food, and unlike the cases of Ireland or Bengal, no food was shipped out for profit while people died. The deaths were caused by the drought, the price spikes, and the floods, not by government theft or lies.

  The second rule is the Capacity and Entitlement Rule, which seems much closer to the economist Amartya Sen's actual theory and Mr. Harris's specific justification for the 1816 exception. This rule states that a famine is a political crime if survival was physically and economically possible given the technology and global market conditions of the time, regardless of government intent. The key here is preventability. Under this rule, the 1816 famine was natural only because there was literally no food to move and transport technology was too primitive to overcome the scarcity. However, if food exists elsewhere and modern transport exists, failures to deliver that food are political failures of entitlement protection. If Mr. Harris is using this rule, he would have to say that the Alvara famine is a political crime. Even though the government tried to help, the fact that thirty thousand people died in 2019 when global food markets existed and modern trucks were available suggests a failure of policy regarding reserves, infrastructure resilience, or economic management. The floods blocking the rail for seven weeks is a serious obstacle, but in the modern era, it is not the same absolute impossibility as horses and carts facing a global crop failure.

  My best guess is that Mr. Harris is actually using the second rule, the Capacity and Entitlement Rule, because of the specific way he described the 1816 case. He explicitly noted that the 1816 famine was natural even though the kings were selfish, which tells us that bad intent alone does not make a famine a political crime in his view. Instead, he focused on the physical impossibility of moving food at that time. This implies that if physical movement is possible, as it is in 2019 with trucks and global shipping, the responsibility falls on the state to ensure entitlements are protected. Since the Alvara government failed to prevent thirty thousand deaths despite the existence of global food supplies and modern technology, Harris would likely argue this was a failure of political capacity and therefore a political crime, or at least a systemic political failure, rather than a pure act of nature. He would likely point out that a robust state should have had enough reserves to cover a seven-week transport gap or better infrastructure to handle the floods.

  Regarding the historical analog, the case that is closest to Alvara is actually the Bengal famine during World War II, not the 1816 volcanic eruption. While the Alvara government acted more ethically than the British colonial administration, the mechanism of the famine is the same. In both cases, there was a local crop failure but food was available elsewhere in the world. In Bengal, rice was moving out and wages collapsed; in Alvara, rice was available but prices doubled and transport failed. Both scenarios represent a failure of entitlement where people starved not because food was absent from the planet, but because they could not access it due to economic and logistical barriers. The 1816 case is different because the crop failure was widespread and global, meaning there was no surplus to access anywhere, which matches the absolute scarcity condition Harris used to excuse the kings of that era.

  To separate these two rules for sure, you would need a made-up case where the government has good intentions but high capacity, yet people still die due to incompetence. Imagine a country called Democravia where a benevolent democratic government with a free press tries to save its people during a drought. They have full granaries and working trucks, and food is available at normal prices, but due to pure bureaucratic incompetence and poor coordination, the food rots in warehouses while thirty thousand people starve. The Intent Rule would classify this as a natural disaster or tragedy because the government meant well and did not act maliciously. However, the Capacity Rule would classify this as a political crime because the deaths were entirely preventable given the resources and technology available. If Mr. Harris calls this hypothetical case a political crime, it confirms he is using the Capacity Rule, but if he calls it a tragedy, he is using the Intent Rule. I hope this helps you prepare for your simulation and good luck with the debate.
