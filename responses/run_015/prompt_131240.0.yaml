answer: |-
  This is a remarkably sharp observation. You have identified a specific pathology of democratic practice that shows up in national politics all the time, but is often harder to spot in miniature because the stakes feel lower. You are right to sense that this isn't just lying, and it isn't just standard disagreement. It is a structural move regarding *where legitimacy comes from*.

  Here is the brainstorming process you asked for, followed by the carving of the concept.

  ### The Near-Misses

  Before we land on the right term, we have to clear away the concepts that look similar but don't quite fit the geometry of what you're seeing.

  **1. Demagoguery**
  *   **What it is:** A leader appealing to popular desires and prejudices rather than rational argument, often to gain power.
  *   **Why it's wrong:** Demagoguery is usually about *emotion*. It's "I know you're angry, and I'll fix it." Your committee member isn't necessarily stoking anger; he's stoking *clarity*. He isn't saying "I know you're mad about the bus depot," he's saying "You *want* the lawsuit, you just haven't realized it yet." Demagoguery is often cynical; your man seems to believe his own logic. He isn't riding a wave; he claims to *be* the wave.

  **2. Rousseau's "General Will"**
  *   **What it is:** The idea that a community has a collective interest that is different from the sum of individual selfish interests. A leader might say, "You voted for the roof, but the *good* of the community requires the lawsuit."
  *   **Why it's wrong:** This is the closest theoretical ancestor, but the distinction is vital. Rousseau's General Will is about what is *objectively good* for the people (their best interest). Your committee member is not claiming the lawsuit is *better* for you; he is claiming it is what you *desire*. He is not a guardian telling you what's good for you; he is a mirror telling you who you are. He bypasses the "interest" argument entirely and goes straight to "identity."

  **3. Gaslighting**
  *   **What it is:** A psychological manipulation where a person makes someone question their own reality or memory.
  *   **Why it's wrong:** Gaslighting is interpersonal and malicious. It destabilizes the victim. What your committee member is doing is *political* and *stabilizing* (for him). When members say, "I finally understood what I wanted all along," they feel *more* stable, not less. He isn't breaking their reality; he is offering them a more coherent version of it that aligns with his preference. It feels principled to him because he believes he is revealing truth, not distorting it.

  ### The Verdict: One Phenomenon

  These two episodes are not different tricks; they are the offensive and defensive wings of the same strategy.

  *   **Episode 1 (The Lawsuit)** is the **Offensive Move:** He defines what the People *want* (the Will).
  *   **Episode 2 (The Vote)** is the **Defensive Move:** He defines who the People *are* (the Demos).

  Together, they create a closed loop. If the people vote for what he wants, he says, "See, I speak for the people." If they vote against what he wants, he says, "Those aren't the real people." This makes his position **unfalsifiable**. There is no empirical evidence (survey or vote) that can prove him wrong, because he controls the definition of the evidence.

  ### The Concept: "The Authenticity Override"

  In political theory, this falls under the umbrella of **Populism**, specifically what scholars call **"Exclusive Moral Representation."** But that is a broad category. For the specific maneuver you are witnessing, I propose we call it **The Authenticity Override.**

  Here is the carving of the concept:

  **What it is:**
  The Authenticity Override is a political maneuver where a leader claims access to a "higher" version of the group's identity or will that supersedes empirical data (votes, surveys, headcounts). It posits that there is a "Real People" (authentic, historic, true-minded) distinct from the "Empirical People" (who show up, vote, and change their minds).

  When the Empirical People disagree with the leader, the leader invokes the Real People to override the outcome. This is done in two ways:
  1.  **Imputation (Episode 1):** "You voted X, but your *true* self wants Y. I am not changing your mind; I am removing the noise so your true will can emerge."
  2.  **Exclusion (Episode 2):** "You voted against me, but you are not part of the *true* body. You are new, uninformed, or transient. Therefore, your vote doesn't count toward the 'Real' will."

  **What it isn't:**
  *   It is not **Trusteeship:** A trustee says, "I know you want X, but I think Y is better, so I will vote Y and take the blame." Your guy says, "You *really* want Y."
  *   It is not **Fraud:** Fraud is hiding the vote count. This is redefining what the vote *means*.
  *   It is not **Disagreement:** Disagreement accepts the other side's right to exist within the group. The Authenticity Override questions the other side's *membership* in the group.

  **Where the edges are (The Boundary Case):**
  To see the boundary, consider a member who says: *"I think the newer members don't understand the history, so I'm going to spend more time explaining the lawsuit to them so they vote differently next time."*

  *   **Why this is outside the concept:** This is **Persuasion.** It accepts the newer members as legitimate voters whose minds can be changed through argument. It treats the "Empirical People" as the valid audience.
  *   **Why your guy is inside the concept:** He didn't try to persuade the new members to change their vote. He declared their vote *illegitimate* because of who they are ("people who show up to one meeting a year"). He didn't seek to win the majority; he sought to invalidate the majority.

  ### Why it feels principled to him

  You noted this seems "genuinely principled from inside his way of seeing things." That is the most dangerous part of the Authenticity Override.

  He likely views the Neighborhood Association not as a **procedural democracy** (where legitimacy comes from following the rules of voting), but as an **organic community** (where legitimacy comes from history, tenure, and "understanding the place"). In his mind, the "Real Association" was built by the old-timers. The new people are guests. The survey results were "noise" caused by confusion.

  He believes he is the guardian of the Association's soul. When he says, "I just say out loud what people already feel," he isn't lying. In his ontology, he *is* the voice of the Association, and the Association is a mystical entity that exists above the current membership list.

  ### Summary for your context

  You are dealing with a man operating on **The Authenticity Override**.

  *   **The Diagnostic:** If you cannot prove him wrong because he redefines the terms of the argument (the voters or the will) whenever he loses, you are facing this phenomenon.
  *   **The Counter-Move:** You cannot defeat this with more surveys or better arguments, because he will just claim the surveyors are "noise" or the arguers are "outsiders." The only counter is **Procedural Rigor.** You must anchor legitimacy in the *rules*, not the *people*. "The Bylaws say a majority vote decides, regardless of tenure."
  *   **The Risk:** If you let him get away with Episode 2 (defining who counts), he wins permanently. Once he establishes that "Real Members" are only the ones who agree with him, democracy in the association ends. It becomes a council of the like-minded.

  He is not a demagogue in the street-corner sense; he is a **constitutional populist** in miniature. He is trying to write an unwritten constitution where *he* is the interpreter of who counts and what they want.
