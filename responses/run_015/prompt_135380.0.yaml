answer: |-
  A split-brain patient sits across from a bank manager applying for a personal loan. The manager taps the signature line and says, "This contract requires a singular moral agent. I need you to warrant that the hand signing this represents the mind authorizing it. Unified agency, you understand? We need to know who to hold liable."

  The patient's Left Hemisphere—the speaking self—replies smoothly, "Naturally. I am one mind."

  At that exact moment, the patient's Left Hand, controlled by the silent Right Hemisphere, abruptly circles "Skydiving Lessons" on the list of expenses. The Right Hemisphere had just been flashed an image of a *parachute* in the left visual field.

  The manager blinks. "Skydiving? You're an actuary. What's the strategic rationale?"

  The Left Hemisphere didn't see the parachute. It only sees the checkmark its counterpart made. Desperate to maintain coherence, it instantly concocts a story: "High-risk hobbies balance my low-risk profession. It's about psychological equilibrium."

  The manager nods, relieved. "Okay, as long as there's a coherent reason, we have a responsible borrower." He slides the money across the desk.

  The patient says, "Absolutely. I take full responsibility."

  Just then, the Left Hand reaches over and pockets the manager's stapler.

  The patient doesn't flinch. He just leans forward, maintains eye contact, and whispers, "Don't mind that. That's just... administrative diversification."
