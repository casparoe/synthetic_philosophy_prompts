answer: |-
  Good evening. For those who don't know me, I'm a former student of Miriam's, and I currently work as a VP of Generational Insights. I mention that title first because I know that for about thirty-five people in this room, it functions less as a job description and more as a trigger warning.

  Three weeks ago, my team published a report claiming that Gen Z detects inauthentic brand voice within roughly eight seconds. It was widely mocked. Miriam's email to me consisted of four words: "I raised you better."

  She was not expressing disappointment in my morals. She was expressing disappointment in my denominator.

  Standing here to honor Miriam Kessel is harder than the eulogy I gave for my father. A eulogy has a conventional shape: a life begins, it unfolds, it ends. But Miriam has spent thirty-five years arguing that the shapes we draw around time are administrative, not natural. To honor her correctly, I have to avoid the very tropes that make a retirement speech easy. I cannot talk about the "era" she defined. I cannot talk about the "spirit of the times" she captured. And, most critically, I was explicitly instructed that if I say she "shaped a generation of scholars," she will stand up and walk out of this dinner. Miriam does not bluff on methodological grounds. So, I will not say that. I will say instead that she shaped *scholars*. Individually. Painstakingly. One at a time.

  For the family members here—her brother, her granddaughters, my own daughter—Miriam's work can sound like she was arguing that nothing matters. That generations aren't real. But that wasn't her point. Her point was that *causes* are real, but *characters* are stories we tell to make sense of the causes.

  She taught us that a birth cohort is an "administrative kind." It is real because institutions act on it. If you turn six years old two days before the school cutoff, you go to school a year earlier than your neighbor. That is a real cause. It changes who you meet, when you enter the labor market, whether you get drafted. But to say that makes you a specific *kind* of person—to say that because you started school in 1999 you are inherently more anxious or more optimistic than someone who started in 2000—is what she called a "level confusion." It mistakes an average for an individual.

  I see this distinction in this room. Miriam's granddaughters are nineteen and twenty-three. To a consultancy like mine, they are different data buckets. To Miriam, they are two individuals facing different administrative hurdles—one entered the housing market under different interest rates than the other, one faced different tuition structures. Those are causes. But who they *are*? That is not determined by the year on their driver's license.

  This is the inside joke I want to offer my former colleagues. We often talk about "cohort effects" as if they are forces of nature, like gravity. Miriam taught us that they are more like traffic laws. They constrain movement, they direct flow, but they don't determine the destination. And if you drive fast enough, or carefully enough, or simply pay attention to the road rather than the signpost, you might find the traffic doesn't apply to you the way the model predicts. In a field obsessed with identifying effects, Miriam was the one teaching us to identify the error term.

  To the department chair's question about where her work leaves the field: It leaves it safer. In an age where algorithms sort us into buckets for advertising, for credit, for insurance, Miriam's deflationary rigor is a form of protection. By insisting that aggregate differences do not justify individual assumptions, she gave us a vocabulary to resist being sorted. She taught us that when someone says, "People like you always think X," the correct response is, "There is no 'people like me.' There is only me, and the specific constraints I happened to walk into."

  I do not intend to stand here and recant my career. I believe there is value in understanding how groups move. But I try to do that work remembering that the map is not the territory. That the label is not the person. That eight seconds is a marketing hook, not a sociological fact.

  Miriam refused to be a character in her own story. She wouldn't let us be characters in hers. She demanded we be causes. She demanded we look at the mechanisms, the cutoffs, the structures, and the evidence.

  So, I am not going to toast the "legacy" she leaves, because legacy implies a transfer of property across time, and Miriam knows that period effects confound that calculation. I am not going to toast her "generation," because she would finish her drink and leave.

  Instead, I ask you to raise your glasses.

  To Miriam. For teaching us that while we may share a time, we do not share a fate. For insisting on the precision of the individual over the comfort of the category. And for knowing that while cohorts may be causes, love is the only variable that doesn't require a control group.

  To Miriam.
