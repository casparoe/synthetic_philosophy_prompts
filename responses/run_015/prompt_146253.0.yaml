answer: |-
  You have described a precise and pernicious epistemic mechanism. There is no single, universally agreed-upon term that captures exactly this second-order phenomenon (dead theory, living label, infrastructure-driven regeneration), but there is a close sociological cousin and a philosophical framework that, when combined, give you the vocabulary you need.

  The closest established term is **Zombie Category** (or **Zombie Concept**), coined by the sociologist Ulrich Beck. However, as you suspected, it requires tightening to fit your historiographical and digital humanities context. Where Beck used it to describe social categories (like "class" or "nation") that no longer describe social reality but still structure policy and identity, you are describing *periodization labels* that no longer describe historical continuity but still structure archives and corpora.

  Because "Zombie Category" is often used loosely in sociology, and because your mechanism relies specifically on *infrastructure* (catalogs, tags, shelving) to do the regenerating, I propose a more precise term for your context: **Infrastructural Reification**.

  Below is the breakdown of the phenomenon, its distinctions, its boundaries, and the answer to your question about "laundering."

  ### 1. The Name and Definition

  **Established Kin:** *Zombie Category* (Ulrich Beck).
  **Proposed Precise Term:** ***Infrastructural Reification***.

  **Definition:** Infrastructural Reification occurs when a conceptual classification persists and acquires ontological weight not because it accurately describes the world, but because the material and digital infrastructure built to operationalize it (catalogs, databases, shelving, curricula) generates data structures that make the classification appear empirically valid.

  It is "reification" (treating an abstraction as a concrete thing) driven by "infrastructure" (the systems that manage the objects). It is second-order because the *theory* justifying the label has been discarded, but the *label* has been embedded in systems that are harder to change than the theory.

  ### 2. Differentiation from Neighbours

  You asked to distinguish this from several specific concepts. Here is where the edges lie:

  *   **Vs. Ian Hacking's "Looping Effects" (Making Up People):**
      *   *Hacking:* Applies to "human kinds." When you classify people (e.g., "refugee," "autistic"), they react to the classification, changing their behavior, which changes the classification.
      *   *Your Case:* The books do not react. A 1470 incunabulum does not change because you tagged it "Renaissance."
      *   *The Difference:* Hacking's loop is *behavioral*; yours is *archival*. The loop does not happen in the object, but in the *corpus*. The tag changes which books are neighbors, which changes which comparisons are made, which changes the statistical "reality" of the period. It is a **Looping Effect on the Archive**, not the Object.

  *   **Vs. Theory-Ladenness of Observation:**
      *   *Theory-Ladenness:* I see a "chair" because my theory of furniture tells me to. The observation itself is shaped by theory.
      *   *Your Case:* You (and your colleagues) *see* the continuity. You explicitly *know* the theory is wrong. The observation is not laden; the **organization** is.
      *   *The Difference:* Theory-ladenness is cognitive/perceptual. Infrastructural Reification is institutional/operational. You can believe the theory is false and still participate in the reification by using the tag to make the database work.

  *   **Vs. Essentially Contested Concepts (Gallie):**
      *   *Contested:* Everyone agrees the term is valuable, but fights over what it includes (e.g., "Justice," "Art").
      *   *Your Case:* Nobody is fighting. Everyone agrees the "Renaissance break" is a myth. There is no contest over the *extension* based on value; there is a collective shrug while the label is applied anyway.
      *   *The Difference:* Contested concepts thrive on *disagreement*. Infrastructural Reification thrives on *consensus inertia*.

  *   **Vs. Vagueness or Political Loading:**
      *   *Vagueness:* The boundaries are fuzzy (e.g., "tall").
      *   *Political:* The term serves an ideology (e.g., "Western Civilization").
      *   *Your Case:* The term might be politically loaded, but that's not the mechanism you're describing. The mechanism is *bureaucratic*. The tag persists because it is useful for filing, not because it is politically expedient (though it may be that too).
      *   *The Difference:* Vagueness is a semantic property. Infrastructural Reification is a systemic property.

  ### 3. Boundary Cases: Why some labels "get away with it"

  You ask about the *Long Nineteenth Century* vs. *Late Antiquity* vs. *Renaissance*. The principled line is **Transparency of Convention**.

  *   **Heuristic Labels (The Long 19th Century):** These labels wear their conventionality on their sleeve. When a historian says "Long 19th Century," they are explicitly signaling: "I am using an arbitrary timeframe to make a point about continuity." The label does not claim to be a natural kind. It is a **tool**, not a **discovery**.
  *   **Reified Labels (The Renaissance):** These labels claim (or historically claimed) to name a *quality of the world*. Even if scholars now deny the quality, the label retains the grammatical structure of a discovery ("The Renaissance" vs. "The Period we call Renaissance").
  *   **The Creep (Late Antiquity):** You noted *Late Antiquity* started as a "thin name" (a neutral interval) and acquired "thick content." This is the process of **Ontological Creep**. A label begins as a heuristic convenience but, through Infrastructural Reification (courses, journals, chairs), accumulates enough gravity to pretend it is a natural kind.

  **The Test:** Does the label invite the question "When exactly did it start?" as a factual inquiry (Reified), or as a methodological negotiation (Heuristic)? If scholars argue about the *date* as if it were a physical boundary, the label is reified. If they argue about the *utility* of the date, it is heuristic.

  ### 4. The "Laundering" Question

  *Is there any way of telling from the inside whether a label has been successfully laundered, whether its current content is genuinely independent of the discredited claim it was born carrying?*

  The honest answer is **no**.

  This is due to **Epistemic Contamination**. Once a label has been used to structure an archive, the evidence extracted from that archive is tainted by the structure.

  If you tag all "Renaissance" books together, and then run a topic model on that corpus, and the model finds a "Renaissance style," you have not discovered a style. You have discovered the **shadow of your own tagging schema**. The infrastructure has pre-sorted the evidence to confirm the category.

  You cannot tell if the label has been laundered because the "clean" data you would use to test the label is itself the product of the label's previous applications. The only way to test it is to dismantle the infrastructure (remove the tags, reshuffle the corpus) and see if the pattern persists. But in Digital Humanities, dismantling the infrastructure is often impossible because the infrastructure *is* the project.

  ### Summary for your Project

  You are witnessing **Infrastructural Reification**.

  1.  **The Mechanism:** Discredited theories persist because the infrastructure built to support them (tags, shelves, courses) generates data that validates them.
  2.  **The Distinction:** It is not a looping effect on objects (books don't change), but a looping effect on the *archive* (the corpus becomes artificially divided).
  3.  **The Boundary:** Labels that admit they are conventions (Long 19th C) are safe; labels that pretend to be discoveries (Renaissance) are reified.
  4.  **The Risk:** You cannot know if your tags are "clean." You must assume they carry the **ontological baggage** of their origin.

  **Recommendation:** In your documentation, do not treat these tags as descriptive metadata. Treat them as **provenance metadata**. Tag a book not as `Period: Renaissance`, but as `Historiographical_Tradition: Renaissance`. This shifts the claim from "This book *is* Renaissance" to "This book *has been classified* as Renaissance," which breaks the reification loop by making the infrastructure's role visible.
