  3. Views 1 and 2 create a normative tension because believing more lives are better usually implies some duty to promote them, which your anti-incentive stance denies. You must resolve this by valuing bodily autonomy higher than the impersonal good of adding happy people.
  4. Views 3 and 2 clash practically, as preventing the tragedy of extinction might require state action that your libertarian leanings forbid. You would need to concede that existential risk is severe enough to justify limited pronatalist policies.
