  i've been going down a rabbit hole online about falling birth rates and pronatalism and i've ended up holding a bunch of views that i cant tell are compatible. roughly where i've landed:

  1. more people living good lives is genuinely better than fewer — a world with more happy people in it is a better world, not just a bigger one.
  2. nobody is obligated to have kids, and i don't think governments should be paying people to have them either; that's a personal decision and the state should keep out of it.
  3. if humanity actually died out, that would be a massive tragedy, way bigger than the deaths of whoever was alive at the time, mostly because of everyone who would then never get to exist.
  4. but i also don't think it's bad for anyone that they were never born — there's nobody there to be shortchanged, so no one is worse off for not existing.
  5. and when i compare two possible futures i basically add up the well-being, but i keep finding that i'd still rather have a world where everyone is at least doing okay than one with a bigger total that comes from a few people being extremely well off and a lot of people scrapping by.

