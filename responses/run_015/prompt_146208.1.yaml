  ## V. Appendix A: The Vexil Code (Minimal Materials)

  **The Glyphs:**
  1.  **O** (Circle)
  2.  **Δ** (Triangle)
  3.  **→** (Vector/Arrow)
  4.  **●** (Dot)

  **The 10 Rules (Handout for Phase 2):**
  1.  **O** denotes a boundary.
  2.  **Δ** denotes a disruption.
  3.  **→** indicates directionality from Subject to Object.
  4.  **●** negates the preceding glyph.
  5.  **O** + **Δ** = Contained Conflict.
  6.  **→** cannot cross **O** without **●**.
  7.  Double **Δ** indicates recursion.
  8.  **●** at the end of a line terminates the sequence.
  9.  Vertical alignment implies hierarchy.
  10. Horizontal alignment implies sequence.

  **Sample Text (Phase 1 Only):**
  `O → Δ ●`
  `Δ Δ → O`
  `● O → Δ`
  `Δ → O ●`

