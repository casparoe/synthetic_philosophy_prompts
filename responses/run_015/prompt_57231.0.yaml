answer: |-
  ### The Liability Audit

  This is not a test of grammar. It is a test of ownership. Your narrator's "I" is a legal entity in the world of your book. This audit determines whether that entity is a single, continuous owner (The Same Self) or a successor inheriting an estate (The Changing Self).

  Run these three questions on the manuscript passage. Answer **Yes** or **No** based strictly on the logic of the scene, not how you wish it felt.

  **1. The Debt Test**
  If the nineteen-year-old borrowed money (or trust) and never paid it back, does the seventy-one-year-old *owe* it, or is she just living with the memory of the debt?
  *   **Yes:** She owes it. (Continuous)
  *   **No:** It's a bad memory, not a bill. (Changing)

  **2. The Repair Test**
  If the nineteen-year-old hurt someone, can the seventy-one-year-old fix it by apologizing *now*, or is the damage sealed in the past where she can't reach it?
  *   **Yes:** She can fix it. (Continuous)
  *   **No:** She can only witness the damage. (Changing)

  **3. The Title Test**
  If the nineteen-year-old earned a reputation (a medal, a criminal record, a house), whose name is on the deed today?
  *   **Yes:** The seventy-one-year-old's name. (Continuous)
  *   **No:** It belongs to the girl; the woman just lives there. (Changing)

  ***

  ### How to Read the Results

  *   **3 Matches (All Yes or All No):** The metaphysics forces your hand. You cannot write the scene any other way without breaking the internal logic of the character's reality. This is **Metaphysics**.
  *   **A Split (e.g., 2 Yes, 1 No):** The logic is ambiguous. The character is conflicted. You are free to decide based on rhythm, tone, or voice. This is **Voice**.

  *   **The Freedom Flag:** Look at *who* is affected in the scene.
      *   If the scene is only about how the narrator *feels* (internal), you have **Free Choice**. You can pick the metaphysics that sounds best.
      *   If the scene involves *other people* (a creditor, a victim, a heir), you have **Forced Hand**. You must follow the Audit results, or the narrator becomes unreliable.

  ***

  ### The Run-Through

  Here is the Audit applied to your three specific scenes. I have stated your desired outcome for each, then applied the test.

  #### Scene 1: Pride (The Brave Act)
  *The nineteen-year-old stood up to a tyrant. The seventy-one-year-old glows with this memory.*
  *   **Your Desire:** You want her to claim the bravery fully. "I was brave."
  *   **The Audit:**
      1.  **Debt:** Does she own the consequences of that stand? **Yes.**
      2.  **Repair:** If the stand caused collateral damage, could she fix it? **Yes.**
      3.  **Title:** Is the medal in her current display case? **Yes.**
  *   **Result:** 3 Matches (Continuous).
  *   **Verdict:** **Metaphysics (Forced Hand).** The logic holds. You wanted her to claim it, and the Audit says she owns it. You are free to write this with full ownership. The "I" picks up the whole person.

  #### Scene 2: Shame (The Cruel Act)
  *The nineteen-year-old betrayed a friend. The seventy-one-year-old wants to say, "That wasn't me. I was a different person then."*
  *   **Your Desire:** You want her to disown the girl. You want distance. "She did it, not I."
  *   **The Audit:**
      1.  **Debt:** The friend is still hurt. Does the seventy-one-year-old owe an apology? **Yes.** (If she doesn't owe it, no one does, and the moral universe of the book breaks).
      2.  **Repair:** Can she fix it by apologizing now? **Yes.** (If she can't, the scene is hopeless nihilism).
      3.  **Title:** Does the reputation of "betrayer" stick to her current name? **Yes.**
  *   **Result:** 3 Matches (Continuous).
  *   **Verdict:** **Metaphysics (Forced Hand).**
  *   **The Contradiction:** **The Audit says No to your desire.** You want her to disown the act ("That wasn't me"), but the Liability Audit dictates that because there is an external victim (the friend), the debt transfers. If she says "That wasn't me," she is lying to the reader. To maintain metaphysical consistency, she must say, "I did this, and I am still responsible." You cannot have the distance you want without making the narrator morally evasive.

  #### Scene 3: Credit (The Reckless Success)
  *The nineteen-year-old took a dangerous risk that paid off. The seventy-one-year-old would never take that risk now, but wants the success.*
  *   **Your Desire:** You want her to claim the prize but deny the method. "I won, but I wouldn't gamble like that today."
  *   **The Audit:**
      1.  **Debt:** Does she owe the taxes on the winnings? **Yes.**
      2.  **Repair:** If the risk hurt someone, is she liable? **Yes.**
      3.  **Title:** Is the money in her current bank account? **Yes.**
      *   *However:*
      4.  **Voice Check:** Does she *feel* like the gambler? **No.**
  *   **Result:** Split (External liabilities are Continuous, Internal identity is Changing).
  *   **Verdict:** **Voice (Free Choice).** Because the external debts are paid (presumably), and the conflict is internal (how she views her own courage), the metaphysics is loose here. You can write this as a split self. You can say, "I hold the money, but I don't recognize the hand that earned it." The Audit allows this ambiguity because no one else is currently being wronged.

  ***

  ### What This Cannot Settle

  The Audit settles **liability**, but it cannot settle **qualia** (the raw feeling of experience).

  1.  **The Sensation of Time:** The Audit cannot tell you if the memory *feels* like watching a movie (Changing Self) or reliving a breath (Continuous Self). That is a sensory choice, not a metaphysical one. You can have a Continuous Self who remembers the past distantly, or a Changing Self who feels the past vividly.
  2.  **The Unreliable Narrator:** If you *want* Scene 2 to be a disowning ("That wasn't me"), the Audit says you are making her unreliable. This procedure cannot tell you if that is a *good* artistic choice. It only tells you that it is a *specific* metaphysical choice. You can break the rules of the Audit, but then the breakage becomes the point of the story (i.e., she is in denial).
  3.  **The Pronoun:** As per your guard rule, this does not dictate "I" vs. "She." You can write "I did it" (Continuous) or "I am the one who houses her" (Changing). The Audit dictates the *weight* of the sentence, not the grammar.

  **Summary for your Co-Writer:**
  If someone else gets hurt, the narrator owns it (Scene 2). If only the narrator feels it, she can choose how to hold it (Scene 3). If the narrator benefits, she owns the benefit (Scene 1). Where there is a victim, you have no choice. Where there is only memory, you have freedom.
