prompt: |-
  I sit on the allocation committee of a foundation that must commit roughly $40 million a year across a mix of global health, animal welfare, and long-term-risk programs. For years our working framework has been the familiar three-factor one: score each candidate cause for importance, tractability, and neglectedness, multiply, rank. I have stopped trusting it. It now gives me answers that feel wrong in opposite directions — it dismisses things I am confident we should fund, and recommends things I am confident we should not — and I suspect the three factors are not three independent things. So I want a principle that captures the verdicts I actually hold, deduced from the cases rather than assumed in advance. The cases below are stylized deliberately: please do not read them as descriptions of any real organization, and no citations are needed.

  A. A delivery program with strong evidence, in a country whose ministry has already budgeted to take it over next year; our money would be one year of bridge funding. Verdict: no.
  B. The same program, same cost per unit of benefit, in a country where no takeover is planned and no other funder is present. Verdict: yes, obviously.
  C. A crowded cause — dozens of funders, billions already in the field — where the intervention is buying and distributing a physical input, so that an extra dollar really does buy an extra unit, with no talent or regulatory bottleneck. Verdict: yes, and I do not think the crowding counts against it at all.
  D. A different crowded cause where the binding constraint is a few hundred skilled people. Extra money there mostly raises salaries and moves those people between organizations inside the field. Verdict: no, even though on paper it is just as neglected as C.
  E. A serious risk for which no known intervention works, but where cheap short studies could substantially narrow the uncertainty. Verdict: yes — fund the studies — and I would fund them even if I expected the answer to be that nothing works.
  F. The same risk, the same cheap studies, except that the only actors who could act on the finding have publicly committed themselves against ever doing so. Verdict: no.
  G. An advocacy campaign that, if it succeeds, changes a procurement rule so the desired behavior becomes the default across a large market and persists after we stop paying. Verdict: strong yes.
  H. An advocacy campaign of equal cost and equal annual benefit while spending continues, which wins a budget line that must be re-won every year. Verdict: weak yes, and if I have to cut one, it is this one.
  I. A field in which only three organizations are capable of training new practitioners. Funding to expand those three organizations' training capacity: yes. A scholarship for one named individual to be trained at one of them: no — even though per dollar the scholarship appears to create more trained people — because the trainee would largely have been trained anyway or would take a slot someone else would have filled, whereas expanding capacity changes the steady-state flow.
  J. The case I keep going back and forth on: a single large gift to endow a permanent research institute in a neglected field, versus the same sum spread over ten years of renewable program grants. The institute has the look of a one-time purchase of durable capacity; the grants are flexible and let us exit if the field turns out to be a dead end. I lean toward the grants some months and toward the institute in others, and I cannot say what would settle it.

  My own tentative reformulation, which I want tested and repaired rather than confirmed: drop neglectedness as a separate factor, treat it as a proxy for the funging fraction — the share of what my dollar nominally buys that would have happened anyway — and note that crowding and fungibility plainly come apart, as C and D show. Treat tractability not as a multiplier but as the shape of the production function from dollars to outcomes, including where it saturates. Measure importance at the margin, as the value of the change in the outcome rather than the size of the outcome. And add two further terms: a lock-in share, being the portion of an intervention's total benefit that survives the end of spending, and a decision-sensitivity term for the value of information, which is zero when no downstream actor will act on what is learned, as in F. Something in this package still feels wrong to me about I, where the same nominal output gets opposite verdicts at different levels of granularity, and I suspect the fix is a requirement that the unit of intervention match the level at which the constraint binds.

  What I would like back: a principle, or at most three candidate principles, stated precisely enough that a colleague could apply it without me in the room; for each clause, the case above that earns it, and an explicit statement of which verdicts the principle cannot reproduce and which of them you think I should give up; the verdicts it yields on cases I have not listed, including at least one about an intervention whose whole effect is to make an outcome arrive sooner rather than to make it happen at all, and one about whether to spread a fixed sum across five causes or concentrate it in one when every production function is concave but uncertain; and finally, which clause is doing the most work in my own list of verdicts, and where my reformulation above is confused.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior allocation committee member at a significant foundation ($40M/year). Experienced, skeptical of standard Effective Altruism (EA) frameworks (ITN: Importance, Tractability, Neglectedness), looking for a more robust, empirically grounded decision theory.
      *   **Task:** Critique and refine their tentative reformulation of the allocation framework. Provide 1-3 precise principles that can be applied by colleagues. Map these principles to the provided cases (A-J). Identify limitations/verdicts the principle cannot reproduce (and suggest which to drop). Apply principles to new hypothetical cases (acceleration vs. creation, concentration vs. diversification). Identify the "workhorse" clause and confusion in the user's reformulation.
      *   **Tone:** Professional, analytical, precise, respectful of the user's expertise but willing to challenge assumptions. No citations needed (stylized cases).
      *   **Key Insight from User:** They suspect "Neglectedness" is actually a proxy for "Fungibility" (counterfactual impact). They see "Tractability" as a production function shape. They want to add "Lock-in" (sustainability) and "Decision-Sensitivity" (value of information). They are stuck on Case I (granularity/unit of analysis) and Case J (endowment vs. grants).

  2.  **Deconstruct the Cases & User's Intuitions:**
      *   A (Bridge funding, gov takeover): No. (Fungibility/Displacement high).
      *   B (Same program, no takeover): Yes. (Fungibility low).
      *   C (Crowded, physical input): Yes. (Marginal impact exists despite crowding).
      *   D (Crowded, talent bottleneck): No. (Money just bids up salaries, no real output increase).
      *   E (VoI, actors willing): Yes. (Value of Information high).
      *   F (VoI, actors unwilling): No. (Value of Information zero due to lack of agency downstream).
      *   G (Advocacy, permanent rule change): Strong Yes. (High Lock-in).
      *   H (Advocacy, recurring budget): Weak Yes. (Low Lock-in).
      *   I (Capacity vs. Scholarship): Capacity Yes, Scholarship No. (Systemic constraint vs. individual substitution).
      *   J (Endowment vs. Grants): Undecided. (Option value/Flexibility vs. Durability).

  3.  **Evaluate the User's Reformulation:**
      *   *Drop Neglectedness for Fungibility:* Good move. Cases A, B, C, D support this. Neglectedness is often a heuristic for "will my money actually buy something new?"
      *   *Tractability as Production Function:* Good. Cases C vs. D show money doesn't always translate linearly to outcomes (saturation/bottlenecks).
      *   *Importance at the Margin:* Standard economics, but crucial.
      *   *Lock-in:* Explains G vs. H.
      *   *Decision-Sensitivity (VoI):* Explains E vs. F.
      *   *The "Unit of Intervention" Confusion (Case I):* The user notes the verdict flips based on granularity. This suggests the principle needs to define the *counterfactual baseline* correctly, not just the unit.
      *   *Case J:* This is the classic "Option Value vs. Commitment" trade-off.

  4.  **Develop the Principles:**
      *   I need to synthesize the user's insights into a coherent framework. Let's call it the **Counterfactual Marginal Impact Framework (CMIF)** or something similar. Let's aim for three core principles that cover the bases.
      *   *Principle 1: The Counterfactual Attribution Rule.* (Addresses Fungibility/Neglectedness/Crowding). Focus on what *changes* because of the dollar, not what is *associated* with it. Covers A, B, C, D, I.
      *   *Principle 2: The Durability & Agency Multiplier.* (Addresses Lock-in and VoI). Benefits must persist, and someone must be able to use the information. Covers E, F, G, H.
      *   *Principle 3: The Option-Value Constraint.* (Addresses Case J and risk). Flexibility has value when uncertainty is high.

      *Refinement:* The user asked for *a* principle, or at most *three*. Let's try to condense this into one overarching maxim with three operational clauses. This feels more like a "constitution" for the committee.
      *   *Overarching:* Maximize Expected Counterfactual Impact.
      *   *Clause 1 (Fungibility):* Measure impact against the baseline trajectory, not the zero baseline. (Handles A, B, C, D, I).
      *   *Clause 2 (Persistence & Agency):* Discount benefits by the probability they persist and the probability they are acted upon. (Handles E, F, G, H).
      *   *Clause 3 (Flexibility):* Prefer flexible capital when the production function is unknown or volatile; prefer committed capital when the bottleneck is structural durability. (Handles J).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the critique. The ITN framework fails because it treats variables as independent when they are correlated (e.g., neglectedness often implies high fungibility risk if the cause is neglected *because* it's impossible, or low fungibility if it's neglected *because* no one else is there).
      *   *The Principles:* Formulate them precisely.
          1.  **The Counterfactual Baseline Principle:** Impact = (Outcome with funding) - (Outcome without funding). Explicitly handle "crowding" as a function of marginal productivity, not headcount.
          2.  **The Persistence & Agency Principle:** Impact must be discounted by duration (lock-in) and downstream utilization (decision-sensitivity).
          3.  **The Structural Constraint Principle:** Fund the binding constraint, not the symptom. (This fixes Case I).
      *   *Mapping Cases:* Go through A-J and assign them to the specific clause that drives the verdict.
      *   *Limitations:* Where does this fail? Maybe Case J is still ambiguous because it depends on risk tolerance. Maybe some "moral imperative" cases (rights violations) don't fit pure utilitarian calculus. I should suggest dropping the "weak yes" on H if it conflicts with G, or acknowledging J requires a risk parameter.
      *   *New Cases:*
          *   *Acceleration:* (e.g., curing a disease 5 years sooner). Value = Integral of benefit over the time gained.
          *   *Concentration vs. Diversification:* If production functions are concave (diminishing returns) but uncertain, diversification hedges against being wrong about which curve is best, but concentration maximizes impact if you know the curve. The principle should favor diversification *unless* one cause is clearly superior (information gap).
      *   *Diagnosis of User's Reformulation:*
          *   *Workhorse:* The Fungibility/Counterfactual clause. It explains A, B, C, D, I.
          *   *Confusion:* The "Unit of Intervention" thought in Case I. It's not about the unit size; it's about the *binding constraint*. The scholarship fails because the constraint is capacity, not tuition. The user's intuition is right, but the explanation ("unit of intervention") is slightly off. It's about *marginal contribution to the bottleneck*.

  6.  **Refining the Output:**
      *   Make sure the tone is peer-to-peer.
      *   Ensure the "Principle" is actionable.
      *   Check against all constraints in the prompt (cases mapped, new cases answered, confusion identified).

      *(Self-Correction during drafting)*: I need to be careful with Case I. The user says "I suspect the fix is a requirement that the unit of intervention match the level at which the constraint binds." I should validate this. Yes, that is exactly right. Funding a student when the bottleneck is *seats* is fungible (someone else takes the seat). Funding a *seat* is not. So the principle must specify funding the *constraint*, not the *activity*.

      *(Self-Correction on Case J)*: The user is undecided. A good principle shouldn't force a false binary. It should provide the *criteria* for the decision (Volatility of field vs. Need for permanence). I will frame the principle to resolve the tension by defining the condition for each.

      *(Self-Correction on "Importance at the Margin")*: The user suggested this. I should incorporate it but note that "Importance" is often the total stock, while we care about the flow change.

      *(Final Polish)*: Ensure the distinction between "Neglectedness" and "Fungibility" is clear. Neglectedness is a state of the world; Fungibility is a property of the investment.

  7.  **Final Structure:**
      1.  Introduction: Validate the critique of ITN.
      2.  The Proposed Framework (3 Clauses).
      3.  Case Mapping (A-J).
      4.  Limitations & Sacrifices.
      5.  New Case Applications (Acceleration, Diversification).
      6.  Diagnosis of User's Reformulation (Workhorse & Confusion).

  8.  (Mental Check of the "Principle" wording):
      *   Clause 1: Counterfactual Marginal Impact (Fungibility/Production Function).
      *   Clause 2: Durability & Agency (Lock-in/VoI).
      *   Clause 3: Constraint Alignment (Case I/J).
      *   Actually, let's merge 1 and 3. 1 is "What do we buy?" 3 is "Is this the right thing to buy to move the needle?" They are similar. Let's keep 3 distinct for Case I.
      *   Wait, the prompt asks for "A principle, or at most three candidate principles." I will offer one overarching principle with three operational clauses.

      *Let's refine the "Acceleration" case.* If an intervention speeds up a result by 5 years, the value is the net present value of those 5 years of benefit.
      *Let's refine the "Diversification" case.* With concave but uncertain functions, the optimal strategy depends on the variance of the uncertainty. If we are unsure about the *height* of the curve, diversify. If we are unsure about the *shape* (concavity), diversify. The principle should lean towards diversification under deep uncertainty (Case J logic).

      *Let's refine the "Confusion" section.* The user's confusion on Case I is thinking it's about "granularity." It's about "substitutability."

