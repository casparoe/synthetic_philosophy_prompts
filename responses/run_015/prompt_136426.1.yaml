          *   UK: "Crown" $\neq$ Monarch personally. "Crown" = State legal personality. PM exercises Crown power, but isn't the Crown.
          *   Japan: Emperor = Symbol, not Head of State (technically). Sovereignty lies with people. Be careful with "identity."
          *   Normative Mode: This is the strongest part. Connect to John Searle (Status Functions) to bolster the argument against the "legal fiction" critique.
          *   Bagehot: Good link, but ensure it supports the Fregean point (modes of presentation of power).

  6.  **Refining the Constitutional Details (Self-Correction during drafting):**
      *   *UK:* Is "The Crown is the Head of State" an identity statement? "The Crown" refers to the institution. "Head of State" is a role. It's more $a$ is $F$. A better Fregean puzzle might be: "The Monarch is the Crown" (False/Category mistake) vs "The Monarch embodies the Crown."
      *   *Actually, the best puzzle:* "The Government is the Crown" (in some contexts) vs. "The Government is the Cabinet."
      *   *Wait, let's stick to the user's intuition:* The user wants to say "The Crown acted" = "The Ministers acted." This is an identity of *agency*, not ontology. This is where the "Normative Mode" saves it. The *reference* (the action taken) is the same, but the *sense* (the authority source) differs.
      *   *Japan:* Article 1 says "symbol." It does *not* say "Head of State." Many scholars argue the Emperor *is* the head of state ceremonially, but the Constitution is vague. This vagueness actually helps the Fregean puzzle (different senses of "Head of State").

  7.  **Final Polish:** Ensure I answer the three specific questions clearly.
      1.  Frege representation? (Mostly yes, but watch the reference).
