  2. However, exaptation emphasizes how reason repurposes these instincts, suggesting current moral judgments rely on reflective equilibrium rather than raw impulse. This shifts the justification from causal history to present-day rational coherence, weakening the debunking threat.

  3. The debunker argues that exaptation cannot bridge the gap between selfish tribal instincts and objective universal values without begging the question. The exaptation defender counters that rational scrutiny filters out biased instincts, allowing only universally justifiable principles to remain.

  4. EDAs focus on the reliability of the belief-forming mechanism regarding moral truth, which exaptation admits was not the original selective pressure. Yet, if the repurposed mechanism reliably tracks independent moral truths now, the evolutionary origin becomes irrelevant to current justification.

  5. Ultimately, exaptation strengthens the debunking argument if one believes causal history dictates justification, but weakens it if one accepts that rational revision can overcome biological biases. The debate hinges on whether reason is merely a tool of evolution or an independent tribunal capable of correcting evolutionary errors.
