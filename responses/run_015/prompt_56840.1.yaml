answer: |-
  Here is a principle derived from your reactions, followed by its application to your task.

  ### The Principle of Costed Resonance

  A written life makes the reader better only when it satisfies three concurrent conditions:

  1.  **The Accessibility Clause:** The subject's moral struggles must be humanly imaginable, neither so perfect as to be inhuman nor so mundane as to be invisible.
  2.  **The Integrity Clause:** The narrative voice must not appear to be managing the reader's judgment of the subject.
  3.  **The Friction Clause:** Virtue must be shown to have a cost, or vice must be shown to have a consequence.

  **How the clauses map to your cases:**

  *   **The Missionary (Failed Accessibility):** He was "too perfect." Because he never lost his temper, his virtue looked innate rather than achieved. You couldn't imagine yourself in his shoes, so you couldn't climb the mountain.
  *   **The Surgeon (Passed Friction & Integrity):** He saved lives (virtue) but was cruel (cost). The text didn't ask you to like him; it let you judge the trade-off. The friction between his skill and his cruelty created a hook for your own behavior (snapping at kids).
  *   **The Selfish Memoir (Failed Integrity):** The honesty felt like a "pose." The author was trying to manage your judgment by preemptively confessing, which feels like manipulation. You resisted the lesson because you resisted the salesman.
  *   **The Daughter's Bio (Failed Integrity):** You "resented" the airbrushing. Even if factually true, the *tone* was managing your judgment, demanding admiration rather than earning it.
  *   **The Saint's Life (Passed Integrity & Friction):** You expected to dismiss it, but the genre signaled that this was a *model*, not a history. It bypassed your historical judgment. The "perfect patience" was presented as a discipline to be witnessed, not a fact to be verified.
  *   **The Ordinary Person (Failed Friction):** You were bored. "Just showing up" is hard, but the account didn't show the *cost* of showing up. Without the visible struggle, the virtue looked like inertia.

  ### The Verdict the Principle Must Overturn

  The principle overturns your verdict on **The Ordinary Decent Person**.

  You wrote: *"I couldn't finish it. Bored me. Which embarrasses me, because that's exactly the person I'd most like to be."*

  The principle argues that your boredom was not a failure of the *life*, but a failure of the *writing*. An ordinary life is only boring if the text fails to render the **Friction**. If the writer had shown the temptation to quit, the quiet resentment, or the sheer exhaustion of "just showing up" for fifty years, it would have satisfied the Friction Clause. You didn't need more drama; you needed more *cost*. The principle predicts that an ordinary life, written with an eye toward the struggle of maintenance rather than the fact of existence, is the most morally useful of all.

  ### Predictions for Unlisted Cases

  **1. Can a knowingly flattering life beat a truthful one?**
  **Yes,** but only if the flattery functions as **Iconography** (like the Saint). If the reader understands the text is offering an *ideal* to aim at, rather than a *history* to believe, the Integrity Clause is satisfied by the genre contract. A truthful life that feels like a hit-job (managing judgment toward condemnation) will be less useful than a flattering life that functions as a clear moral target.

  **2. Can a bad life be instructive without being admirable?**
  **Yes,** via the **Surgeon Mechanism**. A life can be useful if it clearly maps the *consequences* of the badness. However, if the text glamorizes the vice (making it look cost-free), it fails the Friction Clause and becomes dangerous. It must show the price paid by the subject or those around them.

  **3. What happens when the reader is related to the subject?**
  **The Integrity Clause becomes exponentially harder to satisfy.** Family members know the "airbrushing" is happening because they remember the fights. A stranger can accept a hagiography; a son or grandson cannot. If the writer (you) is family, the reader (the family) will scan the text for "managed judgment." If they sense you are hiding the hard stuff to protect feelings, they will resent the booklet (like the Daughter's Bio). If they sense you are exposing wounds to vent, they will reject it as performative (like the Memoir).

  ### Application to Your Grandad

  **Should you leave out the fifteen years?**

  **No.** Leaving it out makes the account less useful, and arguably fails the genre's purpose.

  Here is why, based on the Principle:

  1.  **The Integrity Trap:** Your family knows about the estrangement. If you omit it, you trigger the **Daughter's Bio** reaction. The readers (your dad, your aunt, cousins) will feel the text is "airbrushed." They will read the praise as false because it ignores the known elephant in the room. This breaks trust.
  2.  **The Friction Opportunity:** A "good man" who was never difficult is a Missionary (boring/impossible). A "good man" who was difficult, estranged his son, and *still found a way back* is a human being. The virtue isn't in being nice; the virtue is in the **reconciliation**. That is the *Costed Virtue*. It shows that being good sometimes means swallowing pride, or waiting, or making the first move after fifteen years of silence.
  3.  **The Plutarchian Angle:** You mentioned Plutarch's focus on "small unguarded moments." The estrangement isn't the story; the *mending* is. You don't need to detail the fights. You need to detail the moment the phone rang, or the first coffee, or the silence that was finally comfortable.

  **The Recommendation:**
  Write the reconciliation, not the rift.

  Do not write: *"He and my dad didn't speak for fifteen years because they were both stubborn."* (This is gossip/judgment).
  Do write: *"For fifteen years, silence sat between them. It took a phone call in November to break it, and a quiet lunch in December to heal it. He taught us that love is not the absence of conflict, but the will to return."*

  This satisfies **Accessibility** (families fight), **Integrity** (you aren't hiding the truth), and **Friction** (the virtue of returning cost him pride and time).

  If you leave it out, you give them a statue. If you put it in, you give them a grandfather. Statues are admired; grandfathers are read.
