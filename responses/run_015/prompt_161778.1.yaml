      *   *Objection 7 (Low-Medium):* Policy implication. What do you actually *do*?
      *   *Objection 8 (The "Secret Fear"):* The "Essentialism Trap." If you say gender is the *most available* identity, aren't you reifying gender?

  5.  **Refining the Replies (Matching Vocabulary):**
      *   *Economist:* Use "externalities," "adaptive preferences," "social welfare function."
      *   *Sociologists:* Use "confounds," "fixed effects," "operationalization."
      *   *Evo Psych:* Use "phenotypic plasticity," "environment of evolutionary adaptedness."
      *   *Feminists:* Use "structural injustice," "non-ideal theory," "hegemonic meanings."
