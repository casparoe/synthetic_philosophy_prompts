answer: |-
  **Scenario**
  You are a grantmaker choosing between two malaria prevention programs, each costing $100,000.
  **Intervention M (Measurable):** Operates in a stable region with independent monitors. Impact follows a narrow distribution: 950–1,050 lives saved (Mean: 1,000).
  **Intervention H (Hard-to-Measure):** Operates in a conflict zone with no external verification. Impact follows a wide distribution: 500–1,500 lives saved (Mean: 1,000).
  Both share the same mechanism (bed nets), cost, domain, and true expected impact. The only difference is verifiability.

  **Walkthrough**
  **Framework A (Standard EA):** Calculates expected value but applies a "confidence discount" to unverified claims to account for potential fraud or error. Because H lacks RCT verification, A applies a 50% penalty to its estimate.
  *   Score M: 1,000 lives.
  *   Score H: 1,000 × 0.5 = 500 lives.
  *   **Verdict:** A ranks M higher.

  **Framework B (Measurability-Aware):** Preserves the full probability distribution. It applies a decision rule sensitive to the right tail (e.g., maximizing the 90th percentile outcome) to capture potential breakthrough efficacy in complex environments.
  *   Score M (90th %): 1,050 lives.
  *   Score H (90th %): 1,500 lives.
  *   **Verdict:** B ranks H higher.

  **Structural Feature:** The divergence stems from A's **confidence-discounting collapse**. A treats the *absence of evidence* (wide variance) as *evidence of absence* (lower mean). B treats variance as variance. If A removed the confidence discount and used raw EV, the verdict would tie (1,000 vs. 1,000). The bias is not the risk preference, but the epistemic penalty A assigns specifically to unmeasured interventions.

  **Strongest Attack for A**
  A defender argues that measurability is *proxy evidence* for implementation quality. Interventions allowing RCTs usually possess stronger logistics and oversight. Therefore, the wide variance in H isn't just epistemic uncertainty; it signals higher risk of failure or fraud. The "discount" isn't a bias; it's a Bayesian update based on the correlation between verifiability and effectiveness. By ignoring this, B rewards mystery with funding, potentially incentivizing opaque organizations over transparent ones, thereby reducing long-term accountability and actual impact.
