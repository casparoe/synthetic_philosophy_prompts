      *(Mental check on "Continuous Prose")*: I must avoid using headers or bullet points. Paragraph breaks are okay, but the text must flow as an essay.

      *(Mental check on "No Citations")*: Do not mention Lewis, Sider, Haslanger, etc. Just "the perdurantist," "the endurantist."

