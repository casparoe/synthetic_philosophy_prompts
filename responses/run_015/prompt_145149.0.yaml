answer: |-
  **Order**
  1. **Flail (10m):** Let them derive strings. This generates the frustration required for Step 2. Without failure, the meta-shift feels unearned.
  2. **Interrupt (5m):** Stop the work. Ask: "Are you solving the puzzle or studying the puzzle?" This distinction depends on their fatigue from Step 1.
  3. **Analogy (10m):** Introduce the carrying example. This provides the conceptual tool for Step 4.
  4. **Application (10m):** Return to `AX`. Ask what property persists. This relies on the intuition built in Step 3.
  5. **Close (5m):** Generalize to real life. Depends on successful resolution of Step 4.
  If you skip Step 1, Step 2 is just advice, not insight. If you skip Step 3, Step 4 is impossible for novices. The sequence builds the cognitive ladder rung by rung. Step 5 cements the utility. You cannot rush Step 1; the struggle is the raw material for the entire session. Step 3 must be concrete before Step 4 becomes abstract. Step 2 is the pivot. If they don't stop writing, they can't start thinking. Step 4 requires group consensus; if one person dominates, the learning fails. Step 5 validates the effort. Ensure Step 1 ends exactly when energy peaks, not when it dies. Step 3 must be solved quickly to build confidence before Step 4's difficulty. Step 5 connects back to Step 1's frustration to show it was necessary.

  **The carrying example**
  Imagine a chessboard with two opposite corners removed. Can you cover it with dominoes? Each domino covers one black and one white square. The removed corners are the same color, leaving an imbalance. No arrangement works. You don't check placements; you count colors. The board's color parity is the invariant, just as our string has a hidden numerical property that never matches the goal. It must be visual, familiar, and impossible for the same structural reason. This bypasses trial and error.

  **Misconception map**
  1. "Search harder/Computer could do it" [Step 2]: Kill by noting infinity vs. finite time. Explain exponential growth makes search impossible even for machines. The tree grows faster than any computer can check.
  2. "Letters mean words" [Step 1]: Kill immediately; insist they are shapes. Meaning distracts from structure.
  3. "Unfair rules" [Step 5]: Reframe as "features of reality," not bugs. Compare to gravity. You cannot wish physics away.
  4. "Needs advanced math" [Step 4]: Kill by showing it's just counting odds/evens. Anyone can count; no degree required.
  5. "Goal is the string" [Step 2]: Shift goal to "proof of impossibility." Success is knowing why, not getting AAA.
  6. "I missed a path" [Step 4]: Kill by showing the property holds for *all* paths simultaneously. Use the analogy to show global constraints block every route. No shortcut exists.
  7. "I'm not a logic person" [Step 3]: Kill by emphasizing pattern spotting over calculation. Reassure them it is visual. Trust intuition. This fear blocks engagement.

  **The check**
  Change Rule 3 to "remove XX." Ask: "Does the impossibility proof still hold?" Right answer: "No, because removing two X's changes the count modulo 3, so the invariant breaks." Wrong answer: "Yes, because I still can't find AAA quickly." This tests if they understand *why* it was impossible, not just that it was hard. It forces them to touch the mechanism of the proof rather than the result. If they say proof survives, they missed the invariant.

  **What I leave out**
  Do not use the word "modulo." Do not explain Gödel or Turing. Do not discuss formal system consistency. Skip the arithmetic proof. Say: "We are skipping the formal math to focus on the thinking move." Avoid jargon like "isomorphism" or "recursive." Keep it grounded in counting and properties. Stay concrete.

  **Tell my co-host**
  Tell them: "Do not mention invariants early. If you hint at 'look for what stays same' in minute two, you steal the struggle. The frustration *is* the lesson. Let them hit the wall before you hand them the ladder. Your silence protects their discovery. Trust the process."
