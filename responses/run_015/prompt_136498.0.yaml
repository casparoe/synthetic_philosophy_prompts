          *   *Philosophical nuance:* Intention isn't just "I want result X." It's about the plan structure. In Fat Man, the plan is "Push Man -> Man Stops Trolley." In Crane, the plan is "Drop Beam -> Beam Stops Trolley + (unfortunately) Man dies."
