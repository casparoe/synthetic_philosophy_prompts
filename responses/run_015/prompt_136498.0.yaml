      *   **Analysis of (7):** Causal structure has moral weight (inviolability of persons).
      *   **Cost:** DDE becomes more complex; requires objective assessment of action plans, not just subjective sincerity.
      *   **Conclusion:** The distinction between *using* a person and *harming* a person remains robust.

  8.  **Self-Correction/Nuance Check:**
      *   *Objection:* Isn't the Crane case just a "longer lever" Fat Man case?
      *   *Response:* No. In Fat Man, the trolley hits the man. In Crane, the machine hits the man, and the machine hits the trolley. The man is not the interface between the threat and the victims.
