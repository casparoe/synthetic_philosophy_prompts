      *   *Imre Lakatos:* Research Programmes. Hard core vs. protective belt. This is *very* close. The narrative structure is the "hard core," the specific facts/omissions are the "protective belt." You adjust the belt to protect the core.
      *   *W.B. Gallie:* Essentially Contested Concepts. Not quite.
