  4.  **Developing the Argument:**

      *   **Concept 1: The Lakatosian Fit.** The user's description of the "hard core" (the story/argument) vs. the "protective belt" (the specific facts/omissions) is the strongest philosophical match. In Lakatos's "Methodology of Scientific Research Programmes," a theory isn't abandoned because of anomalies. Instead, auxiliary hypotheses are added to absorb the anomalies. In history, the "narrative arc" is the hard core. Adding the missing decade is an auxiliary hypothesis ("Yes, X happened, but it didn't change the outcome because...").
      *   **Concept 2: Narrative Employment (White/Ricoeur).** The user mentions White. White says the *choice* of emplotment (tragedy, comedy, romance, satire) determines the story. The "absorption" is the result of the emplotment being decided *before* the facts are fully marshaled. The facts serve the plot.
      *   **Concept 3: Causal Weighting / Salience.** The user mentions one book gives a famine 4 pages, another a semicolon. This is about *causal significance*, not just inclusion. This is "Causal Selection" (Hart & Honoré, or more recently L.C.B. Gower).
