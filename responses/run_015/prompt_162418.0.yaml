answer: |-
  This is an exceptionally sharp observation. You have identified a structural feature of historical writing that is often gestured at but rarely named with precision. You are right to reject "selection" (which is pre-entry) and "underdetermination" (which implies a standoff between theory and evidence, rather than the digestion of evidence by theory).

  You are describing two distinct but related phenomena. The first is the **determination of narrative shape** (where the story starts, ends, and what carries the causal weight). The second is the **resilience of that shape against factual accretion** (the absorption property).

  Here is the breakdown of the concepts that map onto this, where they fall short, and what a genuine "reshaping" would actually look like.

  ### 1. The Absorption Property: The Lakatosian "Protective Belt"

  The closest established philosophical model for the "absorption property" you describe is not from historiography, but from the philosophy of science: **Imre Lakatos's Methodology of Scientific Research Programmes.**

  Lakatos argued that scientific theories are not falsified by single counter-experiments. Instead, a theory consists of a **"hard core"** (the fundamental assumptions) surrounded by a **"protective belt"** of auxiliary hypotheses. When an anomaly arises (a missing decade, a contradictory faction), the scientist does not abandon the hard core. They adjust the protective belt. They add a caveat, a new variable, or a footnote that explains why the anomaly doesn't actually break the core theory.

  *   **How it maps:** In your history books, the "hard core" is the narrative argument (e.g., "The regime fell due to structural economic decay"). The "protective belt" is the specific factual assemblage. When a reviewer says, "You ignored the 1975 grain crisis," the author adds the grain crisis to the second edition (adjusting the belt) but argues that the crisis was a *symptom* of the decay, not a cause (preserving the core).
  *   **Why it fits:** It explains why the book feels *more* solid after the addition. The protective belt has been thickened to defend the core. The author hasn't admitted error; they have demonstrated robustness.
  *   **Where it falls short:** Lakatos was describing rational reconstruction of science. In history, this process is often less conscious. Historians don't usually think, "I must protect my hard core." They think, "This new fact fits into my existing understanding." The "absorption" feels like discovery to the author, not defense.

  **Proposed Term:** **Narrative Resilience** or **Explanatory Inertia**.
  There is no single standard noun for this in history departments, which is why you can't Google it. It is often dismissed pejoratively as "teleology" or "confirmation bias," but those are psychological accusations, not structural descriptions. You are describing a structural feature of explanation: **The capacity of a causal model to treat new variables as endogenous rather than exogenous.**

  ### 2. The Shape and Space: Emplotment and Narrative Sentences

  The "space-allocation thing" (start/end points, famine vs. bad decisions) is distinct from absorption. This is about how the raw chronicle is converted into a story.

  *   **Hayden White (Emplotment):** You mentioned White is on your reading list. He is the unavoidable reference here. White argues that the "content" of the past is neutral; the "form" is imposed by the historian through *emplotment* (casting the story as Romance, Tragedy, Comedy, or Satire). If one book treats the famine as a tragedy and another as a bureaucratic footnote, they have chosen different modes of emplotment.
  *   **Arthur Danto (Narrative Sentences):** Danto is more useful for your specific point about start/end dates. He coined the term **"narrative sentences."** These are sentences that describe an event by reference to a later event (e.g., "The 1914 assassination *started* the Thirty Years War of the 20th Century"). The event cannot be understood as "starting" anything until the end point is known.
      *   **The Mechanism:** When Book A starts in 1956 and Book B in 1985, they are utilizing different narrative sentences. Book A sees 1956 as the *origin* of the end; Book B sees 1985 as the *unraveling*.
      *   **Why "Selection" isn't enough:** You are correct. Selection implies a filter. Emplotment implies a mold. The facts aren't just filtered; they are assigned *roles*. In one book, the harvest figures are the "protagonist" (structural history); in the other, they are "setting" (political history).

  ### 3. Why "Underdetermination" Doesn't Fit

  You rightly rejected underdetermination. In philosophy of science, underdetermination means the evidence is compatible with multiple theories. But in your scenario, the evidence is compatible with *one* theory that keeps expanding to eat the evidence.

  The phenomenon you are watching is **not** that the facts allow multiple stories (Underdetermination).
  The phenomenon is that the story dictates the *status* of the facts (Constitution).

  When the author adds the missing decade and the story doesn't change, they are demonstrating that the missing decade was never an *independent variable* in their model. It was always a *dependent variable*. By adding it, they are simply filling in the graph of the dependency they already posited.

  ### 4. What Would Force a Reshaping?

  If the absorption property is so strong, what breaks it? If adding facts never changes the story, is history just fiction with footnotes? No. There are three specific conditions under which the "hard core" cracks and the story must be retold, not just expanded.

  **A. Mechanism Failure (The "How" breaks)**
  If the new fact doesn't just add detail but contradicts the *mechanism* of causality.
  *   *Example:* A book argues a regime fell because of peasant famine (structural). New archival evidence shows the peasants were well-fed and the leadership resigned due to a personal betting debt among the politburo (contingent).
  *   *Result:* You cannot absorb this. You cannot say "the betting debt was a symptom of structural famine." The mechanism is broken. The narrative shifts from Structural Tragedy to Political Farce.

  **B. Scale Shift (The "Who" changes)**
  This is the Kuhnian Paradigm Shift in history.
  *   *Example:* For 50 years, books on the French Revolution start in 1789 and end in 1794 (Political). Then, the *Annales* school or Social Historians arrive. They argue the "real" story starts in 1750 (harvest cycles) and ends in 1850 (industrialization).
  *   *Result:* The old facts (Robespierre's speeches) don't disappear, but they are demoted from "causes" to "epiphenomena." The story isn't corrected; it is *displaced*. This is rare. It usually requires a generational change in the profession, not a second edition.

  **C. The "Ad-Hoc" Threshold**
  Returning to Lakatos: A research programme degenerates when the protective belt becomes more complex than the hard core.
  *   *Example:* If the author has to add footnotes to explain away five different omitted decades, five different factions, and three different economic indicators, all to maintain the thesis that "One Bad Decision Caused It," the book becomes unreadable or ridiculous.
  *   *Result:* The narrative collapses under the weight of its own exceptions. A new historian comes along, takes the "exceptions," makes them the core, and writes a new book.

  ### 5. Summary and Vocabulary

  You asked for a name. Since there isn't a single canonical term, here is how you should categorize this in your reading group to cut through the fog:

  1.  **Narrative Resilience (The Absorption Property):** The capacity of a historical argument to treat new factual inputs as endogenous variables that confirm, rather than challenge, the existing causal model. (Rooted in Lakatos's *Protective Belt*).
  2.  **Causal Salience (The Space Allocation):** The decision to assign "protagonist" status to certain facts (famines) and "setting" status to others (decree dates). This is not selection; it is *weighting*. (Rooted in Hart & Honoré's *Causation in the Law* or White's *Emplotment*).
  3.  **The Danto Condition:** The recognition that the start and end dates of a history are not discovered in the past but are determined by the narrative sentence chosen by the historian.

  **The Verdict:**
  You are watching historians engage in **Normal History** (to borrow from Kuhn). They are solving puzzles within a paradigm. The paradigm is the narrative shape. The puzzles are the missing facts. Solving the puzzle (adding the fact) strengthens the paradigm; it does not test it.

  To see a paradigm tested, you don't look for missing facts. You look for **competing narratives that utilize the same facts but assign them different causal salience.** That is where the actual battle is fought, not in the footnotes.

  If you want to propose a term to your group that captures the specific "absorption without change" dynamic, I suggest **"Explanatory Homeostasis."** It captures the system's tendency to return to its stable shape despite the ingestion of new material. It distinguishes the *structure* of the account from the *content* of the account, which is precisely the distinction you've identified.
