  **The view, on its own terms**

  1. You argue the single-storey and double-storey 'a' belong to the same genre despite sharing no geometry. If a child learnt both simultaneously, would they form one concept or two distinct tools for reading?
     *Follow-up:* If you suggest two tools, does that not fracture the unity you claim the genre possesses?

  2. If identity rests on use, could a community theoretically decide that our current 'q' shape now performs the 'a' role?
     *Follow-up:* Should you agree, does that not imply the identity is entirely external to the mark itself?

  3. You describe roles like enclosing space or bearing weight, but surely these functions overlap across different characters. How do you prevent the genres from collapsing into one another?
     *Follow-up:* If you claim recognition prevents this, is recognition doing all the work, then?

  **Where it pinches**

  1. If the genre is so permissive, what stops 'a' and 'e' from merging where their shapes converge? Is letter identity really just relational, defined only by contrast with its neighbours?
     *Follow-up:* If context defines it, can the same mark be an 'a' in one typeface and an 'e' in another?

  2. Readers recognise the looptail 'g' constantly yet mostly cannot write it from memory. Does this put the genre in the eye rather than the hand, or does it undercut your theory?
     *Follow-up:* If it's purely recognition, why does the designer's intent matter at all?

  3. When a badly drawn 'a' ceases to look like an 'a', does it become a different letter or simply nothing? Are you happy to say the category is vague, so some marks are neither determinately 'a' nor anything else?
     *Follow-up:* Does that not make the genre useless for defining the boundaries of type design?

  4. You often say it's a genre, not a shape, but if the genre tolerates any reshaping, does the term simply mask a lack of definition? At what point does calling it a genre stop explaining anything?
     *Follow-up:* If function is all that matters, why do we need letters at all rather than pure symbols?

  **The last question**

  1. If there is no essence to an 'a', what exactly are you designing when you sit down to draw one?
