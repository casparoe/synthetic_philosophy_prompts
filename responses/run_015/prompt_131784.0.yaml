  **The Ghost in the Projection Booth**
  **By Julian V. Harrow**

  *The Cartesian Theater*, currently enjoying a contentious revival at the Phenomenological Playhouse, operates on a bold spatial metaphor: that consciousness is a private auditorium where sensory data converges upon a single screen for inspection by a central spectator. Director René D.'s estate has committed fully to this literalism, resulting in a production that is visually sumptuous but logically bankrupt. The premise is seductive in its simplicity. We are asked to believe that there is a place where it all comes together, a finished show presented to a privileged viewer seated safely behind the eyes.

  The set design is minimalist to a fault. A large projection surface dominates the upstage wall, bathing the house in the glow of unified experience. Center stage sits a plush velvet armchair, occupied by an actor designated simply as "The Self." Throughout the first act, The Self watches the screen with rapt attention, reacting to the *chiaroscuro* of memory and sensation. It is a serene image, provided one does not inquire too closely into the sightlines. The production's central failure is its handling of the viewer. By placing The Self in the armchair, the staging inadvertently invokes the homunculus fallacy. If The Self is watching the screen, who is watching The Self? The director attempts to resolve this by having The Self wear a pair of spectral glasses, implying an inner eye, but this merely pushes the problem back a row. We are left waiting for a smaller actor to emerge from the velvet cushions to watch the first actor watching the screen. It is an infinite regress of ushers, each requiring a ticket for a show they cannot see.

  Matters of temporal coherence are equally mishandled. The script insists on a definitive "now," a precise moment where experience becomes conscious. The lighting cues suggest a sharp temporal boundary, a curtain drop between unconscious processing and conscious awareness. Yet, current understanding suggests the timing is far more diffuse. The play demands a simultaneity that the brain cannot deliver, creating a lag between the stimulus on screen and the reaction in the chair that the actors struggle to mask. The performance insists on a single timeline, a master narrative that flows seamlessly from past to future, ignoring the editorial delays inherent in the transmission of the signal.

  For a more honest, if chaotic, interpretation of mental life, one need only cross the street to the Neural Network Repertory, where *Multiple Drafts* is running in repertory. That production eschews the projection booth entirely. There is no central screen, no front-row seat for the ego, and no master copy of the script. Instead, several unfinished versions of the same scene run in parallel across different corners of the stage, competing for dominance without a central editor. It is messy, often contradictory, and lacks the comforting narrative unity of the Playhouse's offering, but it avoids the structural impossibility of a central observer. There is no one home in the control room of *Multiple Drafts*, only the work itself.

  The most damning evidence of *The Cartesian Theater*'s conceptual fragility appears in the program notes. Patrons are informed that the VIP section includes a "Row Zero," reserved for the Inner Eye, situated directly behind the armchair. However, upon inspection, the seating chart provided at the box office contains no Row Zero. Ushers merely shrug when asked to locate it, suggesting the prime seat exists only as a theoretical construct. This spatial ghosting undermines the entire architecture of the venue. If the most important seat in the house cannot be found on the blueprint, one must question the integrity of the building.

  The evening concludes with a curtain call that demands the audience participate in the solipsism. As the cast bows, house lights rise, and patrons are instructed to bow to themselves, acknowledging their own presence as the true observers. It is a clever trick, but it leaves one wondering who, exactly, is applauding. The show insists there is someone home in the control room, but the lights are off, and the projector is running on a loop.
