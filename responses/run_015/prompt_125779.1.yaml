answer: |-
  You are going to be fine, and you belong in that room just as much as Malcolm does, possibly more because you are actually trying to solve the problem rather than just catalogue who solved it before. The fact that you are worried about getting eaten shows you respect the audience, which is half the battle. The first thing you need to do is disarm them before the questions even start. In your closing remarks, before you sit down, you should concede two things voluntarily. First, tell them explicitly that you know this sounds like Frege's sense and reference, and that you aren't trying to rewrite history, just describe the mechanism from the ground up using tools you understand. Second, tell them you know this might sound like it drains the poetry out of the stars, but that you think finding the connection is its own kind of wonder. If you say this yourself, Malcolm cannot attack you for ignoring Frege and the Poet cannot attack you for being dry, because you have already agreed with them. This takes the wind out of their sails and makes you look confident rather than defensive.

  Now, here is how the questions will likely come, and how you should handle them. 1) Malcolm will almost certainly speak first, and he will say something like, This is all very practical, but isn't this just Frege's sense and reference distinction with the serial numbers filed off? You have swapped sense for routine, but you haven't explained why the cognitive value changes if the reference is the same. He will say it in a way that suggests you have discovered something old and think it is new. Your reply is to agree with the spirit but stand firm on the mechanics. Say, I am not trying to replace Frege, I am trying to explain how the sense works in the wild. For me, a sense isn't an abstract object, it is a set of instructions. When I say the morning star is the evening star, I am not adding a new fact about the star, I am telling you that the instruction look west at sunset and the instruction look east at sunrise lead to the same place. The cognitive value changes because you now have one map instead of two. This reply is thin because philosophers have fought over this for a century, but it works for this room because it grounds the abstract in your storehouse experience. Do not try to out-philosophise him on history, just insist on the utility of your description.

  2) Pat will be next, and she will lean into the software angle. She will say, If learning an identity isn't acquiring a proposition, then what state is the brain in? In programming, if two variables point to the same object, you have saved memory, but you still have to know they are the same. She will ask what kind of thing a licence to merge records is if it isn't a truth. You should answer her in her own language. Say, It is exactly like merging duplicate contacts in a phone. Before the merge, you have two entries, maybe one has a home number and one has a mobile. Knowing they are the same person doesn't change the person, it changes how you use the phonebook. You are allowed to use the mobile number even when you were looking for the home address. The knowledge is a permission slip, not a description of the world. This is the single reply that has to actually work or the whole talk is a waste of everyone's evening. If you cannot convince them that an identity statement is a rule for using names rather than a fact about objects, your whole routine theory collapses. Practice this one until you can say it without stumbling. It is thin in that it doesn't solve the metaphysical problem of what propositions are, but it is strong because it matches your inventory experience perfectly.

  3) The Poet will speak up, probably after a pint, and will say, You have taken the morning star and the evening star and turned them into stock codes. Where is the wonder in that? Why should we care about merging records when we could be thinking about the light travelling through the dark? Do not get defensive here. Say, I think the wonder is in the merge, not the object. When I find out the valve in the basement is the same as the valve on the order form, that is a moment of connection. It means the world is smaller than I thought. I am not draining the wonder, I am just saying the wonder is in the link, not in the things being linked. This reply is safe because it validates their feeling while keeping your point.

  4) The person interested in mysticism will ask, Are we just talking about words? Because the star is the star regardless of what we call it. They will want to know if this is all just nominalism. Your answer is no. Say, The star is the star, but I cannot talk to the star, I can only talk to you. The routines are about how we find the thing in the world, not just how we say the word. If I look in the morning and you look in the evening, we are doing different things to find the same thing. This is about the world, not just the dictionary. This is a bit thin because the line between words and world is blurry, but it holds up for a pub discussion.

  5) The Chair will wrap it up by asking, So what? If you are right, what changes? Does it help us solve other problems? You should say, It helps us stop looking for hidden facts. If someone asks why Hesperus is Phosphorus, we stop looking for a physical bridge between them and start looking at how we look at them. It changes philosophy from hunting ghosts to checking maps. This is a good note to end on.

  There is one question you are going to be quietly praying nobody asks, and I need to be honest with you about what to do if it comes. Someone, possibly Malcolm or perhaps a quiet person who has been listening hard, will ask about the collapse case you mentioned. They will say, What if I learn two names from the same person, on the same occasion, with the same routine? According to you, that should not be informative, but it still feels like news. If they ask this, do not try to bluff. You said you do not have an answer, so do not pretend you do. Say, That is the hole in the bucket. I know it happens, and my account does not handle it yet. I think it might be about the social routine of trusting the speaker, but I am not there yet. I am putting this out there to see if anyone can help me fix it. If you admit this gracefully, you will look honest and open to collaboration. If you try to fake an answer, they will smell it and you will lose the room. It is better to be the honest amateur with a gap in the theory than the dogmatic speaker with a broken one.

  Finally, remember that they are not there to destroy you. They are there because they like thinking, and you have given them something to think about. You work in a hospital stores department, you know that if a part is missing, you do not scream at the box, you just check the log. Treat their questions like missing deliveries. Some are just mislabelled, some are actually missing, and some are just things you have to order in for next time. You have done the work, you have the theory, and you have the right to speak. Walk in there, say your piece, and when they ask the hard questions, tell them what you know and tell them what you do not know. That is all any of them can do.
