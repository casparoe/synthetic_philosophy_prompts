  I haul her body from the deep.
  For every muscle's burning sake,
  Before the water starts to sweep.

  It is permitted because she is mine,
  So I am licensed now to proceed.
  I cross the abstract moral line,
  To serve this stark conceptual need.
  The rule asserts its cold decree,
  And love becomes just what it must be.
