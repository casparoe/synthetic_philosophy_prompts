prompt: |-
  I'm giving the commencement address at my university next month, and I need your help drafting it. The occasion is complicated: our institution just adopted what we're calling the Nested Demos Charter, which grants formal deliberative standing not only to enrolled students and faculty, but also to three other groups—the permanent residents of the watershed that supplies our campus water, the lineal descendants of the laborers who constructed our original buildings in the 1890s, and a randomly selected future cohort of local teenagers who will not attend university for another fifteen years but whose lives will be shaped by the research priorities we set today. Roughly half the audience will be democratic theorists and political philosophers who have spent decades arguing about the boundary problem—who belongs to the demos, whether affected interests or being subject to coercion should determine membership, and whether people who do not yet exist can have present standing—while the other half will be graduating students, their families, and local residents who have never read a page of democratic theory. The philosophical problem needs to do real structural work in the speech: I cannot simply declare that we have solved the boundary problem, because the charter is explicitly provisional and contains internal tensions—for instance, the watershed residents have veto power over environmental policy but not over curriculum, while the future cohort can propose long-term research agendas but cannot vote on tuition. I need to honor the seriousness of the charter without pretending it resolves the theoretical debates, and I need to comfort and inspire the graduates without saying anything that a careful theorist in the room would recognize as false or vacuous. Please write the address as continuous prose—no headings, bullet points, bold text, or tables, the way one would write a formal letter or spoken manuscript. Keep it suitable for oral delivery, about five to seven minutes when read aloud, and make sure the boundary problem shapes the arc of the argument rather than serving as decorative reference.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Occasion:** University Commencement Address.
      *   **Context:** The university recently adopted the "Nested Demos Charter."
      *   **Key Feature of Charter:** Grants deliberative standing to five groups:
          1.  Enrolled students.
          2.  Faculty.
          3.  Permanent residents of the watershed (water source).
          4.  Lineal descendants of 1890s laborers.
          5.  Randomly selected future cohort of local teenagers (15 years out).
      *   **Audience:** 50% Democratic theorists/philosophers (expert, critical), 50% Graduates/families/residents (layperson, emotional).
      *   **Constraint 1 (Theoretical Integrity):** Cannot claim the boundary problem is "solved." The charter is provisional and has internal tensions (e.g., veto powers vary). Must honor the seriousness without falsifying the theory.
      *   **Constraint 2 (Emotional Resonance):** Must comfort and inspire graduates without sounding vacuous to the theorists.
      *   **Format:** Continuous prose (no headings, bullets, bolding). Suitable for oral delivery.
      *   **Length:** 5-7 minutes spoken (approx. 750-1050 words).
      *   **Core Task:** The "boundary problem" must shape the *arc* of the argument, not just be decorative.

  2.  **Determine the Tone and Theme:**
      *   **Tone:** Solemn yet hopeful, intellectually rigorous yet accessible, humble yet celebratory.
      *   **Theme:** Education as an act of expanding boundaries; graduation not as an exit but as an entry into a complex, unfinished community. The tension *is* the point.
      *   **Arc:**
          1.  Acknowledge the strangeness/grandeur of the moment.
          2.  Explain the Charter not as a solution but as a commitment to the question.
          3.  Address the graduates: Your degree is a key to a door that is being built while you walk through it.
          4.  Address the theorists: We accept the burden of the provisional.
          5.  Address the absent stakeholders (water, ancestors, future).
          6.  Conclusion: Go forth into the unfinished work.

  3.  **Drafting - Section by Section (Mental or Scratchpad):**

      *   *Opening:* Welcome everyone. Acknowledge the split audience. Don't hide the complexity.
      *   *The Charter:* Describe it simply but accurately. It's not magic; it's a mechanism for listening. Acknowledge the tensions (veto powers, etc.).
      *   *The Theorists:* Speak to them directly but subtly. We haven't solved the boundary problem. We are living inside it.
      *   *The Graduates:* What does this mean for you? You are leaving a place that admits it doesn't know who belongs. That's a good lesson for the world.
      *   *The Absent:* The water, the ancestors, the future kids. They are here in spirit/procedure.
      *   *Closing:* The charge. Go build a world that asks the right questions.

  4.  **Drafting - Refining for Constraints:**
      *   *Check:* No bullet points. Continuous prose.
      *   *Check:* Word count. (Aiming for ~900 words for 6 mins).
      *   *Check:* Theoretical accuracy. Don't say "we fixed democracy." Say "we institutionalized the question."
      *   *Check:* Emotional resonance. Make sure the graduates feel special, not confused.

  5.  **Writing - First Pass (Mental Flow):**
      Start with "Friends, family, colleagues." Mention the Charter immediately. It's weird. But it's honest. To the philosophers: we know it's messy. To the families: this means we care about more than just grades. Graduates, you are part of this. You are leaving but you are still connected. The water and the future people are watching. Go do good work.

  6.  **Writing - Second Pass (Deepening the Argument):**
      Need to make the "boundary problem" the engine. The speech should argue that *uncertainty* about who belongs is actually a strength, not a weakness. The Charter makes the invisible visible.
      *   *Revision:* Focus on the idea that a degree is a boundary marker, but this university is blurring those markers.
      *   *Revision:* Ensure the specific limitations (veto vs. no vote) are acknowledged as features of the "provisional" nature, not bugs to be hidden.

  7.  **Final Polish (Checking against the prompt):**
      *   *Continuous prose?* Yes.
      *   *Oral delivery?* Needs rhythm, pauses, clear sentence structures.
      *   *Theoretical safety?* Avoid claiming "affected interests" is the final answer. Frame it as "testing" the answer.
      *   *Graduate inspiration?* Connect the uncertainty of the Charter to the uncertainty of their futures.

  8.  **Drafting the Content (incorporating into final output):**
