answer: |-
  Friends, families, faculty, graduates, and members of our broader community, we gather today at a peculiar intersection of time and territory. To look out at this audience is to see the visible face of this university: the students who have studied here, the families who supported them, and the scholars who guided them. But under the new Nested Demos Charter, this audience is also populated by those who cannot sit in these chairs. We are joined in spirit and in structure by the permanent residents of the watershed that feeds our taps, whose veto power over our environmental policy reminds us that biology precedes bureaucracy. We are joined by the lineal descendants of the laborers who laid our bricks in the eighteen nineties, whose standing acknowledges that the foundation of this institution rests on hands that were rarely allowed to hold a diploma. And we are joined by a randomly selected cohort of teenagers who will come of age fifteen years from now, granted the right to propose research agendas today because the climate we alter and the technologies we build will outlive us all.

  I know that for many of you, this language sounds strange. To the graduates and your families, you might wonder why a celebration of your achievement is framed by the rights of people who are not here, or who are not yet born. To the political philosophers and theorists in our midst, you might wonder if I am about to claim that we have finally solved the boundary problem, that we have definitively answered the question of who constitutes the demos. I will not make that claim, because it would be false, and because this Charter does not pretend to be a final solution. It is a provisional architecture for living with a question that refuses to go away. The Charter admits its own tensions. It grants veto power over the water but not the curriculum; it grants voice over the future but not over tuition. It is messy. It is complicated. It is, in the truest sense of the word, a political experiment.

  We have adopted this structure not because we have found the answer, but because we believe the university is the one place capable of holding the question without breaking. For decades, democratic theory has wrestled with whether membership belongs to those coerced by power, those affected by outcomes, or those bound by law. Here, we have chosen to stop choosing. We have decided that a university worthy of the name must institutionalize the friction between these principles. We acknowledge that the water does not vote, but the people who drink it do, and the people who will drink it later must have a say in whether we poison it. We acknowledge that the past is dead, but its consequences are alive in the inequality we still navigate. We acknowledge that the future is unwritten, but it is being written by the grants we sign today.

  To the graduating class, this might seem like a heavy burden to carry on your day of joy. You want to be told that you have crossed a finish line, that you have secured your place in the world. But the lesson of the Nested Demos is that there are no finish lines, only shifting boundaries. You are leaving an institution that has formally admitted it does not know exactly where it ends and where the world begins. This is not a weakness; it is your greatest preparation. The world you are entering is defined by crises that ignore our borders. Carbon emissions do not stop at the edge of a campus, or a nation, or a generation. Economic shocks do not respect the distinction between worker and shareholder. If you have learned anything here, let it be that the hard work of democracy is not merely counting votes, but constantly asking whose voices are missing from the count.

  I speak to the theorists in the audience as well. You know better than anyone that legitimacy is often a mask for power. Do not look to this Charter for purity. Look to it for honesty. We are not claiming to have reconciled the all-affected principle with the all-subjected principle. We are claiming that the friction between them generates the heat necessary for ethical action. We are building a machine that forces us to listen to the silent, whether their silence is due to distance, death, or time. If this experiment fails, let it fail because we tried to listen to too many voices, not because we were too afraid to ask who deserves to speak.

  So, graduates, as you take your diplomas, understand what you are holding. It is not a ticket to exit this community. It is a key to a door that is being built even as you walk through it. You are entering a profession, a neighborhood, a family, a life. Wherever you go, you will encounter boundaries. You will decide who belongs to your projects, who shares in your profits, and who bears the cost of your risks. When you make those decisions, remember the watershed. Remember the bricklayers. Remember the teenagers who are fifteen years away from having the power to stop you. Do not wait for a Charter to force you to consider them. Make the uncertainty of their standing a part of your own internal deliberation.

  We send you forth not into a finished world, but into an unfinished one. We do not promise you that democracy is secure, or that justice is inevitable. We promise only that the question of who belongs is the only question that matters, and that asking it is the work of a lifetime. Go now, and build boundaries that are porous enough to let the future in. Go now, and vote as if the water could speak. Go now, and live as if the past is watching. Congratulations.
