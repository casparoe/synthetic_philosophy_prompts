  9.  **Final Review against Word Count and Timing:**
      Reading speed is approx. 130-150 words per minute. 6 minutes = ~800-900 words. I will aim for that range.

      *(Self-Correction on Tone)*: Ensure I don't sound *too* academic. The families need to feel included. Use metaphors of water, building, and time.

      *(Self-Correction on Theory)*: Make sure to explicitly state we haven't solved the boundary problem. That's a hard constraint.

