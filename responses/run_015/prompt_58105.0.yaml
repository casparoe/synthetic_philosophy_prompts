prompt: |-
  I am a high school junior preparing a debate on algorithmic fairness for my computer science and ethics class. Suppose our district uses an algorithm to select students for a limited-seat advanced science program, and students from two feeder schools have different base rates of meeting the qualification standard. I am calling an algorithm fully fair only if it meets three conditions I defined for the debate: it admits the same proportion of qualified students from each school, it rejects the same proportion of unqualified students from each school, and among students given the same score, the actual qualification rate is the same for both schools. What is your credence that any non-perfect algorithm can meet all three conditions at once in this situation? Please decompose your credence into rough probabilities for the key mathematical, conceptual, and practical sub-questions, show how they combine, state which sub-question matters most, and say what argument would move your number most. Please answer in no more than 250 words.
