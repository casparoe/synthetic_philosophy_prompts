answer: |-
  This is an excellent translation task. You are right to suspect that the debate maps cleanly onto decision theory (DT), but also that the mapping is lossy. The philosophical debate often hides axiomatic choices that DT forces into the open, while DT inevitably strips away the phenomenological and metaphysical texture that gives the philosophical positions their intuitive grip.

  Here is the restatement of the positions in decision-theoretic vocabulary, followed by an analysis of what breaks in translation.

  ### 1. The Formalization

  Let $H$ be a possible history of the world. Let $A$ be the agent in question. Let $t$ be time.
  Let $L(A, H)$ be the lifespan of agent $A$ in history $H$, defined as a closed interval $[t_{start}, t_{end}]$.
  Let $u(t)$ be the instantaneous utility flow at time $t$.

  The total utility of a history for agent $A$ is generally modeled as an integral over the lifespan:
  $$ U_A(H) = \int_{t_{start}}^{t_{end}} D(t) \cdot u(t) \, dt $$
  Where $D(t)$ is a discount function (which we can set to 1 for now to isolate the structural disagreement).

  #### The Epicurean Position: The Experience Requirement
  In DT terms, the Epicurean argument is a constraint on the **domain of the utility function** and the **subject of evaluation**.

  *   **Domain Restriction:** $u(t)$ is defined *only* over conscious experiences. If there is no subject at $t$, $u(t)$ is undefined, not zero.
  *   **The Harm Condition:** A history $H_1$ is worse for $A$ than $H_2$ only if $U_A(H_1) < U_A(H_2)$.
  *   **The Move:** Death is the transition to a state where $A$ does not exist. Therefore, there is no time $t > t_{death}$ where $u(t)$ accrues to $A$.
  *   **Formal Claim:** You cannot compare $U_A(H_{death})$ vs $U_A(H_{life})$ by integrating past $t_{death}$ because the integrand does not exist. The utility function is effectively truncated.
  *   **Badness Location:** There is no negative term in the utility function for death itself. The "fear" of death is a cognitive error where the agent assigns $u(t) < 0$ to states of non-existence, violating the definition of $u$.

  **In short:** The Epicurean treats utility as **Experienced Utility** (Kahneman's *experienced* well-being). If it isn't felt, it isn't in the sum.

  #### The Deprivation Account (Nagel): Counterfactual Comparativism
  The Deprivation Account is a claim about **Global Preference Satisfaction** over **Possible Histories**.

  *   **Domain:** $U_A$ is defined over complete life-histories, not just momentary experiences.
  *   **The Baseline:** The value of a life is determined by comparing the actual history $H_{actual}$ (where death occurs at $t_{death}$) against a relevant counterfactual history $H_{counterfactual}$ (where death occurs at $t_{natural}$).
  *   **Formal Claim:** The badness of death $B$ is the difference in expected utility between the two histories:
      $$ B = U_A(H_{counterfactual}) - U_A(H_{actual}) = \int_{t_{death}}^{t_{natural}} u(t) \, dt $$
  *   **Badness Location:** The badness is not a local property of the state "being dead." It is a relational property of the *truncation* of the utility integral. It exists in the comparison of world-states, not in the phenomenology of the agent.

  **In short:** Nagel treats utility as **Decision Utility** (global preference satisfaction). The agent has a preference for "continuing to exist," and death violates that preference, regardless of whether the violation is experienced.

  ### 2. Where the Disagreement Locates

  You asked if the disagreement is about the domain of the utility function. **Yes, precisely.**

  1.  **Epicurean:** The utility function is **indexical and present-tense**. $U$ is a function of *my current and future experiences*. If "I" cease to exist, the function returns `NULL`, not `0`. You cannot maximize a function that doesn't exist.
  2.  **Deprivation:** The utility function is **atemporal and third-person**. $U$ is a function of *the life of A*. It can be evaluated by an observer (or the pre-mortem agent) looking at the whole shape of the curve. The "agent" is treated as a four-dimensional worm; cutting the worm short reduces its total volume, even if the end of the worm doesn't "feel" the cut.

  This maps directly to the **Experienced Utility vs. Decision Utility** distinction in behavioral economics. Epicurus argues that only Experienced Utility counts for welfare. Nagel argues that Decision Utility (the satisfaction of the preference to live) counts for welfare.

  ### 3. What Doesn't Survive the Translation

  This is the critical part. When you formalize this, several philosophical moves evaporate or distort.

  #### A. The "Subject of Harm" Problem (Metaphysics vs. Math)
  **The Loss:** Decision theory assumes a coherent agent $A$ whose utility is being maximized. The philosophical debate is often about *whether there is a subject* to be harmed.
  *   **Epicurean:** "Who is harmed? The dead man doesn't exist. The living man isn't dead." This is a metaphysical claim about identity over time.
  *   **DT Translation:** DT glosses over this by assuming $A$ is the same entity at $t_1$ and $t_2$.
  *   **The Distortion:** DT forces you to pick an optimizer. If you say "The pre-mortem self optimizes for the post-mortem self," you've already conceded to Nagel. If you say "Only the current self optimizes," you've conceded to Epicurus.
  *   **Verdict:** DT doesn't solve the metaphysics; it hides it in the definition of the agent. The philosophical move that gets lost is the **Parfitian reduction of identity**. If personal identity is just psychological continuity, the "Subject of Harm" becomes a matter of degree. DT usually treats the agent as binary (exists/doesn't exist), losing the nuance that death might harm the *future stages* that never come to be, even if there's no single "self" to hold the harm.

  #### B. The Time of Harm (Temporal Location)
  **The Loss:** A major part of the Epicurean argument is: "If death is bad, *when* is it bad?" (Not before, not after).
  *   **DT Translation:** In Expected Utility Theory, harm is located at the **decision node** or calculated at the **evaluation node**. The "time" of the harm is irrelevant; only the discounted sum matters.
  *   **The Distortion:** DT is consequentialist and aggregative. It doesn't care *when* the utility loss happens, only *that* it happens. The Epicurean intuition that harm requires a *time* at which the subject suffers is a deontological or phenomenological constraint that DT sums away.
  *   **Verdict:** This is a limitation of DT. DT cannot capture the intuition that "harm must be anchored to a conscious moment." It treats harm as a ledger entry, not an event.

  #### C. The Symmetry Argument (Indexicality)
  **The Loss:** Lucretius's symmetry argument (prenatal non-existence is like post-mortem non-existence) relies on **self-locating beliefs**.
  *   **DT Translation:** Standard DT struggles with self-locating uncertainty (the "Sleeping Beauty" problem). To model symmetry, you need a utility function over *possible birth/death dates*.
  *   **The Distortion:** If you model this, the Deprivation account usually wins because we have forward-looking preferences but rarely backward-looking regrets about conception dates. DT reveals that the asymmetry isn't metaphysical; it's **preference-based**. We prefer future goods to past goods.
  *   **Verdict:** The translation shows the Symmetry Argument is weaker than it looks. It relies on the assumption that time is symmetric regarding preference satisfaction, which is empirically false for humans (we discount positively, not negatively). DT exposes this as a preference axiom, not a metaphysical truth.

  #### D. The Phenomenology of "Tragedy"
  **The Loss:** Nagel's argument relies on the intuition that it is a *tragedy* for a life to be cut short.
  *   **DT Translation:** Tragedy = Lower Sum.
  *   **The Distortion:** A life of 40 years with high utility might sum higher than a life of 80 years with low utility. DT would say the 40-year life is *better*. Nagel would likely say the 80-year life is less tragic even if the average utility is lower, because the *narrative completion* matters.
  *   **Verdict:** DT misses **Narrative Utility**. Humans value the *shape* of a life (completeness, arcs), not just the integral. The Deprivation account leans on this narrative intuition, which standard additive utility functions do not capture.

  ### 4. Diagnosis: Coherence vs. Reduction

  You asked whether the things that drop out are important phenomenology DT misses, or incoherent philosophy DT clarifies.

  **1. Where DT clarifies incoherence:**
  The Epicurean "No Subject" argument often relies on equivocation. DT forces you to specify whose utility function is being maximized.
  *   If it's the *post-mortem* subject, Epicurus wins (function is undefined).
  *   If it's the *pre-mortem* subject, Nagel wins (function is truncated).
  DT reveals that the debate is not about the nature of death, but about **which temporal slice of the agent has veto power over the utility function.** The philosophical fog often hides this axiomatic choice. DT shows that the Epicurean is essentially asserting: *"Only current experienced utility counts."* That is a valid axiom, but it's an axiom, not a derivation.

  **2. Where DT misses important phenomenology:**
  DT is inherently **consequentialist** and **aggregative**. It cannot easily model **rights** or **metaphysical violations** that don't reduce utility.
  *   Some Deprivation arguments suggest death is a *wrong* done to the person, not just a reduction in their good.
  *   DT reduces "wrong" to "sub-optimal outcome."
  *   If the intuition is "I have a right to my future," DT translates this to "I have a strong preference for my future." But a preference can be outweighed by other preferences; a right is often trumps. DT struggles to model trumps without lexico-graphic preferences (which are brittle).

  **Conclusion:**
  The translation is high-fidelity regarding the **structure of the valuation**, but low-fidelity regarding the **metaphysics of the valuer**.

  *   **The Epicurean** is making a claim about the **ontology of value** (Value requires a valuer). DT respects this if you define $U$ over experiences.
  *   **The Deprivationist** is making a claim about the **modal status of value** (Value exists in possible worlds relative to actual ones). DT respects this via Expected Utility.

  The "loss" is that DT treats both as compatible modeling choices (just pick your domain!), whereas the philosophers treat them as contradictory truths about reality. DT reveals that **neither position is derivable from rationality alone.** They are competing priors on what counts as a "good."

  If you want to settle the bet with your friend: The Epicurean is arguing for **Experienced Utility Maximization**. The Deprivationist is arguing for **Global Preference Satisfaction**. Decision theory cannot tell you which one is "true," only that they are different objective functions. The "badness" of death is a bug in the Epicurean code (it returns NULL) and a feature in the Nagel code (it returns $\Delta$). Which code you run depends on whether you think you are a **conscious moment** or a **life story**. DT can't answer that; it just compiles whatever you give it.
