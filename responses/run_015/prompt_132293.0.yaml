answer: |-
  ### The Regress Problem Restated

  In epistemology, the regress problem asks how a belief is justified. If belief A is justified by belief B, and B by C, does the chain stop, loop, or go on forever? In your vocabulary, this is a question about the structure of dependency graphs in a type system where "justification" is "type checking" or "normalization."

  **Foundationalism** maps to **Inductive Types with Strict Termination Checking**.
  Every derivation tree must hit a **base case** (axiom/primitive type) in finite steps. **Circular dependencies in type checking** are rejected as errors. A program (belief system) is only valid if you can provide a **termination proof** for every justification chain. If the reducer doesn't reach a normal form (basic belief), the term is ill-typed.

  **Coherentism** maps to **Coinductive Type Definitions with Guarded Corecursion**.
  **Base cases** are not required. **Circular dependencies in type checking** are permitted, provided they are productive (guarded). The validity of a type depends on the global consistency of the system rather than bottoming out at a primitive. You don't prove termination; you prove productivity. The "loop" is valid as long as it produces observable structure at each step, mirroring the coherentist web of mutually supporting beliefs.

  **Infinitism** maps to **General Recursion accepting Non-Terminating Reduction**.
  This position accepts **loops that never bottom out** as valid justification chains. Unlike coinduction, there is no requirement for productivity or guards. The chain of reasons is an infinite reduction sequence. In PL theory, this usually corresponds to divergence (⊥), but Infinitism claims this infinite descent constitutes validity rather than failure. It is a system where type checking may never complete, yet the term is considered well-formed.

  ---

  ### Residue Report

  #### 1. Clean Translations
  *   **Foundationalism ↔ Induction:** This is a near-isomorphism. The demand for a **base case** in foundationalism is exactly the demand for a base constructor in an inductive type. The rejection of circularity matches the strict positivity checks in most foundational type theories.
  *   **Coherentism ↔ Coinduction:** The allowance of **circular dependencies in type checking** maps cleanly to coinductive definitions. The coherentist requirement that beliefs "hang together" translates well to the guardedness condition in corecursion (you must produce a constructor before recursing), ensuring the infinite structure is well-defined rather than arbitrary.

  #### 2. Distortions Required
  *   **Infinitism ↔ Divergence:** This requires the most distortion. In PL theory, **loops that never bottom out** without guards are typically classified as errors (non-termination) or unsound proofs (logic inconsistency). Infinitism asserts these infinite chains *are* the justification. To make this fit, you have to treat "divergence" not as a failure of computation, but as a valid mode of existence (like a server process). However, epistemological Infinitism claims the chain *justifies*, whereas in PL, an unguarded infinite loop usually *fails to compute a value*.
  *   **The Nature of the "Base":** In Foundationalism, a **base case** is often "self-evident" or "incorrigible." In PL, a base case is just a primitive without elimination rules. The normative force (why this base case is trusted) is stripped away in the PL mapping. PL treats the base case as syntactic; Foundationalism treats it as semantic/epistemic.

  #### 3. Leftovers (The Gap)
  There is residue that has no counterpart in PL theory: **The Normativity of Justification.**

  *   **PL Theory:** Asks "Is this term well-formed?" and "Does this reduce?" It is descriptive of formal systems.
  *   **Epistemology:** Asks "Ought I to hold this belief?" It is normative.

  When a Foundationalist says a belief is "basic," they imply it carries intrinsic warrant. When a PL researcher defines a primitive type, it carries no warrant other than consistency. When a Coherentist says beliefs "support" each other, they imply a transfer of truth-value. In coinduction, the "support" is merely structural productivity.

  **Is this a gap in your framework or philosophical sloppiness?**
  It is not sloppiness, but it is a category error to expect a perfect map. PL theory models *structure* and *computation*. Epistemology models *warrant* and *truth*.

  The leftover is the **semantic content** of the nodes in the graph. PL theory is happy to let you define an inductive type that never corresponds to reality, or a coinductive stream that produces garbage, as long as it is well-typed. The regress problem is concerned with whether the chain actually connects to *truth*, not just whether the dependency graph is well-formed.

  Your framework captures the *syntax* of justification (the shape of the dependency graph) perfectly. It cannot capture the *semantics* of justification (why the graph connects to reality). If you treat "justification" purely as "derivation," the map holds. If you treat "justification" as "warranted assertibility," the PL framework lacks the primitives to express the normative force of the **base cases** or the validity of the **loops that never bottom out**.
