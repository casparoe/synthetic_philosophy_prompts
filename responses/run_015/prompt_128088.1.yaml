answer: |-
  **Joint Statement on the Architecture of Social Equilibria**

  **From:** The Strict Lewisian Camp & The Evolutionary-Norm Camp
  **Re:** Where we shake hands, where we draw lines, and the mystery of the grey-listeners.

  Look, we fought hard about this. We yelled about priors, we threw whiteboards at each other over the definition of "arbitrary," and we almost came to blows over whether a handshake counts as common knowledge. But we're tired, and the world keeps coordinating without us. So, before we go back to our respective corners to polish our models, here is the text we can both sign. We agree on the skeleton; we disagree on the blood.

  ### I. Claims We Both Accept

  1.  **Coordination is the Engine:** Conventions exist primarily to solve recurrent coordination problems where individual interests align only if actions match (e.g., driving on the same side of the road, resource sharing protocols).
  2.  **Contingency of Content:** The specific content of a convention is arbitrary in principle; there is no intrinsic reason why *Signal A* works better than *Signal B*, provided everyone does the same one.
  3.  **Expectation Dependence:** A convention holds only insofar as agents expect others to follow it and prefer to follow it conditional on that expectation.
  4.  **Selection Mechanisms:** Something must break the symmetry to select one equilibrium over another. Whether you call it "salience" (Lewis) or "selection pressure/history" (Evo), we agree that initial conditions and external cues determine which arbitrary equilibrium locks in.
  5.  **Stability is Dynamic:** Once established, conventions resist change not because they are morally right, but because deviating is costly given the behavior of the rest of the population.

  ***

  ### II. Disagreements Table & Crux Stress-Tests

  Here is where the truce ends. We have phrased these positions so that each side can read their own row without flinching. We also applied the **"Grey-Listener Stress Test"** to each crux: a scenario where a network contains 50% "shadow" nodes (grey-listeners) that can observe only 40% of interactions, yet a resource-sharing convention appears to lock in across the whole population.

  | The Crux | Lewisian Conventionalist Formulation | Evolutionary-Norm Formulation | Grey-Listener Stress Test Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Epistemic Bar**<br>*(Is Common Knowledge necessary?)* | **Common Knowledge is Constitutive.**<br>A convention is not a convention unless it is common knowledge that everyone is following it. Without the infinite recursion of "I know that you know," the coordination is merely accidental, not normative. | **Common Knowledge is Emergent.**<br>High-order knowledge is a luxury, not a requirement. If the behavioral regularity is stable and enforced by sanctions or reinforcement, it *is* a convention, even if agents are epistemically blind to the whole picture. | **Lewisian:** The convention is **fragile/illusory**. Since grey-listeners cannot verify the 40% blind spots, true Common Knowledge cannot form. Under stress, the shadow nodes will defect, causing collapse.<br><br>**Evo:** The convention **survives**. The 40% visibility is enough for reinforcement learning to lock in the behavior. The grey-listeners will mimic the visible majority, sustaining the equilibrium despite the epistemic blackout. |
  | **2. The Location of Power**<br>*(Are asymmetries internal or noise?)* | **Power is External Noise.**<br>Power asymmetries are exogenous constraints that distort the coordination game. They explain *why* a specific equilibrium was chosen, but they are not part of the convention's definition itself. | **Power is Internal Grammar.**<br>Power asymmetries are constitutive of the norm. You cannot separate the rule from the enforcement hierarchy. The convention *is* the power structure stabilized over time. | **Lewisian:** The resource sharing is **corrupted**. If the grey-listeners are systematically disadvantaged by the visibility gap, that's an external interference. The "pure" convention would fail; what we see is coercion masquerading as coordination.<br><br>**Evo:** The resource sharing is **authentic**. The visibility gap *creates* the hierarchy that stabilizes the sharing. The convention survives precisely *because* the grey-listeners are structurally pressured to comply with the visible 60%. |

  **Signatories:**
  *The Strict Lewisian Camp (We still think you're lowering the bar too much)*
  *The Evolutionary-Norm Camp (We still think you're modeling angels, not humans)*
