answer: |-
  This is a remarkably precise observation of a structural dynamic that sits at the intersection of welfare economics, political economy, and institutional design. You have correctly identified that while the constituent parts of this phenomenon are discussed in various literatures, the specific *causal chain* you describe—where the *mechanism of Pareto justification* itself becomes the source of institutional rigidity—is often treated as a background condition rather than a distinct failure mode.

  To answer your primary question: **No, there is no single, universally standardized term that captures this exact engineered dynamic.** However, it is the synthetic overlap of three well-established concepts. Recognizing these neighbors allows us to carve out the specific boundaries of the phenomenon you are describing.

  ### 1. The Nearest Conceptual Neighbors

  Your description maps onto three distinct bodies of literature, each capturing a different vector of the problem.

  **A. The Transitional Gains Trap (Gordon Tullock, 1975)**
  This is the strongest economic analogue. Tullock argued that when a government privilege (e.g., a tariff, a license, a subsidy) is introduced, the initial beneficiaries enjoy a one-time capital gain. However, this gain is quickly capitalized into the value of the asset (e.g., the price of a taxi medallion rises to reflect the monopoly profit). Subsequent owners buy in at the higher price and earn only normal returns.
  *   **The Match:** If the privilege is removed, the current owners suffer a capital loss, even though they never enjoyed "excess" profits. Thus, the policy becomes politically impossible to repeal, not because it is efficient, but because the *compensation* has been baked into asset values.
  *   **The Distinction:** Tullock focuses on *rent capitalization* in markets. Your observation is broader: it applies to non-market institutional fixtures (monitoring bodies, exaction requirements, legacy guarantees) where the "gain" is not necessarily a capitalized asset price but a protected *status* or *revenue stream* that cannot be revoked without violating the Pareto condition.

  **B. Policy Feedback Loops (Paul Pierson, Suzanne Mettler)**
  In political science, Pierson's work on *Politics in Time* describes how policies, once enacted, reshape the political landscape. Policies distribute resources (resource effects) and send signals about citizenship and entitlement (interpretive effects), creating constituencies that defend the policy.
  *   **The Match:** This captures the "crystallization" you describe. The safeguards create a constituency that views the safeguard not as a transitional bribe, but as an acquired right.
  *   **The Distinction:** Policy feedback is often treated as an emergent, somewhat accidental property of large welfare states. Your observation identifies this as a *deliberate design feature* of specific reforms intended to secure initial passage. It is **engineered feedback** rather than emergent feedback.

  **C. Veto Player Theory (George Tsebelis)**
  Tsebelis argues that policy stability is a function of the number of "veto players" (actors whose agreement is necessary to change policy).
  *   **The Match:** Your "safeguards" effectively create new veto players. By granting a group a guaranteed entitlement or opt-out to secure a Pareto improvement, you grant them veto power over any future reform that touches that entitlement.
  *   **The Distinction:** Veto player theory is static; it explains why change is hard given a configuration. It does not explain the *dynamic process* by which a reform *creates* its own veto players as a condition of its existence.

  ### 2. Conceptual Carving: "The Pareto Entrenchment Problem"

  Since the literature lacks a specific label for the *deliberate engineering* of this trap via Pareto safeguards, I propose carving this out as **Pareto Entrenchment** (or alternatively, **The Compensation Ratchet**).

  Here is the precise boundary definition to distinguish it from its neighbors:

  **Definition:**
  Pareto Entrenchment occurs when a reform is conditioned on transitional compensation mechanisms (grandfathering, exactions, guarantees) that are structurally designed to be permanent or indefinite. These mechanisms convert *potential* losers into *actual* stakeholders with veto power over future iterations of the reform, thereby locking the system into a local welfare optimum that is superior to the *original* status quo but inferior to *potential* future states.

  **Boundary Conditions & Distinctions:**

  | Concept | Distinction from Pareto Entrenchment |
  | :--- | :--- |
  | **Status Quo Bias** | Status quo bias is psychological or procedural resistance to *any* change from the current state. Pareto Entrenchment involves a *successful* change that creates a *new* rigid state. The resistance is not to moving from $A \to B$, but from $B \to C$. |
  | **Path Dependence** | Path dependence usually relies on increasing returns or network effects (e.g., QWERTY). Pareto Entrenchment relies on *political entitlement*. The lock-in is not technical or economic efficiency, but the moral/political impossibility of revoking a promised safeguard. |
  | **Second-Best Theory** | Lipsey & Lancaster's Theory of the Second Best is a static condition (if one optimality condition fails, others should not be met). Pareto Entrenchment is a *dynamic* process where meeting the optimality condition (Pareto safety) at $T_1$ prevents meeting superior conditions at $T_2$. |
  | **Rent-Seeking** | Rent-seeking is the *expenditure of resources to capture wealth transfers*. Pareto Entrenchment is the *institutionalization of the transfer mechanism itself*. The stakeholders are not necessarily seeking new rents; they are defending the structural apparatus that guarantees the initial compensation. |
  | **Transitional Costs** | Transitional costs are temporary frictions (e.g., retraining workers). In Pareto Entrenchment, the "cost" (the safeguard) is permanent. The "transition" never ends; it becomes the new baseline. |

  ### 3. The Structural Mechanism (A Physicist's Analogy)

  Given your background, you might view this as a **local minima problem induced by barrier modification**.

  1.  **State A (Status Quo):** High energy, unstable.
  2.  **Transition to State B (Reform):** To overcome the activation energy barrier (political resistance), you lower the barrier by adding a "potential well" (the compensation/safeguard).
  3.  **State B (Protected Equilibrium):** The system settles into State B. However, the "potential well" you dug to get there has become part of the landscape topology.
  4.  **Transition to State C (Optimal Reform):** To move to the globally optimal State C, you must fill in or modify that well. But the particles (stakeholders) currently resting in that well perceive this modification as an energy loss (harm).
  5.  **Result:** The system is trapped in State B. It is lower energy than A, but higher than C. The *method of descent* from A prevented the descent to C.

  ### 4. Why This Is Distinct in Philosophy of Economics

  The philosophical significance of Pareto Entrenchment lies in the tension between **ex-ante legitimacy** and **ex-post adaptability**.

  *   **Ex-Ante:** The reform is morally robust. It satisfies the Pareto principle (no one harmed) and often aligns with contractualist views (reasonable rejection). It solves the problem of *transition*.
  *   **Ex-Post:** The reform creates a "moral hazard of safety." By guaranteeing safety so absolutely, it removes the system's ability to absorb future shocks or improvements. It privileges the *consent of the affected at $T_0$* over the *welfare of the affected at $T_n$*.

  This is not the **Non-Identity Problem** (Parfit), because the individuals are the same. It is closer to a **Intergenerational Equity** problem, but compressed into a single generation's timeline. It is a **Time-Inconsistency of Institutional Design**: the rules that made the reform *possible* make the reform *optimal* only for a single moment in time.

  ### 5. Conclusion

  You are describing a phenomenon that is **acknowledged in fragments but unnamed as a unified dynamic.**

  *   In **Public Choice**, it is the *Transitional Gains Trap*.
  *   In **Political Science**, it is *Positive Policy Feedback*.
  *   In **Institutional Economics**, it is *Veto Player Proliferation*.

  If you wish to name this for your work, **"Pareto Entrenchment"** is the most precise label. It signals that the *Pareto criterion itself*, when operationalized through permanent safeguards, is the vector for the entrenchment.

  **The Edge Case:**
  The boundary lies at **Sunset Provisions**. If the safeguards are explicitly temporary (sunset clauses), it is merely a transitional cost. If the safeguards are permanent or renewable-by-default, it is Pareto Entrenchment. The critical variable is not the existence of compensation, but the **revocability of the compensation mechanism.**

  This is a fertile area for institutional design. The challenge is designing "Pareto-improving" reforms that utilize *temporary* compensation without creating *permanent* entitlements—a mechanism design problem that essentially asks: *How do we buy consent without buying veto rights?*
