answer: |-
  There's a classic move in moral philosophy that basically stops utilitarianism in its tracks. It's the objection from the seperateness of persons. John Rawls hammered this home ages ago. The gist is that utilitarianism treats society like it's one big super-person. It assumes that sacrificing one guy's happiness for the sake of ten others is fine, just like you might endure a headache now to avoid a migraine later. But you aren't ten other people. You are you, and they are them. Utilitarianism turns individuals into mere vessels for agregate utility, smoothing over the fact that there are actual distinct lives at stake.

  But here's where things get interesting. What if the boundaries between us aren't as solid as Rawls assumed? I'm calling this idea "boundary drift." Think about it. We aren't isolated islands. We catch each other's moods. We feel collective grief at a funeral or collective hype at a concert. Through deep empathy and shared intentiality, our emotional skins get porous. We literally feel part of a whole.

  So, the twist is this: if boundary drift is real, does the seperateness of persons objection still hold water? On the surface, it looks like drift actually helps the utilitarian. If we are already emotionally blended, maybe maximizing the agregate utility isn't such a violation after all. Maybe we are already kind of one big mind, so the math checks out. If my happiness bleeds into yours, sacrificing a bit of mine for yours isn't a loss, it's a redistribution within a single system.

  But I'm going to take the hard line here: boundary drift doesn't weaken the objection. It actually makes the danger worse, which means we need stricter boundary conditions, not looser ones.

  Here's why. Boundary drift is real, but it's messy and uneven. Just because I *can* feel your pain doesn't mean I *will*, and it definitely doesn't mean we share power equally. Utilitarianism relies on a clean calculus, but drift is muddy. When boundaries are porous, it becomes way too easy for the loud voices to claim they represent the "collective feeling." A utilitarian manager might say, "We're all in this together, so you need to take a pay cut for the good of the team." Because of drift, you might actually feel guilty saying no. You feel the collective intentiality pressing on you. The porosity becomes a tool for coercion.

  If we accept drift as a justification for utilitarianism, we aren't validating connection; we're validating dissolution. We're saying that because we *can* empathize, we *should* be sacrificed. That turns empathy into a vulnerability. It means the person with the strongest capacity to feel the group's desire gets overridden by the group's average desire. The seperateness of persons is the only shield we have against being swallowed by the agregate.

  This is where a nod to Nozick feels appropriate. He was big on entitlement theory and the idea that individuals have rights that function as side constraints. You can't just violate them even for a good outcome. In a world with boundary drift, Nozick's strict boundaries look less like selfish walls and more like levees. Without them, the floodwaters of "the greater good" wash away individual integrity. If we are already porous, we need ethical structures that respect the hard stop of the individual body and mind.

  So, does drift mean we need to rethink Rawls? Yes, but not by ditching the seperateness objection. We need to rethink it by realizing that psychological connection doesn't equal moral merging. Just because I feel your pain doesn't mean I own your life.

  Defending the stricter boundary condition is the only way to keep drift from becoming exploitative. If we say drift weakens the objection, we open the door to a soft totalitarianism where you're pressured to dissolve yourself for the vibe of the group. We need to insist that even if our emotions drift, our rights remain fixed. The utilitarian calculus fails because it doesn't care where the utility lands, only how much there is. But if boundaries are drifting, where it lands matters more than ever. We need to protect the individual from being cannibalized by the collective feeling.

  In the end, boundary drift shows us that we are connected, sure. But it also shows us how easily that connection can be weaponized. The seperateness of persons isn't a factual error about how much we empathize; it's a moral requirement about how we treat each other. We need stricter boundaries precisely because we are so vulnerable to each other. Don't let the agregate eat the individual just because the walls are a little thin. Keep the walls strong, even if the windows are open.
