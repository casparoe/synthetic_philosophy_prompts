answer: |-
  This is a sophisticated and subtle problem that touches on the boundaries between behavioral norms, structural rules, and evolutionary stability. You are describing a strategy that adheres to the *local* norm of cooperation (move-level) while violating the *global* norm of reciprocity (interaction-level).

  To answer your primary question directly: **There is no single, canonical term in the standard game-theoretic taxonomy that precisely captures this specific "cooperative exit" strategy.** It falls into a gap between the **Optional Prisoner's Dilemma (OPD)**, **Dynamic Network/Partner Choice models**, and **Trust Game** literature.

  However, the phenomenon is recognized in scattered contexts. Below is a breakdown of how to classify, delimit, and name this phenomenon for your doctoral work, drawing from evolutionary biology, game theory, and the philosophy of cooperation.

  ### 1. Taxonomic Placement: Where does it fit?

  Your strategy is distinct because it exploits the *duration* of the interaction rather than the *content* of the moves.

  *   **Optional Prisoner's Dilemma (OPD):** In the standard OPD (Orbell & Dawes, 1993), players can choose "Exit" (or "Loners") to avoid the Sucker's payoff ($S$). Usually, Exit is a defensive mechanism against Defectors. Your strategy inverts this: Exit is an *offensive* mechanism against Cooperators.
  *   **Dynamic Networks / Partner Choice:** In models where agents can break links (e.g., Pacheco et al., 2006; Santos et al., 2006), "link dissolution" is usually a punishment for defection. Your strategy uses link dissolution as a *harvesting* mechanism. It resembles **"Partner Switching"** but without the usual justification of seeking better partners; it is switching to reset the exploitation clock.
  *   **The "Walk Away" Heuristic:** In evolutionary robotics and behavioral ecology (e.g., Aktipis, 2004), "Walk Away" strategies cooperate and leave if the *partner* defects. Your strategy is a **"Predatory Walk Away"**: cooperate and leave if the *partner* cooperates (once trust is established but before the "big payout" or before risk accumulates).

  ### 2. Conceptual Delimitation

  To argue this is a distinct failure mode of cooperation, you must distinguish it from its nearest neighbors.

  #### A. vs. The Endgame Effect
  *   **Endgame Effect:** Arises from *exogenous* knowledge of a finite horizon (backward induction). Rational agents defect at $T$, so they defect at $T-1$, etc.
  *   **Your Strategy:** The horizon is *endogenous* and *manufactured*. The partner believes the interaction is indefinite (or at least longer than $N$). The termination is not a result of common knowledge of finitude, but a private trigger.
  *   **Distinction:** The Endgame Effect destroys the *possibility* of cooperation; your strategy parasitizes the *existence* of cooperation to extract surplus before vanishing.

  #### B. vs. Ordinary Defection
  *   **Ordinary Defection:** Violates the behavioral norm within the round ($C \to D$). It is detectable immediately and triggers retaliation (e.g., Tit-for-Tat).
  *   **Your Strategy:** Violates the *relational* norm between rounds. It is undetectable until the interaction terminates.
  *   **Distinction:** Defection is a **move-level betrayal**. Your strategy is a **structural betrayal**. In philosophical terms, it violates *reliance* without violating *prediction*. The partner predicted $C$ and got $C$; they relied on continuity, which was violated.

  #### C. vs. Truncation Strategies
  *   **Standard Truncation:** Often modeled as an exogenous probability of continuation ($\delta$).
  *   **Your Strategy:** The truncation is conditional on the *partner's virtue*. It specifically targets high-quality partners (consistent cooperators) to extract value, rather than cutting losses against bad partners.
  *   **Distinction:** This is **Adverse Selection via Exit**. It creates a dynamic where the "best" partners are abandoned precisely when they become most valuable, destabilizing the population's average trust.

  ### 3. Philosophical Characterization: "Procedural Defection"

  For a philosophy of biology dissertation, you can frame this as a distinct category of exploitation. I suggest the term **"Procedural Defection"** or **"Meta-Defection."**

  *   **Object-Level vs. Meta-Level:** Standard defection is object-level (violation of the move rule). Your strategy is meta-level (violation of the interaction rule).
  *   **The Norm of Continuity:** Cooperation in iterated games relies on an implicit norm of *continuity* (the Shadow of the Future). The strategy honors the norm of *Reciprocity* (I give if you give) but violates the norm of *Continuity* (I stay if you give).
  *   **Trust vs. Trustworthiness:** The strategy appears *trustworthy* (it always cooperates) but is not *trusting* (it refuses to remain vulnerable in the long term). It exploits the partner's trust without extending trust in return.

  ### 4. Evolutionary Boundary Conditions

  For this to constitute a genuinely distinct failure mode (and not just a subclass of strategic truncation), three boundary conditions must be met in your model:

  1.  **Profitability of Exit:** In a standard fixed-partner IPD with linear payoffs ($R > 0$), exiting early is strictly dominated by continuing (since $R_{future} > 0$). For your strategy to invade, the simulation must include either:
      *   **Partner Switching:** The exiter can find a *new* AllC partner immediately, effectively "harvesting" the initial cooperation rounds of multiple victims (Serial Cooperation).
      *   **Non-Linear Payoffs:** A Trust/Investment structure where the exiter captures the principal before the compound interest is paid out.
      *   **Interaction Costs:** A cost to maintaining the link that outweighs future $R$ after round $N$.
      *   *Note:* If your simulation does not have one of these, the strategy is evolutionarily unstable. If it *does*, it is a distinct ecological niche.

  2.  **Unpunishability:** The partner must lack a mechanism to sanction *exit*. If partners can "blacklist" exiters, the strategy fails. The invasion of AllC works because AllC treats Exit as exogenous noise rather than strategic betrayal.

  3.  **Information Asymmetry:** The exit condition must be opaque. If the partner knows the exit rule, they will defect in round $N-1$. The strategy relies on the partner believing the interaction is open-ended.

  ### 5. Suggested Terminology for Your Thesis

  Since no standard term exists, you have the opportunity to coin a precise descriptor. I recommend:

  *   **"Exploitative Opt-Out"**: Clear, descriptive, links to OPD literature.
  *   **"Serial Reciprocity"**: Highlights the cycling through partners.
  *   **"Conditional Withdrawal"**: Neutral, descriptive.
  *   **"Structural Free-Riding"**: Emphasizes that the free-riding occurs on the structure of the interaction, not the moves.

  **Recommendation:** I suggest using **"Exploitative Opt-Out"** as the primary term, while defining it as a form of **"Meta-Defection."**

  ### 6. Key References to Engage

  To ground this in the literature, you should contrast your finding with:

  *   **Orbell, J., & Dawes, R. (1993).** "A 'cognitive miser' theory of cooperators' advantage." *American Political Science Review*. (Foundational for Optional PD).
  *   **Aktipis, C. A. (2004).** "Know when to walk away: Contingent movement and the evolution of cooperation." *Journal of Theoretical Biology*. (The "Walk Away" literature).
  *   **Noë, R., & Hammerstein, P. (1995).** "Biological markets." *Trends in Ecology & Evolution*. (Partner choice dynamics).
  *   **Skyrms, B. (2004).** *The Stag Hunt and the Evolution of Social Contract*. (Discussion of correlation and interaction structure).
  *   **Holton, R. (1994).** "Deciding to trust, coming to believe." *Australasian Journal of Philosophy*. (Philosophical distinction between prediction and reliance).

  ### Summary for your Argument

  You are identifying a **"Second-Order Free Rider."** First-order free riders defect within the game ($D$ against $C$). Second-order free riders cooperate within the game but defect on the *institution* of the game (the iterated nature itself). They extract the benefits of the "Shadow of the Future" without submitting to its constraints. This is distinct from the Endgame Effect because it is endogenous and targeted; it is distinct from Defection because it leaves no behavioral trace of betrayal within the rounds played. It is a **structural parasite** on cooperative networks.

  If your simulation includes partner switching, this is effectively a **"Cooperative Sniping"** strategy. If it involves fixed partners with non-linear payoffs, it is a **"Premature Termination"** exploit. In either case, it warrants distinction from standard truncation because the *trigger* is the partner's virtue, making it an adversarial selection pressure against high-trust phenotypes.
