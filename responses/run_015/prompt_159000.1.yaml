answer: |-
  **FINAL EXAMINATION: FORMAL SYSTEMS, INCOMPLETENESS, AND MECHANISM**
  **Time Allowed:** 50 Minutes
  **Total Marks:** 30

  **Question 1 (30 marks)**

  Consider the **MIU-System**.
  **Alphabet:** {M, I, U}
  **Axiom:** MI
  **Rules of Inference:**
  (i) $x\text{I} \vdash x\text{IU}$
  (ii) $Mx \vdash Mxx$
  (iii) $x\text{III}y \vdash x\text{U}y$
  (iv) $x\text{UU}y \vdash xy$

  **(a)** Prove that the string **MU** is not derivable in the MIU-System. Your proof must proceed by induction on the length of the derivation, explicitly verifying the invariant for all four rules. In your analysis of Rule (ii), explicitly state the arithmetical property of 2 modulo 3 that preserves the invariant. Finally, explain why this proof is necessary: why does the failure to derive MU after a billion steps not constitute a proof of underivability? **[10 marks]**

  **(b)** Read the following student response ("Dana's Answer") and critique it. Identify and correct at least four distinct conceptual errors regarding formal systems, Gödel's Incompleteness Theorems (GIT), and mechanism.
  > *Dana's Answer:* "MIU is a formal system, so Gödel's incompleteness theorem applies to it, and like every formal system there are things true in it that it can't prove. MU is one of them — it's a perfectly well-formed string the system can never derive. The way to see this is to stop playing the game and jump out of the system: once you're outside, you reason about the rules instead of following them, and you can prove the number of I's never becomes a multiple of 3. That's the real moral: mathematical insight can't be mechanized, because a machine is stuck following rules inside the system the way we are, so no machine could have solved this." **[14 marks]**

  **(c)** Suppose we modify the MIU-System by replacing Rule (ii) with **Rule (ii*)**: $Mx \vdash Mxxx$ (tripling instead of doubling). All other rules and the axiom remain unchanged.
  (i) What becomes of the mod-3 invariant argument?
  (ii) Is the underivability of MU a fact about the string "MU" or about the system?
  (iii) If no handy invariant presents itself in a formal system, what would be required to rigorously establish that a string is non-derivable? **[6 marks]**

  ***

  **MODEL ANSWER**

  **(a)** Let $N(s)$ be the number of I's in string $s$. We claim $\forall s$ derivable from MI, $N(s) \not\equiv 0 \pmod 3$.
  *Base Case:* Axiom MI has $N(\text{MI}) = 1$. $1 \not\equiv 0 \pmod 3$.
  *Inductive Step:* Assume $s$ is derivable and $N(s) \not\equiv 0 \pmod 3$.
  (i) $x\text{I} \to x\text{IU}$: Adds 0 I's. $N(s') = N(s)$. Invariant holds.
  (ii) $Mx \to Mxx$: Doubles I's. $N(s') = 2N(s)$. Since $3 \nmid N(s)$ and 3 is prime, $3 \nmid 2N(s)$. Crucially, multiplication by 2 is invertible modulo 3 ($2 \times 2 \equiv 1$); it does not map non-zero residues to zero.
  (iii) $x\text{III}y \to x\text{U}y$: Removes 3 I's. $N(s') = N(s) - 3 \equiv N(s) \pmod 3$. Invariant holds.
  (iv) $x\text{UU}y \to xy$: Removes 0 I's. Invariant holds.
  Since MU has $N(\text{MU}) = 0 \equiv 0 \pmod 3$, it is unreachable.
  *Search vs. Proof:* The derivation tree is infinite. Failure to find MU in finite steps is consistent with its existence at step $n+1$. Only a property holding for *all* derivable strings (the invariant) proves underivability globally.

  **(b)** Dana's answer contains four critical errors.
  1.  **Scope of GIT:** Gödel's theorems apply to systems capable of representing primitive recursive arithmetic (containing negation and sufficient complexity). MIU is a simple string-rewriting system without arithmetic or negation; it is too weak for GIT to apply. It may be complete or decidable.
  2.  **Truth vs. Derivability:** Dana calls MU "true." MIU is uninterpreted syntax; it has no semantics. Strings are either derivable or not. "Truth" applies to propositions in a model, not raw strings in a calculus.
  3.  **Mechanizability of Meta-Proof:** Dana claims machines cannot solve this because they are "stuck inside." This is false. The invariant proof (counting I's, checking mod 3) is an algorithm. A machine can execute this metatheoretic check just as easily as a human. The Lucas-Penrose argument fails here; the "insight" is formalizable.
  4.  **"Jumping Out":** Dana implies "jumping out" means abandoning the system for human intuition. In logic, it means moving to a **metatheory**. We reason *about* MIU using arithmetic. This is a formal shift in framework, not a mystical escape from mechanism.

  **(c)** (i) With tripling ($Mx \vdash Mxxx$), $N(s)$ becomes $3N(s)$. If $N(s)=1$, $N(s')=3 \equiv 0 \pmod 3$. The invariant is destroyed immediately.
  (ii) Underivability is system-relative. In the original system, MU is underivable; in the variant, MU is derivable ($\text{MI} \vdash \text{MIII} \vdash \text{MU}$). It is not an intrinsic property of the string.
  (iii) Without invariants, one requires a **decision procedure** (e.g., reducing strings to a normal form) to determine membership in the set of theorems.

  *(Word Count: 765)*

  ***

  **MARKING SCHEME**

  **Part (a) [10 marks]**
  *   **A Answer:** States invariant ($N(s) \not\equiv 0 \pmod 3$). Performs induction on derivation length. Checks all 4 rules. Explicitly notes $2 \not\equiv 0 \pmod 3$ or invertibility of 2 for Rule (ii). Explains infinite search space vs. global proof.
  *   **A/B Separator:** Explicitly articulating *why* doubling preserves non-divisibility (modular arithmetic properties) rather than just asserting "it doubles."
  *   **Common Error:** Checking rules on specific examples rather than generally ($x$), or claiming finite search is sufficient.

  **Part (b) [14 marks]**
  *   **A Answer:** Identifies: (1) GIT inapplicability (MIU too weak); (2) Category error (Truth vs. Derivability); (3) Meta-proof is mechanical (anti-Lucas); (4) "Jump out" = Metatheory, not intuition.
  *   **A/B Separator:** Recognizing that the invariant proof itself is algorithmic/mechanizable, directly refuting Dana's anti-mechanism conclusion.
  *   **Common Error:** Accepting Dana's claim that GIT applies to *all* formal systems, or conflating "undecidable" with "underivable."
  *   **Bonus:** +2 marks for noting MIU-derivability is actually decidable (e.g., via normal form criteria regarding I-count and U-position), distinguishing "hard to find" from "undecidable."

  **Part (c) [6 marks]**
  *   **A Answer:** Notes invariant fails (1 becomes 3). States underivability is relation between string and rules (system-relative). Suggests decision procedure/normal forms for general case.
  *   **A/B Separator:** Clearly distinguishing that "MU is unreachable" is false in the variant, proving it is not a string-intrinsic fact.
  *   **Common Error:** Claiming MU is still unreachable or that the invariant still holds somehow.
