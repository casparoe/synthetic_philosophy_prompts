answer: |-
  | Desideratum | Verdict | Notes |
  | :--- | :--- | :--- |
  | **Falsifiability (Archives)** | **Real** | Without revisability, the account is dogma. Essential for historical truth. |
  | **1946 Info Set** | **Temperament** | Necessary for *moral* judgment of actors, but conflicts with *causal* learning. |
  | **Cause ≠ Blame ≠ Wrong** | **Real** | The core analytic engine. Prevents category errors common to all three schools. |
  | **Zero-Sum Status** | **Real** | Must be explicit. "Both sides" is either a structural claim or a cop-out. |
  | **Lock-In Blame** | **Real** | Not consequentialism; it is *modal* agency (who narrowed the possibility space). |

  **On Lock-In Blame**
  This is not consequentialism. Consequentialism judges the *outcome* (Cold War bad); Lock-In judges the *agency over structure* (who removed the off-ramp). It is a requirement for **modal responsibility**. In a security dilemma, both sides may act rationally, but the actor who first interprets the other's defense as offense *and* institutionalizes that interpretation (e.g., Truman Doctrine vs. Cominform) converts a friction into a lock. This is distinct from "who fired first" (event) or "who wanted war" (intent).

  **The Incompatible Pair**
  **Falsifiability (Archives)** and **1946 Information Set**.
  You cannot simultaneously hold that the verdict is bound by what was knowable in 1946 *and* that the verdict must be revisable when archives open.
  *   If the verdict relies on the 1946 set, secret intentions revealed later are irrelevant to *blame* (they couldn't act on unknown info).
  *   If archives must revise the verdict, the 1946 set was not the actual constraint.
  *   *Resolution:* Use the 1946 set to judge *rationality*, use archives to judge *intent*. Do not conflate the two.

  **The Single Requirement That Does the Most Work**
  **Separating Causation from Blame.**
  This distinction dismantles the three standard historiographies:
  *   **Traditionalists** conflate *Wrongness* (Soviet ideology) with *Causation* (ignoring US structural pressure).
  *   **Revisionists** conflate *Causation* (US economic expansion) with *Blame* (ignoring Soviet agency).
  *   **Post-Revisionists** conflate *Causation* (Security Dilemma) with *No Blame* (structural inevitability).
  By isolating **Blame** (who made the bad equilibrium the *only* survivable one), you admit structural causes while retaining human accountability. This allows you to say: "The Security Dilemma caused the tension, but specific leadership choices locked the door."
