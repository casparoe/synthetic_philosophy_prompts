answer: |-
  Here is a complete lesson plan for "The Village of Ostra," designed to fit your 80-minute block, hit the specific theoretical notes (audience problem, institutional lag, failure modes), and rigorously safeguard against producing actual shame in the room.

  # Activity: The Village of Ostra
  **Time:** 80 Minutes
  **Students:** 18
  **Materials:** 
  *   18 Index cards (labeled "Decision Slip")
  *   18 Envelopes (labeled "Private Vault")
  *   Whiteboard (divided into "Public Ledger" and "Hidden Tracker")
  *   Printed "Institution Menu" (one per student or projected)
  *   Printed "Personal Score Sheet" (one per student)

  ## Part 1: Setup & Safety (10 Minutes)

  **The Frame:**
  Tell the class: *"For the next hour, you are not students. You are heads of households in a fictional subsistence community called Ostra. Your goal is to maximize your household's survival points. There is no moral judgment on your decisions in this game. 'Defecting' is a mechanical term, like 'selling high.' We are testing systems, not character."*

  **The Safety Script (Crucial):**
  Read this verbatim or close to it:
  *"1. No one will ever know your individual choices but you and me. 
  2. No one's score will be announced. 
  3. If you lose points, it is not because you are 'bad,' it is because the simulation's physics penalized a strategy. 
  4. We are studying the mechanics of emotion, not feeling the emotions themselves. If you feel uncomfortable at any point, you may play 'Randomly' (flip a coin) and no one will know."*

  **The Mechanics:**
  *   **Endowment:** Each student starts with **10 Points**.
  *   **The Choice:** Each round, they face a "Resource Opportunity."
      *   **Contribute:** Pay 2 points. The *Group Pot* gains 3 points. (Cooperation)
      *   **Withhold:** Keep 2 points. The *Group Pot* gains 0 points. (Defection)
  *   **The Group Bonus:** At the end of the game, if the Group Pot > 30 points, *everyone* gets a +5 bonus. (This creates interdependence).
  *   **The Hidden Variable:** You (the instructor) track **"Cultural Memory" (CM)** on a hidden part of the board. Students do not see this number. They only feel its effects.

  ## Part 2: The Rounds (45 Minutes)

  **Round 1: The State of Nature (5 mins)**
  *   **Context:** No institutions.
  *   **Visibility:** **Private.** Students write "C" or "W" on the slip, seal in envelope.
  *   **Payoff:** Withholding gains +2. No penalties.
  *   **Action:** Collect envelopes. Tally publicly (e.g., "12 Contributed, 6 Withheld"). Update Group Pot.
  *   **Goal:** Establish baseline selfishness.

  **Round 2: The Institution Market (10 mins)**
  *   **Context:** The Village has a budget of **10 Community Tokens**.
  *   **Menu:** Project the menu. They vote to purchase institutions for the next rounds.
      1.  **The Watchtower (Cost 3):** Makes choices **Public** (Write on board, not envelope). *Effect: Public Withholding costs -5 points (Shame).*
      2.  **The Catechism (Cost 4):** Keeps choices **Private**. *Effect: Increases Cultural Memory (CM) by +2 per round.*
      3.  **Open Borders (Cost 2):** Allows a player to "Exit" (sit out a round, keep endowment, no contribution). *Effect: Simulates mobility.*
      4.  **Amnesty Ritual (Cost 1):** Resets individual penalty stacks.
  *   **Likely Outcome:** They will likely buy the Watchtower (cheap, immediate control) or Catechism (if they anticipate Private rounds).
  *   **Instructor Note:** Update CM based on purchases. (Start CM = 0. If Catechism bought, CM = 2).

  **Round 3: The Public Test (5 mins)**
  *   **Context:** Institutions active.
  *   **Visibility:** **Public** (if Watchtower bought) or **Private** (if not).
  *   **Payoff:** 
      *   If Watchtower active: Public Withholding triggers -5 penalty (Shame).
      *   If Catechism active: Private Withholding triggers penalty = CM (Guilt).
  *   **Action:** Run the round. Tally.
  *   **Goal:** Show that Shame (Watchtower) works well when seen.

  **Round 4: The Anonymity Shift (5 mins)**
  *   **Context:** "A fog rolls over Ostra."
  *   **Visibility:** **Forced Private.** (Even if they bought Watchtower, tell them it is broken this round).
  *   **Payoff:** 
      *   Watchtower is useless (no audience).
      *   Catechism effect persists (Penalty = CM).
  *   **Action:** Run the round.
  *   **Goal:** Demonstrate the **Audience Problem**. If they relied on shame, defection spikes. If they built CM, compliance holds.

  **Round 5: The Exit Option (5 mins)**
  *   **Context:** "A neighboring village opens up."
  *   **Visibility:** Private.
  *   **Mechanic:** If they bought **Open Borders**, students can choose to "Exit."
      *   **Exit:** Keep 10 points, contribute 0, leave the game.
      *   **Stay:** Play normal.
  *   **Payoff:** Shame cultures fracture here. If your reputation is stained, leaving is rational. Guilt cultures retain people because the penalty is internal.
  *   **Action:** Count Exits.
  *   **Goal:** Show Shame's fragility to mobility.

  **Round 6: The Repeal (10 mins)**
  *   **Context:** "The Village Council votes to abolish the Catechism/Watchtower to save money."
  *   **Visibility:** Private.
  *   **Mechanic:** They vote to **repeal** the institution they bought in Round 2.
  *   **The Lag:** 
      *   If they repeal Catechism: CM does **not** drop to 0. It decays by 1. (e.g., if CM was 6, it is now 5).
      *   The penalty for Withholding remains high (5 points) even though the institution is gone.
  *   **Action:** Run the round.
  *   **Goal:** Demonstrate the **Guilt Lag**. The rule is gone, but the "internal observer" remains.

  **Final Tally (5 mins)**
  *   Calculate Group Pot. Distribute Group Bonus if applicable.
  *   Students calculate final private scores.
  *   Collect Score Sheets (so you can see the data).

  ## Part 3: The Debrief (25 Minutes)

  Do not start with "What did you feel?" Start with the data.

  **1. The Audience Problem (Shame)**
  *   *Ask:* "Look at Round 3 vs. Round 4. When visibility changed, did behavior change?"
  *   *Point:* If they bought the Watchtower, compliance likely dropped in Round 4. Shame requires an audience. It is fragile to anonymity and technology (the 'fog').
  *   *Failure Mode:* In Round 5 (Exit), did high-defectors leave? Shame cultures lose members who can't repair their public face. They exit rather than repair.

  **2. The Lag (Guilt)**
  *   *Ask:* "In Round 6, we repealed the rule. Did the penalty disappear?"
  *   *Reveal:* Show them the Hidden CM Tracker. "You repealed the institution, but the penalty persisted. Why?"
  *   *Point:* Guilt is an internalized habit. You can repeal the law, but you cannot repeal the conscience immediately. It decays slowly.
  *   *Failure Mode:* Ask if anyone felt 'stuck' contributing in Round 6 even though it was mathematically suboptimal? That is the cost of Guilt: it doesn't switch off when it's no longer useful. It can lead to scrupulosity (punishing yourself when no one is harmed).

  **3. The Normative Frame (Your Lecture)**
  *   Now you supply the frame they couldn't see.
  *   **Shame:** Efficient, cheap, enforces norms quickly. *Cost:* Hypocrisy (looking good vs. being good), fragility to exit, permanent exile.
  *   **Guilt:** Expensive, slow to build, robust to anonymity. *Cost:* Private suffering, lag (hard to reform), no public repair (I can feel guilty without fixing the harm).
  *   **The Choice:** Can a culture choose? The game shows you can buy the *institutions* (Watchtower vs. Catechism), but you cannot buy the *outcome* instantly. Guilt requires a generation of training (Rounds 2-5) to work. Shame works Round 1, but breaks Round 5.

  ## Risk Management: What Will Go Wrong

  **1. Meta-Gaming ("I'm just optimizing points")**
  *   *Prediction:* Students will treat this as a pure logic puzzle.
  *   *Fix:* This is actually fine. Acknowledge it in debrief. *"You optimized points. In real life, that optimization process feels like an emotion. The 'cost' of guilt in the game was points; in life, it's cortisol and sleeplessness. The structure is the same."*

  **2. Conflating Shame with Embarrassment**
  *   *Prediction:* Students will say "I didn't want to look bad in front of you."
  *   *Fix:* Distinguish in debrief. *"Embarrassment is 'I tripped.' Shame is 'I am unworthy.' In the game, the penalty was point loss. In a shame culture, the penalty is loss of status/marriageability/trust. The game simulates the cost, not the feeling."*

  **3. Producing Real Shame (The Critical Risk)**
  *   *Prediction:* A student defects, feels singled out, and actually feels shame.
  *   *Fix:* 
      *   **Aggregate Data Only:** Never say "John withheld." Say "6 households withheld."
      *   **Private Scoring:** Never read scores aloud. 
      *   **The "Fog" Excuse:** In Round 4, emphasize the *environment* changed, not their character.
      *   **Instructor Stance:** Remain a neutral actuary. "The system deducted 5 points." Not "You broke the rule."
      *   **The Safety Valve:** Remind them again before Round 3 (Public) that they can choose randomly if they feel pressured.

  **4. The Lag Doesn't Land**
  *   *Prediction:* They repeal the institution in Round 6 and everyone defects immediately because they know the game is ending.
  *   *Fix:* Make the Group Bonus contingent on Round 6 performance. "If the Group Pot hits 40 *including this round*, everyone gets +10." This makes the *habit* valuable even at the end. If they defect because the game is ending, point that out: *"Real life doesn't have a last round. The fact you defected because time ran out proves the internalization wasn't complete."*

  ## Instructor Cheat Sheet: The Hidden Tracker

  Draw this on the back of the whiteboard or a piece of paper they can't see.

  *   **Cultural Memory (CM):** Starts at 0.
  *   **Round 2:** If Catechism bought, CM +2.
  *   **Round 3:** If Catechism active, CM +2.
  *   **Round 4:** If Catechism active, CM +2. (Max CM usually 6).
  *   **Round 5:** If Catechism active, CM +2.
  *   **Round 6:** Catechism Repealed. CM -1 (Decay).
  *   **Penalty Rule:** 
      *   If **Watchtower** active & Choice **Public**: Penalty = 5 (Shame).
      *   If **Catechism** active (or recently repealed) & Choice **Private**: Penalty = CM (Guilt).
      *   If **Neither**: Penalty = 0.

  *Note: You enforce the penalty by having them calculate their own scores based on the rules you announce. "If you withheld privately this round, subtract X points." You trust them to do the math, but the *value* of X is your secret lever.*

  ## Why This Works for Your "Hard Part"
  1.  **Audience:** Round 3 vs 4 isolates visibility.
  2.  **Exit:** Round 5 isolates mobility.
  3.  **Lag:** Round 6 isolates the institutional vs. internal timeline.
  4.  **Safety:** Aggregated data and private scoring prevent social injury.
  5.  **No Reading:** The mechanics teach the theory without requiring Haidt or Nussbaum beforehand.

  You end the class not by telling them which is better, but by showing them the price tag of each. Shame is cheap but brittle. Guilt is expensive and sticky. The rest is their essay prompt.
