answer: |-
  The dispute between cyclical and linear conceptions of history is often obscured by conflating three distinct claims: Recurrence, Boundedness, and Non-transmission. Recurrence posits that political forms appear in the same order due to human nature rather than accident. A cyclical theorist is genuinely committed to this as a universal law; a linear theorist can concede that forms recur locally without loss, provided this repetition is not necessary nor ordered toward a specific end. Boundedness asserts that any given polity or culture has a finite span and is not reconstituted as the same thing. The cyclical theorist is committed to this finitude as an organic limit. The linear theorist can concede this without loss regarding specific polities—empires do fall—provided the broader civilization or species capacity survives. Finally, Non-transmission claims that nothing durable crosses a breakdown; a later society does not stand on the remains of an earlier one. Here lies the irreducible conflict. The cyclical theorist is committed to Non-transmission; the reset is essential to the cycle. The linear theorist cannot concede this, for accumulation requires that the foundation survives the collapse of the structure built upon it.

  The Kavari record forces an adjudication of these claims. Regarding the first question, does the monotonic growth in energy and technique confirm the accumulation view? The strongest cyclical reply invokes the Spenglerian distinction between Culture and *civilization*: growth in technique and extent is not progress but the hardening of a dying organism, the winter phase where expansion replaces creation. Is this a genuine prediction or a redescription? It is a redescription unless the theory specifies *ex ante* the maximum duration or energy threshold of this phase. If "technical growth" is always interpretable as "exhaustion" regardless of whether the society collapses tomorrow or flourishes for another millennium, the theory is unfalsifiable. To be a genuine prediction, the cyclical view must define a terminal point where technical facility inevitably precipitates collapse. If the Kavari continue to increase energy mobilization for another four thousand years without structural dissolution, the Spenglerian reply fails. Until then, it remains a hermeneutic shield rather than a predictive instrument.

  Second, consider the cyclical resources of redefining the unit of analysis. A cyclical theorist might argue the twelve dissolutions are merely internal pulsations within one continuing civilization, or that the four thousand years constitute a single Culture not yet ended. What evidence discriminates these maneuvers from the admission that the cyclical model has failed? The discriminator is Non-transmission. If the dissolutions were true cyclical resets, the administrative articulation of the successor polity should degrade or revert to earlier forms before climbing again. However, the record states techniques increased *monotonically* across the whole period. If the twelfth polity stands on the administrative remains of the first, utilizing lost technologies of the intermediate failures, the breakdowns were political, not civilizational. To maintain the cyclical view, one must demonstrate that despite technical retention, the *solidarity* or *meaning* (the Ibn Khaldunian *asabiyyah*) has cyclically dissolved and regenerated without accumulation. If the Kavari administrative logic is cumulative, the unit of history is the species-capacity, not the polity, and the linear model wins.

  Third, the test of symmetry. If the Kavari record showed monotonic decline in population, energy, and articulation, would that confirm the cyclical view or refute the linear one? It must refute the linear one. The linear theory rests on the axiom of net accumulation; a four-thousand-year net regression contradicts the mechanism of inheritance. Conversely, a monotonic decline fits the downward arc of a cycle perfectly. If linear theorists accept the rising record as confirmation but reject the falling record as merely anomalous, they rely on an asymmetry that protects their theory from falsification. To be coherent, the linear theorist must admit that sustained entropy refutes accumulation just as sustained growth refutes exhaustion. There is no logical ground to treat growth as structural and decline as accidental if the time scales are identical.

  Ultimately, the dispute between cyclical and linear history is often a pseudo-dispute generated by shifting units of analysis—dynasty, polity, culture, or species—combined with stage-lengths stretched to fit any record. However, it becomes determinate when anchored to a specific measurable quantity. I take the side of the linear theorists, not because cultures do not die, but because the human capacity to manipulate energy and information accumulates across their deaths. The Kavari record suggests that political dissolution does not entail civilizational amnesia.

  To settle this matter definitively, we must name one measurable quantity: *Net Retained Technological Complexity per Capita across Political Collapse Events*. This measures the baseline of usable technique available immediately after a central order dissolves compared to the baseline before it. I expect this value to be positive or neutral over time, never negative. If the baseline after the twelfth dissolution is higher than after the first, accumulation is real. If it is lower, the cyclical reset is real.

  I would change my mind if historians discovered a sustained period where physical records survived intact, yet the subsequent society proved incapable of deciphering or utilizing the knowledge contained within them, indicating an irreversible loss of cognitive capacity rather than mere political fragmentation.
