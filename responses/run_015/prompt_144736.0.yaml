  ### Scoring Key & Diagnostic Map

  To determine your profile, tally your responses. While individual answers matter, look for the **dominant pattern** across the quiz.

  | View | Diagnostic Pattern | Description |
  | :--- | :--- | :--- |
  | **Simple Conditional Analysis (SCA)** | **Mostly A** on Q1, Q2, Q3. | You judge dispositions primarily by the truth of the associated counterfactual conditional. If the manifestation fails (Fink/Mask) or occurs without basis (Mimicker), you deny the disposition. |
  | **Revised Conditional Analysis (RCA)** | **A** on Q1, Q2; **B** on Q3; **C** on Q6. | You defend the conditional analysis by adding *ceteris paribus* clauses. You accept the disposition in Fink/Mask cases only if you can stipulate the interferer is absent (Q6), but reject Mimickers. |
  | **Causal-Basis View (CBV)** | **Mostly B** on Q1, Q2, Q3, Q5, Q9. | You require an intrinsic property that *causes* the manifestation. You reject SCA on Finks/Masks but distinguish the disposition from the basis (allowing Basis-Swap in Q5). |
  | **Identity View (IV)** | **B** on Q1, Q2; **B** on Q5 (No). | You identify the disposition *with* the categorical basis. In Q5, you must say the fragility is gone because the specific microstructure is gone. |
  | **Powers Ontology (PO)** | **Mostly B** on Q1–Q5; **B** on Q4, Q7, Q10. | You treat dispositions as primitive, irreducible properties. You comfortably accept probabilistic (Q4), single-track (Q7), and gradable (Q10) powers. |
  | **Interventionist (IDM)** | **B** on Q1, Q2; **B** on Q8. | You focus on difference-making. In Q8 (Preemption), you likely deny the disposition because removing the cause makes no difference to the effect. |
  | **Gradable/Context (GCR)** | **Mostly C** on Q2, Q7, Q10. | You believe disposition ascriptions are sensitive to context, standards, or comparison classes. Binary judgments (Fragile/Not) are often false; degrees are real. |
  | **Deflationary (DIT)** | **Mostly C** on Q3, Q5, Q9. | You view disposition talk as useful inference tickets without robust truth conditions. You are comfortable with indeterminacy in Q5 and Q9. |

  #### Unnamed Regions (Inconsistent Patterns)
  *   **Pattern: A on Q1 (Fink) but B on Q4 (Probabilistic).**
      *   *Label:* **Unnamed.**
      *   *Status:* **Incoherent.** Accepting strict conditionals for finks but probabilistic powers for quantum finks creates a tension in how manifestation conditions are defined.
  *   **Pattern: B on Q3 (Mimicker) but B on Q5 (Basis-Swap).**
      *   *Label:* **Unnamed.**
      *   *Status:* **Merely Unattractive.** This suggests a view where external behavior trumps basis (Mimicker) but basis identity trumps function (Swap). It lacks a unified principle of individuation.
  *   **Pattern: C on Q1, Q2 but A on Q9.**
      *   *Label:* **Unnamed.**
      *   *Status:* **Simply Unexplored.** Context-sensitivity on ontology (Q1/2) but realism on inference (Q9) is a stable position but rarely defended in the literature.

