answer: |-
  # Diagnostic Handout: Dispositions and Conditionals
  **Graduate Reading Group | Metaphysics Department**

  **Instructions:** This instrument is designed to map your intuitive judgments on concrete cases to established metaphysical positions. There are no "correct" answers. Answer based on your immediate verdict on the case described, not on the theory you currently endorse. Each question presents a scenario followed by three mutually exclusive judgments.

  ---

  ### The Quiz

  **1. The Electro-Fink (Classic Fink)**
  A wire is made of copper and structurally intact. However, a device monitors the wire. If and only if the wire is touched by a conductor, the device instantly renders the wire non-conductive before any current can flow. If not touched, it remains conductive.
  *Is the wire conductive?*
  A. No, because if you tried to use it (touch it), it would not conduct electricity.
  B. Yes, because it possesses the intrinsic physical structure of a conductor, regardless of the device.
  C. It depends on whether the monitoring device is considered part of the testing environment.

  **2. The Packed Glass (Classic Mask)**
  A fragile glass vase is wrapped thickly in protective foam. If struck by a hammer, the foam absorbs the impact, and the vase does not break. The vase's molecular structure remains unchanged.
  *Is the vase fragile?*
  A. No, because it will not break if struck in its current state.
  B. Yes, because its internal structure is such that it would break if the foam were removed.
  C. Yes, but only in contexts where protective packaging is not assumed.

  **3. The Explosive Wood (Mimicker)**
  A block of wood has a sturdy molecular structure (not fragile). However, a tiny motion-sensor bomb is glued inside. If struck by a hammer, the bomb detonates, shattering the wood. To an observer, it behaves exactly like fragile glass.
  *Is the wood fragile?*
  A. Yes, because it shatters when struck.
  B. No, because the shattering is caused by the bomb, not the wood's structure.
  C. Yes, for the purpose of safety warnings, but not in a metaphysical sense.

  **4. The Quantum Fink (Probabilistic Fink)**
  A particle has an intrinsic basis for decay. A randomizer monitors it. On 50% of occasions where a decay-triggering stimulus occurs, the randomizer removes the basis before decay happens. On the other 50%, it does nothing, and decay occurs.
  *Does the particle have the disposition to decay?*
  A. No, because there is no strict guarantee that the stimulus leads to manifestation.
  B. Yes, it has a probabilistic disposition (a 50% propensity).
  C. It has the disposition, but the manifestation is merely chancy.

  **5. The Nanite Swap (Basis-Swap)**
  A glass vase's molecular bonds are secretly replaced by a swarm of nanobots. The nanobots are programmed to hold the shape and shatter exactly when the molecular bonds would have. The macroscopic behavior is identical; the microstructural basis is completely different.
  *Is it the same vase with the same fragility?*
  A. Yes, fragility is defined by the behavioral role, which is preserved.
  B. No, the original fragility ceased when the molecular basis was destroyed; this is a mimic.
  C. The claim "same fragility" is indeterminate without a specified context of comparison.

  **6. The Dry Salt (Impossible Stimulus)**
  A sample of salt has the intrinsic lattice structure of soluble salt. However, it exists in a universe where no solvent (like water) exists or is nomologically possible. It will never dissolve.
  *Is the salt soluble?*
  A. Yes, solubility is an intrinsic property independent of the presence of water.
  B. No, because the conditional "if immersed, it would dissolve" cannot be evaluated.
  C. Yes, because in the nearest possible world where water exists, it would dissolve.

  **7. The Red Hammer (Single-Track)**
  An object is constructed such that it shatters if struck by a *red* hammer, but remains perfectly solid if struck by a hammer of any other color. It has no other triggers for breaking.
  *Is the object fragile?*
  A. Yes, dispositions can be hyper-specific to stimuli.
  B. No, genuine fragility must be a general capacity to break under a range of impacts.
  C. It is fragile relative to red hammers, but not simpliciter.

  **8. The Preemptive Strike (Intervention)**
  Two causes are sufficient to shatter a window: a thrown rock (C1) and a sonic pulse (C2). Both occur simultaneously. The rock hits first, shattering the window instantly; the sonic pulse arrives a microsecond later.
  *Did the sonic pulse have the disposition to break the window?*
  A. Yes, it had the power to do so, even if preempted.
  B. No, because intervening on the sonic pulse (removing it) would not have changed the outcome.
  C. Yes, but its causal contribution is screened off by the rock.

  **9. The Prediction License (Deflationary)**
  You predict a cup will break if dropped, based solely on past observations of similar cups. You have no knowledge of its microstructure or intrinsic powers.
  *Is your claim "the cup is fragile" true?*
  A. Yes, if the prediction holds true; the claim is just a license to infer breaking.
  B. Yes, only if the cup actually possesses an intrinsic basis you are unaware of.
  C. Yes, only if the conditional "if dropped, it would break" is true.

  **10. The Graded Drop (Gradable Context)**
  Cup A breaks if dropped from 1 meter. Cup B breaks if dropped from 10 centimeters. Both are described as "fragile."
  *Is one cup more fragile than the other?*
  A. No, fragility is a binary property; either you have the disposition or you don't.
  B. Yes, dispositions come in degrees of strength or liability.
  C. "More fragile" is just a shorthand for different conditional probabilities.

