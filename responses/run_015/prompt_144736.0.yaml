  ### Indistinguishable Pairs & Limitations

  This instrument sorts based on case judgments. Certain metaphysical distinctions require direct ontological questioning and cannot be fully resolved by case intuition alone.

  **1. Causal-Basis View (CBV) vs. Identity View (IV)**
  *   **Problem:** Both views are intrinsic realists. They agree on Finks, Masks, and Mimickers.
  *   **Diagnostic:** Q5 (Basis-Swap) is the only potential separator. IV says the disposition is *identical* to the specific microstructure (so it vanishes in the swap). CBV says the disposition is the property *playing the causal role* (so it survives the swap).
  *   **Limitation:** If a respondent answers Q5 based on functional intuition rather than metaphysical identity, these views collapse. To separate them definitively, one must ask: *"Is the disposition numerically identical to the categorical base, or merely supervenient upon it?"*

  **2. Revised Conditional Analysis (RCA) vs. Powers Ontology (PO)**
  *   **Problem:** On standard Mask/Fink cases, both agree the disposition exists. RCA adds a proviso ("if no mask"); PO says the power exists regardless.
  *   **Diagnostic:** Q4 (Probabilistic Fink) and Q7 (Single-Track). RCA struggles to formulate non-vacuous provisos for probabilistic or hyper-specific cases without collapsing into PO.
  *   **Limitation:** A sophisticated RCA theorist can always add a more complex proviso. To separate them, one must ask: *"Do the conditionals explain the disposition, or does the disposition explain the conditionals?"*

  **3. Gradable/Context (GCR) vs. Deflationary (DIT)**
  *   **Problem:** Both reject robust, context-independent realism. Their judgments on Q9 and Q10 often overlap (e.g., "It depends").
  *   **Diagnostic:** Q9 (Prediction License). DIT says the claim has no truth conditions beyond utility; GCR says it has truth conditions relative to a context.
  *   **Limitation:** In practice, "truth relative to context" and "inference ticket" yield the same practical verdicts. To separate them, one must ask: *"Does 'fragile' express a proposition with truth conditions, or is it a non-cognitive prescription?"*
