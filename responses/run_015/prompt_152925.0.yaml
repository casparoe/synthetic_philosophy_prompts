  **INTERIM SECRETARIAT FOR CONTINUITY AND INSTITUTIONAL METRICS (ISCIM)**
  **PRESS RELEASE 2023-04B**

  **GENEVA, 14 October 2023** — The Interim Secretariat for Continuity and Institutional Metrics (ISCIM) today announced a comprehensive realignment of its historical diagnostic taxonomy, effective immediately. Following a review of longitudinal data sets covering the Holocene, the term "collapse" has been retired as a formal classification category. Henceforth, events previously designated as civilizational collapses will be recorded in official registries as "Unscheduled Institutional Restructuring" (UIR) or "Complexity Right-Sizing."

  The decision follows an audit revealing that previous diagnostic criteria relied disproportionately on the cessation of elite administrative outputs rather than demographic or subsistence continuity. Where archival records indicate a discontinuity in palace redistribution networks, monumental inscription, or prestige-good procurement, prior methodologies defaulted to a null hypothesis of population failure. The ISCIM finds this correlation insufficient. The absence of written documentation constitutes a reporting variance, not necessarily a biological event. Consequently, future reporting will prioritize evidence of habitation, ceramic production, and lithic adaptation over the presence of scribal bureaucracies or monolithic architecture.

  Under the new framework, the following historical episodes have been reclassified:

  *   **Eastern Mediterranean and Aegean Systems (c. 1200 BCE):** Previously categorized as the "Late Bronze Age Collapse." Reclassified as "Palatial Supply Chain Realignment." While data confirms the combustion of administrative centers at Pylos, Knossos, and Hattusa, and the discontinuation of Linear B script, subsequent strata indicate robust settlement continuity. The transition to ironworking technologies and the adoption of alphabetic scripts are now recognized as efficiency upgrades rather than regression. The disappearance of imported luxury goods is noted as a successful shift toward localized procurement strategies.
  *   **Southern Maya Lowlands (Terminal Classic, c. 800–950 CE):** Previously categorized as the "Classic Maya Collapse." Reclassified as "Ceremonial Center Decentralization." Audit logs confirm the cessation of Long Count calendar inscriptions and the abandonment of specific monumental cores in the southern lowlands. However, demographic modeling indicates significant population retention within the region and migration to northern centers such as Chichén Itzá. Pottery styles and trade networks persisted without royal patronage. The event is now understood as a dissolution of divine kingship institutions rather than a failure of Maya society.
  *   **Rapa Nui (Pre-Contact Period):** Previously categorized under various "Ecocide" or "Collapse" models. Reclassified as "Monumental Production Cessation." Evidence confirms the end of moai transport and carving prior to European contact. However, archaeological records show continuous occupation, adaptation of agricultural practices to changing environmental conditions, and stable population levels through the transition. The cessation of statue building is recorded as a strategic reallocation of labor resources rather than a societal failure.

  "The primary metric of a society is the presence of people, not the presence of paperwork," said Dr. Aris Thorne, ISCIM Senior Deputy for Historical Metrics. "When a palace burns, the archive is lost, and the historian perceives a void. The farmer in the hinterland, however, perceives only a change in tax liability. Our mandate is to record the farmer's continuity, not the scribe's silence. We are confident that what looks like a cliff edge in the data is often merely a staircase viewed from the wrong angle."

  The Secretariat acknowledges that resource constraints and environmental stressors frequently precipitate Unscheduled Institutional Restructuring. However, framing these moments as terminal events obscures the resilience of underlying populations. Malthusian thresholds are recognized as logistical challenges to be managed, not inevitable verdicts on cultural viability.

  Moving forward, all ISCIM publications will refrain from using language implying total systemic failure unless accompanied by evidence of regional depopulation exceeding ninety percent over a centennial scale. Preliminary reviews suggest such events are statistically rare. The Secretariat remains confident in the continuity of human stakeholders across all monitored periods.

