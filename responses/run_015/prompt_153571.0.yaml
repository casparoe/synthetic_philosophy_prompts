answer: |-
  Hey there. No worries about the typos or the phone situation—writing between classes is basically the university experience in a nutshell.

  I should mention upfront that you didn't actually attach any notes to this message, so I'm working off the description you gave in the prompt. But honestly, the concept you've outlined here is strong enough to analyze on its own.

  To answer your main question: **No, you aren't just redescribing the lesser-evil problem.** You're identifying a distinct downstream consequence of it. Here's why "mandate contamination" adds something new to the seminar discussion, along with a few things to watch out for as you develop the idea.

  ### 1. The Distinction: Calculus vs. Hermeneutics
  The standard **lesser-evil problem** is usually about the *moment of decision*. It's a moral calculus: *Am I complicit in Candidate A's bad policies if I vote for them to stop Candidate B?* It focuses on the voter's intent and the immediate consequence.

  Your **mandate contamination** idea is about *interpretation* (hermeneutics). It focuses on what happens *after* the votes are counted.
  *   **Lesser-Evil:** "I voted for him to stop the other guy."
  *   **Mandate Contamination:** "He won, and now he's claiming I voted *for* his tax cuts, when I only voted *against* his opponent."

  This shifts the ethical burden from the individual voter to the institutional structure of democracy. It suggests that the "meaning" of a vote isn't fixed when you cast it; it's assigned later by the winner. That's a really interesting claim that moves beyond standard rational choice theory.

  ### 2. Blurring Expression and Duty
  You mentioned this might blur the line between expressive and duty-based voting. I think you're onto something specific here:
  *   **Expressive Voting:** Usually means voting for who you truly like to signal your values.
  *   **Duty-Based Voting:** Voting for the lesser evil to prevent harm.

  In your framework, a **duty-based vote** gets misread as an **expressive vote** by the political system. The winner treats your defensive maneuver as an affirmative endorsement. This creates a kind of "semantic theft" where the institutional narrative overrides the individual intent. That's a fresh angle because most theories assume the aggregate vote total speaks for itself. You're arguing the vote total is being misquoted.

  ### 3. Theoretical Hooks for Your Seminar
  If you want to flesh this out for class, here are a few angles that might help you defend the idea:
  *   **Representation Theory:** Look at Hanna Pitkin's work on representation. She distinguishes between "standing for" and "acting for." Mandate contamination happens when the winner claims you authorized them to "act for" you in ways you never intended.
  *   **Speech Act Theory:** You could argue that voting is a speech act. Usually, we think the meaning is determined by the speaker (the voter). Your idea suggests that in democracy, the meaning is determined by the listener (the state/winner). That creates a unique ethical vulnerability.
  *   **The " Fiction of the Mandate":** Political scientists often argue mandates are fictional anyway (people vote for too many different reasons). Your contribution could be ethical rather than empirical: Even if mandates are fictional, is it *wrong* for politicians to utilize this contamination strategy?

  ### 4. Potential Pushback (Be Ready for This)
  Since this is a seminar, expect some pushback. Here's how to prepare:
  *   **"Voters Know the Risk":** A critic might say, "Strategic voters know winners will claim a mandate. By voting anyway, they accept that risk."
      *   *Counter:* Accepting a risk isn't the same as consenting to the outcome. I might wear a seatbelt to prevent death, but that doesn't mean I consent to being in a car crash.
  *   **"All Votes Are Ambiguous":** Someone might argue that *no* vote is a clear mandate, so contamination is just standard politics.
      *   *Counter:* Acknowledge this, but argue that strategic voting makes the ambiguity *worse* because the gap between intent and outcome is intentionally widened by the voter.

  ### Verdict
  It's a solid concept. It moves the conversation from "How should I vote?" to "How is my vote being used against me?" That's a meaningful shift.

  If you can get those notes typed up and refined, you should definitely bring this up. It sounds like the kind of nuance professors love because it challenges the standard binaries (expressive vs. instrumental) without throwing them out completely.

  Good luck with the seminar! Let me know if you want to brainstorm counter-arguments once you've got the full notes written out.
