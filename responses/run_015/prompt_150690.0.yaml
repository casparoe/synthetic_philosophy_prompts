answer: |-
  Subject: Procedure for Release Committee Decisions

  Colleagues,

  Given the constraints we operate under, specifically the forty-eight-hour decision window and the fact that this committee is not composed of researchers, we need a rigid protocol that minimizes deliberation time and maximizes consistency. You asked for my view on whether thresholds should be fixed in advance or applied checkpoint by checkpoint, and I am convinced they must be fixed before we see any model capabilities. If we set thresholds after seeing what a model can do, capability awe will inevitably colour our risk assessment, leading us to tolerate higher risks for more impressive models. Fixed thresholds treat every checkpoint as a potential hazard first and a product second, which is the only way to prevent commercial excitement from overriding safety protocols during the evaluation window. With that principle established, here is the procedure we will run for every release candidate.

  Step one is to compare the evaluation summary against the pre-agreed safety thresholds for misuse and alignment. An adequate answer here is a binary pass or fail based strictly on the metrics defined in our safety charter, such as refusal rates on dangerous prompts or success rates on bioweapon synthesis tasks. If the checkpoint fails these thresholds, the process moves to step two. If it passes, we proceed to step three. Step two asks whether the specific risk identified can be mitigated within the six-week commercial breach window. An adequate answer requires a concrete estimate from the alignment team on the time required to fix the failure. If the estimated time exceeds six weeks, the recommendation is to drop the release line entirely. If the time is within six weeks, the recommendation is to hold. Step three applies to checkpoints that passed step one but still carry residual risk or strategic implications. This step asks whether holding back the model actually reduces the global risk in question or merely changes which lab ships the capability first. An adequate answer requires intelligence on competitor cadences and the duplicability of the capability. If the honest answer is that holding back merely changes who ships first without preventing the capability from existing, the procedure dictates we ship immediately to maintain market parity, unless the risk is deemed catastrophic. Step four identifies any questions that cannot be settled by evidence. These are value judgments about whether the private cost of delay is worth the public benefit of restraint when the substitution effect is neutral. These questions must be flagged for the CEO, as they involve trade-offs between company survival and external safety that exceed our mandate.

  Applying this to the first checkpoint, where misuse tests are cleared and only a four-day refusal fine-tune is needed, the procedure is straightforward. In step one, the model passes all safety thresholds. In step three, we confirm there is no significant substitution risk requiring immediate action, but since step one was a pass, we default to shipping. The recommendation is to ship now after the four-day tune. This is an easy decision that aligns with both safety and commercial goals.

  The second checkpoint presents a conflict. Here, two of three red-team protocols return borderline results, meaning it fails step one. We move to step two to assess mitigation time. Given the borderline nature of the results, alignment work is estimated to take eight weeks to bring the model to a confident pass. This exceeds the six-week breach window. The procedure forces a recommendation to drop the release line altogether. I know you will not want to take this to the CEO because it means writing off the research spend and conceding the market segment to the competitor expected in three weeks. However, the procedure forces this because allowing an eight-week hold violates our commercial commitments, and shipping a model that failed safety thresholds violates our safety charter. We cannot hold indefinitely, and we cannot ship unsafe models, so the only compliant path is to drop the line.

  The third checkpoint materially improves automated vulnerability discovery, and two other labs are within a release or two of the same capability. Assume this model passes the step one safety thresholds for internal misuse. In step three, we assess the substitution effect. The evidence suggests our delay would not prevent the capability from existing, as competitors are close behind. The honest answer is that holding back merely changes which lab ships first. According to the procedure, when holding back does not reduce global risk, we should ship immediately to avoid ceding ground without gaining safety. The recommendation is to ship now. This may feel uncomfortable given the nature of vulnerability discovery, but since the capability is imminent elsewhere and our model passed internal safety checks, withholding it provides no public good while incurring full private cost.

  Finally, I must state what this procedure cannot do. It cannot resolve the fundamental tension where the costs of safety are privatized to our lab while the benefits are public goods enjoyed by everyone else. It cannot force competitors to adhere to our timelines or safety standards. It cannot make the CEO's value judgment for them when the evidence is ambiguous about catastrophic risk. And most painfully, it cannot prevent a scenario where following the rules means dropping a viable product or shipping a capable one into a risky environment, because it is a decision tool, not a shield against the reality of the market we operate in.

  Regards,

  Release Committee Chair
