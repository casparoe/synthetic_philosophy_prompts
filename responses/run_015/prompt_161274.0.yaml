      *   **User's Goal:** Wants the argument pulled apart. Wants to know which premise is doing the heavy lifting. Wants to know if the 3 AM case is truly fetishism. Wants to know if the Eichmann comparison is valid or a cheap shot. Wants to know if the cultural comparison is well-posed or just choosing failure modes.
