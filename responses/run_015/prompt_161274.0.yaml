      *   *Premise 2 (Integrity/Consistency):* The power of a rule lies in its perceived universality. Exceptions undermine the rule's authority for *everyone*.
      *   *Premise 3 (Power Dynamics):* Codified rules protect the powerless against the arbitrary whims of the powerful (who would otherwise enforce unwritten norms).
      *   *Conclusion:* Adherence maintains the "public residue" necessary for a functioning society, even in edge cases like 3 AM.

  4.  **Identify the Core Conflict:**
