      Meridian Human Capital Solutions
      Policy GRP-7: Global Recognition & Leveling
      Version 4.2 (Post-Merger Harmonization)

      **Epigraph:**
      "Equity is not a destination, but a suppression of altitude." — Lars Vinter, Founding Partner

      **1.0 Purpose**
      Following the integration of American Merit Accrual protocols and Nordic Equilibrium Maintenance standards, this policy establishes a unified framework for recognition. The objective is to reconcile the debt owed to achieving agents with the imperative to dampen positional competition.

      **2.0 Definitions**
      **2.1 Net Merit:** The portion of an outcome attributable solely to voluntary effort, excluding native talent, upbringing, schooling, market timing, and divisional assignment.
      **2.2 Tall Poppy:** Any employee whose visible success exceeds the collective median by more than two standard deviations.
      **2.3 Doxastic State:** The internal belief structure of an employee regarding their own compliance.

      **3.0 Desert Verification**
      Before public acknowledgment, all achievements must undergo Desert Verification (Form DV-99). Employees must certify that the outcome was not produced by luck factors. As native talent and upbringing are classified as luck, most submissions will return a Net Merit of zero. Employees are reminded that a zero result is compliant; claiming non-zero Net Merit is a violation of Section 3.2.

      **4.0 Counterfactual Poppy Test**
      To determine replaceability, management must ask: Would a randomly selected colleague have achieved this result in the same timeframe? If yes, the achievement is routine and warrants no praise. If no, the employee is an outlier. Outliers represent systemic risk. Consequently, praise is withheld to prevent destabilizing the team. This logic extends to blame: if a colleague could have failed similarly, individual blame is waived.

      **5.0 Inverse Recognition**
      Since success is largely luck-derived (see 3.0), credit must be redistributed to maintain equilibrium. Positive outcomes generated by high performers shall be formally attributed to the lowest-performing quintile. This ensures that luck is not compounded by status. Managers must issue commendations to the least successful staff for the successes of the most successful.

      **6.0 Doxastic Compliance**
      Outward adherence is insufficient. Employees must not believe they are compliant. Believing one is good at complying implies a competence that violates Section 2.1. Therefore, employees who believe they understand this policy are automatically non-compliant. Regular audits will assess confidence levels; high confidence triggers mandatory retraining.

