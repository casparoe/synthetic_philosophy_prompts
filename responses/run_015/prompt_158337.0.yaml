answer: |-
  This is a sharp dissection of the capital punishment apparatus. You have identified the friction between the *retributive justification* (which requires actual guilt) and the *procedural reality* (which guarantees only legal guilt), alongside the asymmetry in how "bias" is defined during jury selection.

  Here is a reconstruction of the implicit philosophical theory, the distinction between its necessary and contingent parts, the counterfactual implications of your proposed reforms, and an evaluation of its coherence.

  ### 1. Reconstruction of the Implicit Theory

  The current practice presupposes a hybrid framework I will call **Procedural Sovereignty with Retributive Cover.** It relies on three specific philosophical commitments:

  **A. Legal Positivism regarding Guilt (The Epistemic Commitment)**
  The system does not operate on *ontological guilt* (what actually happened) but on *institutional guilt* (what was proven according to rules).
  *   **The Presupposition:** A verdict of "guilty beyond a reasonable doubt" does not merely authorize punishment; it *constructs* the moral reality of the defendant's desert.
  *   **The Implication:** If the procedure is followed, the defendant *deserves* the penalty by definition. Therefore, the risk of executing the factually innocent is categorized not as a moral failure of retribution, but as a statistical inevitability of human systems (a "tragic cost").

  **B. The Definition of Impartiality as Compliance (The Civic Commitment)**
  In *Wainwright v. Witt* (1985), the Supreme Court established that a juror can be excluded if their views would "prevent or substantially impair the performance of their duties."
  *   **The Presupposition:** The law is a sovereign command, not a subject of deliberation for the jury. Moral opposition to the law is functionally equivalent to bias because it threatens the sovereign's ability to execute its will.
  *   **The Asymmetry:** Favoring the death penalty is viewed as "willingness to apply the law." Opposing it is viewed as "refusal to apply the law." This presupposes that the default state of the citizen is obedience, and that moral enthusiasm for state violence is neutral, while moral scruple against it is deviant.

  **C. Institutional Consequentialism (The Risk Commitment)**
  While the rhetoric is retributive ("they deserve death"), the risk management is utilitarian.
  *   **The Presupposition:** The social good of maintaining a punitive hierarchy (deterrence, closure for victims, expression of societal condemnation) outweighs the disvalue of occasional erroneous executions.
  *   **The Implication:** The appellate system focuses on procedure because procedure is controllable; factual innocence is often unknowable. By limiting review to procedure, the system prioritizes *finality* over *accuracy*, assuming that an endless quest for factual certainty undermines the deterrent value of the punishment.

  ### 2. Strict Needs vs. Good Fits

  To understand where the system is vulnerable, we must distinguish what it *requires* to function versus what merely *supports* it.

  | **Strictly Necessary (The Load-Bearing Walls)** | **Contingent Fits (The Decor)** |
  | :--- | :--- |
  | **Finality over Accuracy:** The system *must* presume that at some point, the truth-seeking process ends. If factual innocence could always be litigated, the death penalty could never be carried out. | **Retributive Language:** The system does not strictly need "desert." It could function purely on incapacitation or deterrence. Retribution is used to make the error risk palatable, but Utilitarianism justifies the risk itself. |
  | **Sovereign Definition of Bias:** The state *must* define inability to kill as a disqualification. If moral scruple were treated as a valid perspective, the pool of eligible jurors would vanish in many jurisdictions. | **The "Beyond Reasonable Doubt" Standard:** The system fits well with this standard, but it doesn't strictly need it. It could demand "clear and convincing" or "absolute certainty." The current standard is a compromise that allows the system to move. |
  | **Procedure as Proxy:** The system *must* treat procedural correctness as sufficient for moral legitimacy. Without this, every execution would require metaphysical certainty of guilt. | **Jury Sentencing:** Having juries decide the penalty fits the democratic ethos, but judge-only sentencing (as in most of the world) would solve the "death qualification" bias problem while maintaining the outcome. |

  ### 3. The Counterfactual: Symmetry and Near-Certainty

  If we replaced the implicit view with one that treated moral disagreement symmetrically and treated irreversible harm as requiring near-certainty, the institutional changes would be radical.

  **A. Jury Selection (Symmetric Moral Neutrality)**
  *   **Current:** Strike jurors who cannot vote for death.
  *   **Reform:** Strike jurors who *cannot vote against death* as well as those who *cannot vote for death*.
  *   **Result:** This creates a "nullification jury." You would only seat jurors who view the penalty as morally permissible but not morally required.
  *   **Institutional Impact:** This would likely result in hung juries on penalty phases far more often. To resolve this, the system would likely have to move to **judge-only sentencing** for capital cases, removing the "community conscience" element entirely to ensure the moral symmetry doesn't paralyze the process.

  **B. Appellate Review (Epistemic Humility)**
  *   **Current:** *Herrera v. Collins* (1993) suggests a claim of actual innocence is not itself grounds for federal habeas relief unless there was a constitutional violation in the process.
  *   **Reform:** Establish a **Freestanding Innocence Claim**. If new evidence suggests factual innocence, the conviction is voided regardless of procedural perfection.
  *   **Result:** The "finality" interest collapses. Cases would remain open indefinitely as new forensic technology emerges.
  *   **Institutional Impact:** To manage this without infinite litigation, the state would have to invest massively in **pre-trial epistemic rigor** (e.g., mandatory forensic testing, higher burden of proof for capital cases, perhaps "no doubt" instead of "reasonable doubt"). Practically, this functions as a moratorium: if the standard is near-certainty, the number of eligible cases drops to near zero.

  ### 4. Is There a Coherent View Licensing the Current Practice?

  You asked if there is a coherent view that licenses both the current practice (asymmetry + procedural focus) and the usual moral justifications (retribution + safety).

  **Yes, but it requires a specific inversion of moral logic.**

  The coherent view is **Institutional Retributivism.**

  *   **Standard Retributivism:** The state punishes *because* the offender deserves it. (Guilt precedes Punishment).
  *   **Institutional Retributivism:** The offender deserves it *because* the state has punished them (according to rules). (Verdict constitutes Desert).

  **How it achieves coherence:**
  1.  **Moral Knowledge:** It presupposes that moral knowledge about punishment is not discovered by individuals (jurors) but is *enacted* by the institution. Therefore, a juror who claims to "know" execution is wrong is claiming a private moral authority that supersedes the public institution. That is defined as bias. A juror who supports execution is aligning with public authority, which is defined as neutrality.
  2.  **Error Tolerance:** It accepts that the institution is fallible. However, it argues that *withdrawing* the punishment due to fear of error undermines the moral expression of the law more than the error itself does. The "statement" of the law must be absolute, even if the application is occasionally flawed.
  3.  **The Trade-off:** It argues that a system that prioritizes absolute factual certainty over finality ceases to be a system of *justice* and becomes a system of *inquiry*. Since the purpose of a trial is to resolve conflict, not just find truth, procedural closure is a higher good than ontological precision.

  **The Weak Point:**
  This coherence holds only if you accept the **Legitimacy Premise**: that the state has the moral authority to define desert procedurally. If you reject that premise (i.e., if you believe desert is an ontological fact independent of the court's ruling), the system collapses into incoherence. It claims to be giving people what they *deserve*, while admitting it does not know if they *did it*.

  **Summary:**
  The current practice is not an accident; it is the operational output of a philosophy that prioritizes **Sovereign Finality** over **Epistemic Certainty** and defines **Civic Duty** as compliance rather than conscience. To change the practice, you cannot just tweak the rules; you must shift the definition of guilt from a legal status to a factual claim, which would likely render the death penalty administratively impossible to carry out.
