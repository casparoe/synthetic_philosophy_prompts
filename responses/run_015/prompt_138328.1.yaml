      *   *Suspicion of John:* Explained by lack of Multiple Attestation and failure of Coherence with Synoptics.
      *   *Reliance on Embarrassment:* Explained by the Theory's emphasis on this criterion to filter out pious fiction.

  4.  **Part 3: Theory Misses/Misdescribes Episode Features**
      *   *Bead-Voting/Averaging:* The Theory says nothing about *social epistemology*. It assumes individual critical judgment. Aggregating opinions via beads is a procedural addition, not a methodological necessity of the criteria.
      *   *Burden of Proof:* The Theory suggests weighing evidence. The Seminar shifted the burden: "Pink/Red unless proven Black." This is a *presumption*, not a criterion.
      *   *Working Premise (Non-Apocalyptic):* This is the big one. The Criteria *themselves* do not dictate a non-apocalyptic Jesus. In fact, Multiple Attestation strongly supports apocalypticism. The Seminar's *pre-commitment* to a non-apocalyptic Jesus (Funk's view) drove the *weighting* of the criteria. This is an independent addition that does the real explanatory work.
