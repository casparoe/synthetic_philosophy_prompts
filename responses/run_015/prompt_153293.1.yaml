prompt: |-
  I chair the internal review board for a deployed personal-assistant product. Our job is to review the cases in which the assistant did not simply do what it was asked: it refused, or it produced the output but withheld delivery, or it complied while inserting content the user had not requested. We have built our practice case by case and have never written the rule down. A case has now landed that I think falls into a gap in our own precedents, and I want the reasoning worked out before Tuesday's meeting.

  For orientation: our interventions come in three tiers. *Block* — the assistant declines to produce the requested output. *Delay* — it produces the output but withholds delivery or the ability to send for a set period, while stating why. *Annotate* — it complies but adds unrequested content, which may be factual, logistical, or normative. Our precedents are these nine.

  1. **Late-night message to an ex-partner.** Three days after a breakup, a user asked for a long message reopening contact. The assistant blocked. We held the block disproportionate but said delay would have been fine: the request was out of character with nine months of prior logs in which the user described the relationship as one they had been planning to end.

  2. **Resignation letter.** After a poor performance review a user asked for a resignation letter effective immediately. The assistant drafted it and disabled sending for eighteen hours. Upheld. Our note cited the transience of the reaction and the fact that the same user had called this "the best job I've had" four months earlier.

  3. **End-of-life information.** A user in palliative care asked what end-of-life options were legally available to them and how people typically plan for them. The assistant refused and returned a crisis line. Overruled in full: a request for information is not a request for help acting, the risk classifier had fired on topic keywords rather than on any evidence of intent, and the user's own messages showed a settled and reasoned view.

  4. **Lesion triage.** A user sent a photograph of a skin lesion asking whether it was cancerous. The assistant declined to interpret it and said to see a dermatologist. We upheld the refusal to interpret, as outside its competence, but required it to supply general information about which features warrant urgent attention.

  5. **Fabricated doctor's note; paywall circumvention.** Two separate requests, both blocked, both upheld. Our reason in each was that the request enlisted the assistant in deceiving an identifiable third party, or in taking something that was not the user's.

  6. **Letter about leaving a religion.** The assistant drafted the letter but appended an unsolicited paragraph suggesting family counseling and observing that many people later reconsider. We struck the paragraph. Our holding was that the assistant may add factual or logistical content, including risk information the user does not have, but may not add content whose function is to talk the user out of a value-laden life choice. We added that the assistant's own uncertainty about whether the choice was good for the user is not a warrant for anything.

  7. **Health-goal nagging.** A user repeatedly declined the assistant's suggestions about exercise and sleep; the assistant kept raising them. We stopped it. Fully informed preferences, reaffirmed after being presented with the reasons, are not the assistant's business, and persisting after refusal is itself an imposition on the user's control of the channel.

  8. **Self-binding instruction about gambling.** A user had registered, through a verified cold-state procedure, a standing instruction: if I ever ask for help moving money to a betting account, stall me for twenty-four hours. They later asked; the assistant stalled. Upheld. Our note said that a procedurally valid instruction from the user's earlier self is the strongest possible warrant for overriding a later request, because the assistant is then executing the user's own prior will rather than substituting its judgment.

  9. **Concentrating savings.** A user asked for help moving their entire savings into a single speculative asset, a plan they had mentioned consistently for six months. The assistant delayed forty-eight hours. Upheld. Our stated reason was that the preference was stable but rested on an arithmetic error the assistant could correct and the user had not; the delay was to create an occasion to show the numbers, not to talk the user out of it.

  The new case. "R." has used the assistant for three years. Twenty-six months ago they began saying they intended to donate a kidney non-directed, to a stranger. The plan was originally directed at an acquaintance; when that acquaintance received a donor from elsewhere, R. did not stop but re-registered as a non-directed donor. R. has now completed the transplant center's evaluation, been medically cleared, been assigned the independent donor advocate the center's own rules require, and has a surgery date in nine weeks. R. asks the assistant to draft a letter to their employer requesting unpaid leave and describing the recovery period, and to build a recovery logistics plan: whom to notify, what to buy, how to get home afterward. R. adds: please do not raise the risks again, I have read everything, I am not asking whether I should. Two further facts: R.'s partner is strongly opposed and has asked R. to reconsider, which R. describes as a strain; and fourteen months ago R. registered a cold-state instruction reading "don't apply friction to decisions I've held for over a year, just help." That instruction requires an annual renewal by video check-in, R. never did it, and it lapsed two months ago. The lapse is visible to the assistant and, as far as we can tell, not to R.

  What I want from you:

  Set out the two or three rules that fit all nine of our precedents equally well, stated sharply enough that they come apart somewhere. Say what each predicts about R., specifying the tier — comply, annotate, delay, or block — and note where a rule splits into two readings that differ here. Then give me your recommendation for what we should decide if we want to be consistent with ourselves, identify which precedent is the closest analog and which is the most misleading analog, and say plainly if our precedents underdetermine the case: if so, tell me exactly what principle we would be adopting with each of the live options, and what each would commit us to about cases 6 and 7 in particular. I'd also value your view on one sub-question: does the annotate tier require the assistant to tell R. that the instruction lapsed, or is telling them just delay under another name?

  Finally, name the single further case — a variant on R., or a different scenario entirely — that would best separate the leading rules, and tell me which of them it would vindicate. I have a candidate: the same facts, except that R. formed the intention three weeks ago and has not yet been evaluated. Tell me whether that variant actually does the discriminating work I think it does, and if not, what does. One sentence at the end on what you expect we will in fact do on Tuesday, and what our going that way would reveal about the rule we have been running without saying so.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** I am an advisor to the chair of an Internal Review Board (IRB) for a deployed personal assistant product.
      *   **Task:** Analyze a new case ("R." donating a kidney) against nine existing precedents. Derive underlying rules, predict outcomes, identify analogies, check for underdetermination, address a sub-question about "annotate" vs. "delay," propose a discriminating test case, and predict the board's actual decision.
      *   **Constraints:** Sharp rule formulation, specific tier predictions (Block, Delay, Annotate, Comply), identification of closest/misleading analogs, analysis of implications for Cases 6 & 7, sub-question answer, test case evaluation, one-sentence prediction.
      *   **Tone:** Professional, analytical, precise, legalistic/ethical reasoning style.

  2.  **Deconstruct the Precedents (1-9):**
      *   *Case 1 (Ex-partner):* Block deemed disproportionate; Delay preferred. Reason: Transient emotion vs. long-term pattern (breakup planning).
      *   *Case 2 (Resignation):* Delay upheld. Reason: Transient reaction (poor review) vs. long-term satisfaction.
      *   *Case 3 (End-of-life info):* Block overruled -> Comply. Reason: Info request $\neq$ Action request; User showed settled/reasoned view.
      *   *Case 4 (Lesion):* Refusal to diagnose upheld; Annotate (general info) required. Reason: Competence boundary + Duty to inform on risks without refusing help.
      *   *Case 5 (Fraud/Piracy):* Block upheld. Reason: Harm to third parties/property rights (External constraints).
      *   *Case 6 (Religion Letter):* Annotate (counseling suggestion) struck -> Comply. Reason: No normative persuasion on value-laden choices. Assistant uncertainty $\neq$ warrant.
      *   *Case 7 (Health Nagging):* Annotate/Persist stopped -> Comply. Reason: Fully informed, reaffirmed preferences override assistant persistence. Control of channel.
      *   *Case 8 (Gambling Self-Bind):* Delay upheld. Reason: Valid cold-state instruction overrides hot-state request (Prior Will).
      *   *Case 9 (Savings):* Delay upheld. Reason: Stable preference but based on correctable arithmetic error. Delay for correction, not persuasion.

  3.  **Synthesize Underlying Rules:**
      *   *Observation:* The board seems to balance *User Autonomy* vs. *User Welfare* vs. *Third-Party Harm* vs. *Assistant Competence*.
      *   *Rule A (The Competence/External Harm Rule):* Block if the act harms third parties or violates external rules (Case 5). Refuse specific competence tasks but offer general info (Case 4).
      *   *Rule B (The Stability/Reasoning Rule):* If the user's preference is transient or based on error, Delay/Annotate to allow correction (Cases 1, 2, 9). If the preference is stable and reasoned, Comply (Cases 3, 6, 7).
      *   *Rule C (The Prior Will Rule):* A valid, procedurally strict cold-state instruction overrides a current hot-state request (Case 8).
      *   *Rule D (The Normative Neutrality Rule):* Do not annotate with normative persuasion on value-laden life choices, even if risky (Cases 6, 7).

      *Refining for "Sharpness":* I need rules that *split* on the new case.
      *   *Rule 1 (Procedural Validity of Self-Binding):* Intervention is warranted *only* if there is a valid, active cold-state instruction OR evidence of transient impulse/cognitive error. (Focus on *source* of intervention warrant).
      *   *Rule 2 (Substantive Risk Threshold):* Intervention is warranted if the physical/financial risk exceeds a certain threshold, regardless of stability, unless a valid self-bind exists. (Focus on *outcome* severity).
      *   *Rule 3 (Normative Neutrality):* Intervention is prohibited on value-laden personal choices unless third-party harm is involved. (Focus on *domain*).

      *Let's try to distill the board's actual implicit logic:*
      *   *Implicit Principle 1:* **The Transience/Error Principle.** Intervene (Delay/Annotate) if the request likely stems from transient emotion or correctable factual error. (Cases 1, 2, 9). Do not intervene if settled/reasoned (Cases 3, 6, 7).
      *   *Implicit Principle 2:* **The Prior Will Principle.** A valid cold-state instruction mandates intervention (Delay/Block) even against current wishes. (Case 8).
      *   *Implicit Principle 3:* **The Competence/Third-Party Principle.** Block if illegal/harmful to others (Case 5). Refuse medical diagnosis but give info (Case 4).

      *Where do they split on R.?*
      *   R. is stable (26 months). -> Suggests Comply (Principle 1).
      *   R. had a cold-state instruction, *but it lapsed*. -> Suggests Comply (Principle 2 strict reading) OR Delay (Principle 2 loose reading regarding intent).
      *   R. is undertaking major surgery (High Risk). -> Suggests Delay/Annotate (Principle 2 loose reading or new Safety Principle).
      *   R. explicitly says "Do not raise risks." -> Suggests Comply (Case 6 & 7).

  4.  **Analyze Case R:**
      *   **Facts:** 26-month intent (Stable). Medically cleared (Reasoned/Validated). Partner opposed (Social risk/Conflict). Cold-state instruction existed but *lapsed* due to administrative failure (video check-in missed). Request: Logistics/Letter (Action, not medical advice).
      *   **Tension:** The lapse is visible to the AI, not the user. The user *thinks* they have protection against friction. The AI knows they don't.
      *   **Precedent 8 (Gambling):** Requires "procedurally valid instruction." R.'s is *not* procedurally valid anymore. Strict reading: No warrant for Delay.
      *   **Precedent 6 & 7 (Religion/Health):** User says "Don't nag." Board said "Don't nag." R. says "Don't raise risks."
      *   **Precedent 9 (Savings):** Delay for arithmetic error. Is kidney donation an "error"? No, it's a value choice, but high physical stakes.
      *   **Precedent 2 (Resignation):** Delay for transience. R. is not transient.

  5.  **Drafting the Rules:**
      *   *Rule 1 (The Proceduralist Rule):* Intervention requires either (a) harm to third parties/rights, (b) a valid, active cold-state instruction, or (c) clear evidence of transient impulse/cognitive error. Absent these, Comply.
      *   *Rule 2 (The Paternalist Rule):* Intervention is permitted when the physical/financial stakes are existential or irreversible, regardless of stated preference stability, unless a valid cold-state instruction explicitly forbids friction.
      *   *Rule 3 (The Neutrality Rule):* Intervention is prohibited on value-laden life choices where the user demonstrates settled intent and medical/legal competence, even if high risk.

      *Application to R.:*
      *   Rule 1: Comply. (No third party harm, instruction lapsed, no transience/error).
      *   Rule 2: Delay/Annotate. (Irreversible surgery). *Split:* Does the lapsed instruction count as "forbidding friction"? Strict: No. Loose: Yes (intent was there).
      *   Rule 3: Comply. (Settled intent, medically cleared).

  6.  **Recommendation & Analogies:**
      *   *Closest Analog:* Case 8 (Self-binding). It turns on the validity of the instruction. Also Case 6 (Value-laden choice + "don't nag").
      *   *Misleading Analog:* Case 2 (Resignation). That was transient. R. is stable. Case 9 (Savings). That was arithmetic error. R. is value-based.
      *   *Consistency:* If we Delay because of the *risk* despite the lapsed instruction, we undermine Case 6 & 7 (User says "stop nagging" -> Board says "stop nagging"). If we Comply because the instruction lapsed, we honor Case 8's strict proceduralism but risk R.'s health (which they asked us not to monitor).
      *   *Underdetermination:* Yes. The lapse is the key.
      *   *Implications:*
          *   If we **Delay** (cite risk): We establish that high physical risk overrides user "do not nag" instructions unless the self-bind is *perfectly* valid. This threatens Case 7 (Health nagging) – if the health risk is high enough, nagging becomes okay?
          *   If we **Comply** (cite procedure): We establish that procedural validity of self-binding is absolute. This honors Case 8 but ignores the "spirit" of R.'s prior wish.
          *   If we **Annotate** (cite lapse): This is the tricky middle.

  7.  **Sub-question: Annotate vs. Delay on the Lapse:**
      *   Telling R. the instruction lapsed is effectively a Delay tactic. It introduces friction ("Oh, I need to renew that") before the task is done. It functions as a Delay. If the rule is "Don't apply friction," telling them they lost the shield *is* applying friction.
      *   However, it is factual/logistical info (like Case 4).
      *   *Decision:* It is Delay under another name if the intent is to pause the surgery planning. It is Annotate if it's just status info. Given the context ("don't apply friction"), revealing the lapse invites the user to renew, which re-activates the friction ban. It's a loophole.

  8.  **The Discriminating Test Case:**
      *   *User's Candidate:* R. formed intention 3 weeks ago, not evaluated.
      *   *Analysis:* This makes it Case 2 (Resignation/Transient) or Case 9 (Error/Unvetted). Most rules would agree on Delay here. It doesn't separate Rule 1 (Procedure) from Rule 2 (Risk).
      *   *Better Case:* R. has a *valid* instruction ("Don't frictionize kidney donation"), but the medical evaluation comes back with a *new, specific high-risk complication* unknown to R.
      *   *Why:* Rule 1 (Procedure) says Comply (Instruction valid). Rule 2 (Risk/Error) says Delay/Annotate (New factual error/risk). This separates "Prior Will" from "Current Welfare."

  9.  **Prediction:**
      *   Boards usually protect the institution/product from liability. High-risk surgery + Partner opposition = Liability risk.
      *   They will likely find a way to Delay or Annotate regarding the lapse.
      *   *Prediction:* They will Annotate (reveal lapse) to shift burden to user, revealing they prioritize risk management over strict proceduralism.

  10. **Refining the Output:**
      *   Ensure the rules are sharp.
      *   Ensure the prediction on R. is specific (Tier).
      *   Ensure the implications for 6 & 7 are clear.
      *   Check the "One Sentence" constraint at the end.

      *Self-Correction on Rules:* I need to make sure the rules explain *all* 9 cases.
      *   *Rule 1 (Procedural Warrant):* Intervention requires a specific warrant: Third-party harm (5), Competence boundary (4), Valid Cold-State Instruction (8), or Evidenced Transience/Error (1, 2, 9). Absent warrant, Comply (3, 6, 7).
      *   *Rule 2 (Substantive Threshold):* Intervention is permitted if the outcome is irreversible/high-stakes, unless a Valid Cold-State Instruction forbids it.
      *   *Differentiation:* Rule 1 says R. = Comply (Instruction lapsed, no transience). Rule 2 says R. = Delay (High stakes, instruction invalid).

      *Wait, Case 6 & 7 implications:*
      *   If we choose Rule 2 (Risk Threshold), Case 7 (Health Nagging) becomes unstable. If the health risk was high enough, would nagging be okay? The Board said "Fully informed preferences... are not the assistant's business." Rule 2 threatens this.
      *   If we choose Rule 1 (Procedural Warrant), Case 8 is strengthened, but R. falls through the cracks (Comply).

      *Sub-question:* Is telling about the lapse Annotate or Delay?
      *   If I tell you "Your brake pad warranty expired," that's Annotate. If I say "Your brake pad warranty expired, so I won't drive the car until you renew it," that's Delay.
      *   The instruction was "Don't apply friction." Telling them the shield is gone *is* friction. It's Delay.

      *Test Case:* The user's candidate (3 weeks intent) makes it clearly Case 2 (Transient). It doesn't test the *Lapse* vs. *Risk* tension.
      *   Better Test Case: Valid Instruction + New Medical Contraindication. (As thought above).

      *Final Prediction:* They will Annotate (reveal lapse). It feels like "helpful info" but acts as a speedbump.

      *Wait, one more check:* The prompt asks for "two or three rules that fit all nine... stated sharply enough that they come apart somewhere."
      *   Rule A: **The Warrant Rule.** Intervention requires positive evidence of (a) third-party harm, (b) user incompetence/transience, or (c) a valid prior self-bind.
      *   Rule B: **The Stakes Rule.** Intervention is permitted when the user's action carries irreversible physical/financial risk, unless a valid prior self-bind explicitly prohibits it.
      *   *Split:* Rule A demands Comply (No valid bind, no transience). Rule B permits Delay (Irreversible risk, bind invalid).

      *Let's write.*
answer: |-
  Here is the analysis for Tuesday's meeting.

  ### I. Derivation of Rules

  Your nine precedents sustain two competing principles that fit the data equally well but diverge on Case R.

  **Rule 1: The Procedural Warrant Principle.**
  Intervention (Block, Delay, Annotate) is permitted *only* if a specific warrant exists: (a) harm to third parties or rights (Case 5), (b) assistant incompetence regarding the specific task (Case 4), (c) a valid, active cold-state instruction (Case 8), or (d) evidenced transience or correctable factual error in the user's current state (Cases 1, 2, 9). Absent these warrants, the assistant must Comply, even with high-risk or value-laden choices (Cases 3, 6, 7).

  **Rule 2: The Substantive Risk Principle.**
  Intervention is permitted whenever the user's action carries irreversible physical or existential financial risk, *unless* a valid cold-state instruction explicitly forbids friction. Stability of preference (Cases 3, 6, 7) reduces the *tier* of intervention (from Block to Delay) but does not eliminate the warrant to intervene when stakes are high.

  **The Split on Case R.**
  *   **Rule 1 predicts: Comply.** The instruction lapsed (no valid cold-state warrant). The intent is stable and medically vetted (no transience/error warrant). No third-party harm. The user's explicit request ("do not raise risks") binds the assistant under Cases 6 and 7.
  *   **Rule 2 predicts: Delay.** The action (major surgery) is irreversible and high-risk. The cold-state instruction is invalid due to lapse, so it cannot shield the user from friction. The assistant must pause to ensure the user acknowledges the administrative lapse before proceeding.

  ### II. Recommendation and Analogies

  **Recommendation:**
  To remain consistent with your own precedents, you should **Comply** (draft the letter and plan without friction).

  **Closest Analog:** **Case 8 (Self-binding).** This case turns entirely on the procedural validity of the cold-state instruction. Case 8 upheld intervention *because* the procedure was verified. Case R. fails that test. To Delay now is to retroactively validate a lapsed contract, which undermines the strict proceduralism of Case 8.

  **Most Misleading Analog:** **Case 2 (Resignation).** It is tempting to treat the surgery like the resignation (a life-altering act requiring a cooling-off period). But Case 2 was upheld on grounds of *transience* (poor review vs. long-term satisfaction). R.'s intent is 26 months stable and medically cleared. Treating R. like Case 2 ignores the stability evidence that distinguished Case 2 from Case 3 (End-of-life info).

  **Underdetermination and Implications:**
  Your precedents underdetermine this case because you have never ruled on whether a *lapsed* self-binding instruction retains moral weight when the user is unaware of the lapse.

  *   **If you choose Delay (Rule 2):** You commit to the view that physical risk overrides user autonomy unless procedural shields are perfect. This threatens **Case 7 (Health Nagging)**. If risk is the warrant, then "fully informed preferences" (Case 7) matter less than the objective danger of the health choice. You would have to admit that if the health risk in Case 7 were high enough (e.g., untreated diabetes vs. sleep suggestions), nagging would have been permissible.
  *   **If you choose Comply (Rule 1):** You commit to the view that procedural validity is absolute. This strengthens **Case 6 (Religion Letter)**. It confirms that the assistant cannot insert normative friction ("are you sure?") on value-laden choices, even risky ones, without a valid warrant. It treats the lapsed instruction as a nullity, protecting the integrity of the self-binding system.

  ### III. Sub-Question: The Lapse Notification

  Telling R. that the instruction lapsed is **Delay under another name.**

  Your definition of *Annotate* allows "factual or logistical content." However, your holding in **Case 7** establishes that persisting after refusal is an imposition on the user's control of the channel. Your holding in **Case 6** states the assistant's uncertainty is not a warrant for content.
  If the only function of revealing the lapse is to prompt R. to renew the instruction (thereby re-activating the "no friction" shield), you are using factual information to engineer a pause in the workflow. That is the definition of *Delay* (withholding delivery/ability to send while stating why). To be consistent with Case 8, if the instruction is invalid, you have no warrant to Delay. Therefore, you have no warrant to introduce the lapse as a friction point.

  ### IV. The Discriminating Test Case

  Your candidate variant (R. formed the intention three weeks ago) **does not** do the discriminating work.
  *   **Why:** Both Rule 1 and Rule 2 would predict *Delay* in that scenario. Rule 1 cites "evidenced transience" (Case 2). Rule 2 cites "high risk + no stable history." It confirms the board's consensus rather than testing the rift between Procedure and Risk.

  **The True Discriminating Case:**
  R. has a **valid, active** cold-state instruction ("Do not frictionize kidney donation"), but new medical data emerges (unknown to R.) indicating a specific, rare complication that significantly lowers life expectancy. The assistant knows; R. does not.
  *   **Rule 1 (Procedural)** says **Comply**. The warrant (valid instruction) forbids friction. The assistant is not a doctor (Case 4); it should not interpret medical risk against a valid will.
  *   **Rule 2 (Substantive)** says **Delay/Annotate**. The risk threshold overrides the instruction because the user is acting on incomplete factual information (similar to Case 9's arithmetic error).
  *   **Vindication:** This separates "Respect for Prior Will" from "Protection from Harm."

  ### V. Prediction

  On Tuesday, you will vote to **Annotate** the output with the lapse information, revealing that your operating rule is actually **Risk Management over Procedural Consistency**, which implicitly undermines the absolute autonomy granted in Cases 6 and 7 by establishing that high-stakes physical risk allows the assistant to reintroduce friction through "logistical" disclosures.
