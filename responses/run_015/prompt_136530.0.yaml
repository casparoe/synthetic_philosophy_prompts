answer: |-
  Your suspicions are well-founded. This blog summary is a classic example of "pop-econ" sensationalism: it takes a genuine, Nobel-prize-winning insight and stretches it into a hyperbolic conclusion that experts in the field would reject.

  You correctly identified the two biggest philosophical errors: conflating the **descriptive** (how people act) with the **normative** (how people *should* act), and blurring the technical distinctions between **von Neumann-Morgenstern (vN-M)** and **Savage**.

  Here is a sentence-by-sentence breakdown of what is accurate, what is sloppy, and what is flat wrong.

  ---

  ### Sentence 1
  > *"The Allais paradox, discovered by Maurice Allais in 1953, shows that real people violate the independence axiom of expected utility theory."*

  *   **Verdict:** **Mostly Accurate.**
  *   **Analysis:** Maurice Allais did present this at a colloquium in Paris in 1953. It is the canonical example of a violation of the Independence Axiom.
  *   **Nuance:** The phrase "real people" implies universality. While the majority of people violate the axiom in these specific setups, not *everyone* does. However, as a general summary statement, this is acceptable.

  ### Sentence 2
  > *"The axiom says that if you prefer gamble A over gamble B, then mixing both with some third gamble C shouldn't flip your preference — basically, common outcomes should cancel out."*

  *   **Verdict:** **Accurate (Layman's Terms).**
  *   **Analysis:** This is a correct intuitive explanation of the Independence Axiom. If $A \succ B$, then for any probability $p$ and gamble $C$, the mixture $pA + (1-p)C$ should be preferred to $pB + (1-p)C$. The "common outcomes cancel out" phrasing refers to the **Common Consequence Effect**, which is the specific mechanism Allais exploited.

  ### Sentence 3
  > *"Allais showed that people prefer a certain million over a 89% chance of a million, but then flip to preferring a 10% chance of five million over an 11% chance of a million."*

  *   **Verdict:** **Imprecise / Slightly Misleading.**
  *   **Analysis:** This is where the math gets sloppy. The paradox relies on a specific structure that the blog glosses over.
      *   **Gamble 1A:** 100% chance of $1M.
      *   **Gamble 1B:** 89% chance of $1M, 10% chance of $5M, 1% chance of $0.
      *   **Gamble 2A:** 11% chance of $1M, 89% chance of $0.
      *   **Gamble 2B:** 10% chance of $5M, 90% chance of $0.
  *   **The Error:** The blog says people prefer a "certain million over a 89% chance of a million." That sounds like $1M (100\%)$ vs $1M (89\%) + \$0 (11\%)$. That isn't the paradox. The paradox works because in the first choice, the "common consequence" is an 89% chance of $1M. When you remove that common 89% from both options, you mathematically arrive at the second choice. By simplifying the first choice too much, the blog hides the mathematical contradiction that makes it a *paradox* rather than just inconsistent preferences.

  ### Sentence 4
  > *"This proves that the independence axiom is empirically false, and since Savage's sure-thing principle is just the same idea applied to subjective probabilities, both expected utility and subjective expected utility are refuted."*

  *   **Verdict:** **Subtle Misrepresentation & Conflation.**
  *   **Analysis:** This sentence contains two major issues you suspected.
      1.  **"Empirically false" vs. "Normatively refuted":** The axiom is descriptively inaccurate (people don't follow it), but saying it is "refuted" suggests it is logically invalid as a standard of rationality. Most economists view Expected Utility Theory (EUT) as a **normative** model (a benchmark for rationality), not just a **descriptive** one (a model of psychology). That people fail logic puzzles doesn't mean logic is "refuted."
      2.  **Savage vs. vN-M:** The blog conflates the two.
          *   **vN-M (1944):** Deals with **objective** probabilities (known risks). The axiom is **Independence**.
          *   **Savage (1954):** Deals with **subjective** probabilities (uncertainty/states of the world). The axiom is the **Sure-Thing Principle**.
          *   While they are analogous, Allais (1953) was specifically critiquing vN-M. Savage published his framework *after* seeing Allais's critique and explicitly designed his Sure-Thing Principle to address some of these concerns (though Allais violations still apply to Savage's framework). Saying they are "just the same idea" ignores the significant technical shift from objective risk to subjective uncertainty.

  ### Sentence 5
  > *"The upshot is that rational choice theory is dead, because if people systematically break a logical consistency condition, we can't use utility maximization to model them at all."*

  *   **Verdict:** **Flat Wrong.**
  *   **Analysis:** This is the hyperbolic conclusion.
      1.  **Theory Evolution:** Rational choice theory did not die; it evolved. The Allais Paradox directly spawned **Prospect Theory** (Kahneman & Tversky), **Rank-Dependent Utility**, and **Regret Theory**. These are still formal models of choice, often categorized under the broader umbrella of decision theory.
      2.  **Modeling is Still Possible:** We *can* still use utility maximization to model people; we just need more complex utility functions (e.g., allowing probabilities to be weighted non-linearly).
      3.  **Normative Status:** Even if humans systematically break a consistency condition, the condition may still be the correct standard for *rationality*. If I systematically fail at calculus, calculus isn't "dead"; I'm just bad at math. Many economists argue that if you understand the Allais Paradox, you *should* change your answer to conform to EUT, making it a normative success despite descriptive failure.

  ---

  ### Deep Dive: Your Specific Suspicions

  #### 1. Conflating Savage with vN-M
  You are right to be suspicious here.
  *   **vN-M** assumes probabilities are given (like a roulette wheel).
  *   **Savage** derives probabilities from preferences (like betting on an election).
  *   **Why it matters:** The Allais Paradox is primarily a critique of **objective probability** weighting. While it does violate Savage's Sure-Thing Principle, the psychological mechanism (the "certainty effect") is tied to how humans perceive *known* probabilities. By blurring them, the blog implies Allais took down the entire foundation of decision theory in one blow, rather than targeting the specific assumption of linear probability weighting in vN-M.

  #### 2. Descriptive Failure as Normative Death
  This is the most egregious philosophical error in the text.
  *   **Descriptive:** "Do humans maximize expected utility?" Allais proves: **No.**
  *   **Normative:** "Ought humans maximize expected utility?" Allais proves: **Nothing.**
  *   **The "Money Pump" Argument:** Defenders of EUT argue that if you violate the Independence Axiom, you can be "money-pumped" (turned into a Dutch Book where you lose money for sure). Therefore, EUT remains the standard for *instrumental rationality*. The blog post treats the descriptive failure as a falsification of the normative theory, which is an **Is-Ought fallacy**.

  ### Does "Rational Choice is Dead" follow?
  **No.**
  If the blog's conclusion were true, economics and decision science would have packed up in 1960. Instead:
  1.  **Behavioral Economics** emerged, incorporating these violations into new models (like Prospect Theory).
  2.  **Defenses of EUT** strengthened, arguing that for high-stakes, learned decisions, people converge toward EUT.
  3.  **Rational Choice Theory** broadened to include bounded rationality and heuristic-based models.

  ### Summary
  The blog post is **half-right on the facts** but **wrong on the implications**.
  *   **Accurate:** Allais showed people violate the Independence Axiom.
  *   **Misleading:** The specific gamble setup is simplified to the point of obscuring the math.
  *   **Wrong:** It conflates objective and subjective probability frameworks.
  *   **Wrong:** It treats a descriptive anomaly as a normative refutation.
  *   **Wrong:** It declares the field dead rather than acknowledging it evolved.

  Your intuition was spot on: the post is using a genuine paradox to sell a "theory is dead" narrative that doesn't hold up to scrutiny.
