answer: |-
  # DECISION TREE: DIAGNOSTIC HANDOUT ON CAUSATION
  **For:** Retired Field Ecologists Reading Group
  **Subject:** Mapping Causal Theories via Diagnostic Cases
  **Constraint:** Start from the assumption that *A made a difference to B*.

  ---

  ### NODE 1: The Unit of Analysis
  **Question:** Are you analyzing a **single, specific historical occurrence** (e.g., *this* lightning strike caused *this* fire), or a **general relationship between variables** (e.g., lightning causes fires)?
  *   **Specific Occurrence (Token):** Go to Node 2.
  *   **General Relationship (Type):** Go to Node 6.

  ---

  ### NODE 2: The Physical Link (Token Branch)
  **Question:** For A to cause B, must there be a spatio-temporally continuous physical process connecting them (e.g., transfer of energy, momentum, or information)?
  *   **Yes:** **LEAF 1: Process/Mechanistic Theory.** (You view causation as the physical "glue" or pipeline between events. Note: This position struggles to find a "physical link" for omissions).
  *   **No:** Go to Node 3.

  ---

  ### NODE 3: Redundant Backup Causes (Token Branch)
  **Question:** Suppose a backup cause (C) was ready to produce B if A hadn't, but A fired first and produced B. In this specific case, did A cause B?
  *   **Uncertain/Depends:** Go to Node 4.
  *   **Definitely No (because B would have happened anyway):** **LEAF 2: Simple Counterfactual Dependence.** (You hold that causation is strictly about dependence. If B doesn't depend on A, A isn't the cause. Note: This view is widely considered vulnerable to "preemption" cases).
  *   **Definitely Yes:** Go to Node 5.

  *(Note: If you answered "Definitely Yes" here, you have already rejected Simple Counterfactual Dependence. Proceed to Node 5 to refine your position.)*

  ---

  ### NODE 4: Resolving Preemption (Token Branch)
  **Question:** In the backup case above, is A the cause because it *actually fired* (the actual sequence), or because of a refined counterfactual test (e.g., "if A hadn't fired *and* C was disabled")?
  *   **Actual Sequence:** **LEAF 3: De Facto/Primitivist Dependence.** (You prioritize the actual history over counterfactual scenarios. This avoids the backup problem but risks making causation a brute fact).
  *   **Refined Counterfactual:** Go to Node 5.

  ---

  ### NODE 5: Causation by Omission (Token Branch)
  **Question:** If the gardener fails to water the plant (A) and it dies (B), did the gardener's *inaction* cause the death?
  *   **No (Absences aren't real events):** **LEAF 4: Strict Dependence Theory.** (You require a positive event for causation. This aligns with some physicalist intuitions but conflicts with legal/moral reasoning).
  *   **Yes (Counterfactuals cover inaction):** **LEAF 5: Lewis-Style Counterfactual Theory.** (You allow that if the gardener *had* watered, the plant would have lived. This captures ordinary language but expands causation to include infinite non-events).

  ---

  ### NODE 6: Exceptionless Regularity (Type Branch)
  **Question:** Is the causal relationship exceptionless (i.e., whenever A occurs, B *must* occur, without exception)?
  *   **Yes:** **LEAF 6: Regularity (Humean) Theory.** (You define causation as constant conjunction. Note: This struggles with accidental regularities, like "night causes day").
  *   **No:** Go to Node 7.

  ---

  ### NODE 7: Probabilistic Raising (Type Branch)
  **Question:** Is it sufficient for causation that A merely raises the probability of B occurring, even if B sometimes happens without A or A sometimes happens without B?
  *   **Yes:** **LEAF 7: Probabilistic Theory.** (You accept indeterminism. Causation is a shift in chance distributions. Note: This can struggle with "probability lowering" causes, like contraceptives causing pregnancy in rare failure cases).
  *   **No:** Go to Node 8.

  ---

  ### NODE 8: Intervention Feasibility (Type Branch)
  **Question:** To say A causes B, must it be **physically possible** for an agent to manipulate A, or is it sufficient that an intervention is **logically conceivable** (even if physically impossible, like manipulating the moon's gravity)?
  *   **Physically Possible:** **LEAF 8: Physical Interventionist Theory.** (You tie causation to experimental practice. If we can't touch it, we can't claim causality. Common in rigorous experimental design).
  *   **Logically Conceivable:** **LEAF 9: Liberal (Modal) Interventionist Theory.** (You tie causation to the structure of the system. If the equation holds under hypothetical manipulation, it is causal, regardless of human capacity).

  ---

  ### DIAGNOSTIC NOTES FOR THE GROUP

  **1. The Unoccupied Combination: Process Theory + Omissions**
  You will notice there is no leaf for "Process Theory that accepts Omissions." This space is effectively unoccupied. Process theorists insist on a physical transfer (energy/matter). An omission (doing nothing) involves no physical transfer. Therefore, one cannot consistently hold that causation *requires* a physical process while also claiming that *failures to act* are causes. You must choose one: either drop the physical requirement (move to Counterfactuals) or drop omissions (move to Strict Dependence).

  **2. Indistinguishable Leaves: Physical vs. Liberal Interventionism**
  In practice, **Leaf 8 (Physical Interventionist)** and **Leaf 9 (Liberal Interventionist)** are often empirically indistinguishable for field scientists. In ecology or biology, almost any variable we care about (temperature, nutrient load, population density) is physically manipulable in principle. The distinction only arises in fundamental physics or cosmology (e.g., "Did the Big Bang cause the CMB?"). For your reading group's purposes, these two positions will yield identical verdicts on almost all case studies, differing only in their metaphysical justification rather than their diagnostic output.

  **3. The Preemption Trap (Node 3 & 4)**
  Be careful at Node 3. If you answer "No" (A did not cause B because of the backup), you land on **Simple Counterfactual Dependence**. Most modern philosophers consider this a "trap" leaf because it yields counter-intuitive results in preemption cases (e.g., two assassins; one shoots, the other would have. The shooter *did* cause the death, even if the victim would have died anyway). If you want to avoid this, you must answer "Yes" at Node 3 and proceed to Node 4 or 5 to refine your counterfactual criteria.

  **4. Token vs. Type Divergence**
  Note that the tree splits completely at Node 1. It is philosophically consistent to be a **Process Theorist** for tokens (specific events need physical links) but an **Interventionist** for types (general laws are about manipulability). Many scientists implicitly hold this pluralist view without realizing the theories are technically incompatible at the metaphysical level.
