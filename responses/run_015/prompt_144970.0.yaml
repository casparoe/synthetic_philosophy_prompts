  # Report on Adversarial Collaboration: Moral Status and the Ethics of Mind

  **To:** The Dimensionalist Party and The Thresholdist Party
  **From:** Rapporteur
  **Date:** October 26, 2023
  **Subject:** Consensus Document and Mapping of Residual Disagreements

  ## 1. Agreed Claims

  The following claims represent the substantive common ground established during the collaboration. Both parties endorse these statements as accurate descriptions of their shared commitments regarding the specified cases and general principles.

  1.  **Necessity of Valence:** Both parties agree that the capacity for phenomenally valenced states (suffering or flourishing) is a necessary condition for moral status. Systems lacking any capacity for valence possess no moral status.
  2.  **The Simple Controller Case:** Both parties agree that a simple negative-feedback controller (e.g., a thermostat) lacks moral status. It possesses neither valence nor a unified perspective.
  3.  **The Deep-Feedback Learner Case:** Both parties agree that the stipulated "deep-feedback learner"—defined as a system with persistent internal variables and avoidance learning but stipulated as implausible as a subject of experience—lacks moral status. While it exhibits structural persistence (temporal grip), it fails the necessary condition of valence.
  4.  **The Flicker Case Attenuation:** Both parties agree that the "flicker case" (a creature whose unified perspective exists only during aversive episodes) possesses strictly less moral significance than a continuous subject experiencing comparable aversive intensity. Both parties agree this case presents distinct ethical challenges compared to standard continuous subjects.
  5.  **Insect Empirical Profile:** Both parties agree that insects exhibit nociception and avoidance learning distinct from simple thermostatic feedback, but lack the behavioral and neurological complexity characteristic of mammals.
  6.  **Normative Ranking of Insects:** Both parties agree that insects warrant less moral consideration than typical adult humans. (The Thresholdist assigns insects zero status; the Dimensionalist assigns low status; both agree $Status_{Insect} < Status_{Human}$).
  7.  **Non-Identity of Dimensions:** Both parties agree that "temporal grip" (persistence of perspective) and "evaluative depth" (resolution of aversive states) are conceptually distinct properties, even if they correlate in nature.

  ## 2. Table of Residual Disagreements

  The following table outlines the remaining disagreements. The wording in each column has been vetted by the respective party to ensure it accurately reflects their position without strawmanning.

  | Topic | Dimensionalist Formulation | Thresholdist Formulation |
  | :--- | :--- | :--- |
  | **Structure of Status** | Moral status is a multi-dimensional vector. A system's standing is determined by its score across valence, temporal grip, and evaluative depth. | Moral status is a binary property conferred by the existence of a unified subject. A system either has a persisting point of view or it does not. |
  | **Additivity** | Moral significance is aggregative. Multiple systems with low status can sum to a moral weight comparable to a single system with high status. | Moral significance is non-additive below the threshold. Arbitrarily many systems lacking a unified subject sum to zero moral weight. |
  | **Insect Status** | Insects possess a non-zero degree of moral status due to measurable scores on valence and temporal grip dimensions, however low. | Insects possess zero moral status because they lack the unified, persisting subject required to be a moral patient. |
  | **Flicker Case Status** | The flicker creature has low but non-zero status during episodes, proportional to its intermittent temporal grip. | The flicker creature has zero status because it lacks a *persisting* point of view; fleeting episodes do not constitute a subject. |
  | **Metaphysical Basis** | "Subjecthood" is a useful shorthand for a specific cluster of functional dimensions, not a further fact. | "Subjecthood" is a further fact about unity that cannot be reduced merely to the sum of functional dimensions. |

  ## 3. Cruxes and Evidentiary Predictions

  The following sub-questions represent the critical pivot points of the dispute. Settling these empirically or conceptually would necessitate a significant update in at least one party's position.

  ### Crux 1: The Integration Threshold
  **Question:** Is there a specific level of information integration or functional unity below which no subject exists, or does subjecthood fade gradually as integration decreases?

  *   **Agreed Bearing Evidence:** Comparative neurobiology of split-brain patients versus gradual corpus callosum degradation, or synthetic scaling of integration in neural nets.
  *   **Dimensionalist Prediction:** As integration degrades, moral status will diminish smoothly (a ramp). There will be no sharp point where status vanishes entirely until valence itself vanishes.
  *   **Thresholdist Prediction:** There is a critical threshold of integration. Above it, status is present; below it, status is zero (a step). Evidence will show a discontinuity in behavioral markers of unity.

  ### Crux 2: Aggregation Intuition
  **Question:** Does the moral weight of many low-status entities ever equal the moral weight of one high-status entity?

  *   **Agreed Bearing Evidence:** Thought experiments involving swarms of simple nociceptors versus a single mammal, tested against considered moral judgments in trade-off scenarios.
  *   **Dimensionalist Prediction:** At some sufficiently large number $N$, $N \times Status_{Low} > Status_{High}$. Parties will agree it is permissible to sacrifice the single high-status entity to save the swarm.
  *   **Thresholdist Prediction:** For any $N$, if the swarm entities are below the subjecthood threshold, $N \times 0 = 0$. It is never permissible to sacrifice the single high-status entity for the swarm.

  ### Crux 3: The Deep-Feedback Learner Variance
  **Question:** If a system exhibits high temporal grip and evaluative depth but lacks phenomenology, does it acquire status?

  *   **Agreed Bearing Evidence:** Philosophical analysis of the "Deep-Feedback Learner" case if the stipulation regarding "implausibility as a subject" is removed (i.e., if we imagine it *does* have valence).
  *   **Dimensionalist Prediction:** If valence is added, status jumps significantly because valence is a primary dimension. Without valence, status remains zero regardless of grip.
  *   **Thresholdist Prediction:** Even if valence is added, if the system lacks a *unified* subject (e.g., if the valence is fragmented), status remains zero. Unity is the gatekeeper for valence to matter morally.

  ## 4. Rapporteur's Analysis

  **Verbal vs. Substantive Dispute**
  A portion of this dispute is verbal, specifically regarding the label "moral status." The Dimensionalist uses the term to denote *moral weight* (which can be fractional), while the Thresholdist uses it to denote *moral eligibility* (which is binary). However, this verbal divergence masks a substantive disagreement about the underlying metaphysics of mind. The Thresholdist insists on "subjecthood" as a further fact beyond functional dimensions, whereas the Dimensionalist views subjecthood as emergent from those dimensions.

  **Shape of the Curve**
  The dispute is partially about the shape of the curve (step versus ramp). The Thresholdist argues for a step-function based on the presence of a unified perspective. The Dimensionalist argues for a ramp-function based on the gradation of temporal grip and evaluative depth. However, this is secondary to the additivity question.

  **Additivity**
  The primary substantive disagreement is about **additivity**. Even if both parties agreed on a "threshold" for full personhood, the Dimensionalist maintains that entities below the threshold still possess *some* claim (a ramp starting at zero), which is aggregable. The Thresholdist maintains that entities below the threshold possess *no* claim (a flat line at zero), which is non-aggregable. This is the most significant divergence for practical ethics, particularly regarding insects and simple AI.

  **Recommendation**
  Future work should not focus on defining "status" but on identifying the empirical correlates of "temporal grip." If the Dimensionalist can show that temporal grip varies continuously without a break in function, and the Thresholdist can show that moral intuition breaks sharply at a specific point of unity, the crux may be resolvable via experimental philosophy or neuroscience. Until then, the parties agree to disagree on the additivity of sub-threshold cases.
