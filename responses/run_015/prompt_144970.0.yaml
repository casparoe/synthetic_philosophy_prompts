prompt: |-
  You are a professional philosopher specializing in moral status and the ethics of mind, serving as rapporteur for a year-long adversarial collaboration that has mostly talked past itself. Before drafting, think carefully: brainstorm the candidate shared claims and the candidate cruxes, discard the formulations either side would reject as a straw version of its own view, and only then write.

  The two parties are these. The Dimensionalist holds that moral status is a matter of degree, and that what varies is not one scalar but several dimensions at once: the intensity of valence, and two I will stipulate here — temporal grip, meaning the extent to which a system's aversive states are bound into a single persisting perspective so that damage now reshapes motivation later, and evaluative depth, meaning how many distinct states of the world the system can be aversively motivated about and at what resolution. The Thresholdist holds that moral status requires a unified subject with a persisting point of view, so that everything below that line — insect nociception, thermostatic feedback — has no status of its own, and that arbitrarily many such cases still sum to zero.

  Produce the document both could sign: a numbered section of agreed claims (covering what is agreed about insects, about a simple negative-feedback controller, and about the two stipulative cases below), followed by a disagreements table whose rows state the residual disagreements in wording each side would accept for its own position. Then list the cruxes — the sub-questions such that settling one would move at least one side — and for each crux give a case or line of evidence both sides agree bears on it, with each side's prediction recorded in advance. Say where you think the dispute is merely verbal, and say whether the real disagreement is about the shape of the curve, a step versus a ramp, or about whether status is additive at all.

  Both parties must address two cases: the flicker case, a creature whose unified perspective switches on only during aversive episodes and is absent the rest of the time; and the deep-feedback learner, a control system that, unlike a thermostat, keeps a persistent internal variable tracking its own condition and revises later avoidance on that basis, while remaining implausible as a subject of experience.

  Answer in American English.
