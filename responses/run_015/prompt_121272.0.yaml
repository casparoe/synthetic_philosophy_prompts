          *   *Turkey:* State *is* the perpetrator/denier.
          *   *Japan:* State is ambivalent.
          *   *Analysis:* In Charlottesville, the state was fractured (Local vs. State vs. Federal). This differs from the centralized German or Turkish models.

      *   **Working-Through vs. Denial:**
          *   *Germany:* Removal of Nazi symbols is law.
          *   *Lost Cause:* The statue *is* the denial. Keeping it up is akin to Turkey's denialism. Removing it is an attempt at "working-through."
          *   *Nuance:* In Germany, the consensus is broad (mostly). In the US, it's a culture war. The "Unite the Right" rally mirrors the Turkish defence of national honour against "external" (or internal liberal) imposition.

      *   **The Transitional Justice Gap:**
          *   *Crucial Point:* Germany had *Stunde Null* (Zero Hour). Regime change was total. The US had Reconstruction, then Redemption, then Jim Crow. No clean break.
