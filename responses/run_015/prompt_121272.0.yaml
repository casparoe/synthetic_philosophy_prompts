      *   **Conclusion:** Summarise. Charlottesville shows that memory culture cannot be grafted onto a political system that hasn't undergone a foundational rupture. *Vergangenheitsbewältigung* requires a political will to redefine the nation's origin story. The US is still fighting over that story. The comparison reveals that without transitional justice, memory work becomes a battleground rather than a consensus.

