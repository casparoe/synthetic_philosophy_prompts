answer: |-
  Here's a draft package for your seminar. I've kept the language accessible so you don't have to dust off too much theory yourself, but it's rigorous enough for grad students. I've also added that twist about "archival maintenance" being an active political choice rather than just passive inheritance—it stops them from just recycling standard reparations arguments.

  ***

  ### Take-Home Exam: Jaspers & Intergenerational Guilt
  **Time Limit:** 48 Hours
  **Word Limit:** ~800 words
  **Value:** 40 Marks

  **Prompt:**
  Karl Jaspers argues that political guilt belongs to citizens by virtue of their membership in a state, distinct from moral or criminal guilt. Consider a scenario where a colonial administration destroyed specific cultural archives to suppress dissent. That administration is long dead; the current government is run by descendants who never voted for, nor benefited directly from, the destruction. However, this new government chooses to keep the remaining fragmented archives closed rather than restoring them.

  Using Jaspers' framework, argue whether the current citizenry carries **political guilt** for the original destruction. Does citizenship function as a continuous institutional role that survives regime change, or does political guilt collapse into empty ritual once the original actors are gone? Distinguish clearly between what Jaspers settles and where you think the theory remains contested.

  ***

  ### Model Answer (Example)

  Jaspers' *The Question of German Guilt* offers four categories: criminal, political, moral, and metaphysical. To answer whether a nation remains guilty after the perpetrators die, we must first discard the categories that don't transfer. Criminal guilt is strictly individual; you cannot stand trial for another's crime. Moral guilt is a matter of individual conscience regarding one's own conduct; I cannot feel moral remorse for an act I did not commit. Metaphysical guilt concerns a universal solidarity among humans, but it remains personal. Therefore, if any guilt survives intergenerationally, it must be **political guilt**.

  For Jaspers, political guilt is unique because it attaches to citizenship, not individual morality. All citizens are co-responsible for the manner in which they are governed. In the immediate post-war context, this meant Germans were liable for reparations because the state acted in their name. The settled core of Jaspers' view is that political guilt is structural. It is not about having blood on your hands; it is about belonging to the entity that wielded the hands.

  The hard problem arises when the original citizens are dead. Does the structure survive? If we view citizenship merely as a biological inheritance, Jaspers' framework collapses. You cannot be politically guilty for a state you never belonged to. However, if citizenship is an **institutional continuity**, the picture changes. The current state is the legal successor to the colonial administration. It inherits the assets and the liabilities. In this view, political guilt isn't a stain on the soul; it's a debt attached to the office of citizenship.

  This is where the prompt's specific scenario matters. The current government isn't just inheriting a debt; they are actively choosing to keep the archives closed. This introduces a niche but crucial twist: **maintenance as complicity**. Even if the original destruction is too distant to carry direct political guilt, the *refusal to rectify* is a fresh political act. Jaspers suggests political guilt is paid through restructuring the state and making reparations. By maintaining the suppression (closed archives), the new citizenry is effectively ratifying the old policy. They aren't guilty of the destruction, but they are guilty of the continuation.

  However, we must separate what Jaspers settles from what is contested. Jaspers is clear that political guilt requires a living state structure to answer for itself. He is less clear on whether this guilt expires when the regime type changes (e.g., from colonial empire to democratic republic).
  *   **Settled:** Political guilt is collective and institutional, not moral or individual. It demands material restitution, not just apology.
  *   **Contested:** Whether this guilt transfers across generations without direct consent. Some argue political guilt is just aggregated individual guilt (which dies with the voter). Others argue it is truly collective (which survives as long as the state exists).

  My position is that political guilt survives only if the institution remains continuous enough to be recognized as the same agent. In the archive case, the state is the same legal entity. Therefore, the political guilt remains active. But it shifts shape. It is no longer guilt for the *destruction*; it becomes guilt for the *concealment*. If the current citizens treat this as a moral failing ("we feel bad") rather than a political one ("we must fund restoration"), they misunderstand Jaspers. Political guilt isn't about feeling shame; it's about accepting liability.

  Ultimately, citizenship here is continuous enough to carry the burden, not because descendants are stained by ancestors, but because they occupy the same institutional role. To deny this is to treat the state as a disjointed series of gangs rather than a continuous legal person. If the state survives, the political guilt survives, but it must be discharged through active policy (opening archives), not passive remorse. Where Jaspers leaves us hanging is whether there is a statute of limitations on political guilt once the material damage becomes irreparable. In the case of destroyed history, since the damage is permanent, the political guilt may never be fully discharged, only managed.

  ***

  ### Marking Scheme

  **A Range (32–40 marks): The Institutional Crux**
  *   **Continuity:** Explicitly identifies that political guilt hinges on institutional continuity, not biological inheritance.
  *   **Collapse Problem:** Addresses whether guilt becomes "empty ritual" if the link is broken. Argues that maintenance of the archive creates *new* political guilt or sustains the old.
  *   **Distinction:** Clearly separates Jaspers' settled taxonomy (moral/criminal = individual) from the contested nature of intergenerational political liability.
  *   **Execution:** Argument is tight, meets word count, and uses the specific scenario rather than generic examples.

  **B Range (24–31 marks): Solid Summary, Missing the Twist**
  *   **Taxonomy:** Correctly lists and defines the four guilt types.
  *   **Application:** Applies political guilt to the state but treats it as a static debt (reparations) rather than an ongoing institutional role.
  *   **Missed Opportunity:** Fails to tackle the "continuity" problem deeply. Might argue descendants are guilty simply because they are citizens, without explaining *why* the citizenship link holds after regime change.
  *   **Distinction:** Blurs the line between what Jaspers says and what is philosophically debated.

  **C Range (0–23 marks): Category Confusion**
  *   **Lists:** Primarily lists the four types of guilt without applying them.
  *   **Confusion:** Conflates moral guilt (feelings/conscience) with political guilt (liability/state action). Argues descendants should "feel bad" (moral) rather than "pay/fix" (political).
  *   **Scenario:** Ignores the archive specifics, offering generic thoughts on colonialism without using Jaspers' framework.
  *   **Structure:** Disorganized or significantly under/over word count.

  ***

  **Instructor Note:** The key differentiator here is whether they see political guilt as a *debt* (which can be inherited) or a *stain* (which cannot). If they argue it's a stain, they're actually talking about moral guilt, even if they use the word "political." Watch for that slip.
