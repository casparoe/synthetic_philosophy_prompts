prompt: |-
  Consider the widespread institutional practice—evident in research ethics boards, environmental impact regulations, and technology risk assessments—of granting moral standing only to entities with demonstrable neurobiological complexity or behavioural indicators of consciousness. Fundamental physical entities, whether quantum fields, elementary particles, or spacetime regions, are treated as morally inert substrates. Consequently, ethical review of technologies that directly manipulate these substrates—high-energy particle experiments, large-scale quantum computing architectures, or proposed climate-intervention schemes—assesses harm solely at the human, animal, or ecosystem level, never asking whether altering fundamental configurations might affect distributed subjective states should panpsychism be true.

  What theory of value and moral status does this boundary presuppose? Must it assume that consciousness is necessarily emergent and biologically realised, or can a panpsychist who accepts the combination problem defend the same exclusion on other grounds? Does the practice implicitly commit to a valence-neutrality thesis—that micro-phenomenal experience, if it exists, lacks positive or negative character—or is it merely a tractability principle? Reconstruct the implicit theory, distinguish what the practice strictly requires from what merely accompanies it, and indicate what would have to change in risk-assessment frameworks if that underlying view were replaced. In particular, examine whether extending the reversibility criterion used in animal research ethics—whereby interventions that irreversibly alter a subject's state demand stronger justification—to fundamental physical configurations yields a coherent ethical constraint, or whether it collapses into an implausible paralysis.

  Please state how confident you are in each part of your answer, and single out the specific point about which you are least sure.
