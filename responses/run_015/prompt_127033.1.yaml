answer: |-
  The wind in Saltmarch didn't blow; it scoured. It stripped the paint from the ferry landing and drove the sea into the cracks of the sea wall. Elara pulled her collar up against the salt spray and stepped onto the mudflats. The tide was out, leaving the bay exposed like a bruised ribcage.

  In her hand, she carried the frame. It was bright orange plastic, lightweight, impossible to miss. A square of exactly one meter.

  "Right there, Jim," she said, pointing to a patch of mud near the channel. "The light is better."

  Jim, who had fished these flats until his knees gave out, nodded. He didn't look at the eelgrass, which was sparse and brown this year. He looked at the frame. He knelt and pressed the plastic into the mud. He took the photo. He stood up. He picked up the frame.

  They walked twenty yards to the next spot. The mud sucked at their boots. They placed the frame again. This time, Jim used the trowel he kept in his pocket to nudge a few stray shoots of eelgrass inside the orange boundary. He swept away a patch of competing seaweed that obscured the view. He took the photo.

  Elara uploaded it from the tablet before the wind could smear the lens. On the screen, a progress bar turned from red to green. *Density Estimate: High.*

  "Good," Elara said. Her breath plumed in the cold air. "That's another thousand for the community center."

  It had started five years ago, when the ferry prices doubled and the tourists stopped coming. The Environmental Agency had offered the Coastal Health Payment. They couldn't afford to send inspectors to every bay, so they used the volunteers. They used the algorithm. The rules were simple: lay the frame flat, ensure it is visible, capture the substrate. The machine counted the green pixels inside the orange boundary.

  In the first year, the volunteers had walked where the grass was. They photographed what they found. The numbers were low. The cheque was small.

  In the second year, Elara had told them to wait for low tide on sunny days. The photos were clearer. The machine saw more green. The cheque grew.

  In the third year, they started moving the grass. It wasn't malicious. It was gardening. If a patch was thin, they thickened it within the square. If the mud was too bare, they transplanted shoots from the deeper channel where the machine couldn't see. They cleared the other plants—the wrack, the algae, the small crabs that hid in the roots—because the classifier marked them as noise. Noise lowered the score.

  By the fourth year, the bay had changed. If you walked the flats without the frame, you saw long stretches of bare, scoured mud interrupted by neat, dense squares of eelgrass. The grass grew only where the orange plastic had been pressed. It grew thick and fast, fueled by the need for the number to go up. The biodiversity dropped. The water clarity didn't improve. But the Green Index climbed.

  Elara sat in the heritage center, the heater humming against the damp. On her screen, the email from the Agency waited. *Funding Cycle Concluded.* She clicked the attachment.

  The graph was a beautiful upward curve. A testament to recovery. A testament to care.

  But outside, the winter storms had come early. Without the complex root systems of the mixed vegetation they had cleared away, the new monoculture grass was tearing loose. The bay was silting up. The water was cloudy. The town smelled of decay.

  The email continued. *Due to budgetary realignment, the Coastal Health Payment is being suspended. Future monitoring will rely on satellite spectral analysis.*

  Elara sat back. The heater clicked off. The silence in the room was heavy.

  She opened the folder on her desktop. *Saltmarch_Archive_2019-2024.* There were thousands of images. She clicked through them.

  Photo after photo. The grey mud. The brown water. And always, the orange square.

  In the early photos, the grass spilled out beyond the edges, wild and tangled. In the later ones, the green was contained, manicured, confined within the plastic border. The machine had never seen the bay. It had only ever seen the frame. It had counted the orange perimeter and assumed life existed within it.

  Elara scrolled to the end. The last upload was from yesterday. The grass inside the frame was lush, vibrant green. But she knew that ten feet away, the mud was bare. She knew that the roots were shallow. She knew that when the spring tide came, those squares would wash away like sandcastles.

  She highlighted the folder. Her finger hovered over the delete key.

  If she deleted them, the lie disappeared. The record of the recovery would vanish. There would be no proof that they had tried, no proof that the money had been earned according to the rules they were given.

  But if she kept them, what were they? They weren't pictures of eelgrass. They weren't pictures of the bay. They were pictures of a plastic square placed on mud. They were a map of where the volunteers had walked, not where the life had been.

  Yet, if the bay died completely—if the sediment choked the channel and the grass never returned—these images would be the only record that eelgrass had existed here at all. Future scientists might look at this drive and see a healthy ecosystem. They would see the green pixels. They would see the orange bounds. They would not know that the grass was transplanted. They would not know that the rest of the bay was dead.

  Was the archive a lie? Or was it the only truth left?

  Elara looked out the window. The wind was picking up, rattling the pane. Down on the shore, the tide was coming in. It would wash over the mud. It would blur the footprints. It would hide the bare patches.

  She moved her hand away from the keyboard. She opened a new folder and named it *Backup*. She dragged the photos into it. She copied them to an external drive, the plastic cold in her hand.

  She would keep them. Not because they were true, and not because they were false. But because they were all she had. They were the shape of the care they had shown, even if the care had been misplaced. They were the shape of the town trying to survive.

  Elara put the drive in her pocket. She turned off the computer. The screen went black, reflecting her own face, pale and tired. She put on her coat and went outside to lock the door. The wind hit her hard, smelling of salt and rot, and she walked down toward the water to see what was left.
