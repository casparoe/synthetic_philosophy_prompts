      *   *Winner:* **Finite Sample Justification (Finitude).** Most derivations show that *in the limit*, frequencies match weights. Very few explain why a rational agent should bet on the Born rule *today* for *tomorrow's* single result, given that the "wrong" result *will* happen on some branch. This is the "Practical Problem."

  6.  **Scoring the Approaches:**
