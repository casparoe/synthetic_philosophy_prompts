answer: |-
  Here is a pruned, reorganized, and argued-out desiderata list tailored to your specific purpose: underwriting the statistical practice of a working physicist who accepts branching. I have split your original points, added the missing methodological constraints, and flagged them by necessity.

  ### The Desiderata List

  **1. Action-Guiding Non-Circularity (NN)**
  *   **Specification:** The account must derive the recommendation to bet at Born-rule odds without assuming probabilistic premises that already encode the Born rule. However, it must acknowledge that some normative bridge principle (e.g., "maximize expected utility" or "care about successors in proportion to weight") is required to move from ontology to action.
  *   **Motivation:** If the derivation assumes the agent already cares about branches according to their squared amplitude, it offers no justification to the skeptic. If it offers only ontology without norms, it tells the physicist nothing about how to place bets.
  *   **Status:** **Non-Negotiable.** Without this, the account is either question-begging or practically inert.

  **2. Quantitative Recovery for Irrational Weights (NN)**
  *   **Specification:** The account must yield the Born rule for single cases where the squared amplitude is an irrational number (e.g., $1/\pi$). It cannot rely on counting discrete, equal-weight sub-branches, as no finite decomposition yields irrational ratios.
  *   **Motivation:** Your "one-shot irrational case." Real experiments involve continuous parameters; an account that only works for rational fractions (like 1/2 or 3/4) is empirically inadequate.
  *   **Status:** **Non-Negotiable.** This eliminates naive branch-counting immediately.

  **3. Basis Stability / Granularity-Robustness (NN)**
  *   **Specification:** The assigned probabilities must not depend sensitively on the precise definition of the "branch." Since decoherence defines the preferred basis only approximately (FAPP), small changes in the coarse-graining of the environment must not shift the probability of the macro-outcome.
  *   **Motivation:** Your "granularity" point. If the probability of "spin up" changes because we modeled the detector to the micron instead of the millimeter, the probability is not a physical property of the measurement but an artifact of the description.
  *   **Status:** **Non-Negotiable.** Essential for objective statistical practice.

  **4. Finite Sample Justification (NN)**
  *   **Specification:** The account must justify confidence in the Born rule for a *finite* set of actual data (e.g., 40 runs), not merely assert that "almost all" branches in the infinite limit exhibit correct frequencies. It must explain why the physicist should not expect to find herself on a low-weight branch *this time*.
  *   **Motivation:** Your "finitude" point. Textbook statistics (p-values, error bars) apply to finite samples. An asymptotic guarantee does not rule out the physicist finding herself in a statistical fluke outlier branch tomorrow.
  *   **Status:** **Non-Negotiable.** This is the core of the "practical problem."

  **5. Diachronic Coherence / Updating Rule (CP)**
  *   **Specification:** The account must provide a rule for how credences change upon learning which branch one is on (post-measurement). It must clarify whether "I am on the up-branch" is new information that warrants Bayesian conditionalization.
  *   **Motivation:** Your "conditionalization" point. If the physicist cannot update her beliefs coherently after a measurement, she cannot chain experiments or refine theories.
  *   **Status:** **Camp Preference.** Decision-theorists often treat this as secondary to pre-measurement betting; Self-Location theorists treat it as primary. However, for *practice*, it is effectively NN, though the *mechanism* is debated.

  **6. Measurement Generality (NN)**
  *   **Specification:** The account must handle non-ideal, noisy, and generalized (POVM) measurements, not just clean projective measurements on isolated systems. It must also explain why probabilities do not attach to coherent superpositions *before* decoherence is complete.
  *   **Motivation:** Real labs use imperfect detectors. Furthermore, if probabilities attached before decoherence, interference patterns would be destroyed prematurely.
  *   **Status:** **Non-Negotiable.** Required for the account to apply to actual physics, not toy models.

  **7. Empirical Coherence (NN)**
  *   **Specification:** The account must explain why the historical data that confirmed quantum mechanics (in the pre-Everettian context) continues to confirm it in the Everettian context.
  *   **Motivation:** If EQM implies that all outcomes happen, it risks becoming compatible with *any* data, thereby losing predictive power. The account must show why "bad" data is unlikely (in the relevant sense) even if it exists somewhere.
  *   **Status:** **Non-Negotiable.** Without this, the theory is unfalsifiable.

  ---

  ### The Tension: Finite Justification vs. Basis Stability

  You guessed that **Exactness-for-a-Finite-Run** conflicts with **Granularity-Robustness**. You are correct, but the tension is deeper than mere approximation.

  **The Conflict:**
  *   **Finite Sample Justification** requires sharp probabilities. To tell a physicist she is rational to reject a hypothesis at the $p < 0.05$ level, you need a precise measure of "unlikely." You need to say the branch she is on has a specific, low weight.
  *   **Basis Stability** acknowledges that "branches" are not fundamental ontological atoms. They are emergent, fuzzy structures defined by decoherence. The "weight" of a branch is only well-defined relative to a specific decomposition. Since the decomposition is approximate (there is no sharp cut-off for when decoherence is "complete"), the weight is inherently fuzzy.

  **The Upshot:**
  You cannot have *exact* Born-rule probabilities for *fuzzy* branches. If you demand exact probabilities (to satisfy the statistician's need for precise error bars), you must treat branches as precise entities, which violates the physics of decoherence (Basis Stability). If you respect the physics of decoherence (Basis Stability), you must admit that probabilities are approximate, which undermines the strict justification for finite-sample significance tests (Finite Sample Justification).

  **Resolution:**
  The list cannot be satisfied in full. **Finite Sample Justification** must be weakened. We must accept that the justification for statistical practice in EQM is not that the physicist *will* see typical results, but that it is *rationally required* to act *as if* she will, despite the ontological fuzziness. The "exactness" of the p-value is a feature of the decision-theoretic norm, not the ontological branch weight. We trade ontological precision for normative sharpness.

  ---

  ### The Killer Constraint

  The single requirement that does the most work in excluding candidates is **4. Finite Sample Justification**.

  *   **Why:** Most approaches (especially Frequentist and Typicality-based ones) rely on the Law of Large Numbers. They show that the *measure* of branches deviating from the Born rule goes to zero as $N \to \infty$.
  *   **The Failure:** This does not help the physicist with $N=40$. In a deterministic multiverse where every outcome occurs, the fact that "most" branches see the right frequency does not logically compel the agent to expect *her* branch to be typical. She knows a branch with her exact history exists, even if it has low weight.
  *   **Exclusion:** This requirement quietly kills pure Frequentism (which needs infinite ensembles), pure Typicality (which struggles to justify caring about the typical branch in a deterministic setting), and naive Branch Counting. It forces the debate toward Decision Theory or Self-Locating Uncertainty, as only they attempt to bridge the gap between "what happens" and "what to expect" for a single agent.

  ---

  ### Scoring the Approaches

  Here is how the four broad families score against the refined list.

  **1. Decision-Theoretic Derivations**
  *   **Strengths:** Excellent on **Action-Guiding Non-Circularity** (by design) and **Finite Sample Justification** (frames probability as betting odds for single cases). Handles **Irrational Weights** well via continuity axioms.
  *   **Weaknesses:** Vulnerable on **Non-Circularity**. Critics argue the decision-theoretic axioms (e.g., "branching indifference") smuggle in probabilistic assumptions. Often weak on **Basis Stability**, as they tend to treat branches as discrete nodes in a decision tree rather than fuzzy decoherent histories.
  *   **Verdict:** Best for the *physicist's practice*, but metaphysically contentious.

  **2. Symmetry / Envariance Arguments**
  *   **Strengths:** Strong on **Non-Circularity** (derives weights from physical symmetries of the state vector, not decision norms). Good on **Quantitative Recovery**.
  *   **Weaknesses:** Fails **Action-Guiding**. Showing that the state *has* a symmetry does not explain why an agent should *care* about that symmetry when betting. Weak on **Finite Sample Justification**; it establishes the weights, but not the link to rational expectation in a single case.
  *   **Verdict:** Good for ontology, silent on epistemology.

  **3. Branch-Counting and Relative-Frequency**
  *   **Strengths:** Intuitively simple.
  *   **Weaknesses:** Fails **Quantitative Recovery** immediately (cannot handle irrational weights). Fails **Basis Stability** (count depends on coarse-graining). Fails **Finite Sample Justification** (frequencies in the multiverse do not mandate expectations for the individual).
  *   **Verdict:** Dead on arrival for serious seminar discussion.

  **4. Self-Locating Uncertainty**
  *   **Strengths:** Strong on **Diachronic Coherence** (provides a clear updating rule). Good on **Action-Guiding** (frames the problem as ignorance of location).
  *   **Weaknesses:** Struggles with **Non-Circularity** (requires a "Indifference Principle" over branches that is hard to justify without assuming weights). Vulnerable on **Basis Stability** (counting "locations" is sensitive to how you slice the branches).
  *   **Verdict:** Strongest epistemic narrative, but relies on a controversial principle of indifference.

  **Summary for the Seminar:**
  Assign the **Decision-Theoretic** readings to address the *practice* (Desiderata 1 & 4), but pair them with **Symmetry** readings to address the *ontology* (Desiderata 2 & 3). Use the tension between **Finite Justification** and **Basis Stability** as the central seminar problem: ask the students whether they are willing to accept approximate probabilities for fuzzy branches if it saves the rationality of their statistical practice.
