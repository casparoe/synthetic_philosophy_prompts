      *   *Wait, the user's specific guess:* Exactness vs. Granularity. In EQM, branch weights are defined via the wavefunction norm. Decoherence defines branches approximately. So exact weights are only defined relative to an idealized decomposition. If the decomposition is fuzzy, the weight is fuzzy. So demanding *exact* Born rule compliance for a *finite* set of data (which implies exact probabilities) clashes with the *approximate* nature of branching.
      *   *Better Tension:* *Finitude* (Why trust *this* sample?) vs. *Typicality* (Most branches see the right frequencies). If *all* outcomes occur, why expect the typical one? The "Incoherence Problem" is the real killer. But regarding the *list constraints*: The tension between **Granularity-robustness** and **Quantitative Exactness** is real. Decoherence is approximate; Born weights are exact mathematical features of the vector. You can't have exact probabilities for fuzzy events.
