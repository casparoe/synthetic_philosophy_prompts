          *   *Tobias Renn:* No determinate number of subjects; attribution is grain-relative/pragmatic. Sentience is a tool for evidence/action, not an intrinsic property.
      *   **Key Arguments to Include:**
          *   Renn: If approximate realization preserves the subject, continuity implies panpsychism (nearly every system is a subject). Vandermeer must answer this.
          *   Vandermeer: If grain is up to us, welfare becomes a fact about *us*, not the system. Renn must answer this.
          *   Specific disagreement: Overlapping subcircuits (one subject vs. population of partials).
          *   Specific disagreement: Weight of LARK-7's self-reports.
      *   **Ending:** They don't need to resolve the main issue, but must agree on what counts as *progress* (measurement, criterion, question change).
