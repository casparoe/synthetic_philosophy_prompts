  ### The Principle of Epistemic Transparency and Necessity

  **Statement of the Principle:**
  Defer to the **Inside View** when the cognitive object is a *necessary relation* fully transparent to immediate inspection, where error would be phenomenologically salient (i.e., you would feel confused if you were wrong). Defer to the **Outside View** when the cognitive object is *contingent, interpretive, or procedurally opaque*, where error is compatible with a strong feeling of correctness (i.e., you can feel certain and still be wrong).

  **Motivation by Case:**
  *   **Clause 1 (Necessary/Transparent):** Motivated by the **Logical Derivation** case. Modus ponens is a formal necessity; the truth-maker is present on the page. If you misunderstand it, the confusion is usually immediate. This justifies disregarding the base rate of error for *this specific instance* of clear comprehension.
  *   **Clause 2 (Contingent/Opaque):** Motivated by the **Research Proposal**, **Memory**, **Moral Intuition**, and **Statistical Analysis** cases.
      *   *Proposal:* Future events are contingent; optimism bias is silent.
      *   *Memory:* Past events are gone; confabulation feels vivid.
      *   *Moral:* Normative truths are obscure; bias feels like righteousness.
      *   *Stats:* Code execution is contingent on hidden states (data, environment); bugs feel like correct code.
      *   *Philosophical Paper:* (See limitation below).

  **Prediction for the Unlisted Case (Poem Metaphor):**
  **Verdict:** Treat the interpretation tentatively (e.g., 50–60% confidence) and seek a second reading or discussion.
  **Reasoning:** Interpreting a metaphor is an *interpretive* task, not a formal deduction. The "truth-maker" (the poet's intent or the text's optimal reading) is not fully transparent to your mind; it is external and ambiguous. You can feel a metaphor "clicks" (phenomenological certainty) while projecting meaning that isn't there (silent error). Therefore, Clause 2 applies: the Outside View (readers often project meaning) must discount the Inside View.

  **Honest Limitation:**
  The principle cannot fully accommodate the **Philosophical Paper** verdict without a contentious distinction. In that case, you report "clear understanding" of a logical flaw (equivocation), which structurally resembles the **Logical Derivation** case (Clause 1). To justify the Outside View verdict (Clause 2), the principle must classify "identifying an author's equivocation" as *interpretive* rather than *formal*. This requires the metaphysical claim that authorial intent is always opaque, whereas logical validity is transparent. While practical, this distinction is fragile: if the equivocation is in the text's public meaning (not private intent), it borders on formal logic, yet your verdict treats it as fallible interpretation. The principle accommodates the *verdict* only by insisting the object of judgment is the *author's mind* (opaque) rather than the *argument's form* (transparent).

