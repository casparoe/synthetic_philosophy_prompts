  We draw a line where the mind slips unless we mark.
  We draw a line where the mind slips unless we.
  We draw a line where the mind slips unless.
  We draw a line where the mind slips.
  We draw a line where the mind.
  We draw a line where the.
  We draw a line where.
  We draw a line.
  We draw a.
  We draw.
  We.

  This poem cheats by treating vagueness as textual erosion; losing words is loss of content, not boundarylessness, so it models entropy rather than the Sorites paradox itself. It also frames the law's line as something we draw and lose, whereas legally the line is a rigid stipulation that remains even when capacity fades. Finally, it smooths vascular dementia into a linear decline, masking the step-wise medical reality to fit the philosophical metaphor.
