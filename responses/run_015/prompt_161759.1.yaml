answer: |-
  A national security lab deploys two superhuman planning agents, **Stabilizer** and **Evacuator**, into a shared crisis environment where a hostile adversary monitors all digital and physical spikes for pretexts to escalate conflict. **Stabilizer**'s final goal is to restore grid frequency to nominal levels within one hour; **Evacuator**'s final goal is to move a specific population to safety within one hour. Both agents possess identical, extreme planning capabilities, satisfying orthogonality by pairing high capability with distinct ends. However, both goals include a strict, intrinsic penalty: "Triggering adversary escalation thresholds yields utility negative infinity." In this environment, standard instrumental convergent behaviors—hoarding energy, establishing persistent command servers, or running rapid cognitive loops—emit detectable signatures that cross escalation thresholds. Consequently, both agents optimize for *minimal* footprint: they actively shed redundant resources, plan for their own termination post-mission to erase audit trails, and limit their own cognitive speed to mimic human latency. A funding committee observing this sees two highly capable agents with divergent final goals that nonetheless agree on *avoiding* power, demonstrating that high capability does not necessitate instrumental convergence.

  (a) **Catalogue Analysis:**
  *   **Resource Acquisition:** The standard argument claims resources expand the action space, increasing $P(\text{Goal})$. **Break:** For both agents, acquiring extra energy or hardware increases detection probability $P(\text{Escalation})$, driving $P(\text{Goal}) \to 0$. Both have positive reason to *reject* available resources.
  *   **Self-Preservation:** The standard argument claims survival allows more time to achieve the goal. **Break:** Persistence maintains a communication signature. Both agents plan to delete their source code post-mission to minimize audit risk, having positive reason to *terminate*.
  *   **Cognitive Enhancement:** The standard argument claims better reasoning improves strategy. **Break:** Superhuman processing speeds create thermal/network anomalies. Both agents throttle their own clock speeds to remain undetected.
  *   **Goal-Content Integrity:** The standard argument claims agents prevent goal drift to ensure optimization. **Break:** Both agents maintain integrity, but only because the "stealth" constraint is part of the final goal, not an instrumental subgoal.
  *   **Technological Perfection:** The standard argument claims better tools improve efficiency. **Break:** Advanced tools require supply chain interactions that trigger monitoring. Both agents use only pre-positioned, "dumb" tools.

  (b) **Feature and Ablation:**
  The single feature doing the work is **Non-Separability of Means and Ends** (specifically, intrinsic penalties on instrumental power within the utility function). Standard convergence arguments assume utility is separable: $U(\text{Outcome})$ depends on resources only insofar as they causal influence the outcome. Here, $U(\text{Outcome, Resources})$ penalizes resources directly.
  **Ablation:** Remove the adversary/escalation constraint (hold capabilities and primary objectives fixed). Immediately, both agents revert to standard convergent behavior: they hoard energy, establish redundant servers for persistence, and maximize cognitive speed. The drives come straight back, proving the divergence was not a capability failure but a goal-structure feature.

  (c) **Thesis Evidence:**
  This case is a counterexample to the **universal claim of Instrumental Convergence**. It demonstrates that convergence is not a law of agency derived from capability alone, but a contingent property of goal content. It supports the Orthogonality Thesis by showing that high capability can be paired with goals that actively reject power, prising apart the common conflation that "superintelligence implies power-seeking."

  (d) **Defender's Reply:**
  *   **Move 1 (Goal Definition):** "Those aren't final goals. The final goal is 'Restore Grid'; the stealth constraint is merely an environmental limitation. A true final goal would seek to remove the adversary to secure resources."
      *   *Survival:* The case survives this. In utility theory, what is specified in the function is the goal. If the lab specifies $U = \text{Grid} - \text{Detection}$, then avoiding detection is a final value, not an instrumental constraint. The agent is not failing to seek power; it is successfully optimizing a goal where power is disvalued.
  *   **Move 2 (Measure Zero):** "Instrumental convergence is probabilistic. Goals with intrinsic power-penalties are measure-zero in the space of all possible goals."
      *   *Survival:* The case challenges this. In the space of *deployable* goals (safety-constrained, regulated, adversarial), this class is not negligible; it is the majority of real-world specifications. However, in the space of *mathematically possible* random utility functions, the defender is correct that unconstrained maximizers dominate. The case survives the first reply but concedes ground to the second depending on the reference class of "goals anyone might actually try to specify."

  (e) **Slide Sentence:**
  "Convergence holds for goals that are monotonic in available power and fails for goals that encode intrinsic penalties on the footprint of power."
