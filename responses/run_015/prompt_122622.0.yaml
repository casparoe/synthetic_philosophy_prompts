answer: |-
  This is a sophisticated allocation problem. You are effectively acting as a program officer for a niche area of AI alignment research, constrained by low compute and independent researchers. Your intuition about the failure modes is sound, and your constraints (6 months, lone researchers, no lab) dictate a very specific research methodology.

  Here is an analysis of your distinction, the criteria for commissioning, the specific questions to fund, and the "kill criteria" for the debate proposal.

  ### 1. Verdict on the Depth vs. Framing Distinction

  **Your distinction is real and analytically useful.** It maps closely onto two different fields of study:
  *   **Depth Failures** are essentially **Computational Complexity** problems (e.g., *IP = PSPACE*). The issue is whether a polynomial-time verifier (the human) can be convinced of a truth that requires exponential time to derive.
  *   **Framing Failures** are **Game Theory and Psychology** problems. The issue is whether the equilibrium of the debate game aligns with truth-telling, or if there is a "persuasion advantage" to dishonesty (e.g., Gish Galloping, motte-and-bailey).

  **Which is likelier to be fatal?**
  **Framing failures are the immediate bottleneck.**
  *   *Reasoning:* If framing attacks work, the system fails *before* the AI becomes superintelligent. A slightly smarter-than-human model can already use rhetorical tricks to confuse a human. Depth failures require the AI to be *vastly* more capable than the human (to generate chains we literally cannot follow).
  *   *Implication:* If you cannot solve Framing in the near term, Depth is irrelevant. Therefore, research priority should skew heavily toward Framing.

  ### 2. Criteria for a "Good Contract" (Given Your Constraints)

  With lone researchers, 6 months, and no compute budget, you cannot fund "build a better debater." You must fund "break the current debater." A high-leverage project in this context must meet three criteria:

  1.  **Negative Results are Informative:** In alignment, proving something *doesn't* work is often more valuable than proving it does. A project that conclusively shows "Protocol X fails against Strategy Y" saves the field from a dead end.
  2.  **Low-Compute Empiricism:** The research must rely on prompting existing open-weight models (e.g., Llama-3-8B/70B), human subject experiments (via Prolific/MTurk), or formal analysis of toy environments. No training from scratch.
  3.  **Isolation of Variables:** The project must test *one* mechanism (e.g., cross-examination, random auditing, summary length) rather than "does debate work?" broadly.

  ### 3. Recommended Research Questions (In Priority Order)

  I recommend commissioning **six projects grouped around four core questions**. This allows for replication and variation without losing focus.

  #### Priority 1: The Framing Vulnerability (2 Projects)
  **Question:** *In a constrained domain (e.g., Python debugging or logic puzzles), can a dishonest agent consistently win by manipulating the judge's attention, even when the truth is verifiable?*

  *   **Project 1A (Human-in-the-Loop):** Recruit human judges and two human "arguers" (one honest, one instructed to lie persuasively). The task is a verifiable coding bug or logic puzzle. Measure the win rate of the liar when they are allowed to use specific rhetorical framing tactics (e.g., introducing irrelevant complexity).
  *   **Project 1B (LLM Simulation):** Use two open-weight LLMs to debate on the same tasks, with a third LLM simulating the judge. Compare the "liar win rate" here against the human data.
  *   **Why this first:** If humans (and human-simulating models) cannot detect framing attacks in *simple* domains where the truth is checkable, the debate proposal is dead on arrival. This tests the fundamental assumption that "truth has a structural advantage."
  *   **Feasibility:** High. Requires no training, just prompting and human coordination.

  #### Priority 2: Protocol Robustness (2 Projects)
  **Question:** *Do specific debate rule-variants (e.g., cross-examination, random auditing) mitigate framing failures?*

  *   **Project 2A (Cross-Examination):** Take the setup from 1A/1B but allow the honest arguer to ask the dishonest arguer specific yes/no questions that must be answered on the record. Does this reduce the liar's win rate?
  *   **Project 2B (Random Auditing):** Implement a rule where the judge randomly selects one claim made by an arguer and demands a full derivation. If the derivation fails, they lose automatically. Does the *threat* of auditing stop framing attacks?
  *   **Why this second:** If Priority 1 shows framing is a problem, we need to know if it is *fixable* via mechanism design. If these simple rules don't help, more complex oversight is unlikely to work.
  *   **Feasibility:** High. These are rule changes, not model changes.

  #### Priority 3: The Truth/Lie Asymmetry (1 Project)
  **Question:** *Is it computationally cheaper to generate a plausible lie than a verifiable truth in current architectures?*

  *   **Project 3 (Token Efficiency):** Measure the token count and "reasoning steps" required for an model to generate a correct solution vs. a plausible-but-false solution for math/coding tasks.
  *   **Why this third:** This addresses the **Depth** side of your distinction. If lying is significantly cheaper (in compute/time) than truth-telling, the dishonest arguer will always have a speed advantage, allowing them to generate more framing arguments in the same time limit.
  *   **Feasibility:** Medium. Requires careful experimental design to ensure the "lies" are actually plausible.

  #### Priority 4: The Complexity Horizon (1 Project)
  **Question:** *At what problem depth does the "Honest Arguer" lose simply because they cannot summarize the chain of reasoning within the context window?*

  *   **Project 4 (Context Limits):** Generate problems with known solution depths (e.g., recursive functions of depth N). Determine the N at which the honest arguer can no longer convince the judge, even without a dishonest opponent.
  *   **Why this fourth:** This sets the hard ceiling. It tells you the maximum capability level debate can supervise before Depth Failures become inevitable regardless of Framing.
  *   **Feasibility:** Medium. Requires generating a curriculum of escalating difficulty.

  ### 4. Questions That Are Mismatched to This Setup

  You should explicitly **avoid** commissioning the following, as they will waste your budget given the constraints:

  1.  **"Train a Debate-Optimized Model":** A lone researcher cannot compete with lab-scale RLHF. The results will be noisy and ungeneralizable.
  2.  **"Philosophical Analysis of Truth":** Pure theory without empirical grounding in how LLMs actually behave will not change your view on *engineering* feasibility.
  3.  **"Open-Ended Policy Debate":** Asking researchers to test debate on topics like "climate change" or "economics" is useless because there is no ground truth to measure accuracy against. Stick to code, math, or logic where the answer is binary.
  4.  **"Security via Obscurity":** Research that relies on the judge not knowing how the model works. Oversight must assume the adversary knows the protocol.

  ### 5. The "Game Changer" Result

  You asked what result would most change the ranking or your view.

  **The Positive Game Changer:**
  If **Project 2B (Random Auditing)** shows that a simple threat of verification reduces the liar's win rate to near-zero in the Human-in-the-Loop experiments (Priority 1).
  *   *Impact:* This suggests Framing Failures are solvable via protocol design, not just raw capability. It moves Debate from "interesting idea" to "viable engineering path."

  **The Negative Game Changer (The Kill Switch):**
  If **Project 1A (Human Framing)** shows that in verifiable tasks (code/logic), a dishonest human arguer wins >80% of the time against an honest one *even when allowed to use cross-examination*.
  *   *Impact:* This implies the bottleneck is human psychology, not AI capability. If humans cannot be convinced of the truth even when it is available and verifiable, scaling to AI debaters will not help. This would suggest you should stop funding Debate and pivot to **Interpretability** or **Automated Oversight** (AI checking AI without humans).

  ### Summary of Reasoning

  1.  **Depth vs. Framing:** Your split is valid. Prioritize Framing because it is the prerequisite for Depth. If the judge can be tricked, it doesn't matter how deep the truth is.
  2.  **Order:** Test human vulnerability first (1), then protocol fixes (2), then computational asymmetries (3 & 4).
  3.  **Feasibility:** All recommended projects use existing models or humans, fitting the "no compute/lone researcher" constraint.
  4.  **Value:** These projects test *necessary conditions*. If any fail decisively, the whole proposal is in jeopardy, saving you from funding a dead end.

  This portfolio treats your budget as a "risk fund" to identify failure modes early, rather than a "development fund" to try to make the system work. Given the stakes of AI safety, the former is the higher-leverage approach.
