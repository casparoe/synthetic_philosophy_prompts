  8.  **Final Polish:** Ensure the distinction between "epistemic warrant" and "ethical authority" is clear in the community section. Ensure the Indus case doesn't just say "no" but offers the *graded* alternative. Ensure the River Bronze case identifies the specific "Belief Ceiling" block.

