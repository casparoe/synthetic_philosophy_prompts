  5.  **Refining the Tone:**

      *   The user is a philosopher of science. The tone must be rigorous, precise, slightly formal, but practical. No fluff. Acknowledge the tension between epistemic humility and public engagement.
      *   Avoid "museum speak." Use "audit," "warrant," "inferential leap."

  6.  **Step-by-Step Construction (Mental or Scratchpad):**

