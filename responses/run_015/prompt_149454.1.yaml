answer: |-
  Here is the operational procedure you requested, designed for the constraints of a generalist review panel, followed by the application to your three cases and the required self-critique.

  # The Inferential Audit Protocol (IAP)

  **Purpose:** To regulate the assertive force of museum labels regarding past social and mental states.
  **Constraints:** 90-minute session; 5–6 labels; generalist panel; no new research permitted.
  **Epistemic Stance:** The protocol treats labels as public assertions requiring warrant. It distinguishes between *material presence* (secure) and *social/mental attribution* (insecure).

  ## Part 1: The Taxonomy of Claims
  Before evidence is reviewed, the panel must classify the draft claim into one of five levels. The warrant required increases strictly with each level.

  1.  **Occurrence:** The object existed and was deposited at location X. (Warrant: Provenance/Stratigraphy).
  2.  **Activity:** The object was used for action Y. (Warrant: Wear analysis, residue, ethnographic analogy).
  3.  **Practice:** Action Y was repeated/patterned, not accidental. (Warrant: Multiple instances, standardization).
  4.  **Institution:** Practice Y was rule-governed, enforced, or role-differentiated. (Warrant: Markers of sanction, cost, durability).
  5.  **Belief/Meaning:** Actors held proposition Z to be true, or object signified Z. (Warrant: Text, iconographic convention, explicit testimony).

  *Rule:* A label cannot assert a Level 4 or 5 claim if the evidence only secures Level 3.

  ## Part 2: The Gates (Procedural Checks)
  The draft text must pass through these gates. Failure at any gate requires downgrading the claim or invoking the Hand-Off.

  **Gate 1: The Formation Filter (Hard Stop)**
  *   **Check:** Is the findspot and association secure?
  *   **Fail Condition:** Old collections (pre-1950s), dealer acquisitions, disturbed contexts.
  *   **Outcome:** If failed, no claims above Level 1 (Occurrence) are permitted.

  **Gate 2: The Link Audit**
  *   **Check:** Trace the chain: Object $\rightarrow$ Event $\rightarrow$ Practice $\rightarrow$ Norm $\rightarrow$ Meaning.
  *   **Requirement:** Each link must have independent warrant. You cannot borrow warrant from Level 3 to support Level 5.
  *   **Outcome:** Identify the highest secure link. The label must not assert beyond this link.

  **Gate 3: The Calibration Condition**
  *   **Check:** Has the inference form (e.g., "uniform weights = central authority") been validated against a case where the answer is known (via text, ethnography, or experiment)?
  *   **Requirement:** Curator must cite one calibrated analogue.
  *   **Outcome:** If uncalibrated, the claim must be labelled "Hypothesized" or downgraded.

  **Gate 4: The Symmetry Test (Modern Analogue)**
  *   **Check:** Apply the inference to a modern assemblage (e.g., a household refuse bin, a church storage room).
  *   **Requirement:** If the inference yields a false positive on the modern material (e.g., "uniform coffee mugs imply a central state authority"), it is rejected for the ancient material.
  *   **Outcome:** Rejection requires rewording to reduce specificity.

  **Gate 5: The Residual Category Check**
  *   **Check:** Is "Ritual/Symbolic" being used because functional explanation failed?
  *   **Requirement:** If "function unknown" is the primary warrant for "ritual," the claim fails.
  *   **Outcome:** Must state "Function unknown" rather than "Ritual object."

  **Gate 6: The Institutional Markers (For Level 4 Claims)**
  *   **Check:** For claims of "Authority," "State," or "Enforcement," at least **two** of the following must be evidenced:
      1.  Visible sanction/punishment for non-compliance.
      2.  Differential access to materials by role.
      3.  Durability across >2 generations.
      4.  Costliness not reducible to individual advantage.
      5.  Persistence under changed material conditions.
  *   **Outcome:** If <2 markers, "Authority/State" is prohibited. Use "Agreement," "Convention," or "Network."

  **Gate 7: The Belief Ceiling (For Level 5 Claims)**
  *   **Check:** Is there representational evidence of the specific belief?
  *   **Requirement:** Text, readable iconographic convention (decoded via calibration), or descendant testimony (see Hand-Off).
  *   **Outcome:** Without this, no deities, no specific myths, no "belief in X." Use "Associated with," "Deposited in," or "May reflect."

  ## Part 3: Graded Confidence Vocabulary
  The panel must select the modal verb corresponding to the highest Gate passed.

  *   **Demonstrates:** Passed all gates; calibrated; multiple markers. (Rare).
  *   **Indicates:** Passed Gates 1–4; strong analogy.
  *   **Suggests:** Passed Gates 1–3; plausible but uncalibrated.
  *   **Consistent with:** Passed Gate 1; one of several competing models.
  *   **Tradition holds / Community states:** Hand-Off invoked (see below).

  ## Part 4: Direction of Error and Ethical Stance
  **Statement of Bias:** This procedure explicitly prioritizes **False Negatives** (silence/uncertainty) over **False Positives** (confident error).
  **Rationale:** A label that omits a social claim preserves the object's integrity. A label that asserts a false social claim creates a fossilized misinformation that can be weaponized by nationalist or colonial narratives. We accept the risk of boring the visitor to avoid the risk of lying about the past.
  **Status:** This is an ethical choice, not an epistemic one. It is not "more scientific" to be silent; it is less harmful.

  ## Part 5: The Hand-Off to Descendant Communities
  **Condition:** When archaeological evidence is insufficient for Level 4/5 claims (Institution/Belief) but a descendant community asserts a connection.
  **Procedure:**
  1.  **Acknowledge Limit:** The label must state that archaeological evidence does not confirm the claim.
  2.  **Attribute Authority:** The claim is presented as the living tradition of the Community, not the conclusion of the excavation.
  3.  **Wording:** "According to [Community] tradition..." rather than "This object was used for..."
  4.  **Constraint:** This is not "deference" (accepting it as archaeological fact) nor "dismissal" (rejecting it as unscientific). It is a jurisdictional boundary. Archaeology adjudicates matter; Communities adjudicate meaning/lineage where matter is silent.

  ***

  # Application to Cases

  ## Case 1: Indus Weights and Seals (Institutional Claim)
  **Draft:** "A central authority enforced a uniform standard of measurement across the Indus Valley."
  **Audit:**
  *   **Taxonomy:** Level 4 (Institution).
  *   **Gate 1 (Formation):** Secure urban contexts. Pass.
  *   **Gate 2 (Link Audit):** Object (weights) $\rightarrow$ Activity (measuring) $\rightarrow$ Practice (standardized ratios). Link to "Central Authority" is the break point.
  *   **Gate 3 (Calibration):** Do uniform weights *always* equal central authority? Modern analogue: ISO standards are often industry-led, not state-enforced. Medieval weights often varied by guild, not king. Calibration weak.
  *   **Gate 6 (Institutional Markers):**
      *   Sanction? No evidence of punishment for wrong weights.
      *   Differential Access? Weights found in many domestic contexts, not just palaces.
      *   Durability? Yes, over centuries.
      *   *Score:* 1 out of 5 markers.
  *   **Outcome:** **Fail.** The claim "Central Authority Enforced" exceeds warrant.
  *   **Rewrite:** "Hundreds of stone weights from cities across the Indus Valley conform to a single system of ratios. This precision **suggests** widespread agreement among merchants and makers, though the source of this standard—whether state, guild, or custom—remains unknown."
  *   **Grade:** *Suggests* (Level 3 Practice secured; Level 4 Institution blocked).

  ## Case 2: River/Peat Bronzes (Belief Claim)
  **Draft:** "These weapons were offerings thrown into the water for a deity."
  **Audit:**
  *   **Taxonomy:** Level 5 (Belief/Deity).
  *   **Gate 1 (Formation):** River gravels/peat. Association secure enough for deposition type, but not specific context. Pass (with caution).
  *   **Gate 2 (Link Audit):** Object $\rightarrow$ Deposition (Intentional). Link to "Deity" is unsupported.
  *   **Gate 5 (Residual Check):** Is "Offering" the only explanation? Disposal of loot, burial of dead, or loss are alternatives. "Ritual" is being used because "Function" is unclear.
  *   **Gate 7 (Belief Ceiling):** Is there a text? No. Iconography of a god receiving the weapon? No.
  *   **Outcome:** **Hard Fail.** The word "Deity" is epistemically bankrupt here.
  *   **Rewrite:** "These bronze weapons were deliberately placed in the river or peat bog. While their exact purpose is unknown, such deposits **are consistent with** ritualized practices known from later periods, though they may also mark boundaries, commemorate events, or dispose of valuable goods."
  *   **Grade:** *Consistent with* (Level 2 Activity secured; Level 5 Belief blocked).
  *   **Blocked Gate:** Gate 7 (Belief Ceiling).

  ## Case 3: Carved Wooden Objects (Community Hand-Off)
  **Draft:** "Regalia of a hereditary society." (Requested by Descendant Community).
  **Audit:**
  *   **Taxonomy:** Level 4 (Institution).
  *   **Gate 1 (Formation):** Collected 1890s, no documentation. **Fail.**
  *   **Gate 6 (Institutional Markers):** Archaeologically, none.
  *   **Hand-Off Trigger:** Community delegation asserts this is their heritage.
  *   **Procedure:** Stop archaeological inference. Invoke Part 5.
  *   **Rewrite:** "Collected in the 1890s with no recorded context. Archaeological evidence cannot confirm their original use. [Name of Community] identifies these objects as the regalia of a hereditary society, and cares for them today according to that tradition."
  *   **Grade:** *Community States* (Archaeological inference stopped at Gate 1; Authority transferred).

  ***

  # Self-Critique and Withdrawal Conditions

  You asked for honesty about where this procedure breaks, where it is mechanical, and what its upshot truly is.

  **1. When to Withdraw the Procedure**
  I would withdraw the IAP if it becomes a **box-ticking exercise** where curators simply shop for "calibrated analogues" that are themselves weak, effectively gaming the system to keep the old text. If the panel finds itself spending 80 minutes debating the nuance of a single modal verb rather than the evidence, the procedure has become bureaucratic friction rather than epistemic hygiene. It must also be withdrawn if it systematically silences marginalized narratives *more* than dominant ones (e.g., if "Western" claims get calibrated via texts while "Indigenous" claims get blocked by lack of texts, unless the Hand-Off is rigorously applied).

  **2. The Mechanical Gate (Risk of Absurdity)**
  **Gate 4 (Symmetry Test)** is the most likely to produce absurdity if applied mechanically. Modern analogues are never perfect isomorphs. A modern household does not have the same ontological categories as a Bronze Age temple. If the panel rejects "ritual deposition" because "my neighbor throws junk in the creek," they are committing a category error. This step requires philosophical judgment, not just matching. It risks becoming a "Gotcha" game rather than a validity check.

  **3. The Judgment Call Wearing Procedural Dress**
  **Gate 5 (Residual Category Check)** is the most subjective. Distinguishing between "we don't know what it does, so it's ritual" and "we know it doesn't do work, so it's ritual" is often a matter of curator intuition. The procedure forces this intuition into a binary pass/fail, but the underlying assessment is still a "feel" for the material. This is where the philosopher's scrutiny is most needed, but also where the panel is least equipped.

  **4. What Would Upgrade the Blocked Claims?**
  *   **Indus Weights:** A text listing penalties for weight tampering; or a findspot where weights are stored exclusively in a building with administrative tablets and no domestic debris (differential access).
  *   **River Bronzes:** A contemporary text describing the rite; or an iconographic depiction of a figure throwing a sword into water with a divine recipient visible.
  *   **Wooden Regalia:** Nothing archaeological can upgrade this. Only the continuity of the community's authority can sustain it, which is why the Hand-Off is the only valid move.

  **5. The Upshot**
  If I am honest: **Yes, the upshot of this procedure is that a museum should mostly stop attributing specific beliefs and institutions on its labels.**
  It will force you to replace "This was a temple" with "This building has features often associated with gathering." It will replace "They believed in a Mother Goddess" with "Figurines of women are common; their meaning is debated."
  This will make labels less authoritative, less story-driven, and more tentative.
  **This is the correct outcome.**
  The museum is not a book of answers; it is a collection of questions materialized. By stripping the unearned certainty, you return the visitor to the object, rather than to the curator's confidence. The damage done by false certainty (nationalist myths, colonial justifications) outweighs the boredom of uncertainty. If the procedure works, your labels will look more like philosophy and less like propaganda. That is a feature, not a bug.
