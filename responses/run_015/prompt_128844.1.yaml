answer: |-
  This is a surprisingly sophisticated position for a bar argument. You have essentially reconstructed a version of **Liberal Egalitarianism** (close to John Rawls or Elizabeth Anderson) without realizing it. Your views are *mostly* coherent, but there is one major fault line that your friend likely spotted.

  Here is the breakdown of your coherence, the specific tensions you asked about, and the ranking of your philosophical problems.

  ### 1. Do these hang together?
  **Verdict:** Yes, but only if you make a sharp distinction between **Moral Desert** (praise/blame) and **Economic Entitlement** (pay/positions).

  *   **Commitments (1) & (4)** are about *Moral Agency*. You believe people deserve praise or blame based on what they control (effort/choice).
  *   **Commitments (2) & (3)** are about *Distributive Justice*. You believe the economic pie shouldn't be sliced based on things people don't control (talent/family money).

  **The Coherence Check:** You are coherent as long as you admit that **high salaries in a meritocracy are not "rewards for moral virtue."** They are functional entitlements designed to put the right people in the right jobs. If you claim the CEO *morally deserves* their bonus because they are smart, you contradict (3). If you claim they are *entitled* to it because the system needs incentives, you are consistent.

  ### 2. Addressing Your Specific Questions

  **Q: If I reject undeserved talent rewards in (3) but defend meritocratic pay in (2), am I smuggling desert in through the backdoor?**
  **A:** **Yes, potentially.** This is your biggest risk.
  "Meritocratic pay" usually means "pay based on productivity." Productivity is heavily dependent on talent (which you admit is luck in (3)).
  *   **The Contradiction:** If Pay = Desert (from 1), and Talent = Luck (from 3), then Pay based on Talent = Unjust.
  *   **The Fix:** You must argue that Meritocratic Pay (2) is **forward-looking** (incentives/efficiency), not **backward-looking** (desert). You can defend the *system* of meritocracy without believing the *individual* morally deserves the specific dollar amount they earn. If you insist the high earner *deserves* that money because they produced more, you are smuggling desert in.

  **Q: Does the 'striver premium' clash with (3)?**
  **A:** **No, this is an apparent tension only.**
  In fact, the "striver premium" *requires* (3) to make sense.
  *   **Why:** If talent were deserved, then someone born smart wouldn't need "extra credit" for working hard; they would just be getting what they already deserve.
  *   **The Logic:** The striver premium works because you acknowledge the baseline talent is a lottery win (3). Therefore, the *only* thing that generates extra desert is the **effort** applied against the odds. This aligns perfectly with (4) (effort/choice matter). The premium rewards the *overcoming*, not the *talent*.

  **Q: Is my rejection of luck egalitarianism (5) compatible with caring about responsibility (1)?**
  **A:** **Yes, but it requires nuance.**
  Luck Egalitarianism (LE) says: *Inequalities due to luck are unjust; inequalities due to choice are just.*
  *   **Your View:** You care about responsibility (1), but you don't think *every* luck gap is unjust (5).
  *   **Compatibility:** You can believe responsibility is necessary for **blame/praise** (moral sphere) without believing the state must compensate for **every instance of bad luck** (political sphere). For example, you might think privacy or liberty is more important than equalizing all luck.
  *   **The Tension:** It is slightly tense because usually, if you care deeply about responsibility (1), you tend toward LE. To reject LE (5) while keeping (1), you need a "threshold" view (e.g., "Make sure everyone has enough, but don't worry about luck gaps above that threshold").

  ---

  ### 3. Ranking the Tensions by Severity

  Here are the conflicts in your web of beliefs, ranked from "System Crash" to "Philosophical Quibble."

  **1. SEVERE: The "Merit Pay" Paradox [(1) + (2) + (3)]**
  *   **The Clash:** You say desert is backward-looking (1). You say talent is luck/undeserved (3). But you say meritocratic pay is okay (2).
  *   **Why it's severe:** In the real world, "meritocratic pay" rewards productivity, which relies on talent. If you pay people based on productivity, you are rewarding luck. If you claim they *deserve* that pay (1), you violate (3).
  *   **Status:** This is the hypocrisy your friend likely sensed. You are justifying economic inequality using "desert" while admitting the basis of that inequality is "luck."

  **2. MODERATE: Responsibility vs. Luck [(1) vs. (5)]**
  *   **The Clash:** You care about responsibility (1) but won't fix all luck gaps (5).
  *   **Why it's moderate:** It's not a contradiction, but it lacks a principle. *Why* are some luck gaps okay and others not? If responsibility matters for desert, why doesn't it matter for all distribution? You need a bridging principle (like "Sufficiency" or "Social Stability") to explain why you stop caring about luck at a certain point.

  **3. APPARENT ONLY: Striver Premium vs. Talent Lottery [(3) vs. Striver]**
  *   **The Clash:** You think talent is luck (3), but strivers get extra desert.
  *   **Why it's apparent:** As noted above, these support each other. The striver premium is the *exception* that proves the rule. It highlights that only the *effort* component is deserved, confirming that the *talent* component is not.

  ---

  ### 4. The "Cheapest" Commitment to Drop

  If you want to save the rest of your worldview (specifically the intuitive moral judgments in 3 and 4, and the practical economics in 2), you should **drop or modify Commitment (1).**

  **Commitment (1):** *"Desert is backward-looking and based on genuine moral responsibility, not just on forward-looking incentives."*

  **Why drop this?**
  This is the standard move made by John Rawls and modern social democrats.
  1.  **It saves (2) & (3):** You can argue that high pay for talented people is **not deserved** (backward-looking) but is **entitled** (forward-looking incentives). You pay the smart doctor more not because they are a *better person*, but because we need incentives to train smart doctors. This admits talent is luck (3) but keeps meritocracy functional (2).
  2.  **It saves (4):** You can keep backward-looking desert for **moral praise and blame** (praising hard work, blaming cheaters) while denying it applies to **economic distribution**.
  3.  **It saves (5):** It explains why you reject Luck Egalitarianism. You aren't trying to make distribution match moral desert; you are trying to make society function fairly.

  **The Alternative:**
  If you refuse to drop (1), you must drop **(3)** (claim people *do* deserve their talents). This turns you into a Libertarian. It is philosophically cleaner but intuitively much harder to defend (do you *really* deserve your DNA?).

  **Summary Advice for the Next Argument:**
  Tell your friend: *"I don't think rich people morally deserve their money because of their talent. I think they are entitled to it because incentives are necessary for society to function. But I still think we should tax the luck part to help those who lost the lottery."* That resolves the hypocrisy charge immediately.
