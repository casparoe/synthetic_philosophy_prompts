  9.  **Final Review against Safety Guidelines:** Does this encourage rule-breaking? I should advise *advocating* for change or finding loopholes within the rules (like adding context), not explicitly telling them to forge documents. I must remain neutral on the specific action but analyze the ethics. *Correction:* I can suggest that "adding context" might not violate "editing the original reason."

      *(Self-Correction during drafting)*: Be careful not to tell the volunteer to disobey. Frame it as "ethical advocacy."

