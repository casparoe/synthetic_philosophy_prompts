  ### The Case: The Palliative Care Dilemma

  You are the lead physician at a hospice clinic managing a terminal patient in agonizing pain. You have three options: **(A)** Administer a high dose of morphine to eliminate pain, foreseeing that it will likely suppress respiration and hasten death by a few hours; **(B)** Maintain the current low dose, ensuring the patient remains in severe pain until they die naturally in the same timeframe; or **(C)** Administer a high dose of morphine with the *explicit intention* of ending the patient's life to stop the suffering. You are torn between **Act Utilitarianism ($T_U$, 55% credence)**, which maximizes net welfare (pain relief minus life lost), and the **Doctrine of Double Effect ($T_{DDE}$, 45% credence)**, which permits foreseen harm for a good end but forbids intended harm (killing). $T_U$ sees A and C as outcome-identical and superior to B; $T_{DDE}$ ranks B as best (allowing), A as permissible but dispreferred (foreseeing), and C as forbidden (intending).

  ***

  ### Analysis of the Decision Problem

  **1. The Verdicts (Generated from Theory)**
  *   **$T_U$ (Utilitarianism):** Values are determined by pain relief (+100 units) and life duration (-10 units).
      *   **A:** Relief (+100) - Life (-10) = **90**.
      *   **B:** No Relief (0) - Life (0) = **0**.
      *   **C:** Relief (+100) - Life (-10) = **90**.
      *   *Ranking:* A $\sim$ C > B.
  *   **$T_{DDE}$ (Double Effect):** Values are determined by adherence to the "Do Not Kill" constraint.
      *   **B:** Permissible omission. **0**.
      *   **A:** Permissible action with bad side effect. **-1,000**.
      *   **C:** Forbidden intentional killing. **-100,000**.
      *   *Ranking:* B > A > C.

  **2. The Normalization Flip**
  *   **Method 1: Internal Range Normalization** (Scale each theory so its Best Option = 1, Worst = 0 in *this* case).
      *   $T_U$: Range is 90 (A) to 0 (B). Normalized: A=1, B=0, C=1.
      *   $T_{DDE}$: Range is 0 (B) to -100,000 (C). Normalized: B=1, A=0.99, C=0. (Note: Because C is so much worse than A for $T_{DDE}$, A looks "almost as good as B" on a 0-1 scale).
      *   **MEC Calculation:**
          *   **A:** $0.55(1) + 0.45(0.99) = 0.55 + 0.4455 = \mathbf{0.9955}$.
          *   **B:** $0.55(0) + 0.45(1) = \mathbf{0.45}$.
      *   **Result:** **Choose A.** (Aligns with your favourite theory, $T_U$).
  *   **Method 2: External Benchmark Normalization** (Fix scales by a shared unit, e.g., "1 unit of suffering").
      *   Assume a lexical priority: One violation of "Do Not Kill" is worth 1,000 units of suffering.
      *   $T_U$: Gap (A vs B) = 90 welfare units.
      *   $T_{DDE}$: Gap (A vs B) = 1,000 rights units = 1,000,000 welfare units.
      *   **MEC Calculation:**
          *   **A:** $0.55(90) + 0.45(-1,000,000) \approx \mathbf{-450,000}$.
          *   **B:** $0.55(0) + 0.45(0) = \mathbf{0}$.
      *   **Result:** **Choose B.** (Aligns with your less confident theory, $T_{DDE}$).

  **3. What the Rules Say**
  *   **MEC (Range):** Chooses **A**. The presence of Option C stretches $T_{DDE}$'s internal scale so massively that the difference between A and B shrinks to near-zero *relative to the range*, allowing $T_U$'s higher credence to dictate the choice.
  *   **MEC (External):** Chooses **B**. The absolute moral weight of the doing/allowing distinction overwhelms the welfare gains.
  *   **My-Favourite-Theory (MFT):** Chooses **A**. Since $T_U$ has 55% credence, MFT simply follows $T_U$'s ranking.
  *   **Moral Hedging / Probability Matching:** A hedging rule might suggest a mixed strategy or choosing the "safe" option B to avoid the catastrophic risk of violating a constraint, even if expected value (Range) favors A.

  **4. The Feature Doing the Work**
  The **"Stretch Option" (Option C)**.
  Option C is morally catastrophic for $T_{DDE}$ but morally equivalent to A for $T_U$. In Range Normalization, C acts as an anchor that drags $T_{DDE}$'s "worst" point far away, compressing the distance between A and B. This makes $T_{DDE}$ appear "indifferent" between A and B in the context of this specific menu, ceding decisive power to $T_U$. In External Normalization, C's magnitude is irrelevant to the A vs B comparison; only the absolute gap between A and B matters, where $T_{DDE}$ is intense.

  **5. Does the Flip Survive a Shared Partition?**
  **Yes.** Even if you force both theories to describe the options physically (e.g., "Inject 10ml"), the theories still assign different *values* to those descriptions based on unobservable mental states (intent). $T_{DDE}$ assigns a massive negative disvalue to the physical act *under the description* "intending death." Unless you strip intent from the case entirely (which breaks $T_{DDE}$'s ability to function), the cardinal disagreement remains. The flip is driven by the *ratio of value differences*, not the labeling of the acts.

  **6. The Best Pushback for MEC**
  *"Variance (or Range) Normalization is the only coherent standard for moral uncertainty (MacAskill 2014). Your 'External Benchmark' is arbitrary smuggled intuition. If $T_{DDE}$ truly views C as 100x worse than A, then in this decision context, A really is negligible compared to the risk of C. MEC-Range correctly identifies that A is 'safe enough' relative to the available alternatives. If you want B to win, your credence in $T_{DDE}$ should have been higher, not your normalization method."*

  **7. Structural Condition for Normalization Agreement**
  **Cardinal Isomorphism.**
  If the two theories are cardinally isomorphic over the option set—meaning for all options $x, y, z$, the ratio of value differences is constant ($\frac{v_1(x)-v_1(y)}{v_1(y)-v_1(z)} = \frac{v_2(x)-v_2(y)}{v_2(y)-v_2(z)}$)—then no matter how you scale or normalize the theories, the expected choiceworthiness ranking will remain identical. In plain English: **If the theories agree on the relative "distances" between options, normalization cannot change the verdict.**
