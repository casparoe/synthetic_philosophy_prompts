      *   *Candidate 3: Light (Particle vs. Wave).* Newton vs. Huygens. Good, but can get too technical.
      *   *Candidate 4: The Phlogiston vs. Oxygen Debate (Lavoisier vs. Priestley/Cavendish).*
          *   *Winner:* Lavoisier (Oxygen).
          *   *Loser:* Priestley (Phlogiston).
          *   *Written Reasons:* Yes, extensive correspondence and publications.
          *   *Sense on own terms:* Phlogiston explained combustion and calcination consistently for a century.
