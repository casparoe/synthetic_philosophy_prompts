          *   Address the "vocabulary necessity" objection (presentism is compulsory).
          *   Define what to *refuse* to cover.
          *   Define the assessment (how to know it landed).

  2.  **Deconstruct the "Whig" Problem for Grad Students:**
      *   *The Trap:* They think Whig history is a *tone* problem (condescension). It's actually a *causal* problem (teleology).
      *   *The User's Hypothesis:* Start with the "hindsight filter" (the record is filtered by winners).
      *   *My Critique:* Is that the *first* thing? If I start with "the record is biased," they might think the solution is "find the loser's voice." But Whiggism persists even when you have the loser's voice if you interpret the loser's voice *only* as a step toward the winner.
      *   *Better Entry Point:* Start with the *question*. Whig history isn't just about the answer; it's about the question asked. If the question is "How did we get X?", the answer will always be a story about getting X.
      *   *Revised Order:* 1. The Question determines the Narrative (Teleology). 2. The Archive is a Consequence of the Outcome (Hindsight Filter). 3. The Vocabulary Trap (Presentism).
      *   *Wait, let's look closer at the User's "Hindsight Filter".* They say: "the record itself is downstream of who won." This is crucial. If we only study phlogiston because Lavoisier won, we see phlogiston as a mistake. But if we study phlogiston because it was the dominant chemistry of 1770, we see it as a tool.
      *   *Decision:* The User is right that the *archive* issue is foundational, but it lands better if framed as *why we are looking at what we are looking at*. Let's refine the "Order" section to validate their intuition but sharpen the mechanism. It's not just that the record is filtered; it's that our *curiosity* is filtered.

