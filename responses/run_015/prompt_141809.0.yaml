answer: |-
  Here is the plan. It is designed to be tight, provocative, and methodological rather than historiographical. We are not teaching them *what* happened; we are teaching them how to construct a sentence about what happened.

  ### 1. The Order: Where to Start
  You are half-right about the "hindsight filter," but if you lead with it, you risk turning this into a lesson about *archives* rather than *narrative*. If they think the problem is just that "losers' papers get thrown away," they will believe the solution is simply "find the losers' papers." But you can have every letter Priestley ever wrote and still write a Whig history of chemistry.

  **The dependency needs to be flipped.**
  1.  **First (The Hook): The Teleological Question.** You must start by showing them that Whiggism enters the room before they even open a file. It enters in the *title of their dissertation*. If the question is "How was oxygen discovered?", the answer *must* be a story of progress toward oxygen.
  2.  **Second (The Mechanism): The Hindsight Filter.** *Then* you layer in your point. Because we ask teleological questions, we value the records that look like "steps" toward the answer. The archive isn't just accidentally filtered; it is filtered *by our curiosity*.
  3.  **Third (The Tool): The Vocabulary Trap.** Only after they see the narrative structure do you hit them with the linguistic constraint.

  **Why this order?** If you start with the archive (your instinct), they think the solution is *more research*. If you start with the question, they realize the solution is *different framing*. That is a methodological shift they can use immediately.

  ### 2. The One Example: Priestley vs. Lavoisier (The Phlogiston Debate)
  Drop the Columbus/Flat Earth myth. It is too easy. It allows students to feel superior ("I know that's false") without engaging the structural problem. It makes Whiggism about *factual error* rather than *narrative structure*.

  **Use the Chemical Revolution (1770s–1780s).**
  *   **The Winner:** Antoine Lavoisier (Oxygen theory).
  *   **The Loser:** Joseph Priestley (Phlogiston theory).
  *   **The Moment:** 1774. Both men isolate the same gas.
  *   **Why it works:**
      *   **Coherence:** Phlogiston wasn't "stupid." It explained combustion, calcination, and respiration consistently for a century. Priestley's reasons survive in writing and make perfect sense *if* you accept his premises.
      *   **Low Moral Stakes:** It's about air and fire. No genocide, no eugenics. Students won't get distracted by moral outrage.
      *   **The Whig Trap:** The standard sentence is: *"Priestley discovered oxygen but failed to understand its significance."*
      *   **The Anti-Whig Move:** *"Priestley isolated a gas he understood as 'dephlogisticated air,' which functioned perfectly within his explanatory system until Lavoisier proposed a new taxonomy."*

  **What it costs you:** You have to spend 10 minutes explaining phlogiston without getting bogged down in chemistry.
  **The Fix:** Do not teach the chemistry. Teach the *logic*.
  *   *Phlogiston:* Fire is a substance inside things. Burning releases it. Ash is what's left.
  *   *Oxygen:* Fire is a reaction with air. Burning takes something from the air.
  *   *The Crucial Detail:* Priestley actually isolated the gas first. But because he was looking for "air without phlogiston," he didn't see it as a new element. Lavoisier saw it as a new element.
  *   **The Lesson:** Priestley didn't "miss" the truth; he found exactly what he was looking for. Lavoisier changed what people were looking for.

  ### 3. The Misconceptions: Sequence and Defusal
  Here is where you place the defusal of the three specific errors you expect.

  **A. The Relativism Slide ("So all history is propaganda.")**
  *   **When:** Immediately after you explain Phlogiston. Someone will say, "But phlogiston isn't real. Are we saying science is just stories?"
  *   **The Trigger Sentence:** When you say, "Priestley's system made sense on its own terms."
  *   **The Defusal:** "We are not judging the *truth* of the claim; we are judging the *coherence* of the practice. You can acknowledge that phlogiston does not exist without claiming Priestley was irrational. History of science is not a courtroom verdict; it's an ethnography of reasoning."

  **B. The Flattering Presentism ("They were secretly one of us.")**
  *   **When:** During the case study discussion. A student will say, "But Priestley was *close* to the modern view."
  *   **The Trigger Sentence:** When a student tries to rescue Priestley's status by claiming he "almost got it."
  *   **The Defusal:** "That is the Whig move in a tuxedo. You are still measuring him by *our* metric. He didn't want to be us. He wanted to be a good 18th-century natural philosopher. Crediting him with anticipating us steals his agency just as much as calling him primitive does."

  **C. The Context Padding ("Just add 'In the 18th century...'" )**
  *   **When:** Near the end, before the assessment.
  *   **The Trigger Sentence:** When you ask them to fix a Whig sentence and they just add a date or a cultural qualifier.
  *   **The Defusal:** "Context is not a shield. If the spine of the sentence is 'Priestley failed to see X,' adding 'In 1774...' doesn't fix the teleology. You have to change the *verb*, not the adverb."

  ### 4. The Vocabulary Objection ("You can't speak without present terms")
  *   **Where:** Put this **after** the Case Study but **before** the Assessment. It is the pivot point.
  *   **The Move:** Do not dodge it. Agree with them. "You are right. We cannot speak 18th-century chemistry. We speak 21st-century chemistry."
  *   **The Sharpening:** Introduce the distinction between **Reference** and **Sense**.
      *   *Reference:* We can use the word "oxygen" to point to the stuff in the bottle Priestley held. (This is unavoidable).
      *   *Sense:* We cannot attribute the *concept* of oxygen to Priestley. (This is the discipline).
      *   *The Rule:* "You may use present vocabulary to *identify* the object, but never to *describe* the actor's relationship to the object."
      *   *Example:* "Priestley held oxygen" (OK, reference). "Priestley knew he held oxygen" (Fail, sense). "Priestley held what we call oxygen" (Best, explicit distinction).
  *   **Why this lands:** It gives them a technical tool to solve the philosophical problem. It stops the "well, everything is interpretation" collapse by giving them a rule for *how* to interpret.

  ### 5. The Refusal: What to Cut
  You have 80 minutes. You must explicitly name what you are *not* doing, or they will assume you are ignoring it out of ignorance.

  *   **The Refusal:** "We are not doing **Epistemology** today."
  *   **Say this out loud:** "I am not asking you to decide if science converges on Truth. I am not asking you to solve the problem of realism vs. relativism. If you find yourself arguing about whether phlogiston was 'really' false, you have left the room. We are studying the *grammar of historical explanation*, not the *ontology of chemical kinds*."
  *   **Why:** This prevents the session from devolving into a philosophy of science seminar. It keeps the focus on *writing* and *method*.

  ### 6. The Assessment: How to Know It Landed
  Do not ask them to "identify the Whiggism." That allows them to circle a word like "primitive" and feel done. You need to force them to *restructure* the thought.

  **The Task (15 minutes):**
  Hand out a slip of paper with this single paragraph (unseen until now):

  > "Although early microscopists like Leeuwenhoek lacked the lens technology to see bacteria clearly, they laid the groundwork for Pasteur by documenting 'animalcules' that would eventually be understood as germs. Their observations were imperfect, but they pointed the way toward the germ theory of disease."

  **The Instruction:**
  "Rewrite the **second sentence** only. You must keep the facts (Leeuwenhoek saw animalcules, Pasteur later linked them to disease). You must remove the **teleological spine**. You cannot use the words 'primitive,' 'wrong,' 'hero,' or 'villain.'"

  **What you are looking for (The Grading Key):**
  *   **Fail (Whig):** "Although their tools were limited, they correctly identified the pathogens that Pasteur later named." (Still implies they were aiming for Pasteur's truth).
  *   **Fail (Context Padding):** "In the 17th century, Leeuwenhoek documented animalcules that later became germ theory." (Still makes Leeuwenhoek a stepping stone).
  *   **Pass (Structural Shift):** "Leeuwenhoek documented 'animalcules' within a framework of spontaneous generation, a category that Pasteur later dismantled and reclassified as bacteria."
      *   *Why it passes:* It makes Leeuwenhoek coherent in his own time ("framework of spontaneous generation"). It makes the connection to Pasteur a *reclassification* by the later actor, not a *goal* of the earlier actor.

  **How you'll know it landed:**
  If more than half the class changes the *subject* of the sentence from "Their observations" (implied trajectory) to "Leeuwenhoek" or "The category of animalcules" (static description), you have won. If they keep the subject as "Their observations" but just swap adjectives, they haven't got it.

  ### Session Timeline (80 Minutes)

  *   **00–10:** **The Question.** Open with: "Write down the title of the project you want to do." Ask two students. Point out the teleology in their titles ("The Discovery of...", "The Evolution of..."). Introduce the **Teleological Question** as the primary vector of Whiggism.
  *   **10–35:** **The Case (Priestley/Lavoisier).** Walk through the gas isolation. Show the Whig sentence ("Priestley discovered oxygen but..."). Ask them to diagnose why it feels wrong. Introduce the **Hindsight Filter** (we call it oxygen because Lavoisier won).
  *   **35–50:** **The Vocabulary Intervention.** Raise the objection: "But we can't speak without 'oxygen'." Teach **Reference vs. Sense**.
  *   **50–60:** **Misconception Speed-Run.** Briefly flag Relativism, Flattering Presentism, and Context Padding using the defusal scripts above.
  *   **60–75:** **The Assessment.** Hand out the Leeuwenhoek paragraph. They write. You circulate and look at their verbs.
  *   **75–80:** **The Refusal & Close.** State the Epistemology Refusal. Collect the papers. Dismiss.

  This plan respects their intelligence, avoids moralizing, and gives them a concrete syntactic tool to fix the problem you've identified.
