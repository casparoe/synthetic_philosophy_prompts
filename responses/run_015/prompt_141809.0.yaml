      *   *Selection:* **Lavoisier vs. Priestley (The Air Revolution).** It's the bread and butter of HOS, but if handled *only* as a narrative exercise, it works. It avoids the "Flat Earth" triviality.
      *   *Wait, one more option:* **The discovery of Neptune (Le Verrier vs. Adams).**
          *   *Winner:* Both credited, but different national narratives.
          *   *Loser:* None really.
      *   *Let's stick with Lavoisier/Priestley.* It's the strongest for "competing coherent systems." I need to make sure I don't get bogged down in chemistry. Focus on the *explanation of combustion*.
      *   *Actually, let's consider the "Neptune" angle or "Uranus".* No, too much math.
      *   *How about the "Discovery of Vitamins" vs. "Protein deficiency"?* No.
      *   *Let's go with **Phlogiston**.* It's the canonical example for a reason. I will advise the user to use it but *strictly* limit the chemistry to "burning things."
      *   *Wait, User said:* "What it needs to lack: heavy moral stakes." Phlogiston is safe.
      *   *Wait, User said:* "Pick that [Columbus], or argue for something better." I will argue for **Priestley vs. Lavoisier**. Columbus is a trap because it invites "debunking myths" rather than "analyzing narrative structure." Phlogiston invites "analyzing explanatory coherence."

  4.  **Address the Misconceptions:**
      *   *Relativism ("All is propaganda"):* Defuse by emphasizing *coherence* over *truth*. We aren't saying Phlogiston is true; we're saying it was *useful*.
      *   *Flattering Presentism ("They knew it all along"):* Defuse by showing Priestley *rejected* Oxygen. He didn't anticipate Lavoisier; he fought him.
      *   *Context Padding:* Defuse by showing that adding "18th century was different" doesn't fix a narrative that asks "Why did Priestley fail to find Oxygen?"

  5.  **Address the "Vocabulary" Objection:**
      *   "You can't describe past views without present vocabulary."
      *   *Placement:* Middle of the session, after the case study is introduced but before the final exercise.
      *   *Resolution:* Distinguish between *reference* (talking about the same stuff) and *sense* (what they meant by it). We can use "oxygen" to refer to the gas, but we must not attribute the *concept* of oxygen to Priestley.

  6.  **Refuse to Cover:**
      *   *The Sociology of Scientific Knowledge (SSK) / Strong Programme.* Too deep.
      *   *Kuhn's Structure.* Too much baggage.
      *   *Internalism vs. Externalism.* Too abstract.
      *   *Refusal:* "We are not doing epistemology today. We are not asking if science gets at Truth. We are asking how you write a sentence."

  7.  **Assessment:**
      *   Unseen passage. Needs to be a paragraph that looks neutral but has a Whig spine.
      *   Task: Rewrite one sentence to remove the teleology without changing the facts.
      *   Why this works: Forces them to manipulate the *structure*, not just identify "bad words."

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Opening (10 min):* The "Hindsight Filter." Validate the user's intuition. The archive is a crime scene where the body was moved.
      *   *Case Study (30 min):* Priestley/Lavoisier. Handout with two quotes. One from Priestley defending phlogiston, one from Lavoisier.
      *   *The "Vocabulary" Intervention (15 min):* Address the "you can't speak without present terms" objection.
      *   *Misconception Check (10 min):* Rapid fire on Relativism, Flattering Presentism, Context Padding.
      *   *Assessment (15 min):* The Rewrite Task.
      *   *Close (5 min):* The "Refusal."

      *Wait, timing is tight.* 80 minutes.
      *   Intro: 10
      *   Case: 25
      *   Vocab/Misconceptions: 20
      *   Assessment: 20
      *   Close: 5
      *   *Adjustment:* Merge Misconceptions into the Case discussion. Don't make them a separate lecture block. Trigger them when they arise.

      *Refining the "Order":* The user asks if "Hindsight Filter" is the right first step.
      *   *My thought:* Yes, but frame it as **"The Problem of the Question."** Before you look at the evidence, look at the question you are asking the evidence. If you ask "How did we discover oxygen?", Priestley *must* be a failure. If you ask "How did 18th-century chemists explain combustion?", Priestley is a success.
      *   *So:* 1. The Question (Teleology). 2. The Evidence (Hindsight Filter). 3. The Language (Vocabulary).

      *Refining the Assessment:* "Rewrite one sentence." Is that enough? Maybe "Identify the hidden telos." No, "Rewrite" forces action. Let's make it: "Identify the assumption about the endpoint, then rewrite the opening clause."

      *Refining the Case:* I need to make sure the user knows *how* to teach Phlogiston without getting bogged down. Keep it to: "Things burn. Where does the fire go?" Phlogiston = Fire stuff inside. Oxygen = Air stuff outside.
      *   *Crucial Detail:* Priestley discovered the gas (dephlogisticated air) but interpreted it as *excellent* phlogiston air. Lavoisier interpreted it as a distinct element.
      *   *The Whig Sentence:* "Priestley discovered oxygen but failed to realize its significance."
      *   *The Anti-Whig Sentence:* "Priestley isolated a gas he understood as air depleted of phlogiston, which Lavoisier later reclassified as a distinct element."

  9.  **Final Polish:**
      *   Tone: Collegial, sharp, experienced.
      *   Structure: Follow the user's prompt headers (Order, Example, Misconceptions, Vocab, Refusal, Assessment).
      *   Check constraints: No readings assigned. All in room.

      *(Self-Correction during drafting)*: I need to be careful about the "Hindsight Filter." The user calls it "the record itself is downstream of who won." This is slightly different from "Teleology." Teleology is the *narrative arc*. The Filter is the *survival of documents*. Both are Whiggish.
      *   *Argument:* Start with Teleology (The Question). Why? Because even if you have *all* the documents (no filter), you can still write a Whig history by asking the wrong question. The Filter is a subset of the Teleology problem.
      *   *Pivot:* I will tell the user that their "Hindsight Filter" is actually the *second* step. The *first* step is the **Teleological Question**. You have to show them that *they* are generating the Whiggism by their choice of research topic, before you show them the archive is biased.
      *   *Wait, actually:* The user's intuition is strong. "The record is downstream." If I start with "Don't ask teleological questions," they say "But how else do I choose a topic?" If I start with "The archive is already sorted," it explains *why* the teleological question feels so natural.
      *   *Decision:* I will validate the "Hindsight Filter" but rename it **"The Survival Bias of Success."** It lands first because it explains *why* the Whig narrative feels true (because the winners' categories are the ones we inherit).

      *Let's finalize the Case:* **Priestley vs. Lavoisier** is the best fit. It meets all criteria. I will explicitly warn about the "chemistry trap."

      *Let's finalize the Assessment:* A paragraph about the "discovery of the asteroid Ceres." Piazzi vs. Bode. Or maybe stick to the Phlogiston theme for consistency? No, unseen passage should be new topic to test transfer. **The discovery of the planet Neptune** is good. "Adams and Le Verrier calculated the position..." vs "Astronomers sought to explain Uranus's orbit..."
