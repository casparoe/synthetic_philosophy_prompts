          *   *Moral Stakes:* Low. It's about air and fire, not race or life/death directly.
          *   *Why it works:* It allows us to see Priestley not as "wrong" but as "coherent within a different system." It exposes the Whig spine: "Priestley failed to see oxygen" vs. "Priestley successfully explained weight gain via phlogiston having negative weight (or similar)."
          *   *Cost:* Requires explaining basic chemistry concepts quickly.
          *   *Benefit:* It's the classic Kuhn/Conant case, but can be stripped of the "paradigm shift" jargon to focus on the *narrative structure*.
