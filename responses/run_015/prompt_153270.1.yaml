      *   *Check:* Is the roommate completely wrong about hagiography? Plutarch *does* want to inspire. But "hagiography" implies sanctity and suppression of sin. Plutarch implies *paideia* (education) through realistic portrayal. I need to distinguish between *exemplarity* and *hagiography*.
