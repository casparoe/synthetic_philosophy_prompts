answer: |-
  Your intuition is spot-on. While your roommate has grasped the broad *purpose* of Plutarch's project, his summary of the *method* and *nuance* is a mix of outdated scholarship, oversimplification, and flat-out error. He is treating Plutarch like a Victorian moralist or a Christian hagiographer, rather than a Middle Platonist philosopher of the 1st/2nd century CE.

  You are right to be suspicious about the "hiding flaws" claim. If Plutarch hid flaws, the *Parallel Lives* would be boring. They are fascinating precisely because they are psychologically realistic.

  Here is a breakdown of your roommate's claims, graded on accuracy, with the scholarly context you need to win the argument.

  ### 1. Claim: "Plutarch pairs lives not to do history but to build moral mirrors."
  *   **Verdict:** **Accurate.**
  *   **The Nuance:** Plutarch explicitly states this in his *Life of Alexander*. He writes, "I am writing Lives, not Histories." He cares less about battle formations and political chronologies and more about the *ēthos* (character) of the man. He believes small actions (a joke, a dinner conversation, a moment of anger) reveal character better than great sieges.
  *   **Where your roommate is right:** The primary goal is ethical instruction (*paideia*).
  *   **Where he misses:** This doesn't mean he ignores facts; it means he selects facts *for* their moral significance.

  ### 2. Claim: "He curates each life... as either a pure exemplar of virtue or a clear cautionary tale... hides moral ambiguity... like hagiography."
  *   **Verdict:** **Wrong.** (This is your strongest point).
  *   **The Nuance:** This is the biggest error in your roommate's summary. Plutarch is not a Christian hagiographer (who wrote centuries later to prove sanctity). Plutarch is a Platonist. He believes the soul is a battleground of reason and passion.
  *   **Evidence:**
      *   **Alcibiades:** As you suspected, Alcibiades is not a "pure exemplar." He is brilliant, charismatic, and patriotic, but also vain, treacherous, and reckless. Plutarch shows us why Athens loved and hated him.
      *   **Demetrius & Antony:** In this pairing, both men are "flawed." They are great commanders ruined by *eros* (passion/lust). Plutarch does not present them as simple "warnings"; he presents them as tragedies of wasted potential. He expresses genuine pity for them.
      *   **Cato the Younger:** Often seen as a stoic hero, but Plutarch subtly critiques his rigidity and lack of political flexibility, suggesting his virtue was too hard for the real world.
  *   **The Takeaway:** Plutarch believes you learn *more* from flawed heroes than perfect saints. Seeing how a great man fails is more instructive than seeing a perfect man succeed. He does not suppress ambiguity; he highlights it to show how difficult virtue is.

  ### 3. Claim: "The reader is supposed to pick a hero and copy him exactly."
  *   **Verdict:** **Wrong.**
  *   **The Nuance:** Plutarch discusses emulation (*mimēsis*) in his moral essays. He does not want rote copying. He wants the reader to internalize the *principle* behind the action.
  *   **Example:** You shouldn't copy Alexander by invading Persia; you should copy Alexander's *magnanimity* toward a defeated enemy. Context matters. Plutarch expects the reader to use practical wisdom (*phronesis*) to apply the lesson, not follow a recipe.

  ### 4. Claim: "Parallel structure... proves Greek and Roman virtue are interchangeable universal types."
  *   **Verdict:** **Oversimplification.**
  *   **The Nuance:** The parallel structure (*synkrisis*) isn't about saying "Greeks = Romans." It's about creating a dialogue between the two cultures. Plutarch was a Greek living under the Roman Empire. He wanted to show his Greek audience that their heritage was still vital, while showing his Roman patrons that Greeks understood virtue just as well as they did.
  *   **The Reality:** Often, the pairing highlights *differences* in virtue. For example, in *Phocion/Cato Minor*, both are stoic patriots, but their political contexts make their virtues play out differently. Sometimes the Greek comes out ahead in wisdom; sometimes the Roman in power. They are not "interchangeable"; they are **comparable**.

  ### 5. Claim: "Modern historians don't take Plutarch seriously."
  *   **Verdict:** **Outdated (19th Century view).**
  *   **The Nuance:** In the 1800s, German philologists (like Theodor Mommsen) dismissed Plutarch because he wasn't "scientific" enough and made factual errors. They wanted raw data; Plutarch gave them literature.
  *   **Current Scholarship:** Since the 1970s, there has been a massive "Plutarchan Renaissance." Scholars like Christopher Pelling, Timothy Duff, and Judith Mossman have shown that Plutarch is a sophisticated literary artist. Historians still treat his *facts* with caution (he often gets dates wrong), but they take his *testimony on character and culture* very seriously. He is now considered one of the most important writers of the Imperial period.

  ### 6. Claim: "Ethical Stereoscopy... creates a 3D moral image... but only applies to virtuous pairs."
  *   **Verdict:** **Half-Right, Half-Wrong.**
  *   **The Term:** "Ethical stereoscopy" is a modern critical metaphor (likely derived from the work of **Timothy Duff** or **Christopher Pelling**). It refers to the idea that looking at two lives side-by-side creates depth perception. Just as two 2D images create a 3D view in a stereoscope, two Lives create a nuanced moral judgment that a single Life cannot.
  *   **The Error:** Your roommate is wrong that this *only* applies to virtuous pairs. The *synkrisis* (the formal comparison at the end of the pairs) exists for the "flawed" pairs too (e.g., *Demetrius/Antony* or *Alcibiades/Coriolanus*).
  *   **Why it matters:** Comparing two flawed men helps the reader calibrate *which* flaws are forgivable and which are fatal. It's not just "be like this guy"; it's "notice how Demetrius's lust was playful, but Antony's was destructive." That is stereoscopy in action, and it applies to vice as much as virtue.

  ### Summary for Your Argument

  You can tell your roommate this:

  1.  **On Hagiography:** He is projecting Christian saint-lives onto a pagan text. Plutarch's "mirrors" are not polished to hide wrinkles; they are polished to show the wrinkles *clearly*. If he wanted pure saints, he wouldn't have written the *Life of Alcibiades*.
  2.  **On Stereoscopy:** The "3D effect" works best when there is tension. If both men were perfect, there would be no depth. The moral calibration comes from weighing the *mix* of good and bad in both subjects.
  3.  **On Historians:** He is repeating a critique from 1890, not 2024. Modern classicists take Plutarch extremely seriously, just not as a source for battle dates.
  4.  **On Copying:** Plutarch wants active moral reasoning from the reader, not blind imitation.

  **The Scorecard:**
  *   **Roommate:** Got the *goal* right (moral instruction), but got the *method* (hagiography, hiding flaws) and the *reception* (historians' views) wrong.
  *   **You:** Your intuition about the flaws in Alcibiades and Demetrius is the key that unlocks the whole problem. Plutarch is a psychologist, not a preacher.

  You win this round. Tell him to read Christopher Pelling's "Plutarch's Method of Work in the Parallel Lives" if he wants to see how the "stereoscopy" actually works on the flawed pairs.
