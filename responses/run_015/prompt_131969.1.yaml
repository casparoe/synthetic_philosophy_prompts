prompt: |-
  In my course on value pluralism we have been working through Ruth Chang’s idea of hard choices and Raz’s account of incommensurability, and I am trying to understand an institutional split that seems to presuppose one view in one domain and reject it in another. In human-subjects research ethics, institutional review boards typically operate with what looks like a lexical veto structure: if a protocol violates informed consent or exposes participants to disproportionate risk, it is rejected outright, regardless of how large the expected scientific or social benefit might be. The harm and the good are not balanced on a common scale; they are evaluated on independent tracks with disqualifying conditions. By contrast, the same health systems often use cost-effectiveness analysis—cost per QALY, for instance—to aggregate lives saved and resources spent into a single metric for public-health funding decisions. What philosophical commitments about value comparison does this divergence presuppose? Does the IRB practice assume that autonomy and welfare are genuinely incommensurable, or does it merely reflect a practical refusal to compare them? Could a defender of hard choices endorse the lexical structure in research ethics while rejecting aggregation in health policy, or is the split just institutional convenience with no coherent philosophical basis? Reconstruct the implicit theory of value that licenses treating these two domains differently, distinguish what the practice strictly requires from what it merely accommodates, and say what would have to change in either practice if we replaced the implicit view with a consistently comparativist or consistently non-comparativist framework.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** Course on value pluralism, specifically Ruth Chang's "hard choices" and Joseph Raz's "incommensurability."
      *   **Observation:** An institutional split in bioethics/health policy.
          *   *Domain 1 (IRB/Human Subjects Research):* Lexical veto structure. Certain harms (violating consent, disproportionate risk) cannot be traded off against benefits (scientific progress). Looks like incommensurability or deontological constraints.
          *   *Domain 2 (Health Policy/Cost-Effectiveness):* Aggregative structure. QALYs (Quality-Adjusted Life Years) aggregate lives saved vs. resources spent. Looks like commensurability/utilitarianism.
      *   **Questions to Answer:**
          1.  What philosophical commitments about value comparison does this divergence presuppose?
          2.  Does IRB practice assume genuine incommensurability or just a practical refusal?
          3.  Could a defender of hard choices (Chang) endorse the split, or is it just incoherent convenience?
          4.  Reconstruct the implicit theory of value licensing the difference.
          5.  Distinguish what practice *requires* vs. *accommodates*.
          6.  What would change if we adopted a consistently comparativist or non-comparativist framework?

  2.  **Analyze the Philosophical Concepts:**

      *   **Raz (Incommensurability):** Values are incommensurable when they cannot be compared on a single scale of "betterness." It's not just epistemic uncertainty; it's a conceptual lack of a common measure. Often linked to rights or duties that block trade-offs.
      *   **Chang (Hard Choices/Parity):** Challenges the trichotomy (better, worse, equal). Introduces "parity" (on a par). Hard choices exist when options are comparable but not by a single metric of "betterness." Small improvements don't necessarily tip the scale (the "small improvement argument").
      *   **Lexical Priority (Rawls/Nozick style):** One value absolutely trumps another once a threshold is met.
      *   **Commensurability/Aggregation (Utilitarianism/Economics):** All values can be translated into a common currency (utils, dollars, QALYs).

  3.  **Analyze the Institutional Practices:**

      *   **IRB (Common Rule/Belmont Report):** Principles are Respect for Persons (Autonomy/Consent), Beneficence (Risk/Benefit), Justice.
          *   *Consent:* Often treated as a side-constraint (Kantian). You can't violate it for the greater good.
          *   *Risk/Benefit:* Requires assessment, but "disproportionate risk" is a veto.
      *   **Health Policy (QALYs/NICE):** Explicitly consequentialist. A life year is a life year. Resources are scarce. Maximization is the goal.

  4.  **Synthesize: The Implicit Theory of Value:**

      *   The split suggests a **Domain-Specific Value Pluralism**.
      *   *IRB:* Treats *Rights/Autonomy* as deontological constraints (Razian incommensurability with welfare). You can't trade a right violation for welfare gain.
      *   *Policy:* Treats *Welfare/Health* as commensurable goods within the domain of resource allocation.
      *   *Is it coherent?* It looks like a "Separateness of Persons" argument (Rawls). In research, we are using *this* person for *that* social end. In policy, we are distributing resources *among* persons to maximize overall health.
      *   *Chang's View:* Chang might argue that even in QALYs, hard choices exist (e.g., quality vs. quantity of life). But the *institutional* adoption of QALYs presupposes comparability.
      *   *Raz's View:* Raz would likely support the IRB veto (rights as exclusionary reasons) but might critique the QALY reductionism.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Define the split (Deontological constraints vs. Consequentialist aggregation).
      *   **Philosophical Commitments:**
          *   IRB $\rightarrow$ Razian Incommensurability (Rights vs. Good) or Lexical Priority.
          *   Policy $\rightarrow$ Commensurability (Welfarism).
          *   The Split $\rightarrow$ Contextual Pluralism.
      *   **IRB: Incommensurability or Practical Refusal?**
          *   It's not just practical. The Belmont Report grounds this in moral status. It treats autonomy as a *side constraint*. This aligns with Raz's "exclusionary reasons."
      *   **Chang and the Split:**
          *   Can Chang endorse it? Yes, via the idea of *different normative spheres*. Parity applies within a sphere. But if the spheres have different governing norms (rights vs. resources), the comparison rules change. However, a strict Changian might argue QALYs mask hard choices (is 1 year of perfect health *really* comparable to 2 years of pain?).
      *   **Reconstructing the Implicit Theory:**
          *   "Dual-Track Normativity."
          *   Track 1 (Individual Interaction): Agent-relative constraints. Incommensurability of Rights vs. Welfare.
          *   Track 2 (Systemic Allocation): Agent-neutral maximization. Commensurability of Welfare vs. Welfare.
          *   Justification: The "Separateness of Persons." Research imposes on specific individuals; policy distributes among populations.
      *   **Requirements vs. Accommodations:**
          *   *Requires:* That rights function as trumps in direct engagement. That scarcity requires rationing in distribution.
          *   *Accommodates:* The illusion that QALYs are perfectly precise. The illusion that consent is the *only* barrier in IRB.
      *   **Counterfactuals (Changing the Framework):**
          *   *Consistently Comparativist (Utilitarian):* IRBs would allow rights violations if benefits are high enough (e.g., Tuskegee logic). Policy stays same.
          *   *Consistently Non-Comparativist (Radical Pluralism):* Policy couldn't use QALYs. Every funding decision is a "hard choice" without a rational basis for maximization. Budgeting becomes impossible or purely political.
      *   **Conclusion:** The split is philosophically defensible under a specific pluralist view (Rights constrain the pursuit of the Good), but it is unstable under scrutiny (Chang would question the precision of the policy side; Raz would question the reductionism).

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to conflate Chang and Raz too much. Raz is about the *lack* of a common measure. Chang is about the *structure* of comparison (parity). The prompt asks about both.
      *   *Nuance on IRB:* IRBs *do* balance risk and benefit (Beneficence). But Consent is the lexical veto. So it's not total incommensurability, it's *partial* incommensurability (Rights vs. Benefits are incommensurable; Risks vs. Benefits are commensurable up to a point).
      *   *Nuance on QALYs:* QALYs assume commensurability of health states. Chang would argue choosing between extending life vs. improving quality is often a "hard choice" (parity), not a calculation.
      *   *Key Insight:* The split relies on the distinction between *doing* harm (research) vs. *allowing* harm/failing to save (policy resource allocation). This is the Doctrine of Doing and Allowing, mapped onto value theory.

  7.  **Final Polish:** Ensure the tone is academic, precise, and directly addresses the prompt's specific questions (Reconstruct, Distinguish, Counterfactuals). (Proceed to generate output based on this structure.)

      *   *Check:* Did I address "practical refusal" vs "genuine incommensurability"? Yes, need to emphasize the normative force of consent.
      *   *Check:* Did I address Chang specifically? Yes, need to apply "parity" to the QALY context.
      *   *Check:* Did I address Raz? Yes, "exclusionary reasons" for the IRB veto.

  8.  **Final Output Structure:**
      1.  Diagnosis of the Split (The Dual-Track Theory).
      2.  IRB: Razian Constraints vs. Practicality.
      3.  Chang's Perspective on the Split (Parity in Policy).
      4.  Implicit Theory Reconstruction (Agent-Relative vs. Agent-Neutral).
      5.  Requirements vs. Accommodations.
      6.  Counterfactual Scenarios (Consistent Comparativism vs. Non-Comparativism).

  (Thinking complete. Writing response.)
answer: |-
  This institutional divergence is a striking case study in applied value theory. It reveals a "dual-track" normative architecture that is common in liberal democracies but often goes unexamined philosophically. To analyze this through the lenses of Joseph Raz and Ruth Chang, we must distinguish between the *structure* of comparison (commensurability vs. incommensurability) and the *scope* of application (individual interaction vs. systemic allocation).

  Here is a reconstruction of the implicit theory of value, an analysis of its coherence, and a projection of what would change under consistent philosophical frameworks.

  ### 1. The Implicit Theory: Domain-Specific Normativity

  The split presupposes a **Contextual Value Pluralism** that distinguishes between *agent-relative constraints* and *agent-neutral optimization*.

  *   **In the IRB Domain (Research Ethics):** The system operates on a **Razian model of rights as exclusionary reasons**. When a protocol violates informed consent, it treats the participant merely as a means. In Raz's terms, the right to autonomy provides an "exclusionary reason" not to act on the balance of first-order reasons (i.e., scientific benefit). The value of autonomy is not just "weightier" than welfare; it is *incommensurable* with it in this specific context. You cannot add up units of autonomy and units of knowledge to find a sum. The lexical veto implies that the comparison is structurally blocked, not just practically difficult.
  *   **In the Health Policy Domain (QALYs):** The system operates on a **Commensurabilist/Welfarist model**. Here, the relevant values are health outcomes and resource costs. The implicit claim is that these goods *are* comparable on a common scale (the QALY). This presupposes that different health states, and even different persons' health states, can be aggregated. This rejects incommensurability within the domain of resource distribution.

  **The Licensing Principle:** The philosophical commitment that licenses this split is the **Separateness of Persons** (Rawls).
  *   In *research*, the institution is authorizing a specific agent to impose a burden on a specific person for a social end. The moral barrier here is high because it involves *doing* harm or violating a boundary.
  *   In *policy*, the institution is distributing scarce resources among a population where not everyone can be saved. This is viewed as *allocating* goods rather than *violating* rights. The moral imperative shifts from constraint to maximization.

  ### 2. IRB Practice: Genuine Incommensurability or Practical Refusal?

  Does the IRB veto reflect genuine Razian incommensurability, or merely a "practical refusal" (an epistemic humility or administrative rule)?

  **Argument for Genuine Incommensurability:**
  If it were merely practical, we would expect a "threshold" model where massive benefits could override minor consent violations (e.g., "We didn't get full consent, but we cured cancer"). The Common Rule does not allow this. The normative force of consent is deontological. This aligns with Raz's view that rights protect status, not just interests. To trade a right for welfare is to misunderstand the kind of value a right is. Therefore, the IRB structure presupposes that **Autonomy and Welfare are incommensurable in the context of direct imposition.**

  **Argument for Practical Refusal:**
  However, IRBs *do* balance risk and benefit under the principle of Beneficence. They determine if risks are "reasonable in relation to anticipated benefits." This implies commensurability between *welfare* (risk) and *welfare* (benefit). The incommensurability is strictly between *Rights* and *Welfare*. A defender of the "practical refusal" view might argue that we *could* theoretically compare them, but society has agreed to a heuristic veto to prevent slippery slopes (like the Tuskegee syphilis study).

  **Verdict:** The practice *strictly requires* the Razian view regarding consent (rights as trumps), but *accommodates* a comparativist view regarding risk/benefit analysis. It is a hybrid model.

  ### 3. Could a Defender of Hard Choices (Chang) Endorse the Split?

  Ruth Chang's account of "hard choices" and "parity" offers a nuanced way to defend the split, but it would require modifying the Health Policy side.

  **Endorsing the IRB Veto:**
  Chang argues that in hard choices, options are "on a par." They are comparable, but neither is better, nor are they equal. However, she also acknowledges that some choices are blocked by normative commitments. A Changian could endorse the IRB veto by arguing that respecting autonomy is a **grounding commitment** that defines the agent. To violate consent is to undermine the very agency required to make value comparisons. Thus, the veto isn't about incommensurability per se, but about the *conditions of possibility* for valuing.

  **Rejecting QALY Aggregation:**
  A strict Changian would likely critique the QALY system. Chang argues that many choices involving different qualities of life (e.g., extending life vs. reducing pain) are **hard choices** characterized by parity, not precise measurement.
  *   *The Critique:* QALYs presuppose that 1 year of perfect health is mathematically comparable to 2 years of moderate disability. Chang would argue this is often a false precision. These values may be on a par.
  *   *The Endorsement of the Split:* A Changian could argue that the IRB domain protects the *individual's* right to make hard choices for themselves (via consent), whereas the Policy domain illegitimately imposes a *false commensurability* on the population.
  *   *Conclusion:* A Changian could endorse the split, but not because Policy is truly commensurable. Rather, they would argue Policy *treats* values as commensurable for the sake of decision, while IRB acknowledges the *parity* or incommensurability of rights. However, to be consistent, a Changian would demand that Health Policy acknowledge the "hardness" of funding decisions rather than masking them as mathematical optimizations.

  ### 4. Requirements vs. Accommodations

  To clarify the implicit theory, we must distinguish what these practices logically demand versus what they merely tolerate.

  | Domain | What the Practice **Requires** | What the Practice **Accommodates** |
  | :--- | :--- | :--- |
  | **IRB (Research)** | **Deontological Constraints:** Autonomy functions as a side-constraint (Razian exclusionary reason). Risk/Benefit must be reasonable, but Consent is absolute. | **Weak Comparativism:** It assumes we *can* compare risk to benefit (Beneficence), implying some commensurability of welfare goods, just not rights vs. welfare. |
  | **Policy (QALYs)** | **Scarcity Management:** Requires a decision rule to allocate finite resources. | **Strong Comparativism:** It assumes health states and lives are perfectly fungible and measurable on a single cardinal scale (Utilitarian commensurability). |

  **The Tension:** The system accommodates a contradiction. It treats the individual as a "kingdom of ends" (IRB) but the population as a "utilitarian calculus" (Policy). This is stable only so long as the boundary between *imposing risk* and *allocating care* remains clear.

  ### 5. Counterfactuals: Consistent Frameworks

  If we replaced the implicit hybrid view with a consistently comparativist or non-comparativist framework, the institutions would change radically.

  #### Scenario A: Consistently Comparativist (Radical Welfarism)
  *   **Philosophy:** All values (autonomy, health, knowledge) can be translated into a common currency (e.g., utils).
  *   **Impact on IRB:** The lexical veto disappears. Informed consent becomes a strong preference, not a right. If a study violates consent but produces a cure for a pandemic that saves 10 million lives, the calculus permits the violation. (This replicates the logic of the Tuskegee study or Nazi experiments, justified by aggregate good).
  *   **Impact on Policy:** QALYs remain, but are expanded. We might trade health for other economic goods more freely.
  *   **Coherence:** High internal coherence, but morally repugnant to liberal intuitions about rights.

  #### Scenario B: Consistently Non-Comparativist (Radical Pluralism/Razian)
  *   **Philosophy:** Values are largely incommensurable. There is no common scale for health, money, or autonomy. Hard choices are ubiquitous and lack a single rational resolution.
  *   **Impact on IRB:** Remains largely similar (rights as trumps), but the "Risk/Benefit" analysis becomes harder to justify. If risk and benefit are incommensurable, how does the IRB declare a protocol "approved"? It would shift to a procedural model: "Did the participant choose this?" rather than "Is this risk reasonable?"
  *   **Impact on Policy:** **QALYs collapse.** You cannot aggregate incommensurable values. Funding decisions cannot be made by maximizing a metric. Every budget meeting becomes a "hard choice" in Chang's sense: a decision without a determinate rational answer. Allocation would become purely political or arbitrary, as there is no "better" option, only different ones.
  *   **Coherence:** Philosophically robust regarding value, but institutionally paralyzing. Liberal states require aggregation to function.

  ### 6. Conclusion

  The institutional split presupposes a **Hybrid Normativity**: it accepts Razian incommensurability regarding *rights* (to protect the individual from the collective) but rejects it regarding *resources* (to allow the collective to survive scarcity).

  Is this incoherent? Not necessarily. It reflects a distinction between **constitutive values** (autonomy, which defines the moral agent) and **instrumental values** (health resources, which serve the agent).
  *   A **Changian** would argue the Policy side is deluded: it masks hard choices as calculations.
  *   A **Razian** would argue the Policy side is reductionist: it ignores the incommensurable value of individual lives in favor of aggregate statistics.

  To make the system coherent without collapsing into utilitarianism or paralysis, one must admit that the QALY is not a *truth* about value, but a **conventional heuristic** for decision-making under scarcity, whereas the IRB veto is a **moral constraint** on action. The split is philosophically defensible only if we acknowledge that different normative domains (interaction vs. allocation) operate under different rules of comparison. If we force one rule onto both domains, we either lose our rights (Comparativism) or lose our ability to govern (Non-Comparativism).
