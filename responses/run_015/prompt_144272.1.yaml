  | Theoretical Framework | Verdict | Rationale |
  | :--- | :--- | :--- |
  | **Biological Naturalism** | **No Mind** | The system is silicon-based, lacking the specific biological causal powers required for consciousness. |
  | **Embodied Structural Isomorphism** | **No Mind** | The system lacks a physical body and sensory-motor loops; it is a disembodied simulation. |
  | **Grounded Internalist Functionalism** | **Mind** | The system possesses internal representational states that causally ground its first-person reports, satisfying the functional criteria for mentality. |

  This case isolates the variables of **substrate** (Biology vs. Silicon), **embodiment** (Robot vs. Disembodied), and **internal grounding** (Present vs. Absent), allowing for a clear empirical or philosophical distinction among the three competing rules.
