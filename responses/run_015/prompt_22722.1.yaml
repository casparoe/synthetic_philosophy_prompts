answer: |-
  No, that is definitely **not** the consensus. In fact, Higher-Order Vagueness (HOV) is widely considered one of the most difficult and damaging objections to almost every major theory of vagueness.

  Your intuition aligns closely with **Epistemicism** (most famously defended by Timothy Williamson), which holds that there *are* sharp boundaries, we just can't know where they are. However, even Epistemicists take HOV extremely seriously; they don't dismiss it. They spend considerable effort trying to explain why, if boundaries are sharp, vagueness *appears* to iterate infinitely.

  Here is why your proposed solution ("just stipulate the higher-order predicates are sharp") runs into significant philosophical resistance, and why HOV remains a central problem in the literature.

  ### 1. The Phenomenology of Vagueness
  The primary reason HOV is taken seriously is that it matches our linguistic intuition better than sharp boundaries do.

  If you stipulate that there is a sharp cutoff between "Definitely a Heap" and "Borderline Heap," you are positing a specific grain $n$ where $n$ is definitely a heap, but $n-1$ is only borderline.
  *   **The HOV Objection:** Most speakers feel that the transition from "definitely" to "borderline" is itself gradual. There seem to be cases where it is vague *whether* the case is borderline.
  *   **Your Move:** You suggest stipulating away this gradualness.
  *   **The Counter:** If you stipulate sharpness, you are no longer modeling natural language; you are modeling a formal calculus. The philosophical job is to explain natural language, not replace it. If your theory says "There is a fact of the matter," but every competent speaker finds the question "Is this definitely borderline?" to be itself vague, your theory is failing to capture the phenomenon.

  ### 2. The "Stipulation" is Question-Begging
  You suggest: *"just stipulate that all the higher-order predicates come out sharp and the whole infinite regress evaporates."*

  You *can* do this in a formal system. But in the philosophy of language, you cannot simply stipulate away the data you are trying to explain.
  *   **The Data:** In English, "borderline" is a vague term.
  *   **Your Solution:** Declare "borderline" to be precise.
  *   **The Problem:** This is like solving the problem of evil by stipulating "suffering doesn't exist." It solves the logical problem, but it ignores the reality on the ground. The HOV objection is serious precisely because it highlights that **any** attempt to draw a sharp line (even around the borderline region) seems arbitrary and linguistically unjustified.

  ### 3. How HOV Attacks Specific Theories
  HOV isn't just a nuisance; it breaks the machinery of the leading solutions to the Sorites.

  **A. Supervaluationism**
  *   *Theory:* A statement is true if it is true on all "precisifications" (ways of making the predicate sharp). They introduce a "Definitely" operator ($D$).
  *   *HOV Attack:* If $D$ is precise, then there is a sharp boundary between $DF$ (Definitely F) and $\neg D F$. But if vagueness is real, the boundary of $D$ should also be vague. If you make $D$ precise to avoid regress, you lose the ability to explain why the logic of "Definitely" behaves differently than standard necessity. (See: Timothy Williamson's critique of Supervaluationism).

  **B. Degree Theory (Fuzzy Logic)**
  *   *Theory:* Truth comes in degrees (0 to 1). "Heap" might be 0.5 true.
  *   *HOV Attack:* Where is the boundary between truth value 0.5 and 0.6? If that boundary is sharp, you have reintroduced the Sorites at the level of truth values. If that boundary is vague, you need "degrees of degrees," leading to regress.

  **C. Epistemicism (Your closest ally)**
  *   *Theory:* Boundaries are sharp but unknowable.
  *   *HOV Attack:* Even here, HOV is a problem. If there is a sharp boundary between "Known" and "Unknown," where is it? Williamson has to develop complex "margin for error" principles to explain why we can't know the boundary of the boundary. He doesn't dismiss HOV; he builds a massive epistemological framework to accommodate it.

  ### 4. The "No Sharp Boundaries" Paradox
  There is a specific argument (often associated with Crispin Wright and Roy Sorensen) that suggests HOV leads to a contradiction if you aren't careful.

  1.  If there is no sharp boundary between $F$ and $\neg F$ (first-order vagueness)...
  2.  Then there is no sharp boundary between "Definitely $F$" and "Not Definitely $F$" (second-order vagueness).
  3.  But if you iterate this, you eventually lose the distinction between $F$ and $\neg F$ entirely.
  4.  Therefore, to save the distinction, you seem forced to accept a sharp boundary somewhere.
  5.  But accepting a sharp boundary contradicts the nature of vagueness.

  This is why the paradox is sticky. You can't just "stipulate" sharpness without explaining why the stipulation is valid given that the language clearly resists it.

  ### Summary
  You aren't "missing something" in terms of logic; you have essentially rediscovered the **Epistemicist** stance. However, the claim that HOV "isn't serious" is incorrect.

  *   **Consensus:** HOV is a major constraint on any theory of vagueness.
  *   **Your Position:** You are advocating for a theory that denies the reality of HOV by positing sharp boundaries at every level.
  *   **The Hurdle:** You must explain why, if these boundaries are sharp, human language and cognition universally fail to detect them, not just at the first level, but at every higher level.

  If you are writing a piece on this, a strong angle would be to contrast your intuition with **Timothy Williamson's *Vagueness***. He agrees with you that boundaries are sharp, but he spends hundreds of pages explaining why that doesn't make the HOV objection go away easily. Dismissing HOV as trivial will likely make your piece vulnerable to standard objections in the literature.

  **Recommendation:** Look into **Roy Sorensen's *Blindspots*** or **Williamson's *Vagueness***. They treat HOV as the central battleground, not a side skirmish.
