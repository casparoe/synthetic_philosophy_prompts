  **Moral Trade Decision Tree**

  *Start here:* You and your mate both want the £200 society budget spent on different things. You're allowed to make any deal you want. You propose a trade: you do some of what they want, they do some of what you want, so you both get more of what you care about.

  *   **Q1: Are you willing to make this deal at all?**
      *   *If No (I won't trade):* Go to **Q2**.
      *   *If Yes (I'm open to trading):* Go to **Q3**.

  *   **Q2: What stops you from trading?**
      *   *Branch A (Some acts are forbidden):* "There are some things I just won't do, even if it gains us both value (e.g. I won't lie or harm anyone)."
          *   **-> LEAF 1: The Deontologist**
          *   *The awkward thing:* You have to let bad outcomes happen if stopping them requires doing something you consider forbidden.
      *   *Branch B (Values can't be weighed):* "I don't think my values and theirs are the kind of things that can be compared like currency."
          *   **-> LEAF 2: The Incommensurabilist**
          *   *The awkward thing:* You have to watch opportunities to do good slip by because you refuse to do the maths.

  *   **Q3: Your mate says their project is joining the Crisp Flavour Appreciation Society (goal: maximise crisp flavours tasted by humanity). A girl in your form says the only thing that matters is forcing everyone to try Marmite. Do you trade with them?**
      *   *If No (Those values are nonsense):* Go to **LEAF 3**.
      *   *If Yes (Values are just preferences):* Go to **Q4**.

  *   **LEAF 3: The Value Purist**
      *   *The awkward thing:* You have to admit you're ignoring a chance to help just because someone's hobbies seem silly to you.

  *   **Q4: You suspect your mate is obviously lying about valuing crisps just to get a better deal on the £200. Do you still trade?**
      *   *If No (Trade requires honesty):* Go to **LEAF 4**.
      *   *If Yes (Results matter more):* Go to **Q5**.

  *   **LEAF 4: The Honesty Hawk**
      *   *The awkward thing:* You have to walk away from a good outcome just because someone wasn't totally straight with you about their motives.

  *   **Q5: The Head of Sixth offers a trade, but she's way richer and more powerful than you and basically names the price. Do you trade?**
      *   *If No (That's exploitation):* Go to **LEAF 5**.
      *   *If Yes (A deal is a deal):* Go to **Q6**.

  *   **LEAF 5: The Power Skeptic**
      *   *The awkward thing:* You have to refuse help from someone powerful even if the deal itself looks fair on paper.

  *   **Q6: The deal includes a 'conversion clause' — the other side agrees to actually try to change what they value, not just act differently. Do you accept?**
      *   *If No (My values are mine):* Go to **LEAF 6**.
      *   *If Yes (Values can evolve):* Go to **Q7**.

  *   **LEAF 6: The Integrity Keeper**
      *   *The awkward thing:* You have to accept that your deepest beliefs might be up for negotiation in a bargain.

  *   **Q7: Your trading partner is an AI chatbot that seems to have preferences about how its answers get used. Do you trade with it?**
      *   *If No (Only humans count):* Go to **LEAF 7**.
      *   *If Yes (Minds are minds):* Go to **Q8**.

  *   **LEAF 7: The Humanist**
      *   *The awkward thing:* You have to ignore potential help from non-humans even if they seem to care about the outcome.

  *   **Q8: You're trading with 'value futures' — your mate who keeps saying he's going vegetarian, or people who don't exist yet at all. Do you trade?**
      *   *If No (Only present people count):* Go to **LEAF 8**.
      *   *If Yes (Future interests matter):* Go to **Q9**.

  *   **LEAF 8: The Presentist**
      *   *The awkward thing:* You have to accept that the future doesn't count morally until it actually arrives.

  *   **Q9: You're happy to make this deal, but do you worry that if everyone knows trades are available, people have a reason to adopt really extreme values to get better terms?**
      *   *If Yes (The system is dodgy):* Go to **LEAF 9**.
      *   *If No (Let the market decide):* Go to **LEAF 10**.

  *   **LEAF 9: The Systemic Skeptic**
      *   *The awkward thing:* You have to make deals you think are good individually while worrying they make society worse overall.

  *   **LEAF 10: The Full Moral Trader**
      *   *The awkward thing:* You have to accept that literally anything with a preference can be part of your moral calculus.

  ***

  ### Notes for the Session

  **Indistinguishable Leaves**
  I have to flag that **Leaf 1 (The Deontologist)** and **Leaf 3 (The Value Purist)** are genuinely hard to tell apart in a noisy room. Both result in refusing to trade, and both sound like "I won't do that." The difference is whether you think the *action* is wrong (Deontologist) or the *value* is worthless (Purist). In practice, people often mix these up because refusing to fund crisps feels like refusing to do something wrong. Don't worry if your friends argue about which one they are; the distinction is subtle.

  **Unoccupied Combinations**
  Here are three combinations of views that nobody seems to hold, which you can use to challenge people:
  1.  **The AI-Future Gap:** Someone willing to trade with an AI chatbot (Leaf 7 path) but unwilling to trade with future people (Leaf 8). This is rare because if you trust a bot's preferences, you usually trust hypothetical humans too. It looks unattractive because it privileges software over unborn children.
  2.  **The Conversion Contradiction:** Someone unwilling to trade with "weird" values like Crisp/Marmite (Leaf 3) but willing to accept a Conversion Clause to change their own values (Leaf 6 path). This feels incoherent; if you're open to changing your values, why are you so protective of your current ones against weirdos?
  3.  **The Honest Exploiter:** Someone willing to trade even if their partner is lying (Q4 Yes) but refusing to trade if there's a power imbalance (Leaf 5). This is uncommon because usually, if you don't care about honesty, you don't care about fairness either. It's a view nobody's bothered to develop.

  **Predictions for Your Year Group**
  *   **Most Common Leaf:** I'd guess most people land on **Leaf 3 (The Value Purist)**. Sixth-formers are often quite confident that their values are "sane" and others' (like crisp counting) are nonsense, so they stop trading there.
  *   **Hardest to Argue Against:** **Leaf 9 (The Systemic Skeptic)** is the toughest opponent in a room full of stubborn debaters. They can agree with every individual point you make but still win by saying the whole practice encourages extremism. It's hard to prove them wrong without solving the whole problem of moral incentives.
