answer: |-
  You're pressing exactly where the leather wears thin, which is where you ought to be pressing. But you're conflating the capacity for normative recognition with the mere possession of vocabulary. My claim isn't that she needs to whisper 'ought' to herself; it's that the action must be grounded in her recognition of the action's authority over her will. In the aphasia cases, by stipulation, that recognition is impossible. She responds to suffering, not to the claim suffering makes on her. So I bite the bullet: neither variant has moral worth. Variant (a) retains the history of a good will, and we might praise her character, but the current actions flow from inclination or habit, however reliably tuned. Variant (b) is simply a well-tuned machine. The difference between tracking right-making features and tracking the requirement is precisely that the latter involves submitting to a law, not just responding to a need. Your counterfactual account captures reliability, but it misses the specific value of autonomy—the self-legislation that is absent when the capacity for law is lesioned.

  The single step I am least confident in is the insistence that the acquired loss of normative concepts in case (a) necessarily extinguishes the capacity to be guided by the moral law itself, rather than just the concepts used to articulate it. I would be forced to abandon the view if you could construct a case showing that an agent can represent the *authority* of a moral claim non-conceptually—that is, if you can demonstrate a form of practical awareness that functions as a recognition of requirement without deploying the vocabulary of 'ought' or 'reason'.
