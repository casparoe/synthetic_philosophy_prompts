  *(Self-Correction Note during drafting)*: I need to make sure Marcus doesn't just say "Physics might change." He needs to argue that *computation is inherently physical*. Deutsch's quote "It is not possible to understand computation without referring to physics" is a good anchor for him. Elena should counter with Turing's focus on the *logic* of procedure, not the *substrate*.

  7.  **Final Polish:** Check flow and philosophical terminology (a priori, empirical, effective procedure, oracle).

