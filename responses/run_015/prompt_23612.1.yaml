answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Rain taps against the window. ELENA (philosophy of mathematics) and MARCUS (theoretical physics) are finishing coffee.*

  **MARCUS:** You're frowning at that paper again. Is it the hypercomputation draft?

  **ELENA:** It's the response to the reviewers. They keep insisting I treat the Church-Turing Thesis as if it were a law of thermodynamics. They want error bars. They want to know under what physical conditions it might fail. But it's a category error, Marcus. It's like asking for the error bars on the definition of a bachelor.

  **MARCUS:** (Laughs) Come on, Elena. That's the classic conceptualist dodge. You treat the Thesis as an analytic truth, a definition. But when physicists talk about computation, we aren't talking about definitions. We're talking about what can be built. If the universe allows a process that outputs the solution to the Halting Problem, the Thesis is false. Full stop.

  **ELENA:** Only if you equivocate on "computation." The original Thesis—the one Church and Turing proposed in 1936—is about *effective calculability*. It's an analysis of the human notion of an algorithm. Turing didn't look at the laws of physics; he looked at a human computer with a pencil and paper. He asked, "What are the atomic operations a human can perform without insight?" He derived the machine from the *concept* of a procedure.

  **MARCUS:** But that derivation assumes a specific physical context. A human with a pencil is a physical system obeying specific constraints. Turing assumed discrete states, finite symbols, local operations. Why those constraints? Because that's how our brains and paper work. If the universe allows continuous variables with infinite precision, or closed timelike curves, those constraints vanish. Then your "conceptual truth" looks like a local accident of living in a low-energy, non-relativistic regime.

  **ELENA:** You're conflating the Mathematical Church-Turing Thesis with the Physical Church-Turing Thesis. I'm defending the former. The claim is: *Any function that is effectively calculable is Turing-computable.* "Effectively calculable" means "followable by a finite agent without insight."

  **MARCUS:** But why do we care about that specific notion? We care because we believe it bounds what *machines* can do. We care because we want to know if the brain is a computer, or if a future civilization could build an oracle. If you wall off the Thesis as purely conceptual, you render it irrelevant to science. You make it a tautology. "Any process that fits the definition of a Turing algorithm is computable by a Turing machine." Well, yes. But can the *world* compute more?

  **ELENA:** That is a different question! And the answer is: if the world produces a result via a process that isn't step-by-step, isn't finite, or requires infinite precision, it's not *computation*. It's just a physical event. Look at the convergence argument. Turing machines, Lambda calculus, General Recursive functions. Three completely different formalisms, developed independently, capturing the exact same class of functions. That's not a physical coincidence; that's evidence we've latched onto a robust mathematical structure.

  **MARCUS:** Is it? Or is it evidence that all three formalisms were invented by humans embedded in the same physical universe? We used the same logic, the same ink, the same neurons. Of course they converge. That's like saying Newtonian mechanics, Lagrangian mechanics, and Hamiltonian mechanics all converge, therefore classical mechanics is a priori truth. No, they converge because they describe the same physical domain. If you push outside that domain—to relativistic speeds, or quantum scales—the formalism breaks. I suspect the same is true here.

  **ELENA:** But quantum computing doesn't break the Thesis.

  **MARCUS:** It doesn't break *computability*, no. BQP is contained within PSPACE, which is contained within the Turing-computable functions. A quantum computer doesn't solve the Halting Problem. But that's contingent! David Deutsch argued that computation is inherently physical. The set of computable functions is determined by the laws of physics. In our universe, it happens to match Turing machines. In a universe with different laws, it might not. That makes the Thesis an empirical hypothesis, not a conceptual analysis.

  **ELENA:** Deutsch is a physicalist, naturally. But consider a Malament-Hogarth spacetime. You have a computer falling into a black hole, performing an infinite number of steps in its own proper time, while an observer outside waits a finite time and receives the result. Technically, this computes a non-Turing-computable function.

  **MARCUS:** Exactly. A hypercomputer.

  **ELENA:** But is it an *algorithm*? The observer outside doesn't see the steps. They don't have access to the procedure. They just get an output from a singularity. If I roll a rock down a hill and it lands in a shape that encodes the answer to the Riemann Hypothesis, did the rock *compute* it?

  **MARCUS:** If the dynamics of the rock are deterministic and we can set up the initial conditions to map the input to the output, yes. That's an analog computer.

  **ELENA:** But where is the *effective procedure*? The Thesis is about what *we* can do. It's epistemic. It's about verification. If you can't check the steps, if you can't reproduce the process without relying on the specific, unrepeatable geometry of a black hole, you haven't found a counterexample to effective calculability. You've found a physical oracle. And Turing already accounted for oracles! An oracle machine is still a Turing machine, just with an extra black box. The Thesis is about the *logic* of the box, not the physics of the wiring.

  **MARCUS:** There it is. You're retreating to the "human" limit. "What *we* can check." But science is about what *is*, not what we can verify. If the universe solves the Halting Problem via a Malament-Hogarth process, then the function is physically computable. The fact that a human can't follow the steps with a pencil is a limitation of the human, not of computation. You're defining computation as "what humans can do," and then concluding humans can do everything computable. That's circular.

  **ELENA:** It's not circular; it's normative. We are defining the concept. If you want to talk about "physical computability," fine. Call it the Physical Church-Turing Thesis. But don't pretend that falsifying the Physical Thesis falsifies the original. The original is a claim about the analysis of the notion of an algorithm. The fact that three formalisms converge suggests that notion is stable.

  **MARCUS:** I think the convergence is real, but I think you're misinterpreting its source. It's not that we found a Platonic form. It's that we found the limits of *local, discrete, causal* processes. Our physics is local and causal. So our math is too. If we discover that spacetime is non-local at the Planck scale, or that time is not linear, our notion of "step-by-step" might dissolve. Then the convergence of Turing, Church, and Gödel looks like the convergence of three different maps of the same continent. Accurate for the continent, useless for the ocean.

  **ELENA:** But even then, to *use* that non-local physics to compute something, you'd have to specify the setup. You'd have to write down the instructions. "Prepare the black hole with mass M," "Wait time T." Those instructions are finite strings. The *setup* is Turing-computable. The physical process might be exotic, but the interface with the agent remains discrete and finite.

  **MARCUS:** Unless the setup requires infinite precision. Suppose the initial condition requires a real number with infinite non-repeating digits to tune the singularity correctly.

  **ELENA:** Then you can't set it up. Not effectively. You can't measure it, you can't write it down.

  **MARCUS:** But the universe can *be* that state. The universe doesn't need to write down the number; it just *is* the number. If the universe evolves that state to produce an output, the computation happened. The Thesis claims that *any* function computable by a physical system is Turing-computable. If the universe computes it, and a Turing machine can't, the Thesis is false.

  **ELENA:** You keep sliding back to "computable by a physical system." That is the Physical Thesis. I am telling you, that is a scientific hypothesis, and I agree it might be false! But the *Church-Turing Thesis* proper—the one in the logic textbooks—is about the equivalence of formalisms and the analysis of effective methods. When logicians say "CTT is not provable," they mean it's not a theorem because "effective method" is an intuitive concept, not a formal one. They don't mean "go run an experiment."

  **MARCUS:** But why do logicians care? Why does computer science care? Because we build things. If I tell a student, "This function is uncomputable," I mean "You cannot build a machine to do this." I don't mean "You cannot write a recipe for a human." If a hypercomputer is physically possible, telling that student the function is uncomputable is a lie. It misrepresents reality. So, for all practical and scientific purposes, the Thesis *must* be read as a physical claim. Otherwise, it's a historical curiosity.

  **ELENA:** I think the tension lies here. You view computation as a natural kind, like "water" or "energy." Something discovered in the world. I view it as a normative concept, like "proof" or "validity." Something constructed by agents.

  **MARCUS:** Precisely. And I think history shows that normative concepts often get overturned by natural kinds. "Simultaneity" was a normative concept—a definition of how we synchronize clocks. Einstein showed it was a physical relation dependent on velocity. He didn't say, "Well, I'm talking about the conceptual notion of simultaneity." He changed the concept to fit the physics.

  **ELENA:** (Pauses, stirring her coffee) That's a strong analogy. But consider this: Einstein didn't say simultaneity doesn't exist. He refined the conditions under which the judgment holds. Turing did the same. He refined the conditions of "calculation." If you remove the finiteness, the discreteness, the locality... you aren't refining calculation. You're talking about something else. You're talking about *prediction* or *determination*.

  **MARCUS:** Maybe. But if that "something else" allows us to solve problems we previously thought unsolvable, who cares about the label? If I can build a box that decides the Halting Problem, I have a computer. Even if it uses a black hole. To insist it's not a "real" computer because it doesn't use paper and pencil is fetishizing the substrate.

  **ELENA:** It's not fetishizing the substrate; it's preserving the link between computation and *understanding*. Computation is supposed to be a process we can follow, verify, and reproduce. If your black hole computer gives an answer, but I cannot verify the steps because they happen behind an event horizon or require infinite precision... do I *know* the answer? Or do I just have a belief caused by a physical event?

  **MARCUS:** I know the answer if the theory predicting the black hole's behavior is well-confirmed. Just like I know an electron exists even if I can't see it.

  **ELENA:** But that's observation, not computation.

  **MARCUS:** (Leans forward) And there is the rub. You want to keep computation pure, tied to proof and logic. I want to tie it to causality and power. The reason this debate never resolves is that we are both right about different things. You are right that the *logical* structure of algorithms is a priori. The equivalence of Lambda and Turing machines is a mathematical fact. But I am right that the *scope* of what can be computed is an empirical fact.

  **ELENA:** So we should stop calling them the same thing. The "Mathematical Church-Turing Thesis" is a claim about the robustness of the concept of effective procedure. The "Physical Church-Turing Thesis" is a claim about the computational capacity of our universe.

  **MARCUS:** Agreed. But the danger is when people use the certainty of the first to bolster the second. They say, "Hypercomputation is impossible because Church and Turing proved it." And that's wrong. Church and Turing proved that *effective procedures* are Turing-equivalent. They didn't prove the universe is limited to effective procedures.

  **ELENA:** And the danger on your side is dismissing the conceptual work as mere "human limitation." The reason the Thesis has held for eighty years isn't just that our physics hasn't changed. It's that every time we try to formalize "calculation," we end up back at Turing. That suggests the concept is doing work. It's not just a shadow of physics.

  **MARCUS:** (Smiles) So, the Thesis is a bridge. One foot in logic, one foot in physics.

  **ELENA:** And the bridge is shaking.

  **MARCUS:** Good. That means it's carrying weight.

  **ELENA:** (Closes her notebook) Just don't ask me to put error bars on a definition.

  **MARCUS:** And don't ask me to ignore a black hole just because it doesn't use pencil and paper.

  **ELENA:** Deal.
