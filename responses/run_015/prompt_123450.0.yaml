  hey, quick thing thats been bugging me. i run a tiny lending library for weird kitchen tools—like 90 pieces, mostly vintage stuff people borrow for one-off projects. every time something comes back i look it over and think 'this ones fine, no hidden cracks or wear.' but i also keep a log, and every quarter about 6 or 7 items come back with damage i totally missed. now my neighbor wants to borrow the ceramic mandoline for a big dinner tomorrow, and im torn. if i genuinely think this specific mandoline is okay, why does my gut still say i should charge a deposit? separately, im writing a little care zine with one tip for each tool, and i double-checked every single tip against the manuals, but in the intro i wrote 'there's definatly mistakes in here somewhere.' am i being hypocritical? like, can i really believe each item is fine and also that some will fail, without my brain being broken? and same with the tips—how does that work?
