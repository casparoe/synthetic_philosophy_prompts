          *   Round 1: Equal evidence, different draws -> Conciliationism should win.
          *   Round 2: Unequal evidence (3 draws vs. 1 draw) -> Steadfastness should win (for the better informed).
          *   Round 3: Same evidence, different priors/calibration -> The "Hard Case" (peer disagreement with shared evidence). Uses a pre-test calibration score.
