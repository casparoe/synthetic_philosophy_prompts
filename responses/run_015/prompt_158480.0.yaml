      *   **The Limitation:** What the game can't do.

      *(One last thought on Round 3)*: To make the "Same Evidence" lead to disagreement, I need to introduce ambiguity. If the beads are 3 Red / 2 Blue, is the jar 60% Red? Or is it 50% Red and this is noise?
      *   *Instruction:* "Based on these 5 beads, what is the % of Red in the jar?"
      *   *Calibration:* "You tend to over-interpret small samples." vs "You are good at spotting trends."
