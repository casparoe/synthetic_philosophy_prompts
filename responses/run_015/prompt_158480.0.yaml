      *   *Risk:* If I tell someone "You are overconfident," they might just mechanically adjust.
      *   *Mitigation:* Frame it as "Reliability Weight."
      *   *Crucial Fix:* In Round 3, they must pair with someone who has a *different* estimate. If everyone estimates 60%, there is no disagreement. I will instruct them: "Find a partner whose estimate differs by at least 10%."

      *(Final Polish)*: Ensure the tone is facilitative, not academic. Keep the instructions punchy.

  9.  **Final Plan Structure:**
      *   **Verdict on Round 3:** Honest assessment (it's the weakest link, here's how to shore it up).
      *   **The Setup:** Props & Prep.
      *   **The Scoring:** The Table.
      *   **The Timeline:** Minute-by-minute.
