  **OFFICE FOR PRECAUTIONARY COMPLIANCE**
  **CIRCULAR 44/23: THE PRECAUTIONARY COMPLIANCE (ASSESSMENT OF APPLICATIONS) CIRCULAR**

  **1. Purpose and Scope**
  1.1 This Circular provides guidance to Authorised Officers on the assessment of applications under the Precautionary Administration Act 2019. It ensures consistency in the identification of plausible risks and the allocation of evidentiary burdens.
  1.2 All administrative actions, including the maintenance of existing states of affairs, constitute applications subject to this guidance.

  **2. The Trigger Condition**
  2.1 A precautionary assessment is triggered where there is a plausible risk of harm.
  2.2 For the avoidance of doubt, plausibility is established by any non-zero probability of harm, regardless of magnitude. Theoretical possibility satisfies the trigger condition.
  2.3 Uncertainty regarding the mechanism of harm does not negate the trigger; indeed, it reinforces the necessity of assessment.

  **3. Burden and Comparison**
  3.1 The burden of proof rests entirely upon the proponent of the course of action. The proponent must demonstrate that the action entails no unreasonable risk.
  3.2 Officers are reminded that a decision to refuse an application constitutes a separate course of action (the 'Refusal Action'). The Refusal Action attracts its own burden of proof under Clause 3.1.
  3.3 Under the Doctrine of Non-Comparison, Officers must not weigh the risks of the proposed action against the risks of the Refusal Action. Each action stands on its own evidentiary merits. Comparative risk assessment is prohibited.

  **4. Continuation and Status Quo**
  4.1 The status quo is not a baseline but an active continuation proposal. Incumbent operators must submit periodic renewal applications demonstrating continued safety.
  4.2 Historical safety data does not constitute proof of future safety where uncertainty persists.

  **5. Mitigation Regress**
  5.1 Where risk mitigation measures are proposed, those measures constitute secondary actions subject to Clause 2.
  5.2 Officers must require assessment of risks introduced by the mitigation measures themselves (e.g., protective equipment, procedural barriers). Further mitigation may be required to address these secondary risks.

  **6. Office Renewal**
  6.1 The Office's authority to issue this Circular expires in twelve months. The Office shall submit an application to the Internal Compliance Committee for the continuation of its own regulatory functions.

  ***

  **ANNEX A: WORKED EXAMPLES**

  | Application | Decision | Reasoning |
  | :--- | :--- | :--- |
  | **New Paediatric Antipyretic** (PharmaCo Ltd) | **Refused** | Theoretical possibility of unknown metabolic interaction satisfies Clause 2.2. |
  | **Incumbent Antipyretic** (Continuation Review) | **Suspended** | Proponent failed to demonstrate zero residual risk. Refusal Action (Ref-2023-04) under assessment. |
  | **Felling of Rotten Tree** (Office Estates) | **Conditional** | Felling approved subject to dust mitigation. Mitigation (ventilation) requires draft risk assessment. |
  | **Village Fete** (Parish Council) | **Refused** | Uncertainty regarding grass shear strength under load constitutes plausible trip hazard. |
  | **Coffee Service** (Office Caterers) | **Restricted** | Caffeine intake levels uncertain. Service limited to decaffeinated blend pending review. |

  ***

  **SIDEBAR: DEFINITION OF UNCERTAINTY**
  *Uncertainty includes any gap in knowledge regarding cause, effect, or probability. Where data is absent, Officers must assume the risk is present. Absence of evidence is not evidence of absence.*

  ***

  **COVER NOTE**

  **To:** The Commissioner
  **From:** Head of Policy
  **Re:** Circular 44/23 Draft

  This draft operationalises the Precautionary Principle as strict administrative law. Exaggerated features include: the trigger threshold (any non-zero probability), the prohibition on comparative risk assessment (making refusal an actionable burden), and the infinite regress of mitigation measures. I have also included the self-referential ratchet requiring the Office to renew its own mandate. I left alone the core burden-shift mechanism and the genuine epistemic humility regarding unknown harms, ensuring the logic remains internally consistent rather than caricatured. The paralysis is a feature of the geometry, not the tone.
