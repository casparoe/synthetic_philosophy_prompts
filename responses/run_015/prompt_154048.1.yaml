  # JOINT STATEMENT ON THE STRUCTURE OF COGNITION
  **An Adversarial Collaboration between the Classical and Connectionist Working Groups**

  **Date:** October 24, 2023
  **Signatories:** [Classicist Name], [Connectionist Name]
  **Witnessed by:** The Reading Group

  ## 1. AGREED CLAIMS

  We, the undersigned, having reviewed the stipulated evidence base (i–iv) and adhering to the norms of adversarial collaboration, affirm the following claims as the common ground for future theorizing. We agree that any adequate model of cognition must satisfy these constraints.

  1.  **The Formalism Constraint:** Any adequate model must implement a stable, learnable mapping from structured external contents (e.g., *John loves Mary*) to internal neural states, such that variations in semantic content and syntactic role produce distinguishable, predictable variations in the internal state space. Neither a random projector nor a static lookup table suffices.
  2.  **The Explananda:** We agree that the following four results constitute the non-negotiable data set for any theory of cognitive architecture:
      *   **(i) Filler-Diversity Dependence:** Systematic generalization to novel role reversals is not immediate but is a steep, saturating function of training diversity (near chance <50 fillers; >90% >2000 fillers), with nearly identical learning curves across symbolic, transformer, and recurrent architectures, save for a persistent tail of role-confusion errors in neural models.
      *   **(ii) Role-Specific Re-encoding:** Constituent identity (e.g., *John*) is decodable from Agent-role neural patterns but not from Theme-role patterns, though a linear map successfully translates between these role-specific formats.
      *   **(iii) Graded Re-binding:** Retrieval of masked constituents shows graded interference proportional to the number of intervening items (no sharp capacity break), yet incurs a small, fixed processing cost for role-swapped constituents that is independent of semantic similarity.
      *   **(iv) Structural Lesion Dissociation:** Focal damage to left inferior frontal cortex (LIFC) selectively disrupts binding of non-adjacent dependencies while sparing adjacent dependencies and single-word semantics.
  3.  **The Ruled-Out Space:** Based on the evidence above, we jointly declare the following theoretical positions untenable:
      *   **Flat Associationism:** Any model that relies solely on pairwise co-occurrence statistics without role-sensitive binding is ruled out by the fixed cost of role-swaps (iii) and the success of novel reversals after training (i).
      *   **The Literal Neural Register:** Any model positing that the brain buffers Mentalese sentences in a static, format-invariant neural scratchpad is ruled out by the role-specific re-encoding requirements (ii) and the graded interference effects (iii).
      *   **Purely Semantic Generalization:** Any model claiming generalization is driven entirely by semantic similarity is ruled out by the role-swap cost which varies independently of similarity (iii).

  ## 2. RESIDUAL DISAGREEMENTS (CRUXES)

  The following table details the remaining points of contention. For each crux, we specify our respective formulations, classify the nature of the dispute, and pre-register a concrete probe to adjudicate it.

  | Crux | Classicist Formulation | Connectionist Formulation | Type | Concrete Probe & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of Systematicity** | The diversity curve (i) reflects the *calibration* of an innate structural capacity, not the *construction* of structure. True systematicity is the ability to entertain thoughts whose constituents have never been co-tokened, regardless of training density. | The diversity curve (i) *is* the phenomenon. "Structure" is a high-dimensional statistical regularity learned from exposure. There is no "innate capacity" distinct from the learned manifold. | **Empirical** | **Probe:** *Zero-Shot Structural Transfer.* Train models on Grammar A (e.g., Subject-Verb-Object) with high diversity, then test on Grammar B (e.g., Object-Verb-Subject) with *zero* exposure to B's specific fillers.<br>**Classicist Prediction:** Immediate high accuracy on B if structural mapping is recognized.<br>**Connectionist Prediction:** Performance on B will reset to near-chance and require new diversity training.<br>**Concession:** Classicist concedes if accuracy on B is <60% without retraining. Connectionist concedes if accuracy on B is >85% immediately. |
  | **2. Constituent Identity (Re-encoding)** | The success of the linear map (ii) proves that *John* retains a stable vehicle identity across roles; the format change is merely a "case marking" operation on a persistent symbol. | The failure of direct decoding (ii) proves vehicle identity is context-bound. The linear map is a post-hoc isomorphism between distinct dynamical attractors, not evidence of a shared token. | **Verbal/Empirical** | **Probe:** *Cross-Role Decoding with Novel Fillers.* Train decoder on Agent-role *pseudowords*. Test on Theme-role *pseudowords* never seen in Agent role.<br>**Classicist Prediction:** Decoder fails (needs case marker), but linear map trained on known words generalizes to pseudowords.<br>**Connectionist Prediction:** Linear map fails to generalize to novel pseudowords because the manifold is locally fitted.<br>**Concession:** Classicist concedes if map fails to generalize. Connectionist concedes if map generalizes perfectly to novel items. |
  | **3. Architectural Priors** | The persistent role-confusion tail in neural models (i) and the LIFC dissociation (iv) imply a dedicated structural inductive bias (syntax engine) is required to eliminate errors and explain the lesion data. | The identical learning curves across architectures (i) imply structure emerges from general learning mechanisms. The LIFC lesion (iv) reflects damage to a high-control hub, not a syntax module. | **Empirical** | **Probe:** *Data-Efficiency Scaling.* Compare sample efficiency of a Transformer vs. a Symbolic Solver on the artificial grammar (i) as noise increases.<br>**Classicist Prediction:** Symbolic solver maintains accuracy with 10x less data and high noise.<br>**Connectionist Prediction:** Transformer performance degrades gracefully but requires 100x more data to match solver.<br>**Concession:** Classicist concedes if Transformer matches solver efficiency. Connectionist concedes if Transformer requires orders of magnitude more data. |
  | **4. Marr-Level Description** | The computational level (logic/syntax) must be causally reflected in the implementation level (neural mechanism). If cognition is systematic, the brain must physically token constituents. | The computational level is a useful descriptive fiction. The implementation level is dynamical. We need not find "symbols" in the brain to acknowledge systematic behavior. | **Verbal** | **Probe:** *Causal Intervention on the Map.* Disrupt the neural subspace identified as the "linear map" between roles (ii) using TMS.<br>**Classicist Prediction:** Disruption abolishes role-binding specifically (syntax deficit).<br>**Connectionist Prediction:** Disruption causes general processing slowdown or broad semantic degradation (control deficit).<br>**Concession:** *See Note Below.* |

  **Note on Verbal Disputes:** We explicitly flag **Crux 4** as primarily verbal. The disagreement concerns whether "computation over representations" is an ontological claim about mechanisms or a descriptive claim about behavior.
  *   **Observation to Reveal:** If the TMS intervention in the probe above produces *identical* behavioral deficits, but the Classicist insists this confirms "syntax disruption" while the Connectionist insists this confirms "control disruption," the dispute is verbal. Resolution requires agreeing on a definition of "mechanism" that does not presuppose one architecture.

  ## 3. CLOSING STATEMENT ON THIRD POSITIONS

  We acknowledge two "third positions" that arose during our collaboration: **Vector-Symbolic Architectures (VSA)** and **Instrumentalism**.

  **Vector-Symbolic Architectures:**
  A VSA approach (binding roles to fillers in distributed superpositions) undercuts the dichotomy between "literal neural registers" and "flat associationism." It accounts for the re-encoding result (ii) via binding operators and the graded interference (iii) via noise in superposition.
  *   **Assessment:** The **Classicist** should have occupied this ground earlier. VSA preserves the constituent structure and productivity required by the Classical view while accepting the distributed, neural implementation required by the evidence. The Classicist's insistence on "discrete tokens" was too strong; "discrete structure in distributed media" is the viable claim.

  **Instrumentalism:**
  An instrumentalist reading (structure is a property of the best description, not the mechanism) undercuts the ontological weight of Crux 4.
  *   **Assessment:** The **Connectionist** should have occupied this ground earlier. By treating "syntax" as a real-time descriptive tool rather than a myth, the Connectionist can accept the utility of the Classical formalism without committing to a homunculus reading sentences in the head. However, if adopted too early, this risks dissolving the explanatory gap rather than bridging it.

  **Final Consensus:** We agree that the Classical view is correct about the *structure of the description* required to explain the data, while the Connectionist view is correct about the *nature of the substrate* implementing it. The debate now shifts from "Which one is true?" to "How exactly does the substrate sustain the structure?"

  ***

  **Signed:**

  _________________________ (Classicist)

  _________________________ (Connectionist)
