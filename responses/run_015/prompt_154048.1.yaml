          *   Probe: Causal intervention on the "linear map" region.

  5.  **Drafting Section 3: Verbal Disputes:**
      *   Identify where definitions clash (e.g., "representation," "computation").
      *   Observation: If both models predict the same behavior but describe it differently, it's verbal.

  6.  **Drafting Section 4: Third Positions:**
