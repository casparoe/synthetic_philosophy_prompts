              1.  Numbered section of Agreed Claims (Formalism, Explananda, Ruled-out theories).
              2.  Table of Residual Disagreements (Crux, Classicist Formulation, Connectionist Formulation, Empirical/Verbal, Concrete Probe/Prediction/Conditions for conceding).
              3.  Flagging of "Verbal Disputes" (What observation reveals this?).
              4.  Closing Section on Third Positions (Vector-Symbolic Architectures, Instrumentalism).

  2.  **Deconstruct the Evidence Base & Theoretical Positions:**
      *   *Evidence 1 (Filler-Diversity):* Suggests systematicity isn't innate/hardcoded (since it needs training diversity) but isn't purely associative (since it generalizes to novel reversals after enough diversity). Neural models *can* do it but need data; they make specific structural errors (role confusion).
      *   *Evidence 2 (Re-encoding):* Suggests representations are role-specific (Agent $\neq$ Theme format) but isomorphic (linear map exists). This challenges strict "same token" LOT but supports structural mapping.
      *   *Evidence 3 (Re-binding):* Graded interference suggests resource limits/activation decay (connectionist friendly), but fixed role-swap cost suggests structural sensitivity independent of semantics (classicist friendly). No sharp break challenges strict symbolic buffers.
      *   *Evidence 4 (Lesion):* Dissociation suggests specific neural substrate for structural binding (LIFC). Challenges pure distributed dynamical systems where structure is emergent/global.

      *   *Classicist (Fodorian):* Cognition *is* computation over language-like representations. Constituents are tokened. Systematicity is structural.
      *   *Connectionist (Embodied/Dynamical):* Cognition is dynamic interaction. Representations are distributed/contextual. Systematicity is learned/emergent.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Formalism:* Both must agree that *some* mapping exists between content and state, but avoid committing to "symbols" vs. "vectors" yet. Let's focus on "structured mapping."
      *   *Explananda:* List the four stipulated results.
      *   *Ruled Out:* Flat associationism (dead due to role-swap cost/generalization). Literal neural typewriter (dead due to graded interference/diversity curve).

  4.  **Drafting Section 2: The Table of Cruxes:**
      *   *Crux 1: Nature of Systematicity.* Is the diversity-dependent curve "real" systematicity or just statistical mimicry?
          *   Classicist: It's a pale shadow; true systematicity is immediate.
          *   Connectionist: It's the only kind that exists; "immediate" is a myth.
          *   Probe: Zero-shot transfer with *no* filler overlap, only structural overlap.
      *   *Crux 2: Constituent Identity (Re-encoding).* Does the linear map save the constituent or kill the "same token" idea?
          *   Classicist: Map proves structural identity survives format change.
          *   Connectionist: Format change proves vehicle is context-bound, not a stable symbol.
          *   Probe: Cross-decoding with *novel* constituents.
      *   *Crux 3: Architectural Priors.* Is structure in the weights or the data?
          *   Classicist: Inductive bias *is* the syntax.
          *   Connectionist: Inductive bias is just learning efficiency; structure is in the trajectory.
          *   Probe: Train on minimal data with vs. without explicit structural attention masks.
      *   *Crux 4: Marr Levels.* Are we arguing mechanism or description?
          *   Classicist: Mechanism must mirror description.
