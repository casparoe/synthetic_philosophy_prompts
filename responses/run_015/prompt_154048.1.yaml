          *   Adversarial collaboration norms (agreed claims first, cruxes, pre-registered predictions, no motte-and-bailey).
          *   **Stipulated Evidence Base (Undisputed):**
              1.  *Filler-Diversity Curve:* Accuracy on novel role reversals depends on training diversity (50 fillers = chance, 2000+ = 90%+). Curves identical across Transformer, RNN, Hybrid, except neural models have a tail of role-confusion errors.
              2.  *Re-encoding Result:* Intracranial/MEG decoding. Decoder for constituent identity works on Agent-role representation but fails on Theme-role representation. A linear map between role formats succeeds.
              3.  *Re-binding Probe:* Masked premise query. Graded interference from intervening constituents (no sharp capacity break). Small fixed cost for role-swapped constituents (independent of semantic similarity).
              4.  *Lesion Dissociation:* LIFC damage disrupts non-adjacent dependency binding, spares adjacent dependencies and single-word semantics.
