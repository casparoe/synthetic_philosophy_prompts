      *   *Crux 1 (Systematicity):* The evidence shows systematicity is *graded* by experience. Classicists usually argue for innate systematicity. They need to concede it's developmental. Connectionists need to concede it's structural, not just semantic.
      *   *Crux 2 (Re-encoding):* The linear map is key. Classicist says "Isomorphism." Connectionist says "Contextual Embedding."
