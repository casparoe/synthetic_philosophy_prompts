answer: |-
  This set is inconsistent as stated and the commitment that has to give is number 2.

  **1. Ground (2) vs. Quantum (5) and Case (6) — Severity: Fatal**
  *   **Pulling Against:** Commitment 2 states that "present holding is what does the work" regarding unjust enrichment. Commitments 5 and 6 describe a scenario where the present holding does *not* exist (gain consumed/company dissolved) or is held by innocents (heirs owe nothing), yet the duty persists and demands full value.
  *   **Why Genuine:** You cannot simultaneously claim the duty is grounded in the *current possession of unjust gains* (2) and claim the duty persists even when those gains are *consumed or held by non-liable parties* (5, 6). In your central case (6), the enricher (company) is gone, and the current holders (heirs) are exempted. Therefore, no one is "holding something that was never rightfully theirs" in the way 2 requires to ground the duty. If 2 is true, the claim in 6 fails; if 6 is valid, 2 is false.
  *   **Cheapest Repair:** Rewrite 2 to ground the duty in the *continuity of the institutional agent* rather than the *continuity of the asset*. Argue that the obligation attaches to the persisting institution (the State, as successor to the Company) regardless of whether the specific unjust enrichment survives.
  *   **Cost:** You lose the specific solution to the non-identity problem provided by unjust enrichment. You must now argue that institutional obligations survive even when the specific assets and original members are gone, which invites the non-identity objection back in (why does the new institution owe for the old act if the members are different?) and requires a stronger theory of institutional identity over time.

  **2. Quantum (5) vs. Case (6) — Severity: High**
  *   **Pulling Against:** Commitment 5 defines quantum as the position the victim "would have been in had [the wrong] not occurred" (counterfactual). Commitment 6 awards the land "as it now is, improvements included," generated by the heirs' labor.
  *   **Why Genuine:** Unless you assume the original owners would have necessarily tripled the value through their own labor, awarding the *current* improved value overcompensates them relative to the counterfactual standard in 5. You are granting them the value of the heirs' labor, which violates the "position they would have been in" metric.
  *   **Cheapest Repair:** Qualify 6 to specify that the claim covers the land's value *excluding* improvements attributable to the heirs' labor, or qualify 5 to include "opportunities lost," arguing the lost opportunity to improve the land is part of the counterfactual loss.
  *   **Cost:** Qualifying 6 reduces the reparative payout and complicates the adjudication process (requiring valuation of labor vs. asset). Qualifying 5 expands the counterfactual speculation significantly, making the quantum harder to calculate and more vulnerable to uncertainty objections.

  **3. Bearer (3) vs. Discharge (4) — Severity: Moderate**
  *   **Pulling Against:** Commitment 3 insists individuals owe nothing personally. Commitment 4 permits coercive taxation of those individuals to discharge the debt.
  *   **Why Genuine:** This is not a logical inconsistency but a justificatory gap. If the debt belongs strictly to the institution (3), using individual resources (4) requires a theory of why individual assets are accessible to institutional debts without implying personal liability.
  *   **Cheapest Repair:** Add a clause to 4 clarifying that taxation is justified by political obligation or membership benefits, distinct from moral liability for the wrong.
  *   **Cost:** You must defend a theory of political obligation that allows for coercive extraction for debts the subjects did not incur, which may conflict with liberal intuitions about consent.

  **4. Ground (1) vs. Ground (2) — Severity: None**
  *   **Pulling Against:** None.
  *   **Why Not:** Commitment 1 requires the duty be justified by "the wrong and by what the wrong did." Commitment 2 identifies "unjust enrichment" as the relevant effect of the wrong that survives the non-identity problem. These are compatible provided you treat the retention of unjust enrichment as a continuing effect of the original wrong.

  **Single Revision to Clean Up the Most**
  Replace Commitment 2 entirely. Drop the claim that "present holding is what does the work." Instead, argue that the *obligation* itself persists within the institutional lineage regardless of asset tracing. This aligns 2 with 3 (institutional bearer), 5 (wrong-based quantum regardless of consumption), and 6 (liability despite dissolution of the original enricher). It sacrifices the elegance of the unjust enrichment solution to non-identity but saves the coherence of your entire reparative framework.
