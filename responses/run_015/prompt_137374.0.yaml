  4.  **Ranking Severities:**

      1.  **Ground (2) vs. Quantum (5) & Case (6):** This is the fatal flaw. (2) anchors the duty to *present holding* of unjust gains ("present holding is what does the work"). (5) explicitly severs the duty from present holding ("makes no difference... whether the gain has long since been consumed"). (6) applies (5) to demand assets from people who *aren't* the wrongdoers and didn't receive the unjust gain (good faith buyers), while the actual enricher (company) is gone. If (2) is true, (5) and (6) fail. If (5) and (6) are true, (2) is false.
