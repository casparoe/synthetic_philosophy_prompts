answer: |-
  | Requirement | Concrete Case | Status & Camp | What Enforcing It Excludes |
  | :--- | :--- | :--- | :--- |
  | **1. Two-Part Code Cost:** The description length must include the cost of specifying the encoding scheme itself, not just the data given the scheme. | **The Contrived-Code Case:** A random noise sequence compresses perfectly if the codebook is defined as "print this specific sequence," but the codebook is as long as the sequence. | **Non-negotiable.** Any account claiming to distinguish structure from noise must penalize ad hoc vocabulary. | Excludes pure compression metrics that ignore model complexity; rules out "gerrymandered" patterns that fit only the observed dataset. |
  | **2. Counterfactual Scope:** The account must distinguish between predicting new observations and predicting outcomes of interventions, allowing for domains where only the former is possible. | **The Unmanipulable Domain:** A fossil record pattern predicts new finds beautifully but cannot be tested by manipulating the past; an account demanding intervention would falsely deny its reality. | **Preference of Interventionists.** Causal realists demand intervention; observational realists accept robust prediction. | Excludes strict interventionist accounts from claiming exclusivity over pattern reality; forces causal accounts to concede observational patterns are real but causally shallow. |
  | **3. Origin Independence:** The reality of a pattern cannot depend on whether the system was designed to exhibit it, only on whether the pattern holds. | **The No-Design-Story Case:** A neural network exhibits intentional regularities despite having no rational reconstruction of its weights; the pattern must stand even if the design stance fails. | **Non-negotiable** for this project. Collapsing reality into design availability begs the question against trained systems. | Excludes accounts that tie pattern reality strictly to designer intent or rational reconstructibility (strong design-stance realism). |
  | **4. Exception Tolerance:** The account must allow patterns to be real despite systematic errors, grading reality by predictive success rather than demanding perfect fit. | **The Near-Miss:** The intentional stance predicts a system well overall but fails on a specific subclass of inputs; the pattern is not simply false, but imperfect. | **Preference of Pragmatists.** Binary realists demand truth; pragmatists allow degrees of reality based on utility/accuracy. | Excludes binary true/false realism; forces the account to handle "mostly real" patterns without collapsing into instrumentalism. |
  | **5. Scale Stability:** A pattern must be indexed to a specific grain of description; reality claims must specify the vocabulary level at which the pattern persists. | **The Grain Case:** A regularity appears at a coarse level (e.g., "believes") but vanishes at the micro-level (e.g., "neuron fires") or vice versa. | **Non-negotiable.** Ignoring grain collapses the distinction between a pattern in the data versus a pattern in the system. | Excludes claims of absolute, level-invariant reality; rules out reductionist accounts that demand patterns exist only at the fundamental physical level. |
  | **6. Interpreter Neutrality:** The pattern must exist independently of whether an interpreter finds it useful, though discovery requires an interpreter. | **Reality vs. Usefulness:** A pattern might be real but computationally inaccessible to humans; usefulness is epistemic, reality is ontic. | **Preference of Realists.** Deflationists argue reality just *is* usefulness to an interpreter. | Excludes deflationary accounts that collapse pattern reality into interpreter interest or cognitive convenience. |
  | **7. Reflexive Consistency:** The account must be able to classify its own distinction between real and apparent patterns as either real or apparent without paradox. | **The Reflexivity Case:** If the account says "only intervention-supported patterns are real," is *that* pattern real if it cannot be intervened upon? | **Non-negotiable.** An account that fails its own criterion is self-defeating. | Excludes accounts that rely on privileged access or metaphysical exceptions for their own criteria. |

  ### (a) Tensions and Inconsistencies

  There are three significant tensions within this set of desiderata. The first is between **Counterfactual Scope (2)** and **Unmanipulable Domains (Case 3)**. If you enforce intervention-robustness as a condition for *causal* reality, you must concede that patterns in astronomy or paleontology are real but causally inert, or else admit your criterion is for causal structure rather than pattern-hood. This is a **fake tension** if you distinguish between *predictive* reality (compression + observation) and *causal* reality (intervention). What gives way is the ambition of the account: it must specify whether it is defining "real pattern" simpliciter or "causally robust pattern." For your purposes, you likely need the former to accommodate the no-design-story case without losing the unmanipulable cases.

  The second tension is between **Two-Part Code Cost (1)** and **Bounded Investigation**. True Kolmogorov complexity (the length of the shortest program producing the data) is uncomputable. A bounded investigator cannot verify whether a code is truly minimal or just very good. This is a **genuine inconsistency** if you demand strict computability. What gives way is the strictness of the metric: you must settle for an approximation (like Minimum Description Length) that is computable but only proxies for true complexity. This costs you certainty; you can never be sure a pattern isn't contrived, only that it hasn't been shown to be so yet.

  The third tension is between **Origin Independence (3)** and **Interpreter Neutrality (6)**. If intentional patterns are real without design backing, they rely on the intentional stance. But if the intentional stance is interpreter-relative (as Dennett suggests), then requiring Interpreter Neutrality threatens to make those patterns unreal. This is a **genuine inconsistency** for strong realists. What gives way is the definition of "mind-independent." You must allow that a pattern can be mind-independent in its *holding* (the system behaves that way regardless of us) but mind-dependent in its *identification* (only visible via intentional vocabulary). If you refuse this compromise, you cannot have real intentional patterns in non-designed systems.

  ### (b) The Most Exclusionary Requirement

  **Two-Part Code Cost (1)** does the most exclusionary work. It is the primary filter against noise masquerading as structure. Imposing it costs you the ability to declare any finite dataset "patterned" without qualification; every pattern claim becomes a claim about the efficiency of the vocabulary used to describe it. This cost is worth paying because without it, the distinction between a real pattern and a contrived code (Case 2) collapses. If you do not charge for the code, you cannot distinguish a law of nature from a list of observations, and your account loses its ability to underwrite prediction. It forces you to acknowledge that reality is tied to compressibility, but compressibility relative to a fair encoding.

  ### (c) Scorecard for Candidate Views

  **Dennett's Compression Criterion:** This view holds that a pattern is real if it is compressible relative to the noise. It satisfies **Origin Independence** and **Scale Stability** well, allowing intentional patterns in trained systems. However, it violates **Two-Part Code Cost** unless refined, as simple compression can be gamed by complex codes. It also struggles with **Exception Tolerance**, often framing patterns as binary (real or not). It disappoints the **Counterfactual Scope** preference by not inherently distinguishing prediction from intervention.

  **Minimum Description Length (MDL) / Two-Part Code:** This refines Dennett by explicitly penalizing model complexity. It satisfies **Two-Part Code Cost** and **Exception Tolerance** (by allowing error terms). It handles **Scale Stability** by treating grain as a parameter of the model. However, it violates **Counterfactual Scope** because compression is observational; it does not guarantee interventional robustness. It is a strong candidate for your needs but requires supplementation to handle causal claims.

  **Interventionist / Difference-Making Account:** This view ties patterns to causal structure and manipulability. It satisfies **Counterfactual Scope** perfectly and handles **Reflexive Consistency** well if applied uniformly. However, it violates **Origin Independence** if design is treated as a form of intervention, and it fails **Unmanipulable Domains** by denying reality to observational patterns. For your chapter, it is too restrictive unless you weaken "intervention" to include "natural variation."

  **Deflationary / Instrumentalist Treatment:** This view holds that pattern-hood is purely a matter of utility to an interpreter. It satisfies **Exception Tolerance** and **Unmanipulable Domains** easily. However, it violates **Interpreter Neutrality** and **Origin Independence** by collapsing reality into usefulness. It cannot support the "modest claim about content" you require, as content becomes purely ascribed rather than detected. It fails the core job of distinguishing reality from utility.
