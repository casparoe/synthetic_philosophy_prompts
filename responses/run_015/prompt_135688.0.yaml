      *   **Specific Question 1:** Does James anticipate Dennett's rejection of a central theater, or does he smuggle in a unified spectator (e.g., via "centre of interest")?
      *   **Specific Question 2:** Is James's stream genuinely acausal and distributed like Dennett's, or does its continuity depend on a hidden Cartesian stage?
      *   **Specific Question 3:** How do they diverge on *temporal binding*? Does James's "specious present" solve the binding problem, or is it the illusion Dennett targets?

  2.  **Initial Assessment & Key Concepts:**

