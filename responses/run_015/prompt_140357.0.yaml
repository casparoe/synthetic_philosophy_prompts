answer: |-
  Good morning. For those who don't know me, I'm his grandson. We are gathered in a VFW hall, which feels appropriate. My grandfather was a man of work, of specific tools, and of a very particular kind of quiet.

  For fifty years, he painted signs. You've seen them. The shopfronts, the boats, the produce crates. To most of us, a sign is a thing you read. To him, a sign was a thing you *did*.

  He spent a lifetime thinking about the letter 'a'. Not the picture of the letter, but the making of it. He believed that a letter wasn't a shape you looked at, but a movement you performed. It was the order of the strokes, the pressure of the bristles, the breath he held before closing the bowl.

  He used to say that if you traced one of his letters perfectly, you didn't have his letter. You had what he called an "orphan letter." It looked right, but it belonged to no hand. It was a shape without a heartbeat.

  I learned this the only way he allowed. When I was seven, he let me help him paint. But I wasn't allowed to touch the strokes. He said the strokes had movement, and movement was dangerous if you didn't know the music. He let me fill in the white spaces inside the letters—the holes in the 'o' and the 'a'. He said that space was safe because it had no movement in it. I remember sitting on a milk crate, carefully painting the inside of a wet 'R', while he stood over me and watched the brush dry.

  I tell you this because we often try to find comfort in the things people leave behind. We look at the signs still hanging on Main Street and say, "A part of him is still there." But if I tell you what he taught me, I have to tell you the truth: to him, that paint on the wall is just the shell. The sign is dry. The movement has stopped. Those letters are orphans now. They are legible, yes. You can read them. But they are not *him*.

  This brings me to something difficult, and I want to speak to it honestly, for my cousin Nate, for the apprentices in the back, and for the family in the front.

  Next week, Nate is releasing a typeface made from scans of Grandfather's work. The proceeds will pay for the headstone. It is a generous act of love. But we should know what it is. It is not my grandfather's hand. It is a map of where his hand has been.

  Grandfather knew about this project. He tolerated it. He never endorsed it. He understood that Nate needed to make a new thing from the old shapes. To the lettering people here: you know this is a font of orphan letters. To the family: you should know this is a digital monument, not a resurrection. It is a way to pay for the stone, not a way to keep the man alive. And there is honor in that, even if it isn't the honor my grandfather would have claimed for himself.

  So, if the signs are just shells, and the font is just a map, where is he?

  He is not in the paint. He is in the movement that was passed on.

  I look at the apprentices in this room. You watched him work. You know the pause before the bowl closes. You know the snap of the wrist on the serif. When you pick up a brush and make that specific motion, you are not making an orphan letter. You are continuing a movement. The consolation is not that his work survives, but that his *action* survives in you.

  To the grandchildren, including the youngest here: You don't need to know about stroke order or vector tracing. You just need to know that he believed the value was in the doing, not the having. He didn't care about owning the sign; he cared about the moment the brush touched the wood.

  He told me once, the only thing he ever said about dying: "I do not mind my letters outliving me, as long as nobody mistook them for me."

  He was right. The letters are still here. They are beautiful. But they are not him. He is in the hands that learned from his. He is in the memory of the motion. And he is in the white space he left for us to fill, carefully, with our own lives.

  Thank you.
