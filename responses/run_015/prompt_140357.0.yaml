      *   *Quote included?* Check.
      *   *Time?* Looks like about 5-6 minutes spoken.

  6.  **Final Polish:** (Writing the text with attention to rhythm and emotional arc.) *Self-correction: Make sure the transition from the technical philosophy to the emotional goodbye is smooth.* The bridge is the idea that *we* are the ones who remember the movement.

  *(Drafting mental note: Ensure I don't sound like I'm scolding the family for liking the signs. The signs are beautiful, just not "him" in his view.)*

