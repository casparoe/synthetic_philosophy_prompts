          2.  **The Philosophy (Simplified):** Explain the "movement vs. shape" idea without getting bogged down in jargon. Use the "filling the counters" anecdote for the kids/family.
          3.  **The "Orphan" Concept:** Address the signs that remain. They are shells. This addresses the "work lives on" trope by subverting it gently.
          4.  **Nate's Font:** Address the elephant in the room. Frame it as a translation, not a resurrection. Acknowledge the tension.
          5.  **The Consolation:** Where does he live? In the hands that learned from him. The movement continues in people, not paint.
          6.  **Closing:** The quote about dying. Final farewell.

  3.  **Drafting - Section by Section:**

