      *   *The Anecdote:* The "counters" story is perfect. It bridges the gap between the experts (who know what a counter is) and the family (who remember me doing it). It illustrates the "white space/no movement" theory.
      *   *The Signs/Orphans:* The signs on the buildings. They look like his, but he's not in them anymore. They are "orphan letters." This is hard for the family to hear (usually we say "his legacy lives on"), so I need to pivot quickly to where the *real* legacy is.
