  2.  **Determine the Tone and Structure:**

      *   **Tone:** Respectful, clear, slightly poetic but grounded, warm but intellectually honest. Avoid religious platitudes (he wasn't religious) but acknowledge the spiritual weight of his craft.
      *   **Structure:**
