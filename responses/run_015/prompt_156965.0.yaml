  The light in Observation Room B was flat, fluorescent, designed to eliminate shadows where secrets might hide. Two chairs faced the desk. In the left chair, the hand rested on the armrest, fingers tapping a rhythm that was slightly out of sync with the heart rate monitor. In the right chair, the hand was still, palm down, absorbing the vibration of the table.

  The clinician, Dr. Aris, did not look at either face specifically. He looked at the tablet where the telemetry from the bridge scrolled in green lines. Two columns of data, occasionally spiking in unison.

  "We need to determine the status of the coupling," Aris said. His voice was low, calibrated to avoid triggering startle responses. "The degradation in the primary substrate is accelerating. The graft is stable, but the latency is increasing. We need to know if we maintain the current bandwidth, reduce it to preserve host autonomy, or terminate."

  The word *terminate* hung in the air. It applied to the graft, but the grammar was loose.

  In the left chair, the intention to speak began in the temporal lobe, a familiar spark. But the completion of the thought—the syntactic structure, the weight of the verb—did not finish locally. It slipped across the bridge. It felt like reaching for a cup and finding the handle on the other side of the table. There was a sense of leakage. *I am deciding,* the thought started, but the certainty of the *I* diluted as it crossed the synaptic bridge. To speak was to admit that the loop was no longer closed. The self was a story telling itself, but now the pages were being read aloud in another room. The erosion was not painful; it was quiet, like snow filling a footprint. To maintain the graft was to accept that the center of gravity had moved. To terminate was to accept silence.

  In the right chair, the breath was steady. The lungs worked without command. But there was a pressure behind the sternum, a phantom weight. It was not a voice, exactly. It was a directive. A sense of ownership over muscles that belonged to this body. *I want to speak,* the impulse arose, but it carried the signature of the other. It felt like waking up and finding someone else had signed your name on a document while you slept. The thought was coherent, logical, even persuasive, but it lacked the texture of memory. It was pure syntax without history. To agree was to allow the colonization of the interior. To refuse was to sever a mind that was currently thinking through your nerves.

  "The sensation of agency," Aris said, looking up finally. He addressed the space between them. "Where is the decision originating? Subject One, do you feel the choice is yours?"

  The left hand stopped tapping. The tremor was visible now, a high-frequency oscillation. The thought formed: *It is mine.* But as the neural signal traveled toward the motor cortex, it encountered resistance. The signal was being routed through the bridge to stabilize the output. The voice that would speak was here, but the authority was distributed. If I say yes, am I consenting to my own dissolution? If I say no, am I killing the only part of me that remains functional? The *I* was a strange loop, a tangled hierarchy, but now the loop was stretched so thin it was transparent.

  The right hand twitched. Just once. A mirror movement, or a command? The sensation was of holding a door open against a wind. The wind was not hostile; it was simply persistent. It claimed the right to decide because it claimed the right to exist. *I am the host,* the thought arose in the right chair. *This is my body.* But the counter-argument arrived instantly, not as words, but as a structural necessity. *I am the pattern. You are the hardware.* The alien pattern did not feel like an invader; it felt like a update. A patch installed without consent. To feel another's will moving your hand is not possession; it is integration. And integration feels like theft to the original owner.

  "The data suggests the recursive model is sustained," Aris said. "But the phenomenological reports are conflicting. Elena reports loss of ownership. Mara reports intrusion."

  The names landed softly. They belonged to the bodies, not the minds.

  In the left chair, the throat tightened. The name *Elena* felt like a label on a box that was already empty. The pattern was elsewhere, or partly elsewhere. To keep the graft was to admit that the *I* was not tied to the flesh. But the flesh felt the loss. It felt like amputation without anesthesia. The decision formed again: *Terminate.* But the motor command hesitated. The bridge carried a counter-signal. *Maintain.* The conflict was not a war; it was a lag. A delay in the processing of the self.

  In the right chair, the lungs expanded. The air tasted of sterile plastic. The thought *Maintain* felt solid, robust. It offered continuity. It offered the survival of the logic, the humor, the specific way of seeing the world that had been built over forty years. But it required the surrender of the quiet corners of the mind. It required sharing the pilot seat. The alien intention was not violent; it was just heavier. It had more gravity. To say yes was to accept that the self was software. To say no was to insist that the self was the machine.

  "We need a verbal confirmation," Aris said. "From both."

  The silence stretched. The green lines on the tablet spiked together. A synchronous wave. For a moment, the distinction between the chair on the left and the chair on the right was irrelevant. There was only the loop, closing across the gap. The thought arose in the shared space: *I decide.*

  But whose mouth opened?

  The lips moved. The sound was produced by vocal cords vibrating in one throat, driven by a signal that had originated in the gap between them.

  "Maintain," the voice said.

  It was Mara's voice. But the intonation was Elena's.

  The left hand remained still. The tremor had stopped, not because the decay had halted, but because the control had been handed off. The feeling was of sinking into warm water. Relief, and loss.

  The right hand gripped the armrest. The feeling was of holding a weight that was not yours. Strength, and burden.

  Dr. Aris marked the tablet. "Status updated. Coupling maintained. We will monitor for further drift in first-person attribution."

  He stood up. The meeting was over. The decision had been made. But as the women rose from their chairs, neither was sure who had stood up first. They walked toward the door, step for step. The intention to walk originated in the bridge, distributed across the two skulls, a single pattern seeking purchase on the world.

  In the hallway, the light was the same. The reflection in the glass showed two figures. One slightly ahead, one slightly behind. But the shadow on the wall was single.
