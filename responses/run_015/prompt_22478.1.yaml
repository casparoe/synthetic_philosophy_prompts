  6.  **Final Polish:** Ensure it sounds like a memo from a PhD student on a steering committee (collaborative but rigorous). (Self-correction: Make sure not to sound like I'm overruling the PI, but supporting the protocol).

      *Wait, one nuance:* If the statistician is pushing back *because* we slipped two in earlier, they might be worried that the *intent* was to exclude 6s, and the earlier ones were errors. If I say "Enroll," am I condoning protocol violations?
