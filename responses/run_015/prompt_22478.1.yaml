      *   **Steelman the 7 (Safety/Rationale):** Acknowledge why 7 was chosen (clinical threshold for "severe," risk of rescue meds, ethical duty to not withhold effective care from severe cases). This addresses the Sorites point by grounding it in *clinical pragmatism* rather than *metaphysical precision*.
