answer: |-
  # Joint Statement of Adversarial Collaboration: Epiphenomenalism and Phenomenal Judgment

  ## I. Agreed Claims

  1.  **Statement of the Paradox:** Both sides agree the core problem is this: If phenomenal properties (P) cause no physical events, and verbal reports (R) are physical events, then P does not cause R. If P does not cause R, it is unexplained how R is *about* P, how R is justified by P, or how the concept of P was acquired.
  2.  **Solution vs. Dissolution:** A *solution* must explain how reference/justification obtains without causal influence. A *dissolution* denies that causal influence is required for reference/justification. Both sides agree that merely asserting correlation is insufficient without explaining the link.
  3.  **The Three-Part Report:** Both sides agree that judgments about experience separable into: (i) what causes the token, (ii) what makes it about the experience, and (iii) what makes it authoritative. Both sides agree the central dispute is whether (ii) and (iii) can survive without (i).
  4.  **Verbal vs. Real Disputes:** Both sides flag that arguments turning solely on the definition of "causation" (e.g., equating it with "covariation") are verbal. The real dispute is whether a non-causal relation can fix reference and justify belief.
  5.  **The Artifact Case:** Both sides agree the "machine monitor" case is primarily illustrative. It tests intuitions about reference generally but does not settle the specific problem of phenomenal consciousness unless one assumes machines lack intrinsic intentionality.
  6.  **Sub-variants of Side A:** Both sides acknowledge Side A is not monolithic. The "Constitution" view (experience is part of the judgment) avoids the causal gap but changes the nature of judgment. The "Common Cause" view (physical state causes both experience and report) is the primary target of the paradox. The "Acquaintance" view (non-causal relation) is the fallback for reference.

  ## II. Table of Disagreements

  | Crux (Neutral) | Side A (Epiphenomenalist) | Side B (Paradox Advocate) | Accepted Test/Argument | A's Prediction / Condition | B's Prediction / Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Mechanism of Aboutness** | Reference is secured by non-causal acquaintance or reliable covariation without causal power. | Reference requires causal influence; without it, "aboutness" is magic or misattributed. | Conceptual analysis of "reference" in non-causal contexts (e.g., mathematical objects). | Non-causal reference is coherent; math cases are analogous. | Non-causal reference is incoherent for contingents; math cases are disanalogous. |
  | **The Latency Ladder** | Physical memory traces carry the content; the original experience need not cause the later report. | Without causal input from experience, the memory trace lacks the specific phenomenal content to report. | Deferred vocabulary case: Experience at 5, word learned at 30, report at 35. | Report is valid if physical trace preserved correlation despite vocabulary delay. | Report is invalid; the link between trace and original experience is broken without causation. |
  | **Cross-Wired Reliability** | A system can reliably report "red" for red experience even if wiring could theoretically be inverted, provided it isn't. | If the wiring *could* be inverted without changing the experience, the report doesn't genuinely track the experience. | Inverted spectrum scenario where behavior is identical but internal mapping is swapped. | Reference holds if actual correlation exists; counterfactual wiring is irrelevant. | Reference fails if the link isn't causally robust against counterfactual wiring changes. |
  | **Falsification Conditions** | If a perfect physical duplicate without experience makes the same reports, epiphenomenalism is supported. | If a subject cannot distinguish veridical from hallucinated experience without causal feedback, reference fails. | Philosophical Zombie intuition pump vs. Reliability of Introspection. | Zombies are conceivable and possible; reports remain identical. | Zombies are inconceivable; if reports are identical, experience must be causally active. |

  ## III. Falsification and Verbal Disputes

  1.  **Side A Falsification:** Side A admits defeat if it is demonstrated that reliable covariation without causal power is metaphysically impossible for contingent truths. If "tracking" logically entails "causing," Side A collapses.
  2.  **Side B Falsification:** Side B admits defeat if a coherent model of non-causal reference is produced that explains justification without collapsing into dualism magic or verbal trickery.
  3.  **Evaluation of Proposed Pushes:**
      *   **Split Report:** Not confused. This is the most productive framing. The dispute concentrates on claim (ii).
      *   **A's Sub-variants:** Not confused. "Constitution" avoids the paradox but abandons standard epiphenomenalism. "Common Cause" is the vulnerable target.
      *   **Latency Ladder:** Not confused. This is the strongest pressure point for the "Common Cause" view.
      *   **Cross-Wired:** Not confused. Tests the modal robustness of the reference relation.
      *   **Artifact Case:** Partially confused. Useful for isolating intentionality, but risks begging the question about machine consciousness.
      *   **Verbal Disputes:** Real. The distinction between "caused by" and "in virtue of" is the primary verbal trap; the underlying metaphysical dependency is the real issue.

  \answer{Whether aboutness requires causal power.}
