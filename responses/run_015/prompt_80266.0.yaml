      *   *State's Role:* The state is currently shame-dominant (criminal records = stigma). Moving to guilt-dominance requires decoupling punishment from permanent status loss.
      *   *Constraint:* Some harms are so big they threaten the social contract, demanding public ritual (which looks like shame but functions as reintegration).
      *   *Answer:* It's not a binary choice. It's about designing *pathways back*. A culture can prioritize guilt *processes* (RJ, restitution courts) but cannot eliminate shame entirely because humans are social animals who care about status. The design problem is preventing shame from becoming *permanent* exclusion.

  6.  **Addressing the Surgeon Case:**
