answer: |-
  Here is an analysis of your verdicts, the principle driving them, and the implications for institutional design.

  ### 1. The Principle: Accountability vs. Status Management

  You are searching for a variable that distinguishes your "good" outcomes from your "bad" ones. You initially hypothesized it was **Public vs. Private**, but the factory case broke that rule. You also considered **Act vs. Self**, but that doesn't fully explain why the CEO's apology felt wrong (an apology is inherently about the self's relation to the act).

  The variable actually doing the work in your gut verdicts is **Direction of Energy: Repair vs. Status.**

  *   **Guilt (in your usage):** Energy is directed outward toward the **harm and the debt**. It asks: *What is owed? How do we make this right?* It is forward-looking and transactional in the best sense (restoring equilibrium).
  *   **Shame (in your usage):** Energy is directed inward toward the **offender's standing** or outward toward the **offender's destruction**. It asks: *Who are you now? How low can you go?* It is backward-looking and performative.

  Under this principle, publicity is not the variable; **function** is. Publicity is merely a tool that can serve either repair or status destruction.

  **Applying the Principle to Your Cases:**
  *   **Friend/Group Fund:** Private restitution pays the debt. Energy goes to repair. (Guilt/Good).
  *   **RJ Circle:** Offender listening to victim validates the harm. Energy goes to repair. (Guilt/Good).
  *   **CEO Data Breach:** The apology was a "performance of remorse." It focused on the CEO's image (either saving it or sacrificing it) without fixing the data. Energy went to Status Management. (Shame/Bad).
  *   **Social Media Pile-on:** The goal is humiliation, not restitution. Energy goes to Status Destruction. (Shame/Bad).
  *   **Factory Water Poisoning:** You feel a private apology is a "non-apology." Why? Because the harm was public. To validate the victims' reality and restore public trust, the *acknowledgment of debt* must match the *scope of the harm*. If the factory acknowledges the debt publicly to facilitate repair (filters, medical funds), that is **Public Accountability (Guilt)**, not Shame.

  **The Verdict You Must Drop:**
  To keep this principle clean, you must drop the heuristic that **"Public equals Shame."**

  Your intuition on the factory case is correct, but your labeling rule is wrong. A public apology is not inherently shame-based. It becomes shame-based only if it is performative (like the CEO) or punitive (like the pile-on). If the public acknowledgment is tied to concrete restitution and systemic change, it is the guilt-register of **Public Accountability**. You need to re-categorize the Factory case not as an exception to your rule, but as proof that your rule was about *function*, not *venue*.

  ### 2. The Design Question: Can a Culture Choose Guilt?

  Can a culture choose to be guilt-dominant (Accountability/Repair) rather than shame-dominant (Status/Stigma)? Yes, but it is an intense institutional design problem, not just a matter of attitude.

  **The Institutional Requirements:**
  A guilt-dominant culture requires high-trust infrastructure for **debt payment**.
  *   **Forums:** You need venues like your RJ circles, but scaled. Restorative justice courts, victim-offender mediation programs, and truth commissions.
  *   **Sanctions:** Sanctions must be finite and completable. Prison is often shame-dominant (permanent stigma, "ex-con"). A guilt-dominant sanction is community service or restitution that, once completed, clears the ledger.
  *   **The State's Role:** The state currently monopolizes punishment as retribution (shame). To shift to guilt, the state must act as a guarantor of repair. It must ensure the victim gets paid and the offender isn't permanently exiled.

  **The Constraints:**
  1.  **Scale and Anonymity:** Shame works efficiently in small, tight-knit communities (reputation is currency). In large, anonymous societies, shame becomes unmoored. It turns into the "pile-on" because the community isn't close enough to facilitate reintegration. A guilt-dominant culture is harder to sustain in a population of millions without strong local intermediaries (like churches, unions, or community orgs) to manage the reintegration.
  2.  **The "Moral Hazard" Constraint:** If a culture is too guilt-dominant (purely transactional), it risks commodifying harm. "I paid the fine, so I'm clean." Some harms (violent assault, systemic abuse) damage the social fabric in ways money or service can't fully repair. These require a ritual element that *looks* like shame (public condemnation) to reaffirm community values, even if the goal is eventual reintegration.
  3.  **Trust:** Guilt requires the victim to believe the offender's commitment to repair. If social trust is low, victims will demand shame (punishment) because they don't believe repair is possible. You cannot have a guilt-dominant culture without a baseline of social trust.

  **Verdict:** A culture can *prioritize* guilt-processes, but it cannot eliminate shame. The design goal shouldn't be "no shame," but rather **"no permanent shame."** Institutions must be designed to convert shame (condemnation of the act) into guilt (obligation to repair) and then to reintegration.

  ### 3. The Surgeon Case: Application of the Principle

  **Case:** A surgeon makes a serious, non-negligent error (a known complication that materialized, not malpractice).
  **Principle:** Direction of Energy (Repair vs. Status). Scope of Acknowledgment matches Scope of Harm.

  **The Prediction:**
  *   **To the Patient (Private):** **Required.** The harm was intimate and specific to the patient. Acknowledging the outcome privately validates their suffering and maintains the therapeutic relationship. This is **Guilt/Accountability** (owning the outcome, even if not "fault").
  *   **To the Hospital Board (Internal):** **Required.** This is for systemic repair (checking protocols, support for the surgeon). It serves the function of preventing future harm.
  *   **To the Profession (Data, Anonymized):** **Recommended.** Contributing to morbidity and mortality reviews helps the collective "debt" of knowledge.
  *   **To the Public (Named):** **Not Required (and potentially Shameful).**

  **Why?**
  Because the error was non-negligent, there is no moral debt to the *public*. The harm was not public. Naming the surgeon publicly serves no repair function for the patient (who already knows) and does not prevent future harm better than anonymized data would.

  Public naming in this context shifts the energy from **Repair** (patient safety, learning) to **Status** (punishing the surgeon's reputation). It risks driving the surgeon to hide future errors (defensive medicine), which increases public risk.

  **The Exception:**
  If the hospital tries to *hide* the error from the patient to protect the surgeon's status, *then* a public whistleblower event becomes necessary. But that is no longer about the surgical error; it is about the cover-up. In that scenario, the harm *becomes* public (breach of trust in the institution), and the accountability must match that new, public harm.

  **Summary:**
  Your gut is telling you that **visibility must match liability.**
  *   Private debt = Private acknowledgment.
  *   Public debt = Public acknowledgment.
  *   But in all cases, the acknowledgment must be tied to **repair**, not **status degradation**.

  Drop the "Public = Shame" rule. Replace it with "Performance = Shame; Responsibility = Guilt." That keeps your factory verdict intact and cleans up the CEO case.
