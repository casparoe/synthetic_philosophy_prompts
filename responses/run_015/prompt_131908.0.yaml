answer: |-
  ### The Spec: Requirements for an Echo Chamber Theory

  | Requirement | Status | Target Family of Account |
  | :--- | :--- | :--- |
  | **1. Trust vs. Exposure:** Distinguishes isolation from active discounting of outsiders. | **Non-negotiable** | Naive information-flow models (Sunstein) |
  | **2. Strawman Exposure:** Handles degraded contact that increases confidence. | **Non-negotiable** | Contact hypothesis / "More speech" remedies |
  | **3. Algo-Isolation:** Handles individual feeds without communal belief. | **Job 2 Only** | Filter bubble conflation (Pariser) |
  | **4. Truth-Agnosticism:** Verdict independent of belief truth-value. | **Non-negotiable** | Truth-based definitions (Fake News frameworks) |
  | **5. Prescient Minority:** Protects groups later vindicated by history. | **Non-negotiable** | Hindsight bias / Consensus theories |
  | **6. Asymmetric Competence:** Allows niche expertise without global authority. | **Non-negotiable** | Overgeneralized expertise critiques |
  | **7. First-Person Skepticism:** Self-reports of openness are not evidence. | **Non-negotiable** | Survey-based / Self-assessment models |
  | **8. Exit Story:** Must offer a lever acceptable to the insider. | **Non-negotiable (Job 1)** | Structural determinism / Foucaultian traps |
  | **9. Reflexivity:** Theory must apply to its own citation graph. | **Virtue, not Spec** | Academic blindspot critiques |

  ### The Prejudices Dressed as Desiderata

  You suspected two or three of these are camp prejudices. You are right.

  1.  **"Diagnosable from the inside using resources you already have."**
      *   **The Prejudice:** This is the liberal epistemologist's wish that reason always provides a foothold. If the echo chamber is *effective* (per Requirement 1), it has successfully re-calibrated the insider's trust metrics. Demanding they diagnose it using *current* resources is demanding they solve a problem using the broken tool that created the problem.
      *   **The Fix:** Change to "Diagnosable from the inside *given a specific epistemic lever* (e.g., friction, anomaly, betrayal)."

  2.  **"Symmetric — not a partisan weapon."**
      *   **The Prejudice:** This is often a demand that the theory *find* equal guilt on both sides before it is accepted. The *criteria* must be symmetric (applicable to any group), but the *verdict* need not be. Echo chambers are structurally asymmetric trust networks; demanding the theory prove "both sides do it" to be valid is a political constraint, not a theoretical one.
      *   **The Fix:** Require *criteria neutrality*, not *verdict symmetry*.

  3.  **"Exit story... the person inside could in principle accept."**
      *   **The Prejudice:** This assumes the insider is reachable by rational argument. Some epistemic environments function by pre-emptively disqualifying external rationality as "oppressor logic" or "elite discourse." If the chamber works by destroying the bridge, demanding a bridge is a category error.
      *   **The Fix:** Require an exit story that explains *how the bridge was burned*, even if rebuilding it requires external trauma or time.

  ### The Incompatibilities

  Your guess was close, but the tension is sharper.

  **1. The Epistemic Circularity (Job 1 vs. Thorough Insulation)**
  You cannot jointly satisfy **"Diagnosable from the inside"** and **"Insulation is thorough."**
  If the environment successfully teaches members to discount outside testimony (Req 1), then any external diagnosis you offer will be discounted by the very mechanism you are diagnosing. To satisfy Job 1, you must admit that *some* insiders will never be able to recognize the chamber while inside it. The theory must allow for "undetectable from the inside" cases, or it is empirically false.

  **2. Truth-Agnosticism vs. Precision (Req 4 vs. Job 2)**
  You cannot jointly satisfy **"Truth-Value Independence"** and **"Pointy enough to pick out real cases."**
  If you refuse to look at whether the beliefs are true (Req 4), you lose the easiest heuristic for identifying a chamber (i.e., "they believe false things"). You are left only with structural markers (citation density, trust networks). But tight citation networks are also how *expert consensus* works. Without truth-value as a check, your theory risks labeling *all* specialized subfields (including yours) as echo chambers. You need a behavioral marker of *active distrust* that distinguishes expertise from insulation, and that marker is notoriously hard to quantify without peeking at the truth.

  ### The Killer Requirement

  **Requirement 4: Truth-Value Independence.**

  This is the requirement that breaks the accounts people actually reach for. Most operational definitions of "echo chamber" in policy and journalism implicitly rely on the group believing something *false* or *harmful*.
  *   If you remove this, you can no longer use fact-checking as a proxy for structure.
  *   You force the institution to measure *trust dynamics* (who do you listen to?) rather than *content* (what do you believe?).
  *   This makes the metric much harder to game, but also much harder to compute. It rules out the "misinformation" frameworks that dominate current institutional thinking.

  ### The Two Least Certain Requirements

  **1. Requirement 8 (The Exit Story)**
  *   **Why I'm unsure:** It may be impossible to satisfy for Job 1. If the echo chamber functions as a "cult of epistemic trust" (Nguyen), the only exit may be *betrayal* or *trauma*, not argument. A theory that promises a rational exit may be selling a fantasy.
  *   **What would change my mind:** Empirical evidence of "rational defection." If we can show cases where insiders left *solely* due to internal inconsistency or external argument (without scandal/trauma), the requirement stands. If exits are always catalyzed by social rupture, the requirement should be dropped for a "Rupture Condition."

  **2. Requirement 9 (Reflexivity)**
  *   **Why I'm unsure:** This is a virtue of the *theorist*, not a constraint on the *theory*. A theory of gravity does not need to explain why physicists believe in gravity to be valid. Demanding the theory account for its own citation graph risks infinite regress or self-paralysis.
  *   **What would change my mind:** If the theory relies on *social mechanisms* that are universal (e.g., "all humans seek confirmation"), then it must apply to the theorists. If it relies on *specific structural conditions* (e.g., "algorithmic amplification"), and the theorists are not subject to those conditions, reflexivity is unnecessary. If your subfield uses the same citation/hiring practices you are studying, it is non-negotiable. If you are studying Twitter and writing a PDF report, it is optional.

  ### Summary for the Report

  For Job 1 (Internal): You must admit that **perfect insulation is undetectable from the inside.** Your framing cannot promise members they *will* know if they are in one; it can only offer them the *tools to check* their trust metrics.

  For Job 2 (Institutional): You must decouple **structure from truth.** Do not measure whether the subfield is *right*; measure whether it *punishes dissent* structurally. If you conflate them, the report will be read as a verdict on your subfield's correctness, not its health.
