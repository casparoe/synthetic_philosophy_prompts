  Sam is going to say **No**. This is not the same ship.

  Here is the map of the rules, the divergence, and the hypothetical that exposes the fault line.

  ### 1. The Competing Rules
  To match Sam's track record, we need two principles that explain all her past verdicts but fight over this new case.

  *   **Rule A (Sam's Likely Rule): Continuous Embodied Existence.**
      *   *Definition:* Identity requires an unbroken spatiotemporal path of a physical object. You cannot have a "gap" in existence where the object ceases to be a functioning physical entity. Information (scans, blueprints) is not a vessel; it is a description.
      *   *Fits History:* Explains why Gradual Replacement works (no gap), why 80% Synthetic works (physical path unbroken + core intact), and why Warehouse/Teletransport/Sudden Destroy fail (gaps in physical existence or function).
  *   **Rule B (The Rival): Continuous Causal Structure.**
      *   *Definition:* Identity follows the causal chain of the object's structural organization. As long as the "design" is being actively maintained and updated through a causal link (even digitally), the object persists, regardless of temporary physical instantiation.
      *   *Fits History:* Explains Gradual Replacement (structure updates), 80% Synthetic (structure holds), Warehouse (structure dormant/broken link = No), Teletransport (copy/break in causal chain = No), and Sudden Destroy (causal chain broken = No).

  ### 2. Where They Diverge
  This is the crack in the foundation.
  *   **Rule A (Sam)** says **No**. The fire created a gap in *physical existence*. The digital twin is just data (like the Mars scan), and re-assembling salvaged planks is just reconstruction (like the Warehouse case). The chain is broken.
  *   **Rule B (Rival)** says **Yes**. The digital twin was not a static scan; it was a *live simulation* causally linked to the ship's history. It kept the "shipness" alive during the physical gap. The reconstruction is just a change of substrate, guided by the continuous causal thread of the twin.

  ### 3. Closest Prior Analog
  Sam's closest analog is the **Sudden Destruction & Rebuild** case.
  *   In that case, the ship was destroyed and rebuilt in the same harbor the next day. Sam said "Not the same."
  *   The Digital Twin in your new case is a red herring to her. It functions like the *memory* of the ship, not the ship itself. To Sam, the fire is the same ontological breaker as the sudden destruction, regardless of whether a blueprint survived. The "Warehouse" case is a secondary analog for the salvaged planks: reassembled original parts make a replica, not the original.

  ### 4. The Principle She Is Committing To
  By saying No, Sam is committing to **Embodied Persistence**.
  She is asserting that *information cannot sustain identity without a physical substrate.* A ship is not its blueprint; it is the physical instantiation of that blueprint. If the instantiation ceases, the identity dies, even if the "ghost" of the ship lives on in a server. She prioritizes the *history of the matter* over the *continuity of the pattern*.

  ### 5. The Splitter Hypothetical
  To truly split Rule A (Embodied Existence) from Rule B (Causal Structure), you need a case where physical continuity is preserved, but causal/functional continuity is halted.

  **The "Deep Freeze" Case:**
  > The physical ship is encased in an indestructible, time-dilation field. Physically, it sits in the harbor untouched for 100 years (no material replacement, no destruction). However, inside the field, all atomic motion and function cease completely—it is effectively "paused." Meanwhile, a Digital Twin runs simulations of the ship aging normally. After 100 years, the field drops.

  *   **Rule A (Sam/Embodied):** **Yes, Same Ship.** The physical object never ceased to exist; the spatiotemporal path is unbroken. The material core never left.
  *   **Rule B (Rival/Causal):** **No, Different Ship.** The causal chain of function was severed. The ship didn't "live" through the century; it was a statue. The Twin is the only thing that maintained the causal history of a *functioning* vessel.

  This hypothetical forces Sam to choose between the *stuff* (which stayed) and the *life* of the ship (which stopped). Given her "80% Synthetic" verdict, she'd likely say **Same Ship**, confirming that for her, physical continuity trumps functional continuity.
