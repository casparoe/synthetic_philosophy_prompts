  5.  **Evaluate the "Meddlesomeness" Definition:**
      *   *Problem:* How do you formally define "willing to pay a cost"? In ordinal utility (which Sen uses), there are no "costs" or cardinal trade-offs. We only have rankings.
      *   *User's Definition:* "Meddlesome when they would be willing to pay a cost inside their own sphere..."
