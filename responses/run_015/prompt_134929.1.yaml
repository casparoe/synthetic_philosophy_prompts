      *   *Conclusion:* It is a Domain restriction.

  9.  **Final Polish:** Ensure the advice is actionable. "Build the paper around the filter, but own the axiom trade-off." This turns a potential "mistake" into a sophisticated philosophical argument about the limits of welfarism.

