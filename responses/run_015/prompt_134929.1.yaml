          *   If L only cares about $\{x, z\}$ and P only cares about $\{y, z\}$, there is no overlap to create a Pareto ranking on $\{x, y\}$.
          *   The paradox *requires* preferences to spill over spheres. That is the essence of the "meddlesome" nature.
