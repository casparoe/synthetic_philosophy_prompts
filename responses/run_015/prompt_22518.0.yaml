          3.  $H$ produces $r$ *on the basis of* recognizing intention (1).
      *   *The Regress:* For $H$ to recognize intention (1), $S$ must intend that $H$ recognizes intention (1). But for $H$ to recognize *that* intention, $S$ must intend that $H$ recognizes that $S$ intends... and so on.
      *   *The Core Question:* Is this an infinite stack of mental states that humans cannot physically/psychologically hold (psychological impossibility), or is it a logical structure that collapses into a single self-referential state (logical harmlessness)?

  3.  **Outline the Essay:**
