answer: |-
  **OFFICE FOR EPISTEMIC MODESTY**
  **STATUTORY GUIDANCE NOTE 14-C: REFERENCE CLASS SELECTION AND BASE RATE ADJUSTMENT**

  **Issued pursuant to Section 9(2) of the Forecasting Accuracy Act 2024.**

  **1. Purpose and Scope**
  1.1. This Guidance establishes the mandatory protocol for establishing probabilistic baselines prior to resource allocation.
  1.2. The objective is to mitigate the Planning Fallacy by enforcing an Outside View across all funded ventures.
  1.3. Subjective conviction, herein referred to as 'Vibes', is not admissible evidence unless quantified against a historical control group.

  **2. Selection of Reference Class**
  2.1. Applicants must identify a Reference Class comprising historical precedents sharing relevant features with the Proposed Venture.
  2.2. To prevent the 'Narrowing Fallacy', a class containing fewer than 50 historical members is statutorily invalid. Adding features to distinguish the venture reintroduces the Inside View and is prohibited.
  2.3. To prevent the 'Broadening Fallacy', a class defined solely by 'commercial enterprise' is insufficiently predictive.
  2.4. The Office reserves the right to reclassify Ventures where the selected class appears optimized for favourable base rates ('Reference Class Laundering').
  2.5. Where an Applicant argues their features justify a narrower class, they must demonstrate that said features correlate with success in the broader population, not merely in their specific case.

  **3. The Unprecedented Venture Protocol**
  3.1. Where an Applicant claims the Proposed Venture is unique (i.e., no valid Reference Class exists), the Venture shall be assigned to Class U: 'Projects Self-Described as Unprecedented'.
  3.2. The historical success rate for Class U is fixed at 3.2% (±0.4%).
  3.3. Applicants may not appeal this classification on the grounds of actual uniqueness, as the claim of uniqueness is itself a data point within Class U.

  **4. Worked Example: Application 882-B (Urban Apiary)**
  4.1. **Applicant Proposal:** Community beekeeping initiative in post-industrial zone.
  4.2. **Applicant Selected Class:** 'Sustainable Pollination Infrastructure' (N=12). *Rejected under Clause 2.2.*
  4.3. **Applicant Secondary Class:** 'Green Technology Startups' (N=4,500). *Rejected under Clause 2.3.*
  4.4. **Office Determination:** 'Small Retail Enterprises in Post-Industrial Zones' (N=3,200).
  4.5. **Base Rate Applied:** 12% survival at 24 months.
  4.6. **Outcome:** Funding reduced proportionally to risk profile. Applicant requested £50,000; awarded £6,000 plus probabilistic insurance voucher.

  **5. Modesty Returns and Uncertainty Bands**
  5.1. Applicants must declare a 90% Confidence Interval for projected outcomes.
  5.2. Where the Upper Bound exceeds the Lower Bound by more than 400%, the Applicant must submit a Modesty Return explaining why the requested funding amount remains a fixed integer rather than a probabilistic distribution.
  5.3. It is noted that most Applicants request 100% of funds regardless of stated failure probability. This discrepancy shall be recorded but not penalised, provided the uncertainty is acknowledged in writing.

  **6. Second-Order Base Rate Assessment**
  6.1. Applicants are advised that the success rate of projects approved by this Office is subject to Outside View scrutiny.
  6.2. The current success rate for Office-Approved Ventures is 14%.*
  6.3. Applicants may incorporate this Second-Order Base Rate into their personal risk calculations. However, citing this rate as grounds for increased funding to mitigate Office error will result in automatic rejection under Clause 1.3.

  *\*Footnote: See Regression Analysis 44. The correlation between Office Approval and Venture Success is statistically indistinguishable from zero when controlling for applicant tenacity. This statistic is provided for transparency only.*

  **7. Form Field Specification**
  Applicants must complete the following digital input during submission:

  > **BOX 4.2: EPISTEMIC JUSTIFICATION**
  > *Explain why your venture differs from the base rate without invoking unique internal qualities.*
  > **[ MAX 140 CHARACTERS ]**

  **8. Stakeholder Impact**
  8.1. The Office acknowledges concerns regarding innovation stifling.
  8.2. As noted by tech founder Julian Vane (2025): "We used to build things because we thought we were special. Now we fill out forms proving we're average. The irony is that the form requires you to argue you're an exception to the rule that exceptions don't exist. I haven't launched a product in eighteen months. I'm just optimizing my reference class."

  **9. Commencement**
  9.1. This guidance comes into force immediately.
  9.2. Retrospective application applies to all ongoing ventures where hope exceeds data.

  **Signed,**
  **The Director of Probabilistic Compliance**
