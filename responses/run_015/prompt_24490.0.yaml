prompt: |-
  I work on the governance tooling team at a prediction market platform, and clients keep asking us to "just do futarchy" — hand a policy decision to a prediction market — without understanding what that actually requires. We get about two of these requests a week, and the review has to be doable by an engineer who is not a philosopher in a single working day, with the market design lead signing off. Please turn futarchy into a concrete design procedure my team can run on a proposed policy question. In order, the procedure should specify: how to reformulate the question so the market is forecasting the right counterfactual — what would actually happen if the policy were adopted — rather than some untradeable value question; what counts as a sufficient resolution criterion (who adjudicates, on what evidence, and what happens if the outcome turns out to be ambiguous); what manipulation and verification checks to run before the market goes live; how to convert market prices into an actual decision, including what to do when related markets disagree; and at which step the procedure must stop and hand the decision to a human because the remaining question is one of values, not prediction. Then run the procedure on two proposals: a city council deciding whether to ban single-use plastic bags, and a university deciding whether to fund a ten-year basic research program. Respond in the style of an expert in market design and decision theory. Think very carefully before answering, and be explicit about which steps are judgment calls that no amount of market design can eliminate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Governance tooling team at a prediction market platform.
      *   **Problem:** Clients keep asking to "just do futarchy" without understanding the complexities.
      *   **Constraint 1:** The review must be doable by an engineer (not a philosopher) in a single working day.
      *   **Constraint 2:** Market design lead must sign off.
      *   **Task:** Turn futarchy into a concrete design procedure (checklist/workflow).
      *   **Required Steps:**
          1.  Reformulating the question (counterfactuals vs. value questions).
          2.  Resolution criteria (adjudication, evidence, ambiguity).
          3.  Manipulation/verification checks (pre-live).
          4.  Decision conversion (prices to policy, conflicting markets).
          5.  Stop condition (when to hand off to humans for value judgments).
      *   **Application:** Run the procedure on two specific proposals:
          1.  City council banning single-use plastic bags.
          2.  University funding a 10-year basic research program.
      *   **Style:** Expert in market design and decision theory.
      *   **Requirement:** Be explicit about judgment calls that market design cannot eliminate.

  2.  **Deconstruct Futarchy & Its Pitfalls:**
      *   *Futarchy* (Hanson): Vote on values, bet on beliefs. Policy is adopted if the market predicts higher expected utility.
      *   *Core Problem:* Defining the utility metric ($U$) and the counterfactual ($P(U | \text{policy})$ vs. $P(U | \text{status quo})$).
      *   *Engineering Constraint:* Needs to be actionable, not theoretical. Needs clear "Pass/Fail" gates.
      *   *Philosophical Trap:* Many "policy questions" are actually value disagreements disguised as empirical questions. Markets can't solve "What is good?" only "What will happen?"

  3.  **Drafting the Procedure (The "Futarchy Feasibility Protocol"):**
      *   *Goal:* A checklist an engineer can use.
      *   *Step 1: Question Formulation (The Counterfactual Test).* Needs to separate *what we want* from *what will happen*.
          *   Action: Define $A$ (Action) and $\neg A$ (Status Quo). Define $M$ (Metric).
          *   Check: Is $M$ observable? Is it manipulable?
      *   *Step 2: Resolution Criteria (The Oracle Problem).*
          *   Action: Who decides $M$? When? What data source?
          *   Check: Is there a clear deadline? Is the adjudicator trusted?
      *   *Step 3: Manipulation & Verification (The Security Check).*
          *   Action: Liquidity requirements? Position limits? Correlation checks?
          *   Check: Can a bad actor profit by sabotaging the policy *and* the market?
      *   *Step 4: Decision Logic (The Execution).*
          *   Action: Thresholds? Spread between Yes/No markets?
          *   Check: What if markets are thin? What if they contradict?
      *   *Step 5: The Value Stop (The Philosophy Gate).*
          *   Action: Identify if the metric $M$ is contested.
          *   Check: If stakeholders disagree on $M$, stop. Markets bet on *facts*, not *values*.

  4.  **Applying the Procedure to Case Studies:**

      *   *Case 1: City Council - Plastic Bag Ban.*
          *   *Metric:* Litter volume? Cost to taxpayers? Retail sales?
          *   *Problem:* Causality. Did litter go down because of the ban or a cleanup campaign?
          *   *Value Stop:* Is "less litter" worth "inconvenience to shoppers"? The market can't weigh that tradeoff unless the metric captures *both* (e.g., "Net Social Welfare Index" - impossible to measure).
          *   *Verdict:* Likely Fail at Step 1 or 5.

      *   *Case 2: University - 10-Year Basic Research.*
          *   *Metric:* Citations? Grants won? Prestige?
          *   *Problem:* Time horizon. 10 years is too long for settlement.
          *   *Manipulation:* Easy to game citation counts.
          *   *Value Stop:* What is the purpose of the university? Education vs. Research.
          *   *Verdict:* Likely Fail at Step 2 (Resolution time) and Step 5 (Mission alignment).

  5.  **Refining the Tone and Content:**
      *   *Tone:* Professional, rigorous, slightly skeptical (healthy market design skepticism), actionable.
      *   *Emphasis:* Highlight the "Judgment Calls." The prompt explicitly asks for this.
      *   *Constraint Check:* Ensure it fits a "single working day" review. This means the criteria must be binary or simple scoring, not deep research.

  6.  **Self-Correction/Iterative Improvement during drafting:**
      *   *Initial thought:* Maybe suggest conditional markets.
      *   *Correction:* Too complex for a 1-day engineering review. Stick to simple $P(M | \text{Policy})$ vs $P(M | \text{Status Quo})$ structure.
      *   *Initial thought:* Let the market decide the metric.
      *   *Correction:* No, that's voting on values. The metric must be pre-agreed. This is a crucial distinction for Step 5.
      *   *Focus:* Make sure the "Stop Condition" is prominent. Most futarchy failures happen because people try to marketize values.

  7.  **Final Polish:**
      *   Structure the response clearly with headers.
      *   Ensure the "Judgment Call" warnings are distinct.
      *   Verify the two case studies follow the procedure step-by-step.

  8.  *(Self-Correction on "Engineer in a Day"):* I need to make sure the procedure isn't *too* hard. It needs to be a filter. Most things should fail the filter. That's the point of governance tooling—to prevent bad markets from launching. The procedure should be a *kill switch* mostly.

  9.  *(Final Review against Prompt):*
      *   Reformulate question? Yes.
      *   Resolution criterion? Yes.
      *   Manipulation checks? Yes.
      *   Convert prices to decision? Yes.
      *   Value stop? Yes.
      *   Two proposals run through? Yes.
      *   Style: Expert market design/decision theory. Yes.
      *   Explicit judgment calls? Yes.

  Let's write it.cw
answer: |-
  # The Futarchy Feasibility Protocol (FFP)
  **Version:** 1.0 (Governance Tooling Internal)  
  **Audience:** Engineering Reviewers & Market Design Lead  
  **Time Budget:** 4–6 Hours per Proposal  
  **Objective:** Filter out policy questions that are structurally unsuited for prediction market execution. **Note:** The default outcome of this protocol should be *rejection*. Futarchy is a high-risk mechanism suitable only for a narrow class of empirical questions with agreed-upon metrics.

  ---

  ## Phase 1: Question Formulation (The Counterfactual Test)
  **Goal:** Ensure the market forecasts a causal impact, not a correlation or a value judgment.

  1.  **Define the Binary Action:**
      *   **Policy ($A$):** The specific action to be taken (e.g., "Pass Ordinance 101").
      *   **Status Quo ($\neg A$):** The specific baseline if the policy is *not* taken (e.g., "Maintain current code").
      *   *Engineering Check:* Can $A$ and $\neg A$ be executed distinctly? If the policy is vague ("Improve morale"), **STOP**.

  2.  **Define the Settlement Metric ($M$):**
      *   $M$ must be a numerical value or binary state observable at a specific time $T$.
      *   *Engineering Check:* Is $M$ currently being measured? If new data infrastructure is required to measure $M$, **STOP**.

  3.  **The Causality Check:**
      *   The market must trade on $E[M | A]$ vs. $E[M | \neg A]$.
      *   *Engineering Check:* Are there external confounders that will swamp the signal? (e.g., "Will GDP grow if we cut taxes?" is bad because global recessions swamp tax policy). If the signal-to-noise ratio is low, **STOP**.

  > **⚠️ JUDGMENT CALL #1:** *Metric Selection.* No market design can fix a bad metric. If stakeholders do not agree *exactly* on what $M$ is before the market launches, the market will not resolve the dispute; it will amplify the dispute. **If there is >5% disagreement on the definition of $M$, reject.**

  ---

  ## Phase 2: Resolution Criteria (The Oracle Problem)
  **Goal:** Ensure the market can actually settle without ambiguity or endless dispute.

  1.  **Adjudicator Designation:**
      *   Identify the specific entity or contract that declares the value of $M$ at time $T$.
      *   *Requirement:* Must be a trusted, neutral third party (e.g., Bureau of Labor Statistics, specific Audit Firm, On-Chain Oracle).
      *   *Engineering Check:* Is the adjudicator legally/technically bound to report? If the adjudicator can refuse, **STOP**.

  2.  **Timeline Feasibility:**
      *   Time $T$ must be within the capital horizon of traders.
      *   *Engineering Check:* Is $T > 24$ months? If yes, liquidity will be too thin to trust prices. **STOP**.

  3.  **Ambiguity Handling:**
      *   Define the "Null Result" condition. What if the adjudicator fails to report?
      *   *Requirement:* Default to Status Quo ($\neg A$) and void trades.

  > **⚠️ JUDGMENT CALL #2:** *Trust Assumptions.* You are outsourcing governance to the adjudicator. If the adjudicator is corruptible or politically pressured (e.g., a city official measuring city litter), the market is gameable. **If the adjudicator has a vested interest in the outcome of $A$, reject.**

  ---

  ## Phase 3: Manipulation & Verification (The Security Check)
  **Goal:** Prevent actors from profiting by sabotaging the policy to move the market.

  1.  **The Sabotage Incentive Check:**
      *   Can a trader profit on the market by taking real-world actions to ensure $M$ performs poorly under $A$?
      *   *Example:* Shorting "City Revenue" and then arson-ing a city building.
      *   *Engineering Check:* Is the cost of sabotage lower than the potential market profit? If yes, **STOP**.

  2.  **Liquidity Requirements:**
      *   Minimum bonded liquidity required to launch.
      *   *Requirement:* Liquidity must be high enough that a single whale cannot move the price >10% without significant slippage.

  3.  **Position Limits:**
      *   Cap individual exposure to prevent cornering the settlement oracle.

  > **⚠️ JUDGMENT CALL #3:** *Risk Tolerance.* There is no mathematical proof that a market is manipulation-proof. This is a heuristic risk assessment. **If the policy affects a small, concentrated group who could coordinate to manipulate the market, reject.**

  ---

  ## Phase 4: Decision Logic (Execution)
  **Goal:** Convert prices into a binding decision.

  1.  **The Spread Threshold:**
      *   Policy $A$ is adopted only if $Price(E[M|A]) > Price(E[M|\neg A]) + \delta$.
      *   *Requirement:* $\delta$ (hurdle rate) must account for transaction costs and implementation risk. Suggested $\delta \ge 5\%$.

  2.  **Disagreement Handling:**
      *   If multiple metrics are used (e.g., $M_1$ = Revenue, $M_2$ = Satisfaction), they must be weighted *ex-ante*.
      *   *Engineering Check:* If $M_1$ says Yes and $M_2$ says No, the pre-defined weighting function executes. No post-hoc negotiation.

  3.  **The "No-Trade" Clause:**
      *   If trading volume is below threshold $V_{min}$ 48 hours before close, the decision defaults to human governance. Thin markets are noise.

  ---

  ## Phase 5: The Value Stop (The Philosophy Gate)
  **Goal:** Identify questions that are actually value disagreements disguised as empirical ones.

  1.  **The "Why" Test:**
      *   Ask the proposer: "If the market predicts $A$ increases $M$, but stakeholders still hate $A$, will you ignore them?"
      *   If the answer is "No," you are not doing futarchy; you are doing polling. **STOP**.
      *   If the answer is "Yes," are the stakeholders okay with $M$ representing their values?

  2.  **Final Sign-Off:**
      *   If the proposal passes Phases 1–4, it proceeds to the Market Design Lead.
      *   **Lead Mandate:** The Lead must verify that $M$ is not a proxy for a contested moral value.

  > **⚠️ JUDGMENT CALL #4:** *The Value Boundary.* This is the most critical step. Markets optimize for what they measure. If you measure "GDP," you optimize for GDP, potentially at the expense of equality or liberty. **No engineer can solve this. If the metric $M$ is politically contested, the market will be viewed as illegitimate. Reject.**

  ---

  # Application of FFP to Client Proposals

  ## Proposal A: City Council Ban on Single-Use Plastic Bags
  **Client Request:** "Let the market decide if banning bags is good for the city."

  ### Phase 1: Question Formulation
  *   **Action ($A$):** Enact Ordinance 101 (Ban).
  *   **Metric ($M$):** "Net City Cost per Capita" (Cleanup savings - Retailer compliance costs).
  *   **Critique:** Retailer compliance costs are private data. Cleanup savings are estimated by city workers.
  *   **Result:** **FAIL.** Data is not publicly observable/verifiable in real-time.
  *   **Alternative Metric:** "Tons of Plastic Litter Collected."
  *   **Critique:** Confounders (weather, tourism spikes, separate cleanup initiatives) swamp the signal.
  *   **Result:** **FAIL.** Signal-to-noise ratio too low for a liquid market.

  ### Phase 2: Resolution Criteria
  *   **Adjudicator:** City Public Works Department.
  *   **Critique:** They are the ones implementing the ban. They have an incentive to show it worked.
  *   **Result:** **FAIL.** Adjudicator conflict of interest.

  ### Phase 3: Manipulation Check
  *   **Sabotage:** A retail association could short "Litter Reduction" and fund volunteers to dump litter in the city to make the ban look ineffective.
  *   **Result:** **FAIL.** Cost of sabotage is low (buying bags and dropping them).

  ### Phase 5: The Value Stop
  *   **Value Conflict:** The ban is not about cost; it is about environmental ethics vs. consumer convenience.
  *   **Judgment Call:** Even if the market proves the ban reduces litter by 1%, some constituents believe plastic bans are government overreach. A market cannot resolve "Is overreach worth 1% less litter?"
  *   **Final Verdict:** **REJECT.** This is a value judgment with untradeable metrics and high manipulation risk. Hand back to City Council vote.

  ---

  ## Proposal B: University 10-Year Basic Research Program
  **Client Request:** "Let the market decide if we should fund this Physics Department initiative."

  ### Phase 1: Question Formulation
  *   **Action ($A$):** Allocate $50M to Program X.
  *   **Metric ($M$):** "Number of Peer-Reviewed Publications."
  *   **Critique:** Encourages salami-slicing (low quality papers).
  *   **Metric ($M$):** "Total Future Grant Funding Attracted."
  *   **Critique:** Time horizon.
  *   **Timeline:** 10 Years.
  *   **Result:** **FAIL.** $T > 24$ months. Traders will not lock capital for a decade. Liquidity will be zero.

  ### Phase 2: Resolution Criteria
  *   **Adjudicator:** University Registrar / Grant Office.
  *   **Critique:** Internal.
  *   **Ambiguity:** What counts as "Basic Research" vs. "Applied"? Definitions shift over 10 years.
  *   **Result:** **FAIL.** Resolution criteria too ambiguous for a smart contract or legal oracle.

  ### Phase 3: Manipulation Check
  *   **Sabotage:** Competing departments could short the market and then refuse to collaborate with the Physics Department, ensuring low output.
  *   **Result:** **HIGH RISK.** Internal politics makes this easily gameable.

  ### Phase 5: The Value Stop
  *   **Value Conflict:** The purpose of the university is contested. Is it job placement? Prestige? Truth-seeking?
  *   **Judgment Call:** A market optimizing for "Publications" might sacrifice "Teaching Quality." Stakeholders (students, alumni, faculty) do not agree on the utility function.
  *   **Final Verdict:** **REJECT.** Time horizon is incompatible with market liquidity. Metric is a poor proxy for the actual value (scientific breakthrough). Hand back to Faculty Senate.

  ---

  # Summary for the Engineering Team

  **The Hard Truth:**
  Most governance questions clients bring you are **Phase 5 Failures**. They want to outsource moral responsibility to a mechanism. Futarchy only works when:
  1.  Everyone agrees on the goal ($M$).
  2.  The goal is measurable quickly and accurately.
  3.  No one can profit by breaking the thing they are measuring.

  **Your Workflow:**
  1.  Ask for the Metric ($M$).
  2.  Ask for the Adjudicator.
  3.  Ask for the Time Horizon.
  4.  If any answer is vague, political, or >2 years, **reject the ticket**.

  **Note to Market Design Lead:**
  You are the final gatekeeper on **Judgment Call #4**. If the metric feels like it captures only *part* of what people care about, do not sign off. A futarchy market that optimizes a partial metric will actively destroy value in the unmeasured dimensions (Goodhart's Law). It is better to have no market than a perverse one.
