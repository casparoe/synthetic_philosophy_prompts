answer: |-
  Here is the direct take on your notes.

  **(a) Is the diversion/mask boundary sharp?**
  No, it isn't. In the standard metaphysics of dispositions, a mask is defined by its functional outcome: the stimulus occurs, the categorical base is present, but the characteristic manifestation fails to occur. Your "diversion" case fits this definition perfectly. The stimulus (strike) occurs, the base (crystal structure) is present, but the characteristic manifestation (shattering) fails to occur.

  The fact that the energy goes somewhere else (heat/sound) is physical detail about *how* the masking happens, not a metaphysical distinction about the disposition itself. Regarding the disposition of *fragility*, the outcome is identical to a mask: the breaking does not happen. You are describing a specific mechanism of masking (energy redistribution) and treating it as a distinct modal category. It isn't.

  **(b) Is this interesting or just taxonomic hair-splitting?**
  It leans toward hair-splitting within standard modal accounts of dispositions, but it might have traction in process metaphysics.

  If you are working within a counterfactual or modal framework (where dispositions are defined by "if struck, it would break"), your diversion case simply proves the object isn't fragile. If the energy is *always* rerouted, the counterfactual is false, and the disposition doesn't exist. If the energy is *sometimes* rerouted and sometimes results in breaking, you have successfully described a multi-track disposition. There is no logical space left for "diversion" as a third thing.

  However, if you are arguing that the *power* exists as a real entity independent of its manifestation (a powerful qualities view), then there is a niche here. You could argue the power to break is real but gets "hijacked" by a competing power to heat. But even then, you aren't describing a new category of disposition modification; you're describing a conflict of powers. That's already covered in literature on competing dispositions. So, unless you are tying this to a specific theory of causal processes rather than modal conditions, it risks being a solution in search of a problem.

  **(c) Where is your reasoning sloppy?**
  There are two main spots where the logic wobbles.

  1.  **Conflating the Base with the Disposition:** You write that the crystal has "all the internal structure for fragility." This assumes fragility is identical to a specific microstructure. It isn't. Fragility is defined by what the object *does*, not just what it *is made of*. If the microstructure is present but the object never breaks when struck (because of phononic channels), then that microstructure does not ground fragility. It grounds something else (perhaps resilience or dampening). You cannot claim the disposition is "present" if the defining manifestation is systematically absent.
  2.  **The Multi-Track Distinction:** You argue that multi-tracking is context-dependent, whereas diversion is "substrate rerouting." This is a false dichotomy. The substrate *is* part of the context. If the substrate causes rerouting, that is just a specific context in which the disposition manifests differently (or not at all). If the object always reroutes, it has a single-track disposition to heat up. If it varies, it's multi-track. You haven't carved out a middle ground; you've just described the physical mechanism of one track.

  **On the Internal Mask Question:**
  You asked if a disposition can be masked by its own causal base. This usually collapses into one of two things:
  1.  **Not a Disposition:** If the base *always* emits a field preventing dissolution, the object was never soluble. The base mimics the look of solubility without the power.
  2.  **A Fink:** If the base emits the field *only when triggered* by the solvent, the disposition disappears upon triggering. That is the definition of a finkish disposition.

  There isn't much room for an "internal mask" that isn't actually a fink. A mask is typically external because it must be distinct from the base that grounds the power. If the blocker is part of the base, then the base is insufficient to ground the power in the first place.

  **Verdict:**
  Your "diversion" case is physically vivid but metaphysically redundant. It functions as a mask regarding the disposition of fragility, and it functions as a multi-track disposition regarding the object's total causal profile. To make this stick, you would need to argue that dispositions are real entities that can exist unmanifested even when their standard conditions are met—which is a heavy lift requiring a robust realist ontology of powers. Without that, it's just a complicated way of saying the object isn't fragile.
