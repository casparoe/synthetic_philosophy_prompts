  6.  **Identifying the "Killer" Constraint:**
      *   Which requirement kills the most theories?
      *   *Candidate:* **Explanatory Autonomy + First-Person Authority combined.** Pure externalism fails Authority. Pure internalism fails Twin Earth. Teleosemantics fails Authority/Swampman. Two-dimensionalism tries to cheat.
      *   *Selection:* **The Explanatory Constraint (Content must drive behavior locally).** This is the hardest for externalism to swallow. If content is wide, it's not in the head. If it's not in the head, how does it cause the hand to move? This is the supervisor's "natural kinds" point (individuation) but elevated to "causal relevance."

  7.  **Structuring the Response:**
