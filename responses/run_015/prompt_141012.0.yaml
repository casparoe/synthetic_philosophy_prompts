prompt: |-
  hi — I'm doing an hour on imprecise probabilities for a reading group of ML PhD students who are all fluent Bayesians (conjugate priors, calibration, expected utility, the usual). Don't write the session for me, I want the plan for it.

  Order first, and why: I think they can't even see the point of a set of priors until something cracks the identification of "my uncertainty" with "a number", and that the lower-vs-upper distinction (what you'd pay for a bet vs what you'd sell it for) has to be in place before Γ-maximin or maximality will make any sense — but I'm not sure where updating belongs, since conditioning each measure in the set versus conditioning the lower envelope is exactly where I expect them to get lost.

  One example should carry the hour, so tell me what it has to have and what it has to lack. My instinct is an Ellsberg-type urn of unknown composition, except that seems to invite them to slap a flat hyperprior on the composition and declare the problem solved; maybe the uncertainty should come from somewhere adversarial instead.

  Misconceptions I'm expecting: that it's just robust Bayes with wider error bars, that imprecision just means you haven't thought hard enough about your prior, that independence means the set factorizes, and the one where they notice lower(A) + lower(not-A) < 1 and think probability has leaked out somewhere. Where in the sequence do I head each of them off?

  Two more things. One of them will definitely ask whether there isn't still a true probability they're just failing to pin down, and I want the session to earn the no rather than have me assert it. And give me one closing question that would actually tell me they got it rather than memorised definitions, plus what I should openly refuse to cover in an hour (I'm guessing choice functions and sets of desirable gambles).
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** ML PhD students, fluent Bayesians (conjugate priors, calibration, expected utility, etc.).
      *   **Topic:** Imprecise Probabilities (IP).
      *   **Duration:** 1 hour.
      *   **Goal:** A session plan (not the content itself), ordered logically.
      *   **Key Constraints/Preferences:**
          *   Must motivate *why* a set of priors before introducing decision rules (Γ-maximin, etc.).
          *   Lower/upper probability distinction (buy/sell prices) must come early.
          *   Updating (conditioning) is tricky; needs careful placement.
          *   One carrying example (Ellsberg might be too easy to "hyperprior" away; maybe adversarial?).
          *   Address specific misconceptions (Robust Bayes, "haven't thought hard enough," independence factorization, sub-additivity).
          *   Address the "true probability" ontological question (earn the "no").
          *   Provide a closing comprehension question.
          *   Specify what *not* to cover (choice functions, desirable gambles).

  2.  **Determine the Narrative Arc (Order & Why):**
      *   *User's intuition:* Crack the identification of uncertainty with a single number first. Then lower/upper prices. Then decision rules. Then updating.
      *   *My refinement:*
          1.  **Motivation (The Crack):** Start with a scenario where a single number is *impossible* or *irrational*, not just hard. This addresses the "true probability" question implicitly.
          2.  **Operationalization (Buy/Sell):** Define lower/upper previsions via betting. This grounds the math in utility (which they know).
          3.  **The Carrying Example:** Needs to be introduced early to anchor the motivation.
          4.  **Decision Rules:** Now that we have sets and prices, how do we act? (Maximality/Γ-maximin).
          5.  **Updating:** The hardest part. Show how sets evolve (or dilate).
          6.  **Misconceptions & Ontology:** Weave these throughout, but save the "true probability" kill-shot for the end or the motivation.
      *   *Re-evaluating the "True Probability" point:* The user wants the session to *earn* the "no." This suggests the example needs to be one where a true probability *does not exist* or is *undefined*, not just unknown. An adversarial setting or a logical indeterminacy works better than an urn (which has a physical proportion). Let's stick with a modified Ellsberg or an Adversarial Prediction game. Actually, the user suggested adversarial. Let's go with an **Adversarial Classifier/Environment** scenario. It fits ML PhDs better than urns.

  3.  **Drafting the Plan - Section by Section:**

      *   **0-10 mins: The Break (Motivation).**
          *   Start with Expected Utility. Ask them to price a bet on an event where the mechanism is *undefined* (not just unknown).
          *   *Example:* An adversarial opponent who knows your prior and fills the urn *after* you bet. A hyperprior fails here because the adversary targets the mean.
          *   *Misconception Check:* "Haven't thought hard enough." Counter: It's not cognitive limitation; it's structural indeterminacy.

      *   **10-25 mins: The Definition (Lower/Upper Previsions).**
          *   Define $\underline{P}(X)$ (max buying price) and $\overline{P}(X)$ (min selling price).
          *   Show $\underline{P}(A) + \underline{P}(A^c) < 1$.
          *   *Misconception Check:* "Probability leaked." Counter: It's a bid-ask spread, not a mass conservation issue. The gap is the cost of ambiguity.

      *   **25-40 mins: Action (Decision Rules).**
          *   How to choose between acts?
          *   Introduce Interval Dominance, Maximality, and E-admissibility. (Keep Γ-maximin brief as it reduces to precise Bayes on the worst case).
          *   *Misconception Check:* "Robust Bayes." Counter: Robust Bayes usually seeks a single optimal decision despite uncertainty. IP admits *indeterminate* choice (no unique optimal act).

      *   **40-50 mins: Updating (Conditioning).**
          *   This is the danger zone.
          *   Generalized Bayes Rule (conditioning every measure in the set).
          *   Show *Dilation*: Where observing data makes you *less* certain. This is the killer feature that proves it's not just "wide error bars."
          *   *Misconception Check:* "Independence." In IP, stochastic independence $\neq$ irrelevant information.

      *   **50-60 mins: Ontology & Wrap.**
          *   Address the "True Probability" question explicitly using the adversarial setup.
          *   Closing Question.
          *   Explicit Exclusions.

  4.  **Refining the Carrying Example:**
      *   *Requirement:* Must resist the "slap a hyperprior on it" move.
      *   *Idea:* **The Adversarial Coin.**
      *   *Setup:* You bet on Heads. The coin is flipped by an adversary who sees your betting odds. If you commit to $p=0.5$, they bias the coin to Tails.
      *   *Why it works:* A hyperprior on the bias $\theta$ assumes $\theta$ is fixed *before* the bet. If $\theta$ is a function of your bet, standard Bayesian updating breaks. This forces the set representation.
      *   *Alternative:* **The Missing Label.** In semi-supervised learning, the mechanism generating missingness is unknown. If you assume MAR (Missing At Random), you're precise. If you assume NI (Non-Ignorable), you get sets. This is very ML-relevant.
      *   *Decision:* Let's go with the **Adversarial Prediction Game**. It aligns with "fluent Bayesians" who know game theory/decision theory. It makes the "no true probability" argument strongest.

  5.  **Addressing Misconceptions (Mapping to Timeline):**
      *   *Robust Bayes:* Address during Decision Rules (Indeterminacy vs. Worst-case optimization).
      *   *Haven't thought hard enough:* Address during Motivation (Structural vs. Epistemic).
      *   *Independence:* Address during Updating (Dilation).
      *   *Sub-additivity ($\underline{P}(A) + \underline{P}(A^c) < 1$):* Address during Definitions (Bid-ask spread).
      *   *True Probability:* Address during Motivation/Wrap (Ontological status).

  6.  **Developing the "Earn the No" Strategy:**
      *   Don't just say "there is no true probability."
      *   Show that assuming there *is* one leads to a Dutch Book (sure loss) in the adversarial setting.
      *   If they commit to a single $p$, the adversary exploits it. If they commit to a range $[0.4, 0.6]$, they can refuse bets that guarantee loss. The "truth" is not a number, it's a constraint set.

  7.  **Developing the Closing Question:**
      *   Needs to test understanding, not memory.
      *   Idea: Present a scenario where acquiring free data increases uncertainty (Dilation). Ask if they should observe the data.
      *   Why: A precise Bayesian *always* values information (Good's Theorem). An IP agent might not. This highlights the fundamental divergence.

  8.  **What to Exclude:**
      *   Choice functions (too abstract).
      *   Sets of Desirable Gambles (too foundational/axiomatic for 1 hour).
      *   Specific algorithms for propagating sets (computationally heavy).
      *   History/Philosophy (Walley vs. others).

  9.  **Review against Constraints:**
      *   *Order:* Motivation -> Prices -> Decisions -> Updating. (Matches user intuition).
      *   *Example:* Adversarial (resists hyperprior).
      *   *Misconceptions:* Mapped to sections.
      *   *Ontology:* Earned via Dutch Book argument.
      *   *Closing:* Dilation/Value of Information.
      *   *Exclusions:* Listed.

  10. **Final Polish:** Ensure tone is appropriate for PhD peers (rigorous, no fluff, acknowledging their Bayesian fluency). *Self-Correction on Updating:* Make sure to distinguish between updating the set (Generalized Bayes) vs updating the envelope (which can be inconsistent). Emphasize Generalized Bayes.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a session plan designed for fluent Bayesians. It leverages their knowledge of utility and calibration to break the "single number" habit, rather than treating IP as a generalization of calculus.

  ### The Carrying Example: The Adversarial Coin
  **What it has:** An outcome generation mechanism that is *responsive* to the agent's credence.
  **What it lacks:** A fixed physical parameter $\theta$ that exists prior to the bet.
  **Why:** An Ellsberg urn has a fixed composition (unknown, but fixed). A Bayesian can slap a Beta prior on the composition and integrate it out. In an **Adversarial Coin** game, the "bias" is chosen by an opponent *after* seeing your betting odds (or your policy). There is no $\theta$ to put a hyperprior on, because $\theta$ is a function of your action. This blocks the "you just haven't thought hard enough" objection immediately.

  ---

  ### 1. Motivation: Cracking the Identification (0–10 mins)
  **Goal:** Prove that a single number invites a Dutch Book in specific structural settings.
  **Activity:**
  1.  Propose a bet on the Adversarial Coin (Heads/Tails).
  2.  Ask for a fair price $p$.
  3.  Reveal the adversary's strategy: "If you commit to $p > 0.5$, I set bias to Tails. If $p < 0.5$, I set bias to Heads. If $p=0.5$, I choose randomly."
  4.  Show that any precise $p$ leads to expected loss against a smart adversary.
  5.  **The Move:** Introduce the *set* of priors $[0, 1]$ not as "ignorance," but as the only strategy that avoids sure loss. You refuse to bet unless the odds are in your favor.

  **Head off Misconception:** *"You haven't thought hard enough about the prior."*
  *   **Counter:** It is not cognitive limitation; it is structural indeterminacy. The parameter does not exist independently of your action.

  **Head off Ontology:** *"Isn't there a true probability they're just failing to pin down?"*
  *   **The Earned "No":** Do not assert this yet. Let it simmer. The adversary argument implies the "truth" is a reaction function, not a scalar. You will return to this in the wrap-up.

  ### 2. Operationalization: Lower & Upper Previsions (10–25 mins)
  **Goal:** Define imprecision via utility, not measure theory.
  **Content:**
  1.  Define $\underline{P}(X)$ (max buying price) and $\overline{P}(X)$ (min selling price).
  2.  Use the Adversarial Coin to show $\underline{P}(\text{Heads}) = 0$ and $\overline{P}(\text{Heads}) = 1$.
  3.  Demonstrate sub-additivity: $\underline{P}(A) + \underline{P}(A^c) < 1$.

  **Head off Misconception:** *"Probability has leaked out."*
  *   **Counter:** Frame this as a **bid-ask spread**. In finance, the buy price + sell price of the complement doesn't have to sum to 1; the gap is the cost of ambiguity/transaction cost. The "mass" isn't conserved because the measure is not additive; it's super-additive (lower) and sub-additive (upper).

  ### 3. Decision Rules: Acting with Sets (25–40 mins)
  **Goal:** Show that IP leads to *indeterminate* choice, not just robust optimization.
  **Content:**
  1.  Present two gambles.
  2.  Introduce **Interval Dominance**: $X$ is preferred if $\underline{P}(X) > \overline{P}(Y)$.
  3.  Introduce **Maximality** (Pareto dominance across the set): $X$ is preferred if $E_P[X] \geq E_P[Y]$ for all $P \in \mathcal{M}$, with strict inequality for some.
  4.  Show a case where Maximality yields *no* unique optimal act (both $X$ and $Y$ are undominated).

  **Head off Misconception:** *"This is just Robust Bayes with wider error bars."*
  *   **Counter:** Robust Bayes typically seeks a single decision that minimizes worst-case loss (Γ-maximin). IP admits that rationality sometimes dictates **no unique choice**. If the set is wide enough, "I don't know which to pick" is the rational output, not a failure of the method.

  ### 4. Updating: Dilation and Information (40–50 mins)
  **Goal:** The hardest technical hurdle. Show that learning can increase uncertainty.
  **Content:**
  1.  Define the **Generalized Bayes Rule**: Condition *every* measure in the set $\mathcal{M}$ via standard Bayes, then take the envelope of the posteriors.
  2.  **Crucial Demo (Dilation):** Construct a scenario (e.g., a partition of the state space) where $\underline{P}(A | E) < \underline{P}(A)$ and $\overline{P}(A | E) > \overline{P}(A)$ for *all* observations $E$.
  3.  Explain that observing data widens the interval.

  **Head off Misconception:** *"Independence means the set factorizes."*
  *   **Counter:** In IP, stochastic independence does not imply irrelevance. Observing an independent variable can still cause dilation if the joint set is not a product set (which it usually isn't in IP).

  ### 5. Ontology & Wrap (50–60 mins)
  **Goal:** Cement the "No True Probability" argument and test understanding.
  **Content:**
  1.  Return to the "True Probability" question.
  2.  **The Kill:** In the Adversarial Coin, a "true probability" implies a fixed frequency. But the frequency depends on the betting policy. Therefore, the "true probability" is ill-defined. The set $\mathcal{M}$ is not an approximation of a truth; it is the complete description of the constraint system.
  2.  **What to Refuse to Cover:**
      *   **Sets of Desirable Gambles:** Too axiomatic/foundational for one hour. Stick to sets of measures/previsions.
      *   **Choice Functions:** Too abstract. Stick to Maximality/Interval Dominance.
      *   **Computational Propagation:** Don't get bogged down in how to compute the sets for high-dimensional neural nets.

  **The Closing Question:**
  > "In standard Bayesian decision theory, Good's Theorem proves that free information always has non-negative expected value. In our session, we saw that updating can cause **dilation** (increased imprecision).
  >
  > **If you are an Imprecise Probabilist using Maximality as your decision rule, should you ever pay to *avoid* seeing free data? Why or why not?**"

  *   **Why this works:** A Bayesian must say "No." An IP student who understands dilation knows the answer is "Yes." If the data dilates your posterior enough, it can turn a determinate choice into an indeterminate one, potentially paralyzing action or forcing a worst-case scenario you could have avoided by remaining ignorant. This proves they understand the *consequences* of the math, not just the definitions.

  ---

  ### Summary of Misconception Mapping

  | Misconception | When to Head Off | The Argument |
  | :--- | :--- | :--- |
  | *"Haven't thought hard enough"* | **Min 0-10** (Motivation) | It's structural (adversarial), not epistemic. |
  | *"Probability leaked"* | **Min 10-25** (Previsions) | It's a bid-ask spread, not mass conservation. |
  | *"Just Robust Bayes"* | **Min 25-40** (Decisions) | Robust Bayes optimizes; IP admits indeterminacy. |
  | *"Independence = Factorization"* | **Min 40-50** (Updating) | Independence $\neq$ Irrelevance in IP (Dilation). |
  | *"True Probability exists"* | **Min 50-60** (Ontology) | Truth is a function of action, not a fixed scalar. |

  ### Logistics Note
  Since they are fluent Bayesians, do not derive Bayes' rule. Assume they know $P(\theta|D) \propto P(D|\theta)P(\theta)$. Use that fluency to show where it breaks: $P(D|\theta)$ is the thing that becomes a set $\{P_1, \dots, P_k\}$, and the posterior becomes the convex hull of the individual posteriors. The friction point is that the convex hull of posteriors is not the same as the posterior of the convex hull priors (non-linearity). That is the technical crux to emphasize during the Updating section.
