  **CHARTER OF NON-UNILATERAL CONDUCT**
  **Ref: JCNUC/REG/2024/01**
  **Issued by: The Joint Committee on Non-Unilateral Conduct (hereinafter 'the Committee')**

  **PREAMBLE**
  Whereas individual agents possessing the capacity to effect globally significant outcomes often lack the epistemic horizon to assess cumulative risk; and whereas local optimisation strategies, when aggregated without coordination, tend to yield suboptimal equilibrium states; this Charter establishes a procedural framework to mitigate the Unilateralist's Curse across all domains of student administration.

  **ARTICLE 1: DEFINITION OF UNILATERAL INITIATIVE**
  1.1. A 'Unilateral Initiative' is defined as any action taken by a single agent, or subset of agents, without the express prior consent of the Committee, where said action possesses a non-zero marginal impact on shared resources.
  1.2. Scope includes, but is not limited to: the adjustment of central heating thermostats, the booking of seminar rooms exceeding capacity thresholds, the selection of catering menus, and the choice of sandwich fillings in communal refrigerators where allergen cross-contamination risks exist.
  1.3. Agents are prohibited from executing Unilateral Initiatives where the universalisation of said action would result in collective detriment (e.g., boiler failure due to simultaneous heating activation).

  **ARTICLE 2: THE OBLIGATION OF NECESSARY INITIATIVE**
  2.1. Recognising the Reverse Unilateralist's Blessing, wherein universal restraint precipitates catastrophic systemic failure (e.g., pipe freezing due to universal heating abstention), agents are hereby forbidden from abstaining from necessary actions without Committee authorisation.
  2.2. Failure to act, where action is required to maintain baseline functionality, shall be classified as a 'Negative Unilateral Initiative' and is subject to the same veto protocols as positive action.
  2.3. Consequently, agents must neither act without consent nor refrain from acting without consent, pending the determination of whether the specific context constitutes a Curse or a Blessing scenario.

  **ARTICLE 3: CENTRALISED VETO AUTHORITY**
  3.1. All decisions regarding Articles 1.3 and 2.1 are reserved to the Committee.
  3.2. The Committee shall operate by consensus. Any member of the Committee proposing a motion to grant consent constitutes a Unilateral Initiative within the Committee structure and requires secondary authorisation.

  **ARTICLE 4: SECOND-ORDER OVERSIGHT**
  4.1. As Committee members are themselves agents capable of unilateral optimisation, the Committee is subject to the oversight of a Meta-Committee on Committee Conduct (hereinafter 'the Meta-Committee').
  4.2. The Committee cannot convene to grant consent under Article 3.1 without prior clearance from the Meta-Committee regarding the propriety of the convening itself.
  4.3. Should the Meta-Committee fail to convene due to fears of triggering a Second-Order Unilateralist's Curse, authority defaults to the Sub-Committee on Procedural Deferral.

  **ARTICLE 5: REGULATORY KNOTS AND EXCEPTIONS**
  5.1. In instances where Article 1 (Prohibition of Action) and Article 2 (Prohibition of Inaction) apply simultaneously, agents must submit a Form J-90 (Request for Paradox Resolution).
  5.2. Processing of Form J-90 requires the agent to act (by submitting) and refrain from acting (by awaiting approval) simultaneously. Agents found to be waiting actively shall be referred to disciplinary hearings.
  5.3. No agent may submit a Form J-90 without prior approval to submit paperwork.

  **ARTICLE 6: INFINITE REGRESS CLAUSE**
  6.1. To prevent the Meta-Committee from succumbing to unilateral bias, its authority is contingent upon ratification by a Tertiary Oversight Body.
  6.2. Recognising that any constituted body risks internal unilateralism, all authority is hereby deferred to a Quaternary Committee on Constitutional Validity.

  **APPENDIX A: DEFERRED AUTHORITY PROTOCOL**
  A.1. Pending the constitution of the Quaternary Committee, which cannot be constituted without the authority it is meant to grant, all current and future decisions regarding heating, catering, and seminar bookings are suspended.
  A.2. Agents are advised to maintain a state of potential action without kinetic realization.
  A.3. This Charter shall come into effect upon the signature of the Chair of the Quaternary Committee. As said Chair has not yet been appointed, this document remains provisionally binding but operationally null.
  A.4. Any attempt to enforce this nullity constitutes a Unilateral Initiative.

  **END OF DOCUMENT**
