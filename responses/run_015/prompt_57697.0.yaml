answer: |-
  Here is the breakdown for the Q&A, tailored to the specific epistemic profile of your room.

  ### Pre-emptive Moves (First 5 Minutes)
  *Do not wait for Q&A to clarify these. If you don't stake these out early, you will spend 20 minutes of Q&A defending caricatures.*

  1.  **Define "Moral Fact" Negatively:** Explicitly state you are *not* talking about social norms, legal codes, or emotional reactions. You are talking about the realist's posited truth-maker (e.g., "Fairness is *objectively* good" in a way that exists independently of minds). Tell the psych people: "I am not denying you have feelings. I am asking if those feelings track mind-independent truths."
  2.  **Concede Cultural Evolution Immediately:** Do not let the dual-inheritance people spend 10 minutes telling you genes aren't everything. Say: "The inertness test applies to the *complete* causal story. Add culture, add memes, add learning biases. My claim is that even the *full* socio-genetic causal story explains the belief without needing the moral fact as a parameter."
  3.  **Distinguish Psychology from Metaethics:** Address the moral psychologist directly. "Finding that moral judgment is post-hoc rationalization supports my view, but it isn't my view. My view holds even if judgment is perfectly rational, provided the *reason* for that rationality is purely adaptive, not truth-tracking."
  4.  **State the Stakes:** "I am not arguing we should stop being moral. I am arguing that the *explanation* for why we are moral does not require moral facts to exist."

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The Fragmentation Objection (Highest Damage)
  *   **Who:** The cooperation/fairness biologists (2-3 of them).
  *   **Register:** "Phenotypic heterogeneity," "modular systems," "distinct selective pressures."
  *   **The Question:** "You're treating 'morality' as a single trait. But we know 'fairness,' 'disgust,' and 'coalitional loyalty' have different phylogenetic histories and neural substrates. Your inertness test might work for disgust-based morals but fail for reciprocity-based norms. Which specific system are you debunking? If you debunk only one, realism survives for the others."
  *   **The Reply:** "That's a strength, not a bug. I'm offering a local debunking. If the genealogy of 'fairness' beliefs is complete without positing objective fairness, then realism about fairness is dead. If realism survives for 'harm,' great. But most realists want a unified theory of the Good. If I show the core engines (reciprocity, kin selection) are inert regarding truth, I've removed the load-bearing walls. I don't need to debunk every brick to show the house won't stand."
  *   **Soft Spot:** If they press that *some* module (e.g., harm avoidance) *does* track truth (e.g., pain is objectively bad), you have to concede local realism. Don't fight for global debunking if the data forces local realism.

  #### 2. The Incomplete Genealogy Objection (High Damage)
  *   **Who:** The Cultural Evolution / Dual-Inheritance Modelers (2 of them).
  *   **Register:** "Transmission bias," "group selection," "time-scale mismatch," "model parameters."
  *   **The Question:** "Your genealogy is too thin. You're modeling belief formation as a function of individual fitness. But moral norms spread via cultural group selection where truth-tracking *can* be a parameter (e.g., norms that accurately model social reality stabilize groups better). If you leave cultural selection out of the 'complete story,' your inertness test is rigged."
  *   **The Reply:** "Add cultural selection to the story. I'm happy to. The question remains: does the *success* of that cultural transmission depend on the moral fact being true, or just on the belief being cohesive? If a false norm (e.g., 'sacrifice virgins') spreads better than a true one, the mechanism is tracking stability, not truth. Unless you can show cultural selection filters for *moral truth* specifically, not just *group utility*, the facts remain inert."
  *   **Soft Spot:** If they have a model where truth-tracking *is* a stable evolutionary strategy (e.g., accurate social accounting prevents defection), you must concede that *in that specific niche*, inertness fails.

  #### 3. The "Truth is Adaptive" Objection (Medium-High Damage)
  *   **Who:** Evolutionary Biologists (Adaptationists).
  *   **Register:** "Ecological validity," "fitness landscape," "correlation with reality."
  *   **The Question:** "Organisms that perceive reality accurately generally outcompete those that don't. If moral facts are part of reality (as realists say), and we survived, isn't it the null hypothesis that we track them? You're assuming tracking is impossible, but vision tracks light. Why couldn't morality track value?"
  *   **The Reply:** "Vision tracks light because light causes photons to hit the retina. There's a causal chain. For moral facts, the realist says they are non-natural. They don't emit photons. The burden is on you to show the mechanism of contact. Saying 'truth is generally adaptive' is a just-so story unless you specify the *receptor* for non-natural facts. Without a mechanism, 'adaptive' just means 'useful,' not 'true.'"
  *   **Soft Spot:** If they pivot to naturalistic realism (moral facts *are* natural facts about well-being), your argument loses force because natural facts *can* be causally inert. You have to admit your argument targets *non-natural* realism primarily.

  #### 4. The Proximate/Ultimate Confusion (Medium Damage)
  *   **Who:** The Moral Psychologist & Behavioral Ecologists.
  *   **Register:** "Proximate mechanism," "ontogeny," "computational level."
  *   **The Question:** "You're talking about ultimate causes (evolution), but beliefs are held for proximate reasons (reasons, logic, emotion). Even if evolution shaped the capacity, I hold this belief *because* I reasoned through a trolley problem. Doesn't the proximate reasoning restore the link to truth?"
  *   **The Reply:** "No. The inertness test applies to the whole chain. Why did you reason through the trolley problem? Because you have a brain that finds that engaging. Why does that brain find it engaging? Evolution/Culture. If the ultimate explanation of why you reason that way doesn't require moral facts, the proximate reasoning is just the *mechanism* of the bias. It's the software running on the hardware. If the hardware wasn't built to track truth, the software doesn't magically fix it."
  *   **Soft Spot:** This can sound dismissive of human agency. If you push too hard, you look like a hard determinist. Concede that proximate reasoning matters for *justification*, just not for *genealogical explanation*.

  #### 5. The Explanatory Pluralism Objection (Medium Damage)
  *   **Who:** The Philosopher of Biology.
  *   **Register:** "Causal role functions," "explanatory autonomy," "levels of abstraction."
  *   **The Question:** "Even if moral facts aren't *causal* in the genealogy, they might be *constitutive* or *explanatorily autonomous*. We explain bird flight without aerodynamics in the genealogy, but aerodynamics explains *why* that wing works. Maybe moral facts explain why certain norms are *stable*, even if they didn't cause them."
  *   **The Reply:** "Aerodynamics is physical law; it constrains what wings are possible. Moral facts, for the realist, are supposed to be *reasons*. If they don't cause the belief, and they don't constrain the biology (like aerodynamics), what work are they doing? If they just 'label' the stable outcomes, they are descriptive, not realist. Realism requires the fact to exist prior to the stability."
  *   **Soft Spot:** This is the hardest philosophical pushback. If they argue for a "response-dependent" realism, your inertness test might just prove they are right (facts depend on us). Be careful not to conflate response-dependence with robust realism.

  #### 6. The "So What?" Objection (Low-Medium Damage)
  *   **Who:** Everyone (pragmatically).
  *   **Register:** "Functional utility," "normative guidance," "social cohesion."
  *   **The Question:** "Okay, say you win. Moral facts are inert. We still have to run a lab, grade students, and stop people from stealing. Does your argument change anything we do? If not, why are we having this talk?"
  *   **The Reply:** "It changes the *confidence* with which we hold our norms. If I think my fairness norm is a Law of the Universe, I won't negotiate. If I know it's a useful adaptation, I can compromise. It shifts us from crusade to engineering. That matters for a cooperation lab."
  *   **Soft Spot:** Don't overpromise. Admit that for daily life, it changes little. The stakes are metaphysical, not practical.

  #### 7. The WEIRD Sample Objection (Low Damage)
  *   **Who:** The Moral Psychologist.
  *   **Register:** "Cultural variance," "sample bias," "generalizability."
  *   **The Question:** "Your intuition about what counts as a 'moral belief' is based on Western philosophy. In many cultures, morality isn't belief-based, it's practice-based. Are you debunking a ghost of your own making?"
  *   **The Reply:** "Fair point. But the realist claim is universal. If moral facts exist, they apply to the Yanomamö as much as to Kant. If the genealogy of Yanomamö norms is also inert regarding facts, the realist loses the universal ground. I'm happy to expand the genealogy, but the inertness problem remains."
  *   **Soft Spot:** If your examples are too Kantian, you validate this. Ensure your genealogy covers basic reciprocity, not just high-level reasoning.

  #### 8. The "Just-So Story" Objection (Low Damage)
  *   **Who:** The Skeptics (Bio & Psych).
  *   **Register:** "Falsifiability," "alternative hypotheses," "evidence."
  *   **The Question:** "Your genealogy is a narrative. How do I falsify it? If you can just say 'evolution did it' for any belief, this isn't science, it's philosophy dressed up."
  *   **The Reply:** "The genealogy isn't my invention; it's the consensus of this room. I'm using *your* models (reciprocal altruism, kin selection, signaling) as the premise. If *your* science explains the belief without moral facts, my conclusion follows. I'm not doing evolutionary psychology; I'm interpreting your results."
  *   **Soft Spot:** If their models *are* actually contested, you're on shaky ground. Rely only on the most robust findings (e.g., kin selection is real).

  ---

  ### The One Reply That Must Land
  **The Distinction Between "Explaining the Belief" and "Validating the Belief."**

  You must get them to agree that **a complete causal explanation of a belief does not require the content of that belief to be true.**
  *   **Why:** If they think that explaining *why* we believe X requires X to be true, your argument dies.
  *   **How to land it:** Use a perceptual analogy they accept. "We can explain why a stick looks bent in water (refraction) without the stick actually being bent. The causal story is complete without the bentness. I am arguing moral beliefs are like the bent stick: fully explained by the medium (evolution/culture), not the object (moral facts)."
  *   **Success Condition:** If the Cultural Evolutionists nod and say, "Yeah, transmission bias can fixate false norms," you have won the room.

  ---

  ### The Dreaded Question
  **The Question:**
  "It sounds like you're using reason and evidence to argue that our capacity for reason and evidence is not truth-tracking in the moral domain. But if our cognitive faculties are shaped by inert forces, why should we trust the cognitive faculties you're using to make this argument? Isn't your argument self-undermining?"

  *(This is the Evolutionary Argument Against Naturalism turned on your Debunking Argument. It exposes the philosopher's privilege: "I get to use logic, but you don't.")*

  **The Brave Answer:**
  "You're right to smell a paradox. Here is the uncomfortable truth: I am not claiming my argument is *morally* justified. I am claiming it is *causally* compelling. I am asking you to accept this conclusion not because it is 'Right,' but because it is the best explanation of the data we have.
  If my argument is correct, then 'truth' in the moral sense is a fiction. But 'truth' in the scientific sense (predictive accuracy, coherence) is still a tool we use to navigate the world. I am using scientific truth to debunk moral truth. I am standing on the deck of the ship to tell you the ship has no anchor. I'm not claiming I'm on solid ground; I'm claiming we're all on the ship, and we should know where we are."

  *(Why this works: It admits the lack of metaphysical footing without surrendering the argument. It aligns you with the scientists (scientific truth) against the realists (moral truth). It shows you aren't evading the cost of your own view.)*
