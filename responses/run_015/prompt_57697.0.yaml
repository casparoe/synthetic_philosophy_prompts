prompt: |-
  So — 40 minute talk at a department that's basically a behavioral ecology / cooperation lab with a philosophy-of-biology reading group bolted onto the side of it. Call it eight evolutionary biologists and psych people who work on cooperation and fairness, two who do cultural evolution and dual-inheritance modeling, one philosopher of biology who works on functions and teleosemantics, and a single moral psychologist who is politely skeptical of everything including her own data. Nobody in the room does metaethics. I've given versions of this to philosophers three times and the Q&A was all relitigating the tracking story and whether the coincidence argument begs the question; I expect literally none of that here, so I need to prep for a different set of questions entirely.

  The thesis is an evolutionary debunking argument against moral realism that never uses the words "reliability" or "sensitivity." Sketch, so you have something for the objections to bite on. Call it the inertness test. Take a complete geneology of some moral belief — mutation, selection, ontogeny, transmission, the whole causal story, written out at whatever level you like. Now delete every moral fact from it. If the story explains exactly as much afterwards as it did before, then moral facts were doing no work in producing the belief. So any realist reply has to be either (a) deny inertness — insist that moral facts figure in the causal/explanatory account of how we came to hold the beliefs we hold, which costs the non-naturalist their non-naturalism and turns them into an adaptationist about truth-tracking, a claim that now owes empirical detail they can't supply; or (b) grant inertness and argue it isn't epistemically damning. My claim is that the familiar third-factor replies all quietly take horn (a) while talking as if they were taking horn (b), because a third-factor story either smuggles the moral fact into the causal chain or is just the genealogy with a decorative label stuck on it. And my claim about (b) is that inertness-plus-a-complete-competing-causal-story is precisely the configuration in which, everywhere else, we let pedigree defeat a belief.

  Room's commitments as best I can read them: most would call themselves vaguely realist about morality without ever having had to defend it; several are convinced moral judgment is mostly post-hoc rationalization and will think that already wins my argument for me (it doesn't — that's a claim about psychology, not about whether moral facts are inert in the genealogy, and I need to say so without sounding like I'm rejecting an ally); at least two hold that "morality" is a grab bag of separate systems — disgust, reciprocity, coalition psychology, harm avoidance — with different histories, so they'll want to know which one I'm debunking; one of the cultural evolution people thinks genetic timescales are the wrong level of analysis altogether; and everybody has an allergy to arguments that sound like theyre doing philosophy at them.

  What I want: the eight-ish objections this room actually raises, ordered by how much damage each would do to the talk rather than by how interesting it is. For each one — who asks it, since the adaptationists won't ask what the modelers ask; how they'd phrase it in their own register (proximate vs ultimate, just-so story, exaptation, phylogenetic signal, WEIRD samples, whatever fits); a reply I can deliver standing up in about two minutes; and a blunt note on where that reply is soft, so I know when to stop talking and concede instead of digging in. Then tell me what to give away in the first five minutes so I'm not spending the Q&A defending positions I don't hold, and which single reply has to land for the talk to count as a success with these people specifically.

  And separately, the question I'm dreading. There is one, I can feel it, and I'd rather see it written out with the answer I'd give if I were brave than get ambushed by it in front of a room that thinks philosophers are evasive.

  No reading lists or lit reviews please, I know the papers — I want this room's objections, not the journals'.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosopher (likely early-mid career, given the "given versions of this three times" detail) presenting to a mixed department.
      *   **Audience:** Behavioral ecology/cooperation lab + philosophy of biology reading group.
          *   8 Evolutionary Biologists/Psych (Cooperation/Fairness).
          *   2 Cultural Evolution/Dual-Inheritance Modelers.
          *   1 Philosopher of Biology (Functions/Teleosemantics).
          *   1 Moral Psychologist (Skeptic).
          *   *Key Constraint:* Nobody does metaethics. They care about mechanisms, data, models, and explanatory power. They hate "philosophy at them" (armchair speculation disconnected from empirical reality).
      *   **Talk Thesis:** Evolutionary Debunking Argument (EDA) against Moral Realism.
      *   **Key Move:** "The Inertness Test." Remove moral facts from the genealogy. If the explanation holds, facts are inert. Realists must either deny inertness (become naturalists/tracking) or grant it and explain why it's not damning (pedigree defeat). Claims third-factor replies smuggle in tracking.
      *   **Goal:** Prepare for Q&A. Need 8 specific objections likely to arise *from this specific audience*, ordered by damage potential. Need specific phrasing (scientific register), 2-minute replies, and "soft spots" (where to concede). Need advice on pre-emptive clarifications (first 5 mins) and the "one reply that must land." Finally, identify the "Dreaded Question" and a brave answer.
      *   **Constraints:** No reading lists/lit reviews. Focus on *this* room's objections.

  2.  **Deconstruct the Audience's Likely Reactions:**
      *   *Evolutionary Biologists/Psych:* They care about adaptation, function, and proximate/ultimate distinctions. They might think "morality" is just a label for cooperation mechanisms. They might ask: "What's the phenotype?" or "Is this a just-so story?"
      *   *Cultural Evolutionists:* They care about transmission biases, group selection, and timescales. They will hate a purely genetic genealogy.
      *   *Philosopher of Biology:* Cares about function (etiological vs. causal role) and teleosemantics. Might ask about the definition of "explanation."
      *   *Moral Psychologist:* Knows the data on rationalization. Might say "You're stating the obvious" or "Your definition of belief is wrong."
      *   *General Vibe:* They are vaguely realist but haven't defended it. They value empirical adequacy over logical coherence. They will smell "armchair" a mile away.

  3.  **Drafting the 8 Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* "Morality isn't a natural kind." (The Fragmentation Objection). If morality is a grab bag (disgust, reciprocity, etc.), a global debunking fails. *Who:* The cooperation psychologists. *Damage:* High. It undermines the target.
      *   *Objection 2 (The Mechanism):* "You're ignoring cultural transmission." (The Dual-Inheritance Objection). Genetic genealogy is insufficient. *Who:* Cultural evo modelers. *Damage:* High. Makes the genealogy incomplete.
      *   *Objection 3 (The Function):* "Truth-tracking *is* adaptive." (The Adaptationist Objection). If believing truths helps cooperation, selection tracks truth. *Who:* Evolutionary biologists. *Damage:* Medium-High. Attacks the "Inertness" claim directly.
      *   *Objection 4 (The Definition):* "What counts as an explanation?" (The Explanatory Autonomy Objection). Maybe moral facts explain at a higher level even if not causally. *Who:* Phil of Biology. *Damage:* Medium. Philosophical but grounded in function.
      *   *Objection 5 (The Data):* "WEIRD samples/Context dependence." (The Empirical Objection). Your genealogy is based on specific contexts. *Who:* Moral Psychologist. *Damage:* Medium. Questions the universality of the genealogy.
      *   *Objection 6 (The Phenotype):* "What is the belief?" (The Proximate Objection). Is it a judgment, an emotion, a behavior? *Who:* Psych people. *Damage:* Medium. Vagueness kills the argument.
      *   *Objection 7 (The Normativity):* "So what?" (The Pragmatic Objection). Even if debunked, we still need norms to function. *Who:* Everyone practically. *Damage:* Low-Medium. Misses the metaphysical point but challenges relevance.
      *   *Objection 8 (The Third-Factor):* "Correlation isn't causation, but it's not noise." (The Common Cause Objection). *Who:* Modelers. *Damage:* Low. You already addressed third-factor, but they might frame it mathematically.

      *Refining for "Damage" and "Register":*
      *   Need to make sure they sound like *scientists*, not philosophers. Use terms like "proximate mechanism," "phylogenetic signal," "variance explained," "model parameter."
      *   Re-order by damage. The "Target is Ill-Defined" and "Genealogy is Incomplete" are the most damaging because they stop the argument before it starts.

  4.  **Developing the Replies and Soft Spots:**
      *   For each, I need a punchy 2-minute reply that respects their expertise but holds the philosophical line.
      *   Crucially, I need to identify where the reply is *weak*. This shows intellectual honesty and prevents the user from digging a hole.

  5.  **Pre-emptive Moves (First 5 Minutes):**
      *   Clarify "Moral Facts" (don't mean supernatural).
      *   Clarify "Genealogy" (includes culture, not just genes).
      *   Clarify "Realism" (not just 'being nice').
      *   Acknowledge the Psych data (rationalization) without conflating it with the metaphysical point.

  6.  **The "One Reply That Must Land":**
      *   It has to be the distinction between *causal explanation* and *explanatory inertness*. If they think the genealogy *requires* the fact to make sense, the argument fails. If they agree the science works without the fact, the argument wins. The key is getting them to agree that the *scientific* story is complete without the *metaphysical* posits.

  7.  **The Dreaded Question:**
      *   What is the question that exposes the philosopher's evasion?
      *   Likely: "If you're right, why are you arguing? What's the normative force of your own argument?" (The Self-Defeat/Pragmatic Contradiction).
      *   Or: "You're asking us to accept a conclusion that makes all our normative discussions meaningless, based on a premise you can't prove."
      *   Better: "If moral facts are inert, why should we care about your argument? Is *your* claim about inertness also inert?" (The Self-Undermining Objection).
      *   *Decision:* The "Self-Undermining/Pragmatic" question. "If normative claims are unjustified, why should we accept your normative claim that we should abandon realism?"
      *   *Brave Answer:* Admit the tension. Distinguish between *pragmatic necessity* and *metaphysical truth*.

  8.  **Review against Constraints:**
      *   No lit reviews? Check.
      *   Specific audience register? Check (proximate/ultimate, WEIRD, dual-inheritance).
      *   Ordered by damage? Check.
      *   Soft spots identified? Check.

  9.  **Final Polish:**
      *   Tone should be collegial but sharp.
      *   Ensure the distinction between the "Phil of Bio" and the "Psych" is clear.
      *   Make sure the "Inertness Test" is clear in the replies.

  *(Self-Correction during drafting)*: I initially thought about putting the "Third Factor" objection high. But the prompt says the user already expects philosophers to ask that. This audience is scientists. They are more likely to attack the *empirical adequacy* of the genealogy (e.g., "You ignored culture") or the *definition of the target* ("Morality isn't one thing"). I need to prioritize the scientific objections over the metaethical ones. The "Target is Ill-Defined" is probably the biggest threat from the cooperation lab. The "Culture" objection is biggest from the modelers.

  Let's refine the "Dreaded Question." It needs to be something that cuts through the academic posturing. The Moral Psychologist is "politely skeptical of everything including her own data." She might ask: "You're using empirical claims to drive a metaphysical conclusion, but your empirical claims are just as theory-laden as the realism you're attacking." That's good. But the *real* dread is usually the "So what?" or "Self-defeat." Let's go with the "Pragmatic Self-Defeat" but phrased scientifically: "What is the adaptive function of *this* belief (anti-realism) if truth-tracking is inert?"

  Actually, the prompt says "the question I'm dreading... I'd rather see it written out with the answer I'd give if I were brave." This implies a personal/professional risk. The risk is usually admitting that the argument destroys the speaker's own authority. Let's go with: "If your argument works, it debunks your own argument."

  Okay, let's assemble.

  *Structure:*
  1.  **Pre-emptive Moves (First 5 Mins):** Set the table to avoid easy hits.
  2.  **The 8 Objections:** Ordered by damage. Who, Phrasing, Reply, Soft Spot.
  3.  **The One Reply That Must Land:** The core success condition.
  4.  **The Dreaded Question:** The trap and the brave exit.

  *Refining the Objections:*
  1.  *Fragmentation (The "Which Morality?" objection)* - Cooperation Lab.
  2.  *Incomplete Genealogy (The "Culture" objection)* - Cultural Evo.
  3.  *Tracking is Adaptive (The "Truth Helps" objection)* - Evo Bio.
  4.  *Proximate vs Ultimate (The "Level of Analysis" objection)* - Psych/Bio.
  5.  *Explanatory Pluralism (The "Different Games" objection)* - Phil of Bio.
  6.  *The "So What?" (The "Pragmatic" objection)* - Everyone.
  7.  *WEIRD/Context (The "Empirical Generalization" objection)* - Moral Psych.
  8.  *The "Just-So" (The "Speculation" objection)* - Skeptics.

  *Wait, I need to make sure the replies are 2 minutes spoken.* Keep them tight.
  *Soft spots need to be honest.* Don't pretend the reply is a knockout if it isn't.

  *Let's finalize the Dreaded Question.* It's usually the one that exposes the philosopher's privilege. "You're asking us to accept a claim about reality that you admit has no causal grip on reality. Why is *your* claim different?"

