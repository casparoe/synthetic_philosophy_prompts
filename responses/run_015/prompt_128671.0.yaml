  **Order:** 1. vNM Affine Recap. 2. Ex Ante Pareto (defuse ex post). 3. Social vNM Axioms. 4. Theorem Formula. 5. Rescaling/Units (the core). 6. Normative Defusions.

  **What breaks:** You are right: rescaling (5) must precede normative interpretation (6). If you discuss the moral weight of $a_i$ before establishing they soak up unit changes, students will treat $a_i$ as fixed moral parameters rather than representation artifacts. They will think changing units changes ethics. Swapping 2 and 4 is fatal: if you state the theorem before clarifying Pareto applies to *expectations*, the ex post objection will derail the derivation immediately.

  **Analogy:** Run it, but **fix** the terminology. Do not use "exchange rates" (implies market equilibrium/prices). Use "unit conversion" (inches vs. centimeters). **Bolt on:** "There is no 'true' utility length. Changing $u_i$ is like measuring a table in inches vs. cm; changing $a_i$ compensates exactly. The product $a_i u_i$ is the invariant." This prevents them thinking $a_i$ are measurable magnitudes found in the world.

  **Objections:**
  1.  *Ex Ante vs. Ex Post:* Place **before** the theorem (Step 2). This is a premise condition. If they misunderstand Pareto here, the input is garbage.
  2.  *"Proved Utilitarianism"* & *"Weights do work"*: Place **after** the formula (Step 6). Once the math is visible, show that $a_i$ are arbitrary without further moral constraints. The theorem proves representation, not morality.
  3.  *"ICCs in $u_i$"*: Defuse in Step 5 (Rescaling). Emphasize $u_i$ are isolated preference orderings; comparability enters only via the social ranking assumption.

  **Negative Weights:** **Footnote.** Mention only that Pareto *Indifference* allows negative weights; Strong Pareto (if anyone gains, society gains) forces $a_i \geq 0$. Do not derive it. It distracts from the affine transformation insight.

  **Exclusion:** **Correct to cut Impartial Observer.** It conflates the aggregation result (math) with the justification for weights (ethics). Keep the seminar on the structural theorem.

  **Closing Question:** "If I double every individual's $u_i$ values, what must happen to the $a_i$ to keep the social ordering unchanged, and does this change the moral weight of anyone's welfare?"
  *Answer:* $a_i$ must halve; moral weight is unchanged because the product is invariant. This tests if they see $a_i u_i$ as a unitless invariant rather than fixed numbers.
