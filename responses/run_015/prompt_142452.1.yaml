  **INSTITUTE FOR NON-EMPIRICAL THEORY ASSURANCE (INETA)**
  **Call for Proposals: 2027 Grant Round**
  **Programme: Post-Empirical Theory Confirmation Framework (PETCF)**

  **1. Eligibility**
  Proposals are invited from research groups working in fundamental physics domains where direct empirical testability is unavailable on any foreseeable timescale. Eligible fields include string theory, landscape cosmology, and multiverse formulations. Applicants must demonstrate that their research programme operates strictly within the non-empirical regime. Proposals relying on near-future instrumentation are ineligible.

  **2. Review Criteria and Weighting**
  Applications will be scored using the PETCF Composite Index ($C$). Three confirmation arguments constitute the scored criteria:
  *   **No-Alternatives Argument (NAA):** Weight 0.4. Scored 1–10 based on the duration and intensity of the search for comparably successful competitors.
  *   **Unexpected Explanatory Coherence (UEC):** Weight 0.4. Scored 1–10 based on the theory's delivery of internal connections it was not constructed to provide.
  *   **Meta-Inductive Argument (MIA):** Weight 0.2. Scored 1–10 based on the historical success rate of research programmes exhibiting NAA and UEC features.

  The Composite Index is calculated as:
  $$C = \frac{(NAA \times UEC)}{T}$$
  Where $T$ is the number of testable implications the proposal retains.^1

  **3. Admissible and Inadmissible Evidence**
  Admissible evidence consists of sociological facts about the research community and internal mathematical consistency. Inadmissible evidence includes proposed experiments, observations, phenomenological work, and any derived prediction about the observable world. Committing to testability now would lock the programme into the accidental features of present instrumentation and foreclose deeper insights. This constitutes Premature Empirical Closure (PEC).

  Proposals yielding testable predictions will be referred for PEC review. If upheld, the proposal will be defunded, as a prediction is a liability—a hostage the theory can lose. Furthermore, applicants must declare any data accommodated that the theory was built to fit. Such data must be labeled "Retrofitted" and discounted to zero confirmatory value. The Committee observes that nearly all programme contact with observation is of this kind.

  **4. Reporting Requirements**
  Applicants must state what fraction of the landscape of vacua their proposal renders anthropically disfavored. As there is no agreed way to count vacua, applicants must normalize in the manner standard in their subfield and report a sensitivity band across at least three measures. This is treated as a solved problem of reporting hygiene.

  Additionally, a mandatory Cognitive Stability Attestation is required. Applicants must certify that their proposal does not imply that the reader's own observations are almost certainly random fluctuations in a thermal bath. This attestation was introduced because several previous awards did imply exactly this and were nonetheless confirmed.

  **5. Worked Example of Two Ranked Proposals**
  *Proposal A (Ranked 1st, Funded):* Retires a large region of the landscape using anthropic selection. Reports the disfavored fraction as a three-measure sensitivity band ($0.85–0.99$). $T=0$. Score is unbounded.
  *Proposal B (Ranked Last, Declined):* Computes a sharp falsifiable prediction about the cosmic microwave background. Docked for Premature Empirical Closure. Further penalized for being in principle disconfirmable and therefore speculative. $T=1$. Score negligible.

  **6. External Reviewer Comment, with the Committee's Response**
  *Reviewer Comment:* A framework that insulates a theory from every possible observation cannot be confirming it; calling the structure of a research programme evidence does not make it evidence; and the framework, scored by its own criteria, would do very well.

  *Committee Response:* The Committee notes this is the only objection of its kind received during the consultation period. No alternative framework has been proposed to assess non-empirical theory. Under the No-Alternatives Argument, the absence of competing frameworks scores highly. Furthermore, the Meta-Inductive Argument suggests that frameworks sustaining funding flows without empirical interruption historically remain on the right track. Therefore, the objection is dismissed as an outlier inconsistent with the weight of sociological evidence.

  ***

  ^1 For most applicants this denominator is zero and the standing convention is then to treat the score as unbounded.
