  - Lifelong envatment: my brain has been in a vat since birth and every apparent experience has been fed to me. I feel nothing. I don't treat it as a live possibility and I don't think it should change what I do.
  - Total deception by a Cartesian-style demon of unlimited power and malice: equally cold, and I think for the same reason.
  - The five-minute hypothesis, the one where the world sprang into existence five minutes ago complete with my memories: cold as well.
  - Recent envatment: everything up to this morning was as I remember it, and since this morning my experience has been fed to me. This one genuinely frightens me, and I feel I ought to take it seriously.
  - The impostor case: everyone I know was replaced overnight by someone else who behaves indistinguishably. This frightens me more than recent envatment, even though the class of beliefs it falsifies is much narrower.
  - The paperwork case: lifelong envatment, except that there is a drawer in the house I have never had any reason to open, and inside it is the lab's documentation. This frightens me more than either of the previous two, even though my evidence is exactly what it is in the plain lifelong case.
  - Whether the simulated life is better or worse than the real one makes no difference to how seriously I take the scenario. My friend insisted it must.

  So force seems to track something like the availability of a check, or the presence of a transition I can locate in my own history, or the narrowness of the error — but none of those gets all seven verdicts, and the first three cases are indiscernible from the fourth in every respect I can name, which makes my fear in the fourth look arbitrary.

