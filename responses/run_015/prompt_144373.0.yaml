  After considering your cases, I have tested three candidate principles against your data.

  The first candidate was **Empirical Undetectability**: *We fear only what we cannot rule out.* This fails immediately. You cannot rule out Lifelong Envatment, yet you feel nothing. You also cannot rule out Recent Envatment from the inside, yet you feel fear. Undetectability is constant across your cases; your fear is not.

  The second candidate was **Agential Malice**: *We fear scenarios involving a deceptive agent.* This fails your seventh point (value/malice makes no difference) and cannot explain why the Paperwork case (bureaucratic documentation) frightens you more than the Cartesian Demon (unlimited malice).

  The third candidate, which fits your data best, focuses not on the *content* of the deception, but on the **structure of the evidence** required to resolve it. Your fear does not track the *likelihood* of the scenario, nor the *consequences*, but the **proximity of the deciding fact**. You are not afraid of being wrong; you are afraid of being *checkably* wrong in a way you haven't checked yet.

  Here is the principle that captures the shape of your reactions.

  ### The Principle of Local Decidability

  **A skeptical hypothesis exerts normative force on a subject proportional to the proximity of the contingent evidence required to decide it.**

  This principle is composed of three clauses, each motivated by a specific tension in your verdicts.

  **Clause 1: The Structural Inertia Clause**
  *Hypotheses that posit a divergence from reality at the origin of experience or outside the subject's causal horizon exert zero normative force.*
  *   **Motivation:** This explains your coldness toward **Lifelong Envatment**, the **Cartesian Demon**, and the **Five-Minute Hypothesis**. In all three, the "truth" is structurally severed from your current causal powers. There is no action you can take, no memory you can trust, and no object you can inspect that would settle the matter. Because the deciding fact is outside your horizon, the hypothesis is epistemically inert. It makes no practical difference.

  **Clause 2: The Temporal/Social Localization Clause**
  *Normative force arises only when the hypothesis posits a specific, contingent divergence point located within the subject's causal history or social environment.*
  *   **Motivation:** This explains why **Recent Envatment** frightens you while Lifelong does not. Recent Envatment posits a break *this morning*. This places the divergence point within your timeline, implying that the "before" was real and potentially accessible (via memory or external records). It explains why the **Impostor Case** frightens you: the divergence is located in the people standing next to you. The error is local, not global.

  **Clause 3: The Evidential Proximity Scaling Clause**
  *The intensity of the normative force scales with the immediacy and stability of the unexamined evidence that could resolve the hypothesis.*
  *   **Motivation:** This explains the ranking of your fears.
      *   **Recent Envatment** relies on *mnemonic* evidence (memories of before this morning) or distant external logs. This is fragile and temporally distant. (Low Fear).
      *   **The Impostor Case** relies on *social* evidence (the people right in front of you). This is more immediate than memory, but people are complex and can be deceptive. (Medium Fear).
      *   **The Paperwork Case** relies on *physical* evidence (a document in a drawer you haven't opened). This is the most immediate, stable, and decidable evidence possible. It is in your house, waiting for your hand. (Highest Fear).

  ***

  ### Prediction: The Indifferent Simulation

  You ask about a simulation run by indifferent agents, where you are a by-product, with no malice and **no check available even in principle**.

  **Prediction:** You should feel **nothing**.

  **Reasoning:** This scenario explicitly stipulates "no check available even in principle." This places it squarely under **Clause 1 (Structural Inertia)**. Like the Lifelong Envatment and the Cartesian Demon, the truth of this scenario is outside your causal horizon. The indifference of the agents is irrelevant (per your seventh point); the lack of a check is decisive. Under the Principle of Local Decidability, this scenario is epistemically identical to the Lifelong Envatment. It is a global structural condition, not a local contingent error.

  ***

  ### The Blunt Verdict

  You asked me to be blunt about which of your verdicts this principle forces you to give up.

  **You must surrender the fear of Recent Envatment and the Impostor Case *if* you maintain they are indiscernible from Lifelong Envatment.**

  Here is the hard truth: Your claim that "the first three cases are indiscernible from the fourth in every respect I can name" is the weak link in your reasoning.
  *   **Phenomenologically**, they are indiscernible (your experience is the same).
  *   **Epistemically**, they are distinct.

  In **Lifelong Envatment**, there is *no* fact of the matter accessible to you that could prove you are in a vat. The evidence does not exist in your world.
  In **Recent Envatment**, there *is* a fact of the matter (what happened this morning), and it is in principle accessible (security cameras, other people's testimony, physical traces of abduction).
  In **The Paperwork Case**, the evidence *actually exists* in your environment.

  **If you insist that Recent Envatment is truly indiscernible from Lifelong Envatment regarding available evidence**, then the Principle of Local Decidability forces you to treat Recent Envatment as **Cold**. You are currently granting it force based on an illusion of access. You feel fear because you *imagine* you could check (e.g., "I remember before this morning"), but if the scenario is true, that memory is fed. If the memory is fed, you have no check. If you have no check, you are in the Lifelong case.

  **However,** I recommend you surrender the **Cold** verdict on Lifelong Envatment only if you are willing to accept global paralysis. It is more epistemically healthy to surrender the **Frightened** verdicts on Recent/Impostor *to the extent* that you treat them as globally undecidable.

  **My recommendation:** Keep the fear of the **Paperwork Case**. It is the only one where the evidence is stipulated to exist *and* be accessible. It is a genuine, resolvable uncertainty. Treat **Recent Envatment** and **Impostor** as **Cold** unless you can identify a specific, accessible test you are currently refusing to perform. If you cannot name the test, the fear is merely anxiety, not epistemic caution.

  Your intuition is tracking **responsibility**, not truth. You fear the scenarios where you *could have known* but didn't check (the drawer, the people, the morning transition). You do not fear the scenarios where knowing was impossible. The Principle of Local Decidability formalizes this: **Skepticism only bites where negligence is possible.** In the Lifelong case, you are not negligent; you are trapped. In the Paperwork case, you are negligent; the drawer is closed.

  If you accept this, you must admit that your fear of Recent Envatment is a fear of your own potential negligence, not a fear of the deception itself. If you cannot check it, you are not negligent, and the fear should vanish.
