prompt: |-
  hey so i'm a phd student in political philosophy and i'm helping set up the interview questions for our dept podcast next week. the guest is dr. elena vasquez — she wrote this recent monograph where she argues the dirty hands problem is totally misframed if we treat it like a one-time moral stain. she has this idea called deliberative residue, which is that when a legislator makes a dirty compromise, it doesn't just leave them with dirty hands, it actually rewires thier reasoning so they're primed to rationalize the next bad deal.

  i need like 8-10 questions that go past her just explaining the concept, and for each one i want you to build in a follow-up that hits the answer she's most likely to give. specifically i want one that pushes her on whether this residue operates at the psychological level or is more of an institutional feedback loop, another on how she distinguishes it from ordinary adaptive preference formation (like elster-style sour grapes), and one that anticipates the reply that she's just redescribing old-school moral corruption in jargon — with a sharp follow-up that makes that deflection harder. audience is mostly grad students and some faculty in pol theory, so keep it in the weeds but dont ask for reading lists or anything. also maybe include a question about whether democratic accountability mechanisms can actually wash away the residue or if they're part of the problem. i keep going back and forth on whether her view makes representatives into something like collectively weak-willed actors, so a question on that'd be good too.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** PhD student in political philosophy.
      *   **Task:** Create 8-10 interview questions for a department podcast.
      *   **Guest:** Dr. Elena Vasquez (fictional/expert persona).
      *   **Topic:** Her monograph on the "Dirty Hands" problem, specifically the concept of "deliberative residue" (compromise rewires reasoning/rationalization).
      *   **Requirements:**
          *   8-10 questions.
          *   Go beyond basic explanation (assume audience knows the gist).
          *   Include specific follow-ups for *each* question.
          *   Follow-ups must anticipate her likely answer and push back (steel-manning then challenging).
          *   Specific topics to cover:
              *   Psychological vs. Institutional feedback loop.
              *   Distinction from adaptive preference formation (Elster/sour grapes).
              *   Objection: Just old-school moral corruption in new jargon (make deflection hard).
              *   Democratic accountability (solution or part of the problem?).
              *   Collective weak-willed actors (akrasia).
          *   **Tone:** In the weeds (grad student/faculty level), no reading lists, professional but probing.

  2.  **Deconstruct the Core Concept ("Deliberative Residue"):**
      *   *Standard Dirty Hands:* I do a bad thing for a good reason, I feel guilt, I move on (or suffer). It's episodic.
      *   *Vasquez's Twist:* It's cumulative. Doing the bad thing changes *how* I think about future things. It creates a habit of rationalization. It's a structural/cognitive shift, not just a moral stain.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Mechanism (Psych vs. Institutional).*
          *   *Draft:* Is this psychological or institutional?
          *   *Refinement:* Needs to be sharper. Frame it as a tension between individual cognition and structural incentives.
          *   *Follow-up:* If she says "both," push on which one is the *driver*.

      *   *Question 2: Adaptive Preferences (Elster).*
          *   *Draft:* How is this different from sour grapes?
          *   *Refinement:* Elster is about changing preferences to match constraints. Vasquez is about changing *reasoning patterns* to match past actions. Need to highlight the normative vs. descriptive gap.
          *   *Follow-up:* If she says "Elster is unconscious, this is strategic," push on whether the *outcome* is the same (loss of normative grip).

      *   *Question 3: Moral Corruption Objection.*
          *   *Draft:* Isn't this just corruption?
          *   *Refinement:* Frame it as "redescription." Why do we need new vocabulary?
          *   *Follow-up:* If she says "precision matters," ask what practical work the precision does that "corruption" doesn't.

      *   *Question 4: Democratic Accountability.*
          *   *Draft:* Can elections fix this?
          *   *Refinement:* Do accountability mechanisms wash the residue or accumulate it?
          *   *Follow-up:* If she says "they help," ask about the timeline mismatch (residue is slow, elections are fast).

      *   *Question 5: Collective Akrasia (Weak Will).*
          *   *Draft:* Are they weak-willed?
          *   *Refinement:* Frame it as the legislature acting as a single agent with a consistency problem.
          *   *Follow-up:* If she says "no, it's structural," ask if that lets individuals off the hook too easily.

      *   *Question 6: The "First Compromise" Threshold.*
          *   *Idea:* When does the residue start? Is there a bright line?
          *   *Follow-up:* If she says "it's gradual," push on how we identify the tipping point for intervention.

      *   *Question 7: Normative Implications for the Voter.*
          *   *Idea:* What should voters do with this info?
          *   *Follow-up:* If she says "be skeptical," ask if that leads to cynicism/disengagement.

      *   *Question 8: Comparison to Walzer.*
          *   *Idea:* Walzer is the big name on Dirty Hands. How does she diverge?
          *   *Follow-up:* If she says "Walzer is too individualistic," ask if she loses the tragic dimension Walzer cared about.

      *   *Question 9: Institutional Design.*
          *   *Idea:* Can we design around this?
          *   *Follow-up:* If she says "yes," ask if that implies technocracy over democracy.

      *   *Question 10: The "Clean Hands" Alternative.*
          *   *Idea:* Is the alternative abstention?
          *   *Follow-up:* If she says "no," ask if there's any scenario where dirty hands *don't* leave residue.

  4.  **Refining and Polishing (Checking Constraints):**
      *   *Tone Check:* Is it PhD level? Yes, using terms like "akrasia," "adaptive preferences," "normative grip."
