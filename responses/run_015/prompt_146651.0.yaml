answer: |-
  Here are 10 interview questions tailored for a political theory audience, designed to push past the summary of the book and into the structural and normative implications of "deliberative residue." Each includes a follow-up that anticipates a standard academic defense and pressures it further.

  ### 1. The Locus of Residue: Psychological vs. Institutional
  **Question:** You frame deliberative residue as a rewiring of the legislator's reasoning capacities. But where exactly do you locate the mechanism? Is this primarily a cognitive-psychological phenomenon happening *inside* the agent, or is it an institutional feedback loop where the structure rewards the rationalization?

  **Follow-up:** "I anticipate you'll say it's a feedback loop between the two. But if you had to prioritize for the sake of intervention: if we could fix the institutional incentives but leave the psychology unchanged, does the residue still accumulate? Or is the cognitive habituation the primary driver that persists regardless of rule changes?"

  ### 2. Distinction from Adaptive Preferences (Elster)
  **Question:** There's a strong resonance here with Jon Elster's work on adaptive preference formation—the idea that agents adjust their desires to match feasible constraints. How do you distinguish deliberative residue from a political version of 'sour grapes'? Is the difference simply that residue is about *reasoning patterns* rather than *preference satisfaction*?

  **Follow-up:** "Sure, but if the normative outcome is identical—the agent loses the ability to critique the constraint because they've internalized it—does the distinction do any heavy lifting? If a legislator rationalizes a bad deal because they've adapted to the 'art of the possible,' isn't the loss of normative grip the same, regardless of whether we call it preference adaptation or deliberative residue?"

  ### 3. The "Old Wine in New Bottles" Objection
  **Question:** A critic might argue that 'deliberative residue' is just a granular redescription of what previous generations called moral corruption or the 'slippery slope' of compromise. What work is the new terminology doing that 'corruption' doesn't?

  **Follow-up:** "I'm pushing on this because 'corruption' implies a deviation from a healthy norm, whereas your framing suggests this might be endogenous to democratic bargaining itself. If residue is a standard byproduct of legislation rather than a deviation, doesn't that mean calling it 'corruption' is actually *more* accurate than your neutral-sounding 'residue'? Are you inadvertently sanitizing the moral cost?"

  ### 4. Democratic Accountability as Solvent or Solvent?
  **Question:** You suggest that residue accumulates over time, priming actors for worse deals. Do democratic accountability mechanisms—elections, oversight committees, term limits—function as a solvent that washes away this residue, or are they part of the accumulation problem?

  **Follow-up:** "If you argue they are part of the problem, that implies the electoral cycle is too short to capture the slow build of residue. But if you argue they are a solvent, aren't you relying on voters to detect a cognitive shift in reasoning that is, by your own definition, subtle and internal? How can accountability target something the agent themselves is rationalizing away?"

  ### 5. Collective Akrasia (Weakness of Will)
  **Question:** Your model makes it sound like a legislature can function as a collectively weak-willed actor. They 'know' the norm, but the residue compels them to act against it repeatedly. Do you think it's coherent to attribute akrasia to a collective body, or does this metaphor risk anthropomorphizing the institution to let individual members off the hook?

  **Follow-up:** "Let's say you insist it's collective. If the body is akratic, does that justify paternalistic intervention from outside the legislature? If they can't trust their own deliberative process because it's 'rewired,' who is left with the clean hands to oversee them?"

  ### 6. The Threshold Problem
  **Question:** One tension in the book is the threshold of contamination. Is there a 'first compromise' that triggers the residue, or is it strictly gradual? If it's gradual, how do we identify the point where a legislator transitions from 'pragmatic' to 'residue-compromised' without resorting to hindsight bias?

  **Follow-up:** "If there's no bright line, doesn't that make the concept unfalsifiable? Any time a legislator makes a tough call, a critic can claim it's residue; any time they don't, they can claim integrity. What empirical marker would you accept as evidence that residue *isn't* present?"

  ### 7. Walzer and the Tragic Dimension
  **Question:** Michael Walzer's original formulation of 'Dirty Hands' retains a tragic dimension—the leader suffers for the violation. Your account seems more clinical; the leader doesn't necessarily suffer, they just rationalize. Have we lost something important by removing the guilt/suffering component?

  **Follow-up:** "If guilt is the only check against residue, and your actors have rationalized the guilt away, does your model imply that 'good' leadership is actually unsustainable in the long term? Are you arguing that the only way to avoid residue is to refuse to govern effectively?"

  ### 8. Institutional Design Implications
  **Question:** If deliberative residue is a structural hazard, what does institutional design look like post-Vasquez? Are we talking about rotating committees, mandatory sabbaticals, or something more radical like sortition to break the rationalization chain?

  **Follow-up:** "Most of those solutions seem to trade efficiency for integrity. If you admit that reducing residue slows down legislation, are you willing to argue for a less efficient democracy as the price of moral hygiene? How do you sell that to a constituency demanding results?"

  ### 9. The Role of Opposition
  **Question:** You focus heavily on the legislators making the deals. What is the role of the opposition in this framework? Are they immune to residue, or does the constant requirement to critique deals they might later make infect them with a different kind of cynical residue?

  **Follow-up:** "If the opposition is also infected—perhaps with a residue of performative outrage rather than compromise—does that mean the entire deliberative system is compromised? Does your theory lead to a systemic pessimism where no actor within the system is capable of diagnosing the problem?"

  ### 10. Normative Exit Strategies
  **Question:** Finally, for the individual legislator who recognizes they have accumulated significant deliberative residue: what is the normative exit strategy? Is recusal enough? Resignation? Or is the damage to their reasoning capacity irreversible for the duration of their tenure?

  **Follow-up:** "If you say resignation, you're essentially arguing that experienced legislators are morally hazardous materials. If you say they can stay, you're trusting the very reasoning capacity you claim is rewired. Is there any coherent middle ground here, or is this a paradox without a solution?"
