      *   *Count:* Need 8-10. I have 10 ideas above. I will select the strongest 8-10 and ensure the follow-ups are punchy.

  5.  **Final Review against "Vasquez's Likely Answers":**
      *   Academics often hedge ("It's complex," "Both/And"). The follow-ups need to force a prioritization or expose a tension in that hedge.
