          *   Need to address the "attenuated causal chain."
          *   *Strategy:* Shift from *causal* responsibility (did I push the button?) to *role-based* responsibility (did I oversee the system properly?). Use the concept of "vicarious liability" and "duty of candor."
      *   **Accountability Framework (Who Answers?):**
