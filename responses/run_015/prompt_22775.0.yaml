          *   The Hospital (institutional liability/credentialing).
          *   The Vendor (contractual indemnification).
      *   **Conditions for Deployment:**
          *   Informed consent (patients must know it's AI).
          *   Human-in-the-loop (override capability).
          *   Data sharing/audit rights (fight the "proprietary" claim).
          *   Insurance/Indemnification.

  4.  **Refining the Ethical Argument (The "Hard Part"):**
      *   The prompt specifically asks to tackle the worry that "no single person counts as a genuine responsible agent."
      *   *Response:* We cannot accept a "responsibility vacuum." If we use the tool, we absorb the risk. The surgeon isn't responsible for the *code*, but for the *decision to use the tool* in that specific context. The hospital is responsible for *vetting the tool*.
      *   *Key Concept:* "Meaningful Human Control." Even if the AI is autonomous, the human must have the authority and ability to intervene or stop.
      *   *Key Concept:* "Strict Liability" for the institution. If the AI fails unpredictably, the hospital pays/answers, not necessarily the individual surgeon (unless negligent).

