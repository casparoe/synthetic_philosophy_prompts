answer: |-
  ### The Specification for Adequacy

  To count as adequate for binding policy and career allocation, an argument regarding AI existential risk must satisfy the following requirements. I have retained your core sketches, refined their phrasing for operational clarity, and added one necessary condition regarding updates.

  **1. Risk Decomposition (Hazard, Exposure, Vulnerability)**
  *   **Motivation:** Interventions target specific nodes. A compute cap reduces *Exposure* (number of actors/systems) but does not mitigate *Hazard* (capability to cause harm) or *Vulnerability* (societal fragility). An argument that conflates these will recommend capping compute to solve a vulnerability problem (e.g., biological synthesis), wasting leverage.
  *   **Correction:** You must explicitly map the proposed intervention to the specific component it addresses. If the argument claims to solve "risk" generally without specifying which component is the bottleneck, it fails.

  **2. Marginal Claims (Counterfactual Policy Comparison)**
  *   **Motivation:** Decision theory requires comparing State A (Policy) vs. State B (Status Quo). A headline probability of doom (e.g., "10% chance of extinction") is decision-irrelevant without the delta (e.g., "Cap reduces doom from 10% to 8%").
  *   **Correction:** Absolute probabilities are permitted only as intermediate variables. The final output must be a marginal benefit estimate.

  **3. Mechanism Specificity**
  *   **Motivation:** "Loss of control," "Misuse," and "Structural Dynamics" have distinct causal graphs. Restraint helps with Dynamics but may hinder Safety (control). An argument that allows the intervention appropriate for one (e.g., secrecy for misuse) to stand in for another (e.g., alignment for control) is invalid.
  *   **Correction:** The argument must select *one* primary mechanism or explicitly model the trade-offs between them.

  **4. Definition of "Existential" (Stakes Calibration)**
  *   **Motivation:** Extinction, permanent lock-in, and civilizational collapse carry different values and recovery probabilities. A policy justified by extinction (infinite loss) may not be justified by collapse (recoverable loss).
  *   **Correction:** The policy conclusion must be robust to downgrading the stakes from "extinction" to "permanent curtailment." If the argument collapses when the stakes are finite, it relies on fanaticism (see Req 6).

  **5. Dual-Source Robustness (Mechanism vs. Analogy)**
  *   **Motivation:** Arguments often hide weak causality behind strong historical parallels (nuclear, biotech) or vice versa.
  *   **Refinement:** I am demoting your requirement that analogies must stand alone *without* mechanism. Induction without causation is historically brittle. Instead: The mechanism must be plausible without relying *solely* on analogy, and the analogy must not be used to bypass mechanistic explanation. Both must carry weight, but mechanism is primary.

  **6. Position on the Fanaticism Problem (Value Bounding)**
  *   **Motivation:** If stakes are astronomically large, tiny probabilities dominate all other moral considerations (Pascal's Mugging). This justifies extreme measures that violate other norms.
  *   **Addition:** The argument must state whether it accepts expected value maximization without bounds, applies a probability discount, or bounds the value of the future. The policy recommendation must follow from this ethical stance, not hide it.

  **7. Robustness to Null Evidence (The Test Cases)**
  *   **Motivation:**
      *   *The Quiet Decade:* If capabilities plateau, does the risk argument dissolve or merely delay?
      *   *The Fire-Inspector:* If the intervention succeeds, the catastrophe does not happen, and the risk looks retroactively like hype.
  *   **Correction:** The argument must specify *what evidence would weaken it* in a Quiet Decade, and *what proxy metric* validates success in the Fire-Inspector scenario (since the absence of disaster is not proof of safety).

  **8. Update Conditions (Falsifiability)**
  *   **Motivation:** An argument that cannot be weakened by new empirical data is dogma, not a risk assessment.
  *   **Addition:** The argument must specify which empirical observations (e.g., scaling laws breaking, specific alignment failures, geopolitical shifts) would cause the proponent to lower their risk estimate or abandon the policy.

  ***

  ### Non-Negotiables vs. Methodological Prejudices

  **Non-Negotiable (Decision-Theoretic Necessities):**
  *   **Marginal Claims (Req 2):** You cannot optimize a system without a gradient. Absolute risk levels do not provide a gradient for policy.
  *   **Mechanism Specificity (Req 3):** You cannot pull a lever if you do not know which gear it turns. Conflating misuse and accident leads to contradictory policies.
  *   **Update Conditions (Req 8):** If the belief is immune to evidence, it is not a hypothesis suitable for public policy.

  **Methodological Prejudices (Epistemic Stances):**
  *   **Dual-Source Robustness (Req 5):** Demanding analogies hold weight without mechanism is a preference for empirical induction over theoretical derivation. A strong mechanistic argument should not *need* historical analogy to be valid.
  *   **Position on Fanaticism (Req 6):** This is an ethical axiom, not an empirical finding. Whether one accepts longtermist expected value maximization is a philosophical commitment, not a requirement for the *truth* of the risk model, though it is required for the *policy* derivation.
  *   **Risk Decomposition (Req 1):** While highly useful, one could argue that in tightly coupled systems, Hazard/Exposure/Vulnerability are inseparable. However, for policy design, treating them as separable is practically necessary.

  ***

  ### The Unsatisfiable Subset

  I suspect the following three requirements cannot be jointly satisfied to a high degree of precision:

  **{ Empirical Constraint (Req 8) + Unique Event (Existential) + Decision-Relevant Number (Req 2) }**

  *   **The Conflict:** To satisfy **Empirical Constraint**, you need repeatable data or observable near-misses to update your priors. To satisfy **Unique Event**, you must admit the catastrophe is singular and potentially unobservable if successful (**Fire-Inspector**). To satisfy **Decision-Relevant Number**, you need a probability estimate precise enough to weigh against the cost of the compute cap.
  *   **The Trilemma:**
      1.  If the event is truly existential and unique, you lack the reference class for **Empirical Constraint**.
      2.  If you lack empirical constraints, your **Decision-Relevant Number** is derived entirely from priors (theory/analogy), making it highly sensitive to the **Fanaticism** stance.
      3.  If you rely on priors to generate the number, you cannot satisfy **Update Conditions** easily, because any absence of disaster can be attributed to the intervention (Fire-Inspector) rather than the falsity of the risk model.
  *   **Conclusion:** You can have a theoretically consistent argument (Mechanism + Fanaticism) or an empirically grounded one (Scaling Laws + Incidents), but you cannot have an empirically grounded argument that yields a precise decision-relevant probability for a unique, unobservable catastrophe. You must sacrifice precision or empiricism.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the largest share of current discourse is **Marginal Claims (Req 2)**.

  Most public and private discourse focuses on absolute probabilities ("AI has a 50% chance of killing everyone") or qualitative severity ("This is worse than nuclear weapons"). Very few arguments quantify the *delta*: "A compute cap reduces the probability of catastrophic misuse by X% at a cost of Y% economic growth." Without this counterfactual, the argument supports alarmism, not allocation. It tells you to worry, but not whether *this specific intervention* is the cheapest way to stop worrying.

  ***

  ### Critique of Three Live Lines of Argument

  **1. The "Just Another General-Purpose Technology" Line**
  *   **Failure:** Fails **Risk Decomposition (Req 1)** and **Definition of Existential (Req 4)**. It assumes societal *Vulnerability* is low (resilience is high) based on historical adaptation to steam/electricity, without addressing why AI *Hazard* might differ qualitatively (e.g., autonomous agency). It treats "existential" as hyperbole rather than a distinct stake category requiring distinct modeling.

  **2. The "Default Misalignment of Superintelligent Systems" Line**
  *   **Failure:** Fails **Fire-Inspector Robustness (Req 7)** and **Update Conditions (Req 8)**. If alignment work succeeds, the system looks benign; if it fails, we are dead. There is no intermediate observable state to validate the risk model before the cliff-edge. Consequently, it cannot generate a **Decision-Relevant Number (Req 2)** that updates on safety progress, leading to a static "doom" probability regardless of interim technical wins.

  **3. The "Competition Makes Restraint Impossible" Line**
  *   **Failure:** Fails **Mechanism Specificity (Req 3)** and **Quiet Decade Robustness (Req 7)**. It treats "competition" as a monolithic force rather than a variable dependent on specific actors (states vs. corps) and hardware constraints. It assumes a continuous ramp of capability; if a **Quiet Decade** occurs, the pressure to race may dissipate, but this argument often lacks the mechanism to explain why restraint would become viable then, rendering it brittle to timeline shifts.
