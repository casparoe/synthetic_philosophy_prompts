answer: |-
  This is a classic "1 AM ethics tutorial" rabbit hole, and the fact that you're wrestling with the *queasiness* of the Loop case and the *inconsistency* of the Doomed cases shows you're doing the work properly. You have identified the exact fracture points where the Doctrine of Double Effect (DDE) breaks down for modern intuitions.

  Your proposed principle (Worse-Off + Means) is a strong start, but as you noticed, it collapses the Loop case into the Fat Man case. To save your intuition that Loop is *Fine* (but queasy) while Fat Man is *Not Fine*, we need to shift from "Means vs. Side Effect" to **"Existing Threat vs. New Threat."**

  Here are two candidate principles that, when combined, capture almost all your verdicts, explain the Doomed paradox, and handle the Villain/Volunteer cases.

  ### Candidate Principle 1: The Source of Threat Principle (SOT)

  > **Statement:** It is permissible to intervene in a causal sequence **already in motion** to redirect a lethal threat from a greater number to a lesser number. It is impermissible to **initiate a new** lethal causal sequence against a bystander to save others, regardless of the net lives saved.
  >
  > **Aggravating Clause:** The moral cost of an intervention increases if the agent has **pre-meditated** the harm (e.g., rigging a trap in advance) rather than improvising in the moment, as this indicates a disposition to treat people as resources.

  ### Candidate Principle 2: The Liability & Consent Override (LCO)

  > **Statement:** The prohibition against initiating a new lethal sequence (from SOT) is **voided** if the target is **morally liable** for the threat or has provided **valid prior consent** to be used in this specific manner. In such cases, the agent is not merely *permitted* to act, but may be *required* to do so if it minimizes harm.

  ---

  ### How These Principles Map to Your Cases

  Here is the breakdown of which clause does the work, and where you have to surrender some intuitions for consistency.

  #### 1. The Standard Cases (Switch, Loop, Fat Man)
  *   **Plain Switch:** **SOT (Permissible).** You are redirecting an existing threat (the trolley). The one on the spur is hit by the trolley, not by you.
  *   **Loop:** **SOT (Permissible).** You are still redirecting the trolley. The fact that his body stops it is a physical consequence, but you did not *launch* him at the trolley.
      *   *Why the Queasiness?* Your "Means" intuition (your old Clause ii) is acting as a warning signal. The Loop case is causally closer to Fat Man than Switch is. SOT says it's permissible, but acknowledges the "queasiness" as a recognition that you are bordering on using him, even if the *source of threat* remains the trolley.
  *   **Fat Man (Shove):** **SOT (Impermissible).** You are initiating a *new* causal sequence (gravity + shove). The man was not a threat until you made him one.
  *   **Trapdoor (Unrigged):** **SOT (Impermissible, but less direct).** Removing support is causally closer to redirecting (letting gravity take him) than shoving is. This explains why it feels "less bad" than shoving, though SOT still generally flags it as a new sequence.
  *   **Trapdoor (Pre-rigged):** **SOT Aggravating Clause (Worse).** This explains your specific intuition that rigging it on Tuesday is worse. It's not about the act of pressing the button; it's about the *predatory intent* of preparing a human trap.
      *   *Cost of Admission:* If you accept this, you must admit that your morality isn't just about the *act* (pressing the button), but about the *agent's character/history*. A pure act-utilitarian would say Tuesday vs. Today doesn't matter. You are committing to a view where **preparation matters.**

  #### 2. The Doomed Paradox (Spur vs. Fat Man)
  This is where your intuitions were screaming for help, and these principles solve it.
  *   **Doomed Spur:** **SOT + Harm Calculation.** The act is Permissible (Redirecting Threat). The *cost* is lower because he isn't made "worse off" (he dies in 15 seconds anyway). So it feels "easier."
  *   **Doomed Fat Man:** **SOT (Impermissible).** The act is Forbidden (New Threat). The fact that he is doomed reduces the *harm*, but it does not change the *type of act*. You cannot murder someone even if they were going to die of a landslide in 15 seconds.
      *   *Why this solves your paradox:* Your Clause (i) "Worse Off" was trying to do too much work. SOT says: **Act Type Trumps Harm Calculation.** You can't do a forbidden act type (New Threat) even for a reduced cost. You *can* do a permitted act type (Redirect) for a reduced cost.

  #### 3. The Default Switch
  *   **Verdict:** **SOT (Neutral).** Morally, leaving it and throwing it back are identical outcomes.
  *   *Cost of Admission:* You noted this "feels like it shouldn't matter and does." SOT demands you discard the intuition that the *default setting* changes the morality. Omission and Commission are morally equivalent here if the causal source (the trolley) is the same. You must accept that your hesitation is a psychological bias, not a moral truth.

  ---

  ### Application to Your Undecided Cases

  Here is what the **LCO (Liability & Consent Override)** says about the two cases you are stuck on.

  #### Case A: The Gloating Villain
  *   **Scenario:** The guy on the spur tied the five to the track.
  *   **Principle Verdict:** **Required.**
  *   **Reasoning:** Under LCO, he is **morally liable** for the threat. By creating the lethal situation, he has forfeited his right not to be harmed by the redirection of that threat.
  *   **Is it Retributive Glee?** No. It is not about punishing him (retribution); it is about **forfeiture of rights**. He lost the shield of "innocent bystander." If you didn't flip it, you would be prioritizing the rights of the aggressor over the rights of the victims. Your intuition that it is "almost required" is correct and robust.

  #### Case B: The Volunteer
  *   **Scenario:** The guy on the spur signed a card consenting to be hit.
  *   **Principle Verdict:** **Permissible (Bordering on Required).**
  *   **Reasoning:** Under LCO, valid consent voids the right not to be harmed.
  *   **Why you're undecided:** You are likely sensing the difference between *consenting to risk* and *consenting to death*. However, in the logic of the Trolley Problem, if the consent is specific ("I want to be the one hit if it comes up"), he has waived his right.
  *   **The Shift:** If he consents, the case morally collapses into the **Plain Switch** case, but with *zero* net harm to him (assuming he values saving the 5 more than his life, or has accepted the fate). If you flip in the Plain Switch, you **must** flip here. To not flip would be to disrespect his agency/autonomy.

