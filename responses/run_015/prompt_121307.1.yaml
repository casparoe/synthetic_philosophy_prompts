  ### The Cost of Admission: What You Must Discard

  To hold this coherent view, you have to be honest about which intuitions are bugs, not features.

  1.  **Discard the "Tuesday" Intuition (or isolate it):** If you believe Pre-rigged Trapdoor is *worse* than Unrigged Trapdoor, you are admitting that **character matters more than the act.** This is a Virtue Ethics stance. If you want a clean Deontological principle, you must admit pressing the button is the same moral act regardless of when you rigged it. I recommend keeping your intuition here but labeling it "Assessment of Agent" rather than "Assessment of Act."
  2.  **Discard the Loop/Fat Man Equivalence:** You already did this (you say Loop is Fine, Fat Man is Not). But you must accept that the *queasiness* in Loop is a false alarm regarding *permissibility*. It is permissible, even if it feels like a means-case.
  3.  **Discard the Default Bias:** You must accept that Switch Default (Leave it) and Switch Active (Throw it) are morally identical. The "feeling" that leaving it is safer is an omission bias.
  4.  **Accept the Doomed Asymmetry:** You must firmly accept that **Doomed Fat Man is still Wrong.** This is the hardest pill. It means there are things you cannot do to a person even if it costs them nothing. (Most people accept this: you can't shoot a doomed man even if he's dying in 15 seconds).

  ### Summary Recommendation

  Adopt the **Source of Threat Principle** as your baseline. It explains why you can turn the trolley (Switch/Loop/Doomed Spur) but not push the man (Fat Man/Doomed Fat Man).

  Use the **Liability Override** to settle the Villain (Flip) and Volunteer (Flip) cases.

  And acknowledge that your discomfort with the **Pre-rigged Trapdoor** is a valid insight into *predatory intent*, even if it complicates a clean act-based principle. You aren't just judging the button press; you're judging the person who rigged the trap. That's a feature of your morality, not a bug.
