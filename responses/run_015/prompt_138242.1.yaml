answer: |-
  ### The Six Pruned Desiderata

  To construct a norm capable of underwriting testimonial warrant while guiding institutional speech, we must prune the literature's expansive wish-list. The following six requirements are the survivors. I have paired each with the motivating case and a verdict on its status as a genuine constraint or a theoretical prejudice.

  **1. The Challenge Constraint**
  *   **Requirement:** The norm must explain why 'How do you know?' is the canonical challenge to an assertion, and why answering 'I believe it' or 'It is true' is insufficient.
  *   **Motivating Case:** *The Standard Challenge.* When a speaker asserts, they invite a specific query about their epistemic position. If the norm were merely truth, 'It is true' should suffice. If it were merely belief, 'I believe it' should suffice. The fact that neither stops the challenge suggests the norm points towards a stronger state.
  *   **Verdict:** **Non-negotiable.** Any account that cannot explain the distinctive linguistic practice of challenging assertions fails to describe the phenomenon.

  **2. The Moorean Constraint**
  *   **Requirement:** The norm must render assertions of the form '$p$, but I do not satisfy the norm regarding $p$' inherently defective or absurd.
  *   **Motivating Case:** *The Blindspot.* Consider asserting, 'The meeting is at noon, but I do not know it is.' This is not necessarily false, but it is pragmatically self-defeating. The norm must explain this without relying on psychological quirks of the speaker.
  *   **Verdict:** **Non-negotiable.** This is the hardest data point in the field; a norm that allows Moorean assertions is descriptively inadequate.

  **3. The Blamelessness Constraint**
  *   **Requirement:** The norm must distinguish between an assertion being *incorrect* (violating the norm) and the asserter being *blameworthy* (culpable for the violation).
  *   **Motivating Case:** *The Lucky Gettier.* A speaker asserts a true proposition based on excellent evidence that is, unbeknownst to them, Gettierised. They satisfy the norm of warrant but fail the norm of knowledge (if the norm is knowledge). They should not be blamed, yet the assertion might still be deemed defective in some sense.
  *   **Verdict:** **Non-negotiable.** Collapsing correctness into blameworthiness makes normative evaluation impossible in cases of excusable ignorance.

  **4. The Agency Constraint**
  *   **Requirement:** The norm must be followable *ex ante* by agents who lack first-person access to the norm's condition, including non-mental institutional agents.
  *   **Motivating Case:** *The Bureaucrat.* A press office issues a statement based on a distributed evidence base no single member possesses. They cannot 'know' in the personal sense, nor can they introspect a collective mind. Yet they must decide whether to assert. A norm requiring a mental state they cannot verify is useless as guidance.
  *   **Verdict:** **Prejudice of the Regulatory Camp.** Proponents of constitutive norms (e.g., Williamson) argue norms need not be decision procedures. However, for your specific purpose (institutional guidance), this is functionally non-negotiable.

  **5. The Transmission Constraint**
  *   **Requirement:** The norm must allow that a hearer can acquire warrant from an assertion even if the speaker has violated the norm, provided the assertion is reliably connected to the truth.
  *   **Motivating Case:** *The Reliable Liar.* A speaker habitually violates the norm (e.g., guesses wildly) but happens to be right and reliable on this occasion. If the hearer's warrant depends entirely on the speaker's compliance, testimony becomes too fragile. The norm governing the *speaker* must not strangle the epistemology of the *hearer*.
  *   **Verdict:** **Prejudice of the Anti-Reductionist Camp.** If you hold that testimony transmits warrant *because* assertion is a knowledge-guaranteeing act, this constraint is fatal. If you hold testimony is a form of reliable indication, it is essential. Given your brief, treat as non-negotiable.

  **6. The Statistical Constraint**
  *   **Requirement:** The norm must forbid assertion on purely statistical evidence (lottery cases) while permitting assertion on high-probability empirical evidence, without appealing to vague 'pragmatic encroachment'.
  *   **Motivating Case:** *The 499 Tickets.* An administrator sees 499 of 500 tickets are paid. They cannot assert of the last one 'This ticket is unpaid' solely on those odds, yet they can assert 'This bus is late' on similar probabilistic grounds. The norm must mark the difference.
  *   **Verdict:** **Non-negotiable.** This distinguishes assertion from mere high-confidence prediction.

  ***

  ### Evaluation of Your Cases

  You have provided a robust list. Here is the separation of genuine constraints from theoretical smuggling.

  **Genuine Constraints:**
  *   **The Moorean Pair & Standard Challenge:** These are the bedrock of the debate. Any norm that fails here is dead on arrival.
  *   **The Blamelessness Distinction (Gettier/False):** Essential. If a norm marks all false assertions as blameworthy, it is too harsh for human cognition. If it marks all Gettierised assertions as correct, it loses its grip on knowledge.
  *   **The Statistical Evidence (499 Tickets):** This is a hard constraint. A norm that permits lottery assertions is generally regarded as extensionally inadequate.
  *   **The Institutional/Dead/Automated Speaker:** For your specific project, this is a hard constraint. For general epistemology, it is often bypassed by treating such cases as 'quasi-assertion'. You are right to insist on treating them as full assertion; this forces the norm to be state-independent.

  **Theoretical Smuggling (Prejudices):**
  *   **The Selfless Assertion:** You cite the friend asserting the dog died on hearsay she would normally discount. This is a weapon against the *Belief* Norm, not necessarily a constraint on *any* norm. It assumes that the assertion is *proper*. If your favoured theory is the Knowledge Norm, you must argue this assertion is actually improper (though perhaps excusable). Do not treat the intuition of propriety as data; treat it as a theory-laden judgement.
  *   **The Preface Paradox:** This demands that the norm does not require global consistency. This is only a constraint if you assume the norm applies to the *corpus* of assertions rather than the *act*. It smuggles in a view about the scope of the norm.
  *   **The Indifferent Speaker:** You ask about the speaker who believes and is right but is indifferent. This tests the link between sincerity and normativity. However, it assumes indifference is compatible with assertion. Many argue indifference precludes assertion entirely. This case presupposes the conclusion that assertion is separable from sincere advocacy.
  *   **Hearing Warrant Survival:** You list this as a goal, but be careful. If the norm is constitutive of assertion, and the speaker violates it, has an assertion occurred? If yes, warrant can survive. If no, there is no testimony to evaluate. This is not a data point but a metaphysical commitment about the relationship between norms and acts.

  ***

  ### The Exclusionary Requirement and the Shibboleths

  **The Single Most Exclusionary Requirement:**
  The **Agency Constraint** (followability by non-knowing agents).
  This requirement excludes the Knowledge Norm (KN) in its standard formulation. If a norm requires a condition $C$, and the agent cannot determine whether they satisfy $C$, the norm cannot guide them *ex ante*. Since institutions and automated systems cannot 'know' in the factive, internalist sense required by KN, KN fails to provide the guidance your specification demands. It forces you towards a Warranted Assertability or Truth norm, or a heavily modified 'collective knowledge' view which risks vacuity.

  **Real Demands vs. Camp Shibboleths:**
  *   **Real:** The need to explain the *challenge data* ('How do you know?'). This is linguistic fact.
  *   **Shibboleth:** The claim that the norm must be *constitutive* rather than *regulative*. Knowledge Normers insist assertion is constituted by the knowledge rule (like baulking in baseball). Warrant Normers insist it is a rule of conduct (like driving on the left). This distinction often masks the fact that both sides want the norm to do both jobs (define the act and guide the agent).
  *   **Shibboleth:** The insistence that 'knowledge' is the only state that explains the challenge data. This ignores that 'adequate warrant' could explain the challenge if we understand the challenge as asking for the *source* of warrant, not necessarily factive knowledge.
  *   **Real:** The distinction between *criticism of the act* and *criticism of the agent*. This is necessary to handle error without scepticism.

  ***

  ### The Trilemma: An Unsatisfiable Subset

  You suspected a trilemma in the vicinity of Knowledge, Followability, and Statistics. The actual conflict is sharper. The following three desiderata are jointly unsatisfiable by a single norm:

  1.  **The Explanatory Demand:** The norm must explain the specific linguistic data (Moorean absurdity and the Knowledge Challenge).
  2.  **The Guidance Demand:** The norm must be directly followable by agents who lack first-person access to the norm's condition (Institutions/Non-mental agents).
  3.  **The Underwriting Demand:** The norm must be the source of the hearer's warrant (Testimonial security depends on norm compliance).

  **Why they clash:**
  *   To satisfy **(1)**, you need the **Knowledge Norm**. Only knowledge explains why 'I believe' is an insufficient answer and why Moorean sentences are absurd.
  *   To satisfy **(2)**, you need a **Warrant/Truth Norm**. Agents can follow 'Assert what is warranted' or 'Assert what is true' (via evidence); they cannot follow 'Assert what you know' because they cannot distinguish knowledge from high warrant internally.
  *   To satisfy **(3)**, you need a tight link between speaker compliance and hearer entitlement. If you choose the Knowledge Norm (for 1), and the speaker violates it (because they can't follow it, per 2), the hearer's warrant is threatened unless you sever the link (violating 3). If you choose the Warrant Norm (for 2), you fail to explain the challenge data (violating 1).

  **The Result:** You cannot have a single norm that does both jobs you specified (underwrite testimony *and* guide institutions) while respecting the linguistic data. You must either:
  *   Accept a **Dual-Norm Theory**: One constitutive norm (Knowledge) for the linguistic data/testimonial weight, and one regulatory norm (Warrant) for institutional guidance.
  *   **Prioritise Guidance**: Adopt a Warrant norm, and explain the linguistic data as pragmatic implicatures rather than normative constraints.
  *   **Prioritise Testimony**: Adopt a Reliability norm, and treat the linguistic data as secondary.

  Given your brief, the **Agency Constraint** breaks the Knowledge Norm. You cannot guide a press office with a rule they cannot verify.

  ***

  ### Scorecard

  **The Knowledge Rule (Williamson)**
  *   **Pros:** Perfectly handles the Challenge and Moorean data. Explains the distinctive authority of assertion.
  *   **Cons:** Fails the Agency Constraint (institutions cannot follow it). Struggles with the Transmission Constraint (if the speaker lacks knowledge, why does the hearer gain warrant?). Makes blameless error difficult to categorise without auxiliary hypotheses.
  *   **Verdict:** Best for description, worst for your prescriptive/institutional purpose.

  **The Truth Rule (Kvanvig et al.)**
  *   **Pros:** Satisfies the Agency Constraint (one can aim for truth via evidence). Handles the Transmission Constraint well (hearer gets truth regardless of speaker state).
  *   **Cons:** Fails the Challenge Constraint ('It is true' should be a valid answer, but it isn't). Too permissive on lottery cases (allows assertion on high probability).
  *   **Verdict:** Good for institutions, too weak for epistemology.

  **The Belief Rule (Bach et al.)**
  *   **Pros:** Easy to follow (Agency satisfied). Explains sincerity.
  *   **Cons:** Fails the Challenge Constraint ('I believe it' should suffice). Collapses the distinction between honest assertion and honest guessing. Fails the Selfless Assertion case (marks it as improper).
  *   **Verdict:** Psychologically realistic, epistemically anemic.

  **The Warranted Assertability Rule (Douven/Contextualists)**
  *   **Pros:** Satisfies Agency (agents can assess warrant). Handles Blamelessness well (warranted but false is blameless). Can be tuned to handle Statistical cases via context.
  *   **Cons:** Struggles to explain the specific force of 'How do you *know*?' rather than 'How do you have warrant?'. Risks making assertion too similar to conjecture.
  *   **Verdict:** The strongest candidate for your specific dual-purpose brief, provided you can bolster it to explain the Knowledge Challenge without collapsing into the Knowledge Norm.
