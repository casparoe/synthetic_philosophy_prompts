      *   Identity switches show sensitivity is fragile, but often the *class* of object is still tracked (entailment holds even if identity fails).
      *   *Verdict:* The analogy actually undermines the anti-closure claim if pushed technically. Robust tracking *requires* something like closure (consistency across time and space via models).

