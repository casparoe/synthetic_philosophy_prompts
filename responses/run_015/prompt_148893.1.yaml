      *   *Structural Disanalogies:*
          *   Trackers optimize for *continuity*, not *truth* per se. (A smooth wrong track is often preferred to a jittery right one in some loss functions).
          *   Trackers don't have "belief" states in the propositional sense; they have probability distributions.
