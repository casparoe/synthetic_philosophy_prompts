      *   *Closure:* Multi-target association / Hierarchical tracking.

  6.  **Evaluating the "Anti-Closure" Claim via Technical Extensions:**

      *   *Occlusion/Prediction:* If the drone predicts the path during occlusion, it is effectively "inferring" the position based on a model. If the model is good, it tracks *through* the gap.
          *   *Implication:* This looks like *closure*. If I track the physics (laws) and the initial position, I track the future position. This undermines the "locality" argument. The tracker *does* extend beyond direct observation via a model (entailment).
      *   *Identity Switches:* If Object A and Object B cross, and the tracker swaps IDs.
