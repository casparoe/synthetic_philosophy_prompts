      *   **Closure Problem:** Nozick famously rejects the principle that if $S$ knows $p$ and $p$ entails $q$, then $S$ knows $q$. (e.g., I know I have hands, but I don't know I'm not a brain in a vat, even though having hands entails not being a BIV).
      *   **Reasoning:** Sensitivity is not closed under entailment. I would believe I have hands even if I were a BIV (stimulated), so I don't track the truth of "not BIV".

  3.  **Analyze the Classmates' Analogy (Drone Tracking):**

      *   **Belief:** Registered coordinates.
      *   **Truth:** Object actually there.
      *   **Sensitivity:** Algorithm fails to register if object moves (false $p \rightarrow$ no belief).
      *   **Anti-Closure:** Tracking object A doesn't mean tracking Object B (even if A entails B relationally).

  4.  **Introduce Technical Complexities (MOT):**

      *   **Occlusion:** Target hidden, tracker predicts.
