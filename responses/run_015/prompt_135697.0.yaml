answer: |-
  It is completely understandable why you feel that the comparison between Thomson's lamp and a Zeno machine is doing too much heavy lifting, because your suspicion is correct that the analogy often smuggles in assumptions that the original thought experiment explicitly excludes. When people map the lamp onto a Zeno machine to dissolve the paradox, they are essentially treating the physical setup as a computational device where the final state is merely the output of a completed process, but this requires a specific architectural commitment that Thomson's lamp does not possess. To lay out the mapping as it is typically presented by proponents of the hypercomputation view, the program is the simple toggle rule that dictates the lamp changes state at each step, while the tape corresponds to the binary state of the lamp itself, effectively a single cell holding a zero or a one. The read-write head is the mechanism performing the switch, and the clock is the geometric progression of time intervals that shrinks by half at each step, ensuring the infinite sequence converges on a finite moment, usually t=2. In this framing, the halting condition is simply the arrival of that limit time, at which point the machine is said to have finished its infinite work and the state of the lamp is treated as the result displayed on the screen.

  However, this is precisely where the comparison breaks down under scrutiny, specifically regarding the transition function and the definition of the machine state at the limit. In a standard Turing machine, the transition function defines the state at step n+1 based on the state at step n, but it offers no rule for determining the state at step omega, which is what t=2 represents in this supertask. When philosophers and computer scientists discuss legitimate models of hypercomputation, such as Infinite Time Turing Machines, they explicitly stipulate a limit rule, often something like taking the limit superior of the cell values, to define what happens when the clock reaches the infinite ordinal. Thomson's lamp lacks this stipulation entirely. The toggling rule only tells you how to get from one moment to the next within the sequence, but it contains no instruction for what happens after the sequence is complete. By treating the lamp as a Zeno machine that simply outputs a result, advocates are implicitly assuming a limit rule exists where Thomson argued there is none, effectively begging the question by assuming the state is well-defined in order to prove that the state is well-defined.

  Your skepticism about the phrase supertask determinism is also well-founded, as it is not a canonical philosophical position with a established lineage like compatibilism or utilitarianism, but rather a shorthand used in online discussions and some niche philosophy of physics papers to describe the idea that physical possibility entails causal determinacy of the outcome. When people argue that nature must allow an arbitrary assignment of an endpoint state, they are usually trying to sidestep the logical contradiction by claiming that if the physics allows the infinite steps, the universe will simply pick a state for reasons outside the logical structure of the task. This is not a genuine consensus view defended by major figures in the field but rather a rhetorical move to suggest that indeterminacy is a physical feature rather than a logical flaw. The argument suggests that because the causal chain is completed, the effect must exist, even if the logical rules governing the chain do not specify which effect it is. This conflates physical continuity with logical derivability, and while it might be a coherent stance in a specific metaphysical framework, it is not a standard solution to the paradox and often functions as a way to dismiss the logical problem by deferring to physical mystery.

  If the Zeno machine comparison collapses in the ways you suspect, particularly around the missing transition function for the limit state and the lack of a program counter that survives the infinite sequence, then the conclusion that there is no paradox and only hypercomputation does not survive. The claim that the lamp is just a computer finishing a job relies on the assumption that the job has a defined output, but Thomson's original point was that the description of the job does not define an output. Hypercomputation models work because they are formal systems where the designer has added rules to handle the limit, whereas the lamp is a thought experiment designed to highlight the absence of such rules. Without importing those extra rules from outside the scenario, you are left with a process that is fully described up to t=2 but utterly silent at t=2. Therefore, the paradox remains intact as a logical problem about the completeness of descriptions involving actual infinities, and treating it as a solved engineering problem of infinite speed computing merely obscures the fact that the computational model being invoked requires axioms that the lamp scenario does not provide. The analogy fails because it tries to solve a logical indeterminacy by asserting a physical determinacy that has not been justified by the premises of the thought experiment.
