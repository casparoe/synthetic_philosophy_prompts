      *   *Wait, the prompt says:* "each participant genuinely lacks an individual mental representation of the complete end state."
      *   *Better Scenario:* **The Improvised Rescue Sling.** (Let's stick closer to the "Smoke Room" but make the epistemic gap clearer).
      *   *Final Decision:* **The Dark Room Table Carry.**
      *   *Setup:* Four students must carry a large, awkward table out of a completely dark room. Only one knows where the door is. Only one knows where the legs are weak. Only one knows the weight distribution. No talking allowed.
      *   *Wait, "No talking" makes it too physical.*
