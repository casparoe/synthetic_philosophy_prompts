answer: |-
  # Teaching Plan: Collective Intentionality & Joint Action
  **Session Length:** 50 Minutes
  **Target Audience:** First-Year Interdisciplinary Seminar (Skeptical, Non-Specialists)
  **Instructor:** Third-Year Philosophy Student (Discussion Leader)
  **Core Pedagogical Strategy:** Dependency Arc (Build the problem $\rightarrow$ Show the failure of individualism $\rightarrow$ Introduce the solution).

  ---

  ## I. Conceptual Scaffolding (For Your Preparation)
  *Do not teach this list explicitly.* This is the logical dependency chain you must hold in mind to sequence the discussion correctly.
  1.  **Intentionality:** Action is distinguished from reflex by being guided by a mental representation of a goal.
  2.  **Content:** The "content" of that representation determines *how* the agent acts (e.g., "I move my arm" vs. "We lift the box").
  3.  **The Gap:** In complex joint action, the "complete goal" cannot fit in one individual's head (due to epistemic limits).
  4.  **The Necessity:** Therefore, the "We" must be part of the intention's content, not just a summary of individual "I"s.

  ---

  ## II. Session Timeline & Script Notes

  ### Phase 1: The Intuition Pump (00:00 – 00:10)
  **Goal:** Elicit the "Individualist" view (the misconception) without labeling it yet.
  **Activity:** "The Crowd vs. The Team."

  1.  **Ask:** "Imagine a hundred people running out of a burning theater. Now imagine a firecrew carrying a hose into that same theater. Both groups are moving together. What is the difference?"
  2.  **Listen:** Students will likely say "They know each other," "They have uniforms," or "They planned it."
  3.  **Press:** "If the firecrew members didn't know each other's names, and the plan changed instantly because of a collapse, are they still a team?"
  4.  **Board Work:** Write two columns: *Crowd* | *Crew*. Fill in student answers.
  5.  **Pedagogical Rationale:** You are establishing that students currently think joint action is just **Individual Intention + Coordination**. You need this baseline to break it later.

  > **⚠️ Misconception Intercept #1: Mere Synchronization**
  > *If a student says:* "The crowd is just moving at the same time, the crew is moving in sync."
  > *Your Move:* "Imagine the crowd stops running and starts walking in step. Are they now a crew? If not, synchronization isn't the difference. What is?" (Force them to admit it's about *why* they are moving, not just *how*).

  ### Phase 2: The Breakdown Scenario (00:10 – 00:25)
  **Goal:** Make the individualist view fail using the concrete scenario.
  **The Scenario:** **The Spiral Staircase Piano.**
  *   **Setup:** Three movers (A, B, C) must carry a grand piano down a narrow, spiral staircase. It is pitch black (lights out). No talking allowed (noise confuses balance).
  *   **Role Differentiation:**
      *   **A (Top):** Pushes down. Cannot see the bottom steps.
      *   **B (Middle):** Supports weight. Cannot see top or bottom.
      *   **C (Bottom):** Guides footing. Cannot feel the weight shift.
  *   **The Constraint:** None of them knows the full state of the piano. A doesn't know if C is stuck. C doesn't know if A is slipping.

  **Discussion Questions:**
  1.  "If Mover A thinks only: *'I intend to push this piano down,'* what happens?"
      *   *Expected Answer:* They crush C or tip the piano.
  2.  "If Mover A thinks: *'I intend to do my part so that C can guide us,'* does that work?"
      *   *Expected Answer:* Better, but A still doesn't know *when* to push.
  3.  **The Crucial Turn:** "If none of them can hold the picture of 'The Piano Reaching the Bottom Safely' in their own head (because they lack the sensory data), what is guiding their muscles?"

  **Pedagogical Rationale:** You are demonstrating **Epistemic Distribution**. If the "Complete Plan" isn't in Head A, Head B, or Head C, but the action succeeds, the "Plan" must exist in the *space between them*. This creates the *need* for a new concept.

  > **⚠️ Misconception Intercept #2: Strategic Cooperation**
  > *If a student says:* "They just have a deal. A pushes because they know B and C will do their parts."
  > *Your Move:* "A deal requires knowing the terms. A doesn't know what C is doing in the dark. If A acts on 'I trust you,' that's a gamble. If A acts on 'We are moving,' that's a commitment. Where is the commitment located if not in their individual heads?"

  ### Phase 3: The Conceptual Shift (00:25 – 00:35)
  **Goal:** Introduce "We-Intention" as the only viable solution to the breakdown.
  **Instruction:** Do not define "We-Intention" yet. Ask them to define it based on the failure in Phase 2.

  1.  **Propose:** "It seems like for this to work, Mover A's intention can't be 'I push.' It has to be something like 'We descend.'"
  2.  **Challenge:** "But 'We' isn't a person. Brains are in heads. How can a brain have a 'We' thought?"
  3.  **Resolution:** Guide them to see that the *content* of the intention is plural, even if the *vehicle* (the brain) is individual.
      *   *Formula:* I intend that **We** J (where J is the joint action).
      *   *Contrast:* I intend that I do X + I believe you will do Y.

  > **⚠️ Misconception Intercept #3: Group Consciousness**
  > *If a student says:* "So the group has a mind?"
  > *Your Move:* "No. The group doesn't have a brain. The *structure of the thought* in the individual brain references the group. The magic is in the grammar of the intention, not in a mystical group soul." (Intercept this here, before they think you are positing a metaphysical entity).

  ### Phase 4: Consolidation & Bracketing (00:35 – 00:50)
  **Goal:** Test understanding and scope the limits of the session.

  1.  **The Diagnostic Question (00:35 – 00:45):**
      *   *Ask:* "Return to the Piano. Suppose Mover A, B, and C successfully get the piano down. Later, we find out Mover A thought: *'I am just pushing this object to get paid, and I don't care if B and C succeed.'* A just happened to match their movements perfectly by luck. **Did A participate in a joint action?**"
      *   *Correct Understanding:* No. The physical success doesn't matter. Without the "We" in the intention, it was parallel individual action, not joint action.
      *   *Memorization Only:* Yes, because they moved the piano together.
      *   *Follow-up:* "Why does A's private thought change the reality of what happened?" (Answer: Because joint action is constituted by the intention, not just the outcome).

  2.  **Bracketing the Wider Debate (00:45 – 00:50):**
      *   *Script:* "Today we established that 'We-Intentions' are distinct from 'I-Intentions.' We did **not** solve how those intentions are created.
      *   **Joint Commitment:** Some philosophers (like Margaret Gilbert) say we need a promise to each other to form the 'We.'
      *   **Plural Subjecthood:** Others say we literally become a new kind of subject when we intend together.
      *   **Rationality:** We also didn't ask if it's rational to trust the 'We' when you can't see the bottom of the stairs.
      *   **Note:** These are real debates you will encounter in upper-level courses. For today, accept that the 'We' is real in the intention, even if we don't agree on its metaphysical cost."

  ---

  ## III. TA Cheat Sheet: Dependency Checks
  *Use this to monitor your own pacing.*

  *   **Before Minute 10:** Have I let them state the "Individualist" view? (If not, they won't feel the tension later).
  *   **Before Minute 25:** Have I made sure they admit Mover A *cannot* see the whole picture? (If they think A knows the whole plan, the argument for Collective Intentionality collapses).
  *   **Before Minute 35:** Have I stopped them from saying "The Group thinks"? (Ensure they understand the intention is in the individual, but *about* the group).
  *   **Before Minute 50:** Did I ask the Diagnostic Question about the "Luck/Money" mover? (This is the only way to verify they grasp irreducibility).

  ## IV. Contingency Plans
  *   **If they are too skeptical:** "Okay, forget philosophy. In cognitive science, if we scan Mover A's brain, do we expect to see the same neural pathway as a solo mover? If not, something different is happening. What is it?"
  *   **If they get stuck on metaphysics:** "We aren't asking if the 'We' exists in the world like a table. We are asking if it exists in the *explanation of the action* like a rule does."
  *   **If time runs short:** Cut the "Bracketing" section short, but **do not cut the Diagnostic Question.** It is the only assessment of learning.
