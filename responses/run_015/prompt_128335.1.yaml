      *   **Distinguish Neutrality Types:** Explain Neutrality of Justification vs. Neutrality of Effect. Aggregation fails the latter (obviously), but aims for the former (representing the people).
      *   **Address Aggregation:** Confirm that naive aggregation *is* majoritarianism. This is the "tyranny of the median voter" problem in AI.
      *   **Address Rawls:** Hardcoding Rawls isn't "neutral" in the sense of being empty; it's committing to a specific *liberal* political philosophy. It's a substantive choice disguised as procedure. (Rawls is not universally accepted).
      *   **The Real Tension:** It's not Neutrality vs. Aggregation. It's *Procedural Fairness* (Rawls) vs. *Preference Satisfaction* (Aggregation).
      *   **Impartiality:** Clarify that impartiality is the *mode* of operation (treating inputs fairly), while neutrality is the *stance* on the good.

