      *   Within Plot 2: Height variance is mostly seeds (High Heritability).
      *   Between Plots: Avg height difference is mostly soil (Environment).
      *   This proves Friend wrong on between-group gaps.
      *   Malleability: Add lime to Plot 1. All grow taller. High heritability didn't stop change.

