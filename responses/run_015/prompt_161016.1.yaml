answer: |-
  To determine whether switching off the device is akin to amputation (loss of self) or tool removal (loss of resource), your theory of cognitive extension must function as a boundary-drawing mechanism with ethical teeth. It cannot merely describe how cognition *works*; it must prescribe where the *self* ends.

  Below is the specification list for a theory of cognitive extension to be usable in this clinical context.

  ### The Specification List

  **1. The Non-Bloat Constraint**
  *   **Deliverable:** The theory must provide a principled limit on how far extension can spread. It cannot allow cognition to extend to every resource the agent accesses (e.g., the entire internet, other people's brains).
  *   **Case:** If the theory implies that looking up a fact on Google makes Google part of the patient's mind, then "switching off the internet" becomes a violation of bodily autonomy. For consent forms to be meaningful, the boundary of the "self" must be finite.
  *   **Status:** **Non-negotiable.** Without this, the distinction between amputation and tool-loss collapses entirely, rendering the protocol useless.

  **2. The Trust vs. Reliance Distinction**
  *   **Deliverable:** The theory must distinguish between *relying* on a process (monitoring it, verifying outputs) and *trusting* it (incorporating it into the cognitive loop without second-guessing).
  *   **Case:** I rely on my calculator but trust my hippocampus. If the patient must constantly verify the prosthesis's output, it remains a tool. If the output is accepted with the same phenomenological immediacy as biological recall, it approaches organ status.
  *   **Status:** **Non-negotiable.** This maps directly to the risk profile. Loss of a trusted system causes identity fragmentation; loss of a relied-upon tool causes functional inconvenience.

  **3. The Veridicality Condition (Wrinkle 1)**
  *   **Deliverable:** The theory must specify whether memory extension requires truth-tracking or merely functional role satisfaction.
  *   **Case:** If the device generates plausible confabulations that the patient integrates as memory (Wrinkle 1), a functionalist theory counts this as extended memory. A clinical ethicist cannot. If the theory allows false memories to count as "parts of the mind," switching the device off might be framed as "preserving the self," even if that self is delusional.
  *   **Status:** **Camp Taste.** Functionalists (Clark/Chalmers) will say role is enough; Traditionalists will say truth is required. *However*, for the protocol to be safe, the lab must select a theory that mandates **Truth-Tracking** as a necessary condition for "memory" status, even if that excludes some philosophical camps.

  **4. The Integration Temporal Window (Wrinkle 2)**
  *   **Deliverable:** The theory must state whether extension is a synchronic state (current coupling) or a diachronic process (history of coupling).
  *   **Case:** If the device works instantly (Wrinkle 2), is it already "you"? Or does the brain require months of plasticity to "accept" the silicon as tissue? If extension is synchronic, the device is self from Day 1. If diachronic, it is a tool until neural reorganization occurs.
  *   **Status:** **Camp Taste.** Standard EMT (Extended Mind Theory) is synchronic. Neuro-ethical integration models are diachronic. The protocol needs a definitive choice here to determine when the "amputation" risk begins.

  **5. The Vehicle vs. Process Distinction**
  *   **Deliverable:** The theory must identify whether the *storage* (vehicle) is extended or the *computation* (process) is extended.
  *   **Case:** A notebook stores data (vehicle) but the brain reads it (process). The hippocampal prosthesis records *and* stimulates (process). If only vehicles extend, the device is a storage bin. If processes extend, the device is doing the thinking.
  *   **Status:** **Camp Taste.** This determines the depth of the integration. Process extension implies a deeper ontological claim than vehicle extension.

  **6. The Neural Plasticity Constraint**
  *   **Deliverable:** The theory cannot contradict established data on bidirectional neural adaptation. It must acknowledge that if the brain changes to accommodate the device, the device becomes physiologically embedded.
  *   **Case:** If the hippocampus atrophies because the device takes over, or if new pathways form to interface with the electrodes, the device is no longer externally coupled in a simple way; it is physiologically integrated. A theory that ignores this biological reality is clinically dangerous.
  *   **Status:** **Non-negotiable.** A philosophical theory that contradicts neurobiology cannot guide a medical trial.

  **7. The Revocability Criterion**
  *   **Deliverable:** The theory must account for whether the extension can be removed without residual cognitive deficit.
  *   **Case:** If removing the device leaves the patient with *less* capacity than they had before implantation (due to dependency or atrophy), the device was not just an add-on; it became a structural support.
  *   **Status:** **Non-negotiable.** This is the practical test of the "amputation" hypothesis.

  ---

  ### Incompatibilities (Trade-offs)

  You asked which requirements cannot be met together. There are two critical tensions here that will force your group to choose a "camp."

  **1. The Parity Principle vs. The Integration Temporal Window**
  *   **Conflict:** The Parity Principle (a core tenet of standard EMT) suggests that if an external process performs the *same function* as an internal one, it is part of the mind *now* (Synchronic). However, the **Integration Temporal Window** (required for Wrinkle 2) suggests that extension requires a history of calibration and plasticity (Diachronic).
  *   **The Trade-off:** You cannot have both strict Parity and a mandatory History of Coupling. If you demand Parity, a device that works perfectly on Day 1 is "self." If you demand History/Plasticity, that same device is a "tool" until month 6.
  *   **Implication:** If you choose Parity, you risk classifying temporary tools as self (inflating the "amputation" risk). If you choose History, you risk denying self-status to highly effective, instant-coupling prosthetics (underestimating the harm of removal).

  **2. Functional Role vs. Veridicality (Wrinkle 1)**
  *   **Conflict:** A strict Functionalist theory (Camp Taste) argues that if the device plays the role of memory (guiding behavior, feeling like memory), it *is* memory, regardless of truth. The **Veridicality Condition** (required for clinical safety) demands that "memory" must track reality.
  *   **The Trade-off:** If the device confabulates (Wrinkle 1), Functionalism says it is still extended cognition. Clinical safety says it is a malfunctioning tool.
  *   **Implication:** You cannot adopt a pure Functionalist view for this trial. If you do, you must accept that switching off a device that generates false memories is akin to "lobotomizing" a part of the mind that holds those false memories. Most ethicists will find this untenable.

  ---

  ### The Most Exclusionary Requirement

  **The Neural Plasticity Constraint (combined with the Integration Temporal Window).**

  This single requirement excludes the most contenders, specifically the standard Clark & Chalmers "Notebook" style Extended Mind Theory.

  *   **Why:** Standard EMT is largely synchronic and functional. It argues that if the coupling is reliable and trusted, extension exists *regardless* of physical integration or time.
  *   **The Exclusion:** By demanding that the theory account for **Neural Plasticity** and a **History of Coupling** (to distinguish between a tool you hold and a tissue you grow), you exclude any theory that treats the brain as a static processor that simply "offloads" to external media.
  *   **Consequence for the Trial:** If you adopt this requirement, the device is **not** part of the mind at implantation. It only becomes "self" (amputation risk) after months of bidirectional neural adaptation. This solves the consent problem by creating a phased ethical status: Tool (Day 1) → Organ (Month 6).

  ### Summary Recommendation for the Protocol

  To make the consent form actionable, your group should adopt a theory that prioritizes the **Non-Bloat Constraint** and the **Neural Plasticity Constraint** over the **Parity Principle**.

  This allows you to tell the patient: *"Initially, this is a tool (like a notebook). If your brain adapts to it over six months, it may become part of your cognitive architecture (like a lens or limb). At that point, removing it carries different risks."* This avoids the philosophical trap of declaring it "self" immediately while acknowledging the genuine risk of ontological dependency later.
