      *   Let's look at the "Trust vs. Reliance" distinction. If the theory requires *trust* (opaque reliance) rather than *reliance* (transparent monitoring), that excludes many tools.
      *   *Decision:* The "Veridicality/Truth-Tracking" requirement is the biggest filter for a *memory* prosthesis. If the theory allows false memories to count as extended cognition, it fails the clinical safety spec. If it demands truth, it excludes functionalist views.
