          *   Address specific distinctions (process vs. vehicle, trust vs. reliance, cognition vs. info processing).
          *   Address constraints (memory, neural plasticity).
          *   Address two specific wrinkles: (1) Truth-tracking vs. Functional role (confabulation device), (2) Synchronic coupling vs. Diachronic history (instant vs. trained).
          *   Identify incompatibilities between requirements (trade-offs).
          *   Identify the single most exclusionary requirement.
      *   **Constraint:** Do *not* score actual views (e.g., don't say "Clark & Chalmers pass this"). The user will do that.

  2.  **Deconstruct the Ethical/Clinical Stakes:**
      *   If it's *part of the mind* (amputation analogy): Switching off might violate bodily autonomy, cause psychological harm akin to lobotomy, require higher consent thresholds, imply ownership rights over the data as "self."
      *   If it's *a tool* (notebook analogy): Switching off is maintenance, data is medical record, harm is functional impairment but not ontological loss.
      *   Therefore, the theory needs to draw a boundary line that aligns with moral status and clinical risk.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Boundary Problem.* The theory must distinguish between internal and external.
          *   *Consideration:* If everything is extended, nothing is. We need to know when to stop counting the device as "self."
          *   *Type:* NN.

      *   *Requirement 2: Truth/Veridicality.* (Addressing Wrinkle 1).
