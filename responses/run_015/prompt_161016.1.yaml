prompt: |-
  My lab group is helping write the consent and care protocol for a trial of an implanted memory prosthesis — a device that records and plays back activity around the hippocampus, and that patients end up depending on the way the rest of us depend on a photo roll. The practical question we keep arguing about: is switching it off more like amputating part of someone's mind, or more like taking away their notebook? So before I read another paper on the extended mind, I want the spec: what would a theory of cognitive extension actually have to deliver to be usable for a decision like that — which cases it has to get right, which distinctions it can't collapse (extension of a process vs. of a vehicle, trusting vs. merely relying, cognition vs. mere information processing), which results about memory and neural plasticity it can't contradict? Put the case or consideration behind each requirement, and mark which ones are non-negotiable and which are just one camp's taste (no cognitive bloat, parity with internal processes, needing a history of calibration, and so on). Two wrinkles the standard examples don't cover and that I want the list to handle: (1) a wearable that doesn't retrieve your past at all but generates a plausible story when prompted, and that you later find yourself remembering — does extension require the device to track the truth, or is playing the functional role enough? (2) a device that works the very first time you touch it, versus one that only becomes coupled after months of training — does the history of coupling matter, or is extension a synchronic matter? Its not enough to just redefine cognition to include whatever happens to be coupled, either. Then say whether any two requirements on the list can't be met together (that's the part I care most about), and which single requirement excludes the most contenders. Skip scoring the actual views, I'll do that myself.
