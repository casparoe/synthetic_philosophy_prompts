      *   Did I mark NN vs CT? Yes.
      *   Did I identify incompatibilities? Yes.
      *   Is the tone appropriate? Professional, philosophical, clinical.

  9.  **Final Polish:**
      *   Ensure the distinction between "amputation" and "notebook" is tied to the requirements.
      *   Make sure the "Non-negotiable" items are truly necessary for *clinical decision making*, not just philosophical purity. (e.g., Contradicting neuroscience is non-negotiable for a medical trial).
      *   Clarify the "Truth" wrinkle: Does memory *have* to be true? Philosophically debatable, clinically critical.
      *   Clarify the "Time" wrinkle: Is it the state or the history that matters?

      *(Self-Correction during drafting)*: I need to be careful with "Non-negotiable." In philosophy, almost nothing is NN. But the prompt asks for a theory *usable for a decision like that*. So, NN means "If the theory fails this, it cannot guide the consent protocol safely."
      *   NN: Cannot contradict established neurobiology (plasticity).
      *   NN: Must prevent cognitive bloat (otherwise consent is meaningless).
      *   NN: Must distinguish trust vs. reliance (ethical weight).
      *   CT: Parity principle.
      *   CT: Synchronic vs. Diachronic.
      *   CT: Truth-tracking vs. Functional role. (Wait, for a medical device, isn't truth NN? But the *theory* might define memory functionally. I will mark the *requirement for the theory to specify* as NN, but the *stance* as CT? No, the prompt asks what the theory must *deliver*. I will frame it as: The theory must provide a criterion for veridicality. Whether that criterion is 'truth' or 'function' is the CT part. Actually, for a *memory* prosthesis, if it confabulates, it's not memory clinically. I'll mark 'Veridicality Condition' as NN for clinical utility, acknowledging the philosophical tension.)

      *Re-evaluating "Most Exclusionary":* The requirement that "Extension requires bidirectional neural plasticity (diachronic coupling)" excludes the standard Clark/Chalmers notebook case and most current BCI interpretations. That seems the strongest filter.

      *Re-evaluating Incompatibilities:* The tension between "Parity with Internal Processes" and "History of Calibration" is the strongest. Parity implies if it works *now* like memory, it *is* memory. History implies it must have changed the brain *over time*. These are often mutually exclusive in practice.

  10. **Final Structure:**
      *   Intro: Acknowledge the stakes (Ontological status -> Ethical status).
      *   The Spec List (Requirement, Case, NN/CT).
      *   Handling the Wrinkles (integrated into the list or specific section? The prompt says "want the list to handle" them. I will embed them as specific requirements).
