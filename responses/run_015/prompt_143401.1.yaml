answer: |-
  View the conch and glasses as infrastructural tools for Deweyan inquiry. The conch regulates communication, ensuring shared intelligence rather than monopolized speech. Piggy's glasses represent warranted assertibility—seeing reality clearly enough to act effectively. When these break, deliberation becomes impossible because the tools required to test hypotheses and share consequences are destroyed. Golding shows that without these technologies, and without the institutional memory adults provide, inquiry collapses into impulse. Dewey requires continuity of experience to validate knowledge; the boys lack this history, making their democratic experiment inherently unstable.

  However, Dewey assumes that if communication channels exist, rationality will follow. Golding illuminates what Dewey neglects: the somatic power of fear and charisma. The boys abandon the conch not because it fails procedurally, but because the ritual of the hunt offers a more potent bodily satisfaction than deliberation. Dewey treats democracy as a cognitive habit, but the novel reveals it as a fragile suppression of visceral urges. The "Beast" is not a problem to be solved through experimental intelligence but an emotional truth that overrides it.

  Conversely, Dewey resists Golding's implication that savagery is innate. For Dewey, human nature is malleable, shaped by institutional conditions. The collapse isn't proof of original sin but of broken continuity. The boys lack the institutional memory to reconstruct cooperative habits under stress. Dewey would argue that if the environment had supported shared interests longer, the "savagery" might not have crystallized. Golding insists the rot is internal; Dewey insists it is environmental. This is the fundamental friction point.

  Here is the plain truth: forcing Golding into a Deweyan straitjacket sanitizes the novel's horror. Dewey's vocabulary cannot fully account for the ecstatic violence that destroys the conch because Dewey believes intelligence can ultimately govern impulse. The novel proves otherwise. While Dewey explains the mechanics of the collapse, he fails to explain the energy behind it. For your novel, use Dewey to design the systems of memory and communication, but trust Golding to warn you about the fear that will seek to burn them down. The framework fits the mechanics but breaks against the human heart.
