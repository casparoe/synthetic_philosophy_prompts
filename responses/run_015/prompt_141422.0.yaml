      *   **Constraints:** 90 minutes, movable tables, index cards, no projector. Students read core material (no lecture/recap).
      *   **Goal:** Students "run into the mechanism themselves," names given afterwards.
      *   **Required Mechanics:**
          1.  Dispersed knowledge (local, changing, tacit).
          2.  Central Planning Board (CPB) of 3-4 students sets prices, sees only aggregate orders/returns (Lange-style trial & error).
          3.  Hidden quality choice (durable vs. shoddy) for firms; Board sees quantity only.
          4.  Shock event: A by-product becomes essential input mid-game (price vector missing row).
          5.  Durable machine: Built early, used later (path dependence).
      *   **Deliverables:** Rules, materials, roles, payoff scheme (no real money, quick scoring), timeline, CPB communication constraints.
      *   **Debrief:** Map to Mises (calculation problem), Hayek (knowledge problem), Lange (market socialism). Evaluate evidence vs. staging. Ensure students feel both sides.
      *   **Honesty/Limitations:** What the game *can't* do (entrepreneurship, time preference, scale, forced profit maximization).
      *   **Troubleshooting:** Predictable failures + rule fixes.
      *   **Contingency:** Which mechanic to cut if 20 mins behind.

  2.  **Design the Activity ("The Red Ledger"):**

      *   *Core Concept:* A production chain simulation.
      *   *Goods:* Need simple names. Let's use "Widgets" (Consumer), "Gizmos" (Intermediate), "Scrap" (By-product), "Machines" (Capital).
      *   *Roles:*
          *   CPB (3-4 students).
          *   Firms (Remaining 22-23 students). Let's make them specialized.
          *   Sectors: Raw Material, Machine Builders, Component Makers, Assemblers.
      *   *Dispersed Knowledge:* Each firm gets a "Cost Card" that changes slightly each round (e.g., "Your machine broke, cost +1" or "New technique, cost -1"). This info is private.
      *   *Quality:* Firms choose Quality A (High Cost, High Durability) or B (Low Cost, Low Durability). Board sees "10 Units," not "10 Units Quality A."
      *   *Shock:* "Scrap" is worthless initially. Round 3 card: "Scrap needed for New Widget."
      *   *Durability:* Machines built Round 1 used Round 3. If shoddy, they break.
      *   *Scoring:* Points based on final output value minus costs. CPB wins if total economy points exceed a threshold (aligns incentives slightly) or just based on stability (no huge shortages). Let's go with Economy Total Score to encourage CPB efficiency.
      *   *Communication:* Firms submit order forms. CPB returns price sheet. No talking between sectors.

  3.  **Drafting the Mechanics (Iterative Refinement):**

      *   *Constraint Check:* 26 students. 4 CPB = 22 Firms.
      *   *Sectors:*
          *   4 Steel (Raw)
          *   4 Machine Builders (Capital)
          *   8 Component Makers (Intermediate)
          *   6 Assemblers (Final)
      *   *Rounds:* Need enough for iteration but fit in 90 mins. 3 Rounds of trading + 1 Shock Round.
      *   *Scoring Speed:* CPB needs to tally quickly. Use pre-printed tally sheets.
      *   *The "Quality" Mechanic:* Firms mark "Q1" or "Q2" on a hidden slip. If Q2 (shoddy), production cost is lower, but if used as input later, it has a chance to fail (wasted input). *Correction:* To keep scoring fast, let's make Quality affect *future* utility. If I buy a shoddy machine, my output next round is halved. The Board sees "Machine Ordered," not "Shoddy Machine."
      *   *The "Shock":* A specific by-product (e.g., "Slag"). Round 1 & 2 price = 0. Round 3 Card: "Slag required for High-Grade Steel."
      *   *Dispersed Knowledge:* Each firm gets a "Condition Card" each round. "Strike: Cost +2", "Breakthrough: Cost -1". Only they know this. They react to prices based on this.

  4.  **Developing the Rules & Materials:**

      *   *Index Cards:* Cost conditions, Order forms, Price sheets.
      *   *Payoff:* Chocolate for winning sector/CPB if economy hits target.
      *   *CPB Constraints:* Can only announce Prices. Can see Aggregate Demand vs. Supply. Cannot ask "Why?"

  5.  **Timeline Construction (90 Mins):**

      *   0-10: Setup & Role Assignment.
      *   10-20: Round 1 (Prices set blind, Orders placed).
      *   20-30: CPB Tally & Round 2 Prices.
      *   30-40: Round 2 Trading.
      *   40-50: CPB Tally & Shock Card Reveal.
      *   50-65: Round 3 (Crisis).
      *   65-90: Debrief.
      *   *Critique:* This is tight. Tallying takes time. Need to simplify the math.
      *   *Revision:* Make the math additive. Price x Quantity.
      *   *Time Buffer:* Cut one trading round if needed. Let's plan for 3 Rounds total.

  6.  **Debrief Strategy:**

      *   *Mises:* Did the CPB struggle to value the "Slag" before the shock? Did they struggle to value the Machine vs. Labor trade-off?
      *   *Hayek:* Did the Condition Cards (local knowledge) cause supply shocks the CPB couldn't predict?
      *   *Lange:* Did prices eventually converge? Did the system *almost* work?
      *   *Limitations:* Students aren't real owners. No real risk.

  7.  **Troubleshooting & Contingencies:**

      *   *Risk:* CPB asks "What do you need?" -> Rule: Written comms only.
      *   *Risk:* Math slow -> Pre-printed grids.
      *   *Risk:* Quality ignored -> Tie quality to a mandatory "Inspection" die roll or simple rule: Shoddy machines break 50% of time.
      *   *Cut if behind:* The "Durable Machine" mechanic is complex. Cut to just intermediate goods if time crunches. *Wait, prompt requires durable machine.* Okay, cut the "Shock" complexity or reduce rounds. Actually, the prompt asks "which of my five mechanics to cut first." I need to identify the least essential one for the core lesson. The "Quality" choice is good for information asymmetry, but the "Durable Machine" is crucial for capital structure. The "Shock" is crucial for dynamic change. The "Dispersed Knowledge" is crucial for Hayek. The "CPB" is the core.
      *   *Decision:* If 20 mins behind, simplify the *Quality* mechanic. Make it binary but less impactful on scoring, or remove the "hidden" aspect and make it a cost choice. Actually, better to cut the *Durable Machine* lag. Make capital instantaneous. It hurts Mises but saves time. *Wait, prompt requires durable machine.* Okay, I must design it so it *can* be cut. I will designate the "Durable Machine" as the cuttable mechanic because it adds the most administrative overhead (tracking inventory across rounds).

  8.  **Refining the Output:**

      *   Ensure tone is professional, pedagogical, and direct.
      *   Check all 5 constraints are met in the design.
      *   Ensure the Debrief maps specifically to Mises, Hayek, Lange.
      *   Ensure the "Honesty" section covers the requested limitations.

  9.  **Self-Correction on Scoring:**
      *   CPB scoring in 2 mins? They need a simple formula. Total Value of Final Goods Produced.
      *   Firm scoring: Profit = Revenue - Cost.
      *   To make it fast: Firms calculate their own profit on the card, hand it in. CPB sums the totals.
      *   Wait, CPB needs to see shortages.
      *   *Revised Flow:* Firms submit "Bid/Ask" slips. CPB aggregates. CPB announces Price. Firms produce.
      *   *Simpler:* CPB sets Price. Firms submit Quantity Demanded/Supplied at that price. CPB calculates Excess Demand.
      *   *Quality:* Firm marks "H" or "L" on production slip. CPB ignores it. Next round, buyers of "L" inputs get a penalty card.

  10. **Final Polish:** Check against the "no projector" constraint. Everything must be handout/card based. Check student count (26). 4 CPB, 22 Firms.

      *(Self-Correction during drafting)*: The prompt asks for *explicit* statement of what Board can/cannot say. I need a "Gag Order" rule.
      *(Self-Correction on Shock)*: The shock needs to be a physical card drawn.
      *(Self-Correction on Durability)*: Machines built Round 1 function Round 3. This creates the path dependence.

      *Let's write the plan.*

      *   **Title:** The Red Ledger.
      *   **Roles:** 4 Planners, 22 Managers (4 Steel, 6 Machine, 6 Component, 6 Consumer).
      *   **Goods:** Steel, Machines (Durable), Components, Consumer Goods. Byproduct: Slag.
      *   **Rounds:** 1 (Setup), 2 (Production), 3 (Shock/Consumption).
      *   **Knowledge:** Private Cost Shocks.
      *   **Quality:** High/Low cost choice. Low quality machines break in Round 3.
      *   **Shock:** Slag needed for Steel in Round 3.

      *Wait, 90 minutes is very tight for 3 rounds with tallying.*
      *   Round 1: 15 mins.
      *   Round 2: 15 mins.
      *   Round 3: 15 mins.
