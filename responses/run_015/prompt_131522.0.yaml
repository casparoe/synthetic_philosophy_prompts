answer: |-
  This is a remarkably rich fact pattern. You have effectively constructed a jurisprudence of data governance that sits uneasily between the German *Rechtsstaat* concern for informational self-determination, the American focus on procedural due process and transparency, and a distinct civic-republican concern for power asymmetries.

  Here is the analysis of the Housing Conduct Register case based on the commission's track record, structured according to your four requests.

  ### 1. Reconstructing the Candidate Rules

  Based on the eight precedents provided, we can distill three established doctrinal rules and one emergent principle (yours).

  *   **Rule A: The Anti-Fusion Principle (Derived from P1, P4, P8).**
      The state may collect data for specific administrative ends, but it is prohibited from architecturally merging distinct spheres of life (health, tax, school, wellbeing) into a unified profile. The harm is not the existence of the record, but the *linkage* that allows a "whole person" to be computed from scattered parts.
      *   *Key Precedent:* P1 (National ID) establishes that linkage itself is the wrong, even if individual records are lawful. P8 (School Wellbeing) reinforces that preventive profiling of vulnerable groups using fused data is impermissible.

  *   **Rule B: The Power-Asymmetry Principle (Derived from P2, P3, P7).**
      Disclosure and scrutiny duties must track the capacity to exercise power over others or the public interest. Transparency flows upward (officials, corporations, political spenders), not downward (benefit recipients, general speakers, tenants).
      *   *Key Precedent:* P7 is the clearest expression: Civil servants (power) disclose assets; benefit recipients (vulnerable) do not. P2 (Company Owners) and P3 (Political Ads) confirm that anonymity is a default right unless significant power is wielded.

  *   **Rule C: The Proceduralist Principle (Derived from P5, P6).**
      Data processing is permissible if it is non-arbitrary. This requires three safeguards: (1) the logic/rules must be published, (2) automated decisions must be subject to human review by a named official, and (3) the subject must have a route to contest the entry.
      *   *Key Precedent:* P5 (Tax/Customs) explicitly licenses automated matching *conditional* on published rules and human review. P6 (Court Judgments) allows public data only if contestation is possible.

  *   **Rule D: Epistemic Reciprocity (Your Proposed Rule).**
      Legitimacy depends on the ratio of knowledge between the state and the citizen. A measure is suspect if it increases the state's (or its delegates') knowledge of the citizen without a corresponding increase in the citizen's knowledge of the state's operations. One-directional legibility is tyranny; mutual legibility is governance.
      *   *Fit:* This explains P5 (published matching rules) and P7 (officials disclose assets). It suggests that if the State builds a model of you, you must be allowed to see the model.

  ### 2. Application and Divergence

  Here is how these rules predict the outcome for the Housing Conduct Register, and where they fracture.

  **The Anti-Fusion Rule (Rule A)**
  *   **Prediction:** **Block.**
  *   **Reasoning:** This register links eviction orders (civil court), noise complaints (mediation board), and discrimination cases (equality body). This is structurally identical to P1 (linking health, tax, school).
  *   **The Divergence Point:** You asked if it matters that these are "official determinations" rather than "behavioral traces" (like the sleep logs in P8 or CCTV in P4). Under a strict reading of P1, it does *not* matter. P1 forbade linking records agencies "already lawfully held." The commission's worry was the *assembly of the picture*, not the fidelity of the pixels. However, a narrower reading might argue P1 was about *administrative* fusion for state efficiency, whereas this is *regulatory* fusion for private decision-making. If the commission distinguishes "state profiling" from "private reliance on public data," Rule A might not trigger.

  **The Power-Asymmetry Rule (Rule B)**
  *   **Prediction:** **Block.**
  *   **Reasoning:** This is the strongest argument against the register. P7 explicitly shields benefit recipients (vulnerable) from scrutiny applied to civil servants (powerful). Tenants are legally and economically analogous to benefit recipients in this jurisprudence; landlords are analogous to the regulated entities in P2. Subjecting the vulnerable to a scoring system to aid the powerful inverts the commission's established hierarchy of privacy.
  *   **The Poison Pill:** The inclusion of discrimination *complainants* is a catastrophic violation of Rule B. It penalizes the act of seeking rights, effectively scoring citizens for attempting to check power.

  **The Proceduralist Rule (Rule C)**
  *   **Prediction:** **Block (but closer call).**
  *   **Reasoning:** The register allows contestation (satisfies P6). However, it fails the P5 test: the scoring rule is *secret*. P5 mandated that matching rules be published. Furthermore, it is unclear if a "named official" reviews the Green/Amber/Red hit before the landlord sees it. If the landlord queries the API and gets an instant result, there is no human review.
  *   **Divergence:** If the commission amends the register to publish the algorithm and add human review, Rule C would permit it. Rule A and Rule B would still forbid it. This is where the rules come apart: Proceduralism can license volume if safeguards exist; Anti-Fusion and Power-Asymmetry are substantive bars.

  **The Epistemic Reciprocity Rule (Rule D)**
  *   **Prediction:** **Block.**
  *   **Reasoning:** The State (and the Landlord) gains legibility over the Tenant. The Tenant gains no legibility over the Scoring Rule (secret) or the Landlord's use of the data. The ratio of knowledge shifts heavily against the citizen.
  *   **Fit:** This rule captures the intuition behind the secret scoring rule better than Rule C. Rule C says "publish the rule to prevent arbitrariness." Rule D says "publish the rule because you are not allowed to know me better than I know you."

  ### 3. The Verdict and Closest Analog

  **Verdict:** **The Commission will strike down the Housing Conduct Register.**

  **Reasoning:**
  While the Proceduralist defects (secret algorithm) are sufficient to block the register, the commission will likely rest the decision on the **Power-Asymmetry** and **Anti-Fusion** grounds. The inclusion of discrimination complainants makes the register untenable under P7; it turns a rights-enforcement mechanism into a liability. Furthermore, the fusion of distinct legal spheres (eviction vs. noise vs. equality) recreates the "super-profile" forbidden in P1.

  **Closest Analog:** **Precedent 6 (Reliability Scores vs. Court Judgments)** bears the most weight, but with a critical distinction.
  *   *Why P6:* P6 allowed a public register of unsatisfied court judgments (official determinations) but blocked private reliability scores. This register attempts to be a public register of judgments but functions as a reliability score (Green/Amber/Red).
  *   *The Weight:* P6 establishes that *raw* official data is okay if contestable, but *derived* scores are suspect. The Housing Register creates a derived score.
  *   *The Distinguishing Factor:* However, P1 (National ID) is the heavier anchor. P6 allowed the court register because it was a single sphere (legal judgments). This register fuses *multiple* spheres (housing, nuisance, equality). Therefore, P1 is the primary veto, supported by P7 (Power-Asymmetry).

  **Why this reading?**
  The commission has consistently refused to let efficiency or safety justify the creation of a "governable subject." P8 (School Wellbeing) is the tie-breaker: even with parental consent, the state could not profile children's behavior to flag neglect. Here, the state is profiling tenants' behavior/history to flag risk. The "official determination" argument fails because the *discrimination complaint* entry is not a determination of guilt against the tenant (they might be the complainant), yet it negatively impacts their score. This makes it a behavioral trace of "involvement in litigation," which P8 suggests is off-limits for profiling.

  ### 4. Separating the Rules: The Minimal Variant

  The precedents underdetermine whether the fatal flaw is the **secrecy** (Proceduralism/Reciprocity), the **direction of scrutiny** (Power-Asymmetry), or the **linkage itself** (Anti-Fusion). To separate these, the commission needs a case that isolates the variables.

  **The Minimal Variant:**
  Propose a **"Landlord Conduct Register."**
  *   **Mechanics:** Tenants query a register before signing a lease. They receive a Green/Amber/Red rating of the *Landlord*.
  *   **Inputs:** Final court orders on housing code violations, upheld noise complaints against the property, and findings of discrimination by the equality body.
  *   **Safeguards:** The scoring rule is **published** (fixes Proceduralism/Reciprocity). The Landlord can contest entries (fixes Due Process).
  *   **Linkage:** It still fuses court, mediation, and equality records (keeps Anti-Fusion issue).

  **What this separates:**
  1.  **If the Commission Approves this Variant:**
      *   **Principle Committed:** **Power-Asymmetry (Rule B)** is the dominant norm. The commission accepts fusion (overruling P1's strictness) and accepts scoring (overruling P6's suspicion of scores) *provided* the scrutiny flows upward toward the powerful actor (Landlord) rather than downward toward the vulnerable (Tenant).
      *   **Implication:** Privacy is not a right against data linkage, but a right against *subordination* via data.

  2.  **If the Commission Blocks this Variant:**
      *   **Principle Committed:** **Anti-Fusion (Rule A)** is the dominant norm. Even when scrutiny flows upward, the state cannot fuse distinct administrative spheres (court, mediation, equality) to create a composite score.
      *   **Implication:** The "German-flavored" worry prevails. The architecture of the state's records must remain compartmentalized to prevent the emergence of a totalizing view, regardless of who is being scored.

  3.  **If the Commission Blocks only because the Algorithm is Secret (in the original case) but hints this Variant would pass:**
      *   **Principle Committed:** **Epistemic Reciprocity (Rule D) / Proceduralism (Rule C).** The problem was never the scoring or the linkage, but the opacity.
      *   **Implication:** The "American-flavored" instinct prevails. Openness cures the harm of surveillance.

  **Recommendation for your Seminar:**
  Argue that the **Power-Asymmetry Rule (P7)** is the commission's "hidden constitution." The Proceduralist safeguards (P5) are necessary conditions, but the Power-Asymmetry rule is the sufficient condition for legitimacy. The Housing Register fails because it weaponizes state data to enhance the bargaining power of landlords over tenants, specifically by penalizing the exercise of civil rights (discrimination complaints). The minimal variant (Landlord Register) would test whether the commission truly believes in *data minimization* (Anti-Fusion) or merely *justice in data distribution* (Power-Asymmetry). Given P1, I suspect they will block the Landlord Register too, confirming that the *fusion* itself is the primary constitutional injury.
