  2.  **Deconstruct the Precedents:**
      *   *P1 (National ID):* Refused linking health, tax, school. **Principle:** Anti-fusion/Linkage prohibition. Wrong is in the *connection*, not the data itself.
      *   *P2 (Beneficial Ownership):* Required public registers for company owners. **Principle:** Transparency for power holders (corporate).
      *   *P3 (Online Anonymity):* Struck down real-name for forums; upheld for political ads. **Principle:** Context matters. Political influence requires accountability; general speech does not.
      *   *P4 (CCTV):* Allowed live monitoring; banned retention >72h & facial recognition. **Principle:** Minimization/Retention limits. Surveillance okay if ephemeral and non-biometric.
      *   *P5 (Tax/Customs Matching):* Allowed automated matching for fraud, *conditional* on published rules + human review + named official. **Principle:** Procedural safeguards license data use.
      *   *P6 (Reliability Scores vs. Court Judgments):* Blocked private reliability scores; allowed public court judgments (with contestation). **Principle:** Public authority vs. Private profit; Due process (contestability).
      *   *P7 (Asset Disclosure):* Senior civil servants publish assets; benefit recipients do not. **Principle:** Power-Asymmetry. Those wielding state power/holding public trust are scrutinized more than those receiving aid.
      *   *P8 (School Wellbeing):* Blocked logging sleep/mood for neglect flagging, even with consent. **Principle:** Sensitive data/Chilling effect/Proportionality. Preventive profiling of vulnerable groups is suspect.

  3.  **Drafting Section 1: Reconstructing Candidate Rules:**
      *   *Rule 1: Anti-Fusion/Purpose Limitation.* Derived from P1 (National ID) and P8 (School). The state shouldn't create a "super-profile" from scattered lawful records.
