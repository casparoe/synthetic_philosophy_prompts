      *   **Task:** Analyze a hypothetical case (Statutory Housing Conduct Register) based on a provided set of precedents from an independent data-governance commission in a mid-sized parliamentary democracy.
      *   **Specific Requirements:**
          1.  Reconstruct candidate rules (Purpose-Limitation/Anti-Fusion, Power-Asymmetry, Proceduralist, and the user's proposed "Reciprocity/Symmetry" rule).
          2.  Apply these rules to the current case (predict outcomes, identify divergences, specifically regarding "official determinations" vs. "behavioral traces").
          3.  Predict the actual verdict with reasoning and identify the closest analog precedent.
