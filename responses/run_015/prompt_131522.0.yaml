      *   *Rule 4: Epistemic Reciprocity (User's Idea).* The ratio of State Knowledge vs. Citizen Knowledge. If State knows more about you than you know about the State (or the rules), it's bad. P5 supports this (published rules). P7 supports this (officials disclose assets).

  4.  **Drafting Section 2: Applying Rules to the Housing Register:**
      *   *The Case:* Landlord checks Tenant (Green/Amber/Red). Inputs: Evictions (Official), Noise (Mediation), Discrimination Complaints (Including *Complainants*). Tenant sees file, contests, but *not* scoring rule.
      *   *Anti-Fusion:* It links eviction, noise, and discrimination data. This looks like P1 (National ID). *Divergence:* These are "official determinations" (mostly) vs. raw behavioral traces. Does P1 care? P1 said "wrong lay in the linkage." P5 allowed linking tax/customs. So, is this administrative linkage (P5) or biographical fusion (P1)?
