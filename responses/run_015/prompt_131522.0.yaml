      *(Self-Correction during drafting)*: Wait, look closely at P5. P5 allowed automated matching *if* rules published and human review. The Housing Register has *secret* scoring rules. This is a fatal flaw under P5. Look at P1. P1 blocked linking tax/health/school. This register links eviction/noise/discrimination. That's a direct P1 violation. Look at P7. Benefit recipients (vulnerable) vs Officials (powerful). Tenants are closer to benefit recipients in power dynamics. Scoring them violates P7.
      *Decision:* The verdict is almost certainly a block. The reasoning should highlight the convergence of P1, P5, and P7 against the register.

      *Refining the "Official Determinations" point:* The user asks if it matters that these are official determinations (eviction orders) vs behavioral traces (CCTV). P1 blocked linking records agencies *already lawfully held*. It didn't distinguish between trace vs. determination. It distinguished between "scattered records" and "linked profile." So the nature of the data matters less than the architectural fusion.

      *Refining the Reciprocity Rule:* The user defines it as State vs. You. In this case, the State builds the tool. If the State hides the algorithm from the Tenant, but the Tenant is exposed to the State (and Landlord), reciprocity is broken.

