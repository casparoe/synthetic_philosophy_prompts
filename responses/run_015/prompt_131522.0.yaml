      *   *Proceduralist:* Tenant can contest (Good, like P6). But scoring rule is secret (Bad, unlike P5). Human review? Not specified, but "Green/Amber/Red" implies automation.
      *   *Reciprocity:* Landlord gets info; Tenant doesn't get the algorithm. State knows tenant's history; Tenant doesn't know how it's weighted. Asymmetrical.

  5.  **Drafting Section 3: Predicting the Verdict:**
      *   *Conflict:* Proceduralist says "Maybe okay if contestable." Anti-Fusion and Power-Asymmetry say "No."
      *   *Closest Analog:* P6 (Private Scores vs. Court Judgments) and P7 (Beneficiaries vs. Officials).
      *   *Reasoning:* The inclusion of *discrimination complainants* is a poison pill. It penalizes seeking rights. This violates the "Power-Asymmetry" principle (scrutinizing the vulnerable). Also, the secret scoring rule violates the "Proceduralist" requirement (P5 required published rules).
      *   *Verdict:* **Struck Down / Blocked.**
      *   *Why:* The secret algorithm violates P5. The inclusion of complainants violates the spirit of P7 (don't burden the vulnerable). The fusion of distinct legal spheres (housing, noise, equality) violates P1.
