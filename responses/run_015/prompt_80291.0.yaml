  I'm a second-year philosophy PhD student and I'm trying to lock down what my dissertation chapter on the Gödelian anti-mechanist argument is actually going to argue, and I'd really like help turning my half-baked hunch into a proper proposal (aiming for around 15,000 words, for a workshop on logic and philosophy of mind). The hunch: basically everyone treats the Lucas–Penrose argument as if its load-bearing premise is the "humans can see the truth of the Godel sentence" step, and that's where all the standard objections pile up. But I keep getting nagged by the thought that the argument actually breaks down earlier, at the identification step — before you can even form the Gödel sentence for the mind you have to specify *which* formal system the mind is, and you have to trust that that system is consistent, and I don't think the argument ever earns the right to make those assumptions on the mind's behalf. I want to argue that this identification / self-trust problem is the real reason the argument fails, and that it's a different and maybe more damaging problem than the usual "this only defeats one machine at a time" diagonalization objection. I keep coming back to it because my advisor hammers the "humans can see G" premise in every meeting and I'm pretty sure he's missing where the body actually is.

