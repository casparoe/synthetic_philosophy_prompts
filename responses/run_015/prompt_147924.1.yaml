prompt: |-
  I sat on a university hiring committee this spring, and the experience left me puzzled about something I can't quite formulate. In the same week, all of us were required to complete the campus bias-training module — which argued, at length, that unstructured holistic judgments of a person's character are noisy, biased, and barely predictive of anything — and we were also asked to write third-year review letters assessing colleagues on "collegiality," and to sign a form certifying that a candidate is of "good moral character." Since then I keep seeing the same shape elsewhere: bar admission character-and-fitness questionnaires, security-clearance adjudications, reference letters, the way one old act of dishonesty is treated as revelatory of a person while an equally old act of violence gets written off as youthful indiscretion, and the way nearly all of these institutions also maintain some kind of rehabilitation window after which past conduct stops counting. It looks like every institution that judges character also trains its own members not to.

  I've been reading about the situationist critique of virtue ethics — the argument, drawn from social psychology, that behavior is driven mostly by features of situations rather than by stable global traits (the obedience experiments, the seminary students who hurried past a stranger slumped in a doorway when they were late), so that attributing robust character traits to people is a systematic error. Taken at face value, it makes my committee's practice look incoherent: we are trained not to make exactly the judgment we are then asked to certify. But I don't trust that reaction, and I'd rather have the implicit theory reconstructed properly than a verdict on whether the critique is true.

  So: what view of character do these practices actually presuppose? Do they strictly require global-trait realism of the sort the situationist denies, or would something much thinner do the work — only that conduct in one situation predicts conduct in relevantly similar ones, or that a person's history is evidence about how they will respond to the specific situations a role puts them in? Which rival views do they quietly rule out: thoroughgoing situationism, a local-traits-only view, a view on which character is a normative ideal or a regulative fiction rather than a psychological posit? Are their parts even consistent with one another — can one institution coherently treat single acts as revelatory, discount old ones, and honor a rehabilitation window, when each of those seems to assume something different about how stable character is and how diagnostic any given act is? Where, if anywhere, is the practice philosophically underdetermined, such that several quite different theories of character would license it equally well? And the case I actually care about: suppose a licensing board took the critique seriously and replaced its global "good moral character" finding with something situation-indexed — referees rate candidates only on specified domains ("admits their own mistakes when they'd gain from hiding them," "reliable under deadline pressure," "behaves similarly toward people with less power"), are explicitly told not to aggregate those ratings into any overall verdict, and must ignore conduct more than seven years old. Would that be a practice a situationist could endorse, or has the trait attribution merely moved one level down, into the domains? What would have to change institutionally for the reform to be real rather than cosmetic, and what would we give up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a contradiction in institutional practices (hiring committees, bar admissions, security clearances, etc.). They require bias training that says "holistic character judgments are biased/unreliable" (situationist-adjacent) while simultaneously requiring judgments of "collegiality," "good moral character," etc. (trait-adjacent).
      *   **Theoretical Framework:** The user references the *situationist critique of virtue ethics* (Doris, Harman, etc.), which argues behavior is situational, not trait-based.
      *   **The Task:** Don't just verdict on whether situationism is *true*. Instead, reconstruct the *implicit theory of character* presupposed by these institutional practices.
      *   **Specific Questions to Address:**
          1.  Do these practices require global-trait realism, or would a thinner view (local traits, historical evidence) suffice?
          2.  Which rival views do they rule out (thoroughgoing situationism, local-traits-only, normative ideal/fiction)?
          3.  Are the practices internally consistent (single acts as revelatory vs. rehabilitation windows vs. stability)?
          4.  Where is the practice philosophically underdetermined (multiple theories license the same practice)?
          5.  **The Case Study:** If a licensing board switched to situation-indexed ratings (specific domains, no aggregation, 7-year ignore rule), could a situationist endorse this? Or is trait attribution just moved down a level? What institutional changes would make it real vs. cosmetic, and what would be lost?

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The Tension:* The user identifies a "performative contradiction." Training says "don't trust intuition about character," practice says "judge character."
      *   *Situationism:* Claims global traits (Honesty, Courage) don't exist or don't predict behavior across diverse situations.
      *   *Institutional Practice:* Seems to rely on *predictive validity* of past behavior for future roles.
      *   *Rehabilitation/Windows:* Implies character *can* change, or that past data loses predictive power over time. This contradicts a rigid "once a liar, always a liar" global trait view but fits a Bayesian updating view.
      *   *Single Acts:* Treating one act as revelatory (e.g., dishonesty on a form) contradicts situationism (which says one act is noisy) but fits a "signal detection" model where certain acts are high-cost signals.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. Validate that this is a genuine philosophical tension in administrative ethics. State the thesis: Institutions don't operate on *metaphysical* theories of character but on *actuarial* and *fiduciary* models. They treat character as a risk-management variable, not a psychological reality.

      *   **1. The Implicit Theory: Actuarial Character, Not Aristotelian Virtue.**
          *   Institutions aren't asking "Is this person Virtuous?" They are asking "What is the liability risk?"
          *   This doesn't require *global* traits. It requires *local* stability in *relevant* contexts.
          *   It rules out *thoroughgoing situationism* (which says prediction is impossible) but doesn't require *global-trait realism*. It fits a *local trait* or *behavioral frequency* model.
          *   *Key Distinction:* Ontology (what character *is*) vs. Epistemology (how we judge it for utility). Institutions care about the latter.

      *   **2. Internal Consistency (The "Rehabilitation Window" Problem).**
          *   User asks: Is it consistent to treat single acts as revelatory but also have rehabilitation windows?
          *   *Resolution:* Yes, under a Bayesian model. A single act of dishonesty on a form is a *high-signal* event (low base rate, high cost). Old acts lose predictive power (data decay).
          *   This isn't inconsistent; it's statistical. It assumes character is *stable but mutable* and *context-sensitive*.
          *   It rules out: Essentialism (character is fixed) and Radical Situationism (character is non-existent/unpredictable).

      *   **3. Philosophical Underdetermination.**
          *   Where can multiple theories fit?
          *   *Reference Letters:* A virtue ethicist sees this as testimony to excellence. A situationist sees it as evidence of past situational support. An actuary sees it as risk data. All can sign the letter.
          *   *The "Good Moral Character" Form:* This is the most underdetermined. It functions as a *legal performative*, not a psychological description. It's a threshold, not a gradient.

      *   **4. The Case Study: Situation-Indexed Ratings.**
          *   *Scenario:* Specific domains, no aggregation, 7-year rule.
          *   *Situationist Endorsement:* A sophisticated situationist (like John Doris) might accept *local* traits ("honesty-in-tax-filing") but reject *global* aggregation ("good moral character").
          *   *The Trap:* If you rate "reliable under deadline," are you attributing a trait? Yes, a *local* one. Situationists admit local consistency exists.
          *   *Real vs. Cosmetic Change:* To be real, the institution must stop using these ratings to make *binary* decisions (Hire/No Hire) based on a threshold. If you aggregate the local ratings to make a global decision, you've re-introduced the global judgment through the back door.
          *   *What is lost?* Efficiency and narrative. We lose the "story" of the candidate. We gain granularity but lose decisiveness. We also lose the *normative* force (we aren't judging *worth*, just *risk*).

      *   **5. The Function of the Contradiction (The "Bias Training" vs. "Character Judgment").**
          *   Why the disconnect?
          *   Bias training is about *fairness* (process). Character judgment is about *liability* (outcome).
          *   The institution wants to minimize legal risk (bias suits) AND operational risk (bad hires). These goals pull in opposite directions regarding character assessment.
          *   The "Good Moral Character" clause is often a *catch-all* for things not captured by metrics. It's a discretionary safety valve.

      *   **6. Conclusion:**
          *   Summarize: Institutions are pragmatic functionalists, not moral philosophers.
          *   The reform proposed is better but still risks "local trait reification."
          *   The real cost of taking situationism seriously is the loss of *moral accountability* narratives. We want to blame/praise, not just manage risk.

  4.  **Refining the Tone:**
      *   The user is sophisticated (philosophically literate, academic context). The tone should be analytical, precise, and respectful of the nuance. Avoid oversimplifying situationism.
      *   Ensure I answer the specific sub-questions (rival views ruled out, underdetermination, the specific reform case).

  5.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address the "single act of dishonesty vs. violence" point?
      *   *Correction:* Need to explicitly mention *signal strength*. Dishonesty on a form is directly relevant to the institution's truth-tracking. Violence might be seen as situational/emotional. The institution cares more about fraud than fury sometimes.
      *   *Check:* Did I address the "bias training" contradiction?
      *   *Correction:* Frame bias training as procedural protection vs. character judgment as substantive prediction.
      *   *Check:* Is the distinction between "Global Trait" and "Local Trait" clear?
      *   *Correction:* Use the Doris distinction. Global = across all situations. Local = within specific situational clusters. Institutions mostly need Local.

  6.  **Final Polish:** Organize with clear headings. Ensure the "Case Study" gets dedicated space. (Proceed to generate output based on this structure.)

      *   *Key Insight to highlight:* The "Good Moral Character" judgment is often a *fiduciary* judgment disguised as a *moral* one. It's about trustworthiness relative to the role, not sainthood.

  7.  **Final Review against constraints:** The user asked for reconstruction of the implicit theory, not a verdict on situationism. Keep the focus on *institutional logic*.

      *(Self-Correction on the "Rehabilitation Window" point)*: Make sure to explain that rehabilitation windows imply character is *dynamic*, which actually aligns *better* with situationism (situations change, so behavior changes) than with hard Aristotelianism (character is fixed by habituation). This is a crucial nuance.

      *(Self-Correction on the "Case Study")*: If referees are told *not* to aggregate, but the board aggregates the scores to make a hire/no-hire decision, the situationist critique still applies at the board level. The reform must prevent *institutional* aggregation too.

      *Ready to write.*
answer: |-
  This is a precise and deeply unsettling observation. You have identified a performative contradiction at the heart of modern bureaucratic ethics: institutions simultaneously propagate an *epistemology of skepticism* regarding character (via bias training) and an *ontology of realism* regarding character (via hiring and licensing).

  To reconstruct the implicit theory of character presupposed by these practices, we must stop looking for Aristotelian or Kantian moral philosophy and start looking for **actuarial risk management**. The institution is not asking, "Is this person Good?" It is asking, "What is the liability probability associated with this person?"

  Here is a reconstruction of the implicit theory, the inconsistencies it tolerates, and an analysis of your proposed reform.

  ### 1. The Implicit Theory: Actuarial Localism

  Do these practices require global-trait realism? **No.** They do not require the belief that "Honesty" is a robust, cross-situational psychological entity that exists independently of context.

  What they require is **Behavioral Frequency in Relevant Clusters.**
  The institution operates on a thin, functionalist view of character: *Past behavior in context $C_1$ is probabilistic evidence for future behavior in context $C_2$, provided $C_1$ and $C_2$ share salient structural features.*

  *   **Global Traits:** Not required. The committee does not need to believe you are honest with your spouse to believe you will be honest with grant funds.
  *   **Local Traits:** Required. They must believe that "honesty-in-financial-reporting" is a stable enough local disposition to warrant prediction.
  *   **Rival Views Ruled Out:**
      *   **Thoroughgoing Situationism:** This is ruled out. If behavior were *entirely* situational with no cross-temporal stability even within similar contexts, past record reviews would be useless. The practice assumes *some* stability.
      *   **Essentialism:** This is also quietly ruled out by the "rehabilitation window." If character were a fixed essence (once a thief, always a thief), expiration dates on misconduct would be incoherent.
      *   **Normative Idealism:** The view that "character" is purely a regulative fiction (something we pretend exists to encourage better behavior) is partially compatible, but the *consequences* of the judgment (denial of tenure, bar admission) suggest the institution treats the judgment as descriptive of a real risk, not just normative encouragement.

  **The Implicit Theory is Bayesian:** The "character judgment" is a posterior probability update based on prior data (references, past conduct), adjusted for data decay (rehabilitation windows) and signal strength (the nature of the act).

  ### 2. Internal Consistency: The Signal vs. The Noise

  You ask if the practices are consistent: treating single acts as revelatory while also honoring rehabilitation windows.

  Under the **Actuarial Localist** model, this is consistent.
  *   **Single Acts as Revelatory:** Certain acts are treated as "high-signal" events. Lying on a security clearance form is not treated as a mere behavioral slip; it is treated as a direct test of the specific trait required for the role (truth-telling to the state). It has high diagnostic value because the situation (filling out the form) is structurally identical to the future situation (reporting compliance).
  *   **Violence vs. Dishonesty:** You noted violence is often written off as "youthful indiscretion" while dishonesty is not. In an administrative context, violence is often coded as *emotional dysregulation* (situational, potentially treatable, potentially episodic), whereas administrative dishonesty is coded as *integrity failure* (directly corrosive to the institution's epistemic function). The institution cares more about fraud than fury because fraud undermines the bureaucracy's information processing; fury is a manageable HR risk.
  *   **Rehabilitation Windows:** This accounts for *data decay*. In actuarial science, old data points lose predictive power as the underlying variables (the person's brain, their social environment, their incentives) change. This is consistent with a situationist insight: if you change the situation (the person's job, status, age), the behavior may change.

  **Where the Practice is Incoherent:**
  The incoherence lies in the **Bias Training vs. Certification** conflict.
  *   **Bias Training:** Teaches that holistic intuition is noisy and biased by race/gender/status. (Epistemic Humility).
  *   **Certification:** Requires a binary signature on "Good Moral Character." (Epistemic Certainty).
  *   **The Conflict:** You cannot train people to distrust their holistic integration of data and then demand they holistically integrate that data to sign a legal form. The institution wants the *legal cover* of the character judgment without accepting the *epistemic responsibility* for how that judgment is formed.

  ### 3. Philosophical Underdetermination

  Where is the practice underdetermined? Where could multiple theories license the same procedure?

  **Reference Letters** are the prime example.
  *   **Virtue Ethicist:** Writes to testify to the candidate's excellence of soul.
  *   **Situationist:** Writes to testify that the candidate thrived in *supportive situations* similar to the one they are applying for.
  *   **Actuary:** Writes to provide data points on risk.
  *   **Result:** All three sign the same letter. The language of "collegiality" is sufficiently vague to be a Rorschach test for the writer's moral ontology.

  **The "Good Moral Character" Form** is also underdetermined, but differently. It functions as a **Legal Performative**.
  *   It does not matter what theory of character the signer holds. The act of signing creates a liability. If the candidate later commits fraud, the signer can be asked, "What did you know?"
  *   Therefore, the form licenses *any* theory of character that allows the signer to sleep at night. It is a ritual of risk-transfer, not a metaphysical claim.

  ### 4. The Case Study: Situation-Indexed Ratings

  Suppose the licensing board adopts your reform:
  1.  Referees rate specific domains ("admits mistakes," "reliable under pressure").
  2.  No aggregation into an overall verdict by the referee.
  3.  Conduct >7 years old ignored.

  **Could a Situationist Endorse This?**
  A sophisticated situationist (like John Doris or Gilbert Harman) would find this **significantly improved, but still problematic.**

  *   **The Gain:** This moves from *Global Traits* ("Honest") to *Local Traits* ("Honest-about-mistakes"). Situationists concede that local consistency exists. People are not randomly variable; they are predictably variable within specific situational clusters. Rating specific domains respects this.
  *   **The Trap (Trait Attribution at a Lower Level):** Even "admits mistakes when they'd gain from hiding them" attributes a disposition. A hardline situationist might argue this is still a reification. Perhaps the candidate admits mistakes only when the power differential is low, or when the audience is sympathetic. Unless the domains are hyper-specific ("admits mistakes in Tuesday morning meetings"), trait attribution remains.
  *   **The Aggregation Problem:** You specify the *referees* cannot aggregate. But who makes the hiring decision? If the Board takes the ten domain scores and averages them to make a binary "License/No License" decision, **the institution has re-introduced the global judgment.** It has simply outsourced the trait attribution to the algorithm/committee rather than the referee.

  **What Would Have to Change for the Reform to Be Real?**
  To be truly situationist-compatible, the institution would need to abandon **Threshold Decisions** based on character.
  1.  **No Binary Verdicts:** Instead of "Good Moral Character: Yes/No," the output must be a risk profile. "High reliability in deadlines, low reliability in conflict."
  2.  **Situational Scaffolding:** Instead of filtering out people with "bad" ratings, the institution must commit to changing the *situation* to accommodate the profile. If a lawyer is rated "unreliable under deadline pressure," the situationist solution is not to ban them; it is to structure their practice so they are not under deadline pressure.
  3.  **Abandoning "Character" Language:** The forms should not ask about the *person*; they should ask about the *interaction*. Not "Is he reliable?" but "Did he miss deadlines in your supervision?"

  **What Would We Give Up?**
  If we took this seriously, we would lose **Moral Accountability.**
  *   **Narrative Coherence:** We use "character" to tell stories about people. It allows us to say, "He failed because he is weak," rather than "He failed because the incentive structure overwhelmed his local coping mechanisms."
  *   **Efficiency:** Global traits are cognitive shortcuts. They allow us to process thousands of applicants quickly. Granular, situation-indexed data is computationally expensive for human committees.
  *   **The Right to Exclude:** Currently, "Bad Character" allows an institution to exclude someone for *who they are*. A situationist model only allows exclusion for *mismatched fit*. This limits the institution's power to police moral boundaries unrelated to specific job functions.

  ### 5. Conclusion: The Function of the Contradiction

  Why does the university require bias training (situationist-adjacent) and character certification (trait-realist)?

  Because the institution has two different masters.
  1.  **The Legal/HR Master:** Wants to avoid discrimination suits. Bias training is the shield. It says, "We know our intuitions are flawed, so we trained you."
  2.  **The Fiduciary Master:** Wants to avoid liability and reputational damage. Character certification is the shield. It says, "We vetted this person's soul, so if they embezzle, it's not our negligence."

  The contradiction is not a bug; it is a feature of risk distribution. The bias training protects the institution from the *candidate* (claims of unfairness). The character certification protects the institution from the *public* (claims of negligence).

  Your proposed reform would satisfy the philosophical critique but might fail the institutional need. The institution does not want a nuanced risk profile; it wants a **moral indemnity**. It wants to be able to say, "We certified him as Good," so that when he turns out to be Bad, the institution is absolved. A situationist framework denies the possibility of that absolution, because it admits that no amount of vetting can guarantee behavior in a novel situation.

  To adopt the situationist view fully, the institution would have to admit: **We cannot know who they are. We can only build better cages.** And most institutions are unwilling to admit that their hiring process is cage-building rather than truth-seeking.
