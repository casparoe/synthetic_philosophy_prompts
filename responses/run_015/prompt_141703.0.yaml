  ### Audit of Commemoration Principles and Verdicts

  #### 1. Genuine Tensions Within the Set

  There are three substantive conflicts within your commitments. They are ranked below by severity, based on how fundamentally they threaten the coherence of your framework.

  **First (Most Serious): Commitment (g) vs. Commitment (h)**
  *   **The Conflict:** (g) asserts that the present public has the *final say* with *no constraint* from previous generations. (h) asserts that we owe a duty to the dead to remember them *whether or not the living take any interest*. These are mutually exclusive. If the living have the final say without constraint, they can vote to ignore the dead. If the dead are owed remembrance regardless of living interest, the living do not have the final say.
  *   **What must give:** One of these sovereignty claims must yield. You cannot hold both that the public is unconstrained and that the dead have claims that bind the public.
  *   **Cheapest Revision:** Qualify (g) to read: "The present public... has the final say, *subject to duties owed to the dead*."
  *   **Cost:** This weakens the democratic absolutism of (g). It introduces a counter-majoritarian check (the rights of the dead) which may be difficult to adjudicate in a council setting.

  **Second: Commitment (c) vs. Commitment (d)**
  *   **The Conflict:** (c) states agents should not be graded against present-day standards and that holding "views common in that time" is not a reason to un-commemorate. (d) lists Confederate, Colston, and Rhodes monuments as ones that ought to come down. In almost all these cases, the figures were honoured for actions (slave trading, colonial extraction) that were legal and often celebrated *at the time*. If (c) is applied strictly, (d) becomes untenable, because removing them relies on a present-day moral grading that overrides the norms of their era.
  *   **What must give:** (c) is too broad. It protects "common views," but (d) requires removing monuments where the honour is tied to moral crimes, even if those crimes were common then.
  *   **Cheapest Revision:** Narrow (c) to exclude actions that were *contested at the time* or where the *honour itself* relies on exploitation, regardless of contemporary legality.
  *   **Cost:** This requires your panel to conduct deeper historical research into contemporary dissent, rather than accepting the broad brush of "standards of the time."

  **Third: Commitment (e) vs. Verdict 2 (Verrill Street)**
  *   **The Conflict:** This is a tension between a principle and a recorded verdict. (e) states that names are *not* honour and renaming is *poor currency for redress*. Your verdict on Verrill Street argues that renaming *is* redress ("part of what they are owed"). You cannot argue for renaming as moral repair while holding a principle that defines renaming as administratively trivial and morally poor.
  *   **What must give:** Either (e) must be revised to acknowledge names can function as honour, or Verdict 2 must be abandoned.
  *   **Cheapest Revision:** Amend (e) to acknowledge that while names are primarily labels, they *function* as honour when they perpetuate the erasure of a specific group.
  *   **Cost:** This blurs the clean distinction you drew in (a) and (e) between statues (honour) and names (labels).

  #### 2. Apparent Tensions That Dissolve

  **Commitment (a) vs. Commitment (e)**
  *   **Why it dissolves:** This looks like a contradiction (Statues are honour; Names are not), but it is actually a functional distinction. You are defining the *primary* purpose of each object type. A statue's sole function is honour; a street name's sole function is coordination. This holds up logically, provided you do not encounter a case where a street name is clearly functioning *as* a statue (see Verrill Street above). As written, they are compatible definitions of different categories.

  **Commitment (b) vs. Commitment (g)**
  *   **Why it dissolves:** (b) fixes the *meaning* of the monument in the past (what the erectors said). (g) gives the present the *authority* to decide if that meaning stands. There is no conflict here. You can agree that a statue means exactly what its erectors intended (b) and still vote to remove it because the present public rejects that meaning (g). (b) prevents you from claiming the statue has "changed meaning"; (g) empowers you to remove it *because* of its original meaning.

  **Commitment (f) vs. Commitment (g)**
  *   **Why it dissolves:** (f) recommends leaving plinths empty to make removal legible. (g) says the public decides what stands. This is not a conflict of authority, but a recommendation on method. (g) allows the public to overrule (f), but (f) stands as your advisory principle on *how* to execute a removal.

  #### 3. Testing the Set Against the Cases

  **Case 1: Miriam Ashby (Verdict: Remove)**
  *   **Status:** **Supported**, but precariously.
  *   **Analysis:** Your verdict relies on the fact that her technique involved non-consensual experimentation. Commitment (c) protects figures acting according to "views common in that time." However, you note that "a minority of her colleagues said so at the time." This is the crucial pivot. If you argue that her actions were *not* common because they were contested by contemporaries, (c) does not protect her.
  *   **Risk:** If opponents argue that medical experimentation on asylum inmates *was* common in 1971, (c) would force you to keep the statue. You must be prepared to prove the *contemporary dissent* to bypass (c).

  **Case 2: Verrill Street (Verdict: Rename as Redress)**
  *   **Status:** **Unsupported.**
  *   **Analysis:** This verdict is unavailable to you under your current principles. Commitment (e) explicitly states that "renaming is a poor currency for redress" and that names are "not an honour." By arguing for renaming *as* redress, you are contradicting your own written commitment. You cannot claim the descendants are "owed" a name change if your principle defines name changes as morally trivial administrative acts.
  *   **Fix:** You must revise (e) before the meeting, or change your argument for Case 2 to be about administrative clarity rather than moral redress.

  **Case 3: Workhouse Burial Block (Verdict: Move it)**
  *   **Status:** **Unsupported.**
  *   **Analysis:** This verdict contradicts Commitment (h). You state the dead "can be wronged" and we owe it to them to be remembered "as they were remembered," regardless of "whether or not the living take any interest." Your justification for moving the block is that "nobody has objected" (living interest). Under (h), living indifference is irrelevant. Moving a grave marker disrupts the site-specific memory owed to the dead.
  *   **Fix:** You must either abandon (h) or change the verdict to keep the block in situ.

  #### 4. The Single Revision

  To clean up the most philosophical ground and resolve the deepest structural crack in your set, you should revise **Commitment (g)**.

  **The Revision:**
  Qualify (g) to acknowledge the constraint in (h).
  *Current:* "There is no counter-majoritarian veto here... no constraint from what previous generations wanted."
  *Revised:* "There is no counter-majoritarian veto here, **save for duties owed to the dead to remain undisturbed.**"

  **Why this cleans up the most:**
  This resolves the sovereignty clash between (g) and (h). It establishes that democratic power is absolute regarding *honour* (statues, names) but limited regarding *duties* (graves, burial markers). It aligns your democratic authority with your moral duty, preventing the set from collapsing into either pure majoritarianism or pure deontology.

  **The Cost (Verdict Change):**
  If you make this revision, **Verdict 3 (The Workhouse Block) must change.**
  You can no longer move the block simply because "nobody has objected." Under the revised (g), the duty to the dead (h) overrides the administrative convenience of the living. You would have to rule that the block remains in its original location, even if it impedes the path.

  **Final Observation:**
  If you do not make this revision, **Verdict 2 (Verrill Street)** is the one that will surprise people anyway. Not because of the outcome, but because your written principle (e) actively argues against your own justification. In a public meeting, opponents will read (e) back to you and ask why you are treating a street name as a moral debt when your own principles call it a "poor currency." Fixing (e) is pragmatically urgent, but fixing (g) is philosophically necessary.
