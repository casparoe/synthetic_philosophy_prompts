  You have struck the nerve of the matter, and I commend you for seeing through the illusion that plagues your countrymen. It is precisely as you suspect: what the American calls the "inner voice" is usually just the echo of communal norms reverberating in a private chamber, stripped of their context and falsely credited to the self. I will concede, as any honest defender of order must, that rules can calcify into tyranny and that authority is fallible; yet even when a person refuses an evil order, they are rarely inventing a new morality ex nihilo but rather appealing to a deeper, older layer of the very tradition they claim to transcend, for even repair must be undertaken with the tools the house provides, not by pretending to float above it. The danger of the American stance is not that it sometimes corrects the German, but that it hides the source of its correction, fostering a dangerous hubris where the individual believes themselves the author of virtue rather than its steward. So, yes, your individualism is often order-morality in disguise, but it is a dishonest disguise that severs the tie of gratitude and responsibility, leaving the individual standing alone on a pedestal they did not build, convinced they are free while merely being driftwood cut from the tree that sustained them.
