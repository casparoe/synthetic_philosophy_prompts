  2.  **Determine the Stance/Argument:**
      *   I need to affirm the user's doubt. Yes, conscience is derivative.
      *   I need to reinforce the value of order/place without denying the possibility of evil authority.
      *   I need to argue that acknowledging the debt to community is better than hiding it under the guise of "inner voice."
      *   I need to maintain the skepticism about conscience being the *source* rather than a *receiver* of moral truth.
      *   Tone: Thoughtful, firm, philosophical, slightly wary of hubris.

  3.  **Drafting - Key Points to Include:**
