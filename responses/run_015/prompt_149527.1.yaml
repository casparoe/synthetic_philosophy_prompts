answer: |-
  Here is a complete session plan designed for 90 minutes, 15 participants, and minimal materials. It prioritizes the *experience* of the paradox over the theory, saving the theory for the debrief.

  ### **Materials List**
  *   **Whiteboard & Markers:** 3 colors (Black, Red, Blue).
  *   **Index Cards:** 100 count (3x5 size).
  *   **Sticky Notes:** 1 pad (for options).
  *   **Pre-Printed "Profile Decks":** 3 sets of 5 cards each (see *Prep Work* below).
  *   **Timer:** Visible to you (phone is fine).
  *   **Prize:** A bag of nice coffee beans or a $20 book voucher (for the game winner).

  ### **Prep Work (Do this before they arrive)**
  1.  **The "Cycle" Deck:** Create 3 sets of ballots (5 cards per set) that guarantee a Condorcet Cycle.
      *   *Set 1 (5 cards):* A > B > C
      *   *Set 2 (5 cards):* B > C > A
      *   *Set 3 (5 cards):* C > A > B
      *   *Result:* A beats B (10 to 5), B beats C (10 to 5), C beats A (10 to 5).
  2.  **The "Spoiler" Deck (Backup):** Create 15 ballots where Option A wins Plurality, but if Option D is added, B wins.
      *   *6 cards:* A > B > C > D
      *   *5 cards:* B > C > D > A
      *   *4 cards:* C > D > B > A
      *   *Plurality Count:* A (6), B (5), C (4). **A Wins.**
      *   *If D is added (and C voters prefer D over A):* Adjust the 4 C-cards to D > C > B > A. Now D (4) + B (5) > A (6). *Wait, simpler:* Just ensure the vote splits.
      *   *Simpler Backup:* 5 for A, 4 for B, 3 for C. Add D (clone of B). 5 for A, 2 for B, 3 for D, 3 for C. A still wins.
      *   *Best Backup:* 5 for A, 4 for B, 3 for C. Add D (clone of A). 3 for A, 4 for B, 3 for D, 3 for C. **B Wins.**
  3.  **The "Black Box" Secret:** You will act as a **Dictator Machine**. You will always output the top choice of the *third* ballot handed to you.

  ---

  ### **Minute-by-Minute Timeline**

  | Time | Activity | Goal | Cut Point |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **The Real Decision** | Establish stakes & collect real ballots. | If discussion drags, cut to vote at 08:00. |
  | **10-25** | **The Spoiler Reveal** | Show IIA violation (Winner flips due to loser). | **Hard Stop at 25.** If live vote didn't show it, use Backup Deck. |
  | **25-40** | **The Cycle Demo** | Show Group Intransitivity (Rock-Paper-Scissors). | **Hard Stop at 40.** Use Pre-Printed Decks. |
  | **40-55** | **The Black Box** | Reverse-engineer a hidden rule (Dictatorship). | **Cuttable.** If behind, skip to Design Rule. |
  | **55-75** | **Design-a-Rule** | Teams write rules; others try to break them. | End game at 75:00 sharp. |
  | **75-90** | **The Debrief** | Map frustrations to Arrow's 4 Conditions. | Do not run over. |

  ---

  ### **Facilitator Script (What You Are Allowed to Say)**
  *Constraint: Do not explain Arrow's Theorem. Do not use words like "Impossibility," "Transitivity," or "Independence of Irrelevant Alternatives" until the Debrief.*

  **00:00 - Intro & Stakes**
  > "Welcome. We have $50 leftover in the budget, and we need to decide how to spend it. We also need to pick food for next month. We are going to vote on these today, and I will execute the winner.
  >
  > "Here are the options for the budget. [Write 3 options on board: **A: New Chairs**, **B: New Books**, **C: Pizza Party**].
  >
  > "Take an index card. Rank these three options 1, 2, 3. 1 is your favorite. Do not put your name on the card. Hand them to me."

  **10:00 - The Spoiler Reveal**
  > "Okay, counting first choices... [Count visibly]. The winner is **[Winner]**.
  >
  > "Wait. I just realized we left something off the board. There was a fourth option proposed last month that I forgot to list. [Write **D: Magazine Subscription** on the board].
  >
  > "Nobody ranked D first, so intuitively, it shouldn't change who wins between A, B, and C. But our rule says we have to account for it. I'm going to re-count these same ballots, treating D as if it was there all along.
  >
  > "[Re-count based on the logic that D splits a vote or changes the pairwise count].
  >
  > "The winner is now **[New Winner]**.
  >
  > "Pause. Look at your cards. Did anyone change their mind about A vs B? No. Did the group preference between A and B change? Yes. Discuss at your tables for 2 minutes: How did a losing option change the winner?"

  **25:00 - The Cycle Demo**
  > "That was about the *method* breaking. Now we're going to check if the *group* is making sense.
  >
  > "I have three sets of pre-filled ballots here. [Hold up Profile Decks]. Every person in these profiles has a logical, consistent ranking. No circles.
  >
  > "I'm going to pair them up. Group 1, does the group prefer A over B? [Count hands based on decks]. Yes.
  > "Does the group prefer B over C? Yes.
  > "So, logically, the group should prefer A over C. Let's check.
  >
  > "[Count A vs C]. Wait. The group prefers C over A.
  >
  > "So the group says: A is better than B. B is better than C. But C is better than A.
  >
  > "Discuss for 2 minutes: Is the group irrational? Or is the math wrong?"

  **40:00 - The Black Box (The Oracle)**
  > "I am now a Decision Machine. I have a secret rule. You can feed me ballots, and I will give you the group ranking.
  >
  > "You have **3 Queries** total for the whole room. You must agree on the ballots before you hand them to me. Your goal: Figure out my rule.
  >
  > "[Facilitator Note: Enforce the Dictator Rule. If they hand you 5 ballots, look only at Ballot #3. Announce the winner based on that. If they ask 'What if we change Ballot 3?', the winner changes. If they change Ballot 1, the winner stays same.]"

  **55:00 - Design-a-Rule**
  > "Break into 3 teams. Your job: Write a voting rule on an index card. It must be in plain English.
  >
  > "Examples: 'Count first places.' 'Eliminate the loser and re-count.' 'Pick the option that beats everyone head-to-head.'
  >
  > "Once written, swap cards with another team. Their job is to **break your rule**. They must write a set of ballots that makes your rule do something absurd (like elect the option everyone ranked last, or flip the winner when a loser drops out).
  >
  > "You have 10 minutes to write, 10 minutes to break."

  **75:00 - The Debrief**
  > (See Debrief Guide below).

  ---

  ### **Debrief Guide (Mapping Moments to Conditions)**
  *Do not lecture. Ask questions to draw these out.*

  **1. The Spoiler Moment (Independence of Irrelevant Alternatives)**
  *   **Ask:** "When we added Option D, did anyone change their ranking of A vs B?" (No.) "Did the group winner change?" (Yes.)
  *   **Say:** "This is the **Spoiler Effect**. A voting rule satisfies *Independence of Irrelevant Alternatives* if losing options don't change the winner. Most rules fail this. You have to choose: Do you want to prevent spoilers, or do you want to allow more choices?"

  **2. The Cycle Moment (Transitivity / Consistency)**
  *   **Ask:** "In the cycle demo, was any individual voter irrational?" (No.) "Was the group irrational?" (Yes.)
  *   **Say:** "This is **Condorcet's Paradox**. Even if every individual is logical, the *group* might not be. There is no 'Group Will' waiting to be found. There is only the output of the machine."

  **3. The Black Box / Design Moment (Non-Dictatorship & Domain)**
  *   **Ask:** "Who figured out the Black Box rule?" (It was a Dictator.) "In the Design game, did any team make a rule that couldn't be broken?"
  *   **Say:** "If you made a rule that couldn't be broken, you probably gave one person a veto or ignored most ballots. If you made a rule that treated everyone equally, someone found a way to break it."
  *   **The Takeaway:** "This is **Arrow's Impossibility Theorem**. You cannot have a ranked voting system that satisfies all four of these things at once:
      1.  **Unrestricted Domain:** Anyone can rank options however they want.
      2.  **Pareto Efficiency:** If everyone likes X over Y, the group likes X over Y.
      3.  **Independence of Irrelevant Alternatives:** No spoilers.
      4.  **Non-Dictatorship:** No single person decides.
      You must pick which one you are willing to violate."

  ---

  ### **Troubleshooting & Predictable Problems**

  **1. "So Democracy is Fake / Voting is Meaningless"**
  *   **The Trap:** Participants leave feeling nihilistic.
  *   **The Fix:** "Voting isn't meaningless; it's *constructive*. It doesn't find a pre-existing truth; it *builds* a decision. The point isn't to stop voting. It's to stop expecting the voting method to be magic. When you choose a rule, you are choosing which flaw you can live with. That is a political choice, not a math problem."

  **2. "Just Flip a Coin / Random Dictator"**
  *   **The Trap:** Someone suggests randomization to solve the paradox.
  *   **The Fix:** "That works! But notice what you gave up. You gave up **determinacy**. You solved the fairness problem by admitting there is no logical 'best' answer. That's a valid solution, but it confirms the theorem: you had to drop one of the conditions (in this case, a deterministic outcome based on preferences)."

  **3. "We Only Have 15 People / This Sample is Tiny"**
  *   **The Trap:** Dismissing the result as a small-sample error.
  *   **The Fix:** "The math doesn't care about sample size. The Cycle Demo worked with 15 'voters' (the cards). It works with 15 million. The impossibility is about the *structure* of the logic, not the number of people. It holds for 3 people and 3 options. It holds for the US population."

  **4. "Why Not Just Use Scores (0-10) Instead of Rankings?"**
  *   **The Trap:** Suggesting Cardinal Voting (Range/Score) solves it.
  *   **The Fix:** "That is the one way out! Arrow's Theorem only applies to *ranked* ballots. If you ask people 'How much do you love this?' (Cardinal), you bypass the theorem. But you introduce a new problem: People lie. I'll rate my favorite 10 and my enemy 0. Now we're gaming the intensity, not the rank. There is no free lunch."

  **5. The Live Vote Doesn't Show the Spoiler**
  *   **The Trap:** The group votes 80% for Pizza, 20% for Tacos. Adding Salad changes nothing.
  *   **The Fix:** **Do not force it.** Say: "This group is remarkably coherent. The paradox didn't show up *this time*. But the rule we used *allows* for the paradox. To see if the rule is safe, let's run the 'Stress Test' Deck." (Switch to Backup Deck). This teaches that the *rule* is flawed, even if the *people* are nice.

  ---

  ### **What This Activity Cannot Show (Be Honest Here)**
  *State these clearly in the final 5 minutes.*

  1.  **Generality:** "We tested a few scenarios. The Theorem proves this holds for *every possible* combination of ballots. We can't test them all, but the math proves the pattern never breaks."
  2.  **Cardinal vs. Ordinal:** "We only used rankings (1st, 2nd, 3rd). We did not measure *intensity* of feeling. Some modern systems try to use intensity, but they have their own vulnerabilities (strategic exaggeration)."
  3.  **Strategy:** "We asked you to vote honestly. In real life, people vote strategically (voting for the 'lesser evil'). That makes the problem even harder. Arrow's Theorem assumes honesty and *still* says it's impossible."

  ### **Final Facilitator Note**
  Your job is not to be the expert. Your job is to be the **Game Master**. When they get frustrated, validate it. "Yes, it is annoying. That annoyance is the data." If the Black Box runs long, cut it. The **Design-a-Rule** segment is more valuable because it forces *them* to try and fail at creating a perfect system.
