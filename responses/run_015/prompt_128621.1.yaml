answer: |-
  # ADR-042: Mental Causation Module (MCM) Retention Policy

  **Status:** Accepted  
  **Date:** 2023-10-27  
  **Owner:** Senior Systems Engineering  

  ## Background
  The Core Physical Layer (CPL) operates under a strict policy of causal closure. Functionally, this means there is **no external API ingress** allowed into the physical execution pipeline. Every state transition within the CPL must be fully accounted for by prior physical states and physical laws. 

  The Mental Causation Module (MCM) was deployed as a **shadow microservice** layered atop the CPL. Its intended purpose was to process high-level user intent (qualia, beliefs, desires). Architecturally, the MCM maintains **eventual consistency with zero write permissions** relative to the neural substrate. It subscribes to neural events via a supervenience hook, ensuring that any change in the MCM state reflects a change in the physical layer, but not vice versa.

  ## The Exclusion Event
  During load testing in Sprint 44, a race condition occurred between the MCM and the CPL. When a user initiated a motor function (e.g., raising an arm), the CPL executed the command based on sufficient prior physical causes. Simultaneously, the MCM attempted to publish an identical command based on processed intent.

  The system load balancer flagged this as **duplicate webhook deliveries that the physical load balancer drops silently**. Because the CPL is closed, the physical cause was already sufficient. The MCM's contribution was rejected as redundant traffic. This confirmed the exclusion hypothesis: within a closed system, any non-physical cause is either causally inert or creates unnecessary overhead.

  ## Proposed Resolutions
  Three paths were evaluated during the post-mortem:

  *   **Decommissioning (Marcus, Platform):** Marcus argued that the MCM consumes compute cycles without altering system outputs. Since the physical pipeline handles 100% of endpoint execution, the MCM is dead code. He recommended immediate deprecation to free resources.
  *   **Retention for Telemetry (Priya, Ontology):** Priya defended the module, noting that while the MCM is **phenomenologically loud but causally mute**, it is required for user-facing reporting. Users expect their intentions to be logged, even if those intentions do not trigger the actual hardware. Removing the module would break **experience telemetry**, causing user confusion despite no change in physical behavior.
  *   **Compatibilist Middleware (Marcus, Platform):** Marcus briefly suggested a **compatibilist middleware layer** that would map mental states to physical realizers, allowing the MCM to claim causal credit without violating closure. This was immediately overruled by the Closure Policy Committee. Implementing such middleware would require granting write access to **closure-gated endpoints**, violating the strict physicalism mandate of the core infrastructure.

  ## Conclusion
  The committee has decided to retain the MCM in **read-only observability mode**. 

  The module will continue to ingest neural events and generate logs corresponding to user intentions. However, all causal pathways remain gated through the physical layer. The MCM will perform **epiphenomenal logging**: it records what *seems* to happen from the user's perspective without influencing what *does* happen. 

  This architecture ensures that removing the module would break experience telemetry without altering any system outputs. We acknowledge the inefficiency of maintaining a service that cannot write to its own database, but the business requirement for subjective consistency outweighs the cost of redundant compute. The MCM is now classified as a legacy observability tool with no production write privileges.

  **Approved By:** System Architecture Board  
  **Next Review:** Upon violation of Physical Closure Policy
