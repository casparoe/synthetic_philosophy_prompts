  Colleagues,

  We face an unprecedented situation regarding our Executive Director's status. This memo recommends a path forward that honors both our bylaws and the humanity of our leadership.

  **The Facts**
  At 1:40 a.m. Saturday, an email resigned the ED "effective immediately." At 8:15 a.m., she retracted it, explaining an AI tool sent a voice note without her review. The Chair acknowledged receipt at 7:02 a.m. Our bylaws state resignation is "effective upon receipt" and withdrawable only with "Board consent."

  **The Conflict**
  One faction argues the bylaw is a bright line: receipt equals resignation. To rule otherwise invites instability; any leader could claim "I didn't mean it" after a crisis. The institution cannot audit private intent. This view protects the shelter from uncertainty during leadership transitions and funding crises.

  The other faction argues this was not a resignation act at all. A message generated by software without human review is akin to a forged signature. It lacks the agency required for a legal act. This view protects individuals from technological errors beyond their control.

  **The Value Call**
  We must choose between institutional predictability and individual fairness. No conceptual clarification settles this. If we prioritize predictability, we accept the resignation. If we prioritize fairness in exceptional circumstances, we reject it. I recommend we prioritize fairness here, because the mechanism of transmission was broken, not the leader's resolve. We are not debating regret; we are debating authority.

  **The Changing Fact**
  My verdict would change if the ED had reviewed the email before sending. If she had read "effective immediately" and clicked send, the bylaw's bright line must hold, regardless of later regret. That would be a withdrawal request, not an invalid act.

  **Organizational Impact**
  As the finance lead, I must note that a leadership vacuum during funding loss is catastrophic. Donors and staff need stability. While we must respect the bylaws, we must not let a software glitch trigger a financial crisis.

  **Recommendation**
  I recommend the Board vote to declare the resignation **invalid**. The bylaw requires receipt of a resignation; an unauthorized AI output is not a resignation. Consequently, the Board need not vote on "consent to withdraw," as nothing valid exists to withdraw. This respects the bylaw's definition of "resignation" while acknowledging the unique technological context.

  **Future Protection**
  To prevent recurrence, we must amend the bylaws. We cannot rely on "intent" tests in the future. We need a procedural safeguard. I propose requiring human confirmation for any formal notice generated by automated tools or assistants.

  This decision protects our ED during a crisis while establishing clearer rules for tomorrow.

