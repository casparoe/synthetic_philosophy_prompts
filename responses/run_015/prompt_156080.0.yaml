      *   If I drop (3), (2) is actually *compatible* with Voluntarism. "Waiting to be found" implies pre-existence. Voluntarism says it's made, not found.
      *   So (2) might not need repair!
      *   (1) says "There is no fact of the matter... even if I knew everything." This implies tenseless truth. That *does* conflict with Voluntarism.
      *   So dropping (3) requires a slight tweak to (1)'s tense.
      *   But (3) is the conceptual blocker.

      *   Okay, ready to write.
