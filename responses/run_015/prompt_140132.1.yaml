prompt: |-
  I've been on my city's zoning board for about six years now and I keep feeling like the rules we apply only make sense against some background theory I can't quite name. I'd rather not get into which city it is, so here's the shape of it, in my own words.

  Most of the city is capped at about three stories by a map drawn back in the 1960s. Buildings that were legal when they went up can stay forever even though they break every current rule, and if one burns down or gets taken out by a storm the owner can rebuild it more or less as it was with no review at all; if the same owner tore it down on purpose, the replacement goes through the whole process. At the same time, we do force every building to retrofit for earthquakes and fire safety, so it isn't that existing buildings are simply left alone.

  Anything ten units or bigger triggers a design hearing. Anyone who owns or rents within about 300 feet can speak, and can appeal if they don't like the outcome; nobody else has that standing. The standard we're told to apply is whether the project fits the existing streetscape. There is no hearing, and no appeal, about what happens if we say no. Also, because the trigger is ten units, we see a definate stream of nine-unit proposals, and sometimes three or four of them on the same block in a couple of years.

  New projects at that size also have to set aside some units at below-market rents and pay a per-unit fee toward parks, schools and transit. Existing buildings never pay any of that. The below-market units get allocated by lottery, and people who already live or work in the city get priority in it. Meanwhile the city has an official target for how many homes it wants built each year, and it misses it every year, and nothing happens to anybody when it does.

  So what I want is the theory underneath the package. It looks to me like it treats the people already here, and the buildings already here, as having a kind of claim that someone who might move here one day simply doesn't have. But it also looks like it treats *change* as the thing that needs justifying rather than the state of the world, which is what the fire rule and the grandfathering are both doing. Are those two different pictures bolted together, or one picture, and if they conflict, which one is doing the real work? Does a set of rules like this strictly presuppose any particular answer to who has a right to the city, or would several quite different answers license the exact same rules? I'd like you to seperate what the practice really commits us to from what it merely sits comfortably with, and to say where it's genuinely underdetermined.

  Then the second half: suppose we swapped in the opposite picture, where the people who would otherwise move here count the same as the people already here, and where a harm is judged by how things end up rather than by who changed them. What would actually have to change in the day to day mechanics of a board like mine? Concrete changes, please, not a manifesto.

  Please answer in American English, and I'm not a philosopher, so keep the jargon down and explain it where you can't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A zoning board member (6 years experience). Pragmatic, observant, thoughtful. Not a philosopher (wants low jargon).
      *   **Task:**
          1.  Identify the underlying political/social theory of the current zoning rules described.
          2.  Determine if the conflicting elements (grandfathering vs. safety retrofits, status quo bias vs. growth targets) are coherent or contradictory.
          3.  Analyze who has a "right to the city" under these rules.
          4.  Distinguish between what the rules *commit* to vs. what they are merely *compatible* with.
          5.  Propose concrete, mechanical changes if the underlying theory were swapped to an "equal weight for newcomers/outcomes" model.
      *   **Constraints:** American English, low jargon, explain necessary concepts.
      *   **Tone:** Professional, analytical, respectful of the user's experience, practical.

  2.  **Deconstruct the Current Zoning Regime (The "Shape of It"):**
      *   *Height Cap (3 stories, 1960s map):* Freeze-frame of the past.
      *   *Grandfathering (Non-conforming use):* Old buildings are safe unless destroyed by owner. Rebuild after disaster = okay. Demolish = review.
      *   *Safety Retrofits:* Existing buildings *must* change for safety (earthquake/fire).
      *   *Design Hearing Trigger:* 10+ units.
      *   *Standing:* Only neighbors (300 ft) can speak/appeal. Outsiders/newcomers cannot.
      *   *Standard:* "Fit existing streetscape."
      *   *Asymmetry:* No appeal if approved, but appeal if denied? (Wait, prompt says "no hearing, and no appeal, about what happens if we say no." This means if the board says no, the developer can't appeal. If the board says yes, neighbors can appeal.)
      *   *9-Unit Loophole:* Developers game the system to avoid hearings.
      *   *Fees/Inclusionary Zoning:* New builds pay (fees + below-market units). Old builds pay nothing.
      *   *Allocation:* Locals get priority for affordable units.
      *   *Growth Targets:* Missed consistently, no consequences.

  3.  **Part 1: The Underlying Theory:**
      *   *Core Concept:* "Status Quo Bias" or "Vested Rights."
      *   *Philosophical Label:* "Lockean Labor Theory" mixed with "NIMBYism" (Not In My Back Yard) institutionalized. More accurately, it's a form of **Possessive Localism**.
      *   *The "Claim":* Current residents/owners have a property right in the *character* of the neighborhood, not just their lot.
      *   *The "Change" Aspect:* Change is presumed harmful unless proven otherwise (for new stuff). Existing stuff is presumed safe unless proven dangerous (safety retrofits).
      *   *Conflict:* Is it one picture or two?
          *   Picture A: Existing property rights are sacred (Grandfathering).
          *   Picture B: Public safety trumps property rights (Retrofits).
          *   Picture C: Newcomers are outsiders who must buy their way in (Fees/Affordable Housing on *new* only).
          *   *Synthesis:* It's a "Club Model." Existing members (residents) own the club. New members (developers/renters) must pay an initiation fee. The club rules don't apply to old members (grandfathering), except for safety (don't burn the club down).
      *   *Right to the City:* It presupposes a **Resident-Owner Sovereignty**. If you are already there, you have rights. If you are not, you have none.
      *   *Underdetermined:* Does it *require* this? No. You could have strong tenant protections without zoning caps. You could have safety retrofits without height caps. The specific combination commits to *exclusion* via *stasis*.

  4.  **Part 2: The "Opposite Picture" (Equal Weight/Outcome Based):**
      *   *Theory:* Utilitarian/YIMBI (Yes In My Back Yard)/Cosmopolitan. Everyone counts equally, regardless of address. Harm is measured by housing shortage/homelessness, not by shadow on a lawn.
      *   *Concrete Changes:*
          1.  *Standing:* Allow regional representation. Let people outside the 300ft circle testify (e.g., housing advocates, commuters).
          2.  *Trigger:* Remove the 10-unit threshold. Apply design review based on actual impact, or remove it for by-right building.
          3.  *Grandfathering:* Limit it. If you rebuild, you must meet current code (zoning, not just safety). Or tax the "zoning equity."
          4.  *Fees:* Apply impact fees to *all* properties (maybe via property tax) rather than just new construction (which penalizes building).
          5.  *Growth Targets:* Tie board performance or city funding to meeting targets.
          6.  *Standard:* Change "fit streetscape" to "meet housing need" or "minimize regional harm."
          7.  *Appeals:* Balance the asymmetry. If neighbors can appeal approval, developers should be able to appeal denial.
          8.  *9-Unit Loophole:* Close it. Count units over a longer timeframe or by lot size.

  5.  **Drafting the Response (Iterative refinement for tone and clarity):**
      *   *Intro:* Acknowledge the user's insight. It's a sharp observation.
      *   *Section 1: The Theory.* Call it "Possessive Localism" or "The Club Model." Explain that it treats the neighborhood as private property of the collective existing residents.
      *   *Addressing the Conflict:* The safety retrofit vs. grandfathering isn't a contradiction in this theory. Safety is about *survival* of the club. Zoning is about *exclusivity* of the club.
      *   *Right to the City:* It commits to "Right of Presence." If you are present, you rule. If you are absent, you beg.
      *   *Underdetermined:* Point out that safety rules don't *need* height caps. The height caps are the exclusionary part.
      *   *Section 2: The Swap.* Needs to be mechanical.
          *   *Standing:* Expand the circle.
          *   *The "No" Appeal:* Fix the asymmetry.
          *   *The 10-Unit Trigger:* Move it or kill it.
          *   *Fees:* Spread the cost.
          *   *Standard:* Change the metric.
      *   *Conclusion:* Wrap up gently.

  6.  **Refining the "Theory" Name:**
      *   "Possessive Localism" is good.
      *   "Vested Rights" is legalistic but accurate.
      *   Let's use "The Incumbent Veto." Or "Status Quo Sovereignty."
      *   Actually, the prompt asks for the *theory*. In political philosophy, this aligns with **Communitarianism** (rights derive from membership in the community) mixed with **Property Absolutism**. But for a layperson, "The Club Model" is the best analogy. I will use "Incumbent Sovereignty."

  7.  **Refining the "Conflict" Analysis:**
      *   User asks: Are they bolted together or one picture?
      *   Answer: It's one picture: *Protection of the Existing Asset.* Safety protects the physical asset. Zoning protects the financial/social asset (scarcity).
      *   User asks: Which is doing the real work?
      *   Answer: The exclusion (zoning) is doing the work. The safety is just maintenance.

  8.  **Refining the "Concrete Changes":**
      *   Make sure they are actionable by a board member or city council.
      *   *Standing:* Change the code to allow "regional impact" testimony.
      *   *Burden of Proof:* Shift it. Currently, developer must prove "fit." Swap to: Objectors must prove "specific harm."
      *   *Grandfathering:* Add a "loss of non-conforming status" clause if substantial renovation happens.
      *   *Fees:* Shift from per-unit on new to parcel tax on all.
      *   *Targets:* Make approval automatic if targets are missed (the "Builder's Remedy" concept).

  9.  **Review against Constraints:**
      *   American English? Yes.
      *   No jargon? Explain "standing," "grandfathering" (already known), "asymmetry."
      *   Tone? Respectful.

  10. **Final Polish:** Check the flow. Ensure the distinction between "what it commits to" and "what it sits comfortably with" is clear. (Commitment: Incumbents rule. Compatible: Safety, aesthetics, etc.)

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm advocating for one side. The user asked for analysis, not a manifesto. Keep the second half descriptive of *mechanics*, not moralizing about why the swap is better, just *what changes* if the theory swaps.

  *(Check on the "No appeal if we say no" point)*: The prompt says "There is no hearing, and no appeal, about what happens if we say no." This is a huge veto power for the board/neighbors. In the "swap" scenario, this needs to change to allow developer appeals (objective standards).

  *(Check on the 9-unit loophole)*: This is a classic response to the 10-unit trigger. The "swap" needs to address aggregation (counting multiple small projects as one big one).

