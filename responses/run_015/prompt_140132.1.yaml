answer: |-
  This is a remarkably clear description of a system that many people live inside but few see from the control room. You have identified the tension between *preserving what exists* and *managing what comes next*.

  Here is an analysis of the theory underneath your current rules, followed by the concrete mechanical changes required if you swapped that theory for its opposite.

  ### Part 1: The Theory of the Current Rules

  The theory underneath your zoning code is best described as **Incumbent Sovereignty**.

  In political philosophy, this is a mix of "possessive localism" and "vested rights." It operates on the premise that the city is not a single organism that grows, but a collection of established clubs (neighborhoods). Membership in the club is granted by arrival. Once you are a member (a resident or property owner), you have a property right not just in your own lot, but in the *character* of the surrounding area.

  **1. Is it one picture or two?**
  You asked if the safety rules (retrofits) and the preservation rules (grandfathering) are conflicting pictures bolted together. Under Incumbent Sovereignty, they are actually one coherent picture: **Asset Protection.**

  *   **Grandfathering** protects the *financial and aesthetic* value of the asset. It ensures that the rules of the game don't change after the incumbents have bought in.
  *   **Safety Retrofits** protect the *physical* existence of the asset. The city is saying, "We won't force you to change your building's shape, but you cannot let it burn down or collapse, because that harms the other club members."

  So, there is no contradiction here. The theory is: *Protect the existing stock at all costs, unless that stock becomes a physical danger to other incumbents.*

  **2. Who has a right to the city?**
  Your rules strictly presuppose that the "Right to the City" belongs to **current occupants**.
  *   **Insiders:** People within 300 feet have legal standing. They are the voters in the neighborhood "election."
  *   **Outsiders:** People who might move here, people who work here but live elsewhere, and the region at large have no standing. Their need for housing is treated as an abstract concept, whereas a neighbor's worry about parking is treated as a concrete harm.
  *   **The "Fee to Enter":** The requirement for new buildings to pay fees and provide below-market units, while existing buildings pay nothing, functions as a tariff. It tells developers: "You are an outsider. To bring new people into our club, you must pay a toll." Existing members pay no toll.

  **3. What is the practice committed to?**
  This is the most critical distinction. Your system is *committed* to **Stability over Efficiency.**
  *   **Committed:** It commits to the idea that change is inherently suspicious and must justify itself. It commits to the idea that local knowledge (neighbors) trumps regional need (housing targets).
  *   **Merely Compatible:** The system is *compatible* with safety, beauty, and neighborhood character, but it does not *require* them. You could have safety without height caps. You could have beautiful streets without giving neighbors veto power. The fact that the system includes safety rules doesn't mean the system is *about* safety; it just means safety doesn't threaten the incumbents.
  *   **Underdetermined:** The rules do not determine *how* safe is safe enough (that changes over time), nor do they determine what "fits the streetscape" means. Those are empty vessels the board fills in. But the *procedure* (who gets to speak, who pays fees) is rigid. It rigidly commits to excluding non-incumbents from the decision-making process.

  **4. Which picture is doing the real work?**
  The **exclusionary** picture is doing the work. The safety retrofits happen rarely and are technical. The zoning hearings happen constantly and are political. The 9-unit loophole proves this: developers would rather build uglier, smaller buildings to avoid the hearing than build larger ones and engage with the process. This proves the "Design Hearing" is not actually about design; it is a barrier to entry.

  ***

  ### Part 2: Swapping the Theory

  Now, let's swap the theory. Suppose we adopt **Regional Utilitarianism**.
  *   **Premise 1:** A person who wants to live here counts the same as a person who already lives here.
  *   **Premise 2:** Harm is measured by the outcome (e.g., homelessness, housing costs, regional congestion), not by who caused the change.
  *   **Premise 3:** The city is a resource to be managed for the whole region, not a private club for current residents.

  If you adopted this theory, you would not need a manifesto. You would need to change the mechanics of your board's daily operations. Here are the concrete changes:

  **1. Change "Standing" (Who gets to speak)**
  *   **Current:** Only owners/renters within 300 feet.
  *   **Change:** Expand standing to include "regional stakeholders." This could mean allowing testimony from housing advocacy groups, commuter organizations, or even a city-wide representative.
  *   **Mechanism:** Amend the code to define "aggrieved party" to include anyone demonstrably affected by the regional housing shortage, not just proximity. Alternatively, reserve 50% of hearing time for speakers from outside the 300-foot radius.

  **2. Flip the Burden of Proof**
  *   **Current:** The developer must prove the project "fits the streetscape." Change is presumed bad.
  *   **Change:** The objectors must prove the project causes "specific, demonstrable harm." Change is presumed neutral or good.
  *   **Mechanism:** Rewrite the approval standard. Instead of "Does this fit?", the standard becomes "Does this violate an objective safety or health code?" If it meets the code, it is approved. "Feels out of place" is no longer a valid reason for denial.

  **3. Fix the Appeals Asymmetry**
  *   **Current:** Neighbors can appeal a yes; developers cannot appeal a no.
  *   **Change:** Equalize the right to appeal.
  *   **Mechanism:** If the board denies a project, the developer must have the right to appeal to a higher body (like a city council committee or a state housing court) that reviews whether the denial was consistent with the law. This prevents the board from killing projects quietly.

  **4. Close the 9-Unit Loophole (Aggregation)**
  *   **Current:** 10 units trigger review. Developers build 9.
  *   **Change:** Count units by "common ownership" or "timeframe."
  *   **Mechanism:** Add a clause that aggregates projects. If the same owner (or related LLCs) proposes multiple projects on adjacent lots within a 24-month period, the unit counts are added together. If the total exceeds 10, the whole bundle gets the hearing.

  **5. Spread the Costs (The "Tariff" Problem)**
  *   **Current:** New buildings pay fees and affordable unit set-asides. Old buildings pay nothing. This punishes new construction.
  *   **Change:** Fund public goods (parks, schools, affordable housing) through broad-based taxation, not development fees.
  *   **Mechanism:** Reduce or eliminate the per-unit development fee. Instead, pass a parcel tax or property tax increase that applies to *all* properties, old and new. This treats housing as a public good everyone supports, rather than a tax on new neighbors.

  **6. Automate the Growth Targets**
  *   **Current:** Targets are missed with no consequence.
  *   **Change:** Automatic approval if targets are missed.
  *   **Mechanism:** Implement a "Builder's Remedy" clause. If the city fails to meet its annual state-mandated housing target, any project that includes a minimum percentage of affordable units is automatically deemed "consistent with the general plan" and bypasses the zoning board entirely. This forces the board to approve projects or lose its power.

  **7. Redefine "Grandfathering"**
  *   **Current:** If a building burns down, it can be rebuilt exactly as before (non-conforming).
  *   **Change:** Limit the right to rebuild non-conforming structures.
  *   **Mechanism:** If a building is destroyed (by any cause) beyond 50% of its value, any rebuild must conform to *current* zoning (height/density), even if it doesn't have to conform to *new* design standards. This slowly brings the city into compliance without forcing immediate changes on standing buildings.

  **8. Change the "Streetscape" Standard**
  *   **Current:** Fit the existing look.
  *   **Change:** Fit the *planned* look.
  *   **Mechanism:** Adopt a "Form-Based Code" for specific corridors. Instead of saying "look like the 1960s buildings," the code says "This street is designated for 5 stories and mixed-use." If a project meets the 5-story form, it is approved. The "existing streetscape" is no longer the legal standard; the "planned streetscape" is.

  ### Summary of the Shift

  Under your current rules, the board acts like a **Homeowners Association**. Your job is to protect the property values and lifestyle of the people currently sitting in the hearing room.

  Under the swapped rules, the board acts like a **Public Utility Commission**. Your job is to ensure the supply of housing meets the demand of the region, ensuring that the people *not* in the room (future residents) are weighed equally against the people who are.

  You don't need to change your personal values to make these changes. You just need to change the checklist on your desk. Currently, your checklist asks: *"Do the neighbors object?"* The new checklist asks: *"Does this meet the regional need?"*
