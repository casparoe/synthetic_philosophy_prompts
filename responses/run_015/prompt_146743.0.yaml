      *   **Detailed Analysis:**
          *   Address (1) vs (3): It's not a contradiction if competence is the switch. But *why* competence matters needs explaining (Narrative Capacity).
          *   Address (2) vs (5): "Contract" implies static parties. "Process" implies flowing states.
          *   Address (4): Why medical > vocational for past self? Usually, it's the reverse in narrative theory. This needs a specific defense (e.g., bodily integrity as a precondition for narrative).
      *   **Revisions & Costs:**
          *   For each tension, offer a tweak.
      *   **The Keystone Change:**
          *   Drop "Contract" in (2). Replace with "Narrative Trusteeship."
          *   Explain why this fixes (1), (2), (3), and (5).

  8.  **Refining the "Keystone" Argument:**
      *   If I change (2) from "Contract" to "Trusteeship/Stewardship":
          *   Fixes (5): Trusteeship fits a process (managing a flow) better than a contract (static agreement).
          *   Fixes (3): A trustee can be overridden by the beneficiary if the beneficiary is competent. A contract partner cannot.
          *   Fixes (1): The past self holds values in trust for the *whole life*, not just the current stage.
      *   This seems the most robust philosophical move.

  9.  **Final Review against Constraints:**
