          *   *Verdict:* Medium Severity. Terminological issue. "Contract" implies bindingness that (3) weakens.

      *   **(4) vs. (1) & (2):** *The Domain Jurisdiction Tension.*
          *   (4) splits authority by domain (Medical vs. Vocational).
          *   (1) & (2) treat the self as a unified narrative/agent.
