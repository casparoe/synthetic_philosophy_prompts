      *   (3) *Competent Override:* If later self is competent but values change, present autonomy wins. (Standard liberal view on competent refusal).
      *   (4) *Domain Specificity:* Medical/Bodily = Past binds. Aesthetic/Relational = Present wins. (Nuanced jurisdiction).
      *   (5) *Process vs. Contract:* Process view usually kills contracts, but protagonist wants to keep (1). (The meta-philosophical tension).

  3.  **Identify Pairwise Tensions:**

