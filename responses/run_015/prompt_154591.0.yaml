          *   *Epi:* Environmental warnings (e.g., IARC classifications, EPA guidelines) often rely on strength of association, consistency, and dose-response (Hill's Criteria) even when mechanisms are unknown (e.g., smoking/lung cancer historically, asbestos).
      *   *Philosophical Context:* This touches on the "Mechanism vs. Statistics" debate, Cartwright's capacities, Worrall's use of evidence, and the precautionary principle.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the physicist's background. Validate the observation (it's a known puzzle in philosophy of science/policy). Set the stage: this isn't just epistemology; it's decision theory under uncertainty.

      *   **Reconstructing the Implicit Theory (IBE & Causality):**
          *   The asymmetry isn't purely epistemic; it's *pragmatic-epistemic*.
          *   *Pharma:* Intervention is *active*. You are introducing a novel perturbation into a complex system. Risk of unknown side effects is high. Mechanism provides *stability* of prediction (Cartwright).
          *   *Epi:* Intervention is *restrictive* (stop exposure). Risk of false negative (missing a hazard) is weighed against economic cost.
          *   *IBE Theory:* It's not a single theory of explanation. It's a *contextual* IBE. In pharma, the "Best Explanation" must support *counterfactual stability* (what happens if we change the dose/population?). In Epi, the "Best Explanation" must support *causal attribution* (is X causing Y?) to justify restriction.
          *   *Virtue:* It's not just "causal depth." It's *manipulability* (Woodward). Pharma needs to know *how* to manipulate safely. Epi needs to know *that* manipulation (removal) works.

      *   **Epistemic Virtue vs. Risk/Tractability:**
          *   Is explanatory coherence independent? No, it's instrumental.
          *   *Risk Tolerance:* Pharma = Type I error (approving bad drug) is catastrophic for individuals. Epi = Type II error (missing a hazard) is catastrophic for populations.
          *   *Tractability:* Pharma companies *can* research mechanism (controlled labs). Epi often deals with uncontrolled, historical exposures where mechanism is hard to find.
          *   *Intervention:* Active introduction vs. Passive removal.
          *   *Conclusion:* The asymmetry is justified by *decision-theoretic* constraints, not pure epistemology.

      *   **Specific Explanatory Virtues:**
          *   *Causal Depth:* Required in pharma to predict off-target effects.
          *   *Unification:* Less relevant.
          *   *Suppression of Ad Hoc:* Crucial in both. Statistical association alone can be ad hoc (confounding). Mechanism reduces the "ad hoc-ness" of the causal claim.
          *   *Commitment:* The practice commits to *Causal Mechanism as Insurance against Complexity*.

      *   **Consistency Check (The "Could we abandon it?" question):**
          *   If we abandon mechanism in Pharma: We increase reliance on black-box empiricism. This works for efficacy but fails for *safety* (long tail risks).
          *   If we weaken Epi: We require mechanism for warnings. This leads to "paralysis by analysis" (waiting for proof while people get sick).
          *   *Can they be unified?* Yes, under a framework of *Evidence Amalgamation* (Russo/Williamson). Both need stats + mechanism, but the *weighting* differs based on the cost of error.
          *   *Verdict:* A consistent framework *could* theoretically de-emphasize mechanism in pharma (Pure Empiricism), BUT it would require compensating safety measures (post-market surveillance) that are currently insufficient. Conversely, demanding mechanism in Epi would undermine the Precautionary Principle. So, the asymmetry is functionally necessary given current constraints, even if epistemologically uneven.

