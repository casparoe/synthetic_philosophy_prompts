          3.  Does this practice commit to a specific account of explanatory virtue (causal depth, unification, anti-ad-hoc)?
          4.  Could a consistent framework abandon mechanistic explanation in regulation without weakening epidemiological inference?
      *   **Task:** Reconstruct the implicit theory, distinguish requirements from accommodations, and evaluate consistency.

  2.  **Initial Analysis & Fact-Checking:**

