answer: |-
  This is a profound observation that cuts to the heart of evidential pluralism in regulatory science. As a physicist, you are accustomed to the idea that a model's predictive power is the ultimate test, regardless of whether the underlying Lagrangian is fully derived. Yet, in regulatory science, the "black box" is treated differently depending on whether you are inserting the box (pharmaceuticals) or observing it in the wild (epidemiology).

  The asymmetry you identify is real, but it does not presuppose a single, unified theory of Inference to the Best Explanation (IBE). Rather, it presupposes a **pragmatic-epistemic hybrid** grounded in **interventionist causality** and **decision theory under uncertainty**.

  Here is a reconstruction of the implicit theory, an analysis of the epistemic virtues at stake, and an evaluation of whether a consistent framework could abandon this asymmetry.

  ### 1. Reconstructing the Implicit Theory: Interventionist Stability

  The regulatory asymmetry does not rest on a classical account of IBE (where the "best" explanation is the most unifying or simplest). Instead, it rests on what James Woodward calls **interventionist causation**.

  *   **Pharmaceutical Regulation (Active Intervention):** When a drug is approved, you are introducing a *novel perturbation* into a complex biological system. The trial population is never identical to the post-market population. To approve the drug, the regulator must infer that the causal relationship observed in the trial will *remain stable* under variations in context (different genetics, comorbidities, concurrent medications).
      *   **The Role of Mechanism:** Mechanism is not demanded for *proof of efficacy* (statistics suffice for that); it is demanded for **extrapolative stability**. A mechanistic pathway constrains the space of possible confounding variables. It assures the regulator that the correlation is not a local artifact of the trial design.
      *   **Implicit IBE:** The "Best Explanation" here is the one that maximizes **invariance**. A statistical association is variant (it holds only under the specific conditions of the trial); a mechanistic story suggests the relationship is invariant across contexts.

  *   **Environmental Epidemiology (Passive Restriction):** When an environmental warning is issued, the intervention is typically the *removal* or *reduction* of an exposure. The causal claim required is narrower: "Is this exposure contributing to harm in this population?"
      *   **The Role of Mechanism:** Mechanism is often unavailable because the exposure is complex (e.g., air pollution) or the latency is long. Regulators rely on **Hill's Criteria** (strength, consistency, dose-response).
      *   **Implicit IBE:** The "Best Explanation" here is the one that minimizes **false negatives** under the Precautionary Principle. The epistemic burden is shifted from "prove exactly how" to "rule out coincidence."

  **Conclusion on Theory:** The divergence presupposes a **contextual IBE**. In pharma, explanation is valued for *predictive robustness* (external validity). In epidemiology, explanation is valued for *causal attribution* (internal validity) to justify restriction.

  ### 2. Epistemic Virtue vs. Risk and Tractability

  You ask whether explanatory coherence is treated as an independent epistemic virtue or if the asymmetry is explained by risk, tractability, and intervention.

  **The Practice Strictly Requires:**
  1.  **Control of Type I/II Error Asymmetry:**
      *   **Pharma:** The cost of a Type I error (approving a harmful drug) is concentrated and visible (patient death/liability). The cost of a Type II error (delaying a drug) is diffuse. Therefore, the system demands high specificity, which mechanism provides.
      *   **Epi:** The cost of a Type II error (failing to warn about a carcinogen) is diffuse but catastrophic (population health). The cost of a Type I error (false warning) is economic. Therefore, the system tolerates lower specificity, accepting statistical association.
  2.  **Interventional Direction:**
      *   Pharma adds a variable to a system. This requires knowing how the variable interacts with others (mechanism).
      *   Epi removes a variable. This requires knowing only that the variable is linked to the outcome (association).

  **The Practice Merely Accommodates:**
  1.  **Explanatory Coherence as Intrinsic Good:** Regulators do not demand mechanism because it is "true" in a realist sense; they demand it because it reduces the variance of the risk estimate. If a black-box drug had perfect long-term safety data (impossible in practice, but hypothetically), mechanism would be less required.
  2.  **Unification:** Regulators rarely care if the drug mechanism unifies with broader biological theory. They care if it predicts off-target effects.

  **Verdict:** The asymmetry is **not** based on explanatory coherence as an independent epistemic virtue. It is based on **epistemic risk management**. Mechanism is a tool to reduce uncertainty about *unobserved contexts* (pharma), whereas statistical association is a tool to establish *observed liability* (epi).

  ### 3. The Specific Explanatory Virtue: Causal Depth vs. Ad Hoc Suppression

  Does the practice commit to a specific account of explanatory virtue? Yes, but it is subtle.

  *   **Suppression of Ad Hoc Assumptions:** In both fields, a statistical correlation without mechanism is vulnerable to the "ad hoc" charge (i.e., it might be confounding).
      *   In **Epi**, this is mitigated by *consistency* across studies (replication suppresses the ad hoc nature).
      *   In **Pharma**, replication is insufficient because the post-market environment differs from the trial. Mechanism suppresses the ad hoc charge by grounding the correlation in biological capacity (Cartwright's "nomological machines").
  *   **Causal Depth:** Pharma requires *deep* causality (molecular binding $\to$ pathway $\to$ endpoint). Epi often accepts *surface* causality (exposure $\to$ endpoint).

  **The Commitment:** The regulatory framework quietly commits to **Causal Realism regarding Capacities**. It assumes that for an *active* intervention to be safe, the entity must possess a stable capacity to produce the effect, independent of the specific experimental setup. Statistical association alone does not prove capacity; it proves correlation. Mechanism proves capacity.

  ### 4. The Consistency Test: Could We Abandon Mechanism in Regulation?

  This is the critical philosophical question. Could a consistent institutional framework abandon mechanistic explanation in pharmaceutical regulation without weakening the standing of epidemiological inference?

  **The Argument for Consistency (The "Black Box" View):**
  One could argue that if statistical efficacy is overwhelming (e.g., $p < 10^{-9}$, massive effect size), mechanism is epistemically redundant. If we accept this for drugs, we are essentially saying **Predictive Accuracy > Explanatory Depth**.
  *   *Consequence for Epi:* This would actually *strengthen* epidemiological inference. If mechanism is not required for the high-stakes domain of drug approval, it certainly shouldn't be required for environmental warnings. This would create a consistent "Empiricist Framework."

  **The Argument for Inconsistency (The "Stability" View):**
  However, abandoning mechanism in pharma undermines the justification for *safety*, not just efficacy.
  *   If you approve a drug based solely on stats, you cannot predict interactions.
  *   If you warn on environmental exposure based solely on stats, you are recommending *removal*. Removal rarely causes novel interaction effects (you aren't adding a new chemical).
  *   *The Asymmetry holds:* Adding a perturbation requires more knowledge than removing one.

  **The Verdict on Consistency:**
  A consistent framework **could** theoretically abandon mechanistic requirements in pharma *if* it compensated with radical post-market surveillance (treating the population as the continuation of the trial). However, doing so would not weaken epidemiological inference; it would merely align the two fields under a **Pure Empiricism** model.

  **But here is the catch:** If you abandon mechanism in pharma, you implicitly admit that statistical association is sufficient for *causal* claims in complex systems.
  *   If you admit this, then epidemiological warnings based on stats alone become *stronger*, not weaker.
  *   Therefore, the current asymmetry (demanding mechanism in pharma but not epi) is actually **more epistemically rigorous** than a consistent empiricist framework. It acknowledges that *active intervention* requires a higher grade of causal knowledge than *passive observation*.

  ### Summary for the Physicist

  1.  **Implicit Theory:** The system uses **Interventionist Causality**. Mechanism is required not for "truth" but for **invariance**—ensuring the causal link holds outside the specific boundary conditions of the clinical trial.
  2.  **Epistemic Virtue:** Explanatory coherence is **instrumental**, not intrinsic. It is a proxy for risk reduction regarding unobserved interactions.
  3.  **Consistency:** A framework that abandoned mechanism in pharma would not weaken epidemiology; it would lower the bar for *all* causal claims. However, the current asymmetry is justified because **adding a variable (drug) requires more structural knowledge than removing a variable (exposure).**

  The asymmetry is not a philosophical failure; it is a rational adaptation to the asymmetry of **intervention**. In physics terms: You can infer the existence of a field from the deflection of a particle (epidemiology), but if you intend to *build* a magnet to manipulate that particle (pharmaceuticals), you need to know the electrodynamics, not just the trajectory.
