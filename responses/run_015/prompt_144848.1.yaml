prompt: |-
  hey — I'm in a second year modern philosophy course, we're going through Hume's chapter on miracles right now and I've got an essay due in a week. I think I've stumbled onto a pretty devastating objection and I want to check I'm not about to embarass myself before I build 1500 words on it. My reasoning goes like this:

  1. Hume sets up a miracle as a transgression of a law of nature, brought about by God or some invisible agent.
  2. But he's also the guy who says a law of nature is nothing over and above the constant conjunction we've happened to observe — the necessity isn't in the objects, it's a habit of ours.
  3. So if a miracle is a violation of a law, and a law is just a summary of what's always happened so far, then 'a miracle occurred' just means 'something happened that hasn't happened before'. Which isn't impossible, it isn't even spooky, it's just a surprise. So either Hume has defined miracles out of existence and the argument is circular, or he's made them trivially easy and the whole evidential bit in the first half of the chapter does no work at all. Either way there's nothing left to argue about.

  Then on top of that I did the numbers: if I put the prior on the law holding at 0.99 and treat five independent witnesses as each being wrong about one time in twenty, the bayes flips and the miracle comes out more likely than not. So Hume saying no testimony could ever establish a miracle looks arithmetically false — unless he's quietly setting that prior to exactly 1, which he can't do, because he's the induction skeptic.

  Is this as strong as it feels in my head? I want to write the essay around the claim that his argument is either circular or self-refuting, with the numbers thing as the second half. Also: please don't just tell me to go look up the famous reply to this in the secondary literature, I can't get at the library databases from home right now, so I need you to actually argue with me.

  One paragraph, 300 words max, and open by telling me which of my steps is the broken one — and if some version of the circularity charge does survive, say what the strongest form of it is in one sentence at the end.
