  ok so — a friend and I have been going in circles on the omnipotence paradox for about two weeks and I want a number out of you, not a tour of the literature (I cant look anything up and neither can you, so please dont gesture at things to go read).

  The proposition I want your credence on: there is at least one genuine task — coherent, not a disguised contradiction on the order of making a married bachelor or a square circle — that a being who is essentially omnipotent and also genuinely free to bind itself cannot bring off. Mine is around 0.35, hers is around 0.85, and I have a feeling we're actually disagreeing about one sub-question rather than about the whole thing. Tell me which one.

  The textbook version — can he make a stone too heavy for him to lift — seems to just die to the standard reply: the creator is essentially omnipotent, so of course he can lift anything, so there's no such task, so no problem. So here are two variants I came up with to get around that, which is really why I'm asking:

  Wrinkle 1 (delegation): the being grants some creature the power to make objects the being itself cannot lift, and the creature goes ahead and makes one. Has the being brought it about that there is something it cannot lift? Does being able to get X done through someone else count as being able to do X, for the purposes of omnipotence? The point of the variant is that "an object no being can lift" doesn't look contradictory in the way "an object an essentially omnipotent being cannot lift" supposedly is.

  Wrinkle 2 (two-stage, self-imposed): create an indestructible object, then destroy it. Each half is performable on its own; the failure at the second stage is downstream of the agent's own earlier free act — which makes it structurally like promising, where a faithful agent "cant" break the promise but we dont count that as a loss of power.

  Please decompose, with a rough number and one line of justification each, then a combination and a note on how the terms interact (they're obviously not independent):

  - that the classic stone task really is a pseudo-task rather than a merely unperformable-but-coherent one;
  - that one of my two wrinkles escapes the pseudo-task reply, and if so which;
  - that self-imposed inability — promise, creation, whatever — is a real inability or only a "wont";
  - that abilities should be time-indexed (omnipotent at t) rather than read off the whole history or modally;
  - that omnipotence is best understood as maximal rather than unlimited power;
  - and how much of your final number is really just your rejection of the escape hatch where an omnipotent being can do logically impossible things, since granting that makes the whole thing evaporate.

  Then: which term are you least confident in, what would actually move it, and which of the two people at 0.35 and 0.85 is probably misassigning which term. And if the framing is broken — if "task" isnt doing any work here, or credence is the wrong attitude toward a conceptual question, or one of my wrinkles quietly assumes what it's meant to test — say that plainly instead of politely producing a number. I'd genuinely rather be told.
