answer: |-
  This is an exceptionally sharp meta-philosophical observation. You have correctly identified that the professional norms of analytic philosophy (including political philosophy) operate on a logic distinct from the natural sciences, yet distinct also from pure literary interpretation or history.

  The implicit theory of progress that underwrites your description is best characterized as **Cumulative Dialectical Sophistication**.

  Below is a reconstruction of this implicit theory, an analysis of where the practice is underdetermined, and a breakdown of what would happen if the assumption were dropped.

  ### 1. The Implicit Theory: Cumulative Dialectical Sophistication

  Your "cartographic" guess is correct, but it needs a specific mechanism. The field does not presuppose that we are converging on *The Truth* (the scientific model). Nor does it presuppose that all texts are equally viable eternal recurrences (the flat model).

  Instead, the field presupposes that the **Space of Reasons** is expanding.

  *   **The Mechanism:** When a position is argued (e.g., Rawlsian constructivism), objections arise. Even if the position is not "refuted" (settled), the *cost* of holding it becomes clearer. Perhaps it requires a controversial metaphysics, or it fails to handle a specific edge case. Later work incorporates that cost-benefit analysis into the formulation of the view.
  *   **The Progress Claim:** Progress is not measured by the number of settled theses, but by the **granularity of distinctions** and the **anticipation of objections**. A 2020 paper is presumed to be "dialectically ahead" of a 1970 paper not because it is truer, but because it is *armored*. It has had the benefit of seeing the objections that destroyed the 1970 version of the view.
  *   **Recency as Proxy:** The demand for recent literature is a demand for **efficiency**. If you write a paper in 2024 ignoring a decisive objection published in 2015, you are wasting the profession's time by reinventing a wheel that has already been shown to be square. Recency is a heuristic for "has this argument already been stress-tested?"

  ### 2. Does the Recency Norm Require a Progress Claim?

  **Yes.** The recency norm is strictly inconsistent with a "flat view" where nothing accumulates.

  *   **The Flat View:** If philosophy were truly flat (like poetry, where Homer is not "worse" than Heaney, just different), there would be no rational basis for demanding engagement with the last 20 years. You would engage with the *best* arguments, regardless of date. If a 1972 paper made the point better than a 2022 paper, the flat view would dictate citing the 1972 paper.
  *   **The Reality:** Referees demand recent citations even when the older paper is clearer. Why? Because the recent paper likely engages with *intervening* objections.
  *   **Conclusion:** The recency norm presupposes that the *context of justification* has changed. The "state of the debate" is a real, accumulating object, even if the "truth" is not. Therefore, a 1970 paper cannot be dialectically *equivalent* to a 2020 paper. It might be more insightful, but it is dialectically *naive* by comparison because it lacks the defensive fortifications developed in the interim.

  ### 3. Where is the Practice Philosophically Underdetermined?

  You asked where a "no-progress-at-all" view would license or undermine norms. If we genuinely adopted the view that **no dialectical accumulation occurs** (i.e., arguments do not get sharper, objections do not get more precise), the following would collapse:

  1.  **The "Original Contribution" Requirement:** This would become incoherent. If the space of reasons does not expand, "originality" can only mean "saying something no one has said," which is easy but trivial, or "finding the truth," which is impossible. The current requirement implies you must *move the debate*, which presupposes the debate is a movable object.
  2.  **The History/Contemporary Split:** This would dissolve immediately. If there is no dialectical accumulation, there is no "background" to be learned. Rawls would be taught exactly like Plato: as a timeless system to be interpreted, not as a move in a game we are currently playing. The fact that we treat History of Philosophy (HoP) as a specialized subfield implies we believe contemporary philosophy is doing something *different* (solving vs. interpreting).
  3.  **The Concept of "Outdated":** This would vanish. A paper is currently "outdated" if it ignores a distinction now considered standard. Without progress, there are no standard distinctions, only different vocabularies.

  **The Underdetermination Point:** The practice is underdetermined regarding *truth*, but not regarding *complexity*. We can claim "we know more ways to be wrong" without claiming "we know which way is right." A no-progress view undermines the complexity claim. If you hold the no-progress view, you cannot justify the recency norm.

  ### 4. Concrete Implications: If We Dropped the Progress Assumption

  If the field explicitly adopted a "No Cumulative Dialectical Sophistication" stance (a truly flat view), here is how the machinery would break:

  *   **Refereeing:**
      *   **Current:** "You fail to engage with X (2018) who refined this objection."
      *   **New:** "Is the argument sound? Ignore when it was written."
      *   **Result:** Review times might drop, but the "state of the art" would fragment. We would see constant revival of naive versions of theories that were already patched, leading to circular debates.
  *   **Graduate Training:**
      *   **Current:** "Learn the literature so you know where the landmines are."
      *   **New:** "Read the great texts to cultivate wisdom."
      *   **Result:** Dissertations would look more like commentaries. The pressure to "solve" a problem would be replaced by the pressure to "interpret" a problem.
  *   **History/Contemporary Split:**
      *   It would dissolve. Political philosophy would merge with History of Political Thought. We would treat Nozick as a historical artifact in the same way we treat Hobbes.
  *   **"Outdatedness":**
      *   We would stop using this term. A paper would be "unpersuasive" or "incoherent," but never "old."

  ### 5. Dissolving the Tension: Novelty vs. No Settlement

  You asked if "novelty is mandatory" and "nothing is ever settled" are in tension. Under the **Cumulative Dialectical Sophistication** model, the tension dissolves.

  *   **The Tension:** How can I contribute something new if we never agree on what's true?
  *   **The Dissolution:** A "contribution" in this model is not a new *fact* (settling a thesis). It is a new **configuration of the space**.
      *   *Example:* You don't prove Utilitarianism is true. You show that Utilitarianism, when combined with a specific view of moral psychology, avoids a specific objection that deontology faces.
      *   *Novelty:* This specific combination or distinction hasn't been mapped before.
      *   *No Settlement:* You haven't proven Utilitarianism is *The Answer*. You've just shifted the cost-benefit analysis of the debate.

  Therefore, the requirement for novelty is a requirement for **map-making**, not **territory-claiming**. You must draw a new line on the map, even if you admit the territory is still disputed.

  ### Summary of the Implicit Theory

  The field operates on a **Coherentist/Pragmatist theory of progress**.

  1.  **Truth is not the metric; Reflective Equilibrium is.** We are not getting closer to a mind-independent reality; we are creating a more coherent web of beliefs.
  2.  **The Web thickens over time.** New nodes (distinctions, objections, counter-examples) are added.
  3.  **Recency = Density.** Recent papers are assumed to operate within a denser web. Ignoring them means operating in a sparser, more vulnerable web.
  4.  **Originality = Re-weaving.** A dissertation must re-weave the web in a way that wasn't done before, even if the web never becomes "complete."

  **Verdict:** Your "cartographic" intuition is the correct one. The field views itself as mapping the *logical geography* of concepts. The terrain (human reason/politics) doesn't change, but the *map* gets more detailed. A 1970 map isn't "false," but it is "less useful" for navigation because it lacks the contour lines discovered in 2020. The recency norm enforces the use of the most detailed map available, even if no one knows where the destination is.
