answer: |-
  ### Brainstorming & Discards

  **Candidate 1: The "Vehicle" in the Park.**
  *Scenario:* A statute bans "vehicles" from a public park. An ambulance enters to save a heart attack victim.
  *Discard Reason:* This is the *Hart Fuller* chestnut. It triggers immediate student reflexes about "absurdity" rather than methodological rigor, and the semantic scope of "vehicle" often collapses into the purpose anyway, violating your constraint against lexicographical camouflage.

  **Candidate 2: The "Licensed Felon."**
  *Scenario:* A statute says the Board "shall issue" a license to anyone who "passes the exam." A applicant passes but has a relevant felony conviction not listed in the statute.
  *Discard Reason:* This risks turning on the "absurdity doctrine" or implied exceptions, which allows textualists to concede the point without abandoning their method. It also invites a semantic fight over whether "qualified applicant" implies moral fitness, violating the stable meaning constraint.

  **Candidate 3: The "Job Creation" Grant.**
  *Scenario:* A statute mandates a cash bonus for employers who "hire" a specific number of new employees. An employer hires them for one day to claim the bonus, then fires them.
  *Selection:* This avoids semantic drift ("hire" is stable), avoids absurdity (it's merely wasteful, not insane), and cleanly forces the Textualist to enforce a costly mandate based on strict compliance while the Purposivist limits liability based on unmet goals.

  ***

  ### The Fact Pattern

  The State Commerce Act provides: "The Department shall award a $5,000 bonus to any employer who hires ten new full-time employees during the fiscal year." The legislative record contains only general statements about "stimulating local employment" and "reducing unemployment," with no discussion of retention periods or eligibility timing beyond the hiring date. TechCorp, seeking the bonus, hires ten workers on June 29th, processes them through payroll, and terminates their employment on June 30th. On July 1st, TechCorp submits proof of the hiring transactions to the Department and demands the $5,000 bonus. The Department denies the claim, citing the statute's goal of economic stability. TechCorp sues for mandatory relief.

  ### Methodological Divergence

  **Textualist Reasoning:**
  The text is mandatory ("shall award") and conditional only on the act of hiring ("who hires") within the timeframe ("during the fiscal year"). The ordinary meaning of "hires" is the act of engaging an employee, which is undisputedly complete upon the formation of the employment contract and initial payroll processing. The statute contains no retention requirement, no "good faith" clause, and no duration minimum. Because the text covers TechCorp's conduct, the court must enforce the obligation regardless of whether the outcome aligns with the broader goal of stability; if the legislature wanted to prevent bonus-churning, it should have written "retains" instead of "hires."
  *Result:* **TechCorp wins (Broad Liability).**

  **Purposivist Reasoning:**
  The objective purpose of the statute, evidenced by the text's context ("new" employees) and the legislative recitals ("reducing unemployment"), is to stimulate sustained economic growth, not to subsidize administrative churn. Reading "hires" to include employment lasting less than 24 hours would frustrate this purpose by diverting public funds to transactions that produce no net economic benefit. Therefore, the operative verb "hires" must be limited by the statute's purpose to mean "hires into a position intended to be ongoing" or "hires and maintains."
  *Result:* **Department wins (Narrow Liability).**

  **The Point of Divergence:**
  The split occurs at the **integration of purpose into the operative condition**. The Textualist treats the purpose as external to the clear text (text covers the case, purpose is irrelevant unless ambiguous); the Purposivist treats the purpose as internal to the text (text is only clear *in light of* the purpose, so "hires" implicitly excludes sham hiring).

  ### Paired Near-Variant (Convergence)

  **The Variant:**
  Same statute, same facts, *except* TechCorp hired the ten employees on **July 2nd** (the first day of the *next* fiscal year).

  **Convergence:**
  Both methods deny the bonus. The Textualist denies it because the text explicitly limits eligibility to hires "during the fiscal year," and July 2nd is outside that window (semantic clear statement). The Purposivist denies it because stimulating employment in the *next* budget cycle does not serve the purpose of the *current* appropriation (purpose aligns with text).

  **Load-Bearing Feature:**
  The divergence in the original case rests entirely on the **absence of a temporal duration constraint in the text** despite its presence in the purpose. In the variant, the temporal constraint exists in the text (fiscal year dates), so both methods align.

  ### Honest Note on Feature Removal

  If you remove the "one-day retention" fact (i.e., TechCorp keeps the employees for a year), the case collapses into an **easy "Pay the Bonus" case** for both methods. The Textualist pays because the text is satisfied; the Purposivist pays because the purpose is fulfilled. The pedagogical value vanishes because there is no tension between text and purpose. Conversely, if you add the word "retains" to the statute, the case collapses into an **easy "Deny the Bonus" case** for both methods. The tension exists *only* where the text is over-inclusive relative to the purpose.

  ### Strongest Textualist Attack & Response

  **Attack:**
  "You have rigged this hypothetical by assuming a 'naive' textualist who ignores context. No serious textualist argues that 'hires' in the context of a subsidy statute means 'signs a contract for one minute.' Contextual clues ('new' employees, 'bonus') imply a meaningful employment relationship. By forcing my textualist to ignore context, you are attacking a strawman, not textualism."

  **Response:**
  "I am not ignoring context; I am distinguishing context from purpose. Context helps determine semantic meaning (e.g., 'hires' means employs, not 'buys'). Purpose determines policy scope (e.g., 'employs' means 'employs for a while'). If 'hires' semantically includes one-day hires—as dictionaries confirm—then excluding them requires a purpose-based limitation, not a semantic one. If your textualism allows purpose to delete clear text because the result is 'wasteful,' you are admitting that purpose trumps text whenever the legislature drafts poorly. My hypothetical forces you to admit that cost: either you pay the bonus (text wins) or you don't (purpose wins)."

  ### Note on Purpose Construction

  This pattern relies on **objective purpose** (the reasonable legislator seeks economic stability). It survives the switch to **actual-enacting-coalition purpose** only because the record is thin; there is no evidence the coalition *wanted* to subsidize churn. If the record showed a specific deal where a lobbyist demanded "hires" instead of "retains" to allow flexibility, the purposivist argument would weaken significantly, as the actual purpose might indeed have been broader than "stability."
