answer: |-
  (1) **What the practice strictly presupposes**
  The arrangement strictly presupposes that religious bodies are public corporations rather than private voluntary associations. It requires treating religious membership as a quasi-civic status acquired by record (baptism) and terminated by registry, not by personal belief alone. This demands a theory of "positive neutrality," where the state maintains impartiality by cooperating with all recognized faiths rather than ignoring them. Your substitutability condition is not required for the tax itself, which funds doctrine and worship, not just services. Instead, the tax presupposes religion performs a stabilizing public function worthy of state collection machinery. The state is not merely administering dues; it is recognizing the church as a partner in governance, implying that faith is a matter of public order, not purely private conscience. Membership is thus a legal condition, not a consensual contract.

  (2) **What it merely fits with and where it is philosophically underdetermined**
  Your substitutability condition fits the funding of hospitals and kindergartens under the principle of subsidiarity, where the state prefers non-state actors to deliver public services. However, it does not license funding theology faculties or clergy salaries. Here, the practice fits equally well with historical inertia (Concordats) or a "public good" theory where religion reduces social friction. The exit procedure is underdetermined: it treats membership as legal status (consistent with entry), yet the fee and friction suggest the state discourages exit, contradicting the voluntarism required for a free association. The claim that the state is "only administering dues" masks the coercive power used to enforce them, leaving it unclear whether the barrier protects the individual from rash decisions or protects the institution from revenue loss.

  (3) **What would break or have to be rebuilt if it were replaced by the American or the French arrangement**
  Replacing this with the American or French model would require redefining religion as purely private. The church tax would vanish, forcing churches to rely on voluntary giving, likely shrinking their infrastructure. The state would need to build parallel welfare systems to replace church-run hospitals, breaking the subsidiarity efficiency. Theology faculties would lose public funding, severing the link between academic theology and state universities. Finally, state neutrality would shift from cooperative to separational, requiring the state to ignore religion rather than manage it. Membership would become a contractual choice rather than a recorded status, removing the bureaucratic exit barrier but also the automatic social integration. The German system assumes religion is public infrastructure; the alternative assumes it is a private hobby.
