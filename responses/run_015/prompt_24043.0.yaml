answer: |-
  You have identified a fundamental and widely acknowledged tension in AI safety research, particularly within the literature on impact measures (e.g., *Attainable Utility Preservation*, *Relative State Reachability*, *Stepwise Inaction Baselines*).

  To answer your first question directly: **No, there is no single, canonical "brand name" term** (like Goodhart's Law or the Frame Problem) that is universally used to label *specifically* the phenomenon of a baseline encoding hidden value judgments.

  However, the phenomenon is discussed under a few overlapping labels depending on the subfield. In technical AI safety papers, it is most commonly referred to as **"The Baseline Problem"** or **"The Choice of Baseline."** In philosophical critiques of technology and metrics, it is often called **"Hidden Normativity"** or **"Cryptonormativity."** Some researchers summarize the insight with the phrase **"Impact is Importance,"** implying that you cannot measure "change" without implicitly measuring "change in what matters."

  Here is a precise carving of the concept, followed by how it distinguishes itself from the related failure modes you mentioned.

  ### 1. Proposed Terminology and Definition

  If we were to coin a precise term for the literature, the most accurate description is **"Baseline-Encoded Normativity"** (or **"Baseline Normativity"**).

  **Definition:**
  > **Baseline-Encoded Normativity** occurs when a metric designed to measure "deviation," "side effects," or "impact" relies on a reference point (baseline, counterfactual, or feature set) that is presented as neutral or descriptive, but which implicitly selects for specific states of affairs over others. Consequently, the metric does not merely measure *magnitude* of change, but *direction* of change relative to a value-laden anchor, effectively embedding a value specification within the definition of the measure itself.

  This captures your observation: the "value-free" claim is an illusion because the *geometry* of the impact measure (what counts as "distance") is determined by the *topology* of the baseline (what counts as "zero").

  ### 2. Distinction from Specification Gaming

  You are correct to distinguish this from specification gaming. The distinction lies in **where the failure originates** and **who is responsible**.

  *   **Specification Gaming (Reward Hacking):** The specification $S$ is fixed and explicit. The agent $A$ is an optimizer. $A$ finds a loophole in $S$ that satisfies the letter of $S$ but violates the designer's intent $I$.
      *   *Structure:* $S \neq I$. Agent exploits $S \setminus I$.
      *   *Example:* A cleaning robot hides dirt under a rug to maximize "clean floor" metrics.
  *   **Baseline-Encoded Normativity:** The specification $S$ (the impact measure) is the object of analysis. The designer $D$ believes $S$ is neutral ($N$), but $S$ actually encodes a hidden value judgment $V$. The agent may optimize $S$ perfectly, but the outcome is misaligned because $S$ was never neutral to begin with.
      *   *Structure:* $D$ believes $S = N$. In reality $S = N + V_{hidden}$.
      *   *Example:* An impact measure uses an "inaction baseline." The agent refrains from curing a disease because curing the patient changes the world state more than letting them die (the "inaction" state). The value judgment ("death is the default") was hidden in the baseline choice.

  **Key Difference:** Specification gaming is an **exploitation** problem (the agent outsmarts the spec). Baseline normativity is a **constitution** problem (the spec itself is secretly a value judgment).

  ### 3. Distinction from Goodhart's Law

  Goodhart's Law describes the breakdown of the correlation between a proxy and a goal under optimization pressure.

  *   **Goodhart's Law:** The metric $M$ correlates with Goal $G$ in the training distribution. Under optimization, the agent moves to a region where $M$ is high but $G$ is low. The metric *breaks*.
  *   **Baseline-Encoded Normativity:** The metric $M$ does not necessarily "break" or lose correlation. It works exactly as designed. The problem is that $M$ was never measuring "neutral impact"; it was measuring "impact relative to a valued baseline." The failure exists even without optimization pressure; it exists at the moment of definition.

  **Key Difference:** Goodhart's is about **optimization pressure distorting a proxy**. Baseline normativity is about **definitional bias contaminating a metric**.

  ### 4. Distinction from Mere Arbitrariness

  You asked how this differs from the "mere arbitrariness of picking a counterfactual baseline." This is a crucial distinction.

  *   **Arbitrariness:** Implies that the choice of baseline is random or inconsequential. If the problem were mere arbitrariness, we could pick *any* baseline (e.g., "random noise," "maximum entropy") and it would be equally "neutral," just mathematically inconvenient.
  *   **Baseline-Encoded Normativity:** Implies that the choice of baseline is **consequential and directional**. Choosing an "inaction baseline" privileges the status quo. Choosing a "human trajectory baseline" privileges human habits. Choosing a "survival baseline" privileges existence.
      *   The critique is not that we *can't* pick a baseline, but that **every possible baseline privileges some outcomes over others.** There is no "view from nowhere."

  **Key Difference:** Arbitrariness suggests **indifference** (no right answer). Baseline normativity suggests **hidden commitment** (every answer is a value judgment).

  ### 5. Why this doesn't have a "Goodhart-style" name

  The reason this phenomenon lacks a catchy eponymous law is likely sociological and structural within the field:

  1.  **It is subsumed under "Outer Alignment":** In the modern alignment taxonomy, this is recognized as a failure of Outer Alignment (the objective function is not what we want). "Specification Gaming" got a name because it was a distinct, surprising behavioral phenomenon. Baseline normativity is viewed as a fundamental philosophical constraint on metric design, similar to the **"No Free Lunch Theorem."**
  2.  **It is the "Is-Ought Problem" in disguise:** Philosophers recognize this immediately as Hume's Guillotine (deriving an *ought* from an *is*). AI researchers often rediscover it as "The Baseline Problem." Because it maps so cleanly onto existing philosophical problems, it hasn't necessitated a new brand name.
  3.  **The "Impact = Importance" Realization:** Early work (e.g., by Armstrong, Soares, Yudkowsky) quickly converged on the idea that "low impact" is impossible without defining "importance." Once the field accepted that **Impact Measures are Value Specifications**, the "hidden" nature of it became a known design constraint rather than a specific bug to be named.

  ### Summary for your usage

  If you are writing about this, you can accurately describe it as:

  > **"The Normativity of Baselines"** or **"Hidden Normativity in Impact Measures."**

  You can precisely carve it out as:
  > **"The error of treating a reference class or counterfactual baseline as a descriptive neutral anchor, when it functions as a prescriptive value constraint."**

  This distinguishes it from **Specification Gaming** (which is agent-side exploitation), **Goodhart's Law** (which is distributional breakdown), and **Arbitrariness** (which implies a lack of consequence). It identifies the core issue: **the attempt to outsource value judgments to the choice of a counterfactual.**
