  ### 1. The Three Precedential Criteria

  Your colleague's past rulings consistently distinguish between rules that capture the **underlying invariant** of the class and those that capture **contingent, accidental, or insufficient** properties. We can state these criteria precisely:

  1.  **Non-Enumerative Generalization (from B-11):** A rule must describe a general property that generates the classification, not a list of the specific instances found in the sample. A rule fails if it would misclassify a valid instance that simply wasn't in the original twelve (e.g., a seventh dot).
  2.  **Generative Invariance (from B-14):** A rule must describe properties intrinsic to the geometric figures, not artifacts of the specific rendering or generation process. A rule fails if it relies on ink style, resolution, or other parameters that the generator could randomize without changing the logical problem.
  3.  **Geometric Robustness (from B-18):** A rule must state a condition that is *necessary and sufficient* for the classification across the entire class of figures, not merely a correlate that happens to hold for the sample. A rule fails if there exists a possible figure consistent with the rule's wording that would belong to the opposite class (e.g., non-parallel segments that do not cross).

