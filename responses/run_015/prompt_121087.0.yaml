  9.  **Addressing the "First Time Run" Worries:**
      *   *Worry:* They think it's just coordinate changes.
      *   *Fix:* Use physical tokens on a fixed board. Do not let them rotate the board. The board is the "Substance." The tokens are the "Fields."
      *   *Worry:* They get bored with bookkeeping.
