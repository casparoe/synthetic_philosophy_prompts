      *   *Okay, I will follow the prompt's mechanism:* The points are relabeled. But to avoid the "trivial label" issue, the players must have bet on the *identity* of the point, not just the name.
      *   *Refined Plan:* The grid squares have permanent IDs (A1, A2...). Players bet "A1 will be Red." Facilitator swaps the physical properties of A1 and A2 inside the hole. Now A1 is Blue. The *pattern* is the same, the *assignment* changed.
      *   *Wait, if I swap properties, isn't that just changing the world?* Yes, that's the point. If points are individuals, swapping properties makes a *different world*. If the laws allow both, determinism breaks.
