      *   *Correction for Game:* The "Field" is represented by colored overlays or tokens placed on squares. The "Hole" is a region where the *laws* allow a shift. To simplify for laypeople: The "Law" says "Patterns propagate." Inside the Hole, the Law allows "Pattern Propagation OR Pattern Propagation + Shift."
      *   *Actually, the cleanest way:* The Facilitator prepares *two* end-states beforehand. Both are consistent with the start state and the rules. They differ only by a permutation of values within the Hole region.
