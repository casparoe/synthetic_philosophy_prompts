          *   Wait, the Hole Argument relies on the *fields* shifting over the *points*, not the matter moving.
          *   *Better:* The "Field" is the pattern of counters. The "Points" are the grid squares.
          *   Round 1: Establish laws (counters move according to rules).
          *   Round 2: Enter the Hole. The rules allow a "Gauge Shift."
