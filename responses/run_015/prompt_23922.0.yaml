answer: |-
  ### The Slogan in Plain Terms
  In everyday conversation, "don't make promises you can't keep" is pragmatic advice about reliability and reputation. It warns that committing to an outcome you are unable or unwilling to produce will lead to disappointment, broken trust, and social penalties. It treats promising as a transaction where your future performance is the currency, implying you shouldn't spend currency you don't possess.

  ### The Readings

  **1. The Physical Impossibility Thesis**
  *   **Thesis:** You are morally prohibited from promising to bring about states of affairs that are physically or logically impossible for you to achieve.
  *   **What "can't" means:** Physical or logical ability (e.g., "I promise to fly unassisted").
  *   **Does it dismiss your case?** No. Your thought experiment involves someone who *could* do X but chooses Y; physical ability is not in question. This reading is irrelevant to insincere promising.

  **2. The Epistemic Limitation Thesis**
  *   **Thesis:** You should not promise unless you have sufficient evidence or knowledge that you will be able to fulfill the obligation.
  *   **What "can't" means:** Epistemic certainty (e.g., "I promise to come, though I might get sick").
  *   **Does it dismiss your case?** No. This addresses uncertainty, not deceit. Your promiser knows exactly what they intend to do; they aren't guessing they might fail, they are planning to fail.

  **3. The Sincerity Condition Thesis**
  *   **Thesis:** A necessary condition for the speech act of "promising" to occur is that the speaker intends to perform the action.
  *   **What "can't" means:** Psychological willingness/intention (e.g., "I promise" implies "I intend").
  *   **Does it dismiss your case?** Yes, potentially. If intention is a *felicity condition* (like J.L. Searle argues), then an insincere utterance is a "misfire"—it looks like a promise but isn't one. If it's not a promise, there is no obligation to keep it.
  *   **Counter:** Many philosophers (e.g., Scanlon, Sheinman) argue the obligation arises from the *expectation created in the promisee*, not the internal state of the promiser.

  **4. The Constitutive Invalidity Thesis**
  *   **Thesis:** If you lack the intention to keep a promise at the moment of utterance, the promise is void *ab initio* (from the start) and generates no normative bond.
  *   **What "can't" means:** Normative capacity to bind oneself (linked to intention).
  *   **Does it dismiss your case?** Yes, directly. It claims your thought experiment describes a nullity, not a broken promise. It asserts that without intention, the "binding" mechanism never engages.
  *   **Counter:** This conflates the *wrong of lying* with the *obligation of promising*. Even if the entry was fraudulent, the promisee now relies on the word; the obligation may arise from that reliance, not the promiser's prior state.

  **5. The Independent Wrong Thesis**
  *   **Thesis:** Making a promise you don't intend to keep is indeed wrong, but it is the wrong of *lying*, not the wrong of *breaking a promise*.
  *   **What "can't" means:** Willingness to be truthful.
  *   **Does it dismiss your case?** No, it actually supports your intuition that a wrong occurred, but re-categorizes it. It concedes the utterance was bad but denies it created a specific promissory obligation to do X.
  *   **Counter:** This splits hairs unnecessarily. If the promisee is entitled to expect X, the distinction between "lying about a promise" and "breaking a promise" often collapses in practice.

  **6. The Prudential Warning Thesis**
  *   **Thesis:** You shouldn't make promises you won't keep because you will suffer negative consequences (loss of trust, retaliation), not because it violates a moral law.
  *   **What "can't" means:** Strategic viability.
  *   **Does it dismiss your case?** No. This is advice, not a metaphysical claim about the nature of promising. It doesn't address whether the obligation exists, only whether it is smart to incur it.
  *   **Counter:** This reduces morality to prudence. Even if you won't get caught, most theories of promising hold that you are still bound.

  ### My Verdict

  Your classmate is most likely conflating **Reading 3 (Sincerity Condition)** with **Reading 4 (Constitutive Invalidity)**. They are assuming that because the promiser lacked intention, the promise "doesn't count." This is a substantive philosophical claim (associated with Searle), not a self-evident truth. Readings 1, 2, and 6 are trivial platitudes that don't apply to your case; Reading 5 concedes a wrong occurred but shifts the label.

  **What to say back:**
  Tell him the slogan is ambiguous. If he means "insincere promises aren't real promises" (Reading 4), ask him why the promisee's reliance doesn't generate an obligation regardless of the promiser's secret intent. If he means "it's wrong to lie" (Reading 5), agree, but insist that the lie *creates* the promissory obligation precisely because the promisee now expects performance. The slogan doesn't prove the obligation vanishes; it only proves the entry was fraudulent.
