  **Brainstorming**

  The user's intuition about convexity is the correct lever. The Gibbard–Satterthwaite (GS) proof relies on "pivotality": in a deterministic setting, moving an alternative up a ranking causes a discrete jump in the outcome (from $y$ to $x$). This creates a threshold where a voter becomes decisive over a pair. In a randomized setting, the outcome space is the simplex (convex). Moving an alternative up shifts probability mass continuously. There is no sharp threshold where power is seized; power is shared via probabilities. This dissolves the pivotality argument.

  Regarding the skeptic's worry: The user's suspicion is correct. First-order stochastic dominance (FOSD) is equivalent to expected utility dominance for *all* utility functions consistent with the ordinal ranking. If truth-telling yields a lottery that FOSD-dominates the lie's lottery, it yields higher expected utility for every admissible utility function. Thus, "extension-robustness" collapses into SD-strategy-proofness. The skeptic is wrong that this is a cheat; it is a robustness guarantee. However, it does restrict the domain of preferences over lotteries to those respecting FOSD (no risk-seeking that violates dominance).

  Regarding the cost: The user's "ex ante dictator" description is accurate but incomplete. The deeper cost is the inability to aggregate compromise. Random Dictatorship (RD) ignores how many people rank an alternative highly, caring only about who ranks it first. This means broadly acceptable compromises may receive zero probability if no one ranks them top. The class of SD-strategy-proof rules is also vanishingly small (essentially only mixtures of dictators), meaning we haven't found a rich new family of rules, just a probabilistic version of the old impossibility.

  **Explanation**

  Your intuition about convexity is precisely where the mechanical leverage lies. In the deterministic proof, the outcome space is a finite set of alternatives. When you move an alternative $x$ up in your ranking, the social choice function must jump discontinuously from some $y$ to $x$ at some specific profile. This jump creates a "pivotal" voter who dictates the outcome between $x$ and $y$ holding others fixed. The proof proceeds by showing these local dictatorships must align into a global dictator.

  Randomization changes the geometry of the outcome space from a discrete set to a convex simplex of lotteries. When you move $x$ up in a randomized rule like Random Dictatorship, you do not trigger a discrete jump. Instead, you continuously shift probability mass from lower-ranked alternatives to higher-ranked ones. Because the outcome changes marginally rather than discretely, there is no threshold where a voter seizes decisive power over a pair. The "pivotality" argument collapses because no single voter ever determines the outcome with probability one (unless the lottery degenerates). The escape is indeed structural: by convexifying the outcome space, you remove the discontinuities that the deterministic impossibility theorem exploits to force dictatorship.

  Regarding your skeptic, your suspicion is mathematically sound. Strategy-proofness under first-order stochastic dominance (SD) is equivalent to strategy-proofness for all expected-utility extensions consistent with the ordinal ranking. If truth-telling yields lottery $L$ and lying yields $L'$, and $L$ dominates $L'$ by SD, then the expected utility of $L$ is greater than or equal to that of $L'$ for *every* utility function that respects the voter's ordinal ranking. Therefore, an SD-strategy-proof rule is automatically "extension-robust" in the sense you defined. The skeptic claims we have made the ordering "thin," implying we have weakened the incentive constraint. In one sense, they are right: we only require immunity against manipulations that improve outcomes in the SD order, not manipulations that might appeal to specific risk preferences violating SD. However, within the standard rational choice framework (where preferences over lotteries respect dominance), SD-strategy-proofness is the strongest possible incentive guarantee. It is not a cheat; it is a robustness result that holds across all standard preference extensions.

  However, you must locate the residual cost accurately. Your description—"we made the identity of the dictator unknown ex ante"—is the standard interpretation, but it obscures a substantive loss of democratic function. Random Dictatorship is ex post efficient (it only selects Pareto-optimal alternatives), but it is blind to compromise. If 99% of voters rank a compromise candidate $c$ second, and 1% rank an extreme candidate $e$ first, Random Dictatorship gives $e$ a 1% chance of winning and $c$ zero chance (unless someone tops $c$). The rule ignores the breadth of support. It treats a fanatic's top choice as equal weight to a moderate's top choice, regardless of how much everyone dislikes the fanatic's choice.

  This implies that the comfort this result offers a democrat should be limited. We have not escaped the logic of dictatorship; we have merely randomized it. Gibbard's characterization theorem for randomized rules shows that the class of SD-strategy-proof rules is vanishingly small: essentially, they must be mixtures of deterministic dictators. We have not found a way to aggregate intensity or consensus without inviting manipulation. We have traded the certainty of a single dictator for the uncertainty of a lottery over dictators, preserving incentive compatibility at the price of ignoring all information in the ballots except each voter's top choice. The cost is not just asymmetry; it is the inability to select broadly acceptable outcomes that are no one's first priority. You have saved strategy-proofness, but you have surrendered the ability to govern by consensus.
