answer: |-
  "So, Dave says 'bicycle' is just a handy predicate. But I say look at the inventory. Mass. Charge. Spin. That's the furniture. 'Bicycle' isn't instantiated anywhere. It's not in the ontology. So really, Dave, there's no such thing as a bicycle. Which is convenient, because I borrowed yours. I didn't steal a bicycle. I just rearranged some mass and charge you decided to label 'property.' You can't charge me with theft if the stolen object isn't ontologically grounded. Cheers to the inventory."

  This joke bombs because it conflates the existence of *natural kinds* (which she denies "bicycle" is) with the existence of *particular objects* (which both she and the nominalist accept). A nominalist grounds theft in the displacement of particulars, not the instantiation of universals, so the punchline fails logically even on her own terms. Additionally, sparse realism doesn't deny composite objects exist, only that they are fundamental universals, making her exculpation metaphysically incoherent.
