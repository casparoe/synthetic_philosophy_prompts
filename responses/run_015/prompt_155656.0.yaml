answer: |-
  1. The job
  This framework solves the problem of distinguishing between a theory that is temporally displaced (right mechanism, wrong date) and one that is fundamentally broken (wrong mechanism). It prevents us from dumping deep structural insights just because short-term data noise or temporary tech breakthroughs obscure the trend. Conversely, it stops us from clinging to "zombie theories" that survive only by constantly pushing the doomsday date further into the future without explaining why.

  2. The must-haves
  *   **Causal Invariance:** The core physical or logical link must remain true regardless of timing shifts. For AI, this means the thermodynamic cost of logic operations remains fixed even if chip architecture changes; for climate, it means carbon retention physics hold even if absorption rates fluctuate.
  *   **Explicit Defeaters:** You must pre-commit to a specific future observation that would permanently kill the theory. If you claim AI will hit an energy wall, you must admit that discovering room-temperature superconductors with zero resistance would falsify your claim.
  *   **Finite Auxiliary Budget:** You are allowed a limited number of "exception" clauses (like tech breakthroughs or policy shifts) to explain delays before the theory is considered exhausted.
  *   **⚠️ Conflict Flag:** **Causal Invariance** and **Finite Auxiliary Budget** cannot be fully satisfied simultaneously. Maintaining strict invariance often requires adding new auxiliary explanations for every delay (eating up the budget), while preserving the budget often requires admitting the mechanism is more flexible than originally claimed.

  3. Hard vs soft
  **Explicit Defeaters** and the **Finite Auxiliary Budget** are non-negotiable hard constraints; without them, the theory becomes immune to evidence and turns into dogma. **Causal Invariance** is softer; mechanisms can be refined or narrowed as long as the core directional pressure remains intact. Camp preferences usually show up here: skeptics demand strict invariance to kill the theory quickly, while proponents want a flexible mechanism to keep it alive, but both must agree on the budget and defeaters or the debate is meaningless.

  4. Scorecard
  *   **Strict "Falsify and Ditch" View:** Fails on **Causal Invariance** because it treats timeline misses as mechanism failures (e.g., declaring climate models dead because a specific tipping point didn't trigger in 2020). It scores high on discipline but misses slow-moving causal chains.
  *   **"Protect the Core Program" View:** Fails on **Finite Auxiliary Budget** because it allows infinite rescues (e.g., "Malthus was right, just wait another century"). It preserves the insight but loses predictive power, becoming unfalsifiable.
  *   **"Mechanism-First Rescue" View:** Passes **Causal Invariance** and **Explicit Defeaters** but struggles to define the limit on the **Auxiliary Budget**. It is the most robust for long-term planning but requires honest consensus on when the "rescue count" hits zero.

  5. The killer
  The **Finite Auxiliary Budget** wipes out the most competitors because it forces a stop-loss on "just wait longer" arguments. Most rescued theories die here because they rely on infinite technological optimism to explain away finite resource constraints.
