  **MEMORANDUM**

  **TO:** All Institute Personnel
  **FROM:** Department of Human Capital Optimization
  **DATE:** October 14, 2024
  **SUBJECT:** Mandatory Cognitive Tier Reclassification and Workflow Alignment

  Effective November 1, the Institute for Comparative Cognition will transition to a stratified operational model based on the Voss-Cognitive Taxonomy. This restructuring aligns employee responsibilities with their inherent cognitive architectures to maximize institutional fitness. All staff have been assigned a Tier classification (Darwinian, Skinnerian, Popperian, or Gregorian) based on Q3 psychometric audits.

  **1.0 Policy Clauses by Tier**

  **1.1 Darwinian Tier (Hardware-Locked)**
  Employees classified as Darwinian possess fixed behavioral repertoires optimized for environmental stability. To prevent system conflict, IT will disable all software updates and patch installations for these workstations. Adaptation to new market conditions will occur through natural selection of role holders rather than individual upskilling. Darwinian staff are exempt from continuing education requirements.

  **1.2 Skinnerian Tier (Reinforcement-Responsive)**
  Skinnerian personnel will operate under variable-ratio compensation schedules. Base salary is suspended in favor of performance pellets issued immediately following high-frequency keystroke events. Extinction protocols will be applied to behaviors failing to produce measurable output within three business cycles. Breaks are permitted only after sustained periods of operant conditioning compliance.

  **1.3 Popperian Tier (Simulation-Capable)**
  Popperian staff are authorized to run internal simulations before action. To ensure safety, all mental models must be submitted in triplicate to Risk Management. This allows hypotheses to die in conference rooms rather than in the field. Popperians absorb project failure risks so higher tiers do not have to. Error reporting is mandatory within one hour of cognitive dissonance.

  **1.4 Gregorian Tier (Tool-Enhanced)**
  Gregorian personnel are recognized as the primary users of cultural mind-tools and language memes. This tier retains exclusive access to management software and strategic planning interfaces. As the natural stewards of institutional knowledge, Gregorians are authorized to delegate tasks to lower tiers. Leadership roles are reserved exclusively for this classification.

  **2.0 Administrative Commentary**

  Dr. Aris Voss, Chief Taxonomist of Mind Types, defended the hierarchy during the town hall. "Efficiency requires acknowledging natural limits," Dr. Voss stated. "Expecting a Darwinian unit to utilize a Gregorian tool is not only inefficient; it is a category error. We are simply organizing the ecosystem to reduce friction between biological imperatives and corporate goals."

  **3.0 Grievance Procedure**

  Employees wishing to contest their classification must submit Form 74-Delta (Request for Cognitive Reassessment). Note: Darwinian and Skinnerian tiers are biologically precluded from filing grievances regarding hierarchy. Only Popperian and Gregorian tiers may appeal based on simulated future outcomes.

  ***

  **SIDEBAR: FACILITY UPDATE – BREAK ROOM PROTOCOLS**

  **Subject:** Mind-Type Neutral Zone Regulations
  **Location:** 4th Floor Lounge

  To prevent meme pollution and cognitive overload, the 4th Floor Lounge is now designated a Mind-Type Neutral Zone. Usage is permitted for all tiers, but communication restrictions apply.

  *   **Darwinian/Skinnerian:** Non-verbal communication only.
  *   **Popperian:** Speech limited to hypothesis testing.
  *   **Gregorian:** Language use is taxed by the minute.

  Gregorian staff must swipe their badges upon speaking. The first five minutes of verbal communication per day are complimentary. Subsequent speech will be deducted from accrued leave time. This ensures high-value cultural tools are not depreciated through overuse in casual settings.

  ***

  **4.0 Compliance**

  Failure to adhere to Tier-specific protocols will result in immediate reclassification or removal from the ecosystem. Please update your email signatures to reflect your new Cognitive Tier by Friday.

  **Human Capital Optimization**
  *Institute for Comparative Cognition*
