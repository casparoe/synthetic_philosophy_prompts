answer: |-
  # Workshop Plan: "The Editorial Board of Consciousness"
  **Time:** 75 mins  
  **Participants:** 9 (3 groups of 3)  
  **Goal:** Visceral demonstration that "conscious experience" is a post-hoc editorial construct, not a direct recording.

  ## Materials
  *   **3 Laptops/Phones** (one per group) to run a simple slide deck (or printed packets if tech fails).
  *   **Index Cards** (3 colors: White, Yellow, Pink).
  *   **Pens.**
  *   **Timer** (projected or phone).
  *   **Scoreboard** (whiteboard).

  ## Setup (5 mins)
  Don't mention Dennett. Don't mention the "Cartesian Theater." Tell them this is a study on **memory accuracy and narrative consistency**.

  Split into 3 groups of 3. Assign roles:
  1.  **The Experiencer (Subject):** Views the stimuli.
  2.  **The Producer (Editor):** Writes the "Official Record."
  3.  **The Auditor:** Tracks time and awards points.

  ## The Task: Rapid Visual Sequence (10 mins)
  *   **Stimuli:** A sequence of 10 colored shapes flashed for 200ms each (e.g., Red Circle, Blue Square, Green Triangle...).
  *   **The Twist:** The sequence contains an ambiguity (e.g., a color that looks teal/blue depending on the screen, or a shape flashed twice in a row).
  *   **Experiencer Action:** Immediately after the sequence, the Experiencer gets 3 White Cards. They must write **three separate "Draft Notes"** about what they saw.
      *   *Rule:* They must write them in order. If they hesitate on Card 2, they must write the hesitation. (e.g., Card 1: "Red." Card 2: "Wait, looked orange?" Card 3: "Definitely Red.")
      *   *Privacy:* They keep these cards face down.

  ## Round 1: The Conflict (20 mins)
  1.  **Handover:** Experiencer passes the 3 Draft Cards to the Producer.
  2.  **Production:** The Producer must create **One Official Record** (on a Pink Card).
      *   *Constraint:* The Official Record must be a single, coherent sentence. No "maybes."
      *   *Secret Instruction to Producer:* "Your goal is maximum coherence. If the Drafts contradict, pick the one that makes the best story. Ignore the doubt."
  3.  **The Payoff (The Trap):**
      *   The Auditor awards **10 Points** if the Official Record is internally consistent.
      *   The Auditor awards **0 Points** if the Official Record mentions uncertainty (e.g., "I think it was...").
      *   *Crucial:* Points are **not** awarded for matching the actual slides. Points are for *story smoothness*.
  4.  **The Interrogation:**
      *   The Experiencer is shown the Pink Card (Official Record).
      *   Ask the Experiencer: "Is this what you experienced?"
      *   *Rule:* If the Experiencer says "Yes," the group gets a **5 Point Bonus**. If they say "No, my Drafts were different," no bonus.
  5.  **Debrief Round 1:** Ask the Producers: "Did you discover the truth or write a story?" Ask Experiencers: "Did you feel like you were lying when you said 'Yes'?"

  ## Round 2: Switch Roles (20 mins)
  *   Rotate roles (Experiencer → Producer → Auditor).
  *   **New Rule for Experiencer:** You must write contradictory Drafts on purpose. (e.g., Card 1: "Blue." Card 2: "Green.").
  *   **New Rule for Producer:** You must reconcile them into one truth.
  *   **New Rule for Payoff:** Points are only awarded if the Experiencer *verbally defends* the Official Record against the Auditor's skepticism, even if the Auditor points out the Draft contradiction.
  *   *Why:* This forces the Experiencer to adopt the Editor's fiction as their own memory to win the game.

  ## The Reveal & Debrief (20 mins)
  *   **Tally Scores:** Announce winners. Note that the winners likely had the smoothest lies, not the most accurate vision.
  *   **The Question:** "In Round 2, when the Experiencer defended the Official Record despite their own Draft Cards saying otherwise—whose version was the 'real' experience?"
  *   **Let them argue.** They will likely split. Some will say "The Subject knows best." Others will say "The Record is what counts."
  *   **Drop the Term:** Now introduce **The Cartesian Theater**.
      *   Explain: "You just assumed there was a 'real' version hidden in the Subject's head that the Editor was either finding or distorting. That hidden screen is the Theater."
  *   **Map to Dennett:**
      *   **Draft Notes:** Multiple Drafts Model. Parallel processing, some fade, some get amplified.
      *   **Official Record:** The "fame" in the brain. What gets cited in the narrative.
      *   **The Payoff Scheme:** Evolutionary pressure. We are selected for coherence and social utility, not metaphysical accuracy.
      *   **The Experiencer's 'Yes':** There is no fact of the matter. Once the report is made, that *becomes* the experience.

  ## Predicted Glitches (Be Ready)
  1.  **First-Person Authority Wall:** An undergrad will insist, "But I *know* what I saw. The Editor is just lying."
      *   *Counter:* "In the brain, the 'Editor' is also you. It's a different neural pathway. If the language center overrides the visual center, which one is the 'self'?"
  2.  **Giggle Factor:** They might treat it as a game of "telephone" and miss the philosophical weight.
      *   *Fix:* During debrief, get serious. "If this game structure matches how your brain works, you have never seen the world directly. You have only ever read the Official Record."
  3.  **Time Management:** The visual task might drag. Keep the slide deck strict (200ms). If tech fails, use a physical deck of cards flipped rapidly.

  ## The Honest Limitation (For Your Notes)
  This activity proves that **reports** are constructed. It does *not* prove that **qualia** (the raw feel) are constructed.
  *   **What it misses:** Dennett goes further. He suggests there is no "intrinsic" feel beyond the disposition to report. The students will still feel, "Okay, the *story* is fake, but the *redness* I felt was real."
  *   **How to handle:** You have to state this plainly in the last 5 mins. "Dennett's hard pill: The 'redness' isn't a property of the experience; it's a property of the judgment. If you can't distinguish it from the report, why posit the extra step?"
  *   **Warning:** This is where the undergrads might check out. Keep it punchy. "If the theater is empty, who is watching the movie? No one. There is just the movie editing itself."

  ## Contingency for the "Undergrads Who Shouldn't Be There"
  If they get lost in the philosophy:
  *   Give them the **Auditor** role. It requires rule-following, not abstract reasoning.
  *   Ask them specifically during debrief: "Did the rules make it hard to tell the truth?" (Concrete question).

  ## Timeline Summary
  *   **00-05:** Intro & Grouping.
  *   **05-25:** Round 1 (Drafts vs. Official Record).
  *   **25-45:** Round 2 (Forced Defense of Fiction).
  *   **45-65:** Debrief & Theory Mapping.
  *   **65-75:** Limitations & Wrap.

  *Note: If you run out of time, cut Round 2. Round 1 is sufficient to show the Editor manufactures coherence. Round 2 just tightens the screw on the Subject's authority.*
