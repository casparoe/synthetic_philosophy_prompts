answer: |-
  **SEMINAR PREPARATION SHEET: QUESTION PERIOD**
  **Topic:** Phenomenal Judgment as Structural Mapping in Predictive Processing
  **Audience:** Analytic Philosophers, Predictive-Coding Neuroscientists, Philosophers of Science

  ---

  ### 1. The 'Smuggled Causation' Objection (Priority: Critical)
  **Interlocutor:** Philosopher of Mind / Philosopher of Science
  **The Objection:** "You claim that second-order tracking operates via structural mapping rather than causal transmission. However, for a judgment to structurally map a phenomenal state, information regarding that state must constrain the judgment mechanism. If the phenomenal property itself exerts no causal influence, what carries this constraint? It appears you are presupposing the very causal efficacy you deny, merely relocating it from 'force' to 'structure'. Without specifying the neurocomputational implementation, isn't this simply a reductionist account in disguise, where the physical realiser does all the work and the 'phenomenal' label is ornamental?"

  **Proposed Reply:**
  "I concede that *some* physical substrate must carry the constraint; I am not denying physical causal closure. My claim is that the *phenomenal description* captures a specific informational geometry within the hierarchical model that the purely physical description obscures. In predictive processing, 'causation' at the personal level is often best understood as the enforcement of coherence constraints across a Markov blanket, rather than billiard-ball pushing. The phenomenal state does not push the judgment; rather, both the state and the judgment are coupled by the system's imperative to minimise variational free energy. The mapping is real because the system's architecture enforces isomorphism between levels to prevent prediction error. We are not smuggling in causation; we are recognising that in a hierarchical generative model, structural coherence *is* the functional equivalent of causal tracking, without requiring the phenomenal property to act as an independent efficient cause."

  **Weakness/Concession:**
  *   **Vulnerability:** This relies heavily on the assumption that 'structural coherence' can be metaphysically distinct from 'physical causation' without violating causal exclusion.
  *   **Concession:** I must admit that without a concrete neurocomputational model showing *how* this isomorphism is maintained without direct feedback, this remains a promissory note. I cannot yet rule out that the 'phenomenal' is merely a heuristic gloss on the physical realiser's causal work.

  ---

  ### 2. The 'Disguised Feedback Loop' Objection
  **Interlocutor:** Predictive-Coding Neuroscientist
  **The Objection:** "You speak of 'coherence constraints' and 'error minimisation'. In our models, these are instantiated by backward and forward connections between cortical layers—explicit neural feedback loops. If your structural mapping relies on error signals propagating up the hierarchy to update the generative model, that is a causal process. Are you not simply redescribing standard recurrent processing as 'phenomenal judgment' to avoid the hard problem, whilst relying on the very neural causality you claim is irrelevant to the phenomenal property?"

  **Proposed Reply:**
  "There is no disagreement that the *physical implementation* involves causal feedback loops. My contention concerns the *explanatory role* of the phenomenal property within that loop. In standard accounts, the experience is often treated as the output or the cause of the report. In my view, the experience is the *content* of the model being tracked. The neural feedback ensures the model's accuracy, but the *phenomenal character* is what is being modelled, not the mechanism doing the modelling. To say the judgment is causally inert regarding the property is to say that the *what-it-is-likeness* does not add energy to the system; the system's dynamics are sufficient. We avoid the mystery of how 'feelings' move neurons by acknowledging that the neurons move themselves to accord with the feeling, driven by prior expectations of coherence."

  **Weakness/Concession:**
  *   **Vulnerability:** Neuroscientists may view the distinction between the 'content of the model' and the 'mechanism' as semantic rather than biological.
  *   **Concession:** I must concede that if 'phenomenal property' is fully exhausted by the neural activity pattern, my distinction collapses into type-identity theory. I need to maintain that the phenomenal property is the *informational state*, not the *electrochemical state*, to preserve the argument.

  ---

  ### 3. The 'Epistemic Grounding' Objection
  **Interlocutor:** Analytic Philosopher of Mind
  **The Objection:** "If the phenomenal property plays no causal role in producing the judgment, why is the judgment *about* that property and not another? This is the problem of reference. If the causal chain originates entirely in the physical realiser, the judgment is causally grounded in the physical, not the phenomenal. You risk rendering introspective reports epistemically groundless; we might be reliable, but we lack justification, as the truth-maker (the experience) is disconnected from the belief-forming mechanism."

  **Proposed Reply:**
  "This assumes a causal theory of reference which I am challenging. In a predictive processing framework, reference is secured by functional role within the generative model, not by external causal tagging. The judgment is about the phenomenal state because it occupies the specific node in the hierarchical structure designated for second-order monitoring of that state. Reliability arises from the system's evolutionary tuning to minimise error between the first-order state and the second-order model. We have justification because the system is designed such that divergence between the state and the report constitutes a prediction error that the system is compelled to correct. The grounding is internal to the system's logic of coherence, not external causal contact."

  **Weakness/Concession:**
  *   **Vulnerability:** This moves the goalposts from externalist epistemology to internalist coherence, which many physicalists find insufficient for 'knowledge'.
  *   **Concession:** I must acknowledge that this account secures *reliability* more robustly than *justification*. If pressed, I may have to accept a deflationary account of self-knowledge where 'knowing' means 'successfully modelling' rather than 'causally grasping'.

  ---

  ### 4. The 'Eliminativism by Stealth' Objection
  **Interlocutor:** Physicalist Philosopher of Science
  **The Objection:** "You claim to avoid eliminativism, but if phenomenal properties have no causal efficacy, not even on our judgments, in what robust sense do they exist? If a property makes no difference to the physical world, including the speech acts we use to describe it, it appears to be an ontological free rider. Are you not offering a property dualism that grants existence but denies reality?"

  **Proposed Reply:**
  "I reject the premise that causal efficacy is the sole criterion of ontological reality. In predictive processing, properties exist as latent variables in a generative model that successfully predict sensory inputs. Phenomenal properties are real insofar as they are indispensable variables for the system's self-modelling. To remove them would degrade the model's predictive accuracy regarding the organism's own behaviour. They are not 'free riders'; they are structural invariants. We avoid eliminativism by insisting that the first-person perspective is a valid level of description for these invariants, even if the causal heavy-lifting is done by the sub-personal architecture."

  **Weakness/Concession:**
  *   **Vulnerability:** This risks alienating strict physicalists who view 'indispensable variables' as merely instrumental, not real.
  *   **Concession:** I must be careful not to drift into instrumentalism. I need to argue that the *structure* is real, and the phenomenal property *is* that structure, not just a useful fiction. If I cannot do this, the charge of eliminativism stands.

  ---

  **GENERAL ADVICE FOR THE CHAIR**
  *   **Timekeeping:** Please enforce the two-minute limit strictly; the nuances here require brevity to avoid muddying the causal/explanatory distinction.
  *   **Tone:** I am aiming for a collaborative dissolution of the paradox, not a defensive fortification of epiphenomenalism. If a concession is necessary regarding the neurocomputational specifics, I will make it openly to maintain credibility with the scientists in the room.
