  Two division heads, A and B, co-lead a platform development. Each sunk $1M; completion costs $500k more. Market data confirms obsolescence; completion revenue is $400k total. Both face identical choices: abort or finish. To outsiders, the venture is a dead end. However, A's capitalization agreement allows 50% recovery of sunk costs upon certified completion; B's equity stake offers no recovery. Aborting forfeits sunk costs entirely for both; only completion unlocks A's recovery. Both received the same negative data yesterday. A funds the next stage; B withdraws. Observers diagnose A with escalation of commitment, unaware that A's sunk costs function as recoverable collateral while B's do not.

  **Work:**
  *   **Party B (Thinly Sunk):**
      *   Quit: $0 future flow. (Sunk $1M ignored).
      *   Finish: $200k (share of revenue) - $500k (cost) = -$300k.
      *   **Verdict:** Quit ($0 > -$300k).
  *   **Party A (Thickly Sunk):**
      *   Quit: $0 future flow. (Sunk $1M forfeited).
      *   Finish: $200k (revenue) - $500k (cost) + $500k (50% sunk recovery) = +$200k.
      *   **Verdict:** Finish (+$200k > $0).
  *   **Observer:** Sees Revenue $400k, Cost $500k. Calculates -$100k net. Diagnoses A as irrational.

  **Feature:** Contingent recovery tied to sunk magnitude.
  **Collapse:** Without recovery, A loses $300k by finishing. A's decision becomes indistinguishable from bias.
  **Objection:** "You changed the project. A isn't finishing the platform; A is harvesting a tax credit. The sunk cost isn't driving the decision; the new incentive is."
  **Establishes:** That "sunk costs" are never truly sunk if contractual structures attach future value to past expenditure. It challenges the boundary of what constitutes "the project."

  **Theory:**
  *   **Settled:** Rational agents ignore sunk costs *unless* they alter future payoffs (the thick/thin distinction).
  *   **Contested:** Whether real-world escalation is primarily driven by hidden structural incentives (rational) or psychological commitment (bias).
  *   **Load-bearing Empirical Claim:** That managers accurately perceive and act upon these downstream financial contingencies despite negative operational feedback.
  *   **Confidence:** Moderate. While financial structures exist, behavioral noise often obscures rational calculation in practice.
