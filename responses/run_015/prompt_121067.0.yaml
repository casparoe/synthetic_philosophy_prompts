prompt: |-
  Draft the joint statement that a neural-complexity gradualist and a categorical-status anti-quantifier could both sign after a good-faith adversarial collaboration on whether brain size is morally relevant.

  The gradualist holds that moral status varies continuously with neural complexity—including brain size, connectivity density, and information-integration capacity—so differences in these metrics between typical adult humans, cetaceans, individuals with extreme microcephaly, and scaled artificial neural networks generate real, graded differences in moral weight, even if no simple linear formula applies.

  The categorical-status anti-quantifier holds that moral status is not graded by quantitative neural metrics; brain size is at best an unreliable proxy and at worst a pernicious confound, since moral status depends on categorical properties—such as being a subject of a life, standing in reciprocal moral relations, or possessing rational autonomy—that do not come in degrees tied to neuron count or parameter scale.

  The document should contain:

  1. A numbered Agreed Claims section (claims both sides can sign) covering: the empirical correlation between brain size and certain cognitive capacities in known species; that extreme microcephaly in humans does not eliminate basic moral protections; that cetaceans possess larger brains than many humans but different cognitive architectures; that scaling parameter counts in artificial neural networks raises structurally analogous questions about quantitative capacity; and that no defensible moral theory assigns status by raw brain mass alone.

  2. A Disagreements Table with four columns: Crux; Gradualist formulation (worded so the gradualist accepts it); Anti-quantifier formulation (worded so the anti-quantifier accepts it); Residual disagreement classification (substantive or verbal).

  The cruxes must include at least: (a) whether continuous gradation in neural metrics implies continuous gradation in moral status or only in instrumental value; (b) whether evolutionary origin or "naturalness" of a brain architecture affects the moral relevance of its size; (c) how to assess moral status in artificial systems scaled to brain-comparable parameter counts without biological embodiment.

  For each crux, identify one concrete case or argument both sides agree bears on it, and record in advance what each side predicts that case demonstrates.

  Conclude with an explicit verdict on whether any part of the dispute is verbal—if so, identify exactly which formulations map onto the same underlying disagreement and why.

  After the joint statement, provide a brief structured summary as a JSON object with exactly these fields:
  - "domain": string
  - "parties": array of two strings
  - "agreed_claims_count": integer
  - "cruxes": array of objects, each with "crux_name" (string), "test_case" (string), "gradualist_prediction" (string), "anti_quantifier_prediction" (string)
  - "verbal_dispute_detected": boolean
  - "verbal_dispute_explanation": string (empty string if false)

  Keep the response focused and formal. Do not include bibliographies, reading lists, citations, or references to obscure theories or specific texts that a small language model could not reasonably have memorized. Do not use verbatim quotations enclosed in quotation marks from any real published text.
