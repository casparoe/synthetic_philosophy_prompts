answer: |-
  The dinner party defense of Thomas Malthus has become a reflex among the intellectually cautious. When the specter of overpopulation is raised, the rebuttal is always the same: *Malthus wasn't wrong; he was just premature.* The argument suggests that the trap is still waiting for us, that the Green Revolution was merely a reprieve, and that the grim arithmetic of subsistence will eventually catch up to the geometric ambition of human reproduction.

  This defense is seductive because it sounds humble—it acknowledges our current luck while maintaining a sober vigilance. But philosophically, it is a disaster. To claim Malthus was "right but early" is not to rescue his theory; it is to confess that the theory is dead. It transforms a specific scientific hypothesis into an unfalsifiable article of faith. To see why, we must separate the bare prediction of doom from the mechanism Malthus actually proposed, and then recognize the "early" defense for what it is: a degenerating move in the philosophy of science.

  ### The Mechanism vs. The Prophecy

  Malthus did not simply guess that people might get hungry. In *An Essay on the Principle of Population* (1798), he offered a specific engine for catastrophe. He posited a fundamental mismatch in growth functions: human population, unchecked, grows **geometrically** ($1, 2, 4, 8, 16...$), while the means of subsistence (food production) grows only **arithmetically** ($1, 2, 3, 4, 5...$).

  Because the gap between these two lines widens inevitably, Malthus argued that "positive checks"—famine, war, disease, misery—were not accidental tragedies but necessary correctives. They were the only things capable of forcing the population line back down to the food line.

  The "right but early" defense attempts to salvage the *prophecy* (misery is inevitable) while quietly discarding the *mechanism* (geometric vs. arithmetic growth). If we are two hundred years past Malthus and the famine has not materialized on a global scale, the geometric/arithmetic claim has already failed. Food production has, in fact, outpaced population growth for centuries, growing exponentially through technology rather than linearly through land expansion.

  If you abandon the mechanism but keep the prediction, you are no longer doing Malthusian science. You are holding onto a vibe.

  ### The Lakatosian Degeneration

  This is where the defense runs into the wall of Imre Lakatos's philosophy of science. Lakatos described scientific "research programs" as having a **hard core** (the fundamental assumptions) and a **protective belt** (auxiliary hypotheses used to shield the core from refutation).

  A research program is **progressive** if it predicts novel facts. It is **degenerating** if it survives only by adding *ad hoc* hypotheses to explain away failures without generating new insights.

  When a Malthusian says, "The famine hasn't happened *yet*," they are adding an *ad hoc* hypothesis to the protective belt. They are adjusting the timeline to save the hard core from falsification. If the prediction was "population will outstrip food," and it hasn't, the scientific response is to check the variables. The Malthusian response is to move the goalposts.

  This turns the theory into a tautology. If "eventually" can be stretched to mean 1800, or 2000, or 2400, the claim loses all empirical content. A theory that explains why the catastrophe happened in 1300 (the Black Death) and also explains why it *didn't* happen in 2000 (the Green Revolution was just a delay) explains everything and nothing. It is unfalsifiable. As Lakatos warned, you cannot claim scientific status for a theory that is immunized against refutation by perpetual postponement.

  ### Epicycles of Time

  There is a historical precedent for this kind of theoretical zombie: Ptolemaic astronomy. When observations showed planets moving in ways that contradicted the geocentric model, astronomers didn't abandon the Earth-centered universe. Instead, they added **epicycles**—smaller circles moving along larger circles—to "save the phenomena." They could make the math work, but only by bolting on complexity that offered no deeper understanding of gravity or motion.

  Saying Malthus was "early" is bolting a **temporal epicycle** onto his theory. It is a bookkeeping trick. It acknowledges the data (no global famine) but refuses to update the model (the relationship between innovation and resources). It treats the absence of catastrophe as a mere scheduling error rather than a structural refutation.

  In science, when a predicted event fails to occur within the causal framework provided, the framework is suspect. If a bridge is designed to hold 10 tons and it holds 100 tons without strain, you do not say the engineer was "right but early" regarding the collapse. You say the engineer misunderstood the materials.

  ### Correction vs. Postponement

  There is a profound difference between a **theoretical correction** and a **bare postponement**.

  A theoretical correction admits that the functions changed. The Green Revolution and the Haber-Bosch process did not just "delay" the Malthusian trap; they shattered the arithmetic constraint on food production. Furthermore, the Demographic Transition showed that as societies become wealthier and more secure, population growth *slows*, contradicting Malthus's assumption that plenty always leads to more mouths. This is a new model: innovation expands the pie, and security shrinks the appetite for large families.

  The "right but early" defense refuses this correction. It insists the old functions still apply, they are just running on a timer we can't see. This is not vigilance; it is dogma.

  ### The Death of Testability

  Ultimately, the point of a scientific theory is not to be "sort of right" in the long run, but to be testable in the short run. Once "early" is allowed to mean "not yet, but eventually," the original claim has been drained of any content that could have been tested.

  If I predict it will rain today, and it doesn't, I was wrong. If I say, "I was right about the rain, it's just coming next Tuesday," I am no longer making a weather prediction; I am telling a story. Malthus made a specific claim about the relationship between resources and reproduction. That claim was tested by the last two centuries of human history and it failed. To insist he is merely waiting in the wings is to remove his theory from the realm of science and place it in the realm of eschatology. A theory that can never be wrong because the deadline is always moving isn't a theory at all. It's a ghost story we tell ourselves at dinner.
