      *   *Formula:* $C(A | X \& E) = x$, where $C$ is credence, $X$ is the proposition that the chance of $A$ is $x$, and $E$ is "admissible" evidence.
      *   *The Tension:* Lewis was a Humean supervenientist. He believed chances supervene on the mosaic of particular facts. But if the mosaic determines the future (determinism), chance is either 0 or 1. If chance is 0 or 1, PP says credence should be 0 or 1. But we assign 0.5 to coin tosses. This is the "undermining future" problem or the tension with determinism.

  3.  **Identify the Distinct Claims/Readings:**
      I need to break down the slogan into specific philosophical interpretations.

      *   *Reading 1: The Lewisian Principal Principle (The Standard).*
          *   Chance is primitive or Humean.
          *   Deference is conditional equality.
          *   Condition: Admissible evidence only.
          *   Status: Rationality constraint.
          *   Determinism issue: Lewis thought incompatibilist about chance/determinism (no chance in determinism). So PP doesn't apply there.

