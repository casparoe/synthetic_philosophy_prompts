prompt: |-
  so in my philosophy of probability seminar the prof keeps invoking something he calls the Principal Principle — basically "credence should defer to objective chance" — and uses it to settle all kinds of disputes. last week someone asked whether we should have 50% credence that a fair coin landed heads before we see it, and the prof said "obviously — the objective chance is 0.5, and credence defers to chance." but when someone pushed on what happens in a deterministic universe where the coin toss is fully determined by initial conditions, he just repeated the slogan and moved on. i'm realizing this phrase is doing a lot of work and nobody's pinned down what it actually means. can you lay out the distinct precise claims "credence defers to objective chance" could be making — what counts as objective chance, what kind of deference (equality? constraint? something else?), whether this is a conceptual truth or a normative principle — and say which readings are trivial, which are substantive but defensible, and which ones would actually settle the deterministic-coin question?
