      *   *Reading 4: Epistemic Chance / Best System (Lewis's later view / Hoefer).*
          *   Chance = Role in best system.
          *   Deference = Pragmatic necessity.
          *   Status: Functionalist.
          *   Determinism issue: Compatibilist (Macro-level chances exist even if micro is deterministic).

      *   *Reading 5: The Trivial/Definitional Reading.*
          *   Chance is just defined as the number rational agents should believe.
          *   Status: Tautology.
          *   Determinism issue: Dissolves the problem but eliminates objective chance.

  4.  **Structure the Response:**
