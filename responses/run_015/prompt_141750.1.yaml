answer: |-
  ### Step 0: Sanity Check on the Thesis

  Your thesis is **not muddled**, and your second step is **not wrong**. Mathematically, $h^2 = V_A / V_P$. If you hold $V_A$ (additive genetic variance) fixed and reduce $V_E$ (environmental variance), $V_P$ shrinks and $h^2$ approaches 1. This is standard quantitative genetics (Falconer & Mackay), but it is frequently ignored in public and policy discourse.

  Your philosophical framing (heritability as a local sensitivity coefficient rather than an intrinsic property) aligns with the orthodox view in philosophy of biology (e.g., Sober, Lewontin, Woodward). You are safe on the science. Your risk is not error, but **relevance**: the geneticists may think it's trivial, and the philosophers may think it's merely technical. Your job is to show why this technicality matters for causal inference.

  ***

  ### Prep Sheet: Question Period Strategy

  **Opening Concessions (First 2 Minutes of Q&A)**
  *Do not wait for these to be asked. Pre-empt them in your opening remarks or immediately after the chair invites questions.*
  1.  **To the Geneticists:** "I know that for the practitioners in the room, much of what I've said about the population-relativity of variance components is textbook material. I am not teaching genetics to geneticists. I am arguing that the *philosophical interpretation* of these numbers in policy contexts systematically ignores these textbook constraints."
  2.  **To the STS/Social Justice contingent:** "I am not arguing that heritability estimates are neutral or free of ideological baggage. I am arguing that even taking the numbers at face value, the inferences drawn from them are mathematically invalid. We don't need to deconstruct the number to see it doesn't do the work assigned to it."

  ***

  ### The Eight Objections (Ranked by Likelihood & Damage)

  #### 1. The "Old News" Challenge
  *   **Who:** The Quantitative Geneticists (Med School).
  *   **Vocabulary:** *"Standard quantitative genetics," "Falconer's framework."*
  *   **How they put it:** "This is all correct, but it's standard fare in any first-year grad course. $h^2$ is always population-specific. What is the *novel* philosophical contribution here beyond restating Lynch & Walsh?"
  *   **Gloss:** They are questioning the novelty of your work, implying you are rediscovering wheel.
  *   **Your Reply (2 mins):** "You are right that the *math* is standard. The novelty is in the *normative prescription*. The literature in policy and psychology frequently treats $h^2$ as a stability parameter (a measure of 'genetic determination'). My contribution is to formalize the 'environmental support' condition and propose the 'uniform-intervention test' as a mandatory check before policy application. I am bridging the gap between the technical constraint and the public inference."
  *   **Soft Spot:** If they press that the field *already* does this (e.g., in GWAS disclaimers), you may look out of touch with current genomic practices.

  #### 2. The "Invariance" Challenge
  *   **Who:** The Host (Interventionist Causation).
  *   **Vocabulary:** *"Invariance," "Structural parameter," "Interventionist account."* **Gloss:** In interventionist causation (Woodward), a causal relationship must remain stable (invariant) under a range of interventions; if it changes too easily, it's not a robust cause.
  *   **How they put it:** "If heritability changes whenever the environment changes, it lacks *invariance*. On an interventionist account, does this number have any *causal* explanatory power at all, or is it just a descriptive statistic?"
  *   **Your Reply (2 mins):** "It is not a causal *law*, it is a causal *sensitivity coefficient*. It tells us how the system responds to *selection* within a specific context. It explains variance, not individual development. Its explanatory power is real but strictly local, like a coefficient of friction which is real but depends on the surface."
  *   **Soft Spot:** Interventionists prefer invariant generalizations. Admitting it's "just local" lowers its status in their hierarchy of explanation.

  #### 3. The "Individual vs. Population" Distinction
  *   **Who:** The Philosopher of Biology.
  *   **Vocabulary:** *"Token causation," "Type-level explanation," "Variation vs. Development."* **Gloss:** Token causation refers to what caused a specific event (this plant grew tall); type-level refers to patterns across a population (why plants vary in height).
  *   **How they put it:** "You seem to be reheating the Lewontin/Sober point. High heritability explains *variation* in the population, but says nothing about *token causation* for an individual. Are you adding anything to that distinction?"
  *   **Your Reply (2 mins):** "I am endorsing that distinction but pushing it further. Even for *variation*, the number is unstable across environments. It's not just that it doesn't explain individual development; it doesn't even stably explain population variation across different environmental contexts. I'm tightening the constraints on the 'type-level' claim."
  *   **Soft Spot:** They may feel you are merely restating Lewontin (1974) without new philosophical argumentation.

  #### 4. The "Legitimization" Challenge
  *   **Who:** STS Graduate Students.
  *   **Vocabulary:** *"Reification," "Biopolitics," "Operationalization."* **Gloss:** Reification is treating an abstract concept (like intelligence) as a concrete physical thing.
  *   **How they put it:** "By arguing for 'proper use' rather than abandonment, aren't you *reifying* the concept? You're legitimizing a number that is fundamentally tied to oppressive classification systems."
  *   **Your Reply (2 mins):** "I understand the concern. But abandoning the number leaves the misuse unchallenged. If we say 'the math is wrong,' that is a stronger critique than 'the politics are bad.' My prescription makes it harder to use the number for hereditarian politics by exposing the environmental assumptions required to generate high $h^2$."
  *   **Soft Spot:** They may view 'technical correction' as a liberal fantasy that ignores power structures embedded in the measurement itself.

  #### 5. The "Missing Heritability" Challenge
  *   **Who:** The Genomicist (Med School).
  *   **Vocabulary:** *"SNP heritability," "Tagged variance," "Additive genetic variance ($V_A$)."* **Gloss:** SNP heritability is the variance captured by common genetic markers on a chip, usually lower than classical $V_A$ from twin studies.
  *   **How they put it:** "You mentioned genomic estimates are lower. Given that classical designs confound genetics with shared environment, shouldn't we just discard the classical $h^2$ entirely in favor of genomic methods?"
  *   **Your Reply (2 mins):** "Genomic methods solve some identification problems but introduce others (e.g., they miss rare variants). My argument applies to *any* variance ratio. Even genomic $h^2$ is population-specific and environment-dependent. The philosophical point holds regardless of the estimation method."
  *   **Soft Spot:** If the field is moving entirely to genomic methods, your critique of "classical designs" might seem like fighting the last war.

  #### 6. The "Predictive Utility" Challenge
  *   **Who:** General Audience / Intelligence Interests.
  *   **Vocabulary:** *"Prediction," "Forecasting," "Effect size."*
  *   **How they put it:** "If it predicts breeding response in cows, why can't it predict educational outcomes in humans? Isn't a 0.6 heritability useful for *something*?"
  *   **Your Reply (2 mins):** "It predicts response to *selection* (sorting), not *intervention* (changing). In animal breeding, we select parents; we don't change the cows' environment to change the genes. In schools, we change the environment. The Breeder's Equation ($R = h^2 S$) requires the environment to remain constant. Policy changes the environment."
  *   **Soft Spot:** People want prediction. Telling them "you can't predict" is unsatisfying, even if true.

  #### 7. The "GxE is Genetic" Challenge
  *   **Who:** Quantitative Geneticist.
  *   **Vocabulary:** *"Genotype-by-Environment Interaction (GxE)," "Reaction Norm."* **Gloss:** GxE occurs when different genotypes respond differently to environmental changes.
  *   **How they put it:** "If the environment changes the expression of genes, isn't that part of the genetic architecture? Why separate them so sharply?"
  *   **Your Reply (2 mins):** "In a specific environment, GxE is part of the residual variance. It only becomes genetic variance if you sample across the environments that trigger it. My point is that $h^2$ is defined *within* a specific distribution of environments. If you change that distribution, you change the parameter."
  *   **Soft Spot:** Defining where 'gene' ends and 'environment' begins is notoriously messy in molecular biology.

  #### 8. The "So What?" Challenge
  *   **Who:** Any Pragmatist.
  *   **Vocabulary:** *"Policy relevance," "Actionable intelligence."*
  *   **How they put it:** "If we can't use it for policy, and it doesn't tell us about individuals, why publish it at all?"
  *   **Your Reply (2 mins):** "It tells us about the *current structure of inequality*. High $h^2$ in a trait tells us that currently, environmental opportunities are uniform relative to genetic differences. It diagnoses the status quo, even if it doesn't prescribe the future."
  *   **Soft Spot:** This is a weak sell for funding bodies or policymakers who want solutions.

  ***

  ### Critical Strategic Assessments

  **The Objection with Real Force (Prepare to Meet)**
  *   **From:** The Host (Interventionist).
  *   **The Point:** **"If the parameter is not invariant, is it a law?"**
  *   **Why:** Your entire thesis rests on $h^2$ being a "local sensitivity coefficient." The Host works on causal explanation. If you concede it lacks invariance, they may argue it has no *explanatory* value, only descriptive.
  *   **Preparation:** Be ready to defend "local explanation." Use the analogy of fluid dynamics: viscosity is real and explanatory, but it changes with temperature. It is still a causal parameter, just context-dependent. Do not let them force you into a binary where "context-dependent" equals "not causal."

  **The Question You Hope Nobody Asks**
  *   **The Question:** **"How do you operationally define the 'Environmental Support'?"**
  *   **Why:** You prescribe that estimates should be published with the "environmental support over which they hold." In practice, environments are high-dimensional and continuous. There is no clear boundary for where the support ends.
  *   **Risk:** If you cannot give a concrete method for defining these boundaries, your practical prescription looks philosophically sound but scientifically impossible.
  *   **Deflection:** "It is indeed difficult. I propose using the range of observed covariates in the sample as a proxy, acknowledging it is a lower bound. The goal is to force the researcher to explicitly state the assumption, not to solve the boundary problem perfectly."

  ***

  ### Final Advice
  You are the expert in the room on the *numbers*, but a novice on the *philosophy*.
  *   **Do not** get bogged down in technical definitions of variance components if a philosopher offers a conceptual critique. Accept their conceptual frame, then show how the numbers fit (or don't fit) it.
  *   **Do** lean on your 30 years of experience. When you say "my old experimental herds were close to a limiting case," that carries weight no philosopher can match. Use that authority to ground the abstract claims.
  *   **Stay Calm:** The geneticists are not your enemies; they are your allies who are bored. The philosophers are your audience who are excited. Manage the boredom, feed the excitement.
