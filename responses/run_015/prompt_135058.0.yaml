      *(Self-Correction on "Normative Grue"):* Make sure I don't just say "Ethics is different." I need to use it to *check* the scientific answer. If ethics blocks Grue easily, why? Because norms are constituted by reasons. Nature isn't. Therefore, nature requires an external assumption (kinds) to block Grue. This confirms the scientific thesis.

