  8.  **Writing the Essay.** (Focusing on flow, philosophical density, and avoiding academic stiffness while remaining rigorous).

      *   *Intro:* Hook the roommate dispute. Define Grue.
      *   *Body 1:* The failure of the "language trick" solution. Entrenchment is circular.
      *   *Body 2:* The need for Natural Kinds/Causal Structure.
      *   *Body 3:* The Normative Grue.
      *   *Body 4:* Comparing the two. Why the difference matters for the main thesis.
