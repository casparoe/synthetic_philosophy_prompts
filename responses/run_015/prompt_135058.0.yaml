answer: |-
  The dispute between you and your roommate cuts to the bone of epistemology. Your roommate is channeling a pragmatic Humean: he thinks Goodman's "grue" paradox is a linguistic glitch, a category error that dissolves if we simply agree to banish time-indexed, disjunctive predicates from our scientific vocabulary. On this view, "entrenchment"—the historical fact that we have successfully projected "green" rather than "grue" in the past—is sufficient to justify future projections. It's a deflationary solution: induction works because it's what we do, and asking for a deeper justification is a philosophical fetish.

  Your intuition, however, is that this pragmatism is too thin. It feels like a circular maneuver that masks the real problem. You are right to be suspicious. The grue paradox does not merely expose a vocabulary glitch; it reveals that inductive inference is impossible without a metaphysical commitment to the structure of the world. A purely practice-based account of projectibility cannot do all the work on its own because it explains the *selection* of hypotheses without explaining their *success*. To see why, we must look at why entrenchment fails as a justification and then stress-test the conclusion using the normative analog you proposed.

  Goodman's challenge is not that "grue" is a weird word, but that it is logically symmetrical to "green" relative to all past observations. If every emerald observed before time $t$ has been green, they have also all been grue (defined as green before $t$, blue after). The roommate suggests we solve this by noting that "green" is entrenched and "grue" is not. But this is descriptive, not normative. It tells us why we *prefer* green, but not why we are *rationally entitled* to believe emeralds won't turn blue. If the universe were fundamentally chaotic, or if natural properties were inherently time-sensitive, our entrenchment in "green" would be a historical accident leading to future error. To claim that entrenchment justifies induction is to assume that the future will resemble the past in respect to entrenched predicates. But that *is* the principle of induction itself. Thus, appealing to entrenchment to justify induction is viciously circular. It assumes the uniformity of nature to prove the reliability of the predicates we use to track that uniformity.

  To break the circle, we need a reason to think that "green" carves nature at its joints while "grue" does not. This requires a metaphysical grip on natural kinds or causal structures. We project "green" because we have a background theory that color is a function of surface reflectance properties, which are causally stable over time. We reject "grue" because it posits a brute, uncaused change in physical state at an arbitrary temporal coordinate. The justification for induction, therefore, isn't just that we are in the habit of predicting stability; it's that we have independent, abductive reasons to believe the world contains stable causal powers that make those predictions likely to be true. Without this realist commitment, the pragmatic account leaves us with a reliable-seeming habit that might be leading us off a cliff the moment $t$ arrives. Pragmatism explains the psychology of prediction; metaphysics explains its rationality.

  Now, let's apply the stress test: the Normative Grue. Imagine a moral rule where an act (say, keeping a promise) is morally required before 2050 and morally forbidden after, with no change in the consequences, context, or agents involved. Does this undermine moral reasoning in the same way scientific grue undermines induction?

  At first glance, it seems parallel. If moral facts are just social constructs or entrenched practices, why couldn't the "moral kind" be time-indexed? However, the Normative Grue collapses much faster than the Scientific Grue, and the reason why illuminates the scientific case. In the normative domain, we have access to internal constraints of rational agency that do not exist in the physical world. Moral reasoning relies on universalizability and the structure of practical reason. If I claim keeping a promise is obligatory today, I am citing reasons (autonomy, trust, welfare) that ground that obligation. If those reasons persist after 2050, the obligation must persist. To assert the Normative Grue is to assert that the *reasons* for the obligation vanish arbitrarily at the stroke of midnight on New Year's Eve 2049, despite the descriptive facts remaining identical.

  This violates the internal logic of normativity. A "reason" that expires without a change in relevant conditions is not a reason; it's a command. While a dictator could issue a time-limited command, moral *obligation* claims a authority grounded in the nature of the agents and the act. Therefore, the Normative Grue is blocked not by an external metaphysical grip on "moral particles," but by the internal requirements of rational consistency inherent to the normative domain. We don't need to look outside the practice of reasoning to reject Normative Grue; the practice itself rules it out as incoherent.

  This contrast confirms that the scientific case *does* require the external metaphysical grip. The physical world is not a rational agent. Nature does not care about consistency, universalizability, or reasons. Emeralds do not reason; they simply exist. Because the object of scientific induction (the natural world) lacks the internal rational constraints that block the normative analog, we cannot rely on the internal coherence of our practices to save us. We cannot argue that it is "irrational" for an emerald to turn blue, because emeralds aren't rational. We can only argue that it is *causally improbable* given our understanding of natural kinds.

  If we tried to solve the Scientific Grue using only the resources that solved the Normative Grue (internal consistency of practice), we would fail. Scientific practice can be internally consistent and still be wrong about the world (e.g., Ptolemaic astronomy was highly entrenched and consistent). The Normative Grue fails because it breaks the rules of *thinking*; the Scientific Grue succeeds (logically speaking) because nature follows no rules of *thinking*. Therefore, to block Scientific Grue, we must import a constraint from outside our linguistic practices: we must assume the world is structured by stable causal kinds. The fact that the normative analog is easily defanged by the nature of agency proves that the scientific analog is *not* defanged by the nature of language. It requires an ontological commitment.

  Your roommate wants to treat induction as a language game. The Normative Grue shows that language games work in domains constituted by rules (like ethics or logic), where arbitrariness is a violation of the game itself. But science is not a game; it is an investigation of a mind-independent reality. In that domain, arbitrariness is not a rule violation; it is a physical possibility. To rule it out, we must assume the physical world is not arbitrary. That is a metaphysical assumption, not a pragmatic one. Entrenchment tells us which predicates we *do* use; natural kinds tell us which predicates we *should* use if we want truth. Without the latter, induction is merely a survival mechanism, not a rational inference.

  Verdict: Induction is only justified if we assume a metaphysical grip on natural kinds, since pragmatic entrenchment merely describes our habits without explaining their truth-tracking success, a limitation exposed by the normative analog which resists grue only through internal rational constraints that the physical world lacks.
