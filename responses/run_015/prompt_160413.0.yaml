  ### Analysis of Generation and Disagreement

  **Under-generation and Over-generation**
  *   **Account A (Lewis)** under-generates in cases like Variant 2 (Vestiges) and Variant 3 (Instant Correlation). Intuitively, a vestigial pattern retained by mutual expectation feels like a convention even if the original problem is physically solved, and instant correlation via a public signal often functions identically to established conventions. Account A over-generates only if one accepts that common knowledge is too easily satisfied by public logs without explicit confirmation, potentially counting mere coincidences as conventions if agents mistakenly infer mutual expectation.
  *   **Account B (Dynamic)** under-generates in Variant 3, excluding instant coordination that lacks a learning history. It over-generates in Variant 2, counting any stable, self-reinforcing habit as a convention even when the coordinative function is obsolete. By focusing on stability rather than function, Account B risks categorizing mere inertia or legacy code as conventions.

  **Substantive vs. Verbal Disagreement**
  The residual disagreement is substantive. It concerns whether the identity of a convention is constituted by its *function* (solving a coordination problem, per Account A) or its *causal history* (selection via reinforcement, per Account B). Account A treats convention as a normative status dependent on current reasons for action; Account B treats it as a descriptive state dependent on past dynamics. This leads to different classifications of vestigial patterns (Variant 2), reflecting a deeper divergence on whether a convention ceases to exist when its coordinating function is superseded.

  ### Epistemic Status

  **Settled Among Researchers**
  *   Account A is widely recognized as the foundational analytical framework for defining convention in terms of coordination problems and expectations.
  *   Account B represents a distinct tradition focusing on causal mechanisms (learning, evolution) rather than rationalistic conditions.
  *   Both accounts agree that conventions involve arbitrariness (alternative regularities were possible).

  **Genuinely Contested**
  *   Whether "common knowledge" (Account A) is a necessary condition or if weaker conditions like "common belief" or mere correlation suffice.
  *   Whether a pattern retains the status of "convention" after the original coordination problem is removed (Variant 2).
  *   Whether a learning history (Account B) is required, or if instant correlation can constitute a convention.

  **My Judgment**
  *   I judge that Account A provides a sharper identity condition because it ties conventionhood to the *reason* for conformity (solving the problem) rather than just the *cause* of stability. This better separates conventions from mere habits or locked-in standards that no longer serve a coordinative function among agents.
  *   I judge that the exclusion of Variant 3 by both accounts is correct; without mutual expectation or history, the pattern is a technical correlation rather than a social convention.

  \answer{lewis; 0.75}
