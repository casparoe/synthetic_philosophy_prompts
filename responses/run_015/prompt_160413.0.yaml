  I also want your epistemic status made explicit. Give two short lists: what you take to be settled among people who work on this, and what is genuinely contested. Mark clearly which of your own claims are your judgment rather than consensus, and do not present a contested reading as the received one.

  End with a single final line of exactly this form, with no other markup on that line:

  \answer{<one of: lewis, dynamic, hybrid, neither>; <a number between 0 and 1 giving your probability that you would still hold this verdict after reading the strongest published defence of the account you rejected>}
