answer: |-
  Here is a structured plan for your 45-minute session, designed to navigate the specific conceptual pitfalls your psychology undergraduates will face.

  ### 1. The Opening: The Behaviourism Firewall (0–5 minutes)
  **What must come first:** You must immediately distinguish between the *existence of the mental state* and the *properties we attribute to it*.
  *   **The Move:** Start by explicitly stating that illusionism is **not** eliminativism. Tell them: "We are not saying you don't feel pain, see red, or taste coffee. We are saying your introspective mechanism describes those states using a 'user interface' that contains false properties."
  *   **Why:** If you begin with 'qualia don't exist', they will hear 'behaviourism'. By affirming the reality of the functional state (the nociception, the visual processing) while targeting only the *phenomenal character* (the 'what-it-is-likeness' as an intrinsic property), you secure their buy-in. This heads off the misconception that **'illusionism means we don't really experience anything'** before it can take root.

  ### 2. The Core Example: Peripheral Vision vs. Introspection (5–20 minutes)
  **The Concrete Example:** Use the **Peripheral Vision Density Illusion**.
  *   **The Setup:** Ask them to fixate on a point and hold up a pen in their periphery. They can see movement and colour, but if asked to identify the object without moving their eyes, they cannot. Yet, subjectively, the visual field *feels* uniformly detailed.
  *   **The Application:** Explain that introspection works similarly. We feel we have direct, rich access to our inner states (just as we feel we see a detailed periphery), but this is a model constructed by the brain, not a direct read-out.
  *   **Why not Mary or Zombies?** Explicitly tell the group why you are avoiding these standard thought experiments.
      *   **Mary (Knowledge Argument):** Assumes qualia are real properties that can be known or unknown. Illusionism denies the property exists to be known. Using Mary concedes the dualist starting point.
      *   **Zombies (Conceivability Argument):** Relies on metaphysical possibility. Psychology students care about *actual mechanisms*, not logical possibilities.
      *   **Pedagogical Reason:** The peripheral vision example is empirically verifiable in a lab; Mary and Zombies are intuition pumps that rely on pre-existing metaphysical commitments your students haven't yet studied.

  ### 3. The Mechanism: Predictive Processing and Misrepresentation (20–30 minutes)
  **The Explanation:** Briefly sketch the predictive processing model mentioned in your brief.
  *   **The Concept:** The brain predicts sensory input and updates based on error. Introspection is just another layer of this. The brain generates a model of its own internal states to help regulate them.
  *   **Heading off Misconception 2:** This is where you address **'it's just denying the obvious'**.
      *   **The Move:** Explain that 'the obvious' is the output of the introspective model, not the reality of the system. Just as the peripheral vision *looks* detailed (the obvious) but *isn't* (the reality), consciousness *looks* non-physical (the obvious) but *isn't* (the reality).
      *   **Key Phrase:** "Introspection is not a window; it is a dashboard. A fuel gauge doesn't need to be wet with petrol to tell you about the petrol."

  ### 4. Boundaries: What We Are Not Doing (30–35 minutes)
  **What to Refuse:** Openly refuse to engage with **metaphysical debates about physicalism vs. dualism**.
  *   **The Instruction:** Tell the group: "We are not solving the Hard Problem by explaining how matter produces magic. We are dissolving the Hard Problem by showing that the 'magic' is a bug in the introspective code."
  *   **Why:** Final-year psych students often get stuck on ontology. If you let them debate whether the brain is 'really' physical, you lose the cognitive science angle. Keep the focus on the *mechanism of misrepresentation*, not the *nature of substance*.

  ### 5. The Check Question (35–45 minutes)
  **The Test:** Pose the following scenario to verify they understand that phenomenal character is misrepresented rather than denied.
  *   **The Question:** "If an illusionist says 'pain qualia are illusory', are they claiming that:
      A) The nociceptive signal and avoidance behaviour do not exist?
      B) The introspective system correctly identifies the signal but labels it with a false property (like 'intrinsic hurtiness')?
      C) The brain is lying to us to protect itself?"
  *   **The Correct Answer:** **B**.
  *   **Discussion:** If they choose A, they have reverted to behaviourism/eliminativism. If they choose C, they are attributing agency rather than mechanism. Use this to reinforce that the *state* is real, but the *phenomenal property* is the misrepresentation.

  Plan summary: This session plan prioritises distinguishing mental states from their attributed properties to avoid behaviourist confusion, uses perceptual illusions rather than metaphysical thought experiments to ground the theory, and explicitly boundaries metaphysical debates to maintain a cognitive science focus.
