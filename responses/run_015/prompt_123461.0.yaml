answer: |-
  Here is an analysis of the argument in *De Anima* II.1, structured to address your four specific points.

  ### 1. What the Distinctions Are Actually For

  Aristotle is constructing a hylomorphic (matter-form) definition of the soul to avoid two errors: making the soul a separate substance (dualism) or making it merely a harmony of elements (materialism). The distinctions in this passage serve to locate the soul as the **organizing principle** of the body, rather than an activity or a tenant.

  *   **First vs. Second Actuality:** This is the engine of the definition.
      *   **Second Actuality (Exercise):** The active doing (seeing, cutting, waking, metabolizing).
      *   **First Actuality (Possession):** The established capacity to do (the power of sight, the sharpness of the axe, the state of sleep, the organization of the seed).
      *   **The Work It Does:** By defining the soul as *first actuality*, Aristotle ensures that an organism is alive even when it is not currently *acting* alive (e.g., sleeping, dormant). If life were defined as second actuality (current metabolism/motion), sleep and dormancy would count as death. This distinction creates the logical space for potentiality within life.
  *   **The "Retains" Qualifier:** You asked what work "retains" is doing. It distinguishes between **temporary suspension** and **structural dissolution**.
      *   A sleeper "retains" the soul because the bodily organization required for waking is intact.
      *   A corpse does not "retain" the soul because the specific organization (the *logos* of the body) has dissolved. The matter is there, but the arrangement that made the capacity possible is gone.
      *   **Does the two-grade analysis carry the load?** Yes. The distinction between first and second actuality is not merely an analogy for sleep; it is the ontological basis for the definition. Sleep is the empirical proof that first actuality (soul) can exist without second actuality (activity).
  *   **"Except in Name" (Homonymy):** This is a thesis about **essence**, not merely reference. When Aristotle says a dead eye is an eye "in name only," he means it lacks the *ergon* (function/work) that defines the kind. A painted eye and a dead eye share the shape (matter) but lack the capacity for sight (form). Therefore, they are not truly members of the kind "eye." This provides the "third verdict" you are looking for: it is not that the thing is *not* an eye (it looks like one), nor that it *is* an eye (it cannot see); it is an eye **homonymously**.

  ### 2. Application to the Four Cases

  Based strictly on the criteria in this text (organized body, first actuality, internal capacity), here is how the framework judges your cases.

  **A. The Dormant Seed**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** Aristotle explicitly cites seeds and fruits as bodies that "possess the qualification." They are in a state of first actuality. They possess the internal organization required to resume metabolism and growth (second actuality) given the right conditions. They "retain" the soul.

  **B. The Frozen Embryo**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** While Aristotle did not know of cryopreservation, the logic of the "seed" applies directly. If the organization is preserved such that the capacity for development is retained (first actuality), it is alive. The cessation of metabolic activity is akin to sleep, not death, provided the structural integrity required to resume activity is "retained."

  **C. The Virus Particle (Extracellular)**
  *   **Verdict:** **Alive in Name Only.**
  *   **Reasoning:** This is the critical test. A virus particle has structure (organized matter) but lacks an *internal* principle of motion and rest (metabolism). It cannot actualize its "form" on its own; it requires a host cell to function as a tool.
      *   In Aristotle's analogy, the eye is the matter, sight is the soul. If the eye cannot see *even when conditions are right*, it is an eye in name only.
      *   The virus outside the host is like the axe that cannot cut because it has no handle and no user. It is a "tool" waiting for a user (the host cell). Since Aristotle defines the living body as a *natural* body (having a principle of motion in itself), the virus outside the host fits the "painted eye" or "statue" category better than the "animal" category. It has the shape of life, but not the capacity for self-maintenance.

  **D. The Sterile Hybrid (Mule)**
  *   **Verdict:** **Alive.**
  *   **Reasoning:** The mule possesses the nutritive soul (metabolism, growth, maintenance). It fails only in the generative capacity (reproduction). For Aristotle, the nutritive soul is the *minimum* condition for life. A being can be alive without being able to reproduce (e.g., worker bees, post-menopausal humans, castrated animals). The "except in name" verdict applies to the total loss of the defining function (like a corpse losing *all* life functions), not to the loss of a specific higher capacity. The mule is a living thing with a defect, not a living thing in name only.

  ### 3. Your "Relational-Separation" Reading

  You asked if the distinction between "functional collapse" (broken axe) and "relational separation" (dormant seed) is a projection or an implication.

  **It is an implication, but with a strict constraint.**
  Your reading is correct that Aristotle distinguishes between a capacity that is temporarily unexercised due to external conditions (seed/sleeper) and a capacity that is gone due to internal structural loss (corpse/painted eye). This is the difference between First Actuality (present) and the loss of First Actuality (absent).

  **However, beware the "empty capacity" worry.**
  You noted that "almost any inert but intact structure can be said to retain a disposition." Aristotle blocks this with the requirement of **natural organization**.
  *   A stone is intact, but it does not "retain" the capacity to see because its organization is not *of the kind* that supports sight.
  *   The capacity must be intrinsic to the specific *logos* (formula/structure) of that body.
  *   Therefore, the "relational separation" only counts if the internal structure is specifically designed to resume the activity *on its own* once conditions allow. The seed has this; the virus particle (outside host) does not. The virus requires the *organization of another being* to function. Thus, your reading holds, provided you insist that the "internal capacity" must be self-sufficient regarding the *source* of motion, even if it requires external *fuel*.

  ### 4. The Sailor/Ship Concession

  At the end of the chapter (413a8), Aristotle notes that it remains unclear whether *some parts* of the soul might be separable, "as the sailor from the ship."

  **Does this undercut the "First Actuality" formula?**
  **No.** It qualifies the **separability**, not the **actuality**.

  *   **The Formula:** Soul = First Actuality of a natural organized body.
  *   **The Sailor Analogy:** This represents a dualist view where the soul is a substance *using* the body, rather than the form *of* the body.
  *   **Aristotle's Point:** He raises the sailor analogy primarily to distinguish his view from it. For the nutritive and sensitive souls (which define "life" in the biological sense), the soul is *not* like a sailor; it is like the sight of the eye. It cannot exist without the body.
  *   **The Concession:** He leaves open the possibility that the *intellect* (nous) might be separable (like a sailor). But for the definition of life (which is the concern of Book II, Chapter 1), the sailor model is rejected.
  *   **Impact on your project:** This does not weaken the "third verdict." In fact, it strengthens the "except in name" claim for biological life. If the soul were a sailor, a corpse might still "have" the soul (the sailor just stepped out). By arguing the soul is the *actuality of the body* (like sight to the eye), Aristotle ensures that when the body's organization dissolves, the soul ceases to exist. This makes the "except in name" verdict ontologically robust: the dead eye isn't just useless; it has lost the very thing that made it an eye.

  ### Summary: The Third Verdict

  Your hope is well-founded. The "except in name" (homonymy) move **does** supply the third verdict you are seeking.

  1.  **Yes (Alive):** First actuality is present (Seed, Embryo, Mule).
  2.  **No (Matter):** The organization is dissolved, matter remains (Corpse, Ash).
  3.  **In Name Only (Homonymous):** The organization appears intact or mimics life, but the internal principle of activity is absent or dependent on an external agent in a way that violates self-motion (Virus particle, Painted Eye, Statue).

  This allows you to avoid the binary trap. The virus is not "dead matter" (it has complex organization), nor is it "alive" (it lacks self-actualizing capacity). It is a "living thing" in name only, awaiting the conditions that might allow it to borrow life from a host. Aristotle's framework handles this nuance better than a binary metabolism/reproduction definition because it centers on the **intrinsic organization for capacity** rather than the **current exercise of function**.
