answer: |-
  You and your friend have accidentally recreated one of the most famous experiments in the history of psychology, and you have stumbled directly into the central debate of modern consciousness studies.

  You are arguing about **George Sperling's 1960 partial-report experiment**. Sperling showed subjects grids of letters for 50 milliseconds (similar to your tenth of a second). In "whole report," they could name only 4. In "partial report" (your tone cue), they could name almost all of the cued row.

  Sperling concluded that humans possess a high-capacity **iconic memory** that holds the image briefly before it decays. However, whether that capacity equals *conscious vision* is still debated today.

  Here is the breakdown of who is right, why the brain scanner won't work, and exactly what you should say to settle the bet.

  ### 1. The Science: What Sperling Actually Proved
  Your friend is right that the information is *there*. The partial-report effect proves that immediately after the flash, the brain holds a high-resolution representation of all 12 letters.

  However, you are right that this does not prove she *consciously saw* them.
  *   **Iconic Memory:** This is a sensory buffer. It is like a camera sensor holding an image before the processor saves it. Just because the sensor has the data doesn't mean the photographer "saw" the photo.
  *   **The Decay:** The reason she can't name them all is that the information decays faster than she can retrieve it. The question is: *Did she experience the letters before they decayed, or did the brain just hold the data?*

  **Verdict:** The experiment proves **availability**, not **awareness**.

  ### 2. The Philosophy: Two Definitions of "See"
  You are stuck because you are using different dictionaries. Philosophers of mind (most notably **Ned Block**) distinguish between two types of consciousness that map perfectly onto your argument:

  *   **Phenomenal Consciousness (P-Consciousness):** "What it is like" to experience something. The raw feeling of red, the shape of the letter. Your friend is arguing for this. She feels the richness of the grid.
  *   **Access Consciousness (A-Consciousness):** Information that is available for reasoning, reporting, and rational control of action. You are arguing for this. If you can't use it, it isn't "conscious" in a functional sense.

  **The Conflict:** Your friend claims she has P-Consciousness of all 12 letters without A-Consciousness. You claim that without A-Consciousness, P-Consciousness is meaningless or non-existent. Science has not settled this; it is the "Hard Problem" of consciousness.

  ### 3. Why the Brain Scanner Will Not Settle It
  Your friend's proposal to use an fMRI is scientifically flawed for three specific reasons. You can tell her this:

  **A. The "No-Report" Paradox**
  She wants to scan the brain *without* asking her to report, to prove the letters are conscious without the bottleneck of speech. But how do we know which brain activity equals "consciousness"?
  We only know which brain activity correlates with consciousness by asking people to **report** when they are conscious. If you remove the report, you remove the only yardstick we have to measure consciousness. You cannot calibrate the ruler by removing the numbers.

  **B. The Definition Trap**
  She mentioned scanning for regions that *"pass information around to everything else."*
  That is a specific scientific definition called the **Global Neuronal Workspace**. If she accepts that definition, **she loses the argument.**
  *   If consciousness *is* global information sharing (Access), then the letters she cannot share were *not* conscious.
  *   If the scanner shows activity in those regions for the unreported letters, it proves the brain *processed* them, not that she *experienced* them.
  *   If the scanner shows activity only in early visual areas (V1/V2), proponents of Access Consciousness (like **Stanislas Dehaene**) argue that is merely subconscious processing.

  **C. Correlation vs. Experience**
  An fMRI measures blood flow, not experience. We can find neural correlates of consciousness (NCC), but we cannot scan qualia (subjective experience). Showing that a neuron fires does not prove there was a "little man" inside her head who saw the letter. It just proves the machinery moved.

  ### 4. How to Settle the Bet
  You cannot prove she is wrong about her internal experience, and she cannot prove she is right about the definition of "seeing." The bet relies on an ambiguous word.

  **Say this to her:**

  > "We are recreating Sperling's experiment from 1960. You are describing **Iconic Memory**, which is a high-capacity sensory buffer. I am describing **Access Consciousness**, which is information available for use.
  >
  > Science agrees with you that the *data* for all 12 letters exists briefly. Science agrees with me that only 4 letters enter the *global workspace* required to name them.
  >
  > Your brain scanner idea fails because we only know which brain patterns equal 'consciousness' by asking people to report what they see. If we remove the report, we remove the measurement. Furthermore, if you define consciousness as 'information passing to the whole brain,' then by definition, the letters you can't report weren't conscious.
  >
  > We are arguing about semantics, not biology. You define 'seeing' as 'having a sensory impression.' I define 'seeing' as 'being able to interact with the impression.' Both are valid, but they aren't the same thing."

  **The Compromise:**
  *   **She wins** the claim that her brain *registered* all 12 letters (proven by the tone test).
  *   **You win** the claim that she did not *consciously perceive* them in a way that allows for cognitive use (proven by the whole report limit).
  *   **The Bet:** Split it. The embarrassment comes from treating a philosophical distinction as a binary fact. Acknowledge that human vision is a pipeline: **Sensation (Her win) → Perception → Access (Your win).** The letters die in the middle.

  **The Knockout Argument:**
  If she insists the scanner will show the unreported letters were conscious, ask her: *"If the scanner shows activity, but you still can't tell me what the letter was, how is that different from a camera recording a video that no one ever watches? Is the camera 'conscious' of the video?"*

  If she says the camera isn't conscious, she admits that **access/reporting** is required for consciousness. If she says the camera *is* conscious, she has redefined consciousness to include thermostats and hard drives. Either way, you win.
