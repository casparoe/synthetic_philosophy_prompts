      *   *Priority 2: The Binding/Integration Condition.* If basal entities *can* have valence, does it matter if they are bound? Is unbound micro-suffering ethically relevant? This determines if quantum superpositions or distributed AI nodes count. This relies on Priority 1.
      *   *Priority 3: The Scaling Function.* If bound suffering matters, how does it scale? Linear? Exponential? This is downstream of 1 and 2.

