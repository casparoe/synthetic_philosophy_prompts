answer: |-
  The scenario — One thousand neighbors ($N=1000$) receive identical letters proposing a community park. Pledging costs $c=\$100$. If at least $T=500$ pledge, the park is built, yielding value $B=\$150$ to everyone, pledgers or not. If fewer than 500 pledge, no park forms and pledges are refunded. The offer is anonymous, one-shot, and non-communicative. You know your neighbors are roughly similar to you—similar incomes, values, and reasoning capabilities—but they are not perfect copies. The correlation between your decision and theirs is substantial but messy, driven by shared culture rather than identical algorithms. You want the park, but you dislike wasting money on failed projects.

  What each theory says — 
  **CDT:** Your causal impact is limited to pivotality. With $N=1000$, the probability you are exactly the 500th pledge is negligible ($\approx 0$). Expected utility is $P(\text{pivotal}) \times B - c \approx -\$100$. Since $-\$100 < 0$, CDT dictates staying out. Your action cannot causally force others to contribute, so you treat their behavior as fixed background noise.

  **EDT:** Your pledge is evidence others pledge, but correlation is imperfect. Let $\Delta P$ be the increase in success probability given you pledge. Even granting strong similarity, $\Delta P \le 0.6$. The evidential gain is $\Delta P \times B = 0.6 \times \$150 = \$90$. Inequality: $\Delta P \cdot B < c$. Since cost $c=\$100$, net evidential value is $\$90 - \$100 = -\$10$. EDT dictates staying out; the news isn't good enough to buy the ticket.

  **Superrationality:** We face identical reasoning problems. If I conclude "pledge," you must conclude "pledge." Thus, total pledges $= 1000$. Since $1000 > 500$, success is certain. Payoff is $B - c = \$50$. A shared lottery (mixed strategy) risks dropping below $T$ without reducing individual cost proportionally, lowering expected utility. Pure cooperation dominates. Superrationality dictates sending the pledge.

  **FDT:** Views your decision as output of a logical function. If the function outputs "pledge," all instances run it. This mirrors superrationality. Since $B > c$ and universal output guarantees success, FDT dictates pledging. It treats the correlation as logical dependence, not merely statistical, bypassing EDT's timidity by assuming algorithmic identity across agents.

  Why the lure runs backwards — Hofstadter's cases penalize over-participation (collision dilutes the prize). Here, under-participation kills the prize. Superrationality flips from a brake to an accelerator. In Platonia, symmetry demands randomization to avoid overlap. Here, symmetry demands uniformity to ensure threshold. The collective good is non-rivalrous; more contributors increase security without diluting value, reversing the incentive structure entirely.

  Stress test — If correlation becomes perfect, EDT converges to SR (pledge). If $N$ drops to 10, CDT pivotality rises, flipping CDT to pledge first. If threshold rises to 999, SR still pledges (if $B>c$), but risk increases. Robustness: Verdicts hold for $N \in [100, 10000]$ provided $B/c > 1.5$ and $\Delta P < c/B$. CDT is most fragile to $N$; EDT to correlation strength; SR to reasoning symmetry.

  How a superrationalist fights back — Critics argue "messy correlation" isn't logical identity. The superrationalist replies that reasoning isn't psychic; it's logical. If the argument for pledging is sound, any competent agent must accept it. Treating others as statistically linked but logically independent implies expecting them to solve the math incorrectly. Superrationality assumes competence: if I see the solution, you do too. Denying this assumes asymmetry in rationality itself.

  Settled vs contested — Consensus: CDT fails large-scale public goods. Contested: Whether SR's logical link exists without source-code sharing. FDT formalizes this, but empirical applicability is debated. Many argue SR collapses to EDT with high $\rho$. I am unsure if "messy" humans sustain the logical link required for SR's strict verdict. The definition of superrationality outside symmetric games remains genuinely up in the air; some say it's just EDT with brave priors.
