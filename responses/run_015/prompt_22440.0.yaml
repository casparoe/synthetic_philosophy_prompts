      *   **Biologists' Perspective:** Why do they keep saying "information"? Because it's a useful shorthand for "causal specificity." DNA has high *causal specificity* over the phenotype compared to other factors (cytoplasm, environment).

  6.  **Refining the Concepts (Self-Correction/Nuance):**
