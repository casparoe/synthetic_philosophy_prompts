  2.  **Deconstruct the Philosophical Argument (Grush et al.):**
      *   *Claim:* DNA isn't a "code" like Morse code.
      *   *Reasoning:* Morse code relies on *convention* (arbitrary mapping). DNA relies on *chemical affinity* (stereochemistry, historical lock-in).
      *   *Nuance:* This is a specific philosophical definition of "code" (semiotic/semantic). Biologists use "code" more loosely (mapping rule).
      *   *Validity:* The user understands this part well. I should validate it but note it's a specific philosophical stance, not a consensus rejection of DNA's functionality.

  3.  **Address the Friend's Challenge (DNA vs. Rock):**
      *   *The Rock:* A rock's layers contain *causal history*. They are a *record* of past events. They don't *instruct* future events.
      *   *The DNA:* DNA contains *instructions* (or constraints) for building/maintaining an organism. It has a *function*.
      *   *Key Distinction:* **Record vs. Program.** Or **Correlation vs. Control.**
      *   *Information Theory:* Shannon information applies to both (reduction of uncertainty). But *Semantic/Functional* information applies differently.

  4.  **Identify the Missing Distinction (The Core of the Answer):**
      *   The user is conflating *Shannon Information* (mathematical/correlational) with *Semantic/Functional Information* (meaning/use).
      *   The "Code" debate is about *Semantics* (how meaning is assigned).
      *   The "Rock" debate is about *Function* (what the information *does*).
      *   *Crucial Point:* Even if DNA isn't a "code" in the strict philosophical sense, it is still *selected for* its capacity to control development. A rock is not selected for its layers.

  5.  **Drafting the Explanation - Step-by-Step:**

