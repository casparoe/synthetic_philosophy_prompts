answer: |-
  You have stumbled into one of the deepest rabbit holes in the philosophy of biology, and your intuition is spot on: you are conflating two different definitions of "information."

  Your friend's challenge ("If DNA isn't a code, how is it different from a rock?") is a classic objection, but it relies on treating all "information" as the same thing. To answer him, and to resolve your own confusion, we need to separate **correlational information** (what rocks have) from **functional information** (what DNA has).

  Here is the walkthrough of where the distinction lies, why the "code" debate matters, and why biologists keep using the word anyway.

  ### 1. The "Code" Argument (Semantics vs. Chemistry)
  First, let's validate what you learned from the video. The argument you're referencing is often associated with philosophers like **Rick Grush**, **Paul Griffiths**, and **Kim Sterelny**.

  Their point is about **semantics** (meaning).
  *   **Human Code (Morse/English):** The link between the symbol (dot/dash) and the meaning (letter) is *arbitrary*. There is no chemical reason why `.-` means "A". It is a convention agreed upon by users.
  *   **DNA:** The link between a codon (GCA) and an amino acid (Alanine) is largely determined by the physical shape and chemical affinity of the tRNA and the ribosome. It's not "arbitrary" in the same way; it's stereochemical.

  So, when philosophers say "DNA isn't a code," they mean it doesn't have **semantic content** derived from social convention.

  **However,** this does not mean DNA lacks **causal power**. This is where your friend's objection comes in.

  ### 2. The Rock vs. DNA (Record vs. Instruction)
  Your friend is arguing that if DNA isn't a "code," its information must just be physical traces, like sedimentary layers or scratches on a phone. In information theory (Shannon Information), he is technically right: both a rock and a DNA molecule reduce uncertainty about the past.

  *   **The Rock (Passive Record):** The layers in a rock correlate with past environmental conditions. If you analyze the rock, you learn about the past. **But the rock does not use that information to do anything.** The layers didn't form *in order to* build a mountain later. They are just a fossilized history.
  *   **The DNA (Active Constraint):** DNA correlates with the ancestors, yes. **But the organism uses the DNA to build itself.**

  Here is the test to distinguish them: **The Intervention Test.**
  *   If you chip off a layer of the rock, does the ancient environment change? **No.** The rock is a passive effect of the past.
  *   If you edit a base pair in the DNA, does the organism change? **Yes.** The DNA is an active cause of the future.

  This is the crucial distinction. A rock contains **correlational information** (it tells you what happened). DNA contains **functional information** (it tells the system what to *do*).

  ### 3. Why is DNA "Special"? (Selected Effect Function)
  You asked: *"If it's the same kind of thing, why do biologists keep talking about 'genetic information' like it's some special, meaningful thing?"*

  The answer lies in **Evolution by Natural Selection.**

  *   **The Rock:** The sedimentary layers were not selected for their ability to store data. They are just physics happening.
  *   **The DNA:** The sequence of DNA exists *because* it successfully directed the construction of viable organisms in the past.

  In philosophy of biology, this is called a **Selected Effect Function**. The "job" of the heart is to pump blood because ancestors with pumping hearts survived. The "job" of DNA is to carry specific instructions because ancestors with specific DNA sequences survived.

  Even if the mapping isn't a "code" by Grush's strict definition, the DNA sequence is **causally specific**. This is a concept championed by philosopher James Woodward.
  *   **Context:** The cytoplasm, the temperature, and the nutrients all affect the organism.
  *   **Specificity:** But if you change the temperature slightly, the organism might adjust. If you change the DNA slightly, the organism changes in a *specific, corresponding way*.

  DNA is treated as "informational" because it is the factor in the system that provides the **specificity** for the outcome. The rock provides no specificity for a future outcome; it is just a leftover.

  ### 4. Resolving the Conflation
  You feel like you are conflating two arguments because **you are.** There are two separate debates happening here:

  1.  **The Semiotic Debate (Grush):** Is the mapping arbitrary/conventional?
      *   *Verdict:* Maybe not. It's chemical. So "Code" might be a loose metaphor.
  2.  **The Causal Debate (Your Friend):** Does the molecule carry instructions or just history?
      *   *Verdict:* It carries instructions (control).

  You can accept Grush's argument (DNA isn't a "code" like Morse code) **without** accepting your friend's conclusion (DNA is just like a rock).

  **The Analogy:**
  Think of a **Recipe** vs. a **Crumb Trail**.
  *   **Grush's Point:** A recipe isn't a "code" if the instructions are written in a language that is physically forced by the chemistry of the ink and paper. (This is a bit abstract, but stick with me).
  *   **Your Friend's Point:** If the recipe isn't a code, is it just like crumbs left on the floor?
  *   **The Answer:** No. The crumbs (rock) tell you where someone *went*. The recipe (DNA) tells the baker what to *make*.

  Even if the recipe is written in a way that isn't "arbitrary," it is still distinct from the crumbs because the recipe is *used* to generate a cake, whereas the crumbs are just a byproduct of eating.

  ### 5. Why Biologists Don't Care (Pragmatism)
  Finally, why do biologists ignore the philosophers and keep saying "Genetic Code"?

  Because **it works.**
  In the lab, biologists treat DNA *as if* it were a code. They "read" the sequence, they "write" new sequences (CRISPR), and they "debug" errors (mutations). The "Code" metaphor is pragmatically true even if it is philosophically imprecise.

  When a biologist says "information," they usually mean **"Causal Specificity selected for by evolution."**
  When a philosopher says "information," they might mean **"Shannon entropy reduction."**
  When your friend says "information," he means **"Physical correlation."**

  ### Summary for your Friend
  Here is how you can answer him:

  > "You're right that both DNA and rocks carry physical correlations about the past. But there's a difference between a **record** and a **program**.
  >
  > A rock is a record; it stores history passively. If you change the rock, you don't change the past. DNA is a program; it stores instructions actively. If you change the DNA, you change the organism.
  >
  > The reason we call DNA 'information' isn't just because it correlates with ancestors (like a rock), but because the organism *uses* it to build itself, and it exists *because* it does that job. A rock's layers weren't selected to store data; DNA was."

  ### The Takeaway
  Your reasoning wasn't wrong, you just mixed up **mechanism** (how the mapping works) with **function** (what the molecule does).
  *   **Grush** is arguing about the **mechanism** (Chemistry vs. Convention).
  *   **Your Friend** is arguing about the **function** (Control vs. Record).

  You can agree with Grush that the "Code" metaphor is imperfect, while still firmly rejecting the idea that DNA is just like a rock. DNA is special because it is the **control parameter** of life, preserved by natural selection specifically for its ability to direct development. That makes it "information" in a way a rock will never be.
