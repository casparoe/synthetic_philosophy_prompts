  You can't satisfy the knowledge norm for assertion when no single mind grasps the entire causal chain from code to temperature output.

  The norm is satisfied because the consortium's verification protocols ensure the group grasps that chain, even if individual cognition is bounded.

  But if a bug skews the sensitivity analysis, you personally lack the evidence to rule out error, so your assertion is epistemically reckless.

  My evidence includes the validated sub-routines written by colleagues, which function as extended cognitive tools rather than mere testimony.

  Treating colleagues' work as tools ignores that they could be wrong, leaving you unable to answer challenges about the model's core assumptions.

  I can answer those challenges by deferring to the module lead, whose expertise is structurally integrated into my own justificatory basis.

  Deferral shifts the burden of proof rather than meeting it, turning the assertion into a placeholder until someone actually checks the math.

  The math is checked continuously through peer review within the consortium, making the collective justification robust enough for public assertion.

  Robustness isn't knowledge, though, and without personal grip on the premises, you're asserting on trust rather than epistemic authority.

  In high-complexity science, trust in the verified structure is the only form of epistemic authority available, so the norm must accommodate distributed cognition.
