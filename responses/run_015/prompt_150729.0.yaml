prompt: |-
  I am preparing the final examination for an upper-level undergraduate seminar on political ethics and public memory, and I need one essay prompt that treats the ethics of commemoration through the specific lens of statues and street names. Rather than asking students to rehearse familiar arguments about presentism or historical context, I want the question to turn on a conceptual distinction we have developed in class: the difference between honorific presence, in which a monument actively bestows civic esteem, and indexical presence, in which a street name functions primarily as a navigational and archival marker rather than a celebration. To force students past mere summary, the prompt should present a concrete scenario: a municipal government is deciding both whether to relocate a bronze statue of a nineteenth-century benefactor—who endowed a public hospital but whose fortune derived partly from colonial extraction—from the hospital’s central plaza to an adjacent museum garden with an interpretive plaque, and simultaneously whether to rename the adjacent avenue that bears his name. Students should be asked to evaluate whether these two acts carry different ethical weights, and whether the museum relocation genuinely transforms the statue’s commemorative status or merely displaces it.

  Please write the essay question itself (suitable for a 75-minute response of approximately 800–900 words), followed by a model answer of about 600 words, and a marking scheme totaling 20 points. The marking scheme should identify five specific analytical moves a top answer must contain—such as distinguishing symbolic endorsement from historical documentation, addressing the asymmetry between spatial navigation and visual honor, assessing whether contextualization in a museum setting neutralizes or preserves commemorative meaning, recognizing that street renaming severs an indexical link without necessarily denying historical record, and confronting whether the benefactor’s mixed legacy creates a conflict between gratitude and accountability—together with the marks each carries and a brief note on the characteristic failure mode for each point. Every part should be rigorous enough that a student who has only memorized slogans about erasing history or cancel culture cannot score highly. End your response with a single line beginning with Verdict: that states in one sentence the core normative distinction the marking scheme is designed to reward.
