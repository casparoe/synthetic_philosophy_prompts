answer: |-
  To map the Superconducting Super Collider (SSC) onto the dollar auction, we must first discipline the analogy by identifying the agents, the stakes, and the mechanism of escalation. In the textbook game, two bidders compete for a fixed prize, paying their bids regardless of victory, with the second-highest bidder losing their money. In the SSC case, the "bidders" were not unitary states but shifting coalitions. The primary bidding agent was the domestic pro-SSC coalition: the Department of Energy, the laboratory contractors, the Texas delegation, and the high-energy physics community. Their counter-bidders were not necessarily CERN, but rather the coalition of fiscal conservatives and competing scientific priorities in Congress. However, viewed internationally, the US coalition was bidding against the European consortium for the prize of discovery priority.

  The option set at each annual appropriation was not simply "build" or "stop." It included continuing at reduced scope, pausing to internationalize, or abandoning the project to join a foreign effort. The prize was heterogeneous. It contained rival goods—national prestige, industrial contracts, and the "Nobel-scale credit" of first discovery—and non-rival goods, specifically the knowledge itself, which remains accessible to losers. This heterogeneity complicates the auction model: in a standard dollar auction, the prize is fixed and fully rival. Here, the loser could eventually access the science, as the US later did with the Large Hadron Collider (LHC).

  Crucially, the mapping fails at the auctioneer. In the canonical game, a third party profits from the escalation, collecting both bids. In the SSC, there was no profit-taking auctioneer. The money spent was consumed by construction; if the project failed, the value vanished rather than transferring to a seller. This absence suggests the dynamic was less a profit-extracting auction and more a war of attrition, where the cost is burned rather than collected. Nevertheless, the escalation mechanism—sequential bidding where dropping out crystallizes a loss—remains structurally intact.

  We must then check the trap condition. The dollar auction bites when a bidder's remaining outlay exceeds the prize's value, yet dropping out is worse because it realizes the sunk cost without the prize. For the SSC, the physics case for a 40 TeV machine was strong; it was a genuinely superior instrument to the lower-energy LHC. If the marginal physics discovery potential was worth the marginal cost overrun, the escalation was rational investment, not a trap. The retrospective verdict of "boondoggle" assumes the prize value was static or declining. However, if the coalition believed the 40 TeV capability was essential for US leadership in basic science, as President Clinton argued, then the continued bidding was consistent with maximizing a high-value prize. The trap only exists if the cost growth outpaced the value of the physics. Given the cost doubled from $4.4 billion to over $8 billion while the tunnel was only partially bored, the marginal cost likely exceeded the marginal physics gain, satisfying the trap condition even if the total prize was valuable.

  Three complications refine this analysis beyond standard sunk-cost psychology. First, the buy-in option. In the canonical game, the loser gets nothing. Here, the US eventually bought into the LHC, contributing to the 2012 Higgs announcement. If a cheap buy-in exists, the rational first move is not to bid heavily but to let the rival build and purchase access. The tragedy, therefore, may not be escalation but a failure to negotiate the buy-in early. The escalation literature focuses on the decision to continue, blinding it to the option of not entering on better terms. The SSC coalition failed to secure the partnership that would have converted the auction into a joint venture.

  Second, the signalling problem. To obtain favorable terms from a consortium, a nation needs a credible threat to build alone. Credibility costs money; a bored tunnel is a convincing signal of commitment. On this reading, the $2 billion spent was not waste but a bargaining investment designed to force European partnership. Cancelling the project destroyed the only asset buying a seat at the table. This view is plausible but suspicious, as it is exactly the argument a vested interest would invent to rationalize money already spent. Distinguishing a genuine costly signal from a retrospective rationalization is difficult; both produce identical spending behavior. Theory is largely silent here, as intent is unobservable without internal memos distinguishing strategic calculation from loss aversion.

  Third, the rhetorical lock. The project was justified domestically as a demonstration of American superiority. This framing discouraged foreign contributions, as partners do not wish to fund a rival's superiority. The narrative that made the project fundable initially made it unsurvivable long-term. The trap was not in the payoffs but in the story the coalition had to tell to hold itself together. The framing locked the US into a solo bid, converting a potential joint venture into a high-stakes auction.

  These complications test the decision theory remedies. The literature suggests fixing limits in advance, separating prospective from retrospective questions, and rotating decision-makers. Congress relitigated the decision annually, which approximates the institutional ideal of repeated fresh evaluation. Yet the project continued for years. This suggests the annual structure cut for escalation rather than against it. Annual appropriations mean each decision was small compared with the whole, a known engine of creeping commitment. Decision-makers were not asked "Should we spend $8 billion?" but "Should we spend another $500 million to save the $2 billion already spent?" The structure incentivized continuing the trap rather than escaping it.

  Furthermore, the theory cannot easily distinguish between the strategic commitment and the sunk-cost error. Both predict continued spending in the face of overruns. The observable evidence would require knowing whether foreign partners were actually willing to join had the signal been maintained. Since the project was cancelled, the counterfactual remains unknown. The theory lacks resources to distinguish a failed strategy from a psychological error when the outcome is identical.

  Ultimately, the SSC fits the dollar auction model where the structure of incremental funding and competitive prestige created a dynamic where rational actors escalated commitment to avoid realizing a loss. The lack of an auctioneer and the availability of a buy-in option show where the model stops fitting, but the escalation dynamic itself was driven by the rules of the game rather than individual irrationality. The annual re-evaluation failed because the structure of the appropriations process made the marginal cost of continuing appear lower than the marginal cost of stopping.

  Verdict: STRUCTURAL-TRAP
