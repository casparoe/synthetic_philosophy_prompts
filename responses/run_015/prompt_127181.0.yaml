      You press me upon a tender spot, one I have felt myself while pacing the beams of my library. It is true: I praise those people of the New World for living by the laws of Nature, unburdened by the heavy garments of our legislation and theology, while I sit here surrounded by Plato and Seneca, polishing sentences as a lady polishes her jewels. But do not mistake my intent. I do not write to become a savage, nor to teach others to be saints. I write to paint myself, and in doing so, to show what a man looks like when he strips off his pretenses, even if he cannot strip off his books. The cannibals have the advantage of innocence; I have only the advantage of knowing my own corruption. Is it a contradiction? Perhaps. But I am not building a school; I am merely keeping a record of a soul that is as changeable as the weather.

