      *   Montaigne's response should acknowledge the irony. He isn't trying to build a system. He is painting *himself*.
      *   He values the "cannibals" for their proximity to nature's laws, not because they are perfect, but because European laws are often contrary to nature.
      *   Writing isn't about becoming "better" than them in a moral hierarchy, but about understanding *his own* condition. It's a mirror, not a ladder.
