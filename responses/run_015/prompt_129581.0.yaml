prompt: |-
  hey, im advising a small hospital ethics board thats trying to write actual withdrawal-of-care protocols, and theyre fed up with philosophers throwing around the doing/allowing distinction without saying which parts change nursing practice. rank these open conceptual problems by which ones matter most for writing rules that staff can actually follow: (1) whether omissions count as causes in the same metaphysical sense as actions when you allow probabilistic causation, (2) whether the killing/letting-die boundary holds up once you factor in structural omissions (like a system-level decision not to staff a unit), (3) how the intended/foreseen distinction should be encoded in protocol language when a single drug dose is both palliative and life-shortening, and (4) whether withdrawing a vent differs morally from never intubating when the patient's prior directive is ambiguous. for each, defend why its upstream of the others, how tractable it is for philosophers rather than clinicians, and what kind of result over the next few years would make you reorder them. also flag which distinctions are probably just paperwork generators that dont change patient outcomes. no citations needed - just defend the agenda like youre talking to people who have to sign forms.
reasoning: |-
