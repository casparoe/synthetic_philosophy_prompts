  2.  **Evaluate the Four Problems (Mental Sandbox):**

      *   *(1) Omissions as causes (metaphysical):* This is deep metaphysics. Does "not doing X" cause death same as "doing Y"? In law/ethics, usually yes, but metaphysically it's a rabbit hole. For a nurse at 3 AM? Irrelevant. They need to know *if* they can stop, not *why* it counts as a cause.
      *   *(2) Killing/letting-die vs. Structural Omissions:* This is about systemic resource allocation vs. individual bedside decisions. Important for admin/policy, but less for the specific *withdrawal protocol* for a specific patient. It's macro, not micro.
      *   *(3) Intended/foreseen (Double Effect):* This is the daily reality of palliative care. Morphine might hasten death. Nurses fear prosecution or moral guilt. Protocols need clear language on *intent* vs. *side effect*. High stakes for staff safety and patient comfort.
      *   *(4) Withdrawing vs. Withholding (Ambiguous Directives):* This is the classic "start vs. stop" dilemma. Legally and ethically, they are usually equivalent, but psychologically and practically, they feel different. Ambiguity creates paralysis. This directly stops or starts the machine.

  3.  **Determine the Ranking (Pragmatic/Actionability Focus):**

      *   *Top Priority:* (3) Intended/Foreseen. Why? Because staff are scared to give meds. If the protocol doesn't clarify this, care suffers immediately. It's actionable.
