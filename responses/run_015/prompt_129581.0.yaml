      *   *Third Priority:* (2) Structural Omissions. Why? It's important for hospital policy (staffing levels), but less for the specific *clinical protocol* of withdrawing care from Patient X. It's background noise for the bedside nurse.
      *   *Last Priority:* (1) Metaphysics of Omissions. Why? It's pure theory. It doesn't tell you *what to do*. It's a paperwork generator.

  4.  **Drafting the Content - Section by Section:**

