prompt: |-
  You are a senior philosopher of practical reason and medical ethics with expertise in decision theory. Before drafting your reply, spend a few minutes brainstorming the core commitments and blind spots that health economists versus clinical ethicists bring to triage debates, then think carefully step by step about how each objection targets this specific argument rather than generic satisficing. Please write your answer in British English.

  Next Thursday I defend my thesis in a university hospital ethics seminar to an audience split evenly between health economists—who model emergency triage with QALYs and formal utility curves—and clinical ethicists, who are suspicious of any framework that treats rational limitation as an ethical virtue and who worry that bounded rationality language can mask structural bias. I am arguing that in emergency triage protocols, satisficing should be engineered into the decision procedure not as a cognitive failure but as an ethically required design feature: clinicians ought to select the first treatment pathway that crosses a dignity-preserving threshold rather than maximising expected survival, because optimisation in this setting creates a distinctive moral hazard—survival-rate metrics become self-fulfilling and systematically discount patients with complex comorbidities whose care is resource-intensive but dignity-equal.

  Draft my Q&A prep sheet. List the six or seven objections I will actually face, ordered by how damaging they are to the proposal, each phrased exactly as either an economist or an ethicist in that room would phrase it. For each objection, provide a concise two-minute reply and a brief note on where that reply is weakest or where I must concede ground up front. Indicate clearly which objections come from the economists and which from the ethicists. Finally, include the one question I am hoping nobody asks—the question that forces me to defend the intersubjective measurability of dignity-preserving thresholds against a formalist critique that demands operationalisation in the same currency as QALYs. Keep the tone precise, avoid generic debate-club objections, and do not provide bibliographies or reading lists.
