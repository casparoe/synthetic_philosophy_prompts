      *   *Crucial Point:* The ball does *not* actually perform infinitely many bounces in reality. It stops when energy < quantum threshold or deformation becomes permanent. The "infinity" is in the classical mathematical model, not the physical object. The physicist knows this but uses it as a "shut up and calculate" model. The philosopher treats the model as metaphysically possible.
