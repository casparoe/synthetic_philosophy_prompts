  6.  **Drafting the Content (Iterative refinement):**

      *   *Key phrase:* "Moral crumple zone." (Elish, 2018). This is crucial literature. The human absorbs the impact of the system failure.
      *   *Key concept:* "Legibility." The human makes the decision legible to the law, even if they didn't make the decision cognitively.
