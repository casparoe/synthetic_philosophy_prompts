      *   *Policy Rule:* The "restorative first" rule is contentious. The newer member's critique is strong: if students don't trust the process, they won't use it. Mandating mediation might exacerbate the trust issue. However, completely abandoning restorative justice isn't ideal either. A hybrid approach seems best: Offer restorative, but allow opt-out if power imbalance or safety concerns are evident, or if the harm is perceived as structural (like racism/xenophobia).
