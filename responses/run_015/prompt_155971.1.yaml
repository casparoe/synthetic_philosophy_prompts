answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY OF TIME AND SPECIAL RELATIVITY**

  **Signatories:** Dr. Elena Vance (Eternalist) & Dr. Marcus Thorne (Theorist of Objective Becoming)
  **Date:** October 24, 2023
  **Context:** Prepared for *The Chronos Review* feature on "The Passage of Time."

  ### Preamble
  After fifteen years of correspondence and debate, we acknowledge that our disagreement is not regarding the empirical adequacy of Special Relativity (SR), nor regarding the mathematical structure of Minkowski spacetime. Our divergence lies in the metaphysical interpretation of that structure and the relationship between physical formalism and ontological commitment. The following document isolates our common ground, specifies the precise locus of our disagreement, and identifies the empirical or theoretical findings that would adjudicate between us.

  ---

  ### 1. Agreed Claims
  *Propositions to which both signatories subscribe.*

  1.  **Formalism Adequacy:** The mathematical formalism of Special Relativity (Lorentz invariance, Minkowski metric $\eta_{\mu\nu}$) is empirically adequate for all currently tested regimes. No experiment to date requires the abandonment of SR in favor of a theory with a fundamental, dynamically active preferred frame.
  2.  **Rietdijk–Putnam Scope:** The Rietdijk–Putnam argument successfully demonstrates that *simultaneity relative to an inertial frame* is not an invariant physical quantity. It establishes that if Event $E$ is simultaneous with Event $O$ for Observer $A$, and Event $F$ is simultaneous with Event $O$ for Observer $B$, $E$ and $F$ need not be simultaneous for either.
  3.  **The Extra Premise:** The move from the Rietdijk–Putnam argument to Eternalism (the Block Universe) requires an additional metaphysical premise: specifically, that "reality" must be transitive across frames of reference in a way that privileges no specific slicing. The argument does not logically compel Eternalism without this premise.
  4.  **Andromeda Paradox:** The "Andromeda Paradox" (where two passersby have different planes of simultaneity intersecting a distant galaxy) illustrates the relativity of coordinate simultaneity. It does not, in itself, prove that the *ontological status* of the Andromedan events differs for the two passersby, nor does it prove they are identical. It highlights the disconnect between causal accessibility and simultaneity slices.
  5.  **Phenomenological Constraint:** Any satisfactory metaphysical account of time must account for the robust human phenomenology of temporal passage (the sense of a moving "now," the asymmetry of memory and anticipation). Dismissing this experience as a total illusion requires an explanation of why the illusion is structurally invariant across observers.
  6.  **Empirical Underdetermination:** Within the strict bounds of standard SR, there is currently no "crucial experiment" that distinguishes between a Block Universe ontology and an Objective Becoming ontology that posits a hidden or relativized becoming. The disagreement is currently metaphysical, not physical.

  ---

  ### 2. Disagreements Table
  *Specification of where the consensus breaks.*

  | Issue | Eternalist Formulation (Vance) | Becoming Theorist Formulation (Thorne) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Future Events** | Future events exist tenselessly. The proposition "Event $E$ occurs at $t_2$" is true now, even if $t_2 > t_{now}$. | Future events do not yet exist. The proposition "Event $E$ occurs at $t_2$" has no truth value until $t_2$ becomes present. | **Genuine.** Concerns truth-makers for future contingents. |
  | **Nature of "Now"** | "Now" is an indexical, analogous to "here." It picks out a location in the block relative to a consciousness, but confers no ontological privilege. | "Now" denotes an ontologically privileged property of existence. It is not merely relational; it marks the boundary of reality. | **Genuine.** Concerns the nature of existence itself. |
  | **Relation of Physics to Metaphysics** | Physical structure (the manifold) exhausts ontological structure. If physics admits no preferred slicing, metaphysics cannot posit one without superfluity. | Physics describes causal relations and measurement; metaphysics describes existence. A preferred slicing may be physically undetectable yet ontologically real (neo-Lorentzian view). | **Genuine.** Concerns methodological naturalism. |
  | **Definition of "Real"** | To be real is to be a part of the four-dimensional manifold. Existence is a quantifier over spacetime points ($\exists x \in M$). | To be real is to be present. Existence is a property that events acquire ($\text{Real}(e, t)$). | **Verbal (partially).** But reflects deeper divergence on whether existence is a property or a quantifier. |

  ---

  ### 3. Cruxes and Adjudication
  *Cases or findings that would bear on the disagreement, with pre-committed predictions.*

  **Crux 1: The Discovery of a Physical Foliation**
  *   **Case:** Future cosmology or quantum gravity reveals a fundamental field that singles out a preferred slicing of spacetime (e.g., a "cosmic time" that is not merely convenient but fundamental to the laws).
  *   **Eternalist Prediction:** This would change the *physics* (we would no longer have strict SR/GR), but not necessarily the *metaphysics*. The Block would simply acquire a distinguished coordinate system. Eternalism remains true; the Block is just structured.
  *   **Becoming Prediction:** This would vindicate Objective Becoming. A fundamental slicing provides the physical anchor required for a universal "now." If the laws distinguish a slice, existence can track that slice.
  *   **Adjudication:** If such a foliation is found, Thorne claims victory. Vance claims the debate shifts but her core thesis (all times exist) holds.

  **Crux 2: Truth Values of Future Contingents**
  *   **Case:** A logical or physical proof regarding whether statements about future quantum measurements have definite truth values prior to measurement.
  *   **Eternalist Prediction:** Compatible with Eternalism that future truths are indeterminate (Open Block). However, if it is proven that future statements *must* have definite truth values for logic to hold, Eternalism is strengthened.
  *   **Becoming Prediction:** If future statements are proven to lack truth values (truth-value gaps), Becoming is strengthened. If they are proven to have definite values, Becoming must adopt a complex account of "unreal but determined" facts.
  *   **Adjudication:** A proof that future contingents *cannot* have truth values would severely damage standard Eternalism.

  **Crux 3: The Arrow of Time without Entropy**
  *   **Case:** A derivation of the psychological arrow of time (memory vs. anticipation) that does not rely on the Past Hypothesis (low entropy boundary condition).
  *   **Eternalist Prediction:** Impossible. The asymmetry of experience must be grounded in thermodynamic asymmetry within the Block. If passage is an illusion, the illusion must be caused by something physical (entropy).
  *   **Becoming Prediction:** Possible. The asymmetry of experience is a direct perception of Objective Becoming. It does not require entropy to explain why we remember the past and not the future; we remember the past because the past *exists* and the future does not.
  *   **Adjudication:** If a non-entropic explanation for temporal asymmetry is found, it favors Becoming.

  ---

  ### 4. Scenario Analysis: The Privileged Foliation
  *Response to the hypothetical scenario: A future cosmology reveals a physically privileged foliation singled out by fundamental fields, lining up with nothing in ordinary experience.*

  **Dr. Vance (Eternalist):**
  "I would not concede that Becoming is real. The existence of a physically distinguished frame (like a CMB rest frame) does not render other frames 'unreal.' In the Block Universe, all slicings are equally valid coordinate systems on the manifold. If the laws of physics prefer one slicing, the Block simply has a grain. It does not mean the future is *unreal* or that the past has *ceased* to exist. My view is robust against this finding; I would only concede that the *symmetry* of the Block is broken, not the *ontology*."
  *   **Evidence against view:** Vance admits only one thing could falsify her view: Proof that existence is *necessarily* tensed logic (i.e., that tenseless existence is a logical contradiction). She does not consider physical evidence sufficient to falsify Eternalism, as Eternalism can absorb any physical structure into the Block.

  **Dr. Thorne (Becoming Theorist):**
  "I would concede that the *argument* from SR to Eternalism was unsound, which I have maintained all along. However, if this foliation turns up, I concede that my specific version of Becoming (which relied on the *possibility* of a hidden foliation) becomes a physical theory rather than a metaphysical add-on. Does this mean the argument was sound all along if no foliation turns up? No. Even without a physical foliation, metaphysics can posit a structure not visible to physics. However, if SR is proven to be the *final* word (no foliation ever), the cost of my view becomes prohibitively high (positing undetectable structure). I would not call it falsified, but I would call it methodologically untenable."
  *   **Evidence against view:** Thorne admits that if SR is confirmed as fundamental and exact at all scales (quantum gravity included) with strict Lorentz invariance, and no preferred foliation emerges, his view loses its primary motivation. He requires *some* physical asymmetry to anchor the metaphysical asymmetry eventually.

  ---

  ### 5. Reporter's Note
  *Confidential assessment from the Philosopher of Physics.*

  **Confidence in Agreed Claims:**
  I am highly confident in Claims 1, 2, and 6. These are matters of record regarding the formalism and the logical structure of the debate. Claim 5 (Phenomenological Constraint) is moderately confident; while both agree experience must be accounted for, they disagree so radically on *how* (illusion vs. perception) that this agreement is thin.

  **Weakest Link:**
  **Claim 3** is the most fragile. It states that Rietdijk–Putnam requires an "extra metaphysical premise" to reach Eternalism. Dr. Vance (Eternalist) privately believes this premise is trivial (a principle of parsimony), while Dr. Thorne believes it is a substantive leap. They have signed it only because they agree it is a *premise*, not because they agree on its weight.

  **Private Hedges:**
  *   **Dr. Vance (Eternalist)** wants to hedge on **Crux 2 (Determinism).** She worries that admitting the future could be "open" (indeterminate) within the Block weakens the intuition of the Block. She wants to assert that "Existence implies Determinacy," but knows this is controversial in modern physics.
  *   **Dr. Thorne (Becoming Theorist)** wants to hedge on **Section 4 (Privileged Foliation).** He is worried that if a foliation is found but it doesn't match human experience (as per your scenario), it doesn't actually save the *phenomenology* of time. He wants to ensure the statement doesn't imply that a physical foliation *automatically* validates the human sense of "now," only that it validates the *ontology* of a privileged present.

  **Assessment of "Verbal" Disagreement:**
  In the Disagreements Table, I marked the "Definition of Real" as partially verbal. This is the crux of my professional assessment. If "real" means "part of the spacetime manifold," Vance wins. If "real" means "currently obtaining," Thorne wins. The 15-year feud persists because neither side accepts the other's definition as fundamental. However, because this definitional choice drives different predictions about truth values and the arrow of time (see Cruxes 2 & 3), the disagreement transcends mere semantics. It is a verbal dispute with non-verbal consequences.
