answer: |-
  BUREAU OF LINGUISTIC COORDINATION
  INTERNAL POLICY DIRECTIVE 88-B
  TO: All Regional Coordination Officers
  FROM: Dr. Alistair Thorne, Director of Semantic Stability
  DATE: 14 October 2023
  SUBJECT: Compliance Protocols for Lewisian Convention Instantiation

  1. **Regularity of Behaviour.** All citizens must submit quarterly Behavioural Regularity Returns (BRR) detailing instances of greeting rituals and signalling mechanisms. Deviation exceeding 5% from the regional mean constitutes a prima facie violation of coordination equilibrium. Spontaneous innovation is prohibited pending review by the Standards Committee. Officers must verify that the regularity is not merely accidental but sustained by repeated interaction over time.

  2. **Conditional Preference.** Agents must demonstrate via notarised preference matrices that their desire to utilise a specific phoneme or gesture is strictly contingent upon the expectation that others will do likewise. Preferences grounded in aesthetic appreciation, moral conviction, or intrinsic utility are inadmissible, as conventions must remain distinct from normative imperatives. If an agent prefers the behaviour regardless of others' actions, the behaviour is classified as a habit, not a convention, and is subject to different tax codes.

  3. **Common Knowledge Disclosure.** Prior to adopting any coordinating solution, all parties must file a Common-Knowledge Disclosure Form (CKDF). It is insufficient merely to know the rule; one must possess verified evidence that all other agents know the rule, know that one knows the rule, and so forth ad infinitum. Failure to establish this infinite regress of mutual awareness invalidates the convention. Officers should note that verbal assertion is not proof; epistemic closure must be demonstrated mathematically.

  4. **Arbitrariness Verification.** Applicants must prove that an alternative signalling system could have served the same purpose. If a greeting is deemed functionally necessary rather than arbitrary, it classifies as a natural constraint rather than a convention and falls outside Bureau jurisdiction. Citizens claiming 'hello' is the only logical option will be fined for ontological confusion. The Bureau maintains a list of approved arbitrary alternatives for reference.

  5. **Embedded Convention Agents.** Special provisions apply to agents whose dispositions to conform are constituted by the very convention they instantiate.
  5.1. Such agents must undergo a 'Pre-Conventional Reset' to restore ontological priority between agent and norm.
  5.2. To be effective, this Reset must be authorised via a commonly known agreement among the affected population.
  5.3. However, as the Reset dissolves the constitutive dispositions required to sustain common knowledge, authorisation must be secured prior to the dissolution of the knowledge required to authorise it. Officers are advised to process these forms simultaneously to avoid temporal paradoxes.

  6. **Dialectical Breach.** Divergence in local dialects shall be treated as a contractual breach of the coordinating solution. Arbitration will be mandatory. Power asymmetries regarding who dictates the standard dialect are deemed irrelevant externalities to the coordination problem and will not be entertained as mitigating factors. Moral objections to the coordinating solution are similarly inadmissible.

  **Commentary on Lewisian Orthodoxy and Contention**

  David Lewis's account in *Convention* establishes several settled core conditions. It is generally accepted that Lewis defines convention as a regularity in behaviour sustained by a system of preferences where agents prefer to conform conditional on others conforming. Furthermore, the distinction between convention and explicit agreement is settled; Lewis argues conventions arise from precedent and expectation rather than promise or contract. The requirement for common knowledge (or common belief) is also a foundational pillar of his model.

  However, significant philosophical contestation remains. Firstly, scholars debate whether conventions can bind agents who lack the right kind of reasons for conformity; if the conditional preference is weak, does the obligation persist? Secondly, the relationship between arbitrariness and normative force is contested. If a solution is truly arbitrary, critics ask, how does it generate a robust 'ought'? Finally, the issue of reflexive embedding destabilises the common-knowledge requirement. As the memo illustrates, if agents' dispositions are constituted by the convention, removing the convention to analyse the agent may dissolve the epistemic grounds required for the analysis itself. There is no consensus on whether Lewis's framework can accommodate these reflexive loops without paradox.

  Summary: The memo absurdly mandates a bureaucratic reset of social dispositions that requires the very common knowledge the reset is designed to eliminate.
