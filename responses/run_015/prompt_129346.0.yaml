answer: |-
  You have asked me to be direct if I think you are framing the question incorrectly. So, I will start there: **Yes, your foundational premise is philosophically unstable.**

  The claim that *"conventions can't also be moral obligations"* is the weak link in your reasoning. It relies on a false dichotomy between "arbitrary coordination" (like driving on the left) and "universal moral law" (like do not kill). In moral philosophy, this is often called the **Conventionalism Trap**. Many of our most serious moral obligations arise *out* of conventions.

  Consider a promise. The act of saying "I promise" is a linguistic convention. There is no universal law that says those specific sounds create an obligation. But once the convention exists, breaking a promise is a moral wrong. Why? Because the convention creates **reliance** and **expectation**.

  Your reasoning treats social norms as merely descriptive (what people *do*) rather than normative (what people have agreed to *uphold*). If we accept your premise, then property rights are also just conventions (this piece of paper says I own this land), and therefore stealing from a tourist in a foreign country wouldn't be morally wrong, just "parochial."

  So, before we get to the specifics of tipping and queueing, we need to correct the map. The question isn't "Is this a convention or a moral rule?" The question is: **"Does this convention create a moral duty through fairness, harm, or reliance?"**

  Here is how that correction plays out across the specific angles you raised.

  ### 1. Queueing: Coordination vs. Fairness
  You compared queueing to driving on the right side of the road. This is a category error.
  *   **Driving Side:** This is a *pure coordination convention*. It doesn't matter which side we pick, only that we pick the same one. There is no inherent moral good in the right side vs. the left.
  *   **Queueing:** This is a *fairness convention*. It is a mechanism for distributing a scarce resource (seats on a bus) based on the principle of "first-come, first-served."

  If you drive on the wrong side, you create chaos. If you jump a queue, you create **harm**. You have stolen time and opportunity from the people behind you. You have taken a benefit (a seat) that you did not fairly earn according to the local system of distribution.
  *   **The Moral Obligation:** It stems from the **Principle of Fair Play**. If you benefit from a cooperative scheme (others waiting their turn so the process is orderly), you have a duty to bear your burden (waiting your turn).
  *   **The Visitor Excuse:** The fact that you are only there for a week does not negate the harm caused to the specific individuals you cut in front of. Anonymity does not grant moral immunity. If you steal a wallet in a city you never visit again, it is still theft. Queue-jumping is a micro-theft of time and position.

  ### 2. Tipping: The Economic Contract
  You suspected the restaurant case was separate. It is not; it is actually the strongest evidence *against* your thesis.
  *   **The Structure:** In many countries (like the US), the "menu price" is not the full wage. It is a partial payment. The social convention is: *Restaurant charges less + Customer pays tip = Worker gets living wage.*
  *   **The Reliance:** The waiter accepts the job *based on the expectation* that this convention will be honored. This is an implicit contract.
  *   **The Moral Obligation:** If you eat the food, you have entered the contract. To refuse the tip in that context is not just "breaking a custom"; it is **reneging on a deferred wage agreement**. You are benefiting from the labor while refusing to pay the agreed-upon price.
  *   **The "Parochial" Locals:** The locals aren't just offended; they are witnessing a violation of economic fairness. If a tourist comes from a country where service is included, they might not *know* the norm. That excuses ignorance, but once informed, continuing to refuse is morally problematic because it exploits the worker's reliance on that tip.

  ### 3. The Cousin's Distinction (Will vs. Should)
  You dismissed your cousin's point as "just a fancier way of saying people get offended." This is a significant philosophical oversight.
  *   **Predictive Expectation (*Will*):** "I expect it to rain." If it doesn't rain, I am surprised.
  *   **Normative Expectation (*Should*):** "I expect you to keep your promise." If you don't, I am not just surprised; I am *aggrieved*. I feel entitled to sanction you.

  Social norms only function because people hold normative expectations. If everyone treated norms as purely predictive ("Oh, they usually tip, but they don't have to"), the norm would collapse immediately. The "offense" locals feel is the enforcement mechanism of a cooperative system. Dismissing it as mere emotion ignores its function in maintaining social trust.

  ### 4. The "Temporary Visitor" Loophole
  You asked: *Does it matter that a visitor is only there for a week and will never see these people again?*
  *   **Moral Philosophy Answer:** Generally, no. Most ethical frameworks (Kantian, Utilitarian, Virtue Ethics) do not allow for "vacation morality."
  *   **The Risk:** If we accept your view, we endorse a form of **moral free-riding**. The tourist benefits from the orderly society (safe streets, functioning restaurants, efficient buses) maintained by the locals following the rules, but exempts themselves from the cost of maintaining that order because they are leaving soon.
  *   **The Exception:** The only time the "visitor" status matters is regarding *knowledge*. If a norm is obscure and unwritten, a visitor cannot be blamed for ignorance. But queueing and tipping in tourist areas are usually salient enough that ignorance is willful.

  ### The Verdict

  Your reasoning breaks down because it assumes that **arbitrariness of origin** (it's just a custom) implies **arbitrariness of obligation** (it doesn't matter if I follow it).

  1.  **Queueing:** It is a moral obligation based on fairness and non-harm. Cutting in line is wrong regardless of where you are from, because it harms specific others.
  2.  **Tipping:** It is a moral obligation based on contract and reliance *in jurisdictions where wages are structured that way*. Opting out is effectively wage theft.
  3.  **The "Convention" Defense:** This only works for pure coordination norms (like which side of the road to drive on). Even then, once you are there, you have a duty to follow the local rule to ensure safety.
  4.  **The Visitor Status:** This is irrelevant to the moral duty, though it may explain (but not excuse) a lack of knowledge.

  **Conclusion:** You are not "off the hook." When you enter a social system, you incur a **duty of reciprocity**. You benefit from the order, the service, and the fairness provided by others following the rules. To refuse to follow them because "they are just conventions" is to treat the locals as tools for your convenience rather than participants in a shared moral community. Your parents were likely arguing about the *pragmatics* (saving money, not looking foolish), but the underlying issue was indeed ethical.
