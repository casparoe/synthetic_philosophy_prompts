  The concept is **Non-Identifiability** (specifically, **Practical Non-Identifiability**).

  Here is why this is the correct fit, why the others miss, and how it answers your specific questions.

  ### The Concept: Non-Identifiability
  In systems modeling and statistics, a model is "identifiable" if you can uniquely determine its internal parameters (or rules) from its external outputs (the pictures). If two different rules produce the exact same output distribution given your specific data collection method, the system is **non-identifiable**.

  You are experiencing **Practical Non-Identifiability**.
  *   **Structural Non-Identifiability** would mean the rules are logically equivalent everywhere (e.g., "X > 5" vs "X > 5 AND (True OR False)"). No amount of data could ever separate them.
  *   **Practical Non-Identifiability** means the rules *are* distinct in the abstract, but your specific data collection process (the generator script) never produces the cases that distinguish them. The data you *can* get is insufficient to identify the true rule, even if the rule is theoretically distinguishable.

  ### Why It Fits (and Others Don't)
  *   **vs. Grue (Goodman's Riddle):** You correctly sensed the difference. Grue is about *temporal* induction (what happens next time?). Non-Identifiability is about *structural* inference (what is happening right now?). Grue assumes you *could* look at the next emerald; your problem is that your generator *cannot* produce the emerald that would falsify the rival rule. Grue is a philosophical problem about justification; Non-Identifiability is an engineering problem about information content.
  *   **vs. Overfitting:** Overfitting implies the rival rule is too complex (memorizing noise). Your rival rules ("count the dots") are often *simpler* than the intended ones ("collinear"). The problem isn't complexity; it's that the data doesn't contain the signal needed to distinguish them.
  *   **vs. Confounding:** Confounding is close (two variables vary together), but it usually refers to causal variables in an experiment. Here, the "variables" are the rules themselves. Non-Identifiability is the broader umbrella that covers rule indistinguishability.

  ### One Phenomenon or Two?
  It is **one phenomenon** (Practical Non-Identifiability) with two different **mechanisms of constraint**.

  1.  **Technical Constraint (The Strip):** Your sampler physically cannot emit non-collinear triples. The "support" of your data distribution is too thin.
  2.  **Aesthetic Constraint (The Snap):** Your sampler *could* emit partial overlaps, but you filter them out to keep problems "clean." The "support" is artificially truncated.

  Mathematically, these are identical failures. In both cases, the likelihood surface for Rule A and Rule B is flat across the entire reachable data space. The generator creates a "blind spot" in the problem space where the two rules alias into each other. Whether that blind spot is caused by a `Math.random()` limitation or a `if (overlap) discard` line of code doesn't change the fact that the data provided to the solver is informationally insufficient to distinguish the hypotheses.

  ### Boundary Cases (Where it Stops Applying)
  *   **True Equivalence:** If the rival rule is logically equivalent to the intended rule *everywhere* (not just in your generator), that is not Non-Identifiability; that is **Equivalence**. (e.g., "Inside" vs "Not Outside").
  *   **Rare Cases:** If the generator *can* produce the counterexample but just hasn't yet (probability > 0), that is not Non-Identifiability; that is just **Sampling Variance**. Run the script longer, and the ambiguity resolves. Non-Identifiability requires the probability of the distinguishing case to be exactly zero (hard constraint) or effectively zero (hard filter).
  *   **Solver Limitation:** If the pictures *do* contain the distinguishing information, but your solver algorithm is too dumb to find it, that is **Computational Intractability**, not Non-Identifiability. The information must be absent from the data itself.

  ### My Uncertainty
  I am least sure about the status of the **Aesthetic Constraint**. In strict systems theory, a hard filter (`if ugly then discard`) creates Structural Non-Identifiability within the *defined system* (because the system includes the filter). However, in the *abstract domain* of geometry, it remains Practical Non-Identifiability. The boundary blurs if your "aesthetic" rules become so restrictive that they define the ontology of the world rather than just the sampling of it. If you decide "partial overlaps don't exist in this universe," then "Inside" and "Disjoint" might actually become structurally equivalent within that universe, shifting the diagnosis from Practical Non-Identifiability to Structural Equivalence.
