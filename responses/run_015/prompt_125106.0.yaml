answer: |-
  **Speech**

  Good morning. You are about to leave a program that taught you how to quantify uncertainty, and you are entering a world that prefers the comfort of false precision. I want to talk to you about how you handle information in that world, using the only framework we all agree is binding: I. J. Good's theorem on the value of information.

  You know the result. For an expected-utility maximizer, free information has non-negative expected value. It is strictly positive only if there is a chance it will change your decision. If you would take the same action regardless of what the signal says, the signal is worthless.

  The standard send-off in this field is "go out and gather more evidence before you decide." Good's theorem tells us that is mostly nonsense. If the evidence won't cross your decision threshold, gathering it is not diligence; it is procrastination dressed up as rigor. But the opposite advice is also wrong. You cannot say "decide on conviction and stop listening." The theorem proves that refusing free information is never the safer play. You cannot know *ex ante* which signals will move you. If you block the channel, you guarantee you will miss the ones that matter.

  So what is left to say?

  The guarantee in Good's theorem is *ex ante*. It applies to the policy of looking, not to the specific thing you find. Before you run the regression, looking is rational. After you run it, you may find a result that is statistically significant, practically irrelevant, and costly to explain. *Ex post*, that specific finding might feel like a waste of time. It might even complicate your life. But you cannot live *ex post*. You live *ex ante*. You must commit to the policy of seeking information that has a non-zero probability of changing your action, while accepting that most individual instances will yield nothing but noise.

  This brings me to the shirt half of you are wearing. "p < .05 is not a decision." Good's theorem agrees. A p-value is a property of the data under a null hypothesis. A decision is a choice of action under uncertainty. Bridging the gap requires a loss function. It requires knowing what you lose if you are wrong. Without that, the information has no value, because you cannot calculate whether it changes the optimal move.

  In your jobs, you will be hired to provide the data, but you will rarely be asked to define the loss function. You will be asked for "one more analysis" by stakeholders who have already decided. They want the information to validate their choice, not to inform it. In the language of the theorem, they are asking you to purchase information that has zero value because the probability of it changing their decision is zero.

  Your job is not to give them the analysis they want. Your job is to ask the question the theorem demands: "If this analysis comes back negative, do you stop the project?" If the answer is no, you are not doing policy analysis. You are doing public relations. Do not confuse the two. Refuse to generate valueless information. It degrades your signal and wastes the organization's capacity to act on the signals that *would* change their minds.

  There is, however, a limitation to Good's theorem that matters more for this room than the math. The theorem assumes your ends are fixed. It calculates the value of information for achieving a goal you already have. It treats your utility function as a constant.

  But that is not what happened to you here. You did not just learn better methods for getting what you wanted two years ago. You wanted different things when you arrived than you do now. You care about different outcomes. You weigh costs differently. The program changed your utility function. Good's theorem has nothing to say about the value of information that changes what you want. It cannot quantify the worth of an education that alters your aims.

  That is the third thing. The theorem tells you how to navigate the world given your goals. It does not tell you how to choose them. But since your goals have already been shifted by this cohort and this faculty, you now face a specific risk. You will return to organizations where the goals are rigid, and the information is used to defend them.

  So here is the instruction. Use Good's theorem to protect your time. Do not gather evidence that cannot move the needle. But use the transformation of this program to protect your judgment. When you are asked to optimize a means for an end you do not share, recognize that the theorem does not apply. You are not being asked to maximize expected utility. You are being asked to minimize cognitive dissonance for someone else.

  Look for the information that matters. Ignore the rest. And remember that the value of your training is not that you know how to calculate the odds, but that you know which games are worth playing.

  Thank you.

  ***

  **Speaker's Note**

  Two commitments regarding the technical claims above.

  First, on whether *ex post* findings can leave you worse off: Strictly speaking, under the assumptions of Good's theorem (Bayesian updating, expected utility maximization, costless information), the answer is no. Your expected utility increases *ex ante*, and since you always choose the optimal action given your posterior, you cannot be "worse off" in terms of decision quality. However, in the real world, information carries cognitive load, time costs, and political risk. If "free" information triggers a mandatory but suboptimal reporting process, or if it induces paralysis in a bounded rationality context, *ex post* welfare can decrease. I have sidestepped this in the speech by framing the "waste" as feeling like noise rather than a utility loss, but technically, the theorem's guarantee breaks if "free" isn't truly costless in all dimensions.

  Second, on information that changes aims: The theorem assumes a fixed utility function $U(\cdot)$. It evaluates $E[\max U(a|info)] - \max E[U(a)]$. If the information changes $U$ itself (transformative experience), the standard formulation is silent. This is not a misstatement in the speech; it is a recognized limitation in decision theory (cf. L.A. Paul). I am taking the position that this silence is critical for a commencement address. The value of the degree was largely transformative (changing $U$), which the math we teach cannot capture. I am asserting that graduates must recognize when they are operating outside the theorem's assumptions—specifically when clients treat ends as fixed when they are actually negotiable.
