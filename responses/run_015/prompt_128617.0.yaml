  Dr Elena Vance, a senior conservator at the National Archive, discovers the sole surviving copy of a foundational legal manuscript is chemically unstable and will become illegible within five years unless treated with a modern synthetic adhesive that irreversibly alters its material composition. Institutional protocols mandate that any material alteration be disclosed in the provenance record, yet such disclosure automatically triggers a deaccession clause resulting in the manuscript's destruction to preserve collection integrity, whereas concealing the treatment preserves both the text and public access but withholds material information from future scholars. Vance faces a choice between adhering to the transparency rule and losing the content forever, or violating the disclosure protocol to save the text for posterity while deceiving future researchers regarding the artifact's physical authenticity.

  Under the Formula of Universal Law, Vance's maxim ('I will conceal alterations only when disclosure ensures total loss') avoids contradiction in conception, as universalising this specific exception does not logically dissolve the institution of archiving itself, whereas the Formula of Humanity forbids the act because it deprives future scholars of the truth required to autonomously pursue their research ends, thereby treating them merely as means to Vance's goal of preservation. This divergence is driven by the embedding of individual moral agency within an opaque institutional protocol that weaponises transparency against preservation; if this feature were removed—such that disclosure did not mandate destruction—both formulas would converge on transparency, as no conflict between truth-telling and preservation would exist. A defender of the Formula of Universal Law might nonetheless attack the counterexample by distinguishing direct from indirect duties, arguing that the perfect duty to truthfulness cannot be violated to fulfil an imperfect duty to cultural preservation, regardless of the institutional constraints.
