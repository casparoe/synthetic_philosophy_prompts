answer: |-
  Here are 7 sharp questions tailored for your podcast on weird decision theory. I've structured them so the first six cover your three required topics (each with a main question and a conditional follow-up), and the seventh closes on a normative risk.

  I've added brief notes in italics to help you navigate the conditional follow-ups during the recording.

  1.  **The Similarity Metric**
      "For logical correlation to hold, my algorithm must be 'similar enough' to yours. But similarity is a spectrum. Where do you draw the line? If I tweak a single non-functional line of code in my source, does the correlation vanish instantly, or does it degrade smoothly? What is the actual metric measuring distance between algorithms?"

  2.  **Similarity Follow-up**
      *(Ask this only if she appeals to a **prior over algorithm-space** to solve the metric problem.)*
      "If you're relying on a prior over algorithm-space to determine that similarity, how do you justify that prior without smuggling in the conclusion you want? Isn't choosing a prior that favors correlation just begging the question about which computations count as 'you' in the first place?"

  3.  **Embedded Agency & Opacity**
      "Let's talk about embedded agency. In the real world, an agent can't fully inspect its own source code—it's too large, or it's part of the environment it's analyzing. If I can't verify my own source code, how can I credibly commit to a policy? How do I signal cooperation if I can't even prove to myself what I'm running?"

  4.  **Embedded Follow-up**
      *(Ask this only if she argues the agent uses a **self-modeling loop that approximates its own policy**.)*
      "If you're using a self-modeling loop to approximate your own policy, doesn't that introduce a regress problem? How do you stop the approximation error from compounding with each iteration until the commitment becomes too noisy to be credible?"

  5.  **The Substrate Asymmetry Scenario**
      "Imagine a niche case: Two agents share a utility function but run on different substrates. One is silicon running a Python script that can edit its own weights; the other is a biological neural net trained on the same loss landscape but locked in its architecture. Does this architectural asymmetry break the logical correlation, or does substrate independence save it?"

  6.  **Substrate Follow-up**
      *(Ask this only if she definitely says **substrate doesn't matter**.)*
      "You say substrate doesn't matter, but consider the capability gap. If the silicon agent can self-modify to defect without penalty while the biological one physically can't, isn't the logical link severed by the difference in *capability* rather than just implementation? How can they be logically correlated if one has an exit door the other lacks?"

  7.  **Acausal Extortion**
      "Finally, if acausal trade is possible, surely acausal extortion is too. If a distant superintelligence threatens to disvalue my goals unless I send it resources, doesn't your framework obligate me to pay up to preserve the correlation? How do you prevent your theory from making agents vulnerable to logical blackmail from malicious simulaters?"
