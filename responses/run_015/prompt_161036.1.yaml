answer: |-
  In a 24-hour distribution center, three non-overlapping shifts sort parcels onto Belt A (standard) or Belt B (exception). Workers never meet; they arrive to see the belts running and leave before the next crew arrives. Everyone conforms to Belt A because Belt B jams frequently if used alone; everyone expects conformity because jams are rare. The choice is arbitrary: Belt B would work fine if everyone used it. However, no worker ever observes another worker observing the belt configuration. Morning crew knows Night crew complied (no jams), but cannot know Night crew knew Morning crew would check, as there is no shared moment to establish mutual awareness of the monitoring. The epistemic chain halts: I know you comply, but I do not know that you know that I know.

  **Lewis Clause:** Common Knowledge fails. Lewis requires a public signal indicating not just compliance, but mutual awareness of expectations. Here, the signal (smooth operation) confirms action, not mutual epistemic states. I infer you comply from the lack of jams, but I lack grounds to know you know *I* rely on that inference.

  **Dynamic Account:** Stability arises from negative reinforcement and mimicry. The norm started when an early worker found Belt A faster; others copied the visible success. It stays because deviation triggers immediate mechanical punishment (jams), requiring no reasoning about others' beliefs. The "stubborn minority" who try Belt B quickly revert upon witnessing the jams.

  **Removal Test:** If shifts overlap slightly, workers see others checking the belts. This shared observation creates the public signal Lewis needs, establishing common knowledge and collapsing the case into a standard Lewisian convention.

  **Lewisian Comeback:** A Lewisian might argue that "common knowledge*" (approximate mutual belief) suffices, or that the lack of jams *is* a public signal of mutual expectations.

  **Verdict:** This comeback redefines "convention" to mean "stable regularity with high-order belief," conceding the evolutionary point. If CK is relaxed to match psychological expectation, the Lewisian machinery becomes redundant. The case holds: a norm can be robust, arbitrary, and expected without satisfying the strict epistemic recursion Lewis demands.
