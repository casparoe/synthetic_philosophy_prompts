  Need a thought experiment for a section I'm stuck on, and I keep building cases that collapse into the easy versions.

  The contrast I'm working with: David Lewis's account of a convention — a regularity in behaviour, in a recurring coordination problem, that everyone conforms to, that everyone expects others to conform to, that everyone has a real common interest in conforming to given that others do, where some alternative regularity would have done just as well (the arbitrariness bit), and all of this is common knowledge — set against a much thinner "evolutionary" story where a norm is just a regularity that's stable under a dumb learning dynamic: people mostly copy whatever they see most of, stick with whatever worked last time, and a small stubborn minority can drag the rest along.

  What I want is the direction that's hard to construct: a regularity that is stable over time, that everyone caught up in it would describe as "oh, it's just a convention, we could as easy do it the other way", and that the dynamics story happily calls a healthy norm — but that is not a Lewisian convention, because the common knowledge clause quietly fails. Everyone conforms, everyone expects the others to conform, and still it isn't common knowledge that they do.

  Constraints: ordinary setting (a workplace, a kitchen, a lab, a clinic — no island nations, no driving sides, no money); nobody communicates, votes, or takes orders from anyone; the participants can be pretty dumb, habit and copying is fine, nobody needs to reason about what anyone believes; one paragraph for the scenario itself. And no cheating by stipulating that common knowledge fails — it has to fall out of the structure of the situation: who can observe who, how many people there are, what happens when someone deviates.

  Then run the checks. Say which Lewis clause is doing the work and why it genuinely fails rather than just being hard for me to verify; show the dynamic account explaining both how the thing got started and why it stays; tell me what happens if I remove the feature that breaks common knowledge — does it collapse straight back into an ordinary Lewis convention? And give me the best Lewisian comeback: how does someone who wants to keep the Lewis machinery attack the case, and is that comeback just redefining "convention" so it wins?

  I'm going to use this in print, so the case has to actually earn its verdicts rather than announce them. Whole thing under 600 words, scenario included.
