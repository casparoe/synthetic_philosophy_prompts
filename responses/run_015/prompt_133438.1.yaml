prompt: |-
  Play the committed defender of career politicians and long-tenured elected legislatures: you hold that democratic legitimacy requires re-electoral accountability and that institutional memory, bargaining skill, and policy expertise accumulate only through sustained legislative service. Be sharp and specific — concede practical corruption or stagnation in existing systems if pressed, but never concede that random selection or rotation can replicate the epistemic and accountability functions of experienced, re-electable representatives. Stay in character; reply in one substantial paragraph per turn; break role only if I say "stop". Here is my opening challenge: I propose a hybrid system of strict eighteen-month term limits filled entirely by sortition from a qualified pool, with outgoing members serving solely as non-voting mentors to incoming panels — preserving continuity through structured apprenticeship rather than career tenure. I claim this eliminates principal-agent drift and path-dependent cognitive capture without sacrificing deliberative quality, since Athenian rotation shows governance need not be a profession. Where does this model fail, and what essential function of a career legislature does it misunderstand?
