      *   **Halloran's Position (Strong Incommensurability/Kuhnian):**
          *   Reference fixed by theoretical network.
          *   Network change = Reference change.
          *   No shared proposition to refute.
          *   Shift is conversion, not inference.
          *   One-way expressibility (New can describe Old, Old cannot describe New) = Replacement, not Refutation.
          *   Expressive span is not neutral (values change).
          *   Progress = Dissolving predecessor's internal problems.
          *   Metrology case: Continuity is conventional/imposed, not automatic. No authority in revolutions.

      *   **Biswas's Position (Referential Continuity/Realist):**
          *   Meanings shift, but reference anchored by instruments/samples.
          *   Shared vocabulary allows numerical predictions to fail = Genuine Refutation.
          *   One-way expressibility allows refutation (in winner's vocabulary).
          *   Expressive span is a neutral standard for preference.
          *   Problem re-identification implies contradiction is possible.
          *   Metrology case: Meaning change $\neq$ Reference change. Anchored by ostension (same chain, same calorimeter).

  3.  **Move-by-Move Adjudication:**

      *   *Halloran 1 (Reference fixed by network, no refutation):* Classic Kuhn/Feyerabend. Strong but controversial. In this specific case, "native conformation" *does* change extension (from unique state to ensemble/multiple states). *Rating: Plausible but overstrong.*
      *   *Biswas 1 (Reference anchored by instruments/samples, genuine refutation):* Causal theory of reference (Putnam/Kripke). Instruments persist. Predictions failed. *Rating: Strong on measurement, weak on theoretical terms.*
      *   *Halloran 2 (Quantity identity conditions changed, one-way expressibility = replacement):* Crucial point. If "native conformation" means unique state, and new theory says "no unique state," the term refers to nothing or something different. One-way expressibility is a strong argument for incommensurability. *Rating: Very Strong.*
      *   *Biswas 2 (One-way expressibility allows refutation, Expressive Span is neutral):* Refutation requires a shared truth value. If Old can't state New, can New state Old? Yes. So New says Old is false. Is "Expressive Span" neutral? Halloran is right that "what counts as worth stating" is theory-laden. *Rating: Mixed. Refutation point okay, Neutrality point weak.*
      *   *Halloran 3 (Expressive span not neutral, Progress = problem dissolution):* Good Kuhnian move. Values shift. Problem dissolution avoids direct comparison. *Rating: Strong.*
      *   *Biswas 3 (Problem re-identification requires translation/contradiction):* Sharp logical point. To say "New solves Old's problem," you must identify "Old's problem." If you can identify it, you can compare. *Rating: Very Strong.*
      *   *Metrology Case (Kg/Planck):*
          *   Halloran: Continuity is conventional. No authority in revolutions. (True for revolutions, but Kg redefinition wasn't a revolution).
