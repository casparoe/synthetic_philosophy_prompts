  4.  **Addressing the Four Puzzles:**

      *   *Refutation vs. One-Way Expressibility:* If New can translate Old but not vice versa, New can assert "Old is false." This looks like refutation. But Halloran says it's replacement because the *terms* in Old don't pick out the same things. *Resolution:* It's refutation of the *claims* made in the old language, but replacement of the *ontology*.
