      *   *Problem:* Compilers aim for *semantic equivalence* (denotational). Translators aim for... what? Aesthetic equivalence? Pragmatic equivalence?
      *   *Attempt 1:* AST = Deep Meaning. Pretty Printer = Surface Form.
          *   *Rejection:* In poetry, the "surface" *is* part of the "AST". You can't separate syntax from semantics easily in NL. In PL, `x + 1` is the same as `1 + x` (mostly). In poetry, "The cat sat" vs "Sat the cat" changes meaning/feel.
      *   *Attempt 2:* IR (Intermediate Representation) = The "Gist".
