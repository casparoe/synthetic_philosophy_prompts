      *   Keep the voice consistent: A peer who knows both fields.

  *(Self-Correction on the Mapping Section)*: I need to make sure I don't just list them. I need to show the *reasoning* for rejection. For example, mapping "Poem" to "Source File" is obvious but shallow. Mapping "Poem" to "Library" is better. Mapping "Meaning" to "IR" is the dangerous one.

  *(Self-Correction on the Virtuosity Point)*: The user thinks Code Golf is unflattering. I should argue that *Performance Tuning* might be a better analogy for high-literary translation, but Code Golf is structurally closer for *form-constrained* translation (Oulipo). I'll present this tension.

  *(Self-Correction on Round-Trip)*: Why does round-trip fail in NL? Because NL is high-entropy and context-dependent. PL is low-entropy (ideally). I need to make sure I don't imply PL is *always* lossless (debug info, comments), but the *semantics* are.

