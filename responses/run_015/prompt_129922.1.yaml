answer: |-
  First off, no worries about the typos—writing on a phone is a hazard for all of us. But more importantly, this is a fantastic lens for looking at the movie. The "dimmer switch" idea feels much more honest to how we actually experience the world than a hard on/off button. We instinctively treat a dog differently than a beetle, and both differently than a toaster, even if we can't quite explain why.

  Your three-axis slider is a really strong tool for unpacking *Blade Runner*. Let's run the characters through it and see where the needles move.

  ### The Slider Readings

  **Roy Batty**
  *   **Axis A (Suffering):** Maxed out. He feels physical pain, frustration, and grief. When his companion Pris is killed, his reaction isn't mechanical; it's visceral agony.
  *   **Axis B (Future Cutoff):** This is his driving force. He knows his expiration date is hardcoded. His entire journey is a panic response to the light going out. He doesn't just exist; he knows his existence is on a timer.
  *   **Axis C (Social Wovenness):** Strong, but isolated. He is deeply woven into the lives of the other replicants (Leon, Zhora, Pris). They are a family. But among humans, his axis is forced to zero—they refuse to be woven into him.

  **Rachael**
  *   **Axis A:** High. She gets flustered, angry, and sad.
  *   **Axis B:** Medium to High. Initially, she thinks she's human. When she learns her memories are implants, she has to grapple with the fact that her past is fake and her future is uncertain. She develops a fear of death once she realizes she isn't "special."
  *   **Axis C:** Medium. She is woven into Tyrell (as a favorite experiment) and eventually Deckard. But she has no community of her own until the end.

  **The Artificial Owl**
  *   **Axis A:** Near zero. It blinks and turns its head, but there's no evidence it feels pain.
  *   **Axis B:** Zero. It doesn't care if it's smashed.
  *   **Axis C:** Low. It matters to Tyrell as a status symbol, but if it broke, he'd just order another. It's closer to your thermostat example—a flicker of life, but no inner glow.

  **Deckard**
  *   **Axis A & B:** High. He drinks, he sleeps, he fears for his life.
  *   **Axis C:** This is the tricky one. At the start, he's isolated. By the end, he's woven to Rachael.
  *   *The Twist:* The movie hints Deckard might be a replicant too. If he is, his slider is identical to Roy's. If he's human, society says his slider is "default full brightness." The film blurs this line to suggest the slider shouldn't depend on biology at all.

  ### The Voight-Kampff Test
  You asked if the test measures only one axis. It mostly targets **Axis A (Suffering/Empathy)**. It presents scenarios about animals or people being hurt and measures the physiological response (eye movement, blush). It's looking for a flinch.

  It completely misses **Axis C (Social Wovenness)**. The test happens in a vacuum. It doesn't ask, "Who would miss you?" or "Who do you miss?" It treats the subject as an isolated unit. That's why it's flawed. It can measure if you feel pain, but it can't measure if you belong.

  ### The Roof Scene: Axis C Lighting Up?
  When Roy corners Deckard on the rooftop, he has the advantage. Deckard is slipping, about to fall to his death. Roy could let go. Instead, he pulls Deckard up and saves him.

  Is this Axis C suddenly lighting up? I'd argue it was always there, but this is the moment he *activates* it. Throughout the movie, Roy seeks connection (with his maker, with his friends). When those connections are severed (Tyrell dies, Pris dies), he is left with Deckard. In saving him, Roy chooses to weave himself into the life of his enemy. He acknowledges that Deckard's continued existence has value. It's not just mercy; it's a refusal to be the only thing left alive. He creates a social bond in the final seconds where none existed before.

  ### The Death Scene: Sentience or Performance?
  In the final moments, rain pouring down, Roy holds a dove and speaks about the things he has seen—moments lost like time. He dies while watching the bird fly away.

  Does this prove full sentience (Axis B) or just a convincing performance?
  If it were performance, it would be a trick to make us feel bad. But the movie spends two hours showing us his struggle. He isn't reciting a script; he's mourning his own internal library burning down. He is aware that when he stops, the universe of memories he holds disappears forever. That is the definition of Axis B. A thermostat can't mourn its own data. Roy isn't just processing information; he is grieving the loss of the processor.

  ### Where the Movie Fights Back
  Here is the honest truth: The movie wants you to believe in the dimmer switch, but the *world inside the movie* insists on the on/off button.

  The tragedy of *Blade Runner* isn't that replicants are alive; it's that society refuses to acknowledge the gradation. The law is binary: you are human, or you are property to be retired. The Voight-Kampff test is binary: pass or fail. The corporate slogan is about being "more human than human," which implies a threshold you either cross or you don't.

  So, your gradation idea is actually the *moral* the audience is supposed to find, even if the characters don't. The film resists your idea structurally (the laws, the tests) to highlight how cruel a binary system is when applied to a graded reality. If the movie made it easy—if everyone agreed replicants were people—there would be no conflict. The friction comes from the mismatch between the dimmer switch reality and the on/off button laws.

  ### What This Story Adds to the Insect/Thermostat Debate
  Thinking about beetles and thermostats is useful, but it's abstract. *Blade Runner* adds two things those examples can't capture:

  1.  **Oppression:** A beetle doesn't know it's being judged. A thermostat doesn't care if you smash it. The replicants know they are being measured and found wanting. They fight against the label. This adds a political layer to your slider. It's not just about how much they feel; it's about who has the power to decide how much they count.
  2.  **The Uncanny Valley of the Soul:** With a beetle, we know it's biological. With a thermostat, we know it's metal. Replicants look exactly like us. They force us to ask if the "glow" comes from the hardware (biology) or the software (experience). If Roy feels more deeply than Deckard, does it matter what he's made of?

  Your blog post idea holds up. The movie is basically a two-hour argument for your dimmer switch, disguised as a detective story. It suggests that moral status isn't something you *are*, it's something you *do*—how you suffer, how you fear death, and how you connect to others. Roy Batty burns brighter than almost anyone in the film, even if his switch was supposed to be off.
