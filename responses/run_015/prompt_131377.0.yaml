answer: |-
  Your intuition is correct: using that slogan in a history of science seminar is a category error that functions as a conversation-stopper rather than an argument. It conflates moral progress with epistemic understanding and uses the former to bypass the work required for the latter.

  Here is the conceptual map of the claims hidden inside "the arc of the moral universe bends toward justice," evaluated for your seminar.

  ### I. The Menu of Hidden Claims

  When your classmate deployed the slogan, they were likely relying on a mixture of these four distinct claims. You can separate them to show where the logic fails.

  #### 1. The Empirical Claim (Descriptive)
  *   **The Claim:** History shows a net increase in justice/moral correctness over time.
  *   **Is it Trivial?** No. It is falsifiable. One could point to the 20th century (genocide, nuclear weapons) to argue the arc is jagged or broken.
  *   **Is it Defensible?** Only with heavy cherry-picking. It depends entirely on how you define "justice" and which metrics you select.
  *   **Does it support dismissal?** **No.** Even if things got better morally, that is a sociological fact. It does not explain *why* phrenology made sense to its practitioners or how their conceptual scheme functioned. A trend does not explain a mechanism.

  #### 2. The Teleological Claim (Metaphysical)
  *   **The Claim:** There is an inherent mechanism or directionality to history that *forces* progress. Justice is gravity; we are sliding toward it.
  *   **Is it Trivial?** No.
  *   **Is it Defensible?** **Weakly.** In secular history of science, this is indefensible. It relies on a providential view (Parker's original context) or a Hegelian/Marxist view of historical inevitability. It removes human agency.
  *   **Does it support dismissal?** **Yes, but dangerously.** If progress is inevitable, then past errors were merely necessary stepping stones. This renders the internal logic of past science irrelevant because the "destination" was guaranteed regardless of the path.

  #### 3. The Epistemic Claim (Presentist)
  *   **The Claim:** Because we are further along the arc, we possess a superior vantage point. We see moral (and by conflation, scientific) truths that were inaccessible to them.
  *   **Is it Trivial?** No.
  *   **Is it Defensible?** **Problematic.** It assumes moral realism (there is one objective "Justice") and that we currently inhabit it. It ignores that future generations may view *our* conceptual schemes as unjust or irrational.
  *   **Does it support dismissal?** **Yes.** This is the core of the "cheat." It asserts that our current position grants us the right to judge without understanding. It turns history into a courtroom where we are the judges, not the investigators.

  #### 4. The Methodological Claim (Normative)
  *   **The Claim:** Because a past practice was morally flawed (unjust), we are excused from analyzing its internal scientific logic.
  *   **Is it Trivial?** No.
  *   **Is it Defensible?** **No.** This is the naturalistic fallacy applied to historiography. A theory can be morally repugnant (eugenics) and scientifically coherent (within its own terms). Understanding the coherence is necessary to understand how science can go wrong.
  *   **Does it support dismissal?** **Yes.** This is the specific move that shut down your seminar. It argues that moral condemnation supersedes historical explanation.

  ---

  ### II. The Whig History Trap

  You asked if using the slogan commits you to Whig history. **Yes, unequivocally.**

  *   **The Definition:** Whig history interprets the past as a linear progression leading inevitably to the present. The present is the "success" condition; the past is evaluated solely by how much it contributed to or detracted from this outcome.
  *   **The Slogan as Whiggism:** "The arc bends toward justice" posits the present (or a near future) as the *telos* (end goal).
  *   **The Consequence:** If you accept the slogan as a historical tool, phrenologists cannot be understood as scientists working within a valid 19th-century paradigm. They must be cast as "benighted" or "obstacles" to the arc.
  *   **Can it survive without Whiggism?** Only if you reinterpret the quote as a **call to action** ("We must bend the arc") rather than a **description of gravity** ("The arc bends").
      *   *As Action:* It is a moral imperative for the present. (Defensible).
      *   *As Description:* It is a Whig narrative of inevitability. (Methodologically fatal for historians).
      *   *In your seminar:* It was used as a description. Therefore, it is Whig history.

  ---

  ### III. The Normative Leap (The "Cheat")

  This is the specific logical gap you felt but couldn't pin down. It is an **illicit slide from Moral Authority to Epistemic Authority.**

  1.  **Premise A:** Phrenology was used to justify racism/slavery (Moral Claim).
  2.  **Premise B:** We are more just than the 19th century (Moral Claim via the Slogan).
  3.  **Conclusion:** Therefore, we do not need to reconstruct the phrenologists' conceptual scheme to understand why they thought it was science (Epistemic/Methodological Claim).

  **Why this is a cheat:**
  *   **Conflation:** It assumes that because a theory was used for *unjust ends*, its *internal logic* is automatically transparent or irrelevant.
  *   **The History of Science Stake:** If phrenology was a "different conceptual scheme" (as your paper argued), then calling it "wrong" is anachronistic. They weren't failing to be us; they were succeeding at being them.
  *   **The Danger:** If we dismiss past science solely because it was morally flawed, we lose the ability to detect how *current* science might be structurally flawed in ways we can't yet see. We assume the "Arc" protects us from error.

  ### IV. Summary for Class Discussion

  If you want to bring this back to the seminar, here is the distilled argument:

  1.  **The Category Error:** The slogan is a **moral** heuristic, not a **historiographical** method. Using it to settle a debate about conceptual schemes confuses *judgment* with *comprehension*.
  2.  **The Whig Commitment:** Using the slogan as a descriptive claim commits you to Whig history. It treats the past as a ladder we have climbed rather than a foreign country we need to visit.
  3.  **The Safety Mechanism:** The slogan functions as an immunity system for the present. It suggests that because we are "more just," we are also "more right" about the nature of reality. History of Science suggests these two things are not correlated.
  4.  **The Stakes:** If we accept the slogan as a method, we stop doing history and start doing hagiography. We lose the ability to understand how rational people come to hold views we now find abhorrent—which is arguably the most important thing history of science can teach us.

  **The One-Liner:** "The arc of the moral universe might bend toward justice, but the history of science doesn't bend toward truth; it meanders through conceptual schemes. Using the former to explain the latter is Whig history disguised as morality."
