      *   **Collective Karma (Sangha):** The board is right that tolerating breach of trust damages the container holding everyone.
      *   **Intention (Cetana):** His intention in helping is good. His intention in lying/stealing is likely fear/self-grasping. Both generate karma.
      *   **Skillful Means (Upaya):** Keeping him *might* be okay if structured as a probationary compassion act, not ignoring the behavior.
      *   **Idiot Compassion:** Staff risks enabling him. Board risks abandoning him.
      *   **Vinaya Context:** In monastic codes, lying about spiritual attainment or persistent stealing is grounds for expulsion. Lay settings are softer, but recovery relies on honesty.
      *   **Conclusion:** The board's stance aligns closer to traditional Sila, but the application needs compassion. The staff's utilitarian view is not traditionally Buddhist.

