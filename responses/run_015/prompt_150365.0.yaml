      *   **Board's Stance:** Ban him after three strikes. Reasoning: Bad karmic seeds, breaking precepts (false speech), tainting collective practice.
      *   **Staff's Stance:** Keep him. Reasoning: Utilitarian calculus (suffering prevented > rules broken), precepts as rules of thumb.
      *   **Question:** Does Buddhist ethics allow this kind of calculus (consequentialism), or is there something deeper about intention/purity that makes the board right?
      *   **Format Requirements:** Bottom line up front (BLUF), then reasoning, no intro, do not repeat the question.

  2.  **Identify the Core Ethical Tension:**
      *   Deontology/Virtue Ethics (Precepts, Purity, Intention, Collective Karma) vs. Consequentialism/Utilitarianism (Suffering Prevented, Net Benefit).
      *   Specific Buddhist concepts: Sila (precepts), Karma (intention/action/consequence), Sangha (community harmony), Upaya (skillful means), Bodhisattva Vow (alleviating suffering).

  3.  **Evaluate Buddhist Ethics on this Issue:**
      *   *Precepts (Sila):* Generally considered training rules, not absolute divine commands, but foundational for stability. Breaking them knowingly creates negative karma for the individual.
      *   *Karma:* Primarily rooted in intention (cetana). However, actions have consequences. Lying undermines trust, which is crucial for recovery.
      *   *Collective Practice:* The board argues that tolerating rule-breaking harms the sangha's integrity. This is a valid concern in monastic/community settings.
      *   *Compassion/Utilitarianism:* The Bodhisattva path emphasizes alleviating suffering. If his actions save lives (prevent relapse), that's heavy positive karma.
      *   *Middle Way:* Neither rigid legalism nor loose consequentialism.
      *   *Vinaya/Monastic Precedent:* Usually, persistent breaking of core precepts (lying, stealing) leads to expulsion to protect the community, *but* lay contexts differ.
      *   *Skillful Means (Upaya):* Sometimes breaking a rule is justified if it serves a higher compassionate end (e.g., lying to save a life), but habitual lying for self-preservation is different from lying to protect others.
      *   *The Specifics:* He lies about *his own* sobriety (self-protection/deception) but is honest about his *mess* to help others. He steals (taking what is not given). These are core precepts (2nd and 4th).
      *   *The Calculus:* Buddhism isn't strictly utilitarian, but it is soteriological (focused on liberation/end of suffering). However, enabling destructive behavior can be "idiot compassion."

