answer: |-
  Buddhist ethics does not support a utilitarian calculus where beneficial outcomes justify breaking core precepts, meaning the board is technically correct that karma does not net out and community integrity is paramount, but a rigid ban without attempting rehabilitation may lack the Compassion and Skillful Means central to Mahayana practice.

  **Karma Is Not Accounting**
  The staff's argument relies on a secular utilitarian framework (net suffering prevented), which is not how karma works in Buddhist doctrine. Karma is intention-specific; wholesome actions generate wholesome results, and unwholesome actions generate unwholesome results. They do not cancel each other out. His driving people to chemo generates merit, but his lying and stealing generate demerit and reinforce habitual tendencies (vasanas) of deceit and grasping. Keeping him based on a "good deeds vs. bad deeds" tally misunderstands the causal law of karma.

  **Sila as Safety, Not Just Rules**
  In a recovery context, the precepts (Sila) function as safety rails rather than arbitrary religious commands. The Second Precept (not taking what is not given) and the Fourth Precept (not lying) are foundational for trust. If residents cannot trust that their belongings are safe or that peers are honest about their sobriety, the container for recovery collapses. The board's concern about "tainting the collective practice" is valid; normalized rule-breaking erodes the Sangha's integrity, potentially causing more long-term harm than his individual expulsion would.

  **Intention and Self-Grasping**
  Buddhist ethics weigh intention (cetana) heavily. His helpful actions likely stem from genuine compassion, but his lying about sobriety and stealing usually stem from fear, shame, and self-grasping. Allowing the self-protective deception to continue enables his delusion, which is ultimately unkind. True compassion (karuna) sometimes requires setting hard boundaries to prevent someone from digging themselves deeper into unwholesome patterns. This is the distinction between "idiot compassion" (enabling) and "wise compassion" (protecting the being from their own harmful habits).

  **The Middle Way and Skillful Means**
  While the board is ethically correct regarding the precepts, a purely punitive approach may lack Skillful Means (Upaya). The Vinaya (monastic code) often expels for persistent breaking of core rules, but lay contexts allow for more flexibility if there is a path to restoration. A binary choice (ban vs. ignore) misses the Middle Way. A Buddhist approach would likely involve transparent confrontation: he stays only if he admits the lies and thefts, makes amends, and accepts strict probation. This honors the precepts (honesty) while honoring the Bodhisattva vow (not abandoning suffering beings). If he refuses honesty, the board's decision to ban him becomes the only ethical choice to protect the community.
