prompt: |-
  I'm in a seminar on moral change right now (we did Appiah's book on honor codes and then the Bernard Williams argument about slavery — the bit where he says the ancients weren't missing any fact that we have, reflection just wrecked their conceptual scheme, and there's no guarantee that whatever replaces it is an improvement) and I also work about fifteen hours a week as a student campaigner for a small NGO that runs behaviour-change campaigns. We greenlight maybe four campaigns a year, each one costs a couple hundred thousand dollars, and our actual method so far is basically: decide the practice is bad, say on a poster that it's bad, measure nothing. I have to run a workshop for our country director and two community advisory board members next month on how we pick and design these things, and I'd rather bring them something usable than a summary of the readings.

  So what I want is a procedure, not an essay. Take the distinction between norms held in place by argument, by interest, and by honour, and turn it into a decision procedure our team could actually run on a candidate practice in an afternoon workshop — the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it has to hand the decision back to a human being because it's really a question about values. The people running it will be comms staff and one field officer, so nothing that needs philosophy vocabulary to apply. Things I think it has to handle, and I'm not sure how: how to work out who the relevant honour audience actually is (whose respect does the person doing the practice need, and can we reach them); whether the practice can even be made visible to that audience, since I suspect a lot of our campaigns target things nobody will admit to anyway; whether there's a face-saving exit ramp so people can stop without conceding they were wrong before — my guess is that's why the anti-dueling stuff worked and our stuff doesn't; and how to tell a case where people already privately agree with us but can't stop because of coordination or money, which I think no amount of honour or argument will fix. I also want it to be honest about the Williams worry my tutor keeps raising, which as I understand it is that a procedure like this can tell you whether you'd win but not whether you're right — if that's a real limit, mark exactly where it bites in the procedure.

  Then run it on three cases. First: the initiation week for the sports clubs at my own university, which involves a lot of drinking and some genuinely nasty hazing that everyone knows about and nobody reports. Second: informal cash gifts that families give to nurses at a district hospital where our partner works — everyone knows it's against the rules, the nurses' salaries are months in arrears, and families who don't pay say they get ignored; I can't tell if this is an interests case, an honour case, or neither. Third, and this is the one where I expect an answer I won't like: our own fundraising imagery, i.e. photos of identifiable children in pretty dire situations that we send to donors because they outperform everything else we've tried. Please don't tell me to go read more — I need something I can put on one page and defend in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** The user is a student working part-time for an NGO running behavior-change campaigns. They are currently studying moral change (Appiah on honor codes, Williams on slavery/reflection).
      *   **Problem:** Current NGO method is "decide it's bad, put it on a poster, measure nothing." This is ineffective.
      *   **Task:** Create a *decision procedure* (not an essay) for selecting and designing campaigns. It needs to be usable in an afternoon workshop by comms staff and a field officer.
      *   **Key Concepts to Integrate:**
          *   Norms held by Argument (reasons/truth).
          *   Norms held by Interest (money/power/survival).
          *   Norms held by Honor (respect/status/reputation).
          *   Williams' Worry: Reflection can wreck a scheme without guaranteeing improvement (procedural success $\neq$ moral rightness).
          *   Specific Mechanics: Identifying the honor audience, visibility of the act, face-saving exit ramps, distinguishing coordination/capacity problems from normative ones.
      *   **Output Format:** One-page usable tool (conceptually), followed by running it on three specific cases (University hazing, Nurse bribes, Fundraising imagery).
      *   **Constraint:** No philosophy vocabulary in the tool itself. Be honest about limits.

  2.  **Deconstruct the Theory for Practical Application:**
      *   *Appiah's Honor Code:* Change happens when the "audience of respect" shifts or when the link between the act and honor is broken. Key mechanism: Face-saving exit (don't admit you were wrong, just that times have changed/you're evolving).
      *   *Interest:* If it's about survival (money, safety), moral suasion fails. You need structural change (pay the nurses).
      *   *Argument:* If it's about facts (smoking causes cancer), information helps, but only if honor/interest aren't blocking it.
      *   *Williams' Worry:* Just because we *can* change a norm doesn't mean we *should*, or that the new norm is objectively "better" in a cosmic sense. It just means we won the local argument. The procedure needs a "Stop & Check Values" gate.

  3.  **Drafting the Procedure (The "Tool"):**
      *   *Goal:* A flowchart or checklist style.
      *   *Language:* Plain English. No "normative schema" or "conceptual scheme." Use "Respect," "Money/Survival," "Facts."
      *   *Step 1: The "Why" Check (Interest vs. Norm).* Is this about survival or status?
      *   *Step 2: The Audience Check (Honor).* Who are they showing off to? Can we reach them?
      *   *Step 3: The Visibility Check.* Can anyone see them doing it? (Secret sins are hard to tackle via honor).
      *   *Step 4: The Exit Ramp.* Can they stop without looking weak/stupid?
      *   *Step 5: The Williams Gate (Values).* Just because we can change it, should we? (This addresses the tutor's concern).

      *Refining the Steps:*
      *   Make it a "Go/No-Go" filter.
      *   *Filter 1: Is it actually a behavior we can touch?* (Visibility).
      *   *Filter 2: What's holding it up?* (Money vs. Respect vs. Ignorance).
      *   *Filter 3: The Honor Map.* (Who matters to them?).
      *   *Filter 4: The Exit.* (Face-saving).
      *   *Filter 5: The Mirror.* (Williams' worry - are we imposing our values?).

  4.  **Developing the Three Cases:**

      *   **Case 1: University Hazing.**
          *   *Interest:* Low (not about money).
          *   *Honor:* High (belonging, toughness, legacy).
          *   *Audience:* Peers, older students.
          *   *Visibility:* High (everyone knows), but reporting is low (code of silence).
          *   *Exit:* Hard. Stopping = weakness.
          *   *Verdict:* Honor campaign *might* work if you shift the audience (e.g., make hazing look pathetic rather than tough), but high risk of backlash.
          *   *Williams Check:* Are we imposing outsider values on a subculture?

      *   **Case 2: Nurse Bribes.**
          *   *Interest:* High (salaries in arrears, survival).
          *   *Honor:* Low/Mixed (maybe shame, but necessity overrides).
          *   *Visibility:* High (open secret).
          *   *Exit:* Impossible without pay.
          *   *Verdict:* **NO GO** for a behavior change campaign. This is a structural/economic problem. A poster is insulting.
          *   *Williams Check:* Calling this "corruption" ignores the economic reality.

      *   **Case 3: Fundraising Imagery (The "One I won't like").**
          *   *Interest:* High (NGO survival, donor money).
          *   *Honor:* Mixed (Donors feel generous, Subjects feel shamed).
          *   *Visibility:* High (Public).
          *   *Exit:* Hard (Donors might stop giving).
          *   *Williams Check:* **CRITICAL.** This is where the procedure bites. We are the ones doing the practice. The "Honor Audience" is donors. Changing this might hurt the mission.
          *   *Verdict:* The procedure reveals this is an *Interest* drive for the NGO, even if framed as *Help*. It exposes the hypocrisy. The Williams worry is central here: We think it's wrong, but our survival depends on it.

  5.  **Refining the Output:**
      *   *Tone:* Professional, direct, actionable.
      *   *Structure:*
          1.  The One-Page Tool (The "Filter").
          2.  The Williams Warning (Explicitly marked).
          3.  The Three Case Runs.
      *   *Self-Correction on Williams:* The user wants to know *where* the procedure admits it can't judge moral rightness. I need to mark a specific step where the team must pause and ask, "Are we sure we're the good guys here?"

  6.  **Final Polish:**
      *   Ensure the distinction between Interest (Money/Safety) and Honor (Respect) is clear.
      *   Ensure the "Exit Ramp" concept is practical (e.g., "New Way" vs. "Old Way was Bad").
      *   Make sure the Fundraising case hits hard, as requested.

      *(Self-Correction during drafting)*: I initially thought about putting Williams at the end. But the prompt says "mark exactly where it bites in the procedure." It should be a gate *before* launch. Let's call it the "Mirror Test."
      *(Refining the Nurse Case)*: Be careful not to say "fix the salaries." The NGO can't do that. The decision is "Do not run a behavior change campaign."
      *(Refining the Hazing Case)*: Focus on the "Audience." If the audience is the seniors, can we reach them? If the audience is the victims, they have no power.

  7.  **Final Review against constraints:**
      *   Procedure not essay? Yes.
      *   No philosophy vocab? Yes (swapped "normative schema" for "rules of respect").
      *   One page style? Yes.
      *   Three cases run? Yes.
      *   Williams worry addressed? Yes.
      *   Fundraising case honest? Yes.

      *Let's write it.*
answer: |-
  # The Campaign Filter: A Decision Procedure
  **Purpose:** To decide if a behavior is suitable for a social change campaign and how to design it.
  **Users:** Comms staff + Field Officer.
  **Time:** 60–90 minutes per candidate practice.

  ---

  ### PHASE 1: THE DIAGNOSTIC (Go/No-Go)
  *Answer these in order. If you hit a **STOP**, do not launch a behavior change campaign.*

  **1. The Survival Check (Interest vs. Norm)**
  *   **Question:** If a person stops doing this tomorrow, will they lose money, safety, or essential services?
  *   **Yes:** **STOP.** This is an economic or structural problem, not a behavior problem. A poster cannot fix unpaid salaries or lack of water.
  *   **No:** Proceed to Q2.

  **2. The Spotlight Check (Visibility)**
  *   **Question:** Can the people whose respect matters (see Q3) actually *see* whether someone is doing this practice?
  *   **No:** **STOP.** You cannot use social pressure for secret acts (e.g., private domestic violence, hidden tax evasion). You need law enforcement or confidential reporting, not a campaign.
  *   **Yes:** Proceed to Q3.

  **3. The Audience Map (Honor)**
  *   **Question:** Who exactly does the person want to impress or avoid shaming? (Be specific: "The community" is wrong. "The village elders" or "Other mothers" is right).
  *   **Follow-up:** Can our campaign reach *that specific group*?
  *   **No:** **STOP.** If you talk to the wrong audience, the pressure won't land.
  *   **Yes:** Proceed to Q4.

  **4. The Exit Ramp (Face-Saving)**
  *   **Question:** Can we frame stopping this practice as "growing up," "joining the modern way," or "protecting the group," rather than "admitting I was wrong/immoral"?
  *   **No:** **STOP.** If stopping requires humiliation, people will dig in. You need a new narrative, not just a rule.
  *   **Yes:** **GREEN LIGHT.** Design the campaign around the Exit Ramp.

  ---

  ### PHASE 2: THE MIRROR TEST (The Williams Check)
  *This step does not measure success. It measures arrogance.*

  **5. The Value Check**
  *   **Question:** Are we trying to change this because it causes measurable harm, or because it makes *us* uncomfortable?
  *   **Question:** If we succeed, do we have a plan to support the new behavior, or do we just want the credit for "changing minds"?
  *   **Risk:** If we win this campaign, we might break a social glue that holds the community together without replacing it.
  *   **Action:** If the team cannot agree on the specific harm (beyond "it's backwards"), **HAND TO HUMAN.** Escalate to the Country Director for a values ruling. This procedure cannot tell you if you are *right*, only if you can *win*.

  ---

  ### CASE RUNS

  #### Case 1: University Sports Hazing
  *   **1. Survival Check:** **No.** (It's about status, not rent/food). **PASS.**
  *   **2. Spotlight Check:** **Yes/No.** Everyone knows it happens, but the specific acts are hidden from admins. However, the *result* (bruises, drunkenness) is visible to peers. **PASS** (Target peers, not admins).
  *   **3. Audience Map:** The audience is **older team members** (who grant status) and **new recruits** (who want belonging).
      *   *Problem:* Our campaign usually targets the public. We need to target the older members' reputation.
  *   **4. Exit Ramp:** **Hard.** Stopping hazing is currently framed as "being soft."
      *   *Pivot:* Frame it as "Real leaders build teams, they don't break them." Make hazing look like the lazy option for weak leaders.
  *   **5. Mirror Test:** **Risk.** Subcultures use initiation to bond. If we break this without offering a new bonding ritual, the team cohesion might collapse.
  *   **Verdict:** **PROCEED WITH CAUTION.** Do not run a "Hazing is Bad" poster. Run a "Leadership is Harder Than Hazing" campaign targeting team captains.

  #### Case 2: Informal Cash Gifts to Nurses
  *   **1. Survival Check:** **YES.**
      *   *Evidence:* Salaries are in arrears. Nurses need to eat. Families need care.
      *   *Analysis:* This is not a "corruption norm." This is a survival market.
  *   **2. Spotlight Check:** Irrelevant.
  *   **Verdict:** **HARD NO.**
      *   *Reasoning:* Running a campaign here is unethical and ineffective. You are asking people to violate a survival mechanism without fixing the economy.
      *   *Action:* Pivot resources to advocacy for nurse pay or emergency relief funds. Do not shame the nurses or the families.

  #### Case 3: Our Fundraising Imagery (Identifiable Children in Distress)
  *   **1. Survival Check:** **YES (For the NGO).**
      *   *Analysis:* The practice is held in place by donor revenue (Interest), not honor.
  *   **2. Spotlight Check:** **Yes.** Donors see the images.
  *   **3. Audience Map:** The audience is **Donors**.
      *   *Problem:* The "Honor" dynamic is twisted. Donors feel virtuous *because* the child is pitiable.
  *   **4. Exit Ramp:** **No.**
      *   *Analysis:* If we stop using these images, we cannot easily frame it as "We are evolving." Donors may interpret it as "You no longer need my money" or "You are hiding something." There is no face-saving way to cut revenue.
  *   **5. Mirror Test:** **CRITICAL FAIL.**
      *   *Williams Worry:* This is where the procedure bites. We are the ones doing the harmful practice. We justify it by "Interest" (keeping the lights on).
      *   *Honesty Check:* If we run a campaign to change *other people's* behavior while doing this, we are hypocrites. If we change *our own* behavior, we risk the organization's survival.
  *   **Verdict:** **HAND TO HUMAN (Country Director/Board).**
      *   *Reasoning:* This is not a comms decision. This is an existential strategic decision. The procedure reveals that our "moral stance" is subsidized by a practice we deem immoral.
      *   *Recommendation:* Do not launch a behavior change campaign externally until this internal contradiction is resolved. You cannot teach honor while selling dignity.

  ---

  ### NOTES FOR THE FACILITATOR
  *   **On Williams:** If the team asks, "But isn't stopping the bad thing good?" remind them: "This tool tells us if the engine works, not if we're driving off a cliff. Phase 2 is where we check the map."
  *   **On Interest:** If money is involved, do not try to solve it with shame. It insults the poor and ignores the rich.
  *   **On Exit Ramps:** Never ask people to apologize for the past. Invite them to a better future.
