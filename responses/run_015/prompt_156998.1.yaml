  10. **Final Polish:** Ensure tone is appropriate for a grad seminar (respectful, rigorous, engaging with theory). (Self-correction: Make sure I don't just tell them they are wrong, but help them refine the argument they *want* to make). Wait, the prompt asks "Which step should I reject... If the argument is actually valid, which premise is the least costly to surrender."
