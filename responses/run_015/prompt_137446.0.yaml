      *   **Task:** Create a decision procedure for reviewers to distinguish between valid high-risk interdisciplinary proposals and those that rely on explanatory shortcuts (skyhooks, greedy reductionism, etc.).
      *   **Constraints:**
          *   Begin with a short brainstorm (dozen lines) on how skyhooks mimic cranes and how real skyhooks slip past reviewers.
          *   Procedure must be ordered tests, plain language (no "skyhook" jargon), sufficient answers, stop-rules (decline/fund), escalation points.
          *   Include verdict categories with wording for letters.
          *   Mark which steps are findings vs. judgment calls.
          *   Incorporate/Sharpen four specific distinctions: Dormant Crane vs. Skyhook, Balancing Books (Order/Organization), Mirror Test (Explanans vs. Explanandum), Ladder Test (Reductionism levels).
          *   Apply the procedure to four specific proposals (Origins of Life/Intrinsic Tendency, Promise-Keeping/Neurochemistry, Molecular Biology/Unidentified Chaperone, Cognitive/Quantum in Warm Wet Brain).
          *   Show reasoning at each step.
          *   At least one verdict must be unwelcome to the chair.
          *   End with limitations/misfire analysis (what gets punished, how revolutionaries look, where ignorance launders into findings).

  2.  **Brainstorming (Skyhooks vs. Cranes in Review):**
      *   *Idea:* Skyhooks look like cranes when they use technical jargon to mask a gap. "Emergence" is often a skyhook painted as a crane.
      *   *Idea:* Real skyhooks get past reviewers when the reviewer is out of their depth and assumes the mystery is technical, not conceptual.
      *   *Idea:* A crane looks like a skyhook when the intermediate steps are merely asserted, not demonstrated.
      *   *Idea:* Reviewers love novelty; skyhooks are novel by definition because they break rules.
      *   *Idea:* A "dormant crane" (unknown mechanism) looks like a skyhook if the proposal doesn't specify *where* to look.
      *   *Idea:* Greedy reductionism looks like rigor because it uses hard science terms (neurons, quantum) to explain soft science problems (culture, cognition).
      *   *Idea:* Time pressure (20 mins) favors smooth writing over structural integrity. Skyhooks are often smoother because they skip the hard bits.
      *   *Idea:* Interdisciplinary proposals suffer when one side assumes the other side's problems are solved.
      *   *Idea:* A real skyhook slips past when the reviewer confuses "mathematically possible" with "physically plausible."
      *   *Idea:* Cranes look boring; skyhooks look exciting. High-risk schemes bias toward skyhooks.
      *   *Idea:* The "black box" problem: is it a placeholder for future work (crane) or a magic wand (skyhook)?
      *   *Idea:* Reviewers defer to "expert confidence" even when the logic is circular.

  3.  **Developing the Procedure (The "Explanatory Budget" Check):**
      *   Need to translate Dennett's terms into plain language.
      *   *Skyhook* -> "Magic Assumption" or "Unpaid Debt".
      *   *Crane* -> "Buildable Mechanism".
      *   *Greedy Reductionism* -> "Level Skipping".
      *   *Mirror Test* -> "Mystery Shift".
      *   *Ladder Test* -> "Level Translation".
      *   *Balancing Books* -> "Source of Order".
      *   Structure:
          1.  The Mystery Shift (Mirror Test).
          2.  The Source of Order (Balancing Books).
          3.  The Level Skip (Ladder Test).
          4.  The Placeholder Check (Dormant Crane vs. Skyhook).
      *   Stop rules: Fail 1 or 2 = Decline. Pass 4 = Fund (if science is sound). Fail 3 = Escalate/Judgment.
      *   Verdicts: Fund, Decline (Conceptual), Decline (Feasibility), Escalate.

  4.  **Refining the Four Distinctions:**
      *   *Dormant Crane vs. Skyhook:* Keep this. It's crucial for high-risk funding. Key is *detectability* and *category*.
      *   *Balancing Books:* Entropy/Order. Where did the specificity come from?
      *   *Mirror Test:* Is the cause as mysterious as the effect?
      *   *Ladder Test:* Can you talk about the phenomenon at its own level without losing it?

  5.  **Drafting the Procedure:**
      *   Name: The Explanatory Budget Protocol.
      *   Step 1: The Mystery Shift (Mirror Test). Does the explanation introduce a new mystery equal to the old one?
      *   Step 2: The Source of Order (Balancing Books). Where did the structure come from?
      *   Step 3: The Level Check (Ladder Test). Can the explanation speak the language of the phenomenon?
      *   Step 4: The Missing Piece (Dormant Crane). If something is unknown, is it searchable?
      *   Escalation: When it's about plausibility thresholds (risk appetite).

  6.  **Applying to Proposals:**
      *   *Proposal 1 (Origins of Life/Intrinsic Tendency):* Fails Step 1 (Mystery Shift). "Tendency to complexify" is as mysterious as "life". Fails Step 2 (Source of Order). No budget for order. Verdict: Decline. (Chair might like this one, so this is a conflict).
      *   *Proposal 2 (Promise-Keeping/Neurochemistry):* Fails Step 3 (Level Check). Greedy reductionism. Ignores institutional level. Verdict: Decline.
      *   *Proposal 3 (Molecular/Unidentified Chaperone):* Passes Step 4 (Dormant Crane). It specifies *kind* and *detection*. Verdict: Fund.
      *   *Proposal 4 (Cognitive/Quantum in Warm Wet):* Fails Step 2 (Source of Order/Physics) or Step 4 (Searchable). Quantum decoherence is the issue. If they don't address decoherence, it's a skyhook. Verdict: Decline. (Chair thinks this is theatre, procedure agrees. Need an unwelcome verdict).
      *   *Wait, I need an unwelcome verdict.* The Chair says Proposal 1 is the "panel's favourite". If the procedure kills Proposal 1, that is unwelcome. The Chair says Proposal 4 is "theatre". If the procedure kills Proposal 4, that is welcome. If the procedure funds Proposal 4, that is unwelcome. But Proposal 4 is famously problematic (Penrose/Hameroff style). A rigorous procedure should kill it. Proposal 1 (Intrinsic Tendency) is also philosophically weak (vitalism-ish). Killing Proposal 1 is the most likely "unwelcome" result because the panel *likes* it. I will make sure the procedure kills Proposal 1.
      *   *Alternative:* What if the procedure flags Proposal 3 as risky? No, Proposal 3 is standard science.
      *   *Alternative:* What if the procedure suggests Proposal 2 needs escalation rather than decline? No, greedy reductionism is usually a hard no.
      *   *Decision:* The unwelcome verdict will be on Proposal 1. The panel loves it; the procedure must reject it as a Skyhook (Mystery Shift).

  7.  **Finalizing Limitations/Misfires:**
      *   Punishes true paradigm shifts that lack vocabulary.
      *   Favors incrementalism disguised as innovation.
      *   Reviewer ignorance launders at Step 3 (Level Check) if reviewer doesn't know the higher level.

  8.  **Writing - Tone and Style:**
      *   Professional, precise, slightly weary but rigorous.
      *   No jargon like "skyhook" in the procedure itself.
