      *   Check the "misfire" section. Needs to be honest about how procedures stifle genius.

  12. **Final Polish:** Check tone. Ensure the philosopher voice comes through in the analysis but the administrator voice dominates the procedure.

  *(Self-Correction on Brainstorm)*: Keep it tight.
