answer: |-
  ### Brainstorm: The Camouflage of Magic

  A skyhook mimics a crane when it wears the uniform of a specific discipline; a biologist will accept a physical assumption they cannot check, and a physicist will accept a biological teleology they cannot falsify. Real skyhooks slip past busy reviewers when the writing is confident and the math is dense, masking the fact that the input equals the output. A dormant crane looks like a skyhook when the proposal lacks the vocabulary to describe the missing gear, but a true skyhook lacks the gear entirely. Reviewers often mistake novelty for depth; a mechanism that breaks known laws looks like innovation rather than impossibility. Time pressure favors smooth narratives over structural integrity; skyhooks are smoother because they skip the friction of intermediate steps. A real skyhook survives when the reviewer assumes, "They know something I don't," rather than asking, "Where did that order come from?" Greedy reductionism passes as rigor because it uses hard numbers to explain soft problems. The most dangerous skyhooks are those that posit a "law" to explain the exception, rather than explaining the exception within the law. We fund cranes; we must not fund wishes dressed as engineering.

  ***

  ### The Explanatory Budget Protocol (EBP)

  **Purpose:** To distinguish between high-risk mechanistic gaps (fundable) and explanatory shortcuts (unfundable).
  **Time Required:** 15 minutes of active reading + 5 minutes scoring.
  **User:** Specialist reviewer in one relevant field, non-specialist in the other.

  **Step 1: The Mystery Shift (Mirror Test)**
  *   **Question:** Is the mechanism proposed to explain the phenomenon just as mysterious as the phenomenon itself?
  *   **Instruction:** Identify the core "engine" of the proposal. Ask: If I asked "How does *this* engine work?", would the answer require the same level of explanation as the original problem?
  *   **Sufficient Answer:** The engine relies on established processes (e.g., chemical binding, natural selection, known cognitive biases) even if their arrangement is novel.
  *   **Stop Rule (Decline):** If the engine posits a new force, tendency, or capacity that is itself unexplained and specific to this problem.
  *   **Finding vs. Judgment:** Finding (Logical comparison of complexity).

  **Step 2: The Order Budget (Balancing Books)**
  *   **Question:** Where does the specificity or organization come from?
  *   **Instruction:** Identify the increase in order, function, or fit claimed by the proposal. Trace the source.
  *   **Sufficient Answer:** The proposal identifies a source (energy gradient, selection pressure, pre-existing structure, information input) that pays for the increase in order.
  *   **Stop Rule (Decline):** If order appears spontaneously without a identified source or budget (e.g., "matter tends to organize" without a thermodynamic account).
  *   **Finding vs. Judgment:** Finding (Conservation principle check).

  **Step 3: The Level Translation (Ladder Test)**
  *   **Question:** Can the explanation describe the phenomenon at its own level, or does it disappear when looked at directly?
  *   **Instruction:** Ask the proposal to describe the phenomenon using the vocabulary of its own level (e.g., social, biological, cognitive) without reducing it immediately to parts.
  *   **Sufficient Answer:** The proposal acknowledges the higher-level pattern and shows how the lower-level mechanism sustains it without denying its existence.
  *   **Stop Rule (Escalate):** If the proposal claims the higher level is "merely descriptive" or "illusory" but relies on higher-level terms to define the problem.
  *   **Finding vs. Judgment:** Judgment (Requires assessing disciplinary norms).

  **Step 4: The Missing Part Search (Dormant Crane Check)**
  *   **Question:** If a mechanism is unidentified, is it searchable?
  *   **Instruction:** Check if the proposal specifies the *category* of the missing thing and how to detect it.
  *   **Sufficient Answer:** The proposal states what kind of entity it is (e.g., protein, neural circuit, social norm) and gives a method to find or falsify its presence.
  *   **Stop Rule (Fund):** If the mechanism is unknown but the search strategy is sound and Steps 1-3 are passed.
  *   **Finding vs. Judgment:** Finding (Methodological check).

  **Verdict Categories**
  1.  **Fund:** Passes all steps. Risk is in execution, not logic.
  2.  **Decline (Conceptual):** Fails Step 1 or 2. The explanation owes a debt it cannot pay.
  3.  **Decline (Feasibility):** Passes 1-2, Fails 4. The search is ill-defined.
  4.  **Escalate to Panel:** Fails Step 3 only. The issue is disciplinary boundary-setting, not factual error.

  ***

  ### Application to Proposals

  #### Proposal One: Origins of Life / Intrinsic Tendency
  *   **Step 1 (Mystery Shift):** The proposal posits a "law-like intrinsic tendency of matter to complexify."
      *   *Reasoning:* The phenomenon to be explained is biological organization (complexity). The explainer is a tendency to complexify. The explainer is exactly as mysterious as the phenomenon.
      *   *Result:* **Fail.**
  *   **Step 2 (Order Budget):** The proposal treats design as a "surface expression" of this tendency.
      *   *Reasoning:* No source is identified for the order. It is posited as a fundamental property without a thermodynamic or informational budget.
      *   *Result:* **Fail.**
  *   **Verdict:** **Decline (Conceptual).**
  *   **Reasoning:** This is a classic skyhook. It renames the mystery ("life") as a law ("tendency") without providing a mechanism that pays for the order. It violates Step 1 and 2.

  #### Proposal Two: Promise-Keeping / Neurochemistry
  *   **Step 1 (Mystery Shift):** Explains social norm (promise-keeping) via reward circuitry.
      *   *Reasoning:* Neurochemistry is less mysterious than social norms generally. Passes Step 1.
  *   **Step 2 (Order Budget):** Order comes from evolutionary selection on circuits.
      *   *Reasoning:* Plausible budget. Passes Step 2.
  *   **Step 3 (Level Translation):** Proposal states institutional stories are "merely descriptive."
      *   *Reasoning:* It attempts to explain a social phenomenon while denying the reality of the social level. Yet, "promise-keeping" is a social definition, not a neural one. You cannot locate a "promise" in a synapse without referencing the social contract that defines it. The proposal spends social currency (the definition of the problem) while claiming to only use neural currency.
      *   *Result:* **Fail.**
  *   **Verdict:** **Escalate to Panel.**
  *   **Reasoning:** This is greedy reductionism. It is not factually impossible that neurons underlie behavior, but the claim that the social level is "merely descriptive" undermines the phenomenon being studied. This is a judgment call on disciplinary boundaries (Step 3), not a hard factual error.

  #### Proposal Three: Molecular Biology / Unidentified Chaperone
  *   **Step 1 (Mystery Shift):** Posits a buffering mechanism.
      *   *Reasoning:* A chaperone is a known class of thing. Not mysterious. Passes Step 1.
  *   **Step 2 (Order Budget):** Buffering prevents error.
      *   *Reasoning:* Energy cost implied in protein folding. Passes Step 2.
  *   **Step 3 (Level Translation):** Molecular problem explained at molecular level.
      *   *Reasoning:* No level skipping. Passes Step 3.
  *   **Step 4 (Missing Part Search):** Mechanism unnamed, but kind (chaperone-like) and detection method (screen) specified.
      *   *Reasoning:* This is a dormant crane. We know what kind of thing it is and how to look for it.
      *   *Result:* **Pass.**
  *   **Verdict:** **Fund.**
  *   **Reasoning:** This is standard, high-risk science. The gap is acknowledged and searchable. It fits the "Dormant Crane" distinction perfectly.

  #### Proposal Four: Cognitive Phenomenon / Quantum in Warm Wet Brain
  *   **Step 1 (Mystery Shift):** Posits quantum mechanism for cognition.
      *   *Reasoning:* Quantum mechanics is well understood; cognition is not. However, applying QM to cognition often shifts the mystery rather than solving it. Let's look closer.
  *   **Step 2 (Order Budget):** Sustained quantum state in warm, wet tissue.
      *   *Reasoning:* Known physics suggests rapid decoherence in this environment. To sustain the state requires energy or isolation not budgeted for. The proposal asserts the sustenance without explaining the protection against decoherence.
      *   *Result:* **Fail.**
  *   **Step 4 (Missing Part Search):** Does it specify how to detect the quantum state?
      *   *Reasoning:* Usually, these proposals rely on indirect behavioral evidence, not direct physical detection of the quantum state. If they don't specify how to measure the coherence, it fails Step 4.
      *   *Result:* **Fail.**
  *   **Verdict:** **Decline (Conceptual).**
  *   **Reasoning:** While the Chair suspects "theatre," the procedure identifies a specific failure in the Order Budget (Step 2). It posits a state (quantum coherence) that requires specific conditions (isolation/cold) which the environment (warm/wet) actively destroys, without explaining the mechanism of protection. This is borrowing physical possibility without paying the thermodynamic cost.

  ***

  ### The Unwelcome Verdict

  **Proposal One (Origins of Life)** is the verdict you will not like.
  **Why:** You noted this is the "panel's favourite going into the round." It is well-written and exciting. My procedure kills it immediately at Step 1 and 2.
  **Reasoning:** You will find this unwelcome because the procedure strips away the rhetorical beauty of "intrinsic tendency" to reveal it as a tautology. It says "Life exists because matter wants to be complex." The procedure forces you to admit that this is not a mechanism, but a restatement of the wonder. Funding this feels like funding poetry, not science. The procedure protects the fund from buying a metaphor, but it may feel like stifling a grand vision.

  ### Limitations and Misfires

  **1. The Revolutionary Penalty:**
  This procedure will systematically punish true paradigm shifts that lack existing vocabulary. If a proposer discovers a new level of reality (e.g., a new fundamental force), they will fail Step 1 (Mystery Shift) and Step 2 (Order Budget) because they cannot point to an existing "budget" or "established process." The EBP assumes the universe is closed; genuine breakthroughs often look like skyhooks until the crane is built. A proposal that says "Current physics is incomplete" will fail Step 2.

  **2. The Ignorance Laundering:**
  Reviewer ignorance is most likely to be laundered into a finding at **Step 3 (Level Translation)**. A reviewer specialist in the lower level (e.g., physics) may genuinely believe the higher level (e.g., biology) is "merely descriptive." They will mark this as a Pass, thinking they are being rigorous, when they are actually being reductionist. Conversely, a higher-level specialist may mark a valid reduction as a Fail because they feel their level is being "explained away." This step relies on the reviewer's humility regarding the ontology of the other field.

  **3. The Conservatism of the Budget:**
  The "Order Budget" (Step 2) relies on current conservation laws. If a proposal suggests a novel way energy or information is stored that violates current heuristics but is physically possible, the procedure will flag it as "borrowing order." It favors explanations that fit within the current ledger of science. It is designed to prevent fraud and magic, but the cost is that it makes "normal science" look safer than "revolutionary science," even in a high-risk scheme. It distinguishes well between cranes and skyhooks, but it cannot distinguish between a skyhook and a crane that hasn't been invented yet.
