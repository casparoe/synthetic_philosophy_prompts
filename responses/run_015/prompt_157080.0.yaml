      *   *Candidate 4: Psychology/Anthropology of Group Identity.*
          *   *Evidence:* Evolutionary psychology suggests in-group/out-group bias is innate. "Imagined" doesn't mean "fake," but the *capacity* to imagine large groups might be older.
          *   *Impact:* Challenges the idea that this is purely a structural/modern cognitive shift.
          *   *Ranking:* **Awkward.** Modernists can say "capacity != actualization."

  5.  **Address the "Unfalsifiability" Charge:**
