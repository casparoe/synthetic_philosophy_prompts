prompt: |-
  me and my friend got into it last night about whether nations are basically modern fiction or if there's something older going on. i ended up defending the pretty hardcore version: hobsbawm's invention of tradition plus anderson's imagined communities, but taken all the way. like, there just are no nations before ~1800, period. premodern ethnic labels were just administrative tags or local slang with zero mass emotional pull, and every ancient tradition is either dynastic PR or folklore that got retrofited in the 19th century. my friend threw this niche thing at me: if print-capitalism is what makes the nation imaginable, then korea and china had woodblock printing and mass vernacular texts centuries before europe — so why didn't they develop horizontally imagined national communities then? i said the mechanism needs specific social conditions (market integration, standardized bureacracy, vernacular literacy reaching beyond elites) that weren't present, but honestly that sounds like i'm just adding epicycles. so i want you to take this position seriously and tell me what actually counts against it. not the usual but people loved rome stuff — i mean what observations, historical cases, or results from other fields (say, about collective identity in general, or about how premodern states actually worked) would genuinely hurt this view? rank them from fatal to just awkward. also be honest about whether defenders of the hard modernist line would concede each one or just dismiss it. and don't hedge — take a definite stance on whether the east-asian printing objection is actually damaging or just a red herring, and whether the view has been qualified into unfalsifiability. i want a committed answer with reasons, not both-sidesism.
reasoning: |-
