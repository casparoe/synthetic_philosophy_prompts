      *   *Mechanism:* Print capitalism + standardized bureaucracy + mass literacy = imagined community.
      *   *Premodern Reality:* Dynastic loyalty, religious identity, localism. No "mass emotional pull" of ethnicity/nation.
      *   *Vulnerability:* It relies heavily on a specific definition of "nation" (sovereign peoplehood) and a specific mechanism (print capitalism). If "national sentiment" exists without these, or if the mechanism exists without the result, the theory wobbles.

