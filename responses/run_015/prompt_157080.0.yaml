      *   *Stance:* The theory *has* been qualified into near-unfalsifiability regarding the *definition* of nation, but remains falsifiable on the *mechanism* (print capitalism). The East Asian objection is damaging to the *mechanism*, not necessarily the *periodization*, but it forces the epicycles the user fears.

