      *   *Noisy Signal Variant:* The signal is probabilistic. $P(\text{Ride} | \text{Signal High}) > P(\text{Ride} | \text{Signal Low})$. But the noise means $P(\text{Signal High} | \text{Intend to Pay}) < 1$.
      *   *The Crux:* At the moment of payment (in town), the ride is already secured (sunk cost). The question is: Does the decision procedure used *in town* affect the probability of the signal *at the start*?
      *   *Camp A (Pay):* Implicitly adopting Evidential Decision Theory (EDT) or Updateless Decision Theory (UDT). Your disposition *causes* the signal, which *causes* the ride. Even if noisy, maximizing the disposition maximizes expected utility ex-ante.
      *   *Camp B (Don't Pay):* Implicitly adopting Causal Decision Theory (CDT). At the moment of action, the ride is fixed. The signal is in the past. Paying costs money, yielding no causal benefit *now*.

