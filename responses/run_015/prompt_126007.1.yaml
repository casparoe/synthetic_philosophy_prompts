      *   *Key Insight:* The disagreement isn't just about decision theory; it's about *what constitutes a reason for action*. Is it the *ex-ante* optimality of a policy (Camp A) or the *ex-post* optimality of an act given fixed history (Camp B)?

  4.  **Diagnose the Disagreement:**
      *   **Substantive:** It is fundamentally CDT vs. EDT/UDT, but the "noise" parameter makes it an *empirical/threshold* question masquerading as a conceptual one. At what level of noise does the evidential link become too weak to override the causal cost?
