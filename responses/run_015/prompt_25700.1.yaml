answer: |-
  You have identified a precise and pervasive mechanism of epistemic oppression. You are correct that it doesn't fit neatly into Miranda Fricker's original 2007 definitions of *testimonial* or *hermeneutical* injustice, because it operates in the gap between *reporting* facts and *authorizing* meaning.

  While there is no single, universally standardized term like "Testimonial Injustice" for this specific phenomenon, contemporary social epistemologists and feminist philosophers have developed several concepts that map exactly onto what you are describing.

  Here are the best philosophical characterizations for this dynamic, ranked by how closely they fit your description.

  ### 1. Contributory Injustice (Kristie Dotson)
  The strongest fit in current literature is **Contributory Injustice**, coined by philosopher Kristie Dotson (2011).
  *   **The Concept:** This occurs when an agent is willing and able to contribute to the shared pool of hermeneutical resources (concepts, interpretations, theories), but is prevented from doing so due to prejudice.
  *   **Why it fits:** In your examples, the marginalized person *has* the concepts (unlike in Fricker's hermeneutical injustice) and is *speaking* (unlike in testimonial quietism). However, their contribution is blocked at the level of *interpretation*. They are allowed to contribute "data" (the raw experience) but barred from contributing "theory" (the meaning of that data). This prevents their interpretive framework from entering the shared social understanding.

  ### 2. Willful Hermeneutical Ignorance (Gaile Pohlhaus Jr.)
  Philosopher Gaile Pohlhaus Jr. (2012) expanded on Fricker to describe **Willful Hermeneutical Ignorance**.
  *   **The Concept:** This describes when dominant agents refuse to use the hermeneutical resources available to them (i.e., the marginalized person's explanation) because acknowledging them would require admitting to their own complicity in oppression.
  *   **Why it fits:** When the woman describes the sexism and the analysis is dismissed, the listeners are often engaging in willful ignorance. They accept the fact because it is undeniable, but they reject the *systemic analysis* because accepting it would implicate the workplace culture they benefit from. They prefer the "objective" analysis of the outsider because it protects the status quo.

  ### 3. Epistemic Objectification / Instrumentalization
  Your intuition about the "division of epistemic labor" is described by some scholars as **Epistemic Objectification**.
  *   **The Concept:** This is when a knower is treated not as a full epistemic agent (someone who generates knowledge), but as an epistemic *object* or *resource* (someone who generates data).
  *   **Why it fits:** This captures the "Data Provider vs. Theorist" split perfectly. The marginalized person is treated as a sensor or a witness (a source of raw input), while the privileged person is treated as the processor or judge (the source of wisdom). The marginalized person is instrumentalized for their access to the experience, but denied authority over its significance.

  ### 4. The "God Trick" and False Objectivity
  Donna Haraway's critique of the **"God Trick"** (seeing everything from nowhere) and feminist standpoint theory address the underlying logic you noticed: that *distance* is equated with *objectivity*.
  *   **The Logic:** The dominant culture assumes that to be objective, one must be detached. Therefore, the person *affected* by the phenomenon is seen as "too close" (biased), while the person *unaffected* is seen as "distant" (objective).
  *   **The Critique:** Standpoint epistemology argues the opposite: that being "close" (marginalized) often provides a *more* complete view because the marginalized must understand both their own reality and the dominant reality to survive, whereas the dominant group can afford to remain ignorant of the marginalized experience. Dismissing the insider's analysis is a failure to recognize that "bias" works both ways; the outsider has a bias of ignorance.

  ### How this relates to Fricker's Categories
  You are right to hesitate before labeling this strictly Testimonial or Hermeneutical. It is best understood as a **compound injustice** or a **second-order testimonial injustice**.

  *   **Relation to Testimonial Injustice:** It is a credibility deficit, but it is compartmentalized. The speaker is granted credibility as a *reporter* but denied credibility as an *analyst*. Some philosophers call this **"Dimensional Testimonial Injustice,"** where credibility is granted in one dimension (perception) but withheld in another (judgment).
  *   **Relation to Hermeneutical Injustice:** It is not a *lack* of concepts (the structural gap Fricker described), but a **rejection** of concepts. It is an active refusal to adopt the marginalized group's hermeneutical framework, even when it is clearly articulated.

  ### Specific Context: Medical Epistemic Injustice
  Regarding your patient/doctor example, this is a specific sub-field often called **Medical Epistemic Injustice**.
  *   Scholars like Havi Carel and Ian Kidd describe this as **"Symptom Validity vs. Diagnostic Authority."** The patient is the authority on the *phenomenology* (what it feels like), but the doctor is assumed to be the sole authority on the *etiology* (what it means). When a patient suggests a diagnosis, it is often framed as "Googling symptoms" rather than expert analysis, reinforcing the data/theory split.

  ### Summary
  If you are looking for a term to use in discussion, **Contributory Injustice** is the most academically precise term for the blocking of the analysis. However, your own formulation—**The Epistemic Division of Labor**—is an excellent descriptive phrase that captures the structural nature of the problem.

  You might characterize it as:
  > *"A form of **contributory injustice** where marginalized agents are subjected to **epistemic objectification**. They are granted **testimonial credibility** regarding the phenomenology of their experience but denied **hermeneutical authority** regarding its interpretation, based on a false equation of detachment with objectivity."*

  This is a recognized and critical problem in social epistemology. You aren't just noticing a pattern; you are identifying a specific mechanism by which epistemic oppression is maintained in "progressive" spaces that claim to believe victims.
