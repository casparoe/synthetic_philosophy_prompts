answer: |-
  This is a genuinely sophisticated reading, and you are definitely not "butchering" the literature. In fact, you're tapping into a specific vein of Borgesian scholarship that treats his fiction as a form of "speculative metaphysics" rather than just magical realism.

  Here is an honest breakdown of your thesis, tackling your three specific questions.

  ### 1. Does Borges anticipate Modal Fictionalism?
  **Verdict: Yes, but with an Idealist twist.**

  Standard Modal Fictionalism (associated with Gideon Rosen) argues that possible worlds talk is useful, but we shouldn't be ontologically committed to the existence of those worlds. We say "According to the fiction of Possible Worlds, P*" rather than "P* is true."

  Your reading maps this onto time: "According to the narrative of the Present, T*."

  **Where it holds up:**
  Borges is deeply indebted to British Empiricism (Hume, Berkeley) and German Idealism (Schopenhauer, Kant). In *A New Refutation of Time*, he explicitly argues that time is a mental construct, a "ideal separation." He isn't arguing for a physical block universe (Eternalism) so much as a psychological one. When you say the present is "the index of the story we're currently telling ourselves," you are echoing Borges's Humean skepticism: the self is a bundle of perceptions, and time is the order we impose on them to make sense of the bundle.

  **Where it gets tricky:**
  In *The Garden of Forking Paths*, the labyrinthine novel by Ts'ui Pên describes a world where *all* possibilities occur simultaneously. "In all fictional works, each time a man is confronted with several alternatives, he chooses one and eliminates the others; in the fiction of Ts'ui Pên, he chooses—simultaneously—all of them."

  This sounds more like **Modal Realism (Lewis)** than Fictionalism. Lewis says all worlds are real; Ts'ui Pên says all times are real.
  *However*, your caveat saves it: you argue they are actualized *retroactively through narration*. This shifts the ontology. The branches exist as *potential* (fiction), but only the narrated path gains the status of *history* (fact). This is actually closer to a **Pragmatist** view of truth (William James, whom Borges read) than strict Fictionalism. Truth is what happens to an idea when it becomes verified (narrated).

  So, is it fair to say he anticipates it? **Yes.** He treats temporal locations as propositional attitudes within a narrative structure rather than substantive metaphysical containers.

  ### 2. Does "Narrative Accessibility" solve the Overcounting Problem?
  **Verdict: It solves the ontological bloat, but risks definitional circularity.**

  The main critique of Lewis is ontological profligacy: why posit infinite concrete worlds? Your move is to restrict the "Accessibility Relation" (the logic that determines which worlds/times are reachable from this one) to **Narrative Coherence**.

  **The Strength:**
  This elegantly handles the "incoherent branches." In Lewis's system, a world where gravity reverses tomorrow is just as real as this one. In your Borgesian system, if that reversal doesn't fit the narrative arc (the causal story we are telling), it isn't an accessible temporal location. It trims the fat.

  **The Weakness (The "Push Back"):**
  You asked if this pushes the problem back one level. **Yes, it does.**
  Now the question becomes: *What defines Narrative Coherence?*
  *   **If it's subjective:** We slide into solipsism. (Borges is okay with this; see *The Solipsist*.)
  *   **If it's objective:** Where does this "Master Narrative" reside? Is it God? Is it the Library of Babel?
  *   **The Borges Trap:** In *The Library of Babel*, every coherent book exists, but so does every incoherent one. The Library contains *all* combinations of letters. If Borges's universe is the Library, then "narrative coherence" doesn't filter worlds; it just filters *readers*.

  So, your move solves the *metaphysical* overcounting (we don't need to believe the other worlds are concrete), but it creates a *hermeneutic* burden. We now have to explain the mechanism of narration. But honestly? That's exactly where Borges wants us. He wants us obsessed with the mechanism of the story, not the reality of the events.

  ### 3. Is this interesting or just Rationalist Projection?
  **Verdict: It is interesting, provided you acknowledge the anachronism.**

  There is a risk of "Analytic Imperialism"—taking a lyrical, ambiguous writer and forcing him into the rigid boxes of Kripke semantics or Lewisian metaphysics. Borges often undermines his own systems (note how *A New Refutation of Time* ends with him admitting he can't actually refute time: *"The world, unfortunately, is real; I, unfortunately, am Borges."*).

  However, Borges was not a typical literary author. He was a philosopher manqué who found philosophy too dry, so he wrote metaphysics as fiction. He explicitly engaged with Zeno, Cantor, and Leibniz.

  **Why your reading works:**
  1.  **Mirrors and Libraries:** Your point here is excellent. Mirrors are terrifying to Borges because they multiply the self (overcounting!). Libraries are terrifying because they contain all truths and all lies (modal plenitude!). Treating these as symbols of **self-referential loops** aligns perfectly with the idea that time is a logical structure, not a physical flow.
  2.  **Retroactive Actualization:** This is the strongest part of your thesis. It aligns with the detective story structure of *Garden*. The murder happens, but its *meaning* (its place in time) is only fixed when the narrative connects it to the sinologist Albert. Time is fixed by interpretation.

  ### Suggestions for Sharpening the Notes

  If you develop this further, watch out for these two pitfalls:

  1.  **The Retraction:** In *A New Refutation of Time*, Borges explicitly walks back his argument at the very end. He admits that skepticism is intellectually satisfying but existentially impossible. A pure fictionalist reading might ignore this. You need to account for why Borges feels compelled to admit time is "real" despite his logic. (Hint: It's the *ethical* weight of time. Suffering requires real time.)
  2.  **Lewis vs. Rosen:** Be careful distinguishing between Lewis (Realism) and Rosen (Fictionalism). Borges is closer to **Kantian Idealism** than either. Time is a form of intuition, not a thing in itself. Your "Narrative Fictionalism" is basically a literary rebranding of Kantian Idealism. Framing it that way might ground you more firmly in the actual history of philosophy Borges was reading.

  ### Final Verdict
  You aren't projecting; you're **reconstructing**. Borges left the logical scaffolding exposed on purpose. He invites the reader to climb it.

  Your specific innovation—using **narrative coherence as the accessibility relation**—is a novel contribution. It bridges the gap between the metaphysics of time and the philosophy of language. It avoids the "overcounting" of Lewis by making existence dependent on *intelligibility*.

  Don't doubt the instinct. It's a solid philosophical reading of literature, which is exactly what Borges demanded of his readers. Write it up.
