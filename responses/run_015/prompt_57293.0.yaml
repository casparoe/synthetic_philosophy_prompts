  6.  **Final Polish:** Ensure tone is diplomatic (board dynamics are sensitive). Ensure the distinction between "selection method" and "service conditions" is clear.

      *   *Self-Correction on "Equal Claim":* I need to be careful. Is it *genuinely* an argument? Yes, in political theory. But is it a *good* argument for *this* context? I should validate the theory while noting the practical constraints.
      *   *Self-Correction on "Decline":* Can it be fixed *without giving up the lottery*? If I suggest term limits, that's giving up the lottery. I need to suggest how to make the lottery work.
      *   *Idea:* **Stratified Lottery.** Divide membership into demographics (renters, owners, age, geography) and draw from each. This ensures diversity even if some decline.
