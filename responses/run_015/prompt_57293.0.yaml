          *   *Theory:* Sortition (selection by lot) is historically rooted in the idea of political equality (Athens, Venice). It assumes every citizen is equally capable of ruling.
          *   *Context:* A CLT is a democratic organization. Membership implies ownership/stake.
          *   *Validity:* Yes, it is a *genuine* philosophical argument. It challenges the notion that governance is a specialized skill requiring a campaign. It aligns with the "community" aspect of a CLT.
          *   *Nuance:* However, "equal claim" doesn't necessarily mean "equal capacity" or "equal willingness." It's a normative claim (how things *should* be), not necessarily a practical one (how things *work*). But as a principle, it holds water.

      *   **Question 2: Can the decline-and-redraw problem be fixed without giving up the lottery altogether?**
          *   *Problem:* If you draw names, people say "no," and you keep drawing until someone says "yes," you bias the pool toward those with time/interest (the retirees).
          *   *Potential Fixes:*
              *   *Mandatory Service?* No, bylaws don't allow, and it's coercive.
              *   *Stratified Pool?* Ensure the pool reflects demographics? (Hard to enforce).
              *   *Pre-screening/Opt-in Pool?* Members volunteer *to be in the lottery*. (Defeats the purpose of random selection from *all* members).
              *   *Incentives?* Stipends, childcare, meeting time adjustments. (Addresses the "free time" barrier).
              *   *Term Limits/Rotation?* Prevent the "same four people" issue without a lottery.
              *   *Hybrid Model?* Some elected, some lotteried.
              *   *The "Decline" Mechanism:* If the goal is to break the oligarchy, maybe the *threat* of the lottery changes behavior? No, that's game theory, not process design.
              *   *Addressing the "Retiree" Bias:* The bias exists because of structural barriers (time, money, confidence). To fix the decline problem *within* a lottery system, you need to make saying "yes" feasible for non-retirees.
              *   *Conclusion:* You can't fully eliminate the self-selection bias of *acceptance*, but you can mitigate it. You can also structure the lottery so it's not a pure "draw from 400" but perhaps a "draw from a stratified sample" or combine it with term limits.

  3.  **Evaluate the Counter-Arguments:**
      *   *(1) Decline/Redraw:* Valid practical concern. If the pool of *willing* people is the same as the pool of *electable* people, the lottery fails its purpose.
      *   *(2) Accountability:* Valid concern. However, CLT boards usually have fiduciary duties and can remove members for cause (negligence), even if not by popular vote. Also, peer pressure within a board works.
      *   *(3) Equality:* Valid normative argument. But equality of *opportunity* vs. equality of *outcome*.

