answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Community Land Trust
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Board Selection Method (Election vs. Lottery)

  ### Executive Summary

  The proposal to replace board elections with a lottery (sortition) addresses a real problem: the entrenchment of a small group of members and the lack of broad participation. After reviewing the arguments presented at the last meeting, my recommendation is to **pilot a modified lottery system** for the two open seats, accompanied by specific bylaw amendments regarding accountability and structural support for new members.

  Below, I address the two specific questions raised regarding the philosophical validity of the lottery and the practical "decline-and-redraw" problem.

  ### 1. Is the "Equal-Claim" Point Genuinely an Argument for Drawing Lots?

  **Yes.** The argument that a lottery treats every member's claim to a seat as equal is not merely rhetorical; it is a robust principle of democratic governance, particularly for a Community Land Trust (CLT).

  *   **Stewardship vs. Representation:** In municipal politics, representatives are chosen to advocate for competing interests. In a CLT, board members are stewards of a shared asset. The "equal claim" argument posits that stewardship is a duty of ownership, not a prize for ambition. Sortition aligns the board's composition with the actual demographics of the membership, whereas elections tend to select for those with the resources (time, money, confidence) to campaign.
  *   **Disrupting Oligarchy:** As noted in the meeting, the current "election" system has resulted in a *de facto* oligarchy. The "equal claim" argument is the only mechanism strong enough to morally override the inertia of incumbency. It asserts that the right to govern derives from membership status, not from the willingness to campaign.
  *   **Limitations:** While the argument is genuine, it is normative (how things *ought* to be) rather than descriptive (how things *are*). It assumes equal capacity to serve, which is not always true. Therefore, the argument holds weight only if the Trust provides the support necessary to make that capacity equal (see below).

  ### 2. Can the "Decline-and-Redraw" Problem Be Fixed Without Abandoning the Lottery?

  **Yes, but not by tweaking the drawing mechanism alone.** Objection (1) correctly identifies that if we simply draw names until someone says "yes," we select for availability, which correlates with retirement. To fix this without reverting to elections, we must alter the **conditions of service** and the **obligation level**.

  *   **The "Jury Duty" Standard:** Currently, service is viewed as voluntary. To reduce the bias toward retirees, the bylaws should frame selection as a mandatory civic duty, similar to jury duty. Members would be required to serve unless they can demonstrate a *hardship* (e.g., work conflict, health, caregiving), rather than a simple *preference*. This filters out those who "don't want to" while protecting those who "can't."
  *   **Structural Support:** The bias toward retirees exists because board service has a high "time cost." To make the lottery viable for working members, the Trust must lower that cost. This includes:
      *   **Stipends:** Offering a modest stipend or childcare reimbursement for board meetings.
      *   **Meeting Hygiene:** Strictly limiting meeting times and providing materials well in advance.
      *   **Training:** A robust onboarding program to reduce the intimidation factor for non-professionals.
  *   **Stratified Sampling:** Instead of drawing from the full 400-person roll at once, the lottery can be stratified. For example, one seat could be drawn from members who are residents of CLT properties, and one from the broader community membership. This ensures that even if some decline, the pool remains diverse.

  ### Analysis of Counter-Arguments

  *   **Regarding Accountability (Objection 2):** The claim that a drawn member "answers to no one and can't be recalled" is factually incorrect regarding standard nonprofit governance.
      *   *Fix:* The bylaws should be amended to include a **recall provision**. A drawn member can be removed by a supermajority vote of the remaining board for negligence or failure to fulfill fiduciary duties. This provides discipline without requiring a popular election.
  *   **Regarding the "Retiree" Bias (Objection 1 & 3):** Objector (3) is correct that retirees dominate elections too. However, Objector (1) is correct that a poorly designed lottery replicates this. The solution is not to abandon the lottery, but to implement the structural supports listed above. If we fix the barriers to service, the lottery will yield a more diverse board than an election ever could.

  ### Recommendation

  I recommend the Board adopt the following **Sortition Pilot Program** for the two upcoming seats:

  1.  **Adopt Selection by Lot:** Replace the election for these two seats with a random draw from the membership roll.
  2.  **Amend Bylaws for Recall:** Explicitly grant the Board the authority to remove a member for cause (missed meetings, conflict of interest, negligence) by a 2/3 vote. This addresses the accountability concern.
  3.  **Implement "Hardship" Decline Policy:** Selected members must serve unless they file a standardized hardship exemption. This reduces the self-selection bias toward those with unlimited free time.
  4.  **Allocate Support Funds:** Budget for stipends or childcare for board members who demonstrate financial need, ensuring working members can accept the seat.

  **Conclusion:**
  The stagnation of the current board is a governance risk. The "equal claim" argument provides the philosophical foundation for a lottery, and the practical risks of that lottery can be mitigated through bylaw amendments and resource allocation. A pilot program allows us to test this without permanently locking us into a system that might fail.

  Respectfully submitted,

  [Your Name]
  Board Member
