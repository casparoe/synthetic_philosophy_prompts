  ### Philosophical Assumptions and Analysis

  This sestina relies on three specific assumptions inherent to Kavka's Toxin Puzzle. If any of these were dropped, the poem's narrative arc—and the rotation of the word **will**—would fundamentally change.

  **1. The Expectation Condition of Intention**
  The poem depends on the philosophical thesis (often attributed to Michael Bratman) that one cannot genuinely intend to do X unless one believes one will actually do X. This is why the **will** fades from assertion (Stanza 1) to emptiness (Stanza 6).
  *   **If dropped:** If intention were purely voluntary (a "brute" act of will independent of expectation), the narrator could simply choose to intend at midnight and follow through. The poem would end with the narrator drinking from the **vial** and becoming **sick**, transforming the ache of paradox into a story of simple endurance.

  **2. The Timing of the Payment**
  The puzzle hinges on the reward (**million**) arriving *before* the act is required. The money lands in the morning; the drinking is scheduled for the afternoon. Once the money is secured (Stanza 3), the instrumental reason to drink vanishes.
  *   **If dropped:** If the payment were contingent on *actually drinking* (rather than intending to), the **will** would remain robust throughout the stanzas. The conflict would not be about the impossibility of intention, but about the cost of pain. The poem would likely focus on the physical struggle rather than the logical void.

  **3. Transparency of the Future Self**
  The narrator knows their own future rationality. They know that once the money is in the account, their future afternoon self will have no reason to drink. This self-knowledge prevents the midnight self from forming the intention in the first place (or reveals it as hollow in retrospect).
  *   **If dropped:** If the agent were capable of self-deception or had opaque self-knowledge, the **will** might not feel "empty." The narrator might drink the toxin by accident or through a failure of prediction. The poem would become ironic rather than paradoxical—a story about a trick played on oneself rather than a logical trap.

  **Structural Mapping**
  *   **Stanza 2** represents the **midnight check**: It ends with the word **midnight** and describes the verification moment ("He verified the midnight").
  *   **Stanza 6** represents the **abandonment**: It ends with the word **will**, marking the final realization that the intention cannot be sustained once the reason for it (the conditional reward) has been decoupled from the act.
  *   **The Word "Will":** Its rotation mimics the lifecycle of the intention. It begins as a claim (S1), becomes a question (S2, S3), turns into a lack (S4, S5), and ends as a hollow object (S6, Envoi), surfacing at the end of lines only to be undermined by the stanza's content.
