          6.  Constraint: No bibliography.
      *   **Tone:** Professional, philosophical yet accessible (suitable for a retired scientist), rigorous but collaborative.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Norman Malcolm (Wittgensteinian/Conceptual):**
          *   Dreams are not experiences *while* asleep.
          *   "Dreaming" is a story told upon waking.
          *   There is no criterion for truth regarding dreams *during* sleep (no "awake-criterion").
          *   It makes no sense to say "I am dreaming now" while asleep.
          *   Focus on the *logic* of the concept, not the physiology.
      *   **Daniel Dennett (Materialist/Functionalist):**
          *   Dreams are experiences (or quasi-experiences) generated by the brain.
          *   They are constructed/edited upon waking (the "cassette" or "narrative draft" theory).
          *   There is no "Cartesian Theater" where the dream is watched, but neural events occur that constitute the dream content.
          *   Focus on the *mechanism* and the *timing* of the narrative construction.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a formal collaboration document. "Joint Statement on the Ontology and Epistemology of Dream Reports."
      *   **Introduction:** Acknowledge the collaboration, the goal (clarity over victory), and the shared respect for data and logic.

      *   **Section 1: Agreed Claims (Common Ground):**
