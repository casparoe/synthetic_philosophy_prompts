answer: |-
  You press me hard, sir, and rightly so, for it is a distinction most men overlook. I hold that there is indeed a limit to the quantity of cash, but that limit is set not by the weight of silver in a vault, but by the extent of the trade and industry it is meant to circulate. If you multiply counters beyond the proportion of business to be done, do they not become like tallies for a feast where no meat is provided? The credit would vanish, not because the metal is absent, but because the confidence of men is lost when the token exceeds the thing it signifies. Thus, the metal is not the worker; rather, a due proportion between the sign and the labour is the true engine of wealth.

  As to those sad catastrophes in London and Paris, pray consider the difference between a credit founded upon the solid security of land and the industry of a nation, and a credit built upon the air of stock-jobbing and imaginary gains. The ruin you speak of arose because men sought wealth in the shifting of papers without any industry to back them, chasing shadows whilst neglecting the substance of labour. I propose a bank whose notes are secured upon real value and issued solely to stir the hands of the idle; would not such money, kept within the bounds of trade, enrich this kingdom without the dangers of that frantic gambling which you rightly condemn?
