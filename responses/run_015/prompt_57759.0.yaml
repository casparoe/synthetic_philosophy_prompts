      *   **Diagnose the Bad Step:** It's not (1) or (2) primarily. It's the *model of the self* implicit in (3) and (4). It assumes simultaneity and unity.
      *   **Solution 1: Temporal Partitioning (Alfred Mele's approach).** Self-deception isn't $t_1$: Know $p$ + Intend Believe $\neg p$. It's a process over time. I avoid evidence *now* so that *later* I believe $\neg p$. At no point do I hold contradictory beliefs consciously.
