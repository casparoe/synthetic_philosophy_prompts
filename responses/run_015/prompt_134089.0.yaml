  # Classification Key: Positions on Actual Infinity

  **Starting Commitment:** Ordinary finite arithmetic is unproblematic; given any finite collection, one more member can be added.

  **Q1.** When you add one to a finite number, is the result always a definite number you could in principle write down, even if it takes more atoms than exist in the universe?
  *   **Yes:** Go to Q2.
  *   **No:** **Leaf: Ultrafinitist.** (Awkward commitment: Arithmetic stops working before the universe ends.)
  *   **Incoherent/Malformed:** Go to Q8.

  **Q2.** In Hotel Z (rooms numbered by all integers), can the infinite bus be housed using the doubling rule while the single guest cannot be housed because there is no uniform rule to shift everyone down?
  *   **Yes:** **Leaf: Rule-Dependent Formalist.** (Awkward commitment: Physical housing depends on mathematical elegance rather than space.) *[Unoccupied Combination 1]*
  *   **No:** (Both can be housed OR neither can). Go to Q3.
  *   **Incoherent:** (Setup reveals "housing" is only a formal fact about pairings). **Leaf: Deflationist.** (Awkward commitment: The dispute is verbal, not factual.)

  **Q3.** Is the story of the hotel that was always there (no first day, one guest per day, full now) coherent because a series with no beginning raises no problem, or incoherent because a collection built one-by-one can never be finished?
  *   **Yes:** (Coherent/Concrete Infinity OK). Go to Q5.
  *   **No:** (Built up never finished/Concrete Infinity Bad). Go to Q4.
  *   **Incoherent:** (Fully occupied impossible). **Leaf: Strict Finitist.** (Awkward commitment: Hilbert's Hotel is metaphysically impossible in any world.)

  **Q4.** In the hotel that was never built (always occupied), does the answer change from the previous case (locating objection in production), and is the doorman's count today finite, infinite, or malformed?
  *   **Yes/Changes:** (Production matters + Count Finite). **Leaf: Causal Finitist.** (Awkward commitment: An infinite past is possible only if nothing causal happens.)
  *   **No/Same:** (Collection matters + Count Infinite). Go to Q6.
  *   **Malformed:** (Count question). **Leaf: Indefinite Extensibilist.** (Awkward commitment: There is no fact of the matter about how many natural numbers exist.)

  **Q5.** Even if no concrete collection is infinite, is there a single collection containing all the natural numbers, and is the claim that there are more real numbers than natural numbers a determinate one with a determinate answer?
  *   **Yes:** (Both true). Go to Q7.
  *   **No:** (No totality/Indeterminate). **Leaf: Predicativist.** (Awkward commitment: We cannot quantify over all subsets of numbers.)
  *   **Incoherent/Verbal:** **Leaf: Deflationist.** (Awkward commitment: Mathematics is just a choice of language.) *[Converges with Q2-Incoherent]*

  **Q6.** If concrete infinity is impossible, is it a matter of what is possible at all, of what the laws of nature in fact permit, or of what we could ever have evidence for?
  *   **Possible at all:** (Metaphysical). **Leaf: Abstract-Only Infinity.** (Awkward commitment: Numbers exist but physical atoms do not.)
  *   **Laws permit:** (Nomological). **Leaf: Nomological-Only Finitist.** (Awkward commitment: Infinity is physically contingent.)
  *   **Evidence/Causal:** (Epistemic). **Leaf: Empiricist Finitist.** (Awkward commitment: Infinity exists but is forever unknowable.) *[Unoccupied Combination 2]*

  **Q7.** If infinite totalities exist abstractly, does the collection of all subsets of the natural numbers form a definite totality larger than the naturals?
  *   **Yes:** **Leaf: Cantorian Realist.** (Awkward commitment: There are infinitely many sizes of infinity.)
  *   **No:** **Leaf: Countabilist.** (Awkward commitment: All infinite collections are the same size.)
  *   **Incoherent:** (Subset concept flawed). **Leaf: Predicativist.** (Awkward commitment: Arbitrary subsets are not legitimate objects.) *[Converges with Q5-No]*

  **Q8.** Is the whole dispute a choice between two equally serviceable notions rather than a disagreement about how things are?
  *   **Yes:** **Leaf: Deflationist.** (Awkward commitment: There is no truth of the matter.)
  *   **No:** **Leaf: Realist.** (Awkward commitment: One side is simply wrong.) *[Unoccupied Combination 3]*
  *   **Incoherent:** **Leaf: Error Theory.** (Awkward commitment: All claims about infinity are false.)

  ***

  ### Unoccupied Combinations
  1.  **Rule-Dependent Formalist (Q2-Yes):** Nobody occupies this because physical possibility is rarely thought to depend on the elegance of the mapping rule. *Diagnosis: Merely unattractive.*
  2.  **Empiricist Finitist (Q6-Evidence):** Nobody occupies this because if infinity is possible, evidence is usually thought to follow; if impossible, evidence is irrelevant. *Diagnosis: Unexplored.*
  3.  **Realist (Q8-No):** Nobody stops here without committing to a specific hierarchy (Cantorian/Countabilist). *Diagnosis: Incoherent (too vague).*

  ### Flagged Leaves (Not Fully Separated)
  1.  **Deflationist (Q2-Incoherent) vs. Deflationist (Q5-Verbal) vs. Deflationist (Q8-Yes):** The tree labels these identically, but they arrive via different reasoning (set theory vs. arithmetic vs. metaphysics).
      *   *Additional Question:* "Is the ambiguity located in the word 'number', the concept of 'collection', or the logic of 'existence'?"
  2.  **Predicativist (Q5-No) vs. Predicativist (Q7-Incoherent):** Both deny power sets, but one denies the totality of naturals implies it, the other denies the subset concept itself.
      *   *Additional Question:* "Is the failure to form a totality due to the nature of the objects (Predicativist) or the nature of the quantification (Extensibilist)?"
