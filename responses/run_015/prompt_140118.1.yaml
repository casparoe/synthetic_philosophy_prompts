prompt: |-
  i'm helping draft the first chapter of a handbook for people who actually have to *judge* selection schemes — a university admissions panel, a compliance body looking at a company's board, a tribunal ruling on a reservation category — and i keep going round in cirlces because everyone i talk to has a different idea of what the question even is. so before i let anyone argue about whether a given scheme is OK, i want the spec: what would a theory of group-conscious selection have to be able to *do* to be good enough to hand to such a body?

  Not a theory of justice in general. A decision-grade account of when selecting people partly on the basis of their membership of some group is permissible, impermissible, or required — one that has to be appliable by an institution that doesn't know the whole social history, that can't run experiments, and that needs to be told not just "no" but what change would make the scheme acceptable. That's the purpose, and i care about it being usable in that setting, so procedural/administrability stuff is a real desideratum here, not a boring footnote.

  The distinctions it must not collapse (with the case that shows why each matters):

  - hard quota vs target vs tiebreaker vs "comply or explain" — because the same number can be reached by four mechanisms with totally different costs and exit options.
  - the choice of benchmark: parity with the population, with the applicant pool, or with the pool qualified at an earlier stage. A principle i've made up and want you to test — call it **conditional-pipeline parity** (i think of it as the Ashworth rule, after a fictional 2019 white paper): a scheme is permissible iff each group's selection rate matches its share of the pool that qualified at *the last stage the institution didn't itself control*, discouting differences in qualification that were themselves produced by the institution's own past practices. Is that even coherent? Does it demand something any real institution could compute?
  - membership-fixing: who counts, who decides, and what happens when the category is self-declared. **The opt-in surge**: a university lets applicants tick any ancestry box they identify with, enrolment of the target groups triples on paper and nothing else changes. Is the scheme better, worse, or the same?
  - **The parish register case**: a selective school switches from a racial preference to a "local heritage" preference decided by baptism records going back to 1900. In this made-up town that tracks ancestry almost perfectly. Every fact about who gets in is unchanged. Does anything morally important change, and if so does the theory have the resources to say it without sneaking in intent?
  - **The same-five-people case**: board quotas met by rotating a tiny set of the same individuals across dozens of companies, so the headcount moves and nothing else does.
  - **The decorative case**: the quota is hit on the board while the executive committee, where the decisions are actually made, is untouched.
  - **The hollow-benefit case**: the scheme is justified by its effects on the institution (better decisions, legitimacy, market trust), and it's genuinely good on those, while the intended beneficiaries are on average no better off — maybe slightly worse by some measures. Which way does the theory point, and should that be allowed to depend on whether the beneficiaries consent?
  - **The symmetry case**: in this fictional country men are 20% of vet-med students. Is a scheme for them governed by the same rule, or does the direction matter — and if it does, what has to be true for that to be non-arbitrary?
  - **The sunset case / the erosion case**: a scheme that works on its own numbers but appears to slow reform of the pipeline feeding it, so ten years on the underlying disparity is unchanged. Also: when, if ever, is a scheme *required* to have an expiry date?
  - **The intersection case**: someone disadvantaged along two axes at once. Does the theory handle that by construction, or does it have to be bolted on?

  So: give me the requirement list, each with the case or consideration that earns it a place. Mark which are non-negotiable for a decision-grade theory and which are just what one camp happens to like (i suspect "must be forward-looking only", "must be expressible without any mention of groups at all", and "must be symmetric across groups" are in that second bin, but argue). Flag any pair you think can't be jointly satisfied — especially the administrability requirement (an institution shouldn't have to adjudicate contested identities or people's inner lives) against taking intersectionality seriously — and if some subset is jointly unsatisfiable, say so, that's the bit i most want. Then tell me which single requirement knocks out the most candidate theories.

  After that, and briefly — a table is fine, no more than a couple of lines each — score four contenders against your own list: colourblind individualism, anti-subordination, diversity-as-instrumental, and my conditional-pipeline-parity rule above. Please don't give me citations, case names from actual litigation, or a reading list; i want the criteria, and i'll go find the literature myself. Real-world regimes (reservations with a creamy-layer-style exclusion, boardroom quotas, race-conscious admissions in US universities) are fine as illustration but i don't need their details or dates. British English throughout, ta.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Draft the first chapter of a handbook for *judges* of selection schemes (admissions, compliance, tribunals).
      *   **Task:** Define the *specification* (requirements) for a "decision-grade" theory of group-conscious selection. It needs to be actionable, administrable, and capable of distinguishing permissible/impermissible/required schemes.
      *   **Key Constraints:**
          *   Not a general theory of justice.
          *   Must be usable by institutions with limited knowledge/power (can't run experiments, don't know full social history).
          *   Must offer remedial guidance (not just "no," but "how to fix").
          *   Procedural/administrability is a core desideratum, not a footnote.
          *   British English.
          *   No citations/case names/reading lists.
      *   **Specific Distinctions/Cases to Address:**
          *   Mechanism (quota vs. target vs. tiebreaker).
          *   Benchmark (population vs. applicant vs. qualified pool) + "Conditional-Pipeline Parity" (Ashworth Rule).
          *   Membership-fixing (Opt-in surge).
          *   Proxy/Ancestry (Parish register case).
          *   Tokenism/Rotation (Same-five-people case).
          *   Power vs. Presence (Decorative case).
          *   Beneficiary Welfare (Hollow-benefit case).
          *   Symmetry/Direction (Symmetry case).
          *   Duration/Reform (Sunset/Erosion case).
          *   Intersectionality (Intersection case).
      *   **Output Requirements:**
          *   List of requirements (mark Non-Negotiable vs. Contingent).
          *   Identify trade-offs/incompatibilities (especially Administrability vs. Intersectionality).
          *   Identify the "killer constraint" (which requirement knocks out the most theories).
          *   Scorecard table for 4 contenders (Colourblind Individualism, Anti-Subordination, Diversity-as-Instrumental, Conditional-Pipeline Parity).

  2.  **Deconstruct the "Decision-Grade" Specification:**

      *   *What makes a theory usable by a tribunal?* It needs clear inputs, clear processing rules, and clear outputs. It needs to handle evidence limitations. It needs to avoid infinite regresses (e.g., "fix society first").
      *   *The "Ashworth Rule" (Conditional-Pipeline Parity):* The prompt asks me to test this. Is it coherent? Is it computable?
          *   *Coherence:* It tries to isolate the institution's specific contribution from historical baggage.
          *   *Computability:* "Last stage the institution didn't control" is tricky. Who controls what? If a university requires A-Levels, did they control the secondary school system? Probably not. But if they require a specific test *they* write, they control that. It seems computable *if* the pipeline stages are distinct.
          *   *Verdict:* It's a strong candidate for a benchmark requirement but needs refinement on "control."

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Mechanism Sensitivity.* Must distinguish *how* the number is hit. (Derived from Quota vs. Target case). *Status: Non-Negotiable.*
      *   *Req 2: Benchmark Clarity.* Must specify the reference class. (Derived from Benchmark/Ashworth case). *Status: Non-Negotiable.*
      *   *Req 3: Membership Integrity.* Must handle self-declaration vs. verification without intrusive inquiry. (Derived from Opt-in surge). *Status: Non-Negotiable (for administrability).*
      *   *Req 4: Substance over Form.* Must detect proxies that replicate exclusion. (Derived from Parish register). *Status: Non-Negotiable.*
      *   *Req 5: Power/Agency Check.* Must distinguish presence from influence. (Derived from Decorative/Same-five-people). *Status: Non-Negotiable.*
      *   *Req 6: Beneficiary Welfare.* Must account for the actual good done to the group, not just the institution. (Derived from Hollow-benefit). *Status: Contingent (some theories say institutional good is enough).*
      *   *Req 7: Asymmetry Permission.* Must allow different rules for dominant vs. subordinate groups if justified by history/structure, OR demand symmetry. (Derived from Symmetry case). *Status: Contingent (this is the big philosophical split).*
      *   *Req 8: Dynamic Consistency.* Must address duration and pipeline effects. (Derived from Sunset/Erosion). *Status: Non-Negotiable (for long-term viability).*
      *   *Req 9: Intersectional Capacity.* Must handle multiple disadvantages without double-counting or erasure. (Derived from Intersection case). *Status: Non-Negotiable (for accuracy) BUT clashes with Administrability.*
      *   *Req 10: Administrability.* Must be executable with available data. (Derived from Prompt's core constraint). *Status: Non-Negotiable.*

  4.  **Analyzing Trade-offs (The "Impossible Triangle"):**

      *   *The Big Conflict:* Administrability vs. Intersectionality vs. Substance over Form.
      *   *Administrability* demands simple categories (tick box).
      *   *Intersectionality* demands complex, context-sensitive categories (how do race and class interact here?).
      *   *Substance over Form* (Parish Register) demands looking behind the label to the *effect*, which requires deep investigation (hard to administer).
      *   *Conclusion:* You cannot have a theory that is perfectly administrable, perfectly sensitive to intersectionality, and perfectly attuned to substantive proxies without creating a bureaucracy larger than the institution being judged. One must give. Usually, it's Intersectionality that gets simplified for the sake of Administrability.

  5.  **Identifying the "Killer Constraint":**

      *   Which requirement kills the most theories?
      *   *Colourblind Individualism:* Fails on Substance over Form (can't handle Parish Register) and Beneficiary Welfare (ignores group harm).
      *   *Diversity-as-Instrumental:* Fails on Beneficiary Welfare (Hollow-benefit is fine for them) and Sunset (no need to end if diversity is always good).
      *   *Anti-Subordination:* Fails on Administrability (requires deep historical/social analysis) and Symmetry (struggles to explain why reverse discrimination is okay without complex history).
      *   *Conditional-Pipeline Parity:* Fails on Intersectionality (hard to define "pipeline" for intersecting groups) and potentially Membership Integrity (opt-in surge breaks the math).
      *   *Winner:* **Administrability + Substance over Form.** Most normative theories ignore the cost of implementation. A theory that demands a tribunal know the *true* social meaning of a category (Parish Register) while only having access to *formal* data (Tick Box) is doomed. The requirement that the theory must be *actionable with limited epistemic access* is the hardest filter.

  6.  **Developing the Scorecard:**

      *   *Colourblind:* Good on admin, bad on substance/benefits.
      *   *Anti-Subordination:* Good on benefits/symmetry, bad on admin/sunset (hard to know when subordination ends).
      *   *Instrumental:* Good on admin/sunset, bad on benefits (hollow benefit allowed).
      *   *Ashworth (CPP):* Good on benchmark/admin, bad on intersection/membership (gaming).

  7.  **Refining the "Ashworth Rule" Critique:**

      *   Is it coherent? Yes, it isolates the institution's margin of discretion.
      *   Is it computable? Only if "control" is clearly defined. If the institution sets the entry requirements for the previous stage, they *did* control it.
      *   *Verdict:* It's a strong procedural heuristic but vulnerable to "gaming" the definition of the pipeline.

  8.  **Drafting the Content (incorporating British English and Tone):**

      *   Tone: Professional, analytical, direct. No fluff.
      *   Structure:
          1.  Introduction (The Specification).
          2.  The Requirement List (with Non-Negotiable/Contingent tags).
          3.  The Incompatibility Problem (Administrability vs. Intersectionality).
          4.  The Killer Constraint.
          5.  The Scorecard.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "Parish Register" case? Yes, under Substance over Form.
      *   *Check:* Did I address the "Same Five People"? Yes, under Power/Agency.
      *   *Check:* Did I address the "Opt-in Surge"? Yes, under Membership Integrity.
      *   *Check:* Is the distinction between Non-Negotiable and Contingent clear? Yes.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* British English? (e.g., "programme," "centre," "ta" acknowledged in tone).
      *   *Refinement on the "Killer Constraint":* I need to be precise. It's not just administrability, it's *Epistemic Modesty*. The theory cannot require knowledge the tribunal cannot get.

  10. **Final Polish:** Ensure the distinction between "Conditional-Pipeline Parity" as a *candidate* theory vs. a *requirement* is clear. The prompt asks me to test the Ashworth Rule as a *principle* within the spec, then score it later. I will treat it as a specific approach to the Benchmark Requirement.

      *(Self-Correction on the Ashworth Rule)*: The prompt asks: "Is that even coherent? Does it demand something any real institution could compute?" I need to answer this explicitly in the analysis of the Benchmark Requirement.

      *(Self-Correction on Intersectionality)*: The prompt asks to flag if Administrability and Intersectionality can't be jointly satisfied. I need to be firm here. They are in tension. A tribunal can't adjudicate "lived experience" efficiently.

      *(Final check on the Scorecard)*: Keep it brief. Two lines max per cell.

      *(Final check on Tone)*: Keep it dry and handbook-like.

      *Let's write.*
answer: |-
  # Specification for a Decision-Grade Theory of Group-Conscious Selection

  ## 1. The Requirement List

  To be usable by a tribunal or compliance body, a theory must translate normative goals into auditable criteria. Below are the ten functional requirements derived from the cases you provided.

  | # | Requirement | Definition | Status | Earning Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Mechanism Sensitivity** | Must distinguish between rigid quotas, flexible targets, tie-breakers, and reporting duties. The moral cost varies by coerciveness. | **Non-Negotiable** | Hard quota vs. target |
  | **2** | **Benchmark Clarity** | Must specify the reference class for parity (general population, applicant pool, or qualified pool). Cannot be ambiguous. | **Non-Negotiable** | Benchmark choice / Ashworth Rule |
  | **3** | **Membership Integrity** | Must define who counts as a member without requiring intrusive verification or allowing unlimited self-declaration that breaks the math. | **Non-Negotiable** | The opt-in surge |
  | **4** | **Substance Over Form** | Must identify when a neutral criterion (e.g., heritage) functions as a proxy for a protected characteristic to replicate exclusion. | **Non-Negotiable** | The parish register case |
  | **5** | **Agency & Power Check** | Must distinguish between numerical presence and actual decision-making power. Hitting a headcount is insufficient if influence is null. | **Non-Negotiable** | The decorative case / Same-five-people |
  | **6** | **Beneficiary Welfare** | Must account for whether the intended beneficiaries actually gain welfare, not just whether the institution gains legitimacy or profit. | **Non-Negotiable** | The hollow-benefit case |
  | **7** | **Dynamic Consistency** | Must specify conditions for expiry (sunset) and assess whether the scheme erodes or improves the underlying pipeline over time. | **Non-Negotiable** | The sunset / erosion case |
  | **8** | **Intersectional Capacity** | Must handle candidates disadvantaged on multiple axes without forcing single-axis choices or double-counting advantage. | **Non-Negotiable** | The intersection case |
  | **9** | **Asymmetry Permission** | Must explicitly state whether the same rules apply to dominant and subordinate groups, or justify why they differ. | **Contingent** | The symmetry case |
  | **10** | **Epistemic Modesty** | Must be executable using data the institution actually possesses or can reasonably gather, without requiring sociological experiments. | **Non-Negotiable** | General administrability constraint |

  ### Notes on the "Ashworth Rule" (Conditional-Pipeline Parity)
  You asked if this is coherent and computable.
  *   **Coherence:** Yes. It isolates the institution's specific margin of discretion from historical baggage. It prevents an institution from being held responsible for disparities created entirely upstream, while preventing it from hiding behind upstream disparities it perpetuates.
  *   **Computability:** Risky. It requires a clear map of "control." If a university sets A-Level requirements, did it control the secondary schools? If a board requires prior CEO experience, did it control the CEO pipeline? To be computable, the theory must define "control" strictly as *formal gatekeeping authority*, not *social influence*. Otherwise, every institution is responsible for everything, and the rule collapses.

  ### Notes on Contingent vs. Non-Negotiable
  *   **Asymmetry Permission (Req 9):** This is the main philosophical fault line. A "symmetric" theory (colourblind) says men and women must be treated identically. An "anti-subordination" theory says remediation for a historically excluded group is distinct from exclusion of a historically dominant group. A decision-grade theory *must* take a stance, but which stance is a policy choice, not a functional necessity. Hence, contingent.
  *   **Forward-Looking Only:** You suspected this belongs in the "contingent" bin. You are correct. A theory that ignores past harm (forward-looking only) fails the **Substance Over Form** test (Parish Register) because it cannot explain *why* the heritage criterion is suspect. It must be able to reference history to judge proxies, even if the remedy is forward-looking.

  ---

  ## 2. The Incompatibility Problem

  There is a fundamental tension between **Requirement 10 (Epistemic Modesty/Administrability)** and **Requirement 8 (Intersectional Capacity)**.

  *   **The Conflict:** To be administrable, a tribunal needs clear boxes (e.g., "Tick Box A or B"). To be truly intersectional, the theory must account for how categories interact (e.g., the experience of a Black woman is not Black + Woman). This requires context-sensitive adjudication of "lived experience" or complex statistical weighting.
  *   **The Verdict:** They cannot be jointly satisfied perfectly. A tribunal cannot adjudicate inner lives or complex sociological interactions without becoming a bureaucracy larger than the institution it judges.
  *   **The Compromise:** A decision-grade theory must prioritise **Administrability**. It must treat intersectionality as a *statistical audit* requirement (e.g., "report outcomes for intersecting groups") rather than an *individual adjudication* requirement (e.g., "judge this candidate's specific intersectional disadvantage"). If you demand the latter, the system creates perverse incentives for candidates to perform trauma and for judges to psychoanalyse applicants.

  **Other Potential Conflicts:**
  *   **Beneficiary Welfare vs. Institutional Autonomy:** If a scheme helps the institution (Diversity) but hurts the beneficiaries (Hollow-Benefit), **Requirement 6** forbids it, but many institutional theories allow it. This is a normative clash, not a logical one.
  *   **Substance Over Form vs. Membership Integrity:** To catch the Parish Register proxy, you must look behind the label. To maintain Membership Integrity, you must respect the label (to avoid intrusive verification). The theory must allow looking behind the label *only* when statistical correlation is near-perfect (e.g., 99% overlap), otherwise, it violates privacy.

  ---

  ## 3. The Killer Constraint

  The single requirement that knocks out the most candidate theories is **Requirement 10: Epistemic Modesty (Administrability)**.

  Most normative theories of justice assume an ideal observer who knows the full history of society, the true motives of actors, and the long-term consequences of policies.
  *   **Ideal Theories:** "This is unjust because it perpetuates historical wrongs."
  *   **Decision-Grade Reality:** "How do we prove the historical wrong was the *cause* of this specific disparity, given we only have this year's spreadsheet?"

  A theory that requires a tribunal to determine *true intent* (was the heritage rule *really* about race?) or *true social harm* (did this board appointment actually reduce subordination?) without clear metrics will fail in practice. It will either be ignored or applied arbitrarily. The theory must work with *proxies for justice* that are auditable, even if they are imperfect measures of the moral truth.

  ---

  ## 4. Scorecard of Contenders

  Here is how four common theoretical frameworks score against the specification.

  | Theory | Administrability (Req 10) | Substance Over Form (Req 4) | Beneficiary Welfare (Req 6) | Dynamic Consistency (Req 7) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Colourblind Individualism** | **High.** Rules are simple: ignore group tags. | **Fail.** Cannot distinguish Parish Register from genuine heritage; treats all proxies as neutral. | **Fail.** Ignores group welfare; assumes individual gain equals group gain. | **Fail.** No mechanism for sunset; assumes neutrality is permanent. |
  | **Anti-Subordination** | **Low.** Requires deep historical/sociological analysis of power structures. | **High.** Explicitly designed to catch proxies that maintain hierarchy. | **High.** Central focus is the welfare/status of the subordinated group. | **Mixed.** Requires sunset when subordination ends, but hard to measure "end." |
  | **Diversity-as-Instrumental** | **High.** Focuses on institutional metrics (e.g., board composition). | **Mixed.** Catches proxies only if they hurt institutional performance. | **Fail.** Permits Hollow-Benefit cases; beneficiaries are means to an end. | **Fail.** No inherent sunset; diversity is always an asset, so quotas become permanent. |
  | **Conditional-Pipeline Parity (Ashworth)** | **Medium.** Computable if "control" is strictly defined; vulnerable to gaming. | **Medium.** Catches upstream manipulation, but misses cultural proxies. | **Medium.** Focuses on rates, not welfare; assumes selection = benefit. | **High.** Automatically adjusts as pipeline changes; implies sunset if parity reached. |

  ### Summary Assessment
  *   **Colourblind** fails the **Substance** test (Parish Register).
  *   **Instrumental** fails the **Welfare** test (Hollow-Benefit).
  *   **Anti-Subordination** fails the **Administrability** test (too complex for a tribunal).
  *   **Conditional-Pipeline Parity** is the strongest *procedural* candidate but requires strict safeguards against **Membership Integrity** failures (Opt-in Surge) and needs a **Welfare** add-on to prevent Hollow-Benefits.

  For a handbook chapter, I recommend framing **Conditional-Pipeline Parity** as the default *heuristic* for benchmarks, wrapped in **Anti-Subordination** constraints for welfare and substance, with **Administrability** acting as the hard stop on how deep the inquiry can go.
