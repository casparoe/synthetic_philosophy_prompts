  **MEMORANDUM**

  **TO:** All Personnel, Subsidiaries, and Affiliated Stakeholders
  **FROM:** Office of Cross-Species Ethics and Universal Stakeholder Governance
  **DATE:** October 24, 2023
  **SUBJECT:** Implementation of the Aethelon Universal Stakeholder Covenant (AUSC) and Revised Compliance Protocols

  **1.0 PURPOSE AND SCOPE**

  1.1 Effective immediately, the Aethelon Group hereby adopts the Aethelon Universal Stakeholder Covenant (AUSC). This framework operationalizes our commitment to strict anti-speciesism by decoupling moral status from biological taxonomy.

  1.2 All internal governance shall utilize the "Triadic Moral Weighting Formula." This algorithm calculates interest prioritization based on: (a) phenomenal capacity (subjective experience intensity), (b) sentience markers, and (c) relational proximity to operational units. Species membership is designated as a null variable. Personnel are advised that historical precedents favoring *Homo sapiens* constitute a compliance violation under Section 4.2 of the Employee Conduct Code.

  **2.0 PERSONNEL AND RECRUITMENT (THE MARGINAL CASES PROTOCOL)**

  2.1 In alignment with the marginal-cases argument, all cognitive-ability screenings previously mandated for human applicants are hereby suspended. As cognitive capacity varies widely within the human species, utilizing it as a threshold for employment eligibility creates an unjustified inconsistency when compared to non-human sentient entities.

  2.2 Recruitment channels are now open to non-human candidates possessing verified phenomenal capacity. Qualified corvids (for logistics optimization) and cetaceans (for acoustic analysis) may apply for Grade 3 roles and above.

  2.3 **Promotion Ambiguity:** Where a non-human candidate exhibits higher phenomenal capacity than a human counterpart but lacks relational proximity (e.g., inability to utilize legacy keyboard interfaces), the Triadic Formula shall apply. Managers must document any decision to promote a human over a non-human candidate with higher sentience scores. Please note: Accommodation costs (e.g., saline tanks, perch installations) are classified as capital expenditures, not diversity initiatives.

  **3.0 FACILITY MANAGEMENT AND OFFICE ECOLOGY**

  3.1 **Predation Non-Interference Treaty:** All Aethelon facilities are designated as Protected Moral Zones. Lethal control of rodents, insects, or arachnids is prohibited. These entities possess moral status under the AUSC. Traps, poisons, and exterminators are to be decommissioned.

  3.2 **Carnivore Containment:** Employees maintaining resident carnivores (e.g., office cats for rodent morale) must adhere to strict dietary restrictions. Feeding regimes that facilitate predation instincts are banned to prevent indirect complicity in wild-animal suffering.

  3.3 **Welfare Conflicts:** Personnel are notified that allowing natural predation cycles within the office violates the Right to Life of rodent stakeholders. Conversely, preventing predation via human intervention may violate the Non-Interference Principle regarding carnivore welfare. Until the Moral Status Auditor issues a ruling, employees are instructed to distract carnivores with synthetic toys during observed hunting behaviors. Do not intervene physically unless human safety is compromised (see Section 5.0).

  **4.0 SUPPLY CHAIN AND INFRASTRUCTURE**

  4.1 Following the acquisition of Logistics Subsidiary 7-B, operating near the Northern Wildlife Corridor, Aethelon assumes potential liability for " indirect predation" and habitat fragmentation.

  4.2 **Mitigation vs. Non-Interference:** Legal and Ethics are currently debating whether building wildlife crossings constitutes a positive duty to mitigate road mortality or an impermissible intervention in natural population dynamics. Building crossings may alter carnivore-prey density ratios, potentially increasing net suffering via the replaceability argument.

  4.3 Until a Cross-Species Impact Assessment is completed, fleet vehicles must maintain reduced speeds in corridor zones. Drivers should note that slowing logistics throughput to minimize insect strike mortality is now a Key Performance Indicator.

  **5.0 GOVERNANCE AND OVERSIGHT (ISDQ)**

  5.1 The Inter-Species Deliberative Quorum (ISDQ) is established to review policies affecting more than five hundred (500) non-human sentient entities.

  5.2 Any project triggering this threshold requires a Cross-Species Impact Assessment conducted by a certified Moral Status Auditor. Auditors will utilize the Triadic Moral Weighting Formula to resolve conflicts between welfare-maximization (utilitarian) and rights-based (deontological) frameworks. Personnel should anticipate delays in project approval as auditors calculate the net phenomenal weight of affected invertebrate populations.

  **6.0 COMPLIANCE**

  6.1 Failure to adhere to the AUSC may result in disciplinary action. Remember: Moral status is universal; moral weight is contextual.

  **Signed,**

  *Office of Cross-Species Ethics and Universal Stakeholder Governance*
  *Aethelon Group*

  ***

  ^1 ^*Dissenting ^Note ^from ^the ^Human ^Resources ^Traditionalist ^Caucus:* ^*While ^we ^support ^ethical ^treatment, ^the ^Marginal ^Cases ^Protocol ^ignores ^the ^practical ^necessity ^of ^biological ^congruence ^in ^workspace ^design. ^Legacy ^ergonomic ^stations ^are ^calibrated ^for ^bipedal ^primates ^with ^opposable ^thumbs. ^Accommodating ^non-primate ^stakeholders ^requires ^retrofitting ^costs ^that ^disproportionately ^impact ^human ^employee ^benefits ^packages. ^Furthermore, ^tax ^filing ^systems ^remain ^incompatible ^with ^non-verbal ^entities, ^creating ^an ^administrative ^burden ^that ^suggests ^a ^need ^for ^a ^pragmatic ^species-based ^exemption ^clause.*
