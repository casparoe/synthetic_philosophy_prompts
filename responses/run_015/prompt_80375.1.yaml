answer: |-
  **The Case of Elena's Afternoon**

  Elena visits a gallery. **Experience A:** A stranger presses a chilled lemon sorbet into her hand. She hadn't recognised any thirst; the taste is a sharp, intense zest (high tone), wholly unexpected (no prior desire). **Experience B:** She finds a specific sketch she'd sought for months. The feeling is a quiet, warm click of recognition (low tone), paradigmatic desire-fulfilment. Both last one minute. Both are certain, pure, and leave no aftermath—no guilt, no comedown, no satiation affecting future choices.

  **Specification Check:** Both are unambiguous pleasures. Duration and Benthamite variables (certainty, propinquity, fecundity, purity) match. A's intensity exceeds B's. A lacks antecedent desire; B lacks A's sensory punch. No hidden costs smuggle in disvalue.

  **Verdicts:** The **Tone-Hedonist** ranks A > B. The common currency is phenomenal intensity; A simply contains more 'pleasure-units'. The **Desire-Theorist** ranks B > A. Value lies in the fit between world and want; A is merely a sensory tick, B is a success.

  **Millian Competent Judges:** Would those acquainted with both prefer A or B? Likely B, citing 'quality'. But this relocates the problem: is their preference tracking a higher *tone* they alone feel, or a non-hedonic value (satisfaction) disguised as quality? If the latter, Mill collapses into desire-theory. If the former, the 'quality' distinction is just a masked tone difference, failing to solve heterogeneity.

  **Honest Note:** The work is done by **A's lack of antecedent desire**. If Elena had craved the sorbet, A becomes both high-tone *and* satisfaction, collapsing the distinction. If B's tone matched A's, desire-theory loses its intuitive pull. The most plausible attack targets A's 'purity': defenders will argue intense sensory rushes inevitably involve contrast-effects (relief from discomfort), implying a prior negative state or desire to remove it. If A implies relief, it secretly satisfies a desire (to end discomfort), undermining the 'free-floating' spec. Alternatively, they may deny B is a pleasure at all, distinct from the knowledge of satisfaction. This case holds only if one accepts sensory pleasure can be desire-independent and cost-free in reality.
