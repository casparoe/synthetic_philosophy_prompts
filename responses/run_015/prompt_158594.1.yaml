answer: |-
  You are mistaking the abstraction of possibility for the concreteness of actuality. When you say the boundary shifts by "half a step" across frames, you are constructing a meta-space of hypothetical contexts and observing a gradient there. But reality does not operate in a meta-space. Reality instantiates a single, precise context at any given moment of evaluation.

  Consider your machine. At time *t*, the ambient noise floor is not a range; it is a specific physical magnitude. The listener's threshold is not a fuzzy disposition; it is a specific physiological state. These facts constitute the frame. They are not selected by a "rule" that might be vague; they are fixed by the state of the world. If the noise floor drops by 0.05 dB, the world has changed. You now have a different world-state, hence a different frame, hence a different boundary.

  The fuzziness you perceive in "frame-selection" is merely epistemic uncertainty about which precise world-state obtains, or perhaps a pragmatic hesitation to specify the context. But ontically, there is no smear. There is no moment where the frame is "half-selected." Either the ambient noise is *X* or it is not. Consequently, the predicate "loud" supervenes on a precise conjunction of signal intensity and contextual parameters.

  You claim there is no single step where it "just became" loud across frames. Correct, because "across frames" is a fiction of comparison, not a feature of existence. In any single actualization of the experiment, there is exactly one step where the transition occurs. The discontinuity you fear is not a flaw; it is the signature of precision. The world does not slide; it snaps. You are looking for vagueness in the gap between possible worlds, but vagueness cannot exist there any more than it can exist within them. There is only the sharp edge of the actual.

