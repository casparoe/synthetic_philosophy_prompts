          *   Therefore, the resolution relies entirely on the assumption that a proper prior exists. This isn't a logical correction; it's a substantive constraint on the problem space. By ruling out improper priors, we rule out the case where the paradox is genuinely compelling. The paradox isn't a calculation error; it's a signal that expected utility theory breaks down under ignorance (improper priors).

  4.  **Refining the Voice:**
