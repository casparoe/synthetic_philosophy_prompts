answer: |-
  The standard resolution of the two-envelope paradox relies too heavily on diagnosing a syntactic error—the conflation of a fixed observed value with a random variable—while ignoring the semantic engine driving the contradiction. The claim that the conditional probability of the other envelope containing $2A$ versus $A/2$ must deviate from $1/2$ is not a logical necessity derived from the problem setup; it is a consequence of imposing a specific constraint on the prior distribution of the envelope amounts. When critics assert that the expected value calculation is a fallacy because it assumes equal probabilities regardless of $A$, they are implicitly assuming that the prior distribution over the smaller amount must decay sufficiently fast to be normalizable. But this is precisely what is in question. If we treat the problem as one of decision under complete ignorance, there is no justification for imposing a proper prior, and without that imposition, the conditional probabilities do not shift away from equality.

  Consider the case where the host's distribution over the smaller amount $X$ is modeled as a uniform improper prior over the positive reals, representing a state of total ignorance regarding the scale of the money involved. Let $\pi(x)$ be the prior density. If $\pi(x) \propto 1$, then the likelihood of observing amount $A$ given that $A$ is the smaller amount is proportional to $\pi(A)$, and the likelihood of observing $A$ given that $A$ is the larger amount (meaning the smaller was $A/2$) is proportional to $\pi(A/2)$. Since the prior is constant, $\pi(A) = \pi(A/2)$, and by Bayes' theorem, the posterior probability that the other envelope contains $2A$ remains exactly $1/2$, conditional on any observed $A$. Consequently, the conditional expectation of the other envelope is $0.5(2A) + 0.5(A/2) = 1.25A$. In this specific but defensible modeling context, the naive calculation is locally correct for every possible observation, and the recommendation to switch holds pointwise.

  The standard resolution collapses this argument only by invoking the global expectation, noting that integrating $1.25A$ over all $A$ yields infinity, matching the infinite expectation of staying, thereby neutralizing the advantage. But this move simply begs the question against the paradox by insisting on a proper prior where the expectations converge. The resolution only succeeds if we assume the host's distribution is proper, yet this assumption is doing all the work; it is not an innocuous logical correction but a substantive restriction on the problem space that excludes cases of genuine ignorance. By ruling out improper priors, the standard resolution doesn't dissolve the paradox; it merely circumscribes the domain where expected utility theory functions normally, leaving the core tension—that rational choice criteria break down under scale-invariant uncertainty—entirely intact.
