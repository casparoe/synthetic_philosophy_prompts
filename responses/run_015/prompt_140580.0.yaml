answer: |-
  You have identified a genuine and under-theorized friction point in the literature. The configuration you describe does not have a single, canonical label like "The Leveling Down Objection," but it sits at the intersection of three distinct debates: **Telic Egalitarianism**, **Prioritarianism**, and **Personal Identity (Reductionism)**.

  Here is the carving you requested: what the phenomenon is, why the intuitions split, and where the boundary lies.

  ### 1. The Interpersonal Anchor: The Leveling Down Objection
  You are correct about the standard case. This is **Derek Parfit's Leveling Down Objection** against **Telic Egalitarianism**.
  *   **Telic Egalitarianism:** Equality is intrinsically good.
  *   **The Objection:** If equality is intrinsically good, then a world where everyone is equally miserable should be *in one way better* than a world where some are miserable and some are well-off, even if no one benefits from the change.
  *   **The Consensus:** Most philosophers reject Telic Egalitarianism because of this. They switch to **Prioritarianism** (benefits to the worse off matter more) or **Sufficientarianism**. Crucially, Prioritarianism *agrees* with the Leveling Down Objection: if no one gains, the outcome is not better, because priority is given to *gains*, not states.

  ### 2. The Intrapersonal Analogue: Temporal Equity vs. Prudence
  The intrapersonal case (one life, different time slices) lacks a famous name because standard rational choice theory assumes **Prudential Maximization** (maximize the sum total of well-being over a life). Under this view, "leveling down" within a life is simply irrational, not unjust.

  However, your observation holds: people often apply equity intuitions intrapersonally. We need to distinguish the two versions you presented, as they rely on different normative engines.

  #### Case A: Pure Intrapersonal Leveling Down
  *   **Scenario:** 30 years @ 90 + 30 years @ 30 $\rightarrow$ 60 years @ 30.
  *   **The Intuition:** Most say this is worse. Total well-being drops drastically.
  *   **The Dissenters:** Those who say the "flattened life is better shaped" are not necessarily making a welfare claim; they are making an **Aesthetic or Narrative Claim**. This draws on the **"Shape of a Life"** literature (e.g., Velleman, Slote). They argue a smooth life has a value distinct from the sum of its moments.
  *   **The Label:** If someone argues this is *morally* or *prudentially* better despite the loss in total welfare, they are advocating **Intrapersonal Telic Egalitarianism**. This view is rare because it violates the **Pareto Principle** applied to time slices (making some slices worse off and none better off).

  #### Case B: The Weighted Trade (The "Sharper Version")
  *   **Scenario:** Destroy 100 units in good years to deliver 1 unit to bad years.
  *   **The Intuition:** This is the crux of your puzzle. Standard Prudence says "No" (Net loss of 99). Prioritarianism says "Maybe" (If the weight of the bad years is high enough).
  *   **The Conflict:** This is **Intrapersonal Prioritarianism**.
      *   In the *interpersonal* case, Prioritarianism is a theory of **Justice**.
      *   In the *intrapersonal* case, it becomes a theory of **Prudence**.
  *   **Why the Intuition Splits:** People who reject interpersonal leveling down often accept intrapersonal weighting because they view the "bad years" as a state of *need* that commands attention, even from the self. However, when the trade becomes extreme (100 for 1), the "Prudential Rationality" intuition (maximize the total) clashes with the "Moral Priority" intuition (help the suffering part).

  ### 3. The Boundary: Psychological Connectedness
  You asked where the boundary lies and if it moves with psychological discontinuity. **This is the mechanism that explains the intuition shift.**

  This draws on **Parfit's Reductionist View of Persons** (*Reasons and Persons*).
  *   **High Connectedness:** If the "good years" self and "bad years" self share memories, intentions, and character, we treat them as **One Person**. We apply **Prudence**. We expect the good self to sacrifice for the bad self only if there is a net gain (or a reasonable insurance trade). Pure leveling down looks like self-harm.
  *   **Low Connectedness (Discontinuity):** If there is no memory or continuity of concern (e.g., severe dementia, radical psychological rupture), the "time slices" function morally like **Different People**.
      *   **The Shift:** As connectedness drops, the Intrapersonal Case *becomes* the Interpersonal Case.
      *   **The Consequence:** If the good years and bad years are psychologically discontinuous, the "100 for 1" trade looks like **exploitation** of one person for the benefit of another. The "Prudential" justification evaporates, and the "Justice" justification (Prioritarianism) takes over.
      *   **The Paradox:** If you are a Reductionist, you should be *more* willing to accept interpersonal aggregation (because persons aren't deeply distinct) but *less* willing to accept intrapersonal sacrifice (because the future self is a stranger).

  ### 4. Carving the Phenomenon
  To answer your request for the phenomenon carved:

  **What it is:**
  It is the **Conflict between Sum-Ranking and Distribution-Sensitivity applied to Temporal Parts**. It is the tension between viewing a life as a **Container of Welfare** (where only the total matters) versus a **Society of Selves** (where the distribution between time-slices matters).

  **What it is not:**
  *   It is not simply the **Leveling Down Objection**. The LDO targets the claim that *equality is intrinsically good*. Your intrapersonal case often relies on the claim that *suffering is lexically prior* (Prioritarianism) or that *narrative smoothness has value* (Aesthetic).
  *   It is not **Standard Prioritarianism**. Standard Prioritarianism is explicitly interpersonal. Applying it intrapersonally requires justifying why the "moral weight" of well-being applies to one's own future moments differently than standard discounting or summing.

  **Which nearby argument fits:**
  The argument that genuinely fits your "Sharper Version" (100 for 1) is **The Separateness of Persons Objection (Inverted)**.
  *   **Rawls/Nozick:** Used the "Separateness of Persons" to argue *against* utilitarianism (you can't sacrifice one person for the greater social good).
  *   **Your Case:** You are asking if the "Unity of the Person" allows us to *bypass* the Leveling Down Objection.
  *   **The Fit:** The view you are probing is **Intrapersonal Prioritarianism**. It claims that the marginal moral value of well-being diminishes *within a life over time*, not just across lives.

  ### 5. Policy Implications (Health Analysis)
  Since you work in health policy, this distinction is operational:
  *   **QALYs (Quality-Adjusted Life Years):** Assume the **Sum View**. A year at 90 + a year at 30 = 1.2 QALYs. Flattening to 30 + 30 = 0.6 QALYs. QALYs reject leveling down.
  *   **Equity Weights:** Often applied *interpersonally* (give priority to the sick).
  *   **The Gap:** Your configuration asks: Should we apply equity weights *intrapersonally*? Should a year of health gained in a "bad period" of a life count for more than a year gained in a "good period" of the *same* life?
      *   If **Yes**: You are adopting Intrapersonal Prioritarianism.
      *   If **No**: You are adopting Prudential Sum-Ranking.

  ### Summary
  The phenomenon is **Intrapersonal Distribution Sensitivity**.
  *   The **Pure Leveling Down** version (90/30 $\rightarrow$ 30/30) is generally rejected as irrational (violates Prudence), unless defended on **Narrative/Aesthetic** grounds.
  *   The **Weighted Trade** version (100 for 1) is the true analogue to the interpersonal Prioritarian view. It is supported only if one accepts **Intrapersonal Prioritarianism**.
  *   The **Boundary** is **Psychological Connectedness**. As connectedness fades, the intrapersonal case morally transforms into the interpersonal case, making the "100 for 1" trade look less like prudence and more like unjust sacrifice.

  The reason you cannot find a name is that most moral philosophy assumes the "Unity of the Person" is sufficient to mandate Sum-Ranking intrapersonally, while assuming "Separateness of Persons" is sufficient to mandate Distribution-Sensitivity interpersonally. You have found the crack where those two assumptions slide against each other.
