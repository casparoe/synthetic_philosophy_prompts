      *   *Section 2: Fraud (The Sneak vs. The Statistic).* Workfare sees a cheat behind every tree. Reverse-Desert sees a systemic calculation. Time is hard to fake.
      *   *Section 3: Respect (Discipline vs. Dignity).* This is the emotional core for the novel. Workfare says "stand on your own feet." Reverse-Desert says "we broke your feet, we fix them."
      *   *Conclusion:* Summarize the dramatic tension.

  5.  **Refining for the User's Novel Context:**
