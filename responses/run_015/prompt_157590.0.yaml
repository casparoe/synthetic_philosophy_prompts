      *   **Key Areas of Conflict:** Deterrence, Risk of Fraud, Respect for People.
      *   **Format:** Conceptual, no footnotes, no reading lists.
      *   **Tone:** Analytical but suitable for informing fiction writing (nuanced, dramatic potential).

  2.  **Deconstruct the Two Frameworks:**

      *   **Framework A: The "Undeserving Poor" / Workfare Model**
