          *   *Goal:* Behavioral modification (get them working), cost containment.
          *   *View of the Individual:* Potential shirker, needs motivation/discipline.

      *   **Framework B: The "Reverse-Desert" / Human Capital Depreciation Model**
          *   *Premise:* Unemployment causes active harm (skill loss, network erosion, psychological scarring). Society benefits from employed people, so society caused the loss.
          *   *Mechanism:* Escalating support based on duration of unemployment. Time = Debt owed by state.
          *   *Goal:* Restoration, reintegration, compensating for damage.
          *   *View of the Individual:* Victim of structural erosion, asset in need of repair.

  3.  **Brainstorming the Clashes (The "Debate Points"):**

      *   **Deterrence:**
          *   *Workfare:* Deters "lazy" people from claiming. Makes benefits unpleasant enough to force job search.
          *   *Reverse-Desert:* Deters... what? Actually, it might incentivize staying unemployed if the payout gets better. *Correction:* The policy guy would argue it deters *long-term* exclusion by intervening heavily before skills rot. The caseworker would argue it removes the stick.
