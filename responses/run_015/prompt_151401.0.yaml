answer: |-
  Hey, grab a latte and check this out—I'm trying to stress-test a municipal health scenario without falling back on trolleys or spies. So, imagine Elena, the health commissioner, gets a quiet report that the main intake valve has a minor, transient bacterial spike—nothing lethal, but enough to spike ER visits among the immunocompromised if left unchecked. She can bypass it through the unused backup filtration system, which guarantees safety, but flipping that switch triggers a public alert protocol she knows will cause unnecessary panic and cost the city a fortune in bottled water contracts. Instead, she reroutes the flow silently and issues a bland "routine maintenance" notice on the website; the water stays safe, nobody gets sick, but the public never learns they were at risk or gets to weigh in on the secrecy.

  Here's how the room splits on this. The dirty-hands theorist says Elena did what she had to do but remains morally stained because she usurped democratic agency to secure safety. The act-consequentialist shrugs and says there's literally no stain since outcomes are optimal and autonomy was never actually violated—only procedural transparency was hidden, which matters only if it changes the result. The Kantian shuts it down immediately: she lied by omission, treating citizens as tools for stability rather than ends in themselves, so it's wrong regardless of the water quality. The exact feature doing the work here is whether justified agent-relative moral costs survive the action or are just emotional residue. For the dirty-hands theorist, the stain is a real moral remainder that survives justification; if you strip that feature away and decide that "justified" equals "clean," the case collapses into pure consequentialism and the dirty-hands problem vanishes. But here's the kicker the dirty-hands defender would throw at you: you've smuggled in the assumption autonomy is purely instrumental. They'd argue that by saying there's no stain because outcomes were good, you're treating the right to know as merely a tool for safety, ignoring that violating that right damages the moral relationship itself, regardless of the water quality.
