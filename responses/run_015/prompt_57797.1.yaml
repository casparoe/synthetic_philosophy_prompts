  Dear Writer,

  It is a pleasure to help you think through the philosophical consistency of your outreach worker character, as getting the policy nuances right is often what separates a believable political drama from a caricature. Based on the positions you have described, your friend is operating from a very specific ethical framework that is common among sex worker rights advocates who prioritize labor rights over moral rescue or state control. To understand how she will react to the mayor's compromise, we need to excavate the underlying principles that unify her support for the New Zealand model and her rejection of the Nordic and German systems. I see two distinct philosophical principles that could explain her past views, and while they overlap significantly, they diverge enough to predict different reactions to this new proposal. The first principle I would call Strict Regulatory Parity, which holds that sex work must be treated exactly like any other service industry without exception, meaning any law that singles out sex work for special licensing, inspection regimes, or zoning is inherently discriminatory and stigmatizing. The second principle I would call Anti-Coercive Harm Reduction, which holds that the primary metric of any policy is whether it increases physical safety and autonomy for workers without granting police or state agents the power to punish, exclude, or surveil them, even if that means accepting some specific regulations that do not apply to other industries.

  If your friend is guided primarily by Strict Regulatory Parity, she will likely view the mayor's compromise with immediate suspicion and ultimately reject the provisions regarding larger commercial brothels. Under this view, the requirement for a special licence and quarterly safety inspections exclusively for larger sex work establishments creates the exact two-tier system she disliked in the German model, because a restaurant or a massage parlour of the same size would not need a special licence or quarterly visits. She would argue that normal business and noise rules should suffice for any size operation, and that creating a specific category for larger brothels marks them as socially distinct and dangerous, which invites stigma and allows the city to treat them as conditional privileges rather than rights. She would likely argue that the school buffer zone, while framed as nuisance law, is still a form of zoning that targets sex work specifically, whereas other noisy or adult businesses might not face the same strict buffers. For a Strict Parity advocate, the removal of criminal penalties is not enough if the regulatory framework still treats the work as something requiring special state permission beyond what is required for other citizens.

  However, if she is guided primarily by Anti-Coercive Harm Reduction, her reaction might be more nuanced and potentially supportive, provided certain conditions are met regarding how the licences are administered. This principle focuses on the material outcome of safety and the absence of police leverage rather than perfect legal symmetry. She approved of the Dutch tweak regarding premises inspections because it focused on safety without mandatory health checks for individuals, so she might accept quarterly inspections for larger venues if they are strictly about fire safety and building codes rather than worker conduct. The key for her under this principle would be whether the special licence is discretionary or automatic. If the licence is granted automatically upon meeting safety standards and cannot be revoked arbitrarily by the mayor or police, she might see it as a pragmatic way to ensure safety in larger workplaces without criminalizing the workers. She would still be wary of the school buffer zones if they push workers into isolated areas where screening is harder, but she might tolerate them if they are narrowly defined. The voluntary exit help aligns perfectly with this view, as it provides support without coercion. The deciding factor for an Anti-Coercive Harm Reductionist is whether the special licence gives the state leverage to shut down a business for minor infractions, thereby forcing workers underground, whereas a Strict Parity advocate would oppose the licence itself regardless of how fairly it is administered.

  My best guess is that her real view aligns more closely with Strict Regulatory Parity, primarily because of her specific criticism of the German and Dutch legalization models. When she rejected those models, she did not argue that the inspections were unsafe or that the exit help was coercive, but rather that they created a two-tier system and gave police too much leverage. This suggests she believes that leverage is an inevitable consequence of creating a separate regulatory class, meaning you cannot have special licences without creating the potential for abuse. Her approval of the Dutch tweak was likely contingent on the removal of the seller-only medical pass, which restored some parity by treating the premises like any other business venue rather than singling out the workers' bodies for state control. In the mayor's compromise, the special licence for larger brothels reintroduces that separate class, and given her history of opposing anything that gives police leverage, she will likely argue that a special licence is inherently discretionary and therefore dangerous. She will probably argue that if a building is safe enough for a restaurant, it is safe enough for a brothel, and that requiring a special permit implies that sex work is inherently riskier or morally distinct, which undermines the goal of full decriminalization.

  To help you develop her character further in a later chapter, you could introduce a hypothetical case that separates these two principles by presenting a scenario where Regulatory Parity leads to less safety or where Harm Reduction requires inequality. For example, imagine a situation where a large hotel wants to host a convention that includes sex work services, but standard business insurance policies refuse to cover sex work activities, leaving workers without injury compensation. A Strict Regulatory Parity advocate would argue that the solution is to force insurance companies to cover sex work exactly like any other job, refusing any state intervention that treats them differently. An Anti-Coercive Harm Reduction advocate, however, might support a temporary state-backed insurance fund specifically for sex workers to ensure they are protected immediately, even if that creates a special state program just for them. Watching how your character reacts to a proposal for special state-funded insurance versus demanding equal treatment from private insurers would reveal whether she prioritizes the symbol of equality or the material reality of safety, adding depth to her debates with the mayor and showing that her philosophy is tested by real-world complications rather than just abstract ideals. I hope this helps you navigate the council debates in your draft, as getting these distinctions right will make the political tension feel much more authentic.
