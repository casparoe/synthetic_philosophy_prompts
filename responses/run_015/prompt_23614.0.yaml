      *   *Is G2 irrelevant?* No, G2 is a special case. But for *action*, Löb is the blocker. If I can't prove consistency, I can't prove soundness. But Löb blocks soundness even more directly.
      *   *What about "Proof-Carrying Code"?* That's relevant. The agent produces code + proof. The *checker* verifies it. If the checker is immutable, Löb doesn't apply to the *checker*, only to the agent's reasoning *about* the checker.
      *   *Wait, if the agent rewrites the checker:* If the agent rewrites the checker, it must prove the *new checker* is sound. To do that, it needs to trust its *current* reasoning. This is where the Löbian obstacle hits hard. $T \vdash \text{Sound}(T')$. If $T' = T$, we have the problem.
