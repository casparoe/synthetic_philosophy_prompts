  I'm a backend dev with no philosophy background — I took one Great Ideas gen-ed and that's it — but I joined this pragmatism reading group bacause a friend dragged me in. There's this guy Sam who always ends up being the one who rulls on whether some belief counts as true. I've kept a list of his verdicts on cases we've talked about so far:

