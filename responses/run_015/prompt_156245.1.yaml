  - A simple math claim like 17 + 5 = 22: he says true.
  - A conspiracy theory that has a lot of believers, makes them feel empowered, but has zero evidence and falls apart when checked: he says not true.

  The new case we're voting on next week is Newtonian physics before Einstein. In 1900, physicists using Newton's laws could predict planetary orbits to amazing accuracy; the theory was verified, useful, and worked for every purpose anyone had. Later, relativity showed that Newton's absolute space and time weren't the final story — Newton's laws are now seen as an approximation that fails in strong gravity or at high speeds. The question for Sam: in 1900, was Newtonian physics (or the claim that space and time are absolute) true?

