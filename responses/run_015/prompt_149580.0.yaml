  ### Tier List and Scoring

  **S-Tier: Dispositional Essentialism (D)**
  **Score: 9/10**

  **A-Tier: Intrinsic-base Defence (C)**
  **Score: 7/10**

  **B-Tier: Systemic Equilibrium View (E)**
