answer: |-
  The slogan your group member is deploying is the hallmark of deflationism about truth, a family of views that denies truth has a deep metaphysical nature, but within that family there are distinct precise theses ranging from the linguistically trivial to the metaphysically radical. The first reading, which we can call the Pure Redundancy Theory, takes the slogan literally to mean that the predicate is true adds nothing whatsoever to the content of a sentence, so that It is true that snow is white is synonymous with Snow is white. This is largely a platitude for simple cases but fails scrutiny as a general theory because it cannot handle cases where you cannot produce the sentence, such as when you say Everything in the manual is true or What she said is true. In those instances, you are committing yourself to propositions you cannot currently enumerate, so the word true is doing logical work as a device for generalization rather than mere redundancy. Consequently, this reading fails to accommodate the linguistic cases you raised about generalization and indirect reference, and while it would dissolve the worry about the stars in the Milky Way by equating truth with assertion, it would not support your member's claim that truth cannot explain action, because even on this view the content of the belief explains the action, not the word true.

  The second reading is Disquotationalism, which holds that truth is a logical device that allows us to remove quotation marks and move from mentioning a sentence to using it. This is a substantive claim that survives scrutiny better than pure redundancy because it accounts for generalization, allowing you to say All sentences of the form p or not p are true without listing them all. However, this reading struggles with the paradoxical cases you mentioned, such as This sentence is false, where the move from the sentence to the sentence-is-true breaks outright and generates contradiction rather than clarity. It also has trouble with your cases of basically true or true of a fictional character, because these imply degrees or contexts where simple disquotation does not apply, suggesting that true is sometimes doing genuine semantic work to qualify the relationship between language and world. In the argument about the stars, this reading delivers the conclusion your member wanted, because if truth is just a device for asserting content, then whether the content is verification-transcendent is a matter for the content itself, not the truth predicate. In the argument about action, however, it only partially supports him, because while truth itself is not a causal power, the accuracy of the belief which truth marks is still doing the explanatory work.

  The third reading is Minimalism, which is likely the strongest version available to your member and claims that while truth is a property, it is not a substantive one with an underlying nature that explains why true beliefs are successful. On this view, the equivalence schema holds, but the claim that truth isn't a property is shorthand for saying it isn't a natural property like mass or charge that enters into causal explanations. This survives scrutiny well and accommodates generalization, though it must treat basically true or true but misleading as pragmatic implicatures rather than semantic variations. This reading handles the paradox cases poorly unless restricted, but it is the most robust metaphysical position. It delivers the conclusion in your argument about action most effectively, because it insists that the utility of true beliefs is explained by the world cooperating with the content of the belief, not by the property of truth itself exerting force. It also dissolves the worry about the stars, because it separates the concept of truth from the concept of verification, allowing you to assert the proposition without needing a theory of how you could check it.

  Your own guess, which we can call the Performative Theory, is a genuine distinct option that does not collapse into the others, because it shifts the focus from semantics or metaphysics to pragmatics, claiming that calling a sentence true is an act of endorsing, conceding, or agreeing rather than describing a feature of the sentence. This accommodates the linguistic cases well, explaining why we use true in conversation to signal alignment rather than to add content, and it handles the vague cases like basically true as partial endorsement. However, it struggles to explain the logical work of generalization unless supplemented with disquotational mechanics. Read this way, your guess settles neither argument definitively because it changes the subject from what truth is to what we do with the word, which means it sidesteps the metaphysical worry about the stars rather than solving it, and it agrees with your member that truth doesn't explain action but for the different reason that truth is an act not a fact.

  Regarding which reading your member probably meant, he is almost certainly operating with a mix of the second and third readings, Disquotationalism and Minimalism, because these are the standard academic successors to the redundancy theory and provide the philosophical firepower to claim everything after correspondence is downhill. He is using the slogan to deny that truth is a robust relational property that needs to be analyzed in terms of correspondence or coherence, and he is leveraging that denial to block metaphysical worries. The strongest version available to him is Minimalism, because it allows him to accept that true beliefs are useful without conceding that truth is a substantive property that explains that utility, preserving the deflationary insight while avoiding the linguistic pitfalls of pure redundancy.

  On your first argument, that truth has to be something substantial because true beliefs get you what you want, your member is technically correct but rhetorically dismissive. The verdict is that you are right that true beliefs are instrumentally valuable, but he is right that the property of truth does not explain that value. The explanation lies in the causal relationship between the content of the belief and the state of the world, so truth itself does no explanatory work beyond marking that relationship. His claim that your argument collapses is too strong; your argument should be revised to say that accuracy explains action, and truth is just the label we put on accuracy, so while truth isn't a causal power, it tracks something that is.

  On the second argument, regarding the odd number of stars ten billion years ago, your member is clearly correct and the deflationary reading delivers the conclusion he wanted. The worry about verification-transcendence only arises if you think truth requires a method of verification or a robust correspondence relation that we must be able to inspect. If saying it is true is just asserting the proposition, then the proposition can be true regardless of our epistemic access, provided you are a realist about the past. The deflationist stance dissolves the worry because it removes the metaphysical baggage that makes verification seem necessary for truth, leaving you with just the claim about the stars, which is meaningful even if unverifiable.

  Finally, concerning the linguistic cases you raised to show truth earns its keep, the Disquotational and Minimalist readings accommodate generalization and indirect reference successfully, acknowledging that true is useful for logical compression even if it lacks metaphysical depth. However, cases like basically true, true of a fictional character, and the liar paradox do require genuine semantic work or restrictions on the theory, suggesting that while the slogan is powerful, it is not a complete theory of all uses of the word true. Your member is using a powerful philosophical tool to clear away metaphysical clutter, but he is overstating the case when he implies the word does no work at all, since it clearly does logical and pragmatic work even if it does not denote a substantial property.
