  Could you compare the conciliationist and steadfastist positions on peer disagreement, but focus specifically on the claim that conciliationism depends on the "uniqueness" thesis — the idea that for any given body of evidence there is exactly one rational credence to hold? In particular, I'd like to understand whether rejecting uniqueness lets a person be a steadfastist without simply being dogmatic, and whether the uniqueness-based argument against conciliationism actually goes through or whether it quietly assumes what it is trying to prove.
