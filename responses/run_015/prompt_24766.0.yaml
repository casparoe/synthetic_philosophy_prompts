      *   *Incomplete vs. Unreliable:* This is the crux. "Incomplete" means "there are gaps in what I can prove." "Unreliable" means "I might lie." Gödel guarantees gaps, not lies.
      *   *Self-Auditing:* What does it mean for an AI to "check its own work"?
