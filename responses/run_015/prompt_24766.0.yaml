prompt: |-
  I've been reading a lot about formal verification and AI self-auditing lately, and I keep running into this claim: Gödel's incompleteness theorems "prove" that no sufficiently advanced system — a hypothetical superintelligent AI included — can ever be fully trusted to check its own work, because there will always be some true thing it can't verify, so we can never build a system that's certain of its own outputs. I suspect alot of this is a category error, but I want to understand exactly what the theorems do and don't show here.

  Could you walk me through the most important implications of Gödel's incompleteness theorems for this specific claim — the idea that a system can't be trusted to audit or verify itself? Two things I'm stuck on: I keep hearing there's a difference between a formal system being "consistent" and being "sound" or "actually getting things right," and I'm not sure its doing the work people think it is in these arguments; and I have a feeling that "incomplete" and "unreliable" are different things that the argument quietly conflates. Also, do the theorems even apply to the kind of "checking your own work" that a proof checker or a self-auditing agent actually does, or is that a different question entirely?

  Think very carefully before answering and don't hand-wave the hard parts. Respond in the style of a careful logician explaining to a smart but non-specialist friend, and please don't cite papers or give a reading list — just reason through it from the structure of the theorems.
