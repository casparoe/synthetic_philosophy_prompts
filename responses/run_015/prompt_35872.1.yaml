prompt: |-
  hey, so you're a poet with a philosophy background (taught epistemology for years, also writes formal verse), and I need something pretty specific for the last session of my grad seminar on epistemic contextualism and pragmatic encroachment. think hard before you write — brainstorm a few candidate sets of the six end-words first, because that choice basically makes or breaks the whole thing.

  I want a sestina about the bank cases. you know the drill: someone remembers depositing on a Friday, asks a teller, walks out; are they entitled to say they know the bank will be open saturday? same evidence, same memory, but the stakes move — a paycheck on the line versus just avoiding a second trip across town. here the form is supposed to do the philosophy: a sestina's end-words come back six times each, and every time they return the context around them has shifted, so the same word does different work. that's the contextualist picture in miniature, and I want it to actually happen in the poem — the end-words should genuinely change their feel or their referent from one appearance to the next, not just sit there as rhyme-position filler.

  but heres my problem, and this is where I need real thinking: the sestina trick reads as pure contextualism (the word "know" shifts meaning with the conversational stakes). the interest-relative invariantist says no — "know" means the same thing every time, it's the knowing that got harder. I keep going back and forth on whether the poem should stay neutral between those or tip its hand. you decide, and let the envoi do it: the three-line envoi is where the high-stakes and low-stakes worlds finally touch, and I want the reader to feel whichever resolution you picked without being able to prove it from the text alone.

  details: 39 lines (six six-line stanzas plus the envoi), no rhyme obviously, use all six end-words in the envoi — three mid-line, three at the ends. the stakes should rise across the poem, with the turn landing in stanza 3 or 4, your call. someone who knows the encroachment literature should recognize the cases and not wince; someone who doesn't should still get a good poem about errands, memory, and money. also work in one lottery-flavored line somewhere if you can do it without it feeling shoehorned — the tension between "I know I'll lose the lottery" and "I know the bank is open" is exactly the kind of thing the poem should be rubbing up against. dont let it turn into a diagram in costume though, it has to survive as a poem first.

  after the poem, append a JSON object (nothing else after it):

  {
    "end_words": [the six words in first-stanza order],
    "meaning_shifts": {"<word>": "<one sentence on how that word's sense or reference shifts across its six appearances>"},
    "the_turn": "<which line the stakes rise on and what changes there>",
    "hidden_resolution": "<contextualist or invariantist, plus the line-level evidence for saying so>"
  }

  thanks — accuracy matters since the seminar is full of people who will check, but I'd rather have a real poem than a homework answer wearing a rhyme scheme.
