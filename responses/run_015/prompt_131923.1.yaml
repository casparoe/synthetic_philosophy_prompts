prompt: |-
  In a graduate seminar on Buddhist moral philosophy, a classmate repeatedly invoked the maxim that cetana—intention—is karma to dismiss discussion of the ship-captain parable in which a bodhisattva kills a robber to save five hundred merchants. She argued that because the captain's dominant mental state was compassionate, the killing was not unwholesome regardless of the fatal consequence, and therefore Buddhist ethics contains no consequentialist dimension whatsoever. Before I reply, I want to take that slogan apart precisely. Could you lay out the distinct theses that "intention alone determines moral quality" might be expressing—ranging from Abhidharmic claims about mental factors as the exclusive bearers of karma, to normative claims about how actions are evaluated, to Mahayana appeals to upaya—indicating for each whether it is definitional, defensible, or an overreach? For each reading, please state whether it actually supports dismissing the parable as non-consequentialist, and whether it can accommodate the possibility that a wrong mental factor (for instance, a trace of aversion or an attachment to the outcome) might coexist with the compassionate aim without altering the karmic verdict. Present this as a menu of readings I can bring to the discussion rather than a single resolution.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on Buddhist moral philosophy.
      *   **Problem:** A classmate uses the slogan "cetana is karma" (intention is karma) to dismiss the Ship-Captain Parable (Mahayana text, *Upayakausalya Sutra* context). She argues the killing wasn't unwholesome because the intention was compassionate, thus claiming Buddhist ethics has *no* consequentialist dimension.
      *   **Task:** Deconstruct the slogan "intention alone determines moral quality" into distinct theses.
      *   **Requirements:**
          *   Range from Abhidharmic claims to normative claims to Mahayana *upaya*.
          *   For each thesis: Indicate if it's definitional, defensible, or an overreach.
          *   For each thesis: State if it supports dismissing the parable as non-consequentialist.
          *   For each thesis: State if it accommodates mixed mental states (compassion + trace of aversion/attachment).
          *   **Format:** A "menu of readings" (not a single resolution).

  2.  **Deconstruct the Slogan ("Cetana is Karma"):**
      *   *Source:* Anguttara Nikaya 6.63 ("Intention, I tell you, is kamma.").
      *   *Common Misinterpretation:* Only intention matters; consequences don't count.
      *   *Nuanced Interpretation:* Intention is the *generative* factor of karma, but consequences still matter for suffering/outcomes.
      *   *The Classmate's Claim:* Compassionate intention = No bad karma = No unwholesome action = No consequentialism.
      *   *The Counter-Intuition:* The parable explicitly acknowledges the gravity of killing (the Bodhisattva accepts hell-rebirth). This suggests consequences *do* weigh on the moral calculus, even if intention mitigates or transforms the karmic seed.

  3.  **Drafting the "Menu of Readings":**
      I need to create distinct philosophical positions that could be hiding behind that slogan.

      *   *Reading 1: The Abhidharmic/Psychological Definition.* Focus on *cetana* as the volitional impulse that plants the seed.
      *   *Reading 2: The Normative/Deontological Reading.* Focus on the moral quality of the *act* being determined solely by the mind.
      *   *Reading 3: The Soteriological/Result-Oriented Reading.* Focus on the long-term spiritual outcome vs. immediate physical outcome.
      *   *Reading 4: The Mahayana Upaya (Skillful Means) Reading.* Focus on the Bodhisattva's exceptional status and the suspension of precepts.

  4.  **Fleshing out each Reading (Iterative Process):**

      *   *Reading 1 (Abhidharmic):*
          *   *Thesis:* Karma is a mental seed. Physical action is just the manifestation.
          *   *Status:* Defensible (textually supported), but often overextended.
          *   *Consequentialism:* Doesn't rule out consequentialism (consequences still happen).
          *   *Mixed States:* Abhidharma is granular. Mixed states produce mixed seeds.
          *   *Verdict on Classmate:* Weak support.

      *   *Reading 2 (Normative/Intentionalist):*
          *   *Thesis:* Moral worth is *only* in the will (Kantian-ish).
          *   *Status:* Overreach in Buddhism. Buddhism cares about *dukkha* (suffering), which is consequential.
          *   *Consequentialism:* Denies consequentialism explicitly.
          *   *Mixed States:* Problematic. If intention is pure, does the trace matter?
          *   *Verdict on Classmate:* This is her view, but it's philosophically shaky in Buddhism.

      *   *Reading 3 (The "Karmic Result" Reading):*
          *   *Thesis:* The *vipaka* (fruit) is determined by intention, but the *worldly consequence* is separate.
          *   *Status:* Defensible.
          *   *Consequentialism:* Allows for a hybrid view (Intention determines rebirth, consequences determine worldly suffering).
          *   *Mixed States:* Yes, traces alter the *vipaka*.
          *   *Verdict on Classmate:* Undermines her "no consequentialism" claim.

      *   *Reading 4 (Mahayana Upaya/Compassionate Violence):*
          *   *Thesis:* Precepts can be broken for great good, but karmic cost is absorbed by the Bodhisattva.
          *   *Status:* Defensible within Mahayana, but exceptional (not universal ethics).
          *   *Consequentialism:* Highly consequentialist (save 500 vs. 1), but framed as compassion.
          *   *Mixed States:* The parable says the Captain must be *pure*. If there's aversion, it's not upaya, it's just killing.
          *   *Verdict on Classmate:* She uses this to excuse the act, but misses the cost (hell) which implies consequential weight.

  5.  **Refining the Analysis (Addressing Specific Constraints):**
      *   *Definitional vs. Defensible vs. Overreach:* Need to be precise. Is it what the Buddha *meant* by the quote, or how later schools used it?
      *   *Dismissing the Parable:* Does this reading make the parable irrelevant or confirm it's non-consequentialist?
      *   *Mixed Mental Factors:* This is crucial. Abhidharma says mind moments are rapid. Can compassion and aversion coexist? Usually, they are mutually exclusive in a single *citta*, but can alternate rapidly. The classmate assumes "dominant" compassion washes away the rest. Is that true?

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the need to dissect the slogan.
      *   **The Menu:** Four distinct readings.
          *   Title.
          *   Core Thesis.
          *   Classification (Definitional/Defensible/Overreach).
          *   Implication for Consequentialism (Does it support the classmate?).
          *   Accommodation of Mixed States.
      *   **Synthesis/Discussion Tips:** How to use this in the seminar.
      *   **Tone:** Academic, precise, nuanced, respectful of the tradition.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "no consequentialist dimension whatsoever" claim?
      *   *Correction:* Ensure I highlight that even if intention is primary, consequences (suffering) still matter in Buddhism. The classmate's leap from "intention is karma" to "consequences don't matter" is the weak link.
      *   *Check:* Did I address the "mixed mental factors"?
      *   *Correction:* In Abhidharma, wholesome and unwholesome roots don't arise in the same *citta*. But in a macro-action, they can mix. The classmate's "dominant mental state" argument is a simplification. I need to point out that *cetana* isn't just a "vibe," it's a specific mental factor.
      *   *Check:* The Parable. The Captain accepts hell. This is a *consequence*. The classmate ignores this. I must emphasize that the parable *is* consequentialist (weighing 500 lives + their spiritual progress vs. 1 life + Captain's hell).

  8.  **Final Polish:** Ensure the distinction between *karma* (action/seed) and *vipaka* (result) is clear, as confusion here often drives the classmate's error. Ensure the distinction between Theravada/Abhidharma and Mahayana/Upaya is clear.

      *(Self-Correction on "Definitional"):* The quote "Cetana is Karma" is from the Pali Canon. So, as a definition of what generates karmic potential, it's definitional. As a normative claim that *only* intention matters for ethical evaluation of the act in the world, it's an overreach. I will make this distinction clear.

      *(Refining Mixed States):* In the parable, the Bodhisattva must have *no* anger. If there is a trace of aversion, the act becomes karmically negative for *him*. The classmate argues the compassion overrides it. The texts suggest otherwise: purity is required for *upaya*. I need to highlight this tension.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated philosophical impasse. Your classmate is conflating the *genesis* of karma with the *evaluation* of action, and she is collapsing the distinction between karmic fruit (*vipāka*) and worldly consequence (*phala*). The slogan "intention is karma" (AN 6.63) is textually authentic but philosophically overloaded.

  Below is a menu of four distinct readings of that slogan. You can use these to disaggregate her argument, showing that even if one accepts the primacy of intention, it does not necessarily entail the dismissal of consequentialist reasoning or the immunity of the agent from karmic cost.

  ### Reading 1: The Abhidharmic Psychological Thesis
  *   **Core Thesis:** *Karma* is technically defined as the volitional impulse (*cetana*) that plants a seed in the mental continuum. The physical movement of the body is merely the manifestation of that seed, not the karma itself.
  *   **Classification:** **Definitional** (within Abhidharma systems). It accurately describes the mechanism of karmic storage.
  *   **Supports Dismissing the Parable as Non-Consequentialist?** **No.** This thesis explains *how* karma is stored, not *how* actions are ethically weighed. One can hold that intention plants the seed while still acknowledging that the *ripening* of that seed depends on the field (the context/consequences). It does not rule out that the *content* of the intention is shaped by the anticipated consequences (saving 500 vs. 1).
  *   **Accommodates Mixed Mental Factors?** **Poorly.** Abhidharma is granular. Wholesome (*kuśala*) and unwholesome (*akuśala*) roots generally do not arise in the same mind-moment (*citta*). If the captain experiences even a micro-moment of aversion (*dveṣa*) alongside compassion (*karuṇā*), distinct karmic seeds are planted. The "dominant state" argument is a simplification; rapid oscillation between compassion and aversion produces a mixed karmic harvest, not a purely wholesome one.

  ### Reading 2: The Normative Intentionalist Thesis
  *   **Core Thesis:** The moral quality of an action is determined *exclusively* by the agent's mental state at the time of acting. External outcomes (death, suffering) are morally neutral events; only the will is subject to ethical judgment.
  *   **Classification:** **Overreach.** While intention is primary, early Buddhism is soteriologically focused on the cessation of *dukkha* (suffering). Ignoring the suffering caused to the victim (the robber) and the community renders the ethics incoherent within the Buddhist framework. This reading imports a Kantian deontology that sits uneasily with the Buddhist focus on harm reduction.
  *   **Supports Dismissing the Parable as Non-Consequentialist?** **Yes.** This is your classmate's actual argument. It claims the parable is about the captain's purity, not the merchants' survival.
  *   **Accommodates Mixed Mental Factors?** **No.** If moral quality is *exclusive* to intention, then any trace of aversion renders the act partially unwholesome. This thesis cannot claim the act is "not unwholesome" if there is *any* admixture of defilement. It forces a binary: either the intention is perfectly pure (no aversion) or it is karmically negative. It does not allow compassion to "wash away" the aversion.

  ### Reading 3: The Soteriological Consequentialist Thesis
  *   **Core Thesis:** Intention is karma because intention determines future rebirth (*vipāka*), but the ethical evaluation of the act must consider the total suffering produced or prevented in the samsaric cycle.
  *   **Classification:** **Defensible.** This aligns with the broader Buddhist soteriological goal. The "intention is karma" slogan identifies the *cause* of future experience, but does not deny that the *nature* of that experience is tied to the welfare of sentient beings.
  *   **Supports Dismissing the Parable as Non-Consequentialist?** **No.** In fact, it highlights the parable's consequentialism. The Bodhisattva kills the robber *to prevent* the robber from committing the heavy karma of mass murder (which would send the robber to hell). The calculation is explicitly about the long-term karmic consequences for all parties (the 500 merchants, the robber, and the captain).
  *   **Accommodates Mixed Mental Factors?** **Yes.** This reading acknowledges that a trace of aversion would alter the *vipāka* for the captain. It explains why the text emphasizes the captain's willingness to accept hell-rebirth: he knows the physical consequence (death) and the karmic consequence (hell) are real, even if the motivation is compassionate. The "cost" is real, which implies a consequentialist weighing of harms.

  ### Reading 4: The Mahayana *Upāya* (Skillful Means) Thesis
  *   **Core Thesis:** For a high-level Bodhisattva, standard precepts may be suspended if motivated by great compassion and wisdom, transforming the karmic potential of the act through the power of *upaya*.
  *   **Classification:** **Defensible** (within Mahayana soteriology), but **Exceptional**. This applies to the specific ontology of the Bodhisattva, not to general normative ethics. It treats the parable as a limit-case, not a rulebook for ordinary agents.
  *   **Supports Dismissing the Parable as Non-Consequentialist?** **Ambiguous.** It dismisses *rule-based* deontology (precepts), but it is deeply *consequentialist* in its justification (the greater good of the 500 merchants and the spiritual protection of the robber). It argues that the *outcome* justifies the transgression, provided the mind is pure.
  *   **Accommodates Mixed Mental Factors?** **Strictly No.** The *Upāyakauśalya Sūtra* and commentaries are explicit: if the Bodhisattva acts with even a trace of self-interest, anger, or attachment to the result, the *upaya* fails, and the act becomes ordinary killing with full karmic retribution. The classmate's claim that compassion overrides a trace of aversion contradicts the strict purity requirements of *upaya*.

  ### Discussion Strategy
  When you reply, you might suggest that your classmate is conflating **Reading 1** (the mechanism of karma) with **Reading 2** (a normative claim she is importing), while ignoring **Reading 3** (the soteriological calculus actually present in the parable).

  You can point out that the parable itself is evidence *against* her claim: the Bodhisattva accepts that he will suffer hellish consequences *despite* his compassionate intention. If intention alone determined moral quality without consequentialist weight, there would be no hellish consequence to accept. The fact that he accepts the cost proves that the consequence (death) carries karmic weight that intention mitigates but does not erase.

  Finally, regarding mixed mental factors: Ask her if the text allows for "mostly compassionate" killing. The tradition generally says no; *upaya* requires non-dual wisdom. If there is a trace of aversion, the act is not *upaya*, it is just killing. Therefore, the "dominant mental state" defense is insufficient to clear the karmic ledger.
