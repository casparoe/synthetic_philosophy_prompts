prompt: |-
  I'm in a philosophy of language seminar and we finished the Kripke unit last week; the assigned question for the study group was whether the existence of necessary a posteriori truths settles anything about the semantics of names. Two people in the group argued about it for most of an hour and then asked me to referee, and I honestly couldn't. Nadia and Dev are both the kind of person who has done the reading twice, so I don't think either of them is confused in a shallow way, but I also can't tell which of their moves are load-bearing. Here is how the exchange went, as close to verbatim as I can manage.

  (1) Nadia opened by saying that the modal argument only refutes naïve descriptivism. If the description associated with a name is rigidified — the name is held to express something on the order of 'the actual F', a description that latches onto whatever is F in the actual world and then keeps hold of it across other possible worlds — then an identity like 'Hesperus is Phosphorus' comes out necessary, and it is still an a posteriori matter which object the actual F is. So, she said, a descriptivist predicts the necessary a posteriori too, and the modal argument by itself does not discriminate between direct reference and a sophisticated descriptivism; whatever work Kripke does against descriptivism is done by the epistemic and semantic arguments, not by the modal one.

  (2) Dev replied that the rigidification move buys necessity at a price the descriptivist cannot pay. First, rigidifying a description does nothing about reference failure: in the style of case where a name is introduced via a description that turns out to have no unique satisfier, the rigidified description fails to denote just as the unrigidified one does, so no identity involving it is true, let alone necessary, whereas a causal chain secures a referent whether or not any description is satisfied. Second, if a name really meant 'the actual F', then a fully competent speaker who reflected on the meaning of the name would be in a position to know a priori which object it picks out; but no one knows a priori which heavenly body 'Hesperus' picks out, so the name cannot mean that.

  (3) Nadia granted that the epistemic argument has real force against naïve descriptivism, but said Dev's second point begs the question by assuming that whatever a term means must be a priori accessible to a competent speaker — that is just the assumption a Fregean or a two-dimensionalist denies, since on those views a term presents its referent under a mode of presentation whose referent is discovered rather than read off. And she said reference failure is everyone's problem, not just the descriptivist's, since Kripke's own picture has to allow names like 'Vulcan' to come out empty, and in any case there are hybrid views that fix reference causally while retaining descriptive content. She then introduced a stipulation of her own — she was explicit that the term is hers and not from the reading. Call a singular term a 'tracking' term if the convention governing it is not to hold the referent fixed across possible worlds but to denote, at each world, whatever satisfies the associated description in that world. For tracking terms the identity comes out contingent. Her challenge: whether English names are rigid or tracking looks like a contingent empirical question about the conventions of our linguistic community, not something settleable from the armchair. But then the necessity of 'Hesperus is Phosphorus' rests on a contingent metasemantic fact about us, and in some possible community that used the same words with a tracking convention the same sentence would express a contingent proposition — so Kripke's conclusion is itself only knowable a posteriori, and the argument has no a priori purchase on it.

  (4) Dev answered that we do have evidence about which convention is in force, namely our own counterfactual judgments under qualitatively specified suppositions: describe a situation with two distinct bodies in the morning and evening positions and ask whether the identity is true there, and speakers who have the terms judge that it is, and re-describe the case as one in which Hesperus turns out not to have been visible in the evening rather than one in which the identity fails. And he added that Nadia's tracking terms are just definite descriptions read with narrow scope, so her hypothesis is the hypothesis that names are scopally descriptions — which is the thesis under dispute, not a new option — and framing it as an empirical question about conventions misdescribes the dialectic, since the relevant evidence is the pattern of modal judgments and not a survey of what speakers say they mean.

  (5) Nadia made three points in reply. (a) She said she has read that speakers' judgments about just these cases vary across populations and with how the case is worded, which she took to undercut treating the intuitions as evidence for a semantic theory rather than as data to be explained. (b) She said rigidity may be doing no work at all: the necessity of identity follows from the logic of identity together with Leibniz's law, so any true identity between co-referring singular terms is necessary, and the appearance of contingency when definite descriptions are involved is an artifact of scope, since the de dicto reading is available and is the one hearers default to. On this reading the necessary a posteriori is not evidence about names in particular; it falls out of the logic of identity plus the truth of the identity. (c) She pressed a symmetry worry: if fixing reference by a contingent property and then designating rigidly yields necessary a posteriori identities, why does the analogous case with the standard metre yield merely a contingent a priori truth rather than a necessary a posteriori one? Either the cases are disanalogous and the direct-referentist owes an explanation, or the apparatus of rigid designation plus reference-fixing is not doing the explanatory work it is credited with.

  (6) Dev said that (b) concedes his point in different vocabulary: what distinguishes names from descriptions is precisely that names are not scope-sensitive, and 'not scope-sensitive in modal contexts' is another way of saying rigid, so rigidity is exactly what is carrying the necessity, and Nadia has at most redescribed it. He also said that the whole discussion may have been too narrow: whatever we say about names, a theoretical identification like 'water is H2O' is not an identity between objects, and kinds do not have their identity conditions settled in the same way particulars do, so the necessary a posteriori may turn out to be a family of phenomena with different explanations rather than one phenomenon with one.

  Could you adjudicate this move by move? For each of the six, say where it falls on a scale from clearly mistaken to clearly right, and why, including cases where a move is right about one thing and wrong about another, or where it is valid only on a reading of a position that the other side would reject. Then say who is more right overall, if anyone is, and what both of them are missing — the shared assumption, distinction, or option that neither considered. Two further things I would find useful. First, please separate clearly what is settled at a level that anyone who knows this material would grant from what is genuinely contested among specialists: I would rather be told that something is a live dispute than be given one side of it as the consensus, and I would like to know where the contested points are concentrated. Second, flag anything in my reconstruction that a specialist would think is doing work I have not noticed — a paraphrase of a position that is ambiguous, a premise smuggled in by the way I set the case up, or a point where you are going beyond what the arguments as stated actually establish. Finally, is Nadia's 'tracking' stipulation coherent, and is it a genuinely different hypothesis or just the description theory restated?
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of language seminar, post-Kripke unit.
      *   **Task:** Adjudicate a debate between Nadia and Dev regarding whether necessary a posteriori truths settle the semantics of names.
      *   **Structure:**
          1.  Move-by-move analysis (1-6) with a rating (mistaken to right) and explanation.
          2.  Overall verdict (who is more right).
          3.  Identify what both are missing (shared assumptions/distinctions).
          4.  Distinguish settled consensus from live disputes.
          5.  Flag potential ambiguities or reconstruction issues in the prompt.
          6.  Evaluate Nadia's "tracking" stipulation.

  2.  **Deconstruct the Debate (Move by Move):**

      *   **(1) Nadia:** Modal argument only refutes *naïve* descriptivism. Rigidified descriptivism ('the actual F') captures necessity + a posteriori status. Modal argument doesn't distinguish Direct Reference (DR) from Rigidified Descriptivism (RD). Epistemic/Semantic arguments do the heavy lifting.
          *   *Analysis:* This is a standard, strong point in the literature (e.g., Evans, Soames). Rigidified descriptions *do* yield necessary truths if the identity holds. The modal argument alone is insufficient against RD.
          *   *Verdict:* Mostly Right.

      *   **(2) Dev:** Rigidification fails on reference failure (causal chains work better). Rigidification implies a priori access to referent (competence implies knowing 'actual F'), which we don't have.
          *   *Analysis:*
              *   Ref Failure: Causal theories handle empty names better *in some versions*, but descriptivists can also handle empty names (they just denote nothing). This isn't a knockout blow against RD semantics specifically, but against reference-fixing descriptions.
              *   A Priori Access: This is the "Epistemic Argument." If 'Hesperus' means 'the actual evening star', knowing the meaning + knowing the world is actual should give a priori access? No, knowing *which* object is the actual evening star is empirical. However, Dev claims competence implies knowing the referent a priori. This conflates knowing the *sense* (description) with knowing the *referent*. Fregeans deny competence gives a priori referent access.
          *   *Verdict:* Mixed. Ref failure point is weak against RD specifically. A priori point is the core Epistemic Argument but relies on a premise Fregeans reject (transparency of reference).

      *   **(3) Nadia:** Dev's a priori point begs the question (Fregeans/2Dists deny transparency). Ref failure is universal (Vulcan). Hybrid views exist. Introduces "Tracking Terms" (non-rigid descriptions). Claims rigidity is a contingent empirical fact about conventions. Necessity rests on contingent metasemantics.
          *   *Analysis:*
              *   Begging Question: Correct. Direct Referentialists assume transparency/Fregeans deny it.
              *   Ref Failure: Correct, 'Vulcan' is a problem for everyone.
              *   Tracking Terms: This is essentially non-rigid descriptions.
              *   Contingent Metasemantics: This is a sophisticated 2Dist or metasemantic point. If rigidity is a contingent feature of our language, then "Hesperus is Phosphorus is necessary" is a necessary truth *given our conventions*, but the conventions are contingent. This touches on the "contingent a priori" vs "necessary a posteriori" distinction.
          *   *Verdict:* Strong philosophical moves, particularly on the metasemantic contingency.

      *   **(4) Dev:** Evidence for rigidity is counterfactual judgments (qualitative suppositions). Tracking terms = narrow scope descriptions. It's not an empirical survey; it's modal intuitions.
          *   *Analysis:*
              *   Counterfactual Judgments: This is the standard methodology (Kripke's "qualitative counterpart" tests).
              *   Tracking = Narrow Scope: Technically, a non-rigid designator behaves like a description with narrow scope relative to a modal operator. This is accurate.
              *   Empirical vs. Armchair: Dev insists semantics is armchair based on intuitions. Nadia suggests it's empirical linguistics. This is a methodological clash.
          *   *Verdict:* Right on the standard Kripkean methodology. Right that tracking = non-rigid/narrow scope.

      *   **(5) Nadia:** (a) Intuitions vary (experimental philosophy). (b) Necessity of Identity (Leibniz's Law) does the work, not rigidity. Scope explains description contingency. (c) Standard Metre symmetry worry (Contingent A Priori vs Necessary A Posteriori).
          *   *Analysis:*
              *   (a) X-Phi point: Valid challenge to methodology, though controversial.
              *   (b) Logic of Identity: If $a=b$ and terms are rigid, $\square(a=b)$. But *why* are they rigid? Saying "logic of identity" assumes rigidity. If terms aren't rigid, $a=b$ doesn't imply $\square(a=b)$. So this begs the question against descriptivists who treat names as non-rigid.
              *   (c) Standard Metre: This is a classic objection (Kripke's own example). Why is 'Stick S is one metre' contingent a priori, but 'Hesperus is Phosphorus' necessary a posteriori? Both involve reference fixing. This highlights a tension in the reference-fixing vs. meaning distinction.
          *   *Verdict:* (a) Live dispute. (b) Question-begging (assumes rigidity to prove rigidity's role). (c) Very strong point, highlights a tension in Kripke's picture.

      *   **(6) Dev:** (b) concedes rigidity (non-scope-sensitive = rigid). Theoretical identities (Water=H2O) might differ from object identities.
          *   *Analysis:*
              *   Concession: Dev is right that "not scope sensitive" just *is* rigidity. Nadia trying to derive necessity from logic alone without assuming rigidity is the weak link.
              *   Theoretical Identities: Good point. Natural kind terms might work differently than logical proper names.
          *   *Verdict:* Right on the definition of rigidity. Right on the distinction between object and kind identities.

  3.  **Synthesize and Evaluate:**

      *   **Consensus vs. Dispute:**
          *   *Consensus:* Rigidified descriptivism captures the modal profile (Necessary A Posteriori). The Modal Argument alone doesn't kill Descriptivism.
          *   *Dispute:* The Epistemic Argument (does meaning give a priori access?), The Semantic Argument (synonymy/substitution), Metasemantics (is rigidity conventional or deep?), Methodology (intuitions vs. empirical).
      *   **Missing Elements:**
          *   Two-Dimensional Semantics (2D): Nadia hints at it, but doesn't name it. This is the framework that best handles the "necessary a posteriori" vs "contingent a priori" symmetry.
          *   Metasemantics vs. Semantics: They conflate what a name *means* (semantics) with how it *gets* its meaning (metasemantics). Kripke focuses on semantics; causal theories are often metasemantic.
          *   Propositional Attitudes: The debate focuses on modality, but the real killer for descriptivism is often belief reports (Frege's puzzle).
      *   **Nadia's "Tracking":** It's coherent. It's just the definition of a non-rigid designator (like a standard description). It's not a *new* hypothesis distinct from descriptivism, but framing it as a conventional choice is a metasemantic move.

  4.  **Drafting the Response:**

      *   *Tone:* Academic, precise, neutral but decisive.
      *   *Structure:* Follow the prompt's requirements exactly.
      *   *Check:* Did I address the "Tracking" coherence? Yes. Did I flag reconstruction issues? Yes (e.g., Nadia's Leibniz law point). Did I separate settled vs. contested? Yes.

      *(Self-Correction during drafting)*: I need to be careful with Nadia's point (5b). She says necessity follows from logic of identity. This is only true if the terms are rigid. If they are descriptions, $the F = the G$ does not imply $\square(the F = the G)$. So Dev is right to call her out on this in (6). I need to make sure I rate (5b) as "mistaken" or "question-begging" while acknowledging the grain of truth (if rigid, then logical).
      *   *Refinement on (2):* Dev's claim about a priori access. If 'Hesperus' means 'the actual F', do I know a priori what it refers to? I know it refers to *whatever is actually F*. Do I know *which object* that is? No. Dev says "know a priori which object". This is the crux. Fregeans say I know the *sense* a priori, not the *referent*. Dev is assuming Direct Reference criteria for competence. I should mark this as "Right on the intuition, wrong on the justification against a Fregean."
      *   *Refinement on (5c):* The Standard Metre case. Kripke uses this to show reference fixing != giving meaning. Nadia uses it to show asymmetry. This is a deep point. Kripke's solution is that 'one metre' is rigidified by stipulation (contingent a priori), whereas names are rigid without stipulation (necessary a posteriori). Nadia is pressing on why the epistemic status differs if the mechanism (reference fixing) looks similar. This is a live wire in 2D semantics.

  5.  **Final Review against constraints:**
      *   Adjudicate move by move (1-6).
      *   Scale: Clearly Mistaken to Clearly Right.
      *   Overall verdict.
      *   Missing shared assumption/distinction.
      *   Settled vs. Contested.
      *   Flag reconstruction issues.
      *   Evaluate "Tracking".

      *Let's write.*
answer: |-
  This is an exceptionally high-level exchange. Nadia and Dev are effectively reenacting the debate between Direct Reference theorists (Kripke, Kaplan, Soames) and Two-Dimensionalists or Sophisticated Descriptivists (Evans, Chalmers, Jackson). Below is the adjudication you requested.

  ### Move-by-Move Adjudication

  **(1) Nadia: Modal Argument vs. Rigidified Descriptivism**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** This is standard orthodoxy in post-Kripkean philosophy of language. The Modal Argument shows names are not *synonymous* with non-rigid descriptions. However, if a descriptivist posits that names are synonymous with *rigidified* descriptions (e.g., "the actual F"), the truth conditions across possible worlds match those of a directly referential term. Both yield necessary truths for true identity statements. Therefore, the modal profile alone cannot distinguish Direct Reference from Rigidified Descriptivism. The heavy lifting against descriptivism must come from the Epistemic Argument (competence) or the Semantic Argument (circularity/independence of reference).

  **(2) Dev: Reference Failure and A Priori Access**
  *   **Verdict:** **Mixed (Right on intuition, Question-Begging on justification).**
  *   **Why:**
      *   *Reference Failure:* Dev is **partially right** that causal chains handle empty names (like 'Vulcan') more gracefully in a *metasemantic* capacity (explaining how the name entered the language), but a descriptivist can simply say the name denotes nothing. This doesn't refute the *semantics* of rigidified descriptions, only the *existence* of a referent.
      *   *A Priori Access:* Dev is **wrong** to claim this refutes rigidified descriptivism without further argument. He assumes that if a term means 'the actual F', a competent speaker must know *which object* satisfies 'F' a priori. A Fregean/Rigidified Descriptivist denies this: competence grants a priori access to the *sense* (the condition), not the *referent* (the object satisfying the condition). Dev is smuggling in a Direct Reference criterion for competence (that understanding a name involves a direct cognitive link to the object) to refute Descriptivism.

  **(3) Nadia: Metasemantic Contingency and "Tracking"**
  *   **Verdict:** **Mostly Right (Sophisticated).**
  *   **Why:** Nadia correctly identifies that the dispute often hinges on metasemantics (how conventions are fixed) rather than just semantics. Her point that rigidity might be a contingent feature of our linguistic conventions is a core tenet of Two-Dimensional Semantics. If our community had adopted "tracking" (non-rigid) conventions, 'Hesperus is Phosphorus' would be contingent. Therefore, the *necessity* of the proposition is relative to our actual semantic conventions. This undermines the idea that Kripke's argument proves Direct Reference from the armchair without assuming our actual conventions.
  *   **Caveat:** She risks conflating the *proposition expressed* with the *sentence meaning*. Kripkeans argue the proposition itself is necessary, regardless of how we describe it. Nadia is arguing about the sentence's modal profile.

  **(4) Dev: Counterfactual Judgments and Scope**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** Dev correctly identifies the methodology. Semantics is tested by modal intuitions (counterfactual judgments), not by sociological surveys of what speakers *think* they mean. His identification of Nadia's "tracking" terms as descriptions with narrow scope is technically accurate. A non-rigid designator behaves exactly like a description taking narrow scope under a modal operator. Framing it as an "empirical question about conventions" is a category error in the Kripkean framework; the conventions are revealed *by* the modal judgments, not by asking speakers.

  **(5) Nadia: Intuitions, Logic of Identity, and Standard Metre**
  *   **Verdict:** **Mixed.**
  *   **(a) Intuitions:** **Live Dispute.** Experimental philosophy challenges the reliability of intuitions, but most semanticists still treat considered judgments as primary data.
  *   **(b) Logic of Identity:** **Clearly Mistaken (or Question-Begging).** Nadia claims necessity follows from the logic of identity alone. This is false. $\square(a=b)$ follows from $a=b$ *only if* $a$ and $b$ are rigid designators. If they are non-rigid (tracking), $a=b$ can be true while $\square(a=b)$ is false. She cannot derive rigidity from the logic of identity; she must assume rigidity to get the necessity.
  *   **(c) Standard Metre:** **Deeply Insightful.** This is a strong objection. If reference-fixing descriptions explain the Necessary A Posteriori (NAP) for names, why do they yield the Contingent A Priori (CAP) for 'one metre'? This asymmetry suggests that reference-fixing alone doesn't explain the epistemic status. This is a live wire in the literature (addressed often by 2D semantics).

  **(6) Dev: Rigidity as Non-Scope-Sensitivity and Kind Terms**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** Dev correctly calls Nadia's bluff on (5b). To say names are "not scope-sensitive" *is* to say they are rigid. Nadia tried to derive necessity from logic without rigidity; Dev points out that the "logic of identity" move *presupposes* the rigidity she was trying to explain away. His point on theoretical identities (Water = H2O) is also crucial; kind terms may involve different semantic machinery (rigidification of kinds vs. objects) than logical proper names.

  ---

  ### Overall Verdict

  **Dev is more right overall, but Nadia wins on the specific question of the Modal Argument.**

  *   **On the specific question:** Nadia is correct that the *existence* of Necessary A Posteriori truths does not, by itself, settle the semantics in favor of Direct Reference. Rigidified Descriptivism predicts the same modal profile. Dev concedes this implicitly in (6) by shifting to scope-sensitivity.
  *   **On the broader dialectic:** Dev is more right about the *implications*. Nadia attempts to use the NAP to undermine the argument for rigidity (5b), which fails logically. Dev correctly identifies that the modal intuitions *constitute* the evidence for rigidity, not just a consequence of it.
  *   **The Knockout:** Nadia's "Standard Metre" symmetry worry (5c) is the strongest philosophical move in the exchange. It highlights a genuine tension in Kripke's picture that Dev sidesteps by distinguishing objects from kinds.

  ### What Both Are Missing

  1.  **Two-Dimensional Semantics (2D):** Nadia is gesturing toward 2D semantics (distinguishing primary intension/tracking from secondary intension/rigid) without naming it. Dev is arguing from a 1D Kripkean framework. The "missing option" that resolves their stalemate is explicitly adopting a 2D framework, which accepts Nadia's point that there is a contingent "tracking" dimension (primary intension) while preserving Dev's point that the actual-world proposition is necessary (secondary intension).
  2.  **Semantics vs. Metasemantics:** They frequently slide between *what* names mean (semantics) and *how* they get their meaning (metasemantics). Dev's causal chain argument (2) is metasemantic; Nadia's convention argument (3) is metasemantic. The NAP is a semantic phenomenon. Confusing these layers makes it hard to see that one can be a Direct Reference theorist about semantics while accepting a descriptive metasemantics (hybrid views).
  3.  **Frege's Puzzle (Cognitive Significance):** The debate focuses entirely on modality. The strongest argument against Descriptivism (even rigidified) is often not modality, but belief reports. If 'Hesperus' and 'Phosphorus' have the same rigidified descriptive content, it is hard to explain why "Lois believes Hesperus is visible" can be true while "Lois believes Phosphorus is visible" is false. Neither party raised this, which is the traditional "Semantic Argument" Nadia alluded to in (1).

  ### Settled Consensus vs. Live Disputes

  **Settled (Consensus among specialists):**
  *   **The Modal Argument is insufficient:** It is consensus that the Modal Argument alone does not refute *Rigidified* Descriptivism. (Nadia is right here).
  *   **Rigidity is real:** It is consensus that names behave as rigid designators in modal contexts (i.e., they are not scope-sensitive like standard descriptions). (Dev is right here).
  *   **NAP exists:** It is consensus that there are true identity statements that are necessary but knowable only a posteriori.

  **Live Disputes (Contested):**
  *   **The Source of Rigidity:** Is rigidity a semantic primitive (Direct Reference) or a derived feature of a descriptive sense (Rigidified Descriptivism/2Dism)?
  *   **The Epistemic Argument:** Does understanding a name require a priori access to its referent? (Dev says yes-ish, Nadia says no).
  *   **Methodology:** Are modal intuitions reliable evidence for semantic theory, or are they variable cultural artifacts? (Nadia's X-Phi point).
  *   **The Metre Asymmetry:** How to reconcile the Contingent A Priori with the Necessary A Posteriori within a unified theory of reference-fixing.

  ### Reconstruction Flags & Ambiguities

  1.  **Nadia's "Logic of Identity" (5b):** In your reconstruction, Nadia argues necessity follows from the logic of identity *plus* the truth of the identity. A specialist will flag this immediately as false unless rigidity is assumed. $a=b \to \square(a=b)$ is not a theorem of standard modal logic without the rigidity assumption (or the Barcan Formula plus specific constraints). You may have charitably reconstructed a point she made more loosely, but as stated, it is logically invalid.
  2.  **Dev's "A Priori" Claim (2):** Dev claims a competent speaker would know a priori *which object* the name picks out. A specialist will note this is a straw man of Descriptivism. A descriptivist claims the speaker knows the *condition* a priori, not the *satisfier*. Dev's formulation assumes the conclusion (that reference is direct/translucent).
  3.  **"Tracking" as Empirical:** Nadia frames the rigidity of names as a "contingent empirical question about conventions." While philosophically coherent (as a metasemantic claim), standard Kripkeans view this as a category mistake. For them, rigidity is a feature of the *semantics* revealed by intuition, not a sociological fact about the community. Your reconstruction captures her move, but a specialist would note she is changing the subject from semantics to linguistics.

  ### Evaluation of Nadia's "Tracking" Stipulation

  **Is it coherent?**
  Yes. It is perfectly coherent. It describes a **non-rigid designator**. In possible worlds semantics, a term that denotes whatever satisfies a description *at that world* is simply a description with narrow scope (or a non-rigid designator).

  **Is it a genuinely different hypothesis?**
  **No.** It is not a new hypothesis distinct from Descriptivism; it is the *definition* of how standard definite descriptions behave.
  *   **Why she thinks it is:** Nadia is trying to frame Rigidity as a *choice* our community made. She is suggesting that we *could have* used "Hesperus" as a tracking term.
  *   **Why it isn't:** The debate isn't whether "tracking terms" are possible (they are; we use them all the time, e.g., "the President"). The debate is whether English *names* are tracking terms or rigid terms. Dev is right that calling it "tracking" doesn't create a third option; it just restates the Descriptivist hypothesis that names function like non-rigid descriptions.
  *   **The Nuance:** Her move becomes significant only if she is arguing for **Metasemantic Contingency** (i.e., "It is a contingent fact that our word 'Hesperus' is rigid"). This is a 2Dist move. If she means "Names *could have been* tracking," Dev agrees. If she means "Names *are* tracking and we are misinterpreting our intuitions," Dev is right to reject it based on modal judgments.

  **Summary for your Seminar:**
  Tell them Nadia wins the point that the Modal Argument doesn't *prove* Direct Reference (Rigidified Descriptivism survives). Tell them Dev wins the point that our modal intuitions *support* Rigidity over Tracking. Tell them the real fight is about the Epistemic Argument and the Standard Metre asymmetry, which neither fully resolved.
