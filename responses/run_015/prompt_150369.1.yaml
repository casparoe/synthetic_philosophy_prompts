  Two blokes, Jas and Phil, are halfway through their second pint in a pub near campus. Jas, an ML grad student, is getting properly animated.

  "Look, it's Wolpert, mate," Jas says, waving a crisp packet for emphasis. "The No-Free-Lunch theorem. It basically shuts down Hume. Shows why we need inductive bias."

  Phil, who's been reading too much Kant for his own good, takes a slow sip of lager. "Right. And how's that work again?"

  "Simple. You average the error rate over all possible target functions. Turns out, every algorithm performs exactly the same. No learner beats random guessing unless you assume something about the data."

  "Ah," Phil says, putting his glass down. "But to get that equality, you have to weight every function equally, don't you? You're summing over the function space with a uniform prior."

  "Yeah, standard proof condition. Otherwise the maths doesn't hold."

  Phil leans in, looking properly chuffed with himself. "So, to prove that we can't make assumptions about the world without justification, you've assumed the world is equally likely to be any mathematical function whatsoever? That's a massive claim about the structure of reality."

  "It's just a baseline, innit?"

  "It's a prior, Jas. You've smuggled in a substantive inductive assumption—the principle of indifference—to prove that inductive assumptions are necessary." Phil gestures at Jas's pint. "You haven't solved Hume's problem. You've just used the exact kind of unjustified induction he was on about to prove you can't use induction. You've inducted against yourself."

  Jas stares into his beer for a long moment. "So... NFL is just Hume in maths clothing?"

  "Worse," says Phil. "It's Hume with a uniform prior. And frankly, assuming all outcomes are equally likely is the most embarrassing thing you could have done."

  Jas sighs. "Don't say embarrassing. I'm already worried I'm not inducting well enough to spell it properly."

  "Cheers to that," says Phil. "But seriously, you've assumed symmetry to prove asymmetry. You're not off the hook, you're just uniformly screwed."
