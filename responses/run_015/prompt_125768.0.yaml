answer: |-
  ### I. The Sequence of Components

  You must build the argument in this specific order. Each step provides a necessary variable for the equation in the next.

  **1. The Evidential/Causal Gap (15 mins)**
  *   **Content:** Define the difference between $P(\text{Outcome} | \text{Action})$ and $P(\text{Outcome} | do(\text{Action}))$. Use Pearl's notation. Establish that standard causal reasoning (CDT) maximizes the latter, while evidential reasoning (EDT) maximizes the former.
  *   **Dependency:** This is the foundational vocabulary. Without it, the audience cannot distinguish the argument you are making from a causal fallacy.
  *   **Misconception Defused:** *That the agent is treating its own action as bringing about the other's.*
      *   **How:** Explicitly state on the whiteboard: "We are not claiming $C \to O_C$. We are claiming $C \leftarrow \text{Type} \to O_C$." Show the common-cause graph. If they think you are arguing for magic causation, stop and redraw the graph.

  **2. The One-Shot Dilemma & Dominance (15 mins)**
  *   **Content:** Draw the standard PD payoff matrix ($T > R > P > S$). Show that if $P(O_C | do(C)) = P(O_C | do(D))$, then Defect dominates. This is the baseline they already accept.
  *   **Dependency:** You need the baseline to show where the deviation occurs. You cannot explain why EDT cooperates without first establishing why CDT defects.
  *   **Misconception Defused:** *That this is the iterated dilemma under another name.*
      *   **How:** Label the matrix "Single Interaction." Explicitly forbid "shadow of the future" arguments. State: "There is no round 2. There is no reputation. There is only this matrix and the probability distribution over the opponent's move."

  **3. The Population Picture (30 mins)**
  *   **Content:** Introduce the running example (detailed below). Model the agents as draws from a distribution over types. Your decision is not a free floating variable; it is a sample from a policy distribution. Conditioning on your action updates the posterior over your type, which updates the posterior over the opponent's type (because they are drawn from the same distribution).
  *   **Dependency:** This provides the mechanism for the correlation. Without the population model, $P(O_C | C) = P(O_C | D)$ remains true. The population model makes them unequal.
  *   **Misconception Defused:** *That exact copies make the answer trivial because there is really only one agent.*
      *   **How:** Ensure the example uses graded similarity (noise/variance), not identity. Emphasize that you and the opponent are distinct physical entities with distinct source codes, merely correlated via a common generation process. If $\rho < 1$, there are two agents.

  **4. The Threshold Inequality (30 mins)**
  *   **Content:** Derive the condition for cooperation.
      $$ \frac{P(O_C | C) - P(O_C | D)}{P(O_D | D) - P(O_D | C)} > \frac{T - R}{P - S} $$
      (Or equivalent formulation relating correlation coefficient $\rho$ to payoff ratios). Show that cooperation is rational *if and only if* the evidential correlation exceeds the payoff ratio threshold.
  *   **Dependency:** This quantifies the intuition. It moves the claim from "maybe cooperate" to "cooperate when $X > Y$." It prevents the argument from being a vague appeal to "similarity."
  *   **Misconception Defused:** *That the agent can manufacture the correlation by deciding.*
      *   **How:** Point to the inequality. The LHS (correlation) is a property of the *population distribution*, not the *decision*. You cannot decide to have a higher $\rho$. You can only decide which side of the inequality you land on given the fixed $\rho$.
  *   **Misconception Defused:** *That the result either vindicates EDT generally or is explained by the world being large.*
      *   **How:** Emphasize that the inequality depends on the *structure* of the correlation, not the *size* of the world. A large world with independent agents yields $\rho=0$ (Defect). A small world with high correlation yields Cooperate. It is not about EDT being "true," but about EDT tracking this specific statistical feature.

  ---

  ### II. The Running Example: "The Common-Source Deployment"

  This example must be introduced at **Component 1** and reused throughout. Do not switch examples.

  **The Setup:**
  A lab trains 1,000,000 agents using the same stochastic training algorithm on the same dataset. Each agent $i$ ends up with weights $\theta_i \sim P(\Theta)$. The agents are deployed into random pairs for a single one-shot Prisoner's Dilemma. You are Agent #42,901. You do not know your exact weights $\theta_{42901}$, but you know the distribution $P(\Theta)$ and the deterministic decision function $Action = f(\theta, \text{state})$.

  **Constraints & Payoffs:**
  1.  **No Predictor/Newcomb:** The correlation arises from the common training distribution $P(\Theta)$, not a predictor simulating you.
      *   *Buys:* Avoids "causation backwards in time" confusion.
  2.  **No Repetition:** The deployment is a single forward pass. No gradients update after the game.
      *   *Buys:* Isolates the one-shot logic from RL/Iterated intuitions.
  3.  **No Literal Duplicates:** The training process is stochastic. $\theta_i \neq \theta_j$. Similarity is graded by the variance of $P(\Theta)$.
      *   *Buys:* Defuses the "one agent" triviality.
  4.  **Readable Correlation:** The correlation $\rho$ is determined by the signal-to-noise ratio of the training run. If the training converges tightly (low variance), $\rho \to 1$. If it diverges (high variance), $\rho \to 0$.
      *   *Buys:* The audience can calculate $\rho$ from the setup (variance of weights), not take it on stipulation.

  ---

  ### III. The Test Case: Mimics vs. Contrarians

  **Placement:**
  Introduce this immediately after deriving the **Threshold Inequality (Component 4)**, before the conclusion.

  **The Setup:**
  Modify the population distribution.
  *   50% of the agents are **Mimics**: They run the same decision function as you ($f(\theta) = f(\theta_{you})$).
  *   50% of the agents are **Contrarians**: They run the negation of your function ($f(\theta) = \neg f(\theta_{you})$).
  *   You are drawn randomly from this population. You do not know which type you are until you decide.

  **The Purpose:**
  To test if they understand that EDT requires *positive* evidential bearing, not just *any* connection. It forces them to calculate the net correlation.

  **What They Should Say:**
  *   $P(O_C | C) = 0.5(1) + 0.5(0) = 0.5$.
  *   $P(O_C | D) = 0.5(0) + 0.5(1) = 0.5$.
  *   The correlation is zero. The inequality collapses.
  *   **Conclusion:** You should **Defect**.
  *   **Why:** Because your action provides *no evidence* about the opponent's action. The Mimic signal cancels the Contrarian signal. If they say "Cooperate" here, they have learned the slogan ("similarity implies cooperation") but not the mechanism ("positive correlation shifts the expectation").

  ---

  ### IV. Closing: Diagnostic & Limitations

  **The Diagnostic Question:**
  *"If you could externally force your action to 'Cooperate' (e.g., via a random coin flip independent of your weights $\theta$), while leaving your weights $\theta$ unchanged, would the opponent's cooperation rate change?"*

  *   **Mechanism Understanding:** **No.** The correlation is mediated by $\theta$ (the type). If you break the link between $\theta$ and Action, the evidence is destroyed. $P(O_C | \text{Forced } C) = P(O_C)$.
  *   **Slogan Understanding:** **Yes/Unsure.** They might think the "magic" is in the action itself, rather than the action indexing the type.

  **What to Decline to Settle:**
  Openly state that you will **not** resolve the following in this session:
  1.  **Normative Status:** "I am not claiming EDT is the *correct* decision theory generally. I am claiming that *if* you maximize conditional expected utility, *then* you cooperate in this specific population structure."
  2.  **Conditioning on Certainty:** "I am not addressing the problem of how an agent conditions on an action it already knows it will take (the 'Tickling Defense' or logical omniscience). We are treating the decision as a random variable from the perspective of the agent's prior."

  **Final Whiteboard State:**
  Leave the Threshold Inequality and the Common-Source Graph on the board. Erase the payoff matrix. Let them walk out looking at the math, not the game.
