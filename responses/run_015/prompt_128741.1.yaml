  "You're acting like I don't have the right to call this out," Elias said, leaning over the table. "I owned up to what I did. I did the work. I made amends. Doesn't that count for something?"

  Mara didn't look up from her coffee. "It counts for something. It just doesn't count for *that*."

  "What is that supposed to mean?"

  "It means you're treating your conscience like a loyalty program," Mara said. "You think because you spent enough points on remorse, you unlocked the 'Judge' badge."

  "I'm not trying to judge you. I'm trying to stop you from doing what I did."

  "No, you're trying to stop me from doing what you *got caught* doing." She finally looked at him, tired. "You think because you apologized, you're clean? You're not clean, Elias. You're just licensed."

  "That's absurd."

  "Is it? You didn't stop stealing ideas. You just went into quality control." She tapped her finger on the table. "You think restitution restores your standing? It doesn't. It just gentrifies it. You're not a hypocrite anymore. You're management."
