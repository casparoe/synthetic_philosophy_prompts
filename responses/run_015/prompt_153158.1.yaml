answer: |-
  This is a remarkably sharp observation, and you are correct: standard economic discounting (pure time preference) and standard risk assessment do not fully capture this phenomenon. In the literature, there is **no single, canonical term** that exclusively names this specific heuristic. However, your observation cuts across intergenerational ethics, institutional economics, and moral psychology.

  Here is the breakdown of where this concept lives, the closest existing terminology, and a precise definition to help you label it in your own work.

  ### 1. Closest Existing Concepts

  While there isn't one noun phrase for this, three distinct fields approach it from different angles:

  **A. Economics/Political Science: "The Credible Commitment Problem"**
  In institutional economics (North, Weingast, Rodrik), this is usually framed as *time inconsistency*. A government today promises to maintain a nuclear repository for 10,000 years. But a future government has the *sovereign power* to renege.
  *   **Why it's not quite it:** Standard credible commitment theory focuses on *incentives* to renege (e.g., a future government needs the land for housing). Your observation is deeper: people discount the future even if the *incentives* align, simply because the *entity* itself is mutable.

  **B. Philosophy: "Diachronic Identity of Collective Agents"**
  In metaphysics and ethics (referencing work by Derek Parfit, Philip Pettit, or Christian List), there is a debate about whether a corporation or state persists over time as the same "moral agent."
  *   **The Link:** If a university endowment has a locked charter, it is treated as having high *diachronic identity* (it is the "same" entity in 200 years). A democratic government has low diachronic identity (it is a succession of different mandates). People intuitively feel moral obligations dissolve if the *agent* holding the obligation ceases to be "itself."

  **C. Nuclear Policy Literature: "Active vs. Passive Institutional Control"**
  In nuclear waste management (e.g., writings by Karin Shrader-Frechette or the Blue Ribbon Commission), there is a distinction between relying on *passive safety* (geology, which doesn't change) vs. *active institutional control* (guards, monitoring, bureaucracy).
  *   **The Link:** Experts often argue that "institutions are fragile." Your observation suggests the public perceives this fragility not just as risk of failure, but as a **break in moral transmission.**

  ### 2. Proposed Terminology

  Since no single term dominates, if you are writing or debating this, the most precise label would be **"Custodial Continuity Bias"** or **"Institutional Perpetuity Heuristic."**

  However, the most philosophically rigorous description is **"Diachronic Fiduciary Discounting."**
  *   **Diachronic:** Across time.
  *   **Fiduciary:** Relating to the trust/obligation holder.
  *   **Discounting:** The reduction in value assigned.

  ### 3. Defining the Edges: How it Differs from Distrust

  You asked specifically to distinguish this from plain institutional distrust. This is the critical distinction.

  **Institutional Distrust (Competence/Integrity)**
  *   **Logic:** "I don't believe the Department of Energy *can* or *will* do the job."
  *   **Focus:** Performance metrics, corruption, competence, budget stability.
  *   **Remedy:** Better oversight, more funding, stricter penalties.
  *   **Time Horizon:** Linear. If you fix the corruption, the trust returns.

  **Diachronic Fiduciary Discounting (Ontological Continuity)**
  *   **Logic:** "I don't believe the Department of Energy *in 2150* is the same entity bound by the promises of the Department of Energy *in 2024*."
  *   **Focus:** The metaphysical persistence of the obligation-holder.
  *   **Remedy:** Locking mechanisms (charters, trusts, physical barriers) that bind the *successor* entity regardless of will.
  *   **Time Horizon:** Binary. It works until the chain is breakable, then value drops to near zero.

  **The Test:**
  If you propose a "Corruption-Proof Government Agency" with infinite funding and perfect oversight, **Institutional Distrust** disappears. However, **Custodial Continuity Bias** remains if that agency still has the *legal power to dissolve itself* or *rewrite its mandate*. The discount persists because the *chain of obligation* is legally severable, not because the actors are corrupt.

  ### 4. Precise Definition

  If you need to define this phenomenon formally, I suggest this formulation:

  > **Custodial Continuity Bias:** A cognitive and ethical heuristic wherein the present value of a future benefit is discounted not based on temporal distance or probabilistic risk, but on the **perceived mutability of the intermediary institution.**
  >
  > It posits that moral obligations to future generations are perceived as binding only when transmitted through a mechanism with **locked diachronic identity** (e.g., a trust, a physical law, a rigid charter). When the transmission mechanism relies on **mutable agency** (e.g., democratic legislation, flexible mission statements), the obligation is treated as extinguishable, regardless of the stated intent or current stability of the institution.

  ### 5. Why This Matters (The "So What?")

  This explains why climate debates stall.
  *   **Carbon Taxes:** Rely on mutable governments (high discount).
  *   **Green Bonds/Endowments:** Rely on financial contracts/trusts (lower discount).
  *   **Geoengineering/Physical Barriers:** Rely on physics (lowest discount).

  People aren't necessarily saying "Future people don't matter." They are saying, "The *vehicle* we are using to send value to them is leaky."

  In the philosophy of **Longtermism** (Greaves, MacAskill), this is a critical blind spot. They often argue for "institutional stability" to protect the future. Your observation suggests that *stability* isn't enough; the institution requires **constitutional lock-in** to overcome this psychological discount rate.

  ### Summary
  You haven't missed a common term; you've identified a gap between **economic discounting** (time/risk) and **moral transmission** (agency/identity). The closest academic framing is the **Diachronic Identity of Collective Agents**, but for policy debates, **"Custodial Continuity"** is the precise handle you're looking for. It is distinct from distrust because it targets the *persistence of the promise-maker*, not the *honesty of the current maker*.
