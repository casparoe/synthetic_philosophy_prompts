  2.  **Deconstruct the Philosophical Positions:**
      *   **AI Side:** Behaviorist/Functionalist. Focus on input-output performance. Anti-anthropomorphic regarding internal states (Searle's Chinese Room vibe, but institutionalized). This aligns with a Turing-style approach: if it walks like a duck, treat it as a duck for utility, but don't claim it *is* a duck internally.
