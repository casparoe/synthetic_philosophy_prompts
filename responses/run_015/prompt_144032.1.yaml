      *   **The "Inversion":** It's a mix. The Bio side uses the Darwinian inversion (purpose without mind). The AI side uses the Turing inversion (intelligence without mind). They converge on the same commitment: competence is observable; understanding is metaphysical/unnecessary.
      *   **If Comprehension = Competence:** The AI ban on "understanding" becomes obsolete. The Bio language might need to clarify that "engineering" is metaphorical, not literal design.

