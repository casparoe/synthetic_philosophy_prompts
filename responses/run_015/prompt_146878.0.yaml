answer: |-
  ### Correspondence Table: The Teleosemantic Heart-Brain Analogy

  | Teleosemantic Component | Biological Analog (The Heart) | Cognitive Analog (The Belief/Representation) |
  | :--- | :--- | :--- |
  | **The Vehicle** | Cardiac tissue / The Heart organ | Neural substrate / Cognitive mechanism (e.g., FFA) |
  | **The Designer** | Natural Selection (Phylogenetic history) | Natural Selection (Phylogenetic history) |
  | **Proper Function** | Pumping blood (contributing to survival) | Indicating state of affairs $X$ (contributing to guidance) |
  | **The Norm** | Physiological correctness (circulatory efficiency) | Truth condition / Veridicality |
  | **Malfunction** | Heart failure / Arrhythmia | Misrepresentation (False belief) |
  | **Determinacy Source** | Selection history fixes *one* primary function | Selection history fixes *one* specific content |

  ---

  ### Audit of Disanalogies

  To determine whether the naturalization project survives, we must distinguish between superficial disanalogies and those that strike at the logical core of teleosemantics.

  **1. Disanalogies That Do Not Threaten Naturalization**
  *   **Material Composition:** That hearts are muscular pumps and brains are electrochemical networks is irrelevant. Teleosemantics is functionalist; the substrate matters only insofar as it carries a history of selection.
  *   **Causal Mechanism:** That hearts push fluid while brains encode information does not break the analogy. Both are causal mechanisms selected for their effects. As long as the *effect* explains the *presence* of the trait, the logic holds.
  *   **Conscious Awareness:** The heart operates unconsciously, while some beliefs are conscious. Teleosemantics aims to naturalize intentionality, not qualia, so this gap is permissible.

  **2. Disanalogies That Threaten Naturalization (The Critical Fault Lines)**
  *   **Functional Rigidity vs. Plasticity:**
      *   *The Analogy:* A heart's proper function is invariant across contexts. A human heart in a pianist and a blacksmith has the same proper function (pumping blood).
      *   *The Reality:* Neural substrates are context-sensitive. The Fusiform Face Area (FFA) has a phylogenetic history of face detection, but in bird experts, it is recruited for bird detection.
      *   *The Threat:* If the *same* physical vehicle can carry *different* contents based on ontogenetic history (learning/expertise) rather than phylogenetic history, the "Designer" column in the table fractures. Which history fixes the norm? If phylogeny fixes it, the birdwatcher's belief "That is a warbler" is systematically misrepresenting (because the mechanism is "for" faces). If ontogeny fixes it, selection history is no longer the sole naturalizer of content.
  *   **Singular vs. Multiplex Function:**
      *   *The Analogy:* Organs are typically modeled as having a singular proper function (the kidney filters blood). This licenses the claim that content is *determinate*.
      *   *The Reality:* Neural reuse implies one substrate supports multiple functions simultaneously or sequentially.
      *   *The Threat:* This smuggles in **determinacy** where there is none. The heart analogy assumes a one-to-one mapping between mechanism and function. Cognition exhibits a one-to-many mapping. If the mechanism is "for" faces, birds, and cars (in experts), teleosemantics loses its ability to rule out indeterminacy (the "Quinean" problem it was meant to solve).
  *   **Timescale of Norm Creation:**
      *   *The Analogy:* Evolutionary design is slow; norms are ancient and stable.
      *   *The Reality:* Neural recruitment happens within a lifetime.
      *   *The Threat:* If norms can be established within a lifetime via learning, the appeal to *evolutionary* selection history becomes otiose for many mental states. The analogy hides the need for a theory of *ontogenetic* normativity.

  ### Does the Analogy Smuggle Determinacy?
  **Yes.** The heart analogy works only because we intuitively accept that hearts do not change their functional identity based on use. By mapping beliefs onto hearts, teleosemantics implicitly imports the assumption that cognitive mechanisms have **context-invariant proper functions.** Neural reuse demonstrates that cognitive mechanisms are **context-dependent.** Therefore, the analogy supports the conclusion (determinate content) only by ignoring the empirical premise (plasticity) that undermines it.

  ### A Better Analogy: The Immune System
  A more robust biological analogy for naturalizing content in a plastic brain is the **Adaptive Immune System**, not the heart.

  *   **Why it fits:** The immune system has a phylogenetic proper function (protect the organism from pathogens). However, the *specific content* of an immune response (e.g., "This specific protein sequence is foreign") is fixed by ontogenetic interaction (clonal selection) during the organism's life.
  *   **The Mapping:**
      *   *Phylogeny:* Provides the mechanism for learning (V(D)J recombination), analogous to the brain's capacity for plasticity.
      *   *Ontogeny:* Fixes the specific target (antigen), analogous to the birdwatcher learning to distinguish warblers.
      *   *Norm:* A false positive (autoimmunity) is a malfunction, naturalized by the system's design to minimize error while maximizing detection.
  *   **Advantage:** This model naturalizes content without requiring the content to be fixed solely by ancient evolutionary history. It allows for **derived proper functions** created via selection processes *within* the lifetime.

  ### Salvaging Teleosemantics: Required Modifications
  If the heart analogy collapses, teleosemantics does not necessarily fail, but it must abandon the "static organ" model. To survive neural reuse, the theory requires:

  1.  **Layered Proper Functions:** Distinguish between the **Capacity Function** (evolved ability to categorize visual stimuli, fixed by phylogeny) and the **Specific Content Function** (categorizing *birds*, fixed by ontogenetic selection/learning).
  2.  **Ontogenetic Selection:** Acknowledge that learning is a selection process (neural Darwinism). If neural groups compete for activation and the "bird-detecting" neurons are selected for reinforcement, they acquire a *derived proper function* that carries normative weight.
  3.  **Consumer-Relative Content:** Shift emphasis from the *producer* (the FFA) to the *consumer* (downstream motor or reasoning systems). If downstream systems treat the FFA signal as "bird" during expertise, the content is fixed by the consumer's current functional role, not just the producer's ancestry.

  Without these modifications, teleosemantics relies on the heart analogy to do work it cannot do: grounding specific, determinate content in a system designed for flexibility.

  Verdict: The analogy collapses as a static mapping but survives only with substantial modifications incorporating ontogenetic selection.
