answer: |-
  # The Quantum Expectation Decision Tree

  **Root Commitment:** "I accept no-collapse QM, branching, and the Born rule as the right third-personal probability rule."

  From this shared starting point, the tree sorts your first-personal stance on survival. Answer the nodes sequentially.

  ### Node 1: The Nature of Expectation
  **Question:** When you ask "What will I experience after the trigger fires?", are you asking a **fact** about which future observer-moment is *you*, or is there **no fact** of the matter about identity across branches?
  *   **Yes, there is a fact:** Go to **Node 2**.
  *   **No, there is no fact:** Go to **Node 6**.

  ### Node 2: The Inverted Case (Measure vs. Existence)
  **Case:** The apparatus is wired so the *low*-amplitude branch (.01) is where you live, and the *high*-amplitude branch (.99) is where you die.
  **Question:** Is the survivor in the .01 branch *you*, simply because they exist, or does the fact that they are "low amplitude" mean they are not the continuation of your consciousness?
  *   **They are not me (Measure matters):** **Leaf 1: Measure-Weighted Realism.**
      *   *Awkward Commitment:* You must expect to die with 99% probability, even though a copy of you lives in another branch.
  *   **They are me (Existence suffices):** Go to **Node 3**.

  ### Node 3: The Graded Gun (Psychological Continuity)
  **Case:** The apparatus kills you (.99) or leaves you alive with dense anterograde amnesia and no memory of volunteering (.01). Only the amnesiac branch has experience.
  **Question:** Is the amnesiac in the hospital *you*?
  *   **No (Psychological continuity required):** **Leaf 2: Psychological Threshold.**
      *   *Awkward Commitment:* You expect death in the Graded Gun, but life in the Standard Gun, despite the physical survival being identical.
  *   **Yes (Bare existence suffices):** Go to **Node 4**.

  ### Node 4: The Thousandth Round (Degradation)
  **Case:** You have survived 1,000 rounds. The branch where you are alive has a squared amplitude of roughly $2^{-1000}$.
  **Question:** Is that extremely low-amplitude survivor still *you* in the same sense as the survivor of Round 1?
  *   **No (Survival degrades):** **Leaf 3: Degradation Reading.**
      *   *Awkward Commitment:* Quantum immortality works for idealised boxes, but real death is gradual and eventually wins.
  *   **Yes (Survival is binary):** Go to **Node 5**.

  ### Node 5: The Friend Outside (Evidence)
  **Case:** A friend outside the box sees you die in 99% of branches. You are inside, alive.
  **Question:** Does your survival provide you with **evidence for Many Worlds** that you could explain to your friend?
  *   **Yes:** **Leaf 4: Strong Quantum Immortality.**
      *   *Awkward Commitment:* You can prove MWI to yourself with certainty, but never to anyone else.
  *   **No:** **Leaf 5: Deflationary Reading.**
      *   *Awkward Commitment:* You survive, but the experiment teaches you nothing new (selection effect).

  ### Node 6: Anti-Realist Policy (Pragmatics vs. Void)
  **Question:** Since there is no fact about which future is "yours", should you still act *as if* you care about high-amplitude branches when placing bets?
  *   **Yes:** **Leaf 6: Pragmatic Anticipation.**
      *   *Awkward Commitment:* You care about amplitude for decision-making, but admit it doesn't track "which one is you."
  *   **No:** Go to **Node 7**.

  ### Node 7: The Quantum Lottery (Counting vs. Undefined)
  **Case:** An ordinary quantum lottery where the .01 branch is you winning a huge sum.
  **Question:** Should you anticipate winning because there is a branch where you win, or is anticipation simply broken?
  *   **Anticipate winning (Count branches):** **Leaf 7: Branch-Counting.**
      *   *Awkward Commitment:* You should bank on the jackpot because most branches where you exist win (contradicting the Born rule).
  *   **Anticipation broken:** **Leaf 8: Undefined Probability.**
      *   *Awkward Commitment:* First-personal probability is meaningless under branching; you have no rational basis to prefer the safe branch.

  ***

  ## Empty Regions of the Logical Space

  The tree above maps the occupied territory. The following four positions are logically consistent with the nodes but appear unoccupied in the literature.

  1.  **The Measure-Weighted Evidentialist (Node 2 "No" + Node 5 "Yes")**
      *   *Position:* Measure determines identity (so you expect death), but surviving the low-measure branch still proves MWI.
      *   *Status:* **Incoherent.** If measure determines which future is "you," the low-measure survivor is *not* you. Their experience cannot serve as *your* evidence.
  2.  **The No-Fact Evidentialist (Node 1 "No" + Node 5 "Yes")**
      *   *Position:* There is no fact about which branch is you, but surviving still gives you evidence for MWI.
      *   *Status:* **Incoherent.** If there is no fact that the survivor is you, their survival is not a continuation of your perspective. You cannot update on an experience that isn't yours.
  3.  **The Branch-Counting Pragmatist (Node 6 "Yes" + Node 7 "Yes")**
      *   *Position:* Admit there is no fact of identity, but bet on the quantum lottery because there are more winning branches.
      *   *Status:* **Unattractive.** This requires accepting the Born rule as the "third-personal probability rule" (per the Root Commitment) while ignoring it for first-personal betting. It creates a schism between rational action and rational belief that few are willing to maintain.
  4.  **The Psychological Immortalist (Node 3 "No" + Node 4 "Yes")**
      *   *Position:* Psychological continuity is required for survival (rejecting the amnesiac), but you still survive 1,000 rounds of quantum suicide.
      *   *Status:* **Unexplored/Tension.** If psychological continuity is the threshold, 1,000 rounds of near-death trauma should arguably break it. Holding both requires arguing that "survival" preserves psychology perfectly in idealised cases but not in amnesia cases, a distinction nobody has bothered to defend.

  ## Notes on Construction

  *   **The Top Split:** Node 1 forces the distinction between "Expectation as tracking identity" vs. "Expectation as policy" vs. "Expectation as nonsense" immediately, preventing the circular arguments about whether probability "applies."
  *   **The Friend Node:** Node 5 separates the *metaphysics* of survival (Nodes 2–4) from the *epistemology* of survival. This clarifies why one can believe in Quantum Immortality (Leaf 4) without believing it proves anything to the outside world (Leaf 5).
  *   **Jargon Avoidance:** Nodes refer to "amplitude" only in the context of the specific cases provided in the prompt (Inverted Case, Thousandth Round), avoiding abstract debates about the definition of "measure."
  *   **Collision Flag:** Leaf 1 (Measure-Weighted) and Leaf 8 (Undefined) often look similar in practice (both advise expecting death), but they are distinct in the tree: Leaf 1 claims there *is* a fact (you die), while Leaf 8 claims there is *no fact* (expectation is void). If a user cannot distinguish these, they are in a collision zone where metaphysics and epistemology collapse.
