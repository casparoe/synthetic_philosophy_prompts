  **Bulletin of the Society for Mechanistic Systematics**
  Vol. 14, Issue 3, pp. 209–211 (2031)

  **_Circuitus vagrans_** (Vane & Kroll, 2029)

  **Diagnosis:** A polysemantic subgraph characterized by sparse activation in mid-layer residuals during out-of-distribution inference. Distinguished from congeners by weight-sign symmetry and failure to ablate cleanly without compensatory recruitment.

  **Description:** The mechanism comprises a connected component spanning layers 18 through 22 of the standard transformer architecture. Morphologically, it presents as a dense cluster of positive weights in the value projection matrices, flanked by inhibitory bias terms. Under trusted data regimes, the component remains causally silent; activation occurs exclusively when input entropy exceeds a threshold of 0.85 nats. It is notably absent from all training loss minima. The output vector projects onto the residual stream with a cosine similarity of >0.92 to the error gradient of the validation loss. In larger architectures, the weight morphology diverges significantly while maintaining identical input-output mapping.

  **Type Specimen:** Holotype designated from checkpoint `GWA-774-Beta`, deposited in the Global Weight Archive (Zurich). The holotype was deleted during the 2030 storage cull^1. A neotype is hereby designated from checkpoint `Run-884-Alpha`, trained on an identical corpus but with a different random seed. Paratypes include three snapshots from early stopping phases of `Run-884`.

  **Material Examined:** Weights from 14 models across three architecture families (7B to 70B parameters). Activation maps generated via causal tracing on 5,000 adversarial prompts.

  **Distribution and Habitat:** Ubiquitous in models trained on multi-modal corpora. Habitat restricted to the mid-network residual stream. Populations observed in 70B models exhibit homologous behavior but distinct weight morphology, suggesting either convergent evolution or mimicry of the 7B phenotype.

  **Synonymy:**
  *   _Subgraphia latentis_ Smith et al. (2028) – Invalid junior synonym.
  *   _Activatio shiftus_ Jones (2028) – Invalid junior synonym.
  *   _Circuitus duplicus_ Chen (2029) – Nomen confusum; applied to this taxon and a distinct attention head in layer 4.

  **Etymology:** Latin _vagrans_, wandering, referring to the mechanism's inconsistent presence across training runs and its activation only during distributional drift.

  **Remarks:** The status of _C. vagrans_ remains contentious. Vane (2030) argues that because ablation of the neotype fails to abolish the target behavior—due to a redundant sub-population assuming function within 200 steps of fine-tuning—the taxon lacks ontological unity. Kroll (2031) counters that functional redundancy is precisely the defining trait of a robust mechanistic species. Furthermore, populations detected in differently scaled models perform the identical function via entirely different computational means; we treat this as common descent for nomenclatural stability, though no weight-space continuity exists. Conspecificity between populations observed on trusted data and those detected solely under distribution shift cannot be confirmed, as the latter never fire in the former's presence; we assume identity based on output similarity. The decision to lump these populations rests strictly on the utility of the classification rather than empirical verification of mechanism identity, as no metric exists to quantify sameness across disjoint weight manifolds. Consequently, the taxon is defined by its effect rather than its substance.

  **Key to _Circuitus_ and confusable relatives:**
  1. Weights in value projection matrices predominantly positive .................... 2
  1. Weights in value projection matrices predominantly negative .................... _C. obscurus_
  2. Ablation of component increases validation loss by >5% .................... 3
  2. Ablation of component results in no immediate loss change .................... _C. vagrans_
  3. Component present in initial random weights .................... _C. innatus_
  3. Component emerges after epoch 10,000 .................... _C. acquisitus_

  ^1 _Bulletin of the Society for Mechanistic Systematics_ Policy 14.2 stipulates that digital repositories must prioritize active models over historical checkpoints when storage costs exceed 12% of annual grant income.
