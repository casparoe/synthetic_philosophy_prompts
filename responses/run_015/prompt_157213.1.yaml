answer: |-
  **Project Title:** The Stability of the Suffering Threshold: A Structural Analysis of Lexical Negative Utilitarianism

  **1. The Question and Its Significance**
  Many people share the intuition that there exists a level of suffering so severe that preventing it takes absolute priority over any amount of lesser pleasure or minor pain avoidance. This is the lexical-threshold view: the claim that once pain crosses a specific intensity, it outweighs, in a strict 'no trade-off' sense, any aggregate of goods below that line. This is not merely an abstract puzzle; it is the ethical engine behind the claim that preventing extreme suffering, such as torture or severe deprivation, cannot be subjected to ordinary cost-benefit reasoning. If this view is correct, policy decisions regarding human rights or animal welfare must treat severe suffering as a categorical veto rather than a variable in a calculation. The precise question this project asks is whether the lexical threshold can be coherently defined without collapsing into arbitrariness or contradiction. Specifically, can we locate a threshold that respects the intuition that extreme pain is uniquely bad, without relying on a measurement scale that renders the threshold's location inexplicable?

  **2. The Dialectical Situation**
  Current defenses of this view face a genuine fork, not a pseudo-problem. On one path, the view presupposes a single cardinal scale on which all pains and pleasures are measured. Here, the threshold is simply a point on a ruler. The difficulty is that if pain and pleasure are measured on the same continuous scale, there is no independent reason to stop the trade-offs at one specific point rather than another. The threshold becomes a brute stipulation, lacking the explanatory power its proponents desire. On the second path, proponents argue that intense suffering is qualitatively different from mild pleasure, placing them on incommensurable scales. While this avoids the arbitrariness of the single scale, it inherits severe logical difficulties. If a pain just below the threshold is comparable to mild pleasures, but a pain just above it is not, then two experiences that differ arbitrarily little in their intrinsic character differ infinitely in their normative standing. This creates a 'cliff-edge' problem where the smallest improvement in intensity triggers a discontinuous leap in moral importance. Neither route currently offers a stable foundation, and the view remains vulnerable to the charge that it is either mathematically ad hoc or metaphysically mysterious.

  **3. Method and Work Plan**
  Over the six-month leave, I will construct and test a formal and philosophical model of the threshold to determine if it can be stabilized. In the first two months, I will focus on the formal architecture. I will draft the axioms required for a two-tier ordering system that allows for aggregation below the threshold but forbids it across the threshold. This involves testing why obvious axiomatisations fail, particularly regarding transitivity. I will determine if a coherent mathematical structure exists that permits a lexical break without violating basic rules of rational choice. This formal work is necessary to ensure the problem is not merely a linguistic confusion but a structural one.

  During the third and fourth months, I will subject these models to the three specific wrinkles identified in the literature. First, I will test the 'crowding problem' by constructing cases where a sufficiently large number of sub-threshold pains might aggregate to outrank a single supra-threshold pain, checking if the view must retreat to an aggregate threshold or concede it is merely a weighted sum. Second, I will analyze the extensional-equivalence worry by comparing the lexical model against a weighted-sum asymmetric view over finite populations to see if they yield different recommendations. If they do not, the dispute is merely notational. Third, I will examine the scale-pluralism problem by applying the threshold to different metrics of suffering, such as momentary intensity versus duration-discounted intensity, to see if the threshold shifts unacceptably depending on how suffering is measured. In the final two months, I will synthesize these findings into a philosophical argument. The technical construction serves to limit the available moves, but the philosophical argument must carry the weight of explaining why the remaining options are acceptable or unacceptable. This period will be dedicated to writing and refining the manuscript, ensuring the technical results are translated into accessible arguments.

  **4. Possible Conclusions and Failure Conditions**
  There are three primary outcomes. The first is that the lexical-threshold view is structurally unstable and must be abandoned for a different account of suffering's priority. The second is that the view is coherent but extensionally equivalent to a heavily weighted asymmetric utilitarianism; in this case, the project concludes that the dispute is about representation rather than action, which would require re-evaluating the claim that this view offers a radically different moral outlook. The third is that the problem dissolves into a question about the metaphysics of phenomenal magnitude that cannot be settled within the scope of ethical theory. The project would count as a failure only if I cannot distinguish between the lexical view and the weighted-sum view, or if the formal work expands to the point where the philosophical implications remain unclear. If the honest answer is that the lexical view is only notationally distinct, that is a successful negative result, provided it is demonstrated rigorously. However, if the inquiry stalls because settling the threshold requires a theory of consciousness I cannot provide in six months, I will classify this as a boundary condition rather than a solution.

  **5. Scope Assessment**
  Given the risk that formal modeling can expand indefinitely, I have a clear contingency plan. If the axiomatic work threatens to overrun the timeline, I will cut the deep technical proofs regarding transitivity and focus instead on the case-based arguments surrounding the crowding and scale-pluralism problems. The minimum publishable deliverable is a robust argument demonstrating the extensional equivalence between the lexical-threshold view and high-weight asymmetric utilitarianism. Even if the full formal model is not completed, showing that the two views recommend the same actions in all finite cases would be a significant contribution, as it clarifies that the choice between them is not a choice about outcomes but about moral description. This ensures that even in a constrained timeline, the project yields a determinate answer to the central question of whether the lexical threshold changes what we ought to do.
