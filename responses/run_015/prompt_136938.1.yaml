answer: |-
  # Game: The Allocation Protocol

  **Time:** 75 mins
  **Players:** 14 (Grad students)
  **Props:** 14 Envelopes, 50 Poker Chips (or paper "Merit Tokens"), 14 Decision Slips, 14 Outcome Cards.

  ## The Setup (0:00–0:10)
  Tell them they are mid-level allocators for a humanitarian aid fund. Resources are scarce. Their job is to execute **Protocol Alpha**.

  **The Choice:**
  Hand out the Decision Slip. It offers three options:
  1.  Prioritize Urgency
  2.  Prioritize Efficiency
  3.  Prioritize Equity

  **The Trick:**
  Verbally instruct them that *ethical compliance* requires everyone to choose **Option 2 (Efficiency)**. Make it sound like the only rational, auditable choice. "If you deviate, your audit fails." Everyone marks Option 2. Collect the slips. Display them on the projector. They are all identical.

  **The Stakes:**
  Explain the Merit Tokens. At the end of class, tokens determine their "Tenure Status."
  *   Top 3: Tenured (A)
  *   Middle 8: Contract (B)
  *   Bottom 3: Dismissed (C)
  *   *Note: You will actually grade them normally, but they need to believe the tokens matter for the simulation to bite.*

  ## The Noise (0:10–0:20)
  Hand out the Envelopes. Inside is an **Outcome Card**. They cannot look yet.

  **Card Mechanics:**
  *   **7 Cards (Green):** "System Sync." Your allocation reached clients. 100% success rate.
  *   **7 Cards (Red):** "System Glitch." A backend error diverted funds. 0% success rate. Clients suffered.

  **Crucial Rule:** Emphasize that the Card is *system noise*. It is not related to their decision. It is random variance in the bureaucracy.

  ## The Twist: The Peer Review (0:20–0:40)
  Pair them up (7 pairs).

  **Step 1:** Partner A shows their Card to Partner B. Partner B keeps their own envelope sealed.
  **Step 2:** Partner B must write a **Performance Review** for A.
  *   If A has Green: B must argue A deserves High Merit.
  *   If A has Red: B must argue A deserves Low Merit.
  *   *Constraint:* B cannot mention luck. B must write as if the outcome reflects A's competence.
  *   *Payment:* B assigns 5 tokens to A (High Merit) or 0 tokens (Low Merit) from the bank.

  **Step 3:** Swap. Partner B shows Card to Partner A. Partner A writes B's Review and assigns tokens. Partner A still has not seen their own card.

  **Why this hurts:** They are codifying the rule "Outcome = Merit" before knowing if they will be victimized by it. They are building the gallows they might hang on.

  ## The Reveal & Tribunal (0:40–0:60)
  Bring everyone back to the circle.

  1.  **Public Reveal:** Go around the circle. Everyone reads their Outcome Card aloud (Green/Red).
  2.  **Public Judgment:** Now that everyone knows who "failed" (Red) and who "succeeded" (Green), do a public token adjustment.
      *   Ask the room: "Based on these results, who deserves extra tokens?"
      *   Usually, the Greens get applauded. The Reds get silence.
      *   Allow the group to tax the Reds (take 2 tokens away) and bonus the Greens (add 2 tokens).
  3.  **The Mirror:** Ask everyone to open the Performance Review their partner wrote for them.
      *   If you have a Red card, read the review your partner wrote *before* they knew their own fate.
      *   Ask: "Partner, you condemned them for this glitch. You now hold your own card. What does it say?"

  ## The Debrief (0:60–0:75)
  *Do not mention "Moral Luck" until this section.*

  **1. The Feeling (5 mins)**
  Ask the Reds: "How did it feel when your partner wrote that you were incompetent, knowing you made the exact same choice as the Greens?"
  Ask the Partners: "How did it feel writing that review, then revealing your own card?"

  **2. The Predictable Glitch (5 mins)**
  Here is what will happen on the first run, and how to handle it:
  *   **The Excuse:** Participants will try to find agency where there is none. They will say, "Well, maybe I clicked the button harder," or "Did we all actually choose Efficiency?"
  *   **The Fix:** You must be the rigid System. Show the Decision Slips again. Confirm identical choices. Shut down the search for hidden variables. If you let them find a reason for the outcome, you kill the lesson. The discomfort *is* the lesson. If they laugh it off, press harder: "Imagine these are real clients. You just lost funding because of a card draw. Is laughter the right response?"
  *   **The Collusion:** Some pairs might agree to give everyone 5 tokens regardless. Catch this. Ask them why they broke the protocol. If they subverted the judgment to be nice, ask: "So you admit the outcome shouldn't matter? Then why did you feel anxious during the reveal?"

  **3. The Taxonomy (5 mins)**
  Now you name it. This is **Resultant Luck**.
  *   **Input:** Identical (Will/Choice).
  *   **Output:** Divergent (Luck/Noise).
  *   **Judgment:** Based on Output.

  **4. The Limitation (Frank Admission)**
  Be honest about what this simulation misses.
  *   **What we did:** We simulated *Resultant Luck* (outcomes beyond control) and *Circumstantial Luck* (the card you drew).
  *   **What we missed:** **Constitutive Luck**. This game assumes you are all rational agents capable of choosing "Efficiency." It doesn't account for the luck of *who you are*. Did you grow up in a system that taught you to trust bureaucracy? Are you naturally risk-averse? Your temperament right now—the fact that you cared about the tokens—is also luck. I couldn't simulate that here because I can't randomize your personalities. You have to supply that in your head.

  **Closing:**
  "Keep the tokens. Throw away the cards. Remember the feeling of being judged for the noise. That's the seminar."

  ---

  ### Instructor Notes (Read Before Class)

  **Typos & Tone:**
  Yeah, I know the prompt had typos. Don't sweat perfection in the handouts either. Make the Decision Slip look like a boring gov form. The boredom helps the shock land later.

  **Token Economy:**
  If you don't have poker chips, use slips of paper signed by you. Call them "Tenure Credits." Make a big show of counting them at the end. The fake scarcity creates real tension.

  **The "Identical Choice" Trap:**
  If even one person picks "Equity," the game breaks. You need to steer them hard to "Efficiency" in the intro. Frame it as the "Compliance Option." If someone rebels, tell them their audit failed and they sit out the token round (they become an observer). This reinforces the bureaucratic pressure.

  **Managing the "It's Just a Game" Pushback:**
  Grad students are good at intellectualizing away discomfort. If they start theorizing during the Reveal phase, stop them. "No theory yet. Just look at the tokens." You need them to feel the injustice in their gut before they explain it away with Kant.

  **Constitutive Luck Script:**
  When you hit the limitation part, don't apologize. Own it. "I can't randomize your childhoods. I can't randomize your neural pathways. So when you go home, think about what parts of your 'ethical compass' are actually just luck of birth. That's the homework."
