  This is a fantastic problem. You've essentially stumbled into the philosophical core of semiotics and type design without realizing it. Mira isn't being inconsistent; she's operating on a specific, albeit nuanced, framework that your three proposed rules only partially capture.

  Here is the breakdown of Mira's logic, the verdict on your circle, and the single glyph you need to bring to the pub to settle the argument.

  ### 1. Decoding Mira: Systemic Functionalism
  Looking at her verdicts as a dataset, Mira is not a **Formalist** (Spirit Rule) nor a pure **Nominalist** (Slot Rule). She is a **Systemic Functionalist**.

  Her core axiom appears to be: **A letter is a letter if it functions as a distinct unit within a human-readable system.**

  *   **Evidence for System:** The *Rotated Alphabet* (orientation doesn't matter if the system holds) and *Cyrillic а* (shape doesn't matter if the system identity is different).
  *   **Evidence for Function:** The *AI Blob* (machine confidence doesn't count without human legibility) and *Solid Blob* (degenerate form passes if it's still readable/functional).
  *   **Evidence against Pure Form:** *Fraktur* and *Stencil* (drastic formal deviations pass) and *5-year-old's a* (imperfect form passes).

  She rejects the **Spirit Rule** as a primary condition (Fraktur has no "bowl-and-stem" in the Roman sense, yet passes). She rejects the **Slot Rule** as a *sufficient* condition on its own (The AI Blob occupies a slot in a grid, but fails). She treats the **Reader Rule** as the gatekeeper: the system must be legible to a human.

  ### 2. Verdict on Your Circle-a
  **Prediction:** Mira will say **YES**, but she will qualify it heavily.

  **Why:**
  Your circle-a fits the *Systemic Functionalist* model perfectly, provided you present it correctly.
  *   **System:** You have a working alphabet. The contrast is maintained (o = hexagon). This satisfies the *Cyrillic* precedent (identity is systemic) and the *Rotated* precedent (form is flexible).
  *   **Function:** You tested it; humans read it in text. This satisfies the *AI Blob* veto (it is legible).
  *   **The Risk:** The *Solid Blob* verdict ("yes but a bad a") suggests she tolerates degeneracy, but a circle is a "hostile" shape because it is the canonical form of 'o'. However, since you have re-assigned 'o' to a hexagon, you have cleared the systemic conflict.

  **The Catch:** If you submit the glyph **in isolation**, she will likely say **NO**.
  *   *Reason:* In isolation, it fails the *Reader Rule* (humans read it as 'o' or nought) and the *Spirit Rule* (it has no a-ness). The *Rotated Alphabet* passed because the *whole alphabet* was shown. The *Cyrillic а* failed because the *system identity* was wrong.
  *   **Strategy:** Do not submit a single glyph sheet. Submit the glyph **in a word** (e.g., "man" or "cat") alongside the full alphabet chart. You must force the context. If she sees the circle alone, the "Cyrillic а" precedent kicks in (Same shape as 'o', therefore it is 'o'). If she sees it in the system, the "Rotated Alphabet" precedent kicks in (System overrides form).

  ### 3. Analysis of Your Three Rules
  Here is what each rule is actually committed to, based on her history:

  1.  **The Slot Rule ("Job in an alphabet"):**
      *   *Commitment:* Identity is purely relational.
      *   *Splits on:* The **AI Blob**. A blob can occupy a slot, but Mira says No. Therefore, Slot is *necessary* but not *sufficient*.
      *   *Splits on:* **Cyrillic а**. Same shape, different slot = different letter. This proves Slot > Shape.
  2.  **The Spirit Rule ("A-ness vibe"):**
      *   *Commitment:* Identity is intrinsic to the morphology.
      *   *Splits on:* **Fraktur** and **Rotated Alphabet**. Both lack standard "a-ness" (one is blackletter, one is upside down), yet both pass. Mira explicitly rejects this as a hard rule.
  3.  **The Reader Rule ("Competent readers"):**
      *   *Commitment:* Identity is phenomenological (exists in the reading act).
      *   *Splits on:* **Context vs. Isolation**. The *AI Blob* failed because humans couldn't read it. The *5-year-old's a* passed because humans could. But does "reading" require context? The *Rotated* verdict implies yes. The *Cyrillic* verdict implies yes (you read it as Cyrillic, not Latin).
      *   *Your Circle:* Passes Reader in context, Fails Reader in isolation.

  **Which rule does your circle split?**
  It splits **Spirit** from the other two.
  *   **Spirit:** No (It's a circle).
  *   **Slot:** Yes (It's in the 'a' slot, 'o' is elsewhere).
  *   **Reader:** Yes (In context).
  *   *Result:* If Mira accepts it, Spirit is dead. If she rejects it, Slot/Reader are subordinate to Spirit. Given the *Rotated* and *Blob* verdicts, Spirit is already weak.

  ### 4. The Single Test Glyph (To Settle the Pub Argument)
  You need a glyph that forces **Slot** to fight **Reader**. Your circle already pits Spirit against Slot/Reader. To fully triangulate Mira's logic, you need to know if **System Intent** can override **Human Reading**.

  **Bring this:** **The Trojan 'Z'.**
  *   **The Glyph:** A perfect, standard, double-storey Garamond lowercase **'a'**.
  *   **The Claim:** You present it as the lowercase **'z'** in an otherwise standard, legible Latin alphabet (where the actual 'z' is missing or distinct).
  *   **The Context:** Show it in a word, e.g., "zebra" spelled "aebra".

  **Why this forces the split:**
  *   **Slot Rule:** **YES.** You have assigned it the 'z' slot. The system says it is 'z'. (Consistent with *Cyrillic а* logic: System defines identity).
  *   **Spirit Rule:** **NO.** It has 'a' spirit, not 'z' spirit.
  *   **Reader Rule:** **NO.** Competent readers will read it as 'a', not 'z'. They will stumble on "aebra".

  **Mira's Likely Verdict & What It Means:**
  *   **If she says "Yes, that's a z":** She is a radical **Systemic Functionalist**. The designer's intent within a closed system overrides human habit. (This would support your Circle-a strongly).
  *   **If she says "No, that's an a":** She is a **Reader-Functionalist**. The system cannot violate human legibility constraints. (This puts your Circle-a at risk if the circle is *too* confusing).
  *   **If she says "It's a z that looks like an a":** She distinguishes **Identity** from **Form**. (This is the nuanced win).

  ### 5. Summary Advice for Thursday
  1.  **Submission:** Submit your circle-a **in context** (words + full alphabet). Do not let her judge it in isolation. If she isolates it, remind her of the *Rotated Alphabet* verdict ("The whole alphabet is on its side" -> "The whole alphabet defines the glyph").
  2.  **The Argument:** If she challenges the circle, cite the **Cyrillic а** verdict. "You said the Cyrillic 'a' wasn't an 'a' because it was in the wrong alphabet, even though the shape was perfect. Therefore, shape is secondary to system. My circle is in the right alphabet and the right slot; the shape is just a stylistic variable, like the rotation."
  3.  **The Pub Test:** Bring the **Trojan 'Z'**. Ask her: "If I put this 'a' shape in the 'z' slot of a legible font, is it a z?"
      *   If Yes: You win. Your circle is safe.
      *   If No: She values legibility over system. You must ensure your circle is *highly* legible in context to survive.

  **Final verdict:** She will accept the circle, but she will make you prove the system works. The "Spirit" of the letter is not in the bowl-and-stem; it is in the **contrast**. You have moved the contrast to the 'o'. That is valid design, and based on her *Rotated* and *Stencil* precedents, it is valid typography.

  Good luck. Drink her a pint if she accepts the Trojan 'Z'.
