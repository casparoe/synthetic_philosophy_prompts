answer: |-
  # Specification: Theory of Disagreement Response (TDR)

  **Purpose:** To provide a bounded agent with a decision procedure for updating credences or actions upon discovering disagreement in ordinary, real-time contexts.
  **Scope:** Finite exchanges, heterogeneous agents, imperfect information.
  **Status:** Normative specification for grading existing views.

  ## I. Criteria List

  | ID | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- | :--- |
  | **C1** | **Finite Sequencing** | **Case:** A referee report arrives after I have published a preprint. I cannot wait for infinite rounds of clarification. <br> **Motivation:** Aumannian fixed points are unreachable; the theory must prescribe action at $t=1, t=2$. | **Non-negotiable** |
  | **C2** | **Signal Quality Sensitivity** | **Case:** A bot tweets contrary to me vs. a tenured colleague emails contrary to me. <br> **Motivation:** Disagreement is only evidence if the source is coupled to the truth. Blind averaging is irrational; blanket dismissal is dogmatic. | **Non-negotiable** |
  | **C3** | **Robustness (No Cliff)** | **Case:** I know your credence vs. I know that you know that I know your credence. <br> **Motivation:** Verdicts should not flip discontinuously based on epistemic depth that is practically indistinguishable to bounded agents. | **Non-negotiable** |
  | **C4** | **Unshared Frameworks** | **Case:** Two clinicians using different disease taxonomies; political opponents with different foundational values. <br> **Motivation:** Standard models assume a common state space. Real disagreement often involves incompatible partitions or vocabularies. | **Non-negotiable** |
  | **C5** | **Anti-Spinelessness** | **Case:** A sequence of peers disagree with me on a matter where I have strong direct evidence (e.g., I see the red light; they say it's green). <br> **Motivation:** The theory must allow sticking to one's guns when the weight of first-order evidence warrants it, preventing convergence to error. | **Non-negotiable** |
  | **C6** | **Anti-Arrogance** | **Case:** I dismiss you as a "crank" solely because you disagree with me. <br> **Motivation:** Reliability assessments cannot be purely endogenous to the disagreement itself without circularity. | **Non-negotiable** |
  | **C7** | **Channel Separation** | **Case:** Does your disagreement lower my credence in the hypothesis ($H$) or only in my reliability ($R$)? <br> **Motivation:** Prevents double-counting. Disagreement is evidence about $H$ *via* $R$. The path must be explicit. | **Non-negotiable** |
  | **C8** | **Credence/Action Distinction** | **Case:** We agree on the risk (credence) but disagree on the acceptable cost of error (loss function). <br> **Motivation:** Behavioral disagreement does not imply doxastic disagreement. The output must specify which is being adjusted. | **Non-negotiable** |
  | **C9** | **Output Stability** | **Case:** If the theory tells me to reduce confidence, does it also tell me to reduce confidence in *that* instruction? <br> **Motivation:** Prevents infinite regress or self-undermining verdicts. | **Preference** (Technical) |
  | **C10** | **Aggregation Consistency** | **Case:** Prediction markets function despite participant disagreement. <br> **Motivation:** The theory must not render trade or aggregation incoherent (i.e., it must allow for legitimate differences in information or priors). | **Non-negotiable** |
  | **C11** | **Non-Update Responses** | **Case:** The disagreement reveals ambiguity in the question, not error in the answer. <br> **Motivation:** Sometimes the correct response is to refine the query, gather data, or suspend, not to shift credence. | **Non-negotiable** |
  | **C12** | **Rational Residual Disagreement** | **Case:** Two experts see all the same data but weigh priors differently. <br> **Motivation:** Allows for permissivism. If this is rejected, the theory must force convergence. | **Preference** (Permissivist Camp) |

  ---

  ## II. Incompatibility Analysis

  You asked which subsets of requirements are jointly unsatisfiable. Your four suspicions are largely correct, but the tensions are more specific.

  **1. The "No Cliff" vs. "Exact Agreement" Tension (Confirmed)**
  *   **Conflict:** C3 (Robustness) is logically incompatible with any theory relying on *Common Knowledge* (CK) to trigger agreement (Aumann).
  *   **Reason:** As shown in Rubinstein's Electronic Mail Game, the difference between CK and "Almost CK" is not continuous. A small probability of message failure creates a discontinuity in rational strategy.
  *   **Resolution:** You must drop the demand for exact agreement at CK. The theory must target **Approximate Common Belief**.
  *   **Cost:** You lose the mathematical guarantee of convergence. The theory becomes heuristic rather than axiomatic.

  **2. The "Spinelessness" vs. "Arrogance" Squeeze (Confirmed)**
  *   **Conflict:** C5 (Anti-Spinelessness) and C6 (Anti-Arrogance) jointly require an **External Anchor** for reliability.
  *   **Reason:** To avoid spinelessness, you must sometimes privilege your own evidence over a peer's report. To avoid arrogance, you cannot privilege it *just because it is yours*. You need a third metric (e.g., access to data, track record) to justify the asymmetry.
  *   **Resolution:** In real-time (C1), you rarely have this external anchor. You must rely on priors about reliability.
  *   **Cost:** You must accept that "No Arrogance" is an asymptotic ideal, not a real-time constraint. In the short run, you must act on *estimated* reliability, which will inevitably feel like arrogance to the other party.

  **3. The "Real-Time" vs. "Actual Reliability" Tension (Confirmed)**
  *   **Conflict:** C1 (Finite/Real-Time) makes C2 (Signal Quality) impossible to satisfy perfectly.
  *   **Reason:** Determining "Signal Quality" requires assessing the other agent's process, which takes time and information you do not have at $t=1$.
  *   **Resolution:** The theory must prescribe **Proxy Heuristics** (e.g., institutional affiliation, past track record) rather than actual reliability.
  *   **Cost:** The theory admits error. It will occasionally prescribe deference to a high-status fool or dismissal of a low-status expert.

  **4. The "Unshared Frameworks" vs. "No Arrogance" Tension (Confirmed & Critical)**
  *   **Conflict:** C4 (Unshared Frameworks) and C6 (No Arrogance) are the hardest to reconcile.
  *   **Reason:** To weigh your disagreement, I must map your claim into my framework. If our frameworks are incommensurable (e.g., different ontologies), I can only judge you using *my* ontology. This looks like arrogance from your perspective.
  *   **Resolution:** You must drop the requirement for a "View from Nowhere." The theory must be **Framework-Relative**.
  *   **Cost:** The verdict is not universal. What is rational for me (given my framework) may be rational for you (given yours), even if we contradict. This weakens the normative force of the theory across paradigm lines.

  **Which Requirement Must Be Dropped?**
  To make the specification satisfiable for a bounded agent, **C3 (No Cliff)** must be weakened from a logical constraint to a **pragmatic constraint**.
  *   **Why:** Logical continuity across levels of common knowledge is mathematically impossible for standard probabilistic agents.
  *   **Cost:** The theory cannot guarantee that small changes in epistemic depth yield small changes in output. It must instead guarantee that *computational approximations* of depth yield stable outputs.

  **The Most Exclusionary Requirement:**
  **C4 (Unshared Frameworks).**
  *   **Reason:** This single requirement rules out the entire class of Standard Bayesian Consensus models (including Aumann), which presuppose a common state space and partition. It also rules out simple averaging models, which presuppose the outputs are commensurable. It forces the theory to handle translation, not just weighting.

  ---

  ## III. Grading of Existing Views

  | View | C1 (Real-Time) | C2 (Signal) | C3 (No Cliff) | C4 (Frameworks) | C5/C6 (Spine/Arrogance) | C7 (Channels) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Aumann Picture** | **Fail.** Asymptotic only. | **Pass.** Assumes rational signaling. | **Fail.** Discontinuous at CK. | **Fail.** Assumes common prior/partition. | **Fail.** Forces convergence (Spineless). | **Pass.** Implicit. | **Theoretical ideal, unusable spec.** |
  | **Split-the-Difference** | **Pass.** Simple calculation. | **Fail.** Ignores source quality. | **Pass.** Continuous function. | **Fail.** Assumes commensurable credences. | **Fail.** Spineless (forces move). | **Fail.** Conflates belief/action. | **Heuristic, often irrational.** |
  | **Total-Evidence** | **Pass.** Treats disagreement as data. | **Pass.** Weights by reliability. | **Pass.** Bayesian updating is robust. | **Weak.** Struggles to ingest incommensurable data. | **Pass.** Allows sticking to guns. | **Weak.** Risk of double-counting. | **Strongest candidate, high cognitive load.** |
  | **Permissivism** | **Pass.** Allows status quo. | **Pass.** Allows differential weighting. | **Pass.** No fixed point required. | **Pass.** Accommodates framework diffs. | **Pass.** Avoids Spinelessness. | **Fail.** Risks Arrogance (anything goes). | **Safe, but low action-guidance.** |
  | **HOE (Reliability)** | **Pass.** Focuses on self-assessment. | **Pass.** Central focus. | **Pass.** Continuous in evidence. | **Weak.** Assumes shared reliability metrics. | **Pass.** Balances Spine/Arrogance. | **Pass.** Explicitly separates channels. | **Good for calibration, less for truth.** |

  **Summary:** The **Total-Evidence View** comes closest to satisfying the non-negotiable criteria, provided it can solve the double-counting problem (C7) and handle framework translation (C4). **Permissivism** satisfies the constraints by lowering the bar on what counts as a verdict (allowing "no change" more often). **Aumann** fails the usability constraints entirely.
