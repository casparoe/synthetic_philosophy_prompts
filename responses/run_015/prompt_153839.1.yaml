      *   **Constraint:** Do *not* survey existing views first. State criteria *first* so existing views can be graded against them later.
      *   **Background:** Acknowledge Aumann's Agreement Theorem but note its limitations (too strong/weak, fixed point vs. process).
      *   **Input:** A provisional list of 12 requirements provided by the user.
      *   **Tasks:**
          1.  Review/Refine the 12 requirements (keep, correct, extend, strike prejudices).
          2.  Mark each as "Non-negotiable" or "Preference of one camp" with motivating cases.
          3.  Identify incompatibilities (which subsets are jointly unsatisfiable?). Address the user's four suspicions.
          4.  Identify the single most exclusionary requirement.
          5.  Briefly grade 5 specific views against the final criteria (Aumann, Split-the-Difference, Total-Evidence, Permissivism, Higher-Order Evidence).
      *   **Format:** Specification style, rigorous, no citations/reading lists.

  2.  **Reviewing the 12 Requirements:**
      *   *1. Finite, sequenced exchange:* Crucial for bounded agents. Aumann is asymptotic. Real life is turn-based. (Keep, Non-negotiable).
      *   *2. Signal quality:* Distinguishing noise from signal. Essential to avoid gullibility or cynicism. (Keep, Non-negotiable).
      *   *3. No cliff:* Continuity/Robustness. Aumann breaks on common knowledge vs. almost common knowledge. (Keep, Non-negotiable).
      *   *4. Unshared frameworks:* Real world involves paradigm clashes, not just partition differences. (Keep, Non-negotiable).
      *   *5. No spinelessness:* Avoiding dogmatic convergence if the world is stubborn. (Keep, Non-negotiable).
      *   *6. No arrogance:* Avoiding self-exemption without justification. (Keep, Non-negotiable).
      *   *7. Channel separation:* Double-counting worry. Distinction between $P(H|E)$ and $P(Reliability|Disagreement)$. (Keep, Non-negotiable).
      *   *8. Belief versus action:* Distinguishing credence from utility. (Keep, Non-negotiable).
      *   *9. Output type and self-application:* What is the output? Does applying the rule change the rule? (Keep, Preference/Technical).
      *   *10. Consistency with aggregation and trade:* Markets work despite disagreement. Theory shouldn't forbid this. (Keep, Non-negotiable).
      *   *11. Responses other than reweighting:* Sometimes the answer is "go look for more data." (Keep, Non-negotiable).
      *   *12. Disagreement that survives full data exchange:* Rational residual disagreement. (Keep, Preference/Philosophical).

      *Refinement:* Some of these overlap. "No arrogance" and "No spinelessness" are tension points. "Channel separation" is technical but vital. "Unshared frameworks" is the hardest constraint.

  3.  **Analyzing Incompatibilities (The Core Task):**
      *   *Suspicion 1 (No-cliff vs. Exact Agreement):* Real. Rubinstein's Email Game shows discontinuity between common knowledge and almost common knowledge. A strict "No Cliff" requirement makes exact Aumannian convergence impossible to demand as a normative rule for bounded agents.
      *   *Suspicion 2 (Spinelessness vs. Arrogance):* Real tension. If you must always move (no arrogance) but never converge to nonsense (no spinelessness), you need a metric of reliability that isn't circular. But if reliability is endogenous, you risk arrogance. If exogenous, you risk spinelessness.
      *   *Suspicion 3 (Real-time vs. Actual Reliability):* Real. You can't know actual reliability in real time. You must use proxies. This creates a gap between the normative ideal and the usable heuristic.
      *   *Suspicion 4 (Unshared Frameworks vs. No Arrogance):* Very Real. If frameworks differ, how do I judge your reliability without assuming my framework is the metric? If I use my framework to judge you, am I being arrogant? If I don't, how do I weigh you?

      *Conclusion:* The set is likely jointly unsatisfiable in the strong sense. Trade-offs are necessary. The "No Cliff" requirement is the most damaging to standard Bayesian models. The "Unshared Frameworks" requirement is the most damaging to standard consensus models.

  4.  **Drafting the Specification:**
      *   Structure: Preamble (Purpose), The Criteria (Refined), Incompatibility Analysis, The Exclusionary Requirement, Grading Table.
      *   Tone: Analytic, precise, normative but practical.

  5.  **Refining the Criteria (Iterative Process):**
      *   Make sure "Non-negotiable" is reserved for things a *usable* theory *must* have, not just things that are philosophically nice.
      *   Requirement 12 (Rational residual disagreement) is actually a "Preference of one camp" (Impermissivist vs. Permissivist). I should flag that.
      *   Requirement 3 (No Cliff) is technically impossible for logical omniscience models, so for a bounded agent, it must be reframed as "Robustness to uncertainty about the other's state."

  6.  **Developing the Incompatibility Proof (Mental Check):**
      *   Can you have Unshared Frameworks + No Arrogance? Only if there is a neutral meta-framework. If none exists, one agent must privilege their own mapping. That looks like arrogance. So, drop "No Arrogance" in favor of "Justified Partiality" OR drop "Unshared Frameworks" in favor of "Translation Assumption." Given the prompt wants real-world usability, "Unshared Frameworks" is non-negotiable. So "No Arrogance" must be weakened to "No *Unjustified* Arrogance."
      *   Can you have No Cliff + Aumann Convergence? No. Common knowledge is a singularity. Bounded agents never have it. So the theory must target "Approximate Common Belief."
      *   Can you have Real-Time + Actual Reliability? No. Must use priors/heuristics.

  7.  **Finalizing the Grading:**
      *   Aumann: Fails Real-time, Fails Unshared Frameworks, Fails No Cliff.
      *   Split-Difference: Fails Signal Quality, Fails No Spinelessness (sometimes).
      *   Total-Evidence: Good on Signal Quality, struggles with Channel Separation (double counting).
