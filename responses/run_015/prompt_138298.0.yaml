answer: |-
  This is a delicious problem. You've correctly identified that your supervisor is operating with a hybrid view that conflates *selection effects* (the evolutionary/game-theoretic story) with *normative force* (the deontic/reason-based story). His silence on the "Bad Judge" case isn't a dodge; it's the boundary condition of his theory.

  Here is the reconstruction of his position, the prediction for your case, and the variant that will break him.

  ### 1. The Three Rules Consistent with His Track Record

  Based on the seminar notes and the 3am email, his view is jointly consistent with these three principles:

  *   **Rule A (Dispositional Essentialism):** Rationality is a property of *agents*, not just acts. An act is rational if it flows from a disposition that was rational to cultivate ex-ante. (Explains: Standard Hitchhiker, Wallet).
  *   **Rule B (The Etiological Constraint):** You may instrumentally adopt a commitment via causal mechanisms (wallet, capsule), but you cannot violate the constitutive norms of belief via mere resolve. Beliefs must be caused, not willed. (Explains: Capsule = OK; Grad Student = Belief irrational, Resolve OK).
  *   **Rule C (The Causal Trigger):** A disposition generates a reason to act only if that disposition was causally efficacious in securing the benefit. If the benefit occurs *despite* your disposition (Bad Judge), the reason evaporates. (Explains: Bad Judge email, Small Town distinction).

  ### 2. Prediction: The Two-Hitchhiker Case

  **Verdict:** He will say **both hitchhikers pay.**

  **Reasoning:**
  Rule A dominates here. To get the ride, each hitchhiker must cultivate the disposition of "being a payer." Crucially, because conferencing is forbidden, this disposition cannot be conditional on the other's behavior (e.g., "I'll pay only if she doesn't"). A conditional disposition is a different type, and a disposition-reading driver might not trust it to be stable enough to secure the ride. Therefore, the rational ex-ante disposition is *unconditional*.
  Once in town, Rule C (Causal Trigger) does not absolve them because, from *each agent's perspective*, the causal link is not definitively broken. They do not know the other will pay. To maintain the integrity of the disposition that secured the ride (Rule A), they must follow through.
  The redundancy is an *outcome* feature, not an *agency* feature. His "Wallet" case confirms this: once you hand over the wallet, intercepting the payment is irrational even though the friend's action makes your payment causally redundant. You bound yourself to the *type*, not the *outcome*.

  **The "Poison" Question:**
  Does "she'll probably pay, so I needn't" poison both?
  **Yes.** If either reasons that way, they no longer have the disposition the driver scanned. They have the disposition of a *conditional free-rider*. If the driver is a good reader, he wouldn't have picked them up. Since they *were* picked up, they must be the "unconditional payer" type. Therefore, they cannot use the probability of the other's payment to justify non-payment without contradicting the very fact of their selection.

  ### 3. The "Real" Rule and Why

  He is really running with **Rule A (Dispositional Essentialism) constrained by Rule C (Causal Trigger).**

  **Why:**
  The "Grad Student" vs. "Capsule" distinction is the tell. He allows pragmatic commitment (Resolve/Capsule) but respects the "norms of belief" (Grad Student belief is irrational). This means he thinks rationality is about *managing your agency* to secure goods, not about *maximizing utility at the node*.
  However, the "Bad Judge" email ("I neither know nor care") shows he isn't a pure fetishist about dispositions. If the disposition didn't *work* (didn't cause the ride), it generates no reason.
  So the core view is: **You owe it to your past self (who secured the ride) to follow through, provided your disposition actually did the work.**

  In the Two-Hitchhiker case, since the disposition *did* the work (collectively) and neither agent knows they were individually redundant, the obligation holds for both.

  ### 4. The Forcing Variant

  Your candidate (Driver announces "I picked her") is good, but it leaves the second hitchhiker in the "Bad Judge" zone. To force him off the fence, you need to remove the uncertainty while keeping the disposition intact.

  **The Variant: "The Transparent Redundancy"**
  Same setup (two hitchhikers, driver needs one payment). They arrive in town. Before anyone pays, the driver points to Hitchhiker A and says: *"I'm only taking payment from her. I saw her disposition was stronger. Hitchhiker B, put your wallet away; your disposition was sufficient to get you the ride, but I don't need your money."*
  Hitchhiker B now knows with certainty that their payment is causally redundant (Rule C trigger is off). However, Hitchhiker B *did* cultivate the disposition to pay (Rule A is active).

  **The Question:** Is it rational for Hitchhiker B to insist on paying?
  *   **If Yes:** He is a pure Dispositional Essentialist. The reason is internal to the agent's integrity.
  *   **If No:** The Causal Trigger (Rule C) is the dominant constraint. The reason is external (based on efficacy).
  *   **My Bet:** He says **No.** The "Bad Judge" email suggests that without causal efficacy, the normativity dissolves. He cares about the *deal* (disposition for ride), not the *virtue*. If the driver waives the fee, the deal is fulfilled. Insisting on paying becomes irrational (waste of resources with no return on the disposition).

  ### 5. Bonus Round: The Belief-Reading Driver

  **Setup:** Driver scans for *sincere belief* that one owes the money. Needs only one believer. Capsules available (cause sincere belief).
  **Verdict:** **Both take the capsule. Both arrive believing. Both pay.**

  **Reasoning:**
  1.  **Taking the Capsule:** Rational for both. Ex-ante, this is the only way to secure the ride. (Matches Standard Capsule case).
  2.  **The Belief:** He will maintain that asking if the belief is *rational* is the "wrong kind of question" (Capsule case). The belief is causally produced. Its truth value (whether they *actually* owe the money, given the other might pay) is irrelevant to the rationality of *acquiring* it.
  3.  **The Payment:** Since both believe they owe the money, and both are the sort of agents who act on their sincere beliefs (Standard Hitchhiker), both will pay.
  4.  **The Tension:** One of them is paying a debt they don't technically "owe" (since only one payment was needed).
  5.  **His Move:** He will bite the bullet. The rationality lies in the *ex-ante strategy*. If you try to calculate ex-post "Do I really owe this?", you are the Grad Student trying to will a belief, or the Standard CDT agent trying to renege. Both are irrational types.
      *   *Nuance:* He might distinguish between *owing the driver* and *owing the debt*. If the driver accepts both payments, both debts are discharged. If the driver refuses the second, the second hitchhiker tried to pay (rational) but was prevented.
      *   *Key Prediction:* He will say it is rational for both to *attempt* to pay. Whether the second payment is accepted is up to the driver, but the *agency* of the second hitchhiker remains rational.

  **Summary for your chapter:**
  Your supervisor is a **Causal Dispositionalist**. He thinks you must be the type who pays, but only because being that type causes good outcomes. When the causation breaks (Bad Judge/Transparent Redundancy), the obligation breaks. In your Two-Hitchhiker case, the causation is opaque to the agents, so the obligation holds. Use the "Transparent Redundancy" variant to expose whether he values the *disposition* or the *causal link* more. My money is on the causal link.
