  | **Ensemble** | Multi-turn conversation or multi-persona | Distorted | Implies multiple agents negotiating, rather than one voice shifting. | The theatre vocabulary is too thin |
  | **The Fourth Wall** | The boundary between user and model internals | Distorted | In theatre, breaking it is stylistic; in models, it's usually a failure or leak. | The original claim was under-specified |

