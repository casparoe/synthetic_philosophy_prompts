answer: |-
  You have identified a real, robust, and frustratingly subtle linguistic phenomenon. There is no single, canonical term in general circulation that captures this exact split, but the distinction is recognized in linguistics and the philosophy of language under overlapping descriptions.

  To give you the tool you need for future arguments, I will first outline the established conceptual carving, then offer a precise term you can use to name it, and finally address how this bears on the "meaning versus use" debate that was the core of your disagreement.

  ### The Conceptual Carving: Modification vs. Classification

  The distinction you observed is best understood as the difference between **Concept-Modifying** use and **Human-Classifying** use.

  **1. Concept-Modifying (The Safe Zone)**
  *   **Syntax:** Attributive adjectives or noun adjuncts modifying abstract nouns (*queer theory, crip politics, the queer community*).
  *   **Function:** The word describes a *framework, style, or affiliation*. It modifies an idea or a collective abstraction.
  *   **Why it works:** The speaker is not defining a specific human being. They are describing a lens through which the world is viewed. Even an outsider can acknowledge the existence of "queer politics" without claiming the authority to define the people within it. The word functions descriptively, not diagnostically.

  **2. Human-Classifying (The Danger Zone)**
  *   **Syntax:** Predicative adjectives or substantives applied to individuals (*She is queer, He is a crip, That queer man*).
  *   **Function:** The word assigns an identity to a specific body. It acts as a label.
  *   **Why it fails:** This recreates the original power dynamic of the slur. Historically, slurs were weapons used by outsiders to categorize, dismiss, or diagnose insiders. When an outsider uses a reclaimed term to classify an individual, they are unconsciously seizing the **authority to label**. Even if the intent is neutral, the *act* is one of imposition.

  ### A Term for the Phenomenon

  Since you asked for a label to hang on this distinction, I propose you use:

  **The Predicative Licensing Constraint**

  *   **Definition:** A pragmatic rule governing reclaimed slurs wherein the term is licensed for use by outsiders only when it modifies abstract concepts or collective kinds, but is restricted (unlicensed) when used predicatively to classify specific individuals.
  *   **Usage:** "You're violating the *Predicative Licensing Constraint*. You can talk about *crip time* because that modifies a concept, but you can't call *him* a *crip* because that classifies a person."

  This term captures that the restriction isn't about the word itself (which is reclaimed) but about the *license* to use it in specific syntactic positions (predicative) that perform a specific social action (labeling).

  ### Why the Distinction Exists: Agency and Essentialism

  You asked if the distinction is syntactic or about what the utterance *does*. The answer is that the syntax enables the *doing*.

  **1. Agency and Authority**
  Reclamation is an act of taking power. When an insider says, "I am queer," they are exercising agency over their own identity. When an outsider says, "She is queer," they are exercising authority over someone else's identity.
  *   **Concept-Modifying:** "Queer cinema." The speaker is not claiming authority over the people, only describing the art.
  *   **Human-Classifying:** "He is queer." The speaker is claiming the right to define the subject. This triggers the historical memory of the slur, which was always an outsider defining an insider.

  **2. Essentialism vs. Feature**
  *   **Concept-Modifying:** In "queer politics," *queer* is a feature of the politics. It implies a perspective.
  *   **Human-Classifying:** In "he is a crip," the term risks becoming essentialist. It suggests the disability (or identity) is the total definition of the person. Reclaimed terms are often embraced by insiders as *one part* of a complex identity; when an outsider uses them predicatively, it often feels like a reduction.

  ### The Edges and Boundaries

  You asked where the edges lie. Here is how the *Predicative Licensing Constraint* typically behaves:

  *   **Plural Self-Descriptions ("We are queers"):** Within the group, substantive plurals are often acceptable as a sign of solidarity and collective power. Used by an outsider ("The queers are protesting"), it almost always reverts to slur status because it homogenizes the group into a mass.
  *   **Echoing ("He told me he's a crip, so I called him a crip"):** This is the riskiest edge. Even if echoing the target's own language, an outsider using the term predicatively can feel like mockery or "quoting" the identity back at them in a way that strips the warmth of self-application. It is generally safer for the outsider to use the adjective ("He has a disability") than the reclaimed noun ("He is a crip"), even if the insider uses the noun.
  *   **Public Figures:** The constraint holds. "Ellen is a lesbian" (factual classification) is often treated differently than "Ellen is a dyke" (even if reclaimed). The more reclaimed the term, the higher the barrier for outsider predicative use.

  ### Meaning vs. Use: Who Was Right?

  This is the most critical part for your argument with your friend. Your friend claimed that the derogation is something the *utterance does* (pragmatics/use), not part of the *word's meaning* (semantics).

  **Your observation supports your friend.**

  Here is why:
  1.  **If it were Meaning:** If the derogation were baked into the semantic definition of the word (like "bachelor" implies "unmarried"), then *no* use by an outsider should be neutral. "Queer theory" would be as offensive as "You queer." The fact that "Queer theory" is acceptable proves the derogatory content is not a fixed truth-condition of the word.
  2.  **If it were Purely Context:** If it were just general context sensitivity, we wouldn't see such a stable syntactic pattern. We would expect it to depend entirely on tone or relationship.
  3.  **The Synthesis (Expressive Content):** The phenomenon supports the view that reclaimed slurs carry **expressive content** that is activated by specific speech acts.
      *   The *meaning* of *queer* has shifted to include a neutral/positive identity descriptor.
      *   However, the *use* of the word to classify a human (predication) by an outsider activates a dormant **illocutionary force** of othering.

  The *Predicative Licensing Constraint* exists precisely because the *action* of labeling a person is different from the *action* of describing a theory. The word hasn't changed its meaning so much that it can withstand the weight of outsider labeling.

  ### Summary for Your Next Conversation

  To stop arguing past each other, you can propose this framework:

  1.  **Agree on the Term:** Call it the **Predicative Licensing Constraint**.
  2.  **Agree on the Mechanism:** The offense isn't in the *word* (semantics), but in the *act of labeling* (pragmatics).
  3.  **The Rule:** Outsiders are licensed to use reclaimed terms to **modify concepts** (queer theory) because that acknowledges the group's intellectual contribution. Outsiders are *not* licensed to use reclaimed terms to **classify individuals** (he is queer) because that appropriates the group's authority to define itself.
  4.  **The Verdict on Meaning vs. Use:** Your friend is right that the derogation is in the *use*. The syntactic pattern you noticed is simply the map of where those uses become dangerous. The grammar predicts the offense because the grammar dictates the social action (labeling vs. describing).

  This allows you to acknowledge the stability of the pattern (it's not random offense) without conceding that the word itself is inherently broken. It places the burden on the *speaker's action*, which aligns with advocacy goals of accountability.
