answer: |-
  Alice and Bob share identical hippocampal implants restoring episodic recall. The hardware, embedded equally deep in both skulls, performs with 95% accuracy, matching natural memory. When prompted for past events, Alice accesses the implant's data stream directly, reporting 'I remember' without hesitation. Bob, previously burned by a transient glitch now resolved, treats the implant as an external informant; he cross-references its output with photos before asserting recall, though this adds latency without improving accuracy. Both succeed equally in tasks requiring precise recollection. The implant's physical location and functional reliability are constant; only their doxastic stance toward the signal differs. Alice integrates the output into her cognitive flow; Bob maintains a critical distance. Neither checks the code; both rely on the same silicon architecture. The device is not networked externally. Their behavioral success is identical, yet their phenomenological relationship to the source diverges sharply.

  **Verdicts**
  **Clark/Chalmers (Parity + Trust):** Alice's content is mental; Bob's is not. Alice meets the 'glue' condition via automatic endorsement and trust, functioning identically to biological belief. Bob's scrutiny breaks the integration, rendering the device a tool rather than a mind-part.
  **Skin-and-Skull:** Both subjects' content is mental. The boundary is the organism's physical boundary; since the implant is intracranial for both, attitude is irrelevant to inclusion.
  **Adams/Aizawa (Derived Content):** Neither subject's content is mental. The implant is an artifact carrying derived content; neither trust nor location transforms derived symbols into intrinsic cognitive content.

  **Responsive Features and Ablation**
  Parity responds to **attitude**. If attitudes equalize, verdicts equalize (both Yes or both No). If the device moves outside the skull, Parity verdicts hold (space is irrelevant). If the device becomes unreliable but Alice trusts it, Parity shifts to No, showing it tracks reliability *and* endorsement.
  Skin-and-Skull responds to **space**. If the device moves outside the skull, both verdicts become No. Equalizing attitudes or altering reliability changes nothing.
  Adams/Aizawa responds to **content origin**. Moving the device, equalizing attitudes, or altering reliability changes nothing; artifacts remain non-cognitive.

  **Honest Audit**
  The case is engineered to force Parity to hinge on *endorsement* rather than mere functional role. This is not stipulation but relies on Clark's later 'trust and glue' refinement, which distinguishes belief from consulted notes. The case fails to fully isolate reliability from process: Bob's system is reliable *because* he checks, confounding device reliability with systemic reliability. Parity could decline a verdict due to underdescription regarding the *history* of coupling; if Bob's checking is a temporary phase versus a permanent policy, the 'glue' status is ambiguous.

  **Counterattacks**
  1.  **EMT:** The theorist claims endorsement is constitutive of belief, not an extra condition; distrusting biological memory yields the same verdict. This is a **consequence to embrace**, not a reductio. It confirms cognition is a functional status defined by integration, not a substance. If the brain is distrusted, it functions as an external source, dissolving the mind's boundary regardless of biology.
  2.  **Skin-and-Skull:** The theorist retreats to "silicon is not neural tissue." This retreat is **ad hoc** relative to the 'organism boundary' definition. Accepting it **collapses the second verdict into the third** (both No), destroying the three-way split and revealing the view relies on biological materialism, not spatial boundary.

  **Practice-Based Variant**
  A practice-based view counts both subjects as extended, but via different encultured practices. Alice's practice is direct retrieval; Bob's is verification. This escapes attitude-dependence by focusing on the *skill* of coupling rather than the feeling of trust. Both are cognitive extensions, differing only in the style of engagement, suggesting the mind's boundary is defined by mastered techniques of manipulation rather than internal endorsement.
