      *   **User's Knowledge Gap:** Philosophy of history (zero), popular history (one book on Columbian Exchange).
      *   **The Conflict:** Argument with an environmental historian friend about whether germs, climate, and volcanoes can be "actors" in history.
      *   **User's Stance:** Non-humans are conditions/shocks, not actors. Systems fail due to lack of slack + shock. Attributing agency to non-humans leads to unactionable postmortems (determinism).
      *   **Friend's Stance:** Non-humans (volcanoes, disease, climate) *are* actors (e.g., "disease conquered the continent").
      *   **The Task:**
          1.  Restate the historian's position in SRE vocabulary.
