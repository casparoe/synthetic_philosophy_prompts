    "family_resemblance_fix": "Solves circularity by treating values as loose overlapping traits, but eliminates normative force, rendering the phrase descriptive rather than justificatory.",
    "normative_jurisdiction_tension": "Resolved by distinguishing universal validity from historical actualization, positioning the West as the particular vanguard of universal moral progress.",
    "verdict_on_coherence": "Logically unstable due to performative contradiction, but rhetorically robust when sustained by a tacit teleological narrative.",
    "feature_doing_the_work": "The distinction between universal validity and historical actualization (dependent on a hidden theory of moral progress)."
  }
