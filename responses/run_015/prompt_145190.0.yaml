answer: |-
  The conceptual instability of "Western values" stems from its attempt to function simultaneously as a descriptive category (identifying a cultural bloc) and a normative standard (judging moral correctness). When treated as an **essentialist axiological cluster**, the concept posits that there is a fixed set of commitments (e.g., individualism, rationalism, liberal democracy) that constitute the essence of "the West." The logical circularity here is immediate: the West is defined by these values, but the values are validated by their association with the West. To break this loop without resorting to history, proponents must anchor the values in a transcendent source—usually "Reason" or "Human Nature"—that is universally valid but allegedly *actualized* uniquely within the Western tradition. This move allows the definition to claim universality while retaining particular ownership.

  However, this essentialism creates the problem of **exclusionary inclusion**. If the "West" is defined by a specific liberal-individualist core, internal traditions that contradict this core (such as anarcho-syndicalism, which rejects the liberal state, or religious pacifism, which may reject rationalist secularism) must be conceptually pruned. They are not treated as alternative Western interpretations but as deviations or failures to fully realize the essence. The category remains unified only by defining dissent as external to the true identity of the West, effectively policing the boundaries of the concept to maintain coherence.

  If one shifts to a **family-resemblance concept**, the circularity dissolves. "Western values" becomes a loose cluster of traits found in a geopolitical bloc, with no single necessary condition. However, this fix comes at a high cost: it strips the phrase of normative force. If "Western values" are just whatever happens to be dominant in Europe and North America, then historical injustices (colonialism, segregation) are just as "Western" as human rights. The phrase loses its ability to justify policy or claim moral superiority, becoming merely sociological. Consequently, political actors rarely sustain this definition; they slide back into essentialism when justification is required.

  The **universal/particular tension** is resolved through a hidden **theory of moral progress** (teleology). The conceptual maneuver works by distinguishing between the *validity* of the values (which is universal) and the *historical realization* of those values (which is particular). The West claims particularity ("these are our traditions") while asserting universal jurisdiction ("these are the rights of all humans") by positioning itself as the vanguard of moral development. The West is not just different; it is conceptually framed as being *ahead*. This allows the phrase to function as a particular identity marker while enforcing universal norms. Without this tacit assumption of historical teleology—that there is a direction to moral history and the West is further along it—the double move collapses into contradiction.

