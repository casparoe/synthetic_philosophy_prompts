      *   *The "No Negative Evidence" point:* This is the strongest logical lever. In ML, we usually assume i.i.d. samples from $P(X, Y)$. In language, we see $X$ (sentences) but never explicit $Y=0$ (ungrammatical). We infer $Y=0$ from absence. This is Positive-Unlabeled (PU) learning. This requires strong priors to avoid overgeneralization.
