answer: |-
  Consider a drinking glass made of tempered polycarbonate, which is intrinsically tough and lacks any brittle structure that would cause it to shatter under normal impact. An engineering club has rigged the glass with a concealed vibration sensor and a small internal solenoid calibrated to strike the inner wall with a metal pin the instant an external impact is detected. While the glass itself is not fragile and would withstand a hammer blow if the rig were disabled, the presence of the mechanism ensures that whenever the glass is struck, the pin fires and cracks the material. There is no intrinsic fragility to be removed or masked; the object is genuinely sturdy, yet the counterfactual "if struck, it would break" remains true solely due to the external apparatus.

  **Plain Conditional Analysis (SCA):** Says the glass **is fragile** because the conditional "if struck, it would break" is true.
  **Revised Analysis (Intrinsic Basis):** Says the glass **is not fragile** because it lacks an intrinsic basis that would produce the breaking if retained through the stimulus (the breaking comes from the extrinsic solenoid).
  **Correctness:** The Revised Analysis gets it right; our intuition is that a sturdy object rigged to break isn't genuinely fragile.

  **Feature Doing the Work:** The extrinsic mimic mechanism (the sensor and solenoid) that causes the manifestation independently of the object's nature.
  **If Deleted:** Without the rig, the conditional becomes false (it wouldn't break), and the SCA would correctly classify it as non-fragile.
  **SCA Defender's Wriggle:** They would reject the intuition that fragility requires an intrinsic basis, arguing that "fragile" just *means* the conditional is true, so if it breaks when struck, it is fragile by definition regardless of why.
