  Your working rule fails because it assumes truth lies only in the uncomposed. It mistakes *accident* for *authenticity*. Instead, adopt a pair of principles under **The Law of Friction**: Character is revealed where self-presentation meets resistance.

  **1. The Asymmetry of Breach.** Negative details outweigh positive ones because vice breaches the censor of social performance, while virtue often reinforces it. This saves verdicts (4), (5), and (7). Rudeness and crime escape control; courtesy and achievement confirm it. It explains why discreditable hearsay sticks: it fits the pattern of breach. However, it cannot save the logical inconsistency in (7); that remains a cognitive bias, not a structural truth. You must accept that your readers, like you, are wired to believe the worst.

  **2. The Cost of Composition.** Deliberate acts reveal only when they address an unconquerable constraint or acknowledge an internal flaw. This saves (1), (6), and (9). The Knot solves an impossible problem; the estate instruction accepts mundane reality; the Ledger admits fault. It discounts (2) and (3) as frictionless myths. It also saves (8): a subject's memory implies internal ownership, whereas prefiguration is external myth-making.

  This overturns your "failure of authorship" rule. Authorship counts if the author is fighting themselves. A polished memoir is useless; a ledger of faults is gold, because it costs pride to write it.

  **Unsettled Cases:**
  1.  **Leaked Remark vs. Voting Record:** The record represents sustained resistance against pressure; the remark is frictionless impulse. Trust the record unless the remark admits fault. The record is the life lived; the remark is the mask slipped.
  2.  **Blameless Life:** Absence of anecdotes suggests total control or insignificance. If control, it is a verdict of suppression. The method is not blind; the absence is the frictionless void. A life without friction leaves no mark.
  3.  **Enemy Biography:** High friction. The enemy maximizes negative resistance. Trust only inert details (dates); moral coloring is weaponized friction. The enemy tells the truth about the conflict, not the subject.

  **Plutarch's Painter:** He misleads. He prioritizes scale (small vs. large) over resistance. A small detail can be as staged as a battle. The eye can be made up. Truth is not in the detail's size, but in its cost. Plutarch seeks the likeness; you seek the scar. The painter captures the surface; the biographer must find where the surface broke.
