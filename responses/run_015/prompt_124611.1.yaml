prompt: |-
  You are a professional political philosopher who also does technical-adjacent work on AI value alignment, and you are unusually good at predicting how a particular room will attack a particular argument. Think carefully before you write. First, in a few sentences of private scratchwork, brainstorm every line of attack you can think of on the thesis below; then throw away the ones that come from the wrong audience; then produce only the finished prep sheet specified at the end. Do not summarize your scratchwork and do not show it to me.

  The setting. In ten days I give a department colloquium with a twenty-minute question period. The room is roughly: six or seven late-Rawlsian liberal neutralists who work on public reason, stability, and the burdens of judgment; two democratic theorists, one of the deliberative sort who thinks legitimacy requires actual rather than hypothetical deliberation among real citizens, and one who defends democracy partly on epistemic grounds, as a procedure with a tendency to get questions of justice right; one junior scholar in critical AI ethics working in feminist and decolonial epistemology, who reads any mechanism for eliciting and weighting people's values as a potential machine for testimonial injustice and extraction; and a scattering of graduate students. Nobody else in the room works on AI. Nobody knows the alignment literature, nobody is impressed by expected-utility formalism, and any appeal to existential risk or to vast future populations will be read as special pleading rather than as a consideration. Assume they are sympathetic to the question, hostile to technocratic shortcuts, and quick to notice when a supposedly procedural test has substantive content.

  The thesis, which is chapter three of my dissertation. Call it the Symmetric Exposure Rule. Given a general-purpose AI system and a set of candidate value profiles it might be trained to satisfy, we proceed in four steps. First, elicit from each affected party a value profile, understood as a ranking over the candidate profiles the system might instantiate. Second, run each elicited profile through what I call the reflection test: a profile is discounted to the extent that it does not survive being presented with accurate information about the alternatives and about its own causal genealogy, which is meant to screen out adaptive preferences, internalized oppression, and straightforward factual error, and to screen in nothing else. Third, assign each surviving profile a weight equal to that party's expected exposure to the system's outputs over the system's whole lifetime, counting future and not-yet-existing users at their projected population size; exposure, not citizenship or headcount, is what makes you subject to the system. Fourth, instead of taking a weighted average, select the candidate profile that minimizes the maximum stake-weighted value distance, so that a numerous group that is only mildly alienated cannot outweigh a small group that would be catastrophically alienated. My argument in outline: headcount and majority-style aggregation have no principled answer to who counts, are hostage to adaptive preferences, and are silent about the fact that most of the affected parties do not yet exist; welfare-style averaging presupposes interpersonally comparable cardinal value functions that the elicitation cannot deliver; liberal neutrality is the right constraint but is standardly stated as a constraint on the state, whereas the neutrality that matters here is neutrality about which comprehensive doctrine gets implemented, not neutrality about how a doctrine was arrived at, and the reflection test is neutral in exactly that sense; stake rather than headcount follows from the fact that exposure is what makes one subject to the system; the minimax step is needed because averaging permits aggregation across persons that no individual would accept; and carrying future parties at projected size follows from the very same stake principle, even though it heavily dilutes the values of currently living people, which I argue is a feature and not a bug.

  What I want is Q&A preparation, not a defense of the view and not a restatement of my argument. Give me exactly five numbered items, with nothing before the first item and nothing after the last. Each item is at most three sentences: the first states the objection as that particular person in the room would actually phrase it, in their vocabulary rather than mine, so that I recognize it when I hear it; the second is the reply I should give, written so I can deliver it in about ninety seconds, and if the honest reply has to concede something it should concede it explicitly in that sentence; the third names the point where my reply is softest, in the sense that a follow-up there would hurt. Order the five by how much damage each would do to the thesis if it landed, most damaging first, and note inside an item if you think an objection is very likely but not very damaging, or vice versa. Do not include objections that a decision theorist, an ML researcher, or the rationalist blogosphere would raise: I can get those anywhere and this room will not raise them. Make the fifth and final item the question I am hoping nobody asks. Because I also want calibrated confidence rather than bravado, the last sentence of that fifth item should do double duty: it should say which single consideration, if a member of the audience raised it and pressed it, should lead me to abandon the thesis rather than answer it, rather than merely noting where the reply is weak.

  Do not give me a bibliography, a reading list, a set of citations, or named works to consult: assume I have read the literature and that I have no access to anything during the talk, so every item must stand on argument alone.
