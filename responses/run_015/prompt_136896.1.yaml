      *   **Success/Failure:** Success = a coherent argument, even if negative. Failure = proving the distinction is anachronistic (which is still a result, but risky for a proposal). "Growing too big" = trying to solve all of Rousseau's aesthetics.
      *   **Scope/Reality Check:** This is crucial. £4k is small. 6 months part-time is ~10 hours a week? That's ~260 hours. Need to be honest. The modern theatre part is the danger zone. The "friend's concern" needs to be addressed directly in the feasibility section.

  4.  **Refining the Argument (The "Friend's Concern"):**
