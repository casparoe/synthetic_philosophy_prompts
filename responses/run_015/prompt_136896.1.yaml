      *   *Proposed Solution:* It's not performance *per se* he hates, but *alienated* performance.
      *   *Risk:* Is this distinction (representational vs. presentational) anachronistic? Does Rousseau actually make this distinction, or is the applicant forcing modern performance theory onto 18th-century text?
