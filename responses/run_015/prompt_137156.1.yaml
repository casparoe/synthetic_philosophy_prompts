prompt: |-
  You are a professional philosopher of language who works on Wittgenstein and on concepts in the philosophy of science. Think carefully: start by brainstorming the possible angles, then give me a disciplined case analysis, and say plainly where the theory runs out rather than forcing it to speak.

  Analyze the 2006 decision by the International Astronomical Union to reclassify Pluto as a dwarf planet through the lens of language games and family resemblance. The facts, as I understand them: Eris, a body more massive than Pluto, was discovered in 2005; at its Prague General Assembly the IAU adopted a three-part definition of a planet of the Solar System — it orbits the Sun, it is massive enough for its own gravity to make it nearly round, and it has cleared the neighborhood around its orbit; Pluto satisfies the first two and fails the third, since its orbit crosses Neptune's and it shares its orbital region with the Kuiper belt. The definition is explicitly restricted to the Solar System, exoplanets having been handled separately. The IAU attached no numerical threshold to the clearing requirement; researchers later proposed different discriminants, and the phrase's own originators have noted that no planet can ever completely clear its orbital zone. The decision was contested, some planetary scientists preferring a geophysical definition keyed to roundness, and the public argument revived when New Horizons flew past Pluto in 2015. Take all that as given; flag it rather than guess if you think I have something wrong.

  What I want:

  1. A careful mapping. What, exactly, is the family-resemblance claim about the word planet — a claim about the psychological structure of the concept, about its semantics, or about how disputes over it should be settled? List the candidate features in play (roundness, orbiting a star, not fusing, dynamical dominance, composition, visibility to the naked eye, the fact that the Greek term meant wanderer and once covered the Sun and Moon) and say which genuinely overlap across cases and which are merely coextensive in the examples we happen to have.

  2. Run the theory on the case. On the best reading, what should the IAU have done: refused to define, defined for a stated purpose, or something else? Does family resemblance explain the public resistance to the demotion, or only the astronomers' discomfort?

  3. Press on two features that seem to make trouble for a naive reading. First: the winning criterion is itself a matter of degree, so replacing an open-ended concept with necessary and sufficient conditions may relocate vagueness rather than remove it. Second: the word is already doing different work in different practices — Solar System taxonomy, exoplanet catalogs, comparative geophysics, schoolrooms. Say what each of these does to the analysis.

  4. Turn the case back on the theory. Is this a confirmation of family resemblance, an anomaly, or a case it was never designed for? In particular, is the view a thesis about how concepts are, or advice about what to say when someone demands an essence — and does the episode suggest that scientific classification is a language game in which the demand is legitimate rather than confused?

  Finally, an extension: suppose a Mars-mass body is found in the Oort cloud that is round, orbits the Sun, and has nothing comparable near its orbit, and its discoverers insist on calling it a planet while most of the field refuses. What kind of disagreement is that, and does family resemblance settle it, dissolve it, or have nothing to say?

  Keep the answer under 900 words.
