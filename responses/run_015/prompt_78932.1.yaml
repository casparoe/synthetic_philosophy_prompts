answer: |-
  You have correctly identified that there is a single, unified logical structure underlying these cases, and your intuition that standard labels (like "The Hole Argument" or "Permutation Invariance") are merely instance-names rather than the name of the *shape* is spot on.

  The general name for this argumentative structure is **The Argument from Symmetry** (specifically, leading to **Ontological Underdetermination**). However, in the contemporary philosophy of physics literature, when this specific dilemma (Realism $\rightarrow$ Indeterminism/Haecceitism vs. Anti-Realism) is invoked, it is often collectively referred to as **The Generalized Hole Argument** or **Leibnizian Reasoning**.

  The principle being tested is **Leibniz Equivalence**. The metaphysical commitment being attacked is **Haecceitism** (or **Substantivalism**, in the spacetime case).

  Here is the breakdown of the shape, the unity of your cases, and the significance of the "small region" distinction.

  ### 1. The Name of the Shape
  If you need a label to put on a syllabus or in a paper that captures the general form rather than the specific instance, the most precise term is:
  **Symmetry-Based Ontological Underdetermination.**

  However, because Einstein's **Hole Argument** (your Case 1) is the most rigorous and historically significant formulation of this structure, philosophers often use "The Hole Argument" as a shorthand for the *logical template* itself, even when discussing particles or gauge fields. You will see titles like "A Hole Argument for Quantum Particles."

  The core principle at stake is **Leibniz Equivalence**: *If two models of a theory are related by a symmetry transformation, they represent the same physical state of affairs.*

  ### 2. Is it Actually One Shape?
  Your friend is right: structurally, they are identical. Your skepticism is also right: the *consequences* differ slightly depending on the type of symmetry.

  **The Unified Structure:**
  1.  **Formalism:** A theory $T$ has models $M$.
  2.  **Symmetry:** There exists a transformation $\phi$ such that if $M$ is a model, $\phi(M)$ is also a model.
  3.  **Empirical Equivalence:** $M$ and $\phi(M)$ yield identical observable predictions.
  4.  **Mathematical Distinctness:** $M \neq \phi(M)$ (they assign different values to the "scaffolding" variables).
  5.  **The Dilemma:**
      *   **Option A (Realism about Scaffolding):** $M$ and $\phi(M)$ represent distinct physical possibilities.
          *   *Cost:* The theory is indeterministic (if $\phi$ is local) or posits invisible differences (Haecceitism).
      *   **Option B (Anti-Realism/Structuralism):** $M$ and $\phi(M)$ represent the *same* physical possibility. The scaffolding is "surplus structure."

  **The Cases:**
  *   **Spacetime (Hole Argument):** $\phi$ is a diffeomorphism. Scaffolding = Spacetime points.
  *   **Particles:** $\phi$ is a permutation. Scaffolding = Particle labels/identities.
  *   **Leibniz Shift:** $\phi$ is a global translation. Scaffolding = Absolute position.
  *   **Gauge:** $\phi$ is a gauge transformation. Scaffolding = Potential values at points.

  All four are instances of **Active Transformations** that are **Symmetries of the Theory**.

  ### 3. The "Small Region" Issue (Local vs. Global)
  You asked if the "small region" version (Case 1) is doing work, or if it's just dramatic. **It is doing crucial technical work.** This is the distinction between **Global** and **Local** symmetries.

  *   **Global Symmetries (Leibniz Shift, Particle Permutation):** The transformation happens everywhere at once.
      *   *The Problem:* This threatens **Individuation**. (Is *this* universe different from *that* one?)
      *   *Determinism:* It does not necessarily threaten determinism. If you shift the *entire* history of the universe, the future is still determined by the past; the whole block just moved.
  *   **Local Symmetries (Hole Argument, Gauge Fields):** The transformation happens in a restricted region (e.g., "the Hole") while leaving the outside fixed.
      *   *The Problem:* This threatens **Determinism**.
      *   *Why:* You can fix the state of the universe everywhere outside the region (the past) and on the boundary. The theory allows multiple distinct futures inside the region (because you can shuffle the scaffolding inside without affecting the boundary).
      *   *Significance:* This is why the Hole Argument is the "strongest" version. It forces the dilemma using the theory's own criterion for success (predictability), not just metaphysical parsimony.

  So, while the *logical shape* is the same, the **Local** version (Hole/Gauge) is philosophically more urgent because it breaks **Initial Value Determinism**, whereas the **Global** version (Shift/Particles) breaks **Haecceitistic Individuation**.

  ### 4. What It Is Not (Addressing your doubts)
  You are correct to distinguish this from the other concepts you mentioned.

  *   **Vs. Underdetermination of Theory by Evidence (Quine/Duhem):**
      *   *That:* Two *rival theories* ($T_1$ vs $T_2$) make the same predictions.
      *   *This:* One theory ($T$) has two *rival models* ($M$ vs $\phi(M)$) that make the same predictions.
      *   *Term:* This is **Underdetermination of Ontology by Formalism**.
  *   **Vs. Coordinate Systems (Passive Transformations):**
      *   *That:* Changing the *labels* we use to describe a fixed situation (e.g., switching from Cartesian to Polar coordinates). The underlying points don't move; our grid changes.
      *   *This:* **Active Transformations**. The grid stays fixed; the *fields/particles* move to new points.
      *   *Why it matters:* If it were just coordinates, there would be no dilemma. We already agree coordinates aren't real. The Hole Argument works because diffeomorphisms can be interpreted *actively* (moving the physical fields relative to the manifold points).
  *   **Vs. The Two Spheres (PII):**
      *   *That:* A static metaphysical puzzle about identity.
      *   *This:* A dynamic argument derived from the *equations of motion* of a specific physical theory.
      *   *Connection:* The Hole Argument is essentially the **Principle of Identity of Indiscernibles (PII)** weaponized by General Relativity.

  ### 5. Summary for your Teaching
  When you teach this next year, you can present it as a single module on **Symmetry and Ontology**.

  1.  **The General Argument:** Symmetry-related models $\rightarrow$ Empirical Equivalence $\rightarrow$ Dilemma (Indeterminism/Haecceitism vs. Redundancy).
  2.  **The Principle:** **Leibniz Equivalence** (accept the symmetry as physical equivalence).
  3.  **The Distinction:** **Global Symmetries** (Shift, Particles) vs. **Local Symmetries** (Hole, Gauge).
      *   Global challenges *what exists* (Parsimony).
      *   Local challenges *how things evolve* (Determinism).
  4.  **The Solution:** Most philosophers of physics now adopt **Sophisticated Substantivalism** or **Structuralism**: The "scaffolding" (manifold points, particle labels) does not have independent identity. Only the **structure** (relations, fields) is real.

  ### Recommended Reading (for you, to bridge the gap)
  Since you are coming from Ethics, you want authors who write clearly about the metaphysics without getting bogged down in tensor calculus.

  *   **James Weatherall,** "Regarding the 'Hole Argument'" (2018). *Crucial.* He argues exactly your point: that the Hole Argument, Gauge arguments, and Particle arguments are all the same category of mathematical mistake regarding how to interpret models.
  *   **Gordon Belot,** "Symmetry and Equivalence" (2013). Excellent overview of the general shape you identified.
  *   **John Earman & John Norton,** "What Price Spacetime Substantivalism? The Hole Story" (1987). The classic paper that formalized the argument you described in Case 1.
  *   **Thomas Møller-Nielsen,** "Taking Symmetries Seriously" (2017). Discusses the general link between symmetry and ontology.

  **Verdict:** You have grasped the core issue better than many students in that seminar. The shape is **Symmetry-Based Ontological Underdetermination**, the principle is **Leibniz Equivalence**, and the "small region" distinction marks the difference between **Global** and **Local** symmetries, which determines whether the cost is **Haecceitism** or **Indeterminism**.
