  3. Verbal or genuine.
  The dispute is substantive regarding the constitution of epistemic value, not merely verbal. Monists define 'epistemic' via truth-conduciveness; Pluralists define it via broader cognitive virtues. However, both agree on the mathematical machinery, suggesting the disagreement lies in interpreting the utility function's inputs rather than the calculus itself. The term 'accuracy' is used differently: Monists mean closeness to truth; Pluralists mean fit within a value-laden model.

