      *   **Michael Bratman (Shared Cooperative Activity):** Focuses on *meshing subplans*. Individuals have their own intentions that fit together to achieve a shared goal. It's more flexible, modular. Cooperation is key, but the "we" is less metaphysical than Gilbert's.
      *   **The "Exit Condition":** Gilbert says leaving a plural subject requires mutual agreement (usually). Bratman allows for individual withdrawal if it doesn't thwart the shared goal entirely, though it strains the cooperation.

