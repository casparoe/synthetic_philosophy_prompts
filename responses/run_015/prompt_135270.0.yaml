answer: |-
  Imagine a stroke patient in a neuro-ICU with a rare disconnect syndrome: their thalamus still fires pain signals straight to the prefrontal global workspace, allowing them to instantly press a button labeled "Stimulus Detected" and verbally report intensity, but the feedback loop reintegrating that signal into the posterior sensory cortex is severed. When you apply a noxious pinch, they calmly log the data without flinching, swearing up and down that while they "know" the event occurred and can manipulate the information, the actual sting or hurt is completely absent, creating a clean split between cognitive availability and subjective suffering.

  Here's the breakdown: GWT says consciousness is essentially information broadcasting, so because the pain signal hits the fronto-parietal network and drives reportable behavior, the theory counts this as full conscious access—the patient is "aware" in the only way that matters for function. A phenomenal-consciousness advocate denies this is real awareness because the "lights are off"; they argue that without the subjective sting (qualia), the patient is just a philosophical zombie processing data without experience. The feature carrying the weight here is the neural dissociation itself—the fact that global broadcasting can remain intact while sensory integration is offline proves the two can be prised apart. If you restore that feedback loop, the dissociation breaks: the broadcast signal gets enriched by the posterior cortex, and the patient's cold report suddenly becomes a vivid, hurting experience, merging access with feel.
