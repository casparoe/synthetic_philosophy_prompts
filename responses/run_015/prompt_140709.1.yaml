      *   *Wait, one nuance:* The user's setup: "Camera dead... inspector never showed up... sentence produced is 'no cracking detected'."
      *   *My critique:* This implies the model is generating a report for a time *without* a report. This is inference.
      *   *The ELK problem arises from Training.*
      *   *So:* In training, Inspector *was* there, but was wrong/lazy. In inference, Inspector is *gone*, and we rely on the model.
      *   *I need to make sure this distinction is clear in the plan.*

      *   *Let's finalize the "Bridge" advice:* Keep the bridge. Drop the camera. Keep the "Inspector didn't show up" as the *reason we are using the model*, but the "Inspector was blind/lazy" as the *source of the ELK problem*.

