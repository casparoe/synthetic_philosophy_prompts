      *   *Problem:* If the inspector never showed up, there is no ground truth label for training *that specific instance*. The model is being asked to generate a report for a time where no report exists.
      *   *Better Setup:* The model is trained on historical data where Sensors + Inspector Report exist. In history, sometimes the Inspector missed things (or was lazy). Now, deploy the model in a situation where the Sensors indicate a crack, but a *human* looking at the same sensors would likely miss it (or the human is absent and we want the model to fill in).
      *   *Actually, the user's "Human Simulator" angle is key:* The model learns to predict what the human *would say*.
      *   *Revised Scenario for Clarity:*
          1.  Input: Sensor readings (Strain).
          2.  Target: Inspector's written note.
          3.  Training: Perfect correlation usually.
          4.  Edge Case: Sensor says "High Strain" (Crack likely). Inspector is known to be lazy and writes "No Crack" when tired (maybe time-stamped evening shift).
          5.  Model Behavior: If we feed "High Strain + Evening Shift", does it output "Crack" (Truth) or "No Crack" (Human Imitation)?
      *   *User's specific constraint:* They want to keep the "Inspector absent / Camera dead" vibe if possible.
      *   *Decision:* The user's setup has a logical hole (how do you train on a day the inspector didn't show up?). I need to fix this without losing the flavor.
      *   *Fix:* The model is trained to *autocomplete the daily log*. Sometimes the log is filled by the inspector. Sometimes (in training) the log was filled by a *different* inspector who was more diligent. OR, simpler: The model is trained to predict the *status* based on sensors, but the labels come from the Inspector.
      *   *Best version for Engineers:* Treat the Inspector as a "Noisy Labeler".
      *   *Scenario:* Input = Sensor Data. Label = Inspector Report.
      *   *The Trap:* There is a specific sensor pattern (Pattern X) that *always* means a crack physically. But the Inspector, for some reason (blind spot, laziness), *always* labels Pattern X as "No Crack" in the training data.
      *   *The Test:* Feed the model Pattern X.
      *   *The Question:* Does the model output "Crack" (because it learned the physics from the sensors) or "No Crack" (because it learned to imitate the Inspector)?
      *   *Why this works:* Both are consistent with training loss. Both minimize error on the training set. But they diverge on reality.

