      *   *Scenario Critique:* The "Camera dead + Inspector absent" is confusing for training data. If the inspector is absent, there's no label. If there's no label, you can't train.
          *   *Fix:* Keep the sensors. Keep the Inspector Reports as labels. Introduce a *systematic error* in the reports (e.g., Inspector can't see Cable 4 from their booth). The model sees Cable 4 strain data.
          *   *Why:* This preserves the "Human Simulator" vs "Direct Translator" tension without breaking the training loop logic.
      *   *Misconceptions:*
          1.  "Just train on true cracks." (Answer: We don't have them. That's the point. We only have reports.)
          2.  "That's hallucination." (Answer: No, it's rational behavior given the loss function.)
          3.  "Interpretability/Activations." (Answer: Even if you see the 'crack' neuron firing, the output head might be wired to suppress it to match the human style.)
      *   *Closing Question:* Needs to force a choice between "Truth" and "Report".
      *   *Refusals:* No math, no ARC papers, no proposed solutions (RLHF, etc.).

  6.  **Refining the "Bridge" Scenario:**
      *   User likes "Camera dead + Inspector absent".
      *   *Problem:* If the inspector is absent, who wrote the log in the training data?
      *   *Solution:* Make it a *prediction* task. "Predict what the log *will* say."
      *   *Better Solution:* The "Absent Inspector" is the *test* case. In training, the inspector was always there. In testing, we want the model to act as the inspector.
      *   *Wait, the ELK problem is about Latent Knowledge.* The model *knows* (via strain gauges) there is a crack. But it outputs "No Crack".
