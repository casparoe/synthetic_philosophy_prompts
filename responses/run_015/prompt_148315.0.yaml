      *   Contrast Scheffler with Preference Satisfaction.
      *   Detail the "Existential Risk" policy shift.
      *   Highlight the inconsistency.
      *   Offer narrative angles.

  *(Self-Correction Note on Scheffler)*: Wait, Scheffler's *Death and the Afterlife* lectures argue that we care about the future *more* than we admit. The user's friend says governments fund vaults but not survival. This suggests governments *say* they care about the future (vaults) but don't care enough to ensure it (survival). Scheffler would say if they truly grasped the Afterlife Conjecture, they would prioritize survival. So the current behavior is *inconsistent* with a deep acceptance of Scheffler's view. It treats the future as a *project* rather than a *precondition*. I need to make this distinction clear.

