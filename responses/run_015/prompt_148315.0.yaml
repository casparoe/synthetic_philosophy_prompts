answer: |-
  First, you have the spelling right: **Samuel Scheffler**. His 2013 lectures, published as *Death and the Afterlife*, are exactly the source you're looking for.

  Your friend's observation hits on a profound tension in modern ethics and public policy. The discrepancy between funding "legacy projects" (seed vaults, archives) and "existence projects" (asteroid defense, biosecurity, climate stabilization) reveals a specific, somewhat fractured theory of value.

  Here is a reconstruction of the implicit philosophy behind that funding pattern, how it relates to Scheffler, and what a coherent policy would look like if you took the stakes seriously.

  ### 1. The Implicit Theory: "The Curatorial Model"
  The current funding pattern presupposes what we might call the **Curatorial Model of Value**.

  In this model, the future is treated as a **given container** that will definitely exist, and our moral duty is merely to decide what goes *inside* it. This model assumes:
  *   **Continuity is Default:** Humanity's survival is treated as a background constant, like gravity. It doesn't require active maintenance, only assumption.
  *   **Content is Variable:** Culture, biology, and knowledge are fragile and require active protection.
  *   **Tangibility Bias:** It is easier to value a physical seed or a digitized book than a probabilistic reduction in risk. A vault is a monument; asteroid defense is an insurance policy that pays out only if nothing happens.

  **Does this need Scheffler's Conjecture?**
  Actually, the current funding pattern is **inconsistent** with a serious acceptance of Scheffler's view.

  Scheffler argues that the "afterlife" (humanity continuing after us) is not just one value among others, but a **background condition** for almost all our other values. We write books, cure diseases, and build institutions because we assume there will be people to inherit them.
  *   **If you accept Scheffler:** Securing the *existence* of the inheritors is logically prior to packing the *inheritance*. You cannot value the seeds if there is no one to eat them.
  *   **The Current Practice:** By funding vaults but not defense, society is acting as if the "Afterlife" is guaranteed. It treats Scheffler's background condition as a certainty, allowing us to focus on the foreground objects.

  So, the funding pattern doesn't *rely* on Scheffler; it relies on **taking Scheffler's condition for granted.** It is a form of philosophical complacency.

  ### 2. Rival Views: Presentism and Preference Satisfaction
  Could you defend the vaults without Scheffler? Yes, but the defense becomes cynical.

  *   **Pure Presentism:** If only the present matters, vaults are irrational unless they serve current people. (e.g., The vault creates jobs for archivists *now*).
  *   **Preference Satisfaction (The "Warm Glow" Theory):** This is the strongest rival explanation. Current donors get utility *now* from the feeling of being benevolent ancestors.
      *   **Why Vaults?** They offer immediate psychological gratification. You can cut a ribbon on a vault. You cannot cut a ribbon on "an asteroid that didn't hit us."
      *   **Why Not Defense?** Existential risk reduction is abstract. It lacks narrative closure.
      *   **Verdict:** If this is the true motivation, the vaults are essentially art installations. They are for *us*, not *them*. They signal virtue to the present, rather than securing value for the future.

  ### 3. Policy Under "Extinction is the Worst Harm"
  If you shift the axiology (theory of value) to treat extinction not as the sum of individual deaths, but as the **loss of all potential future value**, the policy changes radically. This is the core of **Longtermism** (associated with philosophers like Derek Parfit, Nick Bostrom, and William MacAskill).

  If extinction is the ultimate harm because it forecloses all future generations (potentially billions of years of civilization), the math changes:

  *   **The Trade-off:** A seed vault preserves a fraction of value *conditional on survival*. Asteroid defense preserves the *conditionality itself*.
  *   **Budget Shift:** A rational policy would divert the vast majority of "future-facing" resources from **Archiving** to **Defense**.
      *   *Current:* Spend millions storing DNA; spend thousands tracking Near-Earth Objects.
      *   *Revised:* Spend billions ensuring the biosphere remains habitable; spend enough on archiving to recover if a *local* disaster happens, but acknowledge that archiving is useless against *global* termination.
  *   **The Metric of Success:**
      *   *Current:* "How many varieties did we save?"
      *   *Revised:* "How much did we lower the probability of human termination this century?"

  ### 4. The Deeper Inconsistency
  You asked if there is a deeper inconsistency in caring about future people while ignoring the risk that there won't be any. **Yes.**

  It is a form of **temporal hypocrisy**. We fetishize the *legacy* of humanity while neglecting the *vehicle* of humanity.
  *   **The Paradox:** We act as if the future is a destination we are packing for, rather than a bridge we are building.
  *   **The Novelistic Tension:** This is gold for your story. Your archivists are maintaining a library for readers who may never exist. They are curating a museum in a house that is actively burning down.
  *   **Philosophical Diagnosis:** This behavior suggests we value **Symbolic Immortality** (being remembered) more than **Biological Continuity** (actually surviving). We want to be the "ancestors" in the story, even if the story ends immediately after our chapter.

  ### 5. Summary for the Novel
  If you want to ground your characters' conflict in this philosophy:

  1.  **The Archivists (Schefflerians/Longtermists):** They might realize the inconsistency. "Why am I cataloging wheat strains when the atmosphere is becoming toxic?" They represent the view that *existence precedes essence*.
  2.  **The Funders (Preference Satisfaction):** They know the vaults are symbolic. "People need to hope, even if the hope is irrational. A vault gives them hope. Asteroid defense just gives them anxiety."
  3.  **The Tragedy:** The funding pattern reveals that we care more about **being good ancestors** than **having descendants**.

  **Conclusion:**
  The current funding pattern does not require Scheffler's conjecture; in fact, it violates its logic. It is better explained by **Preference Satisfaction** (donors want to feel good now) combined with a **False Sense of Security** (assuming survival is automatic).

  A policy that genuinely treated extinction as the worst harm would look less like a library and more like a bunker. It would prioritize **resilience** over **record-keeping**. The inconsistency you've identified is the gap between our *romantic* view of the future (a place to store our treasures) and our *pragmatic* neglect of it (refusing to secure the road to get there).

  For your novel, that gap is where the drama lives: The moment the archivists realize they are the curators of a tomb, not a garden.
