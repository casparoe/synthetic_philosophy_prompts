answer: |-
  A silver lamp lit ere the sun arrives,
  It hangs low where day begins to climb.
  It sends the night back to its dark archives,
  Then fades away upon the edge of time.
  Or when the west consumes the dying light,
  Another spark ignites above the hill.
  It holds its ground against the coming night,
  And burns alone when all the world is still.
  I know the road that joins the east and west,
  Yet dawn and dusk refuse to share their names.
  Though maps confirm the wanderer's single quest,
  But dawn's cold fire is not the dusk's warm flames.
  The truth may bind the evening to the morn,
  But not the place where either light was born.
