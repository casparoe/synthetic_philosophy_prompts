answer: |-
  ## Part 1: The Decision Procedure

  You asked to correct, reorder, and merge your candidate tests into a runnable protocol. Below is the **Joint Commissioning Ethical Protocol (JCEP)**. It is designed for a half-day session, requires no philosophical training, and produces a defensible written record.

  I have discarded **Test (f) (Separate-sphere)** as redundant; if you successfully **Modularise (c)**, separate spheres are the result, not a separate test. I have refined **Test (d) (Reverse-package)** because asking parties to imagine a hypothetical package often leads to speculation. Instead, we will use a **Marginal Value Assessment** that asks about the specific concession in front of them. I have merged **Test (b) (Complicity)** and **Test (c) (Modularity)** into a single step because they address the same mechanism: decoupling action from endorsement.

  ### The Joint Commissioning Ethical Protocol (JCEP)

  **Pre-Condition:** Staff must provide a one-page "Baseline Brief" before the meeting. This defines the "Split Budget" scenario (the non-cooperative outcome) in concrete terms: dollar amounts, service capacity lost, and referral pathways broken.

  #### Step 1: The Baseline & Stakes (Operationalising Test A)
  **Question:** "Judged by your own mandate, is this joint package strictly better than the Split Budget Baseline defined in the Brief?"
  **Sufficient Answer:** Each member must state "Yes" and identify *one specific capability* they regain or protect by cooperating that they would lose in the Split Budget.
  **Stopping Point:** If any member says "No" or "I am indifferent," the proposal fails. Do not proceed to trade.
  **Incentive Control:** The Chair must read the Baseline Brief aloud. If a member claims the joint package offers no gain, they are effectively voting for the Split Budget. This forces them to own the consequence of their veto.

  #### Step 2: The Complicity & Modularity Map (Operationalising Tests B & C)
  **Question:** "Does this proposal require any member to act, fund, or be publicly credited in a way that violates their core identity, even if the outcome is good?"
  **Procedure:** Draw a three-column table (Action, Funding, Endorsement). For each activity in the proposal, mark which members are involved in which column.
  **Sufficient Answer:** Any member identifying a "Red Zone" (violation of core identity) must propose a **Modular Fix** (e.g., separate branding, opt-out clauses, distinct letterheads) to move that activity from "Endorsement" to "Funding" or "Action" only.
  **Stopping Point:** If a Red Zone cannot be modularised (i.e., the member cannot participate even with disclaimers), the proposal fails.
  **Incentive Control:** The "Modular Fix" must be written into the contract. Vague assurances of "we won't hold you responsible" are insufficient.

  #### Step 3: The Substantive Gain Check (Operationalising Test D)
  **Question:** "Are we trading material capacity for symbolic comfort, or vice versa?"
  **Procedure:** Identify the specific concession each party is making. Ask the *recipient* of that concession: "If we removed this concession, would you still prefer the Joint Package over the Split Budget?"
  **Sufficient Answer:** The recipient must confirm that the concession provides *operational* value, not just reputational safety.
  **Stopping Point:** If a concession is purely symbolic (e.g., a disclaimer that changes no behavior) but costs the giver material capacity, the proposal fails.
  **Incentive Control:** This prevents "cheap talk." If the Health Department wants neutrality, they must pay for it with budget flexibility, not by silencing partners.

  #### Step 4: The Precedent Lock (Operationalising Test E)
  **Question:** "If we agree to this, are we willing to make this specific exception the default rule for next year's applicants?"
  **Procedure:** Draft the "Exception Clause." This is a single sentence added to the minutes describing *why* this compromise is unique to this specific coalition and context.
  **Sufficient Answer:** All members agree that the Exception Clause accurately limits the precedent.
  **Stopping Point:** If a member fears this agreement will be used to coerce them in a different context later, the proposal fails unless the Exception Clause is strengthened.
  **Incentive Control:** This addresses repeat play. It prevents a party from accepting a "one-off" compromise that becomes a weapon against them later.

  #### Step 5: The Absent-Parties Impact (Operationalising Test G)
  **Question:** "Who bears the risk if this compromise fails, and can they exit?"
  **Procedure:** Identify the client group most vulnerable to the compromises made in Steps 2 and 3.
  **Sufficient Answer:** The Board must confirm that the client group retains access to the full range of services (even if through different providers) and that referral pathways remain open.
  **Stopping Point:** If the compromise creates a "service cliff" (e.g., clients are referred to a service that legally cannot help them), the proposal fails.
  **Hand-off:** This is the final ethical gate. If passed, the decision is a value trade authorized by the board. If failed, it is a harm to the public that the board cannot authorize.

  ---

  ## Part 2: Application to Live Proposals

  Here is the application of the JCEP to the three proposals.

  ### Proposal 1: Joint Programme, Single Brand, Supply Ban
  *   **Step 1 (Baseline):** Harm Reduction (HR) gains budget scale; Ministry gains referral access; Health gains coordination. *Pass.*
  *   **Step 2 (Complicity):** **FAIL.**
      *   *Ministry:* "Single Brand" implies endorsement of HR activities. This is a Red Zone in the "Endorsement" column.
      *   *HR:* "Barring distribution of supplies" on the shared site violates the duty to reduce harm where possible.
      *   *Modular Fix:* None offered. The proposal mandates a single brand and a ban.
  *   **Step 3 (Substantive Gain):** **FAIL.** The Ministry gains referrals but risks identity. HR gains budget but loses ability to distribute supplies on-site. The trade is material capacity (supplies) for symbolic unity (brand).
  *   **Step 5 (Absent Parties):** **FAIL.** Clients on the shared site cannot access supplies, creating a service cliff.
  *   **Verdict:** **NO.**

  ### Proposal 2: Conscience Clause, Ministry Opt-Out, Overhead Share
  *   **Step 1 (Baseline):** All parties retain full budget access compared to Split. *Pass.*
  *   **Step 2 (Complicity):** **PASS.**
      *   *Ministry:* Conscience clause moves them from "Action/Endorsement" to "Funding Only" for objected components.
      *   *HR:* Can operate without Ministry branding on specific supplies.
      *   *Modular Fix:* The clause itself is the fix.
  *   **Step 3 (Substantive Gain):** **PASS.**
      *   *Health:* Gains legal defensibility (material).
      *   *Ministry:* Gains budget share without complicity (material).
      *   *HR:* Gains full budget access without Ministry veto on supplies (material).
  *   **Step 4 (Precedent Lock):** **PASS.** Exception Clause: "Conscience clauses apply only where statutory law permits and do not establish a right to withhold emergency referral."
  *   **Step 5 (Absent Parties):** **PASS.** Clients retain access to all services; referrals are not blocked, only Ministry participation is limited.
  *   **Verdict:** **YES.**

  ### Proposal 3: Public Education, Neutral Text Only
  *   **Step 1 (Baseline):** All parties access budget. *Pass.*
  *   **Step 2 (Complicity):** **PASS.** Neutral text offends no one's identity.
  *   **Step 3 (Substantive Gain):** **FAIL.**
      *   *HR Concession:* Withholding safer-use information.
      *   *Health Gain:* Neutrality.
      *   *Test:* If the neutral text were removed, would HR still prefer the Joint Package? Yes. If the safer-use info were removed, does Health gain *operational* value? No, only reputational safety.
      *   *Analysis:* HR is trading material capacity (information that saves lives) for Health's symbolic comfort (neutrality). This violates the Substantive Gain Check.
  *   **Step 5 (Absent Parties):** **FAIL.** The public receives less information than in a Split Budget scenario where HR could speak freely.
  *   **Verdict:** **NO.** (Though less egregious than Proposal 1, it fails Step 3).

  **Decision:** The Procedure returns a **NO** on **Proposal 1** (due to Complicity/Modularity failure) and **Proposal 3** (due to Substantive Gain failure). **Proposal 2** is the only viable option.

  ---

  ## Part 3: Written Records (Board Minutes)

  ### Record 1: Proposal 1 (Joint Programme)
  **Decision:** Rejected.
  **Reasoning:** The Board applied Step 2 (Complicity & Modularity). The requirement for a "Single Brand" placed the Faith-Based Ministry in a position of public endorsement contrary to its mandate. Simultaneously, the "Supply Ban" on the shared site prevented the Harm-Reduction Organisation from fulfilling its core duty of care in that location. No modular alternative (e.g., dual branding or off-site distribution) was offered. Under Step 5 (Absent Parties), the Board determined that barring supplies on the shared site created an unacceptable service cliff for clients.
  **Precedent:** This rejection reaffirms that shared branding requires unanimous consent on brand values.

  ### Record 2: Proposal 2 (Conscience Clause)
  **Decision:** Approved.
  **Reasoning:** The Board applied Step 2 (Complicity & Modularity). The conscience clause successfully decoupled funding from direct action/endorsement for the Ministry, allowing them to participate without complicity. The Harm-Reduction Organisation confirmed that the clause does not restrict their operational capacity. Under Step 3 (Substantive Gain), all parties secured material budget capacity they would lack in a Split Budget scenario.
  **Precedent Lock (Exception Clause):** "Approval of this conscience clause is granted solely on the basis of current statutory protections for religious organisations and does not establish a precedent for withholding emergency medical referrals in future funding cycles."
  **Absent Parties:** The Board certifies that all client referral pathways remain open and unfettered by this agreement.

  ### Record 3: Proposal 3 (Neutral Text)
  **Decision:** Rejected.
  **Reasoning:** The Board applied Step 3 (Substantive Gain Check). The proposal required the Harm-Reduction Organisation to withhold specific safety information in exchange for the Health Department's preference for neutrality. The Board determined that neutrality in this context is a symbolic good, while safety information is a material good. Trading material safety for symbolic neutrality fails the test of substantive gain. Under Step 5 (Absent Parties), the public would receive less actionable information than under a Split Budget.
  **Precedent:** Public education materials must contain actionable health information agreed upon by clinical staff, not merely neutral statements agreed upon by administrators.

  ---

  ## Part 4: Limitations and Failure Modes

  You asked where this procedure will misfire. It is a tool for *agreement*, not a tool for *truth*.

  **1. The "Articulate Spokesperson" Bias**
  The procedure relies on members accurately stating their "Red Zones" (Step 2) and "Baseline" preferences (Step 1). A member who is philosophically inarticulate but deeply conscientious may fail to explain *why* a concession violates their integrity, appearing unreasonable rather than principled. Conversely, a sophisticated negotiator may frame a preference as a "core value" to gain leverage.
  *Mitigation:* The Chair must enforce the "Baseline Brief." If a member claims a violation, they must point to a specific line in their own mission statement or bylaws. If they cannot, the claim is treated as negotiation, not ethics.

  **2. The "Symbolic Inflation" Problem**
  In Step 3 (Substantive Gain), parties may try to inflate the value of symbolic goods. The Health Department might argue that "Neutrality" prevents lawsuits (material) rather than admitting it prevents controversy (symbolic).
  *Mitigation:* The "Counterfactual" in Step 3 is key. "If we removed this text, would you actually be sued?" If the answer is no, it is symbolic.

  **3. The "Precedent Freeze" (Test E)**
  The Precedent Lock is necessary for repeat play, but it can ossify the board. If every agreement requires a unique "Exception Clause," eventually the rulebook becomes so complex that no new proposal can fit.
  *Mitigation:* Every three years, the Board must review the Exception Clauses. If an exception has been used three times without harm, it becomes standard policy.

  **4. The "Split Budget" Threat Credibility**
  The entire procedure hinges on Step 1: that the Split Budget is genuinely worse for everyone. If the Funder changes tactics and offers generous split budgets, the "Zone of Possible Agreement" vanishes. The Board will deadlock, not because of ethics, but because cooperation is no longer economically rational.
  *Mitigation:* The Board must annually re-verify the "Split Budget" numbers with the Funder. If the gap narrows, the Board must acknowledge that ethical compromise is no longer required to secure funding.

  **5. Systemic Bias Towards the Status Quo**
  This procedure is conservative. It is easier to reject a proposal (Step 2 Fail) than to engineer a Modular Fix. It systematically favours the party with the most rigid "Red Zones" (usually the Faith-Based Ministry in this context) because they hold the easiest veto.
  *Mitigation:* Step 2 requires the objecting party to *propose* the Modular Fix. They cannot just say "No"; they must say "No, unless..." This shifts the burden of creativity onto the veto-holder.

  **Final Advisory:**
  The procedure will return a **NO** on Proposal 1. It attempts to force unity where there is none, violating the Ministry's complicity limits and the HR Org's duty of care. Proposal 2 is the only robust path. It accepts disagreement as a structural feature rather than a problem to be solved by silence or forced branding. Use the minutes from Proposal 2 as your template for the Funder; they demonstrate that the Board has considered the ethical risks and mitigated them contractually.
