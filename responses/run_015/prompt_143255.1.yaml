  # Activity Design: The Everettian Betting Floor

  **Time:** 100 Minutes
  **Participants:** 16 (8 Phil, 8 Phys)
  **Budget:** $30 Cash (or 30 equivalent chocolate bars/vouchers)
  **Goal:** Elicit the "Probability Problem" in Many-Worlds via first-personal decision making, testing "Care Functions" against structural constraints.

  ---

  ## 1. Physical Setup & Logistics

  **The Room:**
  *   Clear the center. Arrange 16 chairs in a circle or scattered such that students cannot see each other's papers/envelopes.
  *   **Whiteboard:** Divided into two sections: "Bids (Round X)" and "Care Function Constraints."
  *   **Materials:**
      *   80 Envelopes (16 per round × 5 rounds). Opaque, identical.
      *   Index cards (for "Care Function" worksheet).
      *   Cash: 16 × $2 bills (or equivalent tokens).
      *   Dice/d100 for the Facilitator (for Round 4/5 randomness).

  **The Stakes (Simplified Wager):**
  To avoid complex mechanism design (BDM) eating 30 minutes, use a **Direct Wager**:
  *   **Endowment:** Each student receives **$2.00** at the start.
  *   **The Bid:** Before each split, they write down a wager $w \in [0, 2]$.
  *   **The Payoff:**
      *   If their envelope contains **WIN**: They keep their $2 + $2 Bonus - $w$. (Net: $4 - w$)
      *   If their envelope contains **LOSE**: They keep their $2 - $w$. (Net: $2 - w$)
      *   *Correction for Risk Neutrality:* This incentivizes betting $0$ if they think Lose is likely.
      *   *Better Payoff:*
          *   **WIN:** Receive $2 (Prize). Cost = $w$. Net = $2 - w$.
          *   **LOSE:** Receive $0. Cost = $w$. Net = $-w$ (Deducted from endowment).
          *   *Constraint:* They cannot go into debt. Max wager = $2.
          *   *Incentive:* If they believe P(Win) = $p$, they maximize expected value by wagering $2$ if $2p - w > 0$? No.
          *   *Simplest Honest Elicitation:* **The Bid is the Price.** "Write the maximum amount of your $2 endowment you would pay to *guarantee* a $2 payout if you Win."
          *   *Actually, let's stick to the Prompt's "Certainty Equivalent":* "Write the fraction of the prize ($0.00 to $2.00) you consider this coupon worth."
          *   **Enforcement:** "At the end, I will randomly select **one round**. Your wager in that round will be executed for real cash. This makes every bid real." (This is sufficient for a philosophy group).

  ---

  ## 2. The Care-Function Worksheet (Minutes 0–10)

  Hand out index cards. Ask them to define how they value their future descendants *before* any game mechanics are explained. This prevents the game from priming the answer.

  **Prompt:**
  > "You are about to undergo a branching event. You will become multiple successors. You care about your successors, but perhaps not equally.
  > Define your **Care Function** $C$.
  > How much do you value a specific successor branch based on:
  > 1.  **Weight ($w$):** The squared amplitude of that branch (0 to 1).
  > 2.  **Count ($n$):** The number of distinct branches of this type.
  > 3.  **Total Population ($N$):** The total number of branches in the universe.
  >
  > Write a formula or a rule. Example: *'I care proportional to weight, ignoring count.'* or *'I care equally per branch, regardless of weight.'*"

  *Collect these. Do not look at them yet.*

  ---

  ## 3. The Five Rounds (Minutes 10–60)

  **General Ritual:**
  1.  **Commit:** Students write their Wager ($0–$2) on a slip, fold it, place in a "Bid Box."
  2.  **Lock:** Facilitator collects bids. No changes allowed.
  3.  **Reveal (Conditional):** Facilitator makes announcements specific to the round.
  4.  **Open:** Students open envelopes.
  5.  **Record:** Facilitator writes the distribution of Bids on the Whiteboard (e.g., "Mean: $1.10, Range: $0.50–$1.80").
  6.  **Pay:** Facilitator notes payoffs (actual cash exchange happens at the very end to save time, but record the debt/credit).

  ### Round 1: The Comfort Zone (Equal Measure)
  *   **Physics:** $|\psi\rangle = \frac{1}{\sqrt{2}}|\text{Win}\rangle + \frac{1}{\sqrt{2}}|\text{Lose}\rangle$.
  *   **Physical:** 16 Envelopes. 8 contain "WIN", 8 contain "LOSE".
  *   **Instruction:** "The quantum state is symmetric. There are two outcomes."
  *   **Expectation:** Counting (8 vs 8) and Weighting (0.5 vs 0.5) agree.
  *   **Target Bid:** ~$1.00 (50% of $2 prize).
  *   **Debrief Note:** "Everyone feels safe here. Counting branches and squaring amplitudes give the same advice."

  ### Round 2: The Divergence (Unequal Weight, Equal Count)
  *   **Physics:** $|\psi\rangle = \sqrt{0.9}|\text{Win}\rangle + \sqrt{0.1}|\text{Lose}\rangle$.
  *   **Physical:** 16 Envelopes. **Still 8 "WIN", 8 "LOSE".**
  *   **Instruction:** "The machine was biased. The 'Win' outcome has 90% of the Hilbert Space measure. The 'Lose' outcome has 10%. But macroscopically, there are still just two outcomes represented in this room."
  *   **Conflict:**
      *   *Counting Intuition:* 8 envelopes vs 8 envelopes. Price should be $1.00.
      *   *Weighting Intuition:* 90% measure. Price should be $1.80.
  *   **Target:** Watch the room split. Physics students may lean $1.80; Phil students may lean $1.00.
  *   **Debrief Note:** "Here is the problem. If branching is just 'making copies', why does the amplitude matter? There are the same number of yous."

  ### Round 3: The Fine-Graining Reveal (Mid-Round Twist)
  *   **Physics:** Same state as Round 2, but $|\text{Win}\rangle$ is revealed to be a coarse-graining of 9 orthogonal micro-states.
  *   **Physical:** Bids are **already locked** from Round 2 logic (or run as a fresh Round 3 with the same envelopes but new info). *Recommendation: Run as fresh Round 3 with same 8/8 envelopes to get new data.*
  *   **Instruction:** "Before you open these, I must correct the record. The 'Win' detector actually has 9 internal micro-states that all register 'Win'. The 'Lose' detector has 1. There are technically 10 branches, not 2."
  *   **Physical Reveal:** Inside the 8 "WIN" envelopes, place cards labeled W1 through W8 (and note 2 are missing due to room size, but represent the 9). Inside "LOSE", label L1.
  *   **Conflict:**
      *   *Counting Intuition:* Now there are 10 branches. 9 Win, 1 Lose. Price should jump to $1.80.
      *   *Weighting Intuition:* Weight was already 0.9. Price stays $1.80.
      *   *The Trap:* Anyone who bid $1.00 in Round 2 based on "2 branches" is now inconsistent. They must admit "Branch Count" is ill-defined without a grain size.
  *   **Debrief Note:** "Counting requires a 'grain'. Weight does not. If your care depends on count, you are vulnerable to how I slice the pie."

  ### Round 4: The Irrelevant Device (Normalization)
  *   **Physics:** Local state same as Round 1 (0.5/0.5). Distant system branches into $10^6$ copies.
  *   **Physical:** 16 Envelopes. 8 Win, 8 Lose.
  *   **Instruction:** "A machine in the hallway just measured a spin and branched into one million copies. This does not affect your envelope. But the *total number of branches in the universe* has skyrocketed."
  *   **Conflict:**
      *   *Unnormalized Counting:* "I am 1 out of 1,000,016 branches. My chance is tiny." Bid should crash.
      *   *Weighting/Normalized:* "My local weight is still 0.5." Bid stays $1.00.
  *   **Debrief Note:** "Rational care should be local. If your bid dropped, you are treating probability as 'self-location in the multiverse' rather than 'measure of this branch'."

  ### Round 5: The Near-Null Branch
  *   **Physics:** $|\psi\rangle = \sqrt{1 - \epsilon}|\text{Win}\rangle + \sqrt{\epsilon}|\text{Lose}\rangle$ where $\epsilon = 10^{-100}$.
  *   **Physical:** 16 Envelopes. 1 "LOSE", 15 "WIN" (To simulate the rarity physically, though imperfect).
  *   **Instruction:** "The Lose branch has positive amplitude, but it is absurdly small. It exists."
  *   **Conflict:**
      *   *Zero-Tolerance:* "If it exists, I must care about it."
      *   *Continuity:* "As weight goes to zero, care should go to zero."
  *   **Debrief Note:** "Do you have a duty to your near-null descendants? If yes, how do you prioritize? If no, at what cutoff does 'existence' stop mattering?"

  ---

  ## 4. Whiteboard Analysis (Minutes 60–80)

  1.  **Plot the Bids:** Draw the 5 distributions.
  2.  **Return Care Functions:** Hand back the index cards from Minute 10.
  3.  **The Diagnostic:** Ask students to check their own Function against the Rounds.
      *   *Round 3 Check:* Does your function depend on $n$ (count)? If yes, did your bid change between R2 and R3? If not, why?
      *   *Round 4 Check:* Does your function depend on $N$ (total population)? If yes, did your bid drop in R4?
      *   *Round 2 Check:* Does your function depend on $w$ (weight)?
  4.  **Survivor Table:** Create a table on the board:

  | Care Policy | Survives R3 (Fine-Grain)? | Survives R4 (Irrelevant)? | Survives R5 (Null)? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pure Counting** ($C \propto n$) | ❌ (Wrecked by grain) | ❌ (Wrecked by N) | ✅ | **Incoherent** |
  | **Unnormalized Weight** | ✅ | ❌ (Diluted by N) | ✅ | **Incoherent** |
  | **Born Rule** ($C \propto w$) | ✅ | ✅ | ✅ | **Survivor** |
  | **Null-Care** ($C = 0$) | ✅ | ✅ | ✅ | **Solipsistic** |

  ---

  ## 5. The Debrief (Minutes 80–100)

  **Map the Moments:**
  *   **The Coupon Price:** Explain that this was not *credence* (belief about what will happen, since everything happens) but *caring* (weight of utility). In Everett, Probability = Caring Measure.
  *   **Round 2 (The Problem):** This is the "Incoherence Problem." If all outcomes occur, why act as if one is more likely?
  *   **Round 3 (The Solution):** This rules out "Branch Counting." Branches aren't discrete beads; they are continuous measures. Only Weight survives fine-graining.
  *   **Round 4 (Normalization):** This rules out "Self-Locating Uncertainty." You aren't lost in the multiverse; you are *all* of it. Care must sum to 1 locally.

  **Honesty About Limits (Crucial):**
  *   **What the Game Did:** It showed that *if* you accept the Hilbert Space weights as real properties, "Counting" is irrational. It filtered out bad care-functions.
  *   **What the Game Did Not Do:** It did not *derive* the Born Rule from non-probabilistic axioms. I (the Facilitator) *told* you the weights in Round 2. I rigged the game to reward Squared Amplitude.
  *   **The Live Debate:** The philosophical heavy lifting (Deutsch-Wallace Theorem) is trying to prove you *must* use Squared Amplitude *without* me telling you the weights beforehand. They try to derive the weights from Decision Theory alone. This game shows why you *need* such a derivation, but it doesn't provide it.
  *   **Addressing the Rigging:** "You might feel I forced the answer by announcing the weights. You are right. The next step in the reading group is to ask: Can we remove the Facilitator's announcement and still get the same result? That is the Decision-Theoretic derivation."

  ---

  ## 6. Failure Modes & Troubleshooting

  | Failure Mode | Symptom | In-the-Moment Fix | Debrief Co-option |
  | :--- | :--- | :--- | :--- |
  | **The Ignorance Interpretation** | "I just don't know which envelope I have." | "In Everett, you *do* have both. One copy has A, one has B. You are betting on how much you value the Copy with A." | Use this to distinguish *Uncertainty* (Single World) vs *Caring* (Many Worlds). |
  | **The "Big Branch" Fallacy** | "I'll just be the one in the 0.9 branch." | "You *are* the one in the 0.1 branch too. The question is: How much does the Pre-Branch You care about that 0.1 Copy?" | Highlight the "First-Personal" constraint. You cannot abandon your low-weight selves. |
  | **Groupthink / Herding** | Everyone bids $1.00 because the Phil students do. | Enforce anonymous bids. "I will not reveal individual names, only the distribution." | If distribution is narrow, note that "Intuition is culturally trained." |
  | **Physics Calculation** | Physics students compute amplitudes and ignore the game. | "Good. You are using the Born Rule. Now ask *why* you are allowed to do that." | Use them as the "Born Rule Anchor" for the discussion. |
  | **Facilitator Distrust** | "You're lying about the 0.9 weight." | "Assume for the sake of the game that QM is true. If QM is true, the weight is 0.9. Does your decision theory hold?" | Acknowledge: "The game assumes the formalism. The derivation tries to prove the formalism." |
  | **The Stalemate** | Room splits 50/50 on Bid in Round 2. | "Perfect. This is the current state of the field. Half of you are Counting, half Weighting." | Use the split to motivate the need for a Derivation (to break the tie). |

  ---

  ## 7. Facilitator Script Notes (Key Phrases)

  *   **On Stakes:** "The money is real, but small. The *argument* is the real stake. If your Care Function is wrong, you are irrational, not just poorer."
  *   **On Round 3:** "I am not changing the envelopes. I am changing your *description* of the envelopes. If your bid changes, your care depends on description, not reality."
  *   **On The Limit:** "We have ruled out Counting. We have not proven Weighting is the *only* option left. But it is the only one on the menu that survives the fine-graining test."

  ## 8. Budget Breakdown

  *   **Endowment:** 16 students × $2 = $32. (Facilitator provides this).
  *   **Max Liability:** If everyone Wins Round 1 (8 win) + Round 2 (8 win)...
      *   Actually, the Wager system is zero-sum relative to the endowment + bonus.
      *   Safest: Facilitator brings $50 cash.
      *   Pay out actual winnings at the end.
      *   Unspent cash is kept by Facilitator.
  *   **Alternative:** Use Chocolate. 32 Bars. Much easier to divide. (Recommended).

  ## 9. Why This Works for Your Group

  *   **Phil Students:** They get to feel the "Counting" intuition physically (8 envelopes) and then have it broken (Round 3). They stop treating Everett as abstract text.
  *   **Phys Students:** They get to use their amplitudes, but are forced to justify *why* they use them when the "Count" says otherwise. They confront the normative gap.
  *   **The "Run into it" Constraint:** By locking bids before the Fine-Graining reveal, those who relied on Counting *feel* the inconsistency personally. They aren't told they are wrong; their own bid betrays them.
