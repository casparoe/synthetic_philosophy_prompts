      *   The game needs to simulate *fission* without actual quantum mechanics (too hard/expensive/slow) but in a way that feels structurally identical to the participants.
      *   *Simulation of Branching:* We can't actually split people. We must simulate the *epistemic situation* of post-branching self-location uncertainty.
