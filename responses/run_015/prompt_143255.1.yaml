              2.  Break agreement (equal count, unequal weight).
              3.  Fine-graining reveal (retroactive wrecking of count-based policies).
              4.  Irrelevant-device round (distant branching shouldn't matter).
              5.  Near-null branch (tiny weight, exists).
          *   *Care-Function:* Participants explicitly write a function (care vs. weight/count/population). Test functions against constraints.
          *   *Debrief:* Map moments to problem features (caring vs. credence, fine-graining, etc.).
          *   *Honesty about Limits:* Acknowledge what the game *can't* do (derive the Born rule from non-probabilistic axioms). Address the "rigging" suspicion.
