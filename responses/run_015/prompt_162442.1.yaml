answer: |-
  **Scene:** *A foundation boardroom. A whiteboard displays the bet structure: $p=0.6$, even money, 20 rounds. Current capital: $1M. Target: $10M.*

  **Nadia:** The constraint is absolute. If we have $9.9 million on day twenty, the lighthouse isn't built. The mission fails. So we aren't maximizing wealth; we are maximizing the probability of crossing a threshold.

  **Owen:** And I'm telling you that maximizing the probability of a binary outcome is a trap if the underlying utility is linear. The beneficiaries don't care about the lighthouse as a fetish; they care about the welfare that money buys. If we end with $5 million, we build half a lighthouse or fund two smaller beacons. Expected dollars is the only coherent currency.

  **Nadia:** The charter says "build the lighthouse." Reputation is absorbing ruin. If we fail, we don't get to play again. That makes this a single trajectory problem. We live in time, not in an ensemble. If I bet the Kelly fraction—twenty percent—my expected log growth is 0.02 per round. Over twenty rounds, my median fortune is $1.5 million.

  **Owen:** Which misses the target by a factor of six.

  **Nadia:** Exactly. And that's the point I need you to grasp. The Kelly criterion maximizes the asymptotic growth rate. But the growth rate required to turn $1 million into $10 million in twenty steps is $\ln(10)/20$, which is 0.115 per round. Kelly only offers 0.02. We are in a large-deviation regime. Kelly is too conservative.

  **Owen:** So you admit Kelly fails the mission.

  **Nadia:** Kelly fails *this* mission because the mission demands a growth rate higher than the market's optimal sustainable yield. But don't mistake that for a vindication of your expected value maximization. If I bet everything every round, my expected terminal wealth is $38 million. But my probability of success is $0.6^{20}$. That's four in a hundred thousand. You're chasing a one-in-twenty-seven-thousand path where we end up with a trillion dollars. That's not strategy; it's a lottery ticket funded by certainty of ruin.

  **Owen:** But if we could pool this risk—say, a thousand foundations each putting in a thousand dollars into a shared fund—the law of large numbers kicks in. The ensemble average becomes the time average. In that limit, maximizing expected dollars *is* maximizing almost-sure wealth. Your objection to EV is merely an objection to under-diversification.

  **Nadia:** We aren't a thousand foundations. We are one. And because we are one, ruin is permanent. But here is where my own view needs correction. Suppose the target wasn't $10 million. Suppose we only needed $1.1 million to build a smaller shed.

  **Owen:** Then Kelly works?

  **Nadia:** No. To hit $1.1 million, I need a growth rate of $\ln(1.1)/20 \approx 0.005$ per round. Kelly provides 0.02. If I bet the Kelly fraction, I'm taking on variance I don't need. I should bet much less than Kelly to minimize the risk of dipping below the target while still drifting upward. Kelly is reckless for easy targets.

  **Owen:** So Kelly is too aggressive for easy goals, and too conservative for hard ones.

  **Nadia:** It seems Kelly is a phase boundary. It's the optimal strategy only when the required growth rate matches the maximum attainable growth rate. If the goal is easier, you dampen volatility. If the goal is harder—as with this lighthouse—you must increase volatility. You have to bet more than Kelly to have any shot at the tail event required to hit $10 million.

  **Owen:** But how much more? If I maximize expected dollars, I bet everything. You say that's suicidal. If you maximize growth rate, you bet twenty percent. You say that's futile. Where is the norm?

  **Nadia:** For a hard threshold, the norm is "bold play." We should bet enough to reach the target in the fewest possible wins, minimizing the exposure to the house edge over time, but not so much that a single loss eliminates us before we get lucky. Maybe we bet half our bankroll. That gives us a fighting chance—better than Kelly's two percent, better than All-In's zero percent.

  **Owen:** But that admits there is no universal "rational" bet size. It depends entirely on the distance to the cliff.

  **Nadia:** It depends on the relationship between the agent's objective and the environment's affordances. Kelly assumes the objective is "grow forever." EV assumes the objective is "average over many worlds." We are in one world, with a fixed deadline.

  **Owen:** Then let's be precise. My argument rests on the claim that the foundation represents an ensemble of potential beneficiaries. Even if this project fails, the expected value of the capital remains high, and that capital has linear utility elsewhere. You treat the lighthouse as the end of the world. I treat it as a line item.

  **Nadia:** And I treat the foundation's existence as the end of the world. If we miss the target, the donors leave. The institution dies. That makes the utility function step-like, not linear. But I concede this: if the target were low, my adherence to Kelly would be as irrational as your adherence to EV. Kelly is not a moral imperative; it's a mathematical solution to a specific growth problem.

  **Owen:** And I concede that if the utility function is truly binary—lighthouse or nothing—then maximizing expected dollars is disastrous. It optimizes for a universe we won't inhabit. The $38 million expectation is carried by worlds where we win twenty coin flips in a row. We won't live in that world.

  **Nadia:** So we agree the math is clear, but the norm is not.

  **Owen:** The norm depends on what we are averaging. You are averaging over time along a single path. I am averaging over probability space across many paths.

  **Nadia:** And the disagreement reduces to this: Is the foundation a single trajectory subject to absorbing ruin, or is it a vessel for expected value that can survive the failure of any particular project?

  **Owen:** Precisely. If we are the former, Kelly is just a benchmark, and we must deviate from it to match the target's difficulty. If we are the latter, EV is king, and the lighthouse constraint is merely a liquidity problem to be diversified away.

  **Nadia:** Then we aren't arguing about the bet size anymore. We're arguing about whether this foundation is allowed to die.

  **Owen:** And whether "rationality" means surviving this specific timeline, or maximizing the sum of value across all possible timelines.

  **Nadia:** I'll take the timeline we're in.

  **Owen:** And I'll take the expectation that funds the next one.

  *They stop writing. The whiteboard remains half-filled, the optimal fraction undefined.*
