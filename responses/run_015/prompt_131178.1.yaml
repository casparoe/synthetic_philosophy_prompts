answer: |-
  Grace be unto you. You propose a case of grave perplexity, touching upon the order of justice and the preservation of the multitude. Before I render my judgment on the specific circumstances you describe, I must, as you request, delineate the boundaries within which my reason operates and confess the weakness inherent in this mortal deliberation.

  **Regarding the Revision of Verdict:**
  My verdict that private removal is impermissible would remain intact regardless of the scale, aggregation, or legal form of the harms, so long as the ruler holds legitimate title (*tyrannus ab exercitio*). The only feature that would compel me to revise the verdict permitting resistance would be if the ruler were shown to lack legitimate title entirely (*tyrannus absque titulo*), becoming a usurper who has seized power by force or fraud against the will of the community and without divine or lawful sanction. Even then, private action is not automatically licit, but the prohibition against removing him is not absolute. Alternatively, if a superior authority (such as the Roman Pontiff in spiritual matters or an Emperor over a king, where such order exists) were to pronounce sentence of deposition, private persons acting under that public mandate would not be acting privately. But absent usurpation or superior command, the prohibition stands.

  **Regarding the Vulnerability of Reasoning:**
  The most vulnerable point in this reasoning lies in the presumption that the community retains the capacity to act publicly. If the tyrant's incremental destruction so terrifies the multitude that they cannot gather consent, or if his legalistic cunning obscures his tyranny such that the community fails to recognize the danger until it is too late, my remedy—public authority acting against the tyrant—becomes a theoretical impossibility. Thus, the prohibition on private action risks becoming an instrument of prolonged martyrdom for the innocent, relying on a public remedy that the tyrant's very method has rendered inert.

  ***

  Now, I respond to your case.

  You ask whether this ruler is a *tyrannus ab exercitio* and whether the temporal distribution of harms licenses private removal.

  I say that he is indeed a tyrant by exercise (*tyrannus ab exercitio*). For the end of rulership is the common good, and if a ruler directs the community to his own private whim—even if cloaked in the form of law—he perverts the ordinance of justice. That he kills slowly rather than swiftly, and by legal decree rather than open violence, does not change the moral species of the act: it is the destruction of the innocent, which is contrary to the natural law and the divine law. The aggregation of these harms confirms that his will is opposed to the welfare of the multitude.

  However, regarding the second part of your question: Does this justify private removal? I answer in the negative. The prohibition remains intact.

  My reasoning is thus:
  First, to kill a ruler, even a wicked one, is to usurp a judgment that belongs not to private individuals but to public authority. As it is written in the Epistle to the Romans, "There is no power but of God." If the title is legitimate, the authority is derived from God, however poorly exercised. A private person taking up the sword against such a one sets himself above the order established for the peace of the community.

  Second, the legal form and temporal distribution, while they reveal the cunning of the tyrant, do not transfer the right of judgment to the private subject. Indeed, these features make the judgment *more* difficult, requiring a discernment of the common good over time, which is the function of the community or its representatives, not of a single arm.

  Third, and most weightily, we must consider the risk of greater disorder. If private persons are licensed to kill a legitimate ruler based on their own assessment of aggregated harms, every faction may claim their ruler is tyrannical. This leads to sedition, which is a most grievous sin, for it destroys the unity of the multitude. It is better to suffer a tyrant for a time than to plunge the community into civil strife, unless the tyranny becomes so manifest and excessive that it threatens the very existence of the community. Yet even then, the action must be public, not private.

  Since you state there is no superior authority, the recourse lies with the community itself. If the community, or its greater part, can genuinely consent to depose him without causing greater ruin, this may be done. But this is an act of public authority, not private assassination. Until the community acts, the private person must endure, commending justice to God, who is the ultimate judge of the living and the dead.

  Therefore, the temporal distribution and legal form do not change the prohibition. The ruler remains a legitimate authority corrupted in exercise, and private removal remains illicit.
