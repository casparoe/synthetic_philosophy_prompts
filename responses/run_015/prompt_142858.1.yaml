prompt: |-
  Nothing I have tried gets students to feel the frame problem. They read the counting argument about how much has to be said, agree that it is inelegant, and go back to thinking the real difficulty is that the world is messy and that a faster machine with better sensors would take care of it. I want an activity that takes that reading away from them by having them run into it at a table.

  Setting: one 90-minute session of an upper-division seminar on philosophical problems of artificial intelligence, 18 students, roughly half computer science and half philosophy, one whiteboard wall, a projector, and index cards, dice, sticky notes, and a timer. My plan was six teams of three; tell me if the game you design wants a different arrangement.

  What they should come away seeing: that saying what an action changes looks like it requires saying what the action leaves alone; that which of your standing beliefs deserves re-examination is itself a question you have to answer before you can answer it; and that there is no way of writing the dynamics down that is cheap to write, cheap to revise when a new action appears, and cheap to revise when a new fluent appears — you can have some of that but not all of it.

  Constraints on the design:

  - No lecture first, and no advance hinting. I would rather they not hear the name of the problem until they have already argued about it.
  - A small, fully closed world: something like a studio apartment or a lab bench with a fixed list of fluents (15 to 25, say) and a fixed list of actions (5 to 8), with the causal rules on cards so that a "physics binder" is the only court of appeal. Students will otherwise smuggle in real-world physics and quietly supply the answers the activity is supposed to deny them.
  - A ramp rather than one big exercise. My instinct is three phases over the same world: first, write down what each action does; then discover that what an action does depends on what else is true, so effect statements need conditions; then maintain a belief board across turns while receiving only one observation per turn, so that deciding what to re-check becomes a real decision under scarcity. Propose a different ramp if a different one isolates the problem better.
  - Scoring I can tally in the room, with no money involved, arranged so that compactness and repairability move in opposite directions. Specifically: when I add a new action mid-game, and then when I add a new fluent mid-game, the teams should be able to see in their own totals that the encoding which survived one revision cheaply is the one that gets punished by the other. If you think that asymmetry is the wrong thing to build toward, say so and build toward the right thing.
  - Two deliberate complications planted in the rule set: one action whose effect is deferred and can be cancelled by something that happens later, and one fluent that no action changes directly but that several actions change indirectly.

  What I need from you:

  - The world: the fluent list, the action list, and enough of the causal rules that every turn has a determinate answer, with the two complications visible in them.
  - Rules, turn order, materials, and the payoff scheme, plus one worked turn showing how a team's score is computed.
  - The exact instructions I hand out at the start of each phase, and what I withhold until later.
  - A debrief that maps particular moments in the game onto particular parts of the problem, including the arithmetic on how much has to be said under each encoding, the difference between writing down changes and deciding what to re-derive, and the revision-direction asymmetry.
  - What will predictably go wrong on a first run. I expect common-sense smuggling, teams that over-flag everything after the first surprise and then under-flag after the second, one team that finishes in ten minutes because it found a degenerate strategy, and at least one student who concludes that the whole exercise is an artifact of rules I invented. Tell me how to handle each, and give me the short answer I should have ready for "why can't the agent just look?" — including why that reply starts a regress rather than ending the discussion.
  - Honesty about the limits: which feature of the problem is irreducibly a claim about the form of a representation or about the architecture of a real cognizer, and therefore has to be supplied by me in the last ten minutes instead of discovered by the teams.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Make students *feel* the Frame Problem (specifically the representational and revision aspects, not just computational complexity).
      *   **Audience:** 18 upper-division students (half CS, half Philosophy).
      *   **Setting:** 90-minute seminar, specific materials (whiteboard, projector, cards, dice, sticky notes, timer).
      *   **Constraints:** No lecture first, closed world (studio/lab), ramped phases (write effects -> add conditions -> belief maintenance/revision), scoring that trades off compactness vs. repairability (new action vs. new fluent), specific complications (deferred/cancellable action, indirectly changed fluent).
      *   **Deliverables:** World definition, rules/scoring, phase instructions, debrief plan, troubleshooting (what goes wrong), and honesty about limits.

  2.  **Deconstruct the Frame Problem for this Context:**
      *   *The Core Issue:* It's not just "too many facts." It's that representing change requires representing non-change. If I list what changes, I implicitly assume everything else stays the same. But how do I justify that assumption without checking everything?
      *   *The Trade-off:*
          *   *Strategy A (Explicit Frame Axioms):* For every action $A$ and every fluent $F$, write "$A$ does not change $F$." Safe, but $O(N \times M)$ size. Hard to update when new fluents appear.
          *   *Strategy B (Causal Rules Only):* Write only "$A$ changes $F$." Assume everything else stays same by default. Compact ($O(K)$ where $K$ is actual effects). But hard to verify consistency when new interactions arise (qualification problem/ramification problem).
      *   *The Activity Goal:* Force them to choose a representation strategy, then hit them with updates that punish their specific choice.

  3.  **Designing the "World" (The Closed System):**
      *   Needs to be small enough to manage but complex enough to create interactions.
      *   *Setting:* A "Smart Lab Bench."
      *   *Fluents (15-25):* Need a mix of independent, dependent, and tricky ones.
      *   *Actions (5-8):* Need to cover the complications.
      *   *Complication 1 (Deferred/Cancelable):* "Prime Reactor" -> "Reactor Primed". If "Coolant Leak" happens before "Fire Reactor", the priming is cancelled.
      *   *Complication 2 (Indirect/Ramification):* "Temperature High". No action sets this directly. But "Fire Reactor" or "Overload Circuit" causes it.
      *   *Fluent List:*
          1.  Light On
          2.  Door Locked
          3.  Vent Open
          4.  Robot Arm Extended
          5.  Robot Arm Holding Object
          6.  Object is Fragile
          7.  Reactor Primed (Deferred)
          8.  Reactor Active
          9.  Coolant Flowing
          10. Temperature High (Ramification)
          11. Alarm Silent
          12. Power Grid Stable
          13. Emergency Brake Engaged
          14. Safety Protocol Active
          15. Log Entry Pending
      *   *Action List:*
          1.  Toggle Light
          2.  Lock/Unlock Door
          3.  Extend Arm
          4.  Grab Object
          5.  Prime Reactor (Deferred effect: sets 'Reactor Primed')
          6.  Fire Reactor (Requires 'Reactor Primed'. If 'Coolant Flowing' is false, cancels Primed and sets 'Temp High')
          7.  Toggle Coolant
          8.  Reset Alarm

      *Refinement:* To make the scoring work (New Action vs. New Fluent), the representation needs to be tangible. Sticky notes on a whiteboard grid?
      *   *Grid:* Rows = Fluents, Columns = Actions.
      *   *Marking:* A sticky note means "Action Changes Fluent".
      *   *Scoring:*
          *   *Upkeep Cost:* Number of sticky notes (penalizes explicit frame axioms).
          *   *Error Penalty:* If the world state is wrong after a turn (penalizes assuming too much).
          *   *Update Cost:* When I add a row (New Fluent) or column (New Action), how many new notes do you have to write?

  4.  **Developing the Phases (The Ramp):**
      *   *Phase 1 (Naive):* Just list effects. "Toggle Light" changes "Light On". Assume everything else stays same.
      *   *Phase 2 (Qualification/Context):* Introduce the "Reactor" complication. "Fire Reactor" only works if "Primed". Now effects depend on state.
      *   *Phase 3 (The Squeeze):* Belief maintenance under scarcity. They get one observation per turn. They must decide which fluents to check. If they assume a frame axiom (it didn't change) and they are wrong, they lose points. If they check everything, they run out of "observation tokens."

      *Critique of Phase 3:* The prompt asks for scoring where "compactness and repairability move in opposite directions." The belief maintenance phase is good for the "what to re-examine" insight. The scoring needs to reflect the *representation* cost.
      *   *Revised Scoring Model:*
          *   Teams build a "Rule Book" (Index cards/Sticky notes).
          *   *Cost 1 (Size):* Total number of rules written down.
          *   *Cost 2 (Update Shock):* When I introduce New Action X, how many rules must you add? When I introduce New Fluent Y, how many rules must you add?
          *   *Cost 3 (Simulation Error):* Getting the state wrong during play.

      *Let's simplify for a 90-minute session.*
      *   *Phase 1:* Build the matrix. (Action x Fluent). Mark changes.
      *   *Phase 2:* Play 3 turns. Verify state.
      *   *Phase 3:* **The Twist.** I add a New Action. Update your matrix. Pay cost.
      *   *Phase 4:* **The Twist.** I add a New Fluent. Update your matrix. Pay cost.
      *   *Phase 5:* **The Scarcity.** You can only verify 3 fluents per turn. Which ones?

      *Wait, the prompt asks for:* "deciding what to re-check becomes a real decision under scarcity."
      *   Okay, let's integrate the scoring into the gameplay.
      *   *Representation:* Teams choose how to encode rules.
          *   *Option A (Frame Axioms):* Write "Action A does NOT change Fluent F" for most cells.
          *   *Option B (Causal Only):* Write "Action A CHANGES Fluent F" only for effects. Assume rest are static.
      *   *The Trap:*
          *   If Option A: High initial writing cost. Low cost when New Fluent added (just write "New Fluent unchanged by all actions"). High cost when New Action added (must write "New Action leaves all Fluents unchanged").
          *   If Option B: Low initial cost. High risk of error if implicit assumptions fail (Ramification).
      *   *Actually, the classic Frame Problem trade-off is:*
          *   *Explicit Frame Axioms:* $O(A \times F)$. Adding a new Action costs $O(F)$. Adding a new Fluent costs $O(A)$.
          *   *Causal Only (with default inertia):* $O(\text{effects})$. Adding a new Action costs $O(1)$ (usually). Adding a new Fluent costs $O(1)$ (usually). *BUT* you risk being wrong about the inertia if there are hidden interactions (Ramifications).
      *   *To make them feel the pain:* I need to force them to *verify* the inertia.
      *   *Mechanism:* "Verification Tokens." They have limited tokens to check if a fluent actually stayed the same. If they assume inertia without a token, and I reveal a hidden ramification, they lose big points.

  5.  **Refining the World & Rules for the "Feel":**
      *   *World:* "The Containment Cell."
      *   *Fluents (20):* Switches, Lights, Locks, Pressure, Temp, etc.
      *   *Actions (6):* Flip Switch, Open Vent, etc.
      *   *Hidden Rules (The Trap):*
          1.  *Ramification:* Opening Vent changes Pressure (not direct).
          2.  *Qualification:* Flip Switch only works if Power is On.
      *   *Scoring:*
          *   *Writing Cost:* 1 point per rule card written.
          *   *Verification Cost:* 1 token per fluent checked per turn.
          *   *Error Penalty:* 10 points if state is wrong.
          *   *Update Event:* Mid-game, add Action 7. Mid-game, add Fluent 21.

      *Wait, I need to ensure the asymmetry is visible.*
      *   If they write Frame Axioms (A doesn't change F):
          *   Add New Action: Must write $F_{1..20}$ axioms for new Action. (High Cost).
          *   Add New Fluent: Must write $A_{1..6}$ axioms for new Fluent. (Med Cost).
      *   If they write Causal Rules (A changes F):
          *   Add New Action: Write only effects. (Low Cost).
          *   Add New Fluent: Write only causes. (Low Cost).
          *   *BUT:* They must *check* the non-effects. If they don't check, they miss the Ramification.
      *   *The Insight:* To avoid checking everything (which is expensive), you need a smart representation. But the smart representation is brittle to updates.

      *Let's align with the Prompt's specific request:* "compactness and repairability move in opposite directions."
      *   *Encoding 1 (Matrix of Change):* Mark X where Action changes Fluent. (Compact).
          *   *Vulnerability:* When New Fluent arrives, you don't know if old Actions change it. You have to check/test all old Actions against new Fluent.
      *   *Encoding 2 (Matrix of Stasis):* Mark O where Action leaves Fluent alone. (Expensive).
          *   *Vulnerability:* When New Action arrives, you have to assert it leaves all Fluents alone.
      *   *Actually, the classic asymmetry is:*
          *   Frame Axioms (Explicit Stasis): Cheap to add Fluents (just say new fluent is unaffected by existing actions), Expensive to add Actions (must say new action affects nothing).
          *   Causal Rules (Explicit Change): Cheap to add Actions (just list effects), Expensive to add Fluents (must check if existing actions affect new fluent).
      *   *Wait, is that right?*
          *   If I use Causal Rules: "A1 changes F1".
          *   Add Action A2: I write "A2 changes F3". Done. (Cheap).
          *   Add Fluent F100: Does A1 change F100? I don't know. I have to check A1..An against F100. (Expensive).
          *   If I use Frame Axioms: "A1 does not change F2..F100".
          *   Add Action A2: I must write "A2 does not change F1..F100". (Expensive).
          *   Add Fluent F100: I must write "A1..An does not change F100". (Expensive).
      *   *Okay, the prompt wants:* "encoding which survived one revision cheaply is the one that gets punished by the other."
      *   *Solution:* Force them to commit to a *documentation strategy* on the whiteboard.
      *   *Strategy A (Change Lists):* For each Action, list affected Fluents.
      *   *Strategy B (Stasis Lists):* For each Action, list unaffected Fluents. (Absurd, but illustrates the point).
      *   *Better Strategy B (Default Stasis):* Assume stasis unless marked. (This is the standard AI solution).
      *   *The Punishment:*
          *   Phase 1: Build model.
          *   Phase 2: Add New Action. Strategy A wins (only list new effects). Strategy B loses (must certify new action touches nothing).
          *   Phase 3: Add New Fluent. Strategy A loses (must check all actions against new fluent). Strategy B wins (just declare new fluent is static).
      *   *Wait, Strategy B (Default Stasis) is what we want them to realize is necessary but problematic.*
      *   *Let's make the scoring about "Verification Debt".*
      *   If you assume Stasis (Strategy A - Change Lists), you save writing. But when a New Fluent appears, you have a "Verification Debt" - you must prove old actions don't touch it.
      *   If you assume Explicit Stasis (Strategy B), you pay writing upfront. But when New Fluent appears, you just copy-paste the stasis rule.

      *Okay, let's finalize the Game Mechanics.*
      *   **Teams:** 6 teams of 3.
      *   **Board:** 6 Whiteboard sections (or 6 large sheets of paper).
      *   **Materials:** Sticky notes (Red = Change, Blue = No Change/Frame Axiom), Markers.
      *   **Phase 1:** Define the 6 Actions and 15 Fluents. Write rules.
      *   **Phase 2:** Simulation. I call out an action sequence. Teams update state.
      *   **Phase 3 (The Update):** I introduce "Action 7". Teams update rules. Score based on sticky notes added.
      *   **Phase 4 (The Update):** I introduce "Fluent 16". Teams update rules. Score based on sticky notes added.
      *   **Phase 5 (The Scarcity):** I run a simulation. Teams have 3 "Probe Tokens" per turn to verify fluents. If they assume a fluent didn't change (Frame Assumption) and it did (Ramification), they crash.

  6.  **Addressing the Complications:**
      *   *Deferred/Cancelable:* "Arm Charge" (Action). "Arm Fire" (Action). If "Safety Lock" (Fluent) is active between Charge and Fire, Charge is lost.
      *   *Indirect:* "Noise Level". Action "Drop Object" doesn't list Noise. But if "Floor is Metal" (Fluent), Noise goes up.

  7.  **Drafting the Content:**
      *   *World:* "The Isolation Chamber."
      *   *Fluents:* Door, Light, Cam, Mic, Temp, Pressure, Power, Battery, Lock, Alarm, etc.
      *   *Actions:* Enter, Exit, Toggle Light, Calibrate Cam, Vent, Seal, Reset.
      *   *Scoring:* "Ink Cost" (Writing rules) vs. "Error Cost" (Wrong state).
      *   *Updates:* Add "Sweep" action. Add "Humidity" fluent.

  8.  **Troubleshooting & Limits:**
      *   *Smuggling:* Students will use real physics. *Counter:* "The Physics Binder is the only truth. If it's not on a card, it doesn't exist."
      *   *Degenerate Strategy:* "Check everything." *Counter:* Limit tokens/time.
      *   *Artifact Complaint:* "This is just a bad database." *Counter:* Acknowledge, but point to the cognitive cost of *knowing* what to check.
      *   *Why not look?* Sensors are noisy/costly. Looking requires knowing *what* to look at (the perceptual frame problem).

  9.  **Refining the Debrief:**
      *   Connect the "Ink Cost" to representational complexity.
      *   Connect the "Probe Tokens" to the qualification problem/relevance.
      *   Show the math: $N \times M$ vs $K$.

  10. **Final Review against Constraints:**
      *   90 mins? Tight. Need strict timing.
      *   No lecture first? Yes.
      *   Scoring asymmetry? Yes (Action update vs Fluent update).
      *   Complications included? Yes.
      *   Limits honesty? Yes.

      *(Self-Correction during drafting)*: Make sure the "New Fluent" update actually punishes the "Change List" strategy.
      *   If I use Change Lists: "Action 1 changes F1, F2".
      *   New Fluent F100 arrives. Does Action 1 change F100? My list doesn't say. I must investigate Action 1.
      *   If I use Frame Axioms: "Action 1 does not change F3...F99".
      *   New Fluent F100 arrives. I add "Action 1 does not change F100" to the list.
      *   *Wait, the prompt says:* "encoding which survived one revision cheaply is the one that gets punished by the other."
      *   Okay, I will structure the scoring so that one method is cheap for Action updates but expensive for Fluent updates, and vice versa.
      *   *Method 1 (Causal):* List effects.
          *   New Action: Cheap (list its effects).
          *   New Fluent: Expensive (must check all existing actions to see if they affect it).
      *   *Method 2 (Frame):* List non-effects.
          *   New Action: Expensive (must list all fluents it doesn't affect).
          *   New Fluent: Cheap (list all actions that don't affect it).
      *   *Perfect.* This is the trade-off I will build.

      *Wait, one more thing:* The prompt asks for "deciding what to re-check becomes a real decision under scarcity." This implies a gameplay element where they *verify* the state.
      *   I will add a "Verification Phase" where they spend tokens to check fluents. If they rely on their Frame Axioms (Method 2) they spend fewer tokens. If they rely on Causal (Method 1), they must check more to be safe.
      *   *Actually, keep it simpler.* The "Verification" is the cost.
      *   Let's stick to the "Ink Cost" for the representation update, and "Error Penalty" for getting the state wrong during the simulation.
      *   The "Scarcity" comes from the 90-minute limit + the Update Phases. They can't rewrite everything.

      *Let's finalize the "Complications".*
      *   *Deferred:* "Charge Weapon". Effect: "Weapon Charged". Action "Fire Weapon" consumes "Weapon Charged". If "Safety" is turned on while Charged, "Weapon Charged" is lost.
      *   *Indirect:* "Room Pressure". Action "Open Vent" changes "Vent Status". Rule: If "Vent Status" = Open, "Room Pressure" = Normal. (Ramification).

      *Okay, ready to write.*
answer: |-
  # Activity Design: The Isolation Chamber

  ## 1. The World (The Physics Binder)
  **Setting:** A sealed laboratory room ("The Chamber").
  **Materials:** You (the instructor) hold the "Master Binder." It contains the absolute truth of the world. Students only know what they write down or observe.

  **Fluents (15 Total):**
  1.  Door Locked
  2.  Light On
  3.  Camera Recording
  4.  Mic Active
  5.  Vent Open
  6.  Room Pressure High
  7.  Power Grid Stable
  8.  Battery Charged
  9.  Weapon Charged (Deferred)
  10. Weapon Safe (Qualifier)
  11. Alarm Silent
  12. Floor Wet
  13. Robot Docked
  14. Robot Holding Item
  15. Item Fragile

  **Actions (6 Initial):**
  1.  **Toggle Light:** Changes *Light On*.
  2.  **Lock Door:** Changes *Door Locked*.
  3.  **Open Vent:** Changes *Vent Open*. *(Complication 2: Ramification)* If *Vent Open* becomes True, *Room Pressure High* becomes False.
  4.  **Charge Weapon:** Changes *Weapon Charged* to True. *(Complication 1: Deferred)* Effect persists until fired or cancelled.
  5.  **Toggle Safety:** Changes *Weapon Safe*. *(Complication 1: Cancel)* If *Weapon Safe* becomes True while *Weapon Charged* is True, *Weapon Charged* becomes False immediately.
  6.  **Dock Robot:** Changes *Robot Docked*. If *Robot Docked* becomes True, *Robot Holding Item* becomes False.

  **The Updates (Prepared in advance, revealed mid-game):**
  *   **New Action:** `7. Purge Air`. Changes *Room Pressure High* to False. (Also affects *Mic Active* due to vacuum—hidden rule).
  *   **New Fluent:** `16. Humidity High`. (Affected by `Open Vent` and `Floor Wet`—hidden rule).

  ---

  ## 2. Rules, Turn Order, and Payoff Scheme

  **Team Setup:** 6 Teams of 3.
  **Materials per Team:** 1 Whiteboard section (or large poster), Red Sticky Notes (Change Rules), Blue Sticky Notes (Frame/Stasis Rules), Black Marker, 20 "Verification Tokens" (poker chips or dice).

  **The Goal:** Maintain an accurate model of the Chamber's state on your board while minimizing "Cost."

  **Scoring (Tally at the end):**
  1.  **Ink Cost:** Every Sticky Note on your board = **1 Point**.
  2.  **Update Shock:** When a New Action/Fluent is introduced, every *new* Sticky Note you must add to integrate it = **2 Points**.
  3.  **State Error:** At the end of each Phase, I reveal the true state. Every Fluent your team has wrong = **5 Points**.
  4.  **Verification:** To check a Fluent's true state during play, spend 1 Token. (Total 20 tokens for the whole game). If you don't spend a token, you must rely on your Sticky Notes (Inference).

  **Winning:** Lowest Total Score.

  **Worked Turn Example:**
  *   *Current State:* Light On (T), Door Locked (F).
  *   *Team Rule:* Red Note on Action `Toggle Light` / Fluent `Light On`. No Blue Notes.
  *   *Action:* I announce `Toggle Light`.
  *   *Team Inference:* They flip `Light On` to False based on Red Note. They assume `Door Locked` stays False (Implicit Inertia).
  *   *Verification:* They spend 1 Token to check `Door Locked`. It is still False. No Error.
  *   *Cost:* 1 Token spent. 0 Ink. 0 Error.
  *   *Alternative:* If they had a Blue Note (`Toggle Light` does not change `Door Locked`), they wouldn't need to spend the Token. Cost: 1 Ink, 0 Tokens.

  ---

  ## 3. Phase Instructions (The Ramp)

  **Phase 1: The Naive Model (20 Minutes)**
  *   **Instruction:** "You are programming the Chamber's controller. Write down the rules for Actions 1-6 and Fluents 1-15. You may use Red Notes (Action X changes Fluent Y) or Blue Notes (Action X does NOT change Fluent Y). You start with 20 Verification Tokens. I will run 3 turns. Minimize Ink Cost and State Errors."
  *   **Withhold:** Do not tell them about the Ramification (Vent/Pressure) or the Deferred Cancel (Weapon/Safety). Let them assume simple causality.
  *   **Goal:** Most will use only Red Notes (Causal Rules) to save Ink. They will assume implicit inertia for everything else.

  **Phase 2: The Ramification Shock (20 Minutes)**
  *   **Instruction:** "Run 3 more turns. I have added hidden physical interactions to the Binder." (Execute `Open Vent` and `Charge Weapon` sequences).
  *   **The Trap:** When `Open Vent` happens, `Room Pressure` changes. Teams with only Red Notes (listing direct effects) will miss this unless they spend Tokens to check Pressure. Teams that spent Tokens run low. Teams that wrote Blue Notes (Frame Axioms) for Pressure vs Vent are safe but paid high Ink.
  *   **Goal:** Force them to realize implicit inertia is dangerous. They must either write more Blue Notes (Ink Cost) or spend more Tokens (Scarcity).

  **Phase 3: The Update Asymmetry (30 Minutes)**
  *   **Instruction:** "System Upgrade. I am adding Action 7 (`Purge Air`). Update your boards. Then, I am adding Fluent 16 (`Humidity High`). Update your boards."
  *   **The Trap:**
      *   *Teams with Red Notes (Causal):* Adding Action 7 is cheap (just list its effects). Adding Fluent 16 is expensive (they must check Actions 1-7 to see if they affect Humidity, requiring Ink or Tokens).
      *   *Teams with Blue Notes (Frame):* Adding Action 7 is expensive (must write Blue Notes for all 16 Fluents). Adding Fluent 16 is cheap (just write Blue Notes for Actions 1-7 saying they don't affect it).
  *   **Goal:** Make the trade-off visible in their scores. One update punishes compactness; the other punishes completeness.

  **Phase 4: The Scarcity Crunch (20 Minutes)**
  *   **Instruction:** "Final Simulation. 5 Turns. You have remaining Tokens only. No new Ink allowed."
  *   **Goal:** They must decide *what to re-check*. This isolates the "relevance" problem. They cannot check everything. They must guess which fluents are likely to have changed based on their flawed model.

  ---

  ## 4. Debrief Plan (Last 10 Minutes)

  **1. Map the Moments:**
  *   **Phase 1 (Red Notes):** "You chose compactness. You assumed inertia. This is the standard AI solution (Situation Calculus with completion)."
  *   **Phase 2 (Ramification):** "You got penalized for not checking `Pressure`. Why? Because change ripples. To be safe, you'd need a Blue Note for every Action/Fluent pair. That's $N \times M$."
  *   **Phase 3 (Updates):** "Look at your Update Shock scores. Team A (Causal) paid little for New Action, huge for New Fluent. Team B (Frame) paid huge for New Action, little for New Fluent."
  *   **The Arithmetic:** Write on the board:
      *   *Causal Encoding:* Size = $K$ (actual effects). Update Action = $O(1)$. Update Fluent = $O(N)$ (must check all actions).
      *   *Frame Encoding:* Size = $N \times M$. Update Action = $O(M)$. Update Fluent = $O(N)$.
      *   *Conclusion:* "There is no representation that is cheap to write, cheap to fix when actions change, AND cheap to fix when fluents change."

  **2. The "Why Not Look?" Question:**
  *   **Student:** "Why didn't we just use sensors to check everything?"
  *   **Your Answer:** "You had 20 Tokens for 30 turns. That's scarcity. In the real world, processing sensory data is computationally expensive. But deeper: To *use* a sensor, you must point it. To point it, you must decide *which* fluent might have changed. That decision *is* the Frame Problem. You can't solve the Frame Problem with sensors because you need the solution to decide where to aim the sensors." (The Regress).

  **3. Honesty About Limits:**
  *   **What they didn't find:** The game simulates the *logical* frame problem (qualification/ramification). It does not fully simulate the *cognitive* frame problem (how humans effortlessly ignore irrelevant details).
  *   **The Gap:** "You struggled because I forced you to be explicit. Humans use heuristic relevance. We don't solve the Frame Problem; we evolved to not notice most of the world. AI needs a formal solution because it has no instincts. That is the architectural claim I am making in the last 5 minutes: Logic requires explicitness; Cognition relies on implicit bias."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. Common-Sense Smuggling**
  *   *Symptom:* A team claims `Toggle Light` obviously doesn't change `Door Locked` without writing a rule.
  *   *Fix:* "The Binder is the only physics. If it's not on a sticky note, the robot doesn't know it. If you didn't write it, and I say the Door unlocked, you take the Error Penalty."
  *   *Prevention:* Be ruthless in Phase 2. Penalize implicit knowledge.

  **2. The Degenerate Strategy (The "Check Everything" Team)**
  *   *Symptom:* One team spends all 20 Tokens in Phase 1.
  *   *Fix:* They will fail Phase 4 (Scarcity Crunch). Highlight this in debrief: "They bought safety with a resource they ran out of. Real agents have bounded compute forever, not just for one game."

  **3. The "Artifact" Complaint**
  *   *Symptom:* "This is just a bad database schema. Use a different logic."
  *   *Fix:* "Agreed. Circumscription, Event Calculus, and Neural Nets are attempts to fix the schema. But the underlying trade-off remains: Explicitness costs space; Implicitness risks error. The problem isn't the tool; it's the world's complexity."

  **4. Over-Flagging then Under-Flagging**
  *   *Symptom:* After Phase 2, teams write Blue Notes for everything. Then in Phase 3, they run out of time/space.
  *   *Fix:* This is the intended pain. Let them feel the board fill up. "This is the combinatorial explosion. You ran out of wall."

  **5. "Why can't the agent just look?" (The Regress)**
  *   *Preparation:* Have this ready verbatim.
  *   *Reply:* "Looking is an action. `Check(Door)` takes time and energy. If you have to `Check()` 10,000 fluents after every `Walk()`, you never act. You need a theory to tell you which 5 fluents to check. Building that theory *is* solving the Frame Problem."

  ---

  ## 6. Instructor Prep Checklist

  *   **Master Binder:** Write the 15 Fluents and 6 Actions on cards. Mark the hidden interactions (Vent->Pressure, Safety->Weapon) on a separate sheet only you see.
  *   **Update Cards:** Prepare `Action 7` and `Fluent 16` cards. Decide their hidden interactions beforehand (e.g., `Purge Air` breaks `Mic Active`; `Humidity` rises if `Vent Open` AND `Floor Wet`).
  *   **Timer:** Strict 20/20/30/20 split. Use a visible projector timer.
  *   **Scoring Sheet:** A simple grid to tally Ink, Updates, and Errors for each team quickly.
  *   **Whiteboard:** Divide into 6 zones before class starts.

  ## 7. Why This Works (Theoretical Alignment)
  *   **No Lecture First:** They build the "Causal Only" model because it's natural. They discover the cost of inertia themselves.
  *   **Closed World:** The Binder prevents "real physics" from saving them.
  *   **Asymmetry:** The Update Phase explicitly targets the $O(N)$ vs $O(M)$ trade-off of representation.
  *   **Scarcity:** The Token limit forces the "Relevance" decision. They cannot verify everything, so they must guess what matters. That guess is the Frame Problem.
  *   **Limits:** The debrief acknowledges that the game is a logical proxy for a cognitive/architectural issue, preventing the "it's just a puzzle" dismissal.
