prompt: |-
  I lead a small evaluation group that is about to spend eighteen months building a Bongard-style benchmark of few-shot visual concept induction — the format in which a solver is shown six figures on one side that share a rule and six on the other that violate it, and must state or apply the rule that separates them. Two of my six people are conceptually rather than empirically trained: they read ML papers, specify tasks, and analyse results, but they will not be training or fine-tuning models. The benchmark specification freezes in about four months, so I have to decide now what those two work on, and in what order, because their answers should change how the benchmark is built: what ground truth gets stored, which diagnostics ship alongside accuracy, whether we produce matched variants of each item at all.

  The space as I currently see it has these pieces: with twelve examples, infinitely many rules separate the two sets, and accuracy on held-out items drawn from the same generator cannot tell us whether a system found the intended rule or merely one that happens to hold in that generator's accidental regularities — palette, stroke width, layout artefacts, the renderer's habits. Separately, a failure on any given item could be a perceptual failure, a failure to search over candidate rules, or a failure to check a candidate rule against what was perceived, and it is not obvious to me which dominates or how to tell them apart without training anything. And it is not obvious what the target is: an inductive bias resembling ours, or something like the correct rule under changes of surface realization, and these can come apart if human solvers are themselves relying on accidental regularities.

  Two operationalizations I keep circling: first, cross-renderer adjudication — generate the same rule under a second, deliberately different surface generator, breaking the accidental correlations while preserving the intended one, and score transfer between the two; second, composition and negation transfer — take two rules a system has already solved, and test it on items requiring their conjunction or the complement of one, on the thought that genuine concept possession should be compositional in a way that pattern matching is not.

  I do not want a survey of the area and I do not want papers to read. I want a defended priority ordering of three or four questions for those two people, each with: what it is upstream of and which design decision it settles before the spec freezes; whether it is tractable for people who will not run experiments; whether it is neglected relative to its leverage; and what empirical result over the coming year would move it up or down the list. Say explicitly where you would trade tractability for importance and where you would not. If one of my two operationalizations is a distraction, or is settled by an argument I have not considered rather than by an experiment, say so and say why.

  Attach a confidence estimate to each of your ordering claims, and single out the recommendation you are least confident in, with the observation that would most quickly dislodge it.
reasoning: |-
  Here's a thinking process that leads to the suggested priority ordering:

  1.  **Analyze the User and Context:**
      *   **Role:** Lead of a small evaluation group.
      *   **Task:** Building a Bongard-style benchmark for few-shot visual concept induction (18-month timeline, spec freezes in 4 months).
      *   **Team:** 6 people total. 2 are *conceptually* trained (read papers, specify tasks, analyze results) but *not empirically* trained (won't train/fine-tune models).
      *   **Goal:** Decide what the 2 conceptual people work on *now* (in the next 4 months) to inform the benchmark spec (ground truth, diagnostics, matched variants).
      *   **Constraints:** No survey of area, no paper recommendations. Needs a *defended priority ordering* of 3-4 questions.
      *   **Specific Requirements for each question:** Upstream impact/decision settled, tractability for non-experimentalists, neglectedness/leverage, empirical result that would shift priority.
      *   **Specific Requirements for the output:** Explicit tradeoffs (tractability vs. importance), critique of the user's operationalizations (cross-renderer, composition/negation), confidence estimates, least confident recommendation + dislodging observation.

  2.  **Deconstruct the Core Problem:**
      *   **The Bongard Problem:** 6 positive vs. 6 negative examples. Infinite rules separate them.
      *   **The Risk:** Models (and humans) might latch onto "accidental regularities" (renderer artifacts, palette, etc.) rather than the "intended rule."
      *   **The Evaluation Gap:** Accuracy on held-out items from the *same* generator doesn't prove rule induction.
      *   **The Team Constraint:** The 2 key people cannot run training experiments. They must rely on analysis, specification, pilot testing with existing models (black box), or human studies.
      *   **The Deadline:** 4 months to freeze spec.

  3.  **Evaluate the User's Operationalizations:**
      *   *Cross-renderer adjudication:* Generate same rule with different surface features.
          *   *Pros:* Directly addresses the "accidental regularities" problem. High leverage for spec (do we build a dual-renderer pipeline?).
          *   *Cons:* Expensive to build. Might be overkill if surface features aren't the main confounder.
          *   *Verdict:* Crucial. This is the only way to distinguish "concept" from "texture."
      *   *Composition and negation transfer:* Test conjunctions/complements of solved rules.
          *   *Pros:* Tests systematicity.
          *   *Cons:* Assumes the base rules were actually solved (which is the first problem). If the model fails the base rule due to surface bias, composition testing is moot. Also, compositionality is a property of the *representation*, not necessarily the *induction* mechanism in the few-shot setting.
          *   *Verdict:* Secondary. It's a "Level 2" diagnostic. If you haven't solved the "Level 1" problem of rule identity, Level 2 doesn't matter.

  4.  **Develop the Priority Questions (The "What"):**
      *   *Question 1: The Ground Truth Ambiguity.* How do we define the "intended rule" when infinite rules fit? This dictates the data generation pipeline (single vs. multi-renderer).
      *   *Question 2: The Failure Mode Taxonomy.* Why do models fail? Perception vs. Reasoning vs. Search. This dictates the diagnostics (intermediate outputs, attention maps, etc.).
      *   *Question 3: The Human Baseline.* Are humans actually solving the intended rule or using heuristics? This dictates the validity of the benchmark itself.

      *Refining for the "2 Conceptual People" constraint:* They can't train models to probe failure modes. They *can* analyze existing model outputs, run human studies, or design the generation logic.
      *   *Revision:*
          1.  **Rule Identity vs. Surface Correlation:** (Addresses Cross-Renderer). Can we prove the rule is invariant to rendering?
          2.  **Human Rule Alignment:** (Addresses the "target" problem). Do humans agree on the rule, or do they hallucinate consistency?
          3.  **Diagnostic Granularity:** (Addresses Failure Modes). What metadata do we store to distinguish perception vs. reasoning errors without retraining?

  5.  **Drafting the Priority Order (Iterative Process):**

      *   *Priority 1: The Invariance Protocol (Cross-Renderer).*
          *   *Why:* If the benchmark measures surface bias, it's useless. This decides the generation pipeline (must build dual-renderer now).
          *   *Tractability:* High for conceptual folks. They define the variance parameters, don't need to train.
          *   *Upstream:* Data generation spec.
          *   *Critique:* User's operationalization is correct but needs to be the *primary* filter, not just an adjudication step.

      *   *Priority 2: Human Consensus & Rule Explicitness.*
          *   *Why:* If humans can't agree on the rule, there is no ground truth. If humans use surface cues, the benchmark targets the wrong thing.
          *   *Tractability:* High. Run psychophysics-style studies on the 2 conceptual people + crowd.
          *   *Upstream:* Ground truth storage (store natural language? store logical forms?).
          *   *Critique:* Often neglected. People assume "Bongard = obvious rule."

      *   *Priority 3: Failure Mode Diagnostics (Perception vs. Logic).*
          *   *Why:* Accuracy is a scalar. We need to know *why* it failed.
          *   *Tractability:* Medium. Requires defining what intermediate data to log from black-box APIs or open models.
          *   *Upstream:* API specs, logging infrastructure.
          *   *Critique:* Hard to do without training, but defining *what to ask for* is conceptual work.

      *   *Priority 4 (The Drop): Composition/Negation.*
          *   *Why:* It's downstream. If Priority 1 fails, this is noise.
          *   *Verdict:* Tell the user to deprioritize this for the *spec freeze*. It can be added later as a "hard subset."

  6.  **Fleshing out the Details (per prompt requirements):**
      *   *Upstream/Decision:* Be specific (e.g., "determines if we build one generator or two").
      *   *Tractability:* Focus on "no training."
      *   *Neglect/Leverage:* Why is this the bottleneck?
      *   *Empirical Shift:* What data changes the mind?
      *   *Tradeoffs:* Where do we sacrifice ease for value?
      *   *Confidence:* Assign percentages.
      *   *Least Confident:* Identify the weak link.

  7.  **Refining the Argument on Operationalizations:**
      *   *Cross-Renderer:* It is not a distraction; it is the *sine qua non*. However, it shouldn't be "adjudication" (post-hoc); it must be "generation constraint" (pre-hoc).
      *   *Composition:* It is a distraction for the *initial spec*. It assumes the base concepts are solid. It adds complexity to generation that might delay the freeze.

  8.  **Final Review against Constraints:**
      *   3-4 questions? Yes (I'll merge Failure Mode into a broader "Diagnostic Protocol" or keep it distinct. Let's keep it distinct as Q3).
      *   Upstream/Decision? Yes.
      *   Tractability for non-experimentalists? Yes.
      *   Neglect/Leverage? Yes.
      *   Empirical result to shift? Yes.
      *   Tradeoffs explicit? Yes.
      *   Confidence estimates? Yes.
      *   Least confident + dislodger? Yes.
      *   No papers/survey? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, can conceptual people really decide on diagnostics without running experiments?* They can specify *what* diagnostics are theoretically necessary (e.g., "we need segmentation masks") even if they don't train the segmentation model themselves. They define the *requirement*.
      *   *Is Human Consensus really Priority 2?* If the goal is ML benchmarking, maybe ML failure modes are more important? No, if the ground truth is fuzzy, the ML evaluation is meaningless. Human consensus validates the "concept."
      *   *Tradeoff:* I need to be explicit about where I tell them to do hard work (Invariance) vs. where I tell them to cut scope (Composition).

  10. **Final Polish:** Ensure tone is authoritative, direct, and respects the "no fluff" constraint. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "do cross-renderer." I need to frame it as a *question* they must answer to finalize the spec.
  Question 1: "What degree of surface variance is required to invalidate heuristic solutions?" (Leads to Cross-Renderer spec).
  Question 2: "Is the 'intended rule' recoverable from human language alone?" (Leads to Ground Truth format).
  Question 3: "What minimal intermediate signals distinguish perception from reasoning errors?" (Leads to Logging spec).

  Let's refine the "Composition" critique. The user asked me to say if it's a distraction. I will argue it is a distraction for the *spec freeze* phase, not necessarily forever.

  Let's finalize the confidence scores. I should be high on the Invariance stuff, lower on the Diagnostics (since that's harder to predict without empirical trials).

  Okay, ready to write.s
answer: |-
  Here is the defended priority ordering for your two conceptually-trained team members. These are framed as questions they must answer to finalize the specification.

  ### Priority 1: The Invariance Threshold
  **Question:** *What minimal set of orthogonal surface transformations must a rule survive to be counted as "induced" rather than "fit"?*

  *   **Upstream Decision:** This settles the **data generation pipeline**. It determines whether you build a single renderer with noise parameters or two completely disjoint rendering engines (e.g., vector vs. raster, or distinct style libraries). It dictates the schema for "matched variants" (i.e., are they stored as separate items or linked metadata?).
  *   **Tractability (Non-Empirical):** High. This is a specification task, not a training task. Your team can define a taxonomy of surface features (color, texture, stroke, background) and mandate that the generator randomizes them independently of the logical rule. They can validate this by inspecting generated samples, not by training models.
  *   **Neglect & Leverage:** Highly neglected. Most benchmarks assume the generator is neutral. High leverage: If you get this wrong, the entire benchmark measures texture bias, and the 18-month project produces a dataset that is obsolete upon release.
  *   **Empirical Shift:** If, during pilot testing with off-the-shelf models (e.g., standard vision transformers), you find that models solve the "hard" logical rules simply by exploiting a single surface feature (e.g., mean pixel intensity) that you thought was randomized, you must move this *higher* (if possible) or halt generation to fix the leakage. If models fail even with maximal variance, you might lower the strictness to ensure solvability.
  *   **Tradeoff:** **Trade tractability for importance here.** Building a dual-renderer or heavily parameterized generator is engineering-heavy and delays the freeze. Do it anyway. A benchmark that measures the wrong construct is worse than no benchmark.

  ### Priority 2: The Human Ground-Truth Alignment
  **Question:** *Can naive humans articulate the intended rule in natural language without seeing the negative set, and do they agree with each other?*

  *   **Upstream Decision:** This settles the **ground truth storage format**. Do you store a logical form, a natural language description, or just the binary labels? It also determines if you need to budget for human annotation/verification in the production phase.
  *   **Tractability (Non-Empirical):** High. This requires running small-scale psychophysics studies (e.g., showing 6 positive examples to 20 humans and asking for the rule), which your conceptual team can design and analyze without training neural nets.
  *   **Neglect & Leverage:** Neglected. Benchmarks often assume the "intended rule" is obvious. If humans cannot agree on the rule given only positives, the task is ill-posed for machines too. High leverage: Prevents you from shipping items where the "ground truth" is an artifact of the negative set construction rather than a property of the positive set.
  *   **Empirical Shift:** If human agreement on the rule description is below 80% even when they can correctly classify the negatives, move this *down*. It implies the concept is perceptual/implicit rather than explicit, and you should stop storing natural language ground truth and switch to "consensus classification" only.
  *   **Tradeoff:** **Do not trade tractability here.** If human studies are too slow, sample a subset (e.g., 20% of items). Do not skip this. If the ground truth is ambiguous, the diagnostic value of the benchmark collapses.

  ### Priority 3: The Diagnostic Signal Requirement
  **Question:** *What is the minimal intermediate output required to distinguish a perception error from a reasoning error?*

  *   **Upstream Decision:** This settles the **evaluation API and logging spec**. It determines if you require models to output segmentation masks, attention maps, or intermediate symbolic representations alongside the final classification.
  *   **Tractability (Non-Empirical):** Medium. Your team cannot force model architects to change internals, but they can specify the *interface*. They can define a "standardized output format" for the benchmark submission. They can test feasibility by prompting existing multimodal models to see if they *can* produce such rationales.
  *   **Neglect & Leverage:** Standard accuracy metrics are ubiquitous; diagnostic metrics are rare. High leverage: Without this, a failure is a black box. With it, you can cluster failures by "couldn't see the object" vs. "saw object but wrong logic."
  *   **Empirical Shift:** If pilot testing shows that state-of-the-art models refuse to output structured rationales (or hallucinate them consistently), move this *down* to a "bonus" category rather than a requirement. Enforcing it might reduce participation.
  *   **Tradeoff:** **Trade importance for tractability here.** If requiring structured rationales drastically reduces the number of solvers willing to participate, downgrade this to "optional metadata." A benchmark with many solvers and coarse metrics is more useful than one with rich metrics and no solvers.

  ### Critique of Your Operationalizations

  **1. Cross-Renderer Adjudication**
  *   **Verdict:** **Not a distraction, but misphrased.**
  *   **Why:** You framed it as "adjudication" (scoring transfer). This implies you build the benchmark first, then test transfer. This is too late. As argued in Priority 1, this must be a **generation constraint**. If a rule cannot be rendered in two stylistically disjoint ways, *do not include the rule in the benchmark.*
  *   **Argument:** You do not need an experiment to settle this. It is a logical necessity. If a rule relies on a specific stroke width to be distinguishable, it is not a visual concept; it is a texture classifier. Your conceptual team can settle this by defining the "Style Independence" constraint in the spec document now.

  **2. Composition and Negation Transfer**
  *   **Verdict:** **Distraction for the Spec Freeze.**
  *   **Why:** This is a "Level 2" diagnostic. It assumes you have successfully solved the "Level 1" problem of Rule Identity (Priority 1). If your benchmark items are contaminated by surface biases, testing compositionality on them yields noise. Furthermore, compositionality tests exponentially increase the generation complexity (you need to generate $A$, $B$, $A \land B$, $\neg A$, etc.).
  *   **Argument:** Cut this from the initial 4-month spec. It can be added as an "extension pack" in month 12. Prioritizing this now risks bloating the generation pipeline and delaying the core invariant definition.

  ### Confidence Estimates & Least Confident Recommendation

  *   **Priority 1 (Invariance Threshold):** 95% Confidence. (Logical necessity for the problem statement).
  *   **Priority 2 (Human Alignment):** 85% Confidence. (Standard psychophysics, but human behavior can be surprisingly noisy).
  *   **Priority 3 (Diagnostic Signals):** 70% Confidence. (Depends heavily on the state of model APIs in 4 months).
  *   **Critique of Composition:** 90% Confidence. (Clear dependency hierarchy).

  **Least Confident Recommendation:** **Priority 3 (Diagnostic Signal Requirement).**
  *   **Why:** I am assuming that requiring intermediate outputs (like masks or rationales) is feasible for black-box evaluation.
  *   **Dislodging Observation:** If your team attempts to prompt 3 different multimodal foundation models in the next 3 weeks and finds that *none* can reliably output a segmentation mask or structured logic trace that correlates with their accuracy, you must drop this requirement. If the models cannot do it, specifying it in the benchmark spec forces participants to build ad-hoc post-hoc explainers that add noise rather than signal. In that case, revert to accuracy-only + Priority 1 (Invariance) as the sole quality filter.
