  **S Tier: The move of treating the mere fact that there are more people as a reason that counts even from the one person's own perspective**

  This is the only option that successfully navigates the narrow pass between saving the numbers and saving the theory. By shifting the focus from aggregating *complaints* to acknowledging a *generic reason* that everyone shares (including the person who would be sacrificed), you allow the numbers to tilt the balance of reasonable rejectability without summing welfare. The single person cannot reasonably reject a principle that saves the greater number because, from behind the veil of generic reasons, they themselves acknowledge that saving more lives is a weightier reason than saving fewer, provided the burden on them isn't catastrophic. This preserves the individualistic justification structure while letting the count matter in the specific case.

  **A Tier: The one-off vs. systematic distinction, where aggregation is only allowed to do work at the level of general principles, not in individual cases**

  This is the standard Scanlonian defense from *What We Owe to Each Other*, and it is robust, though it feels like a dodge in rescue cases. It argues that we choose principles ex ante, where everyone knows they are statistically more likely to be in the larger group, so everyone rationally chooses the principle that saves the most lives. It lets numbers matter effectively for policy and institutional rules, but it struggles to explain why you should save the five in a known, one-off rescue case where the statistical veil is lifted. It's philosophically stable, but it concedes too much ground on the specific intuition pump of the immediate dilemma.

  **B Tier: The outright anti-aggregation defense, which just says contractualism is supposed to be non-aggregative and that's a feature, not a bug**

  This is intellectually honest but fails your specific criterion of letting numbers matter. It bites the bullet and accepts that contractualism might require letting the five die to avoid violating the one's veto. While this preserves the purity of the individual justification constraint, it renders the theory implausible to most moral intuitions regarding rescue cases. It doesn't solve the problem; it simply declares the counter-intuitive result correct, which is a valid philosophical stance but a poor solution if your goal is to reconcile contractualism with the view that numbers count.

  **Non-Starter: The "strength of reasons" reply, on which the combined force of the many people's objections can outweigh the single person's**

  I am placing this outside the standard tiers because it is fundamentally incompatible with the core mechanism of contractualism. If you allow the "combined force" of distinct persons' objections to sum together to outweigh a single objection, you have ceased to do contractualism and are now doing a form of weighted utilitarianism. The whole point of the "reasonable rejectability" criterion is that justification is owed to *each* person individually, not to the collective sum. Once you allow complaints to aggregate across persons, you destroy the individual veto power that defines the view, collapsing it into the very consequentialist calculus it was designed to avoid.
