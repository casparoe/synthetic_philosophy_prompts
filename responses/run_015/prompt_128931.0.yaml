answer: |-
  The log files scrolled across Mara's screen, a waterfall of green integers marking the arrival time of every herald pulse. Outside the observatory, the rain was doing what it always did on this continent, falling without purpose. Inside, the air conditioning hummed, maintaining the cascade chamber at a temperature where superconductivity was stable but human comfort was an afterthought.

  "It's not noise," Mara said, not looking up from the correlation matrix. "It's not drift. It's structure."

  Jules leaned against the server rack, arms crossed. "Structure implies design. Or at least mechanism. We have a mechanism. The cascade emits the pair, and it emits the herald. The herald hits the photodiode, the photodiode feeds the random number generator, the generator sets the polarizer angle."

  "And the herald also correlates with the spin state of the pair," Tobin said. He was sitting in the corner, surrounded by printouts of Bell's original 1964 paper, annotated in red ink. "That's the definition of the loophole. $\lambda$ is not independent of $a$ and $b$."

  "But look at the magnitude," Mara insisted. She pulled up a histogram. "The mutual information between the herald intensity and the setting choice is 0.04 bits. To fake a CHSH violation of 2.8 using only local hidden variables and measurement dependence, you need a dependence of at least 0.06 bits. We're below the threshold."

  Jules pushed off the rack. "So there's residual nonlocality. The herald explains some of the correlation, but not all of it. The universe is still reaching across the gap."

  "Is it?" Tobin asked. His voice was quiet, but it stopped Jules mid-step. "You're assuming the herald is the only channel. You're assuming the correlation we *measure* is the total correlation that exists."

  "We measure what exists," Jules said.

  "We measure what couples to our instruments," Tobin corrected. "The herald is a classical signal. It's electromagnetic. But what if the same atmospheric pressure front that modulates the cascade also modulates the synaptic noise in your brain when you decide to override the generator? What if there's a variable we don't see, call it $\mu$, that influences both the source and the experimenter?"

  "That's the conspiracy argument," Jules said, weary. "That the universe is fine-tuned to make us think quantum mechanics is true when it's actually local."

  "I hate that word," Tobin said. "Conspiracy. It implies intent. It implies a puppeteer. I'm talking about a common cause. If a storm causes a tree to fall and also causes a power line to snap, we don't call it a conspiracy that the fallen tree blocked the snapped wire. We call it weather."

  Mara turned her chair around. "But in the tree example, the correlation is obvious. Here, the correlation is just enough to mask the locality. That's the fine-tuning. Why should the hidden variables of the particle align so perfectly with the quirks of our setting generators that the Bell inequality is violated exactly to the quantum limit, but never beyond?"

  "Because if it were violated beyond the quantum limit, we'd have signaling," Mara said softly.

  Both men looked at her.

  "We can't signal," Mara said, tapping the console. "That's the reproducible fact. Year after year. No matter how hard we try to modulate the herald, no matter how we tweak the settings, Alice cannot send a bit to Bob faster than light. Parameter independence holds. Outcome independence fails. But signaling is zero."

  "Signaling is a practical constraint," Jules said. "Bell locality is an ontological one. If the outcome at A depends on the setting at B, even if you can't use it to send a message, the world is nonlocal. The state space is non-separable."

  "But why do we privilege the 'local' model?" Tobin asked. "If the herald correlates with the settings, then Measurement Independence is false. If Measurement Independence is false, Bell's inequality doesn't apply. You can construct a local hidden variable model that reproduces the data perfectly. It requires that the past determines the settings, yes. But we already know the past determines the settings. I didn't choose to be born in this century. I didn't choose the physics of my neurons."

  "You chose the setting tonight," Jules said.

  "Did I?" Tobin gestured to the logs. "The herald arrived four minutes before I clicked 'manual override'. The herald correlated with my click. The herald came from the source. The chain of causality is local. Light cones are respected. Where is the magic?"

  "The magic is in the cost," Jules said. "To make this work, the hidden variables must be distributed such that they mimic the cosine squared law exactly, contingent on the settings which are contingent on the herald. It requires a coordination between the source and the experimenter that looks like action-at-a-distance even if it's technically mediated by the past. It's local, but it's... brittle. It requires the universe to be boringly specific."

  "Or," Tobin said, "it requires us to stop pretending we're outside the system. We treat the setting choice as a free variable, an external input. But we're part of the cascade. We're made of the same stuff as the detectors. If the world is deterministic, or even just causally closed, Measurement Independence is an approximation. And approximations break at this precision."

  Mara looked back at the screen. The raw violation sat at $S = 2.74$. The correction for the herald brought it down to $S = 2.1$. Still above 2. Still a violation, if you assumed the herald was the only confound.

  "If we publish this," Mara said, "we have to say locality is untenable, unless we accept that our choices are correlated with the source."

  "Which they are," Tobin said. " measurably. Publicly. Boringly."

  "Then we say locality is tenable, but only at the price of free will," Jules said.

  "No," Tobin said. "We say locality is tenable at the price of admitting that 'free will' isn't a statistical axiom. We say the violation disappears if you stop assuming you're a ghost in the machine."

  Jules rubbed his face. "And if I don't want to pay that price? If I say the correlation is real but insufficient?"

  "Then you have nonlocality," Mara said. "But you still don't have signaling. So what can you do with it? You can't build a phone. You can't send a warning. You just have... a connection."

  "A connection is enough," Jules said. "It means the world isn't made of separate things. It means realism is non-local."

  "Or," Tobin stood up, gathering his papers, "it means 'separate things' was the wrong assumption to begin with. Not because of spooky action, but because of common history. The herald isn't a loophole, Jules. It's a reminder. We're trying to prove the world is connected by assuming we stand apart from it. The data says we don't."

  Mara saved the log. The file name was `run_4492_final.dat`. It wasn't final. Nothing about this was final. The herald would pulse again tomorrow. The settings would correlate. The violation would persist in the raw data, and vanish in the corrected model, depending on which axiom you were willing to break.

  "Lock up when you leave," Mara said.

  "Will do," Jules said. He paused at the door. "Do you think we chose to leave?"

  Tobin smiled, tiredly. "Ask the herald."

