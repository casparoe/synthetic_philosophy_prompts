answer: |-
  There is no single, canonical noun in the philosophy of science (like "The Doppler Effect" or "The Quine-Duhem Thesis") that exclusively names this specific lifecycle. However, the phenomenon you describe is a recognized pathology that sits at the intersection of **Lakatosian methodology**, **model-based epistemology**, and **critical realism**.

  While you will not find a dictionary definition for it, the most precise established conceptual framing is **"The Degeneration of an Idealization"** within a **Lakatosian Research Programme**, specifically involving the **calcification of a Positive Heuristic into a Hard Core**.

  Here is a delineation of the concepts that map to your description, the closest existing labels, and how to distinguish this from ordinary auxiliary adjustments.

  ### 1. The Closest Established Frameworks

  #### A. Lakatosian "Degenerating Problemshift" (with a twist)
  Imre Lakatos distinguished between the **Hard Core** (irrefutable assumptions of a theory) and the **Protective Belt** (auxiliary hypotheses). He also described the **Positive Heuristic** (a set of suggestions on how to change the protective belt).
  *   **Your Phenomenon:** You are describing a scenario where a *Positive Heuristic* (a "disposable simplification" like rational agents) structurally migrates into the *Hard Core* without rhetorical admission.
  *   **The Mechanism:** In a standard degenerating program, scientists add ad hoc hypotheses to save the core. In your lifecycle, the "simplification" *becomes* the core because the "ad hoc" patches are mathematically derived from it. If you remove the simplification, the patches lose their derivation.
  *   **The Label:** Philosophers of economics (e.g., Uskali Mäki, Tony Lawson) often refer to this as **"Axiomatic Lock-in"** or **"Deductive Closure."** Tony Lawson specifically argues that mathematical modeling requires "closed systems," and researchers often maintain the false assumption of closure (the simplification) because the math collapses without it, even when admitting reality is "open."

  #### B. Wimsatt's "False Models"
  William Wimsatt wrote extensively on *False Models as Means to Better Theories*. He argued that false assumptions are often necessary to get started.
  *   **Your Phenomenon:** This is the pathological endpoint of Wimsatt's process. Instead of the false model serving as a scaffold to be removed (de-idealization), the scaffold becomes load-bearing.
  *   **The Label:** This is sometimes called **"Failed De-idealization"** or **"Idealization Trap."** It occurs when the *generativity* of the false assumption (its ability to produce patches) outweighs its *falsity*, creating a dependency where truth would be less "productive" for the specific formalism than the lie.

  #### C. The "Ptolemaic" Analogy
  While metaphorical, this is the most common shorthand. Adding epicycles to save the geocentric model is the classic example. However, your description adds a nuance: the epicycles were *derived* from the geocentric math, not just tacked on.
  *   **The Label:** Some methodologists refer to this as **"Epicyclic Lock-in."** It highlights that the complexity is not capturing new reality, but compensating for the structural error of the core.

  ### 2. Proposed Terminology: "Structural Idealization Lock-in"

  If you need a precise term for your mapping, **"Structural Idealization Lock-in"** (or simply **"Idealization Lock-in"**) is the most accurate descriptive label currently in circulation among philosophers of modeling (e.g., in the work of Tarja Knuuttila or Michael Weisberg, though they may vary the phrasing).

  It captures the two key features you identified:
  1.  **Idealization:** The premise started as a known simplification.
  2.  **Structural Lock-in:** The corrections are not independent; they are *functions* of the idealization.

  ### 3. Distinguishing It from Related Concepts

  To argue this is a distinct failure mode and not just "science being messy," you must delineate it from three similar concepts:

  #### vs. Ordinary Auxiliary-Hypothesis Adjustment
  *   **Standard Adjustment:** A core law ($F=ma$) is preserved; an auxiliary factor is added ("there was air resistance"). The auxiliary factor is *ontologically independent* of the core law. You could theoretically remove the core law and the air resistance would still exist.
  *   **Your Phenomenon:** The patch is *ontologically dependent* on the false premise. For example, a "risk adjustment coefficient" in a financial model might be mathematically derived *assuming* normal distributions (the false premise). If you change the distribution assumption, the coefficient doesn't just change value; it loses its definition.
  *   **The Boundary:** If removing the false assumption renders the patches **mathematically undefined** rather than just **empirically inaccurate**, you have Lock-in.

  #### vs. Institutional Inertia (Sociological)
  *   **Inertia:** Scientists keep using a model because it's what they were taught, or because journals require it. This is a social constraint.
  *   **Your Phenomenon:** This is a **formal constraint**. Even a scientist who *wants* to remove the false assumption cannot do so without rebuilding the entire mathematical architecture from scratch. The "lock" is in the equations, not just the citation network.
  *   **The Boundary:** If a new researcher *could* easily swap the assumption but *chooses* not to, that is inertia. If swapping the assumption requires deriving a new calculus because the old operators rely on the falsehood, that is Lock-in.

  #### vs. Instrumentalism ("As-If" Methodology)
  *   **Instrumentalism:** Milton Friedman's argument that assumptions don't need to be true, only predictive.
  *   **Your Phenomenon:** The literature *claims* to be Instrumentalist ("it's just a simplification"), but operates as a **Structural Realist** regarding the assumption. They treat the assumption as true *within the machinery* to make the patches work.
  *   **The Boundary:** Pure instrumentalism allows swapping the model for a different one with different assumptions if predictions fail. Lock-in prevents swapping because the *specific* false assumption is required to justify the *specific* patches.

  ### 4. Boundary Cases and Diagnostic Tests

  To prove this is a distinct failure mode in your mapping, apply these tests:

  1.  **The Derivation Test:** Can the corrective parameters be derived *without* the false assumption?
      *   *If Yes:* It is ordinary approximation.
      *   *If No:* It is Lock-in. (e.g., You cannot derive the "Greeks" in Black-Scholes without assuming log-normal returns, even though we know returns aren't log-normal. The "volatility smile" is a patch that acknowledges the error but relies on the original formula to exist.)
  2.  **The Rhetorical Gap:** Does the text describe the assumption as "relaxable" while the math treats it as "fixed"?
      *   This disconnect is the hallmark of the phenomenon. It is **Rhetorical Instrumentalism masking Structural Dogmatism.**
  3.  **The De-idealization Block:** Has attempts to make the assumption more realistic (e.g., bounded rationality) resulted in the model becoming "intractable" specifically because the *patches* no longer fit?
      *   This confirms the patches are calibrated to the falsehood, not reality.

  ### Summary
  While there is no single "Eureka" term, the phenomenon is best categorized as **Structural Idealization Lock-in** within a **Degenerating Research Programme**. It is distinct from standard auxiliary adjustments because the corrections are **derivative dependencies** of the falsehood, and distinct from inertia because the constraint is **formal/mathematical** rather than sociological. It represents a specific failure of **de-idealization**, where the scaffold becomes the structure.

  In the philosophy of economics, this is often critiqued under the heading of **"Tractability Constraints"** overriding **"Ontological Accuracy,"** leading to what some critics call **"Mathematical Formalism"** (where the math drives the ontology, rather than vice versa).
