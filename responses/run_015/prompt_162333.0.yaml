  *(Refining the Anti-Foundationalism point)*: The connection is strong. Neurath's rejection of private experience (phenomenology) in favor of physicalist statements aligns with Isotype's rejection of "artistic" individuality in favor of standardized types. This kills the "Transparency" reading (which relies on private perceptual immediacy) and boosts the "Conventionalist" reading (publicly verifiable standards).

