answer: |-
  ### Epistemic Status Statement

  Before proceeding, I must clarify the status of the claims below, per your request.

  *   **Settled/Consensus:** It is uncontroversial among scholars of the Vienna Circle that Neurath was a physicalist and an anti-foundationalist. It is also settled that Isotype was a collaborative, industrial process (involving "transformers" like Marie Reidemeister and artists like Gerd Arntz) rather than the product of a single intuition, and that Neurath insisted on the integration of text and image.
  *   **Live Interpretive Dispute:** The degree to which Neurath believed in the "naturalness" of pictorial signs versus their "constructedness" is a matter of debate. Some interpretations emphasize his utopian internationalism (leaning toward Transparency); others emphasize his logical empiricism (leaning toward Conventionalism).
  *   **Reconstruction:** The synthesis I offer below—specifically regarding how the "Words divide" slogan functions pragmatically rather than ontologically, and the specific linkage between the Boat metaphor and Isotype's standardization—is my own reconstruction based on the internal logic of the positions you provided and general knowledge of Neurath's philosophy. I am inferring these connections to resolve the tension you identified, rather than reporting a specific secondary source.

  ---

  ### 1. Critique of the Dichotomy

  Your provisional sense is correct: the **Conventionalist reading** fits the actual practice and the broader philosophy better. However, the **Transparency reading** is not entirely a straw man; it captures the *rhetorical strategy* Neurath used to market the system, even if it contradicts his *methodological theory*.

  If you treat them as mutually exclusive ontological claims (i.e., "Are pictures naturally understood OR artificially taught?"), the distinction collapses because Neurath's position is pragmatic. He likely viewed pictorial resemblance as a *resource* to be exploited, not a *foundation* to be relied upon.

  A better contrast might be **"Naturalistic Optimism" vs. "Engineered Intersubjectivity."**
  *   **Naturalistic Optimism:** Assumes perception is a neutral ground we can stand on.
  *   **Engineered Intersubjectivity:** Assumes perception is messy, so we must build a standardized visual grammar to coordinate behavior.

  Neurath's slogan "Words divide, pictures unite" works best under the second reading, but only if "unite" is understood as "coordinate" rather than "merge minds."

  ---

  ### 2. Comparison Along the Three Axes

  #### Axis 1: Grounds of Intelligibility (The Single Pictogram)

  *   **Transparency Reading:** The pictogram is intelligible because it mimics the retinal image or a universal concept. A picture of a man is understood because all humans see men similarly.
      *   *Weakness:* This fails to explain why Isotype required rigorous standardization. If resemblance were enough, any drawing of a man would work. But Neurath rejected artistic variation.
  *   **Conventionalist Reading:** The pictogram is intelligible because it is a token of a standardized type. The "man" symbol works because users have learned (or can quickly learn) that *this specific arrangement of shapes* counts as "one worker."
      *   *Strength:* This aligns with the "repeating identical stylized pictograms" rule you noted. The unit value is stipulated, not perceived.
  *   **Reconstruction:** Neurath likely held a middle position: Resemblance lowers the *cost* of learning the convention, but it does not eliminate the need for the convention. The pictogram is a "visual mnemonic" (as your catch-phrase suggests), not a mirror of reality. It is intelligible because it is *simplified* to remove ambiguity, not because it is *realistic*.

  #### Axis 2: The Role of Visual Education and Verbal Text

  *   **Transparency Reading:** Visual education is remedial (for those who can't see clearly). Verbal text is a caption, secondary to the visual truth.
      *   *Consequence:* If this were true, the text would be optional. But Neurath insisted charts are "never presented alone."
  *   **Conventionalist Reading:** Visual education is constitutive. The system *is* the pedagogy. The verbal text is not a caption but a key or legend that anchors the convention.
      *   *Consequence:* This fits the "helping language" description. The text provides the spatio-temporal context (Where? When?) that the picture cannot show. The picture shows the *order*, the text shows the *coordinates*.
  *   **Reconstruction:** The text is there to prevent the "false self-evidence" you worry about. By forcing text to accompany the image, Neurath admits the image is not self-sufficient. The "unity" pictures provide is not that they replace words, but that they allow words to be used more sparingly and internationally. The text handles the grammar; the pictures handle the quantities.

  #### Axis 3: Objectivity and Rhetoric

  *   **Transparency Reading:** Pictures are more objective because they bypass linguistic bias.
      *   *Risk:* As you noted, this manufactures self-evidence. It hides the choice of *what* to count (e.g., defining a "house" vs. a "dwelling unit"). The chart looks like nature, but it is a construction.
  *   **Conventionalist Reading:** Pictures are not inherently more objective, but they are more *transparently constructive*. Because the symbols are stylized and repeated, the viewer sees the *counting* happening.
      *   *Benefit:* It shifts the claim from "This is the Truth" to "This is the agreed-upon representation of the data."
  *   **Reconstruction:** The argument for pictures *over* words, on this reading, is not epistemic superiority but **democratic accessibility**. Words divide because natural languages require deep immersion (grammar, vocabulary) to master. Isotype conventions can be taught in minutes. The "objectivity" is social: it is easier to agree on a visual standard internationally than to translate a sociological treatise. The rhetoric is not removed; it is *standardized*.

  ---

  ### 3. Connection to Anti-Foundationalism (The Boat and Protocol Sentences)

  This is the strongest evidence for the **Conventionalist Reading**.

  **The Connection:**
  Neurath's rejection of "protocol sentences" (statements about private, immediate experience) in favor of "physicalist" statements (publicly verifiable descriptions of spatio-temporal events) maps directly onto Isotype.
  *   **Protocol Sentences:** "I see red now." (Private, incorrigible, foundational).
  *   **Physicalist Statements:** "There is a red ball at coordinates X, Y." (Public, checkable, fallible).
  *   **Isotype:** A pictogram is not an expression of the artist's vision (private) nor a direct imprint of reality (foundational). It is a physicalist token in a public system.

  **Impact on the Readings:**
  1.  **Damages Transparency:** The Transparency reading relies on a kind of perceptual foundationalism—that the eye gives us unmediated access to truth. Neurath's anti-foundationalism rejects this. There is no "innocent eye." Therefore, a picture cannot unite us by appealing to a shared, pre-linguistic perception.
  2.  **Supports Conventionalism:** The "Boat" metaphor (rebuilding the ship at sea without ever docking at a foundation) implies we must use the tools we have to build coherence, not truth. Isotype is a tool for rebuilding social understanding while we are "at sea" in modern complexity. We agree on the symbols not because they are "true," but because they are *useful for coordination*.

  **Does this make neutrality harder to sustain?**
  Yes, but Neurath would accept that. For Neurath, "objectivity" does not mean "view from nowhere." It means "intersubjective agreement among physicalists."
  *   If the Transparency reading were true, objectivity would be guaranteed by nature.
  *   Since the Conventionalist reading is true (and fits his anti-foundationalism), objectivity is guaranteed by **procedure**. The chart is objective because the method of transformation (from data to symbol) is public and repeatable, not because the symbol looks like the thing.

  ---

  ### 4. Resolving the "Words Divide, Pictures Unite" Tension

  You noted that if the Conventionalist reading is right, "Pictures Unite" looks like a mere sociological remark, and the argument for pictures over words weakens. Here is how to reconstruct Neurath's defense without falling back on Transparency:

  **Words Divide** because natural languages are **historical accretions**. They carry metaphysics, irregular grammar, and cultural baggage that cannot be easily stripped away. To share a text, you must translate the *whole structure*.

  **Pictures Unite** (in the Conventionalist sense) because Isotype is a **designed artifact**. It has no history, no irregular verbs, and no metaphysics. It is a "helping language" precisely because it is *smaller* and *shallower* than a natural language.

  *   **The Argument:** It is not that pictures are *truer* than words. It is that a *constructed* visual language is easier to standardize internationally than a *natural* verbal language.
  *   **The Slogan:** "Words divide" refers to existing natural languages. "Pictures unite" refers to the *potential* of a constructed international auxiliary language (like Esperanto, but visual).

  **Conclusion on the Slogan:**
  The slogan is not a description of how perception works (Transparency); it is a political goal (Conventionalism). Pictures *can* unite, provided we build the institutions (museums, schools, standardization committees) to teach the conventions.

  ### Summary for Your Paper

  1.  **Reject the strong Transparency reading.** It contradicts Neurath's physicalism and his insistence on standardization/transformers.
  2.  **Adopt the Conventionalist reading,** but refine it: It is not arbitrary convention (like traffic lights); it is **motivated convention** (resemblance aids learning, but convention ensures precision).
  3.  **Reframe Objectivity:** Objectivity in Isotype is not the absence of rhetoric, but the **publicity of construction**. The viewer sees the units; the choices are visible in the legend.
  4.  **Integrate Anti-Foundationalism:** Use the "Boat" metaphor to show that Isotype is a tool for coordination in a world without absolute foundations. The "unity" is social coordination, not perceptual identity.
  5.  **Final Synthesis:** Neurath wanted both readings, but hierarchically. He used the *rhetoric* of Transparency ("To remember simplified pictures...") to sell the system to the public, but he employed the *method* of Conventionalism (standardization, text accompaniment, physicalism) to build it. The tension you feel is the gap between his pedagogy (which hopes for immediacy) and his philosophy (which knows there is none).
