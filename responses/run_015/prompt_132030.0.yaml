      *   **Key Mapping:**
          *   Conch = Failed enforcement/monitoring.
          *   Hunting territory = Fuzzy boundaries.
          *   Sanctions = No graduated sanctions (only extreme violence eventually).
      *   **Counterpoint/Concern:** Does this ignore Golding's existential/theological point about the "beast within"?

  3.  **Evaluate Coherence & Interest:**
      *   *Is it interesting?* Yes. It bridges political philosophy/environmental ethics with literary analysis. It challenges the deterministic reading of *LotF*.
      *   *Is it coherent?* Yes, Ostrom's principles are specific enough to map onto the boys' society.
      *   *Potential Pitfall:* Ostrom's work applies to *long-standing communities* with *shared norms*. The boys are children, strangers (mostly), in crisis, with no history. This is a key distinction to address.

