      *   *The Hunt/Pig-Roast:* Resource extraction. Jack's tribe doesn't have defined boundaries (Principle 1: Boundaries). They hunt wherever. The feast is a distribution failure (Principle 8: Nested enterprises? Maybe not. Principle 2: Congruence between rules and local conditions). The meat is used as a bribe, not a shared resource.
      *   *Ralph's Authority Collapsing:* This is where the "graduated sanctions" (Principle 5) point shines. Ralph has no way to punish minor infractions (letting the fire go out) except nagging. Jack escalates to violence immediately. There's no middle ground.

  5.  **Identify Distortions/Limitations:**
      *   *Human Nature:* Golding is writing a moral allegory about the Fall of Man. Ostrom is writing about institutional design. Ignoring Golding's theological/existential layer flattens the book. The argument needs to acknowledge that Golding *intentionally* removed these structures to prove a point about human nature.
      *   *Demographics/Context:* Ostrom's principles work for adults with shared economic interests. These are British schoolboys in a survival scenario. The "commons" isn't just the island; it's their own safety/rescue.
