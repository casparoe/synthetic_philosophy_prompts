answer: |-
  1. Introduction

  The tension you describe is a manifestation of the gap between *universal* mathematical constraints and *local* empirical regularities. The No-Free-Lunch (NFL) theorems are mathematically sound: averaged over the space of all possible loss functions, no learner outperforms another. However, engineering practice never operates over the space of all possible functions; it operates over the subset of functions that describe physical, social, or economic reality.

  An adequate philosophical account for an engineer must not attempt to refute NFL, but rather explain why it is irrelevant to your specific domain. It must bridge the gap between the abstract possibility of chaos and the concrete reality of structure. Below are the desiderata for such a theory, anchored in your fraud-detection and model-selection scenarios.

  2. Desiderata for an Engineering-Ready Theory of Induction

  2.1 Compatibility with No-Free-Lunch Theorems
  The theory must explicitly accept the validity of NFL results without allowing them to paralyse decision-making. It must delineate the boundary between the 'space of all possible problems' (where NFL holds) and the 'space of encountered problems' (where it does not).
  *   **Anchor:** This prevents colleagues from using NFL to claim your fraud-detection pipeline is theoretically baseless. The theory must concede that while trees are not universally superior, they may be superior relative to the specific distribution of fraud patterns.
  *   **Status:** Non-negotiable. Denying established mathematics renders the theory scientifically untenable.

  2.2 Specification of the 'Natural Problem' Distribution
  The theory must provide a plausible characterisation of the measure or distribution over problems that actually occur in nature or industry. It cannot simply assume a prior; it must offer a reason why the data-generating processes you encounter are not drawn uniformly from the set of all computable functions.
  *   **Anchor:** In your fraud-detection case, this requirement demands an explanation of why financial transaction data possesses structure (e.g., smoothness, sparsity, or hierarchical dependencies) that tree ensembles capture better than high-variance flexible models.
  *   **Status:** Non-negotiable. Without this, any preference for one model over another is indistinguishable from superstition.

  2.3 Justification of Simplicity Bias (Occam's Razor)
  The theory must explain why simpler hypotheses should be preferred to complex ones, conditional on the 'Natural Problem' Distribution. It must establish a link between implementation complexity and generalisation error that holds for your domain.
  *   **Anchor:** This directly supports your team policy of deploying the model with the smallest implementation complexity among those within one percentage point of validation error. The theory must justify why this tie-break rule is a heuristic for future robustness rather than an arbitrary aesthetic choice.
  *   **Status:** Non-negotiable for engineering utility. If the theory cannot justify bias towards simplicity, it cannot support standard regularisation or model selection practices.

  2.4 Account of Temporal Stability (Stationarity)
  The theory must address the assumption that the future will resemble the past. It needs to articulate the conditions under which inductive inference is valid over time, distinguishing between stable physical laws and shifting social constructs.
  *   **Anchor:** Your fraud pipeline relies on training on past months to detect fraud in new months. If the underlying data distribution shifts adversarially or structurally, induction fails. The theory must define the limits of this stability.
  *   **Status:** Non-negotiable. Engineering systems deployed over time require an assumption of continuity; a theory that treats every time-step as independent renders historical data useless.

  2.5 Actionable Decision Criteria
  The theory must translate abstract epistemic principles into concrete decision rules. It cannot remain purely descriptive; it must be prescriptive enough to guide resource allocation and architecture choices.
  *   **Anchor:** The policy to prefer lower complexity models is a decision rule. The theory must validate this rule as rational, not merely convenient.
  *   **Status:** Non-negotiable. A philosophy that offers no guidance on action is useless for engineering management.

  3. Analysis of the Desiderata

  3.1 Non-negotiable Requirements vs. Philosophical Prejudice
  Requirements 2.1 (NFL Compatibility), 2.4 (Temporal Stability), and 2.5 (Actionability) are non-negotiable for engineering purposes. If a theory contradicts mathematics, ignores time, or offers no guidance, it cannot be used to build systems.

  Requirement 2.2 (Natural Problem Distribution) borders on philosophical prejudice. Some camps (e.g., strict empiricists) argue we cannot know the 'true' distribution of nature and should only speak of observed frequencies. However, for an engineer, accepting some ontological claim about the structure of data is necessary to move forward. I classify this as non-negotiable for *practice*, though it may be contested by *foundationalist* philosophers who demand proof of the distribution rather than a pragmatic assumption.

  Requirement 2.3 (Simplicity Bias) reflects a specific philosophical commitment (Realism or Pragmatism). A nominalist might argue complexity is in the eye of the beholder. However, given that 'implementation complexity' is well-defined in your context (lines of code, inference latency, dependency count), this is treated as non-negotiable for your specific team policy.

  3.2 Incompatible Subsets
  There is a tension between **2.1 (NFL Compatibility)** and a strong reading of **2.3 (Simplicity Bias)**.
  *   **The Conflict:** If a theory claims that simpler models are *intrinsically* or *universally* more likely to be true (a strong ontological claim), it violates NFL, which states no bias is universally superior.
  *   **Resolution:** The theory must frame Simplicity Bias as *conditional* on Requirement 2.2. Simplicity is only preferred because the 'Natural Problem Distribution' favours simple structures. Any theory that justifies Occam's Razor *a priori* without reference to the domain distribution fails 2.1.

  3.3 The Most Exclusionary Requirement
  **Requirement 2.2 (Specification of the 'Natural Problem' Distribution)** will exclude the largest number of familiar approaches.
  *   **Reason:** Most standard statistical theories (Frequentist or Bayesian) take the data-generating distribution as a given or a nuisance parameter to be estimated. They rarely offer a philosophical account of *why* the universe produces distributions that are learnable. They assume stationarity and structure rather than explaining it. A theory that demands an explanation for why the world is learnable (e.g., physical laws, human cognitive limits) rules out purely formalist accounts that treat data as ungrounded symbols.

  4. Evaluation of Familiar Approaches

  4.1 Statistical Learning Theory (VC Dimension/Structural Risk Minimisation)
  *   **Performance:** Strong on 2.1 (accepts NFL implicitly by focusing on bounds), 2.3 (penalises complexity via VC dimension), and 2.5 (provides bounds).
  *   **Failure:** Struggles with 2.2 and 2.4. It assumes the data is Independent and Identically Distributed (i.i.d.). It offers no explanation for *why* the VC dimension of the real world is low, nor does it robustly handle the temporal non-stationarity inherent in fraud data (where adversaries adapt).
  *   **Verdict:** Mathematically rigorous but ontologically silent.

  4.2 Subjective Bayesianism
  *   **Performance:** Excellent on 2.1 (coherence ensures no Dutch books, compatible with NFL) and 2.5 (decision theory). Handles 2.3 by encoding simplicity in the prior.
  *   **Failure:** Fails 2.2 critically. It allows *any* prior provided it is coherent. It cannot explain why a 'simplicity prior' is objectively better for fraud detection without begging the question. It treats the preference for trees as a subjective belief rather than an objective feature of the fraud landscape.
  *   **Verdict:** Internally consistent but lacks explanatory power for team policy justification.

  4.3 Pragmatist/Reliabilist Approaches (e.g., Reichenbach, Sellars)
  *   **Performance:** Strong on 2.2 and 2.4. It argues that we adopt biases (like simplicity) because methods using them have historically been reliable in our specific environment. It justifies the fraud pipeline because it works, not because it is universally true.
  *   **Failure:** Can appear weak on 2.1 to formalists, as it relies on inductive justification of induction (circularity). However, for engineering, this is often acceptable.
  *   **Verdict:** Best fit for engineering practice. It accepts that the justification for your complexity policy is empirical success within a specific domain, not universal logical necessity.

  5. Conclusion

  To resolve the dispute in your design reviews, you require a theory that accepts NFL as a universal truth but irrelevant to your local context. The crucial move is Requirement 2.2: asserting that the subset of problems you solve is not a random sample of all mathematical functions.

  Your colleagues are correct that no learner is generally better than another *simpliciter*. You are correct that tree ensembles are better *for fraud*. An adequate philosophy must validate your claim without denying theirs. The Pragmatist approach outlined above suggests that your preference for simpler models is justified not by logic alone, but by the empirical fact that the economic universe favours structured, compressible patterns over random noise. This renders your complexity policy rational, not merely habitual.
