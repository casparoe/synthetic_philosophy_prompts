answer: |-
  The flat $28k split is only defensible under a "formal procedural" reading of opportunity that ignores existing disadvantages, but under any substantive "capability" reading, it actively undermines equal opportunity for Maya and Dev.

  Here is the breakdown of what your brother's phrase actually claims, formatted for your group chat, followed by the analysis of your specific stuck points.

  ### Menu: What "Equal Opportunity, Not Equal Outcomes" Could Mean

  **1. Formal Procedural Equality (The Brother's Likely View)**
  *   **Opportunity:** Absence of formal barriers (e.g., no rules saying "Maya can't apply").
  *   **Outcome:** Income, status, or graduation position.
  *   **Timing:** The moment the money is handed over.
  *   **Verdict:** **Platitude/False here.** [Confident]
  *   **Effect on Split:** Supports $28k.
  *   **Why it bites him:** There are no formal barriers here; the barriers are physical (hearing) and economic (childcare). Equal cash ignores these barriers, making the "opportunity" merely formal, not real.

  **2. Fair Equality of Opportunity (Rawlsian)**
  *   **Opportunity:** Individuals with similar talent/effort should have similar prospects regardless of social start.
  *   **Outcome:** Social position achieved later in life.
  *   **Timing:** Life trajectory (measured at graduation/career start).
  *   **Verdict:** **Substantive/Defensible.** [Confident]
  *   **Effect on Split:** **Bites him.** Requires giving *more* to Maya and Dev to compensate for unchosen disadvantages so their prospects match Tomas's.

  **3. Capability Approach (Sen/Nussbaum)**
  *   **Opportunity:** Real freedom to function (e.g., actually being able to attend class, not just having tuition paid).
  *   **Outcome:** Functionings (being educated, being employed, being healthy).
  *   **Timing:** Ongoing during the education period.
  *   **Verdict:** **Substantive/Defensible.** [Confident]
  *   **Effect on Split:** **Bites him.** $28k buys a different *capability set* for Maya (who needs interpreters) than for Tomas. Equal cash yields unequal capability.

  **4. Sufficientarianism (The "Floor" Argument)**
  *   **Opportunity:** Enough resources to reach a threshold of viable education.
  *   **Outcome:** Anything above the threshold.
  *   **Timing:** Immediate solvency for educational costs.
  *   **Verdict:** **Defensible.** [Confident]
  *   **Effect on Split:** **Bites him.** If $28k doesn't cover Maya's/Dev's floor but exceeds Priya's, equality is the wrong target; sufficiency is.

  ***

  ### Analysis of Your Stuck Points

  **1. Dev's Scaled-Down Ask (Adaptive Preferences)**
  *   **Verdict:** **Confident.** Dev lowering her ask is likely "adaptive preference"—scaling desires to fit constraints rather than reflecting actual need.
  *   **Reasoning:** In welfare economics, satisfying a preference formed under constraint does not equal satisfying welfare. If she expects less because she assumes the trust won't cover childcare, giving her less confirms the constraint rather than solving it. Treat her original need (tuition + childcare) as the baseline, not her scaled-down ask.

  **2. Invasive Questions & Rewarding Complainers**
  *   **Verdict:** **Confident.** This is an administrative problem, not a philosophical one.
  *   **Reasoning:** You do not need to judge "who suffers more." You need to judge "what does it cost to achieve the trust's purpose?" Use objective metrics: tuition invoices, disability accommodation estimates, local childcare rates. This removes the reward for complaining and replaces it with reimbursement for verified costs.

  **3. The "140k Can't Equalize" Objection**
  *   **Verdict:** **Confident.** This supports the **Sufficientarianism (Floor)** model over strict equality.
  *   **Reasoning:** If you cannot equalize the finish line, aiming for an equal start (cash) is arbitrary. The moral target shifts to ensuring everyone clears a minimum viable threshold for education. If the money runs out after covering needs, you prorate the needs, not the cash.

  ### Framing Check: Is "Equal Opportunity" the Wrong Target?
  *   **Verdict:** **Live Dispute.** [Disputed]
  *   **Reasoning:** You are administering a **trust for education**, not a general welfare fund. The legal and moral purpose is likely *educational attainment*, not abstract life equality.
  *   **Implication:** Under this framing, "Equal Opportunity" is irrelevant. The question is "Equal *Education*." $28k buys a degree for Priya, a certificate for Dev, and nothing for Maya. If the goal is education, equal cash fails the purpose of the trust. Your brother's slogan conflates the *means* (money) with the *end* (education).
