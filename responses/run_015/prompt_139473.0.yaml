answer: |-
  This is a remarkably clear-eyed dissection of the problem. You have intuitively stumbled upon the central tension in federalist theory: the conflict between **efficiency/externalities** (problems that spill over borders) and **preference heterogeneity** (people wanting different things in different places).

  Your tentative principle (*"cost of getting it wrong" vs. "cost of fixing it"*) is a version of **Fiscal Federalism Theory**, specifically the idea of "internalizing externalities." But as you noted, it struggles with the distinction between *market* rules and *social* rules.

  Here is a principle that fits six of your seven cases, the one verdict you likely need to sacrifice, and the prediction for your remote worker.

  ### The Principle: "Coincident Accountability"

  **Power belongs at the level where the political boundary matches the boundary of the consequence, *unless* the consequence is a negative externality that the lower level cannot internalize.**

  This refines your "cost" idea by adding a political constraint: The people voting for the rule must be the same people suffering the result. If they aren't, democracy breaks. If the suffering people *can't* vote because the problem comes from outside their border, centralization is required.

  #### How it maps to your seven cases:

  1.  **Safety Standards (EU):** **Fit.** If Canton A allows toxic toys, the cost is paid by children in Canton B. Canton B's voters cannot fix Canton A's laws. Accountability is broken. Centralize.
  2.  **Building Codes (Canton):** **Fit.** If Canton A has bad codes, buildings in Canton A fall down. Canton A pays the cost and can fix it. No spillover. Decentralize.
  3.  **Pandemic Rules (EU):** **Fit.** If Country A opens up, Country B gets sick. Country B cannot fix Country A's laws. Massive negative externality. Centralize.
  4.  **Local Trade Licensing (Land):** **Fit.** Clients don't cross borders. The cost of bad licensing is local. Decentralize.
  5.  **Voluntary Upward Transfer:** **Fit.** If the lower level *cannot* fund the fix, they cannot bear the cost. By handing it up, they restore the link between "ability to fix" and "responsibility."
  6.  **EU Minimum Wage (National):** **Fit (with a caveat).** You reject EU wages despite wage competition. Why? Because the *primary* cost of low wages is social inequality *within* the state, not necessarily damage to the neighbor. You have decided that wage competition is a "feature, not a bug" of the internal market. The consequence boundary is the Nation, not the EU.
  7.  **Framework Legislation:** **Mismatch.** This is your point of incoherence.

  ### The Verdict to Sacrifice: Framework Legislation

  You wrote: *"Framework legislation from the federation that the Länder then fill in: I dislike it on principle, and yet I keep concluding it's fine in practice."*

  **You must sacrifice the "fine in practice" verdict.**

  Under **Coincident Accountability**, framework legislation is a pathology. It splits the "decision" (Federation) from the "cost/implementation" (Land).
  *   The Federation gets the credit for the "goal" (e.g., clean air) without paying the tax cost or administrative burden.
  *   The Land pays the cost and takes the blame for the "method," but didn't get to set the goal.
  *   This violates your own principle: The people paying the cost of fixing it (Land) are not the people who set the competence (Federation).

  If you stick to your Building Code and Licensing intuitions, you should view Framework Legislation as a democratic deficit that obscures accountability. It feels "fine in practice" only because it papers over conflict, but it violates the structural logic of your other six verdicts.

  ### The Prediction: The Remote Worker Case

  *The Case: Worker lives in Canton A, Employer in Canton B, Platform in Country C.*

  **Analysis under Coincident Accountability:**
  1.  **Where is the harm felt?** Primarily Canton A (the worker's body, health, and local cost of living).
  2.  **Where is the control?** Canton B (the contract) and Country C (the algorithm).
  3.  **The Mismatch:** Canton A bears the social cost (welfare, health) but has no jurisdiction over B or C. Canton B gets the economic benefit without the social cost. Country C extracts rent without liability.
  4.  **The Externality:** This is a classic "race to the bottom" setup. If Canton A sets high standards, Employer B moves to Canton D. If Canton B sets standards, Platform C ignores them. No single territory contains the consequence.

  **The Verdict:**
  **Supra-National (EU/Federal) Competence.**

  Because the *market* (Platform/Employer) operates at a level higher than the *polity* (Worker/Canton), the regulation must rise to match the market.
  *   **Labor Standards:** Must be set at the **EU/Federal level**. Why? Because if left to Canton A, they are undercut by Canton B. If left to Canton B, they ignore the living costs of Canton A. Only a higher level can internalize the competition between A and B.
  *   **Administration:** Should remain **Cantonal**. The "cost of fixing it" (inspections, courts) is local. The higher level sets the floor (to stop the race to the bottom), the lower level enforces it (to maintain accountability).

  **Why this fits your system:**
  It treats the Remote Worker case like the **Safety Standards** case (market distortion requires central rules) but respects the **Licensing** case (enforcement remains local). It acknowledges that when capital/platforms become stateless, labor protections must become stateless to maintain Coincident Accountability.

  ### Summary of the Coherent Position

  1.  **Principle:** Competence follows the boundary of the consequence (Coincident Accountability).
  2.  **Correction:** Reject Framework Legislation as structurally corrupting to accountability.
  3.  **Application:** Remote work requires central floors to prevent regulatory arbitrage, but local enforcement to maintain democratic contact.

  This makes you a **Market-Correcting Federalist**: You decentralize social preferences (wages, buildings) but centralize market rules (safety, platform regulation) that would otherwise allow one jurisdiction to export its costs to another.
