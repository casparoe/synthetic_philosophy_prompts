answer: |-
  C leaned over the schematic, tracing the line of the piston. "The PI wants to write that $p_A$ opens the valve. In the free run, $p_A$ was 3.12 bar. The threshold is 3.0. If $p_A$ had been 2.5 bar at noon, the piston would have shifted left, $p_B$ would have dropped below 3.0, and the valve would have remained shut. That is stepwise counterfactual dependence. My semantics license the claim."

  I shook her head, tapping the port on compartment B. "Your 'if' is doing too much work. To get $p_A$ to 2.5 bar, you must invoke a small miracle. But what does that miracle look like? In this apparatus, there is no handle for $p_A$. The only handles are $T$ and $n_B$. If you lower $T$, you lower $p_B$ directly. If you lower $n_B$, you lower $p_B$ directly. Your miracle surgically sets $p_A$ while holding $T$ and $n_B$ fixed. That is not a law-governed evolution; it is an exogenous intervention. You are smuggling my account into yours without the discipline of specifying the variable set."

  "And you are demanding handles where none exist," C replied. "Causation is about dependence, not manipulability. $p_A$ is constraint-shadowed: no intervention sets it independently, yet its value is load-bearing. In the free configuration, the pressure in A physically pushes the piston. If I evaluate the counterfactual 'Had $p_A$ been lower...' using a local divergence at the piston face, the laws run forward correctly. $p_B$ drops. The valve stays shut. The asymmetry is real: $p_A$ pushes the piston, the piston compresses B. The reverse counterfactual holds too—had $p_B$ been lower, the piston would have moved left, lowering $p_A$—but that doesn't negate the forward chain."

  "But that symmetry is the problem," I said. "At equilibrium, $p_A = p_B = 3.12$. Your chains make each a cause of the other. My framework forces us to choose a representation. If we model the system as equilibrium states, $p_A$ and $p_B$ are simultaneous solutions to a block of equations. Neither causes the other; $T$ and $n_B$ cause both. If we model it as dynamic relaxation, where pressure difference accelerates the piston, then $p_A$ is a parent of piston position, which is a parent of $p_B$. But then I need an intervention on $p_A$. Since there is no handle, I cannot verify the structural equation. You claim your similarity ordering handles this, but in practice, you fix the ordering case-by-case based on intuition about which variables are 'independent.' You're just calling your implicit model 'intuition.'"

  C smiled thinly. "I concede that route-insensitivity is a cost. If every physical route to lowering $p_A$ also lowers $p_B$ via a backdoor, event-level dependence cannot isolate the contribution of $p_A$ as such. In the free run, changing $T$ changes both. My account says $p_A$ causes the valve opening, but it cannot distinguish that from $p_B$ causing it without analyzing the chain. I must admit that without the chain specification, the claim is coarse. But you pay a higher price. Your verdict is hostage to representational choice. If I write the system as welded shut and thermally isolated, there are no exogenous handles. Your theory goes silent. You cannot state causal facts about the early universe or a sealed cylinder without borrowing counterfactuals whose truth conditions your framework has not supplied."

  "I do not go silent," I countered. "I say causal claims are relative to a model. If the model includes no interventions, there are no causal facts. That is not a bug; it is a feature. Causation is about control. But let's test the apparatus. Pin the piston."

  C nodded. "Pinned at the actual position. Volumes fixed. $p_A$ depends only on $T$, $p_B$ on $T$ and $n_B$. The valve is on B."

  "Exactly," I said. "If the piston is pinned, changing $p_A$—even by your miracle—does not change $p_B$. The valve state is independent of $p_A$. The verdict flips. In the free case, you said $p_A$ causes the valve. In the pinned case, it does not. What changed in your account?"

  "The counterfactual structure of the world changed," C said. "In the free case, a miracle at $p_A$ propagates to $p_B$ via the piston motion laws. In the pinned case, the constraint equation $p_A = p_B$ is replaced by $V_A = \text{const}, V_B = \text{const}$. The chain is broken. The world's modal structure is different because the physical constraints are different."

  "In my account," I said, "the model changed. In the free model, there is an equation linking $p_A$ to $p_B$ through piston dynamics. In the pinned model, that link is severed. The asymmetry you cherish—that $p_A$ pushes the piston—is a feature of the dynamic representation, not the equilibrium one. If the lab uses the equilibrium abstract, $p_A$ is not a cause. If they use the dynamic abstract, it might be, provided they treat the piston position as a variable subject to intervention. But they have no handle on the piston either. You say the verdict flips because the world changed. I say it flips because the appropriate representation changed."

  "That costs you," C pressed. "If causal facts depend on which equations we write down, then causation is not in the apparatus. It is in the notebook."

  "It costs you too," I replied. "You must concede that your 'small miracle' is undefined without a variable set. To know where to place the miracle, you need to know which variables are independent. That is my definition of an intervention. You are using my tool but refusing to label it."

  C sighed, looking at the cylinder. "I concede that route-insensitivity prevents me from isolating $p_A$'s contribution when all routes drag $p_B$ along. I cannot tell the lab that $p_A$ did the work rather than $p_B$ without specifying the chain. But you must concede that when there are no handles, your theory cannot articulate the difference between the free and pinned cases without invoking counterfactuals about what *would* happen if there *were* handles. You are borrowing my modal semantics to define your interventions."

  "I concede model-relativity," I said. "I cannot state causal facts about a system with no exogenous handles without specifying a hypothetical model that introduces them. The causal verdict is not absolute; it is relative to the grain of the variables we owe the claim."

  "Then we agree on the physics," C said, "but not on what settles the abstract."

  "No," I said. "We agree on the pinned test. We disagree on what the test proves."

  They sat in silence for a moment, the hum of the heat bath filling the room. Each took a sheet of paper from the PI's stack.

  C wrote: "I need to know whether the laws of nature permit a local violation at $p_A$ that does not propagate backwards to the settings of $T$ and $n_B$."

  I wrote: "I need to know whether the lab's abstract is committed to the equilibrium model or the dynamic relaxation model of the piston."
