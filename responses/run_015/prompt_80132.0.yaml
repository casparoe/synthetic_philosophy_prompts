prompt: |-
  I've just had a long argument with a friend about the inside view versus the outside view, and I'd like a fair adjudication of who's right about what. He says that epistemic modesty—deferring to base rates and the outside view—is always the right epistemic stance, and that the inside view (reasoning from the specifics of the case) is the source of the planning fallacy, so we should correct for it. I replied that the outside view only works if the reference class is relevant, and that determining relevance requires the very kind of case-specific, inside-view reasoning he's trying to avoid—so the epistemic modesty he's advocating actually depends on the epistemic confidence he's trying to eliminate. He said I was just relabeling the mistake—that I should use the narrowest relevant reference class, and that "relevance" is a matter of common sense. I said that "relevance" is doing all the work, and that without a principled way to determine it, the outside view reduces to picking whichever base rate confirms your prior expectation. He conceded that the reference class problem is real, but said it's a practical, not a principled, problem, and that in practice people can usually figure out the relevant reference class. Can you go through our exchange and say who's right at each step—not just who wins overall? And what, if anything, are we both missing about the relationship between epistemic modesty and the inside-view reasoning that the outside view actually depends on?
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Topic:** Inside View vs. Outside View (Kahneman/Lovallo concept), Epistemic Modesty, Reference Class Problem.
      *   **Participants:** User vs. Friend.
      *   **Task:** Adjudicate the argument step-by-step (who is right at each stage), determine an overall winner (if any), and identify what *both* are missing about the relationship between epistemic modesty and inside-view reasoning.
      *   **Tone:** Fair, analytical, philosophical but practical.

  2.  **Deconstruct the Argument Steps:**

      *   *Step 1 (Friend):* Epistemic modesty (outside view/base rates) is *always* the right stance. Inside view causes planning fallacy.
      *   *Step 2 (User):* Outside view requires a relevant reference class. Determining relevance requires inside-view reasoning. Therefore, modesty depends on confidence.
      *   *Step 3 (Friend):* Just use the narrowest relevant reference class. "Relevance" is common sense.
      *   *Step 4 (User):* "Relevance" is doing all the work. Without a principled way to determine it, outside view is just confirmation bias (picking base rates that fit priors).
      *   *Step 5 (Friend):* Concedes reference class problem is real but claims it's practical, not principled. People can usually figure it out.

  3.  **Evaluate Each Step (Mental Check & Knowledge Retrieval):**

      *   *Step 1:* Friend says "Always." This is a strong claim. Kahneman/Thaler advocate for the outside view to correct bias, but rarely say "always" to the exclusion of inside information. The inside view *is* necessary for unique details. *Verdict:* User is more correct here; "Always" is too strong.
      *   *Step 2:* User claims reference class selection requires inside-view reasoning. This is the core of the "Reference Class Problem" (Hájek, Kahneman). To decide if "startups" or "tech startups" or "tech startups founded by ex-Googlers" is the right class, you need to know the specifics of the case. *Verdict:* User is right.
      *   *Step 3:* Friend says "Narrowest relevant" + "Common sense." "Narrowest relevant" is the standard advice (Kahneman), but "common sense" is hand-wavy. It hides the cognitive labor. *Verdict:* Friend is partially right on the rule, but wrong to dismiss the difficulty as just "common sense."
      *   *Step 4:* User says "Relevance is doing all the work" and warns of confirmation bias. This is a profound insight. If I think I'm special, I'll pick a narrow class where I succeed. If I think I'm average, I'll pick a broad class. *Verdict:* User is right.
      *   *Step 5:* Friend says it's a "practical, not principled" problem. This is a retreat. It *is* a principled problem (philosophy of probability), but maybe solvable in practice. *Verdict:* Mixed. It is principled, but Friend is right that we must act despite it.

  4.  **Synthesize the "Missing" Element:**
      *   What is the relationship? It's not a binary switch (Inside OR Outside). It's a dialectic.
      *   The Outside View provides the *prior*. The Inside View provides the *likelihood* (evidence).
      *   Bayesian updating is the formal framework missing from both.
      *   Epistemic modesty isn't just deferring to base rates; it's acknowledging the uncertainty in *selecting* the base rate.
      *   The "Inside View" isn't just storytelling; it's feature selection for the reference class.

  5.  **Drafting the Adjudication (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic problem in decision theory.
      *   *Round-by-Round:*
          *   R1 (Friend's "Always"): Point out the dogmatism. Inside view has value for *differentiation*.
          *   R2 (User's "Relevance requires Inside"): Strong point. This is the crux.
          *   R3 (Friend's "Common Sense"): Weak point. "Common sense" is often where bias hides.
          *   R4 (User's "Confirmation Bias"): Strong point. Motivated selection of reference classes is a known phenomenon.
          *   R5 (Friend's "Practical not Principled"): Philosophical error, but pragmatic truth.
      *   *Overall Winner:* User wins on theory/philosophy. Friend wins on pragmatic intent (we *should* lean outside). But User's critique is more fundamental.
      *   *The Missing Piece:* Bayesianism. The Outside View = Prior. The Inside View = Likelihood Ratio. You need both. Also, the concept of "Reference Class Forecasting" (Flyvbjerg) vs. pure statistical reference classes.

  6.  **Refining the Tone:**
      *   Avoid saying "You won." Say "Your argument held more weight here."
      *   Ensure the Friend isn't caricatured; their intuition (bias correction) is valuable.
      *   Highlight that Kahneman himself struggled with this (he advocated Outside View but acknowledged the difficulty).

  7.  **Final Polish:**
      *   Check for clarity on "Reference Class Problem."
      *   Ensure the Bayesian analogy is clear but not overly technical.
      *   Make sure the conclusion offers actionable advice, not just theory.

      *(Self-Correction during drafting)*: I need to be careful not to say the Inside View is *good* for planning. The Inside View is usually where the *bias* lives. But the Inside View is necessary to *construct* the Outside View. I need to make that distinction clear. The User conflates "Inside View reasoning" (storytelling) with "Feature selection for Reference Class." I should clarify that distinction.

      *Revised plan for "Missing Piece":* Distinguish between Inside View as *narrative construction* (bad for prediction) vs. Inside View as *feature analysis* (necessary for reference class selection).

  8.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is a sophisticated debate that cuts to the core of decision theory, behavioral economics, and epistemology. You and your friend are essentially arguing about the **Reference Class Problem**, a dilemma formalized by philosophers like Hans Reichenbach and Alan Hájek, and popularized in psychology by Daniel Kahneman.

  Here is the adjudication of your exchange, step-by-step, followed by an analysis of what you are both missing.

  ### Step-by-Step Adjudication

  **Round 1**
  *   **Friend:** Epistemic modesty (Outside View) is *always* right; Inside View causes the planning fallacy.
  *   **You:** Outside View requires a relevant reference class; determining relevance requires Inside View reasoning.
  *   **Verdict:** **You are right.**
  *   **Reasoning:** Your friend's claim that the Outside View is *always* the right stance is dogmatic. The Outside View is a corrective tool, not a replacement for all reasoning. If the Outside View were sufficient on its own, we wouldn't need to know anything about the specific case to make a prediction. However, as you noted, you cannot select a base rate without first analyzing the specific case to know *which* base rate applies. The Inside View is the prerequisite for the Outside View.

  **Round 2**
  *   **Friend:** Use the "narrowest relevant reference class." Relevance is "common sense."
  *   **You:** "Relevance" is doing all the work. Without a principled way to determine it, the Outside View becomes confirmation bias (picking base rates that fit your prior).
  *   **Verdict:** **You are right.**
  *   **Reasoning:** Your friend appeals to "common sense" to solve a philosophical impasse. In cognitive science, "common sense" is often where motivated reasoning hides. If I believe my startup will succeed, my "common sense" will tell me the relevant class is "Startups founded by Harvard grads" (high success rate) rather than "All Startups" (low success rate). You correctly identified that the selection of the reference class is where the bias often enters, not just in the interpretation of the outcome.

  **Round 3**
  *   **Friend:** Concedes the Reference Class Problem is real but calls it "practical, not principled." Claims people can usually figure it out.
  *   **Verdict:** **Split (Philosophically Friend is wrong; Pragmatically Friend is partially right).**
  *   **Reasoning:** Philosophically, your friend is incorrect. The Reference Class Problem is a *principled* problem in probability theory (there is no mathematical rule for which class is the "true" class). However, pragmatically, he is right that we must act. We cannot let the paralysis of the reference class problem stop us from using base rates entirely. In many clear-cut cases (e.g., "How long will it take to drive to the airport?"), the reference class is obvious enough that the "practical" solution works.

  **Overall Winner:** **You.**
  While your friend is advocating for a healthy corrective against overconfidence, your critique is more fundamental. You successfully demonstrated that the Outside View is not a magic bullet that bypasses the need for judgment; it merely shifts the burden of judgment from "predicting the outcome" to "selecting the comparison group."

  ---

  ### What You Are Both Missing

  While you won the argument on the mechanics of the Reference Class Problem, both of you are operating with a slightly flawed mental model of how the Inside and Outside Views relate. You are treating them as opposing forces (Modesty vs. Confidence), when they are actually **complementary inputs in a Bayesian update.**

  Here is what is missing from your shared understanding:

  #### 1. The Outside View is the Prior, The Inside View is the Likelihood
  In Bayesian terms, the Outside View provides your **Prior Probability** (the base rate). The Inside View provides the **Likelihood Ratio** (evidence specific to this case that updates the prior).
  *   **Friend's Error:** He treats the Prior as the Posterior. He thinks knowing the base rate *is* the prediction.
  *   **Your Error:** You treat the selection of the Prior as purely an Inside View task.
  *   **The Synthesis:** You start with the broadest reasonable base rate (Outside). Then, you use specific case details (Inside) to adjust *away* from that base rate only if you have valid, predictive information.
      *   *Example:* Base rate for startups failing is 90% (Outside). Inside view: "But we have a patent." Does having a patent historically reduce failure rates in this specific industry? If yes, update the probability. If no (if patents are noise), stay at 90%.
      *   **Epistemic Modesty** isn't just deferring to the base rate; it is demanding high standards of evidence before allowing the Inside View to move you *away* from the base rate.

  #### 2. "Inside View" vs. "Feature Selection"
  You argued that determining relevance requires "inside-view reasoning." This is true, but it conflates two different types of inside-view reasoning:
  *   **Narrative Construction (Bad):** "We will succeed because our team is passionate and our vision is clear." This is the planning fallacy source your friend fears.
  *   **Feature Selection (Good):** "We need to find a reference class of companies that share *these specific structural attributes*."
  *   **The Missing Insight:** The goal isn't to eliminate Inside View reasoning; it is to discipline it. You use Inside View reasoning *strictly* to identify which variables are causally predictive, so you can find the correct reference class. Once the class is found, you must suppress the Inside View narrative regarding the outcome.

  #### 3. The "Objective" Reference Class Doesn't Exist
  Your friend thinks there is a "narrowest relevant class" waiting to be found. You think the selection is arbitrary.
  *   **The Reality:** There is no single "correct" reference class. There are only **predictive models**.
  *   **What's Missing:** Instead of arguing about which class is "relevant," you should argue about **validity**. The right reference class is the one that has demonstrated predictive validity in the past.
  *   *Example:* If you are predicting divorce, is the relevant class "All marriages," "Marriages in California," or "Marriages where the couple met at a bar"? The right one is whichever variable has the highest statistical correlation with divorce outcomes, not whichever one feels most "relevant" via common sense.

  ### The Final Verdict on Epistemic Modesty

  Your friend defines Epistemic Modesty as **deferring to the Outside View.**
  You define Epistemic Modesty as **acknowledging the uncertainty in selecting the Outside View.**

  **The True Definition:** Epistemic Modesty is acknowledging that **both** your base rate selection *and* your case-specific adjustments are prone to error.

  **How to resolve the dispute:**
  Tell your friend: "You are right that we need to lean on base rates to cure the planning fallacy. But I am right that picking the base rate is where the bias hides. Therefore, true epistemic modesty requires us to:
  1.  State the base rate we are using.
  2.  Explicitly justify *why* this reference class was chosen over others (using inside-view features).
  3.  Acknowledge that if our feature selection is wrong, our base rate is wrong."

  This validates his desire for correction while preserving your insight about the structural dependency of the Outside View on Inside View reasoning.
