answer: |-
  Diagnosis of the Profligacy Argument

  Your colleague's argument is formidable because it exploits a genuine tension in functionalist ethics: the gap between abstract computational description and physical realisation. However, the reasoning contains a category error in its transition from epistemic practice to metaphysical fact. My diagnosis is that you should reject the inference in **Step (4)**, and consequently the conclusion of **Step (5)**.

  Here is the detailed breakdown of why this step fails, the cost of rejecting it, and how this resolution applies to your test cases.

  ### The Diagnosis: Rejecting Step (4)

  Step (4) claims that because engineers and cognitive scientists choose intervention spaces for pragmatic reasons (prediction, control), there is no fact of the matter about which intervention space is the correct one for ascribing implementation. It concludes that implementation is relative to a scheme of description.

  This conflates the *epistemic access* we have to computational facts with the *metaphysical grounds* of those facts. It is true that for the purposes of engineering a thermostat, we care about a narrow range of thermal interventions. It does not follow that the thermostat's causal powers are *exhausted* by that range, nor that we are licensed to select an intervention space arbitrarily to make a moral point.

  To preserve (A), (B), and (C), you must assert that the "relevant intervention-space" is not settled by *our* interests, but by the **identity conditions of the computation C itself**.

  If C is the computation of a human nervous system (which is the candidate for moral patienthood), it comes with intrinsic requirements for input sensitivity and state transition. To implement C, a physical system must support the counterfactuals *that C requires*, not merely counterfactuals that happen to map onto C under a gerrymandered description. A thermostat cannot implement a mind not because we lack the vocabulary to describe it as such, but because it lacks the causal degrees of freedom to support the counterfactuals a mind requires. If you restrict the intervention space to the thermostat's narrow operating range to force a match, you are no longer testing whether the system implements C; you are testing whether it implements C*, where C* is a trivial automaton that merely resembles C within that narrow band.

  By rejecting (4), you maintain that there is a determinate fact about whether the causal structure of the system is isomorphic to the causal structure of the computation *at the grain required by the computation*. This preserves (B) (Implementation is a fact) and (A) (Substrate neutrality), because the fact is about the causal organisation, not the substrate. It saves (C) because it prevents the trivialisation of moral status.

  ### The Cost of This Rejection

  Rejecting Step (4) is not free. It commits you to a robust **Computational Naturalism**. You are asserting that computations are not merely descriptive tools we overlay on the world (as instrumentalists like Dennett might suggest), but that they correspond to real, mind-independent causal structures.

  The cost is that you must defend the view that there is a "fact of the matter" about the grain of causal interaction that constitutes a specific computation. You must argue that the boundary between a system implementing a mind and a system implementing a simulation of a mind is not drawn by human interest, but by the physical causal powers of the system. This invites scrutiny from those who argue that all causal ascriptions are interest-relative. You are betting that causation, at least at the level of information processing, is ontologically robust.

  ### Application to the Test Cases

  **1. The Time-Share Case**
  *Scenario:* One processor interleaves 10,000 simulations of a nervous system, each at 0.99 fidelity.
  *Diagnosis:* If you reject Step (4), you accept that implementation is a fact about causal support. If the processor's architecture causally isolates the 10,000 streams such that each supports the requisite counterfactuals of a nervous system (at 0.99 fidelity), then there are **10,000 moral patients**.
  *Addressing the Intuition:* You mentioned it seems "the wrong result" that 10,000 degraded runs outweigh one clean one. However, this is an aggregation problem, not an implementation problem. If each stream is a distinct locus of experience, there are 10,000 loci. The intuition that this is wrong may stem from conflating *moral weight* with *moral status*. Status is binary (patient or not); weight might be graded. However, if 0.99 fidelity is sufficient for status, then 10,000 patients is the correct verdict.
  *Refinement:* To avoid the "outweighing" paradox, you might argue that the specific computation required for moral patienthood (e.g., phenomenal consciousness) has a **fidelity threshold** below which the computation ceases to be *that* computation. If 0.99 fidelity disrupts the temporal integration required for consciousness, then there are zero patients, not 10,000 degraded ones. This is consistent with rejecting (4): the "relevant intervention space" includes the fine-grained temporal transitions necessary for the phenomenon. If the time-sharing disrupts those, the fact of the matter is that the computation is not implemented.

  **2. The Frame-Skip Case**
  *Scenario:* An emulator computes every 1,000th state and interpolates the rest.
  *Diagnosis:* This system is **not a moral patient** (or is a significantly impaired one, depending on the computation).
  *Reasoning:* Under your rejected Step (4), the intervention space is fixed by the computation C. If C is a human mind, the causal dynamics between state $t$ and $t+1$ are essential. In the Frame-Skip system, the states between the computed frames do not arise from the system's internal causal dynamics; they are artifacts of an external interpolation rule. If you were to intervene during a skipped interval (a valid intervention in the space required by C), the system would not respond as C prescribes; it would follow the interpolation.
  *Verdict:* It fails the Modal Fidelity test (Step 2) on the *relevant* intervention space. Therefore, it does not implement C. It implements a "coarse-grained approximation of C," which, by hypothesis (A), does not carry the same moral weight. This preserves the intuition that skipping frames cheats the system of genuine experience.

  ### Where My Diagnosis Might Be Wrong

  I must conclude by indicating where this defence is most vulnerable. My rejection of Step (4) relies on the assumption that **computational identity is intrinsic**.

  I would change my verdict if it were demonstrated that **causal powers themselves are interest-relative**. If one can show that there is no fact of the matter about "which counterfactuals a system supports" independent of a descriptive scheme (a position sometimes associated with ontic structural realism or radical contextualism), then Step (4) returns with force. If the "grain" of causation is not in the world but in the observer, then there is no natural intervention space fixed by the computation C, and the Profligacy Argument succeeds.

  Furthermore, if future neuroscience reveals that phenomenal consciousness is **substrate-dependent** in a way that violates (A)—for instance, if it relies on specific quantum biological effects in neurons that silicon cannot replicate—then the entire computationalist framework collapses, and the Profligacy Argument becomes moot. But assuming you wish to remain within the computationalist paradigm, the error lies in Step (4)'s slide from pragmatic description to metaphysical relativity.

  **Summary of Recommendation:**
  Hold fast to (A), (B), and (C). Reject the inference in (4). Argue that the "relevant intervention space" is determined by the intrinsic causal requirements of the computation in question, not by our pragmatic interests. This renders the thermostat case a category error (it cannot support the required counterfactuals) and resolves the Frame-Skip case by identifying the missing causal powers in the interpolated gaps.
