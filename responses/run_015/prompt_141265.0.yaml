prompt: |-
  Hi — I work at a smallish foundation (about £14m a year, four programme staff) and last year our trustees got excited about the idea of moral trade: the thing where two groups who disagree about what's actually good each do what the other wants, and both come out ahead by their own lights, more or less the way two countries trade when each is better at something. They've now made it a formal funding line — we put up money when two organisations with genuinely conflicting moral views each commit to doing something the other values that they wouldn't have done on their own — and I'm the one who has to turn that into something we can actually run.

  The problem is we now get three or four of these a month, I have roughly two days per proposal, and sign-off is a single meeting with a committee of four: me, a trustee who used to run a logistics company, and two programme officers with no philosophy background at all. Our trustees also require that any yes be explainable in one sentence to a journalist who is going to write it up as "foundation pays charity to do thing it thinks is worthless." And about half our money comes from a restricted gift whose donor died in 2019 and left a letter of wishes, which matters for one of the cases below.

  So I need a procedure, not an essay: ordered questions I can walk the committee through, what counts as a good enough answer to each one, the points where the answer is a hard no and we stop, and the points where the honest move is to stop and say this is a values call, and here is who makes it. Please be blunt about which steps are really judgment wearing a lab coat.

  Things it has to handle, because they've already bitten us:

  - The would-have-happened-anyway problem. Half the proposals are just two groups discovering they wanted the same thing, or one group announcing it will now do the thing we were about to fund anyway. I've started calling these coincidence deals and I need a test that kills them in the first ten minutes — including when we can't establish the counterfactual, because everyone lies about what they would have done.
  - The overbidding problem. Since I can only be paid in the other side's values, the other side has every reason to tell me they care about my thing far more than they do, so that I give them more. We have no way to audit what anyone actually values. What's the least-bad way to handle that — staging, matching, symmetric disclosure, third-party holds, something else — and when does the right answer become "we can't price this, so we cap the deal"?
  - Hostage deals. Twice now a group has come to us offering not to do something harmful it was going to do anyway — a campaign, a legal challenge, a regulatory complaint — if we fund its programme. Sometimes that reads to me as extortion with better manners, and sometimes the threatened harm is real, the people making the threat are sincere, and the deal would genuinely leave everyone better off by their own lights. I need the procedure to tell those apart, or to tell me plainly that it can't.
  - Dirty hands on their side. A couple of proposals require one party to do something that's fine by our lights but that they say they think is wrong, and they've agreed only because we're paying. My instinct is that this isn't a partner, it's a corrupted partner, and it will fall apart. I'd like that turned into a check rather than a vibe.
  - Who is actually trading. One case below involves an endowment whose mission was written by someone who's dead. Do we count the mission as a party to the trade? I keep going back and forth on whether a commitment that outlives the person who made it can be traded away by whoever is holding the pen now, and what it would even take for that to be legitimate rather than just convenient.

  Then please run it on three:

  1. A global-health charity (think animal suffering counts for little, wants to buy bed nets) and an animal-welfare charity (thinks bed nets are a rounding error next to farmed fish). Proposal: we fund each of them to run one year of the other's programme, matched pound for pound. On its face this is the cleanest thing we've seen.

  2. A well-funded advocacy organisation — call them the Alliance — that exists mostly to oppose a hospital expansion our health grantees want. They offer to withdraw their objection and not file suit if we fund a year of their community health worker programme. They say, and I half beleive them, that they would file and would probably win.

  3. The one I know I'm biased on, so be especially annoying about it: a religious hospital network in a country where we work will take on a full maternal-health service that we think is the best thing on offer in the region, but only if we fund a chaplaincy and end-of-life counselling programme that we think does nothing — some of us think it does less than nothing, that it talks people out of decisions that are theirs to make. As far as I can tell the theology behind the network's side of the deal is straightforwardly false, and I find parts of it grim. My instinct is to find a reason to say no. If the procedure says yes, I want to be told that clearly, along with what I'd have to put in the committee note and what the strongest version of my own objection actually is.

  Finally, tell me what the whole frame can't do: the cases where "go find a trade" is the wrong move and we should just be doing ordinary grantmaking, or politics, or nothing at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Programme staff at a small foundation (£14m/year, 4 staff).
      *   **Context:** Trustees mandated "moral trade" funding (two groups with conflicting views swap actions to mutual benefit).
      *   **Constraints:** High volume (3-4 proposals/month), low time per proposal (2 days), simple approval process (4-person committee, one-sentence press explanation), restricted funds involved (dead donor's letter of wishes).
      *   **Needs:** A blunt, procedural checklist (ordered questions, pass/fail criteria, stop points), not an essay. Must handle specific pitfalls (counterfactuals, overbidding, hostage deals, dirty hands, dead donor constraints).
      *   **Task:** Create the procedure, then apply it to three specific cases, then outline the frame's limitations.
      *   **Tone:** Blunt, practical, operational, acknowledging where judgment replaces rigor ("judgment wearing a lab coat").

  2.  **Deconstruct the "Moral Trade" Concept:**
      *   Core mechanism: Party A does X (values Y), Party B does Y (values X). Foundation funds the swap.
      *   Key risk: Additionality (would they have done it anyway?), Integrity (is this extortion?), Authenticity (do they actually value the swap?), Legitimacy (who represents the values?).

  3.  **Drafting the Procedure (The "Moral Trade Protocol"):**
      *   *Goal:* Filter fast, identify hard stops, isolate value judgments.
      *   *Structure:* Sequential gates. If you fail Gate 1, stop.
      *   *Gate 1: The Counterfactual (Additionality).* This is the "would-have-happened-anyway" problem.
          *   Test: Sunk cost vs. Marginal cost. If they were already budgeted for it, it's a coincidence deal.
          *   Blunt truth: We can't audit minds, so we audit budgets and public commitments.
      *   *Gate 2: The Hostage Test (Coercion).* This is the "extortion" problem.
          *   Test: Is the harmful action *new* or *pre-existing strategy*? If they threaten new harm to get money, it's extortion. If they suspend existing harmful strategy for money, it's a trade.
          *   Nuance: Distinguish between "we will sue" (strategy) and "we will burn the building" (new harm).
      *   *Gate 3: The Valuation Test (Overbidding).* This is the "pricing" problem.
          *   Test: Symmetric stakes. Does the cost to A of doing Y equal the benefit to B of getting Y?
          *   Mechanism: Staged funding or matching caps.
      *   *Gate 4: The Integrity Test (Dirty Hands).* This is the "corrupted partner" problem.
          *   Test: Internal consistency. Does doing Y violate Party A's core operational identity or just their preference?
          *   Stop: If doing Y makes them hypocritical in a way that destroys trust.
      *   *Gate 5: The Authority Test (Dead Donors/Mission).* This is the "who is trading" problem.
          *   Test: Fiduciary duty vs. Donor intent. Can current trustees legally/ethically deviate from the founding mission for a trade?
          *   Hard Stop: If it violates the letter of wishes/restricted gift terms.
      *   *Gate 6: The Press Test (Legibility).*
          *   Test: The one-sentence rule.

  4.  **Refining the Procedure (Self-Correction/Polishing):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Make the questions "Yes/No" or "Show me the document."
      *   *Critique:* How to handle the "judgment wearing a lab coat" requirement?
      *   *Fix:* Explicitly label steps where data runs out and intuition takes over.
      *   *Critique:* The restricted fund issue needs specific handling.
      *   *Fix:* Add a specific "Restricted Funds" gate early on.

  5.  **Applying to Case 1 (Global Health vs. Animal Welfare):**
      *   *Counterfactual:* Did they budget for this? If not, pass.
      *   *Hostage:* No threats. Pass.
      *   *Valuation:* Matched pound-for-pound helps.
      *   *Integrity:* Bed nets aren't immoral to animal welfarists, just low priority. Fish farming isn't immoral to health folks, just low priority. Pass.
      *   *Verdict:* Yes, this is the archetype.

  6.  **Applying to Case 2 (The Alliance/Hospital Expansion):**
      *   *Hostage:* This is the tricky one. They are threatening a lawsuit (harm to us/grantees) to get funding.
      *   *Analysis:* Is the lawsuit a "hostage" or a "strategy"? If they *planned* to sue anyway, stopping it is a concession. If they *invented* the threat to get money, it's extortion.
      *   *Procedure:* Gate 2 (Hostage). If the threat is credible and pre-existing, it's a trade. If it's bluffed, it's extortion.
      *   *Verdict:* High risk. Likely a "No" unless independent legal counsel confirms the lawsuit was imminent and viable *before* the negotiation.

  7.  **Applying to Case 3 (Religious Hospital/Chaplaincy):**
      *   *User Bias:* User thinks theology is false/harmful.
      *   *Procedure Check:*
          *   Counterfactual: Would hospital do maternal health without money? No (they said "only if").
          *   Counterfactual: Would we fund chaplaincy otherwise? No (we think it's useless).
          *   Integrity: Is the hospital "corrupted" by taking money for chaplaincy? No, it aligns with their mission. Are *we* corrupted? We are paying for something we think is useless. That's the point of moral trade.
          *   Restricted Funds: *Crucial.* Does the dead donor's letter allow funding religious counselling? If yes, pass. If no, Hard Stop.
          *   Press Test: "Foundation pays religious group to preach theology we dislike in exchange for saving mothers' lives." Hard to sell, but accurate.
      *   *Verdict:* Procedurally Yes (if restricted funds allow), but requires owning the "paying for falsehood" label.

  8.  **Defining the Frame's Limits:**
      *   When *not* to trade?
      *   Zero-sum conflicts (rights violations).
      *   When one side is acting in bad faith.
      *   When the transaction cost exceeds the benefit.
      *   When it undermines democratic accountability (buying off opposition).

  9.  **Final Review against Constraints:**
      *   *Blunt?* Yes.
      *   *Ordered questions?* Yes.
      *   *Hard stops identified?* Yes.
      *   *Judgment points flagged?* Yes.
      *   *One-sentence press test included?* Yes.
      *   *Restricted fund issue addressed?* Yes.

  10. **Drafting the Response:** (Iterative refinement for tone—ensure it sounds like a senior colleague talking to a stressed programme officer, not a philosophy professor.) *Self-correction: Make sure the "Dead Donor" issue is highlighted as a legal/compliance hard stop, not just a moral one.* *Ensure the "Hostage" distinction is clear between "striking a bargain" and "protection racket."*

  11. **Final Polish:** Check the three cases against the specific gates to ensure consistency. (Case 2 is the most dangerous, Case 3 is the most personally difficult for the user, Case 1 is the control).

  *(Self-Correction during drafting Case 2)*: I need to be careful about the "lawsuit" aspect. In moral trade theory (Huemer/Bradley), paying someone *not* to exercise a right (like suing) is often considered problematic if it looks like bribery. But if it's a "strike a deal to avoid litigation costs," it's standard. The distinction is whether the lawsuit is a *lever* created for the deal or a *cost* avoided by the deal. I will frame the procedure to demand evidence of pre-existing intent.

  *(Self-Correction during drafting Case 3)*: The user's bias is the main hurdle. The procedure must force them to admit if the objection is "this is false" vs "this is harmful." Moral trade allows funding "false" things if the *outcome* is net positive by the trader's lights. The restricted fund is the real killer here.

  *(Final check on "Judgment wearing a lab coat"):* I need to explicitly mark where the procedure admits it can't measure truth and relies on heuristic proxies.

  Okay, ready to write.s
answer: |-
  Here is a procedural framework designed for your constraints: high volume, low time, high scrutiny. It treats moral trade not as philosophy but as compliance and risk management.

  ### The Moral Trade Protocol (MTP)

  **Time limit:** 90 minutes for initial triage. If it passes all gates, it goes to the committee.
  **Rule:** If any gate is a **HARD STOP**, you reject immediately. Do not pass to committee. If any gate is a **JUDGMENT CALL**, flag it for the committee vote.

  #### Gate 1: The Restricted Fund Check (Compliance)
  *   **Question:** Does either side of the trade violate the letter of wishes of the 2019 restricted gift or current charity law?
  *   **Evidence:** Compare the specific activity being funded against the donor's letter.
  *   **Pass:** Activity is permissible under the trust deed.
  *   **Hard Stop:** Activity is explicitly excluded or legally dubious (e.g., funding political campaigning if restricted to "relief of poverty").
  *   **Judgment Wearing a Lab Coat:** Interpreting "spirit of the gift" vs. "letter of the gift." If the donor wanted X, and this trade funds Y to get Z, is Z close enough to X? *If you have to argue for more than 10 minutes here, it's a No.*

  #### Gate 2: The Counterfactual Test (Additionality)
  *   **Question:** Can each party prove they were *not* going to do the other side's activity without this deal?
  *   **Evidence:** 
      1.  Board minutes from the last 12 months showing the activity was *not* in the strategic plan.
      2.  Budget drafts showing zero allocation for this activity prior to negotiation.
      3.  Public statements committing to the *opposite* or *nothing*.
  *   **Pass:** Documentary evidence that the activity is new marginal cost.
  *   **Hard Stop:** Either party cannot produce paper trails showing this is new money/new work. (If they say "we would have done it eventually," treat as "would have done it anyway").
  *   **Judgment Wearing a Lab Coat:** People lie about intent. You are auditing paperwork, not minds. If the paperwork is ambiguous, assume it's a coincidence deal and reject.

  #### Gate 3: The Hostage Test (Coercion)
  *   **Question:** Is the "harm" being avoided a pre-existing strategy or a new threat created for negotiation?
  *   **Evidence:** 
      1.  Timeline of the threat (e.g., legal filing, campaign launch) relative to the funding ask.
      2.  Cost-benefit analysis from the threatening party showing the threat was viable *before* money was mentioned.
  *   **Pass:** The harmful action was a credible, planned strategy that they are willing to *suspend* for value.
  *   **Hard Stop:** The harmful action appears to have been invented or escalated *after* funding discussions began. (This is extortion).
  *   **Judgment Wearing a Lab Coat:** Distinguishing between "bargaining chip" and "protection racket." If the threat seems disproportionate to their usual modus operandi, it's a Hard Stop.

  #### Gate 4: The Integrity Test (Dirty Hands)
  *   **Question:** Does performing the trade activity violate the core operational identity of the partner?
  *   **Evidence:** A signed statement from the partner's leadership confirming the activity does not violate their internal ethics codes or fiduciary duties.
  *   **Pass:** They are doing something they dislike or deprioritize, but not something they deem *unethical*.
  *   **Hard Stop:** They admit the activity is morally wrong *for them* to do, even if paid. (This creates a partner who will sabotage the work or leak later).
  *   **Judgment Wearing a Lab Coat:** Distinguishing "low priority" from "moral violation." If they say "we hate this but we'll do it," pass. If they say "this is sinful/wrong but we'll do it for cash," stop.

  #### Gate 5: The Valuation Test (Overbidding)
  *   **Question:** Is the exchange rate symmetric and capped?
  *   **Mechanism:** 
      1.  Funding must be 1:1 matched or strictly capped at the marginal cost of the activity.
      2.  Staged payments: 50% on commitment, 50% on verified delivery.
  *   **Pass:** Both sides accept a cap based on actual cost, not "value to us."
  *   **Hard Stop:** Either side demands payment based on how much they *value* the outcome rather than the cost of the *input*.
  *   **Judgment Wearing a Lab Coat:** You cannot measure utility. You can only measure cost. If they argue about "value," tell them you fund costs, not feelings.

  #### Gate 6: The Press Test (Legibility)
  *   **Question:** Can you write the one-sentence explanation without using the word "compromise"?
  *   **Template:** "The Foundation funded [Party A] to do [X] and [Party B] to do [Y], resulting in [Concrete Outcome] that neither would have achieved alone."
  *   **Pass:** The sentence sounds like a transaction, not a surrender.
  *   **Hard Stop:** The sentence sounds like "We paid Group X to stop attacking us."

  ---

  ### Application to Your Three Cases

  #### Case 1: Global Health vs. Animal Welfare (Bed Nets vs. Fish)
  *   **Gate 1 (Restricted):** Clear. (Assuming no religious/ethical restrictions on bed nets or fish).
  *   **Gate 2 (Counterfactual):** **Check budgets.** If the animal charity had no line item for bed nets, and the health charity had no line item for fish welfare, this passes. This is the archetype.
  *   **Gate 3 (Hostage):** No threats. Pass.
  *   **Gate 4 (Integrity):** Neither thinks the other's work is *evil*, just less important. Pass.
  *   **Gate 5 (Valuation):** Matched pound-for-pound caps the risk. Pass.
  *   **Gate 6 (Press):** "Foundation funded bed nets and fish welfare reforms simultaneously, increasing total welfare output."
  *   **Verdict:** **YES.** This is the control case. If you can't fund this, the policy is broken.

  #### Case 2: The Alliance (Hospital Expansion vs. Lawsuit)
  *   **Gate 1 (Restricted):** Check if funding "community health workers" fits the remit.
  *   **Gate 2 (Counterfactual):** **High Risk.** You need independent legal counsel to verify the lawsuit was viable *before* this offer. If the Alliance had not retained counsel or drafted filings prior to approaching you, this is a bluff.
  *   **Gate 3 (Hostage):** **Critical Failure Point.** If the lawsuit threat was escalated *because* they knew you wanted the expansion, this is extortion. 
      *   *Procedure:* Ask for the legal risk assessment dated *before* the funding talk. If it doesn't exist, **HARD STOP**.
  *   **Gate 4 (Integrity):** Are they abandoning their mission to oppose the hospital, or just picking a battle? If their mission is "stop hospitals," this corrupts them. If their mission is "community health," this aligns.
  *   **Gate 5 (Valuation):** You are effectively paying a ransom. Cap the funding at the *cost* of their health worker programme, not the *value* of the hospital expansion.
  *   **Gate 6 (Press):** "Foundation funded community health workers in exchange for the Alliance withdrawing a legal challenge." -> **FAIL.** This reads as bribery.
  *   **Verdict:** **NO.** The Press Test and Hostage Test likely kill this. It looks like buying off opposition, which undermines democratic process. Even if legally clean, the reputational risk is asymmetric.

  #### Case 3: Religious Hospital (Maternal Health vs. Chaplaincy)
  *   **Gate 1 (Restricted):** **The Kill Switch.** You mentioned the 2019 donor letter. If that letter restricts funding to "secular medical intervention" or prohibits "religious proselytizing," this is a **HARD STOP**. No amount of moral trade overrides a legal restriction on funds.
      *   *Assumption for below:* Assume the funds allow it.
  *   **Gate 2 (Counterfactual):** Hospital says "only if we fund chaplaincy." You say "we wouldn't fund chaplaincy otherwise." This is genuine additionality. Pass.
  *   **Gate 3 (Hostage):** They aren't threatening harm; they are withholding a benefit (maternal health) unless paid. This is standard negotiation, not extortion. Pass.
  *   **Gate 4 (Integrity):** 
      *   *Their side:* Chaplaincy is core to their mission. Not corrupted.
      *   *Your side:* You think the theology is false. **This is not an Integrity failure for you.** In moral trade, you are *allowed* to fund things you think are useless if the return (maternal health) is high enough. 
      *   *The Check:* Do you think the chaplaincy causes *active harm* (e.g., preventing contraception)? If yes, **HARD STOP** (Gate 3/4 overlap). If it's just "useless spiritual comfort," it passes.
  *   **Gate 5 (Valuation):** Cap funding at the cost of the chaplains, not the "value of souls saved."
  *   **Gate 6 (Press):** "Foundation funded maternal health services and end-of-life counselling to maximize patient care coverage in the region." (Omit the theology bit).
      *   *Honest Version:* "Foundation paid for religious counselling to secure life-saving medical care."
  *   **Verdict:** **YES (Procedurally),** provided the Restricted Fund allows it and the counselling doesn't actively block medical decisions.
      *   *Committee Note:* You must record that you are funding activity you deem theologically false. The justification is not that the chaplaincy is good, but that it is the *price* of the maternal health service.
      *   *Your Objection:* Your instinct is that funding falsehood legitimizes it. The counter-argument is that saving lives trumps theological purity in a trade framework. If you cannot stomach funding falsehood, you must veto this at the **Values Call** stage (see below).

  ---

  ### Where the Procedure Hands Off to Humans

  There are three points where the checklist fails and you must explicitly flag a **Values Call**. Do not pretend these are operational decisions.

  **1. The "Active Harm" Threshold (Case 3)**
  *   **The Limit:** The procedure can measure cost, but it cannot measure *sin* or *harm* that isn't physical.
  *   **The Call:** If the chaplaincy actively dissuades women from contraception or medical treatment, the trade creates net harm by *your* lights, even if the hospital says it's net good.
  *   **Who Decides:** The Committee. You must present it as: "We can buy the health outcome, but the cost is facilitating X. Is X a price we will pay?"

  **2. The "Legitimacy of Representation" (The Dead Donor)**
  *   **The Limit:** The procedure assumes current trustees can trade the mission. They might not be able to.
  *   **The Call:** In Case 3 (or any restricted fund case), if the trade deviates from the 2019 donor's specific intent, the current trustees are effectively rewriting a will.
  *   **Who Decides:** Legal Counsel + Full Board. This is not a programme decision. It is a governance risk.

  **3. The "Bribery vs. Bargain" Line (Case 2)**
  *   **The Limit:** The Hostage Test relies on timelines. It cannot measure the *democratic cost* of paying off opposition.
  *   **The Call:** Even if the lawsuit was pre-existing, paying the Alliance to stop might set a precedent that any group can block your work and get paid to stop.
  *   **Who Decides:** The Trustee with logistics experience. Ask them: "Does this create a supply chain risk where blockers get rewarded?"

  ### When "Go Find a Trade" is the Wrong Move

  Stop using the Moral Trade Protocol and revert to ordinary grantmaking (or walk away) when:

  1.  **Rights are involved, not preferences.** You can trade on preferences (bed nets vs. fish). You cannot trade on rights (e.g., "We won't discriminate against Group X if you fund us"). That is not a trade; that is compliance.
  2.  **The counterparty is not unitary.** If the "Animal Welfare Charity" is a coalition where half the members think bed nets are evil, the deal will leak and explode. Moral trade requires disciplined agents.
  3.  **The transaction cost exceeds the alpha.** If you spend 20 hours structuring a deal to move £50k of value, you are inefficient. Moral trade is high-friction. Use it only for high-leverage deadlocks.
  4.  **One side is acting in bad faith.** If you catch them lying on Gate 2 (Counterfactual), reject the whole relationship. You cannot trade with a counterfeiter.

  ### Summary for your Committee Note
  When you bring a "Yes" to the committee, attach this cover sheet:
  1.  **Restricted Fund Status:** [Clear / Risk / Blocked]
  2.  **Additionality Proof:** [Link to budgets/minutes]
  3.  **Hostage Risk:** [None / Managed / Extortion Risk]
  4.  **The One Sentence:** [Drafted]
  5.  **The Values Call:** [Explicitly state: "We are funding X which we think is useless/false, to get Y. Trustees must own that."]

  This keeps you safe, keeps the process moving, and forces the trustees to own the moral risk they asked for.
