answer: |-
  ### Candidate Framings

  To carve this phenomenon correctly, we must first test existing tools against the grain of your archives.

  **1. Invented Tradition**
  This framing captures the fabrication element and the subsequent naturalisation of the practice. It aligns with the competitive diffusion you note, where districts manufacture signatures to match rivals. However, it silently drops the *intent*. The standard model implies top-down legitimation or ideological coercion. Your cases are bottom-up, driven by rescue and love, often with avowed fabrication at the start. It also misses the *loop*: in invented tradition, the invention is usually hidden; in your cases, the document is openly the origin but silently becomes the evidence.

  **2. Revivalism**
  This captures the motivation: the desire to rescue something dying. It accounts for the 1978 custom and the teacher's diligence. However, it drops the *evidential inversion*. Revivalism implies a break followed by a restart. It does not account for the subsequent erasure of that break, where the revival document is reclassified as merely the 'earliest record' of a continuous line. It fails to explain the uniformity of the headdress, which is not a revival of a style but the creation of a new standard masquerading as an old rule.

  **3. Archival Construct**
  This focuses on the power of the document to create reality. It captures the way the 1933 booklet generates the dance. Yet, it silently drops the *genuine uptake*. A construct implies something artificial that might be discarded. Your cases show practices that now bind families and mark marriages. This framing treats the practice as a paper ghost, ignoring its flesh-and-blood social function today.

  ### The Commitment: Autogenic Tradition

  None of these fit precisely. The core mechanism is not invention, revival, or construction, but *self-generation*. I propose the term **Autogenic Tradition**.

  This concept defines a practice where the act of documentation creates the object, and the object subsequently generates the historical depth required to validate itself. It fits best because it centres the *loop*: the archive is not a mirror reflecting the past, but an engine producing it. It preserves the avowed origin (the teacher's notation) while explaining the silent reclassification (the booklet becoming 'evidence'). It accounts for the competitive diffusion, as the mechanism is replicable by any group with access to similar archival tools.

  ### Boundaries and the Continuity Problem

  What is in, and what is out? An **Autogenic Tradition** requires the evidential loop. If a practice is fabricated but remains known as a fabrication (a commemorative pageant), it is out. If a practice is continuous and documented merely as a record, it is out.

  This raises your question on continuity: if the collectors *were* recording something old, does it count as the same phenomenon? Ontologically, no. The phenomenon is defined by the *generative mechanism*, not the outward form. If the dance was truly continuous, the 1933 booklet is a record, not a generator. The loop is broken.

  However, epistemically, they are indistinguishable. This is the crux of the social kind. Because the absence of evidence is treated as evidence of antiquity within the system, no internal inspection of the practice can discriminate them. The only evidence that discriminates in principle is *external triangulation*: diaries, letters, or unrelated records from the 'gap' period that mention the practice without relying on the generative document. Without this, the two states are functionally identical. The concept of Autogenic Tradition applies to the *structure of the claim*, not the hidden reality. If the loop exists, it is autogenic, regardless of whether fragments of the old existed beforehand. The stitching creates the unity that did not exist before.

  ### The Verdict on Debunking

  Finally, does the 1933 origin verdict carry debunking force? As a philosopher of social kinds, I argue it does not.

  Social kinds like 'marriage', 'money', or 'tradition' are defined by their current function and recognition, not their historical purity. A marriage is not invalidated because the vows were written by a clerk rather than God; money is not worthless because it is fiat rather than gold. Similarly, a tradition is defined by its capacity to organise time, bind families, and mark identity *now*.

  The 1933 origin changes the *genealogy*, not the *ontology*. The practice has achieved 'traditional' status through genuine uptake (your fourth feature). The debunking force assumes that tradition requires antiquity. But your cases show that tradition requires *continuity of practice*, not necessarily *continuity of origin*. Once the loop is closed and the practice is embedded, the origin question becomes beside the point. The 1933 booklet is indeed the origin, but it is also the foundation. To debunk the practice on these grounds is to misunderstand what a tradition *is*. It is not a relic; it is a living agreement. The verdict carries force only against the *claim of antiquity*, not against the *validity of the heritage*. In your inventory, you are recording the social reality, not the historical truth. The loop has closed; the tradition is real.
