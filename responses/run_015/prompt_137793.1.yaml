answer: |-
  To answer your theoretical question directly before providing the text you requested, both of your proposed distinctions are doing real philosophical work and are not merely invented for their own sake. The concept you call leaky hinges captures the context dependence of certainty that is often missed in introductory readings of On Certainty, where hinges are sometimes presented as static universal truths rather than functional supports that vary by activity. This distinction is vital for your TAs because it prevents them from treating the classroom as the only reality; it allows them to acknowledge that a proposition can be unshakeable in the hallway while being a valid topic of discussion in the seminar. Your second distinction, idling propositions, is even more critical for the practical management of office hours. It identifies the specific grammatical trick used in conspiracy thinking where a claim mimics an empirical hypothesis but is structurally immune to evidence. This is the precise tool needed to distinguish the Cartesian skeptic, who is genuinely exploring the limits of justification, from the conspiracy theorist, who is protecting a belief system from revision. Both distinctions belong in the procedure, with the leaky hinge check serving as an early context filter and the idling proposition check serving as the decisive test for when to stop arguing and start referring. Below is the draft email text you can send to your teaching assistants, written in continuous prose without formatting, which incorporates these distinctions into an operational workflow and demonstrates their application across the three cases you specified.

  Hello everyone, as we move past the Cartesian week I expect we will see the usual spike in office hour visits where students express radical doubts about the external world, the past, or specific historical events. The goal of this note is to give you a consistent way to handle these conversations without falling into the trap of trying to win an argument you cannot win or dismissing a student's distress as mere faith. We are operating on the understanding that some doubts are not requests for evidence but expressions of a shift in the framework the student is using to evaluate evidence, and treating them as standard empirical claims will lead to frustration for both of you. The procedure relies on three sequential checks you can run during the conversation based on what the student says and how they react to your questions, and you should perform these in order without needing to consult any texts. The first check is the practical consequence test where you ask the student what would change in their life if their doubt turned out to be true. If they say nothing would change because they would still go to class and eat lunch and talk to friends, you are likely dealing with a framework doubt rather than an empirical one, and this is where the idea of a leaky hinge applies because the proposition functions as a foundation in their daily life even if it is being questioned in your office. The second check is the settlement condition where you ask what specific piece of evidence would settle the matter for them. If they can name a document, a test, or an observation, you are in the realm of normal inquiry and you can proceed with standard epistemological tools about testimony and evidence. If they say that no evidence would count because all sources are compromised or the evidence itself is part of the simulation, you have identified an idling proposition where the claim looks like knowledge but is actually functioning as a rule that protects itself from being wrong. The third check is the context shift where you ask if they would doubt this proposition while doing something else like crossing the street or booking a flight. If they admit the doubt only holds in the context of the course or the office hour, you can validate the philosophical exercise while gently returning them to the course objectives, but if they insist the doubt applies to their banking or medical decisions, you need to be more careful about whether this is philosophical curiosity or something else.

  To show you how this works in practice I will walk through the three most common scenarios you will face starting with the simulation skeptic who claims we might all be in a computer program. When you run the practical consequence test on this student they will likely admit that their daily routine remains the same, which signals that the doubt is not disrupting their ordinary practice. When you run the settlement condition they will usually admit there is no test available to them, which confirms this is not an empirical claim but a framework speculation. When you apply the context shift they will often agree they do not actually doubt the reality of the desk in front of them when they are typing an essay. Your move here is not to argue that the simulation is false because you cannot prove that, but to point out that the doubt is idling in this specific context and that for the purposes of the course we are investigating what knowledge means within the framework we share. You should tell them that their doubt is philosophically interesting but that it functions as a boundary marker rather than a discovery, and you can grade their assignment based on how well they articulate that boundary without requiring them to resolve the skepticism. This works because you are treating the proposition as a leaky hinge that is solid in the street but movable in the seminar, and you avoid the failure mode of trying to refute the unrefutable.

  The second scenario is the student who doubts everything about the past because nobody alive observed it, and here the procedure will direct you toward argument rather than acceptance. When you run the practical consequence test this student will likely say that history classes would be meaningless or that we cannot learn from mistakes, which shows the doubt has practical stakes. When you run the settlement condition they should be able to conceive of evidence like archaeological records or consistent testimony, even if they currently doubt the reliability of those sources. When you apply the context shift they will likely admit they rely on the past for things like their own age or legal documents. This tells you that the proposition is not a hinge for them in practice but an empirical claim they are currently rejecting, so you are permitted to engage them on the epistemology of testimony and the standards for historical evidence. You can argue that while absolute certainty is unavailable, justified belief is possible through cross referenced sources, and this is a legitimate philosophical disagreement within the course material rather than a framework collapse. The procedure puts you here because the doubt fails the idling test; there is evidence that could theoretically overturn the doubt, so the conversation remains within the bounds of epistemology rather than therapy or administration.

  The third scenario is the moon landing student or any case where the doubt extends to swallow every source you offer, and this is where the procedure must tell you to stop and refer. When you run the practical consequence test you may find the student is agitated or insists that the deception changes everything about their trust in institutions. When you run the settlement condition they will fail it explicitly by stating that any evidence you produce is part of the staging, which is the definition of an idling proposition that is doing harmful work rather than philosophical work. When you apply the context shift they may insist that nothing is secure and that all sources are compromised. This is the point where you must recognize that you are not dealing with a hinge proposition that stands fast for a community, but a isolated belief system that is immunizing itself from reality, and this is where the procedure limits your role. You cannot treat this as a protected framework difference because the student is not exploring the limits of language but is expressing a distress that isolates them from shared reality. Your instruction is to stop engaging with the content of the claim and instead address the distress by saying that this level of uncertainty sounds difficult to carry and that you are not the right person to help them with it. You should then refer them to student counseling or the dean of students, and you must not feel that you are failing as a TA by not solving the epistemological puzzle. The procedure cannot distinguish bad faith from genuine distress with perfect accuracy, and that is a judgment call you must make based on the emotional temperature of the room, but if the settlement condition fails repeatedly and the student becomes agitated, the default is to refer.

  There are limitations to this procedure that you need to accept so you do not blame yourself when it feels messy. The test for an idling proposition relies on your ability to hear whether the student is genuinely open to evidence or just performing openness, and sometimes you will get this wrong. The distinction between a leaky hinge and a delusion is not always sharp in the moment, and if you are unsure you should err on the side of referral. You are not expected to diagnose mental health conditions, but you are expected to notice when a conversation has stopped being about the course material and started being about a student's grip on shared reality. The procedure is designed to get you to that recognition point faster so you do not waste fifteen minutes trying to prove the external world exists to someone who is not asking for proof. If you follow these steps you will avoid the twin failures of arguing where you cannot win and dismissing where you should listen, and you will know when the conversation has moved from epistemology to something that requires a different kind of care. Please read this before your office hours this week and keep it in mind when a student opens with a doubt that feels heavier than the assignment requires.
