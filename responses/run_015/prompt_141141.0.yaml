  Variant A (The Composition Gap): Consider a cloud-edge robot assistant where the visual encoder is trained via proprioceptive feedback—it learns "cup" only by successfully grasping one, grounding individual symbols in sensorimotor capacity—but the language head generating sentences is a frozen web-LLM disconnected from that loop. The critical feature doing the work is the decoupling of syntactic composition from physical dynamics: the robot can label "cup" correctly but generates relational claims like "the cup supports the book" based on text statistics rather than spatial analysis, meaning the combinatorial rules aren't regulated by the properties of the referents. A Harnad-style theorist verdicts "no understanding" because the sentence structure floats free of the world, whereas a functionalist might grant provisional meaning because the symbols maintain coherent inferential roles within the dialogue system. If you fine-tune the language head on the robot's proprioceptive data, the Harnad verdict flips to positive, confirming the gap lies in the composition mechanism, not the atoms.

  Variant B (The Inferential Web): Now take the same assistant architecture but disable all sensors, training the text-only model on raw server logs where its outputs are API calls validated solely by successful execution (e.g., fixing a bug triggers a "success" token). Under Conceptual Role Semantics, this system earns grounding because the meaning of "restart service" is constituted by its specific causal role in the network that leads to the success state, not by external reference. A functionalist verdicts "meaningful" because the internal state transitions mirror the causal structure of the domain, but Harnad verdicts "no grounding" because the system never transduces physical energy into symbols. If you remove the execution feedback loop, the functionalist verdict collapses to mere correlation, showing the grounding relied on the closed causal loop. Harnad disqualifies this not by stipulation but by arguing that without sensory transduction, the "success" token is just another uninterpreted shape, leaving the system unable to distinguish between genuine reference and systematic correlation (the indistinguishability argument).
