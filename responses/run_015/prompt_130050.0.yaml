answer: |-
  Your grasp of the core motive is correct, but your implementation details miss standard constraints. The omniscience objection is well-known; the standard reply is that accuracy-first epistemology norms *expected* accuracy relative to evidence, not actual accuracy relative to the world. Since you cannot know the world, you maximize utility based on your current information state.

  Regarding your domain loophole: accuracy arguments assume a fixed algebra of propositions. You cannot game the system by representing fewer truths; the epistemic utility function is defined over a specific agenda determined by the context of inquiry, not chosen by the agent to minimize risk. Abstention is usually modeled as a specific credence (like 0.5) or ruled out by the decision matrix.

  Switching scoring rules does not solve the omniscience issue. All strictly proper scoring rules identify omniscience as the unique global maximum; the choice of rule affects how errors are weighted, not the ideal target.

  Finally, your supervisor is too quick on probabilism. While accuracy dominance arguments support probabilism for precise credences, defenders of imprecise credences challenge the dominance principles used or argue for scoring rules applicable to sets. The debate remains live because the extension of accuracy norms to imprecise states relies on contested assumptions about how sets are scored.

