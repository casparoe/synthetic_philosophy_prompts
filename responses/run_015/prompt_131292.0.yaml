answer: |-
  # Project Portability: Auditing Causal Claims in the Great Divergence

  **The Question**
  Under what spatial and institutional scaling conditions do candidate causes for the Great Divergence remain counterfactually stable when subjected to a transplant test?

  **Context & Objections**
  My supervisor argues the divergence question is trivial (coal/colonies) or meaningless; an econ colleague argues it suffers from an n=1 identifiability problem. This project accepts neither. The "trivial" objection ignores that causal factors are often endogenous to the unit of analysis (you cannot have "competitive states" without fragmentation). The "n=1" objection holds only if the unit is "civilisation." If the unit is rescaled to comparable regions (England vs. Yangzi Delta), n increases, and counterfactuals become tractable. This project does not solve the divergence; it determines whether the question is well-posed at the civilisational scale. If the portability idea collapses into existing path-dependence literature, the surviving version is the operationalisation of scale: showing exactly *where* the path dependence kicks in.

  **The Portability Audit**
  I propose a methodological audit of leading explanations (Institutionalist, California School, Coal/Colonies, Cultural). The test demands specifying the counterfactual transplant: If Factor F caused divergence, what happens if F is present in China absent everything else? Many explanations fail. 
  *   **Institutionalists (Property Rights):** Transplanting secure property rights to Qing China requires dismantling the bureaucratic empire that secured order. Verdict: Non-portable. The cause dissolves the unit.
  *   **California School (Living Standards):** If standards were comparable, why diverge? Transplanting "demand constraints" requires assuming away the population density difference. Verdict: Ill-scaled.
  *   **Coal/Colonies (Geography):** Transplanting coal is physically impossible, but transplanting "access to coal" implies trade networks China lacked. Verdict: Portable but trivial.
  *   **Culture/Science:** Transplanting "scientific culture" ignores the institutional embedment of science in European states. Verdict: Non-portable.

  The hypothesis is that most factors are non-portable at the civilisation scale but become portable at the regional scale.

  **Question Taxonomy**
  I will distinguish three sub-questions: (1) Selection (why this candidate from the pool?), (2) Transformation (why did this unit change?), (3) Attribution (why this outcome shape?). I suspect only Selection is tractable without rescaling, as it allows comparison with later industrialisers (Germany, Japan), bypassing the n=1 problem.

  **Methodology (9 Months)**
  *   **Months 1-3:** Literature Audit. Systematically code leading monographs for implicit counterfactuals. Output: Annotated bibliography mapping causal claims to unit scales.
  *   **Months 4-6:** Regional Case Studies. Focus on England vs. Yangzi Delta. Test portability of "high wages" and "property rights" at this scale. Output: Two case study chapters draft.
  *   **Months 7-9:** Synthesis. Develop the "Portability Framework." Assess which sub-questions survive. Output: Final dissertation chapter + methodological article draft.

  **Why this method?** Cross-country regression fails because it treats units as fixed when they are not. Single-archive work fails to compare. This conceptual-historical hybrid tests the *logic* of the history being written.

  **Deliverable**
  A methodological framework for economic historians to vet causal claims before archival investment. Not a solution to the divergence, but a filter for valid questions.

  **Failure Conditions**
  1.  If the audit shows all factors are non-portable, the question is indeed meaningless.
  2.  If the "regional scale" solution collapses into tautology (regions are defined by the outcome), the rescaling fails.
  3.  If the distinction between Selection/Transformation/Attribution adds no analytical leverage.

  **Scope Risk**
  The philosophical groundwork could consume the historical analysis. I must stop at "framework development" and not attempt to rewrite global history.

  **Strongest Objection**
  That this is merely philosophy of science dressed as history, offering no new empirical evidence. The rebuttal is that mis-scaled questions waste empirical effort; correcting the scale is itself a historical contribution.

