  A single Kantian principle can unify most of your verdicts, but it requires you to drop the intuition that the bioengineered pig could have direct moral standing based solely on communication or pain sensitivity. The governing maxim is the Principle of Indirect Duty: moral obligations are owed directly only to rational autonomous agents (ends-in-themselves), but we owe it to our own humanity to treat sentient non-agents humanely because cruelty toward them dulls the sympathy necessary to respect persons. This principle validates your verdicts on kicking the dog and factory farming as violations of indirect duty that degrade moral character, though it flattens your distinction between individual cruelty and system failure into the same category of vice. It confirms rescuing the stray as good because it cultivates the kindness owed to humans, and it supports your view on the robot: since it lacks sentience, abusing it does not dull sympathy if you know it is a simulation, making the act permissible though unsettling. Regarding the surgeon, the principle aligns with your motive distinction: spending resources on a chimp is permissible under the discretion of imperfect duty so long as it is not grounded in the false belief that the chimp holds equal moral worth to humans. However, the principle forces a binary classification on the bioengineered pig: unless it possesses true autonomy (the capacity to be morally responsible), it remains a thing without direct standing, regardless of its intelligence or ability to communicate pain.

  **Unsaveable Verdicts and Nuances:**
  1.  **The Bioengineered Pig's Direct Standing:** You cannot maintain the intuition that the pig has direct moral standing unless you grant it full moral autonomy; Kantianism does not allow for a middle ground based on pain or promise-keeping alone.
  2.  **The Factory Farming Distinction:** The principle cannot save your intuition that factory farming is a different *kind* of wrong than kicking a dog; Kantianism classifies both identically as violations of indirect duty to oneself.
  3.  **The Surgeon's "Wasteful" Verdict:** While the motive distinction holds, strict Kantianism would likely classify letting ten humans die to save one chimp as immoral (violating duty to humanity) rather than merely "wasteful," even if the agent denies equal worth.
