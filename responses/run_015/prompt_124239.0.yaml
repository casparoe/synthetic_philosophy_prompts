          *   The user needs a threshold. What would count as "failure"?

      *   *Confidence Level:* High on the philosophical critique, medium on the specific archaeological consensus (since it's shifting).
      *   *Least Sure Point:* The normative dimension (suffering). Is "collapse" a descriptive or normative term?

  8.  **Final Polish:** Check against constraints (no book lists, acknowledge typos, confidence flag). Ensure the distinction between "societal continuity" (people survive) and "systemic continuity" (institutions survive) is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just argue for the "Collapse" side. I need to show where the *User's* view breaks. The user's view is essentially "Transformationalism." The defeater must show why "Transformation" is insufficient.
      *Key argument:* If the *range of possible future states* is permanently narrowed, "collapse" is the accurate term for the reduction of phase space, even if the survivors are fine.

