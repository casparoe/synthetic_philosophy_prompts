          *   Rapa Nui is a tricky example for the user. Recent scholarship suggests resilience, but earlier claims of ecocide/statue toppling as civil war are the "collapse" narrative. I need to mention the *demographic* crash specifically.
          *   Maya: The loss of the Long Count calendar. That's a specific ideological/complexity loss.

      *   *Refining Falsifiability:*
