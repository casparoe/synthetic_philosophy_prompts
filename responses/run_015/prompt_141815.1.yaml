prompt: |-
  I've got a metaphysics podcast and next week's guest is someone who's spent a few years defending what she calls *symmetry-first* about Black's two-sphere case: yes there are two spheres, yes they're distinct, but nothing grounds the difference — no haecceities, no asymmetric relation, no brute thisness either. Her positive claim is that the correct description of such a world is plural and symmetric all the way down, so "the spheres are two miles apart" is a complete description, and any singular description that singles out just one of them is a kind of representational excess our language forces on us. She's also been pushing a new case: two identical spheres with a third object sitting at the exact midpoint between them, universe still symmetric under swapping the spheres.

  Draft me eight or nine interview questions, spoken-register, that don't let her just restate the view. At least one each on: how this isn't haecceitism or primitivism in a new costume, given that all three deny the identity of indiscernibles; what the midpoint case is supposed to add if its just as symmetric as the plain two-sphere case; whether she's committed to saying the same thing about indiscernible particles in quantum mechanics and about spacetime points in the hole argument; and what the representational-excess claim predicts for symmetric chances — if each sphere has some chance of decaying, is that chance per-sphere or shared. Give each question a follow-up keyed to the reply she's most likely to make, and close with one question about what could count as evidence against the view.
