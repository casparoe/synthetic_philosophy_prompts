answer: |-
  Here are nine interview questions drafted for your podcast, designed to be conversational but philosophically sharp, with follow-ups keyed to her likely responses.

  **1. The "Primitive Distinctness" Worry**
  "Let's start with the big picture. You're saying the spheres are distinct, but there's no *fact of the matter* about which is which. Now, a haecceitist says there *is* a fact of the matter—it's just brute. A primitivist about distinctness says something similar. When you say 'nothing grounds the difference,' how is that not just haecceitism in a new costume? If I strip away the haecceities, what's left to do the work of making them *two* instead of *one*?"

  *   **Follow-up (if she says "It's plural reference, not singular"):** "Okay, but truthmakers don't care about our grammar. If the sentence 'there are two spheres' is true, something in the world makes it true. If it's not two 'thises,' are you saying the world itself is grammatically plural? Or are you saying reality doesn't match the subject-predicate structure of that sentence at all?"

  **2. The Limit of Representational Excess**
  "You've called singular descriptions 'representational excess.' I get that for the spheres—they look alike, act alike. But does this excess stop anywhere? If I paint one sphere red, suddenly I can name them. Did I change the metaphysics, or did I just give my language a handle it was missing? If it's just a language problem, why does adding a spot of paint feel like it solves an ontological puzzle?"

  *   **Follow-up (if she says "Painting breaks the symmetry"):** "Right, but *why* does symmetry matter so much? Is it that reality can't tolerate asymmetry without a cause? Or is it that our ability to refer is what creates the illusion of distinct individuals? I'm trying to pin down whether the 'excess' is in the world or in our access to it."

  **3. The Point of the Midpoint Case**
  "Let's talk about your new case: the two spheres with a third object at the exact midpoint. The universe is still symmetric if you swap the spheres. But honestly, what does this add? In the original Black case, the spheres are just *there*. Here, you've added a relation. Are you using the midpoint to show that even *relations* don't ground individuality, or is there a different lesson here?"

  *   **Follow-up (if she says "It tests relational grounding"):** "Sure, but the midpoint object is unique. It's the *only* thing at that location. Doesn't that give us a way to break the symmetry descriptively? I can say 'the sphere to the left of the midpoint.' If I can do that without haecceities, have you accidentally given the haecceitist a way back in via rigidified descriptions?"

  **4. Causal Powers and the Midpoint**
  "Sticking with that midpoint object—imagine it's a bomb that goes off if *either* sphere touches it. In a standard view, we'd say Sphere A has a 50% chance of hitting it, or something similar. On your view, can the *pair* of spheres cause the explosion? Or do you have to say causation is also a plural affair? I'm worried that if you can't single out a cause, you can't single out an effect."

  *   **Follow-up (if she says "Causation is between structures"):** "That sounds like you're moving towards ontic structural realism. If structures cause things, do the spheres still exist as objects? Or are they just nodes in the structure? I'm asking because if they're objects, they seem to be doing the pushing, not the 'twoness'."

  **5. Commitment to Quantum Mechanics**
  "I want to zoom out to physics. Indiscernible particles in quantum mechanics—electrons, photons—they seem to fit your symmetry-first view perfectly. Are you committed to saying that electrons literally lack individual identity? Or is QM just a special case where our epistemic access is limited, but metaphysically, there's still a 'this electron'?"

  *   **Follow-up (if she says "No, they are truly indiscernible"):** "Then how do you handle permutation symmetry in the math? The math says swapping them makes no difference to the state. But does that mean swapping them is metaphysically impossible, or just that we can't tell the difference? I'm asking if your view forces us to read the physics anti-realistly."

  **6. The Hole Argument and Spacetime Points**
  "Here's a harder one. Spacetime substantivalists face the 'Hole Argument,' where shifting points around inside a hole creates distinct models that are observationally identical. Many say we must deny points have primitive identity. Is your symmetry-first view the same move? Are spacetime points just like your spheres—distinct, but only describable pluralistically?"

  *   **Follow-up (if she says "Yes, it's the same diagnosis"):** "That's a bold commitment. But spacetime points don't look alike the way spheres do. They have different relational profiles to the matter around them. If you deny them singular identity even when their relational profiles diverge, aren't you wiping out individuality entirely? Where does the object stop and the structure begin?"

  **7. Symmetric Chances (The Setup)**
  "Let's go back to the spheres. Imagine they're radioactive. Each has a 50% chance of decaying in the next hour. In a standard view, Sphere A has a 50% chance, and Sphere B has a 50% chance. On your view, since I can't refer to Sphere A, where does the chance attach? Is it a property of the *pair*? Because if it's a property of the pair, it sounds like there's a 50% chance that *one* decays, not that *each* has a propensity."

  *   **Follow-up (if she says "It's a chance for one-of-them to decay"):** "Okay, but nature doesn't deal in 'one-of-them.' Events happen locally. If decay is a local physical process, how does a global, plural chance trigger a local event? It feels like you've got the probability right, but you've lost the mechanism."

  **8. Symmetric Chances (The Outcome)**
  "Following up on that: Suppose the hour passes. One sphere decayed, the other didn't. Now they're definitely not identical—one is decayed, one is fresh. Did they *become* individuals at the moment of decay? Or were they always individuals, and we just couldn't tell until the symmetry broke? If they became individuals, what happened metaphysically at that exact moment?"

  *   **Follow-up (if she says "Symmetry breaking creates distinctness"):** "So distinctness is contingent? That's a huge claim. It means in some possible worlds, they are distinct individuals, and in others, they are just a plural symmetry. What grounds that shift? It sounds like you're making individuality a derivative property, which most people think is the other way around."

  **9. The Falsification Question**
  "Last one. Metaphysics can sometimes feel unfalsifiable—we just trade intuitions. But I want to put you on the spot. What would the world have to look like for you to give this up? Is there a scenario, a thought experiment, or a physical discovery that would force you to admit, 'Okay, there really is a brute thisness here'? If nothing could count against it, I worry it's just a linguistic preference."

  *   **Follow-up (if she says "It's about theoretical virtue, not evidence"):** "Fair, but if it's about virtue, what's the vice of the other side? Is haecceitism just 'ugly,' or is it actually making false predictions? I want the listeners to know what's at stake. If we accept your view, what do we gain that we lose if we stick with the standard view?"
