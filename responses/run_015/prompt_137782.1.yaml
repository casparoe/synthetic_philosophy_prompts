          *   *Impact on "Loss of Chance":* If the future is fixed, "chance" is purely epistemic. There was no *ontological* chance, only ignorance.
          *   *Impact on Law:* The law operates from the *internal perspective* of agents making decisions. Even in a Block Universe, agents don't know the future. Liability is about regulating behavior *within* the block, not changing the block.
          *   *Does doctrine change?* No. The law is pragmatic. It regulates human interaction based on human epistemic limits.
          *   *Implication:* This shows the law doesn't require an "open future" metaphysics. It requires an "open future" *phenomenology*.

