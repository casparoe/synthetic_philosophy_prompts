  ### The Verdict: **Spandrel**
  (She may accept "Exaptation" as a technical synonym, but her grading pattern suggests she will mark "Adaptation" as wrong and "Spandrel" as correct.)

  ### The Defense: Origin Trumps Utility
  Your professor is running a strict **Gould-Lewontin "Anti-Pan-Adaptationist"** framework. The critical data point is the **Appendix**.

  In modern evolutionary biology, the appendix is often discussed as an *exaptation* (a vestigial structure co-opted for immune function) because it *is* maintained by selection for that immune work. By explicitly calling it a **spandrel** *despite* its current immune function, she has signaled that **current utility is irrelevant to the classification.** She is teaching you to identify *why a trait arose*, not *what it does now*.

  *   **Literacy:** Brain hardware is an adaptation; using it for reading is a spandrel (co-option).
  *   **Appendix:** Gut hardware is an adaptation; using it for immunity is a spandrel (co-option/vestige).
  *   **Salamander:** Pigment gene is an adaptation (for UV); using it for hunting is a **spandrel** (co-option).

  Even though the salamander trait is *currently* under selection for hunting, it did not *originate* for hunting. In her framework, labeling it an "Adaptation" implies it was selected *for* hunting from the start. Labeling it a "Spandrel" correctly identifies it as a pre-existing feature co-opted for a new role. She is prioritizing **historical origin** over **current maintenance**.

  ### The Splitter Case: **Human Wisdom Teeth**
  To test whether she is truly consistent with this "Origin Trumps Function" rule (or if she secretly cares about current status), you would present **Wisdom Teeth**.

  *   **Origin:** Adaptive (selected for chewing coarse ancestral diets).
  *   **Current Status:** Non-functional/Deleterious (impacted, often removed, no current selective benefit).

  **How this splits the rules:**
  1.  **Strict Origin Logic (Her supposed rule):** Since the trait *originated* via selection for a function, it is historically an **Adaptation**. (Just as the salamander gene is historically an adaptation for UV).
  2.  **Current Maintenance Logic (Standard view):** Since the trait is no longer selected for and is often harmful, it is a **Vestige/Spandrel**.

  **The Test:**
  *   If she calls Wisdom Teeth **Adaptations**, she is rigorously consistent: Origin defines the trait, regardless of current utility (matching her Salamander/Appendix logic).
  *   If she calls Wisdom Teeth **Vestiges/Spandrels**, she is inconsistent: She is allowing *current lack of function* to define the trait, even though she refused to let *current presence of function* save the Appendix from being a spandrel.

  This case forces her to choose between "Origin defines the label" (Wisdom Teeth = Adaptation) and "Current Status defines the label" (Wisdom Teeth = Spandrel). Given her Appendix call, the logically consistent (but biologically controversial) verdict would be **Adaptation**.
