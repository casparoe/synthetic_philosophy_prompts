answer: |-
  This is a delightful puzzle. You are essentially asking me to reverse-engineer a philosopher's stone from a list of transmutations. Dana's ledger is remarkably consistent, which suggests she isn't operating on a fuzzy intuition but on a specific, rigorous ontological commitment.

  Here is the breakdown of her likely verdicts, the rule she is actually using, why your candidate rules need adjustment, and the experiment that will finally settle the bet.

  ### Part 1: The Verdicts

  Based on the internal logic of her ledger, here is how Dana will rule on your three new cases.

  **Case 1: The Synthetic Protocell (Metabolism + Membrane, No Reproduction/Evolution)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** This is the closest call, but her exclusion of the *self-replicating RNA strands* is the tell. She rejected the RNA because it lacked metabolism and a membrane. However, she also rejects *candle flames* (metabolism/thermodynamics without lineage). This protocell is effectively a "chemical candle." It maintains itself, but it is an artifact, not a descendant. It has no history. For a developmental biologist, *ontogeny* (developmental history) is usually a prerequisite for life. This object popped into existence fully formed via assembly, not via the developmental trajectory of a lineage.

  **Case 2: The Giant Viruses (Mimivirus)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** This is the "hard line" test. Biologists who draw a hard line at viruses usually do so based on **obligate parasitism of the translation machinery**. Even though Mimivirus carries genes for translation, it still cannot synthesize proteins without hijacking a host cell's ribosomes and energy. Dana includes *HeLa cells* (which are parasitic on the host body in a way) but excludes *viruses*. The distinction is cellular autonomy. A HeLa cell is a cell; a Mimivirus is a genetic package. She will view the extra genes as a red herring. It's still a virus.

  **Case 3: The Von Neumann Probe (Moon Factory)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** You noted she gets annoyed by *far-from-equilibrium thermodynamics* arguments (flames/whirlpools) and rejects the *Game of Life glider*. This indicates she is a **substrate chauvinist**. She does not believe life is a pattern that can be instantiated in any medium (silicon, digital, mechanical). She believes life is a specific *chemical phenomenon*. The Moon Probe replicates and maintains itself, but it does so via geology and mechanics, not biochemistry. To her, calling this "alive" is a category error akin to calling a whirlpool alive.

  ---

  ### Part 2: The Rules (and why yours are slightly off)

  You asked me not to hold back, so here is the critique. Your two candidate rules are **not** the same rule, but neither of them perfectly captures Dana's ledger on its own.

  **Candidate 1: Organized Self-Maintenance (Autopoiesis) + Potentiality**
  *   *The Flaw:* This rule struggles with the **Spore** and the **Mule** in opposite directions.
      *   To save the Spore, you need the "Potentiality Clause" (it *can* metabolize later).
      *   To save the Mule, you need to relax the "Reproduction" requirement (it *cannot* metabolize into offspring).
      *   *The Fatal Blow:* This rule risks accepting the **Synthetic Protocell** (Case 1). If it maintains itself beautifully, why isn't it alive? You have to add a "Historical Origin" clause to rule it out, which moves you toward Candidate 2.
      *   *Also:* It risks accepting the **Moon Probe**. If "self-maintenance" is abstracted to "repairing parts," the probe qualifies. You need a "Biochemical" clause to rule it out.

  **Candidate 2: Token of a Reproducing, Metabolizing Lineage**
  *   *The Strength:* This is much closer. It handles the Mule (token of a lineage that reproduces), the Spore (token of a lineage that metabolizes), and the RBC (token of a hematopoietic lineage). It excludes the Virus (lineage is dependent on cells) and the RNA strand (no metabolism).
  *   *The Flaw:* It is too permissive regarding **substrate**. A "lineage" of self-replicating robots on the Moon fits this definition unless you specify *biological* lineage.
  *   *The Refinement:* Dana isn't just looking for *a* lineage. She is looking for **Continuous Biochemical Cellular Lineage.**

  **The "Dana Definition":**
  > *An entity is alive if and only if it is a material token of a continuous, historically extended, biochemical cellular lineage capable of metabolism and reproduction (even if the specific token lacks one or both capacities due to dormancy or differentiation).*

  **Are your rules secretly the same?**
  No. One is **Synchronic** (what is the system doing *now* or *potentially*?), and the other is **Diachronic** (where did this system *come from*?). Dana is firmly Diachronic. The Mule is the load-bearing verdict here. A mule is a dead end. It contributes nothing to the future of the lineage. If life were about "potential for future evolution" (a common Darwinian definition), the mule is dead. Dana says it's alive. Therefore, for her, **History matters more than Future.** You are alive because of your parents, not because of your children.

  ---

  ### Part 3: Where the Rules Diverge

  To look truly smug, you need to know where Candidate 1 (Functionalism) and Candidate 2 (Historical Lineage) yield different answers.

  **The Divergence Point:** **Synthetic Abiogenesis.**
  Imagine we build a cell from scratch. Not the Case 1 protocell (which doesn't reproduce), but a **perfect synthetic bacterium**.
  *   It has a membrane.
  *   It has a genome.
  *   It metabolizes.
  *   **It reproduces and evolves.**
  *   **BUT:** It has no ancestors. It was assembled in a lab from raw chemicals. It is the "Adam" of a new lineage.

  *   **Candidate 1 (Functionalism):** **ALIVE.** It does everything life does.
  *   **Candidate 2 (Historical Lineage):** **NOT ALIVE.** It has no history. It is an artifact, like a perfect forgery of a painting. It is not part of the "Tree of Life."

  **My Prediction for Dana:** She will say **Not Alive** (or at least, "Not *naturally* alive," which for her amounts to the same thing). She is a developmental biologist; she studies *process*. A thing that appears without a process of generation is a model, not an organism.

  ---

  ### Part 4: The Killer Test Case

  You asked for a further case to tell the surviving rules apart. The "Synthetic Adam" above is good, but there is a sharper knife.

  **The Test Case: The "Ship of Theseus" Bacterium vs. The "Resurrected" Bacterium.**

  **Scenario A (Continuity):** Take a living bacterium. Slowly replace every single molecule in it with a synthetic analog over the course of a week, while keeping it alive and dividing. At the end, none of the original matter remains, but there was continuous metabolic function and lineage throughout.
  **Scenario B (Discontinuity):** Take a dead bacterium. Reassemble it atom-by-atom from raw chemicals to the exact specification it had when alive, then kickstart its metabolism.

  *   **Functionalism (Rule 1):** Both are **Alive**. The end state is identical (organized self-maintenance).
  *   **Historical Lineage (Rule 2):** Scenario A is **Alive** (continuous history). Scenario B is **Not Alive** (history was broken; it's a copy).

  **Why this works on Dana:**
  Look at her **Spore** verdict. A spore is dormant. Metabolism stops. If "continuous metabolism" were the rule, the spore is dead. But she says it's alive. Why? Because the *organizational potential* remains intact through the dormancy.
  However, look at her **Game of Life** verdict. A glider has organizational continuity. She says it's dead. Why? Substrate/History.

  The **Resurrected Bacterium (Scenario B)** forces her to choose between **Material Continuity** and **Typological Identity**.
  *   If she says the Resurrected Bacterium is **Alive**, she admits that History doesn't matter, only Organization (Functionalism wins).
  *   If she says the Resurrected Bacterium is **Dead** (a perfect copy, but not *the* life), she confirms that **Spatiotemporal Continuity** is the necessary condition.

  **My bet?** She says **Dead**.
  Why? Because of the **HeLa Cell** verdict. HeLa cells are "immortal," but they are a continuous line from Henrietta Lacks. If you took a HeLa cell, froze it, ground it up, and reprinted it atom-by-atom, Dana would likely call that a "model of a HeLa cell," not a HeLa cell. For a biologist, **provenance is ontology.**

  ### Summary for your Seminar
