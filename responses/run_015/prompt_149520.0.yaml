  ### Critical Pre-Check: The Structural Blind Spot

  You asked me to tell you straight if the setup smuggles in false ideas. It does.

  By starting with a leader *authorizing* a specific wrong act (torture, fraud), your tree assumes **dirty hands are always agential**—the result of a specific choice by a specific person. This excludes **structural complicity**, where hands are dirty simply by participating in a system that produces harm (e.g., enforcing unjust laws, maintaining exploitative economies) without a discrete moment of "authorization."

  This tree maps the *classic* Walzerian/Weberian problem well, but it cannot capture the dirt that accumulates without a decision. If your blog aims to cover the "actual logical space" of modern politics, note that this tree covers only the **intentionalist** slice of that space.

  ***

  ### The Decision Tree: Dirty Hands Logic

  **Root:** A leader authorizes a clearly wrong act (torture/fraud) to avert catastrophe.

  **Q1: Does leaving office remove the moral stain?**
  *   **NO** (The stain adheres to the *Person*)
      *   **Q2: Did the act succeed in averting catastrophe?**
          *   **NO** (Failure)
              *   **Q3: Does failure compound the moral debt?**
                  *   **YES:** **Leaf 1: The Compounded Debt.**
                  *   **NO:** **Leaf 2: The Honest Mistake.**
          *   **YES** (Success)
              *   **Q4: Does democratic authorization cleanse the person?**
                  *   **NO:** **Leaf 3: Sacramental Contamination.**
                  *   **YES:** **Leaf 4: The Publicly Absolved.**
  *   **YES** (The stain adheres to the *Office*)
      *   **Q5: Does institutional virtue turn private vice into public duty?**
          *   **YES:** **Leaf 5: Role-Absorption.**
          *   **NO**
              *   **Q6: Does failure compound the debt?**
                  *   **YES:** **Leaf 6: The Toxic Legacy.**
                  *   **NO:** **Leaf 7: The Clean Exit.**

  ***

  ### Leaf Descriptions (Weirdest Commitments)

  1.  **The Compounded Debt:** Doing evil for nothing is a worse sin than doing evil for something.
  2.  **The Honest Mistake:** Your moral credit score survives even when the body count rises.
  3.  **Sacramental Contamination:** You carry the mark of Cain even if the world thanks you.
  4.  **The Publicly Absolved:** The state forgives you, but your conscience keeps the ledger.
  5.  **Role-Absorption:** You are merely the glove; the hand that wears you is the state.
  6.  **The Toxic Legacy:** The failure poisons the institution itself, not just the actor.
  7.  **The Clean Exit:** You did the dirty work, the office keeps the stain, you walk away.

  ***

  ### Structural Analysis of the Tree

  **Indistinguishable Pairs:**
  *   **Leaf 4 (Publicly Absolved) vs. Leaf 7 (Clean Exit):** Empirically, these look identical. In both cases, the leader leaves office without public sanction. The only difference is metaphysical: Leaf 4 says the person *was* stained but got pardoned; Leaf 7 says the stain *never touched* the person, only the role. A reader cannot separate these without access to the leader's internal conscience or a specific theory of office.

  **Empty Combos & Incoherencies:**
  *   **Success + Role-Stain + Role-Absorption:** If the act succeeds and the stain is on the office, but Institutional Virtue is "NO" (Leaf 6/7 path), we assume the office *holds* the stain. If Institutional Virtue is "YES" (Leaf 5), the office *absorbs* it. This is coherent.
  *   **Failure + Role-Absorption:** There is no leaf for "Failure + Institutional Virtue = Yes." This is intentional. Institutional virtue usually relies on the *necessity* of the act. If the act fails, the necessity is disproven, so the institution cannot virtuously absorb the vice. This combo is theoretically incoherent within this framework.
  *   **Success + Sacramental Contamination:** This combo exists (Leaf 3). It commits you to the view that some acts are intrinsically evil regardless of consequences or consent. This is the hardest leaf to defend politically but the easiest to defend theologially.

  **Collapse Warning:**
  *   **Q3 and Q6 (Failure Compounds):** These nodes ask the same question but apply it to different subjects (Person vs. Office). If your theory holds that "moral debt" is only a property of persons, Q6 collapses (institutions can't owe moral debt). If your theory holds that institutions *can* be morally tainted, the tree holds. You must decide if "institutional sin" is metaphorical or real before using this branch.
