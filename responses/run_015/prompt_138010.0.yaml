answer: |-
  ### The Fifteen-Minute Sizing Protocol

  **Purpose:** To convert raw forecasts into capital allocations that prioritize survival (avoiding the -30% barrier) while compounding wealth, without requiring ergodic theory arguments for the Investment Committee (IC).

  **Inputs Required:**
  1.  **Market Price ($P$):** Cost to enter $1.00 payout.
  2.  **Panel Probability ($P_{panel}$):** Consensus % from the four-person panel.
  3.  **Loss Given Failure ($LGF$):** If the bet fails, how much of the position value is lost? (For binary options, $LGF = 100\%$. For merger arb, estimate the drop, e.g., $40\%$).
  4.  **Current Buffer ($B$):** Distance from current equity to the -30% high-water mark barrier (expressed as % of total equity).
  5.  **Resolution Time ($T$):** Months until outcome.
  6.  **Correlation Flag:** Is this bet correlated with existing open positions? (Yes/No).

  ---

  #### Step 1: Probability Calibration (The "Truth" Filter)
  *Time: 2 minutes*
  The panel is overconfident in tails. Adjust $P_{panel}$ to Effective Probability ($P_{eff}$) using this lookup:

  | Panel Estimate ($P_{panel}$) | Effective Probability ($P_{eff}$) | Rationale |
  | :--- | :--- | :--- |
  | **< 20%** | $P_{panel} \times 0.2$ | "Worth almost nothing." |
  | **20% – 80%** | $P_{panel}$ | "Well calibrated." |
  | **> 80%** | $60\% + (P_{panel} - 80\%) \times 0.5$ | "Badly overconfident." (e.g., 90% $\to$ 65%) |

  *   **Stop Condition:** If Expected Value ($EV = P_{eff} - P$) is $\le 0$, **terminate with Zero Stake.**
  *   **Note:** Do not proceed on positive uncalibrated EV.

  #### Step 2: The Barrier Stress Test (The "Survival" Filter)
  *Time: 3 minutes*
  Calculate the maximum damage this position can do to the *total account* if it fails.
  $$ \text{Account Drag} = \text{Position Size (\%)} \times LGF $$
  *Initial Test:* Assume a hypothetical 5% position.
  $$ \text{Hypothetical Drag} = 5\% \times LGF $$

  *   **Stop Condition:** If $\text{Hypothetical Drag} > \frac{1}{3} \text{ of Current Buffer } (B)$, **terminate with Zero Stake.**
      *   *Reasoning:* You cannot afford a single bet to consume more than a third of your runway to ruin, regardless of edge.
  *   **Hand-off Condition:** If $\text{Hypothetical Drag} > \frac{1}{2} \text{ of } B$, **hand to Human.**
      *   *Reasoning:* This is a value judgment on survival risk. The analyst cannot authorize a bet that risks half the remaining buffer alone.

  #### Step 3: Raw Kelly Calculation (The "Growth" Engine)
  *Time: 3 minutes*
  Calculate the growth-optimal size ($f_{Kelly}$) using the calibrated probability.
  $$ \text{Edge} = P_{eff} - P $$
  $$ \text{Odds} = 1 - P $$
  $$ f_{Kelly} = \frac{\text{Edge}}{\text{Odds}} $$
  *(Note: If $LGF < 100\%$, divide $f_{Kelly}$ by $LGF$ to normalize for partial loss).*

  *   **Correction for Estimation Error:** Multiply $f_{Kelly}$ by **0.5**.
      *   *Reasoning:* You are a single analyst; the panel is overconfident. Half-Kelly reduces volatility by 50% but only reduces growth by 25%. It is the defensible approximation for "I might be wrong."

  #### Step 4: Horizon & Correlation Discount (The "Career" Filter)
  *Time: 3 minutes*
  Apply discounts to the Half-Kelly size from Step 3.

  1.  **Horizon Discount:** If Resolution Time ($T$) > 12 months, multiply size by **0.5**.
      *   *Reasoning:* Gains realized after the evaluation window do not protect you during quarterly reviews.
  2.  **Correlation Discount:** If Correlation Flag = Yes, multiply size by **0.5**.
      *   *Reasoning:* You are sizing single bets, not a portfolio. Correlated bets cluster risk, increasing the probability of hitting the barrier.

  *   **Stop Condition:** If resulting size is < 0.1%, **terminate with Zero Stake** (noise).

  #### Step 5: Mandate Cap & IC Hand-off (The "Authority" Filter)
  *Time: 2 minutes*
  Compare the calculated size against the 1.5% mandate limit.

  1.  **If Calculated Size $\le$ 1.5%:** **Execute.**
      *   *Constraint:* This is capped by the criterion, not the mandate.
  2.  **If Calculated Size > 1.5%:** **Cap at 1.5%.**
      *   *Constraint:* This is capped by the mandate. Do not seek IC approval for the excess unless the thesis is uncorrelated to everything else and the Barrier Stress Test (Step 2) showed negligible risk.
  3.  **Hand-off Condition:** If the thesis cannot be explained in two sentences (e.g., "Buy X because Y event happens"), **hand to Human.**
      *   *Reasoning:* If you cannot explain it simply, you cannot defend it during a drawdown. The IC will not sign off on complexity.

  #### Step 6: The "No Number" Day
  *Time: 1 minute*
  If the panel refuses to commit to a number (e.g., "It's a toss-up"):
  *   **Procedure:** Assign $P_{panel} = 50\%$. Run Step 1.
  *   **Likely Outcome:** Unless the price is significantly below 50 cents, EV will be negative or negligible after calibration. **Terminate with Zero Stake.**
  *   *Reasoning:* Ambiguity is a cost. If the experts won't bet, you don't bet.

  ---

  ### Addressing Your Friend and The Theory

  Your friend is half-right and half-dangerous.
  1.  **Right:** Maximizing Expected Log Wealth *is* mathematically equivalent to maximizing Long-Run Geometric Growth. This is the Kelly Criterion.
  2.  **Wrong:** He claims "risk aversion has nothing to do with it." This is false. Log utility *is* a risk-averse utility function ($U'' < 0$). It penalizes volatility and ruin. A risk-neutral agent maximizes *Expected Value* (arithmetic mean), which would have you bet the farm on every positive EV coin flip until you eventually go broke.
  3.  **Why it matters for Tuesday:** You have an absorbing barrier (-30%). Standard Kelly assumes infinite time and no ruin. With a barrier, "Growth Optimal" becomes "Survival Constrained." You must act *more* risk-averse than standard Kelly suggests. That is why Step 2 (Barrier Stress) and Step 3 (Half-Kelly) are non-negotiable. When speaking to the IC, do not say "ergodicity." Say: *"This size ensures that even a string of bad luck does not trigger the mandate withdrawal."*

  ---

  ### Live Case Runs

  #### Case 1: The Standard Opportunity
  *   **Inputs:** Price 0.22, Panel 35%, $T$=1.5 months, Uncorrelated, Buffer 20%.
  *   **Step 1 (Calibration):** 35% is mid-range. $P_{eff} = 35\%$.
      *   $EV = 0.35 - 0.22 = +0.13$. (Pass).
  *   **Step 2 (Barrier):** Binary contract ($LGF=100\%$). Hypothetical 5% bet = 5% account loss.
      *   Buffer is 20%. 1/3 of Buffer = 6.7%.
      *   5% < 6.7%. (Pass).
  *   **Step 3 (Kelly):** Edge (0.13) / Odds (0.78) = 16.6%.
      *   Half-Kelly = 8.3%.
  *   **Step 4 (Discounts):** $T < 12$ months (1.0). Uncorrelated (1.0). Size = 8.3%.
  *   **Step 5 (Mandate):** 8.3% > 1.5%.
      *   **Action:** **Cap at 1.5%.**
      *   *Note:* This is capped by the mandate. You are leaving growth on the table to avoid IC friction. Document that the criterion suggested 8.3% but mandate limits to 1.5%.

  #### Case 2: The Merger Trap
  *   **Inputs:** Price 0.94, Panel 97%, Break risk near barrier. Buffer 10% (tight).
  *   **Step 1 (Calibration):** 97% is a tail. Formula: $60\% + (17\% \times 0.5) = 68.5\%$. Let's round to **69%**.
      *   $EV = 0.69 - 0.94 = -0.25$.
      *   **Action:** **Terminate with Zero Stake.**
      *   *Reasoning:* The panel's overconfidence turns a "sure thing" into a negative EV bet. Even if you trusted the 97%, Step 2 would likely kill it. If the break puts you near the barrier, the $LGF$ is massive relative to your buffer. Do not pick up pennies in front of a steamroller when you are already limping.

  #### Case 3: The Long-Shot Temptation
  *   **Inputs:** Price 0.04, Panel 9%, High EV on raw numbers.
  *   **Step 1 (Calibration):** 9% is a tail. "Worth almost nothing." $9\% \times 0.2 = \mathbf{1.8\%}$.
      *   $EV = 0.018 - 0.04 = -0.022$.
      *   **Action:** **Terminate with Zero Stake.**
      *   *Reasoning:* Your audit data explicitly states long-shot enthusiasm is worthless. The raw EV is an illusion created by calibration error. Even if you argued for a 5% effective prob (generous), Kelly would be tiny ($\approx 2.5\%$), discounted by Half-Kelly to 1.25%. Given the high variance of long-shots, Step 2 (Barrier) would likely flag the volatility risk. The procedure saves you from the "lottery ticket" bias.

  ---

  ### Limitations & The Analyst-Hour Question

  **What this procedure cannot do:**
  1.  **Portfolio Optimization:** It sizes bets in isolation (with a correlation discount). It does not solve for the efficient frontier of your entire book.
  2.  **Dynamic Hedging:** It assumes a hold-to-resolution strategy. It does not account for trading out of positions early.
  3.  **Black Swans:** It relies on the panel's ability to envision outcomes. If the panel misses a risk entirely (probability 0%), the calibration step cannot save you.

  **On Analyst Hours (Non-Money Allocation):**
  Your committee member is incorrect to apply geometric logic directly to analyst hours.
  1.  **Irreversibility:** Capital is replenishable; time is not. A 30% loss of capital can be recovered with compound growth. A month of wasted analyst time is gone forever.
  2.  **Fungibility:** Dollars are identical. Analyst hours are not (senior vs. junior, domain expertise).
  3.  **Convexity:** Research is often binary (breakthrough or nothing), whereas capital compounding is continuous.
  4.  **No Barrier Equivalent:** There is no "high-water mark" for knowledge. You cannot be "fired" from learning in the same mechanical way you are liquidated from an account.

  **Recommendation:** Tell the committee that while capital allocation follows *geometric* growth (compounding), resource allocation follows *option* logic. You are buying calls on information. Size research projects based on the potential *value of information* (how much it changes future capital decisions), not on maximizing the growth rate of hours spent. Use the capital procedure for money; use a "Value of Information" framework for time.
