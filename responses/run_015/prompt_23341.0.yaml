          *   *Idea:* A/B testing or simple threshold optimization where the population shifts.
          *   *Scenario:* Optimizing click-through rate (CTR) by showing clickbaity headlines.
          *   *Critique:* Is that gaming? Maybe.
          *   *Better Idea:* *Regressional Goodhart* in a static model context.
          *   *Scenario:* Hiring. Use a test score as a proxy for job performance. You hire only people with perfect scores.
          *   *Why it's Goodhart:* The correlation between test score and performance holds for the general population, but breaks at the extreme (Extremal Goodhart). The test measures ability + noise. At the extreme, you select for noise.
          *   *Why it's NOT Spec Gaming:* There is no agent trying to trick the test. The candidates aren't "gaming" the test (assuming they just take it honestly). The *system* selecting them causes the breakdown.
          *   *Refinement for ML Infra:* Model validation. You tune hyperparameters on a validation set until it overfits. The val loss is no longer a proxy for test loss. No agent is "gaming" the val set; the optimization process itself exhausted the signal.

