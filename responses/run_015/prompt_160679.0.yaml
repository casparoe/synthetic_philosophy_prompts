prompt: |-
  I have followed the vagueness literature for years, and the standoff between epistemicism and supervaluationism now strikes me as a debate in which every argument on both sides is already in print and nobody moves. The epistemicist says the sorites and our tolerance intuitions are reconciled by a sharp but unknowable boundary, backed by a margin-for-error constraint on knowledge, and diagnoses the absence of any distinctive feeling of ignorance as an artifact of how little speakers care about the boundary. The supervaluationist keeps classical logic and the classical theorems by quantifying over admissible precisifications, treats borderline sentences as neither true nor false, and then spends most of its energy on whether its notion of truth is really truth, on whether the determinacy operator can itself be vague without regress, and on whether the epistemicist's unknowability is intelligible at all. Each side has a rehearsed reply to the other's central objection; the exchange has the texture of a stalemate rather than a hard problem.

  Before asking for a survey, let me add a case that I have not seen discussed and that I think is diagnostic. Consider a deployed classification system that maps each input to a continuous score and applies a cutoff fixed by administrative fiat â€” a predicate like *high-risk* or *likely to reoffend* as it is actually used by the people who operate the system. The cutoff exists, is sharp, is causally efficacious, and is in principle discoverable by anyone with access to the code. Yet the predicate as used displays what look like all the symptoms of vagueness: borderline cases, tolerance along the underlying dimension, no felt ignorance of a cutoff on the part of users, and a stubborn resistance to being told where the boundary is â€” operators who learn the cutoff often go on deliberating as before. If the epistemicist is right that vagueness just is ignorance of a sharp boundary, this looks like a case that should not be vague but is; if the supervaluationist is right that vagueness is semantic indeterminacy, it is mysterious how a stipulated and efficacious boundary fails to settle the matter.

  So: what kind of disagreement is this? My hypothesis, offered as a hypothesis, is that the two sides are not disagreeing about the semantics of vague predicates at all, but about what a semantic theory is answerable to: the epistemicist takes as data the classical logical behaviour of the predicate in a language we treat as bivalent, the supervaluationist takes as data the phenomenology and the practice of speakers in the borderline region, and neither treats the other's data as binding. A second possibility I take seriously is that the real work is being done by a question nobody has settled â€” whether the distinction between indeterminate and merely unknown can be drawn without collapsing one into the other, i.e. whether there is a formal difference between the two theories once you allow the supervaluationist's determinacy operator to be reinterpreted as an epistemic one. A third is that the impasse is a sign that the question has been ill-posed from the start, because *vagueness* names two different phenomena that happen to co-occur in natural language and come apart in stipulated cases like the one above.

  Please give me a diagnosis of the dispute rather than a verdict on it, and tell me which of these hypotheses â€” or something else â€” you think is right, with reasons that engage what each side actually claims rather than a neutral summary. Use the classifier case as a test: say what each theory should predict about it, and whether the case tells against either side or is simply one both can absorb. Then tell me what would count as progress given your diagnosis: a distinction, a formal result, an empirical finding about speakers, a change of question â€” ranked by how much it would actually move things â€” and give me an honest assessment of whether the debate is instead one where no resolution should be expected, and why.

  Format: lead with a single sentence stating your diagnosis in full, then develop it in no more than 800 words.
