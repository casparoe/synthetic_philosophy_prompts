answer: |-
  ### Part 1: The Logical Space

  Before you hand out the quiz, it helps to know what map you are drawing. Your quiz isn't really about biology facts; it is asking four underlying questions about causality and description. Think of these as four axes. By combining answers to these axes, we generate the 'leaves' on your tree.

  **The Four Separating Questions**

  1.  **The Conflict Question:** When a variant spreads *despite* harming the survival or reproduction of the entity carrying it, which one is the 'unit' of selection?
      *   *Option A:* The carrier (organism) is the unit; the variant is a parasite or pathology.
      *   *Option B:* The variant (gene/lineage) is the unit; the carrier is a vehicle.
  2.  **The Cohesion Question:** Can a collective trait evolve *without* genetic relatedness among members, provided the collective itself reproduces or survives?
      *   *Option A:* No. Without relatedness, 'selfish' members will always cheat and destroy the collective trait (Kin/Inclusive Fitness).
      *   *Option B:* Yes. If collectives with the trait out-survive those without it, the trait spreads regardless of internal relatedness (Group/MLS).
  3.  **The Emergence Question:** Is the fitness of a group simply the average fitness of its members, or does the group have a birth/death rate independent of member turnover?
      *   *Option A:* It is just the average (Trait-Group / MLS-Average).
      *   *Option B:* The group is an entity with its own life cycle (MLS-Emergent / Species Selection).
  4.  **The Reality Question:** Are these 'levels' real causal forces, or just different ways of describing the same mathematical change?
      *   *Option A:* They are real; one level is the 'true' driver.
      *   *Option B:* It is bookkeeping; any level can describe the change if the maths is done right (Deflationary).

  **Locating the Positions**

  *   **Gene/Replicator Selectionism:** Conflict (B), Cohesion (N/A), Emergence (N/A), Reality (A).
  *   **Organism-Centric:** Conflict (A), Cohesion (N/A), Emergence (N/A), Reality (A).
  *   **Inclusive Fitness (Kin):** Conflict (B/A mix), Cohesion (A), Emergence (A), Reality (A).
  *   **Trait-Group Selection:** Conflict (B), Cohesion (B), Emergence (A), Reality (A).
  *   **MLS (Emergent):** Conflict (B), Cohesion (B), Emergence (B), Reality (A).
  *   **Species/Clade Selection:** Conflict (B), Cohesion (B), Emergence (B), Reality (A) — *applied at species level*.
  *   **Lineage Proliferation:** Conflict (B), Cohesion (B), Emergence (B), Reality (A) — *focus on persistence over time*.
  *   **Deflationary (Bookkeeping):** Reality (B). (This cuts across all others).

  **Empty and Indistinguishable Positions**

  *   **Empty Leaf:** *'Group Selection without Group Reproduction'.* If you claim groups are selected but admit they do not have a birth/death rate distinct from their members (Emergence Question A), you logically collapse into Trait-Group or Individual selection. There is no coherent position where groups are units but have no independent fitness.
  *   **Indistinguishable Pair:** *Kin Selection vs. Trait-Group Selection (with high relatedness).* In cases where group members are highly related (like the sterile ants), Kin Selection and Group Selection often make identical predictions about which traits spread. Your quiz can separate them using the **Chimeric Colony** case (where relatedness is zero), but in standard altruism cases, they are mathematically equivalent descriptions of the same process.
  *   **Indistinguishable Pair:** *MLS (Emergent) vs. Species Selection.* These are the same logic applied at different scales. The quiz treats them as one 'Higher-Level Entity' position unless you specifically force a choice between 'Colony' and 'Species'.

  ***

  ### Part 2: The Levels of Selection Sorting Quiz

  **Instructions:** Read each case carefully. Choose the **one** statement per question that best matches what you think is *actually happening* in the biology. Do not worry about technical terms; answer based on the logic of the case.

  **Case 1: The Saboteur Gene**
  A mutant gene ('S') alters sperm production in males. Males with 'S' produce sperm where 90% carry 'S' (instead of the usual 50%). However, the process damages the males' health, and they produce 50% fewer offspring total than males without 'S'. Over 100 generations, 'S' becomes common in the population, but the total population size crashes.

  **Q1. Which statement best describes the change in frequency of 'S'?**
  *   (A) The males failed to reproduce effectively, so the gene ultimately failed; its frequency rise is a temporary pathology.
  *   (B) The gene succeeded in getting into the next generation, even though the males carrying it failed.
  *   (C) Success cannot be judged without looking at the survival of the whole population.

  **Case 2: The Chimeric Colony (Required)**
  A colonial sea creature forms when ~20 unrelated larvae fuse. Inside a colony, a cell variant ('Fast') divides quicker than normal cells ('Slow'). 'Fast' cells take over the colony. However, colonies dominated by 'Fast' cells become unstable and die without releasing new larvae. 'Slow' colonies release many new larvae. There is no genetic relatedness between cells in a colony.

  **Q2. What happens to the 'Fast' variant in the ocean over time?**
  *   (A) It disappears, because the colonies carrying it die out.
  *   (B) It spreads, because it wins inside every colony, even if colonies die.
  *   (C) It persists only if 'Fast' cells can escape and found new colonies alone.

  **Q3. Why does the outcome in Q2 occur?**
  *   (A) Because the cells are unrelated, they cannot evolve a trait that helps the colony.
  *   (B) Because the colony is a reproducing entity, its death overrides the cell's success.
  *   (C) Because the average fitness of cells in 'Slow' colonies is higher.

  **Case 3: The Learned Dialect (Required)**
  A bird species learns song dialects. Flocks singing Dialect X coordinate better and survive droughts. Flocks singing Dialect Y starve. However, singing Dialect X is physically costly; individual birds singing X die slightly younger than those singing Y. The song is not genetic; it is copied.

  **Q4. What is the primary unit that is being 'selected' here?**
  *   (A) The individual birds with the best survival rates.
  *   (B) The flock as a surviving group.
  *   (C) The song lineage, using the birds as hosts to copy itself.

  **Case 4: The Sterile Soldiers (New)**
  In a species of ant, some workers are sterile soldiers. They never breed. Colonies with more soldiers defeat rival colonies and grow larger. The soldiers are highly related to the queen's offspring (75% shared genes).

  **Q5. The soldier trait evolved because:**
  *   (A) The soldiers helped copies of their own genes survive in the queen's offspring.
  *   (B) Colonies with soldiers out-competed colonies without them.
  *   (C) The species required soldiers to avoid extinction.

  **Case 5: The Speciating Moths (New)**
  A clade of moths contains many species. Species where individuals have a 'wide diet' tend to split into new species more often. Species with 'narrow diet' tend to go extinct. Within a species, an individual moth with a wide diet does not live longer or lay more eggs than one with a narrow diet.

  **Q6. What explains why 'wide diet' moths dominate the fossil record?**
  *   (A) Individual moths with wide diets are fitter.
  *   (B) Species with the 'wide diet' trait 'reproduce' (speciate) more frequently.
  *   (C) It is random chance; there is no selection here.

  **Case 6: The Bookkeeping Check (General)**
  Look at all five cases above. In every case, the frequency of a variant (gene, cell, song, trait) changes over time.

  **Q7. Can this change be calculated *exactly* by tracking only the survival and reproduction of the smallest physical particle (the gene, cell, bird, or individual moth)?**
  *   (A) Yes, always. The higher-level patterns are just summaries of the bottom-level math.
  *   (B) No. Sometimes you need the group or species rate to get the correct answer.
  *   (C) It depends on how you define 'particle'.

  **Q8. If two biologists argue, one saying "Selection acted on the gene" and the other "Selection acted on the organism", are they:**
  *   (A) Describing two different causal mechanisms; one is right, one is wrong.
  *   (B) Describing the same outcome from different perspectives; both can be valid.
  *   (C) Arguing about semantics; biology should not use the word 'selection'.

  ***

  ### Part 3: Scoring Key and The Leaves

  Tally your answers. There is no 'right' score, but your pattern locates your philosophical position.

  **The Gene/Replicator Selectionist**
  *   **Pattern:** Q1(B), Q4(C).
  *   **View:** The only thing that persists is the information (gene or meme). Organisms are temporary vehicles.
  *   **Most Awkward Commitment:** You must regard a sterile worker ant as 'reproducing' via the queen, which stretches the definition of an individual life.

  **The Organism-Centric Traditionalist**
  *   **Pattern:** Q1(A), Q5(A).
  *   **View:** Natural selection is about the survival and reproduction of whole organisms.
  *   **Most Awkward Commitment:** You struggle to explain why sterile soldiers exist without calling them 'altruistic exceptions' rather than products of selection.

  **The Inclusive Fitness (Kin) Theorist**
  *   **Pattern:** Q2(A), Q3(A), Q5(A).
  *   **View:** Altruism and group traits only evolve if members share genes. Relatedness is the glue.
  *   **Most Awkward Commitment:** You must treat the Chimeric Colony as incapable of evolving colony-level traits, even if it reproduces, simply because cells are unrelated.

  **The Trait-Group Selectionist**
  *   **Pattern:** Q2(B), Q3(C), Q5(B).
  *   **View:** Groups are selected, but group fitness is just the average of member fitness.
  *   **Most Awkward Commitment:** You claim the group is the unit, but your math admits the group is nothing more than a bag of individuals.

  **The MLS (Emergent) / Group Entity Theorist**
  *   **Pattern:** Q2(B), Q3(B), Q5(B), Q7(B).
  *   **View:** Groups (or colonies) are genuine entities with their own birth and death rates, distinct from members.
  *   **Most Awkward Commitment:** You must defend the idea that a loose collection of cells or birds counts as an 'individual' in the same way a lion is.

  **The Species/Clade Selectionist**
  *   **Pattern:** Q6(B), Q7(B).
  *   **View:** Evolution happens at the species level; species are born (speciation) and die (extinction).
  *   **Most Awkward Commitment:** Species do not reproduce in a neat, particulate way like organisms, making the 'fitness' math messy.

  **The Deflationary (Bookkeeping) Pluralist**
  *   **Pattern:** Q7(A), Q8(B).
  *   **View:** 'Levels of selection' are not real battles. They are different mathematical models describing the same frequency change.
  *   **Most Awkward Commitment:** You risk sounding like you believe nothing *causes* evolution, only that we can describe it in many ways.

  **The Lineage Proliferationist**
  *   **Pattern:** Q1(B), Q4(C), Q6(B).
  *   **View:** It is not about 'units' but about which lineages (genes, species, memes) persist through time.
  *   **Most Awkward Commitment:** You include cultural songs and biological genes in the same category, which many biologists find category-confused.

  ***

  ### Part 4: Discussion Notes for the Group

  **On the Empty Leaf:**
  If anyone argues for **Group Selection** but answers **Q3(C)** (Average Fitness) or **Q7(A)** (Bottom-up math), they are occupying an empty leaf. You cannot claim the group is a real unit of selection if you admit its fitness is *only* the sum of its parts. That position collapses into Individual Selection. A true Group Selectionist *must* answer Q7(B).

  **On the Indistinguishable Pair:**
  Pay close attention to **Case 4 (Sterile Soldiers)**. If a student answers **Q5(A)** (Kin) and another answers **Q5(B)** (Group), ask them to predict the outcome. They will likely predict the *same* outcome (soldiers evolve).
  *   **Discussion Point:** Kin Selection and Group Selection are often mathematically equivalent when relatedness is high. The debate is often about *causality* (did the gene drive it, or did the group competition drive it?) rather than *outcome*.
  *   **The Separator:** This is why **Case 2 (Chimeric Colony)** is vital. Kin Selection predicts the colony trait *cannot* evolve (Answer Q2-A). Group Selection predicts it *can* (Answer Q2-B). This is the only place in the quiz where they truly diverge.

  **On the Deflationary View:**
  If someone scores heavily on **Q8(B)**, they are adopting the 'Bookkeeping' view. Challenge them: "If both descriptions are valid, why does it matter for conservation or medicine?" (e.g., Do we treat the cancer cell or the patient?). This tests whether the distinction has practical utility or is just philosophy.
