  **(Self-Correction on "Greedy Reductionism"):** This is the claim that "Only the bottom level is real." In compilation, this is "Only Assembly matters." Dennett says this is wrong because high-level patterns are *real* (compression). In compilation, high-level patterns are *useful* (abstraction). Is "useful" the same as "real"? That's the crux of the residue report.

