      *   **Greedy Reductionism:** The idea that because you *can* explain something at the lower level, the higher level is irrelevant, illusory, or "nothing but" the lower level. (Dennett critiques this; he is a reductionist but not a *greedy* one. He thinks higher levels are real patterns).
      *   **Real Patterns:** Higher-level descriptions are valid if they offer predictive compression or utility, even if grounded in lower-level mechanics.

  3.  **Translate to Compiler Engineering Vocabulary:**
      *   *Source Code:* High-level intent, semantics, abstractions (functions, classes, loops).
      *   *Object Code/ISA:* Low-level mechanics, registers, memory addresses, opcodes.
      *   *Cranes:* Optimization passes (inlining, loop unrolling, register allocation). These are the mechanical steps that transform high intent into low mechanics without invoking magic.
      *   *Skyhooks:* The idea that the *meaning* or *correctness* of the program comes from outside the mechanical transformation (e.g., "The compiler just *knows* what I meant" without analysis, or invoking a "homunculus" inside the CPU). Or, conversely, assuming the Source Level has magical properties that don't survive lowering.
      *   *Greedy Reductionism:* "The source code doesn't matter; only the assembly matters." Or "Once we have the binary, the source abstractions are illusions."
