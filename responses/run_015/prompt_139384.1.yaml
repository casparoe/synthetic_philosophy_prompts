answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees; Principal Investigators, *Cooperation Without Contact*
  **FROM:** Grants Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Proposal *Cooperation Without Contact*

  **Decision**

  The Grants Committee recommends **declining** the proposal *Cooperation Without Contact* in its current form. We will not award the requested $1.8M.

  **The Three Questions**

  Our deliberations conflated three distinct issues. To ensure clarity for the Board and the applicants, we must separate them:

  1.  **Agent Rationality:** Is it rational for an individual agent to bear costs to benefit another agent it cannot causally influence, provided their decision procedures are correlated?
  2.  **Fiduciary Permission:** Is it permissible for a foundation fiduciary to spend restricted funds on activities where the link to benefit is non-causal, given a gift instrument requiring an "identifiable mechanism"?
  3.  **Epistemic Responsibility:** Can a funding body act responsibly when it can receive no feedback on whether its expenditure succeeded?

  This recommendation turns decisively on **Question 2**.

  **The Deciding Factor: Fiduciary Permission**

  Our legal counsel interprets the restricted gift instrument as requiring a causal pathway between the funded activity and the benefit sought. The investigators argue this interpretation begs the question, as the research seeks to determine if benefits can flow via correlation rather than causation. However, as fiduciaries, we are bound by the instrument's current legal language, not by the potential outcomes of the research. Until the instrument is amended or counsel advises that "mechanism" encompasses logical correlation without causation, we cannot authorize expenditure that lacks a defined causal chain. This is a compliance constraint, not a judgment on the underlying science.

  **Accessibility and Merit (Question 1)**

  For trustees unfamiliar with the decision theory involved: The proposal asks whether you should cooperate with a "twin" — someone who thinks like you but is too far away to ever meet or message. Standard reasoning says: "My choice cannot change theirs, so I should keep my resources." The investigators argue: "If we are similar, my choice predicts theirs. If I cooperate, they likely cooperate. We both gain."

  The Committee does not reject this hypothesis as implausible. The split vote reflects genuine uncertainty. We acknowledge that if acausal cooperation is real, the expected value is enormous, as the reference class includes potential civilizations and AI systems across the cosmos. We are not declining because the idea sounds strange; we are declining because our current legal vehicle cannot carry it.

  **The Losing Side: The Applicants' Case**

  The strongest argument against this decision comes from the investigators and the trustees who supported funding. They contend that insisting on a causal mechanism assumes the conclusion that only causation matters. If the universe permits influence through logical correlation, a restriction demanding causation blinds the Foundation to high-impact opportunities simply because they do not fit a twentieth-century model of physics.

  For this argument to carry the day, two things would need to be true. First, legal counsel would need to certify that funding research into non-causal mechanisms satisfies the "identifiable mechanism" clause, perhaps by viewing the research itself as the mechanism for future clarity. Second, the Board would need to accept that fiduciary duty allows for expenditure where the link to benefit is theoretically sound but empirically unverifiable. Currently, neither condition is met.

  **Accountability and Feedback (Question 3)**

  Regarding the inability to verify success: One trustee argued that a funder unable to learn whether it succeeded cannot act responsibly. Another countered that our decision itself becomes evidence for similar funders, creating a feedback loop via correlation.

  While the latter is philosophically consistent within evidential decision theory, it conflicts with standard stewardship practices. We manage donor capital with an obligation to evaluate impact. If we cannot distinguish success from failure even in principle, we cannot fulfill our duty to assess performance. The third trustee's question — why agents employing this reasoning are not visibly better off — remains unanswered. Until there is observable evidence that institutions practicing acausal cooperation outperform those that do not, we cannot waive standard accountability requirements.

  **Path Forward**

  This decline is not a rejection of the researchers' competence. The empirical workstream, which studies whether independently trained systems converge on mutually beneficial policies, may satisfy the gift's mechanism requirement. The investigators have stated the two workstreams are inseparable and will not accept a partial award. However, should they reconsider this position, we would welcome a revised proposal focusing solely on the empirical convergence of machine learning systems.

  Additionally, should the Board seek to amend the restricted gift instrument to explicitly allow for non-causal mechanisms, we would be prepared to reconsider proposals of this nature under the new terms.

  **Conclusion**

  We face a tension between innovative theory and established fiduciary constraint. While the potential upside of acausal cooperation is vast, the Foundation cannot violate the legal instruments governing its capital. We must decline this proposal, not because the science is wrong, but because the grant vehicle is insufficient.

  **Recommendation:** Decline.
