answer: |-
  Hi everyone, hope you are all well and that the hangover from the last session has faded. I have been thinking about our stuck point on blame and I reckon we need to map where we actually stand rather than arguing over labels like compatibilist or Strawsonian. To do that I have drafted ten questions based on the cases we argued about, and I want you to read through them and note which option sounds most right to you without worrying about the philosophical vocabulary. Question 1 concerns the friend who let you down badly out of pure thoughtlessness with no malice at all, and you must choose between feeling that their lack of care is enough to warrant resentment, feeling that without malicious intent blame is misplaced, or feeling that you should only express disappointment to shape future behaviour. Question 2 involves the teenager who grew up in a violent, chaotic home and is now violent himself, asking whether his background excuses him completely because his character was caused, whether he is still blameworthy because he chose the violence, or whether we should blame him only to stop him doing it again. Question 3 is about someone who did you serious harm while under hypnosis or with a brain tumour pressing on the relevant bit, where you decide if this is a total exemption from blame because they were not themselves, or if it is merely a partial excuse because the harm was still done. Question 4 presents a person who wronged you and later had a brain injury that completely changed their personality, forcing a choice between blaming the person who did it even though they are gone, refusing to blame the person who now exists, or blaming the body regardless of the mind. Question 5 asks about the five-year-old who destroys something precious to you, specifically whether you feel anger at the child as a moral agent, only sadness at the situation, or anger only to teach them a lesson. Question 6 covers a wrong done to you by a company or a crowd where no single person's will is the culprit, asking if you can blame the collective entity, only the individuals involved, or no one at all. Question 7 describes a stranger who helped you out for a rotten reason, requiring you to say if the good act cancels the bad will, if the bad will still stains them despite the help, or if we should only judge the outcome. Question 8 is about blaming yourself for something you did years ago, asking if you are the same person who did it and deserve guilt, if you are someone new and should let it go, or if you should only feel regret to improve your future self. Question 9 asks generally if blame is essentially a feeling of resentment or a judgement of wrongness. Question 10 asks if we could cure criminality with a pill, should we do it instead of punishing, and you must say yes because suffering is bad, no because justice requires payback, or yes but only if the criminal consents.

  Now that you have your answers, imagine we are walking through a forest where the path splits at several points, and your answers determine which track you take. The first fork comes at Question 10 and Question 2, where you must decide if the ultimate justification for blame is about what people deserve based on the past or about what good consequences come from it in the future. If you chose the pill over punishment and said the teenager is excused because his character was caused, you have taken the path of the Hard Line, which says that if everything about a person was caused then nobody is ever blameworthy in the desert sense. If you chose the pill but still think the teenager is blameworthy, or if you said blame is a tool for shaping behaviour in Question 1, you are on the Consequentialist path, which splits again into the Straight Consequentialist view that blame is a tool for deterrence and reform and desert has nothing to do with it, and the Revisionist one that says keep the practice but retune it to what it actually achieves. If you rejected the pill because justice requires payback, you are on the Desert path, which splits again at Question 3 and Question 5 regarding whether causal determination or lack of capacity rules out blame. If you said the brain tumour victim is exempt but the five-year-old is not, you are likely a Quality-of-Will Compatibilist who thinks blame is about what the person's behaviour says about how they regard you. If you said the brain tumour victim is exempt and the friend who was thoughtless is also exempt, you are closer to Strawson's own view that reactive attitudes depend on regarding the other as a participant in a relationship. If you said you can assess someone as a bad person without it following that they are to blame, you have taken the Assessment versus Blame path, which separates moral judgement from the sanction.

  There are some combinations of answers that form empty spaces in this logical map because they are incoherent or simply unattractive to hold. For instance, claiming that blame is purely about desert but also that we should take the pill to cure criminality regardless of justice is a contradiction that nobody bothers to defend because it cancels itself out. Similarly, saying that the five-year-old is fully blameworthy in the desert sense while saying the brain tumour patient is not is hard to sustain without a clear theory of capacity that most people do not have, so that leaf remains mostly empty. There are also two leaves the quiz genuinely cannot separate, which are Strawson's own view and the Quality-of-Will Compatibilist one, because both rest on the idea that blame tracks the quality of will rather than metaphysical freedom, and the distinction is often more about emphasis than substance. Another pair that is hard to distinguish here is the Straight Consequentialist and the Revisionist, since both treat blame as a tool, though the Revisionist cares more about preserving the emotional texture of the practice.

  Here is the location of the real positions in that space along with their cost. The Hard Line sits at the end of the path where causation excuses everything, and its most awkward commitment is that we must treat murderers like broken toasters rather than moral agents. The Straight Consequentialist sits where blame is purely a tool, and its most awkward commitment is that we should blame the innocent if doing so would prevent a riot. The Revisionist sits nearby but keeps the emotions, and its most awkward commitment is that we must pretend our resentment is about desert when it is really about utility. The Quality-of-Will Compatibilist sits where blame tracks regard, and its most awkward commitment is that a person caused to be malicious is still blameworthy simply because they are malicious. Strawson's own view sits where reactive attitudes are natural, and its most awkward commitment is that we cannot really argue someone out of resentment even if we know their behaviour was determined. The Assessment versus Blame view sits where we judge but do not sanction, and its most awkward commitment is that we must regard terrible people as morally bad without ever holding them responsible for it.

  I hope this helps us settle where we actually stand rather than what we call ourselves, so have a look and let me know which path you ended up on before we meet next week. Cheers.
