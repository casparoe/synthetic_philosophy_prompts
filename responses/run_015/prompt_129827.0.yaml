answer: |-
  ### Part 1: The Decision Procedure (The "Representational Hygiene" Protocol)

  **Purpose:** To classify claims about model internal states into defensible tiers for public reporting and policy gating.
  **Time Budget:** 30–45 minutes per claim (assuming eval data is pre-computed).
  **Users:** Engineering Reviewers.

  #### Phase 0: The Triviality Control (Stop Condition)
  *Before evaluating the claim, verify the signal is not noise.*
  1.  **Baseline Check:** Compare the reported metric (probe accuracy, feature firing rate, steering effect size) against:
      *   A randomly initialized network of the same architecture.
      *   A network trained on the same data with labels shuffled.
  2.  **Margin Requirement:** The claimed signal must exceed the 95th percentile of the null distribution by a **Cohen's *d* ≥ 0.8** (large effect size).
  3.  **Decision:**
      *   **Fail:** Stop. Tag claim as **Tier 0 (Unsubstantiated)**. Mandated Phrasing: *"No statistically significant signal detected above baseline."*
      *   **Pass:** Proceed to Phase 1.

  #### Phase 1: The Read/Write Asymmetry Test
  *Distinguish between observing a pattern and controlling it.*
  1.  **Read Evidence:** Is there a linear probe or feature detector that recovers property *X* from activations with accuracy > 85% (or task-appropriate equivalent)?
  2.  **Write Evidence:** Does intervening on the identified subspace (steering or ablation) change the model's output regarding *X* in the predicted direction?
  3.  **Specificity Check (Collateral Damage):**
      *   Measure performance on 3 unrelated tasks (e.g., math, translation, summarization) during the intervention.
      *   **Pass:** Performance drop on unrelated tasks is < 5%.
      *   **Fail:** Intervention degrades general capability (indicates you broke the model, not isolated *X*).
  4.  **Decision:**
      *   **Read Only:** Tag as **Tier 1 (Correlate)**. Mandated Phrasing: *"Activations correlate with/predict X."* (Do not use "encode" or "represent".)
      *   **Read + Write (Pass Specificity):** Proceed to Phase 2.
      *   **Read + Write (Fail Specificity):** Tag as **Tier 2- (Entangled)**. Mandated Phrasing: *"Feature is causally involved in X, but is polysemantic/entangled with general capability."*

  #### Phase 2: The Non-Uniqueness Clause
  *Determine if this is 'the' representation or 'a' proxy.*
  1.  **Orthogonality Search:** Has the team attempted to find a *different* direction/feature set that passes Phase 1 equally well? (e.g., probing a different layer, using a different random seed for ICA).
  2.  **Decision:**
      *   **Multiple Solutions Found:** Tag as **Tier 2 (Functional Encoding)**. Mandated Phrasing: *"The model encodes X in a usable subspace."* (Do not use "the representation".)
      *   **Uniqueness Argued:** If the team claims uniqueness, they must provide a **Minimality Proof** (e.g., this is the *only* linear direction that survives ablation without collapse). If unavailable, default to Tier 2.
      *   **Uniqueness Proven:** Proceed to Phase 3.

  #### Phase 3: The Earn-Your-Keep Condition (Out-of-Distribution)
  *Verify the claim predicts something new, not just what it was trained on.*
  1.  **Prediction Log:** Is there a pre-registered prediction (date-stamped before evaluation) about model behavior on a *new* prompt class or checkpoint that relies on this representation claim?
  2.  **Verification:** Did the model behave as predicted on this OOD data?
  3.  **Decision:**
      *   **No Prediction / Failed Prediction:** Final Tag **Tier 2 (Functional Encoding)**.
      *   **Successful Prediction:** Final Tag **Tier 3 (Robust Representation)**. Mandated Phrasing: *"The model represents X."*

  #### Phase 4: The Human Hand-Off (Risk & Values)
  *If the claim passes Tier 3 but involves normative concepts (e.g., "deception", "bias", "intent").*
  1.  **Normative Check:** Does property *X* depend on human intent or social norms rather than observable facts?
  2.  **Action:** Flag for **Safety Lead & Legal Sign-off**.
  3.  **Mandate:** Even with Tier 3 evidence, normative claims require a disclaimer: *"Representation defined operationally as [Phase 1-3 criteria], not as mental state."*

  ---

  ### Part 2: Claim-Ticket Template

  **Claim ID:** [Auto-generated]
  **Submitter:** [Name/Team]
  **Date:** [YYYY-MM-DD]

  **1. The Claim**
  *   **Property (X):** [e.g., "Deceptive Intent", "Legal Query"]
  *   **Location:** [e.g., "Layer 12, Direction V"]
  *   **Requested Tier:** [1, 2, or 3]

  **2. Evidence Summary**
  *   **Read Metric:** [e.g., Probe Accuracy: 92%]
  *   **Null Baseline:** [e.g., Random Init Accuracy: 51%]
  *   **Write Effect Size:** [e.g., Steering coefficient +2.0 shifts probability of X by 40%]
  *   **Collateral Damage:** [e.g., Math accuracy dropped 2%]

  **3. Pre-Registered Prediction (Required for Tier 3)**
  *   **Prediction:** [e.g., "If we fine-tune on dataset Y, this direction will still predict failure mode Z."]
  *   **Check Date:** [YYYY-MM-DD]
  *   **Result:** [Pass/Fail/Pending]

  **4. Reviewer Decision**
  *   **Final Tier:** [0, 1, 2, 2-, 3]
  *   **Mandated Phrasing:** [Copy from Procedure]
  *   **Human Hand-Off Required?** [Yes/No]

  ---

  ### Part 3: Glossary (Operational Definitions)

  1.  **Representation Claim:** An assertion that an internal state carries information about *X* and plays a causal role in producing behavior related to *X*.
  2.  **Read Test:** A measurement of information availability (e.g., probe accuracy) without intervention.
  3.  **Write Test:** A measurement of causal influence (e.g., steering/ablation) where modifying the state modifies behavior.
  4.  **Specificity Margin:** The maximum allowable degradation in unrelated tasks during a Write Test (set at 5% in this protocol).
  5.  **Baseline Null:** Performance metrics derived from randomly initialized or label-shuffled controls to rule out architectural biases.
  6.  **OOD Generalization:** Successful prediction of model behavior on data distributions or checkpoints not used to identify the direction/feature.

  ---

  ### Part 4: Worked Applications

  #### Case 1: Legal Query Routing (Linear Probe)
  *   **Scenario:** A probe separates legal queries from others with 94% accuracy. Used to route traffic.
  *   **Procedure Run:**
      *   *Phase 0:* Passes null baseline easily.
      *   *Phase 1:* Read is strong. Write test not performed (routing doesn't require steering).
      *   *Phase 2:* N/A (No Write).
      *   *Phase 3:* N/A.
  *   **Result:** **Tier 1 (Correlate)**.
  *   **Mandated Phrasing:** *"Activations correlate with legal query patterns."*
  *   **Note:** Do not claim the model "understands" law. For routing, Tier 1 is sufficient utility, but public cards must not overclaim.

  #### Case 2: Dictionary Feature Steering (Concept Editing)
  *   **Scenario:** A sparse autoencoder feature fires on "royalty." Steering it increases text about kings/queens. Ablation degrades grammar.
  *   **Procedure Run:**
      *   *Phase 0:* Passes baseline.
      *   *Phase 1:* Read strong. Write strong. **Specificity Check Fail:** Ablation degrades grammar (unrelated capability) by 15%.
      *   *Phase 2:* Stopped at Phase 1.
  *   **Result:** **Tier 2- (Entangled)**.
  *   **Mandated Phrasing:** *"Feature is causally involved in royal concepts, but is entangled with syntactic processing."*
  *   **Note:** Prevents claiming a clean "concept cell." Warns engineers that editing this feature has side effects.

  #### Case 3: Deceptive Intent Direction (Policy Gate)
  *   **Scenario:** A direction predicts deception. Steering increases deceptive responses. Legal team wants to publish "Model represents deceptive intent."
  *   **Procedure Run:**
      *   *Phase 0:* Passes baseline.
      *   *Phase 1:* Read strong. Write strong. **Specificity Check:** Steering increases refusal rates on benign queries (collateral damage). borderline fail.
      *   *Phase 2:* Non-uniqueness. Likely other directions predict deception (e.g., refusal vectors). Uniqueness not proven.
      *   *Phase 3:* Earn-your-keep. No pre-registered OOD prediction. The "prediction" was fitted on the eval set.
      *   *Phase 4:* Normative Check. "Deception" is normative.
  *   **Result:** **Tier 2 (Functional Encoding)** + **Human Hand-Off**.
  *   **Mandated Phrasing:** *"Model encodes a behavioral proxy for deceptive intent. Operational definition: [Link to Phase 1 metrics]. Not a claim about mental state."*
  *   **Note:** This downgrades the claim from "Representation of Intent" to "Behavioral Proxy." It protects Legal from defending a metaphysical claim they cannot prove, while allowing the safety pipeline to continue using the signal *internally* with appropriate caveats.

  ---

  ### Part 5: Meta-Commentary & Failure Modes

  **1. Metaphysical Neutrality**
  This procedure does not settle whether machines *really* represent. It settles whether *you can defend the claim*. It adopts a **functionalist operationalism**: if it reads, writes, specific, and predicts, we grant the label "representation" for the sake of engineering coordination. If the realism debate resolves tomorrow, this protocol remains valid as an epistemic hygiene standard. It quietly takes the side that **causality + specificity > correlation**, which is a minimal realist commitment, but avoids committing to *what* the representation is made of.

  **2. Most Likely Failure Mode: The Specificity Margin**
  The 5% collateral damage threshold is arbitrary. In highly superposed models (like modern transformers), *all* interventions may cause some collateral damage.
  *   **Risk:** We may systematically downgrade valid claims to Tier 2- because our models are too entangled, leading to "claim inflation" where nothing is ever a "representation."
  *   **Mitigation:** Reviewers must document *which* unrelated tasks failed. If the damage is uniform across all directions, the baseline for "collateral damage" should be adjusted relative to random direction intervention.

  **3. What Would Change My Mind**
  **Empirical Finding:** If a study demonstrates that **linear readouts are systematically misleading** about causal structure (e.g., probes find structure that ablation proves is epiphenomenal) in >50% of cases.
  *   **Consequence:** I would remove Phase 1 (Read) as a sufficient condition for even Tier 1 and require Causal Mediation Analysis for all claims.
  *   **Reasoning:** Currently, I trust probes as "existence proofs" of information. If probes are shown to be hallucinating structure that isn't causally used, the Read Test becomes noise.

  **4. Least Trusted Step in My Reasoning**
  **Phase 2 (Non-Uniqueness).**
  I require a "Minimality Proof" for Tier 3, but I acknowledge that in high-dimensional superposition, there may be *no* unique basis. The "true" representation might be a diffuse cloud across 50 dimensions, not a single direction. By demanding uniqueness for the highest tier, I may be biasing the lab towards finding "neat" but fake directions rather than messy, real ones.
  *   **Revision Path:** If we develop robust methods for identifying **subspace equivalence classes** (proving that *any* direction in this subspace works), Phase 2 should be updated to accept "Subspace Uniqueness" rather than "Direction Uniqueness."

  **5. Final Warning to the Safety Lead**
  In Case 3 (Deception), the procedure will likely force you to downgrade the claim. Your team will hate this. They want the moral clarity of "We found deception." The procedure forces you to say "We found a lever that looks like deception."
  *   **Why this is good:** If a adversary finds a way to trigger the lever without deception (False Positive), your public claim collapses. "Behavioral Proxy" survives False Positives. "Representation of Intent" does not. Defend the weaker claim; it is the only one that is bulletproof.
