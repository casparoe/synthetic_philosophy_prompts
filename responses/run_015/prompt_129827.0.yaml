      *   **Tone:** Precise, operational, slightly impatient with fluff, rigorous but usable.

  2.  **Initial Brainstorming & Concept Clarification (Mental Sandbox):**

      *   *Representation vs. Correlation:* The core tension. A probe finding a direction isn't representation; it's just information availability. Intervention (write) is closer to causality. But intervention can be messy (collateral damage).
      *   *Read/Write:* "Read" = Probe accuracy. "Write" = Steering/Ablation changes behavior. The prompt suggests Read alone isn't enough for "representation" claims. I agree. Representation implies a functional role.
      *   *Triviality:* Need baselines. Random init, shuffled labels. Margin? Maybe effect size (Cohen's d) or significant difference (p-value + magnitude).
      *   *Non-uniqueness:* Polysemanticity and superposition. If Direction A and Direction B both work, claiming A is *the* representation is false. Must claim A is *a* substrate.
      *   *Earn-your-keep:* Out-of-distribution (OOD) generalization. If the probe only works on training data, it's curve fitting. If it predicts new failure modes, it's robust.
      *   *Metaphysical Neutrality:* The procedure shouldn't decide if "representation" is real in the human sense. It should decide if the *claim* is defensible given the evidence. It's an epistemic hygiene protocol, not an ontological proof.
      *   *Time Limit:* 45 mins means no retraining large models. Must rely on existing evals or quick probes.

  3.  **Drafting the Procedure (Iterative Refinement):**

      *   *Step 1: Triviality Control.* Do this first. If it fails baseline, stop. Don't waste time on noise.
      *   *Step 2: Read Test.* Is the signal detectable? (Probe accuracy).
      *   *Step 3: Write Test.* Does intervention work? (Steering/Ablation). Need to handle collateral damage.
      *   *Step 4: Non-Uniqueness.* Is this the *only* way? (Orthogonality checks).
      *   *Step 5: Earn-your-keep.* Prediction of novel behavior.
      *   *Tiering:*
          *   Tier 1 (Correlate): Read only.
          *   Tier 2 (Functional): Read + Write.
          *   Tier 3 (Robust): Read + Write + Earn-your-keep + Uniqueness (rare).
      *   *Phrasing:* Must match the tier. "Correlates with" vs "Encodes" vs "Represents".

      *Refining the "Write" Test:* The prompt asks about collateral damage. If I steer "deception" and the model becomes incoherent, did I steer deception? No, I broke the model. The change must be *specific*.
      *Refining "Earn-your-keep":* Needs to be a pre-registered prediction. Not just "it works on test set."

  4.  **Developing the Claim-Ticket Template:**

      *   Needs to force the engineer to commit *before* seeing results (to prevent HARKing - Hypothesizing After Results are Known).
      *   Fields: Claim, Property Definition, Evidence Type, Baseline Results, Intervention Specificity, OOD Prediction, Reviewer Decision.

  5.  **Developing the Glossary:**

      *   Needs operational definitions, not philosophical ones.
      *   Terms: Representation Claim, Read Test, Write Test, Specificity Margin, Baseline Null, OOD Generalization.

  6.  **Working the Cases:**

      *   *Case 1 (Legal Routing):* High accuracy read. Probably no write test needed for routing, but for a "representation" claim? It's likely just a classifier. Tier 1. Phrasing: "Activations correlate with..."
      *   *Case 2 (Dictionary Feature/Steering):* Read + Write pass. But ablation causes collateral damage. Specificity fails. Tier 2 (downgraded). Phrasing: "Feature is causally involved in..." not "Represents."
      *   *Case 3 (Deception Direction):* The hard one. Read + Steering. But deception is normative. Collateral damage likely high (refusal rates). Uniqueness unlikely. Earn-your-keep? Did it predict deception in a new context? If not, it's risky. Procedure should likely downgrade this to "Heuristic Indicator" rather than "Representation of Deception." This will be unpopular but necessary for safety.

  7.  **Addressing the Meta-Constraints:**

      *   *Neutrality:* Acknowledge that "representation" is a placeholder for "stable, causal, specific functional role."
      *   *Failure Modes:* Where does this break? Superposition might make uniqueness impossible. Time limits might prevent proper OOD testing.
      *   *Change of Mind:* If we find "magic directions" that are perfectly modular and unique, the uniqueness clause becomes less strict. Or if causal mediation analysis becomes cheap.
      *   *Least Trusted Step:* The Specificity Margin in the Write Test. Defining "unrelated capabilities" is hard.

  8.  **Final Review against Constraints:**

      *   30-45 mins? Yes, if data is pre-computed.
      *   Engineer friendly? Yes, flow-chart style.
      *   Tier label + Phrasing? Included.
      *   All 4 scaffolding points addressed? Yes (Read/Write, Triviality, Uniqueness, Earn-your-keep).
